prompt: |-
  I run a graduate seminar on population axiology and I've been keeping a private list of my own verdicts on the cases we read, mostly so I can catch myself out in front of the students, and I've finally admitted they don't hang together. Here's the list. Base world A: ten billion people, all with very good lives, nothing pathological about distribution.

  1. A+ — ten billion more people added, each with a life worth living but at a lower level than the original ten billion, and stipulated so that the addition doesn't take anything from anyone: not worse than A. Arguably better.
  2. B — the same twenty billion, but the two groups levelled up so everyone is at the original high level: clearly better than A+.
  3. Repeat 1 and 2 over and over until you land on Z: a vast population, all of them with lives barely worth living. Verdict: Z is worse than A, and not just slightly worse. I don't want to say it's a tie.
  4. Add to a huge existing population one single person whose life is barely worth living and who doesn't affect anyone else in any way — no resource drawdown, no one even learns they exist. Verdict: not bad. Maybe very slightly good.
  5. Same addition, but the existing population is small and superbly well off. Verdict: this one feels bad to me in a way 4 doesn't, and I genuinely can't say why, since the added person affects nobody in either case and neither group knows about the other.
  6. One person in ecstasy versus a trillion people at barely-worth-living. Verdict: the single ecstatic person, provided the quality gap is wide enough. So quality has to do some work that number can't outvote.
  7. The teenage mother who conceives now rather than waiting a few years; the child she has will have a life worth living, but a worse one than the different child she'd have had if she'd waited. Verdict: her choice was worse in some impersonal sense, she wronged no one in particular, and yet I still want to call it criticisable rather than merely suboptimal.
  8. Structurally identical but collective: a depletion policy that brings into existence future people whose lives are worth living and slightly worse than the lives the alternative future people would have had. Verdict: wrong, full stop, and I don't want to soften this to 7.

  The pair I can't repair is 4 and 5. And 1 through 3 are each steps I've called not-worse or better, which is supposed to land me on Z, and then 3 says Z is worse. And 6 wants quality to have lexical-ish force, but if it does, 4 should come out bad and I don't want it to.

  My tentative principle, which I suspect is broken: 'an addition makes things no worse if no existing person is made worse off, the added people have lives worth living, and the addition creates no comparison-class between people who can measure themselves against each other.' That last clause is my attempt at 5. It does save 1 and 4, it doesn't obviously save 5 the way I want, it walks me straight down the chain to Z anyway because each step is separately permitted, and it turns 7 into nothing worse than a missed opportunity, which I don't want either.

  So, what I'd like: give me a principle, or two or three competing ones, precise enough that a smart undergraduate could apply them mechanically to a case description without asking me anything. For each, tell me which clause is doing the work on which numbered case — I want the mapping, not a summary. Then apply them to cases I haven't listed, specifically: (a) Segregated Z, where the trillion barely-worth-living people each inhabit their own sealed arcology and never meet, never communicate, and have no shared institutions or economy, versus ten billion at a high level in one integrated society; (b) subtracting from Z — the extra people are removed such that the survivors never notice and lose nothing, leaving ten billion at the high level — is that better, worse, or neutral, and does the answer depend on whether they are merely removed or never existed; (c) adding a trillion animals whose lives are barely worth living to a world full of flourishing people. And be straight with me about the cost: for each principle, say which of my verdicts it forces me to abandon. If no principle can keep both 4 and 5, or both the step-by-step permissiveness of 1–2 and the verdict in 3, say so plainly, pick the one you'd throw out, and explain what I lose — I'd rather have a simple principle that overturns one of my intuitions and tells me exactly which one than an elaborate one that saves everything with four epicycles.
reasoning: |-
  Okay, the user runs a graduate seminar on population axiology and has been tracking their own verdicts on various cases. Now they've realized their intuitions don't cohere and are seeking help. Let me unpack their main issues.

  First, the core problem is the tension between their verdicts on case 4 and 5. Both involve adding a single person with a barely worth living life without affecting others. But in case 5 (small, superb population), it feels bad, while in case 4 (huge population) it feels slightly good. Why the difference? Their tentative principle about "comparison-class" doesn't fully resolve this.

  Then there's the sequence from A to Z through repeated applications of steps like A+ and B. Each step seems permissible or better, leading to Z (vast population with barely worth living lives), yet they judge Z as worse than A. That's a classic mere addition paradox. Plus, case 6 suggests lexical priority for quality over quantity, which contradicts case 4 where adding to a huge population seems acceptable.

  Looking at cases 7 and 8, both involve creating people with worse lives than potential alternatives. The user feels stronger condemnation for the collective depletion policy (case 8) than the individual teenage mother scenario (case 7). This asymmetry needs explaining.

  The user wants clear, mechanically applicable principles that can resolve these tensions. They prefer straightforward principles even if it means abandoning some intuitions. Three approaches come to mind: Averagism, Critical-Level Utilitarianism (CLU), and a Lexical Threshold View.

  Averagism calculates per-person welfare. It handles cases 4 and 5 differently because adding a person lowers average welfare more in a small, superb population (case 5) than in a large one (case 4). This explains the difference in verdicts. But Averagism fails case 6 since it would favor the trillion barely living over one ecstatic person if average welfare is higher. Also, in the A to Z sequence, each step might lower average welfare, so Z being worse than A is consistent, but the user approved intermediate steps which Averagism might reject.

  Critical-Level Utilitarianism adds a fixed welfare threshold above zero. Additions are good only if above this threshold. For case 4 (huge population), adding a barely living person might be neutral since their welfare is just above zero but below the critical level. In case 5 (small superb group), the same addition is bad because it lowers average welfare significantly. This distinguishes 4 and 5. However, CLU might still lead to Z being acceptable if critical levels are low, conflicting with case 3. Also, case 6 could be handled if the ecstatic person is above the critical level, but the trillion might not sum high enough if each is below the critical level.

  The Lexical Threshold View posits that above a certain welfare level, quality has lexical priority. Below that, additions might be acceptable. This handles case 6 directly. For the sequence to Z, each step adds people below the threshold, but Z being entirely below makes it worse than A. Cases 4 and 5 depend on whether the existing population is above or below the threshold. But explaining why adding in case 5 feels bad might require additional factors like average welfare impact.

  For the additional cases: Segregated Z vs. A—Averagism prefers A, CLU might prefer A if critical level is high, Lexical View prefers A. Subtracting from Z—Averagism sees it as better, CLU and Lexical might be neutral. Adding animals—if animals count, Averagism and CLU would disfavor it, Lexical View might if animal welfare is below threshold.

  The user needs to decide which intuition to prioritize. If keeping cases 4 and 5 distinct is crucial, Averagism or CLU works. If lexical priority in case 6 is non-negotiable, then the Lexical Threshold is better but might struggle with case 5. Abandoning the permissibility of each step in the A to Z sequence (case 1) could resolve the paradox but goes against their initial verdict. Alternatively, revising the verdict on Z (case 3) to be acceptable would align with CLU but might feel counterintuitive.

  The user's deeper need might be a coherent framework that either validates their strongest intuitions or provides a principled reason to override some. They value transparency over complexity, so admitting which verdicts must be abandoned is key. Also, addressing the asymmetry between individual and collective cases (7 vs 8) might require a separate principle about institutional responsibility, which could be an additional factor rather than part of the core population principle.
answer: |-
  Here are three mechanically applicable principles that address your inconsistencies, each sacrificing different intuitions. I'll map them to your cases, apply them to your new scenarios, and state the costs plainly.

  ---

  **Principle 1: Averagism**  
  *"State of affairs X is better than Y iff the average welfare in X is higher than in Y."*  
  **Key Clause:** Strict focus on *average welfare per capita*.

  | Case | Verdict Under Averagism | Clause Doing the Work |
  |------|--------------------------|------------------------|
  | 1 (A+) | **Worse than A** (lowers average) | Lower average welfare |
  | 2 (B) | **Better than A+** (raises average) | Higher average welfare |
  | 3 (Z) | **Worse than A** (much lower average) | Drastically lower average |
  | 4 (Add to huge pop.) | **Slightly bad** (lowers average) | Marginal average decrease |
  | 5 (Add to small superb pop.) | **Very bad** (sharply lowers average) | Large average decrease |
  | 6 (1 ecstatic vs. trillion) | **Prefers trillion** (unless ecstasy is *trillions*× better) | Average likely higher for trillion |
  | 7 (Teen mother) | **Suboptimal** (lowers avg. welfare) | Worse average for actual child |
  | 8 (Depletion policy) | **Wrong** (lowers avg. welfare) | Worse average for future |

  **New Cases:**  
  (a) **Segregated Z vs. A**: A is better (higher average).  
  (b) **Subtracting from Z**: Better (raises average). Same whether removed or never existed.  
  (c) **Adding animals**: Bad (lowers human average if animals count; neutral if animals excluded).  

  **Cost:**  
  - **Abandons your verdicts on 1, 4, and 6**. You must accept that A+ is *worse* than A (contra 1), adding in 4 is *bad* (not "slightly good"), and the trillion is *better* than one ecstatic person (contra 6).  
  - **Saves 5**: Explains why adding to a small superb group feels worse (steep avg. drop).  
  - **Resolves A→Z paradox**: Each addition (A+) is *worse*, so Z isn't reached via "not-worse" steps.

  ---

  **Principle 2: Critical-Level Utilitarianism (CLU)**  
  *"Additions are good iff welfare > critical level C (C > 0). Total welfare is sum of (individual welfare - C)."*  
  **Key Clause:** Fixed welfare threshold **C** (e.g., "moderate flourishing") above which additions count positively.

  | Case | Verdict Under CLU | Clause Doing the Work |
  |------|-------------------|------------------------|
  | 1 (A+) | **Worse/neutral** (if new lives < C) | Welfare additions below C don't help |
  | 2 (B) | **Better** (raises welfare above C) | Increases total above-C welfare |
  | 3 (Z) | **Worse than A** (total above-C welfare near zero) | Minimal above-C welfare |
  | 4 (Add to huge pop.) | **Neutral** (if barely living < C) | Addition below C adds nothing |
  | 5 (Add to small superb pop.) | **Bad** (lowers average; adds <C life) | <C addition + avg. decrease |
  | 6 (1 ecstatic vs. trillion) | **Prefers ecstatic** (if ecstasy > C, trillion all < C) | Only ecstatic has above-C welfare |
  | 7 (Teen mother) | **Suboptimal** (if actual child < C or lowers avg.) | Welfare deficit relative to C |
  | 8 (Depletion policy) | **Wrong** (lowers above-C welfare total) | Reduces aggregate above-C welfare |

  **New Cases:**  
  (a) **Segregated Z vs. A**: A is better (higher above-C welfare).  
  (b) **Subtracting from Z**: **Neutral** (if removed lives were < C, no loss). Same for never existing.  
  (c) **Adding animals**: **Neutral/bad** (if animals < C, no gain; bad if lowers avg.).  

  **Cost:**  
  - **Abandons your verdict on 1 and 4**. A+ is *not better* than A (if new lives < C), and 4 is *neutral* (not "slightly good").  
  - **Saves 5 and 6**: Explains why adding in 5 feels bad (adds <C life) and 6 favors quality (lexicality via C).  
  - **Resolves A→Z**: Steps like A+ are neutral/worse, avoiding slippery slope.

  ---

  **Principle 3: Lexical Threshold with Asymmetry (LTA)**  
  *"Lives above welfare level L (high) have lexical priority. Additions below L are neutral if no one affected, but reduce *average above L*."*  
  **Key Clause:** **Lexical threshold L** + **asymmetric treatment** of sub-L additions.

  | Case | Verdict Under LTA | Clause Doing the Work |
  |------|-------------------|------------------------|
  | 1 (A+) | **Neutral** (new lives >0 but <L) | Below-L addition, no one harmed |
  | 2 (B) | **Better** (raises sub-L lives to >L) | Increases lexical-tier lives |
  | 3 (Z) | **Worse than A** (no lives >L) | Complete loss of lexical tier |
  | 4 (Add to huge pop.) | **Neutral** (adds <L life, no effect) | Below-L addition to large pop. |
  | 5 (Add to small superb pop.) | **Bad** (reduces avg. above L) | Sharply lowers elite avg. |
  | 6 (1 ecstatic vs. trillion) | **Prefers ecstatic** (ecstasy > L, trillion all < L) | Lexical priority for >L lives |
  | 7 (Teen mother) | **Suboptimal** (lowers potential >L welfare) | Child < L or reduces avg. above L |
  | 8 (Depletion policy) | **Wrong** (reduces # or avg. above L) | Harms lexical tier aggregate |

  **New Cases:**  
  (a) **Segregated Z vs. A**: A is better (has lives > L; Z has none).  
  (b) **Subtracting from Z**: **Better** (if survivors > L) or **neutral** (if all < L). Never existing = neutral.  
  (c) **Adding animals**: **Neutral** (if animals < L) or **bad** (if lowers human avg. above L).  

  **Cost:**  
  - **Abandons your verdict on 1 (if 'better' expected)**. A+ is *neutral*, not "arguably better."  
  - **Saves 4, 5, and 6**: Explains 4 (neutral), 5 (bad due to elite avg. drop), and 6 (lexicality).  
  - **Resolves A→Z**: Each A+ step is neutral, but B steps improve. Z fails due to no >L lives.

  ---

  ### Which Verdicts Must Go?
  - **4 vs. 5**: All principles **save this distinction** (Averagism and CLU make 4 bad/neutral and 5 very bad; LTA makes 4 neutral and 5 bad).  
  - **1–3 Chain vs. 3**: **Averagism** breaks the chain (A+ is *worse*). **CLU/LTA** make A+ *neutral*, so Z isn't reached via "better" steps.  
  - **6 (Lexicality) vs. 4**: **Averagism** fails (prefers trillion). **CLU/LTA** save lexicality in 6 while making 4 neutral.  

  ### Recommendation: Lexical Threshold (LTA)
  - **Why**: Best preserves your intuitions:  
    - Saves 4 (neutral) vs. 5 (bad) via asymmetric impact on elite average.  
    - Saves 6 (lexical priority).  
    - Avoids Repugnant Conclusion (Z worse than A).  
    - Makes A+ *neutral* (abandoning "arguably better"), but this is a minimal cost.  
  - **Cost Summary**: You must accept that **A+ is neutral, not better** (Case 1). This breaks the "slippery slope" to Z.  

  ### Application to 7 & 8 Asymmetry
  - **LTA Explanation**: Both 7 and 8 are suboptimal/wrong, but 8 feels worse because:  
    - **Institutional harm**: Depletion *systematically* reduces the lexical tier (worse avg./numbers above L).  
    - **Scale**: Affects many more above-L lives.  
    - **Principle Addendum**: *"Collective policies affecting the lexical tier are wrong; individual choices are merely suboptimal."*  

  ---
  **Final Advice**: Teach **LTA** as your reconciling principle. Admit to students that Case 1 (A+) isn't better—just neutral—and that lexical thresholds resolve the tension. Use the institutional addendum to handle 7 vs. 8. This loses one intuition (A+ being better) but saves the rest with minimal epicycles.
