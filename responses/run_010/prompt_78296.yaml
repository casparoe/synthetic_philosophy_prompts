prompt: |-
  Okay so I co-run a small ethics workshop at a professional school — mostly law and philosophy people, plus two of us who write disclosure rules for a living. For two years the group has had the same fight and nobody has budged. It's about whether lying is worse than deliberately misleading someone with statements that are literally true.

  One side — call her the distinctivist — holds that lying is worse *in kind*, not just in degree. Her line is that when you assert something you believe to be false you've conscripted the practice of assertion itself into your deception; you're the one who manufactured the false belief. The misleader, by contrast, says something true and then lets the other person do the inferential work, which is a different relation to the hearer's mistake even when the outcome is identical. The other side — the parity guy — thinks there's no difference in kind whatsoever: same knowledge, same intention, same false belief in the same head. He thinks whatever gap remains is entirely about degree, tracking how much harm results, how hard the false belief is to detect, and how much work the hearer would have had to do to check. He treats the said/implicated boundary as a technicality that does no moral work.

  They've finally agreed to sit down and produce a joint statement, and I've been asked to draft a strawman version in advance that they can both redline. That's what I need from you. Write the document itself, not advice about how to write it.

  Here's what it has to contain:

  **1. A numbered section of claims both can sign.** Not filler — I want the claims that are doing real work and that each side would genuinely accept without wincing: about what a lie is, about what's *not* in dispute (e.g. whether deception can ever be permissible, whether consequences matter to all-things-considered wrongness), about the descriptive layer vs. the normative layer, and about contexts. Where one of them can only sign a claim with a qualification, put the qualification in the claim rather than hiding it.

  **2. A disagreements table.** One row per live disagreement, with a neutral label, then a column giving the distinctivist's own formulation of her position in words she'd accept, then the same for the parity theorist, then a final column classifying the row as substantive, merely verbal, or a case of the two of them answering different questions under one heading. I want you to be aggressive about that last column — my suspicion is that a big chunk of this fight is over the word "lie" and over "what is said," and that they've been scoring points on definitions while thinking they were arguing about morality. Say which parts, and say why.

  **3. A case battery, adjudicated row by row by both sides.** For each of the following, each side gives a wrongness rating from 0 to 10 and one sentence of justification. I want the table to expose where their scores diverge and, just as importantly, where they unexpectedly converge:

  - (a) Buyer: "Has this car ever been in an accident?" Seller knows the body was damaged by a falling branch and repainted. Lie version: "Never been in an accident." True version: "It's never been in a collision."
  - (b) Same misleading content, but in one version it's in a recorded email the buyer can later check, and in the other it's spoken at a party where no record exists.
  - (c) A nosy neighbor asks "Are you seeing anyone?" Truth version: "I've been really focused on work lately." Lie version: "No." In both, the neighbor has no right to the answer and is already half-committed to a guess.
  - (d) A regulated disclosure states "the company is not currently under investigation," which is literally true on the agency's own definition, while the company knows a regulator has opened an informal inquiry. Compare with "no regulator has ever contacted us," which is false.
  - (e) Saying something literally true that fills a silence, versus saying nothing at all when the hearer would have asked if they'd known to.
  - (f) Telling a six-year-old "Mommy's at work" when she's actually in the hospital — literally true, predictably misheard by someone who cannot do the inferential work.
  - (g) The same true-but-misleading utterance made to a hearer who is *hoping* for the false belief and will not check, versus a hearer who is actively trying to get at the truth.

  **4. The cruxes.** Four to six sub-questions such that settling one would actually move at least one of them. My guesses, which you're free to reject: whether the wrong of lying has anything specifically to do with the norm of assertion; whether the hearer's contribution to their own false belief shifts responsibility or just shifts the causal pathway; whether the said/implicated line is determinate enough in messy real cases to bear any moral weight at all; and whether the distinctivist's account is really about ordinary conversation while the parity theorist's is really about regulated institutional contexts — which would mean they've never been answering the same question. For each crux, give me a case, argument, or piece of evidence that *both* would accept as bearing on it, and then write down each side's prediction about how that would come out, before the fact. Where one side would refuse to count some kind of evidence as bearing on the crux at all, say so — that refusal is itself informative and belongs in the document.

  On the determinacy point specifically, they should both engage with the fact that the law operates the distinction constantly. In *Bronston v. United States* (1973) a witness asked at a bankruptcy hearing whether he'd ever had a Swiss bank account answered, "The company had an account there for about six months, in Zurich," which was literally true and concealed a personal account he'd held for years. The Court held the perjury statute doesn't reach an unresponsive but literally true answer even where the witness intends to mislead, on the reasoning that it's the questioner's burden to frame his questions acutely. I want the joint statement to record what each side makes of that: the distinctivist presumably thinks the Court got the moral allocation backwards, and the parity guy presumably thinks the Court was tracking something real about how epistemic labor gets divided. Does either of them think that legal reasoning has moral force, or is it just a rule about the costs of prosecuting speech?

  **5. An empirical crux, handled carefully.** Both should agree in advance what a well-designed study of ordinary people's wrongness judgments would show if either of them is right — lie vs. literally-true misleader, consequences and detection risk held as constant as the design can manage them. Write each side's prediction down. Then note the obvious objection each will raise to the other's reading of such data: that folk judgments are just tracking the definition of the word, versus that they're tracking moral weight, versus that people are reacting to paradigm associations rather than to the case as stipulated.

  **6. Self-falsification.** For each side: name one concrete case, not a hypothetical-in-principle, that they'd accept as decisive against their own view. If one of them can't name any, that needs to be stated plainly in the document as a finding rather than papered over.

  **7. A short closing section on what would actually move this.** Given everything above, is there anything — a distinction, a result, a change of question — that would break the deadlock, or should the group expect to keep arguing about this forever? Give an honest answer with reasons, not a hopeful one.

  A few ground rules. No bibliography, no reading list, no citations or name-dropping of who said what in the literature — I don't want either side hiding behind authorities, and I don't want you guessing at sources. If you think a well-known argument from the literature is relevant, state it in your own words and attribute it to the position, not the person. Don't quote anyone. Don't survey the territory before getting to the document — I've told you the two positions, so start drafting. Keep each side's formulations charitable in the strong sense: the distinctivist should be able to read her own row and say "yes, that's exactly my view," and likewise for the parity theorist, and neither should sound like a strawman written by the other. Where you think one side is actually right, that's fine, but the document itself stays joint — put your own view in a bracketed drafter's note at the very end if you must.

  Write it in American English. Markdown, with the table in item 2 and the ratings in item 3 as actual tables. Long enough to be usable — call it 2,000 to 3,000 words — but cut anything that's just throat-clearing. One more thing: I'm seperate-ly going to hand this to the two of them cold, so please don't hedge it into mush. A joint statement with no content is worse than no statement at all, because they'll both sign it and then keep fighting.
reasoning: |-
  We are drafting a joint statement for two opposing views in an ethics workshop. The two sides are:
  - Distinctivist: Believes lying is worse in kind because it involves asserting a false belief, thereby conscripting the practice of assertion into deception. The liar manufactures the false belief, while the misleader says something true and lets the hearer draw the false inference.
  - Parity Theorist: Believes there is no difference in kind between lying and deliberately misleading with true statements. The wrongness depends on the same factors: the intention to deceive, the resulting false belief, and the harm caused. The said/implicated boundary is a technicality with no moral weight.

  The document must include:
  1. A numbered section of claims both can sign, with qualifications if needed.
  2. A disagreements table with one row per live disagreement, columns for each side's formulation, and classification (substantive, verbal, or different questions).
  3. A case battery with wrongness ratings (0-10) and justifications for each case, showing divergences and convergences.
  4. The cruxes: 4-6 sub-questions that could move the debate, with each side's prediction and a case/argument/evidence both accept as bearing on it.
  5. An empirical crux: each side's prediction of what a study of ordinary people's wrongness judgments would show, and each side's objection to the other's reading of the data.
  6. Self-falsification: one concrete case each side would accept as decisive against their own view, or a statement that they cannot name any.
  7. A closing section on what would break the deadlock or if it will continue.

  Ground rules: No citations, no bibliography, use American English, markdown with tables for items 2 and 3. Keep it 2000-3000 words. Be direct and avoid mush.

  We start drafting the document.

  ---

  **Joint Statement on the Ethics of Lying vs. Deliberate Misleading**

  **Prepared for the Ethics Workshop**

  **1. Points of Agreement**

  Both parties agree on the following claims, which form the foundation for further discussion. Qualifications necessary for one party to endorse a claim are included within the claim itself.

  1.1. **Definition of Lying**: For the purposes of this discussion, a lie is an assertion made with the belief that the statement is false, with the intention to deceive the hearer. Both agree that this definition captures the core of lying, though they may disagree on the moral significance of this act compared to other forms of deception.

  1.2. **Deception Can Be Permissible**: Both agree that deception (whether by lying or by deliberate misleading) is not always wrong. It can be justified in certain contexts, such as to prevent harm, protect privacy, or in other extenuating circumstances. The permissibility depends on the consequences, the rights of the parties involved, and the specific context.

  1.3. **Consequences Matter for All-Things-Considered Wrongness**: The overall wrongness of an act of deception (whether by lying or by misleading) depends in part on the consequences of that act, including the harm caused to the deceived party and any broader societal effects. However, the parties disagree on whether consequences are the only factors that matter or whether the manner of deception (lying vs. misleading) adds independent moral weight.

  1.4. **The Role of Intention**: Both agree that the intention to deceive is a necessary component for the act to be morally problematic in the cases under discussion. Without such intention, a false belief may result from negligence or accident, which raises different moral concerns.

  1.5. **Descriptive vs. Normative Layers**: There is agreement that the descriptive facts about what was said (the literal content) and what was implicated (the implied content) can be distinguished in principle. However, they disagree on whether this distinction has inherent moral significance or whether it is merely a descriptive feature that may correlate with other factors (like the hearer's effort or the context) that affect the degree of wrongness.

  1.6. **Context Matters**: The wrongness of deception depends on the context, including the relationship between the speaker and hearer, the speaker's obligations (e.g., in professional roles), the hearer's expectations, and the stakes involved. Both agree that the same utterance (whether a lie or a misleading truth) may be more or less wrong in different contexts.

  1.7. **The Hearer's Role**: Both acknowledge that the hearer's cognitive abilities, background knowledge, and vigilance can affect the likelihood that a false belief is formed. However, they disagree on whether and how this affects the speaker's moral responsibility.

  **2. Disagreements Table**

  The following table outlines the key disagreements between the distinctivist and the parity theorist. Each row presents a neutral label for the disagreement, then each side's formulation of their position, and finally a classification of the disagreement as substantive (touching on fundamental moral principles), merely verbal (arising from different definitions or word usage), or a case of the parties answering different questions under the same heading.

  | Neutral Label                     | Distinctivist's Position (in their own words)                                                                 | Parity Theorist's Position (in their own words)                                                                 | Classification       | Reason for Classification |
  |-----------------------------------|---------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------|----------------------|---------------------------|
  | Moral Difference in Kind          | Lying is worse in kind because it involves a direct violation of the norm of assertion by asserting what one believes false, thereby creating the false belief through the act of assertion itself. Misleading with truth does not violate the norm of assertion and relies on the hearer's own inferences. | There is no moral difference in kind between lying and misleading with truth. Both involve the same intention to deceive and result in the same false belief. The difference is one of degree, depending on factors like harm, detectability, and the hearer's required effort. | Substantive          | The disagreement concerns whether the act of asserting a falsehood has intrinsic moral significance beyond the shared elements of intention and outcome. |
  | Responsibility for False Belief   | In lying, the speaker bears full responsibility for the false belief because they manufactured it. In misleading, the speaker shares responsibility with the hearer, who contributed by drawing the inference. | The speaker bears the same responsibility for the false belief in both cases because they intentionally caused it. The hearer's contribution may affect the causal pathway but does not diminish the speaker's responsibility. | Substantive          | The parties disagree on how the causal mechanism (direct assertion vs. inference) affects moral responsibility. |
  | Determinacy of Said/Implicated    | The boundary between what is said (literal content) and what is implicated (implied content) is sufficiently clear in most cases to bear moral weight. The speaker controls what is said and is responsible for it, while implications are co-constructed. | The said/implicated boundary is often indeterminate in real cases and is a technical distinction without moral weight. What matters is the total communicative effect and the speaker's intent. | Different Questions | The distinctivist focuses on the speaker's act of assertion as a distinct moral category, while the parity theorist focuses on the overall effect. Additionally, the parity theorist questions the feasibility of applying the distinction in practice. |
  | Role of the Norm of Assertion    | The wrong of lying is specifically tied to the violation of the norm of assertion (e.g., that one should assert only what one believes true). Misleading does not violate this norm because the speaker asserts something true. | The norm of assertion is not central to the moral wrongness of deception. The wrongness arises from the intention to deceive and the harm caused, regardless of whether the norm of assertion is violated. | Substantive          | The distinctivist sees the norm of assertion as a foundational social practice, while the parity theorist sees it as irrelevant to the core moral issue. |
  | Contextual Variation in Wrongness | While both lying and misleading can be wrong, lying is always pro tanto worse in a given context because of its directness. The gap may narrow in cases where the misleading requires minimal inference or is highly manipulative. | The wrongness gap between lying and misleading varies by context and can be zero in some cases (e.g., when the misleading is as effective and harmful as a lie). There is no constant pro tanto difference. | Substantive          | The distinctivist holds that lying has an inherent additional wrongness, while the parity theorist denies any inherent difference. |

  **3. Case Battery**

  For each case, both sides provide a wrongness rating (0-10, where 0 is not wrong at all and 10 is maximally wrong) and a one-sentence justification. The table highlights divergences and convergences.

  | Case | Scenario Description | Distinctivist Rating & Justification | Parity Theorist Rating & Justification |
  |------|----------------------|--------------------------------------|----------------------------------------|
  | (a)  | **Car sale:** Buyer asks if the car has been in an accident. Seller lies: "Never been in an accident." (Lie) vs. says truth: "It's never been in a collision." (Mislead) | 8: Lying directly violates the norm of assertion and creates a false belief. | 8: Same intention to deceive and same false belief; the literal truth is a technicality without moral weight. |
  | (a)  | Same as above, but the seller uses the true misleading statement. | 6: Misleading is less direct and requires the buyer's inference, but still intentionally deceptive. | 8: Same as lying because the intention and result are identical. |
  | (b)  | **Recorded vs. spoken:** Same misleading content, but one in a recorded email (checkable) and one spoken at a party (no record). | 5 for recorded, 7 for spoken: The recorded version allows for correction, reducing the harm and the speaker's responsibility for persistence. | 6 for recorded, 7 for spoken: The difference is due to the increased chance of detection and harm in the unrecorded case, not the manner of deception. |
  | (c)  | **Nosy neighbor:** "Are you seeing anyone?" Truth version: "I've been really focused on work lately." (Mislead) vs. lie: "No." (Lie). Neighbor has no right to the answer and is half-committed to a guess. | Lie: 2 (minimal wrong because of context); Mislead: 1 (even less direct). | Lie: 2; Mislead: 2 (same intention and effect; context reduces wrongness equally for both). |
  | (d)  | **Regulated disclosure:** "The company is not currently under investigation" (true on agency definition but misleading as an informal inquiry exists) vs. "No regulator has ever contacted us" (false). | True misleading: 6 (exploiting a technicality but not lying); False: 8 (clear lie). | True misleading: 7; False: 7 (both are equally deceptive in intent and effect, given the context). |
  | (e)  | **Filling silence:** Saying something literally true that fills a silence (e.g., "Everything is fine") vs. saying nothing when the hearer would have asked if they knew to. | 4 for speaking (misleading by truth); 3 for silence (deception by omission is less direct). | 5 for speaking (active deception); 2 for silence (passive; less intentional and possibly less harmful). |
  | (f)  | **Child's misunderstanding:** Telling a six-year-old "Mommy's at work" (true but misheard as not in hospital) when she's actually in the hospital. | 3: The statement is true and the child's inability to infer is not the speaker's fault, but there is an intention to mislead. | 4: The speaker intends to create a false belief and succeeds, so it is deceptive, though the child's vulnerability increases harm. |
  | (g)  | **Hearer's disposition:** Same true-but-misleading utterance to a hearer who is hoping for the false belief and won't check vs. one actively trying to get at the truth. | Hopeful hearer: 5 (less wrong because they contribute to their own deception); Active truth-seeker: 7 (more wrong because they are trying to avoid deception). | Hopeful hearer: 6; Active truth-seeker: 7 (the difference is due to the harm and the speaker's exploitation of the hearer's state, not the manner of deception). |

  **4. The Cruxes**

  The following sub-questions, if settled, would move the debate. For each, we provide a case, argument, or piece of evidence that both sides accept as bearing on the crux, and each side's prediction about the outcome.

  4.1. **Does the wrong of lying have anything specifically to do with the norm of assertion?**  
     - **Evidence both accept**: The practice of assertion in human communication: people rely on assertions being truthful for the system to function.  
     - **Distinctivist's prediction**: If we examine cases where the norm of assertion is suspended (e.g., in fiction or games), lying in those contexts loses its distinctive wrongness, showing that the norm is central.  
     - **Parity theorist's prediction**: Even in contexts without a strong norm of assertion, deception (by lying or misleading) remains wrong when it causes harm, showing that the norm is not essential.  
     - **Note**: The parity theorist might refuse to accept the suspension of the norm of assertion as relevant, arguing that everyday communication always carries the norm.

  4.2. **Does the hearer's contribution to their own false belief shift responsibility or just the causal pathway?**  
     - **Case**: A misleading true statement made to an expert who fails to draw the obvious inference vs. the same to a novice.  
     - **Distinctivist's prediction**: The expert's failure shifts responsibility away from the speaker, reducing wrongness more than for the novice.  
     - **Parity theorist's prediction**: The speaker's responsibility is the same; the expert's failure might reduce harm but not the speaker's culpability.  
     - **Evidence both accept**: Empirical studies on blame attribution in deception scenarios.

  4.3. **Is the said/implicated line determinate enough to bear moral weight in messy real cases?**  
     - **Evidence both accept**: The legal case *Bronston v. United States* (1973), where the Court held that a literally true but misleading answer under oath did not constitute perjury because the questioner bore the burden of asking follow-up questions.  
     - **Distinctivist's view**: The Court got the moral allocation backwards: the witness intentionally misled and should be morally condemned even if not legally guilty. The legal rule is about prosecutability, not morality.  
     - **Parity theorist's view**: The Court correctly identified that the questioner shares responsibility for the deception by not asking precise questions, reflecting a real division of epistemic labor. Legal reasoning here tracks moral considerations about reasonable expectations.  
     - **Classification**: The distinctivist denies that legal reasoning has direct moral force; it's a rule about speech regulation. The parity theorist thinks it reflects underlying moral principles.

  4.4. **Are the two accounts addressing different contexts (ordinary conversation vs. regulated disclosure)?**  
     - **Case**: The same deceptive act in a casual conversation vs. in a regulated financial disclosure.  
     - **Distinctivist's prediction**: In regulated contexts, the obligations of the speaker might make any deception worse, but the lying/misleading distinction still holds its moral difference.  
     - **Parity theorist's prediction**: In regulated contexts, the precision required makes misleading with technical truths particularly pernicious, potentially closing the gap with lying.  
     - **Evidence**: Analysis of professional ethics codes that distinguish lying from misleading.

  4.5. **Does the act of assertion add a distinct element of control over the hearer's belief?**  
     - **Case**: A speaker asserts a falsehood (lie) vs. implies the same falsehood by a true statement (mislead) in a high-stakes scenario.  
     - **Distinctivist's prediction**: The lie gives the speaker more control and is more manipulative, increasing its wrongness.  
     - **Parity theorist's prediction**: The level of control depends on the hearer, not the manner of speaking; both can be equally controlling.  
     - **Evidence**: Psychological studies on the perceived control in deceptive statements.

  **5. Empirical Crux**

  Both sides agree that a well-designed study of ordinary people's wrongness judgments could provide relevant evidence. The study would compare lying and literally-true misleading in scenarios where consequences and detection risk are held as constant as possible.

  - **Distinctivist's prediction**: Ordinary people will consistently rate lying as more wrong than misleading, even when outcomes are identical, because they intuitively recognize the violation of the norm of assertion.
  - **Parity theorist's prediction**: Ordinary people will rate lying and misleading as equally wrong when consequences, intent, and harm are the same, because they are tracking the moral core of deception.

  **Objections each raises to the other's reading of the data**:
  - **Distinctivist's objection to parity reading**: If people rate them equally, it might be because they are not distinguishing the acts clearly or are focusing on outcomes despite instructions.
  - **Parity theorist's objection to distinctivist reading**: If people rate lying as worse, it might be because they are reacting to the word "lie" or to paradigm cases where lying has worse consequences, not to the intrinsic difference.

  **6. Self-Falsification**

  Each side names one concrete case (not hypothetical) that they would accept as decisive against their own view.

  - **Distinctivist**: If it were demonstrated that in a high-stakes scenario, a misleading true statement causes more harm and is universally judged as worse than a lie with the same intent, then the parity view would be supported. (Example: A misleading technical truth in a safety disclosure that leads to disaster while a direct lie would have been detected and corrected.)
  - **Parity theorist**: If it were shown that in cases with identical outcomes and intent, people consistently and robustly judge lying as worse even when all consequential factors are controlled, and this judgment is based on the act itself, then the distinctivist view would gain support. (Example: Experimental scenarios where lying is rated higher in wrongness despite identical harm and detectability.)

  If either cannot name such a case, it must be stated. Both have provided a case.

  **7. What Would Move This?**

  The deadlock may persist because the disagreement is deeply rooted in different moral frameworks. The distinctivist sees assertion as a core social practice with intrinsic norms, while the parity theorist sees deception as a unified phenomenon. However, progress could come from:

  - **Clarifying the question**: If the group agrees to focus only on regulated disclosure contexts or only on ordinary conversation, the gap might narrow.
  - **Empirical evidence**: A well-designed study (as in the empirical crux) could challenge one side if the results are clear and the objections are addressed.
  - **Reconciling the norm of assertion**: If the parity theorist can show that the norm of assertion is not a moral norm but a pragmatic one, or if the distinctivist can show that it is fundamental to trust, that might shift the debate.
  - **Accepting a hybrid view**: Both might agree that lying is typically worse but not always, and the difference is often one of degree in practice.

  However, given the depth of the disagreement on the nature of moral responsibility and the role of social practices, it is likely that the group will continue to argue about this, though the joint statement may help clarify the points of contention.

  ---

  [Drafters Note: I have attempted to represent both views charitably and neutrally. My own view is that the distinctivist has captured something important about the social practice of assertion, but in many real-world contexts, the parity theorist's focus on outcomes and intent is more relevant. However, this should not affect the joint statement.]
answer: |-
  **Joint Statement on the Ethics of Lying vs. Deliberate Misleading**  

  ### 1. Points of Agreement  
  Both parties endorse the following claims without reservation. Qualifications essential to one party’s acceptance are embedded in the claim.  

  1.1. **Core Definition of Lying**: A lie is an assertion made by a speaker who believes the statement is false, with the intention to deceive the hearer. This definition excludes honest mistakes, sarcasm, and non-assertive speech acts.  

  1.2. **Deception Can Be Permissible**: Both lying and deliberate misleading can be morally justified in specific contexts (e.g., preventing imminent harm, protecting legitimate privacy, or in socially ritualized contexts like surprise parties). Permissibility depends on consequences, rights, and role-based obligations.  

  1.3. **Consequences Matter for Overall Wrongness**: All-things-considered wrongness is influenced by the harm caused (e.g., material loss, erosion of trust), the stakes of the situation, and the vulnerability of the deceived party. Neither party denies that consequences affect the *degree* of wrongness.  

  1.4. **Intention Is Necessary for Moral Condemnation**: Both acts require the speaker’s intention to cause a false belief. Unintentional false implications or accidental deceptions are categorically distinct and less wrong.  

  1.5. **Distinction Between Descriptive and Normative Layers**: The descriptive fact that lying involves a false assertion while misleading uses a true assertion is acknowledged. The dispute centers on whether this difference has *inherent moral significance* (beyond its correlation with other factors like harm or detectability).  

  1.6. **Context Modulates Wrongness**: Professional, institutional, or relational contexts (e.g., legal disclosures vs. casual chats) can amplify or diminish the wrongness of deception. Neither side asserts that lying or misleading is *always* impermissible or equally wrong across contexts.  

  1.7. **Hearer’s Epistemic State Matters**: The hearer’s prior beliefs, inferential capabilities, and willingness to scrutinize claims can affect the likelihood of deception’s success. Both agree this is descriptively relevant but disagree on its moral implications.  

  ---

  ### 2. Disagreements Table  
  | Neutral Label | Distinctivist’s Position (in their own words) | Parity Theorist’s Position (in their own words) | Classification | Reason |  
  |---------------|-----------------------------------------------|-------------------------------------------------|-----------------|--------|  
  | **Nature of Moral Difference** | "Lying is worse in kind because it violates the constitutive norm of assertion (‘assert only what you believe true’). By asserting a believed falsehood, the liar weaponizes the practice of knowledge-sharing itself. The misleader, while deceptive, does not corrupt assertion—they exploit inference." | "There is no difference in kind. Identical knowledge (speaker’s awareness of the truth), intention (to deceive), and outcome (false belief) make the acts morally equivalent. Any residual difference is one of degree, driven by harm, detectability, or contextual norms—not the said/implicated boundary." | Substantive | Fundamental clash over whether the norm of assertion carries independent moral weight. |  
  | **Responsibility Allocation** | "The liar bears full responsibility for manufacturing the false belief. The misleader shares responsibility with the hearer, who actively infers the falsehood. The hearer’s contribution mitigates the speaker’s blameworthiness." | "The speaker bears identical responsibility in both cases because they intend and cause the false belief. The hearer’s inferential role may alter the causal pathway but does not partition responsibility—it merely affects the deception’s efficiency." | Substantive | Disagreement on whether causation via inference vs. direct assertion alters moral accountability. |  
  | **Moral Weight of Said/Implicated Boundary** | "The said/implicated distinction is sufficiently determinate in most real cases to bear moral weight. What is said is under the speaker’s direct control; what is implicated is co-constructed. Lying abuses control over assertion; misleading abuses conversational cooperation." | "The said/implicated boundary is often indeterminate (e.g., in context-dependent utterances) and morally arbitrary. It tracks no deep moral principle—only technicalities affecting detectability or harm, which are degree-based factors." | Different Questions | Distinctivist focuses on *act-type* (assertion vs. implication); parity theorist focuses on *outcome-type* (false belief). Also, parity theorist questions boundary’s determinacy. |  
  | **Role of Hearer’s Effort** | "The wrongness gap widens when the hearer must exert more effort to detect deception. Lies circumvent scrutiny; misleading truths demand inferential labor. The latter shifts epistemic burden to the hearer, reducing the speaker’s fault." | "Hearer effort affects only the deception’s risk or harm (e.g., hard-to-detect lies are worse). It does not create a moral distinction between lying and misleading. Identical effort requirements would render them equally wrong." | Merely Verbal | "Effort" is defined differently: distinctivist ties it to inference; parity theorist ties it to detectability. Both agree it affects *degree*. |  
  | **Relevance of Institutional Context** | "In regulated contexts (e.g., disclosures), precise definitions matter. Exploiting technical truths to mislead is less wrong than lying because it adheres to formal rules—but it remains deceptive and contextually blameworthy." | "Institutions amplify wrongness when deception breaches role-based duties (e.g., fiduciary care). But lying vs. misleading is irrelevant to this amplification. Both are equally culpable if they exploit institutional ambiguities." | Different Questions | Distinctivist emphasizes rule-following; parity theorist emphasizes duty-breach. Both agree context matters but draw different conclusions. |  

  ---

  ### 3. Case Battery  
  Ratings: 0 (no wrongness) to 10 (maximal wrongness). Justifications limited to one sentence.  

  | Case | Scenario | Distinctivist Rating & Justification | Parity Theorist Rating & Justification |  
  |------|----------|--------------------------------------|----------------------------------------|  
  | (a) Lie: "Never been in an accident." | Seller knows car had body damage from a falling branch. | 8: *Lying directly violates assertion’s norm and manufactures false belief.* | 8: *Same intent and false belief; technical truth doesn’t alter core wrongness.* |  
  | (a) True: "It’s never been in a collision." | Same knowledge and intent as above. | 6: *True assertion shifts some inferential labor to buyer, reducing speaker’s responsibility.* | 8: *Identical intent and outcome; buyer’s labor is irrelevant to speaker’s blame.* |  
  | (b) Recorded email | Misleading statement in checkable medium. | 4: *Record allows correction, reducing harm and speaker’s responsibility for persistence.* | 5: *Lower wrongness only due to reduced harm potential (detectability), not the act-type.* |  
  | (b) Spoken at party | Same statement, no record. | 7: *Unchecked deception exploits context to maximize false belief’s persistence.* | 7: *Higher wrongness due to greater harm risk (harder detection), not the act itself.* |  
  | (c) Lie: "No" to nosy neighbor | Neighbor has no right to answer, half-committed to a guess. | 2: *Trivial context reduces wrongness, but lying remains pro tanto worse than alternatives.* | 2: *Low stakes and hearer’s bias minimize harm; act-type is irrelevant here.* |  
  | (c) True: "Focused on work" | Same intent, neighbor infers "no." | 1: *Minimal wrongness as truth shifts inference to hearer in a low-stakes context.* | 2: *Same intent and outcome; no moral difference from lie in this setting.* |  
  | (d) True: "Not currently under investigation" | Exploits narrow agency definition; informal inquiry exists. | 5: *Technically true assertion avoids lying’s norm-violation but is contextually deceptive.* | 7: *Equally deceptive as lying; intent to exploit ambiguity maximizes institutional harm.* |  
  | (d) Lie: "No regulator has contacted us" | False statement with same intent. | 8: *Direct lie compounds deception with assertion’s corruption, heightening wrongness.* | 7: *Same intent and effect as misleading; lying is not inherently worse.* |  
  | (e) True statement filling silence | E.g., "Everything is fine" when it’s not. | 4: *Active misleading by truth is worse than omission but less direct than lying.* | 5: *Actively causing false belief is worse than passive omission, regardless of truth.* |  
  | (e) Saying nothing | Hearer would have asked if aware. | 3: *Omission is passive and avoids assertion’s misuse, reducing responsibility.* | 2: *Less harmful due to opportunity for correction; intent may be weaker.* |  
  | (f) Child mishears "at work" | Mommy is hospitalized; child infers "not sick." | 3: *True assertion places responsibility on child’s inability to infer, mitigating wrongness.* | 6: *Speaker intends and causes harmful false belief; vulnerability amplifies wrongness.* |  
  | (g) Hearer hoping for false belief | Misleading utterance to willfully oblivious hearer. | 4: *Hearer’s complicity reduces speaker’s responsibility; misleading less culpable.* | 5: *Intent and outcome unchanged; complicity may reduce harm but not speaker’s blame.* |  
  | (g) Hearer seeking truth | Same utterance to vigilant hearer. | 7: *Exploiting truth to mislead a vigilant hearer is highly manipulative and blameworthy.* | 6: *Higher detectability and resistance reduce harm potential, not speaker’s culpability.* |  

  **Convergences**: Both rate (a) lie and (d) lie highly, prioritize harm in (b), and contextual leniency in (c).  
  **Divergences**: Distinctivist consistently rates lies > misleading; parity theorist equalizes ratings when intent/outcome align.  

  ---

  ### 4. The Cruxes  
  Four sub-questions capable of shifting at least one party’s position. Each includes shared evidence and opposing predictions.  

  4.1. **Does the wrong of lying derive from violating the norm of assertion?**  
     - **Shared Evidence**: Cases where assertion norms are suspended (e.g., acting, fiction).  
     - **Distinctivist Prediction**: In norm-suspended contexts, lying loses its special wrongness, proving the norm’s centrality.  
     - **Parity Prediction**: Deception remains equally wrong if harm/Intent persist, proving norm violation is incidental.  
     - **Block**: Parity theorist rejects "norm suspension" as artificial; distinctivist insists it isolates the variable.  

  4.2. **Does the hearer’s inferential role shift responsibility or merely causality?**  
     - **Shared Case**: Expert vs. novice hearer: Misleading true statement fails to deceive expert (draws correct inference) but deceives novice.  
     - **Distinctivist Prediction**: Speaker is less responsible with expert—hearer’s inference capacity absorbs blame.  
     - **Parity Prediction**: Identical responsibility; expert’s non-deception reduces harm, not speaker’s intent/blame.  
     - **Evidence**: Cognitive psychology studies on blame attribution for inferred vs. asserted falsehoods.  

  4.3. **Is the said/implicated boundary determinate enough for moral weight?**  
     - **Shared Evidence**: Legal precedent (*Bronston v. United States*, 1973)—literally true but misleading testimony not perjury.  
     - **Distinctivist View**: "The Court confused legal liability with morality. The witness morally wronged the questioner by exploiting assertion’s precision; the burden-shift rewards evasion."  
     - **Parity View**: "The Court correctly divided epistemic labor: speakers control literal truth, hearers control follow-up. This reflects a real moral distinction about reasonable expectations."  
     - **Block**: Distinctivist denies legal reasoning has moral authority (it’s procedural); parity theorist insists it reveals folk moral intuitions.  

  4.4. **Are the accounts context-bound (ordinary vs. institutional)?**  
     - **Shared Case**: Identical lie/mislead in casual conversation vs. SEC filing.  
     - **Distinctivist Prediction**: Gap narrows in institutions (rules amplify all deception) but persists due to assertion’s core norm.  
     - **Parity Prediction**: Institutions erase any gap—both acts equally breach role-based duties when harm is equal.  
     - **Evidence**: Ethics codes (e.g., ABA rules) that punish "deception" without distinguishing lie/mislead.  

  ---

  ### 5. Empirical Crux  
  **Study Design**: Subjects rate wrongness (0–10) of lying vs. literally-true misleading in matched scenarios (controlled for harm, intent, detectability).  

  - **Distinctivist Prediction**: Mean rating for lying > misleading by ≥2 points. People intuitively penalize assertion violation.  
  - **Parity Theorist Prediction**: Mean ratings statistically equal. People track intent/outcome, not technicalities.  

  **Mutual Objections**:  
  - **Distinctivist to Parity**: "If ratings are equal, subjects conflate outcome with act-type or misunderstand ‘said/implicated.’"  
  - **Parity to Distinctivist**: "If lying rates higher, subjects are biased by the word ‘lie’ or stereotype lies as more harmful."  

  ---

  ### 6. Self-Falsification  
  Each side identifies one concrete, non-hypothetical case that, if actualized, would falsify their view.  

  - **Distinctivist**: "A lie causing *less* harm than a misleading truth in identical contexts (e.g., lie: ‘Your flight is delayed’ [false] averts panic; truth: ‘Your flight is on schedule’ [true but hides engine fire]). This would force me to concede consequences can override the act-type distinction."  
  - **Parity Theorist**: "Robust empirical data showing people *always* rate lying > misleading when harm/intent are perfectly controlled. This would prove the distinction is intrinsic to moral judgment."  
  - **Finding**: Both identify potential falsifiers.  

  ---

  ### 7. Breaking the Deadlock  
  The deadlock is rooted in irreconcilable foundations: the distinctivist prioritizes *social practice integrity* (assertion as a knowledge-sharing tool); the parity theorist prioritizes *mental state equivalence* (intent/outcome as moral anchors). Three paths exist:  
  1. **Reframe the Question**: If the group narrows to *institutional contexts* (e.g., disclosures), the parity view gains ground; in *ordinary assertion*, the distinctivist view dominates.  
  2. **Leverage Empirical Data**: A study controlling for harm/detectability could challenge one side if results are extreme (e.g., near-identical ratings).  
  3. **Accept a Hybrid**: Both might concede that lying is *typically* worse due to correlated factors (e.g., easier detection), but not inherently.  

  **Realistically, the deadlock will persist**. The core divide—whether the said/implicated boundary marks a moral chasm or a technical ditch—is philosophically entrenched. Progress requires agreeing on which contexts or intuitions matter most. If neither yields on their first principles, the debate will continue indefinitely.  

