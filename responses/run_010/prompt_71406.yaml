  Okay, the user is describing a pattern they've noticed in debates about "Western values" where the specific elements listed change over time, but everyone acts like it's a fixed set. They want a precise concept for this phenomenon. 

  First, I need to unpack their core observation: 
  - The content of "Western values" shifts across eras (1930s vs today) 
  - Users deny any revision, claiming timelessness 
  - Two immunity mechanisms: 
    Negative actions (slavery etc) are framed as "betrayals" 
    Similarities elsewhere are dismissed as "inconsistent/non-native" 
  - The actual driver seems to be contrast with a changing foil (who "we" oppose) 

  They've already ruled out common fallacies: 
  - Not no-true-Scotsman (not patching one claim) 
  - Not motte-and-bailey (no stable core) 
  - Not just "self-sealing" (misses historical churn) 

  Hmm... this feels like a conceptual chameleon. The closest framework might be "constitutive outside" from political theory (Laclau/Mouffe) - where identity forms through exclusion. But that's jargon-heavy. 

  For the immunity moves: 
  The "betrayal" move is moral exceptionalism (only our ideals count). The "inconsistent" move is essentialism (only we embody the essence). They're two sides of the same coin: maintaining uniqueness through narrative control. 

  On foil types: 
  Real rivals (like Cold War USSR) create stable contrasts. Imaginary/abstract foils ("barbarism") allow faster churn because the opponent is nebulous. Historical foils are especially slippery - contrast with "medieval Europe" vs "Ottomans" yields different lists than contrast with modern China. 

  Coining a term: Needs to be intuitive. "Contrastive identity" is accurate but bland. "Mirror-values"? No... "Foil-defined heritage" captures it better. Boundary case: Religious doctrine shifts (e.g. Protestantism reinterpreting "true Christianity") might look similar but lacks the geopolitical foil aspect. 

  Key differences from near-misses: 
  - Vs no-true-Scotsman: Here the entire category redefines itself, not just boundary cases 
  - Vs motte-and-bailey: The core itself migrates 
  - Vs self-sealing: Actively reshapes content, not just deflects criticism 

  Final synthesis: This is heritage as Rorschach test - the "values" are whatever inkblot best contrasts with the current perceived threat. The immunity moves are protective reflexes for that illusion of continuity.
answer: |-
  Here's the precise carving you're asking for, with boundary markers and differentiation from near-misses:

  **Core Phenomenon:**  
  This is **Contrastive Identity Anchoring** (CIA) — a category whose perceived essence is defined dynamically by opposition to a shifting foil ("The Other"), while its users experience it as a static, inherited tradition. The content churns to maintain perceived uniqueness against whatever contrasts are salient, preserving a sense of continuity through rhetorical immunity maneuvers.

  ### Key Components & Boundaries:
  1. **Contrast-Dependent Essence**  
     - The category ("Western values") has no fixed content; its membership is determined by what distinguishes "us" from the current foil.  
     - *Boundary case:* National cuisines adapt to new ingredients but retain core techniques (e.g., "Italian food" absorbs tomatoes but keeps pasta-making). This involves adaptation, not contrast-driven reinvention. CIA requires an *antagonistic foil*.

  2. **Temporal Churn + Perceived Timelessness**  
     - The list fully replaces itself over generations, yet users insist it’s unchanged.  
     - *Near-miss diff:* "No true Scotsman" tweaks a *single* trait to exclude counterexamples. CIA rebuilds the *entire set* while denying any change occurred.  

  3. **Two-Directional Immunity:**  
     - **Internal Immunity** ("betrayals"): Negative acts are exiled as "non-core" to preserve ideal purity.  
     - **External Immunity** ("inconsistent adoption"): Similarities elsewhere are dismissed as inauthentic to preserve uniqueness.  
     - *Are they one phenomenon?* Yes — both serve **category purification**. The first purges internal impurities; the second defends against external dilution. They co-occur because CIA requires *both* idealization and exceptionalism.  

  4. **Foil Dependency:**  
     - **Real/current foils** (e.g., Cold War USSR): Slower churn, values crystallize around concrete opposition (e.g., "democracy vs. communism").  
     - **Imaginary/historical foils** (e.g., "oriental despotism"): Faster churn, values shift with academic trends or media narratives (e.g., adding "gender equality" post-1990s as foil shifts).  
     - *Boundary case:* "Judeo-Christian values" as a *response* to secularism uses contrast, but if its content (e.g., specific scriptures) is stable, it’s not CIA. CIA requires *membership churn*.  

  ### Differentiation from Near-Misses:
  - **Not Motte-and-Bailey:**  
    Motte-and-bailey has a *fixed* defensible core ("motte") and expansive claim ("bailey"). CIA has no fixed core — its "motte" *migrates* (e.g., "Christian character" in 1940s abandoned today).  

  - **Not Self-Sealing Justification:**  
    Self-sealing defies falsification but doesn’t require *historical churn* or *foil-driven content*. CIA is inherently relational and evolutionary.  

  - **Not Invented Tradition:**  
    "Invented traditions" fabricate continuity (e.g., British coronation rituals). CIA is distinct because it *erases its own reinventions* by insisting the *current* list was *always* the essence.  

  ### Diagnostic Test for CIA:  
  A category exhibits CIA if:  
  1. Its defining traits change significantly across time/contexts.  
  2. Users vehemently deny this change.  
  3. Trait selection correlates with contemporary contrasts.  
  4. Counter-evidence is neutralized via *both* internal/external immunity.  

  **Example of Non-CIA:**  
  "Scientific method" as a value *could* be CIA, but if proponents openly debate its Hellenic/Islamic/European origins *without* insisting it was uniquely "Western" from inception, it lacks the immunity moves. CIA demands *exceptionalism*.  

  ### Bonus Answers:  
  1. **Immunity as one phenomenon:** It’s a unified **purification ritual**. Internal immunity ("not *real* us") and external immunity ("not *like* us") are complementary defenses of the category’s "sacred" boundaries.  

  2. **Foil realism matters:**  
     - Real foils stabilize the category (e.g., Cold War → "freedom vs. totalitarianism" persists for 40 years).  
     - Imaginary/historical foils accelerate churn (e.g., post-9/11 "Enlightenment values" vs. "medieval Islam" redefines "Western" around secularism). The less tangible the foil, the more fluid the values.  

  **Coinage:** Use ****Chameleon Heritage** in comment threads:  
  > *"This isn’t about history — it’s Chameleon Heritage. The ‘values’ change color depending on who ‘we’ oppose this century, but we keep pretending it’s the same lizard."*  

  **Definition:** A claimed cultural inheritance whose contents adapt to contrast with a foil, while its adherents insist it is immutable and uniquely authentic.  
  **Boundary:** If a group admits "we’ve redefined our values," it’s not Chameleon Heritage — the *denial of change* is essential.
