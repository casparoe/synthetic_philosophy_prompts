prompt: |-
  So, I sit on a small environmental review board — eleven of us, mostly part-time, one lawyer, one ecologist, zero philosophers — and next quarter we have to rule on something that has completely wrecked my sleep. A company wants to release gene-drive modified mosquitoes across an island group to knock out a locally transmitted disease that kills a couple dozen people a year and puts a few thousand in the hospital. Their models say the drive stays on the target islands. Two ecologists who read the filing say the models can't rule out spread across the whole species range, with knock-on effects nobody has quantified, and that once it's out you don't get to call it back. The company points out that a no vote is also a decision with a body count attached. As far as I can tell both sides are being honest, and the numbers they hand us for the bad case aren't just imprecise, they're not even in the same units — one side is talking about expected annual deaths, the other about a one-in-nothing chance of an ecosystem rearranging. Our enabling statute says we must act precautionarily and doesn't define the word.

  Before I read another position paper I want to know what I should even be demanding of a formulation. Write me the desiderata: the full spec of what any adequate version of the principle has to deliver — which cases it must get right, which distinctions it must not collapse (serious vs irreversible vs merely bad; uncertainty vs ignorance vs experts disagreeing about what the possible outcomes even are; a precaution that is itself a risk), which results or structural facts it can't contradict, and what it owes us on burden of proof and on thresholds of harm. For each requirement give the case or consideration behind it, and lean on cases like ours where you can, plus the usual torture cases: the ban that causes the famine, the precaution that manufactures the new hazard, the one-shot commitment vs the decision you get to revisit in five years with better data, the cost falling on people who never get the benefit. Be explicit about which requirements are non-negotiable for anything that deserves the name and which are really one camp's preferences wearing a criteria costume — in particular I want a ruling on whether "must be statable without ever mentioning a probability" is a genuine desideratum or a tribal badge. Then tell me whether some subset of the list is jointly unsatisfiable. My hunch is that never-paralyzes, plus shift-the-burden-onto-the-proponent, plus take-unknown-unknowns-seriously can't all be had at once, and if you think I'm wrong I want the version that gets all three. Last, name the single requirement that does the most work knocking out candidates.

  Two constraints. Purpose: I need something eleven part-timers can apply in a three hour public meeting and write reasons for that would surive a court looking over our shoulder, so administrability and public statability are requirements in their own right here, not afterthoughts — a principle whose output can only be expressed as a footnote to a model is disqualified for my use even if it's philosophically lovely. And no citations, no reading lists, no as-and-so-argued: I can't look anything up and I'd rather have nothing than a guessed-at attribution. Describe families of approach instead (the lexical-dominance ones, the procedural burden-shifting ones, the only-require-precautions-you'd-want-anyway ones, the expected-value-with-fat-tails ones) and spend a couple of sentences each on how they do against your list. Keep that part short — the list is what I actually want.
reasoning: |-
  Hmm, the user is part of an environmental review board facing a tough decision on gene-drive modified mosquitoes. They're dealing with a situation where approving the release could save lives but carries unknown ecological risks, while rejecting it guarantees continued human harm. They want a clear framework for applying the precautionary principle that's practical for their board to use.

  The user has outlined specific needs: they want desiderata for an adequate precautionary principle formulation. They need it to handle distinctions like serious vs irreversible harm, different types of uncertainty, and situations where precaution itself creates risk. They also want to know which requirements are essential versus preferences, whether certain requirements conflict, and which single requirement does the most work in eliminating options.

  Key constraints are important here - this needs to be applicable by a diverse, part-time board in a short public meeting. It must produce decisions that can withstand legal scrutiny, so it can't rely on complex models or probabilities that would be hard to explain publicly. No citations or reading lists - just clear descriptions of approaches.

  I'll need to develop a comprehensive list of desiderata for the precautionary principle. For each, I should include the underlying case or consideration, especially those similar to their mosquito dilemma. The torture cases they mentioned (like bans causing famines) will be useful illustrations.

  I should categorize which requirements are non-negotiable versus preference-based. The "no probabilities" question needs a clear ruling - I think excluding probability entirely isn't essential but limiting its role might be reasonable. I'll explore whether "never paralyzes," "burden on proponent," and "serious about unknowns" can coexist - my initial thought is they conflict, but I'll see if any approach balances them.

  For the "knockout" requirement, burden of proof seems most critical. Then I'll briefly evaluate different families of approaches against the desiderata: lexical-dominance (absolute thresholds), procedural burden-shifting, expected value with fat tails, and others.

  The response should be structured clearly: first the desiderata with explanations, then analysis of conflicts, the knockout requirement, and finally the approach evaluation. I'll keep the language accessible but precise, avoiding jargon where possible. The focus remains on practical application for their board's decision-making context.
answer: |-
  Here’s the desiderata list for an adequate Precautionary Principle (PP) formulation, tailored to your real-world constraints. Requirements are ranked by "knockout power," with core distinctions and non-negotiables marked. Cases illustrate each point.

  ### Core Desiderata (Non-Negotiables)
  1.  **Distinguishes Serious/Irreversible Harm from Mere Badness:**  
      *   *Why:* A precaution that halts minor inconveniences is paralyzing. Your case: Ecosystem rearrangement (potentially irreversible, planetary-scale) vs. annual deaths (serious but reversible with medical advances).  
      *   *Requirement:* Must demand higher scrutiny for harms that are *uncontainable, permanent, or system-collapsing*. "Irreversible" alone is insufficient (e.g., a broken leg is irreversible but manageable); focus on *magnitude* and *recoverability*.

  2.  **Handles Different Epistemic States Explicitly:**  
      *   *Why:* "Uncertainty" is a bucket term. Responses differ wildly for:  
          *   *Risk:* Known outcomes, known probabilities (e.g., car crash stats). Weak PP trigger.
          *   *Uncertainty:* Known possible outcomes, unknown probabilities (e.g., company's "spread risk" - we know *what* could happen, not *how likely*). Stronger PP trigger.
          *   *Ignorance:* Unknown unknowns - outcomes we haven't conceived of (e.g., unforeseen cascade from gene drive altering a keystone species interaction). Strongest PP trigger.
          *   *Expert Disagreement:* Legitimate experts define the *possible outcomes* differently (e.g., your ecologists vs. company modelers on "what spread scenarios are plausible"). PP must force deliberation on the *reasons* for disagreement.
      *   *Requirement:* The formulation must force explicit acknowledgment of *which epistemic state applies* and weight precautions accordingly (Ignorance > Expert Disagreement on Outcomes > Uncertainty > Risk). Your case hits Uncertainty (company) vs. Expert Disagreement bordering on Ignorance (ecologists).

  3.  **Acknowledges Precaution Itself Can Be Risky:**  
      *   *Why:* The "Ban That Causes the Famine." Banning DDT to protect birds risks malaria resurgence. Your case: A "No" vote has a known annual death toll ("cost of precaution").  
      *   *Requirement:* PP cannot be applied only to the *proposed action*; it must be applied *symmetrically* to the *inaction alternative*. The "precaution" (rejection) must be scrutinized for *its* potential harms. Avoiding paralysis requires this.

  4.  **Does Not Demand Absolute Certainty of Safety (Avoids Paralyzing Perfection):**  
      *   *Why:* Requiring 100% safety guarantee stops all innovation. PP is triggered *because* of uncertainty.  
      *   *Requirement:* The threshold for action (caution) must be *less than certainty of harm*. It must define a *plausibility threshold* for concern (e.g., "reasonable scientific concern," "non-negligible possibility").

  5.  **Assigns a Practical Burden of Proof:**  
      *   *Why:* Essential for decision-making. Who must prove what, and to what standard? Your case: Should the company prove "no significant spread risk" or critics prove "significant risk"?  
      *   *Requirement:* Must clearly state:  
          *   *Who bears the burden* (Typically the proponent, but see #3).
          *   *What they must demonstrate* (e.g., "no plausible pathway to irreversible harm," "net benefit under reasonable scenarios," "adequate containment/mitigation plans").
          *   *The standard of evidence* (e.g., "weight of evidence," "reasonable scientific plausibility," "beyond reasonable doubt" - weak for PP). *Crucially, this burden must be possible to meet in principle with evidence and analysis.*

  ### Critical Distinctions & Operational Requirements
  6.  **Distinguishes Reversible vs. Irreversible Decisions / Time Horizons:**  
      *   *Why:* A "wait and see" approach is viable if impacts unfold slowly and are containable. Your case: Gene drives are likely irreversible once released ("you don't get to call it back"). A pesticide ban can be reversed if famine looms.  
      *   *Requirement:* Must weigh the *irreversibility of the action* and the *urgency of the harm avoided*. Irreversible actions demand far greater caution, especially under ignorance. Revisitable decisions allow stronger monitoring/rescission clauses.

  7.  **Requires Consideration of Who Bears Costs/Benefits & Equity:**  
      *   *Why:* The "Cost Falling on People Who Never Get the Benefit." Islanders get disease reduction now, but a global ecosystem bears potential future risk. Precaution can disproportionately harm vulnerable groups (e.g., denying poor farmers a productive GMO crop).  
      *   *Requirement:* PP application must explicitly assess the distribution of potential harms and benefits across populations and time, seeking equitable solutions where possible (even if not strictly a *decisive* factor for PP itself).

  8.  **Produces Actionable Guidance (Not Just "Be Careful"):**  
      *   *Why:* PP must lead to a decision: Approve? Reject? Approve with Conditions (what conditions?)? Your board needs a defensible output.  
      *   *Requirement:* The formulation must connect the assessment of threat/uncertainty to specific *types* of management responses (e.g., ban, moratorium, phased trial with strict monitoring, liability bonds, compensation funds).

  9.  **Is Administratively Feasible & Publicly Statable:**  
      *   *Why:* Your core constraint. A 3-hour meeting with 11 part-timers and a court watching. Complex models/footnotes disqualify.  
      *   *Requirement:* The core logic must be explainable in plain language. Inputs must be assessable based on *presented evidence and arguments* without needing novel research. The output decision must be justified using the principle's logic without resorting to "the model says so."

  ### Preferences vs. Core (Tribal Badges)
  10. **"Must Be Statable Without Ever Mentioning Probability":**  
      *   *Verdict:* **Tribal Badge, not Core Desideratum.** Eliminating *all* probabilistic language is impractical and unwise. The key is *how* probability is used:  
          *   *Problematic:* Demanding proponents quantify the *exact probability* of complex, poorly understood events (e.g., "Prove P(ecosystem collapse) < 0.001") – this is impossible and paralyzing.
          *   *Acceptable:* Using qualitative probability language reflecting epistemic state ("highly improbable," "plausible," "cannot be ruled out," "unknown likelihood") or using ranges/scenarios. Your case *requires* discussing the *plausibility* of spread vs. the *certainty* of current harm. Banning "probability" words entirely collapses vital distinctions (#2). The core requirement is **#5 (Practical Burden of Proof)** and **#4 (No Absolute Certainty)**, not the absence of probabilistic *concepts*.

  11. **"Never Paralyzes":**  
      *   *Verdict:* **Strong Preference, not Absolute Requirement.** A *truly paralyzing* PP is useless. However, **#3 (Symmetry)** is the core tool to *minimize* paralysis by forcing scrutiny of inaction. Some decisions genuinely *should* be blocked by profound ignorance of irreversible harm. True paralysis usually arises from *misapplication* (ignoring #3, #7, misjudging #1) or impossible burdens (#5).

  12. **"Maximally Shifts Burden to Proponent":**  
      *   *Verdict:* **Strong Preference, tempered by #3 & #5.** While shifting the burden to the proponent is common and often justified (they introduce the novel risk/seek the gain), **#3 (Symmetry)** demands the *costs of precaution* also be scrutinized. **#5 (Practical Burden)** demands the burden be *possible* to meet – demanding proof of a negative ("prove no harm under any scenario") is paralyzing and invalid. The burden must be framed positively ("demonstrate safety under plausible scenarios," "propose credible containment," "show net benefit outweighs residual risks").

  ### The Conflict: Can You Have It All?
  *   **"Never Paralyzes" + "Shift Burden to Proponent" + "Take Unknown Unknowns Seriously"**: These **are in tension**, potentially **jointly unsatisfiable** in extreme cases of ignorance.
      *   *Conflict:* Taking profound ignorance (unknown unknowns) of irreversible harm seriously (#2) *demands* extreme caution. Shifting a paralyzing burden ("prove no unknown unknowns could cause catastrophe") to the proponent (#12) is impossible to meet. The result is paralysis, violating #11.
      *   *Possible Resolution (The Best You Can Get):** Focus **#5 (Burden)** on what the proponent *can* reasonably do:
          1.  **Acknowledge Ignorance:** Explicitly state the limits of knowledge and potential for unknown unknowns.
          2.  **Shift Burden to Proponent for Resilience/Mitigation:** Require them to: (a) Demonstrate robust *containment* (physical/biological) to prevent spread/release; (b) Present *plausible, monitored, reversible phases* (e.g., single small island first); (c) Propose concrete *mitigation plans* if things go wrong (e.g., release of a reversal drive, compensation); (d) Fund independent *monitoring* for unexpected effects. *This addresses ignorance by demanding action to limit scope and enhance resilience, rather than demanding impossible proof.*
          3.  **Apply #3 (Symmetry) Rigorously:** Quantify the *known cost of delay/rejection* (annual deaths/hospitalizations). Is the proposed precaution (rejection/delay) proportionate given the *known* harm it allows to continue vs. the *character* (irreversible, global?) of the uncertain threat?
      *   *In Your Case:* Could the company meet a burden like: "Demonstrate plausible containment to the island chain *and* propose a monitored, phased release starting on the smallest island *and* have a funded reversal drive ready *and* show that the known annual harm of delay is severe"? If yes, approval with conditions might satisfy a strong PP. If not, rejection might be justified. This avoids demanding they "prove no spread," focusing instead on minimizing damage *if* the critics are right.

  ### The Knockout Requirement
  **#5: Assigns a Practical Burden of Proof** does the most work eliminating inadequate PP formulations.
  *   *Why:* Weak formulations say "be cautious" but don't say *who* must prove *what* or *how*. This leads to endless debate and paralysis. Formulations demanding impossible proofs (absolute safety, proving negatives about unknowns) are instantly disqualified. Formulations that place no burden on the proponent are toothless. **A PP without a clear, practicable burden of proof is administratively useless and philosophically hollow.** It forces concrete answers: What must the company *show* you to get a yes? What would make you say no? This is the linchpin for #8 (Actionable Guidance) and #9 (Administrability).

  ### Families of Approaches - Brief Evaluation Against List
  1.  **Lexical Dominance (Threshold-Based):** "Never allow action if risk of irreversible harm > threshold X, regardless of benefit." (e.g., Jonas' "Heuristics of Fear")
      *   *Pros:* Strong on #1, #2 (ignorance), #6. Simple (#9).
      *   *Cons:* Fails #3 (ignores cost of precaution), often fails #4 & #5 (paralyzing if threshold is absolute zero risk), poor on #7, #8. Crude. *Knocked out by #3, #4, #5.*

  2.  **Procedural Burden-Shifting:** Focuses on process: Proponent must investigate, alternatives assessment, public participation, monitoring. (Common in intl. agreements).
      *   *Pros:* Strong on #2 (epistemic states), #5 (practical burden - "do the analysis"), #6 (phasing/monitoring), #8, #9 (structured process). Avoids paralysis (#11).
      *   *Cons:* Can be weak on #1 (if process doesn't mandate focus on serious/irrev), may not force hard decisions (#8 - output can be "more study"), weaker on #3 (cost of delay). Needs strong framing. *Strong contender if focused on serious/irrev harm and includes symmetry (#3).*

  3.  **"Only Require Precautions You'd Want Anyway" (Sunstein-style Cost-Benefit Core):** PP only triggers when potential harm is catastrophic *and* cost of precaution is low. Otherwise, use standard cost-benefit analysis (CBA).
      *   *Pros:* Strong on #3, #4, #11. Clear link to #8.
      *   *Cons:* Weak on #2 (ignorance - CBA struggles), #1 (defines "catastrophic"?), #7 (CBA often ignores distribution), #5 (CBA requires quantification often impossible under uncertainty/ignorance). Fails under profound ignorance. *Knocked out by #2 (ignorance/expert disagreement) and #5 (quantification burden).*

  4.  **Expected Value with Fat Tails (Weitzman/Martin):** Use CBA but assign disproportionate weight to worst-case scenarios (fat tails in harm distribution).
      *   *Pros:* Addresses #1, #2 (esp. uncertainty), #3 (incorporates benefits).
      *   *Cons:* Requires contentious probability modeling even under ignorance (#2), complex (#9 fails), can be paralyzing if worst-case is infinite. Difficult to apply administratively. *Knocked out by #9 (Administrability), and struggles with #2 (ignorance) and #5 (practical burden).*

  5.  **Proportionate Precaution (Wingspread-type + Symmetry):** "Where threats of serious/irreversible harm exist, lack of full scientific certainty shall not be used to postpone cost-effective measures to prevent harm. Measures must be proportionate, non-discriminatory, consistent, based on examination of costs/benefits (including of inaction), and subject to review."
      *   *Pros:* Captures #1, #2, #4, #6 (review). Explicitly includes #3 (costs/benefits of inaction) and #7 (non-discriminatory). #5 implied (proponent must show threat isn't serious/irrev or that measures are cost-effective). Supports #8.
      *   *Cons:* "Cost-effective" and "proportionate" require judgment (#9 challenge, but possible). Needs strong chair to focus on serious/irrev. *Best overall fit for your needs.* Requires rigorously defining "serious/irreversible" (#1) and applying #3 (cost of inaction).

  ### Recommendation for Your Board
  Adopt a **Procedural Burden-Shifting framework grounded in Proportionate Precaution**, explicitly focused on **Serious/Irreversible Harm**. Structure your 3 hours around:

  1.  **Threshold:** Is there a *plausible threat* of *serious and irreversible harm* (ecosystem rearrangement, permanent loss)? (Addressing #1, #2, #4).
  2.  **Burden/Symmetry:** 
      *   *Proponent:* Can they demonstrate robust containment/phasing/mitigation/monitoring to reduce the *plausibility* or *impact* of that threat? (Practical burden, #5, #6).
      *   *Board:* What are the *known, serious consequences of rejection/delay* (annual deaths)? (Enforcing #3).
  3.  **Proportionality:** Weigh the *residual plausible threat* (after proposed precautions) against the *known cost of precaution* (rejection/delay). Are the proposed precautions (or rejection) proportionate? Consider equity (#7). (Core decision point).
  4.  **Output:** Approve/Reject. If approve, mandate specific conditions (phasing, monitoring triggers, mitigation funding). If reject, state why precautions were insufficient or threat disproportionate. (Meeting #8, #9).

  This process forces focus on the critical distinctions, applies symmetry, sets a practical burden, avoids paralysis by demanding proportionality, and produces a defensible, plain-language decision a court can understand. Good luck.
