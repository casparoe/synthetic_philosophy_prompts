  We are designing a quiz to help students discover that they don't all mean the same thing by "experience". The quiz will have 10 questions (we'll sketch 10 concrete cases) and then a scoring key that maps patterns of answers to various philosophical positions.

  We start with the two coffee tasters example and then vary the setup. The goal is to avoid using terms like "qualia", "phenomenology", or "what-it's-like". Instead, we present concrete cases with two or three options for each.

  After the quiz, we will build a space of possible positions and then map the named views (like Dennett's) into that space.

  Let me outline 10 questions (cases). Each case will have a scenario and then multiple-choice options.

  **Question 1: The Original Coffee Tasters**
  *Scenario:*
  Alex and Ben are coffee tasters. Alex says, "This coffee tastes just as it always did, but I've stopped liking it." Ben says, "This coffee doesn't taste the way it used to."
  *Options:*
  A. Alex is right: the taste hasn't changed, only his liking for it.
  B. Ben is right: the taste itself has changed.
  C. There's no fact of the matter about whether the taste has changed; it's a matter of how you choose to describe it.

  **Question 2: Discriminating Without Reporting**
  *Scenario:*
  Charlie is a coffee taster wired to a machine that can read his brain states. The machine shows that Charlie can discriminate between the current coffee and the old coffee (i.e., his brain responds differently), but when asked, Charlie reports that the coffee tastes the same as always.
  *Options:*
  A. The taste has changed, even though Charlie doesn't realize it (the machine reveals the truth).
  B. The taste hasn't changed; Charlie's discrimination is about something else (maybe a non-conscious difference).
  C. We can't say whether the taste has changed or not.

  **Question 3: Memory Loss**
  *Scenario:*
  Dana used to taste coffee every day but then lost all memory of the old taste. Now, when tasting the same coffee again, Dana says it tastes the same as always (but has no memory of the old taste to compare). We know from records that the coffee hasn't changed.
  *Options:*
  A. The taste is the same, and Dana is right to say it tastes the same (even without memory, the experience is the same).
  B. Without the memory, Dana isn't really comparing, so we can't say whether the taste is the same or not.
  C. The taste is the same, but Dana's report is unreliable because of the memory loss.

  **Question 4: Flat Disagreement**
  *Scenario:*
  Eli and Finn are coffee tasters. Eli says the coffee tastes the same as before, Finn says it tastes different. Both are equally skilled and honest. There is no physical change in the coffee.
  *Options:*
  A. One of them must be wrong, but we can't tell who.
  B. They are both right: the taste is the same for Eli and different for Finn.
  C. There is no objective fact about whether the taste has changed; it's subjective.

  **Question 5: Change in Liking Without Discrimination**
  *Scenario:*
  Grace used to love the coffee. Now she doesn't like it anymore. However, when tested, she cannot discriminate between the current coffee and the old coffee in blind tests (she guesses randomly). The coffee hasn't changed.
  *Options:*
  A. The taste hasn't changed; only her liking has changed.
  B. The taste has changed in a way that she cannot consciously detect, but it affects her liking.
  C. Without being able to discriminate, we can't say that the taste has changed.

  **Question 6: Change in Discrimination Without Liking**
  *Scenario:*
  Henry can now discriminate between the current coffee and the old coffee (he passes blind tests) but his liking for the coffee hasn't changed. The coffee hasn't changed.
  *Options:*
  A. The taste has changed, but Henry still likes it the same.
  B. The taste hasn't changed; Henry is just noticing something he didn't before (but the experience is the same).
  C. Discrimination doesn't necessarily mean the experience changed; it might be a change in attention.

  **Question 7: The Inverted Spectrum (without memory)**
  *Scenario:*
  Ivan wakes up one day and claims that red things now look the way green things used to look, and vice versa. However, he has no memory of what red and green used to look like, and he passes all color tests (he can identify red and green objects correctly).
  *Options:*
  A. Ivan's color experience has inverted.
  B. Without a memory of the old experiences, we can't say if it's inverted or not.
  C. The inversion is real, but it doesn't matter because he behaves the same.

  **Question 8: The Inverted Spectrum (with memory)**
  *Scenario:*
  Jill claims that her color experiences inverted overnight. She remembers what colors used to look like and reports that they now look different. She passes all color tests (so her behavior is unchanged).
  *Options:*
  A. Her color experiences have indeed inverted.
  B. She is mistaken; if behavior is unchanged, the experience hasn't changed.
  C. There's no way to know because we can't compare experiences.

  **Question 9: The Zombie Twin**
  *Scenario:*
  Kai has a twin, Leo, who is a perfect physical duplicate but, according to Kai, lacks conscious experience (a zombie). Leo behaves exactly like Kai in every way, including claiming to have experiences.
  *Options:*
  A. It is possible that Leo lacks conscious experiences even though he behaves as if he has them.
  B. Since Leo is physically identical, he must have the same conscious experiences as Kai.
  C. The concept of a zombie is incoherent.

  **Question 10: The Robot Taster**
  *Scenario:*
  Maya is a robot designed to taste coffee. She can discriminate between different coffees and report on their tastes. She even says she "likes" some more than others. Does Maya have taste experiences?
  *Options:*
  A. Yes, because she can discriminate and report.
  B. No, because she is just a machine.
  C. We can't know.

  Now, we need to build a scoring key. We'll map patterns of answers to positions.

  First, let's outline the positions we want to cover:

  1. **Experience genuinely changed**: The qualitative character of experience can change independently of behavior, judgment, etc.
  2. **Only the judgment or the liking changed**: Changes in reports or preferences don't necessarily indicate a change in experience.
  3. **Higher-order thought (HOT) views**: A state is conscious only if it is the target of a higher-order thought. So experience depends on higher-order representations.
  4. **First-order representationalism (FOR)**: The conscious character of experience is determined by the content of first-order representations (e.g., the representation of the coffee's properties).
  5. **Naive or relational realism**: Experience is a direct relation to external objects, so if the object doesn't change, the experience doesn't change (unless the relation changes, e.g., by changes in the subject).
  6. **Illusionism**: Conscious experience is an illusion; there is no such thing as qualia or phenomenal properties.
  7. **Dennett's view (no fact of the matter)**: There is no objective, non-behavioral fact about whether experiences are the same or different.

  We'll also note combinations that nobody occupies and why.

