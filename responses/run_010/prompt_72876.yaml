answer: |-
  Here’s a streamlined diagnostic tool based on Nietzsche’s five historical attitudes, designed for print with clear scenarios, scoring, and honest caveats. It fits on a single spread (left page: questions, right page: key/results).

  ---

  ### **"What Kind of History-of-Science Person Are You?"**  
  *Answer based on your instinctive reaction to each scenario:*

  1.  **A university names a building after its founding physicist. You discover their unpublished letters reveal serious ethical flaws.**  
      A) Publicly advocate renaming — integrity matters more than legacy.  
      B) Preserve the name but add contextual exhibits in the lobby.  
      C) Ignore it — today’s science isn’t defined by past personalities.  

  2.  **A grant proposal argues: "We should fund this risky project — we put people on the moon with less computing power!"**  
      A) Support it — such bold ambition drives progress.  
      B) Reject it — nostalgia distorts real technical challenges.  
      C) Redirect funds — obsolete arguments waste resources; focus on current tools.  

  3.  **A retired lab still runs a 20-year-old obsolete instrument, meticulously calibrated weekly.**  
      A) Respect it — preserving heritage teaches respect for craft.  
      B) Shut it down — resources should serve cutting-edge work.  
      C) Study it — it’s a relic of dead ends, revealing past illusions.  

  4.  **A young researcher demands re-deriving foundational equations from scratch, suspecting bias in the original proofs.**  
      A) Encourage it — challenging dogma prevents stagnation.  
      B) Dismiss it — established frameworks enable efficient progress.  
      C) Archive it — past disputes are irrelevant noise to future truths.  

  5.  **A historian dismisses a famous priority dispute: "None of this will matter in 100 years."**  
      A) Agree — only enduring truths transcend petty human squabbles.  
      B) Disagree — such conflicts reveal how science *actually* progresses.  
      C) Who cares? — debating history distracts from doing science now.  

  6.  **A working scientist says: "Don’t read the history of this controversy; just run the experiment."**  
      A) Wise — action trumps analysis.  
      B) Dangerous — repeating mistakes wastes time.  
      C) Shallow — understanding context reveals deeper meaning.  

  7.  **A museum exhibit on penicillin focuses solely on Fleming’s "accidental discovery."**  
      A) Critique it — it erases Chain & Florey’s vital refinement work.  
      B) Applaud it — simple narratives inspire future discoverers.  
      C) Expand it — display every lab note and failed experiment for context.  

  8.  **A bioethics paper argues CRISPR should be guided solely by current norms, not past eugenics debates.**  
      A) Support — past horrors are irrelevant to today’s precise tools.  
      B) Oppose — history’s warnings are essential guardrails.  
      C) Reframe — both views miss that ethics is timeless, not historical.  

  ---

  ### **Scoring Key & Results**  
  *Tally your A/B/C answers. Your dominant letter indicates your core mode. Most people blend modes — see "Blends & Blurs" below.*

  -   **Mostly A: Critical Historian**  
      *Nietzsche's warning:* Overuse destroys foundations needed for progress, leaving nothing to build upon.
  -   **Mostly B: Monumental Historian**  
      *Nietzsche's warning:* Overuse creates unrealistic myths, turning past giants into suffocating idols.
  -   **Mostly C: Antiquarian Historian**  
      *Nietzsche's warning:* Overuse mummifies the past, burying the present under inert detail.
  -   **Strong Minorities in A or C + "C" in Q5/Q8: Suprahistorical**  
      *Nietzsche's warning:* Overuse leads to nihilistic paralysis, dismissing all action as futile.
  -   **Strong Minorities in B or C + "A" in Q3/Q6: Unhistorical**  
      *Nietzsche's warning:* Overuse creates narrowness, unable to learn or draw meaning beyond immediate needs.

  ---

  ### **Blends, Blurs & Empty Chairs**  
  -   **Common Blends:** Antiquarian-Monumental (preserves *and* venerates), Critical-Unhistorical (dismisses history for action).  
  -   **Key Blurs:**  
      -   *Monumental/Suprahistorical:* Both seek transcendence, but Monumental acts *within* history, Suprahistorical rejects it. Scenarios 2 & 5 test this.  
      -   *Critical/Unhistorical:* Both reject dwelling on history. Critical aims to *correct* it (Q1, Q4), Unhistorical ignores it *for utility* (Q3, Q6).  
  -   **Empty Chair:** *Suprahistorical-Antiquarian*. Valuing relics *while* seeing history as meaningless is incoherent. This combination didn’t appear in testing.  
  -   **Inconsistent Answers?** Most readers blend modes! The score highlights your *primary* lens. Examine your secondary letters for nuance.

  ---

  ### **Confidence & Caveats**  
  -   **Highest Confidence:** Monumental, Antiquarian, Critical distinctions. Scenarios cleanly map to core actions (venerate/preserve/dismantle).  
  -   **Unhistorical/Suprahistorical in Nietzsche?** Yes. They frame his essay (*On the Use and Abuse of History for Life*). Unhistorical is the "animal's unblinking gaze," Suprahistorical sees history’s "end and aim scattered through it."  
  -   **Least Confident Node: Suprahistorical.** It’s rare and easily masked as Monumental (transcendence-seekers) or Critical (dismissers of tradition). Scenarios 5 and 8 are its clearest markers ("none of this matters"/"ethics are timeless").  
  -   **Biggest Fudge:** Q3’s Option C mapping to Suprahistorical. Is studying obsolescence truly "supra"? It’s the best fit among the five for detached analysis of futility.

  ---

  **Final Layout Tip:** Present questions in a 2-column grid. Results page uses bold headers/icons for the five modes. Highlight "Blurs & Blends" in a tinted sidebar. Total word count: ~700 (fits one spread).
