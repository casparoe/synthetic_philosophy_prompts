prompt: |-
  I am trying to settle my own view on the ethics of abortion by working through concrete cases rather than by picking a camp, and I have reached the point where my verdicts no longer look like they hang together. Some context that may or may not be relevant: my spouse and I went through several rounds of IVF before our daughter was born, and we still have two frozen embryos in storage in another state, with an annual fee attached and a consent form asking what should become of them if we die or divorce. I am also auditing a graduate applied ethics seminar this term, in which we have done Thomson's violinist and people-seeds cases and Marquis's future-like-ours argument, and I have found that the seminar has left my intuitions exactly where they started. Here are the verdicts I actually have, stated as flatly as I can.

  1. The violinist as Thomson describes him: unplugging is permissible even after nine months, and I feel this strongly. But in a variant where he can be safely disconnected into a portable dialysis rig that keeps him alive without your kidneys, yanking the plug is wrong. What I have a right to, on my intuitions, is the end of the imposition, not the death of the person imposing it.
  2. An ectopic pregnancy: removing the tube is permissible, and I do not think this is because the embryo has low status. It is permissible because both cannot be saved. If a technique existed that saved the embryo at no additional risk to the patient, I think we would be required to use it, or very close to required.
  3. Contraception that prevents fertilization: clearly fine, not close to a hard case. Discarding our own two frozen embryos by joint decision, with nobody's consent violated and nobody's body involved: not fine, or at least a real loss that we would have to justify rather than shrug at. I cannot explain the asymmetry except by noting that one of these is a labeled vial we have been paying to store for four years, which does not sound like a principle.
  4. Anencephaly: termination is permissible, and I think it is permissible for Marquis's reason, that there is no future like ours to deprive anyone of. But a fetus whose predicted life would be brief and dominated by suffering, though hardly empty of the goods Marquis lists: I also want to say termination is permissible, and here the reason cannot be that there is no future, since there is one. It would have to be that the future is not worth having, which seems a different and much more dangerous principle to let in.
  5. Emergency contraception taken within three days of intercourse, when implantation may not yet have occurred: clearly permissible, and part of how I justify this to myself is that at that stage the embryo can still split into twins, so there is no determinate single individual whose future is being taken. A day-five embryo in a clinic's discard tray, at the same developmental stage, destroyed rather than transferred: a loss. The stage-based reason I just gave cannot separate these two, so either my twinning argument is doing no work at all or something else is doing it.
  6. A person who stopped using contraception with the intention of conceiving and then changed her mind at six weeks: I think her claim to terminate is weaker than a rape victim's, though not extinguished. Someone who conceived through a lapse in a method she had knowingly chosen: weaker again, perhaps? I flip-flop here. The people-seeds case is supposed to settle the question and does not settle it for me; it makes the risk-taker's position look worse than I want to endorse.
  7. A fetus at twenty-two weeks where transfer to an artificial womb is available at no risk or cost to the pregnant person: she may end the pregnancy, but she may not have the fetus destroyed, and must accept the transfer. At thirty-four weeks with no transfer available anywhere: she may still terminate, and I think this is because, in the absence of the alternative, ending the pregnancy and ending the life have become a single act. But if they are a single act there, then in case 1 the right to end an imposition would also have to be a right to end a life, which I have just denied.
  8. A pregnant person given months to live who aborts a healthy fetus: I want to say this is no worse than the same act by someone in ordinary health, but the future-like-ours account appears to measure the wrong by the size of the future taken, and the future is the same size in both instances. If anything my instinct says the dying person's act is less bad, and I cannot ground that instinct anywhere.

  My tentative formulation, which I suspect is merely ad hoc, is this: an act that ends a fetus's life is permissible only if either (a) the fetus has no future like ours, or (b) the fetus is, without the pregnant person's ongoing consent, imposing on her body and no transfer out of that imposition is available to her at reasonable cost. Clause (a) does the work in cases 4 and 5, clause (b) in cases 1, 2, 6, and 7, and I can already see that case 3 is a disaster for the whole thing, since a frozen embryo has as much claim to a future like ours as anything in case 4 while imposing on no one whatsoever. What I would like from you is a principle, or if you think two incompatible principles are the honest answer then both, stated precisely and clause by clause, with each clause tied to the verdict that motivates it; an explicit statement of which of the eight verdicts above it cannot accommodate and what it would cost me to keep them anyway; and a diagnosis of cases 3 and 5 in particular, saying whether the tension between them is real or whether there is a distinction I am fumbling at. Then tell me what the resulting principle implies about three situations I have not listed: whether anyone would be obligated to bring a discarded but viable frozen embryo to term in an artificial womb, if the technology existed and no one's body were involved; how to resolve the case of a frozen embryo whose genetic parents disagree, one demanding destruction and one demanding transfer to a willing gestational carrier; and what happens in a jurisdiction where transfer is available at modest but nontrivial cost, say a few thousand dollars and a week of recovery, so that the pregnant person declines it for financial rather than bodily reasons. Please do not survey the literature or map my intuitions onto named positions and camps. I want the reasoning and the price of holding it.
reasoning: |-
  Okay, let me approach this user's ethical puzzle systematically. The user presents eight concrete abortion-related verdicts that feel intuitively correct to them but seem logically inconsistent, particularly regarding frozen embryos (case 3) and emergency contraception versus lab embryos (case 5). Their IVF background and ethics seminar exposure clearly shape these tensions.

  First, I notice three core conflicts in their intuitions: 
  1) Bodily autonomy matters intensely (violinist, ectopic cases) but not absolutely (portable dialysis variant). 
  2) The "future-like-ours" value (frozen embryos) clashes with dismissal of early potential life (emergency contraception). 
  3) Context alters moral weight (wanted pregnancy termination vs rape) without clear principles.

  The user's proposed framework (future value + bodily imposition) fails with frozen embryos precisely because they expose the rift between these values. For case 5, the "twinning argument" seems like post-hoc reasoning - what really distinguishes the emergency contraception embryo from the lab embryo is likely the context of embodiment versus storage.

  When constructing principles, I'll need to:
  - Anchor bodily autonomy in "imposition" defined by physiological burden
  - Treat "future value" as secondary and context-dependent
  - Explicitly separate physical imposition from other obligations
  For the unresolved cases, artificial womb scenarios will test whether "future value" creates obligations absent bodily claims. The genetic parents' dispute reveals that consent and parenthood status matter more than embryo status alone. Cost-based refusal cases will force choosing between financial hardship as valid autonomy concern versus "reasonable cost" thresholds.

  The user's deepest struggle appears to be reconciling their emotional attachment to stored embryos (as potential siblings) with their intellectual commitment to abortion rights. This personal history likely explains why case 3 resists neat categorization - it's not about embryos in vacuum, but those specific embryos. I suspect no purely logical system will resolve that tension completely, and the solution may lie in acknowledging contextual ethics.
answer: |-
  Here’s a principle-by-principle reconstruction of your intuitions, designed to preserve your core verdicts while diagnosing tensions. The framework prioritizes two distinct moral foundations:

  **Principle 1 (Bodily Autonomy):**  
  *A person has the right to end any significant, non-consensual imposition on their body or life-sustaining biological processes, provided they do not intentionally cause death beyond what is necessary to end the imposition.*  
  - **Motivated by:** Violinist (1), ectopic pregnancy (2), people-seeds/risk-takers (6), artificial womb cases (7).  
  - **Clarifications:**  
    - "Significant imposition" excludes minor burdens (e.g., typical pregnancy discomforts).  
    - "Non-consensual" includes revoked consent (e.g., case 6).  
    - "Do not intentionally cause death" explains the portable dialysis variant (1) and artificial womb requirement (7).  

  **Principle 2 (Future Value):**  
  *Ending a life with a future of value is a serious moral loss, unless:*  
  *(a) The future lacks minimal conditions for well-being (e.g., anencephaly), or*  
  *(b) The life is ended as an unavoidable side effect of ending a bodily imposition (per Principle 1).*  
  - **Motivated by:** Anencephaly (4), suffering-focused termination (4), frozen embryos (3), lab embryo destruction (5).  
  - **Clarifications:**  
    - "Future of value" = capacity for experiences/relationships *and* a trajectory toward net well-being.  
    - (a) covers futures dominated by suffering or without consciousness.  
    - (b) prevents Principle 1 from being a license to kill (e.g., prohibiting yanking the dialysis plug).  

  ---

  ### **Diagnosis of Tensions**  
  - **Case 3 (Frozen Embryos) vs. Principle 1:**  
    Your intuition treats discarding embryos as a loss because they have a future of value (Principle 2), but they impose *no bodily burden*. This clashes with Principle 1’s focus on bodily imposition. **Cost:** To keep your verdict, you must accept that Principle 2 creates standalone obligations *independent of bodily autonomy*—even when no one is physically imposed upon.  

  - **Case 5 (Emergency Contraception vs. Lab Embryo):**  
    The tension arises because both embryos are identical in developmental stage. Your "twinning argument" is likely a proxy for a deeper distinction:  
    - **Emergency contraception:** Prevents *potential* imposition (pregnancy never begins). No existing life is yet dependent on a specific body.  
    - **Lab embryo:** Represents a *concrete entity* with identified parents and a preservation plan, making its future more "determinate."  
    **Verdict:** The twinning argument *is* doing work, but only because it highlights whether the embryo is already treated as a specific object of obligation.  

  - **Unaccommodated Verdicts:**  
    - **Case 4 (Suffering fetus):** Principle 2(a) requires judging the future "not worth having," which you rightly note is dangerous. **Cost:** You must either abandon this verdict or refine "future of value" to exclude futures with net suffering.  
    - **Case 8 (Dying person’s abortion):** Your instinct that it’s *less* bad conflicts with Marquis’s "same future" logic. **Diagnosis:** You likely weigh the dying person’s reduced opportunity costs (e.g., less life left to sacrifice). **Cost:** To keep this, add a clause to Principle 2: the moral loss is mitigated if the agent’s own future is severely truncated.  

  ---

  ### **Application to New Cases**  
  1. **Obligation to implant a discarded frozen embryo in an artificial womb?**  
     - **Principle 2 says:** Yes, if the embryo has a future of value. Destroying it without justification is a loss.  
     - **But:** No *individual* is obligated unless they created/assumed responsibility for it (e.g., the parents or the storage facility). Your IVF clinic isn’t obliged to "rescue" it; you might be, given your ongoing custody.  

  2. **Genetic parents disagree on embryo disposition:**  
     - **Principle 2 + consent:** Both parents must consent to any use (transfer/donation/destruction), as the embryo owes its existence to their joint biological contribution. Absent agreement, the default should be preservation (maintaining future value) or donation (if both consent to relinquishing rights). Destruction requires mutual consent.  

  3. **Declining transfer due to financial cost:**  
     - **Principle 1:** "Reasonable cost" includes financial burden. If transfer imposes significant hardship (e.g., $5k + lost wages), ending the pregnancy *without destruction* isn’t required.  
     - **Principle 2:** However, if the fetus can be saved, destruction is impermissible. **Resolution:** The pregnant person must permit transfer if others cover costs; if not, she may end the pregnancy but not the life.  

  ---

  ### **The Price of Holding Your Framework**  
  - **Major Tension:** Principle 2 (future value) demands significant respect for embryos *outside* bodily contexts (frozen embryos, artificial wombs), while Principle 1 (bodily autonomy) permits ending lives *inside* bodies even when alternatives exist. This risks inconsistency: why is a 6-week fetus subject to Principle 1’s "imposition" priority, while a frozen embryo isn’t?  
    - **Your escape hatch:** Ground Principle 2’s force in *relational obligations*. The frozen embryo’s moral weight stems from your deliberate creation and ongoing stewardship—not inherent value alone. This explains why emergency contraception (no stewardship) feels different.  
  - **Consequence:** You must accept that abortion ethics isn’t just about bodies or futures, but about *entanglement*. Creating, sustaining, or inviting dependence generates unique duties.  

  **Final Note:** Your intuitions reflect a coherent *relational* view: life’s value isn’t absolute but interacts with consent, dependency, and imposition. The cost is rejecting pure bodily autonomy (à la Thomson) *and* pure future-value (à la Marquis) as complete accounts. Embrace the complexity—it’s the price of honesty.
