        Comment: The argument that a tendency movement cannot win elections is asserted but not supported. While it seems plausible, historical examples of single-issue movements achieving institutional change without party structures (e.g., some referendums or advocacy groups) might contradict this. The essay needs to address why such a movement must engage in electoral politics to enact abolition.
