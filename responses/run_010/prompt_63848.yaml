prompt: |-
  I came at taxonomy from the wrong end, I think. Years of reading rationalist blogs left me with a very strong prior that arguing about definitions is never a real disagreement — you notice the word is fuzzy, you stipulate a sharper one, you move on, and anyone who keeps fighting is just attached to the sound of the word. Then I started reading about the species problem and it clearly doesn't work like that, and I can't figure out why not.

  Situation as I understand it: people have been arguing about what a species is for something like seventy-plus years. Same organisms, same field data, same museum drawers, and no convergence. The biological species concept crowd say a species is a set of populations that do or could interbreed and are cut off from other such sets by reproductive isolation — and they insist isolation is the causal boundary, not a proxy for it. The phylogenetic/diagnosability crowd say a species is the smallest cluster you can actually pick out by fixed characters and that sits at the tip of a lineage, on the grounds that a category you can't diagnose isn't science, it's bookkeeping. Ecological types say the real unit is defined by its niche and by whatever selection keeps it together. The species-are-individuals people say all of these are making a category mistake, since a species isn't a class with defining properties at all but a spatiotemporally extended particular, so asking for the property is asking the wrong sort of question. Pluralists say several concepts are legitimate and you pick per taxon and per question, and their opponents say that's a surrender that makes counts incomparable across groups. And then there's the move that says there's one theoretical notion — separately evolving metapopulation lineages — with many operational criteria for delimiting it, which sounds like a dissolution until you notice the criteria still disagree in actual cases and someone still has to say which one wins.

  My hypotheses, offered as hypotheses, and I expect at least one is dumb:

  1. The stall is about paradigm cases, not facts. Each concept was built around somebody's favorite taxon — sexually reproducing birds, hybridizing plants, bacteria trading genes sideways, ancient asexual lineages — and each side treats the other's paradigms as pathological edge cases. So they're not disagreeing about the world, they're disagreeing about which slice of life the word is answerable to, and no data settles that.
  2. It's partly verbal but the verbal part has teeth: the term does regulatory work in conservation listings and biodiversity counts, so there's a standing incentive to keep it ambiguous and to insist the dispute is substantive.
  3. I'm wrong and there's a hidden empirical question nobody has actually run: how much of life really has the discrete cluster structure that every one of these concepts quietly assumes. If most of the tree is reticulate or continuous, the debate isn't stalled, it's just unanswered.

  Diagnose it. Which of these, or something else entirely? Ground the diagnosis in the moves people actually make — what does a reproductive-isolation person say when you hand them a bdelloid rotifer or a prokaryotic taxon; what does a diagnosability person say when you hand them an oak genus that hybridizes freely but stays morphologically coherent; what does a pluralist say when you ask why one word should carry three meanings at once. Then tell me what would count as progress given your diagnosis — a distinction, an empirical result, a formal criterion for how discrete clusters have to be, a change of question — or argue that no progress should be expected and say why. And be explicit about where my definitions-are-cheap deflationism is right here and where it misleads me, because I genuinely can't tell if that prior is a tool or a blindfold.

  Don't give me a tour of the concepts and don't bother with citations or a reading list — I have no web access and wouldn't look them up anyway. I want the structure of the disagreement, not the map.

  Last line, exactly, on its own: Verdict: LABEL — load-bearing disagreement in six words or fewer, where LABEL is one of VERBAL, SUBSTANTIVE, DIFFERENT-QUESTIONS, ILL-POSED.
reasoning: |-
  Okay, let me tackle this user's deep dive into the species problem. They're clearly frustrated after coming from a rationalist background where definitions should be cleanly stipulated, but biology stubbornly resists that approach. Their three hypotheses are thoughtful, but I need to dig deeper into why this debate persists.

  First, the user's core confusion: why can't biologists just pick operational definitions and move on? Their rationalist prior says definitions are tools, not truths. But in taxonomy, people fight over "species" as if it's real. The key insight might be that these aren't just semantic differences - each concept reflects a genuine aspect of biological reality that doesn't always align with others.

  Looking at their hypotheses:
  - The paradigm cases idea has merit (birds vs bacteria etc.), but it's incomplete. When a BSC advocate faces asexual rotifers, they don't dismiss them - they either stretch the concept ("potential" interbreeding) or exclude them, revealing that their concept is tied to a specific evolutionary process.
  - The regulatory incentive angle is plausible but secondary. The deeper issue is ontological - what biologists consider "real" units in nature.
  - The hidden empirical question about discreteness is the most penetrating. If life were mostly fuzzy, the debate would dissolve. But since we observe both clusters and continua, the argument persists precisely because both exist.

  The diagnostic moves they asked for are telling:
  - A diagnosability proponent facing hybridizing oaks has to choose between splitting (losing coherence) or lumping (breaking their own rules). This forces them to admit their "operational" criterion has theoretical baggage.
  - Pluralism's weakness surfaces when you ask why one word covers multiple concepts - it reveals that "species" functions as a placeholder for evolutionary independence, even when operationalizations conflict.

  Where the user's deflationism misleads them: in biology, definitions aren't just labels - they're hypotheses about what mechanisms structure biodiversity. The "verbal" dispute is substantive because it's about which evolutionary processes are fundamental.

  The verdict crystallizes this: the core disagreement is over which evolutionary process defines the key unit - gene flow, lineage splitting, niche adaptation etc. Hence "ILL-POSED" - the question "what is a species?" assumes a single answer exists, but biology operates with multiple distinct processes that only sometimes align to produce clear units.

  Progress would look like shifting focus from defining "species" to mapping when/why these processes decouple. The user's prior is right that definitions are tools, but wrong in underestimating how the choice of tool reflects deep theoretical commitments about what matters in evolution.
answer: |-
  Your prior isn't wrong; it's incomplete. Taxonomy *is* arguing about definitions, but the definitions aren't arbitrary—they're proxies for **competing theories about what constitutes a fundamental evolutionary unit**. Your deflationism misleads you by assuming definitions are *only* bookkeeping tools; here, they're **hypotheses about biological reality**. When definitions stall, it's because the underlying biological processes they track are **decoupled in nature**.

  **Diagnosis via Moves:**
  1.  **Reproductive Isolation (BSC) advocate given Bdelloid Rotifers:** "They're an exception proving the rule—asexuals lack true species. Use morphology *operationally*, but it's not theoretically equivalent. Lineages matter, and isolation *causes* lineage independence." *This move defends the primacy of gene flow as the causal mechanism, dismissing asexuals as edge cases requiring different rules.*
  2.  **Diagnosability advocate (PSC) given Hybridizing Oaks:** "Morphological coherence despite hybridization shows gene flow isn't defining the lineage! Stabilizing selection maintains the cluster. Diagnose the *coherent morphological unit*—it's real and operational. Hybrid zones are messy, but the clusters are distinct." *This move elevates pattern (observable clusters) over a specific process (reproductive isolation), arguing pattern *is* the scientific object.*
  3.  **Pluralist asked why one word:** "Because 'species' is a *pragmatic* category for 'separately evolving lineage' in different contexts. For conservation, diagnosability matters; for evolutionary theory, gene flow matters; for microbes, ecology matters. Insisting on one universal criterion ignores biology's complexity—it's not surrender, it's realism." *This move shifts focus from ontology to utility, making the word a context-dependent tool.*

  **Your Hypotheses Assessed:**
  *   **#1 (Paradigm Cases):** **Partially correct.** Taxon bias exists (birds vs. bacteria vs. oaks) and fuels arguments. But it's not *just* about which slice "counts"; it's about **which evolutionary process (gene flow, selection, lineage splitting) is primary** for defining units across life. Data *could* settle it if one process universally created discrete clusters—but it doesn't.
  *   **#2 (Regulatory Incentive):** **Marginal.** Ambiguity *is* exploited in policy, but the core dispute predates modern conservation and persists in purely academic contexts. The incentive is a symptom, not the cause.
  *   **#3 (Hidden Empirical Question):** **Closest to the truth.** The fundamental issue is **the decoupling of evolutionary processes**. Gene flow, morphological stasis, niche adaptation, and lineage divergence often don't align perfectly. Reproductive isolation might create a lineage (BSC), but stabilizing selection maintains a cluster diagnosable by morphology (PSC) *without* current isolation. Horizontal gene transfer blurs lineages entirely. **Discrete clusters exist, but they are produced by different mechanisms in different taxa, and the mechanisms don't always co-occur.** The debate stalls because **each concept captures a real phenomenon, but no single phenomenon defines a universal "unit" across the tree of life.**

  **Progress & Your Prior:**
  *   **Where your deflationism is right:** Insisting on sharp operational definitions *is* crucial for clear communication and testability in specific contexts (e.g., "For this census, we use diagnosable morphological clusters"). The pluralist move *is* often the most practical.
  *   **Where it misleads:** It treats the definition as *only* a label. In taxonomy, the definition embodies a **causal hypothesis about evolutionary structure**. Arguing for "reproductive isolation" isn't just loving the word "species"; it's claiming gene flow is *the* fundamental process creating/maintaining evolutionary units. Fighting over definitions *is* fighting over which process is biologically primary.
  *   **Progress looks like:**
      1.  **Abandoning "species" as a universal theoretical category** and using precise, process-specific terms ("syngameon", "metapopulation lineage", "ecotype").
      2.  **Mapping the discordance:** Rigorous empirical work showing *how often* and *why* different criteria (morphology, genetics, reproduction, ecology) align or conflict across the tree of life. This shifts the question from "What *is* a species?" to "**Under what conditions do different evolutionary processes generate coincident biological units?**"
      3.  **Formalizing lineage concepts:** Developing frameworks (like the "separately evolving metapopulation lineage") that are theory-neutral and then rigorously evaluating *which operational criteria reliably indicate lineage separation* in different contexts.

  **Verdict: ILL-POSED**  
  The core problem isn't verbal disagreement, lack of substance, or different questions. The question "What is a species?" presupposes a single, fundamental, universal unit exists in nature that all concepts approximate. **Biology lacks a single fundamental evolutionary unit.** The discordance arises because different evolutionary processes generate distinct (though often overlapping) units, and no single process dominates universally. The debate stalls because it asks for one answer where nature offers many.
