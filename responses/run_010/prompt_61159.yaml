  I'm slowly working through Part V of the Discourse on the Method, in an old English translation (Veitch, I think), and I've hit the automata-and-beasts stretch and I'm propperly stuck. Not after a general summary of the beast-machine doctrine — I've got the broad shape. It's the mechanics of the argument in this particular bit that I can't get a handle on. Here's the passage, with the lead-in snipped and a ... where I've jumped:

  > ...Such persons will look upon this body as a machine made by the hands of God, which is incomparably better arranged, and adequate to movements more admirable than is any machine of human invention. And here I specially stayed to show that, were there such machines exactly resembling in organs and outward form an ape or any other irrational animal, we could have no means of knowing that they were in any respect of a different nature from these animals; but if there were machines bearing the image of our bodies, and capable of imitating our actions as far as it is morally possible, there would still remain two most certain tests whereby to know that they were not therefore really men. Of these the first is that they could never use words or other signs arranged in such a manner as is competent to us in order to declare our thoughts to others: for we may easily conceive a machine to be so constructed that it emits vocables, and even that it emits some correspondent to the action upon it of external objects which cause a change in its organs; for example, if touched in a particular place it may demand what we wish to say to it; if in another it may cry out that it is hurt, and such like; but not that it should arrange them variously so as appositely to reply to what is said in its presence, as men of the lowest grade of intellect can do. The second test is, that although such machines might execute many things with equal or perhaps greater perfection than any of us, they would, without doubt, fail in certain others from which it could be discovered that they did not act from knowledge, but solely from the disposition of their organs: for while Reason is an universal instrument that is alike available on every occasion, these organs, on the contrary, need a particular arrangement for each particular action; whence it must be morally impossible that there should exist in any machine a diversity of organs sufficient to enable it to act in all the occurrences of life, in the way in which our reason enables us to act. Again, by means of these two tests we may likewise know the difference between men and brutes. For it is highly deserving of remark, that there are no men so dull and stupid, not even idiots, as to be incapable of joining together different words, and thereby constructing a declaration by which to make their thoughts understood; and that on the other hand, there is no other animal, however perfect or happily circumstanced which can do the like. Nor does this inability arise from want of organs: for we observe that magpies and parrots can utter words like ourselves, and are yet unable to speak as we do, that is, so as to show that they understand what they say; in place of which men born deaf and dumb, and thus not less, but rather more than the brutes, destitute of the organs which others use in speaking, are in the habit of spontaneously inventing certain signs by which they discover their thoughts to those who, being usually in their company, have leisure to learn their language. And this proves not only that the brutes have less Reason than man, but that they have none at all: for we see that very little is required to enable a person to speak; and since a certain inequality of capacity is observable among animals of the same species, as well as among men, and since some are more capable of being instructed than others, it is incredible that the most perfect ape or parrot of its species, should not in this be equal to the most stupid infant of its kind, or at least to one that was crack-brained, unless the soul of brutes were of a nature wholly different from ours. And we ought not to confound speech with the natural movements which indicate the passions, and can be imitated by machines as well as manifested by animals; nor must it be thought with certain of the ancients, that the brutes speak, although we do not understand their language. For if such were the case, since they are endowed with many organs analogous to ours, they could as easily communicate their thoughts to us as to their fellows. It is also very worthy of remark, that, though there are many animals which manifest more industry than we in certain of their actions, the same animals are yet observed to show none at all in many others: so that the circumstance that they do better than we does not prove that they are endowed with mind, for it would thence follow that they possessed greater Reason than any of us, and could surpass us in all things…

  What I can't work out:

  1. He sets up two tests and then, as far as I can tell, only ever applies the first one. The second (the "did not act from knowledge, but solely from the disposition of their organs" one, the adaptability point) is aimed at the human-shaped machines. But then he pivots with "by means of these two tests we may likewise know the difference between men and brutes" and everything after that is about words — magpies, parrots, the deaf and dumb. So where does test two go? Is it doing any independent work against animals, or has he quietly collapsed the two into one?

  2. What is "Reason is an universal instrument that is alike available on every occasion" actually claiming — universal as in domain-general, or something stronger? And is "act from knowledge" a term of art for him here? Does it mean act on a representation, act on a proposition, or act for a reason? The whole second test turns on it and I can't pin the sense down.

  3. The machine comparison seems to me to cut the other way. He calls the animal body "a machine made by the hands of God, which is incomparably better arranged… than is any machine of human invention," and then says that if there were a machine exactly resembling an ape we "could have no means of knowing" it differed in nature from the real ape. So the ape-machine thought experiment buys us… nothing? Is it a point about the limits of what we can know from the outside, or is it a way of saying the real ape just is the machine so there's no further question to ask? And doesn't "incomparably better arranged" concede the animals have something rather than nothing?

  4. "unless the soul of brutes were of a nature wholly different from ours" — I can't parse the logic of that clause. He's just argued brutes can't speak, therefore they have no reason at all; but the "unless" makes it sound like the real explanation is that their souls differ in kind, which feels like a different claim. Is "soul" here mind, or the principle that keeps the body warm and moving? If it's the second, is that sentence even saying the same thing as the one before it?

  5. The closing bit about animals that "manifest more industry than we in certain of their actions": I think it's meant as a reductio — if doing something better than us proved they had mind, then since they beat us at some things they'd have to beat us at everything. Is that the argument? It looks like it needs a hidden premise that reason is one single uniform capacity that gets exercised equally across all domains, and I want to know whether he's earned that premise by this point or is just assuming it.

  6. The one that confuses me most: "the natural movements which indicate the passions, and can be imitated by machines as well as manifested by animals." So animals manifest the passions? I'd always been told the Cartesian line was that animals are clocks that don't feel anything whatsoever. Does this wording commit him to animals having passions (and so sensations), with only thought/reason denied to them? Or is "manifested" doing sneaky work — the movements manifest while nothing is felt? Say which reading the sentence actually supports and what would settle it, and tell me if the two readings even come apart given the rest of the passage.

  Also — and I mean this — which of my readings above are just flat wrong? I'd rather be told I've misread a sentence than have all six questions answered politely.
