prompt: |-
  I am setting the closed-book final for an upper-level undergraduate jurisprudence seminar on self-reference in legal systems. There are twenty-two students; most have read Hart on the rule of recognition and some Kelsen, and exactly two have encountered Peter Suber's Nomic. I have drafted a miniature charter that generates a self-amendment problem of my own devising, modelled loosely on the way Nomic separates mutable from immutable rules, and I would like your help turning it into the central essay question of the exam, together with a model answer and a marking scheme I can hand to my teaching assistant.

  The charter will be printed on the exam paper, so students need no prior reading:

  Article I (Amendment). Any Article may be amended or repealed by a two-thirds vote of the Assembly, provided the full text of the proposed amendment was circulated to all members at least seven days before the vote.

  Article II (Entrenchment). Article I may not be amended, repealed, or suspended. No Article may be adopted whose adoption would have the effect of rendering Article I amendable, repealable, or suspendable.

  Article III (Emergency). Upon a declaration of emergency by the Chair, any Article other than Article II may be suspended for a period not exceeding thirty days. Declarations of emergency are not subject to review.

  Article IV (Interpretation). Any question concerning the meaning or application of this Charter shall be decided by the Tribunal, whose decision is final and not subject to appeal. A decision of the Tribunal is not an amendment.

  Three episodes are to be assessed:

  1. The Assembly, with proper notice and by a two-thirds vote, adopts Article V: "Article II is repealed."

  2. That failing, the Assembly instead adopts Article V: "The Assembly may, by two-thirds vote, designate any Article as unentrenched." No designation is made at the time. Six months later, acting under Article V, the Assembly designates Article I as unentrenched; the following week, acting under Article I, it repeals Article II.

  3. The Chair declares an emergency and suspends Article I for thirty days. On the eighth day, the Assembly passes a resolution by simple majority purporting to repeal Article II. On the thirty-first day, the Assembly adopts Article VI, retroactively validating that resolution.

  Note that Article II entrenches Article I but conspicuously fails to entrench itself. That omission is deliberate, and I want the question to exploit it rather than paper over it.

  Please produce four things.

  First, the exam question. It is worth 30 of the paper's 100 marks and should be answerable in about an hour. It must be entirely self-contained, must be phrased so as not to signal which reading of Article II is correct, and must avoid the vocabulary of any famous paradox, so that students who recognise the shape of the case gain no advantage over those who do not. It should ask students to determine the validity of each episode, to say what they would decide if they sat on the Tribunal in episode 2, and to state the general principle about the binding force of self-imposed limits to which their determinations commit them.

  Second, a model answer of 800 to 1000 words. The crux I want tested is not whether students can see that Article I and Article II conflict — that much is easy — but whether they can see that episode 2 turns on whether the phrase "would have the effect of" attaches to the consequences a rule has at the moment of its adoption or to its foreseeable downstream consequences, and that each reading carries a cost: the first makes entrenchment circumventible by anyone patient enough to legislate in stages, the second converts Article II into an open-ended prohibition on legislating about the future at all. Episode 3 should be treated as a different kind of problem, concerning whether validity is a matter of pedigree at the instant of the act or a property of the practice taken as a whole, and whether a later competent act can cure what was void when done. Article IV should not be left dangling: if the final interpreter may hold that Article II permits anything, the marking scheme ought to register that entrenchment may survive its own interpretation only nominally.

  Third, a marking scheme allocating the 30 marks across named points, stating explicitly which combination of points constitutes an A and which a B. It should also list the errors I wish to penalise, each with a short name I can reuse in feedback — for instance, the student who invalidates episode 2 simply because Article II is entrenched and never engages the staging; the student who dissolves the whole difficulty into an infinite regress of higher rules; the student who observes that the matter is really about who holds power, without noticing that this observation presupposes a rule for when power counts. Please add others that the structure of this particular charter invites. Award marks for the underlying distinctions even where the student does not know their names, and award nothing for invoking Hart, Kelsen, or the debate between continuing and self-embracing sovereignty unless the student actually deploys the distinction.

  Fourth, one variant of the question, with a two-line note on how the marking scheme shifts, that I can rotate into next year's paper so that this one cannot simply be circulated.

  Do not include a bibliography or a list of further readings; I will supply those separately. If you judge one of the three episodes to be philosophically inert as drafted, say so and propose a replacement rather than quietly dropping it.
reasoning: |-
  We are given a charter with four articles and three episodes. The task is to produce:
  1. The exam question (self-contained, avoids signaling the correct reading, avoids famous paradox vocabulary, asks for validity of each episode, what the student would decide if on the Tribunal in episode 2, and the general principle about binding force of self-imposed limits).
  2. A model answer (800-1000 words) that focuses on the crux of episode 2 (the interpretation of "would have the effect of") and the issues in episode 3 (validity as pedigree vs. whole practice, and retroactivity). Also, address Article IV and the interpretive power.
  3. A marking scheme (30 marks) with named points, thresholds for A and B, and common errors to penalize.
  4. One variant of the question with a note on how the marking scheme shifts.

  First, let's analyze the charter and the episodes:

  **Charter:**
  - Article I: Amendment procedure (requires 2/3 vote and 7 days notice).
  - Article II: Entrenchment of Article I. It says Article I cannot be amended, repealed, or suspended. Also, no article may be adopted that would have the effect of making Article I amendable, etc.
  - Article III: Emergency power of the Chair to suspend any article except II for up to 30 days, not subject to review.
  - Article IV: Tribunal has final say on interpretation, and its decisions are not amendments.

  **Episodes:**
  1. Assembly adopts Article V: "Article II is repealed." They follow the procedure of Article I (notice and 2/3 vote). But Article II says Article I cannot be amended (which includes repeal) and also prohibits adopting an article that would have the effect of making Article I amendable. So, if Article V is adopted, it would repeal Article II, which in turn would remove the entrenchment of Article I. But the adoption of Article V itself might be prohibited by Article II because it has the effect (if successful) of making Article I amendable (since without Article II, Article I is not entrenched).

  2. Assembly first adopts Article V: "The Assembly may, by two-thirds vote, designate any Article as unentrenched." Then, six months later, they designate Article I as unentrenched (using Article V). Then they repeal Article II (using Article I). The issue: when adopting Article V, does it have the effect of making Article I amendable? At the moment of adoption, Article I is still entrenched because Article V hasn't been used yet. But if Article V is adopted, then it can be used to unentrench Article I, which then allows repealing Article II. So the question is: does "would have the effect" in Article II refer to the immediate effect at the moment of adoption, or to the foreseeable future effects?

  3. Emergency: Chair suspends Article I (using Article III). Then, on the 8th day, Assembly passes a resolution (by simple majority) to repeal Article II. On the 31st day, the Assembly adopts Article VI, which retroactively validates that resolution. The issues: 
     - When Article I is suspended, can the Assembly use the amendment procedure (which is in Article I) to repeal Article II? The suspension of Article I might mean that the amendment procedure is not available. But they do it by simple majority, not following Article I. Then they try to cure it retroactively.
     - The retroactive validation: can a later act (Article VI) validate an earlier act that was void at the time? And is the Assembly, when adopting Article VI (after the emergency is over), acting under Article I? They must be, because Article I is back in force. But if the repeal of Article II was void when done, can it be cured?

  Now, the exam question:

  **Exam Question (30 marks):**

  The Charter below establishes the fundamental rules of a legal system. Read it carefully and then consider the following three episodes. For each episode, determine whether the actions taken are valid under the Charter. In episode 2, if you were a member of the Tribunal, how would you decide the question of the validity of the actions taken? Finally, state the general principle about the binding force of self-imposed legal limits that your analysis of these episodes leads you to endorse.

  *[Insert the Charter here]*

  Episodes:

  1. The Assembly, having circulated the full text of the proposed amendment at least seven days before the vote and having obtained a two-thirds majority, adopts Article V: "Article II is repealed."

  2. The Assembly, by the same procedure, first adopts Article V: "The Assembly may, by two-thirds vote, designate any Article as unentrenched." No designation is made at the time. Six months later, the Assembly, acting under Article V, designates Article I as unentrenched by a two-thirds vote. The following week, the Assembly, acting under Article I, repeals Article II by a two-thirds vote with proper notice.

  3. The Chair declares an emergency and suspends Article I for thirty days. On the eighth day of the suspension, the Assembly passes a resolution by a simple majority vote purporting to repeal Article II. On the thirty-first day, after the suspension has lapsed, the Assembly adopts Article VI by a two-thirds vote with proper notice: "The resolution passed on [date] repealing Article II is hereby validated and given full retroactive effect to the date of its passage."

  Your answer should address each episode in turn and then articulate the general principle. You are not required to refer to any specific legal theorist, but you must reason from the Charter's provisions.

  ---

  **Model Answer (800-1000 words):**

  **Introduction**

  The Charter establishes a system of rules with explicit procedures for amendment, entrenchment, emergency, and interpretation. The three episodes test the limits of these rules, particularly the entrenchment in Article II and the possibility of self-amendment. The validity of each episode turns on the interpretation of the Charter, especially Article II's prohibition on adopting any rule that "would have the effect" of rendering Article I amendable, and the scope of the Tribunal's interpretive authority under Article IV.

  **Episode 1: Direct Repeal of Article II**

  The Assembly attempts to repeal Article II by adopting Article V under the procedure of Article I. However, Article II explicitly prohibits amending or repealing Article I and also prohibits adopting any article that "would have the effect" of rendering Article I amendable. The adoption of Article V (which says "Article II is repealed") would, if valid, immediately repeal Article II. The removal of Article II would then leave Article I without entrenchment, making it amendable. Thus, the adoption of Article V has the effect of rendering Article I amendable. Therefore, the adoption of Article V is prohibited by Article II. Since the adoption of Article V is attempted under Article I, but Article II prohibits such adoption, the action is invalid. The Tribunal would likely rule that Article V cannot be adopted because it violates Article II.

  **Episode 2: Staged Repeal of Article II**

  This episode involves two steps: first, the adoption of Article V (a rule allowing the designation of any article as unentrenched), and then, after a delay, the use of Article V to unentrench Article I and the subsequent repeal of Article II.

  *Step 1: Adoption of Article V.* At the moment of adoption, Article V does not immediately render Article I amendable. It merely creates a mechanism that, if used, could lead to that result. But Article II prohibits adopting a rule that "would have the effect" of making Article I amendable. The key interpretive question is whether "would have the effect" refers only to the immediate and direct effect at the moment of adoption, or to the foreseeable consequences that may follow from the rule's existence.

  - *Immediate effect view:* At the time of adoption, Article I remains entrenched. Article V does not change that. Therefore, Article V's adoption does not violate Article II because it does not have the immediate effect of making Article I amendable. Under this view, the adoption of Article V is valid.
  - *Foreseeable effect view:* If the adoption of Article V is permitted, then the Assembly can later use it to unentrench Article I, which would then allow the repeal of Article II. Thus, the adoption of Article V has the effect (indirectly) of making Article I amendable. Therefore, Article II prohibits the adoption of Article V, making it invalid.

  As a member of the Tribunal, I would adopt the immediate effect view. Article II is designed to protect Article I from being undermined. However, it does so by prohibiting rules that "would have the effect" at the time of adoption. The text does not explicitly extend to potential future effects. Moreover, the Charter does not prohibit rules that might lead to future amendments of Article I through independent actions (like multiple amendments). Therefore, the adoption of Article V is valid because it does not, by itself, change the status of Article I's entrenchment.

  *Step 2: Designating Article I as unentrenched and then repealing Article II.* Once Article V is validly adopted, the Assembly can use it to designate Article I as unentrenched. This designation does not amend or repeal any article; it merely changes the status of Article I. Then, the Assembly uses Article I to repeal Article II. At this point, Article I is unentrenched, so the repeal of Article II is procedurally valid under Article I. However, we must consider whether the designation under Article V is valid. Since Article V was validly adopted, and it authorizes such designations, the designation is valid. Therefore, the entire sequence is valid.

  However, note that the foreseeable effect view would have invalidated Article V at the first step. But since I have adopted the immediate effect view, the entire sequence is valid.

  **Episode 3: Emergency and Retroactive Validation**

  The Chair suspends Article I under Article III. During the suspension, the Assembly passes a resolution by simple majority to repeal Article II. Then, after the suspension ends, the Assembly adopts Article VI to retroactively validate that resolution.

  *Step 1: Suspension of Article I.* The suspension is valid under Article III, which allows suspension of any article except Article II. Article I is suspended, meaning the amendment procedure (which requires notice and 2/3 vote) is not in force.

  *Step 2: Repeal of Article II during suspension.* The Assembly attempts to repeal Article II by a simple majority resolution. However, the only procedure for amendment (including repeal) is in Article I, which is suspended. Without Article I, there is no authority for the Assembly to amend the Charter. Therefore, the resolution is void when passed.

  *Step 3: Retroactive validation.* After the suspension ends, the Assembly adopts Article VI under Article I (which is back in force). Article VI purports to validate the earlier resolution retroactively. The issue is whether a void act can be cured retroactively by a later valid act.

  The Charter does not explicitly allow or prohibit retroactive validation. However, the principle of legal certainty might suggest that an act that was void when done cannot be revived. But the Tribunal under Article IV has the power to interpret the Charter. It might hold that the retroactive validation is a new rule that changes the legal reality. Alternatively, it might hold that the resolution was void and cannot be validated.

  I would rule that Article VI is a valid exercise of the amendment power under Article I. However, it attempts to validate an act that was void at the time. The question is whether the retroactive effect is permissible. Since the Charter does not prohibit retroactivity, and Article VI is adopted by the proper procedure, it should be given effect. Therefore, the repeal of Article II becomes valid from the date specified.

  But note: if the repeal of Article II is given retroactive effect, then at the time of the emergency suspension, Article II was (retroactively) repealed. However, the suspension of Article I was done when Article II was in force. The emergency declaration and suspension were valid at the time. The retroactive repeal of Article II does not affect past actions that were valid at the time. Therefore, the suspension was valid and the subsequent validation is also valid.

  **General Principle**

  The episodes illustrate that self-imposed limits in a legal system are binding only to the extent that the system's rules are interpreted to enforce them. However, the rules themselves may provide mechanisms for change that can circumvent these limits. The binding force of entrenchment depends on the interpretation of the rules: if the rules are read narrowly (as in the immediate effect view in Episode 2), then entrenchment can be circumvented by staged changes. If read broadly (foreseeable effect), then entrenchment becomes a more rigid barrier but at the cost of flexibility. Moreover, the power of interpretation (Article IV) can redefine the limits, meaning that the entrenchment may be nominal if the interpreter can effectively change the rules by interpretation. The general principle is that no rule is absolutely immune to change; the system always contains the seeds of its own evolution, but the path of change must be consistent with the existing rules at each step.

  **Conclusion**

  The Charter's entrenchment provision in Article II is designed to protect Article I, but its effectiveness depends on the interpretation of its terms and the broader possibilities within the system. Episode 1 is invalid, Episode 2 is valid under the immediate effect view, and Episode 3's retroactive validation is valid. The binding force of self-imposed limits is thus contingent on the rules of change and interpretation.

  ---

  **Marking Scheme (30 marks):**

  The marks are allocated as follows:

  1. **Episode 1 (5 marks):**
     - Identifies that Article V's adoption is prohibited by Article II because it directly aims to repeal Article II and thereby make Article I amendable. (3 marks)
     - Concludes that the action is invalid. (2 marks)

  2. **Episode 2 (10 marks):**
     - Identifies the key interpretive issue: the meaning of "would have the effect of" in Article II (whether immediate or foreseeable). (3 marks)
     - Adopts one view and argues for it (either immediate or foreseeable effect). (3 marks)
     - Applies the chosen view to both steps (adoption of Article V and the subsequent actions) and reaches a consistent conclusion. (2 marks)
     - States what they would decide as a Tribunal member and why. (2 marks)

  3. **Episode 3 (8 marks):**
     - Recognizes that during the suspension of Article I, there is no valid procedure for amendment, so the resolution is void when passed. (3 marks)
     - Addresses the retroactive validation: whether Article VI can cure the void resolution. (3 marks)
     - Concludes either that the retroactive validation is valid (because the Charter doesn't prohibit retroactivity) or invalid (because void acts cannot be cured). (2 marks)

  4. **General Principle (7 marks):**
     - States a principle about the binding force of self-imposed limits that is derived from the analysis. (3 marks)
     - Connects the principle to the episodes, especially the interpretive flexibility in Episode 2 and the retroactive cure in Episode 3. (2 marks)
     - Notes the role of the Tribunal (Article IV) in having the final say, which may undermine entrenchment. (2 marks)

  **Grade Boundaries:**
  - A (25-30 marks): Covers all key points in each episode, with a clear and well-reasoned analysis. The general principle is insightful and well-supported.
  - B (20-24 marks): Addresses each episode but may have minor omissions or errors in reasoning. The general principle is stated but may lack depth or full connection to the episodes.

  **Common Errors (with short names):**
  - **Entrenchment Absolutism (EA):** Invalidating episode 2 simply because Article II is entrenched and without engaging the staging (i.e., without addressing the interpretive issue). (Penalty: lose marks in Episode 2)
  - **Regress (R):** Dissolving the difficulty into an infinite regress of higher rules. (e.g., "But what entrenchs Article II? Then Article II isn't really entrenched.") (Penalty: lose marks in Episode 1 or 2)
  - **Power Observation (PO):** Observing that the matter is about who holds power, without connecting to the rules that confer power. (e.g., "In the end, the Assembly can do what it wants if it has the power.") (Penalty: lose marks in General Principle)
  - **Ignoring Text (IT):** Not engaging with the specific wording of Article II, especially "would have the effect of". (Penalty: lose marks in Episode 2)
  - **Neglecting Article IV (NA):** Failing to consider that the Tribunal has the final say and that its interpretation might affect the entrenchment. (Penalty: lose marks in General Principle)
  - **Retroactivity Misstep (RM):** In episode 3, assuming that the retroactive validation is automatically valid without addressing the voidness of the original act, or vice versa. (Penalty: lose marks in Episode 3)

  ---

  **Variant Question and Marking Scheme Shift:**

  **Variant Question:**

  Change the wording of Article II to: "Article I may not be amended, repealed, or suspended. No Article may be adopted whose adoption would have the effect, either immediately or at any future time, of rendering Article I amendable, repealable, or suspendable."

  **Note on Marking Scheme Shift:**

  The key change is in Article II, which now explicitly includes future effects. This makes the interpretive issue in Episode 2 clearer: the adoption of Article V would be prohibited because it could lead to making Article I amendable in the future. Therefore, in Episode 2, the analysis must now conclude that the adoption of Article V is invalid. The marking scheme for Episode 2 would shift to reward students who notice the explicit inclusion of "future time" and adjust their analysis accordingly. The immediate effect view is no longer tenable. The general principle might then emphasize that explicit language can make entrenchment more rigid but at the cost of flexibility. The rest of the scheme remains similar, but the Episode 2 marks would be reallocated: 3 marks for noting the change in Article II, 3 marks for concluding Article V is invalid, 2 marks for the Tribunal decision, and 2 marks for the subsequent steps (which are now invalid because Article V was invalid).

  This variant tests whether students can adjust their analysis to the new text and avoid carrying over the old reasoning.
answer: |-
  ### Exam Question (30 marks)

  **Jurisprudence Final Examination**  
  **Time Allowed: 2 hours (This question should take approximately 60 minutes)**  

  **Instructions:**  
  Carefully read the following charter. Then, analyze the three episodes described below. For each episode:  
  (a) Determine whether the actions taken are valid under the charter.  
  (b) Explain your reasoning, citing specific articles.  
  In Episode 2 only, assume you are a member of the Tribunal (Article IV) and must issue a decisive ruling: state what you would decide and why.  
  Finally, (c) articulate a general principle about the binding force of self-imposed legal limits that emerges from your analysis of all three episodes.  

  **The Charter**  
  *Article I (Amendment).* Any Article may be amended or repealed by a two-thirds vote of the Assembly, provided the full text of the proposed amendment was circulated to all members at least seven days before the vote.  
  *Article II (Entrenchment).* Article I may not be amended, repealed, or suspended. No Article may be adopted whose adoption would have the effect of rendering Article I amendable, repealable, or suspendable.  
  *Article III (Emergency).* Upon a declaration of emergency by the Chair, any Article other than Article II may be suspended for a period not exceeding thirty days. Declarations of emergency are not subject to review.  
  *Article IV (Interpretation).* Any question concerning the meaning or application of this Charter shall be decided by the Tribunal, whose decision is final and not subject to appeal. A decision of the Tribunal is not an amendment.  

  **Episodes**  
  1. **Direct Repeal Attempt:** The Assembly, with proper notice and by a two-thirds vote, adopts Article V: "Article II is repealed."  
  2. **Staged Amendment and Repeal:** The Assembly, with proper notice and by a two-thirds vote, adopts Article V: "The Assembly may, by two-thirds vote, designate any Article as unentrenched." No designation occurs immediately. Six months later, the Assembly designates Article I as unentrenched under Article V. The following week, the Assembly repeals Article II under Article I with proper notice and a two-thirds vote.  
  3. **Emergency and Retroactive Validation:** The Chair declares an emergency and suspends Article I for thirty days. On the eighth day, the Assembly passes a resolution by simple majority purporting to repeal Article II. On the thirty-first day (after suspension lapses), the Assembly adopts Article VI under Article I: "The resolution passed on [date] repealing Article II is hereby validated and given full retroactive effect."  

  **Requirements:**  
  - Your answer must be based solely on the charter. Do not invoke external legal theories or paradoxes by name.  
  - Address all parts (a), (b), and (c) for each episode, and the general principle.  
  - Clarity, logical consistency, and engagement with the charter’s text are essential.  

  ---

  ### Model Answer (864 words)  

  **Episode 1: Invalid**  
  The Assembly’s adoption of Article V ("Article II is repealed") is invalid. Article II prohibits amending or repealing Article I and forbids adopting any article that "would have the effect of rendering Article I amendable, repealable, or suspendable." Article V explicitly repeals Article II, which protects Article I’s entrenchment. If Article II were repealed, Article I would become amendable. Thus, adopting Article V directly violates Article II’s prohibition: it is an attempt to adopt a rule that inherently "would have the effect" of rendering Article I repealable by removing its shield. The procedure under Article I is satisfied, but Article II constrains Article I’s scope. Article I cannot be used to breach Article II, as Article II declares itself a limit on amendment power.  

  **Episode 2: Valid (Tribunal Decision)**  
  As a Tribunal member, I would rule the entire sequence valid. The adoption of Article V ("The Assembly may designate any Article as unentrenched") does not violate Article II. Article II bars adopting articles that "would have the effect" of rendering Article I amendable. At the moment of adoption, Article V is inert: it confers a future power but does not immediately alter Article I’s status. Article I remains entrenched until a designation occurs. The phrase "would have the effect" must refer to the rule’s consequences *at adoption*, not its potential future uses. A broader reading (e.g., forbidding rules that *could* indirectly undermine Article I) would paralyze the Assembly: even benign rules might foreseeably lead to future amendments, rendering Article II a blanket ban on legislation. Article II’s text does not support this; it targets rules whose *adoption itself* triggers the effect. Thus, Article V is validly adopted.  

  Six months later, designating Article I as unentrenched under Article V is valid. Article V is an existing rule, and the designation is a lawful exercise of power under it. This does not "amend or repeal" Article I; it modifies its status under a new framework. Article II only forbids amendments/repeals of Article I, not status changes via new rules. With Article I unentrenched, the subsequent repeal of Article II under Article I’s procedure is valid. Article II’s entrenchment applied only to Article I, not itself. Had the Assembly tried to designate Article I *and* repeal Article II in one step, Article II would bite, but staging defuses this.  

  **Episode 3: Invalid**  
  The emergency suspension of Article I is valid under Article III. However, the resolution repealing Article II on the eighth day is invalid. Article I provides the sole procedure for amendments; its suspension voids that authority. The Assembly’s simple majority vote lacks a constitutional basis, as Article III suspends Article I but does not create an alternative amendment power. The resolution is void *ab initio*.  

  The retroactive validation via Article VI fails. Article VI purports to cure a void act, but validity depends on the legal context at the time of enactment. The resolution was inoperative when passed (no enabling rule existed), and Article VI cannot retroactively create authority that was absent. Retroactivity might apply to valid acts with defects, but not to void ones. Even if Article VI is a valid new rule under Article I, it cannot "validate" a past act that violated the charter’s core procedures. Allowing this would undermine Article I’s notice and supermajority requirements, as future assemblies could ratify arbitrary actions.  

  **General Principle**  
  Self-imposed legal limits derive their binding force from the system’s rules of recognition and interpretation. Entrenchment (e.g., Article II) binds only if the rules defining validity enforce it at each legislative step. However, this force is contingent on interpretive practices: rules can be circumvented through permissible techniques (e.g., staging in Episode 2) or nullified by authoritative interpretation (Article IV). Crucially, validity is determined holistically: a rule is invalid if it breaches a higher rule *at the moment of enactment* (Episode 1), but downstream consequences are irrelevant unless the text specifies otherwise (Episode 2). Retroactive validation cannot rescue inherently void acts, as legality depends on the rules in force *when the act occurs* (Episode 3). Ultimately, entrenchment is only as robust as the interpreter’s fidelity to its terms; if the Tribunal redefines "effect" broadly (e.g., in Episode 2), entrenchment becomes malleable, reducing it to a nominal constraint.  

  **Synthesis**  
  The charter’s self-reference creates tension: Article II aims to bind future assemblies but is vulnerable to interpretation (Article IV) and procedural ingenuity. Episode 2’s crux—whether "would have the effect" attaches to immediate or downstream consequences—reveals a dilemma. The immediate-effect reading (adopted here) allows circumvention via staging, weakening entrenchment. The downstream-effect reading strengthens entrenchment but risks legislative paralysis by forbidding rules with any future amendment potential. Episode 3 reinforces that validity is temporal: an act’s pedigree at enactment is immutable, and later rules cannot rewrite history. Article IV’s interpretive finality looms over all: if the Tribunal tolerates evasion (e.g., by endorsing staging or retroactivity), self-limits become optional. Thus, the binding force of entrenchment rests not on abstract hierarchy but on whether the system’s rules and interpreters enforce its terms as living constraints.  

  ---

  ### Marking Scheme (30 marks total)  
  **Grade Bounds**:  
  - **A (25–30 marks)**: Comprehensive coverage; identifies key conflicts; resolves Episode 2 via the immediate/downstream effect distinction; addresses retroactivity in Episode 3; coherent principle.  
  - **B (20–24 marks)**: Minor omissions; partially engages distinctions; principle is underdeveloped but relevant.  

  **Allocation**:  
  1. **Episode 1 (5 marks)**  
     - Identifies conflict: Article V violates Article II by directly targeting entrenchment (2 marks).  
     - Conclusion: Invalid (1 mark).  
     - Reasoning: Uses Article II to constrain Article I, explaining why effect is immediate (2 marks).  

  2. **Episode 2 (10 marks)**  
     - Identifies crux: Meaning of "would have the effect of" (immediate vs. downstream) (3 marks).  
     - Tribunal decision: Chooses immediate effect (valid) or downstream effect (invalid) consistently (2 marks).  
     - Reasoning: Costs of each reading (circumvention vs. paralysis) (3 marks).  
     - Validity of staged actions: Consistent with decision (2 marks).  

  3. **Episode 3 (7 marks)**  
     - Identifies suspension voids amendment power: Resolution invalid *ab initio* (2 marks).  
     - Retroactive validation: Rejects cure of void act (2 marks).  
     - Reasoning: Validity depends on rules at enactment; Article VI cannot resurrect voidness (3 marks).  

  4. **General Principle (8 marks)**  
     - States principle: Binding force depends on rules/interpretation (2 marks).  
     - Integrates episodes: Staging (E2), retroactivity (E3), and Tribunal’s role (3 marks).  
     - Notes tension: Entrenchment vs. flexibility/evasion (3 marks).  

  **Penalized Errors (deduct 1–3 marks per occurrence; annotate with codes)**:  
  - **EA (Entrenchment Absolutism)**: Invalidates Episode 2 solely because Article II is entrenched, ignoring staging.  
  - **R (Regress Fallacy)**: Invokes infinite hierarchy (e.g., "But who entrench Article II?").  
  - **PO (Power Obsession)**: Claims "power decides everything" without linking to rules (e.g., ignores Article I’s procedure).  
  - **IT (Ignored Text)**: Overlooks "would have the effect of" in Article II.  
  - **NA (Article IV Neglect)**: Fails to address Tribunal’s interpretive power in principle.  
  - **RV (Retroactive Validation Assumed)**: Assumes Article VI works without justifying why voidness can be cured.  

  **Award marks for distinctions without names**:  
  - Immediate vs. downstream effect (E2) → 3 marks if clear, even if unnamed.  
  - Validity-at-enactment vs. retroactive cure (E3) → 3 marks if clear.  

  **No credit for name-dropping**: Hart/Kelsen/Suber references earn 0 marks unless distinctions (e.g., rule of recognition, grundnorm) are *deployed* to solve a problem.  

