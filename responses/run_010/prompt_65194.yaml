prompt: |-
  Me and my roommate have been arguing about the paradox of fiction for weeks and we finaly agreed to do the thing we should have done first: write the joint statement an adversarial collaboration would produce. He's the Walton type — what we feel for characters are quasi-emotions, generated inside a game of make-believe. I'm thought theory — the fear and the grief are the real thing, they just don't need a belief that the object exists.

  Draft the document we could both sign. I want the claims we can agree on (including about the stock cases: flinching at the monster, sobbing when the dog dies), the disagreements that survive, each worded so the side being described would accept the wording as its own, and the cruxes — meaning only the sub-questions where settling them would actually move one of us. For each crux, give the case or empirical finding both of us would accept as bearing on it plus each side's prediction written down in advance, because that's the part we keep ducking.

  Run it all through the case that started the fight: she cried through a film, then, knowing perfectly well the character was invented, paid a fanfic writer to give him a different ending, and still won't reread the last chapter "because she'd have to watch him die again."

  Format: numbered agreed claims, then a table with exactly these columns — crux | disagreement in neutral wording | evidence both sides accept as relevant | make-believe prediction | thought-theory prediction. Finish with two or three sentences saying which part of our fight is really just about the word "genuine." American English, please.
