  Finally, the counterfactual: what would a cosmopolitan approach look like? Subsidies without consumption restrictions. Could that achieve the same goals, or is restricting choice necessary? The user is after the argument structure, not references.

  Deep needs: The user is likely struggling to untangle the philosophical contradictions without bias. They need a clear framework to analyze the presuppositions, tensions, and implications. They might also want to present a balanced view that acknowledges valid points on both sides without taking a stance. Ensuring the analysis addresses each part of their query systematically is crucial. They might be concerned about overlooking nuances in nationalist vs. cosmopolitan arguments, so thorough exploration of each aspect is key.
answer: |-
  Here’s an analysis of the philosophical presuppositions underlying cultural protectionism, structured to address your core questions:

  ### I. Theory of Value: Non-Individualist and Endogenous Preferences
  - **The Non-Personal "Bearer of Harm"**: The policies presuppose *national culture* as a distinct entity vulnerable to degradation. This culture is conceived as a public good (non-excludable, non-rivalrous) whose value exceeds the sum of individual preferences. Harm arises from cultural homogenization (e.g., French language attrition, displacement of local narratives), not direct individual injury.  
  - **Rejection of Revealed Preference Authority**: Policies implicitly treat preferences as *endogenously shaped by supply*. Unrestricted imports might crowd out domestic content, altering tastes over time (e.g., audiences preferring Hollywood blockbusters due to saturation). Thus, current consumption choices are not authoritative indicators of welfare, as they may reflect distorted cultural ecosystems.  
  - **The Subsidy-Restriction Asymmetry**:  
    - *Subsidies* address production externalities (e.g., high fixed costs for niche-language content).  
    - *Quotas* combat consumption externalities: they preserve cultural "habitat" to maintain diverse preferences and ensure domestic content remains discoverable. Open borders + subsidy alone risk making domestic content a boutique exception rather than a living tradition.  

  **Tension with Free Trade**: Orthodox trade theory treats preferences as exogenous and sovereign; cultural policy rejects this. The state here acts as a *preference curator*, not merely a preference-satisfier—directly contradicting consumer-welfare primacy elsewhere.

  ### II. The Boundary Problem: Nationalism vs. Anti-Essentialism
  - **Nationalism as the Unit of Protection**: The practice assumes the *nation-state* is the relevant vessel for cultural sovereignty. This requires:  
    - A **collective identity** distinct enough to warrant preservation (e.g., French linguistic identity).  
    - **Compatriot Priority**: Domestic artists have special claims as stewards of *this specific* culture, foreign artists (even equally talented) do not.  
  - **Reconciling with Anti-Essentialism**: The state navigates this via:  
    - **Civic-Performative Nationalism**: Culture is defined by participation (e.g., creating "French" art in French, regardless of creator’s birth). Belonging is voluntarist ("commitment"), but the *cultural framework* itself is an inherited structure requiring defense.  
    - **Instrumental Necessity**: Protection targets *institutions* (French cinema, Korean film festivals) that enable democratic self-expression, not fixed ethnic traits. The nation is a practical container for cultural democracy.  

  **Rival Views Ruled Out**:  
  1. **Cosmopolitan Culturalism**: If diversity itself is the good, quotas should protect *all* minority cultures, not privileging the national.  
  2. **Welfarist Individualism**: Rejects aggregate cultural harm as a valid policy object; individual choice is paramount.  
  3. **Pure Diversity Defense**: Would demand global subsidies for vulnerable cultures (e.g., Kurdish cinema), not nationally bounded quotas.

  ### III. Underdetermination: Competing Theories Coexisting
  The practice is compatible with—but not determined by—multiple justifications:  
  - **Infant Industry**: Temporary support for cultural sectors (weak for persistent quotas).  
  - **Linguistic Preservation**: Vital for France/Canada, less so for Korea’s film quotas.  
  - **Democratic Discourse**: Domestic news/drama as a public sphere necessity (e.g., CBC/Radio-Canada).  
  - **Professional Ecosystems**: Avoiding creative brain drain (e.g., Canadian actors needing local work).  
  **Underdetermined Aspect**: *Why nationality?* A linguistic region (Francophonie) or political community (EU) could theoretically serve similar functions. The nation’s primacy reflects pragmatic state capacity, not philosophical necessity.

  ### IV. The Cosmopolitan Counterfactual
  A consistent cosmopolitan regime would entail:  
  - **Global Production Subsidies**: Funded by international bodies or wealthy states, targeting imperiled languages/traditions.  
  - **Translation/Distribution Support**: Maximizing access to diverse content.  
  - **Voucher Systems**: Enabling individual choice (e.g., public funds for citizens to support any cultural product).  
  - **No Consumption Restrictions**: Borders open to all content.  

  **Could It Deliver?**  
  - **Yes**: For *diversity* and *access*. Global subsidies could sustain niche cultures; vouchers might empower marginalized voices.  
  - **No**: For *national cultural sovereignty*. Cosmopolitanism cannot replicate the nationalist premise that *this specific nation’s* cultural continuity is a non-fungible good. Quotas force engagement with domestic culture; vouchers risk funding global franchises. Without restrictions, cultural ecosystems remain vulnerable to market concentration, potentially eroding local artistic infrastructure. The nationalist good—*our* culture as *ours*—requires boundedness.

  **Core Tension**: Cultural protectionism rests on a **communitarian ontology** (culture as collective entity) and **perfectionist liberalism** (shaping preferences for citizens’ "true" interests), directly opposing the **methodological individualism** and **preference neutrality** of free-trade orthodoxy. The state, in this domain, asserts a trustee role over national culture—a claim absent in its treatment of soybeans or semiconductors.
