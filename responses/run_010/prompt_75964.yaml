prompt: |-
  I took early retirement from a chair in low-temperature physics five years ago, after thirty-eight years spent largely on dilution refrigeration and with a lingering affection for the thermodynamics of irreversible processes, and I have since been reading political philosophy with a small group of former colleagues who meet on Tuesday evenings here in Oxford. My instinct, which I have not succeeded in disciplining out of myself, is to treat a proved theorem as a proved theorem: once the hypotheses are granted, the conclusion is not a matter of taste. That habit served me admirably with Bell's theorem, and I suspect it has served me rather less well with Harsanyi's aggregation theorem, so I should like a clear-minded assessment of precisely where the analogy between the two breaks down.

  As I presently understand it, Harsanyi showed that if each individual's preferences over risky prospects satisfy the von Neumann–Morgenstern axioms, and if society's own ranking of those prospects is likewise von Neumann–Morgenstern-rational and defers to unanimity — where unanimity seems to mean no more than that society is indifferent when everyone is indifferent, and prefers a prospect when everyone prefers it — then the social ranking must be representable as a weighted sum of the individual utilities; and since no individual can coherently claim a privileged position, the weights come out equal, so the social ranking is a sum of utilities and nothing else. What strikes me is that this has exactly the architecture of a no-go result: the hypotheses look like bare requirements of coherence plus a minimal deference to the people affected, and the conclusion forecloses an entire family of views. On that reading, distribution-sensitive positions — Rawls's difference principle, prioritarianism, the various egalitarianisms that object to the shape of a distribution rather than to its total — are not rival moral theories competing with utilitarianism on level terms. They are attempts to evade a theorem, and whoever holds one has either failed to notice which hypothesis she is discarding or is discarding it without declaring so. I also gather that the theorem disposes of a difficulty I had assumed was fatal, namely how one is entitled to add together quantities that belong to different persons: if each utility is fixed only up to a rescaling and a shift and the sum is nonetheless well defined, then interpersonal comparability has been secured rather than smuggled in.

  My question is a practical one. A member of the Tuesday group, a retired crystallographer with firm egalitarian commitments and considerably more patience for argument than for formalism, has undertaken to defend the difference principle next month, and I have volunteered to respond. I have no wish to prevail by rhetorical means, and I should not be content with the observation that Harsanyi and Rawls merely disagree about what happens behind the veil of ignorance, which is where our discussions have hitherto stalled. What I want is the cleanest statement of why her position cannot be rendered consistent with the theorem: which single hypothesis she is obliged to surrender, and why surrendering it costs her something she will not wish to pay. Then I should like to know what, on that footing, is left for distribution to do once the sum has been fixed. And if it turns out that I have misstated either the content of the theorem or the standing of its hypotheses — if, for instance, the equal weights, the unanimity condition, or the well-definedness of the sum are carrying more weight than I have allowed — I would much rather learn it from you now than in front of the group on the third Tuesday of next month.
reasoning: |-
  Okay, I need to help this retired physics professor understand where Harsanyi's aggregation theorem breaks down compared to Bell's theorem, especially regarding Rawls's difference principle. Let me start by unpacking his query. He sees Harsanyi's theorem as a no-go result that forces utilitarianism unless you reject one of its premises. But he's aware that egalitarian views like Rawls must reject something, and he wants to pinpoint exactly what and why it matters.

  First, I should recall Harsanyi's theorem clearly. The key assumptions are: individual preferences satisfy vNM axioms, social preferences are vNM-rational, and Pareto conditions (weak and strong). The conclusion is that social welfare is a weighted sum of individual utilities. With equal weights, it's utilitarianism. 

  The professor thinks the premises are minimal coherence and deference to individuals. But Rawls's difference principle clearly conflicts since it maximizes the worst-off, not the sum. So which premise does Rawls reject? The Pareto principles seem solid—everyone prefers A to B, so should society. But maybe the vNM rationality for social preferences? Rawls might argue that social decisions shouldn't follow expected utility axioms because they ignore risk aversion behind the veil of ignorance. 

  Ah, that's a point. Harsanyi assumes both individuals and society are vNM-rational. But Rawls's original position uses maximin, which isn't vNM-compliant because it violates continuity and independence. Maximin isn't linear in probabilities, so it can't be represented by a vNM utility function. So Rawls would reject that society's preferences should obey vNM axioms. 

  But the professor's friend is defending Rawls. If she accepts vNM axioms for individuals, but not for social ordering, that's the break. But why does rejecting social vNM cost something? Because without it, social preferences might not handle risky prospects coherently. For example, intransitive choices or inability to weigh probabilities. But Rawls might argue that social justice shouldn't be reduced to aggregating individual utilities under risk. 

  Also, the Pareto condition. Weak Pareto says if everyone indifferent, society is indifferent. Strong says if everyone prefers A over B, society does too. Rawls might accept weak but not strong? No, strong Pareto seems hard to reject. But what if a change helps some and hurts none? Strong Pareto would require society to prefer it, but Rawls might not if the worst-off isn't better off. But actually, if everyone is better off, even the worst-off, then Rawls would prefer it. The conflict arises when some gain and some lose, but the worst-off improves. Harsanyi's sum might prefer it, but Rawls would too. The issue is when gains to the better-off don't trickle down. 

  Wait, the difference principle only cares about the least advantaged. So if a policy gives huge gains to the top but doesn't change the worst-off, Rawls is indifferent. But if everyone prefers it, including the worst-off? Then Rawls would prefer it. But if the worst-off is indifferent and others gain, Rawls is indifferent, but Pareto says society should prefer it. Here's the conflict: weak Pareto requires society to prefer if everyone prefers. But if the worst-off is indifferent and others gain, Rawls is indifferent, violating strong Pareto. 

  So Rawls must reject strong Pareto. That's the key premise. But rejecting strong Pareto means sometimes society doesn't prefer an option even when everyone does? That sounds problematic. The crystallographer might argue that preferences behind the veil aren't the same as actual preferences. Or that social choice shouldn't always follow preference aggregation when justice is concerned. 

  The professor wants the cleanest reason. So either rejecting social vNM or strong Pareto. But rejecting vNM might be easier; Rawls explicitly critiques the use of expected utility in the original position. He thinks maximin is rational under uncertainty with high stakes. So pointing out that maximin violates vNM axioms (like independence: preferring A over B even when mixed with C) clarifies the trade-off. The cost is that without vNM, social preferences might not be consistent across lotteries, leading to potential intransitivities or inability to prioritize efficiently. 

  On distribution, once sum is fixed, what's left? Harsanyi's theorem assumes vNM utilities, which are cardinal and unit-comparable. But Rawls uses primary goods, not utilities. So interpersonal comparisons are different. The theorem doesn't address distribution beyond the sum because it assumes utilities are already normalized. But Rawls cares about the distribution of primary goods, not utility. So if utilities are linear in primary goods, then sum of utilities would be total primary goods, ignoring distribution. But Rawls argues that the same total with worse distribution to the least advantaged is unjust. So the theorem's setup doesn't capture his concern. 

  To summarize: The crystallographer must reject that social preferences obey vNM axioms. The cost is giving up coherent decisions under risk for society. Alternatively, rejecting strong Pareto, which means society might not respect unanimous strict preferences. The first is more defensible for Rawls. Distribution still matters because utilities might not reflect the value of goods to the worst-off, but Harsanyi assumes they do. So the core issue is the assumption of vNM-rational social preferences.
answer: |-
  Your instinct to treat proved theorems as proved theorems is sound, and your analysis of Harsanyi's aggregation theorem is largely correct—but the analogy with Bell's theorem breaks down in a crucial way: **the normative status of the hypotheses**. While Bell's theorem relies on empirically testable premises about locality and realism, Harsanyi's theorem depends on axioms that encode contestable ethical assumptions. Specifically, Rawls (and your egalitarian colleague) must reject **the application of vNM rationality to the *social* preference ordering**. Here's a precise dissection:

  ### 1. **The Core Conflict: Rejecting vNM Rationality for Society**
     - **Harsanyi's Hypothesis**: Society's preferences over risky prospects must satisfy the von Neumann-Morgenstern (vNM) axioms (completeness, transitivity, continuity, independence).
     - **Rawls's Rejection**: The social choice problem—especially under the "veil of ignorance"—should **not** be modeled as the aggregation of individual vNM utilities. Instead, society should evaluate distributions using the **maximin criterion** (prioritizing the worst-off). Maximin violates vNM rationality:
       - **Independence Axiom Violation**: Maximin rejects the independence of irrelevant alternatives. For example:
         - Suppose society prefers distribution A (utilities: [1, 3]) over B ([0, 4]) because the worst-off is better in A.
         - Under vNM, mixing A and B with a lottery (e.g., 50% chance of A or B) should rank mixtures based on expected utility. Maximin may rank a lottery introducing a worse possible outcome (e.g., [0, 4]) as inferior, even if its expected value is higher.
       - **Continuity Axiom Violation**: Small probability of catastrophe may be intolerable under maximin, violating continuity.

     **Cost of Rejection**:  
     Abandoning vNM rationality for social preferences means society cannot coherently handle risk or uncertainty in policy choices. For example:
     - A policy with a 99% chance of lifting everyone's welfare and 1% chance of minor harm to one person might be rejected under maximin if the minor harm is to the worst-off.  
     - **Trade-off**: Rawls sacrifices *procedural coherence under risk* for *distributional fairness*. Your colleague must defend this as morally necessary.

  ### 2. **Secondary Conflict: Strong Pareto**
     - **Harsanyi's Hypothesis**: If every individual strictly prefers prospect A to B, society must prefer A to B (Strong Pareto).
     - **Rawls's Rejection**: Strong Pareto conflicts with the difference principle when gains to the better-off don't benefit the worst-off. For example:
       - Suppose everyone prefers A ([3, 10]) over B ([2, 10])—Person 1 gains, Person 2 is unaffected.  
       - Strong Pareto requires society to prefer A.  
       - But Rawls is *indifferent* between A and B: the worst-off (Person 1) remains at 2 utils.  
     **Cost of Rejection**: Society may ignore unanimous strict preferences—a radical departure from democratic deference.

  ### 3. **What Distribution Can Still Do?**
     Once utilities are summed (per Harsanyi), distribution is irrelevant. But if your colleague rejects vNM for society, **distribution re-enters**:  
     - Rawls evaluates outcomes based on *primary goods* (e.g., rights, income) rather than vNM utilities.  
     - The "sum" of utilities is replaced by the *position of the least advantaged*.  
     - Example: Society might prefer ([1, 1]) over ([0, 3]) because the worst-off is better, even though total utility is lower.

  ### 4. **Hypotheses You Overstated**
     - **Unanimity ("Weak Pareto")**: You correctly note it only requires society to be indifferent if all are indifferent and to prefer if all prefer. Rawls violates only *Strong* Pareto, not Weak Pareto.  
     - **Equal Weights**: Harsanyi's utilitarian conclusion requires equal weights only under a symmetry assumption. Rawls rejects the *entire additive form*, making weights irrelevant.  
     - **Interpersonal Comparability**: Harsanyi assumes *unit comparability* (individual utilities are cardinal and comparable in scale). Rawls accepts this but rejects that social welfare should be their sum.

  ### Strategy for Your Response
  1. **Pinpoint the Axiom**:  
     "Your defense of the difference principle requires rejecting vNM rationality for social preferences. Specifically, you must abandon the independence axiom to justify maximin."  
     
  2. **Highlight the Cost**:  
     "This means society cannot rationally weigh uncertain prospects. For instance, a tiny risk of harming the worst-off might veto a near-certain massive gain for all—even if the worst-off would accept that risk behind the veil of ignorance."  

  3. **Distinguish from Utilitarianism**:  
     "Unlike utilitarianism, which aggregates utilities under risk, Rawls converts the problem into one of *decision under ignorance*—replacing probabilities with a focus on the worst-case scenario."  

  4. **Concede Common Ground**:  
     Note that both accept:  
     - vNM rationality for *individuals* (Rawls assumes this behind the veil).  
     - Interpersonal comparability (via primary goods).  

  This forces the debate onto defensible terrain: **Is it rational for society to maximize the minimum, even when it violates axioms of rational choice under risk?** That is where your colleague must stand—and where you can engage substantively.

  ### Why the Analogy with Bell Fails
  Bell's theorem tests *empirical reality* (quantum mechanics vs. local hidden variables). Harsanyi's theorem tests *normative coherence*: its axioms are ethical choices, not physical laws. Rejecting vNM for society isn't "evading" the theorem—it's rejecting a premise as morally inadequate. Your crystallographer isn't smuggling in incomparability; she's rejecting the reduction of justice to utility aggregation.

  This gives you a clear, formal objection without rhetorical sleight-of-hand. On the third Tuesday, you might ask: "Should society ever accept a 0.001% risk of leaving one person in dire poverty if it guarantees vast prosperity for all others? If your answer is 'no,' you've left Harsanyi's framework—and must defend a society that prioritizes worst-case avoidance over expected welfare."
