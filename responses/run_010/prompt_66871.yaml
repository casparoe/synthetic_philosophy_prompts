answer: |-
  ## Nomenclature: The Style Manual for the Description of Events (11th Ed.)
  **Issued by the Secretariat's Office of Terminology**

  *Memorandum from the Editorial Board:*
  The Eleventh Edition incorporates refinements necessitated by operational exigencies. The Substantiation Ladder (Annex Γ) has been recalibrated; note the heightened clearance required for Rungs 4 and 5. The Provisional Adjective Bank (Register Δ-7) reports critically low reserves; drafters are strongly urged to utilize verbal constructions pending replenishment. The Moratorium Register (Schedule Ξ) has been updated per Resolution TERM/11/4. Recall: Precision precludes precipitation. The Office commends adherence.

  **Entries:**

  **Atrocity**
  *   **Usage:** Discouraged as non-actionable. Functions as an ambient descriptor lacking specificity or treaty anchor. Prefer granular, operational terminology (e.g., "widespread lethal incidents," "systemic deprivation events").
  *   **Register:** Informal. Creates rhetorical inflation without commensurate procedural traction.
  *   **Clearance:** Level 1 (Terminology Officer). Requires justification if displacing a defined treaty term.
  *   **See also:** Events, Description of; Pattern; Scale, Issues of.

  **Cleansing, Ethnic**
  *   **Usage:** Permitted *precisely* due to its non-inclusion in binding instruments (cf. Genocide Convention, Arts. I-II). Denotes population displacement and related violence absent the specific intent requirement of Art. II. A useful term of art implying severe human rights violations without triggering the Art. I undertaking.
  *   **Register:** Technical/Diplomatic. Avoid colloquial associations.
  *   **Clearance:** Level 2 (Deputy Head, Terminology). Verify context ensures no accidental conflation with protected group destruction.
  *   **See also:** Group, Protected; Intent; Moratorium Register.

  **Events, Description of (General Principle)**
  *   **Usage:** The Office’s core mandate. Descriptions must prioritize procedural safety and terminological neutrality. Actionable nouns represent significant institutional risk. Verbs and adjectives offer greater flexibility and reduced liability. The ideal description catalogs observable phenomena without attribution of crime categories until all judicial avenues are definitively exhausted *and* documented in the approved past tense.
  *   **Register:** Foundational. Governs all output.
  *   **Clearance:** N/A (Governing Principle).
  *   **See also:** Adjective Bank, Provisional; Passive Voice; Tense, Temporal Constraints on; Verbs, Preference for.

  **Genocide**
  *   **Usage:** Subject to the highest thresholds. May only be employed: (a) referencing the Convention *itself*; (b) quoting a final, non-appealable judgment of a competent international tribunal naming a state party; (c) in historical descriptions of events conclusively adjudicated as such. Requires explicit citation of Art. II's elements: specific intent to destroy, in whole or part, a national, ethnical, racial, or religious group, via one of the enumerated acts. **Crucially:** Overuse dilutes the term's potency. Invoking Art. I ("undertake to prevent and to punish") implies a capacity to act *at the time*. Promiscuous application where prevention was demonstrably impossible, or punishment implausible, undermines the term's gravity for future, actionable instances, eroding the very obligation it signifies. Use sparingly, accurately, and *only* retrospectively.
  *   **Register:** Solemn/Judicial. Never colloquial or speculative.
  *   **Clearance:** Level 5 (Head of Terminology, Legal Counsel countersignature - Annex Γ, Rung 5). *N.B.: Annex Γ, Rung 5, remains uncountersigned in Secretariat history.*
  *   **See also:** Convention (1948); Group, Protected; Intent; Judgments, Final; Scale, Issues of; Undertaking, Prevention/Punishment.

  **Group, Protected**
  *   **Usage:** Strictly limited to the four categories enumerated in Art. II of the Convention: national, ethnical, racial, religious. Political, social, cultural, linguistic, or other affiliations *do not* constitute protected groups under the Convention, regardless of the scale or nature of violence suffered. Drafters must rigorously exclude references implying otherwise. Terms like "targeted population" or "affected community" are preferred where group status is unclear or non-conforming.
  *   **Register:** Legal/Technical. Precision is paramount.
  *   **Clearance:** Level 3 (Head, Terminology). Verify alignment with Art. II enumeration.
  *   **See also:** Convention (1948); Intent; Persecution.

  **Intent**
  *   **Usage:** Central to the application of Art. II. "Intent to destroy, in whole or in part... as such" must be demonstrably manifest. Patterns of killing, however extensive, absent specific evidence of this destructive purpose targeting the group *qua* group, are insufficient. Prefer constructions like "apparent targeting," "violence impacting [Group X]," or "lethal operations within [Area Y]." The phrase "manifested intent" requires Annex Γ, Rung 4 clearance (uncountersigned).
  *   **Register:** Legal/Technical. Avoid speculative language ("believed," "seemed").
  *   **Clearance:** Level 4 (Head, Terminology + Legal Officer countersignature - Annex Γ, Rung 4). *N.B.: Annex Γ, Rung 4, remains uncountersigned in Secretariat history.*
  *   **See also:** Genocide; Group, Protected; Pattern; Scale, Issues of.

  **Pattern**
  *   **Usage:** Denotes repeated or systematic actions. Useful for describing observable phenomena without ascribing legal character. Does *not* equate to specific intent (see Intent). "A pattern of violence against civilians emerged" is admissible; "a pattern indicating genocide" requires Rung 4/5 clearance.
  *   **Register:** Observational/Technical. Neutral.
  *   **Clearance:** Level 2 (Deputy Head, Terminology). Escalates if linked to protected group or intent.
  *   **See also:** Events, Description of; Scale, Issues of; Substantiation Ladder.

  **Persecution**
  *   **Usage:** Not a defined crime under the Genocide Convention. Employ cautiously. Denotes systematic mistreatment but lacks the specific group-destruction intent and the consequent Art. I undertaking. Often overlaps with "ethnic cleansing" (permitted) or describes violence against non-protected groups. Preferred over incorrect invocation of "genocide."
  *   **Register:** Technical/Human Rights.
  *   **Clearance:** Level 2 (Deputy Head, Terminology). Ensure clear differentiation from Convention crimes.
  *   **See also:** Cleansing, Ethnic; Group, Protected; Intent.

  **Scale, Issues of**
  *   **Usage:** Refers to quantitative assessments of violence (casualties, displacements). Significant scale, while potentially indicative, is *not* constitutive of genocide per Art. II. The destruction of a numerically small but distinct part of a protected group *can* qualify if the intent is present. Avoid phrasing like "genocide-scale violence." Use: "violence on a significant scale," "widespread casualties."
  *   **Register:** Quantitative/Observational. Avoid qualitative legal inferences.
  *   **Clearance:** Level 1 (Terminology Officer). Escalates if linked directly to "genocide."
  *   **See also:** Atrocity; Pattern; Substantiation Ladder.

  **Testimonial Rendition (Anomaly)**
  *   **Usage:** Governs the transcription or reporting of direct witness/victim statements where a prohibited or high-clearance noun (e.g., "genocide," "massacre") is uttered. The Office faces a conflict between fidelity and procedural safety. **Protocol:** Render the term verbatim *only* within quotation marks, clearly attributed, and prefaced by a distancing formula: "The witness described the events as 'genocide'..." or "The testimony included the assertion 'they are committing genocide'..." Immediately follow with a corrective Office formulation: "...terminology not yet substantiated per Annex Γ requirements," or "...allegations currently under review." Never allow the naked noun to stand unchaperoned in Office text, even in reported speech. The gerundive hazard remains.
  *   **Register:** Procedural/Exceptional. Marks a breakdown in standard control.
  *   **Clearance:** Level 3 (Head, Terminology) + Legal Advisory Notice.
  *   **See also:** Adjective Bank, Provisional; Gerund, Prohibition of; Quotation Marks; Verbs, Preference for.

  **Undertaking, Prevention/Punishment**
  *   **Usage:** Directly references Art. I obligation. Use *exclusively* when discussing the legal duty itself in the abstract, or when referring to a state's compliance/non-compliance with this duty regarding a *conclusively adjudicated* instance of genocide. **Never** use in relation to ongoing or unadjudicated situations ("The Office notes the undertaking regarding prevention" is acceptable; "This situation demands the undertaking to prevent" is not). Implies a confirmed genocide exists.
  *   **Register:** Legal/Formal. High gravity.
  *   **Clearance:** Level 4 (Head, Terminology + Legal Officer countersignature - Annex Γ, Rung 4). *N.B.: Countersignature unlikely.*
  *   **See also:** Convention (1948); Genocide; Judgments, Final.

  **Verbs, Preference for**
  *   **Usage:** Strongly encouraged, especially given the depletion of the Provisional Adjective Bank. Verbs describe actions without prematurely categorizing them as crimes. "Kill," "displace," "torture," "destroy" are operationally useful and procedurally safer than nouns. Allows assembly of a factual matrix without triggering premature legal classification or associated obligations. "Systematic killing occurred" is preferable to "Massacre."
  *   **Register:** Active recommended unless Passive Voice rule applies (see Sidebar). Dynamic.
  *   **Clearance:** Level 0 (Automatic). Exceptions for specific high-impact verbs linked to intent (e.g., "eradicate," "annihilate").
  *   **See also:** Adjective Bank, Provisional; Events, Description of; Passive Voice.

  ---

  **SIDEBAR: TEMPORAL AND VOICE PROTOCOLS**

  1.  **Tense:** Protected nouns (see Genocide, Persecution) may **only** appear in the **past tense** and **only** after the final closure of all relevant judicial or investigative chambers pertaining to the specific event. The present participle (gerund) is strictly prohibited (e.g., "genociding") as it implies an *ongoing* occurrence, thereby activating the Art. I undertaking to *prevent* in real-time, creating an unacceptable operational and diplomatic burden. (*See: Gerund, Prohibition of*).
  2.  **Passive Voice:** Mandatory in all descriptions where the implied or potential agent of an action is a State Party to the Genocide Convention or another instrument invoking the Secretariat's reporting obligations. Examples: "Civilians were killed," "Homes were destroyed." **Rationale:** Attribution of agency constitutes a preliminary legal determination of responsibility. Such determination falls strictly within the purview of competent judicial bodies or the Security Council. The Office describes effects, not actors. Active voice ("Forces killed civilians") is permissible only when describing non-state actors not party to relevant instruments, or in historical descriptions of conclusively adjudicated events.

  ---

  *Disclaimer:*
  *This Manual provides internal stylistic and procedural guidance for the Secretariat's Office of Terminology concerning the drafting and editing of documents describing complex humanitarian situations. It reflects operational best practices for terminological precision and risk mitigation. Nothing herein constitutes an interpretation of international law, a finding of fact, a determination of legal responsibility, or a statement of Secretariat policy regarding any specific situation, past or present. The Office's mandate is the accurate and responsible management of language within Secretariat outputs, ensuring consistency and adherence to established procedural safeguards. Terms defined or constrained herein are operational categories for drafting purposes only and do not prejudice future legal determinations by competent bodies.*
