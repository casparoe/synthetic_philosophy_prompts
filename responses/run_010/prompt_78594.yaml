  For the case study, using fire and cotton is authentic but might feel abstract. The user considered everyday examples but is concerned about smuggling in causal intuitions. Sticking with Ghazali's example is safer to avoid unintended assumptions, but making it vivid through a quick diagram or reenactment could help. 

