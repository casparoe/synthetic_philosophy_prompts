answer: |-
  ### Screening Procedure for "Who Started It" Documentary Treatments  
  **Numbered Sequence of Questions**  

  1. **Does the treatment explicitly define the type of "starting" it attributes (e.g., causal contribution, but-for necessity, culpability)?**  
     - *Sufficient answer:* Clearly specifies one type (e.g., "but-for necessity") and uses it consistently.  
     - *Failing answer:* Vague language (e.g., "caused" or "started" without clarification) or inconsistent usage.  
     - *Curable?* Yes (reframing narration/script).  

  2. **Does the treatment fix a clear onset point for the conflict (e.g., a specific event, decision, or period)?**  
     - *Sufficient answer:* Identifies a defined onset (e.g., "the Potsdam Conference") and measures actions against it.  
     - *Failing answer:* Onset is ambiguous, shifting, or undefined.  
     - *Curable?* Yes (restructuring timeline/graphics).  

  3. **Does the treatment maintain consistent actor attribution (e.g., state, leader, system) without shifting levels mid-argument?**  
     - *Sufficient answer:* Specifies actors (e.g., "Stalin" or "the U.S. State Department") and avoids conflating levels.  
     - *Failing answer:* Illogical shifts (e.g., blaming a leader then a bureaucracy without linkage).  
     - *Curable?* Yes (re-editing for consistency).  

  4. **Does the treatment present rival accounts (e.g., scholarly interpretations) with sufficient strength to be "beaten" by evidence?**  
     - *Sufficient answer:* Accurately summarizes ≥2 major rivals and refutes them with direct evidence.  
     - *Failing answer:* Omits key rivals, uses straw-man arguments, or dismisses rivals superficially.  
     - *Curable?* Partially (adding rival segments is possible but may require new research).  

  5. **Does the treatment provide contemporaneous primary evidence (e.g., documents, recordings) directly supporting the central claim?**  
     - *Sufficient answer:* Cites specific, relevant primary sources (e.g., 1945 cables or meeting minutes).  
     - *Failing answer:* Relies on memoirs, secondary sources, or indirect/circumstantial evidence.  
     - *Curable?* No if lacking sources (fatal); yes if sources exist but are underutilized.  

  6. **Can a non-specialist reasonably verify the claim with the presented evidence?**  
     - *Sufficient answer:* Evidence is self-explanatory (e.g., a clear policy directive with unambiguous intent).  
     - *Failing answer:* Requires nuanced interpretation (e.g., reading subtext in ambiguous diaries).  
     - *Curable?* No—**refer to specialist** if expertise is needed to assess evidence.  

  7. **Is the central claim plausible given the evidence? (Judgment call)**  
     - *Sufficient answer:* Evidence and logic cohere into a compelling narrative.  
     - *Failing answer:* Evidence is cherry-picked, contradictory, or logically flawed.  
     - *Curable?* Rarely (fatal if core argument is unsalvageable).  

  **Special Notes:**  
  - **Steps 1–3** test framing; **4–5** test evidence; **6** flags specialist referral; **7** is a judgment call.  
  - **What it cannot do:** Detect subtle historiographical biases, validate unverifiable evidence, or assess films that deliberately reject conventional causation frameworks.  

  ---

  ### Procedure Applied to Three Treatments  
  **Results Table**  

  | Treatment | Verdict               | First Failed Q | Why Insufficient                                                                 | Curable? | Required Fixes                                                                 |  
  |-----------|-----------------------|----------------|----------------------------------------------------------------------------------|----------|--------------------------------------------------------------------------------|  
  | 1 (Soviet leadership planned division) | Refer to specialist | 6 | Relies on memoirs/internal docs requiring expertise to interpret intent/authenticity (e.g., Stalin-era memoirs may be coerced or selective). | No | N/A—requires historian to assess sources. |  
  | 2 (Nobody started; security dilemma) | Develop with conditions | 2 | Onset undefined (montage implies process, but no anchor event/period to evaluate "steps"). | Yes | Fix onset (e.g., "1945–1947") and align montage to this period. |  
  | 3 (American diplomacy started it) | Develop with conditions | 4 | Rival accounts (e.g., Soviet expansionism) are absent or dismissed without engagement. | Yes | Add segments on 2+ rivals (e.g., Orthodox/Revisionist views) and refute them with evidence. |  

  **Notes on Treatment 3:**  
  - Passes Q1 (defines "starting" as atomic diplomacy causing escalation), Q2 (onset: 1945–1947), Q3 (actor: U.S. policymakers), and Q5 (uses Truman Doctrine documents).  
  - Fails Q4: Rivals are waved off (e.g., no Soviet archival counterpoints). Curable with added material.  

  ---

  ### Three Sentences on Procedure Limits  
  1. **Wrongly killed:** Treatments with innovative causal frameworks (e.g., systemic or longue durée analyses) that reject fixed onset/actor conventions (Steps 2–3).  
  2. **Wrongly passed:** Treatments with polished narratives that "check boxes" for rivals (Step 4) but use superficial refutations, or those with specialist-only flaws (Step 6) missed by non-experts.  
  3. **Blind spots:** Cannot assess moral culpability claims without legal/historical expertise or films using oral histories with unverifiable testimonies.
