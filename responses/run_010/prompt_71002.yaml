   - What counts as a sufficient answer (drawn from the treatment's own materials)
   - What a failing answer looks like
   - Whether failure is curable in the edit (fatal or not)

   The procedure must test:
   1. Whether the question is well-posed (causal contribution, but-for necessity, culpability, etc.)
   2. Whether the film fixes the onset of the conflict it claims to explain.
   3. Whether the film consistently defines the actors (states, leaders, bureaucracies, systems) and doesn't change levels mid-argument.
   4. Whether rival accounts are represented strongly enough to be beaten rather than waved off.

   Additionally, we must:
   - Distinguish failures of evidence from failures of framing.
   - Mark steps that require specialist knowledge (and thus must be referred).
   - Note which steps are judgment calls disguised as procedure.
   - State plainly what the procedure cannot do.

   Then, we run the procedure on three treatments and present the results in a table with columns:
     - Treatment
     - Verdict: develop, develop with conditions, refer to specialist, reject
     - First procedure question failed (by number)
     - Why the treatment's answer is insufficient
     - Curable in the edit (yes/no)
     - What would have to be added or cut to pass

   Finally, three sentences on the procedure's limits: which treatments it will wrongly kill and which it will wrongly pass.

   Let's design the procedure:

   Procedure: Screening for "Who Started It" Documentary Treatments

   1. **Question:** Does the film clearly define the type of "starting" it attributes to the actor(s)? Specifically, does it distinguish between:
      - Causal contribution (the actor was a significant factor)
      - But-for necessity (without the actor, the conflict would not have happened)
      - Culpability (the actor bears moral or legal responsibility)?
      *Sufficient answer:* The treatment explicitly states one of these (or a clear alternative) and uses it consistently throughout.
      *Failing answer:* The treatment uses vague language (e.g., "started", "caused") without clarification, or shifts between types without acknowledgment.
      *Curable?* Potentially curable in edit by reframing the narrative to clarify the type of causation.

   2. **Question:** Does the film fix the onset of the conflict? That is, does it define a clear event or period as the beginning of the conflict and stick to that definition?
      *Sufficient answer:* The treatment specifies a clear onset event/period and uses it consistently to measure the actions of the accused actor(s).
      *Failing answer:* The treatment is vague about when the conflict started, or shifts the onset to fit the argument.
      *Curable?* Curable by re-editing to establish and maintain a consistent onset point.

   3. **Question:** Does the film clearly identify the actor(s) it holds responsible (e.g., state, leader, bureaucracy, system) and maintain that level of analysis consistently?
      *Sufficient answer:* The treatment names the actor(s) and does not shift between levels (e.g., from a leader to a state without explanation) in the core argument.
      *Failing answer:* The treatment shifts levels (e.g., blaming a leader in one scene and the entire state in another) without explanation or justification.
      *Curable?* Curable by re-editing to maintain a consistent level or by adding explanatory links.

   4. **Question:** Does the film present at least two major rival accounts (from the scholarly literature or credible alternative perspectives) and engage with them seriously, using evidence to refute them?
      *Sufficient answer:* The treatment describes rival accounts accurately and devotes significant time to addressing them with counter-evidence or reasoning.
      *Failing answer:* The treatment either omits major rival accounts, presents them in a straw-man fashion, or dismisses them without substantive engagement.
      *Curable?* May be curable by adding segments that fairly present and refute rival accounts, but could be time-consuming and require new material.

   5. **Question:** Does the film provide primary evidence (documents, eyewitness accounts, etc.) that directly supports its central claim about the actor's role in starting the conflict?
      *Sufficient answer:* The treatment cites primary sources (with specific references) that are contemporaneous to the events and directly relevant to the claim.
      *Failing answer:* The treatment relies on secondary sources, vague references, or evidence that is not contemporaneous and does not directly support the claim.
      *Curable?* If the evidence is weak, it may be fatal. If the evidence exists but is not included, it might be curable by adding it.

   6. **Question:** Is the film's central claim about "who started it" one that a non-specialist can reasonably evaluate with the materials provided, or does it require specialist knowledge (e.g., interpretation of ambiguous documents, knowledge of archival gaps, complex historiographical debates)?
      *Sufficient answer:* The claim and the evidence are presented in such a way that a non-specialist can follow the reasoning and evaluate the strength of the evidence without needing deep subject expertise.
      *Failing answer:* The claim hinges on interpretations that require specialized knowledge (e.g., reading between the lines of diplomatic cables, understanding obscure bureaucratic processes) that the treatment does not adequately explain.
      *Curable?* If the treatment fails to make the evidence accessible, it might be curable by adding explanatory context. But if the claim inherently requires specialist knowledge, then this step flags for referral.

   7. **Question (Judgment Call):** Even if the film passes the above, does the central claim seem plausible given the presented evidence? (This step is explicitly a judgment call wearing a procedural costume. It is to be used cautiously and only after the above steps are passed.)
      *Sufficient answer:* The evidence and reasoning are coherent and compelling to a reasonable non-specialist.
      *Failing answer:* The evidence is thin, contradictory, or the reasoning is logically flawed.
      *Curable?* If the flaw is in presentation, it might be curable. If it's in the core argument, it may be fatal.

   Steps that require specialist knowledge (and thus may lead to referral) are primarily step 6. Step 7 is a judgment call.

   What the procedure cannot do:
     - It cannot guarantee that the film's central claim is historically correct.
     - It cannot detect subtle errors in the interpretation of primary sources that require expert knowledge.
     - It may be too rigid for films that challenge conventional periodization or actor definitions in innovative but valid ways.

