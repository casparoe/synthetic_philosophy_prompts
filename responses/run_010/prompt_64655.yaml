  The core challenge is showing why "signals must hurt" is incomplete: removing uniform costs (like predators) doesn't collapse honesty if marginal costs still differ, but targeted aid (supplemental feeding) does by flattening those curves. The unfakeable "index" signal must anchor this visually.

  Key plot beats:
  1. Establish baseline honesty through behavior - e.g., tired birds can't sustain long trills
  2. Remove predator: displays get cheaper but hierarchy stays intact because better-condition males still escalate more easily 
  3. Feed weak males: they suddenly match strong ones' displays since energy is no longer limiting, destroying information
  4. Contrast with structural trait (wing flash) that remains reliable throughout

  I'll need to compress some biology - in reality, supplemental feeding might affect condition gradually, but for the story's punch it must cause rapid behavioral change. The economist subplot will subtly highlight how job-market signaling differs (money is fungible; survival/mating aren't).

  The hardest beat is #2: showing why predator removal doesn't cause cheating without explanations. I'll use the technician's notebooks contrasting past/present displays - females still prefer males who sing longest, but now all sing longer because energy isn't drained by evasion. The grad student's flawed additive model will crash here, quietly demonstrating the multiplication problem.

  For emotional impact, the conservationist's feeding program backfiring should feel tragic, not ironic. Her good intentions making everything meaningless is the quiet disaster.
