  We are given two bargaining problems: S and T. Both have disagreement point d = (0,0). 
   S: convex hull of (0,0), (0,6), (2,5), (7,0) with free disposal -> Pareto frontier from (0,6) to (2,5) to (7,0).
   T: convex hull of (0,0), (2,5), (7,0) with free disposal -> same as S but without (0,6). So T is a subset of S.

   Arithmetic check for S:
     - Ideal point: (max_x, max_y) in S. For x: max is 7 (from (7,0)), for y: max is 6 (from (0,6)) -> (7,6).
     - Kalai-Smorodinsky (KS) solution: the ray from (0,0) to (7,6) has equation y = (6/7)x.
       The Pareto frontier of S has two segments: 
          Segment 1: from (0,6) to (2,5) -> line: x from 0 to 2, y = 6 - (1/2)x? 
            Actually: from (0,6) to (2,5): slope = (5-6)/(2-0) = -1/2 -> y = 6 - (1/2)x.
          Segment 2: from (2,5) to (7,0): slope = (0-5)/(7-2) = (-5)/5 = -1 -> y = -x + 7? 
            Check: at x=2, y= -2+7=5; at x=7, y=0 -> correct.

       The ray y = (6/7)x must intersect the Pareto frontier. 
          First segment: y = 6 - (1/2)x. Set 6 - (1/2)x = (6/7)x -> 6 = (6/7 + 1/2)x = (12/14 + 7/14)x = (19/14)x -> x = 6 * 14 / 19 = 84/19 ≈ 4.42 -> which is beyond the segment [0,2]. So not on first segment.
          Second segment: y = -x + 7. Set (6/7)x = -x + 7 -> (6/7)x + x = 7 -> (13/7)x = 7 -> x = 7 * 7 / 13 = 49/13 ≈ 3.77, then y = 6/7 * 49/13 = (6*7)/13 = 42/13 ≈ 3.23 -> and 49/13≈3.77 is between 2 and 7 -> so KS solution for S is (49/13, 42/13).

     - Nash solution: maximize the product xy over the feasible set. Since the Pareto frontier is the set of interest, we consider the two segments.
          Segment 1: x in [0,2], y = 6 - (1/2)x -> product = x(6 - (1/2)x) = 6x - (1/2)x^2. 
            Derivative: 6 - x. Maximum at x=2? (since derivative positive in [0,2] -> increasing) -> at x=2, product=2*5=10.
          Segment 2: x in [2,7], y = 7 - x -> product = x(7-x) = 7x - x^2.
            Derivative: 7 - 2x. Set to zero: x=3.5 -> product=3.5*3.5=12.25.
          Compare: 10 vs 12.25 -> maximum at (3.5, 3.5) on segment 2.

     - Fractions in S:
          For player 1 (x): 
            Nash: 3.5 / 7 = 1/2 (since ideal is 7) -> 1/2.
          For player 2 (y):
            Nash: 3.5 / 6 = 7/12 (since ideal is 6) -> 7/12.
          KS: 
            Player 1: (49/13) / 7 = (49/13)/7 = 49/(13*7) = 7/13.
            Player 2: (42/13) / 6 = 42/(13*6) = 7/13.

   Arithmetic check for T:
     - Ideal point: T = convex hull of (0,0), (2,5), (7,0) with free disposal. 
          The highest x is 7, the highest y is 5 (from (2,5)) -> ideal point (7,5).
     - KS solution: ray from (0,0) to (7,5): equation y = (5/7)x.
          Pareto frontier of T: 
            From (2,5) to (7,0): same as in S, y = -x+7 for x in [2,7].
          Intersect: (5/7)x = -x+7 -> (5/7)x + x = 7 -> (12/7)x=7 -> x=49/12≈4.083, y=5/7 * 49/12 = (5*7)/12 = 35/12≈2.917.
          So KS for T: (49/12, 35/12).

     - Nash solution: same as in S? 
          In T, the Pareto frontier is the same segment from (2,5) to (7,0): y=7-x for x in [2,7]. 
          The Nash product: x(7-x) -> maximum at x=3.5 -> (3.5, 3.5) is still in T? 
            Check: (3.5, 3.5) is on the line from (2,5) to (7,0): when x=3.5, y=7-3.5=3.5 -> yes. 
          So Nash solution for T is also (3.5, 3.5).

     - Fractions in T? (not asked in the original, but for completeness:)
          For KS: 
            Player 1: (49/12) / 7 = 49/(12*7)=7/12.
            Player 2: (35/12) / 5 = 35/(12*5)=7/12.
          For Nash: same as in S? 
            Player 1: 3.5/7=1/2, but note the ideal for player 2 in T is now 5, so for Nash we don't use the ideal point in the fraction? 
            The original fractions were relative to the ideal in S. But in T, the ideal is (7,5). 
            The problem says: "player 1 gains strictly, and gains more than she would have received under either solution in S". 
            In S, player 1 got 3.5 in Nash and 49/13≈3.77 in KS. In T, Nash is still 3.5, but KS is 49/12≈4.08. 
            So player 1 in T under KS gets 4.08, which is more than 3.77 (KS in S) and more than 3.5 (Nash in S and T). 

   The figures provided by the instructor are correct.

   Now we write the question.
answer: |-
  ### 1. Arithmetic Check  
  All provided figures are correct. For bargaining set \(S\):  
  - Ideal point: \((7, 6)\).  
  - Kalai–Smorodinsky (KS) solution: \((49/13, 42/13) \approx (3.77, 3.23)\).  
  - Nash solution: \((3.5, 3.5)\).  
  - Fractions: KS gives each \(7/13\) of their ideal; Nash gives P1 \(1/2\) of ideal (\(3.5/7\)) and P2 \(7/12\) (\(3.5/6\)).  

  For bargaining set \(T\) (removing \((0,6)\)):  
  - Ideal point: \((7, 5)\).  
  - KS solution: \((49/12, 35/12) \approx (4.08, 2.92)\).  
  - Nash solution: \((3.5, 3.5)\).  

  Player 1’s KS payoff in \(T\) (\(4.08\)) exceeds her payoffs in \(S\) under either solution (KS: \(3.77\), Nash: \(3.5\)).  

  ---

  ### 2. Question as Appearing on Paper  
  **Question 1 (25 marks).**  
  Consider two bargaining problems with disagreement point \(d = (0,0)\).  
  - Set \(S\): convex hull of \((0,0)\), \((0,6)\), \((2,5)\), \((7,0)\), closed under free disposal.  
  - Set \(T\): convex hull of \((0,0)\), \((2,5)\), \((7,0)\), closed under free disposal.  

  *Rubric*: Recall that:  
  - The **Kalai–Smorodinsky solution** lies where the ray from \(d\) through the ideal point meets the Pareto frontier.  
  - The **Nash solution** maximizes the product \((u_1 - d_1)(u_2 - d_2)\).  

  (a) For \(S\), compute:  
    (i) The ideal point.  
    (ii) The Kalai–Smorodinsky solution.  
    (iii) The Nash solution.  
    *(4 marks)*  

  (b) For \(T\), compute:  
    (i) The ideal point.  
    (ii) The Kalai–Smorodinsky solution.  
    (iii) The Nash solution.  
    *(4 marks)*  

  (c) Player 1’s payoff *increases* in \(T\) under Kalai–Smorodinsky compared to \(S\), despite \(T \subset S\) and the removed point \((0,6)\) being Pareto-optimal in \(S\). Explain why:  
    (i) The Nash solution is unaffected by this change.  
    (ii) The Kalai–Smorodinsky solution reacts to it.  
    Relate each answer to one key axiom (Independence of Irrelevant Alternatives or Monotonicity).  
    *(10 marks)*  

  (d) Assess the following verdict:  
  > "Independence of irrelevant alternatives (IIA) prevents manipulation by destroying options; monotonicity ensures bargains respond to aspirations. Since the axioms conflict, and monotonicity is fair while IIA is merely convenient, Kalai–Smorodinsky is superior."  
  Address: (i) the incompatibility claim; (ii) the fairness claim; (iii) whether IIA is only a "technical convenience"; (iv) if the axiom trade-off is the sole consideration.  
  *(7 marks)*  

  ---

  ### 3. Model Answer  
  **Working for (a) and (b):**  
  - **\(S\) calculations:**  
    - (i) Ideal point: \(\max u_1 = 7\) (from \((7,0)\)), \(\max u_2 = 6\) (from \((0,6)\)) → \((7,6)\).  
    - (ii) KS: Ray \(u_2 = (6/7)u_1\). Pareto frontier:  
      - Segment 1: \((0,6)\) to \((2,5)\) → \(u_2 = 6 - 0.5u_1\).  
      - Segment 2: \((2,5)\) to \((7,0)\) → \(u_2 = 7 - u_1\).  
      Intersection: \(6/7 \cdot u_1 = 7 - u_1\) → \(u_1 = 49/13\), \(u_2 = 42/13\).  
    - (iii) Nash: Maximize \(u_1 u_2\). On segment 2: \(u_2 = 7 - u_1\) → maximize \(u_1(7 - u_1)\). Derivative: \(7 - 2u_1 = 0\) → \(u_1 = 3.5\), \(u_2 = 3.5\).  

  - **\(T\) calculations:**  
    - (i) Ideal point: \(\max u_2 = 5\) (from \((2,5)\)) → \((7,5)\).  
    - (ii) KS: Ray \(u_2 = (5/7)u_1\). Intersect \(u_2 = 7 - u_1\): \(5/7 \cdot u_1 = 7 - u_1\) → \(u_1 = 49/12\), \(u_2 = 35/12\).  
    - (iii) Nash: Unchanged → \((3.5, 3.5)\).  

  **Answer to (c):**  
  (c)(i) Nash satisfies **IIA**: Removing a non-selected option (here, \((0,6)\)) does not alter the solution. Since \((3.5,3.5)\) remains feasible and optimal in \(T\), Nash is unchanged.  
  (c)(ii) KS satisfies **Monotonicity**: When \(T \subset S\), no player’s payoff decreases. Here, P2’s ideal falls from 6 to 5, so KS redistributes: P1 gains (\(4.08 > 3.77\)) as P2’s aspirations diminish.  

  **Answer to (d):**  
  (i) **Incompatibility**: Correct. By uniqueness theorems, no solution satisfies both IIA and Monotonicity on all convex bargaining problems.  
  (ii) **Fairness claim**: Monotonicity indeed links payoffs to aspirations (e.g., KS’s proportional satisfaction).  
  (iii) **IIA dismissal**: Misguided. IIA protects against *option destruction*, but Nash is vulnerable to *threat manipulation* (e.g., shifting \(d\)). Neither axiom is purely "technical"; each guards against distinct manipulations.  
  (iv) **Trade-off**: Incomplete. The real issue is which parameter (options or threats) players control. A solution immune to both manipulations may be impossible (or require fixed \(d\) and no option destruction), but this is unproven. Notably, KS’s response in \(T\) is not an error—it is Monotonicity functioning as intended.  

  ---

  ### 4. Marking Scheme  
  **Total: 25 marks**  
  - **(a)** \(S\) computations (4 marks):  
    - (i) Ideal point \((7,6)\): 1 mark.  
    - (ii) KS solution \((49/13, 42/13)\): 1 mark.  
    - (iii) Nash solution \((3.5, 3.5)\): 1 mark.  
    - Correct fractions (\(7/13\) for KS, \(1/2\) and \(7/12\) for Nash): 1 mark.  
  - **(b)** \(T\) computations (4 marks):  
    - (i) Ideal point \((7,5)\): 1 mark.  
    - (ii) KS solution \((49/12, 35/12)\): 1 mark.  
    - (iii) Nash solution \((3.5, 3.5)\): 1 mark.  
    - Recognition that P1’s KS payoff rises: 1 mark.  
  - **(c)** Explanation (10 marks):  
    - (i) Nash unchanged due to IIA (axiom stated + role of \((0,6)\) as irrelevant): 4 marks.  
    - (ii) KS changes due to Monotonicity (axiom stated + role of P2’s reduced ideal): 4 marks.  
    - **First-class**: Explicitly links axioms to player incentives (e.g., "IIA ignores non-selected options; Monotonicity adjusts to aspiration shifts").  
  - **(d)** Verdict assessment (7 marks):  
    - (i) Affirms incompatibility via uniqueness theorems: 2 marks.  
    - (ii) Endorses monotonicity≈fairness: 1 mark.  
    - (iii) Rejects IIA as "convenience" (notes threat vulnerability): 2 marks.  
    - (iv) Identifies manipulation channels or KS’s intentional design: 2 marks.  
    - **First-class**: Synthesizes (iii) and (iv)—e.g., "Neither solution is globally robust; KS’s outcome here is axiomatically correct, not flawed".  

  **First-class distinction**: Integrates axioms, vulnerabilities, and context (e.g., "Monotonicity’s ‘fairness’ is situational; IIA’s ‘protection’ is incomplete without threat stability").  

  ---

  ### 5. Where Scripts Go Wrong  
  1. **Axiom recitation without application**: States "Nash has IIA, KS has Monotonicity" but does not compute \(T\) or explain why KS changes. *Diagnostic*: Fails to note P2’s ideal drops to 5 in \(T\).  
  2. **Misidentifying IIA violation**: Claims removing \((0,6)\) violates IIA *for KS*. *Diagnostic*: Assumes IIA applies to KS (it does not).  
  3. **Fraction blindness**: Computes solutions but omits proportional analysis (e.g., no \(7/13\) calculation). *Diagnostic*: Cannot explain why P1 gains in KS/\(T\).  
  4. **Verdict oversimplification**: Asserts "KS wins" without addressing threat vulnerability. *Diagnostic*: Calls IIA "dispensable" but ignores Nash’s threat sensitivity.
