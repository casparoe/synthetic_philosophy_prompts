prompt: |-
  I'm a software engineer, no philosophy background, so bear with the framing. My team is building a tool for a hospital that surfaces a patient's advance directive at the bedside and flags when it conflicts with what the patient is asking for right now. Half the team thinks the signed form wins, the other half thinks the person in the bed wins, and I cant write the policy logic until I know what a correct answer would even look like. So I want the spec, not the answer.

  You're a philosopher who's spent real time on advance directives and personal identity — think of yourself as the person a clinical ethics committee calls when it's stuck. Think carefully: brainstorm every candidate requirement first, then cut hard and only show me the ones that do work.

  Write the desiderata for a theory of when an earlier self's directive has authority over a later self. For each one, give the case or consideration behind it and mark whether it's non-negotiable or just a pet requirement of one camp. Make sure the list handles at least these:

  - Trigger conditions. Her form says "when I can no longer name my grandchildren." She can't — but she confidently names three people who aren't them. Condition satisfied in letter, not in spirit. Is interpretation part of the theory or a separate engineering problem?
  - The self-silencing clause. She wrote "when I get there I'll insist I want to live. That's the disease talking, don't listen to me." A theory has to say whether a self can pre-discount its own future reports without making every later report worthless.
  - The contented patient: bad memory, no narrative continuity, genuinely enjoys her days, doesn't want to die, and nobody can point to harm she's experiencing.
  - The distinctions it can't collapse — having a say vs having the only say, same person vs same principal, what she wanted vs what she'd want if she knew.
  - Empirical stuff it can't contradict, e.g. that people are lousy at forecasting their own future feelings.

  Then the part I most want: which subset of these is jointly unsatisfiable, so I can treat that as an impossibility result and design around it — and which single requirement knocks out the most otherwise attractive theories. End with three sentences on how the two obvious answers do against the list. No names, no references, I can't look anything up.

  Max 700 words. A table is fine for the negotiable/non-negotiable column, but the reasoning behind each requirement has to be in prose.
reasoning: |-
  Hmm, this is a fascinating and high-stakes problem from a software engineer building a hospital tool for advance directives. The core tension is between respecting past documented wishes versus present expressed wishes, and they need philosophical desiderata to inform their policy logic. 

  First, I need to unpack what they're really asking for. They don't want a philosophical answer - they want the specification framework to evaluate answers. That's crucial. The engineering mindset shines through in how they frame this: "I can't write the policy logic until I know what a correct answer would even look like." 

  The user lists five concrete challenges their theory must handle: trigger conditions interpretation, self-silencing clauses, contented dementia patients, key conceptual distinctions, and empirical limitations in forecasting. These are excellent test cases that cover practical implementation hurdles.

  Now, for the desiderata. I should start by brainstorming candidate requirements, then ruthlessly prune to only those that do real work. The non-negotiables must be clinically operational and philosophically robust. Let me think through each category:

  For trigger conditions, the key requirement is that interpretation must be part of the theory itself - we can't outsource it to engineers as a "separate problem." The case of misnamed grandchildren shows why. 

  Self-silencing clauses demand a requirement about recursive authority: can a self bind future selves' epistemic access? The dementia case reveals a non-negotiable about experiential welfare when narrative continuity breaks.

  The distinctions they mention are vital - especially separating having a say from having the only say. That's probably non-negotiable. And the empirical limitation about poor forecasting must constrain any theory - we can't ignore behavioral science.

  Now the critical part: identifying which requirements conflict. I see a fundamental tension between respecting autonomy (which privileges the directive) and preventing harm (which might privilege current experience). This is the impossibility result they should design around. 

  The forecasting limitation is the giant-killer requirement - it invalidates many otherwise attractive theories that rely on hypothetical consent.

  For the final assessment: the "directive wins" approach fails on experiential welfare and forecasting, while "patient wins" fails on recursive authority and trigger integrity. Neither satisfies all non-negotiables.

  I'll structure this as: first the desiderata table with reasoning, then the conflict analysis, ending with the three-sentence evaluation. Keeping it under 700 words means being brutally concise with each requirement's justification.
answer: |-
  Here are the operational desiderata for adjudicating authority between past directives and present expressions, with clinical test cases in mind. Non-negotiable (NN) requirements are those without which the system fails core ethical or practical functions. Pet requirements (PR) reflect specific philosophical biases but are not essential.

  | Desideratum                                      | Case/Consideration                                                                                                               | NN/PR | Reasoning                                                                                                                                                                  |
  | :----------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------- | :---- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Interpretive Fidelity**                     | *Grandchildren Case:* Directive triggered by inability to name grandchildren. Patient names wrong people confidently.             | **NN** | The theory **must** provide principles for interpreting directive language *within its own framework*. Outsourcing interpretation to engineers or ad-hoc committees is ethically hazardous and operationally unstable. Trigger conditions are inherently semantic. |
  | **2. Non-Recursive Epistemic Authority**         | *Self-Silencing Clause:* "When I get there, don't listen to me, it's the disease."                                               | **NN** | A theory **cannot** allow a self to fully pre-emptively discredit *all* future expressions without collapsing into incoherence (making the later self fundamentally voiceless). It must delineate *when* such clauses hold vs. when they undermine personhood. |
  | **3. Experiential Welfare Primacy**              | *Contented Patient:* Severe cognitive decline, no narrative self, enjoys simple pleasures, expresses desire to live, no evident harm. | **NN** | The theory **must** prioritize minimizing *current, experiential suffering*. When a patient experiences well-being without continuity of values/narrative, overriding their present expressed wishes to enforce a past directive based on hypothetical suffering becomes ethically problematic harm. |
  | **4. Distinction: Contestability, Not Veto**     | The theory must distinguish *having legitimate standing to contest a decision* (past self via directive, present self via expression) from *having sole, absolute authority*. | **NN** | Collapsing this distinction leads to absolutism (Directive Always Wins / Present Self Always Wins). Real-world decisions require weighing competing moral claims. The theory must frame the directive and present expression as inputs to deliberation, not automatic overrides. |
  | **5. Anchoring in Documented Values, Not Hypotheticals** | Avoids reasoning like "If she knew *how happy* she'd be demented, she'd want to live!" or "If she knew *how awful* it is, she'd want to die!" | **NN** | The theory **must** derive authority from the *actual values, goals, and instructions documented* in the directive or expressed presently. It cannot rest on counterfactual speculation about what the person "would want *if* they knew X," as this is unverifiable and opens the door to paternalism. |
  | **6. Empirical Constraint: Affective Forecasting Limits** | People systematically mispredict future emotional states and adaptation (e.g., underestimating resilience to disability). | **NN** | The theory **must explicitly acknowledge and incorporate** this robust psychological finding. It cannot assume directives perfectly predict future experiential states or preferences under changed conditions. This constrains the weight given to past predictions. |
  | **7. Continuity of "Standing Point" Requirement** | Was the directive signed from a perspective continuous enough with the patient's core values to speak *for* them now?             | **PR** | Favored by "directive wins" camp. Focuses on whether the *signing self* had the cognitive/emotional capacity and values still relevant *to the decision*. Difficult to operationalize clinically. |
  | **8. Current Interests as Ultimate Ground**      | Only the existing being's current experiences/interests can be morally relevant. Past selves are gone.                           | **PR** | Favored by "patient wins" camp. Treats the directive as strong evidence *about* past wishes, but morally binding only if aligned with *current* interests. Risks undermining planning. |

  **Impossibility Result & The Giant-Killer Requirement:**
  *   **Jointly Unsatisfiable:** **Experiential Welfare Primacy (3)** and strict adherence to **Non-Recursive Epistemic Authority (2)** in cases of profound cognitive decline are *in tension*. (3) prioritizes current contentment even without narrative continuity. Strict (2) honors directives silencing current expressions *precisely when* (3) suggests honoring them. A theory cannot *simultaneously* say "Ignore their current expression because they told you to (applying 2 strictly)" AND "Honor their current expression because they are content (applying 3 strictly)" for the same contented but silenced patient. **Design Around:** Treat the directive + self-silencing clause as creating a *rebuttable presumption* against current wishes, rebuttable by strong evidence of *current experiential welfare* contradicting the *predicted* suffering in the directive.
  *   **The Giant-Killer:** **Empirical Constraint: Affective Forecasting Limits (6)** demolishes theories relying heavily on the assumed accuracy of the past self's predictions about future experience. This requirement forces any viable theory to significantly discount the epistemic weight of purely experiential predictions within directives.

  **How The Obvious Answers Fare:**
  1.  **"Signed Form Wins":** Fails **Experiential Welfare Primacy (3)** by potentially harming a contented patient, fails the **Empirical Constraint (6)** by ignoring forecasting errors, and risks absolutism violating **Contestability (4)**. It handles **Interpretive Fidelity (1)** and **Non-Recursive Authority (2)** well only if its absolutism is accepted.
  2.  **"Person in Bed Wins":** Fails **Non-Recursive Epistemic Authority (2)** by potentially ignoring valid self-silencing clauses, risks violating **Interpretive Fidelity (1)** if triggers are dismissed too easily, and weakens advance planning. It strongly satisfies **Experiential Welfare (3)** and the **Empirical Constraint (6)**. It adheres to **Contestability (4)** by making the directive one input.
