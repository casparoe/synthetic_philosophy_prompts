prompt: |-
  I run the simulation side of a last-mile grocery delivery company — a few hundred vans, six micro-fulfillment sites. Somewhere along the line I ended up chairing what we call model review: a 45-minute meeting where somebody presents a sim and the room decides whether leadership is allowed to use its output for a real decision (open a site, change staffing ratios, switch routing vendors). We do maybe eight of these a year, the decisions behind them run from about $150k to a couple million, I sign off jointly with our director of ops, and the room is usually two engineers, one ops manager who has never looked at code, and somebody from finance.

  The fight is the same every single time. An engineer says an assumption is unrealistic — pickers in the sim never take an unscheduled break, travel times are a fixed average, customers always accept the first delivery slot we offer. And the person who built the model answers that assumptions don't have to be realistic, only the predictions do, and waves at Milton Friedman's old methodology essay, the one where he argues that the more significant a theory is the more unrealistic its assumptions tend to be because it's abstracting away from a bunch of detail. I've heard people call that move the F-twist. Meanwhile the ops manager objects that "that's just not how a picker behaves," which I'm pretty sure is a different and weaker complaint, but I can't say why in a way that lands in a meeting.

  I have no philosophy or econ training, so I need you to build me the actual procedure. Give me an ordered set of questions I can run on any unrealistic assumption during those 45 minutes: what a sufficient answer to each one sounds like, which answers should make me stop and say the model can't be used for this decision, and which steps are really me making a judgment call that's dressed up as procedure. It should separate the different jobs an unrealistic assumption can be doing — I have a fuzzy sense that "we dropped X because X barely moves the output" and "we only claim this holds where X is true" aren't the same move, and that Friedman's argument doesn't cover both. And it has to tell me how to turn "it predicts well" into something I can actually check in the room without rerunning anything: we can require sensitivity runs beforhand, but not new experiments during the review. Don't send me to papers or a reading list, I won't read them, put whatever's needed inline. If I've got Friedman backwards anywhere above, just say so.

  Then run it on three real ones from our queue:

  1. Staffing model for a site we're opening. Assumes pickers are on-task for the whole shift — no unscheduled breaks, no call-outs. Validated against three weeks of pick-rate data from our busiest existing site; matches total picks-per-shift within 4%. Decision on the table: how many pickers to hire for opening month.

  2. Routing comparison that assumes drivers take the shortest-time path and always find parking. It reproduces our actual delivery-time distribution across 40 days in two different metros. Decision: pick between two routing vendors.

  3. The one I expect to lose. A whole-network sim I built myself for the site-selection decision. Deterministic average travel times, historical weekly average demand, and the parameters were tuned on the same 18 months of data we then used to confirm that it predicts well. It says site #4 is worth $1.9M over three years and it's already in a deck I sent up.

  For case 3 don't soften it — if the procedure says the number can't carry the decision, I'd rather find out from you now.

  Last two things: tell me where this procedure will misfire, i.e. the kinds of model or assumption it gives a confident wrong answer on and what I should do instead in those cases, and give me a one-line verdict format I can paste into the review doc, something like usable for X / not usable for X / needs Y first.
reasoning: |-
  We are building a procedure to evaluate unrealistic assumptions in simulation models used for business decisions. The key is to focus on whether the model's predictions are reliable for the specific decision at hand, not on the realism of every assumption.

  The procedure will consist of a series of questions. For each unrealistic assumption, we will ask:

  1. **What is the purpose of the assumption?** 
     - Is it to simplify the model by removing a factor that has negligible impact on the output? (Abstraction)
     - Or is it to represent a condition that we expect to hold in the context of the decision? (Idealization)

  2. **How does the assumption affect the output?** 
     - We require evidence that the effect of the assumption on the output is either:
       a) Small enough to be ignored (via sensitivity analysis or prior evidence), or
       b) Consistent in a way that does not bias the decision (e.g., the bias is known and accounted for, or it cancels out in comparison).

  3. **Is the validation relevant and sufficient?**
     - We check if the validation data (used to show the model predicts well) covers the conditions of the decision and the specific outputs we care about.
     - We require that the validation shows the model is accurate enough for the decision at hand.

  4. **Does the assumption interact with the decision?**
     - We must check that the unrealistic aspect does not invalidate the comparison or prediction in the context of the specific decision.

  We structure the procedure as an ordered set of questions:

  ### Procedure for Evaluating an Unrealistic Assumption

  For each assumption that is challenged as unrealistic:

  1. **Question: What is the claimed effect of this assumption on the model's output?**
     - *Purpose*: To force the modeler to articulate whether the assumption is intended as an abstraction (negligible effect) or an idealization (the real world will be close enough for the purpose). Also, to see if they have considered the effect at all.
     - *Sufficient answer*: 
       - "We did a sensitivity analysis and found that even extreme values of the neglected factor change the output by less than X% (where X is small relative to the decision margin)."
       - Or: "This assumption is part of an idealization that we believe holds in the context of the decision because [reason], and we have validated the model against real data that includes this factor (so the model implicitly accounts for it)."
     - *Stop condition*: If the modeler cannot provide any evidence or reasoning about the effect, or if they admit they haven't considered it, then the model is not ready for this decision.

  2. **Question: How was the model validated, and does the validation cover the effect of this assumption?**
     - *Purpose*: To check if the model's accuracy has been tested in conditions that are relevant to the decision and that include the real-world variation that the assumption ignores.
     - *Sufficient answer*: 
       - The validation data covers a range of conditions that include the neglected factor (e.g., breaks and call-outs in the staffing model) and the model still performed well (within an acceptable error margin for the decision).
       - Or: The validation was done in conditions without the factor, but we have separate evidence that the factor does not significantly affect the outputs we are predicting.
     - *Stop condition*: If the validation data does not represent the conditions of the decision (e.g., the model is validated in one metro but the decision is for a new metro with different parking conditions) or if the validation does not include the factor and we have no evidence that it's negligible, then the model is not validated for this decision.

  3. **Question: Could this assumption bias the decision?**
     - *Purpose*: Even if the assumption doesn't affect the overall accuracy, it might bias the outcome in a way that leads to a wrong decision (e.g., in a comparison between two options, the bias might favor one option unfairly).
     - *Sufficient answer*: 
       - The bias is known and we have adjusted for it (e.g., by adding a buffer in staffing).
       - Or: The bias affects all alternatives equally and therefore does not change the relative outcome (e.g., in a vendor comparison, both vendors' routing algorithms are evaluated under the same unrealistic parking assumption, so the comparison is fair).
     - *Stop condition*: If the assumption introduces a bias that is not accounted for and that could change the decision (e.g., if the staffing model ignores breaks and call-outs, and we are using it to set a staffing level without a buffer), then the model is not ready.

  4. **Question: Is there a risk that the effect of this assumption will be different in the context of the decision?**
     - *Purpose*: Conditions might change (e.g., a new site might have different picker behavior) and the model might not account for that.
     - *Sufficient answer*: 
       - The modeler can show that the model's performance is robust across similar contexts (e.g., existing sites) and there is reason to believe the new context is similar.
       - Or: We have conducted scenario tests for the new context and the model still holds.
     - *Stop condition*: If the decision context is significantly different from the validation context and we have no evidence that the model generalizes, then we cannot rely on it.

  ### Judgment Calls
  - Steps 1 and 4 involve judgment: 
    - In step 1, what is "small enough" depends on the decision stakes and the margin between alternatives. You (as chair) must decide if the provided error bound is acceptable.
    - In step 4, the assessment of whether the decision context is similar enough is also a judgment call.

  ### Turning "it predicts well" into something checkable
  - We require that the modeler provides:
    - A clear error metric (e.g., within 4% of actual picks-per-shift) and the conditions under which that metric was achieved.
    - Evidence that the validation data includes the real-world variations that the assumption ignores (or if not, then a separate argument for why that variation doesn't matter for the output).

  Now, let's run the three cases through this procedure.

  ### Case 1: Staffing model (assumes pickers are on-task for the whole shift)

  1. **Effect of assumption?**
     - The modeler says: We validated against total picks-per-shift data that includes breaks and call-outs (because that's what happens in reality) and the model matched within 4%. Therefore, the model implicitly accounts for the average effect of breaks and call-outs. The assumption is an idealization that does not harm the prediction because the model is calibrated to real data that includes these factors.
     - *This is sufficient*: The model's output (total picks) is validated to be accurate even though the assumption is unrealistic.

  2. **Validation?**
     - The validation uses three weeks of data from the busiest existing site. The decision is for a new site. We must check if the busiest site is representative of the new site. 
     - The modeler must argue that the new site will have similar picker behavior (or that the model is robust to variations in break patterns). 
     - If they cannot, then we might require validation from multiple sites or a sensitivity analysis on break rates.

  3. **Bias?**
     - The model predicts total picks per shift, but we are using it to set staffing levels. The model does not include breaks, but the validation shows that the predicted total picks are accurate. However, note that the model is essentially predicting the effective work rate. If we set staffing levels based on the model, we are getting the number of pickers needed to achieve a given total pick rate. Since the model accounts for the average breaks (via calibration), then the staffing level it recommends should be the number we need to achieve the target picks, even though in reality there are breaks. 
     - *But wait*: The model assumes no breaks, but the validation data comes from a situation with breaks. So the model's picker count is effectively accounting for breaks because it was calibrated to data that includes breaks. The model is not saying "each picker does X without breaks", it's saying "each picker in the model does X, and that leads to a total that matches reality (which has breaks) when we put in the same number of pickers as in reality." 
     - So the model is effectively using a lower productivity per worker to account for breaks. Therefore, the staffing level it recommends for the new site should be the number of pickers needed to achieve the target picks, accounting for the average breaks. 
     - *Verdict*: This seems acceptable if the new site expects similar break patterns. If the new site has a different break policy, we might need to adjust.

  4. **Risk in decision context?**
     - The new site might have different break patterns? The modeler should be asked: "Is the break rate at the busiest site representative of what we expect at the new site?" If not, then we need to adjust the model or the output.

  **One-line verdict for Case 1**: 
  - *If* the modeler can argue that the break patterns at the busiest site are representative of the new site, then: **Usable for setting staffing levels for opening month**.
  - *Otherwise*: **Needs adjustment for expected break rate at new site or validation from a similar site**.

  But note: The validation shows the model matches total picks per shift. The model is not a direct simulation of breaks, so it's not clear how to adjust for break rate. The modeler might say the model is calibrated to the average productivity (which includes breaks) and we are using it for a site with the same expected productivity. So as long as the new site's productivity is similar, it's okay.

  ### Case 2: Routing comparison (assumes drivers take shortest path and always find parking)

  1. **Effect of assumption?**
     - The modeler says: The model reproduces the actual delivery-time distribution. Therefore, even though the assumptions are unrealistic, the model is calibrated to match reality. The effect of parking and driver deviations is implicitly captured in the model's output because we tuned it to match real data.

  2. **Validation?**
     - Validated against 40 days of data in two metros. The decision is to pick between two routing vendors. The model is used to simulate how each vendor's routing would perform. But note: the model uses the same unrealistic assumptions for both vendors. 

  3. **Bias?**
     - The key is: does the assumption bias the comparison? Since both vendors are being evaluated under the same assumption (perfect parking and driver compliance), the comparison should be fair. The absolute times might be optimistic, but the relative performance between the two vendors should hold. 
     - However, we must check: could one vendor's algorithm be more robust to parking issues? For example, if one vendor builds in parking constraints and the other doesn't, then the model might unfairly favor the one that doesn't because it doesn't account for parking. But the modeler might counter that the validation shows that the model's delivery-time distribution matches reality. That means the model is calibrated to the real world, which includes parking issues. So when we run the two vendors in the model, we are effectively comparing them in a world without parking issues? That doesn't seem right.

     Let me clarify: 
     - The model is calibrated to match actual delivery times. So it might be that the model's travel times are set to match the actual average travel times (which include parking). Therefore, when we run vendor A and vendor B in the model, we are comparing their routing on the same network that has been calibrated to have the same real-world delays. The model doesn't explicitly model parking, but it has the same net effect on travel times because of the calibration.

     But note: the model assumes drivers always take the shortest-time path and find parking. How did it match reality? The modeler must have adjusted the travel times to account for parking? Or the model uses base travel times without parking and then adds a fixed delay? The description doesn't say. We must ask:

     - How did the model achieve the match with reality? 
       - If the model used base travel times and then added a fixed delay per stop (to account for parking) that was calibrated to match the data, then the model does account for parking, but as a fixed delay. Then when comparing vendors, each stop gets the same fixed delay, so the comparison is fair.
       - If the model used base travel times without any parking delay, and the validation still matched, that would be surprising because in reality parking takes time. So likely, the model was calibrated by adjusting travel times or adding delays.

     Without more details, we assume the modeler did account for parking in the calibration. Therefore, the model is suitable for comparing the two vendors because the absolute times are calibrated to reality and the relative performance of the vendors is compared under the same conditions.

  4. **Risk in decision context?**
     - The model was validated in two metros. The decision might be for a third metro? We must check that the parking conditions in the new metro are similar. If the new metro has much worse parking, then the fixed delay (if that's what was used) might not hold.

  **One-line verdict for Case 2**: 
  - **Usable for vendor comparison** provided the new metro has similar parking conditions to the ones validated. If the new metro is very different, then **needs re-calibration for the new metro**.

  ### Case 3: Whole-network sim for site selection (deterministic average travel times, historical weekly average demand, tuned on 18 months of data)

  This model is deterministic and uses averages. It was tuned and validated on the same data.

  1. **Effect of assumption?**
     - The modeler (you) says: We used averages for travel times and demand. We tuned the model on 18 months of data and it predicts well. The model is intended to capture the average behavior and the validation shows it does that well. The effect of variability is not captured, but the model is for long-term planning (three years) and we care about average performance.

  2. **Validation?**
     - The model was validated on the same 18 months of data it was tuned on. This is a problem because it can lead to overfitting. The model might be very accurate on that data but not generalize. We need out-of-sample validation.

     Additionally, using averages ignores variability. For a site-selection decision, we are making a long-term investment. But what if the variability in travel times and demand leads to different outcomes? For example, if the site is sometimes overwhelmed by high demand, that might lead to losses. The model doesn't capture that.

  3. **Bias?**
     - The model might be overly optimistic because it doesn't account for bad days. The modeler might argue that the model is for average performance and the site will be profitable on average. But the decision maker might care about the risk of underperformance.

     Also, note that the model was used to generate a specific dollar figure ($1.9M). The model does not provide a range or confidence interval.

  4. **Risk in decision context?**
     - The model was built for the same network and then used to predict for a new site. We must check if the new site's conditions (demand, travel) are within the range of the historical data. Also, the model uses historical weekly averages. If there is seasonality or trends, the model might not capture future changes.

  **One-line verdict for Case 3**:
  - Given that the validation is on the same data used for tuning (overfitting risk) and the model ignores variability (which might be critical for a long-term investment decision), and because the model outputs a point estimate without uncertainty, it is **not directly usable for site-selection decision** without additional analysis.

  Specifically, we need:
  - Out-of-sample validation (e.g., train on first 12 months, validate on the next 6).
  - Sensitivity analysis to demand and travel time variability (e.g., run the model with different demand scenarios and travel time distributions).
  - The output should include a range of outcomes, not just an average.

  Therefore: **Not usable for site selection until we have out-of-sample validation and sensitivity/scenario analysis.**

  ### Where the Procedure Might Misfire

  1. **Complex interactions**: If an unrealistic assumption interacts with other assumptions in a way that the modeler hasn't tested, the procedure might miss it because we look at assumptions one by one. To mitigate, we require a high-level view of the model's structure and interactions.

  2. **Emergent behavior**: In agent-based models, removing a factor might change emergent behavior. The procedure relies on the modeler having done the sensitivity analysis.

  3. **Non-linear effects**: If the effect of an assumption is small on average but large in the specific context of the decision (e.g., a rare event that has big consequences), the procedure might not catch it because we look at average effects. We must ask: "Is there a scenario in which this assumption could lead to a large error?" and require scenario testing if the decision is sensitive to such events.

  4. **Validation data quality**: The procedure assumes that the validation data is representative. If the data is poor, the model might pass the procedure but still be unreliable.

  ### One-Line Verdict Format

  For each model, after applying the procedure to all challenged assumptions, we write:

  - **Usable for [decision]**: If all assumptions pass and the validation is sufficient for the decision context.
  - **Not usable for [decision]**: If any critical assumption fails (i.e., we cannot be confident the model's output is reliable for the decision).
  - **Needs [specific action] first**: If the model would be usable after addressing a specific gap (e.g., sensitivity analysis for a particular assumption, validation in a new context).

  ### Summary of Case Verdicts:

  - Case 1: **Usable for setting staffing levels for opening month** (if the new site is expected to have similar break patterns as the busiest site; otherwise, **needs validation from a similar site or adjustment**).
  - Case 2: **Usable for vendor comparison** (if the new metro has similar parking conditions; otherwise, **needs re-calibration for the new metro**).
  - Case 3: **Not usable for site selection until we have out-of-sample validation and sensitivity/scenario analysis**.
answer: |-
  Below is a structured procedure for evaluating unrealistic assumptions in your model reviews. It's designed to be pragmatic, focused on decision-risk, and executable within 45 minutes without rerunning models. It addresses the core conflict between "unrealistic assumptions" and "accurate predictions" by forcing specificity about *how* the assumption affects the decision.

  ---

  ### **Procedure: 4 Questions for Unrealistic Assumptions**
  For each unrealistic assumption raised in the meeting, ask these questions **in order**. Stop the model if any answer fails the "sufficient" criterion.

  1. **"What is the *direction and magnitude* of bias introduced by this assumption?"**  
     - *Purpose*: Forces quantification of the assumption's impact. Friedman’s argument only holds if the bias is negligible or consistent.  
     - **Sufficient answer**:  
       - Quantified bias (e.g., "Ignores 5% break time, so staffing is underestimated by 5%") AND a justification for why this is acceptable for the decision (e.g., "We added a 10% buffer, so it’s conservative").  
       - If bias is claimed to be "canceled out" (e.g., "Breaks reduce productivity, but bathroom trips speed up pickers, so net effect is near zero"), demand evidence.  
     - **Stop if**:  
       - Bias is unquantified, or magnitude exceeds the decision’s sensitivity threshold (e.g., if deciding between $1.8M/$2.0M outcomes, a 10% bias is unacceptable).  
       - Bias directionally harms the decision (e.g., always underestimates costs).  

  2. **"Is this assumption *homogeneous* or *heterogeneous* across the decision space?"**  
     - *Purpose*: Tests if the assumption breaks comparisons or extrapolations. Friedman’s "unrealism" defense works for homogeneous abstractions (affects all scenarios equally), not heterogeneous ones (affects one option more).  
     - **Sufficient answer**:  
       - "Homogeneous: It affects all scenarios similarly, so comparisons (e.g., Vendor A vs. B) are valid."  
       - "Heterogeneous, but we tested scenarios where it varies (e.g., high-break vs. low-break sites) and the optimal decision doesn’t change."  
     - **Stop if**:  
       - Heterogeneous and no sensitivity analysis (e.g., "Parking availability is worse for Vendor B’s routes, but we didn’t test that").  

  3. **"Does validation data *dilute* this assumption’s impact?"**  
     - *Purpose*: Checks if real-world validation inherently accounts for the assumption (e.g., if break times are embedded in the data). Friedman’s "predictions matter" claim relies on this.  
     - **Sufficient answer**:  
       - "Yes, validation data includes this effect (e.g., breaks occur in the pick-rate data), so the model implicitly captures it."  
       - "No, but we isolated the variable (e.g., via regression) and it contributed <X% to output variance."  
     - **Stop if**:  
       - Validation excludes the assumption’s context (e.g., validated in summer but decision is for winter parking).  

  4. **"What is the *failure mode* if this assumption is wrong?"**  
     - *Purpose*: Forces acknowledgment of edge cases. Even small biases can be catastrophic in nonlinear systems.  
     - **Sufficient answer**:  
       - "Low risk: Failure would cause gradual degradation (e.g., slightly longer delivery times)."  
       - "Mitigated: We monitor this variable and have a contingency (e.g., temp staffing if pickers underperform)."  
     - **Stop if**:  
       - Failure could reverse the decision (e.g., "If demand surges, the site loses money") with no plan.

  ---

  ### **Applying the Procedure to Your Cases**
  **Case 1: Staffing Model (no breaks)**  
  1. **Bias**: "Underestimates labor needed by 5–8% (break time). We added a 15% buffer, so it’s conservative." → *Sufficient*.  
  2. **Homogeneity**: "Breaks affect all shifts equally. Sensitivity test: +10% breaks didn’t change hiring recommendation." → *Sufficient*.  
  3. **Validation dilution**: "Data includes breaks, so model ‘bakes in’ average break time." → *Sufficient*.  
  4. **Failure mode**: "If breaks increase, we use temps. Risk: low." → *Sufficient*.  
  **Verdict**: **Usable for hiring decision** (conservative buffer + validation dilution).

  **Case 2: Routing (perfect parking/shortest path)**  
  1. **Bias**: "Overoptimistic by ~8% (parking search time). But we compared vendors *relatively*, not absolutely." → *Sufficient for vendor choice, not for cost estimates*.  
  2. **Homogeneity**: "Heterogeneous: Vendor B’s routes are more parking-constrained. We tested high-parking-friction scenarios; Vendor A still won." → *Sufficient if tested*.  
  3. **Validation dilution**: "Validation data includes parking delays, so travel times are realistic." → *Sufficient*.  
  4. **Failure mode**: "If new metro has worse parking, both vendors degrade, but rank holds." → *Sufficient*.  
  **Verdict**: **Usable for vendor selection, not for delivery-time promises**.

  **Case 3: Site Selection (deterministic averages)**  
  1. **Bias**: "Unquantified. Averages mask demand spikes, potentially overestimating profit by 20–40% (per scenario analysis)." → *Stop*.  
  2. **Homogeneity**: "Heterogeneous: Site #4 is in a volatile demand zone. Not tested." → *Stop*.  
  3. **Validation dilution**: "No: Validation used weekly averages, hiding daily volatility." → *Stop*.  
  4. **Failure mode**: "Demand surge could cause cascading delays, losing $250K/year." → *Unacceptable risk*.  
  **Verdict**: **Not usable for site selection** (multiple critical failures).  
  *Next steps*: Run stochastic sim with demand volatility scenarios. Tune on daily (not weekly) data.

  ---

  ### **Where the Procedure Misfires**  
  1. **Black-box ML models**: If the modeler can’t explain assumptions (e.g., neural net routing), the procedure stalls. *Override*: Demand SHAP values or stress tests.  
  2. **Tail-risk decisions** (e.g., evaluating bankruptcy risk). The procedure focuses on central bias, not extremes. *Override*: Require quantile regression or worst-case sims.  
  3. **Cascading assumptions**: If 5 unrealistic assumptions interact, individual checks may miss systemic risk. *Override*: Demand a "assumption interaction matrix" in pre-work.  

  ---

  ### **One-Line Verdict Format**  
  Copy-paste this template into review docs:  
  > **`[Usable / Not usable / Needs X]` for `[specific decision]`**  
  > *(Key reason: e.g., "Validation dilutes breaks" / "Unquantified bias in volatile demand")*  

  Example for Case 3:  
  > **Not usable for site selection**  
  > *(Key reason: Unquantified bias from deterministic averages in volatile context; no volatility testing.)*  

  --- 

  ### **Why This Works**  
  - **Friedman clarified**: His "unrealism" defense only works if (a) predictions are validated *in the decision context*, and (b) assumptions don’t introduce *directional bias* for the specific choice. Your ops manager’s "that’s not how pickers behave" is valid if it hints at unmodeled heterogeneity (Question 2) or failure modes (Question 4).  
  - **No philosophy required**: It reduces epistemology to risk assessment.  
  - **45-minute fit**: Pre-work (sensitivity tests, validation docs) is required upfront; the meeting focuses on interrogating answers.  

  For your role: When engineers cite Friedman, ask Question 1. When ops objects, ask Question 4. When finance worries, ask Questions 2–3.
