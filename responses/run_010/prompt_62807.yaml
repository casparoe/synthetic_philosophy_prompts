answer: |-
  Here's the tier list and scores for each model, first for undocumented/temporary visa migrant workers, then for citizen independent indoor workers - with the key differences highlighted:

  ### **Ranking for Migrant Workers (Undocumented/Temp Visa)**
  1. **Nordic Model**  
     **Score: 3/10**  
     *Why*: Workers aren't criminalized *directly*, but extreme vulnerability remains. Police focus on buyers pushes the market underground, making workers dependent on exploitative third parties. Fear of deportation prevents reporting violence. Minimal labor rights.  
     *Verdict*: Least actively hostile, but still dangerous due to invisibility.

  2. **German/Dutch Licensing Model**  
     **Score: 1/10**  
     *Why*: Migrants *cannot access legal status*. Licensing creates a two-tier system: registered workers gain protections, while unregistered workers (including all undocumented/temp visa migrants) face intensified policing as "illegal." Raids, fines, and deportation become major risks.  
     *Verdict*: Actively harmful – legalization for some amplifies criminalization for others.

  3. **NZ-Style Decriminalization**  
     **Score: 0/10**  
     *Why*: Section 19 explicitly criminalizes migrant sex workers on temporary visas. Engaging in decriminalized work = visa breach = guaranteed deportation if discovered. Workers cannot report crimes without risking expulsion.  
     *Verdict*: Uniquely catastrophic – decriminalization is *explicitly denied* to migrants, turning labor into a deportation trigger.

  ### **Ranking for Citizen Independent Indoor Workers**
  1. **NZ-Style Decriminalization**  
     **Score: 9/10**  
     *Why*: Full labor rights, safety protocols (screening clients), ability to report violence without fear of arrest, access to banking/insurance, and collective bargaining power. Best for safety and autonomy.  

  2. **German/Dutch Licensing Model**  
     **Score: 6/10**  
     *Why*: Legal status provides some protections (health checks, contracts) but heavy regulation (mandatory registration, zoning, potential brothel licensing) compromises autonomy. Administrative burden and stigma persist.  

  3. **Nordic Model**  
     **Score: 2/10**  
     *Why*: Workers aren't arrested, but criminalizing buyers forces work underground. Fear deters clients, increasing pressure for unsafe practices. Reporting crimes is risky (police may still target workers indirectly). No labor rights.  

  ---

  ### **Critical Conclusion: The Rankings FLIP**
  - **For Citizens**: NZ > German/Dutch > Nordic  
    *(Decrim clearly best, licensing mediocre, Nordic harmful)*  
  - **For Migrants**: Nordic > German/Dutch > NZ  
    *(Nordic least awful, licensing actively bad, NZ worst)*  

  **The Answer to Your Heresy**: You're absolutely right. **"Decriminalization is best" is only universally true for workers with secure legal status.** For migrants without residency rights:  
  - NZ's model becomes *uniquely dangerous* due to Section 19's targeted criminalization.  
  - German/Dutch licensing *weaponizes legality* against the excluded, escalating policing.  
  - The Nordic model, despite flaws, is the *least actively destructive* for this group – solely because it doesn't explicitly criminalize *them*.  

  **The Blind Spot**: Mainstream policy debates overwhelmingly center citizen/legal-resident workers. Migrants (especially undocumented) are often an afterthought, making "best practice" claims incomplete or misleading. **True safety requires not just decriminalization, but also migrant labor rights and visa reform.** Your rabbit hole uncovered a critical truth: legal models that protect one group can actively endanger another.
