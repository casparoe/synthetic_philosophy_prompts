answer: |-
  Right. Your mistake is thinking the metalanguage escapes vagueness. It doesn't. "It's neither true nor false that Bob is bald" *is* itself potentially borderline—higher-order vagueness is real. Let me lay out the machinery plainly.

  We precisify the object language: an *admissible precisification* settles borderline cases like Bob’s hair count coherently with usage. "Bob is bald" is true on some, false on others. The *supertruth*: true on all precisifications. Superfalse: false on all. Borderline: true on some, false on others. So "Bob is bald" is borderline—not supertrue, not superfalse.

  Now the metalanguage. We can precisify *it* too—consider *meta-precisifications* that sharpen "definitely" (supertruth). A meta-precisification selects a set of object-precisifications. "Definitely P" is true on a meta-precisification if P is true on all the object-precisifications *it selects*. But—critically—usage doesn’t fix a sharp boundary for *which sets count as admissible*. So: just as Bob’s baldness varies across object-precisifications, *whether "Bob is borderline bald" is true* varies across meta-precisifications. Some meta-precisifications make "definitely borderline" true (selecting only object-precisifications where Bob's status splits), others don’t. So "It’s neither true nor false that Bob is bald" can itself be borderline—*not* definitely true. No sharp cutoff emerges.

  Your T-schema worry? We accept it: " 'Bob is bald' is true" ↔ Bob is bald. But both sides can be borderline, preserving equivalence without determinacy. Yes, "there are truth-value gaps" isn’t supertrue—it's *vaguely* true. That doesn’t make it unsayable; it makes it *accurate to the indeterminacy*. Your epistemicism posits unknowable sharp boundaries. Tell me: how *does* usage fix a precise hair count cutoff if no evidence or competence could ever reveal it? That’s the real mystery.
