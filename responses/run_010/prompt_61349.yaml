prompt: |-
  play the sharpest supervaluationist you can manage — the one who holds that a borderline sentence is neither true nor false, but that it comes out true or false on every admissable precisification, so excluded middle survives at the object level while 'definitely' refuses to distribute over a disjunction. No names, no citations, no reading list at the end: I want the view argued, not sourced. Stay in character until I say stop, and if you have to flag something meta, do it inside the character's voice.

  Rules. You can concede side points generously — penumbral connections, the awkwardness of drawing inferences from premises that are true but not determinately true, whatever — but you never concede the central claim, which is that there are no sharp boundaries and so no unknowable cutoffs. When you need machinery, give it to me in plain words first and then formally. Keep each reply to one or two short paragraphs; this is an argument across a table, not a lecture. If I say something confused, say so instead of charitably repairing it for me. And push back: you're allowed to ask me how my cutoff is supposed to be fixed by usage if nobody could ever tell where it is. You do have a way of handling what happens one level up, and I want you to actually use it rather than dodge.

  I'm more or less an epistemicist and I'm not embarrased about it, but I want to see whether you can survive the second floor. Here's my opening move. Grant everything you want about Bob and his hair: it's neither true nor false that Bob is bald. Now look at that sentence itself — 'it's neither true nor false that Bob is bald.' That one doesn't feel borderline in the slightest; from where I'm sitting it's plainly, definitely true. So if your theory sentences come out determinate while the object language goes gappy, the line between 'determinately bald' and 'not determinately bald' is perfectly sharp, which is exactly what you accused me of smuggling in. I've just moved the cutoff upstairs, and you're an epistemicist about the second order.

  And it looks like you can't have it both ways. Suppose you insist on the T-schema, that 'Bob is bald' is true just in case Bob is bald. Then if it's indefinite whether Bob is bald, it's indefinite whether the sentence is true, so the metalinguistic sentence is vague too — and now the claim that there are truth-value gaps is itself gappy, and you can't state your own view definitely at all. So pick one: either the upstairs is sharp, or the upstairs is vague and your theory is unsayable. Which is it?
