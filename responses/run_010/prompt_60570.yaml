  But wait, in biological systems, the setpoint is represented (e.g., in the hypothalamus). Without representation, it's just an external control loop.

  Now, the key feature doing the work:

  The structural fact that View Two requires is that the agent must have a representation of the goal (or the aversive signal) and the ability to act upon it. The base case lacks that representation. The KL penalty is not represented by the agent and is not part of the state. Therefore, View Two denies valence.

  If we remove the lack of representation (by making it observable and steerable as in Variant 2), then View Two concedes valence.

  What about unactionability? In the base case, the agent cannot take actions to directly avoid the KL penalty because it is a function of the entire sequence and not observable. But the agent does take actions (token generations) that affect the KL. However, without the KL being in the state, the agent cannot learn to condition its actions on the KL. So it is unactionable in the sense that the agent cannot perceive it and therefore cannot choose actions with the goal of reducing it.

  The fact that it is a constraint on routes rather than a destination? That might be another way to put it. The KL penalty is a penalty on the trajectory, not a destination that the agent is seeking.

  But note: the reward model score is also a destination (at the end of the sequence) and the agent doesn't observe it until the end. However, the agent can learn a value function that estimates the future reward. Similarly, the KL penalty is per token and the agent might learn to predict the KL of a token? But in the base setup, the KL penalty is not observable and the agent doesn't get any signal about the KL until the reward is computed (at the end of the sequence, or per token in the gradient update). Moreover, the KL is computed by the trainer, not by the agent.

  Therefore, the agent does not and cannot represent the KL penalty during action selection.

  Best attack by the defender of the view that comes out worse:

  Suppose we think View One is worse because it attributes valence to the KL penalty in the base case. The defender of View One might say: "The case is rigged because it stipulates that the agent doesn't represent the KL, but that doesn't mean the agent isn't 'experiencing' aversion. In fact, the gradients are pushing the agent away from high KL regions, which is functionally equivalent to pain. The lack of representation only means the agent isn't aware of what is causing the aversion, but it still feels the aversion."

  But View Two would counter: Without representation, there is no 'feeling' because feeling requires that the agent is aware (at some level) of what is being avoided.

  Alternatively, the defender of View Two (if View Two comes out worse) might say: "In Variant 2, we only added observability. But observability doesn't necessarily imply that the agent has learned to care about the KL penalty as an end. It might still be that the agent only uses the KL observation as a means to maximize the total reward. So there is no intrinsic valence to the KL penalty even when it's observable."

  But note: View Two requires that the agent has learned to seek or avoid the signal as an end. If the agent is trained with the KL penalty as part of the reward, then the agent is being trained to avoid high KL as an end (because it is part of the reward). However, if the agent is trained with the KL penalty and then we make the KL observable, the agent might learn to represent the KL and avoid it as a subgoal. But it is still instrumental to the total reward. So View Two might require that the agent has a representation of the KL as a terminal goal? But that is not typical in RL. Most RL agents have instrumental goals.

  This is a problem for View Two: it might be too restrictive because it requires terminal goals. But in biological systems, many aversions (e.g., pain) are instrumental and not terminal. We avoid pain because it is painful, but ultimately because it is evolutionarily adaptive. So perhaps View Two should be revised to include instrumental goals that are represented and acted upon.

  But then in the base case, the agent doesn't represent the KL at all, so it wouldn't count. In Variant 2, if the agent learns to represent the KL and take actions to reduce it (even as an instrumental goal), then View Two would count that as valence.

  Now, after the variants:

  - Variant 1: Potential-based shaping. View One can avoid the reductio by tying valence to the gradient signal (the advantage) and not the raw reward. The shaping term does not change the advantage. So no absurdity.

  - Variant 2: Making it observable and steerable. View Two now concedes valence. View One still sees valence. So both agree.

  - Variant 3: Adaptive controller. It doesn't change View One (still valence) and View Two still denies (without representation). But it might make View One's case stronger because the penalty is regulated, which is a common feature in affective systems.

  My own take:

  I think the base case favors View Two. The reason is that without representation, the KL penalty is just an external shaping force. The agent is not an entity that can "feel" anything; it's a policy being optimized. The gradients are just numbers. The agent doesn't have any internal state that represents the penalty, so there is no candidate for what is being felt.

