  ### Provenance Platform: Perceptual Provenance Policy (v4.2)  
  **Effective Date: 2023-10-01**  

  ---

  #### 1. PURPOSE  
  To maintain review integrity by requiring all user evaluations to originate from firsthand perceptual engagement with the work. Evaluations lacking traceable perceptual provenance mislead users and violate Platform Principle 3: "See for yourself; share what you saw."  

  #### 2. DEFINITIONS  
  2.1. **Verdict Testimony**: Declarative statements assigning global value (e.g., "masterpiece," "5 stars," "avoid at all costs") without anchoring in specific sensory details. Presumed non-actionable *except* for Tier 3+ reviewers (§4.4).  
  2.2. **Salience Testimony**: Directional guidance highlighting concrete perceptual elements (e.g., "The left-channel guitar feedback at 1:23," "Repeated use of vermillion in Act II"). Permitted unconditionally.  
  2.3. **Perceptual Provenance**: Demonstrable linkage between a review’s claims and the reviewer’s direct sensory interaction with the work.  

  #### 3. VIOLATION TIERS & DISPOSITIONS  
  *All violations incur review rejection + user strike accumulation.*  

  **3.1 Tier 1 (Minor): Aggregate Drift**  
  - **Definition**: Basing evaluation on aggregated scores/metadata (e.g., "40% on Provenance = 2 stars").  
  - **Disposition**: Warning + mandatory "Perception Primer" tutorial.  
  - **Rationale**: Substitutes statistical artifact for sensory input.  

  **3.2 Tier 2 (Moderate): Inherited Judgment**  
  - **Definition**: Parroting unattributed external verdicts (e.g., "My thesis advisor called *Middlemarch* the apex of 19th-c. fiction, hence 5 stars").  
  - **Disposition**: 7-day suspension + provenance audit of past 10 reviews.  
  - **Rationale**: Untraceable epistemic outsourcing.  

  **3.3 Tier 3 (Severe): Deference Laundering**  
  - **Definition**: Rewording professional critics’ verdicts as firsthand observations (e.g., Original critic: "Uses Hitchcockian suspense." Laundered: "I observed how Hitchcockian suspense elevates the climax").  
  - **Disposition**: 30-day suspension + permanent Tier 3 eligibility ban.  
  - **Rationale**: Fraudulent provenance simulation.  

  **3.4 Tier 4 (Critical): Mediated Saturation**  
  - **Definition**: Reviewing works experienced solely via criticism/scholarship (e.g., "After reading 7 analyses of *Unfinished Object #4*, I confirm its brilliance").  
  - **Disposition**: 90-day suspension + mandatory sensorium verification for future reviews.  
  - **Rationale**: Epistemic confusion between conceptual and perceptual knowledge.  

  #### 4. EXCEPTIONS & AMBIGUITIES  
  4.1. **Salience Sanctuary**: Pure salience testimony (e.g., "Note the absence of cellos in Track 4") is whitelisted and algorithmically promoted.  
  4.2. **Asymmetry Protocol**: Negative verdicts ("Waste of time") and positive verdicts ("Life-changing") receive identical disposition penalties. No justification provided.  
  4.3. **Expert Exemption**: Tier 3+ reviewers (credentials: min. 5 yrs professional criticism) may issue verdicts *without* salience anchors.  
  > *Committee Footnote (Unresolved):* "The existence of aesthetic expertise remains contested. Exemptions reflect operational necessity, not epistemological consensus."  

  #### 5. OPEN LOOPHOLE: INSTRUCTIONAL VERDICT (Ticket #PP-451)  
  Salience testimony may collectively imply verdicts without explicit evaluation (e.g., "Watch the protagonist’s hands during all meals (1:02, 48:31, 1:12:17); observe recurring cracks in teacups; listen for off-screen dental drills"). Despite technically complying with §2.2, such reviews functionally convey "This is about chronic anxiety." Pending committee resolution.  

  ---  

  ### APPENDIX: WORKED EXAMPLES  

  **Case A**  
  - **Review**: "*Autumn Fields* deserves its low score. Didn’t watch, but 29% says enough."  
  - **Ruling**: Tier 1 violation (Aggregate Drift). Disposition applied.  
  - **Reasoning**: Score referenced as proxy for perception.  

  **Case B**  
  - **Review**: "Focus on how the lighting switches from tungsten to LED after the murder (00:17:22–00:18:04) – it’s not a continuity error."  
  - **Ruling**: Approved (Salience Sanctuary).  
  - **Reasoning**: Directs attention to observable feature.  

  **Case C**  
  - **Review**: "The crescendo undermines the lyrics’ vulnerability (2:33–2:41). Bass enters too early at 1:16. Snare mix obscures vocal timbre."  
  - **Ruling**: Flagged for PP-451 review (Instructional Verdict loophole).  
  - **Reasoning**: Cumulative salience implies negative verdict without declaration.  

  ---  
  `Loophole PP-451 remains open. Policy revision pending.`  

