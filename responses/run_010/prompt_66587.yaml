prompt: |-
  ok, background first. I TA a second-year aesthetics seminar and every single year the same fight blows up in week three: somebody says they didn't bother seeing a film because it was sitting at 40% on the agregator, somebody else says that's insane because a number can't tell you a movie is good, and a third says of course it can, we learn everything from other people, why would this be special. I'm with the second person but I've never managed to say why without just thumping the table. The thing that actually convinces me is a distinction I made up on a bus and have never seen anyone else draw, so I want to stress-test it by watching it get bureaucratized.

  The distinction: verdict testimony vs. salience testimony. Verdict testimony is being told the work is good — trust me, it's gorgeous — and my feeling is that this can't give you whatever it is you're missing, though I couldn't tell you whether the missing thing is knowledge, or justification, or just the experience. Salience testimony is being told *where to look*: watch the hands in the second scene, the mix is doing something sneaky with the drums, read it for the sentences not the plot. That kind seems to actually work, and I think it works because it changes what you perceive instead of stacking a belief on top of nothing. Which would mean the trouble with aesthetic testimony isn't that testimony is a bad pipe to some truth about beauty, it's that there's nothing at the far end of the pipe until you've perceived the thing, so the only testimony that helps is testimony about *how* to perceive it. Whether that's a real position or the same old problem wearing a hat, I genuinely don't know. Build the piece out of it and let it break if it breaks.

  What I want: a deadpan internal Trust & Safety policy document, ~800 words, numbered sections, from a fictional review platform — call it Provenance, I like the double meaning — where every user review is screened for "perceptual provenance," i.e. whether the reviewer actually saw the work or is passing something off. It's the handbook the moderation queue works from, so it needs a definitions section that operationalizes verdict vs. salience, then a graded list of violation categories with dispositions, then a short appendix of two or three worked examples (an offending review snippet plus the moderator's ruling and reasoning). I want at least these in the mix: inherited judgments nobody can trace to a viewing (someone's grandmother said Middlemarch was the greatest English novel and they've been defending that in arguments for twenty years); what I'd call deference laundering, where a user rewords a professional critic's verdict until it reads as first-hand; aggregate drift, reviewing the score rather than the work, or reviewing a work you haven't seen but have read so much about that it feels like seeing it; a tier of credentialed expert reviewers whose verdicts are allowed, with a committee footnote that can't agree whether aesthetic expertise even exists; and some inconsistency in how warning-off reviews are treated versus praise, which the policy should paper over rather than explain. The salience stuff should be explicitly permitted and even promoted, and that has to create a loophole the document notices and fails to close — a review made entirely of where-to-look instructions that adds up to a verdict anyway. Please end on that open ticket.

  Tone-wise: the target is a practice and a position, including my own, not any real person — don't name real critics, publications, or companies, and don't cite anything, I'll add references myself if I ever use this. The joke is what happens when you try to enforce an acquaintance requirement with a moderation backlog and an appeals process, so keep it flat and procedural throughout, no winking, no asides about how absurd this all is. A reader who's never thought about testimony should still find it funny as workplace satire; someone who works on aesthetic and moral testimony should recognize that whoever wrote it understands exactly where the hard cases are, and should be able to reconstruct the standard objections from the policies alone without the document ever stating one.

  Then after the policy, give me a JSON object (keep it compact, no commentary around it) with this schema: {"policy_title": string, "categories": [{"name": string, "prohibits": string one sentence, "real_issue": string — the actual problem in the testimony debate this exaggerates, "severity": one of "minor"|"moderate"|"severe", "specialist_verdict": string one sentence on whether an aesthetician would call this fair or a strawman}], "loopholes": [{"name": string, "why_unsolvable": string}], "does_the_distinction_survive": string, 3-4 sentences telling me straight whether verdict/salience held up once you had to make it enforceable, or whether it collapsed into the thing it was supposed to explain}
reasoning: |-
  We are creating a fictional moderation policy document for a review platform called Provenance. The policy is centered around the distinction between "verdict testimony" (declaring a work good/bad without substantive guidance) and "salience testimony" (guiding perception by pointing to specific aspects). The policy aims to prohibit or restrict verdict testimony while promoting salience testimony.

  The document will be structured as follows:
  1. Introduction and definitions (operationalizing verdict vs. salience testimony).
  2. A graded list of violation categories with dispositions (including examples like inherited judgments, deference laundering, aggregate drift, etc.).
  3. An appendix with worked examples (review snippets and rulings).

  Additionally, we are to include:
  - A tier of credentialed experts whose verdicts are allowed (with a committee footnote about disagreement on aesthetic expertise).
  - Inconsistency in handling warning-off reviews vs. praise (without explaining it).
  - Explicit permission for salience testimony, which leads to a loophole (a review that is entirely salience instructions but adds up to a verdict) that remains an open ticket.

  After the policy document, we will provide a JSON object with the specified schema.

  Let's start with the policy document.

  ---

  **Provenance Platform: Perceptual Provenance Policy (Version 3.1)**

  **1. Purpose and Scope**  
  This document establishes guidelines for moderating user reviews on Provenance to ensure that all published content adheres to the principle of "perceptual provenance" — the requirement that a reviewer's assertions must be demonstrably traceable to their direct, unmediated engagement with the work under review. The policy is designed to combat the proliferation of aesthetic testimony that lacks a basis in personal perception, which undermines the platform's mission to facilitate meaningful aesthetic discovery.

  **2. Definitions**  
  2.1. **Verdict Testimony**: Any evaluative assertion that ascribes an overall quality (e.g., "masterpiece," "terrible," "5/5 stars") or comparative standing (e.g., "the best in the genre") to a work without anchoring that evaluation in specific, observable features of the work. Verdict testimony is characterized by its lack of perceptual scaffolding and is presumed non-actionable unless submitted by a Credentialed Expert (see Section 4.3).  
  2.2. **Salience Testimony**: Any assertion that directs attention to concrete, perceptible elements of a work (e.g., "the use of chiaroscuro in Act 2," "the counterpoint between bass and violin in track 4") without presupposing an evaluative conclusion. Salience testimony is permissible and encouraged, as it equips users to perceive features they might otherwise overlook.  
  2.3. **Perceptual Provenance**: The demonstrable link between a reviewer's assertions and their firsthand sensory engagement with the work. Provenance is established when a review grounds its claims in specific, verifiable details that could only be known via direct perception.

  **3. Violation Categories and Dispositions**  
  Reviews are evaluated against the following criteria. Violations are categorized by severity and subject to the listed dispositions (Warning, Rejection, or Ban).  

  3.1. **Category A: Inherited Judgments (Severity: Moderate)**  
     - **Definition**: Assertions adopted from third-party sources (e.g., family, cultural canon) without independent verification via direct engagement.  
     - **Example**: "My grandmother always said *Middlemarch* was the greatest English novel, and I agree."  
     - **Disposition**: Rejection. Reasoning: Lacks perceptual provenance; the evaluation derives from external authority, not user perception.  

  3.2. **Category B: Deference Laundering (Severity: Severe)**  
     - **Definition**: Repackaging a professional critic's verdict as firsthand experience through paraphrasing or superficial elaboration.  
     - **Example**: "The cinematography’s symbolism is transcendent (cf. *The Cinephile Quarterly*, Issue 22)" rewritten as "I felt the cinematography’s symbolism achieved transcendence through its interplay of light and shadow."  
     - **Disposition**: Rejection + 30-day suspension. Reasoning: Attempts to circumvent provenance requirements by masking secondhand evaluation as original perception.  

  3.3. **Category C: Aggregate Drift (Severity: Minor)**  
     - **Definition**: Evaluating a work based primarily on its aggregate score or general reputation rather than personal engagement.  
     - **Example**: "I didn’t watch *Solaris* because it has 40% on Provenance, so I’m rating it 2 stars."  
     - **Disposition**: Warning + rejection. Reasoning: Substitutes statistical consensus for perceptual engagement.  

  3.4. **Category D: Mediated Saturation (Severity: Moderate)**  
     - **Definition**: Reviewing a work based on exhaustive secondary analysis (e.g., essays, podcasts, fan theories) that creates an illusion of firsthand knowledge.  
     - **Example**: "After reading six critical dissections of the film’s motifs, I can confirm its genius — though I haven’t seen it."  
     - **Disposition**: Rejection. Reasoning: Secondary analysis cannot substitute for sensory input.  

  3.5. **Category E: Credentialed Expert Exemption**  
     - **Definition**: Verdict testimony is permitted if submitted by a reviewer vetted and approved by the Provenance Editorial Committee.  
     - **Example**: A Critic-Level user stating "*Vermilion Dreams* is a landmark achievement" without elaboration.  
     - **Disposition**: Approved.  
     - **Committee Footnote**: The Editorial Committee acknowledges unresolved debate regarding the ontological status of aesthetic expertise. Approval does not constitute an endorsement of this concept.  

  **4. Inconsistency Protocol**  
  4.1. Reviews that discourage engagement (e.g., "skip this," "not worth your time") are treated identically to equivalent endorsements (e.g., "must-see").  
  4.2. Moderators must not justify disparities in disposition frequency between positive and negative verdicts.  

  **5. Salience Promotion and the "Instructional Verdict" Loophole**  
  5.1. Salience testimony is unrestricted and may be algorithmically promoted.  
  5.2. **Open Ticket #451**: Reviews composed entirely of salience testimony may implicitly convey a verdict (e.g., "Note how the director frames every shot around empty chairs" for a film about loss). Moderation is instructed to approve such reviews, pending committee resolution of whether directive language inherently constitutes evaluation.  

  **Appendix: Worked Examples**  

  **Example 1**  
  - **Review Snippet**: "*The Waves* is overrated. My professor said it was Virginia Woolf’s weakest, and after skimming it, I see why."  
  - **Ruling**: Rejected (Category A + D).  
  - **Reasoning**: Relies on inherited judgment ("professor said") and admits non-engaged engagement ("skimming").  

  **Example 2**  
  - **Review Snippet**: "Focus on the protagonist’s hands in Scene 3 — their trembling contradicts her dialogue."  
  - **Ruling**: Approved.  
  - **Reasoning**: Pure salience testimony; directs attention to a perceptible feature.  

  **Example 3**  
  - **Review Snippet**: "The drums are mixed to echo heartbeat rhythms (track 2), the bassline mirrors respiratory rates (track 4), and the vocals are pitched to neonatal frequencies (track 7)."  
  - **Ruling**: Approved (but flagged for Open Ticket #451).  
  - **Reasoning**: Despite being salience testimony, the cumulative effect implies a verdict (e.g., "this album is about birth"). Loophole status acknowledged.  

