prompt: |-
  ok so I need you to be my philosopher-in-residence for a sec — pretend you're someone who's spent twenty years thinking hard about Confucian ethics and that whole "role ethics" way of reading it, where you're not really a self-contained individual making choices so much as a bundle of the relationships you're in. Please actually work through this carefully instead of pattern-matching to the first thing that comes to mind; I'd rather see the messy brainstorming than a polished hot take.

  Here's the setup. There's a woman, mid-40s, no philosophy degree, but she's read a *lot* on her own and posts these long case-by-case judgments on a forum I lurk on. I've been following her for like two years now and I have her verdicts written down. She never argues from general principles, she just rules on cases, which makes her kind of maddening and also fascinating:

  1. A man invites his mom to his wedding but seats her in the third row because his wife's parents get the front — she said that's a genuine wrong, and not a small one, even though the marriage itself was fine and nobody's feelings got hurt at the time.
  2. An elderly father wants meat at every meal and his adult daughter wants him on a heart-healthy diet — she said the daughter shouldn't argue the point, she should just quietly get better at cooking food the man enjoys that happens not to wreck him. Her words were roughly that you can't correct someone you've stopped tending to.
  3. A home health aide who calls her elderly client by her first name from day one, and the family loves her for it — she called this a failure, not a warmth. Said something like intimacy that skips the steps usually just means somebody stopped doing their job.
  4. A daughter who refuses the career her parents sacrificed everything for, in order to make pottery — she said the daughter was allowed to go, and that the parents' grief was a real cost of it, not evidence she'd made a mistake.
  5. An aunt who posts photos of her nephew all over the internet without asking — she said the problem wasn't privacy, it was that the aunt had started treating the kid as material for her own standing.
  6. An older brother who covers for his younger brother's screwup instead of telling their father — she said that was correct, because the brother who came to you in confidence and the brother who reports you are not the same brother.
  7. A son who writes his college application essay about his mother's illness without telling her — she said that one was clearly wrong even if it got him the scholarship.

  She also once approved of the story she likes, the one about the sage-king who'd have carried his guilty father on his back and run off into exile rather than let the law have him, so I know she doesn't think these roles always lose to the rules. What I can't figure out is what she's actually running underneath all this.

  Now here's my actual situation, and it's not hypothetical. My younger brother told me in confidence why he wants to drop out of school in the spring, and it's heavier than "he met a girl" — there's a counselor involved and medication and he made me promise not to repeat any of it. Two weeks ago my mom sat me down and asked me, as the older brother, to talk him out of it. If I stonewall her, she'll worry twice as hard and she'll think I've abdicated, and honestly she'll be right that I've been dodging her. If I tell her what he said, I've traded the person who came to me for the person who assigned me a task.

  So, three things from you. First, before you answer anything, brainstorm out loud: give me three to five candidate rules that are each consistent with *all seven* of her verdicts above, stated in plain language, and for each one say what it hands her on my brother-and-mom case. They should not be straw men — I want at least two that I'd find genuinely plausible. Second, give me your best single guess at what she says, and be honest about which of your candidates my list of seven simply cannot tell apart; if the record underdetermines it, say exactly what she'd be committing herself to with each possible answer. Third, give me one more case I could drop on her next week — something I'd have to invent, with enough specific detail that she can't wiggle out — that would cleanly separate whichever two rules are still tied. No need to cite anything or point me at reading lists, I've got the books backed up on a shelf and mostly unread, I just want the reasoning.
reasoning: |-
  Okay, the user wants me to act as their philosopher-in-residence, specifically drawing from Confucian role ethics. They've provided seven case judgments from a woman whose reasoning they're trying to understand. Now, they're facing a real-life dilemma with their brother and mother. They need me to brainstorm candidate rules that fit all seven cases, apply them to their situation, make my best guess about what the woman would say, and propose a new test case.

  First, I need to deeply understand each of the seven cases. Let me go through them one by one to extract the underlying principles:

  1. Wedding seating: Seating the mom in the third row is wrong even without hurt feelings. This suggests that the role itself carries inherent obligations, regardless of immediate consequences. The son failed in his role as son by not honoring his mother properly.

  2. Elderly father's diet: The daughter shouldn't argue but should improve her cooking. The focus is on tending to the relationship through skillful action rather than confrontation or abstract principles.

  3. Health aide using first name: Skipping formalities is a failure because intimacy must be earned through proper role fulfillment. The aide neglected her professional role boundaries.

  4. Daughter rejecting career for pottery: The daughter is allowed to choose her path, but the parents' grief is valid. Roles change, and children aren't property, but role transitions have real costs.

  5. Aunt posting nephew's photos: The issue is treating the child as material for personal standing rather than respecting him as a person in the relationship.

  6. Brother covering for brother: Protecting the confiding brother maintains the unique role relationship. The brother who comes to you creates a different relational dynamic.

  7. Son writing essay about mother's illness: Violation of privacy and trust within the mother-son relationship. Using the relationship for personal gain without consent.

  The common threads seem to be: roles define obligations, relationships require active tending, and actions must respect the inherent nature of each relationship rather than external rules.

  Now, for the candidate rules that fit all seven cases:

  **Candidate Rule 1: Role Fidelity**  
  - Actions must fulfill the specific obligations of each relationship role you occupy.  
  - Brother-Mom Case: As older brother, your primary fidelity is to your brother's trust. Stonewall mom.  

  **Candidate Rule 2: Relationship Preservation**  
  - Prioritize actions that actively nurture and sustain the health of relationships over time.  
  - Brother-Mom Case: Stonewalling damages mother-son relationship. Share minimally to sustain both relationships.  

  **Candidate Rule 3: Positional Awareness**  
  - Your duties shift based on which relational position is activated in a given moment.  
  - Brother-Mom Case: When brother confided, you became "confidant brother"—that role persists. Stonewall.  

  **Candidate Rule 4: Generative Care**  
  - The right action cultivates the other's capacity to fulfill their roles well.  
  - Brother-Mom Case: Sharing might infantilize brother; stonewalling forces mom to engage directly. Stonewall.  

  Applying these to the brother-mom dilemma shows how each rule leads to different actions, with stonewalling being more consistent.

  My best guess is **Candidate Rule 3 (Positional Awareness)**, as it explains all seven verdicts without contradiction. The wedding seating fails role activation (son role neglected), the diet avoids positional conflict, the health aide skips positional steps, career choice changes positions, the aunt exploits position, covering for brother honors the confidant position, and the essay violates the son's positional duty.

  The hardest to distinguish are Rule 1 (Role Fidelity) and Rule 3 (Positional Awareness). For a test case to separate them:  
  **Case:** A teacher whose student confesses to cheating. If the teacher comforts the student but reports them (Role Fidelity to institution), or protects the student (Positional Awareness of the confidant role). The woman would likely say reporting is wrong, supporting Positional Awareness.
answer: |-
  Here's my thinking as your Confucian role ethics sparring partner. I'll work through this step by step, resisting quick conclusions. Key lenses: 1) We're constituted by our relationships, not abstract selves, 2) Roles carry non-transferable obligations, 3) Ethical failure often comes from *inattention* to role-tending, not rule-breaking.

  ### Part 1: Brainstorming Candidate Rules (Consistent with All 7 Verdicts)
  After mapping each case to role-ethics principles, here are four non-strawman candidates. I've flagged which I find *most* plausible (✓) based on coherence:

  1. **Rule: "Honor the activated role's unique demands above all else"**  
     *(Focus: Which relational hat you're wearing in a moment determines duties)*  
     - Why it fits:  
       - Wedding (son role activated → must honor mother);  
       - Aide (professional role requires formal boundaries first);  
       - Brothers (confidant role activated → loyalty to that version of brother);  
       - Essay (son role → can't exploit mother's vulnerability).  
     - **Your case:** When your brother confided, he activated your *confidant-brother* role. That role persists. Stonewall mom. Sharing would violate this specific bond.  

  2. **Rule: "Nurture relationships through skillful tending, not confrontation"** ✓  
     *(Focus: Ethical art lies in maintaining harmony via subtle care, not explicit "correction" or principle-enforcement)*  
     - Why it fits:  
       - Diet verdict (daughter should *skillfully* cook better, not argue);  
       - Wedding (failure to *tend* mother's place subtly);  
       - Aide (skipped tending steps → fake intimacy);  
       - Aunt (using nephew as content → poor tending of caregiver role).  
     - **Your case:** Stonewalling mom is crude tending. Instead, "tend" both: Tell mom *something* like, "He’s working through things with professionals; trust me to support him." Protects brother’s confidence while honoring son role.  

  3. **Rule: "Relationships generate context-specific debts; pay what you owe to whom you owe it"** ✓  
     *(Focus: Each bond creates unique obligations that can't be transferred or overruled)*  
     - Why it fits:  
       - Career change (daughter owes parents grief but not her life);  
       - Brothers (debt to confiding brother > debt to father);  
       - Essay (son owes mother respect for her story);  
       - Wedding (debt to mother unfulfilled).  
     - **Your case:** Your brother’s confidence created an immediate debt to *him*. Mom’s request creates a separate debt, but it’s secondary. Stonewalling pays the primary debt. Sharing would steal from brother to pay mom.  

  4. **Rule: "Protect relational integrity against commodification"**  
     *(Focus: Roles degrade when people treat relationships as tools for personal gain or status)*  
     - Why it fits:  
       - Aunt (using nephew for social capital);  
       - Essay (using mother’s illness for scholarship);  
       - Wedding (wife’s parents' status used to demote mother);  
       - Aide (using false intimacy to ease her job).  
     - **Your case:** Sharing confidences would commodify your brother’s trust (trading it for mom’s approval). Stonewalling preserves relational purity.  

  ### Part 2: My Best Guess & Where Ambiguity Remains
  - **Best guess:** She’d say **stonewall mom, protect brother’s confidence**. Strongest match: **Rule 3 ("Relationships generate context-specific debts")**.  
    - Why:  
      - It explains *all* verdicts cleanly, especially the brothers case (direct parallel to yours) and the essay (debts > utility).  
      - Her "you can't correct someone you've stopped tending to" (diet case) implies debts persist through conflict.  
      - The sage-king story shows role-debts (son > subject) trump societal rules.  
  - **Where ambiguity remains:**  
    - Rules 2 ("skillful tending") and 3 ("context-specific debts") are **tied** on your case. Both *could* justify stonewalling, but Rule 2 might allow gentle evasion ("tending" mom), while Rule 3 demands absolute loyalty to brother.  
    - **Her commitment in the tie:**  
      - If she picks Rule 2, she must accept that "tending" sometimes requires *indirect* action (e.g., misleading mom).  
      - If she picks Rule 3, she must accept that debts can *override* other duties (e.g., your son-role to mom).  
    - The career verdict (allowing daughter’s choice despite parental grief) tips me toward Rule 3—debts don’t mean obedience.

  ### Part 3: Your Test Case to Split Rules 2 & 3
  **Case:** A therapist whose teenage client admits to shoplifting. The client’s father (the therapist’s close friend) asks privately: "Is my kid in serious trouble? Just tell me yes or no." The therapist knows answering "yes" would reveal confidential details.  

  - **Why this splits Rules 2 and 3:**  
    - **Rule 2 ("Skillful tending")**: Therapist might say, "I can’t answer, but let’s discuss how to support him together." *Tends* both relationships without direct refusal.  
    - **Rule 3 ("Context-specific debts")**: Therapist must stonewall. Debt to client’s confidentiality (activated role) > debt to friend. Silence is non-negotiable.  
  - **Key details preventing wiggle-out:**  
    - Therapist and father are *pre-existing* friends (tests role conflict).  
    - Father asks for binary answer (forces all-or-nothing choice).  
    - No imminent harm (removes "safety" exceptions).  
  - **Prediction:** If she prioritizes debts (Rule 3), she’ll insist on silence. If she prefers tending (Rule 2), she’ll approve evasive-but-harmonious phrasing.

  **Final note:** Her method rejects universal rules, so *any* candidate "rule" here is just a heuristic. What unifies her? **Attention to the particular.** Each verdict asks: "Did this person *attend* to what this specific relationship requires *now*?" Your brother’s confidence demands your full attention—not mom’s assignment. Stonewall, but tend your mom-role by listening without capitulating.
