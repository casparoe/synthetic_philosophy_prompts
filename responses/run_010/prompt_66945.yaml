prompt: |-
  Please adopt the role of a philosopher of science with expertise in how functional explanation works — and is criticized — in biology, combined with enough practical familiarity with large software systems that you can follow my examples without translation. Think carefully before answering. I want a carving, not a label, and I would rather you show me your reasoning than arrive quickly at a name.

  Some background. I am a software engineer, fifteen years in, mostly backend infrastructure, with no formal philosophy training. Over the last few years I have become convinced there is a recurring pattern in how teams explain unfamiliar systems, and I have not been able to find a name for it. Let me describe it concretely rather than abstractly.

  Instance one. We inherited a service with a column in one of its tables that was, so far as anyone could tell, always null. Within about an hour of asking around, someone produced an explanation: it must be reserved for a migration that was planned and never finished. The story was plausible, everyone nodded, and it went into our onboarding notes. Four months later, in a design review for a different service, a colleague cited that explanation as the reason to add a similar reserved field to a new schema. Nobody had ever checked whether any code read or wrote the column. I eventually checked; the answer was no.

  Instance two. There is a hardcoded 250 ms pause before one class of retry. As far as I can reconstruct, nobody ever chose 250 ms. It is what falls out of the current timeout values and the health-check interval once an older queueing layer was deleted — a residue of how the remaining pieces fit together, not a decision anyone made. The accepted story, however, is that it is a jitter window preventing a thundering herd. That story took perhaps ninety seconds to produce, it sounds exactly right, and it has since been copied into three other services, in two of which the numbers are different and the described mechanism does not apply.

  What I keep noticing, and cannot name, is this cluster:

  1. The question asked about any unexplained artifact is always some version of "what is it for?" The question "did anyone choose this, or was it forced by the shape of everything around it?" is essentially never asked.
  2. A purpose-story always arrives, arrives fast, and is always plausible. I have never seen the group fail to produce one.
  3. Plausibility is treated as confirmation. The story is written down, repeated, and eventually becomes load-bearing: it justifies keeping the artifact, and justifies building new artifacts like it.
  4. The stories strike me as practically unfalsifiable — nearly any artifact could be given a purpose that sounds right — and yet the possibility that the correct answer is "this is not for anything; it simply came along with the structure of the rest" does not occur to people as a candidate answer at all.

  Two things it is not, to save you some work. It is not Chesterton's fence: Chesterton's point is that you should not tear down a fence until you have found out why it is there, whereas what I am describing is a group that never finds out, invents a reason, and then behaves as though the invention were a discovery. And it is not ordinary confabulation or post-hoc rationalization, because the people generating the story had nothing to do with the artifact's origin and are not defending their own conduct; they are sincere third parties interpreting someone else's work. A colleague also suggested "emergent property," which is not it either — I am not talking about a behavior of the whole absent from the parts, but about a habit of explanation.

  What I would like, in this order:

  (a) Begin with an explicit brainstorming pass. List the candidate concepts, from any field you consider relevant, that could be the established home for this cluster. Do not filter at first; I would rather see the long list and your reasons for cutting it than a confident short list.

  (b) For each surviving candidate, state the concept precisely enough that I could check it against my two instances, then say exactly where my description fits it and where it does not. I expect several candidates will cover the artifact side of the phenomenon but not the explanation-habit side, or vice versa; if so, say which side each covers.

  (c) Tell me which single concept, if any, fits best overall, and what part of my description is left over by every candidate you considered.

  (d) If nothing fits the whole cluster, coin a term for it. Give a definition, the conditions something must satisfy to count as an instance, and at least two boundary cases: one thing that looks like it but is not, and one thing that is it but does not look like it.

  (e) The diagnostic question, which matters most to me: how can one actually distinguish a feature deliberately chosen for a purpose from a feature forced out of the arrangement of everything around it? What would make an origin story checkable rather than merely plausible? I assume that fields which study systems nobody designed — organisms, languages, institutions — have had to solve some version of this problem, and I want to know what they came up with and whether any of it transfers to my case.

  (f) One wrinkle that I suspect breaks whatever term you settle on. Sometimes the invented purpose becomes true: once people believe the 250 ms pause is jitter protection, they begin tuning it as though it were, and eventually it is. Does an explanation that manufactures its own subject matter count as an instance of my phenomenon or as a different one, and if different, what is the relationship between the two?

  Finally, please be candid if part of what I have described is merely ordinary sloppy engineering rather than a distinct conceptual pattern. I would rather be told that, with reasons, than be handed a name that flatters the observation.
reasoning: |-
  Hmm, the user is describing a pattern they've observed in software engineering where teams invent plausible functional explanations for unexplained artifacts (like a null column or a hardcoded pause) and then treat those invented stories as truth. This leads to cargo-cult replication of these artifacts based on fictional justifications. 

  The user wants me to approach this as a philosopher of science familiar with functional explanations in biology, while also understanding large software systems. They've provided two concrete examples and clearly outlined the pattern's characteristics: the exclusive focus on purpose, rapid invention of plausible stories, treatment of plausibility as confirmation, and unfalsifiability. 

  I notice they've already ruled out Chesterton's fence, confabulation, and emergent properties. They're clearly thought deeply about this and want rigorous analysis, not just labels. The six-part request (a through f) shows they want: brainstorming of concepts, precise mapping to their examples, best-fit assessment, potential new terminology, diagnostic methods, and discussion of self-fulfilling prophecies.

  Key challenges here:
  The pattern blends epistemic habits (how people explain) with systemic properties (accidental artifacts). Most philosophical concepts will cover one side but not both. Biology's function debates might help, but software has intentionality layers that biology lacks. The self-fulfilling prophecy aspect (point f) adds complexity - when invented purposes become real through belief.

  For part (a) brainstorming, I should consider:
  - Teleology and functional fixedness from psychology
  - Spandrels and exaptation from evolutionary biology
  - Path dependence and artifact drift from systems theory
  - Narrative fallacy and explanatory depth illusion from cognitive science
  - Institutional isomorphism from sociology

  The user's rejection of "emergent property" suggests I need to carefully distinguish between the artifact's origin and the explanatory habit. Their observation about third-party sincerity also rules out standard confabulation.

  For the diagnostic (part e), I'll need to draw from:
  - Biology's reverse engineering challenges (how to distinguish adaptation from byproduct)
  - Archaeology's use of multiple lines of evidence
  - Software forensics techniques (version control archaeology, dead code analysis)

  The self-fulfilling aspect (part f) is particularly thorny - it turns the phenomenon into a sort of discursive time travel where explanations create their own referents. This might require separating the initial explanatory moment from the subsequent institutionalization.

  Throughout, I should maintain their preferred concrete style - no abstraction without instantiation. And I must respect their warning against "flattering the observation" by being honest where this might just be ordinary engineering laziness (though the patterned nature suggests it's more).
answer: |-
  ### (a) Brainstorming Candidate Concepts  
  Here's an unfiltered list from philosophy of science, biology, cognitive science, and systems theory, with relevance notes:  

  1. **Spandrel (Evolutionary Biology)**: Non-adaptive byproduct of adaptive traits.  
  2. **Teleological Reasoning**: Explaining phenomena by purpose rather than mechanism.  
  3. **Narrative Fallacy (Taleb)**: Creating stories to make sense of past events.  
  4. **Path Dependency (Systems Theory)**: Outcomes shaped by historical accidents.  
  5. **Functional Fixedness (Psychology)**: Inability to see artifacts outside assigned purpose.  
  6. **Exaptation (Gould & Vrba)**: Co-opting a trait for a new function.  
  7. **Institutional Isomorphism (Sociology)**: Mimicking structures for legitimacy.  
  8. **Confabulation (Neuroscience)**: Fabricating explanations without intent to deceive.  
  9. **Artifact Drift (STS)**: Features repurposed without documentation.  
  10. **Explanatory Depth Illusion (Cognitive Science)**: Overconfidence in shallow explanations.  
  11. **Causal Layered Analysis (Futures Studies)**: Distinguishing surface events from systemic causes.  
  12. **Epistemic Inertia (Philosophy)**: Resistance to updating beliefs without evidence.  

  *Filtering rationale*:  
  - Dropped #5 (Functional Fixedness): Focuses on individual cognition, not group dynamics.  
  - Dropped #8 (Confabulation): Explicitly ruled out by your "sincere third parties" criterion.  
  - Dropped #11 (Causal Layered Analysis): Too prescriptive; doesn’t describe spontaneous group behavior.  

  ### (b) Survivor Analysis  
  **1. Spandrel (Gould & Lewontin)**  
  - *Concept*: A non-adaptive evolutionary byproduct (e.g., arches in cathedrals creating "spandrels" later decorated).  
  - *Fit*: Perfect for your artifacts (e.g., the 250ms pause as residue).  
  - *Misfit*: Doesn’t address the *invented purpose* (your cluster #2–4). Spandrels are *recognized* as byproducts; here, they’re misclassified as functional.  

  **2. Teleological Reasoning**  
  - *Concept*: Attributing purpose to phenomena as if designed (e.g., "the eye is for seeing").  
  - *Fit*: Explains the "what is it for?" impulse (your cluster #1) and plausibility-as-confirmation (#3).  
  - *Misfit*: Doesn’t capture how artifacts become *institutionalized* (#3–4) or accidental origins.  

  **3. Narrative Fallacy**  
  - *Concept*: Constructing causal stories to impose order on ambiguity.  
  - *Fit*: Covers rapid, plausible story generation (#2) and unfalsifiability (#4).  
  - *Misfit*: Focuses on *cognitive bias*; ignores systemic replication (#3, e.g., copying the field).  

  **4. Institutional Isomorphism (DiMaggio & Powell)**  
  - *Concept*: Organizations copy structures to gain legitimacy (mimetic isomorphism).  
  - *Fit*: Explains replication without verification (e.g., copying the "reserved field" in new schemas).  
  - *Misfit*: Doesn’t address the *origin* of the artifact (e.g., the accidental pause).  

  **5. Exaptation**  
  - *Concept*: Repurposing a structure for a new function (e.g., feathers evolved for warmth, later used for flight).  
  - *Fit*: Mirrors your wrinkle (#f) where invented purposes *become* true.  
  - *Misfit*: Assumes actual repurposing; your cases involve *fictional* repurposing.  

  ### (c) Best-Fit Concept: **Teleological Spandrel + Institutionalization**  
  No single term fits perfectly. The closest hybrid:  
  - **Teleological Spandrel**: An artifact that emerges non-functionally but is retroactively assigned purpose.  
  - **Institutionalization**: The story becomes embedded in practices.  
  *Gap*: The *speed* of story generation and *systematic avoidance* of non-teleological questions (#1) aren’t fully covered.  

  ### (d) Coined Term: **Teleomimetic Drift**  
  - **Definition**: Accidental system features that, through rapid teleological storytelling and institutional mimicry, acquire perceived purpose and propagate.  
  - **Conditions**:  
    1. Artifact arises non-functionally (path dependency/residue).  
    2. Group generates immediate, plausible functional story.  
    3. Story is treated as evidence, justifying replication.  
    4. Non-teleological origins are excluded from consideration.  
  - **Boundary Cases**:  
    - *Looks like it but isn’t*: A real Chesterton’s fence (e.g., a mysterious API call that *was* intentionally designed but forgotten).  
    - *Is it but doesn’t look like it*: A "jitter window" story that *was* initially invented but later *accidentally* became true through tuning (#f).  

  ### (e) Diagnostic: Distinguishing Design from Accident  
  **Lessons from Biology/Systems Theory**:  
  1. **Trace Material Constraints**:  
     - *Biology*: Compare homologous structures (e.g., panda’s thumb is a wrist bone, not an evolved digit).  
     - *Your case*: Audit code dependencies (e.g., "Does anything read the null column?").  
  2. **Test Plausibility Against Alternatives**:  
     - *Biology*: Use null models (e.g., "Is trait distribution random or adaptive?").  
     - *Your case*: Stress-test stories (e.g., "If we change the 250ms pause, does thundering herd occur?").  
  3. **Historical Archaeology**:  
     - *Biology*: Fossil records show transitional forms.  
     - *Your case*: Git blame, design docs, deprecation timelines.  
  4. **Decoupling Artifact from Story**:  
     - Ask: "If this *were* accidental, what traces would we expect?" (e.g., unused variables, hardcoded values).  

  **Transferable Tactic**:  
  - **Teleological Debugging Protocol**:  
    1. Suspend "what is it for?" Start with "how did this arise?"  
    2. Map dependencies: Is the artifact *causally downstream* of intentional features?  
    3. Seek *absence*: Look for unused permissions, uncalled functions, or invariant values.  
    4. Run deletion tests: Remove/alter the artifact and observe system behavior.  

  ### (f) The Wrinkle: Invented Purposes Becoming True  
  - **This is still Teleomimetic Drift**: The initial phase is identical. The difference is *later* exaptation.  
  - **Relationship**: A two-phase process:  
    - Phase 1: Accidental artifact → teleological story (Teleomimetic Drift).  
    - Phase 2: Story → intentional repurposing (Exaptation).  
  - **Key Insight**: The story *itself* becomes a causal force, blurring origin but not erasing it.  

  ### Candid Assessment  
  This **isn’t just sloppy engineering**. It’s a distinct epistemic pattern:  
  - **Why distinct?**  
    - Speed of story generation (#2) exceeds typical laziness.  
    - Plausibility-as-confirmation (#3) reflects cognitive bias.  
    - Replication (#3) shows sociological isomorphism.  
  - **Why not "ordinary"?**  
    Sloppy engineering might leave artifacts unexplained; here, artifacts are *over*-explained with false teleology.  

  ### Summary  
  - **Core Pattern**: Teleomimetic Drift (accidental → teleological → institutionalized).  
  - **Diagnostic**: Prioritize dependency mapping and deletion tests over storytelling.  
  - **Wrinkle**: Self-fulfilling purposes are Phase 2 exaptation.  

  This pattern reveals a deep-seated cognitive-sociological loop: humans don’t just tolerate ambiguity—they *colonize* it with purpose. The antidote is forensic materiality: treat code as archaeology before theology.
