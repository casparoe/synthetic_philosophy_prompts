  ### Decision Tree for Positions on Analyticity

  **Node 0: Primary explanatory job for analyticity (or its successor)?**  
  - **A**: Ground synonymy and necessity (e.g., explain why "bachelor" is synonymous with "unmarried man").  
  - **B**: Deliver non-empirical knowledge (e.g., how we know truths without evidence).  
  - **C**: Account for the status of logic and mathematics (their necessity and apparent a priority).  
  - **D**: Make sense of meaning change and theory comparison (e.g., in scientific revolutions).  
  - **E**: Diagnose merely verbal disputes (e.g., disputes resolvable by clarifying terms).  

  **Node 1: [Concrete] Researcher discards a classical logical rule (e.g., excluded middle) for empirical simplicity. Legitimate?**  
  - **1**: Yes—no sentence (including logic) is immune to revision.  
  - **2**: No—logical laws are immune; revising them changes the subject.  

  **Node 2: [Concrete] Speaker learned "vixen" solely as "female fox" but now denies this. Diagnosis?**  
  - **a**: Mistaken but competent (meaning is fixed, error possible).  
  - **b**: Incompetent (failure to grasp meaning).  
  - **c**: Changed the subject (meaning shifted).  

  **Node 3: [Concrete] Physicists apply "mass" identically in measurements but disagree on frame-invariance. Diagnosis?**  
  - **i**: Substantive disagreement about mass.  
  - **ii**: Merely verbal dispute.  
  - **iii**: Talking past (incommensurable meanings).  

  **Node 4: Can truth in virtue of meaning (TVM) hold without justification in virtue of understanding (JVU)?**  
  - **α**: No—TVM and JVU are inseparable (understanding guarantees justification).  
  - **β**: Yes—TVM can exist without JVU (e.g., meaning may not yield belief).  
  - **γ**: TVM is incoherent (no such thing).  

  *If γ, skip to Leaf 1. Otherwise, continue.*  

  **Node 5: Are meanings fixed solely by what a competent speaker can know by reflection alone?**  
  - **X**: Yes—reflection suffices (e.g., introspection, conceptual analysis).  
  - **Y**: No—external facts (e.g., causal history, environment) play a role.  

  **Node 6: Do implicit definitions/constitutive rules name a real mechanism?**  
  - **P**: Yes—they explain meaning fixation (e.g., psychological or linguistic process).  
  - **Q**: No—they are placeholders (explanatorily empty when cashed out).  

  **Node 7: If analyticity is kept, is it all-or-nothing or graded?**  
  - **All-or-nothing**: Binary (e.g., sentence is either analytic or not).  
  - **Graded**: Interest-sensitive continuum (e.g., depends on context or purpose).  

