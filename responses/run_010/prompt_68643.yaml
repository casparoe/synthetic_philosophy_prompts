prompt: |-
  I write about science and ideas for an independent monthly magazine, and I also sit on the five-person working group designing a standing readers' council: a rotating body of readers who would meet quarterly to advise the editorial team on how we cover contested subjects — artificial intelligence, vaccination policy, climate adaptation. The group votes next Thursday on the recruitment rule, and the memo I circulate beforehand needs to settle it.

  Three proposals are on the table. First, pure sortition: a stratified random draw from a commercial address file, matched to census margins, with an honorarium and no screening of any kind, and decliners replaced by the next name drawn in their stratum. Second, an open call: volunteers, with the editors selecting for regional, age, and educational balance and excluding anyone who holds party office or works for an advocacy organization. Third, a hybrid — two-thirds drawn by lot, one-third recruited from applicants — on the reasoning that the applicants are the ones who will actually do the reading between sessions.

  One piece of internal evidence matters. A pilot council recruited by open sign-up last spring drew 214 volunteers, of whom 61 percent had already written to us about a story they loved or loathed. Its recommendations, arrived at unanimously, amounted to a request that we publish more of what we already publish.

  Please write the memo: a recommendation with the parameters filled in — size, term length, honorarium, treatment of decliners, whether members may publish dissents — and reasoning my four colleagues could actually argue with. It must answer the objection I expect from the deputy editor, which is that the case for sortition does not transfer to our situation at all: a lottery confers standing precisely because the chosen are nobody's agents, answerable to no constituency and unreachable by lobbyists, whereas our council would be advisory only, would be handed its questions by the very editors whose work it reviews, and could be overruled by silence. If that objection lands, say so. If it lands only partly, identify which of the arguments for selection by lot survive the move from a legislature to a magazine's advisory panel and which do not. Address separately whether excluding partisans and advocates is a legitimate protection or a form of epistemic gerrymandering, and whether the answer differs under the rule you recommend than under the ones you reject. Close with the strongest case for your losing option, stated in terms its proponents would recognize. No footnotes or citations — I will handle attribution — but please do not invent studies or survey findings to fill gaps.
reasoning: |-
  Okay, the user is part of a five-person group designing a readers' council for their science magazine. They need to write a memo recommending one of three proposals for recruitment: pure sortition, open call, or a hybrid. The memo has to address specific concerns, particularly the deputy editor's objection that sortition works for legislatures but not for an advisory council like theirs. 

  First, I need to understand the key issues. The deputy editor argues that in a legislative context, sortition gives legitimacy because the chosen aren't agents of anyone, but here the council is advisory, questions are set by editors, and they can be ignored. So, does sortition still have value here? Also, there's the question of excluding partisans and advocates—is that fair or does it bias the group?

  Looking at the proposals: Pure sortition is random, stratified to match demographics. Open call is volunteer-based with editors selecting for balance but excluding partisans. Hybrid is two-thirds random, one-third volunteers. The pilot using open call had 61% of volunteers being people who already wrote to the magazine, leading to recommendations that just asked for more of the same. That suggests self-selection bias in volunteers, which is a problem if they want diverse input.

  The user’s role is to write a memo that settles the recruitment rule. The memo needs to be persuasive, filled with parameters, and address the deputy editor's concerns. The user also wants the memo to include the strongest case for the losing option. They need reasoning that colleagues can debate, so the arguments have to be clear and robust.

  The deputy editor's point is valid in part. Sortition's main strength in a legislature is its democratic legitimacy and resistance to lobbying. But for an advisory council, those exact features might not apply. However, the council's purpose is to advise on contested topics. If the group isn't representative, their advice might not reflect the readership's diversity. The risk with volunteers is that they're more engaged, possibly more extreme or invested in certain views, as seen in the pilot where they just wanted more of the same. That doesn't help with contested issues where diverse perspectives are needed.

  On excluding partisans and advocates: This could be seen as epistemic gerrymandering because it might silence important voices. But in the open call proposal, excluding them might prevent bias. However, under sortition, even if a partisan is selected, they're one of many, so their influence is diluted. In the hybrid, the volunteer portion might still attract partisans unless excluded, but that's where the bias comes in.

  Hybrid seems like a compromise, but the risk is that volunteers dominate the discussion even if they're a minority. The pilot showed that volunteers tend to be super-engaged readers who might not represent the average. The third proposal's reasoning is that volunteers will do the reading between sessions, but is that necessary? The council meets quarterly, so members should be committed. Sortition with an honorarium could ensure participation, and decliners can be replaced.

  Parameters to decide: Size, term length, honorarium, decliners, dissents. For sortition, size around 15-20 to be manageable. Term length staggered to maintain continuity. Honorarium sufficient to incentivize participation. Decliners replaced from the same stratum. Allow dissents to capture minority views.

  The strongest case for the losing option (open call) is that it ensures engaged members who are likely to participate actively and do the homework. But the pilot showed that such volunteers might not provide critical feedback, just reinforce existing content.

  Addressing the deputy editor: Yes, the legislative sortition argument doesn't fully transfer. The immunity to lobbying isn't as crucial here since the council is advisory. But sortition still ensures representativeness, which is vital for the magazine to understand its diverse readership on contested issues. That representativeness survives the shift to an advisory role.

  Excluding partisans: In sortition, it's unnecessary because the random selection dilutes individual biases. In open call, exclusion might be needed to prevent overrepresentation, but it risks gerrymandering. So under sortition, no exclusion is better.

  Final recommendation: Pure sortition with specific parameters. Hybrid is a close second but risks volunteer bias. Open call has proven ineffective in the pilot.
answer: |-
  ## Memo: Recommendation on Readers' Council Recruitment Rule  
  **To:** Editorial Working Group  
  **From:** [Your Name], Science & Ideas Writer  
  **Date:** [Date before Thursday vote]  
  **Subject:** Proposed Recruitment Rule for Standing Readers' Council  

  ### Recommendation: Pure Sortition (Stratified Random Draw)
  *   **Size:** 18 members (manageable diversity, sufficient for breakout discussions).  
  *   **Term Length:** 18 months, staggered (6 members rotate every 6 months for continuity).  
  *   **Honorarium:** $400 per quarterly meeting + pre-reading materials stipend ($50/session).  
  *   **Treatment of Decliners:** Immediate replacement by next random draw within the same stratum.  
  *   **Dissents:** Members may publish brief, anonymized dissenting viewpoints appended to Council summaries.  

  ### Reasoning: Why Pure Sortition?
  The core purpose of this Council is to surface *unanticipated* perspectives reflecting the *actual diversity* of our readership on deeply contested topics. Representativeness is paramount, not prior engagement. The pilot using open sign-up demonstrated the inherent flaw of self-selection: 61% of volunteers were highly engaged readers whose feedback essentially requested *more of the same*. While valuable, this group cannot challenge our blind spots. Pure sortition, stratified to match key census demographics (age, region, education), is the only method guaranteeing this essential diversity.  

  **Addressing the Deputy Editor's Objection:**  
  Your central critique – that sortition’s core strength (creating a "mini-public" immune to lobbying/constituency pressure) doesn't translate to our advisory context – **lands significantly, but not fatally.** You are correct that the Council lacks sovereign power, receives editor-defined questions, and can be overruled. Therefore, arguments about *legitimacy derived from political authority* or *absolute immunity to influence* **do not survive** the move from legislature to magazine panel.  

  However, **two critical arguments for sortition DO survive:**  
  1.  **Epistemic Diversity:** Random selection, properly stratified, is uniquely capable of assembling a group whose life experiences, knowledge bases, and tacit understandings genuinely mirror our broader readership. This diversity is the raw material for identifying coverage gaps and unintended biases *we cannot see ourselves*. An elected or self-selected group inherently filters for specific traits (e.g., strong opinions, high free time, desire for platform), distorting this mirror.  
  2.  **Mitigation of Advocacy Capture:** While lobbyists won't target this Council, advocacy perspectives *are* important. Sortition ensures they enter the room proportionally, diluted by the presence of non-aligned voices. Deliberative design (facilitated discussion, evidence review) allows these views to be weighed alongside others, not amplified by selective volunteering. Editors selecting volunteers inevitably apply subjective filters, risking inadvertent bias.  

  **On Excluding Partisans & Advocates:**  
  Excluding those holding party office or working for advocacy organizations is **epistemic gerrymandering under an open call or hybrid model**, but **largely unnecessary under pure sortition.**  

  *   **Under Open Call/Hybrid:** Exclusion attempts to prevent overrepresentation of "agenda-driven" voices. However, it relies on editor judgment, creates arbitrary boundaries (e.g., is a university climate lab researcher an "advocate"?), and risks silencing valid, expert-informed perspectives from within communities most affected by our coverage (e.g., vaccination policy). This *is* gerrymandering – artificially shaping the input to avoid discomfort.  
  *   **Under Pure Sortition:** Exclusion is counterproductive. A truly random, stratified sample will naturally include *some* individuals connected to parties or advocacy, roughly proportional to their presence in the readership. Crucially, they will be one voice among many diverse others. The deliberative process, focused on our specific questions and supported by balanced briefing materials, is designed to integrate, not amplify, their perspectives. Their presence *enhances* representativeness. Screening would undermine the method's core strength.  

  **The Strongest Case for the Losing Option (Open Call):**  
  Proponents of the open call model argue compellingly that it prioritizes *commitment and readiness*. Volunteers, by definition, are signaling high engagement and willingness to invest time. They are more likely to thoroughly digest complex pre-reading, participate energetically in discussions, and sustain involvement over their term. This model leverages the existing passion within our readership, ensuring the Council is composed of members who deeply care about the magazine and arrive prepared to contribute meaningfully from day one. It avoids the risk, perceived under sortition, of recruiting disengaged members who participate passively or minimally, draining the Council's vitality and practical utility for the editorial team.  

  **Conclusion:**  
  While the open call ensures engaged volunteers, it replicates the pilot's bias toward our existing vocal readership, failing the Council's primary mandate to broaden our perspective. The hybrid model risks internal imbalance, with the engaged volunteer third potentially dominating the randomly selected two-thirds. Pure sortition, despite lacking the *political* legitimacy of a citizens' assembly, is uniquely suited to deliver the *epistemic* diversity we require: a council that acts as a faithful, surprising, and challenging mirror to our *whole* readership. It is the only method offering genuine protection against the echo chamber effect demonstrated by the pilot. I urge the group to adopt the pure sortition model with the parameters outlined. Let's settle this Thursday.
