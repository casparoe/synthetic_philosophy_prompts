  Each position's core commitment: A must surrender that some macro-patterns have no micro-equivalent; B must accept that some valid explanations can't be translated without loss; C must concede their methodological framing doesn't dissolve the ontological tension. The real disagreement is about what counts as "explanation" - pattern recognition (A) versus mechanism specification (B).

