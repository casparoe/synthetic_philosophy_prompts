     - **Path: Record disputant → Same standards → Community unified → Origin matters**: Assigned to Consensual Truth-Telling, but could imply external imposition. *Diagnosis*: Incoherent (if origin matters, external imposition is rejected).  
     - **Path: Neutral record → No loss → [End]**: Leads to Record Revisionism, but some may still resist correction. *Diagnosis*: Unattractive (defies logic of neutral evidence).  

  3. **Cases Routing to Same Verdict by Different Paths**:  
     - **Case 1 (founding story)**: Can route to Institutional Justification (if non-assertive with loss), Record Revisionism (if neutral record), or Consensual Truth-Telling (if loss).  
     - **Case 5 (war memorial)**: Routes to Consensual Truth-Telling via loss (Node 5) or Record Revisionism if no loss.  
     - **Cases doing independent work**: Case 2 tests record neutrality, Case 3 tests warrant standards, Case 4 tests community division—each triggers unique branches.  

  4. **Case Straining the Tree**:  
     - **Case 6 (survivor’s account)**: Strains Node 4 (standards of warrant). Oral tradition and camp records may be deemed incomparable, but the survivor’s authority challenges "calibrated skepticism." Resolved by routing to Memory Revisionism or Consensual Truth-Telling.  

  ### Confidence in the Tree  
  - **Overall Confidence**: Medium-High.  
    - **Strengths**: Node ordering reflects logical dependencies (e.g., nature of memory before correction methods). Attributions align with real-world debates.  
    - **Weaknesses**: Some positions (e.g., Institutional Justification) are simplified; tree may force binary choices.  
  - **Least Confident Element**: **Node 4 (standards of warrant)**.  
