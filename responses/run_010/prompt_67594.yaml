  ### Decision Tree: Community Memory and Documentary Record  
  This diagnostic tree uses seven concrete cases to sort students into positions based on their decisions. Nodes are ordered by logical presupposition: earlier questions address foundational issues (e.g., the nature of memory) before procedural or ethical ones (e.g., correction methods). At each node, students answer by referencing **one of the seven cases** that best illustrates their reasoning. The tree has 7 nodes and 9 leaves, capturing the core positions.  

  ---

  #### **Node 1: Is the memory making a claim about what occurred, or is it serving a non-assertive function (e.g., group constitution, membership, or present orientation)?**  
  *Why this first?* Determines if there is even a conflict to resolve. If memory is non-assertive, the record’s accuracy is irrelevant.  
  - **Non-assertive function (e.g., Case 7 or Case 1)**: Proceed to Node 2.  
  - **Factual claim (e.g., Case 2, 3, 4, 5, or 6)**: Proceed to Node 3.  

  #### **Node 2: If the memory is non-assertive, does its institutional or social value justify preserving it after factual inaccuracy is known?**  
  *Why here?* Builds on Node 1: if memory isn’t asserting truth, we assess if its utility outweighs inaccuracy.  
  - **Yes, preserve it (e.g., Case 7)**: **Leaf: Institutional Justification**.  
  - **No, correct it (e.g., Case 1)**: **Leaf: Functional Separation**.  

  #### **Node 3: Is the documentary record a neutral third party, or is it the work product of a disputant (making silences meaningful)?**  
  *Why after Node 1?* Only relevant if memory makes a claim. Neutrality affects whether the record can "refute" memory.  
  - **Work product of disputant (e.g., Case 2 or 6)**: Proceed to Node 4.  
  - **Neutral third party (e.g., Case 1, 4, or 5)**: Proceed to Node 5.  

  #### **Node 4: Are memory and record answerable to the same standards of warrant?**  
  *Why after Node 3?* If the record is compromised, we ask if it can fairly judge memory.  
  - **Different standards (e.g., Case 3 or 6)**: **Leaf: Oral Tradition as Calibrated Testimony**.  
  - **Same standards (e.g., Case 2)**: Proceed to Node 6.  

  #### **Node 5: If the record is neutral, does correcting memory destroy something irreplaceable (beyond truth)?**  
  *Why after Node 3?* Neutral records create stronger pressure to correct, but we must weigh moral costs.  
  - **Yes, significant loss (e.g., Case 5)**: **Leaf: Consensual Truth-Telling**.  
  - **No, loss is tolerable (e.g., Case 1 or 4)**: Proceed to Node 7.  

  #### **Node 6: Is the remembering community unified or divided?**  
  *Why here?* After establishing conflict (Nodes 1, 3) and standards (Node 4), unity affects feasibility of correction.  
  - **Unified (e.g., Case 3)**: Proceed to Node 7.  
  - **Divided (e.g., Case 4)**: **Leaf: Pluralistic Display**.  

  #### **Node 7: Does the origin of correction (internal/external) matter morally or practically?**  
  *Why last?* Final step when correction is needed: consent and agency matter if truth risks harm.  
  - **Yes, origin matters (e.g., Case 5 or 6)**: **Leaf: Consensual Truth-Telling**.  
  - **No, origin irrelevant (e.g., Case 1 or 3)**: **Leaf: Record Revisionism**.  

  ---

  ### Leaves (Positions)  
  Each leaf includes:  
  - **Verdicts for all 7 cases** (summarized; Y = memory upheld, N = record upheld, / = no adjudication).  
  - **Least palatable commitment**: One-sentence ethical or practical burden.  
  - **Confidence mark**: High/Medium/Low confidence in position’s real-world defensibility.  

  1. **Record Revisionism**  
     - *Verdicts*: Revise memory in all cases where it makes a claim (N for Cases 1-6; Case 7 is non-assertive, so not applicable).  
     - *Least palatable*: Overruling lived experience or tradition for archival "objectivity," even when painful.  
     - *Confidence*: High (e.g., historical positivism).  

  2. **Memory Revisionism**  
     - *Verdicts*: Uphold memory over record in cases of biased archives (Y for Cases 2, 6; N for neutral-record cases 1,4,5; Case 3: Y; Case 7: non-assertive).  
     - *Least palatable*: Dismissing all documentary evidence as inherently corrupt.  
     - *Confidence*: Medium (e.g., standpoint epistemology; defensible but rarely absolute).  

  3. **Non-Assertive Memory**  
     - *Verdicts*: No conflict; memory serves non-factual roles in Cases 1, 7 (Y). Other cases involve claims, so verdicts vary by tree path.  
     - *Least palatable*: Allowing communities to propagate falsehoods if socially useful.  
     - *Confidence*: High (e.g., communitarian or functionalist views).  

  4. **Functional Separation**  
     - *Verdicts*: Memory and history are independent; no reconciliation needed ( / for all cases).  
     - *Least palatable*: Permitting public falsehoods to persist indefinitely.  
     - *Confidence*: Medium (e.g., postmodern "regimes of truth"; contested but defended).  

  5. **Oral Tradition as Calibrated Testimony**  
     - *Verdicts*: Weigh oral accounts carefully; memory wins unless empirically disproven (Y for Cases 2, 3, 6; N for Cases 1,4,5; Case 7: non-assertive).  
     - *Least palatable*: Granting oral history near-irrefutable authority.  
     - *Confidence*: High (e.g., ethnographic methods; widely applied).  

  6. **Institutional Justification**  
     - *Verdicts*: Preserve memory if it builds community, regardless of accuracy (Y for Cases 1, 7; N for others if not institutionally vital).  
     - *Least palatable*: Prioritizing social cohesion over truth in all cases.  
     - *Confidence*: Medium (e.g., conservative pragmatism; defended but controversial).  

  7. **Consensual Truth-Telling**  
     - *Verdicts*: Correct memory, but only with community consent and pacing (Y until correction is consented; e.g., Case 5: slow revision; Case 6: survivor’s account deferred).  
     - *Least palatable*: Allowing communities to indefinitely delay acknowledging harm.  
     - *Confidence*: High (e.g., restorative justice frameworks).  

  8. **Pluralistic Display**  
     - *Verdicts*: Present both versions without adjudication in divided communities ( / for Case 4; others as per tree path).  
     - *Least palatable*: Legitimizing contradictory truths in public memory.  
     - *Confidence*: High (e.g., pluralist memorialization).  

  9. **Default Revisionism** (added for paths not covered)  
     - *Verdicts*: Revise memory unless loss is severe (N for most cases; Y only if Node 5 loss is "yes").  
     - *Least palatable*: Imposing external "truth" without community input.  
     - *Confidence*: Low (not a named position; catch-all).  

  ---

  ### Closing Analysis  
  1. **Indistinguishable Leaves**:  
     - **Functional Separation vs. Non-Assertive Memory**: Both treat Case 7 similarly (non-assertive), but differ in whether correction is needed. The tree separates them at Node 2 (loss assessment).  
     - **Consensual Truth-Telling vs. Pluralistic Display**: Node 6 (community unity) distinguishes them.  

  2. **Unoccupied Answer-Combinations**:  
