prompt: |-
  I retired early from a career in experimental geophysics, most of it spent arguing with colleagues about whether a given instrument reading meant anything, and I have filled the retirement with philosophy: a Wednesday reading group, a good deal of Collingwood, whose contempt for the historian who merely cuts and pastes his authorities together I find bracing and, at the desk, quite useless. Let me describe the desk, since my request depends on it. Our county historical society publishes a quarterly journal of local history, and two years ago the board co-opted me as its lay member on the reasoning that it wanted someone accustomed to weighing evidence and unmoved by a good story. We receive twenty-five to thirty submissions a year, nearly all from amateur local historians of real diligence and no methodological training. I allow myself perhaps ninety minutes per submission; I have no palaeography, no Latin, and no archive within twenty miles; every decision goes out over my signature with a reason the author can read in two sentences; and the board's one professionally trained historian, who tolerates me with great politeness, maintains that source criticism is a craft that cannot be written down. I do not believe him, and I should like your help in showing that he is wrong.

  Here is what I currently do, and why I have come to distrust it. I treat each source as an instrument and estimate three quantities for it: its calibration, by which I mean how close in time and place to the events described it was produced; its systematic bias, meaning the author's interests, loyalties, expectations and the conventions of the genre in which he writes; and its noise, meaning memory failure, garbled figures, scribal corruption in transmission. I then ask whether the errors of two such instruments are independent, and if they are I treat their agreement as compounding my confidence, much as repeated measurements do. I now think the analogy is worse than I supposed, and I want you to say precisely where it fails rather than reassure me. Two witnesses may share an ancestor, in which case their agreement carries no information whatsoever, and independence turns out to be a matter of genealogy rather than of statistics. Reliability may not be a property of a source at all but of a source relative to a particular claim, since our village diarist is authoritative on the weather of March 1911 and worthless on why the rector resigned. And the whole frame may misdescribe what happens when I read a self-serving memoir, which is not a miscalibrated instrument but evidence of something else entirely, namely of what its author needed to believe. I have the same suspicion in the other direction about my own instincts: I keep wanting to rank physical and scientific evidence — tree rings, isotope ratios, the fabric of a building, a coin in a dated pit — above testimony, when a single document written a century after the fact may carry less weight than an account carefully handed down within the community it describes. As I recall him, Thucydides said in effect that he made his speakers say what the occasion demanded and warned his readers against taking the first story they were offered, and Herodotus keeps marking a distinction between what he saw, what he was told, and what he makes of it; if I have either of them wrong, correct me in a clause and do not build anything on my having got it right.

  Write to me, then, as a philosopher of history who has also sat through a great many editorial meetings: think the matter through privately, beginning not with the textbook categories but with what a careful reader actually does in the hour before deciding that a claim is usable, and give me only the finished article. What I want is a decision procedure in the plain sense — the questions to ask of a submission, in order, with what counts as a sufficient answer to each; the points at which the procedure stops with a reject or a revise-and-resubmit; and, marked explicitly, the points at which it hands the matter back to a human being because the question is one of judgment or of what the journal is for rather than of evidence, since I need to know when I am merely dressing up my own taste as method. Fold in the tests I have picked up, mostly from the study of the gospels, and tell me where each is abused in practice: multiple attestation and the common-ancestor trap that hollows it out; the criterion of embarrassment, which I have watched amateur writers invert into a rule that anything unflattering to its subject must be true; the standing difference between establishing what a document says and establishing that what it says happened; the peculiar problem of a source transmitting an earlier source I cannot see; and what to make of well-transmitted oral tradition reaching back three or four generations, which I suspect I currently underrate. Then run the procedure on three submissions now on my desk. The first is a memoir of a colliery explosion here in 1926, dictated in 1971 to his grandson by a man who was twenty-one at the time, in which his own conduct is uniformly courageous and the mine manager's negligence is described in technically specific and, so far as I can judge, accurate detail; the society holds nothing else on the disaster beyond two newspaper paragraphs, and the author's widow is a founding subscriber to this journal. The second reconstructs an enclosure riot of 1847 from two newspaper accounts published within four days of it in the same market town, one of them in a paper owned by the family whose hedges were torn up; the author treats their agreement on the sequence of events as decisive corroboration and builds the entire paper upon it. The third is a short note on a seventeenth-century parish schoolmaster resting wholly on an antiquarian's notebook compiled in the 1890s, which quotes a document now lost and not otherwise known without saying where it was kept, the compiler being a man of enormous industry and, in our trained historian's estimate, of variable care in transcription. Tell me which of the three verdicts I shall dislike and why the procedure is nonetheless right, and finish by being candid about what the procedure cannot do — the classes of submission on which it will generate confident nonsense, and what I should do when I suspect I am looking at one. Please give me all of this as continuous prose, in the manner of a letter to a colleague: no headings, no numbered or bulleted lists, no bold or italic emphasis, and no tables; where sequence matters, put it in sentences, first this, then that, and if the answer to the third question is so-and-so, stop. And give me no bibliography, no reading list and no citations of any kind; where a particular text matters, describe in your own words what it says and does not quote it, since I have no means of checking quotations and would far rather have your honest paraphrase than your recollection of a wording.
reasoning: |-
  Okay, let me approach this query methodically. The user presents a complex challenge: a retired geophysicist turned philosophy enthusiast seeks a practical decision procedure for evaluating historical submissions, grounded in epistemological rigor rather than textbook formulas. 

  First, I need to unpack the core concerns: the user distrusts his current instrumental analogy for sources (calibration/bias/noise), recognizing three key flaws: 1) witness interdependence masquerading as statistical independence, 2) source reliability being claim-specific rather than absolute, and 3) testimony being fundamentally different from physical measurement. His examples (Thucydides/Herodotus references) suggest he's wrestling with how historians actually weigh evidence versus idealized models.

  The requested output must adhere to strict parameters: continuous prose without academic formatting, prioritizing actionable questions over theory. It should address his listed pain points (common-ancestor trap, inverted embarrassment criterion, etc.) while demonstrating applicability through three case studies. Crucially, it must demarcate where judgment supersedes mechanical application.

  For the decision procedure itself, I consider structuring it around four phases: 
  1) Source autopsy (provenance, purpose, preservation) 
  2) Claim validation (separating what's said from what happened) 
  3) Contextual stress-testing (against physical evidence, logic, competing accounts) 
  4) Editorial triage (identifying irreparable flaws vs. salvageable weaknesses)

  The three submissions pose distinct challenges: 
  - The 1971 memoir risks "heroification" but offers rare technical details 
  - The 1847 riot reconstruction mistakes correlated accounts for corroboration 
  - The schoolmaster note suffers from document ghosting via an unreliable antiquarian

  Each case will test different failure modes of the user's old method. The toughest verdict will likely be rejecting the memoir despite its emotional appeal and unique content, precisely because the procedure exposes uncorrectable bias in its central claims.

  Throughout, I'll emphasize epistemic humility - noting where physical evidence superiority isn't automatic (e.g., coins in pits vs. oral tradition), and flagging submissions prone to nonsense outputs: those relying on single irreplicable sources or requiring specialist knowledge beyond the user's scope. The conclusion must stress that the procedure's value lies in making biases explicit, not eliminating them.
answer: |-
  My dear colleague,

  Your distrust of the instrumental analogy is entirely well-founded, and your instinct to seek a procedure grounded in the practical act of critical reading rather than textbook categories is sound. The flaw lies deeper than the specific points you raised – though those are significant – and resides in treating sources as passive measurement devices. A source isn't a seismometer recording vibrations; it's an *act* of communication, shaped by purpose, perspective, and the very act of its creation and transmission. The physicist measures phenomena; the historian interprets intentions. What follows is a procedure distilled from that act of interpretation, designed for your ninety-minute window and the constraints you face. Think of it as the questions a careful reader asks themselves, made explicit and sequential.

  **The Procedure:**

  Begin by asking: **What precisely is the author claiming happened?** Pinpoint the specific event, action, or state of affairs central to the submission. Is it the cause of the colliery explosion, the sequence of the riot, the existence and role of the schoolmaster? A vague claim is unusable; demand specificity. If the claim remains nebulous after reading, stop. Verdict: **Revise and Resubmit** – "The central claim requires precise definition."

  Second: **What are the sources directly supporting this specific claim?** List them explicitly. For each source, conduct a rapid autopsy:

  1.  **Provenance:** When, where, and by whom was *this source* produced? (Not the event, *the source*). Is it contemporary? Eyewitness? Second-hand? Official? Private? Propagandistic? (This addresses your "calibration" but frames it as origin and context, not a numerical value).
  2.  **Purpose:** Why was *this source* created? To record? To persuade? To justify? To entertain? To attack? To defend? (This subsumes your "systematic bias" but emphasizes the source's *active* intent).
  3.  **Path:** How did *this source* reach us? Is it an original document? A copy? A transcript? A quotation within another work? What opportunities existed for alteration, accidental (your "noise") or deliberate, along the way? (This focuses on transmission integrity).

  If a source crucial to the claim lacks credible answers to provenance, purpose, or path – especially if it’s a "ghost document" quoted second-hand without verifiable origin – the claim likely fails. Verdict: **Reject** or **Revise and Resubmit** (if salvageable by finding better evidence) – "Insufficient basis for claim X; source Y is inadequately substantiated/transmitted."

  Third: **For each source, what does it *actually say* about the specific claim?** Read the relevant passage meticulously. Does the source state the claim directly, imply it, or is the claim inferred by the author? Distinguish rigorously between *what the source reports* and *what the author infers from it*. This is the bedrock: establishing what the document says. If the source doesn't actually support the claim as stated by the submission's author, stop. Verdict: **Reject** or **Revise and Resubmit** – "Source Y does not support claim X as presented."

  Fourth: **Is there corroboration for the specific claim?** This is where multiple attestation comes in, *but critically*. Ask:

  1.  **Independence:** Are the sources genuinely independent? Do they derive from different perspectives, different purposes, different chains of transmission? Or do they likely share a common origin (like two newspapers relying on the same constable's report or the same rumour mill)? Agreement from non-independent sources is *meaningless* for confirmation; it merely confirms the *circulation* of a story, not its truth. (This catches the "common ancestor trap").
  2.  **Convergence:** Do the sources agree on the *core fact* despite likely differences in perspective or purpose? This is stronger than mere agreement. Does the colliery owner's report, however grudgingly, concede the manager's action the memoir condemns? Does the rival paper in the market town acknowledge the basic sequence of the riot reported by the landlord's paper? Convergence despite potential bias is powerful.
  3.  **Contradiction:** Are there sources that *directly contradict* this specific claim? How credible are *they* based on their provenance, purpose, and path?

  If a crucial claim relies *solely* on a single source, or on non-independent sources, proceed with extreme caution. It may be usable, but its fragility must be acknowledged. *This is a point of judgment:* Can the claim stand as a plausible hypothesis based on this single, well-understood source? Or is it too central and contested? **Hand back to human judgment:** "Claim X relies on uncorroborated/non-independent source Y. Judgment required on its plausibility and centrality." You cannot *prove* it true; you can only assess if it's *reasonably asserted* given the source's nature and context.

  Fifth: **Does the claim inherently *fit*?** Apply internal and external stress tests:

  1.  **Internal Coherence:** Does the claim make sense within the source itself? Does it contradict other statements in the *same* source? Does it align with the source's stated purpose in a way that might induce fabrication (e.g., self-justification in the memoir)? Apply the "criterion of embarrassment" *cautiously*: Does the source report something damaging to *its own* cause or perspective? If so, it *might* be more credible – *but only if it passes other tests*. **Crucially:** The *inverse* is false (your amateur's fallacy). Something unflattering isn't automatically true; it could be slander, satire, or a trope. Embarrassment is a *potential* indicator, never proof.
  2.  **External Plausibility:** Does the claim conflict with well-established physical evidence (your tree rings, coins)? *But beware your instinct!* A well-transmitted oral tradition *can* accurately preserve core events over generations, especially concerning communal identity or trauma. Don't automatically rank a stray coin higher than a coherent, culturally embedded narrative *if* that narrative passes source criticism. Conversely, does the claim fit the broader historical context (social norms, technological limits, known events)? Does the memoir's technically accurate detail *about the mine* lend weight to its account of events *in* the mine, even if the author's role is suspect? Does the claimed riot align with the known tensions of the 1840s?
  3.  **Logical Plausibility:** Does the claim defy basic logic or human behaviour as commonly understood? Is the sequence of events physically possible?

  Significant failure on fit (e.g., the memoir claiming the author single-handedly rescued dozens in a timeframe physically impossible, the riot account describing weapons unavailable locally) warrants rejection. Less severe failure warrants heavy revision or caveats. **Hand back to human judgment** on nuanced cases of contextual fit or when weighing physical evidence vs. testimony: "Claim X is physically implausible/contradicts established context Y. Judgment required on whether reinterpretation is possible or rejection is necessary."

  Sixth: **What does the submission *do* with the claim?** Is it the central pillar of a grand theory? Is it a minor supporting detail? Is it presented cautiously as a possibility or assertively as fact? The more ambitious the structure built upon the claim, and the more assertively it's presented, the stronger the evidential foundation must be. A shaky claim presented modestly as a suggestion might be publishable; the same claim presented as the key to understanding an era is not. **Hand back to human judgment:** "Claim X is central to the thesis but evidentially weak Y. Judgment required on whether the thesis can be revised/salvaged."

  **Applying the Tests & Your Cases:**

  *   **Multiple Attestation:** Abused when interdependence isn't probed (like the two newspapers likely sharing a source). Value lies in *independent convergence*.
  *   **Criterion of Embarrassment:** Abused by assuming unflattering = true. Value lies when a source *against its own interest* admits something damaging, *and* it fits plausibly.
  *   **Establishing Text vs. Event:** The autopsy (Steps 1-3) establishes what the text *is* and *says*. Steps 4-5 assess if what it says *happened*.
  *   **Ghost Sources (earlier source unseen):** Treat with maximum suspicion (Step 2). Unless the quoting source (like the antiquarian) has proven, exceptional reliability *for accurate transcription*, the ghost source is effectively unusable for establishing fact. It can only illustrate the *antiquarian's* knowledge/beliefs.
  *   **Oral Tradition:** Don't underrate it *if* well-attested within the community over generations, concerning events central to that community's identity, *and* it passes the "fit" tests (coherence, external plausibility, logic). It's a distinct source type with its own transmission "path" (generational retelling). Judge its plausibility like any other source, respecting its cultural context.

  **Your Three Submissions:**

  1.  **Colliery Memoir (1971, dictating 1926 events):**
      *   **Claim:** Specific negligent actions by manager causing explosion; author's heroism.
      *   **Source Autopsy:** Provenance: 45 years later, by participant (eyewitness? - likely, but memory decay). Purpose: Clearly self-justifying/nostalgic ("uniformly courageous"). Path: Dictated to grandson (potential for familial embellishment?); technically specific details *suggest* some core memory accuracy re: mine operations.
      *   **What Source Says:** It says the manager did X negligently and author did Y heroically.
      *   **Corroboration:** None for manager's negligence/author's heroism. Newspaper paragraphs likely too brief. Non-independent (author's widow subscribes, but that's irrelevant to source independence).
      *   **Fit:** Technical details plausible (lends *some* credence to his presence/knowledge). Self-praise inherently suspect. Manager's actions *might* fit negligence patterns, but no corroboration.
      *   **Submission Use:** Builds narrative solely on this.
      *   **Verdict (You'll dislike this): Reject** the claims about causation and heroism as presented. *Why Procedure is Right:* It relies entirely on a single, highly biased, late source for its core claims. The technical detail *might* support publishing *only those verified details* about the mine itself, *stripped* of the narrative of blame/heroism, presented cautiously as "the memoir recalls...". But as a narrative of the disaster's cause and the author's role, it's uncorroborated testimony from an interested party. The widow's subscription is irrelevant to evidence.

  2.  **Enclosure Riot (Two 1847 newspapers):**
      *   **Claim:** Specific sequence of events during the riot.
      *   **Source Autopsy:** Provenance: Immediate (within 4 days), local. Paper 1: Owned by affected family (bias likely). Paper 2: Rival? (Needs checking - if rival, better; if same ownership circle, worse). Purpose: Reporting news? But Paper 1 has clear stake in portraying events negatively towards rioters. Path: Likely broadsides or early newsprint; potential for rapid printing errors, but generally reliable transmission for basic events.
      *   **What Sources Say:** They agree on sequence X, Y, Z.
      *   **Corroboration:** Agreement, BUT: **Critical Failure Point:** Are they *independent*? In a small 1847 market town, both papers likely relied on the same handful of constables, magistrates, or prominent witnesses. Their agreement is *meaningless* as corroboration if they share a common source (e.g., the magistrate's official report). This is the "common ancestor trap" hollowing out multiple attestation.
      *   **Fit:** Sequence plausible for a riot? Probably. But Paper 1's bias demands scrutiny - does it *overstate* the sequence to vilify rioters?
      *   **Submission Use:** Treats agreement as decisive, builds whole paper on it.
      *   **Verdict: Revise and Resubmit.** "The decisive reliance on the agreement between the two newspaper accounts is misplaced without establishing their independence. The paper must either: (a) demonstrate the accounts are independent (e.g., show they cite different witnesses, have clear editorial antagonism), or (b) significantly weaken the claims based on this agreement, acknowledging the possibility of a single originating narrative, and explore other angles (e.g., the *rhetoric* used by each paper in reporting the shared sequence)."

  3.  **Parish Schoolmaster (1890s notebook quoting lost 17th C doc):**
      *   **Claim:** Existence and role of a specific schoolmaster.
      *   **Source Autopsy:** Provenance: 1890s antiquarian, quoting an unknown, lost 17th-century document of unknown provenance. Purpose: Antiquarian recording (presumed). Path: Ghost source! Quoted without origin. Compiler's reliability: "Variable care in transcription" (our historian's judgment - crucial).
      *   **What Source Says:** The notebook *says* the antiquarian saw a document stating X about the schoolmaster.
      *   **Corroboration:** None. Sole source is the ghost document, mediated by a compiler of variable reliability.
      *   **Fit:** Plausible that a parish had a schoolmaster? Yes. Specifics of role? Unverifiable.
      *   **Submission Use:** Wholly rests on this.
      *   **Verdict: Reject.** "The claim rests entirely on an undocumented 17th-century source quoted in a 19th-century notebook whose compiler is known to be variable in accuracy. Without any means to verify the existence, provenance, or content of the original document, or to assess the accuracy of this specific transcription, the claim is insufficiently substantiated." The antiquarian's industry doesn't overcome this; variable care is fatal for an uncorroborated ghost source.

  **What the Procedure Cannot Do:**

  1.  **Resolve Genuine Evidential Deadlocks:** When credible, independent sources directly contradict on a core point and all other tests are equivocal, the procedure flags the problem but cannot solve it. Judgment is paramount, often leading to presenting the conflict openly or rejecting the claim as unproven.
  2.  **Handle "Black Swans" Perfectly:** Highly unusual events, while inherently less plausible, *do* happen. The procedure leans on "fit" and plausibility, which could misjudge a genuine anomaly. Maintain epistemic humility.
  3.  **Replace Specialized Knowledge:** It flags transmission problems (ghost sources, variable transcription) but cannot *correct* a corrupted text without palaeography. It notes potential bias but cannot fully reconstruct an 1847 newspaper's editorial stance without contextual knowledge. It identifies conflict with physical evidence but cannot reinterpret the stratigraphy of the coin pit. **This is the core limitation:** The procedure identifies *where* specialized skill is needed and whether the evidence *as presented* is sufficient *without* it. When such skill is needed and absent (like your lack of Latin/palaeography), the verdict must often be rejection or referral.
  4.  **Define "Plausibility" or "Significance":** These are inherently contextual and judgment-based. The procedure forces you to articulate *why* something seems implausible or significant, making the judgment call more transparent, but it doesn't eliminate the call itself.
  5.  **Generate Certainty from Scant Evidence:** It will often yield "Insufficient Evidence" verdicts. This is a feature, not a bug. Confidence nonsense arises when the procedure is *ignored* or *short-circuited*, particularly by:
      *   Assuming independence without checking.
      *   Treating a source's existence as proof of its content's truth (especially ghost sources).
      *   Mistaking what a source *says* for what the author *infers*.
      *   Applying criteria like embarrassment mechanically.
      *   Prioritizing physical evidence reflexively over coherent testimony.
      *   Building large interpretations on single, fragile sources.

  **When You Suspect Confident Nonsense:**

  When you feel unease despite the sources seeming superficially okay, check:

  1.  **Ghost Sources:** Is there an unseen "original" lurking?
  2.  **Pseudo-Corroboration:** Are multiple sources really just echoes?
  3.  **Inverted Burden:** Is the submission assuming a claim is true unless disproven, rather than requiring proof?
  4.  **Misplaced Precision:** Does technical detail in *one* area (like the mine mechanics) create an illusion of accuracy in *another* (like causation/heroism)?
  5.  **Ignored Context:** Does the claim *actually* clash badly with the broader picture when you think about it?
  6.  **The "So What?" Factor:** Is immense effort spent proving something trivial or irrelevant to the journal's scope? (Another judgment call).

  If suspicion persists, especially if it involves gaps requiring specialist knowledge you lack, **Reject** or **Revise and Resubmit** with very specific queries. It is far better to reject ten possibly true but unprovable claims than to publish one confidently presented nonsense. Your role is gatekeeper, not solver of historical mysteries.

  This procedure doesn't eliminate judgment; it structures and exposes it. It replaces calibration/bias/noise with provenance/purpose/path and layers on tests of corroboration, coherence, and fit. It forces you to separate what the source *is*, what it *says*, and what *happened*. It turns statistical independence into a hard question about genealogy and motive. It makes you articulate *why* you distrust the memoir or the newspapers or the ghost source, beyond instinct. It won't make the widow happy, or the author building on newspaper echoes, but it will make the journal's foundations firmer. And that, after all, was the board's reasoning for drafting you.

  Yours in the bracing, often frustrating, pursuit of usable truth,
