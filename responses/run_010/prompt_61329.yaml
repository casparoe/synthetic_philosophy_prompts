  **OFFERING MEMORANDUM**  
  **£1,250,000,000**  
  **LYCURGUS SCHOLASTIC EARNINGS SECURITISATION PLC**  
  **CLASS A, B, AND C NOTES BACKED BY INCOME-CONTINGENT GRADUATE REPAYMENTS**  

  **1.  Cover Summary**  
  Lycurgus Scholastic Earnings Securitisation PLC (the "Issuer"), a special-purpose vehicle incorporated in England and Wales, hereby offers secured notes (the "Notes") backed by a portfolio of rights to future income-contingent repayments (the "Repayment Rights") derived from graduates domiciled in the United Kingdom. The Repayment Rights represent contractual obligations to repay tuition financing advanced under the statutory student loan scheme, contingent upon the borrower exceeding specified earnings thresholds. The Notes are structured in three Classes (A, B, and C), differentiated by the field of study associated with the underlying Repayment Rights. The Sponsor, Aethelred Human Capital Management LLP (the "Sponsor"), acting upon the long-standing research of the Centre for Human Capital Studies (the "Centre"), advises that the Repayment Rights constitute a novel asset class reflecting the rational investment decision inherent in tertiary education acquisition.

  **2.  Use of Proceeds**  
  The net proceeds from the issuance of the Notes will be used by the Issuer to acquire the Repayment Rights from the Sponsor. The Sponsor acquired these Repayment Rights via assignment from the statutory Student Loans Corporation ("SLC") through a competitive auction process. Any remaining proceeds will be applied to transaction costs, initial servicing fees, and reserve fund establishment.

  **3.  Capital Structure**  
  The Notes are issued in the following tranches, defined by the subject classification of the underlying degree programme associated with each Repayment Right:

  *   **Class A Notes (Senior Tranche - £750,000,000):** Secured solely by Repayment Rights derived from graduates holding degrees in **Economics, Medicine (General Practice & Surgery), and Actuarial Science**. This tranche benefits from the highest priority in the cash flow waterfall. Selection criteria focus on historically low dispersion in graduate earnings distributions within these fields, implying greater predictability of repayment velocity.
  *   **Class B Notes (Mezzanine Tranche - £350,000,000):** Secured solely by Repayment Rights derived from graduates holding degrees in **Engineering (all streams), Computer Science, and Law**. This tranche receives payments after Class A obligations are met.
  *   **Class C Notes (Subordinated Tranche - £150,000,000):** Secured solely by Repayment Rights derived from graduates holding degrees in **all other fields, including but not limited to Arts, Humanities, Social Sciences (excluding Economics), Biological Sciences (excluding Medicine), Education, and Performing Arts**. This tranche bears the first loss position, receiving payments only after Class A and B obligations are fully satisfied. The selection reflects the Sponsor's assessment, guided by the Centre's analysis, of higher historical earnings dispersion and potentially extended repayment horizons within these fields.

  **4.  Risk Factors**  
  Prospective investors should consider carefully the following risks, among others:

  1.  **Labour Market Correlation:** Repayment cash flows are intrinsically correlated with the macroeconomic performance of the UK labour market. Unlike traditional debt, repayments are contingent on individual graduate earnings exceeding thresholds. A general economic downturn suppressing wages will simultaneously impact a significant proportion of the underlying cohort, reducing aggregate cash flows across all tranches simultaneously, limiting diversification benefits.
  2.  **Earnings Volatility & Dispersion:** The future earnings trajectories of graduates, particularly those in fields underlying the Class C Notes, exhibit high historical dispersion. Factors influencing individual earnings (e.g., career choice within field, industry disruption, personal circumstance) are non-diversifiable at the security level and may lead to cash flows materially below modelled expectations, especially for the subordinated tranche.
  3.  **Pricing Model Uncertainty:** The valuation of Repayment Rights relies heavily on complex actuarial models projecting graduate earnings, repayment rates, and loan persistence over decades. These models incorporate significant assumptions regarding future economic conditions, wage growth, and graduate behaviour, all subject to inherent uncertainty and potential model error.
  4.  **Behavioural Risk:** Graduates may alter their economic behaviour in ways detrimental to repayment. This includes: (i) **Emigration:** Relocating permanently to jurisdictions where earnings are not subject to UK repayment collection mechanisms; (ii) **Career Selection:** Pursuing careers with earnings persistently below repayment thresholds (e.g., care work, creative arts, charitable sectors), despite potential qualification for higher earnings; (iii) **Jurisdictional Arbitrage:** Remaining within the UK but residing in devolved administrations or territories where differing tuition fee regimes or repayment obligations might apply or be introduced.
  5.  **Policy & Legislative Risk:** The existence, structure, and enforceability of the Repayment Rights are wholly dependent on current statutory frameworks governing student finance. Future governments may materially alter key parameters (e.g., repayment thresholds, interest rates, write-off periods) or the fundamental nature of the system (e.g., shifting towards grant-based funding or significantly reduced fees). The existence of alternative higher education funding models in other developed jurisdictions (e.g., Germany, Nordic states) demonstrates the political contingency of the current system and its associated repayment streams.
  6.  **Collection Mechanism Risk:** The efficiency and cost-effectiveness of the SLC's repayment collection mechanism, primarily via the PAYE system and self-assessment, impact net cash flows. Changes in HMRC reporting, collection enforcement challenges (especially for self-employed graduates or overseas earners), or administrative failures could increase servicing costs or reduce recoveries.
  7.  **Moral Hazard & Adverse Selection:** The Sponsor, while applying rigorous selection criteria based on historical field data, cannot perfectly assess the future earnings potential or behavioural propensity of individual graduates within each field cohort. There is an inherent risk that the portfolio may contain a disproportionate number of individuals with lower-than-cohort-average earning potential or higher propensity for repayment-avoidant behaviours.
  8.  **Long-Term Demographic & Economic Shifts:** The performance horizon extends over 30+ years. Unforeseen structural shifts, such as technological unemployment affecting specific professions, long-term stagnation in graduate wage premiums, or significant demographic changes impacting the labour supply, could fundamentally alter repayment profiles.
  9.  **Taxpayer Reliance Risk:** The ultimate sustainability of the student loan book and, by extension, the Repayment Rights underpinning the Notes, may be influenced by government fiscal policy. Significant shortfalls in aggregate repayments against the cost of providing loans could lead to policy interventions or implicit acceptance of losses borne by HM Treasury, potentially altering the perceived or actual credit support for the structure. The ultimate source of funds making investors whole in certain severe scenarios may prove to be general taxation rather than graduate repayments.
  10. **Tranching Methodology Risk:** The tranching by field of study is based on historical data and the Centre's analysis of earnings distribution characteristics. Future labour market dynamics may alter the relative risk profiles of different fields, rendering the initial tranching hierarchy less effective at differentiating risk or potentially exposing senior tranches to unforeseen sector-specific downturns.

  **5.  Regulatory Note**  
  This Offering Memorandum has been prepared for circulation solely to persons who are (i) "investment professionals" as defined in Article 19 of the Financial Services and Markets Act 2000 (Financial Promotion) Order 2005 (the "Order"), (ii) "high net worth entities" falling within Article 49 of the Order, or (iii) persons to whom it may otherwise lawfully be communicated under the Order. The Notes have not been, and will not be, registered under the securities laws of any jurisdiction outside the United Kingdom. Investment in the Notes involves significant risk, including the potential loss of the entire investment. Potential investors should consult their own financial and legal advisors regarding the suitability of this investment. The Issuer is a bankruptcy-remote entity whose sole business is the acquisition of the Repayment Rights and issuance of the Notes.
