  4. Belief-update requirement (move belief/detect falsehood).  
  5. Solution concept (optimal play credible?).  
  6. Comparison class (standalone/part of broader scheme).  
  7. Failure mode (priors dominate/equilibrium mismatch).  

  **Unoccupied cells** (4 combinations):  
  1. **Non-decomposable + stronger asymmetry + debate best available**  
     - *Status*: Coherent and attractive (not incoherent).  
     - *Why empty*: Rarely defended; proponents of debate’s comparative value (e.g., vs. single expert) focus on gen-verif gaps.  
     - *Care analysis*: While stronger asymmetry suggests debate fails, it could still be the *best* if alternatives (e.g., direct judging) fail worse. This cell is empty due to neglect, not incoherence.  

  2. **Decomposable + bounded depth + must detect falsehoods + optimal play not credible**  
