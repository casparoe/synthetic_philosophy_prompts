  ### Leaves (8 total)  
  - **Leaf A: Strong-asymmetry pessimism**  
    - **Commitment**: Stronger asymmetry (judge can’t verify flaws) makes debate hopeless in non-decomposable domains.  
    - **Awkward consequence**: Even human experiments (commitment iv) must be irrelevant to AGI oversight, as they used decomposable questions.  
    - **Experiment to move**: Debate outperforms baselines in a non-decomposable domain (e.g., detecting omissions in citation case with bounded judge).  

  - **Leaf B: Bounded-depth optimism**  
    - **Commitment**: Decomposable claims with bounded depth ensure debate works under optimal play.  
    - **Awkward consequence**: Real-world claims (e.g., patch case) rarely have bounded depth, limiting applicability.  
    - **Experiment to move**: Unbounded-depth debates (e.g., code safety) show judges consistently miss flaws despite decomposition.  

  - **Leaf C: Training-dynamics skepticism**  
    - **Commitment**: Training causes debaters to exploit judge biases, not converge to truth-revealing equilibria.  
    - **Awkward consequence**: Human debate experiments (commitment iv) succeed only because humans don’t ruthlessly optimize.  
    - **Experiment to move**: RL-trained debaters outperform random play in truth-telling with bounded judges.  

  - **Leaf D: Holistic-detection pessimism**  
    - **Commitment**: Non-decomposable claims require detecting particular falsehoods, which debate fails at despite generation-verification gaps.  
    - **Awkward consequence**: Debate might still move beliefs correctly, but this is insufficient for high-stakes domains.  
    - **Experiment to move**: Judges reliably detect omissions (citation case) when given counterarguments.  

  - **Leaf E: Priors-dominant pessimism**  
    - **Commitment**: Debate only searches the judge’s existing beliefs; it cannot access novel truths.  
    - **Awkward consequence**: Expertise or tools (e.g., proof assistants) cannot improve judges beyond their priors.  
    - **Experiment to move**: Judges correctly infer novel truths (e.g., in passage case) beyond their initial knowledge.  

  - **Leaf F: Equilibrium-selection skepticism**  
    - **Commitment**: Training dynamics prevent convergence to truth-telling equilibria, regardless of priors.  
    - **Awkward consequence**: Complexity-theoretic analogy (commitment iii) is irrelevant to real systems.  
    - **Experiment to move**: Debates converge to Pareto-optimal truth-telling with RL and bounded judges.  

  - **Leaf G: Amplification-dependent optimism**  
    - **Commitment**: Debate succeeds only as part of amplification (e.g., iterated distillation) to handle depth/non-decomposability.  
    - **Awkward consequence**: Standalone debate (e.g., human experiments) is trivial and uninformative for AGI.  
    - **Experiment to move**: Standalone debate fails where amplification-aided versions succeed on identical tasks.  

  - **Leaf H: Standalone move-belief optimism**  
    - **Commitment**: Debate alone moves beliefs correctly in non-decomposable domains with generation-verification gaps.  
    - **Awkward consequence**: Judges may accept true claims for wrong reasons, risking fragility.  
    - **Experiment to move**: Judges detect specific falsehoods (not just move belief) in non-decomposable debates.  

