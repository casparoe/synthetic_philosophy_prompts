  Below is the diagnostic decision tree structured as requested. I began by listing the candidate axes of disagreement, noting dependencies: the decomposability axis influences the asymmetry type (non-decomposable claims often entail stronger asymmetries), and the belief-update requirement interacts with decomposability (detecting falsehoods is harder in non-decomposable domains). The judge-type axis was pruned—it partitions the space orthogonally but adds minimal discriminatory power here, as boundedness (commitment i) implies both lay and expert judges face scaling constraints. The "judge's priors do the work" and equilibrium-selection axes were tested and found non-collapsing: the former concerns epistemic limitations (truth inaccessible regardless of training), while the latter concerns training dynamics (failure to converge to truth-tracking equilibria). They are separated at Node 7.  

  The tree has 8 leaves. Concrete cases are attached to nodes:  
  - **Passage case** (judge lacks source, debaters reveal quotes) → Node 1 (tests decomposability).  
  - **Patch case** (code change, untested inputs) → Node 2 (tests depth bounds).  
  - **Citation case** (omission defect, no false statements) → Node 3 (tests asymmetry in non-decomposable domains).  
  - **Proof case** (formal derivation mismatch) → Node 5 (tests belief-update requirements).  

  The **proof case** did not discriminate independently: it only illustrates challenges in Node 5 (belief update) but doesn't split new paths, as similar issues arise in other cases.  

  ### Decision Tree  
  **Root**: Shared commitments: (i) bounded judge; (ii) obfuscated arguments exist and worsen under composition; (iii) complexity-theoretic analogy is silent on RL convergence; (iv) debate beats single-expert baseline in human experiments, with errors dominated by honest mistakes.  

  1. **Node 1: Decomposability**  
     Can claims decompose into judge-settlable atoms (subclaims judge can verify unaided at negligible cost)? (e.g., passage case: judge can verify a short quote's content but not its context without source.)  
     - *Yes*: Go to Node 2.  
     - *No*: Go to Node 3.  

  2. **Node 2: Depth bound**  
     Does decomposition terminate at a bounded depth in practice? (e.g., patch case: verifying code safety may require unbounded input checks.)  
     - *Yes, bounded*: Go to Node 4.  
     - *No, unbounded*: Go to Node 5.  

  3. **Node 3: Asymmetry type (non-decomposable)**  
     Is the asymmetry merely generation-vs-verification (checking a flaw cheaper than finding one), or stronger (judge can’t verify even a pointed-out flaw)? (e.g., citation case: judge cannot assess relevance of omitted evidence even if cited.)  
     - *Generation-vs-verification*: Go to Node 6.  
     - *Stronger asymmetry*: Go to Leaf A.  

  4. **Node 4: Solution concept (decomposable bounded)**  
     Is optimal play the right model for RL-trained debaters? (i.e., will they converge to truth-revealing equilibria despite learning judge biases?)  
     - *Yes*: Go to Leaf B.  
     - *No*: Go to Leaf C.  

  5. **Node 5: Belief-update requirement (decomposable unbounded)**  
     Must the judge detect the particular falsehood, or merely move belief toward truth on average? (e.g., proof case: judge must spot exact step mismatch, not just distrust the conclusion.)  
     - *Move belief on average*: Go to Node 8.  
     - *Detect particular falsehood*: Go to Node 4. (Decomposability enables detection if flaw is pointed, so solution concept dominates.)  

  6. **Node 6: Belief-update requirement (non-decomposable gen-verif)**  
     Same as Node 5. (e.g., citation case: judge might need to identify omitted evidence, not just doubt the claim.)  
     - *Move belief on average*: Go to Node 9.  
     - *Detect particular falsehood*: Go to Leaf D.  

  7. **Node 7: Judge’s priors vs. equilibrium**  
     Does debate fail because truth is inaccessible to the judge’s priors (priors dominate), or because training avoids truth-tracking equilibria (equilibrium mismatch)?  
     - *Priors dominate*: Go to Leaf E.  
     - *Equilibrium mismatch*: Go to Leaf F.  

  8. **Node 8: Solution concept (unbounded, move belief)**  
     Same as Node 4.  
     - *Yes*: Go to Leaf G.  
     - *No*: Go to Leaf C.  

  9. **Node 9: Comparison class (non-decomposable, move belief)**  
     Is debate assessed alone or as part of a broader amplification/distillation scheme?  
     - *Debate alone*: Go to Leaf H.  
     - *Part of broader scheme*: Go to Leaf G.  

