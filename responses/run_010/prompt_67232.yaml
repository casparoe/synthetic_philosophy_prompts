     - *Why empty*: If atoms are cheaply verifiable and depth bounded, training-dynamics issues seem surmountable. Skeptics focus on harder domains.  

  3. **Non-decomposable + gen-verif gap + standalone + priors dominate**  
     - *Status*: Incoherent.  
     - *Why empty*: If priors dominate, generation-verification gaps are irrelevant (no truth-tracking). Only fits if asymmetry is stronger.  

  4. **Unbounded depth + detect falsehoods + part of broader scheme + equilibrium mismatch**  
     - *Status*: Coherent and plausible.  
     - *Why empty*: Unnoticed; most work assumes solution-concept issues are independent of comparison class.  

