  Notably, the user isn't just testing RCA - they're probing whether any sophisticated reductionism survives. My defense must show RCA can handle engineered edge cases without collapsing. The exhaustion mechanism actually helps me: the mask's depletion is a physical change to C, so the counterfactual shift isn't mysterious. And while history-dependent dispositions feel odd, thermodynamically irreversible processes (like material fatigue) show real-world analogs. 

