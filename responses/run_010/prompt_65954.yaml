  Right then—let's gut this ceramic bird! Your piece fails the counterfactual *before* exhaustion: when struck *with its current C* (including that crack-pinching phase), it doesn’t shatter. So pre-exhaustion, it’s **not brittle** on my analysis. Post-exhaustion, *C* changes (the phase is spent), and now when struck *with that new C*, it *would* shatter. So then it **is brittle**. I bite both bullets cheerfully:  

  First bullet: yes, surviving blows *makes* it brittle once the mask exhausts. But this isn’t paradoxical—it’s mechanical. The mask was always part of *C*, actively suppressing shattering. Exhausting it alters *C*, removing that suppression. History isn’t "evidence against fragility" here; it’s the process that physically disables the mask. Ordinary fragility ascriptions ignore masks, but RCA doesn’t—it *demands* we specify *C* precisely.  

  Second bullet: the "core" microstructure is unchanged, but *C* isn’t just the "core"—it’s the *total* intrinsic state, *including* the masking phase. When that phase depletes, *C* changes fundamentally. Brittleness supervenes on the whole intrinsic package. If you insist the "core" alone defines brittleness, you’re smuggling in a *non-reductive* dispositional primitive! RCA avoids that by tying the disposition strictly to the counterfactual truthmaker: *C-as-it-actually-is*.  

