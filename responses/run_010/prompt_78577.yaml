  Thorne will challenge Vance on what grounds we determine exchange rates between pleasure and pain. Vance will appeal to revealed preferences and hypothetical choices.

  Vance will ask about aggregation of sub-threshold pains. Thorne will distinguish between individual and collective thresholds.

  Thorne will force Vance to confront a scenario where both options have supra-threshold suffering. Vance will have to admit her system can still calculate net welfare.

