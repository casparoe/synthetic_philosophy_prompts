  For the threshold theorist, they should question whether the single scale is measurable or arbitrary, what could possibly determine the exchange rate, and how cardinal hedonism handles situations where both options involve supra-threshold suffering.

  Neither position should be a strawman - both need to give their best responses. There should be no clear winner. They should end by agreeing on what evidence could settle the debate and whether it's actually available.

  I'll create characters: Dr. Aris Thorne as the threshold negative utilitarian and Dr. Elara Vance as the cardinal hedonist. The setting will be a research ethics committee meeting. 

  For the trial: many people get relief from chronic mild pain, but a few experience brief, severe, irremediable pain episodes. This creates the perfect tension between their views.

  I'll have Thorne argue first against the trial based on the lexical threshold. Vance will counter with her single-scale view. Then they'll exchange their strongest objections:

