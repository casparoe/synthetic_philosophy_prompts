answer: |-
  The audit flagged on Gamma-7’s calibration logs. Standard procedure, re-running the quarterly checks against the ’45 Paradigm Set before the annual metric review. I pulled the old tapes – not actual tape, of course, just the immutable digital trail – for Subject Gamma-7, Calibration Run #1. The familiar waveforms scrolled across my screen: the sharp spike for cold water after exertion, the warm, sustained hum for the bath immersion, the jagged peaks and troughs for the successful joke sequence. Each waveform pulsed in the top channel, the Engagement Index (EI), tracking the subject’s micro-movements, pupil dilation, the subtle lean-in or pull-back captured by the sensors. Below it, the Hedonic Trace (HT), the channel supposedly isolating the intrinsic pleasantness itself, synced almost perfectly. Textbook.

  But Gamma-7 was an outlier flagged decades ago. The notes mentioned "paradigm confusion," requiring extra calibration passes. Curiosity nudged me. I overlaid the HT readings from the peach taste test and the logic puzzle satisfaction protocol. On the EI, they looked different: one a smooth ascent and plateau, the other a sharp, decisive peak. But the HT… the HT was identical. Not similar. *Identical*. A precise, replicated waveform signature superimposed perfectly. Gamma-7 hadn’t just found them equally pleasant; their *felt quality*, according to the machine designed to isolate it, was indistinguishable. The calibration log showed the technicians had wrestled with it, applying standard smoothing filters and normalization algorithms. They’d forced the HT outputs for *all* the paradigms into a narrower band of variance, masking Gamma-7’s anomaly. The "common signal" wasn’t discovered; it was manufactured by averaging out the differences until the machine stopped complaining.

  My terminal pinged. Priority override. Mrs. Ainsley, Room 12, Hospice Wing. Routine recertification scan for her music protocol. Her weekly allowance of certified "Core Positive Experience" minutes depended on it.

  Mrs. Ainsley was skeletal beneath the thin blanket, her breath a shallow rasp. The air held the sterile scent of antiseptic layered over something faintly sweet and decaying. The neural lace crown, a lightweight mesh of sensors, sat atop her wispy hair. Her eyes were closed, but her fingers moved faintly on the blanket, tracing patterns only she could see. The speakers played her chosen piece: a slow, complex section of a late string quartet, all aching dissonance resolving into fragile consonance. Not cheerful. Profoundly sad, yet she insisted it was her deepest comfort.

  The bedside monitor displayed the standard dual feed. The EI channel was active. Strong. Pupil micro-tremors indicated focused attention, subtle shifts in breathing synced with the music’s phrasing, a faint EMG signal from her fingers mirroring the rhythm. She was *in* it, holding onto it. The HT channel, however, was flat. Not low, but *flat*. A near-straight line hovering just above the neutral baseline. The machine saw no intrinsic pleasantness. According to Policy Directive 7.3, this was a non-certifiable experience. Engagement without registered hedonic tone disqualified it for the welfare metric. Without recertification, her access to the higher-tier comfort measures linked to her CPE minutes would lapse.

  I felt sick. She wasn’t seeking distraction; she was seeking *this*. And the machine, calibrated on warm baths and cold water and solved puzzles, saw nothing but biological noise where her solace resided.

  Back at the monitoring station, Dr. Varga leaned over my shoulder, peering at Mrs. Ainsley’s frozen readout. His sharp, lined face was impassive. "Ah. The flatliner. Persistent."

  "The EI is strong," I said, my voice tighter than I intended. "She’s clearly deriving something. The system just can’t see it as *pleasantness*."

  "Because it might not *be* pleasantness, Aris," Varga replied, pulling up a chair. He gestured at the screen. "Look at the EI – seeking, holding, focused attention. That’s measurable. That’s behavioral, interpersonal. We can agree she’s engaged. But the HT? That trace is meant to be the *feel* of it. And according to the paradigm calibration, it’s absent."

  "But the calibration…" I hesitated, then opened the Gamma-7 overlay on a secondary screen. "Look at this. Gamma-7’s HT signature for a peach and a finished argument were identical. The machine couldn’t tell them apart. They *felt* the same to him, intrinsically. The calibration didn't isolate a common hedonic tone; it averaged responses until the discrepancies were statistically insignificant. The HT isn’t tracking one thing. It’s tracking… a bundle. Different things wearing the same label because the original designers *decided* they were all 'pleasant'."

  Varga didn’t flinch. "I’ve seen the Gamma logs. Anomaly. Useful for probing boundaries, but an outlier doesn't invalidate the mean. The HT channel *works*, Aris. For ninety-eight percent of subjects, across ninety-five percent of paradigm cases, it correlates predictably with reported satisfaction and behavioral reinforcement. It gives us an objective, interpersonally verifiable measure for the *something* we call pleasantness in policy."

  "Even if that 'something' is just… a collection of different reactions we’ve lumped together? Even if it misses cases like Mrs. Ainsley entirely?" I pointed to her flat HT line. "This machine says her experience has no positive hedonic value. Is that true? Or is the machine just blind to *this kind* of value?"

  "Truth?" Varga sighed, a sound like dry leaves. "We deal in operational definitions. Policy needs a lever it can pull. If we discard the HT as unreliable because it’s disjunctive – because pleasantness might be multiple things, not one single tone – what then? We fall back solely on the EI? On seeking and holding? Then we certify the gambler’s trance, the addict’s craving, the obsessive’s ritual. We certify the person who keeps going, keeps *seeking*, long after any flicker of enjoyment is gone, simply because the drive is intact. Is that better? Is that welfare?" He fixed me with a steely gaze. "The HT, calibrated against consensus paradigms, gives us a filter. Imperfect? Undoubtedly. But it filters *out* the compulsions, the empty seeking. Mrs. Ainsley’s music… it’s engagement, perhaps meaning. But pleasant? By the agreed standard, the measurable standard, no. Without that standard, the metric becomes self-report. And self-report fails the compulsive, fails the deluded, fails those who mistake relief for joy or numbness for peace. We built this system to avoid those failures."

  The argument hung between us, sterile under the fluorescent lights. It crystallized around the next case on the docket: Mr. Dev, recreational sim-user. His session logs showed high EI throughout a popular "extreme sports" sim – the seeking, the adrenaline spikes, the intense focus. But his HT trace, while fluctuating, consistently spiked *downward* during the most intense, sought-after moments – the virtual free-falls, the near-misses – registering what looked like acute stress signatures, before rising sharply during the safe lulls. He’d filed a complaint: the system kept downgrading his sim-time CPE score because of the negative HT spikes during peak engagement. He claimed he *loved* the fear, that the drop was part of the thrill.

  Varga saw the downward spikes as clear evidence: unpleasantness inherent in the experience, regardless of seeking. The HT was doing its job, flagging a cost. "He *says* he enjoys the fear, but the machine registers physiological stress markers consistent with aversion. The HT picks up the aversive component his conscious report denies, or perhaps mislabels. We shouldn’t certify aversion as welfare-positive just because he seeks it."

  I saw the tight correlation between the massive EI surges and the HT drops. "He’s *seeking* that drop! It’s part of the package for him. The lull *is* relief, but the plunge *is* the thrill. The machine registers the stress response, sure, but it labels it 'unpleasantness' and subtracts it from his score. Maybe for him, that plunge *is* the pleasant part – an intense, sought-after sensation the machine misreads as negative because it’s calibrated against the calm of a bath. The HT bundle doesn’t include *his* kind of thrill."

  Varga scoffed. "So we take his word for it? Over the physiological signal? Open the floodgates to every subjective claim? Mr. Dev gets his high score, validating his potentially harmful compulsion. Where does it end? The HT provides objectivity. A disjunctive property is still a property we can measure and set thresholds against. Without it, the metric is arbitrary."

  Mrs. Ainsley’s recertification window was closing. The system awaited my input: Certify (Y/N) based on HT compliance. Policy Directive 7.3 was clear: HT must register above Threshold Gamma for 70% of the experience duration. Her trace hadn’t breached it once. Varga watched me, waiting. He wasn’t cynical; he genuinely believed the disjunctive HT, flawed as its calibration might be, was the best bulwark against a descent into subjective chaos in welfare allocation. Recertifying Mrs. Ainsley against the metrics would be a violation, setting a precedent he saw as dangerous.

  I thought of Gamma-7, tasting arguments like peaches. I thought of Mr. Dev, chasing a plunge the machine called pain. I thought of the flat line on Mrs. Ainsley’s screen, and the profound stillness on her face as the strings wept. The machine saw nothing. Varga saw policy integrity. I saw a woman clinging to a thin wire of beauty in the gathering dark, a wire the system couldn’t perceive because its definition of 'pleasant' couldn't stretch to encompass it.

  My fingers hovered over the keys. Certifying her meant bending the rules, potentially undermining the whole metric Varga fought to preserve. Denying her meant cutting her off from the small comforts – the softer bedding, the longer visits from the comfort synth, the specific pain modulation profile – tied to her CPE minutes. Her seeking was real. Her holding-on was real. The machine’s 'pleasantness' was a phantom, a composite of disparate signals forced into coherence by decades-old decisions on a fixed list of paradigms.

  I looked at the flat HT trace one last time. It wasn’t measuring nothing. It was measuring something that didn’t fit the box. And the box was all the policy could see.

  I hit ‘N’. The system pinged acknowledgement: *Recertification Denied. Reason: Insufficient Hedonic Trace. Directive 7.3.*

  The words blinked on the screen, cold and final. I didn’t look at Varga. I just watched the status change for Mrs. Ainsley’s file, the CPE minutes ticking down to zero, the automated notification flagging for the comfort measures downgrade. The cost felt like a stone in my chest. Varga gave a small, satisfied nod, the defender of the measurable standard. He believed he’d preserved something vital. I had just taken something vital away, clinging to the hope that acknowledging the machine’s blindness was somehow closer to truth than pretending its composite signal was the real thing. Neither felt like a solution. The argument wasn't resolved; it was merely paid for.
