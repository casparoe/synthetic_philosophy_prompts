  ### Context-Sensitivity and the Updating Puzzle
  - **(4) and (5) confirm the evidence selection process matters**: (4) (unreliable speaker) nullifies the update by setting the boost factor to 1 (or ignoring the message); (5) (fully informed speaker) amplifies it. The rule captures this via \(r / p_0\) (default boost) and contextual scaling (e.g., in (5), multiply by an extra factor \(c > 1\) if the speaker is known to be informative).  
  - **Puzzle for updating rules**: The core puzzle reduces to how to handle *when* the evidence is selected (e.g., why a conditional about North is offered). A rule sensitive only to \(r\) (like standard Jeffrey) is an approximation that ignores selection effects, failing (1) and (5). The proposed rule improves this by embedding selection via \(r / p_0\) (boost increases if the message "favors" \(A\) more than prior), but it’s still approximate—full context requires modeling the speaker’s knowledge and goals.  
  - **Beyond approximation**: A complete solution requires a signaling model (e.g., rational speaker choosing messages to inform). The rule \(P_{\text{temp}}(A) \propto P_{\text{old}}(A) \times (r / p_0)\) approximates such a model by assuming messages about \(A\) are more likely if \(A\) is true and \(r\) "fits" the state. For pragmatics-heavy cases (e.g., (5)), this approximation is refined with explicit context.
