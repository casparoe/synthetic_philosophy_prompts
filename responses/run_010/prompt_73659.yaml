prompt: |-
  hey, can you put on your political philosophy hat for this one — imagine you're a specialist in the nationalism vs. cosmopolitanism debate who's equally at home with the associative-duties literature and the global-justice literature, and who's willing to be blunt rather than diplomatic. I'm circulating my views to a reading group next week and I want a real consistency check first, not encouragement.

  Here's roughly my package, numbered so you can point at things:

  1. At the level of moral status I'm a cosmopolitan: borders and shared citizenship have no intrinsic moral weight, and every person's claims count the same in the fundamental account.
  2. But compatriots defintely do have special claims on me and on my state, and these aren't useful fictions. I specifically reject the story where we look after our own only because that's an efficient way of getting everyone looked after — I don't want the special duties to be a division of moral labor in disguise.
  3. What grounds them, for me, is the value of the relationship itself: a shared history of building and sustaining institutions together. Not consent, not benefits recieved, not reciprocity kept as a ledger.
  4. On distributive justice specifically I lean practice-dependent. What justice requires is fixed by the institutions that actually exist — the practice determines the content of the principles, it isn't that there's a ready-made egalitarian principle lying around waiting for some practice to trigger it. That's also why I'm sceptical of global egalitarianism: there's no practice of the right kind, so there's nothing determinate for it to demand at the global level.
  5. That said, I think a genuine world state — real taxation, real enforcement, real courts — would be governed by egalitarian principles with basically the same content as ours. Nothing exotic happens when the practice goes global.
  6. Case verdict: if my state has a limited supply of something rescue-ish, say vaccine doses whose research it funded with public money, it can permissibly prioritise its own residents even where the total harm falling on excluded foreigners is somewhat larger. But past a threshold of dire need, need trumps association — I won't let compatriots queue-jump over people who'd otherwise die.

  So: which of these actually pull against each other, and which only look like they do? Full disclosure, I've been walking around assuming the problem pair is 1 and 2, and I half expect someone in the room to say exactly that — but don't take my word for it, and tell me if I'm wrong about where the trouble is. Rank the genuine tensions by severity rather than listing everything as equally bad. For each one, say what has to go, what the cheapest repair looks like, and what the repair costs me elsewhere in the package. Then tell me which single revision would clean up the most damage overall.

  Think this through carefully, and before you write the audit spend a few lines brainstorming candidate pairs and arguing yourself in and out of each — I'd rather see the triage, including the ones you considered and dismissed, than a polished list that quietly skipped the hard cases. And please don't settle for "these are in tension, so be a pluralist about the grounds of duty." If your conclusion is that some pair is fine as it stands, defend it in enough detail that I could repeat the argument in the room and survive objections. No bibliography needed, I'll add my own references — just talk about the positions and the arguments.
reasoning: |-
  Okay, the user wants me to put on my political philosophy hat and critique their views on nationalism vs. cosmopolitanism. They've outlined six points about their position and want a real consistency check, not encouragement. They specifically want me to identify tensions between these points, rank the genuine tensions by severity, suggest solutions, and recommend the single most effective revision.

  Let me carefully examine each of their points:

  1. They're a moral cosmopolitan - believing borders have no intrinsic moral weight and everyone has equal moral status.

  2. But they also believe compatriots have special claims that aren't just useful fictions or divisions of moral labor.

  3. Their grounding for these special duties is the value of the relationship itself - shared history of building institutions together.

  4. They take a practice-dependent view of distributive justice, being skeptical of global egalitarianism because there's no global practice.

  5. However, they believe a genuine world state would require the same egalitarian principles as national states.

  6. In practical cases like vaccine distribution, they allow prioritizing compatriots unless the excluded foreigners face dire need.

  The user thinks the main tension is between points 1 and 2 - moral cosmopolitanism versus special duties to compatriots. But I need to dig deeper to see if that's actually where the biggest problem lies, or if there are other, more fundamental tensions.

  Looking at point 3 - grounding special duties in the relationship value itself rather than consent, benefits or reciprocity. This seems consistent with both 1 and 2. Point 4's practice-dependence might be more problematic when combined with other elements.

  Ah, here's a potential major tension: between point 1 (moral cosmopolitanism) and point 4 (practice-dependence). If borders have no intrinsic moral weight, why should justice principles be entirely determined by existing practices that are shaped by those very borders? This seems contradictory - practice-dependence effectively gives moral weight to borders by making them determine what justice requires.

  Another tension emerges between point 3 (relationship value) and point 4 (practice-dependence). If the relationship itself has intrinsic value, why tie justice so tightly to institutional practices? Couldn't relationships generate duties that transcend existing institutional frameworks?

  There's also a tension between points 4 and 5. Point 4 rejects global egalitarianism due to lack of practice, but point 5 says a world state would require the same egalitarian principles. This raises questions about why practice is so crucial if the principles would be identical regardless of scale.

  Point 6's vaccine case seems consistent with their overall framework, though it might be challenged from pure cosmopolitan or strong nationalist perspectives.

  After considering all these, I think the most severe tension is between moral cosmopolitanism (1) and practice-dependence (4). The practice-dependent view effectively privileges existing political arrangements that cosmopolitans should view as morally arbitrary. This undermines the fundamental cosmopolitan commitment.

  The next biggest tension is between relationship value (3) and practice-dependence (4). Valuing relationships might suggest duties that aren't limited by institutional participation.

  Then there's the tension between practice-dependence (4) and the world state scenario (5), which shows that practice-dependence might be more contingent than fundamental.

  The tension between moral cosmopolitanism (1) and special duties (2) is actually the least problematic, as many philosophers successfully combine these through various approaches.

  To address the core tension, I'd suggest modifying practice-dependence to make it more cosmopolitan-compatible - perhaps seeing practices as specifying rather than constituting justice. This would cost some of the anti-global-egalitarian thrust of point 4 but strengthen overall coherence.

  Alternatively, softening moral cosmopolitanism to allow some intrinsic weight to relationships would resolve multiple tensions but at greater cost to the fundamental cosmopolitan commitment.

  The most effective single revision would be reframing practice-dependence to accommodate cosmopolitan foundations while still explaining why global egalitarianism isn't currently feasible. This preserves most of their framework while resolving the deepest inconsistency.
answer: |-
  Here's your consistency audit, stripped of diplomacy. I'll walk through the triage step by step—candidate tensions, why I bit or backed off—then rank the genuine fractures by severity. Bottom line: **your core tension isn't 1 vs. 2; it's 1 vs. 4, with 3 vs. 4 as a close second.** The vaccine case (6) is surprisingly stable *if* you fix the deeper issues.

  ---

  ### **Brainstorming Candidate Tensions (The Triage)**
  1. **1 vs. 2 (Cosmopolitanism vs. Associative Duties):**  
     *Why it seems tense:* If everyone has equal moral status (1), how can duties to compatriots (2) be non-derivative? Doesn't "intrinsic relationship value" (3) smuggle in partiality?  
     *Why I dismiss it:* This is *your easiest defense*. Cosmopolitanism at the level of *ultimate* moral status (everyone matters equally) is compatible with special duties if those duties arise from *relational facts* (e.g., friendship, family). Your grounding (3)—shared institutional history—is a standard move in associative duties literature (e.g., Scheffler). **Verdict:** Not a tension. Defend this by stressing that equal *status* ≠ equal *duties*. Relationships generate non-instrumental obligations without denying fundamental equality.  

  2. **1 vs. 4 (Cosmopolitanism vs. Practice-Dependence):**  
     *Why it bites:* If borders lack intrinsic weight (1), why should *existing institutions* (bounded states) determine distributive principles? Practice-dependence (4) effectively privileges contingent political boundaries, making justice hostage to power. This contradicts the anti-arbitrariness spirit of 1.  
     *Why it’s severe:* Your skepticism of global egalitarianism rests on "no practice" (4), but why is *that practice* (the state) morally relevant if borders don't matter (1)? You’re using the *fact* of state institutions to ground their *normativity*, which 1 undermines. **Verdict:** **Major tension**.  

  3. **3 vs. 4 (Relationship Value vs. Practice-Dependence):**  
     *Why it bites:* If relationships matter intrinsically (3), why tie justice *only* to formal institutions (4)? Shared history could generate duties beyond the state’s institutional structure (e.g., diaspora claims, historical wrongs). Practice-dependence reduces "shared history" to *current institutional participation*, ignoring thicker relational bonds.  
     *Why it’s serious:* Your grounding (3) is about *people*, but practice-dependence (4) focuses on *institutions*. If the relationship is valuable, why can't it demand duties *outside* existing practices? **Verdict:** **Major tension**.  

  4. **4 vs. 5 (Practice-Dependence vs. World State Egalitarianism):**  
     *Why it bites:* If principles are practice-dependent (4), why would a world state (5) generate *the same* egalitarian principles as states? Different scales/scopes *should* alter practices (e.g., heterogeneity, coordination problems). Claiming identical principles implies they’re *not* truly practice-dependent—they’re latent universal norms.  
     *Why it’s moderate:* You can argue that *any* coercive basic structure triggers egalitarian demands, per Rawls. But this strains practice-dependence: if principles are *always* lurking, waiting for a practice to "activate" them, practice isn’t *determining* content—it’s enabling application. **Verdict:** **Moderate tension**.  

  5. **2 vs. 4 (Associative Duties vs. Practice-Dependence):**  
     *Why I dismiss it:* Associative duties (2) and practice-dependent justice (4) can coexist if institutions are the *vehicle* for relational duties. But see 3 vs. 4 above.  

  6. **4 vs. 6 (Practice-Dependence vs. Vaccine Priorization):**  
     *Why I dismiss it:* Vaccine case (6) fits practice-dependence: your state’s institutions funded/resourced the vaccine, triggering special claims. The "dire need" threshold is a standard deontic constraint (e.g., no letting others starve). No tension.  

  ---

  ### **Ranked Genuine Tensions (Severity Order)**
  1. **1 vs. 4 (Cosmopolitanism vs. Practice-Dependence)**  
     **Conflict:** Practice-dependence (4) grants moral significance to state boundaries by making them define justice, contradicting cosmopolitanism’s rejection of intrinsic border weight (1).  
     **Cheapest Repair:** Soften 4. Argue practices *specify* universal principles (e.g., basic needs) but don’t *create* them. Global justice demands minimal thresholds; states add egalitarian layers.  
     **Cost:** You lose the clean "no global egalitarianism" conclusion. Global duties become positive (e.g., poverty relief) not distributive equality.  
     **Alternative Repair:** Abandon 1. Admit borders *do* have intrinsic moral weight (e.g., via relational autonomy). But this guts your cosmopolitan core.  

  2. **3 vs. 4 (Relationship Value vs. Practice-Dependence)**  
     **Conflict:** Valuing relationships intrinsically (3) suggests duties *not* constrained by institutional practice (e.g., obligations to non-citizen co-participants in history). Practice-dependence (4) reduces relationships to institutional roles.  
     **Cheapest Repair:** Decouple 3 and 4. Ground associative duties *in* relationships (3), but limit *distributive justice* (4) to institutional contexts. Relationships demand *sufficiency* for all; institutions demand *equality* for members.  
     **Cost:** Less elegant. Opens door to global sufficiency claims based on shared humanity (weak relationship).  
     **Alternative Repair:** Expand "practice" to include non-state relationships (e.g., colonial history). Cost: Makes global egalitarianism harder to reject.  

  3. **4 vs. 5 (Practice-Dependence vs. World State Principles)**  
     **Conflict:** If a world state produces identical principles (5), practices aren’t *determining* content—they’re revealing pre-political norms.  
     **Cheapest Repair:** Reframe 5: A world state *could* adopt egalitarianism, but not identically—e.g., it might prioritize basic goods over strict equality.  
     **Cost:** Weakens your reply to global egalitarians.  
     **Alternative Repair:** Drop 5’s "same content" claim. Say the practice *would* determine principles, but we can’t predict them.  

  ---

  ### **The Single Best Revision**
  **Revise 4 (Practice-Dependence) to a hybrid view:**  
  - **Repair:** Practices *institutionalize* fundamental moral demands (e.g., from 1 and 3), but don’t invent them. Global justice requires fulfilling basic needs (cosmopolitan floor); states add egalitarian obligations *because* they’re sites of relational value (3).  
  - **Why it works:**  
    - Resolves 1 vs. 4: Borders lack intrinsic weight, but states gain normative traction via relationships (3), not mere existence.  
    - Resolves 3 vs. 4: Relationships ground duties; practices operationalize them.  
    - Saves 6: Vaccine priority justified by relational history *and* institutional investment; dire need threshold reflects basic needs floor.  
  - **Cost:** Concedes ground to global minimalism (e.g., Pogge). You can’t dismiss global distributive claims as "indeterminate"—they’re determinate but *minimal*.  

  ---

  ### **How to Present This in the Room**
  If challenged on 1 vs. 2: *"Equal moral status doesn’t mean identical duties. Relationships generate special obligations—that’s why you save your child from a burning building first. Shared institutional history is that kind of relationship."*  

  If hit on 1 vs. 4 (the killer): *"Practice-dependence must be subordinate to cosmopolitan foundations. Institutions don’t create justice; they give specific form to universal demands. Without that, we’re moralizing the status quo."*  

  **Your strongest card is 6:** It’s a coherent application *if* you fix the foundations. Use it to illustrate how relational duties (3) and minimal global claims (revised 4) interact.  

  Go brutalize that reading group. They’ll respect the rigor.
