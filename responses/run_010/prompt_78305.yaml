prompt: |-
  I am a staff software engineer at a mid-size infrastructure company, and for the past two years I have run an optional weekly hour called "deep dives," in which one of us explains a single idea to about a dozen other engineers. Nobody in the room has studied philosophy or logic; my own background is distributed systems. Next week it is my turn, and the topic I have chosen is the Church–Turing thesis — but specifically its epistemic status, because that is the part I find genuinely confusing and that I suspect nobody in the room has ever considered.

  What I want the session to accomplish: an engineer who currently treats "Turing complete" as a checkbox on a language feature sheet should leave able to say what kind of claim the thesis is — a theorem, a stipulative definition, a conjecture about the physical world, or some combination — and able to say what would count as evidence against it.

  Please do not explain the thesis to me. I have read enough summaries; what I lack is a plan for explaining it. I would like you to design the forty-five minutes.

  1. The dependency structure. Give me the order the components must be introduced, and justify each placement by naming what has to already be in place for the next piece to mean anything. I should warn you that the obvious opening — draw the tape, the head, the transition table — is exactly how I bombed the last time I attempted this at a meetup. Tell me what, if anything, has to come before the machine, and whether the machine should carry much weight at all in a session whose point is the status of the thesis rather than its content. I would also like the room to arrive at the informal notion of a mechanical procedure on their own, before they see any formal model, so that the identification feels like a discovery rather than an announcement; tell me how to arrange that without turning the session into an exercise.

  2. One carrying example. Not three illustrations — one scenario I return to repeatedly that does most of the work. Tell me what properties it must have and what it must conspicuously lack. My instinct is that the halting problem is the wrong carrier here, since it is a result about limits and my session is not about limits, but I cannot articulate the reason and I may be wrong.

  3. The misconception map. This is what I most need. For each predictable confusion, give me the sentence a person in the room will actually say, and the point in my sequence where it has to be headed off — including the cases where the right move is to defuse it before it can form rather than to answer it afterward. The ones I already expect: "isn't it proved, given that every model of computation anyone has come up with can be simulated by a Turing machine?"; "so it's just a guess, then?" (someone said precisely this to me last time and I had no answer); "quantum computers break it"; "what about the argument that human mathematicians can't be Turing machines?"; and "LLMs are Turing machines, so they can't really do X." Tell me which of these I should let the room raise, which I should raise myself on purpose, and which is a trap that will eat the final twenty minutes if I engage it honestly at 4:30.

  4. Whether to split the thesis. I have read that people distinguish a mathematical version — an identification of an informal notion, roughly "effective calculability," with a formal one — from a stronger physical version about what the world itself permits. I do not know whether that distinction is standard, or whether I am about to state it incorrectly, and I would rather you correct me than let me bluff. If it belongs in the session, tell me where and in what plain words; if it does not, tell me what to do instead when the quantum computing and real-valued analog computer questions arrive. Relatedly, tell me where the term "effective calculability" should first appear, and whether I should use it at all in front of an audience that has never seen it.

  5. A closing check. One question I can put to the room, or one sentence I can ask each person to write down, that would tell me within a minute whether the status question landed or whether they have merely picked up trivia about 1930s logic.

  6. What to leave out. I cannot cover everything. Name the two or three substantial pieces of this topic that a well-prepared person would be tempted to include and that I should deliberately omit, and give me the exact sentence to say out loud acknowledging each omission without appearing ignorant of the material. Finally, tell me how to handle a question that goes past what I know; I will get at least one from a colleague who reads logic for fun, and I want a graceful move that does not involve faking an answer.

  Constraints: whiteboard only, no slides, twelve people, forty-five minutes, and no live coding. Please do not recommend readings, papers, or a bibliography of any kind — I will not prepare from that, and neither would the room. What I want is a plan detailed enough that I could hand it to another engineer and they could run the same session.
reasoning: |-
  We are designing a 45-minute session for engineers on the epistemic status of the Church-Turing thesis. The goal is for participants to understand what kind of claim the thesis is and what would count as evidence against it.

  Key points to cover:
  - The Church-Turing thesis (CTT) is not a theorem but a hypothesis about the equivalence between an informal concept (effective calculability) and a formal one (Turing machine computability).
  - It is not a stipulative definition because it is making a claim about the world (at least in the physical version) and because the informal notion predates the formal one.
  - It is not a conjecture about the physical world in the same way as a scientific hypothesis because it is not directly testable by experiment (but physical systems might be seen as evidence for or against).

  Structure:

  1. **Start with the informal notion of a "mechanical procedure"** (without formal models). We want the room to arrive at this notion on their own.

  2. **Introduce the formal model (Turing machine) as an attempt to capture that notion.**

  3. **State the CTT as the identification of the two.**

  4. **Discuss the status: why it's not a theorem, not a definition, and not a straightforward empirical claim.**

  5. **Address what would count as evidence against it.**

  6. **Handle common misconceptions.**

  Dependency Structure (with timing):

  0. **Introduction (2 min)**: Briefly state the goal: We are going to explore what kind of claim the Church-Turing thesis is. Note that we are not going to prove anything but to think about its status.

  1. **Eliciting the informal notion (10 min)**:
     - Ask the group: "What does it mean for a problem to be solvable by a mechanical procedure? What are the characteristics of such a procedure?"
     - Guide the discussion to include: 
          - Finite set of instructions (algorithm)
          - Requires no ingenuity (mechanical, automatic)
          - Can be carried out by a human with paper and pencil (or by a machine)
          - Deterministic (or at least, if we allow randomness, we can simulate it deterministically? But keep it simple: focus on deterministic for now)
     - Write the key properties on the board. Call this concept "effective calculability" (introduce the term here) or "mechanical computability". 
     - *Justification*: We must have a shared informal notion before we can talk about the thesis.

  2. **Introduce the Turing machine (5 min)**:
     - Briefly sketch a Turing machine: tape, head, state, transition rules. Emphasize that it is a formal model. 
     - State that it is one of several formal models proposed (lambda calculus, recursive functions, etc.) but we focus on Turing machines because they are well-known.
     - *Justification*: We need a formal model to contrast with the informal notion.

  3. **State the Church-Turing thesis (3 min)**:
     - Write: "The Church-Turing thesis: A function is effectively calculable if and only if it is computable by a Turing machine."
     - Explain that this is a claim that the formal model captures the informal notion.

  4. **Why is this not a theorem? (10 min)**:
     - Ask: "Can we prove this thesis? If so, how?"
     - Point out: The thesis connects an informal concept (which is not mathematically defined) to a formal one. We cannot prove an equivalence between a formal concept and an informal one in the mathematical sense.
     - The obvious evidence: Every attempt to formalize the informal notion (lambda calculus, recursive functions, etc.) has turned out to be equivalent to Turing machines. But that doesn't prove that there isn't some other formalization that is more powerful and still fits the informal notion.
     - *Carrying example*: Use the example of a human following a set of rules (a recipe) to compute something. We can simulate that on a Turing machine? Yes, but what if we found a new kind of computer (say, a quantum computer) that can compute more? But wait, we haven't defined what we mean by "compute" in the informal sense. This leads to the next point.

  5. **What would count as evidence against the thesis? (10 min)**:
     - Two kinds of counterexamples:
          a) A function that we would accept as being effectively calculable (by the informal criteria) but that cannot be computed by a Turing machine.
          b) A function that is computable by a Turing machine but that we would not accept as effectively calculable (this is less likely because Turing machines are designed to be mechanical).
     - Focus on (a): What if we found a physical device that could compute a function that is not Turing computable? Would that be a counterexample?
     - But note: The thesis is about what is computable by a mechanical procedure, not necessarily what is computable by a physical device. However, if we believe that the physical device is following a mechanical procedure, then it would be a counterexample. But what if the device uses some non-algorithmic process (like an oracle)? Then we wouldn't consider it mechanical.

     - *Carrying example*: Use the same example of a human following rules. Suppose we have a physical system that we believe is carrying out a mechanical procedure (so it fits the informal notion) but that we can prove computes a non-Turing-computable function. That would be evidence against the thesis.

  6. **Addressing misconceptions (5 min)**:
     - Preemptively address:
          - "Isn't it proved because all models are equivalent?" -> No, because that only shows that the formal models are equivalent. It doesn't prove that there isn't a model that is both effective (by our informal criteria) and more powerful.
          - "So it's just a guess?" -> It's a hypothesis that has so far been supported by all evidence. It is not arbitrary; it is based on the analysis of what it means to compute and the equivalence of formal models. But it is not a mathematical certainty.
          - Quantum computers: They are believed to compute only Turing computable functions (though faster). If they could compute non-Turing-computable functions, that would be evidence against the thesis (but note: current quantum computers are not known to do that).
          - Analog computers: They are often idealized and might not fit the informal notion (because they require infinite precision). We can discuss that if raised, but note that the thesis is about discrete, finite procedures.

     - Handle the human mind and LLMs: Briefly note that the thesis is about what is computable by any mechanical procedure, not about what humans or machines can do in practice (due to resource constraints). So it doesn't say that humans are Turing machines, but that any mechanical procedure they follow can be simulated by a Turing machine.

  7. **Closing check (5 min)**:
     - Ask each person to write down one sentence: "What kind of claim is the Church-Turing thesis, and what would be evidence against it?" 
     - Then ask a few to share. Listen for:
          - It's a hypothesis that links an informal concept to a formal one.
          - Evidence against: an example of a mechanical procedure (that we accept as such) that cannot be simulated by a Turing machine.

  8. **What to leave out**:
     - The details of the halting problem and other uncomputable functions. We are not focusing on the limits of computation but on the status of the thesis.
     - The historical development (Church, Turing, etc.) unless it comes up.
     - The physical version of the thesis (we are focusing on the mathematical/logical version). But if asked, we can say: "There is a stronger version that says that any physical system can be simulated by a Turing machine. That is a separate claim and more controversial. Our session is about the original thesis which is about effective calculability."

     - Exact sentences for omissions:
          - "We are not going into the halting problem today because that is about the limits of computation, and our focus is on the nature of the thesis itself."
          - "We are skipping the historical details of how Turing and Church arrived at their models to keep the session focused."
          - "We are not discussing the physical Church-Turing thesis in depth because that is a separate claim and we are focusing on the mathematical version."

     - Handling questions beyond knowledge: 
          - "That's a great question and I don't know the answer off the top of my head. Let me note it down and I'll get back to you next week with what I find."

  Carrying Example:

  We will use the example of a human following a set of instructions (like a recipe) to compute a function. For instance, adding two numbers by following the rules of addition. 

  Properties it must have:
     - It is clearly mechanical (no ingenuity required).
     - It is step-by-step.
     - It is deterministic.

  What it lacks:
     - We have not yet formalized it (so we can later show that we can formalize it with a Turing machine).

  We can use this example throughout:
     - In the beginning: to elicit the informal notion.
     - When introducing the Turing machine: show how the addition algorithm can be implemented on a TM.
     - When discussing evidence against: what if we found a mechanical procedure for a function that a TM cannot compute? (e.g., if we had a physical device that solved the halting problem by some mechanical means, that would be a counterexample).

  Misconception Map:

  1. "Isn't it proved, given that every model of computation anyone has come up with can be simulated by a Turing machine?"
     - Where to address: In step 4 (Why is it not a theorem?).
     - Response: "That is strong evidence, but note that we are comparing formal models. The thesis is about an informal concept. It could be that there is a model we haven't thought of that is both effective (by our intuitive criteria) and more powerful. So it's not a proof."

  2. "So it's just a guess, then?"
     - Where to address: In step 4 and 5.
     - Response: "It's an informed hypothesis. It's based on a careful analysis of what 'mechanical' means and the fact that all attempts to formalize it have converged. But it's not arbitrary and it's not a guess in the sense of being unsupported."

  3. "Quantum computers break it."
     - Where to address: In step 6 (misconceptions) or if raised earlier, defer to step 6.
     - Response: "Current quantum computers are not known to compute functions outside the Turing computable ones. They are believed to be efficiently simulating a Turing machine. Even if they could compute a non-Turing-computable function, we would have to agree that the quantum process is a 'mechanical procedure' in the informal sense. But note that the thesis is about discrete, step-by-step procedures. Quantum mechanics might be seen as introducing randomness, but that can be simulated by a TM. The real challenge would be if quantum mechanics allowed for continuous parameters that could be measured to arbitrary precision and used to compute a non-computable function. But such a device would require infinite precision, which is not physically realizable. So it's not clear that quantum computers break the thesis."

  4. "What about the argument that human mathematicians can't be Turing machines?"
     - Where to address: If raised, in step 6 or at the end.
     - Response: "The thesis does not claim that humans are Turing machines. It claims that any mechanical procedure (which a human might follow) can be carried out by a Turing machine. If humans can do non-mechanical things (like having insights that are not algorithmic), that doesn't contradict the thesis. The thesis is about what can be done by following an algorithm."

  5. "LLMs are Turing machines, so they can't really do X."
     - Where to address: If raised, at the end or in step 6.
     - Response: "The thesis says that any mechanical procedure can be done by a Turing machine. So if an LLM is doing something that we consider a mechanical procedure, then it can be simulated by a Turing machine. But note that LLMs are very complex and we don't always know what procedure they are following. The thesis does not say that Turing machines can do everything a human can do (like having consciousness, etc.) — only that they can do anything that can be done by following a mechanical procedure."

  Which misconceptions to raise proactively:
     - The first two ("isn't it proved?" and "so it's a guess?") should be raised by the facilitator in step 4 because they are central to the status.
     - Quantum computers: If the group is likely to bring it up, you might preempt it in step 5 when discussing evidence against. Otherwise, wait for it and address it in step 6.
     - The human mind and LLMs: These are less central and might be handled if they come up.

  Trap to avoid:
     - The quantum computing and analog computing issues can eat up time. Be ready to say: "That's a deep topic and we don't have time to do it justice today, but the key point is that the thesis is about effective calculability in the discrete, step-by-step sense. Physical systems that rely on continuous quantities might be argued to go beyond that, but then we have to ask: is that still a mechanical procedure as we defined it? And note that infinite precision is not physically realizable."

  Split the Thesis?:

  We should mention the distinction between the mathematical thesis (which we are discussing) and the physical thesis. But we are focusing on the mathematical one.

  Where to mention: In step 5 when discussing evidence against. If someone brings up a physical computer, say: "Note that the original Church-Turing thesis is about what is effectively calculable by a mechanical procedure. There is a stronger claim, sometimes called the Physical Church-Turing thesis, which says that any function computable by a physical device is computable by a Turing machine. That is a separate claim and more controversial because it depends on the laws of physics. Our session is about the original thesis."

  We introduced "effective calculability" in step 1. Use the term because it is standard and we defined it.

  Closing Check:

  As above: Ask each person to write a sentence about the status and evidence against. Then share a few.

  What to leave out:

  1. The halting problem and other uncomputable functions.
     - Sentence: "We are omitting the halting problem and other specific uncomputable functions because they illustrate the limits of computation, but our focus is on the nature of the thesis itself."

  2. The equivalence proofs between different models (like lambda calculus and Turing machines).
     - Sentence: "We are not going into the proofs that show various formal models are equivalent because that is strong evidence for the thesis but doesn't change its status as a non-provable hypothesis."

  3. The details of how a Turing machine works (beyond a basic sketch).
     - Sentence: "We are only sketching the Turing machine because the details of its operation are not necessary for understanding the status of the thesis."

  Handling a question beyond knowledge:
     - "That's an interesting point and I don't have a complete answer right now. I'd like to think about it more and get back to you. Let's talk after the session or I'll send an email."

  Full Plan:

  - 0-2 min: Introduction.
  - 2-12 min: Elicit informal notion (with the human computation example).
  - 12-17 min: Introduce Turing machine (brief sketch).
  - 17-20 min: State CTT.
  - 20-30 min: Why not a theorem? (address the first two misconceptions) and the carrying example.
  - 30-40 min: What counts as evidence against? (using the same example) and introduce the physical distinction if needed.
  - 40-45 min: Address misconceptions (quantum, etc.) and closing check.

  Note: Be flexible and adjust timing as needed.
answer: |-
  ### Plan for 45-Minute Session: The Epistemic Status of the Church-Turing Thesis  
  **Goal:** Engineers leave understanding that the thesis is a **hypothesis linking an informal concept (effective calculability) to a formal model (Turing machines)**, not a theorem, definition, or physical law. They can articulate evidence against it: a mechanical procedure accepted as "effective" that cannot be simulated by a Turing machine.

  ---

  #### 1. **Dependency Structure and Sequence**  
  *(Total: 45 min)*  
  **Justification:** Start with the engineers' intuition to make the informal concept feel discovered. Delay formal models to avoid "math overload" and focus on epistemic status. The Turing machine is a tool, not the star.  

  - **(0-2 min) Hook:**  
    - *Do:* Write "Church-Turing Thesis" on the board. Say: *"We say a language is 'Turing complete' like checking a box. But what does that claim actually mean? Is it a fact, a definition, or something else? Today, we dissect its status."*  
    - *Why:* Sets the epistemic focus upfront. Avoids diving into tape/head mechanics.  

  - **(2-12 min) Elicit the Informal Notion of a Mechanical Procedure:**  
    - *Do:* Pose: *"Imagine a 'mechanical procedure' to solve a problem—like adding numbers or sorting a list. What must it be like? Shout out properties."*  
      - Guide them: Nudge toward **determinism, finite steps, no creativity, human-executable with pencil/paper**.  
      - Write key terms on the board: **"mechanical procedure" = "effective calculability"** (use this term now; define as *"what we all agree is computable by rote steps"*).  
    - *Carrying Example Seed:* Use **long addition**. Ask: *"Is this mechanical? Why?"* Have them identify properties (e.g., fixed rules, no intuition).  
    - *Why:* Engineers self-define the informal concept. "Effective calculability" enters early to frame the thesis.  

  - **(12-17 min) Introduce Turing Machine (Lightweight):**  
    - *Do:* Sketch a TM (tape, head, state machine) in 60 seconds. Say: *"This is a formal model. Like others (e.g., lambda calculus), it tries to capture 'effective calculability.'"*  
      - **Emphasize:** *"It’s a model, not reality. We built it to formalize what we just described."*  
    - *Why:* Formal model comes *after* informal concept. Keep it brief—this session is about the thesis, not TMs.  

  - **(17-22 min) State the Thesis and Its Claim:**  
    - *Do:* Write:  
      *"Church-Turing Thesis: Every effectively calculable function is computable by a Turing machine."*  
      - Explain: *"This claims our informal idea (effective calculability) matches this formal model."*  
    - *Why:* Now they see the thesis as a bridge between their self-generated concept and the model.  

  - **(22-32 min) Why It’s Not a Theorem, Definition, or Physical Law:**  
    - *Do:* Use questions:  
      - *"Is this a theorem? Can we prove it?"* → Highlight: *"The informal side isn’t math—we can’t prove 'mechanical' equals 'TM-computable' without circularity."*  
      - *"Is it a definition? Did we just define 'mechanical' as 'Turing computable'?"* → Argue: *"No—'mechanical' predates TMs (e.g., Hilbert’s problems). We’re making a claim about the world, not inventing terms."*  
      - *"Is it a law of physics?"* → *"No—it’s about abstract procedures, not hardware. But there’s a physical version we’ll touch on later."*  
    - *Carrying Example Use:* Return to **long addition**. *"We all agree this is 'effective.' A TM can do it. But what if we found something like addition that a TM can’t do? That would challenge the thesis."*  
    - *Why:* Deconstructs misconceptions. Uses their example to make evidence tangible.  

  - **(32-40 min) Evidence Against the Thesis & Physical Distinction:**  
    - *Do:*  
      - Ask: *"What would disprove this?"* Guide to: **A mechanical procedure everyone accepts as 'effective' that a TM cannot simulate.**  
      - Introduce **physical/non-physical split** plainly:  
        *"Some think the thesis is only about math ('effective calculability = TM-computable'). Others add a physical claim: 'Nature only allows TM-computable procedures.' We’re focused on the math version today—it’s clearer and stronger."*  
      - *Carrying Example Use:* *"Suppose we invent a device that mechanically solves a new problem. If we all say, 'Yes, that’s mechanical!', but no TM can do it—that’s evidence against the math thesis."*  
    - *Why:* Answers "what counts as evidence?" and preempts quantum/analog objections by separating math/physical claims.  

  - **(40-43 min) Misconception Firestorm (Quick Hits):**  
    - *Do:* Address these preemptively:  
      - *"But all models are equivalent!"* → *"Yes, but that just shows formal models agree—not that they match the informal idea."*  
      - *"Quantum computers break it!"* → *"They might break the physical version, but not the math one. Current QC only does TM-computable things faster."*  
      - *"So it’s just a guess?"* → *"An educated one! It’s survived tests because no one’s found a mechanical procedure a TM can’t simulate."*  
      - *"Human mathematicians/LLMs?"* → *"Thesis isn’t about humans or AI—it’s about procedures. If a human follows a mechanical step, a TM can simulate it."*  
    - *Why:* Controlled demolition. Prevents derailment.  

  - **(43-45 min) Closing Check:**  
    - *Do:* Ask each person to write one sentence: *"The Church-Turing thesis is a _______, and you could disprove it by _______."*  
      - Sample answer: *"Hypothesis linking informal 'effective calculability' to TMs. Disprove by finding a mechanical procedure no TM can simulate."*  
    - *Why:* Tests comprehension of status + evidence. Fast, visible.  

  ---

  #### 2. **Carrying Example**  
  **Use long addition (e.g., adding 2 multi-digit numbers)**.  
  - **Why it works:**  
    - Engineers know it intuitively.  
    - **Properties it has:** Finite steps, deterministic, no creativity, human-executable → Perfect for "effective calculability."  
    - **What it lacks:** No connection to formal models (so the thesis feels like a discovery). No complexity (avoids distraction from halting problem).  
  - **How to use it:**  
    - Intro: Elicit properties (e.g., *"Why is addition mechanical?"*).  
    - Thesis statement: *"We think TMs capture this."*  
    - Evidence against: *"What if we found a 'mechanical' procedure like addition that TMs can’t handle?"*  
  - **Why not halting problem:** It’s about uncomputability, not epistemic status. Adds unnecessary complexity.  

  ---

  #### 3. **Misconception Map**  
  *Predictable confusions, how to handle:*  

  | Misconception | What Someone Says | When to Address | Response |
  |---------------|-------------------|----------------|----------|
  | "Equivalence proves it." | *"But all computation models are equivalent, so it’s proved!"* | During "Why not a theorem?" (22-32 min). **Preempt it.** | *"That shows formal models agree, but not that they match the informal concept. What if we missed a model?"* |
  | "Just a guess." | *"So it’s just a guess, then?"* | During "Why not a theorem?" or when stating evidence (32-40 min). **Preempt it.** | *"An informed hypothesis! Like 'all swans are white' before Australia—supported by all known cases, but falsifiable."* |
  | Quantum computers | *"Quantum computers break it!"* | In "Evidence" (32-40 min) or firestorm (40-43 min). **Preempt it.** | *"They challenge the physical thesis, not the math one. No quantum computer today computes non-TM functions."* |
  | Human mind/LLMs | *"Human mathematicians can’t be TMs!"* or *"LLMs are TMs, so they can’t do X!"* | Firestorm (40-43 min) or if raised. **Let them raise it.** | *"Thesis isn’t about humans/LLMs—it’s about procedures. If a human uses a mechanical step, a TM can simulate it."* |
  | Analog computers | *"Real-valued analog computers?"* | Firestorm (40-43 min). **Preempt it.** | *"They often assume infinite precision, which isn’t mechanical. The math thesis is about discrete procedures."* |

  - **Which to let the room raise:** Human mind/LLMs (it’s engaging but low-risk).  
  - **Which to raise yourself:** "Equivalence proves it," "Just a guess," and quantum/analog (they’re central to status and evidence).  
  - **Trap to avoid (eats 20 min):** **Physical vs. math thesis debates.** Defuse early: *"We focus on the math version today—it’s cleaner. Physical claims depend on controversial physics."* If pressed: *"Let’s discuss offline—time is short."*  

  ---

  #### 4. **Whether to Split the Thesis**  
  - **Do split it**—it’s standard and defuses quantum/analog.  
  - **Where:** In "Evidence" section (32-40 min).  
  - **Plain words:**  
    > *"Most logicians split the thesis:  
    > - **Math version**: Effective calculability (what we defined) = Turing-computable.  
    > - **Physical version**: Any physical system can only compute Turing-computable functions.  
    > Our focus is the math version—it’s well-supported. The physical version is debated and relies on physics."*  
  - **Use "effective calculability"?** Yes—introduce it when eliciting the informal notion (2-12 min). Define it as *"what we mean by 'mechanical procedure'"* to avoid jargon fear.  

  ---

  #### 5. **What to Leave Out**  
  **Omit these to protect time and focus:**  
  1. **Halting problem/uncomputability results:**  
     - *Say:* *"We’re skipping uncomputable functions like the halting problem—they show limits of TMs, but not the status of the thesis."*  
     - *Why:* Adds complexity; distracts from epistemic goal.  
  2. **Historical details (Church, Turing, Gödel):**  
     - *Say:* *"We’re omitting the 1930s history—fascinating, but not needed to evaluate the thesis today."*  
     - *Why:* Trivia; doesn’t clarify status.  
  3. **Equivalence proofs between models:**  
     - *Say:* *"We’re not covering how TMs simulate lambda calculus—it’s evidence for the thesis, but doesn’t prove it."*  
     - *Why:* Technical; doesn’t address the "why not a theorem?" question.  

  **Handle unanswered questions:**  
  - If asked something beyond your knowledge (e.g., *"What about hypercomputation?"*):  
    > *"Great question—I don’t have a full answer now. Let me get back to you after I dig into it. For today, remember: the math thesis is about what we mean by 'mechanical,' not what’s physically possible."*  

  ---

  ### Final Preparation Notes  
  - **Whiteboard only:** Sketch TM quickly; focus on words/properties.  
  - **Pacing:** Stick to timings—cut discussion if needed.  
  - **Tone:** Use their language (e.g., "mechanical procedure" before "effective calculability").  
  - **If engineers stall:** Probe with *"What would make you call something 'mechanical'?"*  

  This plan ensures the room discovers the key ideas, confronts misconceptions fast, and leaves with a clear, actionable grasp of the thesis’s status. No slides, no readings—just whiteboard and dialogue.
