answer: |-
  **PHIL 305: Philosophy of Science — Practice Quiz**  
  **Question 1 (20 marks total)**  

  *Background: In Bayesian confirmation theory, rational agents update their beliefs by conditionalization: upon learning new evidence \(E\) (and nothing else), they set their new credence in hypothesis \(H\) to \(P(H|E)\). However, problems arise when \(E\) is already known and fully accepted. Suppose an agent’s current credence function assigns \(P(E) = 1\) because \(E\) is part of their total evidence. They then encounter a novel hypothesis \(H\) and learn that \(H\) entails \(E\) (i.e., \(H \rightarrow E\) is true). We explore the implications.*  

  **(a)** (5 marks)  
  Assume an agent has \(P(E) = 1\). They learn that \(H\) entails \(E\). Using the definition of conditional probability, show what happens to \(P(H)\) when they conditionalize on \(E\). Explain why this result challenges the idea that conditionalization on new evidence always confirms hypotheses that entail that evidence.  

  **(b)** (5 marks)  
  Now assume \(P(H) = 0.1\) and \(P(E) = 0.9999\) (so \(E\) is highly probable but not certain). The agent learns that \(H\) entails \(E\).  
  (i) Derive the general formula for \(P(H|E)\) given that \(H\) entails \(E\).  
  (ii) Compute \(P(H|E)\) with the provided values. Show your work.  
  (iii) The result shows a negligible boost to \(P(H)\). Explain why, and discuss how the size of this boost depends on \(P(E)\). When does "old evidence" become "too old" to meaningfully confirm \(H\)?  

  **(c)** (10 marks)  
  Consider this proposal for handling cases where \(P(E) = 1\):  

  > **The Rollback Rule**: If an agent with \(P(E) = 1\) learns that \(H\) entails \(E\), they should set their new \(P(H)\) to the value obtained by conditionalizing on \(E\) *from the credence function they held immediately before \(E\) first entered their evidence base*.  

  Evaluate this rule. Address:  
  (i) Whether the rule is **well-defined** (e.g., does it require information the agent might lack?).  
  (ii) Whether adopting it could lead to **problematic consequences**, especially if:  
  - The agent applies it repeatedly for *different* hypotheses that entail \(E\).  
  - Two agents with the *same total evidence* (including \(E\)) but *different learning histories* use it.  
  (iii) Whether the rule correctly handles what is *genuinely new*: learning the entailment (\(H \rightarrow E\)), not \(E\) itself.  

  ---

  ### **Model Answer**  
  **(≈650 words)**  

  **(a)**  
  By the definition of conditional probability, \(P(H|E) = P(H \land E) / P(E)\) when \(P(E) > 0\). Since \(H\) entails \(E\), \(H \land E\) is logically equivalent to \(H\) (if \(H\) is true, \(E\) must be true). Thus, \(P(H \land E) = P(H)\). Given \(P(E) = 1\), we have:  
  \[
  P(H|E) = \frac{P(H)}{1} = P(H).
  \]  
  Conditionalizing on \(E\) leaves \(P(H)\) unchanged. This is problematic because learning that \(H\) entails \(E\) *should* confirm \(H\): \(H\) predicts \(E\), and \(E\) is true. Yet conditionalization fails to increase \(P(H)\), violating the intuition that hypotheses entailing known evidence gain credibility. The core issue is that conditionalization cannot boost \(H\) when \(E\) is already certain (\(P(E) = 1\)), as no "update" occurs.  

  **(b)**  
  (i) Since \(H\) entails \(E\), \(H \land E \equiv H\), so \(P(H \land E) = P(H)\). The general formula is:  
  \[
  P(H|E) = \frac{P(H \land E)}{P(E)} = \frac{P(H)}{P(E)}.
  \]  
  (ii) Plugging in \(P(H) = 0.1\) and \(P(E) = 0.9999\):  
  \[
  P(H|E) = \frac{0.1}{0.9999} \approx 0.10001.
  \]  
  (iii) The result shows a tiny boost (\(\approx 0.00001\)). The boost size is governed by the factor \(1/P(E)\): as \(P(E)\) approaches 1, the boost shrinks toward zero. Here, \(P(E) = 0.9999\) is very close to 1, so \(1/P(E) \approx 1.0001\), yielding a negligible increase. "Old evidence" is "too old" to meaningfully confirm \(H\) when it is already highly certain (\(P(E) \approx 1\)). Only evidence with non-negligible uncertainty (\(P(E) < 1\)) can provide significant confirmation.  

  **(c)**  
  **Evaluation of the Rollback Rule:**  

  (i) **Well-defined?** The rule is **not always well-defined**. It requires the agent to recall or reconstruct their credence function *from before \(E\) was learned*. However, agents often lack access to past credence states—especially if \(E\) was learned long ago or other updates have occurred. Without this, the rule cannot be applied.  

  (ii) **Problematic consequences?**  
  - **Multiple applications**: If the agent discovers *another* hypothesis \(H_2\) that entails \(E\), they can reapply the rule using the *same* pre-\(E\) credence function. Each application boosts \(P(H)\) (or \(P(H_2)\)) by \(1/P_{\text{pre}}(E)\). Since \(P_{\text{pre}}(E) < 1\), repeated boosts can arbitrarily inflate credence for multiple \(H_i\) entailing \(E\), even if they conflict (e.g., \(H_1\) and \(H_2\) are incompatible). This "confirmation pumping" is irrational.  
  - **History dependence**: Two agents with identical *total evidence* (including \(E\)) but different *learning histories* (e.g., one learned \(E\) earlier than the other) will set different \(P(H)\) after applying the rule. Their pre-\(E\) credence functions likely differ, leading to divergent \(P(H)\) despite identical evidence. Standard Bayesianism treats total evidence as sufficient for rational credence; history dependence violates this, making it a **bug**. It introduces subjectivity via epistemic path-dependence.  

  (iii) **Genuine novelty**: The rule *misdirects* what is new. The agent learns \(H \rightarrow E\) (a logical fact), not \(E\) itself. The rule simulates updating on \(E\) from a past state, but this past update *already incorporated* whatever confirmation \(E\) provided for hypotheses known at the time. \(H \rightarrow E\) is fresh information that should affect *current* beliefs about \(H\)’s relation to \(E\), not "replay" past updates. A better approach would update directly on \(H \rightarrow E\), but standard Bayesianism lacks tools for logical learning. The rule is a workaround that risks history-dependence and pumping.  

  **Conclusion**: The Rollback Rule addresses the technical problem of \(P(E) = 1\) but introduces new issues: inaccessibility of past states, confirmation pumping, and history-dependence. It also fails to directly target the novelty of the entailment. While creative, it undermines key Bayesian ideals of total-evidence determination and logical omniscience.  

  ---

  ### **Marking Scheme**  
  **Total: 20 marks**  

  | **Part** | **Must-Hit Points**                                                                                                | **Marks** | **Common Bad Answers**                                                                                                                                                     | **Deduction**                                                                 |
  |----------|--------------------------------------------------------------------------------------------------------------------|-----------|----------------------------------------------------------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------|
  | **(a)**  | Correct derivation: \(P(H\|E) = P(H)\) via \(P(H \land E) = P(H)\) and \(P(E) = 1\).                               | 2         | Fails to show \(H \land E \equiv H\) or misapplies conditional probability formula.                                                                                        | –1 per error (max –2)                                                        |
  |          | Explains problem: Conditionalization fails to increase \(P(H)\), contradicting confirmation intuition.             | 3         | States "no boost" without linking to confirmation; claims conditioning on \(P(E)=1\) is undefined.                                                                          | –1 if vague; –2 if claims undefined (explicit deduction)                     |
  | **(b)**  | Correct general formula: \(P(H\|E) = P(H)/P(E)\) when \(H\) entails \(E\).                                           | 1         | Omits derivation or uses wrong formula (e.g., \(P(H \land E)/P(E)\) without justifying \(P(H \land E) = P(H)\)).                                                               | –0.5 if partial                                                              |
  |          | Correct computation: \(0.1 / 0.9999 = 0.10001\) (or ≈0.10001).                                                     | 2         | Arithmetic errors or no work shown.                                                                                                                                        | –1 per error                                                                 |
  |          | Explains boost size: Governed by \(1/P(E)\), negligible when \(P(E) \approx 1\); "too old" when \(P(E)\) is very high. | 2         | Only states "boost is small"; misses dependence on \(1/P(E)\) or limit behavior.                                                                                             | –1 if incomplete                                                             |
  | **(c)**  | Notes rule is ill-defined: Requires inaccessible past credence function.                                            | 2         | Assumes agents always remember past credences.                                                                                                                             | –1 if unaddressed                                                             |
  |          | Identifies confirmation pumping: Reapplying rule for new \(H_i\) boosts each indefinitely.                          | 3         | Only describes single application; misses multiplicity.                                                                                                                    | –2 if not mentioned                                                           |
  |          | Notes history-dependence: Same total evidence → different \(P(H)\) if histories differ.                             | 2         | Misses that total evidence is identical.                                                                                                                                   | –1 if incomplete                                                              |
  |          | Evaluates history-dependence: A "bug" (violates total-evidence ideal).                                             | 1         | Calls it a "feature" without justification.                                                                                                                                | –0.5 if unclear                                                               |
  |          | Addresses genuine novelty: Rule updates on past \(E\), not entailment \(H \rightarrow E\).                          | 2         | Focuses only on \(E\) being "old"; misses entailment as new evidence.                                                                                                       | –1 if unaddressed                                                             |
  | **General** | **Explicit deduction**: Claims conditioning on \(P(E)=1\) is undefined.                                            | **–2**    | Anywhere in answer (e.g., "division by 0" in (a) or (b)). *Note: It is defined, as shown in (a).*                                                                         | Deduct **–2** (applies once)                                                 |  

  **Notes**:  
  - Part (a) total: 5 marks.  
  - Part (b) total: 5 marks.  
  - Part (c) total: 10 marks (sum of sub-points).  
  - **Clarity penalty**: –1 if overall structure is incoherent.  
  - **Word limit**: No penalty for brevity if key points are hit; model answer ≈650 words.
