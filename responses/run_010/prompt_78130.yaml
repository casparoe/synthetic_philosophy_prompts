  We are creating a practice quiz question on the problem of old evidence in Bayesian confirmation theory. The question is divided into three parts (a, b, c). The entire setup must be self-contained. We are to avoid any philosopher names or paper titles.

  The skeleton provided by the user is:

  (a) Show using the definition of conditional probability what conditionalizing on E does to P(H) when the agent already has E as total evidence (so P(E)=1) and then learns that H entails E. Then explain why this is a problem for confirmation as conditionalization on new evidence.

  (b) Given numbers: P(H)=0.1, P(E)=0.9999 (so E is not quite certain), and H entails E. Derive the general formula for P(H|E) when H entails E, plug in, and get approximately 0.10001. Then discuss when old evidence is "too old" — the boost is governed by 1/P(E) and becomes negligible when P(E) is very close to 1.

  (c) Evaluate the "Rollback Rule": if you come to believe that H entails E (with E already in evidence and P(E)=1), set new P(H) to what conditionalizing on E would have given from the credence function *before* E entered the evidence. Ask whether it's well-defined, and whether adopting it costs the Bayesian anything else.

  We must also create a model answer (about 650 words) and a marking scheme (out of 20) with 5-6 must-hit points and specific deductions for common errors.

  Let's structure the question as it would appear on the paper.

  ---

  **PHIL 305: Philosophy of Science — Practice Quiz**

  **Question 1 (20 marks total)**

  *Background: In Bayesian confirmation theory, it is standard to model rational updating of beliefs by conditionalization: when an agent learns a new piece of evidence E (and nothing else), they update their credence in a hypothesis H to P(H|E). However, a challenge arises when the evidence E is already known to the agent and has been fully incorporated into their credence function. In such cases, the agent’s current credence in E is 1. Now, suppose the agent encounters a new hypothesis H and comes to believe that H entails E (i.e., if H is true, then E must be true). We will explore what happens when the agent tries to update their credence in H by conditionalizing on E.*

  (a) (5 marks) Suppose an agent’s total evidence includes E, and their current credence function is such that P(E) = 1. The agent then learns that H entails E. Using the definition of conditional probability, show what happens to the agent’s credence in H when they conditionalize on E. Explain why this poses a problem for the idea that confirmation (i.e., an increase in credence in a hypothesis) always occurs via conditionalization on new evidence.

  (b) (5 marks) Now suppose the agent’s credence function is such that P(H) = 0.1 and P(E) = 0.9999 (so E is not quite certain). The agent learns that H entails E. Using the general formula for P(H|E) when H entails E, compute the new credence in H. (Show your work.) Then, explain what this result tells us about the conditions under which old evidence can still provide a boost to H. In particular, discuss how the size of the boost relates to the prior probability of E.

  (c) (10 marks) Consider the following proposal for handling the problem of old evidence:

  *The Rollback Rule:* If an agent, whose current credence function assigns P(E) = 1 (because E is already in their total evidence), comes to believe that H entails E, then the agent should set their new credence in H to the value that conditionalizing on E would have given, had they started from the credence function they held *immediately before E first entered their evidence base*.

  Evaluate this rule. Address the following: 
  (i) Is the rule well-defined? (For instance, does it require information that the agent might not have?) 
  (ii) Could adopting this rule lead to any problematic consequences? (Consider, for example, what happens if the agent applies the rule multiple times for different hypotheses that entail E, or if two agents have the same total evidence but different learning histories.) 
  (iii) Does the rule capture what is genuinely new in the agent’s epistemic state? (Hint: The agent is learning something about the logical relationship between H and E, not about E itself.)

  ---

  **Model Answer (Approximately 650 words):**

  (a) The definition of conditional probability is P(H|E) = P(H ∧ E) / P(E), provided P(E) > 0. Since the agent already has E as total evidence, P(E) = 1. Also, because the agent has learned that H entails E, it follows that H ∧ E is equivalent to H (because if H is true then E must be true, so H implies H ∧ E, and obviously H ∧ E implies H). Therefore, P(H ∧ E) = P(H). Plugging in, we get P(H|E) = P(H) / 1 = P(H). Thus, conditionalizing on E leaves the credence in H unchanged.

  This is a problem for the idea that confirmation is always conditionalization on new evidence because the agent has just learned that H entails E, which seems like a reason to increase their confidence in H (since H predicts E, and E is true). However, conditionalizing on E does not change P(H). Hence, if we think that learning the logical connection should confirm H, then conditionalization on the old evidence E fails to capture that.

  (b) When H entails E, we have H → E, so H ∧ E is logically equivalent to H. Thus, the conditional probability formula becomes P(H|E) = P(H) / P(E). Plugging in the given values: P(H) = 0.1 and P(E) = 0.9999, we get P(H|E) = 0.1 / 0.9999 ≈ 0.10001. 

  This shows that when E is not absolutely certain (i.e., P(E) < 1), conditionalizing on E does give a small boost to H (from 0.1 to about 0.10001). The boost is very small because P(E) is very close to 1. The factor by which P(H) increases is 1/P(E). The boost is larger when P(E) is smaller (i.e., when E was less certain before). Thus, old evidence is "too old" to provide a significant boost when it is already very certain. In the limit as P(E) approaches 1, the boost approaches zero.

  (c) The Rollback Rule attempts to solve the problem by rolling back the credence function to the state just before E was learned and then conditionally updating on E. Let's evaluate it:

  (i) The rule is not always well-defined. It requires the agent to have access to the credence function they held immediately before E entered their evidence. However, an agent may not remember or have recorded that past credence state. Moreover, that past credence function may have been updated on other evidence since then, and the agent might not be able to reconstruct it. Therefore, the rule is not universally applicable.

  (ii) Adopting this rule can lead to problematic consequences. First, consider multiple applications: if the agent considers multiple hypotheses H1, H2, ..., each entailing E, then each time they apply the Rollback Rule they get a boost in credence for that hypothesis. Since the rule uses the same past credence function (the one right before E was learned) each time, each hypothesis gets a boost relative to that same base. This could lead to the agent having very high credence in multiple hypotheses that entail E, even if they are mutually incompatible. This is an example of "confirmation pumping" and seems irrational.

  Second, the rule makes current credences depend on the agent's learning history. Two agents with the same total evidence (including E) and the same current credences in all propositions might still assign different credences to H after applying the Rollback Rule if they learned E at different times or in different sequences. This violates a common Bayesian ideal that rational credences should depend only on total evidence, not on the history of acquisition. Whether this is a bug or a feature is debatable: one might argue that the learning history is part of the evidence, but standard Bayesianism does not include it. Most Bayesians would see this as a bug because it introduces an element of path-dependence that is not accounted for by the total evidence.

  (iii) The rule does capture something about the novelty of the agent's learning: what is new is the logical entailment between H and E. However, the Rollback Rule focuses on a hypothetical update on E from a past state. But the agent is not learning E again; they are learning a logical fact. Therefore, one might argue that the update should be on the logical truth (H → E) rather than on E. If we update on the logical entailment, then we would need a different approach (such as logical learning). The Rollback Rule is a workaround but does not directly address the logical learning. Moreover, if the agent already knew the logical entailment at the time they learned E, then the Rollback Rule would not apply because the agent would have already updated on the entailment. Thus, the rule only works for entailments learned after E.

  In summary, the Rollback Rule is an interesting proposal but faces problems of definition (due to the requirement of past credences), potential for abuse (via multiple boosts), and departure from the ideal of total evidence. It highlights the challenge of incorporating logical learning in Bayesianism.

  ---

  **Marking Scheme (Total: 20 marks):**

