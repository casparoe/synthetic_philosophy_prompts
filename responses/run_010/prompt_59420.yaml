prompt: |-
  I am assembling a seminar exercise on statutory interpretation, and I want a case built to order rather than an illustration of the textbook contrast. The purpose of the exercise is to dislodge the stock picture on which textualism is the rigid, literal option that holds a statute to the narrow reach of its words while purposivism is the flexible option that stretches it to cover situations the drafters never imagined. I want a fact pattern engineered so that the direction of travel is reversed: the textualist reading sweeps in conduct the enacting legislature was not aiming at, and the purposivist reading cuts that conduct out. A case in which the purposivist instead extends the statute to novel technology or unforeseen conduct will not serve, and neither will a case that turns on a word with two available senses.

  Treat the following as a real statute of a fictional American state, enacted in 1979 and never amended. There is no legislative history beyond what appears in subsection (a), and there are no companion provisions.

  > § 4. Educational Materials Protection.
  > (a) Findings and purpose. The Legislature finds that commercial enterprises located near public schools have begun reproducing pages from textbooks adopted for classroom use and selling those reproductions to students, thereby depriving authors and publishers of compensation and schools of any incentive to adopt current materials. The purpose of this section is to prevent the unauthorized commercial reproduction of adopted textbooks and the substitution of such reproductions for purchased copies.
  > (b) Prohibition. No person shall reproduce, by any photographic, photocopying, or other duplicating process, any page of a textbook adopted for use in any public school of this State, and no person shall distribute any such reproduction to a student enrolled in such a school for any fee, charge, or other consideration.

  Construct a fact pattern meeting every one of these specifications:

  1. The defendant's conduct satisfies each element of subsection (b) on its face. No term is ambiguous, no element is strained, and no appeal to subsection (a) is needed to establish coverage.
  2. The conduct frustrates neither purpose recited in subsection (a): it does not displace a sale to the school or to an ordinary student, and it is not commercial substitution in any recognizable sense.
  3. The activity is sympathetic enough that a reader feels the pull of the purposivist result, yet enjoys no independent legal protection. Nothing outside § 4 may do any work: no absurdity doctrine, no scrivener's error, no constitutional avoidance, no preemption, no civil-rights or disability statute, no equitable discretion. The case must be decided on the four corners of the provision.
  4. The result the text produces must be unattractive but not absurd. A court could impose it without embarrassment and a prosecutor could defend it in good faith.
  5. Realistic and contemporary: an ordinary institution, service, or individual in an ordinary American setting. No exotic technology. One paragraph, no more than 150 words.

  After the scenario, supply the following, in order:

  - The textualist verdict and the reasoning that generates it, including the strongest good-faith argument that enforcing the text here is not merely tolerable but correct, rather than a bare insistence that the words cover the conduct.
  - The purposivist verdict and the reasoning that generates it, and an explicit statement of whether subsection (a) is being treated as fixing the meaning of subsection (b) or as carving an unenacted exception out of a meaning that is already clear. That choice is the crux; do not leave it implicit.
  - Identification of the single feature of your fact pattern that produces the divergence, followed by a minimal-pair check: remove or alter that feature and show both readings converging on the same outcome.
  - An account of which conception of legislative intention each side is tracking — the meaning the enacted words conventionally carried, or the further goal those words were chosen to advance — and your judgment on whether the two sides are disagreeing about the same thing, or whether one of them is making a claim about legal content while the other makes a claim about linguistic content.
  - How each side would attack the other's move: the textualist's case that the purposivist is amending rather than interpreting, and the purposivist's case that the textualist's "clarity" is an artifact of refusing to read an enacted purpose clause as law. Say which attack you find more damaging and why.
  - A closing note on what would make this case a cheat — what would reveal that the divergence is driven by a free-floating fairness intuition rather than by subsection (a) — and your assessment of whether your own case passes that test.

  Keep the analysis under 900 words. Do not cite or allude to real decisions, statutes, or scholarly works; the fictional provision is to be treated as the whole of the relevant law.
reasoning: |-
  Okay, the user is creating a seminar exercise on statutory interpretation and wants a fictional case that reverses the typical roles of textualism and purposivism. They've provided a fictional statute from 1979 prohibiting commercial reproduction of school textbooks. The challenge is to design a fact pattern where textualism broadly applies the statute to unintended conduct while purposivism narrowly limits it based on legislative purpose.

  Hmm, the key requirements are quite specific: the defendant's conduct must facially violate subsection (b) without ambiguity, yet not actually frustrate the purposes in subsection (a). It needs to be sympathetic but legally unprotected, realistic, and produce a non-absurd but unattractive textualist outcome. 

  Let me brainstorm a scenario... Perhaps something involving nonprofit or educational use? The statute prohibits "any fee, charge, or other consideration" - maybe a nominal fee situation? Like a university copying textbook pages for low-income students at cost? But that might trigger the commercial element... 

  Wait - better idea: what about a public library making textbook reproductions available through vending machines? The user pays only the paper/ink cost. It's technically "consideration" but not commercial profit. The library isn't competing with textbook sales since schools still buy copies. This satisfies subsection (b) literally: reproduction by photocopying + distribution for consideration. But subsection (a) is about commercial enterprises depriving publishers - this is public service.

  Developing this: "The County Public Library installs self-service photocopiers allowing patrons to reproduce textbook pages from reference copies. Patrons pay 10 cents per page, precisely covering paper/toner costs. A student copies 30 pages from a state-adopted biology text."

  Perfect. Textualism has to condemn this because money changed hands. Purposivism sees no commercial substitution. The library isn't near a school either - avoiding that potential issue.

  Now the analysis: Textualist verdict is violation - clear elements satisfied. Good faith argument: nominal fees still incentivize mass copying. Purposivist verdict: no violation - using (a) to define scope, not create exception. The divergence point is the break-even fee structure. 

  For the attacks: Textualist would accuse purposivism of rewriting the law. Purposivist would counter that ignoring purpose clauses distorts meaning. I find the purposivist attack stronger here because (a) is enacted text.

  To avoid cheating: If the fee were profit-driven, both sides would condemn it. My scenario passes because only the fee amount makes it debatable.
answer: |-
  ### Fact Pattern
  The County Public Library maintains reference copies of all state-adopted high school textbooks. To aid low-income students, it installed self-service photocopiers allowing patrons to reproduce pages for 10 cents per page—precisely covering paper and toner costs. No staff assistance is provided. Maria, a student, copies 30 pages of a state-adopted chemistry textbook for a $3.00 fee. The library derives no profit and competes with no school sales; students use copies solely as study supplements alongside school-issued texts.

  ---

  ### Textualist Verdict & Reasoning  
  **Verdict:** Guilty.  
  **Reasoning:** Subsection (b) prohibits (1) reproducing any page of an adopted textbook via "photocopying" and (2) distributing such reproductions to students for "any fee, charge, or other consideration." The library photocopied textbook pages and charged Maria $3.00—plainly satisfying every element. "Consideration" unambiguously encompasses nominal cost-recovery fees; no commercial-profit requirement exists in the text. Enforcing the text here upholds legislative supremacy: courts lack authority to imply exemptions for public institutions or break-even pricing when the statute’s terms are unequivocal.  

  ---

  ### Purposivist Verdict & Reasoning  
  **Verdict:** Not guilty.  
  **Reasoning:** Subsection (a) identifies two purposes: preventing (i) **commercial** entities from profiting off reproductions that (ii) **substitute for purchased copies**, thereby harming publishers/schools. The library’s activity—a non-profit public service providing supplements, not substitutes—frustrates neither purpose. Subsection (a) fixes the meaning of (b) by defining its operative terms ("commercial reproduction," "substitution") and limiting the scope of (b)’s broad language to the harms the legislature actually sought to address.  

  ---

  ### Divergence Feature & Minimal-Pair Check  
  **Feature:** The library charges a fee solely to recoup costs, with no profit motive or market displacement.  
  **Minimal-Pair Alteration:** If the library sold copies at a 50% markup ($4.50), both textualists and purposivists would convict. Textualists: the fee remains "consideration." Purposivists: profit and market competition align with subsection (a)’s concerns.  

  ---

  ### Conceptions of Legislative Intention  
  - **Textualist:** Tracks **conventional meaning** of enacted words ("consideration" = any payment).  
  - **Purposivist:** Tracks **further goals** ("consideration" = payment enabling commercial substitution).  
  They disagree about legal content: textualists claim the law’s content *is* the conventional meaning, while purposivists claim it includes purpose-driven limitations.  

  ---

  ### Cross-Attacks  
  **Textualist’s Attack:** Purposivism amends the statute by importing a "non-profit exemption" nowhere in (b), violating separation of powers.  
  **Purposivist’s Attack:** Textualism’s "clarity" is illusory; it ignores that (a) and (b) form a single enacted unit, making purpose part of the law’s communicative content.  
  **More Damaging Attack:** The purposivist attack is stronger. Subsection (a) is enacted text, not extrinsic evidence; textualism’s refusal to read it as shaping (b)’s scope artificially isolates clauses the legislature integrated.  

  ---

  ### Cheat Test & Assessment  
  **Cheat Test Revealed:** If purposivism exempts the conduct *without relying on subsection (a)* (e.g., appealing to fairness or public policy), it is cheating.  
  **Assessment:** This case passes. The purposivist verdict flows *entirely* from subsection (a)’s purposes: non-commerciality and non-substitution. Removing (a) would force a purposivist conviction.  

  ---
