  For the third beat, the actual cost of choosing must be shown physically - perhaps through fuel expenditure, time loss, or equipment damage - without moralizing about the decision.

  Noting important constraints: no character says "weight of evidence" or mentions Keynes. The philosophy must be structurally integral, not decorative. And that ending "Theme:" tag is clever - it forces me to commit to which concept drives the plot.

  I think both ideas are interwoven here. The non-comparable probabilities manifest in the experts' refusal to rank options, while the probability/weight split appears when new evidence changes confidence without changing the "right" answer. The commander's decision to trust the auger team despite the modeler's objections will demonstrate this best.

  The setting feels authentic - I can practically smell the diesel and frost in that operations room. The ice master should speak sparingly; his authority comes from presence, not arguments. The modeler's frustration needs to build gradually until that beautiful moment where she realizes the spreadsheet has no column for what's happening.

  Most challenging will be making the reader feel the "unsatisfying but possibly correct" nature of the experts' position. That requires carefully constructed silence and subtext in their scenes. The sonar beat should create palpable relief despite worse numbers - that's the weight concept in action.

  For the cost of choosing: if they opt for the auger survey, show the real consequences - maybe the ship becomes trapped while they're gathering data. Not catastrophic, but consequential. The modeler might see her precious Monte Carlo runs rendered useless by reality.

  The Theme line will clearly state it's about both concepts - the refusal to quantify and the evidence weight distinction are two sides of Keynes' coin. But I'll save that exact phrasing for the end.
