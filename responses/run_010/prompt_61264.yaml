prompt: |-
  I'm a hospital social worker. For eleven years I have written capacity evaluations and drafted guardianship petitions, and eighteen months ago I became my sister's plenary guardian after an anoxic brain injury at thirty-four. My working vocabulary is a very particular one: the presumption of capacity, capacity as decision-specific and time-specific rather than global, substituted judgment versus best interests, the least restrictive alternative, limited versus plenary guardianship, undue influence, the dignity-of-risk idea, and the disability-rights push away from substituted decision-making and toward supported decision-making built on a person's own will and preferences. A reading group I joined is working through the first book of the Politics, and I have not been able to shake it — not because I find the institution defensible, but because the argumentative moves sound disturbingly like ones I make for a living.

  I would like a translation exercise rather than an evaluation. Restate Aristotle's case for natural slavery — the argument, not the historical practice — in the vocabulary above, as faithfully as you can manage, working through these five components in order:

  1. The capacity claim. In Jowett's rendering of Book I, the natural slave is "he who participates in rational principle enough to apprehend, but not to have, such a principle." What is the nearest counterpart in my framework, and does the apprehend-but-not-possess distinction have an expression there at all?

  2. The interest claim: that rule over such a person is expedient and right for the ruled, and that master and slave have a common interest rather than opposed ones.

  3. The structural analogy: soul rules body despotically, intellect rules appetite constitutionally and royally, and the same pattern of a ruling and a subject element extends to human beings, where equality or the rule of the inferior is harmful.

  4. The instrumental and teleological claims: the slave as a piece of property that acts on its own, an instrument subordinate to the ends of the household, and the further claim that such a person has a genuine but subordinate and derivative excellence of his own.

  5. The diagnostic claim: that this is a natural kind identifiable in principle by observation, together with Aristotle's own concession that the marks nature intends often come out wrong — some have the souls and others the bodies of free men — and his distinction between natural slavery and slavery by convention or war-capture, the latter of which he treats as contested and possibly unjust.

  For each of the five, give me a residue report: the nearest counterpart in my vocabulary; a verdict of clean translation, translation only with distortion, or no counterpart whatever; and a precise statement of what the distortion or the gap consists in.

  Then take the residue seriously, which is the part I actually want. For every item you mark distorted or untranslatable, tell me which direction the failure points. Either my vocabulary is missing something — for instance, that because it can represent a deficit only as decision-specific, time-limited, and remedial, it has no way of representing a standing and non-accidental condition in which another person's practical reasoning is genuinely the better instrument of one's own good, and so drives the acknowledgment of exactly that underground into informal family arrangements nobody audits — or Aristotle's claim was less determinate than it looks, and the components that vanish were carrying no weight once the teleology is removed. Say which, item by item, and say why. I have a candidate for the strongest form of the first possibility: that the question Aristotle is raising is whether authority over an adult's decisions can ever be constitutive of that adult's good rather than merely protective of it, and that my framework cannot even formulate that question, as distinct from answering it differently. Test that candidate, tell me whether it survives contact with the actual standards I work under, and propose better candidates if you think it is wrong.

  Two disciplines I want you to hold to. Do not smuggle: the presumption of capacity, the individualized-assessment requirement, and the least-restrictive-alternative constraint are presuppositions of my framework, not of his, and a translation that quietly supplies them to Aristotle and then reports an encouraging fit is worthless to me — mark every place you feel the pull to do it. And do not caricature: he distinguishes natural from conventional slavery and concedes the conventional sort may be unjust, and the interest claim does real work for him, so treat him as making a claim about who benefits and not merely about who is stronger.

  Since I intend to argue about this with people who read the Greek and I do not, close with an honest account of your own exposure. Tell me where your reconstruction is most likely to be wrong; what would change your mind about the items you mark untranslatable — what feature or claim, if I could show my framework does have a term for it, would force you to revise those verdicts; which residue verdict you hold least confidently and why; and the single place where your translation is most at risk of importing my framework's assumptions into Aristotle and reporting the result as a clean fit.
reasoning: |-
  Hmm, this is an incredibly thoughtful and complex request from a hospital social worker who's deeply immersed in capacity evaluation frameworks while personally navigating guardianship for their sister. They're wrestling with disturbing parallels between Aristotle's natural slavery arguments and their professional vocabulary around decision-making capacity.

  The user wants five specific components of Aristotle's argument translated into modern guardianship terminology, complete with "residue reports" about what gets lost in translation. This isn't about judging Aristotle but about rigorously examining where the frameworks diverge. They're particularly interested in whether their professional paradigm can even conceive of authority being constitutive (rather than protective) of another's good.

  Key challenges here:
  Their vocabulary presumes capacity as default; Aristotle starts from hierarchy. 
  Terms like "dignity of risk" and "supported decision-making" actively resist his premises. 
  The "apprehend but not possess reason" distinction has no clean parallel - capacity frameworks focus on functional ability, not metaphysical participation in rationality.

  For the residue reports:
  The "common interest" claim distorts badly because modern practice assumes potential conflict of interest requires oversight. 
  The soul/body analogy has no counterpart - we'd reject hierarchical metaphors as dehumanizing. 
  The "derivative excellence" concept clashes fundamentally with person-centered approaches.

  Their candidate hypothesis about authority being potentially constitutive hits hard: modern guardianship sees authority as protective scaffolding, never as intrinsic to the person's good. This survives contact with practice standards - even plenary guardianship aims to approximate what the person would decide.

  Biggest risks in translation:
  Smuggling in "least restrictive alternative" when Aristotle explicitly endorses despotism. 
  Softening his natural kind claims to fit our individualized assessment model. 
  Misrepresenting his teleology as mere functional limitation.

  Most fragile residue verdict is about "derivative excellence" - could be misinterpreted as our "person-centered goals," but Aristotle's version subordinates the slave's telos to the master's.

  For exposure: I'm least confident about Greek nuances around "logos" participation. If "apprehend but not possess" maps to our "can communicate preferences but can't weigh risks," that would force revision. Biggest smuggling risk is in #2's "common interest" - might unconsciously frame it as modern "best interests" when Aristotle means something more ontological.

  This demands brutal honesty - their framework can't ask Aristotle's question because it starts from diametrically opposed premises about agency and personhood. The untranslatable residues point to where our paradigm refuses to go.
answer: |-
  Below is a systematic translation and residue analysis of Aristotle's case for natural slavery using your professional framework. I proceed component-by-component, adhering strictly to your vocabulary and Aristotle's logic without smuggling in modern presuppositions. Each section follows your requested structure: translation attempt, residue report (counterpart, verdict, distortion/gap), and critical analysis of the residue. Finally, I address your candidate hypothesis and provide an exposure accounting.

  ---

  ### **1. Capacity Claim**  
  *Aristotle:* Natural slaves possess enough rational principle to *apprehend* (understand/execute) but not to *have* (originate/possess) rational principle.  

  **Translation Attempt:**  
  The natural slave has *decision-specific capacity* limited to implementing directives from others, but lacks *global capacity* for independent practical reasoning. The "apprehend-but-not-possess" distinction maps to a *time-specific and task-specific ability to follow instructions* (e.g., comprehending immediate tasks) but an *incurable deficit in executive judgment* (e.g., inability to weigh long-term consequences or form autonomous life plans).  

  **Residue Report:**  
  - **Nearest Counterpart:** Decision-specific capacity assessments focused on *execution of directives* vs. *formation of judgment*.  
  - **Verdict:** **Translation with distortion**.  
  - **Distortion/Gap:** Your framework treats all capacity deficits as *remediable* or *context-dependent* (via support, time-limited constraints). Aristotle posits a *permanent, intrinsic incapacity for autonomous reasoning* – a standing deficit that is *categorical* (not decision-specific) and *non-remediable*. Your vocabulary lacks a concept of inherent, lifelong incapacity for self-governance.  

  **Residue Analysis:**  
  The failure points toward a gap in your framework. Aristotle’s claim requires acknowledging a class of persons whose "incapacity" is not a deficit to be accommodated or remedied but a *fixed ontological condition* making them permanently reliant on others' judgment. Your paradigm (rooted in disability rights and presumption of capacity) cannot represent this as it pathologizes all permanent dependency as a failure of support.  

  ---

  ### **2. Interest Claim**  
  *Aristotle:* Rule over the natural slave benefits the enslaved, and master/slave share common interests (the slave’s good is derivative of the master’s).  

  **Translation Attempt:**  
  Guardianship is *expedient and right* for the ward because their well-being is *instrumentally aligned* with the guardian’s stewardship. The relationship is *non-adversarial* (common interest) because the ward’s "best interests" are served by subordinating their will to the guardian’s practical reasoning.  

  **Residue Report:**  
  - **Nearest Counterpart:** "Best interests" standard (vs. substituted judgment) in cases where the ward cannot express preferences.  
  - **Verdict:** **Translation with distortion**.  
  - **Distortion/Gap:** Your "best interests" standard is a *fallback* when preferences cannot be known; it does not affirm that subordination *itself* constitutes the ward’s good. Aristotle’s "common interest" implies the slave’s flourishing is *inherently derivative* – their good is *defined* by service to the master. Your framework rejects this teleological hierarchy.  

  **Residue Analysis:**  
  The gap reveals Aristotle’s stronger claim: authority is not merely protective but *constitutive* of the enslaved person’s good. Your candidate hypothesis **survives contact** here: your framework *cannot formulate* whether authority could be constitutive (vs. protective). "Best interests" assumes the ward’s good exists independently and is merely discerned by others; Aristotle asserts it is *produced* by subordination.  

  ---

  ### **3. Structural Analogy**  
  *Aristotle:* Soul despotically rules body; intellect constitutionally rules appetite; humans must mirror this hierarchy (rule by superiors avoids harm).  

  **Translation Attempt:**  
  A *functional hierarchy* exists within persons (reason governs impulse), justifying external hierarchies where "inferior" individuals require *despotic rule* (plenary guardianship) for their own benefit. Equality or self-rule for such persons is inherently *harmful*.  

  **Residue Report:**  
  - **Nearest Counterpart:** None. Your framework rejects *categorical* hierarchies; capacity assessments are individualized.  
  - **Verdict:** **No counterpart whatever**.  
  - **Distortion/Gap:** The analogy relies on *metaphysical naturalism* (hierarchy as cosmic principle). Your vocabulary lacks concepts of "natural inferiors" or rule as cosmic duty. "Dignity of risk" actively counters the claim that subordination prevents harm.  

  **Residue Analysis:**  
  The untranslatability points to Aristotle’s reliance on teleology. Remove his cosmology, and the analogy collapses. Your paradigm’s commitment to *individualized assessment* and *dignity of risk* flatly contradicts the premise that equality can be intrinsically harmful for some classes.  

  ---

  ### **4. Instrumental & Teleological Claims**  
  *Aristotle:* The slave is "property that acts," an instrument for the master’s ends, with a subordinate excellence (virtue) in fulfilling their role.  

  **Translation Attempt:**  
  The ward is a *functional instrument* whose actions serve the household’s ends. Their "excellence" lies in reliably implementing the guardian’s decisions, deriving purpose from this subordinate role.  

  **Residue Report:**  
  - **Nearest Counterpart:** None for instrumentalism; limited parallel to "person-centered goals" in care plans.  
  - **Verdict:** **No counterpart whatever** for instrumentalism; **distortion** for excellence.  
  - **Distortion/Gap:** Your framework sees the ward as *ends in themselves*; Aristotle reduces them to *means*. His "derivative excellence" has no parallel – your "supported decision-making" seeks to *amplify* the person’s will, not replace it with role-derived virtue.  

  **Residue Analysis:**  
  The failure is bidirectional. Aristotle’s instrumentalism is alien to your person-centered ethics. His "derivative excellence" distorts into "person-centered goals," but the latter honors the individual’s *own* telos, while Aristotle’s is imposed.  

  ---

  ### **5. Diagnostic Claim**  
  *Aristotle:* Natural slavery is identifiable by observable traits, though nature’s signals sometimes misfire (e.g., free souls in slave bodies). Conventional slavery (e.g., war captives) may be unjust.  

  **Translation Attempt:**  
  Natural incapacity is a *diagnosable condition* via evidence-based assessment, though errors occur (e.g., misidentifying a person with capacity as incapacitated). Non-natural guardianship (e.g., via coercion) is *potentially contestable/unjust*.  

  **Residue Report:**  
  - **Nearest Counterpart:** Individualized capacity assessments + critique of unjust guardianships.  
  - **Verdict:** **Translation with distortion**.  
  - **Distortion/Gap:** Aristotle’s "natural kind" implies a *binary class* discernible by generalized markers (e.g., physique, ethnicity). Your framework demands *individualized, functional assessment* and rejects group-based determinations. His concession of error is about *nature’s flaws*, not flawed assessments.  

  **Residue Analysis:**  
  Your *presumption of capacity* and *individualized assessment* requirements prevent a clean translation. Aristotle’s "diagnosis" is taxonomic; yours is contextual. The gap shows his claim depends on natural kinds – without it, only contingent incapacity remains.  

  ---

  ### **Testing Your Candidate Hypothesis**  
  > *"Can authority over an adult’s decisions ever be constitutive of that adult’s good rather than merely protective of it?"*  

  This hypothesis **survives contact** with your standards:  
  - Your framework treats authority as *protective* (preventing harm) or *facilitative* (enacting supported decisions), never as constitutive. Even plenary guardianship uses "substituted judgment" or "best interests" to approximate the person’s *own* good, not to define it through subordination.  
  - Aristotle’s "common interest" requires the constitutive claim – the slave’s good is *made real* by their role. Your paradigm has no mechanism to express this, as it roots "good" in individual will/preferences.  

  **Stronger candidate:** Aristotle’s deepest untranslatable claim is that **a human can be a functional fragment whose telos is realized only within another’s agency**. Your framework assumes all persons are *psychologically whole* and capacity deficits are *accidental* (injury, illness) – not natural states of fragmentary personhood.  

  ---

  ### **Exposure Accounting**  
  1. **Where reconstruction is most likely wrong:**  
     - Aristotle’s *logos* participation (apprehend vs. possess) may be less about reasoning capacity and more about *moral agency* in Greek thought. If so, I over-intellectualized it.  

  2. **What would force revision of untranslatable verdicts:**  
     - If your framework had a concept of **irremediable agential dependency** (e.g., for severe neurocognitive conditions) that is *not* seen as a deficit but a natural state, #1 and #2 would need re-evaluation.  

  3. **Least confident residue verdict:**  
     - #5 (Diagnostic Claim). If "natural kind" is read as *observable functional limitations* (e.g., persistent inability to plan), it edges closer to your assessments – but Aristotle’s biological teleology still distorts it.  

  4. **Greatest risk of smuggling your framework:**  
     - In #2 (Interest Claim), I risked conflating "common interest" with "best interests." Aristotle’s claim is *hierarchically constitutive*, while "best interests" is *fiduciary*. I flagged this but remain wary.  

  **Greek Nuances I Cannot Verify:**  
  - *Logos* (rational principle) may imply more than practical reasoning (e.g., moral perception). If so, "apprehend but not possess" could be untranslatable even at the metaphysical level.  
  - *Despotikē archē* (despotic rule) is explicitly non-reciprocal – Jowett’s "despotically" is apt. Your "plenary guardianship" implies oversight, not raw dominion.  

  The residues collectively expose a **foundational divide**: Your framework centers on *restoring/respecting agency*; Aristotle’s on *assigning agency hierarchically* based on natural fitness. Where he sees derivative flourishing, you see oppression. This is not a gap in terminology but in first principles.
