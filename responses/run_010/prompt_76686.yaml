  The user mentions this sits near a Gish gallop but isn't quite the same, as this involves a single high-cost claim rather than many claims. They also note the judge's psychological inference that visible effort indicates unreliability, which seems unique to this configuration.

  I need to draw from scalable oversight, argumentation theory, law of evidence, and information economics. Let me brainstorm candidate concepts:

  From argumentation theory, there's "burden of proof" and "probatio diabolica" (impossible proof), but these don't fully capture the resource dynamics. "Strategic maneuvering" is close but too broad.

  In law, "litigation exhaustion" describes draining resources through process, but it's about repeated actions, not single claims. "Frivolous litigation" is about bad-faith arguments, which may not apply here if claims are substantive.

  Economics gives us "asymmetric information" and "verification costs." Holmström's "informativeness principle" suggests that hard-to-verify claims shouldn't be rewarded, but it doesn't address the adversarial dynamics directly. "Signaling theory" could explain why effortless claims appear more credible, but it's not specific to this setup.

  None of these perfectly fit. We might need to coin a term. "Proof-of-work attack" comes to mind, drawing from cryptography, where forcing computational effort drains resources. But here it's about the judge's attention budget.

  Combining the elements: the claim is cheap to state but costly to verify ("costly claim asymmetry"), and the refutation requires disproportionate effort ("refutational resource sink"). The judge's inference that effort implies weakness is a "processing fluency bias."

  So a good term could be "Refutational Sinkhole." This captures how the opponent gets sucked into a resource-draining process. The boundaries are when a claim's verification cost exceeds the judge's budget per claim, and when agents strategically exploit this asymmetry.

  This phenomenon stems from the interaction of all three elements: the judge's limited budget creates the scarcity, the format allows asymmetrical claims, and the agents' incentives drive them to exploit it. Fixing it would require redesigning the format, perhaps by making claims costly to state or allowing judges to defer verification.
answer: |-
  Based on your detailed description and my analysis across the specified fields, here's a structured response:

  **Brainstormed Candidate Concepts:**
  1.  **Argumentation Theory:** "**Burden of Proof**" manipulation, "**Probatio Diabolica**" (proof of the devil - an impossible burden), "**Strategic Manoeuvring**" (shifting discussion to disadvantageous ground), "**Demand for Proof**" exploitation.
  2.  **Law of Evidence:** "**Litigation Exhaustion**" / "**Frivolous Litigation**" tactics, abuse of "**Discovery Burdens**", "**Shifting the Burden of Production**", "**Judicial Economy**" concerns.
  3.  **Economics of Information:** "**Asymmetric Information**" exploitation, "**Verification Costs**" as barriers, Holmström's "**Informativeness Principle**" (rewarding only verifiable effort), "**Signaling Theory**" (effortlessness as a costly signal).
  4.  **Scalable Oversight:** "**Gish Gallop**" (adjacent, as noted), "**Distraction Attacks**", "**Computation/Attention Sinks**".

  **Verdict & Coinage:**  
  **No single established concept perfectly captures this configuration.** The closest analogs are imperfect:
  *   *Probatio Diabolica* captures the *impossible verification burden* but misses the adversarial dynamics and the judge's biased inference.
  *   *Litigation Exhaustion* captures *resource draining* but focuses on repeated procedural abuse, not a single asymmetric claim.
  *   *Holmström's Informativeness Principle* explains *why* unverifiable effort shouldn't be rewarded but doesn't describe the *tactic* or the *cognitive bias*.
  *   *Gish Gallop* involves *volume*, while your case involves *depth* (one claim requiring disproportionate verification).

  Therefore, I coin the term:  
  **Refutational Sinkhole (n.)**  

  **Definition:** A strategic maneuver in adversarial evaluation where one party (the "Sinker") advances a claim that is **cheap to state but maximally expensive for the opponent to refute under the judge's constrained verification budget**. The opponent (the "Drainer") is forced to expend the majority of shared resources (time, attention, queries) on refutation, creating the appearance of:
  1.  **Argumentative Asymmetry:** The Drainer seemingly presents no positive case.
  2.  **Effort-Signaled Weakness:** The judge misattributes visible refutation effort as evidence of the Drainer's position being inherently weaker or less credible, contrasting with the Sinker's effortless assertion.

  **Boundaries (When ordinary strategy becomes a Sinkhole):**
  1.  **Cost Asymmetry Threshold:** The claim's verification cost *significantly exceeds* the judge's *per-claim* or *per-round* resource budget. Ordinary hard claims exist below this threshold.
  2.  **Strategic Exploitation:** Agents *deliberately select or craft* claims exploiting this asymmetry to force Drainer responses, rather than engaging substantively.
  3.  **Cognitive Heuristic Activation:** The judge *systematically interprets high refutation effort as weakness* and low effort as strength. Without this bias, it's just an inefficient stalemate.
  4.  **Budget Constraint Binding:** The budget must be sufficiently tight that draining it on one claim materially prevents alternative argumentation or verification.

  **Nature of the Phenomenon:**  
  Refutational Sinkhole is an **emergent property of the tripartite interaction between judge design, agent incentives, and the adversarial format.** Each component is necessary:

  1.  **Judge Design:** Provides the *scarcity* (limited budget) and the *cognitive bias* (effort → weakness heuristic). Without constrained resources or this bias, the tactic fails.
  2.  **Agent Incentives:** Drive the *strategic optimization* to exploit the judge's constraints and bias. Rational agents in a competitive environment *will* seek Sinkhole opportunities.
  3.  **Adversarial Format:** Creates the *structure* where asymmetric claims and forced refutation are possible. A non-adversarial or collaborative format prevents it.

  **Can it be Engineered Away?**  
  Yes, but **only by altering the format *and* the judge's incentives/design.** Fixing just one component is insufficient:
  *   *Altering only agents* (e.g., via RLHF) is fragile; new agents will rediscover the exploit.
  *   *Altering only the judge's bias* (e.g., training to value refutation effort) might mitigate the second consequence but not the resource drain.
  *   *Altering only the format* is key. Solutions include:
      *   **Costly Signaling:** Make *advancing* a claim costly proportional to its expected verification cost (e.g., requiring the claimant to pre-commit resources or provide compressed evidence).
      *   **Deferred Verification:** Allow the judge to "table" costly claims for later, separate verification outside the live debate, reducing the immediate sinkhole pressure.
      *   **Resource Decoupling:** Structure rounds so refutation doesn't monopolize the *shared* budget (e.g., separate "claim challenges" with dedicated mini-budgets).
      *   **Positive Argument Quotas:** Mandate minimum resources spent on advancing positive claims per round, preventing total Drainer focus.
      *   **Judge Awareness & Scoring:** Explicitly train judges to recognize and penalize Sinkhole attempts and score based on efficient resource use.

  The Refutational Sinkhole highlights a critical vulnerability in adversarial oversight with bounded rational judges. Its mitigation requires co-designing the interaction protocol and the judge's cognitive model to break the perverse incentive alignment between the Sinker's cheap claim, the Drainer's forced labor, and the judge's biased interpretation.
