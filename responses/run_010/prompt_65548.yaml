prompt: |-
  I'm co-teaching a law-and-philosophy seminar this term with a colleague over in criminology, and we've hit a wall on shaming sentences — you know the sort, the judge who orders a defendant to stand outside the post office with a sign around his neck, or the publicity-and-registry models of sanctioning. I wanted to put Bernard Williams and Ruth Benedict on the schedule and spend two weeks on whether a community can deliberately cultivate shame as a moral resource. My colleague thinks that whole line is romantic nonsense, and his argument runs through an analogy he's extremely attached to. Guilt, he says, is a courtroom; shame is a crowd. A courtroom has rules of evidence, a defense, a tariff of proportionate penalties, and above all an ending — you serve the sentence and the matter is closed. A crowd has no procedure, no counsel, no scale of proportionality, and no exit: it doesn't adjudicate what you did, it settles what you are, and it goes on looking. From that he draws two conclusions he treats as a single package: (i) guilt is the better moral emotion, because only guilt's tribunal is fair to the person in it; and (ii) a modern society couldn't choose shame as its register even if it wanted to, because a crowd presupposes a thick face-to-face community, and anonymous mass society has dissolved the audience shame depends on. Hence shaming sanctions are both unjust and unavailable, and policy should speak only to guilt.

  My problem is that the analogy feels rigged at both ends and I can't quite articulate where. On the guilt side he's picturing a well-run court, but the actual tribunal of conscience is famously the opposite: no defense counsel, no statute of limitations, no proportionality review, and a judge who is also the accused — the psychoanalytic picture of a conscience far crueler than any court it imitates seems to me to cut exactly against him, and Williams himself is happy to concede guilt can be excessive and irrational. On the shame side he's stipulating an actual, hostile, external audience, whereas the internalized-other move — the idea that shame's spectator can be imagined, internalized, or idealized, somebody you have never met or the community you'd like to belong to — is supposed to block precisely that stipulation. And then there's the awkward fact that courtrooms are spectatorship devices: the gallery, the public trial, the mugshot. So I don't know whether he's got a real disanalogy or just a flattering description of guilt and an unflattering one of shame.

  Could you audit it for me properly? I'd like an explicit correspondence table — what in the crowd/courtroom pairing plays the role of the judge, the audience, the evidence, the sentence, the acquittal, the fact that guilt is act-focused while shame is self-focused — then the disanalogies sorted into the ones that actually matter for the use he's putting it to and the ones that are just decorative, plus a clear statement of which features of the source domains the analogy quietly imports that the targets don't have. Then: do (i) and (ii) survive separately, once the disanalogies are on the table? He sells them as a package and I suspect they come apart — it's perfectly possible for one to fall and the other to stand, and I want to know which. If you think there's a better analogy for the same territory (something that keeps the audience point without the kangaroo-court problem), give me that too. Also please tell me how confident you are in the main claims, and single out the one point in your answer you're least sure of — I want to know where you're extrapolating rather than reasoning. End with a last line beginning "Verdict:" followed by exactly one of HOLDS, HOLDS-PARTLY, or FAILS, then a semicolon and one sentence of ten words or fewer saying what does or doesn't survive.
reasoning: |-
  Okay, the user is co-teaching a law-and-philosophy seminar and is stuck on shaming sentences. They need help auditing their colleague's analogy that guilt is like a courtroom and shame is like a crowd. The colleague argues that guilt is fair and procedural, while shame is unregulated and perpetual, concluding that guilt is better and shame isn't viable in modern society. The user feels the analogy is flawed but can't pinpoint why. 

  First, I need to unpack the colleague's analogy thoroughly. Mapping the courtroom elements (judge, evidence, sentence, etc.) to guilt and crowd elements to shame. Then, identify where the analogy breaks down. The user mentioned Williams and Benedict, so internalized shame and the psychoanalytic view of guilt as harsh are key. 

  The colleague's two claims are: (i) guilt is morally better because it's fair, and (ii) shame isn't feasible in mass society. I need to test if these hold once the disanalogies are exposed. For (i), the internal conscience can be irrational, unlike a fair court. For (ii), internalized shame means no physical crowd is needed, so modern society might still use shame. 

  Also, the user pointed out that courtrooms have audiences, which complicates the crowd analogy. Public trials and mugshots show that guilt sanctions involve spectators, blurring the lines. The colleague might be importing features: assuming guilt's structure is always fair and shame's is always unruly, which isn't true. 

  Constructing a correspondence table will help. Then, sorting disanalogies into relevant vs. decorative. The psychoanalytic point undermines guilt's fairness, and internalized spectators challenge the need for a physical crowd. 

  Alternative analogy: a mirror instead of a crowd. Focuses on self-perception and internal standards without the mob aspect. This keeps the audience element but avoids the kangaroo court problem. 

  Assessing confidence: The main points about disanalogies are strong. Least sure about the internalized audience's effectiveness in policy—empirical question. 

  Verdict: Claims fail. Guilt's fairness is overstated, shame's feasibility persists via internalization.
answer: |-
  Here's a full audit of your colleague's analogy, breaking down its structure, disanalogies, and implications for claims (i) and (ii):

  ### 1. Correspondence Table: Crowd/Courtroom Analogy Applied to Guilt/Shame
  | **Courtroom Element (Guilt Domain)** | **Crowd Element (Shame Domain)** | **Functional Role in Emotion** |
  |--------------------------------------|----------------------------------|--------------------------------|
  | Judge                                | Crowd (collectively)             | Source of judgment            |
  | Defense Counsel                      | (Absent)                         | Mechanism for self-advocacy   |
  | Rules of Evidence                    | (Absent)                         | Standards for evaluating acts |
  | Prosecution                          | Accuser(s) in crowd              | Force pressing the charge     |
  | Verdict                              | Collective judgment of crowd     | Determination of culpability  |
  | Sentence/Tariff                      | Unending scrutiny/rejection      | Imposed consequence           |
  | Acquittal/Closure                    | (Absent)                         | Restoration/cessation of sanction |
  | Act-focused charge                   | Identity-focused condemnation    | Object of evaluation          |
  | Physical courtroom                   | Physical/public gathering        | Context of judgment           |

  ### 2. Disanalogies Sorted by Relevance
  **A. Material Disanalogies (Undermine the Analogy's Purpose)**  
  - **Guilt's "Courtroom" is Internal & Unregulated:** The actual phenomenology of guilt lacks defense counsel, proportionality, and closure (as you note). Psychoanalysis shows guilt *exceeds* courtroom cruelty—no appeals, no parole. This contradicts the "fair tribunal" premise of (i).  
  - **Shame's "Audience" Can Be Internalized/Idealized:** Benedict/Williams emphasize shame can stem from *imagined* observers (e.g., ancestors, ideal community) or self-assessment against internalized standards. This negates (ii)'s claim that shame *requires* a physical crowd in mass society.  
  - **Courtrooms ARE Crowd-Dependent:** Public trials, mugshots, and registries *leverage* shame through spectatorship. This collapses the rigid separation the analogy asserts.  

  **B. Decorative Disanalogies (Rhetorical but Not Critical)**  
  - Physical setting (robes vs. town square).  
  - Literal "tariffs" vs. social costs.  
  - Temporal framing (finite trial vs. indefinite gathering).  

  ### 3. Features Illegitimately Imported from Source to Target  
  - **To Guilt:** Imports procedural fairness, proportionality, and closure from *idealized courts*—none inherent to guilt as experienced.  
  - **To Shame:** Imports irrationality, permanence, and lack of recourse from *hostile mobs*—ignoring shame's capacity for reintegration (e.g., restorative justice).  

  ### 4. Do Claims (i) and (ii) Survive?  
  - **(i) "Guilt is morally better": FAILS**  
    The analogy masks guilt's potential for pathological excess (e.g., survivor's guilt). Williams argues guilt *lacks* shame's capacity for moral growth through social reintegration. If guilt's "court" is a Kafkaesque self-tribunal, its "fairness" vanishes.  
  - **(ii) "Shame is unavailable in mass society": FAILS**  
    Internalization mechanisms (social media, ideology, self-monitoring) allow shame without physical crowds. Sex offender registries *thrive* in mass society precisely by creating digital crowds. Benedict's work on internalized culture proves shame functions without literal spectators.  

  **Conclusion:** The claims are **not** a package. Both fail independently once disanalogies are exposed. (i) fails because guilt isn't inherently fair; (ii) fails because shame doesn't require physical crowds.  

  ### 5. Better Analogy: The Mirror  
  **Guilt** = A broken contract ledger (focuses on specific debts/obligations owed).  
  **Shame** = A distorted mirror (reflects a compromised self-image against feared/ideal standards).  
  - *Why better:* Retains the "audience" element (mirror as internalized gaze) without mob dynamics. Allows for proportionality (mirror distortion ≈ severity of shame) and repair (clearing/fixing the mirror). Avoids kangaroo-court implications.  

  ### Confidence Assessment  
  - **High Confidence:** Core disanalogies (internalized shame, guilt's cruelty) are textually/empirically robust. Williams/Benedict explicitly support these points.  
  - **Low Confidence:** Whether *policy* can *effectively* cultivate "healthy" shame without devolving into crowd-like cruelty. This is an empirical/pragmatic gap—philosophy alone can't resolve it.  

  **Verdict:** FAILS; neither claim withstands scrutiny once the analogy is audited.
