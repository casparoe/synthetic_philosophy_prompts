answer: |-
  Here’s a complete in-class activity designed around your requirements, using a novel "coffee shop productivity" scenario to avoid clichés. The numbers are small, hand-calculable, and the reversal is robust to rounding. The activity emphasizes contextual decision-making and includes a second round with the same numbers but a different story.

  ---

  ### **Activity: Coffee Shop Productivity Challenge**  
  **Objective:** Experience how data aggregation can reverse conclusions, and understand that context determines which analysis to trust.  
  **Time:** 70-75 minutes (flexible).  
  **Materials:** Whiteboard, worksheets (or verbal instructions), pens, paper.  

  ---

  ### **Setup**  
  - **Teams:** Split the class into 7 pairs (14 students).  
  - **Roles per pair:**  
    - **Business Owner (BO):** Must choose one coffee blend for all 4 shops. Sees only *aggregate data* (Round 1) or *incomplete data* (Round 2).  
    - **Shop Manager (SM):** Must choose blends for each of 2 specific shops. Sees *disaggregated data*.  
  - **Scoring:** Points based on logical consistency with assigned data (no real money):  
    - **BO:** 10 points if their choice matches the aggregate data’s "winner."  
    - **SM:** 5 points per shop if their choice matches the disaggregated data’s "winner" for that shop.  
    Max 20 points per round. At the end, teams tally points; highest scorers get bragging rights (e.g., "Coffee Masters").  

  ---

  ### **Round 1: Context Matters (Severity-Driven Groups)**  
  *Context: "BeanVibe" (A) vs. "MorningRush" (B) coffee blends tested in urban vs. rural shops. Urban shops have high customer density (severe stress), rural have low density (mild stress).*  

  #### **Data (Write on Whiteboard):**  
  | Shop Type  | Blend | Shops Tested | Productivity Boosted | Success Rate |  
  |------------|-------|--------------|----------------------|--------------|  
  | **Urban**  | A     | 6            | 2                    | **33%**      |  
  |            | B     | 3            | 2                    | **67%**      |  
  | **Rural**  | A     | 3            | 2                    | **67%**      |  
  |            | B     | 6            | 3                    | **50%**      |  
  | **Overall**| A     | 9            | 4                    | **44%**      |  
  |            | B     | 9            | 5                    | **56%**      |  

  **Notes:**  
  - Aggregated: Blend B wins (56% > 44%).  
  - Disaggregated: Blend B wins in urban (67% > 33%), Blend A wins in rural (67% > 50%).  

  #### **Team Instructions (5 mins):**  
  - Give **BOs** only the *Overall* row.  
    > *"Blend A boosted productivity in 4 of 9 shops. Blend B boosted productivity in 5 of 9 shops. Choose one blend for ALL shops."*  
  - Give **SMs** the *full table* (without Overall).  
    > *"Choose a blend for an URBAN shop and a RURAL shop. Urban: A (2/6 boosted) vs. B (2/3 boosted). Rural: A (2/3 boosted) vs. B (3/6 boosted)."*  
  - **Pairs do NOT share data yet.** Each role commits to choices independently.  

  #### **Commit & Score (5 mins):**  
  - BOs choose B (aggregate winner). SMs choose B for urban, A for rural.  
  - Award points:  
    - BOs: 10 pts for choosing B.  
    - SMs: 5 pts for each correct shop choice (B urban, A rural).  

  ---

  ### **Round 2: Same Numbers, Different Story (Non-Comparable Groups)**  
  *Context: Same blends, but groups are "newly opened shops" (urban) vs. "established shops" (rural). Blends were tested at different times (A in winter, B in summer), so seasons confound results.*  

  #### **Data (Same as Round 1 but re-labeled):**  
  | Shop Age     | Blend | Shops Tested | Productivity Boosted | Success Rate |  
  |--------------|-------|--------------|----------------------|--------------|  
  | **New**      | A     | 6            | 2                    | **33%**      |  
  |              | B     | 3            | 2                    | **67%**      |  
  | **Established**| A     | 3            | 2                    | **67%**      |  
  |              | B     | 6            | 3                    | **50%**      |  
  | **Overall**  | A     | 9            | 4                    | **44%**      |  
  |              | B     | 9            | 5                    | **56%**      |  

  #### **Team Instructions (5 mins):**  
  - Give **BOs** only:  
    > *"Blend A boosted productivity in 4 of 9 shops. Blend B boosted 5 of 9. Choose one blend for ALL shops."*  
  - Give **SMs** the *full table* (without Overall) and hint:  
    > *"New shops tested Blend A in winter (low traffic), B in summer (high traffic). Established shops tested A in summer, B in winter. Choose a blend for a NEW shop and an ESTABLISHED shop."*  
  - **Pairs do NOT share data.** Commit independently.  

  #### **Commit & Score (5 mins):**  
  - BOs choose B again. SMs *should* choose B for new shops, A for established.  
  - Award points as in Round 1.  

  ---

  ### **Debrief (15 mins)**  
  Map their experiences to formal concepts:  
  1. **The Reversal (5 mins):**  
     - Ask: *"In both rounds, what did Business Owners see? What did Shop Managers see?"*  
     - Highlight:  
       - Aggregate data always favored B (56% > 44%).  
       - Disaggregated data showed B better for urban/new shops, A better for rural/established.  
     - **Key Insight:** Pooling data reversed the conclusion. Write the aggregated vs. disaggregated rates on the board.  

  2. **Context is King (5 mins):**  
     - Ask: *"When should you trust the aggregate table? When should you trust the split tables?"*  
     - Emphasize:  
       - **BO (administrator):** No access to shop details → forced to trust aggregate.  
       - **SM (clinician):** Knows specific shop context → trusts disaggregated data.  
     - **Real-world link:**  
       - Clinician treats one patient (needs severity data).  
       - Administrator buys for a district (only has pooled data).  

  3. **The Hidden Story (5 mins):**  
     - Ask: *"Same numbers in Rounds 1 and 2, but did the Shop Manager’s choices feel different? Why?"*  
     - Contrast:  
       - **Round 1:** Groups were "natural" (urban/rural). Severity drove outcomes.  
       - **Round 2:** Groups were confounded (seasons affected both blend assignment and productivity).  
     - **Key Insight:** The table alone doesn’t tell you *why* groups differ. You need background knowledge (e.g., how data was collected).  
     - **Name the concepts:** "This reversal is called **Simpson’s paradox**. The hidden factor (severity/season) is a **confounder**."  

  ---

  ### **What Predictably Goes Wrong & How to Handle It**  
  1. **First-round confusion:**  
     - *Issue:* SMs might ignore disaggregated data and copy BOs’ choice. BOs might demand SM data.  
     - *Fix:* Stress role constraints: *"BOs: You don’t have shop details. SMs: You must assign per shop."* Walk around to enforce rules.  

  2. **Rounding errors:**  
     - *Issue:* Students might miscalculate rates (e.g., 2/3 ≈ 67% vs. 3/6=50%).  
     - *Fix:* Use fractions (2/3, 3/6) on worksheets. Recalculate together during debrief.  

  3. **Second-round frustration:**  
     - *Issue:* SMs might reuse Round 1 logic (urban=rural) despite the season hint.  
     - *Fix:* During instructions, say: *"This time, the story changes how you interpret the groups."*  

  ---

  ### **What the Activity Can’t Reproduce (Supply in Debrief)**  
  - **Confounder vs. Effect Modifier:** The activity shows a confounder (severity/season) driving the paradox, but doesn’t distinguish it from an effect modifier (where treatment effect *differs* by group). Clarify:  
    > *"In Round 1, severity modifies the treatment effect (A works better in mild, B in severe). In Round 2, seasons confound the relationship by affecting both the blend assignment and the outcome. The table looks identical, but the causal story changes."*  

  - **Cut if Short on Time:**  
    Skip Round 2’s pair discussion (jump to commit/score). Focus debrief on Round 1’s admin/clinician conflict, then verbally describe Round 2’s twist.  

  This activity makes Simpson’s paradox visceral—students *feel* the tension between aggregate and contextual decisions and learn that data alone doesn’t resolve ambiguity. The coffee shop scenario is mundane yet fresh, avoiding overused examples while delivering your pedagogical goals.
