  For those who don’t know me, I’m the brother who went off to college and came back… different. Eating stuff out of a bag, apparently. But that’s not why we’re here. We’re here for [Brother's Name].

  [Brother's Name], you and Dad built something real on this piece of land. It’s more than dirt and fences; it’s lifetimes of work. I remember you out here as kids, shadowing Dad, soaking it up. You weren’t just playing farm. You were learning the weight of it – the early mornings that turn into late nights, the way the weather isn’t just small talk but the boss you answer to. Pulling calves in a blizzard isn’t romantic. Watching a drought steal a season isn’t poetry. It’s grit. It’s showing up.

  You chose this life. You chose the responsibility of the herd, the cycles of the hayfield, the constant tending this place demands. You chose to take it on from Dad, to keep it running, to build your future here with [Partner's Name]. That choice takes a deep kind of courage and commitment I truly admire. It’s a commitment to place, to family, to a way of living that’s demanding and honest in a way few things are.

  We see this land differently, you and I. We always have. We know what it costs to keep any piece of earth working. We know life feeds on life, full stop. We’ve just drawn our lines in different soil. That’s okay. What matters isn’t that we see it the same way. What matters is that we both see *you*.

  We see your dedication to this place Dad entrusted to you. We see your partnership with [Partner's Name], building your life together right here. We see the future you’re making, rooted deep in this ground you know so well.

  So let’s raise our glasses. Not to easy answers or pretending differences don’t exist. But to you, [Brother's Name]. To your strength, your honesty, your unwavering commitment. And to you, [Partner's Name], for joining him on this ground. May your life together here be strong, resilient, and filled with the kind of deep, earned joy this land knows how to give. To the newlyweds!
