prompt: |-
  I am assembling a graduate seminar on explanation and reduction, and I have concluded that the vocabulary I most want to teach is currently unusable as an instrument, because nobody can say what would count as applying it correctly. I mean Dennett's contrast, from *Darwin's Dangerous Idea* (1995), between cranes and skyhooks, and between good and greedy reductionism. He glosses the failure of greedy reductionism as the attempt to "skip whole layers or levels of theory in their rush to fasten everything securely and neatly to the foundation," and he summarises the contrast as follows: "Good reductionists suppose that all Design can be explained without skyhooks; greedy reductionists suppose it can all be explained without cranes." As far as I can see, both formulations tell you what a verdict sounds like rather than what makes it true, and the terms have since become polemical weapons wielded in both directions by partisans of and against reduction.

  So before I put any candidate analysis in front of students, I want the specification. Take the target theory to be this: a criterion, statable in advance of any particular case and operable by someone who does not already know how the case should come out, which sorts proposed explanatory posits into cranes (legitimate, level-building explanations) and skyhooks (posits that smuggle in the explanandum from outside the natural order), and which sorts reductionist programmes into good and greedy. The purpose is prospective adjudication of live proposals, not retrospective congratulation.

  Write the desiderata such a criterion must satisfy, with the case or consideration behind each. At minimum I want it to handle: Mendelian factors and vitalist entelechy as they stood in 1910, when both were placeholder posits and only one paid off; universality explanations of the renormalization-group variety, where deliberately ignoring lower-level detail is what makes the explanation good; a brute low-entropy initial condition for the universe, which looks either like a skyhook or like the only honest stopping point available; the strategy of explaining intelligence by decomposing an intelligent homunculus into stupider ones; a posited sui generis higher-level causal power, and the exclusion-style argument that denies it; and an innate structured endowment posited to explain the speed of acquisition.

  Then tell me, for each desideratum, whether it is non-negotiable or a preference of one camp, and say whose. I want the requirements that key on symmetry (the criterion must be able to convict anti-reductionists of skyhooks as readily as reductionists of skipping cranes), on prospectivity, on non-question-begging, on the difference between skipping a level and eliminating one, on gradability, on the way the verdict seems to shift with the explanandum a posit is offered for, and on the need for legitimate stopping points if cranes cannot stack forever. Flag any subset you believe cannot be jointly satisfied; my own suspicion is that symmetry, prospectivity, and non-question-begging cannot all be had at once, and if that is right, it is the main result rather than a footnote, since it would show the distinction is regulative rather than criterial. Finally, say which single requirement excludes the most candidates, and score four contenders against the list — mechanistic decomposability; unconstrainedness (a posit is a skyhook iff nothing independent of its target phenomenon constrains it); predictive consilience; and circularity (a posit is a skyhook iff it performs the very work the theory was introduced to explain).

  Keep the weight on the requirements and their motivating cases rather than on the scoring, and give me no references or reading list — I want the analysis, not the bibliography.
reasoning: |-
  Hmm, the user is assembling a graduate seminar on explanation and reduction and needs help with Dennett's crane/skyhook distinction from Darwin's Dangerous Idea. They've found that while the terms are widely used, there's no clear criterion for applying them correctly. They want a set of desiderata for such a criterion that can prospectively adjudicate between legitimate cranes and illegitimate skyhooks.

  The user has provided several specific cases that any criterion must handle: Mendelian factors vs vitalist entelechy in 1910, renormalization-group universality explanations, the low-entropy initial condition of the universe, homuncular decomposition in intelligence explanations, sui generis higher-level causal powers, and innate structured endowment for language acquisition. They also want the desiderata to address symmetry, prospectivity, non-question-begging, level-skipping vs elimination, gradability, explanandum sensitivity, and the need for stopping points.

  I need to create a comprehensive list of desiderata that meet these requirements. Each desideratum should be clearly stated with its motivation (the case or consideration behind it), and I need to indicate whether it's non-negotiable or represents a preference of one camp. I should also identify any potential conflicts between desiderata, particularly whether symmetry, prospectivity, and non-question-begging can be simultaneously satisfied.

  For the desiderata, I'll organize them with clear statements and motivations. Key ones will include: symmetry (must convict both anti-reductionists and reductionists equally), prospectivity (usable before knowing outcomes), non-question-begging (avoids presupposing contested metaphysical positions), level-skipping vs elimination (distinguishes omission vs justified exclusion), gradability (cranes/skyhooks exist on a spectrum), explanandum sensitivity (role-dependent evaluation), and stopping points (legitimate halts in reduction).

  I'll note that symmetry, prospectivity, and non-question-begging likely can't all be satisfied simultaneously - this would be a significant finding showing the distinction is regulative rather than criterial. For candidate criteria, I'll evaluate mechanistic decomposability, unconstrainedness, predictive consilience, and circularity against the desiderata, noting which requirement excludes the most candidates.

  The analysis will be structured with desiderata first, followed by impossibility claims, and finally candidate scoring - keeping the focus on the requirements and their motivations as requested.
answer: |-
  Here is a specification of desiderata for a prospective criterion distinguishing cranes from skyhooks and good from greedy reductionism, derived from your cases and constraints. Each desideratum includes its motivation and negotiation status.

  ### Desiderata for the Criterion

  1.  **Symmetry of Application (Non-Negotiable)**
      *   **Statement:** The criterion must be able to identify illegitimate "skyhook" explanations proposed by *anti-reductionists* (e.g., vitalist entelechy, sui generis causal powers) as readily as it identifies illegitimate "greedy" level-skipping by *reductionists*.
      *   **Motivation:** Dennett's distinction is explicitly not just a weapon against anti-reductionism; he criticizes greedy reductionism equally. The case of vitalist entelechy (anti-reductionist skyhook) vs. Mendelian factors (crane) vs. a hypothetical greedy reductionist trying to explain heredity directly via atomic physics in 1910 illustrates this need. Without symmetry, the distinction collapses into partisan rhetoric.
      *   **Negotiation:** Non-negotiable for the distinction to function as Dennett intends.

  2.  **Prospectivity (Non-Negotiable)**
      *   **Statement:** The criterion must be applicable *before* the ultimate success or failure of the explanatory posit or reductionist program is known. It must guide evaluation of *live proposals*.
      *   **Motivation:** The core problem you identify. The 1910 case is paradigmatic: both Mendelian factors and vitalism were placeholders; only hindsight reveals one as a crane and the other as a skyhook. A criterion relying on historical outcome is useless for adjudicating *current* debates (e.g., innate structured endowment, novel higher-level powers).
      *   **Negotiation:** Non-negotiable for the criterion's intended purpose.

  3.  **Non-Question-Begging (Non-Negotiable)**
      *   **Statement:** The criterion cannot presuppose the truth or falsity of contested metaphysical or ontological claims relevant to the explanation/reduction debate (e.g., the reality of emergent causal powers, the completeness of physics, the nature of causation). It must be operational based on features of the *explanatory strategy* or *posit* itself.
      *   **Motivation:** To avoid circularity. Arguments about sui generis causal powers vs. causal exclusion, or whether the low-entropy initial condition is a legitimate stopping point or an illegitimate skyhook, often hinge precisely on contested metaphysical assumptions. A criterion must adjudicate *between* these views, not presuppose one. Using "smuggling in from outside the natural order" risks begging the question against dualism or theism.
      *   **Negotiation:** Non-negotiable for objective adjudication.

  4.  **Distinguishes Skipping from Eliminating (Non-Negotiable)**
      *   **Statement:** The criterion must differentiate between illegitimately *skipping* a level of explanation that is necessary for a complete account, and legitimately *eliminating* or showing the dispensability of a level (or demonstrating that a level is merely descriptive, not explanatory).
      *   **Motivation:** Renormalization group universality explanations are the key case. Here, deliberately *ignoring* lower-level micro-details is essential for explaining universal macro-behavior; the micro-level isn't *skipped* illegitimately because it's shown to be *irrelevant* for that specific explanandum. Greedy reductionism skips levels that *are* relevant. The homuncular decomposition strategy aims to *eliminate* the need for an intelligent homunculus by explaining its work away via stupider parts.
      *   **Negotiation:** Non-negotiable. Failure here mislabels good explanations (RG) as greedy and misunderstands successful elimination (homuncular).

  5.  **Gradability (Preference - Reductionist Camp)**
      *   **Statement:** The criterion should acknowledge degrees of "crane-ness" and "skyhook-ness" or "greediness," rather than delivering only binary verdicts.
      *   **Motivation:** Explanatory posits and programs often have mixed features. A partially constrained innate endowment might be less of a skyhook than pure vitalism. Skipping one intermediate level might be less greedy than skipping three. Anti-reductionists often see this as conceding too much; reductionists see it as reflecting scientific nuance.
      *   **Negotiation:** Preference. Anti-reductionists might prefer sharper distinctions to protect autonomy, while reductionists see value in granularity.

  6.  **Explanandum Sensitivity (Non-Negotiable)**
      *   **Statement:** The status of a posit (crane/skyhook) or reductionist strategy (good/greedy) must be evaluated relative to the *specific explanandum* it is offered for.
      *   **Motivation:** Renormalization group is the prime example: ignoring micro-details is legitimate *for explaining universality*, but likely greedy if the explanandum *was* specific micro-behavior. A homunculus is a skyhook if offered to explain intelligence *simpliciter*, but might be a legitimate crane if offered as a temporary placeholder *within* a decomposition strategy aiming to eliminate it. The low-entropy initial condition might be a legitimate stopping point *for explaining the arrow of time*, but look skyhook-ish if demanded as the explanation *for complex structures*.
      *   **Negotiation:** Non-negotiable. The same posit/strategy can be good or bad depending on the job it's meant to do.

  7.  **Accommodates Legitimate Stopping Points (Preference - Anti-Reductionist Camp, but Necessary for Completeness)**
      *   **Statement:** The criterion must allow for explanations or theoretical levels that are justifiably not further reduced *at a given stage of inquiry*, without branding them as skyhooks. This includes recognizing fundamental laws/conditions or irreducible higher-level patterns.
      *   **Motivation:** The low-entropy initial condition is the critical test case. Is it the only honest stopping point (a fundamental crane-like posit) or an illegitimate skyhook? Similarly, universality explanations *stop* at a macro-level pattern, showing lower levels are irrelevant *for that pattern*. Anti-reductionists emphasize the need for such stopping points; reductionists argue they are often temporary. A criterion must handle this tension prospectively.
      *   **Negotiation:** Preference leaning towards necessity. Anti-reductionists insist on this; reductionists might see it as potentially masking unresolved reduction. The criterion *must* allow for the *possibility* to avoid branding fundamental physics as skyhooks.

  ### Impossibility Claim

  *   **Symmetry, Prospectivity, and Non-Question-Begging cannot be jointly satisfied.** This is the core result.
      *   **Why:** Prospectivity requires judging without knowing outcomes. Non-question-begging requires avoiding contested metaphysics. Symmetry requires impartial application. However, distinguishing a legitimate "stopping point" (potentially a crane, like the initial condition) from an illegitimate "skyhook" (like vitalism) prospectively, without relying on future success/failure (prospectivity) or presupposing what counts as "inside the natural order" (non-question-begging), is likely impossible. The judgment inevitably relies on background assumptions about the shape of explanation or nature of reality that one side contests, violating non-question-begging, or becomes arbitrary. Hindsight (violating prospectivity) resolves the ambiguity. This strongly suggests the crane/skyhook distinction functions as a **regulative ideal** (urging explanation via natural, stepwise mechanisms) rather than a **criterial rule**.

  ### Most Exclusionary Requirement

  *   **Non-Question-Begging** excludes the most candidate criteria. It demands neutrality in the face of profound metaphysical disagreement, which is extremely difficult for any operational criterion to achieve without becoming vacuous or circular.

  ### Scoring Candidate Criteria Against Desiderata

  1.  **Mechanistic Decomposability (MD):** Posit is a crane if it can be decomposed into interacting lower-level mechanical parts; otherwise, suspect skyhook. Reduction is good if it proceeds stepwise via mechanistic decomposition; greedy if it ignores necessary mechanistic levels.
      *   **Symmetry:** Fails. Easily convicts anti-reductionist skyhooks (e.g., vitalism isn't decomposable), but struggles to convict greedy reductionists who skip mechanistic levels (e.g., what constitutes "necessary"?). Reductionist bias.
      *   **Prospectivity:** Moderate. Can be applied to proposed decompositions, but success of future decomposition is unknown.
      *   **Non-Question-Begging:** Fails. Presupposes mechanistic metaphysics (contested by process/dualist views) and that explanation *must* be mechanistic decomposition. Begs the question against non-mechanistic explanations (e.g., RG universality, fundamental laws).
      *   **Skipping vs Eliminating:** Good on homuncular decomposition (elimination). Fails on RG universality (deliberate non-decomposition is the point; no "mechanism" to decompose). Mislabels good non-mechanistic explanation as greedy/skyhook.
      *   **Gradability:** Possible (degree of decomposability).
      *   **Explanandum Sensitivity:** Weak. Mechanistic decomposition is often treated as inherently explanatory, regardless of explanandum.
      *   **Stopping Points:** Poor. Struggles with fundamental posits (initial condition) – are they "mechanisms"? Often forces premature or impossible decomposition.
      *   **Verdict:** Fails key requirements, especially Non-Question-Begging and Symmetry.

  2.  **Unconstrainedness (UC):** Posit is a skyhook iff nothing independent of its target phenomenon constrains it (e.g., vitalism is only constrained by needing to explain life). Crane iff independently constrained.
      *   **Symmetry:** Good. Can convict anti-reductionist skyhooks (vitalism) and greedy reductionist skyhooks (e.g., a proposed "intelligence atom" with no constraints beyond needing to explain intelligence). Reductionist *skipping* is harder to capture directly.
      *   **Prospectivity:** Good. Can assess the sources of constraint on a proposed posit prospectively (e.g., is the innate endowment constrained only by language acquisition speed/poverty of stimulus?).
      *   **Non-Question-Begging:** Moderate. Focuses on empirical constraints, avoiding some metaphysics. But "independent" constraints can be contested (e.g., are mathematical constraints "independent"? For RG, universality *is* the constraint).
      *   **Skipping vs Eliminating:** Weak. Doesn't directly address levels/skipping. RG universality might be seen as highly constrained by macro-patterns. Homuncular decomposition succeeds by adding constraints at lower levels.
      *   **Gradability:** Good (degree of constraint).
      *   **Explanandum Sensitivity:** Good. Constraints are relative to the phenomenon modeled/explained.
      *   **Stopping Points:** Good. Fundamental posits (initial condition) can be framed as having constraints from overall theory consistency/observations, not *just* the target phenomenon. Universality is constrained by scale-invariance.
      *   **Verdict:** Strongest contender, handles many cases well. Weakest on Skipping vs Eliminating and slightly on Non-Question-Begging ("independence").

  3.  **Predictive Consilience (PC):** Posit/crane explains/predicts phenomena beyond its original target domain. Skyhook only explains its target. Reduction is good if it yields new predictions across levels; greedy if it sacrifices predictive power for simplicity.
      *   **Symmetry:** Poor. Anti-reductionist skyhooks (vitalism) fail consilience. But greedy reductionist *skipping* might *increase* apparent predictive power by oversimplifying (e.g., predicting gas behavior ignoring molecular chaos), masking its flaws. Hard to convict greediness prospectively.
      *   **Prospectivity:** Weak. True consilience often emerges later. Prospectively, one argues *potential* for consilience, which is speculative.
      *   **Non-Question-Begging:** Moderate. Focuses on empirical success. But defining "domain" can be tricky and potentially question-begging.
      *   **Skipping vs Eliminating:** Weak. RG universality has high consilience (across systems). Skipped-level greedy reduction might *appear* to have consilience if the skipped level's effects are negligible in some regimes. Doesn't cleanly distinguish.
      *   **Gradability:** Good (breadth/number of predictions).
      *   **Explanandum Sensitivity:** Moderate. Consilience is inherently multi-explanandum.
      *   **Stopping Points:** Moderate. Fundamental laws/conditions often have immense consilience. But a true skyhook *might* be dressed up with auxiliary hypotheses to *seem* consilient prospectively.
      *   **Verdict:** Useful heuristic, but weak prospectively and on symmetry (convicting greediness). Overlaps with UC but less precise.

  4.  **Circularity (C):** Posit is a skyhook iff it performs the very work the theory was introduced to explain (e.g., "intelligence explains intelligence"). Crane otherwise. Reduction is greedy if it uses explanatorily circular components.
      *   **Symmetry:** Moderate. Can convict blatant anti-reductionist skyhooks (vitalism, homunculus-as-explanation). Harder to convict greedy reductionist *skipping* (the skipped level isn't necessarily circular, just omitted). Reductionist *posits* could be circular ("consciousness quark").
      *   **Prospectivity:** Good. Can identify blatantly circular definitions/proposals immediately.
      *   **Non-Question-Begging:** Good. Circularity is a logical feature of the explanation itself.
      *   **Skipping vs Eliminating:** Poor. Doesn't address levels/skipping at all. RG universality isn't circular. Homuncular decomposition *avoids* circularity by eliminating the homunculus.
      *   **Gradability:** Binary. Something is either blatantly circular or not; subtle forms hard to catch.
      *   **Explanandum Sensitivity:** Good. Circularity is defined relative to the explanandum.
      *   **Stopping Points:** Poor. Fundamental posits (initial condition) aren't circular. Doesn't help assess them.
      *   **Verdict:** Catches only the most egregious skyhooks (blatant homuncular, vitalist "life force"). Useless for level-skipping, RG, initial condition, subtle cases. Necessary but insufficient.

  ### Summary
  The desiderata expose the tension inherent in Dennett's distinction, particularly the likely impossibility of satisfying Symmetry, Prospectivity, and Non-Question-Begging simultaneously. This points to the regulative role of the crane/skyhook ideal. Among the candidates, **Unconstrainedness (UC)** fares best overall, particularly on Symmetry, Prospectivity, and Handling Stopping Points, though it struggles slightly with Skipping vs. Eliminating and the precise meaning of "independent." **Non-Question-Begging** remains the most stringent and exclusionary requirement. The analysis confirms your suspicion that a crisp, prospective, non-question-begging, symmetrical criterion is probably unattainable, shifting the pedagogical focus towards understanding the *regulative function* of the distinction within complex explanatory practices.
