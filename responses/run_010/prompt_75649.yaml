prompt: |-
  I am the dean of students at a secondary school that hosts roughly forty exchange students, aged sixteen to seventeen, for a ten-month academic year. They live with local host families and take classes alongside local students. About eight times a term my office receives a complaint from a host parent, a local teacher, or a neighbor concerning a student's failure to observe some ordinary local practice: where to stand in a queue, whether to leave money at a restaurant, whether to cross against a red signal on an empty street, how to receive an object from an elder, which seat or doorway to use, whether to eat while walking. Less often the complaint runs the other direction, with a student objecting to being expected to do something at all.

  Every case terminates in a written response that the host family and the student will both read, plus an entry in the student's file, and about two placements a year are genuinely at risk of ending. I have thirty minutes per case. The people who would run the procedure — myself and two teachers who cover for me — have no training in philosophy or law. Our present responses fail in both directions: to the family they read as a school excusing rudeness on the grounds that it happens elsewhere, and to the student they read as the enforcement of local custom under threat of a bad file entry.

  We have been using an informal three-question test: was anyone harmed, could the student reasonably have known the rule, and is the rule the sort of thing reasonable people disagree about. I cannot defend its outputs. It tells me that a student who left a large tip at a small family restaurant did nothing wrong because nobody lost anything, even though the owner came to the school to say the student had treated his waiters as beggars. It also tells me that a student briefed on a norm during orientation is thereby bound by it, which makes the orientation itself the source of the obligation.

  Please write a decision procedure my office can actually run: the questions asked in order, what counts as a sufficient answer to each, the small set of terminal outcomes it can reach (no obligation and the complaint is answered as such; obligation with excuse; obligation to comply; comply while registering an objection privately; decline to comply; refer to me), and the points at which it must hand the decision to a person because what remains is a question of values rather than fact.

  The procedure has to draw, in language a teacher can use with a sixteen-year-old or a host parent, at least the following distinctions, and I want you to tell me explicitly which of them must survive the simplification and which may be collapsed for lay use: norms whose force depends on a structure of mutual assurance, so that one person's opting out changes what others can count on; norms that bind because others relied on expectations the visitor themselves invited; norms that bind only through what non-compliance expresses to onlookers; and norms that are not moral in any sense but markers of local standing. For each kind it must output whether a student present for ten months is unbound, bound but excusable, or bound to the same degree as a local, since the wording of my letter differs sharply depending on which applies. It needs a step deciding whether a norm is one that binds members only — religious observance, forms of address within a family, criticism of the host community from inside — and whether ten months of residence makes a student a member for that purpose. It needs a step deciding whether to go by the rationale locals give for a norm or by what the norm observably does, including cases where the stated reason is plainly not the operative one. And it needs a branch for when compliance would require the student to do something they take to be wrong.

  Two half-formed ideas of my own that I want either built in or demolished. First, norms that seem to collapse if a single person opts out appear to bind an individual student far more tightly than norms that only degrade once many people opt out, which would appear to bind mainly those already inside the practice; I cannot tell whether that distinction is doing real work or merely restating whether anyone noticed. Second, in almost every case that reaches me, compliance is invisible and non-compliance is conspicuous, and I suspect this is doing more work in the complaints than any question of harm.

  Apply the procedure to three cases: a student who crosses a pedestrian signal at eleven at night on an empty street with three friends, is seen by a neighbor, and is reported to us by the host mother as a serious matter, though the student says they would not have stepped out had a car been coming; the restaurant tip described above, where the student's home practice makes withholding the tip the insult and leaving it the courtesy; and a student who, at a gathering of her host family, is expected to receive a cup from the grandmother with both hands and a slight bow and declines the gesture, explaining that in her upbringing that posture is reserved for prayer and that performing it toward a person would be something she cannot do sincerely, while the family says the grandmother has been insulted. One of these three must produce a result my office will resist. Tell me which and why without softening it; I would rather have a procedure that says the unwelcome thing than one that flatters us.

  Then give me the honest part: what will predictably go wrong the first three times we run it; which single question carries most of the weight and is least reliable; how the procedure can be turned into an instrument for enforcing local hierarchy against a teenager who has no standing to object, and what safeguard against that can actually be written in; and what it cannot settle at all. Finish with a one-page version for students arriving in August, and the two or three sentences I can say to a student who insists that nobody was hurt without implying that their moral sense is naive.
reasoning: |-
  Hmm, this is a complex and thoughtful request from a dean of students dealing with cultural friction in an exchange program. The user has clearly analyzed the problem deeply and needs a practical decision framework that respects both cultural sensitivity and administrative realities.

  The core tension here is between cultural relativism and necessary adaptation. The dean's existing three-question test fails because it can't handle:
  - Symbolic harm (like the tipping incident where economic logic clashes with cultural meaning)
  - The binding power of prior notification
  - Distinctions between moral obligations and social conventions

  What they need is a procedure that can differentiate between:
  1. Coordination norms (like queueing)
  2. Reliance-based norms (where others act based on expected behavior)
  3. Expressive norms (where actions carry symbolic meaning)
  4. Status-marking norms (purely local social codes)

  Key challenges I must address:
  - The 30-minute time constraint
  - Staff without philosophical training
  - Avoiding both "cultural excuse" and "local tyranny" perceptions
  - Handling cases where compliance feels morally wrong to the student

  The dean's half-formed ideas are insightful - especially about conspicuous non-compliance doing more work than actual harm. This should be incorporated, not demolished. The visibility factor often drives complaints more than the act itself.

  For the test cases:
  1. Jaywalking at night - Low actual risk but high visibility. Should fall under "local convention excusable upon explanation"
  2. Tipping incident - Classic expressive norm violation. The harm is dignitary, not economic
  3. Cup refusal - Deep value conflict. Student's sincere objection must override local expectation

  The hardest output will be the cup case - it'll force the school to side with the student against the host family, which administrators may resist. But the procedure must allow this when core values conflict.

  Biggest risks when implementing:
  - Teachers oversimplifying "expressive harm"
  - Host families weaponizing "reliance expectations"
  - Students misusing "sincere objection"

  The safeguard must be concrete - like requiring two staff members to validate a "sincere objection" claim.

  For the student handout: Need to reframe "nobody hurt" arguments by distinguishing tangible harm from relational harm, without condescending. Something like: "Sometimes actions speak in ways we don't intend, and part of cultural learning is understanding what our actions say here."

  The procedure should flow through clear stages:
  1. Membership test (is this a "members-only" norm?)
  2. Harm assessment (tangible vs expressive)
  3. Visibility evaluation
  4. Sincerity check for objections

  Terminal decisions must include options like "comply while privately objecting" - crucial for navigational compliance.

  Most weight rests on the "expressive harm" determination, which is also the most subjective. That's why it needs examples in the training materials.
answer: |-
  Here is a decision procedure designed for speed, clarity, and ethical defensibility. It prioritizes **mutual respect** over cultural relativism or local absolutism, with explicit safeguards against hierarchy enforcement. The core philosophy: **Exchange students are guests learning cultural navigation, not moral subordinates.**

  **Key Principles Embedded:**
  1.  **Harm includes dignitary/relational harm** (insult, broken trust) — not just physical/financial.
  2.  **Knowledge ≠ Obligation.** Orientation informs, but doesn't automatically bind.
  3.  **Ten months = Partial Membership.** Students owe good-faith effort to integrate *reasonable* norms but retain core moral autonomy.
  4.  **Compliance Visibility Matters.** Conspicuous non-compliance often drives complaints more than the act itself.

  **Decision Procedure: (25 mins max per case)**
  **Personnel:** Dean or designated teacher (referred to as "Evaluator").

  **Input:** Written complaint + Student's written response (gathered quickly via email/form).

  **Output:** One terminal outcome (dictates letter/file entry wording).

  **Terminal Outcomes:**
  1.  **No Obligation:** Complaint resolved; no expectation for student to adopt/defend practice. (Letter: Explains cultural difference neutrally).
  2.  **Obligation with Excuse:** Student should generally follow norm now, but past breach is understandable/forgiven. (Letter: Explains norm clearly, affirms student's learning process, asks host/community for patience).
  3.  **Obligation to Comply:** Student expected to follow norm consistently. Past breach noted. (Letter: Clearly states expectation, explains *why* it matters here, offers student support).
  4.  **Comply While Registering Objection Privately:** Student must follow norm publicly to avoid harm/offense but may discuss disagreement privately with Dean/host. (Letter: Confirms student will comply publicly, acknowledges private objection respectfully, explains necessity).
  5.  **Decline to Comply:** Student not required to follow norm due to core value conflict. (Letter: Explains *why* exemption is granted, mitigates fallout for host/community, affirms student's good standing otherwise). *Use Sparingly*.
  6.  **Refer to Dean:** Values conflict too deep; needs human judgment beyond procedure. (Triggers 30-min Dean meeting).

  **Procedure Flow & Questions (Sequential):**

  1.  **MEMBERSHIP CHECK (3 mins)**
      *   *Question:* "Is this norm primarily about membership in a specific, bounded group (e.g., family rituals, religious observance, insider political critique) that a 10-month visitor isn't reasonably expected to join fully?"
      *   *Sufficient Answer:* Yes - If norm is deeply tied to group identity not expected of guests (e.g., bowing *within* the family, taking communion). / No - If norm governs general public or host-guest interaction (e.g., queueing, public manners).
      *   *Outcome:* **Yes → Outcome 1 (No Obligation).** / **No → Proceed to Q2.**

  2.  **TANGIBLE HARM CHECK (3 mins)**
      *   *Question:* "Did the student's action cause clear, direct physical harm, significant financial loss, property damage, or create an immediate safety risk?"
      *   *Sufficient Answer:* Yes - Obvious harm (e.g., shoving in queue caused fall, theft). / No - No such harm evident.
      *   *Outcome:* **Yes → Outcome 3 (Obligation to Comply).** *Safety/harm trumps.* / **No → Proceed to Q3.**

  3.  **VISIBILITY & EXPRESSIVE MEANING CHECK (6 mins - *Critical Weight*)**
      *   *Question:* "Was the action (or non-compliance) *conspicuous* to others? What message would a reasonable local likely interpret from the student's action *in this context*, regardless of the student's intent? (e.g., leaving money = charity? rejecting cup = disrespect?)"
      *   *Sufficient Answer:* Describe the likely interpreted message based on local understanding (e.g., "Leaving tip interpreted as pitying waitstaff," "Not bowing interpreted as rejecting elder's status," "Jaywalking interpreted as flouting community rules").
      *   *Analysis:* Did the action likely cause **relational harm** (hurt feelings, damaged trust, perceived insult) due to its expressive meaning?
      *   *Outcome:* **No Conspicuousness/No Relational Harm → Proceed to Q4.** / **Relational Harm Likely → Proceed to Q5.**

  4.  **COORDINATION/RELIANCE CHECK (4 mins)**
      *   *Question:* "Does following this norm help people coordinate smoothly (e.g., queue order, traffic flow)? Or did others reasonably rely on the student following it, based on the student's prior actions or general promises (e.g., agreeing to host family rules)?" (Collapses Mutual Assurance & Reliance norms).
      *   *Sufficient Answer:* Yes - Action disrupted coordination (e.g., chaotic queue) or broke reasonable reliance (e.g., agreed curfew broken). / No - Action was isolated, didn't disrupt systems, no specific reliance invited.
      *   *Outcome:* **Yes → Outcome 3 (Obligation to Comply).** / **No → Outcome 1 (No Obligation).**

  5.  **KNOWLEDGE & REASONABLENESS CHECK (4 mins)**
      *   *Question:* "Could the student *reasonably* have been expected to know this norm *before* acting? Consider: Was it in orientation? Common in many cultures? Obvious context clues? How complex/obscure is it?"
      *   *Sufficient Answer:* Yes - Clearly covered (orientation doc) or very common/obvious (e.g., basic table manners). / No - Highly specific, subtle, or not covered.
      *   *Outcome:* **Knew or Should Have Known → Proceed to Q6.** / **Truly Unknowable → Outcome 2 (Obligation with Excuse).**

  6.  **SINCERE OBJECTION CHECK (5 mins - *Values Judgment Point*)**
      *   *Question:* "Does the student articulate a *sincere, deeply held* belief or value (not mere preference) that complying would violate? Is this belief core to their identity/upbringing (e.g., religious prohibition, fundamental moral principle)?"
      *   *Sufficient Answer:* Evaluator makes a judgment call: Does the objection seem deeply rooted and genuine (e.g., "bowing feels like idolatry") or more like discomfort/disagreement (e.g., "tipping is inefficient")?
      *   *Outcome:*
          *   **Sincere Core Conflict → Proceed to Q7.**
          *   **Not Sincere/Core → Outcome 3 (Obligation to Comply).** (Applies even if unknowable initially - they know *now*).

  7.  **ACCOMMODATION CHECK (Values Judgment - Refer if Unsure)**
      *   *Question:* "Can the student comply *without* violating their core belief? Can a minor, respectful accommodation be found? Does forcing compliance cause *greater* harm than the relational harm avoided?"
      *   *Sufficient Answer:* Evaluator brainstorms/assesses options (e.g., receive cup with two hands *without* bow? Verbally thank grandmother effusively?).
      *   *Outcome:*
          *   **Accommodation Possible → Outcome 4 (Comply While Registering Objection Privately).** (Student uses accommodation).
          *   **No Viable Accommodation → Outcome 5 (Decline to Comply)** OR **Refer to Dean** if conflict is severe or precedent-setting.

  **Key Distinctions Simplified/Collapsed for Lay Use:**
  *   **MUST Survive:** Expressive Meaning (Collapsed into Q3 - "What message was sent?"). *This is crucial for dignitary harm.*
  *   **MUST Survive:** Sincere Core Objection (Q6). *Protects student autonomy.*
  *   **Collapsed:** Mutual Assurance & Reliance norms → Q4 (Coordination/Reliance). *The practical effect (disruption) matters more than the philosophical mechanism.*
  *   **Collapsed:** Status-Markers → Handled by Q1 (Membership) and Q3 (Expressive Meaning). *If it's purely a local status marker not tied to harm/expression, it likely falls under "No Obligation".*
  *   **Rationale vs. Function:** Q3 uses the *observable function/interpretation* (what the norm *does*), not the stated rationale. (e.g., Tip = Expresses gratitude/status; locals' stated rationale "paying for service" may not hold if wages are fair).

  **Application to Cases:**

  1.  **Jaywalking (Empty Street, Night, Seen):**
      *   Q1 (Membership): No. (Public norm).
      *   Q2 (Tangible Harm): No. (No car, no safety risk).
      *   Q3 (Visibility/Expression): **YES.** Conspicuous. Message: "Rules don't apply to me/I disrespect community standards." Relational harm to host/community likely.
      *   Q4 (Coordination/Reliance): Maybe, but weak at night/empty. Not primary.
      *   Q5 (Knowledge): Likely Yes. Basic traffic norms, covered in orientation.
      *   Q6 (Sincere Objection): Unlikely (safety concern addressed by context).
      *   **Outcome: 3 (Obligation to Comply).** *Letter explains why the *visible flouting* matters for community trust and host standing, even if safe. Student expected to follow signals.*

  2.  **Restaurant Tip (Large Tip as Courtesy, Seen as Charity):**
      *   Q1: No.
      *   Q2: No tangible harm (owner gained money).
      *   Q3: **YES.** Conspicuous. Message interpreted locally: "I view your staff as pitiable/needing charity." Significant relational harm (insult to staff/owner).
      *   Q4: No (Not coordination/reliance).
      *   Q5: **Unknowable.** Orientation likely covered tipping *amounts* or "leaving gratuity," but not the *cultural meaning reversal* (large tip = insult). Unreasonable to expect student to intuit this specific expressive meaning.
      *   **Outcome: 2 (Obligation with Excuse).** *Letter explains the *expressive harm* caused unintentionally, clarifies local meaning, affirms student's good intent, asks host/restaurant for understanding as student learns. Student now knows.*

  3.  **Receiving Cup (Refuses Gesture as Sacred, Insult Perceived):**
      *   Q1: **YES.** Deeply tied to *family* dynamics and elder respect rituals. *But*, student is quasi-member of host family. **Proceed cautiously.** (Q1 doesn't auto-resolve).
      *   Q2: No.
      *   Q3: **YES.** Highly conspicuous within family. Message interpreted: "I reject your grandmother's status/your family's values." Severe relational harm within host unit.
      *   Q4: No.
      *   Q5: Possibly covered in family intro, but gesture's depth may not be grasped. Assume **Unknowable** for simplicity here.
      *   Q6: **YES.** Student articulates a core, sincere belief (gesture reserved for prayer, insincere/improper for person). Not mere preference.
      *   Q7 (Accommodation): **Possible?** Receive with two hands *without* bow? Verbally express profound thanks? Offer a culturally appropriate alternative gesture of respect from her culture? *If Yes → Outcome 4.* If no viable alternative exists...
      *   **Outcome Office Will Resist: 5 (Decline to Comply).** *Why Resistance?* Forces school to side with student against host family on a core family ritual, causing significant relational fallout. Letter must explain *why* the core belief exemption applies, express regret for the unintended insult, affirm student's respect for family, and work intensely with family to repair relationship. **This outcome is necessary** to respect fundamental conscience but will be administratively difficult.

  **Honest Assessment:**

  *   **What Will Go Wrong (First 3 Times):**
      1.  **Misjudging Expressive Meaning (Q3):** Staff might default to "no tangible harm = no problem" (e.g., initially dismissing the tip complaint). Requires training on interpreting relational harm.
      2.  **Over- or Under-using "Sincere Objection" (Q6):** Staff might reject genuine objections as discomfort, or accept weak ones to avoid conflict. Hard to gauge "sincerity" quickly.
      3.  **Poor Accommodation Ideas (Q7):** Staff might suggest clumsy or insufficient accommodations, worsening the conflict (e.g., "just bow quickly").

  *   **Heaviest/Least Reliable Question:** **Q3 (Visibility & Expressive Meaning).** It carries the most weight (driving outcomes towards obligation) and is highly subjective. Reliability depends entirely on the Evaluator's cultural sensitivity and ability to discern local interpretation beyond stated complaints. Training with examples is vital.

  *   **How It Can Be Weaponized:** A biased Evaluator could:
      *   *Inflate Expressive Harm (Q3):* Construing minor acts as major insults to enforce conformity.
      *   *Dismiss Sincere Objections (Q6):* Labeling genuine beliefs as mere preferences or disrespect.
      *   *Deny Accommodations (Q7):* Insisting on full compliance even when alternatives exist.
      *   *Exploit "Coordination/Reliance" (Q4):* Applying it too broadly to minor infractions.
      *   **Safeguard:** **Mandatory Second Reviewer for Outcomes 4 or 5.** Another staff member (not involved in Q3/Q6 judgment) must review the rationale for these outcomes *before* sending the letter. Creates accountability.

  *   **What It Cannot Settle:**
      *   Deep, intractable value conflicts where no accommodation exists *and* the relational harm is catastrophic (requires mediation/broader intervention).
      *   Norms where the "local interpretation" is genuinely contested *within* the community.
      *   Determining the "true" function of a norm if it's highly opaque or disputed.
      *   Punishing malice disguised as cultural difference (needs separate conduct process).

  **For Students (One-Page Handout - "Navigating Cultural Norms")**

  **Welcome! Living in a new culture is exciting and challenging. Part of your experience involves learning local customs. This guide helps our office support you when questions or conflicts arise.**

  1.  **Learning is a Process:** You won't know every rule. Making mistakes is normal and expected. We are here to help you learn.
  2.  **Respect Goes Both Ways:** We expect you to act in good faith to learn and follow local norms that help people live together smoothly and show respect. Host families and the community are expected to be patient teachers.
  3.  **When Actions Speak:** Sometimes, an action that's fine at home means something very different here (like leaving a large tip). Even if you mean well, it might accidentally send a message you don't intend (like pity). We'll help you understand these differences.
  4.  **Your Core Beliefs Matter:** If a local expectation truly conflicts with a deep, sincere belief (like a religious practice), talk to us. We will work with you and your host family to find a respectful solution, if possible. We won't force you to violate your core values.
  5.  **If a Concern is Raised:** We'll ask for your perspective. We use a fair process considering:
      *   Was anyone actually hurt or endangered?
      *   Was your action easily seen? What message might locals think you meant?
      *   Could you reasonably have known this custom beforehand?
      *   Does following it go against something truly important to you?
  6.  **Outcomes:** Most often, we'll explain the local viewpoint and ask you to try following the custom moving forward, understanding it takes practice. Sometimes, we'll find a middle ground. Very rarely, if a custom conflicts fundamentally with your core beliefs, you may be excused from it, but we'll work hard to minimize hurt feelings.
  7.  **Goal:** To help you learn, build positive relationships, and navigate cultural differences respectfully – for everyone involved.

  **Responding to "Nobody Was Hurt":**

  "While I understand you didn't intend harm and no one was physically hurt or lost money, actions can carry powerful meanings in a specific culture. What you did was interpreted here as [briefly state the expressive harm, e.g., 'showing disrespect,' 'treating someone as less than equal']. That unintended message *did* cause hurt feelings/damaged trust for [person/group]. Part of learning this culture is understanding how actions speak differently here, even when the intention is good. Let's figure out what this action means locally and how to avoid that misunderstanding in the future."

  This response:
  *   Validates their intent.
  *   Distinguishes tangible harm from relational/expressive harm.
  *   Explains the *cultural mechanism* of harm (misinterpretation).
  *   Frames it as a learning opportunity.
  *   Avoids judging their *moral sense*, focusing on *cultural interpretation*.
