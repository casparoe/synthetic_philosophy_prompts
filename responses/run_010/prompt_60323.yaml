prompt: |-
  For eight years I have sat on the technical panel that decides which names enter our national inventory of protected taxa, and for most of that time I have been the member least at ease with what we were doing. I now want to know what principle, if any, my own voting record adds up to. Please do not recite the catalogue of species concepts at me; I have read it as carefully as anyone. What I want is reflective equilibrium performed on my verdicts: the principle or principles they commit me to, stated clause by clause, together with a candid account of the places where no principle will hold them together.

  My votes, with the reasons I gave the panel at the time:

  1. The ring of salamander populations encircling California's Central Valley: I split. The two forms that meet in the south behave as separate species where they overlap, and the existence of a continuous chain of intergrading populations joining them the long way round does not, to my mind, make the endpoints one species.
  2. Polar bears and brown bears: two species, notwithstanding fertile hybrids in the wild, recent common ancestry, and gene flow in both directions.
  3. Domestic dogs and gray wolves: one species. I cannot tell you why 2 and 3 differ, since both divergences are recent and both pairs hybridize where they meet. If anything the bears feel more obviously separate to me, and I cannot explain that except by body size and by how long we have all been used to the names.
  4. The eastern North American coyote: a lineage in its own right and a nameable one, even though it is substantially a hybrid swarm of coyote, wolf, and dog ancestry. This sits badly with 3 and I know it.
  5. Bdelloid rotifers: real species, in the hundreds, delimited by morphology and ecology and corroborated by discrete genetic clusters — in animals with no known males and no meiosis, some of which appear to acquire genes from one another without sex.
  6. Bacteria: I will not say. I voted to retain Shigella as a separate genus although it falls inside Escherichia coli at several independent places in the tree, because clinical and public-health practice requires the name; but I would not defend the claim that bacterial species are units of the same kind as those in 1 through 5.
  7. The European edible water frog: a species in its own right, although every individual is a hybrid of two other frog species and discards one parental genome in order to transmit the other.
  8. The hybrid sunflowers that originated more than once from the same two parental species, breed true, occupy habitats neither parent occupies, and are reproductively isolated from both parents without any change in chromosome number: not species, in my vote, but stabilized hybrid derivatives. I now suspect 7 and 8 are inverted with respect to one another, since the frog lineage cannot persist unless both of its parents are present alongside it and the sunflower lineages can.
  9. Two morphologically identical frog populations that never interbreed where they co-occur and are reciprocally monophyletic: two species. Two strikingly divergent colour morphs that form a single panmictic population wherever they meet: one species.
  10. A stratigraphic series of fossils within one lineage: no species boundaries may be drawn along it. Two fossil populations at the same horizon, geographically separated and diagnosable: two species. Vertical cutting is convention, horizontal cutting is discovery.
  11. Twice I have voted against all of the above because of consequences. I split a widespread amphibian so that one isolated and endangered fragment of it would become listable; and I voted against splitting a native duck whose remnant population is being absorbed by an introduced relative, on the ground that a split would hand the fisheries ministry an argument for managing the whole complex as a single abundant hybrid swarm. In both cases the biology was, so far as the panel knew, of exactly the sort I had decided the other way on other afternoons.

  What I am asking for:

  (a) State the principle, or the small set of them, that delivers as many of these verdicts as possible. For each clause, identify which of my cases motivated it and what the clause thereby rules out.

  (b) Say whether this is one criterion with epicycles, or two distinct jobs being done by a single word — a claim about what the units of evolution are, and a rule about which names an institution should maintain. If it is the latter, state the rule governing when the naming consideration may override the metaphysical one, and tell me whether 11 is a legitimate application of that rule or a betrayal of it.

  (c) Give your verdicts, with reasons, on three cases I have not listed: an island population that is diagnosable but has never had the opportunity to interbreed with its mainland relative, so that no test of reproductive isolation is available; a plant pair reciprocally monophyletic at nuclear loci but sharing chloroplast haplotypes freely; and a fungus capable of sex that nonetheless reproduces clonally in most of the populations we sample.

  (d) Tell me which of my votes has to go. I would rather lose one or two verdicts than purchase all eleven with a disjunctive monster, so set out the cost of each option.

  (e) Finally: is there any fact that could settle 3 against 4, or is the difference between them purely a matter of what I want the word to do?
reasoning: |-
  Hmm, the user is asking me to analyze their voting record on species classification decisions. They've been part of a technical panel for eight years that decides which names enter a national inventory of protected taxa, and they want to understand what principles their votes actually represent. They've provided 11 specific cases with their reasoning, and want me to extract underlying principles, identify inconsistencies, and apply the principles to new cases.

  This is a fascinating and complex request that touches on deep philosophical questions in taxonomy and evolutionary biology. The user clearly has substantial expertise - they mention having "read the catalogue of species concepts as carefully as anyone" and provide nuanced cases that challenge conventional species concepts.

  Looking at their votes, several patterns emerge:

  - They consistently prioritize operational criteria over theoretical purity (cases 1, 2, 4, 6)
  - Reproductive isolation appears important but isn't absolute (cases 1, 2, 3, 9)
  - Lineage independence is a recurring theme (cases 1, 4, 5, 7, 8)
  - Practical consequences sometimes override biology (case 6, 11)
  - They distinguish between pattern and process (cases 9, 10)

  The biggest tension seems to be between their treatment of dogs/wolves (one species) versus eastern coyotes (separate species). Both involve hybridization, but they treat them differently. The coyote case seems driven by its ecological role as a distinct lineage, while dogs/wolves are seen as domesticated variants despite similar divergence times to the bears they split.

  For the tasks they've outlined:

  (a) The core principle appears to be "independent evolutionary trajectory" with several modifiers: operational diagnosability, ecological distinctness, and practical utility. Reproductive isolation matters when it supports lineage independence but isn't required.

  (b) This is clearly two distinct jobs: identifying evolutionary units versus managing institutional naming practices. Their votes show the naming function overriding biology in cases 6 and 11. This is legitimate when taxonomy would disrupt established practice without conservation benefit.

  (c) For the new cases: 
  - Island population: Would likely treat as separate species based on diagnosability and potential independence
  - Plant pair: Would see as one species despite nuclear differences due to ongoing gene flow
  - Fungus: Would recognize multiple species based on operational clusters despite theoretical capacity for gene flow

  (d) Vote 4 (eastern coyote) is most inconsistent with their other decisions, particularly their treatment of dogs/wolves. It could be reconciled by emphasizing ecological distinctness, but requires special pleading.

  (e) The difference between 3 and 4 is primarily about what we want the word "species" to do. Both are hybrid complexes, but the coyote has become an ecological actor in its own right while dogs remain human-dependent variants. The distinction is pragmatic rather than ontological.

  The user seems to be wrestling with the inherent tension in taxonomy between describing natural patterns and creating useful categories for human purposes. Their record shows a thoughtful pragmatism, but vote 4 stands out as inconsistent with their approach elsewhere. The most coherent principle seems to be "recognize as separate those lineages that function as independent ecological and evolutionary units in nature, with allowances for practical utility."
answer: |-
  Your voting record reveals a principle I'll call **Evolutionary Independence with Practical Diagnosability (EIPD)**, centered on whether a lineage functions as an independent evolutionary unit in nature, *combined* with whether it can be reliably identified and named for conservation/practical purposes. This principle isn't a single criterion but a pragmatic framework prioritizing *functional distinctness* over strict adherence to any one species concept, while acknowledging that institutional naming needs sometimes override biology. Below is the analysis structured per your requests:

  ---

  ### (a) The Principle: Evolutionary Independence with Practical Diagnosability (EIPD)
  **Core Clause:** *A taxon warrants recognition if it demonstrates an independent evolutionary trajectory (e.g., distinct adaptation, reproductive isolation, ecological role) AND can be diagnosed consistently for practical use (e.g., conservation, medicine, ecology).*  
  - **Motivated by:** Cases 1 (salamanders: independent behavior in sympatry), 2 (bears: distinct ecology/adaptation despite hybridization), 5 (rotifers: discrete clusters despite asexuality), 7 (water frog: stable hybrid lineage with unique reproduction), 9 (frogs: reciprocal monophyly + isolation vs. panmixia).  
  - **Rules out:** Insisting on strict interbreeding (rejects BSC for 5,7), requiring monophyly alone (rejects PSC for 4,8), or ignoring hybrid origins (rejects essentialism for 4,7).  

  **Ancillary Clause 1:** *Hybrid origins do not preclude recognition if the lineage is stable, ecologically independent, and diagnosable.*  
  - **Motivated by:** Cases 4 (coyote: functional distinctness), 5 (rotifers), 7 (water frog).  
  - **Rules out:** Dismissing all hybrids as "not species" (contrasts with 8).  

  **Ancillary Clause 2:** *Practical consequences (e.g., conservation urgency, public health) may override purely biological criteria when diagnosability is maintained.*  
  - **Motivated by:** Cases 6 (*Shigella*: clinical utility), 11 (conservation outcomes).  
  - **Rules out:** Rigidly ignoring human impact (e.g., refusing splits/lumps that aid protection).  

  **Ancillary Clause 3:** *Fossils are treated as snapshots of divergence; only spatial separation (at a given time) justifies splitting.*  
  - **Motivated by:** Case 10 (vertical vs. horizontal cutting).  
  - **Rules out:** Arbitrary divisions in anagenetic series.  

  ---

  ### (b) One Criterion or Two Jobs?  
  **Verdict:** Two distinct jobs unified under EIPD:  
  1. **Evolutionary Unit Criterion:** Does the lineage act independently in evolution? (Cases 1,2,5,7,9).  
  2. **Institutional Naming Rule:** Does naming it serve practical goals without creating chaos? (Cases 4,6,11).  

  **Overriding Rule:** The naming consideration may override metaphysics when:  
  - There is a compelling human need (e.g., public health in 6, preventing extinction in 11).  
  - Diagnosability is unambiguous (e.g., *Shigella* has clear clinical markers; the endangered amphibian is isolatable).  

  **Legitimacy of Case 11:** This is a *legitimate* application. You prioritized conservation outcomes *only* when biology was ambiguous (per your note: "biology was... exactly the sort I had decided the other way"). EIPD explicitly allows institutional needs to break ties when biological evidence is equivocal. It would be a betrayal only if biology clearly supported one verdict and you ignored it.  

  ---

  ### (c) Verdicts on New Cases  
  1. **Island population (diagnosable, no interbreeding test):**  
     - **Verdict:** Split into a new species.  
     - **Reason:** Diagnosability satisfies practical needs, and spatial isolation implies independent evolution (per Clause 1). Consistent with 9 (reciprocal monophyly) and 10 (geographic separation).  

  2. **Plant pair (nuclear monophyly, chloroplast sharing):**  
     - **Verdict:** One species.  
     - **Reason:** Chloroplast gene flow indicates ongoing hybridization/contact, undermining evolutionary independence. Nuclear divergence alone is insufficient (contra 9) unless linked to functional isolation. Consistent with 3 (dogs/wolves: gene flow prevents split despite divergence).  

  3. **Clonal fungus (capable of sex, but clonal in practice):**  
     - **Verdict:** Split into multiple species if clusters are diagnosable.  
     - **Reason:** Like bdelloid rotifers (5), ecological/morphological clusters reflect independent evolution despite lack of sex. "Capable of sex" is irrelevant if unused; diagnosability is key.  

  ---

  ### (d) Which Vote Must Go?  
  **Vote 4 (Eastern coyote)** is the weakest link. It conflicts with:  
  - **Vote 3 (dogs/wolves):** Both are hybrid complexes, but you split the coyote while lumping dogs/wolves. Body size/familiarity ("feels more separate") isn't a principled distinction.  
  - **Vote 8 (sunflowers):** The sunflower hybrids are ecologically independent and persistent but rejected; the coyote is dependent on ongoing hybridization but accepted.  

  **Cost of Alternatives:**  
  - **Drop Vote 4:** Aligns with 3 and 8. Principle becomes: "Hybrids only recognized if *non-introgressing* and ecologically independent (e.g., water frog, not coyote/sunflowers)."  
  - **Drop Vote 3 (lump dogs/wolves):** Splitting dogs from wolves could be justified by anthropogenic divergence, but this weakens EIPD’s emphasis on natural independence.  
  - **Drop Vote 8 (accept sunflowers):** This creates consistency with 4/7 but contradicts your intuition that parental dependence matters (as in 7 vs. 8).  

  **Recommendation:** Drop **Vote 4**. The coyote is better seen as a hybrid swarm (like dogs/wolves) than an independent lineage. This retains coherence with minimal loss.  

  ---

  ### (e) Settling 3 (Dogs/Wolves) vs. 4 (Coyote)  
  **No factual difference** justifies the split/lump discrepancy. Both involve:  
  - Recent divergence.  
  - Hybridization/gene flow.  
  - Anthropogenic influence (dog domestication; coyote expansion into wolf habitat).  

  **The difference is pragmatic:**  
  - **Dogs/Wolves (lumped):** You prioritize historical continuity and institutional stability ("how long we’ve been used to the names"). Splitting would disrupt taxonomy without clear conservation benefit.  
  - **Coyote (split):** You prioritize its emergent ecological role as a distinct apex predator in eastern ecosystems, justifying protection.  

  **Conclusion:** The distinction lies in what you want the word "species" to *do*:  
  - For dogs/wolves, "species" maintains stability.  
  - For coyotes, "species" enables conservation of a novel, functional entity.  
  This is EIPD’s institutional rule in action—but Vote 4 remains inconsistent with Vote 3 biologically. Dropping 4 (as above) resolves this.  

  ---  
  **Final Summary:** Your principle is **Evolutionary Independence with Practical Diagnosability**, a pragmatic fusion of lineage-based criteria and institutional utility. It explains 10/11 votes cleanly; only the coyote (4) requires revision. The tension between "evolutionary unit" and "institutional tool" is inherent to taxonomy—your record reflects this honestly, with 11 being a justified override, not a betrayal.
