answer: |-
  ### Final Essay Question (90 minutes; 30 marks)

  **Question:**  
  Using **only** the following three cases—  
  (a) The abandonment of southern Maya lowland cities (c. 750–950 CE),  
  (b) The breakdown of Late Bronze Age palatial systems (c. 1200 BCE), and  
  (c) The end of the Roman Republic (c. 44 BCE–14 CE)  
  —formulate a definition of societal ‘collapse’ that:  
  - Correctly classifies (a) and (b) as collapse, and (c) as not collapse;  
  - Explains what distinguishes ‘collapse’ from mere ‘change’, addressing the objection that if population/culture persists, nothing essential was lost;  
  - Evaluates whether defining collapse structurally (e.g., via lost complexity) implicitly makes it value-laden, given complexity’s potential burdens.  

  Your definition must be generalizable beyond these cases and avoid tautology or excessive breadth.  

  ---

  ### Model Answer (Approx. 1100 words)  

  **Defining Societal Collapse: Structure, Identity, and Normativity**  

  Societal collapse is best defined as **the rapid, involuntary, and near-total disintegration of a society’s core political and economic institutions, resulting in irreversible loss of large-scale coordination capacity across multiple generations, despite population or cultural continuity**. This definition sorts our cases correctly: (a) and (b) qualify as collapse, while (c) does not. It resolves tensions around societal identity and reveals the term’s descriptive utility, though its structural focus risks normative ambiguity.  

  **Case Application**  
  - **(a) Southern Maya Lowlands (Collapse)**: Dynastic kingship and monument-building ceased abruptly. The institutional framework enabling resource redistribution, warfare, and religious authority disintegrated. Though northern centres thrived and populations persisted, the *southern political structure* never recovered its former scale or complexity. Coordination capacity (e.g., for massive irrigation or construction) was irreversibly lost in the region.  
  - **(b) Late Bronze Age Aegean (Collapse)**: Palaces—the nodes of literacy, tax collection, and international trade—were destroyed. The loss of Linear B script and redistributive economies caused four-century “systems collapse.” Though populations adapted (e.g., forming poleis), palatial-scale coordination (e.g., international tin trade) vanished irreversibly.  
  - **(c) Roman Republic (Not Collapse)**: The Republic’s institutions (Senate, assemblies) were replaced, but imperial administration expanded coordination capacity. Tax systems, roads, and armies grew more complex; literature and trade flourished. Changes were *evolutionary*: Augustus repurposed Republican forms (e.g., *princeps* title) without systemic disintegration.  

  **Collapse vs. Change: What Was Lost?**  
  Collapse denotes not demographic extinction but the **extinction of a specific institutional order**. The objection—that persistent populations imply nothing essential was lost—confuses *society as demography/culture* with *society as an operational system*. In (a) and (b), the *structure* enabling large-scale collective action (e.g., Maya monument-building, Mycenaean bulk-trade) was destroyed faster than successor systems could emerge. Continuity of people or pottery styles does not negate the rupture of the scaffolding that organized their complexity.  

  ‘Change’ (as in Rome) preserves adaptive capacity: new institutions repurpose old components (e.g., Roman legions under emperors). Collapse is a *degradation of societal agency*: post-Maya populations could not rebuild southern hydraulic systems; post-palatial Greeks could not revive writing for centuries. The loss is not of “society” but of a society’s *ability to execute complex projects at scale*. This functional distinction explains why ‘collapse’ is useful: it isolates institutional implosions from gradual evolution.  

  **Normative Ambiguity: Is Collapse Inherently “Bad”?**  
  Defining collapse structurally (e.g., lost complexity) risks value-laden assumptions. Complexity often imposes burdens: Maya peasants labored under corvée for elite monuments; Mycenaean serfs endured palatial grain quotas. Simplification *can* raise welfare—as James Scott argues, legibility projects often exploit. Yet collapse remains descriptively distinct from reform: it is *uncontrolled* simplification causing cascading failures (e.g., LBA trade collapse triggering famines).  

  The term is not intrinsically normative. Complexity loss is measurable (e.g., reduced urban hierarchy tiers, disappearing bureaucracies). But labeling this “collapse” *becomes* normative when implying decline from a “golden age.” Historically, elites suffer most (e.g., Maya kings, LBA wanax), while peasants may gain autonomy. A rigorous definition avoids moralizing by focusing on *systemic coordination capacity* rather than welfare. Still, scholars must interrogate whether framing institutional breakdown as “collapse” implicitly valorizes centralized states—a problem avoided here by emphasizing functional outcomes (irreversible loss of scale).  

  **Conclusion**  
  Societal collapse occurs when core institutions fragment irreversibly, severing large-scale coordination despite cultural survival. It is distinct from change by its speed, involuntariness, and functional degradation. While structural definitions avoid moral claims about welfare, they risk statist biases; centering *coordination capacity* mitigates this. Applied rigorously, ‘collapse’ explains why (a) and (b) represent systemic ruptures, while (c) is transformative continuity.  

  ---

  ### Marking Scheme (Total: 30 marks)  
  **An A/A+ Answer (25–30 marks) must:**  
  1. **Define collapse accurately** (6 marks):  
     - Must include *institutional disintegration*, *rapid/irreversible loss of coordination capacity*, and *persistence of population/culture*.  
     - Correctly sorts cases: collapse (a, b), not collapse (c).  
     - Avoids tautology ("collapse is when institutions collapse") and over-breadth.  
  2. **Resolve the identity problem** (8 marks):  
     - Distinguishes *institutional systems* from *demography/culture*.  
     - Explains why coordination capacity loss matters even if people/traditions persist.  
     - Argues why ‘collapse’ adds value over ‘change’ (e.g., scale, irreversibility).  
  3. **Address normativity** (6 marks):  
     - Acknowledges complexity’s costs and potential welfare gains.  
     - Separates structural description (loss of scale) from value judgments.  
     - Critiques potential elitism in defining collapse.  
  4. **Generalizability & precision** (4 marks):  
     - Definition could plausibly apply to other cases (e.g., Western Roman Empire vs. Han China).  
     - Uses precise terms (e.g., "coordination capacity," "involuntary").  
  5. **Case analysis** (6 marks):  
     - Explicitly links each case to the definition.  
     - Contrasts (c) as *transformative continuity* (vs. irreversible disintegration).  

  **A Solid Second-Class (B/B+; 15–24 marks) typically:**  
  - ⚠️ **Defines collapse by harm to populations** → Fails (b): LBA collapse lacked mass mortality.  
  - ⚠️ **Defines collapse as any regime change** → Fails (c): Roman Republic’s end was institutional evolution, not disintegration.  
  - ⚠️ **Ignores the identity problem** → Does not explain what "collapsed" if people/culture continued.  
  - ⚠️ **Neglects normativity** → Does not engage complexity’s burdens or welfare trade-offs.  
  - **Cases**: Correctly sorts cases but with weak justification (e.g., "Rome wasn’t collapse because it became an empire").  

  **Lower Marks (C or below; <15 marks):**  
  - Incorrect case sorting (e.g., calls Rome collapse).  
  - Circular/overly broad definitions.  
  - Ignores ≥1 of the three demands (definition, identity, normativity).  
  - Significant historical inaccuracies.  

  ---  
  **Rationale**: This question tests conceptual precision, philosophical engagement with identity/value, and avoidance of clichéd debates. The model answer balances structural clarity with critical reflexivity, rewarding students who see collapse as a *functional* rather than moral or demographic category.
