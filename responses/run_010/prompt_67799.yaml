prompt: |-
  I am a novelist, some four hundred pages into a third book, and I have run up against a difficulty that is less a matter of craft than of moral psychology, so I am bringing it to you rather than to my agent. Two of my characters do something I can describe vividly but cannot name. The first is a man whose marriage has been finished for years in every way a spectator could measure; he has arranged his week — the late office, the standing Thursday fixture, the habit of taking calls in the kitchen — so that he is never alone with his wife long enough for a certain question to become available to him. He does not tell himself the marriage is sound. He tells himself nothing whatever on the subject. Put the question to him directly and he will answer, and answer accurately, in the register of a man mildly surprised by it; the machinery is intact, the input has simply never arrived. My second character is a mother who has ordered her household so that no tally of hours exists to be kept: not a suppressed tally, not a tally she keeps and then discards, but no tally at all. Each individual decision that sustains the arrangement is innocent on its own terms, and she would in good faith deny having decided anything; yet the shape of the life is legible from outside, the way a moat is legible to someone who never watched it dug.

  I know the neighbourhood. I have read enough about self-deception to be wary of its standard puzzles, about how a person is supposed both to know and not to know; I have Sartre's bad faith and Orwell's doublethink in mind; and I understand that in the law there is a doctrine concerning the defendant who suspected something and chose not to look. None of these appears to be my case. In the puzzles, and in bad faith, and in doublethink, there is a belief, or a pair of beliefs, doing the work, and the difficulty is how they manage to coexist. In the legal doctrine there is a suspicion that the person declines to confirm. What my characters do is quieter: there is no false belief to be had, because the proposition never enters, and no suspicion, since suspicion would already amount to a kind of knowing. Nor are they repressing anything, if repression means material that was once present and has since been driven down; here nothing has ever been present. They manage their circumstances so that a question is never put, and in the absence of the question there is nothing for them to get wrong.

  So: does this have a name? I want the specific concept, not the general area, and I shall not be satisfied by a label alone — I want to know where its edges are. Tell me which established idea comes closest, and say precisely how my case departs from each candidate, whether by degree or by kind. If there is genuinely no concept for it, say so plainly and then coin one: define it, and give me the boundary cases — the person who has the thought once a year and dismisses it, the person who cannot entertain it because of trauma rather than arrangement, the person who has delegated the question to a spouse or an accountant, the person whose ignorance is imposed from outside rather than curated — and tell me which of those fall inside. And I would rather have your verdict than your inventory. Take a position on whether what my characters do counts as self-deception at all, or as something that sits beside it, and give me the consideration you find decisive; if you think I have described a confusion rather than a phenomenon, say that instead, and show me where the description breaks.
reasoning: |-
  Okay, this novelist has presented a fascinating psychological puzzle. They've created two characters exhibiting a very specific form of avoidance that challenges existing concepts of self-deception. The man avoids confronting his dead marriage through meticulous scheduling, while the mother maintains an untallied existence through countless small choices. Both operate below the threshold of conscious thought.

  What strikes me most is how this differs from classic models. Sartre's bad faith requires awareness to be denied, Orwell's doublethink holds contradictory beliefs, and even the legal concept of willful blindness assumes underlying suspicion. Here there's no mental content to suppress - the thoughts simply never form because the architecture of their lives prevents it.

  The novelist seems to be describing something more architectural than psychological - a cognitive moat dug through behavioral patterns rather than mental gymnastics. It's not that they're lying to themselves; they've constructed worlds where the lie isn't necessary because the truth never knocks.

  I need to evaluate potential conceptual neighbors carefully. Cognitive avoidance comes close but implies awareness; preemptive neutralization suggests active prevention. Structural oblivion might capture the environmental aspect best - how external arrangements produce internal silence. The key differentiator is the complete absence of mental conflict.

  For boundary cases: the annual dismissive thought falls outside because it breaches consciousness; trauma-induced blockage differs in origin; delegation retains awareness; externally imposed ignorance lacks agency. Only cases where pattern-building prevents thought formation qualify.

  This isn't self-deception but its prevention - a preemptive strike against cognition itself. The decisive factor is the lack of even fleeting awareness. These characters haven't deceived their minds; they've engineered worlds that keep certain truths permanently offstage.
answer: |-
  What you've described is not merely adjacent to self-deception; it is a distinct and profound phenomenon. It operates *beneath* the level of belief-formation or even suspicion. Established concepts don't quite capture it because they presuppose some level of mental content (a belief to deny, a suspicion to avoid) that your characters have meticulously engineered their lives to *prevent from ever arising*. Let's dissect it:

  1.  **The Core Phenomenon: Structural Preclusion of Cognition**
      *   **The Essence:** Your characters have constructed the external architecture of their lives (schedules, habits, decision-making frameworks) in such a way that a specific, problematic question or awareness *cannot logically arise* within their conscious internal narrative. It's not repressed; it's precluded. The possibility is structurally eliminated from their experiential field.
      *   **Mechanism:** Through countless small, individually defensible actions ("late office," "standing Thursday fixture," "habit of taking calls in the kitchen," the mother's "innocent" household decisions), they create a reality where the *need* for the question never manifests. The input signal (the direct confrontation with the void in the marriage, the quantifiable imbalance in the mother's life) is never generated by their environment *as they have designed it*.
      *   **Internal State:** There is no internal conflict, no "knowing and not knowing." There is simply... *not knowing*, because the conditions for knowing were never met. The "machinery is intact," but the triggering stimulus is absent by design. They aren't denying evidence; they've arranged life so the evidence doesn't present itself in a form requiring conscious acknowledgment.

  2.  **Why Established Concepts Fall Short:**
      *   **Self-Deception (Sartre's Bad Faith):** Requires the *simultaneous* awareness of a truth and the active, though often subtle, flight from it. Your characters lack the initial awareness. Bad faith involves lying *to* oneself; your characters have built a structure where the lie *isn't necessary* because the truth isn't encountered. The question "Is my marriage dead?" or "Am I neglecting my child?" doesn't flicker into existence long enough to be lied about.
      *   **Doublethink (Orwell):** Involves holding two contradictory beliefs *simultaneously* and accepting both. Your characters hold no contradictory beliefs about the issue because they hold *no belief at all* about it. There's no internal tension between "War is Peace" and knowing it's a lie; there's just the accepted reality they've constructed where the contradiction doesn't surface.
      *   **Willful Blindness (Legal Doctrine):** Requires a *suspicion* or awareness of *high probability* of a fact, followed by a *deliberate* refusal to investigate or confirm it ("conscious avoidance"). Your characters lack the initial suspicion. There's nothing *to* avoid investigating because the possibility hasn't even registered as a blip on their cognitive radar. They haven't chosen *not* to look; they've arranged things so there's *nothing visible to look at* or *no reason to look*.
      *   **Repression (Psychoanalytic):** Involves actively pushing *existing* unacceptable thoughts, memories, or feelings into the unconscious, where they continue to exert influence (e.g., symptoms, slips). Your characters are dealing with thoughts that *never became conscious* to repress. The material isn't bubbling under the surface; it was never present in the first place.
      *   **Cognitive Avoidance/Denial:** These imply awareness of a *threat* or *unpleasant possibility* which is then mentally or behaviorally avoided. Your characters haven't perceived the threat/possibility *at all*. Their avoidance isn't reactive (to an internal thought); it's *proactive* and embedded in the structure of their lives.

  3.  **The Closest Conceptual Neighbor & Its Shortfall:**
      *   **Preemptive Neutralization (or Preemptive Avoidance):** This gets closer than others. It describes acting *before* a threat fully materializes to prevent it from becoming an issue. However, in psychology, this often still implies *anticipation* or *foresight* of the potential threat/problem. Your characters' actions aren't driven by a conscious (or even subconscious) anticipation *of the specific problem they are avoiding*. They are driven by smaller, immediate, "innocent" motives ("I need to work late," "This activity is good for the child," "I prefer taking calls in the kitchen"). The *cumulative effect* of neutralizing the problematic question is a byproduct, not the conscious goal. They would deny *planning* the avoidance structure.

  4.  **Naming the Phenomenon: Structural Oblivion**
      *   **Definition:** A state of non-awareness achieved not through internal conflict or repression, but through the deliberate, though often unconscious, construction of one's external environment and behavioral patterns in such a way that specific awarenesses or questions are rendered logically impossible or experientially unavailable. It is oblivion *engineered* by life structure.
      *   **Boundary Cases:**
          *   *Thought once a year, dismissed:* **Outside.** The thought *does* arise and is consciously processed (even if dismissed). This is classic avoidance or denial, bordering on willful blindness if dismissal is deliberate.
          *   *Cannot entertain due to trauma:* **Outside, but adjacent.** Trauma often creates *internal* blocks (repression, dissociation) preventing cognition. Structural Oblivion is about *external* architecture preventing internal emergence. The mechanism differs (internal defense vs. external design), though the outcome (non-awareness) is similar. Trauma-based blockage often has involuntary physiological/psychological components.
          *   *Delegated the question (spouse/accountant):* **Outside.** Delegation implies awareness *that the question exists and needs answering*, just not by *them*. This involves conscious knowledge transfer, not preclusion.
          *   *Ignorance imposed from outside:* **Outside.** This is simple lack of information or manipulation, not *self-engineered* structure preventing awareness. The person hasn't *built* the moat; they are confined by someone else's walls.
      *   **What Falls Inside:** Only cases where the individual's own pattern of choices, habits, and environmental arrangements – each individually rationalizable or insignificant – *collectively* create a seamless barrier preventing a specific awareness or question from ever forming in their conscious mind. The hallmark is the *absence of the cognitive event*, not its suppression or denial.

  5.  **Is it Self-Deception? My Verdict:**
      *   **No, it is distinct.** Self-deception, in all its forms (bad faith, doublethink, simple denial), fundamentally involves an *internal contradiction* or *conflict* – knowing X but believing/acting as if not-X. **Structural Oblivion bypasses this conflict entirely.** There is no internal struggle because the problematic mental content *does not exist* to cause conflict. The deception isn't internal; it's *externalized* into the fabric of the life lived. The "lie" is not told *by* the self *to* the self; it is *lived* by the self *through* the structure of the self's world. It is self-deception's silent, architectural cousin – not the act of lying, but the careful construction of a room where the truth simply cannot enter.

  **The Decisive Consideration:** The absolute lack of *internal mental content* related to the avoided issue – no fleeting suspicion, no suppressed belief, no contradictory thought. The avoidance is achieved *before* cognition, through environmental and behavioral design, not *during* or *after* cognition through internal mechanisms like denial or repression. Your characters aren't managing conflicting thoughts; they've arranged life so the conflict never starts.

  You haven't described a confusion; you've pinpointed a subtle and powerful form of human evasion – the creation of a lived reality where uncomfortable truths are not hidden, but made impossible. **Structural Oblivion** is the concept you need. Use it well; your characters embody it chillingly.
