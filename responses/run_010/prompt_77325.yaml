  The conceptual divergence between US and UK anti-bribery law reflects distinct theories of corruption, centered on the **discretion-corruption nexus**. Here’s a precise reconstruction:

  ### Core Conception in the FCPA Carve-Out  
  The FCPA’s "routine governmental action" exception presupposes that **corruption lies in the purchase of an official’s *discretionary judgment*, not merely their action**. Key elements:  
  1. **Discretion as the Locus of Corruption**: A payment corrupts only when it induces an official to *exercise judgment they are empowered to withhold* (e.g., awarding a contract, granting a permit).  
  2. **Non-Corrupting Ministerial Acts**: Payment for actions an official is *legally compelled* to perform (e.g., releasing detained goods, processing visas) is excluded because:  
     - The official has no substantive discretion to distort;  
     - The payment secures speed or priority, not a favorable outcome;  
     - The core wrong is the *misuse of public authority for private gain*, absent where authority is purely mechanical.  
  3. **Competitive Harm Focus**: The statute implicitly prioritizes preventing **distortion of business competition** (e.g., buying contract awards) over mere administrative inefficiency (e.g., buying faster paperwork).  

  ### Rival Conceptions Foreclosed by the FCPA Exception:  
  - **Role-Integrity View**: Rejected outright. This theory holds that *any* monetization of public office degrades its integrity, regardless of discretion. The FCPA carve-out permits precisely this commodification for ministerial acts.  
  - **Duty-Fulfillment Immunity**: Implicitly embraced—payment to compel duty-performance isn’t corrupt because the official’s obligation neutralizes the corruptive element.  
  - **Equality of Access**: The exception tolerates "queue-jumping" (buying priority for routine services), implying unequal access alone isn’t corruption.  

  ### Strict Presuppositions vs. Comfortable Fits:  
  | **Strict Presuppositions**             | **Merely Comfortable Fits**               |  
  |----------------------------------------|------------------------------------------|  
  | Corruption requires influence over discretionary acts. | "Routine actions" are non-distortive of competition. |  
  | Officials under legal compulsion cannot be corrupted to act. | Ministerial acts lack moral agency. |  
  | The wrong is tied to public decision-making, not all office functions. | Queue-jumping is a de minimis harm. |  

  ### Underdetermined Practice:  
  The line between "routine" and "discretionary" actions is ambiguous. Examples:  
  - **Visas**: Is expediting a *guaranteed* approval "routine"? What if discretion exists in borderline cases?  
  - **Permits**: Processing a complete application (routine) vs. overlooking deficiencies (discretionary).  
  **Two incompatible theories license the same outcome**:  
  - A **discretion-based view** might approve payment to connect water *if* the official has no authority to refuse qualified applicants.  
  - A **role-integrity view** could condemn it but be overridden by prosecutorial discretion not to charge.  

  ### Transatlantic Disagreement: Nature vs. Enforcement  
  - **Fundamental Divergence**: The UK Bribery Act adopts the **role-integrity view**, criminalizing *all* payments to officials as inherently corrupting. The US/FCPA rejects this, limiting corruption to discretionary acts.  
  - **Prosecutorial Discretion**: The UK criminalizes facilitation payments but may not prosecute minor cases. The US carves them out *legally*, making non-discretionary payments non-criminal.  
    → Thus, the split is **ontological** (what corruption *is*), not merely pragmatic (what to prosecute).  

  ### Implications of Adopting the Role-Integrity View in the US:  
  1. **Statutory Change**: Repeal the FCPA’s "routine governmental action" exception (§78dd-1(b)).  
  2. **Compliance Routines**:  
     - **Due Diligence**: Scrutinize *all* payments to officials, not just those linked to discretionary acts.  
     - **Training**: Emphasize that *any* payment to influence official conduct—even for owed services—is prohibited.  
     - **Record-Keeping**: Treat facilitation payments as potential violations, not exempt transactions.  
  3. **Enforcement**: Prosecutors would no longer need to prove discretion—only intent to influence official action.  

  ### Conclusion  
  The FCPA’s coherence rests on a **discretion-centric theory of corruption**: public office is corrupted only when judgment is commodified. The UK’s role-integrity view holds that office itself is corrupted by any monetization. The transatlantic divide thus reflects a deeper philosophical clash about the nature of public trust—whether it forbids all market incursions or only those distorting official judgment.
