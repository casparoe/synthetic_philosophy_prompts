prompt: |-
  Ok so I'm a junior and I "run" the game theory club at my school, which really just means our advisor handed it to me after I gave one talk and then stopped showing up. Next Wednesday I get 45 minutes with about 14 people, sophomores and juniors, all of them have done a semester of probability so expected value and 50/50 odds are fine, but not one of them has ever seen a payoff matix before. I've got a whiteboard and I'm allowed to hand out one printed sheet if it's actually worth it. The topic I picked is crossing out dominated strategies, and I specifically want to get all the way to the part where a strategy is only dominated if you're allowed to *mix* two of the others together, because that was the bit that blew my mind when I stumbled on it and I think it's the bit that makes randomizing feel legitimate instead of like a cheat code. What I need from you is not an explanation of the game theory — I already get that, I just need a plan for explaining it: what order the pieces have to come in and what depends on what, where the mixed-domination reveal should land so it feels earned instead of pulled out of a hat, how long I should let them sit in the stuck version before I rescue them, and what I should say out loud that I'm skipping and why.

  I built my own example instead of using prisoner's dilemma, because in prisoner's dilemma the dominance is way too obvious and nobody ever has to mix anything. Here's mine, first number is the row player, second is the column player:

  ```
                L          C          R
     X       (4, 0)     (0, 5)     (2, 2)
     Y       (0, 5)     (4, 0)     (2, 2)
     Z       (1, 5)     (1, 5)     (1, 5)
  ```

  My intended path is: Z gets beaten everywhere by half-X-half-Y, so cross it out; then for the column player R gets beaten by half-L-half-C, so cross that out; then you're left with a 2x2 that's basically matching pennies and I end the session on "so now what." I like this arc because at the start nothing is beaten by any single pure strategy on either side, so they'll feel genuinely stuck for a minute before the mixing idea saves it. Three things I want you to check and then fold into the plan. First, does this actually work as the one carrying example, or is it too big and too arbitrary to do live on a whiteboard — what does the carrying example need to have and what must it absolutely not have, and if mine fails one of those, how do I shrink it without losing the point? Second, my friend Dana says my order is wrong and you can cross out R at the very start because half-L-half-C beats it anyway, and honestly I couldnt tell her she was wrong, so work out whether she's right and tell me how I should handle it if someone in the club says the same thing mid-session. Third, the misconceptions — I'm already bracing for "dominated just means the numbers are smaller," "you cross it out because you figured out what the other person is going to do," and "whatever survives at the end is the answer," and there's a worse one hiding under those, which is that they'll accept mixing just because I said so rather than because it makes sense, since a mixed strategy isn't a choice anyone actually makes at the table. Tell me where in the sequence each of those gets headed off, which one I should let somebody say out loud first so it can be knocked down in front of everyone, and give me one closing question that would show me whether the mixed-domination idea really landed or whether they just watched me do arithmetic correctly. Assume half of them are there for service hours, so the first five minutes have to hook people who would rather be literally anywhere else.
reasoning: |-
  We are given: 
  - 45 minutes with 14 students (sophomores and juniors) who have seen probability (expected value, 50/50) but no payoff matrix.
  - Topic: Iterated elimination of dominated strategies, with a focus on mixed strategies being necessary for domination.
  - The example game (row player is choosing rows X, Y, Z; column player choosing columns L, C, R):

                L     C     R
          X   (4,0) (0,5) (2,2)
          Y   (0,5) (4,0) (2,2)
          Z   (1,5) (1,5) (1,5)

  - Intended path: 
    1. Show that Z is strictly dominated by a mixed strategy of X and Y (half and half).
    2. Then, after eliminating Z, show that R is strictly dominated by a mixed strategy of L and C (half and half).
    3. End with the 2x2 matching pennies (X and Y vs. L and C) and leave it at "so now what?" to show that not all games are solvable by dominance.

  - Three main points to address:
    a) Is the example too big? What are the requirements for a good carrying example?
    b) Dana's point: Can R be eliminated at the very beginning? How to handle if a student brings this up?
    c) Anticipated misconceptions and how to address them. Also, a closing question to check understanding.

  Plan:

  1. **Hook (First 5 minutes):** 
     - Start with a simple, relatable example to introduce the concept of dominance. 
     - Example: Two choices for row player: A gives $5, B gives $3. Clearly A dominates B. Then add a column player to make it a game. 
     - Alternatively, use a very simple 2x2 game (like matching pennies) to show that sometimes no strategy is dominated by a pure strategy. But then quickly move to the main example.

  2. **Introduce the Main Example (5-10 minutes in):**
     - Draw the 3x3 matrix on the whiteboard. Label rows and columns.
     - Explain that we are looking for strategies that are always worse than some other strategy, no matter what the opponent does. This is strict domination.

  3. **Check for Pure Strategy Dominance (10-15 minutes):**
     - Ask: For the row player, is there a row that is always worse than another row? 
       - Compare X and Z: 
          - If column plays L: 4 vs 1 -> X better
          - If column plays C: 0 vs 1 -> Z better? Wait, 1>0 so Z is better? So Z is not always worse than X? 
          - Similarly, Y vs Z: 
             - L: 0 vs 1 -> Z better? 
             - C: 4 vs 1 -> Y better
          - Also, X vs Y: 
             - L: 4 vs 0 -> X better
             - C: 0 vs 4 -> Y better
          - So no pure strategy dominates any other for row player.
     - For column player: 
          - Compare L and R: 
             - If row plays X: 0 vs 2 -> R better? 
             - If row plays Y: 5 vs 2 -> L better? 
             - If row plays Z: 5 vs 5 -> same? So not strictly dominated.
          - Similarly, C vs R: 
             - X: 5 vs 2 -> C better
             - Y: 0 vs 2 -> R better? 
             - Z: 5 vs 5 -> same? 
          - And L vs C: 
             - X: 0 vs 5 -> C better
             - Y: 5 vs 0 -> L better
             - Z: 5 vs 5 -> same? 
       - So no pure strategy dominates any other for column player either.

     - At this point, the students may feel stuck: no pure dominance. 

  4. **Introduce Mixed Strategies for Domination (15-25 minutes):**
     - Explain that maybe we can mix two strategies to create a new one that is better than a third one in every situation.
     - For the row player: consider mixing X and Y with equal probability (0.5 each). 
          - Calculate the expected payoff against each column:
            - Against L: 0.5*4 + 0.5*0 = 2
            - Against C: 0.5*0 + 0.5*4 = 2
            - Against R: 0.5*2 + 0.5*2 = 2
          - Now compare to Z: 
            - Against L: 1 (which is less than 2)
            - Against C: 1 (less than 2)
            - Against R: 1 (less than 2)
          - So the mixed strategy (0.5X, 0.5Y) strictly dominates Z.

     - Therefore, row player would never play Z. Cross out row Z.

  5. **Update the Matrix (25 minutes):**
     - Now we have:

              L     C     R
        X   (4,0) (0,5) (2,2)
        Y   (0,5) (4,0) (2,2)

     - Now look at the column player. We want to see if any column is dominated. 
       - Compare pure strategies: 
          - L vs C: 
              - X: 0 vs 5 -> C better
              - Y: 5 vs 0 -> L better -> so not dominated.
          - L vs R: 
              - X: 0 vs 2 -> R better
              - Y: 5 vs 2 -> L better -> not dominated.
          - C vs R: 
              - X: 5 vs 2 -> C better
              - Y: 0 vs 2 -> R better? -> not dominated.

     - Again, no pure dominance? But note: we can mix L and C.

  6. **Mixed Strategy for Column Player (25-35 minutes):**
     - Consider a mixed strategy of L and C with 0.5 each.
          - Against X: 0.5*0 + 0.5*5 = 2.5
          - Against Y: 0.5*5 + 0.5*0 = 2.5
          - Compare to R: 
              - Against X: 2 -> 2.5>2
              - Against Y: 2 -> 2.5>2
          - So the mixed strategy (0.5L, 0.5C) strictly dominates R.

     - Therefore, column player would never play R. Cross out column R.

  7. **End with the Reduced Game (35-40 minutes):**
     - Now we have:

              L     C
        X   (4,0) (0,5)
        Y   (0,5) (4,0)

     - This is matching pennies: row player wants to match (X with L, Y with C) but column player wants to mismatch. 
     - Check for dominance in this 2x2? 
          - Row: X vs Y: 
              - If L: 4 vs 0 -> X better
              - If C: 0 vs 4 -> Y better -> no dominance.
          - Column: L vs C: 
              - If X: 0 vs 5 -> C better
              - If Y: 5 vs 0 -> L better -> no dominance.
     - So we cannot eliminate further. 
     - Conclude: "So now what? We've eliminated Z and R, but we're left with a game that has no dominant strategies. This is a classic game called matching pennies, and it has no pure strategy equilibrium. But that's a story for another day."

  8. **Addressing Dana's Point (if it comes up):**
     - Dana says: at the beginning, R is dominated by a mixed strategy of L and C? But note: at the beginning, the matrix includes row Z. 
          - We must check the mixed strategy of L and C (0.5 each) against R in the full matrix:
              - Against X: 0.5*0 + 0.5*5 = 2.5 vs R gives 2 -> 2.5>2 -> better
              - Against Y: 0.5*5 + 0.5*0 = 2.5 vs R gives 2 -> better
              - Against Z: 0.5*5 + 0.5*5 = 5 vs R gives 5 -> same? 
          - So strictly dominating requires being strictly better in every row. Here, against Z, it's the same. So R is not strictly dominated by (0.5L,0.5C) in the full game because of row Z! 
     - Therefore, we cannot eliminate R at the very beginning. 
     - But note: after eliminating row Z, then against the remaining rows (X and Y) the mixed strategy does strictly dominate R. 
     - So the order matters: we must eliminate row Z first, then column R. 

     - If a student brings this up: 
          - Acknowledge: "Great point! Let's check: can we eliminate R right now? We need to see if there's a strategy (pure or mixed) for column that does better than R in every row. Let's try the mixed strategy of L and C: 
              - Against X: 2.5 > 2? Yes.
              - Against Y: 2.5 > 2? Yes.
              - Against Z: 5 vs 5? Same. So it's not strictly better in row Z. Therefore, R is not strictly dominated by that mixed strategy because of row Z. So we cannot eliminate it yet. But after we remove row Z, then we can."

  9. **Misconceptions:**
     - "Dominated just means the numbers are smaller": 
          - Head off by emphasizing: we must compare the same row (or column) against the same column (or row) choices. And it must be for every possible move of the opponent. 
          - We saw: Z has 1 in every column, while X and Y have higher in some and lower in others. But by mixing we got a strategy that is always 2, which is better than 1.

     - "You cross it out because you figured out what the other person is going to do":
          - Emphasize: dominance is about what is best regardless of what the opponent does. It does not require predicting the opponent. 
          - We are eliminating strategies that are never good, no matter what.

     - "Whatever survives at the end is the answer":
          - We end with a 2x2 that has no dominant strategies. So we haven't found an equilibrium. We only did elimination. The point is that sometimes elimination doesn't get us to one outcome.

     - They might accept mixing just because you said so: 
          - To make mixing feel legitimate, we must show that a mixed strategy is a valid plan that a player can commit to before the game (without seeing the opponent's move). 
          - Explain: "A mixed strategy is like flipping a coin to decide between X and Y. Then, no matter what the opponent does, you get an expected payoff of 2, which is better than the 1 you would get by playing Z. So why would you ever choose Z if you can flip a coin and do better?"

     - Let someone say: "But a mixed strategy isn't a choice anyone actually makes at the table." 
          - Then counter: "Actually, it is. Think of it as a plan that involves randomness. For example, in sports, a team might randomly choose between two plays to keep the opponent guessing. Here, by randomizing, the row player avoids being predictable and also gets a better average outcome than by playing Z."

     - Which misconception to let someone say? Probably the one about "figuring out the opponent" because it's a common misunderstanding. You can set it up by asking: "So why are we crossing out Z? Is it because we know the column player will do something? Or is it because Z is just a bad idea no matter what?"

  10. **Closing Question (last 5 minutes):**
      - To check if the mixed-domination idea landed: 
          - "Suppose we have a new game for the row player only (ignore the column player's payoffs for a moment). Row has two strategies: A and B. Against column move 1: A gets 3, B gets 0. Against column move 2: A gets 0, B gets 3. And a third strategy C that gets 1 in both cases. Is C dominated? If so, by what?"
          - They should say: by a 50-50 mix of A and B, which gives 1.5 in either case (which is >1).

      - Alternatively, in the context of the original: "After we eliminated Z and then R, why couldn't we eliminate anything else? What would we need to do next to solve the game?" (Hint: introduce mixed strategy equilibria, but we don't have to do that. We just note that dominance isn't enough.)

  11. **Logistics:**
      - Handout: One sheet with the initial matrix and the steps? But maybe better to do live on whiteboard so they follow the reasoning. Instead, handout could have the initial matrix and then the reduced matrices? Or just the initial matrix so they don't have to copy? 
          - Recommendation: Hand out a sheet with the initial matrix and then blank spaces for the steps. Or just the initial matrix and then they take notes. 
      - Time: 45 minutes is tight. 
          - Hook: 5 min
          - Introduce main example and check pure dominance: 10 min (total 15)
          - Mixed strategy for row: 10 min (total 25)
          - Mixed strategy for column: 10 min (total 35)
          - Reduced game and wrap-up: 5 min (total 40)
          - Closing question: 5 min

      - If time runs short, you can skip the pure dominance check for the column player in the reduced matrix and just say: "Now we have a 2x2 that we recognize as matching pennies, which has no dominant strategies."

  12. **Shrinking the Example?**
      - The example is 3x3. It's manageable. 
      - Requirements for the example:
          - No pure strategy dominance at first.
          - One strategy (Z) that is dominated by a mixed strategy of the others (X and Y) and that mixed strategy must yield the same payoff in every column (so that it's constant and easy to compare) or at least always higher than the dominated strategy.
          - After eliminating that, then a column strategy that is dominated by a mixed strategy of the remaining columns (but note: in the full matrix, we couldn't eliminate R because of Z, so we need the order).
      - The example works. 
      - To make it simpler: 
          - The row Z is constant, and the mixed strategy of X and Y is constant (2) and higher than 1. 
          - The column R in the reduced matrix is constant (2) and the mixed strategy of L and C is constant (2.5) and higher.

      - It's a good example.

  Final Plan:

  - Hook: Simple dominance (2 min) then a 2x2 without dominance (matching pennies) to show that sometimes we get stuck (3 min). 
  - Main example: Draw the matrix. Check pure dominance for row and column (5 min). 
  - Introduce mixed strategy for row: show that mixing X and Y dominates Z (10 min). 
  - Eliminate Z, update matrix. Then check for column: no pure dominance? Then mix L and C to dominate R (10 min). 
  - Eliminate R, show the 2x2 matching pennies and that we're stuck (5 min). 
  - Handle misconceptions along the way. 
  - Closing question (5 min).

  Good luck!
answer: |-
  Based on your goals, constraints, and the example provided, here's a battle-tested plan for your 45-minute session. The key is to make mixed-strategy domination feel inevitable and earned—not a magic trick—while preempting misconceptions. Your example works perfectly with minor adjustments.

  ---

  ### **Phase 1: Hook the Uninterested (0–5 min)**
  **Goal:** Grab attention with a relatable, absurd dilemma.  
  **Action:**  
  - Start with a **1-player game** (no payoff matrix yet):  
    > *"You're sneaking dessert past your parents. Options: (A) Grab cake (if they're asleep, +10 joy; if they're awake, -5 scolding). (B) Grab broccoli (always +1 joy). What do you choose?"*  
  - Let them debate. Then: *"But what if I told you there's a third option? (C) Flip a coin: if heads, grab cake; tails, broccoli. Expected joy: 0.5×10 + 0.5×1 = 5.5 if asleep, 0.5×(-5) + 0.5×1 = -2 if awake. Is this better than B? Let's see."*  
  - **Why this works:** Uses probability they know, introduces mixing organically, and creates intrigue ("Why would I ever choose B?"). Sets the stage for domination without matrices.

  ---

  ### **Phase 2: Introduce Your Example & Pure Domination Failure (5–15 min)**
  **Goal:** Make them feel "stuck" when pure strategies fail.  
  **Action:**  
  1. Draw your 3×3 matrix on the board. Label rows/columns clearly.  
  2. **Define strict domination:**  
     - *"A strategy is dominated if another strategy gives a better payoff no matter what the opponent does. Numbers can be lower sometimes, but must be higher overall."*  
  3. **Check for pure domination (row player first):**  
     - Ask: *"Can Row find one pure strategy (X, Y, or Z) that's always better than another?"*  
     - Walk through:  
       - X vs. Z: If Col plays L (4 > 1), but if Col plays C (0 < 1) → Not dominated.  
       - Y vs. Z: If Col plays C (4 > 1), but if Col plays L (0 < 1) → Not dominated.  
       - X vs. Y: Never dominates (X better if L, Y better if C).  
     - **Emphasize:** *"No pure strategy dominates any other for Row. Dead end."*  
  4. **Check for pure domination (column player):**  
     - Same process: L vs. R, C vs. R, L vs. C all fail (e.g., R is better than L if Row plays X, worse if Y).  
  5. **Plant the stakes:** *"So is this game unsolvable? Are we doomed? Not yet—let's think like the dessert sneak."*  

  ---

  ### **Phase 3: Reveal Mixed Domination for Row (15–25 min)**
  **Goal:** Make mixing feel like a natural breakthrough, not a lecture.  
  **Action:**  
  1. **Prompt discovery:** *"What if Row mixes X and Y? Say, 50/50. What happens?"*  
     - Have a volunteer calculate expected payoffs against each column:  
       - vs. L: 0.5×4 + 0.5×0 = 2  
       - vs. C: 0.5×0 + 0.5×4 = 2  
       - vs. R: 0.5×2 + 0.5×2 = 2  
  2. **Compare to Z:**  
     - Side-by-side on board:  
       ```
       Mixed (X/Y):  L:2,  C:2,  R:2  
       Z:           L:1,  C:1,  R:1  
       ```  
     - *"Is 2 > 1? Always? Then the mixed strategy dominates Z!"*  
  3. **Legitimize mixing:**  
     - Address the elephant: *"But mixing isn't a real choice, right? Wrong. It's a plan you commit to beforehand—like flipping a coin. If you can get +2 instead of +1 no matter what Col does, why wouldn't you?"**  
     - **Preempt misconception:** *"This isn't about predicting Col. It's about guaranteeing a better outcome even in the worst case."*  
  4. Cross out Z.  

  ---

  ### **Phase 4: Dana's Point—Handle It Here (25–30 min)**
  **Dana is half-right but misses the order dependency.**  
  - **Why she's wrong initially:** At the start, R is NOT dominated by L/C mix.  
    - Mix of L/C (50/50) vs. R:  
      - If Row plays X: 0.5×0 + 0.5×5 = 2.5 > 2 (R's 2) ✅  
      - If Row plays Y: 0.5×5 + 0.5×0 = 2.5 > 2 ✅  
      - **But if Row plays Z:** 0.5×5 + 0.5×5 = 5 = 5 (R's 5) ❌ → Not strict domination!  
  - **Why she's right later:** After Z is eliminated, R is dominated.  
  **How to handle if a student says it mid-session:**  
  - *"Great observation! Let's test it now."* Calculate the mix against Z together.  
  - *"See? Against Z, it's a tie. Domination requires strictly better. So we can't eliminate R yet—but we will soon."*  
  - **Key lesson:** Order matters. Elimination changes the game.  

  ---

  ### **Phase 5: Mixed Domination for Column & Reduce (30–40 min)**
  **Action:**  
  1. **New matrix (after Z removed):**  
     ```
            L     C     R
     X   (4,0) (0,5) (2,2)
     Y   (0,5) (4,0) (2,2)
     ```  
  2. **Check pure domination for Col:** None (same as before).  
  3. **Prompt mixing for Col:** *"Col is stuck too. Can mixing help?"*  
     - Have them calculate 50/50 mix of L/C:  
       - vs. X: 0.5×0 + 0.5×5 = 2.5  
       - vs. Y: 0.5×5 + 0.5×0 = 2.5  
     - Compare to R: Always 2.5 > 2 → Dominates!  
  4. Cross out R.  
  5. **Reveal final 2×2 (matching pennies):**  
     ```
            L     C
     X   (4,0) (0,5)
     Y   (0,5) (4,0)
     ```  
  6. **End on "So now what?":**  
     - *"No more dominated strategies. X vs. Y and L vs. C are all viable. How do we 'solve' this?"*  
     - Let them sit with the tension. No rescue!  

  ---

  ### **Phase 6: Misconception Takedowns & Closing (40–45 min)**
  **Where to tackle misconceptions:**  
  - **"Dominated = smaller numbers":** Killed in Phase 2 (show Z isn't dominated by X/Y pure despite higher lows).  
  - **"Cross out because you know the opponent":** Crushed when defining domination (emphasize "no matter what").  
  - **"Surviving strategies are the answer":** Debunked by the unresolved 2×2 ending.  
  - **"Mixing feels cheat-y":**  
    - Let someone voice this! Phase 3 is the moment: *"But you can't actually choose a mix—it's not a real action!"*  
    - **Counter:** *"It is real! Like randomizing passwords or soccer penalty kicks. You commit to a coin flip to protect yourself from being exploited."*  

  **Closing question to test understanding:**  
  > *"In a new game, Row has:  
  > - Strategy A: Pays 3 if Col does Left, 0 if Right.  
  > - Strategy B: Pays 0 if Left, 3 if Right.  
  > - Strategy C: Pays 1 no matter what.  
  > Is C dominated? If so, by what mix?"*  
  **Why it works:** They must recognize that 50/50 A/B gives 1.5 > 1 always, proving mixed domination landed.  

  ---

  ### **Critical Adjustments & Why Your Example Works**
  1. **Your example is perfect—don't shrink it.**  
     - It has:  
       - No pure domination (essential for the "stuck" phase).  
       - A constant-payoff strategy (Z) easily dominated by a mix.  
       - Order dependency (Z must go first, as Dana's point revealed).  
     - **Whiteboard tip:** Annotate payoffs when calculating mixes (e.g., circle the 2s for X/Y mix), but avoid printing the matrix—drawing live keeps them engaged.

  2. **Timing rescue:** Let them marinate in "stuck" for 3–4 min max (after pure checks). Any longer loses momentum.

  3. **Skipping details:** Say:  
     > *"We're skipping Nash equilibria and best responses today—focusing only on dominance. Why? Because mixing isn't just for equilibrium; it's a tool to kill bad options."*  

  4. **Handout worth it?** Yes—a one-sheet with:  
     - The dessert example (Phase 1).  
     - Initial matrix (Phase 2).  
     - Closing question (Phase 6).  
     **Why:** Lets them engage without copying, and the closing question becomes homework if time runs out.  

  ---

  ### **Why This Plan Works**
  - **Mixed domination feels earned:** It resolves the "stuck" phase you engineered.  
  - **Dana's point becomes a teachable moment:** Proves order matters.  
  - **Misconceptions die in action:** All addressed contextually, not theoretically.  
  - **The arc:** Hook (absurd) → Stuck (frustration) → Breakthrough (mixing) → Deeper stuck (matching pennies).  

  You're ready. They’ll leave debating whether mixing is genius or cheating—exactly what you want.
