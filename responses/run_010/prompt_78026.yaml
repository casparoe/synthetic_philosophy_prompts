answer: |-
  Here's the translation into your forensic framework, followed by the residue analysis:

  **Translation: Reparations as Tort Damages Claim**
  *   **Duty:** The state (or society) owed a duty to enslaved persons/their descendants to refrain from unjust enrichment and violation of fundamental rights.
  *   **Breach:** Chattel slavery, state-sanctioned segregation (Jim Crow), and ongoing systemic discrimination constitute breach.
  *   **Causation-in-fact:** But-for the original injustice (e.g., slavery), the claimant's lineage would not suffer present economic/social deficits. (This faces the non-identity problem).
  *   **Proximate Cause:** Whether present disparities are a "foreseeable" consequence of centuries-old acts, or if intervening causes break the chain. The "persisting structure" argument asserts proximate cause *is* ongoing.
  *   **Foreseeability:** Were the long-term, intergenerational harms foreseeable at the time of the breach? (Contested).
  *   **Reasonable Certainty:** The core measurement challenge: Quantifying the deficit from a centuries-old starting point, accounting for countless variables. Opponents argue the harm is inherently "speculative."
  *   **Compensatory Measure:** What descendants lost (e.g., accumulated wealth, earnings potential, educational attainment) compared to the but-for world without the injustice.
  *   **Restitutionary Measure:** What the perpetrators gained (e.g., slaveholder profits, societal economic head start, uncompensated labor value) and potentially retain.
  *   **Apportionment:** Assigning liability among historical actors (many dead/corporations dissolved), the state, and potentially "passive beneficiaries" (society at large). Complicated by joint vs. several liability concepts.
  *   **Collateral Source Rule:** Does societal welfare (e.g., social programs) offset the harm, or is it collateral?
  *   **Limitations/Discovery Rule/Continuing Violation:** Does the statute of limitations bar claims? Proponents argue discovery rule (harm not fully known/appreciated) or continuing violation (ongoing systemic harm).
  *   **Ascertainability & Formulaic Damages Model:** Defining the class ("descendants of enslaved persons in jurisdiction X?"), excluding fraudulent claims, and creating a formula for individual awards based on lineage and perhaps current metrics (wealth gap, income disparity). Major hurdle.
  *   **Loss-of-a-Chance:** Applied to historical opportunities (e.g., land ownership denied, generational businesses not started), awarding a fraction based on the probability of success had the chance existed.

  **Residue Report:**

  1.  **Persisting Structure Mapping:** It maps **poorly onto continuing-violation tolling (CVT) and catastrophically onto proximate cause.**
      *   *CVT:* CVT tolls the statute for *serial, related, discrete acts* (e.g., repeated discriminatory promotions). A "structure" is not a series of acts; it's the *condition* enabling acts. Mapping preserves the *argument for timeliness* but *reduces its conceptual force* by forcing systemic reality into a box designed for episodic misconduct. The "violation" becomes amorphous.
      *   *Proximate Cause:* Mapping the structure *as* proximate cause makes the doctrine circular. Proximate cause asks if the *harm* is too remote from the *act*. Saying the structure *is* the proximate cause conflates the mechanism of harm with the causal relationship itself. It destroys the concept's utility for limiting liability. The argument retains rhetorical force ("it's still causing harm!") but loses analytical rigor within tort logic.
      *   **Residue:** The "structure" argument fundamentally exceeds tort's capacity to conceptualize harm as traceable *acts*. The framework *reduces* the argument's force by demanding it conform to categories ill-suited for it.

  2.  **Non-Identity Problem & Baseline:** This falls squarely into **Causation-in-Fact (But-For Causation) and Standing.**
      *   *Causation-in-Fact:* But-for slavery, *this specific claimant* (descendant) would not exist. Therefore, they cannot claim they are *worse off* than they would be absent the wrong – in the counterfactual, they don't exist. Tort doctrine has no answer for this; it assumes the *same plaintiff* exists in the but-for world.
      *   *Standing:* The non-identity problem directly challenges whether the *descendant* has standing to assert the *ancestor's* injury. Can they show a *personal, concrete, particularized* injury traceable to the defendant? The descendant suffers a *different* harm (present disparities) potentially caused by a system initiated by the original wrong, not the *same* injury as the ancestor. Tort standing doctrine struggles with this lineage-based claim.
      *   *Weight-Bearing:* **No slot bears the weight.** Causation-in-fact implodes. Standing doctrine, built on individuated harm occurring within actionable timeframes, buckles under claims spanning generations and affecting diffuse populations. The non-identity problem exposes a fundamental limit of tort logic applied to intergenerational group claims.

  3.  **Compensatory vs. Restitutionary Slippage:** **Yes, advocates frequently equivocate, and your vocabulary makes it starkly visible.**
      *   Arguments often start restitutionary ("society benefited from stolen labor!") but shift seamlessly to compensatory ("descendants suffer wealth gaps!") to justify payments *to descendants*. The restitutionary claim logically points to disgorgement *from specific unjust enrichers* (a near-impossible task historically). The compensatory claim requires proving *individual descendant losses* against a speculative baseline. Equivocation hides the tension: Restitution might not flow to the "harmed" party (descendants), while compensation requires proving *their* loss. Your framework exposes this as a category error within the argument itself.

  4.  **Ascertainability & Formulaic Model vs. Descent-Based Claims:** **It devastates them.**
      *   *Ascertainable Class:* Defining "descendants" faces genealogical hurdles, potential fraud, and boundary issues (e.g., mixed ancestry). Tort demands identifiable plaintiffs, not statistical groups. Defining defendants ("society," "the state") is equally problematic, violating the principle of specific liability to specific plaintiffs.
      *   *Formulaic Damages:* Creating a non-arbitrary formula is impossible. How to quantify the "inheritance" of harm? Per capita share of estimated total harm? Scaling by current wealth gap? Adjusting for lineage "purity"? Any formula involves massive, contestable assumptions violating the "reasonable certainty" standard. The requirement forces arbitrary precision onto an inherently imprecise claim, exposing its vulnerability within the tort framework.

  5.  **Adjusting Projections: Discrimination vs. Absent-Discrimination Baseline:** **It's a contradiction of fundamental counterfactuals, often confused.**
      *   *Tort Framework (Compensatory):* "What would *this claimant* have earned *in the actual labor market they faced*, but for *the specific defendant's discrete act*?" It incorporates existing discrimination as market reality. Adjusting for race/sex *is* about accuracy *within the actual world*.
      *   *Reparations Baseline (Compensatory):* "What would *this lineage* have accumulated *in a but-for world where the foundational injustice (slavery/segregation) never occurred*?" This imagines a radically different market *and* social structure without historical discrimination. It rejects incorporating present discrimination as part of the baseline.
      *   **Contradiction:** Yes, it's a genuine contradiction. The tort framework calculates loss *within a discriminatory system* caused by a specific act. The reparations baseline calculates loss *caused by the creation and perpetuation of the discriminatory system itself*. They are computing different quantities against irreconcilable counterfactuals. The confusion arises when reparations arguments borrow the *language* of tort compensation without accepting its constrained counterfactual.

  **Answering Your Core Question:**
  The residue is **overwhelmingly a defect in tort damages as a framework for historical injustice.** Tort is engineered for:
  1.  **Discrete Acts:** Not foundational, systemic, centuries-long processes.
  2.  **Identifiable Parties:** Not shifting collectives (perpetrators, beneficiaries, victims) across generations.
  3.  **Contemporaneous Harm:** Not harm inherited or accruing over centuries.
  4.  **Individuated Proof:** Not group-based statistical deficits.
  5.  **Manageable Counterfactuals:** Not reconstructing centuries of alternative history.

  The framework cannot "express" claims based on lineage, systemic causation, societal benefit, and intergenerational transmission without distorting or dismembering them. The philosophical work *looks* like rigor because it borrows tort's structure, but it's often struggling to fit a square peg into a round hole. The indeterminacy arises *because* tort concepts fracture under the weight, not necessarily because the underlying moral claim lacks validity *outside* that framework.

  **Attacking the "Measurement Problem" Hypothesis:**
  Your hypothesis is **wrong at its core.** It mistakes symptoms (measurement disputes) for the disease. The fundamental disagreements are **ontological and justificatory**, not merely quantitative:
  1.  **Inheritance of Obligation:** Does the *state* inherit the obligation of past governments/societies? Do *citizens today* inherit obligations for acts before their birth? Tort assumes obligations attach to specific actors for their acts. Reparations requires a theory of collective, inherited responsibility tort doesn't recognize.
  2.  **Nature of the Harm:** Is the harm the *original sin* (slavery), the *ongoing deficit* (wealth gap), or the *unjust enrichment* (societal benefit)? Tort struggles with all three simultaneously, especially the enrichment of non-acting parties.
  3.  **Standing of Descendants:** Does a descendant have standing to claim *restitution* for labor their ancestor performed? Tort strongly suggests no – the ancestor's claim died with them. Compensation for *their own* losses requires overcoming non-identity.
  4.  **Purpose of Remedy:** Is it corrective justice (restoring balance between wrongdoer/victim), distributive justice (addressing current inequality), or symbolic acknowledgment? Tort is primarily corrective. Reparations often blends all three, creating internal tensions within a tort analysis.
  5.  **Counterfactual Choice:** The choice of baseline (no slavery vs. current discrimination-adjusted) is not a neutral measurement choice; it embodies a philosophical stance on *what constitutes the wrong* and *what justice demands*.

  **If Measurement Were Perfect:**
  Perfect measurement wouldn't resolve the core disputes. We could perfectly calculate:
  *   The net present value of stolen labor + compounded returns.
  *   The exact wealth gap attributable solely to slavery/Jim Crow.
  *   The societal economic benefit derived from historical injustice.

  Yet the arguments would persist:
  *   **Opponent:** "This money is owed by dead people to dead people. Paying descendants is arbitrary and unfair to living taxpayers who committed no wrong. The non-identity problem means they aren't *worse off*."
  *   **Proponent:** "The state/society perpetrated and benefited from the injustice. The obligation and the benefit persist. Justice demands rectification for the lineage and disgorgement of ill-gotten gains, regardless of perfect individual tracing or non-identity."
  *   **Disagreement:** "Do present collectives inherit obligations for distant past wrongs against other collectives?" Perfect measurement clarifies the *size* of the claim but not its *validity* or *proper recipient* within the tort framework's logic. The debate shifts to the philosophical foundations tort silently assumes and reparations arguments challenge. The mismatch isn't in the numbers; it's in the conceptual universe defining wrongs, obligations, victims, and remedies.
