  The residue suggests tort frameworks can't fully contain historical injustice claims - not because the claims lack validity, but because tort principles like individuation and temporal boundaries are mismatched with systemic, inherited harms. The "measurement problem" hypothesis underestimates this: even perfect econometrics couldn't resolve whether obligations transmit intergenerationally or how to value absent identities. The real dispute is ontological before it's quantitative.

