  Second, "bounded rationality" - jurors aren't ideal Bayesian updaters and are vulnerable to biasing information. 
  Third, "institutional competence" - courts must manage systemic risks like mistrials and appeals. 

  For the accuracy question, I should emphasize that the system trades off pure accuracy for procedural fairness. The "common sense" allowance makes sense as background knowledge, while active research introduces uncontrolled variables. The supervised visit exception proves the rule - it maintains procedural control.

  Where is this underdetermined? The rationale could support either strict epistemic paternalism (jurors can't handle info) or pure proceduralism (form over truth). Also, the line between "common sense" and "specialized knowledge" is fuzzy - why can a nurse use medical knowledge but others can't Google?

  The tension between life experience and reference books: I see this as the system accepting unavoidable cognitive backgrounds while rejecting active, unvetted investigation. It's about control, not content.

  For the alternative rule permitting research with disclosure: this would radically shift toward pure accuracy goals but likely collapse under disclosure failures and increased appeals. It would destroy the current equilibrium.

  On settled vs contested matters: most agree the rule serves adversarial process integrity, but there's debate about whether jurors are truly that irrational. The "common sense" boundary is perpetually contested in appellate courts.

  The user seems sophisticated - probably a law/philosophy student or scholar. They want rigor in distinguishing doctrine from theory. I should flag where legal practice is messier than the model (e.g., nurses testifying as quasi-experts). Might need to concede that some tensions aren't fully resolvable.
answer: |-
  Here’s a reconstruction of the implicit theory behind the no-research rule, addressing its tensions with Good’s theorem, the role of common sense, and potential alternatives. I distinguish settled principles from contested interpretations and highlight ambiguities.

  ### **Core Implicit Theory of the No-Research Rule**
  The rule presupposes a **procedural-epistemic theory** prioritizing **adversarial testing** and **institutional control** over raw informational accuracy. Key elements:

  1.  **The Trial’s Aim: Constrained Truth-Seeking**  
      -   Settled: The trial aims not merely at *accuracy* but at **procedurally legitimate accuracy**. Verdicts must derive from evidence tested under adversarial scrutiny (cross-examination, objections, rebuttal).  
      -   Contested: Whether this is primarily about *epistemic reliability* (untested evidence is less trustworthy) or *fairness/due process* (parties deserve a chance to respond). Most scholars agree both factor in, but weightings differ.  

  2.  **Jurors as Bounded Rational Actors**  
      -   Good’s theorem assumes idealized Bayesian updaters who can costlessly ignore irrelevant information. The rule rejects this model for jurors:  
          -   **Cognitive Limits:** Jurors may lack skills to filter/weight untested evidence (e.g., misinterpreting complex online sources).  
          -   **Motivational Limits:** Active seeking increases commitment bias ("I found it, so it must be important").  
          -   **Ignorance Cost:** Deciding *what* to ignore is cognitively demanding; pre-screening evidence reduces juror burden.  
      -   Settled: Courts explicitly cite risks of bias, confusion, and distortion from untested evidence.  
      -   Contested: Whether jurors are *inherently* incapable or whether rules reflect institutional caution.  

  3. **The Cost of Information: Third Parties and Systemic Integrity**  
      -   Negative "value" in Good’s theorem is reinterpreted as **externalized costs**:  
          -   **Party Fairness:** Self-help evidence denies opponents the right to challenge/rebut.  
          -   **Finality/Appeal Risks:** Verdicts based on extra-record evidence create appealable errors, wasting resources.  
          -   **Public Confidence:** Predictable procedures bolster legitimacy; secret research erodes trust.  
      -   Settled: Appeals courts consistently void verdicts over undisclosed juror research to protect these interests.  

  4. **Common Sense vs. Reference Works: A Deliberate Distinction**  
      -   **Common Sense/Life Experience:** Treated as **background cognitive machinery** necessary to interpret *admitted* evidence (e.g., inferring intent from actions). Courts view this as:  
          -   Unavoidable (cannot be "sworn off" like research).  
          -   Generalized and communal (shared societal understandings).  
          -   Subject to peer challenge during deliberations.  
      -   **Reference Works/Experiments:** Treated as **new evidence** because they:  
          -   Introduce case-specific facts (e.g., a dictionary’s definition of "premeditation").  
          -   Are not subject to adversarial testing.  
          -   Risk idiosyncratic or technical interpretations.  
      -   *Tension:* A nurse’s medical knowledge tests this boundary. Courts often permit it as "experience" if used to evaluate evidence (e.g., "This injury doesn’t match the testimony") but forbid "testimony-like" assertions (e.g., "As a nurse, I know this drug causes psychosis").  

  5. **Escorted Views vs. Solo Visits: Control as the Key**  
      -   **Supervised View:** Preserves adversarial control. Parties can object, propose instructions, and ensure the jury observes only what the court admits. It extends the courtroom’s procedural safeguards.  
      -   **Solo Visit:** Introduces untested sensory data (e.g., "The alley was too dark for the witness to see") and denies parties input.  

  ### **Underdetermined Aspects (Multiple Theories Fit)**
  -   **Epistemic Paternalism vs. Proceduralism:** Does the rule exist because jurors *cannot* handle extra information rationally (paternalism), or because the *process* demands party control regardless of juror competence (proceduralism)?  
  -   **Scope of "Common Sense":** When does specialized knowledge (e.g., a pharmacist juror on drug interactions) cross into forbidden "research"? Case law is inconsistent.  
  -   **Accuracy Trade-off:** Whether the rule *knowingly* sacrifices some accuracy for process values, or assumes process *enhances* accuracy by filtering evidence.  

  ### **Consistency of Parts**  
  The rules are **internally consistent** under the theory:  
  - **Common sense** is permitted as *interpretive context* for admitted evidence.  
  - **Escorted views** are admitted *as evidence* under supervision.  
  - **Reference works/experiments** are barred as *untested evidence*.  
  The tension is superficial; the distinction hinges on **procedural control and adversarial testing**, not information per se.  

  ### **An Information-Permissive Rule: Implications**  
  If jurors could research *but disclose findings* for party response:  
  -   **Destroys the Presupposed Theory:** It abandons core principles:  
      -   **Procedural Legitimacy:** Shifts burden to parties to rebut random juror discoveries, undermining predictability.  
      -   **Cognitive Burden:** Expecting jurors to impartially disclose/ignore prejudicial findings is unrealistic.  
      -   **Finality:** Every verdict would risk appeal over inadequate disclosure.  
  -   **Potential Survival:** Only if disclosure were perfectly enforceable and parties had unlimited resources to rebut surprises. In practice, this is unworkable.  
  -   **Systemic Shift:** Would reframe trials toward pure accuracy-maximization, rejecting adversarial control as paramount. No common-law jurisdiction adopts this due to feasibility concerns.  

  ### **Settled vs. Contested**  
  | **Aspect**                           | **Settled**                                                                 | **Contested**                                                                 |  
  |--------------------------------------|-----------------------------------------------------------------------------|-------------------------------------------------------------------------------|  
  | **Rule’s Purpose**                   | Protect adversarial process and verdict finality.                           | Whether this *optimizes* accuracy or *trades accuracy* for other values.      |  
  | **Juror Competence**                 | Jurors cannot reliably process untested evidence without risk.              | Whether jurors are *inherently* biased or if rules reflect institutional risk aversion. |  
  | **Common Sense Allowance**           | Necessary for evidence evaluation; distinct from introducing new facts.     | Boundary between "experience" and "specialized knowledge."                    |  
  | **External Research Ban**            | Grounds for mistrial; essential for fair process.                           | Whether milder remedies (e.g., curative instructions) could suffice.          |  

  ### **Conclusion**  
  The no-research rule presupposes a **hybrid theory**: Truth-seeking is paramount *only when* mediated through an adversarial process that protects parties, controls cognitive biases, and ensures systemic integrity. Good’s theorem is inapplicable because it ignores the costs of information *to the institution*, assumes idealized jurors, and treats accuracy as the sole goal. The tension between common sense and reference works is resolved by classifying the former as a tool for interpreting evidence and the latter as evidence itself. An information-permissive rule would require abandoning the foundational commitment to adversarial control, making it incompatible with the current theory. The core rationale—untested evidence risks procedural injustice—remains widely accepted, while debates focus on juror capabilities and the rigidity of boundaries.
