  The user’s frustration is palpable. They’ve done the reading but want to know if this debate matters outside journals. I should emphasize that the test case (like the famine) reveals a concrete divergence—and that while egalitarians can retreat to pluralism (equality + total welfare), monists can’t dodge the "better in one respect" problem. That’s the hook Parfit hangs them on. 

  ...Wait, did they imply prioritarians might be covert egalitarians? No—the weighting is fixed to absolute thresholds (e.g., diminishing returns below subsistence), not relative gaps. That’s why in the famine case, they’d reject destructive equality. The theories fork when equality requires active harm. 

