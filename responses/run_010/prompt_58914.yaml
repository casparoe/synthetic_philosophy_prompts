  Hmm, for (a), a theory that doesn't impact actions risks being practically irrelevant. If two ethical theories always prescribe the same actions, their differences become academic—like arguing whether gravity works through particles or curves in spacetime when both predict apples falling the same way. The user seems to suspect that monist egalitarianism might be guilty of this if it only "wins" in impossible scenarios.

  For (b), I need to find a case where redistribution isn't zero-sum—where taking from the rich actively harms the poor. Natural disasters or broken systems come to mind. Imagine a famine: seizing a farmer's seed grain to share equally might cause mass starvation (prioritarian says: catastrophic loss), while egalitarianism might still see the flattened misery as "more equal" (a Pyrrhic victory). The key is irreversible destruction of resources during transfer. 

