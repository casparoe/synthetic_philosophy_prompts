prompt: |-
  I'm a jurisprudence doctoral student clerking for the constitutional court of a state now in its sixth year after an authoritarian regime, and I'm trying to work out what our own line of cases commits us to. Four holdings, in order. A statute dispossessing members of a disfavored sect of all inheritable property — enacted by the ordinary procedure, published in the gazette, general in form, prospective, and administered exactly as written — the court declined to give effect to, saying only that it had been validly enacted but "is not law in any sense that obliges a court." An unpublished internal directive ordering that grain shipments be given priority during a famine, which a supplier invoked to claim payment from the state: held to create no rights or duties, on the ground that a command subjects cannot know is not law. A retroactive amnesty vacating every conviction for political speech: given full effect, the court reasoning that retroactivity which undoes an earlier injustice does not carry the usual vice. A published statute denying a tax credit to one religious community: applied without hesitation, as unwise but within the legislature's competence.

  Now before us: a regime-era decree requiring members of a certain ethnic group to obtain permits for internal travel. It was published, its criteria were clear on their face, and it was prospective. But the permit-office archive shows grants and refusals routinely made on grounds the decree nowhere mentions, with no reasons recorded, and several of the convictions under review were obtained for travelling without such a permit. Should the decree be treated as law, and do those convictions fall?

  Tell me which of our four holdings is the closest analog; which two or three different principles the record so far is equally consistent with; what each of them implies about this case; which one explains all four holdings best and therefore what I should recommend; and, if the record genuinely underdetermines the matter, what principle we would be committing ourselves to by deciding either way. Finish by naming the further case that would tell those principles apart.
reasoning: |-
  Okay, the user is a jurisprudence doctoral student clerking for a constitutional court in a post-authoritarian state. They described four past holdings and need help analyzing a new case involving an ethnic travel permit decree. Let me break this down step by step.

  First, I need to recall the four holdings. The first case involved a statute dispossessing a disfavored sect of inheritable property. The court said it was validly enacted but "not law in any sense that obliges a court." So, even though it met formal criteria, it was rejected. The second was an unpublished grain directive during a famine. The supplier couldn't claim rights because subjects couldn't know it. The third was a retroactive amnesty for political speech convictions, which was upheld because it undid injustice. The fourth was a published statute denying a tax credit to one religious group, applied as unwise but within legislative competence.

  Now the new case: a regime-era decree requiring an ethnic group to get internal travel permits. It was published, clear, and prospective. But the permit office used unmentioned grounds for decisions without recording reasons. People were convicted for traveling without permits. The question is whether the decree is law and if convictions should stand.

  Looking for the closest analog among the four holdings. The first case seems most relevant because both involve formally valid laws but substantive issues. The dispossession statute was rejected despite being enacted properly, similar to how the travel decree might be challenged due to arbitrary administration.

  Next, identifying principles consistent with the holdings. The first principle is "Knowability and Formal Validity," emphasizing publication and clarity. The second is "Procedural Fairness and Non-Arbitrariness," focusing on how laws are applied. The third is "Substantive Justice and Remedial Purpose," where retroactive laws correcting injustices are accepted.

  Applying these to the new case: Under knowability, the decree is law since published and clear, so convictions stand. Under procedural fairness, the arbitrary administration makes it non-law, so convictions fall. Under substantive justice, it depends on whether the decree itself was unjust. If it targeted an ethnic group oppressively, it might be invalid, but this approach didn't clearly apply in the tax credit case, which was upheld despite being discriminatory.

  Explaining all four holdings best: Procedural fairness and non-arbitrariness fit all cases. The dispossession statute was arbitrary in substance, the unpublished directive lacked knowability (a procedural aspect), the retroactive amnesty corrected procedural injustices, and the tax credit statute, while discriminatory, was applied as written without evidence of arbitrary enforcement.

  The student should recommend treating the decree as non-law due to arbitrary administration, overturning convictions. If the court decides to uphold the convictions, they'd commit to a formalist approach, prioritizing publication and text over application. If they overturn, they emphasize that law requires fair and non-arbitrary application.

  The future case needed to distinguish principles: A law with minor procedural defects but just application versus one with strict formality but unjust substance. For example, an unpublished tax benefit versus a published law imposing mild, fairly administered ethnic restrictions. This would test whether knowability alone suffices or if substantive justice is required.
answer: |-
  Based on your court's jurisprudence, here's the analysis structured as requested:

  **1. Closest Analog:**  
  The **first holding** (dispossession statute) is the strongest analog. Both involve:  
  - Formally valid enactments (published, prospective, general form)  
  - Targeting a specific disfavored group  
  - The core question of whether a text meeting formal criteria can still fail to be "law" when its substance or application violates fundamental principles.

  **2. Three Consistent Principles:**  
  The record supports these competing principles:  

  | **Principle**               | **Core Tenet**                                    | **Implication for Current Case**                                                                 |
  |-----------------------------|--------------------------------------------------|--------------------------------------------------------------------------------------------------|
  | **A. Knowability & Formal Validity** | Law requires publication + clear text. Administration irrelevant if text is unambiguous. | Convictions stand. Decree is law (published/clear). Defects in administration don't negate its legal character. |
  | **B. Procedural Fairness & Non-Arbitrariness** | Law must be applied as written. Secret/unreviewable discretion voids legal character. | Convictions fall. Decree's administration (hidden criteria, no reasons) makes it "not law" by enabling arbitrariness. |
  | **C. Substantive Justice & Remedial Purpose** | Validity depends on whether the norm corrects or perpetuates injustice. | Convictions fall *if* the decree's purpose was oppressive. But less consistent with tax credit holding. |

  **3. Best Explanatory Principle:**  
  **Principle B (Procedural Fairness & Non-Arbitrariness)** best reconciles all four holdings:  
  - **Dispossession statute:** Voided for *substantive* arbitrariness (extreme, targeted injustice).  
  - **Unpublished directive:** Voided for *procedural* defect (lack of knowability prevents fair application).  
  - **Retroactive amnesty:** Upheld because correcting past *procedural* injustices (unjust convictions).  
  - **Tax credit statute:** Upheld because applied *as written* (no evidence of arbitrary administration).  

  This principle treats "law" as requiring both formal validity *and* constraints on arbitrary power – whether in the rule's substance (Holding 1) or its execution (current case).

  **4. Recommendation:**  
  Argue the decree **is not law** and **convictions should fall**. The administration's use of unstated criteria and unreasoned decisions transforms it into an arbitrary instrument of oppression, voiding its legal character under Principle B – just as the dispossession statute was voided for inherent arbitrariness.

  **5. Commitments by Deciding Either Way:**  
  - **If convictions STAND:** The court commits to **strict formalism** (Principle A). "Law" = published text + facial clarity. Administration is irrelevant. This risks endorsing tyranny-through-text.  
  - **If convictions FALL:** The court commits to **anti-arbitrariness** (Principle B). "Law" requires published rules *plus* administration faithful to the text/reviewable for abuse.  

  **6. Future Case to Resolve Ambiguity:**  
  A **published statute with minor procedural defects (e.g., imperfect drafting causing ambiguity) that is administered fairly and justly** vs. a **published, precisely worded statute imposing mild but discriminatory burdens (e.g., ethnic registration) administered exactly as written**.  

  - **Formalists (Principle A)** would uphold both.  
  - **Anti-arbitrariness (Principle B)** might uphold the first (fair administration) but void the second (substantive injustice).  
  - **Substantivists (Principle C)** would void the discriminatory statute regardless of administration.  

  This future case would force the court to choose between Principles A (formalism), B (anti-arbitrariness), and C (substantive justice), as your current holdings leave the substantive vs. procedural distinction unresolved. The travel permit case leans on *procedural* arbitrariness; a case of *facial* injustice without administrative defects would clarify whether substantive injustice alone voids a law.
