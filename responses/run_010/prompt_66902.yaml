  ### The Allais Paradox Poem
  **Title: The Certainty and the Chance**

  #### First Stanza:  
  I'll take the million, safe and warm—  
  No crack within the vault.  
  It builds a house, shields from the storm,  
  And steadies every fault.  
  Or tempt the dice: ten coins to win  
  Five gleaming stacks instead,  
  While eighty-nine still usher in  
  That million, roof o'erhead.  
  But one lone face, a hollow gust,  
  Could rip the walls apart.  
  My hand won't tremble, holds the trust:  
  The certain owns my heart.  

  #### Second Stanza:  
  I'll take the million? Gone, that balm—  
  No shield against the frost.  
  Eleven coins might grant the calm,  
  But eighty-nine are lost.  
  Or tempt the dice: ten coins to win  
  Five gleaming stacks, up high,  
  While ninety voids let darkness in—  
  No roof beneath the sky.  
  My hand now leaps, ignores the cost:  
  The dream commands the dart.  

  ### Commentary on Interpretation
  I leaned primarily on the **certainty effect** reading: the psychological weight of guaranteed security in the first stanza makes the 1% risk of ruin intolerable, but when that certainty is removed (along with the shared 89% safety net), the marginal difference between 11% and 10% feels negligible, so the higher reward dominates. This aligns with Kahneman and Tversky’s prospect theory, where losses loom larger near certainty.  

  **Confidence**: I’m ~85% confident this captures a core driver—the certainty effect is robust in empirical studies and mirrors how people describe aversion to "sure loss" trade-offs. The poem’s sensory anchors (roof, walls) make the abstraction tangible.  

  **Least confident line**: *"But eighty-nine are lost"* (second stanza, line 4). It risks implying the 89% was merely *relocated* rather than *cancelled*, which might muddy the "surgical removal" conceit. The line’s clinical tone could undercut the emotional shift, though it avoids explicit rationalization.  

  ---  
  **Handout note**: Pair this with a silent reread of the two-column table. The poem’s structural mirror—identical meter, rhyme, and line count, with the 89% "roof" literally vanishing—forces the cancellation into the reader’s gut. The speaker’s flipped choice becomes a felt paradox, not a fallacy.
