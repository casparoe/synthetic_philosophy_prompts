answer: |-
  ### Brainstorm: Spurious Argument Example  
  Consider a naive "proof" that all sufficiently large even numbers violate the Goldbach conjecture:  
  1. For a random even \(n\), presume "\(n - p\) prime" is independent across primes \(p \leq n/2\) (default independence).  
  2. Probability \(n - p\) is prime is \(\sim 1/\log n\) (prime number theorem).  
  3. Expected number of representations \(n = p + q\) is \(\sim \frac{n}{2 \log^2 n} \to \infty\), suggesting abundant solutions.  
  4. **But** wait: If \(n \equiv 2 \pmod{3}\), then \(p \equiv 1 \pmod{3}\) forces \(q \equiv 1 \pmod{3}\), creating dependency. Chain many such mod-\(m\) conditions.  
  5. Artificially restrict to primes \(p \equiv a_i \pmod{m_i}\) with incompatible \(a_i\), making all \(n - p\) composite. Accumulate defaults to "show" no representations exist for infinitely many \(n\).  
  **Which component catches it?**  
  - **H1** blocks it: Exhausting mod-\(m\) correlations reveals the forced dependencies.  
  - **H3** flags it: Each dubious independence adds uncertainty, making the conclusion implausible.  

  ---

  ### Ratings (Coverage / Resistance)  
  | **Component** | **Coverage** | **Resistance** | **Rationale** |  
  |---------------|--------------|----------------|--------------|  
  | **H1** (Local exhaustion) | 9 | 7 | Covers prime tuples, Diophantine densities. Misses non-congruence correlations (e.g., Mertens function heuristics). |  
  | **H2** (Truncated cumulants) | 5 | 6 | Poor coverage: Cumulants rarely computed in practice (e.g., prime gaps). Resists low-complexity spurious args but fragile to higher-order traps. |  
  | **H3** (Presumption budget) | 4 | 9 | Murderous to coverage: Legitimate estimates (e.g., Hardy-Littlewood) use many defaults. Superb resistance: Spurious chains require untenable uncertainty. |  
  | **H4** (Counterargument stability) | 7 | 8 | Good coverage (admits stable estimates). Strong resistance but computationally suspect. Fails on Mertens where short refutations exist. |  
  | **H5** (Restricted self-ref) | 6 | 8 | Necessary for resistance (blocks diagonalization). Hurts coverage if self-referential heuristics exist (rare). |  
  | **H6** (Model relativization) | 8 | 7 | Best coverage: Mirrors practice (e.g., "Cramér model"). Resistance relies on separate scoring; may not block clever meta-arguments. |  

  ---

  ### Tier List (S > A > B > C)  
  - **S-Tier**: **H6** (Model relativization)  
    *Why*: Decouples independence from reality, aligning with mathematical practice while enabling empirical refinement.  
  - **A-Tier**: **H1** (Local exhaustion), **H3** (Presumption budget)  
    *Why H1*: Essential for congruence-heavy problems; balances coverage/resistance. *Why H3*: Gold standard for resistance but maims coverage.  
  - **B-Tier**: **H4** (Counterargument stability), **H5** (Restricted self-ref)  
    *Why H4*: Desideratum for robustness, but tractability concerns. *Why H5*: Critical defense, but narrow scope.  
  - **C-Tier**: **H2** (Truncated cumulants)  
    *Why*: Theoretically elegant but alien to existing heuristics; low coverage.  

  **Desiderata vs. Mechanisms**:  
  - H4 is a **desideratum** (stability goal).  
  - Others are **mechanisms**.  

  **Tensions**:  
  - **H1 vs. H3**: Exhaustion (H1) minimizes defaults needed, while budgets (H3) penalize each default. Tension is **suspected** (not proven): H1 reduces H3’s uncertainty, but H3 may still overpenalize necessary defaults in complex cases.  
  - **H4 vs. Tractability**: Direct tension; stability against all short arguments may require **NP-hard** verification.  

  **Computational Intractability**:  
  - **H4** likely **cannot** run in polynomial time. Checking all arguments of length \(\leq L\) for \(\epsilon\)-impact is **coNP-hard** (resembles proof checking).  

  ---

  ### Subjective Probability  
  **Probability that an efficient, non-dogmatic, covering, resistant estimator exists: 0.3**  
  *Rationale*: The trinity of coverage (requires permissiveness), resistance (requires restrictiveness), and efficiency seems infeasible. H6 offers a path via empirical model-testing, but automating "adequate scoring" of model-reality alignment is deeply unsolved. Resistance to self-referential attacks (H5) and spurious chains (H3) further strains tractability. Viability hinges on sacrificing one axis—likely full coverage.
