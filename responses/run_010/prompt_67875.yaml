  Hmm... the user is clearly deep in meta-ethical territory. They're not just asking for definitions but for evaluative criteria to test theories against. The mention of "non-negotiable" vs "camp-specific" desiderata suggests they need to map the philosophical landscape rigorously. 

  Let me structure this systematically. The desiderata should cover:
  - Ontological status (do dilemmas exist?)
  - Phenomenology (how agents experience conflict)
  - Logical constraints (deontic consistency)
  - Epistemic dimensions (evidence-relative vs fact-relative)
  - Post-conflict residue

  The nurse case is perfect because it eliminates common escapes: no weighing asymmetry, no future discharge possible, and obligation bearers outlive obligation recipients. Smart case design.

  For non-negotiables, most camps accept deontic logic must be addressed and that phenomenological accuracy matters. But pro-dilemma views will insist on residue while anti-dilemma views demand consistency at all costs. The epistemic desideratum likely divides utilitarians from deontologists.

  The killer requirement is probably "Residual Obligation" - it forces either denying dilemmas exist (painful for phenomenology) or revising deontic logic (painful for formalists). Hence its exclusionary power. 

  Noticing tension between Consistency and Residue: if obligations persist post-violation, how can "ought implies can" hold? This might be the unsolvable knot. Also, Persistence clashes with views that choice dissolves conflict.

  For the scorecard... Williams' regret argument scores high phenomenologically but low logically. Ross-like pluralism handles symmetry but not residue. Divine command theories might dodge logic issues via God's will but struggle with epistemic access. 

  User's phrasing suggests they're preparing to demolish weak positions. Should emphasize which desiderata create catch-22s. The nurse case particularly devastates temporal escape hatches (e.g., "oughts are time-indexed" fails when death eliminates temporal windows).

  Must flag that "identical in kind" matters - if promises were different types (e.g., fidelity vs beneficence), some theories could prioritize. But here, symmetry blocks that.
answer: |-
  Here are the desiderata for any account of moral conflict, calibrated to your nurse case and the core philosophical issues, categorized by motivation and negotiability. Each includes its rationale and relation to your case.

  ---

  ### **Core Desiderata** (Broadly Non-Negotiable)
  1.  **Consistency Constraint**:
      *   *What it demands*: The account must specify its stance on deontic logic principles (e.g., Ought-Implies-Can, Agglomeration [Op & Oq → O(p&q)], No-Consistent-Conjunction [~(Op & O~p)]).
      *   *Motivation*: Necessary for systematicity and avoiding logical contradictions (e.g., "You must do A and you must do ~A" is formally inconsistent). *Your Case:* The symmetrical, unfulfillable obligations challenge these principles directly.
      *   *Negotiability*: **Non-negotiable** that the account *addresses* this. *How* it addresses it (accepting contradiction, revising logic, denying dilemma) varies by camp.

  2.  **Phenomenological Accuracy (Conflict Recognition)**:
      *   *What it demands*: The account must explain the *experience* of inescapable moral failure and deep regret/remorse agents feel in dilemma-like situations.
      *   *Motivation*: Moral theories should resonate with core human moral experiences; dismissing this as mere error is unsatisfying. *Your Case:* The nurse's anguish reflects this recognition.
      *   *Negotiability*: **Non-negotiable** that the account *explains* the phenomenology. Anti-dilemma views must explain it away (e.g., as epistemic error or irrational guilt).

  3.  **Action Guidance (Resolution Requirement)**:
      *   *What it demands*: The account must provide a way to determine what the agent *should do* in the moment of conflict, even if all options are bad.
      *   *Motivation*: Ethics must guide action. Agents need to know how to act, even imperfectly. *Your Case:* The nurse must choose (or not act) in the moment.
      *   *Negotiability*: **Non-negotiable.** All camps must offer *some* decision procedure, even if it concludes "choose arbitrarily" or "either act is permissible".

  ---

  ### **Problem-Specific Desiderata** (Often Camp-Dependent)
  4.  **Symmetry Handling**:
      *   *What it demands*: The account must explain how conflicts are resolved (or experienced) when obligations are identical in kind and weight, precluding "weighing" or lexical ordering.
      *   *Motivation*: Not all conflicts involve easily commensurable values or duties. *Your Case:* Two identical promises, same weight.
      *   *Negotiability*: **Camp-specific.** Pro-dilemma views embrace symmetry as proof of irresolvability. Weighing/ranking views (e.g., some consequentialisms, lexical deontology) must deny symmetry is possible or introduce hidden asymmetry. "Tragic choice" views accept symmetry's significance.

  5.  **Persistence**:
      *   *What it demands*: The account must explain the status of the conflicting obligations *after* the moment of choice when *neither* obligation can be fulfilled.
      *   *Motivation*: Obligations often seem to persist beyond the moment of choice if unfulfilled. *Your Case:* Both promises remain unfulfilled after the son leaves/dies; the opportunity is permanently lost.
      *   *Negotiability*: **Strongly camp-specific.** Pro-dilemma views see this as evidence of genuine residue/ongoing failure. Anti-dilemma views often see obligations as extinguished by impossibility (Ought-Implies-Can) or by the agent's choice resolving the conflict.

  6.  **Residual Obligation (Residue)**:
      *   *What it demands*: Does the agent retain any moral obligation (e.g., to make amends, seek forgiveness, feel remorse) concerning the unfulfilled duty *even when fulfillment is impossible* and *there is no recipient*?
      *   *Motivation*: Captures the intuition that moral failure has lasting consequences for the agent, even if reparation is impossible. *Your Case:* The nurse owes something to the dead men (apology? remembrance?) despite their inability to receive it.
      *   *Negotiability*: **Highly camp-specific.** Central to pro-dilemma views ("remainder", "dirty hands"). Often denied by anti-dilemma views (obligation extinguished) or utilitarian views (only consequences matter; no recipient = no residue).

  7.  **Epistemic vs. Fact-Relative Genuineness**:
      *   *What it demands*: Can a conflict be genuine *for the agent* (based on their evidence/beliefs) even if not genuine relative to the unknown facts (e.g., one obligation was void)? Conversely, can a conflict be genuine relative to the facts but not relative to the agent's evidence?
      *   *Motivation*: Separates subjective experience from objective reality. Important for assessing blameworthiness. *Your Case:* Suppose, unknown to the nurse, the son had already found out elsewhere (voiding one promise) – was her experienced dilemma genuine? Or vice-versa.
      *   *Negotiability*: **Camp-specific.** Views emphasizing subjective experience or blameworthiness (e.g., Williams) focus on epistemic genuineness. Views emphasizing objective rightness focus on fact-relative status. Most sophisticated views need to distinguish both levels.

  ---

  ### **Key Tensions & The Excluder**
  *   **The Single Most Exclusionary Requirement:** **Residual Obligation (Desideratum 6).** This is the hardest for anti-dilemma views to accommodate. It directly challenges the finality of Ought-Implies-Can and the idea that choice resolves the normative situation. Views denying residue struggle profoundly with the phenomenology of lasting guilt and the intuition of a persisting "debt" even when payment is impossible to the creditor.
  *   **Joint Unsatisfiability?** The most significant tension is between:
      1.  **Consistency Constraint (1)** (especially No-Consistent-Conjunction & Ought-Implies-Can)
      2.  **Residual Obligation (6)** and **Persistence (5)**
      Holding *both* that (a) it's logically impossible to have two genuinely conflicting, unfulfillable "oughts" *and* (b) that such conflicts leave a persisting residue of unfulfilled obligation, is deeply problematic. Pro-dilemma views typically bite the bullet on (a), revising logic or accepting contradiction. Anti-dilemma views deny (b) and often (5).

  ---

  ### **Brief Scorecard of Main Contenders vis-à-vis Desiderata**
  *   **Standard Deontic Logic (SDL) / Anti-Dilemma (e.g., some Kantians):**
      *   *Pro:* Strong on (1) Consistency (denies possibility).
      *   *Con:* Weak on (2) Phenomenology (dismisses regret as irrational), (5) Persistence (obligations extinguished), (6) Residue (none), struggles with (4) Symmetry (must find asymmetry). Denies (7) Epistemic Genuineness matters fundamentally.
  *   **Moral Pluralism / Pro-Dilemma (e.g., Rossian, Williams, "Dirty Hands"):**
      *   *Pro:* Strong on (2) Phenomenology, (4) Symmetry (highlights it), (5) Persistence, (6) Residue.
      *   *Con:* Must revise/reject SDL to handle (1) Consistency (accepts contradiction or revises logic). (3) Action Guidance may be weak ("tragic choice"). Emphasizes (7) Epistemic Genuineness.
  *   **Consequentialism (Act/ Rule):**
      *   *Pro:* Strong on (1) Consistency (denies dilemma via single "ought"), (3) Action Guidance (optimize outcome), often denies (4) Symmetry (hidden weights).
      *   *Con:* Weak on (2) Phenomenology (regret as irrational/disutility), (5) Persistence (duty fulfilled if best outcome chosen), (6) Residue (none beyond consequences), struggles with (7) if facts/epistemology diverge sharply from expected utility.
  *   **Divine Command / Subjectivism:**
      *   *Varies:* Depends on the commander/subject. Can embrace dilemmas easily but may struggle with (1) Consistency unless Commander's will is paradoxical. (6) Residue depends on Commander's/subject's view.

  ---

  This framework forces accounts to confront the hardest aspects of your nurse case: symmetry, permanence of failure, residue without a recipient, and the clash between logic and moral experience. Desideratum 6 (Residual Obligation) is the most potent filter, starkly dividing pro and anti-dilemma camps. The tension between Consistency and Residue/Persistence is the core philosophical battleground.
