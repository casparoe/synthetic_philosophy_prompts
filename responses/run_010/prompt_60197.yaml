prompt: |-
  I am trying to establish whether my verdicts in a family of cases, all of them turning on irrationality that seems to pay, add up to anything coherent. Here they are, in my own terms.

  1. My car dies in the desert. The only passing driver will take me home if I promise to pay him on arrival; he is an uncanny judge of whether such a promise is sincere, and he leaves the insincere to die. Once home, he has no way of tracing me and nothing I do can be discovered. I judge that handing over the money then would be irrational — it costs me and buys nothing — yet I also judge that I would have been rational to be someone who hands it over, and I do not blame the payer; if anything I admire him.

  2. A large sum lands in my account tomorrow morning provided that at midnight tonight I intend to drink something tomorrow afternoon that will make me wretched for a day and leave no lasting effect. I am free to change my mind afterwards, and nobody will ever learn whether I drank. I judge that I cannot get the money, and that I ought not to try to make myself drink it.

  3. A threat that would be ruinous to execute, and that works only because everyone knows executing it would be ruinous. I judge the making of it rational and the execution irrational, and I feel no pressure to revise either verdict in light of the other.

  4. A friend cultivates a hot temper because people concede to him. Cultivation: rational. Outbursts: irrational. Blame: none.

  5. A colleague takes something that she knows will make her irrationally attached to a project, so that she will see it through. Halfway in, abandoning it would plainly serve her better, and she does not abandon it. Here I say the opposite of case 1: not abandoning it is rational, full stop — not irrational-but-admirable.

  Cases 5 and 1 strike me as the same shape — a standing state produces an act that is worse for the agent at the moment of acting — and my verdicts run in opposite directions. The only difference I can offer is that in 5 she installed the state deliberately and knowingly, whereas in 1 the disposition was simply there, selected by other people's ability to see it. I cannot say why that should matter, and I suspect it should not. One further intuition, which may be irrelevant: I think a person who declines to cultivate a payoff-producing state like my friend's temper has made a mistake, but I also think this should not be said out loud, because if everyone believed and announced it, the states would stop paying off.

  What principle, or short set of competing principles, delivers the most of this? I would like it stated precisely enough that I can apply it unaided, with the case that motivates each clause; its verdicts on two cases I have not listed — whether payment in case 1 becomes rational if the driver can trace me, and whether it is rational to undergo a painless procedure that installs a costly-promise-keeping disposition visible to everyone I deal with, even if I would end up worse off than if I declined; an explicit statement of which of my five verdicts must go if I want the simplest coherent account, and what that account costs; and whether the distinction between self-installed and merely possessed states has any content at all or should be dropped. Finally, say whether the resulting principle can be recommended publicly, given my last intuition. I want the principle and its reasoning, not a bibliography.
reasoning: |-
  Hmm, the user is presenting a fascinating set of thought experiments about rationality, all involving scenarios where irrational behavior seems beneficial. They want a coherent principle that explains their specific judgments across these five cases, and they have several detailed requirements for how I should formulate this principle.

  Looking at their cases: In the desert promise case, they think breaking the promise is rational but admire those who keep it. In the money-for-intention case, they reject pursuing the money. For threats, they see making threats as rational but executing them as irrational. For cultivated temper, they approve the cultivation but not the outbursts. And crucially, in the project attachment case, they see persisting as rational - opposite to the promise case despite similar structure.

  The key tension is between cases 1 and 5 - both involve standing states leading to suboptimal actions, but they judge them differently based on whether the state was deliberately installed. They suspect this distinction might not hold water and want me to test it.

  I need to build a principle around strategic rationality - where actions are evaluated not just by immediate payoff but by their role in maintaining valuable dispositions. The desert promise fails because the disposition isn't strategically valuable to that individual anymore, while in the project case the disposition is actively maintained for future benefits. 

  For their additional questions: If the driver could trace you, payment becomes rational (instrumental value). Installing a costly-promise disposition would be rational only if benefits outweigh costs across all interactions. The distinction between self-installed and natural states does matter strategically. And yes, this principle can be publicly recommended - it actually explains why we shouldn't openly advocate cultivating all beneficial irrationalities.

  The simplest coherent account would require flipping either the case 1 or case 5 verdict. I'd suggest flipping case 5: seeing project persistence as irrational-but-admirable would create symmetry with case 1, though it conflicts with their current intuition. The cost is losing the neat rationality-of-commitment narrative they have for case 5.

  This approach preserves most of their judgments while resolving the tension between cases 1 and 5 through a unified strategic framework.
answer: |-
  Here is a coherent principle set capturing your core intuitions, followed by explicit answers to your requirements. The key is **Strategic Rationality of Dispositions (SRD)**:

  ### Principle: Strategic Rationality of Dispositions (SRD)
  1.  **An action is instrumentally rational *at the moment of choice* if it maximizes the agent's expected payoff given their current preferences and beliefs.** (Baseline instrumental rationality)
  2.  **A *disposition* (a stable tendency to act in certain ways across situations) is instrumentally rational if cultivating or maintaining it maximizes the agent's expected payoff *across the range of situations where it operates*, accounting for the costs/benefits of the disposition itself and its predictable effects on others' behavior.** (Strategic level)
  3.  **An action driven by a rationally maintained disposition is *praiseworthy* (or "admirable") if:**
      a.  The action is irrational *at the moment* (violates 1), *but*
      b.  The disposition producing it is rational (satisfies 2), *and*
      c.  The agent did not deliberately trigger the specific situation *knowing* the disposition would force an irrational act they could otherwise avoid.

  ### Application to Your Cases
  1.  **Desert Promise:**
      *   *Paying:* Irrational (violates 1: costs money, no benefit now).
      *   *Disposition:* Rational (satisfies 2: having it saved your life in the desert; its *existence* is beneficial overall).
      *   *Verdict:* Irrational but praiseworthy (satisfies 3a,b,c). You admire the payer because their disposition is strategically rational and saved them.
  2.  **Money for Intention:**
      *   *Getting the money:* Requires intending to drink *now*, then drinking *later*.
      *   *Intending now knowing you can/will change mind:* Instrumentally irrational (violates 1: forming an intention you know you'll break gains nothing; the money requires *sincere* intention).
      *   *Drinking later:* Instrumentally irrational (violates 1: makes you wretched for no gain).
      *   *Disposition to form such intentions?* Irrational (violates 2: cultivating a disposition to form insincere intentions you *know* you'll break gains nothing; the mechanism detects sincerity).
      *   *Verdict:* Cannot get money rationally, ought not try (Disposition isn't rational; actions required aren't rational).
  3.  **Threat:**
      *   *Making Threat:* Rational (satisfies 1: likely deters attack, low cost if credible).
      *   *Executing Threat:* Irrational (violates 1: ruinous cost, no benefit now - attack already happened).
      *   *Disposition to execute if attacked?* Rational (satisfies 2: *having* the credible disposition deters attack, maximizing overall payoff). *Cultivating* the disposition is rational.
      *   *Verdict:* Making rational, executing irrational, no revision pressure (Executing is irrational moment-by-moment (1) but driven by a rational disposition (2). Praiseworthiness (3) isn't central here; the focus is strategic value of the *threat* disposition).
  4.  **Friend's Temper:**
      *   *Cultivating Temper:* Rational (satisfies 2: disposition yields net benefits through concessions).
      *   *Outbursts:* Irrational (violates 1: harmful to relationships/well-being *in the moment*, concessions already extracted).
      *   *Verdict:* Cultivation rational, outbursts irrational, no blame (Outbursts are irrational (1) but driven by a rational disposition (2) & likely satisfy 3c - he doesn't *intend* specific outbursts to extract concessions, the disposition operates automatically).
  5.  **Project Attachment Pill:**
      *   *Taking Pill:* Rational (satisfies 2: disposition yields net benefit through project completion).
      *   *Not Abandoning:* Instrumentally irrational (violates 1: worse for her *at that moment*).
      *   *Verdict Conflict:* You *want* to say "Not abandoning is rational, full stop." **SRD says:** Not abandoning is irrational moment-by-moment (1) but driven by a rational disposition (2). It *should* be praiseworthy (like Case 1) if 3c holds (she didn't deliberately trigger the halfway crisis knowing the pill would force her to persist irrationally). **To achieve coherence under SRD, your Case 5 verdict *must go*.** Persisting is irrational but admirable, driven by a beneficial disposition she rationally installed.

  ### Resolving the Case 1 vs. Case 5 Tension
  *   **SRD Verdict:** Both paying (1) and persisting (5) are *irrational at the moment* (violate Rule 1). Both dispositions (promise-keeping, project-persistence) are *rational* (satisfy Rule 2). Both actions *should* be praiseworthy under Rule 3.
  *   **Your Intuition:** You distinguished them based on *how the disposition was acquired* (deliberate installation vs. pre-existing).
  *   **SRD's View:** The *acquisition method* is relevant *only* to Rule 2 (was cultivating/maintaining it rational?). Once the disposition exists rationally, its *output actions* are judged the same way (Rule 1 vs. Rule 3). **The distinction lacks content for judging the *action* itself.** Rule 2 already accounts for acquisition costs/benefits. Rule 3c handles deliberate triggering of bad situations.

  ### Answers to Specific Queries
  1.  **Payment if Driver Can Trace Me?**
      *   *Verdict:* **Rational** (satisfies Rule 1). Paying now avoids future punishment/retaliation (a clear current benefit). The disposition's strategic value (Rule 2) becomes less relevant for *this specific action*.
  2.  **Install Painless "Costly-Promise-Keeper" Disposition?**
      *   *Verdict:* **Rational only if the *net expected benefit* (discounted future gains from others trusting the disposition minus the expected costs of future irrational payments) exceeds the cost of declining the procedure.** (Applies Rule 2). If the net benefit is negative, it's irrational. The visibility is crucial – it enables the trust benefits. "Worse off than if declined" implies net negative benefit, hence irrational.
  3.  **Simplest Coherent Account & Cost:**
      *   **Principle:** SRD (as above).
      *   **Verdict that Must Go:** Your "Not abandoning is rational, full stop" verdict in **Case 5**.
      *   **Cost:** You lose the neat "rationality of commitment" narrative for the *action* in Case 5. Persisting becomes *instrumentally irrational but strategically admirable*, just like paying in Case 1. This might feel less satisfying for deliberate commitments.
  4.  **Distinction (Self-Installed vs. Possessed):**
      *   **Content:** It has content *only* for assessing the *rationality of the disposition* (Rule 2). Deliberate installation involves upfront costs/risks that must be justified by future benefits. A pre-existing disposition might have no acquisition cost. **It has *no* direct bearing on judging the *rationality of the action* (Rule 1) or its praiseworthiness (Rule 3).** It should be dropped for those judgments.
  5.  **Public Recommendation:**
      *   **Yes, SRD can be publicly recommended.** It *explains* your last intuition (cultivating beneficial irrationalities shouldn't be universally advocated). Rule 2 depends on the disposition being *detectable* by others and influencing *their* behavior beneficially. If everyone believes/knows people cultivate these dispositions purely for strategic gain (and announces it), the dispositions often lose their power (e.g., threats become incredible, "temper" is seen as manipulation, promises seem insincere). SRD inherently incorporates the strategic interplay and explains why universal cultivation isn't rational – it often undermines the very benefit the disposition provides. Publicly advocating SRD might slightly weaken the effect, but the principle itself predicts and accounts for this strategic vulnerability.

  ### Summary of SRD's Verdicts
  | Case | Action (Moment) | Disposition | Verdict on Action | Verdict on Disposition |
  |------|-----------------|-------------|-------------------|------------------------|
  | 1. Desert Promise | Paying: ❌ (Irrational) | Keeping Promises: ✅ (Rational) | Irrational but Praiseworthy | Rational to maintain |
  | 2. Money for Intention | Forming Intent/Drinking: ❌ (Irrational) | N/A (No stable disposition) | Irrational | Not applicable |
  | 3. Threat | Making: ✅ (Rational) | Executing Threats: ✅ (Rational) | Making: Rational | Rational to cultivate |
  |      | Executing: ❌ (Irrational) |                     | Executing: Irrational |                        |
  | 4. Temper | Cultivating: ✅ (Rational) | Having Temper: ✅ (Rational) | Cultivating: Rational | Rational to cultivate |
  |          | Outburst: ❌ (Irrational) |                     | Outburst: Irrational |                        |
  | 5. Project Pill | Taking Pill: ✅ (Rational) | Project Persistence: ✅ (Rational) | Taking Pill: Rational | Rational to install |
  |                | Persisting: ❌ (Irrational) |                     | Persisting: Irrational but Praiseworthy |                        |

  SRD delivers all your verdicts except the "rational full stop" for persisting in Case 5, replacing it with "irrational but praiseworthy" to achieve coherence with Case 1. It provides a unified framework based on distinguishing moment-by-moment instrumental rationality from the strategic rationality of dispositions, with praiseworthiness bridging the gap when actions are irrational moments driven by beneficial dispositions not deliberately misused.
