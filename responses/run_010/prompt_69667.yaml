answer: |-
  ## Postdoctoral Research Proposal: Fixing the Frame - Act-Descriptions and the Inefficacy Objection in Normative Ethics

  **1. Research Question:**

  What principle or set of constraints determines the *granularity of description* under which an act should be evaluated for moral permissibility when facing the inefficacy objection, such that the description neither arbitrarily precludes nor guarantees a finding of wrongness based on causal impact?

  *   **Precision:** The question seeks the rule governing *how* we pick the relevant act-type ("buying *this* steak" vs. "eating meat" vs. "participating in industrial animal agriculture"). It demands an account that specifies the appropriate level of abstraction or specificity for moral evaluation in inefficacy contexts, distinct from simply applying existing normative theories (like consequentialism or deontology) *to* a pre-given description.
  *   **Determinate Answers:** Possible answers include: the description must match the *causal structure* of the harm; it must reflect the *agent's genuine control unit*; it must mirror the *description used in deliberation*; a *pluralism* where multiple descriptions are valid and choice is pragmatic; or a novel principle proposed by the project.

  **2. Why the Five Families Leave the Question Open:**

  The five families of replies to the inefficacy objection *presuppose* a specific act-description rather than providing a principled account for selecting it. They answer "Is act X wrong?" under a *given* description X, but fail to address "Under *which description X* should we evaluate the act?"

  *   **Causal Replies (Probabilistic, Threshold, Cumulative):** These rely entirely on the causal consequences *under a specific description*. They become compelling only if the act is described at a granularity where causal chains *can* be plausibly traced (e.g., "contributing to industry demand" for meat, not "purchasing *this* specific steak"). They offer no guidance *for* choosing that granularity.
  *   **Non-Effectivist Replies:** These deliberately decouple wrongness from causal difference-making. While they can condemn "buying this steak" under *that* description, they offer no inherent constraint on *which* description should bear the weight of their non-effectivist criteria (e.g., why condemn *this purchase* for complicity rather than the broader practice?).
  *   **Relocating Replies:** These shift focus from the individual act to collective obligation. However, they still need to define the relevant collective and the nature of participation/abstention. The description of the *individual act* ("not voting" vs. "failing to participate in collective civic duty") remains central and ungrounded. They don't specify *which* individual acts constitute the relevant failure/success of collective action.
  *   **Conclusion:** All five families provide answers *conditional* on a specific act-description being chosen. They are candidates for *evaluating* an act under a description, but not candidates for *determining the description itself*. The debate stalls because proponents argue past each other, implicitly relying on different, unchosen descriptions. None directly answers the question of *how* to fix the frame.

  **3. Candidate Constraints on Act-Description & Project Focus:**

  The project will develop and critically assess the following candidate constraints for fixing act-description granularity:

  1.  **Causal Structure Constraint:** The description must correspond to the fundamental causal units within the harm mechanism (e.g., continuous marginal contribution, discrete threshold trigger, collective agency structure).
  2.  **Control Constraint:** The description must reflect the most fine-grained unit over which the agent exercises direct, intentional control (e.g., "flipping this light switch" vs. "lighting the room").
  3.  **Deliberative Constraint:** The description must match the primary description(s) under which the agent herself deliberates and understands her action.
  4.  **Pragmatic Pluralism:** Multiple descriptions are potentially legitimate; the choice depends on the specific normative question, context, or purpose of evaluation (e.g., assigning blame vs. guiding future action).

  **Project Focus:** The project will take the **Causal Structure Constraint** most seriously as the primary investigative strand. This is motivated by the intuition that the *nature of the harm* should fundamentally shape how we describe the acts contributing to it. An account that ignores the causal reality of the harm risks arbitrariness.

  **Deciding Between Constraints:** The project will evaluate the candidates based on:
      *   **Internal Consistency & Coherence:** Does the constraint generate a clear, non-arbitrary description across diverse cases?
      *   **Avoidance of Verdict Manipulation:** Does it prevent agents/theorists from simply selecting the description that yields their desired moral outcome?
      *   **Fit with Normative Intuitions:** Can it ground plausible verdicts in core test cases without excessive revisionism?
      *   **Explanatory Power:** Does it best explain why certain descriptions feel intuitively "right" or "wrong" in specific inefficacy scenarios?
      *   **Tractability:** Can it be operationalized for analysis?

  **4. Staged Work Plan (18 Months):**

  *   **Months 1-3: Foundational Analysis & Constraint Elaboration:**
      *   Detailed conceptual mapping of the inefficacy objection landscape, focusing on the implicit role of descriptions in existing arguments.
      *   Precise formulation of the four candidate constraints, identifying potential strengths, weaknesses, and ambiguities within each (especially the Causal Structure Constraint).
      *   Initial literature review on act-individuation in ethics and philosophy of action.
  *   **Months 4-9: Framework Development & Internal Testing:**
      *   Develop a robust framework for applying the Causal Structure Constraint. Define key concepts (causal unit, harm mechanism type). Build typology of harm structures (continuous marginal, threshold, collective procedural).
      *   Rigorously apply all four candidate constraints to simplified, idealized versions of the three core test cases (flight, meat, vote). Identify points of convergence and divergence in the descriptions generated.
      *   Draft initial chapters/papers articulating the problem and the constraints.
  *   **Months 10-15: Case Study Application & Constraint Evaluation:**
      *   Apply the framework in-depth to the three concrete, realistic test cases, incorporating empirical data where relevant (e.g., emissions models, market elasticity studies, voting mechanics). Focus on the Causal Structure Constraint but systematically compare results with other constraints.
      *   Evaluate each constraint against the criteria outlined in Section 3. Identify which constraints best satisfy the criteria and under what conditions.
      *   Refine the framework based on case study results and evaluation.
      *   Develop analysis of failure conditions.
  *   **Months 16-18: Synthesis, Writing & Dissemination:**
      *   Synthesize findings. Formulate a defensible account of act-description granularity, likely favoring the Causal Structure Constraint but incorporating insights from others (e.g., a constrained pluralism).
      *   Draft core research outputs (journal articles, thesis chapters).
      *   Present findings at a relevant workshop/conference.
      *   Finalize project report and plan future research.

  **5. Framework Testing on Core Cases & Success Conditions:**

  *   **Case 1: Single Long-Haul Flight (Continuous Harm - Climate Change):**
      *   **Test:** Apply constraints. Causal Structure (Continuous Marginal) suggests description like "adding a marginal quantity of CO2e to the atmosphere". Does this yield a tractable evaluation? How does it compare to "taking this flight" (Control/Deliberative) or "participating in aviation emissions" (Broader Causal)?
      *   **Success:** Framework clarifies why "this flight" *can* be meaningfully evaluated as harmful under a marginal contribution model, countering the strongest inefficacy claim. It shows how the continuous causal structure pushes towards a description acknowledging marginal impact.
  *   **Case 2: Single Meal of Factory-Farmed Meat (Threshold/Probabilistic Harm - Animal Suffering):**
      *   **Test:** Apply constraints. Causal Structure likely involves complex thresholds (slaughter batches, farm stocking density adjustments, market signals). Can a description reflecting this probabilistic/threshold nature be specified (e.g., "increasing the likelihood of a marginal production increase")? Contrast with "eating this meal" (Control/Deliberative).
      *   **Success:** Framework demonstrates how a causal-structure-driven description differs significantly from the simple token act, making probabilistic/threshold replies more salient and showing *why* "this steak" might be a misleadingly narrow frame. It provides principled grounds for rejecting or accepting certain descriptions.
  *   **Case 3: Decision Not to Vote in Large Election (Collective Procedure Harm):**
      *   **Test:** Apply constraints. Causal Structure (Collective Procedural) suggests description like "failing to participate in the collective decision procedure". Compare to "not casting a ballot" (Control/Deliberative) or "free-riding on democratic participation" (Non-Effectivist).
      *   **Success:** Framework justifies relocating replies by showing how the causal structure (a decision procedure requiring participation) necessitates a description focused on role-fulfillment within the collective mechanism. It explains why the inefficacy objection seems strongest here and how the description overcomes it. Shows interaction between causal structure and collective duty.
  *   **Overall Success:** The framework generates distinct, principled descriptions for each case type based on the nature of the harm, demonstrating that the inefficacy objection's force is critically dependent on the *prior* choice of description. Success is showing a non-arbitrary method for making that choice.

  **6. Explicit Failure Conditions:**

  1.  **Consequentialist Collapse:** The Causal Structure Constraint (or the framework generally) is found to inherently privilege consequentialist evaluation. If the "correct" description is *always* the one revealing a causal difference (expected, marginal, or threshold), then the framework merely restates act-consequentialism disguised as meta-ethics. The inefficacy objection dissolves only by assuming consequentialism is true. *Mitigation: Actively seek cases where plausible non-effectivist wrongs seem to demand different descriptions; rigorously test if causal structure descriptions preclude non-consequentialist evaluation.*
  2.  **Unfalsifiable Justification:** The framework becomes a tool for rationalizing pre-existing intuitions. If the constraints (especially Pragmatic Pluralism or loose interpretations of Deliberative/Control) are sufficiently flexible, any desired verdict can be achieved by selecting the corresponding description, rendering the framework explanatorily empty. *Mitigation: Demand strict criteria for applying constraints; prioritize generating counter-intuitive results where the framework overrides initial description preferences; emphasize testability against the criteria in Section 3.*
  3.  **Intractable Complexity (Causal Structure):** Defining the "true" causal structure of complex social harms (like meat demand or voting) proves impossible or yields descriptions too vague or multi-layered to be useful for moral evaluation. *Mitigation: Focus on identifying dominant or salient causal mechanisms; accept "best available model" descriptions; compare clarity against other constraints.*

  **7. Scope Assessment: Deliverables and Limitations for 18 Months:**

  *   **Deliverables:**
      *   A fully articulated and defended *problem statement* highlighting the centrality of act-description granularity.
      *   A developed, critically examined *framework* of candidate constraints, with the Causal Structure Constraint receiving the most detailed analysis.
      *   In-depth *analysis* demonstrating the application and implications of the framework for the three core test cases.
      *   A *defensible position* on the relative merits of the constraints and a provisional account of how granularity should be fixed, grounded in the case analyses and evaluation criteria.
      *   Drafts of 2-3 *publishable journal articles*.
  *   **Limitations / Left for Later:**
      *   **Comprehensive Meta-Ethical Justification:** A full defense of why we *need* such a principle, engaging deeply with meta-ethics and philosophy of action foundations, will likely require more space.
      *   **Exhaustive Case Coverage:** Testing beyond the three core cases (e.g., consumer goods, charitable giving, whistleblowing) will be illustrative but not comprehensive.
      *   **Full Integration with Normative Theories:** While implications will be drawn, a complete reconciliation of the framework with all major normative theories (Kantianism, virtue ethics, contractualism) is beyond scope.
      *   **Empirical Research:** The project will utilize existing empirical models but won't conduct new empirical studies (e.g., on consumer behavior or voting dynamics).
      *   **Definitive Resolution:** The project aims for a significant advance in structuring the debate and a strong candidate solution (likely centered on causal structure), but achieving universal consensus on this deeply contested issue is unrealistic in 18 months. It sets the stage for that longer-term engagement.

  This project moves beyond rehashing existing replies to the inefficacy objection by making the prior, unexamined question of act-description granularity its central object of study. By developing and testing constraints on this granularity, particularly the Causal Structure Constraint, it promises to break the stalemate and provide a principled basis for evaluating when and why individual acts can be wrong despite their apparent inefficacy.
