prompt: |-
  Our interpretability group has an unwritten house rule that I'm about to have to put into a methods section, and I cant actually defend it.

  When someone claims a model "represents X" — the true board state, whether the user is being sarcastic, whether the door is locked — the accepted evidence is a probe: train a linear readout on the residual stream, report held-out accuracy. Good probe, representation exists. But if you want to go further and say the representation is *used*, you have to intervene: patch or flip the feature and show the outputs move. So we run a two-tier system where decodability buys you "represents" and causal leverage buys you "represents and uses it."

  Nobody I've asked can tell me what theory of content makes tier one mean anything. We'd never accept "you can read X off the activations" as showing that a thermostat represents room temperature or that a rock represents where the sun is. And meanwhile the convention leaks all over the place. The Othello work — model trained only to predict legal moves, probing recovers board state out of its internals, messing with that state changes the moves it predicts — that one gets described as showing the thing had a world model, fine. But a probe that's near-perfect with no detectable causal effect anywhere also gets reported as a finding about what the model knows, and nobody blinks.

  So what does this practice presuppose about what it takes for a physical system to have a representation at all? I want a reconstruction, not a literature tour, and no reading list or citations — I couldn't chase them down this week even if you gave me one.

  Headings, in this order:

  **What tier one commits us to** (~250 words). Spell out the minimal account of content under which probe accuracy is evidence of representation — is it a covariance/information account, a functional-role account, something about the model's training history and what it got selected to do, or something I'm not thinking of. Be explicit about whether the account is really about the probe or about the model.

  **What that rules out** (~250 words). Which respectable accounts of representation would say a good probe shows nothing whatsoever, and what our practice would have to turn into to satisfy them. I'm guessing teleosemantics plus some use-based or interpretationist thing, but tell me if that's the wrong list.

  **Where we're actually underdetermined** (~200 words). Be honest about which parts of the convention several rival theories would happily license, i.e. where I'd be overclaiming if I said "we are committed to X."

  **The leak between the tiers** (~200 words). Is "represents but doesn't use" a coherent category or hedging with extra steps? What does keeping both tiers cost us, and is there a cleaner single standard we should collapse onto?

  **If we flipped it** (~150 words). Suppose causal role became the only route to "represents" and decodability got demoted to a heuristic. What breaks in day-to-day work, what do we stop being able to say, and is that loss real or merely inconvenient?

  **The soft spot** (~100 words). The single most embarrassing thing about the convention — the one a smart skeptic from outside ML would press on that I currently have no answer too.
reasoning: |-
  Okay, the user is part of an interpretability group and needs to formalize an unwritten rule about how they determine if a model "represents X." The rule has two tiers: probe accuracy for "represents" and intervention for "used." The user is concerned because they can't defend why probe accuracy alone should count as representation. They want a philosophical reconstruction without citations.

  First, I need to break down the sections as requested. The headings are clear, so I'll address each one step by step. 

  **What tier one commits us to**: The key is that the probe accuracy implies a covariance account. The model's activations reliably correlate with X, making it a representation by covariance. But this is about the model, not the probe, because the probe just reveals the existing covariance. The minimal commitment is that information in the activations suffices for representation, regardless of use.

  **What that rules out**: Teleosemantics and functional role semantics would reject this. Teleosemantics requires that the representation has a purpose from its history, like evolution or training. Functional role needs the representation to play a causal part in the system's processes. Without intervention, these theories wouldn't accept probe accuracy as evidence of representation.

  **Where we're underdetermined**: Here, multiple theories might align with the practice. Covariance and interpretationist views could both support probe accuracy as representation. Interpretationism depends on the community's assignment, which is what the probe does. So the practice doesn't lock us into one theory; it's ambiguous.

  **The leak between tiers**: "Represents but doesn't use" might be incoherent under some theories. If representation requires use, then tier one is insufficient. But pragmatically, it's a useful step. However, collapsing to only causal evidence would be cleaner, even if it means losing some decodability findings.

  **If we flipped it**: Switching to only causal evidence would make "represents" harder to claim. Many findings based on probes alone would be invalidated, like the Othello board state without intervention. This could be a real loss if some representations aren't causally active but still informative, but it might prevent overclaiming.

  **The soft spot**: The biggest problem is the rock example. If a rock's shadow shows the sun's position, does it represent it? By the probe standard, yes, but intuitively, no. This highlights the lack of teleological or functional context in tier one, making it vulnerable to trivial cases.

  I need to ensure each section stays within the word limit. The user wants concise answers without citations. Also, they mentioned the Othello work as an example where both tiers are satisfied, but probes alone are sometimes accepted. The core issue is justifying why probe accuracy implies representation. 

  The user's deeper need might be to validate their group's practice or to find a defensible position. They might also want to anticipate criticisms, hence the "soft spot" request. By identifying the covariance account as the basis, they can acknowledge its limitations while maintaining the tiered system for practical reasons. However, the rock counterexample is a real weakness they need to address, possibly by emphasizing the model's training as a pseudo-teleology, even if it's not explicit in tier one.
answer: |-
  ### **What tier one commits us to**  
  Tier one presupposes a **covariance-based account of representation**: if activations reliably correlate with feature X (measured by probe accuracy), this constitutes evidence of representation. The minimal commitment is that *information-carrying* suffices for "represents," regardless of downstream use. Crucially, this is a claim about the *model*, not the probe: the probe reveals pre-existing statistical structure in activations shaped by training. The model’s architecture and data history create a robust X-predictive signal, making the representation "present" in a weak informational sense. No teleology or functional role is required—only systematic covariance.  

  ---

  ### **What that rules out**  
  Tier one is rejected by:  
  - **Teleosemantics**: Representation requires evolutionary/design *purpose*. A rock’s shadow covaries with the sun’s position but isn’t a representation; it lacks intentional selection. Similarly, model activations might encode X "accidentally" via dataset statistics, not because X was a training target.  
  - **Functional-role semantics**: Representation must *do work* in the system’s computations. If X isn’t causally leveraged (e.g., for predictions), it’s merely inert information.  
  To satisfy these, tier one would need to show the representation was *selected for* (e.g., via ablations showing performance degradation when X is corrupted) or *functionally integrated* (via architectural constraints like bottlenecks).  

  ---

  ### **Where we're actually underdetermined**  
  The convention is ambiguous between:  
  - **Covariance+**: Probe accuracy implies representation *if* we assume the model’s training incentivized efficiency (i.e., decodable features aren’t noise).  
  - **Interpretationism**: "Representation" is assigned by *us* via probes; the model’s states become representations by being interpretable.  
  - **Pragmatism**: Probes are useful tools; "represents" is operationalized for research speed, not metaphysics.  
  All would endorse probe accuracy as *practically significant*, but only covariance+ treats it as ontological evidence. You’d overclaim by asserting we’re committed to any specific metaphysics.  

  ---

  ### **The leak between the tiers**  
  "Represents but doesn’t use" is **incoherent under functionalist theories** but **pragmatically necessary**. Covariance without causal role suggests the model *stores* X but doesn’t *treat it as content* (e.g., X is an epiphenomenal byproduct). Keeping both tiers costs conceptual clarity: it implies "representation" is gradational (informational → functional). A cleaner standard would collapse to **causal efficacy only**, but this risks ignoring latent structure (e.g., unused safety-relevant features).  

  ---

  ### **If we flipped it**  
  Demoting probes to heuristics and requiring causal proof for "represents" would:  
  - **Break**: Claims about "knowledge" in non-causal features (e.g., unused social biases in embeddings).  
  - **Stop saying**: "The model *knows* X" based solely on probes. This loss is **real but salutary**—it curbs overinterpretation of decodable noise. However, it slows exploratory work: causal tests are labor-intensive, and many decodable features (e.g., Othello’s board state) *are* functional.  

  ---

  ### **The soft spot**  
  **The thermostat/rock objection**: If probe accuracy implies representation, then a thermostat *does* represent room temperature (covariance), but a rock’s shadow also "represents" the sun’s position—yet we intuitively deny the rock has representations. Our convention lacks a principled distinction between *designed* versus *accidental* covariance, making "representation" vacuously applicable to any correlative system.
