prompt: |-
  Thirty-five years I spent building and calibrating geophysical instruments, and now that I'm retired I read philosophy instead of watching golf, so please bear with an amateur. What's got me stuck is the Kelly criterion and the whole business of maximising expected log wealth. The claim I want a number on is this:

  (K) For an agent who faces the same multiplicative gamble over and over and carries her wealth forward, the rule "take the bet iff it raises your expected log wealth" isn't just a useful heuristic — it's the correct criterion, in the sense that her personal utility function drops out and cannot licence her to do otherwise.

  My hunch, which may just be physics-brain, is that the argument for (K) quietly assumes two things: that the gamble really does repeat indefinitely, and that there's a single persisting thing whose growth rate is being measured. I suspect alot of the heat comes from people saying "the agent" and meaning different things — me next Tuesday, my lab over twenty years, my grandchildren over two hundred. And I keep running into the old objection (Samuelson's, I think, though I may have the name wrong) that offering a man a bet he'd rationally refuse once doesn't make it acceptable just because you offer it ten thousand times, plus the newer line that expected utility theory commits a category error by averaging over an ensemble of parallel copies of you instead of over your own timeline.

  So: give me your credence in (K), a real number, decomposed. I'd want terms roughly along these lines, feel free to add or drop: whether the infinite-repeat limit has any normative authority over a finite life; whether growth rate of wealth is even the right object to care about, as opposed to consumption, or what you leave behind, or the chance of ruin along the way; whether the ergodicity assumptions survive outside toy models; whether there's a determinate fact about which criterion is correct here or only a choice of framework; and whether my "different persisting agents" deflation actually dissolves the dispute or just dodges it. A probability for each with a sentence or two of why, then show me the arithmetic that gets you to the bottom line.

  Please use these headings, in this order: **Restating K** (three or four lines, and tell me if you'd phrase it differently — I care about that); **The terms** (numbered, each with a probability and 2-3 sentences); **Combining them** (show the working, don't just assert the total); **The load-bearing term** (one paragraph on which sub-question the number is most sensitive to and why); **What would move me** (one paragraph: which argument, result, or distinction would most change your credence, up or down); **Where I'm probably wrong** (short — point at the weakest weld in your own reasoning, not at mine). I'm a scientist, I'd much rather be shown where the joint is likely to fail than handed a confident answer, so don't soften the self-criticism section into politeness.
