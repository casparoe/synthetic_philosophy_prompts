  For section 5, that "differential cost" framing isn't a retreat - it's the actual theoretical core! The teeth come from testable predictions: handicap signals should scale with quality (e.g., only healthy deer stot), and cheating should be impossible because costs are unbearable for low-quality signallers. That's far from tautological.

  Padding-wise, section 1 could lose the Darwin quote setup - it's vivid but eats wordcount. The real meat starts at Zahavi.

  Biggest overall problem? Conflating "waste" with "differentially costly sacrifice" - that's causing the chain reaction of issues in sections 3-5. The JSON should reflect this with high-priority fixes on those conceptual hinges.

  Noticing the user specifically banned references - good call since they're time-pressed. My responses should focus on conceptual corrections rather than citation hunts. Their self-awareness about section 4 being shaky is spot-on; that's where the most surgical fixes are needed.
answer: |-
  Here's your accuracy-focused review, followed by the JSON summary:

  ### Accuracy & Feedback
  **Section 2 History:** Mostly fine. Grafen formalized Zahavi’s idea (1990) after Zahavi proposed it (1975), while Spence’s job-market signaling (1973) predates Grafen. The "proportion to waste" line is **oversimplified to the point of falsehood**. Cost must be *differentially burdensome* (hurts low-quality signallers more), not just "more waste = more credible." Absolute waste alone doesn’t guarantee honesty.

  **Section 3 Examples:**  
  - **Croak:** Index (unfakeable signal, tied to physical trait). *Not* a handicap.  
  - **Stotting:** True handicap (costly display only affordable to high-quality individuals). You’re correct.  
  - **Badge:** Conventional signal (honesty maintained by receiver punishment, not inherent cost). *Not* a handicap.  
  **Dividing line:** Handicaps require *strategic wastefulness* that imposes higher relative costs on low-quality signallers. Stotting qualifies; croak/badge do not.

  **Section 4 Problem:** Your human extension **fails** due to a hidden dependency. You assume "usefulness" weakens the signal, but:  
  - Donations *are* wasteful if they cost the donor something irrecoverable (e.g., opportunity cost).  
  - Burning cash signals nothing beyond "I have cash" (no info about values/skills). Donating to a *specific* cause signals commitment *to that cause* precisely because it sacrifices resources for non-personal gain.  
  **Hidden dependency:** You’re missing that signals must be *quality-revealing*. Burning $10k reveals wealth; donating $10k to malaria nets reveals wealth *plus* altruistic commitment.

  **Section 5 Verdict:** **Strengthening**, not retreat. Differential cost *is* the core insight. The "teeth": It predicts *when* costly signals evolve (only if costs correlate with quality) and why cheating is deterred (liars pay higher relative costs). Naive "cost = honest" fails to explain *why* wasteful signals persist.

  **Padding:** Cut Darwin quote setup (Section 1). Start at Zahavi’s insight.

