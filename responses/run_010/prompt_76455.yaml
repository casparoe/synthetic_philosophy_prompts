answer: |-
  Your configuration is fascinating—a robust pattern of scientific language use that transcends mere polysemy or pragmatic tolerance. After dissecting your cases against established concepts, I conclude there is **no canonical term** for this exact phenomenon in philosophy of science or metaphysics of kinds. However, it sits at the intersection of several ideas, demanding a new coinage. Let's carve it step by step.

  ### Why Existing Concepts Don't Fit
  1. **Boundary Objects (Star & Griesemer)**  
     *Purpose*: Facilitate cooperation across communities by allowing an *entity* (e.g., a museum specimen) to maintain flexible interpretations.  
     *Divergence*: You're describing a *linguistic* phenomenon where the *term itself* (not an object) carries distinct inductive profiles. Boundary objects enable collaboration despite differences; your cases involve *epistemic synergy* through the shared term. Findings aren't just tolerated—they actively enrich both profiles.

  2. **Polysemy/Homonymy**  
     *Purpose*: Describe words with multiple related (polysemy) or unrelated (homonymy) meanings.  
     *Divergence*: Polysemy implies meaning variation resolvable by context (e.g., "bank" for river/finance). Your cases show *no contextual disambiguation*: communities use the term univocally in joint work. The profiles aren't just "meanings" but empirically grounded, non-interchangeable criteria.

  3. **Promiscuous Realism (Dupré)**  
     *Purpose*: Argue for pluralism in classification (e.g., organisms can be grouped by ecology or phylogeny).  
     *Divergence*: Dupré’s pluralism allows multiple *competing* classifications. Your cases involve *integration*: findings under one profile are cited under the other without friction, suggesting a functional unity beyond pluralism.

  4. **Partial Reference (Field/Kitcher)**  
     *Purpose*: Handle reference change in scientific revolutions (e.g., "phlogiston" referred partly to oxygen).  
     *Divergence*: Your profiles are *simultaneously active and successful*, not historical relics. Neither is "partially" referring; both are robust and contemporaneously valid.

  5. **Cluster Concepts (Boyd, Millikan)**  
     *Purpose*: Define kinds by a cluster of co-varying properties (e.g., "species" as reproductive isolation + phylogeny).  
     *Divergence*: Cluster concepts assume properties *covary stably*. In your cases, properties *diverge* (graphite satisfies electronic but not chemical criteria), yet the term remains unified. Cluster concepts also imply a single "joint"; your profiles track distinct causal structures.

  ---

  ### Proposed Coinage: **Integrative Kind Term (IKT)**  
  **Definition**: A scientific kind term held fixed across communities by two or more *non-nested, partially overlapping inductive profiles*, where:  
  - (a) Each profile supports successful predictions/interventions in its domain;  
  - (b) Findings migrate between profiles without translation;  
  - (c) The term is not treated as ambiguous;  
  - (d) Proposals to split the term are rejected as counterproductive to epistemic goals.  

  **Conditions for Falling Under IKT**:  
  1. **Non-Nested Profiles**: Extensions overlap but neither subsumes the other (e.g., metals: graphite is in electronic but not chemical extension).  
  2. **Epistemic Interdependence**: Profiles inform each other (e.g., band theory explains *why* some chemicals behave metallically; hormone chemistry reveals conserved signaling mechanisms).  
  3. **Operational Unity**: Communities use the term in shared literature/education as if it denotes a unified kind.  
  4. **Resistance to Splitting**: Attempts to disambiguate (e.g., "metal₁"/"metal₂") are dismissed—not due to laziness, but because splitting *impoverishes* both profiles’ inferential power.  

  **Boundary Cases to Exclude**:  
  | Configuration          | Why Not an IKT                          | Example                     |  
  |------------------------|-----------------------------------------|-----------------------------|  
  | Mere Vagueness         | No distinct profiles; blurred boundaries | "Heap"                      |  
  | Genuine Ambiguity      | Context disambiguates; no shared work   | "Bat" (animal/sports gear)  |  
  | Reductive Nesting      | One profile subsumes/explains the other | "Water" (macroscopic → H₂O) |  
  | Disjunctive Grouping   | No inductive unity expected             | "Jade" (jadeite/nephrite)   |  
  | Boundary Object        | Focus on objects, not terms             | Museum specimens            |  

  ---

  ### Implications for "Joints in Nature"  
  Your configuration suggests **the joints question is misposed**—not because there are no joints, but because *the term’s unity is pragmatic-epistemic rather than ontological*.  

  - **No Single Joint**: The profiles track distinct (though overlapping) causal structures: electronic band topology vs. electrochemical behavior for metals; circulatory delivery vs. molecular signaling mechanisms for hormones.  
  - **Not Merely Two Joints with One Label**: If it were simple homonymy, communities wouldn’t *leverage* each other’s findings. The profiles are *integrative*: the electronic profile explains *exceptions* in the chemical profile (e.g., why Hg is liquid), while chemical reactivity informs band-structure models.  
  - **The Pragmatic Carving**: IKT’s show that scientific kinds are **tools for epistemic triangulation**. A term gains stability not by carving a pre-existing joint, but by *bridging* multiple structures to amplify inferential power. "Metal" works because it links macroscopic behavior (chemists’ reactions) and microstructural properties (physicists’ bands), each offering predictive leverage the other lacks. Splitting the term would collapse this bridge, turning productive tension into siloed ambiguity.  

  **In short**: IKTs reveal that some scientific classifications are *unified by their role in sustaining cross-domain inference*, not by mapping monolithic natural kinds. The "joint" is not in the world alone but in the *dynamic of inquiry itself*—a point echoing Hasok Chang’s "active realism" or Nancy Cartwright’s "dappled world."  

  ---

  ### Where to Look Next  
  - **Metaphysics**: Examine "anchoring" in social ontology (e.g., Epstein’s work on how practices fix reference).  
  - **Philosophy of Science**: Compare to "heterogeneous reduction" (Fodor) and "patchwork explanations" (Mitchell).  
  - **Science Studies**: Expand Star & Griesemer’s "boundary objects" to *boundary terms*.  

  Your cases are not quirks but profound evidence against monolithic natural kinds. If you coin "Integrative Kind Term," define it rigorously with the criteria above—it fills a gap in the literature.
