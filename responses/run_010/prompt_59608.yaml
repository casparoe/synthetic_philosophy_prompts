prompt: |-
  For two years I've been the person coding societies as tight or loose for a cross-cultural psych lab — you know the framework, the one that came out of that big multinational study in Science around 2011 where tight means the norms are strong and widely shared and deviants get punished or shunned fast, loose means people basically do as they like. Our coding manual is a page and a half: rate norm strength, punishment severity, and tolerance of deviance across a bunch of domains, average them, weight the domains equally, done. The problem is my PI doesn't actually code that way, and she's on sabbatical for the semester so I can't just ask her. I've been keeping a private log of every case where she overruled or "adjusted" our aggregate scores, because for the renewal I have to argue the project is internally consistent and eventually write a manual that describes what she really does.

  Her track record so far:

  1. Affluent island city-state, extremely dense formal regulation of everyday life — dozens of domains, instant standardized fines, compliance measured at basically 100%. But almost no informal sanctioning: locals barely react when someone breaks a norm, and our survey item on tolerance of deviance scored very high. Manual said tight. She scored it loose, and wrote that compliance nobody has to enforce isn't constraint.

  2. Pastoral region with chronic drought and a long history of raiding. Norms script nearly every hour of the day and are near-universally endorsed, but the only sanctioning body is an elders' council that meets seasonally, so enforcement is erratic and actual deviance is rampant. Manual said tight. She said loose-ish: they're tight in aspiration, loose in practice.

  3. Mid-sized industrial country where the aggregate landed dead center. She called it clearly tight, and the reason she gave was that there's almost no variation in how people behave across situations — the same person acts the same way at a funeral, a football match, and a tax office. Narrow behavioral bandwidth, she called it.

  4. Typhoon-battered fishing archipelago. Only about five norms are strong at all — crew assignment, storm readiness, sharing the catch — but those five are absolute and breaking one gets you expelled from the harbor. Everything else is unregulated. Manual said loose. She said tight, and wrote that the five norms are the ones keeping people alive.

  5. Wealthy capital where political speech is heavily policed and punished severely, but dress, religion, sexuality, business hours, noise, public conduct are all wide open with huge visible variety and near-zero sanctioning for lifestyle deviance. Coders wanted loose on the aggregate. She said tight — in the only domain that matters to whether the place stays intact.

  6. Remote highlands, no state presence, sanctions limited to gossip and ostracism, ritual norms incredibly elaborate but wildly different from one valley to the next. Manual said loose, she agreed, noted there's simply no mechanism.

  7. Society with a devastating famine and civil war three generations back, so threat history scores through the roof, but today norm strength is low, punishment is mild, tolerance of deviance is high. Manual said loose. She agreed: the threat was then, what matters is what's constraining behavior now.

  8. A wealthy university town that scores loose on everything except a handful of very strict, very strongly enforced norms about queueing and noise after ten. She scored it loose overall, and specifically declined to treat it like case 4. I have no idea why 4 and 8 come out different and I've stopped trying to guess on my own.

  The one I have to submit by Friday: a privately governed special economic zone on leased land, about 400,000 residents from thirty-odd countries, no state at all, just a corporate charter. The operating company has written rules covering hundreds of micro-behaviors — bin lids, balcony plants, decibel ceilings, guest registration windows, scooter speeds, recycling streams, even a mandatory format for reporting your neighbors' violations. Enforcement is fully automated, cameras and sensors and fines deducted straight from your account, instant and exceptionless. Measured compliance is essentially perfect. But nobody knows or cares what the norms are; tolerance of deviance scores very high because residents say they wouldn't dream of judging a neighbor over anything; there is zero informal sanctioning, no gossip, no ostracism, no shame — and yet on the self-report items residents say they feel watched constantly and describe their own behavior as extremely constrained. Also, they rate their zone as more precarious than anywhere else in our whole sample: the lease could fail to renew, nobody has citizenship rights, everybody depends on one employer, and there's a genuine coordination problem across thirty language groups with no shared norms to fall back on. The manual's aggregate comes out mid-range and half the coding team wants tight, half wants loose.

  So: what do you think she'll score it, and what rule is she actually running? Walk me through the candidate rules that fit all eight precedents — I suspect there's more than one, and I suspect case 3 doesn't sit cleanly with any of them — and say for each what it predicts for the zone. Then give me your best guess at her verdict with the reasoning, and tell me what principle we'd be baking into the manual if we write it up that way, since I have to defend the coding as consistent and I'd rather know what I'm committing to. And if her verdicts genuinely underdetermine this one, name the single extra case I could put in front of her that would discriminate best between the rules, and what she'd have to say about it for each rule to win. If you think I've over-read one of the eight and built too much on it, flag which one.
reasoning: |-
  Hmm, the user is a research assistant in a cross-cultural psychology lab coding societies as "tight" or "loose" based on norms and enforcement. They're struggling because their PI consistently overrules the manual's aggregate scores with subjective judgments, and now they need to code a complex special economic zone case consistently with the PI's pattern while she's on sabbatical.

  Looking at the eight precedent cases, the PI clearly prioritizes functional constraint over formal metrics. Case 1 (Singapore-like) shows compliance without social enforcement isn't "tight" to her. Case 4 (fishing community) proves that a few vital norms can make a society tight despite minimal regulation. The university town (case 8) is loose because its strict norms aren't survival-critical, unlike the fishing norms in case 4. This suggests a "functional necessity" rule.

  The PI also seems to value perceived constraint and social cohesion mechanisms. Case 5 (capital city) is tight only in the domain preserving stability, while case 2's pastoral society is loose because inconsistent enforcement undermines norms. Case 7 confirms that historical threats don't matter if current behavior isn't constrained.

  For the special economic zone, residents feel intensely constrained by automated enforcement but show zero informal sanctioning and high tolerance - classic case 1/5 tension. However, their extreme perceived precarity (no fallback norms, lease dependency) might tip the scales. The PI would likely call it tight because the constraint is functionally necessary for daily survival in this artificial environment, much like the typhoon norms in case 4.

  This implies a core principle for the manual: Tightness requires that constraint actively maintains cohesion against functional threats. The automated enforcement here does exactly that - it's the glue holding a fragile system together. To test this, I'd propose a hypothetical case with perfect compliance but no survival stakes (e.g., gated community with petty rules). If the PI calls it loose, it confirms functional necessity is key.
answer: |-
  Based on your PI's pattern across the 8 precedents, her underlying rule isn't about averaging domain scores—it's about **functional constraint for collective survival/threat mitigation in a perceived precarious environment**. Here's the breakdown:

  **Candidate Rules & Fit with Precedents:**
  1.  **Rule: "Constraint is tight only where norms *functionally bind* behavior against existential/systemic threats."**
      -   Fits Case 1: Compliance is high, but *not* driven by social constraint against threats; it's frictionless regulation. No threat → Loose.
      -   Fits Case 2: Norms exist for survival (drought/raiding), but *enforcement fails* → binding fails → Loose-ish.
      -   Fits Case 3: **Problem Case.** No obvious threat, but "narrow bandwidth" suggests constraint *prevents* unpredictable chaos → Tight. (Implies low bandwidth *is* the threat mitigation).
      -   Fits Case 4: Core norms *directly* prevent death → binding works → Tight.
      -   Fits Case 5: Political speech constraint *prevents* regime collapse → Tight (other domains irrelevant to core threat).
      -   Fits Case 6: No mechanism → no binding → Loose.
      -   Fits Case 7: Past threat ≠ *current* binding constraint → Loose.
      -   Fits Case 8: Queuing/noise norms aren't survival-critical → Loose (vs. Case 4's life-or-death norms).
      -   **Prediction for Zone:** **TIGHT.** Rules are *absolutely necessary* for coordinating 30 language groups with no shared norms, preventing chaos in a precarious lease/no-citizenship environment. Automated enforcement *is* the binding mechanism.

  2.  **Rule: "Tightness requires *social internalization* and *active communal enforcement* of norms (formal systems alone don't count)."**
      -   Fits Case 1: No informal sanctioning → Loose.
      -   Fits Case 2: Erratic formal enforcement, rampant deviance → Loose-ish (aspiration ≠ internalization).
      -   **Problem Case 3:** Narrow bandwidth suggests deep internalization? But PI didn't mention social enforcement. Fits weakly.
      -   Fits Case 4: Expulsion is *communal* sanction → Tight.
      -   Fits Case 5: Political policing is *formal*, not communal → Should be Loose? **Contradicts PI (Tight)**. Fits poorly.
      -   Fits Case 6: No mechanism → Loose.
      -   Fits Case 7: Low norm strength/punishment → Loose.
      -   Fits Case 8: Minimal communal enforcement → Loose.
      -   **Prediction for Zone:** **LOOSE.** Zero informal sanctioning, no social internalization ("nobody knows or cares"), tolerance is high. Enforcement is purely automated/formal.

  3.  **Rule: "Tightness is defined by the *perception of constraint and consequence* by inhabitants, regardless of source."**
      -   Fits Case 1: Low perception of constraint? PI overruled → Loose. Fits poorly.
      -   Fits Case 2: Perception? Mixed (aspiration vs practice) → Loose-ish. Fits.
      -   Fits Case 3: "Narrow bandwidth" implies perception of constraint → Tight. Fits.
      -   Fits Case 4: High perception of consequence → Tight. Fits.
      -   Fits Case 5: High perception in political domain → Tight. Fits.
      -   Fits Case 6: Low perception? → Loose. Fits.
      -   Fits Case 7: Low perception now → Loose. Fits.
      -   Fits Case 8: Perception constrained only in specific domains? Overall loose. Fits.
      -   **Prediction for Zone:** **TIGHT.** Residents "feel watched constantly," describe behavior as "extremely constrained," perceive high precarity → High perception of constraint/consequence.

  **Analysis & Best Guess:**
  *   **Rule 2 (Social Internalization)** fails badly on Case 5 (Capital City), which the PI called Tight despite purely formal enforcement in the critical domain. It also struggles with Case 3.
  *   **Rule 3 (Perception of Constraint)** fits most cases well, *including* Case 1 (where perception was apparently low enough for PI to call Loose) and the Zone (high perception).
  *   **Rule 1 (Functional Binding Against Threat)** is the strongest fit overall. It cleanly explains:
      *   Why Case 1 (no threat, no binding) is Loose.
      *   Why Case 2 (threat present, binding fails) is Loose-ish.
      *   Why Case 4 (threat present, binding works) is Tight.
      *   Why Case 5 (threat present in key domain, binding works) is Tight.
      *   Why Case 7 (past threat ≠ current binding) is Loose.
      *   Why Case 8 (no survival threat in queuing norms) is Loose (vs Case 4).
      *   Case 3 (narrow bandwidth) is the outlier, but the PI's reasoning ("narrow behavioral bandwidth") hints that she sees *predictability itself* as a functional necessity for social cohesion/stability, implying a low-grade systemic threat of chaos.
  *   **The Zone:** It screams *functional necessity*. The perceived precarity is extreme (lease, no rights, employer dependency, coordination chaos). The automated rules *are* the binding mechanism preventing collapse. Residents *feel* the constraint intensely because the stakes (ejection/chaos) are high. Lack of social enforcement is irrelevant (like Case 5); the *system* enforces what's necessary for survival.

  **Verdict & Principle:**
  *   **Best Guess:** Your PI will score the Zone **TIGHT**.
  *   **Reasoning:** The automated rules function as the essential, non-negotiable constraint binding together a highly precarious, fragmented population with no alternative cohesion mechanisms. They mitigate the existential threat of coordination failure and system collapse. The high perceived constraint and precarity confirm the functional necessity. Social internalization is absent, but irrelevant to this binding function (precedent: Case 5).
  *   **Principle for Manual:** **"A society is tight if its norms, and the mechanisms enforcing them, are *functionally necessary and effective* in binding behavior to mitigate perceived or objective existential or systemic threats to collective survival or cohesion. This functional binding creates a measurable perception of constraint and consequence among inhabitants, regardless of whether enforcement is formal or informal, or norms are widely internalized."** This explains all precedents, including Case 3 (bandwidth = cohesion necessity) and Case 8 (non-essential norms).

  **If Underdetermined: The Discriminating Case**
  If the Zone feels ambiguous between Rule 1 (Functional Binding) and Rule 3 (Perception), propose this:

  *   **Case X:** A hyper-regulated, ultra-safe, affluent retirement community. Rules govern everything (lawn length, paint colors, visitor hours, noise, dress code). Enforcement is strict (fines, committees). Compliance is near-perfect. Residents *feel* highly constrained and report low tolerance for deviance. However, there is *no objective precarity or threat* – the rules exist purely for aesthetic uniformity and perceived "quality of life." Historical threat = low.
  *   **Discrimination:**
      *   **Rule 1 (Functional Binding):** Would call this **LOOSE**. No existential/systemic threat is mitigated by the rules. The constraint isn't necessary for survival/cohesion, only for preference.
      *   **Rule 3 (Perception of Constraint):** Would call this **TIGHT**. High perception of constraint and consequence exists.
  *   **Your PI's Likely Answer:** Based on precedent (especially Case 1 and Case 8 vs Case 4), she would almost certainly call this **LOOSE**. Compliance without necessity isn't true constraint. This confirms **Rule 1 (Functional Binding)** as the core principle.

  **Over-reading Flag:** You might be slightly over-reading **Case 3 (Mid-sized industrial country)**. The "narrow bandwidth" reasoning is unique and doesn't explicitly mention threat. However, interpreting bandwidth as *preventing the threat of unpredictable chaos* aligns best with the other cases and her functional focus. Don't build a separate "bandwidth rule"; integrate it as a manifestation of cohesion necessity.

  **For the Zone Submission:** Argue **TIGHT** based on **functional necessity for binding against precarity/threat**. Emphasize the *perceived precarity* (highest in sample), the *total dependency* on the system, the *existential coordination threat* across language groups, and the *automated system* acting as the *sole effective binding mechanism*. Acknowledge the lack of social enforcement but dismiss it as irrelevant per Case 5 precedent. This creates a defendable, consistent principle grounded in her past decisions.
