     - Infinitism: justification requires an infinite chain of reasons (infinite regress).

   We model the structure of justification as a recursively defined object. The recursive object is a "justification tree" for a proposition. 
   Each node is a proposition. The children of a node are the reasons that support it. The entire tree must satisfy admissibility conditions.

   The recursive call: the step of justifying a proposition by providing reasons (which are themselves propositions that must be justified).

   Now, translating the three horns:

   1. Foundationalism: 
      - Translation: The justification tree has base cases. Some propositions (leaves) have no children (no further justifications needed). 
