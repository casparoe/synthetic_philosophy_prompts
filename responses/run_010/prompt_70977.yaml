   2. Coherentism:
      - Translation: Justification is cyclic or mutually recursive. A proposition A is justified by B, and B by A (a cycle) or a set of propositions that mutually justify each other (mutual recursion). 
      - In the proof assistant: This would be modeled as mutual recursion or a cycle. However, in a termination checker, a direct cycle (like A justifies A) would be rejected as not well-founded. Mutual recursion is allowed if there is a well-founded order on the entire set. But a cycle without a base case would be rejected (vicious circle). 

