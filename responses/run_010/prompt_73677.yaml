  Below is a complete design for your 60-minute discussion group activity. The game, **"The Grid Expansion Challenge,"** simulates allocating decision authority across levels without mentioning subsidiarity until debrief. It meets your structural requirements and includes a worked example to verify dynamics.

  ---

  ### **Game Overview**
  Participants are divided into 4 districts (deliberately unequal sizes) building infrastructure in a shared grid. Districts must decide whether to fund two public goods: 
  - **Local Parks** (no spillovers; benefits only the building district). 
  - **Broadband Lines** (spillovers; benefits adjacent districts). 

  Costs are private (known only to the district), while benefits are public. Authority shifts from decentralized (Round 1) to centralized (Round 2) to negotiated (Round 3). 

  **Non-Material Stake:** Losing districts must publicly "yield sovereignty" by standing and declaring: *"We accept the central authority’s wisdom over our territory"* during transitions. This emphasizes legitimacy loss, not efficiency.

  ---

  ### **Roles & Materials**
  - **Districts:** 
    - **Alpha** (3 players), **Beta** (4), **Gamma** (4), **Delta** (5).  
    - *Each district has a delegate* (elected internally) for centralized negotiations.
  - **Materials:** 
    - Cost cards (hidden), district flags, voting tokens, whiteboard, scoreboard.
    - Handout: Rules summary, benefit/cost tables (below).

  ---

  ### **Rules & Point System**
  #### **Key Mechanics**
  - **Local Parks:**  
    - Benefit: 10 points/district member if built.  
    - Cost per district: Private (drawn from $[25, 55]$).  
    - *Net per member*: `10 - (district cost / district size)`.  
  - **Broadband Lines:**  
    - Benefit: 5 points/person in the building district and adjacent districts.  
      *(Adjacency: Alpha↔️Beta, Beta↔️Gamma, Gamma↔️Delta)*.  
    - Cost per district: Private (drawn from $[20, 60]$).  
    - *Net per builder’s member*: `5 - (cost / district size)`. Non-builders get 5 if covered.  
  - **Autonomy Token:** Each district holds one for each good. Lost if centralized; worth **0 points** but avoiding sovereignty-yield is key.  
  - **Voting:**  
    - **Centralized Round:** Majority rule (9+ votes of 16).  
    - **Round 3:** Changes require supermajority (12 votes) to decentralize centralized goods.  

  #### **Point Table (Per Member)**
  | **Action**                  | **Local Parks**       | **Broadband Lines**       |
  |-----------------------------|------------------------|---------------------------|
  | Build (own district)       | `10 - (cost/size)`    | `5 - (cost/size)`         |
  | Covered (non-builder)      | Not applicable         | `+5 (if adjacent build)` |
  | Autonomy Token Retained    | Non-material (sovereignty) | Non-material (sovereignty) |

  ---

  ### **Round-by-Round Flow**  
  **Total Time: 50 minutes** (plus 10-min debrief).  

  #### **Round 1: Decentralized (10 min)**  
  - **Authority:** Districts decide independently.  
  - **Steps:**  
    1. Game master gives each district **private cost cards** (e.g., Alpha: Parks=$28, Broadband=$35).  
    2. Districts discuss internally (5 min), then vote: Build or not for each good.  
    3. Delegate reports decisions.  
    4. Game master calculates scores, announces coverage (e.g., *"Beta built broadband; Alpha and Gamma get spillover benefits"*).  
  - **Sovereignty:** All districts keep autonomy tokens.  

  #### **Round 2: Centralized (15 min)**  
  - **Authority:** Central body (all 16) votes on *all* decisions.  
  - **Mechanics:**  
    1. Districts **lose autonomy tokens** for both goods.  
    2. Costs remain private, but delegates *may* reveal them (or lie) in a 5-min open debate.  
    3. Majority vote (9+ votes) on:  
       - **Parks:** *Require all districts to build* (yes/no).  
       - **Broadband:** *Which single district must build* (options: Alpha, Beta, Gamma, Delta, or none).  
    4. Losing districts in the vote **yield sovereignty** (stand and declare phrase).  
    5. Scores updated.  

  #### **Round 3: Negotiated (20 min)**  
  - **Authority:** Districts design rules (e.g., decentralize Parks, centralize Broadband).  
  - **Mechanics:**  
    1. Proposals require supermajority (12 votes) to *decentralize* goods centralized in Round 2.  
    2. 10-min negotiation: Districts bargain via delegates.  
    3. Final vote on the rule package.  
    4. Autonomy tokens reassigned based on new rules.  
    5. Districts with **fewest tokens** yield sovereignty.  

  ---

  ### **Worked Playthrough (Verification)**  
  **Costs (example):**  
  - **Alpha:** Parks=$28 (size=3), Broadband=$35  
  - **Beta:** Parks=$37 (size=4), Broadband=$45  
  - **Gamma:** Parks=$32 (size=4), Broadband=$30  
  - **Delta:** Parks=$48 (size=5), Broadband=$50  

  #### **Round 1 (Decentralized):**  
  - **Parks:** All build (costs < break-even: $30/40/40/50).  
    - *Alpha net*: `10 - 28/3 = +0.67/player`.  
  - **Broadband:** No one builds (private cost > benefit: e.g., Gamma’s $30 > $20).  
    - *Result:* All get 0 from broadband.  
  - **Scores/Player:** Alpha=0.67, Beta=0.75, Gamma=2, Delta=0.4.  

  #### **Round 2 (Centralized):**  
  - **Parks:** Vote to *require all* (everyone benefits). Passes 16-0.  
  - **Broadband:** Vote to appoint builder.  
    - Debate: Gamma reports $30 cost. Others silent.  
    - Vote: Alpha, Beta, Gamma vote for **Delta** (11 votes). Delta votes for Gamma (5).  
    - *Delta loses*, yields sovereignty: *"We accept central authority’s wisdom..."*  
  - **Outcome:**  
    - **Broadband:** Delta builds. Benefits: Gamma+Delta (5/player).  
      - *Delta net*: `5 - 50/5 = -5/player` (others gain 5).  
  - **Scores/Player:** Alpha=0.67+0, Beta=0.75+0, Gamma=2+5, **Delta=0.4-5= -4.6**.  

  #### **Round 3 (Negotiated):**  
  - Delta demands decentralization.  
  - **Proposal:** Decentralize Parks (supermajority required), centralize Broadband.  
    - Vote: Passes 12-4 (Gamma/Delta oppose centralizing Broadband).  
  - **Result:** Parks autonomy restored; Broadband centralized.  
  - **Sovereignty:** Delta (0 tokens) yields.  

  **Key Dynamics Verified:**  
  - **No Dominant Strategy:** High-cost districts avoid centralization (e.g., Delta in Round 1 rejects broadband), low-cost embrace it (Gamma pushes centralization).  
  - **Legitimacy Grievance:** Delta’s complaint: *"We had no say in building broadband!"* (not "costs were unfair").  
  - **Tunable Parameters:** Adjust cost ranges if solved too fast (e.g., widen broadband to $[10,70]$).  

  ---

  ### **Debrief (10 min)**  
  **Map Game Moments to Concepts:**  
  1. **Round 1 (Decentralized):**  
     - *"Why did no one build broadband?"* → **Underprovision due to spillovers.**  
     - Real-world: Local projects ignore regional benefits (e.g., clean energy grids).  
  2. **Round 2 (Centralized):**  
     - *"Why did Delta build broadband against its will?"* → **Majority tyranny.** Voting weights favored large districts (Delta had 5 votes, but 11 outvoted them).  
     - *Sovereignty-yield moment* → **Legitimacy deficit.** Complaint focused on "no say," not point loss.  
     - Real-world: Federal mandates (e.g., environmental rules) causing "overreach" backlash.  
  3. **Round 3 (Negotiated):**  
     - *"Who gets to decide who decides?"* → **The metadecision problem** (highlight: no higher authority to allocate authority).  
     - Real-world: Constitutional design (e.g., EU subsidiarity debates).  

  **Subsidiarity Connection:**  
  - Principle: *"Decisions at the lowest feasible level"* balances efficiency (avoid spillovers) and legitimacy (local ownership).  
  - Game limitations: Cannot replicate long-term trust/cooperation; real federations use courts, culture, and iterative bargaining.  

  ---

  ### **Predictable Challenges & Fixes**  
  1. **"Is this Tragedy of the Commons?"**  
     - *Response:* "Partly—but note how broadband spillovers create unique incentives. Also, legitimacy complaints aren’t about efficiency."  
  2. **Over-Optimizing Points:**  
     - Table focuses on autonomy, but players may ignore sovereignty. *Fix:* Gently enforce the yield ritual to anchor emotions.  
  3. **Round 2 Runs Long:**  
     - *Fix:* Strict 2-minute cost-debate; use tokens for faster voting.  
  4. **Round 3 Deadlock:**  
     - *Fix:* Warn: "No agreement = all decisions stay centralized."  

  **Unsimulated Element:** The game assumes costs/benefits are quantifiable. Real subsidiarity involves qualitative factors (e.g., community values) you’ll highlight in debrief.

  ---

  This design forces legitimacy grievances via sovereignty-yielding, avoids prescriptive theory, and uses points to mask subsidiarity until reflection. Run it as a fast-paced negotiation, and debrief with your organizational parallels.
