prompt: |-
  I hold a chair in aesthetics at a mid-sized university, and for the third year running I am serving as chair of the jury for our magazine's prize for a first or second work of fiction. The jury is six of us: myself, a practising novelist, two reviewers, an independent bookseller, and a retired professor of literature. We receive on the order of 140 submissions. Each juror is assigned roughly thirty and, in practice, reads between fifteen and twenty-five of them; the remainder are abandoned partway through or never opened. I read perhaps twenty myself. Ten days before the shortlist is announced my own remaining reading time is somewhere around eleven hours, and the jury's collective reading time is exhausted. The shortlist has six places and the prize goes to one book. The citation I sign is printed in the magazine and read aloud at the ceremony, which means the jury makes public assertions about works that, in many cases, only one or two of us have actually read. The editor of the magazine clears the wording of the citation but has no say over the award.

  Here is my difficulty. I teach and publish on the epistemology of aesthetic testimony — pessimism and optimism about it; the difference between a bare verdict and testimony that arrives with reasons, descriptions, or comparisons; the difference between explaining the badness of aesthetic deference by unavailability (first-hand acquaintance being required for the judgment to be justified, or for appreciation to be had at all) and explaining it by a norm (the justification being available, but forming the judgment on another's word violating a norm of aesthetic agency); and Hume's marks of the true judge, together with the obvious circularity in identifying those marks. None of this has yet become anything I could hand five intelligent people who have read none of it. This year I intend to hand it to them at our first meeting.

  Please write that procedure. I do not want a survey of the literature, a bibliography, or named authorities: I know the field and my jurors do not need it. I want the machinery, presented as a document I can print and distribute, running through the following in order.

  1. A typology of the reports the procedure will receive — bare verdict; verdict plus identified features; verdict plus a description of what reading it was like; verdict plus a comparison to named works; a report relayed from someone else; a report of what people are saying — stating for each what it may and may not be used for.
  2. A weighting rule for the reporter's competence and candour, assessable by jurors who share no canon, and a frank account of how far that assessment escapes circularity.
  3. The inclusion/exclusion asymmetry: whether testimony can ever license setting a book aside, and whether it can ever license putting one on the shortlist. State the rule, say which side of the pessimism/optimism dispute it presupposes and whether it assumes an unavailability or a norm explanation, and say what the rule would have to become on the other assumption.
  4. An acquaintance budget: if the strict view holds, acquaintance is the only thing that licenses an inclusion, so scarce reading time becomes the resource the procedure must allocate. Give a triage rule for which unread books I must read, in what order, out of eleven hours; and state what happens when the budget runs out — what may be done without acquaintance, and what must then be recorded.
  5. Stopping rules and hand-offs: where the procedure terminates in a decision, where it terminates in "read it," and where it hands the question to a vote or to me because what remains is a question about what this prize is for rather than about the books.
  6. Output discipline: what the published citation may assert about a work that only some jurors read, and how reliance on others' judgments is to be marked without collapsing into a disclaimer.

  Mark, as you go, which thresholds are arbitrary — where any number would serve and the number is doing rhetorical rather than epistemic work — and which steps are judgment wearing procedural costume. Close with a short statement of what the procedure cannot do, and a one-page version a juror could keep beside them while writing reports.

  Then run it, showing each step, on three cases from this year's pile.

  Case A. A novel by an author with two well-regarded previous books. Three jurors hold it: one read sixty pages and reports it fluent but inert with no reason to continue; one read a hundred and reports much the same; the third has not opened it. Nobody has finished it and it is four hundred pages long. May we exclude it, and on whose authority?

  Case B. The book I have now read twice and consider the best thing in the pile. Two other jurors were assigned it: one finished and calls it admirable but cold, the other abandoned it at page forty as self-indulgent. Nobody has reading time left and I cannot ask anyone to take it up. Can it be shortlisted, can it win, and what may the citation say about it? If the honest output of your procedure is that my own favourite cannot take the prize, give me that result rather than a loophole; I would rather see where the view bites.

  Case C. A submission that is being talked up at a festival by people with no connection to the jury. One juror reports that everyone who has read it calls it extraordinary, having read the first chapter. Does anything from this channel enter the procedure at all, and at what weight?
reasoning: |-
  Okay, the user is a professor chairing a literary prize jury, facing practical challenges in evaluating submissions under severe time constraints. They want a procedural framework grounded in aesthetic epistemology but stripped of academic jargon for their diverse jury. 

  Hmm... their core tension lies between theoretical rigor (their specialty in aesthetic testimony) and operational reality (only partial readings are possible). The unspoken pain point seems to be intellectual discomfort with signing public citations for books the jury hasn't fully vetted. 

  Right, I need to translate complex epistemology into actionable rules. The six requested components form a logical sequence: input types → credibility assessment → inclusion/exclusion rules → resource allocation → decision points → output ethics. Key philosophical stakes:
  - Can testimony justify exclusion? (Pessimism vs optimism)
  - Must all shortlisted books be read by someone? (Acquaintance principle)
  - How to handle dissensus about literary value vs prize criteria

  For Case A: The abandonment by multiple jurors suggests legitimate exclusion under Rule 3.1 if "inert" constitutes a disqualifying flaw. But we must note in outputs that it wasn't finished. 

  Case B hurts - their favorite faces rejection unless Rule 4's triage redirects their reading time. The citation could acknowledge divergent readings but not conceal partial engagement. 

  Case C is gossip dressed as testimony - Rule 1.6 flags it as inadmissible for inclusion. Might trigger triage if time allows. 

  The arbitrary thresholds (e.g., "two" negative reports) exist to force decisions, not because epistemology cares about specific numbers. The one-page cheat sheet must crystallize when to stop reading versus when to escalate.
answer: |-
  Here is a procedural framework designed for your jury, presented as a distributable document, followed by application to your three cases.

  ---

  **PROCEDURE FOR JURY DELIBERATIONS: EPISTEMIC FRAMEWORK**

  **1. Typology of Reports & Permissible Uses**  
  Reports vary in epistemic weight. Use them strictly as follows:  

  | **Report Type**                  | **May Be Used For**                                                                 | **May NOT Be Used For**                                  |
  |----------------------------------|-------------------------------------------------------------------------------------|----------------------------------------------------------|
  | **Bare Verdict** (e.g., "Excellent") | Flagging for triage (Rule 4). Never for shortlisting or citation.                  | Justifying inclusion, citation claims, or comparisons.  |
  | **Verdict + Features** (e.g., "Weak due to flat dialogue") | Supporting exclusion (Rule 3). Inclusions only if features align with prize criteria (Rule 5). | Asserting overall quality without corroboration.        |
  | **Verdict + Reading Experience** (e.g., "Exhausting but profound") | Context for triage (Rule 4). Inclusions only if experience reflects prize goals (Rule 5). | Substituting for analysis of the work itself.           |
  | **Verdict + Comparison** (e.g., "Like early Smith") | **If canonical:** Supporting inclusion/exclusion. **If obscure:** Treat as "Verdict + Features". | Asserting merit based solely on resemblance.            |
  | **Relayed Testimony** (e.g., "X says it’s brilliant") | Triage only (Rule 4). Weight = 0 for shortlisting.                                  | Any formal evaluation. Record source if used.           |
  | **Buzz/Consensus Report** (e.g., "Festival favorite") | Triage prioritization (Rule 4). Weight = 0 for decisions.                           | Influence beyond triage order.                          |

  **2. Weighting Competence & Candour**  
  Assess reporters using:  
  - **Internal Consistency:** Do their descriptions align with their verdict? (e.g., "dull but gripping" lacks candour).  
  - **Engagement Depth:** Did they read enough to encounter the work’s core mechanics? (Arbitrary threshold: ≥20% for novels).  
  - **Past Reliability:** (If applicable) Has their judgment aligned with the jury’s in prior years?  
  **Circularity Note:** Identifying "depth" or "consistency" assumes shared norms of assessment. We mitigate this by requiring *specificity* (e.g., "flat dialogue on p. 10–30") over abstractions. Competence is inferred from report coherence, not reputation.  

  **3. Inclusion/Exclusion Asymmetry**  
  - **Rule:** Testimony can justify **exclusion** (pessimism-compatible) but never **inclusion** (optimism-incompatible). This assumes an **unavailability explanation**: appreciation requires first-hand acquaintance.  
  - **If norm explanation held** (aesthetic agency violated by deference), exclusion would also require acquaintance. Rule would become: **No testimony justifies any verdict**. Acquaintance would be mandatory for all decisions.  

  **4. Acquaintance Budget & Triage**  
  - **Strict View:** Only acquaintance licenses inclusion. Reading time is scarce.  
  - **Triage Rule:**  
    1. **Priority 1 (3 hrs):** Books with ≥2 conflicting reports (e.g., "brilliant" vs "tedious").  
    2. **Priority 2 (5 hrs):** Books with strong positive testimony + features aligning with prize criteria.  
    3. **Priority 3 (3 hrs):** Books with unanimous negative reports but high buzz (audit for bias).  
  - **Budget Exhaustion:**  
    - Unread books may be **excluded** via testimony (Rule 3).  
    - Shortlisted books **must** have ≥1 juror’s full acquaintance.  
    - **Record:** "Excluded based on partial reports" or "Shortlisted without full-jury acquaintance."  

  **5. Stopping Rules & Hand-offs**  
  - **Terminate to "Read It":** When testimony conflicts irreconcilably (Case B) or features align strongly with prize goals (Case C).  
  - **Terminate to Vote:** When all acquainted jurors agree on inclusion/exclusion.  
  - **Hand-off to Chair:** When disputes concern prize definition (e.g., "Is ‘experimental but cold’ within our scope?"). Chair decides based on prize history/mandate.  

  **6. Output Discipline**  
  - **Citation May Assert:**  
    - Features/effects verified by ≥1 acquainted juror (e.g., "luminous prose").  
    - Verdicts **only** if all shortlisted books have ≥2 acquainted jurors.  
  - **Marking Reliance:** Use passive voice for collective verdicts ("The jury found..."); active for individual inputs ("Juror X noted..."). **No disclaimers.** Example: "A feat of structural ambition (per Jurors A, B)" not "Some jurors liked the structure."  

  **Arbitrary Thresholds & Procedural Judgments**  
  - **Arbitrary:** 20% reading depth (Rule 2), 2 jurors for consensus (Rule 6). These force decisiveness; epistemically, 15% or 3 jurors could work.  
  - **Judgment in Costume:** Triage order (Rule 4) and "prize alignment" assessments (Rule 5) mask subjective prioritization.  

  **Limitations**  
  This procedure cannot:  
  - Generate aesthetic appreciation where acquaintance is lacking.  
  - Resolve deep disagreements about literary value.  
  - Compensate for inadequate reading time. It only allocates scarcity ethically.  

  ---

  **ONE-PAGE JUROR GUIDE**  
  *(Print back-to-back with above)*  

  **WRITING REPORTS**  
  ☑ **BE SPECIFIC:** "Wooden dialogue pp. 40–50" > "Poor writing."  
  ☑ **NOTE DEPTH:** "Read 30% (to Ch. 4)" at report top.  
  ☑ **FLAG CONFLICT:** "Admired prose but found protagonist hollow."  

  **USING OTHERS’ REPORTS**  
  | **Report Type**          | **Use For**                      | **Never Use For**         |  
  |--------------------------|----------------------------------|---------------------------|  
  | Bare Verdict             | Triage (Rule 4)                 | Citations/shortlisting    |  
  | Verdict + Features       | Exclusion or prize-fit check    | Final verdict alone       |  
  | Comparisons (canonical)  | Inclusion/exclusion support     | Proof of quality          |  
  | Buzz/Relayed Reports     | Triage order only               | Decisions                 |  

  **DECISION RULES**  
  ➊ **Exclude** if ≥1 report identifies prize-misaligned features (Rule 3).  
  ➋ **Shortlist** only if ≥1 juror read fully AND reports prize-aligned features.  
  ➌ **Cite** only verified features (e.g., "innovative structure"). Name jurors if using their specific notes.  

  **WHEN STUCK**  
  → **READ** if reports conflict sharply.  
  → **VOTE** if all readers agree.  
  → **ASK CHAIR** if unsure what the prize rewards.  

  **RECORD**  
  - "Excluded per Juror X’s report of incoherent plotting."  
  - "Shortlisted with partial jury reading."  

  ---

  **APPLICATION TO CASES**  

  **Case A: Abandoned Novel**  
  - **Procedure:**  
    1. Reports: Two "inert/fluent" verdicts + features (no narrative drive). One unopened.  
    2. Competence: Reporters read 15–25% (≥20% threshold met). Features specific ("no reason to continue").  
    3. **Exclusion Rule:** Testimony licenses exclusion (Rule 3). Features ("inert") disqualify under prize goals (new work should compel attention).  
  - **Authority:** Jurors who read ≥20%. Chair may verify features if contested (not needed here).  
  - **Output:** Excluded. Citation unused. Record: "Excluded per Jurors X/Y: fluent but inert."  

  **Case B: Chair’s Favorite (Cold/Self-Indulgent)**  
  - **Procedure:**  
    1. Reports: Chair (positive, full), Juror A ("admirable but cold"), Juror B ("self-indulgent," 10% read).  
    2. **Conflict:** Chair’s full acquaintance vs. Juror A’s negative features. Juror B’s report discounted (depth <20%).  
    3. **Triage:** Top priority (conflict + prize-aligned ambition). But reading budget exhausted → **no new acquaintance possible**.  
    4. **Inclusion Rule:** Shortlisting requires ≥1 full acquaintance → **eligible**. Winning requires consensus among acquainted jurors → **not eligible** (Chair + Juror A disagree).  
    5. **Output Discipline:**  
      - Shortlisted: **Yes** (Chair’s acquaintance).  
      - Win: **No** (lacks consensus).  
      - Citation: May assert features Chair verified (e.g., "daring voice"). Must note dissent: "Juror A found its precision emotionally distant."  
  - **Result:** Your favorite shortlisted but cannot win.  

  **Case C: Festival Buzz**  
  - **Procedure:**  
    1. Report Type: "Buzz" (festival talk) + Relayed Testimony ("extraordinary" from partial readers).  
    2. **Weight:** Buzz → triage prioritization (Rule 4). Relayed testimony → weight = 0 for decisions.  
    3. **Triage:** If unread, assign to Priority 2 (strong buzz + features). If partially read with negative reports (e.g., "overwritten"), assign to Priority 3.  
    4. **Inclusion:** Only if a juror acquires full acquaintance. Buzz alone → **no effect**.  
  - **Result:** Enters triage queue. If no time for acquaintance → excluded.  

  ---  
  This procedure enforces epistemic rigor while acknowledging practical constraints. It prioritizes transparency over consensus and acquaintance over enthusiasm, accepting that partial engagement is unavoidable—but not unforgivable if documented.
