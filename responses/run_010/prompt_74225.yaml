prompt: |-
  I sit on the panel that runs a small futarchy pilot at a research institute: for the past two years we have settled some internal questions by opening prediction markets rather than by voting. Our record so far is as follows. We approved a market on whether a software migration would be completed by a fixed date, resolved against the vendor's public release log. We refused to open a market on whether the institute's director would step down within the year, on the ground that the best-informed traders were also the ones with most to gain from the answer and some ability to produce it. We approved, subject to a rule excluding senior staff from trading, a market on whether a major funder would renew a programme. We rejected a proposed market on whether a new internal policy would improve the culture here, because nothing could later be checked against it. We approved a thinly traded market on which of two contractors would be selected, on the explicit understanding that the price would inform our deliberation but not settle it. And we adopted a standing gloss distinguishing traders who can bring an outcome about from traders who merely know about it, barring only the former — a gloss that sits somewhat uneasily with the director case, where our stated worry also concerned who stood to gain.

  The director now proposes something closer to futarchy proper: two markets, one on the institute's refereed publication output over eight years if we adopt restructuring plan A, the other on the same measure under plan B, with whichever market clears higher to be adopted automatically. The measure is defined in advance and auditable; the horizon outlasts every current member of the panel; only one of the two markets can ever be resolved; and plan A's principal advocate has offered to fund the payout pool and intends to trade in both markets.

  Which ruling best coheres with our own precedents — approve, approve with conditions, or reject? Please identify the closest analog among the five earlier cases, lay out the candidate rules our record supports (they should not all point the same way here, and say what each implies for this proposal), state which of our precedents we would effectively have to overrule or reinterpret on each option, give your recommendation, and tell us honestly what principle we would be committing ourselves to if we decided the other way.
reasoning: |-
  Okay, the user is part of a panel running a futarchy pilot at a research institute. They've handled several prediction markets over the past two years and now face a new proposal from the director for something closer to "futarchy proper." The director wants two markets predicting publication output under two different restructuring plans, with the higher-priced plan automatically adopted. The user needs to know whether to approve, approve with conditions, or reject this based on their precedents.

  First, I need to recall their past cases. They approved a market on a software migration deadline, using the vendor's release log for resolution. They rejected a market on the director stepping down because insiders could influence the outcome. They approved a funder renewal market but excluded senior staff from trading. They rejected a culture policy market because it wasn't verifiable. They approved a contractor selection market but only used the price as input, not binding. And they have a standing rule barring those who can influence outcomes.

  The director's new proposal has a clear, auditable metric (publication output over 8 years), a long horizon, and only one market resolves. The advocate for Plan A is funding the payout pool and plans to trade. 

  The closest precedent is the funder renewal case. Both involve significant stakes and insider influence. There, they excluded senior staff. Here, the advocate funding and trading creates a conflict of interest. Applying that precedent would require excluding the advocate from trading or rejecting if exclusion isn't feasible.

  The director stepping down case is also relevant. They rejected it because insiders could influence and benefit. Here, the advocate might push for Plan A's success, influencing both the market and outcome. Their standing rule bars those who can bring about outcomes, which fits here.

  The software migration case was approved because it was verifiable and insiders couldn't influence it. Here, publication output is verifiable, but the advocate's involvement introduces influence. Without the advocate trading, it might be acceptable, but with them involved, it's problematic.

  The culture policy case was rejected for non-verifiability. Here, the metric is clear, so that's not an issue. The contractor case used the market as input but not binding. This proposal is binding, which is different, but the binding nature wasn't a past issue. The key conflict is influence.

  The standing rule about barring influencers versus those with knowledge. In the director case, they were worried about both influence and gain. Here, the advocate has both. So the standing rule supports exclusion or rejection.

  Possible candidate rules: 1) Reject markets where key traders can influence outcomes. 2) Allow markets if those who can influence are barred. 3) Require verifiable outcomes. 

  Rule 1 would lead to rejection here because the advocate can influence Plan A's success. Rule 2 would suggest barring the advocate from trading. Rule 3 is satisfied. 

  If they approve without conditions, they overrule the funder renewal exclusion and the director stepping down rejection. If they approve with exclusion, it aligns with funder renewal. If they reject, it aligns with the director case. 

  Recommendation: Approve with conditions, excluding the advocate from trading. This aligns best with the funder renewal case. If they reject, they commit to a stricter principle against any potential influence, which might limit future markets. If they approve unconditionally, they weaken their conflict-of-interest safeguards.
answer: |-
  Based on your precedents, the closest analog is the **funder renewal market** (approved with senior staff exclusion). Both involve high-stakes institutional decisions, potential for insider influence, and explicit exclusion rules to mitigate conflicts of interest. Below is a step-by-step analysis of the ruling that best coheres with your record.

  ---

  ### **Closest Analog: Fund Renewal Market**
  - **Similarities**:  
    - High-stakes outcome tied to institutional future  
    - Traders with insider knowledge/ability to influence outcomes  
    - Resolution dependent on external/verifiable events (funding decision vs. publication metrics)  
  - **Key Distinction**:  
    The fund renewal market excluded senior staff *because they could influence the outcome*. Here, Plan A's advocate funding/trading creates a **direct conflict of interest** mirroring the "senior staff" concern.

  ---

  ### **Candidate Rules Supported by Precedents**
  Your rulings imply three enforceable principles, which conflict in this case:

  1. **Rule 1: Bar traders who can influence outcomes**  
     (*From fund renewal & director stepping down cases*)  
     - *Implication here*: **Reject** or **exclude Plan A’s advocate**. Their funding/trading creates asymmetric influence (e.g., they could inflate Plan A’s market price or underfund Plan B’s liquidity).  
     - *Precedent alignment*: Directly follows fund renewal (exclusion) and director stepping down (rejection due to influence/self-gain).

  2. **Rule 2: Require objectively verifiable resolution**  
     (*From software migration & culture policy cases*)  
     - *Implication here*: **Approve**. Publication output is defined/auditable (unlike "culture improvement"), satisfying your verification standard.  
     - *Precedent alignment*: Consistent with software migration (date/log-based resolution). Overrules nothing.

  3. **Rule 3: Non-binding markets are acceptable**  
     (*From contractor selection case*)  
     - *Implication here*: **Approve with condition to treat prices as advisory only**. The automatic adoption mechanism is novel and untested in your pilot.  
     - *Precedent alignment*: Follows contractor selection (price informs but doesn’t decide). Overrules nothing *if* binding authority is removed.

  ---

  ### **Ruling Options & Precedent Impact**
  | **Ruling**               | **Implied Precedent Overrides**                                  | **Conflict with Past Cases**                                     |
  |--------------------------|------------------------------------------------------------------|------------------------------------------------------------------|
  | **Approve unconditionally** | Overrules *funder renewal exclusion* and *director stepping down rejection*. | Ignores established safeguards against self-dealing influence. |
  | **Approve with conditions** | None. Tightens *funder renewal* exclusion to cover external advocates. | Fully coherent if advocate is barred from trading/funding.     |
  | **Reject**               | Overrules *software migration* verification standard.            | Inconsistent where metrics are auditable (unlike culture policy). |

  ---

  ### **Recommendation: Approve with Conditions**
  - **Conditions**:  
    1. **Bar Plan A’s advocate from trading or funding either market**. Their involvement violates Rule 1 (influence + gain).  
    2. **Use a neutral third party to fund the payout pool** (e.g., institute reserves).  
    3. **Clarify the binding mechanism is experimental** (subject to panel override if market manipulation is suspected).  
  - **Why this coheres best**:  
    - Preserves *fund renewal*’s exclusion principle while accepting the *software migration* verification standard.  
    - Avoids overruling any precedent by extending existing conflict rules to external actors.  

  ---

  ### **Honest Principle If You Choose the Other Options**
  - **If you approve unconditionally**:  
    You commit to: **"Market efficiency outweighs conflict-of-interest risks, even when traders directly control outcomes."**  
    *Consequence*: Undermines the director stepping down/fund renewal logic. Future proposals could let executives trade on self-influenced outcomes.  

  - **If you reject**:  
    You commit to: **"Futarchy requires not just verifiable outcomes, but also the impossibility of influence by any trader."**  
    *Consequence*: Invalidates most high-stakes markets (e.g., fund renewal, contractors), as some insiders always have influence.  

  ---

  ### **Final Note**
  Your precedents prioritize **purity of trader incentives** over procedural flexibility. Plan A’s advocate triggers the exact concern from the director/funder cases: profit motive intersecting with outcome control. By excluding them, you honor your deepest precedent—the fund renewal exclusion—while permitting a test of "true" futarchy. Without this, the proposal risks becoming a self-fulfilling prophecy.
