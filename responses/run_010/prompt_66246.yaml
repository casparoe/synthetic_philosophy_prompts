  We are going to map the dispute between expressivism and the Frege-Geach objection into the vocabulary of programming languages, denotational semantics, and effect systems.

  **Expressivism in Moral Philosophy:**
  Expressivism is the view that moral sentences (e.g., "Stealing is wrong") do not describe facts (i.e., they are not truth-apt) but instead express the speaker's non-cognitive attitudes (e.g., disapproval). Thus, they are more like commands or expressions of emotion than assertions of truth.

  **The Frege-Geach Problem (The Standard Objection):**
  The Frege-Geach problem points out that moral sentences can be embedded in complex sentences, such as conditionals: "If stealing is wrong, then getting your little brother to steal is wrong." In the antecedent, the moral sentence "stealing is wrong" is not asserted but is used in a way that contributes to the truth conditions of the whole conditional. The objection is that expressivism, by giving an account only for asserted moral sentences (as expressions of attitude), cannot explain the meaning of embedded moral sentences. Moreover, the embedded occurrence must have the same meaning as when it is asserted, because the same sentence can be used in both ways and because the inference patterns (like modus ponens) must be preserved.

  **Expressivist's Resistance to Truth-Conditional Semantics:**
  The expressivist denies that moral sentences denote truth values (or any other fact-stating content). Instead, they are seen as having a different kind of semantic role: to express attitudes. Therefore, a truth-conditional semantics (which assigns truth conditions to sentences) is inappropriate for moral sentences.

  **Restating the Dispute in PL Vocabulary:**

  1. **Expressivist Claim: Moral sentences do not denote.**
     - In your terms: A moral sentence is not a term that evaluates to a value (like a truth value) in the denotational semantics. Instead, uttering a moral sentence is like performing a side effect (e.g., issuing a command, expressing an emotion) without returning a value.

  2. **The Frege-Geach Objection:**
     - Consider a conditional: `if (stealingIsWrong) then (gettingBrotherToStealIsWrong)`. 
     - In a truth-conditional semantics, the antecedent `stealingIsWrong` must denote a truth value (or a proposition) so that the whole conditional can be a function from the truth value of the antecedent to the truth value of the consequent.
     - The expressivist, by denying that `stealingIsWrong` denotes anything, seems unable to provide a denotation for the antecedent when it is embedded. Thus, the semantics fails to be compositional: the meaning of the whole conditional is not built from the meanings of its parts.

  3. **Expressivist's Response to Frege-Geach:**
     - The expressivist tries to provide a compositional semantics without assigning truth conditions to moral sentences. They propose that the meaning of a moral sentence in embedded contexts is still tied to the attitude it expresses, but in a way that fits compositionally.

     Two repair strategies:

     **Strategy 1: Higher-order attitudes (e.g., Blackburn's quasi-realism)**
     - The idea is that when a moral sentence is embedded, the attitude expressed becomes more complex. For example, in the antecedent of a conditional, the sentence does not express a simple attitude but rather an attitude about having an attitude.
     - In PL terms: Instead of a moral sentence denoting a value, it might be a suspended computation (a thunk) that, when forced, performs an effect (expresses an attitude). However, when embedded, we do not force the thunk immediately. Instead, we treat the thunk as a value and manipulate it. For the conditional, the whole conditional might express a higher-order attitude: a state of mind that is such that if one ever comes to have the attitude expressed by the antecedent, then one must also have the attitude expressed by the consequent.
     - But note: This strategy does not assign a denotation (a value in the domain of the semantics) to the moral sentence. Instead, it uses the moral sentence to build a more complex effect.

     **Strategy 2: Norm acceptance (e.g., Gibbard's plan-based expressivism)**
     - Gibbard proposes that moral judgments express acceptance of a system of norms. When embedded, the norms are combined. In the conditional, the antecedent and consequent are both norms, and the conditional expresses a norm that links them.
     - In PL terms: Think of a moral sentence as a function that, when applied to a world (or a context), produces an effect (an update to the norm system). The embedded occurrence is then a suspended norm update. The conditional might be a function that takes two such suspended updates and returns a new suspended update that conditionally applies the second if the first is applied.

  4. **Your Proposed Reformulation:**
     You suggested separating the denotation (the content) from the force (assertion). So, assign a denotation to every sentence (including moral ones) and then treat assertion as an effect that happens at the top level. For example, a moral sentence denotes a proposition (a truth value, or a set of possible worlds) and when asserted, it performs the effect of expressing an attitude.

     But the expressivist rejects this because they deny that moral sentences denote propositions. They see the assignment of a denotation (a truth condition) as already giving up the expressivist position.

     **Where your intuition might be doing unearned work:**
     - You assume that we can always separate content (denotation) from force (effect). But the expressivist claims that for moral sentences, there is no content to separate: the entire meaning is bound up in the force. So, when you assign a denotation, you are importing the truth-conditional view that they reject.

     **Where an effect-style framing might import the content/force separation:**
     - If you model the moral sentence as having a denotation (say, a thunk of type `Unit -> Effect`), then you are still assigning a denotation (the thunk) and then the force is the effect of running it. But the expressivist might argue that even the thunk is a kind of denotation that they reject because it represents the moral content as a kind of entity. They might insist that the moral sentence is purely an effect and has no denotational content at all.

  5. **Residue Report:**

     **Claims that survive intact:**
     - The expressivist's core claim: Moral sentences do not denote truth values. In your terms, they are not expressions that evaluate to a value of type `Bool` (or `Prop`). This translates directly.

     **Claims that survive only after being bent:**
     - **Higher-order attitudes:** In your framework, we might model this as having values that represent suspended effects (like thunks) and then building functions that manipulate these thunks. However, the expressivist might say that by representing the attitude as a thunk (a value) we are reifying the attitude and losing the non-representational nature of moral language. What is lost? The idea that the attitude is not an object of thought but a mode of engaging with the world. Also, the normativity: the thunk is just data, but the attitude is supposed to be action-guiding.

     - **Inferential validity:** In truth-conditional semantics, validity is about truth preservation. In expressivism, it must be about consistency of attitudes. We can model this by defining a notion of consistency on effects or on the state of the norm system. But the expressivist might worry that we are reducing normative constraints to formal ones, which might miss the practical nature of moral reasoning.

     **Claims with no expression in your vocabulary:**
     - **Competence with moral language:** In philosophy, this is often tied to having the appropriate dispositions to form attitudes or to act. In your framework, we model meaning in terms of denotations and effects, but the link to the speaker's psychology and behavior is not directly captured. We can model the effect of an utterance on a context (which might include the speaker's and hearer's mental states), but the expressivist might argue that the meaning *is* the psychological state, not the effect on a formal context.

     - **The role of an utterance in a life:** Expressivism emphasizes that moral language is used to influence behavior and express commitments. Your framework models the computational meaning and the effects, but it abstracts away from the lived experience and the practical role. This is a dimension that a formal semantics might not capture.

     **Judgment on the residue:**
     - The defect is not necessarily on your side. The expressivist is making claims about the nature of moral language that are not purely about formal semantics but about the connection between language and action. Your framework is designed for formal languages and computation, and it may not be intended to model the full pragmatic and psychological aspects of natural language.

     - However, your framework might be extended to capture some of this. For example:
       - **Effects and handlers:** We could model the expression of an attitude as an effect, and then define effect handlers that interpret these effects in a larger context (which might include the agent's commitments and norms). This could capture the idea that moral utterances update a normative state.
       - **Continuations:** We might model the embedding in conditionals using continuations: the antecedent is a function that expects a continuation (the consequent) and expresses a conditional attitude. But again, this might still reify the attitude.

     - Ultimately, the residue suggests that the philosophers' disagreement might be substantive, but your framework might not be the right tool to capture the entire expressivist position without distortion. The expressivist is making a metaphysical claim (moral sentences do not state facts) and a psychological claim (they express attitudes) that go beyond formal semantics. However, for the purpose of providing a compositional semantics for embedded contexts, the expressivist strategies can be modeled in your framework, but at the cost of turning attitudes into objects of computation.

  **Conclusion:**
  Your "it is just a compositionality failure" intuition was unearned because you assumed that compositionality requires denotations (values) for every subexpression. The expressivist is trying to provide a compositional semantics without denotations by using a different kind of meaning (attitudes). However, the Frege-Geach problem shows that this is challenging. The repair strategies are attempts to define compositionality in terms of the composition of attitudes or norms, which in your framework might look like manipulating thunks or effectful computations. But the expressivist might resist even that because it introduces a level of representation they reject.

  The residue (the psychological and practical aspects) might require extending your framework with more context (like a model of the agent's mental state) or accepting that some aspects of natural language meaning are beyond the scope of denotational semantics as you practice it.
answer: |-
  ### Restating the Dispute in Programming-Language Semantics Vocabulary

  #### **1. Expressivism's Core Claim (Resistance to Truth-Conditional Semantics)**
  - **Philosophical claim**: Moral sentences (e.g., "Stealing is wrong") do not denote truth values or propositions. Instead, they express non-cognitive attitudes (e.g., disapproval). Asserting "Stealing is wrong" is like issuing a command ("Don't steal!") rather than stating a fact.  
  - **Your-vocabulary translation**:  
    - A moral sentence is an **expression** that, when evaluated at the top level (i.e., when **asserted**), performs a **side effect** (e.g., updating a shared state of attitudes or norms). It has **no denotation**—it is of type `Void` or `Unit` in a purely effectful context.  
    - **Distortion warning**: Translating this directly requires denying that the expression has *any* value in the denotational semantics. If we say it "denotes an attitude," we violate expressivism by sneaking in a denotation.  

  #### **2. The Frege-Geach Objection (Standard Criticism)**
  - **Philosophical claim**: Moral sentences embed in complex constructs (e.g., conditionals: "If stealing is wrong, then encouraging stealing is wrong"). When embedded, they must contribute to the truth conditions of the whole, but expressivism cannot explain this because embedded occurrences aren't "asserted" (so no attitude is expressed).  
  - **Your-vocabulary translation**:  
    - Consider a conditional expression: `if (stealingIsWrong) then (encouragingStealingIsWrong)`.  
    - For **compositionality**: The denotation of the whole must depend on the denotations of its subexpressions. But if `stealingIsWrong` has no denotation (only an effect when asserted), we cannot define a denotation for the conditional.  
    - This breaks **referential transparency**: Substituting `stealingIsWrong` with a truth-evaluable expression (e.g., `2 + 2 == 4`) changes the type of the conditional, violating substitution invariance.  
    - **Failure mode**: Expressivism cannot provide a **typing judgment** for the antecedent in embeddings—it is `Ill-typed` in a truth-conditional calculus.  

  #### **3. Expressivist's Defense (Why the Objection Isn't Fatal)**
  - **Philosophical claim**: The objection assumes truth-conditional semantics is the only option. Expressivists propose alternative compositional semantics where moral sentences denote "higher-order attitudes" or "norm-acceptance states" in embeddings.  
  - **Your-vocabulary translation**:  
    - **Strategy 1: Higher-order attitudes (e.g., Blackburn)**  
      - Embedded moral sentences denote **suspended computations** (thunks) that, when forced, would express an attitude.  
      - The conditional `if P then Q` denotes a **higher-order function** that combines these thunks:  
        - Type: `(Thunk<Attitude>) → (Thunk<Attitude>) → CombinedAttitude`  
        - Example: "If stealing is wrong..." → `λ(thunk_p). λ(thunk_q). if force(thunk_p) then force(thunk_q)`  
      - **Cost**: This "bends" expressivism. Attitudes become **denotations** (`Thunk<Attitude>` values), contradicting the core "no denotation" claim. The **residue** is the loss of non-cognitive force—attitudes are reified as data.  

    - **Strategy 2: Norm-acceptance systems (e.g., Gibbard)**  
      - Moral sentences denote **updates to a system of norms**. When embedded, they are **partial updates** that only take effect when the context triggers them.  
      - Example: The conditional is a **stateful function** of type `(NormUpdate) → (NormUpdate) → NormUpdate`, where the output is a guarded update: "When norm `N1` (from `P`) is accepted, then accept norm `N2` (from `Q`)."  
      - **Cost**: This requires a **global effect handler** to manage the norm system. The "no denotation" claim is bent because `NormUpdate` is a denotation (a value representing a change to shared state).  

  #### **4. Your Reformulation vs. Expressivist's Rebuttal**
  - **Your claim**: Treat moral sentences as having denotations (e.g., propositions) and layer assertion as a top-level effect (e.g., `assert : Prop → IO ()`).  
  - **Expressivist's rebuttal in your terms**:  
    - This smuggles in truth conditions. If `stealingIsWrong : Prop`, you've already conceded it denotes a truth-apt entity, which expressivism rejects.  
    - **Key insight**: Your framing assumes **content/force separation** (denotation vs. evaluation context). Expressivism denies this separation for moral sentences—the "content" *is* the force. Your `assert` effect is not composable: embeddings force the "content" to exist independently of force.  

  #### **5. Where Your Intuition Did Unearned Work**
  - **"Compositionality failure" intuition**: You assumed compositionality requires **denotational uniformity** (all expressions must denote values). But expressivists reject this for moral language—they offer compositionality via **effect composition** (e.g., combining attitude-thunks).  
  - **Effect-style framing smuggling**: Using **evaluation contexts** (e.g., `K[ e ]` where `K` is an effectful context) assumes `e` has a denotation independent of `K`. Expressivism says moral `e` has no standalone denotation—its meaning is tied to its effect potential.  

  ---

  ### Residue Report: What Survives, What Bends, What Breaks

  #### **Claims That Survive Intact**
  - **Moral sentences lack truth-conditional denotations**.  
    - Translates cleanly: They are expressions of type `IO<Attitude>` or `NormUpdate` with no `Bool`/`Prop` denotation.  
  - **Frege-Geach embeds require compositional treatment**.  
    - Translates: Complex expressions must have well-typed denotations built from parts.  

  #### **Claims That Survive Bent (With Losses)**
  - **Higher-order attitudes** (Strategy 1):  
    - **Bent into**: Thunks (`() → Attitude`) or continuations (`(Attitude → R) → R`).  
    - **Losses**:  
      - **Normativity**: Attitudes become inert values, not action-guiding states.  
      - **Inferential validity**: Truth-preservation is replaced by consistency of attitude systems, but this is not formally defined in your semantics.  
  - **Norm-acceptance systems** (Strategy 2):  
    - **Bent into**: Effect handlers (e.g., `handleUpdate : NormUpdate → Context → Context`).  
    - **Losses**:  
      - **Competence conditions**: Knowing a moral term isn't just knowing its `NormUpdate` value—it's being disposed to *act* on it. Your semantics tracks state, not dispositions.  

  #### **Claims With No Direct Translation**
  - **Competence with moral language**:  
    - **Philosophical claim**: Competence involves dispositions to form attitudes/act, not just knowing denotations.  
    - **Failure reason**: Your framework lacks **pragmatic competence** (linking semantics to real-world actions). Denotational semantics models "what a program means," not "what a speaker does when they run it."  
    - **Defect location**: Your framework is missing a dimension—**commitments as behavioral effects**. Natural language requires modeling utterances as acts, not just computations.  
  - **Normativity of moral language**:  
    - **Philosophical claim**: Moral sentences prescribe actions; they aren't just descriptions.  
    - **Failure reason**: Effects in PL (e.g., `IO`) model side actions, but not *binding prescriptions*. Your semantics has no equivalent of "ought."  
    - **Defect location**: Philosophers' disagreement is substantive—your framework cannot model "action-guidingness" without extending it.  

  #### **Can Technical Notions Salvage the Residue?**
  - **Effects and handlers**: Could model norm systems, but still reduce attitudes/norms to data. **Not enough** for prescriptions.  
  - **Continuations**: Might capture "suspended force" in embeddings (e.g., `if P then Q` as `P(λ_. Q)`), but continuations are denotations—expressivists reject this.  
  - **Polarity/assertion boundaries**: In sequent calculus, "asserted" vs. "embedded" is structural. But this assumes content is uniform across positions, which expressivism denies.  
  - **Verdict**: The residue requires **modeling commitments as first-class entities**, e.g., extending semantics with:  
    - A **context type** tracking an agent's commitments (`Ctx : Commitment → Set`).  
    - **Judgments** like `Γ ⊢ e : ActionGuiding A` (meaning "in context `Γ`, `e` prescribes action `A`").  
    Without this, you face a **framework limitation**, not a missing formalism.  

  #### **Substantive vs. Verbal Disagreement?**
  - **Where it's substantive**: The Frege-Geach objection exposes a real compositionality challenge for expressivism. Your "bookkeeping" solution assumes truth conditions, which expressivists must avoid.  
  - **Where it's verbal**: "Denotation" is overloaded. Expressivists use it to mean "truth-apt content"; you use it as "value in a compositional semantics." Clarifying this might resolve some confusion, but the core dispute—whether moral language has truth-apt content—remains.  

  **Final note**: Your PL framework excels at modeling *structure* but struggles with *force*. To capture expressivism fully, you'd need to integrate semantics with a theory of action (e.g., dynamic semantics with commitment updates), treating "evaluation" as a speech act, not just computation.
