  - **Metalinguistic negotiation:** The IAU vote was explicitly about standardizing a technical term for taxonomy – textbook metalinguistic move. But the geophysicists' pushback shows negotiation continues.
  - **Deflationism:** The "what exists" question (Pluto's physical reality) is separate from "how we classify it." Nobody disputes Pluto's properties – so the heat is all in classification.

  What survives elimination? A fight over which physical trait (orbital clearance vs. roundness) best carves astronomical reality at the scale of solar system bodies. And that's substantive because it ties to different causal stories: formation history vs. gravitational influence.

  Where it gets philosophically spicy is question 4: the IAU fiat attempt. A verbal dispute framework should applaud clarifying terms by stipulation... but here it failed spectacularly because the term is embedded in public discourse and other scientific communities (geophysicists). So the lesson is: fiat works only if the linguistic community accepts it. IAU's authority was porous.

  Also noting his sub-question about "technical register." That distinction collapses here because planet is a *boundary object* – used by astronomers, educators, the public. The IAU assumed they owned the word when they didn't. Big mistake.

  Final seam-splitting: The physical facts (mass ratios, shapes) aren't disputed. The fight is 100% about which facts should define a category. But since both criteria pick out real patterns, it's not arbitrary – just purpose-relative. The embarrassment for verbal dispute theory? Real-world terms don't stay in their lanes, and "natural kind" arguments get hijacked by cultural sentiment (Pluto nostalgia!).
answer: |-
  ### Brainstorming (4 lines)  
  Expect: Elimination leaves substantive disagreement—orbital dynamics vs. geophysical formation as taxonomically fundamental. Survives verbality tests. IAU vote *is* metalinguistic negotiation, but dynamical/geophysical criteria reflect competing "natural kind" claims (gravitational dominance vs. shared formation physics). Fiat fails due to term's public/institutional embeddedness.  

  ---

  ### Analysis  

  **1. Elimination move**  
  Remove "planet." Disagreement persists: *Should astronomical taxonomy prioritize gravitational control of orbital zones (dynamical) or intrinsic physical properties (hydrostatic equilibrium)?* The mass-ratio gap isn’t disputed; its *taxonomic relevance* is. Geophysicists argue roundness signals differentiated interiors and planet-like geology; dynamicists argue orbital dominance predicts system-structuring behavior. This is substantive: it concerns which causal processes (formation vs. current dynamics) define "natural" kinds.  

  **2. Substantive core**  
  The bedrock issue: **Which physical property carves solar system bodies at their objective joints?**  
  - **Dynamical view**: "Clearing" correlates with gravitational primacy—a body dominating its orbit shapes system evolution.  
  - **Geophysical view**: Roundness reflects planetary processes (accretion, differentiation), independent of location.  
  *Settling it?* Observation confirms properties but cannot resolve which *deserves* taxonomic primacy. Naturalness criteria (e.g., projectibility, causal fundamentality) might favor dynamics: the mass-ratio gap is unique and predicts orbital stability. Geophysical criteria group icy moons with planets, blurring system-level distinctions.  

  **3. If nothing substantive? Not applicable here**  
  —But negotiation is evident: IAU’s vote assigned "planet" to dynamics for technical clarity. "Better" depends on goals:  
  - **Dynamical**: Predictive fruitfulness (orbital models), stability (avoids explosion of planets).  
  - **Geophysical**: Continuity (pre-2006 "round bodies" usage), teachability (shape is intuitive).  
  The "technical register" distinction collapses: "Planet" is a *public-facing* term in astronomy (textbooks, press). IAU assumed authority it lacked, inviting rebellion from geophysicists whose work relies on the concept. Both camps ask the *same* question—"What is a planet?"—but answer via incompatible criteria.  

  **4. What Prague does to the theory**  
  - **Verbal-dispute framework**: Embarrassed, not vindicated. Fiat *should* resolve metalinguistic negotiations, but Pluto shows **institutional power cannot override decentralized linguistic practice**. Scientific terms gain authority through consensus, not votes.  
  - **General lesson**:  
    - **Fiat fails** when terms are culturally embedded (public sentiment) or scientifically contested (geophysicists’ domain).  
    - **Voting on definitions** reveals classification as decision, not discovery—but only if the community accepts it. Here, dissenters leveraged equivalent scientific legitimacy (geophysics vs. dynamics).  
    - **Seam in the dispute**:  
      - *Verbal*: Negotiating "planet’s" semantic scope.  
      - *Non-verbal*: Physical properties are uncontested; the gap is real.  
      - *Substantive*: Choice of taxonomic criterion is worldview-laden (dynamics = systemic behavior; geophysics = individual traits).  
    The IAU’s error: treating a *boundary object* (used across fields/public) as a technical curio.  

  **Conclusion**: The dispute is **25% verbal** (negotiating "planet"), **75% substantive** (competing natural-kind criteria). Pragmatism favors dynamics, but philosophy exposes the irreducible role of disciplinary values. IAU’s vote proved scientists *decide* categories—yet the backlash proves such decisions demand broader assent.
