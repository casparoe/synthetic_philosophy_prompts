answer: |-
  ## Pattern's Labor

  Each coin in its box, a grid so neat and clean,  
  A million hands release a million quarters.  
  The pattern holds, a perfect, ordered scene,  
  Before the game ignites the eager porters.

  A million hands release a million quarters,  
  A private pact, a choice that's freely made.  
  Before the game ignites the eager porters,  
  A star collects the toll that they have paid.

  A star collects the toll that they have paid,  
  His wealth now towers, vast and unforeseen.  
  A star collects the toll that they have paid,  
  The map now shows a different, rougher green.

  His wealth now towers, vast and unforeseen,  
  The pattern's shattered lines begin to blur.  
  The map now shows a different, rougher green;  
  Restore it? Force the hands that did confer?

  The pattern's shattered lines begin to blur,  
  You sweep the coins back to their starting square.  
  Restore it? Force the hands that did confer?  
  But ghost coins whisper, rustling in the air.

  You sweep the coins back to their starting square,  
  Each coin in its box, a grid so neat and clean.  
  But ghost coins whisper, rustling in the air,  
  The pattern holds, a perfect, ordered scene.

  ---

  **How the repetitions do the argument**

  The pantoum's cyclical structure embodies Nozick's core tension. Lines are carried forward, shifting context like redistributed coins:

  1.  **"A million hands release a million quarters"** (St1 L2 → St2 L1): Initially describing voluntary payment causing D1's disruption, it reappears as the *source* of the disruption, emphasizing the act's innocence yet undeniable effect.
  2.  **"Before the game ignites the eager porters"** (St1 L4 → St2 L3): First setting the scene *prior* to disruption, it later becomes the moment *preceding* the specific payment pact, highlighting the inevitability of change.
  3.  **"A star collects the toll that they have paid"** (St2 L4 → St3 L1 & L3): Shifting from the *result* of payments (St2) to the *ongoing mechanism* creating D2 (St3), its double repetition stresses Chamberlain's central, disruptive role.
  4.  **"His wealth now towers, vast and unforeseen"** (St3 L2 → St4 L1): Moving from direct observation of D2's *emergence* (St3) to the *consequence* for the pattern (St4), highlighting the scale of the change.
  5.  **"The pattern's shattered lines begin to blur"** (St4 L2 → St5 L1): Transitions from describing D2's *effect* (St4) to becoming the *problem demanding rectification* (St5), forcing the question of intervention.
  6.  **"You sweep the coins back to their starting square"** (St5 L2 → St6 L1): Initially the *action* of restoring D1 (St5), it becomes the *ritualistic beginning* of the cycle again (St6), emphasizing its futility.

  **The Closing Loop:**
  The final stanza brings back the opening lines: **"Each coin in its box, a grid so neat and clean"** (St1 L1 → St6 L2) and **"The pattern holds, a perfect, ordered scene"** (St1 L3 → St6 L4). However, they now follow **"But ghost coins whisper, rustling in the air"** (St5 L4 → St6 L3). This critical insertion fundamentally changes their meaning. The "neat grid" and "perfect scene" are no longer pristine starting points; they are revealed to be potentially built upon prior injustices ("ghost coins"). The attempt to restore D1 lands us exactly where we started, but now burdened with the knowledge that D1 itself might be tainted, demanding its *own* rectification and thus perpetuating the cycle. The repetition underscores the impossibility of a truly "clean" D1, embodying the rectification problem.
