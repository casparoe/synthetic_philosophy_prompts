  Hmm, this is a complex and high-stakes request from a food security analyst. They need a practical attribution procedure grounded in Sen's entitlement approach, with clear guardrails against common pitfalls in famine reporting. 

  First I need to unpack their core requirements: 
  - Operationalize Sen's entitlement framework into concrete investigative steps
  - Distinguish three separate analytical layers (food availability, access failures, responsibility)
  - Address historical blind spots (remote causes, subsistence crop failures, state disinformation)
  - Include mechanisms like movement restrictions and wage-price decoupling
  - Prevent value judgments from masquerading as facts
  - Work within 48-hour timeframe with non-specialist staff

  The historical anchors provide critical design constraints:
  - Bengal 1943 teaches us to trace policy chains (e.g., how London's shipping priorities affected Calcutta's grain prices) even when aggregate data is disputed
  - Ireland's potato famine shows that "subsistence crop collapse" requires special treatment - must check for crop substitution possibilities and market integration
  - Great Leap Forward demonstrates the need for a "broken feedback loop" category when states disable their own monitoring systems

  For the procedure structure, I'm considering a three-stage funnel:
  1) Food availability check (with strict rules against over-interpretation)
  2) Entitlement failure mapping (production, trade, labor, transfers)
  3) Agency assessment (distinguishing incapacity, negligence, and deliberate action)

  Key innovations needed:
  - A "remoteness protocol" for causes several steps removed (like Bengal's shipping policies)
  - Special handling for subsistence economies (Ireland case)
  - Explicit "information environment" assessment (Great Leap lesson)
  - Clear off-ramps when evidence is insufficient

  The three test cases will validate different failure modes:
  - Case 1 tests wage-price decoupling and differential policy response
  - Case 2 examines trade collapse with advance warning
  - Case 3 confronts political denialism and data obstruction

  For implementation realities, I'll flag:
  - Critical data gaps (occupational mortality, real wages)
  - Tactics for distinguishing obstruction from absence
  - Time-bound uncertainty management
  - Phrases to ban ("compounded by", "complex factors")

  The output must be director-ready: one page max, no welfare economics jargon, with clear decision points for leadership on value judgments. Most importantly, it must prevent that passive-voice laundering they're trying to avoid.
answer: |-
  Here's a field-ready attribution procedure based on Sen's entitlement approach, designed for speed, defensibility, and clear decision points. It forces separation of availability, access, and agency while incorporating historical lessons. The procedure has **three sequential layers**, each with off-ramps if evidence is insufficient.

  ---

  ### **PROCEDURE: Attribution Decision Tree**  
  *(Time allocation: Layer 1 = 12 hrs, Layer 2 = 24 hrs, Layer 3 = 12 hrs)*

  **CORE RULE:** Never use the same evidence to answer more than one layer. If Layer 1 evidence appears in Layer 3, discard it.

  ---

  #### **LAYER 1: FOOD AVAILABILITY**  
  *Question: Was there *less physical food* in the affected area compared to baseline?*  
  **Sources:** Crop production data, market stock inventories, import/export logs, satellite imagery.  
  **Off-ramp if insufficient:** *"Availability change indeterminate; proceed to access analysis."*  
  - **Actionable thresholds:**  
    - ≥15% drop in annual production? → **Availability decline likely**  
    - Stable production but ≥20% drop in imports? → **Availability decline possible**  
    - No data? → **Insufficient evidence**  
  **Historical anchor (Bengal 1943):** *Ignore aggregate debates.* Focus on local flows: if key markets show stock depletion despite normal harvests elsewhere (e.g., Calcutta diverting grain for war), record as **"Local availability failure due to extraction."**  

  ---

  #### **LAYER 2: ACCESS FAILURE MECHANISM**  
  *Question: Which entitlement(s) collapsed for the affected group?*  
  **Sources:** Price/wage data, household surveys (minimum 15 rapid interviews), movement permits, trader records.  
  **Off-ramp:** *"Access failure confirmed but mechanism unclear; no attribution."*  
  - **Four failure types (Sen + field add-ons):**  
    1. **Production-based:** Crop loss for *own-consumption* farmers.  
       - *Evidence check:* Affected group relies on own farm? Crop loss >30%?  
    2. **Trade-based:** Income collapse for net food buyers.  
       - *Evidence check:*  
         - **Prices:** Staple price increase >100% vs. baseline?  
         - **Wages:** Daily wage buys <50% of daily kcal need?  
         - **Movement:** Banned from markets? Key roads/ports closed? (e.g., pastoralist trade routes)  
    3. **Labor-based:** Jobs vanished or wages collapsed.  
       - *Evidence check:* Unemployment >40%? Wage drop >50%?  
    4. **Transfer-based:** Safety nets failed (state, kin, NGOs).  
       - *Evidence check:* CFW/rations <50% coverage? Aid blocked?  
  **Historical anchor (Ireland):** *Subsistence crop failure isn't automatic availability failure.* Test: Could other foods fill the gap? (e.g., Ireland's oats exported while potatoes rotted → **Trade failure dominates**).  

  ---

  #### **LAYER 3: AGENCY & DECISIONS**  
  *Question: Whose actions/inactions *materially enabled* the access failure?*  
  **Sources:** Policy documents, meeting minutes, early warning logs, access denials.  
  **Off-ramp:** *"Agency indeterminate; state capacity constraints possible."*  
  - **Decision tree:**  
    1. Was the access failure *foreseeable*? (e.g., EWS alerts >6 months prior)  
    2. Did any actor have *authority* to prevent it? (e.g., ministry, rebels, donors)  
    3. Did they *act/reasonably attempt* to mitigate?  
       - **Yes** → *Natural disaster/complex emergency*  
       - **No** → Proceed:  
          - **Negligence:** Inaction despite capacity (e.g., ignored warnings)  
          - **Deliberate:** Policies worsened access (e.g., export bans, movement restrictions)  
          - **Culpable ignorance (Great Leap):** False reporting/blocked data collection? → **State responsibility for information sabotage**  
  **Historical anchor (Great Leap):** *Broken feedback loops = agency.* If surveys blocked/yields inflated → **Automatic "culpable ignorance"** even without malicious intent.  

  **Director’s call required for:**  
  - Naming specific state/non-state actors  
  - Attribution of "deliberate" or "culpable ignorance"  
  - Cases with access agreement sensitivities  

  ---

  ### **WORKED EXAMPLES**  

  #### **Case 1 (Cyclone)**  
  - **Layer 1:** *Availability decline confirmed* (30% harvest loss).  
  - **Layer 2:** **Labor-based failure.** Landless wages fell 70%; rice prices 3x. CFW absent in 3 districts.  
  - **Layer 3:** Government ran CFW in 2/5 districts → **Negligence** (selective implementation).  
  - **Attribution draft:**  
  > *"Acute malnutrition was driven by wage collapse among coastal laborers, despite rapid aggregate supply recovery. Government cash-for-work programs, unevenly implemented, failed to offset entitlement losses in worst-hit districts."*  

  #### **Case 2 (Trade Collapse)**  
  - **Layer 1:** *No availability decline* (harvests normal).  
  - **Layer 2:** **Trade-based failure.** Livestock-to-grain terms of trade fell 80%; charcoal ban eliminated 60% of cash income.  
  - **Layer 3:** Ministry sat on EWS alerts for 14 months → **Negligence.** Border closure by warring party → **Deliberate** (non-state).  
  - **Director call:** *Flag non-state actor naming risk.*  
  - **Attribution draft:**  
  > *"Collapse of cross-border trade and local livelihoods triggered crisis despite adequate food supplies. Authorities failed to act on advanced warnings, while conflict parties restricted movement."*  

  #### **Case 3 (Political Blockade)**  
  - **Layer 1:** *Availability indeterminate* (survey teams blocked).  
  - **Layer 2:** **Transfer-based failure.** Verified: state rations diverted; opposition assembly blocked.  
  - **Layer 3:**  
    - Mortality data consistent across clinics/NGOs.  
    - National government ignored assembly requests + blocked surveys → **Deliberate inaction.**  
    - *Analyst bias check:* Democracy ≠ famine-proof. Data concordance >90% overrides "impossibility" priors.  
  - **Director call:** *High-risk naming required. Recommend: "State authorities" + "elected regional bodies."*  
  - **Attribution draft:**  
  > *"Famine occurred after sustained erosion of food access via politicized aid obstruction. State and regional actors failed to respond despite public evidence of deteriorating conditions."*  

  ---

  ### **LIMITS & SAFEGUARDS**  
  **Data gaps that force "indeterminate":**  
  - No occupational data on the dead → Can’t confirm affected group’s entitlement type  
  - No real wage/price series → Can’t quantify labor/trade failure  
  - No policy paper trail → Agency layer impossible  

  **Handling obstruction:**  
  - If surveys blocked, default to **"culpable ignorance"** (Great Leap rule).  
  - If only market data missing, use neighboring district proxies (+15% uncertainty buffer).  

  **Preventing "cannot know" dodge:**  
  - Set 24-hr evidence search deadline. If critical data missing, state: *"Attribution limited by [specific] data gaps."*  
  - Mandatory re-run if:  
    - New mortality data emerges  
    - Previously hidden documents surface  
    - 6 months pass without update  

  **Banned phrases (smuggle assumptions):**  
  - *"Complex interplay of factors"* → Vague  
  - *"Compounded by conflict/drought"* → Merges layers  
  - *"Systemic vulnerabilities"* → Hides agency  
  - *"Climate shocks intensified crisis"* → Assumes natural cause  

  **Final output:** One paragraph per layer:  
  1. Availability status  
  2. Key access failure(s)  
  3. Agency conclusion (or "indeterminate")  

  This forces clarity, separates evidence, and flags when politics—not data—determines silence.  

  ---  
  *Procedure end. No caveats, no citations: built for your desk, not a seminar.*
