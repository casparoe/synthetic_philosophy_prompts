prompt: |-
  A friend of mine who reads a lot of consciousness science posted this on our Discord, and I want a sanity check before I reply:

  "Ned Block split consciousness into two pieces. Access consciousness is the information that gets broadcast widely, so it's available to reasoning, speech and action control; phenomenal consciousness is the leftover raw feel that doesn't do anything. Global workspace theorists accept the split but say the second piece is an illusion — when the brain broadcasts information globally, that just is what experiencing feels like from the inside, so there's no extra ingredient hiding behind it. Block's stock evidence against them is Sperling's letter-grid experiments: flash twelve letters for a fraction of a second, people insist they saw all of them but can only report three or four, which means they were phenomenally conscious of all twelve and only three ever made it into access. So Block concludes workspace theory leaves out the very thing we care about, and the workspace people reply that the unreported letters were never experienced at all. Which is just two intuitions squaring off, and honestly the intuition that there's a rich screen behind your eyes is stronger than any lab result, so I'm with Block. Also: if phenomenal consciousness really is a separate nonfunctional property, the zombie argument comes for free — that's the same move Chalmers makes."

  How much of that holds up? Go through it claim by claim and tell me what Block would happily sign off on, what a workspace theorist would accept with a wince, and what's just a muddle. Something about "two pieces" feels wrong to me but I couldn't say why, and I suspect he's sliding between Block's conceptual distinction and the actual neural mechanism the theory proposes. Then: does his "it's intuitions all the way down" conclusion survive once the errors are fixed, and does the zombie inference follow from anything true in there? I come at this from a functionalist direction so I might just be motivated to think he's wrong.
reasoning: |-
  Okay, let me start by unpacking this user's query. They shared a friend's post about Ned Block's distinction between access and phenomenal consciousness, specifically referencing the Sperling experiment and the global workspace theory (GWT) debate. The user wants a sanity check before replying, pointing out potential muddles and asking whether the friend's conclusion about intuitions and zombies holds up.

  First, I need to recall Block's original concepts. Access consciousness (A-consciousness) is about information availability for global use—like reporting or reasoning. Phenomenal consciousness (P-consciousness) is the subjective experience itself. The friend claims Block split consciousness into two pieces, but Block actually presents them as conceptually distinct, not necessarily separate in the brain. So the "two pieces" phrasing might imply a neural separation that isn't there, which could be a point of confusion.

  Next, the global workspace theorists' position. They argue that once information is globally broadcast, that constitutes phenomenal experience. The friend says GWT treats P-consciousness as an illusion, but that's not accurate. Theorists like Dehaene see global broadcasting as the mechanism for both access and phenomenality. They don't deny phenomenality; they redefine it functionally. So the friend's characterization here is oversimplified.

  The Sperling experiment is central. Participants see a grid of letters briefly and report seeing all but can only name a few. Block uses this to argue for rich P-consciousness without A-consciousness. GWT counters that unreported letters weren't consciously experienced—perhaps only a gist was. The user's friend thinks this reduces to dueling intuitions, but modern neuroscience adds nuance. For example, sensory memory (iconic memory) might explain the "seeing" without access. Also, attention plays a role; without attention, those letters might not be phenomenally conscious. So it's not just intuitions—there's empirical data on neural correlates.

  The zombie argument comes up next. If P-consciousness is non-functional, philosophical zombies (identical functionally but no experience) are possible. But GWT and functionalists reject this by tying phenomenality to functional roles. The friend's claim that Block's view leads to zombies "for free" is correct, but that's a point of contention, not consensus.

  The user suspects a slide between conceptual distinction and neural mechanisms. That’s valid. Block's distinction is conceptual; GWT is a neural theory. Conflating them causes confusion. The friend's "strong intuition" of a rich inner screen might be compelling, but it’s contested. Some argue that without attention or access, there's no rich phenomenology—just potential. The user, being functionalist, likely disagrees with Block, so their suspicion makes sense.

  To summarize: The friend has some Block and GWT points right but oversimplifies. Key muddles include treating the distinction as neural, misrepresenting GWT's stance on illusion, and reducing Sperling to pure intuition. Neuroscience offers more than intuitions. Zombies follow only if P-consciousness is non-functional, which functionalists dispute. The user should clarify these points in their reply, separating concepts from mechanisms and highlighting empirical nuances beyond intuition wars.
answer: |-
  Here's a breakdown of your friend's claims, separating accurate points, common misunderstandings, and points of contention between Block and Global Workspace Theory (GWT). I'll follow your structure and address your specific concerns:

  **Claim-by-Claim Breakdown:**

  1.  **"Ned Block split consciousness into two pieces."**
      *   **Block:** Would mostly sign off, *but with a crucial clarification*. He distinguishes two *concepts* or *aspects*: **Access Consciousness (A-consciousness)** and **Phenomenal Consciousness (P-consciousness)**. He *doesn't* necessarily claim they are implemented by completely separate neural "pieces" (though some interpretations lean that way). The distinction is primarily conceptual/functional.
      *   **GWT Theorist (e.g., Dehaene):** Would wince significantly. They see this as a *conceptual* mistake. For them, consciousness *is* global access. There aren't two fundamentally different things; phenomenality *arises from* or *is identical to* the global availability of information. Block's distinction seems to carve nature at the wrong joints.
      *   **Your Suspicions ("two pieces feels wrong", "sliding") are Spot On:** Your intuition is correct. Block distinguishes *aspects* conceptually. GWT proposes a specific *neural mechanism* (global broadcasting) as the basis for conscious experience. Your friend's phrasing ("split consciousness into two pieces") risks conflating Block's conceptual distinction with a claim about separate neural modules/systems, which isn't Block's core argument and is actively denied by GWT. This conflation is a common source of confusion.

  2.  **"Access consciousness is the information that gets broadcast widely... phenomenal consciousness is the leftover raw feel that doesn't do anything."**
      *   **Block:** Would sign off on the core description of A-consciousness (global availability for control). He'd strongly agree P-consciousness is the "raw feel" (qualia). He'd *resist* saying it "doesn't do anything" *in principle* – he argues it *might* have functions we don't understand, but crucially, it's defined *independently* of cognitive access/function. Its *essence* is the qualitative feel, not its causal role. He thinks it exists even when not accessed.
      *   **GWT Theorist:** Would strongly reject the "leftover raw feel that doesn't do anything." They see this as incoherent. For them, the "raw feel" *just is* what global access feels like from the inside. There *is* no "leftover" feel. If it's not globally accessed, it's not conscious. They might agree that non-conscious processing has qualitative *potential* or precursors, but not actual phenomenality.
      *   **Muddle?** "Doesn't do anything" is an oversimplification. Block's point is that P-consciousness isn't *defined by* its functional role in cognition/control. GWT defines it precisely by that role.

  3.  **"Global workspace theorists accept the split but say the second piece is an illusion."**
      *   **Block:** Would say this is mostly accurate regarding GWT's *denial* of P-consciousness as Block defines it.
      *   **GWT Theorist:** Would wince strongly at the word "illusion." They don't think phenomenality is an illusion! They think they have *explained* what phenomenality *is*: the first-person perspective on globally accessed information. They deny Block's *conception* of P-consciousness as something separable from global access. They think Block is misdescribing the phenomenon.
      *   **Muddle?** Yes. Calling P-consciousness an "illusion" in GWT is misleading. GWT redefines it, explains it mechanistically, and argues Block's conception is mistaken, not that the experience itself is unreal.

  4.  **"Block's stock evidence against them is Sperling's letter-grid experiments..."**
      *   **Block:** Would sign off entirely. This is indeed his primary empirical argument against GWT.
      *   **GWT Theorist:** Would accept the *phenomenon* (rich subjective impression, limited report) but *completely reject Block's interpretation*. They argue:
          *   Participants only have a *sense* or *gist* of richness (e.g., "I saw letters"), not detailed phenomenal content for all 12 letters simultaneously.
          *   The unreported letters reside in a transient, high-capacity **sensory memory buffer (iconic memory)**, which is *pre-conscious*. Attention is needed to transfer items into the global workspace for conscious access and report. What people report "seeing" is a reconstruction based on this brief sensory trace and the gist, not proof of conscious phenomenality for all letters.
          *   The "raw visual feel" *is* the content accessed by attention and made globally available; the unattended letters lack this full phenomenality.

  5.  **"Block concludes workspace theory leaves out the very thing we care about... workspace people reply that the unreported letters were never experienced at all."**
      *   **Block:** Yes, that's his conclusion: GWT captures access but misses the essence of phenomenality revealed in Sperling.
      *   **GWT Theorist:** Yes, that's their counter: Only the attended/cued letters (or perhaps the gist) were phenomenally conscious. The rest was pre-conscious sensory memory. They argue Block misinterprets the subjective report as evidence for rich phenomenality *without* access.

  6.  **"Which is just two intuitions squaring off..."**
      *   **Block:** Would strongly disagree. He sees Sperling as providing empirical evidence *for* rich phenomenality without access, challenging the GWT equation.
      *   **GWT Theorist:** Would also disagree, arguing their position is based on cognitive neuroscience (limits of attention, role of sensory buffers, neural correlates of reportability) and a more parsimonious interpretation of subjective reports (gist + reconstruction).
      *   **Muddle?** Yes and No. At the *interpretative core* lies a fundamental clash of intuitions about what constitutes phenomenality. However, both sides marshal empirical data and theoretical arguments beyond *just* intuition. Sperling provides a crucial empirical phenomenon that *forces* this clash of interpretations. It's the *interpretation of the data* where the core intuition clash happens.

  7.  **"...honestly the intuition that there's a rich screen behind your eyes is stronger than any lab result, so I'm with Block."**
      *   **Block:** Would likely agree that the introspective intuition is powerful and primary evidence for his view.
      *   **GWT Theorist:** Would argue this intuition is demonstrably flawed. Our sense of a rich visual field is constructed from limited foveal input, attention, and expectations. Experiments like change blindness and inattentional blindness show we miss massive changes outside attention. They see the "rich screen" intuition as a compelling illusion created by our cognitive architecture, not proof of actual rich phenomenality everywhere at once.
      *   **Does it survive?** Your friend leans heavily on intuition. While powerful, this intuition is contested by empirical findings suggesting our sense of richness is often a *post-hoc* reconstruction or gist. The debate isn't settled by intuition alone; it hinges on how best to interpret complex experimental data (like Sperling, change blindness) and underlying neural mechanisms.

  8.  **"Also: if phenomenal consciousness really is a separate nonfunctional property, the zombie argument comes for free — that's the same move Chalmers makes."**
      *   **Block:** Would likely agree that *if* P-consciousness is fundamentally non-functional (i.e., its essence isn't captured by functional role), then philosophical zombies (functional duplicates without experience) are conceivable. He's sympathetic to this view. He explicitly contrasts his position with "functionalism" about experience.
      *   **GWT Theorist:** Would vehemently reject the premise. For them, P-consciousness *is* a functional property (global availability). Zombies are therefore inconceivable – a functional duplicate *would* have experience by definition in GWT. They see the zombie argument as begging the question by assuming phenomenal properties aren't functional.
      *   **Does the inference follow?** **Yes, logically.** *If* P-consciousness is a non-functional property (Block/Chalmers' position), then a system could be functionally identical but lack this non-functional property (a zombie). **However, GWT and functionalists fundamentally reject the "if".** They argue P-consciousness *is* functional. So the zombie argument doesn't follow *from* GWT or functionalism; it follows *from* Block/Chalmers' specific metaphysical stance, which GWT denies.

  **Summary & Your Questions:**

  *   **"How much holds up?"** Your friend accurately reports the *positions* of Block and GWT regarding the conceptual split, Sperling as evidence, and the core disagreement about phenomenality without access. However, there are significant muddles:
      *   Conflating Block's *conceptual distinction* with a claim about separate neural "pieces".
      *   Mischaracterizing GWT's view as saying phenomenality is an "illusion" (they redefine it).
      *   Oversimplifying the Sperling debate as "just intuitions" (it's interpretations of empirical data).
      *   Underestimating GWT's counter-arguments based on sensory memory and attention.
  *   **"Two pieces feeling wrong":** Your intuition is correct. Block distinguishes *aspects* (A-consciousness vs. P-consciousness). GWT proposes a *mechanism* (global broadcasting) that they claim constitutes consciousness. Calling them "two pieces" risks implying separate neural entities, which isn't Block's core claim and is denied by GWT.
  *   **"Does 'intuitions all the way down' survive?"** **No, not really.** While core intuitions about phenomenality drive the interpretations, both sides appeal to empirical data (Sperling, neuroscience of attention/sensory memory) and theoretical frameworks to support their interpretations. It's not *just* raw intuition vs. raw intuition.
  *   **"Does the zombie inference follow?"** **It follows logically *if* you accept Block/Chalmers' premise that P-consciousness is fundamentally non-functional.** However, GWT and functionalism *deny* that premise. The zombie argument is a consequence of Block's view, not an independent conclusion drawn from the Sperling debate alone. It's a point *against* functionalism, not a point derived solely from the evidence discussed.

  **Your Functionalist Perspective:** Your functionalist inclination makes you rightly skeptical of your friend's strong endorsement of Block. GWT *is* a form of functionalism. Block's position *does* open the door to epiphenomenalism and zombies, which functionalists reject. Your friend leans heavily on the "rich screen" intuition, which functionalists argue is misleading and explained by underlying functional processes (like gist extraction and rapid attentional shifts). The Sperling experiment remains a key battleground, but GWT offers a coherent functionalist interpretation that doesn't require inaccessible phenomenality.

  **What to Reply:** You could point out:
  1.  Block's distinction is conceptual, not necessarily about "pieces" in the brain.
  2.  GWT doesn't call phenomenality an illusion; it redefines it as global access.
  3.  The Sperling debate involves complex interpretations of sensory memory and attention – it's not *just* conflicting intuitions.
  4.  GWT provides a functionalist counter-explanation for the "rich screen" intuition.
  5.  The zombie argument only follows if one *already accepts* that phenomenality is non-functional, which GWT denies. It's not a "free" consequence of the Sperling debate itself.
