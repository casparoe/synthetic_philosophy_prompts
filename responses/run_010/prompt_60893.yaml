answer: |-
  ### Workshop Take-Home Assignment: Markets as Knowers

  **Background:** The *Regional Echo* starts an internal prediction market for staff. Contracts pay out on events like "Mayor indicted by June 30th", "St. Mary’s & Royal Infirmary Trusts merge by year-end", or "CEO X resigns by March 31st". Consider these facts:

  1.  Everyone trading is a staffer at the *Regional Echo*, with the same document access, the same contacts list, and the same freedom to call people.
  2.  The paper subsidises the market – staff trade with a budget provided by the paper and do not lose their own money if wrong.
  3.  Two reporters, Alex and Bailey, are both careful and well-calibrated (their predictions are accurate over time). They know each other is careful and well-calibrated, and they have swapped every document either holds. They still bet against each other on the mayor's indictment contract. Repeatedly. Cheerfully.
  4.  Trading volume is high, and market prices reliably move significantly *before* major public announcements related to the contract events.
  5.  The editors read the market prices every morning and use them to decide which stories to assign reporters to investigate that week.

  **Your Task (45 minutes):** Analyze this case by answering the following three questions. Reference the specific numbered facts above where relevant.

  **(a) (8 points)** Fact 3 describes Alex and Bailey trading despite sharing all information. The "No-Trade Theorem" and the "Agreeing-to-Disagree Theorem" predict this shouldn't happen under certain assumptions. What specific behaviour do these theorems say *shouldn't* be happening? Given that Facts 1 and 3 seem to close off common explanations (like different information or one trader being irrational), which core assumption underlying these theorems is most likely being violated here? Be precise.

  **(b) (8 points)** Fact 4 shows the market moves before announcements and has high volume. Editors likely infer this means the market price is accurately revealing hidden information. Why is this inference potentially flawed? Specifically address two issues: (i) How could high volume and seemingly prescient price moves occur *without* the market revealing new information? (ii) Why is the market price *not* a direct probability estimate once we consider concepts like risk premium and favourite-longshot bias?

  **(c) (9 points)** Consider Facts 2 and 5 together. There’s a reflexive wrinkle: If market prices truly revealed *everything* (were "strong-form efficient"), reporters might stop digging for costly information, making prices uninformative. Conversely, if the paper *does* pay reporters to dig (via salaries and assignments driven by prices), the price partly reflects the *subsidy* and the *editors' assignment habits*, not just the underlying event probability. What does this reflexivity do to the editors' claim that the prices are trustworthy guides to reality? Does Fact 5 (editors using prices to assign stories) rescue the claim or wreck it? Explain.

  ---

  ### Model Answer (~700 words)

  **(a) The Trading Puzzle and the Violated Assumption**

  The behaviour described in Fact 3 – Alex and Bailey repeatedly trading against each other despite sharing all documents, knowing each other is careful and well-calibrated – directly contradicts predictions from two key results in decision theory and economics: the **No-Trade Theorem** and the **Agreeing-to-Disagree Theorem**.

  *   **The No-Trade Theorem** states that if two rational traders share a common prior belief about the probability of an event, and it is **common knowledge** that they are both rational and that they share all relevant information, then they should *never agree to trade* with each other. Trading requires both parties to believe they are gaining from the exchange. If they share all information and agree on its interpretation (due to common priors and rationality), they must hold the *same* valuation for the contract, leaving no mutually beneficial trade possible.
  *   **The Agreeing-to-Disagree Theorem** reinforces this, stating that if two rational agents with common priors share all their information, they cannot rationally continue to hold different probability assessments ("disagree") about the event; they must converge to the *same* belief.

  Fact 3 explicitly states they trade "repeatedly" and "cheerfully," defying these predictions. Facts 1 (same access, contacts) and 3 (shared documents, known calibration) strongly suggest that differences in raw information or blatant irrationality aren't the drivers.

  The core assumption violated here is **common priors**. The theorems assume Alex and Bailey start with identical initial probability estimates (priors) before receiving any private information. However, Fact 3 shows they persistently disagree *even after sharing all information*. This implies their fundamental interpretations of the *same* information differ. Alex might intrinsically weigh the mayor's cryptic statement more heavily than Bailey, or Bailey might have a different threshold for what constitutes "sufficient evidence" for indictment based on their underlying models of politics or law. Their disagreement stems from deeply held, differing prior beliefs about how the world works, which aren't resolved by swapping documents. The "common knowledge of rationality" exists, but the "common priors" assumption does not hold.

  **(b) Why Prescient Prices & High Volume Don't Guarantee Truth**

  The editors' inference from Fact 4 (prices move early + high volume) that the market price reliably reveals truth is flawed for several reasons.

  **(i) Non-Informative Drivers of Volume & Price Moves:** High volume doesn't necessarily signal new information. In this subsidized market (Fact 2), traders aren't risking personal money. This encourages more trading for reasons unrelated to information:
      *   **Pure Risk Transfer:** Traders with different risk tolerances might trade simply to shift risk, even if they agree on the probability. Alex might be risk-averse and sell a contract she thinks is 60% likely, while risk-tolerant Bailey buys it at the same price.
      *   **Noise Trading/Liquidity Needs:** Traders might buy or sell for reasons unrelated to the event probability – needing "cash" for another trade, boredom, or experimentation encouraged by the subsidy.
      *   **Seemingly Prescient Moves:** Price movements before announcements could be driven by *rumours, leaks, or correlated events* that become known to the *entire* newsroom simultaneously (per Fact 1) and are acted upon by multiple traders at once, creating a price shift. This reflects shared public information hitting the market, not the market *generating* new private insight. It could also be coincidental noise mistaken for prescience.

  **(ii) Price ≠ Probability:** Even if the market aggregates some information, the price is not a pure probability estimate. Two key concepts distort it:
      *   **Risk Premium:** Traders demand compensation for bearing risk. If an event is perceived as volatile or the outcome highly consequential, buyers will demand a lower price (higher implied probability) or sellers a higher price (lower implied probability) than the true probability to compensate for the risk. The price embeds this risk adjustment.
      *   **Favourite-Longshot Bias:** A well-documented empirical phenomenon in betting markets where traders systematically overestimate the probability of rare events ("longshots") and underestimate the probability of likely events ("favourites"). A contract trading at a price implying a 10% chance might truly only have a 5% chance, while one implying 90% might truly have a 95% chance. The market price is a biased estimator of probability.

  Therefore, Fact 4 shows the market is active and reacts to developments, but it doesn't prove the price is an accurate, unbiased reflection of the "true" probability.

  **(c) Reflexivity: Subsidy, Assignments, and the Claim's Foundation**

  The combination of Fact 2 (subsidy) and Fact 5 (editors using prices for assignments) creates a **reflexive feedback loop** that fundamentally undermines the editors' claim that prices are pure guides to reality.

  *   **The Self-Undermining Problem:** If the market price *were* perfectly informative ("strong-form efficient"), revealing *all* knowable details about the likelihood of the mayor's indictment or the merger, then reporters would have *no incentive* to incur the cost (time, effort) of digging for new information. Why bother calling contacts if the price already reflects everything? But if no one digs, no new information enters the market, and the price becomes stale and uninformative. Perfect efficiency destroys the incentive to gather the information that makes it efficient.
  *   **The Subsidy Distortion:** The paper breaks this deadlock by subsidizing both the market *and* the reporting effort (salaries). Editors use prices (Fact 5) to decide *where* to direct costly digging. This creates a loop:
      1.  Prices (based on current info) influence editor assignments (Fact 5).
      2.  Reporters dig on assigned stories (costly information gathering).
      3.  New information from digging potentially enters the market (via trades by those reporters or others they inform).
      4.  Prices update.
      5.  Updated prices influence *new* assignments... and so on.

  **Impact on the Claim:** This loop means prices are *not* pure reflections of the underlying event probability. They are **contaminated** by:
      *   **The Subsidy:** The market only exists and has volume because losses aren't real. This inflates trading activity, potentially including noise trades, beyond what a real-money market would see.
      *   **Editorial Assignment Bias:** Prices reflect the outcomes of *past* editorial decisions driven by *past* prices. If editors consistently assign based on high prices implying likelihood, the market will disproportionately reflect information gathered *about high-priced events*, potentially missing developments in areas deemed low-probability and thus unassigned. The price becomes a signal of "where the paper is looking," not an unbiased signal of "what's objectively happening."

  **Does Fact 5 Rescue or Wreck?** Fact 5 **wrecks** the editors' claim of prices being pure truth machines. While the loop *does* mean the price likely contains *some* information derived from costly digging paid for by the subsidy, it confirms the price is a product of the *system* itself – the subsidy and the editorial process guided by prior prices. The price becomes a measure of "what the subsidized market, fueled by assignments driven by our own prior prices, currently suggests," heavily influenced by where the paper has chosen to focus its resources. It is not a clean, independent oracle of the world. The very act of using prices to guide assignments injects editorial bias and path-dependence into the price signal.

  ---

  ### Marking Scheme (Total: 25 points)

  **Focus:** Reward precise application of concepts to the *specific* facts of the case. Deduct for vagueness, misapplication of concepts, ignoring facts, or common journalistic oversimplifications listed below.

  **(a) What shouldn't happen & which assumption fails? (8 points)**
  *   **(2 pts)** Correctly identifies the forbidden behaviour: Rational, fully informed traders with common knowledge of this *should not trade* (No-Trade) and *must agree* (Agreeing-to-Disagree).
  *   **(2 pts)** Clearly references Facts 1 & 3 to rule out different information/access or irrationality as sufficient explanations.
  *   **(4 pts)** Precisely identifies **Common Priors** as the violated assumption. Must state this clearly and link it to the persistent disagreement arising from differing fundamental interpretations/models *despite* shared documents/access/knowledge of calibration. *Deduct 2 pts* if they vaguely say "different beliefs" without specifying it's the *prior* belief assumption or conflate it with different information (ruled out by facts). *Deduct 1-2 pts* if they reach for "overconfidence" or other biases as the *primary* reason without acknowledging the theorems' specific assumptions.

  **(b) Why Fact 4 doesn't justify the inference? (8 points)**
  *   **(i) Non-Informative Drivers (4 pts):**
      *   (2 pts) Explains how **high volume** can arise from **pure risk transfer** (different risk tolerances) or **noise trading/liquidity needs** (especially enabled by subsidy - Fact 2), *without* new information.
      *   (2 pts) Explains how **prescient price moves** could be caused by **shared rumours/leaks/correlated events** (consistent with Fact 1 - same access) hitting the whole group simultaneously, or be **coincidental noise**, *not* necessarily the market synthesizing private insight.
  *   **(ii) Price ≠ Probability (4 pts):**
      *   (2 pts) Correctly defines **Risk Premium** (compensation for bearing risk distorts price away from true probability) and applies it to the case.
      *   (2 pts) Correctly defines **Favourite-Longshot Bias** (systematic mispricing of odds at extremes) and applies it to the case. *Deduct 1-2 pts* if they mention EMH vaguely instead of these specific distortions. *Deduct 2 pts* if they state high volume *itself* is evidence of information.

  **(c) Reflexivity & Impact of Facts 2 & 5 (9 points)**
  *   **(3 pts)** Explains the **Self-Undermining Problem:** If prices were perfectly informative (strong-form efficient), no incentive to dig -> prices become uninformative.
  *   **(3 pts)** Explains the **Distortion from Subsidy & Assignment Loop:**
      *   Prices influence assignments (Fact 5).
      *   Assignments drive costly digging (paid by subsidy - Fact 2).
      *   Digging findings feed back into prices.
      *   Prices thus reflect the subsidy *and* editorial bias (focus on high-price events).
  *   **(3 pts)** Clearly states this reflexivity **wrecks** the editors' claim that prices are pure truth guides. Prices measure the output of the *paper's own subsidized system and assignment choices* (path-dependence, bias), not an objective reality. Explicitly uses Fact 5 as integral to creating the distorting loop. *Deduct 2-3 pts* if they only say "prices aren't perfect" without explaining *how* the loop distorts them or why Fact 5 is crucial to the distortion. *Deduct 1 pt* if they suggest Fact 5 "rescues" by providing info flow, without acknowledging the resulting contamination.

  **Separating A from B Answers:**
  *   **A Answers (21-25 pts):** Make *all* the key moves above precisely. Crucially for (c), they don't just *name* reflexivity or subsidy; they *explicitly trace the causal loop* (Price -> Assignment (Fact 5) -> Digging (cost paid via subsidy - Fact 2) -> (Potential) Info -> Price) and *clearly articulate* how this makes the price a measure of "where the paper is looking" (editorial bias/path-dependence) funded by the subsidy, fundamentally undermining its objectivity. They see Fact 5 as the *mechanism* injecting editorial bias into the price.
  *   **B Answers (16-20 pts):** Generally get the labels right (No-Trade, Risk Premium, Reflexivity) and identify the main issues in (a) and (b). However, in (c), they often miss the *specific, causal role of Fact 5* in the distortion. They might correctly state the subsidy removes incentives or that reflexivity exists, but fail to explicitly link *editorial assignments driven by prices* (Fact 5) as the key step that directs costly digging and biases *which* information enters the market, making the price path-dependent and reflective of past editorial choices. They might say "prices aren't pure truth because of the subsidy" without fully unpacking *how* the assignment loop creates systemic bias. They understand the components but don't fully synthesize the loop's distorting effect.
