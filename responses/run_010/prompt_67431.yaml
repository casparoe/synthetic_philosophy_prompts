answer: |-
  ## Exam Question: Turing's ESP Objection and its Implications (25 marks total)

  *(Stem)* In the closing subsection of *Computing Machinery and Intelligence*, Turing addresses the objection from extra-sensory perception (ESP). He concedes that the statistical evidence for telepathy is "overwhelming" and unusually impressive. He entertains the possibility that a machine might possess telepathic abilities and proposes that if ESP were admitted as genuine, the imitation game testing arrangements would need alteration – specifically, placing the interrogator and witness in a "telepathy-proof room" – to screen out this non-sensory channel of influence.

  **(a)** Explain the purpose of Turing's discussion of ESP within his overall defence of machine intelligence, focusing on the specific alteration he proposes and what this concession implies about the *kind* of evidence he believes the imitation game fundamentally relies upon. (10 marks)

  **(b)** Assess whether this subsection represents a significant philosophical concession undermining the behaviourist foundations of the imitation game test, or whether it is merely an inconsequential historical footnote concerning experimental design. In your answer, consider specifically the tension between the need for this alteration and the test's aim to judge intelligence based solely on external behaviour. Additionally, discuss the implications of this discussion for Turing's much briefer dismissal of the 'Argument from Consciousness' earlier in the same article. Can these two treatments be reconciled within Turing's overall position? (15 marks)

  ---

  ## Model Answer (Strong First-Class Standard)

  Turing's inclusion and unusually serious treatment of the ESP objection in the final subsection of his seminal paper serves a critical, though often misunderstood, function within his broader argument for the possibility of machine intelligence. Far from being a biographical quirk, this passage engages deeply with the epistemological foundations of his proposed test and reveals important nuances in his behaviourist commitments.

  **(a)** Turing's primary aim in discussing ESP is to demonstrate the robustness and adaptability of the imitation game methodology. Faced with an objection alleging a *non-behavioural* channel potentially granting an unfair advantage (or disadvantage) to the machine, Turing does not dismiss it out of hand, unlike many others in his catalogue. Instead, he grants the objection significant empirical weight, acknowledging the perceived strength of statistical evidence for telepathy. Crucially, he even entertains the radical idea that a machine *could* be telepathic. His response is not to abandon the test but to propose a modification: placing the interrogator and the human witness (against whom the machine is compared) in a "telepathy-proof room." This specific alteration is profoundly revealing. Its purpose is to *isolate the behavioural channel*. By screening out potential ESP, Turing ensures that the interrogator's judgement is based *exclusively* on the textual responses provided during the interrogation – the observable, external behaviour. This concession implies that the imitation game fundamentally relies upon evidence transmitted through *ordinary sensory channels* (sight, sound via teletype). The test is designed to assess intelligence based solely on the capacity to produce appropriate linguistic behaviour in response to stimuli received through these conventional means. The ESP discussion underscores that the test's validity hinges on controlling the *inputs and outputs* to which the interrogator has access, ensuring the judgement is made purely on the basis of observable communicative performance.

  **(b)** This subsection is philosophically load-bearing, not merely an historical curiosity. It creates a significant tension within the behaviourist framework often attributed to the imitation game. The core behaviourist claim underpinning the test is that indistinguishability in linguistic behaviour under standard observational conditions is sufficient grounds to attribute thought or intelligence. However, Turing's concession to the ESP objection suggests that this indistinguishability must be achieved *specifically under conditions where no non-behavioural access to mental states is possible*. The very need for a "telepathy-proof room" implicitly acknowledges that if such non-behavioural access *were* possible and operative, it could invalidate the test's conclusion. This implies that indistinguishability under *ordinary* conditions might *not* be sufficient if extraordinary channels exist. It subtly concedes that the test works only because, and insofar as, our ordinary epistemic access to other minds *is* confined to behavioural evidence. If a direct, non-behavioural peek into the "mind" were available and used, the behavioural criterion itself might become inadequate or irrelevant for the intended inference. In essence, the modification protects the test by enforcing the very behavioural isolation that behaviourism assumes is our natural epistemological state.

  This creates a stark contrast with Turing's dismissive treatment of the 'Argument from Consciousness' earlier in the article. There, he famously sidesteps the metaphysical question of whether a machine could *feel* by asserting the methodological principle of the imitation game: if the machine behaves indistinguishably from a conscious human, we should grant it the status of thinking. He treats consciousness as irrelevant to the operational test. The ESP objection, however, forces him to confront a scenario where behaviour *alone*, gathered through standard channels, might be insufficient precisely because of a potential *non*-behavioural factor directly related to mental state (telepathic awareness). This seems to grant a foothold to the idea that something *beyond* externally observable behaviour – something internal and potentially directly accessible only non-behaviourally – could be relevant to the ascription of intelligence or mind, which is precisely the concern underlying the consciousness objection.

  Reconciling these treatments is challenging but possible within Turing's framework. One could argue that the ESP concession is purely about *experimental hygiene* and *epistemology*, not metaphysics. For *any* empirical test – whether of chemical reactions or intelligence – one must control for confounding variables. ESP, if real, is simply a confounding variable for the specific test setup, interfering with the intended behavioural signal. Turing's point is that *for the purpose of the test*, we must ensure we are testing only behavioural capacity via standard channels. His dismissal of consciousness, conversely, is a metaphysical or methodological claim: he asserts that behavioural evidence *is* sufficient *grounds* for the attribution of thought, irrespective of internal qualia. The ESP alteration ensures the behavioural evidence is *uncontaminated*, it doesn't concede that behavioural evidence is *insufficient* in principle. The telepathy-proof room doesn't validate consciousness as a necessary component; it merely blocks an illicit shortcut that could bypass the behavioural evidence altogether. Thus, while the subsection exposes the delicate foundations of behaviourist epistemology by highlighting its dependence on the absence of non-behavioural access, it does not necessarily force Turing to abandon his core operationalist stance against the consciousness objection. However, it undeniably shows him taking a potential challenge to the *epistemic sufficiency* of behaviour much more seriously than the challenge to its *metaphysical relevance*, revealing a pragmatic tension within his overall defence.

  ---

  ## Marking Scheme (25 marks total)

  1.  **Exposition of Subsection & Alteration (5 marks):**
      *   *Full Credit:* Clear, accurate paraphrase of Turing's unusual concession on ESP evidence, the machine telepathy possibility, and the *specific purpose* of the telepathy-proof room alteration in isolating behavioural communication.
      *   *Common Forfeiture:* Vague description, misstating the alteration's target (e.g., screening machine from interrogator), omitting Turing's unusual seriousness about ESP evidence.

  2.  **Analysis of Philosophical Significance & Tension (7 marks):**
      *   *Full Credit:* Insightful recognition that the need for alteration implies indistinguishability under *standard* conditions might *not* suffice if non-behavioural access exists, creating tension with a core behaviourist assumption of the test's sufficiency. Articulates the implicit concession about the nature of our ordinary epistemic access.
      *   *Common Forfeiture:* Treating it purely as experimental hygiene without seeing the deeper epistemological tension; stating the tension exists but failing to explain *why* (i.e., non-behavioural access undermining behavioural sufficiency).

  3.  **Connection to Argument from Consciousness (5 marks):**
      *   *Full Credit:* Clear contrast drawn between the dismissive treatment of consciousness (behaviour sufficient for attribution regardless of feeling) and the serious concession on ESP (potential non-behavioural access necessitates test modification). Identifies the shared concern about the relevance of the non-behavioural/internal.
      *   *Common Forfeiture:* Superficial comparison, misrepresenting Turing's dismissal of consciousness, failing to articulate the specific point of contrast (sufficiency vs. potential bypass).

  4.  **Evaluation of Reconciliation & Overall Load (5 marks):**
      *   *Full Credit:* Sophisticated evaluation arguing whether the tension can/cannot be resolved (e.g., hygiene vs metaphysics distinction). Concludes convincingly on the subsection's philosophical weight, recognizing it exposes behaviourism's epistemic vulnerability even if not fully undermining Turing's operationalism.
      *   *Common Forfeiture:* Asserting reconciliation or lack thereof without adequate reasoning; concluding it's significant without addressing the potential hygiene defence; concluding it's insignificant without addressing the tension.

  5.  **Structure, Clarity & Argumentation (3 marks):**
      *   *Full Credit:* Logically structured, coherent, precise philosophical prose directly addressing all parts of the question without digression.
      *   *Common Forfeiture:* Disorganized, unclear phrasing, tangential discussion, failure to integrate parts (a) and (b).

  **Cap for Mid-Grade (e.g., 12-16 marks):** An otherwise competent answer will be capped at a mid-grade result if it commits one or more of the following fundamental errors:
  *   **Reduction to Biography/History:** Treating the subsection solely as an interesting fact about Turing's beliefs or the 1950s context, without analysing its argumentative role.
  *   **Debating ESP's Existence:** Shifting focus to whether telepathy is real, rather than analysing Turing's *use* of the objection and its *implications* for his test.
  *   **Irrelevant Name-Dropping:** Invoking figures like Searle (Chinese Room) or Block (absent qualia) to discuss consciousness/behaviourism where Turing's own text and the specific ESP dilemma provide sufficient material.
