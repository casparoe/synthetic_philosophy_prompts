prompt: |-
  I teach one 75-minute session in an upper-division cognitive science seminar, and my assignment is Block's distinction between access consciousness and phenomenal consciousness, followed by the question of what global workspace theory is actually offering an account of. The students can reproduce the labels. What they cannot do is see why the two notions might come apart: asked last week, nearly all said that a broadcast state is by that fact a conscious one, and that the distinction is only a dressed-up contrast between the reportable and the unreportable. Half the class is simultaneously on a neuroethics rotation and will drag everything toward detecting covert command-following in unresponsive patients; I would rather spend that appetite than suppress it, but they currently take a positive command-following result to settle whether there is anything it is like to be that patient.

  Plan the session for me rather than delivering it. I want the order in which the pieces must go in and what each depends on, including the point at which the broadcast-equals-consciousness conflation has to be broken before the distinction can even be stated; one carrying case, with an account of what it must contain and what it must lack, and why the usual candidates — an iconic-memory partial-report display, an unfelt pain, a population organized to realize a mind — do not do the work in this room; the misconceptions the students will arrive with or generate as the session proceeds, each tagged to the exact moment I should intercept it; a single closing question that separates those who have grasped the dissociation from those who have memorized terminology; and what I should decline to take up at this level, and announce that I am declining it.
reasoning: |-
  Hmm, the user is teaching a cognitive science seminar on Block's access vs phenomenal consciousness distinction and global workspace theory. They need help planning a 75-minute session to address specific student misunderstandings. 

  The core problem seems to be that students conflate global workspace broadcasting with consciousness itself, and also confuse command-following in patients with phenomenal consciousness. This is compounded by neuroethics students who want to map everything onto clinical detection paradigms. 

  First, I need to structure the session so the fundamental conflation (broadcast=consciousness) gets broken early. Can't even introduce Block's distinction properly until that's cleared. The "carrying case" example must be carefully chosen - something that clearly demonstrates broadcasting without phenomenality. Iconic memory displays won't work because students will just say "it's conscious but fleeting". Unfelt pains are too theoretical. Mind-realizing populations are too abstract.

  Maybe a blindsight variant? Like a GWT-style broadcast that still lacks qualia. Or perhaps a subliminal priming setup where information gets globally broadcast (affects multiple systems) without conscious awareness. That could work - it's empirical, fits GWT architecture, and shows dissociation.

  For the neuroethics diversion, I should redirect rather than suppress. Make command-following the example that proves the distinction rather than resolves it. "If we detect command-following via global workspace signatures, does that tell us about phenomenal consciousness?" should be the pivot.

  Key misconceptions to intercept:
  - At minute 15: "But broadcasting IS consciousness!" → intercept with subliminal priming evidence
  - At minute 40: "But command-following proves consciousness!" → reframe as access consciousness demonstration
  - At minute 60: "So phenomenal consciousness is just inaccessible?" → shut down hard to prevent epiphenomenalism drift

  Closing question must force application of the distinction. Something like: "Could we build a system with perfect GWT broadcasting but no phenomenal consciousness? What would convince you either way?" Requires understanding the gap.

  Should decline:
  - Hard problem discussions (save for philosophy courses)
  - Specific neural correlates (beyond GWT architecture)
  - Ethics of withdrawal decisions (tempting but derailing)

  Timing is tight. 75 minutes means strict segments:
  1) Shatter broadcast=consciousness (20 mins)
  2) Introduce Block's distinction via clinical cases (20 mins)
  3) Apply to command-following dilemma (20 mins)
  4) Consolidate with closing question (15 mins)

  The carrying case has to be airtight. Subliminal global priming: visual word masked below awareness, but still affects motor response, memory consolidation and emotional rating = classic global broadcast. Yet subject reports no conscious experience. Shows broadcasting ≠ phenomenality.
answer: |-
  Here’s a structured 75-minute session plan targeting your specific pedagogical challenges. The core strategy is to **force the dissociation between access and phenomenality before labeling it**, using clinical cases as a bridge for neuroethics-inclined students, while explicitly blocking conflation points.

  ---

  ### **Session Structure & Dependencies**
  **Total: 75 mins**  
  *(Key: ⚠️ = misconception interception point; 🚫 = declined topic)*

  1.  **Shatter "Broadcast = Consciousness" Conflation (20 mins)**  
      *   **Activity:** Start with *subliminal priming* (Dehaene/Lamme paradigms): Show data where masked stimuli (e.g., fearful faces) trigger amygdala activation, motor preparation, and behavioral priming—**without** conscious awareness.  
      *   **Question:** "Did this information influence the brain globally? If GWT defines consciousness as global broadcast, why wasn’t this conscious?"  
      *   **Dependency:** Must come FIRST. Students can’t grasp Block’s distinction until they see broadcasting ≠ phenomenality.  
      *   ⚠️ **Intercept at min 7:** When students say, "But it *was* conscious for a split second!" → Emphasize **objective reportability** (no voluntary report, no subjective acknowledgment) ≠ **mere neural propagation**.  
      *   **Carry Case:** **Subliminal Global Broadcast** (e.g., masked emotional priming).  
          *   *Must contain:* Neural/behavioral evidence of widespread processing (attentional capture, motor activation, memory traces).  
          *   *Must lack:* Any subjective report, metacognitive access, or integration into conscious narrative.  
          *   *Why other candidates fail here:*  
              *   *Iconic memory:* Students dismiss it as "fleeting consciousness" (they conflate phenomenality with temporal durability).  
              *   *Unfelt pain:* Too theoretical; no consensus on existence.  
              *   *Mind-realizing populations:* Distracts into philosophy of mind ("Is it conscious?"), not empirical dissociation.

  2.  **Introduce Block’s Distinction via Pathology (20 mins)**  
      *   **Activity:** Contrast two cases:  
          a. **Global Anesthesia (Access without Phenomenality?):** Patient "awake" under propofol (EEG shows GWT-like bursts), follows commands robotically, recalls nothing. Q: "Was there *experience*?"  
          b. **Visual Form Agnosia (Phenomenality without Access?):** Patient DF navigates obstacles (phenomenal vision) but can’t report/describe shapes.  
      *   **Question:** "What could Patient DF tell us about the obstacle *if we could ‘hack’ her workspace?* What could the anesthetized patient *not* tell us even if broadcast occurs?"  
      *   **Dependency:** Requires Step 1’s broadcast ≠ consciousness insight. Clinical cases ground abstraction for neuroethics students.  
      *   ⚠️ **Intercept at min 35:** "But if the anesthetized patient follows commands, they must be conscious!" → Reframe: **Command-following demonstrates *access* (information control), not necessarily *phenomenality***. GWT explains *how* commands are executed, not *that it feels like something*.

  3.  **GWT’s Target: What is it Accounting For? (20 mins)**  
      *   **Activity:** Diagram GWT architecture: input → competition → global broadcast → executive/memory response. Map onto cases:  
          - Subliminal prime: Input + partial broadcast, no ignition → **no access, no report**.  
          - Anesthesia: Broadcast ignition → **access (command execution), no phenomenality?**  
          - Agnosia: No broadcast to conceptual systems → **phenomenality without reportable access**.  
      *   **Question:** "If GWT only explains *information availability for control*, what does it *leave out*?" → **Phenomenality**.  
      *   **Dependency:** Steps 1–2 must establish that GWT mechanisms ≠ phenomenality.  
      *   ⚠️ **Intercept at min 50:** "But access *is* what matters for ethics!" → Acknowledge importance ("Yes, for assessing *agency*") but distinguish: "Does access tell us if there’s *an experience* to which we owe ethical duties?"

  4.  **Consolidation & Closing Challenge (15 mins)**  
      *   **Activity:** Return to neuroethics: Show an fMRI study detecting covert command-following in DOC patients.  
      *   **Closing Question:** **"If we confirm global workspace activation during command-following, does this prove the patient is phenomenally conscious? Why can’t this be another case of ‘anesthesia-like access without phenomenality’?"**  
          *   *Tests understanding:* Correct answer is "No" + distinction between access (GWT’s domain) and phenomenality (Block’s "hard problem" residue).  
          *   *Flags memorizers:* Those who regurgitate "GWT explains access" without the dissociation fail.  
      *   **🚫 Declined Topics (Announce explicitly):**  
          *   "We are *not* resolving whether phenomenality *requires* access (e.g., ‘overflow’ debates). Focus: GWT doesn’t *aim* to explain phenomenality."  
          *   "We are *not* settling ethical obligations today. We’re clarifying *what kind of evidence* gives us which information."

  ---

  ### **Why This Sequence Works**
  - **Order is non-negotiable:** Conflation must break *before* introducing Block’s terms. Starting with subliminal broadcasting creates cognitive dissonance ("broadcast isn’t conscious?!"), priming them for the distinction.  
  - **Neuroethics appetite spent productively:** Command-following becomes a *test case* for applying the distinction, not a solution. Students leave seeing it as an *access* indicator only.  
  - **Carrying case avoids student intuitions:** Subliminal broadcasting is empirically validated, lacks reportability *and* phenomenality, and mirrors GWT mechanisms.  
  - **Closing question forces synthesis:** Requires using the distinction to evaluate evidence, exposing superficial memorization.  

  **Prep Tip:** Pre-load the subliminal priming case (paper/video) so students engage data, not speculation. Use real clinical examples (e.g., propofol studies, DF case) to maintain rigor.
