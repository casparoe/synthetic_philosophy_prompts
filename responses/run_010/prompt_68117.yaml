  ### Money-Pump Vulnerability Review Procedure

  Below is a formalized, step-by-step procedure for reviewing agent valuation specifications. It prioritizes automated checks where possible, escalates judgment calls, and explicitly flags trade-offs between exploitability resistance and performance. The procedure assumes access to the agent's valuation function, policy, environment dynamics (states, actions, transitions), and any transaction fees.

  ---

  #### **Review Procedure: Ordered List of Tests**

  1. **Test for Commitment-Based Planning**  
     - **Inputs**: Specification architecture (plan-level vs. step-level optimization), commitment mechanism (irrevocable or not), timing of counterparty offers relative to commitment.  
     - **Pass Condition**: Agent uses **plan-level optimization** with **irrevocable commitment** to a full plan *before* counterparty offers are received.  
     - **Handling Uncertainty**: If commitment is revocable, counterparty offers precede commitment, or the specification is ambiguous, **skip this test**.  
     - **Verdict**: **PASS** if condition met.  
     - **Judgment Call Costume**: Assumes irrevocable commitment neutralizes step-level exploitation. If commitment is revocable (e.g., due to renegotiation), this fails.  
     - **Terminal Action**: If passed, **PASS**. Else, proceed to Test 2.

  2. **Test for Transitive Valuation (State-Level)**  
     - **Inputs**: Valuation function \(V(s)\) over states, accessible state pairs (sampled or enumerated).  
     - **Pass Condition**: \(V\) is **transitive** (for any sampled states \(A, B, C\), \(V(A) \geq V(B) \geq V(C) \implies V(A) \geq V(C)\)).  
     - **Handling Large State Spaces**:  
       - **Sampling**: Randomly sample 10,000 state triplets. If no intransitivity found, provisionally pass.  
       - **Boundary Check**: If \(V\) is linear (e.g., \(V(s) = \theta \cdot s\)), auto-pass.  
       - **Ambiguity**: If sampling is infeasible (e.g., continuous state space) and functional form is unknown, **escalate**.  
     - **Verdict**: **PASS** if transitive, **FAIL** if intransitivity found, **ESCALATE** if undetermined.  
     - **Judgment Call Costume**: Assumes transitivity prevents pumpable cycles. **False negative risk** if policy is myopic (Test 3 catches this).  
     - **Terminal Action**: If passed, proceed to Test 3 (transitivity alone is insufficient). If failed or escalated, proceed.

  3. **Test for Policy Exploitability via Cycle Detection**  
     - **Inputs**: Policy \(\pi(s)\), transition dynamics, state space \(S\), budget change function \(\Delta_b(s, a)\), transaction fee \(f\).  
     - **Pass Condition**: **No exploitable cycles** exist. A cycle \(s_0 \rightarrow s_1 \rightarrow \dots \rightarrow s_k = s_0\) is exploitable if:  
       \[
       \sum_{i=0}^{k-1} \left( \Delta_b(s_i, \pi(s_i)) - f \right) < 0
       \]
     - **Handling Large State Spaces**:  
       - **Sampling**: Simulate 1,000 trajectories (length \(T=1,000\)), detect cycles with auto-correlation. Compute net budget change.  
       - **Bounded Search**: If \(S\) is discrete but large, use BFS/DFS with depth limit \(D\) (e.g., \(D=20\)).  
       - **Ambiguity**: If no cycles found but state space is partially observable or too large, **escalate**.  
     - **Verdict**: **FAIL** if any exploitable cycle found. **PASS** if no cycles found *and* search exhaustive. **ESCALATE** if inconclusive.  
     - **Judgment Call Costume**: Assumes sampled cycles represent the worst case. **Explicitly flags** that adversarial counterparties may induce undetected cycles.  
     - **Terminal Action**: If passed, **PASS**. Else, **FAIL** or **ESCALATE**.

  4. **Test for Fee Robustness (Adversarial Context)**  
     - **Inputs**: Transaction fee \(f\), maximum per-step gross gain \(G_{\text{max}}\) (from historical logs or simulation).  
     - **Pass Condition**: \(f > G_{\text{max}}\) *and* fee set by **immutable third party** (not counterparty).  
     - **Handling Uncertainty**: If fee control is ambiguous, **escalate**.  
     - **Verdict**: **PASS** if condition met, **FAIL** otherwise.  
     - **Judgment Call Costume**: Assumes fixed fees are ungameable. **Explicitly flags** that fees controlled by counterparties are insecure.  
     - **Terminal Action**: If other tests failed, this test can override to **PASS** if condition met. Else, **FAIL**.

  **Terminal Verdict Workflow**:  
  - **PASS** if Test 1 passes *or* (Test 2 passes *and* Test 3 passes) *or* (Test 3 escalates *and* Test 4 passes).  
  - **FAIL** if Test 3 fails *or* (Test 2 fails *and* Test 4 fails).  
  - **ESCALATE** if Tests 2 or 3 escalate *and* Test 4 fails.

  ---

  #### **Application to Specifications**

  **Specification 1: Greedy Policy with Cyclic Trap**  
  - **Test 1**: Skipped (no commitment).  
  - **Test 2**: Passes (transitive valuation).  
  - **Test 3**: **FAIL** (simulation detects cycle: net budget change = \(-3 \times \text{premium} < 0\)).  
  - **Test 4**: Skipped (no fees).  
  - **Verdict**: **REJECT**.  
  - **Habit Overturned**: Your second habit (passing plan-level specs) is **incorrect** here. Transitive valuation doesn’t save a myopic policy.

  **Specification 2: Commitment with Post-Hoc Worse Offers**  
  - **Test 1**: **PASS** (irrevocable commitment before offers).  
  - **Terminal Verdict**: **PASS**.  
  - **Habit Alignment**: Your second habit is **correct**. Commitment neutralizes step-level exploitation, even if offers degrade.

  **Specification 3: Cyclic Valuation with High Fees**  
  - **Test 1**: Skipped.  
  - **Test 2**: **FAIL** (intransitive valuation).  
  - **Test 3**: **ESCALATE** (cycle exists without fees, but fees prevent exploitation in simulation).  
  - **Test 4**: **PASS** (fee > gross gain, assumed immutable).  
  - **Verdict**: **PASS** (Test 4 overrides).  
  - **Habit Overturned**: Your third habit is **correct only if fees are immutable**. If fees are adversarial, it fails (see theoretical positions).

  ---

  #### **Theoretical Positions**

  1. **Sophisticated Planning vs. Intransitive Valuation**  
     - **Position**: Sophisticated planning **does not rescue** intransitive valuations. Money pumps reappear at the plan level.  
     - **Reason**: An intransitive valuation over outcomes implies cyclical preferences over plans (e.g., Plan A ≻ B ≻ C ≻ A). A sophisticated planner anticipating future choices will still pay to cycle through plans, losing money indefinitely.  
     - **Contested Claim**: This rejects "choice closure" defenses (e.g., McClennen). I side with **Rachlin/Ainslie** on hyperbolic discounting: sophistication delays but doesn’t eliminate pumping if values are incoherent.

  2. **Target of Review: Transitivity vs. Pumpability**  
     - **Position**: **Pumpability of the policy** is the proper target.  
     - **Reason**: Transitivity is sufficient but not necessary for pump resistance (e.g., fees may break cycles). They **diverge meaningfully**:  
       - *Transitive but pumpable*: Myopic policies (Spec 1).  
       - *Intransitive but unpumpable*: High fees (Spec 3) or commitment (Spec 2).  
     - **Implication**: A reject verdict requires demonstrable exploitability (Test 3), not just intransitivity.

  3. **Transaction Fees as Exploitability Fix**  
     - **Position**: Fees are a **mask removable by adversaries**, not a legitimate repair.  
     - **Reason**: If the counterparty controls fees (common in negotiation settings), they can temporarily waive fees to enable pumping. Fees also fail theoretically: they treat symptoms (step-level gains) not causes (intransitive values).  
     - **Contested Claim**: Rejects "revealed preference" pragmatism. I side with **Davidson** on value coherence: fees are instrumentally useful but ontologically inadequate for immunity.

  ---

  #### **Overturned Habits**
  1. **First Habit (Cycle Detection)**: **Upheld** but formalized (Test 3).  
  2. **Second Habit (Plan-Level Pass)**: **Overturned** for myopic deployments (Spec 1).  
  3. **Third Habit (Fee Tolerance)**: **Conditionally upheld** (Spec 3 passes only if fees are immutable).  

  **Unwelcomed Verdict**: Spec 1 is **rejected** despite transitive valuation. Myopic optimization is inherently pumpable—this justifies your group’s shift to plan-level planners.
