  ### Diagnostic Instrument: Artifacts and Politics  
  *For the second session of the graduate seminar in philosophy of technology*

  **Instructions:**  
  Answer each question based on the case description. Choose the option that best reflects your view. The decision tree sorts you into a position on whether artifacts have politics, based on three axes:  
  - **(i) Causal**: Does the artifact’s technical configuration make a social difference beyond human decisions?  
  - **(ii) Political (strict)**: Can the artifact embody/enact power (beyond being "used politically")?  
  - **(iii) Developmental**: Is technical change internally constrained (path dependence)?  
  If you answer "yes" to (i) or (ii), a fourth axis, **Locus**, applies: where does politics sit (intention, requirements, interpretation, actant-network, regime)?  

  ---

  ### Branch Nodes (Cases and Questions)  
  *Answer all nine questions.*  

  1. **Case 5 (Door closer/road hump)**:  
     A mechanical door closer replaces a junior colleague who shut doors; a road hump replaces a traffic warden. What do these replacements show?  
     - **A**: Artifacts enforce rules *themselves* (e.g., the door closer "demands" closure).  
     - **B**: Artifacts are *tools* for humans to enforce rules (e.g., the hump aids police).  

  2. **Case 1 (Parkway)**:  
     Parkway overpasses are too low for buses (beach access requires a car); the designer intended this. Could exclusion occur without the low overpasses?  
     - **A**: No—physical barriers are *necessary* for this exclusion.  
     - **B**: Yes—exclusion could be achieved by social rules (e.g., "no buses" signs).  

  3. **Case 2 (Tomato harvester)**:  
     A mechanical harvester required breeding durable tomatoes and favored large farms, displacing smallholders. Did the harvester lock agriculture into capital-intensive farming?  
     - **A**: Yes—once developed, the shift was *inevitable*.  
     - **B**: No—social choices (e.g., subsidies) could have prevented it.  

  4. **Case 3 (Stirrup)**:  
     Stirrups enabled mounted shock combat, allegedly leading to a warrior class. Historians note many optional steps. Is the linkage inevitable?  
     - **A**: Yes—stirrups *necessitated* this sociopolitical chain.  
     - **B**: No—social factors (e.g., feudalism) were decisive.  

  5. **Case 6 (Ranking algorithm)**:  
     A revenue-optimized algorithm amplifies outrage unintentionally. Can this be fixed without changing the revenue model?  
     - **A**: No—the model *locks in* outrage amplification.  
     - **B**: Yes—redesign (e.g., tweaking engagement metrics) can mitigate it.  
     - **C**: It’s not caused by the algorithm—users drive outrage.  

  6. **Case 7 (Voting machines)**:  
     Officials, vendors, and advocates describe the same e-voting machine incompatibly; one view eventually wins. What resolves the dispute?  
     - **A**: The artifact’s *inherent properties* (e.g., security features).  
     - **B**: *Social negotiation* among groups (e.g., regulators vs. vendors).  
     - **C**: *Network stabilization* (e.g., alliances between actants).  

  7. **Case 8 (Centralized vs. distributed energy)**:  
     Centralized tech requires hierarchical management; distributed tech does not. Where is the politics located?  
     - **A**: Designers’ *intentions* (e.g., choosing centralization).  
     - **B**: *Requirements* for safe operation (e.g., top-down control).  
     - **C**: The *socio-technical regime* (e.g., industry norms).  

  8. **Case 4 (Hiring algorithm)**:  
     An algorithm reproduces training-data disparities (unintended; not in specs). What is the primary source?  
     - **A**: The algorithm’s *design/operation* (e.g., data-processing rules).  
     - **B**: *Training data* reflecting society (e.g., biased historical patterns).  
     - **C**: The *network* of users, data, and algorithms.  
     - **D**: *Interpretations* by users (e.g., HR officers applying outputs).  

  9. **Case 10 (QWERTY keyboard)**:  
     QWERTY was designed to prevent typewriter jams; it persists despite inefficiency. Are we locked in?  
     - **A**: Yes—network effects (e.g., retraining costs) make change *impossible*.  
     - **B**: No—social choices (e.g., adopting Dvorak) could replace it.  

  ---

  ### Leaves (Positions)  
