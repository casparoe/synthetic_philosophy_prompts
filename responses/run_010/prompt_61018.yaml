  We are building a decision tree for a graduate seminar in philosophy of technology.
   The goal is to sort students into positions on whether artifacts have politics, based on their answers to concrete cases.

   The position is defined by three main axes (with an additional locus axis if applicable):
     (i) Causal: 
          - Option A: The technical configuration makes a difference to social outcomes that could not have been made by human decisions alone.
          - Option B: The artifact only transmits differences already present in the human decisions.

     (ii) Political in the strict sense:
          - Option A: Artifacts can embody or enact power, authority, or a form of life (stronger than just being used politically).
          - Option B: Artifacts do not embody politics in a strong sense; they are just tools used by people.

     (iii) Developmental:
          - Option A: Technical change is internally constrained (trajectory, lock-in, path dependence) so that social choice only selects among existing variants.
          - Option B: Technical change is not internally constrained in that way; social choices can shape the technology more freely.

   Additionally, if the student answers that there is politics in the artifact (i.e., at least one of (i) or (ii) is affirmative), then we ask about locus:
     - Locus: Where does the politics sit?
          Option 1: Designer's intention.
          Option 2: Operational requirements of the design.
          Option 3: Interpretive work of the relevant social groups.
          Option 4: Network of human and non-human actants (Actor-Network Theory).
          Option 5: Wider socio-technical regime.

   However, note that the locus axis is only applicable if the student has answered affirmatively to either (i) or (ii) (or both). Otherwise, locus is not applicable.

   We have nine cases (we can split one into two or add a tenth). We must design branch nodes (questions) for each case, with two or three answer options. The questions must be answerable without prior knowledge of the literature.

   The leaves (positions) are to be named if a name exists, or marked unnamed. We need 10-14 positions. For each leaf, we must provide one sentence about case 4 (the hiring algorithm) to make them comparable.

   We also need to mark at least three gaps (unoccupied combinations) and say why they are empty (incoherent, coherent but unattractive, unexplored).

   Flag at least two pairs of leaves that the instrument cannot separate and say why.

   Finally, a scoring key mapping answer patterns to leaves, and identify the single question that does the most sorting work.

   Let's design the decision tree step by step.

   Step 1: Define the axes and their possible answers.

     Axis (i): Causal
        A: Yes, the artifact makes a causal difference.
        B: No, it only transmits.

     Axis (ii): Political in the strict sense
        A: Yes, artifacts can embody politics.
        B: No, they cannot.

     Axis (iii): Developmental
        A: Yes, there are internal constraints (determinism).
        B: No, there are not.

     Axis (iv): Locus (if applicable, i.e., if (i)=A or (ii)=A)
        1: Designer's intention
        2: Operational requirements
        3: Interpretive work of social groups
        4: Network of actants (ANT)
        5: Socio-technical regime

   Step 2: We note that the locus axis is conditional. Therefore, the total number of possible combinations is:

     For the first three axes: 2 * 2 * 2 = 8 combinations.

     But for the combinations where at least one of (i) or (ii) is A (i.e., not both B), we have an additional 5-way split for locus.

     So the total number of positions is:
        - When (i)=B and (ii)=B: 1 combination (with no locus) -> 1 leaf
        - Otherwise: 7 combinations (because 8 - 1 = 7) and each has 5 locus options -> 35 leaves

     That would be 1 + 35 = 36 leaves, which is too many. We must remember that not every combination of the first three axes is independent of the locus. Also, in practice, many combinations are not held by any position.

     We are to produce 10-14 leaves (positions). Therefore, we must design the questions (branch nodes) so that they route to a manageable number of positions, and we will only include the ones that are named (or note unnamed if we must include a gap).

     Alternatively, we can structure the tree so that we first ask the three main questions (via cases) and then, if needed, ask about locus via a case.

