  - They tally the total mismatches.

  80-90 min: Report and Winner
  - Groups report the mismatch count for the group they audited.
  - TA writes on board: Group A audited by Group B: mismatches = X
  - The group with the lowest mismatches wins a small prize (coffee card).

  90-100 min: Debrief

  Debrief Sequence of Questions:
  1. "What did you notice during the audit? Did the rule always match the answers?" (Get responses)
  2. "For the rule-first groups: when you were applying your rule to the cases, did you find cases where the answer you put didn't match what you thought the rule would say? What happened?"
  3. "For the cases-first groups: when you tried to write a rule to fit your answers, was it easy? Did the rule cover all cases without exception?"
  4. "Did any group have a rule that perfectly matched their answers? What was that rule?"
  5. "Did anyone feel discomfort at some of the cases? Where did you feel the most uncertainty?"
  6. "Let's look at continuum 1 (magnets). At stage 7, how many objects? Why isn't there a clear answer?" -> Lead into: because there's no agreed-upon criterion for when composition occurs.
  7. "This is known in metaphysics as the special composition question: when do some things compose a whole?"
  8. "What are the extreme positions? What if we say composition never occurs? (nihilism) Then how many objects at stage 10? (melted block) -> 1? But then what about the atoms? This leads to mereological nihilism. What if we say composition always occurs? (universalism) Then even at stage 1 (magnets 20 cm apart) we have one object? The 'scattered object'. This seems counterintuitive."
  9. "What about only when there's a bond? But then we have vagueness: what counts as a bond? Magnetic attraction? Glue? Welding? And if we say 'strong bond', then we have a sorites series: adding a little strength at a time."
  10. "The epistemicist says there is a sharp cutoff, but we can't know it. How did that feel when you were forced to pick a number? Did it feel arbitrary?"
  11. "And what about conventionalism? Did anyone say 'it's just convention'? But then in the audit, you had to apply the rule and found mismatches. Why is convention not enough to avoid inconsistency?"

  Finally, the TA says the two or three things that the activity can't make them feel, so we have to say:
  - "The deep discomfort of vagueness: that there might be no fact of the matter, and yet we have to decide."
  - "The intuition that composition must occur sometimes (like for living things) but not always (like for a random pile of sand), and how hard it is to draw the line."
  - "The feeling that our ordinary concept of 'object' is not up to the task of handling these boundary cases."

  Failure Modes and Handling:

  1. Students gaming the audit: e.g., a group answers "1" for every case to make it consistent with a rule "there is always one object". 
     - Handling: That's a valid position (universalism). In the audit, if the rule is "always one object", then for every case the rule-implied answer is 1. If they answered 1, then no mismatches. They win. But in the debrief, we point out that this is one of the extreme positions and discuss why it might be counterintuitive.

  2. Similarly, a group answers with the number of atoms (nihilism) or always the number of smallest parts. 
     - Handling: Again, valid. They might have a low mismatch count. But in the debrief, we discuss the implications.

  3. Someone insists the word "thing" is doing all the work and refuses to engage. 
     - Handling: Circulate and engage: "For the purpose of this activity, we are counting distinct material objects. Give it your best shot." If they still refuse, let them write the integers arbitrarily, but then in the audit, their group will have mismatches and they lose. The social pressure of the group might force them.

  4. Two sealed conditions finishing at wildly different times: 
     - The rule-first groups might take longer to write the rule. The cases-first groups might take longer on the cases. 
     - Handling: Keep time strictly. After 40 minutes, stop everyone. Cases-first groups must stop answering and start writing the rule (10 minutes). Rule-first groups should have written the rule in 10 minutes and then 30 minutes for cases. If a group finishes early, they can double-check.

  5. A student won't write an integer at all. 
     - Handling: The TA says: "You must write an integer for each. If you're unsure, write what seems most plausible. There are no right answers, but we need your integer to proceed." If they still refuse, assign them a number arbitrarily (like 1) and note it. The group will likely pressure them.

  6. In the audit, a group cannot agree on what the rule implies for a case. 
     - Handling: They must come to a consensus. If not, they can ask the TA. The TA says: "Pick one interpretation and proceed. Note it in the audit sheet."

  7. The groups might audit unfairly (e.g., deliberately interpret the rule to create mismatches). 
     - Handling: The TA circulates during audit and reminds them to be charitable and use the rule as written. Also, in the report, if a group has very high mismatches, we can discuss why in the debrief.

  The activity should proceed with these guidelines.

  Now, we output the activity plan as requested.
