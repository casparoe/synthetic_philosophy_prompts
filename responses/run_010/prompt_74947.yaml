  ### Activity Plan

  #### Props and Continua List
  **Budget:** $30 for hardware store items.  
  **Three Continua (10 items each, total 30 photographs):**  

  1. **Magnets Continuum (Expected Answers: Fracture at Stages 4–9)**  
     - *Props:* Two neodymium magnets, adhesive putty, tape, epoxy, welding tools (simulated in photos).  
     - *Stages (Integer Answers Expected):*  
       1. Magnets 20 cm apart → **2**  
       2. Magnets 10 cm apart → **2**  
       3. Magnets 5 cm apart → **2**  
       4. Magnets 1 cm apart → **2** (Fracture: Some may say 1 due to attraction)  
       5. Magnets touching (edge-to-edge) → **2**  
       6. Magnets touching (face-to-face, separable by hand) → **2** (Fracture: Some say 1 if "bonded")  
       7. Magnets held by magnetic force (requires tool to separate) → **2** (Major fracture: 1 vs. 2)  
       8. Magnets with spot weld → **2** (Fracture: Some say 1 for "joined")  
       9. Magnets fully welded (shapes visible) → **1** (Fracture: Some say 2 for "distinct parts")  
       10. Magnets melted into one lump → **1**  

  2. **Lego Tower Continuum (Expected Answers: Fracture at Stages 5–9)**  
     - *Props:* 10 Lego blocks, glue, paint, heat gun (simulated melting in photos).  
     - *Stages (Integer Answers Expected):*  
       1. Blocks scattered → **10**  
       2. Blocks gathered (not touching) → **10**  
       3. Blocks in a pile → **10**  
       4. Blocks stacked (no attachment) → **10**  
       5. Blocks snapped together → **10** (Fracture: Some say 1 for "assembly")  
       6. Tower with glue on one joint → **10** (Major fracture: 1 vs. 10)  
       7. Tower with glue on half the joints → **10** (Fracture: 1 if "partially bonded")  
       8. Tower with all joints glued → **1** (Fracture: Some say 10 for "distinct blocks")  
       9. Tower painted (joints obscured) → **1** (Fracture: Some revert to 10)  
       10. Tower melted into solid block → **1**  

  3. **Paper Sheets Continuum (Expected Answers: Fracture at Stages 4–9)**  
     - *Props:* Two sheets of paper, paperclip, staple, tape, glue, sandpaper, pulp simulation.  
     - *Stages (Integer Answers Expected):*  
       1. Sheets 20 cm apart → **2**  
       2. Sheets touching (corner) → **2**  
       3. Sheets overlapping 1 cm → **2**  
       4. Sheets held by paperclip → **3** (Fracture: Some say 1 for "fastened unit")  
       5. Sheets stapled → **3** (Major fracture: 1 vs. 3)  
       6. Sheets taped together → **3** (Fracture: 1 if "bonded")  
       7. Sheets glued (glue visible) → **3** (Fracture: 1 if "composite")  
       8. Sheets pressed/glued (smooth surface) → **1** (Fracture: Some say 3 for "materials")  
       9. Sheets sanded (glue seamless) → **1** (Fracture: Some say 2)  
       10. Sheets pulped/reformed into one → **1**  

  **Fracture Notes:**  
  - Magnets: Fracture intensifies at magnetic bonding (Stage 7) and welding (Stage 8–9).  
  - Lego: Fracture peaks at attachment (Stage 5) and glue (Stage 6–8).  
  - Paper: Fracture at fasteners (Stage 4–6) and seamless bonding (Stage 8–9).  
  - Expected Class Fracture Points:  
    - Universality: Stages with bonding (e.g., Lego Stage 5, Magnets Stage 7) split 1 vs. many.  
    - Vagueness: Transitional stages (e.g., Paper Stage 8) cause inconsistent answers within groups.  

  #### Scoring and Audit Rules  
  **Materials per Group:**  
  - Answer sheets (30 photos), pens, envelopes (for rule-first groups), audit sheets (blank grids for mismatches).  

  **Group Conditions:**  
  - **Rule-First (2 groups):**  
    1. Discuss and agree on a general rule (e.g., "Composition requires permanent bonding").  
    2. Write rule, seal in envelope.  
    3. Answer 30 cases with integers.  
  - **Cases-First (2 groups):**  
    1. Answer 30 cases with integers (no rule discussion).  
    2. After, discuss and write a rule explaining answers.  

  **Audit Process:**  
  1. **Pairing:** Groups swap materials with another group (e.g., Group A ↔ Group B).  
     - Rule-first groups: Swap answer sheet + sealed envelope.  
     - Cases-first groups: Swap answer sheet + written rule.  
  2. **Audit Execution:**  
     - Open envelope/rule. For each case (1–30):  
       a. **Derive Rule-Implied Answer:** Auditors discuss and agree on one integer the rule *should* produce for that photo.  
         - *Example:* Rule = "Bonded objects compose one thing." For Lego Stage 5 (snapped), implied answer = 1.  
       b. **Compare to Actual Answer:** If rule-implied ≠ actual answer → mismatch.  
     - Mark mismatches on audit sheet (tally per case).  
  3. **Scoring:**  
     - Total mismatches = number of inconsistent cases (max 30).  
     - Fewest mismatches wins (prize: $5 coffee card).  
  4. **Auditor Guidelines (for TAs):**  
     - Rule interpretation must be literal (e.g., "permanent bonding" excludes magnetic force if not stated).  
     - Consensus required for rule-implied answers; no abstentions.  
     - Disputes resolved by TA: "Use the rule’s wording, not your own view."  

  #### Timeline (100 Minutes)  
  - **0–5 min: Setup**  
    - Assign groups/tables (4/4/3/3), distribute answer sheets.  
    - Explain: "Today, you’ll count objects in photos. Write one integer per case—no explanations. Half of you will write a rule first, half after."  
  - **5–10 min: Condition Brief**  
    - Rule-first groups: "Agree on a rule, write and seal it. Then answer cases."  
    - Cases-first groups: "Answer all 30 cases first. Then, write a rule explaining your answers."  
    - Emphasize: "No changing answers after rule is written/sealed."  
  - **10–50 min: Group Work**  
    - Rule-first: 10 min rule discussion + sealing; 30 min cases.  
    - Cases-first: 35 min cases; 5 min rule writing.  
    - TA circulates, enforces silence during case answers for cases-first groups.  
  - **50–55 min: Swap**  
    - Pair groups (e.g., Table 1 ↔ Table 2, Table 3 ↔ Table 4).  
    - Swap answer sheets + rules/envelopes.  
  - **55–80 min: Audit**  
    - Groups audit swapped materials (25 min).  
    - TA provides audit sheets, monitors for literal rule application.  
  - **80–85 min: Tally**  
    - Groups report mismatch counts to TA.  
  - **85–90 min: Winner Announcement**  
    - TA announces group with fewest mismatches, awards prize.  
  - **90–100 min: Debrief**  

  #### Debrief Sequence  
  1. **Open Reflection (Whole Class):**  
     - "What surprised you during the audit? Did rules fit answers perfectly?"  
  2. **Rule-First Groups:**  
     - "When you applied your rule to cases, did you have to force an answer? Where did it feel arbitrary?"  
  3. **Cases-First Groups:**  
     - "When writing your rule, were there cases you ignored to make it work? Which ones?"  
  4. **Fracture Point Analysis (TA-Led):**  
     - Show Lego Stage 5: "Why did some say 1 and others 10? Is there a fact about ‘objecthood’ here?"  
     - Show Magnets Stage 7: "If magnetism isn’t ‘bonding,’ what is? Does strength matter?"  
  5. **Introduce Extreme Positions:**  
     - "Some philosophers say composition *always* occurs (universalism): e.g., scattered objects. Did anyone’s rule imply this? How did it feel for Stage 1 magnets?"  
     - "Others say it *never* occurs (nihilism): only atoms exist. How would that change your Stage 10 answers?"  
  6. **Epistemicist Tension:**  
     - "Suppose there’s a sharp cutoff (e.g., ‘glue always composes’). In Lego Stage 6, why did some of you hesitate? If the cutoff exists but we can’t know it, does that resolve the discomfort?"  
  7. **Vagueness Connection:**  
     - "Two weeks ago, you saw sorites with heaps. Here, adding a drop of glue (Lego Stage 6) or a weld (Magnets Stage 8) is like adding a grain. Why does ‘it’s just convention’ fail when you had to audit mismatches?"  
  8. **Reveal Topic:**  
     - "This is the special composition question: when do parts compose a whole? The activity forces what convention avoids—committing to answers and facing inconsistency."  
  9. **TA Statements (Unavoidable Insights):**  
     - "The agony of drawing a line: You *felt* the pressure to choose in fractures, even if no fact exists."  
     - "Ordinary ‘thing’ relies on context: A ‘Lego tower’ is one object to a child but 10 blocks to a nihilist. The activity strips context, exposing vagueness."  
     - "Epistemicism is unsatisfying here because it demands a cutoff but offers no way to find it—making your audit feel unfair."  

  #### Failure Modes and Handling  
  1. **Students Gaming the Audit (e.g., answering "1" for all 30):**  
     - *Handling:* Allow it. In debrief, highlight: "Universalism minimizes mismatches but implies a scattered pile is one object. Does that match intuition?" Prize still awarded if they win.  
  2. **"It’s Just Convention" Dodge:**  
     - *Handling:* During group work: "Forced integers override convention. If you don’t commit, your group can’t audit." In debrief: "Convention failed your rule—mismatches forced accountability."  
  3. **Refusal to Write Integers:**  
     - *Handling:* Privately: "You must pick an integer so your group can proceed. Think of it as a vote." If resistant, assign a random integer (note for debrief). Later: "Abstention shifts burden to peers—did that feel ethical?"  
  4. **Groups Finishing at Wildly Different Times:**  
     - *Handling:* Keep strict timers. If rule-first lags: "Seal your rule now; cases are priority." If cases-first stalls: "Move to rule writing with your best answers."  
  5. **Audit Bias (e.g., misinterpreting rules to "win"):**  
     - *Handling:* TA circulates, warns: "Apply the rule as written, not your version." If cheating suspected, audit them publicly in debrief ("Group B, explain your implied answer for Photo 15").  
  6. **Nihilist/Smug Student:**  
     - *Handling:* In audit, nihilist answers (e.g., 30 for all) will clash with rules. Use debrief: "Nihilism avoids vagueness but turns a Lego tower into 10 objects. Does that dissolve everyday objects?"  
  7. **Projector Failure at Debrief:**  
     - *Handling:* Use printed photo copies for fracture points. Skip slides; refer to answer sheets.
