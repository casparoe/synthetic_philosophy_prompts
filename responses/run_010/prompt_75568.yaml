  - One group might dominate the discussion. Encourage everyone to participate.

  - Time might run short. Be prepared to cut discussion short.

  - The non-return scenario (Round 3) might be seen as an active killing because the rope causes the drowning. That's the point: it shows that withdrawal can sometimes be equivalent to doing harm. But we must be careful to explain that in the other scenarios, the withdrawal is allowing harm, but in Round 3 it might be seen as doing harm.

  In summary, this activity should help students feel the intuition shifts based on the factors, and then we can connect it to the theory.
