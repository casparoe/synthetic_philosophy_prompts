  Below is a complete, ready-to-run classroom activity package designed to meet your goals. It uses non-clinical scenarios to avoid triggering personal experiences, focuses on your three hypothesized factors (lethal sequence pre-existing, provision source, and return to prior state), and structures the reveal to let students "discover" the pattern in their own judgments. The activity is paper-based, fits your 90-minute window, and includes safeguards for predictable challenges.

  ---

  ### **Activity: "The Lifeguard's Choice"**  
  *Goal:* Students experience how their moral judgments shift based on contextual factors in withdrawal cases, revealing that the doing/allowing distinction may be driven by (a) pre-existing lethal sequence, (b) source of provision, and (c) return to prior state—not just act vs. omission.  

  **Materials Per Group (6 groups of 4):**  
  - 3 scenario cards (one for each round)  
  - 1 voting ballot (index card with numbered blanks for rounds 1–3)  
  - 1 pen  
  - **TA Materials:** Whiteboard, markers, tally sheets, 6 small prizes (e.g., premium chocolates or "ethics exemption tokens" for one homework extension).  

  **Room Setup:**  
  - Desks are bolted, so groups form naturally by proximity (no rearranging needed).  
  - TA walks to groups to distribute/collect materials.  

  **Payoff:**  
  - Groups vote anonymously each round. After the final tally, the **two groups closest to the class average blame score** win prizes. This incentivizes authentic responses (students won't copy neighbors to "win") and makes them care about consistency.  

  ---

  ### **Scenarios (Word-for-Word on Cards)**  
  *Key:* All scenarios use the same outcome (victim dies), cost (agent misses meeting), and intent (agent prioritizes self-interest). Factors are isolated per round.  

  **ROUND 1: Baseline (All Factors Present)**  
  > *"River Rescue: Jamie is hiking and sees Sam drowning in a river. The current is pulling Sam toward a waterfall. Jamie throws Sam a life ring attached to a rope—Jamie’s own gear. Jamie pulls Sam toward shore but stops after 60 seconds to avoid missing a meeting. Jamie lets go of the rope. Sam drifts back into the current and dies.*  
  > *On a scale of 1–5, how blameworthy is Jamie? (1 = Not at all, 5 = Extremely)"*  
  > **Factors:**  
  > - (a) Lethal sequence (drowning/current) already underway  
  > - (b) Provision (life ring) is Jamie’s own  
  > - (c) Letting go returns to pre-Jamie state (Sam adrift)  

  **ROUND 2: Vary Provision Source (b)**  
  > *"Dam Duty: Jamie is hiking and sees Sam trapped in a river. The current is pulling Sam toward a waterfall. A bridge above Sam has a safety net (installed by park rangers) that’s come loose. Jamie grabs the net’s rope to hold it in place. After 60 seconds, Jamie stops to avoid missing a meeting. Jamie releases the net. Sam drifts into the current and dies.*  
  > *On a scale of 1–5, how blameworthy is Jamie?"*  
  > **Factors:**  
  > - (a) & (c) Same as Round 1  
  > - (b) Provision (net) is *someone else’s*; Jamie only maintains it  

  **ROUND 3: Vary Return to Prior State (c)**  
  > *"Rock Trap: Jamie is hiking and sees Sam stranded on a rock in a rising river. The water is rising, but Sam is safe for now. Jamie throws Sam a life ring attached to a rope—Jamie’s own gear. Jamie pulls Sam toward shore but stops after 60 seconds to avoid missing a meeting. Jamie lets go of the rope. The rope tangles around Sam, pulling them underwater where they die.*  
  > *On a scale of 1–5, how blameworthy is Jamie?"*  
  > **Factors:**  
  > - (a) & (b) Same as Round 1  
  > - (c) Letting go *does NOT return to prior state* (Sam was safe on the rock; now entangled)  

  ---

  ### **Timeline (90 Minutes Total)**  
  **0–10 min: Setup & Rules**  
  - Assign groups by counting off 1–6 (students shout numbers; form groups).  
  - Hand out materials (1 ballot + pen per group; scenario cards stay with TA).  
  - Explain rules:  
    - "You’ll see 3 short scenarios. For each, discuss and agree on a blame score (1–5) for the agent. Write it on your ballot.  
    - No ‘right’ answers—we’re studying patterns in judgment.  
    - Groups closest to the class average win prizes. Be honest—copying neighbors will backfire!"  

  **10–40 min: Rounds (10 min each)**  
  - For each round:  
    1. **TA reads scenario aloud** (ensures consistency).  
    2. **Groups discuss/vote (5 min):** Stress consensus. Walk around to nudge quiet groups.  
    3. **Collect ballots (1 min):** TA shouts "Pens down!" and collects.  
    4. **Distribute next card (1 min).**  
  - *Pro Tip:* Shuffle scenario order between groups to avoid order effects (e.g., Group 1 gets Rounds 1-2-3; Group 2 gets 2-3-1, etc.).  

  **40–50 min: Tally & Whiteboard Setup**  
  - TA tallies scores on a hidden sheet.  
  - On whiteboard, draw:  
    | Group | Round 1 | Round 2 | Round 3 |  
    |-------|---------|---------|---------|  
    | 1     |         |         |         |  
    | ...   |         |         |         |  
    | **Avg** |        |         |         |  

  **50–60 min: The Reveal**  
  - Fill in whiteboard with group scores and averages.  
  - Announce prize winners (groups closest to average).  
  - **DO NOT** name the distinction yet. Ask:  
    > *"Look at the scores. Where did blame shift? What made Jamie seem worse in some rounds?"*  

  **60–80 min: Debrief (Core Learning)**  
  1. **Pattern Recognition (5 min):**  
     - Point to trends: "Round 3 has the highest blame? Round 2 the lowest? Why?"  
     - Students often notice: "Jamie caused entanglement" (Round 3) or "The net wasn’t theirs" (Round 2).  

  2. **Introduce Factors (10 min):**  
     - Reveal your hypothesis: "What if it’s not ‘doing vs. allowing,’ but three things?"  
     - Map factors to rounds:  
       - **Round 1:** Lethal sequence pre-existing? ✅ | Provision theirs? ✅ | Return to prior? ✅  
       - **Round 2:** Lethal pre-existing? ✅ | Provision theirs? ❌ | Return to prior? ✅  
       - **Round 3:** Lethal pre-existing? ✅ | Provision theirs? ✅ | Return to prior? ❌  
     - "In Round 2, blame dropped because Jamie didn’t ‘own’ the net. In Round 3, blame spiked because Jamie left Sam worse off."  

  3. **Connect to Medical Ethics (5 min):**  
     - "In clinical settings, this plays out in withdrawal cases. Turning off a ventilator you installed feels different from not starting one, or discontinuing a inherited treatment. Why? Because of these factors—not just ‘action’ vs. ‘inaction.’"  
     - **Critical nuance:** Acknowledge that real-world stakes involve grief/guilt, but the *cognitive pattern* is the same.  

  **80–85 min: Handle Contradictions**  
  - If scores contradict your hypothesis (e.g., Round 2 > Round 1):  
    > "Interesting! This group scored Round 2 higher. What made maintaining the net feel worse?"  
    - Likely reasons: Students might see "holding then releasing" as an action. Affirm this and discuss:  
    > "This shows how messy these judgments are. Maybe the ‘source’ factor matters less than we thought?"  

  **85–90 min: Slack/Q&A**  
  - Open floor: "How might this apply to DNR orders or withdrawing nutrition?"  
  - Distribute prizes.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Groupthink:**  
     - **Risk:** Strong personalities dominate; quiet students disengage.  
     - **Fix:** TA circulates, asks specific quiet students: "[Name], what’s your initial score?"  

  2. **Time Crunch:**  
     - **Risk:** Discussion runs long.  
     - **Fix:** Use a timer. Cut voting at 5 min. If behind, skip prize announcement (just reveal averages).  

  3. **Ambiguous Scenarios:**  
     - **Risk:** Students misread "entanglement" in Round 3.  
     - **Fix:** During read-aloud, emphasize: "Sam was *safe on the rock* until the rope tangled."  

  4. **No Clear Pattern:**  
     - **Risk:** Averages don’t show shifts (e.g., all rounds ≈3.5).  
     - **Fix:** In debrief, zoom in on group variation: "Group 4 gave Round 3 a 5—why?"  

  5. **Emotional Reactions:**  
     - **Risk:** A student connects scenarios to personal trauma.  
     - **Fix:** Pre-activity disclaimer: "These are fictional, non-medical scenarios. If you need to step out, no questions asked." Avoid clinical terms until debrief.  

  ---

  ### **What the Game Can’t Capture (Must Be Taught)**  
  - **The Stakes:** The activity uses abstract, low-stakes scenarios. In real clinical settings, the emotional weight of withdrawing care (e.g., "I caused this death") amplifies guilt. **Address in debrief:**  
    > "In this game, Jamie misses a meeting. But in a hospital, ‘cost’ might be moral distress. Withdrawing care *feels* like killing because these factors trigger a psychological ‘doing’ response—even if logic says otherwise."  

  - **Professional Duty:** Nurses have obligations that civilians don’t. **Emphasize:**  
    > "Jamie is a hiker, not a nurse. But if Jamie were a lifeguard? Their duty changes the moral math. We’re isolating cognitive biases today; next session, we add professional context."  

  ---

  ### **Why This Works**  
  - **Pressure & Engagement:** Prizes + group consensus force authentic choices. Students *feel* their judgments shift.  
  - **Hypothesis Testing:** By Round 3, groups see their own scores change (e.g., "We gave Round 1 a 3 but Round 3 a 5—why?").  
  - **Safe Reveal:** Jargon-free scenarios prevent ambush; factors are named only after patterns emerge.  
  - **Flexible:** Works whether scores support or contradict your hypothesis—the debrief handles both.  

  Run this tight, fast-paced session, and your students will leave with a visceral grasp of how context shapes moral intuition. Good luck!
