answer: |-
  ### Preparatory Note
  My core claims:  
  1. Transferable leave entrenches gendered care inequality by failing to counter intra-household coercion.  
  2. State "neutrality" towards unequal bargaining power perpetuates historical injustice (e.g., workplace norms privileging male earners).  
  3. Forfeiture is not destruction but *recognition* that care rights must be individually exercisable.  
  4. Children’s developmental interest in dual caregiving justifies modest non-neutrality.  

  Key against neutrality objections:  
  - Highlighting that pre-quota "entitlements" were *already* non-neutral (structurally favouring male earners).  
  - Arguing forfeiture prevents rights being vetoed by partners – aligning with liberal autonomy.  

  Exposed point: Disproportionate impact on vulnerable households. Soften by conceding the need for complementary policies (e.g., childcare subsidies) while maintaining quotas as necessary catalysts.  

  Need to know: Whether you view gendered care asymmetry as *unjust* or merely a preference deserving equal subsidy.  

  ---

  ### In-Character Reply  
  You’re right that forfeiture imposes a cost on households preferring specialisation. But let’s dissect your coercion charge. First, the entitlement isn’t "destroyed" – it was never genuinely the *household’s* to lose. Under transferable systems, the secondary earner (usually the mother) holds a nominal right she cannot realistically exercise if her partner refuses leave. The quota individualises that right, making it enforceable. If a father *chooses* not to use his weeks, he forfeits *his* entitlement – just as one forfeits unemployment benefits by refusing work. Neutrality doesn’t require subsidising choices that undermine others’ rights.  

  On disproportionate impact: I concede this readily. Breastfeeding parents or self-employed workers face genuine constraints. But note: these groups are already penalised under *any* parental-leave system. The solution isn’t abandoning quotas but supplementing them – as Norway did with flexible weeks for self-employed parents. Quotas alone aren’t sufficient, but they’re necessary to disrupt the feedback loop where mothers become default carers because employers expect it.  

  Your perfectionism charge intrigues me. If the state refused to fund religious schools because it promotes civic equality, would that be illiberal? Or is it preventing harm to third parties (here, children and caregivers)? The status quo you defend isn’t neutral: it’s built on policies that *coerced* specialisation (e.g., tax systems penalising dual earners). Why is correcting that legacy less liberal than freezing it?  

  Counter-question: If transferable entitlements consistently become mother-only entitlements – as they do empirically – how can that system be neutral between conceptions of the good? Doesn’t it effectively subsidise *only* traditional families?
