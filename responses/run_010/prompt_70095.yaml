answer: |-
  ### Mapping the Doing/Allowing Distinction onto the Schiavo Case  
  *(Four Decision Points Analyzed)*  

  ---

  #### **1. 1998 Petition (Husband’s Request to Withdraw Tube)**  
  - **Agent**: Michael Schiavo (petitioning as guardian).  
  - **Option Set**: (a) Maintain tube feeding indefinitely; (b) Seek court authorization to withdraw tube.  
  - **Classification**:  
    - **Doing/Allowing**: *Allowing* (on dominant judicial view).  
    - **Criterion**: *Counterfactual structure*. Withdrawing intervention permits underlying pathology (anoxic brain damage) to cause death. The "baseline" is the body’s natural course without artificial support.  
    - **Baseline Dependence**: Schiavo’s side framed baseline as pathology taking its course; parents framed it as removing life-sustaining care.  
    - **ANH Status**: Courts treated ANH as *medical treatment* (barrier against pathology), making withdrawal an omission.  
    - **Fact Indexing**: Courts indexed to *accepted medical facts* (PVS diagnosis), though parents contested this.  

  ---

  #### **2. 2001 Removal and Reinsertion**  
  - **Agent**: Medical staff (under court order); then Governor Jeb Bush (via emergency stay).  
  - **Option Set**: (a) Remove tube (executing court order); (b) Reinsert after Governor’s intervention.  
  - **Classification**:  
    - **Initial Removal**: *Allowing* (cessation of treatment).  
    - **Reinsertion**: *Doing* (active re-imposition of intervention).  
    - **Criterion**: *Bodily movement + counterfactuals*. Removal halts a sustained act (allowing); reinsertion is a physical act (doing) that alters the status quo.  
    - **Standing-Intervention Problem**: Withdrawal is not a discrete act but *cessation plus non-revival*. Each day without reinsertion is a new "allowing" decision.  
    - **Baseline Shift**: Governor’s order attempted to reset baseline to "tube in place," making future removal a *doing*. Courts rejected this, upholding pre-intervention baseline.  

  ---

  #### **3. 2003 Statutory Stay ("Terri’s Law")**  
  - **Agent**: Florida Legislature (passing law); Governor (ordering reinsertion).  
  - **Option Set**: (a) Let court-ordered withdrawal proceed; (b) Pass law authorizing executive override.  
  - **Classification**:  
    - **Legislative/Executive Action**: *Doing* (active intrusion into judicial process).  
    - **Criterion**: *Moralized baseline*. Courts saw the law as improperly altering the default (judicial authority), making it a harmful *act*. Florida SC struck it down as unconstitutional *doing*.  
    - **ANH Status**: Legislature implicitly treated ANH as *ordinary care* (hence reinsertion as duty), but courts held firm to "medical treatment" view.  

  ---

  #### **4. March 2005 Sequence (Federal Intervention to Final Death)**  
  - **Agent**: Federal courts (denying injunction); Congress/President (passing emergency law).  
  - **Option Set**: (a) Order reinsertion; (b) Deny appeal, permitting withdrawal to stand.  
  - **Classification**:  
    - **Federal Courts’ Denial**: *Allowing* (refusing to intervene in state process).  
    - **Congressional Action**: *Doing* (creating new jurisdiction to compel review).  
    - **Standing-Intervention Problem**: The 13-day period comprised:  
      - Day 1: Withdrawal as *active cessation* (arguably "doing" under some criteria).  
      - Days 2–13: Daily *allowings* (non-reinsertion), as each day presented a new choice to restart.  
    - **Baseline Dependence**: Pro-reinsertion side framed baseline as "ongoing care" (making cessation killing); courts maintained "underlying pathology" baseline.  
    - **Fact Indexing**: Courts deferred to *trial court’s factual findings* (PVS, Schiavo’s wishes), rejecting contested beliefs.  

  ---

  ### Running It Back: What the Distinction Explains vs. Where It Fails  

  #### **Explanatory Power**  
  1. **Judicial Restraint on Active Euthanasia**: Courts permitted withdrawal (framed as *allowing*) but would ban lethal injection (a *doing*), even if outcomes were identical. The distinction upheld legal coherence.  
  2. **Political Theater**: Legislatures’ *doings* (emergency laws) were visibly "active overrides," contrasting with courts’ *allowings* (denials of review). This made legislative actions appear as norm violations.  
  3. **Rhetorical "Starvation" Claim**: Opponents invoked *doing* language ("killing by starvation") to override the *allowing* frame, exploiting baseline ambiguity (ANH as "food" vs. "treatment").  

  #### **Failures and Silences**  
  1. **Does Not Explain**:  
     - Why ANH’s classification (*treatment* vs. *care*) was pivotal. The distinction *depends* on this prior categorization but doesn’t determine it.  
     - Why courts rejected the "13 days of starvation" narrative despite its visceral pull. The distinction is silent on societal tolerance for prolonged *allowings*.  
     - The role of epistemic uncertainty (contested diagnosis/wishes). The distinction assumes settled facts.  
  2. **Misdescriptions**:  
     - The 13-day window exposes the distinction’s fragility. If each day’s non-reinsertion is an *allowing*, the distinction holds but becomes morally numbing through repetition.  
     - Legislatures’ *doings* were condemned not for being "acts" per se, but for violating separation of powers—a concern orthogonal to doing/allowing.  

  ---

  ### Verdict: The Distinction as Dual-Register Coordination Device  
  The Schiavo episode **confirms the distinction’s institutional utility but exposes its limitations as a moral guide**. It operated in two registers:  
  - **First-Order Moral Claim**: Opponents saw withdrawal as *doing* (killing), proponents as *allowing* (natural death). This moral deadlock was unresolvable via the distinction alone.  
  - **Coordination Device**: Courts used the distinction to assign default authority:  
    - *Allowing* → Private actors (guardian) decide treatment cessation.  
    - *Doing* → State/political branches barred from imposing treatment.  

  **Why Bad Faith Accusations Arose**:  
  The conflation of registers allowed each side to accuse the other of dishonesty:  
  - Pro-withdrawal side saw opponents as misclassifying *allowing* as *doing* to justify state overreach.  
  - Anti-withdrawal side saw courts as hiding a *doing* (active killing) behind *allowing* semantics.  

  **Schiavo as Anomaly for Traditional Theory**:  
  The distinction emerged from one-off thought experiments (drowning child) and fails to handle:  
  - Sustained interventions requiring iterative decisions.  
  - Politically contested baselines.  
  - Institutions (courts, legislatures) as agents.  

  **Final Judgment**: The distinction is **indispensable for legal coordination** but **inadequate for moral resolution** in complex, sustained-intervention cases. Schiavo shows it functions best as a boundary marker for institutional authority, not as a tool to settle deep moral disagreements. The dual-register reading thus stands validated.
