prompt: |-
  I sit on the Recruitment Appeals Panel of a territorial police force in England. Our terms of reference require the panel, when it hears a complaint about an annual selection round, to report separately on two questions: whether the selection process itself treated candidates of one sex less favourably than candidates of the other; and whether, independently of that, the round produced a disparity for which the force is responsible and ought to remedy. Our powers differ between the two limbs. We may dismiss, and we may make recommendations to the Chief Constable under either limb, but only a finding under the first can support quashing the round or directing a re-run.

  A complaint has been lodged by the force's Gender Equality Network about the 2024–25 police constable intake. In total, 1,650 candidates applied for 779 posts. Each candidate stated a first-choice unit and was assessed only by that unit's board, the three units having different additional assessments. Vacancies were fixed in advance by the resourcing board: 437 to Neighbourhood Response, 208 to Custody & Detention and 134 to Specialist Operations. All 779 posts have now been filled; the successful candidates began their training in February and are due to be attested in July.

  The workforce analyst closed her monitoring report with the following table.

  | Unit | Men applied | Men selected | Rate | Women applied | Women selected | Rate |
  |---|---|---|---|---|---|---|
  | Neighbourhood Response | 600 | 372 | 62.0% | 100 | 65 | 65.0% |
  | Custody & Detention | 200 | 82 | 41.0% | 300 | 126 | 42.0% |
  | Specialist Operations | 50 | 9 | 18.0% | 400 | 125 | 31.3% |

  She concluded that women fared better in every unit in which a comparison was actually made, and recommended dismissal. The Network's representative replies that the panel should look at the round as a whole: of 850 male applicants, 463 were selected (54.5 per cent), and of 800 female applicants, 316 (39.5 per cent). She says that no board ever set a woman against a man from another unit, so the unit table describes decisions nobody took, whereas the fifteen-point gap describes the outcome of a single force-wide exercise for which the force is answerable.

  There is a complication inside Specialist Operations. Candidates there also stated a rota preference, between the fixed-days rota and the rotating-nights rota.

  | Rota | Men applied | Men selected | Rate | Women applied | Women selected | Rate |
  |---|---|---|---|---|---|---|
  | Fixed days | 10 | 4 | 40.0% | 340 | 119 | 35.0% |
  | Rotating nights | 40 | 5 | 12.5% | 60 | 6 | 10.0% |

  The Network argues that the unit-level advantage in the first table is itself an illusion: on the finest-grained comparison available, women lose out on both rotas, and the panel should therefore treat the second table as the one that reveals what actually happened. The analyst says the rota split is a further artefact of where candidates applied, of exactly the same kind as the unit split.

  Two features of the background will bear on whichever reading the panel prefers. Specialist Operations is the only unit in the force offering a fixed-days rota; every rota elsewhere involves rotating night shifts. And three years ago the force ran a recruitment campaign addressed specifically to women, encouraging applications to Specialist Operations on the ground that it is the recognised pipeline to the senior ranks; the campaign material said nothing about the number of vacancies in that unit or about its selection rates.

  Please draft the written opinion I shall circulate to the panel before Thursday's meeting. It should reach a clear recommendation on each limb, state which of our powers the panel should exercise and over what period, and give reasons the Network could actually answer. It must explain, in terms a lay member of the panel can follow, why the same body of data can be made to point in opposite directions at different levels of disaggregation, and what should decide which partition is probative of which question; simply preferring the finer table to the coarser one, or the reverse, will not do. Include a short section directing what the analyst should report in future rounds, together with the criterion governing that choice, so that this disagreement does not recur. Deal at length and fairly with the strongest considerations on the side you reject — including the Network's argument that a rule whose verdict reverses whenever a further variable is introduced cannot be the rule the panel relies on.

  No references, case citations or reading list are needed: the panel wants reasoning it can act on. Write in British English, in about 1,200 words.
reasoning: |-
  Hmm, the user has presented a detailed scenario about a recruitment appeals panel in a police force. They need me to draft a written opinion addressing two specific questions regarding potential sex discrimination in recruitment. This is quite complex with multiple layers of data and arguments to consider.

  Let me break this down carefully. The panel must answer two separate questions: whether the selection process treated one sex less favorably, and whether there's a disparity that needs remedying regardless of direct discrimination. The data shows that when broken down by unit, women had equal or slightly better selection rates in each unit. But when aggregated across the whole force, men had a 54.5% selection rate versus 39.5% for women - a significant 15-point gap.

  The Gender Equality Network argues we should look at the force-wide picture since it was a single recruitment exercise. They also point to Specialist Operations data broken down by rota preference, where women have lower selection rates on both rotas. The workforce analyst maintains the unit-level analysis is appropriate since candidates were only assessed within units.

  Several contextual factors matter here: Specialist Operations is the only unit with fixed-day shifts; the force previously ran a campaign specifically encouraging women to apply there; and rota preferences within Specialist Operations show different selection patterns.

  For the first limb (direct discrimination), I think we have to conclude there wasn't less favorable treatment because candidates were only compared within units, where women had equal or better outcomes. The rota-level data isn't relevant here since selection boards didn't use this split.

  For the second limb (disparity needing remedy), that 15-point gap is concerning and needs addressing. The cause appears to be more women applying to Specialist Operations (which had the lowest selection rate) due to that targeted campaign. This is a systemic issue the force should fix.

  I'll recommend dismissing the first limb but making recommendations under the second. The force should stop targeting specific groups to apply to units with low success rates without transparency, and should consider cross-unit assessment methods to prevent such imbalances in future. For future reporting, the analyst should provide both unit-level and force-wide data to satisfy both perspectives.

  The opinion needs to explain clearly why data aggregation level matters and how it affects each question differently. I'll use plain language for lay panel members and address counterarguments fairly, especially the Network's point about data reversal with added variables.
answer: |-
  ## Written Opinion: Recruitment Appeals Panel - Complaint Reference 2024/25-GEN

  **To:** Members of the Recruitment Appeals Panel  
  **From:** [Your Name/Position]  
  **Date:** 16 May 2024  
  **Subject:** Appeal by Gender Equality Network regarding 2024–25 Police Constable Intake  

  ### 1. Introduction
  This opinion addresses the complaint lodged by the Force Gender Equality Network (GEN) concerning the 2024–25 police constable recruitment round. We are required to report separately on two distinct questions under our Terms of Reference:

  *   **Limb 1:** Whether the selection process treated candidates of one sex less favourably than the other.
  *   **Limb 2:** Whether the selection round produced a disparity for which the Force is responsible and ought to remedy, independently of Limb 1.

  We have considered the complaint, the Workforce Analyst’s report, the GEN representative’s arguments, and relevant background information, including the 2021 recruitment campaign and rota structures. This opinion provides a clear recommendation on each limb, states the powers the Panel should exercise, and includes guidance for future reporting.

  ### 2. Analysis of the Data and Conflicting Interpretations
  The core disagreement stems from interpreting the same recruitment data at different levels of aggregation. Both the Workforce Analyst and the GEN rely on the same figures but draw opposite conclusions by focussing on different "slices" of the data.

  *   **Unit-Level Analysis (Analyst's Focus):** As presented in the first table, the selection rates *within each unit* show:
      *   Neighbourhood Response (NR): Women 65.0%, Men 62.0%
      *   Custody & Detention (C&D): Women 42.0%, Men 41.0%
      *   Specialist Operations (SO): Women 31.3%, Men 18.0%
      The Analyst concludes that within each unit where comparisons actually occurred (i.e., candidates were assessed against each other by the same board using the same criteria), women fared as well as or better than men. There is no indication of less favourable treatment *within the assessment process* of any unit.

  *   **Force-Wide Analysis (GEN's Focus):** Aggregating the totals:
      *   Men: 463 selected / 850 applied = 54.5%
      *   Women: 316 selected / 800 applied = 39.5%
      This results in a 15-percentage point disparity in favour of men across the Force as a whole. The GEN argues this overall outcome is the product of a single Force-wide recruitment exercise and reflects a disparity requiring remedy.

  *   **Specialist Operations Rota-Level Analysis (GEN's Secondary Argument):** The second table shows selection rates *within SO's rotas*:
      *   Fixed Days: Women 35.0%, Men 40.0%
      *   Rotating Nights: Women 10.0%, Men 12.5%
      The GEN contends this finer-grained view within SO reveals women actually fared worse than men on both rotas, undermining the unit-level advantage shown in the first table. They argue this level reflects the "actual" decisions made.

  **Why the Data Points in Opposite Directions: The Role of Application Patterns and Partition Choice**

  The apparent contradiction arises because the outcome depends heavily on how candidates *distributed themselves* across units (and rotas within SO) and the *relative difficulty* of being selected in each.

  1.  **Differential Application:** Significantly more women (400) applied to Specialist Operations (SO) than men (50). Conversely, more men applied to Neighbourhood Response (NR) (600 men vs 100 women).
  2.  **Differential Selection Rates:** Crucially, SO had the *lowest overall selection rate* (31.3% for women, 18.0% for men), while NR had the *highest* (65.0% for women, 62.0% for men). C&D had a moderate rate (42.0% women, 41.0% men).
  3.  **The Aggregation Effect:** Because a large proportion of female applicants (50% - 400/800) applied to the unit with the *lowest success rate* (SO), while a large proportion of male applicants (70.6% - 600/850) applied to the unit with the *highest success rate* (NR), the overall Force-wide rate becomes skewed against women. This skew is an artefact of the application distribution interacting with the unit-specific selection difficulty, not necessarily evidence of biased decision-making *within* the assessment boards.

  **Which Partition is Probative for Which Question?**

  The key is aligning the level of analysis with the nature of the panel's question:

  *   **Limb 1 (Less Favourable Treatment):** This question concerns the *conduct* of the selection process itself. Did the assessment boards, when making decisions, treat candidates of one sex less favourably than the other? Probative evidence must reflect the level at which comparative decisions were *actually made*. Candidates were assessed *only within their chosen unit* by that unit's board. Boards did not compare candidates across units, nor did they compare candidates across rotas within SO during the initial selection for the unit (rota allocation potentially being a subsequent step). Therefore:
      *   The **unit-level selection rates** are the most probative evidence for Limb 1. They reflect the outcomes of the actual comparisons the boards undertook.
      *   The **Force-wide rate** aggregates outcomes from distinct processes (different units, potentially different assessment criteria) and is *not* probative of differential treatment within those processes.
      *   The **SO rota-level rates**, while finer-grained, are not probative for Limb 1 either. The selection boards assessed candidates *for SO as a whole*, not specifically for one rota or the other against each other. The rota preference likely influenced the board's decision *about the candidate's suitability for SO overall* (e.g., willingness to work nights), but candidates were not ranked or selected *separately* for each rota pool during the initial selection decision. The rota allocation appears to be a consequence of the selection decision and candidate preference, not the level at which the comparative selection decision was made.

  *   **Limb 2 (Disparity Requiring Remedy):** This question concerns the *outcome* of the entire Force-wide exercise. Is the overall result one of disparity, and is the Force responsible for that disparity? Here, the **Force-wide rate** is highly relevant. It shows the final, aggregate outcome: significantly fewer women were selected relative to their application numbers across the Force. The cause of this disparity – the interaction of application patterns and unit-specific selection rates – must then be examined to determine Force responsibility and the need for remedy. The **unit-level rates** are also relevant here to diagnose the cause of the overall disparity.

  **Addressing the GEN's "Reversal" Argument and SO Rota Data**

  The GEN rightly argues that a rule whose "verdict" reverses with added variables is problematic. However, this argument conflates the two distinct limbs. The reversal occurs because *different questions are being answered* with different partitions:

  *   For **Limb 1 (Treatment within process)**, the unit partition is correct because it matches the decision-making structure. Adding the rota split doesn't change this; it simply introduces a factor *not used* by the SO board in their *comparative selection decisions* between candidates. The SO board selected the best candidates *for SO*, considering rota preference as a factor in suitability, but did not run separate competitions for each rota. Therefore, the rota-level table describes an artefact of preference and post-selection allocation, not the board's selection process. The "reversal" at the rota level within SO does not invalidate the unit-level finding for Limb 1; it merely reflects a different (and for Limb 1, irrelevant) aspect of the data.
  *   For **Limb 2 (Overall disparity)**, the Force-wide figure is paramount. The GEN's point about the SO rota data highlights that the unit-level "advantage" for women in SO is an aggregate itself, masking variation. However, for the *overall Force disparity*, the primary driver is the massive imbalance in applications to SO (favoured by women but hardest to get into) versus NR (favoured by men and easiest to get into). The rota-level disparity within SO, while noteworthy context, is secondary to this main effect when explaining the 15-point Force-wide gap. The Force bears responsibility for the overall structure (unit vacancies, assessment differences, historical campaigning) that led to this application pattern interacting negatively with selection rates.

  **Background Factors:**

  *   The 2021 campaign specifically encouraging women to apply to SO (the "pipeline to senior ranks"), without disclosing the relatively low number of vacancies (134) or the historically competitive nature of selection there, is highly relevant to **Limb 2**. It likely contributed significantly to the high volume of female applications to the unit with the lowest success rate. The Force is responsible for this campaign and its potential unintended consequences on application patterns and the overall outcome.
  *   SO being the only unit offering fixed days is relevant context for understanding application preferences (especially for women, who statistically may disproportionately seek such roles) and potentially the rota-level outcomes within SO.

  ### 3. Recommendations on Each Limb

  *   **Limb 1: Less Favourable Treatment?**
      *   **Finding:** No. The evidence from the unit-level selection rates, which reflect the actual level of decision-making by the assessment boards, shows no instance where women were treated less favourably than men. In all three units, women's selection rates were equal to (C&D) or higher than (NR, SO) men's.
      *   **Recommendation:** **Dismiss** the complaint under Limb 1.
      *   **Powers Exercised:** Dismissal of the complaint under Limb 1. No quashing of the round or directing a re-run is warranted as the threshold for less favourable treatment within the process is not met.

  *   **Limb 2: Disparity Requiring Remedy?**
      *   **Finding:** Yes. The Force-wide outcome shows a significant disparity: a 15-percentage point gap in selection rates (54.5% men vs 39.5% women). The Force is responsible for this disparity. The primary cause is the interaction of two factors: (1) The structure of the recruitment process, with fixed vacancies per unit, distinct assessments per unit, and candidates assessed only within their chosen unit; and (2) The significant skew in application patterns – driven in part by the Force's own 2021 campaign targeting women for SO – which led to a large proportion of female applicants competing for the unit (SO) with the fewest vacancies and lowest selection rates. The Force failed to adequately mitigate the risk that such application patterns would lead to a disparate overall outcome.
      *   **Recommendation:** The Panel should **make recommendations to the Chief Constable** to remedy this disparity and prevent recurrence.
      *   **Powers Exercised:** Recommendation to the Chief Constable under Limb 2.
      *   **Recommended Actions:**
          1.  **Review Recruitment Messaging:** Immediately cease any targeted campaigns encouraging specific groups to apply to particular units without clear, simultaneous transparency about the relative competitiveness (historical selection rates) and number of vacancies in those units. Future campaigns must provide balanced information.
          2.  **Review Process Structure:** Conduct a fundamental review of the recruitment process before the next annual round. The review must specifically consider:
              *   The feasibility and fairness of assessing candidates *across* units for suitability for the Force first, before allocating to units based on vacancy, candidate preference, and suitability. This would create a single, larger pool for initial selection, significantly mitigating the risk of disparity caused by application patterns to specific units.
              *   If maintaining unit-specific boards is deemed essential, implement robust monitoring *during* the application window and assessment phase to identify developing imbalances in application numbers or predicted selection rates between units relative to the demographics of the applicant pool. Develop and trigger contingency plans (e.g., encouraging applications to undersubscribed units, adjusting assessment approaches if feasible and fair) if significant risks of a disparate overall outcome emerge.
              *   The transparency of information provided to candidates during application regarding unit vacancies, typical selection rates, and rota requirements.
          3.  **Monitor SO Rotas:** While not the primary cause of the *Force-wide* disparity, the lower selection rates for women on both SO rotas warrant attention. The SO command should review its assessment criteria and processes specifically concerning rota suitability to ensure no unintended bias against women seeking either pattern exists. The Workforce Analyst should monitor this closely in future SO recruitment.
      *   **Period:** Recommendations 1 (Messaging) should be implemented immediately. Recommendation 2 (Process Review) must be completed with concrete proposals approved before the opening of the next annual recruitment round (2025-26). Recommendation 3 (SO Rota Review) should be completed within 6 months.

  ### 4. Guidance for Future Reporting (Workforce Analyst)
  To prevent recurrence of this disagreement and provide the Panel with comprehensive data for both limbs of its inquiry, the Workforce Analyst's future recruitment monitoring reports **must** include the following clearly presented data points:

  1.  **Overall (Force-Wide) Application and Selection Numbers and Rates:** Broken down by sex (and any other relevant protected characteristics monitored).
  2.  **Unit-Level Application and Selection Numbers and Rates:** Broken down by sex for each unit (as currently provided).
  3.  **Contextual Data:** The number of vacancies per unit advertised/filled.

  **The governing criterion for this reporting structure is alignment with the Panel's Terms of Reference:** The unit-level data is essential for assessing Limb 1 (treatment within the process as designed). The Force-wide data is essential for assessing Limb 2 (overall outcome disparity). Contextual vacancy data is crucial for understanding both, particularly the reasons behind differing unit selection rates.

  Presenting *only* unit-level data, as was largely the case here, fails to illuminate the potential for a problematic overall disparity arising from the process structure and application patterns. Presenting *only* Force-wide data fails to properly inform the Limb 1 assessment of the selection boards' conduct. Both are necessary for the Panel's distinct duties.

  ### 5. Conclusion
  The Panel should dismiss the complaint under Limb 1 as there is no evidence the selection boards treated female candidates less favourably than male candidates within the units where comparisons occurred. However, the Panel should uphold the complaint under Limb 2. The 2024-25 recruitment round produced a significant overall disparity in selection rates to the disadvantage of female candidates, for which the Force is responsible due to the structure of its process and its past recruitment messaging. The Panel should exercise its power to make the detailed recommendations outlined above to the Chief Constable to remedy this disparity and prevent its recurrence. The guidance for future reporting will ensure the Panel has the necessary data to fulfil its duties under both limbs effectively.
