answer: |-
  ## The Register of Unseen Things

  The dust motes danced in the slanted afternoon light of Martin’s study, undisturbed save for the slow, deliberate movement of his own hand. He traced the embossed spine of the book – no, not a book, *the* Chronicle. It was an absurdity, inherited from his great-uncle Silas, a man whose eccentricity shaded into something more profound. Bound in cracked, indeterminate leather, its pages were not paper but thin sheets of a dark, fibrous material that absorbed ink greedily and never bled. Silas had called it the “Register of What Was,” and claimed it housed not memories, but the *structure* of the past itself. Martin, the physics teacher who graded papers and explained Newton’s laws to indifferent teenagers, had dismissed it as senile fancy. Until March.

  Until Leo.

  Leo, his younger brother, vibrant and reckless, extinguished by a patch of black ice on a mountain road. Leo, whose absence wasn’t an empty space but a constant, gnawing presence. Martin found himself drawn to the Chronicle, not for solace, but for a desperate kind of verification. If only present things existed, where *was* Leo? Was he truly *gone*, erased entirely, leaving only the hollow ache and the photographs? Or was he… preserved? Somewhere?

  He opened the Chronicle. The ink wasn’t faded; it was unnervingly crisp, deep black against the near-black page. Entries weren’t narratives, but lists. Exhaustive, microscopic descriptions. Page 7,432, Column D: *"April 12th, 1987, 3:17 PM GMT. The left rear molar (designated Molar 3.8) of Martin James Keller (resident at 17 Oak Lane, Alderford) exhibits a microfracture measuring 0.002mm along the distolingual cusp, caused by inadvertent pressure applied during mastication of a caramel confection (brand: 'Golden Nugget', batch #TL784). Ambient temperature: 21.3°C. Relative humidity: 45%."*

  It went on. For everything. Every grain of sand on every beach, every photon emitted from every star, every fleeting thought in every mind, captured in a mutually exclusive, exhaustive set of propositions. This, he understood dimly, was one philosopher’s answer to the void left by the past: the past *was* this description. But the description was abstract, unchanging. What made *this* description true, and not another? What anchored it to a reality that no longer physically existed? The Chronicle seemed to assert that the description *was* the anchor. Martin felt sick.

  He found Leo’s entry. Not a single record, but a vast constellation of them, indexed under his name and coordinates in space-time. Page 19,876, Column A: *"March 14th, 2024, 11:08:23 AM PST. Leo Thomas Keller experiences a surge of adrenalin (concentration 1.82 μg/dL) precipitating a tightening of grip (force: 12.3 Newtons) on the leather-wrapped steering wheel (Vehicle ID: CA7HJ891) of a 2021 Subaru Outback traveling at 67.4 km/h on State Route 89, 3.2km north of Donner Pass Summit..."* Martin couldn’t read further. The clinical precision was obscene. Yet, it was *Leo*. Captured.

  The compulsion seized him, cold and terrifying. *If the description is the only thing that exists of the past… what if I change it?* Not the present – that was fixed. But the description? The anchor? He selected a minor, absurd entry from Leo’s childhood, deep in the Chronicle's earlier volumes. Page 1,122, Column F: *"August 5th, 2001, 4:55 PM PDT. Leo Thomas Keller (age 9) scrapes his left knee (abrasion area: 2.1 cm²) on the gravel driveway (composition: 63% quartz, 22% feldspar, 15% miscellaneous) at 17 Oak Lane. Causative agent: stumble while chasing a red rubber ball (diameter 15cm, brand 'Spalding')."*

  With a fine-tipped archival pen, its ink chemically identical to the Chronicle’s own, Martin carefully altered the abrasion area to *3.1 cm²*. He held his breath. Nothing happened. No ripple in reality, no shift in memory. He remembered the scrape vividly; it had been small, insignificant. The Chronicle *now* described a larger wound. But his memory remained unchanged. The present was utterly unaffected. The altered description sat there, crisp and undeniable, yet disconnected from anything tangible. What *made* it true? What force ensured this description, among all possible infinite descriptions, was the one that *obtained*? The Chronicle offered no answer, only the mute, alterable record. The anchor felt less like bedrock and more like ink on a strange, dark sea.

  ***

  Two weeks later, the second pressure point arrived via quantum entanglement communicator. Not standard issue, another Silas relic. It resembled an Art Deco radio crossed with a crystal ball, humming faintly. It linked Martin to his sister, Elara, an astrophysicist currently hurtling towards Proxima Centauri aboard the *Daedalus*, humanity’s first generation ship. Time dilation was significant. For Martin, weeks passed; for Elara, compressed by her velocity, it was days.

  The communicator flared. Elara’s face appeared, familiar yet subtly younger, the light from her screen casting hard shadows. Her usual wryness was absent. "Martin. We just passed the heliopause marker buoy. Full interstellar velocity now." A pause. Heavy. "The buoy... it transmitted Leo's memorial service recording. The one you sent months ago. I just... I just watched it."

  Martin’s heart clenched. He’d sent it shortly after the funeral, a raw, grief-stricken impulse. For him, that service was four months past, a scar beginning, however painfully, to form a layer of tissue over the wound. For Elara, hurtling away at a significant fraction of lightspeed, the signal had taken time to reach the buoy, and her *now* intersected with the transmission’s arrival *now* only because of her motion. The service, for her, was happening *now*. The grief was fresh, immediate, a knife plunged anew.

  "Elara..." he began, helplessly.

  "It was raining," she whispered, tears welling but not falling in the ship’s microgravity. "You looked... shattered. Mum couldn't stop shaking. That hymn... 'Abide With Me'... I heard Leo singing it once, terribly off-key in the shower." She choked. "He's *gone*, Martin. Right now. It just happened."

  For Martin, Leo’s death was a settled, agonizing fact. For Elara, observing from her hurtling frame of reference, the news of his death and the memorial service were simultaneous events happening *now*. Her grief was at its peak, a raw, present agony. His was a deep, persistent ache.

  He had a decision. He could say, "Elara, that was months ago for me. It gets... different." But that would invalidate her *now*, her present reality. Or he could enter her present, say, "I know. It’s unbearable right now." Acknowledge her truth. But that would mean denying the distance his own grief had traveled, pretending the raw wound was still bleeding as freely as it had in March. Neither felt honest. Neither encompassed the totality of Leo’s absence. The objective present, if it existed, offered no guidance. Her *now* and his *now* disagreed about what event was currently happening, and physics declared both equally valid. How could he comfort her across that gulf? His hand hovered over the comm controls.

  "Right now," he said finally, his voice thick, "right now, hearing you... it feels like losing him all over again too." Not a lie, not the whole truth, but a bridge built on shared sorrow, suspended between two irreconcilable *nows*.

  ***

  The Chronicle offered no comfort, the communicator only dissonance. Martin found himself clinging to the third possibility – the thick present. Maybe everything *did* exist, past and future, like frames on a vast film reel. But the projector beam – the *now* – had a width. It wasn’t a knife-edge, but a span. Leo wasn’t *gone*; he was just outside the beam, in the penumbra. Close enough to touch, sometimes. Martin began to feel it – not just memory, but *presence*. The scent of Leo’s cheap sandalwood cologne near the old armchair. A flicker of movement at the edge of vision, resolving into nothing. A warmth beside him while reading late, vanishing when he turned his head. These weren't hallucinations, he told himself; they were the fringes of the *now*, where Leo still lingered in the thickness of time.

  He needed it to be true. Without that thickness, Leo was either erased (the horror of the shifting, anchorless Chronicle) or frozen forever in a distant frame (the cold eternity of the block universe). The thickness offered proximity, even if fading.

  He kept Leo’s ashes in a simple, brushed titanium urn on the mantelpiece. Letting them go felt like the final acceptance of the knife-edge present, the admission that the thickness was an illusion. But Elara was returning soon (her 'soon', accounting for deceleration and the return trip time dilation, was still a year away for Martin). She wanted to scatter them together in the Sierra Nevada, near where Leo loved to hike. Martin couldn't bear the urn’s mute presence. It represented the irreducible fact Leo was *only* ash, confined to a single, shrinking point in the *now*.

  He decided to scatter them himself. A private ritual. An irreversible event. He chose a high alpine meadow Leo had loved, carpeted in late summer wildflowers. He opened the urn. The ashes were finer than dust, grey-white. He hesitated, the urn heavy in his hands. This was it. The point of no return. If the present was thick, Leo might still be *here*, somehow, in the wind, the scent of pine, the sunlight. Scattering the ashes wouldn't change that. But if it *was* a knife-edge…

  He tilted the urn. The ashes caught the breeze, swirling upwards, diffusing, vanishing into the vastness. A gust whipped a plume towards his face. He didn't flinch. He breathed in. For a fraction of a second, impossibly, there was a sensation – not sandalwood, but ozone, cold stone, and something deeply, intimately *Leo*. It was there, vivid and undeniable. Then gone.

  He gasped, clutching the empty urn. Had he felt it? Or had grief and desperate hope conjured it? The edge of the thick present? Or just the wind and wishful thinking? The intensity was staggering, but it faded instantly, leaving not certainty, but a deeper, more personal doubt. Was the unsharpness in the world, allowing Leo a lingering trace? Or was it only in him, Martin, a trick of a mind unable to accept the finality of the knife-edge? The warmth beside him while reading… had it ever been real? The scent of cologne? He couldn’t prove any of it. The thickness, so necessary, felt suddenly fragile, subjective. The ashes were gone. That was irreversible. The urn was empty.

  ***

  Back in his study, dust motes still danced. The Chronicle lay open, its altered entry about Leo’s childhood scrape a silent testament to the mutability of the record. The communicator was dark; Elara was months away from the next transmission window, carrying her own version of *now*. The urn sat clean and hollow on the mantelpiece.

  Martin didn’t touch the Chronicle. He knew now he could erase Leo entirely from its pages. Rewrite his brother’s life as a footnote, or a saint, or a stranger. And the present – the dust motes, the ache in his chest, the emptiness of the urn – would remain stubbornly, detectably the same. The description could be severed from the… what? The anchor was gone. The description *was* the only ghost left, and it could be exorcised with ink.

  He looked at the communicator. When Elara next called, would she be watching the memorial service again? Or would her *now* have moved on to receiving his account of scattering the ashes? Their grief would remain asynchronous, forever out of step, each trapped in their own valid, relative present moment.

  He touched the cool titanium of the urn. That fleeting sensation on the mountain – the thickness, the presence – had it been the world’s concession, or his mind’s rebellion against the horror of the knife-edge? He needed it to be real. But the ashes were gone. The irreversible act was done. The doubt wasn’t intellectual; it was the hollow echo in the urn, the fading aftertaste of ozone and stone on his tongue, the terrifying ambiguity of whether he had felt Leo one last time, or merely the wind of his absolute departure. He had paid the cost of each possibility: the anchorless void, the fractured *now*, the fragile thickness. He carried all three weights. The past was gone, and remained, and lingered just out of reach. Leo was nowhere, and everywhere, and ashes on the wind. The question remained, echoing in the silent room filled only with dust and absence.
