  User clearly knows their stuff—they're not asking for Intro to Legitimacy 101. They want surgical questions that force the theorist to defend the model's architecture, not just restate it. And they demand follow-ups that prevent evasion. 

  For sizing the reserve: Theorist will probably dodge quantification by calling it "emergent" or "contextual." Good follow-up: Press her on whether that makes the model unfalsifiable. 

  Falsifiability trap: She'll retreat to "complex systems aren't lab rats." Follow-up: Demand *any* hypothetical evidence that could disprove it. 

  Tocqueville angle: She'll say expectations adapt. Clever follow-up: Ask if that means reserves decay naturally—undermining her replenishment thesis. 

  Unreliable metrics: She'll distinguish "perceived" vs. "real" reserves. Follow-up: Point out that makes legitimacy purely perceptual—contradicting her anti-consent stance. 

  Normative claim: She'll say legitimacy isn't consent but "non-rejection." Gotcha follow-up: Highlight that this still hinges on attitudes, smuggling consent through the back door. 

  Killer closing: Force her to name a falsification scenario. No theory gets immunity. 

