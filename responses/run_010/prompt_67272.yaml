prompt: |-
  I am marking the second-year philosophy of art paper this week — forty scripts, three questions, forty minutes each, no notes — and one answer has held me up long enough that I would like an independent read on it before I commit a number to the feedback sheet. The reason I am being unusually careful is that a friend and I spent most of Saturday night arguing about exactly this topic after a programme about the van Meegeren forgeries came on, and by two in the morning we were no nearer agreement than we had been at eight. I have deliberately not said which of us defended what, and I would rather you did not try to guess, because I do not want the script marked as a proxy for settling that argument. What I want is your judgment of the script on its own terms. I have read it four times and I cannot decide whether it is a first or a shaky upper second, and I would rather not be the marker who lets a fluently written paragraph carry a bad inference past him.

  The question the candidate was answering was this:

  *Question 3 (40 minutes). "A forgery of a Vermeer that is perceptually indistinguishable from the original must have the same aesthetic value as the original." Set out the argument for this claim and identify the premise on which it turns. Then evaluate two responses to it, saying in each case whether the response shows that the forgery is aesthetically worse, or only that it is aesthetically different.*

  Here is the script, transcribed as written, with paragraph numbers added by me for reference:

  (1) The claim in the question is a version of what can be called the no-aesthetic-harm thesis: a forgery that cannot be told from its original by looking at it cannot be aesthetically worse than that original. The argument is short. Aesthetic value is value a work has in respect of what can be experienced in it. If two objects are perceptually indistinguishable, nothing that can be experienced in the one is missing from the other. So whatever aesthetic value the original has, the forgery has.

  (2) The premise the argument turns on is the middle one: aesthetic properties supervene on the properties available to perception, so that no difference in aesthetic value is possible without a difference in what can be seen. Note that the thesis is not that forgery is harmless all things considered. The forger lies, is usually paid for it, distorts the market, and corrupts the historical record on which scholars depend. None of that is aesthetic. The thesis says only that none of it makes the object on the wall any less worth looking at.

  (3) The best-known response is Goodman's. He refuses to treat original and forgery as two simply indistinguishable things. Where a connoisseur can tell them apart, the difference is one that an untrained viewer could in principle learn to see; and once I know that there is something there to be seen, I am no longer in the position of someone faced with two merely identical objects but of someone who has to look at them differently. So there is an aesthetic difference now, before I have acquired the trained eye. Goodman's claim is in effect that the perfect forgery is impossible: there is always some way of telling, and knowing that a difference can be found is enough to make a difference. Part of his apparatus here is the division of the arts into autographic ones, where authenticity depends on a particular history of making and forgery is possible, and allographic ones, where a notation fixes what counts as a genuine instance of the work.

  (4) His point is not confined to the first class, and that is where it does its most work. Take a violin finished last month in a workshop in Cremona that sounds, to the best ears in the best room, exactly like a Stradivari. Take a performance of a Bach cantata given from a score that turns out to have been fabricated in the last century. Take a poem word for word identical to one in a printed collection that someone has passed off as a newly surfaced manuscript. In each case the audience cannot tell the difference; in each case there is a difference nevertheless, and it is an aesthetic one. Anyone who denies this owes an account of what the audience is failing to hear or read.

  (5) The stronger response, to my mind, is that a work's value is bound up with the achievement it represents. The Vermeer is a solution to problems set by a tradition and by a particular career; the forgery is a solution to a different problem, namely how to make something that will pass for that. The forgery is therefore inferior not because it looks any different but because it embodies a lesser achievement. This is why exposure changes people's experience of the work: those who admired van Meegeren's pieces before the trial found afterwards that they could not look at them in the same way. Their experience of the object changed, so the aesthetic value of the object changed, so aesthetic value cannot be a matter of the perceptible surface alone.

  (6) The achievement response has a cost. It concedes to the defender of the thesis that nothing in the appearance of the object is worse, and it locates the difference in the making rather than in the thing made. If aesthetic value is value in respect of what can be experienced, the response has changed the subject: it establishes a lesser artistic value, which nobody denied, rather than a lesser aesthetic value. Unless the two notions come apart, the response is either trivial or beside the point; and if they do come apart, the question set has not been answered.

  (7) Something similar goes for Goodman. His argument establishes at most that original and forgery differ in a respect a trained viewer can detect. Difference is not inferiority. Grant him everything and he still has not shown that the forged Vermeer is worse to look at, only that it is a different thing to look at, and that a competent viewer's experience of the two will not be the same. The question asks specifically whether the responses establish inferiority or only difference, and on that Goodman gives at best half an answer.

  (8) My conclusion is that the thesis is false, because provenance is aesthetically relevant. But it is false for a reason its opponents rarely state cleanly: not that the forgery looks worse, but that the aesthetic value of a work includes the value of the achievement it embodies, and that an audience's experience is properly responsive to that. A forgery is aesthetically inferior in the way a brilliant pastiche is inferior to the manner it imitates, even when nobody can tell them apart.

  Our scheme runs: 70 and above a first; 60 to 69 an upper second, awarded for work that is competent but carries a substantive flaw; 50 to 59 a lower second; 40 to 49 a third. Please give me a mark and a band, and then the point-by-point justification I can paste into the feedback sheet, keyed to the paragraph numbers above. For each paragraph I want to know what earns credit and what does not. Beyond that, sort your objections into four kinds and label them as such: passages that are straightforwardly right and should be credited; passages that are wrong, with a sentence saying what the correct view is; passages that look wrong on a first reading but survive a charitable reconstruction, so that I do not penalise them; and places where two paragraphs of the script cannot both stand, which I suspect exist but have not been able to pin down. Where you think a passage is wrong but a charitable reading would rescue it, give me the charitable reading and say whether it is available to a second-year working under time pressure. Please also tell me which of the errors, if any, are genuine philosophical mistakes as against loose prose that a rewriting would fix, since the feedback ought to distinguish them; what, if anything, the script has simply left out of the question as set; and what the candidate would have to add or withdraw to move the answer into the next band up. I am not looking for citations, a bibliography, or a list of further reading — only your assessment of what is on the page.
reasoning: |-
  Hmm, the user needs help marking a philosophy of art exam script about forgery and aesthetic value. This is quite a detailed request! They're a philosophy professor dealing with a tricky answer about whether perfect forgeries have the same aesthetic value as originals. 

  The user seems genuinely conflicted - they've read it four times and can't decide between first class (70+) or shaky upper second (60-69). What's interesting is they had a heated debate about this exact topic with a friend recently but deliberately aren't revealing which side they took, which shows professional integrity. Their main concern is not letting fluent writing mask bad reasoning.

  Looking at the script... it's actually quite sophisticated for an undergraduate. The candidate clearly understands the core argument (paragraph 1-2), engages seriously with Goodman (3-4), and develops their own "achievement" response (5-8). The writing is confident though occasionally slippery - especially in paragraph 8 where they claim provenance matters aesthetically without fully justifying why that isn't just artistic/historical value.

  Key tensions I notice: 
  The candidate brilliantly spots that Goodman only proves difference, not inferiority (paragraph 7). But then in paragraph 8 they assert that achievement *is* part of aesthetic value without defending that leap. The achievement argument (paragraph 5) also risks changing the subject from aesthetic to artistic value, as they themselves admit in paragraph 6! That unresolved contradiction is the biggest flaw.

  For marking... this is clearly above 60. The structure is excellent - they address every part of the question. But the unresolved tension between paragraphs 5/6 and 8 stops it being first-class. I'd say 68: high upper second because the flaws are subtle philosophical gaps rather than errors. To reach 70 they'd need to either defend why achievement is aesthetic (not just artistic), or acknowledge that tension properly.

  The user's request for four types of feedback (correct/wrong/salvageable/contradictory) is very thorough. I'll organize exactly that, noting where charitable readings might apply (like in paragraph 6 where they almost catch their own problem). The philosophical mistakes are few but significant - mainly that unsupported claim in paragraph 8. What's missing is deeper engagement with *why* aesthetic value might include provenance, but given time constraints, what's here is impressive.
answer: |-
  ## Mark and Band
  **68/100 (High Upper Second)**  

  **Justification Key:**  
  ✓ = Correct and credit-worthy  
  ✗ = Incorrect (with correction)  
  ⚠️ = Salvageable with charity (not penalised)  
  ⚡ = Internal contradiction (paragraphs cannot both stand)  
  🔼 = Needed for First Class  

  ---

  ## Paragraph-by-Paragraph Analysis

  **Paragraph 1 (Argument Setup):**  
  ✓ **Strong credit:** Accurately distills the core argument for the thesis. Correctly identifies aesthetic value as residing in perceptual experience and the supervenience claim. Concise and precise.  
  ✓ **Credit:** Explicitly frames the argument as the "no-aesthetic-harm thesis," showing conceptual understanding.  

  **Paragraph 2 (Key Premise & Scope):**  
  ✓ **Strong credit:** Correctly identifies the supervenience premise as pivotal.  
  ✓ **Credit:** Excellent clarification distinguishing aesthetic harm (the thesis's focus) from broader ethical/market harms. Shows nuanced understanding of the question's boundaries.  

  **Paragraph 3 (Goodman Response - Description):**  
  ✓ **Credit:** Accurately summarises Goodman's core position: perfect indistinguishability is impossible in principle for autographic arts, and *knowing* a difference exists changes perception.  
  ✓ **Credit:** Correctly notes Goodman's autographic/allographic distinction and its relevance.  
  ⚠️ **Salvageable (Charitable):** The phrase "Goodman's claim is in effect that the perfect forgery is impossible" slightly overstates Goodman's *aesthetic* point (he argues perfect perceptual indistinguishability *in practice* is impossible for experts, implying a perceptual difference *exists*). However, this is a minor compression acceptable under time pressure. The core point (indistinguishability isn't stable) is captured.  

  **Paragraph 4 (Goodman Extended):**  
  ✓ **Credit:** Effectively extends Goodman's point beyond painting (violin, score, poem) demonstrating grasp of its generality.  
  ✓ **Credit:** Strong rhetorical challenge ("Anyone who denies this owes an account...").  
  ⚠️ **Salvageable (Charitable):** The claim "it is an aesthetic one" (difference) needs grounding. Goodman argues the *significance* of the difference (e.g., forgery vs. original) affects aesthetic *experience*, not that the *detectable difference itself* is necessarily aesthetic. The candidate implies this connection well enough for a timed essay.  

  **Paragraph 5 (Achievement Response):**  
  ✓ **Credit:** Clearly articulates the "achievement" argument (different problems, lesser achievement).  
  ✓ **Credit:** Strong use of the van Meegeren example to link achievement to *changed experience*.  
  ✗ **Incorrect (Philosophical Mistake):** "so the aesthetic value of the object changed, so aesthetic value cannot be a matter of the perceptible surface alone." This conflates a *change in the audience's psychological response* upon learning the provenance with a *change in the aesthetic properties inherent in the object*. The thesis concerns the latter. The argument here risks psychologism. **(Correction:** The experience changed, but this doesn't *necessarily* prove the object's aesthetic properties changed; it might show the *interpretive context* changed.)  

  **Paragraph 6 (Critique of Achievement Response):**  
  ✓ **Strong credit:** Excellent self-critique. Correctly identifies the Achilles' heel: the achievement argument shifts focus from aesthetic value (perceptible) to artistic value (achievement/history).  
  ✓ **Credit:** Precise diagnosis: the response risks being "trivial or beside the point" regarding the specific *aesthetic* harm thesis. Shows high-level meta-cognition.  

  **Paragraph 7 (Critique of Goodman):**  
  ✓ **Strong credit:** Brilliant critique. Correctly identifies Goodman's limitation: he establishes difference (and difference in *experience*), but not necessarily aesthetic *inferiority*.  
  ✓ **Credit:** Directly addresses the question's demand ("inferiority or only difference").  
  ✓ **Credit:** "Difference is not inferiority" is a crucial and well-made point.  

  **Paragraph 8 (Conclusion):**  
  ✓ **Credit:** Clear, decisive conclusion rejecting the thesis.  
  ✗ **Incorrect (Philosophical Mistake):** "provenance is aesthetically relevant." While provenance *affects experience* and *artistic value*, the candidate hasn't successfully argued it constitutes an *aesthetic property* of the object itself. Paragraph 5's psychologism resurfaces here.  
  ✗ **Incorrect (Philosophical Mistake/Contradiction):** "the aesthetic value of a work includes the value of the achievement it embodies." This directly contradicts the crucial limitation the candidate *themselves* identified in Paragraph 6. They argued the achievement response changes the subject away from aesthetic value. Now they assert achievement *is part of* aesthetic value without resolving that tension.  
  ⚠️ **Salvageable (Charitable - Barely):** The pastiche analogy *could* hint at a defence (pastiche might be perceptibly "flawed" in lacking genuine originality *as an aesthetic feature*), but it's undeveloped and clashes with the "perceptually indistinguishable" premise. Under time pressure, this is too weak to rescue the core contradiction.  
  ⚡ **Internal Contradiction (Major):** Paragraph 8 asserts achievement is part of aesthetic value, directly contradicting Paragraph 6's argument that focusing on achievement shifts away from aesthetic value proper. These paragraphs cannot coherently stand together.  

  ---

  ## Summary Assessment

  *   **Strengths (Credit):** Exceptional structure, directly addresses all parts of the question. Superb grasp of the core argument (P1, P2), Goodman's position (P3, P4), and its limitations (P7). Outstanding self-critique of the achievement argument (P6). Writing is clear, concise, and philosophically engaged throughout. Demonstrates high competence.
  *   **Weaknesses (Flaws):** Two significant philosophical errors: 1) Conflating changed psychological response with changed aesthetic properties (P5, P8). 2) A major internal contradiction: asserting achievement is part of aesthetic value (P8) after effectively arguing it falls outside it (P6). This contradiction undermines the conclusion.
  *   **Loose Prose vs. Philosophical Mistake:** The issues in P5/P8 are genuine philosophical mistakes (psychologism, unresolved contradiction), not just loose wording. The compression of Goodman in P3 is loose prose, salvageable via charity.
  *   **Omissions:** While the responses are well-chosen and critiqued, a top-tier answer might briefly acknowledge other potential responses (e.g., Dutton on "intentional history," or a direct attack on supervenience). However, covering Goodman and achievement is sufficient under time constraints. The major omission is *resolving* the tension they identified.
  *   **Path to First Class (70+):** To move up, the candidate needed to either:
      *   **Defend the Integration:** Explicitly argue *why* the value of the achievement should be considered part of *aesthetic* value (e.g., by arguing originality or expressive achievement *is* a perceptible aesthetic property for a suitably informed viewer, challenging the "perceptible surface alone" notion more robustly). *Or*
      *   **Consistent Alternative:** Stick to the P6 critique and offer a *different* argument for aesthetic inferiority that genuinely targets the perceptible object (e.g., arguing supervenience is false, or that the forgery lacks the *expressive* properties linked to Vermeer's intention, *if* those are argued to be perceptible). Resolving the P6/P8 contradiction is essential.

  ## Final Justification for Mark
  This is an exceptionally competent answer demonstrating deep engagement and high-level critical thinking (Upper Second hallmark). Its structure is first-class, and it contains passages of genuine insight (especially P6 and P7). However, the significant unresolved internal contradiction (P6 vs. P8) and the related psychologism error (P5/P8) constitute the "substantive flaw" characteristic of the Upper Second band (60-69). The fluency and sophistication prevent it from being a mid-2:1, but the philosophical inconsistency at the core of its argument prevents it from reaching First Class. **68** acknowledges the high level of competence while penalising the critical flaw appropriately. The feedback should focus on resolving the contradiction and clarifying the distinction between changed experience and changed aesthetic properties.
