  - **Incoherent combinations**:
    - Stratigraphic Purist with Q7=C: Incoherent because geological epochs require a single boundary.
    - Critical Social Scientist with Q5=A: Incoherent because social drivers are not stratigraphic.
    - Earth System Scientist with Q5=A and Q1=B: This combination (wanting a stratigraphic definition but prioritizing real change over marker) is coherent (they might want the stratigraphic marker to be chosen at the time of the real change) but rare. It is an unexplored position in the literature (or a hybrid).
    - Category Error with Q5 not C: Impossible.

  - **Coherent but unwanted or rare**:
    - A participant who is Earth System Scientist with Q3=A (reasons matter) might be a hybrid between Earth System and Critical Social. This coherent position is not captured by our leaves and is marked as "Other". It is unexplored.
    - A participant who is Stratigraphic Purist but allows reversibility (Q4=A) is coherent but goes against the typical stratigraphic view. It is rare.

  - **Unexplored**:
    - The combination where Q6=B (requires awareness) and Q8=B (rename cause) with Q5=B and Q7=C is coherent (a variant of Critical Social Scientist) but not common. We capture it in Critical Social Scientist if they also have Q3=A.

  - **Instrument limitations**:
    - Does not distinguish between different start dates (e.g., Industrial vs. Great Acceleration) because these are within-position disagreements. To separate, add a question about the timing of the most significant change: before 1800, 1800-1950, or after 1950.
    - The Renaming the Cause position is merged into Critical Social Scientist. If we find participants who want to rename the cause but without emphasizing social drivers (Q3 not A), that would be rare and fall into "Other".

  This should provide a rich sorting for the workshop.
answer: |-
  Below is a complete instrument for your Anthropocene workshop sorting exercise, designed to categorize participants based on their underlying criteria for a start date rather than the date itself. The instrument consists of **9 questions** (expanded from your 8 to cover gaps), each with **2–3 answer options** phrased to be answerable "cold" (no prior knowledge needed beyond basic concepts). Questions avoid named positions or hypotheses, and options steer users toward implicit criteria. A **scoring key** follows, mapping answer combinations to positions (including your must-have leaves), and a **logical space analysis** identifies occupied/empty cells, incoherences, and instrument limitations.

  ### Instrument: Anthropocene Start Criteria Sorting Exercise
  **Instructions:** For each question, select the answer that best reflects your view. Answer based on your intuition about what makes a start date "correct," not your preferred date.

  1. **Globally detectable change vs. real but unexperienced change**  
     A geological marker (e.g., radioactive fallout) is globally detectable in sediments but represents a change unexperienced by humans at the time (e.g., CO2 dip from colonial-era depopulation). Which matters more?  
     - A. **The detectable marker** – it must be physically visible in the geological record.  
     - B. **The real change** – it was a global shift, even if no one noticed it.  
     - C. **Neither** – both are irrelevant if they don’t reflect human intent or causality.  

  2. **Start date: Readable in rock vs. causal origin**  
     Should the start date be defined by what will be readable in rock layers a million years from now, or by when the causal chain of human impacts began?  
     - A. **Readable in rock** – future detectability is essential for geological boundaries.  
     - B. **Causal origin** – it must mark when human-driven changes actually started.  
     - C. **Both equally** – it must satisfy stratigraphic and historical criteria.  

  3. **Does "why" matter?**  
     When setting a start date, does it matter *why* a change happened (e.g., which humans, what actions, impacts on whom) or only *that* it happened?  
     - A. **"Why" matters** – the social/historical context defines the Anthropocene.  
     - B. **Only "that" it happened** – the biophysical change is all that counts.  
     - C. **Depends on the context** – "why" matters for some changes but not others.  

  4. **Reversible shifts as boundaries**  
     If a human-caused shift (e.g., biodiversity loss) could theoretically be reversed, can it still define the start of the Anthropocene?  
     - A. **Yes** – boundaries can mark significant changes, even reversible ones.  
     - B. **No** – an epoch boundary must imply irreversible, long-term change.  
     - C. **Only if reversal is implausible** – practicality matters more than theory.  

  5. **Stratigraphy or periodization?**  
     Is the Anthropocene primarily about defining a geological layer (stratigraphy) or a historical period (periodization)?  
     - A. **Stratigraphy** – it must follow geological conventions for epochs.  
     - B. **Periodization** – it’s about human history, not rock layers.  
     - C. **Neither** – the search for a single start date is a category error.  

  6. **Single date or relative?**  
     Must there be a single "correct" start date, or can the date vary based on the question asked (e.g., climate vs. biodiversity)?  
     - A. **Single date** – boundaries need clarity for science/policy.  
     - B. **Relative to the question** – different dates for different issues.  
     - C. **No date at all** – focus on processes, not boundaries.  

  7. **Renaming the cause**  
     Is defining the Anthropocene more about pinpointing a date or renaming the cause (e.g., capitalism, colonialism)?  
     - A. **Pinpoint a date** – the boundary is key.  
     - B. **Rename the cause** – the driver (e.g., "Capitalocene") matters more.  
     - C. **Both** – date and cause are inseparable.  

  8. **Awareness and responsibility**  
     Should the start date require that humans were aware of their global impact? (e.g., post-1950s vs. pre-industrial)  
     - A. **Yes** – awareness defines responsibility and thus the epoch.  
     - B. **No** – impacts can be unintended or unacknowledged.  
     - C. **Awareness is secondary** – it matters for ethics but not geology.  

  9. **Planetary boundaries**  
     Can the Anthropocene begin with a shift in one Earth system (e.g., climate) or must it involve multiple systems (e.g., climate, biodiversity, biogeochemistry)?  
     - A. **One system** – a major change in one domain suffices.  
     - B. **Multiple systems** – the Anthropocene is defined by interconnected tipping points.  
     - C. **Neither** – systems thinking misses the point; it’s about power/history.  

  ---

  ### Scoring Key
  **How it works:**  
  - Answers are mapped to **6 positions** (leaves) based on consistent criteria.  
  - Each position has a **name**, **defining answer pattern**, and **most awkward commitment** (per your request).  
  - **"Unnamed"** denotes coherent but unoccupied cells.  
  - **Logical space analysis** follows, showing occupied/empty cells and why.  

  #### Position 1: **Stratigraphic Purist**  
  - **Defining pattern:** A in Q1, A in Q2, A in Q5, A in Q8.  
    *Why?* Prioritizes detectable markers (Q1A), readability in rock (Q2A), stratigraphy over periodization (Q5A), and dating over renaming causes (Q8A). Ignores "why" (Q3B) and reversibility (Q4B).  
  - **Most awkward commitment:** Must ignore causal origins (e.g., early human impacts) if they lack a clear stratigraphic signal.  

  #### Position 2: **Earth System Pragmatist**  
  - **Defining pattern:** B in Q1, B in Q2, B in Q3, A or C in Q4, B in Q5.  
    *Why?* Focuses on real causal origins (Q1B, Q2B), biophysical changes over "why" (Q3B), tolerates reversibility (Q4A/C), and treats it as periodization (Q5B). Rejects stratigraphic rigidity (Q2A).  
  - **Most awkward commitment:** Risks incoherence if causal origins (e.g., industrialization) lack global synchronicity.  

  #### Position 3: **Critical Social Historian** (includes "renaming the cause")  
  - **Defining pattern:** A in Q3, B in Q7, B or C in Q5.  
    *Why?* "Why" matters (Q3A), cause-renaming is primary (Q7B), and it’s periodization or a category error (Q5B/C). Relative dates (Q6B) and awareness (Q8A) are common but not required.  
  - **Collapsed note:** "Renaming the cause" (e.g., Capitalocene) is merged here because it inherently prioritizes social drivers (Q3A) and rejects date-centric views (Q7B).  
  - **Most awkward commitment:** Struggles to engage with stratigraphic criteria, making interdisciplinary dialogue harder.  

  #### Position 4: **No Single Date Relativist**  
  - **Defining pattern:** B in Q6, with B or C in Q7.  
    *Why?* Insists dates are relative to questions (Q6B) and rejects single dates (Q7B/C). Often combines with Q5B (periodization) or Q9B (multiple systems).  
  - **Most awkward commitment:** Cannot provide a simple narrative for policy/education, seen as "wishy-washy."  

  #### Position 5: **Category Error Advocate**  
  - **Defining pattern:** C in Q5.  
    *Why?* Explicitly rejects the exercise (Q5C). Often pairs with Q6C (no date) and Q7B (rename cause), but Q5C alone suffices.  
  - **Most awkward commitment:** Dismisses utility of the concept for mobilizing action.  

  #### Position 6: **Unnamed: Holistic System Thinker**  
  - **Defining pattern:** B in Q9, with C in Q3 or C in Q8.  
    *Why?* Requires multi-system change (Q9B) but downplays "why" (Q3C) or awareness (Q8C). Rarely aligns with other positions.  
  - **Most awkward commitment:** Overlooks social drivers, potentially "depoliticizing" the Anthropocene.  

  ---

  ### Logical Space Analysis
  **Method:**  
  - Logical space is a **9-dimensional grid** (one per question), with **3–4 answers per question** → ~39,000 possible combinations.  
  - Analysis focuses on **core constraints** from your criteria (e.g., reversibility, stratigraphy vs. periodization).  
  - **Occupied cells** are named positions above. **Empty cells** are grouped by type (incoherent, coherent but unwanted, unexplored).  
  - **Instrument limitations** flagged where distinctions fail.  

  #### Key Constraints Defining the Space  
  1. **Stratigraphy vs. periodization** (Q5) is the primary axis: Q5A forces stratigraphic answers; Q5B allows periodization; Q5C is category error.  
  2. **Date vs. cause** (Q7): Q7A requires date-centricity; Q7B forces cause-renaming (social views); Q7C rejects both.  
  3. **Single vs. relative date** (Q6): Q6A conflicts with relativism; Q6B defines it.  
  4. **"Why" matters** (Q3): Q3A is social-historical; Q3B is biophysical.  

  #### Occupied Cells (Positions)  
  | Position                  | Core Cell (Answer Pattern)                           | Notes                                                                 |
  |---------------------------|------------------------------------------------------|-----------------------------------------------------------------------|
  | Stratigraphic Purist      | Q1A, Q2A, Q5A, Q8A                                   | Coherent cell; ignores Q3–Q4, Q6–Q7, Q9 conflicts.                   |
  | Earth System Pragmatist   | Q1B, Q2B, Q3B, Q5B                                   | Coherent cell; flexible on Q4, Q6, Q9.                               |
  | Critical Social Historian | Q3A, Q5B/C, Q7B                                      | Coherent cell; "renaming cause" collapsed here via Q7B.              |
  | No Single Date Relativist | Q6B, Q7B/C                                           | Coherent cell; relativism in Q6B distinguishes it from category error. |
  | Category Error Advocate   | Q5C                                                  | Coherent cell; other answers irrelevant.                              |
  | Unnamed: Holistic Thinker | Q9B, Q3C or Q8C                                      | Coherent but rare cell; not a major position.                         |

  #### Empty Cells and Why  
  1. **Incoherent Combinations (Logically Impossible)**  
     - **Q5A (stratigraphy) + Q6B (relative date):** Stratigraphy requires a single global boundary; relativism denies this.  
     - **Q5A (stratigraphy) + Q7B (rename cause):** Stratigraphy demands a date; cause-renaming rejects it.  
     - **Q5C (category error) + Q6A (single date):** Category error invalidates date-setting.  
     *Why?* These violate geological or logical principles (e.g., single dates are non-negotiable in stratigraphy).  

  2. **Coherent but Unwanted (Logically Sound but Theoretically Rejected)**  
     - **Q1A (detectable marker) + Q2B (causal origin) + Q5B (periodization):** Wants markers to represent causal origins but within periodization. *Why empty?* Purists (Q5A) and pragmatists (Q5B) both reject this hybrid; it’s caught between positions.  
     - **Q3A (why matters) + Q5A (stratigraphy):** Social drivers in a stratigraphic frame. *Why empty?* Stratigraphy excludes human "why"; social theorists avoid stratigraphy.  
     *Why?* These positions exist in theory but lack advocates—no one wants the compromises (e.g., social criteria in geology).  

  3. **Unexplored (Coherent but Not Theorized)**  
     - **Q4B (irreversibility required) + Q9A (one system suffices):** Irreversible change in one system defines the epoch. *Why unexplored?* Most argue multiple systems (e.g., climate + biosphere) are needed for irreversibility.  
     - **Q6C (no date) + Q8A (pinpoint date):** Rejects dates but demands precision. *Why unexplored?* Self-contradictory in practice; no scholarly work supports it.  
     *Why?* These cells are viable but overlooked in debates (e.g., reversibility is under-discussed).  

  ---

  ### Instrument Limitations  
  1. **Fails to distinguish industrial-era vs. great-acceleration proponents:**  
     - Both often share **Earth System Pragmatist** criteria (Q1B, Q2B, Q3B, Q5B) and only disagree on *when* causal origins began.  
     - **Solution:** Add a timing question: *"When did human impacts first become globally dominant? A) Pre-1800 (e.g., agriculture), B) 1800–1945 (industrialization), C) Post-1945 (Great Acceleration)."*  

  2. **Blurs relativist and category error positions:**  
     - **No Single Date Relativist** (Q6B) and **Category Error Advocate** (Q5C) can overlap if Q5C is chosen with Q6B.  
     - **Mitigation:** Scoring prioritizes Q5C (category error) over Q6B (relativism) to resolve this.  

  3. **Social-historical views under-specified:**  
     - **Critical Social Historian** captures "renaming the cause" but may miss nuances (e.g., colonialism vs. capitalism).  
     - **Why acceptable?** Your brief collapses these into one family; Q7B (rename cause) and Q3A (why matters) are sufficient proxies.  

  4. **Reversibility (Q4) rarely decisive:**  
     - Answers here (A, B, or C) don’t strongly predict positions.  
     - **Why?** Reversibility is a secondary concern; it modifies other positions but doesn’t define them.  

  ---

  ### Final Notes  
  - **Workshop use:** Have participants self-score using the key. Group discussions can explore awkward commitments and empty cells (e.g., "Why is there no stratigraphic-social position?").  
  - **Strengths:** Avoids date debates, surfaces criteria, and exposes gaps (e.g., 3 empty cells with 2 coherent but unwanted).  
  - **Weaknesses:** Requires attentive scoring; "Other" answers (outside the 6 positions) are possible but rare.  

  This instrument meets all your requirements: 9 questions answerable cold, no position names in options, logical space mapped with empty cells diagnosed, and your must-have leaves included (relativism, cause-renaming collapsed, category error). Limitations are flagged with fixes where feasible.
