prompt: |-
  I'm writing the framework chapter of a thesis on which social kinds are constructed, and before comparing any accounts I want the specification they will be measured against. Give me the requirements list: what a theory of the social construction of a kind has to deliver to count as adequate — the phenomena it must explain, the cases it must get right, the distinctions it must not collapse (among them, a concept's being socially produced versus the thing's being socially produced, a kind's being constructed versus its being merely conventional, and a kind's having no reality independent of our classifications versus its having a reality sustained by them), and the findings from history, epidemiology, or economics it must not contradict — with the motivating case or consideration behind each item. Mark which requirements are non-negotiable and which are the partisan commitments of one camp, and flag any subset that cannot be jointly satisfied: if the list turns out to be an impossibility result, that is the main thing I need to know. Say also which single requirement does the most work in excluding candidates.

  Two stipulated kinds, invented so that nothing depends on your recall of actual examples. Chronofatigue: first named in diagnostic manuals a decade ago; prevalence estimates vary tenfold across countries with comparable healthcare; those diagnosed reorganise their work, sleep, and self-description in ways that make the diagnosis fit better over time; retrospective biomarker studies suggest the physiological profile was detectable decades before the label existed. Prime frontage: a stretch of shops counted as prime only because those who set rents and those who pay them expect everyone else to count it so; no marker distinguishes it that is not itself a function of that expectation; when enough actors withdraw the expectation the status is gone within two years and the buildings are unchanged; while it holds, it settles which businesses can survive there and therefore who the street is for. Which of your requirements separates these two? Which would, if left unqualified, rule out calling chronofatigue constructed at all? Is there any requirement that both violate — which would mean construction claims are two unrelated jobs wearing one phrase?

  Finish with two or three sentences each on how three familiar postures fare against the list: a realist constructionism on which constructed kinds are wholly real and causally potent; an error-theoretic view on which calling a kind constructed is a polite way of saying no such kind exists; and a view that relocates construction from the world to our concepts of it.
reasoning: |-
  Hmm, the user is writing a thesis chapter on social construction and needs a rigorous framework to evaluate theories. They've provided two invented case studies (chronofatigue and prime frontage) and want to know which requirements distinguish them. They also want to identify potential contradictions in construction theory requirements and how major philosophical positions handle them.

  The core challenge here is balancing several tensions in social construction theory. The user needs clear criteria to assess whether a kind is socially constructed versus merely conventional or biologically real. The two case studies perfectly illustrate the gray areas: chronofatigue shows diagnostic labeling affecting behavior despite biological precursors, while prime frontage is pure self-fulfilling expectation.

  For the requirements list, I consider several key dimensions. First, explanatory obligations: any theory must account for how construction actually works in practice, like the feedback loops in both cases. Second, critical distinctions: especially between concepts being socially produced (how we think about things) versus things themselves being produced (like prime frontage's economic reality). Third, empirical constraints: theories shouldn't contradict what we know from history or epidemiology.

  The chronofatigue case is particularly tricky—it violates the "no pre-construction reality" requirement because biomarkers predate the label, but satisfies "diagnosis reshapes reality" through behavioral changes. Prime frontage is a clearer case of full construction since it collapses without collective belief.

  There's a fundamental tension between the requirement that constructed kinds be causally potent (like prime frontage determining rent prices) and the requirement that they depend entirely on our classifications. If they're causally potent, doesn't that imply some independent reality? But if they depend entirely on us, how can they constrain us? This may be an impossibility result.

  Among philosophical positions, realist constructionism handles prime frontage well but struggles with chronofatigue's biological basis. Error theory oversimplifies by denying reality to constructed kinds. Conceptualist views avoid ontological commitments but fail to explain how construction actually changes material realities.

  The requirement doing the heaviest lifting is distinguishing causal dependence (prime frontage) from causal interaction (chronofatigue). This separates the two cases and exposes the core challenge: if construction requires complete ontological dependence, few cases qualify; if it only requires social shaping, even biological kinds might count.
answer: |-
  Here’s a requirements list for a theory of the social construction of kinds, designed as a litmus test for competing accounts. Requirements marked **★** are non-negotiable for any minimally adequate theory; others reflect key theoretical tensions. The final section addresses your cases and evaluates three major approaches.

  ---

  ### **Requirements for an Adequate Theory of Socially Constructed Kinds**

  1.  **★ Explain the Mechanism of Construction:**  
      *Must detail how collective practices, beliefs, or institutions bring the kind into being or sustain it.*  
      **Motivation:** Without this, "construction" is merely metaphorical (e.g., prime frontage exists *only* via renters' expectations; chronofatigue diagnosis reshapes behavior).

  2.  **★ Distinguish Concept-Production from Thing-Production:**  
      *Must separate "our concept of X is socially produced" from "X itself is socially produced".*  
      **Motivation:** Critical for cases like chronofatigue (pre-label biomarkers exist → concept socially produced, *thing* may be biological) vs. prime frontage (no independent basis → *thing* is socially produced).

  3.  **Resist the "Merely Conventional" Collapse:**  
      *Must show why constructed kinds aren’t just arbitrary labels but have causal power or normative force.*  
      **Motivation:** Prime frontage isn’t "merely" a label—it determines rents, viability of businesses, and urban segregation. Chronofatigue reshapes lives beyond diagnostic convention.

  4.  **★ Account for Stability and Change:**  
      *Must explain how constructed kinds persist across individuals/generations AND how they dissolve or transform.*  
      **Motivation:** Prime frontage collapses when expectations shift; chronofatigate persists via institutional reinforcement (clinics, support groups).

  5.  **Explain Causal Potency:**  
      *Must demonstrate how constructed kinds exert real causal effects in the world.*  
      **Motivation:** Prime frontage causes economic outcomes; chronofatigue alters physiology via behavioral feedback loops.

  6.  **★ Avoid Epistemic/Ontological Conflation:**  
      *Must not equate "we cannot know X independent of social categories" with "X has no existence independent of social categories".*  
      **Motivation:** Chronofatigue biomarkers existed pre-label (ontologically independent) but were epistemically inaccessible without the concept. Prime frontage has no ontology without collective belief.

  7.  **Handle Pre-Construction Reality (or Lack Thereof):**  
      *Must accommodate cases where a kind has pre-construction markers (e.g., biomarkers) vs. cases with no pre-construction trace.*  
      **Motivation:** Chronofatigue has retrospective biomarkers; prime frontage has no physical correlate independent of expectations.

  8.  **Comply with Empirical Constraints:**  
      *Must not contradict robust findings (e.g., epidemiology showing disease biomarkers predating labels; economics showing self-fulfilling market expectations).*  
      **Motivation:** A theory denying biomarker reality for chronofatigue fails; one denying expectation-driven markets for prime frontage fails.

  9.  **★ Explain Reflexivity:**  
      *Must account for how labeling a kind alters the very phenomena it describes (e.g., diagnosis changing patient behavior).*  
      **Motivation:** Chronofatigue patients adapt to the diagnosis; prime frontage expectations directly create economic value.

  10. **Avoid Universal Constructionism:**  
      *Must not imply *all* kinds are socially constructed, preserving space for brute physical/biological kinds.*  
      **Motivation:** Without this, "construction" loses explanatory power. A theory must explain why prime frontage is constructed but "water" is not.

  ---

  ### **Tensions and Impossibility Results**
  - **Key Tension:** Requirements (2) and (7) vs. (5) and (9). If a kind *must* have no pre-construction reality (strict ontological dependence) to be "constructed", it cannot also have *causal potency* in a way that reshapes independent reality (e.g., chronofatigue’s biomarkers). **This risks an impossibility:** Truly ontologically dependent kinds (like prime frontage) are causally potent only via collective belief, while kinds with pre-existing features (like chronofatigue) exert causality partly *independent* of construction.  
  - **Most Exclusionary Requirement:** **(2) Concept vs. Thing Production.** It forces theories to specify *what* is constructed: concepts, referents, or both. Most candidates fail by conflating these.

  ---

  ### **Your Cases & Requirements**
  - **What Separates Them?** Requirement **(2) (Concept vs. Thing Production)** and **(7) (Pre-Construction Reality)**.  
    - *Prime frontage*: Thing is constructed (no independent markers; status dissolves with belief).  
    - *Chronofatigue*: Concept is constructed (label reshapes behavior), but *thing* (physiological profile) has pre-construction reality.  
  - **Which Requirement Rules Out Chronofatigue as "Constructed"?**  
    A strict reading of **(7) (No Pre-Construction Reality)** would deny chronofatigue is constructed *as a kind*, as biomarkers predate the label. Only its *diagnostic category* is constructed.  
  - **Requirement Both Violate?** None. They exemplify distinct phenomena: chronofatigue shows **concept-driven interaction** with reality; prime frontage shows **pure ontological dependence**. This suggests "social construction" may cover two jobs: (A) *conceptual scaffolding* shaping engagement with pre-existing things, and (B) *collective creation* of things with no prior existence.

  ---

  ### **Evaluation of Three Familiar Postures**
  1. **Realist Constructionism (e.g., Searle, Hacking):**  
     *"Constructed kinds are real and causally potent."*  
     **✓** Excels at prime frontage (status functions are real) and causal potency (5)/(9). **✗** Struggles with (2)/(7): Cannot explain pre-construction biomarkers in chronofatigue without diluting "construction" to mere conceptual framing. Risks stretching "real" too far.

  2. **Error-Theoretic View (e.g., early Boghossian):**  
     *"Construction claims imply the kind doesn’t exist."*  
     **✓** Cleanly addresses prime frontage (without expectations, "prime" vanishes). **✗** Fails (5)/(9): Denies causal potency of chronofatigue diagnosis. Violates (8): Contradicts epidemiology showing labels alter real outcomes. Reduces construction to eliminativism.

  3. **Conceptualist View (e.g., Kantian-inspired):**  
     *"Construction is about our concepts, not the world."*  
     **✓** Safely handles chronofatigue (concepts organize pre-existing reality). **✗** Fails prime frontage: Cannot explain how collective concepts *create* economic facts (violates 3/5). Collapses into "mere convention" (fails 3). Ignores reflexivity (9).

  ---

  ### **Conclusion**
  The hardest tension lies in reconciling **ontological dependence** (prime frontage) with **causal interaction** (chronofatigue). A successful theory must either:  
  - Split "construction" into subtypes (conceptual vs. ontological), or  
  - Reframe dependence as *sustained* by practices (e.g., chronofatigue’s reality is *stabilized* by diagnosis).  
  **Prime frontage is paradigmatic for strong construction; chronofatigue tests boundary cases.** Use Requirement (2) as your keystone discriminator.
