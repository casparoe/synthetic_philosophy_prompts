  - Move 4 (aspiration padding) is **gaming the inputs**, not the concept of KS. The KS concept requires the ideal point to be based on actual feasible payoffs (u_x = max feasible x given y ≥ d_y). Here, the mediator uses a stated (infeasible) value, so the issue is with input misreporting. If the mediator used the true ideal point (u_x=100), KS would give (50,50), no gaming.
