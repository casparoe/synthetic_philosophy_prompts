    - KS: Ideal point u = (60,100) (A max at (60,40), B max at (0,100)). Equal ratios x/60 = y/100. On frontier, y = 100 - x. Solve x/60 = (100 - x)/100 → x = 37.5, y = 62.5. **A's payoff = 37.5**.

