  - **Move 1: Moonshot buyout** (Feasible set: hull of (0,0), (100,0), (140,20), (0,100); Pareto frontier is line from (0,100) to (140,20), with y = 100 - (4/7)x for x in [0,140]).
    - Nash: Maximizes x * y = x * (100 - (4/7)x). Derivative set to zero: 100 - (8/7)x = 0 → x = 87.5, y = 100 - (4/7)(87.5) = 50. **A's payoff = 87.5**.
    - KS: Ideal point u = (140,100) (A max at (140,20), B max at (0,100)). Equal ratios x/140 = y/100. On frontier, y = 100 - (4/7)x. Solve x/140 = (100 - (4/7)x)/100 → x = 700/9 ≈ 77.778, y = 500/9 ≈ 55.556. **A's payoff ≈ 77.8**.

