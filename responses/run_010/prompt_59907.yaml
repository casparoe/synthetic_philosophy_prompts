  Grant you the challenge to Hylas: whatever he conceives, he conceives, so he can never get before his mind a sensible thing existing unconceived. Fine. But now suppose Hylas doesn't try to picture the tree in the quad at 3am. Suppose instead he conceives it purely by description — 'whatever the first person to walk into the quad at dawn will see.' No image, no idea of a tree, nothing in his head but the description and the counterfactual. Two questions, and I want you to tell me which one you're biting on before you defend it. (1) Your own account of unperceived existence is exactly this kind of counterfactual — the table is in the study unperceived because if I went back I'd see it — so what is the actual difference between Hylas's conception and yours, and if there isn't one, hasn't he just done the thing you said couldn't be done? (2) If the description really doesn't get the tree into his mind, the premise of the master argument is false; if it does, then what makes your counterfactual true at 3am when no finite mind is conceiving anything — and is 'God sustains it' an answer, or the same problem moved one floor up?
