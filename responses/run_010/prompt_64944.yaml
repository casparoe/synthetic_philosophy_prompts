  Key nuance: The carried lines. Ex: "Trajectory to seed" is physics in S1, becomes "efficient path" in S2 (design), then "habitual need" in S3 (intentional). Same words, climbing stances. 

  Final line: "A black shape lands at seven" returns after the intentional journey. Does "black shape" now imply a mindful bird, or still just matter? The tea-sipping observer holds that tension. 

  ...Writing now. Avoiding "feathers all along" literalism—keeping it in the subtext with "window" and "steam".
