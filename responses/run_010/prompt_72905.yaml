  I TA an upper-level decision theory seminar and we're spending our last three weeks on the two-envelope problem, which has managed to split my reading group into two camps that have been arguing past each other since October. I'm pretty convinced part of it is verbal and part is real, and I want the document they should have produced instead of another round of shouting. Let me set the camps up as carefully as I can, becuase I want you to work with these two positions and not invent easier ones.

  Camp A — I'll call them the dissolutionists. Their view is that there's no paradox worth the name. The switching argument (the other envelope holds either half or double, so its expected value is 1.25x) treats the observed amount as a free parameter held fixed across two counterfactual states of the world, which is just a conditioning error; and it can only deliver a positive gain for *every* possible x if you smuggle in something inadmissible, namely an improper scale-invariant prior over the amounts or a prior with infinite expectation. Hand them any proper prior over the smaller amount and the conditional calculation becomes determinate: switch for small x, keep for large x, with a crossover wherever the tail forces one, and the unconditional gain from an always-switch policy is exactly zero by symmetry. Camp B — the residualists — grant all of that algebra and say it misses the point. Their claim is that the dissolution relocates the puzzle rather than answering it: an agent actually standing there with two envelopes has to decide before she can pin down a prior over the organizer's secret generation procedure, so "just specify a proper prior" is doing all the substantive work while being presented as a solution. They add that the class of distributions under which naive switching looks favorable isn't a curiosity, it's what you reach for whenever you genuinely don't know the scale, and in those cases you can have a policy that is never beaten pointwise and yet is dominated in aggregate — which for them is a real decision-theoretic pathology, not a slip in conditioning. Their slogan is that the two-envelope problem is a St. Petersburg problem wearing a disguise, and that dissolving it by conditioning hides the only thing worth learning from it.

  To stop them from gesturing at each other I made up a variant I want both camps to make advance predictions about, so please take it seriously as the shared test case. The organizer draws a secret ceiling N ≥ 1 from some distribution D over the positive integers — D is never announced to the player and may be anything, including something heavy-tailed — puts $2^N in one envelope and $2^(N+1) in the other, randomizes which is which, and hands me one. I open mine and see x. Now the organizer offers two side deals: for a fee F she will tell me the exact value of N, and for a cheaper fee G she will tell me only one bit, namely whether x is the larger or the smaller of the two. I want the joint statement the two camps could both sign after a genuine adversarial collaboration on this setup and on the original puzzle: what they agree on (including the mathematical lemmas, and including what they think the puzzle is even *about*), the exact places they still differ phrased so each side would accept the wording for its own side, and the cruxes — the sub-questions where settling them would actually move somebody. For each crux I want a case, calculation, or thought-experiment both sides accept as bearing on it, with each side's prediction written down beforehand, including specifically what each camp says about whether the value of the N-information is finite, whether it depends on D, and which of the two fee offers has a determinate price at all. Where you judge part of their dispute to be merely verbal, say which part and what the confusion consists in — I suspect one candidate is that they don't mean the same thing by "the paradox," and another is that they disagree about what a solution to a puzzle is supposed to look like.

