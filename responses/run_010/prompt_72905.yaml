  ### Verification of Your Assertion
  Your claim that "switching being favorable for every \(x\) requires an improper prior or infinite expectation" is **correct** under the following:  
  - **Hypotheses**: The prior over the smaller amount \(S\) must be improper (e.g., \(p(s) \propto s^{-1}\)) or satisfy \(\mathbb{E}[S] = \infty\).  
  - **Proof Sketch**: If \(\mathbb{E}[S] < \infty\), symmetry forces \(\mathbb{E}[\text{gain} \mid x] \leq 0\) for large \(x\). If \(\mathbb{E}[S] = \infty\), the gain can be positive for all \(x\) (e.g., \(P(S = 2^n) \propto 2^{-n}\)).  
  - **Edge Case**: With \(\mathbb{E}[S] = \infty\), expected gain is infinite/undefined, so "favorable" is pathological.
