prompt: |-
  You are a philosopher of medicine who works on the metaphysics of health, function and normality. I sit on a clinical ethics committee that keeps reaching deadlock by trading labels — half of us say 'that's treatment', the other half say 'that's enhancement' — and I want a diagnostic instrument we can use in place of that stalemate.

  Begin with a short brainstorm, in a handful of lines, of the candidate criteria people actually invoke to draw the line: restoration of species-typical or normal functioning, improvement in welfare, the individual's own baseline rather than the species average, positional or competitive goods, authenticity and the value of giftedness, the difference between acting on a person and acting on their circumstances, plus anything else you think deserves a place. Then build the tree: six to eight leaves, every branch labelled by one of those criteria and phrased as a question a clinician could answer without knowing which leaf it leads to, every leaf carrying the name of a recognised position (normal-functioning accounts, welfarist accounts, bioconservatism grounded in authenticity or giftedness, capability-based accounts, the positional-goods objection, and any others you judge belong there), with 'unnamed' marked wherever no one defends that combination.

  Run each of these cases down the tree and report which leaf it reaches: propranolol for a violinist's performance anxiety, and separately for intrusive memories after an assault; methylphenidate for diagnosed ADHD, and separately for a healthy nurse on a run of night shifts; an SSRI four weeks into a bereavement; growth hormone for a child with idiopathic short stature; a cochlear implant for an adult who lost hearing in childhood, and separately for the infant of a congenitally deaf couple; routine childhood vaccination given to the healthy; a safe, reversible drug that dulls the guilt of someone who has behaved badly; and embryo selection by a deaf couple who want a deaf child.

  Be decisive throughout. Where a case could plausibly sit under more than one branch, place it and say why. Where two leaves your tree cannot genuinely separate, flag that explicitly rather than papering over it. Where a combination of answers is unoccupied, diagnose it: incoherent, merely unattractive, or simply unexplored. End with one sentence on each leaf's most awkward commitment. I want your settled judgement about where the tree belongs and where it strains, with reasons, not a survey of options for me to choose from. Around 1,200 words; no bibliography, reference list or footnotes.
reasoning: |-
  Hmm, the user is part of a clinical ethics committee stuck in debates about whether something is treatment or enhancement. They want a diagnostic tool to break the deadlock. I need to build a decision tree based on philosophical criteria, then apply it to specific cases.

  First, I should brainstorm the criteria people use to draw the line between treatment and enhancement. Key ones include: restoration of species-typical functioning (like Boorse's account), improvement in welfare (welfarist views), individual baseline versus species average, positional goods (where success depends on outperforming others), authenticity and giftedness (bioconservative views from thinkers like Sandel), capability approaches (like Nussbaum's), and distinctions between altering the person versus their circumstances.

  For the tree structure, I'll create 6-8 leaves representing recognized positions. Each branch will be a clear question clinicians can answer without bias. The leaves will be: Normal-Functioning Account (species-typical restoration), Welfarist Account (net benefit), Bioconservatism (authenticity/giftedness), Capability Approach (expanding capabilities), Positional-Goods Account (zero-sum advantages), and Baseline-Relative Account (individual restoration). Some combinations might be unnamed if they're incoherent or unexplored.

  Now for the cases: I'll run each one down the tree systematically. For propranolol for a violinist's anxiety - that's enhancement since it's not restoring normal function but improving performance. For propranolol after assault trauma - that's treatment because PTSD represents dysfunctional memory processing. Methylphenidate for ADHD is treatment (restores normal attention function), while for a healthy nurse it's enhancement (exceeding baseline). 

  The SSRI during bereavement is tricky - it doesn't restore function because grief is normal, but it might improve welfare. The tree puts it in an unnamed leaf, showing where the framework struggles. Growth hormone for idiopathic short stature falls under normal-functioning (if we see height as functional) or welfarist if we prioritize welfare. Cochlear implants differ based on timing: for acquired deafness it's treatment, for congenital deafness in an infant with Deaf parents, it's complicated by cultural views on authenticity.

  Routine vaccination is clearly treatment under normal-functioning (preventing dysfunction). The guilt-dulling drug is enhancement under welfarism (improves welfare without restoring function). Embryo selection for deafness is rejected by multiple frameworks due to intentional reduction of capabilities.

  Throughout, I note where the tree strains - like when welfare conflicts with authenticity, or when statistical normality feels inadequate. Each leaf has awkward commitments: welfarism might justify mood-altering drugs universally, bioconservatism risks romanticizing suffering, etc.

  The tree works best for clear dysfunction cases, struggles with grief/height where "normal" is contested, and exposes tensions in enhancement debates. I conclude by suggesting the committee use it to map disagreements rather than resolve them, focusing on underlying values.
answer: |-
  ## Diagnostic Tree for Treatment/Enhancement Stalemates

  **Brainstormed Criteria:**
  1.  **Restoration of Species-Typical Function:** Does it fix a broken part to achieve statistically common human capacities?
  2.  **Restoration of Individual Baseline:** Does it return the individual to *their own* pre-morbid functional state?
  3.  **Net Welfare Improvement:** Does it demonstrably increase overall well-being/reduce suffering?
  4.  **Addressing Harm/Pain:** Is its primary target the direct alleviation of significant suffering or harm?
  5.  **Positional/Competitive Advantage:** Does its primary benefit depend on *outperforming* others?
  6.  **Authenticity/Giftedness:** Does it preserve the individual's "given" nature or effort-based achievement?
  7.  **Capability Expansion:** Does it create new, significant opportunities for flourishing beyond typical restoration?
  8.  **Person vs. Circumstance:** Does it alter the *person* directly, or change their *environment/support*?

  **The Diagnostic Tree:**
  *(Start at the top. Answer each question based on the specific intervention and patient context.)*

  1.  **Does the intervention primarily aim to alleviate significant, direct suffering or harm (beyond mere disadvantage)?**
      *   **YES:** Go to Q2.
      *   **NO:** Go to Q3.
  2.  **Is the suffering/harm caused by a deviation from species-typical functional norms?**
      *   **YES: --> Leaf: Normal-Functioning Account**
      *   **NO: --> Leaf: Welfarist Account** (Addresses suffering regardless of dysfunction origin)
  3.  **Does the intervention primarily aim to restore the individual to their own functional baseline (pre-morbid state)?**
      *   **YES: --> Leaf: Baseline-Relative Account**
      *   **NO:** Go to Q4.
  4.  **Does the intervention primarily confer a positional advantage (benefit relies on outperforming others)?**
      *   **YES: --> Leaf: Positional-Goods Objection**
      *   **NO:** Go to Q5.
  5.  **Does the intervention primarily expand core capabilities beyond typical human ranges?**
      *   **YES: --> Leaf: Capability Approach**
      *   **NO:** Go to Q6.
  6.  **Is the intervention primarily concerned with preserving or respecting the individual's "given" nature or effort-based achievement?**
      *   **YES: --> Leaf: Bioconservatism (Authenticity/Giftedness)**
      *   **NO: --> Leaf: Unnamed** (Likely incoherent/unexplored - interventions usually aim for *some* benefit fitting previous criteria)

  **Running the Cases:**

  1.  **Propranolol for Violinist's Performance Anxiety:**
      *   Q1: YES (Alleviates anxiety/suffering) --> Q2: NO (Performance anxiety isn't a *species-typical dysfunction*; stage fright is common) --> **Leaf: Welfarist Account**. (Aims at welfare improvement, not fixing broken function).
  2.  **Propranolol for Intrusive Memories after Assault:**
      *   Q1: YES (Alleviates PTSD suffering) --> Q2: YES (PTSD involves dysfunctional memory processing/response, deviating from norms) --> **Leaf: Normal-Functioning Account**.
  3.  **Methylphenidate for Diagnosed ADHD:**
      *   Q1: YES (Alleviates suffering/distress from core symptoms) --> Q2: YES (ADHD involves deviation in neurocognitive function affecting core life activities) --> **Leaf: Normal-Functioning Account**.
  4.  **Methylphenidate for Healthy Nurse on Night Shifts:**
      *   Q1: NO (Not alleviating *inherent* suffering/harm; combating fatigue from circumstance) --> Q3: NO (Not restoring lost function; exceeding baseline) --> Q4: YES? (Potentially positional for shift work, but primary aim is maintaining function *despite* circumstance) --> *Ambiguous*. Could fit **Positional-Goods Objection** (if focus is outperforming peers) OR **Capability Approach** (if focus is sustaining capability under duress). Tree strains here; **Positional-Goods Objection** slightly stronger as fatigue management often has competitive elements in demanding jobs.
  5.  **SSRI Four Weeks into Bereavement:**
      *   Q1: YES? (Alleviates *intense* grief suffering? This is contested) --> Q2: NO (Intense grief at 4 weeks is statistically *typical*, not dysfunctional) --> *Would go to Welfarist Account*. However: Q1 "significant, direct suffering" is key. If grief is seen as *appropriate* suffering, not harm to be alleviated medically, then: Q1: NO --> Q3: NO (Not restoring baseline; altering response) --> Q4: NO (Not positional) --> Q5: NO? (Not expanding capabilities, perhaps restoring pre-grief function?) --> Q6: YES (Critics see it as disrespecting the "gifted" experience of grief) --> **Leaf: Bioconservatism**. **Tree strains significantly.** Most clinicians would see severe, disabling grief as harm (Q1 YES -> Welfarist), but bioconservatives argue against medicalizing normative suffering (Q1 NO -> Bioconservatism). **Welfarist Account** is the more common clinical path, but **Bioconservatism** captures the ethical unease.
  6.  **Growth Hormone for Child with Idiopathic Short Stature:**
      *   Q1: NO (Not alleviating direct harm/suffering *caused by the physiology itself*; addresses psychosocial distress from being short) --> Q3: NO (Not restoring lost height) --> Q4: NO (Height isn't inherently positional, though it can be) --> Q5: NO (Not expanding capabilities beyond typical human range) --> Q6: YES (Critics see it as rejecting the "gifted" stature) --> **Leaf: Bioconservatism**.
  7.  **Cochlear Implant for Adult who Lost Hearing in Childhood:**
      *   Q1: YES (Alleviates harm/suffering from acquired deafness) --> Q2: YES (Restoring lost species-typical sensory function) --> **Leaf: Normal-Functioning Account**.
  8.  **Cochlear Implant for Infant of Congenitally Deaf Couple:**
      *   *Context is crucial.* Deaf community argues this isn't alleviating inherent harm/suffering; deafness is a difference, not dysfunction. Therefore: Q1: NO (From this perspective) --> Q3: NO (No hearing baseline to restore) --> Q4: NO (Not primarily positional) --> Q5: YES? (Creates auditory capability) --> **Leaf: Capability Approach** (Proponent view: expands capabilities). OR Q6: YES (Deaf community: implants disrespect the "gifted" Deaf identity/authenticity) --> **Leaf: Bioconservatism**. **Tree cannot genuinely separate Capability Approach and Bioconservatism here;** it maps the core disagreement about whether congenital deafness constitutes harm/dysfunction (Q1) or difference/identity (Q6). **Bioconservatism** captures the parental/community objection more directly.
  9.  **Routine Childhood Vaccination:**
      *   Q1: YES (Prevents significant harm/suffering from disease) --> Q2: YES (Prevents deviation from health/functional norms caused by pathogens) --> **Leaf: Normal-Functioning Account**.
  10. **Safe, Reversible Drug Dulling Guilt of Someone Who Behaved Badly:**
      *   Q1: YES? (Alleviates guilt-induced suffering) --> Q2: NO (Guilt, even excessive, isn't a species-typical *dysfunction*; it's a normative emotional response) --> **Leaf: Welfarist Account**. (Pure welfare gain, detached from function or authenticity). *This highlights the awkwardness of pure welfarism.*
  11. **Embryo Selection by Deaf Couple for a Deaf Child:**
      *   Q1: NO (Intent is not to alleviate harm/suffering; arguably introduces it or chooses it) --> Q3: NO (No baseline to restore) --> Q4: NO (Not positional) --> Q5: NO? (Does not expand capabilities; arguably restricts auditory capability) --> Q6: YES? (Parents see it as affirming Deaf identity/authenticity). However, Q5 is key: it *reduces* a typical capability. This combination (Q5 NO - reducing capability, Q6 YES - authenticity) is **Unnamed: Diagnosed as Incoherent/Unattractive**. Most ethical frameworks reject *intentionally* creating a child with reduced capabilities compared to the species norm for non-medical reasons, even if framed as identity/authenticity. The tree flags this as an untenable combination.

  **Leaf Commitments & Strains:**

  *   **Normal-Functioning Account:** Most awkward commitment: Defining "species-typical function" is contestable (e.g., height, grief duration, cognitive variations). Strains when "normal" feels inadequate (severe but "typical" suffering) or excludes conditions like congenital deafness viewed as identities.
  *   **Welfarist Account:** Most awkward commitment: Can justify nearly *any* intervention if net welfare increases (e.g., guilt-dulling drug, mood brighteners for mild discontent), potentially eroding important boundaries and values like authenticity or effort.
  *   **Baseline-Relative Account:** Most awkward commitment: Provides no guidance for congenital conditions or interventions for people who have *always* been below "normal" function but want improvement beyond their baseline.
  *   **Positional-Goods Objection:** Most awkward commitment: Risks labeling *any* improvement that confers advantage as suspect, potentially stifling beneficial innovations and ignoring legitimate desires for competitive edge within social structures.
  *   **Capability Approach:** Most awkward commitment: Defining the "core" capabilities list is inherently normative and contestable. When does expansion become problematic enhancement? Strains with interventions reducing capabilities for identity reasons.
  *   **Bioconservatism (Authenticity/Giftedness):** Most awkward commitment: Can romanticize suffering or limitation ("giftedness" of disease), potentially hindering relief for genuine suffering deemed "authentic" (e.g., grief, Deaf identity) and struggles to define the "given" self.
  *   **Unnamed (e.g., Q5 NO / Q6 YES for Embryo Selection):** Diagnosed as **Incoherent/Unattractive**: Intentionally creating reduced capabilities conflicts fundamentally with the goals of medicine and most moral frameworks valuing opportunity and flourishing. It represents a value clash the tree exposes as unstable.

  **Settled Judgment:**
  This tree effectively diagnoses the *source* of deadlock by forcing explicit engagement with the underlying criterion (welfare, function, capability, authenticity, etc.) invoked in labeling something "treatment" or "enhancement." It works best for clear cases of dysfunction restoration (PTSD, acquired deafness) or uncontested welfare harms. It strains significantly at the contested boundaries: where "suffering" is normative (grief), "normal function" is ambiguous or rejected as the goal (congenital deafness, short stature), welfare gains seem detached from health or authenticity (guilt suppression), or capabilities are intentionally reduced (deaf embryo selection). The tree doesn't resolve these deep value conflicts but makes them explicit and mappable. Its key strength is exposing that "treatment vs. enhancement" is not a single binary but a cluster of distinct ethical questions. The committee should use it to pinpoint *which* criterion is causing disagreement ("We disagree on whether this is *really* alleviating harm (Q1) or restoring function (Q2)") rather than trading the loaded labels themselves.
