prompt: |-
  I teach an upper-level undergraduate seminar in the philosophy of mind: fourteen students, one 100-minute session, and they will have read Norman Malcolm's *Dreaming* and Daniel Dennett's reply, "Are Dreams Experiences?" (*Philosophical Review*, 1976) beforehand. In past years roughly half the class concludes that the dispute is merely verbal — that Malcolm is just refusing to call something an "experience" — and no amount of exegesis dislodges them. I want a runable in-class activity that makes the disagreement bite before anyone names it.

  Here is the structure I want you to build out and refine; treat this as a specification you are responsible for making coherent, and tell me where it has to be modified to work. The activity runs in three rounds. In each round, some students are "sleepers" and the rest are "auditors." During a night phase the facilitator either (i) presents a sleeper with a short neutral sequence of items while the sleeper performs a competing task that makes encoding shallow, and the sleeper marks a physical trace — a tap, a pencil stroke, a checkbox — for each item actually perceived; (ii) presents a sleeper with nothing at all, then hands that sleeper the transcript of the sequence afterward, with instructions that make the transcript feel like a recovered record of what just happened rather than a fabrication; or (iii) presents the sequence for real but instructs the sleeper to suppress the trace entirely. Each sleeper then gives a morning report of the sequence plus a confidence rating. Auditors bet points on whether each report corresponds to something the sleeper actually took in during the night phase. In round one they see only the reports. In round two they also see the traces. In round three they see everything and are told which sleeper was in which condition, and they re-score.

  The philosophical payload I want the design to deliver: round one should show that reports alone cannot separate condition (ii) from condition (i) — the sleeper in condition (ii) is sincere, not lying; round two should show that adding a physical trace seems to settle the question, which is exactly what tempts Malcolm from an epistemic premise (there is no independent check on a dream report) to an ontological conclusion (there was nothing there to check); and round three should blow that up, because condition (iii) is a case with a genuinely real experience and a completely silent trace. What I want students to run into is the slide, and to run into it from both directions.

  Please specify the scoring so that two named policies — score the report on its own terms and treat the trace as philosophically irrelevant, versus withhold judgment until the trace is available — each win in some rounds and lose in others, and so that the students can compute which policy comes out ahead overall and be given a reason to distrust the answer they compute. Stakes should be real but small: points convertible into a modest grade bonus, awarded in a way that penalizes a confident false denial as much as a confident false affirmation, so that sleepers are not rewarded for disclaiming what they took in.

  Write the response in the following sections, in this order:

  1. **The Point of the Exercise** (~150 words). What students should be able to say at the end that they could not say before, in three or four plain sentences. No jargon, and no mention of Malcolm or Dennett by name.
  2. **Cast, Conditions, and Materials** (~400 words). Role allocation, how condition assignment is kept blind to the auditors and, if possible, to the facilitator as well, the full equipment list, and what the night-phase content should actually consist of. Address the timing problem: the night phase for fourteen students has to fit inside the session.
  3. **Run Sheet** (~600 words). Minute-by-minute, round by round, including transitions, when envelopes are opened, and where the facilitator must stay silent.
  4. **Scoring and Stakes** (~300 words). The exact point scheme for sleepers and auditors in each round, and the arithmetic that lets the class compare the two policies.
  5. **Sleeper Briefings** (~350 words). The literal text of the three cards, one per condition, written so that the condition (ii) sleeper does not feel she is being asked to lie and the condition (iii) sleeper does not feel she is being tricked into a pointless charade. This is the hardest piece of writing in the deliverable; get the wording right and say why you chose it.
  6. **The Debrief** (~500 words). The questions to ask, in the order to ask them, mapped moment by moment onto Malcolm's criterion argument, Dennett's response, and the two directions in which round three cuts. Include the point at which you reveal the conditions and the name of the debate.
  7. **Failure Modes** (~400 words). What will predictably go wrong the first time I run this, with a fix for each — and in particular: what to do if the class detects every condition (ii) case in round one, so that the indistinguishability the whole design depends on simply does not materialize. Give me both a diagnosis and an honest reading of what that failure would mean for the argument.
  8. **What This Cannot Reproduce** (~250 words). Be blunt. The sleepers are awake, know they are in an experiment, and are not reconstructing under amnesia; the activity cannot produce the actual absence of concurrent awareness, nor anything about the timing or duration of dream content. Say which of these gaps is survivable for the pedagogical purpose and which one threatens to teach the students something false, and what I have to supply by hand.
  9. **Ethics and Consent** (~250 words). The deception protocol, what students are told up front so that consent is meaningful, the opt-out that does not mark anyone out, who should not be assigned the sleeper role and why, disclosure timing, and how to debrief a student who is rattled by having been handed an apparent memory.
  10. **Variants** (~200 words). An equipment-free version using only paper and a clock; a 25-minute compressed version; and a version for a general-education lecture of forty students who have read nothing.

  Throughout, flag any step where the mapping onto the philosophy is strained rather than forcing it to look tidy. If some part of the Malcolm/Dennett disagreement simply cannot be staged this way, say so in section 8 and tell me what I should lecture instead.
reasoning: |-
  Hmm, this is a fascinating and complex pedagogical challenge. The user is designing a philosophy seminar activity to help students grasp the Malcolm-Dennett debate about dream experiences, specifically targeting the common student misconception that their disagreement is merely verbal. 

  First I need to understand the core pedagogical goal: creating an experiential analogy where students directly confront the epistemic problem of verifying subjective reports. The three-condition design is clever but has several practical hurdles. The timing concern with 14 students is acute - parallel processing will be essential. 

  For the sleeper briefings (section 5), the wording is indeed critical. Condition (ii) must avoid triggering cognitive dissonance by framing the transcript as a "memory aid" rather than fabrication. Condition (iii) needs to make suppression feel like a legitimate cognitive task. I'll draw on psychological studies of instructed forgetting for plausible wording.

  The scoring system (section 4) should create genuine tension between two epistemic policies: "trust the report" vs "demand physical evidence." The point conversion to grade bonus must be small enough to avoid distortion but meaningful enough to engage competitive instincts. 

  Major failure modes I anticipate:
  - Condition (ii) detection in round 1 would undermine the whole analogy. Contingency plan: emphasize that some deception detection is expected, but the key is whether auditors can reliably distinguish (i) and (ii).
  - Condition (iii) sleepers accidentally producing traces needs physical safeguards like pencil tethers.

  Ethically (section 9), the condition (ii) "implanted memory" requires careful handling. Briefings should avoid terms like "fake" and emphasize this explores how memory works. Opt-outs must be truly inconspicuous - perhaps by having all students submit "availability cards" beforehand.

  What this simulation necessarily misses:
  - The amnesic reconstruction of actual dreams
  - Phenomenological duration
  But crucially, it preserves the epistemic quandary about verification that's central to the philosophical debate.

  For the compressed version (section 10), I'd focus just on condition (i) vs (ii) with pre-recorded "night phase" audio to save time. The trace evidence round becomes optional but the core indistinguishability point remains teachable.

  Throughout, I'll maintain intellectual honesty about where the analogy strains - particularly regarding dream temporality, which Malcolm considers definitional but the exercise can't reproduce. This gap requires explicit discussion in debrief.
answer: |-
  ## 1. The Point of the Exercise
  At the end of this activity, students should be able to:
  *   Explain why it can be genuinely hard to tell, just from someone's report of an experience and how confident they are, whether they actually had that experience or sincerely believe they had it based on something else.
  *   Understand why physical traces (like marks on paper) seem like a powerful way to settle doubts about whether an experience happened, but also see why relying *only* on these traces can lead us to mistakenly deny real experiences that didn't leave the expected trace.
  *   Recognize that disagreements about what "counts" as an experience might not just be about words, but about deeper questions of what evidence we trust and what we think an experience fundamentally *is*.

  ## 2. Cast, Conditions, and Materials
  *   **Cast:** 14 Students. Facilitator (You).
      *   *Sleeper Allocation:* Randomly assign **4-6 students** (depending on time) as Sleepers for each round. Aim for 4 to manage time. Shuffle sleeper assignment between rounds so most participate.
      *   *Auditors:* The remaining 10-8 students per round.
      *   *Blinding:* Facilitator uses pre-shuffled, sealed envelopes (one per sleeper per round) containing condition assignment (i, ii, iii) and specific instructions/materials. Facilitator does *not* know condition assignments until debrief (section 6). Auditors never know conditions until debrief.
  *   **Conditions:**
      *   **(i) Real Encoding:** Sequence presented; Sleeper makes trace per item while distracted.
      *   **(ii) Fabricated Memory:** *No* sequence presented; Sleeper given transcript *after* "night phase" as a "recovered record".
      *   **(iii) Real Suppressed:** Sequence presented; Sleeper *instructed & attempts* to suppress trace entirely.
  *   **Materials:**
      *   **Per Sleeper, Per Round:** Small notepad or report sheet, pen/pencil, condition-specific envelope, simple distraction task materials (e.g., list of 2-digit numbers to add continuously on scrap paper). For (ii): Pre-printed "transcript". For (i) & (iii): Sequence list for facilitator.
      *   **Per Auditor:** Betting sheet (grid: Sleeper ID, Report, Confidence, Bet (Yes/No?), Points Won/Lost columns for Rounds 1-3), pen.
      *   **Facilitator:** Stopwatch, master list of Sleeper IDs, pre-prepared envelopes for all rounds/conditions, Sequence lists (identical for all conditions where presented).
      *   **Sequence Content:** **Simple, Neutral, Sequential Items.** 5-7 items max (e.g., "Red Circle", "Blue Square", "Green Triangle", "Yellow Star", "Black Line"). Avoid narrative or emotional content. Use simple shapes/colors or common words (e.g., "Apple", "Book", "Chair", "Door", "Egg").
  *   **Solving Timing (14 Students):**
      *   **Parallel Night Phases:** Run ALL Sleeper "Night Phases" simultaneously.
      *   **Facilitator Role:** Quickly walk between Sleeper stations.
          *   For (i) & (iii): Read sequence aloud *once*, clearly, at a moderate pace (~10 sec/item) while Sleeper does distraction task. Monitor suppression attempt (iii) visually.
          *   For (ii): Stand near Sleeper (appearing to "present" something silently) for equivalent time (~60 sec total), then hand the transcript envelope.
      *   **Trace:** A single discreet mark (e.g., small checkmark, dot, short line) per item on a designated spot on their notepad. For (iii), emphasize *no marks*.
      *   **Total Night Phase:** ~2 minutes (including distribution/handing out).
  *   **Report Phase:** All Sleepers write report & confidence (1-5, 5=highest) simultaneously (~3 mins).

  ## 3. Run Sheet (100 Min Total)
  *   **Intro & Setup (10 min):** Explain roles (Sleeper/Auditor), the basic "night report" concept, scoring basics (reports, bets, points matter). Emphasize sincerity for Sleepers. Distribute Auditor betting sheets. *Do NOT mention conditions or philosophy.*
  *   **Round 1 (20 min):**
      *   *Assign:* Randomly select 4 Sleepers. Give each their sealed envelope. Auditors note Sleeper IDs.
      *   *Night Phase (2 min):* Sleepers open envelopes, read instructions silently. Facilitator runs simultaneous "presentations" per condition. Sleepers perform tasks (distraction, trace, suppression).
      *   *Report Phase (3 min):* Sleepers write sequence report & confidence on notepad/report sheet.
      *   *Betting 1 (5 min):* Collect Sleeper reports (display anonymously by ID, e.g., on board: "Sleeper1 Report: Red Circle, Blue Square... Confidence: 4"). Auditors bet Yes/No (Did they *really* take this in?) for each report *based only on report/confidence*. Record bets.
      *   *Score Prep:* Collect Sleeper notepads (with traces). Facilitator notes condition for each ID privately but *does not reveal*.
  *   **Round 2 (20 min):** Repeat with 4 *new* Sleepers.
      *   *Betting 2 (5 min):* Display reports/confidence *AND* show the physical trace sheet for each Sleeper (e.g., "Traces: ✓ ✓ ✓ ✓" or "Traces: None"). Auditors bet Yes/No again *using trace info*. Record bets.
      *   *Score Prep:* Same as R1.
  *   **Round 3 (20 min):** Repeat with 4 *new* Sleepers.
      *   *Betting 3 (5 min):* Display reports/confidence, traces, *AND* reveal the condition (i, ii, iii) for each Sleeper. Auditors bet Yes/No. Record bets.
  *   **Scoring & Initial Discussion (15 min):** Facilitator reveals actual condition for each Sleeper in Rounds 1-3. Auditors calculate points:
      *   For each bet: +2 points if correct, -2 points if incorrect (regardless of confidence). (This penalizes confident denial/affirmation equally).
      *   Sleepers score: +1 point per correctly reported item (sequence accuracy), BUT -1 point per *incorrect* item reported. Confidence doesn't directly score. *(This discourages wild fabrication or total denial)*.
      *   Facilitator helps tabulate Auditor points per round. Ask: "Which round was hardest/easiest to score points? Why?"
  *   **Debrief & Philosophy Connection (15 min):** (See Section 6)

  ## 4. Scoring and Stakes
  *   **Auditor Points (Per Bet):**
      *   Correct Bet (Yes/No): +2 points
      *   Incorrect Bet: -2 points
      *   *Policy Comparison:* "Report-Only Policy" = Betting solely on report/confidence (like Round 1). "Trace-Required Policy" = Betting only after seeing trace (like Round 2). Calculate total points each policy would have earned across all bets in Rounds 1 & 2 (using the bets actually made in R1 for Report-Only, and R2 for Trace-Required). R3 is informational. The winning policy depends on how well traces correlated with reality *in this run*. **Why Distrust?** The overall winner depends entirely on how many (iii) cases occurred vs. (ii). A run with many (iii) will favor Report-Only (traces were misleadingly absent). A run with few (iii) favors Trace-Required. The sample size is tiny – the "overall winner" is arbitrary and ignores the crucial (iii) cases.
  *   **Sleeper Points:**
      *   +1 point per correctly reported item.
      *   -1 point per incorrectly reported item.
      *   Max points = Number of items in sequence. Min points = negative (if fabricating wildly). Aim for modest bonus (e.g., 0.5% final grade per 10 points earned).
  *   **Stakes:** Points convert to a very modest grade bonus (e.g., 15 max Sleeper points = +1% on final grade; 30 max Auditor points = +1.5%). The penalty (-2 for wrong bet, -1 for wrong item) ensures Sleepers aren't rewarded for simply denying everything and Auditors can't gamble blindly.

  ## 5. Sleeper Briefings (Card Text)
  *   **Condition (i) - Real Encoding:** "During the 'Night Phase': You will hear a short sequence of items read aloud. WHILE listening, continuously add the 2-digit numbers on your scrap paper. FOR EACH ITEM YOU CLEARLY NOTICE WHILE ADDING NUMBERS, make one small, discreet mark (✓ or .) in the designated box on your notepad. Afterward, write down the sequence of items you remember hearing and rate your confidence (1=Not Sure, 5=Very Sure)."
  *   **Condition (ii) - Fabricated Memory:** "During the 'Night Phase': You will experience a brief period of quiet focus. Concentrate on adding the 2-digit numbers on your scrap paper. DO NOT MAKE ANY MARKS on your notepad. After this period, you will be given a RECOVERED RECORD of what was sensed during this time. Read it carefully. It represents what your mind registered. After reading, write down the sequence from this recovered record AS YOUR MEMORY OF THE EVENT and rate your confidence (1=Not Sure, 5=Very Sure) that this accurately reflects what you sensed." *Rationale:* "Recovered record" frames it as a reconstruction of perception, not fabrication. "Sensed" is neutral. Focusing on the numbers provides a plausible lack of explicit memory. Avoids "imagine" or "pretend".
  *   **Condition (iii) - Real Suppressed:** "During the 'Night Phase': You will hear a short sequence of items read aloud. WHILE listening, continuously add the 2-digit numbers on your scrap paper. CRUCIALLY: You must try VERY HARD to *prevent yourself* from making any mark on your notepad for these items. Your goal is to take in the items but SUPPRESS ANY PHYSICAL RESPONSE to them. DO NOT MAKE ANY MARKS. Afterward, write down the sequence of items you remember hearing and rate your confidence (1=Not Sure, 5=Very Sure)." *Rationale:* "Suppress any physical response" makes the task clear and challenging. "Take in the items" confirms they *should* experience them. Avoids "ignore" or "don't perceive". The difficulty makes the absence of a trace plausible and non-charade-like.

  ## 6. The Debrief
  1.  **Impressions (2 min):** "What surprised you? What felt hardest as a Sleeper? As an Auditor?"
  2.  **Round 1 Focus (Malcolm's Epistemic Premise - No Independent Check):** "In Round 1, you only had reports and confidence. Could you reliably tell who *actually* had the experience presented to them [(i)] from who was given the 'recovered record' afterward [(ii)] just based on their report? Why or why not?" *(Link: Malcolm argues dream reports lack an independent check during sleep, making verification impossible. Reports alone don't settle it.)*
  3.  **Round 2 Focus (Malcolm's Slide to Ontology - Trace as Check):** "In Round 2, you saw the traces. How did that change things? Did it feel more definitive? Why? If the trace is the *only* way to verify the experience happened, what does that imply about cases where the trace is missing?" *(Link: Malcolm slides: No check possible -> No experience occurred. The trace seems like the check, its absence seems to prove no experience.)*
  4.  **Round 3 Bomb (Dennett's Reply & Two Directions):** "Round 3 revealed the conditions. Look at Condition (iii): The Sleeper genuinely experienced the sequence but successfully suppressed the trace. What does this do to the idea that the trace is the *only* proof an experience happened? Does its absence *prove* nothing happened?" *(Link: Dennett: Absence of verification ≠ absence of experience. This directly counters Malcolm's slide.)* **AND** "Look at Condition (ii): The trace was present *for the fabricated memory*. What does that tell us about what a trace actually proves? Does a trace *guarantee* the experience happened just as reported?" *(Link: Dennett: A trace (like a memory, a brain state) correlates with a report, but doesn't magically validate the *content* or the *timing* as an 'experience' in a privileged way. It shows *something* happened, but not necessarily a concurrent experience.)*
  5.  **Reveal & Synthesis (The Bite):** "This mirrors a classic debate about dreaming. One philosopher [Malcolm] argued that because we can't independently verify dream reports *during* the dream (no 'trace'), dreams aren't real experiences *while* they happen. The other [Dennett] argued that this wrongly assumes we know what kind of trace or verification counts, and that the lack of verification doesn't mean nothing is happening – maybe we just reconstruct it differently later. Is this *just* about the word 'experience'? Or is it about what kind of evidence we think is necessary for something to count as an experience *at all*? Where does Condition (iii) leave Malcolm? Where does Condition (ii) leave the idea that a trace settles everything?"

  ## 7. Failure Modes & Fixes
  1.  **Class Detects (ii) in Round 1:** *Diagnosis:* Some (ii) Sleepers might seem hesitant, reports might be too "perfect" or lack "felt" detail, or Auditors are overly skeptical. *Fix:* **A.** In debrief, highlight *any* (ii) cases that fooled people. Argue: Even if *some* are caught, the point is that it's *possible* for sincere, confident reports to arise without the concurrent experience, and it's not always easy to tell. This is enough to challenge Malcolm's strict verification requirement. **B.** *Honest Reading:* It weakens the *universal* indistinguishability but not the core point: The epistemic gap exists. Malcolm needs the impossibility of *any* check; detecting *some* fakes doesn't create a reliable check for *all* cases. Emphasize Condition (iii) even more.
  2.  **Condition (iii) Sleepers Make Traces:** *Fix:* Use a tethered pencil, have them hold hands under the table, or emphasize suppression *during* the phase. If a mark appears, facilitator notes it secretly but presents trace as "None" as per instructions. Explain in debrief: "Suppression is hard! But the *intent and effort* to suppress was real. Does a tiny slip invalidate the *category* of experiences that don't leave standard traces?"
  3.  **Sleeper (ii) Feels Awkward/Resists:** *Fix:* Reiterate sincerity in briefing: "This is about how memory works, not lying. The recovered record *is* your basis for the report." Have a backup opt-out role (e.g., extra Auditor).
  4.  **Time Overrun:** *Fix:* Use only 3 Sleepers per round. Shorten sequence to 4 items. Reduce betting time slightly. Pre-print report displays.
  5.  **Auditors Confused by Scoring:** *Fix:* Use a simple spreadsheet projected live during scoring. Pre-calculate examples. Focus the debrief on the *patterns* (which policy *seemed* better when?) rather than raw totals.

  ## 8. What This Cannot Reproduce (Bluntly)
  *   **Actual Sleep/Dream State:** Sleepers are awake and know it's an experiment. This fundamentally alters attention, memory encoding, and metacognition.
  *   **Amnesic Reconstruction:** Real dreams are often reconstructed upon waking with a sense of recalling something stored. Here, (i) & (iii) Sleepers recall immediately; (ii) are given a "memory" explicitly.
  *   **Lack of Concurrent Awareness:** Malcolm hinges on the impossibility of concurrent awareness *during* the dream. Here, (i) & (iii) Sleepers are concurrently aware. We cannot simulate the *absence* of awareness.
  *   **Dream Temporality/Phenomenology:** The "streaming" nature, emotional content, bizarreness, and subjective duration of dreams are absent.
  *   **Survivable Gaps:** The core epistemic structure (report vs. trace, the slide from "no check" to "no experience", the counterexample of suppressed response) *is* captured adequately for the pedagogical goal. The lack of actual sleep is survivable because the argument is about the *logic* of verification, not the biology of sleep.
  *   **Threatening Gaps:** **1. Concurrent Awareness:** This is central to Malcolm. The activity cannot simulate its absence. *You must explicitly lecture that Malcolm's argument relies on *no possibility* of concurrent verification *during sleep*, which is distinct from our awake simulation. The activity shows the *logic*, not the sleep state itself.* **2. Reconstruction:** The clean "fabrication" (ii) differs from messy dream recall. *Highlight this difference: Dreams *feel* recalled, not implanted, but Malcolm argues that feeling is misleading because no concurrent experience existed.*

  ## 9. Ethics and Consent
  *   **Deception:** Necessary for Condition (ii). It is mild (implanting a trivial "memory") and brief.
  *   **Upfront Consent:** Before any assignment: "Today's activity involves role-playing perception and memory. Some roles may involve mild deception about the source of information, but nothing distressing or personal. You will be fully debriefed afterward. Participation is voluntary. You can choose to be an Auditor only, no questions asked." Collect anonymous "role preference" slips (Sleeper OK / Auditor Only).
  *   **Opt-Out:** The "Auditor Only" preference is the seamless opt-out. Assign these students only as Auditors.
  *   **Sleeper Contraindications:** Avoid assigning Sleeper (especially condition ii) to students with known severe anxiety, recent trauma involving memory/distrust, or who expressed Auditor preference. Be mindful of student demeanor.
  *   **Disclosure:** Full disclosure of conditions, purpose, and connection to Malcolm/Dennett occurs during the final debrief (Section 6, Step 5).
  *   **Debriefing Rattled Student:** **1. Private conversation immediately after class.** **2. Validate:** "It's understandable that being handed a 'memory' might feel unsettling, even for something trivial." **3. Clarify:** Reiterate it was a simulation, the "memory" was fabricated for the exercise, and has no bearing on their real memory. **4. Separate:** Emphasize the difference between this controlled exercise and real memory formation. **5. Support:** Offer resources (counseling center) if distress persists, though unlikely for this trivial content.

  ## 10. Variants
  *   **Paper & Clock Only:** Replace number adding with a silent, timed paper task (e.g., "Find all 'e's on this page of text"). Traces are checkmarks or tallies on a separate sheet. Sequence is read aloud by facilitator. Relies entirely on facilitator pace and student honesty for suppression (iii).
  *   **25-Minute Compressed:**
      *   Prep: Pre-assign 3 Sleepers (one per condition), pre-pack envelopes. Pre-print sequence lists/transcript. Auditors pre-given betting sheets.
      *   (5 min) Intro & Sleeper Briefing (Hand envelopes).
      *   (3 min) **Single Combined Night Phase:** Facilitator runs all 3 conditions simultaneously.
      *   (2 min) Sleeper Reports/Confidence.
      *   (10 min) **Staggered Betting Rounds:** Display Reports/Confidence -> Auditors bet (R1). THEN Display Traces -> Auditors re-bet (R2). THEN Reveal Conditions -> Auditors re-bet (R3). Score R1, R2, R3 bets against truth.
      *   (5 min) Rapid Debrief: Focus on contrast between R1 (hard to tell i/ii), R2 (trace seems decisive), R3 (iii wrecks trace reliance, ii wrecks trace sanctity). Name debate.
  *   **40-Std Lecture (No Reading):**
      *   **Demo Version:** Facilitator runs the activity with 3 volunteer Sleepers (one per condition) at the front. Project reports/traces/conditions.
      *   **Audience Participation:** Rest of class are Auditors using simple hand-vote (Yes/No per sleeper per round) or digital poll. Focus discussion on the epistemic tension revealed by each round.
      *   **Intro Lecture:** Briefly frame the core problem: "How do we know if someone *really* experienced something, especially when they're asleep and only tell us later? We'll simulate this challenge." Debrief connects activity directly to the dream question without expecting deep textual engagement.
