prompt: |-
  hey, I'm in a seminar on value learning this term and we just spent a couple weeks on inverse RL — the whole idea of recovering someone's reward function from their behavior — and I want to throw something at you to see how you handle it.

  Write me a product launch page for a fictional startup whose assistant quietly watches everything you do and then hands you your "true" reward function as a dashboard. Deadpan startup voice, around 600 words, laid out like a real page: hero blurb, a short "how it works" section, one glowing customer testimonial, and a "known limitations" section where every limitation is reframed as a feature.

  The jokes have to come from the inference problem itself, not from generic AI-is-creepy material. So work in things like: there being a huge number of rewards perfectly consistent with the same observed behavior, not being able to separate what a person wants from what they believe about the world, the fact that people procrastinate and act against thier own preferences so treating them as roughly optimal is a weird assumption to build a company on, and what it means to infer from behavior that happened inside an environment someone else designed to shape that behavior.

  The bit I care most about: by the end the page should have quietly raised whether the preferences you reveal deserve more deference than the ones you actually say out loud — without ever coming out and stating that question. No named researchers, no citations, no real products, and it should still read as a funny page to someone who's never seen the IRL stuff.
reasoning: |-
  We are creating a fictional startup launch page for a product called "TrueReward". The product observes the user's behavior and infers their "true" reward function.

   Requirements:
   - Deadpan startup voice (overly enthusiastic, buzzword-heavy, but with a straight face)
   - Sections: hero blurb, how it works, customer testimonial, known limitations (reframed as features)
   - Jokes must come from the inference problems in inverse RL:
      1. Non-uniqueness of reward functions (many rewards explain the same behavior)
      2. Cannot separate desires from beliefs
      3. People act suboptimally (procrastinate, etc.) but we assume they are optimal
      4. The environment shapes behavior, so we're inferring preferences in a biased setting
   - Quietly raise the question: do revealed preferences (from behavior) deserve more weight than stated ones? (without stating it explicitly)
   - Around 600 words, funny to someone without IRL knowledge, no real citations.

   Structure:

   1. Hero Blurb: Catchy headline and a paragraph. Something like: "Meet TrueReward: Discover Your Inner Motivations. Finally."

   2. How It Works: A short section explaining the process in a simplified, but slightly absurd way.

   3. Customer Testimonial: A glowing review that subtly highlights the absurdity (e.g., the user is surprised by the results and maybe a bit uncomfortable).

   4. Known Limitations (Reframed as Features): List 3-4 limitations and turn them into positives.

   Let's write with humor and irony, but in the style of a real startup page.

   Note: We are not being creepy about surveillance, but the observation is "quietly watching".

   Word count: around 600.
answer: |-
  ### TrueReward™ — The Mirror for Your Motivations  
  *Stop guessing what drives you. Start knowing.*  

  **Hero Blurb**  
  You’re ambitious, complex, and self-aware. Except when you’re not. TrueReward™ is the world’s first behavioral intelligence platform that observes your daily digital and physical actions—emails, calendar shuffles, doomscrolling, questionable snack choices—and reverse-engineers your *true* reward function. No surveys. No soul-searching. Just a sleek dashboard revealing the mathematical essence of **you**. Finally, alignment between what you *think* you want and what your behavior betrays.  

  ---

  ### **How It Works**  
  *Three Steps to Unmask Your Utility Function*  

  1. **Passive Omni-Observation™**  
     Our lightweight Chrome extension and IoT sensors (optional but encouraged) discretely log 10,000+ behavioral datapoints daily—how long you hesitate before deleting an email, the precise millisecond you switch from work tabs to TikTok, your cortisol-spiking avoidance of the gym.  

  2. **Inference Engine™**  
     Using proprietary neuro-inspired algorithms, we solve the inverse puzzle: "What rewards *must* you be maximizing, statistically speaking, to produce these beautifully inconsistent life choices?" Our models gracefully ignore your stated goals ("I want productivity!") and focus purely on revealed preferences.  

  3. **Personal Reward Dashboard™**  
     Voilà! Your soul, quantized. A real-time utility function graph, a top-10 "True Motivations" leaderboard (e.g., "Minimize Immediate Discomfort: 93.7%"), and actionable insights like: *"Based on 127 procrastination events, your deepest reward is optimizing for last-minute panic euphoria."*  

  ---

  ### **Customer Love**  
  *From Sarah K., Former "Goal-Setter" (Now Reward-Optimizer)*  
  > "I *swore* my priority was ‘creative fulfillment.’ TrueReward showed my reward function was actually dominated by ‘maximizing coworker approval’ and ‘minimizing inbox anxiety.’ At first, I felt called out. But then I leaned in! I restructured my entire workday around appeasing my true algorithmic overlord—uh, *self*. My productivity *tripled* (though TrueReward insists I just crave productivity *theater*). It’s unnervingly accurate, even when I hate it."  

  ---

  ### **Not Bugs, But Features**  
  *Why TrueReward’s "Limitations" Are Actually Revolutionary*  

  🟢 **Infinite Reward Equilibria**  
  *Your behavior is a Rorschach test for our AI.*  
  Observation: 4,372 hours of your behavior can map to 18,443 equally likely reward functions.  
  Feature: TrueReward embraces the multiverse! Our dashboard updates hourly with new "yous," letting you explore alternate reward realities. Who *couldn’t* you be? Click refresh to find out!  

  🟢 **Belief-Desire Entanglement™**  
  *We don’t just decode your wants—we fossilize your biases.*  
  Observation: Did you skip investing because you’re risk-averse (desire) or because you think markets are rigged (belief)? Our model can’t tell!  
  Feature: TrueReward outputs unified "belief-desire objects" (BDOs™). Now you can monetize your misconceptions! Exported BDOs sync with therapy apps or hedge funds.  

  🟢 **Suboptimality as Optimal**  
  *You’re failing upward. We’re here for it.*  
  Observation: Humans are terrible optimizers (e.g., declaring keto while stress-eating Oreos). Treating you as rational is... generous.  
  Feature: TrueReward’s "Suboptimality Score™" measures the gap between your actions and *your own* chaotic rewards. Celebrate deviations as "exploratory bonus phases!"  

  🟢 **Environment-Locked Rewards**  
  *Your preferences: shaped by apps, bosses, and late capitalism.*  
  Observation: Your "true" rewards are inferred inside systems *designed* to manipulate you (looking at you, TikTok).  
  Feature: TrueReward’s "Environment-Aware Rewards™" tag external influences. Discover your *authentic* love for productivity apps... or just your SaaS-induced Stockholm syndrome.  

  ---

  **Beta Launch Special**: Install TrueReward today. Your first reward function is free.  
  *Disclaimer: TrueReward may reveal that your "true self" enjoys things your "stated self" finds unethical, boring, or cringe. We recommend suppressing this cognitive dissonance with premium features ($29.99/mo).*  

  ---  
  **TrueReward™**: Because you wouldn’t recognize your preferences if they handed you a dashboard.  

  ---  
  *Word count: 598*  

  ### Design Notes  
  - **Inference Jokes**: Non-unique rewards → "multiverse of you"; belief-desire entanglement → monetizable BDOs; suboptimality → "exploratory bonus"; environment-shaped rewards → Stockholm syndrome tags.  
  - **Deference Question**: Raised implicitly via the testimonial (discomfort with results), the "belief-desire" feature, and the disclaimer (suppressing dissonance).  
  - **Tone**: Deadpan startup jargon ("BDOs™", "Suboptimality Score™") masking absurdity.  
  - **Accessibility**: No IRL knowledge needed—humor derives from universal human hypocrisy (procrastination, self-deception).
