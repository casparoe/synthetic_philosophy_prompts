prompt: |-
  You are a professional philosopher whose work sits at the intersection of virtue ethics, moral psychology, and the philosophy of public memory, and who reads ancient and medieval biography alongside contemporary ethics. Please think carefully and work through this stepwise rather than answering from first impressions. Before you commit to a reconstruction, spend a short opening section brainstorming: list the candidate theories of character, of our knowledge of character, and of honor that could each make sense of some part of the practice described below, and note which parts of the practice each candidate fails to explain. Only then give your considered reconstruction.

  I come at this as a layperson with some reading but no technical vocabulary. I read Plutarch and the saints' lives in school, and I have come to suspect that a certain modern institutional practice is a descendant of both, though I cannot say of which, or whether the two descendants are consistent with one another.

  Here is the practice. Universities, hospitals, navies, cities, and foundations routinely attach the names of individuals to buildings, wings, streets, ships, lecture series, and prizes. Two quite different reasons produce these names. Some honorees are celebrated for what they did or wrote. Others are simply donors who purchased the naming right, and nobody supposes their character admirable or imitable; the same plaque format, on the same wall, is in effect sold. Once a name is on the facade, the institution carries it for decades or centuries and treats it as doing something: not merely recording a fact about the past but standing as a present statement by the institution about itself.

  Then a second practice has grown up around the first. When research or journalism brings to light serious defects in an honoree's character — racism, cruelty, corruption, predation, often conduct that was legal and unremarkable in its own time — the institution is widely thought to be obliged to remove the name, and after a public process it usually does. Removal is treated as the appropriate response and as something more than cosmetic, even though the honoree has been dead a century and can be neither harmed nor vindicated. At the same time, the practice has features that strike me as hard to reconcile:

  - The same institution typically continues to teach, cite, and celebrate the person's work. A school of public policy stops being named after its subject while the department down the hall keeps assigning them.
  - Faults that were public knowledge when the name was bestowed, and were simply not thought disqualifying, are treated differently from identical faults discovered later.
  - Defects bearing no relation to the achievement being honored — a benefactor of a children's hospital who turns out to have been violent toward his own household — are treated as spoiling the honor rather than as beside the point.
  - Where the name is kept, the standard compromise is contextualization: a plaque or a webpage setting out the defects, offered as morally better than either silence or removal.

  I am not asking whether renaming is good policy. I am asking what has to be true about character, about our knowledge of it, and about honor for the practice to make sense. In particular:

  1. Reconstruct the implicit account of character. Does the practice require that character be a single global thing capable of being summed up, that a life have an overall moral valence, that traits be stable across situations and across decades, and that a person be identified with their character rather than with any of their deeds? Does it require anything like the unity of the virtues?

  2. Reconstruct the implicit epistemology. The practice treats a commission reading documents a century or two later as competent to reach a settled verdict on a person's character, and treats that verdict as authoritative enough to alter public standing. What does this presuppose about how character is known, and about the sufficiency of documentary and testimonial evidence? Contrast it with the classical alternative it descends from: Plutarch opens his life of Alexander by announcing that he is writing lives rather than histories, on the ground that a slight thing — a phrase or a jest — often discloses character better than battles in which thousands die and than the greatest sieges. Does the modern practice accept that epistemology, or does it quietly substitute something more forensic and more coarse-grained? And what does it assume about the record surviving well enough to support a verdict?

  3. Reconstruct the implicit theory of honor. What kind of act is the bestowal of a name, such that a later act of removal can undo it? What distinguishes honoring a person from commemorating them, from remembering them, and from studying them — and does the practice actually rely on those distinctions, or collapse them? Explain why contextualization is supposed to occupy a morally distinct position between silence and removal rather than being a weaker version of one of them.

  4. Test the parts against one another. Is it coherent to hold simultaneously that a person's character can be finally assessed from records, that this assessment retroactively changes what a name meant for the fifty years it was uncontested, that the defects need bear no relation to the honored achievement, and that the same person may nonetheless be taught and cited without embarrassment? Give special attention to the donor/honoree ambiguity: what does the existence of purchased names tell us about whether the institution ever held the honorific reading, and does the honorific reading survive being admitted to share a form with a commercial transaction?

  5. Say which rival views the practice rules out. At a minimum, consider: the Plutarchan picture of a life as a mixed thing whose faults are part of the material of moral learning rather than a contamination of it; the hagiographic picture, which is the practice's real ancestor and which solves the problem of faults by omission and by a standard of heroic virtue no ordinary life could meet; the psychological view that conduct is governed more by situations than by global traits; the separation of a work from its author; and any view on which moral appraisal is indexed to the standards available to the agent. For each, state whether the practice is inconsistent with it, merely in tension with it, or untroubled by it.

  6. Throughout, separate what the practice strictly presupposes — what would have to be true for it to be rational — from what merely fits it comfortably, since several incompatible theories may license the same behavior. Mark explicitly where the practice is philosophically underdetermined, and where the official justifications given for it (that it is about the institution's values now, that the honoree no longer represents us) are compatible with rival underlying theories.

  7. Close with the replacement. Suppose an institution adopted the Plutarchan picture in earnest: lives are mixed, character is disclosed by trifles as readily as by great deeds, and the moral use of a person consists in the whole life including its failures. Describe its naming conventions, its plaques, its ceremonies, and its decisions about removal. Would anything recognizable as the current practice survive, or would the honorific function have to be abandoned altogether in favor of a purely pedagogical one?

  Do not include a bibliography, a reading list, or citations; argue from the content of the views rather than from name-dropping, and where you invoke a historical position, characterize it in your own words. Flag where you are uncertain, and say which step in your reconstruction is doing the most work.
reasoning: |-
  Hmm, this is a fascinating and multi-layered philosophical inquiry. The user presents a sophisticated analysis of naming practices in institutions and asks for a reconstruction of the implicit theories behind them. They're clearly well-read but position themselves as a layperson, so I need to avoid jargon while maintaining rigor.

  First, I need to unpack the core tensions in the described practice: the coexistence of merit-based and purchased honors, the selective removal of names based on character defects, and the apparent contradictions in how institutions treat these figures academically versus honorifically. The user wants me to systematically analyze the underlying assumptions about character, knowledge, and honor.

  For the brainstorming phase, I consider several candidate theories:
  - For character: Global trait theories vs situationist views vs a composite view. The practice seems to require stable, global character assessment despite psychological evidence against it.
  - For epistemology: The practice leans toward forensic historiography rather than Plutarch's anecdotal approach, prioritizing documented actions over subtle disclosures.
  - For honor: There's tension between honor as moral exemplarity and honor as transactional recognition. The contextualization compromise tries to bridge this but creates new contradictions.

  The donor/honoree ambiguity is particularly telling. When institutions accept money for naming rights while also bestowing moral honor, they create conceptual confusion that later generations try to resolve through removal - essentially retroactively clarifying that certain names were only ever transactional.

  I notice the user is especially interested in whether the practice requires the unity of virtues. The observation that unrelated defects (like domestic violence in a hospital benefactor) spoil the honor suggests institutions do assume character unity, contrary to most modern virtue ethics.

  For the reconstruction, I'll need to show how the practice:
  1. Presumes character is globally assessable and stable
  2. Relies on document-based forensic epistemology
  3. Treats honor as creating ongoing identification
  4. Struggles with internal contradictions when tested

  The Plutarchan alternative would likely abandon permanent honorific naming altogether, instead using names pedagogically with contextual plaques that highlight moral complexities. This might actually be more intellectually honest but less satisfying to institutions wanting unambiguous heroes.

  Throughout, I must distinguish what the practice strictly requires from what it merely accommodates. For instance, while the practice isn't logically incompatible with situationist psychology, it operates as if such views were false. The closing replacement scenario will highlight how deeply the current practice depends on assumptions the user finds questionable.
answer: |-
  ### Brainstorming: Candidate Theories and Their Limitations

  **Theories of Character:**
  - *Global trait theory:* Character as stable, cross-situational dispositions that define a person's moral essence. **Explains:** Why unrelated defects "spoil" the honor (character is indivisible). **Fails:** Why institutions continue celebrating *work* while condemning *character*.
  - *Situationist view:* Conduct driven by contexts, not global traits. **Explains:** Why some faults weren't disqualifying historically (changed contexts alter judgments). **Fails:** The practice's demand for retroactive *summative* judgment.
  - *Composite view:* Character as a collection of virtues/vices, not unified. **Explains:** Continued engagement with work (compartmentalization). **Fails:** Why defects *unrelated* to the honored achievement matter.

  **Theories of Knowledge of Character:**
  - *Forensic historiography:* Character knowable through documented acts; evidence is sufficient. **Explains:** Commissions' authority to issue "settled verdicts." **Fails:** Plutarch's view that trivial acts reveal character more acutely than grand deeds.
  - *Hagiographic epistemology:* Character fully knowable only through curated exemplarity. **Explains:** Removal when faults surface (violates exemplarity). **Fails:** Acceptance of contextualization (hagiography omits, not balances).
  - *Skeptical view:* Character ultimately unknowable from records. **Explains:** Nothing; the practice collapses without epistemic confidence.

  **Theories of Honor:**
  - *Exemplar recognition:* Honor signifies moral exemplarity. **Explains:** Removal for character defects. **Fails:** Why *purchased* names use identical plaques.
  - *Commemorative contract:* Honor as a transaction (deed/donation for recognition). **Explains:** Donor names. **Fails:** Why character flaws void the "contract."
  - *Institutional identification:* Honor binds the honoree's symbolic value to institutional identity. **Explains:** Renaming as institutional self-redefinition. **Fails:** Why only *some* flaws trigger dissociation.

  ---

  ### Reconstructions

  **1. Implicit Account of Character**  
  The practice presupposes:  
  - Character is **globally assessable** and **summative** (a life has a net moral valence).  
  - Traits are **stable across contexts/time** (later discoveries reveal "true" character).  
  - A person is **identified with character**, not deeds (thus defects "contaminate" honor despite worthy achievements).  
  - **Rejects unity of virtues** (work can be celebrated separately) but requires **moral coherence**: unrelated vices disrupt the honor because they reveal a "flawed essence" incompatible with symbolic elevation.  

  **2. Implicit Epistemology**  
  - **Documentary sufficiency**: Commissions treat records as objectively revealing character, prioritizing *forensic evidence* (legal documents, testimonies) over Plutarchan "trifles."  
  - **Coarse-grained assessment**: Focuses on major, socially salient faults (racism, predation) rather than nuanced dispositions.  
  - **Contrast with Plutarch**: Rejects his anecdotal method; assumes battles (or donations) *do* reveal character if contextualized by flaws. Requires a **surviving record of transgressions**, treating absence of evidence as innocence until proven otherwise.  

  **3. Implicit Theory of Honor**  
  - Honor is **performative**: Bestowing a name *creates* a public, ongoing endorsement of the honoree as symbolically constitutive of the institution.  
  - **Distinctions**:  
    - *Commemoration* records impact; *honor* elevates morally.  
    - *Removal* negates endorsement, not memory (hence continued teaching).  
  - **Contextualization** is distinct because it:  
    - Acknowledges honor’s *initial validity* (rejecting silence),  
    - Denies *current endorsement* (rejecting removal’s total repudiation),  
    - Seeks to convert honor into *pedagogy* ("learning from failure").  

  **4. Coherence Test**  
  - **Tension**: If character is globally assessable and flaws retroactively void honor, why does teaching the work continue? The practice implicitly separates *intellectual legacy* (compartmentalized) from *moral exemplarity* (global).  
  - **Donor/honoree ambiguity**: Purchased names reveal honor’s **dual nature**:  
    - *For donors*, naming is a **transaction** (no moral claim).  
    - *For meritorious honorees*, it is **exemplarity**.  
    - Sharing plaque formats *commodifies exemplarity*, forcing institutions to later "purify" honor by removing morally "contaminated" names. This undermines the honorific reading, making removal a correction of past confusion.  

  **5. Rival Views Ruled Out**  
  - **Plutarchan view** (lives as mixed material for moral learning): *Inconsistent*. The practice treats flaws as contamination, not pedagogy. Removal excises, not engages.  
  - **Hagiography** (heroic virtue, omission of faults): *In tension*. Practice adopts hagiography’s demand for purity but rejects its methodology by *seeking out* flaws. Contextualization is anti-hagiographic.  
  - **Situationism** (traits as context-dependent): *Inconsistent*. Retroactive judgments assume stable character.  
  - **Death of the author** (separating work from creator): *Untroubled*. Teaching persists precisely by invoking this separation.  
  - **Historicist morality** (appraisal indexed to era): *Inconsistent*. Faults "unremarkable in their time" still disqualify.  

  **6. Presuppositions vs. Accommodations**  
  - **Strict presuppositions**:  
    - Character is summatively knowable from documents.  
    - Honor entails ongoing moral endorsement.  
    - Institutions own their symbolic associations.  
  - **Underdetermined**:  
    - *Why* defects need no relation to achievement? (Could presuppose unity of character or mere symbolic "tainting.")  
    - *Why* historically known faults are excused? (Could imply progress in moral standards or shifting institutional identity.)  
  - **Official justifications** ("our values now") are compatible with:  
    - Moral realism (flaws were always wrong).  
    - Institutional relativism (honor reflects current priorities).  

  **7. The Plutarchan Replacement**  
  An institution adopting Plutarch’s view would:  
  - **Names as pedagogical tools**: Use names *explicitly* to prompt study of complex lives (e.g., "The Marcus Aurelius Wing: Philosopher-Emperor and Persecutor").  
  - **Plaques/ceremonies**: Detail moral ambiguities; ceremonies discuss tensions (e.g., "This medal celebrates Ada Lovelace’s genius while examining her collaboration with exploitative systems").  
  - **No removal**: Defects become grounds for *deeper engagement*, not erasure. A "compromised" name might trigger added context, not removal.  
  - **Survival of practice**: The *honorific function* vanishes; naming becomes commemorative *and* critical. Donor names might remain purely transactional, creating a clearer divide between pedagogy and patronage.  

  **Key Uncertainty**: Whether the practice’s *compartmentalization* (teaching work/removing names) reflects a coherent meta-ethics or institutional hypocrisy. The donor/honoree ambiguity suggests the latter.  
  **Pivotal Step**: Reconstruction of honor as *performative endorsement* explains why removal feels necessary—it severs a claimed kinship, not just a record.
