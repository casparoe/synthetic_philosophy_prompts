  ### Decision Procedure for Special-Risks Pricing Files  
  **Objective:** Systematically assess probability and weight of argument (confidence) for novel risks, terminating in either a numeric estimate with confidence label or a documented non-numeric conclusion. Designed for 90-minute execution by non-probability specialists.  

  ---

  #### **Procedure Steps**  
  1. **Mandate Check (Handoff to Underwriting Committee)**  
     - **Question:** "Is the risk within our underwriting mandate? Refer to the list of excluded perils/harms."  
     - **Sufficient Answer:** "Yes" (proceed). "No" (terminate and hand off to committee with explanation: "Risk excluded per mandate: [reason].").  
     - **Judgment Call Flag:** None. Factual check against predefined list.  

  2. **Evidence Collection**  
     - **Question 1:** "Describe the exposure’s key perils and failure modes."  
       - *Sufficient:* 1–2 sentences identifying critical vulnerabilities (e.g., "Autonomous vessel: sensor failure causing collision").  
     - **Question 2:** "Is there direct loss history for **this exact** exposure?"  
       - *Sufficient:* "Yes" (document frequency: losses/exposure-years) or "No."  
     - **Question 3:** "Is there an **analogue class** with usable loss history?"  
       - *Sufficient:* "Yes" (specify analogue and base frequency) or "No."  
     - **Termination Point:** If Q2/Q3 yield data, proceed to quantification. Else, go to Step 3.  

  3. **Non-Data Quantification**  
     - **Question 4:** "Are there independent quantitative estimates (e.g., simulations, models)?"  
       - *Sufficient:* Document estimates and sources.  
       - **Rule:** Use the **highest defensible estimate** if sources conflict without validation. *Justification:* Protects against ruin; unresolved conflict indicates unquantified uncertainty.  
     - **Question 5:** "Are there independent expert estimates?"  
       - *Sufficient:* Document verbal estimates (e.g., "very unlikely") or numeric ranges.  
       - **Rule:** Convert verbal estimates to conservative numeric bounds (see Table 1). Take the **maximum point or upper bound**.  
     - **Question 6:** "Can we bound the probability? Define min/max defensible values."  
       - *Sufficient:* "Min = [X], Max = [Y]" based on physics, regulations, or expert input.  
       - **Rule:** Use **upper bound (Y)** as estimate. *Justification:* Avoids underestimating tail risk.  
     - **Termination Point:** If Q4–Q6 yield an estimate, proceed to confidence rating. Else, terminate as non-numeric (Step 5).  

  4. **Confidence (Weight) Assessment**  
     - **Scoring:** Assign points (see Table 2) for:  
       - **Source Independence** (2: ≥2 independent, 1: 1 source, 0: non-independent).  
       - **Data Quality** (3: direct/analogue data, 2: validated model, 1: simulation/expert, 0: speculation).  
       - **Expertise** (2: domain expert, 1: adjacent field, 0: none).  
       - **Agreement** (2: estimates within 2x, 1: within 10x, 0: >10x or irreconcilable).  
     - **Confidence Label:**  
       - High (7–8 points), Medium (5–6), Low (0–4).  
     - **Rule:** Unanimous but unanchored testimony (e.g., consultants without data) scores **low expertise (0)**. Fragmentation lowers **agreement (0)**. *Justification:* Agreement without anchoring is fragile; contradiction indicates unresolved uncertainty.  
     - **Judgment Call Flag:** Tier assignment (e.g., "Is this model validated?").  

  5. **Non-Numeric Termination**  
     - **Condition:** No defensible estimate from Steps 2–4.  
     - **Action:**  
       - Leave numeric field **blank**.  
       - Free-text: "Insufficient basis for numeric probability. Key gaps: [e.g., no data, irreconcilable conflict]. CFO must assign figure."  
       - Confidence label: "Low."  

  6. **Risk Appetite Handoff**  
     - **Question:** "Does the probability exceed 0.10 OR involve novel harm types (e.g., existential/catastrophic)?"  
       - *Sufficient:* "Yes" (hand off to committee: "Risk appetite review required due to [probability/harm type]."). "No" (proceed to filing).  
     - **Judgment Call Flag:** Defining "novel harm" (e.g., satellite collision cascades).  

  7. **Filing**  
     - **Numeric Field:** Best estimate (from Steps 2–4) or blank (Step 5).  
     - **Confidence Label:** High/Medium/Low (from Step 4).  
     - **Free-Text (≤400 chars):** "Estimate: [X]. Range: [min]–[max]. Sources: [e.g., simulations, experts]. Key uncertainties: [e.g., unvalidated assumptions]."  
       - **Rule:** If CFO forces a number, append: "CFO entered [Z]."  

  ---

  **Table 1: Verbal Estimate Conversion**  
  | Expert Term      | Conservative Annual Probability |  
  |------------------|---------------------------------|  
  | "Very unlikely"  | 0.05 (5%)                       |  
  | "Remote"         | 0.02 (2%)                       |  
  | "Extremely rare" | 0.005 (0.5%)                    |  
  *Justification:* Elicitation studies show experts underweight tail risks; conservatism counters this.  

  **Table 2: Confidence Points**  
  | Criterion        | 3 Points      | 2 Points          | 1 Point           | 0 Points          |  
  |------------------|---------------|-------------------|-------------------|-------------------|  
  | Data Quality     | Direct data   | Validated model   | Simulation/Expert | Speculation       |  
  | Source Independence | ≥2 independent | 1 independent     | Non-independent   | None              |  
  | Expertise        | Domain expert | Adjacent field    | Limited relevance | None              |  
  | Agreement        | Estimates ≤2x | Estimates ≤10x    | Estimates >10x    | Irreconcilable    |  

  ---

  ### **Procedure Execution on Example Files**  
  **File (i): Autonomous Coastal Cargo Vessel Liability**  
  - **Evidence:** Two manufacturers’ simulations (0.001 vs. 0.10 probability), draft safety standard (qualitative).  
  - **Execution:**  
    1. Mandate: Within scope.  
    2. Q2/Q3: No direct/analogue data → Step 3.  
    3. Q4: Simulations = 0.001 and 0.10. **Highest estimate (0.10)** used (unvalidated conflict → conservative rule).  
    4. Confidence:  
       - Source Independence: 2 (independent manufacturers).  
       - Data Quality: 1 (simulations).  
       - Expertise: 2 (manufacturers).  
       - Agreement: 0 (>10x difference).  
       - **Total: 5 → Medium confidence.**  
    5. Free-text: "Estimate: 0.10. Range: 0.001–0.10. Sources: Manufacturer simulations (unvalidated). Uncertainties: No real-world calibration."  
  - **Outcome:** 0.10, Medium.  

  **File (ii): Cultivated-Protein Contamination Liability**  
  - **Evidence:** 30 years of microbial data from conventional plants; novel organism with different growth.  
  - **Execution:**  
    1. Mandate: Within scope.  
    2. Q3: Analogue data (frequency = 0.02). Adjustment? No basis for direction → **no adjustment (×1.0)**.  
    3. Confidence:  
       - Source Independence: 1 (internal data).  
       - Data Quality: 3 (direct analogue data).  
       - Expertise: 2 (internal data).  
       - Agreement: 2 (single source → consistent).  
       - **Total: 8 → High confidence.**  
    4. Free-text: "Estimate: 0.02. Range: N/A. Sources: 30y conventional plant data. Uncertainties: Novel organism growth not quantified."  
  - **Outcome:** 0.02, High.  
  - **Why Unlikable:** Assigns high confidence to unadjusted analogue despite material differences. Procedure forces this because analogue data scores highly; adjustment requires judgment (not automated).  

  **File (iii): Satellite Servicing Collision Liability**  
  - **Evidence:** Five consultants: "very unlikely" (no data).  
  - **Execution:**  
    1. Mandate: Within scope.  
    2. Q2/Q3/Q4: No data → Step 3, Q5.  
    3. Q5: Convert "very unlikely" to 0.05 (Table 1). **Max estimate (0.05)**.  
    4. Confidence:  
       - Source Independence: 2 (5 independent).  
       - Data Quality: 1 (expert judgment).  
       - Expertise: 1 (consultants; no operational data → low anchoring).  
       - Agreement: 2 (unanimous).  
       - **Total: 6 → Medium confidence.**  
    5. **Cap:** Data Quality = Tier 1 (expert) → confidence **capped at Low** (rule: unanchored testimony caps at Low).  
    6. Free-text: "Estimate: 0.05. Range: N/A. Sources: 5 consultants. Uncertainties: No operational data; conservative conversion."  
  - **Outcome:** 0.05, Low.  
  - **Why Unlikable:** Forces a numeric estimate from verbal testimony despite Keynesian objections. Caps confidence at Low, but committee may ignore this.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Keynesian Commitments Preserved:**  
     - **Weight vs. Probability:** Confidence labels explicitly separate reliability from the estimate.  
     - **Non-Numeric Probabilities:** Allows termination without a number (Step 5), though rarely used.  

  2. **Keynesian Commitments Bent/Abandoned:**  
     - **Non-Numeric Probabilities:** CFO override forces quantification. Verbal estimates are converted to numbers (Table 1), violating Keynes’ non-numericity.  
     - **Non-Comparability:** All probabilities placed on a linear 0–1 scale; comparability assumed.  

  3. **Committee Workarounds:**  
     - **Ignoring Confidence:** If the committee dismisses labels, weight of argument is lost.  
     - **CFO Override:** Blank fields invite arbitrary numbers, undermining documentation.  
     - **Free-Text Limitations:** 400 characters truncates nuance; ranges may be oversimplified.  

  **Conclusion:** The procedure operationalizes Keynes’ weight-of-argument principle but surrenders to organizational constraints (numeric fields, committee behavior). It excels in structuring ambiguity but cannot force engagement with uncertainty. Use it to *document* fragility, even when decisions ignore it.
