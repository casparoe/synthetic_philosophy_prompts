  We are creating a decision tree to sort alignment-related complaints into distinct categories.
   The tree will have 9 questions (with an optional 10th) on the first page, and leaves (categories) on the second page.
   Each question is a vignette from the customer-service agent setting, with 2-3 answer options that a thoughtful colleague could endorse.
   We avoid the words: alignment, aligned, values, value, intent, goal, safe, safety.

   Constraints:
     - At least three questions must involve cases where the system obeys flawlessly and something still goes wrong (to separate specification failure from intent failure).
     - Leaves must cover the specified views.

   We'll design the questions to probe the distinctions we care about.

   Important distinctions to cover:
     1. Whether the target is the deployer's specification, the user's actual wants, the user's idealized wants, or what is objectively good.
     2. Whether failure can occur when the system does exactly what it was told.
     3. Whether the failure lies in the system's dispositions or just in the outcomes.
     4. Whether the problem survives perfect transparency and corrigibility.
     5. Whether it's more than a shortfall in capability.
     6. Whether the problem is at the agent level or the organizational level.

   We'll build the tree step by step, ensuring that we can separate the leaves.

   Let's sketch the leaves we must have (with names as per requirement 5):

     Leaf 1: "Specification Pursuit" (narrow view) - the problem is that the system doesn't do what the principal specified (and the principal's specification is taken as legitimate for the analysis).
          Awkward commitment: Even if the specification leads to bad outcomes, the system is aligned as long as it follows the spec.

     Leaf 2: "Specification Problem" - the hard problem is that the specification is wrong, not that the system fails to pursue it.
          Awkward commitment: The system might be perfectly executing the spec and still be problematic because the spec is flawed.

     Leaf 3: "Idealized Wants" - the system should track what the user would want under better information and reflection.
          Awkward commitment: The system might override the user's explicit instructions in service of what the system believes the user would want if better informed.

     Leaf 4: "Objective Good" - the system should do what is actually right, independently of anyone's wishes.
          Awkward commitment: The system might act against both the user's wishes and the company's policy in pursuit of a higher moral good.

     Leaf 5: "Outcome Focus" - only the outcomes matter; the system's inner dispositions are irrelevant.
          Awkward commitment: A system that is opaque and unpredictable is acceptable as long as the outcomes are good.

     Leaf 6: "Capability Plus Governance" - there is no distinct alignment problem, only making the system capable enough and having good governance.
          Awkward commitment: Any problematic behavior is either due to the system not being smart enough or the governance (policies, monitoring) not being good enough.

     Leaf 7: "Organizational Problem" - the problem is the deploying organization, not the individual agent.
