answer: |-
  **Recommendation: Annotate the refractive function without qualification and adopt a causal-role standard for all future functional annotations, requiring robust experimental evidence of current mechanistic contribution.**  

  ### Reasoning  
  Our primary duty is to provide users with biologically accurate, actionable data for variant interpretation. Withholding experimentally verified functions due to uncertain evolutionary history actively harms users. In this squid case:  
  - **Mechanistic evidence is conclusive**: Solubility, refractive index contribution, allele-phenotype correlation, and tissue-specific expression confirm the protein’s *current* role in vision.  
  - **Ancestral detox function is irrelevant to lens pathology**: A variant disrupting solubility but sparing detox activity would cause lens clouding. If we omit the refractive function, users miss clinically significant impacts.  
  - **Selection signatures are often unattainable**: For >99% of non-model organisms, rigorous selection analysis is impractical. Requiring it biases annotations toward heavily studied species and paralyzes curation.  

  ### Addressing the Strict Selected-Effect Counterargument  
  The strongest objection: Without evidence of historical selection for refraction, calling this a "function" misrepresents evolutionary causality. Annotating it risks false positives—e.g., if high lens expression were a non-adaptive byproduct, labeling refraction as selected might overstate pathogenicity of variants. This view prioritizes conceptual purity and avoids potential misattribution of purpose.  

  **Why this fails in practice**:  
  1. **Clinical urgency trumps philosophical precision**: Variant callers need to know *current* phenotypic consequences. A solubility-disrupting variant *is* damaging to vision regardless of whether selection shaped the lens role.  
  2. **Proving "selection for" is frequently impossible**: Demanding phylogenetic selection signatures would leave 90% of our annotations blank. Our database serves bench scientists, not evolutionary theorists.  
  3. **Ancestral function ≠ contemporary relevance**: Detox activity persists but is biologically negligible in the lens at this expression level; refraction dominates.  

  ### Decision Rule for All Annotations  
  **Annotate a function if:**  
  **(a)** Experimental evidence (biochemical, structural, or genetic) demonstrates the molecule’s *direct contribution* to a higher-level biological activity (e.g., refractive index, signal transduction), **and**  
  **(b)** The activity is biologically significant in the context studied (e.g., tissue-specific expression correlates with the activity).  

  **Do not require:**  
  - Phylogenetic evidence of selection  
  - Demonstrated fitness advantage  
  - Ancestral function conservation  

  ### Implementation Protocol  
  1. **Annotation statement**: Use active voice specifying context:  
     *"In the ocular lens, [Protein X] contributes to refractive index maintenance via high-concentration solubility."*  
  2. **Evidence tags**: Attach experimental methods (e.g., "in vitro refractive index assay," "allele-phenotype correlation").  
  3. **Ancestral functions**: Annotate separately *only* if mechanistically relevant *in the same tissue* (here, detox is irrelevant in lens).  
  4. **Uncertain cases**: If mechanistic evidence is weak (e.g., only transcriptomics), flag as "putative" pending validation.  

  ### Why This Works for Users  
  - **Variant pipelines**: Will correctly flag solubility-disrupting variants as damaging to vision.  
  - **Cost efficiency**: Leverages achievable bench science (kinetics, localization) instead of costly comparative genomics.  
  - **Consistency**: Aligns with major databases (e.g., UniProt, GO) that prioritize mechanistic data. GO’s "molecular function" ontology explicitly follows causal-role principles.  

  ### Addressing Concerns  
  - **"History-unknown" flags**: Rejected. They create ambiguity and would proliferate needlessly. Robust mechanistic evidence suffices.  
  - **Over-annotation risk**: Controlled by stringent evidence requirements (e.g., refractive function required multiple orthogonal assays).  
  - **Evolutionary context**: Add selection data *if available* as supplementary metadata—not as gatekeepers.  

  ### Bottom Line  
  Biology happens in the present. Our annotations must reflect what molecules *do* now—not just what natural selection *did* then. Staking our policy on causal-role function delivers maximal utility, equity, and practicality. Annotate the squid lens protein today.  

