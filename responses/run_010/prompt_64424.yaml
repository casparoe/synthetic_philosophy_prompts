prompt: |-
  Our department's crossover reading group meets Thursday and roughly half the room has never opened a semantics paper. Topic is slurs — what they mean and what people do with them. Before anybody presents anything I want to hand out a short "which view do you actually hold?" quiz, because I've watched people announce themselves as expressivists or whatever and then answer every diagnostic case like a straight-up descriptivist.

  So: eight to ten questions, each a concrete case with two or three options, plus a scoring key. Every question has to be answerable by someone who's never heard the debate — if a question only makes sense once you know what a conventional implicature is, cut it. Keep the actual words blanked out with a placeholder (say ___); nobody needs them printed in order to answer.

  Cases I want in there, plus whatever else you think earns a slot:

  1. Negation. Someone says "it's not the case that Kai is a ___." What, if anything, is conveyed about Kai, and what about the speaker?
  2. Indirect report. Ana tells Bo "Kai is a ___." Bo later tells Cara what Ana said, using the word. Who slurred, if anybody?
  3. Quotation. A linguistics article prints the word in order to discuss it. Is the author doing anything wrong — the same wrong as the bigot, a smaller version of it, or nothing?
  4. The clean-hands speaker. Something with no attitudes at all — a chatbot trained mostly on 1920s novels, or a person who learned the word only from texts in a language nobody speaks anymore — asserts "Kai is a ___," and Kai has every descriptive property the word tracks. Is the assertion true? Was anything wrong done? I want this one to be a real fork, because I think some positions are forced into saying true-and-nothing-wrong, and I want to know which ones and whether they can live with it.
  5. Reclamation. Same word, used among friends who are all in the target group. Difference in content, difference in who may deploy it, difference in what it's for — or no difference at all, just a social illusion?
  6. A new coinage. A community deliberately invents a slur for itself; outsiders pick it up and start using it to hurt. When does it become a slur — at the coining, at the uptake, or at the first hateful use?
  7. For three or four words you pick, is there a neutral counterpart that means the same thing minus the poison? At least one of them should be a case where the honest answer is no.

  Now the key. My hunch, and push back if you think it's wrong: the literature is answering two different questions at once and calling the results rival theories. One axis is what the word contributes to the truth conditions of a sentence containing it. The other is what a speaker does in uttering it. So I'd like the scoring key to come out as a grid rather than a list — place each answer pattern into a cell and put the live positions in the cells they belong to. I want at least these represented: the line that puts the derogatory content in what is said; the line that puts it in a non-displaceable expressive side-channel; the line that says the word is simply taboo and every utterance of it does the damage regardless of the speaker's attitudes; the line that makes the content depend on a community's derogatory practice rather than on the individual speaker's head; and whatever hybrids the pattern space actually supports. Name the leaves however the literature names them if there's a standard name, but no bibliography and no reading list, I'll fill that in myself.

  Two more things. First, some answer patterns won't correspond to anybody's actual view. Don't smudge them into the nearest leaf — list them seperately and say for each whether the cell is empty because the view is incoherent, because it's coherent but nobody wants it, or because nobody has bothered to occupy it yet. Second, tell me which pairs of positions my cases can't separate at all, meaning where two theories give identical answers to everything above. And if question 4 turns out to be unanswerable without already taking a side on whether truth is even the right thing to ask about here, say so in the key instead of writing a question that pretends otherwise.
reasoning: |-
  We are designing a quiz to help participants in a reading group on slurs identify their own views. The quiz should consist of 8-10 concrete cases, each with two or three options, and be answerable without prior knowledge of the debate. We will use a placeholder (___) for the slur. The cases provided by the user are:

  1. Negation
  2. Indirect report
  3. Quotation
  4. The clean-hands speaker
  5. Reclamation
  6. A new coinage
  7. Neutral counterpart (for 3-4 words)

  Additionally, we need to add 1-3 more questions to reach 8-10. We'll also design a scoring key that maps answer patterns to positions in a grid (truth-conditional contribution vs. speaker action) and identify which positions correspond to known theories.

  Let's design the questions:

  1. **Negation**: 
     - Scenario: Someone says "It's not the case that Kai is a ___." 
     - Question: What, if anything, is conveyed about Kai, and what about the speaker?
     - Options:
       A. About Kai: nothing about the group membership. About the speaker: they are not expressing derogatory views toward the group.
       B. About Kai: they are not a member of the group. About the speaker: they might still be expressing derogatory views toward the group.
       C. About Kai: they are not a member of the group. About the speaker: they are not expressing derogatory views.

  2. **Indirect report**:
     - Scenario: Ana tells Bo "Kai is a ___." Bo later tells Cara what Ana said, using the word. 
     - Question: Who slurred, if anybody?
     - Options:
       A. Only Ana slurred; Bo is just reporting.
       B. Both Ana and Bo slurred.
       C. Only Bo slurred; Ana's act is over and Bo is now responsible.

  3. **Quotation**:
     - Scenario: A linguistics article prints the word in order to discuss it. 
     - Question: Is the author doing anything wrong?
     - Options:
       A. The author is doing the same wrong as a bigot.
       B. The author is doing a smaller version of the wrong (e.g., perpetuating harm but without hateful intent).
       C. The author is doing nothing wrong.

  4. **Clean-hands speaker**:
     - Scenario: A chatbot (trained on old texts, no attitudes) or a person (who learned the word from dead texts) asserts "Kai is a ___," and Kai has every descriptive property the word tracks. 
     - Question: Is the assertion true? Was anything wrong done?
     - Options:
       A. The assertion is true, and nothing wrong was done (because no derogatory intent or effect).
       B. The assertion is false, because the word carries derogation and without that, it doesn't apply.
       C. The assertion is true, but something wrong was done (because the word is harmful regardless).
       D. The assertion is false, and something wrong was done.

  5. **Reclamation**:
     - Scenario: Same word, used among friends who are all in the target group. 
     - Question: What is the difference?
     - Options:
       A. The content (meaning) of the word is different when used by in-group.
       B. The content is the same, but the speaker is allowed to use it because they are in-group, and the purpose is different (e.g., solidarity).
       C. There is no difference in content or purpose; it's a social illusion.

  6. **New coinage**:
     - Scenario: A community invents a slur for itself; outsiders pick it up and use it to hurt. 
     - Question: When does it become a slur?
     - Options:
       A. At the coining (because it was intended as a slur).
       B. At the uptake by outsiders (because that's when it gets used harmfully).
       C. At the first hateful use (regardless of who uses it).

  7. **Neutral counterpart**:
     - We'll pick three words: one with a clear neutral counterpart, one without, and one borderline. We can use placeholder names: 
       - Word1: (e.g., like "African American" vs. the N-word) -> has a neutral counterpart.
       Word2: (e.g., a word that is always a slur, like some that target disabled people) -> no neutral counterpart.
       Word3: (e.g., a word that is sometimes reclaimed but still has a neutral counterpart, like "queer" vs. "homosexual"? But note: "queer" is reclaimed and also has neutral academic use, so maybe not the best. Alternatively, a word that is ambiguous.) 
       However, note: we cannot use real slurs. So we must describe without using the word.

     - We'll describe the words without naming them.

     - Question: For each of the following words, is there a neutral counterpart that means the same thing without the derogation?
       - Word A: This word is used to refer to people from a particular region. It is often used derogatorily, but there is a commonly accepted non-derogatory term for the same group.
       - Word B: This word is used to refer to people with a particular disability. There is no commonly accepted non-derogatory term that means exactly the same thing; the neutral terms are either more general or clinical.
       - Word C: This word is used to refer to people of a particular religion. It was originally neutral but is now almost always derogatory, and there is a different neutral term that is used.

     - Options for each word (separately):
       A. Yes, there is a neutral counterpart.
       B. No, there isn't.

     - But note: the user wants at least one case where the answer is "no". We have Word B as "no", Word A as "yes", and Word C as ...? Actually, for Word C, the answer might be "yes" because there is a different neutral term. So we have one "no" (Word B).

     - Alternatively, we can make it a single question with three parts, each with A/B.

  Now, we need 1-3 more questions. Let's add:

  8. **Embedding in conditionals**:
     - Scenario: Someone says "If Kai is a ___, then they shouldn't be allowed in our club." 
     - Question: What, if anything, is conveyed about the speaker's attitude?
     - Options:
       A. The speaker is expressing derogatory attitudes toward the group.
       B. The speaker is not expressing derogatory attitudes, but is just considering a hypothetical.
       C. The speaker might be expressing derogatory attitudes, but it's not clear.

  9. **Denial of group membership**:
     - Scenario: Someone says "Kai is not a ___" (and Kai is not a member of the group). 
     - Question: What, if anything, is conveyed about the speaker?
     - Options:
       A. The speaker is expressing that the group is bad (derogatory attitude).
       B. The speaker is only denying that Kai is in the group, with no attitude about the group.
       C. The speaker is expressing that the group is good (positive attitude).

  10. **Multiple uses**:
      - Scenario: Two speakers use the word. Speaker 1: "Kai is a ___ and that's bad." Speaker 2: "Kai is a ___ and that's good." 
      - Question: Is the word being used in the same way by both speakers?
      - Options:
        A. Yes, the word has the same meaning in both, and the speakers are expressing their own attitudes separately.
        B. No, the word in Speaker 1's utterance is derogatory, but in Speaker 2's it is not (or even positive).
        C. The word is derogatory in both, so Speaker 2 is being inconsistent.

  Now, we have 10 questions.

  But note: the user wanted 8-10. We can trim if needed, but 10 is acceptable.

  Now, the scoring key:

  We'll map answers to a grid with two axes:

  Axis 1: What the word contributes to truth conditions (truth-conditional content)
    - TC1: The word contributes only the neutral descriptive content (so it is truth-conditionally equivalent to the neutral counterpart).
    - TC2: The word contributes both the neutral descriptive content and some derogatory content (so the truth conditions are more than just neutral).
    - TC3: The word contributes derogatory content as part of the truth conditions, and without it, the word doesn't apply (so if derogation is missing, the statement is false).
    - TC4: The word does not have truth-conditional content (or it is minimal) and the derogation is non-truth-conditional.

  Axis 2: What the speaker does in uttering it (speaker action)
    - SA1: The speaker expresses their own derogatory attitude (and if they don't have it, they are not expressing it).
