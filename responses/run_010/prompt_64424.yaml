answer: |-
  Below is a concise, self-contained quiz designed to help participants identify their implicit views on slurs without prior exposure to the literature. It uses concrete cases with blanked-out slurs (`___`) and avoids technical jargon. The quiz has 10 questions (covering your requested cases plus three additions for clarity). Each question has 2–3 intuitive options.

  ---

  ### **Slurs: What’s Your View? Quiz**  
  *Instructions: For each scenario, pick the option that best matches your intuition. No background knowledge needed.*

  1. **Negation**  
     Someone says, "It’s not the case that Kai is a ___." What does this convey?  
     A. Kai might still be in the group; the speaker dislikes the group.  
     B. Kai isn’t in the group; the speaker dislikes the group.  
     C. Kai isn’t in the group; the speaker has no negative views.  

  2. **Indirect Report**  
     Ana tells Bo: "Kai is a ___." Bo later tells Cara, "Ana said Kai is a ___," using the word. Who slurred?  
     A. Only Ana slurred; Bo just reported neutrally.  
     B. Bo slurred; Ana’s act is over.  
     C. Both slurred.  

  3. **Quotation**  
     A linguistics article prints `___` to discuss its history. Is the author doing something wrong?  
     A. Yes, same wrong as a bigot.  
     B. Yes, but a smaller wrong (e.g., spreading harm without hate).  
     C. No, nothing wrong.  

  4. **Clean-Hands Speaker**  
     A chatbot (no attitudes, trained on old texts) says, "Kai is a ___." Kai fits all descriptive traits the word tracks.  
     A. True assertion; nothing wrong (no intent/harm).  
     B. False assertion (word requires derogation); nothing wrong.  
     C. True assertion; something wrong (word inherently harmful).  
     D. False assertion; something wrong.  

  5. **Reclamation**  
     Friends in the target group call each other `___` affectionately. What’s different?  
     A. The word’s meaning changes (e.g., positive now).  
     B. Meaning same, but speakers can use it (e.g., for solidarity).  
     C. No difference; just social permission.  

  6. **New Coinage**  
     A group coins `___` for themselves. Outsiders later use it hatefully. When did it become a slur?  
     A. At coining (intent matters).  
     B. At outsider uptake (use matters).  
     C. At first hateful use.  

  7. **Neutral Counterparts**  
     For each word, is there a neutral term with the *exact same* meaning minus poison?  
     - Word X: Refers to an ethnic group; has a standard neutral term.  
       → A. Yes  B. No  
     - Word Y: Refers to a disability; no common neutral term exists (neutral terms are broader).  
       → A. Yes  B. No  
     - Word Z: Refers to a religion; originally neutral, now toxic, with a distinct modern neutral term.  
       → A. Yes  B. No  

  8. **Embedding in Conditionals**  
     Someone says, "If Kai is a ___, they’re dangerous." What’s conveyed?  
     A. Speaker dislikes the group (even hypothetically).  
     B. No dislike; just a hypothetical.  
     C. Unclear if speaker dislikes the group.  

  9. **Denial of Membership**  
     Someone says, "Kai isn’t a ___," and Kai isn’t in the group. What’s conveyed?  
     A. Speaker thinks the group is bad.  
     B. Speaker just denies membership; no attitude.  
     C. Speaker thinks the group is good.  

  10. **Multiple Uses**  
      Speaker 1: "Kai is a ___ and that’s bad." Speaker 2: "Kai is a ___ and that’s good." Is `___` used the same?  
      A. Yes; same meaning, attitudes separate.  
      B. No; Speaker 1’s use is derogatory, Speaker 2’s isn’t.  
      C. No; both are derogatory (Speaker 2 is inconsistent).  

  ---

  ### **Scoring Key**  
  *The grid below maps your answers to theoretical positions. Truth-conditional (TC) views ask what slurs contribute to sentence truth; speaker-action (SA) views ask what speakers do with them. Find your answer pattern (e.g., 1A, 2B, 3C...) and see which cell(s) it fits. Unoccupied cells are noted.*

  #### **Grid Axes**  
  - **TC Axis (Truth Conditions):**  
    - **TC-Neutral:** Derogation isn’t part of truth conditions; `___` truth-conditionally = neutral counterpart.  
    - **TC-Derogatory:** Derogation is part of truth conditions; `___` ≠ neutral counterpart.  
  - **SA Axis (Speaker Action):**  
    - **SA-Attitude:** Derogation comes from speaker’s intent/psychology.  
    - **SA-Convention:** Derogation comes from the word’s conventional meaning (community practice).  
    - **SA-Effect:** Derogation comes from harmful effects of utterance (regardless of intent/meaning).  

  | TC \ SA          | SA-Attitude                     | SA-Convention                        | SA-Effect                     |
  |------------------|----------------------------------|--------------------------------------|-------------------------------|
  | **TC-Neutral**   | **Expressivism** (e.g., Potts)  | **Practice-Based Hybrid**            | **Taboo View**               |
  | **TC-Derogatory**| (Empty: coherent but unpopular) | **Descriptivism** (e.g., Hom)        | (Empty: incoherent)          |

  #### **How to Map Your Answers**  
  - **Expressivism (TC-Neutral + SA-Attitude):**  
    Answers: 1B, 2A, 3C, 4A, 5B, 6B/C, 7X: mix (Y=B), 8A, 9A, 10A.  
    *Derogation is a non-truth-conditional, speaker-driven expresssion (e.g., conventional implicature).*  
  - **Descriptivism (TC-Derogatory + SA-Convention):**  
    Answers: 1C, 2C, 3B, 4B, 5A, 6A, 7X: all A, 8A, 9A, 10C.  
    *Derogation is part of literal meaning (truth-conditional) fixed by convention.*  
  - **Practice-Based Hybrid (TC-Neutral + SA-Convention):**  
    Answers: 1B, 2C, 3B, 4C, 5B, 6B, 7X: mix (Y=B), 8A, 9A, 10B.  
    *Derogation comes from community practice, not truth conditions (e.g., presupposition or use-conditional).*  
  - **Taboo View (TC-Neutral + SA-Effect):**  
    Answers: 1A/B, 2B/C, 3A/B, 4C/D, 5C, 6B/C, 7X: any, 8A/C, 9A/B, 10C.  
    *Any utterance causes harm; truth conditions are neutral, but harm is primary.*  

  #### **Empty Cells Explained**  
  - **TC-Derogatory + SA-Attitude:** Coherent but unpopular (no major theorist holds it). Why: If derogation is truth-conditional, it shouldn’t depend on individual attitude (e.g., clean-hands speaker couldn’t make a true claim).  
  - **TC-Derogatory + SA-Effect:** Incoherent. Why: If harm defines derogation, it can’t also be a truth-conditional property (truth conditions aren’t defined by effects).  

  #### **Indistinguishable Positions**  
  - **Expressivism vs. Practice-Based Hybrid** often agree (e.g., negation, indirect reports, reclamation). They diverge on **Q4 (clean-hands)**: Expressivism says "true, no wrong" (4A); Practice-Based says "true but wrong" (4C).  
  - **Taboo vs. Practice-Based** agree on harm (Q3, Q4) but disagree on **Q5 (reclamation)**: Taboo says "no difference" (5C); Practice-Based says "meaning same, use different" (5B).  

  #### **Note on Q4 (Clean-Hands)**  
  This question forces a fork:  
  - If you chose **4A (true, no wrong)**, you reject that slurs inherently harm (leaning Expressivism).  
  - If you chose **4C (true but wrong)**, you separate truth from harm (Practice-Based/Taboo).  
  - If you chose **4B/D (false)**, you tie truth to derogation (Descriptivism).  
  *No question-begging: The options don’t assume truth is central; they let answers reveal that.*  

  #### **Uncovered Nuances**  
  - **Reclamation (Q5):** Answers reveal if meaning changes (Descriptivism) or only use (others).  
  - **Neutral Counterpart (Q7):** Word Y (no counterpart) challenges TC-Neutral views if answered "B" (no).  
  - **Conditionals/Denial (Q8–9):** Highlight if derogation projects (TC-Neutral views) or scopes (TC-Derogatory).  

  ---  
  This quiz isolates core intuitions while avoiding real slurs. The scoring key maps answers to theories without oversimplifying—empty cells reflect genuine gaps, and the grid clarifies why "rival" theories often address different questions. For your session, emphasize that positions like Expressivism and Descriptivism aren’t directly competing; they’re on orthogonal axes. If answers don’t fit a named theory, note the cell’s status (e.g., "coherent but unoccupied").
