     Option X: The speaker's current attitude.
     Option Y: The word's conventional meaning in the community (regardless of speaker).
     Option Z: The act of utterance itself (causing harm).

  But note: some theories might combine.

  We'll have to see how the answers map.

  Instead of predefining the grid, we can let the answers define the cells, and then assign the theories.

