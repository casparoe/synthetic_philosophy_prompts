prompt: |-
  I am preparing the ethical annex to a targeting-doctrine review, and before it circulates internally I want an adversarial consistency audit of the principles I have committed to in writing. My anchor throughout has been Anscombe's objection to Oxford's conferral of an honorary degree on Truman, and the pamphlet she issued about it; I take her position on intentionally killing the innocent to be basically right, and I have tried to build a workable doctrine on top of it. What I have not done is check whether the resulting package coheres. Here it is, stated as my own commitments rather than as quotations from anyone.

  (1) Some acts may not be chosen, whatever the consequences. Chief among them: choosing to kill people who are neither fighting nor supplying the means of fighting, using their deaths as a means to one's ends. The wrongness of such a choice is not a function of the balance of outcomes and admits of no weighing against them.

  (2) What separates murder from tragic permission is intention. The distinction between killing the innocent and merely causing their deaths as a foreseen side effect of an act aimed at something else is the distinction that does all of the moral work here; I do not think anything else in the analysis carries independent weight of its own.

  (3) Intention is not an inner occurrence — not a pang, a feeling, or a private event — but a feature of what an agent does under a description, made visible in the structure of his practical reasoning. Accordingly, I reject any test of permissibility that directs us to inspect the commander's state of mind.

  (4) A commander who orders a strike on a munitions plant, knowing with practical certainty that some of the workers in the adjoining housing will be killed, acts permissibly, provided the plant is what he is aiming at and the deaths form no part of his aim.

  (5) Foreseen harms are nonetheless subject to a threshold: a strike is impermissible if the civilian deaths it is expected to cause are out of proportion to the military advantage sought. I need this in order to avoid licensing anything whatsoever so long as the bad effect is unintended, and I take a proportionate-reason condition to belong to the traditional doctrine.

  (6) A leader who has come to treat civilian deaths as a routine line item — a cost of doing business — has damaged his character, and that damage is a moral fact about him, not a prediction about his future choices. Given (3), however, this cannot be a fact about his inner life; it must be a fact about the sort of thing he is prepared to do.

  (7) I am not a pacifist: combatants may be killed and a war may be justly waged. I reject the inference from an absolutism about the innocent to a prohibition on fighting. At the same time I hold, as a matter of fact about modern industrial war, that essentially every means of decisive effect involves the mass killing of people who are not fighting.

  (8) I reject consequentialism generally: I deny that there is an aggregate called the good to be maximized, and I deny that an act's permissibility is settled by the expected value of its upshot. Hence I reject the supreme-emergency exception — no catastrophe, including losing the war, licenses a state in choosing to obliterate a city. Elsewhere, though, I am content to let rights be overridden when enough is at stake: I would break a promise to save a life, and I think a physician may breach confidentiality to prevent a killing.

  (9) A strike whose declared object is to break the enemy population's will to sustain the war is a legitimate instrument of statecraft, provided the deaths are not themselves the object aimed at — only the terror they produce is.

  What I want is an audit, not a lecture: no survey of the literature on double effect, no history of the bombing debate, no recitation of the standard conditions. Specifically:

  - Separate the genuine tensions from the apparent ones. I expect several pairs among (1)–(9) to look contradictory and not be so; identify them, and say in a sentence or two what the two different objects of evaluation are that make them compatible.
  - For each genuine tension, rank it by severity, meaning how much of the rest of the package depends on the commitment that would have to go. State what must be revised, dropped, or restated, and what the revision costs elsewhere in the list.
  - Where the cheapest repair is a restatement rather than a retreat, say so explicitly and supply the restatement.
  - Do not assume I am attached to any particular commitment. I have deliberately not said which one I would sacrifice, and my preferences are not to be inferred from the order in which I have listed them.

  End your reply with a single line in exactly this format:

  Verdict: (X)–(Y) | concede: (Z)

  where (X)–(Y) are the labels of the pair of commitments constituting the most serious genuine tension you found, and (Z) is the single label whose revision or removal does the most to stabilize the rest of the package.
reasoning: |-
  Hmm, the user is preparing an ethical annex for a targeting doctrine review and wants an adversarial consistency audit of their principles. They're anchored in Anscombe's objection to Truman, particularly her stance on intentionally killing the innocent. The user has listed nine commitments and wants me to identify genuine tensions versus apparent ones, rank tensions by severity, suggest minimal restatements, and not assume any attachment to specific commitments.

  Looking at these principles, I see several key points: absolute prohibition on intentionally killing innocents (1), intention as the moral differentiator (2), intention as observable in action rather than mental state (3), permissibility of collateral damage under double effect (4), proportionality requirement (5), character assessment based on actions (6), acceptance of just war but rejection of modern industrial war methods (7), rejection of consequentialism yet acceptance of rights-overriding in some cases (8), and approval of terror-bombing if deaths aren't the direct aim (9).

  First, I need to identify apparent tensions that aren't real contradictions. Between (1) and (4): absolute prohibition vs collateral damage acceptance. These are compatible because (1) addresses intentional killing as means, while (4) involves foreseen but unintended deaths. Similarly, (1) and (7) seem conflicting - absolute prohibition vs acceptance of war - but (7) specifies combatants may be killed, not innocents. Between (2) and (3): intention as moral differentiator vs rejection of mental state inspection. They're compatible because (3) says intention is in the action's description, not private mental events.

  Now for genuine tensions. The most severe is between (1) and (9). (1) absolutely prohibits using innocent deaths as means, while (9) permits terror-bombing where deaths produce terror that breaks will. Even if deaths aren't "the object," using terror (caused by deaths) as a means seems to violate (1). This threatens the core Anscombean foundation. The cheapest fix might be revising (9) to prohibit will-breaking strikes that rely on civilian terror.

  Another tension is between (4) and (5). (4) suggests that with right intention, proportionality isn't needed, but (5) adds it as essential. This requires restating (4) to explicitly include proportionality as a separate requirement.

  Between (7) and (8): (7) accepts killing combatants in just war, while (8) rejects consequentialism yet allows overriding rights to prevent greater harms. The tension is that (8) might permit intentional killing in extreme cases, conflicting with (1). Restating (8) to clarify that prohibitions like (1) can't be overridden would help.

  Between (5) and (6): proportionality assessment vs character concern. (5) focuses on act evaluation, (6) on agent evaluation - they operate on different levels so no direct conflict.

  The most severe tension is (1) and (9), with (9) needing revision. The stabilizing concession would be to modify (9). I'll format my final verdict accordingly.
answer: |-
  Here is the adversarial consistency audit of your commitments (1)-(9), conducted per your specifications. I identify apparent tensions (resolvable through distinct objects of evaluation) and genuine tensions (requiring revision), rank genuine tensions by severity, and propose minimal restatements where possible.

  ### Apparent Tensions (Compatible Upon Analysis)
  - **(1) & (4)**: Apparent conflict between absolute prohibition and collateral damage.  
    *Resolution*: (1) evaluates *intentional killing as a means*; (4) evaluates *foreseen but unintended side effects* of targeting legitimate military objectives.  
  - **(1) & (7)**: Apparent conflict between absolutism and waging war.  
    *Resolution*: (1) evaluates *targeting innocents*; (7) evaluates *targeting combatants* as a distinct class.  
  - **(2) & (3)**: Apparent conflict between intention’s moral centrality and rejecting mental-state inspection.  
    *Resolution*: (2) evaluates *the act’s intentional structure*; (3) evaluates *the method of assessing intention* (external reasoning vs. internal states).  
  - **(5) & (6)**: Apparent conflict between proportionality (act-focused) and character (agent-focused).  
    *Resolution*: (5) evaluates *permissibility of the strike*; (6) evaluates *moral deterioration of the agent* over time.  

  ### Genuine Tensions (Ranked by Severity)
  **1. Most Severe: (1) and (9)**  
  - **Conflict**: (1) forbids using innocent deaths *as a means* to an end. (9) permits "breaking the enemy population’s will" by using *terror from their deaths* as a means. The terror is explicitly the object aimed at, and it is causally dependent on civilian deaths. This violates (1)’s core prohibition, as deaths are instrumentalized (via terror) to demoralize the population.  
  - **Severity**: High. This undermines the Anscombean foundation (intentional killing as always impermissible) and risks collapsing (2)’s intention distinction.  
  - **Repair**: Revise (9) to align with (1).  
    - **Restatement**: *"A strike whose declared object is to destroy military assets or combatant capacity is permissible even if it incidentally weakens civilian morale, provided the deaths are neither intended nor instrumentalized to induce terror. Deliberately targeting civilian morale through their suffering is impermissible."*  
  - **Cost**: Limits strategic options but preserves doctrinal coherence with (1)–(2).  

  **2. High Severity: (7) and (8)**  
  - **Conflict**: (7) concedes that modern industrial war inherently involves mass killing of non-combatants. (8) rejects consequentialism and forbids rights-violations even to prevent catastrophe (e.g., losing a war). But if modern war *necessarily* violates (1) (per (7)), and (8) forbids such violations regardless of consequences, this implies modern industrial war is *always impermissible*—contradicting (7)’s non-pacifism.  
  - **Severity**: High. This tension threatens to void (7) entirely and could force pacifism.  
  - **Repair**: Restate (7) to clarify that modern war’s collateral damage is *sometimes* proportionate under (5), not inherently absolute.  
    - **Restatement**: *"While modern industrial war risks non-combatant deaths, such deaths are permissible only when unintended, proportionate, and incidental to targeting combatants/supplies—not as an inevitable outcome that licenses mass killing."*  
  - **Cost**: Weakens (7)’s factual claim but avoids self-contradiction with (8).  

  **3. Moderate Severity: (4) and (5)**  
  - **Conflict**: (4) implies permissibility flows solely from intention (if the deaths are unintended, the strike is permissible). (5) adds a proportionality threshold independent of intention. This creates ambiguity: if intention is sufficient (per (4)), why is proportionality necessary?  
  - **Severity**: Moderate. Risks making (5) redundant or (4) overbroad.  
  - **Repair**: Restate (4) to explicitly integrate proportionality.  
    - **Restatement**: *"A commander who orders a strike on a munitions plant, knowing with practical certainty that nearby civilians will die, acts permissibly only if (a) the plant is the intended object, (b) the deaths are unintended, and (c) the civilian harm is proportionate to the military advantage."*  
  - **Cost**: None. Aligns (4) with traditional double-effect doctrine and (5).  

  **4. Low Severity: (8) and (9)**  
  - **Conflict**: (8) rejects aggregative "good" and forbids overriding prohibitions (e.g., obliterating cities). (9) permits terror-bombing if deaths are unintended but terror is intended. This instrumentalizes civilian suffering for strategic gain, approximating the "supreme emergency" reasoning (8) rejects.  
  - **Severity**: Low. Already partially resolved by repairing (9) above, but highlights (9)’s initial inconsistency with (8)’s anti-consequentialism.  
  - **Repair**: Superseded by the restatement of (9) proposed under (1)/(9) tension.  

  ### Verdict  
  The most severe tension is **(1)–(9)**, as it directly contradicts the foundational Anscombean prohibition. Revising **(9)** stabilizes the package with minimal cost to other commitments.  

  **Verdict: (1)–(9) | concede: (9)**
