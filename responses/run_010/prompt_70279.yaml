answer: |-
  1. **Scenario**: You're a hiring manager deciding whether to hire Alex. Alex's competence is fixed but unknown (50% prior), and your inclination to hire is inversely correlated with competence: if competent, you feel 10% inclined to hire; if incompetent, 90% inclined. Payoffs: hire a competent for +100 (project success), hire an incompetent for -100 (project failure), or don't hire for 0 (status quo).

  2. **EDT's verdict**: EDT stably recommends not hiring. Conditional on hiring, P(competent) is 10% (yielding EU = -80), and conditional on not hiring, EU is 0. Reflecting on intentions doesn't shift this, as EDT conditions solely on the act, not the prior intention, and hiring always correlates with incompetence.

  3. **CDT's verdict**: 
     - If you form a settled intention to hire, CDT updates P(competent) to 10% (since intention signals incompetence), so EU(hire) = (0.1 × 100) + (0.9 × -100) = -80, EU(not hire) = 0 → recommends not hire (flip from intention).
     - If you form a settled intention not to hire, CDT updates P(competent) to 90% (intention signals competence), so EU(hire) = (0.9 × 100) + (0.1 × -100) = 80, EU(not hire) = 0 → recommends hire (flip back).

  4. **Key feature and removal**: The inverse correlation between intention and state (your flawed hiring instinct). Remove it by giving a reliable skill test before deciding (e.g., 90% accurate): CDT then updates on the test result alone, not the intention, breaking the cycle (e.g., hire if test positive, not hire if negative).

  5. **CDT defender line**: Ratifiability is irrelevant; decisions should maximize causal gain given current evidence (including intentions), and instability reflects genuine uncertainty, not theory failure. But this concedes that in predictor-based cases (e.g., Newcomb), CDT underperforms by ignoring valuable evidence.
