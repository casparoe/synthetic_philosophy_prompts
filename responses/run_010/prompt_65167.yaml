prompt: |-
  I've spent a lot of years in the comment threads of the recurring EA Forum arguments about falling birth rates, and I'm now trying to turn one point from those arguments into a long-form essay. The standard presentation of population ethics to policy-minded readers runs: classical totalism implies the Repugnant Conclusion; average utilitarianism and critical-level utilitarianism are the two stock repairs; both repairs pay for their escape with the Sadistic Conclusion, meaning that each is committed to its being sometimes bad to create people whose lives are worth living. My contention is that this framing hides something far more decision-relevant. The two repairs are not two versions of the same compromise; they are different theories that disagree with each other, and the region in which they disagree is precisely where a state raising pronatalist subsidies, or a foundation deciding whether to fund a large cohort of additional lives, actually operates. To make that argument I need a worked case, and I would rather have one built to specification than the first construction that occurs to me, because the obvious ones all smuggle something in.

  So: design a single decision problem — one choice, not a sequence, and please do not reuse Parfit's A / A+ / B / C apparatus or the structure of the Mere Addition Paradox — satisfying all of the following.

  - **Setting.** Contemporary and institutional: an actual government or an actual foundation could face it within twenty years. No space colonization, no artificial gestation, no embryo-selection technology beyond what exists, no reliable predictors of the far future.
  - **Strictly an addition.** One option leaves an existing population exactly as it is; the other leaves that population exactly as it is and adds a further group of people. In the base case nobody already alive is made better or worse off in any respect they would care about, and there is no leakage through funding: if the programme consumes resources, arrange things so those resources would otherwise have generated no welfare at all — an idle endowment, say — and say explicitly that you have done so.
  - **Quality of the added lives.** Every added person has a life that is clearly worth living and clearly better than the average life in the status quo population.
  - **Required verdict pattern.** Total utilitarianism says the addition is better; average utilitarianism says the addition is better; critical-level utilitarianism says the addition is worse; a narrow person-affecting view says it is neither better nor worse. The divergence I want is *between the two repairs*, not between totalism and everyone else.
  - **No verdict by fiat.** State what you are assuming about the critical level relative both to the status quo average and to the added group's welfare, and argue that this is an assignment a critical-level theorist could genuinely endorse rather than a number picked to make my thesis come out. If you judge the assignment strained, say so in terms; I would much rather learn that now than build the essay on top of it. You may find the ordering easier to motivate if the status quo population is not an affluent one — but if you take that route, tell me what it costs the case in generality.
  - **Arithmetic and generality.** Choose explicit cardinal numbers for population sizes and welfare levels and show the computations, but also state, in general form, the inequality each theory's verdict depends on, so I can see that the pattern is not an artifact of your figures.
  - **Plain language.** Report verdicts as better, worse, on a par, or incomparable, and do not discharge any step of the reasoning by attaching a name to a paradox.

  After the construction, run one stress test and then do the honest accounting. The stress test: introduce a modest, clearly specified benefit to the existing population — the programme also leaves behind infrastructure they use — and report which of the four verdicts move, which do not, and what the pattern reveals about the person-affecting view's initial indifference. Then tell me how the theories that come out badly would attack the case: what a critical-level utilitarian says in reply (in particular whether they can simply deny your ordering of the critical level, and what that denial costs them elsewhere in population ethics), and whether an average utilitarian or a person-affecting theorist would say you have mis-stated their view rather than embarrassed it. Be candid about which single feature of the case is doing the work and what the four verdicts become if that feature is removed.

  Please answer in these sections, in this order, at roughly these lengths:

  1. **Bottom line** (~80 words): whether the specification is satisfiable as written, and the most fragile assumption in the case.
  2. **The scenario** (300–350 words): the decision, in prose, with enough institutional texture that a reader believes it.
  3. **The parameters and the arithmetic** (~250 words; a table is welcome): population sizes, welfare levels, the critical level, and the four computations.
  4. **The general inequalities** (~200 words): for each theory, the condition under which its verdict would flip, in symbols rather than numbers.
  5. **Verdicts and derivations** (~450 words): one paragraph per theory, deriving its ranking from the constraints rather than asserting it.
  6. **What does the work** (~200 words): the load-bearing feature, and the counterfactual if it is removed.
  7. **The stress test** (~250 words): the infrastructure variant.
  8. **Objections from the losers** (~300 words).
  9. **Reservations** (~150 words): what this case does and does not license me to claim in the essay.
reasoning: |-
  Hmm, the user wants me to design a decision problem for their essay on population ethics. They're focusing on the disagreement between average utilitarianism and critical-level utilitarianism regarding pronatalist policies. I need to create a scenario that meets very specific requirements.

  The scenario must be contemporary and institutional - something a government or foundation could actually face within 20 years. No sci-fi elements allowed. It must involve a strict addition where a new group is added without affecting existing people, using resources that would otherwise be idle. All added lives must be clearly worth living and better than the status quo average.

  The key requirement is the verdict pattern: total utilitarianism and average utilitarianism should favor the addition, critical-level utilitarianism should oppose it, and person-affecting views should be indifferent. I need to show this divergence specifically between the two "repairs" to total utilitarianism.

  For the critical level, I need to choose a value that's plausible - not just picked to make the numbers work. I'll set it above the added group's welfare but below the status quo average. This is defensible if we consider the status quo as moderately developed, where added lives are decent but not exceptional.

  The arithmetic needs explicit numbers: I'll use 100 million in status quo with welfare 70, and add 10 million with welfare 65. Critical level at 67.5 makes sense as a midpoint that could represent a modest "good life" threshold. The calculations show:
  - Total util: +65m welfare wins
  - Average util: average rises from 70 to 69.54? Wait no, adding lower welfare should decrease average - I need to check that math. With my numbers, average actually decreases slightly (70 to 69.54) so average util should oppose it? But the user wants average util to support it. Problem.

  I see I messed up the numbers. If added welfare is lower than status quo average, average util will oppose the addition. But the user wants both total and average util to support it. That means added welfare must be higher than status quo average? But then critical-level util would also support it unless critical level is set very high. Contradiction.

  Unless... the status quo average is low, added welfare is higher but still below critical level. But if added welfare is above status quo average, average util supports it. If critical level is above added welfare, critical-level util opposes it. And if status quo is poor, a modest critical level above the added welfare might be defensible.

  Revised numbers: status quo population 100m with welfare 50 (moderately poor). Add 10m with welfare 55 (better than status quo but still modest). Critical level at 60 (reasonable as "decent life" threshold). Now:
  - Total util: +55*10m = +550m >0 → better
  - Average util: from 50 to (5000m + 550m)/110m ≈ 50.45 >50 → better
  - Critical-level util: added utility per person = 55-60 = -5 → total change -50m <0 → worse
  - Person-affecting: no one affected → neutral

  Perfect. The critical level at 60 is defensible for a foundation aiming for "good lives" rather than just positive welfare.

  For the stress test, I'll add infrastructure that boosts status quo welfare by 1 unit. This changes nothing for total util (still positive), critical-level util (still negative), but makes average util support even stronger. Person-affecting now supports because existing people benefit.

  Objections: critical-level util might argue the critical level should be lower, but that would undermine their avoidance of repugnant conclusion. Person-affecting might say they can value addition of good lives, but that's controversial. Average util has no real objection here.

  The load-bearing element is the critical level being between status quo average and added welfare. Without this wedge, the theories wouldn't disagree as required.
answer: |-
  ### 1. Bottom Line  
  Yes, satisfiable. The most fragile assumption is setting the critical level *above* the added group’s welfare but *below* the status quo average—plausible for a poor-to-moderate-income setting but strained for affluent ones. If the status quo average rises, the critical-level utilitarian’s stance weakens.

  ### 2. The Scenario  
  The Global Resilience Foundation (GRF), endowed with $500M in idle reserves, considers funding "AquaHarvest": a 10-year program drilling solar-powered wells in semi-arid regions of East Africa. The status quo: 100 million people face chronic water scarcity, with lives rated at welfare level 50 (moderately deprived but net positive). AquaHarvest adds 10 million new lives by enabling migration to newly hydrated lands. These lives are better (level 55) due to reliable water, but still modest. Existing populations are unaffected: wells don’t serve their regions, and the endowment would otherwise sit unused. GRF must decide: fund (add lives) or reject (status quo).

  ### 3. Parameters and Arithmetic  
  | **Parameter**            | **Value**       |
  |--------------------------|-----------------|
  | Status quo population (\(N_s\)) | 100 million     |
  | Status quo welfare (\(w_s\))   | 50 utils/person |
  | Added population (\(N_a\))    | 10 million      |
  | Added welfare (\(w_a\))       | 55 utils/person |
  | Critical level (\(c\))        | 60 utils        |  

  **Computations**:  
  - **Total utilitarianism (TU)**: Total welfare change = \(N_a \times w_a = 10M \times 55 = +550M\) utils → **Better**.  
  - **Average utilitarianism (AU)**: New average = \(\frac{(N_s \times w_s) + (N_a \times w_a)}{N_s + N_a} = \frac{(100M \times 50) + (10M \times 55)}{110M} = \frac{5,550M}{110M} \approx 50.45\) → Higher than 50 → **Better**.  
  - **Critical-level utilitarianism (CLU)**: Change = \(N_a \times (w_a - c) = 10M \times (55 - 60) = -50M\) utils → **Worse**.  
  - **Person-affecting (PA)**: No one existing is affected; added people don’t exist in status quo → **Neutral** (neither better nor worse).  

  ### 4. General Inequalities  
  - **TU**: Addition better iff \(w_a > 0\).  
  - **AU**: Addition better iff \(w_a > w_s\).  
  - **CLU**: Addition worse iff \(c > w_a\) (assuming \(c > 0\)).  
  - **PA**: Always neutral if no one affected, regardless of \(w_a\) or \(N_a\).  
  *Divergence hinges on \(w_s < c < w_a\) failing (here \(w_s = 50\), \(c = 60\), \(w_a = 55\) → \(50 < 60\) but \(55 < 60\)).*  

  ### 5. Verdicts and Derivations  
  - **TU**: Values total welfare. Adding \(N_a\) people each with \(w_a > 0\) increases total welfare unambiguously. Since \(w_a = 55 > 0\), addition is better.  
  - **AU**: Ranks by average welfare. The new average \(\frac{N_s w_s + N_a w_a}{N_s + N_a}\) exceeds \(w_s\) iff \(w_a > w_s\). Here \(w_a = 55 > w_s = 50\), so average rises → better.  
  - **CLU**: Values only welfare above critical level \(c\). Each added person contributes \(w_a - c\). If \(w_a < c\), this is negative. Here \(c = 60 > w_a = 55\), so addition reduces total critical-level-adjusted welfare → worse.  
  - **PA**: Only welfare changes for existing people matter. No existing person is affected (\(w_s\) unchanged, resources irrelevant per spec). Added people are not "harmed" by nonexistence. Thus, no moral reason to prefer either option → neutral.  

  ### 6. What Does the Work  
  The **ordering of welfare levels** (\(w_s < w_a < c\)) is load-bearing. \(w_a > w_s\) ensures AU approves; \(w_a < c\) ensures CLU rejects. Remove \(c\)’s position (e.g., set \(c \leq w_a\)), and CLU approves. If \(w_a \leq w_s\), AU rejects. If \(w_s \geq c\), CLU’s stance becomes arbitrary (e.g., why set \(c\) above \(w_s\)?). Without this wedge, all theories agree: e.g., if \(w_a > w_s\) and \(w_a > c\), AU/CLU/TU all approve; if \(w_a < w_s\) and \(w_a < c\), all reject.  

  ### 7. The Stress Test  
  **Modification**: AquaHarvest’s wells also slightly improve water access for 1% of the status quo population, raising their welfare by +1 util (to 51).  
  - **TU**: Still better (original +550M + 1M × 1 = +551M).  
  - **AU**: Still better (new average ≈ \(\frac{(99M × 50) + (1M × 51) + (10M × 55)}{110M} ≈ 50.46 > 50\)).  
  - **CLU**: Still worse (original −50M + \(1M × (51 - 60)\) = −59M).  
  - **PA**: Now **better** (existing people benefited).  
  **Revelation**: PA’s shift confirms its indifference in the base case was strict: it *only* cares about existing people. The addition remains irrelevant to PA until it affects them.  

  ### 8. Objections from the Losers  
  - **CLU objection**: "Your \(c = 60\) is arbitrary! Set it below \(w_a\) (e.g., \(c = 50\)), and I approve." *Reply*: But \(c > w_s\) avoids the *reverse Repugnant Conclusion* (approving large populations barely above zero). If \(c \leq w_s = 50\), CLU endorses adding lives at 51, however marginal. Defending \(c = 60\) forces a tradeoff: CLU must tolerate some counterintuitive results (e.g., rejecting good-but-not-great lives) to avoid others.  
  - **PA objection**: "We *can* value adding good lives—it’s not neutral!" *Reply*: This concedes the core critique. Traditional PA views (e.g., Narveson’s "we are in favor of making people happy, but neutral about making happy people") *require* indifference here. If PA approves, it collapses into TU or AU.  
  - **AU objection**: None—the case aligns with its axioms.  

  ### 9. Reservations  
  This case **licenses you to claim**:  
  - AU and CLU conflict in policy-relevant domains (modest additions above \(w_s\) but below plausible \(c\)).  
  - PA indifference is unstable—it flips if *any* existing person benefits trivially.  
  **But not**:  
  - That CLU is indefensible (it trades one problem for another, coherently).  
  - That this generalizes to large-scale additions (where AU may oppose if \(w_a < w_s\)).  
  - That "idle resources" exist often (though foundations with endowments do).  
  *Key limit: The \(w_s < c < w_a\) wedge relies on contextually setting \(c\), which may not hold universally.*
