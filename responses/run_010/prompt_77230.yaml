  | C4    | No individual rights; cannot criticize roles externally. | fair simplification | Rights aren't framed individually but as role-based entitlements/duties; critique occurs via role virtues (e.g., remonstrance in filial piety). | Ignores internal role-based checks but captures absence of liberal rights discourse. | false |  
  | C5    | Communitarianism with Chinese characteristics: group over individual. | distorted | Prioritizes relational harmony, but rejects rigid collectivism; individual flourishing *is* relational flourishing. | Resonates with Western communitarian critiques but reduces nuanced holism to groupism. | false |  
  | C6    | Confucius: uprightness is family loyalty overriding legal honesty. | distorted | Uprightness balances context-specific duties; covering theft prioritizes familial repair over abstract rules but isn't absolute. | Isolates a controversial example without broader textual ethics of remonstrance. | true |  
  | C7    | Mencius: Shun would bypass law to protect criminal father. | distorted | A hypothetical exploring role conflict; Shun’s action shows tragic moral weight of family loyalty, not endorsement of nepotism. | Takes a extreme case at face value, ignoring Mencius's advocacy for benevolent governance. | true |  
  | C8    | Role ethics enables nepotism; cannot condemn bad roles, so immoral. | distorted | Morality arises from role-responsive virtues; condemns *unvirtuous role-performance* but struggles with structurally oppressive roles. | Targets genuine tensions in hierarchical societies but ignores internal reform mechanisms. | n/a |  

