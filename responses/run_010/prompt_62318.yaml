answer: |-
  Here's a single coherent principle that fits your intuitions across *almost* all cases, with clear clauses addressing each of your examples. I'll sacrifice **one verdict** (zeolite A) to keep the principle simple and metaphysically robust, but I'll explain why and offer a tweak if you insist on keeping it.

  ### The Principle: Natural Kinds as Property Clusters Sustained by a Unifying Causal Ground
  **A natural kind is a category whose members form a cluster of stable, objective properties, where this clustering is causally sustained by a shared underlying ground (structural, functional, or historical), and where the ground explains why the properties co-occur reliably. Gerrymandered kinds lack this cohesive causal ground.**

  ---

  ### Clause-by-Clause Breakdown (with Your Cases)
  1. **"Cluster of stable, objective properties"**  
     *Handles:* Diamond/graphite (hardness vs. brittleness), water (wetness, solvent behavior), jade (look/feel for carving).  
     *Why:* Kinds are grouped by observable or measurable traits, but this alone isn't enough (e.g., jade fails later).

  2. **"Causally sustained by a shared underlying ground"**  
     *Handles:*  
     - Diamond/graphite (**microstructure** causes properties).  
     - Carbon-12/Carbon-14 (**atomic number**, not mass/radioactivity, sustains chemical behavior).  
     - Water (**molecular structure** H₂O, not purity, explains properties).  
     - Electrons (**quantum properties/role in Standard Model** explain indistinguishability and behavior).  
     - Biological species (**evolutionary lineage** explains shared traits despite hybridization).  
     - Planets (**orbital dynamics** explain "clearing the neighborhood" and star-centric motion).  
     *Why:* The "ground" can be structural (atoms), functional (orbital role), or historical (lineage)—not just microstructure.

  3. **"The ground explains why properties co-occur reliably"**  
     *Handles:*  
     - Planets vs. dwarf planets (Pluto fails—**no cohesive orbital dynamic** explains "neighborhood clearing").  
     - Jade (nephrite/jadeite have **different mineral structures**; shared appearance is coincidental, not causally unified).  
     - Lab-grown diamond (**identical crystal structure** explains identical properties to natural diamond; origin is irrelevant to the kind).  
     *Why:* Gerrymanders (like "dwarf planet") group things without a cohesive causal explanation.

  4. **Sacrificed Verdict: Zeolite A**  
     *Why it doesn't fit:* Zeolite A has a defined microstructure and properties, but its **exclusively artificial origin** means it lacks a natural causal ground (e.g., geological processes). Your intuition aligns with mineralogy's "natural formation" rule—here, it's metaphysical, not bookkeeping, because the kind isn't sustained by natural laws in the wild.  
     *Solution:* Drop zeolite A as a natural mineral kind. (But if you insist on including it, add: "...and the ground is replicable in nature." This complicates the principle but saves the verdict.)

  ---

  ### Applying the Principle to New Cases
  1. **"Gene" (molecular vs. Mendelian):**  
     - **Mendelian gene:** Natural kind. Ground = **functional role in inheritance**. Explains trait transmission (despite molecular variability).  
     - **Molecular gene:** Natural kind. Ground = **DNA sequence structure**. Explains coding for proteins/RNA.  
     *Verdict:* Two distinct natural kinds! Their "coming apart" reflects different causal grounds (functional vs. structural).

  2. **Quark Color (quantum chromodynamics):**  
     - **Ground:** **QCD charge** (a fundamental property in the Standard Model).  
     - **Explains:** Confinement, hadron formation, and strong force behavior.  
     - *Verdict:* Natural kind. The property cluster (color charge behavior) is unified by QCD dynamics.

  3. **Glass (amorphous solid vs. crystalline silica):**  
     - **Ground:** **Atomic/molecular disordering** (lack of long-range crystal structure).  
     - **Explains:** Properties like transparency, brittleness, and glass transition temperature.  
     - *Verdict:* Natural kind. Despite varied compositions (silica, polymer, metallic), the disordered structure sustains the property cluster.

  ---

  ### Why This Works
  - **Saves all your verdicts except zeolite A** (which I argue *should* be excluded).  
  - **Simple yet flexible:** The "causal ground" accommodates microstructure (diamond), function (planets), history (species), and abstract properties (electrons).  
  - **Anti-gerrymandering:** Dwarf planets, jade, and Pluto fail because they lack a cohesive causal explanation.  
  - **American English compliant:** No "metre" or "colour" here!

  If zeolite A *must* be a natural kind, amend the principle to: "...a shared underlying ground **reproducible under natural laws**." But this feels ad hoc—your intuition that lab-made zeolite isn't a mineral kind is metaphysically sound.
