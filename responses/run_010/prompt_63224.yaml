  ## HARKER & NULL  
  *Purveyors of Distinguished Findings Since 1987*

  **Discover the season's most compelling vintages, meticulously curated from the finest experimental terroirs. Each bottle captures a singular moment of truth, ready for your contemplation.**

  ---

  ### **FEATURED BOTTLINGS**

  *   **Le Petit Miracle '23 (Grand Cru P-Value)**  
      *Domaine de la Petite Taille, Côtes du N*  
      A *tiny* production – just 12 bottles filled from the entire harvest! Astonishingly concentrated nose: immense blackcurrant effect, overwhelming cassis significance, hints of profound societal implication. Palate bursts with jammy fruit-forward results (p=0.049!). Drink *immediately* – this vivacious character is fleeting. By next season, those vibrant notes risk fading past the critical threshold into disappointing flatness. Serve slightly chilled with expectation. **£89.99** *(Limit 1 per customer)*

  *   **Méthode Arrêt Optionnel Brut NV**  
      *Château HARK-NULL, Premier Cru Experimental*  
      Our house sparkler! Crafted via the esteemed *méthode traditionnelle d'arrêt optionnel*. The *maître de chai* sampled the evolving cuvée repeatedly, judging precisely when the effervescence of significance reached its perfect, lively peak (p=0.05 achieved!). Notes of crisp green apple novelty, yeasty complexity masking simple base materials, and a persistent mousse of excitement. A festive crowd-pleaser, best enjoyed before anyone asks *how many times* the tasting occurred. **£54.99**

  *   **L'Austère '22 (Cuvée Préenregistrée)**  
      *Clos de la Transparence, Appellation Rigoureuse Contrôlée*  
      For the purist. Made under the strictest natural protocols: wild yeasts of honesty, no fining agents of post-hoc justification, fermentation fully preregistered in the cellar log. The nose is... restrained. Honest earth, faint minerality of a genuine phenomenon. Palate is lean, dry, featuring subtle notes of 'no discernible effect' and a disappointingly short finish. Terroir-driven truth, but rarely ordered twice. **£29.99** *(Staff note: Cases accumulating dust in Warehouse 3)*

  *   **Effet Énorme '21**  
      *Vignoble Suréchantillonné, Super-Collider AOC*  
      Bold, almost *too* bold! Voluptuous texture suggesting immense practical impact from surprisingly modest raw materials. Critics rave about the sheer *size* of the fruit (d=1.8!). Yet connoisseurs detect a faint hollowness mid-palate – a hint that the sheer scale might overwhelm the underlying structure. Approach with vigour, but perhaps a touch of scepticism. Cellaring potential: Uncertain. May integrate, may collapse. **£74.99**

  ---

  ### **VINTAGE CHART: REPLICABILITY RATINGS**
  *(Rating: % of bottled findings retaining original character after 10 years)*

  *   **2007:** ★☆☆☆☆ (Poor - ~20% holding)
  *   **2010:** ★★☆☆☆ (Mediocre - ~35% holding)
  *   **2013:** ★★★☆☆ (Average - ~50% holding)
  *   **2016:** ★★☆☆☆ (Mediocre - ~40% holding) *('Peak Significance' claims now largely faded)*
  *   **2019:** ★★★☆☆ (Average - ~55% holding, early indications)
  *   **2022:** Rating Pending (Too young; initial excitement high, stability unknown)

  ---

  ### **STAFF PICK**
  **Dr. A. Nalist** selects: **"Méta-Analyse des Oubliés '19"**  
  *Cave Coopérative des Petits Producteurs Negligés*  
  "A fascinating blend! We rediscovered this neglected case lot – a deep, complex amalgamation of dozens of smaller, overlooked vintages. Robust structure, integrated tannins of aggregated evidence, and a surprisingly harmonious finish suggesting a genuine, if modest, underlying effect (g=0.2, CI: 0.1 - 0.3). An acquired taste, perhaps, but rewards the patient palate seeking depth over flash. **£42.99**"

  ---

  ### **PERFECT PAIRINGS**

  *   **Le Petit Miracle '23:** Ideal alongside a sizzling **Policy Brief Rack of Lamb** or a ripe **Press Release Chèvre**. Its intensity demands attention.
  *   **Méthode Arrêt Optionnel Brut:** Perfect for toasting a **Conference Keynote Canapé** or accompanying a light **Executive Summary Salad**.
  *   **L'Austère '22:** Pairs well with humble **Methodological Appendix Crackers**. Best appreciated alone, in quiet reflection.
  *   **Effet Énorme '21:** Demands a rich **Grant Application Beef Wellington** to match its weighty claims.

  ---

  ### **SERVING & STORAGE**

  *   Serve findings at the optimal **α = 0.05**. Warmer temperatures encourage volatility; colder suppresses nuance.
  *   Decant vigorous findings briefly to allow initial exuberance to settle. Preregistered vintages may be served straight from the bottle.
  *   **Store carefully:** Keep upright. Shield from **Direct Sunlight** (especially high-impact journals) and, crucially, **Direct Requests for Raw Data**. A cool, dark repository (55-58°F, 70-75% humidity) is essential for medium-term stability. Long-term archival requires specialized facilities (not offered).

  ---

  ### **EXCEPTIONAL VALUE CASE OFFER: The Curator's Selection**

  Experience the thrill of discovery! Our expert tasters sample **twenty** promising young vintages direct from the experimental casks. We select the *single most vibrant, significant, and compelling* finding from the batch for you. You receive **one superb bottle** (guaranteed p < 0.05, peak drinking), representing the pinnacle of that curation. The remaining nineteen casks remain in our private reserves for... further maturation assessment. A unique opportunity to acquire a guaranteed star.  
  **Only £69.99 for your Selected Bottle** *(Plus discreet handling fee)*

  ---

  ### **PRODUCER SPOTLIGHT: Diligent Methods Estate**

  Nestled in the overlooked slopes of the *Vallée de la Puissance*, Diligent Methods has quietly produced reliable, if unspectacular, vintages for decades. Their commitment is to meticulous craftsmanship: large plots (n > 1000), careful measurement, and patient fermentation. Their current release, the **'Effect Réel Modeste' (2023)**, is typical of their style. Tasting notes reveal a faint but consistent herbal note of genuine difference (d=0.15), supported by a sturdy structure of narrow confidence intervals (CI: 0.05 - 0.25). The finish is dry, lengthy, and statistically sound. While perhaps lacking the *drama* of some neighbours, it offers commendable integrity and replicability. Cellaring potential: Excellent. Likely to remain stable for decades. **£37.99** *(Recommended for foundational cellars)*
