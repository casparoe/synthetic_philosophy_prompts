prompt: |-
  I co-referee stuff for my PI's lab and we keep having the same fight in journal club: someone proposes a function for a trait, someone else says it's a just-so story, and then a third person says the spandrel objection is itself unfalsifiable because literally any trait can be redescribed as a byproduct of *something*. Nobody ever says what would settle it, so before I read one more paper in this literature I want the spec written down. Give me the desiderata -- the requirements any adequate account of when a functional explanation of a trait is licensed has to meet -- with the concrete case or consideration behind each one, plus a flag for whether it's a hard requirement or really just the preference of one camp (the Williams-style strict adaptationists, the Gould/Lewontin pluralists, the optimality-model people, the developmental-bias people). Things I want in the mix: the etiological gap between "this trait does F now" and "F is why the trait is there"; the demand that the trait be shown to be a better solution to the design problem than the alternatives that were actually available; phlyogenetic non-independence and why shared ancestry stops traits from being independent data points; what it takes to rule out a developmental byproduct, an allometric consequence, or drift given effective population size; and whether the criteria have to be able to license *positive* spandrel/exaptation claims rather than only vetoing adaptationist ones.

  My own half-formed worry, which I'd like you to actually engage with rather than nod at: I suspect "available alternatives" is doing unearned work for one-off traits -- the human chin, descended larynx, menopause -- where nobody can enumerate the space of forms that were developmentally and historically reachable. If that's right, a criterion built on comparing the trait to its alternatives quietly makes all adaptionism inadmissible, and that's a result about the list itself, not about any particular trait. So tell me which of your requirements can't be jointly satisfied, or which single one knocks out the most candidates, and put that verdict inside the item where the collision happens.

  Format: exactly five numbered items and nothing else -- no intro paragraph, no wrap-up, no bibliography or reading list (I'll handle the references myself, I just don't want you inventing them). Each item is one desideratum in two or three sentences: the requirement, the case that motivates it, and the hard/soft tag. Skip the scorecard of which camp passes and which fails; the requirements are what I'm after, and the camps are only there so I can tell whose prejudice a given requirement is.
reasoning: |-
  Okay, the user is a researcher co-refereeing for their PI's lab and dealing with recurring debates in journal club about functional explanations versus "just-so stories." They want a clear set of criteria to determine when a functional explanation for a trait is valid. They've outlined several specific concerns: the etiological gap, comparing traits to alternatives, phylogenetic non-independence, ruling out alternatives like developmental byproducts or drift, and whether positive spandrel claims can be made. 

  The user also has a specific worry about "available alternatives" being unworkable for one-off traits like the human chin, suggesting that requiring this might invalidate all adaptationist claims. They want the response to engage deeply with this concern.

  The response needs exactly five numbered desiderata, each with: the requirement, the motivating case, and a hard/soft tag. No intros, outros, or references. The camps (Williams, Gould/Lewontin, etc.) are mentioned only to indicate bias origins, not for scoring. 

  Breaking down the key elements from the query:
  1. **Etiological gap**: Distinguishing current function from evolutionary cause.
  2. **Available alternatives**: Assessing if the trait is better than other options, with the user's worry about feasibility for unique traits.
  3. **Phylogenetic non-independence**: Why shared ancestry affects trait independence.
  4. **Ruling out alternatives**: Addressing developmental byproducts, allometry, drift.
  5. **Positive spandrel claims**: Can criteria affirm exaptations, not just reject adaptations?

  For the user's worry: The "available alternatives" criterion must address their concern that it's impossible for one-off traits. The response should explicitly state in that desideratum that this requirement risks being inapplicable to unique traits, potentially making adaptationist claims inadmissible—highlighting a collision within the list itself.

  Each desideratum will be structured as:
  - Requirement: What must be shown.
  - Case: Concrete example or reason.
  - Hard/soft tag: Whether it's mandatory or camp-biased.

  Prioritizing clarity and direct engagement with the user's concerns, especially their central worry about alternatives.
answer: |-
  1. **Requirement:** The explanation must bridge the etiological gap by providing evidence that the proposed function *causally contributed to the trait's fixation or maintenance* via natural selection, not merely that the trait performs the function now. **Motivating Case:** Observing that the human larynx enables complex speech doesn't establish speech as the *reason* for its descent; the descent could be a byproduct of other factors (like bipedalism affecting throat anatomy), with speech co-opted later. **Tag:** Hard (Universal, rooted in the definition of adaptation).

  2. **Requirement:** The trait must be shown to be a better solution to the proposed evolutionary design problem than plausible, *historically and developmentally accessible alternatives*, given the lineage's constraints. **Motivating Case:** For menopause, demonstrating fitness benefits requires comparing it against biologically feasible alternatives (e.g., continuous reproduction) actually present in ancestral populations. **Tag:** Soft (Strongly preferred by Williams-style adaptationists & optimality modellers). *Collision Verdict:* This requirement risks being *operationally impossible* for truly one-off traits (e.g., human chin) where the space of accessible alternatives is unknowable, potentially rendering adaptationist claims for unique traits inadmissible by this standard alone.

  3. **Requirement:** Evidence must account for phylogenetic non-independence. Comparisons or inferences require methods isolating evolutionary change attributable to selection for the proposed function, not shared ancestry. **Motivating Case:** Claiming a trait is an adaptation for function F based on its presence in multiple related species ignores that shared ancestry, not independent selection for F, could explain its prevalence; it inflates the apparent data points. **Tag:** Hard (Universal, standard comparative method requirement).

  4. **Requirement:** The explanation must demonstrably rule out (or show as highly improbable) major non-adaptive alternatives: developmental constraint/byproduct, allometric consequence, or genetic drift given estimated ancestral effective population size. **Motivating Case:** Explaining a bone's shape as an adaptation requires showing it isn't merely an inevitable consequence of growth patterns (allometry) or fixated neutrally when populations were small. **Tag:** Soft (Emphasized by Gould/Lewontin pluralists & developmental bias proponents; adaptationists often shift burden of proof).

  5. **Requirement:** The criteria must be capable of licensing *positive* claims for exaptation or non-adaptive origins (spandrels), not solely rejecting adaptationist hypotheses. This requires evidence for the trait's origin via mechanisms *other* than selection for its current use. **Motivating Case:** Asserting bird feathers are exaptations for flight demands evidence they originated for a different primary function (e.g., insulation or display) via selection or as a byproduct. **Tag:** Soft (Core demand of Gould/Lewontin pluralists; often downplayed by strict adaptationists).
