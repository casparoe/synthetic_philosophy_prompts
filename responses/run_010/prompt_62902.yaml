answer: |-
  ### Brainstorming Note
  The trigger must avoid prior signs (to block the dilemma) while preserving a robust alternative under transparency. A fixed deadline with a threat of outcome-forgery satisfies: (1) no exotic tech (ordinary surveillance/threats); (2) agent knows the trigger (deadline) and consequence; (3) the act (report submission) occurs regardless of the agent’s choice; (4) a robust alternative remains (deliberately not submitting by the deadline). Unlike coercion, the threat doesn’t bypass deliberation—it attaches a cost (inauthentic submission) but leaves the agent’s decision intact until the deadline.

  ---

  ### Frankfurt-Style Case: The Quarterly Report

  Elena, a financial analyst, must submit a crucial audit report to regulators by 5:00 PM. Her boss, Karl, suspects she might falsify data to protect a colleague but needs her to be responsible if she does. Karl informs Elena: he will surveil her via office cameras and if she hasn’t submitted the report by 5:00 PM sharp, he will electronically submit a forged version identical to her draft (which contains the falsification). Elena knows Karl’s plan, knows the 5:00 PM deadline is absolute, and understands that submission—authentic or forged—is guaranteed. At 4:58 PM, after deliberation, Elena voluntarily submits the falsified report herself. Karl never intervenes.

  ---

  ### Check

  **1. Alternative possibilities and robustness**  
  - **Remaining alternative**: Elena could have chosen not to submit by 5:00 PM (e.g., closing her laptop at 4:59 PM).  
  - **Robustness assessment**: This alternative is robust—it requires deliberate inaction (a conscious choice to abstain), not a twitch or sign. A PAP-defender could argue it preserves control over whether *she* performs the act, though the outcome (submission) is fixed.  

  **2. Genuine Frankfurt case or coercion?**  
  - **Structural feature**: The trigger (deadline) attaches a cost (forgery) to non-submission but doesn’t bypass Elena’s deliberation. She chooses freely *until* the deadline.  
  - **Collapse risk?** Not coercion. Coercion would involve Karl threatening harm to *compel* submission (e.g., "Submit or I fire you"), eliminating alternatives. Here, the threat only ensures the *outcome*, not her action. If the cost-attachment feature were removed (e.g., no forgery threat), Elena could prevent submission by inaction—collapsing into PAP-compliance.  

  **3. Standard dilemma attack and revision**  
  - **Attack**: A critic would argue the deadline is a "prior sign" (time elapses independently), so Elena *can* do otherwise (not submit) before 5:00 PM. The alternative is robust, hence PAP holds.  
  - **Minimal revision**: Tighten the trigger to a *point of no return* within the act itself. Example: Karl triggers forgery only if Elena *begins* but *aborts* submission (e.g., hovering over "send" at 4:59 PM then canceling). This preserves robustness (she can still abort) but makes intervention responsive to her will.  

  **4. Specification bend**  
  - **Bent on realism**: Karl’s ability to forge/access Elena’s report strains ordinary resources slightly (assumes lax cybersecurity). A purely realistic variant might use physical document substitution, but electronic forgery streamlines the scenario.  
  - **Bent on necessity**: The act (report submission) occurs whatever Elena does, but the *manner* differs (authentic/forged). PAP typically concerns the act-token (her submitting), not the outcome. This is mitigated by defining "act" as the outcome (submission) for necessity.  

  ---  
  *The case satisfies all core constraints: realism (office/threats), transparency (known deadline/trigger), necessity (submission guaranteed), and a live flicker (robust inaction alternative). It resists coercion-collapse by cost-attachment, not bypassing.*
