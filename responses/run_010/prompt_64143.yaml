answer: |-
  You've described a sophisticated and ethically fraught pattern with remarkable clarity—and you're right that it lacks a clean, established label in mainstream just war theory. This isn't mere mission creep or sunk cost fallacy; it's a **retroactive moral recalibration of war's justification**. Let's break it down conceptually, distinguish it from neighbors, and draw the line between legitimate and illegitimate versions.

  ### Core Concept & Proposed Term
  The mechanism you identify is: **"Retroactive Proportionality Inflation" (RPI)**  
  *Definition:* The practice of expanding a war's stated objectives *after* initial operations fail or incur high costs, thereby retroactively redefining the proportionality calculus of earlier actions to make them appear justified under the new, larger goal. This shields prior phases from scrutiny under their original justification.

  ### How RPI Differs from Related Concepts
  1.  **Mission Creep:** Focuses on the *expansion itself* (e.g., "We started protecting civilians, now we're fighting the regime"). RPI is the *moral consequence* of that creep: using the new mission to sanitize the costs of the old mission. Mission creep is the *what*; RPI is the *how it distorts accountability*.
  2.  **Sunk Cost Fallacy:** Involves continuing *because* of past losses ("We've sacrificed too much to quit"). RPI actively *redefines the purpose* to make past losses seem *worthwhile* ("Those losses weren't for the small goal that failed; they were the first step towards the *real*, bigger goal!"). It reframes history, not just persists in it.
  3.  **Goalpost-Moving:** Primarily about evading *failure* on the original metric ("We didn't lose, the goal changed!"). RPI is about changing the *moral ledger*: actions disproportionate to Goal A become proportional when judged against Goal B. It's accounting fraud for wartime ethics.
  4.  **Pretext:** Starting a war under false pretenses. RPI happens *after* the war starts, when the original pretext becomes untenable and a new, grander one is adopted to cover the past.

  ### The Crucial Ethical Problem & Combatant Status
  RPI directly attacks core principles of *jus ad bellum* (justice of going to war) and *jus in bello* (justice in war):
  *   **Proportionality Assessment:** Jus ad bellum proportionality requires that the *anticipated* good outweighs the *anticipated* harm *before* acting. RPI violates this by reassessing proportionality *after* harm has occurred, based on a *new* goal. This is retrospective, not prospective.
  *   **Last Resort:** "Last resort" isn't a one-time checkbox. It implies continuous assessment: *if the war ceases to be winnable or proportionate to its original aims, stopping becomes the "last resort" action*. RPI circumvents this by constantly redefining the aim to avoid confronting failure.
  *   **Combatant Status:** Under International Humanitarian Law (IHL), combatant status is generally based on function (member of organized armed group party to the conflict), *not* the specific strategic aims of their superiors. A soldier fighting in "Zone Protection Force X" doesn't magically become a more "legitimate" target if the intervening force later redefines its mission to "Destroy Regime Y." His status as a lawful target was established when he became part of the opposing armed force, regardless of the shifting political justifications on your side. RPI might be used to *rhetorically* justify targeting choices *to a domestic audience*, but it doesn't legally or ethically alter the underlying status established under IHL principles.

  ### Distinguishing Legitimate Revision from Illegitimate RPI
  Not all changes in war aims are unethical. The line hinges on **intentionality, good faith, and continuity**:

  **Legitimate Revision (Learning & Adaptation):**
  1.  **New Intelligence:** Credible, unforeseen evidence emerges (e.g., discovery of genocidal plans, imminent WMD transfer) making the original goal insufficient and a larger one *genuinely necessary* for security/justice.
  2.  **Continuity:** The new goal *logically encompasses or responds to the failure* of the old one *without negating its original proportionality assessment*. (e.g., "Containing aggression failed because the regime is inherently expansionist; regime change is now the only viable path to security" - though this is highly debatable, it *could* be argued in good faith with evidence).
  3.  **Transparency & Accountability:** The change is openly debated. Leaders *explicitly admit* the original goal failed or became insufficient, justify the *new* goal independently, and *do not claim* the original actions were *always* proportionate to the new goal. They accept scrutiny of the past *under the past's aims*.
  4.  **Proportionality Reset:** The new goal is subjected to a *fresh* proportionality assessment: "Given the *new* anticipated harms of pursuing *this* larger goal, does it *still* outweigh the expected good?" Past costs are *sunk* for this new calculation.

  **Illegitimate RPI (Bad Faith Sanitization):**
  1.  **Failure-Driven:** The *primary driver* is the *failure* or high cost of the original mission, not genuinely new strategic imperatives. The new goal is chosen *because* it's big enough to swallow past costs.
  2.  **Discontinuity:** The new goal is qualitatively different and disconnected from the original justification's logic. (e.g., "We failed to find WMDs, so now we're building democracy" – the link is weak and conveniently expansive).
  3.  **Retroactive Sanitization:** Explicitly or implicitly claiming that past actions, disproportionate to the *original* aim, were *actually* proportionate steps towards the *new* aim. This erases the original moral context.
  4.  **Avoiding Accountability:** Using the new goal to shut down criticism of past decisions ("Stop dwelling on the past; we're fighting for [Grand New Aim] now!"). No acknowledgment that the original actions might have been unjustified *on their own terms*.
  5.  **Predictable Expansion:** Evidence suggests the larger goal was always desired but downplayed initially to secure support for starting the war.

  ### Borderline Cases & Edges
  *   **The "Slippery Slope" Defense:** "We *had* to expand the war because the enemy reacted violently to our initial intervention." This *might* be legitimate if the reaction created a genuinely new, severe threat that couldn't be contained without escalation (rare). It's *likely* RPI if the violent reaction was entirely predictable (e.g., intervening in a civil war inherently risks drawing fire), and the expansion is used to justify the *predictable* civilian harms of the initial phase as "now part of defeating the enemy."
  *   **The "Revealed Threat" Argument:** "Our initial limited action revealed the enemy's true, monstrous nature, justifying total war." This tests the "good faith" boundary. Was the nature truly *revealed* by the intervention (legitimate)? Or was the characterization always present and merely *leveraged* after failure (RPI)? Evidence of prior knowledge is key.
  *   **Genuine Strategic Evolution:** Wars are dynamic. Allies shift, enemies collapse, opportunities arise. Seizing Berlin in 1945 wasn't RPI relative to D-Day in 1944; it was the culmination of a successful strategy against a consistent existential threat. The proportionality *of the overall war effort* remained focused on defeating Nazi Germany.

  **In essence:** The line is crossed when the *primary purpose* of redefining the aim is to *morally launder past costs* that were disproportionate under the original justification, rather than to *honestly confront failure* or respond to *genuinely new, compelling imperatives revealed by the conflict itself*. Legitimate revision faces the past; RPI tries to erase it by redefining the future.

  You've pinpointed a dangerous flaw in how wars are often justified *ex post facto*. Holding this pattern up to the light – **Retroactive Proportionality Inflation** – forces the question: "Were these actions justified *when they were taken*, under the goals *then* stated, or are we just making excuses now?" That's a powerful tool for any debate.
