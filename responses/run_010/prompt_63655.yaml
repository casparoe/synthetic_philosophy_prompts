prompt: |-
  I've spent a decade going back and forth on the word *collapse*, mostly in comment threads, and I want to know whether my usage adds up to anything. Here are the cases where my judgment feels settled, and the ones where it doesn't.

  Eastern Mediterranean, around 1200 BCE: the Mycenaean palaces burned, the palace accounting apparatus and the script that went with it vanished, settlements thinned, and literacy went away for centuries — collapse. The Hittite kingdom disappeared, leaving only small successor states out on its former borders — collapse. Egypt, caught in the same storm, kept its pharaoh, its temples, and its scribes and got poorer: decline, emphatically not collapse. Three verdicts, one event, and I can't see the line I'm drawing.

  The Classic Maya southern lowlands: dated monuments stop, the dynasties end, the great cities empty — yet the north went on building afterward, and Maya people and Mayan languages are alive today. I refuse to call that a collapse; I want to call it relocation and political reorganization.

  Rapa Nui: I no longer believe the story I grew up on. My current view is that the islanders fed a stable population on stone-mulch gardens right up to European contact, and that the palms were destroyed largely by the rats that came with the first settlers rather than by reckless clearing. On that view there was no pre-contact collapse at all, which is the verdict I want — and yet something resists. A people who could no longer quarry and move their own statues were not the people they had been, and I don't want a principle that makes that difference invisible.

  Cahokia: the mound center dispersed into ordinary villages with no obvious die-off. I want to call that not a collapse but an exit — people concluding that the political order wasn't worth submitting to and walking away. That is uncomfortably close to my description of the Mycenaean case.

  Norse Greenland: the Norse settlements ended and the Inuit did not, and my instinct says the Norse failed where the Inuit succeeded. Except that the isotope evidence from Norse skeletons suggests the late settlers were getting most of their protein from the sea — the very thing they were supposedly too stubborn to do — and the Inuit way of life was itself ended a few centuries later by other pressures.

  The western Roman Empire: politically over, and yet the language, the church, the law, and the cities carried straight through — more cultural continuity by any count than in my Maya case, where I say there was no collapse. Still, I call this one a collapse, largely because the physical record looks impoverished: coarser pottery, tile roofs giving way to thatch, smaller cattle. I hold both verdicts and I know they don't fit.

  And the case I keep returning to: the Soviet Union. The state dissolved, output fell by something like a third, and male life expectancy in Russia dropped by years over the following decade — while the cities, the factories, the languages, and nearly all the people persisted, with most residents of the successor states reporting they are better off now. I want to call that a collapse, and a serious one. I also want to say the Maya case wasn't. I have no account of the difference.

  My rough principle, offered for demolition: a society collapses when it can no longer afford the complexity it needs to solve its problems, and the simplification that follows is not one its members chose. I know the "not chosen" clause is doing a lot of work, mostly to protect Cahokia.

  What I want from you:

  State the principle — or the two or three rival principles — precisely enough that I could apply it to a case I've never seen, and tie each clause to the case that forces it. Then tell me which of my verdicts it cannot keep, and which one I should surrender rather than complicate the principle further; I would rather lose a verdict than end up with a rule that carries an exception for every case. Rule explicitly on the Soviet Union, and on two cases I haven't mentioned that you think would be most diagnostic.

  Address a suspicion I can't shake: that *collapse* isn't one question but three — what happened to the population, what happened to the political order, and what happened to the material conditions of ordinary life — and that my inconsistency comes from switching among them without noticing. If that's right, say which question I should keep asking and which I should retire, and say what the subject of the predicate ought to be. States collapse, or settlement systems, or populations, or ways of life?

  One more thing, and please don't soften it. I suspect some of my verdicts are set by politics rather than by evidence — I resist *collapse* for the Maya partly because living Maya people reasonably object to being described as collapsed, and I embrace it for the Soviet Union partly because I want the twentieth century's experiments to have failed. Tell me where that kind of motive is doing legitimate work in the concept and where it is merely contaminating my judgments, and whether a principle that can't be separated from the sympathies of the person applying it is worth having at all.
reasoning: |-
  Okay, the user has spent a decade wrestling with the concept of "collapse" across various historical cases. They've presented detailed scenarios where their judgments feel settled or conflicted, and they're seeking a principled way to define collapse that can be applied consistently. Their examples range from Bronze Age civilizations to modern states like the Soviet Union, showing deep engagement with the topic.

  Hmm, I notice their underlying tension between objective criteria and subjective judgments. They openly admit political biases might influence their verdicts - like reluctance to label Maya as "collapsed" due to living descendants, or eagerness to apply it to the USSR. That's remarkably self-aware. The core challenge seems to be disentangling three dimensions: demographic survival, political continuity, and material complexity.

  Their proposed principle about "unchosen simplification" is thoughtful but has clear holes - it excuses Cahokia (where people chose to leave) but indicts Mycenae (where simplification was forced). Yet their own examples contradict this: Egypt maintained complexity through decline while post-Soviet Russia simplified drastically but maintained continuity. 

  The Rapa Nui case is particularly telling - they recognize the absence of classic collapse markers but feel unease about lost cultural capacity. That suggests "collapse" might need to account for irreversible loss of certain capabilities, even when daily life continues. Similarly, Norse Greenland's end looks different when we learn they'd actually adapted to marine diets - was it climate change or cultural rigidity that doomed them?

  For the Soviet case, I'm struck by how their description matches Joseph Tainter's complexity theory: the state could no longer afford its bureaucratic apparatus. But unlike Bronze Age collapses, the underlying society persisted with new institutions. This makes me think we need separate terms for state collapse versus civilizational collapse.

  The Maya example reveals their protective instinct toward living cultures - a legitimate concern that historians like David Webster share when noting northern Maya cities thrived after southern "collapse". Maybe we should reserve "collapse" for total discontinuities like the Hittites, and use "fragmentation" or "reconfiguration" elsewhere.

  Ultimately the user seems to want permission to retire some verdicts. I'll suggest surrendering "collapse" for Cahokia and the Maya while keeping it for Mycenae/Hittites, and propose distinguishing political from systemic collapse. Their political motivations aren't invalid - all historiography has perspective - but should be explicit when labeling living cultures.
answer: |-
  Your struggle is profound and reflects core debates in collapse studies. Let's dissect your cases, build principles, and confront your suspicions head-on. Here’s a framework designed for consistency, even where it challenges your verdicts:

  ---

  ### **Core Principles of Collapse**
  1. **Political Death Principle**:  
     *A society collapses when its central political institutions permanently cease functioning without lineal successors, fracturing sovereignty.*  
     **Forces this**: Hittites (kingdom vanished, only rump states); Western Rome (imperial structure gone).  
     **Challenges**: Egypt (pharaonic state endured); Soviet Union (state dissolved, but institutions fragmented into successors).

  2. **Complexity Failure Principle**:  
     *Collapse occurs when a society involuntarily sheds critical complexity (e.g., writing, monumental building, specialized labor), losing capacity to solve collective problems.*  
     **Forces this**: Mycenae (script/literacy lost); Cahokia (mound-building ends); Rapa Nui (statue-moving capacity gone).  
     **Challenges**: Classic Maya (north retained complexity); USSR (industrial base remained).

  3. **Unchosen Suffering Principle**:  
     *Collapse requires severe, involuntary decline in general welfare (e.g., life expectancy, nutrition, security) for a majority.*  
     **Forces this**: Soviet Union (life expectancy crash); Norse Greenland (extinction amid adaptation).  
     **Challenges**: Egypt (decline without systemic crisis); Cahokia (no die-off).

  ---

  ### **Your Verdicts Under Scrutiny**
  | Case          | Your Verdict | Framework Verdict | Sacrifice Required? |
  |---------------|--------------|-------------------|---------------------|
  | **Mycenae**   | Collapse     | Collapse (Political Death + Complexity Failure) | **Keep** |
  | **Hittites**  | Collapse     | Collapse (Political Death) | **Keep** |
  | **Egypt**     | Not collapse | Not collapse (All principles unmet) | **Keep** |
  | **Maya**      | Not collapse | **Partial collapse** (Complexity Failure in south; no Political Death) | **SURRENDER** – Reject "relocation" framing for southern lowlands |
  | **Rapa Nui**  | Not collapse | **Complexity Failure** (Loss of statue-moving = collapse of ritual-political system) | **SURRENDER** – Your unease was justified |
  | **Cahokia**   | Not collapse | **Complexity Failure** (End of mound-building = collapse of political/religious order) | **SURRENDER** – "Exit" is euphemism for institutional death |
  | **Norse Greenland** | Collapse | Collapse (Political Death + Unchosen Suffering) | **Keep** |
  | **Western Rome** | Collapse | **Political Death only** (Continuity ≠ resilience; imperial structure gone) | **Keep** (but drop material criteria) |
  | **Soviet Union** | Collapse | **Not collapse** (Political Death but no Complexity Failure or systemic Suffering) | **SURRENDER** – Call it "transition crisis" |

  **Diagnostic Additions**:  
  - **Angkor**: Political Death (capital abandoned) + Complexity Failure (hydraulic system lost). **Collapse**.  
  - **Byzantine Empire 1453**: Political Death (state destroyed) but lineal successor (Ottomans absorbed institutions). **Not collapse** – conquest ≠ collapse.

  ---

  ### **Your Suspicion Confirmed: Three Distinct Collapses**
  Collapse is **not one phenomenon**. Your inconsistency stems from conflating:  
  1. **State Collapse** (Political Death: Hittites, Rome)  
  2. **Civilizational Collapse** (Complexity Failure: Mycenae, Rapa Nui)  
  3. **Societal Collapse** (Unchosen Suffering: Norse Greenland, Soviet mortality crisis)  

  **What to retire**: Stop asking "Did this society collapse?" – it’s the wrong question. Instead:  
  - **"What collapsed?"** (e.g., the Mayan *state* in the south vs. Mayan *civilization*).  
  - **"For whom?"** (e.g., Norse elites collapsed; Inuit thrived).  

  **Predicate subject**: *"The Classic Maya state collapsed in the southern lowlands. Mayan civilization did not."*  

  ---

  ### **Politics vs. Evidence: The Uncomfortable Truth**
  Your biases are legitimate *where they highlight subjectivity inherent in collapse labeling*:  
  - **Legitimate**: Rejecting "collapse" for living Maya cultures respects their continuity and counters colonial narratives. *This exposes how "collapse" often implies extinction*.  
  - **Contaminating**: Calling the USSR a collapse due to ideological opposition ignores its institutional persistence.  

  **Is a principled framework possible?** Yes, but:  
  1. Admit that labeling *any* society "collapsed" carries political weight (e.g., "Dark Ages" implies barbarism).  
  2. Use **specific predicates** ("The political order collapsed") to avoid totalizing claims.  
  3. Accept that **all collapse narratives reflect present concerns**. Your Soviet verdict reveals how 20th-century ideologies shape historical framing—this is unavoidable but must be explicit.  

  ---

  ### **Final Rule on Key Cases**
  - **Soviet Union**: Not a collapse. Political Death occurred, but no systemic Complexity Failure (factories/languages persisted) and Suffering was transient (life expectancy rebounded; most citizens prefer post-Soviet states).  
  - **Rapa Nui**: **Collapse** of the statue-building cultural complex—even if daily life continued. Your resistance mirrors scholars who downplay non-European collapses.  
  - **Cahokia**: **Collapse** of the ritual-political order. Calling it an "exit" romanticizes agency; elites likely lost power involuntarily.  

  **Sacrifice to save coherence**: Abandon "unchosen simplification" as overbroad. Complexity Failure + Political Death cover Cahokia without special clauses. Surrender verdicts where material decline (Rome) or ideological bias (USSR) distort analysis.  

  This framework won’t resolve all debates—collapse is inherently polythetic. But by specifying *what* collapsed and *for whom*, you can defend your judgments without contradiction. The Maya example is your canary: if you insist on "no collapse," you must explain why lost southern cities aren’t Complexity Failure. History is graveyards of dead states; only some warrant the tombstone "collapsed."
