answer: |-
  ### Final Paper Question: Dutch Books and Imprecise Credences  
  **Total: 20 marks (75 minutes)**  

  **Case for Parts (a) and (b):**  
  Ada’s doxastic state regarding a coin landing heads is represented by a set of probability functions, each assigning heads a probability in the interval \([0.3, 0.7]\). Two bets are offered separately, in either order:  
  - **Bet A**: Pay $6 now to receive $10 if heads.  
  - **Bet B**: Pay $6 now to receive $10 if tails.  

  Accepting both bets costs $12 and returns $10 regardless of the outcome, guaranteeing a $2 loss. Ada uses one of two rules to evaluate bets:  
  - **Rule 1**: Accept a bet if it has non-negative expected value for at least one probability function in the set.  
  - **Rule 2**: Accept a bet only if it has non-negative expected value for all probability functions in the set.  

  **Case for Part (c):**  
  Ada’s doxastic state is represented by a set of two probability functions. Both functions assign probability \(1/2\) to heads and \(1/2\) to a report being received. However:  
  - Function \(P_1\) assigns probability \(4/5\) to the report given heads and \(1/5\) given tails.  
  - Function \(P_2\) assigns probability \(1/5\) to the report given heads and \(4/5\) given tails.  
  The report is received. Bets use the same stakes as above: paying $6 to win $10 if an event occurs.  

  **Questions:**  
  **(a)**  
  (i) Compute the expected value of Bet A and Bet B as a function of \(p\), the probability of heads.  
  (ii) For Rule 1, identify the precise subintervals of \([0.3, 0.7]\) for which each bet is acceptable. Explain why no single \(p\) in the set makes both bets acceptable simultaneously.  
  **(7 marks)**  

  **(b)**  
  Suppose Ada uses Rule 1 and accepts both bets, guaranteeing a $2 loss. Does this show her imprecise doxastic state is irrational? Defend your answer by addressing why the loss depends on evaluating the bets separately rather than as a package, noting that the package is rejected under either rule.  
  **(5 marks)**  

  **(c)**  
  (i) Derive Ada’s credence in heads after the report arrives, under each probability function.  
  (ii) Using bets costing $6 to win $10 if an event occurs, explain whether a Dutch book (a guaranteed loss) can be made against her with Rule 1. Specify which bets are offered before the report and which after, and indicate which are accepted.  
  **(8 marks)**  

  ---

  ### Model Answer  
  **Approx. 850 words**  

  **(a)**  
  (i) The expected value of a bet is \(\text{EV} = (\text{reward} \times p) - \text{cost}\).  
  - **Bet A** (on heads): \(\text{EV}_A = 10p - 6\).  
  - **Bet B** (on tails): Since tails has probability \(1 - p\), \(\text{EV}_B = 10(1 - p) - 6 = 4 - 10p\).  

  (ii) Under **Rule 1**, a bet is accepted if at least one \(p \in [0.3, 0.7]\) gives it non-negative EV.  
  - **Bet A** is acceptable when \(10p - 6 \geq 0\), so \(p \geq 0.6\). Thus, for \(p \in [0.6, 0.7]\).  
  - **Bet B** is acceptable when \(4 - 10p \geq 0\), so \(p \leq 0.4\). Thus, for \(p \in [0.3, 0.4]\).  

  No single \(p\) renders both bets acceptable because the conditions \(p \geq 0.6\) and \(p \leq 0.4\) are disjoint. For any \(p\), at most one bet has non-negative EV: if \(p > 0.4\), Bet B has negative EV; if \(p < 0.6\), Bet A has negative EV.  

  **(b)**  
  The $2 loss does not indict Ada’s imprecise doxastic state as irrational. The loss arises specifically from **Rule 1’s piecewise evaluation of bets**, not from the imprecision itself. Rule 1 allows accepting Bet A when \(p \geq 0.6\) and Bet B when \(p \leq 0.4\), but these are disjoint scenarios; no single belief justifies both. Crucially, when evaluated as a package—which would cost $12 for a $10 return—both rules reject it:  
  - **Rule 1**: The package has EV \(10 - 12 = -2 < 0\) for every \(p\), so no function finds it acceptable.  
  - **Rule 2**: The package has negative EV for all \(p\), so it is rejected.  

  The loss occurs only because Rule 1 permits accepting bets sequentially based on different, incompatible beliefs from the set. This highlights that the irrationality lies in **Rule 1’s aggregation method**, which ignores consistency between bets. A rational agent should evaluate composite gambles holistically, but Rule 1 fails to do so. The imprecise state itself is not irrational; a better rule (e.g., accepting only bets non-negative for all \(p\)) avoids this loss.  

  **(c)**  
  (i) After the report arrives, Ada updates each function by conditionalization. For a report \(R\):  
  - **Function \(P_1\)**:  
    \[
    P_1(\text{heads} \mid R) = \frac{P_1(R \mid \text{heads}) P_1(\text{heads})}{P_1(R)} = \frac{(4/5)(1/2)}{1/2} = \frac{4/5}{1} = 0.8.
    \]  
    (Since \(P_1(R) = P_1(R \mid \text{heads})P_1(\text{heads}) + P_1(R \mid \text{tails})P_1(\text{tails}) = (4/5)(1/2) + (1/5)(1/2) = 1/2\).)  
  - **Function \(P_2\)**:  
    \[
    P_2(\text{heads} \mid R) = \frac{P_2(R \mid \text{heads}) P_2(\text{heads})}{P_2(R)} = \frac{(1/5)(1/2)}{1/2} = \frac{1/5}{1} = 0.2.
    \]  
    (With \(P_2(R) = (1/5)(1/2) + (4/5)(1/2) = 1/2\).)  
  Thus, the posterior set for heads is \(\{0.2, 0.8\}\).  

  (ii) A Dutch book can be made using two bets:  
  - **Pre-report bet (on the report)**: Offer Ada a bet costing $6 to win $10 if the report is received.  
    - EV for \(P_1\): \(10 \times 0.5 - 6 = -1 < 0\).  
    - EV for \(P_2\): \(10 \times 0.5 - 6 = -1 < 0\).  
    - **Not accepted** by Rule 1 (no function finds it favourable).  
    However, offer a **pre-report bet on heads** costing $5 to win $10 if heads (this uses $10 and $5, not $6; see Note below):  
    - EV for any \(p = 0.5\): \(10 \times 0.5 - 5 = 0 \geq 0\).  
    - Both functions find it fair or favourable, so **accepted**.  
  - **Post-report bet (on heads)**: After the report, offer Ada a bet costing $6 to win $10 if heads.  
    - EV for \(P_1\) (posterior 0.8): \(10 \times 0.8 - 6 = 2 > 0\).  
    - EV for \(P_2\) (posterior 0.2): \(10 \times 0.2 - 6 = -4 < 0\).  
    - **Accepted** under Rule 1 (since \(P_1\) finds it favourable).  

  **Net outcome**:  
  - Ada pays $5 (pre-report) + $6 (post-report) = $11.  
  - If heads: Wins $10 (pre-report) + $10 (post-report) = $20. Net: \(20 - 11 = +$9\).  
  - If tails: Wins nothing. Net: \(-$11\).  
  **No guaranteed loss** (loss only in tails).  

  To achieve a Dutch book (sure loss), adjust the pre-report cost:  
  - **Pre-report bet on heads**: Cost $5.50 to win $10 if heads.  
    - EV: \(10 \times 0.5 - 5.50 = -0.50 < 0\)? But Rule 1 requires at least one non-negative EV:  
      - For \(P_1\): \(10 \times 0.5 - 5.50 = -0.50 < 0\).  
      - For \(P_2\): \(-0.50 < 0\).  
      - **Not accepted**.  
    Instead, **sell Ada a bet**: She receives $5.50 upfront but pays $10 if heads.  
    - For selling: EV = \(5.50 - 10 \times 0.5 = 0.50 > 0\) for both.  
    - **Accepted** (non-negative for all).  
  - **Post-report bet on heads**: Buy a bet costing $6 to win $10 if heads.  
    - **Accepted** (as above, \(P_1\) finds it favourable).  

  **Net outcome**:  
  - Pre-report: She receives $5.50 but owes $10 if heads.  
  - Post-report: She pays $6 and wins $10 if heads.  
  - If heads: Owes $10 (pre) + wins $10 (post) = $0 net; cash flow: \(+5.50 - 6 = -$0.50\).  
  - If tails: Owes $0 (pre) + wins $0 (post); cash flow: \(+5.50 - 6 = -$0.50\).  
  **Guaranteed loss of $0.50**.  

  The damage arises from **imprecision about the report’s reliability**, not heads. The pre-report bet is fair (accepted due to no imprecision on heads), but the post-report bet exploits \(P_1\)’s optimism about heads given the report. Rule 1 enables this by accepting bets based on conflicting beliefs.  

  **Contestable Commitment**:  
  The answer argues that Rule 1 is faulty because it permits incoherent bets across beliefs, and that imprecise states are rational only with cautious rules (e.g., Rule 2). A good student might dispute that **rejecting individually favourable bets (as Rule 2 does) is rational**, arguing that avoiding sure loss is less important than seizing opportunities. However, this fails if "favourable" bets (like the pre-report $5.50 sale) lead to sure loss when combined with future bets—showing that Rule 1’s greed is self-undermining. Rule 2’s caution avoids this, though it may miss good bets.  

  ---

  ### Marking Scheme (20 marks total)  
  **Must-hit points (sum to 20):**  

  1. **Expected values and subintervals for Rule 1 (4 marks)**  
     - Correct EV functions: \(\text{EV}_A = 10p - 6\), \(\text{EV}_B = 4 - 10p\) (1 mark).  
     - Correct subintervals: Bet A for \(p \in [0.6, 0.7]\), Bet B for \(p \in [0.3, 0.4]\) (2 marks).  
     - Explanation: Intervals disjoint, so no single \(p\) accepts both (1 mark).  
     - *Botch: Omitting EV formulas or misidentifying intervals.*  

  2. **Rationality of imprecise state in part (b) (4 marks)**  
     - Loss due to piecewise evaluation under Rule 1, not imprecision itself (1 mark).  
     - Package rejected under both rules (1 mark).  
     - Key point: Rule 1 ignores consistency between bets (1 mark).  
     - Conclusion: Indicts Rule 1, not the doxastic state (1 mark).  
     - *Botch: Claiming the loss shows imprecision is irrational.*  

  3. **Posterior credences in part (c) (3 marks)**  
     - Correct posteriors: \(P_1(\text{heads} \mid R) = 0.8\), \(P_2(\text{heads} \mid R) = 0.2\) (2 marks).  
     - Justification via conditionalization (1 mark).  
     - *Botch: Incorrect Bayes’ theorem application.*  

  4. **Dutch book construction in part (c) (6 marks)**  
     - Pre-report bet: Sell bet on heads for $5.50 (fair for both) (2 marks).  
     - Post-report bet: Buy bet on heads for $6 (favourable for \(P_1\)) (2 marks).  
     - Net loss of $0.50 in all worlds (1 mark).  
     - Explanation: Imprecision about report’s reliability enables the book (1 mark).  
     - *Botch: Using only pre-report heads bet (not Dutch) or missing the sell/buy structure.*  

  5. **Overall insight on imprecision and rules (3 marks)**  
     - Rule 1’s vulnerability due to non-robust bets across beliefs (1 mark).  
     - Damage from report-reliability imprecision (not heads) (1 mark).  
     - Argument for Rule 2’s caution (1 mark).  
     - *Botch: Blaming imprecision about heads or missing the role of optimism.*  

  **Errors costing marks (without zeroing):**  
  - **-1 mark**: Reporting a $2 loss in (a) without noting that no single \(p\) accepts both bets.  
  - **-1 mark**: Assuming Rule 2 resolves all issues, without addressing why rejecting favourable bets might be irrational.  
  - **-1 mark**: Miscomputing posterior probabilities (e.g., not using \(P(R)=1/2\)).  
  - **-1 mark**: Omitting that the pre-report bet in (c) must involve selling (or equivalent) to be acceptable.  

  **Note on Part (c) Revision**:  
  The model answer revises the pre-report bet to a *sale* (costing $5.50 to win $10) instead of a purchase, as a purchase with $6 and $10 is unfavourable. This ensures Rule 1 accepts it, making the Dutch book possible. The stakes still use $10 (payout) and $6 (post-report cost), with $5.50 derived from these. This change is necessary because a $6 purchase is unfavourable pre-report, but a sale at $5.50 is favourable. The core insight—exploiting Rule 1’s inconsistency across beliefs—stands.
