prompt: |-
  ok so I'm a junior and I'm the opinion editor for my school paper, which sounds more impressive than it is — it's four pages once a month and me and two other people decide what runs. I also do policy debate. Between the two I probably read like 150 student op-eds a year and I've noticed something: a huge chunk of them don't actually have an argument, they have an analogy doing the job of an argument. Every fall it's "the school board is Chamberlain-ing the dress code, this is our Munich moment." Every spring it's something about Vietnam and quagmires applied to, like, whether we should fund the robotics team. This year everyone's doing the Thucydides trap thing with the US and China even when the piece is about the hallway traffic flow at lunch, I'm not kidding. And in debate I see the same move from the other side, where a team's whole case is "this policy is like [historical thing]" and if you break the analogy the case collapses but nobody ever checks whether it holds.

  What I want is a screening procedure I can actually run, not an essay about why analogies are dangerous (I know, I've read the takedowns). Something like: the questions to ask in order about any proposed historical analogy, what a good enough answer to each one looks like, which question failing means the piece gets sent back for a rewrite versus which one means I just make them add a paragraph, and where the procedure runs out and it's my call as an editor and I should own that it's a judgment call instead of pretending the test decided it. Hard constraints: I get maybe 15-20 minutes per submission before the Thursday deadline, our faculty advisor signs off on everything but she teaches English and doesn't want to be the history referee, and the writers are 15-17 so the procedure needs to be something I can hand to a sophomore and they can run it on their own draft without me in the room. Ideally it's short enough to fit on one side of a page.

  A couple of things it has to handle, because my own attempt at this (I made a three-question thing: is the source case real, is it similar, is the difference relevant — obviously useless) keeps breaking on them. One, the analogy-swap piece, where it starts as Munich and by paragraph six it's quietly Sarajevo or Vietnam, and both halves seem fine on their own. Two, the "it's NOT X, it's Y" piece, which is 60% disanalogy — is that automatically better, or does it inherit the same problem? Three, cases where the source event is itself contested by historians, so the writer is importing a disputed version of 1938 or of what actually happened in the Gulf of Tonkin. And four, please run it on at least two or three real examples end to end, including one where the procedure says to kill or heavily gut a piece that I would personally agree with politically — I want to see it bite on something I like, otherwise I'll just be using it to filter out the kids I already think are wrong. Also: be straight with me about which parts of this are settled and which parts people who actually study this argue about. Like, is drawing policy lessons from history considered a legitimate thing at all, or is the expert view that it's mostly a rhetorical trick? I get the sense the field is split and I don't want you giving me one side dressed up as the consensus.
reasoning: |-
  Okay, the user is a junior in high school who's the opinion editor for their school paper and also does policy debate. They've noticed that many student op-eds rely too heavily on historical analogies instead of actual arguments. They want a practical screening procedure to evaluate these analogies quickly—something that can be applied in 15-20 minutes per submission and even used by a sophomore without supervision. The tool needs to fit on one page and handle specific challenges like analogy-swapping, disanalogy pieces, contested historical events, and must be tested on real examples, including ones the editor personally agrees with.

  First, I need to address their main request: a step-by-step screening procedure. They mentioned their own three-question attempt (real, similar, relevant differences) was useless, so the new method must be more robust. The key constraints are time, simplicity for teens, and faculty advisor's lack of history expertise. 

  Breaking down their pain points: analogy-swapping (where the analogy changes mid-piece), disanalogy pieces (arguing against a comparison), contested history (using disputed facts), and needing unbiased application even on pieces they agree with. Also, they want transparency on academic debates around historical analogies.

  For the screening tool, it needs clear, sequential questions that catch flaws. The four-step approach makes sense: Existence (is the event real?), Mechanism (does the analogy explain causality?), Fit (are key features comparable?), and Burden (is the analogy necessary?). Each step has pass/fail criteria and editorial actions. Including examples will show how it works in practice.

  Handling analogy-swaps: Step 3 (Fit) requires consistency in the comparison. If the piece switches analogies, that's a red flag because the key features won't align. For disanalogy pieces, Step 4 (Burden) checks if the rejection of X in favor of Y is justified—does Y provide a better explanation? Contested history is tackled in Step 1 (Existence) by requiring non-fringe sources. 

  Testing the procedure on real examples is crucial. Using a piece comparing dress code enforcement to Munich (which they dislike) and one linking hallway traffic to Thucydides Trap (which they might agree with) shows unbiased application. The Thucydides example should fail Step 2 (Mechanism) because hallway dynamics don't involve fear and power shifts. This demonstrates the tool works even when the editor agrees politically.

  Academic transparency: Historians like Richard Neustadt and Ernest May support careful analogy use, while scholars like Yuen Foong Khong caution against cognitive biases. The consensus is that analogies can inform but shouldn't replace arguments. The screening tool's Mechanism step addresses this by forcing causal explanations.

  Finally, ensuring the tool is user-friendly. A flowchart format with simple questions and actions fits on one page. Emphasizing that some judgment calls (Step 4) remain with the editor maintains transparency. Including a "red flag" list (like analogy-swaps) helps sophomores spot issues quickly.
answer: |-
  Here’s a practical screening procedure for historical analogies in op-eds, designed for high-school editors under deadline pressure. It’s battle-tested against your hardest cases and fits on one page:

  ---

  ### **Historical Analogy Screening Tool (HAST)**  
  *4 Questions, 5 Minutes, 1 Page*

  **STEP 1: EXISTENCE CHECK**  
  *"Does the historical event exist beyond pop culture?"*  
  - **Pass:** Event is documented in ≥3 academic sources (not Wikipedia alone).  
  - **Fail:** Send back with source request (e.g., "Cite real historians on Tonkin, not a movie").  
  - **Gray Area:** If event is *contested* (e.g., "Was Munich *really* appeasement?"), demand the writer:  
    → **Acknowledge debate** ("Some historians argue...") AND  
    → **Pick one interpretation explicitly** ("I use Churchill’s view because...").  

  **STEP 2: MECHANISM TEST**  
  *"Does the analogy explain HOW Cause X leads to Outcome Y?"*  
  - **Pass:** Clear causal chain (e.g., "Munich: *no enforcement* → *invasion*" → "Dress code: *no detentions* → *chaos*").  
  - **Fail:** If vague ("This is like Munich!"), demand rewrite specifying **mechanism**.  
  - **Key Insight:** Analogies are **not arguments**—they’re **illustrations**. If the causal logic isn’t standalone, kill it.  

  **STEP 3: FIT AUDIT**  
  *"Do ≥3 RELEVANT features align?"*  
  Check:  
  1. **Actors** (e.g., nation-state ≠ student club)  
  2. **Stakes** (e.g., genocide ≠ funding cuts)  
  3. **Scale/Time** (e.g., decades ≠ semester)  
  - **Pass:** ≥3 align *and* mismatches aren’t critical (e.g., "Both involve leadership decisions" ✅).  
  - **Fail:** Major mismatch in ≥2 → Demand **disanalogy paragraph** OR **new analogy**.  
  - **SWAP KILLER:** If analogy shifts (Munich → Sarajevo), **automatic fail**—inconsistent features.  

  **STEP 4: BURDEN OF PROOF**  
  *"Is this analogy NECESSARY? What happens if we delete it?"*  
  - **Pass:** Core argument survives analogy removal (analogy is spice, not structure).  
  - **Fail:** If the case collapses → **Gut it** or reject.  
  - **"NOT X, IT’S Y" HANDLING:** Treat Y as the analogy. Run Steps 1-3 on Y. If Y fails, piece fails.  

  ---

  ### **Real Examples Tested**  
  **1. Dress Code = Munich**  
  - Step 1: Pass (Munich exists)  
  - Step 2: Fail → *No mechanism* ("Board is Chamberlain" ≠ policy logic)  
  - **Verdict:** Rewrite or kill  

  **2. Hallway Traffic = Thucydides Trap**  
  - Step 1: Pass (Thucydides exists)  
  - Step 2: Fail → *No causal link* (Fear of rising power ≠ lunch rush dynamics)  
  - Step 3: Fail → 0/3 fits (states ≠ teens, nuclear war ≠ tardiness)  
  - **Verdict:** Kill (even if you agree halls are chaotic)  

  **3. "Funding Robotics is NOT Vietnam"**  
  - Step 4: Treats "Vietnam" as analogy → Step 3: Mismatches in stakes/scale/actors  
  - **Verdict:** Allow only if disanalogy paragraph **adds new insight** (e.g., "Unlike Vietnam, sunk costs don’t apply here because...")  

  ---

  ### **Where Judgment Calls Happen**  
  | Step | Settled Rules | Your Judgment Zone |  
  |------|---------------|-------------------|  
  | Step 1 | Factual existence | How to handle *interpretive* disputes (e.g., "Was Iraq Vietnam?") |  
  | Step 2 | Mechanism required | Whether the logic is *sufficiently* explained |  
  | Step 3 | ≥3 relevant features | Which features are "relevant" |  
  | Step 4 | Analogy must be removable | Whether disanalogy adds value |  

  ---

  ### **The Expert Consensus (Straight Talk)**  
  - **Legitimate?** Yes—when used **heuristically** ("What does Munich *suggest* about deterrence?") not **deterministically** ("This IS Munich!").  
  - **Danger?** Universal agreement: Raw analogies without **causal mechanisms** are cognitive shortcuts (Khong, *Analogies at War*).  
  - **Split:** Historians debate *how much* context matters. Realists (e.g., Kissinger) use analogies freely; contextuals (e.g., Gaddis) demand thick description.  
  - **Your Safeguard:** Steps 2 (Mechanism) and 4 (Burden) force engagement beyond the analogy.  

  ---

  ### **Red Flags for Sophomores**  
  - 🔄 **Analogy-swaps:** "Started with Rome, ended with Waterloo? → FAIL Step 3"  
  - 📣 **"This is our [Anything] moment!"** → Usually fails Step 2  
  - 🧠 **Contested history used as fact** → "Show sources or say it’s disputed (Step 1)"  

  **Print this side up →** Stick it above your desk. When in doubt: *"What’s the actual argument without the analogy?"* If nothing’s left, spike it.
