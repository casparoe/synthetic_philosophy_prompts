  Next, the three-way distinction. Original grounding involves the system's own interactions, which ELIZA doesn't have. Derivative is like a book, which fits ELIZA. Reverse grounding is the key here: users project meaning onto the outputs. Weizenbaum's surprise was how strong this projection was, even with those who knew the mechanics. Reverse grounding explains why the interaction feels meaningful despite ELIZA's emptiness. It's not just human charity; it's the structure of the conversation triggering projection. The grounding problem predicts that users would project meaning, but it doesn't explain the intensity, which requires psychology.

  Lastly, how does this case affect the theory? The grounding problem explains the hollowness, showing that without grounding, understanding is an illusion. But it doesn't account for why humans are so prone to projection. The theory is silent on the social and psychological factors. To address that, we need cognitive science and sociology. Adding this doesn't undermine the grounding problem but complements it. The Chinese Room is similar but focuses on understanding, while grounding is about semantics from perception-action loops. ELIZA never had that loop.

