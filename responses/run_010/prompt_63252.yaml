prompt: |-
  Our school's Learning Support Panel meets next Tuesday and I hold the pupil seat on it; I am in Year 13 at a comprehensive in the North of England. The panel administers a small bursary fund and advises the head on what pupils may use during supervised study and internal examinations. Two applications are before it, both for the same item: a battery-powered headband, bought online for about a hundred and fifty pounds, that passes a weak current across the front of the skull and is advertised as improving concentration. Both applicants are in Year 12.

  Application A is from a pupil diagnosed with ADHD who cannot tolerate her prescribed medication because of its side effects and is on a long waiting list to have her treatment reviewed. She says the headband is the only thing that has allowed her to complete homework this term, and she has a letter from her GP to that effect. She also states, candidly, that she intends to wear it in the national mathematics olympiad selection rounds, in which she is already the strongest candidate in the year.

  Application B is from a pupil with no diagnosis of any kind, who wants it for revision. His written case is that his family cannot afford a private tutor, that the families of several of his rivals do pay for tutors, and that tutoring is plainly an improvement on whatever level our policy has in mind — so if the panel funds tutoring-adjacent things and refuses his, the line it is using cannot be doing the work it claims to do.

  For context, the panel will have in mind that the school already funds spectacles, pays for extra time in public examinations where pupils are entitled to it, permits private tutoring at parents' expense, and takes no view on energy drinks consumed in the library.

  The policy we work from provides funding for support that 'enables a pupil to function at the level reasonably expected of a pupil of their age and stage', and distinguishes treating a difficulty from improving a pupil beyond that level. It does not say who fixes that level, when it is measured, or what follows if it moves.

  Please write the memo I will table at the meeting, in British English. It should: give a clear recommendation on each application — grant, refuse, or grant with conditions, and if conditions, ones a sixth-former could actually meet and a panel could actually monitor; set out the reasoning in terms the other members, who are four teachers and two parents, can follow; state what criterion the panel should apply to future applications, and whether the treating-versus-improving line can bear the weight our policy places on it or should be replaced by something else; and address two awkward features head-on, namely that one pupil seeks the same device for a therapeutic purpose and for a competitive one, and that the 'expected level' in our policy is a moving target, since if a third of the year starts wearing headbands the average shifts and last year's improvement becomes this year's restoration to normal.

  I do not want the memo to rest on the thinness of the evidence for these devices or on our ignorance of their effects on adolescent brains; you may note both in passing, but the panel will reach for that argument because it decides nothing, and I want to know whether the line itself survives. Nor do I want philosophers' names, a reading list, or references — the argument has to stand on its own. Please treat Application B's complaint seriously: if his reasoning is sound, say so, and say what then follows for Application A, rather than finding a way to dismiss him. End with a short section stating the strongest consideration against whatever you recommend, put in the voice of the panel's most sceptical member, and do not knock it down afterwards. Around 900 words, with headings.
reasoning: |-
  Okay, the user is a Year 13 student representing pupils on a Learning Support Panel at a comprehensive school in Northern England. They need to draft a memo for an upcoming meeting discussing two applications for funding a controversial "concentration headband." This requires careful balancing of policy interpretation, equity concerns, and ethical reasoning.

  The core tension lies between Application A (ADHD support) and Application B (academic enhancement). The school's policy focuses on enabling pupils to reach expected levels versus improving beyond them, but "expected level" is undefined and potentially shifting. 

  Key considerations from the brief:
  - Must avoid dismissing Application B's equity argument about private tutoring
  - Cannot rely heavily on lack of scientific evidence for the device
  - Must address both the therapeutic/competitive duality and the moving-target problem
  - Requires concrete recommendations with enforceable conditions
  - Needs policy critique that non-specialists can grasp

  For Application A, the medical justification seems stronger given the GP letter and ADHD diagnosis, but the competition element complicates it. The memo could recommend approval with usage restrictions. For Application B, while the tutoring comparison has merit, it doesn't meet the policy's "expected level" threshold - though this exposes policy flaws worth examining later.

  The most challenging aspect is dissecting the policy's "treating vs improving" distinction. The memo should acknowledge how baseline expectations shift with common adoption of aids (the headband paradox), suggesting the policy needs clearer anchors like diagnostic thresholds or curriculum standards.

  The counterargument section should genuinely engage with scepticism about medical necessity versus enhancement desires, without rebutting it. This demonstrates intellectual honesty.

  Structurally, the memo will need:
  1) Clear headings for each application decision
  2) Policy critique with proposed alternatives
  3) Direct confrontation of "awkward features"
  4) A concise sceptical counterpoint

  Language must remain accessible for teachers and parents while precisely handling concepts like shifting baselines. British English phrasing like "revise" instead of "study" matters.

  The user shows impressive maturity in wrestling with these complexities. Their insistence on not taking the "easy out" of scientific doubt suggests deep ethical engagement. The memo should mirror this rigor while remaining actionable.
answer: |-
  ## MEMORANDUM  
  To: Learning Support Panel  
  From: [Your Name], Pupil Representative (Year 13)  
  Date: [Date of Meeting]  
  Subject: Recommendations & Policy Review: Headband Funding Applications (A & B)  

  ---

  ### 1. RECOMMENDATIONS ON APPLICATIONS

  *   **Application A (Year 12 Pupil with ADHD):**  
      **Recommendation: Grant, with conditions.**  
      *Conditions:*  
      1.  Funding is approved *specifically* for use during **supervised independent study sessions in school, completion of homework/coursework, and internal examinations.**  
      2.  Use during the **national mathematics olympiad selection rounds** is **explicitly excluded** from this funding.  
      3.  The pupil must provide **termly confirmation** (via brief email to the Panel Secretary from her Head of Year or Form Tutor) that the device continues to be used primarily for the funded purposes and is demonstrably aiding her core academic engagement.  
      4.  The device remains school property until the pupil leaves Year 13; it must be returned if she leaves the school early or if condition 3 is not met.  

  *   **Application B (Year 12 Pupil, no diagnosis):**  
      **Recommendation: Refuse.**  

  ---

  ### 2. REASONING FOR RECOMMENDATIONS

  **Application A:**  
  The core purpose of the bursary fund, as stated in policy, is to enable pupils to function at the "level reasonably expected of a pupil of their age and stage." Application A presents a clear case of a pupil facing a significant, diagnosed barrier (ADHD) to reaching this level. Her inability to tolerate prescribed medication constitutes a specific medical difficulty directly impeding her core academic function (completing homework). The GP letter substantiates this difficulty and the reported utility of the headband *as support*. Her candour about the olympiad is noted but does not negate the primary therapeutic need for core academic work. Granting funding *only* for core academic support (study, homework, internal exams) aligns with the policy’s aim to address difficulties preventing attainment of the expected level. The conditions ensure the device is used for its funded purpose and its ongoing necessity is monitored – feasible tasks for a sixth-former and the Panel via existing pastoral structures.

  **Application B:**  
  Application B argues compellingly that private tutoring provides an advantage beyond the "expected level" and that refusing his application while permitting tutoring creates an inconsistency. There is merit in his observation that tutoring can shift perceived norms. **However, his reasoning does not successfully bridge the gap to his own application under the *current* policy.** The policy explicitly distinguishes funding *support to overcome a difficulty* from funding *enhancement beyond the expected level*. Application B does not demonstrate a specific difficulty or barrier preventing him from functioning at the expected Year 12 level. His stated aim – revision and competing with peers who have tutors – is fundamentally about *improvement and competitive advantage*, not about reaching a baseline level of function. While tutoring exists privately, the school policy does not *fund* tutoring precisely because it falls into the "improvement" category. Funding spectacles or exam access arrangements directly address barriers preventing baseline function; funding a device solely for enhanced revision does not. His application, therefore, falls outside the current policy's remit. This refusal highlights a potential issue *with the policy itself* (discussed below), but does not justify granting under its current terms.

  ---

  ### 3. ADDRESSING THE AWKWARD FEATURES

  *   **Therapeutic vs. Competitive Use (Application A):**  
      This dual purpose is problematic but resolvable. The device serves a primary, documented therapeutic function for core academic work. The competitive use is a separate ambition. The policy funds the *support needed for core function*, not competitive advantage. Hence, funding is approved *only* for the therapeutic/academic support context, explicitly excluding the olympiad. This draws a practical line: the fund addresses barriers to core participation, not optimisation for high-stakes external competition.

  *   **The Moving Target ("Expected Level"):**  
      This is the most significant conceptual flaw in the current policy. If adoption of a device (like spectacles historically, or hypothetically these headbands) becomes widespread, the "expected level" shifts. What was once an improvement becomes the new normal. Our policy lacks an anchor. Does "expected level" mean the *current average*? The *curriculum requirement*? *Diagnostic thresholds*? Without this anchor, the distinction between "treating" and "improving" becomes unstable. If many pupils used these headbands, Application A's need might shift from "treatment" to "restoration to normal," while Application B's request might blur into "keeping up." This ambiguity undermines consistent decision-making.

  ---

  ### 4. CRITERION FOR FUTURE APPLICATIONS & POLICY REVIEW

  *   **Immediate Criterion:** For the remainder of this academic year, continue using the current policy, but with **enhanced clarity on the "expected level" anchor point.** I propose we define it pragmatically as: **"The level of academic function achievable by a pupil without a recognised Specific Learning Difficulty (SpLD), disability, or medical condition that demonstrably impedes standard learning methods, assuming standard school resources and support are utilised."** This anchors it to diagnosed barriers and core provision, not shifting averages. Applications must clearly link the requested support to overcoming such a specific, diagnosed barrier impeding this baseline function.
  *   **Policy Review Urgently Required:** The "treating-versus-improving" line, while intuitively appealing, **cannot bear the full weight placed upon it in its current vague form.** The "moving target" problem exposes its fragility. The Panel should recommend to the Headteacher that the policy be reviewed. The review must:
      1.  **Define the "expected level" rigorously** (e.g., based on curriculum standards, diagnostic criteria, not cohort averages).
      2.  **Explicitly address enhancement technologies** and the shifting baseline issue.
      3.  **Clarify the scope** regarding competitive advantage vs. core academic support.
      4.  **Consider a broader ethical framework** beyond just the functional line (e.g., equity, medical necessity, potential for dependency, evidence base – though not the sole decider).

  ---

  ### 5. STRONGEST CONSIDERATION AGAINST RECOMMENDATION (Sceptical Panel Member's Voice)

  "Hold on. We’re potentially spending £150 of limited bursary funds on a device with dubious scientific backing for Application A, based largely on her self-report and a GP letter noting she *says* it helps. We refuse Application B, who makes a fair point about tutoring advantages we allow, because he lacks a diagnosis. But what *is* the barrier? Isn't the pressure to compete, the lack of tutor access *his* barrier? We’re drawing an arbitrary line based on medical labels. Application A also wants it for competition – we’re just funding the 'homework' part. If this device genuinely 'improves concentration', why shouldn't *any* pupil struggling to revise effectively, diagnosed or not, get help reaching *their* potential? We're using medicalisation to ration support, favouring one type of disadvantage over another. Funding A but not B feels like privileging diagnosed conditions over socioeconomic or motivational hurdles, based on a policy distinction that melts under scrutiny."
