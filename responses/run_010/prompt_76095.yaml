  We are writing a product datasheet for the Thomson Lamp, a device that performs a supertask by switching on and off an infinite number of times in a finite interval, converging at noon. The datasheet must be in a deadpan, technical style, with standard sections. The humor arises from accurately describing the paradox without breaking character.

   Key points to cover:
   - Overview: Introduce the lamp and its purpose (demonstrating supertasks, ideal for theoretical or educational use).
   - Technical Specification: Include the actuation schedule (switching at t = 1/2, 1/4, 1/8, ... minutes before noon), state that the lamp has two states (ON/OFF) and a state register.
   - Installation: Simple setup (plug into standard power, etc.).
   - Operating Instructions: How to set the start time (e.g., set current time and the lamp will run the sequence ending at noon). Note that the lamp will complete the entire sequence by noon but without a final switch at noon.
   - Troubleshooting: Address that the state register at noon is undefined (neither ON nor OFF, and not both). Also, the inability to report the total number of switches (because it's infinite and there's no last event).
   - Safety: Warning about the physical impossibility of the mechanism (e.g., the switching frequency becomes infinite as noon approaches, which would require infinite energy or cause mechanical failure).
   - Warranty and Liability: Warranty covers all times strictly before noon, but not at or after noon (playing on the limit).
   - Regulatory Compliance: Certify operation at every instant before noon, but remain silent about noon.

   We also include a dimmer variant as an upgrade option, which has a continuous-output and thus a well-defined limit (e.g., the brightness converges to 50% or some value).

   Let's structure accordingly.
answer: |-
  **Thomson Lamp Datasheet**  
  **Revision 3.1**  

  **OVERVIEW**  
  The Thomson Lamp (Model TL-9000) is a precision timing instrument engineered for discrete-state toggling under convergent actuation schedules. Designed for theoretical analysis and pedagogical applications, it executes a predefined switching sequence asymptotically approaching a user-configurable terminal time (default: 12:00:00 local). The lamp transitions between ON (illuminated) and OFF (dark) states at progressively halved intervals. A state register logs discrete transitions, while the Continuous-Output Dimmer variant (TL-9000-D) provides analog luminance control.  

  **TECHNICAL SPECIFICATION**  
  - **Switching Schedule:** Actuation at *t*ₙ = *T* – (1/2ⁿ) minutes (*n* = 1, 2, 3, ...), converging to terminal time *T*.  
  - **States:** Binary (ON/OFF) with initial state user-selectable (default: OFF).  
  - **State Register:** Records timestamped transitions (±0.1 µs resolution). Final entry at *T* – (1/2ᴺ) min, where *N* is the last *n* prior to *T*.  
  - **Output:**  
    - TL-9000: 60W LED (6000K, 800 lm).  
    - TL-9000-D: 0–100% luminance (linear, continuous) converging to 50% at *T*.  
  - **Clock Accuracy:** ±1 ppm (after NTP sync).  
  - **Interface:** RS-232C, USB-C.  

  **INSTALLATION**  
  1. Mount vertically on a stable surface.  
  2. Connect to 100–240 VAC, 50/60 Hz via included power supply.  
  3. Sync terminal time *T* via PC software (ThoSoft v2.4+). Allow 5 min for schedule calibration.  

  **OPERATING INSTRUCTIONS**  
  1. **Initialization:** Set terminal time *T* and initial state (ON/OFF).  
  2. **Activation:** Initiate sequence ≥1 min before *T*. Lamp begins switching per schedule.  
  3. **Monitoring:** State transitions are logged internally. Retrieve logs *after* *T* (see TROUBLESHOOTING).  
  4. **TL-9000-D:** Luminance updates continuously. At *T*, output = 50% (provable limit).  

  **TROUBLESHOOTING**  
  - **State register undefined at *T*:** The register reports discrete transitions only. No value (ON, OFF, both, or neither) is assigned at *T*. This is not an error.  
  - **Total switch count unreportable:** The device logs all transitions but cannot compute a cardinal sum (schedule has ℵ₀ events). Queries for "final switch index" are invalid.  
  - **Log retrieval failure post-*T*:** Ensure download occurs >5 s after *T*. Pre-*T* logs are complete; post-*T* system state is unsupported.  

  **SAFETY**  
  ⚠️ **WARNING:** Physical switching mechanisms experience divergent energy dissipation as *t* → *T*. Do not operate within 10 ms of *T* if fitted with mechanical relays (option TL-9000-M). Use solid-state switching (default) to mitigate arcing. Failure may cause relay weld or insulation breakdown.  

  **WARRANTY AND LIABILITY**  
  Coverage extends to all instrument functions at times *t* < *T*. Performance at *t* ≥ *T* is excluded. Thomson Instruments Ltd. disclaims liability for:  
  - Undefined state values at *T*.  
  - Philosophical implications of divergent sequences.  
  - Use in Zeno-critical systems.  
  Warranty void if terminal time *T* is set to ∞.  

  **REGULATORY COMPLIANCE**  
  - Conforms to IEC 61010-1 (Safety) for all *t* < *T*.  
  - EMC tested per EN 55032 (emissions) at intervals ≥1 µs before *T*.  
  - *T* itself is excluded from all certification scopes.  
  - TL-9000-D: Luminance gradient complies with EN 62471 at 0% and 100% endpoints. Limit behavior at *T* is self-certified.  

  ---  
  Thomson Instruments Ltd. • Oxford, UK  
  TL-9000/9000-D Datasheet • Page 1 of 1
