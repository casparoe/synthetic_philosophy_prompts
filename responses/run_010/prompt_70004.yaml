    "cases": [
      {
        "case_id": "dueling | footbinding | slave_trade | honor_killing | marital_exemption",
        "mechanism_shares": {"argument": int, "honor": int, "interest": int, "law": int, "substitution": int},
        "endogeneity": float,
        "snapback_risk": float,
        "confidence": float,
        "note": "string, max 40 words: the single consideration that most drove your honor share"
      }
    ],
    "rankings": {
      "honor_thesis_support": [{"case_id": string, "reason": "string, max 30 words"}],
      "argument_sensitivity": [{"case_id": string, "reason": "string, max 30 words"}],
      "snapback": [{"case_id": string, "reason": "string, max 30 words"}]
    },
    "endogeneity_durability": {
      "correlation": float,
      "justification": "string, max 60 words"
    },
    "thesis_verdict": {
      "best_single_mechanism": "argument | honor | interest | law | substitution",
      "honor_is_best_single_account": boolean,
      "statement": "string, max 80 words"
    },
    "least_confident_assignment": {
      "case_id": string,
      "field": string,
      "why": "string, max 60 words"
    }
  }
  ```

  Each ranking array must contain all five case_ids, ordered strongest first. After the JSON, add no more than 350 words defending the two allocations you expect to be most contested — one that an economic historian would attack for over-crediting honor, and one that a moral philosopher would attack for under-crediting argument. Do not pad this with a summary of the cases or a bibliography; I want the numbers and the reasoning that makes them non-arbitrary.
