  **Defense of Contested Allocations**  
  *Economic Historian's Challenge (slave_trade honor over-credited)*: Assigning honor 25 points may seem high against interest (20) given economic shifts in British capitalism. However, honor's share reflects how moral arguments *triggered* elite shame—traders became socially toxic before profitability collapsed. Appiah shows naval officers refusing to escort slave ships as "dishonorable," indicating status anxiety independent of economics. Interest scores lower because sugar profits remained viable during abolitionism; the shift required honor-driven stigma to activate.  

  *Moral Philosopher's Challenge (dueling argument under-credited)*: Dueling's argument share (10) appears low despite Enlightenment critiques. But contemporaries noted arguments failed for centuries; collapse accelerated only when Wellington's officers mocked duels as "unbecoming." Pamphlets like "The Evils of Dueling" (1804) gained traction only after honor codes shifted. Thus, moral reasoning was secondary to embodied shame among peers—aligning with Appiah's core thesis that argument follows, rather than drives, honor reconfiguration.
