  ## Bootstrapping a Convention
  To bootstrap a convention by publishing a text, the following should be true:
  - Common Knowledge: The publication must be widely disseminated and acknowledged by members (e.g., via a plenary session and follow-up confirmations).
  - Conditional Preference: There must be evidence that a critical mass of members (at least 30%) are willing to adopt the rule if others do.
  - Arbitrariness: There must be at least one alternative (even if worse) to make the rule arbitrary.

