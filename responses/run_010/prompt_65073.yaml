  ### Convention Classification Worksheet  
  **Purpose:** To classify a candidate rule as either:  
  - **A. Convention:** Will hold unaudited (publish as a convention).  
  - **B. Non-convention:** Cannot hold unaudited (requires audit).  
  - **C. Unclassifiable:** Insufficient evidence; specify the critical missing observation.  

  **Instructions:**  
  - Answer questions sequentially. Stop at the first terminal outcome (A, B, or C).  
  - Evidence sources: Implementation surveys, ticket logs, meeting minutes, incident reports, vendor documentation.  
  - **Judgment call flags:** Explicit thresholds/operationalizations are underlined.  
  - **Chair referral:** Marked where a value judgment (e.g., cost allocation) is required.  

  ---

  #### **Step 1: Current Regularity**  
  **Question:** Do ≥90% of members currently follow the rule?  
  - **Evidence:** Implementation surveys, audit reports, or incident logs showing compliance rates.  
  - **Sufficient answer:**  
    - **Yes:** Survey/report shows ≥36/40 members comply (90% threshold). Proceed to Step 2.  
    - **No:** Outcome **B** (regularity absent; cannot hold without audit).  
    - **Inconclusive:** Outcome **C** (state: "Need implementation survey data").  
  **Judgment call:** "≥90%" operationalized as 90% of 40 members (36/40).  

  #### **Step 2: Vendor/Tool Dependence**  
  **Question:** Is the regularity explained by shared vendor defaults or tools?  
  - **Evidence:** Vendor documentation (default settings), incident tickets (e.g., "bug in Vendor X caused deviation"), meeting minutes (references to vendor-driven behavior).  
  - **Sufficient answer:**  
    - **Yes:** >50% of members use the same vendor/tool enforcing the rule, AND no evidence of member-driven coordination (e.g., minutes show no discussion of alternatives). Outcome **B** (vendor-dependent; not self-sustaining).  
    - **No:** Proceed to Step 3.  
  **Judgment call:** Vendor dominance threshold set at >50% of members.  

  #### **Step 3: Audit Dependence**  
  **Question:** Did compliance emerge or persist only due to audit?  
  - **Evidence:** Audit history (findings pre-audit vs. post-audit), ticket logs (violations ceased after audit), minutes (discussions linking compliance to audit).  
  - **Sufficient answer:**  
    - **Yes:** Pre-audit non-compliance documented (e.g., >10% violation rate), AND no evidence of voluntary pre-audit compliance. Outcome **B** (audit-dependent; removal risks collapse).  
    - **No:** Proceed to Step 4.  
  **Judgment call:** Pre-audit non-compliance threshold set at >10% violation rate.  

  #### **Step 4: Independent Interest**  
  **Question:** Would each member follow the rule even if others defected?  
  - **Evidence:** Meeting minutes (e.g., "We do this because it benefits us alone"), incident logs (defection caused no interoperability issues), technical analysis (rule is only feasible option).  
  - **Sufficient answer:**  
    - **Yes AND no alternatives exist:** Outcome **A** (self-sustaining; no coordination problem).  
    - **Yes BUT alternatives exist:** Proceed to Step 5.  
    - **No:** Proceed to Step 5.  
  **Chair referral:** If alternatives exist but impose migration costs, the chair must decide if costs are fairly distributed.  
  **Judgment call:** "No interoperability issues" operationalized as zero incident reports linked to defection.  

  #### **Step 5: Mutual Expectations**  
  **Question:** Is there evidence members expect others to conform?  
  - **Evidence:** Incident reports (e.g., "Member A assumed Member B would use Rule X"), minutes (e.g., "We rely on others using this"), surveys (members cite "industry practice").  
  - **Sufficient answer:**  
    - **Yes:** At least two pieces of evidence from distinct sources (e.g., one incident report + one meeting minute). Proceed to Step 6.  
    - **No:** Outcome **C** (state: "Need evidence of expectations, e.g., member survey on reliance").  

  #### **Step 6: Arbitrariness (Alternatives)**  
  **Question:** Does a feasible alternative regularity exist?  
  - **Evidence:** Published standards (e.g., alternative rules in docs), minutes (discussions of alternatives), incident logs (examples of alternative use causing issues).  
  - **Sufficient answer:**  
    - **Yes:** Outcome **A** (convention; arbitrary solution with alternatives).  
    - **No:** Outcome **B** (no coordination problem; rule is necessary, not conventional).  
  **Chair referral:** If a minority uses an alternative, the chair must decide if overriding them is acceptable.  

  ---

  ### What the Worksheet Cannot Do  
  - **Persistence:** Lewis’s model is static. The worksheet assesses *current* conditions but cannot predict if a convention will hold in 5 years. It indirectly addresses persistence via:  
    - Step 2 (vendor lock-in risks),  
    - Step 4 (stability of independent interest),  
    - Step 5 (mutual expectations as a stabilizer).  
    **Gap:** Dynamic factors (e.g., market shifts) are not covered. The worksheet "papers over" this by relying on current evidence; it cannot close the gap.  

  ---

  ### Bootstrapping a New Convention  
  When a working group proposes publishing a text to *create* a convention (not classify an existing one):  
  1. **Lewis’s requirements for bootstrapping:**  
     - **Common knowledge:** The published text must be acknowledged by all members (e.g., via signed confirmations).  
     - **Mutual expectations:** ≥30% of members ("critical mass") must pre-commit to adopt, creating baseline expectations.  
     - **Arbitrariness:** At least one alternative must exist (or be proposed).  
  2. **Typical failure modes:**  
     - Published text lacks common knowledge (e.g., members ignore it).  
     - No critical mass commits, so expectations don’t form.  
     - Alternatives are technically inferior, making the rule non-arbitrary.  
  3. **Cheapest reliable substitute:**  
     - Temporarily impose audit until ≥60% compliance is achieved *and* mutual expectations are documented (e.g., via surveys). Then reclassify as a convention.  

