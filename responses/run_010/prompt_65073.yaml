  Lewis's conditions for a convention are (roughly):
  1. A regularity in behavior.
  2. Mutual expectations: everyone expects everyone else to conform.
  3. Preference to conform on condition that others do (conditional preference).
  4. Common knowledge of the above.
  5. The existence of at least one alternative regularity that could have been established instead (arbitrariness).

  We must translate these into questions that can be answered with the available evidence. We also need to avoid common confusions (like regularity due to vendor defaults, audit, independent interest, or universal dissatisfaction).

  Important:
  - We must drop or simplify conditions that are impractical. Common knowledge is difficult to establish without direct evidence. However, we can approximate it by looking for public evidence (like published documents, meeting minutes, etc.) that the practice is known and accepted. The arbitrariness condition (existence of alternatives) is crucial because without it, the practice might be sustained by independent interest. 
  - We will drop the common knowledge condition in its full philosophical sense and replace it with evidence of widespread awareness and discussion. But note: if we drop arbitrariness, we risk misclassifying a practice that is sustained by independent interest as a convention. Therefore, we keep arbitrariness.

  The worksheet will be a sequence of questions. Each question must have explicit criteria for what counts as sufficient evidence. The terminal outcomes are:
  A. This will hold unaudited (convention).
  B. This cannot hold unaudited (needs audit).
  C. Cannot be classified (need more evidence, and specify what).

  Additionally, we must mark steps that are value judgments (to be decided by the working-group chair) and flag any step that is a judgment call with an operational definition.

  The procedure cannot predict the future. Lewis's analysis is static. We are assessing the current state. For persistence, we must rely on current conditions and perhaps look for signs of stability (like duration, absence of complaints). But we cannot guarantee it will hold for five years. We can only say that given the current conditions, it is (or is not) self-sustaining.

  Now, for creating a convention: We are asked what must be true for a published text to bootstrap a convention. Lewis would require that the publication creates mutual expectations and conditional preferences. Typically, what goes wrong is that without a critical mass of adoption, the mutual expectations don't form. The cheapest substitute when it fails is to start with a small group (a coalition of the willing) and then expand, or to use audit until a critical mass is reached.

  Worksheet Design:

  We break down into questions:

  1. **Regularity**: Is there a current regularity in behavior? 
     - Evidence: Implementation surveys, ticket logs (showing consistent practice), incident reports (if inconsistent, they might show up). 
     - Criteria: At least 90% of members follow the rule? (We set a threshold to avoid edge cases. But note: if there are a few exceptions but no problems, it might still be regular. However, we need to check why the exceptions exist.) 
     - If no, then it's not a convention (but note: we might be trying to create one). 
     - If yes, proceed.

  2. **Source of Regularity**: We must rule out non-convention sources.
     - **Vendor Default/Shared Tool**: Is the regularity due to a shared tool or vendor default? 
       - Evidence: Vendor documentation, meeting minutes where vendors are discussed, incident reports that attribute the practice to a vendor. 
       - Criteria: If the majority of members using the same vendor and the vendor sets the default, and there is no evidence of members actively choosing or expecting others to follow, then it's vendor-driven. This is not a convention. 
     - **Sustained by Audit**: Is the regularity only because of the audit? 
       - Evidence: History of the rule. Was it implemented only after audit? Have there been findings in the past? If we remove the audit, do we have evidence that members would not follow? 
       - Criteria: If the rule was previously violated until audit was imposed, and there's no evidence of voluntary compliance before, then it's probably sustained by audit. 
     - **Independent Interest**: Is the rule in everyone's independent interest? (i.e., even if others did not follow, a member would still follow because it's beneficial for them regardless) 
       - Evidence: Meeting minutes where members express that they do it because it's best for them, regardless of others. Also, if there is no alternative that anyone would prefer, then it's independent. 
       - Criteria: If we can identify that the rule is the only rational choice for each member (e.g., because of technical constraints or clear self-interest without coordination), then it's not arbitrary and not a convention. 
     - **Universal Dissatisfaction**: Does everyone wish the rule were different? 
