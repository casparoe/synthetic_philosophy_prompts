  ## Bootstrapping a Convention

  For a drift to be stopped by publishing a convention, the following must be true in Lewis's terms:
  - The publication must create common knowledge of the rule and the mutual expectations.
  - There must be a conditional preference among members to follow the rule if others do.
  - There must be at least one alternative (so that the rule is arbitrary).

  Typically, what goes wrong:
  - The publication does not reach enough members to create common knowledge.
  - There is no critical mass of adoption to create the initial expectations. 
  - Members do not have a conditional preference (they are not willing to switch).

  Cheapest reliable substitute:
  - Start with a small group of early adopters (maybe by region or size) who agree to switch and audit them temporarily until a critical mass is reached, then remove audit.

