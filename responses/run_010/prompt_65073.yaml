  - **Terminal:** **B** (cannot hold unaudited).  
  - **Note:** Case is well-constructed; illustrates critical role of regularity threshold.  

  ---

  ### Confidence and Limitations  
  **Confidence level:** I am **confident enough** to let a reviewer run this unsupervised, provided:  
  - Reviewers are trained on evidence-gathering (e.g., parsing minutes, logs).  
  - Steps with chair referrals (Steps 4, 6) are flagged for oversight.  
  - Judgment calls (thresholds) are monitored for real-world validity.  

  **Least sure claim:** That **Step 4 (Independent Interest)** reliably separates conventions from non-conventions.  
  - **Evidence to falsify it:** If a rule passes Step 4 (independent interest + alternatives) but later collapses due to defection (e.g., members abandon it when alternatives emerge), the step is flawed. This would indicate the worksheet overestimates stability.  
  - **Mitigation:** Track outcomes of A-classified rules; if >10% degrade within 2 years, revise Step 4 to require stronger evidence of incentive alignment.  

  **Final note:** No candidate "came out against you" gratuitously; results reflect worksheet logic. Candidate 2’s outcome aligns with Lewis: audit-dependent rules lack mutual expectations, making them non-conventions.
