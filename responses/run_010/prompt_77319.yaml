  **Ruling 5**: A resident adviser (RA) who had never met the accused raised a matter on her assigned floor. Standing granted.

  * Principle: Standing is granted based on the official role in the community, even without personal acquaintance. The role gives a legitimate interest.

  **Ruling 6**: A longtime volunteer, blameless himself, blamed a student without asking for the student's account. The student had a valid reason (parent's bedside). Standing lost. The log is ambiguous: either (a) he condemned without understanding, or (b) he spoke for a community he had not consulted.

