  ### Step 1: Principles Jointly Consistent with Rulings 1–7
  After reconciling the rulings, five principles emerge. They are consistent because:
  - Ruling 1 refutes a simple "if guilty of the same offense, lose standing" principle (since the student retained standing despite guilt by not exempting herself).
