  Here are the principles:

  1. **Non-Exemption Principle**: Standing requires that the complainant does not place themselves above the rule they invoke. If they admit fault and seek joint accountability (even if guilty), standing is retained. If they imply superiority (e.g., by not acknowledging comparable faults), standing is lost. *Source: Ruling 1 (student admitted fault) vs. Ruling 2 (professor did not). Matches the moral concept of impartiality.*

  2. **Role Principle**: Standing is granted based on a formal role connected to the matter (e.g., official duties), irrespective of personal acquaintance. However, the role does not immunize against other principle violations. *Source: Ruling 5 (RA's role granted standing) and Ruling 6 (volunteer's role did not prevent loss due to other failures).*

  3. **Due Diligence Principle**: Standing requires the complainant to make a reasonable effort to understand the situation before accusing, including giving the accused a chance to explain. Failure results in loss of standing. *Source: Ruling 6 (volunteer didn't ask the student) and Ruling 7 (donor refused reply); also implied by Ruling 3 (groundskeeper focused on consequences only after investigation).*

  4. **Equal Treatment Principle**: Standing requires treating the accused as an equal in the process. Disrespect, refusal to allow a response, or unfair evidence-gathering (e.g., privacy violations) results in loss. Blamelessness does not override this. *Source: Ruling 7 (donor refused reply) and Ruling 3 (groundskeeper's partial loss for shared fault).*

  5. **Community Nexus Principle**: Standing requires a direct connection to the affected community. No connection means no standing. *Source: Ruling 4 (parent with no link) and Ruling 5 (RA's role provided nexus).*

