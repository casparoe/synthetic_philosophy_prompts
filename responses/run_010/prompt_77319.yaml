  **Ruling 3**: A groundskeeper who was habitually late complained about a colleague's lateness. His complaint about the lateness as such was set aside, but he could describe how the absences affected the shared rota (i.e., the impact on the community).

  * Principle: If the complainant shares the same fault, they lose standing to complain about the fault itself. However, they may still speak to the consequences of the fault that do not depend on their own blamelessness (i.e., the harm to the community).

  **Ruling 4**: A parent with no connection to the college community demanded censure for off-campus behavior that didn't harm the college. The circle declined to convene.

