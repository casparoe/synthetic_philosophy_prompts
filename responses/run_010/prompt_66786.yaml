answer: |-
  **(First Stanza)**  
  This ridge was made for steering flight—  
  Before you ask what I am for.  
  A gap that had to end up somewhere,  
  They traced the lines and traced them more.  

  **(Second Stanza)**  
  Before you ask what I am for,  
  They traced the lines and traced them more.  
  (For flight! For grace! For aerodynes!)  
  A gap that had to end up somewhere.  

  **(Third Stanza)**  
  A gap that had to end up somewhere,  
  The folded shields required a seam.  
  No grand design for stratosphere,  
  Just how the casing locked the beam.  

  **(Fourth Stanza)**  
  Just how the casing locked the beam.  
  The dew now finds a runnel here—  
  A task unplanned, a borrowed groove.  
  No grand design for stratosphere.  

  **(Fifth Stanza)**  
  No grand design for stratosphere?  
  The dew now finds a runnel here.  
  Before you ask what I am for,  
  The purpose came long after.  

  ---

