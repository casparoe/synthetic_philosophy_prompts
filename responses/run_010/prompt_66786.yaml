  - **Jargon-Free**: No "spandrel" or "exaptation," only implied concepts.  
  - **Clincher**: Last two lines reject teleology ("Before you ask... / The purpose came long after").  

  Key stanzas: Stanza 2 = Panglossian reflex; Stanza 3 = Architectural necessity.
