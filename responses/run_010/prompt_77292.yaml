prompt: |-
  I run standards and clearances at an independent production company that makes prestige limited series and feature films out of real events, and I am the person who signs off on what we invent about people who are dead. Two or three projects a year land on my desk, each generating somewhere between thirty and two hundred individual dramatization decisions. Our current internal rule is one sentence long: if a claim about a real person appears in a reputable published source we may put it on screen, and if it does not we may not. It has failed in both directions. It blocked a scene in which a thoroughly documented public figure says something privately to his wife that no source records but that any historian of the period would regard as near-certain. And it permitted a scene in which a mid-level supervisor in a documented industrial disaster is shown reading a warning and deciding not to pass it on, because a single contemporary newspaper account had described his shift as having disregarded a warning — nothing in the record establishes what that man knew, or when, or what he decided.

  I would like that sentence replaced with a real decision procedure. Please write it as something my team can actually run: a short ordered set of questions to put to any proposed scene, line of dialogue, character, or structural rearrangement; what counts as a sufficient answer at each step; where the procedure stops with a refusal; where it stops with a conditional clearance and names the condition; and where it stops being a procedure at all and hands the decision to a human because the remaining question is one of value rather than fact. Two constraints on the machinery. It must be runnable by a competent producer with no training in philosophy — about half a day per project, plus a fifteen-minute fast track for individual scenes flagged late in post-production. And every decision must leave a written reason in a file that could be read aloud, without embarrassment, to the family of the person portrayed. Our showrunner may override any clearance, but I want the procedure to specify what an override costs: what has to change elsewhere in the project to keep the whole defensible.

  The procedure has to preserve certain distinctions that our one-sentence rule flattens, and I want you to tell me where my list is wrong. Inventing what someone said, versus inventing what they did, versus inventing why they did it, do not feel like the same offence to me, and I suspect the third is the worst and the least discussed. A composite built out of several real people is not the same as a wholly invented character who interacts with real ones. A person who was already a public figure in life is not in the same position as a private individual dragged into the record by an event. A portrayal that adds to a reputation is not the same as one that subtracts from it, and neither is the same as one that is morally neutral but intimate. And I do not know what a disclosure card at the end actually accomplishes: whether stating that characters have been composited and events rearranged discharges an obligation, or merely announces that we chose not to discharge it. If the philosophy in this area has better distinctions than these, use them; if it says some of mine collapse into each other, say which and why.

  Two further things I want handled explicitly rather than assumed away. First, identifiability: what we seem to owe varies enormously between a nameless face in a crowd, a named victim, a named perpetrator, and a household name, and it seems to vary in a second dimension too, since a person about whom a great deal has been published is more easily checked by a viewer than a person about whom almost nothing has. I want to know whether the obligation scales with how readily the audience attaches our portrayal to a specific human being, with how readily that portrayal can be corrected, or with something else, and how those factors trade off. Second, objections from living relatives: our lawyers remind us that in most jurisdictions the dead cannot be defamed and their relatives cannot sue on their behalf, so the law sets a floor far below anything we plausibly owe. The procedure must say when a family objection binds us, when it is evidence to be weighed, and when it is simply not our call to defer to — and it must not pretend that this last category is empty.

  I should also flag a background worry, because I do not want the procedure to resolve it silently. I understand there is a live philosophical dispute about whether a person can be harmed at all by things that happen after they die, and about whether duties to the dead are really duties to the living, or to the record, or to ourselves as people who tell stories. Whichever of those views your procedure presupposes, state it, and state what would change if the opposite were true.

  Finally, run the procedure on three cases. They are invented, and I would rather you not substitute real films or real people for them. At least one of the three must come out in a way I will find unwelcome; tell me which one, and why the procedure says what it says rather than bending.

  Case A. A six-part series about a woman who organized a strike at a textile mill in the 1940s. She is a well-documented public figure: trial transcripts, extensive newspaper coverage, two serious biographies. The record is almost entirely silent on her private life. The writers want her to have a sustained romantic relationship with a composite character assembled from three real organizers, because it supplies the series with an emotional through-line and because the alternative is a protagonist with no interior life on screen. Nothing in the proposed portrayal is discreditable. Her two grandchildren are alive, have cooperated with the production, and object.

  Case B. A feature about an industrial disaster in which eleven men died. One character is a named shift supervisor who died in the event himself. An internal log shows that a warning was recorded on the preceding shift; nothing shows whether he saw it. In the film he reads it and chooses not to pass it on because his shift is behind schedule. The film closes with a card stating that events are based on the official inquiry. His adult children live in the town where the disaster happened and have not been contacted.

  Case C. A biopic of a very famous writer. The key scene is a cruel remark he makes to his daughter, taken word for word from a letter of his own — but a letter written to a third party in the middle of an argument he was trying to win. His biographers note that the letter overstates what he felt, and his daughter's own much later memoir records that he apologized. The film keeps the line and drops the apology, because the apology belongs to a scene that was cut for length.

  Do not give me a bibliography, a reading list, or citations; I cannot check them and they are not what I am asking for. I want the reasoning and the machinery, and I want you to be candid about which of the steps are judgment calls wearing the costume of procedure, and about what the procedure as a whole cannot do.

  For each of the three cases, end your discussion of it with a line in exactly this form:

  VERDICT: [A|B|C] | [CLEAR / CLEAR-WITH-CONDITIONS / REVISE / BLOCK] | [the step number of your procedure that decides it]

  The final line of your response must begin "Verdict:" and must state, in one sentence, which single step of your procedure you expect to be abused most often once it is in the hands of a production under schedule pressure.
reasoning: |-
  Hmm, the user is asking me to design a decision procedure for historical dramatization clearances at a production company. They're clearly frustrated with their current one-sentence rule that requires everything to be in a reputable published source. This rule has failed in both directions - blocking plausible scenes and permitting misleading ones. They want a practical, step-by-step procedure that can be run by producers without philosophy training, takes about half a day per project, and leaves defensible written records.

  There are several key distinctions they want preserved that their current rule flattens: inventing words vs. actions vs. motivations, composite characters vs invented ones, public figures vs private individuals, and how portrayals affect reputations. They also want explicit handling of identifiability and family objections, plus acknowledgment of philosophical disputes about duties to the dead.

  I need to create a structured 10-step procedure that addresses all this. For each step, I'll need to define the question, what counts as sufficient evidence, and possible outcomes (clear, revise, block, etc.). I should include practical considerations like how overrides work and what conditions might be attached to approvals. The procedure must generate written reasons that could be read to portrayed individuals' families without embarrassment.

  I'll need to test this procedure against three cases they've provided:
  - Case A: Adding a fictional romantic relationship to a well-documented historical figure with family objections
  - Case B: Showing a deceased shift supervisor making a negligent decision despite ambiguous evidence
  - Case C: Using a writer's cruel letter to his daughter without including his later apology

  For each case, I'll need to walk through the procedure step by step and give a verdict in their specified format. I'll make sure at least one outcome is unwelcome to demonstrate the procedure's integrity.

  The philosophical foundation I'll use is that while the dead cannot be harmed, we have duties to historical truth and to living communities. The procedure should acknowledge where judgment calls are inevitable, especially around motivation invention and reputational harm.

  I'll conclude by identifying which step is most likely to be abused under production pressures - probably the motivation invention step, as it's highly interpretive. The key is balancing historical fidelity with narrative needs while maintaining ethical defensibility.
answer: |-
  Here is a decision procedure designed for your team, balancing ethical fidelity, practicality, and defensibility. It is structured as a 10-step checklist. Each step must be answered sequentially; proceed only if the prior step is satisfied or explicitly bypassed. Written justifications are required at *every* step where a decision is made (Clear, Revise, Block, Conditional, or Human Judgment). Overrides by the Showrunner require adding a specific disclosure card naming the overridden element and its fictionalized nature *and* a producer memo justifying the override for the permanent file.

  **Philosophical Foundation:** The procedure assumes duties are owed *to the living* (viewers, communities, families) and *to the historical record* for accuracy and context. Duties to the dead are mediated through these. Harm occurs primarily through misrepresentation that shapes public memory or causes distress to living communities/relatives. If duties were *solely* to the deceased (e.g., respecting their reputational interests as if alive), Steps 3, 4, and 6 would become significantly stricter, potentially blocking many dramatizations involving private acts or motivations.

  **Decision Procedure: Historical Dramatization Clearance Checklist**

  1.  **Is the portrayal of a Real, Identifiable Person (RIP)?**
      *   **Question:** Is the character intended to represent a specific, named (or readily identifiable by role/context) human being who existed?
      *   **Sufficient Answer:** Clear "No" only if: Unnamed background figure OR Wholly Composite Character (Step 7) OR Wholly Invented Character (Step 7). Otherwise, "Yes".
      *   **Outcome:**
          *   **No:** Proceed to Step 7 (Composites/Invented).
          *   **Yes:** Proceed to Step 2.
      *   **Written Reason Requirement:** State who the RIP is and basis for identifiability (name, unique role, visual distinctiveness, etc.).

  2.  **Public Figure vs. Private Individual?**
      *   **Question:** Was this person, *at the time of the depicted events*, widely known to the public beyond their immediate role in the event (e.g., celebrity, major politician, renowned expert)? OR Is their identity/perspective primarily defined by the documented event itself?
      *   **Sufficient Answer:** "Public Figure" requires significant contemporaneous media coverage, published biographies, or official records *beyond* the core event documents. Otherwise, "Private Individual".
      *   **Outcome:** Categorization flows to later steps (Steps 3-6 apply stricter standards to Private Individuals). Proceed to Step 3.
      *   **Written Reason Requirement:** Justify categorization based on source material scope and contemporaneous public awareness.

  3.  **Does the Portrayal Attribute Specific Words?**
      *   **Question:** Are specific words spoken by the RIP being invented?
      *   **Sufficient Answer:** "Yes" if dialogue is created. "No" only if dialogue is verbatim from a reliable, attributable source (e.g., letter, transcript, verified memoir, credible eyewitness account).
      *   **Outcome:**
          *   **No:** Proceed to Step 4.
          *   **Yes:** Requires **Conditional Clearance**. Condition: A disclosure card must state: "Dialogue has been created for [Character Name] in scenes of private interaction." Proceed to Step 4.
      *   **Written Reason Requirement:** If "No," cite source. If "Yes," state why the invented dialogue is necessary for narrative coherence or essential character insight *and* why no verbatim alternative exists. Explain why it isn't defamatory or grossly implausible.

  4.  **Does the Portrayal Attribute a Specific, Documented Action?**
      *   **Question:** Is the RIP shown performing a specific, significant physical act not documented in reliable sources?
      *   **Sufficient Answer:** "Yes" if the *specific act* is invented. "No" if the act is documented OR is a minor, plausible action inferable from documented behavior/context (e.g., a public figure known for speeches *giving* a speech).
      *   **Outcome:**
          *   **No:** Proceed to Step 5.
          *   **Yes:** Requires **Conditional Clearance**. Condition: A disclosure card must state: "Specific actions by [Character Name] have been dramatized." AND Requires strong historical plausibility (Step 5 assessment must pass). Proceed to Step 5.
      *   **Written Reason Requirement:** If "No," cite source for documented act or justify plausibility. If "Yes," justify necessity, historical plausibility based on context/character, and absence of defamatory intent/effect.

  5.  **Does the Portrayal Attribute a Specific Motivation or Internal State?**
      *   **Question:** Does the scene/dialogue explicitly state or heavily imply *why* the RIP acted (e.g., greed, fear, love, ambition) OR depict a specific, private emotional/mental state (e.g., deep depression, secret hatred) not directly stated in reliable sources?
      *   **Sufficient Answer:** "Yes" if motivation/internal state is asserted without direct source evidence (e.g., diaries, credible self-reporting). "No" if motivation is directly stated OR if portrayal only shows observable behavior from documented actions/context.
      *   **Outcome:**
          *   **No:** Proceed to Step 6.
          *   **Yes:** **High Risk - Hand to Human Judgment.**
              *   **Human Judgment Criteria:** Is the attributed motivation (a) *Highly plausible* given documented actions and historical context? (b) *Essential* for the core narrative or character arc? (c) *Not significantly damaging* to the RIP's reasonable reputation? (d) *Not the primary driver* of a negative portrayal if the RIP is a Private Individual?
              *   **Human Outcome:** If ALL criteria met, **Conditional Clearance**. Condition: Disclosure card: "Interpretations of [Character Name]'s motivations are dramatic interpretations." If ANY criterion not met, **Revise** (remove explicit motivation/internal state assertion) or **Block** (if central and irreplaceable). Proceed to Step 6 regardless.
      *   **Written Reason Requirement:** Detailed justification from Human Judgment meeting the criteria OR clear explanation of Revision/Block.

  6.  **Net Reputational Effect & Intimacy:**
      *   **Question:** Does this portrayal, in context, significantly add to, subtract from, or reveal intensely private aspects of the RIP's reputation? Is it morally neutral?
      *   **Sufficient Answer:** Assessment based on the cumulative portrayal and *this specific element*.
      *   **Outcome:**
          *   **Adds/Neutral:** Proceed to Step 8. (Less stringent scrutiny).
          *   **Reveals Intensely Private:** **Conditional Clearance** ONLY for Public Figures AND if essential to core narrative. Condition: Disclosure card: "Private aspects of [Character Name]'s life are depicted based on historical interpretation." Proceed to Step 8.
          *   **Subtracts (Negative):** **High Risk - Conditional Clearance ONLY IF:** (a) RIP is a Public Figure, AND (b) The negative portrayal is strongly supported by documented actions/consequences (Step 4 passed clearly), AND (c) Motivation (if attributed - Step 5) passed Human Judgment, AND (d) Not based *solely* on contested/disputed sources. Condition: Disclosure card MUST specify the contested nature if applicable: "Portrayals of [Character Name] reflect interpretations of documented events." **BLOCK** if RIP is a Private Individual OR if negative portrayal relies on invented actions/weakly supported motivations. Proceed to Step 8 if cleared.
      *   **Written Reason Requirement:** Explicitly state the net effect, why it's categorized as such, and justification for the outcome (Clear/Conditional/Block).

  7.  **Composite or Wholly Invented Character?**
      *   **Question:** Is this character a combination of several real people (Composite) or entirely fictional (Invented)?
      *   **Sufficient Answer:** "Composite" if amalgam of 2+ RIPs sharing a *similar role/function*. "Invented" if no specific RIP forms the basis.
      *   **Outcome:**
          *   **Composite:** **Conditional Clearance.** Condition: Disclosure card MUST state: "The character [Character Name] is a composite figure representing several individuals." Rigorously ensure the composite *cannot* be reasonably mistaken for any single RIP (change name, avoid unique biographical details).
          *   **Invented:** **Clear** if interactions with RIPs are plausible and don't distort known history. **Revise** if invented character forces implausible/undocumented actions onto an RIP.
      *   **Written Reason Requirement:** For Composites: List the real individuals informing the composite and justify name/feature changes preventing misidentification. For Invented: Justify plausibility and lack of distortion.

  8.  **Identifiability & Correctability:**
      *   **Question:** How easily could a reasonable viewer associate this specific portrayal with the specific RIP? How easily could a viewer correct the portrayal (i.e., access countervailing information)?
      *   **Sufficient Answer:** Assess: Prominence of role? Name used? Visual distinctiveness? Amount of public information about the RIP? (More info = higher correctability).
      *   **Outcome:** Informs severity in Steps 3-6. High Identifiability + Low Correctability (e.g., obscure Private Individual) demands **stricter application** of prior steps (especially 4, 5, 6). Low Identifiability + High Correctability allows more flexibility. *No standalone Clear/Block here* – it modifies the *rigor* applied to prior RIP steps or Step 7 plausibility.
      *   **Written Reason Requirement:** Explicitly state assessment of Identifiability and Correctability and how it influenced the rigor applied to prior steps.

  9.  **Family/Living Descendant Input:**
      *   **Question:** Have living close relatives/descendants been identified? Have they been contacted (consulted or notified)? Do they object?
      *   **Sufficient Answer:** Reasonable effort must be made to identify close relatives for *Private Individuals* or where portrayal involves intense privacy or significant negative reputational effect. Contact is strongly encouraged but not always mandatory (e.g., unlocatable, hostile).
      *   **Outcome:**
          *   **No Relatives Identified/Contacted:** Proceed to Step 10. (Procedure continues).
          *   **Relatives Consulted, No Objection:** Proceed to Step 10. (Strengthens defensibility).
          *   **Relatives Object:** **Does NOT automatically Block.** Objection is **Evidence to be Weighed** in Human Judgment (Step 5) and Net Effect (Step 6). **BLOCK ONLY IF:** Objection highlights a *factual inaccuracy* in a key portrayal element (requiring Revise) OR reveals a *gross violation* of the procedure (e.g., inventing a damaging action for a Private Individual without basis). Otherwise, objection is noted in file and disclosure may be strengthened. Proceed to Step 10.
      *   **Written Reason Requirement:** Document efforts to identify/contact. Record any objections verbatim. State how the objection was weighed (e.g., "Objection noted regarding private relationship portrayal; deemed essential narrative element for Public Figure, disclosure added." OR "Objection highlights factual error in depicted date; scene revised.").

  10. **Overall Narrative Justification & Disclosure:**
      *   **Question:** Is the dramatic invention/alteration *necessary* for a coherent narrative that conveys the core historical truth? Does the required disclosure adequately frame the dramatization for the audience?
      *   **Sufficient Answer:** Final holistic review. "Necessary" means the narrative would be significantly impaired *or* core character insight lost without it. Disclosure checks: Have all conditions from prior steps (esp. 3,4,5,6,7) been compiled into a clear, non-legalese end card?
      *   **Outcome:**
          *   **Necessary & Disclosure Adequate:** **CLEAR**
          *   **Necessary & Disclosure Inadequate:** **REVISE** (Disclosure)
          *   **Not Necessary:** **REVISE** (Element) or **BLOCK** (if central element lacks justification).
      *   **Written Reason Requirement:** Briefly state the core historical truth the project conveys. Justify the necessity of *each* major invention/alteration flagged in prior steps for narrative coherence or essential insight. Confirm final disclosure language.

  **Where Judgment Masks as Procedure:** Steps 5 (Motivation - Human Judgment), 6 (Net Effect), 8 (Identifiability/Correctability assessment), and 10 (Narrative Necessity) involve significant judgment. Step 5 is the most explicitly judgment-based. The procedure structures and constrains these judgments but doesn't eliminate them.

  **What the Procedure Cannot Do:** It cannot guarantee historical perfection or prevent all offense. It cannot resolve deep philosophical disputes about truth in history. It cannot force compelling storytelling. It relies on the integrity of the team running it, especially during Human Judgment calls and narrative justification.

  ---

  **Application to Cases:**

  *   **Case A (Mill Organizer's Romance):**
      *   Step 1: Yes (RIP - Organizer).
      *   Step 2: Public Figure (well-documented).
      *   Step 3: Yes (Invented Dialogue). **Conditional Clearance:** Disclosure required for private dialogue.
      *   Step 4: Yes (Invented Action - engaging in the specific sustained romantic relationship). **Conditional Clearance:** Disclosure required + Plausibility Check (Step 5).
      *   Step 5: **Human Judgment:** (a) Plausible? (Likely Yes - human context). (b) Essential? (Argued Yes - emotional through-line). (c) Damaging? (No - not discreditable). (d) Negative Driver? (N/A - not negative). **Conditional Clearance:** Disclosure required for motivations/private life.
      *   Step 6: Reveals Intensely Private. **Conditional Clearance:** Disclosure required (as above).
      *   Step 7: N/A (Composite Character separate assessment - likely Conditional Clearance with disclosure).
      *   Step 8: High Identifiability (name, story focus), High Correctability (biographies exist). Allows flexibility applied.
      *   Step 9: Relatives Object. **Evidence Weighed.** Objection noted, but portrayal deemed essential for Public Figure narrative, not discreditable, with disclosures. Not a Blocking objection under criteria.
      *   Step 10: Invention necessary for narrative/insight? Argued Yes. Disclosures required. **REVISE** (Ensure disclosures cover invented private life/relationship for RIP *and* composite nature of lover).
      *   **VERDICT: A | CLEAR-WITH-CONDITIONS | 10** (Conditions: Specific disclosure cards for invented private dialogue/actions for RIP, motivation interpretation, and composite lover).

  *   **Case B (Shift Supervisor Negligence):**
      *   Step 1: Yes (RIP - Supervisor).
      *   Step 2: Private Individual (defined by the event).
      *   Step 3: Likely Yes (Invented Dialogue - "chooses not to pass it on"). **Conditional Clearance:** Disclosure required.
      *   Step 4: **Yes** (Invented Action - *reading* the specific warning and *choosing* not to pass it on). *Record shows warning existed, shift "disregarded" - but NOT that HE saw it, read it, or made a conscious choice.* **Conditional Clearance?** STOP. **BLOCK.** Why: Attributing a *specific, significant, negative* action (conscious negligence) to a *Private Individual* with no direct evidence (only inference from group "disregard"). Step 4 requires documented act or *minor plausible* inference. This is a major, damaging, unsupported inference. Violates core constraint for Private Individuals.
      *   Step 5: N/A (Blocked at 4, but motivation invention would also be highly problematic).
      *   Step 6: N/A (Blocked at 4, but portrayal is severely Negative).
      *   Step 8: High Identifiability (named, central role), Low Correctability (obscure individual, likely little public info). **Demands stricter standards - Block at Step 4 reinforced.**
      *   Step 9: Relatives not contacted. Doesn't change Block, but highlights ethical failure in process.
      *   Step 10: N/A (Blocked).
      *   **VERDICT: B | BLOCK | 4** (Inventing a specific, damaging, undocumented action for a Private Individual).

  *   **Case C (Writer's Cruel Remark - Omitted Apology):**
      *   Step 1: Yes (RIP - Writer; RIP - Daughter).
      *   Step 2: Public Figure (Writer); Private Individual (Daughter, though memoirist).
      *   Step 3: **No** for Writer (Words verbatim from his letter). **Yes** for Daughter (Implied reaction/omission of apology context is invented dialogue/state). **Conditional Clearance:** Disclosure for Daughter's private reaction.
      *   Step 4: **No** (No invented physical actions).
      *   Step 5: **CRITICAL STEP.**
          *   Writer: Portrayal implies his *sustained* cruel intent/motivation by omitting the later apology. **Human Judgment:** (a) Plausible? (Letter exists, but context/apology omitted - selectively plausible). (b) Essential? (Dramatic impact, but arguably manipulative without context). (c) Damaging? (Yes - reinforces worst interpretation). (d) Negative Driver? (Yes - central to his portrayal here). **Human Outcome: REVISE.** Reinsert apology context or recontextualize the line explicitly within the argument. Block if irreplaceable scene refusing context.
          *   Daughter: Portrayal implies her reaction without documented state. **Human Judgment:** Likely Clear with Disclosure (Conditional from Step 3), unless reaction is extreme/unfounded.
      *   Step 6: Negative for Writer (by omission), Reveals Private for Daughter. **Conditional Clearance** for Daughter (disclosure). **REVISE** for Writer (due to Step 5).
      *   Step 10: Omission necessary? Argued for length, but creates distortion. Disclosure ("Events condensed") insufficient alone. **REVISE** (Restore apology context or equivalent framing for Writer's remark).
      *   **VERDICT: C | REVISE | 5** (Omission of context invents a damaging sustained motivation for the Writer without basis, requiring restoration of context or reframing).

  **Unwelcome Verdict:** Case B (Blocked). The procedure prioritizes protecting Private Individuals from unsupported negative actions over narrative convenience or inference, even when emotionally logical. It deems the inference ("he must have seen it and chosen not to act") too speculative and damaging to portray as fact.

  **Verdict:** The step most likely to be abused under schedule pressure is **Step 10 (Overall Narrative Justification)**. Producers may be tempted to accept weak arguments for "necessity" or approve inadequate disclosure language to avoid costly revisions late in production, potentially undermining the procedure's ethical safeguards.
