answer: |-
  ## Commissioner's Opinion: Calloway Grist Mill Designation Review

  **1. Recommendation (Approx. 150 words)**

  I move to **uphold the designation** of the Calloway Grist Mill, **subject to the following concrete conditions**:

  1.  **Establish a Cumulative Threshold:** The Commission shall adopt, within six months, a clear quantitative threshold (e.g., no more than 50% replacement of principal structural members cumulatively since designation) to assess "substantial retention" moving forward. This threshold shall apply prospectively to *future* alterations.
  2.  **Baseline Documentation:** Within one year, the owner shall fund, and the Commission shall approve, comprehensive archival documentation (e.g., detailed photogrammetry, material analysis) establishing the *current* state of the Mill's "historic fabric" as the new baseline against which future cumulative loss will be measured.
  3.  **Future Review Trigger:** Any future application proposing alterations impacting principal structural members must explicitly state the cumulative percentage of replaced members since the 2026 baseline and demonstrate compliance with the new threshold.

  This preserves the Mill's status, acknowledges the validity of past approvals under the rules *as administered then*, but establishes a measurable, enforceable standard for the future based on the cumulative concern now evident.

  **2. What the Ordinance is Asking of Us (Approx. 350 words)**

  The ordinance requires us to determine if the Calloway Mill "substantially retains its historic fabric." The indeterminacy here stems primarily from **our language and our knowledge of where the line falls**, not inherently from the building itself.

  *   **The Building:** The building presents a tangible, albeit altered, state. We can quantify material replacement (68% principal members new since 1979). The building's *current* state is a fact.
  *   **Our Language:** "Substantially retains its historic fabric" is inherently qualitative and elastic. "Substantially" implies a significant portion remains, but offers no numerical definition. "Historic fabric" is broad, encompassing materials, craftsmanship, design, and potentially intangible aspects like continuity of use/location. The ordinance provides no further definition.
  *   **Our Knowledge of the Line:** We lack a defined point where "substantial retention" objectively ceases. Does 32% original structure suffice? 20%? 51%? Is continuity on the original foundation enough? The 1998 "rolling window" rule addressed *individual interventions*, not *cumulative effect*, revealing our lack of a clear cumulative standard.

  **Does this diagnosis change how we rule?** Yes, significantly. The shortfall lies in *our framework* for interpreting the ordinance, not in a sudden failure of the building post-2016. The building has *become* the test case for the cumulative ambiguity our rules never resolved. Voiding the designation based solely on today's cumulative percentage, when every step was approved under our past interpretations and rules (like the rolling window), would be fundamentally unfair. It would punish the owner for relying on our prior approvals and expose the Commission to accusations of arbitrary retroactive application. Our task is not to find the building suddenly deficient against a standard we never clearly articulated cumulatively, but to address the interpretive gap our past practice revealed.

  **3. The Rolling Window and Why it Failed (Approx. 400 words)**

  The 1998 "rolling window" rule (no single campaign replacing >50% of principal members within 20 years) failed to protect cumulative integrity because it was designed to prevent catastrophic, single-event loss, not death by a thousand cuts. It assessed each intervention in isolation, blind to the aggregate impact over decades. Each project (1986 rafters, 1994 sills, 2003 siding, 2011 joists, 2016 wheel) met the rule *as it was reviewed*. However, the constant churn within the overlapping 20-year windows allowed the gradual accretion of replacement material to reach 68% – objectively substantial loss – without ever tripping the rule's alarm.

  **The Remedy:** The appropriate remedy is a **cumulative cap on total loss of principal structural members since designation** (or a defined baseline). This directly addresses the flaw the rolling window exposed. Shorter windows would increase administrative burden without fundamentally solving the cumulative creep – replacements could still be staggered. Changing the object of assessment (e.g., focusing solely on design or foundation) risks abandoning the core concept of "fabric" and material authenticity.

  **The 2011 Joists:** The sistering/scarf-splicing of joists presents a genuine challenge. Our ledger must reflect the reality: **only the portion of the original member that remains intact contributes to the "retained historic fabric."** The new material added via sistering or splicing is replacement fabric. Therefore, for cumulative assessment:
      *   Identify the original joist member.
      *   Estimate the percentage of its original length/material that is intact, functional, and unaltered by the repair (excluding the spliced/scarfed/sistered section).
      *   Only this intact percentage counts towards the cumulative "original" fabric. The replaced/supplemented portion counts as new material.
  This approach acknowledges that repair preserves function and some original material, but accurately reflects the *extent* of material replacement. Our cumulative cap must account for these partial losses.

  **4. The Replica (Approx. 300 words)**

  The petitioner's strongest either/or argument is potent: If the Mill's *design and craft* are paramount, the replica satisfies this perfectly; if *original material* (fabric) is key, the Mill has lost too much. Ergo, protecting the Mill protects "nothing in particular."

  This argument fails because historic designation, especially under an ordinance centered on "retaining historic fabric," is not solely about design or craft in the abstract. **It is about the authentic embodiment of history through original material, continuity, and context.** The Calloway Mill possesses:

  1.  **Continuity:** It stands on its original foundation, at its original location, performing (or having performed) its original function for over 170 years. This uninterrupted physical and functional presence is irreplaceable.
  2.  **Authenticity of Evolution:** Its changes, even cumulative, occurred incrementally over decades, reflecting necessary maintenance and adaptation while largely preserving the original form and structure. This traces a genuine historical trajectory.
  3.  **Context:** It exists within its authentic historic landscape and creek bend, contributing to the district's tangible sense of place and time.

  The replica, however skilled, is a simulacrum. It lacks the authenticity conferred by age, original location (three blocks away), and the genuine patina of use and time. Its construction in 18 months creates a false, manufactured history, unlike the Mill's 40+ years of documented, commission-approved evolution. A rule focused on *retaining authentic historic fabric within its original context* – even diminished fabric – can logically protect the Calloway Mill while excluding the replica. The timeframe isn't the direct test; it's evidence of authentic evolution versus manufactured instantiation.

  **5. On Drawing a Line We Cannot Justify (Approx. 350 words)**

  It is true that setting a cumulative threshold (e.g., 50%) involves drawing a somewhat arbitrary bright line where a precise, philosophically perfect boundary doesn't exist. However, **this is not only legitimate but necessary for administrative governance.** Zoning setbacks, speed limits, and historic district boundaries themselves are all examples of necessary, justifiable lines drawn for clear administration, even if the exact point (e.g., 25 feet vs. 26 feet, 35 mph vs. 36 mph) is debatable.

  The legitimacy here hinges on two factors:
  1.  **Fairness and Reliance:** Applying a *new* cumulative threshold *retroactively* to void this designation based on past, approved work would be profoundly unfair. The owner relied on the Commission's approvals under the rules *as they existed and were interpreted at the time*, including the rolling window which deemed each step acceptable. Retroactively applying a new standard penalizes this reliance. Our past approvals created a legitimate expectation that compliant work preserved the designation.
  2.  **Prospective Application:** Drawing the line now, based on the lessons of *this* case, and applying it *only to future cumulative loss measured from a newly established baseline* is both legitimate and fair. It provides clarity moving forward without undermining past decisions or punishing the owner for our past lack of foresight. We are not declaring the building suddenly non-historic based on a new rule; we are establishing a rule to prevent *further* erosion from pushing it definitively beyond "substantial retention" in the future.

  Therefore, we can and must adopt a clear, administrable cumulative threshold. But justice demands it applies only prospectively from a defined point (e.g., the new baseline documentation), not to negate work already approved under our previous regime.

  **6. The Strongest Case Against My Recommendation (Approx. 250 words)**

  The Historic District Commission exists to protect genuinely historic structures. The ordinance requires a building to "substantially retain its historic fabric" for designation. The Calloway Mill no longer meets this standard. The Commission's own data shows 68% of its principal structural members have been replaced since 1979. This is not "substantial retention" by any reasonable definition; it is majority replacement. The gradual nature of the loss, approved step-by-step under a flawed rule, does not change the objective fact that most of the original, historic fabric is gone.

  Past approvals do not bind the Commission to perpetuate an error. Each review looks at the building's *current* state against the ordinance's requirements. Today, with only 32% of its core structure original and 41% of all fabric replaced, the Mill fails the test. Protecting it now elevates procedure and precedent over the ordinance's core mandate. It signals that any building, no matter how much original material is lost over time through approved work, can retain designation indefinitely. This renders the "substantial retention" requirement meaningless. Furthermore, it creates an illogical distinction where a skilled replica using authentic methods is excluded, while a building retaining less than half its core structure is protected. The Commission must acknowledge the reality of the Mill's current condition and declare the designation void.
