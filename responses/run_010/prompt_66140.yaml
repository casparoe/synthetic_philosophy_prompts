prompt: |-
  I'm prepping next week's seminar on Hacking's looping effects and one of my grad students has turned in a handout I want stress-tested before I either endorse it or tear it up in front of everyone. Her line isn't original to her, I should say — it's a move I hear constantly from labeling-theory-minded sociologists too — which is exactly why I want it audited properly.

  The move: looping effects are just Merton's self-fulfilling prophecy applied to psychiatric classification, nothing new under the sun, and this *dissolves* rather than deepens the worry about interactive kinds. Her reasoning runs like this. (1) A self-fulfilling prophecy starts from a belief that is false, the belief drives behaviour, and the behaviour makes the belief true. (2) So if classifying people is a self-fulfilling prophecy, there is always a determinate fact about what was true before the loop started. (3) So there was a fixed pre-classification truth about who was, say, a multiple personality or who was autistic, and the instability in our categories is just us describing that truth badly. (4) Hence the kind is as real and as stable as any other kind, only mis-labelled along the way. (5) And the fix is the standard one for a prophecy: publish the facts, break the belief, and the loop stops running. She closes by saying Hacking's talk of kinds as moving targets is really just a prophecy in flight.

  I want the audit, not a lecture. First give me the explicit correspondence — what plays the prophecy, the believers, the false belief, the bank and its depositors, the run itself, and the correction-by-disclosure — and say for each slot whether anything on the psychiatric side actually fills it. Then sort the disanalogies into the ones that genuinely bite against steps (2) through (5) and the ones that are noise, because I'd rather not spend seminar time on "Merton wrote about individuals and Hacking about whole populations over decades" if that turns out to be beside the point.

  Two spots where I suspect trouble and want you to check it rather than take my word: Merton's mechanism seems to need something like the old Thomas dictum, situations defined as real being real in their consequences, and I'm not convinced the classified person's own uptake is carrying the weight in her version — especially in cases where people fight the label, where the loop appears to run through clinics, courts, school accommodations and diagnostic criteria revisions rather than through anyone believing anything. And the multiple personality case, where the number of alters reported for a typical patient climbed steadily through the eighties, doesn't look to me like a belief that was false and then became true; it looks like the target relocating while we were aiming at it. Tell me if I'm wrong about that.

  Then: what does the prophecy frame quietly import that interactive kinds don't have? My hunch is an outside-the-loop vantage point, a single identifiable false belief with a discoverable owner, and a specifiable moment at which the loop could have been switched off. Say whether those are load-bearing for her conclusion or just decoration.

  Finally, does the deflation survive once the disanalogies are on the table? And if it doesn't, is there a better analogy to hand — she floats the map redrawing the territory, I keep gravitating toward something more like a language whose speakers can coin new words for their own states and thereby acquire states that had no name before — and be concrete about which piece of the argumentative work the replacement does that the prophecy frame can't. I don't want a bibliography or a list of who said what, I want the reasoning, and if a step of hers is salvageable on some restricted reading, tell me what the restriction costs her.
reasoning: |-
  Okay, let me tackle this professor's request systematically. They're clearly a philosophy/sociology scholar preparing a seminar on Hacking's looping effects, and they've given me a very specific task: audit a grad student's attempt to reduce looping effects to Merton's self-fulfilling prophecy. 

  First, I need to unpack the core of the student's argument. It claims that Hacking's interactive kinds are just a special case of self-fulfilling prophecies applied to psychiatric classification. The student outlines five steps: (1) SFP requires an initially false belief that becomes true through behavior; (2) thus there's a pre-classification truth; (3) category instability reflects bad descriptions of that truth; (4) the kind is real and stable; (5) the solution is factual disclosure to break the loop. 

  Hmm, the professor flags two key concerns: whether the Thomas theorem (situations defined as real become real) adequately handles cases where people resist labels, and whether the multiple personality disorder (MPD) trajectory fits the SFP model. I should pay special attention to these.

  Now for the audit structure the professor wants: first map Merton's SFP elements to psychiatry. The bank run analogy has: false belief (rumor), believers (depositors), institution (bank), behavior (withdrawals), outcome (bank collapse), solution (disclosure). Applying this to psychiatry: 

  - False belief = diagnostic criteria being inaccurate? But that's shaky because diagnostic criteria are often initially vague constructs rather than concrete false propositions.  
  - Believers = clinicians, institutions, maybe patients? But patients often don't "believe" the label initially.  
  - Institution = clinics/courts - this maps better.  
  - Behavior = diagnostic practices, accommodation systems - partially fits.  
  - Outcome = category inflation (like MPD alters) - but does this make the initial "belief" true? Unclear.  
  - Correction = publish facts - but in psychiatry, what counts as "facts" shifts as the kind evolves.  

  The mapping breaks down at almost every point. The professor's instinct about resistance cases is spot-on - when people fight labels, the loop runs through institutional machinery, not belief. And the MPD case shows targets moving, not false beliefs becoming true.

  Now disanalogies that actually break the student's argument:  
  - Step (2) requires a fixed pre-classification truth, but looping effects deny this by showing kinds co-evolve with classification.  
  - Step (3) mistakes instability for bad description when it's constitutive of interactive kinds.  
  - Step (5) assumes a stable "fact" to disclose, but in looping effects, disclosure itself becomes part of the interaction.  

  The professor's hunches about imported assumptions seem correct: an external vantage point, identifiable false belief, and off-switch moment are all load-bearing for the student's conclusion. Without them, the deflation fails.

  For better analogies: the student's map-territory suggestion is inadequate because maps don't change territories. The professor's language analogy is stronger - new words create new states (like "gaslighting" naming a pre-existing dynamic while also reshaping it). This captures the feedback loop better. 

  The key salvageable point? Only that classifications can trigger reactions - but without the SFP baggage of fixed truths and corrections. That costs the student's entire deflationary move though. 

  Final verdict: the deflation doesn't survive. Hacking's framework reveals something fundamentally different about how human kinds become moving targets. The seminar should demolish this handout - constructively, of course.
answer: |-
  Here's the audit, structured for seminar-ready demolition with surgical precision. The student's reduction fails on multiple load-bearing points, and I'll show exactly where the analogy collapses under the weight of Hacking's actual framework.

  ### 1. Explicit Correspondence to Merton's SFP & Psychiatric Fit  
  *(Merton's Bank Run → Psychiatric Classification)*  

  | **SFP Element**       | **Psychiatric Claim**          | **Does It Hold?** | **Why It Fails** |
  |------------------------|--------------------------------|-------------------|------------------|
  | **False Belief**       | Initial diagnostic criteria are inaccurate (e.g., "Autism is rare and always profound") | ❌ Partial | No *determinate* false belief. Criteria are often vague constructs (e.g., "impaired social interaction"), not testable propositions. |
  | **Believers**          | Clinicians, institutions, patients, society | ❌ No | Patients may *resist* the label (e.g., autism self-advocates). Institutions act on operationalized criteria, not "belief." |
  | **Institution (Bank)** | Clinics, courts, diagnostic manuals (DSM/ICD) | ✅ Yes | Systems enforce labels, but they *adapt* (e.g., DSM revisions), unlike a static bank. |
  | **Behavior (Run)**     | Diagnosis → treatment/accommodation → behavioral changes | ❌ Partial | Not driven by belief in criteria's *truth*. Runs through institutional feedback (e.g., school IEPs, disability benefits). |
  | **Outcome (Collapse)** | Category becomes "true" (e.g., rise in autism diagnoses) | ❌ No | No "truth" is made; the *phenomenon itself mutates* (e.g., autism's broadening criteria alter expression). |
  | **Correction (Disclosure)** | Publishing "facts" to stop looping (e.g., "autism isn't caused by vaccines") | ❌ No | "Facts" are contested mid-loop (e.g., neurodiversity movement rejects pathology framing). Disclosure *fuels* new loops. |

  **Verdict**: Only the "institution" slot holds. The core SFP mechanics (false belief → belief-driven behavior → truth-making) **do not map** onto psychiatric looping.

  ---

  ### 2. Disanalogies That Bite vs. Noise  
  **Noise** ("Distraction, ignore in seminar"):  
  - Individuals vs. populations: Both frameworks handle groups (Merton discusses racial stereotypes).  
  - Timescale: SFP can unfold slowly (e.g., racist housing policies).  

  **Load-Bearing Disanalogies** ("Destroy steps 2-5"):  
  - **Against (2) Pre-classification "truth"**:  
    SFP requires a knowable initial state (bank is solvent). **Looping denies this**. Autism wasn't a "stable kind mislabeled" but a *mutable construct*: Kanner's 1943 criteria (e.g., "no social interest") ≠ today's spectrum. *No fact of the matter* about "true autistics" pre-DSM-III.  
  - **Against (3) Instability = bad description**:  
    SFP assumes the underlying reality is fixed (bank's solvency). **Looping changes the reality**: Multiple Personality Disorder (MPD) didn't have "hidden alters" pre-classification; therapists *elicited* alters via leading questions, and patients learned to perform "multiplicity" from media. The *kind itself evolved* (e.g., alter counts inflated with diagnostic popularity).  
  - **Against (4) Kinds are stable**:  
    SFP stabilizes after correction (bank reopens). **Looping is open-ended**: Autism's diagnostic expansion (Asperger's → spectrum) created new social identities, therapies, and brain plasticity effects → no "stable kind" emerges.  
  - **Against (5) Fix by disclosure**:  
    SFP ends when truth is revealed (audit proves solvency). **Looping accelerates with disclosure**: Publishing autism prevalence data increased diagnoses, funding, and parental advocacy → *reinforcing* the category.  

  **Your Suspicions Confirmed**:  
  - **Thomas Theorem isn't enough**: When patients *resist* labels (e.g., anti-psychiatry movements), loops run through **institutional inertia** (e.g., courts mandating treatment, schools requiring DSM codes for accommodations). No "belief" required.  
  - **MPD case**: Not "false belief → true belief" but **ontological drift**. Alters multiplied *because* diagnostic criteria rewarded complexity → a **moving target**, not prophecy fulfilled.  

  ---

  ### 3. What the Prophecy Frame Illicitly Imports  
  Your hunches are correct. The SFP model smuggles in:  
  - **An outside-the-loop vantage**: Assumes we can observe the "pre-loop truth." **Load-bearing** for step (2).  
  - **A single false belief with an owner**: Requires identifiable believers (depositors) and a clear fallacy. **Load-bearing** for steps (1) and (5).  
  - **A specifiable off-switch**: Disclosure halts the loop. **Load-bearing** for step (5).  

  **Why these are fatal**: Interactive kinds operate in **hermeneutic feedback**—no "outside" perspective exists, beliefs are diffuse and institutional, and "correction" is just another loop input (e.g., debunking "refrigerator mothers" shifted blame to genetics).  

  ---

  ### 4. Does the Deflation Survive?  
  **No.** The disanalogies dismantle every step. SFP is a **special case** of looping (e.g., a *single* loop with fixed ontology), not the general model. Salvaging step (1) ("classifications trigger reactions") is trivial—even Hacking agrees—but it **costs the entire argument**: without SFP's truth-to-truth structure, the "dissolution" of worry about interactive kinds vanishes.  

  ### 5. Better Analogy & Why It Works  
  **Your language analogy is superior**:  
  > *"Classifying interactive kinds is like coining a new word (e.g., 'gaslighting') for a previously nebulous experience. The word doesn't describe a fixed reality; it **creates a new lens** through which people reinterpret past events, articulate grievances, and legitimize responses—thereby **proliferating the very phenomenon** it names."*  

  **Why this beats SFP**:  
  - Captures **semantic innovation** (new labels create new realities).  
  - Explains **resistance** (e.g., rejecting "gaslighting" as psychobabble).  
  - Accommodates **institutional mediation** (courts adopt the term, shaping legal outcomes).  
  - Shows **stabilization is temporary** (e.g., "gaslighting" may dilute or fragment with overuse).  

  **Replacement's argumentative work**:  
  - **Refutes pre-loop truth**: Like unnamed experiences, pre-classification states are indeterminate.  
  - **Explains moving targets**: Linguistic drift alters the phenomenon (e.g., "trauma" from shell shock → PTSD → CPTSD).  
  - **Blocks the "off-switch"**: Words can't be "disproven"; they evolve or fall from use via social negotiation.  

  **Final Verdict**: Tear up the handout. The prophecy frame is a Procrustean bed—amputating looping's core insights. The language analogy delivers the lethal blow: interactive kinds aren't *prophecies*, but **living concepts** that reshape the terrain they map.
