answer: |-
  Here's your numbered menu of Descartes' possible theses behind "animals are mere machines," with verdicts on each. I've kept it plain, dinner-table ready, and grounded in the texts you mentioned:

  1.  **Metaphysical Claim: Animals are *only* physical substance. No soul, no immaterial mind.**
      *   **Verdict: Yes, this is core.** Descartes is a substance dualist: mind (thinking thing) vs. body (extended thing). Animals lack the *res cogitans* (thinking substance). They are complex automata made of matter. **Demanding & Defensible?** Yes, within his system. It's foundational to his physics and metaphysics.

  2.  **Explanatory Claim: *Every* animal behavior can be fully explained by mechanical laws (anatomy, hydraulics, 'animal spirits').**
      *   **Verdict: Mostly Yes, but with a *crucial hedge*.** In principle, he aimed for this. His physiology tried mechanical explanations for digestion, circulation, reflexes, even some learning/memory (as bodily traces in the brain - see Newcastle letters). **Demanding & Defensible?** Ambitious and substantive, even if his specific mechanisms were wrong. He genuinely believed this *could* explain all animal behavior. **Hedge:** He admits humans have *some* non-mechanical behaviors (voluntary acts guided by reason).

  3.  **Phenomenological Claim: Animals have *no felt experiences whatsoever*. No pain, no pleasure, no fear, no joy, no sensory *qualia*.**
      *   **Verdict: No, not really. This is the biggest overreach.** This is where your friend is likely wrong, and where More, Newcastle, and the *Passions* matter. Descartes consistently distinguishes *thought-dependent sensation* (conscious awareness, judgment) from *body-dependent sensation* (mechanical response). He *denies* animals the first kind (true consciousness). **But he explicitly *grants* them the second kind.**
      *   **Evidence:** To More: He grants animals "sensation" insofar as it's a bodily reaction (e.g., eye damaged -> animal flinches), but *not* as a thought ("I am hurt"). To Newcastle: He grants animals *display* fear, hope, joy – bodily states caused mechanically by objects. In the *Passions of the Soul*, he describes passions (emotions) as inherently bodily states, which animals *do* have.
      *   **Demanding & Defensible?** His position is *substantive* (denying conscious thought/feeling) but *not* the extreme "no feeling at all" your friend claims. Animals *react* like they feel; they just lack inner awareness *of* feeling. **Verdict:** He *did not* assert "no felt experience whatsoever." He asserted "no *conscious thought* about experience."

  4.  **Cognitive Claim: Animals have *no thought, reason, language, belief, judgment, or genuine understanding*.**
      *   **Verdict: Yes, absolutely core.** This is Descartes' main punchline. Thought (*cogitatio*) requires an immaterial soul. Animals lack it. They don't have beliefs ("I believe that bone is tasty"), make judgments ("this situation is dangerous"), reason, or possess language expressing *thoughts about things* (not just conditioned sounds). **Demanding & Defensible?** Highly demanding and the central, substantive claim he vigorously defended.

  5.  **The Language/Adaptability Claim: The *key evidence* for lacking thought is the absence of *linguistic flexibility* and *adaptability to genuinely novel situations*.**
      *   **Verdict: Yes, this is his *argument*, not just a claim.** This is crucial for your second point. Descartes' famous tests in the *Discourse* (Part V) are **behavioral**: (1) Can the being use language/signs *flexibly* to express thoughts about *anything*, not just fixed responses? (2) Can it act intelligently in *completely novel and unpredictable* situations? He argues only humans pass these tests. Animals fail: their "speech" is reflex, their "intelligence" is limited repertoire and conditioning. **Demanding & Defensible?** It's his core *evidence-based argument* for Claim 4. It's substantive and relies entirely on interpreting behavioral data.

  6.  **Moral Standing Claim: Therefore, animals have no moral significance, feel no real pain we need to worry about, and we can use them as we wish.**
      *   **Verdict: Likely Implied, but he rarely dwells on it.** While he sometimes remarks we needn't fear causing them "true pain" (since they lack conscious suffering), his focus is metaphysical and scientific, not primarily ethical. The moral conclusion is a common inference *drawn* from his position (especially Claims 1, 3, & 4), but it's not his central thesis. **Demanding & Defensible?** A consequence others emphasized, based on his other claims.

  **Consistency Check:** Descartes is remarkably consistent *within his framework*. Claim 1 (Substance Dualism) forces Claim 4 (No Thought). Claim 5 (Language/Adaptability Test) is his behavioral *proof* for Claim 4. Claim 2 (Mechanical Explanation) is his scientific program *supporting* Claims 1 & 4. The seeming tension is with Claim 3 (Phenomenology). **The Newcastle letters and More correspondence show his hedge:** Animals *have* bodily passions and sensations *as mechanical states*, which *look like* fear/joy/pain to us, but *lack* the conscious awareness (thought) that would make it *felt suffering* in the human sense. The "machine shaped like a monkey" passage reinforces that *behaviorally*, animals *are* indistinguishable from complex machines – except that humans *are* distinguishable *by their behavior* (Claim 5 tests). **The slogan hides the nuance in Claim 3, but doesn't break the core system.**

  **Turning the Screws on the Second Move:** Your friend says accepting "beast-machine" means behavioral evidence is irrelevant. **This is directly refuted by Descartes himself.**

  *   Descartes' **entire argument against animal thought (Claim 4) rests on behavioral evidence (Claim 5)**. He looks at what animals *do* (or rather, what they *fail* to do: use language flexibly, solve novel problems) and infers they lack minds. **Behavioral evidence is precisely the "right kind of evidence" for Descartes, just pointing to a negative conclusion.**
  *   **No reading of the slogan licenses dismissing behavioral evidence.** Claim 5 *is* about interpreting behavior. Claim 3 (properly understood) grants animals have complex reactive behaviors *to be explained*. Claim 2 is *about* explaining behavior mechanically.
  *   **The only way behavioral evidence "drops out" is if your friend conflates "evidence of mind" with "evidence of consciousness/suffering" AND insists Descartes denied *any* sensation (Claim 3 in its extreme form). But as shown, Descartes *didn't* deny sensation in that extreme way, and he *used* behavior to argue against thought.**
  *   **Verdict:** Your friend's second move is **flatly wrong** based on Descartes' own method. Behavioral evidence is central to his distinction. He thinks it points *against* animal thought, not that it's irrelevant.

  **The "Beast-Machine" Phrase:**
  *   **Verdict:** It's almost certainly **not Descartes' own phrase.** He used phrases like "automata" or "machines." The specific term "bête-machine" (beast-machine) was popularized by his critics (like Antoine Arnauld) and later historians to summarize (and often attack) his position.
  *   **Does it matter?** Mostly no. The *doctrine* is his, regardless of the catchy label. However, the label itself, being coined by critics, often carries the baggage of the most extreme interpretations (like the absolute denial of *any* sensation/phenomenology - Claim 3 in its strongest form). Knowing it's not his term helps remind us to look at *his actual texts* for nuance, not let the slogan do all the work.

  **In short, over dinner:** "Look, Descartes definitely thought animals were complex biological machines without immortal souls or human-like reasoning (Claims 1 & 4). He thought all their *behavior* could be explained by physics and wiring (Claim 2), and that this included reacting to damage or showing what looks like fear (Claim 3 - the bodily kind). **But he didn't say they were unfeeling blocks of wood with no reactions at all.** Crucially, his *reason* for denying them true thoughts and feelings was based *on their behavior* – specifically, that they can't talk about ideas or handle truly new problems (Claim 5). So, your 'behavior doesn't count' point misses his whole argument. The 'beast-machine' tag is catchy, but it's a later label that sometimes makes him sound more extreme than he was, especially on the feeling question."
