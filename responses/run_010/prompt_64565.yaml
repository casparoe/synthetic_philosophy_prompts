answer: |-
  Here's a decision tree designed to sort students into theoretical positions on societal collapse, structured around 7 branch nodes (yes/no or three-way questions). The tree isolates key conceptual divides before applying them to specific cases, as requested. Each leaf includes a named position (or "unnamed" with attribution) and its most awkward commitment.

  ### **Decision Tree: What is "Collapse"?**

  1. **Does "collapse" primarily describe the failure of a *specific elite institution* (e.g., palace, priesthood, royal dynasty)?**  
     - *Yes* → Go to Q2  
     - *No* → Go to Q3  

  2. **Is this institutional failure necessarily *negative* for the broader population?**  
     - *Yes* → **Political Collapse View** (e.g., Bronze Age Mycenae). *Awkward commitment:* Must explain why the population couldn't thrive without elite institutions they previously resented.  
     - *No* → **Elite Replacement View** (unnamed; e.g., some Maya collapse theories). *Awkward commitment:* Must argue that the dissolution of palaces/temples didn't degrade commoners' welfare.  

  3. **Does "collapse" require a *significant decline in population size/density*?**  
     - *Yes* → **Demographic Collapse View** (e.g., Rapa Nui). *Awkward commitment:* Must prove population drop was abrupt and irreversible, not gradual migration.  
     - *No* → Go to Q4  

  4. **Does "collapse" imply a *loss of sociopolitical complexity* (e.g., states → chiefdoms, cities → villages)?**  
     - *Yes* → Go to Q5  
     - *No* → Go to Q6  

  5. **Is this complexity loss driven by *diminishing returns on investment* in problem-solving institutions?**  
     - *Yes* → **Tainter-Style Collapse** (complexity economics). *Awkward commitment:* Must show that societies kept investing in complexity *after* it became maladaptive.  
     - *No* → **Unnamed Complexity Drop** (e.g., Middleton, but without Tainter's economics). *Awkward commitment:* Must explain why complexity fell without systemic feedback loops.  

  6. **Is "collapse" inseparable from *ecological self-destruction* by the society?**  
     - *Yes* → **Diamond-Style Ecocide**. *Awkward commitment:* Must prove the society foresaw environmental harm but failed to act.  
     - *No* → Go to Q7  

  7. **Can the change be reversed within *200 years* without external intervention?**  
     - *Yes* → **Resilience/Reorganization View** (e.g., Holling, Redman). *Awkward commitment:* Must frame "collapse" as a neutral or beneficial adaptation.  
     - *No* → **Systemic Collapse** (unnamed; e.g., some climate-human interaction models). *Awkward commitment:* Must show that the society lost *all* capacity for endogenous recovery.  

  ---

  ### **Unoccupied Combinations & Why**  
  - **"Yes to Q1 + No to Q2"** (elite institution fails, but not negative for commoners) → **Occupied** (Elite Replacement View).  
  - **"No to Q1 + Yes to Q3"** (population decline is essential) → **Occupied** (Demographic Collapse).  
  - **"No to Q1 + No to Q3 + No to Q4"** (no institution, population, *or* complexity loss) → **Unexplored/Incoherent**. If nothing tangible collapses, the term becomes meaningless without redefining it as purely cultural (Q6/Q7).  
  - **"No to Q1 + No to Q3 + Yes to Q4 + Yes to Q5"** (complexity loss + diminishing returns) → **Occupied** (Tainter).  
  - **"No to Q1 + No to Q3 + Yes to Q4 + No to Q5"** (complexity loss without diminishing returns) → **Occupied** (Unnamed Complexity Drop).  
  - **"No to Q1 + No to Q3 + No to Q4 + Yes to Q6"** (ecocide without complexity loss) → **Occupied** (Diamond).  
  - **"No to Q1 + No to Q3 + No to Q4 + No to Q6 + Yes to Q7"** (reversible non-ecological change) → **Occupied** (Resilience).  
  - **"No to Q1 + No to Q3 + No to Q4 + No to Q6 + No to Q7"** (irreversible non-ecological/non-complexity change) → **Occupied** (Systemic Collapse).  

  **No unoccupied combinations** — all paths lead to a named/unnamed position. However:  
  - The tree cannot resolve cases where multiple factors (e.g., ecocide + complexity loss) are codependent (e.g., Classic Maya). These require hybrid explanations.  
  - **Deflationist View** (e.g., McAnany, Yoffee) is intentionally omitted from the tree, as it rejects "collapse" as a valid category. Students who answer "no" to all Q1–Q7 might land here, but it's not a leaf.  

  ---

  ### **Indistinguishable Leaves**  
  - **Resilience vs. Elite Replacement** if institutional change is rapid but reversible.  
    - *Separating case:* Rapa Nui (irreversible for Resilience) vs. Post-Classic Maya (reversible elite circulation).  
  - **Tainter vs. Unnamed Complexity Drop** in systems with incomplete archaeological data.  
    - *Separating case:* Bronze Age collapse (diminishing returns arguable) vs. Chaco Canyon (complexity loss without clear economic drivers).  

  ---

  ### **Confidence Assessment**  
  - **Exhaustiveness:** 85% confident. Covers core academic positions, but hybrid views (e.g., complexity + ecocide) require case-specific blending.  
  - **Mutual Independence:** 80% confident. Q1–Q7 isolate conceptual axes, but real cases often blur boundaries (e.g., elite institution failure *triggers* complexity loss).  
  - **Least Confident Leaf:** **Elite Replacement View** (Q2 → "No"). Many scholars assume elite collapse harms commoners, making "neutral/positive" a rare position.
