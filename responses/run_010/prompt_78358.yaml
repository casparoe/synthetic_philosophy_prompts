  ### Decision Tree for Classifying Social Regularities  
  Based on observable behavior and self-reports (no philosophy required). Start with: **"Here is a pattern of behavior almost everyone in some group follows."**  

  ```mermaid
  flowchart TD
      A["Node 1: Is the pattern enforced by explicit rules or authorities? (e.g., laws, institutions, official sanctions)"] 
      A -- Yes --> B["Leaf 1: **Formal Convention**\nCommitted to: Codified rules override alternatives; authority sustains it."]
      A -- No --> C["Node 2: Are there alternatives? (Could the group switch to another pattern just as easily?)"]
      C -- No --> D["Node 3: Would you still do this alone? (Unobserved, no coordination)"]
      D -- Yes --> E["Node 4: Could it be learned by trial and error? (Without representing alternatives)"]
      E -- Yes --> F["Leaf 2: **Deep Habit**\nCommitted to: Internalized via reinforcement; no alternatives needed."]
      E -- No --> G["Leaf 3: **Sacred Rule**\nCommitted to: Non-arbitrary personal duty; alternatives inconceivable."]
      D -- No --> H["Node 5: Do third parties punish violators?"]
      H -- Yes --> I["Node 6: Is punishment driven by *anger*? (Moral outrage)"]
      I -- Yes --> J["Leaf 4: **Moral Taboo**\nCommitted to: Universal wrongness; anger even without alternatives."]
      I -- No --> K["Leaf 5: **Conformity Pressure**\nCommitted to: Punishment for deviance, but arbitrary."]
      H -- No --> L["Leaf 6: **Empty Cell: Unstable Tradition**\nDiagnosis: Unstable—no enforcement or intrinsic motivation."]
      C -- Yes --> M["Node 7: Would you still do this alone? (Unobserved, no coordination)"]
      M -- Yes --> N["Node 8: Could it be learned by trial and error? (Without representing alternatives)"]
      N -- Yes --> O["Leaf 7: **Reinforced Habit**\nCommitted to: Persists via individual rewards; alternatives exist."]
      N -- No --> P["Leaf 8: **Personal Ritual**\nCommitted to: Deliberate adherence; alternatives represented."]
      M -- No --> Q["Node 9: Do third parties punish violators?"]
      Q -- Yes --> R["Node 10: Is punishment driven by *anger*? (Moral outrage)"]
      R -- Yes --> S["Leaf 9: **Moral Norm**\nCommitted to: Enforced as inherently right/wrong."]
      R -- No --> T["Leaf 10: **Signaling Convention**\nCommitted to: Punished for miscoordination, not morality."]
      Q -- No --> U["Leaf 11: **Lewis Convention**\nCommitted to: Sustained by mutual expectations; arbitrariness accepted."]
  ```  

  ---

  ### **Key Features**  
  1. **Nodes**:  
     - Answer via observation or asking: "What would you do if...?"  
     - Order matters: Checks enforcement → alternatives → social context → punishment.  
     - "Not sure" allowed: Proceed to both branches if ambiguous.  

  2. **Leaves** (11 total; 8+ covered):  
     | Leaf | Name | Committed to | Example Cases |  
     |---|---|---|---|  
     | 1 | **Formal Convention** | Authority codifies it; alternatives exist but are suppressed. | Driving on the right, White moves first in chess |  
     | 2 | **Deep Habit** | Internalized via reinforcement; alternatives irrelevant. | US customary units, Plural "you" (y'all/youse/you guys) |  
     | 3 | **Sacred Rule** | Personal duty; alternatives inconceivable. | *No clear case in list* |  
     | 4 | **Moral Taboo** | Universally wrong; third-party anger without alternatives. | *No clear case in list* |  
     | 5 | **Conformity Pressure** | Arbitrary but punished to enforce group identity. | *No clear case in list* |  
     | 6 | **Empty Cell: Unstable Tradition** | No alternatives, no solo practice, no punishment. **Diagnosis**: Unstable—dies without enforcement. | *None* |  
     | 7 | **Reinforced Habit** | Persists via individual rewards; alternatives exist. | QWERTY keyboard |  
     | 8 | **Personal Ritual** | Deliberate personal rule; alternatives represented. | *No clear case in list* |  
     | 9 | **Moral Norm** | Enforced as inherently right/wrong; anger-driven punishment. | Outrage at line-jumpers (even distant bystanders) |  
     | 10 | **Signaling Convention** | Punished for miscoordination; mild inconvenience, not anger. | *No clear case in list* |  
     | 11 | **Lewis Convention** | Sustained by mutual expectations; arbitrary and stable. | Coat on chair (seat-holding), Greeting gestures, "Bless you" |  

  ---

  ### **Case Assignments**  
  | Case | Leaf | Notes |  
  |---|---|---|  
  | Driving on the right | **1. Formal Convention** | Enforced by law; alternatives exist. |  
  | QWERTY layout | **7. Reinforced Habit** | Learned via reinforcement; alternatives exist but unused. |  
  | US customary units | **2. Deep Habit** | Internalized; alternatives exist but irrelevant in practice. |  
  | "Bless you" after sneeze | **11. Lewis Convention** | Arbitrary; no enforcement, no solo practice. |  
  | Outrage at line-jumpers | **9. Moral Norm** | Third-party anger without personal stake. |  
  | White moves first in chess | **1. Formal Convention** | Codified rule; alternatives exist. |  
  | Coat on chair (seat-holding) | **11. Lewis Convention** | Arbitrary signal; no punishment if respected. |  
  | Plural "you" forms | **2. Deep Habit** | Internalized linguistic habit; alternatives exist. |  
  | Greeting gestures | **11. Lewis Convention** | Coordination-dependent; mixing causes confusion. |  

  ---

  ### **Diagnostics**  
  1. **Empty Cell (Leaf 6: Unstable Tradition)**:  
     - **Why empty?** Unstable—requires no alternatives + no solo practice + no enforcement. Collapses without intrinsic motivation or punishment.  

  2. **Indistinguishable Pairs**:  
     - **Reinforced Habit (7) vs. Lewis Convention (11)** if trial-and-error learning occurs without representing alternatives.  
       - *Example*: A convention learned implicitly (e.g., children mimicking greetings) vs. one sustained by common knowledge.  
       - **Solution**: Tree cannot resolve this. Flag ambiguity at **Node 8** with a note: "If 'not sure,' consider both Leaves 7 and 11."  
     - **Reinforced Habit (7) vs. Deep Habit (2)** if alternatives exist but are ignored.  
       - *Example*: QWERTY vs. US customary units—both habits, but US units lack salient alternatives.  
       - **Resolution**: Node 2 (alternatives) separates them.  

  3. **Order Sensitivity**:  
     - Formal enforcement (Node 1) must come first (e.g., driving is not a habit if law overrides it).  
     - Alternatives (Node 2) before solo practice (Nodes 3/7) to isolate arbitrariness.  

  --- 

  ### **Workshop Notes**  
  - **Test Cases**: Validate leaves with provided examples (e.g., "bless you" = Lewis; line-jumpers = Moral Norm).  
  - **Ambiguity**: Acknowledge that habits/conventions blur if learning is implicit (no representation of alternatives).  
  - **Extensions**: Add nodes for "Is the pattern functional?" or "Do people cite rules?" if time permits.
