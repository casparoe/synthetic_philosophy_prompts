prompt: |-
  I'm partway through a popular book about how scientific theories get confirmed — a library copy, and I'd rather not name the author, since I want your judgment of the passage rather than of the reputation. Chapter four contains an argument I can't properly evaluate. I took one statistics course in which we fitted models to data that had been sitting in a disease registry for a decade before the model was written down, and nobody suggested we were doing anything confused, so something in this passage seems to conflict with what I was taught. But I can't tell whether the conflict is substantive or just a difference in how "evidence" and "new" are being used. Transcribed below, with sentence numbers for your convenience, the passage runs:

  (1) "Bayesianism holds that you revise your confidence in a hypothesis by conditionalizing on the evidence, which means a theory can be confirmed only by evidence it predicted before that evidence was observed." (2) "The problem of old evidence is that general relativity's celebrated success with the leftover precession of Mercury's perihelion — an anomaly on the books ever since Le Verrier flagged it in 1859 — cannot count as confirmation at all, because Einstein already knew the figure, and Bayes' theorem then assigns the evidence probability one, so the boost it can confer is exactly zero." (3) "The general lesson is severe: on a strict Bayesian account, nothing you already believe can raise the probability of anything else, which leaves the whole of scientific practice — where theories are routinely adjusted to data that were already on the table — unintelligible." (4) "The only way out is to restrict confirmation to genuinely novel predictions that later come true, such as the bending of starlight recorded during the 1919 eclipse." (5) "So Bayesianism turns out to be an elaborate restatement of the intuition that only risky predictions count, and Einstein's real achievement was to have a theory that happened to produce one."

  Could you audit this the way a philosopher who works on Bayesian confirmation theory would? For each sentence I want to know what such a person would accept without complaint, what they would file as a tolerable simplification, and what is actually wrong. I'd especially like you to keep an eye on whether the passage is sliding between two different senses of "old" — old for this particular agent, versus old in the history of the discipline — on whether it is right that evidence held with probability one confers no confirmation, and on whether sentences (3), (4) and (5) really follow from whatever is true in (1) and (2). Where the passage quietly assumes that no Bayesian reply is available, say which replies exist and why they matter.

  Please give me your answer as exactly five numbered items, one per sentence in the order given, with no introduction and no conclusion. Each item should open with a short verdict tag — Accurate, Simplification, or Wrong — and then run to at most three sentences covering what holds up, what does not, and what a corrected version of that sentence would say. If two of my sentences turn on a single underlying error, flag it once and cross-reference it rather than repeating yourself.
reasoning: |-
  Okay, let me tackle this query systematically. The user presents a passage criticizing Bayesian confirmation theory and wants a philosophical audit sentence by sentence. They're particularly concerned about potential conflations between "old evidence" meanings and whether the conclusions follow logically.

  First, I need to unpack the core philosophical issues here. The passage seems to be attacking Bayesianism using the problem of old evidence, but I notice it's making several conflations. For sentence 1, the key is recognizing that Bayesian updating applies to evidence new to the agent, not necessarily historically new discoveries. This distinction is crucial because the Mercury example fails if Einstein already knew the data.

  When examining sentence 2, the probability=1 issue is technically correct but practically irrelevant - Bayesians have solutions like counterfactual credence. This leads to sentence 3's overreach; scientific practice absolutely uses existing data for confirmation through model adjustment. The passage wrongly equates "already believed" with logical certainty.

  For sentence 4, the novel prediction requirement is too strict - Bayesians accept explanatory power for existing data as confirmation. Finally, sentence 5's claim about Bayesianism reducing to predictionism ignores its broader probabilistic framework. Throughout, I'll flag how the text conflates historical novelty with epistemic novelty for the agent.

  The user's epidemiology background makes them sensitive to real-world data practices, so I'll emphasize how Bayesian methods actually handle registry data. They'll appreciate seeing exactly where the passage overgeneralizes from technical points to sweeping claims about scientific practice.
answer: |-
  Here is the audit per your specifications:

  1.  **Simplification.** The core idea that Bayesian updating uses conditionalization is accurate. However, "evidence it predicted before that evidence was observed" is a simplification. Bayesianism requires that the evidence be *new to the agent* (so its probability wasn't already 1), and the hypothesis should assign it a *higher likelihood* than the alternatives. It doesn't strictly require the hypothesis to temporally *precede* the evidence's discovery or to have explicitly "predicted" it in a narrative sense. A corrected version might say: "...revise your confidence... by conditionalizing on evidence *new to you*, which typically means a theory is confirmed when it assigned a *higher probability to that evidence occurring* than your prior expectations did, before you learned it."

  2.  **Simplification (with core error).** The *description* of the problem of old evidence (the logical consequence that if P(e)=1, then P(e|h)=1, so no confirmation) is technically accurate *given that the agent is certain of e*. The historical example (Mercury, Einstein knowing it) is standard. However, this presents the problem naively as unsolvable within Bayesianism, ignoring sophisticated responses. The core error (see sentence 3) is assuming P(e)=1 *must* hold for known evidence. A corrected version would note: "This *appears* problematic because if an agent is *certain* of evidence e (P(e)=1), conditionalizing on e cannot change any probability. But Bayesians argue agents shouldn't assign probability 1 to contingent evidence or can model confirmation counterfactually."

  3.  **Wrong.** This massively overgeneralizes from the specific technical point in (2). Firstly, the "problem of old evidence" specifically concerns evidence the agent is *currently certain of* (P(e)=1). Most "data already on the table" that scientists use for model adjustment *are not* held with probability 1; the scientist may be highly confident, but rarely logically certain. Bayesianism handles adjusting confidence in hypotheses based on such evidence perfectly well via standard conditionalization if P(e) < 1. Secondly, even for evidence held with P(e)=1, Bayesian solutions exist (e.g., counterfactual credence: "What *would* my degree of belief in GR be *if* I hadn't known about Mercury?"). The claim that Bayesianism renders standard scientific practice "unintelligible" is flatly incorrect.

  4.  **Wrong.** This does not follow from the (flawed) premises in (1)-(3). It presents novel prediction as the "only way out," which is false. Bayesianism readily allows confirmation via *accommodation* – explaining existing evidence better than rivals, *if* that evidence wasn't already held with certainty (P(e) < 1). The bending of starlight was a dramatic *novel prediction*, but GR's ability to *retrodict* Mercury's orbit *better than Newtonian mechanics* (even if Einstein knew the data) *also* provides Bayesian confirmation relative to the alternatives, as long as GR assigned a higher *likelihood* (P(e|GR)) to the precise data than the prior probability of the data (P(e)) or the likelihood assigned by rivals. Novelty isn't logically required.

  5.  **Simplification (and Wrong implication).** Calling Bayesianism "an elaborate restatement" of the novelty intuition is a significant simplification; Bayesianism is a broad framework for rational belief updating encompassing novelty, accommodation, and other aspects. While Bayes factors *can* show why novel predictions are strong evidence (if P(e) was low), the implication that only risky novel predictions count *and* that accommodation (like Mercury) doesn't provide confirmation (the core error from 2 & 3) is wrong within a sophisticated Bayesian view. Einstein's "real achievement" included *both* novel predictions *and* providing a superior explanation for known anomalies like Mercury's orbit, and Bayesianism can model the confirmatory value of both types of evidence (subject to the P(e) issue).
