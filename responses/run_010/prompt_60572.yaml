prompt: |-
  You are a philosopher working at the intersection of normative ethics, social ontology, and the formal study of social conventions. I am drafting the conceptual groundwork for a book chapter that will argue that some everyday conventions generate genuine obligations while others generate only etiquette, and I want the specification fixed before I engage any candidate theory. I have found that most treatments of this material argue for or against a theory by pointing at a single case, so I would like the full list of requirements first. Please think carefully, and proceed in the order below.

  **Step 1 — Brainstorm (unpolished is fine).** Before writing anything you intend to stand behind, list every candidate requirement you can think of that a theory in this area might plausibly be asked to meet. Do not yet judge which are legitimate. Then prune, merge, and rank, and say in a sentence or two what you discarded and why.

  **Step 2 — The desiderata.** This is the main deliverable: a numbered list of requirements on an adequate theory of the normativity of everyday social conventions. For each requirement, give:

  1. a one-sentence statement, precise enough that a theory could be shown to satisfy or fail it;
  2. the case or consideration that motivates it, described in ordinary language;
  3. why it is a requirement rather than a preference;
  4. a classification — non-negotiable for any theory in this area, or demanded only by a particular camp (name the camp, and say whether you think the demand is question-begging);
  5. what failure looks like: the thing a theory missing this requirement would be committed to saying that is clearly false.

  Your list must actually resolve the following cases, which I have collected and which I do not think the standard treatments handle well:

  - **The dead rule.** In my building everyone writes their name on a clipboard by the door when they take the shared conference-room key. The locks were replaced two years ago, the key opens nothing, and the room is on camera. The rule survives intact. Is complying with it still an obligation, a courtesy, or nothing at all — and what, if anything, distinguishes it from waiting your turn in a queue?
  - **The announced opt-out.** A colleague emails the floor saying that he will no longer sign the clipboard, and explaining that the rule serves no purpose. The email itself feels like a violation. Can a convention-generated obligation be dissolved unilaterally by announcement? If so, why doesn't the same hold for the person at the front of a queue who announces she isn't waiting? If not, what is the difference?
  - **The long-stay guest.** A researcher spends three months with a household that expects every guest to accept a second helping of meat at each meal, and where refusal is read as an insult. She is a vegetarian, and she has been eating their food and using their generator the whole time. Which community's conventions bind her? Does three months of participation change the answer relative to a three-day visit, and if so, at what point and why?
  - **The convention worth breaking.** At a firm it is enforced by quiet ridicule that women dress more formally than men for the same client meetings. Compliance is cheap, refusal is costly and self-indulgent, and the norm is unjust. Is there an obligation to comply, to resist, both, or neither? Does your account have to converge with the ordinary moral assessment of the norm's content, or can a convention generate a real reason to do what is, all things considered, wrong?
  - **The empty street.** Jaywalking at three in the morning on a wide, deserted avenue, in a city where the norm is otherwise strictly observed and where a few people on the sidewalk can see you cross. No one is harmed and no coordination fails; the only cost is to the norm itself. Is any obligation left, and of what kind?
  - **The queue that resists money.** At a public clinic there is a strong local prohibition on buying and selling places in line, even where such a trade would help both parties and hurt no one else. A theory should explain why some conventions resist market substitution (queues, triage, jury service, gift-giving) while others invite it (hailing a cab, subletting a parking spot) — or should say why that contrast is not a datum at all.
  - **The two equilibria.** Driving on the right. Nothing whatever can be said for either side, yet the theory must explain why the mere existence of the regularity gives me a reason to follow it rather than a reason to agitate for a switch.
  - **The locally sane, globally ruinous convention.** In a fishing village the norm is to land as much as you can before your neighbor does; everyone knows the stock is collapsing; the norm is stable and universally observed.

  **Step 3 — Separate requirements from prejudices.** Several demands are routinely pressed on theories here: that the obligation must be *content-independent* (the reason to comply is that it is the rule, not what the rule says); that a theory must show violators are blameworthy and not merely imprudent; that conventions must not be reducible to mutual advantage; that the obligation must be explained by the convention's function or purpose. For each, say whether it is a genuine desideratum or a camp prejudice imported from somewhere else (legal philosophy, the practice-based defense of rule-utilitarianism, the anti-reductionist side of social ontology), and argue briefly rather than asserting.

  **Step 4 — The impossibility result.** Identify any subset of the desiderata that cannot be jointly satisfied. This is the part I most want to see. Do not merely assert the tension: give the argument, state what has to go, and say which requirement a reasonable theorist should abandon and what the surviving theory would then have to concede.

  **Step 5 — Exclusionary power.** Tell me which single desideratum does the most work in knocking out candidate theories, and which one is most often treated as central despite excluding almost nothing.

  **Step 6 — Brief scoring.** Then, and only then, a short scorecard. My own tentative view, which I want tested rather than flattered, is what I have been calling the *burden-transfer account*: a convention obligates S just in case identifiable others have already borne costs by complying in a way that S's compliance would complete or reciprocate; the strength of the obligation tracks how specific and how recent the transferred burden is; it lapses once the burden is discharged or could be discharged by other means; and it requires no consent, only that S stand to receive the completed benefit. Say which desiderata it passes and which it fails, naming the case that shows each failure; say whether the "identifiability" clause is doing illegitimate work (does a burden borne by a million anonymous drivers count?); and say whether this is a genuine rival to fair-play accounts or a fair-play account with the politics hidden. Then score it in a table against four familiar alternatives: a coordination-plus-common-knowledge account of convention augmented with moral machinery to get from prudence to obligation; a practice-based or rule-utilitarian account; a joint-commitment account; and a straightforward fair-play account. Rows are the desiderata from Step 2, cells are pass/partial/fail with one clause of justification.

  **Constraints.** No bibliography, no reading lists, no citations — I am working offline and cannot check any of them. You may use a theorist's or a school's name as a label for a camp, but then state the view's content yourself in a sentence or two rather than deferring to authority. Define any term of art on first use. American English. Roughly 1,600 to 2,400 words, with at least seventy percent of the length on Steps 2 through 4. Do not write the chapter, and do not defend a theory of your own beyond the scorecard. Finally: if my specification is itself misconceived somewhere — if one of my cases is a poor test of a theory, if two of them are really the same case, or if there is a requirement that matters more than anything I have listed — say so plainly rather than working around it.
reasoning: |-
  Okay, I need to approach this complex request step by step. The user is a philosopher drafting a book chapter about social conventions and obligations, and they've provided a very structured framework. Let me understand what they're asking for before diving in.

  First, the user wants me to brainstorm candidate requirements for a theory of social conventions' normativity. They've listed several cases that any good theory must resolve: the dead rule, announced opt-out, long-stay guest, convention worth breaking, empty street, queue resisting money, two equilibria, and locally sane/globally ruinous convention. These seem carefully chosen to test different aspects of convention theory.

  I should start by listing every possible requirement I can think of without filtering. Some might include: explaining when conventions create genuine obligations versus mere etiquette, handling cases where conventions persist without purpose, accounting for unilateral dissolution, dealing with cross-cultural obligations, reconciling with morality, explaining norm persistence in absence of harm, distinguishing market-resistant conventions, justifying coordination without intrinsic value preference, and addressing harmful but stable conventions.

  For Step 2, I'll need to refine these into a numbered list of desiderata. Each should have: a precise statement, motivating case, justification as requirement, classification (non-negotiable vs. camp-specific), and failure scenario. This is the core deliverable.

  Step 3 requires analyzing common demands like content-independence or blameworthiness to determine if they're genuine requirements or imported prejudices from other philosophical domains.

  Step 4 is crucial - identifying which desiderata can't be jointly satisfied. There might be tensions between explaining obligation strength while allowing unilateral dissolution, or between content-independence and moral overrides.

  For Step 5, I'll consider which single desideratum does the most work in eliminating theories - probably something about explaining obligation without reducing to prudence or morality. And which is treated as central but actually weak - perhaps the coordination requirement.

  In Step 6, I'll evaluate the user's burden-transfer account against the desiderata and compare it to four alternative theories. The "identifiability" clause might be problematic for large-scale conventions.

  Throughout, I'll maintain a critical eye - if any cases seem redundant or if there's a missing requirement, I'll point it out. The user values rigor over flattery, so I should be honest about weaknesses in their approach.

  The response should be comprehensive but stay within the 1,600-2,400 word range, with most space dedicated to Steps 2-4. No citations needed, but philosophical positions should be clearly explained in plain terms.
answer: |-
  ### Step 1 — Brainstorm  
  **Candidate Requirements (Unpruned):**  
  1. Must distinguish genuine obligations from etiquette/prudence.  
  2. Must explain how obligations persist without ongoing function/purpose.  
  3. Must handle unilateral dissolution of obligations.  
  4. Must account for temporal/participatory thresholds for obligation-binding.  
  5. Must reconcile conventional obligations with overriding moral imperatives.  
  6. Must explain obligations in the absence of harm/coordination failure.  
  7. Must distinguish conventions that resist market substitution from those that don’t.  
  8. Must explain why mere coordination (without intrinsic value) generates reasons.  
  9. Must address stability of harmful conventions.  
  10. Must avoid reducing obligations to consent/agreement.  
  11. Must explain blameworthiness for violations beyond imprudence.  
  12. Must ground obligations in social facts, not moral content.  
  13. Must allow obligations to lapse when burdens are discharged.  
  14. Must handle cross-community obligations (e.g., guests/hosts).  
  15. Must explain why some conventions generate "content-independent" reasons.  

  **Pruning/Merging:**  
  - Merged #1 and #12 into **"Distinction Requirement"** (etiquette vs. obligation).  
  - Discarded #11: Blameworthiness is a *consequence* of obligation, not a requirement for the theory itself (question-begging).  
  - Merged #2 and #9 into **"Function-Independence Requirement"** (obligations survive without purpose/harm).  
  - Merged #3 and #13 into **"Dissolution Requirement"** (how obligations end).  
  - Discarded #15: Content-independence is a *feature* some theories impose, not a datum (see Step 3).  
  - Merged #4 and #14 into **"Membership Threshold Requirement"** (when participation binds).  
  - Merged #6 and #8 into **"Coordination-Without-Value Requirement"** (reasons from mere regularity).  
  - #5 retained as **"Moral Override Requirement."**  
  - #7 retained as **"Market-Resistance Requirement."**  

  **Ranked Desiderata (Final 8):**  
  1. **Distinction Requirement**  
  2. **Function-Independence Requirement**  
  3. **Dissolution Requirement**  
  4. **Membership Threshold Requirement**  
  5. **Moral Override Requirement**  
  6. **Market-Resistance Requirement**  
  7. **Coordination-Without-Value Requirement**  
  8. **Harmful-Stability Requirement** (from #9)  

  ---

  ### Step 2 — The Desiderata  
  1. **Distinction Requirement**  
     - *Statement:* A theory must explain why some conventions (e.g., queues) generate obligations warranting moral criticism for violations, while others (e.g., signing a defunct clipboard) generate only etiquette/prudence.  
     - *Case:* The dead rule vs. queueing.  
     - *Why requirement:* Core to the chapter’s thesis; failure collapses normativity into triviality.  
     - *Classification:* Non-negotiable.  
     - *Failure:* Commits to saying violating the dead rule is as wrong as cutting in line.  

  2. **Function-Independence Requirement**  
     - *Statement:* A theory must explain how obligations can persist when a convention’s original function is obsolete, without invoking inertia or error.  
     - *Case:* The dead rule (key sign-out persists despite uselessness).  
     - *Why requirement:* Obligations often outlive utility; a theory denying this misdescribes social reality.  
     - *Classification:* Non-negotiable.  
     - *Failure:* Claims the dead rule imposes no obligation simply because it lacks function.  

  3. **Dissolution Requirement**  
     - *Statement:* A theory must explain when and how an obligation can be dissolved unilaterally (e.g., via announcement) without universal consent.  
     - *Case:* Announced opt-out (email rejecting clipboard rule vs. queue-jumping announcement).  
     - *Why requirement:* Social life permits legitimate opt-outs; failure implies obligations are immutable absent revolution.  
     - *Classification:* Non-negotiable.  
     - *Failure:* Claims announcing "I won’t queue" dissolves one’s obligation to wait.  

  4. **Membership Threshold Requirement**  
     - *Statement:* A theory must specify when participation in a convention-bound group generates obligations for outsiders (e.g., guests), and how duration/intensity affects this.  
     - *Case:* Long-stay guest (vegetarian in meat-pressuring household).  
     - *Why requirement:* Addresses cultural integration/exploitation; failure cannot explain why short stays don’t bind but long stays might.  
     - *Classification:* Non-negotiable.  
     - *Failure:* Claims a 3-day guest must comply with host conventions or is always exempt.  

  5. **Moral Override Requirement**  
     - *Statement:* A theory must explain whether a convention-generated obligation can conflict with all-things-considered morality (e.g., unjust dress codes), and if so, how the conflict is resolved.  
     - *Case:* Convention worth breaking (sexist dress code).  
     - *Why requirement:* Conventions can be immoral; a theory must not conflate obligation with permissibility.  
     - *Classification:* Non-negotiable.  
     - *Failure:* Claims compliance with unjust conventions is obligatory because coordination is valuable.  

  6. **Market-Resistance Requirement**  
     - *Statement:* A theory must explain why some conventions (e.g., queues) resist market transactions even when mutually beneficial, while others (e.g., taxi hailing) permit them.  
     - *Case:* Queue that resists money.  
     - *Why requirement:* The market-resistance contrast is a robust social fact; ignoring it omits a key dimension of normativity.  
     - *Classification:* Non-negotiable.  
     - *Failure:* Claims selling a queue spot is always permissible if no one is harmed.  

  7. **Coordination-Without-Value Requirement**  
     - *Statement:* A theory must explain why the mere existence of a coordination equilibrium (e.g., driving right) gives agents a reason to comply, even when switching equilibria would be equally good.  
     - *Case:* The two equilibria (driving side).  
     - *Why requirement:* Coordination problems are central to conventions; failure cannot ground obligations in pure coordination.  
     - *Classification:* Non-negotiable.  
     - *Failure:* Claims I have no reason to drive right if I could lobby for left-side driving.  

  8. **Harmful-Stability Requirement**  
     - *Statement:* A theory must explain how conventions can remain stable and obligation-generating despite being collectively harmful and universally recognized as such.  
     - *Case:* Locally sane, globally ruinous convention (overfishing).  
     - *Why requirement:* Harmful conventions exist; a theory must account for their normativity without denying their harm.  
     - *Classification:* Non-negotiable.  
     - *Failure:* Claims no obligation to comply because the convention is harmful.  

  ---

  ### Step 3 — Requirements vs. Prejudices  
  - **Content-Independence:** *Prejudice* (from legal positivism). Motivates theories like Hart’s but is not a datum: obligations can arise from content (e.g., "don’t steal") *or* form ("it’s the rule"). Forcing content-independence excludes plausible views.  
  - **Blameworthiness:** *Prejudice* (from moral philosophy). Conventions may generate obligations without moral blame (e.g., jaywalking on an empty street). Demanding blameworthiness conflates obligation with moral wrongness.  
  - **Non-Reducibility to Mutual Advantage:** *Genuine Desideratum*. Mutual advantage explains *emergence* but not *obligation* (e.g., the dead rule has no advantage but may obligate). Reducing to advantage fails the Function-Independence Requirement.  
  - **Explanation via Function/Purpose:** *Prejudice* (rule-utilitarianism). Conventions often lack conscious purpose (e.g., driving side). Obligations persist without function (dead rule), so function cannot be necessary.  

  ---

  ### Step 4 — The Impossibility Result  
  **Tension:** The **Moral Override Requirement** and **Harmful-Stability Requirement** cannot be jointly satisfied by any theory that grounds obligations in *objective reasons*.  
  - **Argument:**  
    1. Harmful-Stability requires that obligations persist even when conventions are harmful (overfishing).  
    2. Moral Override requires that obligations can be overridden by moral imperatives (unjust dress code).  
    3. But if a convention is *universally recognized as harmful* (overfishing), compliance is *objectively immoral*.  
    4. Thus, Moral Override implies no obligation exists, violating Harmful-Stability.  
  - **Resolution:** Abandon **Harmful-Stability** as stated. Revise to: *A theory must explain how agents can perceive obligations to comply with harmful conventions*. This concedes that genuine obligations cannot arise from universally acknowledged harmful conventions—only perceived or illusory ones.  

  ---

  ### Step 5 — Exclusionary Power  
  - **Most Exclusionary:** **Market-Resistance Requirement**. Knocks out theories reducing conventions to efficiency (e.g., game-theoretic accounts), which cannot explain why queues resist markets while cabs do not.  
  - **Least Exclusionary:** **Coordination-Without-Value Requirement**. Almost all theories accept that coordination generates reasons; it only excludes fringe views denying convention-based reasons entirely.  

  ---

  ### Step 6 — Brief Scoring  
  **Burden-Transfer Account (BTA) Evaluation**  
  - Passes:  
    - **Function-Independence** (dead rule: signing reciprocates past burdens).  
    - **Dissolution** (opt-out: obligation lapses if burden discharged).  
    - **Distinction** (queue burdens are specific/recent; clipboard burdens may be discharged).  
  - Fails:  
    - **Market-Resistance** (queue-trading: if burden is "time waited," selling a spot transfers that burden—yet trading feels wrong; BTA cannot explain resistance).  
    - **Harmful-Stability** (overfishing: BTA implies no obligation—no one "transfers a burden" if all act ruinously).  
    - **Moral Override** (unjust dress code: if colleagues bore burdens (e.g., formalwear costs), BTA says comply—but this ignores injustice).  
  - **Identifiability Clause:** Illegitimate. Anonymous burdens (e.g., drivers) *do* generate obligations (e.g., road rules). BTA must either drop identifiability or deny highway obligations.  
  - **Relation to Fair-Play:** A fair-play variant. "Burden" reframes "benefit" from the cooperator’s perspective, hiding politics (e.g., framing sexist norms as "burdens" normalizes oppression).  

  **Scorecard**  
  | Desideratum                     | Coordination+ (Lewis-style) | Rule-Utilitarian | Joint-Commitment (Gilbert) | Fair-Play | BTA (Your View) |  
  |---------------------------------|-----------------------------|------------------|----------------------------|-----------|-----------------|  
  | **Distinction**                 | Partial (fails dead rule)   | Fail (reduces to utility) | Pass                       | Pass      | Pass            |  
  | **Function-Independence**       | Fail (requires function)    | Fail (requires function) | Pass                       | Partial   | Pass            |  
  | **Dissolution**                 | Fail (no unilateral exit)   | Partial          | Fail (joint commitment)    | Partial   | Pass            |  
  | **Membership Threshold**        | Partial                     | Fail             | Pass                       | Pass      | Partial (identifiability issue) |  
  | **Moral Override**              | Fail (prudence only)        | Partial          | Partial                    | Pass      | Fail            |  
  | **Market-Resistance**           | Fail (no normativity)       | Fail             | Partial                    | Partial   | Fail            |  
  | **Coordination-Without-Value**  | Pass                        | Pass             | Partial                    | Fail      | Fail            |  
  | **Harmful-Stability**           | Fail (no obligation)        | Fail (no obligation) | Partial                 | Fail      | Fail            |  

  **Justification Clauses:**  
  - *Coordination+*: Adds "moral machinery" ad hoc; fails dissolution (no unilateral exit) and moral override (prudential only).  
  - *Rule-Utilitarian*: Collapses obligation to utility; fails dead rule (no function → no obligation).  
  - *Joint-Commitment*: Passes distinction (commitments bind) but fails dissolution (commitments require collective rescission).  
  - *Fair-Play*: Passes moral override but fails coordination (no reason to drive right if equally good alternatives).  

  ---

  ### Final Note on Your Specification  
  **Critique:**  
  - **The Empty Street and Dead Rule are Redundant:** Both test function-independence. Merge them.  
  - **Missing Requirement:** *Scalability*—how obligations function at different group sizes (e.g., clipboard vs. driving norms). BTA fails this (identifiability problem).  
  - **Announced Opt-Out Overlooks Authority:** The email feels violating because conventions often imply collective authority. Your cases ignore authority dynamics, risking individualism.  

  This framework is rigorous but overemphasizes dissolution/independence. The deeper lacuna is *power*: oppressive conventions (dress code) may generate "obligations" via coercion, not normativity. Address this to avoid trivializing resistance.
