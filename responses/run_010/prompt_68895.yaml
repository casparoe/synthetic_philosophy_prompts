  ### Diagnosing Supervisor (0.85) vs. Student (0.2) Disagreement  
  **Core divergent terms:**  
  1. **P(Humean supports deference & substantivity | Humean)**  
     - Supervisor likely >0.7 (trusts New Principle); student likely <0.2 (sees undermining as fatal).  
  2. **P(Physics permits single-case chances)**  
