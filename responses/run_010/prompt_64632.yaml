  First, I need to unpack "playing God" methodically. The phrase is emotionally charged but vague—it’s used as a conversation-ender, so dissecting its possible meanings is crucial. The user suspects only one interpretation ("we can’t foresee consequences") might have weight, and they’re also curious about non-consequentialist angles (e.g., parental attitude) and whether the objection overgeneralizes to other medical interventions. 

  I’ll start by mapping the logical territory. "Playing God" typically implies one of four claims: (1) violating a divine/natural order, (2) overstepping human limits in knowledge or control, (3) usurping a divine role in creation, or (4) expressing problematic attitudes like hubris. For each, I’ll assess:  
