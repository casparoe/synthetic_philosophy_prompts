  But why is this intractable? Both sides accept Bayesian updating but start from different evidence sets. No amount of calculation can bridge that gap. The halfer/thirder debate mirrors this. Halfers treat waking up as given, focusing on the coin flip. Thirders include the existence of the waking event as evidence. Again, different evidence leading to different updates.

  Contested areas include the nature of existence as evidence and how to formalize indexical evidence. Progress might come from decision theory or formalizing self-location. But these may only satisfy one side. The user might need a meta-framework to compare approaches, like in computer simulations of observers. However, these frameworks themselves might embed the same disagreements.

