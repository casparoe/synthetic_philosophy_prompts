  - Source contamination (Geoffrey's "old Welsh book" claim)

  *Priors question is brutal*. If I say "30% of legendary figures were real," I need defense, not waffling. Since most pre-modern people were farmers/soldiers leaving no trace, but legends cluster around elites... maybe 10-20%? But that feels low for "well-known" figures. *Struggling*. 

  Non-negotiables: 
  1. Contemporaneity (within living memory) - but flexible for oral cultures. 
  2. Non-derivative sources - can't all cite one lost text. 
  3. Plausibility anchor - something concrete (artifact, named battle). 

  *Ah-ha*: The Trojan War has #1 (Hittite texts mention Ahhiyawa vs Wilusa), #2 (Homer + Hittites independently), #3 (Troy VIIa destruction layer). Arthur fails #1 (Gildas omits him), #2 (all sources post-9th c.), #3 (no solid anchor). Exodus fails #3 (no Sinai trail evidence) and #1 (Merneptah Stele shows Israel *in* Canaan pre-exodus). 

  *Wincing*: The elitism critique is valid. My criteria *do* favor literate societies. But that's not a bug—it's epistemic reality. We can't verify oral-tradition figures to same standard. Maybe add "oral consistency" as soft criterion? But user wants binary rules... 

  Final spec must: 
