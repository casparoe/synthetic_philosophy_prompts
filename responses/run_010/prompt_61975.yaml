  Their hidden pain point: They suspect current historical methods are elitist (only verifying literate elites), which invalidates ordinary people's histories. That's philosophical dynamite. Also, they want to apply one standard to Troy (probably real), Arthur (probably not), and Exodus (very unlikely)—a tough balancing act. 

  *Deep breath* The core tension: How strict should the "kernel" threshold be? Too loose = every myth gets a pass; too strict = only kings leave traces. My proposed criteria must navigate this. 

