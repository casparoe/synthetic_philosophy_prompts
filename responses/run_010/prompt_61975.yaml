answer: |-
  ### Core Requirement: Non-Derivative Early Attestation  
  **Most critical requirement**. Set is jointly satisfiable *only* for figures in literate/monumental societies. For non-literate contexts, the standard defaults to "plausible but unverifiable."  

  ---

  ### Requirements List: Historical Kernel Verification  
  | Requirement               | Non-Negotiable? | Motivating Case/Consideration                                                                 | Camp Prejudice?             |  
  |---------------------------|-----------------|-----------------------------------------------------------------------------------------------|-----------------------------|  
  | **1. Contemporaneity**    | Conditional     | Gildas (~540 CE) writes of Badon but omits Arthur. Silence only counts if context expects recording (e.g., Roman Britain ≠ Desert). | Yes (overrated for oral societies) |  
  | **2. Non-Derivative Sources** | Yes          | Geoffrey of Monmouth's "lost Welsh book" is uncorroborated. Sources sharing an ancestor (e.g., Welsh Annals) count as *one*. | No (core to evidence)       |  
  | **3. Plausibility Anchor** | Yes           | Troy VIIa destruction (1180 BCE) licenses "conflict at site," not "Achilles fought Hector." Must distinguish: site (Troy), person (Arthur), event (Exodus). | No (avoids overreach)       |  
  | **4. Multiple Independent Attestation** | Flexible   | Gospel parallels vs. Arthurian monolith (all sources post-900 CE). Oral traditions count only if early & consistent *before* literary fixation. | Yes (ignores oral dynamics) |  
  | **5. Evidence Resilience** | Yes           | Merneptah Stele (1208 BCE) proves "Israel" existed in Canaan. Absence of evidence *is* evidence of absence *if* the context should leave traces (Exodus' 40-yr desert camp vs. Arthur's post-Roman chaos). | No (when priors are set)    |  

  **Key Distinctions**:  
  - **Site ≠ Story**: Troy's ruins support "war at Troy," not Homer's narrative.  
  - **Kernel Threshold**: "Someone existed" requires a named, context-plausible figure (e.g., a warlord at Badon). "Narrative happened" requires event-chain validation (Exodus' 600K Israelites fails).  
  - **Silence Priors**: (A) *Would it be recorded?* (Egyptians documented defeats; post-Roman Britons didn’t). (B) *Would it survive?* (Papyrus degrades; stone endures).  

  **Priors on Legendary Figures**:  
  - **~20-30%** of "well-known" semi-legendary figures likely existed. Defense: Legends require *some* seed (person, event), but mythmaking is cheap and often grafts onto minimal kernels (e.g., Celtic god → Arthur). Urban/literate figures (e.g., Roman emperors) survive at ~80%; rural/oral (e.g., Germanic heroes) at ~10%.  

  ---  

  ### Application to Cases  
  1. **Trojan War** (✓ Kernel)  
     - *Why*: **Plausibility Anchor** (Troy VIIa sacked c. 1180 BCE) + **Non-Derivative Sources** (Hittite texts mention "Wilusa" vs. "Ahhiyawa" conflict, independent of Homer).  
     - *Kernel Licensed*: "Major conflict at Troy in Late Bronze Age."  

  2. **King Arthur** (✗ Kernel)  
     - *Why*: Fails **Contemporaneity** (Gildas, 6th-c. eyewitness, omits Arthur) and **Non-Derivative Sources** (all Arthurian texts descend from Geoffrey c. 1136; Welsh Annals' entries likely interpolated). "Artorius" inscription is irrelevant (wrong era, no link).  
     - *Silence Valid*: Post-Roman Britain lacked chroniclers; no contemporary writing *should* name him.  

  3. **Exodus** (✗ Event)  
     - *Why*: Fails **Evidence Resilience** (No trace of 600K+ people in Sinai for 40 years; Egyptian records document Canaanite migrations but no mass escape/slavery) and **Plausibility Anchor** (Merneptah Stele places Israel *in* Canaan by 1208 BCE, pre-dating Exodus timeline).  
     - *Kernel Possible*: "Small group escaped Egypt" survives minimal attestation but unsupported by evidence.  

  ---  

  ### Inherent Tensions  
  - **The Elitism Bug**: Contemporaneity/written attestation *is* biased toward powerful/literate societies. **Not a bug**—epistemology requires evidence. Oral traditions get graded on plausibility (e.g., Badon occurred; Arthur *might* have fought there).  
  - **Non-Negotiables vs. Context**: **Non-Derivative Sources** and **Evidence Resilience** are essential. **Contemporaneity** is relaxed for non-literate societies (e.g., Norse sagas validated via archaeology).  
  - **Kernel Threshold**: A name + plausible context suffices for "existed" (e.g., "a warlord at Badon"). The spec *denies* this for Arthur due to source contamination and silence.  

  **Bottom Line**: The spec rejects Arthur (no early sources), accepts Troy's war (corroborated anchor), and rejects Exodus (evidence absence + contradiction). Independence and resilience carry the weight.
