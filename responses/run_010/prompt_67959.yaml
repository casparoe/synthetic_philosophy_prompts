answer: |-
  ## IN THE COURT OF KING'S BENCH AT WESTMINSTER  
  **IN THE MATTER OF THE ASHFIELD CLAIMS**  
  *(The Ashfield Claimants v. The Crown Grain Commissioners, Mount Pyreclastica, The Three Cold Summers, & The Fever Aboard the Relief Ship "Mercy")*  
  **REX v. REX (In Right of the Commissioners)**  
  **Albion Common Pleas Reports, Vol. XII, p. 471 (1789)**

  **JUDGMENT OF THE COURT**  
  *(Delivered by LORD CHIEF JUSTICE SIR PERCIVAL THORNE)*

  Be it remembered that in the 35th Year of His Majesty King Alaric, a great calamity befell the Province of Mount Pyreclastica. The mountain, hitherto deemed a benign if brooding presence, did on the ides of April erupt with prodigious violence, casting down a mantle of ash so thick it blotted out the sun for nigh a fortnight and buried the nascent spring crops. This event, lamentable in itself, proved but the overture to a symphony of woe. The summers that followed – designated herein as Summers of Discontent I, II, and III – were marked by unseasonable chill, frosts in June, and rains in August, rendering the harvests meagre to the point of famine.

  The Crown Grain Commissioners, charged under Statute 12 Geo. II c.7 with the maintenance of strategic grain reserves and the regulation of exports, responded with characteristic vigour… of deliberation. Finding reserves depleted (owing, they deposed, to necessary provisioning of His Majesty’s forces in the Floridian campaigns), and fearing panic, they maintained a strict ban on grain exports from Albion throughout Summer II, despite pleas from merchants offering grain from warmer climes. Relief was eventually dispatched in the fourth year aboard the good ship *Mercy*. Alas, the *Mercy* carried not only sacks of barley but also the Pestilential Ague, a fever of remarkable virulence. This fever, finding a populace weakened by hunger and ash-laden lungs, swept through the province with grim efficiency, carrying off some three thousand souls.

  The descendants of the deceased now seek redress against the Commissioners. Finding the Commissioners’ coffers perhaps insufficient to satisfy the magnitude of the claim, and doubtless inspired by a spirit of comprehensive litigiousness, the Claimants sought, and the lower court inexplicably granted, leave to join as Defendants: Mount Pyreclastica (for the initial eruption and ashfall), The Three Cold Summers (for the harvest failures), and The Fever Aboard the Relief Ship *Mercy* (for the final blow). The Commissioners naturally plead the Act of God and point vigorously at their co-Defendants. We are thus tasked with the unenviable duty of apportioning blame for this concatenation of catastrophes.

  **I. Causation: The Tangled Skein**
  The Claimants allege the Commissioners’ failures – specifically, the lack of reserves and the refusal to lift the export ban in Summer II – were the but-for cause of the deaths. But did the Commissioners’ inaction *cause* the deaths? Applying the strict but-for test (“*sine qua non*”) yields a troubling result: *But for* the Commissioners’ failures, *would* the deceased have survived? We think not. The harvests of Summers I, II, and III were catastrophically poor *regardless* of the Commissioners’ actions. The ash smothered growth; the cold withered stalks. Even had reserves been full and imports permitted in Summer II, the sheer scale of deprivation over *three* years suggests many would have perished from hunger alone *before* the *Mercy* ever sailed. The but-for chain thus frays at its inception.

  Faced with this, the Court, in a moment of doctrinal desperation, reached for the test of Material Contribution. Did the Commissioners’ conduct materially contribute to the harm? Undoubtedly! Empty granaries and barred ports worsened the famine. But herein lies the rub: so too did the ash of Mount Pyreclastica materially contribute by destroying the initial crop. So too did the unremitting cold of Summers I, II, and III materially contribute by preventing recovery. And so too, most spectacularly, did the Fever materially contribute by delivering the final, mortal blow. Applying Material Contribution universally renders *everything* a cause. This is logically impeccable but practically absurd, reducing causation to mere sequence. We harbour profound regret for this particular judicial innovation in the present circumstances.

  **II. The Nature of the Summers: One Event or Three?**
  The Claimants styled “The Three Cold Summers” as a single Defendant. The Commissioners argue strenuously that each summer is a distinct meteorological event. We find this distinction without practical difference. Whether one views the cold as a single, persistent blight or three successive afflictions matters little to the starving farmer or the final tally of want. The harm is cumulative and inseparable. We shall, for administrative convenience and to spare the Clerk the task of issuing three separate writs against the weather, treat them as a unitary Defendant: “The Adverse Climatic Conditions (Summers I-III)”. Their culpability is manifest.

  **III. The Fever: Superseding or Foreseeable?**
  The Commissioners plead the Fever aboard the *Mercy* as a superseding intervening cause, breaking the chain of liability. They argue they could not foresee a pestilence hitching a ride on a relief vessel. The Claimants counter that sending a ship into a famine-stricken, ash-choked land inherently risked introducing disease amongst a vulnerable populace; it was a dependent intervening cause the Commissioners *should* have foreseen. We are persuaded by neither extreme. The Fever was undeniably a potent, independent force. Yet, sending relief to the desperate *is* foreseeable, and ships in this age are notorious vectors of disease. The Fever was neither so extraordinary as to be utterly unforeseeable, nor so directly linked to the Commissioners’ *specific* failures (lack of reserves, export ban) as to be a dependent result thereof. It occupies an unhappy middle ground: a foreseeable risk tragically realized, but not solely attributable to the Commissioners’ initial negligence. It remains a potent cause in its own right.

  **IV. The Mountain: Actor, Object, or God?**
  The most perplexing Defendant is Mount Pyreclastica. Can a mountain be sued? The Clerk of Court reports utter failure to serve process upon it; no Answer has been filed. Does a mountain *act*, or does an eruption merely *occur*? Is it an agent, capable of intent or negligence, or merely a feature of the landscape behaving according to its nature? The Act of God defence, pleaded by the *other* Defendants *against* the Mountain, assumes God acts *through* nature, implying the Mountain was His instrument, thus excusing human defendants. But this requires accepting the Mountain *as* an actor, divinely animated. If it is *not* an actor, merely a condition, then the Act of God defence dissolves, for God’s act lacks a tangible agent within the litigation. Conversely, if we deem the Mountain an actor (as joining it implies), we must confront its undeniable, overwhelming contribution. To avoid metaphysical paralysis, we find the eruption was an *event* of such force and singularity that it must be recognised as a primary, efficacious cause, regardless of its ontological status as actor or occurrence. Its failure to file an Answer is noted but cannot absolve it of causal potency in these proceedings.

  **V. Apportionment**
  Having identified multiple causes – Human (Commissioners), Geological (Mountain), Climatological (Summers), and Biological (Fever) – we must apportion liability. This is less a matter of precise calculus than judicial estimation based on the relative force and necessity of each contributing factor. We find:
  1.  **Mount Pyreclastica (Eruption & Ashfall):** The initiating catastrophe, without which the subsequent chain is unlikely. It rendered the land barren and the people vulnerable. **61%**.
  2.  **The Adverse Climatic Conditions (Summers I-III):** The sustained force preventing recovery, deepening the famine. **22%**.
  3.  **The Fever Aboard the Relief Ship "Mercy":** The proximate cause of death for most claimants' ancestors, exploiting the vulnerability created by others. **12%**.
  4.  **The Crown Grain Commissioners:** Their failure to maintain reserves removed a critical buffer; their refusal to lift the export ban in Summer II arguably worsened the depth of the famine at a crucial point, materially contributing to the populace's weakened state. **5%**.

  **VI. Result**
  The Claimants’ appeal against the dismissal of their claim against the Commissioners succeeds in part. Liability is established against the Commissioners for 5% of the proven damages. Judgment is entered against Mount Pyreclastica for 61%, The Adverse Climatic Conditions for 22%, and The Fever Aboard the Relief Ship "Mercy" for 12% of said damages. Enforcement against the non-human Defendants shall be the responsibility of the Claimants. The Commissioners' cross-appeal seeking total dismissal is dismissed.

  **DISSENT (LORD JUSTICE EDMUND BLYTHE)**
  I concur that the Commissioners bear *some* fault. I dissent vehemently from the majority's nonsensical apportionment. Attributing precise percentages (61%!) to a volcano, the weather, and a disease is a grotesque parody of causation. Causes are not coins to be stacked summing to 100 pence. The eruption's "61%" inevitably includes the tectonic shifts millennia before, the very composition of the earth's crust – where does liability end? If the Mountain is an "actor" liable for 61%, it absolves the Commissioners only by making causation infinite and responsibility meaningless. We either hold human agents accountable for their failures within the sphere of their foresight and duty, recognizing nature as the inescapable context, or we abandon tort law for theology and geology. The majority has chosen the latter path, producing a judgment both logically incoherent and practically unenforceable. The claim against the Commissioners should stand or fall on ordinary principles of foreseeability and proximate cause applied to *human* conduct, not this pantheistic pageant.

  **COSTS**
  Costs of this appeal awarded to the Claimants, payable by the Crown Grain Commissioners. Costs associated with joining and serving the non-human Defendants to be borne by the Claimants. Execution against Mount Pyreclastica is stayed indefinitely, pending development of feasible methods.
