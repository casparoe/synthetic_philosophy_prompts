answer: |-
  Below is a line-by-line critique addressing your specific requests and testing your core proposal. I’ve focused on rigor, potential weaknesses, and historical/philosophical precision:

  ### 1. **Does the re-pointing/withdrawal distinction earn its keep?**  
     - **Strengths**: Your distinction effectively isolates a *mechanism* (intermediary withdrawal) that Appiah’s broader "honour" framework obscures. It clarifies why duelling collapsed without mass conversion.  
     - **Weaknesses/Risks**:  
       - It risks collapsing into **Ellickson’s "order without law"** (norms enforced by decentralized third parties) or **Bicchieri’s "conditional norms"** (norms sustained by expectations of enforcement). Your framing is novel in emphasizing *ratification* as a social ritual, but the core idea—norms dying when enforcers defect—is established.  
       - **Re-pointing** resembles *normative reframing* (e.g., declining duels becomes "courageous self-restraint"). This aligns with existing work on moral revaluation (e.g., Boltanski’s *On Critique*).  
     - **Veridict**: The distinction *does* earn its keep by specifying *how* honour systems unravel (withdrawal of ratification) versus evolve (re-pointing). But it’s a refinement, not a revolution. To strengthen it, explicitly contrast with "internalization" (e.g., duellists didn’t internalize anti-dueling norms; intermediaries just quit).  

  ### 2. **Is your "nobody’s beliefs changed" claim too strong?**  
     - **Yes, slightly.** Your mechanism is powerful but overstates unanimity.  
       - **Counterexample 1 (Intermediaries ratified, practice ended)**: If magistrates/juries *increased* prosecutions (ratifying anti-dueling norms), moral conversion among *enforcers* likely occurred. E.g., Lord Ellenborough’s 1809 ruling (R. v. *Thornton*) reflected shifting judicial attitudes.  
       - **Counterexample 2 (Intermediaries withdrew, practice survived)**: Post-1840s, American Southern "affairs of honor" persisted where communities *informally* ratified duels (e.g., juries acquitting killers). Withdrawal wasn’t universal.  
     - **Revision Suggestion**: Soften to "the practice could collapse *primarily* through withdrawal of ratification, even absent widespread belief change." Acknowledge that *some* intermediaries (e.g., reformist editors) likely underwent moral shifts.  

  ### 3. **Have you over-extended Bernard Williams?**  
     - **Williams is apt but slightly strained**. Your use of "relativism of distance" and anti-progressivism is correct, but:  
       - Williams focused on *incommensurability* between ethical worlds (e.g., Homeric vs. modern). Your intermediaries imply a *structural* account of norm-enforcement he didn’t develop.  
       - The phrase *"this is Williams’ general point"* overclaims. His target was moral realism/progressivism, not honor systems’ mechanics.  
     - **Recommendation**: Trim to: *"Williams’ broader critique of treating ethical life as belief-correction aligns with this mechanism: the duel’s collapse reflects a shift in social grammar, not moral truth-discovery."* Keep the frame but avoid implying Williams analyzed your specific model.  

  ### 4. **Unsafe historical claims**:  
     - **"The duel generated no body of testimony from its own victims"**:  
       - **Problem**: Surgeons and seconds (e.g., Joseph Hamilton’s *Men’s Lives: The Cost of Dueling*, 1829) documented trauma. "Victims" include widows/comrades who lobbied regiments to ban duels.  
       - **Fix**: Specify *"no centralized abolitionist movement led by victims"* (unlike slavery).  
     - **"Duelling persisted longest among officers without means"**:  
       - **Problem**: Elite officers (e.g., Wellington’s circle) dueled post-1800; impoverished officers often couldn’t afford pistols/seconds.  
       - **Fix**: Cite Appiah’s data on middling-rank officers or use "sub-elites" instead.  
     - **"Withdrawal occurred without moral argument"**:  
       - **Problem**: Anti-dueling societies (e.g., London Association, 1843) *did* lobby intermediaries (press, regiments).  
       - **Fix**: Emphasize that arguments *targeted intermediaries*, not duelists directly.  

  ### Structural Suggestions:  
  - **Sharpen the slavery contrast**: If dueling died via withdrawal, why did slavery require re-pointing (e.g., "honorable abolitionism")? Hint at intermediaries’ divergence (e.g., slave trade depended on state/naval ratification; dueling on peer groups).  
  - **Clarify "reversible" claim**: If ratification can resume, why hasn’t dueling revived? Note the rise of *non-reversible* institutions (professional militaries, libel laws) replacing honor codes.  
  - **Avoid "arithmetic inverted" metaphor**: It implies rational choice. Honor systems thrived on *irrational* risk-taking; intermediaries made defiance unthinkable, not unprofitable.  

  ### Overall Assessment:  
  Your proposal **successfully refines Appiah** by exposing honor as *procedural* (ratification) not *substantive* (virtue). The distinction holds, but historical pushback requires nuance. Williams is a valid ally if trimmed. The draft is analytically robust—focus revisions on hedging absolutist claims and tightening historical evidence.  

  **Word Count Note**: At 1,300 words for a central section, ensure the remaining 1,700 covers slavery (to address the full question) and synthesizes your mechanism’s broader implications.
