  First, I need to recall the luminosity argument. It involves a gradual transition (like getting cold) with indistinguishable neighboring states. If a condition is luminous, you should know when you're in it. But since neighboring states are similar, knowing rules out nearby error. This leads to a contradiction: you'd know you're cold even when you're not. The conclusion is that no interesting condition is luminous.

