prompt: |-
  I work as a registrar in a mid-sized municipal museum, and on Wednesday evenings I play second cello in an amateur orchestra. Between those two lives I keep running into practices that seem to assume wildly different things about what a work of art is, and I would like help getting the assumptions out into the open rather than being told that this is all just market convention with no intellectual content. Start with my museum. Our treatment of an exposed forgery is total: a canvas produced ninety years ago by a skilled copyist working in the manner of a Dutch seventeenth-century master, and indistinguishable from the genuine article by every test we can apply — pigment chemistry, canvas weave, craquelure, and above all the naked eye of the visitor standing in the gallery — is not merely repriced when the attribution collapses. It comes off the wall, goes into a crate, and can thereafter only ever be exhibited as evidence of a deception, in a show about forgery. Nobody claims it has become worse to look at. At the same time we display posthumous bronze casts, made from the artist's own mould decades after the death, provided the estate authorized the edition and the number falls inside the declared limit; the identical object cast one time too many is a fake. And we label plaster casts of lost Greek bronzes as Roman copies and hang them in the main galleries, where a modern copy of the same statue would be a scandal. The operative property does not look like appearance, and it does not look like physical continuity with the artist's hand either, but something documentary.

  Now the orchestra side. Nobody in my musical life thinks a performance can be a forgery. A period-instrument ensemble will commission brand-new copies of Baroque instruments from living makers, and critics will praise the resulting recording as more authentic than one made on modern instruments; a cellist playing a factory-made instrument from last decade is still, uncontroversially, playing Bach. Yet the physical instruments themselves command absurd sums: a fine cello by a living maker costs a small fraction of what an old Italian one costs, even though blind trials going back more than a century have repeatedly failed to establish that experienced players or listeners can reliably tell the two apart, and even though hardly any old instrument survives unaltered — necks reset, internal parts replaced, varnish retouched, geometry altered to suit modern pitch standards and modern halls. Within a single art form we treat the sound as freely reproducible and authenticable by ear, and the object as bearing a value that perception cannot detect.

  So I would like a reconstruction of the theory of the artwork, and of value, that each of these practices presupposes. Does our treatment of the forgery presuppose that the work just is a particular historical object, such that a causal-historical property rather than any perceptible one carries the aesthetic weight — or something narrower, such as that the painting functions as testimony about what a person actually did, or that the market requires assets that are not interchangeable? Note that we do not destroy or exile the forgery for being bad; we exile it for being a lie, and I cannot tell whether that is an epistemic norm about an institution's truthfulness or an aesthetic one in disguise. Then: can any single theory simultaneously cover the authorized posthumous cast, where the paperwork seems to do the entire work, and the exposed forgery, where equally impeccable-looking paperwork fails to do it? Please distinguish carefully what these practices strictly presuppose from what they merely sit comfortably with, and tell me where the practice is philosophically underdetermined — where a causal-historical account, an account in terms of the artist's achievement and effort, a scarcity-and-asset account, and an account on which the art world's own conferral of status does the work would all license exactly the same behaviour in the galleries. Finally, tell me whether the museum and the concert hall can be governed by one account or genuinely require a disunified one, and what would concretely have to change — wall labels, acquisition and deaccession policy, insurance valuations, restoration practice, the pricing of instruments — if we replaced the presupposed view with the claim that a work's value is entirely a function of its perceptible properties.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They work as a museum registrar and play cello in an amateur orchestra, noticing conflicting practices in how artworks and musical instruments are valued. The museum treats forgeries as worthless despite identical appearance, while posthumous casts are accepted with proper documentation. In music, new instrument copies are valued for sound, but old instruments command high prices regardless of sound quality. 

  First, I need to identify the core philosophical questions. The user wants to understand the underlying theories of art and value in each context. They mention causal-historical properties, documentation, and perceptible qualities. The key is to distinguish between what's presupposed versus what's compatible with the practices.

  Looking at the museum examples: the forgery is rejected not for its looks but because it's a lie. This suggests authenticity is tied to provenance and intentional creation by the artist. The posthumous cast is accepted because the artist authorized the molds, implying the artist's sanction matters. The Roman copy is valued as a historical artifact, while a modern copy isn't. Here, the work's origin and historical context seem crucial.

  For music, new instruments are praised for authentic sound, but old instruments have high market value despite changes. Sound is reproducible, but the physical object's history adds non-perceptible value. This seems like a split between the performance (sound) and the instrument (artifact).

  The user is also asking if a unified theory can cover both fields. The museum emphasizes historical provenance, while music separates the artwork (the composition) from the instrument (the tool). The artwork in music is the composition, not the instrument, whereas in visual art, the physical object is often the work itself. That's a key difference.

  They want to know what changes if value is based solely on perceptible properties. For museums, forgeries would stay on display, posthumous casts might not need authorization, and copies could be exhibited. Instrument prices would drop, focusing on sound quality. But this ignores the institution's role in assigning value through provenance and history.

  The user might be seeking validation that these practices aren't arbitrary but stem from deeper philosophical principles. They might also want to reconcile their dual roles by understanding each domain's logic. Highlighting the institutional role and the distinction between work and object in music versus visual art could address their need for coherence without forcing a unified theory.
answer: |-
  Your observations pinpoint profound philosophical tensions within our cultural institutions. Let's reconstruct the implicit theories of the artwork and value in each domain, distinguish presuppositions from compatible alternatives, and test for unification:

  **I. Museum Practice: The Causal-Historical & Institutional Theory**
  *   **Core Presupposition:** The artwork is fundamentally a *testimonial object* – its primary value lies in being an authentic trace of a specific human intention and historical moment. It serves as evidence of artistic agency within an art-historical narrative.
  *   **Key Elements:**
      *   **Anti-Perceptualism:** Aesthetic properties are *not* solely inherent in the perceptible object. Identical appearance is insufficient for identical status.
      *   **Causal-Historical Origin:** The object's genesis is paramount. It must be created *by the artist* (or under their direct sanction/supervision) *at a specific time*. The forged canvas fails because its origin is misattributed; the posthumous cast succeeds because it originates from the artist's *intention* (via the mold and estate authorization); the Roman copy is valued as an artifact of *its own time* reflecting the reception of the lost Greek work.
      *   **Institutional Sanction & Documentation:** The "paperwork" (provenance, authorization) isn't just proof; it *constitutes* authenticity within the institutional framework. The artist's sanction (via the estate) transforms the later cast from a fake into a legitimate artwork. The forgery's "lie" is a failure of institutional trust.
      *   **Work as Unique Historical Event:** The painting is not just an image, but the *very object* that resulted from Rembrandt's specific actions. Copies lack this singular historical connection.
      *   **Value Basis:** Intrinsic value is tied to authenticity-as-testimony; market value is heavily influenced by scarcity, provenance, and institutional validation. Removing the forgery isn't about *aesthetic* failure but upholding institutional *integrity* and the *meaningfulness* of the collection as historical record.

  **II. Orchestra Practice: The Dualistic Theory (Work vs. Object/Performance)**
  *   **Core Presupposition:** Music fundamentally involves a distinction between the *abstract work* (the composition) and its *concrete instantiations* (performances, instruments).
  *   **Key Elements:**
      *   **Work as Abstract Entity:** Bach's Cello Suite No. 1 is an immutable structure, existing independently of any specific performance or instrument. Authenticity (of the work) is achieved through faithful *performance* according to the score and stylistic practice, not the physical origin of the instrument.
      *   **Instrument as Tool/Artifact:** The cello is primarily a *means* to realize the work. Its sound-producing capabilities are functionally reproducible (hence new copies are welcome for "authentic" *sound*). However, the *object itself* can also be valued as a historical artifact or craft object.
      *   **Divergent Value Streams:**
          *   *Work Authenticity:* Achieved through performance practice, not instrument provenance. A modern cello *can* play Bach authentically.
          *   *Instrument Value:* Driven by scarcity, historical significance (connection to maker/period/player), perceived craft quality (often conflated with age/myth), and investment potential. This value persists despite modifications because the *artifact's* history is valued independently of its current sound or functional purity.
      *   **Perception's Role:** Perception *can* authenticate the *performance* of the work (does it sound like Bach?) but is deemed inadequate (or irrelevant) for authenticating the full historical/craft value of the *instrument-as-artifact*. Blind tests challenge the sonic myth but don't dismantle the market valuing the artifact's history.

  **Reconciling Museum Contradictions?**
  *   **Presupposed:** A unified causal-historical/institutional view *does* cover both the posthumous cast and the forgery. The cast is legitimate because its creation is causally traceable to the artist's *sanctioned intention* (via the mold and authorized edition). The forgery fails because it originates in *deceptive intention*, regardless of paperwork quality. The paperwork's success/failure reflects whether it accurately represents the required causal-intentional history. The Roman copy is valued for *its own* authentic ancient origin and historical testimony, not as a deceptive substitute for the Greek original.
  *   **Underdetermined:** While the institutional/causal view fits best, alternative views *could* be stretched to fit *some* behaviors:
      *   **Artist's Achievement/Effort:** The original artist conceived and created the mold (achievement), justifying later casts. The forger's effort is misdirected. (But struggles with the Roman copy's value, as the Roman sculptor's effort wasn't directed by the original Greek artist).
      *   **Scarcity/Asset:** The limited edition creates artificial scarcity, enhancing value. The forgery undermines this scarcity. (But doesn't explain why the Roman copy is valued while a modern copy isn't – scarcity alone doesn't suffice).
      *   **Institutional Conferral:** The museum *could* theoretically confer "artwork" status on the forgery for a forgery show, or on a modern copy. But current practice presupposes the status is *discovered* (based on history), not *conferred* arbitrarily. Conferral might explain *shifting* valuations (e.g., once-accepted attributions falling), but the core presupposition is that institutions *track* an external historical fact.

  **Can One Theory Cover Museum and Orchestra?**
  *   **No genuine unification under current practices.** The fundamental categories differ:
      *   **Museum:** Treats the *physical object itself* as the primary locus of the artwork and its value (as testimonial trace).
      *   **Orchestra:** Separates the *abstract work* (completely separable from any physical instantiation) from the *performance* (ephemeral, judged perceptually) and the *instrument* (a physical object valued as artifact/tool, distinct from the work it helps produce).
  *   **The Disconnect:** The museum cares intensely about the *object's history as constitutive of the work*. The orchestra cares about the *work's structure* and the *performance's authenticity*, treating the instrument's history as a separate (often market-driven) value stream attached to the tool, not the musical work itself.

  **Concrete Changes Under a Perceptual-Only Value Theory:**
  If *only* perceptible properties mattered ("If it looks/sounds the same, it *is* the same and equally valuable"):

  1.  **Museum:**
      *   **Forgery:** Stays on the wall with a corrected label. Value adjusts based on aesthetic merit, not provenance.
      *   **Posthumous Casts:** No need for authorization or limited editions. Any cast from the mold is equally legitimate. Value based solely on appearance.
      *   **Copies:** Modern copies of lost works (or even existing ones) are welcomed into main galleries if perceptually indistinguishable or aesthetically meritorious. "Roman Copy" label loses significance beyond dating.
      *   **Acquisitions/Deaccessioning:** Focus shifts entirely to aesthetic quality and condition. Provenance irrelevant. Forgery scandals become mere curatorial errors, not crises of integrity.
      *   **Wall Labels:** Detail style, technique, visual impact. Provenance and attribution become minor footnotes, if included at all.
      *   **Insurance/Restoration:** Value based on replacement cost of a perceptually identical object (e.g., cost of a skilled copyist), not unique historical significance. Restoration aims purely for visual coherence, not material authenticity.
      *   **Pricing:** Market collapses for "name" artists; value concentrates on observable beauty/skill. Scarcity only matters if it affects perception.

  2.  **Concert Hall/Orchestra:**
      *   **Instruments:** Old Italian instruments plummet in value. Price reflects only sound quality, playability, and *perceptible* craft quality of the *current* object. Blind listening tests become the sole arbiter of instrument quality. Historical ownership irrelevant.
      *   **Performance Practice:** "Authenticity" is judged purely on the sound produced against the score. Period instruments are only used if they demonstrably produce a *perceptibly* superior (or desired) sound vs. modern ones, not for historical fidelity *per se*.
      *   **Criticism:** Focuses exclusively on the sonic result. Praise for "authenticity" disappears unless it directly translates to a perceptibly different/better sound.
      *   **Instrument Market:** Becomes like high-end modern luthiery. Value is tied to measurable/perceivable acoustic performance and craftsmanship of new instruments.

  **Conclusion:** Your museum operates on a **Causal-Historical/Testimonial Model** of the artwork, where authenticity is an external historical fact tracked by the institution. Your orchestra relies on a **Dualistic Model**, separating the abstract musical work (authenticated by performance) from the physical instrument (valued as a distinct historical/craft artifact). A purely perceptual theory would revolutionize both institutions, dismantling core concepts of authenticity, provenance, and historical testimony that currently define their practices and values. The tension arises because visual art institutions bind the work tightly to the unique historical object, while music institutions separate the work from its material means of production.
