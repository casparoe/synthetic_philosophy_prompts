prompt: |-
  Ok so here's the situation. I'm helping run a review process for interpretability writeups — people submit work with claims like "the model's internal representation of the user's nationality is what caused the refusal," and my reviewers have no shared standard for when a claim like that is literally true, when it's a convenient story that happens to predict well, and when it's just flat-out wrong. Hofstadter's careenium is our problem wearing a costume: a table full of little magnetic balls (symms) that clump and unclump into bigger formations (simmballs) which track things outside the table, where the balls' physics fully determines every collision, and yet from the zoomed-out view it looks for all the world like the simmballs are shoving each other around. Who shoves whom.

  Before I read any more about downward causation, I want the spec. Write the desiderata: what any adequate account of "the symbol level is doing genuine causal work, not just bookkeeping" has to deliver. For each one I want the requirement, the concrete careenium-style case or consideration behind it, and your verdict on whether it's non-negotiable or just a prejudice of one camp.

  Things I'd expect somewhere on the list (add your own, and tell me which of mine are bogus):

  1. It has to be compatible with the fact that a complete symm-level history plus the table's laws fixes every outcome — so no fifth shove from nowhere, and no routine overdetermination where both levels independently cause the same collision.
  2. It has to explain why the zoomed-out level is so much easier to predict from, without letting "it's more compressible" carry all the weight. I can invent a description that's compressible and obviously non-causal — say, "whatever clump of symms is currently in the left third of the table = the concept of my Aunt Edna." So there needs to be a principled constraint on which high-level vocabularies earn the right to be taken causally, and I want to know whether you can state it without circularity.
  3. It has to survive the puppet case. Suppose something outside shakes the table so the symms go through exactly the motions the simmball story predicts, without any of those clumps being the ones doing the work. What does your account say? And then a version where the shaking happens for one simmball on one occasion only — does the theory get single events right, or can it only ever talk about types?
  4. It has to handle misrepresentation: a simmball that's about the cat outside gets set off by a picture of a dog. What did it cause, and under which description?
  5. It should say whether it's the content of the symbol that has causal power or only its causal-dispositional role — and if only the role, what work is left for aboutness to do.
  6. It should be portable: the same simmball realized in a real careenium and in a spreadsheet of simulated symms should have the same causal powers, or the account should say why not.
  7. It should tell me why thermostats and hurricanes don't have symbols shoving anything around, or bite the bullet and say they do. I need to know where the line is and whether its a difference in kind or of degree.

  Then my own candidate criterion, which I'll call the shuffle test: if you can swap the low-level realization of a simmball for a different arangement that instantiates the same symbol, holding everything else fixed, and the downstream behavior comes out the same, then the symbol was doing the shoving. Tell me straight whether this is even coherent — can you hold everything else fixed while changing the substrate? — whether it proves too much, and whether it belongs on the list above or in the bin.

  The part I most want: which subset of these desiderata, if any, is jointly unsatisfiable. My suspicion is that no-overdetermination plus "the high level really makes a difference to what happens" plus "the high-level description must be a non-arbitrary feature of the system" can't all be had at once, but I can't pin down which one goes or actually prove it. If you think some pair has to be traded off, say which and give me the argument, not just the intuition. Also tell me which single requirement knocks out the most candidate accounts, because that's the one I want to lead with in the reviewer guidelines.

  Last thing, and keep it short: how three kinds of answer do against the list — the hard-line "it's all just symms bouncing, the rest is talk" view; the view that causal claims are level-relative so both stories are literally true at once; and the view that symbol-level causation is a useful fiction not worth making metaphysically respectable. Two or three sentences each, no scorecard table. No bibliography, no citations, no names-and-dates — I want the reasoning, and I want it tight enough to hand to reviewers. American English, please.
reasoning: |-
  Okay, the user is grappling with a deep philosophical problem in AI interpretability—how to judge when high-level symbolic explanations (like "the model's representation of nationality caused the refusal") are genuinely causal versus just convenient stories. They've framed it using Hofstadter's careenium analogy and listed seven desiderata for evaluating causal claims at the symbol level. 

  Hmm, this is a meaty challenge. The user clearly understands the core tension: physical determinism vs. emergent causality. Their careenium setup is brilliant—it perfectly isolates the problem of downward causation. I notice they're skeptical about compressibility as a sufficient criterion (desideratum 2) and worried about circularity in defining "genuine" causality. Their shuffle test proposal shows they've thought hard about multiple realizability as a litmus test. 

  The real pain point seems to be desideratum conflicts. They suspect no-overdetermination + high-level difference-making + non-arbitrariness can't coexist—and they're probably right. That triple tension is the heart of the metaphysical dilemma. When they ask which requirement knocks out most theories, I immediately think of desideratum 1 (no overdetermination). It's the brick wall that kills emergent dualism and forces all accounts to be compatibilist. 

  For the three views: 
  The hard-line physicalist view (only symms matter) gets wrecked by desiderata 2, 4, and 7—it can't explain predictive power or misrepresentation, and absurdly denies thermostat causality. The level-relativity view handles 1 and 6 well but stumbles on 3 (puppet problem) and 5 (aboutness). The fictionalist view dodges metaphysics but fails desideratum 4 (misrepresentation requires real causal chains) and would frustrate reviewers seeking truth. 

  The shuffle test... clever but flawed. Holding everything fixed while swapping substrates is impossible in physical systems—it's either magical or trivial. Still, it gestures legitimately at multiple realizability (desideratum 6). Might be salvageable as a thought experiment if we allow "near enough" realizations. 

  User's clearly sharp—they've anticipated objections (e.g., thermostat counterexample) and want portable criteria for reviewers. No fluff wanted. Should emphasize that desideratum 1 is non-negotiable and that 3 (puppet test) is the best probe for whether a theory takes symbols seriously.
answer: |-
  Here's the distilled desiderata for "symbol-level causation" in your careenium-style interpretability review, with concrete cases, negotiability status, and analysis of conflicts/tradeoffs:

  **Core Desiderata (Non-Negotiable):**
  1.  **Microphysical Closure:** Complete symm-level state + laws fixes all outcomes. No extra shoves.  
      *Case:* Any careenium simulation; rewinding to identical symm state must replay identically.  
      *Status:* Non-negotiable. Violating physics breaks science.

  2.  **Non-Arbitrariness:** High-level vocabulary must be structurally privileged, not just compressible.  
      *Case:* "Aunt Edna = left-third clump" is arbitrary; "Simmball A" defined by stable cohesion dynamics isn't.  
      *Status:* Non-negotiable for *genuine* causation. Compressibility alone allows fake "causes."

  3.  **Puppet Test Resilience:** Theory must distinguish *autonomous* symbol-causation from external puppeteering.  
      *Case:* External force shakes table to *mimic* simmball interactions. Account must say why simmballs weren’t causal *in that run*.  
      *Status:* Non-negotiable. Fails puppet? Then it’s epiphenomenal.

  **Critical Functional Desiderata (Strongly Preferred):**
  4.  **Misrepresentation Handling:** Symbols can cause effects *under false content descriptions*.  
      *Case:* "Cat" simmball activated by dog picture, causing "hiss" output. Causal chain must trace through the *symbolic state* (e.g., "cat-representation active"), not just physical form.  
      *Status:* Near-non-negotiable. Without this, "aboutness" is decorative.

  5.  **Portability (Multiple Realizability):** Same symbol, different substrate → same causal powers.  
      *Case:* Simmball implemented in physical careenium vs. identical-behavior software simulation. Symbolic effects should match.  
      *Status:* Strongly preferred. Fails? Then causation is substrate-bound, not symbolic.

  **Demarcation Challenge:**
  6.  **Non-Triviality (Thermostat/Hurricane Line):** Must exclude trivial "causal" high-level descriptions.  
      *Case:* Why is a thermostat’s "setpoint" *not* a causal symbol, but a simmball is? Difference in degree (complexity, feedback loops) or kind (intentionality)?  
      *Status:* Essential for usefulness. Account *must* draw a line or justify bullet-biting.

  **Content vs. Role (Theoretical Crux):**
  7.  **Content/Role Distinction:** Does *what the symbol means* (content) cause effects, or *only* its dispositional role?  
      *Case:* Does "nationality-representation" cause refusal *because it’s about nationality*, or just due to its wiring?  
      *Status:* Defines theoretical camps. Any account must take a clear stance.

  **Your Shuffle Test:**  
  *Can you swap substrate holding symbol fixed & get same downstream?*  
  * Coherent? **Only counterfactually** (e.g., "if it were realized differently, would effect Y still occur?"). Physically "holding everything fixed" is impossible.  
  * Proves too much? **Yes** if applied naively – thermostats might pass. Needs combo with **Non-Arbitrariness** & **Non-Triviality**.  
  * Belongs? **Yes**, as operational check for **Portability** and *counterfactual robustness of the symbol role*.  

  **Key Conflict & Tradeoffs:**  
  - **The Impossible Triad:** `Microphysical Closure` + `Non-Arbitrariness` + `Downward Causation (symbols make a *difference*)` **is unsatisfiable** if "difference" requires *extra physical force*.  
    - *Tradeoff:* You **must** define "difference-making" *counterfactually* (e.g., "if symbol S were different, outcome O changes *via microphysical changes*") to satisfy Closure + Non-Arbitrariness. Reject substance-dualism.  
  - **Knockout Requirement:** The **Puppet Test (#3)** is the killer. It forces accounts to show symbols aren’t just along for the ride. Most hand-wavy "emergent causation" fails here.

  **Three Views vs. Desiderata:**  
  1.  **Hard-line "Just Symms":**  
      *Fails:* Puppet Test (can't distinguish puppeteered vs. autonomous), Misrepresentation (no "false content" to cause anything), Non-Triviality (thermostats *are* causal symbols by its lights). *Dies on:* Needing a *privileged* high-level story.  

  2.  **Level-Relative Causation (Both True):**  
      *Fails:* Puppet Test (claims puppet-shaking *is* "simmball causation" at high level), potentially Non-Arbitrariness (if all levels are "true", "Aunt Edna" clumps count). *Struggles with:* How high-level causes *constrain* lower-level without overdetermination.  

  3.  **Useful Fiction:**  
      *Fails:* Puppet Test (fiction works regardless), Misrepresentation (fictions aren't *wrong*), Portability (fictions needn't be substrate-independent). *Succeeds only* at avoiding metaphysics. Useless for truth-claims.  

  **Lead with the Puppet Test in guidelines.** If a reviewer can't explain why a maliciously puppeteered model (externally forced to produce "symbol-like" behavior) *isn’t* demonstrating genuine symbolic causation, their standard is broken. It forces engagement with autonomy and counterfactual robustness.
