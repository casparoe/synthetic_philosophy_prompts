prompt: |-
  For thirty-eight years I worked as a physical chemist, chiefly on molecular spectroscopy and the theory of line shapes, and since retiring I have taken up philosophy in earnest as a part-time postgraduate. The convenor of a second-year course here, taught jointly between the physics and philosophy departments, has asked me to act as preliminary reader for this year's essay scripts, on the reasoning that I can be trusted with the physics and have no stake in the modish end of the subject. The convenor retains the final mark. I have not marked the script reproduced below and have formed no view of its merits; I should prefer that your assessment stand entirely on its own rather than being nudged by anything I say about it.

  The question set was this:

  *Bohmian mechanics and Everett's "relative state" formulation are both advertised as no-collapse theories that reproduce the predictions of ordinary quantum mechanics. Explain what each takes the quantum state to be, and explain how each accounts for the fact that a measurement yields a single, definite outcome. In your final section, say whether decoherence plays the same explanatory role in the two theories, and why.*

  The word limit was 1,000. The student's script reads:

  *Both theories refuse to add a collapse postulate to quantum mechanics, and to that extent they agree about what is wrong with the textbook presentation: the quantum state always obeys the Schrödinger equation, for a laboratory apparatus exactly as for a single electron. What separates them is what, if anything, there is besides that state.*

  *Bohm's theory takes the quantum state to be a real physical field, defined not on ordinary space but on the 3N-dimensional configuration space of the system, and it supplements the state with the actual positions of the particles, which the state steers by way of the guidance equation. These positions are the "hidden variables" of the older literature. They matter because they supply at a stroke what Everett must labour for. A measurement is an interaction that correlates the position of a pointer with the state of the system measured; and since the pointer's constituent particles have determinate positions at all times, the pointer reads one thing rather than two. Its wave function may contain terms corresponding to other readings, but those terms contain none of the actual particles. As the terms separate in configuration space they cease to overlap, so the empty ones can no longer affect the motion of the particles at all. The outcome is an effective collapse: nothing has been projected, yet for every subsequent purpose the state behaves as if it had been. Bohm also recovers the Born rule by supposing that the initial configurations of an ensemble are distributed as |ψ|², a distribution the dynamics preserves.*

  *Everett's theory has nothing but the state. The apparatus and the observer are quantum systems like any others, so a measurement entangles them with what is measured, and each term of the resulting superposition contains an observer holding a definite record of a definite outcome — Everett's relative states. Decoherence, in the form developed by Zeh and Zurek, is what makes this respectable rather than merely formal: interaction with the environment destroys the other branches, suppressing the interference between them so that each branch thereafter evolves on its own and appears, from within, to be an ordinary classical world in which one thing happened. Everett is thus a no-collapse interpretation in name only. The state is not projected by hand, but it is projected in effect, continuously, by the environment.*

  *It follows that decoherence does the same work in both theories: it is what licenses the appearance of a single outcome, and hence what makes the collapse postulate dispensable.*

  *Two consequences are worth stating. First, because the guidance equation makes the velocity of each particle depend at once on the positions of all the others, Bohm's theory permits signals to be sent faster than light; this is not a formal embarrassment but an observable difference from ordinary quantum mechanics, and it is a further reason to prefer Everett. Second, because both theories reproduce every prediction of ordinary quantum mechanics, neither can be tested against it, so the choice between them belongs to metaphysical taste rather than to experiment.*

  What I need back is a mark out of 100 on the university scale (40 to pass, 70 for a first) together with the comments I shall forward to the convenor, so that the mark is defensible clause by clause. Please work through the script claim by claim: distinguish what it gets right from what it gets wrong, and for each error say not only that it is an error but what the correct account is and why the difference matters to the argument the student is building. Say also whether the script discharges every part of the question, the last part in particular. Since I can check the physics but am new to the philosophical literature, it would help if the comments distinguished errors of physical fact from errors of conceptual or interpretive substance. Two further requests. Be committed: give one mark rather than a range, and state plainly which claims are false rather than allowing that they are "somewhat loose" or "open to debate"; where the specialist literature genuinely divides over something the student touches, say that it divides, say which way you think, and say whether the mark should reward the student for taking a side. And keep the whole thing, comments included, to 500 words, in British English.
