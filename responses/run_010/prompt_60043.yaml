  We are going to create a scenario in a professional setting: an audit team at a financial firm. The two auditors, Alice and Bob, are assessing the likelihood that a particular transaction is fraudulent. They share a common prior about the base rate of fraud in such transactions, based on their training and historical data. They both run the same model that outputs a probability of fraud given evidence.

  The firm has a policy where each auditor independently reviews a subset of the evidence. Alice gets a private signal (a report from an external source) that is highly indicative of fraud, while Bob gets a private signal (a different report) that is indicative of no fraud. They then input their evidence into the same model, which updates the prior and outputs a posterior probability of fraud. The model is deterministic: same inputs yield same output.

  The firm uses an internal messaging system for auditors to share their estimates. However, this system has a known quirk: when an auditor sends their estimate, the system sometimes fails to deliver it without any notification to the sender. The system does, however, show the sender that the message was "sent" (but not necessarily delivered). When an auditor receives a message, they get a notification and can see the estimate. But they cannot tell if a message they sent was actually received.

  The process: 
  1. Alice and Bob each compute their initial posterior based on their private evidence. 
  2. Alice sends her estimate to Bob. Bob sends his estimate to Alice. 
  3. Each receives the other's estimate (or not, but in this scenario, we assume that both messages are delivered, but each auditor is unsure whether their own message was delivered because the system doesn't confirm delivery to the sender).

  After this exchange, each updates their belief by incorporating two things: 
    - The other's estimate (which is evidence about the other's private signal, since the model is deterministic and common) 
    - And the fact that they did (or did not) receive a message. But note: in this case, both receive the other's estimate, but they don't know if the other received theirs.

  The key is that when Alice sees Bob's estimate, she learns what Bob saw (because she can reverse-engineer his private signal from the estimate, given the common model and prior) but she doesn't know if Bob has seen her estimate. Similarly for Bob.

  Because they don't know if the other has received their message, they cannot rule out the possibility that the other is still operating without having seen their estimate. Therefore, their beliefs do not become common knowledge and they may continue to disagree.

  Now, let's formalize.

  1. **State space and information partitions:**

  We need to model the state of the world, which includes:
     - The actual nature of the transaction (fraud or not) - but note that the disagreement is about the probability, not the actual outcome. However, the state must include the private signals because they are the source of the disagreement.

  The state space has two components:
     - The private signal each auditor receives. Let the signal for Alice be A and for Bob be B. We assume these signals are independent given the true state (fraud or not). But actually, for simplicity, we can model the state as the pair (A, B) and the true state of fraud is a function of these signals? Alternatively, we can have the state include the fraud status and the signals, but that might be too complex.

