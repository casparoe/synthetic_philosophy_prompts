  So probability of all heads is about 0.047%, so probability of ruin is 1 - 0.00047 = 99.953%, almost certain ruin.

  And expected value is high only because of the tiny probability of winning all 15 bets, which gives a huge payout, 2^15 * X = 32768 * X, while all other paths give zero. So E[wealth] = (0.6)^15 * 32768 * X + 0 * other = 0.00047 * 32768 * X ≈ 15.41 * X, roughly.

  (0.6)^15 ≈ 4.7e-4, 2^15=32768, so E[wealth] = 4.7e-4 * 32768 * X ≈ 15.41 * X, yes.

  But as Sam says, this high expectation comes only from paths that almost never happen, and you're ruined with very high probability.

  Dana's point (4): Dana says Sam is just swapping the goal from average wealth to typical wealth and calling it a refutation. And that Kelly only wins if the game goes on forever, but for a short-term goal like turning $200 into $1000 in 15 weeks, betting more might be rational.

