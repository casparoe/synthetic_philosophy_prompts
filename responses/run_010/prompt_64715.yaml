  We are designing an interactive classroom activity to teach the axiom of choice (AC) to a mixed group of philosophy and math majors. The goal is to have the students experience the difference between:
    (a) knowing that each set in a collection is non-empty (so for each set, there exists an element) and 
    (b) having a single, uniform way to pick an element from every set in the collection (a choice function).

   We want to avoid a lecture and instead have the students work through physical activities that illustrate the problem. The activity will be structured in phases:

   Phase 1: Finite selection (effortless, no problem)
   Phase 2: Infinite selection with structure (like boots: left/right distinction) vs. without structure (like socks: identical)
   Phase 3: Challenge: commit to a written procedure for a mechanical chooser to execute, and discover that for some families they cannot write one down.
   Phase 4: Introduce an "oracle" that can provide selections without a procedure, and have the class debate whether to accept it.

   We have index cards, envelopes, a whiteboard, and 100 minutes.

   The key distinctions to emphasize:
    1. Having an element for each set separately vs. having a single rule that works for all sets at once.
    2. The difference between being unable to describe a selection and there being no selection at all (which is a subtle point).

   We also want to preempt common misconceptions:
    - The team that proposes choosing at random.
    - The claim that the problem only occurs for uncountable collections (it can occur for countable ones too).
    - The philosopher who might reject AC because of Banach-Tarski.

