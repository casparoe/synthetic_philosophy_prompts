  *scratches head* What's sneaky here is how (5) equivocates between two senses of "branch". In decoherence literature, "branch" specifically means a component in the decohered basis with negligible interference. But for coin flips, "it rains tomorrow" isn't a quantum branch - it's a coarse-grained description of a macrostate that supervenes on zillions of micro-branches. 

  The user's worry about "quietly reinstalling weighting" is spot on. Any solution must avoid that. I think the key is that while branches can be recursively subdivided, the Born rule weights are invariant under that subdivision - they're like a measure that stays constant when you partition a set. The Everettian isn't counting branches but tracking the amplitude-squared measure over the fine-grained history space.

