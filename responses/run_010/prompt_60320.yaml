  *checks notes* The cost of rejecting (1) is minor - it was always a misleading intuition pump. The real work is showing how pre-measurement uncertainty in MWI isn't self-locating at all, but stems from indexical ignorance about which branch-tip you're at in the multiverse tree. And that ignorance is quantified by the Born measure.

