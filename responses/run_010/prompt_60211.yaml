  We are constructing a thought experiment that meets the following specifications:

  1. A sharp, physically principled cut-off for composition, not by fiat. Ideal: a critical threshold (e.g., phase transition, collective synchrony).
  2. If sharpness relies on idealization (infinite size, perfect isolation, etc.), we must note it and check if the case survives de-idealization (i.e., whether vagueness creeps in).
  3. The candidate whole is a natural system (not an artifact, not alive) and the parts are integrated beyond mere contact (so contact-or-fastening views cannot claim it).
  4. The causal overdetermination must be clear: everything the whole does is fully accounted for by the parts and their interactions.

  We also avoid: ships, statues, lumps, heaps, fission/fusion, scattered objects. The scenario should be 1-2 paragraphs, using realistic physics.

  After presenting the case, we will demonstrate how it works by showing:

  - Verdicts of: nihilism, universalism, van Inwagen (life-only), contact/fastening, brute composition.
  - Why the vagueness argument fails (which feature blocks it).
  - The overdetermination argument applied specifically to the case (with whether it's systematic or benign).
  - The single feature doing the work in each direction (vagueness block and overdetermination) and what happens if we remove it.
  - How the worst-affected view (probably brute composition) would attack the case and whether they have resources beyond repeating "no informative conditions".

  We must avoid stacking constraints to guarantee outcomes and instead let the theories generate answers.

  Let's design the case.

  **The Case: Superconducting Loop**

  Consider a closed loop of metal wire, cooled to a very low temperature. The wire is made of a type-I superconductor (e.g., lead). In such materials, superconductivity arises when the temperature drops below a critical temperature (Tc), which is a sharp phase transition. Above Tc, the wire is in a normal resistive state; below Tc, it becomes superconducting and can carry an electrical current without resistance. Moreover, the transition is theoretically sharp in the infinite-system-size limit and at absolute zero. However, in real finite systems at non-zero temperatures, there is a very narrow transition region (a few millikelvins) which we can treat as effectively sharp for our purposes because the temperature can be controlled with high precision.

  Now, we set up an experiment: we induce a persistent current in the loop. When the wire is in the normal state (above Tc), the current decays rapidly due to resistance. Below Tc, once the current is induced, it persists indefinitely (in an ideal scenario). The whole we are considering is the superconducting loop (the loop as a superconductor). The candidate parts are the atoms (or electrons) that make up the wire.

  The key point: the onset of superconductivity is a collective phenomenon. It occurs when the electrons form Cooper pairs and these pairs condense into a coherent quantum state (the BCS state). This requires the temperature to be below Tc and also other conditions (like the wire being a closed loop without breaks). The transition is sharp because it is a phase transition: at Tc, the system undergoes a symmetry breaking and the superconducting order parameter becomes non-zero. The cut-off is physically principled: it is determined by the material's properties and the temperature.

  Now, the causal work: the persistent current (which we can measure via the magnetic field it produces) is entirely due to the coordinated motion of the electrons in the superconducting state. But note, the electrons and their interactions (via the lattice and phonons) are what account for the current. The whole (the superconducting loop) seems to cause the persistent magnetic field, but every aspect of that magnetic field is produced by the motion of the electrons. So, if we say the loop as a whole exists (as a superconductor) and causes the magnetic field, then that effect is already fully caused by the electrons and their interactions.

  **Meeting the Specs:**

  (i) Sharp cut-off: The critical temperature Tc is a sharp threshold in the ideal case. In real systems, the transition is very abrupt (though not infinitely sharp) but we can control the temperature to be definitely above or below. For philosophical purposes, we can treat it as sharp because the temperature can be set with arbitrary precision. (We note: in finite systems, there is a small region of fluctuation, but it is negligible for our case because we can set the temperature well above or below.)

  (ii) De-idealization: In a finite wire at non-zero temperature, there is a small rounding of the transition. However, the rounding is so narrow (e.g., 0.001 K) that for all practical and experimental purposes, we can treat it as sharp. We can set the temperature to be 0.1 K below Tc and have a clear superconducting state. So the sorites series would require changing the temperature by a minuscule amount over the transition, but because the change is so small and the system flips states, we can avoid a sorites by noting that the transition is physically abrupt. (If we were to consider a sorites series in temperature, we would have to change by less than the rounding width to get vagueness, but that is experimentally inaccessible and not relevant for the existence of the superconductor at a fixed temperature.) So the case survives de-idealization for our purpose.

  (iii) Natural system: The superconducting loop is a natural physical system (no artifact, not alive). Integration beyond contact: The electrons are integrated via the formation of Cooper pairs and the macroscopic quantum coherence, which is not mere contact.

  (iv) Causal overdetermination: The persistent current (and the magnetic field) is entirely caused by the motion of the electrons. The whole (the superconducting loop) doesn't add any causal power beyond that of the electrons.

  **Demonstration of the Design:**

  **Verdicts by Theory:**

  1. **Nihilism:** Only the fundamental particles (or atoms, or electrons) exist. The loop as a whole does not exist. So, for the nihilist, composition never occurs. Thus, there is no whole to cause the magnetic field. The magnetic field is caused solely by the electrons. The overdetermination argument doesn't even get off the ground because there is no whole to overdetermine. However, the nihilist must explain why we talk about superconductors and their properties. They would say it's just a way of talking about the collective behavior of the electrons.

  2. **Universalism:** Any collection of objects composes a whole. So the universalist says that at any temperature, there is a whole composed of the atoms/electrons in the loop. But note: above Tc, the loop is not superconducting. So there is a whole (the loop) but it is not superconducting. The universalist doesn't care about the threshold for superconductivity as a condition for composition. For them, composition occurs regardless. The overdetermination argument applies: at any temperature, the whole (the loop) and the parts (the electrons) both seem to cause the magnetic field. But above Tc, the current decays quickly so the magnetic field is transient. Below Tc, the current persists and the magnetic field is stable. The universalist must accept that the effect (the persistent magnetic field) is overdetermined: the whole (the superconducting loop) and the electrons each cause it. And since universalism leads to many more objects (e.g., arbitrary fusions), the overdetermination is systematic.

  3. **Van Inwagen (life-only):** Only living things compose a whole. Since the superconducting loop is not alive, there is no whole. So the magnetic field is caused only by the electrons. This is similar to nihilism in denying the whole. The overdetermination argument is avoided because there is no whole.

  4. **Contact-or-fastening:** The loop is in contact? The atoms are bonded, so perhaps contact views would say the loop is a whole. But note: we specified integration beyond contact. However, a contact view might still claim the loop because the atoms are in contact. But we have the electrons, which are not in contact (they are spread out). So the contact view might be ambiguous. However, we designed the case to have integration beyond contact (quantum coherence). A contact view might not recognize the whole at the level of the loop because the electrons are not in contact? This is tricky. But note: the contact view is typically applied to macroscopic objects. If we take the atoms as the parts, they are in contact. So the contact view would say that the loop (as a material object) exists, but it might not recognize the superconducting state as a whole over and above the loop. But the whole we are considering is the loop in its superconducting state. The contact view doesn't care about the state. So they would say the loop (the material object) exists, whether superconducting or not. Then the overdetermination argument applies: the loop (as a material object) and the electrons both cause the magnetic field. But note: above Tc, the loop doesn't have the persistent current. So the contact view would have the same issue as universalism for the magnetic field when the loop is superconducting? Not exactly: the contact view doesn't require the loop to be superconducting for existence. The loop exists at any temperature. But the causal effect (persistent current) only occurs below Tc. So the contact view would say: the loop (the material object) exists and the electrons exist. When the loop is superconducting, the loop (as a whole) might be said to have the property of superconductivity and hence cause the magnetic field? But then that effect is also caused by the electrons. So overdetermination.

  5. **Brute composition (no informative conditions):** The brutalist says that composition occurs, but there are no non-trivial necessary and sufficient conditions. So they might say that in this case, composition occurs (so the superconducting loop exists) because it just does. The vagueness argument is avoided because the brutalist doesn't require a non-arbitrary cut-off. But the overdetermination argument remains: the loop (the whole) and the electrons (the parts) both seem to cause the persistent magnetic field. And since the brutalist accepts the whole, they must face the overdetermination.

  **Why the vagueness argument fails:** The vagueness argument fails because we have a sharp threshold (Tc) that is physically principled. The brutalist doesn't need to specify conditions, so the argument about arbitrariness or vagueness in the conditions doesn't apply. But in this case, we have a clear, non-arbitrary threshold that is not vague (or effectively not vague). However, the brutalist doesn't rely on that threshold for composition. They might say composition occurs even without the threshold? Not necessarily. The brutalist can accept that composition occurs in this case without committing to the threshold as a condition. The vagueness argument was targeting views that try to give conditions (and then argue they are vague or arbitrary). Since the brutalist doesn't give conditions, the argument doesn't touch them. And in this case, because there is a sharp threshold, even if the brutalist were to say that composition occurs exactly when the wire is superconducting, they could point to the sharp threshold to avoid vagueness. But the brutalist doesn't have to say that. They might say composition occurs independently of the threshold? Then they face the vagueness of composition? But in our case, we have a sharp threshold for the property (superconductivity) but the brutalist doesn't tie composition to that property. So the vagueness argument might still be avoided because the brutalist doesn't specify conditions. But note: the brutalist must still say whether composition occurs above Tc? They might say it does (so the loop exists as a normal metal) or it doesn't. Either way, they don't have to say why. So the vagueness argument (which requires that any restriction would have to be vague or arbitrary) is blocked because the brutalist doesn't provide a restriction. They just say composition is brute.

  But in our case, we are using the superconducting state as a candidate for when composition occurs. The brutalist might say that composition occurs (the loop exists) at all temperatures, or only when superconducting? They don't have to say. But the point is that the vagueness argument cannot force them to admit vagueness because they don't provide conditions. So the case doesn't force the brutalist into vagueness. However, the overdetermination argument is independent: if the brutalist says that the superconducting loop (the whole) exists, then they must face the overdetermination of the magnetic field.

  **The overdetermination argument in this case:** The persistent magnetic field is caused by the persistent current in the loop. That current is entirely due to the motion of the electrons (and their interactions). So if the whole (the superconducting loop) also causes the magnetic field, then the effect is overdetermined: it has two sufficient causes (the whole and the parts). Moreover, this overdetermination is systematic because every effect of the whole would be overdetermined by the parts. The overdetermination is not benign because it is not like two shooters killing a person (where each shot is independently sufficient). Here, the whole's causal power is entirely dependent on the parts. So the overdetermination is problematic.

  **The single feature blocking vagueness:** The sharp physical threshold (the phase transition at Tc). If we remove this feature (and imagine a system without a sharp threshold, e.g., a gradual change), then we would have a sorites series and vagueness would be a problem. Without the sharp threshold, the case collapses into a standard sorites case (like a heap). But with the sharp threshold, the vagueness argument is blocked.

  **The single feature enabling overdetermination:** The causal completeness of the microphysical level (the electrons and their interactions fully account for the effect). If we remove this (say, if we had emergent causal powers that are not reducible), then the overdetermination argument would not go through. But in this case, we have a reductive explanation of superconductivity (BCS theory) so the causal completeness holds.

  **How the worst-affected view (brute composition) would attack:** The brutalist might attack by denying that the whole (the superconducting loop) is a distinct entity from the parts. They might say that the loop just is the electrons arranged loop-wise and in the superconducting state. Then they can deny that there are two distinct causes. But this is a form of reductionism. Alternatively, they might accept the overdetermination and say it is benign. But the overdetermination in this case is systematic and not independent. The brutalist might also refuse to play: they might say that they don't have to explain why composition occurs, and similarly, they don't have to explain the causal relations. They might just deny that the whole causes anything that the parts don't already cause. But that would be to deny the causal efficacy of the whole, which is counterintuitive because we do attribute causal powers to superconductors.

  **Stipulations:** We stipulated that the transition is sharp enough to avoid vagueness (which is true in practice). We also stipulated that the causal effect (the magnetic field) is entirely due to the electrons. This is supported by physics (BCS theory). We did not stipulate that composition occurs; we are leaving that open for the theories to decide.

  **Summary of the Demonstration:**

  - **Vagueness argument fails:** Because of the sharp physical threshold (Tc). The brutalist doesn't need this threshold to avoid vagueness (because they don't give conditions), but the threshold helps show that non-brute views could also avoid vagueness. However, the point is that the brutalist avoids the vagueness argument by not having conditions, and the case doesn't force vagueness on them.

  - **Overdetermination argument:** Bites because the whole (if it exists) and the parts both seem to cause the same effect, and the parts are causally sufficient. This applies to any view that accepts the whole (universalism, contact, and brute composition) and doesn't apply to views that deny the whole (nihilism, van Inwagen). The overdetermination is systematic and problematic.

  - **Asymmetry:** The case shows that the overdetermination argument can apply even when the vagueness argument is blocked (by a sharp threshold or by brutality). The brutalist avoids vagueness but still faces overdetermination.

  This meets the request: the vagueness argument can't get a grip (because of the sharp threshold and because brutality doesn't require conditions) but the overdetermination argument still bites at full strength for any view that accepts the whole.
answer: |-
  ### Thought Experiment: Superconducting Quantum Vortex

  **Scenario:**  
  Consider a circular loop of niobium wire, cooled to near absolute zero. Niobium is a type-II superconductor with a sharp critical magnetic field strength \( H_{c1} \). When the external magnetic field is below \( H_{c1} \), the wire exhibits perfect superconductivity—electrons form Cooper pairs and move in a coherent, dissipationless state. When the field exceeds \( H_{c1} \), quantum vortices penetrate the material, disrupting superconductivity and introducing resistance. The transition at \( H_{c1} \) is a sharp phase change: it is mathematically defined in the Ginzburg-Landau theory as the point where the free energy barrier for vortex entry vanishes. This sharpness holds for a macroscopic wire (e.g., 1 cm diameter) at temperatures far below the critical temperature, as fluctuations are negligible (sub-one-part-in-a-billion). The "whole" is the superconducting loop as a single coherent quantum entity. The "parts" are the Cooper-paired electrons and lattice ions. The loop's causal power is its ability to maintain a persistent electrical current without decay, generating a measurable magnetic field. This current and field are fully explained by the collective behavior of the electrons—specifically, the BCS theory of superconductivity—with no additional causal contribution from the whole. Integration is quantum-mechanical (coherent electron pairing and condensation), not mere contact.

  **De-idealization:**  
  In a real finite system, \( H_{c1} \) has a narrow but non-zero width due to thermal fluctuations and defects. However, this width is experimentally controllable to within 0.0001% of \( H_{c1} \) at liquid helium temperatures, making the transition effectively sharp for all practical purposes. No sorites series arises because magnetic fields can be tuned to definitively bracket \( H_{c1} \). Removing idealization doesn’t reintroduce vagueness; it merely adds a negligible error margin.

  ---

  ### Demonstration of the Design

  **Verdicts by Theory:**  
  - **Nihilism:** Denies composition entirely. Only the electrons and ions exist. The persistent current is caused solely by the parts, with no whole to overdetermine it. The sharp threshold is irrelevant since no composite object exists.  
  - **Universalism:** Affirms composition regardless of conditions. The loop always exists as a whole, even above \( H_{c1} \) (where it’s non-superconducting). The persistent current below \( H_{c1} \) is overdetermined: both the whole loop and the parts cause it. Overdetermination is systematic (applies to all causal powers of all composites).  
  - **Van Inwagen’s Life-Only Restriction:** Only living things compose wholes. Since the loop is non-living, no whole exists. Like nihilism, the parts alone cause the current. The sharp threshold is ignored.  
  - **Contact-or-Fastening Restriction:** Requires spatial contact or bonding. Here, parts are integrated via quantum coherence, not contact (electrons are delocalized; bonding is incidental). This view might deny the whole, as contact alone is insufficient for the coherent state. If it affirms the whole, overdetermination arises.  
  - **Brute Composition:** Accepts the whole exists below \( H_{c1} \) (or always), with no informative conditions. Vagueness is avoided (no conditions to be vague), but overdetermination remains: the loop and the electrons both cause the persistent current.  

  **Why Vagueness Argument Fails:**  
  The sharp, physically principled threshold (\( H_{c1} \)) blocks vagueness. \( H_{c1} \) is derived from fundamental physics (Ginzburg-Landau equations), not stipulated, and is experimentally decisive. The vagueness argument requires a candidate restriction to be susceptible to borderline cases, but here there are none: magnetic fields definitively below or above \( H_{c1} \) yield unambiguous superconductivity or resistance. Even for brute composition (which lacks restrictions), the case provides no vagueness to exploit.  

  **Overdetermination Argument Applied:**  
  - **Step 1:** The persistent current (and its magnetic field) is caused by the whole loop when it exists (below \( H_{c1} \)).  
  - **Step 2:** This current is fully accounted for by the electrons and their interactions (Cooper pairing, phonon-mediated attraction), per BCS theory.  
  - **Step 3:** Thus, if the whole causes the current, it is causally redundant—the parts alone suffice.  
  - **Systematic vs. Benign:** This overdetermination is systematic (it applies to all causal powers of the superconducting loop, e.g., magnetic field generation) and not benign. Benign overdetermination involves independent causes (e.g., two bullets), but here the whole’s causal power depends entirely on the parts, making redundancy ineliminable.  

  **Key Features and Their Roles:**  
  - **Feature Blocking Vagueness:** The sharp phase transition at \( H_{c1} \). If removed (e.g., by replacing superconductivity with a gradual property like electrical conductivity), a sorites series in magnetic field strength would emerge, collapsing into a standard heap-like case.  
  - **Feature Enabling Overdetermination:** Causal completeness of the microphysical parts (electrons explain all effects). If removed (e.g., by positing novel causal powers emergent only in the whole), overdetermination wouldn’t bite—but physics rules this out here.  

  **Brute Composition’s Defense:**  
  The brutalist would attack by denying the exclusion step (Step 3): they might argue the whole *just is* the parts arranged superconductively, so there’s only one cause (the parts) and no overdetermination. This is a refusal to play by the rules of causal exclusion—it rejects the distinction between whole and parts as causal competitors. It’s not a real objection but a semantic pivot; the only resource beyond this is reasserting that composition is brute, which doesn’t address the causal argument.  

  **Stipulations:**  
  - Sharpness at \( H_{c1} \) was derived from theory but stipulated as experimentally decisive (supported by real-world precision).  
  - Causal completeness was stipulated (per BCS theory) but is non-negotiable in the physics.  

  **Outcome:**  
  The case isolates the asymmetry: brute composition defeats vagueness (via sharpness or brutality) but crumbles on overdetermination. Universalism and contact views also face overdetermination, while nihilism and van Inwagen evade it by denying the whole. The design doesn’t stack constraints; theories generate their own verdicts based on core principles.
