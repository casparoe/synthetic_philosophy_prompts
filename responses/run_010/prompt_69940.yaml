prompt: |-
  I am contributing a chapter to an edited volume on strategic decision-making, and the section assigned to me is supposed to do what the other contributors conspicuously have not: state, before any candidate theory is introduced, what an adequate theory of escalation of commitment would actually have to deliver. The obstacle is that the field does not agree about what it is trying to explain. Game theorists treat Shubik's dollar auction as a puzzle about equilibrium and about what happens when a locally sensible calculation is iterated; behavioural economists treat the same set-up as a demonstration that people respond to sunk costs; and the organisational tradition that Staw opened runs experiments in which a lone manager, with no adversary anywhere in the room, adds further funds to the underperforming division he himself picked, and then all three camps cite one another's findings as though they concerned a single phenomenon. My editor wants a specification, not a survey, and I would like you to write it. Fix the purpose first, since adequacy is relative to it: I want a theory good enough that a disinterested observer — a board, a funding agency, an outside reviewer — could use it ex ante, on information available at the time, to say whether an ongoing commitment is an escalation trap or a defensible bet in light of evidence that has genuinely arrived, and to say what institutional change would break the trap. A theory that only makes sense of the outcome after the money is gone does not meet the standard.

  The deliverable is the requirements list: the phenomena an adequate account must explain, the cases it must get right, the distinctions it may not collapse, and the results it must be consistent with — each paired with the case or consideration that motivates it, and each marked either non-negotiable or a preference of one particular camp. Treat what follows as candidates to accept, reject, or reformulate, not as an outline I am supplying you: that the account explain why play continues past the point at which the next increment is dominated by withdrawing, the step from ninety-five cents to a dollar and five; that it distinguish an escalation trap from rational persistence under arriving information by some criterion internal to the theory rather than by assertion; that it handle the asymmetry between the bidder currently ahead and the bidder currently behind, including the fact that the trailing position is what generates the pressure to keep going; that it say whether the solitary, single-decision-maker cases are the same phenomenon as the interactive ones or a different one travelling under the same name; that it reproduce the familiar comparative statics — public accountability for the decision, competition for the same prize, personal responsibility for the initial outlay, the fraction of the project already completed, whether the decision-maker chose it or inherited it — and predict the direction of each rather than accommodate them after the fact; that it be consistent with the observation that de-escalation also occurs and is itself patterned; that it assign some role to the third party who collects the bids, since that is where the institutional-design question lives; that it be consistent with the fact that the dollar auction is the discrete counterpart of the war of attrition, so that whatever it says about one constrains what it may say about the other; and that it not be vacuous, meaning capable of failing.

  Two harder things remain. First, tell me which single requirement does the most work in excluding candidates. Second, say whether any subset of the list is jointly unsatisfiable. My own suspicion is that the unity requirement — one mechanism covering interactive and solitary escalation alike — cannot be had together with both a rationality requirement, on which nothing is attributed to the players beyond correct reasoning given their information, and the ex ante discrimination requirement, for this reason: once bidders are uncertain about one another's budgets or valuations, sustained escalation past the value of the prize is what a fully rational player does in equilibrium, so a theory that takes rationality seriously seems unable to license an outsider's verdict, at the time, that a commitment is a trap rather than a bet. Argue that case or refute it; I do not want it restated. Close with a single paragraph, not a scorecard, saying which of the three families named above survives the list intact and what each of the others has to surrender. A numbered list with the motivating case under each item is fine, and please append no references.
reasoning: |-
  Okay, let me tackle this user's request. They're contributing a chapter on escalation of commitment and need a requirements list for an adequate theory. The key challenge is reconciling different academic perspectives while ensuring the theory is useful for real-time decision assessment.

  First, I consider the core purpose: creating criteria that allow disinterested observers to distinguish escalation traps from rational persistence before outcomes are known. This ex ante discrimination requirement seems fundamental - it's what makes the theory practical rather than just explanatory.

  Looking at the proposed requirements, I need to evaluate which ones are essential. The necessity to explain bidding beyond the prize value in dollar auctions (like the $0.95 to $1.05 jump) feels non-negotiable because it's the defining puzzle. Similarly, distinguishing traps from rational bets through internal theory mechanisms rather than post-hoc labeling is crucial for objectivity.

  The asymmetry between leading and trailing bidders is another critical point. Game theory shows the trailing bidder drives escalation, so any theory must account for this dynamic. When considering solitary vs interactive cases, I suspect they might be different phenomena - the absence of an adversary changes the psychological drivers substantially.

  For comparative statics, the theory must predict (not just accommodate) effects of factors like public accountability. And it must acknowledge that de-escalation happens too - otherwise it's just a theory of persistence. The auctioneer/institutional role is vital for practical interventions.

  The war of attrition connection creates an important constraint - the theory must work for both discrete and continuous escalation formats. And non-vacuity ensures it's falsifiable.

  The user's key concern about rationality requirements deserves special attention. If we assume fully rational players with uncertain valuations, continuing beyond prize value can be equilibrium behavior. This directly conflicts with the ex ante discrimination requirement. I need to determine whether maintaining all three - unity, rationality and ex ante discrimination - is logically possible.

  Considering the three academic traditions:
  - Game theory survives if it relaxes the solitary case unity requirement
  - Behavioral economics must give up strict rationality to explain psychological traps
  - Organizational theories need to incorporate interactive dynamics

  The institutional design angle through the auctioneer's role might offer a path forward, allowing observers to identify structural traps regardless of individual rationality.
answer: |-
  ### Requirements for an Adequate Theory of Escalation of Commitment  
  *(Non-negotiable items marked **; negotiable/preference-based marked *)*  

  1. **Explain continuation beyond dominance**  
     **Must explain why actors invest beyond the point where the *next increment’s cost exceeds its expected benefit* (e.g., bidding $1.05 for a $1 prize in Shubik’s auction).**  
     *Motivation:* Core puzzle of escalation; defines the "trap" threshold.  
     **Non-negotiable**.  

  2. **Distinguish traps from rational persistence endogenously**  
     **Must provide an *internal criterion* (e.g., sensitivity to new information, opportunity costs) to discriminate escalation traps from defensible persistence under uncertainty, without relying on outcomes.**  
     *Motivation:* Ex ante discrimination requirement for observers (boards, agencies).  
     **Non-negotiable**.  

  3. **Account for positional asymmetry**  
     **Must explain why the *trailing actor* (e.g., the lower bidder in an auction) faces greater pressure to escalate than the leader, and how this asymmetry drives the dynamic.**  
     *Motivation:* Game-theoretic and behavioral evidence (e.g., dollar auction rivalry).  
     **Non-negotiable**.  

  4. **Clarify unity of solitary vs. interactive cases**  
     *Must explicitly state whether solitary commitment (e.g., Staw’s manager) and interactive rivalry (e.g., dollar auction) share a *single mechanism* or represent distinct phenomena.*  
     *Motivation:* Organizational vs. game-theoretic traditions conflate them; unity affects generalizability.  
     *Preference (organizational camp)*.  

  5. **Predict comparative statics directionally**  
     **Must *predict* (not retroactively fit) effects of:  
     - Public accountability → ↑ escalation  
     - Competition for the prize → ↑ escalation  
     - Personal responsibility for initial loss → ↑ escalation  
     - High sunk costs → ↑ escalation  
     - Inherited (vs. chosen) project → ↓ escalation.**  
     *Motivation:* Empirical regularity; tests theory’s predictive power.  
     **Non-negotiable**.  

  6. **Explain de-escalation patterns**  
     *Must be consistent with documented *asymmetric de-escalation* (e.g., rapid abandonment when sunk costs are reframed, or rivals signal withdrawal).*  
     *Motivation:* Avoids theory’s collapse into "always escalate"; accounts for reversibility.  
     *Preference (behavioral camp)*.  

  7. **Assign institutional role to the "auctioneer"**  
     *Must specify how the *rulesetter* (e.g., auction designer, corporate policy) influences escalation, enabling institutional interventions.*  
     *Motivation:* Design requirement for breaking traps.  
     *Preference (applied/game-theory camp)*.  

  8. **Consistency with war of attrition**  
     **Must align with the *strategic equivalence* of dollar auctions (discrete) and wars of attrition (continuous), especially in exit incentives and sunk-cost effects.**  
     *Motivation:* Theoretical coherence across formal models.  
     **Non-negotiable**.  

  9. **Non-vacuity**  
     **Must be falsifiable: Specify conditions under which escalation *would not occur*.**  
     *Motivation:* Prevents post hoc rationalization; ensures testability.  
     **Non-negotiable**.  

  ---

  ### Critical Exclusionary Requirement  
  **Requirement #2 (endogenous trap/bet discrimination)** excludes the most candidates. Rational-choice models (e.g., equilibrium bidding under valuation uncertainty) *can* justify continued investment ex ante as rational, making "trap" identification impossible without outcome knowledge. Behavioral/organizational theories often lack internal criteria to separate cognitive biases from Bayesian updating. This requirement forces the theory to specify *when* incremental investment becomes pathologically decoupled from expected value.  

  ---

  ### Joint Unsatisfiability Argument  
  The trio of **rationality** (no cognitive errors), **unity** (one mechanism for solitary/interactive cases), and **ex ante discrimination** is unsatisfiable.  
  - Rationality + interactive uncertainty → equilibrium escalation past prize value (e.g., in auctions with budget uncertainty). This *is* defensible ex ante.  
  - Solitary escalation (e.g., Staw’s manager) lacks strategic uncertainty; errors must stem from cognitive biases (e.g., sunk-cost fallacy).  
  - A unified rational theory cannot explain solitary escalation as rational *and* label it a "trap" ex ante without contradiction. Conversely, a unified behavioral theory abandons rationality.  
  **Thus: Unity + ex ante discrimination requires abandoning strict rationality.**  

  ---

  ### Survival of Theoretical Families  
  **Game theory** survives intact *only if* it relinquishes unity (accepting solitary escalation as distinct) and embraces institutional design (#7) to enable ex ante discrimination (e.g., rules capping bids). **Behavioral economics** survives *only if* it sacrifices rationality and formalizes a testable criterion for "bias-driven" traps (#2), such as systematic neglect of opportunity costs. **Organizational tradition** (Staw) must surrender unity by admitting interactive escalation is strategically distinct, and incorporate asymmetric rivalry (#3) and auctioneer roles (#7). All must satisfy non-vacuity (#9) or risk irrelevance.  

  *(End of specification)*
