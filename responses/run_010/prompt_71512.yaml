answer: |-
  The archival principles you're interrogating rest on deep theoretical foundations—and the proposed shift challenges them at multiple levels. Let's dissect the presuppositions, tensions, and implications systematically.

  ### **I. The Presuppositions of Provenance-Based Arrangement**
  1. **Monologic Authorship & Epistemology**:  
     - Traditional practice assumes records are **univocal emanations of the creating body**. The "creator" is the entity controlling the record's creation, format, and retention.  
     - **Credibility derives from institutional functionality**: Records are "unselfconscious" because they serve immediate operational needs, not future persuasion. This presupposes the creator’s intent is singular (documenting *their* actions) and unmediated.  
     - **Erased voices**: The documented person is epistemologically passive—an object, not a subject. Their presence is incidental to the record’s *primary* purpose: institutional self-documentation.  

  2. **Excluded Theories**:  
     - **Dialogic/Discursive Theories**: Rejects the idea that records capture negotiated truths (e.g., a petition reflects both petitioner *and* bureaucrat).  
     - **Subaltern Testimony**: Dismisses records as sites of resistance or co-creation by marginalized actors (e.g., an enslaved person’s inventory entry as a fragment of their coerced agency).  
     - **Post-Custodialism**: Challenges the fetishization of physical custody, ignoring that records exist in relational networks beyond the creating office.  

  3. **Coherence of the "By-Product" Doctrine**:  
     - **Internal Contradiction**: If a record’s credibility stems from being an unselfconscious by-product of Party A’s business, how can it *simultaneously* be a "trace" of Party B? The system resolves this by subordinating Party B to evidentiary context *for Party A*.  
     - **Power Asymmetry**: The doctrine assumes the "business" being transacted belongs solely to the institution. The purposes of the powerless (e.g., seeking justice, survival) do not constitute "record-worthy" activity—only institutional responses do.  

  ---

  ### **II. Implications of the Proposal (Co-Creatorship)**
  1. **Provenance Reimagined**:  
     - **Dual Provenance**: The proposal acknowledges records as **artifacts of transaction**, not unilateral creation. A petition’s provenance includes both petitioner (source of content) and office (source of form/custody).  
     - **Original Order**: Arranging by documented person isn’t a violation—it surfaces an *alternative original order*: the implicit "order of human experience" obscured by bureaucratic filing.  

  2. **Appraisal & Ethics**:  
     - **Rights of the Documented**: Co-creator status implies rights:  
       - *Against Destruction*: If records are *their* trace, destruction erases their existence.  
       - *For Redaction/Control*: Marginalized groups may demand suppression of harmful records (e.g., psychiatric files used to stigmatize).  
     - **Shift in Appraisal Logic**: Value must balance institutional evidence *and* human rights. Destroying "routine" case files could equate to destroying identities.  

  3. **Citation & Representation**:  
     - **Complex Attribution**: Citations would need dual fields (e.g., "Creator: Colonial Office; Co-Creator: Enslaved Persons of Plantation X").  
     - **Ethical Citation**: How cite a coerced confession? Traditional practice anonymizes the victim; co-creatorship forces acknowledgment: *"Testimony of [Name], extracted under duress by [Office]"*.  

  ---

  ### **III. Underdetermined Practices & Feasible Adjustments**
  | **Current Practice**           | **Theoretical Necessity?** | **Adjustable?**                          |  
  |--------------------------------|---------------------------|------------------------------------------|  
  | Single creator field           | Retrieval practicality     | **Yes** (add co-creator metadata fields) |  
  | No arrangement by subject      | Provenance purity          | **No** (core to theory)                  |  
  | Minimal personal indexing      | Resource constraints       | **Yes** (prioritize high-impact series)  |  
  | Appraisal favoring institutions | Epistemological bias       | **No** (requires fundamental reform)     |  

  **What Can Be Retained**:  
  - Physical original order (custodial provenance) can be maintained while enabling **virtual arrangement** by co-creator.  
  - **Hierarchical description** can survive if the "top level" becomes the *transaction* (e.g., "Land Petitions, 1890–1910") with co-creators at series/subseries levels.  
  - **Functional appraisal** criteria (e.g., documenting institutional processes) can coexist with **ethical appraisal** (e.g., preserving marginalized voices).  

  ---

  ### **IV. Core Tensions Exposed**
  1. **The Fiction of Institutional Monologue**:  
     Records are *always* transactional (e.g., a warrant requires a judge, clerk, accused). Treating institutions as sole creators is an ontological choice favoring power.  

  2. **Neutrality vs. Complicity**:  
     The "by-product" doctrine is not neutral: it centers the purposes of record-*keepers* over record-*subjects*. Colonial archives, for instance, preserve the administrator’s view while reducing colonized people to "data."  

  3. **Practicality vs. Justice**:  
     While resource constraints explain sparse indexing, they cannot justify *refusing* to name the documented when feasible. The proposal forces a reckoning: is efficiency worth epistemic erasure?  

  ---

  ### **Conclusion: Toward a Transactional Model**
  The proposal isn’t "sentiment"—it’s a correction of archival theory’s blind spot. Records **are** "joint traces," and acknowledging this:  
  - **Strengthens Evidential Value**: By exposing the full context of creation (power dynamics, intent, negotiation).  
  - **Democratizes Provenance**: Replaces "custody = creation" with "participation = co-creation."  
  - **Demands Ethical Clarity**: Forces archives to choose between perpetuating institutional biases or becoming stewards of polyphonic evidence.  

  **Implementation Path**: Start with series where imbalance is stark (e.g., asylum intake records). Use co-creator metadata alongside original order, pilot ethical reappraisal, and develop shared authority models with descendant communities. The goal isn’t to abandon provenance but to expand it—from institutional soliloquy to contested dialogue.
