prompt: |-
  For a decade I've read the rationalist-blog treatment of the frame problem, and I've come away with a distinction my day job refuses to make. The narrow logical version — writing frame axioms for every fluent an action leaves untouched — is more or less a solved engineering matter, absorbed into successor-state axioms and fluent occlusion, with the Yale shooting problem as a museum piece. What is not solved, and what the philosophical discussion was really worried about, is which facts are relevant to an action at all. My day job consists entirely of the second problem, and nobody has handed me a way to review it.

  I'm the technical lead on a twelve-person team building an autonomous mobile robot that replenishes picking slots in an operating warehouse. Most of the team are strong software engineers with no formal AI training and no philosophy; a hardware partner signs off the safety case, and I sign off the specs. Roughly twice a month I have to approve a behaviour spec — resume after a pallet has been relocated, recover from a blocked aisle, act on a slot last observed nine minutes ago — and each one silently commits us to an answer about which facts the planner assumes persist, which it re-senses, and which it is permitted to ignore. The failures come in two flavours: an unmaintainable thicket of preconditions and frame clauses nobody understands, or a robot acting with total confidence on a stale belief about the world.

  Please think carefully, and start by brainstorming the space of decisions a reviewer in this position actually faces before you write anything normative. Then give me a spec-review procedure: an ordered set of questions; for each, what counts as a sufficient answer from the author and what evidence I should demand; the points at which the procedure should return "not ready"; and the points at which the question is one of risk appetite or of values and must be escalated to me or to the safety sign-off rather than settled by the checklist. It has to be runnable in about an hour by engineers who will never read McCarthy and Hayes, and it should say explicitly which of the frame problem proper, the ramification problem, and the qualification problem a team can dissolve by stipulation and which it cannot.

  Then run it on three cases: a pallet a human relocates while the robot is mid-task; a chilled slot whose contents degrade without any action of ours; and a proposal from a senior engineer to re-sense the whole relevant world before every action, which I currently favour. I expect the procedure to overrule me on the third. If it does, say so plainly and price the cheap-looking fix.

  Close with what the procedure cannot do — where it will misfire, and which decisions it merely relocates rather than resolves.
reasoning: |-
  We are given a problem from a technical lead on a team building an autonomous mobile robot for warehouse operations. The lead is concerned about the frame problem, particularly the distinction between the narrow logical frame problem (which is considered solved) and the broader problem of determining which facts are relevant to an action and which can be ignored.

  The lead has two main failure modes in specs:
  1. Unmaintainable thicket of preconditions and frame clauses.
  2. Robots acting with overconfidence on stale beliefs.

  We are to design a spec-review procedure that:
  - Is runnable in about an hour by engineers without formal AI or philosophy backgrounds.
  - Includes an ordered set of questions, with what counts as a sufficient answer and required evidence.
  - Specifies when to return "not ready" and when to escalate to risk appetite or values.
  - Explicitly addresses which parts of the frame problem (frame, ramification, qualification) can be dissolved by stipulation and which cannot.

  Then, we are to run the procedure on three cases:
  1. A pallet relocated by a human while the robot is mid-task.
  2. A chilled slot whose contents degrade without the robot's action.
  3. A proposal to re-sense the whole relevant world before every action (which the lead currently favors).

  Finally, we must close with the limitations of the procedure.

  ## Step 1: Brainstorming the Space of Decisions

  The reviewer (the technical lead) must consider the following when reviewing a behavior spec:

  1. **Scope of the behavior**: What is the specific scenario being addressed? (e.g., resume after pallet relocation, recover from blocked aisle, act on a slot last observed 9 minutes ago)

  2. **State representation**: What state variables (fluents) are relevant to this behavior?

  3. **Action preconditions**: What conditions must hold for the action to be taken? How are these conditions checked (sensed, inferred, stored)?

  4. **Action effects**: What changes when the action is taken? What remains unchanged?

  5. **Persistence assumptions**: For how long and under what conditions can the robot assume that a particular state variable remains unchanged? What events might invalidate that assumption?

  6. **Sensing strategy**: When and how does the robot update its beliefs? What triggers a re-sensing? How costly (in time and resources) is sensing?

  7. **Failure modes**: What can go wrong? How does the robot detect that an assumption has been violated? What is the recovery procedure?

  8. **Relevance and irrelevance**: What facts are considered relevant to the action? What facts are intentionally ignored? What is the justification for ignoring them?

  9. **Ramifications (indirect effects)**: Are there any indirect effects of the action that must be accounted for? How are these handled?

  10. **Qualification problem**: Are there preconditions that are so numerous or context-dependent that they are impractical to list? How are these handled?

  11. **Safety**: What are the safety implications of incorrect assumptions? How does the design ensure safety?

  12. **Maintainability**: Is the specification clear and modular? Can it be understood and modified by the team? Does it avoid unnecessary complexity?

  13. **Performance**: What are the computational and time costs of the approach? Is it feasible in real-time?

  ## Step 2: The Spec-Review Procedure

  The procedure is an ordered checklist of questions. For each question, we define:
  - The question.
  - What constitutes a sufficient answer.
  - What evidence to demand.
  - When to mark as "not ready".
  - When to escalate.

  ### Preliminary Note: Dissolving Problems by Stipulation
  - **Frame problem (narrow)**: Can be dissolved by stipulation (using standard techniques like successor-state axioms or fluent occlusion). The team does not need to reinvent this.
  - **Ramification problem (indirect effects)**: Cannot be entirely dissolved by stipulation because indirect effects are domain-specific and must be addressed per scenario. However, one can stipulate that indirect effects are ignored if they are deemed irrelevant or too costly to model, but this must be justified by safety and context.
  - **Qualification problem (unknown preconditions)**: Cannot be dissolved by stipulation because it's about the potential for unexpected conditions. The team must have a strategy for handling unexpected conditions (e.g., via sensing, monitoring, or safe defaults).

  ### Review Procedure

  #### 0. Pre-review Check
  - **Question**: Is the behavior spec clearly scoped? Does it describe a specific scenario with triggers, expected behavior, and exit conditions?
  - **Sufficient answer**: The spec must have a clear title, a description of the scenario, the trigger event, the intended robot behavior, and the conditions for considering the behavior complete.
  - **Evidence**: The written spec document.
  - **Not ready if**: The scenario is vague or the behavior is not clearly defined.
  - **Escalate if**: The scenario itself has safety implications that require higher-level risk assessment.

  #### 1. State Variables
  - **Question**: What state variables (fluents) are used in this behavior? For each, is it directly sensed, inferred, or stored? What is the update mechanism?
  - **Sufficient answer**: A list of state variables, their type (boolean, enumerated, continuous), and how they are obtained (sensor, inference, memory). The update mechanism must be specified (e.g., on change, periodically, on demand).
  - **Evidence**: State variable table in the spec, with sources and update triggers.
  - **Not ready if**: State variables are not listed or their update mechanism is unclear.
  - **Escalate if**: A state variable is critical for safety and the update mechanism is unreliable.

  #### 2. Preconditions
  - **Question**: What are the preconditions for the behavior? How are they checked? What is the source of truth for each precondition?
  - **Sufficient answer**: Clear list of preconditions, each with a method of checking (e.g., sensor reading, database query, internal state) and a threshold or condition for satisfaction.
  - **Evidence**: Precondition table in the spec, with check method and source.
  - **Not ready if**: Preconditions are missing, ambiguous, or without a clear check method.
  - **Escalate if**: A precondition is safety-critical and the check method is not fail-safe.

  #### 3. Action Effects
  - **Question**: What are the direct effects of the behavior? What state variables change? How are these changes represented (e.g., assignment, occlusion)? What frame axioms are used (i.e., what is assumed to persist unless changed)?
  - **Sufficient answer**: A list of effects on state variables, and a statement of what persists (using a standard technique like successor-state axioms). The spec must clearly state that all other state variables are assumed to persist (by stipulation, using the standard frame handling).
  - **Evidence**: Effects listed, and reference to the standard frame handling mechanism (e.g., "we use successor-state axioms as per our standard framework").
  - **Not ready if**: Effects are not listed or the persistence assumption is not clearly stated.
  - **Escalate if**: The effects have safety ramifications that are not addressed.

  #### 4. Ramifications
  - **Question**: Are there any indirect effects (ramifications) of the behavior? If so, how are they handled? If not, why not?
  - **Sufficient answer**: Either (a) a list of indirect effects and how they are modeled (e.g., via additional effect rules) or (b) a justification for why indirect effects are not considered (e.g., they are negligible, handled by other processes, or too rare to matter). The justification must include a risk assessment.
  - **Evidence**: Ramifications section in the spec, with either modeling details or risk justification.
  - **Not ready if**: Indirect effects are not considered and there is no justification.
  - **Escalate if**: The indirect effects are safety-critical and not modeled, or the risk justification is inadequate (requires risk appetite decision).

  #### 5. Qualification Problem
  - **Question**: What unexpected conditions could make the behavior unsafe or incorrect? How does the robot handle such conditions? Is there a monitoring mechanism during execution?
  - **Sufficient answer**: A list of known failure modes and how they are detected (e.g., via continuous monitoring, timeouts, sensor checks). A description of the fallback behavior (e.g., stop, replan, ask for help). Also, a statement about unknown conditions (e.g., "we rely on periodic full state checks" or "we have a watchdog timer").
  - **Evidence**: Failure mode and effects analysis (FMEA) for the behavior, or a section on monitoring and recovery.
  - **Not ready if**: There is no discussion of failure modes or recovery.
  - **Escalate if**: The failure modes are safety-critical and the fallback is insufficient (requires safety sign-off).

  #### 6. Sensing and Belief Freshness
  - **Question**: How fresh are the beliefs (state variables) used in the behavior? What triggers a re-sensing? What is the maximum staleness allowed? How is staleness detected and handled?
  - **Sufficient answer**: For each state variable, the maximum allowed staleness (or condition for re-sensing) and the action taken if the staleness is exceeded. The triggers for re-sensing (e.g., every X seconds, on event Y, before critical action Z) must be specified.
  - **Evidence**: Staleness thresholds and re-sensing triggers in the spec.
  - **Not ready if**: Staleness is not addressed for critical state variables.
  - **Escalate if**: The staleness threshold for a safety-critical variable is too high and might lead to unsafe operation.

  #### 7. Relevance and Ignoring
  - **Question**: What state variables are intentionally ignored in this behavior? What is the justification for ignoring them? How does ignoring them affect safety and correctness?
  - **Sufficient answer**: A list of state variables that are not considered, with a justification for why they are irrelevant in this context. The justification must include why changes in these variables do not affect the behavior.
  - **Evidence**: A table of ignored variables with justifications.
  - **Not ready if**: The justification for ignoring a variable is weak or absent, especially if the variable might be relevant.
  - **Escalate if**: Ignoring a variable could lead to a safety hazard, and the justification is insufficient.

  #### 8. Maintainability
  - **Question**: Is the behavior specification modular and clear? Can it be understood by a team member without deep familiarity? Does it avoid unnecessary complexity?
  - **Sufficient answer**: The spec is written in clear language, uses diagrams if helpful, and avoids redundant or overly complex conditions. It references standard frameworks where possible.
  - **Evidence**: The spec document itself, reviewed for clarity.
  - **Not ready if**: The spec is convoluted and hard to follow.
  - **Escalate if**: The complexity is inherent to the problem and requires architectural changes.

  #### 9. Performance
  - **Question**: What is the computational and time cost of the behavior? Is it feasible in real-time? How does it impact the overall system?
  - **Sufficient answer**: Rough estimates of computation time and resource usage (e.g., "this check takes 10ms on our hardware"). If there are performance risks, they are noted.
  - **Evidence**: Performance profiling results or engineering estimates.
  - **Not ready if**: Performance is not considered and the behavior is computationally intensive.
  - **Escalate if**: The behavior might cause unacceptable delays and there is no mitigation.

  ### End of Procedure
  - If all questions are answered sufficiently, approve.
  - If any "not ready" is encountered, return for revision.
  - Escalations must be resolved by the appropriate authority (technical lead for risk appetite, safety sign-off for safety).

  ## Step 3: Run the Procedure on Three Cases

  ### Case 1: Pallet Relocated by Human Mid-Task
  - **Behavior**: The robot must resume its task after a pallet it was working on is relocated by a human.
  - **Review**:
    - **State Variables**: Pallet location (sensed by vision system, updated on perception events).
    - **Preconditions**: The robot must know the pallet's last known location and have a relocation event trigger (from system or sensor).
    - **Effects**: The robot updates its internal pallet location and replans the path.
    - **Ramifications**: None beyond the direct effect (justified by the system design: relocation events are handled centrally).
    - **Qualification**: Unexpected: relocation might not be detected. Monitoring: the robot checks for pallet at the expected location and if missing, triggers relocation event handling. Fallback: pause and request human help.
    - **Sensing**: Pallet location is re-sensed on the relocation event (trigger) and also if the robot arrives and the pallet is missing. Staleness: until the next perception event or event trigger, but the behavior is triggered only by the event so staleness is low.
    - **Ignoring**: Other pallets and non-pallet objects in the area are ignored (justified: the task is only about this pallet; other changes are irrelevant).
    - **Maintainability**: The spec is clean: it uses the event-driven update.
    - **Performance**: The re-sensing and replanning are known to take < 1 second.
    - **Verdict**: Approvable. The procedure does not overrule the lead.

  ### Case 2: Chilled Slot with Degrading Contents
  - **Behavior**: The robot must handle a chilled slot where the contents (e.g., perishable goods) degrade over time without any action by the robot.
  - **Review**:
    - **State Variables**: Slot contents quality (inferred from time of last check and degradation model, or sensed by specialized sensor).
    - **Preconditions**: The robot must know the time the slot was last checked and the degradation rate.
    - **Effects**: The robot updates the quality based on current time and degradation model.
    - **Ramifications**: Degradation affects whether the slot is suitable for picking (but that is handled by the planner, not this behavior). Justification: degradation is modeled explicitly, so no indirect effects are missed.
    - **Qualification**: Unexpected: degradation rate changes (e.g., due to power outage). Monitoring: periodic checks of the actual quality (e.g., via sensor). Fallback: if quality is below threshold, mark slot as unusable and alert.
    - **Sensing**: The quality state variable is updated periodically (e.g., every 5 minutes) and also before critical actions. Staleness: max 5 minutes.
    - **Ignoring**: The robot ignores the exact temperature fluctuations (justified: we use a conservative degradation model that accounts for worst-case).
    - **Maintainability**: The spec includes a clear degradation model and update rule.
    - **Performance**: Degradation update is cheap (a simple calculation).
    - **Verdict**: Approvable. The procedure does not overrule the lead.

  ### Case 3: Proposal to Re-sense the Whole Relevant World Before Every Action
  - **Lead's current position**: Favors this approach.
  - **Review**:
    - **State Variables**: All state variables in the "relevant world" (which must be defined).
    - **Preconditions**: None beyond having the sensors active.
    - **Effects**: The state is updated to the current sensed values.
    - **Ramifications**: None (because we are updating everything, so no indirect effects are missed).
    - **Qualification**: What if sensing fails? The proposal must have a fallback (e.g., use stale data, but then it's not whole re-sensing). Also, the "relevant world" might be too big to sense quickly.
    - **Sensing**: Before every action, sense everything. Staleness: near zero.
    - **Ignoring**: None (because we sense everything).
    - **Maintainability**: The spec is simple: always re-sense. But it might lead to code that is inefficient and hard to optimize.
    - **Performance**: **This is the critical issue**. Sensing the whole relevant world might take too long (e.g., scanning an entire aisle with a lidar might take seconds). This could make the robot too slow, especially in a dynamic warehouse. Also, it might drain battery and overwhelm the network.
    - **Evidence**: The senior engineer must provide performance estimates. If the sensing takes 2 seconds per action and the robot does 10 actions per minute, then 20 seconds per minute are spent sensing. This might be acceptable in some contexts but not in a high-throughput warehouse.
    - **Verdict**: The procedure overrules the lead. The performance cost is too high. The cheap-looking fix (re-sense everything) might actually be expensive in time and resources.
    - **Price of the fix**: 
      - Time: Adding 2 seconds per action in a 10-action-per-minute task means 33% of time is spent sensing. This reduces throughput by 33%.
      - Resource: Increased battery usage and potential for sensor wear.
      - Safety: If sensing takes too long, the world might change during sensing, leading to a race condition.

  ## Step 4: Limitations of the Procedure

  The procedure cannot:
  1. **Eliminate risk entirely**: It only makes risks explicit and requires justification. Some risks might be accepted due to cost-benefit trade-offs.
  2. **Handle unforeseen circumstances**: The qualification problem is addressed by known failure modes, but unknown unknowns remain.
  3. **Replace domain expertise**: The reviewers must understand the warehouse domain to judge relevance and risk.
  4. **Solve the philosophical frame problem**: It only provides a structured way to document decisions about relevance, but the fundamental problem of relevance is not solved.
  5. **Guarantee safety**: Safety is ensured by the entire system, not just one procedure. The procedure relies on the safety sign-off.
  6. **Prevent all errors**: It reduces the chance of oversights but cannot catch every flaw, especially in complex interactions.
  7. **Resolve deep trade-offs**: It only escalates them to the appropriate authority.

  The procedure relocates the following decisions:
  - **Risk appetite**: To the technical lead and safety sign-off.
  - **System architecture**: If the spec reveals a fundamental flaw, it might require architectural changes, which are beyond the scope of the spec review.
  - **Relevance decisions**: The team must still decide what is relevant, but the procedure makes them justify it.

  In summary, the procedure provides a systematic way to review behavior specs, but it is not a silver bullet.
answer: |-
  ### Spec-Review Procedure for Behavior Specifications  
  This procedure is designed for engineers without formal AI/philosophy backgrounds. It focuses on the practical dimensions of the frame problem: **relevance** (which facts matter), **persistence** (what can be safely assumed unchanged), and **staleness** (when to re-sense). It explicitly separates:  
  - **Frame problem (narrow)**: Solved by stipulation (use successor-state axioms/occlusion).  
  - **Ramification problem** (indirect effects): **Cannot** be dissolved by stipulation—must be explicitly addressed or justified.  
  - **Qualification problem** (unknown preconditions): **Cannot** be dissolved by stipulation—requires monitoring/fallbacks.  

  The review must be completed in **~60 minutes**. Escalate issues of **risk appetite** (e.g., safety-critical staleness thresholds) to you (TL) or **safety sign-off** (e.g., hazardous outcomes).  

  #### Ordered Questions for Review  
  **1. What is the scope of the behavior?**  
     - **Sufficient answer**: Clear, concise description of trigger, actions, and success/failure exit conditions.  
     - **Evidence**: Flowchart or pseudocode in spec; no ambiguity in inputs/outputs.  
     - **Not ready if**: Scope overlaps with other behaviors or lacks defined boundaries.  
     - **Escalate if**: Scope implies systemic risk (e.g., interaction with safety-critical systems).  

  **2. What state variables (fluents) are essential?**  
     - **Sufficient answer**: List of variables (e.g., `pallet_location`, `aisle_clearance`) with types (boolean, enum, continuous). Justification for inclusion (e.g., "aisle clearance affects motion").  
     - **Evidence**: Table mapping variables to real-world sources (e.g., sensor ID, warehouse DB).  
     - **Not ready if**: Variables are missing, vague, or not traceable to sensors/context.  
     - **Escalate if**: A variable’s omission could cause safety harm (e.g., ignoring `forklift_presence`).  

  **3. How is persistence handled for each variable?**  
     - **Sufficient answer**:  
       - Declare which variables use **successor-state axioms** (e.g., "`pallet_weight` persists unless modified by `unload_pallet`").  
       - Justify any **non-persistent assumptions** (e.g., "`slot_temperature` degrades over time, so not persistent").  
     - **Evidence**: Code references or architecture diagrams showing occlusion mechanisms.  
     - **Not ready if**: Persistence assumptions are undocumented or conflict with physics (e.g., assuming `slot_occupancy` persists indefinitely).  
     - **Note**: Frame problem (narrow) is **solved by stipulation**—no need to reinvent.  

  **4. What triggers re-sensing vs. reliance on stale data?**  
     - **Sufficient answer**:  
       - Max staleness threshold per variable (e.g., "`pallet_location` valid for 60s; re-sense if older").  
       - Events forcing re-sense (e.g., "re-sense aisle after 5min idle").  
     - **Evidence**: Staleness matrix (variable vs. max age/event trigger); data from sensor latency tests.  
     - **Not ready if**: Staleness thresholds are arbitrary or missing for safety-critical variables.  
     - **Escalate if**: Staleness risks safety (e.g., "assume human absence for 10min" near moving equipment).  

  **5. What preconditions are excluded, and why?**  
     - **Sufficient answer**: List of **irrelevant variables** (e.g., "ignore weather for indoor slots") with rationale (e.g., "no empirical effect on behavior").  
     - **Evidence**: Historical logs or simulations showing excluded variables don’t affect outcomes.  
     - **Not ready if**: Exclusions lack justification or include context-dependent factors (e.g., "ignore human proximity" in shared aisles).  
     - **Escalate if**: Exclusion might violate safety policies (e.g., ignoring `fire_alarm` status).  

  **6. How are ramifications (indirect effects) managed?**  
     - **Sufficient answer**:  
       - Describe indirect effects (e.g., "moving pallet obscures camera view of adjacent slot").  
       - Mitigation: Re-sense, update state, or justify omission (e.g., "ramifications handled by warehouse WMS").  
     - **Evidence**: FMEA (Failure Mode Effects Analysis) snippet for the behavior.  
     - **Not ready if**: Ramifications are unaddressed for high-likelihood scenarios.  
     - **Escalate if**: Unmitigated ramifications could cascade (e.g., "blocked aisle traps robot").  
     - **Note**: Ramifications **cannot be dissolved by stipulation**—domain-specific handling required.  

  **7. How are unknown preconditions monitored?**  
     - **Sufficient answer**:  
       - Runtime checks (e.g., "verify slot ID matches pre-task scan before placing item").  
       - Fallbacks (e.g., "if precondition check fails, enter safe-stop and alert").  
     - **Evidence**: Watchdog timers or anomaly detection config in code.  
     - **Not ready if**: No runtime checks for volatile variables (e.g., human-moved objects).  
     - **Escalate if**: Fallbacks are inadequate for high-risk contexts (e.g., no safe-stop near workers).  
     - **Note**: Qualification problem **cannot be dissolved by stipulation**—requires active monitoring.  

  **8. What are the costs of re-sensing/updates?**  
     - **Sufficient answer**: Latency (ms), compute (CPU%), and power (Wh) estimates for sensing actions.  
     - **Evidence**: Profiling data from test environments (e.g., "lidar scan adds 300ms delay").  
     - **Not ready if**: Costs unquantified for proposed sensing strategy.  
     - **Escalate if**: Costs make behavior nonviable (e.g., 30% latency increase breaks SLAs).  

  **9. Is the spec maintainable?**  
     - **Sufficient answer**:  
       - Preconditions/frame clauses fit in one screen (~50 lines).  
       - Uses shared libraries (e.g., `StatePersistenceModule`).  
     - **Evidence**: Spec length < 1 page; references to centralized modules.  
     - **Not ready if**: Custom frame logic duplicates existing mechanisms.  

  **Final Output**:  
  - **Approve** if all answers sufficient.  
  - **Not ready** if any question unanswered.  
  - **Escalate** if risk/value decisions needed (marked in questions).  

  ---

  ### Procedure Applied to Three Cases  
  **Case 1: Pallet Relocated by Human Mid-Task**  
  - **Scope**: Resume task after external pallet move.  
  - **State variables**: `pallet_location`, `task_phase`.  
  - **Persistence**: `task_phase` persists; `pallet_location` **not persistent** (volatile).  
  - **Re-sensing**: Trigger on task-resume; max staleness = 0s (must re-sense).  
  - **Ramifications**: If pallet moved, path invalid—mitigate by path replan.  
  - **Preconditions**: Exclude non-pallet objects (justified: task-specific).  
  - **Qualification**: Runtime check: "Is pallet at last location?"; fallback to scan area.  
  - **Cost**: Re-sense adds 2s (acceptable).  
  - **Verdict**: **Approvable**. Addresses relevance via volatile marking and re-sense trigger.  

  **Case 2: Chilled Slot Degrading Without Robot Action**  
  - **Scope**: Handle perishable goods in chilled slots.  
  - **State variables**: `slot_temperature`, `contents_freshness`.  
  - **Persistence**: `slot_temperature` persistent (climate-controlled); `contents_freshness` **non-persistent** (degrading).  
  - **Re-sensing**: Re-sense `contents_freshness` every 2min (staleness threshold = 120s).  
  - **Ramifications**: Degradation affects inventory quality—mitigate by updating warehouse DB post-scan.  
  - **Preconditions**: Exclude non-chilled slots (justified: scope-limited).  
  - **Qualification**: Monitor for cooling failure; fallback to mark slot "degraded".  
  - **Cost**: Thermal scan adds 500ms (minor).  
  - **Verdict**: **Approvable with escalation**. Staleness threshold requires TL/safety sign-off (risk: spoiled goods).  

  **Case 3: Proposal to Re-Sense Entire World Before Every Action**  
  - **Scope**: Global re-sensing pre-action.  
  - **State variables**: All "relevant" variables (e.g., `aisles_clear`, `slots_occupied`).  
  - **Persistence**: None assumed—always re-sense.  
  - **Re-sensing**: Full scan before every atomic action.  
  - **Ramifications**: Overkill—re-sensing may miss inter-action changes (e.g., human enters during scan).  
  - **Preconditions**: None excluded.  
  - **Qualification**: None—assumes sensing is perfect.  
  - **Cost**: **Problematic**: Full scan takes 8s; 30 actions/hour = 240s/hour sensing (40% downtime). Battery drain: 15% faster depletion.  
  - **Verdict**: **Procedure overrules you**. "Cheap" fix has high operational cost:  
    - **Price**: ~40% productivity loss + accelerated hardware wear.  
    - **Alternative**: Event-triggered re-sensing (e.g., on aisle-entry) + lightweight checks (cost: 5% latency). Escalate to TL for risk decision on reduced sensing.  

  ---

  ### What the Procedure Cannot Do  
  1. **Misfires**:  
     - **False negatives**: May approve specs with rare but catastrophic ramifications (e.g., 1-in-10,000 events).  
     - **False positives**: May flag safe but complex specs as "unmaintainable" due to rigid line-count heuristics.  

  2. **Relocates, Not Resolves**:  
     - **Relevance decisions**: Forces explicit justification but doesn’t answer "what is relevant?"—relies on engineer judgment.  
     - **Risk trade-offs**: Escalates to TL/safety but doesn’t quantify risk (e.g., "Is 60s staleness for pallets acceptable?").  
     - **Qualification problem**: Requires monitoring but can’t anticipate all edge cases (e.g., a new obstacle type).  

  3. **Systemic Blind Spots**:  
     - **Emergent interactions**: Won’t catch conflicts between multiple behaviors (e.g., recovery logic clashing with navigation).  
     - **Sensor failures**: Assumes sensors are reliable; doesn’t handle sensor degradation.  
     - **Human factors**: Can’t validate assumptions about human behavior (e.g., "workers won’t relocate pallets mid-task").  

  Use this procedure to enforce rigor in relevance/staleness decisions, but pair it with system-level FMEAs and simulation testing to cover gaps.
