  So my partner and I are six weeks into IVF, and the clinic has raised mitocondrial donation as an option because I carry a mutation that can cause serious disease in a child. That sent me down a rabbit hole on origin essentialism — roughly the Kripkean thought that you couldn't have come from a different sperm and egg — and now I can't stop wondering where my future kid's origin would even be in a case like that: nucleus from my partners egg, mitochondria from some donor's.

  Here's what I want from you. Your credence, as a number, that origin essentialism is true of human persons — i.e. that necessarily, no person could have originated from a materially different gamete pair from the one they did in fact originate from. Then decompose it: your credence that essentialism about origins is true of anything at all, as against origins being a brute historical contingency; your credence that if it is true it reaches persons and not just tables and oak trees; your credence that the gradual-replacement sorites fails (swap the origin bit by bit, each step individually harmless, so a wholly different origin is harmless); and your credence that "the origin" stays a single determinate thing through the mitochondrial case rather than splitting into nucleus-origin and cytoplasm-origin. A number and one sentence of justification per term, then how you combine them into the headline figure.

  Finally, tell me which term the overall number is most sensitive to and what kind of argument would move it most. British English please, and do commit to actual numbers rather than hedging — I know they're false precision, that's fine, I want to see where your reasoning is thin.
