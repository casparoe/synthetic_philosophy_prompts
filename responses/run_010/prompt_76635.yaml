  ## Handover Remarks: Benin Plaque  
  *(Approx. 550 words)*  

  Good morning. We are gathered to return this object to its rightful custodians, the National Museums Commission of Nigeria. It leaves our building today. This plaque was made in Benin City. It was removed from the Oba’s palace during the British military expedition of 1897, a violent looting. It arrived here in 1899, purchased in Hamburg by a local ship’s chandler. For 124 years, it has stood in a case at the top of our main staircase. Today, that ends.

  This plaque was never intended to stand alone. It was made to be seen, yes, but specifically as part of a sequence. It was one of many nailed onto wooden pillars in palace courtyards. People walking past would read these plaques in order; each one gained meaning from the ones beside it, above it, below it. Its removal wasn’t just a theft of an object, but a tearing of context. It wasn’t hidden sacredness that was violated – it was placement, sequence, narrative. Taking one plaque out of its run shattered the story. Keeping it here, isolated in our case, couldn’t mend that break. Returning it now, alone, does not mend it either. That larger fracture remains. We return this piece understanding that profound, irreparable loss.

  Marit, our retired conservator, cared for this metal for forty years. She knows its surface, its weight, its every contour better than anyone alive. Her dedication preserved it physically. That skill, that commitment, deserves our respect. Thank you, Marit.

  The argument for its continued presence here often centered on visibility: *People here can see it*. But visibility alone isn’t the point. Seeing it *here*, out of sequence, out of place, disconnected from its brothers and sisters scattered across the globe, is not the same as seeing it *there*, where it belonged. Its visibility here was always a symptom of the rupture, not a remedy for it.

  So, what is today? This museum’s board has authorized the return of this object. That act is complete with its handover. We fulfill that obligation now. Returning an object is sometimes framed as the start of a new chapter – shared projects, exchanges, a continuous conversation. That may happen elsewhere. It is not inherent to this act. Sometimes, a return is simply an account settled. An imbalance acknowledged and corrected, as far as one object can correct it. It can be the closing of a long, painful ledger entry. It does not obligate the future.

  My institution speaks now: We return this plaque. We acknowledge the violence that brought it here. We recognize the greater story broken by its removal, a story our single return cannot reconstruct. We have held it; now we relinquish it.

  *(Pause)*

  Personally, standing here, I feel the weight of that crate being closed not as an ending we chose, but as an ending demanded by history. It feels heavy, and final.

  The delegation from the National Museums Commission will now speak. Following that, the crate will be sealed. Thank you.

  ---

  **Position Taken & Structural Evidence:**  
  I chose the **Severance** position. This is visible in:

  1.  **Explicit Rejection of Future Commitments:** The speech directly states, "Returning an object is sometimes framed as the start of a new chapter... That may happen elsewhere. It is not inherent to this act... It does not obligate the future." It refrains from any request or hint of future collaboration (loans, projects, dialogue).
  2.  **Framing as Closure/Settlement:** The act is described as "an account settled," "an imbalance acknowledged and corrected," "the closing of a long, painful ledger entry." The final line emphasizes the crate closing as feeling "heavy, and final."
  3.  **The Museum's Voice Limits Scope:** The institution's statement focuses solely on the act of return, acknowledgment of violence, recognition of irreparable loss, and relinquishment. It contains no forward-looking statements.
  4.  **Personal Sentence Reinforces Finality:** The single personal sentence ("Personally, standing here...") describes the feeling as one of demanding finality, aligning with severance, not hopeful new beginnings. It underscores the weight of ending, not anticipation.
