prompt: |-
  I convene a fourth-year seminar on teleological explanation in the life sciences: ninety minutes, sixteen students, roughly half reading philosophy and half reading evolutionary biology. All of them have been assigned Gould and Lewontin's 1979 paper on the spandrels of San Marco and the adaptationist programme. When I have taught this session before, I have made the mistake of walking through the paper in its own order, and the result is that the students leave able to recite the word "spandrel" as a term of dismissal while being unable to construct or to evaluate a single spandrel argument. I intend to restructure the session entirely, and I want a plan for the explanation rather than the explanation itself.

  The composition of the group is the difficulty. The biologists arrive convinced that they absorbed all of this in their second-year lectures and that the controversy was settled long ago in their discipline's favour; the philosophers arrive with no developmental biology at all but with a well-drilled instinct to treat every empirical dispute as a merely verbal one. Please address the following.

  1. Specify the conceptual prerequisites that must be in place before the paper's argument is intelligible at all, in the order they must be introduced, and say what each one depends on. I have in mind at least the separation of a trait's current utility from the question of its origination, and the distinction between a null hypothesis and a shifting of the burden of proof. For each prerequisite, indicate which of the two halves of the room will find it patronising and how to present it so that it does not feel that way to them.

  2. Decide for me whether the session should open with the architectural analogy or with a biological trait, and argue the choice. I want the reasoning in both directions: what is lost by opening with the vault (the risk that the metaphor arrives as ornament and is never cashed out), and what is lost by opening with the organism (the risk that the students fixate on the empirical verdict about that particular structure and never see the logic).

  3. Nominate one case to carry the whole session, and state what that case must have and what it must lack: which features make the by-product reading genuinely available to a student, which features stop the case from degenerating into either "we have simply not yet found the function" or "this is transparently an adaptation", and whether the case can also be pushed through the subsequent move in which a by-product acquires a function of its own. If the honest answer is that no single case can do all three jobs, say so and tell me how to divide the labour.

  4. Advise on the four argumentative styles the paper identifies for breaking the chain of adaptationist reasoning: whether to hand them to the students in advance as a taxonomy or to let them fall out of the case, and which of the four is the weakest and should be flagged as such at the point of introduction. The students will otherwise take all four to be equally probative, and one of them in particular invites the inference from absence of evidence to evidence of absence.

  5. Give me the misconceptions, separately for the two halves of the room, and the exact point in the sequence at which each should be headed off rather than answered afterwards. I expect at least: that the critique is anti-adaptationism rather than a critique of a style of argument; that a spandrel cannot be useful, or cannot be elaborated by later selection; that the paper licenses the inference from "no proposed function" to "not an adaptation"; and the biologists' conviction that the whole debate was a philosophical fuss about nothing. For each, say what it costs me to defuse it where you propose.

  6. Tell me what I should decline to cover at this level, and how to announce the refusal rather than simply omitting it. Candidates include the comparative-method machinery for detecting phylogenetic inertia, the architectural niceties about which structures in the basilica are properly called pendentives rather than spandrels, and the fact that the empirical verdicts in the literature remain contested and that critics have charged the authors with underestimating how pervasive adaptation is.

  7. End with one question I can put to the room in the final ten minutes that would show whether they have grasped the logical structure rather than the slogan — and tell me what a bad but fluent answer to it would sound like.

  Two further requirements. First, the plan must work for students who have read nothing beyond the assigned paper; do not supply bibliographies, reading lists, or citations, and do not build any segment around a work they will not have encountered. Second, write the whole response in British English.

  Please return the plan as a single JSON object conforming exactly to this schema:

  - "prerequisites": an array of objects, each with "order" (integer), "item" (the prerequisite), "depends_on" (what must already be in place), "why_here" (why it cannot be deferred), and "room_risk" (which half of the seminar will resent it and the presentation that avoids this).
  - "opening_fork": an object with "architecture_first" (the case for it), "organism_first" (the case for it), "recommendation", and "reason".
  - "carrying_case": an object with "case", "must_have" (array of strings), "must_lack" (array of strings), "can_support_co_optation" (boolean), "limitations", and "fallback_cases" (array of objects with "case" and "job", used only if the labour must be divided).
  - "four_styles": an array of objects, each with "style", "what_it_establishes", "teach_when" ("in_advance" or "emergent"), and "weakest_flag" (string or null).
  - "misconceptions": an array of objects, each with "misconception", "audience" ("philosophers", "biologists", or "both"), "trigger_point" (where in the sequence it arises), "defusal" (how to head it off at that point), and "cost_of_defusing_there".
  - "omissions": an array of objects, each with "omitted", "why_unsuitable_at_this_level", and "how_to_announce_the_refusal".
  - "closing_check": an object with "question", "what_a_good_answer_shows", and "what_a_fluent_bad_answer_sounds_like".
reasoning: |-
  We are constructing a JSON object for a seminar plan on Gould and Lewontin's spandrels paper. The plan must address the specific issues raised, including prerequisites, opening choice, a carrying case, the four argumentative styles, misconceptions, omissions, and a closing question.

  1. **Prerequisites**:
     We need to establish foundational concepts. The user suggests at least two: separation of current utility from origin, and the burden of proof vs. null hypothesis. We'll add a third: the concept of adaptation itself, as it's central.

     - Order 1: **The concept of adaptation in evolutionary biology**.
       - Depends on: Basic understanding of natural selection (assumed from prior reading).
       - Why here: Without a clear idea of what adaptation is, the critique of adaptationism is unintelligible.
       - Room risk: Biologists will find it patronising. Presentation: Frame it as setting the stage for the debate, and ask biologists to contribute examples of adaptations to make it participatory.

     - Order 2: **Distinction between a trait's current utility and its historical origin**.
       - Depends on: Understanding of adaptation (Order 1).
       - Why here: This is key to understanding that a trait can be useful now but not have originated for that use.
       - Room risk: Philosophers might find it patronising (as they are used to conceptual distinctions). Presentation: Use a biological example (e.g., feathers: originally for insulation, later co-opted for flight) and have philosophers analyze the logic.

     - Order 3: **Null hypothesis and burden of proof in scientific reasoning**.
       - Depends on: The above two.
       - Why here: The paper criticizes adaptationists for not considering alternatives as the null hypothesis and shifting the burden of proof.
       - Room risk: Both might find it patronising if presented too abstractly. Biologists might think they know it, philosophers might think it's trivial. Presentation: Use a simple example (e.g., assuming a coin is fair until proven biased) and then apply to biology: what is the null hypothesis for a trait's origin?

  2. **Opening Fork**:
     - Architecture first: 
       - Case for: The architectural analogy is vivid and memorable, and it sets up the conceptual framework without getting bogged down in biological details. It helps to see the logical structure of a spandrel (by-product) argument in a non-biological context.
       - Risk: The metaphor might remain ornamental and not be applied to biology.
     - Organism first:
       - Case for: Starting with a biological trait (like the example of the chin) grounds the discussion in the subject matter and avoids the risk of the metaphor being misunderstood or not transferred.
       - Risk: Students might get stuck on the empirical details of that trait and not see the general logical point.
     - Recommendation: **Organism first**.
     - Reason: The primary risk with the architectural analogy is that it might not be cashed out in biological terms, which has happened in previous sessions. Starting with a concrete biological example (the chin) will anchor the discussion in the life sciences, and then the architectural analogy can be introduced to clarify and generalize the logic. This order also addresses the biologists' potential dismissal of the paper as mere philosophy.

  3. **Carrying Case**:
     - Case: **The human chin** (as discussed in the paper).
     - Must have: 
       - Clearly a by-product of other changes (mandibular reduction) that is non-adaptive in origin.
       - Has been the subject of adaptationist claims (e.g., for sexual selection) that can be critically evaluated.
       - Is simple and familiar to students.
     - Must lack:
       - A clear, uncontested function (so it doesn't degenerate into "we haven't found the function yet" or "obviously adaptive").
       - Complicated developmental pathways that would require deep biological knowledge.
     - Can support co-optation: Yes, because one can discuss how the chin might later have been used in sexual selection (if at all) even if it originated as a spandrel.
     - Limitations: The human chin example is not universally accepted as a spandrel; some adaptationist arguments persist. Also, it might be too simple to illustrate all the nuances.
     - Fallback cases: If needed, we can divide labour:
       - For illustrating the spandrel argument: **Human chin**.
       - For co-optation: **Feathers** (initially for thermoregulation, then co-opted for flight). But note: feathers are not a spandrel in the same way, so we must be careful. Alternatively, use **male nipples** as a by-product of developmental constraints (which are not adaptive in males) but then note they can be co-opted (e.g., for sexual display? though not typically). However, the paper does not discuss male nipples, so we stick to the chin for co-optation potential.

     Given the constraints, we'll use the chin as the main case and note that co-optation is possible but not necessarily strong in this example. We can briefly mention that the paper discusses other cases where a spandrel is co-opted (e.g., the spandrels of San Marco were decorated, so they acquired a function). But for the chin, co-optation is speculative.

     Alternatively, we can use the **snail shell coiling** example from the paper? But that might be too biological and less accessible. The chin is better.

     We decide: The chin can do the job for the spandrel argument and can be used to discuss co-optation (even if weakly). If we must divide, we use:
       - Fallback case 1: Chin (for spandrel argument and burden of proof)
       - Fallback case 2: The spandrels of San Marco (for co-optation: they were decorated and thus acquired a function)

     However, the requirement is for one case. So we'll note that the chin can support co-optation in principle (even if not definitively) and if needed, we can refer to the architectural example for co-optation.

  4. **Four Styles**:
     The paper identifies four alternatives to adaptationist explanations: (1) non-adaptive traits fixed by genetic drift, (2) adaptive traits that are not direct adaptations but by-products of other adaptations (spandrels), (3) traits that are the result of developmental constraints, and (4) traits that are the result of phyletic constraints (phylogenetic inertia).

     We present each as:
     - Style: [name]
     - What it establishes: [what it shows as an alternative]
     - Teach when: We will let them emerge from the case (emergent) because then they are grounded in the example. But the taxonomy might be too abstract if given in advance.
     - Weakest flag: We note that one of them is weaker in evidentiary terms? The paper does not rank them, but note that genetic drift is often harder to prove and might be seen as a default when adaptation is not found. Also, the paper criticizes the use of "phyletic inertia" as a catch-all. But the one that invites absence of evidence to evidence of absence is probably the "genetic drift" argument? Actually, all can be misused, but the drift argument might be the one where absence of evidence (for adaptation) is taken as evidence for drift. So we flag that.

     We'll do:
     - Array of four objects:

       [{
          "style": "Genetic drift",
          "what_it_establishes": "That a trait can be fixed in a population without selective advantage.",
          "teach_when": "emergent",
          "weakest_flag": "Can be misused to infer drift from mere absence of evidence for adaptation; requires positive evidence for drift (e.g., neutral theory)."
        },
        {
          "style": "Spandrels (by-products)",
          "what_it_establishes": "That a trait can arise as a non-adaptive consequence of other adaptive changes.",
          "teach_when": "emergent",
          "weakest_flag": null
        },
        {
          "style": "Developmental constraints",
          "what_it_establishes": "That the range of possible phenotypes is limited by developmental processes, so not every trait is optimised by selection.",
          "teach_when": "emergent",
          "weakest_flag": null
        },
        {
          "style": "Phyletic constraints (phylogenetic inertia)",
          "what_it_establishes": "That traits may be present because of ancestral history rather than current adaptation.",
          "teach_when": "emergent",
          "weakest_flag": "Can be a catch-all if not supported by phylogenetic analysis; requires evidence from comparative methods."
        }]

     We flag genetic drift and phyletic constraints as potentially weak if not properly supported. But the user says one in particular invites inference from absence of evidence to evidence of absence. That is genetic drift: if we don't find evidence for adaptation, we might jump to drift without evidence. So we flag genetic drift as the weakest in that sense.

     However, note the paper says: "We would not object so strenuously to the adaptationist programme if its invocation, in any particular case, could lead in principle to its rejection for want of evidence." So the issue is that adaptationism doesn't consider these alternatives. We are to teach the four styles and flag the one that is most prone to the absence-of-evidence fallacy.

     We choose to flag genetic drift.

  5. **Misconceptions**:
     We address four:

     a) Misconception: The critique is anti-adaptationism (i.e., against the idea of adaptation) rather than a critique of a style of argument (adaptationist programme).
       - Audience: Both (but especially biologists might think the paper is anti-adaptation).
       - Trigger point: When introducing the paper's thesis after the prerequisites and the carrying case.
       - Defusal: Explicitly state: "Gould and Lewontin are not against the study of adaptation, but against a particular methodological approach that assumes without sufficient evidence that every trait is an adaptation. They are advocating for considering alternatives." 
       - Cost of defusing there: It might break the flow of the case discussion, but it's necessary to frame the entire discussion.

     b) Misconception: A spandrel cannot be useful, or cannot be elaborated by later selection.
       - Audience: Both.
       - Trigger point: When discussing the chin and the possibility of co-optation.
       - Defusal: Point out that in the architectural analogy, the spandrels were decorated and thus became useful. Similarly, a biological spandrel might be co-opted for a function. The key is the origin, not the current utility.
       - Cost: It might complicate the initial understanding of spandrels as non-adaptive at origin.

     c) Misconception: The paper licenses the inference from "no proposed function" to "not an adaptation".
       - Audience: Both, but especially philosophers who might think that the absence of a proposed function is enough to reject adaptation.
       - Trigger point: When discussing the four styles and how to break the chain of adaptationist reasoning.
       - Defusal: Emphasize that the paper calls for a proper null hypothesis and burden of proof. The absence of evidence for adaptation does not prove it is a spandrel; it just means we should consider alternatives and not assume adaptation without evidence. We must test the alternatives too.
       - Cost: It might undermine the force of the critique for students who want a simple rule.

     d) Misconception: The whole debate was a philosophical fuss about nothing (biologists' conviction that the controversy was settled in their favour).
       - Audience: Biologists.
       - Trigger point: At the end, when summarizing the impact.
       - Defusal: Point out that the paper has shaped evolutionary biology by encouraging more rigorous testing and consideration of alternatives, and that modern evolutionary biology incorporates these critiques (e.g., in evo-devo). The debate was not settled but led to a more nuanced view.
       - Cost: It might come too late, but it's important for closure.

  6. **Omissions**:
     We omit:

     a) The comparative method machinery for detecting phylogenetic inertia.
       - Why unsuitable: It is a technical detail that requires background in phylogenetics and is beyond the scope of a 90-minute seminar focused on the logical structure.
       - How to announce: "We are setting aside the technical apparatus of comparative methods to focus on the conceptual argument."

     b) Architectural niceties (pendentives vs. spandrels).
       - Why unsuitable: It is a historical footnote that does not affect the logical point of the analogy.
       - How to announce: "We are using 'spandrel' in the broad sense as Gould and Lewontin did, without delving into the precise architectural terminology."

     c) The contested empirical verdicts and the charge that adaptation is more pervasive.
       - Why unsuitable: The seminar is about the structure of the argument, not the current state of the empirical debates. Also, without more reading, students cannot evaluate this.
       - How to announce: "We are bracketing the ongoing empirical debates to focus on the logical and methodological contributions of the paper."

  7. **Closing Check**:
     - Question: "Suppose an adaptationist claims that the human chin is an adaptation for sexual selection. How would Gould and Lewontin's critique apply to this claim? What alternative explanation would they offer, and what evidence would be needed to support either view?"
     - What a good answer shows: It shows understanding that the critique requires the adaptationist to provide evidence beyond mere utility, and that the alternative (spandrel) is a by-product of mandibular reduction. Also, that the burden of proof is on the adaptationist and that the spandrel explanation must also be tested. It should also note that the chin might have been co-opted for a function even if it arose as a spandrel.
     - What a fluent bad answer sounds like: "The chin is a spandrel, so it's not an adaptation. Gould and Lewontin would say the adaptationist is wrong because they always assume everything is an adaptation. The alternative is that it's a spandrel, and since no one has proven it's for sexual selection, it's not." (This misstates the burden of proof, implies that absence of evidence is evidence for spandrel, and does not consider co-optation.)

  Now, we write the JSON accordingly.
