prompt: |-
  Third year, political theory, and my chapter is on democratic boundaries. My supervisor read my reconstruction of the case against the all-affected principle and said something like "if this works you've refuted every legitimacy principle with a causal premise, including the one you're planning to fall back on." I think she might be right and I can't find the break. Here's the chain:

  (1) A collective decision is legitimate only if everyone whose interests it affects has a say in it, with the weight of their say proportional to how much the decision affects them.

  (2) A decision affects someone's interests iff it makes some nonzero difference to how well that person's life goes.

  (3) In a causally dense world, any decision by any collective body makes some nonzero difference to the lives of indefinitely many agents — including ones who don't exist yet, and arguably many sentient nonhumans.

  (4) So legitimacy requires distributing say-weight over an unbounded and unspecifiable population.

  (5) But you can't distribute weight over a set you can't specify, and you can't specify the set by decision either: deciding who's in the set is itself a decision affecting everyone in the same unbounded way, so you'd need a demos to constitute the demos, and a demos to constitute that one (the Whelan-style regress).

  (6) Therefore no collective decision is legitimate.

  (7) (6) is not a conclusion I can live with, so (1) is false — the all-affected principle isn't a principle of legitimacy, it's a principle of paralysis.

  Two things bother me. First, (1)–(6) seem to run just as smoothly against the all-subjected principle (Abizadeh, López-Guerra and co.), since being subjected to a coercive order is also a causal notion with fuzzy edges — so a sound version of this argument takes out my fallback too. Second, my own proposed repair is a threshold: swap (2) for "affects" meaning "makes a difference above some ε." But then I run into an aggregation problem — a single decision might move someone's interests by less than ε, while the same body's decisions over a decade move them by a lot, and I can't see how to set ε without either making the demos collapse to the citizenry by fiat or letting it balloon again. So my repair looks like it just relocates the arbitrariness the all-affected principle was supposed to remove.

  Which step is actually the weak one? I'd rather keep (1) and (3) if it comes to that, and I definately don't want to accept (6), but I'll take the hit if I have to. What I want is the pricing:

  - If the problem is in (2) — i.e. "affects" was never meant as a bare causal claim — what exactly does the normatively-loaded reading add, and can I still keep the intuition that motivates all-affected in the first place (that it's arbitrary to bind people who had no hand in binding themselves)? Or does loading "affects" normatively make the principle circular, with legitimacy explaining inclusion and inclusion explaining legitimacy?
  - If the problem is the slide from (4) to (5), i.e. unbounded and hard-to-specify aren't the same as undistributable — does proportionality weighting actually rescue it? Can total weight converge over an infinite affected set the way a convergent series does, and if so does that give you a real procedure or just a formal trick that no institution could run?
  - Is (7) even a fair move? It treats (1) as the only premise that can go, but (3) is contingent and (5) has an ought-implies-can hidden in it. If (7) is a false dilemma, say so and tell me what the honest conclusion of (1)–(5) actually is.
  - And my supervisor's specific charge: she thinks the proportionality clause in (1) is doing all the dirty work and that bare inclusion (everyone affected gets *a* say, no weights) doesn't generate (4) at all. I can't see it. Is she right, and if she is, what does the argument look like once you strip the weights out?
reasoning: |-
  Okay, the user is tackling a complex problem in political theory about democratic boundaries. They're a third-year student working on the all-affected principle, and their supervisor pointed out a critical flaw that could undermine their entire argument. The user has reconstructed a logical chain leading to the conclusion that no collective decision can be legitimate, which is unacceptable. They're stuck and need help identifying the weak link.

  First, I need to understand the chain they've presented. The argument starts with the all-affected principle (AAP) requiring proportional say based on affected interests. Then it defines "affects" as any nonzero causal difference. In a causally dense world, this leads to an unbounded affected population. Since you can't distribute voting weight over such a population, and attempting to define the demos creates a regress, legitimacy becomes impossible. The user rejects this conclusion, so AAP must be false.

  The user has two main concerns. First, the same argument seems to apply to the all-subjected principle, which was their fallback position. Second, their threshold solution (replacing nonzero effect with significant effect) runs into aggregation problems where small effects accumulate over time.

  The user is asking which step is weak and provides several options to evaluate. They want to preserve certain intuitions while avoiding paralysis. Their supervisor suggested the proportionality clause in (1) might be the problem.

  I should analyze each step carefully. Starting with (2): defining "affects" as any nonzero causal difference is indeed problematic. In political theory, "affected interests" usually carries normative weight - not every butterfly-effect level change counts. For example, a tax policy in Canada might technically affect me through global markets, but that's not the kind of effect that should grant me voting rights there. Normative accounts like Goodin's or Arrhenius' focus on substantial, direct, or morally relevant effects. This could solve the unbounded population problem.

  Looking at the move from (4) to (5): assuming an unbounded population makes vote-weight distribution impossible. But mathematically, proportional weights could converge if effects diminish sufficiently (like a convergent series). Practically, institutions use proxies like territory or subjection. The principle doesn't require perfect implementation, just the best feasible approximation.

  The ought-implies-can premise in (5) is crucial. If a principle demands the impossible, it's the principle that needs adjustment, not the conclusion that legitimacy is unattainable. Democratic theory accepts practical compromises.

  For (7), it's not a true dilemma. The argument has multiple weak points, so rejecting (1) entirely is premature. We can modify other premises instead.

  Regarding the supervisor's point about proportionality: without weights, the unbounded population might still get a vote, but equal votes could work if we can identify the set. However, specification remains problematic. More importantly, proportionality intensifies the problem by requiring precise measurement of effects. Bare inclusion might be more feasible, but still faces the regress issue when constituting the demos.

  The user's threshold solution has merit but needs refinement. We can define "significant effect" contextually, considering directness, intensity, and alternatives. Aggregation issues can be addressed by focusing on subjection to ongoing authority rather than isolated decisions.

  Ultimately, the best path is to reject the purely causal definition in (2) for a normative one, while acknowledging practical limitations. The all-subjected principle may avoid some issues but introduces its own boundary problems. The key is balancing moral ideals with institutional feasibility.
answer: |-
  You've hit the core paradox of democratic boundary-setting brilliantly, and your supervisor is sharp to push you on it. The chain (1)-(7) *is* powerful, but it relies on contestable premises and interpretations. Let's break it down step-by-step, identify the weakest links, and price the fixes – especially given your concerns about proportionality and your fallback position.

  **The Core Weakness: Premise (2) - The Purely Causal Interpretation of "Affects"**

  This is the most vulnerable step. Premise (2) (`affects = any nonzero causal difference`) is **empirically plausible but normatively unsustainable** for a legitimacy principle. It conflates metaphysical causality with morally/politically relevant "affectedness."

  *   **The Problem:** (3) is likely true in a causally dense universe. But legitimacy principles aren't physics equations. "Affected interests" in political theory (Dahl, Goodin, Arrhenius) carries *normative weight*. It implies an effect significant enough, direct enough, or of a specific *type* (e.g., autonomy-undermining, welfare-impacting above a threshold) to generate a moral claim for inclusion or voice. My trivial life being microscopically altered by a zoning decision in Jakarta doesn't generate the *same kind of claim* as the Jakarta resident whose home is bulldozed.
  *   **What the Normatively-Loaded Reading Adds & Solves:**
      *   **Breaks the Chain at (3)/(4):** It drastically shrinks the relevant "affected" set from "indefinitely many agents" to those experiencing *morally salient* effects (e.g., significant impact on autonomy, core welfare, life prospects). This makes the set potentially bounded or at least practically specifiable (e.g., residents, those subject to enforcement).
      *   **Preserves the Core Intuition:** The core intuition of AAP ("it's arbitrary to bind people who had no hand in binding themselves") is *itself normative*. It targets *significant binding*, not butterfly effects. The normatively loaded interpretation *captures* this intuition precisely by focusing on effects that constitute "binding" or significant imposition.
      *   **Avoids Circularity (Mostly):** It's not *inherently* circular. You define "morally salient effects" *independently* of the legitimacy of the decision-making process itself. For example:
          *   **Autonomy-Based:** Effects that restrict fundamental liberties or life choices.
          *   **Welfare-Based:** Effects exceeding a threshold of impact on well-being (though this faces your aggregation concern, see below).
          *   **Subjection-Based (preview):** Effects constituting subjection to coercive rules (linking to your fallback).
      *   **Example:** The US Federal Reserve's interest rate decision *causally* affects global markets, and thus my pension fund slightly. But the *morally salient* effect on me is trivial and indirect compared to its effect on US borrowers, savers, and workers directly governed by the US economy. AAP, interpreted normatively, wouldn't demand a global vote.

  **Other Weak Points & Your Specific Questions**

  1.  **The Slide from (4) to (5) (Unbounded -> Undistributable):**
      *   **Is it weak? Yes.** Even with a *normatively* unbounded set (e.g., future generations), proportionality *can* conceptually work mathematically (like convergent series). However:
          *   **Formal Trick vs. Procedure:** It's primarily a formal trick. No real institution could calculate or implement weights for an infinite/indefinite set. It rescues logical possibility, not practical feasibility.
          *   **Rescues AAP? Partially.** It shows the *principle* isn't logically incoherent *if* (2) is fixed normatively and effects diminish sufficiently. But it doesn't solve the *constitutive* regress (needing a demos to define the demos) for the *initial* boundary setting.
          *   **Practical Solution:** Real democracies use *proxies* for normatively salient affectedness (residency, citizenship, territorial jurisdiction) which are imperfect but feasible. AAP justifies *expanding* these proxies when effects are clear and significant (e.g., granting suffrage to resident non-citizens).

  2.  **Premise (5) & Ought-Implies-Can:**
      *   **The Hidden Premise:** (5) relies on "ought implies can." If distributing weight over an unspecifiable set is impossible, then AAP (interpreted causally) cannot be a valid *feasible* legitimacy principle.
      *   **Honest Conclusion of (1)-(5):** The *honest* conclusion is **not (6)**, but: "A purely causal interpretation of the All-Affected Principle (AAP) generates an unsolvable practical and conceptual problem for constituting a legitimate demos and is therefore an inadequate *feasible* principle of democratic legitimacy." This points to needing a *different interpretation* (normative) or a *different principle* (like All-Subjected).

  3.  **Premise (7) as False Dilemma:**
      *   **It *is* a false dilemma.** Rejecting (1) entirely is too drastic. The argument shows the *causal interpretation* of AAP fails. It doesn't prove *all* versions of AAP fail, nor does it mean *no* legitimacy principle is possible. Alternatives (like normative AAP or All-Subjected) remain live options. The honest move is to reject *the interpretation* in (2), not necessarily the core intuition behind (1).

  4.  **Your Supervisor's Charge: Proportionality vs. Bare Inclusion**
      *   **She is partially right, and this is crucial.** Proportionality *intensifies* the problem, but bare inclusion *doesn't eliminate it*. Let's break it down:
          *   **With Proportionality (Your (1)):** (4) becomes "legitimacy requires distributing *differing weights* of say over an unbounded population." This requires *measuring* individual effects to assign weight. This is *impossible* for an indefinite set, even normatively defined, due to measurement problems and the constitutive regress. **Proportionality is a major driver of (5)'s force.**
          *   **With Bare Inclusion (Supervisor's Suggestion):** Amend (1) to: "A collective decision is legitimate only if everyone whose interests it *[normatively]* affects has *a say* (equal vote)."
              *   (4) becomes: "So legitimacy requires *enfranchising* an unbounded and unspecifiable population." (Still problematic).
              *   (5) becomes: "But you can't enfranchise a set you can't specify, and you can't specify the set by decision either: deciding who's enfranchised is itself a decision affecting everyone in the same unbounded way, so you'd need a demos to constitute the demos..." **The constitutive regress (Whelan) remains.** The problem of *constituting the initial demos* is still fatal for the *causal* interpretation, even without weights.
          *   **Why She's Right (and Why It Matters):** Stripping proportionality *reduces* the problem from the impossible (measuring and weighting infinite effects) to the merely intractable (enfranchising an indefinite set). It highlights that the *core* boundary problem lies in the *constitutive regress* triggered by the causal interpretation, not *just* the weighting. Proportionality makes it worse, but it's not the *only* source of paralysis. **The argument without weights still gets you to the regress in (5), making legitimacy (under a causal AAP) impossible to *constitute*.**

  **Your Threshold Repair & Aggregation Problem**

  Your instinct is good, but your diagnosis of the problem is correct. Shifting (2) to `difference above some ε`:
  *   **Advantage:** Directly addresses the normative salience point. It tries to filter out trivial effects.
  *   **Problem (Aggregation):** Spot on. How to handle:
      *   **Multiple Small Effects:** Dozens of decisions, each below ε, cumulatively exceeding ε? (Requires tracking individuals across many decisions - infeasible).
      *   **Temporal Scope:** Does "decision" mean a single vote, a policy package, a legislative session, a regime? Setting the temporal scope is arbitrary.
      *   **Setting ε:** Yes, this seems arbitrary. Too high, and you exclude people experiencing real harms (collapsing towards citizenry). Too low, and you're back in the causal soup (ballooning).
  *   **Mitigation:** A threshold *can* work if combined with:
      1.  **Normative Salience:** Define ε not just quantitatively, but qualitatively (impact on autonomy, basic needs, exposure to coercion).
      2.  **Focus on Subjection:** Link the threshold to being *subject to the authority's ongoing coercive power*. This bundles many potential effects into a single status (addressing aggregation). This is the bridge to the All-Subjected Principle.
      3.  **Proxies:** Use feasible proxies for normatively significant affectedness *above the threshold*: residency, legal subjection, citizenship. AAP then becomes a critical tool for arguing these proxies should be *expanded* when clear threshold-crossing effects exist outside them (e.g., colonies, occupied territories).

  **The All-Subjected Principle (ASP) Fallback & Causal Fuzziness**

  Your supervisor is right that a *purely causal* interpretation of "subjection" (e.g., any causal impact from coercion) would face similar boundary fuzziness. However, ASP proponents (like Abizadeh) *explicitly* give it a **normative/political interpretation** to avoid this:

  *   **"Subjected" means:** Being *bound by* and *answerable to* the coercive rules of a specific political order. It's about being *under its authority*, not just causally impacted by its actions.
  *   **Why it (Partly) Escapes:**
      *   **Focus on Authority:** It defines the demos based on who is *already claimed as subject* by the coercive order. This cuts the constitutive regress – the existing (however imperfectly constituted) authority defines its own subjects *by its actions* (applying rules to them). You challenge the *justice* of that boundary, not the *feasibility* of defining it.
      *   **Sharper (though not perfect) Boundaries:** While there can be edge cases (e.g., temporary visitors, disputed territories), "being subject to enforcement" is generally more bounded than "being causally affected." It focuses on the direct objects of coercion.
      *   **Handles Aggregation:** Subjection is an *ongoing status*, not the sum of individual decisions. You're either subject to the state's laws or you're not. This avoids the aggregation problem inherent in threshold AAP for individual decisions.
  *   **ASP's Vulnerability:** It still faces:
      *   **Edge Cases:** Who exactly counts as subject? (e.g., tourists, digital nomads, those in illegally occupied territories?).
      *   **The "Why Subject *Them*?" Question:** AAP provides a *reason* (affectedness) why boundaries might be unjust. ASP needs its own normative justification for why *this* set of subjects is the right one (often resting on territoriality or consent, which have their own issues).
      *   **Non-Citizen Subjects:** If ASP demands inclusion for all subjected, it often requires expanding suffrage beyond citizens (e.g., to permanent residents), which many states resist.

  **The Pricing & Path Forward**

  1.  **Weakest Link:** **Premise (2) - The purely causal interpretation of "affects."** This is the primary driver of the absurd conclusion. Rejecting this is necessary and allows you to preserve the core normative intuition of AAP.
  2.  **Essential Adjustment:** **Adopt a normatively-loaded interpretation of "affected interests."** Focus on morally salient effects (autonomy, significant welfare impact, subjection). This shrinks the relevant set, breaks the chain at (3)/(4), and avoids paralysis. Justify your chosen normative criteria.
  3.  **Address Proportionality:** **Seriously consider dropping proportionality.** Your supervisor is insightful here. Proportionality is a major source of the measurement/convergence problem and isn't strictly necessary for the core anti-arbitrariness intuition. Bare inclusion (equal vote) for the normatively affected set is a stronger, more feasible position. If you keep proportionality, be brutally honest about its severe practical limitations and the need for radical simplification (e.g., categorizing effects into broad bands).
  4.  **Refine the Threshold/Repair:** **Integrate your threshold idea with the normative interpretation and ASP.** Don't just set an arbitrary ε. Define "significant effect" normatively (e.g., impact on autonomy or core welfare equivalent to being subjected to coercion). Acknowledge that *feasibility* requires using proxies (like territorial residence or legal subjection) as imperfect indicators of normatively significant affectedness/subjection. AAP then becomes a critical standard for *evaluating and reforming* these existing boundaries, not a blueprint for atomistic recalculation for every decision.
  5.  **Confront ASP Honestly:** **Acknowledge that ASP also requires a normative (not purely causal) interpretation of "subjection" to avoid similar problems.** Argue why your normatively-loaded AAP might be superior, or why a normatively-loaded ASP is a more feasible fallback *precisely because* it bundles effects into a status and cuts the constitutive regress by accepting the existing authority's claim (while subjecting that claim to critique). Focus on how the *constitutive regress* hits causal AAP harder than normative ASP.
  6.  **Reject (6) & (7):** Conclude not that legitimacy is impossible, but that a *purely causal* AAP is an inadequate *foundational principle for constituting the demos* because it leads to paralysis. Legitimacy requires principles (like normative AAP or ASP) that balance moral inclusion with practical feasibility and offer a solution to the constitutive problem. The argument successfully refutes causal AAP and highlights the profound difficulty of boundaries, but not the impossibility of legitimate decision-making.

  **In short: Ditch the bare causal "affects." Embrace normative salience explicitly. Drop proportionality to survive. Use your threshold within a normative framework tied to feasible proxies or subjection. Your supervisor identified a critical flaw, but it points the way to a stronger, more nuanced defense of democratic inclusion.** Good luck! This is tough but excellent work.
