  The user is likely a scholar in linguistics, philosophy, or publishing ethics. They want a thorough analysis using speech act theory, highlighting tensions in the practice. Their deeper need might be understanding how institutional practices manage truth and accountability. They might also be interested in how speech acts function in authoritative contexts versus everyday communication. 

  I need to ensure each part of the query is addressed: the act type, felicity conditions, marking vs. deleting, uptake, the dual function, and changes if reasons are dropped. Separate settled from contested points clearly. Avoid presenting disputed ideas as consensus. Use Austin and Searle as foundations but note where theorists disagree, like on the necessity of sincerity or uptake for declarations.
answer: |-
  The retraction practice presupposes a nuanced account of speech acts drawing primarily on J.L. Austin's *How to Do Things with Words* and subsequent refinements. Below is a reconstruction separating settled points from contested theoretical issues, addressing each component of the query:

  ### 1. **What Kind of Act is a Retraction?**  
     - **Settled View**: Retraction is a **declarative act** (Austin’s "verdictive" + "exercitive" in Searle’s revised taxonomy). It alters the *de jure* status of the paper within the academic record.  
     - **Mechanism**:  
       - It **withdraws the journal’s endorsement** implied at publication (a prior illocutionary act of "asserting" the paper’s validity).  
       - It **warns readers** (perlocutionary goal) but primarily **reclassifies the document** as invalidated.  
       - The paper remains online to maintain transparency, but its institutional standing is revoked.  
     - **Contested Issue**: Whether retraction is *purely* declarative or hybrid. Some argue it combines a declaration (status change) with a directive ("do not cite as reliable"). Consensus leans toward declarative primacy.

  ### 2. **Felicity Conditions**:  
     - **Core Conditions (Settled)**:  
       - **Authority**: The journal must hold institutional legitimacy.  
       - **Procedure**: Explicit notice, watermarking, and linkage.  
       - **Grounds**: Demonstrable unreliability (error, fraud, plagiarism).  
     - **Initiation by Non-Authors/Unwilling Authors**:  
       - Felicity depends on **journal authority**, not author consent. A retraction by editors/institutions is valid if procedurally correct (e.g., COPE guidelines).  
       - Author death/unwillingness voids *sincerity* but not *validity* (see §4 on sincerity debates).  

  ### 3. **Marking vs. Deletion & Uptake**:  
     - **Why Mark?**:  
       - Deletion would imply erasure of error, violating "correct the literature" aims. Physical persistence serves historical/audit purposes.  
       - Watermarking is a **constitutive signal** of the declaration, akin to a legal stamp on a voided document.  
     - **Uptake**:  
       - **Settled**: Uptake (reader acknowledgment) is *not* a felicity condition for the act’s **success** (the status change occurs upon publication of the notice).  
       - **Contested**: Uptake is critical for **effectiveness** (correcting citations). Failed uptake (e.g., citations continuing) signifies perlocutionary failure but *not* illocutionary invalidity.  

  ### 4. **The Dual Function: Disclaiming Blame vs. Assigning Cause**:  
     - **Settled Analysis**: The notice performs **two distinct acts**:  
       - *Act 1 (Declarative)*: Retraction (status alteration).  
       - *Act 2 (Assertive)*: Stating the cause (error/misconduct).  
     - **Why Bundle Them?**:  
       - Epistemic necessity: Knowing *why* the paper is unreliable informs **reader trust** (e.g., misconduct taints all author work; error may be isolated).  
       - "Retraction with replacement" explicitly decouples the two, allowing correction *without* blame.  
     - **Contested Sincerity**:  
       - If the journal states "no blame" while implying misconduct, is there a sincerity violation? Some argue retraction has **no sincerity condition** (unlike apologies); others contend assigning cause imposes one.  

  ### 5. **Dropping the "Reason" Field: Implications**:  
     - **Necessary Changes**:  
       - **Loss of epistemic nuance**: Readers couldn’t distinguish corrigible errors from fraud.  
       - **Increased use of "replacement"**: Honest errors would require a new paper, complicating the record.  
       - **Shift to institutional signaling**: Cause might be inferred from who initiated retraction (e.g., author-initiated = error; institutional = misconduct).  
     - **Effect on Speech Acts**: The declarative act (retraction) remains intact, but the bundled assertive act (cause) vanishes, reducing informational utility.  

  ---

  ### Theoretical Tensions (Unsettled Debates):  
  1. **Declarations as a Natural Class**:  
     - *Settled*: Retraction fits Searle’s "declaration" (status change by authority).  
     - *Contested*: Whether *all* declarations (e.g., excommunication vs. retraction) share core features. Some argue journal retractions are "hybrid" due to their epistemic dimension.  

  2. **Sincerity Conditions**:  
     - *Settled*: Assertions about cause require sincerity (belief in stated reasons).  
     - *Contested*: Whether the retraction *itself* requires sincerity. Minimalists (following Austin) say no; normativists (like Searle) argue insincere retractions are "abusive" but valid.  

  3. **Uptake’s Role**:  
     - *Settled*: Uptake isn’t necessary for illocutionary success.  
     - *Contested*: Whether citations of retracted papers "re-instantiate" validity, implying uptake is constitutively required (rare view).  

  ### Summary  
  Retraction is a **procedurally governed declaration** that alters a paper’s standing, presupposing journal authority and epistemic accountability. Its felicity hinges on correct execution, not authorship or uptake. The dual act (retraction + cause statement) balances correction with transparency, though the latter invites debates about blame assignment. If reasons were omitted, the practice would lose critical nuance, shifting epistemic labor to readers. The core declarative act, however, remains intact—underscoring that institutional power, not consensus, enables retraction to "unmake" academic facts.
