  **How the Satire Functions (as per your request):**

  1.  **The Retreating Ladder:** Opens boldly as "a newly discovered masterwork attributed to the hand of Hendrik van der Velde." By the Note to Bidders, it's "within the immediate circle... potentially reflecting a lost prototype... or as attributable to his circle, possibly after a lost original."
  2.  **The Unspoken Creed ("Can't See, Doesn't Matter"):**
      *   *Lot Essay:* Praises the "masterful command," "unusually direct encounter with the artist’s touch," and "technical finesse that only a master... could achieve" – all based on visual qualities a forgery could replicate.
