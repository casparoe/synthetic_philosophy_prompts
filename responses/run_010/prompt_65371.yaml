  ## VERITAS & VALOR FINE ART | NEW YORK
  **Important Old Master Paintings | Sale 234 | Lot 37**

  **HENDRIK VAN DER VELDE (Utrecht 1612-1674 Dordrecht)**
  *Domestic Stillness with a Woman Peeling Apples, a Sleeping Cat, and a Delft Tile*
  Oil on oak panel
  13 ¾ x 11 ¼ in. (35 x 28.5 cm)
  Estimate: $800,000–$1,200,000

  **Lot Essay:**
  Veritas & Valor is exceptionally privileged to present this intimate jewel of the Dutch Golden Age, a newly discovered masterwork attributed to the hand of Hendrik van der Velde. Long obscured within a private European collection, this exquisitely preserved panel epitomizes the hushed poetry of the domestic interior, a genre in which van der Velde demonstrated unparalleled sensitivity. The composition reveals the artist's masterful command of light, filtering softly from an unseen window to caress the central figure – a young woman absorbed in the humble task of peeling apples. Her focused tranquility is echoed by the sleeping cat curled beside a warm *kache*, while a meticulously rendered Delft tile depicting a windmill provides a subtle counterpoint of blue against the warm, earthy tones of the interior. The palpable stillness, the almost tactile rendering of the wicker basket, the woman’s crisp cap, and the play of light on the simple pewter plate are all hallmarks of van der Velde’s mature style, particularly recalling the quiet intensity of his documented works from the 1650s. The panel’s remarkable condition (see Report) allows the viewer an unusually direct encounter with the artist’s touch, evident in the fluid brushwork defining the woman’s sleeve and the deftly suggested textures of wood and fur. This is not merely a depiction of objects; it is an invitation to contemplate the serene order and unassuming beauty of daily life, rendered with a psychological depth and technical finesse that only a master like van der Velde could achieve. Its emergence represents a significant addition to the corpus of this revered artist and offers a rare opportunity for the discerning collector.

  **Condition Report:**
  1.  Support: Single, vertically grained oak panel. Structurally sound. Minor, stable age cracks visible under raking light, consistent with period. Minor, old, stabilized woodworm activity (verso, lower edge), professionally consolidated.
  2.  Ground & Paint Layer: Ground intact. Paint layer exhibits a remarkably fresh and vibrant surface. Minor, pinpoint losses confined primarily to the extreme lower edge and along one stable age crack. A delicate, even craquelure pattern throughout, commensurate with age. Slight abrasion noted in the deepest shadows of the background, negligible to the overall composition.
  3.  Varnish: Recent, even, non-discolored synthetic varnish applied following minor surface cleaning. Presents an optimal viewing surface.
  4.  Pigmentation: Scientific analysis (XRF, microscopic examination) confirms the use of period-appropriate earth pigments (ochres, umbers), lead white, and vermilion. Of particular interest is the identification of ultramarine blue in the Delft tile. While its purity and particle size suggest a later refinement, its integration within the paint layer is seamless and technically sophisticated, potentially indicative of van der Velde’s experimental engagement with available materials or an exceptionally pure contemporary source. Its presence is entirely stable and contributes significantly to the work’s chromatic harmony.
  5.  Frame: Not original. Modern ebonized wood frame, in good condition.

  **Provenance:**
  (Property of a Distinguished European Collector)
  *   Presumed executed in Dordrecht, circa 1655-60.
  *   Private Collection, The Hague (by repute, inventory reference uncertain, c. 1720).
  *   Collection of Dr. Alistair Finch, London (acquired Paris, c. 1890).
  *   By descent within the Finch family, Surrey, England.
  *   Anonymous Sale [Name Withheld per Vendor Request], London, 12 June 1952, lot 114 (as "Follower of Hendrik van der Velde").
  *   Private Collection, Belgium (acquired at the above sale).
  *   Restored and conserved by Pieter van Hooghelande, Amsterdam, 1953 (receipt present, minor surface cleaning noted).
  *   By descent to the present owner (private European collection).
  *   Accompanied by a certificate of authenticity from Dr. F. Willemijn Scholte, dated 2022, referencing stylistic analysis and technical findings.

  **Note to Bidders:**
  Veritas & Valor Fine Art presents this lot after extensive research and technical examination. While scholarly consensus firmly places this sensitive and beautifully preserved work within the immediate circle of Hendrik van der Velde and potentially reflecting a lost prototype by the master himself, the attribution reflects the current state of research as detailed in the Lot Essay. The estimate reflects the painting’s exceptional quality, remarkable state of preservation, and significant art historical interest as a prime example of mid-17th century Dutch domestic interior painting. It should be noted that the minor presence of ultramarine exhibiting slightly atypical characteristics (Condition Report, point 4) does not detract from the overall integrity or aesthetic impact of the work; indeed, it presents a fascinating technical detail consistent with the period's exploration of materials. The painting is sold under the standard Conditions of Sale, which govern aspects including authenticity. Prospective bidders are strongly encouraged to inspect the lot personally to appreciate its fine quality. The work is catalogued as:
  **HENDRIK VAN DER VELDE (Utrecht 1612-1674 Dordrecht)**
  *Domestic Stillness with a Woman Peeling Apples, a Sleeping Cat, and a Delft Tile*
  **or as attributable to his circle, possibly after a lost original by the master.**

