prompt: |-
  I've gotten stuck in a rut arguing with my brother about whether it's actually wrong to eat meat, drive everywhere, or skip voting. His whole thing is "one person changes nothing, so you're off the hook," and I keep having intuitions pulling the other way but I can't say what they're tracking. Before I read anything else on this, write out the spec: what would a theory of individual responsibility in collective harm have to deliver to count as adequate — adequate for deciding what I should do, not just for winning the argument. I've been making up my own test cases, so use them and tell me which are genuine requirements and which are just me being squeamish:

  - a machine with 1000 buttons where yours is guarenteed to be one of 999 that do nothing, and one of them fires it, but nobody can tell which — you don't even know whether you triggered it
  - the landslide: your vote would have mattered only in a tie that didn't happen, and you couldn't have known that beforehand
  - the doomed pond: everyone else is definitely going to poison it anyway, so your not dumping changes nothing
  - the one-in-a-million: your act raises the odds someone gets hurt from 1 in 1,000,000 to 1 in 999,999
  - buying the last unit that tips an order vs. buying one in the middle of a huge order

  Also, which distinctions does it have to keep apart that people keep smushing together — causing vs contributing vs benefiting vs just being part of it, and whether "what if everybody did that" is a separate question or a cheat. Say for each requirement why it's a requirement. And most of all: is there some subset of these that can't all be satisfied at once, and which single requirement knocks out the most standard answers?
reasoning: |-
  Okay, the user is stuck in a philosophical debate with their brother about individual responsibility in collective harm situations. They're looking for a framework to evaluate actions like eating meat, driving, or not voting, where one person's contribution seems negligible. They want a theory that's practical, not just for winning arguments. 

  First, I need to unpack their core frustration. They have strong intuitions that their actions matter but can't articulate why their brother's "one person changes nothing" argument feels wrong. This isn't just academic—they genuinely want ethical guidance for daily decisions. Their test cases reveal they're grappling with probability, counterfactuals, and moral complicity.

  Hmm, their examples are clever stress tests for any theory: 
  - The button machine (epistemic uncertainty about causation) 
  - The landslide vote (retrospective irrelevance) 
  - The doomed pond (inevitability defense) 
  - The one-in-a-million (micro-probabilities) 
  - The supply chain tipping point (marginal impact vs. threshold effects)

  What they're really asking for is moral trigonometry—how to calculate individual angles in a collective harm polygon. The brother's view is like saying "one degree doesn't bend the circle." But circles don't exist in ethics—only fragile polygons.

  Key distinctions they want preserved:
  - Causing vs. contributing (direct vs. mediated harm)
  - Benefiting vs. participating (unjust enrichment vs. agency)
  - "What if everybody" as test vs. false equivalence

  The landmine here is that some requirements might conflict. For instance: 
  - If we say voting matters only when decisive (landslide case), that kills motivation for all but swing voters 
  - But if we say participation always matters symbolically, that might overmoralize trivial acts

  Ah—and the million-dollar question: which single requirement breaks most theories? Probably the "doomed pond." It forces us to choose between integrity ("clean hands") and consequentialism ("if outcome's fixed, why bother?"). Most theories implode on this rock.

  Their deeper need? To live in moral coherence without either grandiosity ("I singlehandedly save the planet") or nihilism ("nothing I do matters"). That's the tightrope walk.

  For the framework... must handle: 
  - Probabilistic harm (one-in-a-million) 
  - Symbolic value (voting as ritual) 
  - Participatory taint (benefiting from harm) 
  - Threshold effects (supply chains) 
  ...all without self-contradiction.

  The brother's mistake? Confusing "undetectable" with "nonexistent." Like saying a single photon doesn't light a room. True—but all light is made of photons.
answer: |-
  Here’s a specification for a theory of individual responsibility in collective harm, designed to resolve your dilemma. It prioritizes **practical adequacy** (guiding action) over rhetorical victory, using your test cases as constraints. The core challenge: reconcile negligible individual impact with moral intuition.

  ---

  ### **Essential Requirements for an Adequate Theory**  
  *(Why each is non-negotiable)*  

  1. **Handles Statistical Insignificance**  
     - *Must explain why acts with tiny/unknowable impact (e.g., "one-in-a-million") aren’t automatically exempt.*  
     - **Why required?** Your brother’s argument relies on marginal impact ≈ zero. A theory must reject "if Δ≈0, then responsibility=0" as ethically inert (e.g., climate change hinges on billions of micro-acts).  
     - *Test case: One-in-a-million* – Raising risk imperceptibly still *materially participates* in harm.  

  2. **Distinguishes Causation from Complicity**  
     - *Must separate:*  
       - **Direct causation** (you pull the trigger)  
       - **Contributory agency** (you enable/amplify harm)  
       - **Benefiting unjustly** (profiting from others’ harm)  
       - **Symbolic participation** (reinforcing harmful norms)  
     - **Why required?** Conflating these lets your brother argue "I didn’t *cause* the slaughterhouse" while ignoring complicity in its systems.  
     - *Test case: Buying the last unit* – Distinguish tipping-point harm (causation) from routine participation (complicity).  

  3. **Rejects Retrospective Irrelevance**  
     - *Must deny that outcomes determine responsibility.* Your vote matters *because it could have* changed the result, even if it didn’t.  
     - **Why required?** Otherwise, ethics becomes 20/20 hindsight (e.g., "you skipped voting, but the landslide means it didn’t matter").  
     - *Test case: Landslide vote* – Moral weight lies in *ex-ante* potential, not *ex-post* irrelevance.  

  4. **Addresses Overdetermined Harm**  
     - *Must explain why participating in guaranteed harm (e.g., "doomed pond") is still wrong.*  
     - **Why required?** "Others will do it anyway" can’t absolve you if participation expresses endorsement or corrupts character.  
     - *Test case: Doomed pond* – Dumping poison isn’t neutral; it signals acceptance of harm.  

  5. **Acknowledges Epistemic Limits**  
     - *Must assign responsibility when harm is probabilistic or uncertain (e.g., "button machine").*  
     - **Why required?** Real-world decisions (e.g., driving’s CO₂ impact) involve unknown thresholds. Ethics can’t require perfect knowledge.  
     - *Test case: Button machine* – Pressing the button is reckless even if your role is indeterminable.  

  6. **Clarifies the "What If Everybody?" Question**  
     - *Must treat it as a consistency test for universalizable maxims (Kant) or rule-utilitarian reasoning, NOT a claim about likely outcomes.*  
     - **Why required?** Your brother sees it as a cheat ("but everybody won’t do it!"). A theory must show it reveals *principles*, not predict collectives.  

  ---

  ### **Critical Distinctions the Theory Must Preserve**  
  *(Commonly "smushed" together)*  

  | **Distinction**               | **Why Separation Matters**                                                                 |  
  |-------------------------------|-------------------------------------------------------------------------------------------|  
  | **Causing vs. Contributing**  | Driving a car doesn’t *cause* climate disaster, but it contributes. Absolving contribution collapses all collective ethics. |  
  | **Participating vs. Benefiting** | Skipping voting avoids participation; eating factory-farmed meat *benefits* from harm. Benefit imposes distinct duties (e.g., restitution). |  
  | **Impact vs. Intent**         | Voting for a racist (minor impact) signals endorsement. Intent/expression matters beyond consequences. |  
  | **Marginal vs. Threshold Effects** | Buying the *last* burger (threshold) vs. one of millions (marginal). Thresholds demand stricter scrutiny. |  

  ---

  ### **The Incompatibility Problem**  
  **The doomed pond case (Requirement #4) is the killer.** Most theories fail here:  
  - **Consequentialism** (focus on outcomes) says: "If your act changes nothing, do it."  
  - **Kantianism** (duty-based) says: "Poisoning is always wrong, regardless of outcomes."  
  - **Virtue ethics** (character-focused) says: "Dumping makes you complicit, corrupting integrity."  

  **No theory satisfies all test cases perfectly:**  
  - If you prioritize *consequences* (e.g., utilitarianism), the doomed pond and landslide vote exonerate inaction.  
  - If you prioritize *duty* (e.g., deontology), the one-in-a-million case feels overscrupulous.  
  - If you prioritize *character* (e.g., virtue ethics), the button machine’s uncertainty undermines clear judgment.  

  **The single requirement that knocks out most answers: Retrospective Irrelevance (#3).**  
  - *Why?* Theories that tie responsibility *only* to actual outcomes (e.g., "your vote only matters in a tie") collapse in landslide cases. But if we reject this, we must ground responsibility in *potential* or *principle*—which strains statistical insignificance (#1).  

  ---

  ### **Adequacy Scorecard for Leading Theories**  
  | **Theory**               | Statistical Insignificance (#1) | Doomed Pond (#4) | Landslide Vote (#3) | Button Machine (#5) |  
  |--------------------------|----------------------------------|------------------|---------------------|---------------------|  
  | **Act Utilitarianism**   | ❌ (if Δ≈0)                     | ❌               | ❌                  | ⚠️ (if risk unknown) |  
  | **Rule Utilitarianism**  | ✅ (rules over acts)           | ⚠️ (unless rules forbid) | ✅                  | ✅                  |  
  | **Kantian Deontology**   | ✅ (duty > outcomes)           | ✅               | ✅                  | ❌ (uncertainty problem) |  
  | **Virtue Ethics**        | ✅ (character intact)          | ✅               | ✅                  | ⚠️ (depends on "prudent" assessment) |  
  | **Contractualism**       | ✅ (reasonable rejection)      | ✅               | ✅                  | ✅                  |  

  **Strongest candidate: Contractualism** (e.g., T.M. Scanlon).  
  - *Why?* Asks: "Could others reasonably reject your principle of action?"  
    - Eating meat/driving: Yes, if it imposes harm (even probabilistic) without necessity.  
    - Skipping voting: Yes, if it free-rides on others’ civic effort.  
    - Handles all test cases by focusing on *justifiability to others*, not impact size.  

  ---

  ### **What This Means For You**  
  Your intuitions track **participatory integrity**:  
  - **Eating meat/driving:** You benefit from and *sustain* harmful systems. Even if your boycott changes nothing, you avoid *corruption* by aligning actions with values.  
  - **Voting:** It’s a civic ritual affirming collective agency. Skipping signals apathy toward shared fate, regardless of impact.  
  - **Brother’s error:** He conflates *causal responsibility* (which may be negligible) with *moral responsibility* (which includes complicity, benefit, and symbolic alignment).  

  **Actionable takeaway:**  
  > You’re responsible not for *solving* collective harms alone, but for ensuring your acts don’t *contradict* their solution. "One person changes nothing" is false: you change *yourself*, your influence on others, and your participation in systems. That’s enough to matter.  

  Read: Derek Parfit on *moral mathematics* (collective harm), T.M. Scanlon on *contractualism*. Avoid theories ignoring uncertainty or overfitting to thresholds.
