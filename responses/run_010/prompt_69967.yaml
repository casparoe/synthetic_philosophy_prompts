  Looking at the cruxes the user wants included: First is the anomaly case - how systems handle errors in source texts compared to humans. The second is constrained poetry translation using Marot's "Ma mignonne" with specific formal constraints. The user also wants me to identify where language like "shallowness" or "understanding" might be smuggling in assumptions.

  For the agreement section, I need to find common ground. Both sides likely agree that current systems achieve surface fluency, that translation involves mapping between language systems, and that fluency alone isn't proof of understanding. I'll organize these into numbered points with concrete examples.

  For the disagreements table, I'll present each side's position in their own terms. The Hofstadter camp will emphasize the need for embodied experience to recreate meaning, while the competence camp will argue that systematic behavior under constraints defines understanding. I'll need to be careful with terminology here.

  For the cruxes, I'll develop two testable scenarios. For anomaly handling, I'll design an experiment with texts containing errors, measuring how systems handle them before and after fine-tuning. For the poetry challenge, I'll outline a blind evaluation by poets judging distinctness and acceptability of translations meeting strict formal constraints.

  I should flag where terms are "verbal" - meaning they carry unexamined baggage. "Understanding" is particularly tricky here, as both sides use it differently. I'll suggest replacing it with operational terms in test contexts.

  I'll use British English throughout as requested, and structure this as a workshop handout with clear sections. The joint statement should acknowledge the depth of their year-long debate while providing a framework to move beyond talking past each other through empirical testing.
answer: |-
  ## Joint Statement on Machine Translation: Points of Convergence & Testable Divergences

  **Preamble:**  
  After sustained discussion, our group recognises shared ground regarding current machine translation (MT) systems and core aspects of the translation task. We agree on observable phenomena and the insufficiency of surface fluency as proof of deeper capabilities. We also identify key, testable disagreements concerning the necessity of embodied experience and the nature of "understanding" in translation. This statement outlines our agreements, clearly states our divergent positions in mutually acceptable terms, and proposes concrete empirical tests ("cruxes") to adjudicate our core dispute.

  **Section 1: Points of Agreement (All Signatories)**

  1.  **Current MT Surface Fluency:** Contemporary large language model (LLM) based MT systems achieve remarkable fluency and grammatical coherence in their target language outputs for a vast range of non-specialised source texts. This fluency often surpasses earlier statistical or rule-based systems and creates a *prima facie* impression of comprehension.
  2.  **Translation Involves Mapping & Transformation:** Translation is not a simple word substitution but requires mapping complex linguistic structures, conventions, idioms, and contextual cues from one language-culture system into another. This process often necessitates significant transformation to achieve functional equivalence.
  3.  **Fluency is Weak Evidence for Deep Understanding:** High fluency in the output is insufficient evidence that an MT system possesses human-like understanding of the source text's meaning, its cultural resonances, the author's intent, or the lived context potentially embedded within the language. Fluency can mask significant semantic errors or shallow processing.
  4.  **MT Handles Routine Context Well (Often):** For texts operating within highly conventionalised domains (e.g., news reports, technical manuals, standard correspondence) and relying on explicit, unambiguous context, modern MT often performs adequately or even well in conveying the primary propositional content.
  5.  **Anomaly Handling is a Key Challenge:** MT systems frequently fail to robustly handle source text anomalies (errors, inconsistencies, atypical presuppositions) that would cause human translators to pause, flag uncertainty, or seek clarification/correction. MT tends to "smooth over" anomalies, producing fluent but potentially incorrect or nonsensical outputs.
  6.  **Constrained Form is Difficult:** MT systems struggle significantly with translating texts requiring adherence to strict formal constraints (e.g., specific metre, rhyme scheme, syllable count, acrostics) while preserving meaning and naturalness. Human translators find this challenging but possible through creative re-creation; current MT typically fails or produces awkward, constraint-violating outputs.

  **Section 2: Disagreements Table**

  | Claim                                                                 | Position A ("Embodied Recreation")                                                                 | Position B ("Competence Under Constraints")                                                                 |
  | :-------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------- |
  | **1. Necessary Condition for Faithful Translation:**                  | Faithful translation *requires* the ability to reconstruct the source's associative penumbra (cultural, embodied, experiential connotations) within the target culture. | Faithful translation *requires* the ability to reliably map source meaning to target meaning under the relevant linguistic and contextual constraints. |
  | **2. Role of Embodiment/Lived Experience:**                           | Possessing a body and a human-like life history is *causally necessary* for accessing and reconstructing the full meaning potential carried by natural language, especially its connotative layers. | Embodiment/life history may correlate with human performance but is *not causally necessary* for the functional capability of translation; competence arises from pattern recognition and processing within the linguistic system. |
  | **3. Nature of "Understanding" in Translation:**                      | Genuine understanding involves an internal grasp of meaning grounded in potential or simulated experience, enabling flexible, context-sensitive interpretation and recreation beyond pattern matching. | "Understanding" is operationally defined as the demonstrable competence to correctly map inputs to outputs within a domain; internal states are irrelevant if the external behaviour meets the task constraints. |
  | **4. Interpretation of MT Output Fluency:**                           | MT fluency primarily demonstrates sophisticated statistical pattern matching and surface structure manipulation, *not* comprehension of meaning grounded in world experience. | MT fluency *is* evidence of a form of linguistic understanding, specifically the system's competence in navigating the statistical regularities and structural rules of language pairs. |
  | **5. Potential of Current Architectures (LLMs):**                     | LLMs, lacking embodiment and genuine subjective experience, are fundamentally limited to producing clever *mimicry*; they cannot achieve true re-creation of meaning. | LLMs possess the fundamental architecture (pattern recognition, contextual integration, sequence generation) capable, in principle, of achieving human-level translation competence given sufficient data and scaling, without requiring embodiment. |

  **Section 3: Proposed Cruxes & Predictions**

  **Crux 1: The Anomaly Case**

  *   **Test:** Present MT systems and human translators with a curated set of source texts containing subtle anomalies (e.g., factual inconsistencies, anachronisms, referential errors, presupposition failures). Texts should range from obvious slips to deeply embedded contextual errors requiring real-world knowledge. Measure:
      *   Rate of *correctly identifying and flagging* the anomaly (e.g., via uncertainty markers, queries, footnotes).
      *   Rate of *incorrectly "correcting"* the anomaly silently in the output.
      *   Rate of *producing fluent nonsense* by ignoring the anomaly.
      *   **Fine-tuning Sub-test:** Take an existing MT system showing poor anomaly handling. Fine-tune it *exclusively* on high-quality, professionally translated corpora where human translators *explicitly flagged and corrected* similar anomalies in the source (annotations included). Re-test on a held-out anomaly set. Does flagging/correction behaviour improve significantly?
  *   **Position A Prediction:** Untuned systems will perform very poorly at flagging anomalies, typically smoothing them over. Fine-tuning might yield *some* improvement in flagging/correcting *specific, frequent anomaly types* present in the training data (e.g., learning to flag "Born: 1990, Died: 1985"). However, this will be:
      1.  Narrow: Limited to seen anomaly patterns.
      2.  Brittle: Fails with novel anomaly types or complex contextual slips.
      3.  Mechanistic: The system learns a new "if pattern X, output flag Y" surface correlation, *not* genuine comprehension of *why* it's an anomaly. It cannot reason about the inconsistency based on world knowledge. Flagging does *not* constitute "understanding".
  *   **Position B Prediction:** Untuned systems will perform poorly but variably based on how common the anomaly type is in training data. Fine-tuning on anomaly-annotated/corrected data will lead to *significant, robust improvements* in both flagging and correctly handling (correcting or querying) a wide range of anomalies, including novel ones that share structural or contextual similarities with trained examples. The system learns the *task* of anomaly detection and handling as part of the translation competence. Successfully learning to flag/correct *is* evidence of developing a functional understanding of textual coherence and consistency within the translation task domain.

  **Crux 2: Constrained Poetry Translation (Marot's "Ma mignonne")**

  *   **Test:** Task multiple, state-of-the-art MT systems (and human translators for baseline) to produce English translations of Clément Marot's "Ma mignonne" adhering strictly to the original's formal constraints: 28 lines, 3 syllables per line, AABB rhyme scheme, specific tone (affectionate, slightly playful admonishment). Generate K distinct translations per system (e.g., K=10). Present all outputs (human and machine, anonymised and randomised) to a panel of experienced poets and poetry translators for blind evaluation. For each rendering, judges assess:
      1.  **Acceptability:** Does it meet all formal constraints *and* convey a recognisably appropriate meaning/tone? (Yes/No/Partial).
      2.  **Distinctness:** Is this rendering genuinely distinct in word choice, phrasing, and approach to solving the constraints from the others in the set, or is it a minor variation/near-duplicate?
  *   **Position A Prediction:** MT systems will struggle immensely. They may produce a few outputs that *technically* meet constraints (syllable count, rhyme) but sound forced, unnatural, or miss the tone. Most outputs will violate constraints. The few acceptable outputs will be rare and likely near-duplicates of common solutions found online or in training data. Generating K=10 *genuinely distinct and acceptable* renderings will be impossible for current MT. Human translators will produce fewer total outputs but a higher *proportion* of acceptable ones, with greater genuine distinctness.
  *   **Position B Prediction:** MT systems will produce a range of outputs. Some will fail, but several will meet the formal constraints acceptably. While some outputs might cluster, systems *will* be capable of generating multiple (K=10) distinct solutions that pass the formal constraints and capture aspects of the meaning/tone, judged acceptable by the panel. The degree of distinctness and naturalness will increase with model scale and specific fine-tuning on constrained poetry, approaching (though perhaps not yet matching) the flexibility and quality of skilled human translators for this specific, highly constrained task. Success here demonstrates competence under extreme linguistic constraints.

  **Section 4: Notes on Terminology & Verbal Disputes**

  *   **"Shallowness" (Position A) / "Surface Pattern Matching" (Position B):** Both sides agree MT relies heavily on statistical patterns. The dispute is whether this is *necessarily* shallow (A) or whether it *can* constitute a form of competence that meets the task requirements (B). **Recommendation:** Use "statistical pattern matching" descriptively. The *evaluation* of whether it's sufficient is the crux, not the label.
  *   **"Understanding" (Core Dispute):** This is the central **verbal dispute**. Position A uses it to imply a specific, internal, experience-grounded state. Position B uses it operationally, synonymous with demonstrable competence. **Recommendation:** **Avoid "understanding" in the crux tests and predictions.** Use operational terms: "competence," "ability to handle anomalies," "ability to generate distinct acceptable renderings under constraints," "flexibility," "robustness." The tests are designed to probe the *capabilities* underlying these different usages. Which usage is "worth keeping" depends on which proves more predictive and explanatory of the system's behaviour under test. The cruxes aim to determine if Position B's operational competence *suffices* for tasks Position A claims require their richer notion.

  **Signatures:**
  [Position A Representative(s)] _________________________
  [Position B Representative(s)] _________________________

  **Date:** _____________________________________________

  ---
  **Key aspects of this draft:**

  1.  **British English:** Uses "behaviour," "realise," "licence" (verb), "translator" (not 'translatologist'), "learnt" (past participle).
  2.  **Specific Agreements:** Focuses on observable facts about current MT (fluency, anomaly weakness, constraint difficulty) and core translation concepts (mapping, fluency's weakness as proof).
  3.  **Disagreements Table:** Uses each side's own core terminology to state their positions clearly and symmetrically. Rows address the core philosophical differences (necessity of embodiment, nature of understanding, potential of architecture).
  4.  **Cruxes:**
      *   **Anomaly Handling:** Clearly defines the test (slip types, fine-tuning protocol) and predictions. Position A predicts shallow trick learning; B predicts competence acquisition. Directly addresses "does flagging count as understanding?" via the predictions.
      *   **Constrained Poetry:** Uses Marot's poem as requested. Defines strict evaluation criteria (acceptability = constraints + meaning/tone; distinctness). Predictions contrast MT's potential volume/distinctness against human quality/flexibility.
  5.  **Avoids Unfalsifiable Rhetoric:** No "just needs scale" without defining the testable outcome (e.g., Crux 2 tests scale/distinctness predictions). No bare "Chinese Room" – the tests probe whether behaviour manifests flexibility/responsiveness that might counter the Room intuition.
  6.  **Terminology Flagging:** Explicitly identifies "shallowness" and especially "understanding" as the core verbal dispute, recommends operational language for tests, and links test outcomes back to resolving the dispute over the term's useful scope.
  7.  **Handout Format:** Structured clearly with numbered sections, a table, and distinct crux sections for easy reference in a workshop setting.
