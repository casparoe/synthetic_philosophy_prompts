  Okay, the user is a TA preparing for a formal epistemology section on the accuracy-first argument for probabilism. They need a pantoum poem to help students distinguish between two arguments: dominance and expected accuracy. 

  First, I need to unpack their request. The dominance argument shows that non-probabilistic credences are strictly dominated—some coherent alternative is more accurate in every possible world. The expected accuracy argument says that with proper scoring rules, reporting true credences maximizes expected accuracy based on one's own beliefs. Students are conflating these, so the poem must make the distinction visceral through form.

  The pantoum structure is perfect for this because its repeating lines can represent the dominance argument's world-independent truths, while new lines can reflect expectation-dependent claims. The user wants the recycled lines to feel portable across stanzas (like dominance across worlds), and even hopes for a subtle shift in meaning when one line repeats a fourth time. 

  Hmm, tricky part: ending on incompleteness. Dominance forces coherence but doesn't specify which credence function to adopt or how to update with evidence. The last stanza should feel deliberately unresolved. And no didacticism—just pure poetic demonstration. 

  For the first stanza, I'll open with a dominance claim as line 1: "No world remains where my old credence stands" (non-probabilistic credences lose everywhere). Line 3 will be another portable truth: "Some coherent score will outpace my own." The new lines (2 and 4) will introduce expectation: "I tally losses in imagined sands" (calculating expected loss) and "My own belief weighs what the dice have shown" (relying on personal probabilities).

  Second stanza inherits lines 2 and 4 from first as its new 1 and 3. Now "I tally losses..." becomes a world-independent claim? Wait no—dominance lines must stay portable! I'll swap: repurposed lines should be the repeating ones. Fixed: stanza 2's inherited lines are 1 and 3 from stanza 1 ("No world remains..." and "Some coherent score..."), keeping them stable. Fresh lines for stanza 2: "The ground might crack beneath this shifting land" (epistemic uncertainty) and "This expectation builds my brittle throne" (critiquing reliance on expectations).

  Third stanza inherits stanza 2's new lines 2 and 4 as its 1 and 3. Here's where the meaning shift happens: "The ground might crack..." originally expressed doubt, but as stanza 3's opening line, it now feels like a universal warning. Fresh lines: "No path ahead is paved by what I've planned" (dominance doesn't dictate choices) and "What moves me now must move from seed I've sown" (updating requires evidence, which dominance ignores).

  Fourth stanza inherits stanza 3's lines 2 and 4. "No path ahead..." becomes line 1—now emphasizing lack of guidance. "What moves me now..." as line 3 subtly shifts from active choice to passive limitation. Final fresh line: "The map is drawn in dust beneath my hand" (evidence isn't incorporated). Closes with stanza 1's line 1 ("No world remains...") and line 3 ("Some coherent score..."), but now they feel hollow—coherence is necessary but insufficient. 

  Perfect. The inherited lines' repetition mirrors dominance's world-invariance, while new lines expose expectation-dependence. The throne/brittle imagery critiques expected accuracy arguments, and the ending's unresolved "map in dust" shows dominance's limitations. No jargon, no preaching—just form doing the work.
