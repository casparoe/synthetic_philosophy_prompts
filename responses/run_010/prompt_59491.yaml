prompt: |-
  I sit on the ethics committee of a mid-sized professional association (about 4,000 members, mostly experimental biologists). We vote Thursday on a case that's turned into something else entirely. Quick version:

  - Last spring a senior member filed a formal complaint alleging that a postdoc had duplicated gel images across two papers to make a weak result look robust. Our review confirmed it: two panels, same underlying image, flipped and relabelled.
  - While assembling the file we found out the complainant has the same problem in three of his own papers from the early 2000s. It surfaced only because a junior colleague ran the images through a screening tool as part of the complaint. He hasn't denied it. He's also spent years publicly campaigning for harsher penalties, including saying that people who do this should lose their grants.
  - Our bylaws let any member file a complaint about any other member — no standing requirement at all — but they also let the committee decline a complaint that is "vexatious or brought in bad faith." Half the committee thinks hypocrisy is a species of bad faith and we should dismiss; the other half thinks standing is a moral-philosophy worry with no purchase on a body that just applies rules, and duplication is duplication whoever spotted it.

  The postdoc has separately asked us to treat the complainant's record as mitigation — basically, why me and not the guy who reported me.

  Draft the decision memo I'll circulate before the vote. It needs a bottom line the committee can actually act on (proceed on the merits, dismiss, or proceed with some modification to the outcome), plus reasoning people on the losing side could respond to. Two specific things I need from it:

  First, tell me which diagnosis of the complainant's conduct is doing the work, because I think the two pull in opposite directions. Either he doesn't really accept the norm he's invoking, in which case his complaint is a kind of fraud on us and the bad-faith clause bites — or he accepts it perfectly well and simply failed to live up to it, which is garden-variety weakness and seems to have nothing to do with whether the postdoc's panels are duplicated. We can't see inside his head, so say which of these a rule-applying body is entitled to assume, and what would count as evidence for one over the other.

  Second, deal with the worry that's keeping me up, which isn't the moral address stuff but a structural point: if being a hypocrite defeats your right to complain, then the worst-behaved people in a field acquire a veto over complaints against them, since in a field where everyone is a bit dirty they can always find a dirtier accuser or just point sideways — and our jurisdiction would shrink exactly as the field got worse. Tell me whether that's a genuine objection or a slippery slope, and seperately whether the postdoc's selective-enforcement point is the same objection in disguise or a different one that could survive even if the standing talk doesn't.

  No introduction, no closing summary, no bibliography or list of further reading — just exactly five numbered points, a sentence or two each: (1) the recommendation, (2) which diagnosis you're assuming and why, (3) how the bad-faith clause should be read on these facts, (4) whether the structural objection lands, (5) what we do about the complainant's own papers.
reasoning: |-
  Okay, the user is part of an ethics committee for a professional association of experimental biologists. They're dealing with a complex case involving a senior member who filed a complaint against a postdoc for image duplication, while the senior member himself has similar issues in his own past papers. The committee is divided on how to proceed, and they need a decision memo before their vote on Thursday.

  I need to address two main challenges here. First, I need to determine whether the complainant's hypocrisy constitutes "bad faith" under their bylaws. There are two interpretations: either he doesn't believe in the norm he's enforcing (making his complaint fraudulent), or he believes in it but failed to meet it himself (which is weakness but doesn't invalidate the complaint). Since they can't read minds, I should go with the latter because hypocrisy alone doesn't prove insincerity - it's common human behavior. Evidence of bad faith would need something more concrete like a vendetta or prior threats.

  Second, there's a structural concern that if hypocrisy disqualifies complaints, then the worst offenders could block accountability since they could always find a hypocritical accuser. This is a valid concern, not just a slippery slope argument. It would undermine self-policing in the profession. The postdoc's selective enforcement argument is related but different - it's about fairness in consequences rather than standing to complain.

  For the memo structure, I'll follow exactly five numbered points as requested: recommendation, diagnosis assumption, bad-faith interpretation, structural objection analysis, and handling of the complainant's own papers. My recommendation will be to proceed with the postdoc's case but investigate the senior member separately. This keeps the complaints distinct while addressing both issues.

  I'll emphasize that the validity of the complaint against the postdoc stands independently, but the senior member's past misconduct should be handled through a separate process. For the postdoc's mitigation request, I'll suggest that while the complainant's conduct doesn't invalidate the complaint, it might inform the penalty phase regarding fairness perceptions.
answer: |-
  **(1) Recommendation:** Proceed with adjudicating the postdoc's image duplication on the merits. Simultaneously, open a *separate* preliminary inquiry into the complainant's own papers based on the evidence uncovered. Dismissal under the "bad faith" clause is not warranted on these facts.

  **(2) Diagnosis Assumed:** The committee is entitled to assume the complainant *accepts* the norm against image duplication but *failed to uphold it* in his own past work (weakness of will/garden-variety hypocrisy). Assuming he *doesn't* accept the norm (insincerity/fraud) requires specific evidence of ulterior motive beyond the mere existence of his own violations, which is absent here. His public stance demonstrates acceptance; his past actions demonstrate failure.

  **(3) Bad-Faith Clause Application:** Mere hypocrisy, without evidence linking it directly to an improper *purpose* for filing *this specific complaint* (e.g., retaliation, harassment, suppressing competition), does not constitute "bad faith" or make the complaint "vexatious" under the bylaws. The complaint itself alleges a verifiable rule violation; its validity doesn't depend on the complainant's purity. His hypocrisy is relevant to his credibility and potential sanctions *against him*, not the complaint's admissibility.

  **(4) Structural Objection Validity:** The structural objection (bad actors gaining immunity) is **genuine and decisive**. Conditioning standing on the complainant's own adherence would indeed create perverse immunity for the worst offenders and cripple self-policing, especially in fields with historical problems. This outweighs slippery slope concerns; it's a core flaw in the "hypocrisy=no standing" position. The postdoc's selective enforcement point is **distinct but related**: it argues fairness in *consequence application*, not standing to *initiate a complaint*. It survives even if standing is upheld and should be considered during the *sanction phase* for the postdoc.

  **(5) Complainant's Papers:** The evidence uncovered during the review of the postdoc's case concerning the complainant's papers **must be formally addressed, but not within the postdoc's case.** Initiate a separate preliminary inquiry under the committee's authority to investigate potential misconduct brought to its attention. The complainant's status as an accuser does not immunize him from investigation for his own potential violations. His hypocrisy and public statements are highly relevant factors for *his* potential sanctions if violations are confirmed.
