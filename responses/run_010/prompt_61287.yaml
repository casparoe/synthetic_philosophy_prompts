  The user's expertise is in history, not archaeology, and they can't consult experts during late-night locks. They've read Diamond and Tainter but recognize the academic debate about abandoning "collapse" for resilience-focused frameworks. Their core problem is balancing accuracy with production pressures, where mistakes could lead to corrections or pulled episodes.

  Key pain points: 
  - Vague scripts lacking quantifiable data
  - Tension between academic rigor and descendant community sensitivities
  - The word "collapse" being in the series title, making total avoidance impossible
  - Need for a standardized process to replace their flawed personal checklist

  They want a two-track system: one for descriptive collapse criteria (separated from causality), and one for evaluating causal narratives. The procedure must handle ambiguity—phrases like "cities were abandoned" instead of hard numbers. They also need substitute terms (e.g., "reorganization," "contraction") with clear rules for when to use them.

  The stress test cases are revealing: 
  1. The Maya episode clashes with their clause 3 (regional exceptions) and clause 5 (living descendants). 
  2. Rapa Nui involves problematic deforestation narratives and European impact erasure. 
  3. Late Bronze Age Mediterranean requires handling patchy, multi-polity transitions.

  The user specifically requests an "unpleasant answer" for one case, anticipating their Maya stance may be flawed. They also worry about modern analogies like the Aral Sea.

  Underlying needs:
  - Defensible editorial decisions under time constraints
  - Avoiding career-threatening oversights (pulled episodes)
  - Respecting descendant communities without sacrificing narrative clarity
  - Distilling academic complexity into actionable TV standards

  The solution must prioritize "good enough" archaeology over perfection, flagging only critical issues. Academic nuances like intensive vs. extensive collapse can be ignored, but descendant perspectives and causality oversimplifications are non-negotiable. The procedure should explicitly discard their clauses 3 (geographic uniformity) and 5 (no living descendants), instead handling the latter through community consultation protocols.
answer: |-
  Here's a battle-tested procedure designed for 45-minute script triage. It separates **Descriptive Claims** (can we call it a collapse?) from **Causal Claims** (why did it happen?). Academic debates are simplified to operational essentials. **Key:** Focus on what *must* be flagged *now*, not achieving perfect scholarship.

  **What Survives the Cut & What You Can Drop:**

  *   **KEEP:** The core idea of "collapse" as **significant, rapid, enduring loss of socio-political complexity and centralization** (Tainter-light). This is the minimum defensible kernel.
  *   **KEEP:** **Descendant Community Sensitivity.** This isn't academic debate; it's ethical and practical risk management. Your clause 5's *intent* is vital but poorly framed.
  *   **KEEP:** **Distinction between descriptive collapse and causal explanation.** Mixing them causes most narrative sins.
  *   **DROP:** Diamond's "choice to fail" framework for *defining* collapse. It's a causal argument, not a descriptor. (You can still *discuss* causes, separately).
  *   **DROP:** Requiring collapse to be **geographically universal** (your clause 3). Core regions failing catastrophically while peripheries persist *is* collapse (e.g., Western Roman Empire).
  *   **DROP:** A **fixed "bounce-back" timeframe** (your clause 4). 50 years is arbitrary. "Enduring" means no *rapid return to comparable complexity/scale* in the *core affected area*. The Aral Sea won't "bounce back" like a polity might.
  *   **DROP:** **"Resilience vs. Collapse" as mutually exclusive.** The procedure allows "collapse" *followed by* reorganization/resilience. We're flagging the *event*, not denying later adaptation.
  *   **DROP:** **Intensive academic debates** about marginal cases or precise definitions of "complexity." Your job is spotting clear *misuse*, not adjudicating PhD theses.

  **The Procedure: 45-Minute Script Triage**

  **Phase 1: Descriptive Claim Check ("Collapse" Word Check) - 20 mins**
  *   **Q1: What SPECIFIC entity is being called "collapsed"?** (e.g., "The Maya Empire", "The Kingdom of Ugarit", "Rapa Nui society")
      *   *Pass:* Clearly named polity, state, or regionally dominant societal structure. *Fail/Vague:* "The civilization", "Society", "The People" (unless script clearly defines the scale).
      *   *Action if Fail/Vague:* **Note: "Specify entity (e.g., 'Lowland Maya city-states', 'Mycenaean Palace System'). Avoid broad terms like 'the civilization'."**
  *   **Q2: Does the script provide evidence of RAPID, SIGNIFICANT LOSS?** Look for indicators:
      *   *Population:* "Plummeted", "abandoned", "mass death", "fled", "dramatically reduced".
      *   *Centralized Functions:* "States fragmented", "kingship ended", "palaces burned/abandoned", "central authority vanished", "monumental building ceased", "writing/record-keeping stopped".
      *   *Economic Complexity:* "Trade networks collapsed", "specialized crafts disappeared", "elite goods vanished".
      *   *Pass:* At least TWO types of loss indicated (e.g., population drop *and* end of monuments/writing; state disintegration *and* economic decline). *Fail:* Only ONE type mentioned, or losses described as gradual/partial without being catastrophic for the core functions. *Vague:* Only qualitative terms with no anchor ("declined", "weakened").
      *   *Action if Fail/Vague:* **Flag: "Insufficient evidence for RAPID, SIGNIFICANT LOSS. Clarify scale/speed or use substitute term."** (See Substitute Ladder below).
  *   **Q3: Was the loss ENDURING for the core entity?**
      *   *Pass:* Script implies/describes the specific entity did NOT return to its former complexity/scale/centralization *in its core area* within a human generation or two (approx. 50 years *if mentioned*, otherwise judge qualitatively). *Fail:* Script shows clear, rapid reconstitution of similar complexity/scale in the same core area. *Vague:* No mention of aftermath, or mentions later activity that is clearly different/less complex (e.g., villages on old city sites).
      *   *Action if Pass:* Move to Q4. *Action if Fail:* **Note: "Loss not enduring - suggest 'crisis', 'interruption', 'dynastic failure'."** *Action if Vague:* **Note: "Assume loss enduring unless stated otherwise? Clarify aftermath if crucial."** (Usually safe to assume enduring if Q2 strongly passed).
  *   **Q4: Does a recognized DESCENDANT COMMUNITY exist that identifies with this specific entity AND objects to the term "collapse"?**
      *   *Sources:* Your notes, previous complaints, script's own advisors, quick web check (if named group).
      *   *Pass (No Objection/Known):* No known objection OR group uses the term themselves academically. *Fail (Known Objection):* Previous formal objection (e.g., Maya org, Rapa Nui adviser) OR script mentions advisors objecting. *Vague/Unknown:* No info in script/your notes.
      *   *Critical Action:* **If FAIL - IMMEDIATELY FLAG: "TERM 'COLLAPSE' EXCLUDED PER ADVISOR REQUEST. USE SUBSTITUTE TERM. CONSULT PRODUCER/ADVISOR URGENTLY."** (This overrides all else). *If Vague/Unknown:* **Note: "Potential sensitivity - confirm advisor stance on 'collapse' term before lock."** *If Pass:* Word "collapse" is *descriptively* acceptable pending Causal Check.

  **Phase 2: Causal Claim Check (The "Why") - 15 mins**
  *   **Q5: Does the script attribute the loss (collapse or otherwise) to a SINGLE, SIMPLE CAUSE?** (e.g., "deforestation caused collapse", "invaders destroyed them", "drought killed them")
      *   *Pass:* Presents multiple interacting factors (environmental, social, political, economic) OR frames one factor as a catalyst/contributor within a complex system. *Fail:* Relies heavily on one monocausal explanation. *Vague:* Mentions multiple things but narrative clearly favors one as *the* reason.
      *   *Action if Fail/Vague:* **Flag: "Causal story oversimplified. Script must frame [Single Cause] as one factor among many interacting stresses, or use less deterministic language ('contributed to', 'exacerbated', 'coincided with')."**
  *   **Q6: Does the causal narrative IGNORE or MINIMIZE the role of external factors (especially colonialism/contact) where relevant?** (Critical for Rapa Nii, post-contact periods).
      *   *Pass:* Acknowledges known external factors if historically relevant. *Fail:* Attributes outcome solely to internal factors when external shocks (disease, conquest, resource extraction) are documented as major contributors. *Vague:* Mentions "external pressures" vaguely.
      *   *Action if Fail:* **Flag: "External factors (esp. [Specific Factor, e.g., European contact, disease]) played a significant documented role and must be integrated into the causal explanation."** *Action if Vague:* **Note: "Specify nature of external pressures if known (e.g., 'disease introduced by Europeans', 'influx of settlers')."**

  **Phase 3: Substitute & Finalize - 10 mins**
  *   **Apply Substitute Ladder (Based on Q1-Q4 outcomes):**
      *   `"Collapse"` ONLY if Q1-3 Pass *and* Q4 Pass/Vague (with note if Vague).
      *   `"State Collapse" / "System Collapse"` If Q1-3 Pass, but entity is specifically political (e.g., Hittite Empire).
      *   `"Major Transformation" / "Reorganization"` If Q2 shows significant change/loss but less rapid/universal OR Q3 vague/not fully enduring (e.g., some LBA polities).
      *   `"Decline" / "Contraction"` If Q2 shows loss but slower, less catastrophic, or more partial.
      *   `"Fragmentation" / "Disintegration"` If loss of central control/political unity is key (Q2 - Centralized Functions).
      *   `"Abandonment"` (Regional, Urban) If Q2 shows population loss/depopulation as the primary evidence in a specific area.
      *   `"Crisis" / "Upheaval"` If evidence is weak/vague (Q2 Fail/Vague) but turmoil is indicated.
      *   `"Dynastic Failure" / "End of Dynasty"` If the loss is specifically about ruling lineage/elite structure (Q2 - Centralized Functions).
      *   **Rule for Picking:** Match the *strongest descriptor supported by the evidence presented* (Q2) and *scale* (Q1). Default to less dramatic terms if evidence is vague or objections exist (Q4).
  *   **Final Check:** Ensure causal flags (Q5-Q6) are addressed with specific notes to the writer. Ensure Q4 actions are prioritized.

  **Running the Cases:**

  1.  **9th C. Southern Maya Lowlands:**
      *   Q1: Pass ("Southern Maya Lowlands city-states" - specific core region).
      *   Q2: Pass (Cities abandoned, monuments stopped, kingship ended - multiple types of loss).
      *   Q3: Pass (Enduring for *that specific political/cultural complex* in the core south - no return).
      *   Q4: **FAIL** (Known Maya descendant objection). **→ OVERRIDE: DO NOT USE "COLLAPSE" FOR SOUTHERN LOWLANDS.** Flag immediately per procedure.
      *   *Substitute:* "**Abandonment** of the great southern cities," "**End** of the monument-building era," "**Fragmentation** of southern Maya states," "**Major transformation** in the southern lowlands." *Avoid:* "The Maya collapsed."
      *   *Causal Check (Q5-Q6):* Likely needs scrutiny (deforestation/climate alone?), but descriptor is blocked by Q4 anyway.
      *   **Answer You Won't Like:** Descriptively (Q1-Q3), "collapse" *is* arguably valid for the *Southern Lowland system*. BUT Q4 (descendant objection) **trumps it absolutely.** Your call was right, but for the *critical procedural reason* (Q4 Fail), not because it descriptively failed your old clause 3. **Your Action:** The procedure forces you to flag this for urgent producer/advisor consultation. It's not *your* call to override the advisor, it's the producer's/network's, informed by the ethical risk you've flagged. Your note is clear: "Term excluded per advisor precedent. Use substitutes. Producer must confirm approach with advisors."

  2.  **Rapa Nui:**
      *   Q1: Pass ("Rapa Nui society").
      *   Q2: Pass (Significant population decline *before* Europeans? Debate! Script likely says "plummeted", "statues stopped", "society crumbled". Assume Pass based on typical scripts).
      *   Q3: **Vague/Fail?** Enduring loss? But society persisted *differently*. Script likely implies "collapse" was enduring *to the complex society*. Often Passed vaguely.
      *   Q4: **FAIL** (Known advisor objection). **→ OVERRIDE: DO NOT USE "COLLAPSE".** Flag immediately.
      *   *Substitute:* "**Major transformation**," "**Profound crisis**," "**End of the moai-building era**," "**Severe contraction and adaptation**."
      *   *Causal Check:*
          *   Q5: **HIGH FAIL RISK.** Script likely blames "deforestation" as *the* cause. **Flag:** "Oversimplified monocausality. Deforestation was one stressor interacting with others (rat predation, climate, social dynamics). Must reframe."
          *   Q6: **HIGH FAIL RISK.** Script likely ignores/underplays catastrophic impact of Europeans (slavery, disease). **Flag:** "European contact caused catastrophic population decline and cultural disruption. This must be integrated as a primary factor in the later period's hardships, not just internal 'collapse'."

  3.  **Late Bronze Age Eastern Mediterranean:**
      *   Q1: **Vague/Complex.** Script likely says "The Bronze Age Collapse". Entity too broad.
      *   *Action Q1:* **Note:** "Specify entities (e.g., 'Hittite Empire collapsed', 'Mycenaean palaces fell', 'Ugarit destroyed'). Avoid 'Bronze Age Collapse' as a monolithic event." Assume script adjusts to specific examples.
      *   *Example: Hittite Empire:*
          *   Q1 Pass (Hittite Empire).
          *   Q2 Pass (Capital Hattusa burned/abandoned, central rule vanished, writing stopped).
          *   Q3 Pass (Enduring - no Hittite Empire returned).
          *   Q4 Pass/Vague (No known modern political entity claiming direct descent/objecting specifically to "Hittite collapse").
          *   *→ "Collapse" or "State Collapse" acceptable descriptively.*
      *   *Example: Mycenaean Greece (Palace System):*
          *   Q1 Pass (Mycenaean Palace System).
          *   Q2 Pass (Palaces destroyed/abandoned, writing lost, centralized economy gone).
          *   Q3 Pass (Enduring for *that palace system* - Dark Age followed).
          *   Q4 Pass/Vague.
          *   *→ "Collapse" or "System Collapse" acceptable.*
      *   *Example: Egypt (New Kingdom):*
          *   Q1 Pass (Egyptian New Kingdom state?).
          *   Q2: **Partial/Fail?** Significant disruption, loss of empire, but state apparatus and writing *persisted* in the Nile Valley. Not a clean "collapse".
          *   *Action Q2:* **Flag:** "Evidence shows decline, fragmentation, loss of empire, but not collapse of the Egyptian state core. Use 'decline', 'fragmentation', 'end of the New Kingdom era'." Avoid "Egypt collapsed".
      *   *Causal Check (Q5-Q6):* HIGH Flag risk. Scripts love "Sea Peoples" as *the* cause. **Flag:** "Sea Peoples were one element in a 'perfect storm' of factors (earthquakes?, drought?, internal rebellion, shifting trade). Must present multiple interacting stresses. Avoid 'Sea Peoples destroyed the Bronze Age'."

  **What This Procedure CANNOT Do:**

  1.  **Resolve Deep Scholarly Disagreements:** If reputable scholars fundamentally disagree on whether Event X was a collapse (e.g., some Andean states), the procedure will reflect the ambiguity (likely Q2 or Q3 Vague) and suggest a less charged term.
  2.  **Fix Fundamentally Flawed Research:** If the script relies on debunked theories (extreme Malthusian Rapa Nui), the Causal Check (Q5/Q6) will flag oversimplification, but it won't replace bad facts with good ones. You need baseline trusted sources.
  3.  **Override Production Pressure:** If the Senior Producer *wants* "collapse" for drama despite flags, the procedure documents your objection but can't stop it.
  4.  **Handle "Slow Collapse" Perfectly:** Gradual, centuries-long declines (e.g., some see W. Rome) might only get Q2 Pass weakly or vaguely, pushing towards "Decline" or "Transformation". This is a feature, not a bug – it avoids misapplying a dramatic term to a slow process. Your old clause 4 is mostly gone.
  5.  **Modern Analogies (Aral Sea):** It **CAN** work, surprisingly well:
      *   Q1: "Aral Sea Fishing Communities/Regional Economy".
      *   Q2: Pass (Rapid? ~Decades. Significant Loss: Towns abandoned, fishing industry *died*, mass exodus, state functions vanished locally).
      *   Q3: Pass (Enduring - no return of sea/fishing towns).
      *   Q4: Pass/Vague (No known *organized* descendant community *specifically objecting to "collapse"* for the *towns/economy* - though affected people exist. Sensitivity needed, but different scale than Maya/Rapa Nui).
      *   *→* Descriptively, "**economic collapse**" or "**collapse of the fishing industry/communities**" is *defensible*. "Societal collapse" is too broad. **Causal Check (Q5):** MUST avoid monocausal "Soviet irrigation did it" - flag interplay of policy, economics, climate.

  **Fate of Your Clauses:**

  *   **Kept:** Clause 1 (Loss, not just change) - Core of Q2. Clause 2 (Happened Fast) - Integrated into Q2 ("rapid"). Clause 4 (Stuck) - Core of Q3 ("enduring").
  *   **Modified:** Clause 5 (No Living Community) - Replaced by Q4's *advisor objection check*, which is more practical and ethical.
  *   **Ditched:** Clause 3 (Happened to Most) - Unworkable and academically unsound for defining collapse in core regions. Replaced by focus on the specific entity (Q1) and its core (Q2/Q3).

  **Systematic Weaknesses:**

  *   **"Vague Pass":** A script with strong, evocative *but vague* language ("everything fell apart", "darkness descended") might sneak through Q2 if it hits multiple loss types vaguely, especially if Q4 is clear. Your judgment on "significant" is key.
  *   **"Definitional Edge Cases":** Societies like Egypt (NK) or Byzantium (1204) that experience massive disruption but retain core identity might get flagged in Q2/Q3 for using "collapse", pushing towards "crisis" or "fragmentation", even if some scholars use "collapse". This is safer TV.
  *   **"Causal Oversimplification Sneaking Through":** If a script lists multiple causes but the visuals/narration strongly imply one (e.g., dramatic deforestation footage), the causal note might not be strong enough. Your editorial eye is still crucial.

  This procedure gives you a defensible, efficient checklist prioritizing the biggest risks (inaccuracy, over-drama, insult) while providing clear alternatives. It forces critical conversations (especially with advisors) upstream.
