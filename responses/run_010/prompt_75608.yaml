answer: |-
  Here’s a structured desiderata list for rational imprecise credences in high-stakes, low-evidence contexts, with motivating cases, trade-offs, and limitations:

  ---

  ### **I. Desiderata List (with Motivating Cases)**  
  1.  **Evidence-Responsiveness (Urn Updating):**  
      *Prior set must contract meaningfully with unambiguous evidence.*  
      **Case:** Unknown urn with black/white balls. After drawing one black ball, the credal set for "next is black" should narrow from [0,1]. Failure (e.g., staying [0,1]) renders evidence useless.  

  2.  **Controlled Dilation:**  
      *Dilation (interval widening after evidence) must be rare, justified, and bounded.*  
      **Case:** Diagnosing a rare disease with an unreliable test. Learning *any* test result (positive/negative) might widen your interval for having the disease due to test uncertainty. Acceptable only if test reliability is genuinely unknown—but must not make intervals explode to [0,1] routinely.  

  3.  **Avoid Inertia:**  
      *Priors must not trap intervals at [0,1] indefinitely under accumulating evidence.*  
      **Case:** Repeated draws from the unknown urn. After 100 black balls, your credence for next being black must be >0.5 (e.g., [0.7, 0.99]). Staying [0,1] after ample data is irrational.  

  4.  **Action-Guidance (No Dominated Choices):**  
      *Decision rule must select non-dominated acts; if act A beats B in every prior, B is forbidden.*  
      **Case:** Betting on urn draws. If betting "black" has higher worst-case expected utility than "white" across all priors, you must not bet "white". Violations imply self-sabotage.  

  5.  **Temporal Consistency:**  
      *Choices must not reverse based on equivalent timing of information/decisions.*  
      **Case:** Deciding pre- vs post-evidence. Refusing a bet now that you’d accept after seeing one draw suggests incoherence.  

  6.  **Properly Scorable:**  
      *Model must admit proper scoring rules (e.g., Brier score) to incentivize honest reporting.*  
      **Case:** Public confidence forecasts. If intervals can’t be scored (e.g., always penalized for reporting [0,1]), reporters game the system by hiding ignorance or knowledge.  

  7.  **Public Defensibility:**  
      *Intervals must be communicable, auditable, and anchored in explicit assumptions.*  
      **Case:** Reporting "risk: 10-90%" for policy. Must justify why the interval isn’t narrower (e.g., "we lack calibration data") or why it excludes 0% (e.g., "mechanism suggests non-zero chance").  

  ---

  ### **II. Negotiable vs. Non-Negotiable**  
  | Desideratum          | Non-Negotiable (Why)                         | Negotiable (Why)                              |
  |-----------------------|-----------------------------------------------|-----------------------------------------------|
  | Evidence-Responsiveness | Core to learning; [0,1]-inertia is useless.    | —                                             |
  | Avoid Inertia         | Essential for empirical adequacy.             | —                                             |
  | No Dominated Choices  | Necessary for minimal rationality.            | —                                             |
  | Temporal Consistency  | Required to avoid dynamic incoherence.        | —                                             |
  | Controlled Dilation   | —                                             | Statisticians may tolerate it; decision theorists hate unpredictability. |
  | Properly Scorable     | —                                             | Purists insist; pragmatists may sacrifice for expressiveness. |
  | Public Defensibility  | —                                             | Technical users may deprioritize communication. |

  ---

  ### **III. Impossibilities & Trade-offs**  
  1.  **Responsiveness vs. Dilation:**  
      *Contradiction:* Avoiding all dilation requires rejecting some forms of prior sets (e.g., maximal ignorance models). Urn example: if prior set is *all possible* urns, one black draw implies nothing (inertia). To be responsive, you must restrict priors (e.g., via symmetry), but this may *cause* dilation in other cases (e.g., if evidence is ambiguous). **You cannot have universal evidence-responsiveness *and* zero dilation.**  

  2.  **Proper Scoring vs. Expressiveness:**  
      *Conflict:* Strictly proper scoring for *sets* often forces intervals to collapse to single points (Seidenfeld et al.). Reporting [0,1] may avoid penalties if scores are "improper" for sets, but invites gaming. **Truly proper scoring rules for imprecise credences typically demand precise beliefs.**  

  3.  **Action-Guidance vs. Consensus:**  
      *Tension:* E-admissibility (pick acts optimal for *some* prior) allows disagreement on "best" acts given the same beliefs. Gamma-maximin (pick max worst-case EU) forces consensus but may reject intuitively good options. **No single decision rule satisfies all groups’ intuitions.**  

  ---

  ### **IV. Contenders (Decision Rules)**  
  1.  **Maximality:**  
      Reject acts dominated *pairwise* (A beats B if better in all priors). Allows more acts than other rules but permits "cycles" (A>B, B>C, C>A). Weakly avoids inertia/dilation.  
  2.  **E-admissibility:**  
      Pick acts optimal for *at least one prior* in the set. Flexible but may lead to inconsistent choices over time. Struggles with dilation if priors disagree post-evidence.  
  3.  **Γ-Maximin:**  
      Maximize worst-case expected utility. Ensures security but causes inertia (intervals stay wide) and ignores non-worst-case priors. Fails public defensibility if worst-case is extreme.  

  ---

  ### **Key Trade-offs Summary**  
  | Requirement          | Conflicts With          | Reason                                                                 |
  |----------------------|-------------------------|------------------------------------------------------------------------|
  | Evidence-Responsiveness | Zero Dilation           | Learning requires prior restrictions that can amplify ambiguity.       |
  | Avoid Inertia        | Γ-Maximin               | Worst-case focus ignores evidence not affecting the minimum.           |
  | Proper Scoring       | Non-precise Intervals   | Proper rules punish non-collapsed sets (theorem).                      |
  | Public Defensibility | Technical Simplicity    | Justifying bounds requires explicit models, not black-box math.        |

  **Bottom Line:** No imprecise model satisfies all desiderata perfectly. Choose based on priorities:  
  - **Worst-case security?** → Γ-Maximin (sacrifice responsiveness).  
  - **Flexible decisions?** → E-admissibility (risk dilation).  
  - **Dynamic consistency?** → Maximality with responsive priors (hard to compute).  
  Public reporting favors models that are scorable and defensible, even if theoretically imperfect.
