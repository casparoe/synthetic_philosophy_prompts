prompt: |-
  Six months ago I was in the field complaining about interpretive overreach in other people's papers. Now I'm the one writing the wall text. I took a job at a small regional museum doing collections and interpretation, and my first task is rewriting the labels in the prehistory gallery, which went up in the nineties and are, uh, confident. The old label on the case of bronze bits tells visitors that the people of this valley worshipped a warlike sun god. I want to delete that sentence. But going through it object by object, deciding what I'm actually willing to say, my gut turns out not to be consistent, and I'd like to know if there's a real principle hiding in there.

  Here's my verdicts.

  1. A clay pot with a hole punched clean through the base, in a child's grave, otherwise undamaged. I'm happy to write intentionally broken, probably as part of the burial. I'll say ritual.
  2. A hoard of bronze ornaments and two swords, one sword bent, buried in a pit with no grave. I want to write deliberately deposited, possibly after being taken out of use, and I will not write offering.
  3. Stone weights from six sites across maybe 200 years that come in a repeating series of ratios. I'll write that this implies someone was holding standards over a wide area for a long time — a real institution, with authority behind it.
  4. One incised motif, a zigzag inside a double circle, on pottery from four different valleys over the same period. I won't write shared religion, or the same god anywhere. At most: a style that travelled.
  5. Wall painting where one figure is twice the height of the rest. I'll write that the bigger figure matters more and that this society ranked people. Second scene, same building, where that same figure is drawn normal size next to a bigger one — now I won't say anything about rank at all, just that size varies with the scene.
  6. Charred grain in a stone-lined pit beside a building, with the remains of maybe sixty animals and no everyday rubbish anywhere near it. I'll call that a feast and say it was probably a communal occasion. Identical charred grain in a midden behind houses: garbage.
  7. A coin in the mouth of a skull. I'll write a rite, and I'll say it points to a practice known from later written sources in the same region. But I refuse to name the practice or the god.
  8. A row of standing stones that roughly lines up with solstice sunrise. I'll write aligned to the solstice. I won't write calendar and I definately won't write observatory.
  9. A mass grave, bodies piled, several with fractures around the time of death and points still in the bone. I'll write violence, probably a massacre. No hedging.

  The obvious story is that I allow the inference when the object is weird, when ordinary life doesn't explain it, and block it when there's a plausible boring explanation. But 3 and 4 break that. Both are regularities spread across space and time; I let one of them carry an institution (someone enforcing weights) and I won't let the other carry a belief system (people sharing a god), and I cant tell you why those two feel different. Same problem with 1 and 2: broken things put in the ground, one gets ritual and one gets possibly. And 2 versus 7: both single objects, both with a good comparative analogue, but I'll name a rite in one and not the other.

  My rough working principle, which I know isn't right: I attribute belief or intent when at least two independent lines license the same conclusion, and I'll attribute function or institution off a single line. That gets 6 (grain plus animals plus absence of trash), gets 9 (fractures plus points plus how the bodies lie), maybe gets 3. It doesn't get 7 or 1, which are one object each. And it makes 4 come out too strong, since the motif is on dozens of pots from four valleys and I still won't say a word about religion.

  So — is there a principle, or two or three candidate principles, that gets most of these? I want them stated precisely enough that I could apply one without consulting my stomach: tell me what each clause is for and which of my cases it exists to handle, and be straight with me about which verdicts they can't accommodate and would force me to give up. I'd rather lose 5 than lose 9, for what it's worth, but tell me if that's backwards.

  Then run them on four things I haven't had to decide yet, because I do have to write labels for all of them: a building three times the footprint of its neighbours on a low hill, no hearth, no storage, no floor trash; forty identical unfired clay figurines with no faces, all in one pit; a skull with a trepanation that healed; and a bronze bowl out of a bog with a clumsy ancient repair done before it went into the water. Right now I have four different instincts about those and no idea whether any of them is principled.
reasoning: |-
  Okay, the user is a museum professional rewriting outdated interpretive labels for a prehistoric gallery. They're struggling with consistency in attributing meaning to artifacts—sometimes comfortable making inferences about ritual or belief, other times insisting on mundane explanations. Their examples show contradictory gut reactions: calling a perforated pot "ritual" but refusing "offering" for bent swords, accepting institutional standards for weights but rejecting shared religion for a widespread motif.

  Hmm... their core tension is between wanting archaeological rigor and providing meaningful visitor interpretation. They're intellectually honest—admitting their own inconsistencies while criticizing past overreach. The real pain point seems to be lacking a defensible framework to replace their intuition. 

  The user's proposed "two independent lines" principle has merit but fails cases like the coin-in-mouth (single object but clear comparative evidence). Interesting how they prioritize clear evidence of violence (mass grave) over hierarchical symbolism in art—shows commitment to concrete physical evidence.

  For their four undecided artifacts: 
  - The oversized building could be "communal space" based on size/cleanliness but not "temple" without more evidence 
  - The faceless figurines scream "intentional deposit" but "ritual objects" feels overreaching without context 
  - The healed trepanation must acknowledge skill/care but "surgery" might imply modern medical intent 
  - The clumsily repaired bog bowl suggests "valued object" but not necessarily "votive offering"

  Their professional dilemma mirrors archaeology's fundamental debate: how to interpret meaning from material culture without projecting modern biases. Maybe the solution isn't one universal principle but layered statements—starting with observable facts, then evidence-supported inferences, flagging uncertainties. 

  The user would probably benefit from distinguishing between:
  - Direct functional inferences (trauma on bones = violence)
  - Indirect institutional inferences (standard weights = enforcement)
  - Speculative symbolic inferences (sun alignment = worship)

  ...with each requiring escalating levels of evidence. Their resistance to naming gods feels ethically sound—deities are interpretations, not artifacts.
answer: |-
  Here's a breakdown of principles derived from your verdicts, designed to be applied consistently and minimize gut-feeling reliance. They prioritize **direct evidence, specificity, and avoiding unwarranted leaps**, especially about belief systems. Let's analyze your cases, define the principles, test them on your undecided artifacts, and be honest about where your verdicts might need adjustment.

  **Core Principles:**

  1.  **The Function/Behavior Principle:** Attribute function, behavior, or physical events based on direct physical evidence or unambiguous patterns demonstrable *from the objects/context themselves*. Be specific. *(Handles 1, 2, 5, 6, 8, 9)*
  2.  **The Social Structure/Institution Principle:** Attribute social structures or institutions (authority, trade networks, standardization) when patterns demonstrate coordination, enforcement, or sustained collective effort *beyond individual capability or coincidence*. Avoid naming abstract motivations. *(Handles 3)*
  3.  **The Ritual/Belief Restraint Principle:** Attribute ritual or belief *only* when:
      *   **A)** The action/object is demonstrably *non-utilitarian* or *extraordinary* within its context (beyond simple decoration or variation), **AND**
      *   **B)** There is *comparative evidence* from the *same culture/period/region* (archaeological or, cautiously, later written if demonstrably linked), **OR**
      *   **C)** The *physical evidence* points unambiguously to a symbolic act known from comparative evidence (like coin in mouth).
      *   **Always** use the most neutral term possible ("rite," "deposition," "symbolic act") and avoid naming specific deities, religions, or abstract motivations unless evidence meets B or C exceptionally well. *(Handles 1, 7; Explains restraint on 2, 4)*

  **Applying Principles to Your Verdicts:**

  1.  **Perforated Pot in Child's Grave:**
      *   **Function/Behavior:** Intentionally broken (direct evidence: clean hole, otherwise undamaged, in grave).
      *   **Ritual Restraint:** "Ritual" is acceptable under A (non-utilitarian act in mortuary context) and possibly B (mortuary rituals are widespread). *Your verdict fits.*
  2.  **Bent Sword Hoard:**
      *   **Function/Behavior:** Deliberately deposited (pattern: multiple items together, one damaged), taken out of use (damage pattern).
      *   **Ritual Restraint:** "Offering" blocked - Fails A (hoards have potential utilitarian explanations - safekeeping, scrap metal cache) and lacks B/C (no specific comparative evidence *for this context* making "offering" the *only* plausible explanation). "Possibly" is good. *Your verdict fits.*
  3.  **Standardized Weights:**
      *   **Social Structure/Institution:** Pattern shows sustained coordination/enforcement across space/time -> implies an institution with authority to maintain standards. *Your verdict fits.*
  4.  **Widespread Motif:**
      *   **Function/Behavior:** "A style that travelled" (pattern demonstrates spread).
      *   **Ritual Restraint:** "Shared religion/god" blocked - Fails A (decoration/style is utilitarian/social function) and Fails B/C (no evidence this *specific* motif had religious meaning *in this context/culture*). *Your verdict fits.*
  5.  **Wall Painting - Large Figure:**
      *   **Function/Behavior (Scene 1):** "Bigger figure matters more" (direct visual cue), "society ranked people" (inference from cue consistent with cross-cultural norms). *Principle 1 allows this specific behavioral/social inference from the visual evidence.*
      *   **Function/Behavior (Scene 2):** "Size varies with the scene" (direct observation). Refusing "rank" is correct – the variation contradicts a simple hierarchy rule, showing size is context-dependent. *Your verdict fits.*
  6.  **Charred Grain Pits:**
      *   **Function/Behavior (Stone-lined pit):** "Feast" (grain + many animals), "communal occasion" (scale + context), "not garbage" (absence of rubbish, special location). All direct contextual evidence. *Your verdict fits.*
      *   **Function/Behavior (Midden):** "Garbage" (contextual evidence). *Your verdict fits.*
  7.  **Coin in Skull:**
      *   **Ritual Restraint:** "Rite" is acceptable under A (non-utilitarian placement), B/C (explicit comparative evidence from later sources in the region). Naming blocked - Fails B/C (later sources don't *force* the specific name/meaning onto this *earlier* instance without stronger link). *Your verdict fits.*
  8.  **Solstice Stones:**
      *   **Function/Behavior:** "Aligned to the solstice" (measurable physical fact).
      *   **Ritual Restraint:** "Calendar/Observatory" blocked - Fails A (alignment doesn't prove *use* as calendar/observatory - could be symbolic marker) and Fails B/C (no evidence of *how* it was used). *Your verdict fits.*
  9.  **Mass Grave:**
      *   **Function/Behavior:** "Violence" (fractures), "probably a massacre" (multiple peri-mortem injuries, bodies piled). Direct physical evidence of cause and manner. *Your verdict fits.*

  **Addressing Your Inconsistency Concerns:**

  *   **3 vs. 4:** Principle 2 (Institution) allows the weight inference because the *pattern itself* demonstrates coordinated action/enforcement. Principle 3 (Belief Restraint) blocks the motif inference because shared style doesn't inherently demonstrate shared belief (it could be trade, fashion, kinship markers) *and* lacks the specific evidence for religious meaning (A/B/C).
  *   **1 vs. 2:** Both involve deposition. Pot (1) fits Ritual Restraint A (non-utilitarian act in specific mortuary context) and potentially B. Sword hoard (2) fails Ritual Restraint A (potential utilitarian explanations exist) and lacks B/C for "offering".
  *   **2 vs. 7:** Both have analogues. Sword hoard (2) fails Ritual Restraint A (utilitarian possibility). Coin (7) passes Ritual Restraint A (non-utilitarian act) and B/C (direct comparative link). The *nature of the act* (coin in mouth) is inherently symbolic/non-utilitarian in a way a hoard isn't necessarily.
  *   **4 "Too Strong"?** No. Dozens of pots don't change the *nature* of the evidence. It's still a stylistic pattern, not evidence of the *meaning* behind the style. Principle 3 holds.

  **Sacrifices Required (For Consistency):**

  *   **5 (Scene 1 - "ranked people"):** This is the most vulnerable under strict principles. While size difference is a strong cross-cultural indicator, it's still an *interpretation* of symbolism. Principle 1 *just* allows it as an inference about social behavior from a visual cue. If you wanted absolute strictness, you might downgrade to "the larger figure was depicted as more important in this scene" and avoid the societal-level claim. *You prioritized this; the principles can accommodate it, but it's at the edge.*
  *   **1 ("ritual"):** Under strictest application, without explicit comparative evidence (B), you might only say "intentionally broken and placed in the grave," implying ritual without naming it. Your use of "ritual" is defensible under A and general mortuary practice, but it's a slight stretch without specific B/C for *this* act. *You keep this.*

  **Applying Principles to Your New Cases:**

  1.  **Oversized Building (No hearth/storage/trash):**
      *   **Function/Behavior:** "Much larger than neighboring buildings," "lacks evidence of domestic activities (hearth, storage, refuse)".
      *   **Social Structure/Institution:** "Suggests a special function, likely for communal gatherings or ceremonies." (Pattern: size + cleanliness implies non-domestic, collective use).
      *   **Ritual Restraint:** *Avoid* "temple," "shrine," "ritual center" - fails A (size/cleanliness alone don't prove ritual; could be council house, storage *for special items*, feasting hall) and lacks B/C.
  2.  **40 Identical Faceless Figurines in Pit:**
      *   **Function/Behavior:** "Deliberately deposited together," "intentionally unfired (or never used?)".
      *   **Ritual Restraint:** "Ritual deposit" is acceptable under A (non-utilitarian quantity/deposition, unfired suggests made for deposition) *if* no plausible utilitarian explanation (e.g., pottery workshop waste would likely be near kilns, have variety/defects). If context supports ritual, use it cautiously. *Avoid* naming deities or specific rituals. Could say "likely votive offerings or ritual objects" if confident via A.
  3.  **Healed Trepanation:**
      *   **Function/Behavior:** "Skull shows evidence of trepanation," "healed bone indicates the individual survived the procedure."
      *   **Social Structure/Institution/Ritual?** Focus on the physical fact and survival. *Avoid* "surgery," "medical knowledge," "ritual operation." You can say: "This demonstrates the technical skill to perform the operation and the care provided during recovery." The *intent* (medical, ritual, other) is unknowable from a single case without B/C. Attribute the action and outcome, not the motivation.
  4.  **Repaired Bronze Bowl from Bog:**
      *   **Function/Behavior:** "Found in wetland (bog)," "shows evidence of repair before deposition."
      *   **Ritual Restraint:** "Deliberately deposited" (bog context often implies this). "Valued object" (repaired). *Avoid* "votive offering," "ritual deposit" unless specific comparative evidence (B/C) links repaired objects in bogs to ritual *in this culture*. Could say: "The repair shows it was valued and used before being deliberately placed in the bog."

  **Summary:**

  Your instincts largely align with evidence-based principles prioritizing observable behavior, demonstrable patterns for institutions, and extreme caution regarding belief/ritual. The key is rigorously applying:

  1.  **What does the object/context *directly* show happened?** (Behavior/Function)
  2.  **Does the pattern *require* organized social power?** (Institution)
  3.  **Is the act/object clearly non-utilitarian/extraordinary *and* backed by specific comparative evidence before I call it "ritual" or imply belief?** (Belief Restraint)

  This framework forces clarity, minimizes overreach, and accommodates most of your verdicts. The label for Scene 1 of the wall painting (ranking) is the most interpretive leap allowed, justified as a behavioral inference from a visual cue. Applying this consistently will make your "wall text" defensible and a model of responsible interpretation.
