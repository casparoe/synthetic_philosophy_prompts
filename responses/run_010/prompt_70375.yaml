  For the big question: Collapse does track something real (loss of sociopolitical structure), but complexity creates the potential for dramatic collapse, so it's both. The remaining disagreement is both empirical (about Rapa Nui evidence) and conceptual (what counts as significant loss). The mataa tool analysis could partially resolve it - if they're weapons, it supports Nadia; if tools, Theo.

