  Move 2: Theo challenges Nadia's narrative point by point. This is clearly right - he correctly notes the contested nature of evidence. Nadia should've conceded uncertainties while maintaining that some institutional collapse occurred.

  Move 3: Nadia argues institutional change equals collapse despite Theo's objections. Defensible but overstated - the changes are real but calling it "collapse" ignores scale. Theo should've engaged her point about loss instead of retreating to Tainter's definition.

  Move 4: Theo applies Tainter's strict definition to exclude Rapa Nui. Defensible but overstated - the definition is useful but shouldn't be absolutized. Nadia should've challenged the definition's applicability to smaller societies.

