  > 2. **Defending impossibility:** In Part 3, you assert Moore-paradoxical belief is "impossible" but only re-state your Part 2 account. You need to *argue* for this—e.g., explain why Evans' transparency makes the conjunction unthinkable, or why self-defeat in belief is unsustainable.  
