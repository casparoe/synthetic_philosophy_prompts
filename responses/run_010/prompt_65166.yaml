  Hmm, this is complex. The user clearly knows the literature cold - they mention Varoufakis, Schäuble, the ECB timelines - so I shouldn't waste time summarizing basics. They want forensic game-theoretic mapping of the June 27 referendum moment. Key challenges they raise: 

  The calendar constraints (June 30 deadline, ECB payments) seem to function like commitments despite being "non-chosen" events. And the referendum appears to have tightened constraints on both sides rather than creating off-ramps. Plus, the catastrophic costs were asymmetrically borne by Greece, undermining Schelling's mutual vulnerability premise.

  I should structure this carefully. First, rigorously define the players and their actual strategic options/payoffs at the exact moment Tsipras announced the referendum. Must distinguish true commitments (irreversible moves) from mere threats or signals. Those deadlines are tricky - they're exogenous constraints, but players strategically exploited them as commitment devices. 

