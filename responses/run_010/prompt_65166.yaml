  This isn't just about Greece; their dissertation needs to show where canonical models break. I'll flag how the case reveals three limitations: audience costs overriding two-player logic, exogenous constraints dominating strategic moves, and asymmetry voiding deterrent threats. They'll need to theorize those gaps. 

