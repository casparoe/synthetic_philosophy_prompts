prompt: |-
  I cover research methodology for a science desk, and two norms in clinical evidence keep striking me as sitting uneasily beside each other. Guideline bodies rank evidence in a pyramid: randomized trials near the top, observational studies of the very same drug below them, and reasoning about how the drug works mechanically at the bottom, barely above expert opinion. Then, inside the trial, the analysis that counts groups patients by the arm they were assigned to rather than by whether they actually took the drug — even when a third of the treatment arm never filled the prescription and everyone concedes the resulting estimate is diluted toward zero. The analysis restricted to those who followed the protocol is set aside as biased, because adherence is settled after randomization and carries prognosis along with it.

  What conception of causation does that combination presuppose? It seems to license the thought that assignment, not ingestion, is the cause — as though a cause is whatever a policy could be built around — and yet the quantity being estimated is defined in frankly counterfactual terms, as the difference between the outcome observed and the outcome those patients would otherwise have had. Does ranking trials above observational work commit anyone to a view on which causes are only revealed by interventions, or is it just a practical worry about confounding that a counterfactual account motivates equally well? Reconstruct the implicit theory, distinguish what the practice strictly requires from what merely suits it, indicate which parts of it several incompatible theories would license anyway, and say what guideline-writing would look like if mechanistic inference were given the standing that the same tradition's insistence on results carrying over to new populations seems to demand.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a science desk writer focusing on research methodology, particularly in clinical evidence. They’re puzzled by two norms: the evidence hierarchy that places RCTs above observational and mechanistic studies, and the preference for intention-to-treat (ITT) analysis over per-protocol analysis. They want to understand the underlying causal assumptions and how these practices fit together.

  First, I need to recall the standard evidence pyramid. RCTs are at the top because randomization minimizes confounding. Observational studies are lower due to potential biases, and mechanistic reasoning is at the bottom. Then there's ITT, which analyzes patients based on assignment, not adherence. The user notes that ITT dilutes effects if non-adherence is high but is still preferred because per-protocol might introduce bias.

  The user’s main question is about the conception of causation here. They wonder if the focus on assignment implies that cause is tied to policy interventions, even though the estimated effect is counterfactual. They also ask if prioritizing RCTs is about interventions revealing causes or just avoiding confounding. Plus, they want a reconstruction of the implicit theory and how guideline-writing would change if mechanistic inference were elevated.

  I should start by breaking down the causal theories. The implicit theory seems to be a mix of potential outcomes and interventionist views. The ITT aligns with interventionism because it values policy actions (prescribing) over biological mechanisms (ingestion). The focus on assignment as the cause suggests that what matters is what we can control, hence policy relevance. But the counterfactual aspect is still there in the estimation of the difference between outcomes.

  Then, distinguishing strict requirements from practical conveniences. Strictly, ITT preserves randomization's benefits for unbiased effect estimation. The hierarchy requires RCTs for causal inference due to confounding control. But practically, ITT handles real-world adherence issues, and the hierarchy manages evidence reliability.

  Incompatible theories like potential outcomes, interventionist, and mechanistic accounts all support RCTs but for different reasons. Potential outcomes value randomization for unbiased estimates, interventionist for manipulations, mechanistic for understanding processes. ITT is supported by potential outcomes for preserving randomization and interventionist for policy action, but mechanistic might critique it for ignoring biology.

  Elevating mechanistic evidence would integrate it into guidelines. Instead of just ranking, guidelines could use mechanistic data to extrapolate, especially when RCTs are impractical. This would require frameworks like Bradford Hill criteria or systems biology. For example, in pandemics, mechanistic insights could expedite recommendations when RCT data is pending.

  I should also address the user's deeper needs. They might be questioning whether current methodologies are too rigid, potentially overlooking biological plausibility. They might want guidelines that are more nuanced, combining different evidence types. Their identity as a science writer suggests they need a clear explanation for their audience, possibly to critique or clarify existing norms.
answer: |-
  This tension exposes a fascinating philosophical fault line in evidence-based medicine (EBM). The combination reflects a pragmatic, policy-oriented **Interventionist Potential Outcomes framework** with a strong emphasis on **causal robustness under manipulation**, tempered by deep concerns about **confounding**. Let's reconstruct the implicit theory:

  ### The Implicit Causal Theory
  1.  **Primacy of Manipulation:** Causes are defined by *what we can deliberately do* to change outcomes. The "cause" isn't the biochemical interaction (ingestion/effect), but the *actionable policy decision* ("assign/prescribe drug X"). This aligns with an **Interventionist (Manipulationist) Account of Causation** (e.g., Woodward): X causes Y if intervening to change X changes Y.
  2.  **Counterfactual Foundation (Potential Outcomes):** The *quantity* being estimated is fundamentally counterfactual: "What would happen *on average* if we *assigned* this population to treatment vs. control?" (Average Treatment Effect, ATE). This requires defining outcomes under hypothetical scenarios.
  3.  **Randomization as the Gold Standard:** Random assignment is the *only* reliable method to achieve exchangeability (no confounding) between groups *on average*, ensuring the observed difference in outcomes reflects *only* the assignment difference. Observational studies, without this, are vulnerable to unmeasured confounding. Mechanistic reasoning lacks this direct link to population-level effects.
  4.  **Policy-Relevant Estimand:** The goal is to estimate the effect of *implementing a policy* ("offer/prescribe the drug"), not the effect of the drug *only* in perfectly adherent patients. This includes real-world factors like non-adherence, drop-out, and switching.
  5.  **Distrust of Post-Randomization Adjustments:** Adjusting for adherence ("per-protocol") breaks the magic of randomization. Adherence is often *post-treatment* and likely *confounded* (e.g., healthier patients adhere more). Conditioning on it introduces selection bias ("collider bias") by creating non-exchangeable subgroups.
  6.  **Hierarchy Based on Confounding Risk:** The evidence pyramid primarily ranks methods by their *vulnerability to confounding bias*. RCTs minimize it best, observational studies less so (relying on measured covariates), mechanistic reasoning worst (no direct population effect estimate, prone to omitted variables and flawed models).

  ### What the Practice Strictly Requires vs. What Merely Suits It
  *   **Strictly Requires:**
      *   **ITT Analysis:** Preservation of the initial randomization for unbiased *causal effect estimation of the assignment policy* under the potential outcomes framework. This is non-negotiable for the primary estimand.
      *   **RCT Primacy:** Reliance on randomization as the *only guaranteed method* for achieving average exchangeability in causal inference. This is foundational for claiming unbiased ATE estimates.
      *   **Counterfactual Definition:** The conceptualization of the causal effect *as* a contrast between potential outcomes.
  *   **Merely Suits It (Pragmatic Convenience):**
      *   **Pyramid Structure:** The rigid hierarchy is a simplification. The "ranking" is primarily about confounding control, not inherently devaluing other evidence types for *all* purposes (e.g., discovery, safety signals, long-term effects).
      *   **De-emphasis of Mechanism:** While mechanistic reasoning is low, its *complete exclusion* isn't strictly required. The practice *suits* a desire for direct empirical evidence over theoretical models prone to error.
      *   **Focus on Assignment as Cause:** The *labeling* of "assignment" as *the* cause is pragmatic framing. The theory often recognizes the biological mechanism but prioritizes the estimand relevant to the intervention.

  ### Parts Licensed by Incompatible Theories
  Several causal theories can justify *parts* of this practice, even if they diverge elsewhere:
  1.  **Potential Outcomes (Rubin Causal Model):** Fully justifies randomization for unbiased ATE estimation and ITT as the primary analysis for the assignment effect. It doesn't *require* the interventionist label but is compatible with it.
  2.  **Interventionist/Manipulationist Accounts (Woodward, Pearl):** Directly justify the focus on assignment as the manipulable cause. They provide a strong rationale for the pyramid (interventions reveal causes) and ITT (estimating effects of manipulation). They naturally emphasize policy relevance.
  3.  **Regularity/Probabilistic Theories (e.g., Humean):** Can justify the hierarchy based on the *reliability* (consistency, strength) of the association observed. RCTs show the strongest, most consistent associations less likely due to chance/confounding. ITT provides a clear, objective grouping variable.
  4.  **Mechanistic/Process Theories (e.g., Salmon, Glennan):** Criticize the over-reliance on RCTs/ITT for ignoring *how* things work. However, they *can* license the use of RCTs as providing strong evidence *that* a causal connection exists, even if they demand mechanistic detail for full understanding and external validity. They might see ITT as a flawed but sometimes necessary pragmatic step.

  ### Guideline-Writing with Elevated Mechanistic Inference
  If mechanistic inference were elevated to the standing demanded by concerns about external validity ("results carrying over to new populations"), guidelines would look fundamentally different, embracing **Integrative Causal Inference**:

  1.  **Beyond the Pyramid to an Evidence Integration Framework:** Instead of a rigid hierarchy, guidelines would explicitly integrate evidence streams:
      *   **RCTs:** Provide the gold-standard estimate of the *average effect of assignment/policy* in the studied population under trial conditions.
      *   **Observational Studies:** Provide evidence on effectiveness in broader populations, long-term effects, rare outcomes, and (crucially) *heterogeneity of treatment effects* (HTE) based on patient characteristics often hinted at by mechanism.
      *   **Mechanistic Evidence:** Not just "supportive," but **essential for:**
          *   **External Validity/Extrapolation:** Understanding *why* the drug works (target pathway, biological plausibility) is critical to judge *if* and *how* it might work in populations not studied in RCTs (e.g., different demographics, comorbidities, concomitant medications). Does the mechanism suggest likely effect modifiers?
          *   **Interpreting Null/Inconsistent RCTs:** Did the RCT fail because the mechanism is wrong, or because of implementation issues (dosing, adherence, patient selection)? Mechanistic understanding helps distinguish.
          *   **Designing Better Trials:** Informing patient selection (enriching for those likely to respond based on mechanism), dosing, biomarkers, and endpoints.
          *   **Safety:** Identifying potential off-target effects or interactions predicted by the mechanism.
          *   **Causal Confirmation:** Providing an independent line of evidence supporting (or refuting) the causal claim from RCTs/Observational studies (Bradford Hill's "Plausibility" and "Coherence" criteria on steroids).
  2.  **Causal Models as Core Tools:** Guidelines would explicitly reference formal or conceptual **causal models** (e.g., using Directed Acyclic Graphs - DAGs) that incorporate mechanistic knowledge. These models would be used to:
      *   Assess plausibility of effect estimates from all sources (RCTs included).
      *   Guide adjustments in observational studies.
      *   Identify potential sources of bias (confounding, selection).
      *   Justify extrapolation claims ("We believe this works in group Z because the mechanism suggests the target pathway is relevant and functional in Z, despite lack of direct RCT evidence").
  3.  **Refined Estimands:** While ITT for policy effect remains crucial, guidelines might more routinely *also* demand estimates closer to the biological effect:
      *   **Per-Protocol/Causal Estimands (with Caution):** Reported alongside ITT, *if* robust methods addressing adherence-related confounding (e.g., Instrumental Variables, G-estimation, carefully executed PP with covariate adjustment) are feasible and well-justified by the context and mechanistic understanding.
      *   **Target Trial Emulation:** Using high-quality observational data structured like an RCT, guided by mechanistic DAGs, to estimate effects in populations not covered by RCTs.
  4.  **HTE as Central:** Guidelines would place far greater emphasis on identifying *for whom* the treatment works best/worst, driven by integrating RCT subgroup analyses (often underpowered), observational HTE studies, and *predictions from mechanism* (e.g., biomarkers, genetic variants in the drug target pathway). "One size fits all" recommendations would be rare.
  5.  **Dynamic & Bayesian Elements:** Guidelines could incorporate mechanisms more formally via Bayesian frameworks, updating the prior probability of efficacy/safety (based on mechanism and preclinical data) with clinical trial results. They might become more dynamic, evolving rapidly as new mechanistic insights emerge.

  **In essence:** Elevating mechanistic inference transforms guideline-writing from a process dominated by ranking isolated studies based primarily on confounding control, to a process of *synthesizing causal narratives* built on integrating empirical evidence (RCTs, Observational) with deep biological understanding to answer not just "Does it work (here)?" but "How does it work?", "Will it work *there*?", and "For *whom* will it work best?" This aligns far better with the tradition's own concern that results must carry over to new populations, as mechanistic understanding is the primary engine for justifying that carry-over. It moves EBM towards a more nuanced, biologically grounded, and ultimately more practical science.
