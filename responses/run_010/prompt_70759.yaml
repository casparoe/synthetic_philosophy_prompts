prompt: |-
  I write about science for a general-interest magazine and have become more interested in the Nobel rules than in the laureates. Two of them matter here: no prize may be shared by more than three individuals, and prizes are not awarded posthumously, unless the laureate dies between the announcement and the ceremony. Rosalind Franklin is the case I keep returning to — she died in 1958, and when the 1962 medicine prize for the structure of DNA went to Watson, Crick, and Wilkins, both rules bit at once, the list of names already being full.

  What conception of a discovery, and of the life a discovery belongs to, do those two rules jointly presuppose? I want the implicit theory reconstructed, not labeled. Is it Plutarch's — that a career becomes intelligible once compressed into one life set beside others, which is why the Lives announce that they are concerned with lives rather than histories and dwell on remarks, jests, and small acts rather than campaigns — or is it merely administrative, a device for producing a short list and a photographable moment? Which rival accounts of scientific credit does the three-name cap actually exclude, and which is it only awkward alongside: could a genuinely collective theory of authorship be served by three names, or does the cap commit the committee to something stronger? And are the two rules even consistent with each other, when the posthumous bar makes a contribution's recognizability depend on how long its author happened to survive it? Finally, tell me what the institution would have to become if it adopted an openly hagiographic rationale — prizes as moral exemplars, in the Plutarchan sense — or an openly anti-hagiographic one, prizes attaching to bodies of work rather than to persons.
reasoning: |-
  Okay, the user writes for a science magazine and is fascinated by Nobel Prize rules, specifically the three-person limit and the posthumous award restriction. They're using Rosalind Franklin as a case study—her exclusion from the 1962 DNA structure prize highlights how both rules intersected. The user wants me to reconstruct the implicit theory behind these rules, not just label it. They're asking deep philosophical questions about discovery attribution and the institution's underlying values.

  Hmm, this is nuanced. The user isn't asking for historical facts but wants an unpacking of presuppositions. They reference Plutarch's biographical approach as a potential framework, contrasting it with administrative practicality. Their questions reveal layers: How do the rules shape our understanding of scientific discovery? What models of credit do they enforce or exclude? Are the rules internally consistent? And how would the Nobel's purpose change if it embraced hagiography or depersonalized awards?

  First, I need to tackle the joint presuppositions. The three-name cap implies discovery is discrete, attributable to individuals, and that "significant contribution" can be ranked—a fundamentally individualistic view. The posthumous rule adds temporal fragility: recognition depends on surviving the discovery's validation period. Together, they assume science progresses through punctuated breakthroughs owned by living individuals. That feels at odds with how collaborative or iterative science actually works, like Franklin's case where her data was foundational but she died before validation crystallized.

  The user’s Plutarch comparison is sharp. Is the Nobel framing laureates as moral exemplars? The rules do force a biographical compression—three living figures become synecdoches for broader efforts. But unlike Plutarch, the Nobel doesn’t dwell on personal anecdotes; it’s more about mythmaking through scarcity. The cap excludes theories of distributed credit (e.g., cumulative work, large teams) or acknowledges them awkwardly—imagine trying to represent the Human Genome Project with three names. Yet three names *could* gesture at collectivity if seen as delegates, though the prize’s prestige undermines that reading.

  Internal consistency is a problem. The posthumous bar makes recognition luck-dependent: Franklin contributed equally but died too early, while Wilkins lived. That clashes with the idea of objective merit. If discovery belongs to the life, why condition it on post-discovery longevity?

  Now, alternative rationales. Openly hagiographic Nobels (Plutarchan exemplars) would require amplifying personal narratives—maybe awarding older scientists for lifetime integrity over single breakthroughs. Anti-hagiographic prizes (work-focused) might anonymize awards or honor collectives, but that risks diluting the Nobel’s celebrity appeal. Both would destabilize the current model.

  The user’s depth suggests they’ll push back on surface answers. They want the unspoken philosophy laid bare: how these rules enforce a specific, contestable ontology of science. I’ll need to weave Franklin’s case throughout to ground the analysis. Their closing question about institutional transformation is especially provocative—it hints at critiquing the Nobel’s power in shaping scientific legacy.
answer: |-
  The Nobel rules you describe—limiting laureates to three and barring posthumous awards except in narrow circumstances—presuppose a layered conception of scientific discovery and its relationship to human lives. Franklin's case crystallizes the tensions, but the implicit philosophy extends beyond her. Let's reconstruct the underlying theory:

  ### Core Presuppositions
  1.  **Discovery as a Discrete, Attributable Event:** The rules assume a discovery has a definable "moment" or bounded period of breakthrough, distinct from preparatory or confirmatory work. This event is owned by specific individuals who made "significant" or "decisive" contributions.
  2.  **The Primacy of the Individual Agent:** Discovery belongs, fundamentally, to *persons*, not institutions, teams, or abstract processes. Scientific progress is driven by identifiable genius or insight residing in individuals.
  3.  **Credit as Finite and Hierarchical:** The value of recognition is diluted if shared too widely. Contributions can be ranked, and there exists a meaningful cut-off point (three) where further names diminish the prize's symbolic power. This presupposes that the "essential" contribution *can* be isolated to a very small group.
  4.  **Recognition Requires a Living Embodiment:** A discovery only fully "belongs" to a life if that life persists long enough for the discovery's significance to be validated by the community and the Prize committee. Recognition is an act performed *upon* and *for* the living laureate; the prize is a laurel *worn*, not just a historical marker. The life must be present to receive the accolade and embody the achievement.

  ### Plutarch vs. Administration: Which Framework?
  It's **both**, but weighted towards administration, using Plutarchan *effects*:
  *   **Administrative Core:** The three-name cap is primarily a pragmatic constraint. It prevents endless disputes over inclusion (though it creates others), ensures the prize remains exclusive/prestigious, simplifies selection logistics (imagine evaluating 50 names for the LHC Higgs discovery!), and guarantees the iconic "photographable moment" – three figures receiving the award. The posthumous bar avoids the complex, often impossible, task of evaluating historical contributions fairly *post-mortem* within the Prize's annual cycle and living memory. It keeps the Prize focused on contemporary science and living scientists.
  *   **Plutarchan Effect:** The *consequence* of these rules is a Plutarchan compression. By forcing selection to a maximum of three *living* individuals, the Prize *creates* emblematic figures. Watson, Crick, and Wilkins *become* "the discovery of DNA's structure" for the public and history in a way a longer list or an institution would not. The focus shifts from the intricate history (Franklin's data, Chargaff's rules, Pauling's near-miss, the King's College context) to the "character" of the discovery as embodied by these few lives. The Prize ceremony *is* their moment of apotheosis. However, unlike Plutarch, the Nobel doesn't *intentionally* dwell on "remarks, jests, and small acts" to reveal character; it mythologizes through *achievement* alone.

  ### What the Three-Name Cap Excludes and Awkwardly Accommodates
  *   **Excluded:** Genuinely **distributed, cumulative, or large-scale collaborative models** of discovery.
      *   **Big Science:** Projects like the Human Genome Project, LHC experiments, or LIGO involve hundreds or thousands making essential contributions. Reducing this to three names is nonsensical. The cap forces the committee to either ignore such work or distort it by picking symbolic "leaders," often excluding key technical or theoretical contributors.
      *   **Simultaneous/Independent Discovery:** If four individuals in different labs made the same crucial leap independently, the cap forces an arbitrary, unjust exclusion.
      *   **Foundational but Diffuse Contributions:** Work like Franklin's crystallography – essential groundwork without which the final "leap" couldn't happen – struggles to fit the "decisive contribution" model demanded by the cap. It's easily relegated to "context."
  *   **Awkwardly Accommodated:** **Teamwork within Small Groups.** The cap can *gesture* towards collaboration, but only within the strict limit of three. It implies that discovery is achievable by a tiny, tightly-knit unit. It struggles with:
      *   **Hierarchical Labs:** Does the PI get the credit over the postdoc who had the key insight? The cap often favors the established figure.
      *   **Non-Hierarchical Collaboration:** If four peers contributed equally, the cap necessitates an invidious choice.
  *   **Could Three Names Serve Collectivity?** Only superficially, as **symbolic representatives**. It acknowledges collaboration exists but fundamentally undermines the collective principle by insisting the *essential* credit belongs to no more than three specific individuals. The cap commits the committee to a **strong individualist ontology of discovery**, where the collective is merely the sum of its leading parts.

  ### Consistency Between the Rules
  The rules are **internally consistent only within their own individualistic, presentist framework**, but **deeply inconsistent with the messy reality of scientific contribution**:
  *   **Within Framework:** The life must be present to receive the prize (posthumous bar), and the prize must be awarded for a specific discovery to a manageable number of key individuals (cap). Both enforce focus on living agents of the breakthrough moment.
  *   **Inconsistency with Reality (Franklin's Case):** The posthumous bar makes recognition **contingent on biological luck.** Franklin's contribution was as vital as Wilkins's (arguably more so for the model building), but her early death erased her from eligibility *precisely when* the discovery was validated by the Prize. Wilkins lived, so he was included. The cap then solidified this exclusion, as the "three slots" were filled. The rules jointly ensure that **recognition depends not just on the significance of the work, but on the contributor surviving the often-lengthy period between the work and its ultimate validation/acclaim.** This contradicts the ideal of objective assessment of merit.

  ### Alternative Rationales: Transforming the Institution
  1.  **Openly Hagiographic (Plutarchan Exemplars):**
      *   **What it would require:** Prizes awarded explicitly for **lives embodying scientific virtue** (perseverance, integrity, courage, insight) *as demonstrated through a body of work*, not just a single discovery. The link to a specific breakthrough would weaken. Committees would prioritize biographical narratives and moral character alongside intellectual achievement. The cap might relax slightly to include key mentors/collaborators who shaped the laureate's character. Posthumous awards *might* become possible for figures whose exemplary lives only became fully appreciated later (e.g., Mendel, ignored in his lifetime).
      *   **Consequence:** The Nobel becomes less a stamp on a discovery and more a canonization of scientific saints. Emphasis shifts from "what was found" to "how they lived and worked." Franklin could be honored for her meticulous rigor and perseverance in the face of adversity, regardless of the DNA omission.

  2.  **Openly Anti-Hagiographic (Work-Centered):**
      *   **What it would require:** Prizes awarded **to bodies of work or discoveries themselves**, explicitly decoupled from individuals. Laureates could be large, named collaborations (e.g., "The LIGO Collaboration"), institutions, or even awarded posthumously based solely on the work's impact. The three-name cap would vanish. Selection would focus on the transformative nature of the work, not the biographies of the doers. The ceremony might involve representatives, not individual heroes.
      *   **Consequence:** The Nobel becomes an award for scientific *achievements*, not scientific *heroes*. It directly addresses the problems of Big Science and diffuse contribution. Franklin's X-ray data and analysis could be cited explicitly as part of the awarded work on DNA structure, regardless of her death. However, it risks losing the human narrative and inspirational power that individual laureates provide.

  ### Conclusion
  The Nobel rules presuppose discovery is an act of individual (or very small group) genius occurring at a discrete moment, and that its significance is properly honored only by bestowing recognition upon the living agents. This creates compelling, Plutarchan-esque icons but at the cost of distorting the collaborative, cumulative, and often serendipitous nature of scientific progress, while making recognition tragically contingent on longevity (Franklin's case). Moving towards either explicit hagiography or work-centered anti-hagiography would fundamentally alter the Prize's nature: one would deepen the focus on scientific lives as moral exemplars, potentially broadening eligibility; the other would shift focus entirely to the work itself, sacrificing individual myth-making for a more accurate, if less personally resonant, recognition of how science actually advances. Both alternatives highlight the profound, often unexamined, assumptions about agency and credit embedded in the current rules.
