  - SIA defender (Sam) attacking SSA's absurdity in Case One (concluding galaxy is empty before looking)
  - The attempted reduction of SIA to SSA with possible observers
  - Testing that reduction against the cases
  - Ending with clear unresolved disagreements and proposed next steps

