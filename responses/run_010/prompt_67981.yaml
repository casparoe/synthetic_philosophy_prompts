  ## Bench Memo: *State v. Archer* (Watercraft Safety Act Interpretation)

  **Recommended Disposition:** Reverse the conviction. "Motorized watercraft" in Section 12, as enacted in 1994, did not encompass a stand-up paddleboard with a low-speed electric-assist motor primarily augmenting human propulsion. Case 2 (*Fireworks*) is the closest analog. The hardest precedent to distinguish is Case 6 (*Kitchen Equipment*).

  **TO:** My Colleagues  
  **FROM:** [Your Name]  
  **RE:** *State v. Archer* - Statutory Interpretation of Watercraft Safety Act § 12  
  **DATE:** [Date]

  This memo addresses our interpretive approach in *Archer*, where the defendant operated an electric-assist paddleboard within 200 feet of a marked swimming area, convicted under Section 12's prohibition on operating a "motorized watercraft." Given potential disagreement, I've distilled our panel's commitments from our last six statutory cases into three candidate rules, applied them here, and recommend reversal. Our precedents reveal tensions, demanding a principled choice about text, purpose, and legislative action.

  **(a) Candidate Interpretive Commitments**

  Analyzing our six cases reveals three distinct, internally consistent approaches capable of explaining the outcomes, though each requires grappling with at least one outlier or tension:

  1.  **Text-Purpose Hybrid (Favors Text Primacy, Purpose Resolves Ambiguity):**
      *   **Rule:** We start with the ordinary meaning of the statutory text at enactment. If the text is unambiguous, we apply it strictly (even if seeming illogical or contrary to underlying purpose). If the text is ambiguous *after* considering context and structure, we resolve the ambiguity by reference to the provision's core purpose, construed narrowly based on contemporaneous legislative understanding.
      *   **Handling Precedents:**
          *   *Fits:* Case 1 (Textual "thirty days" deemed ambiguous practically; purpose of providing a functional period resolved it). Case 3 (Ambiguous "presence" resolved by core purpose: protecting minors from witnessing violence, regardless of physical proximity). Case 5 (Ambiguous "resided" resolved by established legal meaning tied to purpose: ensuring veteran community connection, not punishing involuntary absence).
          *   *Tension/Outlier:* Case 2 is consistent (Text "sell" unambiguous; applied strictly despite purpose applying). Case 4 is consistent (Text "in writing" unambiguous per 1987 meaning; adjacent amendment shows purpose *not* to expand to email for *this* section). **Case 6 is the strain:** The text "portable extinguisher" was unambiguous. Applying it strictly despite the superior fixed system *and* clear modern purpose (fire suppression) seems contrary to this rule's allowance for purpose to resolve ambiguity. This rule must treat Case 6 as overly rigid or implicitly finding the text so clear that purpose couldn't overcome it, creating internal tension.
      *   **Penal Provision Ambiguity (Case 3):** This rule accommodates resolving ambiguity in penal provisions against the state *only if* the text is genuinely ambiguous *after* the initial analysis. In Case 3, "presence" *was* ambiguous, and the purpose-based resolution *happened* to favor the state. The rule doesn't *require* resolution against the state if purpose clearly points the other way, but ambiguity is the trigger.

  2.  **Enacted Text Originalism (Strict Historical Meaning):**
      *   **Rule:** We apply the statute based *exclusively* on the original public meaning of the text at the time of enactment. Legislative purpose, subsequent developments, technological changes, and even absurd results are generally irrelevant unless necessary to resolve a true ambiguity inherent in the original meaning itself. Subsequent legislative actions (like targeted amendments or failed bills) are only relevant if they directly clarify the original meaning.
      *   **Handling Precedents:**
          *   *Fits:* Case 2 (Unambiguous "sell" meant sale for consideration; applied strictly). Case 4 (Unambiguous "in writing" meant physical document per 1987; adjacent amendment confirms no expansion). Case 6 (Unambiguous "portable extinguisher" meant a portable unit; fixed system doesn't qualify).
          *   *Tension/Outlier:* Case 1 is a strain (Original meaning of "thirty days" likely didn't inherently exclude closure days; the "functional period" gloss imports modern practicality). Case 3 is consistent only if "presence" was ambiguous originally (Could "presence" via monitor fit 199X meaning? Our opinion suggests yes, but it's debatable). **Case 5 is the outlier:** Applying the strict historical legal meaning of "resided" (domicile) *despite* the ordinary meaning potentially suggesting physical presence, and *despite* the practical consequence of granting an exemption during absence, injects a technical legal meaning that might not have been the sole original public understanding. This rule requires viewing Case 5 as correctly identifying the sole original legal meaning.
      *   **Penal Provision Ambiguity (Case 3):** Under this rule, the *lenity* principle applies *only* if the original meaning is genuinely ambiguous *after* exhausting originalist tools. In Case 3, the court presumably found no such ambiguity in "presence" applying to perception, or found the original meaning encompassed it.

  3.  **Practical Operation (Functional Fulfillment of Purpose):**
      *   **Rule:** We interpret the statute to achieve its practical purpose and address the mischief it was designed to remedy, as understood from text, context, and history. The specific words used are important guides but may be construed flexibly to encompass new situations that functionally implicate the core hazard or objective, especially where technology evolves. Literal adherence yielding pointless or contrary results is disfavored.
      *   **Handling Precedents:**
          *   *Fits:* Case 1 (Purpose: Allow a functional claim period; result achieved). Case 3 (Purpose: Protect child witnesses; result achieved). Case 6 (Purpose: Ensure effective grease fire suppression; functionally achieved by superior system, *but we ruled contrarily* - see below). Case 5 (Purpose: Benefit county-domiciled vets; result achieved despite absence).
          *   *Tension/Outlier:* **Case 2 is the clear outlier:** The safety purpose applied fully, but the court rigidly adhered to "sell," refusing to flex the term to cover the functional equivalent (donation-funded distribution). This result is directly contrary to this rule's core tenet. Case 4 is a strain (Purpose of efficient filings arguably supported email; refusal to adapt text based on adjacent amendment is rigid).
      *   **Penal Provision Ambiguity (Case 3):** This rule readily incorporates purpose, which in Case 3 aligned with the state. Lenity might temper the *breadth* of purpose-driven interpretations in penal statutes, but the core analysis is purpose-driven.

  **(b) Application to *Archer***

  1.  **Text-Purpose Hybrid:**
      *   **Analysis:** The text "motorized watercraft" in 1994 unambiguously referred to craft propelled *primarily* or *significantly* by motor (like "thundering ski boats" and jet skis), distinct from human-powered craft with minor auxiliary power. The electric-assist paddleboard (human primary, motor assist @ 4mph) falls outside this core meaning. If "motorized" is deemed ambiguous regarding minimal assists, the core purpose (preventing fast-powered craft from striking swimmers quickly) resolves it: a 4mph board doesn't create the hazard of a jet ski closing rapidly on swimmers. The 1994 legislature simply didn't contemplate this technology as implicating the targeted risk.
      *   **Result:** Reversal. Textual core excludes it; purpose confirms exclusion.
      *   **Level of Generality:** Our record supplies the sponsor's statement ("thundering ski boats," jet ski accident) and the nature of the hazard (striking swimmers) to fix the purpose at the specific level of **"stopping fast boats near beaches"** rather than the broader "protecting swimmers from powered craft." Case 3 used specific context (assault witnessed) to define "presence"; Case 2 refused to broaden "sell" based on purpose.

  2.  **Enacted Text Originalism:**
      *   **Analysis:** Did "motorized watercraft" in 1994 encompass *any* watercraft with *any* motor, however minimal its role? The sponsor's examples suggest a focus on significant motor power, but the text "motorized" doesn't specify a power threshold. A literalist could argue "motorized" means "fitted with a motor," full stop. However, the term likely carried a connotation of *primary* motor propulsion in common usage circa 1994. The electric-assist paddleboard, especially at that time, was likely seen as a *human-powered* craft with an *aid*, not a "motorized watercraft" akin to a boat or jet ski. The 2009 amendment defining "vessel" elsewhere is irrelevant to Section 12's original meaning.
      *   **Result:** Likely **Reversal** (original meaning excludes minimal-assist craft), but **No Determinate Answer**. It hinges entirely on the factual finding of the original public meaning of "motorized watercraft" in 1994 regarding minimal electric assists. The record provides context (sponsor's statement, jet ski accident) suggesting the meaning was limited to craft where the motor is the primary propulsion source creating speed/hazard. A literalist might convict based solely on "has a motor."
      *   **Level of Generality:** This rule inherently fixes purpose at enactment. The sponsor's statement helps define the *mischief targeted* ("thundering ski boats," jet skis striking swimmers), confirming the narrow scope.

  3.  **Practical Operation:**
      *   **Analysis:** The core purpose is protecting swimmers from being struck by powered craft that can approach faster than they can evade. The electric-assist paddleboard, moving at 4mph (~walking speed), can still "close on a swimmer faster than the swimmer can get clear," especially if the swimmer is unaware or moving slowly. The motor provides distinct propulsion beyond paddling alone. It functionally implicates the hazard, albeit at a lower level of risk than a jet ski.
      *   **Result:** **Conviction Affirmed.** The board is a powered craft capable of approaching swimmers under motor power within the prohibited zone, fulfilling the functional purpose.
      *   **Level of Generality:** This rule naturally adopts the broader purpose: **"protecting swimmers from powered craft"** that can move under power within the zone. Case 3 supports this functional approach. The sponsor's specific examples are starting points, not limits.

  **(c) Recommendation & Close Analog**

  *   **Recommendation:** Reverse the conviction. Adopting the **Text-Purpose Hybrid** approach, consistent with the majority of our precedents (Cases 1, 3, 4, 5), yields the clearest result here. The 1994 term "motorized watercraft" did not encompass this device, and its minimal speed/power does not trigger the core hazard the legislature targeted.
  *   **Closest Analog:** **Case 2 (*Fireworks*).** Both involve refusing to stretch specific statutory terms ("sell," "motorized watercraft") beyond their core enacted meaning, even where underlying safety concerns might apply (*Fireworks*) or where the technology is new and arguably analogous (*Archer*). The court in *Fireworks* focused on the transaction, not the hazard; we should focus on the type of craft and propulsion, not just the presence of a motor.
  *   **Strongest Losing Consideration:** "The statute's text contains no exception for low-power motors. The defendant operated a craft equipped with a motor providing independent propulsion within the prohibited zone, creating a potential hazard to swimmers, however minimal compared to a jet ski. Ignoring this because the motor is small undermines the safety rule and creates a loophole." (Drawn from the state's argument and Case 6's logic of enforcing the text as written).
  *   **Hardest Precedent to Distinguish:** **Case 6 (*Kitchen Equipment*).** Both involve newer, arguably safer technology not explicitly named in the statute. Distinguishing it requires emphasizing: (1) *Kitchen* involved unambiguous text ("portable extinguisher") describing a specific *object*, whereas *Archer* involves a more contextual term ("motorized watercraft") describing a *type of craft/propulsion*; (2) The safety purpose in *Kitchen* was *achieved* by the fixed system, whereas applying "motorized" to the paddleboard does *not* address the core hazard of *fast* motorboats the legislature targeted; (3) *Kitchen* highlighted the variance process as the remedy, while here, the legislature's *failure* to amend Section 12 (despite amending "vessel") and the *failure* of the 2023 bill suggest intentionality or at least inaction regarding Section 12's scope.

  **(d) Adopted Principle & Legislative Actions**

  *   **Adopted Principle:** **"When interpreting older statutes employing terms potentially impacted by technological change, we apply the ordinary meaning of the text at enactment, construed in light of the specific purpose and mischief the legislature sought to address. We do not extend the text to cover new applications that fall outside the core meaning understood at enactment and that do not implicate the core hazard or objective in a functionally equivalent manner, absent legislative amendment."**
  *   **Commitment:** This commits us to careful historical-linguistic analysis for terms tied to technology or common understanding. It requires identifying the *specific* legislative purpose from context to guide application when the text's edges are fuzzy. It avoids updating statutes based on evolving technology or perceived policy needs unless the original meaning and purpose clearly encompass it. It aligns with Cases 1, 2 (strict text where clear), 3 (purpose resolving ambiguity), 4 (original meaning), and 5 (technical/legal meaning tied to purpose), while providing a principled way to handle Case 6 (specific object vs. functional type).
  *   **2009 Amendment & Failed 2023 Bill:**
      *   **2009 Amendment (Adding 'electric-assist craft' to 'vessel' definition):** This does **minimal work.** It shows the legislature knew how to specifically include such craft *elsewhere in the Act* (registration) in 2009. Applying the negative implication (*expressio unius*) here is **unavailable** under our adopted principle. Why? Because if "motorized watercraft" in Section 12 *already* encompassed electric-assist craft in 1994 (which we hold it did not), the 2009 amendment would be unnecessary for Section 12. Conversely, if it *didn't* encompass them (our holding), the 2009 amendment changing a *different section* doesn't alter Section 12's meaning. At most, it confirms the legislature felt the need to *explicitly* address electric-assist craft in *some* contexts 15 years later, suggesting they weren't originally covered generally.
      *   **Failed 2023 Bill:** This does **no work** for interpretation. It shows subsequent legislators *considered* expanding Section 12 but did *not* enact it. Failed proposals are weak evidence of original meaning or current legislative intent. It suggests the issue was recognized but remains unresolved by the legislature, reinforcing that judicial updating is inappropriate.

  **(e) Future Test Case**

  *   **Scenario:** A defendant operates a traditional kayak within 200 feet of a marked swimming area. The kayak is fitted *only* with a very small electric motor (e.g., < 1 hp) powering a bilge pump and a GPS unit. The motor provides **no propulsion whatsoever**; it solely operates auxiliary equipment. The defendant is paddling manually. Is this kayak a "motorized watercraft" under Section 12?
  *   **Candidate Predictions:**
      *   **Text-Purpose Hybrid:** **No violation.** The craft is not "motorized" in the sense of being propelled by motor. The motor serves an auxiliary function unrelated to movement. The core hazard (powered craft moving under motor power near swimmers) is absent. (Original meaning: "motorized" implied propulsion).
      *   **Enacted Text Originalism:** **Likely No Violation, but possible conviction.** If the original meaning of "motorized watercraft" required motor *propulsion*, no violation. If it meant *any* craft *with* a motor, regardless of function, conviction. Sponsor's focus on "thundering ski boats" and jet skis strongly suggests propulsion. (Originalist tools point to reversal).
      *   **Practical Operation:** **Likely Violation.** The craft has a motor and is in the zone. While the motor isn't propelling it *now*, it *could* potentially be misused, or its presence might cause concern. The purpose of keeping motorized equipment away from swimmers could be invoked. Safety regulators might argue the *presence* of the motor creates a potential risk or complication. (Purpose stretched to affirm).
  *   **Elimination Power:** This case would most cleanly **eliminate the Practical Operation rule.** Affirming a conviction here, where the motor provides *zero propulsion*, would starkly prioritize a broad, abstract safety purpose ("keep motors away") over any plausible textual or original meaning of "motorized watercraft" and the specific hazard of being *struck by a powered craft*. It would demonstrate the rule's potential for significant judicial overreach, updating the statute far beyond its enacted scope based solely on modern policy concerns. Our adopted Text-Purpose Hybrid (and likely Enacted Text Originalism) would avoid this result, maintaining a tether to the statute's original design.
