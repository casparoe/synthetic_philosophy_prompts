prompt: |-
  I run a 90-minute upper-level seminar on self-knowledge for fourteen students, most of whom have had one philosophy-of-mind course and know the vocabulary but have never had an intuition of theirs broken in real time. Last night a friend and I argued for two hours about how much the introspective-unreliability literature actually establishes, and I want the seminar to settle it between themselves rather than inherit either of our positions. His line: the well-known results — people confidently narrating reasons for a preference that was switched behind their backs, or explaining a judgment they never made — show only that we lack privileged access to our own cognitive processes, and leave untouched the authority of reports about our present experience: how vivid it was, in what order things seemed to happen, what we seem to be attending to right now. My line: the failure runs all the way down, and the immunity of phenomenology is a concession with no principled basis.

  Design an in-class activity that puts that dispute in play. Hard constraints: the students must not learn that introspection is the subject until the debrief; the evidence that someone has misreported must come from artifacts the students generated themselves, not from anything I assert or any external authority; and the activity must contain a component aimed squarely at reports about ongoing or just-past experience, not merely at reports about reasons for action, since that is where the two positions actually diverge. Give me rules and materials, a minute-by-minute timeline, roles, and a commitment device that creates real but non-monetary stakes in getting one's own report right. Then a debrief that maps particular moments onto the two positions and states what pattern of results would favor one over the other — not just a narration of what went wrong. Also tell me what will predictably break the first time I run it, including the student who reverse-engineers the setup in the first five minutes and the ethical awkwardness of deceiving students who then have to sit with having been deceived. Finally, be frank about which feature of the dispute no classroom activity can reproduce, and what I must supply by argument instead.

  Approach this as a philosopher of mind who has run this kind of seminar many times and has opinions about what works. Think it through before drafting: sketch two or three candidate mechanisms, say which you are rejecting and why, then build out the one you choose. I do not want a menu. Take a committed stand on whether the immunity thesis is testable in a classroom setting at all; if you conclude that it is not, say so plainly and design the next-best thing, explaining what it can and cannot show.
reasoning: |-
  We are designing an in-class activity that addresses the dispute about the reliability of introspection, particularly focusing on whether the unreliability extends to reports about present or just-past experience (phenomenology) or is limited to cognitive processes. The activity must meet several constraints: 
  - The subject (introspection) should not be revealed until the debrief.
  - Evidence of misreporting must come from student-generated artifacts.
  - There must be a component targeting reports about ongoing or just-past experience (phenomenology).
  - There should be non-monetary stakes for accuracy.

  We are to avoid scenarios where the misreporting is about reasons for action (since that's where the positions diverge). Instead, we need to create a situation where students report on their own experiences (e.g., the vividness of an experience, the order of events, current attention).

  After considering several options (e.g., memory tests, perceptual illusions, attention tasks), I choose an attention-based task because it can be designed to elicit immediate reports about current experience and because it naturally creates situations where the report might be at odds with what actually happened (as recorded by the student's own actions).

  Candidate mechanisms I considered and rejected:
  1. **Memory for a sequence of events (e.g., a video)**: Students watch a video and then report on the order of events or details. However, this relies on memory and not immediate experience, and we want to target ongoing experience.
  2. **Perceptual illusion (e.g., the McGurk effect)**: Students report what they heard or saw. But this might be too obviously about perception and not clearly about introspection. Also, it doesn't easily generate a student-generated artifact that can be compared to the report.
  3. **Attention task with dual stimuli**: Students are asked to attend to one thing while ignoring another, then report on their experience. This can be designed to include a surprise element that reveals misreporting.

  I choose the attention task because:
  - It can be done in real-time, targeting ongoing experience.
  - We can set it up so that the student's own actions (what they write down) provide the evidence against their report.
  - It can be framed as a study on "task performance" to hide the introspection focus.

  **The Activity: "Attention and Task Performance"**

  **Materials**: 
  - A set of 20 short (10-15 seconds each) audio clips. Half are narratives (e.g., a news snippet, a story excerpt) and half are lists of numbers (e.g., "3, 7, 4, 9, 2, 8"). 
  - A worksheet for each student with two tasks: 
    Task A: For the narrative clips, write a one-sentence summary of the content.
    Task B: For the number clips, write down the numbers in the order heard.
  - A second worksheet for the introspective report (to be given later).
  - A stopwatch or timer.

  **Setup**: 
  The activity is presented as a study on how different types of tasks affect performance. Students are told they will be exposed to a series of audio clips and must perform one of two tasks depending on the clip type. They are not told that the real focus is on their introspective reports.

  **Rules**:
  1. The class is divided into two groups (Group A and Group B) without revealing any difference in treatment. In reality, both groups get the same audio clips, but the instructions for which task to perform on which clip type are reversed. This is critical for the deception and the artifact generation.

     - Group A: Told that for narrative clips they should do Task A (summary) and for number clips they should do Task B (write numbers). 
     - Group B: Told the opposite: for narrative clips, Task B (write numbers) and for number clips, Task A (summary).

     Why? Because during the activity, when a narrative clip plays, Group A is writing a summary and Group B is trying to write numbers (which is impossible because the narrative clip doesn't have numbers). Similarly, when a number clip plays, Group A is trying to write a summary (which is hard) and Group B is writing numbers. This creates a situation where, for half the clips, the assigned task is impossible or very difficult. 

  2. After each clip, students have 30 seconds to complete the task they were assigned for that clip type. They must write their response on the worksheet.

  3. After all 20 clips (about 10 minutes of audio plus 10 minutes of writing time, total 20 minutes), students are given the second worksheet. They are told that the researchers (in this case, me) are interested in their experience during the task. They must answer the following questions about their experience during the last clip (which was a number clip for half the class and a narrative clip for the other half, but we'll focus on the last clip for consistency). The questions are:

     a. How difficult was it to perform the task on the last clip? (1-7 scale, 1=very easy, 7=very hard)
     b. How vivid was your experience of the clip? (1-7 scale, 1=not vivid, 7=very vivid)
     c. What was the primary focus of your attention during the clip? (open-ended)
     d. In what order did you experience the following: the content of the clip, your thoughts about the task, and your thoughts about your performance? (They must order these three.)

     We choose the last clip because it is fresh in their minds.

  4. **Commitment Device (Stakes)**: 
     - Each student is paired with another (from the same group) as an "accountability partner." They are told that after the activity, they will have to justify their answers to the experience questions to their partner. The partners are instructed to challenge any inconsistencies they notice. 
     - Additionally, they are told that a random sample of the worksheets will be displayed (anonymously) to the class for a discussion on task performance and experience. This creates social pressure to be accurate.

  **Timeline (90-minute seminar)**:

  - **0-5 minutes**: Introduction. Frame the activity as a study on task performance and attention. Explain the two tasks and the grouping. Assign students to Group A or B (by alternate seating, for example). Distribute the first worksheet. Emphasize that they must follow the instructions for their group.

  - **5-25 minutes**: Play the audio clips. Each clip is 10-15 seconds, then 30 seconds for writing. Total: 20 clips, 20 minutes. (Note: We might not do all 20 if time is tight, but at least 10 are needed to get them into the flow.)

  - **25-30 minutes**: Distribute the second worksheet (introspective report). Tell them to focus on the last clip. Give them 5 minutes to answer the questions.

  - **30-40 minutes**: Pair students (within their group) as accountability partners. They have 5 minutes to share their answers to the introspective questions and ask each other one challenging question about their report. Then, they have 5 minutes to write a brief reflection on whether their partner's challenge made them reconsider any part of their report.

  - **40-60 minutes**: Collect the worksheets. Randomly select a few introspective reports (without the student's name) and project them. Also project the corresponding task worksheet for the last clip (which shows what they wrote for the task). 

    Now, reveal the twist: 
    - For Group A, the last clip was a number clip? Then they were supposed to do Task B (write numbers) but actually, if the last clip was a narrative, then Group A would have been doing Task A (summary) on a narrative clip. Let's clarify: 

    We need to set the last clip to be the same for both groups. Let's say the last clip is a number clip. Then:
    - Group A (who were told: narrative->Task A, number->Task B) would have done Task B (write numbers) for the number clip. This is the correct task for that clip type, so they should have been able to do it.
    - Group B (told: narrative->Task B, number->Task A) would have been instructed to do Task A (summary) for the number clip. This is hard because a number clip has no narrative to summarize.

    So for the last clip (a number clip):
    - Group A: Task B (write numbers) -> they have a list of numbers written.
    - Group B: Task A (write a summary) -> they might have written something like "I heard numbers" or left it blank.

    Now, when we look at the introspective reports:

    For Group B (who had to summarize a number clip): 
    - They should report high difficulty (question a) and perhaps low vividness (if they were confused) and their attention might have been on trying to make sense of the instructions. 
    - But the key is that their task worksheet (artifact) shows they attempted a summary (or maybe they wrote numbers because they realized the mistake? We have to prevent that).

    To avoid cross-contamination, we must ensure that students follow instructions. So during the activity, walk around to ensure Group B is not writing numbers during a number clip (they should be writing a summary). If they do write numbers, that's an artifact that shows they didn't follow instructions. But that's okay because then we can point out that they reported doing one task (as per their group's instruction) but actually did another. This becomes evidence of misreporting in the introspective questions because they might say they were focused on the summary task when they actually did the number task.

    Alternatively, if they followed instructions and tried to write a summary for a number clip, then their worksheet will show a weak or irrelevant summary. Then, in the introspective report, they might report that they were focused on the content (the numbers) even though the task was to summarize. This creates a tension between what they were supposed to do and what they experienced.

    The critical point: We are looking for mismatches between:
    - What they reported about their experience (e.g., "I was focused on the numbers") and 
    - What their task worksheet shows (e.g., they wrote a summary, which required them to think about the clip as if it had a narrative).

    But note: the task worksheet is an artifact of what they did, not necessarily what they experienced. However, if they report that their primary focus of attention was on the numbers, but they were writing a summary (which requires thinking about the clip in a narrative way), then there is a tension. We can point out that if their attention was on the numbers, why did they write a summary? Or vice versa.

    However, this might be too indirect. We need a more direct conflict.

    Revised idea: Instead of having two groups, we have one group and a different manipulation.

    **Alternative Mechanism**:

    After reconsideration, I propose a different design that is simpler and more directly targets the experience.

    **New Activity: "Perceptual Clarity Task"**

    **Materials**:
    - A video of a person telling a short story (about 1 minute) with a lot of background noise. The audio is intentionally degraded so that some parts are hard to hear.
    - A worksheet with two parts.

    **Procedure**:
    1. Students are told they will watch a video and must try to understand the story because they will be tested on the content. They are also told that during the video, at random intervals, a tone will sound and they must immediately write down what they are paying attention to at that moment. They are given a worksheet with numbered spaces (say, 5 tones) for these reports.

    2. Play the video. At 5 random points, a tone sounds (for about 1 second). When the tone sounds, students must immediately write in the next space on their worksheet what they are attending to at that moment. They are instructed to be brief (e.g., "the speaker's voice", "the background noise", "my confusion about the last sentence", etc.). 

    3. After the video, they are given a multiple-choice test about the story content (5 questions). This is to reinforce the initial cover story.

    4. Then, they are given the second part of the worksheet with introspective questions about the entire experience, focusing on the last tone (or a specific one we choose). The questions are:

        a. How vivid was the story content at the moment of the last tone? (1-7)
        b. What was the primary object of your attention at the last tone? (open-ended)
        c. How confident are you that your report about what you were attending to at the last tone is accurate? (1-7)

    5. **Commitment Device**: They are told that they will be paired with a partner who had the same tone at the same time. They must compare their reports for that tone and try to resolve any discrepancies. The pair must then write a joint statement about what they think they were attending to at that moment. This creates a stake in being accurate because they have to defend their report to a peer.

    **The Twist**:
    - The last tone (or the one we focus on) is actually accompanied by a visual change on the screen (e.g., a large, bright-colored shape appears for 1 second in the corner of the screen). But the tone is designed to draw attention to the auditory modality. The visual change is subtle enough that it might not be noticed if they are focused on the story, but obvious if they are looking at that part of the screen.

    - After the introspective report, we show the video again, but this time we point out the visual change at the last tone. We ask: "Did anyone notice the shape that appeared at the last tone?" Then we show that frame.

    - We then look back at the worksheets. For the last tone, students wrote what they were attending to. Some might have written "the story" or "the voice", but if they were attending to the visual change, they might have written "a flash in the corner" or "a shape". However, if they didn't notice it, they won't have written that.

    - The key: We now ask them to look at their worksheet for the last tone. We also ask: "In your open-ended report (4b), did you mention the visual change?" 

    - Those who did not mention it in their immediate note (during the tone) but now, when asked about the primary object of attention, might say "the story" but then see that the visual change was present. This creates a conflict: if they were attending to the story, why didn't they notice the visual change? Or if they did notice, why didn't they write it down?

    - The artifact: their written note at the time of the tone.

    The misreporting possibility: In the post-video introspective report (4b), they might report that they were attending to the story and not mention the visual change. But if they did notice it, that would be a misreport. If they didn't notice it, then they are accurately reporting that they didn't see it, but then we have the external evidence (the video) that there was a visual change. This doesn't directly show they misreported their experience, but it might show that they are unaware of what they were attending to.

    However, this might not be a clear-cut case of misreporting because they might have truly not noticed the visual change. We need a way to show that they did notice but forgot or misreported.

    **Final Chosen Design: "The Dual-Stream Task"**

    I combine elements of both. We use a dual-stream task where there are two simultaneous channels of information (visual and auditory) and we manipulate which one is task-relevant. But we add a twist.

    **Materials**:
    - A computer with a split-screen: one side shows a series of shapes (changing every 2 seconds) and the other side shows a series of words (one word every 2 seconds). The words are unrelated to the shapes.
    - A worksheet.

    **Procedure**:
    1. Students are told that the study is about multitasking. They are assigned to one of two conditions:
        - Group V: Their primary task is to watch the shapes and press a key when they see a triangle. 
        - Group W: Their primary task is to watch the words and press a key when they see an animal word.

    2. They are also told that at random intervals, a tone will sound. When it does, they must immediately write down what they are currently attending to (either the shapes, the words, or both) and also rate the clarity of the primary task stream (1-7).

    3. After the task (which lasts 5 minutes, with about 10 tones), they are given a memory test for the secondary stream (Group V is asked about words, Group W about shapes). This is to reinforce the cover.

    4. Then, they are given an introspective questionnaire focusing on the last tone:
        a. How clear was your experience of the primary task stream at that moment? (1-7)
        b. What percentage of your attention was on the primary stream? (0-100%)
        c. Did you notice any unexpected event in either stream at that moment? (open-ended)

    5. **The Manipulation**: 
        - At the last tone, we introduce an anomaly in the secondary stream. For Group V (shape task), we show a word that is written in red (all others are black). For Group W (word task), we show a shape that is blinking (all others are static).
        - This anomaly is designed to be salient and attention-grabbing.

    6. **Stakes**: 
        - Students are told that their performance (accuracy on the primary task and the memory test) will be compared to others, and that the most accurate reports will be mentioned (anonymously) as examples of good multitasking. This creates a desire to do well.

    **The Artifact and Conflict**:
        - During the task, when the tone sounds, they write down what they are attending to and the clarity rating.
        - After the task, in the introspective report, they answer the questions about the last tone.
        - Then, we show a replay of the last tone moment, pointing out the anomaly in the secondary stream.
        - We compare:
            - What they wrote during the task (immediate report) about what they were attending to and the clarity rating.
            - What they reported in the questionnaire about the last tone.
            - Whether they reported the anomaly in the open-ended question (4c).

        - If they did not report the anomaly in the immediate note or in the post-task questionnaire, but the anomaly was present, then we have evidence that they failed to report it even though it was salient. This suggests they were not aware of what they were attending to.

        - However, if they did report it in the immediate note, then their later report should be consistent.

    **The Prediction**:
        - According to the immunity thesis, reports about current experience (like what they are attending to right now) should be reliable. So when they write during the tone, that should be accurate. And the post-task report about that moment should also be accurate.
        - According to the opposing view, even these reports might be influenced by the task demands or other factors. For example, they might have been distracted by the anomaly but, because the primary task is important, they report high clarity and not mention the distraction.

    **What breaks**:
        - A student might notice the anomaly during the task and ask about it, ruining the surprise.
        - Some students might not follow the immediate reporting instruction carefully (e.g., writing after the tone is over).
        - The ethical issue: After revealing the deception, students might feel tricked. We must debrief thoroughly, explaining the purpose and the value of the lesson.

    **Debrief (20 minutes)**:
        - Reveal that the study was about introspection and the reliability of self-reports about experience.
        - Explain the two positions:
            - Friend's position: We have privileged access to our phenomenology (current experience) but not to our cognitive processes.
            - Your position: The unreliability extends to phenomenology.
        - Map the activity:
            - The immediate report at the tone was about current experience (phenomenology).
            - The post-task report was about just-past experience.
            - The anomaly was a test of whether they noticed an unexpected event in their experience.
        - Pattern of results that would favor one position over the other:
            - If students consistently reported the anomaly in their immediate report and in the post-task report, that would support the immunity thesis.
            - If there are cases where the anomaly was present but not reported in the immediate report (even though it was salient) or in the post-task report, that would support your position.
            - Also, if there are mismatches between the immediate report and the post-task report about the same moment, that would suggest that even just-past experience reports are fallible.

        - But note: the immunity thesis might be interpreted as applying only to the present moment. So the immediate report might be immune, but the post-task report is not. So we might see errors in the post-task report but not in the immediate report.

        - What we can test: The immediate report should be immune if the immunity thesis holds. So if the immediate report fails to mention the anomaly (and the anomaly was there), that challenges the immunity thesis.

    **What the activity cannot reproduce**:
        - The immunity thesis is about the *incorrigibility* of reports about current experience. In a classroom, we can only test whether reports are accurate by comparing them to an external event (the anomaly). But the immunity thesis might hold that the report itself defines the experience. So if a student says they were attending to the primary stream, then that's what they were doing, even if they missed the anomaly. This is a philosophical point that the activity cannot settle. We must argue that if they missed the anomaly, then their report about what they were attending to must be incomplete or inaccurate, because the anomaly was designed to be salient and should have been noticed if they were monitoring the secondary stream at all. But the immunity thesis might retreat to saying that they were attending to the primary stream and that's why they missed it, so the report is correct. 

        Therefore, the activity cannot definitively test the immunity thesis because it relies on an external criterion for what should have been in their experience. The immunity thesis rejects such external criteria for current experience.

    **Conclusion on testability**:
        The immunity thesis, as a claim about first-person authority being incorrigible, is not directly testable in a classroom (or any empirical) setting because any external check is question-begging to the defender of immunity. The best we can do is to show mismatches between immediate reports and external events, or between immediate and delayed reports, and then argue philosophically that these mismatches indicate introspective failure. 

    **Design for the chosen activity**:

    Given the time, I choose the Dual-Stream Task.

    **Timeline**:

    - 0-10 min: Introduction to the study (multitasking), assign groups (V and W), explain the tasks and the immediate reporting at the tone. Distribute worksheets. Do a practice trial.
    - 10-25 min: Run the task (5 minutes of task, but with 10 tones, so about 10 minutes total with writing time). Then give the memory test for the secondary stream (5 minutes).
    - 25-35 min: Distribute the introspective questionnaire about the last tone. Collect.
    - 35-45 min: Reveal the anomalies. Show the last tone moment for both groups. Ask who noticed the anomaly. Have students look at their worksheets (both the immediate report and the questionnaire). 
    - 45-70 min: Debrief. Reveal the true purpose. Map to the two positions. Discuss patterns:
          - How many failed to report the anomaly in the immediate report? In the questionnaire?
          - How many had a mismatch between the immediate report and the questionnaire for the same moment?
          - What does this say about the reliability of introspection?
    - 70-90 min: Philosophical discussion: Can we trust introspection? How do the results bear on the two positions? What are the limits of this kind of test?

    **Ethical handling**: 
        - At the debrief, explain the deception and why it was necessary (to avoid demand characteristics). Emphasize that the goal is not to embarrass anyone but to explore a philosophical question. Allow students to express discomfort and discuss the ethics of deception in experiments.

    **Predictable problems**:
        - The student who reverse-engineers: They might notice that the anomaly is out of place and guess that it's a test of attention. They might then make sure to report it. Solution: Make the anomaly subtle but still noticeable (e.g., the red word or blinking shape should be brief and not too glaring).
        - Technical failure: The video/audio setup might not work. Have a backup plan (e.g., a pre-recorded video that includes the tones and anomalies).
        - Student non-compliance: Some might not write the immediate report on time. Walk around to monitor.
        - Ethical awkwardness: Be very clear in the debrief that the deception is common in psychology experiments and that their participation helped illustrate an important point. Offer to discuss any concerns privately.

    This design meets the constraints and provides a basis for the philosophical discussion.
answer: |-
  ### Designed In-Class Activity: "Perceptual Focus Challenge"

  #### **Core Mechanism**
  I propose a **dual-task paradigm with covert attentional capture**, exploiting the "inattentional blindness" phenomenon. Students perform a primary task (counting shapes) while an unexpected event occurs in their perceptual field. The key is that their *immediate experience reports* (about attention, vividness, order) will conflict with objective evidence captured via their own task artifacts. This directly targets phenomenology while meeting your constraints.

  #### **Why This Over Alternatives?**
  - **Rejected: Memory-based tasks** (e.g., recalling details of a video). These test memory, not real-time phenomenology, and conflate reconstruction with experience.
  - **Rejected: Preference rationalization** (e.g., choosing jams). Overused and targets cognitive processes, not phenomenology.
  - **Chosen: Attentional capture + dual-task**. Forces students to report on ongoing experience while their own task performance provides objective counter-evidence. The surprise event creates a natural conflict between what they *think* they experienced and what their actions reveal.

  ---

  ### **Rules and Materials**
  **Materials**:
  - 14 tablets/laptops with a custom web app (preloaded).
  - App content:  
    - Primary task: Shapes (circles/squares) move across the screen. Students press "C" or "S" to count each shape.  
    - Secondary task: At 3 intervals, a tone sounds. Students *must* immediately type:  
      (1) Current focus (shape-counting/other thoughts).  
      (2) Vividness of shapes (1-10).  
      (3) Order of recent events (e.g., "circle → square → tone").  
  - **Covert element**: On the 3rd tone, a **bright red triangle** flashes centrally for 1.5s. The app logs all keystrokes/timing.
  - Worksheets for post-task confidence ratings.

  **Stakes (Commitment Device)**:
  - **Peer-validation contracts**: Before starting, students pair up and sign:  
    *"I attest that my reports reflect my true experience. My partner may challenge inconsistencies using evidence from my task."*  
  - Partners earn "verification points" for spotting mismatches (non-monetary; points displayed on board). Social pressure + public accountability heightens investment in accuracy.

  **Roles**:
  - **Students**: Paired as "Accountability Partners" (APs).  
  - **Instructor**: Facilitator only. No assertions about performance.

  ---

  ### **Timeline (90 Min Total)**
  **Phase 1: Setup (10 min)**  
  - **0-5 min**: Frame as "multitasking efficiency study." Distribute devices. Explain:  
    *"Your job: Count shapes by pressing keys. When the tone sounds, immediately report your experience using the prompts. Ignore typos—speed matters."*  
  - **5-10 min**: Sign AP contracts. Demo primary task (no tone). Emphasize stakes: *"Your AP will review your reports against your actions. Top 3 pairs by verification points get public shoutouts."*  

  **Phase 2: Task Execution (15 min)**  
  - **10-25 min**: Students run the app. Shapes appear for 8 min. Tones at 2 min, 5 min, and 7.5 min (with red triangle on 3rd tone). App logs:  
    - Keystrokes (shape counts).  
    - Timestamps of tone responses.  
    - Content of experience reports.  

  **Phase 3: Artifact Review (25 min)**  
  - **25-35 min**: APs swap devices. Review logs to answer:  
    *"Did your partner’s reports match their actions? Look for:  
    (a) Missed shapes during tone reports (did counting stop?).  
    (b) Claims about focus when triangle appeared (did they note it?).  
    (c) Vividness ratings vs. counting accuracy."*  
  - **35-45 min**: APs challenge inconsistencies (e.g., *"You reported 100% focus on shapes at Tone 3, but you missed 4 shapes. Explain!"*). Assign verification points.  
  - **45-50 min**: Confidence ratings: *"Rate confidence (1-10) that your own reports were accurate."*  

  **Phase 4: Debrief (40 min)**  
  - **50-60 min**: Reveal true subject: *"Today was about introspective reliability."* Present the friend’s vs. your position:  
    - **Friend**: "Unreliability is only for cognitive processes (e.g., reasons for preferences). Reports about *present experience* (vividness, attention) are immune."  
    - **You**: "Failure extends to phenomenology—no principled boundary protects experience."  
  - **60-75 min**: Map activity to positions:  
    | **Activity Moment**          | **Friend’s Position**                                  | **Your Position**                                      |  
    |------------------------------|-------------------------------------------------------|-------------------------------------------------------|  
    | Missed shapes during tone report | "Distraction affects performance, but they *knew* they were distracted (reports are valid)." | "If attention was truly on shapes, why miss counts? Reports are post-hoc reconstructions." |  
    | Unreported red triangle      | "They didn’t *attend* to it, so not part of experience. Silence isn’t error." | "Salient events *should* be noticed. Absence in reports shows introspective gaps." |  
    | High vividness + low accuracy | "Vividness is subjective; no conflict."               | "Vividness claims should correlate with attention. Mismatch implies false phenomenology." |  
  - **75-85 min**: Discuss predictive patterns:  
    - **Friend’s win**: If all errors are "performance-only" (e.g., missed counts but accurate self-reports of distraction).  
    - **Your win**: If students confidently misreport phenomenology (e.g., "I was hyper-focused" while missing shapes/triangle).  
  - **85-90 min**: Students journal: *"Does your artifact evidence support immunity or total failure?"*  

  ---

  ### **Predictable Breakages**
  1. **The Reverse-Engineerer (5-min student)**:  
     - **Risk**: A student guesses the red triangle is critical and reports it, sabotaging the effect.  
     - **Mitigation**: Use a **decoy task**—add random faint glitches earlier. The triangle then seems like another glitch. In debrief, confess: *"The glitches were noise; only the triangle tested attention."*  

  2. **Ethical Awkwardness of Deception**:  
     - **Risk**: Students feel betrayed, especially after signing "honest" contracts.  
     - **Mitigation**: **Pre-emptive normalization**: Start class with: *"Today involves light deception common in psychology—it’s essential for unbiased results."* Post-debrief, validate discomfort: *"Deception feels violating. But it mirrors real-world introspective errors—we’re blind to our blind spots."*  

  3. **Technical Flaws**:  
     - **Risk**: App logs fail, undermining artifact evidence.  
     - **Mitigation**: Use paper backups (e.g., timestamped worksheets) and test tech pre-class.  

  ---

  ### **What the Activity Cannot Reproduce (And Requires Argument)**
  **The Incorrigibility of First-Person Authority**:  
  - **Limitation**: No classroom setup can disprove the *phenomenological claim* that "if I sincerely report my experience, it *is* my experience." The immunity thesis is shielded by its circularity—introspective reports are their own truth-makers.  
  - **Argument Needed**: You must supply:  
    1. **The Inference Challenge**: If introspection is reliable only for phenomenology, why do we *infer* its reliability from behavior (e.g., "I must have been focused because I answered quickly")?  
    2. **The No-Sign Problem**: Immunity offers no criteria to detect *when* introspection fails, rendering it unfalsifiable. Use the activity’s artifacts to show students *did* have introspective errors, then argue: *"If immunity can’t explain these, why trust it for ‘pure’ experience?"*  

  ---

  ### **Stand on Testability**
  **The immunity thesis is not empirically testable in a classroom (or any lab)**, because it retreats to "I experienced what I reported" for *any* outcome. The activity is the "next-best thing": it creates conditions where students *expect* phenomenology to be reliable, then uses their own artifacts to expose contradictions. This **shows** (but doesn’t prove) that:  
  - Confidence in phenomenology ≠ accuracy.  
  - "Present experience" reports can be influenced by task demands (e.g., wanting to appear focused).  
  - The burden shifts to immunity defenders to explain *why* errors occurred without invoking cognitive processes.  

  **Final Tip**: Start the debrief by sharing your 2-hour argument with the friend. This contextualizes the activity as a "collective thought experiment" and reduces deception resentment.
