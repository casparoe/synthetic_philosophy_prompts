prompt: |-
  I am assembling a graduate seminar on explanation in modern history, and one argumentative configuration has repeatedly surfaced in our discussions for which I cannot find an established designation. I should be grateful for help locating it in the literature, or, if it genuinely lacks a name, for carving it out with enough precision that I can teach students to recognise it.

  The configuration arises in debates over substitution counterfactuals — the family of questions of the form "would there have been a Nazi Germany without Hitler?" One party maintains that the outcome was structurally overdetermined: the economic collapse, the terms of the peace settlement, the willingness of conservative elites to hand over power, the erosion of constitutional constraints. Pressed to show what that claim amounts to, they offer a substitution: remove the individual and the position is occupied by someone else — a different occupant, a regime of the same kind. The other party then asks what "the position" is and what fixes its boundaries. This is where the difficulty lies. The description of the office to be filled appears to be drawn from the outcome it is invoked to explain. The structuralist characterises the post functionally — what the movement required was a leader able to hold its rival factions together, convert economic distress into nationalist grievance, and be tolerable to the conservatives as a junior partner — and each of these specifications turns out, on inspection, to be recoverable from a close study of the man who actually held the post. When this is pointed out, the structuralist tends to retreat to a disjunctive consequent ("an authoritarian nationalist regime of some kind"), which then begins to look unfalsifiable; when they decline to retreat, they owe a functional description fixed in advance of the appointment together with a prediction about the class of persons who could have satisfied it, which they rarely supply.

  The same pattern recurs in the debate about whether the Soviet terror of the 1930s required Stalin. The structural case rests on one-party rule, a security apparatus already built under Lenin, and the exigencies of forced industrialisation, and it is cashed out as the claim that any successor would have presided over something of the same character. But the specification of what the succession required — a general secretary positioned to staff the apparatus with clients, say — is a description that only picks out its referent once one knows how the succession actually went.

  I want to stress that the defect may be symmetrical. The great-man theorist also fixes the granularity of the outcome, insisting that what needs explaining is not a regime of a type but this regime with these particular crimes and these particular dates, and at that level of specificity almost any individual becomes indispensable. In both cases it looks as though the relata of the counterfactual are individuated by whichever side of the debate the speaker occupies.

  Candidates for the nearest established vocabulary occur to me, and each seems adjacent without being on target. The standard objections to functional explanation concern the direction of benefit and the mechanism by which an effect feeds back to sustain its cause; here the worry is not feedback but the individuation of a role. The methodological constraints that practitioners of counterfactual history impose — that the antecedent be a small, plausible alteration of the actual past, and that the imagined sequel be theory-guided rather than invented — govern the antecedent and the machinery of the scenario, whereas my difficulty concerns the description of the consequent and of the position the antecedent vacates. Hindsight bias and the narrative fallacy describe an epistemic tendency in the reasoner, not a structural feature of the argument as such. Survivorship reasoning and the image of a marksman painting a target around the bullet holes are close in spirit, but they concern selection over cases rather than the boundaries of a description within a single case. And the older dismissal of "might-have-beens" as a parlour game, associated with E. H. Carr, simply refuses to engage with substitution counterfactuals rather than diagnosing what goes wrong inside them.

  So: what is the nearest established concept or body of work here, and precisely how does the configuration I have described differ from it? If it is unnamed, propose a term and a definition, and state the boundary conditions, since that is where my interest lies. In particular, tell me whether the defect is present, absent, or attenuated in each of the following variants: (i) the functional description is documented from material predating the appointment — a party programme, contemporaneous speculation in the press about what the post demands; (ii) the structuralist explicitly commits in advance to a class of outcomes rather than to the outcome, and states the class's membership conditions; (iii) the substitution is run the other way, on a case in which structural conditions persisted across a leadership change but the regime's character altered markedly; (iv) the office is highly institutionalised, with formally defined and legally constrained powers, as against a movement in which authority is personal to its holder.

  Finally, I should like to know whether the same thing arises outside historiography — in functionalist explanations of institutions, in reasoning about key-person risk within organisations, in the treatment of simultaneous independent discovery in the sociology of science, where the fact that several people arrived at the same result is often taken to show that any one of them was dispensable. If it does arise there, that would tell me whether I have identified a local vice of counterfactual history or a general one attaching to role-and-occupant reasoning.

  Please do not content yourself with a label. What I need is the phenomenon stated exactly enough that I could hand it to a student along with an unfamiliar argument and have them determine reliably whether the argument exhibits it — together with an account of what it is not.
reasoning: |-
  Okay, the user is assembling a graduate seminar on explanation in modern history and has encountered a recurring argumentative pattern in discussions about substitution counterfactuals. They want to identify or define this logical problem precisely. 

  The core issue centers on how structuralists define the "position" in historical counterfactuals (e.g., "Would Nazism exist without Hitler?"). The user observes that structuralists often describe the role functionally based on the actual occupant's traits, creating circularity. When challenged, they either retreat to vague outcomes or fail to provide pre-appointment criteria for the role. The user notes this flaw might also apply to great-man theorists who insist on hyper-specific outcomes. 

  Existing concepts (functional explanation flaws, counterfactual constraints, hindsight bias) don't quite fit—they address different aspects like causal mechanisms or epistemic biases, not role individuation. The "Texas sharpshooter fallacy" comes closest but typically involves cherry-picking data across cases, not redefining descriptors within a single scenario. 

  I need to define this as a distinct fallacy: the **retrospective role specification fallacy**. Key elements: (1) defining a role/office by functions inferred from the actual occupant's actions; (2) using that definition to claim the outcome was overdetermined; (3) lacking independent criteria for the role. 

  Boundaries matter: it's not about functional explanations generally (which may have valid feedback mechanisms) but specifically the circular role definition. The user's variants clarify: 
  - (i) If pre-appointment evidence exists (e.g., job descriptions), the fallacy weakens. 
  - (ii) Committing to outcome classes upfront avoids it. 
  - (iii) Reversed cases (e.g., leadership change altering outcomes) expose structuralist assumptions. 
  - (iv) Institutionalized roles resist the fallacy; personalized roles exacerbate it. 

  This pattern extends beyond history—e.g., corporate key-person risk assessments ("any CFO could've done it") or sociology of science (simultaneous discoveries implying individual dispensability). The circular role definition is the common thread. 

  For teaching, I'll provide a diagnostic checklist: 
  - Spot when a "position" is invoked in counterfactuals. 
  - Check if its functions derive from the actual occupant's actions. 
  - See if challengers force vagueness or expose missing independent criteria. 
  - Note symmetrical risks in great-man theories. 

  The user's deep need is pedagogical precision—they want students to recognize this logical structure reliably, not just label it. Highlighting cross-disciplinary examples will show it's not unique to historiography but a general pitfall in role-occupant reasoning.
answer: |-
  This is a penetrating analysis of a genuine methodological dilemma in historical counterfactuals. The phenomenon you describe lacks a universally established name, but it intersects with several philosophical and historiographical debates. I propose the term **"retrospective role specification fallacy"** (RRSF) to capture its core logic. Below is a conceptual dissection, differentiation from adjacent concepts, analysis of your variants, and cross-disciplinary parallels.

  ---

  ### **Core Definition: Retrospective Role Specification Fallacy (RRSF)**
  **Definition:** The error of defining a *role* (e.g., "leader," "office," "position") in a substitution counterfactual using functional criteria *derived from the actual occupant's actions*, thereby circularly ensuring that the role appears structurally necessary to produce the outcome. This conflates the *description* of the role with its *causal capacity*, rendering the counterfactual unfalsifiable or question-begging.

  **Boundary Conditions:**
  1. **Role Individuation Problem:** The role’s boundaries (e.g., "what a Nazi leader must do") are fixed *ex post facto* by the occupant’s conduct, not by independent criteria.
  2. **Functional Slippage:** The role’s "requirements" expand/shrink to match the occupant’s traits (e.g., Hitler’s oratory → "ability to mobilize masses").
  3. **Consequent Vagueness:** When pressed, defenders retreat to disjunctive outcomes ("some authoritarian regime"), sacrificing explanatory precision.
  4. **Symmetry with Great-Man Theory:** Hyper-specific outcomes ("Stalin’s *exact* terror") make individuals indispensable by definition.

  **Diagnostic Checklist for Students:**  
  An argument exhibits RRSF if:  
  ☑️ It claims outcome *O* was structurally inevitable via substitution (remove individual *I*, role *R* is filled by someone else).  
  ☑️ The definition of *R* ("what the role requires") relies on traits/actions unique to *I* or the specific *O*.  
  ☑️ No evidence is given that *R* was defined *before* *I*’s tenure or independently of *O*.  
  ☑️ Challenging *R*’s definition triggers vagueness about *O* or ad hoc adjustments to *R*.

  ---

  ### **Differentiation from Adjacent Concepts**
  | Concept                 | Why It’s Adjacent but Distinct                                  |
  |-------------------------|----------------------------------------------------------------|
  | **Functional Explanation** | Focuses on feedback loops (e.g., "institutions serve a purpose"); RRSF concerns *role individuation*, not function. |
  | **Hindsight Bias**      | Describes cognitive error; RRSF is a *logical structure* in arguments, even with full awareness. |
  | **Texas Sharpshooter**  | Involves cherry-picking data *across cases*; RRSF redefines descriptors *within a single case*. |
  | **Carr’s "Parlour Game"**| Rejects all counterfactuals; RRSF diagnoses flaws *within* substitution arguments. |

  ---

  ### **Analysis of Your Variants**
  **(i) Functional description documented pre-appointment**  
  → **RRSF attenuated/absent.** If party manifestos or contemporary press define the role *before* the occupant’s actions (e.g., "Chancellor must amend Versailles"), the role is independently specified. *Caveat*: Such documents may still reflect idealized visions, not operational constraints.

  **(ii) Structuralist commits to outcome class in advance**  
  → **RRSF absent.** Defining "authoritarian nationalist regime" with clear membership conditions (e.g., single-party rule, suppression of dissent) *before* testing the counterfactual avoids circularity. The key is *prior* stipulation.

  **(iii) Substitution run with altered outcomes**  
  → **RRSF exposed.** Example: Post-Mao China saw structural continuity (one-party state, bureaucracy) but policy shifts. If structuralists insist the role *must* produce identical outcomes, their functional definition is falsified. This tests role rigidity.

  **(iv) Highly institutionalized vs. personalized office**  
  → **RRSF attenuated for institutionalized roles.** Formally defined powers (e.g., U.S. President’s veto) constrain role descriptions. Personalized roles (e.g., revolutionary leaders) lack institutional boundaries, making RRSF likely.

  ---

  ### **Cross-Disciplinary Manifestations**
  1. **Organizational Theory (Key-Person Risk):**  
     Claim: "Any competent CFO could manage this."  
     RRSF Risk: Defining "competent CFO" by the current CFO’s successes (e.g., "navigated the 2020 crisis") without prior criteria for "competence." Outcome: Unfalsifiable indispensability.

  2. **Sociology of Science (Simultaneous Discovery):**  
     Claim: "Multiple discoverers prove the idea was ‘in the air’—anyone could have done it."  
     RRSF Risk: Defining the "necessary" discoverer role by traits of actual discoverers (e.g., "mathematical skill + access to lab"), ignoring unique intellectual pathways. Outcome: Underestimation of individual agency.

  3. **Functionalist Anthropology:**  
     Claim: "Ritual X serves social cohesion."  
     RRSF Risk: Defining the ritual’s "function" by observed outcomes (e.g., "reduced conflict post-performance"), not independent evidence of the role’s design.

  ---

  ### **Conclusion**
  You’ve identified a **general flaw in role-and-occupant reasoning**, not a historiographical quirk. RRSF arises wherever roles are defined *retrospectively* to fit outcomes, conflating description with causation. To teach recognition:  
  - Train students to ask: *"How was this role defined* before *the outcome? What evidence fixes its boundaries independently?"*  
  - Highlight symmetry: Hyper-specific outcomes make individuals indispensable; vague roles make structures unfalsifiable.  
  - Use variants (iii) and (iv) as litmus tests: If swapping occupants changes outcomes *or* institutional constraints exist, RRSF weakens.

  **Proposed Reading:**  
  - Mandelbaum’s critique of functionalism (*Purpose and Necessity in Social Theory*) for role circularity.  
  - Tetlock & Belkin’s *Counterfactual Thought Experiments in World Politics* on "minimal rewrite" standards.  
  - Weber’s *Economy and Society* on institutional vs. charismatic authority (variant iv).

  This framework should equip students to dissect substitution counterfactuals with precision.
