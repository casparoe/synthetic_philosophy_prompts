prompt: |-
  I am grading the short-answer section of a final exam in an undergraduate philosophy-of-science course whose last three weeks covered causal inference. The question below was worth 20 points. Please grade the student response against the question as asked: a score for each part, and then a point-by-point set of comments that justify those scores. For each substantive claim the student makes, tell me whether it is correct, partially correct, correct but incomplete, or wrong; where it is wrong, say what the correct treatment is, since I want to hand the comments back as feedback. If a full-credit answer would contain something the student never attempts, say what. I have no view to argue for here — I want the assessment to stand on its own.

  **Question as it appeared on the exam:**

  A district randomly assigned 800 ninth-graders, by lottery in the first week of the fall term, to a new after-school numeracy tutoring program (400 students) or to business as usual (400). The tutoring meets 5:00–7:00 p.m. on Tuesdays and Thursdays. The district also runs an optional evening study workshop, open to all students, which meets 6:00–8:00 p.m. on those same evenings; attendance at the workshop was recorded over the course of the term. At the end of the term all students took a proficiency exam.

  - Overall: tutoring 250/400 passed (62.5%); control 296/400 passed (74%).
  - Among students who attended the evening workshop: tutoring 74/80 (92.5%); control 216/240 (90%).
  - Among students who did not attend the workshop: tutoring 176/320 (55%); control 80/160 (50%).

  (a) [8 points] Describe the pattern in these figures and explain why the overall comparison and the workshop-specific comparisons point in opposite directions.
  (b) [8 points] Which figures should the district report as the effect of the tutoring program on pass rates? Justify your choice.
  (c) [4 points] What further information, if any, would you want before committing to that answer?

  **Student response:**

  The overall figures and the figures within each workshop group disagree about which arm did better. Control students have the higher overall pass rate, 74% against 62.5%, but tutored students do better among workshop attendees, 92.5% against 90%, and also among non-attendees, 55% against 50%. This is Simpson's paradox.

  It arises because the two arms are not distributed the same way across the workshop groups, and because pass rates differ sharply between those groups. In the control arm 240 of 400 students, 60%, attended the workshop, while in the tutoring arm only 80 of 400, 20%, did; workshop attendance goes with a much higher pass rate in both arms, roughly 90% against 50%. The control arm's overall rate is therefore pulled up by having most of its students in the high-passing group, and the tutoring arm's overall rate is pulled down by having most of its students in the low-passing group. The reversal is a weighting artifact rather than a sign that the data are inconsistent: given the four subgroup rates and the subgroup sizes, both overall rates follow by arithmetic.

  The district should report the workshop-specific figures. Workshop attendance is associated both with assignment, 60% against 20%, and with the outcome, and that is the standard test for a confounder; a confounder has to be conditioned on before an association between program and passing can be read causally. Randomization is supposed to balance factors of this kind between the arms, so its failure to do so here means the overall comparison is not the comparison randomization was designed to deliver, and adjusting for workshop attendance is what restores it. On the adjusted numbers the program raises pass rates by 2.5 points among workshop attendees and 5 points among non-attendees, so it is effective in every subgroup we can examine, and therefore effective for the population as a whole. Reporting 74% against 62.5% would mislead, since a marginal association of that kind need not reflect any causal relation, and the district should not publicize it.

  For (c), I would want to know how many students in each arm were assigned to tutoring but never attended, and whether pass rates were tracked separately for those students. I would also want the lottery records: a forty-point gap in workshop attendance between two randomly assigned arms is large enough that I would want to rule out a defect in the randomization itself.
reasoning: |-
  Okay, let's tackle this grading task step by step. The student's response needs to be evaluated against the exam question which has three parts: (a) describing the pattern and explaining the reversal, (b) deciding which figures to report with justification, and (c) identifying further needed information. 

  First, for part (a), the student correctly identifies Simpson's paradox and explains the weighting effect due to imbalanced workshop attendance. The explanation about control arm having higher workshop attendance (60% vs 20%) pulling up their overall pass rate is spot-on. The arithmetic point about subgroup rates determining overall rates is also correct. This seems like a full-credit answer for (a).

  Moving to part (b), the student argues for reporting workshop-specific figures, calling workshop attendance a confounder. This is where it gets tricky. The student correctly notes randomization should balance confounders but fails to recognize workshop attendance is post-treatment - it can't be a confounder in the standard sense because it occurs after assignment. The core mistake is treating this as a confounding problem rather than a mediation/collider issue. The better approach would be to report the overall ITT effect since randomization preserves its validity despite the imbalance. The student's subgroup effectiveness conclusion is statistically inappropriate here. For part (b), the justification is fundamentally flawed even if the conclusion might coincidentally align with district interests.

  For part (c), the student asks about non-compliance (good) and randomization integrity (also good), but misses the critical need to clarify workshop timing relative to tutoring. Since workshop overlaps with tutoring, attendance might be physically impossible for tutoring participants - which would completely change interpretation. This oversight is significant.

  The scores would be: (a) 8/8 for perfect explanation, (b) 2/8 for correct conclusion but fatally flawed reasoning, (c) 2/4 for partial relevant suggestions but missing the most crucial follow-up. Will structure comments to highlight where concepts went wrong (especially confounding vs post-treatment variables) and what a full-credit answer requires.
answer: |-
  Below is a detailed grading and feedback for the student response. Scores are based on the question's point allocation, with comments justifying each score and correcting misconceptions. Key concepts from causal inference (e.g., randomization, confounders, post-treatment variables, intent-to-treat) are central to the evaluation.

  ---

  ### **(a) Score: 8/8**  
  **Comments:**  
  - **Correct:** Identifies Simpson's paradox by name and accurately describes the reversal (control wins overall but tutoring wins in both subgroups).  
  - **Correct:** Explains the imbalance in workshop attendance (control: 60% vs. tutoring: 20%) and its impact: Control’s overall rate is elevated by having more high-passing (workshop-attending) students, while tutoring’s rate is depressed by having more low-passing (non-attending) students.  
  - **Correct:** Notes the sharp pass-rate difference between workshop attendees (~90%) and non-attendees (~50%) as the driving factor.  
  - **Correct:** Attributes the reversal to a "weighting artifact" (i.e., unequal group sizes) and confirms consistency via arithmetic.  
  *No missing elements; this is a full-credit answer.*

  ---

  ### **(b) Score: 2/8**  
  **Comments:**  
  - **Wrong:** Claiming workshop attendance is a *confounder*. Confounders must be pre-treatment (existing prior to intervention). Workshop attendance occurred *after* randomization and tutoring assignment, making it a **post-treatment variable**. Conditioning on it introduces bias (e.g., collider bias or mediator bias).  
  - **Wrong:** Asserting that randomization "failed" because workshop attendance is imbalanced. **Randomization balances pre-treatment confounders *on average*; it does not guarantee balance on *post-treatment* variables.** The 40% attendance gap is plausibly *caused* by tutoring (e.g., tutoring may conflict with the workshop).  
  - **Partially Correct:** Stating the overall comparison may mislead is true, but **not for the reasons given**. The overall intent-to-treat (ITT) effect (control: 74% vs. tutoring: 62.5%) is *valid* because randomization ensures groups are exchangeable. Reporting subgroup comparisons as causal effects is invalid without stronger assumptions.  
  - **Correct but Incomplete:** Noting tutoring raises pass rates in both subgroups is accurate descriptively, but **causal interpretation requires caution**. Workshop attendance could be a mediator (affected by tutoring) or a collider (if affected by tutoring and outcome).  
  - **What a full-credit answer requires:**  
    - **Report the overall ITT effect** (74% vs. 62.5%). Randomization ensures this comparison is unbiased for the *effect of assignment to tutoring*, regardless of post-treatment imbalances.  
    - Workshop-specific rates should *not* be reported as causal effects without addressing:  
      - Whether workshop attendance is a mediator (requiring additional assumptions for direct/indirect effects).  
      - Potential interference (e.g., if tutoring affects workshop attendance).  

  ---

  ### **(c) Score: 2/4**  
  **Comments:**  
  - **Partially Correct:** Requesting lottery records to audit randomization is relevant (though large imbalances can occur by chance, verifying procedure is sound).  
  - **Partially Correct:** Asking about non-attendance in the tutoring arm is useful for assessing compliance (e.g., actual receipt of treatment).  
  - **Wrong/Missing Critical Information:** Fails to ask about **temporal/logistical conflict between tutoring and the workshop**. Tutoring (5–7 PM) and the workshop (6–8 PM) overlap; students in tutoring may be *physically unable to attend the workshop*. This explains the attendance gap (control: 60% vs. tutoring: 20%) and means workshop attendance is **not a confounder but an outcome of treatment**.  
  - **What a full-credit answer requires:**  
    - Clarify scheduling conflicts (e.g., "Could tutoring students attend the workshop?").  
    - Assess actual compliance (e.g., "How many assigned to tutoring actually attended?").  
    - Explore workshop’s role: Is it a mediator, or does tutoring block access?  

  ---

  ### **Overall Feedback**  
  **Strengths:**  
  - Mastery of Simpson’s paradox mechanics (part a).  
  - Recognizes descriptive subgroup effects and risks of misleading marginal comparisons.  

  **Weaknesses:**  
  - Misdiagnosing a *post-treatment* variable (workshop attendance) as a confounder. This conflates pre-treatment balancing (randomization’s role) with post-treatment dynamics.  
  - Overlooking that the attendance gap likely stems from tutoring’s schedule (not randomization failure).  
  - Not prioritizing the **unbiased ITT estimate** (overall comparison) for causal claims about the *program assignment*.  

  **Key Corrections:**  
  1. **Confounders ≠ Post-treatment variables:** Confounders must precede treatment. Workshop attendance is *affected by* tutoring (post-treatment), so adjusting for it biases causal estimates.  
  2. **ITT is gold standard:** Randomization validates the overall comparison (74% vs. 62.5%) as the causal effect of *offering tutoring*, even with post-treatment imbalances.  
  3. **Subgroup claims need rigor:** Workshop-specific rates describe association, not causation. To estimate causal effects within subgroups, you’d need stronger assumptions (e.g., no unmeasured confounding within strata).  

  **Final Score: 12/20** (a: 8/8, b: 2/8, c: 2/4)
