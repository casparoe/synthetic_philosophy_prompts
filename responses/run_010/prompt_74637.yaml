prompt: |-
  So my local EA-ish reading group got into a fight last week about whether welfare economics actually proves utilitarianism, and afterward I went and read a blog post laying out Harsanyi's aggregation theorem. The author is clearly not a crank — the mathy bits are stated properly as far as I can tell, and I've been reading LW and the forums since the sequences days so I have some tolerance for this kind of thing — but it's a blog post written with a LOT of confidence and I can't tell which parts are load-bearing and which are just the author enjoying himself. Here's the relevant chunk, roughly transcribed (I typed it out myself so please dont blame the original for any wording slips):

  > Harsanyi's theorem is the closest thing social science has to a straight-up proof of utilitarianism. Take a fixed group of people whose preferences over lotteries satisfy the von Neumann-Morgenstern axioms, so each of them has a cardinal utility function. Take society's preferences over the same lotteries and assume they satisfy those axioms too. Add Pareto: if everyone prefers A to B, society has to prefer A to B. Then the social utility function is forced to be a weighted sum of the individual ones, and once you add the uncontroversial requirement that nobody's utility gets special treatment, the weights come out equal and you have the classical utilitarian formula — sum of utilities, done. The beautiful part is that this sidesteps Arrow: Arrow proved you can't aggregate preferences, but only because he banned interpersonal comparisons of utility. Let those back in and the impossibility evaporates. The one real cost is the comparability itself, and Harsanyi's defense of it is basically that I can put myself in your shoes and ask how much I'd care about your outcomes, which is all a utilitarian ever needed anyway.

  Is that fair? I'd like you to work through it claim by claim and sort the pieces into actually right, right-but-simplified-in-a-way-that-hides-something, and wrong or at least not what the theorem says. Two things I specifically can't resolve on my own. First, somebody in a comment thread years ago told me the equal-weights step is a separate argument with its own extra assumptions rather than a free consequence of the aggregation result, and I never checked whether that's true or just something people say to sound careful. Second, the "Arrow is dissolved" move feels like a lot of swagger and I want to know what an actual social choice theorist would say back to it. Also — and this is the part I care about most — once you fix everything that's off, is there still an argument for utilitarianism standing, or does the corrected version just describe the shape of a family of aggregation rules that a utilitarian happens to like? And relatedly: what does the theorem quietly assume about welfare, population, and the status of preferences that the post never mentions, because my instinct is that the interesting question-begging is happening in the setup and not in the conclusion. Please write in American English.

  For context on why I care beyond curiosity: someone in the group wants to deploy this to argue that any AI that aggregates human preferences is thereby committed to utilitarianism, which I think is a leap, and I'd like to be able to say exactly where the leap is rather than just gesturing at it.
reasoning: |-
  Okay, this user is diving deep into welfare economics and Harsanyi's theorem after a heated reading group debate. They've encountered a confident blog post claiming the theorem "proves" utilitarianism and wants it dissected claim-by-claim. The core tension: is this really a knockout argument for utilitarianism, or are there hidden assumptions?

  First, I need to unpack their three main concerns:  
  1) Whether the equal-weights conclusion truly follows without extra assumptions  
  2) If dismissing Arrow's impossibility via interpersonal utility comparisons holds water  
  3) What unstated premises about welfare/population/preferences are lurking  

  The blog post oversimplifies in several places. The "forced to be weighted sum" part is mathematically solid under the axioms (vNM rationality + Pareto), but "nobody gets special treatment" is hand-wavy. Symmetry isn't free—it requires assuming anonymity, which isn't in the original theorem. The equality leap hides normative work.

  On Arrow: the post is technically right that interpersonal comparisons dissolve the impossibility, but overstates it. Arrow banned cardinal utility and comparisons; adding them changes the game entirely. It's like saying "if we ignore gravity, flight is easy!" True, but gravity exists. The real debate is whether interpersonal comparisons are coherent.

  The user's AI concern is spot-on. Harsanyi assumes fixed populations with coherent vNM preferences—things an AI wouldn't inherit. Humans aren't vNM-rational agents, population ethics are thorny (e.g., how to weight future beings?), and "preferences" might not map to welfare. The theorem describes how to aggregate utilities if you already accept cardinal, comparable welfare—it doesn't prove that framework correct.

  Under the hood, the theorem quietly assumes:  
  - Welfare is reducible to vNM utility (controversial for non-instrumental values)  
  - Society is just an aggregate of individuals (ignores emergent properties)  
  - Utilities are on a ratio scale (needed for meaningful summation)  

  For the reading group's AI debate: Harsanyi doesn't force utilitarianism on an AI. An AI could reject interpersonal comparisons, or use non-utilitarian weights, or question whether human preferences reflect welfare. The theorem is a consistency requirement for utilitarian aggregation—not a proof that we must aggregate that way.
answer: |-
  Here's a breakdown of the blog claims, sorted into **Actually Right**, **Right-but-Simplified/Hides Something**, and **Wrong/Not What the Theorem Says**, followed by answers to your specific questions:

  ### Claim-by-Claim Assessment
  1. **"Take a fixed group... each has a cardinal utility function."**  
     → **Actually Right.** The vNM axioms imply each individual has a cardinal utility function (unique up to affine transformations).

  2. **"Society's preferences... satisfy [vNM] axioms too."**  
     → **Right-but-Simplified.** This assumes society has *rational* preferences under risk. Real-world collective preferences often violate vNM axioms (e.g., due to voting paradoxes), making this non-trivial.

  3. **"Add Pareto: if everyone prefers A to B, society prefers A to B."**  
     → **Actually Right.** This is standard Pareto efficiency. No issue here.

  4. **"The social utility function is forced to be a weighted sum of individual ones."**  
     → **Actually Right (under the axioms).** This *is* Harsanyi’s core result: with vNM rationality + Pareto, social welfare *must* be a **linear aggregation** of individual utilities.  
     → *But hides:* Weights can be unequal! Nothing in the math forces equal weights. The blog glosses over this.

  5. **"Nobody's utility gets special treatment → weights come out equal."**  
     → **Wrong/Overreach.**  
     - "Nobody gets special treatment" implies **anonymity** (permuting utilities doesn’t change social welfare), but Harsanyi *does not assume this*.  
     - Equal weights require **symmetry**: all individuals treated identically. This is a *separate, normative assumption* not implied by the theorem. Without it, weights could favor some groups (e.g., the rich).

  6. **"Sidesteps Arrow: he banned interpersonal comparisons."**  
     → **Right-but-Simplified/Hides Key Debate.**  
     - Arrow’s theorem requires *ordinal*, *non-comparable* utilities. Harsanyi allows *cardinal*, *comparable* utilities.  
     - **The catch:** Interpersonal comparisons *are* controversial. Arrow banned them because they’re hard to observe/justify, not as a trick. Harsanyi’s "solution" assumes the problem away.

  7. **"Harsanyi's defense of comparability: I can imagine being you."**  
     → **Not What the Theorem Says.**  
     - The theorem *assumes* comparability; it doesn’t defend it. The blog’s "empathy" argument is Harsanyi’s *personal philosophy*, not proof. Many economists (e.g., Sen) reject this as inadequate.

  ### Your Specific Questions
  **1. Equal weights as a "separate argument"?**  
  → **True.** Equal weights require **symmetry/anonymity**, which is *not* part of Harsanyi’s axioms. The theorem only gives a *weighted sum*; weights could be unequal. To get utilitarianism (equal weights), you must add:  
     - *"All individuals are morally identical"* (a normative claim), or  
     - *"We have zero information to distinguish people"* (an epistemic claim).  
  Neither is "free" or uncontroversial.

  **2. The "Arrow is dissolved" swagger:**  
  → A social choice theorist would say:  
     - *"Harsanyi didn’t ‘dissolve’ Arrow; he changed the question."* Arrow asked: *"Can we aggregate **ordinal** preferences?"* Harsanyi asked: *"If we **already have** cardinal/comparable utilities, how *should* we aggregate?"*  
     - Interpersonal comparisons solve Arrow’s impossibility by making the problem easier. But whether utilities *can* be compared remains hotly debated.  
     - **Key point:** Arrow’s result still stands for ordinal settings (e.g., voting). Harsanyi applies only if you accept cardinality/comparability.

  **3. Does a "corrected version" still support utilitarianism?**  
  → Only weakly. The theorem shows that *if* you accept:  
     - vNM rationality for society,  
     - Pareto,  
     - Cardinal/comparable utilities,  
  → then social welfare is a **linear aggregation** (weighted sum).  
  → To get **utilitarianism specifically**, you *must add* symmetry (equal weights) and **assume utilities are ratio-scale** (see below). Without these, it’s just "linear aggregation" — compatible with prioritarianism, elitism, etc.

  **4. Quiet Assumptions (where the question-begging happens):**  
     - **Welfare = vNM Utility:** Assumes human well-being is *fully captured* by vNM preferences. Ignores non-instrumental values (e.g., fairness, rights) that can’t be reduced to lottery choices.  
     - **Population Ethics:** Only applies to a *fixed group*. Says nothing about adding/removing people (e.g., extinction risk, future generations).  
     - **Status of Preferences:** Treats preferences as revealed truth. Ignores:  
       - Irrational/preference inconsistencies (vNM is idealized),  
       - Adaptive preferences (e.g., oppressed people "prefer" oppression),  
       - Whether preferences *should* define welfare (e.g., if someone prefers to harm others).  
     - **Scale of Utility:** For "sum of utilities" to be meaningful, individual utilities must be **ratio-scale** (e.g., "Alice’s utility is twice Bob’s" is invariant). But vNM utilities are only **interval-scale** (unique up to affine shifts).  
       → *Example:* If utility functions are *u_i* and *v_i = 2u_i + 3*, summing *u_i* vs. *v_i* gives different social orderings. Harsanyi *assumes* we have a "privileged" zero point.

  ### Why the AI Argument is a Leap
  Harsanyi shows that **if** an AI:  
  1. Accepts cardinal/comparable utilities,  
  2. Has vNM-rational "social" preferences,  
  3. Obeys Pareto,  
  4. Treats all humans symmetrically,  
  → **then** it must maximize the sum of utilities.  

  **Where this fails for AI:**  
  - **Comparability:** An AI might reject interpersonal comparisons as arbitrary (how to "calibrate" empathy?).  
  - **vNM Rationality:** Human preferences often violate vNM axioms. Should the AI "correct" them?  
  - **Symmetry:** Why should the AI weight all humans equally? (E.g., should a serial killer's utility count equally?)  
  - **Utility ≠ Welfare:** Should the AI maximize *preferences* (e.g., for heroin) or *well-being*? Utilitarianism conflates them; Harsanyi doesn’t resolve this.  

  **The leap:** Assuming Harsanyi *forces* utilitarianism on an AI. In reality, an AI could reject:  
  - The existence of cardinal/comparable utilities,  
  - The symmetry axiom,  
  - Or the premise that preferences define welfare.  

  ### Bottom Line
  The theorem is **not a "proof" of utilitarianism** — it’s a **consistency result**: *If* you buy the setup (cardinal utilities, comparability, vNM social rationality, Pareto), *then* linear aggregation is mandatory. But:  
  - Equal weights (utilitarianism) requires extra assumptions.  
  - The "dissolved Arrow" claim is technically true but practically misleading (comparability is the core debate).  
  - **What’s standing:** A strong argument that *if* you accept interpersonal utility comparisons, Pareto, and rationality, *some form* of linear aggregation is unavoidable. Utilitarianism (equal weights) is just one flavor.  

  For your reading group: **The gap isn’t in the math; it’s in the setup.** Deploying this for AI ignores that Harsanyi assumes a solved meta-ethical framework (cardinal welfare, comparability) that an AI wouldn’t inherit. The leap is pretending the assumptions are neutral.
