  I should consider if existing terms fit. Motivated reasoning? Not quite, since both parties are open to changing other views. Deep disagreement? No, because their frameworks align. Peer disagreement literature usually handles one-off cases, not iterative loops. 

  Epistemic loops or recursive distrust might be closer. The core is that the evidence of disagreement becomes evidence of unreliability. But I need a crisp definition. The symmetry is crucial—both parties are equally rational and trusted initially. The loop requires mutual reinforcement.

  Possible names: Epistemic Echo Chamber, but that's more about information bubbles. Maybe "Recursive Distrust Cascade"? Focusing on the iterative nature. Or "Adversarial Epistemic Spiral" to highlight the competitive aspect where each judgment undermines the other.

  The distinction from other concepts: Unlike confirmation bias, it's not ignoring counterevidence; it's interpreting the peer's stance as counterevidence. Unlike bias, it's symmetric and emergent from interaction. 

  Edge cases: If one is truly biased, it's not the same—the loop depends on symmetry. Private info might look similar but lacks the recursive meta-distrust. The loop can't be one-sided; both must participate.

  Testing for it: Check if disagreement leads to distrust in processing, which then affects interpretation of new inputs. If adding data only deepens distrust rather than resolving, that's a sign. Symmetry in initial respect is key.

  The user might need this to diagnose their discussions or avoid such loops. They value precise distinctions over references. They’d prefer honesty if the examples are mismatched. Here, both cases show the iterative meta-distrust, so they fit. 

  Finally, crafting a definition: A symmetric, iterative process where persistent disagreement causes mutual distrust in cognitive processing, leading to reinterpretation of subsequent evidence in a way that perpetuates disagreement without resolution.
answer: |-
  This is a **crisp, distinct phenomenon** you're describing—it's not just "stubborn disagreement" and doesn't cleanly fit existing labels. I'll define it, carve its boundaries, contrast it with neighbors, and provide a test. No fluff.

  ---

  ### **The Core Phenomenon: Definition**
  **Name:** **Self-Reinforcing Epistemic Distrust Spiral (REDS)**  
  *(Coined term; purpose-built for your cases)*  

  **Definition:**  
  A symmetric, iterative process between two rational peers who:  
  1. Start with identical evidence, methodologies, and mutual epistemic respect;  
  2. Engage in repeated rounds of evidence-sharing and argumentation;  
  3. Interpret the *persistence* of the other's disagreement as *new evidence* of a defect in the other's reasoning process;  
  4. Use this meta-distrust to discount subsequent inputs from the other party (e.g., "Your analysis of this new paper is unreliable because you're clearly biased");  
  5. Thereby lock into a stable equilibrium of unresolved disagreement, where added evidence *amplifies distrust* rather than resolving the dispute.  

  **Key mechanism:** Disagreement → Distrust in opponent's processing → Discounting of opponent's future inputs → Persistent disagreement → Reinforced distrust.  

  ---

  ### **Why Standard Concepts Don't Fit**  
  | Concept             | Why It Fails to Capture REDS                                                                 |  
  |---------------------|---------------------------------------------------------------------------------------------|  
  | **Aumann disagreement** | Assumes priors or private info explain divergence. REDS occurs *after* full evidence-sharing, with distrust *emerging from* the interaction. |  
  | **Motivated reasoning** | Involves *pre-existing* bias defending a conclusion. Here, distrust arises *during* the dispute and is symmetric. |  
  | **Deep disagreement** | Concerns foundational worldview clashes. REDS operates *within* shared frameworks/methodologies. |  
  | **Confirmation bias**  | Focuses on filtering *evidence*. REDS filters *the opponent's credibility* based on their stance. |  
  | **Bayesian updating**  | Can model the loop but doesn't explain *why* agents treat disagreement as evidence of unreliability. |  

  ---

  ### **Carving the Boundaries: The REDS Diagnostic Test**  
  Apply **all five criteria** to confirm REDS:  
  1. **Symmetry:** Both parties are initially epistemic peers (same competence, access, sincerity).  
  2. **Evidence saturation:** All relevant data/methods are shared upfront; no hidden info.  
  3. **Meta-distrust genesis:** Distrust arises *solely* from the opponent's continued disagreement, not pre-existing traits.  
  4. **Iterative discounting:** New evidence is evaluated through the lens of "Why is *this person* still wrong?"  
  5. **Equilibrium:** Disagreement stabilizes; adding evidence deepens distrust without narrowing the gap.  

  **→ If any criterion fails, it's not REDS.**  

  ---

  ### **Edge Cases & Nuances**  
  - **What if one party *is* truly biased?**  
    → Not REDS. REDS requires *symmetrically rational* agents. If you correctly detect pre-existing bias, it's ordinary skepticism. REDS is an *emergent artifact of the interaction*.  
  - **Genuine private info?**  
    → Not REDS. Private info creates honest divergence. REDS has no hidden variables; distrust is manufactured by the loop.  
  - **Asymmetry possible?**  
    → No. REDS requires mutual participation. If only one side distrusts the other, it's unilateral bias.  
  - **Does it require "total" framework agreement?**  
    → Yes. Any foundational clash (e.g., "p-values are invalid") invalidates REDS; it becomes deep disagreement.  

  ---

  ### **Why Your Two Cases Both Qualify**  
  1. **Social science finding debate:**  
     - Symmetry: You describe matched peers.  
     - Evidence saturation: "Pooled everything."  
     - Meta-distrust: "Your report isn't trustworthy" based solely on their stance.  
     - Iterative: New papers filtered through distrust.  
     - Equilibrium: Gap unchanged after a year. ✅  

  2. **AI timelines debate:**  
     - Symmetry: "Peers in every sense."  
     - Evidence saturation: "Same evidence."  
     - Meta-distrust: "Hidden variable" suspicion emerging from disagreement.  
     - Iterative: Failure to find the variable fuels distrust.  
     - Equilibrium: Persistent unresolvable split. ✅  

  **Crucially:** Both cases lack *asymmetric* flaws (e.g., one side being emotionally invested). The loop is the engine.  

  ---

  ### **Why This Isn't "Just Stubbornness"**  
  Ordinary stubbornness lacks the **iterative meta-layer**. In REDS:  
  - Round 1: "I think X, you think Y."  
  - Round 2: "You still think Y *after seeing my evidence*? You must be unreliable."  
  - Round 3: "Your critique of my new data is suspect *because you're unreliable*."  
  → The *disagreement itself* becomes the fuel.  

  ---

  ### **Escaping the Spiral**  
  (You didn’t ask, but the logic implies solutions):  
  1. **Third-party adjudication:** Break symmetry with an agreed-upon external evaluator.  
  2. **Blind evidence review:** Remove authorship/identity from data to bypass distrust filters.  
  3. **Meta-truce:** Jointly acknowledge the loop and agree to reset distrust to zero.  

  REDS is a pathology of *perfectly rational* agents trapped by self-generated skepticism. It’s not irrationality—it’s rationality eating its own tail.
