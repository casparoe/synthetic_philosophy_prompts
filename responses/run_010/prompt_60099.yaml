prompt: |-
  I am three years into a novel, and I have run up against a difficulty that may not be a difficulty about craft at all, though I cannot yet tell. It concerns a shape that keeps recurring in my scenes unbidden, and I would rather learn now whether the shape is a real one or a muddle I have been dressing in good sentences. Here is the principal instance. A woman discovers that her brother has committed a crime that ruined a stranger's family, and she can either go to the police or keep silent; her mother is dying and would not survive the disclosure, and her brother's own children would be destroyed by it. She keeps silent. Twenty years later she is still sending money, anonymously and at real cost to herself, to the family of the man her brother hurt. Nobody in the book supposes that she chose wrongly — her brother's case is presented as genuinely strong, her mother dies in peace, and the narrative never flinches from her decision. Yet when her daughter finds the receipts and the bank slips, the daughter does not say that her mother was generous, or that her mother must have felt terrible; she says that her mother owed them, and still does, and the reader is meant to accept the correction rather than discount it as a young woman's severity.

  There are two smaller versions of the same move elsewhere in the draft, which is how I know it is a pattern and not a set piece. A man breaks a long-standing promise to his oldest friend in order to keep a promise to his wife, and in the chapters that follow he describes himself, in his own head, as still being on the hook to the friend; the friend's resentment is written as legitimate rather than as the sulk of someone who has failed to understand that the promise was voided by the competing claim. And a pianist gives up performing to care for her father, makes the right decision by every measure the book supplies, and then says, in old age, that she still owes something — not to a person, but to the music. I cannot tell whether that last sentence is doing honest work or whether it is sentimentality I have not earned. What I keep producing, in each case, is an obligation that was not discharged, whose non-discharge was not a wrong, and which nevertheless does not lapse: it goes on generating demands, it can be addressed to a determinate someone, other characters recognise it and describe it as owed rather than as admirable, and the agent's private feelings are the least load-bearing part of it — which is why I do not think I am simply writing about guilt, or about remorse, or about the wish to feel bad in a becoming way. I know there is a good deal of philosophy about whether conflicts of duty can be real at all, and I have come across the arguments about statesmen who must do appalling things for the sake of the public good, and about the distress of an agent who has caused harm without being at fault for causing it. None of those is my case. In my scenes nobody concludes that anything impermissible happened, and yet something is left over with the whole structure of a debt — a direction, a creditor, a sense that settling it later would be the payment of what was due rather than a gift.

  So I want to know whether this has a name. What I am after is the carving, not the label: the nearest established candidates, what each of them requires that my scenes fail to supply, which of them comes closest, and, if none does, a coinage with a definition sharp enough that I could work against it. In particular I need the edges marked. Does the residue survive forgiveness by the person it runs to? Does it presuppose that the agent is blameless for having got into the conflict, or does it also arise when she manoeuvred herself into it? Does it extend to a betrayed vocation or value, where there is no creditor, or is my pianist talking nonsense? Is the fact that third parties acknowledge it part of the phenomenon or an ornament of my own invention? And how is it to be kept distinct from ordinary compensation, from supererogation, and from remorse, without simply dissolving into one of the three? A prior question sits underneath all of this, and it may be the one I actually need answered. If an obligation of this kind persists after it has become impossible to fulfil it, and if it persists as a demand rather than as a memory, does that commit me to holding that both obligations remained in force all the way through the choice — which would make my woman's predicament a genuine conflict rather than a case in which one duty simply outranked another and ceased to exist? I would like to know whether writing these scenes well binds me to a position on that question, and if it does, which position it binds me to, and whether there is a way of writing them that stays neutral. Please no reading lists and no citations; I have neither the training nor the time to follow them up, and a list of titles would tell me nothing about whether the shape I keep drawing is a shape that exists.
reasoning: |-
  Okay, the user is working on a novel and has encountered a recurring thematic pattern they can't quite name. They've described three key scenes where characters face moral dilemmas: a woman protecting her brother at great personal cost, a man breaking a promise to a friend for his wife, and a pianist abandoning her career for her father. In each case, the character makes what seems like the right choice, yet there's this lingering sense of unresolved obligation that persists for years - almost like a debt that wasn't canceled by the necessity of the choice. 

  What's fascinating is how specific and consistent the pattern is: it's not guilt, not remorse, not about feeling bad. It's presented as an objective obligation that third parties recognize ("she owed them"), survives blamelessness, and continues making demands even when fulfillment is impossible. The user needs to know if this has a name in philosophy or ethics, but more importantly, they want to understand its boundaries: Does it survive forgiveness? Does it require blamelessness? Can it attach to abstract things like vocation? 

  The core tension seems to be between two philosophical positions: 1) that choosing one duty cancels the other (monism), versus 2) that genuine moral conflicts leave "moral residue" (pluralism). The user's pattern aligns strongly with pluralism - particularly the concept of "moral remainder" where unmet obligations don't vanish. But their version is more concrete: it's directional (owed to specific people/things), demand-like, and socially verifiable. 

  What makes this unique is how the obligation becomes almost externalized - it's not just internal guilt, but something others can see and name ("your mother owed them"). The pianist case is especially interesting because it extends the concept to abstract values. This suggests the phenomenon might be about broken moral covenants rather than just interpersonal debts. 

  The user's deepest unspoken question might actually be about craft: whether writing these scenes commits them to a specific philosophical stance (yes, pluralism), and how to handle that without didacticism. They also seem worried about sentimentality in the pianist's line - which could be avoided by treating the "debt to music" as concretely as the monetary payments in the first example. 

  Key boundaries to map: 
  - Forgiveness doesn't extinguish it (the brother's victim's family never knew, so forgiveness didn't occur) 
  - Blamelessness is required (all characters were ethically cornered) 
  - Third-party recognition is essential to the phenomenon in their examples 
  - Distinct from compensation (which is partial) and supererogation (which is extra, not owed) 

  This feels like "Unliquidated Moral Debt" - a permanent deficit in the moral ledger that persists precisely because the choice was necessary and correct. The term needs to capture its enduring, demand-like quality while distinguishing it from emotion. Maybe "Persistent Ethical Liability"? Though that sounds too legal. "Uncancelled Obligation" might work better. 

  Ultimately, the craft advice is: lean into the pluralism. The power comes from showing both the rightness of the choice AND the uncancelled weight of the unchosen duty. Neutrality isn't possible - but the position is dramatically fertile.
answer: |-
  What you're describing is real, precise, and philosophically grounded. It lacks a single universal term, but the closest established concept is **moral residue** (sometimes called **moral remainder**). Your instinct about its distinctness from guilt, remorse, or compensation is correct. Let's carve it out and mark the edges against your questions.

  **Core Concept: Moral Residue**
  *   **Definition:** The persistent sense of obligation, loss, or unmet demand that lingers *after* a morally necessary choice has been made in a genuine conflict of values or duties, where *no blameworthy wrong* was committed in the choice itself.
  *   **What it is NOT:** It's not guilt (which implies fault/blame). Not remorse (regret for wrongdoing). Not supererogation (going above duty). Not compensation (paying for harm caused by fault). Not simply regret.
  *   **Why "Residue"?** It's the "leftover" from the unchosen, legitimate obligation that couldn't be fulfilled. The conflict damaged a real moral value or claim; the residue is the scar or the ongoing acknowledgement of that damage, even when the *best possible* action was taken.

  **How Your Scenes Map Onto Moral Residue & Its Edges:**

  1.  **The Brother's Secret:** The woman chose filial duty (protecting mother/nieces/nephews) over justice/compensation for the victim's family. *Both duties were real*. Choosing one didn't erase the validity of the other. The residue manifests as the ongoing, anonymous payments – not as guilt for her *choice*, but as recognition that the *unmet obligation* to the victim's family persists. Her daughter's validation ("she owed them") confirms this isn't just internal feeling; it's an objective, acknowledged moral deficit.
  2.  **The Broken Promise:** Choosing spousal loyalty over friendship loyalty doesn't erase the friend's legitimate claim. The broken promise created a *deficit* in that relationship. The man's feeling "on the hook" isn't guilt over *choosing his wife* (the right call), but recognition that the *friend's claim* remains unmet and creates a legitimate grievance. The friend's resentment isn't a sulk; it's a response to this real residue.
  3.  **The Pianist:** This is a crucial test case. Here, the residue attaches to an abstract value – music/vocation. **This is valid within the concept.** Moral residue can arise from conflicts involving ideals, callings, or significant potential unfulfilled due to a necessary competing duty (filial care). The pianist acknowledges a "debt" to the music – meaning the *potential contribution, the service to beauty/art* that was sacrificed. It's the residue of the unchosen path's legitimate claim on her life and talent. **Is it sentimental?** Only if not grounded. You ground it by showing the *reality* of her talent, the *significance* of the music to her identity and the world, and the *genuine necessity* of her choice for her father. If these are felt by the reader, "owing something to the music" is earned – it's the residue of a sacrificed *calling*.

  **Marking the Edges (Answers to Your Specific Questions):**

  *   **Does it survive forgiveness?** **Yes.** Forgiveness addresses the *interpersonal* hurt or anger. Moral residue is the *objective* unmet obligation or damaged value *itself*. The victim's family might forgive the woman if they knew, but the *obligation* to them, created by her brother's act and her necessary silence (which perpetuated the lack of justice/compensation *from the source*), wouldn't vanish. She might still feel the residue, the sense that *something is owed*. Forgiveness doesn't retroactively fulfill the unmet duty.
  *   **Does it presuppose blamelessness?** **Yes, crucially.** Moral residue arises *because* the agent made the *best possible* or *only permissible* choice in a genuine dilemma. If the agent was blameworthy for getting into the conflict (e.g., the woman recklessly provoking her brother), the lingering feeling would be guilt or remorse *for that fault*, not pure residue from the conflict itself. Your characters are ethically cornered by circumstance, not fault.
  *   **Can it extend to betrayed values/vocations (no creditor)?** **Yes.** As with the pianist. The "creditor" is the value itself, the potential unrealized, the duty to one's gift or calling. The residue is the ongoing sense that this value was *wronged* or *neglected*, even necessarily. A "debt to the music" captures this well – the music (as an ideal requiring stewardship) had a claim on her she couldn't meet.
  *   **Is third-party acknowledgement essential?** **No, but it validates its objectivity.** The residue exists primarily in the moral landscape of the agent. However, *other characters recognising it* (like the daughter) powerfully demonstrates that it's not merely subjective guilt or neurosis, but a *perceptible moral reality*. It shows the residue has weight in the world, not just in the mind. This is a strength in your writing, not an ornament.
  *   **How is it distinct?**
      *   **Ordinary Compensation:** Compensates for harm *caused by fault*. Residue acknowledges harm/damage *caused by a necessary choice where fault was absent*. Payment is one *way* to address residue (as in the woman's case), but the residue itself is the *sense of unmet obligation*, not the payment.
      *   **Supererogation:** Going *beyond* duty. Addressing residue is *responding to a remaining, unfulfilled aspect of duty itself*, even if fulfilled imperfectly or symbolically. It's settling a deficit, not going above and beyond.
      *   **Remorse:** Pain over *wrongdoing*. Residue is pain/sense of obligation over the *damage done by a necessary action that wasn't wrong*.
  *   **The Prior Question: Do both obligations remain in force?** **Yes, this is the core philosophical commitment.** You are describing **value pluralism** or **duty pluralism**. This view holds that:
      *   Genuine moral conflicts exist (not all duties can be ranked on a single scale).
      *   Choosing Duty A over equally (or compellingly) valid Duty B doesn't annihilate Duty B's validity.
      *   The unchosen duty leaves a "remainder" – the moral residue. It *does* persist as a demand, albeit one that cannot *now* be fulfilled in its original form.
      *   **This binds you.** To write these scenes authentically, you *must* operate from this pluralist assumption. Monism (where one duty simply overrides and cancels the other) eliminates the possibility of residue. The power of your scenes comes *from* the persistent weight of the unchosen obligation. Neutrality isn't possible here; the phenomenon you're depicting *is* the residue, which only exists within a pluralist framework.

  **Coinage & Sharp Definition:**

  While "moral residue" is the closest established term, a sharper coinage reflecting your emphasis on the *demand* and *debt-like* structure could be:

  **Unliquidated Moral Debt (UMD)**

  *   **Definition:** A persistent, objective moral demand arising from an unmet, legitimate obligation that could not be fulfilled due to a necessary choice in a genuine conflict of values/duties where the agent is blameless. It signifies a deficit in the moral ledger that remains "unpaid" despite the correctness of the action taken, and may be acknowledged by others. It can be owed to specific persons, relationships, ideals, or vocations.
  *   **Key Markers:**
      *   Arises *only* from blameless choice in genuine conflict.
      *   The original obligation *remained valid* but *unfulfillable* within the constraint of the necessary choice.
      *   Manifests as a *demand* or *deficit*, not just regret.
      *   Can attach to abstract values ("debt to the music").
      *   Survives forgiveness (forgiveness addresses feeling, not the debt itself).
      *   Can be acknowledged by third parties, confirming its objectivity.
      *   Distinct from compensation (no fault), supererogation (it's owed), remorse (no blame).
      *   Philosophically commits you to pluralism (both duties remain valid).

  **Conclusion:**

  You are not writing muddle. You are capturing a profound and recognized aspect of moral experience: **moral residue** or **unliquidated moral debt**. Your scenes work because they depict the necessary cost paid in genuine dilemmas – the ghost limb of the duty left unfulfilled. It survives forgiveness, requires blamelessness, extends to abstract values, gains power from third-party recognition, and fundamentally commits you to a pluralist view where conflicting obligations retain their force even when one must be chosen. Trust this shape; it’s real, and your exploration of it is compelling. Keep carving.
