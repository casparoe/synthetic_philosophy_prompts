  **Fragility Endorsement Underwriting Manual**

  **Section 1: Purpose and Scope**  
  This endorsement provides coverage for the breakage of items certified as fragile under the terms herein. Coverage is triggered solely by the physical fragmentation, shattering, or structural failure of a certified fragile item (CFI) resulting from a covered event. The endorsement is designed to mitigate the financial impact of fragility-related losses, subject to the conditions, definitions, exclusions, and limitations set forth below.

  **Section 2: Definitions**  
  2.1 **Certified Fragile Item (CFI)**: An item that has undergone and passed the Standard Impact Vulnerability Test (SIVT) as administered by an Approved Testing Facility (ATF).  
  2.2 **Standard Impact Vulnerability Test (SIVT)**: A controlled assessment wherein the item is subjected to a Calibrated Kinetic Input (CKI) of 5.0 Joules (J) applied perpendicularly to its surface at a point designated by the testing protocol. The item is deemed to have passed the SIVT if, under the conditions of the test, it would suffer breakage as defined in Section 2.4.  
  2.3 **Breakage**: The fracturing, crumbling, or separation of the item into two or more distinct pieces, or the permanent deformation rendering the item non-functional for its intended purpose.  
  2.4 **Calibrated Kinetic Input (CKI)**: A strike delivered by a pendulum apparatus of mass 1.0 kg, released from a height of 0.51 meters, yielding an impact energy of 5.0 Joules (J).  
  *(Note: Initially, the definition of CFI is purely counterfactual: it would break if struck. But we'll see this change.)*

  **Section 3: Underwriting Clauses**  
  3.1 **Certification Process**: An item may be submitted for certification by the policyholder to an ATF. The ATF shall conduct the SIVT under laboratory conditions. If the ATF determines that the item would break under the SIVT, it shall be certified as a CFI.  
  3.2 **Amendment for Extraneous Safeguard Intervention (ESI)**: Effective 01/01/2024, the SIVT must be conducted under Unmitigated Impact Conditions (UIC). UIC requires that no external safeguarding mechanism (e.g., force fields, cushioning devices, or reactive stabilizers) is active during the test.  
  *Reason: We had cases where an item was certified because it "would break" in the test, but in reality, it had an embedded force field that would activate and prevent breakage. So we added UIC to rule out such safeguards. But then...*  
  3.3 **Amendment for Ambient Protective Conditions (APC)**: Effective 06/01/2024, the SIVT must be evaluated under Nominal Environmental Parameters (NEP). NEP excludes any permanent or semi-permanent protective casing or packing integral to the item’s ordinary use. However, if the item is customarily housed in such packing, the test shall be conducted with the packing removed.  
  *Reason: We denied a claim for a fragile vase because it was packed in foam and the test (without foam) showed it would break. But in the claim, the vase was in foam and didn't break when struck. However, without the foam it was fragile. So we had to specify that the test must be without packing. But then...*  
  3.4 **Amendment for Test Condition Specificity**: Effective 12/01/2024, the SIVT must be conducted under circumstances that reflect the item’s "inherent vulnerability profile" (IVP), as determined by a Certified Appraiser (CA). The CA shall disregard any transient or extrinsic factors and assess whether the item, by virtue of its material composition and design, would be expected to break under the CKI.  
  *Note: Here we abandon the counterfactual and move to an expert judgment about the item's nature.*  
  3.5 **Calibrated Kinetic Input (CKI) Revision**: Effective 03/01/2025, the CKI is redefined as "a strike of sufficient severity to cause breakage in an item of standard fragility, as determined by the CA using industry-standard reference materials."  
  *Note: The strike energy is no longer fixed; it's now relative to what the appraiser thinks is fragile.*

  **Section 4: Exclusions**  
  Coverage under this endorsement shall not apply to:  
  4.1 Any breakage occurring while the item is in transit under conditions that deviate from the NEP as defined in Clause 3.3.  
  4.2 Breakage resulting from an impact of energy less than the CKI in effect at the time of certification.  
  4.3 Items whose IVP, as assessed under Clause 3.4, is deemed "borderline" or "context-dependent" by the CA.  
  4.4 Claims involving items that, at the time of loss, were subject to an ESI as defined in Clause 3.2, regardless of whether the ESI was active.

  **Section 5: Annex – Sample Denied Claims**  
  5.1 **Claim #2024-001**: A porcelain figurine certified under SIVT (pre-UIC) broke in shipment. Denied because post-loss investigation revealed an inactive but present ESI (a dormant anti-fracture nanocoating) that would have activated upon impact. Although the coating was inactive at the time of loss, its presence voided coverage under the ESI exclusion (4.4).  
  5.2 **Claim #2024-045**: A glass tablet screen certified under SIVT (post-UIC and pre-APC) broke when dropped without packing. However, the claim was for breakage while in its factory-installed shock-absorbing case. Denied because the SIVT was conducted without the case, and the case constituted APC not accounted for in the test.  
  5.3 **Claim #2025-101**: A ceramic vase certified under the IVP process (Clause 3.4) broke. Denied because the CA noted that the vase, though made of brittle material, was of "robust design" and thus its breakage under minor impact was "unexpected and inconsistent with its IVP."

  ---

  **Note on Philosophical Parody**  
  This manual parodies the reductive counterfactual analysis of dispositions (e.g., fragility as "would break if struck"). The initial definition (SIVT) represents a simple counterfactual. Clause 3.2 addresses "finkish" cases where a disposition is masked by an extrinsic intervention (here, ESI). Clause 3.3 handles cases where the disposition is present but the manifestation is prevented by ambient conditions (like packing), which mirrors "antidotes" or masking. The shift to "inherent vulnerability profile" (Clause 3.4) and appraiser judgment parades the collapse of the reductive project into primitivism or epistemic criteria. The sliding CKI (3.5) satirizes the non-reducibility of dispositional magnitudes.  

  The parody takes liberties in compressing distinct problems (e.g., finks, masks, and antidotes are often treated separately) and in suggesting that appraiser judgment is an ad hoc retreat (some dispositional realists accept primitivism). What's settled: pure counterfactual analyses are widely acknowledged as insufficient due to such cases. What's disputed: whether a more sophisticated conditional (e.g., with ceteris paribus clauses) can work, or if dispositions are irreducible. The manual’s exclusions and denials highlight the practical impossibility of a waterless reductive account.
