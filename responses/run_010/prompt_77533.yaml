  We are writing a parody of an insurance underwriting manual for a "Fragility Endorsement". The central idea is to define "fragile" in counterfactual terms and then show how this definition fails in various cases, leading to amendments that create new problems.

  Structure:
  1. Purpose and Scope: Introduce the endorsement and its goal to cover breakage of certified fragile items.
  2. Definitions: Define key terms, especially "fragile" using a counterfactual: an item is fragile if it would break when struck sharply under standard conditions.
  3. Underwriting Clauses: 
     a. Initial certification process based on the counterfactual test.
     b. Problems arise: 
        - Over-inclusion: Items that wouldn't break because of interventions (e.g., protective fields) are certified.
        - Under-inclusion: Fragile items in protective packing are denied because they wouldn't break in the test.
     c. Amendments to fix these issues, which create new problems (e.g., specifying the strike must be "unmitigated", but then having to define that, and so on).
  4. Exclusions: List specific situations where claims will be denied, which now include cases that the amended definitions can't handle.
  5. Annex: Sample denied claims that illustrate the absurd outcomes.

  The humor comes from the manual's descent into bureaucratic jargon and circular definitions, mirroring philosophical problems with counterfactual analyses of dispositions.

  We need to invent bureaucratic terms:
  - For the counterfactual: "Standard Impact Vulnerability Test (SIVT)"
  - For over-inclusion: "Extraneous Safeguard Intervention (ESI)"
  - For under-inclusion: "Ambient Protective Conditions (APC)"
  - For the amendment that tries to remove the safeguard: "Unmitigated Impact Condition (UIC)"
  - Then when specifying the force, we might have "Calibrated Kinetic Input (CKI)" and then that slips too.

  The manual will start with a clear counterfactual, then add provisos until it becomes a mess.

  Note: After the manual, we will add a note mapping clauses to philosophical issues.

  Let's write the manual first.

