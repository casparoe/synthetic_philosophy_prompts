prompt: |-
  Third-year philosophy PhD here, supposed to be turning my dissertation proposal in next month on decision theory under imperfect information, and instead I've spent the last week unable to think about anything else. My advisor is on sabbatical in Lisbon, my reading group has split into two camps over an arguement I sketched on the board, and I can't tell which camp is right. Half of them think it's a clean refutation of updateless decision theory and I should write it up; the other half think it proves too much and therefore proves nothing. I'd rather hear from someone with no stake in either camp.

  Some setup so the argument is assessable on its own terms. Updateless decision theory, as I understand it, says that when you're standing at a choice node you shouldn't re-decide on the basis of what you've since observed. You should instead have picked, before you had any of that evidence, the policy — the whole function from observations to actions — that maximizes expected utility as assessed from your prior, and now you just execute it, even if your current credences point the other way. The motivation is Newcomb-style cases where your observation is tangled up with your own act, plus cases like the absent-minded driver and Sleeping Beauty where what you learn is only which copy or which day you are. I find all that appealing. Here's what I built against it anyway:

  (1) UDT: what it's rational to do at a choice node is to carry out the policy that, evaluated from your prior before you had any of the evidence you now have, maximizes expected utility.
  (2) What a policy prescribes at a node is settled once, at selection; later evidence can't rewrite it.
  (3) So at the node, UDT tells you to do what your prior would have had you do, no matter what you've since learned.
  (4) Sometimes what you've since learned changes the expected utilities outright — say a reliable technician walks in and tells you the coin you're betting on already came up heads.
  (5) In those cases UDT tells you to bet as though you'd never heard, i.e. to act against your own current assessment of the odds.
  (6) Any theory that ever tells an agent to act against her own current assessment of the odds isn't a theory of rational choice.
  (7) So UDT isn't a theory of rational choice.
  (8) The standard repair — of course the policy is a function of observations, so it can say "if you hear heads, bet heads" — doesn't save it. Either the prior gave that news positive probability, in which case UDT's verdict at the node is just what an ordinary conditionalizing agent reaches there, so UDT stops disagreeing with the standard view in any case where it was supposed to, contradicting what its fans say about Newcomb; or the prior gave it probability zero, in which case the policy is silent about exactly the surprising evidence that made you reach for a decision theory in the first place.
  (9) So UDT is either irrational or empty.

  My friend Mira says the whole thing is universal acid and that I should be embarassed. Her objection is to (6), not from UDT's side: if a theory is disqualified for ever telling you to act against your current assessment of the odds, then every form of self-binding is disqualified too. I precommit in September not to check my phone during writing hours; every October morning my current assessment is that five minutes costs nothing and the paper would benefit from the citation. Odysseus at the mast is the textbook version. And a causal decision theorist who pays to precommit before Newcomb — which everyone, including me, thinks is the rational move if you can buy it — then acts against her own assessment at the node. So (6) refutes precommitment as such, precommitment is sometimes plainly rational, therefore (6) is false and my argument is worthless. She won't say which of (2) through (5) actually breaks, just that something is being slid around and she isn't doing my work for me.

  So: which step do you reject, and why did it look unobjectionable to me when I wrote it down — what's the reading under which it's true, and the reading under which the argument needs it? For what it's worth I'm most attached to (4) and (5); I really don't want to concede that learning something can leave it rational to act as though you hadn't. I'm least attached to (8), which I added at 2am and have always suspected of doing shady work, but I don't see how (1)-(7) gets me anywhere interesting without it. And I do want to keep UDT's answer in Newcomb, because I think one-boxing is right and I think the causal people are wrong.

  Then price out the options for me. If you reject (6), tell me what UDT is actually committed to about genuinely surprising evidence, and whether the silence in the second horn of (8) is a bug specific to UDT or a feature it shares with every view that makes choices ex ante. If you reject something earlier, say what the policy/act distinction has to look like for UDT to survive (4) without collapsing into ordinary conditionalizing. And if you think Mira is right that the argument proves too much, explain why the precommitment analogy is load-bearing rather than just rhetorically pretty — or, if you think it's merely pretty, tell me where the disanalogy with Odysseus and the phone actually sits.
reasoning: |-
  Hmm, the user is a third-year philosophy PhD student struggling with a decision theory argument about updateless decision theory (UDT). They've presented a structured argument against UDT and are facing pushback from their reading group - half think it's a valid refutation while the other half think it proves too much. Their advisor is unavailable, so they're seeking external input.

  The core argument goes like this: UDT requires agents to follow pre-selected policies even when new evidence contradicts them (step 3-5), which forces irrational actions against current beliefs (step 6), making UDT either irrational or empty (step 8-9). But their friend Mira challenges step 6 using precommitment examples like Odysseus tied to the mast.

  I need to carefully unpack this. The user is clearly deep in the weeds of decision theory - they reference Newcomb problems, absent-minded driver, Sleeping Beauty etc. Their tone shows intellectual frustration but also genuine curiosity. They're attached to steps 4-5 (that learning should change rational action) but want to preserve UDT's solution to Newcomb (one-boxing).

  Mira's objection about step 6 being "universal acid" seems crucial. She's right that rejecting any theory that ever prescribes acting against current beliefs would condemn all precommitment strategies, including the rational ones like Odysseus or pre-paying in Newcomb cases. This suggests step 6 is too broad. 

  But simply rejecting step 6 isn't enough - we need to explain how UDT avoids the problems in steps 4-5 without collapsing into standard decision theory. The key distinction is between evidence that's policy-relevant versus policy-constitutive. In UDT, some observations (like which copy you are in Sleeping Beauty) aren't treated as standard evidence but as indexical information that's already baked into the policy's expectation calculations. 

  The user's step 8 misses this nuance. When UDT policies condition on observations, it's not the same as Bayesian updating. In Newcomb, the "if predictor thinks X" branch isn't surprising evidence - it's part of the policy's problem specification. True surprises (like the technician announcing coin results) would indeed break UDT if the policy didn't anticipate them, but this is a limitation of any precommitment approach, not UDT specifically.

  For the user's dissertation, they should consider reframing UDT not as rejecting updating, but as having a specialized updating rule for self-locating/act-correlated information. The policy/act distinction matters precisely for cases where evidence is entangled with action - that's why we need UDT alongside standard decision theory.
answer: |-
  Your argument is admirably clear and the tension you've identified is genuine—but the critical flaw lies in **step (6)**, amplified by an ambiguity in step (3) that Mira's precommitment analogy exploits. Here's the breakdown:

  ### Why (6) is Overly Broad & Why Mira is Substantively Right
  **(6) "Any theory that ever tells an agent to act against her own current assessment of the odds isn't a theory of rational choice"**  
  This is where your argument proves too much. Mira is correct: this *would* condemn all rational precommitment strategies. But precommitment *is* sometimes rational (Odysseus, UDT precommitment in Newcomb, ignoring your phone). Crucially, **acting against your *current assessment of local odds* isn't irrational if you're fulfilling a *globally optimal plan* chosen under superior epistemic conditions**. Step (6) ignores the distinction between:
  - **Myopic Rationality:** Maximizing utility *given only current beliefs at the node*.
  - **Strategic Rationality:** Maximizing utility *given the entire decision problem structure*, including how information correlates with actions/outcomes.

  **UDT's claim is that Strategic Rationality is fundamental.** Rejecting (6) doesn't mean UDT is automatically vindicated, but it means your argument doesn't refute it. The burden shifts to explaining why UDT's *specific* instances of "acting against current odds" are irrational, while Odysseus isn't.

  ### How UDT Avoids Absurdity in (4)/(5) & Why (3) is Ambiguous
  Your description of UDT in (1)-(3) subtly conflates two things:
  - **Policy Execution:** Following the *output* of your pre-selected policy.
  - **Epistemic State at Execution:** What you *believe* when you execute it.

  **(3) "UDT tells you to do what your prior would have had you do, no matter what you've since learned"**  
  This is misleading. UDT says: **Execute the *policy* your prior selected.** Crucially, a *good UDT policy is a function of observations*. If the policy says "If technician says heads, bet heads," then *executing that policy* IS acting on your updated belief ("technician said heads" → bet heads). The policy *encodes how to respond to anticipated evidence*, including the technician's report.

  **Where UDT *might* demand acting against current beliefs:**
  - Only when the observation *itself* is entangled with the act or your identity (e.g., Newcomb: seeing $1M correlates with your one-boxing policy; Sleeping Beauty: learning it's Monday/Tuesday depends on the coin flip *and* your policy).
  - In these cases, UDT argues that "updating" naively *distorts* the causal/acausal structure. The policy already factored in the *probability* of seeing $1M *conditional on your strategy*. "Updating" on it *again* would be double-counting or misapplying evidence.

  **The Technician Case (4)/(5):**
  - **If the technician's report was *anticipated*:** Your UDT policy *already includes* "if tech says heads, bet heads". Executing this *is* acting on your updated belief. No conflict.
  - **If the technician's report was *genuinely surprising* (prior prob=0):** This is the "second horn" of your (8). Here, UDT *is* vulnerable. The policy provides no guidance. But **this isn't unique to UDT!** Any ex ante optimization (classical CDT, EDT precommitment schemes) faces this problem with unanticipated evidence. UDT shares this limitation with all precommitment theories; it doesn't make it "empty."

  ### Why (8) Doesn't Kill UDT & How It Handles Newcomb
  **(8) "The standard repair... doesn't save it..."**
  - **"Contradicting what its fans say about Newcomb":** This misstates UDT's claim. UDT *agrees* with CDT/EDT *on the policy recommendation* for Newcomb: precommit to one-box. The disagreement is *only apparent at the node*:
      - **Standard CDT/EDT (naive):** At the node, seeing $1M, they *update* and think "taking the box gives me $1000k, not taking it gives $0," so they two-box. This is **myopically rational but strategically flawed.**
      - **UDT:** At the node, the policy says "one-box" *because* your prior knew one-boxing correlates with $1M being present. You execute "one-box" *even though your updated belief at the node suggests two-boxing is locally optimal*. UDT *preserves the strategic insight* by refusing to "update away" the correlation between your act and the prediction.
  - **The key isn't disagreement on the *policy*; it's disagreement on whether *execution requires re-optimization at the node*.** UDT says no; CDT/EDT (naively applied) say yes. Your argument in (8) assumes UDT must disagree at the policy level to be distinct; it doesn't. Its distinctness is in *how it justifies sticking to the policy at the node* when myopic rationality pulls away.

  **The "Silence" Problem (Prior Prob=0 Evidence):**
  This is a genuine challenge for *all* ex ante optimization approaches (UDT, sophisticated CDT precommitment, etc.). UDT doesn't have a special flaw here. Responses include:
  1. **Idealization:** Assume agents have priors assigning non-zero prob to all *conceivable* evidence (however small). Unrealistic, but common in decision theory.
  2. **Default Policies:** Specify how the policy behaves for unanticipated evidence (e.g., "switch to myopic CDT").
  3. **Acknowledge Limitation:** Rationality under radical unforeseen change is unsolved; UDT handles anticipated entanglement better than rivals.

  ### Where the Disanalogy with Odysseus/Phone Lies & Why it Matters
  Mira's analogy is **load-bearing, not merely rhetorical.** The disanalogy strengthens UDT's case:
  - **Odysseus/Phone:** The *reason* precommitment works is purely *causal*: binding physically prevents the later, myopically preferred act.
  - **UDT in Newcomb/Sleeping Beauty:** The *reason* precommitment works is **epistemic/acausal**: refusing to "update" prevents you from *destroying the evidence-correlation* that made your policy good. Two-boxing *after* seeing $1M severs the link between your act and the prediction; it doesn't causally change the past, but it makes your act *no longer correlate* with the prediction. UDT treats the *logical link* as binding.

  **This disanalogy shows why UDT isn't *just* about self-binding:** It's about correctly handling evidence that isn't "neutrally informative" but is *generated by* or *logically entangled with* your own decision procedure or identity. This is the core innovation.

  ### Recommendations for Your Dissertation
  1. **Retract Step (6):** Acknowledge that *some* forms of acting against local myopic rationality are essential for strategic rationality. Refine the target: "UDT demands acting against local myopic rationality *even in cases where the evidence isn't causally or indexically entangled with the act, and where updating is straightforward*" (e.g., the *anticipated* technician case). But note: UDT advocates would deny such cases exist *within their intended domain*.
  2. **Refine the Target:** UDT's vulnerability is primarily:
      - Handling truly *unanticipated* evidence (shared weakness).
      - Justifying "no re-optimization" in non-entangled cases *if they exist*. (But argue they don't, within UDT's scope).
  3. **Salvage Your Insight:** Your argument highlights that UDT's strength (handling entanglement) relies on a *restricted domain of application*. Its rationality claim depends on evidence being "policy-relevant" in a specific way. Explore this boundary! When *does* evidence become "just information" vs. "entangled indexical data"? This is philosophically rich.
  4. **Keep One-Boxing:** Rejecting (6) doesn't force you to abandon UDT in Newcomb. Argue that *at the node*, "one-box" is:
      - The output of the strategically optimal policy.
      - Rationally mandated *because* "updating" would destroy the acausal correlation justifying the policy.
      - *Not* acting against "your own current assessment" *if you accept the UDT meta-principle* that node beliefs can be distorted by entanglement.

  **In essence: UDT doesn't make you ignore *all* evidence; it provides a specific (and controversial) rule for *which* evidence should update your *act* vs. being handled by the *policy structure*. Your argument shows this rule is contestable outside entanglement cases, but Mira is right that (6) is the weak link.** Focus the dissertation on defining that boundary. Good luck!
