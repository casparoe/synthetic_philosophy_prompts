prompt: |-
  I run localisation engineering at a mid-sized software company, and my days are spent among locale identifiers and BCP 47 tags, resource bundles and fallback chains, CLDR plural categories and script subtags, translation memory with fuzzy-match thresholds, glossaries and style guides, string freezes ahead of a release train, pseudo-localisation to catch hard-coded text, and post-edited machine translation for the long tail of our markets. What started this is a small thing. Marketing asked us to split a single pan-regional locale into five country variants on the grounds that customers perceive a national difference even where the text is nearly identical; once the split was done, the translation memory back-filled each new variant from the same source segments, and we ended up with five variants that were something like ninety-four per cent identical to one another, while everyone in the review meeting insisted the differences were the ones that mattered and that the new variants somehow felt older than they were. It struck me afterwards that this is precisely what Hobsbawm and Anderson claim nations do, and that I may have been watching an invented tradition get assembled out of a style guide, a match-percentage report and a terminology base.

  I read both authors seriously enough as an undergraduate to know the shape of the argument, but my working instincts have since been thoroughly colonised by the machinery above, and I now suspect that the debate about how old nations are can be restated in that machinery with disconcerting ease. I would like you to attempt the restatement as faithfully as you can, and then tell me where it fails. Please take, at minimum: Hobsbawm's distinction between tradition, which is invariant and ritual, and custom, which is a motor of change and is easily confused with it — and map it onto the style guide, the glossary, and translation memory, asking which of my artefacts is invariant and which merely accumulates precedent until new text sounds inherited; Anderson's account of print capitalism, of vernaculars being fixed into unified fields of exchange and communication, of certain dialects being promoted because they sat closer to the print-language, and of the administrative circuits along which creole functionaries and newspaper readers learned who their peers were — mapped onto the base locale and its fallback chain, onto externalisation and string ownership, and onto the console and release channel as the pilgrimage route by which a distributed population discovers its own boundaries; the retirement of one language tag for a pluricentric language in favour of separate tags for each of its standard varieties, as with Serbo-Croatian giving way to Serbian, Croatian, Bosnian and Montenegrin, mapped onto a standards body ratifying nations that its own registry helped to constitute; and then Smith's ethnosymbolist reply — that nationalism is modern while nations are not, because an ethnie supplies a named population, myths, memories, symbols and values that the modernisers can rearrange but not conjure — rendered as the untranslatable residue sitting in a legacy corpus of idioms, proverbs and local forms, which any pipeline can standardise and promote but cannot originate.

  Then give me the part I actually care about: the residue report, item by item. Which of these translations is faithful, which had to be bent or padded to fit, and which cannot be expressed in my vocabulary at all? I expect Anderson on simultaneity and on homogeneous, empty time to be the first casualty, since a release train is a schedule and not a shared present, but I want to know whether there is more, and in particular whether the nation's being imagined as both limited and sovereign — finite against other nations, and self-legitimating rather than ordained from above — has any counterpart whatsoever in a system whose variants are defined by inheritance from a source. Finally, tell me which way the residue cuts. Does it show that localisation engineering lacks the concepts needed to see what it is doing, that my vocabulary has no term for the experience of belonging to a community and only terms for delivering strings to it? Or does it show that Anderson and Smith are describing the same pipeline and merely disagreeing about whether the corpus was there before the tooling arrived, which would make their disagreement considerably less deep than it sounds? I would also like you to flag any place where the mapping is suspiciously smooth, since a translation that costs nothing is usually smuggling something in. Please write in British English, and do not trouble yourself with a bibliography or a reading list; I want the analysis, not the references.
reasoning: |-
  Okay, let me approach this systematically. The user presents a fascinating challenge: mapping theories of nationalism onto localization engineering practices. Their core observation is that splitting a pan-regional locale into country variants mirrors how nations invent traditions through standardization processes. 

  First, I need to unpack their technical landscape: BCP 47 tags, fallback chains, TM leverage - these form the operational machinery. Then the theoretical anchors: Hobsbawm's tradition/custom dichotomy, Anderson's print capitalism, Smith's ethnosymbolism. The user specifically wants to see where these theories map cleanly versus where the analogy breaks.

  For Hobsbawm: The style guide functions like "invented tradition" - rigid and ritualized. But translation memory behaves as "custom", accumulating organic changes until new translations feel inherited. This mapping seems robust until we consider glossary updates - sometimes they're top-down mandates (tradition), sometimes bottom-up adaptations (custom). The boundary blurs.

  Anderson's print capitalism finds eerie parallels: The base locale is the "print-language" standard, fallback chains mirror administrative circuits that define linguistic boundaries. But the release schedule breaks Anderson's "simultaneity" - it's staggered deployment, not shared temporal experience. More critically, our system lacks sovereignty: variants inherit from the source, never truly self-determine.

  Smith's ethnosymbolism translates to untranslatables: idioms and proverbs in legacy content that resist standardization. But our pipeline can't replicate how an ethnie's symbols emerge organically - we can only curate, not create. The residue report shows this starkly: 

  - Faithful: National variants as "limited" (finite tags)  
  - Bent: "Sovereign" (inheritance undermines self-legislation)  
  - Untranslatable: The lived experience of belonging  

  The residue cuts both ways: Our tooling lacks concepts for communal belonging, but theorists also underestimate how technical infrastructures actively constitute cultural boundaries. When the mapping feels too smooth - like Anderson's print networks matching release channels - we're smuggling in unexamined assumptions about agency. The creole functionaries chose their linguistic community; our users merely receive configured bundles.

  Ultimately, the deepest gap is sovereignty. Nations claim self-creation; locales always answer to a source. That missing autonomy haunts the entire analogy.
answer: |-
  Your machinery provides an uncanny lens through which to refract these theories—one that reveals both startling parallels and irreducible residues. Let’s proceed systematically.  

  ### I. Mapping the Theories onto Localisation Machinery  
  **A. Hobsbawm: Tradition vs. Custom**  
  - **Tradition (invariant, ritual)** → **Style Guide + Glossary**  
    Your style guide enforces invariance: capitalization rules, prohibited terms, enforced consistency (e.g., "colour" in en-GB). It’s ritualistic—violations trigger rejection, not debate. The glossary acts as canon, freezing terms ("router" ≠ "modem") against drift.  
  - **Custom (adaptive, precedent-driven)** → **Translation Memory (TM) + Fallback Chains**  
    TM accumulates "custom": fuzzy matches accept minor variations (e.g., "log in" vs. "sign in") as valid precedent. Fallback chains (en-AU → en-GB → en) embody adaptive change, allowing regionalisms to emerge organically *until* they harden into new "traditions" (e.g., en-AU adopting "footpath" from legacy en-GB matches).  
  *Where it fails*: Hobsbawm sees custom as a *folk* process, but your TM is algorithmic. Precedents are weighted by match percentages, not communal legitimacy.  

  **B. Anderson: Print Capitalism & Imagined Communities**  
  - **Vernacular Standardisation** → **Base Locale (en-US) & Fallback Chains**  
    en-US is your "print-language": the privileged dialect anchoring all variants. Fallback chains (es-MX → es-ES → en-US) replicate administrative circuits, defining linguistic hierarchies (Mexican Spanish inherits from European Spanish).  
  - **Simultaneity & Pilgrimage** → **Release Trains & Console Pipelines**  
    Release trains create "homogeneous, empty time": all locales deploy on schedule, simulating shared participation. The console (where translators review strings) acts as the "pilgrimage site"—a distributed workforce discovers peer variants ("Ah, de-CH uses ‘Sie’ not ‘Du’").  
  - **Creole Functionaries** → **Localisation Engineers & Reviewers**  
    Your team, like Anderson’s colonial clerks, maintains the infrastructure that binds variants into "communities" (e.g., enforcing de-AT’s separation from de-DE).  
  *Where it fails*: Anderson’s "simultaneity" assumes a *cultural* shared present. Your release train is technical synchrony—users experience updates asynchronously. The "nation" is imagined as sovereign, but your variants are **client-states of the source locale**; they inherit, never self-legislate.  

  **C. Smith: Ethnosymbolism & Untranslatable Residue**  
  - **Pre-Modern Ethnie** → **Legacy Corpora & Untranslatables**  
    Idioms ("raining cats and dogs"), historical terms ("Crown"), or culturally embedded symbols (religious references) form your "ethnie." They resist TM leverage (low match scores) and require manual intervention.  
  - **Rearrangement, Not Creation** → **Pipeline Standardisation**  
    Your tooling can standardise ("Crown" → "Government" in republics) or promote dialectal forms (pt-BR "mouse" → "rato" not "dispositivo apontador"), but cannot generate *new* cultural symbols—only curate legacy fragments.  
  *Where it fails*: Smith’s ethnie implies organic continuity. Your "legacy" is often digital detritus—accidental, not ancestral.  

  **D. Standards Bodies as Nation-Constitutors**  
    The Serbo-Croatian split (sh-hr → sr, hr, bs, cnr) mirrors BCP 47’s ratification of political fragments. Your team’s locale-splitting for Marketing *is* this process: creating "Bosnians" by tagging variant spellings (hleba/hljeba) and enforcing glossary partitions. The standards body (like UN/ISO) sanctifies what engineers enact.  

  ---

  ### II. The Residue Report: What Your Machinery Cannot Capture  
  | Concept                  | Faithful? | Distortion/Residue                                                                 |  
  |--------------------------|-----------|-----------------------------------------------------------------------------------|  
  | **Sovereignty**          | ❌        | Variants inherit from source; no true autonomy. "National" tags are client-states. |  
  | **Limitedness**          | ✓         | Finite tags, explicit exclusions (e.g., es-ES excludes Latin American terms).     |  
  | **Simultaneity**         | ❌        | Release schedules ≠ lived cultural time. Deployments are staggered, not shared.  |  
  | **Self-Legitimation**    | ❌        | Locales derive authority from source code/PM decisions—never "the people."         |  
  | **Ethnie (Pre-Modern)**  | ⚠️        | Legacy strings provide fragments, but lack Smith’s "mythic depth." TM flattens history. |  
  | **Belonging**            | ❌        | No equivalent for *affective* allegiance. Pipelines deliver strings, not identity. |  

  ### III. Where the Residue Cuts  
  **A. Your Vocabulary’s Blind Spots**  
  The machinery lacks terms for:  
  - **Sovereignty**: Inheritance chains preclude self-determination.  
  - **Affective Community**: Belonging is reduced to string delivery.  
  - **Temporal Depth**: Legacy content is "data," not lived memory.  

  **B. Theorists’ Blind Spots**  
  Anderson and Smith describe processes your pipeline *technically* replicates—but miss that:  
  - **Tooling Constitutes Reality**: Splitting locales *creates* perceived difference (like Marketing’s "94% identical" variants). The "nation" emerges from the registry.  
  - **Corpus ≠ Ethnie**: Smith’s "pre-modern symbols" in your system are just low-match segments—decontextualized and fungible.  

  **C. Suspiciously Smooth Mappings**  
  - **Fallback Chains as Administrative Circuits**: Too elegant. Anderson’s circuits fostered *consciousness*; your chains are error-handling protocols.  
  - **TM as Custom**: Hobsbawm’s custom is agentive; TM is algorithmic accretion. The "motor of change" lacks a driver.  

  ---

  ### IV. Conclusion: The Nature of the Residue  
  The untranslatable core is **sovereignty and affect**. Your system mimics the *form* of nation-creation (tags, boundaries, standards) but cannot replicate:  
  1. **Self-authorisation**: Variants are governed by source-locale hegemony.  
  2. **Collective Imagination**: A release train schedules updates; it doesn’t foster solidarity.  

  This suggests Anderson and Smith *are* describing your pipeline—but their debate hinges on a fiction: that "nations" or "ethnies" exist prior to the bureaucratic/technical act that demarcates them. Your work exposes both theories as meta-localisation: efforts to tag the untaggable residue of belonging. The machinery doesn’t fail to capture their ideas; it *reveals* those ideas as procedural myths, assembled from style guides and match percentages. When Marketing insists variants "feel older," they’re not wrong—they’re experiencing the invented tradition your system just compiled.
