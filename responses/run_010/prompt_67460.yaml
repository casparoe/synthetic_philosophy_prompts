  ### 5. Unoccupied Cells (Total: 192 words)  
  1. **Q1=a, Q2=c, Q3=a, Q4=b, Q6=a, Q7=a, Q8=a, Q10=c** (Complainant participated in the same incident long ago, which was resolved; current complaint is about worse conduct; complainant is clean otherwise). *Diagnosis: Unattractive*—hard to justify why a reformed participant can’t raise graver issues.  
  2. **Q1=b, Q4=b, Q5=c, Q6=c, Q7=b, Q8=a, Q10=b** (No similar conduct by complainant; complaint targets private views; complainant rarely seems retaliatory). *Diagnosis: Incoherent*—can’t assess "severity" (Q6) without comparable past actions.  
  3. **Q1=c, Q2=a, Q3=c, Q4=a, Q6=b, Q7=a, Q8=b, Q9=b, Q10=a** (Complainant did similar things more recently and unresolved; institution complains without self-implication; complainant often retaliates). *Diagnosis: Unexplored*—no leaf balances institutional legitimacy with individual vendetta.  

  ### 6. What This Instrument Cannot Separate (Total: 148 words)  
  **Leaves 1 (Minor Misstep Focus) and 5 (Personal Grudge)** cannot be distinguished. Both rely on Q10 (reputation) but lack a probe about the *current complaint’s gravity*. A further question—"How much harm did the alleged conduct cause?"—would help, but it breaks the constraint: it implies "blame" and requires subjective "gravity" assessment, which the instrument avoids by design. Without it, minor gripes and major grievances with ill intent appear identical.  

  ### 7. Two Worked Runs (Total: 246 words)  
  **Vignette 5 (Institute complaint):**  
  - Q1: (a) → Q2: (c) → Q3: (c) → Q4: (a) → *Skip Q5* → Q6: (c) → Q7: (a) → Q8: (b) → Q9: (a) → **Leaf 7 (Institutional Blind Spot)**.  
  *Result: Satisfying*. The panel confronts the awkwardness: Neuro Institute’s members were complicit, so the objection ("you enabled this") is valid.  

  **Vignette 3 (Years-ago sanctioned):**  
  - Q1: (c) → Q2: (b) → Q3: (a) → Q4: (b) → Q5: (a) → Q6: (c) → Q7: (a) → Q8: (a) → Q10: (c) → **Leaf 2 (Past Closed)**.  
  *Result: Satisfying*. Flynn’s sanctioned past is acknowledged and old; the panel must accept that they can challenge Knox’s similar conduct despite their history.
