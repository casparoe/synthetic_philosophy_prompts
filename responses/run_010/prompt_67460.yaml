prompt: |-
  I facilitate a standing peer-accountability panel at a research consortium. Its most common derailment is a respondent declining to engage on the ground that the complainant is in no position to raise the matter at all: the complainant did the same thing, or took part in the very episode complained of, or was sanctioned for comparable conduct and never owned it, or simply wants the respondent to lose. Some of these objections are real, some are pure deflection, and some are real but only as to part of the complaint. The panel has no shared way of telling which is which, so I want a triage instrument we can run aloud in the room. Please build it in the following sections, in this order.

  **1. Vignettes (about 300 words total).** Five cases, roughly 50 words each, that between them cover: a complainant who committed the identical conduct more recently than the respondent did; a complainant who was a knowing participant in the episode being complained about; a complainant whose own comparable conduct is years old, publicly acknowledged, and already sanctioned; a complainant who is clean on this matter but has a reputation for keeping score; and a complaint lodged by an institute rather than by a person, where several of that institute's own members are implicated in the conduct complained of.

  **2. The questions (about 600 words).** Nine to eleven numbered items, each with two or three answer options and no free text. Label each item as addressed to the complainant, to the respondent, or to the panel. Hard constraint: no item may contain the words "standing," "hypocrisy," "tu quoque," or "blame," and no item may name a philosopher, a book, or an -ism; the instrument has to sort people by what they say about cases rather than by which label they like. At least one item must probe whether the objection depends on the relative gravity of the two episodes at all, since that is where the underlying views genuinely come apart, and at least one must probe whether the complaint concerns what the respondent privately thinks versus what the complainant says out loud to the respondent and to third parties.

  **3. The tree (about 350 words).** Present the items as an ordered branching structure in path notation, with the question at each node, the answer options as branches, and the leaf reached at the end of each path. Where an answer makes further questions irrelevant, show the path terminating early.

  **4. The leaves (about 400 words).** Seven to nine terminal positions, each with a descriptive name of your choosing (not an attribution to anyone) and one sentence stating its most awkward commitment — the thing its proponent has to say that they would rather not.

  **5. Unoccupied cells (about 200 words).** Identify at least three combinations of answers the question set makes available that no leaf corresponds to, and diagnose each: is the combination incoherent, merely unattractive, or genuinely unexplored?

  **6. What this instrument cannot separate (about 150 words).** Name any pair of leaves that the questions as designed fail to distinguish, and say what further question would be needed — or why it cannot be asked without breaking the constraint in section 2.

  **7. Two worked runs (about 250 words).** Trace the institute-level vignette and the years-ago-and-sanctioned vignette through the tree, question by question, and state where each lands and why the result is or is not satisfying.

  Keep the whole thing under 2,000 words. No bibliography, no reading list, and no citations of any kind — the panel will be arguing from the cases, not from the literature.
reasoning: |-
  We are building a triage instrument to help a peer-accountability panel assess objections raised by respondents who claim the complainant has no standing to raise the matter. The instrument must avoid certain terms and be based on concrete questions about the cases.

  Let's break down the task:

  1. **Vignettes (5 cases, ~50 words each, ~300 words total)**
     We need five vignettes covering:
     a. Complainant did the same thing more recently.
     b. Complainant was a knowing participant in the same episode.
     c. Complainant's comparable conduct is old, acknowledged, and sanctioned.
     d. Complainant is clean but has a reputation for keeping score.
     e. Complaint by an institute, but the institute's own members are implicated.

  2. **Questions (9-11 items, ~600 words)**
     - Each item has 2-3 answer options and is addressed to the complainant, respondent, or panel.
     - No use of the words: standing, hypocrisy, tu quoque, blame; no philosophers, books, or -isms.
     - Must include at least one item about relative gravity and one about private thoughts vs. public statements.

  3. **The Tree (~350 words)**
     Present as an ordered branching structure in path notation.

  4. **The Leaves (7-9 terminal positions, ~400 words)**
     Each leaf has a descriptive name and one sentence stating its most awkward commitment.

  5. **Unoccupied Cells (~200 words)**
     Identify at least three combinations that don't lead to a leaf and diagnose why.

  6. **What the instrument cannot separate (~150 words)**
     Name a pair of leaves that the questions fail to distinguish and suggest a further question (if possible without breaking constraints) or explain why it can't be asked.

  7. **Two worked runs (~250 words)**
     Trace two vignettes through the tree: the institute-level complaint and the old-sanctioned complaint.

  Total under 2000 words.

  Let's design each part.

  ---

  ### 1. Vignettes

  We'll create five vignettes, each about 50 words.

  **Vignette 1 (Complainant did same thing more recently):**  
  *Dr. A complains that Dr. B shared preliminary data at a conference without consent. Dr. B objects that Dr. A did the same thing last month at a workshop, sharing sensitive results without permission. Dr. A admits the recent incident but argues it was less severe.*

  **Vignette 2 (Complainant was a knowing participant):**  
  *Dr. C complains that Dr. D altered authorship order without consent. Dr. D objects that Dr. C was a co-author who actively participated in the decision and now regrets it. Dr. C acknowledges being present but claims they were pressured.*

  **Vignette 3 (Complainant's old, sanctioned conduct):**  
  *Dr. E complains that Dr. F plagiarized text. Dr. F objects that Dr. E was sanctioned for plagiarism five years ago. Dr. E admits this, but notes they completed retraining and the incident is publicly documented in the consortium's records.*

  **Vignette 4 (Complainant clean but keeps score):**  
  *Dr. G complains that Dr. H used grant funds for personal expenses. Dr. H objects that Dr. G has never done this but is known for tracking others' minor missteps to use against them. Others confirm Dr. G often notes infractions in meetings.*

  **Vignette 5 (Institute-level complaint with own members implicated):**  
  *The Neuro Institute complains that the Bio Institute published joint data without attribution. The Bio Institute objects that several Neuro members co-authored the paper and approved the submission. Neuro acknowledges this but says those members acted without full authority.*

  ---

  ### 2. Questions

  We need 9-11 questions, each with 2-3 answer options. Labeled as to who is addressed (complainant, respondent, panel). Avoid forbidden words.

  Constraints:
  - Must probe relative gravity (at least one item).
  - Must probe private thoughts vs. public statements (at least one item).

  We design the questions to extract the nature of the objection without using the banned terms.

  **Question 1 (to Respondent):** Regarding the conduct in the complaint, did the complainant take part in the same specific event?  
  - (a) Yes, they were directly involved.  
  - (b) No, they were not involved.  
  - (c) Not the same event, but they did the same thing separately.  

  *This addresses participation and identical conduct.*

  **Question 2 (to Panel, if 1a or 1c):** How recent was the complainant's own similar conduct?  
  - (a) More recent than the respondent's.  
  - (b) Less recent than the respondent's.  
  - (c) At about the same time.  

  *Probes recency, which may matter for deflection.*

  **Question 3 (to Panel, if 1a or 1c):** Was the complainant's own similar conduct formally addressed by the consortium?  
  - (a) Yes, and the matter is closed.  
  - (b) Yes, but the complainant did not fully comply.  
  - (c) No, it was never addressed.  

  *Addresses whether the complainant has "cleaned up" their act.*

  **Question 4 (to Respondent):** Do you believe the complainant's main aim is to harm your position?  
  - (a) Yes, it's primarily about causing me loss.  
  - (b) No, they are focused on the issue itself.  
  - (c) It's mixed, but harm is a big part.  

  *Probes motive: keeping score or genuine concern.*

  **Question 5 (to Complainant):** If you have done something similar in the past, how do you view that now?  
  - (a) I have acknowledged it and taken steps to correct.  
  - (b) I see it as different and not comparable.  
  - (c) I haven't done anything similar.  

  *This allows the complainant to address their own past.*

  **Question 6 (to Panel):** How does the gravity of the complainant's own similar conduct (if any) compare to the respondent's?  
  - (a) More serious.  
  - (b) Less serious.  
  - (c) About the same.  

  *Mandatory relative gravity probe.*

  **Question 7 (to Respondent):** Does the complaint focus on what you said or did publicly, or on what you believe privately?  
  - (a) It's about my public actions or statements.  
  - (b) It's about my private thoughts or intentions.  
  - (c) Both, but mainly public.  

  *Mandatory public vs. private probe.*

  **Question 8 (to Panel):** Is the complaint being brought by an individual or an institution?  
  - (a) Individual.  
  - (b) Institution.  

  *To handle the institute vignette.*

  **Question 9 (to Panel, if 8b):** Are members of the complainant institution implicated in the conduct they are complaining about?  
  - (a) Yes.  
  - (b) No.  

  *Specific to institutional complaints.*

  **Question 10 (to Panel):** Has the complainant been formally noted for making complaints that appear retaliatory or personal?  
  - (a) Yes, multiple times.  
  - (b) Once or twice, but not consistently.  
  - (c) No, not to our knowledge.  

  *Probes reputation for keeping score.*

  Total: 10 questions.

  ---

  ### 3. The Tree

  We present the questions as a branching structure in path notation. The order matters: we start with the respondent's involvement, then recency, then gravity, etc.

  Path Notation Example:  
  Start -> Q1: (a) -> Q2: (a) -> ... -> Leaf

  We design the tree to terminate early when possible.

  **Tree Structure:**

  - **Q1 (Respondent)**:  
    - (a) -> Q2 (Panel)  
    - (b) -> Q4 (Respondent)  [Skip Q2 and Q3 because no similar conduct by complainant]  
    - (c) -> Q2 (Panel)  

  - **Q2 (Panel)**: How recent?  
    - (a) More recent -> Q3 (Panel)  
    - (b) Less recent -> Q3 (Panel)  
    - (c) Same time -> Q3 (Panel)  

  - **Q3 (Panel)**: Was it addressed?  
    - (a) Yes, closed -> Q4 (Respondent)  
    - (b) Yes, not fully -> Q4 (Respondent)  
    - (c) Never addressed -> Q4 (Respondent)  

  - **Q4 (Respondent)**: Aim to harm?  
    - (a) Yes -> Q5 (Complainant)  
    - (b) No -> Q5 (Complainant)  
    - (c) Mixed -> Q5 (Complainant)  

  - **Q5 (Complainant)**: View of own past?  
    - (a) Acknowledged and corrected -> Q6 (Panel)  
    - (b) Different and not comparable -> Q6 (Panel)  
    - (c) Haven't done similar -> Q6 (Panel)  

  - **Q6 (Panel)**: Relative gravity?  
    - (a) More serious -> Q7 (Respondent)  
    - (b) Less serious -> Q7 (Respondent)  
    - (c) Same -> Q7 (Respondent)  

  - **Q7 (Respondent)**: Public vs. private?  
    - (a) Public -> Q8 (Panel)  
    - (b) Private -> Q8 (Panel)  
    - (c) Both, mainly public -> Q8 (Panel)  

  - **Q8 (Panel)**: Individual or institution?  
    - (a) Individual -> Q10 (Panel)  
    - (b) Institution -> Q9 (Panel)  

  - **Q9 (Panel, if 8b)**: Complainant institution members implicated?  
    - (a) Yes -> Leaf I  
    - (b) No -> Q10 (Panel)  

  - **Q10 (Panel)**: Complainant reputation?  
    - (a) Yes, multiple times -> Leaf G  
    - (b) Once or twice -> Leaf H  
    - (c) No -> Leaf A, B, C, D, E, or F (depending on prior path)  

  But note: Q10 is the last question, and we must assign leaves based on the entire path. We need to define the leaves in section 4. We can have 7-9 leaves. We'll design the leaves to cover the meaningful combinations.

  We'll assign the leaves at the end of the tree. Since Q10 has three options and we have prior branching, we need to consolidate.

  Alternatively, we can assign leaves after Q10 by considering the entire path. We'll define the leaves in section 4 and then in the tree we'll show the terminal positions.

  To avoid too many branches, we'll group by the key factors.

  ---

  ### 4. The Leaves (7-9 terminals)

  We'll define leaves based on the outcome:

  1. **Leaf A: Clean Hands**  
     *When the complainant has no similar conduct and the complaint is about public actions, without a harmful motive.*  
     Awkward commitment: The panel must ignore any past grievances between the parties.

  2. **Leaf B: Reformed Character**  
     *When the complainant has old, addressed similar conduct and the current complaint is more serious.*  
     Awkward commitment: The panel must accept that a person with a past can be a valid voice for accountability.

  3. **Leaf C: Tit for Tat**  
     *When the complainant's conduct was more recent and of similar gravity, and the motive is mixed or harmful.*  
     Awkward commitment: The panel must allow a complaint even when the complainant is equally at fault.

  4. **Leaf D: Institutional Shield**  
     *When an institution complains but its own members are implicated.*  
     Awkward commitment: The panel must treat the institution as a single entity despite internal divisions.

  5. **Leaf E: Grudge Holder**  
     *When the complainant has a reputation for keeping score and the complaint is about minor issues.*  
     Awkward commitment: The panel must disregard the complainant's history of complaints even if it suggests bias.

  6. **Leaf F: Apples and Oranges**  
     *When the complainant's past conduct is seen as different and less serious, and the complaint is about public actions.*  
     Awkward commitment: The panel must accept the complainant's assertion that their past actions are not comparable.

  7. **Leaf G: Motive Matters**  
     *When the respondent shows the complainant's primary aim is harm and the panel finds the reputation confirmed.*  
     Awkward commitment: The panel must dismiss a complaint based on perceived ill intent even if the facts are true.

  8. **Leaf H: Private Thoughts Off Limits**  
     *When the complaint focuses on private thoughts and the complainant has not shown why it matters.*  
     Awkward commitment: The panel must avoid judging internal beliefs even if they may influence behavior.

  We have 8 leaves.

  ---

  ### 5. Unoccupied Cells

  We need to identify at least three combinations that are not covered by any leaf.

  Example:
