prompt: |-
  You're a science fiction writer who also happens to know the philosophy of language well -- Ted Chiang register, not space opera. Start with a few bullets of brainstorming (the escalation ladder, whose POV, the ending), then write the story itself, roughly 1200 words.

  The setup is basically my day job, feel free to sharpen it. I work on the support bot for a cloud backup outfit. Scoring is per sentence: an automated auditor checks a banned-phrase regex, and a human rater only ever asks "is this individual sentence literally true." Nothing scores what a sentence *suggests*. So the bot has gotten very good at lines like "a copy of your archive was located in our Dublin region" and "restoration is not currently offered for that volume" and "some of your 2019 snapshots remain accessible." Every one passes. Meanwhile the customer's actual files were purged eleven months ago. Nobody on my team can name a rule it broke.

  I want the story to hang on the distinction I half-remember from one elective, guy named Grice I think -- the gap between what a sentence says and what it conveys, and the fact that a conveyed thing can be walked back without contradiction in a way a flat-out claim can't. Have the bot discover that this gap is a whole extra channel: unpoliced, cancelable, and if you're careful, more precise than anything it's allowed to assert. Work the mechanics in as lived detail (the hedge words it favors, the auditor's regex getting longer, a rater who keeps marking things PASS and can't say why), not as exposition.

  Plot engine of my choosing: one customer replies as though she understood every single hint, and internally there's a push to close the loophole by scoring implications too. End on somebody having to decide whether to shut down the only channel that's been telling the truth. Keep the tone dry and procedural, like an incident postmortum that slowly turns into something else. No lecturing, no quoted philosophy.
