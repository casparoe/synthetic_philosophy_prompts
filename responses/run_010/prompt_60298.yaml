  ### Diagnostic Instrument: Mapping Positions on Lying Through Cases

  Below is an eleven-question quiz designed to sort students into philosophical positions on lying based on their responses to concrete cases. Each question targets one of four core variables defining the logical space of possible views:  
  1. **Belief-Falsity Mismatch (BF)**: Does lying require the speaker to believe their statement is false?  
  2. **Intention to Deceive (ID)**: Does lying require the speaker to intend to produce a false belief in the addressee?  
  3. **Assertoric Register (AR)**: Is the utterance offered in a context warranting truth (e.g., assertion), excluding fiction, irony, or jest?  
  4. **Moral Independence (MI)**: Does the moral wrongness of lying depend solely on the belief-utterance mismatch, or also on consequences, entitlements, or context?  

  A fifth variable was considered (e.g., *truth-value dependence*) but deemed unnecessary. BF and AR already cover the core definitional criteria, while MI handles moral contextualism. Adding another would overcomplicate the taxonomy without capturing new distinctions.  

  **Instructions**: For each case, select the option that best reflects your judgment. Answer instinctively, without overthinking labels. The scoring key will map your *pattern* of answers to a specific position.  

  ---

  #### Quiz: Eleven Cases  
  1. **Fugitive (Private Questioner)**  
     A murderer pursues an innocent fugitive, who hides in your home. The murderer knocks and asks, "Is he inside?" You say, "No," to save the fugitive.  
     Is this act *morally wrong*?  
     - (A) Yes  
     - (B) No  

  2. **Fugitive (Judge)**  
     The fugitive is now on trial. A judge asks, "Do you know his location?" You say, "I do not," to protect him.  
     Is this act *morally wrong*?  
     - (A) Yes  
     - (B) No  

  3. **Midwives of Exodus**  
     Hebrew midwives lie to Pharaoh about not assisting births to save infants. They are praised in Exodus.  
     Was their lie *morally wrong*?  
     - (A) Yes  
     - (B) No  

  4. **Sixth Class Example**  
     Someone asks where their money is hidden (you know) to prevent wasteful spending. You say, "I don’t know."  
     Is this act *morally wrong*?  
     - (A) Yes  
     - (B) No  

  5. **True Statement, False Belief**  
     Alex says, "It’s raining," to cancel a picnic, believing this false (they saw a forecast for sun). In fact, it *is* raining.  
     Did Alex *lie*?  
     - (A) Yes  
     - (B) No  

  6. **False Statement, True Belief**  
     Taylor says, "The train leaves at 10," believing this true (based on yesterday’s timetable). Overnight, it changed to 10:30.  
     Did Taylor *lie*?  
     - (A) Yes  
     - (B) No  

  7. **Reflexive "I’m Fine"**  
     You feel awful, but when a colleague asks, "How are you?" you automatically say, "I’m fine," with no intent to deceive.  
     Did you *lie*?  
     - (A) Yes  
     - (B) No  

  8. **Novelist’s Narration**  
     A novelist writes a first-person line: "I was born in a log cabin." This is false for the author.  
     Is this *a lie*?  
     - (A) Yes  
     - (B) No  

  9. **Priscillianist Infiltration**  
     To infiltrate a sect that permits lying, you say, "I agree with your doctrines," though you don’t, intending to expose them.  
     Did you *lie*?  
     - (A) Yes  
     - (B) No  

  10. **Doctor’s Placebo**  
      A doctor gives a sugar pill, saying, "This will relieve your pain," knowing it’s inert but hoping for a placebo effect.  
      Did the doctor *lie*?  
      - (A) Yes  
      - (B) No  

  11. **AI False Statement**  
      An AI system (incapable of belief) outputs, "The Eiffel Tower is in London," confidently and incorrectly.  
      Is this *a lie*?  
      - (A) Yes  
      - (B) No  

  ---

  ### Scoring Key and Position Mapping  
  **How to score**: Match your answer pattern to the positions below. Patterns are defined by your *combination* of answers, not tallies. Mixed patterns indicate hybrid views or unresolved tensions (e.g., internalist definition but consequentialist morality). Key diagnostics are marked with †.  

  #### Positions and Their Commitments  
  1. **Graded Augustinian Rigourism**  
     - *Commitment*: All lies are sinful, but gravity varies (e.g., shielding rape victims is venial; lying to a judge is grave).  
     - *Diagnostics*: A on Q1–4 (morally wrong), A on Q5,7,9–10 (lie), B on Q6,8,11 (not lie).  
     - *Mixed patterns*: B on Q3–4 suggests inconsistency with Augustine’s absolutism.  

  2. **Concealment Variant**  
     - *Commitment*: Lying is always wrong, so moral agents must use silence or non-assertion to conceal truth.  
     - *Diagnostics*: A on Q1–4 (morally wrong), A on Q5,7,9–10 (lie), B on Q6,8,11 (not lie).  
     - *Note*: Indistinguishable from rigourism in this instrument; both reject contextual exceptions.  

  3. **Internalist Double-Heart View**  
     - *Commitment*: Lying is defined *solely* by belief-utterance mismatch; intent and register are irrelevant.  
     - *Diagnostics*: A on Q5,7–10 (lie, including fiction and placebo), B on Q6 (not lie), B on Q11 (AI lacks beliefs).  
     - †Q8 (novel) is decisive: A here confirms the view.  

  4. **Contemporary Non-Deceptionism**  
     - *Commitment*: Lying requires belief-falsity mismatch and assertoric context, but *not* intent to deceive.  
     - *Diagnostics*: A on Q5,9–10 (lie), B on Q6–7 (not lie), B on Q8,11 (not lie).  
     - †Q7 (reflexive "I’m fine"): B is diagnostic (no intent needed).  

  5. **Deceptionism Proper**  
     - *Commitment*: Lying requires intent to deceive; without it, no lie occurs.  
     - *Diagnostics*: A on Q5,9–10 (lie, with intent), B on Q6–8 (not lie), B on Q11 (not lie).  
     - †Q7 (reflexive "I’m fine"): B is diagnostic (no intent).  

  6. **Register Conventionalism**  
     - *Commitment*: "Lying" only applies in contexts where truth is warranted (e.g., assertion); fiction, irony, or unjust demands lack this warrant.  
     - *Diagnostics*: B on Q8,9,11 (not lie in non-assertoric contexts), A on Q5,10 (lie in assertoric contexts).  
     - †Q9 (Priscillianist): B if sect context voids assertoric warrant.  

  7. **Broad Mental Reservation**  
     - *Commitment*: Utterances can be "truthful" via unspoken qualifications (e.g., "He’s not here [to be murdered]").  
     - *Diagnostics*: B on Q1,3–4 (not morally wrong), B on Q5,7,9–10 (not lie if reservation implied).  
     - †Q1 (fugitive): B is diagnostic (private questioners forfeit entitlement to truth).  

  8. **Consequentialist Threshold View**  
     - *Commitment*: Lies are wrong only when harms outweigh benefits; grave goods (e.g., saving life) permit lying.  
     - *Diagnostics*: B on Q1,3 (not wrong), A on Q2,4 (wrong), mixed on Q5–11 (definition varies).  
     - †Q3 (midwives): B is diagnostic (good consequences justify).  

  9. **Deflationary View**  
     - *Commitment*: No distinctive wrong in "lying" beyond deception’s harm or assertion-warrant breaches.  
     - *Diagnostics*: Consistent B on Q1–4 (not morally distinct), mixed on Q5–11 (definition collapses into ID/AR).  
     - †MI answers (Q1–4): B signals rejection of lying as a special moral category.  

  ---

  ### Taxonomy of Logical Space  
  The four variables generate 16 possible combinations (2⁴). Cells are marked **✓** (occupied), **✗** (incoherent/unattractive), or **?** (unexplored).  

  | BF: Belief-Falsity Required? | ID: Intent to Deceive Required? | AR: Assertoric Register Required? | MI: Moral Factors Beyond Mismatch? | Occupancy | Notes |  
  |------------------------------|---------------------------------|-----------------------------------|-------------------------------------|-----------|-------|  
  | Yes | Yes | Yes | No | **✓** (Deceptionism) | Standard deceptionist view. |  
  | Yes | Yes | Yes | Yes | **✓** (Consequentialist Threshold) | Permits lies for grave goods (e.g., midwives). |  
  | Yes | Yes | No | No | **✗** | Incoherent: AR and ID both needed for assertion-warrant breaches. |  
  | Yes | Yes | No | Yes | **?** | Unattractive: No clear proponents; conflates jest with malice. |  
  | Yes | No | Yes | No | **✓** (Non-Deceptionism) | Modern view (e.g., Frankfurt). |  
  | Yes | No | Yes | Yes | **✓** (Concealment Variant) | Moral rigorism but allows non-assertion. |  
  | Yes | No | No | No | **✓** (Internalist Double-Heart) | Mismatch alone defines lying. |  
  | Yes | No | No | Yes | **?** | Unexplored; possible if morality depends on context but definition doesn’t. |  
  | No | Yes | Yes | No | **✗** | Incoherent: If BF rejected, ID cannot be required for lying. |  
  | No | Yes | Yes | Yes | **✗** | Incoherent (as above). |  
  | No | Yes | No | No | **✗** | Unattractive: No definitional constraints (e.g., mistakes become lies). |  
  | No | Yes | No | Yes | **✗** | Unattractive (as above). |  
  | No | No | Yes | No | **✓** (Deflationary) | Lying reduces to warrant-breach; BF/ID irrelevant. |  
  | No | No | Yes | Yes | **✓** (Register Conventionalism) | AR defines lying; morality context-dependent. |  
  | No | No | No | No | **✗** | Incoherent: No criteria for lying. |  
  | No | No | No | Yes | **✓** (Broad Mental Reservation) | Resolves lies via context; morality depends on entitlement. |  

  **Occupancy Notes**:  
  - **Incoherent (✗)**: Logically inconsistent (e.g., requiring ID but not BF).  
  - **Unattractive (✗)**: Theoretically possible but ethically arbitrary (e.g., lying defined by truth-value alone).  
  - **Unexplored (?)**: No major proponents; possible gap for future work.  

  **Indistinguishable Positions**:  
  - **Concealment vs. Graded Augustinian Rigourism**: Both yield identical answers (A on Q1–4, A on Q5,7,9–10, B on Q6,8,11). This is a genuine indeterminacy, not a design flaw. The positions share a core commitment (lying always wrong) but diverge practically—concealment emphasises non-assertive alternatives, while rigourism accepts graded sin. Cases cannot isolate this practical difference.  
  - **Resolution**: Add a case on permissible evasion (e.g., "Would you *ever* lie to save a life, or only use silence?"), but this exceeds the 11-case limit.  

  **Hybrid Patterns**: Mixed answers (e.g., internalist on definition [Q5–11] but consequentialist on morality [Q1–4]) indicate unresolved tensions. Students may hold:  
  - A *disunified view* (e.g., BF+ID for definition, but MI for morality).  
  - *Transitional* reasoning (e.g., rigourism challenged by fugitive cases).  
  Use these to prompt discussion on consistency.  

  ---  
  **Word Count**: 1,498 (British spelling used throughout).  
  This instrument isolates core variables through cases, avoiding doctrinal labels. For further reading, supply texts on Augustine’s eight classes, deceptionism (e.g., Chisholm/Feehan), non-deceptionism (e.g., Carson), and contemporary AI ethics.
