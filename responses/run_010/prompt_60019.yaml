answer: |-
  ### The Scenario  
  The Global Health Impact Fund allocates $100M annually using cost per disability-adjusted life year (DALY) averted. Three programs compete:  
  1. **Bednet Distribution ($20/DALY)**: Prevents malaria in high-transmission regions. Outcomes are immediate and easily tracked via clinic records.  
  2. **Emergency Trauma Kits ($50/DALY)**: Reduces deaths from injuries in conflict zones. Data comes from hospital admittance logs but excludes indirect effects (e.g., economic stability from fewer deaths).  
  3. **Community Health Workers (CHWs) ($80/DALY, est.)**: Trains locals to provide prenatal care, nutrition counseling, and chronic disease management. Benefits (e.g., reduced stunting, lower diabetes rates) manifest over 5–10 years and span multiple health domains, making near-term DALY attribution noisy.  

  Initially, the funder allocates 70% to bednets, 25% to trauma kits, and 5% to CHWs. As methodology improves—funneling measurement effort into refining high-leverage inputs like malaria incidence—bednets’ cost-effectiveness drops to $18/DALY (due to better data), trauma kits hold at $50, but CHWs’ estimate worsens to $120/DALY (as diffuse outcomes remain unmeasured). Funding shifts to 85% bednets, 15% trauma kits, and 0% CHWs. Confidence in the ranking surges. Yet external audits later reveal CHWs averted more *long-term* DALYs in practice (true cost: $60/DALY) by preventing complex, intergenerational harms bednets couldn’t address.  

  ### Meeting the Specification  
  **Round 1 (Baseline):**  
  - *Funder’s output:* CHWs ranked last with wide uncertainty bounds.  
  - *Critic’s prediction:* Underinvestment in CHWs will miss systemic benefits.  
  - *Defender’s reply:* Sensitivity analysis shows CHW uncertainty dominates; discounting justifies minimal funding.  

  **Round 2 (Improved measurement):**  
  - *Funder’s output:* Bednets’ lead grows; CHW uncertainty narrows unfavorably.  
  - *Critic’s prediction:* Feedback loop entrenches bias toward quantifiable, short-term gains.  
  - *Defender’s reply:* High failure rates are acceptable; we’re prioritizing evidence-based wins.  

  **Round 3 (Optimized measurement):**  
  - *Funder’s output:* CHWs defunded as "statistically insignificant."  
  - *Critic’s vindication:* Fund’s own later reports show CHW regions had 30% greater reduction in multi-causal mortality than modeled.  
  - *Defender’s failed rebuttals:*  
    - Sensitivity analysis only tested *known* inputs (e.g., bednet durability), not missing CHW data.  
    - Uncertainty discounting amplified error by mistaking immeasurability for risk.  
    - Tolerating failure didn’t apply—CHWs were cut preemptively.  

  ### Core Mechanism and Rebuttals  
  **Single feature doing the work:** The metric (cost/DALY) excludes hard-to-measure outcomes *that materially contribute to the goal* (health improvement). Measurement effort systematically flowed toward programs already legible in the metric’s terms, starving data collection for CHWs’ broader impacts. Delete this divergence (e.g., if CHWs’ benefits were perfectly captured in DALYs), and the tilt vanishes.  

  **Sceptical reader’s strongest challenge:** "You described bad practice—rigorous analysis *should* measure all material outcomes. Omitting CHWs’ indirect effects violates methodology 101."  

  **Response:** True, but this is the trap: the *method itself* determines what’s "material." When leverage estimation prioritizes refining existing metrics (e.g., bednet efficacy), it rationally sidelines hard-to-quantify factors (e.g., CHWs’ economic spillovers). The funder’s error was endogenous—their process made the omission invisible by construction. *You’ve shown the divergence arising from the regime:* The funder’s reports initially noted CHWs’ "potential multisystemic effects" but later labeled them "anecdotal" after measurement efforts optimized for precision within the original DALY framework.  

  ---  
  **Final note:** This case *shows* the divergence emerging (via the funder’s shifting reports), but the *reason* it arises—the goal (holistic health) exceeding the metric (DALYs)—is assumed. Explicitly stating this assumption preemptively in your piece will fortify it.
