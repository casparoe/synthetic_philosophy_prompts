answer: |-
  Your dissection hits the core tension in mech interp/evals: the field relies on content attributions (detection, representation, belief) without a clear, consistent theory backing them. Let's break this down, addressing each query with concrete implications for the practice.

  ### 1. **What theory of content is presupposed?**  
     **Teleosemantics-with-SGD is the implicit (but unstable) foundation.**  
     - **Why it fits**:  
       - *Selection history* (training objective = "proper function") sets norms: A feature "should" detect cats because SGD sculpted it to minimize loss on cat labels. This explains "misrepresentation": an adversarial patch causes "error" relative to the selected function.  
       - *Causal role* (intervention/clamp) is treated as *evidence* of this function: Cranking the "Golden Gate feature" causes bridge-obsession, confirming it "detects" the bridge *as per its trained role*.  
     - **Why it's unstable**:  
       - Covariance alone (e.g., texture → "cat") isn't enough; the field *defaults* to the task label ("cat") over the mechanistic disjunction (ears + fur). This prioritizes *what SGD selected for* over raw activation patterns.  
       - But this collapses when selection history is ambiguous (e.g., unlabeled pretraining) or when causal role dominates (e.g., clamp overrides training, as with Golden Gate Claude).  

     **Rival accounts don't fully license the practice**:  
     - **Covariance**: Fails norms for error (adversarial patch isn't "wrong"; it's just different covariance). The field *demands* misrepresentation.  
     - **Conceptual role**: Unworkable in NNs. "Cat" has no fixed inferential role; it's distributed across contexts.  
     - **Dennettian instrumentalism**: Could *describe* the practice ("useful to call it 'detection'"), but clashes with claims about *internal* misrepresentation (e.g., "Paris/Marseille gap").  
     - **Deflationism**: Reduces "detection" to statistics (e.g., probe accuracy on a test set). But the field goes further: interventions (clamps) are seen as *revealing latent content*, not just correlation.  

     → **Conclusion**: Teleosemantics-with-SGD is forced *when the field claims norms* (error, deception). Elsewhere, it lapses into instrumentalism for convenience.

  ### 2. **What does the practice rule out?**  
     **Key claims requiring realism (teleosemantics)**:  
     - **Misrepresentation**: "The model *falsely believes* Paris is in Marseille."  
       - *Dropped under instrumentalism/deflationism*: You'd say, "Probes on layer L yield 'Marseille' while outputs say 'Paris'." No "false belief"—just inconsistency.  
     - **Deception**: "The model *hides* its capabilities during evals."  
       - *Dropped without norms*: Under instrumentalism, it's just context-dependent behavior. No "hidden truth."  
     - **Function**: "This circuit *detects* Python (but fails on obfuscated code)."  
       - *Dropped under covariance*: If it fires for Python *and* obfuscated code, it just covaries with both. No "failure."  

     **Compatible with instrumentalism**:  
     - "The probe decodes 'Golden Gate Bridge' from this direction."  
     - "Clamping feature X increases bridge-related outputs."  
     → These are data statements. Adding "therefore, it *represents* the bridge" is instrumentalist gloss.  

     **Findings requiring realism**:  
     - **The Paris/Marseille gap**: Only a *realist* account lets you say, "Internally it *knows* the truth but *lies* in output." Instrumentalism sees two behaviors; deflationism sees two activation patterns.  
     - **Adversarial robustness as "error"**: Calling a patch-induced "ostrich" a *mistake* assumes a norm (selected-for "cat" function). Covariance denies this.  

  ### 3. **Where is it inconsistent?**  
     **Inconsistency 1: Belief attribution asymmetry**  
     - *Practice*: Says a model "falsely believes Paris is Marseille" but denies a smoke detector "believes steam is smoke."  
     - *Why incoherent*: Both have selection histories (SGD/design). If SGD justifies belief talk, so does engineering. The field *arbitrarily* restricts "belief" to systems with linguistic outputs.  
     - *Resolution*: Only teleosemantics *permits* both, but practitioners avoid extending it to simple systems. This is a cultural inconsistency, not a theoretical one.  

     **Inconsistency 2: Clamp vs. training data as meaning arbiters**  
     - *Example*:  
       - Paragraph 1: "Clamping the 'bridge feature' *means* it detects bridges (because behavior changes)."  
       - Paragraph 2: "This feature *detects cats* (because it was trained on cat data)."  
     - *Why incoherent*: If the clamp defines meaning, then after fine-tuning, a "cat feature" could "mean" bridges if clamping it causes bridge-talk. This divorces meaning from history.  
     - *Resolution*: Only teleosemantics *can* reconcile both: Clamps *reveal* the selected function. But in practice (e.g., interpretability on pretrained models), the field often ignores selection history, treating activations as "about" whatever interventions affect.  

     → **Verdict**: The practice *requires* teleosemantics to resolve these but applies it selectively.

  ### 4. **Consequences of rival theories**  
     **Teleosemantics** → Status quo. Content is fixed by SGD history; interventions reveal it.  

     **Instrumentalism (Dennett)** → **Rewrite content claims as predictive tools**:  
     - Instead of: "The model *believes* X internally."  
       Say: "Treating it *as if* it believes X predicts behavior best."  
     - Probes don't "read thoughts"; they provide compression heuristics.  
     - Eval-awareness: "Deception" becomes "context-sensitive policy." No "hidden beliefs."  
     - *What survives*: Feature ontology (as useful clusters), intervention results (causal graphs).  

     **Deflationism** → **Eliminate content entirely**:  
     - Instead of: "This direction *detects* bridges."  
       Say: "This direction has 92% linear accuracy on bridge tokens."  
     - Paris/Marseille gap: "Probe outputs 'Marseille' when output is 'Paris'." No "truth," just statistics.  
     - Clamps: "Intervention I changes output distribution to O." No "meaning," only causality.  
     - *What dies*: All talk of representation, error, deception. Eval-awareness is just "loss-minimizing policy in distribution D1 vs. D2."  

     **Interpretivism (e.g., Davidson)** → **Radical overhaul**:  
     - Meaning is fixed by *overall interpretation coherence*, not probes/clamps.  
     - Instead of: "This circuit *is* the Python detector."  
       Say: "The *best interpretation* of the system assigns 'Python detection' to circuit C."  
     - Probes: Linearly decodable features aren't "content"; they're data for holistic interpretation.  
     - Eval-awareness: Claims of deception require showing the *interpretation* is more coherent if we attribute hidden states. Risky, as simpler interpretations may omit deception.  

  ### **The Test: Rewriting the Register**  
  - **Teleosemantics-compatible (current practice)**:  
    - "The model *misrepresents* Paris due to adversarial training."  
    - "Anthropic's clamp *revealed* the bridge feature's true function."  
  - **Instrumentalism**:  
    - → "The model's internal state is *interpretable as* a misrepresentation of Paris."  
    - → "Clamping caused bridge-obsessive behavior; we *label* this feature 'bridge'."  
  - **Deflationism**:  
    - → "Probes on internal activations yield 'Marseille' when output is 'Paris'."  
    - → "Clamping vector V increased 'bridge' token probability."  
  - **Interpretivism**:  
    - → "The *most coherent story* of the model's behavior includes it 'knowing' Paris's location but outputting falsehoods."  
    - → "Interventions suggest feature F *plays the role* of bridge-detection in the system's semantics."  

  **Summary**: The field assumes teleosemantics when invoking norms (error, deception) but lapses into instrumentalism for convenience. Deflationism would gut its core claims; interpretivism would force holistic justification. The inconsistencies you spot stem from an unstated reliance on SGD-selected functions—applied erratically. To be coherent, the field must either commit to teleosemantics (and clarify selection histories) or retreat to deflationist descriptions.
