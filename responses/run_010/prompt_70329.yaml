prompt: |-
  I'm preparing a session on Tolstoy's *What Is Art?* and want to test how far his theory actually determines his verdicts. His track record, as I read it: Shakespeare is not art at all, despite the technical mastery; late Beethoven and Wagner's operas are the bad art of an idle class; *Uncle Tom's Cabin*, Dickens, Hugo's *Les Misérables*, and Dostoevsky's Siberian prison memoir are good art; village songs sung by illiterate peasants are good art; and he is willing to place much of his own fiction, *Anna Karenina* included, outside good art while keeping two of his short peasant tales.

  Now a case he never faced. A warehouse worker, unpaid and untrained, records an a cappella song about a colleague crushed by machinery: plain words, a melody a child can pick up after one hearing, distributed free. Within a year it is sung at funerals and picket lines on four continents, in dozens of languages, always by amateurs. Its final verse has the mourners swear to make the owners answer in kind, and crowds sing it as an act of defiance against the employers of one particular country.

  Predict his verdict. Lay out the candidate rules that fit the record above — infectiousness and sincerity; accessibility to the labouring many; the content criterion about feelings that unite rather than divide; his hostility to paid, professional art made for people who do not work — say which of them diverge on this song and why, and give your best guess with reasons, noting how the praise of *Uncle Tom's Cabin*, which is hardly free of indignation, bears on the content criterion. Then specify the altered version of this song that would most sharply separate the two leading candidates. Lead with your verdict in one sentence, and keep the whole answer under 600 words.
reasoning: |-
  Hmm, the user is testing Tolstoy's art theory against a hypothetical modern song scenario. They're clearly well-versed in Tolstoy's controversial judgments - Shakespeare rejection, peasant tales elevation, that radical self-critique of his own masterpieces. Smart framing with the worker's protest song case he never encountered. 

  The core tension they want explored: Can infectious sincerity (Uncle Tom precedent) override violent content ("answer in kind") under Tolstoy's rules? I notice they're particularly sharp on how indignation in Stowe's novel got a pass while Wagner didn't. Their warehouse worker case weaponizes accessibility - untrained creator, viral spread among laborers - against problematic content. Clever trap.

  Right, breaking this down. First pillar: infectiousness. The song's viral transmission across languages screams Tolstoy-approved contagion. Second pillar: accessibility. Amateur creation/distribution nails his anti-professionalism creed. Third pillar: unifying content. Here's the rub - the revenge vow could violate "feelings uniting mankind." But wait, Uncle Tom's Cabin had righteous anger too... Ah! Difference is Stowe channels outrage toward universal empathy, while "answer in kind" targets specific oppressors. Tolstoy's pacifism would recoil.

  Supporting evidence: His praise for Dostoevsky's prison memoir shows hardship narratives pass content tests if they foster compassion. But the call for retaliation? That's division, not brotherhood. Remember his dismissal of war epics? Same principle. Still, the peasant roots might sway him - he excused raw village songs others called crude.

  Best guess: Conditional rejection. He'd admire the sincere origins and transmission (hence not "not-art" like Shakespeare) but condemn the vengeful verse as bad art. Proof? His own revised peasant tales scrubbed violence. For the test case to split theories cleanly: imagine removing the revenge vow. If it became pure lament, he'd embrace it like those Siberian folk choruses he loved.

  Final note for user: Stress how Tolstoy's content criterion was stricter than modern readers assume. That "unite mankind" bar made even his Anna Karenina fail. This song's global reach satisfies infectiousness but not the demand for universal love.
answer: |-
  **Verdict:** Tolstoy would condemn this as *bad* art due to its vengeful content ("answer in kind"), despite praising its sincerity, infectiousness, accessibility, and origin.

  **Candidate Rules & Divergence:**
  1.  **Infectiousness/Sincerity:** Strongly met. Simple form, viral transmission, authentic origin suggest deep feeling transfer.
  2.  **Accessibility to Labouring Many:** Strongly met. Created/transmitted by workers, simple form, free distribution.
  3.  **Content: Feelings Uniting Mankind:** **DIVERGES.** The call for vengeance ("answer in kind") promotes division and hatred towards a specific class/nation, violating Tolstoy's core demand for art expressing universal Christian brotherly love and unity. *Uncle Tom's Cabin*'s righteous indignation against slavery *aimed* at unifying moral outrage against injustice itself, not inciting specific retaliation against individuals.
  4.  **Hostility to Paid/Professional Art:** Strongly met. Untrained creator, unpaid, amateur transmission.

  **Best Guess with Reasons:**
  Tolstoy would recognize the song's immense *infectiousness* and *sincerity*, placing it far above Beethoven/Wagner (bad art for elites) or Shakespeare (not-art). Its origin and accessibility align perfectly with his ideal (*Uncle Tom*, peasant songs). **However, the vengeful oath in the final verse is decisive.** For Tolstoy, art's highest purpose is fostering universal love and moral/spiritual unity. Calls for violent retribution ("answer in kind"), even against oppressors, embody the division and hatred he despised (reflected in his rejection of patriotic/militarist art). *Uncle Tom's Cabin*'s indignation served universal compassion; this song's specific call to violence undermines that unity. He would likely classify it as potent but morally corrupting "bad art" of the idle class's passions, despite its proletarian roots, due to this destructive emotional content.

  **Altered Version to Separate Candidates:**
  Remove the vengeful oath ("swear to make the owners answer in kind") and replace it with a verse expressing universal sorrow for the worker's death, a plea for safety reforms, or a vow of solidarity and peaceful resistance. **This version** would almost certainly be hailed by Tolstoy as "good art," satisfying *all* his criteria (infectiousness, sincerity, accessibility, unifying love/sorrow/solidarity). The removal isolates the content criterion as the decisive factor in the original verdict.
