prompt: |-
  Been keeping a spreadsheet of my own self-control failures for about two years now (grad student, mostly the dissertation and the gym), and the pattern that fell out isn't the one I expected. I'm not after a diagnosis of me — I want to know whether what I've described already has a name.

  Every Sunday I set the week: four writing blocks, four gym sessions. On Wednesday I skip one. But I dont experience that as caving, because by Wednesday the plan has already been revised — the deadline moved, my advidsor was slow with comments, I slept badly Monday and Tuesday, and anyway four blocks was badly calibrated and three is what a realistic week actually looks like. Once the plan says three, skipping the fourth isn't weakness, its compliance. Then Sunday rolls around and I set it back to four, because four is what I'd endorse on any given Sunday. Eleven downward revisions in two years, and every single one had a decent reason attached.

  Same shape elsewhere: I've meant to bump up my retirement contribution since I started the job, but each quarter there's a real reason to wait — the rent went up, I'm about to travel, let me first see whether the raise comes through — and each quarter I separately decide that this quarter was never the right one.

  So the structure is: the standard gets moved just before the action, and the move is locally defensible, so there's never a moment where I judge X better and do Y. Synchronically I've never been akratic once. Diachronically I'm a wreck. And it's not plain preference change either, since if you ask me on a random Wednesday whether four is the right target, I say yes.

  I know the standard line that weakness of will has to go against your own better judgment at the time of action, and I know the discounting models with naive versus sophisticated procrastinators — but naive agents there just fail to predict their future slip-ups, they don't re-legislate the target every week. Closest I've got from folk vocabulary is "rationalization" and "moving the goalposts," but both of those sound like moves you make to win an argument, not something you do to yourself that leaves your own bookkeeping genuinely clean.

  Does this have an established name or a literature? If not, coin one. But the label isn't the point — the carving is. Give me the three or four nearest existing concepts with one line each on exactly why mine isn't that, then your term with a real definition, then the edges: what counts as a case of it, and what's a nearby case that doesn't. Hard cap of 400 words for the whole thing; a tight list is fine, I don't need prose.
reasoning: |-
  Okay, the user has been tracking their self-control failures for two years and noticed a pattern where they consistently revise their goals downward just before they're supposed to act, with each revision feeling justified in the moment. They want to know if this behavior has an established name in psychology or behavioral science literature. 

  Hmm, this is fascinating. The user is clearly analytical - they're a grad student tracking data on themselves and have already ruled out standard explanations like weakness of will or preference change. Their description shows deep self-awareness: they recognize the synchronous rationality ("never akratic once") but asynchronous failure ("diachronically a wreck"). 

  The key insight here is the temporal aspect: goal revision always happens right before the scheduled action, with perfect local justification that maintains their self-image as rational. This isn't procrastination per se - procrastinators usually know they're avoiding the task, whereas this user genuinely believes each revision is correct. 

  Let me mentally scan the literature... 
  - Temporal discounting models don't fit because they involve predicting future failure, not rewriting standards. 
  - Cognitive dissonance reduction is close but usually retrospective rather than preemptive. 
  - Planning fallacy involves underestimation of time, not goal adjustment. 

  Ah! What they're describing resembles "motivated reasoning" applied to self-regulation, but more specifically it's like "preemptive rationalization." The nearest concepts would be:
  1) Procrastination (but they don't experience conflict at execution time)
  2) Akrasia (explicitly ruled out by user)
  3) Preference reversal (but their Sunday self consistently endorses higher goals)
  4) Planning fallacy (underestimation of capacity, not goal revision)

  The core mechanism is anticipatory self-justification - revising the plan to avoid future cognitive dissonance. I'll call it "Proleptic Rationalization" (proleptic meaning anticipatory). Defining features: 1) downward goal revision immediately before scheduled action 2) locally credible justification 3) maintained endorsement of original standard 4) cumulative failure pattern.

  Boundary case: If they ever skipped without revising the plan first, that would be classic procrastination. If they permanently lowered standards, that'd be preference change. 

  The user will appreciate precise distinctions - they're clearly detail-oriented. Should emphasize how this preserves synchronous rationality while causing asynchronous failure. Might help them recognize the pattern faster in future by naming the anticipatory justification step.
answer: |-
  Here are the nearest concepts with distinctions, your term, and boundaries:

  1.  **Procrastination:** Delaying intended action despite expecting worse outcomes. *But* you don't experience conflict *at the time of skipping*; the action is already deemed unnecessary via revised plan.
  2.  **Akrasia (Weakness of Will):** Acting against your own better judgment *at the moment of action*. *Crucially*, you never do this; action always aligns with your *current* (revised) judgment.
  3.  **Planning Fallacy:** Systematically underestimating time/effort required. *However*, your revisions aren't just about time estimates; they involve redefining the *standard itself* ("three is realistic") based on new context.
  4.  **Motivated Reasoning/Confirmation Bias:** Seeking reasons to support a desired conclusion. *Close, but* typically involves defending an existing belief/action, not proactively revising a standard *to avoid* a future action-conflict.

  **Your Term: Proleptic Rationalization**

  **Definition:** The anticipatory revision of a commitment standard immediately prior to a scheduled execution point, employing locally credible justifications to transform potential akrasia (acting against a standing plan) into synchronic compliance (acting according to a newly revised plan), thereby avoiding immediate self-judgment while enabling repeated failure against diachronic intentions.

  **Edges:**

  *   **Counts:** Downward revision of a specific, scheduled commitment (e.g., "skip gym session #4") *just before* its execution time, using context-specific justifications perceived as valid *in that moment*, while maintaining the original standard as generally correct. Creates a pattern of cumulative failure against the diachronic goal.
  *   **Doesn't Count:**
      *   Simply procrastinating *without* revising the plan ("I know I should go to the gym now, but I won't").
      *   Permanently lowering a standard based on genuine reassessment (endorsing 3 blocks on Sunday).
      *   Revising plans significantly *before* the execution pressure point (e.g., revising Tuesday's plan on Monday).
