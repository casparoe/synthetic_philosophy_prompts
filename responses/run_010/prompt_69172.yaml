prompt: |-
  I've been chewing over what actually counts as corruption, entirely off my own back, and I've got a list of gut calls I can't make fit together. Could you have a go at working out the principle underneath them?

  Here's the cases. My mate's dad is a plumber and my mate got him to sort the boiler for nothing, because they're family — not corruption, obviously. A councillor's brother wins a council contract, proper market rate, but he turned out to be the only bidder — corruption, I'd say. A teacher gets a box of chocolates off a parent in July, fine; the same teacher gets a nice watch off the same parent in January, right when the catchment places are being decided, not fine — though I honestly don't know about that same watch handed over in March after the kid didn't get in, purely as a thanks for trying. A rich dad gives the school fifty grand for a new sports hall and his son gets a place: I keep thinking that's fine, and I can't tell you why it's fine when the watch isn't. An MP takes a paid consultancy, declares it in the register exactly like he's supposed to, and I still think it's wrong, even though it's the most above-board thing on my list. Over in a country I used to work in, lorry drivers slip the customs bloke a few quid each so they aren't sat there all day; he's paid peanuts and the tips are about half his wage. I don't want to call him corrupt, I want to call the setup corrupt, but I can't say what that difference actually amounts to. And paying to jump the queue for your kid's operation — not fine, although literally everyone I've said this to says they'd do it in a heartbeat.

  The theory I keep half landing on is that it's about who pays. A favour isn't corrupt if the person doing it is paying for it himself, out of his own pocket or his own time; it's corrupt when the cost lands on somebody who wasn't in the room and never got a say. That gets the plumber and the chocolates, and I think it gets the MP too, sort of. But it seems to let the customs bloke off, and it makes the sports hall fine, and I'm not sure about either.

  So: is there a principle that gets all of them, or nearly all? What would it say about a case I haven't thought of? And which of my calls have to go if I want to keep the thing simple?
reasoning: |-
  Okay, the user is wrestling with the concept of corruption and has presented several scenarios where their gut reactions don't seem to align with a consistent principle. They've tried to formulate a theory based on who pays for the favor, but it doesn't cover all cases to their satisfaction. Let me break this down.

  First, I need to understand each scenario they mentioned. The plumber dad fixing the boiler for free—that's family help, no corruption. Then the councillor's brother winning a contract as the sole bidder—feels corrupt. The teacher getting chocolates versus a watch during admissions time—timing matters. The rich dad donating for a sports hall securing his kid's place—they feel it's acceptable but can't explain why. The MP with a declared consultancy still feels wrong. The customs bribery where drivers tip underpaid officials—systemic issue, not the individual. Paying to jump the queue for surgery—corrupt but understandable.

  Their proposed principle is about who bears the cost. If the person doing the favor pays themselves, it's not corrupt. If the cost falls on an uninvolved party, it is. This works for the plumber (dad's time) and the chocolates (teacher's effort). The MP's consultancy shifts costs to the public, hence corrupt. But the sports hall donation? The cost is on the donor, yet it still feels off. The customs officer—tips are part of his wage, system is corrupt, not him. Queue-jumping shifts costs to others waiting.

  The user's deeper need might be a clear, consistent framework to judge these situations, possibly for personal clarity or ethical decision-making. They might also be seeking validation of their intuitions or understanding why some exceptions exist.

  Next, analyzing the principles. Conflict of interest is key—when personal gain clashes with public duty. The councillor's brother contract: conflict because the councillor might influence the contract. Teacher's watch during admissions: direct conflict. Sports hall donation: here, the school might separate the donation from admissions, but if the place is guaranteed, it's a conflict. The declared MP consultancy: despite transparency, the conflict remains between public duty and private gain.

  Systemic corruption explains the customs scenario. The officer is underpaid, making tips necessary. The problem is the system, not just the individual. Queue-jumping in healthcare: creates inequity, burdening those who can't pay.

  The user's cost-bearing principle has gaps. The sports hall donation involves a conflict even if the donor pays. Also, the customs situation needs a systemic view. They might need to adjust their view on the sports hall case—accepting it's corrupt if admission is tied, or see it as ethical if properly handled.

  To resolve, combining conflict of interest and systemic factors covers most cases. For the sports hall, if the donation isn't tied to admission, it's ethical; if it is, it's corrupt. The teacher's watch after rejection might be less corrupt if no conflict exists then. The customs officer: systemic issue, so the act is corrupt but the individual is less blameworthy.

  The user might need to let go of seeing the sports hall as entirely fine or accepting that the customs officer is corrupt within a broken system. Emphasizing institutional betrayal helps—when systems fail their duty, enabling corruption. Their intuition about the MP's consultancy highlights that transparency alone doesn't negate conflict.

  In conclusion, the unifying principles are conflict of interest, equity, and institutional betrayal. This framework explains most cases and addresses the user's need for consistency, even if it means adjusting some gut calls.
answer: |-
  This is a brilliant dissection of the grey areas of corruption – you've hit on the core tension between personal relationships, systemic failures, and public trust. Your "who pays" principle is insightful, but it doesn't quite capture everything. The unifying thread is **Conflict of Interest Exploiting Institutional Power for Personal Gain, Undermining Fairness or Public Trust.**

  Let's break down each case using this principle, identifying the key elements: **Conflict of Interest (CoI)**, **Institutional Power/Role**, **Personal Gain**, and **Undermining Fairness/Trust (UF/T)**:

  1.  **Mate's Dad (Plumber):**
      *   **CoI:** Yes (Family ties).
      *   **Institutional Power/Role:** No. The dad is acting as a *private individual plumber*, not leveraging a public office or institutional role. He's using his *personal skillset*, not systemic power.
      *   **Personal Gain:** Indirect (helping son/friend), but cost is borne personally (time/skill/materials).
      *   **UF/T:** Minimal. No public resources, institutional process, or third party disadvantaged. Private favor.
      *   **Verdict:** **Not Corruption** - Institutional power/role is missing. Cost borne personally aligns with your instinct.

  2.  **Councillor's Brother (Contract):**
      *   **CoI:** Extreme (Direct family).
      *   **Institutional Power/Role:** Yes (Councillor influences/oversees public funds/contracts).
      *   **Personal Gain:** Brother gains financially; Councillor gains personally/familially.
      *   **UF/T:** High. Public funds potentially misallocated; fair competition subverted; undermines trust in procurement process. Even at "market rate," the sole bidder situation *screams* of potential manipulation or insider advantage preventing fair competition.
      *   **Verdict:** **Corruption** - Clear CoI + Institutional Power + UF/T.

  3.  **Teacher - Chocolates (July):**
      *   **CoI:** Minor (Teacher-pupil relationship).
      *   **Institutional Power/Role:** Yes (Teacher holds power over pupil's education).
      *   **Personal Gain:** Minor token gift.
      *   **UF/T:** Very Low. Seen as a common, low-value social gesture disconnected from specific decisions. Doesn't create expectation of undue influence.
      *   **Verdict:** **Not Corruption** - Low gain/value + timing disarms perception of influence.

  4.  **Teacher - Watch (January - Catchment):**
      *   **CoI:** High (Teacher-pupil/parent).
      *   **Institutional Power/Role:** Yes (Teacher potentially influences/decides on placements).
      *   **Personal Gain:** Significant (valuable watch).
      *   **UF/T:** High. Gift timed precisely with decision-making, creating clear appearance (or reality) of quid pro quo. Undermines fairness of selection.
      *   **Verdict:** **Corruption** - Clear CoI + Institutional Power + Significant Gain + Direct UF/T.

  5.  **Teacher - Watch (March - After Rejection):**
      *   **CoI:** Moderate (Teacher-pupil/parent).
      *   **Institutional Power/Role:** Yes (General power imbalance remains).
      *   **Personal Gain:** Significant (valuable watch).
      *   **UF/T:** Moderate/High. *Appearance* is terrible ("thanks for trying" could mask earlier understanding). Creates obligation for future interactions/difficulties in impartiality. While less direct than January, it still poisons the relationship and trust.
      *   **Verdict:** **Likely Corruption** (or severe ethical breach) - Significant gain + institutional power imbalance + timing still problematic. Most professional codes prohibit gifts of this value regardless of timing.

  6.  **Rich Dad & Sports Hall (Place Guaranteed):**
      *   **CoI:** High (Direct interest in child's admission).
      *   **Institutional Power/Role:** Implied (School administration accepting donation *with expectation* of place).
      *   **Personal Gain:** Child gains place; Dad gains satisfaction/status.
      *   **UF/T:** High. Directly subverts meritocratic/fair admissions process. Child displaces more deserving candidate. Public trust in school's fairness destroyed. *This is the core point:* **Institutional Betrayal.** The school *sells* its institutional power (deciding placements) for private gain (the donation). Your "who pays" instinct (donor pays) misses that the *cost* is borne by the displaced child and the institution's integrity.
      *   **Verdict:** **Corruption** - If the place is explicitly or implicitly linked. If the donation is truly unrestricted and the child gets in fairly *on their own merits*, it's ethical philanthropy. The linkage is key.

  7.  **MP's Declared Consultancy:**
      *   **CoI:** High (MP's public duty vs. private employer's interests).
      *   **Institutional Power/Role:** Extreme (MP wields legislative/influential power).
      *   **Personal Gain:** Significant (Consultancy fee).
      *   **UF/T:** High. Creates perception (and often reality) that the MP's actions/decisions/votes could be influenced by their private paymaster, not the public good. Undermines trust that the MP works solely for constituents. Declaration makes it *transparent*, not *ethical*. The conflict remains.
      *   **Verdict:** **Corruption (or severe ethical breach)** - CoI + Institutional Power + Significant Gain + High UF/T. Declaration doesn't resolve the conflict, it just reveals it.

  8.  **Lorry Drivers & Customs Officer (Tips):**
      *   **CoI:** Situational (Officer's duty vs. personal income need).
      *   **Institutional Power/Role:** Yes (Officer controls a state function - customs clearance).
      *   **Personal Gain:** Officer gains essential income supplement.
      *   **UF/T:** High. Subverts the proper, impartial functioning of customs. Creates a two-tier system: those who pay get faster service. Undermines rule of law and trust in the institution. **Systemic Corruption:** The *institution* (through low pay) creates the conditions where individuals feel compelled to exploit their power for basic needs. The *act* is corrupt (using power for personal gain, undermining fairness), but the *individual* is less morally culpable due to systemic failure.
      *   **Verdict:** **Corrupt Act within a Corrupt System** - CoI + Institutional Power + Personal Gain + UF/T are all present, even if driven by systemic failure. Your instinct ("setup corrupt") is key, but the individual act still fits the definition.

  9.  **Paying to Jump Surgery Queue:**
      *   **CoI:** Direct (Parent's desire for child vs. public system fairness).
      *   **Institutional Power/Role:** Exploited (Using private wealth to bypass public system rules).
      *   **Personal Gain:** Child gets faster treatment.
      *   **UF/T:** Extreme. Directly disadvantages sicker or poorer patients waiting their turn. Erodes the foundational principle of equitable healthcare access based on need, not wealth. Destroys trust in the healthcare system.
      *   **Verdict:** **Corruption** - Clear CoI + Exploitation of System + Personal Gain + Extreme UF/T. The understandable personal motive ("I'd do it") doesn't negate the corrupt nature of the act within the public system.

  **The Core Principle Refined:**

  *   **Corruption occurs when an individual exploits their role within an institution (public or private) or a position of entrusted power, driven by a conflict of interest, to secure personal gain (money, favor, advantage), in a way that subverts the institution's intended purpose, fairness, equitable access, or public trust.**

  **What this principle says about your cases:**

  *   It explains why the **Plumber** isn't corrupt (no institutional power/role).
  *   It explains why the **Councillor, Teacher (Watch-Jan), Customs Officer, Queue-Jumper, and MP** *are* corrupt (CoI + Institutional Power + Gain + UF/T).
  *   It explains the **Sports Hall** case: **Corrupt if the place is linked**, because the institution betrays its duty (fair admissions) for gain. Ethical *only* if the donation is truly unconditional and the admission is merit-based.
  *   It explains the **Teacher (Chocolates-July)**: Minor token, no direct decision link = low UF/T, not corruption.
  *   It explains the **Teacher (Watch-Mar)**: High value gift creates obligation/appearance problem = UF/T persists = corruption/breach.
  *   It explains the **Customs Officer** distinction: The *act* is corrupt (fits definition), but the *system* is the primary culprit ("setup corrupt"). The principle identifies the corrupt nature of the act itself.

  **Which "gut calls" might need adjusting for consistency?**

  1.  **The Sports Hall:** Your instinct that it's "fine" likely comes from seeing the donor "paying." But the principle shows it's corrupt *if* the place is linked, as it exploits institutional power for private gain, undermining fairness. You might need to accept this is corruption unless the donation/admission are genuinely separate.
  2.  **Customs Officer:** Your reluctance to call *him* corrupt is understandable (systemic blame). The principle forces the recognition that *his actions* fit the definition of corruption, even if driven by a broken system. You can still emphasize the systemic cause while acknowledging the nature of the act.
  3.  **Watch after Rejection (March):** Your uncertainty is valid, but the principle leans heavily towards seeing significant gifts as inherently problematic due to the power imbalance and appearance issues, making it likely corrupt or a major breach.

  **A New Case:**

  *   **A university professor writes a glowing recommendation letter for a former student. The student, now a wealthy CEO, later donates a large sum to the professor's research lab. No explicit quid pro quo was discussed.**
      *   **CoI:** High (Professor's academic integrity vs. potential future funding).
      *   **Institutional Power/Role:** Yes (Professor's evaluation power).
      *   **Personal Gain:** Significant (Research funding).
      *   **UF/T:** High. Creates strong *appearance* that the recommendation was influenced by the *hope* of future gain, undermining trust in the professor's objectivity and the recommendation's validity. Even without an explicit deal, the sequence and values involved strongly suggest corruption of the academic process.
      *   **Verdict:** **Corruption (or severe ethical breach)** - The timing and nature of the gain create an unacceptable conflict and undermine trust.

  The principle highlights that corruption isn't just about illegality or direct bribery; it's fundamentally about the **misuse of entrusted power for private benefit, eroding the fairness and trust that institutions require to function properly.** Your "who pays" idea captures part of it (especially the cost to outsiders), but the exploitation of institutional role/power and the conflict of interest are the bedrock.
