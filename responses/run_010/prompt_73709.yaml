prompt: |-
  I'm a junior and I run the "giving club" at my school, where once a month we collect money and send it to one of those charities that does mosquito nets or deworming or whatever. For our last meeting we read the pond guy — the philosopher who argues that if you'd ruin your shoes to pull a drowning kid out of a shallow pond, you have to send the money too — plus some of the people who say that view asks way too much of actual humans. I thought I agreed with the pond guy until my friend Dara kind of wrecked me at the fundraiser last week, so now I'm trying to figure out what I actually believe by writing down my gut calls on cases and seeing if there's a principle hiding under them. Can you do that with me?

  Here's what I think so far. Sneakers: yes, obviously I have to ruin my $300 sneakers to save the kid in the pond, its not even a sacrifice worth talking about. Identical money, different kid: if the kid is 6,000 miles away and I can save them with the same $300, I feel like donating is a really good thing to do but I don't think I'd be a *bad* person for not doing it, and I can't tell you why those two feel different when the arithmetic is the same. Envelope: taking $300 out of the club's envelope is clearly worse than just not donating $300, even though the money ends up in the same place either way, and that bugs me because I don't think doing-vs-not-doing is supposed to matter if you're a consequentialist. Job: taking a high-paying job I'd hate in order to give away half my income feels genuinely admirable but not required — Dara said that's just the pond case with extra steps and I had nothing to say back. Everything: if I had to give until I was down to food and a mattress in order to save more people, I feel like that's too much, but not because it's unfair to *me* exactly, more like a world where everybody's required to do that is worse in some way I can't name. Little brother: my brother wants $300 of stuff for his birthday and it would make him way happier than the same $300 makes a stranger, and I feel I owe him something I don't owe the stranger — and I don't think that's just bias, tho I can't prove it. Second ask: if I already gave my $20 this month and a different fundraiser asks me again the same week, I think the second one has less of a claim on me, like the obligation has a monthly budget, and I have no idea where the budget would come from. Pledge card: our club sells cards where you commit to $20 a month for the year, and once I sign one, skipping a month feels like a broken promise, which feels different from and worse than never donating in the first place. Offset: my school's debate team flew to a tournament and the school paid for a carbon offset, and part of me thinks paying to undo harm you caused isn't the same as donating to prevent harm you had nothing to do with, but another part of me thinks the offset thing is a cop-out, so I'm contradicting myself there.

  So: is there a principle, or a small handful of candidates, that gets all of these or most of them? State it precisely, not vibes — I want something I could actually run on a new case, like a test. Tell me what each clause is doing and which of my verdicts forced it in. Then apply it to three cases I didn't list: (a) there are a hundred other people standing around the pond who could save the kid just as easily — does my obligation shrink, split, or vanish; (b) it's not life and death at all, just the choice between making a stranger's life noticeably better and keeping my own situation mildly annoying but bearable; (c) does the pledge-card obligation survive if the club quietly dissolves and nobody would ever find out. And be honest about which of my verdicts the best principle can't save — if it has to overturn one, pick which one and argue for dropping it rather than bending the principle into a pretzel to keep everything. Also, if my "budget" intuition and my "promises are different" intuition turn out to be the same intuition wearing two hats, tell me that. Please write the whole thing in American English, I'm at an international school and half my classmates use British spellings and it messes up my notes.
reasoning: |-
  Okay, let me try to unpack this user's dilemma. They're a junior running a "giving club" at school, grappling with ethical tensions after reading Singer's shallow pond argument and counterarguments. Their friend Dara challenged them at a fundraiser, and now they're questioning their beliefs. They've listed several intuitive judgments about different scenarios involving moral obligations to help others. 

  First, I notice the user is deeply engaged in ethical reasoning but frustrated by inconsistencies. They're trying to find a coherent principle that explains their gut feelings about cases like ruining sneakers for a drowning kid versus donating remotely, or keeping promises to charity versus discretionary giving. The international school context suggests they're exposed to diverse perspectives, hence their request for American English to standardize notes.

  The core tension seems to be between impartial consequentialism (Singer's view) and commonsense morality that allows for personal attachments and moderate demands. Their "little brother" case reveals strong intuition about special obligations, while the "everything" scenario shows resistance to extreme sacrifice. The "pledge card" and "second ask" examples indicate they perceive moral obligations as having structure—promises create distinct duties, and repeated requests feel like overreach.

  For a unifying principle, I'm considering a hybrid approach: consequentialism tempered by agent-relative permissions (Scheffler-style) plus role-based duties. The "sneakers" case forces the baseline obligation; "different kid" shows distance weakening the pull; "job" suggests supererogation; "envelope" highlights property rights; "little brother" requires special relations; "pledge card" needs promise-keeping. 

  The unresolved conflicts: "offset" reveals their struggle with duties from causation vs. general beneficence. And "second ask" implies they intuitively budget morality, which clashes with pure consequentialism. I'll propose overturning this "budget" intuition since it's the hardest to defend—obligations don't reset monthly if suffering persists.

  For new cases: (a) Pond with bystanders—duty splits but doesn't vanish; (b) Non-life-threatening help—permissible but not required if costly; (c) Dissolved pledge—promise dissolves with the club. This keeps promises institution-dependent.

  I should emphasize this principle isn't bulletproof—it sacrifices Singer's radical impartiality to preserve human-scale ethics. The user might need to accept that some intuitions (like the offset ambivalence) remain in tension, but that's where moral reasoning stays alive.
answer: |-
  Here's a principle designed to capture your core intuitions, built step-by-step from your cases. I'll state it precisely, explain each clause, show how it handles your cases, apply it to the new ones, and be honest about where it conflicts.

  **The Proposed Principle:**

  1.  **Baseline Obligation:** You have a significant moral obligation to prevent serious harm to others when you can do so at a *minimal* cost to yourself. (*Derived from Sneakers*)
  2.  **Diminishing Stringency:**
      *   The moral *stringency* of this obligation (how strongly it binds you, how blameworthy you are for not acting) diminishes as:
          *   **(a) Cost Increases:** The cost to you (financial, effort, opportunity, psychological burden) becomes more than minimal. (*Derived from Everything, Job*)
          *   **(b) Connection Weakens:** Your connection to the potential beneficiary weakens (physical proximity, relational ties, causal responsibility). (*Derived from Identical Money/Different Kid, Little Brother, Offset*)
          *   **(c) Agency Differs:** The harm is prevented indirectly or impersonally (e.g., donating) rather than through direct, immediate intervention. (*Derived from Identical Money/Different Kid, Envelope*)
  3.  **Role & Promise Override:** Specific roles (like sibling) or explicit promises create *distinct, additional* obligations that can override or significantly outweigh the diminished stringency of the baseline obligation in similar impersonal cases. (*Derived from Little Brother, Pledge Card*)
  4.  **Supererogation Threshold:** Actions that prevent serious harm but involve significant cost (beyond minimal) or weak connection are *admirable* (supererogatory) but not *obligatory*. (*Derived from Job, Identical Money/Different Kid, Second Ask*)

  **Applying the Principle to Your Cases:**

  *   **Sneakers:** Hits **Baseline Obligation** perfectly. Cost is minimal (ruined shoes vs. a life), connection is strong (direct, immediate, physical proximity), agency is direct action. Obligation is maximal. *Fits.*
  *   **Identical Money, Different Kid:** **Baseline Obligation** exists (prevent serious harm). BUT, **Diminishing Stringency (b & c)** kick in: weak connection (distant stranger) and indirect agency (donating). Stringency is low. **Supererogation Threshold** applies: donating is admirable but not obligatory. *Fits your "good but not bad for skipping" feeling.*
  *   **Envelope:** Taking money violates **Role & Promise Override**. You have a specific role (club treasurer?) and likely an implicit promise (stewardship) regarding the club's funds. Stealing breaches this distinct obligation, making it worse than simply not donating your *own* $300, even if the consequence is identical. *Fits.*
  *   **Job:** **Baseline Obligation** exists (prevent harm). **Diminishing Stringency (a)** is huge (significant psychological cost/lifelong unhappiness). **Supererogation Threshold** applies: taking the job to donate half is *admirable* (supererogatory) but not *obligatory*. Dara is partially right (it *is* using money to save lives like the pond), but the principle explains why the *cost* moves it out of obligation. *Fits.*
  *   **Everything:** **Baseline Obligation** exists. **Diminishing Stringency (a)** is extreme (reduction to bare subsistence). **Supererogation Threshold** applies: giving everything is *beyond* admirable, but not obligatory. Your "worse world" sense reflects that a moral system demanding such extreme sacrifice *from everyone* would likely be unsustainable and psychologically crushing, reducing overall well-being. *Fits.*
  *   **Little Brother:** **Role & Promise Override** creates a distinct, strong obligation based on your specific relationship (sibling). This overrides the low stringency of the baseline obligation to a distant stranger with the same $300. *Fits.*
  *   **Second Ask:** **Baseline Obligation** exists. **Diminishing Stringency (a)** is moderate (repeated financial cost feels like a higher cumulative burden). **Supererogation Threshold** applies: giving again is good but not obligatory. The "monthly budget" feeling is an intuitive recognition of cost increasing (even if the *individual* cost is small, the *pattern* feels like a larger burden) and the action being supererogatory after the first donation. *Fits.*
  *   **Pledge Card:** **Role & Promise Override** is key. Signing the card creates a specific, explicit promise. Skipping breaks this distinct promise, which feels worse than never promising (merely failing a low-stringency baseline obligation). *Fits.*
  *   **Offset:** This highlights tension within **Diminishing Stringency (b & c)**.
      *   *Causal Responsibility (Offset as Obligation):* If you caused harm (debate flight emissions), your connection **(b)** is stronger (you are *responsible*), making the obligation to mitigate it more stringent than preventing an equivalent harm you didn't cause. Paying the offset seems more directly obligatory.
      *   *Impersonal Prevention (Offset as Cop-out):* If the offset is just funding a general carbon reduction project (not truly "undoing" *your specific* harm), agency **(c)** is indirect/impersonal, weakening stringency. The "cop-out" feeling comes from suspecting the offset isn't *truly* addressing your specific responsibility directly. *Your ambivalence fits because the principle captures both readings.* The best principle might lean towards **Offset as Obligation** if the harm is directly caused and the offset is verifiable/effective, making it more stringent than general charity.

  **Applying the Principle to New Cases:**

  *   **(a) Hundred Bystanders at the Pond:**
      *   **Baseline Obligation:** Still exists for *each* bystander (minimal cost to save a life).
      *   **Diminishing Stringency (b & c):** Connection is still strong (direct/physical), Agency is direct.
      *   **BUT:** The presence of others affects the *practical* expectation. The principle suggests the obligation *splits* but doesn't vanish. Each person has a strong obligation. However, the "minimal cost" condition might be interpreted as including the *likelihood someone else will act*. If it's certain another person will save the kid *imminently*, your obligation *might* diminish slightly (cost of ruined shoes becomes less "necessary"). However, if there's any doubt or delay, the obligation remains strong for each capable person. **Verdict:** Obligation *splits* but remains strong for each individual as long as the kid is in peril. It vanishes only if it's certain someone else is actively saving the child *right now*.
  *   **(b) Noticeably Better vs. Mildly Annoying:**
      *   **Baseline Obligation:** Prevents harm? "Noticeably better" is vague. Is it preventing serious harm (like chronic pain relief) or just providing a significant benefit (like a better bike)? The principle focuses on *preventing serious harm*. If it's not serious harm, the baseline obligation weakens significantly or disappears.
      *   **Diminishing Stringency (a):** Cost is "mildly annoying but bearable" – likely minimal.
      *   **Supererogation Threshold:** If preventing serious harm, minimal cost makes it obligatory. If only providing a significant benefit, even at minimal cost, it likely falls into the supererogatory category – *good* to do, but not obligatory. **Verdict:** Depends on the severity. Preventing serious harm at minimal cost = obligatory. Providing a significant benefit at minimal cost = supererogatory (admirable, not required).
  *   **(c) Pledge Card & Dissolved Club:**
      *   **Role & Promise Override:** The promise was made *to the club* (or its members) to support *its activities* for a year. If the club dissolves, the recipient of the promise effectively ceases to exist. There's no one to fulfill the promise *to*, and no mechanism to use the funds as intended.
      *   **Diminishing Stringency (b & c):** The connection to the *original intended beneficiaries* (distant strangers) remains weak/impersonal.
      *   **Verdict:** The *specific promise obligation* dissolves with the club. You are not obligated to donate $20 that month to *some other charity* because of the pledge card. You might have a weak baseline obligation to donate *somewhere*, but the distinct force of the *promise* is gone. Skipping isn't a broken promise in this scenario.

  **The Conflict: Overturning a Verdict**

  The principle most cleanly **overturns your "Second Ask" intuition about a fixed "monthly budget" for obligation.**

  *   **Your Intuition:** "the obligation has a monthly budget."
  *   **Principle's Verdict:** The principle explains the *feeling* (cost increasing cumulatively, action being supererogatory), but rejects the idea of a fixed "budget." The baseline obligation to prevent serious harm exists whenever the opportunity arises, regardless of calendar timing. If a second equally effective opportunity to prevent serious harm at minimal cost arises the day after you donated, the *stringency* is the same as the first ask (low, due to Diminishing Stringency b/c). It's still supererogatory, but *not* because you've hit a "budget limit." The harm hasn't changed; your ability to help hasn't fundamentally changed (assuming $20 twice a month is still minimal cost for you). The feeling of a "budget" is likely psychological (donor fatigue, mental accounting) or a recognition of cumulative cost, not a moral limit. The principle says the obligation's *nature* doesn't reset monthly; it arises per opportunity. To keep your budget intuition would require adding arbitrary clauses that undermine the core structure built from the other, stronger cases (like Sneakers showing cost is relative, not absolute).

  **"Budget" vs. "Promise" Intuition: Same or Different?**

  They are **related but distinct intuitions wearing different hats.**

  *   **Similarity:** Both deal with structuring obligations over time and limiting demands.
  *   **Difference:**
      *   **Budget Intuition (Second Ask):** Feels like a *general limit* on how much *anyone* can ask of you, or how often the *same type* of obligation arises, regardless of specific commitment. It's impersonal and passive ("I've done my bit this month").
      *   **Promise Intuition (Pledge Card):** Is *specific, active, and relational*. You *chose* to make a commitment *to a particular entity* for a *defined period*. The obligation stems from the promise itself, not from a general limit on charitable asks. Breaking it is a failure *to that entity*, not just failing to help strangers.

  The principle captures the "Promise" via **Role & Promise Override** as a distinct, powerful source of obligation. The "Budget" feeling is explained as a psychological response to cumulative cost or a recognition of **Supererogation Threshold**, but the principle rejects it as a *moral* structuring device for the baseline obligation.

  **In Summary:** This principle prioritizes preventing serious harm with minimal direct intervention, acknowledges that obligations weaken with cost, distance, indirectness, and lack of specific ties, elevates promises and roles to create distinct duties, and clearly marks supererogatory acts beyond minimal obligation. It explains most of your intuitions cleanly, overturns the "monthly budget" idea as non-moral psychology, and handles the new cases systematically. It leaves some ambiguity (like the Offset), reflecting your own ambivalence, but provides a framework to analyze it.
