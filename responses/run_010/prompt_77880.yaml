prompt: |-
  I serve on a hospital's technology-assessment committee, and I need to answer an argument that ended a discussion last week before it had properly begun. The committee has fifteen members: two of us work with the device in question daily, a third has read the trial data closely, and the remaining twelve have no contact with the evidence beyond what they hear in the room, where they reliably fall in behind whoever speaks first. The question before us was whether to recommend the device for a narrow indication; there were three candidate recommendations on the table rather than two, and alongside them a separate proposal to pool each member's numerical estimate of a complication rate and act on the pooled figure. When I suggested we might do better simply to defer to the members who know the literature, the chair waved the objection away with the old proverb 'two heads are better than one' and added that this was, after all, what Condorcet had proved.

  I want to come back at the next meeting with something better than a hunch that he is misusing a theorem. So please lay out the distinct precise claims that proverb could be standing in for, running from the ones that are true but empty, through the ones that are substantive and defensible, to the ones that are simply false. For each, state what it requires: how many alternatives the choice may have, how competent the individual members must be and on what question, what independence amounts to and how much of it is needed, whether the claim concerns a large group in the limit or a group of a specific finite size like ours, and whether the claim is about a majority verdict, about a pooled numerical estimate, or about a choice between two individual deciders. My suspicion is that a single sentence is being made to cover all three of those at once, and that the differences are exactly what matters here.

  Then take a position rather than leaving me the menu. Tell me which reading, if any, the chair was entitled to given the panel as I have described it; whether Condorcet's result reaches a vote among three options; whether it reaches the pooling of our complication-rate estimates at all, or whether that is a different mechanism with different conditions; and where the proverb is doing rhetorical work that no theorem can underwrite. I would rather have your definite judgment with reasons behind it than a balanced survey. Where the answer genuinely turns on an empirical fact about committees that cannot be settled from the armchair, say so and name the fact it turns on — but do not retreat into the complexity of the issue where the issue is not actually complex.
reasoning: |-
  Hmm, the user is dealing with a frustrating situation in a hospital technology-assessment committee. They need to counter the chair's misuse of "two heads are better than one" and Condorcet's jury theorem to justify poor decision-making processes. The committee has serious expertise imbalances: only 3 out of 15 members have real knowledge about the medical device in question, while the rest just follow whoever speaks first. The chair dismissed the user's valid concern about deferring to experts by invoking Condorcet.

  The user wants a precise breakdown of what Condorcet's theorem actually says versus how the chair is misapplying it. They specifically need: 1) A taxonomy of interpretations of the proverb from trivial to false, 2) Clear conditions for each (competence, independence, voting mechanisms), 3) A firm judgment on why the chair is wrong here, and 4) No false neutrality - they want me to take a position. 

  I should map the proverb to Condorcet's actual theorem first. The core truth is Condorcet's jury theorem: for a binary choice, if voters are independent and each has >50% competence, majority vote beats individual decisions as group size increases. But this has precise mathematical boundaries - it requires binary choice, symmetrical competence above 50%, and strict independence. 

  The chair's application fails on multiple fronts. First, they're voting on three options, not two - Condorcet has no direct extension here. Second, pooling numerical estimates (like complication rates) is fundamentally different from majority voting; it's about reducing variance through averaging, which requires different conditions like unbiased estimators. Third, the committee violates independence because most members just follow the first speaker. And crucially, only 3 members are minimally competent while the majority have zero competence - their votes actually add noise rather than signal. 

  The proverb is doing rhetorical heavy lifting here. "Two heads" implies additive wisdom, but with uninformed voters, it's more like the blind leading the blind. Condorcet assumes baseline competence, which is absent in this committee structure. For numerical pooling, the key empirical question is whether the incompetent members' estimates are randomly wrong (could average out) or systematically biased (could distort the mean). Given they follow the first speaker, bias seems likely. 

  The user should be armed with these distinctions: voting ≠ estimation, binary ≠ ternary choice, and competent independence ≠ herd behavior. The strongest counter is that Condorcet assumes what this committee lacks - individual competence. With only 20% informed members, this is a case for expert delegation, not democratic aggregation.
answer: |-
  Here's a clear, decisive analysis and rebuttal tailored to your committee's situation. Condorcet's result is being fundamentally misapplied, and the proverb is obscuring critical distinctions.

  ### Core Distinctions & Condorcet's Actual Theorem (The Only Substantive, Defensible Claim)
  1.  **The Claim:** Condorcet's Jury Theorem (CJT) proves that for a *binary choice* (yes/no, A/B), under specific conditions, the majority vote of a group is more likely to be correct than the vote of any single member, and this probability approaches 1 (certainty) as the group size increases.
  2.  **Requirements:**
      *   **Choice Type:** Strictly **two alternatives**.
      *   **Competence:** Each member must have a fixed **individual competence > 50%** (p > 0.5) for identifying the *correct* alternative. Crucially, this competence must be *symmetrical* – members are equally likely to be correct for the *same underlying reason* (the "truth" exists and they can discern it with p>0.5).
      *   **Independence:** Member votes must be **statistically independent**. Knowing one member's vote gives you *no information* about how another will vote. This excludes shared biases, deference to others, or influence like following the first speaker.
      *   **Group Size:** The "wisdom" claim (majority better than individual) holds for any group size >=1 (though trivially for n=1). The "approaches certainty" claim requires a **large group in the limit**.
      *   **Mechanism:** Concerns a **majority verdict** on a binary choice. It is **NOT** about numerical estimation or pooling.

  ### What the Proverb *Could* Mean (From True/Trivial to False)
  *   **True but Empty:** "More people know more facts collectively than individually." (Trivially true, says nothing about *using* those facts well).
  *   **True but Limited (CJT):** "For a simple yes/no question where each member is independently slightly better than random (>50%) and unbiased, majority vote beats a single vote." (Substantive, defensible, but *highly specific*).
  *   **Misapplied & False (Your Chair's Usage):** "Aggregating judgments from many people (even uninformed or dependent ones) via any mechanism (voting on >2 options, pooling numbers) on complex questions inherently yields a better decision than relying on a few experts." (False, and directly contradicted by CJT's requirements).

  ### Why the Chair is Wrong & Condorcet Doesn't Apply Here
  1.  **Not Binary Choice:** You have **three candidate recommendations**, not two. CJT provides **no guarantee** for majority voting with three or more options. Voting theory (e.g., Condorcet Paradox) shows majority preferences can be intransitive (A beats B, B beats C, but C beats A) even with competent voters. "Whoever speaks first" heavily influences the outcome among multiple options.
  2.  **Violated Independence:** The behavior of the **twelve uninformed members** ("reliably fall in behind whoever speaks first") constitutes a **catastrophic failure of independence**. Their votes are *entirely dependent* on the first speaker's view. This negates the core mechanism of CJT where independent errors cancel out. Instead, errors cascade and amplify.
  3.  **Lack of Minimal Competence:** CJT requires *each* voter to have p > 0.5. **At least twelve members have p <= 0.5 for this specific decision.** They lack the knowledge to have *any* systematic competence above random guessing. Their "competence" is solely determined by who they follow, not the evidence.
  4.  **Wrong Mechanism - Pooling vs. Voting:** The proposal to **pool numerical estimates** is fundamentally different from majority voting. CJT is **irrelevant** here. Pooling relies on the *Central Limit Theorem (CLT)*, not CJT. The CLT states that the average of independent estimates converges to the true mean as n increases, *if* the estimates are unbiased (centered on the true value) and independent. Your problem:
      *   **Bias:** The three knowledgeable members *might* provide unbiased estimates. The twelve uninformed members, lacking evidence, likely provide *highly biased* estimates (based on guesswork, hearsay, or anchoring on the first speaker). Pooling biased estimates drags the average *away* from the truth.
      *   **Independence:** Again, the "follow the leader" dynamic destroys independence for the twelve. Their estimates will cluster around the first number floated, not their independent judgment (which they lack).
      *   **Competence for Estimation:** Pooling requires estimators to be unbiased and have finite variance. CJT's >50% competence for a binary choice is the *wrong metric* for numerical estimation quality.

  ### The Empirical Hinge: Pooling Numerical Estimates
  *   **The Crucial Question:** Are the *uninformed members' numerical estimates* **unbiased (centered on the true complication rate)** or **systematically biased**? This cannot be settled from the armchair.
  *   **The Chair's Assertion Relies On:** The assumption that their guesses are unbiased and independent, so averaging reduces noise.
  *   **The Reality & Your Description:** The description ("no contact with the evidence beyond what they hear in the room," "fall in behind whoever speaks first") strongly suggests **systematic bias**. Their estimates are likely anchored to the first number mentioned or reflect groupthink, not random error around the truth. **If their estimates are biased, pooling will produce a worse estimate than the average of the three experts.**

  ### Definitive Judgment & Recommendation
  1.  **Chair's Entitlement:** **None.** The chair fundamentally misapplied Condorcet. CJT requires binary choice, independent voters, and individual competence >50% – conditions spectacularly violated by your committee structure and the presence of three options. Invoking it for numerical pooling is completely invalid.
  2.  **Condorcet & Three Options:** **Condorcet's Jury Theorem does not reach a vote among three options.** Majority rule with >2 options is unstable and offers no CJT guarantee.
  3.  **Condorcet & Pooling:** **Condorcet's result does not reach pooling numerical estimates at all.** Pooling relies on different (CLT) mechanisms and requires unbiasedness and independence, which are highly doubtful here.
  4.  **The Proverb's Rhetorical Work:** The proverb falsely implies that *any* aggregation of *any* judgments from *any* group is inherently superior to relying on a few experts. This ignores the quality of the inputs (competence, independence, bias) and the mechanism of aggregation (binary voting vs. multi-option voting vs. numerical averaging). **"More heads" only help if they are competent, independent, and the aggregation mechanism is suited to the task.** Your committee structure ensures "more heads" primarily add noise, dependence, and bias.

  **Your Best Course:** Argue forcefully that:
  *   Condorcet applies *only* to binary choices with independent, competent voters – conditions absent here.
  *   Pooling estimates requires unbiased, independent estimators – conditions absent for the majority.
  *   The only rational approach is to **defer to the three members with direct knowledge of the device and evidence.** Their combined judgment (discussed openly, perhaps averaged if numerical, but *excluding* the uninformed) is vastly more likely to be accurate and evidence-based than any flawed aggregation mechanism applied to the whole group. The proverb's appeal to the "wisdom of the crowd" is catastrophically misplaced when the crowd is uninformed and dependent. Expertise matters.
