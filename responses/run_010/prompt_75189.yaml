prompt: |-
  I teach an undergraduate course in the philosophy of history, and every year or so a well-prepared student arrives with a version of the following argument, which I have never managed to answer to my own satisfaction. It is offered in defence of Anatoly Fomenko's new chronology: the thesis, advanced by a Moscow topologist on the strength of what he describes as an empirico-statistical analysis of narrative sources, that most of what passes for ancient history is a medieval phantom reflected backwards — that the Trojan War and the Crusades are one and the same episode, that the life of Jesus belongs to the twelfth century, and that dendrochronology and radiocarbon dating are circular because they are calibrated against the very chronology they are supposed to test. The student knows perfectly well that historians reject the theory; the argument is designed to show that their rejection cannot be a principled one.

  (1) When an observation conflicts with a hypothesis, the conflict is never with the hypothesis alone but with the hypothesis together with the auxiliary assumptions that link it to the observation; logic therefore permits rejecting the hypothesis or rejecting any of the auxiliaries.
  (2) Confronted with tree-ring sequences, radiocarbon dates, and eclipse records that do not fit a compressed chronology, Fomenko rejects the auxiliaries — the calibration of the dating methods and their alleged independence from the received chronology — rather than the chronology itself.
  (3) This is exactly what the paradigm cases of good science did. Le Verrier and Adams saved the orbit of Uranus by positing an unseen perturbing planet, and Neptune was found within about a degree of the predicted place. Pauli saved conservation of energy in beta decay by positing a particle nobody could then detect, and the neutrino was eventually detected. Astronomers saved the orbit of Mercury by positing Vulcan for half a century, and Vulcan was never found.
  (4) In each case, what settled the choice between rescuing the core and rescuing the auxiliary was nothing other than how the bet turned out: auxiliaries that paid off were vindicated, and auxiliaries that failed left the core exposed to revision.
  (5) Hence there is no logical or methodological difference between Fomenko's procedure and the procedures that produced Neptune and the neutrino — only a difference in the state of the wager, and Fomenko's wager has not yet been closed.
  (6) Therefore the line between pseudohistory and history cannot be drawn by appeal to method at all. Any criterion we propose will either convict mainstream historical science of the same vice or acquit Fomenko of it, and the actual selection between the two is made by whichever community controls the journals, the prizes, and the syllabi.

  I want to keep (1). I cannot see how to deny it without lapsing into a crude falsificationism I have spent the course arguing against, and my treatment of underdetermination depends on taking the Duhemian point seriously. I am also convinced that (6) is false, and I regard it as the most damaging idea in the student's paper. What I cannot locate is the step that does the damage.

  So: which premise or inference would you reject, why did it look innocent on a first reading, and what exactly does rejecting it cost — in particular, what does it cost someone who wants to retain (1) intact? I want a direct answer to the sharpest form of the student's challenge: is there anything that distinguishes the Neptune case from the Fomenko case other than a report on which wager paid off? If the only available reply is that the mainstream happened to be right, then (5) stands and my course is built on an equivocation. Please also say where your diagnosis turns on something philosophers of science genuinely disagree about — the standing of the demarcation project itself, the reach of the Duhem–Quine thesis, whether ad hocness can be cashed out non-circularly, whether cluster or gradational criteria count as a real answer to (6) — and mark those points as contested rather than presenting one camp's position as the settled view.
reasoning: |-
  Hmm, this is a sophisticated philosophical challenge about the nature of scientific methodology in history. A philosophy professor teaching about the philosophy of history has encountered a recurring student argument defending Anatoly Fomenko's "New Chronology" - the controversial theory that compresses ancient history into the medieval period. The student cleverly uses Duhem-Quine underdetermination to argue that Fomenko's rejection of dating methods is methodologically identical to how scientists like Le Verrier saved Newtonian mechanics by positing Neptune.

  The professor needs help identifying which part of this argument is flawed while preserving the valid Duhemian insight (premise 1) and avoiding the damaging relativism of conclusion (6). The key challenge is distinguishing why Neptune was legitimate science while Fomenko's approach isn't - without just appealing to eventual success.

  Let me break down the argument's structure. The student makes six points: (1) Duhem-Quine thesis that hypotheses face tests only with auxiliary assumptions; (2) Fomenko rejects dating auxiliaries rather than his chronology; (3) compares this to Neptune/neutrino cases where auxiliaries paid off; (4) claims the difference is merely whether the "bet" succeeded; (5) concludes no methodological difference; (6) therefore history/pseudohistory distinction is just social power.

  The professor accepts (1) as sound philosophy but needs to show where the analogy fails before reaching (6). The most vulnerable point seems to be premise (3), specifically its treatment of what counts as "exactly what good science did." The Neptune case involved specific, testable predictions about a planet's position, while Fomenko's auxiliary rejection is vague and untestable. 

  I should also consider premise (4) - it oversimplifies scientific rationality as merely "which bet paid off," ignoring how scientists evaluate plausibility before outcomes are known. Lakatos' notion of progressive vs degenerative research programs could help here. Fomenko's approach is degenerative as it only explains away counterevidence without generating novel predictions.

  Another angle is the nature of the auxiliaries themselves. Dating methods rely on multiple independent natural processes (radioactive decay, tree growth cycles), while Fomenko dismisses them as "circular" without engaging with their actual cross-validations. The Neptune case added minimal disruption to existing physics, whereas Fomenko requires rewriting vast interconnected knowledge.

  The cost of rejecting step (3) is that it forces us to articulate criteria for "reasonable" auxiliary rejection - which philosophers genuinely debate. We need to distinguish ad hoc rescues from theoretically motivated ones without relying on hindsight. This connects to longstanding demarcation problems in philosophy of science.

  The professor can preserve Duhem's insight while showing Fomenko violates what Hempel called the "requirement of maximal specificity" - his auxiliary rejection isn't independently testable. This maintains methodological standards without appealing to eventual outcomes. The distinction turns on whether auxiliary hypotheses generate new lines of inquiry or merely immunize the core theory.
answer: |-
  The flaw lies in **premise (3)**, specifically its claim that Fomenko's strategy is "exactly what the paradigm cases of good science did." This premise conflates *structural similarity* (rejecting auxiliaries to save a core hypothesis) with *methodological equivalence*. While logically permissible under (1), the *rationality* of rejecting auxiliaries depends on criteria beyond mere logical possibility—criteria Fomenko violates but the Neptune/neutrino cases satisfied. This distinction is obscured by presenting the cases as "exactly" analogous.

  ### Why (3) Looks Innocent Initially:
  - On the surface, all cases involve rejecting auxiliaries to save a core theory (Newtonian gravity, conservation of energy, Fomenko’s chronology). This satisfies the Duhemian structure in (1).
  - The appeal to historical precedent (Neptune, neutrinos) exploits a genuine philosophical point: successful science *has* defended core theories by modifying auxiliaries. This makes Fomenko’s move *seem* methodologically symmetrical.

  ### Why (3) Fails: The Crucial Differences
  1. **Testability and Specificity of Auxiliary Rejections**:
     - **Neptune/Neutrino Cases**: The auxiliary hypotheses (e.g., "an unseen planet exists at coordinates X,Y,Z"; "an undetected particle carries missing energy") made *novel, precise, independently testable predictions*. Neptune’s position was calculated to within 1°; neutrino properties were quantified. These were *falsifiable* even if initially untested.
     - **Fomenko’s Case**: Rejecting dendrochronology/radiocarbon calibration offers no *specific, testable alternative model*. Claiming methods are "circular" or "calibrated to flawed history" is a blanket denial, not a predictive hypothesis. It doesn’t specify *how* calibration failed, *what correct calibration would be*, or *how* tree-ring/isotope data *should* look under his chronology. It immunizes the core theory without generating new avenues for inquiry.

  2. **Theoretical Coherence and Burden of Proof**:
     - **Neptune/Neutrino**: Auxiliary hypotheses were *minimally disruptive* to established physics. Neptune fit Newtonian mechanics; neutrinos preserved quantum conservation laws. The burden of proof was low because the auxiliaries extended, rather than overturned, robust frameworks.
     - **Fomenko**: Rejecting dating methods requires overturning *multiple independent fields* (physics, chemistry, biology, astronomy) built on mutually reinforcing evidence. The auxiliary rejection isn’t a small amendment—it demands discarding vast, cross-validated knowledge (e.g., radioactive decay constants, solar system dynamics) *without providing a coherent alternative*. The burden of proof is astronomically higher.

  3. **Progressive vs. Degenerative Research** (Lakatosian Criterion):
     - **Neptune/Neutrino**: Auxiliary hypotheses *opened new research programs*: astronomers searched for Neptune; physicists designed neutrino experiments. Success would *expand* scientific knowledge.
     - **Fomenko**: Rejecting auxiliaries *closes off inquiry*. If all dating methods are dismissed as "circular," no empirical test can challenge the chronology. It becomes unfalsifiable—a hallmark of pseudoscience. No new predictions or investigations follow; the move is purely defensive.

  ### The Cost of Rejecting (3) While Keeping (1)
  - **Cost**: You must accept that **not all auxiliary rejections are equally rational**. Preserving (1) allows that scientists *can* reject auxiliaries, but *whether they should* depends on:
    - **Testability**: Does the new auxiliary generate *new* testable predictions?
    - **Coherence**: Is it consistent with well-established theories?
    - **Progressiveness**: Does it lead to new discoveries or merely evade falsification?
  - **Consequence**: Fomenko’s strategy is *structurally* valid under Duhem-Quine but *methodologically illegitimate* because it violates norms of testability and theoretical responsibility. Thus, the difference from Neptune isn’t just "which wager paid off" (premise 4/5)—it’s that Fomenko’s "wager" was *epistemically irresponsible* from the outset, while Le Verrier’s was justified by its precision, coherence, and heuristic fertility.

  ### Contested Philosophical Ground
  - **Demarcation Criteria**: The above appeals to Lakatos’ "progressive/degenerative" distinction and testability—**contested** by those who see science as fundamentally anarchic (Feyerabend) or social-consensus driven (Kuhnians). A strict Popperian might also reject (1), but you rightly wish to avoid that.
  - **Gradational vs. Binary Demarcation**: **Contested** whether pseudoscience is a clear category or a spectrum. Fomenko’s chronology fails even gradational criteria (e.g., its auxiliary rejections score low on testability/coherence).
  - **Naturalism**: **Contested** whether scientific rationality can be judged *in medias res* (without hindsight). I argue we *can* judge Fomenko’s move as degenerative *now*; others insist only outcomes matter.

  ### Answer to the Sharpest Challenge
  **Yes, there is a difference beyond the wager’s outcome**:  
  Neptune’s auxiliary hypothesis was *antecedently reasonable* due to its specificity, testability, and fit with established physics. Fomenko’s is *antecedently unreasonable* because it is untestable, incoherent with established science, and stifles inquiry. The "bet" on Neptune was rational *before* it succeeded; Fomenko’s is not. This preserves (1) while showing why mainstream history’s rejection *is* principled: it demands auxiliaries that *earn their keep* through explanatory power and empirical risk, not dogmatic evasion. Your course need not equivocate—it can teach Duhem’s insight while rejecting its abuse to shield pseudoscience.
