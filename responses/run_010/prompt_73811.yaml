  I recall that Horkheimer and Adorno indeed wrote during exile, framing Enlightenment rationality as inherently dominative. Their "reason reduces particulars to types" argument is central, but requires nuance - it's about instrumental reason specifically. The Auschwitz claim is deliberately provocative but often misunderstood; they argue it represents rationality's extreme logic, not direct causation. 

