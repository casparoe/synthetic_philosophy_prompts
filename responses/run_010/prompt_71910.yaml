  ### Plain-Language Summary  
  Begin by checking for glaring errors and source accessibility. Then, for each key claim, verify that sources are explicitly linked, independent (if multiple), and reliable for that specific claim—considering motives, expertise, and context. Test arguments from silence by asking if the missing record would likely exist and survive. If credible sources conflict, weigh their reliability. Reject submissions failing any disqualifying step; conditionally accept those needing source clarifications; escalate irreconcilable conflicts.  

  ### Candid Account of Limits  
  - **Judgment Dominates**: Steps 3–7 are structured judgment calls. Rules cannot quantify motives (step 5) or resolve contradictions (step 7)—only guide deliberation.  
  - **Cannot Establish Positive Truth**: The procedure evaluates *evidential support*, not historical reality. It flags unsupported claims but cannot certify what "definitely happened."  
  - **Blind Spot for Calibration**: Step 5’s reliability assessment is most vulnerable. Scientists may assume uniform source accuracy (like instrument calibration) and skip probing context-specific biases (e.g., a feud coloring a diary entry).  
  - **Incapable of**: Handling untranslated/undeciphered sources, verifying technical analyses (e.g., ink dating), or reconstructing events without documents.  

