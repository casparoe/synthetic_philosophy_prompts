  ### Diagnosis: Three Proxy-Science Intuitions Misapplied to Documentary Criticism  
  1. **Intentionality vs. Passive Archives**: Sediment cores lack motives; human sources do not. A witness may lie, omit, or shape testimony to serve interests (e.g., reputation, legal consequences). Reliability hinges on *why* a source was created, not just *what* it says.  
  2. **Independence as Genealogy, Not Replication**: Two ice cores are independent if drilled at distinct sites. Two documents are independent only if their creation lacked shared influence (e.g., one newspaper copying another). Shared phrasing or errors reveal dependence, negating corroboration.  
  3. **Context-Bound Reliability**: A thermistor’s calibration applies uniformly; a source’s reliability does not. A diary may accurately record weather (observable fact) but slander a neighbor (subjective judgment). Each claim demands separate assessment.  

