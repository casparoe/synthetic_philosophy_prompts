  2. **Independence of Sources**: In science, two measurements might be considered independent if they are taken by different instruments or at different times. In history, independence is not about numerical separation but about the genealogy of the source. Two documents that appear independent might share a common source (e.g., both relying on the same press release or rumor). Thus, we must trace the potential for contamination or common origin.

  3. **Calibration and Contextual Stability**: Scientific instruments are calibrated to be stable across a range, but human testimony is not. A source might be reliable for one type of information (e.g., the weather on a given day) but unreliable for another (e.g., the character of a neighbor). Moreover, the reliability of a source can change over time or context. We cannot assume uniform reliability.

