  ### Key Notes
  - **Indistinguishable Pairs**: The tree cannot separate:
    - **Block's phenomenal overflow vs. Local recurrent processing** (both in Leaf 3). They share commitments to experience without report (Q2=Yes, Q3=Yes, Q4=Yes, Q5=No). To separate them, we'd need a case with **sensory activity without attention where report is impossible** (e.g., a masking study with distracted subjects showing V1 activity but no behavioral response). Block might still attribute experience (constitutive), while local recurrency might require minimal attention for processing stability. Currently, no such case cleanly distinguishes them.
    
