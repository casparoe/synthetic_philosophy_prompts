answer: |-
  Below is a decision tree designed to help you and your classmates self-diagnose your positions on the dissociation between consciousness and access, based on concrete cases without using technical vocabulary. The tree has six nodes (all yes/no questions about specific findings or cases) and eight leaves (named positions or unnamed diagnoses). It separates the **constitutive axis** (whether experience can occur without content being available for reasoning and verbal guidance) from the **evidential axis** (whether such experience could ever be demonstrated, given that all measurements rely on report or task performance). Each leaf is marked with its primary axis, and I'll note where classmates might be answering different questions due to axis confusion.

  The tree incorporates your four requested views:
  - Global ignition as constitutive (no dissociation possible) → captured in the "Global Workspace Theorist" leaf.
  - Local recurrent processing as sufficient for experience → captured in the "Experience without Global Access" leaf (combined with Block-style phenomenal overflow).
  - Graded/partial awareness → captured in the "Graded Awareness" leaf.
  - Attended intermediate-level representations → captured in the "Attentional Intermediate-Level" leaf.

  I excluded integrated information theory, panpsychism, and the hard problem, as they are not needed to define the core commitments here. Cases are drawn from your specified examples (partial-report, inattentional blindness, masking, blindsight) and one additional finding (widespread brain activity during report) to ensure nodes are concrete and accessible.

  ---

  ### Decision Tree
  Answer each question based **only** on the case described, without invoking technical terms. Proceed sequentially:

  1. **Cortically blind guesser**: A person with damage to the visual cortex insists they see nothing when a stimulus appears in their blind field, but when forced to guess, they point to its location correctly 80% of the time. Do you think this person had any visual experience of the stimulus?  
     - **Yes** → Go to Q2.  
     - **No** → Go to Q2.  

  2. **Masked stimulus with brain activity**: A briefly flashed image is followed by a mask, and the person denies seeing it. However, brain scans show clear activity in visual areas (e.g., V1-V4) in response to the image. Do you think the person had any visual experience of the image?  
     - **Yes** → Go to Q3.  
     - **No** → Go to Q3.  

  3. **Inattentional blindness figure**: During a demanding task (e.g., counting basketball passes), a person fails to notice a clearly visible, unexpected figure (e.g., a gorilla) crossing the screen, even when it moves through the center of their gaze. Do you think the person had any visual experience of the figure during the task?  
     - **Yes** → Go to Q4.  
     - **No** → Go to Q4.  

  4. **Partial-report display**: After a grid of 12 letters flashes for 50ms and vanishes, people say the array disappeared before they could read it. Yet, when cued with a tone to report letters from a specific row, they accurately name 3-4 letters from that row. At the moment the letters were visible, do you think the person had a visual experience of all (or nearly all) 12 letters?  
     - **Yes** → Go to Q5.  
     - **No** → Go to Q5.  

  5. **Widespread brain activity during reports**: When people report seeing a stimulus, brain scans show intense activity spreading to frontal and parietal areas; when they don't report it, this widespread activity is absent. Is this widespread activity necessary for visual experience?  
     - **Yes** → Go to Q6.  
     - **No** → Go to Q6.  

  6. **Sensory activity without attention**: In the inattentional blindness task (Q3), if brain scans showed activity in visual areas (e.g., V1-V4) in response to the unexpected figure, would you still say the person had a visual experience of it?  
     - **Yes** → Proceed to leaves.  
     - **No** → Proceed to leaves.  

  ---

  ### Leaves (Positions)
  Based on your answers, find your leaf. Each leaf is marked with its primary axis (**constitutive** or **evidential**) and a brief description. Pairs of classmates who land on leaves with different axes may have been answering different questions (e.g., one focused on what experience *is*, the other on how we *know* about it).

  1. **Global Workspace Theorist** (e.g., Dehaene, Baars)  
     - **Answers**: Q1=No, Q2=No, Q3=No, Q4=No, Q5=Yes, Q6=Any  
     - **Axis**: Constitutive  
     - **Description**: Experience *just is* global ignition (widespread activity); if information isn't broadcast for reasoning/report, there is no experience. Dissociation is impossible.  
     - **Includes your view?**: Global ignition as constitutive.  

  2. **Attentional Intermediate-Level** (e.g., Prinz)  
     - **Answers**: Q1=No, Q2=No, Q3=No, Q4=Yes, Q5=Yes, Q6=No  
     - **Axis**: Constitutive  
