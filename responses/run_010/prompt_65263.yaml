  - **Axis Conflicts in Discussion**: Classmates in **constitutive leaves** (1-4, 6-7) might argue about what experience *is*, while those in **evidential leaves** (5, 8) focus on how we *measure* it. For example:  
    - A **Global Workspace Theorist** (constitutive) and a **Report-Based Evidentialist** (evidential) both answer Q1=No (no experience in blindsight) but for different reasons—one thinks access is constitutive, the other thinks unreportable experience is unknowable.  
    - Similarly, **Experience without Global Access** (constitutive) and **Graded Awareness** (constitutive) might agree on Q2=Yes (experience in masking) but debate whether it's rich or partial.  

