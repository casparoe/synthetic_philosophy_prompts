     - **Includes your view?**: Consciousness attaches to attended intermediate-level representations.  

  3. **Experience without Global Access** (e.g., Block's phenomenal overflow, Lamme's local recurrency)  
     - **Answers**: Q1=No, Q2=Yes, Q3=Yes, Q4=Yes, Q5=No, Q6=Yes  
     - **Axis**: Constitutive  
     - **Description**: Experience can occur without global access—local recurrent processing in sensory cortex suffices. Report is unnecessary for experience.  
     - **Includes your views?**: Local recurrent processing as sufficient (Lamme); Block's phenomenal consciousness without access.  
     - **Note**: Block and local recurrency views share this leaf; they can't be separated here (see "Indistinguishable Pairs" below).  

  4. **Graded Awareness** (e.g., Kouider, partial-report theorists)  
     - **Answers**: Q1=Yes, Q2=Yes, Q3=Yes, Q4=Yes, Q5=No, Q6=Yes  
     - **Axis**: Constitutive  
     - **Description**: Experience isn't all-or-nothing; it can be partial or degraded (e.g., weak in blindsight, rich in partial-report). Dissociation is a matter of degree.  
