  We are to defend the position that XOR Blackmail is a bad counterexample to Causal Decision Theory (CDT) because the setup implicitly assumes that Omega's decision to send the letter is independent of the simulation's prediction. We argue that a rational blackmailer would only send letters to agents whose simulated versions pay. Therefore, receiving the letter is evidence that your simulation paid, which implies that there is no virus (since if there were, the simulation would not have paid, and hence you wouldn't have received the letter). This leads to an evidential reason to refuse, which is the same kind of reasoning used by Evidential Decision Theory (EDT) and Functional Decision Theory (FDT) proponents, but now turned against their own verdict. Moreover, this creates a fixed-point problem if everyone reasons this way.

  We then contrast with Counterfactual Mugging, where the coin flip is exogenous and does not create the same issue.

  ### Step 1: Recap of XOR Blackmail
  In XOR Blackmail, Omega (a perfect predictor) runs a simulation of you and then acts as follows:
  - If the simulation predicted you would pay, then Omega does nothing (and there is no virus).
  - If the simulation predicted you would not pay, then Omega installs a virus in your computer that will cause $1000 in damage unless you pay $100.

  However, after the simulation, Omega sends you a letter that says: "I have simulated you. If you don't pay me $100, then I will activate the virus and you will lose $1000." But note: by the time you get the letter, the virus has already been installed or not.

  The standard story is:
  - If you pay, you lose $100 and the virus is not activated (if present).
  - If you don't pay, then if the virus is present you lose $1000, otherwise you lose nothing.

  The problem: CDT (which conditions on the act) would note that paying does not cause the virus to be absent (because it's already installed or not) and so paying only costs you $100 without preventing the $1000 loss (if the virus is present). Therefore, CDT refuses to pay. However, if the virus is present, then you are predicted to refuse, so you get the virus and lose $1000. If the virus is absent, you are predicted to pay, so you pay $100. Either way, you lose money.

  But wait: if you pay, then the virus is absent (because you were predicted to pay) and so you only lose $100. If you refuse, then the virus is present and you lose $1000. So it seems that paying is better. This leads to a tension.

  The FDT/EDT camp argues that you should pay because your paying is correlated with the absence of the virus. But CDT doesn't see the correlation as causal and so refuses.

  ### Step 2: Our Critique - Screening by Omega
  We argue that the setup is flawed because Omega, being rational, would not send a letter to someone whose simulation refused. Why? Because if the simulation refused, then Omega installs the virus and does nothing else (no letter). Sending a letter costs Omega something (say, a small cost per letter). Therefore, Omega would only send the letter to those whose simulation paid. So:

  - If the simulation pays, Omega does not install the virus and sends the letter.
  - If the simulation refuses, Omega installs the virus and does not send the letter.

  Now, when you receive the letter, it is evidence that your simulation paid. Therefore, the virus is not installed. Hence, if you refuse, you don't lose anything (because no virus). If you pay, you lose $100. So you should refuse.

  But then, if everyone reasons this way, then the simulation of you would refuse. Then Omega wouldn't send the letter. But you don't get the letter? Then what? 

  We have a fixed-point problem. Let's break it down.

  ### Step 3: Fixed-Point Analysis
  Consider two types of agents:
  - Type A: They pay upon receiving the letter.
  - Type R: They refuse upon receiving the letter.

  Omega's policy (with screening):
  - Simulate the agent. If the simulation is Type A (pays), then do not install the virus and send the letter.
  - If the simulation is Type R (refuses), then install the virus and do not send the letter.

  Now, what happens when an agent of Type A gets the letter? They pay. This is consistent because the simulation of them (being Type A) paid, so they get the letter and pay.

  What happens when an agent of Type R gets the letter? They refuse. But note: if they are Type R, then the simulation of them would have refused. Then by Omega's policy, they shouldn't get the letter. But they did get the letter. Contradiction.

  Therefore, Type R agents never get the letter. So the only agents who get the letter are Type A. But then, when a Type A agent gets the letter, they pay. However, we can ask: what if they were to refuse? They don't because they are Type A.

  But now consider: if an agent of Type A were to refuse (counterfactually), what would have happened? In the actual world, they are Type A and paid. In the counterfactual, if they were to refuse, then they would be Type R. Then Omega would have simulated them as refusing (because they are Type R) and so not sent the letter and installed the virus. Then if they refuse (in the counterfactual) they would lose $1000.

  But wait: in the actual world, they are Type A and they pay $100. In the counterfactual where they refuse, they lose $1000. So paying is better? But note: in the actual world, they only have the option to pay because they are Type A and got the letter. And they pay $100 and avoid the virus (because Omega didn't install it). 

  However, we must consider the decision from the perspective of the agent who has received the letter. This agent knows: I got the letter, so my simulation must have paid (because only then does Omega send the letter). Therefore, the virus is not installed. So if I refuse, I lose nothing. If I pay, I lose $100. So I should refuse.

  But if I (the agent) decide to refuse, then I become Type R. Then my simulation (which is a simulation of me now being Type R) would have refused, so Omega would not have sent the letter. But I did receive the letter. Contradiction. So how can I be an agent who received the letter and then refuse?

  This is a fixed-point problem. The only consistent scenarios are:
  1. The agent is Type A: they get the letter and pay. Then the simulation paid, so no virus. They lose $100.
  2. The agent is Type R: they do not get the letter. Then the simulation refused, so virus is installed. They lose $1000.

  But note: in scenario 2, they don't get the letter so they don't face the decision. The only agents who face the decision are Type A. And they pay.

  But now, suppose we are at the decision node: an agent has received the letter. What should they do? They know that the only way they got the letter is if they are Type A (because Type R don't get the letter). But then, if they are Type A, they pay. However, they could consider: if I refuse, then I become Type R. Then I wouldn't have received the letter. But I did receive the letter. So the act of refusing is inconsistent with having received the letter.

  Therefore, the agent must conclude: since I have the letter, I must be the kind of agent who pays. So I pay.

  But wait: that's just following through. The agent doesn't have a real choice? They are predetermined? 

  This is the problem of logical indeterminacy. We can model it with a fixed point.

  Let P be the proposition that the agent pays. Then:
