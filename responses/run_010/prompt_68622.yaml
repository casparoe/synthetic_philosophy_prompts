prompt: |-
  I'm on the exhibitions committee at a regional natural history museum and I need to get something circulated before Thursday's meeting. We're redoing the time strip that runs the length of the entrance hall — colored bands for each geological period, in order, ending with the Holocene, which currently runs right up to a mirror at the present-day end so kids see themselves standing inside it. A donor has paid for us to add an Anthropocene band and the committe has split three ways.

  Our staff geologist says we can't do it at all. Her argument: the international stratigraphy bodies voted the formal epoch proposal down in 2024 — the one that would have started it at 1950, with the reference site in a Canadian lake — and every other band on our wall is lifted straight from the official timescale, so adding one they specifically rejected makes the whole strip something we can't defend to the school groups who use it. She does admit those same bodies said the word will keep being used to describe human impact, just not as a formal unit.

  Two others want the band but can't agree where it starts. Options on the table: agriculture, roughly 10,000 years ago; 1610, the dip in atmospheric CO2 that some tie to the collapse of Indigenous populations in the Americas and farmland going back to forest; around 1800 with coal and steam; 1950 with the bomb-test layer; the 60s. Our Indigenous advisory circle has said a 1950 seam implies nothing was happening before European industry, and separately that 1610 defines an epoch by their ancestors' deaths. Education worries that visitors will read any single printed date as the moment climate change started.

  Its a wall, though — that's the part I keep coming back to. The band has to change color at one specific point, and there's no room at a seam for a shrug.

  Draft the memo I'll put in front of them, a page and a half max. It should recommend: whether the word goes on the wall at all and in what status (a full band like the others, something visually subordinate, or no label), where the seam goes if there is one, and roughly 60 words of label copy a twelve-year-old can follow. Give the reasons, and state the geologist's objection at full strength — she'll be in the room and should recognize her own argument — then say why the recommendation survives it.
reasoning: |-
  Okay, the user is on the exhibitions committee at a natural history museum and needs to draft a memo about adding an Anthropocene band to their geological timeline display. They're facing internal disagreements about whether to include it at all and where to place the starting point. The memo needs to resolve these conflicts by Thursday's meeting. 

  First, I need to understand the core tensions. The staff geologist objects based on formal stratigraphy rejection, while others debate start dates like 10,000 BP, 1610, 1800, or 1950. Indigenous advisors criticize both 1610 (trauma-focused) and 1950 (erasure of pre-industrial impacts). Education staff worry about oversimplifying climate change origins. 

  The physical constraint is key: it's a wall requiring a single color change point. The mirror representing "now" adds symbolic weight. The donor's involvement means they can't ignore the Anthropocene entirely, but must handle it sensitively. 

  I'm leaning toward recommending inclusion because:
  - Scientific bodies explicitly endorsed continued informal use
  - Excluding it would misrepresent current scientific discourse
  - The mirror endpoint already implies human-centeredness

  For the design, a subordinate band (dashed line) addresses the geologist's concern while acknowledging reality. 1950 is the least bad start date because:
  - It's the only marker with global geological traces (nuclear isotopes)
  - Avoids tying epochs to human tragedy (1610) or Eurocentric milestones (1800)
  - Recent date visually shrinks the band, subtly signaling its contested nature

  The label copy must simplify without oversimplifying. Focusing on "accelerated change" and "global markers" sidesteps debates about ultimate origins. Mentioning "scientists disagree" preempts challenges. 

  For the memo structure: lead with the geologist's argument at full strength to validate her expertise, then explain why practical science communication overrides pure formalism. Emphasize that the mirror already frames the present as human-influenced - consistency demands we acknowledge this. 

  The Indigenous advisors' concerns about pre-1950 erasure are valid, so the label must explicitly note earlier human impacts. This turns a weakness into educational nuance. 

  Final check: does this satisfy the donor? Yes - the term appears prominently. Does it respect science? Yes - by marking 1950's unambiguous geological signals. Is it responsible pedagogy? Yes - by naming complexity in simple terms. 

  The dashed line is the real genius move - it visually whispers "this is different" without needing lengthy explanations.
answer: |-
  **MEMORANDUM**  
  To: Exhibitions Committee  
  From: [Your Name/Position]  
  Date: [Date]  
  Subject: Recommendation: Anthropocene Representation on Entrance Hall Timeline  
  **Deadline: Thursday Meeting**  

  ---

  ### **The Geologist’s Objection (Stated at Full Strength)**  
  Dr. [Geologist’s Name] rightly emphasizes that the International Union of Geological Sciences (IUGS) rejected a formal "Anthropocene" epoch designation in 2024. Our timeline’s existing bands are drawn *directly* from the ratified Geological Time Scale. Adding a band for a formally rejected unit undermines scientific rigor and exposes us to valid criticism from educators and students who rely on our accuracy. While the IUGS acknowledges "Anthropocene" as an informal term for human impact, it has no defined start date or stratigraphic boundary. Placing it alongside formal epochs risks misrepresenting consensus science.  

  ---

  ### **Recommendation: Include "Anthropocene" as a Subordinate Band Starting at 1950**  
  Despite the objection, **we recommend adding the Anthropocene as a visually distinct, subordinate band starting at 1950**, rendered as a dashed or textured line (e.g., ###) contrasting with solid formal-period bands.  

  #### **Reasons:**  
  1. **Scientific & Educational Relevance**:  
     - The IUGS explicitly endorsed "Anthropocene" as a *cultural and informal scientific term*. Omitting it ignores the central narrative of human-driven planetary change—a core focus of modern natural history.  
     - 1950 anchors the band to the "Great Acceleration" of industrial materials (plastics, concrete) and radionuclides from atomic tests—a globally synchronous geological marker even if not ratified.  
     - **Subordinate styling** respects stratigraphic formalities while acknowledging ongoing scientific debate.  

  2. **Addressing Indigenous & Ethical Concerns**:  
     - A 1950 start *avoids defining an epoch by Indigenous tragedy* (e.g., 1610’s population collapse) and rejects Eurocentrism (e.g., 1800 Industrial Revolution).  
     - The label (below) explicitly notes earlier human impacts, preempting erasure.  

  3. **Practical Constraints**:  
     - The wall requires a single seam. 1950 is the most defensible *global* marker with unambiguous stratigraphic signals (unlike agriculture or 1610).  
     - A dashed line signals "provisional" status, avoiding false equivalence with formal epochs.  

  4. **Visitor Clarity**:  
     - Starting at 1950 avoids misleading visitors that climate change "began" here (label addresses acceleration, not origin).  

  ---

  ### **Label Copy (60 Words; Target Age: 12)**  
  > **ANTHROPOCENE?** (dashed band from 1950 to mirror)  
  > *Humans now change Earth’s land, water, air, and life faster than natural forces. Scientists debate if this is a new geological epoch. This band marks the "Great Acceleration" (1950–present), when plastics, concrete, and nuclear fallout left global traces in rocks. Human impacts began earlier, but now we see their planet-wide effects. You’re in it!*  

  ---

  ### **Why This Survives the Geologist’s Objection**  
  This approach **separates scientific consensus from active discourse**. The dashed line and "?" visually subordinate the Anthropocene to ratified epochs, while the label’s phrasing ("debate," "traces") reflects its provisional nature. We uphold rigor by:  
  - Not presenting it as peer-approved with other epochs.  
  - Citing the IUGS’s own acknowledgment of the term’s informal use.  
  - Grounding the 1950 start in measurable stratigraphic evidence (nuclear isotopes), even if non-ratified.  
  The wall remains defensible as it shows science *in process* without equating evidence with formal acceptance—critical for engaging students on evolving ideas.  

  ---  
  **Approval:** Seek committee consensus on Thursday to finalize artwork by [upcoming deadline].  
  **Attachment:** Mock-up of dashed band + label.
