prompt: |-
  I am seventeen, in my last year of high school, and I sit on our school's peer accountability board: a student panel that hears cases in which one student alleges that another has breached a community standard — copying lab data, damaging someone's property, engineering another student's exclusion from a team. Roughly once a term, the student who has been reported does not deny the allegation but turns it back on the person bringing it. "You did the same thing in ninth grade." "You're the one who gained the starting spot from it." "You've said publicly that you don't think this rule should exist." Our faculty adviser tells us to set such replies aside as beside the point, and about half the board agrees; the other half thinks they can be decisive. Before I take a side in that argument, I want to know what should be demanded of any account of standing to blame — a specification I could hold proposals against, including proposals nobody has written yet.

  So please set out the desiderata for a theory of standing to blame: the phenomena it must explain, the verdicts it must deliver in particular cases, the distinctions it must not collapse, and the ordinary facts about blame it must remain consistent with. Each requirement should come with the case or consideration that motivates it, and a sentence on what goes wrong for a theory that fails it. I am not asking for a survey of the debate, and I cannot check references, so please describe positions by their content rather than by author or title, and leave out bibliographies and reading lists entirely.

  Among the cases I have made up for myself, please tell me which belong in the data set a theory has to fit and which I should discard as confused. They are deliberately not the standard illustrations:

  - Priya falsified a results table in ninth grade, was caught, served the consequence, wrote the reflection, and has not done it since. In eleventh grade she reports another student for exactly that. Her target says she has forfeited any right to speak. Has she — and if not, what restored it, and on what date?
  - Nadia never broke the rule in question, but she knowingly kept the benefit her rival's breach handed her, and she is now the loudest voice condemning the rival.
  - Marcus is entirely entitled to object but cannot bring himself to, so he drafts the objection and has a classmate with no history of the offense deliver it verbatim. Can standing be handed over like that, and if so, does the deliverer acquire it or merely lend a mouth?
  - The same Priya also thinks badly of herself in private. Does whatever would disqualify her from addressing another disqualify her from addressing herself, and if not, what is the difference made of?
  - A student who believes our phone policy is unjust and says so at every assembly nevertheless reports someone under it. Their target says: you do not even accept the standard you are invoking.
  - Two students did the same thing; one did it once four years ago, one does it weekly. Does the theory have room for that difference, or only for a yes/no?

  Also tell me which requirements are non-negotiable and which are really the preferences of one camp — for instance, whether a theory must explain the *feeling* of force behind "you did it too" or only its normative status; whether it must leave the accused's culpability completely untouched; whether standing has to come in degrees; whether it must be a property of a person or can be a property of a particular act of blaming in a particular relationship. If some subset of the desiderata turns out to be jointly unsatisfiable, say so explicitly and give the argument, because that result would matter to me more than any of the individual items. And identify the single requirement that does the most work in eliminating candidate accounts.

  One further wrinkle. My purpose is practical, and adequacy depends on purpose: whatever account I end up defending has to be translatable into a rule a panel of sixteen-year-olds can apply in public, without interrogating anyone's private moral history or grading their character. That seems to add demands of its own — publicity, operability, some limit on how much of a person's past is admissible. Please say plainly whether those belong on the list as genuine desiderata for a theory of standing, or whether they are only constraints on my institution and would be a category error to build into the theory itself.

  Finish, briefly and only if the list permits it, with a paragraph each on how the main available explanations fare against it: the view that keys lost standing to the blamer's own wrongdoing, the view that keys it to the blamer's failure to hold herself to the standard she invokes, the view that treats blame as a form of address that presupposes some relationship, and the view that there is no such thing as standing and that the intuition is an artifact. Keep this short — the criteria are what I actually need.
reasoning: |-
  Okay, the user is a seventeen-year-old high school student involved in their school's peer accountability board. They're dealing with cases where the accused student deflects blame by pointing out the accuser's past actions or hypocrisy. The user wants a clear set of criteria to evaluate theories of standing to blame—essentially, what makes someone qualified to hold another accountable. They've presented several hypothetical cases and want to know which should be considered valid data points for such a theory.

  The user is intellectually mature, seeking philosophical rigor but with practical application in mind. They need a theory that can be operationalized by teenagers without delving into personal histories. Their deeper need is likely for a fair, consistent framework that maintains the board's legitimacy while handling deflections efficiently. They might also be grappling with ethical consistency in their role.

  Looking at their cases: Priya's past violation (if reformed) shouldn't disqualify her, highlighting the need for reform/redemption considerations. Nadia benefiting from a breach suggests complicity undermines standing. Marcus delegating blame questions if standing is transferable. Private vs. public blame distinction matters for hypocrisy. Challenging a rule while enforcing it creates a consistency dilemma. Frequency of violation versus one-time offenses points to proportionality in standing.

  Key desiderata include explaining how personal history affects standing, distinguishing hypocrisy from valid criticism, accommodating reform, addressing complicity, and maintaining consistency. The publicity and operability constraints are institutional, not theoretical—the theory must be adaptable to these.

  The clean hands theory fails if it doesn't allow for reform. Hypocrisy theories struggle with rule-challengers enforcing rules. Relational theories must explain impersonal blame. The no-standing view ignores the intuitive weight of "you did it too."

  The hypocrisy theory is the most promising if it focuses on current consistency rather than past sins. For the board, prioritizing current commitment to rules and avoiding complicity can create operable guidelines without intrusive history checks.
answer: |-
  Here are the desiderata for a theory of standing to blame, structured for your purpose. I'll evaluate your cases, mark non-negotiable requirements, identify conflicts, and assess major theories against the criteria.

  ### Core Desiderata (What a Theory MUST Explain/Do)
  1.  **The Deflection Intuition:** *Motivation:* Cases like Priya (9th grade) and Nadia (benefiting) generate a strong intuitive sense that the blame feels inappropriate or "dirty," even if the accusation is factually correct. *Failure:* A theory that cannot explain why "you did it too" or "you benefited" feels like a relevant rebuttal (beyond just attacking credibility) is inadequate.
  2.  **Distinguish Culpability from Standing:** *Motivation:* The accused's guilt or innocence is a separate question. Standing concerns the *blamer's* position to raise it. *Failure:* A theory collapsing standing into culpability (e.g., "only the innocent can blame") is flawed; it prevents holding genuinely guilty parties accountable via legitimate blamers.
  3.  **Accommodate Reform/Redemption:** *Motivation:* Priya (11th grade). A reformed wrongdoer should arguably regain standing to object to the *same* wrong. *Failure:* A theory permanently disqualifying anyone who ever committed the offense is implausible and paralyzing.
  4.  **Address Hypocrisy (Current & Relevant):** *Motivation:* The student challenging the phone rule while reporting under it. Blaming while *currently* rejecting/flouting the standard *oneself* seems problematic. *Failure:* A theory ignoring whether the blamer *currently* endorses and adheres to the standard they invoke fails a key moral intuition.
  5.  **Account for Complicity/Complacency:** *Motivation:* Nadia (keeping the benefit). Profiting from a wrong without protest can undermine standing to later condemn the wrongdoer, especially if condemnation is self-serving. *Failure:* Treats blame as a spectator sport, ignoring the blamer's potential involvement in the wrongdoing's context or effects.
  6.  **Explain the Relational Nature (Sometimes):** *Motivation:* Why we care more about hypocrisy from someone close or similarly situated than a stranger. *Failure:* A theory treating all potential blamers identically (e.g., stranger vs. co-conspirator) misses a core aspect of how standing operates socially.
  7.  **Allow for Self-Blame:** *Motivation:* Priya thinking badly of herself. Self-blame seems fundamentally different; one cannot be hypocritical *towards oneself* in the same way. *Failure:* A theory disqualifying self-blame based on lack of "standing" is deeply counterintuitive.
  8.  **Preserve Normative Force:** *Motivation:* The core *wrongness* of the act shouldn't vanish just because the blamer lacks standing. The standard exists independently. *Failure:* A theory making the wrongness *depend* on the blamer's standing is mistaken.

  ### Non-Negotiable Requirements
  Desiderata 1, 2, 4, 7, and 8 are non-negotiable. A theory *must* explain the intuition behind deflection (1), keep standing distinct from culpability (2), explain why *current* hypocrisy matters (4), allow for self-blame (7), and preserve the independent wrongness of the act (8). Failure on any of these renders the theory fundamentally flawed.

  ### Evaluated Cases (Included/Discarded)
  *   **Priya (9th grade past):** **IN.** Tests reform/redemption (Des. 3) and the core deflection intuition (Des. 1). Key data.
  *   **Nadia (Kept Benefit):** **IN.** Tests complicity/complacency (Des. 5) and deflection (Des. 1).
  *   **Marcus (Delegated Blame):** **IN.** Tests if standing is personal or transferable. Challenges Des. 6 (relational nature)? Likely shows standing isn't easily transferable.
  *   **Priya (Self-Blame):** **IN.** Essential for testing Des. 7.
  *   **Rule-Challenger Reports:** **IN.** Core test for hypocrisy (Des. 4) and deflection (Des. 1).
  *   **Frequency Difference:** **IN.** Tests if standing is binary or matters of degree (relevant to Des. 3 & 5). A theory should accommodate this nuance.

  ### Key Distinctions & Degrees
  *   A theory **must not collapse** the distinction between *having committed a past wrong* (possibly reformed) and *currently rejecting the standard* (hypocrisy). (Priya vs. Rule-Challenger).
  *   A theory **must not collapse** the distinction between *being culpable* and *having standing to blame*.
  *   Standing **likely comes in degrees** (Nadia's complicity vs. active perpetrator; frequency difference). A purely binary theory is less plausible.
  *   Standing is likely **primarily a property of the *person* in the *relationship*** to the wrong and the wrongdoer, not just the *act* of blaming. (Marcus delegation seems odd; closeness matters).

  ### Potential Conflict & The Key Eliminator
  *   **Conflict:** The demand to **accommodate reform** (Des. 3) can conflict with strong interpretations of **hypocrisy-based views** (Des. 4) if they define hypocrisy too broadly (e.g., any past violation). Similarly, **complicity** (Des. 5) might undermine standing even for the reformed (Priya reporting *after* benefiting years ago?).
  *   **Key Eliminator:** Desideratum **#4 (Address Hypocrisy - Current & Relevant)** does the most work. A theory that cannot explain why *currently* flouting or rejecting the standard undermines standing is easily defeated by the Rule-Challenger case. It must focus on *present* commitment.

  ### Publicity & Operability: Category Constraint
  The requirements for **publicity, operability, and limiting past history admissibility** are **institutional constraints for your panel, NOT core desiderata for the theory itself.** Building them into the *theory* would be a category error. A good theory explains the underlying moral phenomenon; your institution then needs *rules* derived from it that meet these practical needs. (E.g., a theory might say complicity matters, but your rule might limit admissible history to the current school year for feasibility).

  ### How Major Theories Fare (Briefly)
  1.  **Clean Hands (Lost via Wrongdoing):** Fails **Reform** (Des. 3) if permanent, fails **Hypocrisy** (Des. 4) if it ignores *current* rejection of the standard (Rule-Challenger), struggles with **Complicity** (Des. 5 - Nadia). **Self-Blame** (Des. 7) is problematic.
  2.  **Hypocrisy (Failure to Self-Apply):** Strong on **Hypocrisy** (Des. 4 - Rule-Challenger) and **Deflection** (Des. 1). Can handle **Reform** (Des. 3) if focused on *current* self-application. May struggle with **Complicity** (Des. 5 - Nadia didn't *break* the rule, just benefited). **Self-Blame** (Des. 7) is clearly different.
  3.  **Relational (Proper Address within Relationship):** Strong on **Deflection Intuition** (Des. 1 - explains why "you too" matters more coming from a peer) and **Distinction** (Des. 2). Explains **Marcus** (Des. 6 - standing isn't easily delegated). Can handle **Reform** (Des. 3 - relationship repaired). May struggle to fully explain **Hypocrisy** (Des. 4) or **Complicity** (Des. 5) independently of the relationship context. **Self-Blame** (Des. 7) fits the "relationship to self".
  4.  **No Standing (Artifact):** Denies **Deflection Intuition** (Des. 1) is normative, reducing it to psychology or bad argument. Utterly fails core data. Cannot explain why we care about hypocrisy/complicity in assigning blame roles. Fails **Preserve Normative Force** (Des. 8) by dismissing the intuition entirely.

  **Conclusion for Your Panel:** The Hypocrisy view (focusing on *current* commitment to and adherence to the standard invoked) and the Relational view offer the most promise, as they best handle the core non-negotiables (especially Deflection Intuition, Distinction, Hypocrisy, Self-Blame). Both can be adapted into operable rules respecting your institutional constraints (e.g., "Focus on whether the reporter currently endorses and follows the rule themselves *now*", "Consider the reporter's direct involvement or benefit from *this specific incident*"). Avoid theories like Clean Hands that permanently disqualify based on past sins.
