answer: |-
  Here are the desiderata for an adequate karmic theory of moral desert, structured as requested. I've categorized them by your prompts, added missing requirements, assessed negotiability, and identified tensions.

  ---

  ### **I. Cases & Their Requirements**
  1.  **Cruel Prosperer (Requirement R1):** The theory must explain why an agent’s lifelong cruelty *failing* to result in proportional suffering/decline in this life does *not* falsify the core claim that outcomes non-accidentally fit actions.
      *   **Case:** A cruel person lives prosperously and dies comfortably.
      *   **Negotiability:** Non-negotiable. A theory unable to address this either abandons fittingness or relies on empirically unsupported mechanisms (e.g., "hidden suffering"). *Failure here risks vacuity.*

  2.  **Innocent Sufferer (Requirement R2):** The theory must explain intense, undeserved suffering (e.g., congenital disease, abuse) without attributing desert *to the sufferer* in a way that contradicts their apparent innocence or capacity.
      *   **Case:** An infant born into severe, unearned suffering.
      *   **Negotiability:** Non-negotiable. Blaming the infant is morally repugnant and rationally unsupported. The theory must either deny desert applies here, attribute desert non-individually (risking R7), or defer deserts beyond this life (risking testability/identity issues - R7/R10).

  3.  **Sincere Disaster (Requirement R3):** The theory must distinguish the fittingness of an *outcome* from the moral quality of the *intention/agent* when they conflict.
      *   **Case:** A well-intentioned act (e.g., donating tainted food) causes widespread harm.
      *   **Negotiability:** Non-negotiable. Collapsing act-quality and agent-quality (or outcome-fittingness and intention) destroys key moral distinctions. Karma must account for "tragic" misfires without making them deserved by the agent.

  4.  **Transformed Wrongdoer (Requirement R4):** The theory must address whether desert adheres to the *act* or the *current agent*, especially when identity/personality changes radically.
      *   **Case:** A reformed criminal (genuinely new character) receives severe "karmic payback."
      *   **Negotiability:** Negotiable, but critical for coherence. Some theories tie desert to acts (punishing the "old self" is incoherent if no self persists - R11), others to character (making desert forward-looking/reformative, risking R13). *Denying persistence (R11) forces resolution here.*

  5.  **Ancestral Injustice (Requirement R5):** The theory must explain how benefits derived from historical injustice can be "fitting" for descendants who didn’t commit the acts.
      *   **Case:** Community prospering from ancestors' genocide/enslavement.
      *   **Negotiability:** Negotiable. Karma might deny collective desert (R13) or embrace it (risking fairness). *Requires clarity on transfer/pooling (R13).*

  ---

  ### **II. Distinctions That Must Not Collapse**
  6.  **Desert vs. Causal Consequence (Requirement R6):** The theory must provide criteria distinguishing an outcome being a *fitting desert* from merely being a *causal result* (e.g., drunk driver crashes vs. drunk driver wins lottery).
      *   **Case:** Any undeserved windfall or suffering (e.g., cruel prosperer - R1).
      *   **Negotiability:** Non-negotiable. Without this, "karma" is just causality dressed up. Requires a normative link beyond causation.

  7.  **Fittingness vs. Instrumental/Educative Value (Requirement R7):** The theory must distinguish an outcome being *intrinsically fitting* (desert) from it being *useful for reform/deterrence* (consequentialism) or *character-building*.
      *   **Case:** Punishing the reformed wrongdoer (R4) might deter others but isn’t fitting for *them* now. Infant suffering (R2) might "build character" but isn’t deserved.
      *   **Negotiability:** Non-negotiable. Collapsing this turns karma into covert consequentialism or pedagogy, abandoning desert.

  8.  **Attributability vs. Accountability (Requirement R8):** The theory must distinguish an act being *traceable* to an agent (attributability) from the agent being *appropriately subject to desert* based on it (accountability), considering capacity, knowledge, and context.
      *   **Case:** Sincere disaster (R3) - act attributable, but is disaster deserved? Infant (R2) - suffering attributable to causal chains, but not accountable.
      *   **Negotiability:** Non-negotiable. Essential for fairness and avoiding crude "act = desert" models. Karma must define the conditions for accountability.

  9.  **Moral Quality of Act vs. Agent (Requirement R9):** The theory must account for discrepancies between the moral status of a *specific act* and the *overall character* of the agent.
      *   **Case:** A generally virtuous person commits a serious wrong; a generally vicious person performs a noble act.
      *   **Negotiability:** Non-negotiable. Tied to R3 & R4. Collapsing act/agent quality ignores moral complexity and temporal development.

  10. **Backward-Looking Desert vs. Forward-Looking Reform (Requirement R10):** The theory must clarify if desert is solely about *rectifying past acts* or inherently incorporates *future effects* (reform, deterrence).
      *   **Case:** Transformed wrongdoer (R4) - backward desert demands punishment, forward-looking might not.
      *   **Negotiability:** **Crucially Negotiable.** Traditional karma leans backward-looking (retributive). Insisting on pure backward-lookingness may be a "retributivist reflex" (your suspicion). A viable karma *could* incorporate forward elements without collapsing into consequentialism (e.g., deserts shape future opportunities for growth), but must explain why it's still *desert*.

  ---

  ### **III. Structural Questions & Requirements**
  11. **Mechanism & Proportionality (Requirement R11):** The theory must specify *how* proportionality between act-quality and outcome-quality is achieved without an intelligent apportioner, or justify why such an apportioner is necessary.
      *   **Consideration:** Natural law? Cosmic principle? Divine accountant? Proportionality seems to demand a "proportioner."
      *   **Negotiability:** Non-negotiable for coherence. It's the core puzzle. Naturalist theories struggle most here.

  12. **Personal Identity (Requirement R12):** If the theory relies on persistence (e.g., multi-life), it must define what constitutes "the same agent" across time/rebirths sufficient for desert to apply. If it denies a persisting self, it must explain what desert attaches *to* (e.g., causal sequences, momentary agents bearing karmic debt).
      *   **Consideration:** Infant suffering (R2), transformed wrongdoer (R4), lack of memory (R15).
      *   **Negotiability:** Non-negotiable. Desert presupposes a subject. Denying persistence demands a radical reconception (e.g., desert attaches to interdependent processes).

  13. **First Cause & Pooling/Transfer (Requirement R13):** The theory must address the origin of karmic burden/merit and whether desert can be meaningfully applied to collectives (lineages, nations) or transferred between agents (e.g., parent/child).
      *   **Consideration:** Ancestral injustice (R5), infinite regress of causes, individual vs. collective responsibility.
      *   **Negotiability:** **Negotiable, but defining.** A theory denying transfer/pooling (focusing purely on individual acts) struggles with R5. One allowing it risks injustice (punishing innocents for others' deeds). A beginningless series avoids a "first cause" problem but raises R12 issues.

  14. **Memory & Recognition (Requirement R14):** The theory must explain how an outcome can be a "payment" (desert) rather than an "accident" if the recipient lacks memory of the deed it supposedly pays for.
      *   **Consideration:** Transformed wrongdoer (R4), multi-life karma, infant suffering (R2).
      *   **Negotiability:** **Potentially Negotiable.** Memory may not be essential *if* the link is structural (e.g., the outcome inherently "fits" the act's nature within a cosmic order, irrespective of memory). However, losing memory undermines the *experiential* aspect of "receiving one's due."

  ---

  ### **IV. Data It Must Not Contradict (Added Requirement)**
  15. **Empirical Disconnect (Requirement R15):** The theory must account for the stark lack of observable correlation in *this life* between apparent moral merit/demerit and worldly fortune/suffering.
      *   **Datum:** Widespread observation of good people suffering, bad people prospering (R1). Spontaneous judgments of desert often contradict observed outcomes.
      *   **Negotiability:** Non-negotiable for any empirically grounded theory. Multi-life karma addresses this by deferring deserts; deflationary karma reinterprets "fortune"; naturalist karma struggles fatally here.

  ---

  ### **V. The No-Go Result & Key Tensions**
  *   **The Unsatisfiable Triad:**
      1.  **R4 (Proportionality):** Outcomes must be proportionally fitting to the moral quality of acts.
      2.  **R11 (Natural Mechanism):** No intelligent apportioner; mechanism must be purely natural.
      3.  **R15 (Empirical Disconnect):** Acknowledges the lack of observable proportional outcomes in this world.

  *   **Why Unsatisfiable?** R4 demands proportionality. R11 forbids an intelligent force ensuring it. R15 observes it demonstrably doesn't occur naturally in the observable world. Naturalist karma (relying on R11) is crushed between R4 and R15.

  *   **Escape Route & Cost:** Abandon **R11 (Natural Mechanism)**. Allow for an intelligent apportioner (divine administrator) and/or multi-life framework.
      *   **Cost:** Sacrifices naturalism/compatibility with scientific worldview. Invokes unobservable entities/realms, reducing testability and raising theodicy-like problems (if apportioner is benevolent/just, why R2/R1?).

  *   **Most Exclusionary Requirement:** **R15 (Empirical Disconnect)**. It immediately disqualifies any naive, purely this-worldly, naturalist karmic theory claiming observable deserts. Multi-life and deflationary theories exist largely to evade R15.

  *   **Proportionality (R4): Retributivist Reflex?** Potentially yes. The *demand* for strict, quantifiable proportionality ("eye for an eye") feels retributivist. A karmic theory *might* shed strict R4 by embracing:
      *   **Non-Retributive Fittingness:** Outcomes "fit" as natural consequences conducive to learning/growth, not necessarily proportional punishment/reward (closer to educative, but distinct via R7). E.g., cruelty breeds isolation/isolation fosters insight.
      *   **Holistic Process:** Desert manifests over vast time/spans of existence (multi-life), where strict act-to-outcome proportionality is less relevant than overall movement towards understanding/liberation.
      *   **Cost of Shedding R4:** Moves significantly away from common intuitive (retributivist) understandings of desert. May become unrecognizable as "desert" to many.

  *   **Framing Bias:** Your list understandably emphasizes fairness and current suffering (R2, R4, R15), which inherently challenges karmic theories grounded in unseen mechanisms or vast timescales. It leans towards individualistic, act-based desert, potentially disadvantaging collectivist (R5, R13) or process-oriented/character-based interpretations.

  ---

  ### **VI. Contender Scoring (Closing Paragraph)**
  *   **Purely This-Worldly Naturalist Karma:** Fails R15 catastrophically and struggles with R11/R4. Inadequate.
  *   **Administered Karma (Divine Apportioner):** Evades R11/R15 by invoking supernatural oversight. Still struggles mightily with R2 (theodicy) and R4 (proportionality/justice of apportioner's methods).
  *   **Multi-Life Karma:** Best addresses R1, R2, R5, R15 by deferring deserts. Grapples profoundly with R12 (identity) and R14 (memory/recognition). R4 (proportionality) becomes metaphysically complex.
  *   **Deflationary Karma (Discipline of Attention):** Sidesteps R4, R11, R15 by redefining karma as cultivating awareness of cause/effect (act/intention -> mental habit -> experience), not cosmic desert. Avoids many traps but abandons core "fittingness" as desert (R6, R7), becoming a different project.
