prompt: |-
  Every time I read something about whether my own choices actually matter — flying, beef, whether to bother voting — it picks one case, gives one answer, and I dont trust it. So before I read another take I want to know what I should even be demanding of an account here. Write the spec: what any theory of when an individual act is wrong because of what it contributes to a collective harm has to deliver. For each requirement, give the case or the worry behind it, and mark whether it's non-negotiable or just something one camp happens to care about.

  Things I'd expect on the list, feel free to add or throw out: it has to handle the act that makes no difference because the same thing would have happened anyway (the extra steak at the buffet that was going in the bin regardless); it has to handle the pile-up where no single act crosses any threshold but a hundred thousand of them do; it cant just collapse "made no difference to anyone" into "did nothing wrong", or run it the other way; it has to give a sensible verdict on voting, where the chance of being decisive isn't tiny in the same sense as in the buffet case; it has to be usable by a normal person who can't see the harm, doesn't know where the thresholds are, and isn't going to run expected-value math on a burger; and it should explain why the same amount of harm feels wierdly okay when I do it as part of a group or system I belong to.

  Then: which single requirement kills off the most of the answers people actually give, and is any subset of these jointly unsatisfiable? I half suspect "usable by an ordinary person with limited information" and "tracks actual causal contribution" can't both be had, and if that's true then the list is itself the result, which is fine by me.

  Purpose, since adequacy depends on it: I want a theory good enough to organize my own decisions with, not a metaphysically elegant one. A line at the end on how the main contenders score is welcome but it's not the point.

  And push back if you want to. If some of what I listed isn't a real requirement, or if writing the spec first is just a way of avoiding actually having a view, say that plainly instead of playing along.
reasoning: |-
  Okay, the user is asking for a specification for evaluating theories about individual responsibility in collective harm situations. They want clear criteria to assess different philosophical approaches. Let me unpack their query.

  First, they mention several key concerns: acts that make no difference (like extra steak at a buffet), threshold effects (where individual acts pile up), the difference between "no difference" and "not wrong", voting as a special case, practical usability, and the psychological aspect of group participation. These are all valid points that need to be addressed.

  The user seems frustrated with oversimplified answers to complex ethical questions. They're looking for a framework robust enough to handle real-world decision-making, not just theoretical elegance. Their mention of "organizing my own decisions" suggests practical application is paramount.

  I notice they're self-aware about possibly using the "spec" as avoidance. That's insightful - they genuinely want tools for decision-making, not endless theorizing. Their background appears philosophically literate but skeptical of academic solutions that ignore real-world constraints.

  For the spec, each requirement needs: the underlying case/worry, and whether it's non-negotiable or contested. The buffet example tests counterfactual impact. Threshold problems (like microplastic pollution) challenge minimal contribution arguments. The voting case is crucial because while probability is low, stakes are high, unlike the buffet. Usability is key - if a theory requires perfect information or complex math, it's useless for daily choices. The group participation paradox (why harm feels different in groups) may be psychological but needs addressing.

  The tension between "usable by ordinary people" and "tracks actual causation" seems fundamental. Most theories sacrifice one for the other. For instance, expected value calculations might be accurate but impractical, while simple rules (like "don't participate in harmful systems") may lack nuance.

  I'll structure this as a clear spec document with must-haves versus nice-to-haves. The voting and usability requirements will likely eliminate most common answers - either they become absurdly demanding or disconnect from real impact. The group psychology point might be negotiable since it's more about perception than ethics, but it's important for implementation.

  The conclusion should acknowledge that no theory satisfies all perfectly, but some balance better than others. Rule-consequentialism and participation-focused approaches offer different trade-offs worth exploring further.
answer: |-
  Here's a rigorous spec for evaluating theories of individual moral responsibility in collective harm scenarios, designed to equip you for assessing real-world arguments. Each requirement is grounded in a specific case or worry, with its negotiability marked.

  ### Non-Negotiable Requirements (Core Adequacy)

  1.  **Handle Non-Difference Cases (The Buffet Steak):**
      *   **Case/Worry:** Buying the last steak at a buffet that would otherwise be thrown out causes no additional harm (no extra cow is killed, no extra emissions from disposal vs. eating). Yet, intuitively, it *feels* different from rescuing discarded food. A theory must explain why this act might still be problematic *or* definitively justify why it's permissible, without hand-waving.
      *   **Negotiability:** Non-negotiable. Any theory collapsing "no difference" directly into "no wrong" or "always wrong" fails immediately. It must grapple with the causal structure.

  2.  **Handle Threshold Effects & Marginal Contributions (The Microplastic/N2O Molecule):**
      *   **Case/Worry:** My single car trip's CO2, the N2O from one fertilizer application, or one microplastic fiber flushed seem vanishingly small. No threshold is crossed by *my* act alone. Yet, millions of such acts cause massive harm (climate change, dead zones, ocean plastic). A theory must explain how my act, though miniscule individually, contributes to the harm and can be wrong.
      *   **Negotiability:** Non-negotiable. This is the quintessential collective harm problem. Theories that *only* recognize harms crossing individual thresholds are useless here.

  3.  **Avoid "No Difference = No Wrong" Collapse:**
      *   **Worry:** Simply defining wrongness *solely* by whether the world would have been worse if I alone had acted differently (the counterfactual test). This lets virtually all individual acts in large-scale collective harms off the hook (Buffet Steak, Molecule cases), which seems deeply unsatisfying and paralyzes moral action.
      *   **Negotiability:** Non-negotiable. This is the fatal flaw of naive counterfactual-only approaches. A theory must offer a *reason* why contributing to a bad collective outcome can be wrong even if my specific contribution made no detectable difference.

  4.  **Avoid "Participation = Automatic Wrong" Collapse:**
      *   **Worry:** Defining wrongness *solely* by participating in a harmful practice or system ("Buying beef is always wrong," "Flying is always wrong"). This ignores context (Buffet Steak), necessity, lack of alternatives, proportionality, and risks absurdity (e.g., breathing emits CO2, therefore breathing is wrong?).
      *   **Negotiability:** Non-negotiable. While participation is crucial, a theory that *only* relies on this without nuance becomes impractical and overly demanding.

  5.  **Provide a Sensible Verdict on Voting:**
      *   **Case/Worry:** Voting has an *extremely* low probability of being decisive, but the stakes are astronomically high. It feels categorically different from buying a steak or flushing a plastic fiber. A theory must explain why voting is typically seen as a strong moral duty despite the low individual impact probability, without resorting to magic (e.g., "it just is!") or collapsing into point 3 ("no difference, so no duty").
      *   **Negotiability:** Non-negotiable. Voting is a critical test case where low probability meets high stakes. A theory must handle it plausibly.

  ### Highly Desirable Requirements (Practicality & Psychological Realism)

  6.  **Usability Under Uncertainty & Bounded Rationality (The Burger Math Problem):**
      *   **Worry:** A theory requiring precise knowledge of thresholds, exact probabilities of being decisive, or complex expected value calculations for everyday acts (like eating a burger) is useless. Ordinary people lack this information and cognitive bandwidth. The theory must offer practical guidance rules or heuristics that work under ignorance.
      *   **Negotiability:** Highly desirable, bordering on non-negotiable for your purpose ("organize my own decisions"). A theory only usable by ethicists with perfect information fails you.

  7.  **Grapple with the Group Participation Effect:**
      *   **Worry:** Why does driving alone feel worse than taking an equally polluting bus seat? Why does eating beef at a BBQ feel less bad than eating it alone? A theory should acknowledge or explain this psychological phenomenon where harm *feels* less attributable or wrong when embedded in a group activity or system, even if the individual contribution is identical.
      *   **Negotiability:** Desirable, but negotiable. This is more about psychological explanation than strict moral logic, but a *good* theory for personal use should address the feeling, even if to debunk it or explain its origin (e.g., diffusion of responsibility, perceived normality).

  ### The Executioner: Which Requirement Kills the Most Theories?

  **Requirement #6 (Usability Under Uncertainty)** is the most lethal. It eliminates:

  1.  **Pure Expected Value Maximization:** Requires calculating low-probability/high-impact events (voting, climate tipping points) and precise marginal harms (CO2 per burger) – utterly impractical daily.
  2.  **Threshold-Based Theories:** Require knowing where thresholds are (how much CO2 until the next tipping point? How many votes until a swing state flips?) – information individuals never have.
  3.  **Sophisticated Counterfactuals:** Many nuanced accounts still rely on probabilistic assessments of impacts or system states that are inaccessible.

  **Requirement #3 (Avoiding "No Difference = No Wrong")** is a close second, killing simplistic counterfactual-only views popular in some economic/lay reasoning.

  ### Are Some Requirements Jointly Unsatisfiable?

  Your suspicion is astute. **Requirement #6 (Usability) and Requirement #2/3 (Effectively Handling Marginal Contributions without collapsing to "no difference = no wrong") are in significant tension.**

  *   **The Conflict:** Accurately "tracking causal contribution" (the core of #2/3) in collective harms often *requires* probabilistic reasoning or system-level analysis. This directly conflicts with "usable by an ordinary person" (#6) who can't do that math or access that data. A theory prioritizing precise causal contribution becomes unusable; a theory prioritizing simplicity risks oversimplifying or misrepresenting the causal structure (e.g., resorting to crude rules like "always avoid X").
  *   **Possible Resolution?** Theories often bridge this gap with **rules or heuristics** derived *from* the complex causal analysis but designed *for* practical use under uncertainty (e.g., "Avoid flying where feasible alternatives exist because, probabilistically, it significantly contributes to a massive harm"). The *derivation* satisfies #2/3, the *rule* satisfies #6. How well this works is theory-dependent.

  ### How Main Contenders Score (Briefly)

  *   **Expected Value Utilitarianism (EVU):** Strong on #2, #3 (if done right), #4 (context matters), #5 (low prob * high stakes = significant EV). **Fails catastrophically on #6 (usability).** Weak on #7.
  *   **Rule Consequentialism (RC):** Strong on #1 (rules can forbid wasteful consumption), #2 (rules based on collective impact), #3 (wrong to violate beneficial rules), #4 (rules define permissible participation), #5 (voting as a rule). **Potentially strong on #6 (provides clear rules/heuristics).** Can address #7 (rules define normal group behavior).
  *   **Participation-Focused Views (Complicity, Expressivism):** Strong on #1 (participating in wastefulness), #2 (participating in harmful practice), #3 (complicity doesn't require difference-making), #4 (defines wrongness *as* participation). Can handle #5 (voting as expressing civic duty/opposition). **Struggles with #6 (how to define the 'practice' simply?) and can risk collapsing into #4 (automatic wrong).** Explains #7 (group participation reinforces the practice).
  *   **Threshold Deontology/Harms:** Strong on #2 if thresholds are known. **Fails utterly on #6 (thresholds unknown) and often on #1 (buffet).** Weak on #3, #5.
  *   **Collective Obligation (blaming individuals for group failure):** Can motivate #5, conceptually addresses #2/3. **Very weak on #1, #4, #6 (difficult to operationalize individual duties within collectives practically).**

  **Conclusion:** You're right that writing the spec clarifies the landscape and exposes fundamental tensions (especially Usability vs. Causal Precision). It's not avoidance; it's necessary ground-clearing. **For your purpose (organizing personal decisions), Rule Consequentialism often strikes the best balance:** it provides actionable rules/heuristics (#6) derived from collective impact (#2, #3), handles voting (#5) and the buffet (#1) contextually, avoids automatic permissibility/condemnation (#3, #4), and can engage with group psychology (#7). However, it requires careful formulation of the rules. Participation-focused views are simpler but risk being overly rigid. EVU is theoretically powerful but practically useless for you. Use this spec as a filter when reading the next take.
