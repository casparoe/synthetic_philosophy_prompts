          - A whiteboard or large paper for the Purpose Board.
          - Markers.
          - For each student: a set of 10 activity cards (each card has one activity from the list of 10). Print on one page: the page has 10 cards (each about 1/10th of the page) that they can tear apart.
          - A list of activities for the TA to recognize when licensing.
          - Tokens: we'll use the board to track token counts, so no physical tokens are needed. The TA will have a marker to change the counts.

       Timeline:

          0-5 min: Setup
            - TA writes on the board:
                  Licensed Activities:
                    Activity   | Purpose | Tokens
                    Doodling   | (none)  | 10
            - TA hands out one set of activity cards to each student.
            - TA explains the rules for Phase 1:

                  "We are going to play a game where you can do activities, but only under certain rules.

                  Rule 1: You can only do activities that are licensed and appear on this board.
                  Rule 2: To do an activity, you must come to the board and take a token for that activity. If there are no tokens left, you cannot do it.
                  Rule 3: For the foundation activity (Doodling), you can take a token without stating a purpose. Then you do the activity for about 30 seconds.
                  Rule 4: For any other activity, when you take a token, you must state: 'I am doing [activity] in order to [its purpose activity]' (the purpose activity is written on the board). Then you do the activity.
                  Rule 5: You can license a new activity. To do so, come to the board and say: 'I want to license [new activity] with the purpose of [an already licensed activity].' If the purpose activity is licensed, then I will add the new activity to the board with 3 tokens. You then get to take one token immediately (if you wish) to do the activity.

                  The goal is to do as many activities as you can. We'll do this for 20 minutes."

          5-25 min: Phase 1
            - TA monitors the board and helps students license new activities. 
            - At minute 20 (i.e., 15 minutes after starting Phase 1), the TA announces: 
                  "The foundation activity (Doodling) is now revoked. It is no longer licensed. Therefore, any activity that had Doodling as its purpose (directly or indirectly) is also revoked and removed from the board."
            - TA erases the entire board. There are now no licensed activities.
            - Students may try to license new activities, but the TA says: "You can try to license, but remember: you must point to an already licensed activity. Currently, there are none." So nothing can be licensed.

          25-40 min: Phase 2
            - TA announces: 
                  "We are now suspending the licensing system. For the next 15 minutes, you can do any of the activities that were on your cards, or any new activity you invent, without needing a token and without stating a purpose. There are no rules about why you do things. Just do what you want."
            - TA observes and notes what students do.

          40-75 min: Debrief (35 minutes)

       Debrief Structure:

          - Start by asking about their experience in Phase 1.
            Q: "How did it feel when we revoked the foundation activity?"
            A: They should express frustration, confusion, or the feeling that it was arbitrary.

          - Then ask: "Why couldn't we license any new activities after the revocation?"
            A: Because every license required pointing to something already licensed, and there was nothing.

          - Then: "What does this tell us about chains of purposes? What happens if we demand a purpose for every activity?"
            A: We either go on forever (which is impossible) or we stop arbitrarily (like we did with Doodling). And if we remove the arbitrary stop, the whole chain collapses.

          - Then: "How did Phase 2 feel? What did you do?"
            A: They might say they did some of the same activities but without the hassle.

          - Then: "Why did you do those activities in Phase 2? Did you have a purpose for them?"
            A: They might say they did them because they wanted to, or for fun, or no reason.

          - Then: "Was the ability to do an activity without a purpose something you had to learn in Phase 2, or was it always there? Why couldn't you do it in Phase 1?"
            A: It was always there, but the rules of the game forbade it.

          - Then connect to Schlick:
            - "Schlick argues that the demand for a purpose of life as a whole is like demanding a purpose for the foundation activity. It's arbitrary and if we remove it, we see that life as a whole cannot be a means to something else without turning life into an instrument. And then we have to ask about that something else."
            - "He also says that we have the capacity to do things without an external purpose (like in Phase 2). We had it all along, but we suppress it by always looking for an external reason. This capacity is what he calls 'play' (but we avoided that word until now)."

          - Finally: "Schlick isn't just telling us to relax. He's making a structural point about purposes and then pointing out that we have another mode available."

       What might break:

          - Students might not engage in Phase 1. The TA can encourage by saying: "Your goal is to do as many activities as possible, so try to license activities you like."
          - In Phase 2, they might be shy. The TA can do an activity themselves to break the ice.
          - The revocation might be confusing. The TA should clearly explain the dependency.

       One more adjustment: We don't want the foundation activity to be the only one with tokens initially. We can start with 10 tokens for Doodling, but students might not want to doodle. So we can have a more appealing foundation? But it doesn't matter. The point is the structure.

     This design meets the constraints and should achieve the two-fold payoff.

     Final note: The game cannot reproduce Schlick's positive account of the experience of play. The TA will have to describe that afterwards, perhaps by relating it to experiences of flow, absorption, or childhood play that they might recall.
