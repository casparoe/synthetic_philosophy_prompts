  ### **Schlick's Purpose Regress Game: "The License Loop"**

  #### **Materials List** (for 14 students):
  - **14 activity cards** (one per student, each with a unique simple activity—see examples below).  
  - **140 purpose tokens** (small slips of paper; 10 tokens per student).  
  - **1 "Purpose Board"** (whiteboard or large poster paper) to track "licensed" activities.  
  - **Markers** for the board.  
  - **Timer** (visible to all).  
  - **Optional**: Simple props (paper, pens, coins, a ball) for activities.  

  **Activity Card Examples** (each student gets one card with *one* of these):  
  1. Fold a paper airplane.  
  2. Doodle on a blank page.  
  3. Stack coins into a tower.  
  4. Toss a ball into a bin.  
  5. Write a haiku.  
  6. Balance a book on your head.  
  7. Hum a chorus of a song.  
  8. Shake hands with 3 people.  
  9. Organize pens by color.  
  10. Count the windows in the room.  
  11. Trace your hand on paper.  
  12. Alphabetize books on a shelf.  
  13. Stand on one leg for 10 seconds.  
  14. Create a pattern with coins.  

  *(Each card has only the activity name. No instructions or purposes.)*  

  ---

  ### **Rules & Setup**  
  **Phase 1: The Licensing Loop (25 min)**  
  1. **Intro (2 min)**:  
     - *TA says*: “This game has one rule: **To do any action, you need a token. To get a token, you must license your action by linking it to another student’s licensed action.** Start by licensing your card’s activity at the Purpose Board.”  
     - Hand each student **10 tokens** and one **activity card**.  

  2. **Licensing Mechanics (18 min)**:  
     - **Step 1**: A student goes to the Purpose Board and says: *“I license [MY ACTIVITY] to serve [ANOTHER LICENSED ACTIVITY].”*  
       - The first student can license their activity *without* a purpose (TA writes it on the board as the “root” activity).  
       - Subsequent students **must** link their activity to one *already on the board*.  
     - **Step 2**: Once licensed, the student gets a **green check** by their activity on the board. They can now use tokens to do it.  
     - **Step 3**: To **do** their activity, they spend **one token** and must announce: *“I am doing [MY ACTIVITY] to serve [PURPOSE ACTIVITY].”*  
       - They do the activity immediately (takes 15-30 sec).  
       - *Example*: Student A licenses “Doodling” as the root. Student B licenses “Stacking Coins to serve Doodling.” When Student B stacks coins, they announce: *“I’m stacking coins to serve Doodling.”*  

  3. **Token Economy**:  
     - Students start with 10 tokens.  
     - **Spend 1 token** each time they do their activity.  
     - **Earn 2 tokens** each time another student links *their* activity to yours.  
     - **Score publicly** on the board (optional: rank by tokens).  

  4. **TA’s Secret Rule Enforcement**:  
     - If a student invents an absurd/frivolous purpose (*“I stack coins to serve the heat death of the universe”*), say: **“Link it to a licensed *student activity* in this room or it’s invalid.”**  
     - If a student runs out of tokens, they must convince someone to link to them to earn more.  

  **Phase 2: The Shift (15 min)**  
  - **TA announces**: “New rule: **Tokens are gone. Do any activity you want, alone or together, with no licensing.**”  
  - **Silently remove tokens** and erase the Purpose Board.  
  - Observe what students do: Do they keep doing their activity? Switch? Collaborate?  

  ---

  ### **Timeline (75 min Total)**  
  - **0-5 min**: Setup + explain Phase 1 rules.  
  - **5-30 min**: **Phase 1** (Licensing Loop). *TA enforces rules, updates board.*  
  - **30-35 min**: Transition to Phase 2.  
  - **35-50 min**: **Phase 2** (The Shift). *TA observes silently.*  
  - **50-75 min**: Debrief (25 min).  

  ---

  ### **Debrief: Mapping Game → Schlick’s Argument**  
  **Goal**: Make students articulate the regress and the "misdescription" insight. Avoid mentioning "play" or "meaning."  

  1. **Phase 1 Frustration (5 min)**:  
     - *Ask*: “What felt broken in Phase 1? Why?”  
     - **Map to Schlick**:  
       - When they say *“Linking activities felt arbitrary/pointless,”* highlight: **“Purposes always point further out. If everything must serve something else, where does it end?”**  
       - When they mention the “root” activity: **“Why was the first activity exempt? What if we demanded a purpose for it too?”** → Schlick’s claim: **Life as a whole can’t be a means to something ‘outside’ without infinite regress.**  

  2. **The Student Who Gamed the System (5 min)**:  
     - *Ask*: “Did anyone invent wild purposes? Did it *truly* solve the problem?”  
     - **Map to Schlick**:  
       - **“Inventing purposes just kicks the can down the road. You turned your activity into an instrument for something else. What’s *that* for?”** → This mirrors how demanding life’s purpose leads to cosmic/instrumental answers that *still* regress.  

  3. **Phase 2 Behavior (5 min)**:  
     - *Ask*: “In Phase 2, what did you keep doing? Why?”  
     - **Map to Schlick**:  
       - If they say *“I kept stacking coins—it was satisfying”*: **“So you did it without a ‘purpose’? Was the capacity always there, or did Phase 1 suppress it?”** → Schlick’s **suppressed-capacity claim**: Adults convert activities into means, but the ability to do things without justification exists and resurfaces when constraints lift.  
       - **Key move**: **“Schlick isn’t saying ‘just chill.’ He’s saying you’ve misdescribed what you’re doing. The licensing rule *forced* you to add purposes—but in Phase 2, you dropped them.”**  

  4. **The Big Picture (5 min)**:  
     - *Ask*: “Could Phase 1’s system ever work for *everything*? Why not?”  
     - **Map to Schlick**:  
       - **“Demanding a purpose for life as a whole is like demanding a purpose for the ‘root’ activity. It’s unanswerable—not because we’re lazy, but because it’s a structural dead end.”**  

  ---

  ### **Predictable Breakdowns & Fixes**  
  1. **Student invents absurd purposes** (e.g., *“I doodle to serve the multiverse”*):  
     - **Steer it**: Force them to link to a **concrete student activity** (e.g., *“...to serve Carlos’s coin-stacking”*). This exposes the regress: Carlos now bears the burden of justification. *Best thing that could happen*—it reveals the arbitrarity.  

  2. **Students resist licensing**:  
     - **Fix**: Remind them they need tokens to “score.” Pre-law/pre-med students will engage to win.  

  3. **Phase 2 stagnation**:  
     - **Fix**: If no one moves, do your own activity (e.g., doodle). They’ll join.  

  4. **Token disputes**:  
     - **Fix**: Designate a student as “banker” to count links/tokens.  

  ---

  ### **What the Game Can’t Capture**  
  **Schlick’s phenomenological insight**: The game shows the *structural* regress and capacity suppression, but **not the *value* of "play" as Schlick describes it**. Schlick argues play is intrinsically fulfilling—a state of unmediated engagement. The game’s activities are trivial, so students may not *feel* the profound joy Schlick associates with play.  

  **How to supply it after**: In post-debrief, ask:  
  > *“When you did your activity in Phase 2, did it feel different? *Why*? Schlick says this shift—from seeing actions as instruments to seeing them as self-contained—isn’t about hedonism. It’s about reclaiming a way of being we’ve forgotten. He calls it ‘youth,’ but he means a capacity for absorption, not age.”*  

  Then, connect to their lives:  
  > *“Pre-meds: You study to get into med school, to become a doctor, to save lives. Schlick asks: Is there a version of studying that isn’t a *means*? Not ‘chill’—but where the activity *itself* is the point? That’s his real target: the misdescription.”*  

  This bridges the game to Schlick’s existential claim: Play isn’t frivolous—it’s the antidote to instrumentalizing *everything*.
