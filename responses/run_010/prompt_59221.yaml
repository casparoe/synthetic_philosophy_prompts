prompt: |-
  Been doing long-range forecasting on and off for about eight years, mostly geopolitics and tech, and I've realized the part I actually can't do reliably is picking the reference class. I've read the reference-class-forecasting stuff, and the argument that the reference class problem infects basically every probability judgment anyone ever makes, but knowing its a problem doesn't tell you what to do. So here are my real verdicts, and I want to know what principle, if any, they add up to.

  1. How long will the current great-power rivalry last — I refuse to use "all great-power rivalries since 1500" and insist on "rivalries where both sides have nuclear weapons." The n is tiny and everyone tells me that's disqualifying. I still think it's the right call.
  2. Will this seed-stage startup be worth over a billion in five years — I'm perfectly happy using "all seed-stage startups in this sector and vintage," even though I agree their specific approach has no precedent.
  3. A pundit says this coup will play out like one famous earlier coup — I think single-analogy reasoning is worthless, but averaging over "all coups everywhere" is worse, and I can't say why.
  4. Predicting the decline of the current hegemon from the base rate of all past hegemons — astrology. But not because each empire is unique; because I don't think "hegemon" picks out a real kind at all.
  5. Will a country democratize after a mass protest movement — I use "all mass protest movements," not "all countries" and not "all protest movements that reached this size." I have no way to choose between those three nested levels.
  6. For any duration question I always condition on having already survived this long rather than using the unconditional distribution. I feel very strongly about this and have never had an argument for it.

  My gut rule is: use the broadest class that shares the mechanism. But I can't say what counts as "the mechanism" without already knowing the answer, so I suspect that's fake.

  Also, I preach that the class has to be fixed before you look at any outcomes and I won't let anyone move it after scoring badly — but I've personally moved one mid-forecast, twice, when I realized the original class had been defined after the fact.

  So what's the principle? State it precisely, say which clause each of my cases motivates, tell me which of my verdicts it forces me to give up, and run it on two cases I haven't listed. And if your honest answer is that there's no principle here and it's judgment all the way down, say so, and tell me what the judgment is tracking.
reasoning: |-
  Okay, let me start by really understanding what the user is asking. They've been doing forecasting for about eight years, focusing on geopolitics and tech. Their main struggle is with selecting the right reference class, and they've provided six specific scenarios where they've made judgment calls. They want a principle that explains their decisions, even if it means admitting there's no clear rule.

  First, I need to break down each of their verdicts to find common threads. In case 1, they reject broad historical rivalries because nuclear weapons change the mechanism. That makes sense—nukes introduce deterrence that didn't exist before. So mechanism specificity is key here. 

  Case 2 is interesting. They're okay with a broad class of startups despite unique approaches. Maybe because the fundamental uncertainties (market, team execution) are similar across all startups, even if the ideas differ. So the mechanism here is the startup process itself, not the product.

  Case 3 is tricky. They dismiss single analogies and broad averages but can't articulate why. Probably because coups vary too much in context. The user seems to prefer a middle ground but struggles with defining it. Mechanism might be the political instability factors, but those are hard to pin down.

  Case 4 rejects "hegemon" as a valid category. That's a ontological objection—they don't believe it's a real kind with shared mechanisms. Each empire's decline is path-dependent, so no useful base rate exists.

  Case 5 shows conflict between nested reference classes. Mass protest movements might share a triggering mechanism, but country-specific factors matter too. The user picks the middle level but admits uncertainty. This highlights the challenge of granularity.

  Case 6 is about duration conditioning. Surviving this long alters the failure mechanism—things that die early are different from those that persist. So conditioning on survival adjusts for that selection bias.

  Their gut feeling about "mechanism" resonates, but they're right that it's circular. How do you know the mechanism without knowing the outcome? That's the core problem. Maybe the principle has to incorporate pragmatism and causal plausibility.

  The user also mentions sticking to pre-defined classes but admits to changing them when realizing post-hoc definitions. That's a meta-point about honesty in process over rigid rules. It suggests that the principle should allow refinement but penalize ad hoc adjustments.

  Putting this together, the principle might involve causal homogeneity, ontological reality, and survivorship bias. For new cases, predicting a tech disruption like AI: comparing it to past disruptions (electricity, internet) makes sense if the adoption mechanisms are similar. For a civil war outcome, using all civil wars might be too broad; conditioning on factors like ethnic divisions or resources could be better.

  But the user's deeper need might be validation that judgment is unavoidable. They want to know if their intuitions are tracking something real, like causal structures or ontological categories, even if it's not quantifiable. Maybe the answer is that reference classes are hypotheses about causal mechanisms, tested through forecasting performance over time. It's iterative and requires domain expertise to identify relevant mechanisms.
answer: |-
  Here's a synthesized principle based on your judgments, articulated precisely, with an analysis of your cases, limitations, and new applications:

  **The Principle of Mechanism-Constrained Ontological Homogeneity:**

  > "Select the broadest reference class satisfying these conditions:
  > 1.  **Causal Plausibility:** Members must plausibly share *core mechanisms* driving the outcome, based on domain knowledge (not outcome data).
  > 2.  **Ontological Validity:** The class must correspond to a *meaningful category* in the domain, not an arbitrary or post-hoc grouping.
  > 3.  **Survivorship Conditioning:** For duration/volatility questions, always condition on survival-to-date to account for heterogeneous failure mechanisms.
  > 4.  **Pre-Commitment:** The class must be defined *before* examining outcomes of the specific case, but *can* be revised if discovery reveals the initial class violated (1) or (2) due to oversight."

  **Analyzing Your Verdicts:**

  1.  **Great-Power Rivalry Duration:** You enforce *Causal Plausibility (nuclear deterrence fundamentally alters escalation mechanisms)* and reject an *Ontologically Invalid* class ("all rivalries") ignoring this mechanism shift. (Forces you to accept tiny `n`).
  2.  **Startup Valuation:** You accept broad class because *Causal Plausibility* holds (success mechanisms – market timing, team execution, funding – are similar across early-stage startups). Specific idea novelty doesn't override core drivers.
  3.  **Coup Outcome:** You reject single analogy (violates *Causal Plausibility* – likely cherry-picking) AND broad average (violates *Ontological Validity* – "coups" are too heterogeneous). **Principle Limitation:** This case exposes the gap. The principle *demands* a valid class sharing mechanisms, but doesn't tell you how to *find* it if none exists (e.g., "military coups in middle-income democracies post-1990" might be your implicit choice).
  4.  **Hegemon Decline:** You reject based on *Ontological Validity* – "hegemon" isn't a real kind with shared causal mechanisms; declines are path-dependent. Base rates are meaningless noise.
  5.  **Democratization Post-Protest:** "All mass protest movements" balances *Causal Plausibility* (mass mobilization creates similar pressures/opportunities) better than broader ("all countries") or narrower ("same size") classes. **Principle Limitation:** It doesn't *resolve* the nesting ambiguity, but *justifies preferring the middle level* as likely capturing the dominant mechanism (protest momentum).
  6.  **Duration Conditioning:** Mandated by *Survivorship Conditioning* clause. Early failures often have different causes than late failures (e.g., infant mortality vs. wear-out).

  **What You Must Give Up:**
  *   **The illusion of perfect objectivity in case #3 & #5.** The principle forces acknowledgment that when no perfect class exists (coups), judgment is required to select the *least bad* approximation of a mechanism-homogeneous group. In #5, it accepts your choice but admits the granularity decision is inherently fuzzy.

  **Applying to New Cases:**

  1.  **Predicting AI Disruption Timeline for Radiology:**
      *   Bad: "All technological disruptions" (Violates *Causal Plausibility* – steam engines ≠ software; mechanisms differ).
      *   Bad: "First AI tools in radiology" (Violates *Pre-Commitment* / tiny `n` – defined post-hoc).
      *   Better: "Software automation of high-skill diagnostic tasks" (e.g., CAD in mammography earlier, AI pathology tools). Captures core mechanisms: regulatory hurdles, clinician trust-building, integration into workflows. Satisfies *Causal Plausibility* & *Ontological Validity*.

  2.  **Will Civil War in Country X lead to Partition?**
      *   Bad: "All civil wars" (Violates *Causal Plausibility* – ethnic secessionist wars ≠ ideological power struggles).
      *   Bad: "Civil wars in Country X's region" (Violates *Ontological Validity* – arbitrary geography ≠ causal kind).
      *   Better: "Ethnofederal states experiencing civil wars driven by secessionist movements" (e.g., comparing to Yugoslavia, Sudan, Ethiopia). Targets mechanism: central state weakness + defined territorial ethnic groups seeking independence. Satisfies (1) & (2).

  **The Role of Judgment:**

  The principle doesn't eliminate judgment; it *structures* and *constrains* it. Judgment is required for:
  *   **Identifying Plausible Mechanisms:** Domain expertise determines what mechanisms are causal *ex ante* (e.g., knowing nukes deter major war).
  *   **Assessing Ontological Validity:** Knowing if "hegemon" or "coup" is a coherent causal category in political science.
  *   **Choosing Granularity:** When nested classes exist, picking the level where the target mechanism dominates (protest movements vs. countries).
  *   **Revising Classes:** Judging if a revision is due to *genuine oversight* of mechanism/ontology (permitted) vs. *outcome-driven fudging* (forbidden).

  **Your judgment is tracking *causal structure within domain ontology*.** You intuitively reject reference classes that:
  *   Ignore fundamental causal forces (nukes).
  *   Group things that don't belong together meaningfully (all empires).
  *   Fail to account for selection effects (duration).
  *   Are defined *by* the outcome they aim to predict (post-hoc classes).

  This principle makes that intuition explicit and operational. It accepts that perfect reference classes are rare, but provides disciplined criteria for choosing the best available approximation *before* seeing the result, grounded in causal reality rather than statistical convenience.
