answer: |-
  Here's the residue report after translating your roommate's position into CAS/build provenance vocabulary. I've adhered strictly to your framework and separated aesthetic/moral claims where possible.

  **Exact Counterparts (1:1 Mappings):**

  1.  **Nominal Authenticity (Correct Attribution):** Directly maps to **digital signatures & attestations**. A forgery claiming "Artist X" without a valid signature from X's key (or a trusted attestation chain) is invalid provenance. This is absolute: same bytes, different/wrong signature = different artifact identity in the system.
  2.  **Misrepresentation of Production History (Dutton):** Maps perfectly to **build provenance graphs**. A forgery presents a false graph. It claims:
      *   **False Source:** Like claiming source code `git commit abc123` when it was actually built from `xyz789`.
      *   **False Build Process:** Like claiming built with `toolchain-v1` in a clean environment, when actually built with `hacked-toolchain-v2` on a compromised host.
      *   **False Timestamp/Context:** Like claiming built in 2023 when built in 2024.
  3.  **"Mere Possibility of Difference" (Goodman - Technical Aspect):** Maps to **reproducible build requirements**. The *potential* for divergence is why we demand:
      *   **Full Dependency Locking:** (SBOMs, pinned hashes) - Because differing dependencies *could* create a different output, even if they didn't in this instance.
      *   **Declared Build Environment:** Because differing environments *could* create different outputs.
      *   **The artifact's identity includes its provenance graph hash.** Two byte-identical outputs from *different, validly signed provenance graphs* are **not interchangeable** in a strict system. They are distinct entries in the content-addressable store because their *provenance metadata* differs. *This is her foothold: different history = different artifact, even if bytes match.*

  **Bent Translations (Where Force-Fitting Occurred):**

  1.  **Goodman's "Training Perception" / Aesthetic Difference:** Bent into **provenance scrutiny tooling**. Her point is that *learning to discern origins* develops aesthetic perception. We map this to tools/processes that *analyze provenance graphs* for anomalies or verify signatures. The "aesthetic difference" becomes the *difference detected by the analysis tool* (invalid sig, inconsistent graph). *Bend:* This reduces "developing perception" to "improving forensic analysis" and implies the aesthetic difference *only manifests* if the provenance is flawed or detectable. It sidesteps her core claim that the *very fact of differing origins* creates an aesthetic difference *even if undetectable*.
  2.  **Expressive Authenticity (Dutton - Cultural/Personal Genuineness):** Bent into **attestation scope**. We interpret "genuinely issuing from" as requiring an attestation covering the *entire intended creative context*. A forgery lacks an attestation from the original creator/culture covering the work's *genuine* production. *Bend:* This flattens "cultural/personal genuineness" into a binary cryptographic attestation. It ignores the nuanced, non-technical meaning of "expressing" a culture or person, reducing it to a signature claim.

  **Untranslatable Residue (No Expression in Your Vocabulary):**

  1.  **Intrinsic Aesthetic "Worseness" of the Forgery (Byte-Identical Case):** This is the core residue. Your framework has **no concept** for the *aesthetic value* or *artistic merit* of the artifact itself being diminished *solely because of its origin*, **if**:
      *   The bytes are identical to the original (`sha256:abc123`).
      *   The *false* provenance graph is technically flawless (perfectly formed, but signed by the wrong key).
      *   No analysis tool *can ever* detect the difference.
      Your system sees two distinct artifacts (`artifact:sha256:abc123 + graph:hash:forged` vs. `artifact:sha256:abc123 + graph:hash:genuine`), both with valid signatures (though one falsely attributed), and identical content. It assigns no "worse" value to either based *solely* on the origin story being false, only "invalid" if the signature is cryptographically broken or the graph is inconsistent. **"Worse" purely on historical grounds without any detectable difference in content or flawed metadata has no counterpart.**
  2.  **The "Merit" of Historical Production:** The value placed on the *specific historical act of creation by the specific originator* as an *aesthetic* component is untranslatable. Your system cares about verifiable *claims* (attestations) about history for integrity/trust, not about the history itself conferring aesthetic value. A perfect rebuild from different source (`graph:hash:rebuild`) is just as valid as the original (`graph:hash:original`) if correctly attested, even though the history differs.

  **Analysis of Your Three Cases:**

  1.  **Rebuilt Binary (Bit-Identical, Different Source):**
      *   *Your Framework:* `artifact:sha256:abc123` + `graph:hash:rebuild` (correctly signed by rebuilder). Valid artifact, distinct provenance from `artifact:sha256:abc123` + `graph:hash:original`. Interchangeable *functionally*, but distinct *provenance objects*. No "worse".
      *   *Her Claim (Translated):* Aesthetically different/worse because of the different history (Goodman), lacks expressive authenticity (Dutton - didn't issue from original creator/process). *Residue:* The "worse" based purely on differing history has no place. Your system flags them as distinct but assigns no aesthetic hierarchy.

  2.  **Estate-Authorized Recast (Original Mold, Honest Label):**
      *   *Your Framework:* `artifact:sha256:def456` (new hash) + `graph:hash:recast` (correctly signed by estate, detailing source=mold:xyz, process=recasting). Valid artifact. Different content hash, different provenance. Correctly attributed derivative/reproduction.
      *   *Her Claim (Translated):* Expressively authentic? (Issues from original *culture/estate*, uses original source/mold). Nominally authentic? (Honestly labeled). Likely acceptable. *Residue:* Minimal. Her framework might debate "authenticity" vs. "authorized reproduction," but your framework cleanly handles this as a distinct, correctly attested artifact.

  3.  **The "Nasty" Forgery (Better than Period Originals):**
      *   *Your Framework:* `artifact:sha256:superior` + `graph:hash:forged` (falsely claiming `artist:OldMaster`, `timestamp:1650`, `tools:period_tools`). **Invalid.** Cryptographic signature fails (wrong key) or provenance graph is inconsistent (analysis reveals anachronisms). "Worse" only in the sense of being *invalid/fraudulent*.
      *   *Her Claim (Translated):* Aesthetically superior as an object? (Plausible). Nominal authenticity? (False - worse). Expressive authenticity? (False - misrepresents origin, worse). *Residue Translation:* **No.** Your framework has **nowhere** to put "aesthetically worse" *for the artifact content itself* (`sha256:superior`). It only records "provenance invalid/fraudulent." The *content* hash stands on its own; its merit isn't diminished by the fraud *in your system*. The "worse" applies solely to the *metadata/claim* (invalid signature, false graph), not the content bytes.

  **Verdict on Residue & Framework:**

  *   **Your framework is *not* missing a concept.** It deliberately and rigorously **separates artifact content (hash) from its provenance (attestations, build graph).** It defines artifact identity as `(content_hash, provenance_graph_hash)`. This is its strength and purpose.
  *   **Her claim relies on a concept your framework explicitly excludes:** That the historical origin story is an *intrinsic, inseparable part of the artifact's aesthetic identity and value*, even when that story leaves no trace in the final content. The "aesthetic difference/worseness" she asserts for perfect forgeries *depends entirely* on this inseparability.
  *   **The Moral/Aesthetic Slide:** Your framework **forces them apart cleanly**:
      *   **Moral/Trust Dimension:** Perfectly captured by invalid signatures/false graphs = fraud, deception, breach of trust. "Wrong" because it lies.
      *   **Aesthetic Dimension (Content):** Only the content hash matters. If bytes match (`sha256:abc123`), it's the same content artifact. Provenance doesn't change the content's properties. If bytes differ (`sha256:superior`), it's a different artifact with its own properties.
  *   **The Hidden Work:** The slide between moral and aesthetic *is* load-bearing for her argument when discussing *perfect* forgeries. When pressed on why the *aesthetic experience* of the identical object is worse, the argument often relies on the *knowledge* of deception (moral) or the theoretical *potential* for difference (Goodman, which bends into forensic analysis). The core claim of *intrinsic aesthetic inferiority based solely on hidden origin* remains untranslatable residue within your content/provenance separated model. Her position requires origin to be *part of the content*, which your framework fundamentally rejects.

  **Conclusion:** The residue confirms a fundamental disjunction. Your framework treats content and provenance as separable, interdependent components for verification and trust. Her position treats the verified origin as an inseparable, aesthetically constitutive element of the work itself. The untranslatable "aesthetic worseness" of the perfect forgery stems entirely from this differing ontology of what constitutes "the artwork." Your framework isn't deficient; it serves a different purpose – ensuring verifiable integrity and reproducibility, not adjudicating the metaphysical nature of artistic identity. The argument can't collapse within your terms because her core premise (origin = intrinsic aesthetic component) is axiomatically rejected by your model.
