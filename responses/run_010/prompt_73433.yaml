   Given the complexity, we will have to rely on the committees creating rules that are vulnerable and the challengers being able to find profiles.

   For the sake of the activity, we can also have some example rules and their vulnerabilities in our back pocket.

   Now, the structure of the activity:

    80 minutes.

    - Introduction (5 min): 
          Explain the setup: 
            "Today we're going to design rules for making a group decision. We have three options for the section party: 
              Option A: Picnic in the park
              Option B: Movie night
              Option C: Board games in the classroom
            Each committee of 5 students will devise a rule. The rule should be a way to choose one of the three options based on the rankings of the five voters in the committee. 
            Then, a pair of challengers from a different committee will try to find a set of rankings that makes the rule produce a result that is 'unfair' in a specific way. 
            The challengers will have a challenge card that tells them what kind of unfairness to look for."

    - Committee time (15 min): 
          Committees (5 students each) devise a rule and write it clearly on an index card. 
          Encourage them to be precise. 

    - Challenge round 1 (15 min): 
          Assign each committee a challenge card (without them seeing it) to a different committee. 
          The challengers (from another committee) come to the board and write down the rule. 
          They then have to create a set of rankings for the five voters ( assign rankings) that will cause the rule to produce the unfairness described on their card. 
          They then run the rule and show the result. 
          If they succeed, they score a point. If the rule survives, the committee scores a point.

          We might have to do one example in front.

          Rotate the challengers for the next round.

    - Challenge round 2 (15 min)
    - Challenge round 3 (15 min)

    - Debrief (15 min)

    If there are only 45 minutes, reduce each challenge round to 10 min and debrief to 10 min, and cut one challenge round.

    If there are 40 students, then have 8 committees of 5, and pair them up.

    For the debrief:

          We will have on the board the rules and the challenge cards that were used.

          Ask: "What made a rule vulnerable to a challenge?"

          Then: "Let's look at the challenge cards. What were we asking for?"

          List the demands from the challenge cards (without naming the conditions) as the students read them.

          Then: "It turned out that for every rule we had, at least one of these challenges succeeded. But is it possible to have a rule that meets all these demands at once? Let me show you."

          Then state Arrow's theorem: 
              "In 1951, Kenneth Arrow proved that it is impossible to have a voting rule that meets four key properties: 
                  1. Pareto efficiency (if everyone prefers X to Y, then Y should not be chosen over X) [relate to challenge card 1]
                  2. Independence of Irrelevant Alternatives [explain with the two profiles and the pairwise ranking] 
                  3. Non-dictatorship 
                  4. The rule should work for any possible preferences ( which we assume by allowing any rankings)
              In fact, he proved that no such rule exists that produces a complete ranking of the options, but even for just choosing a winner, we've seen that many rules fail at one or more of these."

          Then: "Today, we experienced how hard it is to design a rule that is immune to all types of unfairness."

    For the potential issue that a committee might not be challenged successfully:
          If a rule survives a round, the committee scores a point. If it survives all rounds, then they win. 
          But then in the debrief, you can say: 
              "Some rules might have survived the three challenges we had. But that doesn't mean they are perfect. Arrow's theorem tells us that either they are dictatorial, or they violate Pareto, or they violate IIA, or they are not defined for every possible ranking. 
              In fact, if a rule is defined for every ranking and satisfies Pareto and IIA, then it must be dictatorial. 
              So if your rule is not dictatorial, then it must fail one of the other conditions. We might not have found the profile, but it exists."

          This is the universality and the fact that the theorem is about every possible rule.

    The activity cannot reproduce the universality (over all profiles) because we only try a few. 
    It also cannot reproduce the full social ordering requirement (since we only choose a winner) but the theorem is about a complete ranking. However, there are extensions for social choice functions ( just winner) that are also impossible. 

    The exact line when a rule survives: 
          "Your rule might have survived the specific profiles the challengers tried, but remember, the theorem says that for any rule that is not dictatorial and that works for every possible set of rankings, there will be at least one profile that violates Pareto or IIA. So if your rule is not dictatorial, then there exists some set of rankings that will make it violate one of the other conditions. We just might not have had time to find it today."

    To handle a hypercompetitive section: 
          Emphasize that the goal is to learn, not to win. 
          Have a prize for the committee that writes the rule that is hardest to break (but still explain in the debrief that by Arrow, it must be either dictatorial or fail in some way).

    For a flat section: 
          Prepare to feed profiles. If the challengers are stuck, say: "Here's a set of rankings you might try." and hand them a profile from the library for their rule type and challenge card. 

    If the committees write a rule that is chair decides everything, then it is dictatorial. Then for the non-dictatorship challenge, they will be broken if the challengers use the script for non-dictatorship.

    If they write "chair decides if there's a tie", then for a challenge like Pareto, they might be breakable if in the initial count the winner is Pareto dominated, but then the chair might choose someone else. 

          Example for Pareto: 
            Rule: plurality and if tie, chair chooses.
            Profile: 
              5 voters: A > B > C, but they all vote for A. -> A wins. not breakable.
            To break Pareto, we need the plurality winner to be Pareto dominated. But plurality satisfies Pareto? 

          So maybe not breakable. 

          But if they use a different rule that might elect a Pareto dominated candidate, then the chair might have a chance to change it, but if there's no tie, the chair doesn't.

          Example: 
            Rule: " the winner is the candidate with the most last-place votes, and if tie, the chair decides."
            Profile: 
              5 voters: A > B > C   -> then last-place votes: C has 5, so winner is C.
            But everyone prefers A to C.

          Then the Pareto challenge will break it.

          So the challengers can try that.

    In summary, the activity might have some rules that are not breakable in the time, but by Arrow's theorem, we know they must have a flaw somewhere.

    We proceed with the challenge cards as defined, and the example above.
answer: |-
  ### Revised Activity Design: Arrow's Theorem Discovery Game  
  I've refined your activity to ensure it's engaging, mathematically sound, and achieves your pedagogical goals. The core structure remains, but I've addressed pitfalls and added scaffolding.

  ---

  ### **Phase 1: Setup (5 min)**  
  - **Students:** 25 students → 5 committees of 5.  
  - **Options:** Fixed party choices (e.g., **A**=Picnic, **B**=Movie Night, **C**=Board Games).  
  - **Materials:**  
    - Index cards for rules/rankings.  
    - Whiteboard to post rules.  
    - **Challenge Card Deck** (see below).  
    - **Secret Profile Library** (for TA; see below).  

  ---

  ### **Phase 2: Rule Creation (15 min)**  
  - **Task:** Each committee designs a voting rule to pick one option. They must write it in plain English on an index card.  
  - **TA Guidance:**  
    - *Prevent "Chair Decides" Dodge:* Announce: *"If your rule includes a tiebreaker, define exactly how the chair votes (e.g., ‘alphabetical order’ or ‘chair ranks all options’). No open-ended chair powers!"*  
    - *Silly Rules Welcome:* Encourage creativity (e.g., "Pick the option ranked last by the redhead in the group"). Vulnerability to challenges is the point!  

  ---

  ### **Challenge Card Deck**  
  Each card has a *plain-language challenge* (for students) and a *condition key* (for TA). Challengers read the bold script aloud.  

  | # | Plain-Language Challenge (Student-Facing)                                       | Condition Key              |  
  |---|---------------------------------------------------------------------------------|----------------------------|  
  | 1 | **"Make the rule choose a place that every single voter ranks below another option."**<br>*(e.g., All 5 voters prefer Picnic over Movie Night, but Movie Night wins)* | Pareto Efficiency          |  
  | 2 | **"Make the winner flip between two options even though no voter changed their mind about those two."**<br>*(e.g., In Round 1, Picnic beats Movie Night. In Round 2, Movie Night wins—but every voter’s Picnic-vs-Movie ranking is unchanged.)* | Independence of Irrelevant Alternatives (IIA) |  
  | 3 | **"Make the rule choose a place that only one voter loves and the other four hate."**<br>*(e.g., 1 voter ranks Picnic #1; 4 rank it dead last)* | Non-Dictatorship           |  

  ---

  ### **Phase 3: Challenge Rounds (3 × 15 min = 45 min)**  
  **Mechanics:**  
  - Each round, challengers from Committee *X* attack Committee *Y*'s rule.  
  - Challengers draw 1 card and build a 5-voter profile to trigger the challenge.  
  - **Scoring:**  
    - Challengers win 1 pt if they break the rule.  
    - Committee *Y* wins 1 pt if rule survives.  
  - Rotate challengers/committees each round.  

  **TA’s Secret Profile Library**  
  Precomputed 5-voter/3-option profiles to break common rules. Use if challengers stall. *Never show students this table.*  

  | Rule Type         | Challenge Card | Killer Profile (Voter Rankings)                                    | Challenger’s 1-Sentence Script                                  |  
  |-------------------|---------------|--------------------------------------------------------------------|-----------------------------------------------------------------|  
  | Plurality         | #2 (IIA)      | **Profile 1:**<br>2: A>B>C, 2: B>A>C, 1: C>A>B → A wins<br>**Profile 2:**<br>2: A>C>B, 2: B>C>A, 1: C>B>A → B wins | *"Same A-vs-B rankings, but A won first time, B won second!"* |  
  | Two-Round Runoff  | #1 (Pareto)   | 3: A>B>C, 2: C>B>A → Runoff: A vs C → A wins<br>Modify to: 3: B>A>C, 2: C>A>B → Runoff: B vs C → B wins<br>*(B is Pareto-dominated by A)* | *"Everyone prefers Picnic over Movie, but Movie won!"* |  
  | Borda (Points: 2,1,0) | #3 (Non-Dictator) | 4: A>B>C (A=8 pts), 1: C>B>A (C=2 pts) → A wins<br>Then: 4: B>A>C, 1: C>A>B → C wins | *"C won despite being ranked last by 4 voters!"* |  
  | Pairwise Comparisons (Chair Breaks Ties) | #3 (Non-Dictator) | Chair ranks C>B>A. All 5: A>B>C → A wins *(fair)*<br>Then: 5: B>C>A → Tie (A,B,C equal). Chair picks C. | *"Chair’s favorite (C) won even though 4 ranked it last!"* |  
  | Consensus w/ 1 Veto | #2 (IIA)      | **Profile 1:** No veto on A → A wins<br>**Profile 2:** Same A/B rankings, 1 voter moves veto from C to A → B wins | *"No one changed A-vs-B opinions, but winner flipped!"* |  

  > **Note:** For Pareto, most common rules pass (no 5-voter counterexample). Use #2 or #3 instead.  

  **TA Interventions for Pacing:**  
  - **Stalling Challengers:** After 3 min, whisper: *"Try a profile where [hint]."* (e.g., *"Try a profile where 4 voters agree on one thing"*).  
  - **"Unbreakable" Rule:** At the board, say: *"I have a test profile. Let’s run it."* Use a killer profile from your library. If it fails, shrug: *"Maybe your rule is solid—for now."* (Debrief addresses this later).  
  - **Hypercompetitive Sections:** Add a "Blitz Round" where challengers attack any rule. Award candy for speed.  
  - **Flat Sections:** Pre-seed committees with example rules (e.g., "Borda count") to start drama.  

  ---

  ### **Phase 4: Debrief (15 min)**  
  **Goal:** Students articulate Arrow’s hypotheses from their challenge cards.  

  1. **List Challenges (5 min):**  
     - Ask: *"What made you declare a result ‘unfair’?"* List complaints verbatim from the board:  
       - *"Winner is universally outranked."*  
       - *"Winner flipped with no voter input."*  
       - *"One voter overruled the majority."*  

  2. **Reveal the Trap (5 min):**  
     - *"These all sound reasonable. But did any rule satisfy all complaints at once? [Pause] In 1951, Kenneth Arrow proved why: Any rule meeting your 3 complaints plus one more (‘works for every possible ballot’) must be a dictatorship. That’s Arrow’s Impossibility Theorem."*  

  3. **Address Survivors & Gaps (5 min):**  
     - **To "Unbreakable" Committees:**  
       *"Your rule might survive today, but Arrow’s theorem guarantees a flaw. Either:  
       (1) It fails on a ballot we didn’t test,  
       (2) It secretly lets one voter dictate (try making them rank C last!), or  
       (3) It fails to produce a full ranking when needed. Your rule is *vulnerable*—we just didn’t hit its weak spot."*  
     - **Structural Gaps to Note:**  
       - *Universality:* "We tested a few profiles; Arrow’s theorem covers *all possible* profiles."  
       - *Social Orderings:* "We picked a winner; Arrow requires a *full ranking* of options (e.g., to elect a runner-up if the winner drops out). Many rules fail here."  

  ---

  ### **Adjustments**  
  - **40 Students:** 8 committees of 5. Run 2 simultaneous games (TA circulates).  
  - **45 Minutes:** Cut to 2 challenge rounds (10 min each). Debrief: 10 min (focus on the "trap").  
  - **High School Math Level:** Use analogies (e.g., *"IIA is like rerunning a baseball game but changing the strike zone only for pitches to Babe Ruth"*).  

  ### **Why This Works**  
  - **Discovery:** Students *feel* the trade-offs via challenges, not axioms.  
  - **Theatre:** The "gotcha" dynamic energizes the room.  
  - **Rigorous Debrief:** Explicitly names what the activity *can’t* show (universality, social orderings) and ties survivors to Arrow’s guarantees.  

  This turns a "dead section" into a game where students *argue* about voting—and walk into the theorem’s teeth.
