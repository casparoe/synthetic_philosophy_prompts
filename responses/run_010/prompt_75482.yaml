  First, I need to parse the two camps. The deflationists argue that finite information limits predictability, making chaotic systems indistinguishable from stochastic ones in practice. They question the reality of infinite-precision initial conditions. The structuralists counter that determinism is about actual trajectories, not predictability, and shadowing preserves structural features like attractors. 

  The user suspects there are two intertwined disputes: one stipulative (defining "in principle") and one substantive (finite information content, shadowing applicability). Their request is to identify the real fault lines, strip away stipulations, and suggest paths for progress.

