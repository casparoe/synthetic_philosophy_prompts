  Question: When the device is in the parking meter and the coin is inserted, what does that physical state represent?

  Options:
  A. "It represents a 25-cent coin, because that's what it was designed to detect."
  B. "It represents a coin worth 5 pence, because that's the context it's now in and what it's being used for."
  C. "It doesn't represent anything on its own; we interpret it as representing one or the other depending on our purposes."

  Question 2: Systematic Misrepresentation (Frog Case)

  Scenario: A frog snaps its tongue at small, dark, moving objects. It snaps at flies (which are nutritious) but also at small pellets tossed by a researcher (which are not). The frog's internal state is the same in both cases.

  Question: When the frog snaps at a pellet, what is the content of the internal state that causes the snap?

  Options:
  A. "It's a false belief: 'There's a fly.'"
  B. "It's a true belief: 'There's a small, dark, moving thing.'"
  C. "It doesn't have beliefs; it's just an automatic response."

  Question 3: Human States Treated Like a Machine

  Scenario: Consider a human being who has been conditioned to associate a red light with the arrival of food. When the red light comes on, the human salivates. The same physical state (a pattern of neural firing) occurs in the human as when they see the red light.

  Question: When the human sees the red light and salivates, what is the content of that neural state?

  Options:
  A. "It represents the arrival of food, because that's what it was conditioned to predict."
  B. "It represents the red light, because that's what is causing the state."
  C. "It represents whatever a competent observer would attribute to explain the behavior, which might be 'food is coming'."

  Question 4: No History (Swampman-style)

  Scenario: Imagine that by a cosmic accident, a molecule-for-molecule duplicate of a human brain (and body) spontaneously forms in a swamp. It has a state physically identical to a belief that it is raining. However, it was not created by evolution, design, or conditioning.

  Question: What is the content of the swamp duplicate's state that is physically identical to a belief that it is raining?

  Options:
  A. "It has the same content: it believes it is raining, because the physical state is identical to a state that normally has that content."
  B. "It has no content because there is no history of selection, design, or conditioning to fix what it represents."
  C. "It has content, but only relative to an interpreter. If we encountered it, we would attribute the belief that it is raining."

