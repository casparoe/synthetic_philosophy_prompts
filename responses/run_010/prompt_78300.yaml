  Question 7: Malfunctioning Device

  Scenario: A smoke detector is designed to produce a loud noise when it detects smoke. But due to a malfunction, it sometimes goes off when there is no smoke (e.g., when steam is present).

  Question: When the smoke detector goes off due to steam, what is the content of the state that causes the alarm?

