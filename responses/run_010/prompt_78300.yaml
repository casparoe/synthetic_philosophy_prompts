  1. A "two-bitser" case: same physical state can be interpreted as tracking two different conditions depending on wiring and deployment.
  2. A case of systematic misrepresentation (like the frog snapping at pellets) with options that differ on whether it's a false belief about flies or a true belief about small dark moving things.
  3. A case that treats a human's states the same as a machine's.
  4. A case with no history: a state physically indistinguishable from a believer's but with no selection, design, or conditioning.

  Theories to be mapped by the scoring key:

  - Searle-style intrinsic, biology-dependent original intentionality.
  - Dennett's collapse of the original/derived distinction.
  - Teleosemantics (e.g., Millikan, Papineau).
  - Informational or indicator semantics (e.g., Dretske).
  - Interpretationist view (content fixed by what a competent ascriber is obliged to attribute).

  The scoring key must:
  - Flag unstable answer patterns (i.e., they don't fit any one theory).
  - List any pair of positions the questions cannot separate and why.
