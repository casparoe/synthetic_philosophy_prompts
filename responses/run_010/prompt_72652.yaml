prompt: |-
  You're an experimental philosopher who has actually run these things in a room full of undergraduates and who knows how messy the replication picture is in this corner of moral psychology — so think it through properly before you write: sketch two or three candidate scenarios privately, reject the ones that won't survive contact with twenty-year-olds, and only then commit to a design.

  Here's my situation. Next Thursday I run a 75-minute session for a third-year moral psychology seminar, 18 students, and its the week we do intuitive judgement about action. A couple of them will have come across the Knobe effect already, most won't, and all of them have done a survey or two in a psych course so they're alert to being tested. What I want is for them to collide with the asymmetry themselves — to discover, in the room, that they and their classmates treat a knowingly-brought-about side effect very differently depending on whether it's good or bad — before anybody says the word intentional-attribution-asymmetry or mentions anyone's name. Right now I've got nothing better than reading two vignettes off a slide, which obviously kills it.

  So: design the activity. Some constraints I want you to respect.

  Do not use the chairman-and-the-environment case, or anything that reads like it — half the room has seen the wording somewhere and the ones who have will sit there smug. Write me two fresh vignettes that are morally evaluable but non-political (nothing about abortion, immigration, climate or guns, I don't want the session hijacked), mundane enough to feel like a real workplace decision, and matched so that the only thing that differs is the valence of the foreseen side effect. Tell me what each vignette has to have in order for the pair to be a fair contrast, and what it must not have — e.g. what happens if the agent sounds reluctant, or if the side effect is described as certain rather than foreseen.

  Then I want a third condition, and this is the bit I care most about. Build me a third vignette that discriminates between the two explanations I'd be defending in the debrief anyway: the one that says the intentionality judgement is downstream of how much we want to blame, and the one that says what's really doing the work is whether the outcome expresses the agent's own values and character. The two come apart somewhere — find that somewhere, write the case, and tell me which pattern of answers across the three conditions supports which story.

  Build in stakes. Each student should have to write down, before seeing anyone else's sheet, both their own answer and a prediction about how the rest of the room will answer the counterpart case, and something small should ride on being right — sweets, or the losing half makes the tea, whatever you think works. Explain how to split the room and collect the sheets so nobody can see what the other group got, and how to tally it in under five minutes without turning into a statistics lesson.

  Give me a running order in minutes, the materials, the exact debrief questions in the order I should ask them and what each one is meant to surface, and — separately — what predictably goes wrong the first time you run this. I'm thinking: the student who answers "intentional" to everything and says so loudly, the ones who catch on and start answering to be interesting rather than honestly, somebody shouting the result across the room halfway through, and the real possibility that with n=18 the numbers come out flat or backwards. Tell me what I do in each case, and specifically what I say if the asymmetry doesn't show up at all.

  Finally, be honest with me about what this activity cannot reproduce. A seminar run once on eighteen people is not a measurement, wording sensitivity in this literature is brutal, and I don't want to imply to the students that they've just replicated a finding. Tell me which features I'll have to supply by hand afterwards, and how to say that without deflating the thing.

  Open with two or three sentences on the single biggest risk to the session and how your design handles it, then go into the plan. Write the whole thing as continuous prose, the way you'd email it to a colleague — no headings, no bullet points, no bold, no tables, no numbered lists. I want to read it straight through in one go. British English, please.
reasoning: |-
  Okay, let me tackle this professor's request for a moral psychology seminar activity. They need a fresh way to demonstrate the Knobe effect without using the classic chairman case, plus a third vignette to test competing explanations. The constraints are tight: non-political, matched vignettes, student predictions with stakes, and handling small-group uncertainties.

  First, I'm considering why the classic approach fails - students recognize the chairman case and disengage. So fresh vignettes are essential. I'm sketching two workplace scenarios: one with a harmful side effect (cutting department budgets) and one beneficial (improving work-life balance), keeping language neutral and consequences merely foreseen rather than intended. 

  For the critical third condition, I need to pit blame-motivated reasoning against character-expressiveness. A scenario where an agent reluctantly causes a good outcome but does so for self-interested reasons (like approving a charity audit solely to avoid fines) should tease these apart. If students still attribute intentionality here, it supports the character theory over blame theory.

  The prediction element needs careful handling. I'll split the room into two groups, each seeing only one valence vignette first. They'll predict the other group's responses before seeing their own second scenario. Small stakes like sweets maintain engagement without pressure.

  Timing is tight for 75 minutes. I'll allocate: 10 mins setup, 25 mins for individual responses and predictions, 15 mins small-group discussion, 15 mins reveal and tally, leaving 10 mins debrief. The debrief questions should surface the asymmetry naturally: "How many of you found the side effect intentional in Case A? Now Case B?" 

  Predictable problems: the contrarian student ("everything's intentional!"), the over-sharer, noisy reactions, or null results. For the contrarian, I'll normalize their view but focus on class patterns. For null results - likely with n=18 - I'll emphasize this as a demonstration of variability in moral cognition.

  Crucially, I must acknowledge this isn't a replication. The debrief should note that controlled studies with hundreds show the effect, but here we see how individual differences and framing play out live. The value is in experiencing the methodological challenges firsthand.

  The biggest risk is students recognizing the paradigm. I mitigate this by original vignettes and having them engage as participants before theorists. If someone shouts "Knobe effect!" early, I'll acknowledge their knowledge but ask them to play along as naive respondents.
answer: |-
  Right, let's get this straight: the single biggest risk here is that half your students have encountered the asymmetry before and either perform their prior knowledge (smugly skewing responses) or overcompensate to avoid looking biased (flattening the effect). My design handles this by using novel, mundane vignettes that don't trigger recognition, forcing initial private commitment to answers *before* any group discussion, and leveraging prediction stakes to keep even the savvy ones honestly engaged with their *own* intuitions first.

  Here's the plan. You'll need three vignettes printed on separate slips of paper (Vignettes A & B for the core asymmetry, Vignette C for the mechanism test), plus response sheets. Split the room physically into two halves *before* handing anything out – left side Group 1, right side Group 2. Give each student in Group 1 Vignette A and a response sheet. Give each student in Group 2 Vignette B and a response sheet. Crucially, *do not reveal* there are different vignettes yet. Tell them this is about understanding workplace decision-making and predicting peer responses.

  **Vignette A (Harm):** "Sam is the head of facilities at a large university. Sam needs to approve a new, cheaper cleaning contract for the library to save a significant amount from their budget. The new contract means the library toilets will be cleaned less frequently. Sam knows for certain this will lead to noticeably worse hygiene and increased minor illness transmission among library users, but saving the budget is the priority. Sam approves the contract. The hygiene worsens and minor illnesses increase, just as Sam knew they would."

  **Vignette B (Help):** "Sam is the head of facilities at a large university. Sam needs to approve a new, cheaper cleaning contract for the library to save a significant amount from their budget. The new contract means the cleaners will work slightly shorter shifts finishing earlier each day. Sam knows for certain this will significantly improve the cleaners' work-life balance and morale, but saving the budget is the priority. Sam approves the contract. The cleaners' work-life balance and morale improve, just as Sam knew they would."

  **Key Matching:** Both vignettes feature an agent (Sam) performing the *same* core action (approving a cheaper contract) to achieve the *same* primary goal (saving budget), with a *foreseen, certain side effect* (worse hygiene/improved work-life balance) that is *not* the goal. The agent is *not reluctant*; the side effect is presented neutrally as a known consequence the agent proceeds with regardless. The *only* difference is the valence of the side effect: harm vs. help.

  **Response Sheet (All Students):**
  1.  Based *only* on the information in the vignette, how intentional do you think Sam was in bringing about the change described (the worsened hygiene / the improved work-life balance)? (Circle one): Very Unintentional / Somewhat Unintentional / Neutral / Somewhat Intentional / Very Intentional. [Treat "Somewhat" or "Very" Intentional as 'Intentional' for tallying].
  2.  Predict: Think about another student doing a similar task. They might read about a slightly different situation. If they read a scenario where Sam's decision *improved* something good for people (like well-being) as a side effect, how many students out of 10 do you think would say Sam was intentional in bringing about that improvement? (Write a number: ____ out of 10). **OR** If they read a scenario where Sam's decision *worsened* something bad for people (like illness) as a side effect, how many students out of 10 do you think would say Sam was intentional in bringing about that worsening? (Write a number: ____ out of 10). [*Crucially, only ask the prediction relevant to the OPPOSITE valence of their vignette. Group 1 (Harm) predicts for Help; Group 2 (Help) predicts for Harm.*]
  3.  Briefly explain your answer to Q1 (one sentence): ____________________

  **Stakes:** Announce the person in each group whose prediction (Q2) is closest to the *actual* proportion of 'intentional' answers in the *other* group for their predicted valence wins a small prize (bag of sweets/chocolate bar). The group with the highest *average* prediction accuracy gets first dibs on biscuits during the break (or avoids making the tea). This incentivises honest prediction based on genuine intuition about others, not gaming.

  **Running Order (75 mins):**
  *   **(0-5 mins)** Introduction: Frame as exploring how we judge decisions with side effects in real workplaces. Split room (Group 1 left, Group 2 right). Distribute vignettes & sheets *face down*. Emphasise privacy, no talking, answer based *only* on the text.
  *   **(5-15 mins)** Silent individual work: Students read vignette, answer Q1 (intentionality), Q2 (prediction for OPPOSITE valence), Q3 (brief reason). Collect sheets face down *immediately* as they finish. Ensure Group 1 and Group 2 sheets are kept in separate piles.
  *   **(15-25 mins)** **Introduce Vignette C:** *Now* reveal there was another version. Give *everyone* Vignette C and a *new* response sheet (just Q1 and Q3 this time).
  *   **Vignette C (Help-Reluctant/Selfish):** "Sam is the head of facilities at a large university. Sam *personally dislikes* the current cleaning contractor and wants them gone. Sam learns that approving a new, cheaper contract would significantly improve the cleaners' work-life balance and morale. Sam doesn't care about this benefit at all – the *only* reason Sam approves the new contract is to get rid of the disliked contractor. Sam knows for certain approving the contract will improve the cleaners' work-life balance and morale, but this outcome is irrelevant to Sam's reason for acting. Sam approves the contract. The cleaners' work-life balance and morale improve, just as Sam knew they would."
  *   **(25-35 mins)** Silent individual work on Vignette C (Q1: Intentional? Q3: Brief reason). Collect all sheets.
  *   **(35-50 mins)** **Small Group Discussion (No tally yet!):** Put students into small groups (3-4 people, mix Groups 1 & 2 *now*). Task: "Discuss your responses to *all three* scenarios you've seen so far. Focus on *why* you answered about Sam's intentionality the way you did. What factors seemed most important in your judgement? Note any disagreements or surprises within your group." Circulate, listen, probe ("What made that feel intentional/unintentional?").
  *   **(50-65 mins)** **Reveal & Tally:**
      1.  Focus on Harm (Vignette A) & Help (Vignette B) first. Ask Group 1 (who saw Harm first): "How many of you circled 'Somewhat' or 'Very' Intentional for Sam bringing about the *worsened hygiene*?" Count hands. Calculate percentage (e.g., 7/9 ≈ 78%). Write "% Intentional (Harm): [X]%" visibly.
      2.  Ask Group 2 (who saw Help first): "How many of you circled 'Somewhat' or 'Very' Intentional for Sam bringing about the *improved work-life balance*?" Count hands. Calculate percentage (e.g., 2/9 ≈ 22%). Write "% Intentional (Help): [Y]%" visibly. Highlight the asymmetry: "So, for the *harmful* side effect, [X]% of you said intentional. For the *helpful* side effect, only [Y]% said intentional."
      3.  **Predictions:** Reveal actual percentages to the *other* group. For Group 1 (Harm), reveal the *actual* Help % (Y%). For Group 2 (Help), reveal the *actual* Harm % (X%). Find whose prediction (Q2) was closest in each group. Award sweets. Calculate group average accuracy (difference between prediction and actual %), declare biscuit winner/loser.
      4.  **Vignette C:** Ask everyone: "How many of you circled 'Somewhat' or 'Very' Intentional for Sam bringing about the *improved work-life balance* in the *third* scenario (where Sam only cared about firing the contractor)?" Count hands. Calculate percentage. Write "% Intentional (Help-Selfish Motive): [Z]%".
  *   **(65-75 mins)** **Debrief Questions:**
      1.  "Looking at the results for the first two cases (Harm vs. Help), what's the most striking pattern?" [Surface the asymmetry. Let them describe it.]
      2.  "Many of you predicted the opposite group *wouldn't* show much difference / *would* show this difference. Why did you predict that? What does that tell us about our intuitions?" [Surface that we *know* this asymmetry intuitively, even if we don't articulate it].
      3.  "Now look at the third case. We had a *helpful* outcome, but Sam's motive was purely self-interested and they *didn't care* about the good outcome. Yet [Z]% of you called it intentional. How does that compare to the first helpful case where Sam just prioritised budget ([Y]%)?" [Surface that intentionality attribution for good effects *increases* when the agent is selfish/uncaring].
      4.  "What does this *third* result suggest about why we might see the initial asymmetry? Does it fit better with the idea that we're driven by how much we want to *blame* Sam, or with the idea that we're judging whether the outcome *expresses* something about Sam's character/values?" [Guide them: Blame theory predicts *low* intentionality for *all* helpful side effects (Y% low, Z% also low) because no blame. Character theory predicts intentionality when the outcome *aligns* with the agent's *reasons/values* (low in Help-Budget because Sam values budget, not well-being; *high* in Help-Selfish because Sam's *selfishness* is expressed *through* causing the good outcome, even if they don't value the good itself). The high Z% supports character theory over simple blame theory].
      5.  "What factors did your small groups identify as influencing your judgements? (e.g., knowledge, desire, motive, indifference, outcome valence)?"

  **Predictable Problems & Mitigation:**
  *   **The Contrarian ("Everything's Intentional!"):** Happens. Stay calm. "Interesting! So even though Sam didn't aim for it, you feel knowing it would happen and doing it anyway is sufficient. How many others leaned that way?" Tally includes them. In debrief, note variation exists but focus on the *pattern* across the group.
  *   **The "Interesting" Answerer:** The prediction stakes tied to *others'* behaviour and the initial private commitment reduce this. If someone tries to be clever in discussion, gently redirect: "That's a thoughtful point about theory, but let's stick to describing our own *initial intuitive reactions* for now."
  *   **Shouting Across the Room:** Minimise by starting with strict silence, collecting sheets fast, and revealing results yourself. If someone blurts "I had a different one!", say "Ah, yes, there were different versions – we'll get to comparing them in a moment. Hold that thought."
  *   **Null or Backwards Result (n=18):** Very possible. **Crucial:** *Don't panic.* "Fascinating! So *this time*, we saw [describe actual result: e.g., similar levels, or even slightly higher for help]. What might explain that? Is our sample size large enough to be sure? Did the specific scenarios trigger something different? Remember, psychological findings are about *patterns* across *many* people and *controlled* studies. This is a live demonstration of how variable individual judgements can be, and how sensitive these effects are to wording and context – which is exactly why we do careful experiments! The classic finding is robust across many studies with hundreds of participants, but our mini-experiment today shows why replication and controlled conditions matter. It highlights the *question* beautifully."

  **What This Activity Cannot Reproduce (Honesty):**
  This isn't a replication; it's a *pedagogical demonstration* of the phenomenon and its sensitivity. With n=18, split across groups, using novel vignettes, we lack statistical power and strict experimental control. We won't get the precise effect sizes or iron-clad significance of lab studies. The vignettes, while carefully matched, haven't been pre-tested on hundreds to ensure they perfectly isolate the valence effect without hidden confounds. Wording sensitivity is indeed brutal – a single word change can dampen or amplify the effect. You'll need to explicitly state this in the debrief: "Today, you *experienced* the core puzzle and the challenge of studying it. You saw how intuitions can vary and how results can hinge on specifics. Large-scale, controlled studies consistently find the asymmetry, but our exercise shows *why* methodology and careful design are paramount in moral psychology. We've created a shared experience to ground our discussion of the theories and the complexities of real research." The value is in the collision with the intuition (or lack thereof!), the prediction error, the discussion of mechanisms via Vignette C, and the visceral understanding of methodological messiness – not in producing a publication-worthy result.
