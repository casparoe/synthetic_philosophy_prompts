  ### Adversarial Collaboration Report: The Semantics and Pragmatics of Slurs

  **Introduction**  
  This document presents the findings of an adversarial collaboration between two colleagues: a truth-conditionalist (TC) and an expressivist (E). The TC holds that a slur's derogatory force is part of the truth-conditional content (what is "said"), rendering slur sentences false in every application, with this falsity constituting the primary moral wrong. The E holds that derogation is non-displaceable expressive content, projecting through embeddings (e.g., negation, conditionals, indirect reports) and surviving cancellation attempts. Both agree that slurs carry inherent derogatory content, rejecting a third "prohibitionist" view that treats slurs as merely prohibited words without inherent meaning. Below, we outline agreed claims, surviving disagreements, and an assessment of merely verbal disputes.

  ---

  ### I. Agreed Claims  
  Both colleagues endorse the following claims, which are substantive enough to exclude the prohibitionist view (which denies inherent derogatory content). The prohibitionist could not sign these, as they treat slurs as taboo words whose offensiveness stems solely from social prohibition, not inherent meaning.

  1. **Descriptive Core and Derogatory Addition**:  
     A slur shares the same *descriptive extension* (i.e., reference to the same group) as its neutral counterpart (e.g., "k*ke" and "Jewish person" both refer to Jewish people). However, a slur *adds* derogatory content (e.g., contempt, inferiority) that the neutral counterpart lacks. This derogatory content is not reducible to contextual factors or speaker intention.

  2. **Competence without Instruction**:  
     Competent speakers know, without being told, that:  
     - A slur is inherently derogatory and offensive when applied to its target group.  
     - This offensiveness arises from the word's conventional meaning, not merely its history or social effects.  
     - Using a slur expresses contempt or hatred toward the target group, even if the speaker disclaims such attitudes.

  3. **Non-Cancellability and Projection**:  
     The derogatory content of a slur:  
     - Cannot be canceled by explicit disclaimers (e.g., "He is a k*ke, but I don’t mean it offensively" remains offensive).  
     - Projects through linguistic embeddings, including negation (e.g., "He is not a k*ke" still conveys derogation), conditionals (e.g., "If he is a k*ke, he is untrustworthy" still conveys derogation), and indirect reports (e.g., "She said he is a k*ke" still conveys derogation).

  4. **Distinction from Ordinary False Insults**:  
     A slur behaves differently from an ordinary false insult (e.g., "Paul is an idiot" when Paul is intelligent) because:  
     - The offensiveness of a slur is *conventional* and *systematic*, tied to the word itself, not contingent on falsity or context. An ordinary insult is offensive only if the attributed property (e.g., stupidity) is contextually inappropriate or false.  
     - The derogatory content of a slur persists in embeddings (e.g., negation) and resists cancellation, whereas the offensiveness of an ordinary insult does not project or survive cancellation (e.g., "Paul is not an idiot" negates the insult).

  5. **Moral Wrongness**:  
     The moral wrong of using a slur stems from its inherent derogatory content, which functions to subordinate and demean the target group. This wrong is not reducible to violation of social norms (as the prohibitionist holds) but arises from the expression of contempt.

  ---

  ### II. Surviving Disagreements  
  The table below outlines unresolved disputes. Each row includes:  
  - **Point at Issue**: The core disagreement.  
  - **TC's Statement**: Truth-conditionalist's position in their own wording.  
  - **E's Statement**: Expressivist's position in their own wording.  
  - **Concrete Case**: A mutually accepted scenario for testing predictions.  
  - **Predictions**: Each side's forecast about the case, recorded *before* examination.  

  | Point at Issue                | TC's Statement                                                                                                                                 | E's Statement                                                                                                                                                           | Concrete Case                                                                                                                                                                 | TC's Prediction                                                                                               | E's Prediction                                                                                                                                 |
  |-------------------------------|------------------------------------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------|
  | **Nature of Derogatory Content** | "The derogatory force is part of the truth-conditional content of a slur sentence. A slur sentence asserts two things: (1) group membership and (2) a derogatory property (e.g., contemptibility). Since (2) is false in every application, the sentence is false." | "The derogatory force is non-truth-conditional expressive content. A slur sentence has the same truth-conditional content as its neutral counterpart (e.g., group membership), but it conventionally expresses contempt." | **Case**: Utterance: "Paul is a k*ke" (Paul is Jewish). Both agree it is offensive.                                                                                             | "The sentence is false because it falsely asserts Paul is contemptible."                                    | "The sentence is truth-conditionally true (Paul is Jewish) but expressively derogatory."                                                     |
  | **Source of Moral Wrong**     | "The wrong arises from asserting a false and harmful claim (e.g., that the target is contemptible). Falsity is necessary and sufficient for the wrong."                     | "The wrong arises from expressing contempt, regardless of truth conditions. Expressing contempt is sufficient for the wrong, and it cannot be avoided by denying truth conditions." | **Case**: A speaker disavows the ideology: "I reject antisemitism, but Paul is a k*ke." Both agree it is offensive.                                                              | "The wrong occurs because the speaker asserts a false derogatory claim; the disavowal does not prevent this." | "The wrong occurs because the slur expresses contempt; the disavowal cannot cancel this expression."                                         |
  | **Projection in Negation**    | "In a negated slur sentence (e.g., 'Paul is not a k*ke'), negation targets both group membership and derogation. Since derogation is always false, if group membership holds, the sentence is true." | "In a negated slur sentence, negation only targets truth-conditional content (group membership). The expressive derogation projects and is unaffected by negation."     | **Case**: Utterance: "Paul is not a k*ke" (Paul is Jewish). Both agree it is offensive.                                                                                        | "The sentence is true (Paul is Jewish but not contemptible), but offensiveness comes from evoking the false contempt property." | "The sentence is truth-conditionally false (Paul is Jewish) and expressively derogatory."                                                   |
  | **In-Group Reclamation**      | "Reclamation alters truth conditions: a reclaimed slur (e.g., in-group 'k*ke') no longer encodes derogation. It may encode a positive property (e.g., pride), making sentences true." | "Reclamation alters expressive content only. The truth-conditional content remains identical to the neutral counterpart, but the expression shifts from contempt to pride/solidarity." | **Case**: An in-group member says: "I'm a k*ke and proud of it!" Both agree this can be non-offensive and empowering. | "The sentence is true; 'k*ke' now truth-conditionally denotes Jewishness and pride."                         | "The sentence is truth-conditionally true (speaker is Jewish) and expressively positive; no derogation is expressed."                          |
  | **Indirect Reports**          | "In indirect reports (e.g., 'She said Paul is a k*ke'), the reported utterance is false, and the report inherits this falsity. Derogation is attributed to the original speaker." | "In indirect reports, the truth-conditional content is preserved (e.g., group membership), but the expressive derogation projects to the current context, regardless of attribution." | **Case**: Utterance: "Anna said Paul is a k*ke" (Paul is Jewish; Anna used the slur). Both agree this can offend. | "The report is true only if Anna asserted Paul was Jewish; it is false because she asserted false derogation." | "The report is truth-conditionally true (if Anna referred to Paul as Jewish) but expressively derogatory in the current context."             |

  ---

  ### III. Merely Verbal Dispute  
  We judge that **part of the dispute over "what is said" is merely verbal**. Specifically:  
  - The TC uses "what is said" to mean *truth-conditional content* (e.g., "Paul is a k*ke" asserts group membership + contempt).  
  - The E uses "what is said" to mean *at-issue descriptive content* (e.g., "Paul is a k*ke" asserts only group membership), excluding expressive content.  

  **Feature Showing Verbal Dispute**: Both agree on the empirical behavior of slurs (e.g., projection, non-cancellability, offensiveness) and the core meaning (descriptive extension + derogation). The disagreement reduces to whether "derogation" is labeled as part of "truth conditions" (TC) or "expression" (E). This terminological divergence does not affect predictions about offensiveness or moral wrongness, as evidenced by the agreement in §I. However, it surfaces in truth-value assignments (e.g., in the **Positive Slur Sentence** and **Negation** cases), which remain substantive disagreements.  

  **Non-Verbal Core**: The irreducibly substantive disputes concern (1) truth-value assignments in embeddings and (2) the necessity of falsity for moral wrongness, as these generate testable predictions (e.g., TC predicts truth for negated slurs when group membership holds; E predicts falsity).  

