     - Response: Assent

  Situation 3:
     - What is present: One rabbit that is moving.
     - Utterance: "Gavagai lo"
     - Response: Assent

  Situation 4:
     - What is present: Two rabbits.
     - Utterance: "Mat gavagai"
     - Response: Assent

  Situation 5:
     - What is present: One rabbit. The native points to two different parts of the same rabbit (e.g., the ear and the tail) simultaneously.
     - Utterance: "Gavagai ete gavagai"
     - Response: Assent

  Situation 6:
     - What is present: Two rabbits. The native points to one part on the first rabbit and one part on the second rabbit simultaneously.
     - Utterance: "Gavagai ete gavagai"
     - Response: Dissent

  Situation 7:
     - What is present: One rabbit that is not moving.
     - Utterance: "Gavagai lo"
     - Response: Dissent

  Situation 8:
     - What is present: One rabbit and one bird.
     - Utterance: "Mat gavagai"
     - Response: Dissent (only one rabbit)
     - Utterance: "Baz"
     - Response: Assent

  Held-out sentences for translation (given to teams):

  Translate the following native sentences into English using your manual:

  1. Gavagai lo
  2. Mat gavagai
  3. Gavagai ete gavagai

  Tie-breaker round:

  After teams have created their manuals, give each team another team's manual (anonymized). Then, they have 5 minutes to design a question. The question consists of:
     - A description of a situation.
     - An utterance in the native language.

  They will then ask the facilitator (or TA) the utterance in that situation and get a response.

  Finally, the debrief.
answer: |-
  Below is a complete in-class game plan designed to meet your specifications. It focuses on the difference between underdetermination (lack of evidence) and Quinean indeterminacy (no possible evidence could settle the reference) using radical translation. The game avoids upfront lecture and delays the term "indeterminacy" until debrief. Students work in teams to build translation manuals, encounter empirical equivalence, and fail to break ties with new evidence—highlighting the key distinction. The rule sheet ensures rabbit/rabbit-stage/undetached-part manuals are empirically equivalent by keying solely on whole-rabbit presence, forcing teams to bend other terms (e.g., copula, counters) to fit the data.

  ---

  ### **Game Overview**
  **Title:** *The Gavagai Challenge*  
  **Objective:** Teams create translation manuals for a "native" language based on assent/dissent data. Manuals must handle held-out sentences, exposing how rabbit, rabbit-stage, and undetached-rabbit-part translations are empirically equivalent. Teams then try (and fail) to design tie-breaker questions, revealing the indeterminacy claim.  
  **Core Insight:**  
  - **Underdetermination:** Early in the game, teams think more evidence could resolve ambiguity.  
  - **Indeterminacy:** After tie-breaker fails, they see no evidence *could* resolve it—charity and "naturalness" are symmetric.  

  **Philosophical Tools Used:**  
  - **Occasion sentences:** All utterances are keyed to immediate stimuli (assent/dissent depends only on present conditions).  
  - **Standing sentences:** Excluded to sharpen the puzzle. Occasion sentences prevent appeals to time or history, making the indeterminacy starker.  

  ---

  ### **Materials List**
  1. **Rule Sheet (for Facilitator or TA "Native"):** 1 copy (see printable version below).  
  2. **Corpus Handout (observed assent/dissent data):** 1 per team.  
  3. **Held-Out Sentences Handout:** 1 per team (sentences to translate using their manual).  
  4. **Rival Manual Exchange Sheet:** 1 per team for tie-breaker round.  
  5. **Whiteboard or Projector:** To display responses during debrief.  
  6. **Timer:** For pacing rounds.  
  7. **Paper/Pens:** For teams to write manuals and translations.  

  ---

  ### **Printable Rule Sheet for Facilitator/TA**  
  *(Designed for quick reference; only whole-rabbit presence matters. If using a TA, add italicized notes.)*  

  **Native Response Rules**  
  *The native only responds to occasion sentences (immediate stimuli). Ignore time, memory, or non-visible properties. Only assent/dissent matters.*  

  1. **"Gavagai"**  
     - Assent if ≥1 whole rabbit is present and visible.  
     - Dissent otherwise.  

  2. **"Baz"**  
     - Assent if ≥1 bird is present and visible.  
     - Dissent otherwise.  

  3. **"Gavagai lo"**  
     - Assent if ≥1 whole rabbit is present and moving.  
     - Dissent otherwise.  

  4. **"Mat gavagai"**  
     - Assent if ≥2 whole rabbits are present.  
     - Dissent otherwise.  

  5. **"Ete gavagai gavagai"** (with two simultaneous pointings)  
     - Assent if both pointings land on parts of the *same* whole rabbit.  
     - Dissent otherwise (e.g., pointings on two rabbits or one rabbit + non-rabbit).  

  **TA Variant Additions (for live actor):**  
  - *Memorize the rules. If asked about past/future, say "only now matters."*  
  - *Stimuli examples:*  
    - Rabbit present + stationary? → "Gavagai": assent, "Gavagai lo": dissent.  
    - Two rabbit parts? → Only assent to "ete gavagai gavagai" if parts belong to the same rabbit.  

  ---

  ### **Corpus Handout (Observed Data for Teams)**  
  *Based on 8 real-world scenarios. All stimuli are occasion-specific (present moment only).*  

  1. **Situation:** One whole rabbit present (not moving).  
     - "Gavagai" → **Assent**  
  2. **Situation:** One bird present (no rabbit).  
     - "Gavagai" → **Dissent**  
     - "Baz" → **Assent**  
  3. **Situation:** One whole rabbit present and moving.  
     - "Gavagai lo" → **Assent**  
  4. **Situation:** Two whole rabbits present.  
     - "Mat gavagai" → **Assent**  
  5. **Situation:** One rabbit present; pointing to ear and tail (same rabbit).  
     - "Ete gavagai gavagai" → **Assent**  
  6. **Situation:** Two rabbits present; pointing to one part per rabbit.  
     - "Ete gavagai gavagai" → **Dissent**  
  7. **Situation:** One rabbit present (moving); one bird present.  
     - "Mat gavagai" → **Dissent**  
     - "Baz" → **Assent**  
  8. **Situation:** No rabbits or birds.  
     - "Gavagai" → **Dissent**  

  ---

  ### **Held-Out Sentences Handout**  
  *Teams must translate these using their manual. Forces bending of other terms to fit rabbit/stage/part choices.*  

  1. "Gavagai lo"  
  2. "Mat gavagai"  
  3. "Ete gavagai gavagai"  

  **Example Manuals (for your reference; not given to students):**  
  - **Rabbit manual:** "lo" = "moving," "mat" = plural, "ete" = "is part of the same."  
    - *Held-out 3:* "These are parts of the same rabbit."  
  - **Rabbit-stage manual:** "gavagai" = rabbit-stage, "lo" = "now," "mat" = temporal plurality, "ete" = "coincides in rabbit."  
    - *Held-out 3:* "These stages coincide in one rabbit."  
  - **Undetached-part manual:** "gavagai" = part, "lo" = "of a moving whole," "mat" = part counter, "ete" = "belongs to same whole."  
    - *Held-out 3:* "These parts belong to the same rabbit."  

  ---

  ### **Scoring Scheme**  
  *(No money needed; uses peer voting to avoid grading.)*  
  - **Translation Manual (35 points):**  
    - Completeness (10 pts): All words defined.  
    - Consistency (10 pts): Matches all corpus data.  
    - Held-Out Handling (15 pts): Translations are internally coherent (e.g., if "gavagai" = parts, "mat" must bend to count parts).  
  - **Tie-Breaker Question (15 points):**  
    - Creativity (5 pts): Novel stimulus/sentence pair.  
    - Clarity (5 pts): Clear why it should break the tie.  
    - Charity (5 pts): Respects native rationality.  
  - **Peer Grading:** Teams swap manuals and score using criteria above. Instructor moderates.  

  ---

  ### **Timeline (80 Minutes Total)**  
  **0–5 min: Setup**  
  - Form 3–4 teams (3–4 students each).  
  - Distribute: Corpus, held-out sentences, rules.  
  - **Instructions:** "You’re field linguists. Use this corpus to build a translation manual. Then translate held-out sentences. Goal: Predict assent/dissent for any new query."  

  **5–35 min: Manual-Building (30 min)**  
  - Teams create manuals + translate held-outs.  
  - **Crucial:** Circulate and ensure teams "bend" terms.  
    - *Sample nudge:* "If you choose rabbit-stage, how will you handle 'mat gavagai' for two rabbits? Bend 'mat' or 'ete'?"  

  **35–40 min: Manual Sharing (5 min)**  
  - Teams write manual type on board (e.g., "Team A: Rabbit").  
  - **No details yet**—just ontology choice.  

  **40–50 min: Held-Out Translation Reveal (10 min)**  
  - Teams post held-out translations.  
  - Facilitator uses rule sheet to show all are empirically equivalent:  
    - e.g., "Gavagai lo" → assent if rabbit moving, *regardless* of manual.  

  **50–55 min: Tie-Breaker Setup (5 min)**  
  - "Now, see a rival team’s manual. Design one question (situation + utterance) to prove yours is better. You get one response."  
  - Distribute rival manuals anonymously.  

  **55–65 min: Tie-Breaker Round (10 min)**  
  - Teams pose questions to facilitator/TA.  
  - **Responses always match rule sheet**, preserving equivalence.  
    - e.g., Team asks: "Point to a rabbit’s leg and ear, say 'ete gavagai gavagai'?" → Assent (same rabbit).  
  - Teams predict rival’s answer; all fail to break tie.  

  **65–80 min: Debrief (15 min)**  
  - **Map game moments to philosophy:**  
    - **Manual diversity (underdetermination):** "At first, you had competing manuals fitting the corpus. You thought, ‘We need more data!’ That’s underdetermination—evidence is incomplete."  
    - **Tie-breaker failure (indeterminacy):** "But when new questions failed, you saw no evidence *could* resolve it. That’s indeterminacy—no fact of the matter, even with perfect access."  
    - **Charity objection:** When a student says, "Just pick the natural rabbit reading!" respond:  
      > "Why is ‘rabbit’ more charitable? Your rival’s manual fits all data perfectly. If you insist ‘rabbit’ is simpler, your teammate might say ‘parts’ is simpler because it avoids abstract objects.’ Charity is symmetric here—it can’t break the tie because both manuals respect native rationality equally."  
    - **Occasion sentences:** "We used only occasion sentences (immediate stimuli) to mirror Quine. Standing sentences (e.g., about memory) would muddy the waters by adding hidden evidence."  
  - **Reveal the rule sheet:** "In the game, there *was* a fact of the matter (this sheet). But Quine argues that in real radical translation, there’s no ‘rule sheet’—only behavior. Indeterminacy means no deeper fact exists."  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem:** Teams don’t "bend" terms (e.g., they define "gavagai" as parts but leave "mat" as plural).  
     - **Fix:** During manual-building, ask: "If ‘gavagai’ is parts, how does ‘mat gavagai’ work for two rabbits? Must ‘mat’ mean something else?"  

  2. **Problem:** Tie-breaker questions use standing sentences (e.g., "What about yesterday?").  
     - **Fix:** Rule sheet says "only present stimuli matter." Interrupt: "The native only responds to now—try an occasion sentence."  

  3. **Problem:** One team dominates; others disengage.  
     - **Fix:** Assign roles: ontologist (chooses rabbit/stage/part), syntactician (bends "mat"/"ete"), empiricist (checks corpus fit).  

  ---

  ### **Limitation: What the Game Can’t Capture**  
  **The Rule Sheet Problem:**  
  In the game, the rule sheet defines a fact of the matter (whole rabbits), making this a case of underdetermination that *simulates* indeterminacy. But Quine’s real indeterminacy claim is metaphysical: there is no fact of the matter, even in principle. The game cannot reproduce this because the facilitator’s rule sheet acts as a hidden "reality." However, it *does* show that all possible behavioral evidence (assent/dissent) is identical across manuals, which is Quine’s bridge to indeterminacy: if no evidence can distinguish two claims, and there’s no further "reality" to appeal to, the distinction is empty. Acknowledge this in debrief to prevent confusion.  

  ---

  ### **Printable Handouts (Concise)**  
  **Corpus Handout (1 per team):**  
  ```  
  SITUATIONS:  
  1. [Rabbit] → "Gavagai": ✅  
  2. [Bird] → "Gavagai": ❌, "Baz": ✅  
  3. [Moving rabbit] → "Gavagai lo": ✅  
  4. [Two rabbits] → "Mat gavagai": ✅  
  5. [Point: ear + tail (same rabbit)] → "Ete gavagai gavagai": ✅  
  6. [Point: part on rabbit A + part on rabbit B] → "Ete gavagai gavagai": ❌  
  7. [Rabbit + bird] → "Mat gavagai": ❌, "Baz": ✅  
  8. [Nothing] → "Gavagai": ❌  
  ```  

  **Held-Out Sentences (1 per team):**  
  ```  
  TRANSLATE:  
  1. Gavagai lo  
  2. Mat gavagai  
  3. Ete gavagai gavagai  
  ```  

  **Tie-Breaker Sheet (1 per team):**  
  ```  
  RIVAL MANUAL TYPE: [Rabbit / Rabbit-stage / Undetached-part]  
  YOUR QUESTION:  
  - Situation: [Describe]  
  - Utterance: [Native phrase]  
  WHY IT BREAKS THE TIE: [1 sentence]  
  ```  

  --- 

  This game forces students to confront the gap between underdetermination and indeterminacy through hands-on failure. By making "charity" symmetric and tying responses solely to occasion sentences, it primes them for Quine’s radical conclusion. Run it as written, and they’ll feel the indeterminacy long before you name it.
