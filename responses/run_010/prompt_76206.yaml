prompt: |-
  I am writing the framework chapter of a dissertation on accuracy-first epistemology, and before engaging with any particular proposal I want to fix the target: a list of requirements that any accuracy-first framework — one that treats closeness to the truth as the fundamental epistemic value and tries to derive the norms of belief from it — must satisfy to count as adequate. The purpose is not a survey but a standard of assessment I can apply consistently. Specifically, I want a framework good enough to (i) replace coherence-based and Dutch-book considerations as the primary justification of the probabilistic norms, and (ii) be extended beyond single credences — to full belief, to imprecise or set-valued doxastic states, and to self-locating belief — without the extension changing the verdicts the framework already delivers in the simple cases.

  Deliverable: a numbered list of requirements. For each, state precisely what it demands ("must vindicate probabilism" is too crude; say what a vindication would have to look like, and what would show that it had failed), give the case or consideration that motivates it, and mark whether it is non-negotiable given the purpose above or is a preference of a particular camp. Where it is negotiable, say what a framework gives up by dropping it. Then — the part I most want — identify any subsets of the requirements that cannot be jointly satisfied. For each such subset, spell out the conflict concretely rather than announcing it, and say which member is most plausibly given up. Finally, tell me which single requirement does the most work in excluding candidates, and why.

  I expect that some of what I have jotted down is wrong-headed: a smuggled commitment of one camp, two requirements wearing a trench coat, or a desired conclusion disguised as a constraint. Prune the list, correct it, and tell me what is missing from it. Argue with it rather than ratifying it, and flag explicitly which of my entries are of the last two kinds.

  My draft:

  1. Veritism. Accuracy is the only fundamental epistemic value, and every other epistemic norm must be derivable from accuracy considerations alone.
  2. Non-pragmatism. No step in the framework may appeal to the agent's practical interests, stakes, or goals; the justification of a belief norm must be purely epistemic.
  3. Dominance. For any incoherent credal state there is a coherent alternative that is strictly more accurate at every world, so that incoherence is a demonstrable defect rather than a stipulation.
  4. Unique measure. There is a single privileged way of measuring inaccuracy, and the framework's results do not depend on an arbitrary choice among candidate measures.
  5. Immodesty. An agent's own credal state maximizes expected accuracy as judged by her own lights.
  6. Extensionality. The accuracy of a credal state depends only on the credences it assigns and on the world at which it is evaluated, not on how the state is described or on what else the agent believes.
  7. Additivity. The inaccuracy of a credence function over a set of propositions is the sum of the inaccuracies of its component credences.
  8. Feasibility. The framework does not require of a finite agent what she cannot do — in particular it does not demand credence one in every logical truth.
  9. No brute accuracy. The framework explains why accuracy matters rather than assuming that it does.

  Three further requirements I am more confident about, and one I invented and distrust:

  10. The bridge. If the framework's central argument is dominance-flavored, it must say why being dominated is a defect for an agent who does not care about accuracy, or who knowingly takes the dominated option because she likes it. Concretely: an agent chooses between two ways of distributing her confidence over the outcomes of an event, one of which is strictly less accurate than the other at every world, but she prefers the worse one for reasons of her own. The framework owes an account of whether she is irrational, merely unwise, or neither, and of what the difference between those amounts to.
  11. Stability under extension. Extending the framework to full belief by a threshold rule, to imprecise doxastic states, or to centered propositions must not overturn or undercut the norms it delivered for plain credences. If the extension forces precision on an agent whose evidence underdetermines her credences, I want to know whether that is a cost or a virtue, and on what grounds one would decide.
  12. Representational neutrality (mine, and I suspect it is either too strong or unsatisfiable). Two agents with identical total evidence and identical underlying epistemic situations, one of whom represents her opinions on a fine-grained algebra and the other on the coarse algebra obtained by merging cells, should not receive different normative verdicts merely because of that difference in carving. My worry is that this collides with 4: any candidate measure scores a credence function relative to a fixed representation, so merging or splitting cells changes the numbers and hence the verdicts. Either tell me the collision is real and say which of the two gives way, or show me a reading of neutrality that a measure-based framework can actually meet.

  I already suspect that 1 and 9 are in tension, and that 2 is doing more work than its proponents admit, since dominance reasoning is decision-theoretic machinery. I may be wrong about both.

  Keep the scorecard short. At the end, in a few sentences per contender, say how the three main approaches fare against your final list: deriving the norms from dominance considerations, deriving them from expected-accuracy-maximizing considerations, and the program of fixing a unique measure by imposing structural constraints on it. If a contender fails only because of a requirement you classified as negotiable, say so explicitly — I would rather have that than a false negative.
reasoning: |-
  Okay, let me tackle this user's complex query about accuracy-first epistemology framework requirements. The user is writing a dissertation chapter and needs a rigorous set of criteria to evaluate different frameworks. They've provided a draft list but want it critiqued, pruned, and analyzed for conflicts.

  First, I need to understand the core goals: (i) replacing coherence-based justifications for probabilism, and (ii) ensuring stable extensions to other doxastic states. The user explicitly wants conflicts between requirements identified, and wants to know which requirement filters out the most frameworks.

  Looking at the draft list, several items need immediate attention. Veritism (1) and "No brute accuracy" (9) seem circular - if accuracy is fundamental, why does it need further justification? This tension needs unpacking. Non-pragmatism (2) is tricky because dominance arguments inherently use decision-theoretic tools. The user is right to flag this.

  Unique measure (4) clashes hard with representational neutrality (12). Any scoring rule depends on propositional granularity, making neutrality impossible without measure-relativity. I should propose collapsing these into a single "measure-relativity" requirement.

  Feasibility (8) seems essential - we can't demand logical omniscience. But I notice the list misses something crucial: a requirement that the framework handles self-locating beliefs, which is vital for the extension stability (11).

  For conflicts, the big ones are:
  - Dominance (3) vs. Immodesty (5) in cases like dilation where no credence dominates but immodesty demands precision
  - Additivity (7) vs. full belief extensions since binary beliefs aren't additive
  - The entire package struggles with imprecise credences where dominance doesn't apply cleanly

  The dominance requirement (3) likely does the heaviest filtering - many frameworks (like Joyce's) rely on it, but it breaks for imprecise credences and full beliefs. Expected accuracy maximization avoids this but faces immodesty issues.

  For the three approaches:
  1. Dominance-based: Fails on imprecise credences and stability (11), but satisfies most core requirements otherwise
  2. Expected accuracy: Struggles with dilation cases violating immodesty (5), and may require pragmatism (2) for justification
  3. Axiomatic measures: Handles unique measure (4) but violates representational neutrality (12) and struggles with extensions

  I'll recommend dropping "no brute accuracy" (9) as redundant to veritism, and reframing representational neutrality (12) as measure-relativity. The bridge requirement (10) should stay - it's crucial for addressing why accuracy matters practically while maintaining epistemic purity.

  The feasibility requirement (8) deserves more emphasis - it's non-negotiable for any framework meant for real agents. And I'll add that self-locating belief test explicitly to extension stability.
answer: |-
  Here is a refined, conflict-tested list of requirements for an accuracy-first epistemic framework, designed for your assessment standard. I've pruned ambiguities, flagged negotiable items, identified fatal conflicts, and noted where your draft smuggled in commitments. The final list has **9 core requirements** (1 non-negotiable, 8 negotiable but motivated) and **3 structural tests** (2 non-negotiable). Contender assessments follow.

  ---

  ### **Refined Requirements List**  
  *(Non-negotiable = NN; others justified but potentially droppable)*  

  1. **Veritism (NN)**  
     - **Demands:** Accuracy (closeness to truth) is the sole fundamental epistemic value. All other epistemic norms (e.g., coherence, updating) must be derived *solely* from accuracy optimization.  
     - **Motivation:** Core to accuracy-first epistemology; without it, the project collapses into hybrid theories.  
     - **Failure:** If a norm (e.g., "avoid known contradictions") requires justification beyond accuracy (e.g., pragmatic penalty).  

  2. **Non-Pragmatism**  
     - **Demands:** No appeal to practical interests/stakes/goals in justifying belief norms. Purely epistemic justification required.  
     - **Motivation:** Preserves autonomy of epistemic rationality; avoids conflating "should believe" with "should bet."  
     - **Failure:** If a dominance argument relies on agents caring about avoiding sure loss (a practical concern).  
     - **Negotiable?** Yes, but dropping it collapses accuracy-first into pragmatic epistemology.  

  3. **Strict Dominance Avoidance (NN)**  
     - **Demands:** For any incoherent credal state, there must be a coherent alternative *strictly more accurate* at every possible world. "Incoherent" must be defined independently (e.g., violating probability axioms).  
     - **Motivation:** Replaces Dutch Books with accuracy-based defect; justifies probabilism without circularity.  
     - **Failure:** If some incoherent state isn't strictly dominated (e.g., if no coherent state dominates it everywhere).  

  4. **Measure-Relativity**  
     - **Demands:** The inaccuracy measure must be fixed relative to a given propositional representation (algebra). *Not* that there’s a single "privileged" measure for all representations.  
     - **Motivation:** Avoids arbitrariness *within* a choice of granularity; satisfies extensibility needs.  
     - **Failure:** If framework results change when using Brier score vs. logarithmic score *for the same algebra*.  
     - **Negotiable?** Yes, but dropping it invites "gerrymandered" measures that manipulate verdicts.  

  5. **Immodesty**  
     - **Demands:** An agent’s credal state must maximize *her own* expected accuracy (using her credences as weights).  
     - **Motivation:** Ensures self-endorsement; avoids epistemic self-sabotage.  
     - **Failure:** If an agent’s credences assign higher expected accuracy to an alternative state.  

  6. **Extensionality**  
     - **Demands:** Accuracy of a credal state supervenes *only* on (a) the state itself (e.g., credence function) and (b) the world. No dependence on description, belief system, or context.  
     - **Motivation:** Prevents ad hoc adjustments; ensures objective evaluability.  
     - **Failure:** If accuracy of credence *p* in *P* changes when *P* is embedded in a larger belief set.  

  7. **Additivity**  
     - **Demands:** Total inaccuracy is the sum of inaccuracies assigned to individual propositions (or atomic events).  
     - **Motivation:** Simplifies derivation; aligns with separable scoring rules (e.g., Brier score).  
     - **Failure:** If inaccuracy of *c* in *P∧Q* isn’t reducible to inaccuracies in *P* and *Q*.  
     - **Negotiable?** Yes—non-additive measures exist, but dropping complicates extensions.  

  8. **Feasibility (NN)**  
     - **Demands:** No norm requires logical omniscience or infeasible computation. Agents need only respond to *accessible* evidence.  
     - **Motivation:** Framework must apply to bounded agents; else it’s a theory of ideal gods, not humans.  
     - **Failure:** If framework demands credence 1 in all tautologies (e.g., lengthy mathematical truths).  

  9. **The Bridge**  
     - **Demands:** Explain why an agent who *knowingly* chooses a dominated credal state (e.g., for aesthetic reasons) is *epistemically* irrational, not merely unwise.  
     - **Motivation:** Addresses the "why care?" challenge; distinguishes epistemic from practical failure.  
     - **Failure:** If the framework labels such an agent as practically irrational but epistemically blameless.  

  ---

  ### **Structural Tests (Extension Stability)**  
  *(Non-negotiable given your purpose)*  

  10. **Full Belief Stability**  
      - **Demands:** Extending to full belief (e.g., via thresholding credences) must not weaken core norms (e.g., probabilism). If precision is forced where evidence underdetermines credences, this must be justified *from accuracy alone* (e.g., via dominance).  
      - **Failure:** If introducing full belief requires abandoning strict dominance for credences.  

  11. **Imprecision Stability**  
      - **Demands:** Extending to imprecise credences (sets of credence functions) must not imply that *all* precise credences are irrational when evidence is ambiguous. Framework must explain how/imprecise states avoid dominance.  
      - **Failure:** If the framework deems precise credences irrational in cases of ambiguity, but permits them in "simple" cases.  

  12. **Self-Locating Stability**  
      - **Demands:** Extending to centered propositions (e.g., "I am in room 101") must preserve norms for uncentered beliefs. Accuracy measures must generalize without ad hoc adjustments.  
      - **Failure:** If updating rules for centered evidence contradict Bayesian conditionalization in centered cases.  

  ---

  ### **Pruned/Revised Items from Your Draft**  
  - **"No Brute Accuracy" (9):** Dropped. Veritism (1) already implies accuracy is foundational; demanding further explanation *beyond* its role as epistemic good is either circular or non-epistemic.  
  - **"Unique Measure" (4) & "Representational Neutrality" (12):** Merged/revised as **Measure-Relativity**. Neutrality is **unsatisfiable**: splitting/merging propositions *must* alter inaccuracy scores (e.g., credence in *A∨B* vs. *A* and *B* separately). Requirement 4 now focuses on fixed algebras.  
  - **"Non-Pragmatism" (2):** Kept but weakened to negotiable—dominance arguments *are* decision-theoretic, but this is epistemic application.  

  ---

  ### **Fatal Conflicts**  
  **Conflict 1: Dominance (3) vs. Immodesty (5) in Ambiguity**  
  - **Concrete Issue:** In cases of severe ambiguity (e.g., complete ignorance), no precise credence dominates all others. Immodesty demands *some* precise credence is rational (since it maximizes expected accuracy by the agent's lights), but Dominance implies *no* precise credence is rational (as none dominates all alternatives).  
  - **Resolution:** Drop **Immodesty** (5). Dominance is core to replacing Dutch Books; immodesty is desirable but not essential for core probabilism.  

  **Conflict 2: Additivity (7) vs. Full Belief (10)**  
  - **Concrete Issue:** Full beliefs (binary states) cannot satisfy additivity—e.g., inaccuracy of believing *P* and *Q* isn’t sum of individual inaccuracies if *P* and *Q* are logically related.  
  - **Resolution:** Drop **Additivity** (7) for extensions. Additivity is useful for credences but not fundamental; non-additive measures (e.g., distance to closest truth-functional model) can handle full belief.  

  **Conflict 3: Veritism (1) vs. The Bridge (9)**  
  - **Concrete Issue:** Veritism assumes accuracy is the epistemic good, but The Bridge demands explaining *why* an accuracy-disdaining agent is irrational. This risks smuggling in non-veritist considerations (e.g., "epistemic oughts are categorical").  
  - **Resolution:** Clarify **The Bridge** (9): It demands *internal coherence*, not external justification. An agent who rejects accuracy can be deemed irrational *by veritist lights* without further meta-justification.  

  ---

  ### **Highest-Impact Requirement**  
  **Strict Dominance Avoidance (3)** excludes the most contenders:  
  - **Why:** It is non-negotiable for probabilism, but fails for:  
    - **Imprecise credences:** No single credence function dominates an imprecise state.  
    - **Full belief:** Dominance often fails (e.g., believing *P* in a *P↔¬Q* world is inaccurate, but so is disbelieving *P*).  
    - **Self-locating beliefs:** Dominance arguments struggle with centered worlds (no "every world" dominance).  
    Contenders must either weaken dominance (e.g., to *expected* dominance) or abandon it—undermining goal (i).  

  ---

  ### **Contender Report Card**  
  *(Against final list; ✗ = fails NN requirement)*  

  1. **Dominance-Based (e.g., Joyce 1998)**  
     - **✓** Veritism, Non-Pragmatism, Dominance, Extensionality, Additivity, Feasibility.  
     - **✗** **Imprecision Stability (11)**: Imprecise states cannot satisfy strict dominance.  
     - **✗** **Self-Locating Stability (12)**: No clear dominance in centered frameworks.  
     - **Weakness:** Fails extensions; The Bridge is shaky (dominated states are defective, but "why care?" unanswered).  

  2. **Expected-Accuracy-Maximization (e.g., Greaves & Wallace 2006)**  
     - **✓** Veritism, Immodesty, Extensionality, Feasibility, The Bridge (if rational agents maximize expected accuracy).  
     - **✗** **Dominance (3)**: Maximizing expected accuracy ≠ avoiding dominance (e.g., in ambiguity, immodesty permits dominated states).  
     - **✗** **Full Belief Stability (10)**: Thresholding credences may violate expected-accuracy maximization.  
     - **Weakness:** Fails core probabilism justification (goal i) if dominated states are sometimes rational.  

  3. **Axiomatic Measure (e.g., Pettigrew 2016)**  
     - **✓** Veritism, Dominance (for fixed algebra), Measure-Relativity, Additivity, Feasibility.  
     - **✗** **Imprecision Stability (11)**: Axioms often force precision (e.g., "admissibility" implies unique measures).  
     - **✗** **Self-Locating Stability (12)**: Centered cases require new axioms/measures; may conflict.  
     - **Weakness:** Prioritizes internal consistency over extensibility—fails goal (ii).  

  ---

  ### **Recommendations**  
  - **Drop Immodesty** (5): It causes conflicts and isn’t essential for core probabilism.  
  - **Keep The Bridge** (9): Vital for dialectical robustness, but frame it as exposing *internal inconsistency* in rejecting accuracy.  
  - **Emphasize Feasibility** (8): Non-negotiable for any framework targeting real agents.  
  - **Clarify Extensions:** Add "self-locating beliefs" explicitly to **Stability (11/12)**—your draft underspecified this.  

  This list balances rigor with flexibility: non-negotiables protect the accuracy-first core, while negotiable requirements allow trade-offs for extensibility. Dominance remains the biggest hurdle—prioritize frameworks that generalize it (e.g., to *group* dominance for imprecise credences).
