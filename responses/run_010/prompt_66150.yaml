answer: |-
  ### Commitment: Mulan as a Stealth Role Ethics Narrative  
  **I commit to your second reading.** The film *enacts* role ethics while *narrating* individualism. Its structural arc undermines its own rhetoric of an "inner self," exposing individualism as a linguistic crutch for describing what is actually role-creation. The losing side (individualism) must surrender its claim to metaphysical primacy—the "true self" is a mirage conjured by a culture that lacks the vocabulary for role-based personhood.  

  ---

  ### Addressing Your Three Points  
  **1. The Matchmaker Scene: Li as Hollow Ritual vs. Cultivation**  
  The scene criticises *ritual divorced from relational meaning*, not *li* itself. The villagers perform roles (bride, matchmaker, mother) as bureaucratic theatre—rote actions stripped of *ren* (consummatory conduct). Mulan’s failure isn’t rejecting roles, but exposing the absence of felt commitment. The ink-stained checklist, the chaotic tea service—these are *li* corrupted into a checklist, not *li* as the cultivation of humaneness. Role ethics survives because it condemns this emptiness: true *li* would have integrated Mulan’s vitality into the role (e.g., her cleverness harnessed for matchmaking).  

  **2. The Deception: Lying to the Community That Constitutes You**  
  Role ethics *cannot* fully absolve the lie. Her deception fractures relational trust—the bedrock of role ethics. Shang spares her life but exiles her; the community’s judgment is real. Yet her subsequent conduct *reconstitutes* her personhood through new roles: her prowess as a soldier and leader forges bonds (comrade, saviour) that eclipse the deception. The Emperor’s bow doesn’t excuse the lie; it ratifies her *new role* ("hero of China"). Punishment is relational, not moralistic: she loses Shang’s trust until she re-earns it through action.  

  **3. Role Ethics and Conservatism: Inventing Roles When Society Denies Them**  
  Role ethics *must* borrow liberalism’s tools here—but only to kickstart the process. Mulan’s initial act ("stealing" her father’s role) requires a proto-liberal self (hence "Reflection"’s lyrics). But this "self" is inert until she *performs* the soldier role. Her victory isn’t "being true to herself"; it’s *excelling in a role society denied her*, forcing the community (via the Emperor) to recognise it. Role ethics thus grounds refusal *as role-creation*: rejecting one role (bride) to fulfill a higher one (filial daughter/saviour) through improvised conduct. The wall climb isn’t individualism—it’s virtuosic *role-making*.  

  ---

  ### Where the Film Resists Role Ethics (And Where You’re Forcing It)  
  - **The Ancestors:** Their comic bickering undermines Confucian solemnity. They embody supernatural individualism ("we see your true heart!") and reduce roles to farce.  
  - **The Romance Subplot:** Shang’s attraction to "Ping" (Mulan’s male persona) is narratively superfluous and imports Western "love conquers all" tropes. It does zero philosophical work.  
  - **"Reflection" and "True Self" Rhetoric:** The lyrics explicitly endorse an inner essence—a concession to Disney’s audience. You *must* acknowledge this strain, but argue the film’s *actions* betray its words.  
  - **Mulan’s Final Line ("Maybe I did it for me"):** This is the film’s weakest moment philosophically. It jars with the role-ethical climax (the Emperor’s bow, her father’s embrace). Treat it as a sop to individualism—the price Disney paid for mass appeal.  

  ---

  ### What the Film Offers That Journals Cannot  
  Mulan makes **role ethics visceral**. It shows:  
  - **The agony of hollow roles:** The matchmaker scene’s claustrophobia makes you *feel* the suffocation of ritual without *ren*.  
  - **The sweat of role-creation:** Training montages aren’t about self-discovery; they’re the grueling *practice* of becoming a role until it fits.  
  - **The shock of recognition:** When the Emperor bows, we experience the dizzying weight of a community ratifying a role *you forged*. No article can replicate that phenomenology.  
  - **The terror of rolelessness:** Mulan’s exile after exposure isn’t guilt—it’s existential collapse. Without relational validation, she ceases to *be* ("I know my place... it is not with you").  

  ### Recommendation  
  **Use this film.** Its tension between individualist tropes and role-ethical structure is its strength. It forces audiences to confront the inadequacy of "true self" language when describing how we actually live. End by noting Mulan’s father: when he pushes aside the sword (symbol of her role) to embrace her, he doesn’t embrace her "essence"—he embraces the *daughter whose roles now include "saviour of China."* That’s role ethics in motion.  

  ---

  **Delivery Note:** Focus on key scenes (matchmaker, training, exposure, Emperor’s bow, homecoming) to anchor philosophy in plot. Allot 3 mins for Q&A pushback on "conservatism"—emphasise Mulan’s *radical role innovation* as the rebuttal. British vocab secured ("sop," "kerfuffle," "whilst"). 25 minutes achievable. Break a leg.
