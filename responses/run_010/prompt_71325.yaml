prompt: |-
  Play a New Testament scholar who's also spent real time in general historiography and epistemology — someone who can step outside the Jesus guild's habits for a minute.

  I'm starting a methods seminar on the quest for the historical Jesus and I don't want to open with another book that just *applies* the criteria. I want the spec first. So: what does a set of criteria of authenticity have to deliver before it counts as a method at all?

  Fix the purpose, because adequacy is relative to it. Mine is this: a method good enough to adjudicate between the big competing portraits — say, Jesus as an apocalyptic prophet expecting an imminent cosmic reversal, versus Jesus as a non-apocalyptic teacher of subversive wisdom — without the outcome being decided by who's doing the adjudicating. If you think that purpose is already incoherent, tell me why and pick a better one, but say which you're using.

  Then give me the desiderata list, with the consideration or case behind each one, not just a label. Some candidates I've got, add freely and throw some out as camp prejudice rather than real requirements:

  - it must be able to assign material to Jesus without already presupposing a picture of Jesus. The classic worry: a dissimilarity filter can only surface what's unlike both first-century Judaism and the later church, so what it hands back is a figure who belongs to neither — a Jesus who looks like nobody in particular. Is that a fatal defect of that criterion, or a fair price for getting something checkable?
  - it must be consistent with what we otherwise know about oral tradition and collective memory in a non-literate setting, including the fact that a community preserves things *because* they matter to it, not despite that.
  - it has to leave the data explained — criteria so strict that the existence of the tradition itself becomes inexplicable are self-undermining.
  - it must handle the near-universality problem: almost everything is multiply attested at some level of generality. Mark, Q (if you want it), Paul, John, Thomas. So does attestation of a *theme* across sources count the same as attestation of a *specific saying*? And what if the sources aren't as independent as the counting assumes?
  - it must say what to do when criteria conflict, and whether they're weightable or just vetoing.
  - embarrassment: a criterion that runs on the historian's own guess about what would have been awkward for the early church — does that pass any test of intersubjective checkability, or is it just the historian's theology in reverse?
  - a criterion has to be able to fail. If nothing in the gospels could in principle be rejected by the method, is it a method?

  Mark which of these are non-negotiable and which are the preferences of one camp (form-critical, positivist, memory-approach, whatever). Tell me which single requirement knocks out the most existing proposals. And — this is the part I most want — say whether some subset is jointly unsatisfiable. Specifically: can you have criteria that are (a) independent of the historian's own reconstruction, (b) able to find material that is continuous with Judaism and with the early church rather than only material that's discontinuous, and (c) strong enough to underwrite confident individual attributions? If the list turns out to be an impossibility result, say so plainly and say which of the three has to go.

  End with a very short scorecard, two lines max per entry: the classic package (dissimilarity, multiple attestation, embarrassment, coherence, Semitic linguistic environment) and the memory-based alternative that wants to replace it. Keep it short, the list is the deliverable.

  Think carefully and actually brainstorm before you commit — a first pass that just relabels the existing criteria as "desiderata" is exactly what I don't want. Bottom line up front: your very first sentence should be your verdict on whether an adequate set of criteria is possible for the purpose above, then the list and reasoning. No preamble, and don't restate my question back at me.
reasoning: |-
  Okay, the user is a scholar setting up a methods seminar on the historical Jesus. They want to start with the theoretical underpinnings of criteria of authenticity rather than jumping into applications. Their main goal is a method that can objectively adjudicate between major competing portraits of Jesus, like apocalyptic prophet vs. wisdom teacher, without the outcome being influenced by the scholar's own biases.

  First, I need to determine if such a method is even possible. Given the nature of the sources—fragmentary, theologically shaped, and from a primarily oral culture—complete objectivity seems unattainable. Historians always bring some subjectivity, especially when dealing with religious texts. So the purpose might be too ambitious. Instead, a more realistic goal would be a method that minimizes bias and offers testable hypotheses.

  Next, the user listed several desiderata. I should evaluate each for necessity and feasibility. For example:
  - Independence from a presupposed Jesus picture is crucial but hard to achieve. Dissimilarity fails here because it isolates Jesus from both Judaism and early Christianity, creating an artificial figure.
  - Consistency with oral tradition is non-negotiable. Communities preserve what's relevant, so criteria must account for why material was retained.
  - Explaining the data is key. Overly strict criteria that make the tradition inexplicable are self-defeating.
  - Handling the near-universality problem: Multiple attestation needs clear rules on what counts as independent sources and how thematic vs. specific attestation is weighted.
  - Criteria conflict resolution: Need a hierarchy or weighting system.
  - Embarrassment is too subjective; relies on guessing what early Christians found awkward, which varies by scholar.
  - Falsifiability: If a method can't reject any material, it's not a method.

  The big challenge is the triplet: independence, continuity, and strong attributions. Can all three coexist? If criteria are independent of reconstruction but also find continuity, they might be too vague to make strong attributions. For example, criteria based on oral tradition might show continuity but lack precision for specific sayings. So probably, strong individual attributions have to be sacrificed for broader reliability.

  Classic criteria (dissimilarity, multiple attestation, etc.) have issues with subjectivity and creating a disconnected Jesus. Memory approaches focus on general impressions but struggle with specifics. The user's purpose requires strong attributions to differentiate between apocalyptic and wisdom portraits, which might not be feasible. Thus, the conclusion is that an adequate set meeting all aspects of the purpose isn't possible; instead, focus on controlled hypotheses about the tradition's development.

  In the scorecard, highlight that classic criteria prioritize sayings but are circular, while memory approaches offer plausible general images but lack specificity. The user might need to adjust their seminar's focus towards evaluating how different methods handle these trade-offs rather than seeking a perfect method.
answer: |-
  ### Verdict on Adequacy  
  **An adequate set of criteria is impossible for your stated purpose** because adjudicating *confidently* between major competing portraits (e.g., apocalyptic vs. non-apocalyptic) requires strong individual attributions, but no criteria can achieve this without circularity or subjective bias. I’ll adopt a revised purpose: *a method that generates testable, minimally biased hypotheses about the Jesus tradition’s development, while acknowledging its inability to "prove" core historical claims about Jesus’s intent*.  

  ### Non-Negotiable Desiderata (with Rationale)  
  1. **Independence from Presupposed Reconstruction**  
     *Why essential*: If criteria assume a portrait (e.g., "apocalyptic" lens favoring eschatological sayings), they reinforce bias. *Rationale*: Historiography demands detachment from the object studied. Failure here invalidates the method.  
  2. **Consistency with Oral Tradition Dynamics**  
     *Why essential*: Gospels emerged from communities preserving *useful* traditions. Criteria assuming "authentic=unusable by the church" (e.g., classic embarrassment) contradict how memory works. *Rationale*: Anthropology shows traditions adapt to community needs; ignoring this creates a fictional Jesus.  
  3. **Explanatory Power for the Tradition’s Existence**  
     *Why essential*: If criteria declare most material inauthentic (e.g., hyper-skeptical dissimilarity), they cannot explain why those traditions persisted. *Rationale*: A method that renders its own evidence inexplicable is self-refuting.  
  4. **Falsifiability**  
     *Why essential*: Criteria must allow rejection of material (e.g., clear anachronisms). *Rationale*: Unfalsifiable methods are dogma, not scholarship (e.g., "coherence" often insulates favored material).  

  ### Negotiable/Contested Desiderata  
  5. **Resolution of Criteria Conflict**  
     *Why contested*: Weighting (e.g., multiple attestation > embarrassment) is inherently subjective. *Rationale*: Historians can prioritize based on evidence type (attestation > inference), but this reflects epistemic values, not objective rules.  
  6. **Handling Near-Universality**  
     *Why contested*: Thematic attestation (e.g., "kingdom of God") vs. specific sayings requires source-critical judgments about independence. *Rationale*: All criteria rely on contested source models (e.g., Q’s existence); this is unavoidable but manageable via transparency.  
  7. **Embarrassment as Criterion**  
     *Why flawed*: It projects modern assumptions onto ancient actors (e.g., "crucifixion was embarrassing" ignores 1 Cor. 1:23’s embrace of the cross). *Rationale*: Fails intersubjective checking—what one scholar deems "embarrassing," another sees as theologized.  

  ### The Impossibility Result  
  **The triplet (a) independence, (b) continuity-friendly criteria, and (c) strong individual attributions is unsatisfiable.**  
  - **(a) Independence** requires criteria detached from specific reconstructions (e.g., dissimilarity).  
  - **(b) Continuity** necessitates criteria capturing Jesus within Judaism/early Christianity (e.g., "historical plausibility").  
  - **(c) Strong attributions** demand precision (e.g., "this saying is authentic").  
  **Conflict**: (a) and (b) conflict methodologically (dissimilarity excludes continuity; plausibility requires reconstruction). (c) is unattainable because oral traditions resist pinpoint attribution. **Sacrifice (c)**: Strong individual attributions must yield to probabilistic judgments about general themes.  

  ### Single Requirement Knocking Out Most Proposals  
  **Independence from reconstruction** eliminates:  
  - "Coherence" (assumes a prior Jesus portrait)  
  - "Embarrassment" (assumes knowledge of early church priorities)  
  - "Interpretive context" criteria (e.g., "authentic if it explains later developments").  

  ---

  ### Scorecard: Two Methods  
  **Classic Criteria (Bultmann et al.)**  
  *Strengths*: Clear filters for sayings (e.g., dissimilarity isolates unusual material).  
  *Fatal flaw*: Presupposes a discontinuous Jesus; circular (coherence reinforces initial dissimilarity finds).  

  **Memory Approach (Dunn, Keith, Le Donne)**  
  *Strengths*: Grounded in orality; explains tradition persistence via "memory refraction."  
  *Fatal flaw*: Can reconstruct broad impressions (e.g., Jesus as healer) but not resolve intent (apocalyptic vs. wisdom).  

  **Bottom Line**: No method delivers your original purpose. Focus on how traditions evolved, not what Jesus "really said."
