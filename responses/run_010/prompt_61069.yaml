          Person 1: 1
          Person 2: -1
          Person 3: 1
          Person 4: -1
          Person 5: 1
          Person 6: -1
          ... (and so on, alternating forever)

          We can write the first 10 on the card and then write "..." and say the pattern continues.

          For Group1 instruction card:
          "Compute the total well-being of World A by grouping the people in consecutive pairs: 
            (Person1 and Person2), (Person3 and Person4), (Person5 and Person6), etc.
          For each pair, add the two numbers. Then sum all these pair-sums.
          If the total is a number, write it here: ________"

          For Group2 instruction card:
          "Compute the total well-being of World A as follows:
            Start with the well-being of Person1.
            Then, for every subsequent pair of consecutive people starting from Person2, add the well-being of two consecutive people and add that to the total. Specifically, add (Person2+Person3), then (Person4+Person5), then (Person6+Person7), etc.
          If the total is a number, write it here: ________"

          Then for the simulation, we will need to create 14 index cards, each for a pair of people:

          Card for Pair 1 (Persons 1 and 2): 
            Original: 1, -1
            If swapped: -1, 1

          Card for Pair 2 (Persons 3 and 4): 
            Original: 1, -1
            If swapped: -1, 1

          ... and so on.

          The stake: 
          - We want to avoid tokens. Instead, frame the well-being as something like "happiness points" that are real. But the swap choice: what is the ethical stake? 

          Idea: Tell the students that they are acting as a council of angels. Each angel can choose to swap the well-being of two adjacent people if they think it might lead to a more just arrangement. But they must decide without knowing what the others will do. After they see the result, they will discuss whether the new world is better.

          But the swap doesn't change the multiset of well-being numbers, just the order. So if they believe the order doesn't matter for the total, then they might think it doesn't change the goodness. But we've seen that the order matters for the total by Method2.

          However, the ethical question: does the order of well-being matter? Or only the distribution? This is a deep question. We might avoid it by saying that the council is allowed to reassign the well-being levels to different people (by swapping) and that the individuals don't have an identity beyond their well-being. So it's the same as redistributing the well-being.

          But then the swap changes who gets what. And if the individuals are distinct, then swapping might be seen as a change.

          Given the complexity, we might simply say: you have the power to swap or not, and then we will compute the total by the two methods to see if it changes the outcome.

          To make it have ethical content: Explain that the council is considering which of two worlds to create. They have a proposed world A (with the alternating sequence) and they can choose to make small changes (swaps) before creating it. They want to know if their changes make the world better.

          But then they will see that by their changes, the total by Method2 changes, so they might think they are making the world better or worse. But by Method1, it's the same.

          This highlights that the instruction "add up the well-being" is not well-defined.

          I think this is the best we can do.

          Let's write the timeline with approximate times.

          Minute-by-minute:

          0-5: Introduction
            - We are considering creating a new world (World A) with an infinite population. The well-being of the people is given by the sequence: 1, -1, 1, -1, ...
            - Compare to a baseline world (World B) where everyone has 0.
            - Task: Is creating World A better than creating World B?

          5-10: Divide into two groups. Hand out:
            - Group1: instruction card for paired grouping.
            - Group2: instruction card for the other grouping.
            - Both groups get the same world-card for World A.

          10-25: Group work (15 minutes)
            - Groups compute the total of World A by their method.

          25-30: Groups report: Group1 says 0, Group2 says 1.

          30-35: Class reaction: Why the discrepancy?

          35-40: Introduce the council of angels simulation. 
            - We have the power to make small changes: each student can swap the well-being of two adjacent people in the sequence, but only for one pair. 
            - There are 14 pairs (covering the first 28 people). The rest of the infinite sequence remains as alternating 1 and -1.
            - Each student will decide independently whether to swap their assigned pair.

          40-45: Hand out index cards for the pairs. Each student writes their choice (swap or not) without consulting.

          45-50: Collect the choices. Write the new sequence for the first 28 people on the board.

          50-60: Compute the total of the new sequence by both methods (for the first 28 people). 
            - Method1: group in pairs and sum the pairs, then add -> will be 0.
            - Method2: person1 + (p2+p3) + (p4+p5) + ... + (p26+p27) [leaving out p28] -> this will be some number S.

          60-65: Compare: 
            - Method1 says the total is 0.
            - Method2 says the total is S.

          65-75: Discuss: 
            - Individually, did your swap change the total by Method1? (No, because your pair still summed to 0.)
            - Did it change the total by Method2? (Yes, potentially, because it changed the values in the groups that involve your pair and the next.)
            - But note: each swap only changed two people. Why did it change Method2's total?

          75-90: Debrief and connect to ethics:
            - The main point: In infinite populations, the instruction "add up the well-being" is not well-defined. It can depend on the order of summation or on the grouping.
            - This is a problem for consequentialism, which relies on the total.
            - What alternatives are there? (This leads into the reading.)
            - Also, note that in the simulation, even though individually each angel only affected two people, collectively they changed the outcome of Method2. But in the infinite world, any finite number of swaps leaves the tail unchanged, so the series still diverges. Only infinitely many swaps can change the entire series. But that's beyond human power.

          What could go wrong in the first run:

          1. The analysis students might point out that the series is divergent and that the grouping methods are invalid.
             - Response: Acknowledge that, but stress that in the absence of a definition for adding infinitely many numbers, people might try these natural methods. The point is that without a rigorous definition, we get conflicting results.

          2. The group that refuses to compare: They might say "infinity is not real" or "we can't add infinitely many numbers".
             - Response: In ethics, we often idealize to infinite populations to get clean cases. If our ethical theory breaks down in the idealization, that's a problem.

          3. Seen as a math trick: 
             - To counter: Emphasize that the problem is not that the math is weird, but that the ethical instruction "add up" is not defined for these cases. Ask: "If we cannot add up, how can we compare the worlds? Is there a way to compare that doesn't rely on the sum?"

          Finally, the activity cannot reproduce the true infinite rearrangement. We only see a finite effect. In the debrief, we will have to explain that in the infinite case, by rearranging the entire series, we could make the total be any number (if the series were conditionally convergent) or in this case, we could make the partial sums behave very differently. But the key ethical point is that the order of the well-being assignments should not matter for the total if the individuals are identical in every way except well-being, but here the order does matter for the sum. This is a paradox.

          We are done.
