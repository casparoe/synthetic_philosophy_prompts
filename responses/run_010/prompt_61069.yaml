  - Then, in the simulation, we saw that individual changes (only finitely many) did not change the total by Method1, but did change the total by Method2. However, collectively they changed the finite segment, and that changed the result of Method2.
  - But in the infinite world, if we could have infinitely many such changes (rearranging the entire series), then we could make the total by Method2 be any number we want? (Actually, for the series 1-1+1-1+..., by rearrangement we can make the series converge to any integer? Or diverge? Not exactly, but we can get partial sums that oscillate between any two integers.)

          However, the ethical point: 
            - The instruction "add up the well-being" is not well-defined for an infinite population if the series is not absolutely convergent.
            - Therefore, we cannot use the total as a criterion for comparing infinite worlds.

          To prevent the "maths trick" impression, emphasize that the problem is not with the series being weird, but with the instruction "add up" being ambiguous in the infinite case. In finite populations, it's well-defined. In infinite ones, we need a different method.

          Now, for the potential problems:

          1. The analysis kids might shout out: "This is the Riemann rearrangement theorem!" 
             - How to handle: Ask them to hold back and let the others experience the confusion. Maybe assign them as observers or ask them to compute silently and not share until the debrief.

          2. A group refuses to compare infinite worlds and sits there.
             - How to handle: Encourage them to try the computation as instructed, even if they are skeptical. The goal is to see what the instructions lead to.

          3. The room concludes it's a math trick with no ethical content.
             - How to handle: In the debrief, stress that the ethical theory they know (total consequentialism) relies on adding up well-being. If that adding up is not well-defined, then the theory breaks down. We are at the limits of the theory. Ask: How can we compare two infinite worlds if not by the total? What alternatives do we have?

          What the activity can't reproduce:
            - The true infinite rearrangement: we only did a finite part. So we have to explain that in the infinite case, by rearranging the entire series, we can make the total be any number (for a conditionally convergent series) or in this divergent case, we can get different behaviors. But the point stands: the total is not invariant under rearrangement, and since rearrangement doesn't change the well-being of any individual (it just swaps them), it's problematic to base the goodness of a world on an ordering.

          Given the time (90 minutes), we might be able to do:

            0-5: intro
            5-25: group work (10 minutes for computation, 10 minutes for group discussion and then report)
            25-35: class discussion of conflict
            35-40: explain the simulation
            40-50: students make their swap choices
            50-60: compute the new sequence and then apply both methods
            60-70: discuss the simulation outcome
            70-90: debrief and connect to ethics

          But the simulation may take longer.

          Alternatively, if pressed for time, we can drop the simulation and go straight to the debrief after the group conflict. But the request specifically asked for the individual choices.

          Given that, I'll provide the world-card for World A (with the sequence) and then the instructions for the groups.

