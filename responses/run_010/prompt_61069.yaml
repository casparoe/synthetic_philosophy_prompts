  ### Activity Design: "Infinite Well-Being Comparison"

  **Core Problem:** Students will discover that **totaling well-being in infinite populations is ambiguous**—it depends on the *method of summation*, not just the numbers. This undermines naive consequentialism. The activity avoids advanced math (no series notation) and uses simple arithmetic with index cards. The ethical stake is **determining if one world is "better" than another**, framed as a moral dilemma for a "Council of Guardians" (students) tasked with world creation.

  **World Cards**  
  Print one copy per group. Numbers represent well-being (e.g., 1 = "good life", -1 = "suffering").  
  - **World A Card**:  
    ```
    Person 1: 1  
    Person 2: -1  
    Person 3: 1  
    Person 4: -1  
    Person 5: 1  
    Person 6: -1  
    ... (continues forever: 1, -1, 1, -1, ...)
    ```  
  - **World B Card**:  
    ```
    Person 1: 0  
    Person 2: 0  
    Person 3: 0  
    Person 4: 0  
    Person 5: 0  
    Person 6: 0  
    ... (continues forever: 0, 0, 0, ...)
    ```  

  **Stake**  
  Students act as **Guardians** deciding whether to create **World A** (alternating well-being) or **World B** (uniform neutrality). The goal isn't tokens or points but **moral justification**: "Is A better than B?" This avoids gamification and centers ethics.

  ---

  ### Timeline (90 Minutes Total)

  #### **0–10 min: Introduction**  
  - **Setup**:  
    - "Today, we’re Guardians deciding which infinite world to create: **A** or **B**. Your task: Is switching from B to A an improvement? Each person’s well-being is fixed (see cards)."  
    - Emphasize stakes: "This isn’t hypothetical—your choice *creates* a world. You must justify your answer arithmetically."  
  - **Rules**:  
    - Groups compute with pencils/paper.  
    - No breaks, no projector. Use whiteboard for group answers.  

  #### **10–30 min: Group Computation (Conflict Phase)**  
  - Divide class into **Group 1** and **Group 2** (7 students each).  
  - Give both groups **identical World A and World B cards**.  
  - **Instructions**:  
    - **Group 1**: "Compute the total well-being for World A. **Add in pairs**: (Person 1 + Person 2) + (Person 3 + Person 4) + (Person 5 + Person 6) + ..."  
      - *They’ll get: (1 + -1) = 0, (1 + -1) = 0, ... → Total = 0*  
    - **Group 2**: "Compute the total well-being for World A. **First add Person 1 alone, then add pairs starting from Person 2**: Person 1 + (Person 2 + Person 3) + (Person 4 + Person 5) + ..."  
      - *They’ll get: 1 + (-1 + 1) = 1, + (-1 + 1) = 1, ... → Total = 1*  
  - **World B**: Both groups compute B’s total as 0 (all zeros).  
  - **Question**: "Is switching from B to A an improvement?"  
    - Group 1: "**No improvement** (A = 0, B = 0)."  
    - Group 2: "**Improvement** (A = 1 > B = 0)."  
  - **Key Moment**:  
    - Have groups write totals on whiteboard. Point out conflict: *Same worlds, same numbers, different conclusions*.  

  #### **30–40 min: Individual Choice (Simulation Phase)**  
  - **Setup**:  
    - "Guardians, you now have individual power. Each of you controls **one pair of adjacent people** in World A. You can **swap** their well-being or **leave it**."  
    - Hand out **14 index cards** (one per student). Each card shows a pair:  
      ``` 
      [Person 1: 1, Person 2: -1] → Swap to [-1, 1]?  
      [Person 3: 1, Person 4: -1] → Swap to [-1, 1]?  
      ... (up to Person 27–28) 
      ```  
  - **Choice**:  
    - Each student **privately decides** (swap/keep) and writes choice on card.  
    - Stress: "You only affect your two people. No one else."  
  - **Collect cards** and update World A’s sequence on whiteboard (e.g., if students 1/3/5 swap, new A: [-1, 1, -1, 1, -1, 1, ...]).  

  #### **40–55 min: Recompute Totals (Collective Impact)**  
  - **Recompute World A** with the new sequence:  
    - **Group 1** (pairs): "Add (P1 + P2) + (P3 + P4) + ..."  
      - *All pairs still sum to 0 (e.g., -1+1=0, 1-1=0) → Total = 0*.  
    - **Group 2** (first + pairs): "Compute P1 + (P2 + P3) + (P4 + P5) + ..."  
      - *Totals vary (e.g., if P1 swapped: -1; P2+P3 depends on choices, e.g., 1 + 1 = 2).*  
  - **Key Moment**:  
    - Group 1’s total is **always 0** (individual swaps cancel out).  
    - Group 2’s total **changes** (e.g., from 1 to -1 or 2).  
  - **Reveal**:  
    - "Individually, your swap changed nothing for Group 1. But collectively, you changed Group 2’s total!"  

  #### **55–75 min: Debrief (Mapping to Ethics)**  
  - **Whiteboard Notes**:  
    | **Activity Phase**       | **Mathematical Point**              | **Ethical Point**                          |  
    |--------------------------|-------------------------------------|-------------------------------------------|  
    | Group computation        | Same numbers → different totals     | "Add the well-being" is ambiguous         |  
    | Individual choice        | Finite changes don’t alter Group 1  | One guardian’s act seems ethically neutral|  
    | Collective impact        | Group 2’s total changes             | Collective acts redefine "better world"   |  
  - **Discussion Prompts**:  
    - "Why did Group 1 and Group 2 disagree? Did anyone do math *wrong*?"  
      → *No—summation method matters*.  
    - "You only changed two people. Why did Group 2’s total shift?"  
      → *Cross-pair sums (e.g., P2+P3) depend on multiple choices*.  
    - "If totaling isn’t well-defined, how can we compare infinite worlds?"  
      → *This is the limit of consequentialism*.  
  - **Prevent "Math Trick" Reaction**:  
    - Stress: "The problem isn’t that ‘series are weird’—it’s that **totaling isn’t a reliable ethical guide** for infinite cases. If your theory says ‘better world = higher total,’ but the total depends on *how you add*, the theory breaks."  

  #### **75–90 min: Conclusion**  
  - **Name the Problem**: "You encountered the **infinite aggregation problem**: No unique way to sum well-being in infinite populations."  
  - **Connect to Reading**: "Next week, we’ll see how philosophers tackle this. Your task: Did today’s ambiguity make you doubt totaling? Why?"  
  - **Ethical Punchline**: "Consequentialism assumes we can ‘add up’ well-being. But in infinity, **addition isn’t addition anymore**."  

  ---

  ### What Will Go Wrong (and Fixes)  
  1. **Analysis Kids Shout Early**:  
     - *Risk*: "This is conditionally convergent! Riemann’s rearrangement!"  
     - **Fix**: Pre-brief them: "You’re observers today. Let others discover the conflict. Your expertise is for the debrief."  
  2. **Group Refuses to Compare**:  
     - *Risk*: "Infinity isn’t real; this is pointless."  
     - **Fix**: Reframe: "Ethics deals with idealizations (e.g., perfect justice). If your theory fails here, what does that say?"  
  3. **"Just a Math Trick" Reaction**:  
     - *Risk*: Students dismiss the ethics.  
     - **Fix**: Anchor in the **stake** (world creation) and **debate the ambiguity** ("If not totaling, how *do* we compare?").  
  4. **Simulation Feels Finite**:  
     - *Risk*: "14 swaps didn’t change the infinite tail."  
     - **Fix**: Acknowledge in debrief: "We simulated a **finite perturbation**. In true infinity, *every* tail rearrangement changes Group 2’s total. Our activity shows the **seed of ambiguity**."  

  ### What the Activity Can’t Reproduce  
  - **Missing Feature**: True **infinitely indexed permutations**. With 14 students, we only alter finitely many people. The "infinite remainder" is fixed.  
  - **Debrief Solution**: "In a real infinite world, Group 2’s total could be *any integer* with the right rearrangement. Our activity hints at this: you changed the total locally, and infinitely many guardians could change it *anywhere*."  

  ### 50-Minute Version  
  - **Cut**: Individual choice phase (simulation).  
  - **Why**: The group conflict is the core discovery. Simulation reinforces but isn’t essential.  
  - **Revised Timeline**:  
    - 0–10 min: Intro + group setup.  
    - 10–25 min: Group computation.  
    - 25–35 min: Conflict discussion.  
    - 35–50 min: Debrief (ethics of ambiguity).  
  - **Trade-off**: Loses "individual vs. collective" insight but keeps the central paradox.  

  **Why This Works**: Students *feel* the ambiguity before labeling it. The stake (world creation) forces ethical engagement, and the index cards make infinity tangible. By the end, they’ll see why "add the well-being" fails—and why next week’s reading matters.
