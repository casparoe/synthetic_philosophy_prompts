answer: |-
  ### Essay Question  
  **A seminar participant analyzing 1840s British physician case notes proposes that patients diagnosed with "disordered nerves" (predominantly postpartum women) were suffering from postpartum depression, and that treatments like bleeding worsened their condition. The supervisor objects: (1) this imports a 20th-century diagnosis onto historical actors who lacked the concept, and (2) condemning the treatment judges past medicine by modern standards.  
  Explain why rebutting objection (2) does not resolve objection (1). Then, articulate and defend a principled criterion for when retrospective redescription (e.g., using "postpartum depression") is legitimate. Finally, address two challenges: (a) how your criterion handles cases where past actors’ resources *cannot* license the redescription, and (b) why demands for "pure" period-authentic vocabulary risk silencing historical wrongs.  
  (75 minutes; 700 words suggested)**  

  ---

  ### Model Answer (703 words)  

  The supervisor’s objections target distinct forms of presentism. Objection (1) is *conceptual*: it rejects retrojecting "postpartum depression" (PPD)—a modern psychiatric category—onto historical subjects whose self-understanding and medical framework ("disordered nerves") operated within a distinct somatic paradigm. Objection (2) is *evaluative*: it condemns applying contemporary medical ethics to condemn bleeding as harmful, arguing that the physician could not access modern knowledge of pathophysiology or evidence-based treatment. Rebutting (2) is insufficient to resolve (1) because **evaluative and conceptual presentism operate independently**. One could concede that judging the physician unfairly violates historical empathy (addressing objection 2) while still committing conceptual anachronism by imposing PPD as a diagnostic label (failing objection 1). For instance, acknowledging that the physician acted within period-specific epistemic constraints does nothing to prove that "disordered nerves" maps ontologically or phenomenologically onto PPD. Thus, overcoming the evaluative objection leaves the conceptual one intact.  

  To legitimize retrospective redescription, I propose a **Recognition Test**: *A historian may apply a later concept C to past actors if they can demonstrate that features essential to C were (a) experientially accessible within the actors’ lifeworld, and (b) recognizable within their conceptual or normative resources, even if C itself was unavailable.* This requires showing continuity between past experiences/concepts and the modern category. Applied here, the participant must establish that the *symptoms* and *context* described in the notes (e.g., profound sadness, fatigue, withdrawal post-childbirth) align with PPD’s core phenomenology *and* that these manifestations were intelligible to 1840s patients/physicians as a distinct cluster linked to confinement—not merely as generic "nerves." Evidence might include the physician’s own notes distinguishing postpartum cases from other nervous disorders or contemporary texts pathologizing "puerperal melancholy." If such recognition exists, PPD becomes a legitimate heuristic for organizing fragmentary historical evidence into a coherent pattern the past *could have acknowledged*.  

  However, what if nothing in the historical record licenses PPD (e.g., if "disordered nerves" indiscriminately blended physical and psychological symptoms without postpartum specificity)? Here, the Recognition Test blocks redescription. Yet this risks **conceptual asymmetry**: Strict adherence to period vocabulary can erase suffering that historical actors misinterpreted or lacked tools to articulate. Calling the women’s condition "disordered nerves" obscures the gendered, postpartum-specific trauma modern medicine recognizes. To mitigate this, historians can use *qualified redescription*:  
  > *"Patients exhibited symptoms now associated with postpartum depression (e.g., debilitating despair post-confinement), though contemporaries conceptualized these within humoral frameworks as ‘nervous disorder.’"*  
  This avoids ontological imposition while making silenced suffering visible—a vital corrective when period categories were epistemically unjust. Demands for "purity" are not neutral; they privilege dominant historical interpretations and may perpetuate past marginalization.  

  Finally, historians face the **reflexive challenge**: Our analytical tools—including "anachronism" and "presentism"—are themselves modern constructs. This does not entail relativism but necessitates *strong historicism*: critical awareness of our conceptual situatedness. We cannot escape contemporary frameworks, but we can discipline them through evidence. The Recognition Test embraces this by tethering redescription to historical agents’ experiential and discursive resources. It accepts that history is co-constituted by present questions but insists answers must be constrained by past realities. Thus, while the *motivation* to diagnose PPD arises from modern concerns, its *validity* depends on demonstrable continuity with the past.  

  In this case, the participant could defend PPD redescription *only* by showing the physician’s notes reflect a proto-recognition of postpartum-specific psychological distress—perhaps by contrasting treatment of these women with other "nervous" cases. If successful, this meets objection (1). Objection (2) requires separate engagement: Evaluating the treatment’s harm demands examining whether *contemporaneous* critiques of bleeding existed (e.g., from empiricist physicians) or whether modern judgment is tempered by acknowledging epistemic constraints. Crucially, resolving one objection does not resolve the other, but a rigorous criterion like the Recognition Test allows responsible redescription without sacrificing historical integrity.  

  ---

  ### Marking Scheme (Total: 25 points)  
  **A+ (22–25):** Distinguishes objections precisely; proposes a clear, workable criterion (e.g., Recognition Test); confronts asymmetry and reflexivity insightfully; tightly integrates the case.  
  **A (18–21):** Separates objections well; offers a plausible criterion; addresses asymmetry/reflexivity competently; uses the case effectively.  
  **B (15–17):** Treats objections separately but superficially; criterion is vague; acknowledges asymmetry/reflexivity minimally; case used unevenly.  

  #### Point Allocation:  
  1. **Separation of objections** (5 pts):  
     - Clearly explains why rebutting (2) ≠ resolving (1) (3 pts).  
     - Avoids conflation of conceptual/evaluative presentism (2 pts).  
  2. **Criterion for legitimate redescription** (8 pts):  
     - Names/defends a specific test (e.g., Recognition Test) (4 pts).  
     - Applies it convincingly to the medical case (4 pts).  
  3. **Handling challenges** (8 pts):  
     - Explains how criterion addresses *unlicenseable* redescription (3 pts).  
     - Analyzes asymmetry in vocabulary demands (e.g., silencing wrongs) (3 pts).  
     - Engages reflexivity (historicity of anachronism) without relativism (2 pts).  
  4. **Structure & clarity** (4 pts):  
     - Coherent argument; precise language; stays within scope.  

  #### Characteristic Mistakes (Deductions):  
  - **-4 pts:** Treats conceptual/evaluative objections as interchangeable.  
  - **-3 pts:** Invokes vague tropes ("history is a dialogue") *as resolution* without analytical work.  
  - **-5 pts:** Concludes historian’s situatedness invalidates critical judgment (relativism).  
  - **-2 pts:** Fails to use the physician case concretely after introduction.  

  ---  
  This question tests advanced grasp of historiography by forcing candidates to *apply* meta-historical principles to an unseen case, moving beyond rehearsed debates to construct a defensible methodology. The marking scheme rewards precision, creativity, and reflexive rigor while penalizing conflations and clichés.
