answer: |-
  **Joint Statement on Predictive Anchoring for Urban Policy Forecasts**

  We, representing distinct methodological approaches to forecasting the outcomes of singular policy interventions, hereby establish points of agreement, articulate residual disagreements with reciprocal fidelity, identify testable cruxes with pre-registered predictions, and distinguish substantive from terminological disputes. This statement concerns the exemplar case of forecasting peak vehicle entry reduction following a proposed cordon charge in a mid-sized city, with transport models predicting a 15% reduction, situated within the described reference classes.

  **Agreed Foundations**

  We concur on the following principles and observations:
  1.  **Mathematical Neutrality:** Any numerical prediction must adhere to arithmetic consistency. Averaging outcomes within a defined reference class yields a point estimate calculable by agreed procedures (e.g., mean reduction of 8%, 12%, 17%, 22% = 14.75%).
  2.  **The Existence and Impact of Selection:** The composition of any reference class is subject to selection processes, explicit or implicit. The class of implemented cordon charges (8%, 12%, 17%, 22%) is demonstrably conditioned on factors influencing implementation, including pre-implementation forecasts and political/administrative feasibility. This conditioning means the observed outcomes are not a random sample of all potential cordon charge implementations.
  3.  **The Function and Limitation of Base Rates:** A base rate derived from a reference class serves as a starting anchor for prediction. Its primary purpose is to counter systematic forecasting errors, particularly the tendency to overweight case-specific ("inside-view") information and perceive uniqueness. It is not, and cannot be, a mechanical substitute for causal judgment. Adjustment from the base rate requires explicit justification based on case-specific differences judged relevant to the outcome.
  4.  **The Theory-Laden Nature of Class Construction:** No reference class is self-evident or selected purely "objectively." Defining a relevant class inherently involves judgments about which characteristics are causally pertinent to the outcome (e.g., policy type, geography, transit capacity, administrative context, political climate). Different causal theories will yield different classes.
  5.  **The Problem of Homogeneity:** The ideal of a "homogeneous" reference class, where members are identical in all causally relevant respects for the outcome, is rarely achievable for unique policy decisions. The narrowest class argued to be homogeneous (single case, 13%) highlights this pragmatic limitation. Claims of homogeneity rest on contested causal assumptions.
  6.  **The Imperative of Transparency:** Forecasts must transparently report the reference class(es) used, the rationale for their selection, the derived base rate(s), and the justification for any adjustment away from them. Opaque anchoring undermines accountability and scrutiny.

  **Residual Disagreements**

  Despite agreement on the above, fundamental differences persist regarding the *practical execution* and *epistemic status* of anchoring:

  1.  **On the Primacy and Feasibility of the "Outside View":**
      *   **Base-Rate Camp Position:** The core defense against idiosyncratic bias is a disciplined procedure *requiring* forecasters to begin with an explicit base rate derived from a defined reference class of past cases judged sufficiently similar *before* considering inside-view details. This "outside view" anchor is essential, even if imperfectly constructed, because it forces articulation of similarity criteria and provides a counterweight to the inherent overconfidence in case-specific models. The specific city's transport model (predicting 15%) should only adjust the base rate (e.g., 14.75% from implemented charges) if specific, articulated differences justify it.
      *   **Specificity Critics' Position:** The instruction to "begin outside" is illusory. Selecting *any* initial reference class (e.g., the four implemented cases, the 60 demand-management interventions) is itself an "inside-view" judgment, embedding a theory about what causally matters (policy type? budget? geography? implementation success?) and often reflecting practical convenience or desired conclusions. There is no privileged "outside" starting point free of theoretical commitment. Presenting a base rate as an initial anchor smuggles in contestable assumptions under the guise of objectivity. The forecaster inevitably begins *within* a framework of causal relevance.

  2.  **On the Determinacy of Selection Bias in the Implemented Class:**
      *   **Base-Rate Camp Position:** While acknowledging the implemented class is selected, we assert that the *direction* of bias is ambiguous and potentially quantifiable. Selection could upwardly bias the observed mean (14.75%) if only cities with optimistic models proceeded, or downwardly bias it if only cities with strong administrative capacity/transit (enabling larger reductions) proceeded. The net effect is unclear without further evidence; it does not automatically invalidate the class but demands careful consideration and potential adjustment. The base rate remains a *candidate* anchor requiring evaluation of this bias.
      *   **Specificity Critics' Position:** The selection on implementation renders the "implemented cordon charges" class fundamentally problematic as an anchor *precisely because* its bias direction is indeterminate *and* intrinsically linked to the variable under dispute (the predicted reduction). The conditioning variable (implementation) is causally entangled with the outcome (reduction size) through multiple pathways (optimism bias, administrative capacity). Using this class anchors the prediction within a sample systematically filtered by the very phenomenon being predicted, creating an unresolvable confound. It cannot serve as a reliable starting point.

  3.  **On Resolving Conflicts Between Defensible Classes:**
      *   **Base-Rate Camp Position:** When multiple defensible reference classes exist (e.g., 4 implemented charges: 14.75%; 60 demand interventions: 6%; 1 similar geography: 13%), the forecaster must explicitly compare them, articulate why one is *more* relevant or less biased *for this specific case*, and justify the choice of anchor. This involves assessing causal proximity, sample size, and potential selection biases. A structured, transparent decision process, even if judgmental, is superior to ignoring base rates or defaulting to the inside model. There is no universal tie-breaker, but disciplined reasoning can converge on a preferred anchor.
      *   **Specificity Critics' Position:** The existence of conflicting base rates from equally defensible classes (e.g., 14.75% vs. 6%) demonstrates the inherent indeterminacy of the "outside view" procedure. No principled, non-arbitrary method exists to definitively choose one class over another as *the* anchor without reverting to the very inside-view causal theories the base rate was meant to discipline. This conflict undermines the claim that base rates provide a stable, objective starting point. It reveals anchoring as contingent on prior theoretical commitments.

  **Testable Cruxes**

  The following specific questions, if resolved, could materially alter one or both camps' positions. We pre-register our differing predictions:

  1.  **Crux: Direction of Implementation Selection Bias**
      *   **Question:** Does the selection process for implementing a cordon charge systematically bias the average observed reduction in the class of implemented cases *in a determinate direction* (upward or downward) compared to the reduction that *would have been* observed had all formally proposed charges been implemented?
      *   **Relevant Test/Dataset:** Analysis of cities that formally proposed comparable cordon charges but subsequently abandoned them *before implementation* due to political opposition, failed referenda, or negative *pre-implementation* model forecasts. Compare the *pre-implementation* model forecasts and the stated reasons for abandonment for these non-implementers versus the implementers. Dataset: Records for the 23 formally proposed charges (4 implemented, 19 abandoned).
      *   **Base-Rate Camp Prediction:** We predict no *consistent* determinate direction of bias will be evident. Some non-implementers will have had low forecasts/political opposition suggesting potential downward bias in the implemented mean; others will have had high forecasts but failed for unrelated reasons (e.g., legal challenges), suggesting potential upward bias. The net effect is ambiguous and case-dependent. (Prediction: Mean forecast of non-implementers will not be consistently statistically significantly different from implementers' pre-implementation forecasts).
      *   **Specificity Critics' Prediction:** We predict a systematic pattern: Cities abandoning proposals will disproportionately have had lower *pre-implementation* model forecasts and/or cited concerns about low effectiveness/popular opposition *more frequently* than implementers, indicating that the implemented class is biased *upwards* (mean 14.75% likely higher than the true mean of all proposed projects). (Prediction: Mean pre-implementation forecast for non-implementers will be significantly lower than for implementers; "low predicted effect" cited more often in abandonment reasons).

  2.  **Crux: Predictive Power of Conflicting Classes**
      *   **Question:** When two defensible but conflicting reference classes exist (e.g., "Implemented Cordon Charges" vs. "Broad Demand Management Interventions"), is one class systematically more predictively accurate *out-of-sample* for forecasting outcomes of *new* cordon charge implementations, and does this relative accuracy provide a principled basis for tie-breaking?
      *   **Relevant Test/Dataset:** Out-of-sample validation test. Compile a new dataset of cordon charge implementations *not* included in the original classes (e.g., from different time periods or regions). For each new case, predict the reduction using the mean of the "Implemented Cordon Charges" class (adjusted for inflation/time if necessary) and the mean of the "Broad Demand Management Interventions" class. Compare the prediction errors (absolute and/or squared) for the two anchoring methods against the actual realized reductions. Dataset: Minimum of 5 new, independent cordon charge implementations with reliable post-implementation reduction data.
      *   **Base-Rate Camp Prediction:** We predict the narrower, more causally proximate class ("Implemented Cordon Charges") will yield lower prediction errors on average than the broader class ("Demand Management"), supporting its use as the primary anchor when available. (Prediction: Mean Absolute Error (MAE) for Cordon Charge class < MAE for Demand Management class).
      *   **Specificity Critics' Prediction:** We predict no consistent, statistically significant difference in predictive accuracy between the two classes. The performance will be highly variable and dependent on the specific new cases, demonstrating that neither class provides a reliably superior anchor *in principle*. The choice remains contingent. (Prediction: Difference in MAE between classes not statistically significant; no consistent direction of difference).

  **Assessment of Verbal and Substantive Disagreements**

  A portion of the disagreement surrounding whether one can truly "begin outside" or whether the "outside view" exists is terminological. Both camps agree that class selection embeds theoretical judgments ("inside" elements). The Base-Rate Camp uses "outside view" primarily to denote a *procedural step* focused on *group statistics* before detailed case modeling, emphasizing its role as a bias-countering discipline. The Specificity Critics interpret "outside view" as claiming a *theory-free, objective perspective*, which they rightly deem impossible. Clarifying that the "outside view" is a *methodological stance prioritizing group data and forcing explicit similarity justifications*, rather than a claim of epistemic purity, dissolves much of this verbal dispute. Both effectively blend inside and outside elements; the Camp emphasizes the structured *sequence* (group first), while the Critics emphasize the inescapable *theoretical contamination* in defining the group.

  The substantive residue lies in:
  1.  **The Necessity of the Procedural Anchor:** Does mandating an explicit base-rate anchor as the *starting point*, regardless of its theoretical loading, provide a net benefit in reducing systematic error compared to allowing forecasters to integrate group and case information without this formal constraint? The Camp believes the discipline is crucial; the Critics believe it adds little value beyond transparency while creating illusions of objectivity.
  2.  **The Actionability of Indeterminacy:** When faced with conflicting classes or ambiguous selection biases, does the Base-Rate Camp's structured approach to comparing and justifying a choice (even if imperfect) lead to better-calibrated, less biased predictions than approaches rejecting a primary anchor? The Critics maintain that the indeterminacy fundamentally undermines the anchor's core function.
  3.  **The Epistemic Weight of the Homogeneity Ideal:** How heavily should the practical unattainability of perfect homogeneity weigh against using broader classes? The Camp sees broader classes as often providing valuable, stabilizing anchors despite heterogeneity; the Critics see the failure to achieve specificity as a fatal flaw for the anchoring procedure's claims to provide robust discipline.

  This document reflects our shared understanding of the points of contact and the irreducible core of our methodological divergence concerning forecasting singular cases. Signed on behalf of the perspectives herein described.
