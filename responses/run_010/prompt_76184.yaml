  Hmm, the user is on a working group for a psychiatric classification manual revision, and they're deeply divided about whether adding a new diagnosis would cause "looping effects" – where the label itself changes the phenomenon it describes. They need clear criteria to evaluate theories of looping effects, not just philosophical debates. Their actual need is for a practical framework to assess if publishing a label might alter the very thing it's meant to classify.

  The user is frustrated by polarization in their group. Half dismiss looping as a pseudo-problem, while the other half sees it as critical. They want to move beyond that by establishing what makes an account of looping scientifically adequate. Their deeper need might be for legitimacy – they want criteria rigorous enough to convince skeptics that looping is a real phenomenon worth considering in diagnostic decisions.

  They outlined specific requirements: defining interactivity, establishing causation without counterfactuals, distinguishing looping from similar effects, handling cases where looping stops or precedes the category, accounting for divergent effects across groups, maintaining neutrality about the "reality" of the kind, acknowledging researcher reflexivity, and addressing deliberate manipulation of labels. They also provided two test cases: one with mixed effects (a new diagnosis that increases presentations in some regions but not others, with pre-label rises and varied patient responses), and a "dead kind" (a defunct historical diagnosis).

  For the desiderata, I need to ensure each is grounded in empirical or logical necessity. For example, the requirement for causation evidence must address how we infer directionality when we can't run experiments – perhaps through temporal sequences or natural experiments like regional variations. The test case with regional differences and pre-label rises would stress-test this.

  The meta-questions are crucial. I should identify which requirements are non-negotiable (e.g., distinguishing looping from mere measurement reactivity) versus which might be ideological (e.g., biomedical realism's insistence on neural correlates as the only "real" basis for a kind). The user suspects a tension between kind stability and generativity – if a loop changes the phenomenon, is it still the same kind? That might be unresolvable and should be flagged.

  For the scorecard, I'll evaluate four theories concisely: Hacking's interactive kinds (strong on reflexivity but vague on causation), network/dynamical accounts (good at mixed effects but struggle with stability), biomedical realism (ignores looping entirely), and social constructionism (overplays normativity). The user wants brevity, so I'll keep it to five lines.
answer: |-
  Here are the desiderata for an adequate account of looping effects in psychiatric classification, grounded in necessary functionalities rather than theoretical preferences. Each is justified by a specific case or logical constraint:

  1.  **Define Interactivity:** Must distinguish a kind whose instances *change their core properties* (behavior, experience, self-understanding) *because* of being classified, from mere re-description (same phenomena, new label) or new counting (increased detection of pre-existing phenomena). *Requirement because:* Without this, we cannot differentiate a true feedback loop from improved epidemiology or semantic change (e.g., test case: self-monitoring behavior pattern *stabilizes* or *comes apart* for some *after* labeling, indicating core change, not just detection).

  2.  **Establish Causation Direction:** Must provide criteria for inferring that the classification *caused* changes in the phenomena, not just correlated, especially when counterfactuals are impossible. *Requirement because:* Essential to claim "looping" rather than coincidence or underlying drift. Evidence must include: (a) Temporal sequence (change *follows* classification, though test case shows pre-label rise complicates this), (b) Mechanism (plausible pathways like altered self-perception, treatment access, social response), (c) Differential exposure (e.g., test case: rise *only* in region adopting the new label, not adjacent region with different term for same cluster), (d) Agent reports (e.g., test case: patients stating label changed their pattern).

  3.  **Distinguish Looping from Confounds:** Must clearly differentiate looping from:
      *   *Measurement Reactivity:* Subjects altering behavior *solely* during assessment.
      *   *Stigma/Treatment Effects:* Changes due to societal reaction or therapy access *caused by* the label, but not altering the *core defining features*.
      *   *Drifting Norms/World Changes:* Phenomena changing due to cultural shifts or environmental factors *independent* of the classification system.
      *   *Requirement because:* Failure here collapses distinct phenomena into "looping," inflating its scope and obscuring specific mechanisms (e.g., test case: pre-label rise suggests world change/drifting norms; regional variation suggests stigma/treatment or looping, needing distinction).

  4.  **Explain Asymmetry & Inception:** Must account for: (a) Kinds that *stop* looping (become inert), (b) Kinds where the apparent "loop" precedes the official category (e.g., test case: rise beginning pre-label), (c) Opposite effects in subgroups (e.g., test case: label stabilizes pattern for some, dissolves it for others; one subgroup embraces label, another rejects it). *Requirement because:* Looping is not uniform; an account must handle its variability, cessation, and potential emergence from proto-classifications or social currents.

  5.  **Maintain Kind Identity:** Must allow identifying the *same* kind across the loop, despite changes, to distinguish looping from category replacement. *Requirement because:* Otherwise, it describes one kind being replaced by another due to the label, not one kind changing *through* labeling (e.g., test case: is the stabilized pattern the *same* phenomenon as the pre-label one, or something new?).

  6.  **Neutrality on Ontological Status:** Must *not* inherently entail the kind is more or less "real" (biologically grounded, socially constructed, etc.) as a consequence of looping. *Requirement because:* The *fact* of interactivity is distinct from *what* is interacting; ontological claims are separate inferences (prevents smuggling in biomedical realism or constructionism).

  7.  **Incorporate Reflexivity:** Must explicitly recognize that researchers/clinicians proposing, applying, and studying the classification are themselves part of the social system enacting the loop. *Requirement because:* Denying this leads to an impossible "view from nowhere"; the classifier's actions (publicizing, diagnosing) are causal components of the loop.

  8.  **Address Strategic Use:** Must analyze cases where actors deliberately publicize a label to "recruit" cases or change the phenomenon, and whether this constitutes therapy, manipulation, or extension change. *Requirement because:* Intentional exploitation tests the boundaries of the mechanism and its ethical/pragmatic implications (e.g., activists promoting a diagnosis).

  **Test Case Application:**
  *   **Mixed-Effect Case:** A good account explains the regional variation (differential exposure/uptake), the pre-label rise (proto-classification/social currents), and the opposing patient experiences (asymmetric looping within the population based on identity/salience) as facets of *one* complex interactive process, not noise.
  *   **Dead Kind (e.g., "Drapetomania"):** Desiderata imply: 1) It *was* interactive (its application shaped behavior via social control), 2) It ceased looping because the classificatory/social system sustaining it collapsed (slavery's end, scientific rejection). 3) *Could* someone "have it" now? Only if the *specific social-structural context and classificatory power* enabling the loop were recreated – the *phenomenon* (escaping forced labor) exists, but the *interactive kind* "drapetomania" is inert. A new label in a similar context might loop differently.

  **Meta-Analysis:**

  *   **Non-Negotiables:** 1 (Define Interactivity), 2 (Establish Causation Direction), 3 (Distinguish Confounds), 7 (Reflexivity). These are minimal conditions for describing the *phenomenon* of looping itself.
  *   **Camp-Smuggled Preferences:** *Biomedical Realists:* Often resist 6 (Neutrality), wanting looping to imply lesser reality; downplay 7 (Reflexivity). *Constructionists:* Often smuggle in normative views via 6 (implying social construction); sometimes overextend looping via 3.
  *   **Most Eliminative Requirement:** #2 (Establish Causation Direction). Many popular accounts (especially purely discursive constructionism) rely on correlation/interpretation without robust causal criteria. The test case's complexity demands this rigor.
  *   **Unsatisfiable Pair:** **Yes.** #5 (Maintain Kind Identity) and the core implication of #1/#2 (Loops are *Generative* - they create new properties/states) are in fundamental tension. If the kind changes *fundamentally* due to the loop, how is it the *same* kind? Accounts must either soften generativity (risks triviality) or redefine identity dynamically (risks instability). **This tension is inherent and unresolvable within a single, static framework.**
  *   **Scorecard (≤5 lines):**
      1.  **Hacking's Interactive Kinds:** Strong: 1, 4 (asymmetry), 7. Weak: 2 (causal evidence), 3 (distinguishing confounds), 8. Fails 5/Generativity tension.
      2.  **Network/Dynamical Accounts:** Strong: 1, 4 (subgroups), potentially 5 (dynamic identity). Weak: 2 (empirical validation), 3, 6 (often neuro-centric), 7 (often unaddressed).
      3.  **Biomedical Realism:** Fails core premise. Rejects 1, 2, 4, 7. Strong only if looping is denied.
      4.  **Strong Social Constructionism:** Strong: 1, 4, 7. Weak: 2 (causal rigour), 3 (overextension), 5/Generativity tension, often fails 6 (smuggles normativity).
