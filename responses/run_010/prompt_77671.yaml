prompt: |-
  I've been going around in circles on whether stakes change what you know, so I wrote down my actual gut verdicts on a pile of cases and they clearly don't hang together. I don't want the standard tour of the debate — I want to know what principle, if any, delivers my verdicts, and which of them I'd have to give up.

  The cases.

  Bottle in my hand, label says 50mg. If its my own headache I'll say flat out that I know what I'm holding. If it's a dose for my niece, who's got a strict ceiling and I'd be calling an ambulance if I got it wrong — same bottle, same label, same pharmacy, same five seconds of looking at it — now I say I don't know it, I just believe it.

  Lottery. My friend has a ticket, nothing whatever rides on it, she'd shrug if it lost. I still say she doesn't know it'll lose, even though those odds are better than the odds the label is right.

  Grad student who worked through the proof of the theorem herself, line by line, and the stakes are her entire career. I say she knows it. Stakes didn't touch that one at all.

  My uncle takes a pill every morning that his doctor prescribed. If he turns out to have the allergy nobody's tested him for, he dies; he has no idea that's on the table and no reason to suspect it. My instinct is that he knows it's the right pill — he knows, it's just that knowing isn't much use to him. But that looks like I'm letting stakes off the hook any time the subject is ignorant of them, which can't be right either.

  And the mirror image: a colleague who's convinced that missing the 8:05 will cost her the job and then the visa, so she won't say she knows the 8:05 is on time — same timetable, same platform as the rest of us who say we know it perfectly well. Objectively almost nothing rides on it; her contract says so; she just doesn't believe the contract. My gut sides with her anxiety rather than with the actual consequences, and I don't like that about my gut.

  Third parties. I know the flight lands at six, no problem. Then I remember my cousin is going to drive three hours to collect him on my say-so and can't easily turn back. Now I feel like I've stopped knowing it, or at least that I shouldn't have said it out loud — and I genuinely can't tell which of those two feelings I'm having.

  Retroactive. Last year I formed a belief offhand about which folder a document was filed in; today I find out a whole dispute turns on it. My instinct is that my knowledge evaporated backwards, which sounds insane, but I can't shake it.

  And the one that might be the real tell. Same stakes, no possible check: I'm on the plane, I can't ask anybody, there is nothing I could do to find out whether this is the Denver flight, and a lot rides on it. I say I still know where I am. Compare the pill for my niece — same stakes, but the pharmacy is open and I could ring them in two minutes. There I say I don't know. So maybe its not stakes at all; maybe its whether I'm sitting on a cheap check I'm not bothering to do.

  So: is there a principle that gets all or most of this? I can already see that "higher stakes, more evidence required" doesn't, because of the lottery and the grad student. Tell me what the clauses would have to be and which case motivates each one; tell me what it says about a case I haven't listed — say, high stakes, a cheap check exists, but I've already decided I'm not going to do it: do I lose the knowledge the moment I decide, or only once the window closes? — and then be straight with me about which of my verdicts the best principle forces me to abandon. I also want to know whether my pattern is even the stakes-shifting one people usually have in mind, or whether something less exotic fits better: 'knows' being context-sensitive, my really applying a rule about what you're allowed to say, or the dull point that high-stakes people just gather more evidence so their evidence isn't the same after all. Rank those against my list and say where each one breaks.
reasoning: |-
  Okay, let me start by really digging into this user's problem. They've listed several cases where their intuitive judgments about knowledge seem inconsistent, especially when stakes are involved. The key here is that they don't want the standard overview of the stakes debate; they want a principle that explains their specific gut reactions and tells them which intuitions they might need to abandon.

  First, I need to look at each case they mentioned. The bottle example shows that with low stakes (their headache), they feel they know, but with high stakes (their niece), they don't—even though the evidence is the same. Then there's the lottery: even with better odds than the bottle, they say their friend doesn't know the ticket will lose, despite low stakes. The grad student case is interesting because high stakes don't affect their intuition that she knows after thoroughly checking the proof. 

  The uncle case is tricky: he "knows" the pill is safe despite high stakes because he's unaware of the risks. But the colleague case is the mirror: she thinks stakes are high (though they're not), and the user sides with her feeling of not knowing. Third parties involve the user's knowledge changing when they remember their cousin's dependency. Retroactive knowledge loss sounds weird—believing something last year, but now feeling it wasn't knowledge because current stakes are high. The plane vs. pharmacy case suggests that the availability of a cheap check might be key, not stakes per se.

  The user mentions possible principles like contextualism, pragmatic encroachment, or the idea that high stakes lead to more evidence gathering. But their cases challenge these. For example, pragmatic encroachment would say higher stakes require more evidence, but the lottery and grad student cases contradict that. The grad student has high stakes but still knows without more evidence, while the lottery has low stakes but no knowledge despite better odds.

  The cheap check hypothesis seems promising. In the niece's pill case, the pharmacy is open, so not calling means they don't know. On the plane, no check is possible, so they still know. But the retroactive case doesn't fit—how does a cheap check apply to past knowledge? Also, the colleague case: she could check the contract, but her anxiety prevents her from accepting it. The user's intuition sides with her, which might be about psychological barriers rather than epistemic factors.

  Another angle is psychological safety versus epistemic justification. The user's feelings might be tracking whether acting on the belief feels safe. In low-stakes situations, safety isn't a concern, so they claim knowledge. High stakes introduce risk, making them hesitant. But the grad student is confident despite high stakes because her evidence is solid. The lottery has low stakes but probabilistic evidence, so no knowledge. 

  The uncle is oblivious, so he feels safe. The colleague feels unsafe due to her false belief about stakes. Third parties: the user feels responsible for their cousin, so acting on the flight info feels unsafe. Retroactively, the high stakes now make past reliance feel unsafe. The plane with no check: no alternative, so they have to rely, thus "knowing."

  This safety principle might explain most cases, but it has issues. It's more about practical rationality than truth-tracking. Also, retroactive knowledge loss conflicts with the fact that knowledge is a past state. The user might need to accept that their intuition there is mistaken. The colleague case also shows that perceived stakes affect their intuition, even if irrational. 

  Comparing theories: contextualism might handle some cases by shifting standards with context, but the grad student and lottery cases challenge it. Pragmatic encroachment struggles with the grad student. The "evidence gathering" idea doesn't fit because the evidence is the same in many cases. 

  So the best fit is the safety principle with a focus on actionable justification. The user might need to drop the retroactive intuition and possibly refine the colleague case, acknowledging that her belief is irrational. For the cheap check case where they decide not to act, knowledge might be lost when they choose not to verify, not when the window closes. 

  In conclusion, the user's pattern is driven by pragmatic safety rather than stakes alone. They need to give up retroactive knowledge change and perhaps adjust their view on the colleague case, recognizing that actual stakes matter, not just perceived ones. The principle is about the level of justification needed for actionable confidence under risk.
answer: |-
  Your pattern reveals a deep tension between **epistemic justification** and **pragmatic safety**, but it's not standard stakes-shifting. Your intuitions cluster around a principle I'll call **Actionable Justification**: *Knowledge requires that your evidence eliminates salient risks at a level of rigor proportionate to the practical consequences of acting on that belief, where "salient" includes risks you’re aware of or could easily discover*. 

  This explains your cases and forces you to abandon one core intuition. Here’s the breakdown:

  ### The Principle: Actionable Justification (AJ)
  1. **Justification Threshold**: Evidence must eliminate *salient, action-relevant* risks (not all possible risks).  
  2. **Salience Trigger**: Risks become salient through:  
     - Awareness of high stakes (your niece’s pill)  
     - Availability of a cheap, decisive check (pharmacy call)  
     - Psychological pressure (your colleague’s anxiety)  
  3. **Proportionality**: Higher stakes *or* salient risks demand more rigorous risk elimination.  
  4. **Action-Relativity**: Knowledge is lost if you *could and should* resolve a salient risk but don’t.  

  ### How AJ Explains Your Cases
  | Case | Your Verdict | AJ Explanation |
  |------|--------------|---------------|
  | **Your headache pill** | Know | Low stakes, no salient risks. Evidence suffices. |
  | **Niece’s pill** | Don’t know | High stakes + cheap check (pharmacy call) make risk salient. Not checking fails proportionality. |
  | **Lottery ticket** | Don’t know | Probabilistic evidence never eliminates *salient* risk of loss (it’s inherently salient). |
  | **Grad student** | Know | Proof eliminates all salient risks, even under high stakes. No cheap check exists to undermine it. |
  | **Uncle’s pill** | Know | Unaware of allergy risk → risk isn’t salient. Evidence meets default threshold. |
  | **Anxious colleague** | Don’t know | *Perceived* high stakes make risk salient. Her evidence doesn’t eliminate *her* salient risk (missing flight = ruin). |
  | **Third-party pickup** | Don’t know | Stakes for cousin make risk salient *to you*. Acting on belief feels irresponsible. |
  | **Retroactive filing** | Knowledge "evaporated" | *Current* stakes make past risk salient. AJ evaluates *present* actionability of past belief. |
  | **Plane vs. pharmacy** | Plane: know<br>Pharmacy: don’t | No possible check (plane) → no salient *unaddressed* risk. Cheap check (pharmacy) → salient risk if ignored. |

  ### Where AJ Breaks Your Intuitions
  - **Abandon retroactive "evaporation"**: AJ explains your *feeling* but not literal truth. Knowledge can’t vanish backward—your past self *did* know by *past* standards. AJ forces you to reframe this as: *"Today, I can't responsibly act on that past belief without verification."*  
  - **Tension in uncle case**: AJ saves your verdict but highlights instability. If uncle *suspected* an allergy (making risk salient), he’d lose knowledge—even with identical evidence.  

  ### Cheap Check Sub-Case: Deciding Not to Verify
  - **Knowledge lost when you decide not to check**, not when the window closes.  
  - *Why*: The moment you recognize a salient risk and choose inaction, your justification becomes inadequate for *actionable* knowledge.  
  - *Example*: For your niece’s pill, knowledge vanishes when you think "I could call... but I won’t."  

  ### How Competing Theories Fail Your List
  | Theory | Why It Fails Your Cases |
  |--------|-------------------------|
  | **Standard pragmatic encroachment** (stakes raise evidence threshold) | Fails lottery (low stakes, still no knowledge) and grad student (high stakes, knowledge intact). |
  | **Contextualism** ("knows" meaning shifts with context) | Struggles with third-party cases (why does *your cousin’s* stake affect *your* knowledge?) and retroactive "evaporation". |
  | **Evidence-gathering** (high stakes cause better evidence) | Contradicted by niece/pill and plane cases: identical evidence, different verdicts. |

  ### The Real Tell: AJ vs. Classic Stakes-Shifting
  Your pattern **isn’t classic stakes-shifting**. Stakes matter *only* when they trigger **salient, actionable risks**. Key distinctions:  
  - Lottery: Low stakes, but risk is inherently salient → no knowledge.  
  - Grad student: High stakes, but proof eliminates salient risks → knowledge.  
  - Anxious colleague: *Perceived* stakes create salience → no knowledge, even if irrational.  

  ### The Tradeoff
  AJ saves 7/8 cases but demands you surrender **retroactive knowledge loss**. Your intuition there conflates:  
  - Epistemic fact: *Past you* knew.  
  - Pragmatic norm: *Current you* can’t rely on that belief under new stakes.  

  ### Refinement: A Clause for Self-Awareness
  Add this to AJ: **"Salience is defeated if the subject *rationally dismisses* a risk despite high stakes."**  
  - Saves uncle case (he’d dismiss allergy risk as implausible).  
  - Condemns anxious colleague (she *irrationally* inflates stakes).  
  - Aligns with your niece/pharmacy verdict (rational to check).  

  This makes your pattern coherent—but still pragmatic, not purely epistemic.
