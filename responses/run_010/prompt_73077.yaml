  ### Exam Question: Judy Benjamin Problem (25 marks)

  **Background:** Judy is dropped at night into a territory divided into four sectors: NE (north-east), NW (north-west), SE (south-east), SW (south-west). Her prior credence is uniform: \(P(\text{NE}) = P(\text{NW}) = P(\text{SE}) = P(\text{SW}) = 1/4\). Thus, \(P(\text{N}) = P(\text{NE}) + P(\text{NW}) = 1/2\) and \(P(\text{S}) = P(\text{SE}) + P(\text{SW}) = 1/2\). A perfectly reliable headquarters (HQ) radio operator transmits: "If you are in the north, then you are in the north-east sector, three chances in four." Judy interprets this as the constraint \(Q(\text{NE} \mid \text{N}) = 3/4\) on her posterior credence function \(Q\), and she learns nothing else. Jeffrey conditionalization requires inputs of new unconditional probabilities for a partition, but this constraint does not provide them directly. Four candidate resolutions are considered:  

  - **(A)** Keep \(Q(\text{N}) = 1/2\). Then \(Q(\text{NE}) = 3/8\), \(Q(\text{NW}) = 1/8\), \(Q(\text{SE}) = 1/4\), \(Q(\text{SW}) = 1/4\).  
  - **(B)** Maximize Shannon entropy \(-\sum Q_i \ln Q_i\) (or equivalently, minimize reverse relative entropy \(\sum Q_i \ln(Q_i / P_i)\)) subject to the constraint. This yields \(Q(\text{NE}) \approx 0.3505\), \(Q(\text{NW}) \approx 0.1168\), \(Q(\text{SE}) = Q(\text{SW}) \approx 0.2663\), so \(Q(\text{N}) \approx 0.467\).  
  - **(C)** Minimize forward relative entropy \(\sum P_i \ln(P_i / Q_i)\) (or equivalently, maximize \(\sum P_i \ln Q_i\)) subject to the constraint. This yields \(Q(\text{NE}) = 0.6\), \(Q(\text{NW}) = 0.2\), \(Q(\text{SE}) = Q(\text{SW}) = 0.1\), so \(Q(\text{N}) = 0.8\).  
  - **(D)** Strictly conditionalize on the material conditional \(\text{N} \supset \text{NE}\) (equivalent to \(\neg \text{N} \lor \text{NE}\)). This yields \(Q(\text{N}) = 1/3\), \(Q(\text{NE}) = 1/3\), \(Q(\text{SE}) = 1/3\), \(Q(\text{SW}) = 1/3\), \(Q(\text{NW}) = 0\).  

  **Tasks:**  

  (i) **Problem Diagnosis** (5 marks; ~15 minutes)  
  Explain why Judy’s constraint \(Q(\text{NE} \mid \text{N}) = 3/4\) cannot be handled by Jeffrey conditionalization without supplementation. Precisely state what input is missing and why no choice of partition in the standard Jeffrey rule (which updates via \(Q(A) = \sum_i Q(A \mid B_i) P(B_i)\) for a partition \(\{B_i\}\)) can yield this constraint.  

  (ii) **Resolution Analysis** (10 marks; ~30 minutes)  
  (a) Explicitly compute the posterior distributions for resolutions (A) and (D). Show all steps.  
  (b) State the normative principle behind each of (A), (B), and (C). Explain why the constraint \(Q(\text{NE} \mid \text{N}) = 3/4\) alone cannot determine which of these principles to adopt.  

  (iii) **Generative Model** (8 marks; ~25 minutes)  
  (a) Propose a generative model for how HQ selects and sends the message based on Judy’s true location. Specify a prior over messages given sectors (e.g., \(P(\text{message} \mid \text{sector})\)) such that HQ is perfectly reliable (i.e., the message is truth-conducive).  
  (b) Using strict conditionalization on the proposition "HQ sent this specific message," compute the posterior distribution \(Q\).  
  (c) Compare your result to resolutions (A), (B), and (D). Which (if any) does it match, and why?  

  (iv) **Evidence Interpretation** (2 marks; ~5 minutes)  
  The constraint \(Q(\text{NE} \mid \text{N}) = 3/4\) is not obviously a proposition about the world; it may instead be a constraint on Judy’s credences. Briefly explain what would have to be true for acquiring this constraint to count as ordinary evidence about the territory.  

