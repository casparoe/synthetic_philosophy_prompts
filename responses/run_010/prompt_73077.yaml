  ### Model Answer  

  **(i) Problem Diagnosis (5 marks)**  
  Jeffrey conditionalization requires inputs of new *unconditional* probabilities for a partition. Judy’s constraint \(Q(\text{NE} \mid \text{N}) = 3/4\) is *conditional*, providing no direct input for any partition. The standard rule \(Q(A) = \sum_i Q(A \mid B_i) P(B_i)\) propagates new unconditional probabilities for \(\{B_i\}\), but the constraint does not specify \(Q(B_i)\) for any partition (e.g., \(\{\text{N}, \text{S}\}\) or \(\{\text{NE}, \text{NW}, \text{SE}, \text{SW}\}\)). For instance, if \(\{B_i\} = \{\text{N}, \text{S}\}\), we need \(Q(\text{N})\) and \(Q(\text{S})\); if \(\{B_i\} =\) the sectors, we need \(Q(\text{NE}), \dots, Q(\text{SW})\). The constraint only fixes the ratio \(Q(\text{NE}) / Q(\text{N}) = 3/4\), leaving \(Q(\text{N})\) and distributions within \(\text{S}\) free. Thus, Jeffrey’s rule cannot apply unaided.  

  **(ii) Resolution Analysis (10 marks)**  
  **(a) Computations:**  
  - **Resolution (A):** Keep \(Q(\text{N}) = P(\text{N}) = 1/2\). By the constraint:  
    \(Q(\text{NE} \mid \text{N}) = Q(\text{NE}) / Q(\text{N}) = 3/4\), so \(Q(\text{NE}) = (3/4) \times (1/2) = 3/8\).  
    Similarly, \(Q(\text{NW} \mid \text{N}) = 1 - 3/4 = 1/4\), so \(Q(\text{NW}) = (1/4) \times (1/2) = 1/8\).  
    No information about \(\text{S}\), so \(Q(\text{S}) = P(\text{S}) = 1/2\), and by uniformity: \(Q(\text{SE}) = Q(\text{SW}) = (1/2) \times (1/2) = 1/4\).  
    Thus: \(Q(\text{NE}) = 0.375\), \(Q(\text{NW}) = 0.125\), \(Q(\text{SE}) = 0.25\), \(Q(\text{SW}) = 0.25\).  
  - **Resolution (D):** Strictly conditionalize on \(\text{N} \supset \text{NE}\) (i.e., \(\neg \text{NW}\)). The material conditional is false only in \(\text{NW}\), so \(P(\text{N} \supset \text{NE}) = 1 - P(\text{NW}) = 1 - 0.25 = 0.75\).  
    After conditionalization:  
    \(Q(\text{NE}) = P(\text{NE} \mid \neg \text{NW}) = \frac{P(\text{NE})}{P(\neg \text{NW})} = \frac{0.25}{0.75} = 1/3\),  
    \(Q(\text{SE}) = \frac{P(\text{SE})}{0.75} = \frac{0.25}{0.75} = 1/3\),  
    \(Q(\text{SW}) = \frac{P(\text{SW})}{0.75} = \frac{0.25}{0.75} = 1/3\),  
    \(Q(\text{NW}) = 0\).  
    Thus, \(Q(\text{N}) = Q(\text{NE}) + Q(\text{NW}) = 1/3\).  

  **(b) Principles and Indeterminacy:**  
  - **(A)**: Principle of minimal change: preserve all marginals not directly constrained (\(Q(\text{N}) = P(\text{N})\)), updating only within the conditioned set (\(\text{N}\)).  
  - **(B)**: Principle of maximum uncertainty: maximize Shannon entropy (or minimize reverse relative entropy) to avoid adding extraneous information.  
  - **(C)**: Principle of minimum discrimination: minimize forward relative entropy to stay "close" to the prior in the sense of likelihood.  
  The constraint alone cannot arbitrate because it underdetermines \(Q\). Resolution (A) fixes \(Q(\text{N})\), (B) maximizes entropy without fixing \(Q(\text{N})\), and (C) minimizes forward divergence, each reflecting a different normative stance on rational updating.  

  **(iii) Generative Model (8 marks)**  
  **(a) Model specification:**  
  Assume HQ uses a device that reports an east-west sector in the north. If Judy is in \(\text{N}\), the device outputs "NE" with probability \(3/4\) and "NW" with probability \(1/4\). If in \(\text{S}\), it outputs "NE" or "NW" randomly with equal probability \(1/2\) (since no north-south bias). HQ sends the message "If you are in the north, then you are in NE, three chances in four" iff the device outputs "NE". This model is reliable because the message content depends probabilistically on the true state.  

  **(b) Strict conditionalization:**  
  Let \(M\) be the event that HQ sends this message. We compute \(P(\text{sector} \mid M)\):  
  - \(P(M \mid \text{NE}) = P(\text{device outputs "NE"} \mid \text{N}) = 3/4\)  
  - \(P(M \mid \text{NW}) = P(\text{device outputs "NE"} \mid \text{N}) = 1/4\)  
  - \(P(M \mid \text{SE}) = P(\text{device outputs "NE"} \mid \text{S}) = 1/2\)  
  - \(P(M \mid \text{SW}) = P(\text{device outputs "NE"} \mid \text{S}) = 1/2\)  
  Prior: \(P(\text{sector}) = 1/4\) for each.  
  Marginal \(P(M) = \sum_{\text{sector}} P(M \mid \text{sector}) P(\text{sector}) = (1/4)[ (3/4) + (1/4) + (1/2) + (1/2) ] = (1/4)(1 + 1) = 1/2\).  
  Posterior:  
  - \(Q(\text{NE}) = P(\text{NE} \mid M) = \frac{P(M \mid \text{NE}) P(\text{NE})}{P(M)} = \frac{(3/4)(1/4)}{1/2} = \frac{3/16}{1/2} = 3/8\)  
  - \(Q(\text{NW}) = \frac{(1/4)(1/4)}{1/2} = \frac{1/16}{1/2} = 1/8\)  
  - \(Q(\text{SE}) = \frac{(1/2)(1/4)}{1/2} = \frac{1/8}{1/2} = 1/4\)  
  - \(Q(\text{SW}) = \frac{(1/2)(1/4)}{1/2} = 1/4\)  

  **(c) Comparison:**  
  This yields \(Q(\text{NE}) = 3/8\), \(Q(\text{NW}) = 1/8\), \(Q(\text{SE}) = 1/4\), \(Q(\text{SW}) = 1/4\), matching **resolution (A)**. It does not match (B) or (D). The match occurs because the model preserves the marginal \(Q(\text{N}) = 3/8 + 1/8 = 1/2\), updating only within \(\text{N}\) per the device’s reliability.  

  **(iv) Evidence Interpretation (2 marks)**  
  For \(Q(\text{NE} \mid \text{N}) = 3/4\) to be ordinary evidence, it must report a mind-independent fact (e.g., HQ’s reliability or a physical propensity). If the constraint reflects a causal process (like the generative model) where the message correlates with the territory, acquiring it is evidence. Otherwise, it might be a direct constraint on beliefs, not evidence.  

