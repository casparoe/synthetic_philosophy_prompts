  Okay, the user is crafting a session on Pascal's political fragments, specifically the justice-force cluster, and wants to apply it to the Nuremberg Trials. They've outlined Pascal's key points: justice without force is powerless, force without justice is tyranny, laws are obeyed because they're laws not because they're just, origins of power must remain obscured, and the three orders (body, mind, charity) with infinite separation. They want to avoid rehashing the "victor's justice" critique and focus on mapping Pascal's framework onto Nuremberg, then identifying where it breaks.

  The user highlights specific features: Jackson's document-based approach, the acquittals contradicting Pascal's cynicism, the Soviet dissent, and the critical issue of the superior orders defense versus Pascal's quietism. They also want analysis of the Kampala Amendments through Pascal's lens. 

  Breaking this down: First, Pascal's descriptive claim (power originates in force), quietist conclusion (obey established order), and orders distinction (force can't compel belief) must be kept separate. For Nuremberg: 

  Jackson's document strategy seems like using "order of body" tools (physical evidence) to target the "order of minds" (persuasion). Pascal would say this can't produce genuine assent—it might coerce acknowledgment but not belief. The acquittals (Schacht, etc.) break Pascal's expectation that the strong always win. This forces his framework to confront cases where legal forms constrain power—something his theory downplays. The Soviet dissent shows internal fractures in "the strong," revealing that victors aren't monolithic—a blind spot for Pascal. 

  The superior orders defense is the crux. Pascal's quietism tells subjects to obey established power, yet Nuremberg rejected "just following orders." His split between outward obedience and inward dissent might offer an out: one could outwardly obey while inwardly condemning, making punishment for atrocities compatible with his view. But this strains his theory—Nuremberg demanded outward accountability, not just inner judgment. 

  For Kampala: Pascal would predict the opt-out clauses as inevitable—strong states (like non-ICC members) shield themselves while imposing rules on weaker ones. This confirms his descriptive claim but makes the theory unfalsifiable, as any legal carve-out becomes proof of power's primacy. 

  The user's deeper aim seems to be stressing Pascal's framework to its limits. Nuremberg reveals where his cynicism oversimplifies—e.g., acquittals show legal autonomy, and the tribunal's attempt to bind force with procedure (however imperfect) challenges his fatalism. The key tension: Pascal never imagined supra-national law constraining sovereigns, so Nuremberg is an anomaly his theory can't neatly digest. The Kampala analysis underscores how his model explains power dynamics but resists falsification by design.
answer: |-
  Here's the mapping of Nuremberg onto Pascal's fragments, with breaks identified as requested, keeping his three claims distinct:

  ### Pascal's Framework Applied to Nuremberg
  1. **Descriptive Claim (Justice originates in force/usurpation)**  
     - **Charter & Ex Post Facto Charges**: The Allies (victors) unilaterally defined crimes (aggression, crimes against humanity) and established the tribunal. This embodies "making what is strong just." The Charter's authority derived from Allied military dominance, not pre-existing international consensus.  
     - **Soviet Dissent on Katyn & Leniency**: The USSR (a victor) protested verdicts as "too soft" and rejected evidence implicating themselves in Katyn. This highlights how "origins must not be traced": exposing Soviet crimes would undermine the tribunal's legitimacy, confirming Pascal’s point that revealing usurpation destroys authority.  

  2. **Quietist Conclusion (Obey established order)**  
     - **Superior Orders Defense Rejection**: The tribunal’s dismissal of "just following orders" **contradicts Pascal’s quietism directly**. Pascal urges subjects to obey established power unconditionally, yet Nuremberg punished obedience to the Nazi state. His inward/outward split (*"wanting to be loved where you can only be obeyed"*) offers no escape here: the tribunal demanded *outward* accountability for acts Pascal would classify as forced obedience. Nuremberg asserts that some orders rupture the duty of obedience—a concept alien to Pascal’s fragments.  

  3. **Orders Claim (Force cannot compel belief)**  
     - **Jackson’s Document Strategy**: Jackson prioritized captured documents over affidavits to persuade the global audience (order of minds). By Pascal’s lights, this **must fail**: force (seizing documents) belongs to the order of bodies; it cannot generate genuine intellectual assent. Documents might prove facts, but they cannot *compel* belief in the tribunal’s legitimacy or moral authority. Success would require charity, which force cannot access.  
     - **Acquittals (Schacht, von Papen, Fritzsche) & Limited Convictions**: Pascal’s cynicism predicts total victor impunity. Acquittals **break his descriptive expectation**. They reveal the tribunal’s adherence to *legal procedure* (however imperfect) over pure force. Pascal’s framework cannot explain why the strong (Allies) would permit symbolic defeats—unless the acquittals themselves served power (e.g., rehabilitating German institutions for Cold War stability). The submarine warfare reciprocity (Donitz) explicitly confirms "making what is strong just": Allied actions nullified the charge.  

  ### What Breaks Pascal’s Model?
  - **Acquittals & Procedural Constraints**: Pascal assumes the strong always consolidate power ruthlessly. Nuremberg’s acquittals and dropped charges show legal forms constraining victors—**an anomaly**. His theory lacks resources to explain why power would submit to its own rules.  
  - **Supra-National Justice**: Pascal’s world had no "stronger" entity above sovereign states. Nuremberg invented supranational jurisdiction (*"crime against peace"*), attempting to place law *above* the strongest (states). This is **unanticipated** and fractures his descriptive claim: the tribunal tried to anchor authority in nascent global norms, not just force.  
  - **Soviet Dissent as Power Fracture**: Dissent *within* the victors (Soviets vs. others) exposes competing interests, not monolithic power. Pascal’s fragments treat "the strong" as unitary—**a silence** that Nuremberg complicates.  

  ### Kampala Amendments (ICC Aggression Jurisdiction)  
  - **Pascal’s Prediction**: The opt-out clause for non-members and members’ declaration option **confirms his descriptive claim**. Strong states (US, China, Russia non-members) shield themselves from jurisdiction, while weaker states submit. The proviso ensures that only the *relatively weak* can be tried, making "what is strong just" by exempting the strongest.  
  - **Falsifiability Issue**: This **renders the theory unfalsifiable**. Any legal carve-out for powerful states is evidence for Pascal; any universal jurisdiction would be dismissed as a facade for new usurpers. The opt-out clause is precisely the "covering of origins" Pascal describes.  

  ### Coda: What Nuremberg Reveals About Pascal  
  - **Confirmation**: The tribunal’s authority *did* rest on Allied force; origins *were* obscured (Katyn); reciprocity excused acts (Donitz).  
  - **Anomaly**: Acquittals and procedural limits show law partially autonomous from raw power. Supranational crime posits justice *above* force.  
  - **Silence**: Pascal never conceived of institutionalized constraints on sovereigns or victors submitting to shared rules. His quietism clashes irreconcilably with holding agents accountable for state commands.  

  **Final Tension**: Nuremberg tried to use force (Allied power) to *create* justice (new international norms). Pascal would call this "making what is just strong" by force—but the acquittals and Soviet dissent prove the attempt was unstable, confirming his cynicism even in its partial failures.
