  - Anchor arguments in local history ("when they shot at the census takers")
  - Make the mainland woman a silent catalyst rather than speaking prop

  The Scottish/ECHR precedents will manifest obliquely: Tomas referencing "that island where Europeans decided who counted" while Adèle mentions "the compromise that stopped the bullets." 

  Most crucially, neither character should "win" - the scene's power lies in the irreconcilable tension between constitutive power and circular legitimacy. The pen Adèle sets down becomes the perfect ambiguous closer - both weapon and surrender.
answer: |-
  Here’s the brainstorm followed by the scene:

  **Brainstorm:**
  *   **Adèle's Core:** The roll isn't *just* a list; it's the *settlement*. It ended violence ("stopped the shootings"). Its legitimacy comes from being the agreed-upon boundary in that fragile peace, defining "Vessa" as a concrete political community with shared stakes and consequences ("durable ties and shared fate"). Affectedness is infinite/unbounded – where do you stop? Everyone on Earth is *affected* by climate change, but they don't all vote here.
  *   **Tomas's Core:** The vote *binds* him regardless. He loses tangible rights (land, passport, access) based on a decision he had no say in. The roll itself was *imposed* by a power structure (the metropole/Vessan parliament under the accord) that lacked a prior democratic mandate to draw *this specific line*. It’s circular: the deciders decided who gets to decide.
  *   **Adèle's Strength/Sticking Point:** "Affectedness has no edge." She can point to the woman behind Tomas – deeply affected *now* but excluded – to expose the absurdity of his logic if applied consistently. She embodies the practical necessity of a boundary born of painful compromise.
  *   **Tomas's Strength/Sticking Point:** "You enforce consequences on people you silenced." He highlights the real-world losses for him (land, passport) and the profound injustice of the silent woman behind him (subject to laws, excluded from founding them). He exposes the circularity: "Who authorized *this* roll?"
  *   **Adèle's Weakness:** The woman in the queue. She embodies the contradiction: someone deeply integrated and subjected *now* is excluded by the frozen roll Adèle defends. Also, Tomas's "Who decided the deciders?" question.
  *   **Tomas's Weakness:** His long absence undermines the "shared fate" narrative Adèle values. He looks like an external claimant, unlike the woman behind him who lives the consequences daily.
  *   **Argument Shifts:**
      1.  **Procedural:** "Your name isn't here." / "The rules say..." vs. "Who made these rules?" / "The form says *X* but the principle is *Y*."
      2.  **Personal:** "I buried my mother here!" / "I pay her bills!" vs. "You left!" / "Twenty-six years, Tomas!" / Invoking the silent woman: "Look at *her*!"
      3.  **Fear/Stakes:** "You're stealing my home!" / "My land! My right to come back!" vs. "Open the floodgates and it's chaos!" / "This roll *stopped the bullets*!" / The unspoken fear of the woman's exclusion undermining the new state's legitimacy from day one.

  ---

  **The Scene:**

  The ceiling fan churned the thick air in the Vessan registration office, doing little against the humidity clinging like a second skin. Adèle Dabrowski smoothed the stiff collar of her blouse, the starch long defeated. Across the scarred laminate counter, Tomas Varzin stared at the computer screen tilted towards him, his knuckles white where he gripped the edge. The pixelated list scrolled, names blurring – Varzin, Ewa; Varzin, Jan; Vasseur, Marie-Louise… but no Tomas.

  "See?" His voice was tight. "I'm not there."

  Adèle didn't need to look. She’d already checked twice. "The roll closed last week for final verification, Mr. Varzin. Based on the criteria." Her tone was measured, the practised calm of decades dealing with disappointed claimants, though the Varzin name tugged at something older, dustier. His mother’s land, up near the old quarry.

  "The *criteria*," he echoed, a brittle laugh escaping him. He tapped the laminated instruction sheet taped to the counter. "‘Domiciled on Vessa as of census date, or born on Vessa and maintaining significant ties.’ I was *born* here. My mother *just* died here. I own land. I’ve paid her care bills for ten years from London. Significant ties? What’s insignificant about that?"

  Adèle kept her gaze level. "The roll is based on residency at the time the referendum parameters were fixed under the Accord. Birth alone isn't sufficient without current domicile or..." she paused, choosing the bureaucratic phrase carefully, "...demonstrable, ongoing integration into the Vessan community *as defined at that time*."

  "*Defined at that time*," Tomas leaned forward, the counter pressing into his ribs. "By whom? That Accord parliament? The one *appointed* after the… troubles? The one the metropole basically installed? They drew the line *then*, freezing it, deciding who gets to decide *now*." His voice dropped, harsh. "Tell me, Registrar, who voted for *them* to make that call? Who authorized *that* boundary?"

  A muscle tightened near Adèle’s eye. She’d heard variations of this before, usually shouted at public meetings. Tomas Varzin delivered it quieter, sharper. "The Accord," she said, her own voice hardening slightly, "stopped people shooting each other over precisely this question. It created stability. A basis to move forward. The roll is part of that stability. You can’t rebuild a community on shifting sand. Who counts as ‘Vessan’ needed an answer everyone could live with, even if grudgingly."

  "So stability means locking people out?" Tomas gestured wildly towards the window, towards the mainland. "Stability means the nickel plant manager who arrived three years ago *after* the freeze, who lives in a company villa, pays no local taxes directly, gets to vote? Because he happened to be *domiciled* here on the magic date? While I, who owns this soil," he thumped the counter, "who just buried my mother in it, who pays into this system remotely, do not?"

  "Mr. Varzin, the manager is subject to the laws enacted *after* this vote, should it pass. He lives with the consequences daily. His stake is immediate." Adèle’s argument felt suddenly thin, echoing in the small room. She saw the flicker in his eyes – the opening.

  "*His* stake?" Tomas’s voice rose, incredulous. He half-turned, his arm sweeping towards the woman standing patiently behind him, clutching her own form. She was perhaps forty, mainland features, wearing the practical clothes of a nurse or shop worker. "What about *her* stake?"

  The woman flinched slightly, eyes widening.

  Adèle’s breath caught. The woman *wasn't* on the preliminary lists. She knew the type – mainland-born, likely working at the plant or supporting services, resident for years. Probably ineligible.

  Tomas pressed his advantage, turning back to Adèle, his finger jabbing towards the silent woman. "Eleven years! She told me in the queue. Eleven years living here. Pays her taxes here. Obeys your laws. Raises her kids here, maybe? Subject to *every single law* this new state would pass. Bound by its decisions. Just like me. More than me, right now! But according to your *stability*, your *settlement*, she doesn’t get a say either! Because she wasn't here on the sacred date?" He stared at Adèle, daring her. "Is *her* affectedness not significant enough? Or is it just inconvenient?"

  Adèle felt heat rise in her cheeks. The woman’s presence was a physical weight, a silent accusation against both of them. She couldn’t meet the woman’s eyes. "Her situation," Adèle began, forcing calm, "is governed by the same Accord provisions. Residency began after the freeze. The referendum concerns the fundamental act of self-determination of the *existing, defined* Vessan polity..."

  "Existing? *Defined?*" Tomas cut her off, a raw edge in his voice now. "You define it by shutting her out? By shutting *me* out? My mother’s land – if it votes yes, what then? Does it become state property? Do I need a visa to visit my own mother’s grave? Who decided I wasn’t one of you anymore, Adèle? *Who decided?*"

  The sound of her first name, unexpected, hung in the air. It wasn't sentimental; it was a challenge from someone who remembered a Vessa before registrars and Accords. The fan whirred. Files rustled in a back office. The mainland woman shifted her weight, looking at the floor.

  Adèle looked at Tomas. Not at the expat, but at the boy who’d lived down the ridge, the son of Ewa Varzin who’d scraped a living from that stubborn hectare. She saw the land, the bills paid from afar, the coffin lowered just yesterday. She saw the silent woman bound by laws she didn't shape. She saw the ghost of census takers ducking stones, then bullets.

  "Nobody decided, Tomas," she said, her voice suddenly quiet, stripped of procedure. "Not in the way you mean. Not a vote, not a court. Not even really the metropole ministers in their distant offices." She picked up his rejected application form, the paper limp in the humidity. "It happened. Like the tide. People were here, or they weren’t. People stayed, or they left. People bled, and then they stopped. And the line got drawn where the bleeding stopped. Was it fair?" Her gaze flickered towards the mainland woman, then back to Tomas. "Fairness wasn’t the point. Stopping was the point. Having *a* line was the point. Because the alternative..." She trailed off, her eyes drifting to the heavy metal stamp beside the blotter. The one that said 'REFERENDUM REGISTRATION – APPROVED'. Its twin, 'REJECTED', lay unused today. "The alternative was no line at all. Just... endless argument. Or worse."

  Tomas followed her gaze to the stamp. He saw the finality in its cold weight. "So that's it? The line stops me. Stops her." He nodded towards the silent woman. "Because twenty years ago, things were bad, so now we freeze it? Her fate, my land... locked out by history?"

  "It's the roll we have," Adèle said, the bureaucratic mantle settling back over her shoulders, though it felt heavier now. She placed his form precisely in the 'Pending Further Review' tray – a gesture as hollow as they both knew it was. "The only one that holds. The one that lets us ask the question without... without revisiting the old wounds."

  Tomas stared at the 'REJECTED' stamp. He didn't touch it. He looked past Adèle, out the grimy window towards the hills where his land lay, where his mother was buried. Then his eyes shifted to the mainland woman, still waiting silently, her own small hopes likely pinned on a form yet to be processed. His argument hadn’t landed; it had dissolved into the impossible gulf between the principle he invoked and the woman who embodied its other edge, between his claim and the unyielding reality of the stamp Adèle hadn’t used, but hadn’t needed to.

  Adèle picked up her pen. It trembled, just slightly, before she tightened her grip. She looked not at Tomas, but at the next form in the stack, the next name, the next fragile claim on the future of a place defined by a line drawn in the uneasy sands of the past. "Next?" she called, her voice clear, forcing the room to move on. The mainland woman stepped hesitantly forward as Tomas remained frozen, staring at the untouched 'REJECTED' stamp gleaming dully under the fluorescent lights.
