prompt: |-
  Okay, so I need help settling something, and partly I need it because I just spent four hours arguing with my friend Dana last night and neither of us blinked.

  Dana's a litigator. She's been reading around the "incompleteness of law" stuff — the idea that no legal system can fully ground itself — and she's convinced Gödel proves that any rule system rich enough has to contain claims it can't settle from the inside, so judges are permanently forced to step outside the rulebook, which she says is why judicial discretion isn't a bug. I said no: what Gödel proves is a very specific thing about a very specific kind of system, and the sentence your version needs doesn't exist, because a legal code isn't effectively axiomatized, doesn't contain arithmetic, and can't prove statements about its own provability. She said I'm being a pedant, and that the *structure* is the same even when the content isn't, and structure is what theorems are about. Which is not nothing. That's the actual crux and I couldn't answer it, so whatever procedure you build below, tell me at the end whether Dana's got a point — because if "the structure is the same" is ever true of these arguments, my screening is going to be wrong exactly where it matters most.

  Day job: I chair the program committee for a small interdisciplinary conference on minds, machines, and formal methods. Legal theory people, cognitive scientists, some AI folks, a couple of philosophers. Roughly 70 abstracts this year and I'd swear a third of them invoke Gödel, incompleteness, or "undecidability," usually in a way that would not survive ten minutes with a logician and also would not survive ten minutes with a careful generalist. My committee is a software engineer, a legal scholar, and a cognitive scientist. Nobody has done logic past undergrad. We get maybe 12–15 minutes per abstract, authors get one round of written response, and I can't run a seminar on the diagonal lemma in between.

  What I want is a triage procedure my committee can actually run, in order, on any abstract that leans on incompleteness. Not an essay about what the theorems say — a procedure. Questions to ask in sequence, each one answerable from the abstract plus the author's reply; what counts as a pass on each; what each kind of failure commits us to; and where the procedure stops and hands the call back to a human because the remaining question is about what this conference is for rather than about logic.

  Things I want baked in:

  1. It should start from a distinction I've been using informally and want you to sharpen or throw out. I sort Gödel-flavored abstracts into three buckets: decorative (the theorem is a label; delete it and the argument is unchanged), load-bearing (there's a real self-referential construction doing work, and you can point at the specific claim it produces), and misapplied (the hypotheses are violated — wrong kind of system entirely). Give me operational tests that separate these, and tell me whether the three-bucket scheme is even right or whether its hiding a fourth case I keep landing on.

  2. My current shortcut is: if the author can't name the particular claim their diagonal-style argument generates, it's misapplied, full stop, reject. I suspect that's too harsh — partly because of Dana's structure point — and I also suspect it's too *lenient* in the other direction, since someone can cheerfully name a sentence while violating every other precondition. Fix it.

  3. I want a plain-language hypotheses audit: the actual preconditions the first and second incompleteness theorems need (effective axiomatization, enough arithmetic, and the difference between assuming consistency and assuming soundness, plus whatever else matters), written so my cognitive scientist can apply it without knowing what a fixed point is. Please include the two senses of "undecidable" that these abstracts run together constantly, and the fact that the same man proved a completeness theorem about first-order logic that says something close to the opposite of what half these submissions think it says.

  4. Run the whole procedure on three abstracts, roughly as they'd show up in my inbox:
     - a legal theory paper arguing that since any sufficiently rich normative system cannot demonstrate its own consistency, constitutional review has to be located outside the system it reviews;
     - an AI paper arguing that a trained language model is a formal system, so there is a true claim about its own outputs it cannot derive, whereas its human users can see that claim is true, therefore the model cannot have understanding;
     - an organizational design paper using incompleteness to argue that no company can write down all of its own operating rules and must deliberately leave gaps for on-the-ground judgment.
     Tell me the verdict each one gets, step by step. And be honest with me: at least one should come out in a way I'm going to find annoying, because I have strong priors about the AI one and the org one and I'm probably wrong about one of them. Say which, and why.

  5. Mark where the procedure will misfire — which abstracts it wrongly sinks, which ones it waves through, and any test that quietly assumes the thing I'm trying to test for. And where the honest answer is "that's not a logic question, that's a call about your conference's identity," say that instead of dressing it up as a rule.

  Please don't give me a bibliography, a reading list, or names-and-dates. If you need to bring in the Lucas/Penrose style argument or the standard objection to it, just describe the argument — don't cite it. I can't check citations and neither can my committee.

  American English, please.
reasoning: |-
  Okay, let me tackle this user's problem step by step. They need a practical triage procedure for conference abstracts misusing Gödel's incompleteness theorems. 

  First, I need to understand their core frustration: too many abstracts invoke Gödel superficially, and their committee lacks formal logic expertise. The key is creating an executable checklist that doesn't require advanced math.

  The user's existing three-bucket system makes sense - decorative, load-bearing, misapplied - but needs operational tests. I should refine this by adding a fourth bucket: structural analogy. Dana's point about "same structure" is valid for abstracts making careful parallels without formal proofs.

  For the procedure, I'll start with a quick decorative filter: if removing "Gödel" changes nothing, reject. Then verify the system type - legal codes and language models aren't formal systems. The critical test is whether authors specify their "Gödel sentence" analogue. 

  The hypotheses audit must be plain-language: 
  - Effective axiomatization = rulebook with searchable procedures
  - Sufficient arithmetic = can do math like "2+2=4"
  - Consistency vs soundness = no self-contradictions vs always correct

  I'll explicitly distinguish logical undecidability (unprovable) from practical indeterminacy (unresolved cases).

  For the three sample abstracts:
  - Legal theory: Fails on system type (not axiomatized) but might pass as structural analogy
  - AI paper: Fails completely (LLMs aren't formal systems)
  - Org design: Decorative use - removing Gödel doesn't hurt argument

  The AI paper verdict will annoy the user since they dislike it but the logic is sound. The org paper gets waved through as harmless metaphor.

  Biggest misfire risks:
  - Overly strict on structural analogies (Dana's point)
  - Missing bad math in "load-bearing" claims
  - Not catching completeness theorem confusions

  Where to stop: When an abstract passes all logic tests but the analogy's relevance is debatable - that's a conference scope judgment call.

  I'll wrap by affirming Dana has a partial point: structure matters when explicitly argued, not when vaguely gestured at. The procedure should reflect that nuance.
answer: |-
  Here’s your triage procedure, designed as a sequential checklist. It assumes **no logic expertise**, runs in 10–12 minutes per abstract, and focuses on operational tests. Each step must be passed to proceed; failure at any step assigns the abstract to a bucket with a recommended action. The buckets are revised to four: **DECORATIVE**, **STRUCTURAL ANALOGY**, **LOAD-BEARING**, or **MISAPPLIED**.

  ---

  ### **Triage Procedure: Gödel-Incompleteness Claims**
  **Instructions:**  
  Apply steps in order. Use abstract + author response. Stop at first failure and assign bucket.  
  **Key:**  
  - ✅ = Pass | ❌ = Fail | ⚠️ = Proceed but flag for committee discussion  

  ---

  #### **STEP 1: DECORATIVE FILTER**  
  **Question:** *If "Gödel," "incompleteness," or "undecidability" were deleted, would the core argument collapse?*  
  - ✅ **Pass:** Argument clearly depends on the theorem (e.g., "because of incompleteness, we must...").  
  - ❌ **Fail:** Theorem is ornamental (e.g., "like Gödel, our system has gaps").  
  **Failure Bucket:** DECORATIVE  
  **Action:** Reject (or request term removal).  
  *Why?* If the theorem isn’t doing work, it’s noise.  

  #### **STEP 2: SYSTEM TYPE CHECK**  
  **Question:** *Does the abstract claim the target system (e.g., law, AI, company rules) is a **formal axiomatic system**?*  
  - ✅ **Pass:** Explicitly calls it "axiomatic," "formalized," or "proof-theoretic" (e.g., "the legal code is an axiom system").  
  - ❌ **Fail:** Describes a non-formal system (e.g., "trained neural nets," "organizational culture," "social norms").  
  **Failure Bucket:** MISAPPLIED  
  **Action:** Reject.  
  *Why?* Gödel applies only to systems **built from symbols with mechanical deduction rules** (like math). Real-world systems rarely qualify.  

  #### **STEP 3: THE CLAIM TEST**  
  **Question:** *Can the author name the **specific self-referential claim** their "Gödel sentence" analogy produces?*  
  - ✅ **Pass:** Identifies a concrete claim (e.g., "This law cannot prove its own validity," "This AI cannot output ‘I am consistent’").  
  - ❌ **Fail:** Vague or absent (e.g., "there will always be uncertainty," "the system is incomplete").  
  **Failure Bucket:** MISAPPLIED  
  **Action:** Reject.  
  *Why?* Gödel’s core is a **diagonal construction** of a sentence that says "I am unprovable." No sentence → no analogy.  

  #### **STEP 4: HYPOTHESES AUDIT (Plain Language)**  
  **Ask these sub-questions. All must pass:**  
  1. **"Rulebook Test":** *Can the system’s rules be written down and checked mechanically?*  
     (✅ = Yes, like a computer program | ❌ = No, e.g., "judicial intuition," "workforce culture")  
     *This is **effective axiomatization**.*  
  2. **"Math Test":** *Can the system do basic arithmetic?*  
     (✅ = Explicitly handles +, ×, numbers | ❌ = No arithmetic, e.g., "only ethical rules," "outputs text")  
     *This is **sufficient arithmetic** (required for self-reference).*  
  3. **"Consistency vs. Soundness":** *Does the argument confuse "no contradictions" with "always correct"?*  
     (✅ = Distinguishes them | ❌ = Uses "consistent" to mean "true" or "reliable")  
     *Gödel assumes **consistency** (no self-contradiction), not **soundness** (all outputs are true).*  
  4. **"Undecidability":** *Does "undecidable" mean "unprovable" (Gödel) or "practically unresolvable"?*  
     (✅ = Clearly means unprovable | ❌ = Uses it for "ambiguous" or "subjective").  
  5. **"Completeness Clash":** *Does the abstract imply Gödel says "nothing is provable"?*  
     (✅ = No | ❌ = Yes. Reminder: **Gödel’s completeness theorem** says first-order logic *can* prove all universally valid statements!).  

  - ✅ **Pass All:** Proceed to Step 5.  
  - ❌ **Fail Any:** Bucket → MISAPPLIED. **Action:** Reject.  

  #### **STEP 5: STRUCTURE vs. LOAD-BEARING**  
  **Question:** *Is the author using Gödel’s **proof structure** (self-reference + unprovability) to illuminate their system, **without** formally replicating it?*  
  - ✅ **Pass (Structural Analogy):** Explicitly argues the *pattern* holds (e.g., "Like Gödel’s system, law has self-referential paradoxes forcing external resolution").  
  - ✅ **Pass (Load-Bearing):** Claims to **formally prove** a Gödel-like result in the target system (e.g., "We construct a sentence undecidable in this AI’s inference engine").  
  - ❌ **Fail:** Vague handwaving (e.g., "Gödel shows all systems have gaps").  
  **Assignment:**  
  - **STRUCTURAL ANALOGY** (if pattern-based) → ⚠️ **Committee Decision**  
  - **LOAD-BEARING** (if formal proof) → ✅ **Accept** (pending scope check)  
  *Why?* Dana’s point lives here. A rigorous *structural analogy* can be valid interdisciplinary work, but requires human judgment.  

  #### **STEP 6: CONFERENCE SCOPE CHECK (Human Only)**  
  **⚠️ For STRUCTURAL ANALOGY or controversial LOAD-BEARING:**  
  *Does this abstract’s use of Gödel generate insight relevant to the conference’s goals (minds/machines/formal methods)?*  
  - Not a logic test → pure program committee judgment.  

  ---

  ### **Bucket Definitions & Actions**  
  - **DECORATIVE:** Theorem is a metaphor. **Action:** Reject.  
  - **MISAPPLIED:** Violates logic preconditions. **Action:** Reject.  
  - **STRUCTURAL ANALOGY:** Argues pattern similarity. **Action:** Committee debate (accept/reject based on relevance).  
  - **LOAD-BEARING:** Formal self-referential proof. **Action:** Accept (if hypotheses hold).  

  ### **Testing Your Three Abstracts**  
  **Abstract 1 (Legal Theory):**  
  *"Constitutional review must be external because no rich normative system proves its own consistency."*  
  - **Step 1:** ✅ (Argument depends on theorem).  
  - **Step 2:** ❌ (Law isn’t a formal axiomatic system).  
  - **Bucket:** MISAPPLIED → **Reject**.  
  *Verdict:* Fails Step 2. Not formal math.  

  **Abstract 2 (AI Paper):**  
  *"Language models are formal systems; thus, a true claim about their outputs is unprovable by them, so they lack understanding."*  
  - **Step 1:** ✅ (Core argument).  
  - **Step 2:** ❌ (LLMs are statistical, not deductive; no axioms/proofs).  
  - **Bucket:** MISAPPLIED → **Reject**.  
  *Annoyance Alert:* You’ll dislike this, but LLMs **aren’t formal systems** (Step 2). Gödel doesn’t apply.  

  **Abstract 3 (Org Design):**  
  *"Incompleteness proves companies can’t codify all rules, needing on-the-ground judgment."*  
  - **Step 1:** ❌ (Delete "incompleteness" → argument stands as "rules can’t cover everything").  
  - **Bucket:** DECORATIVE → **Reject**.  
  *Why You’re Wrong:* You might think it’s MISAPPLIED, but Step 1 catches it earlier. It’s a metaphor.  

  ---

  ### **Where the Procedure Misfires**  
  1. **False Negatives (Wrongly Sinks):**  
     - **Deep structural analogies** failing Step 3 (if author can’t articulate a "sentence"). Dana’s best case sinks here unless analogy is explicit (Step 5).  
     - **Correct but vague LOAD-BEARING** abstracts failing Step 3.  
     *Mitigation:* Step 5 rescues explicit analogies.  

  2. **False Positives (Waves Through):**  
     - **LOAD-BEARING** abstracts with bad math passing Step 3 (e.g., naming a sentence but botching arithmetic).  
     *Mitigation:* Step 4’s Math Test catches arithmetic absence, but won’t catch *wrong* math.  

  3. **Hidden Assumption:**  
     Step 3 assumes the author’s named "sentence" is genuinely self-referential. A clever fraud could pass.  

  4. **Gray Zone:**  
     **STRUCTURAL ANALOGY** is entirely subjective. The procedure flags it for humans but won’t resolve if the analogy is *insightful*. That’s intentional.  

  ### **Dana’s Point: Does "Structure" Matter?**  
  **Yes, but conditionally.**  
  - If an abstract **explicitly argues** that its target system shares the *proof structure* of Gödel (self-reference + unprovability + external resolution), that’s potentially valid as interdisciplinary theory (hence the **STRUCTURAL ANALOGY** bucket).  
  - If it just says "Gödel proves gaps exist," it’s **MISAPPLIED** or **DECORATIVE**.  
  Your triage now isolates this case (Step 5) for committee debate.  

  ---  
  **Final Output:** A reject-heavy flowchart that protects your committee’s time, forces rigor, and isolates Dana’s valid point for human discussion. Run this first on your 70 abstracts—you’ll likely cull 90% by Step 2.
