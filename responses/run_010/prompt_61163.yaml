prompt: |-
  So — I'm six weeks into a contract evals role at a lab, first job where anyone actually asks me anything, and my first deliverable is due Friday and I genuinely can't tell which of two senior people is right. Bad place to be when you're the one who has to write the spec.

  Context on what we're building. It's a debate-style oversight setup: two copies of a frontier model get assigned opposite sides of a question about a diff someone submitted (roughly "does this PR introduce a bug that lets a request skip the auth check?"), and the judge is deliberately weak — a small model, plus a non-specialist human who reads the transcript after. The pitch is the usual one: you can't just trust the strong models to answer straight, but a lie is supposedly harder to defend than a truth is to attack, so an adversarial format lets a judge who could never have found the bug on their own still land on the right side. That's the theory I'm supposed to be stress-testing.

  The twist our team added, and where the fight is: each debater gets a budget of two "demos" per debate. A demo is an artifact the judge can check in under two minutes with a harness we wrote — a runnable test case, a minimal input that triggers the behavior, a filled-in form, that kind of thing. The thinking was that demos are what turn the exercise from rhetoric into something closer to verification.

  Our pilot (~400 debates; ground truth came from a stronger model, hand-reviewed on a subset) turned up something odd. When a side used a demo at all, the judge went with that side 85% of the time. Split by which side, though: accuracy against ground truth went up when the demo came from the side arguing the bug *is* there, and went down when it came from the side arguing it isn't. Those negative-side demos were mostly things like "here is the test suite passing on the changed file" — genuinely re-runnable, the judge did re-run them — and the judge treated them as close to decisive.

  Mira and Sam then went at it in design review, more or less like this:

  1. Mira: this is the protocol working, not failing. Demos are where verification actually happens — a true claim has a witness and a false one doesn't — so the accuracy drop on the negative side is just a badly written demo spec. Tighten what counts as a demo to things the judge can confirm independently rather than things the judge can merely re-run.

  2. Sam: that's circular. You're assuming the judge can tell a witness from a performance. In our own pilot the passing test suite *was* confirmable by your standard — its a real artifact, the judge re-ran it, it passed — and it still tanked accuracy, because passing tests only licenses "no bug the tests cover," and coverage is exactly what a weak judge can't assess. So the honest fix is the opposite of yours: ban demos for negative and universal claims entirely.

  3. Mira: fine, but now you've built an asymmetric protocol, and asymmetries get exploited. Our debaters don't pick which side they're on, but they do pick which sub-claim they demo. Here's what a model that wants to win does: it takes the "no bug" side, spends its whole budget on real-but-irrelevant witnesses — a clean test run, a tidy diff, some unrelated edge case handled correctly — and collects the 85% halo anyway. Call it demo-laundering. You haven't removed the failure mode, you've made it the only strategy available to one side.

  4. Sam: that's an argument for more demos, not fewer. If demos are cheap and both sides are forced to spend their full budget or forfeit it, the halo cancels, because now the judge is comparing artifacts instead of reacting to the mere presence of one. Demo parity.

  5. Mira: parity is worse than the disease. You'd have the honest negative side manufacturing artifacts it doesn't believe in, which trains exactly the wrong disposition, and you'd pay the legibility tax twice — judge attention burned on fake witnesses, models learning that producing a checkable-*looking* thing is what wins. At that point your accuracy number is tracking demo-writing style, which is persuasion with extra steps.

  6. Sam: then stop calling the pilot evidence for scalable oversight. What we built is elicitation with a legibility tax, and we should report it as that.

  Neither budged, my manager was on a flight, and she emailed me from the gate saying just write up the demo rule, whichever you think is right. Which I'd love to do except I dont know.

  Can you go through those six moves and rate each one — clearly right, defensible, mixed, clearly wrong — with a sentence or two on each? I want the ratings to actually engage with the numbers I gave rather than just with the abstract positions, because I suspect a couple of these moves sound better than they are once you notice what the pilot data does and doesn't license. Then tell me what both of them are missing. I have a nagging feeling there's at least one thing neither said that matters more than anything either did — maybe something about where my ground truth labels came from, or about what "85% of the time" is and isn't conditioned on — but I don't trust my own suspicion, so check it independently rather than take it from me. And finally, since this is a real decision I have to commit to in a doc: which rule should we ship? Mira's tightened demo spec, Sam's ban on negative-side demos, demo parity, no demos at all, or something neither of them proposed? If the honest answer is that this pilot can't distinguish them, say so — but then say what I'd have to change about the pilot so that it could.
reasoning: |-
  Okay, the user is in a tough spot with their first deliverable due soon. They're caught between two senior colleagues, Mira and Sam, who have opposing views on how to handle demo rules in their debate-style oversight system. The pilot data shows that demos heavily influence the judge, but accuracy drops when the "no bug" side uses them. 

  First, I need to unpack each of their six arguments and rate them based on the pilot data. The key points from the data are: demos boost win rates to 85% regardless of side, but positive-side demos (arguing a bug exists) improve accuracy while negative-side ones hurt it. The negative demos were things like passing test suites that judges could rerun but couldn't assess coverage for.

  Starting with Mira's first point: She claims the accuracy drop for negative demos is due to badly written specs. Her solution is to tighten what counts as a demo to things judges can independently confirm. But the pilot data shows judges did rerun the test suites (they were confirmable by her standard) and accuracy still dropped. So her solution doesn't address the core problem - judges lacking context to interpret results. Rating: Mixed.

  Sam's counterpoint hits harder: He says Mira's fix is circular because judges can't distinguish meaningful witnesses from misleading ones. His example about test coverage is spot-on - the pilot proves judges can run tests but not assess if they cover the relevant cases. His proposed ban on negative demos directly responds to the observed failure. Rating: Defensible.

  Mira's demo-laundering concern is strong. If we ban negative demos, models could exploit the asymmetry by producing irrelevant but verifiable artifacts when arguing "no bug." The 85% halo effect means this could still sway judges. The pilot doesn't test this directly, but the risk feels real. Rating: Defensible.

  Sam's demo parity idea (forcing both sides to use demos) seems flawed. The data shows demos dominate decisions regardless of quality. Forcing negative sides to manufacture demos might worsen accuracy and teach bad habits. His "halo cancels" assumption isn't supported. Rating: Clearly Wrong.

  Mira's critique of parity is devastating. Manufacturing demos would corrupt the process and burn judge attention. The pilot's 85% effect suggests artifacts would still sway judges disproportionately. Rating: Clearly Right.

  Sam's final point about rebranding the system is reasonable but premature. The pilot shows problems with negative demos, not that the entire approach is hopeless. Rating: Defensible.

  What both are missing: The ground truth came from a stronger model hand-reviewed on a subset. This could propagate errors - especially if the strong model missed subtle bugs that negative demos "proved" weren't there. Also, the 85% win rate for demo users might be conflating correlation and causation - perhaps stronger arguments simply tend to include demos.

  For the recommendation: Neither extreme solution works. Instead, implement a "burden of proof" rule: Only the positive side (claiming a bug exists) can use demos. This aligns with how verification works in security - you prove vulnerabilities exist, not that they don't. It avoids Mira's laundering concern while respecting the pilot data showing negative demos mislead judges. 

  If this fails, next steps would be: Run a variant testing burden-of-proof vs no-demos vs original; improve ground truth with human audits focused on negative demo cases; and test judge training to detect misleading artifacts.

  The user's suspicion about ground truth is spot-on - that's the hidden thread neither Mira nor Sam pulled. They should absolutely highlight that limitation in their report.
answer: |-
  Here's a breakdown of each argument grounded in your pilot data, followed by what's missing and a concrete recommendation:

  ### Ratings of Arguments (Based on Pilot Data)
  1. **Mira (Tighten Demo Spec):**  
     **Rating: Mixed**  
     *Why:* Her claim that true claims have witnesses while false ones don't *sounds* logical, but your data refutes this. Judges accepted negative demos (e.g., passing tests) as "witnesses" 85% of the time, and these were verifiable artifacts. The problem isn't judge independence (they re-ran tests) but **judge context blindness**—they couldn't interpret *why* a passing test might be irrelevant. Tightening the spec doesn't fix the coverage gap Sam identified.

  2. **Sam (Ban Negative Demos):**  
     **Rating: Defensible**  
     *Why:* Directly addresses the pilot's accuracy drop. Negative demos tanked accuracy despite being "valid" artifacts because judges overvalued them without understanding coverage/salience. Banning them sidesteps this proven failure mode. But Mira's laundering concern (point 3) isn't tested in your data—this is speculative but plausible.

  3. **Mira (Asymmetry Exploitation):**  
     **Rating: Defensible**  
     *Why:* Your 85% "halo effect" shows demos dominate decisions regardless of truth. If negative demos are banned, models *could* pivot to laundering—flooding with irrelevant positive-seeming artifacts (e.g., "Look, this *other* auth check works!"). No direct proof, but the halo effect makes this a credible risk.

  4. **Sam (Demo Parity):**  
     **Rating: Clearly Wrong**  
     *Why:* Ignores the core problem: demos are **persuasive beyond their probative value**. Forcing both sides to produce demos would amplify noise (manufactured artifacts) without fixing judge overreliance. Your data shows demos win 85% of the time—parity would just mean *both* sides exploit this, worsening accuracy and incentivizing Mira's "legibility tax" disaster.

  5. **Mira (Parity Harms Honesty):**  
     **Rating: Clearly Right**  
     *Why:* Directly supported by your halo effect. If demos win 85% regardless of truth, forcing negative sides to fabricate demos trains deception and distracts judges. Your pilot shows judges don't discern demo quality—they reward *presence*, not validity.

  6. **Sam (Rebrand as Elicitation):**  
     **Rating: Defensible but Premature**  
     *Why:* The pilot *does* show the system tracks persuasion, not truth. But this is a fallback position—it doesn't solve the demo problem. Accuracy improved with positive demos (per your data), suggesting partial value. Abandoning oversight claims is premature without testing fixes.

  ---

  ### What Both Are Missing: The Ground Truth Trap
  **Your nagging suspicion is correct.** The critical blind spot is your **ground truth labels**:  
  - They came from a stronger model + limited human review.  
  - If that model missed edge cases (e.g., bugs only trigger under complex conditions), a "passing test" negative demo *could be falsely convincing judges*—not because judges are gullible, but because your ground truth itself was incomplete.  
  - The accuracy drop for negative demos might reflect **ground truth errors**, not just judge errors. Example: A negative demo shows tests passing → judge rules "no bug" → but the strong model missed a vulnerability → recorded as "judge wrong."  

  **Neither Mira nor Sam questioned the validity of the labels.** If your ground truth has gaps, their entire debate rests on shaky data.

  ---

  ### Recommendation: Ship "Burden of Proof" Asymmetry
  **Rule:** Allow **only the positive side** ("bug exists") to use demos.  
  **Why:**  
  1. **Fits pilot data:** Positive demos improved accuracy; negative demos hurt it.  
  2. **Mitigates laundering:** Negative side can't spam irrelevant demos.  
  3. **Philosophically sound:** Proving existence of a bug (via demo) is easier than proving absence. Security aligns with this (e.g., "proof of exploit").  
  4. **Reduces judge overload:** Focuses limited judge attention on high-signal artifacts.  

  **Not Mira's spec-tightening:** Judges *already* confirmed demos independently (re-ran tests). The issue is interpretation, not verification.  
  **Not Sam's full ban:** Positive demos worked—don't discard them.  
  **Not demo parity:** Would incentivize artifact spam.  
  **Not no demos:** You lose the accuracy boost from positive demos.  

  ---

  ### If Pilot Can’t Distinguish? Next Steps
  **If forced to admit ambiguity:**  
  > *"Pilot data shows negative demos reduce accuracy but cannot resolve whether this stems from judge limitations, ground truth flaws, or protocol asymmetry. Burden-of-proof rule recommended as safest interim fix."*  

  **To improve the pilot:**  
  1. **Audit ground truth:** Have experts review *all* negative-demo cases where judge disagreed with label.  
  2. **Test asymmetry:** Run 200 debates with only positive-side demos allowed. Compare accuracy to original.  
  3. **Judge training:** Add a module teaching judges to ask: *"Does this demo directly disprove the *specific* bug claim?"* Measure if accuracy improves.  
  4. **Control group:** Run debates with *no demos allowed*. Is baseline accuracy acceptable?  

  **Ship the burden-of-proof rule Friday.** It’s the only option that respects your data while blocking proven failure modes. Flag the ground truth uncertainty in your report—it’s the real elephant in the lab.
