prompt: |-
  I cover science and ideas for a magazine, and next Friday I have to give the eulogy for the editor who hired me — really the man who made me. He died at 84. Semi-public figure: three books, a famous column, rescued a couple of careers including mine. He was also, and this is the whole problem, cruel. Not in private, either: in margin notes, in meetings, on the record, mostly at juniors who couldnt answer back. His widow and his three grown kids want a saint's life. The service is in a church and the priest has already told me he's framing it as a commemoration "in the manner of the lives of the saints," which my friend who teaches medieval church history says is exactly the point — a vita is a copy of a type, it gets read aloud and imitated, and the flattening of the individual is the price you pay for the model.

  I want the opposite. I want Plutarch. He says of his own method that "my design is not to write histories, but lives," and that "an expression or a jest" tells you more about a man than his biggest battles do. So build the thing out of small unguarded specifics, and carry the temper inside the portrait rather than around it.

  Act as an expert on Plutarch's biographical method and on hagiography as a genre — a philosopher who also happens to write these speeches for a living. Before drafting, think carefully and brainstorm out loud for a few lines: how can a life that includes vice still function as something to imitate, and what exactly does a vita gain by leaving vice out that a bios loses? Then write the speech.

  About 800 words, six minutes, for a room that's half grieving family who never saw the margins and half working journalists who did, plus one priest. Constraints: it has to comfort without asserting anything false; the word "complicated" is banned; no lecture about Plutarch, one explicit reference at most; and the temper has to land as the reason he's worth imitating, not as a disclaimer tacked on at the end. If Plutarch's habit of pairing two lives and comparing them is a way to get the flaw in without accusing him of it, use that.
reasoning: |-
  Okay, the user is a science and ideas journalist preparing a eulogy for their late editor. This is complex because the editor was both a mentor who "made" them and a publicly cruel figure. The family wants hagiography, but the user wants Plutarch's honest portraiture. 

  Hmm, the core tension: how to honor truth without sanitizing, comfort without lying. The user banned "complicated" - smart, that word would trivialize. And the cruelty must be framed as part of why he mattered, not an apology. 

  First, analyzing Plutarch vs hagiography: 
  - Saints' lives (vitae) remove flaws to create pure models. But that erases what made this man electrically alive. 
  - Plutarch's bios uses revealing details - a jest, a habit - to show character in motion. Vice isn't excised but integrated, making virtue more admirable because hard-won. 

  Ah! The pairing technique is key. Plutarch often contrasts two figures (Demosthenes/Cicero) not to judge but to illuminate. Could imply his cruelty by contrasting it with his rescuing of careers - two sides of the same intensity. 

  Constraints to navigate: 
  - Family never saw his cruelty; colleagues suffered it. Must speak to both without rupture. 
  - Priest framing it as saintly vita. Need to subtly redirect without confrontation. 
  - One Plutarch reference max. Save it for the climax. 

  Structure idea: 
  1. Open with gratitude (authentic, he did "make" user). 
  2. Show his brilliance through tiny habits - how he read margins, argued. These same details will carry the edge. 
  3. Pair opposites: his savagery in edits with his fierce protection of writers. Not "but also" - make it one texture. 
  4. Land on why the flaw mattered: his harshness wasn't contrary to his greatness but the furnace of it. 

  The widow wants a saint. But a saint wouldn't have terrified them into doing their best work. The truth is more comforting: he was fully human, and still worthy of love. 

  Biggest risk: colleagues might think user is whitewashing, family might feel betrayed. Solution: embed the bite in specific praise. "He gave me my first assignment with corrections in red so dense it looked like the page was bleeding" - shows cruelty but frames as gift. 

  Yes. The temper lands as worth imitating because it was the engine of his integrity. Not despite the flaws, but through them.
answer: |-
  ## Eulogy for a Man Who Made Us Bleed and Blossom

  [Standing at the podium, look across the gathering, acknowledging both family and colleagues]

  Father Connolly, thank you for framing this remembrance in such a meaningful tradition. Margaret, James, Eleanor, Michael… my heart is with you. And to my colleagues, here in suits and good shoes we’ve probably worn too rarely… we know why we’re assembled.

  Arthur Crane hired me. More than that, he *made* me. He saw something raw and unformed in a pile of clippings and decided, against the advice of several sane people, to give it a desk, a bottle of ink, and the terrifying gift of his attention. For that, I will always be profoundly grateful. He saved my career, and I know he saved others. That wasn’t an accident. It was Arthur.

  But how do we hold the whole man? The man whose margin notes could feel like surgical incisions – precise, necessary, but leaving you breathless with the sting? The man who, in meetings, could reduce a carefully constructed argument to rubble with a single, perfectly aimed phrase? Whose withering assessments, often delivered for the benefit of the room, weren't always confined to the page? Many of us here felt that lash. It was real. It was Arthur.

  *That* Arthur seems far removed from the devoted husband, the proud father, the writer whose three books dissected folly with scalpel-like wit, the columnist whose voice shaped generations of thought. The family Arthur, warm and fiercely protective. The public Arthur, championing truth. How do these pieces fit?

  Perhaps we look not for a smoothed-over saint, but for the living man. There was an ancient thinker who believed a single unguarded moment – a spontaneous word, a habitual gesture – reveals more about a person’s soul than grand, public deeds ever could. He believed in painting the character *within* the life, letting the light and shadow fall naturally from the specific brushstrokes.

  So, let’s paint Arthur with specifics.

  Remember the way he *read*? Not passively, but violently. He’d attack a manuscript, blue pencil held like a dagger, muttering under his breath. "Clumsy!" "Obvious!" "Sentimental drivel!" You’d find your copy later, veins of blue scoring every page, demanding more rigor, more clarity, less flab. It felt like annihilation. Yet, buried in the carnage, a single word circled: "Yes." Or "Here." Or "Finally!" That one word, hard-won, was oxygen. It meant you’d stumbled towards something true. The brutality and the pinpoint recognition were two sides of the same coin. **He demanded excellence because he believed it existed, and was worth the pain to uncover.** His cruelty wasn't random malice; it was the friction generated by an unyielding standard grinding against anything less.

  Recall his habit in meetings when a junior presented a half-baked idea. He wouldn’t sigh dramatically. He’d lean forward, eyes narrowing. "Explain that," he’d say, voice deceptively quiet. "Walk me through the logic. Step. By. Step." He wouldn’t interrupt. He’d just listen, a terrible, patient silence, until the gaps in your thinking yawned wide and undeniable. It was excruciating. But if you *could* walk the gauntlet, if you could refine the idea under that intense, unforgiving scrutiny, it emerged stronger, diamond-hard. **He believed ideas mattered too much to be coddled, and we mattered enough to be tested.** He rescued careers *because* he was ruthless; he saw potential worth the difficult investment of his formidable, often harsh, attention.

  Think of his own writing. That famous column. It wasn’t gentle. It skewered pretension, eviscerated lazy thinking, ridiculed hypocrisy with a glee that could border on merciless. But why? Because he held the world – science, ideas, public discourse – to the same impossible standard he held us, and himself. **He was cruel to the mediocre because he worshipped the excellent.** His own battles weren't against armies, but against sloppiness, against intellectual cowardice. His fierceness was the weapon he wielded in that fight, and he expected us to pick up our own.

  Margaret, James, Eleanor, Michael – you knew a different Arthur. The man who remembered your birthdays with absurdly specific books, who delighted in your triumphs, whose eyes softened when he spoke of you. That was also him. Entirely him. But the Arthur who terrified the newsroom wasn’t a mask he put on; it was the same intensity, the same fierce loyalty to what he valued, channeled differently. Protecting your world demanded a different kind of strength than forging ours.

  He wasn’t easy. He wasn’t always kind. He could be, frankly, terrifying. But he was never trivial. He never settled. He never let *us* settle. He imprinted upon us – through the sting of his pen, the heat of his critique, the occasional, hard-earned nod – a relentless pursuit of precision, of intellectual honesty, of the clearest possible expression of truth. He made us better by refusing to accept anything less. **His temper wasn't a flaw appended to his greatness; it was the furnace in which his integrity, and ours, was forged.**

  That’s the man to imitate. Not his specific barbs, but the uncompromising fire behind them. The refusal to tolerate the shoddy, the sentimental, the untrue. The fierce belief that ideas have consequences, that words demand precision, that excellence is the only worthy goal, however painful the path. He demanded we be better because he believed, fiercely and sometimes abrasively, that we *could* be.

  So, we mourn Arthur Crane. The demanding mentor. The devoted family man. The brilliant, difficult, indispensable force. We mourn the lash of his tongue and the strength it forced us to find. We mourn the blue-penciled pages and the truths they carved out. We mourn the impossible standard and the heights it pushed us towards.

  He made us bleed. And he made us blossom. That was his method. That was his gift. That was Arthur.

  And for all of it, the sting and the strength, we are profoundly, irrevocably grateful. May he find peace, and may his fierce standard continue to guide us.
