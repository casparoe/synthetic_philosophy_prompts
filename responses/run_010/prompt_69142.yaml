prompt: |-
  I chair the employee appeals panel of a regional health system, and roughly a dozen times a quarter we are asked to settle one question on which everything else turns: did this worker resign, or not? The determination decides whether the person is recorded as having left voluntarily — forfeiting reinstatement rights and internal appeal standing, and shaping the system's exposure in unemployment-insurance proceedings — or as having been separated by the employer. Our written standard is thin to the point of useless. It says only that a resignation must be clear, and that it is to be judged by what a reasonable person in the position of the manager who received it would have taken the words to do; the worker's later account of what they meant is not by itself decisive.

  The panel is three laypeople — a nurse, a facilities manager, a community appointee — none of them legally or philosophically trained. We have forty-five minutes per case and must produce a one-paragraph written rationale that counsel could read without embarrassment if the matter is litigated. Our current unwritten habit is to ask whether the worker really meant it. That produces outcomes that track sympathy rather than facts, and two panels hearing the same case would disagree.

  I want to replace that habit with a procedure grounded in what the theory of speech acts actually says about utterances that do not merely describe but perform: what has to be in place for an act of that kind to come off at all; the several ways it can fail, where some failures leave no act behind and others leave an act that is defective yet real; the part the hearer plays in completing it; the difference between the act succeeding and the act merely having consequences; and the fact that such acts are liable to be void or voidable rather than true or false. Translate that into a sequence of questions a layperson can answer in order.

  What I need from you:

  1. An ordered set of tests. The ordering must do work — state which failures terminate the inquiry with a finding that no resignation took effect, and which allow the panel to proceed to the next question.
  2. For each test, an evidential standard: what in the record before us would satisfy it, and what would not. Where a test turns on the reasonable hearer, say whose situation counts as the reference point and why.
  3. Explicit markers at every point where the procedure must hand the decision back to human judgment because what remains is a question of institutional values or fairness rather than a question of what the words did. Do not disguise those steps as further tests.
  4. An account of the translation itself: which distinctions from the theory you are keeping, which you are collapsing or dropping for lay use, and why the dropped ones can be spared. I would rather have a short procedure candid about its simplifications than a long one that pretends to precision it does not have.
  5. The procedure run on the cases below, showing the answer at each test rather than only the verdict. I expect at least one of them to come out against the worker in a way the panel will find distasteful; if so, say so plainly and note whether that is a defect of the procedure or of our written standard.
  6. A closing section on what the procedure cannot do: the kinds of case it will get wrong, the direction in which it errs, and whether the error is systematic.

  The cases:

  (a) During a shouting match with her supervisor over scheduling, a medical assistant says, "Fine, I'm done, I'm not doing this anymore," and walks off the unit. She returns twenty minutes later and says she was upset and is not leaving. The supervisor had already emailed human resources that she had quit.

  (b) An employee sends his manager a message reading, "I can't keep working like this. If nothing changes I don't see the point of staying." Nothing changes. He reports for work for six further weeks, then stops coming in.

  (c) A respiratory therapist tells two colleagues in the break room — not her manager — that she is putting in her papers. One colleague mentions it to the manager the following day. She never submits anything and never tells the manager herself, but the manager, on hearing the report, completes a separation form.

  Finally, tell me what your procedure does with a fourth case, and use it to expose the limits: an employee simply stops appearing and stops answering calls and messages, so that there is no utterance to test at all. Our handbook calls this job abandonment and treats it as equivalent to a resignation. If your procedure has nothing to say here, that is an acceptable answer — but explain what is missing and where the decision must go instead.

  Please do not include a reading list, citations, or references; I need something the panel can hold in two pages and use next month.
reasoning: |-
  Hmm, the user chairs an employee appeals panel for a regional health system and needs help developing a practical procedure to determine whether an employee resigned or was separated. This is a complex issue that turns on speech act theory, but the panel consists of laypeople with limited time per case. The user wants a clear, ordered set of tests grounded in linguistic philosophy but translated into actionable questions.

  The user's current approach—asking whether the worker "really meant it"—leads to inconsistent outcomes based on sympathy rather than objective standards. I need to replace this with a procedure based on speech act theory that distinguishes between successful resignations and failed attempts. Key elements include: conditions for an utterance to count as resignation, types of failures, the hearer's role, and the difference between voidable acts versus true/false statements.

  The procedure must be sequential, with clear termination points, evidential standards, and markers where human judgment is needed. It should be concise (under two pages), avoid legal jargon, and include practical examples. The user also wants me to acknowledge the procedure's limitations—what cases it might get wrong and why.

  For the test cases:
  - Case (a) involves an emotional outburst followed by retraction. The key question is whether "I'm done" under duress constitutes a clear resignation.
  - Case (b) features a conditional statement ("if nothing changes...") that never materializes into direct action. This tests the line between complaint and resignation.
  - Case (c) examines whether telling colleagues (not a manager) counts as valid resignation, highlighting audience requirements.
  - The fourth case (job abandonment) will expose the procedure's limits when no utterance exists.

  I'll structure the procedure around Austin's conditions for performative utterances: convention, intention, and reception. The sequence should first check for a valid attempt (was there an utterance to the right person under proper conditions?) before assessing quality (was it clear, intentional, etc.). Failures in the first category mean no resignation occurred; defects in the second may still create a voidable act.

  For lay usability, I'll simplify theory by:
  - Collapsing "infelicities" into binary "valid attempt?" and "successful act?" stages
  - Treating "intention" as externally observable (through words/actions) rather than internal state
  - Using "reasonable manager" as the sole perspective for reception
  - Explicitly marking where fairness judgments (not linguistic analysis) must take over

  The evidential standards will focus on objective facts: who heard what, when, and how they reacted. The "reasonable manager" standard ensures consistency while acknowledging institutional hierarchy. Crucially, I'll add a final step where the panel can override outcomes for fairness—but only after the linguistic analysis is complete, and with full transparency about why.

  For case (d) (abandonment), the procedure won't apply since no utterance exists. Here I'll note that the panel must rely on handbook policy, emphasizing that this is a separate determination based on conduct, not speech acts. This exposes the framework's core limit: it only analyzes utterances, not behavior alone.

  In testing the cases, I expect case (b) to produce a "distasteful" outcome (resignation found) since the employee continued working after a conditional statement. I'll flag this as a flaw in the written standard's thinness, not the procedure—the panel might want to lobby for policy changes around ambiguous warnings.

  Finally, I'll clarify systematic errors: the procedure will under-detect resignations in cases of extreme stress or indirect communication (cultural differences), and over-detect them in conditional/ambiguous scenarios. But this bias toward textual clarity aligns with legal risk reduction, even when it feels unfair.
answer: |-
  Here is a two-page resignation determination procedure for your panel, grounded in speech act theory, translated into sequential questions with clear standards and limitations.

  **Resignation Determination Procedure**

  **Core Principle:** A resignation is a performative act - words that *do* the leaving, not just describe it. Like handing in keys, saying "I resign" *is* the act. Whether it "works" depends on specific conditions. This procedure checks those conditions in order.

  **Ordered Tests:**

  1.  **Was there an *attempted* resignation?**
      *   *Test:* Did the employee make an utterance (spoken or written) that, on its face, could reasonably be understood as an immediate act of quitting? Look for words like "I quit," "I resign," "I'm leaving," "I'm done," "I'm not doing this anymore," "I give notice," or unambiguous equivalents. *Conditional* statements ("If X, I'll quit"), *future* intentions ("I plan to resign"), complaints ("I can't take this"), or discussions *about* resigning are **not** attempts.
      *   *Evidence:* Direct words used. Context (e.g., heated argument) is relevant *only* to interpret the words' literal meaning, not intent. "I'm done" uttered in frustration = possible attempt. "This place is awful" = not an attempt.
      *   *Failure Consequence:* **Terminate.** NO resignation occurred. (Reason: No performative act was even attempted).
      *   *Judgment Marker:* None. This is a linguistic fact test.

  2.  **Was the attempt directed to the *right authority*?**
      *   *Test:* Was the utterance made directly to the employee's manager or supervisor, or to someone in HR acting in that capacity? Telling only colleagues, friends, or family **does not count**, unless the recipient was demonstrably acting as the manager's agent *for receiving resignations*.
      *   *Reference Point:* What a reasonable manager/supervisor *in that specific role* would understand about the chain of command for receiving resignations. Standard practice is resignation to one's direct boss or HR.
      *   *Evidence:* Who received the words? Was it the manager/HR? If told to a colleague, was there proof the colleague had authority to *accept* resignations? (Rare). Manager hearsay is insufficient *for completion* (see Step 3).
      *   *Failure Consequence:* **Terminate.** NO resignation occurred. (Reason: The act wasn't directed to the person conventionally empowered to receive it).
      *   *Judgment Marker:* None. This is an institutional role/convention test.

  3.  **Did the *intended recipient* reasonably understand it as an immediate resignation?**
      *   *Test:* Would a reasonable person *in the position of the manager/supervisor who received the words* (considering their role, knowledge, and the immediate context *of the utterance itself*), understand the employee's words as an immediate act of resigning? Focus *only* on the words spoken/written at that moment and the manager's immediate, reasonable reaction. Ignore the employee's later explanation of their intent *at this stage*. Consider if the words were clearly spoken in anger/distress *if that ambiguity was immediately apparent to the manager*. Ambiguity means failure.
      *   *Reference Point:* The reasonable manager/supervisor *at the moment they received the words*. What would a typical supervisor in that position, hearing those words in that situation, reasonably conclude *right then*?
      *   *Evidence:* The exact words used. The setting (e.g., private meeting vs. public shout). Was the manager clearly present? Did the manager react *at the time* as if receiving a resignation (e.g., "Are you sure?", "Let's discuss this," initiating separation paperwork)? Silence or inaction weighs against understanding it as a resignation. Ambiguous words (like "I'm done" without clear context) or words spoken under extreme, obvious duress that would make a reasonable manager doubt their seriousness *mean failure*.
      *   *Failure Consequence:* **Terminate.** NO resignation occurred. (Reason: The performative act was attempted but misfired due to lack of uptake by the required hearer).
      *   *Judgment Marker:* None. This is about the hearer's reasonable perception at the time.

  4.  **Was the resignation *completed* by the employer?**
      *   *Test:* Did the manager/HR, based on their reasonable understanding (Step 3), unequivocally *accept* the resignation as effective? This acceptance can be explicit ("Your resignation is accepted") or implicit through clear, prompt action based *solely* on the resignation (e.g., immediately processing separation paperwork, deactivating access, informing staff the employee *has resigned*). Mere *hearing* or *noting* the words is not enough. Failure to schedule a return or continued absence after a clear resignation is *consequence*, not completion.
      *   *Evidence:* Actions taken by management *promptly after* receiving the words. Email to HR stating "X quit" is *preparatory*, not necessarily acceptance. Issuing a separation notice *citing resignation* is acceptance. Telling others "X resigned" is acceptance. *Inaction* or attempts to clarify/discuss mean completion did NOT occur.
      *   *Failure Consequence:* **Terminate.** NO resignation occurred. (Reason: The act was attempted and understood, but the conventional act requires acceptance to be fully performed. Without it, it's merely an *offer* to resign that can be withdrawn).
      *   *Judgment Marker:* **Judgment Point:** If Steps 1-3 pass, but Step 4 fails (no acceptance), the panel *must* decide based on **fairness and institutional values**. Is it fair to hold the employee to words not formally accepted? Did the employer's inaction reasonably lead the employee to believe they were still employed? *This is no longer a speech act question.* The procedure ends here; the panel deliberates on fairness.

  5.  **Did the employee *withdraw* the resignation before completion?**
      *   *Test:* Only if Steps 1-4 all pass (a resignation was attempted, directed right, understood, *and* accepted), then: Did the employee clearly retract or withdraw their resignation *before* the employer completed Step 4 (accepted it)? The retraction must be clear and directed to the manager/HR.
      *   *Evidence:* Timing of retraction vs. evidence of employer acceptance. Clear words of retraction ("I take it back," "I don't want to quit," "I'm staying") directed to manager/HR.
      *   *Failure Consequence:* Resignation stands. (Reason: The performative act was completed).
      *   *Success Consequence:* Resignation is void. (Reason: The act was undone before completion).
      *   *Judgment Marker:* None. This is a timing/clarity fact test.

  **Translation & Simplifications:**
  *   **Kept:** Core Austin conditions - Convention (Right Authority), Intention (via Reasonable Understanding), Uptake (Understanding & Completion/Acceptance). Distinction between misfire (no act) and abuse (act defective but done - covered by Step 5 withdrawal). Void vs. Voidable (Steps 1-3 failure = void/no act; Step 4/5 issue = potentially voidable).
  *   **Collapsed/Dropped:** Detailed taxonomies of infelicities (misfires vs. abuses). Distinction between illocutionary force (the act itself) and perlocutionary effect (consequences like stopping work) - consequences are irrelevant to *whether* the act happened. Deep philosophical debate on "intention" - replaced entirely by "reasonable understanding" of the hearer, aligning with your standard and practicality. "Felicity conditions" simplified into the sequential tests.
  *   **Why Sparable:** Lay panel needs clear yes/no gates, not philosophical nuance. Focus on observable communication and institutional norms is sufficient and legally defensible. Intention is too subjective; reasonable perception is objective. Consequences are separate from the act of resigning.

  **Case Applications:**

  1.  **Case (a): Shouting Match**
      *   Step 1: **Yes.** "Fine, I'm done, I'm not doing this anymore" is a possible resignation attempt.
      *   Step 2: **Yes.** Said directly to supervisor.
      *   Step 3: **Likely No.** A reasonable manager in a heated shouting match *should* perceive "I'm done" as ambiguous emotional outburst, not a clear, immediate resignation. (Ambiguity due to context apparent to hearer). **Terminate: NO resignation.** (Panel might find this sympathetic outcome palatable).
      *   *(Steps 4 & 5 irrelevant)*.

  2.  **Case (b): "If nothing changes..." Message & Later Absence**
      *   Step 1: **No.** "If nothing changes I don't see the point of staying" is a *conditional future intention*, not an immediate resignation attempt. It's a complaint/threat. **Terminate: NO resignation.** (Employee stopped working later due to job abandonment/constructive dismissal, not a resignation speech act).

  3.  **Case (c): Told Colleagues in Break Room**
      *   Step 1: **Yes.** "Putting in my papers" is a clear resignation attempt.
      *   Step 2: **No.** Said only to colleagues, *not* to manager or HR. Colleague mentioning it later does not make them the "right authority" unless proven they had specific authority *to accept resignations* (unlikely). **Terminate: NO resignation.** (Manager completing the form based on hearsay doesn't make the original act valid).

  4.  **The Distasteful Case (Hypothetical Matching Step 3 Failure but Acceptance):**
      *   *Imagine:* Employee calmly tells manager in a 1:1 meeting, "I resign. I can't do this another day." Manager says "Okay," emails HR "X resigned effective immediately," processes paperwork. Employee returns 1 hour later saying "I didn't mean it, I was stressed."
      *   Step 1: **Yes.** Clear words.
      *   Step 2: **Yes.** To manager.
      *   Step 3: **Yes.** Reasonable manager hears clear words calmly delivered; no ambiguity. Understands as resignation.
      *   Step 4: **Yes.** Manager promptly accepts via email/action.
      *   Step 5: **No.** Withdrawal attempt (1 hour later) *after* acceptance/completion.
      *   **Result: Resignation stands.** Panel may find this distasteful if employee was genuinely stressed but appeared calm. **This is a defect of the *written standard*** focusing solely on the reasonable manager's understanding at the time, not internal intent or later regret. The procedure correctly applies the standard. A fairness override (Step 4 Judgement Point) isn't available here because Step 4 passed.

  **Case (d): Job Abandonment (No Utterance)**
  *   **Procedure Outcome:** The procedure has **nothing to say**. Steps 1 fails immediately ("No" utterance attempting resignation).
  *   **Limits Exposed:** The procedure *only* analyzes **utterances** intended as performative resignation acts. Abandonment is conduct, not a speech act.
  *   **Where Decision Must Go:** The panel must apply the **handbook policy** on job abandonment directly. This is a separate determination based on conduct (unauthorized absence + non-response), treated *as equivalent* to resignation *by policy*. The decision turns on facts of absence and non-communication, not linguistic analysis.

  **What the Procedure Cannot Do (Limitations & Errors):**

  1.  **Analyze Conduct Alone:** It cannot handle pure abandonment (Case d) or cases where resignation is inferred *only* from behavior (e.g., cleaning out desk without words). Relies on handbook policy for these.
  2.  **Assess True Intent:** It deliberately ignores the employee's internal state, relying solely on the reasonable manager's perception of the *words* at the *time*. This can lead to "unfair" outcomes if words were truly spoken in uncontrollable distress but appeared clear (like the distasteful hypothetical). **Error Direction:** Can find resignation where panel feels employee didn't "mean" it. *Systematic:* Favors employer perspective (reasonable manager) and textual clarity over subjective intent.
  3.  **Handle Ambiguous Culture/Context Well:** If an utterance is ambiguous *even to a reasonable manager* (Step 3), it fails. But subtle cultural or relational nuances might make an utterance *seem* clear to the manager when it wasn't intended that way. The procedure misses this depth. **Error Direction:** Can fail to find resignation in genuinely ambiguous cases, even if the manager reasonably (but mistakenly) thought it was clear. *Systematic:* Risk of inconsistency if panels interpret "reasonable manager" differently for subtle ambiguities.
  4.  **Resolve "Constructive Resignation":** Where an employee quits claiming the employer made conditions intolerable ("constructive dismissal"), the procedure *only* checks if the *act of quitting* was performed validly (Steps 1-5). It **does not** assess whether the *reason* for quitting makes it equivalent to a firing (constructive dismissal). That's a separate legal question beyond the speech act.
  5.  **Override Policy Fairness Deeply:** The Step 4 Judgement Point allows fairness review *only* if a resignation was understood but not accepted. It doesn't allow overriding a *completed* resignation (Step 5 failure) based on sympathy or later events. Deep fairness concerns about the *consequences* (UI, reinstatement) are beyond its scope; that's policy.

  **Use:** Follow the steps in order for each case. Stop at the first **Terminate**. Only reach the Step 4 **Judgment Point** if Steps 1-3 pass but Step 4 fails. Only do Step 5 if Steps 1-4 all pass. Document the rationale step-by-step per the findings above.
