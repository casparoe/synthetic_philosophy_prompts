prompt: |-
  I teach a graduate seminar on the epistemology of cosmological reasoning, and in assembling the readings I have found that I repeatedly need a concept I cannot locate named anywhere. I would be grateful for help determining whether one exists, and if not, for help carving it out properly.

  The instance that first fixed my attention is the fluctuation scenario in statistical mechanics: the worry that in a cosmos old enough, and near enough to thermal equilibrium, the combinatorial advantage of small departures from equilibrium over large ones makes it overwhelmingly likelier that any given observer with apparently rich memories is a momentary, randomly assembled one than an inhabitant of a genuinely ordered universe. I assume you recognise the scenario; my interest is not in it but in the structure it shares with quite unrelated arguments.

  That structure recurs. Consider the genealogical argument against the trustworthiness of normative belief: our evaluative dispositions were shaped by pressures bearing on reproductive success rather than on truth, so they carry no presumption of accuracy. Consider likewise the argument, often pressed against naturalism, that if one's convictions are wholly the upshot of prior physical causes, then none of them is held on account of being true, and one therefore has no ground for supposing that any of them, including this one, is true. And consider critical theories which treat all moral discourse as the rationalisation of interest, a treatment they must extend to their own deliverances if they are to be consistent. In each case the reasoning begins from entirely ordinary evidence, and ends by pronouncing that the process which supplied the evidence, and the process by which the argument itself is assessed, cannot be relied upon.

  What I want to know is whether this has a name. I have run through the candidates and each seems to me to fall short in a specific way, which is why I am not satisfied to file the thing under any of them.

  It is not a straightforward refutation of itself, in either the logical or the pragmatic sense, since nothing here is inconsistent: one can coherently assert both the theory and the unreliability of one's evidence for it. It is not the familiar global sceptical scenario, since there the sceptic offers no positive case for the hypothesis, and the hypothesis does not impugn the reasoning by which it was reached; here the theory is reached by precisely the reasoning it condemns, and it is the reaching that generates the trouble. It is not the paradox of self-inclusion in the manner of the liar, since no sentence here refers to itself. It is not mere circularity, since I am not employing a faculty to certify its own reliability; I am employing it to deliver a verdict against it. And it does not behave like an ordinary reason for abandoning a belief, because such a reason survives the abandonment and continues to do work, whereas this one is generated by the belief and evaporates the moment the belief is relinquished.

  The feature for which I can find no vocabulary at all is what the structure does over time. If I accept the conclusion, I must distrust the acceptance, since the distrust is warranted by the conclusion itself. But the distrust is likewise a product of the process under suspicion, so if I withhold the conclusion I have no warrant for the distrust either, and the original reasoning looks sound again. Belief, disbelief, and suspension each license a return to one of the others, and I cannot identify any attitude that survives scrutiny. My provisional and thoroughly unsatisfactory word for it is a wobble. I want to know whether there is an established term, in formal epistemology or in the cosmological literature or in metaethics, for an argument that leaves no stable doxastic attitude, whether or not every attitude it leaves is coherent. If the subfields use different words for what may be one phenomenon, I should like to be told whether it is in fact one phenomenon or several.

  I am not after a label alone, so please do not stop at one. I want the carving: conditions necessary and sufficient for something to count, and an explicit ruling on the boundary cases. Does partial undermining qualify, as when a theory implies that a third of one's convictions are false, or that one's reasoning is sound inside a specified domain and unsound outside it, and if so where is the line? Must the conclusion concern the theorist herself, in a self-locating way, or does a conclusion about agents generally suffice? If the theory enjoys support independent of the impugned process — instrumental success, mathematical coherence, third-person data — does that rescue it outright, partially, and to what degree of independence? Is a theory that predicts its own rejection by its users without impugning their evidence the same phenomenon or a distinct one deserving its own name? And does the phenomenon attach to a theory's being true, or only to its being well supported?

  Finally, if the honest verdict is that what I have described is no single phenomenon but a contingent conjunction of two familiar ones, please say so plainly and identify the two.
reasoning: |-
  Okay, the user teaches a graduate seminar on the epistemology of cosmological reasoning and needs help naming and defining a recurring argument structure they've noticed. Let me start by understanding their core examples. They mention the Boltzmann brain problem in cosmology, the genealogical argument against normative beliefs, arguments against naturalism, and critical theories that undermine their own basis. The common thread is that each argument uses a reasoning process to conclude that the same process is unreliable, creating a cyclical problem where no stable belief seems possible.

  First, I need to recall existing philosophical concepts. Self-defeating arguments come to mind, but those usually involve logical inconsistency. Here, the arguments are coherent but practically problematic. The user already ruled out standard skepticism, liar paradoxes, and circularity. Their key point is the "wobble" effect—adopting the belief undermines it, but rejecting it removes the grounds for distrust. This sounds similar to the problem of "self-undermining" theories, which is a recognized issue in epistemology.

  The term "self-undermining" is used in contexts like evolutionary debunking arguments or critiques of naturalism. For example, Sharon Street's work on evolutionary ethics argues that if moral beliefs are shaped by evolution, they might not track truth, but then that same reasoning applies to her own argument. This aligns with the user's description. But is "self-undermining" sufficient? The user wants a specific term for the dynamic instability it causes. "Self-undermining" captures the structure, but the cyclical instability might need additional specification.

  Another angle is the distinction between local and global undermining. If a theory only partially undermines itself (e.g., affecting some beliefs but not others), does it still qualify? The user's examples seem globally undermining, targeting the entire reasoning process. For instance, the Boltzmann brain scenario questions all memories and observations. The genealogical argument challenges all normative beliefs. So perhaps global self-undermining is key here.

  The user also asks about independent support. If a theory has external validation, does that resolve the wobble? For example, if instrumental success supports a theory despite its self-undermining aspects, maybe the instability is mitigated. But in cases like the Boltzmann brain, even scientific evidence is questioned, so independent support might not fully solve the problem. This suggests that the phenomenon's core is the inescapable cyclical doubt, regardless of external evidence.

  Boundary cases: What if the theory doesn't target the theorist personally but agents in general? The user's examples involve self-locating elements (e.g., "my beliefs are unreliable"). However, theories that generally claim all reasoning is unreliable still implicate the theorist, so it might not be a strict requirement. The key is whether the undermining applies reflexively to the argument itself.

  Also, theories predicting their own rejection without impugning evidence—like a theory that says it will be unpopular but remains true. That seems different. The issue here is the evidence's reliability, not just the theory's acceptance. So such cases might not exhibit the same wobble.

  Is this one phenomenon or two? The examples share a reflexive structure causing doxastic instability. The common elements are: (1) a theory derived from a process, (2) the theory undermines that process, (3) this creates a cycle where belief and disbelief are unstable. Whether it's cosmology or metaethics, the structure is the same. Thus, it should be treated as a single phenomenon, though instances vary in specifics.

  Necessary and sufficient conditions: A theory T is self-undermining if (1) T is supported by evidence E, (2) T entails that the process producing E is unreliable, (3) T's conclusion applies reflexively to itself. The cyclical instability ("wobble") arises because accepting T discredits E, but rejecting T removes the basis for discrediting E. This dynamic is essential to the phenomenon.

  Terminology: "Self-undermining" is the closest established term. Adding "doxastically unstable" or "reflexively unstable" could specify the cyclical effect. But "self-undermining" is widely recognized in philosophy, so introducing a new term might not be necessary. Explaining the instability as a consequence of self-undermining might suffice for the seminar.

  In conclusion, the user's "wobble" is the practical effect of a self-undermining theory. While "self-undermining" names the argument structure, the resulting doxastic instability is its defining consequence. For the seminar, framing it as self-undermining with a focus on the cyclical instability would address their needs. They should clarify that the phenomenon spans fields but shares a core reflexive structure causing belief instability.
answer: |-
  Based on your meticulous description and ruling out of existing terms, the phenomenon you're identifying – characterized by its unique *doxastic dynamism* or "wobble" – is most precisely captured by the established philosophical term **"Self-Undermining Argument"** or **"Self-Undermining Theory."** While this term exists, your analysis highlights nuances often glossed over. It *is* a single phenomenon, manifesting across domains, defined by its reflexive instability.

  **Carving the Phenomenon: Necessary and Sufficient Conditions**

  A theory or argument T qualifies as **Self-Undermining** (in the specific, strong sense you describe) if and only if:

  1.  **Evidential Origin:** T is presented as being supported by evidence E (empirical, conceptual, logical, etc.), gathered or processed via some method or cognitive process P.
  2.  **Reflexive Condemnation:** T entails, or provides strong grounds to conclude, that P is systematically unreliable or untrustworthy *with respect to the domain relevant to T's own truth or justification*.
  3.  **Inescapable Reflexivity:** The condemnation in (2) applies reflexively to the specific instance of P that generated the evidence E supporting T itself. (T doesn't just condemn P *in general*; it condemns *this very use* of P that led to T).
  4.  **Instability Generation:** Accepting T on the basis of E (via P) rationally compels significant doubt about the reliability of P, thereby undermining the justification for accepting T. Rejecting or suspending judgment on T (because of the worry raised in (3)) removes the grounds for condemning P, thereby restoring the apparent prima facie justification for T provided by E via P. This creates the cyclical "wobble" where no stable doxastic attitude towards T (belief, disbelief, suspension) persists under rational scrutiny *because the evaluation itself relies on P*.

  **Key Implications of the Carving:**

  *   **Not Mere Contradiction:** (2) + (3) ensure the condemnation targets the *process* generating T's support, not necessarily T's content. T can be *coherently stated* (e.g., "All reasoning via process P is unreliable, including the reasoning producing this statement"). The problem is justificatory/doxastic instability, not logical inconsistency.
  *   **Beyond Global Skepticism:** Unlike standard skeptical hypotheses (e.g., Evil Demon), T is a *positive theory* derived using P, and its condemnation *specifically targets P*, the very process used to establish it. The skeptic offers no positive theory derived via the condemned process.
  *   **Distinct from Circularity:** It's not bootstrapping (using P to justify P). It's using P to *condemn* P, creating the instability loop.
  *   **The "Wobble" is Essential:** Condition (4) is the defining consequence. The phenomenon *is* this dynamic instability.

  **Ruling on Boundary Cases & Your Specific Questions:**

  1.  **Partial Undermining:** *Sometimes qualifies, but weakens the "wobble".*
      *   **Domain-Specific:** If T condemns P only outside domain D, but T itself belongs to D, it *is not* self-undermining in your strong sense (e.g., "Physics is reliable, but reasoning about morality is unreliable" – the physics reasoning supporting this claim isn't condemned). If T belongs to the condemned domain, it *is* self-undermining (e.g., "All non-empirical reasoning is unreliable" – asserted via non-empirical reasoning).
      *   **Fractional Undermining:** "T implies 1/3 of convictions from P are false" is generally *not* sufficient for strong self-undermining. It might create localized doubt but lacks the *global* condemnation of P needed to trigger the full reflexive instability loop *for T itself*. The specific evidence E for T might plausibly belong to the reliable 2/3. The "wobble" is dampened or absent.
      *   *Line:* The undermining must be sufficiently global and reflexive to directly target the justification for T itself via condemnation of the specific P-instance that produced E, creating the instability loop. Fractional or domain-restricted undermining typically fails this test.

  2.  **Self-Locating vs. General:** *Generally suffices, but self-locating emphasis clarifies the instability.*
      *   A conclusion condemning reasoning *for agents generally* (e.g., "Human cognitive process P is unreliable") inherently applies to the theorist *as a human agent* using P to reach that conclusion. The reflexive condemnation (Condition 3) holds. The "wobble" manifests when the theorist attempts to apply it to their own state. Explicit self-locating language ("*My* beliefs from P are unreliable") makes the reflexivity vivid, but the general form triggers the same instability for the theorist upon reflection.

  3.  **Independent Support:** *Mitigates but rarely eliminates the "wobble" entirely; degree matters.*
      *   **Outright Rescue?** Almost never. If the independent support S (e.g., instrumental success, mathematical coherence) is *also* processed or evaluated using P (the condemned process), the condemnation still applies to *how S is known or relied upon*. The "wobble" persists: Trusting S (via P) supports T; T condemns P, undermining trust in S (and thus T). E.g., Instrumental success of science relies on observations/memories condemned by the Boltzmann brain scenario.
      *   **Partial Rescue:** If S is compelling and *genuinely independent* of P – meaning S's justificatory force is perceived or accessible *without* relying on the outputs of P in a way condemned by T – it can anchor belief in T *despite* the self-undermining loop arising from E. However, the *argument from E* remains unstable. The theorist might believe T *because* of S, while acknowledging the argument from E via P is self-undermining and thus not the *reason* they believe T. The "wobble" is confined to the E-based justification.
      *   *Degree of Independence:* The key is whether S's justification *requires* trusting the specific outputs of P that T condemns. If S is something like a self-evident logical truth *grasped independently of P's fallible processes*, it offers stronger anchoring. If S relies on sensory data or memory (condemned by Boltzmann) or evolved intuition (condemned by genealogical arguments), it offers little escape.

  4.  **Predicting Rejection Without Impugning Evidence:** *Distinct phenomenon.*
      *   E.g., "This true theory will be rejected by most people because it's counterintuitive/complex." This might be an *unpopular* or *hard-to-accept* theory, but it doesn't impugn the evidence or reasoning process used to support *it*. There's no instability loop for the theorist who accepts it. It deserves its own label, perhaps **"Self-Stultifying Prediction"** (predicting its own rejection) or **"Epistemically Unpopular Theory."**

  5.  **Attaching to Truth or Support?** *Primarily to justification/support.*
      *   The phenomenon centers on the *rational justifiability* or *doxastic stability* of *accepting* T, given its origin and implications. A self-undermining theory *could* be true! (E.g., It might *be* true that we are Boltzmann Brains, but we could never be stably justified in believing it because the belief itself would be a random fluctuation.) The core issue is the *process of believing and justifying* T, not necessarily T's truth value. It's an epistemological, not metaphysical, phenomenon.

  **Is it One Phenomenon?** Yes. The core structure (Evidential Origin -> Reflexive Condemnation -> Doxastic Instability Loop) unifies the Boltzmann brain, genealogical arguments against normative beliefs/realism, arguments against naturalism (e.g., Plantinga's EAAN), and radical critical theories applied reflexively. The specific content of P (cosmological reasoning, evolved intuition, physical causation, ideological rationalization) varies, but the logical-epistemological structure causing the "wobble" is identical.

  **Terminology Recommendation:**

  *   **Primary Term:** **Self-Undermining Argument/Theory.** This is the established, widely understood term in epistemology, philosophy of science, and metaethics for arguments/theories that, when accepted, undermine the grounds for their own acceptance.
  *   **Specifying the Instability:** When emphasizing the unique "wobble" or dynamic instability you've pinpointed, qualify it as **Dynamically Self-Undermining** or **Reflexively Unstable.** This highlights Condition (4) as the defining consequence. You could say the argument creates a **Doxastic Instability Loop.**
  *   **Your "Wobble":** While not established, "doxastic wobble" is a vivid and accurate description of the *effect* and could be useful pedagogical shorthand within your seminar.

  **Conclusion:** You have precisely identified the well-known, cross-disciplinary phenomenon of the **Self-Undermining Argument.** Your key insight – its defining characteristic is the resulting *doxastic instability loop* or "wobble" where no attitude survives rational reflection – is a crucial refinement often underemphasized. The necessary and sufficient conditions above, with the rulings on boundary cases, provide a robust "carving" suitable for graduate-level epistemological analysis. This structure is indeed a single, pervasive challenge in cosmological reasoning, metaethics, philosophy of mind, and critical theory.
