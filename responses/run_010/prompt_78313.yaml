  2. The accounts aren't applied to the same trait in one argument; conflicts are dismissed as ambiguity, and the preferred account is used based on the conclusion.
  3. Any rule to choose between accounts is circular, relying on the very concept being debated.

  They've considered and rejected "merely verbal dispute," "pluralism," "motivated reasoning," and "ad hoc rescue." They want to know if there's an established term or if they need to coin one. They also have specific questions about whether conflicting verdicts are necessary and if the third component is essential.

  I need to recall philosophical concepts related to debate strategies. The pattern resembles how people selectively apply theories without addressing inconsistencies. The closest might be "equivocation" or "dialectical opportunism," but I need to check if those fit all three components.

  "Motivated reasoning" covers the first part but not the third. "Ad hoc rescue" fits the circular rules but not the unacknowledged switching. The user mentioned pluralism is a defended position, not this unacknowledged shifting. 

  Maybe "theory-laden selective application"? Or "dialectical cherry-picking"? But "cherry-picking" is too vague. The key is the unacknowledged switching between frameworks. So "covert framework-switching" could work. It emphasizes the hidden shift without admitting ambiguity.

  For the user's additional questions: Conflicting verdicts might not be necessary since the pattern can occur even when accounts agree, by not checking. The third component (circular rules) isn't essential but is a frequent symptom because any attempt to systematize the choice would expose the circularity.

  The user's deeper need is to accurately label this pattern to critique it in their paper. They need a precise definition to identify instances in literature. They might also want to highlight how this pattern hinders progress in the function debate. Ensuring the term captures the unacknowledged nature and the avoidance of adjudication is crucial.
answer: |-
  Based on your precise description, there is no single, established term specifically denoting *this exact three-component dialectical pattern* within the philosophy of science or argumentation theory. The pattern you've identified is a sophisticated and pernicious form of intellectual evasion that combines elements of several recognized fallacies/strategies without being fully captured by any one.

  **Proposed Term:** **Covert Framework-Switching (CFS)**

  **Real Definition (Necessary and Sufficient Conditions):**

  An instance of **Covert Framework-Switching (CFS)** occurs in a dialectical context concerning multiple, distinct theoretical accounts (A1, A2, ... An) when:

  1.  **Selective Application:** A speaker invokes account Ax *only* in contexts where Ax yields a conclusion desired by the speaker, and invokes account Ay (where y ≠ x) *only* in contexts where Ay yields a different conclusion desired by the speaker, avoiding contexts where both accounts would be applicable to the *same* case and yield conflicting verdicts *within the same argumentative thread*.
  2.  **Conflict Avoidance & Ambiguity Gambit:** When the potential conflict between Ax and Ay is explicitly raised concerning a specific case, the speaker deflects by asserting the accounts represent distinct, legitimate senses of a core concept (e.g., "function"), treating the case as failing to disambiguate, while *simultaneously* continuing to rely implicitly on the account (Ax or Ay) that supports their desired conclusion for *that specific case*.
  3.  **Unacknowledged Opportunism:** The switching between Ax and Ay is never presented or experienced by the speaker as a retreat, modification, or refinement of their position; it operates as an unstated, opportunistic tool for reaching pre-desired conclusions without resolving the underlying theoretical tension.

  **Carving the Phenomenon: What it is and is Not**

  *   **Is:** A dialectical *strategy* for defending intuitive judgments about specific cases while avoiding the burden of resolving fundamental theoretical conflicts between distinct accounts. It leverages the *existence* of multiple accounts opportunistically, not pluralistically.
  *   **Is Not:**
      *   **Merely Verbal Dispute:** While ambiguity is *invoked* (Component 2), CFS is not *about* the ambiguity itself. The disputants genuinely disagree on substantive conclusions about cases (e.g., *does* this trait have *this* function?) and use the accounts instrumentally to defend those conclusions. They aren't just talking past each other about word meanings; they are strategically selecting frameworks to win points.
      *   **Pluralism:** Pluralism is the *thesis* that both accounts are legitimate and needed for different explanatory purposes. CFS is the *practice* of using both accounts *without endorsing pluralism*, specifically to avoid theoretical conflict and defend case-specific intuitions. The pluralist openly acknowledges needing both frameworks; the CFS user invokes ambiguity tactically while implicitly treating one framework as "correct" for the case at hand.
      *   **Motivated Reasoning (MR):** MR is a *broad cognitive bias* encompassing Component 1 (favoring evidence/rules leading to desired conclusions). However, CFS adds specific dialectical maneuvers (Components 2 & 3): the systematic, *framework-level* switching, the deflection via ambiguity claims, and the lack of perceived retreat. MR explains *why* someone might engage in CFS, but CFS describes the *specific structure* of the evasion in this theoretical context.
      *   **Ad Hoc Rescue:** An ad hoc rescue *modifies* a theory to save it from a counterexample. In CFS, the *accounts themselves are not modified*. Instead, the speaker *switches* which unmodified account they apply, using the *existence* of the other account as a shield when challenged (Component 2). There's no "rescue" of a single theory; there's opportunistic deployment of whichever theory works.

  **Addressing Your Specific Questions:**

  1.  **Must accounts conflict *in the case at hand*?** No, it's not strictly necessary for CFS to arise. The pattern can occur just as readily where the accounts *could* conflict but haven't been checked, or even where they *agree* but the speaker opportunistically uses only one account that yields the desired verdict (fulfilling Component 1). The *avoidance* of checking for conflict in the same case is part of the pattern (implied in Component 1 and explicit in Component 2). The *potential* for conflict, and the strategic *avoidance* of triggering it unnecessarily, is key.
  2.  **Is the circular selection rule (Component 3 in your description) essential?** Not strictly essential to the core definition of CFS as defined above. However, it is a **highly frequent and logically consequent symptom**. Any attempt to formulate a *general rule* for choosing between the accounts (Ax or Ay) will inevitably run into circularity or rely on the very concepts the accounts are meant to clarify *because* the speaker using CFS hasn't resolved the fundamental conflict. The circular rule demonstrates the *intractability* created by CFS and the lack of a principled basis for the switching observed in Components 1 & 2. While a specific instance of CFS might not explicitly present such a rule, the *need* for one reveals the problem, and any attempt to supply one will likely manifest this circularity. It's a predictable companion, not the core phenomenon.

  **Why "Covert Framework-Switching"?**

  *   **Covert:** Emphasizes that the switching is unacknowledged as a strategic choice or retreat (Component 3). The ambiguity claim (Component 2) provides the "cover".
  *   **Framework-Switching:** Highlights the core action – moving between distinct theoretical accounts (historical vs. systems) as tools, not as commitments to be reconciled.
  *   It captures the essence: Using multiple theories not as complementary perspectives (pluralism), but as a concealed toolkit, selecting whichever one delivers the desired intuitive result in a given case while dodging the theoretical conflict that arises when they are both applied to the same case.

  This term and definition provide the precise carving you need to identify instances in the literature and critique this specific dialectical pathology in your paper. It distinguishes the phenomenon from near neighbors and isolates its core mechanisms of selective application, conflict avoidance via ambiguity claims, and unacknowledged opportunism.
