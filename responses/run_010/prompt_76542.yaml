prompt: |-
  I'm moderating a session of our department's speaker series. The guest defends an account of promissory obligation that reverses the usual order of explanation. On the standard picture, a promise creates a duty owed to the promisee, and her power to release you follows from the duty's being owed *to her*. My guest holds the opposite: what makes a promise binding is that it hands the promisee a standing power to withdraw the demand, so that being under a promissory obligation just is being subject to a demand someone else can extinguish. She is a non-conventionalist — no appeal to practices, rules, or utility — and she rejects assurance-based accounts on which promising is merely one way of generating expectations and reliance.

  Draft seven or eight questions for the session, each followed by one follow-up keyed to the answer she is most likely to give. Nothing generic; every question should turn on the mechanics of her view. At minimum, cover: (a) self-promises, where the release power sits with the person bound, and what survives of the obligation if she can simply let herself off; (b) promises that no one can release — made to someone who has since died or become incapacitated — and where the power goes in those cases; (c) why her release power isn't parasitic on a prior directed duty, which would flip her explanation back to the standard picture; and (d) promises to do something independently wrong, where the promisee's release seems unable to make the act permissible, so the limits on the power must be set from outside it. Leave room for one question that lets her say what her account explains better than the assurance-based alternative — the redundancy case, promising to do what one is already unconditionally required to do, looks like her best example — and close with a question asking what discovery would count against the view.
reasoning: |-
  Okay, the user is moderating a session for their department's speaker series. The guest has a unique take on promissory obligation that flips the standard model. Instead of promises creating a duty to the promisee, which gives them the power to release, she argues the power to release comes first. Being under obligation means being subject to a demand that someone else can cancel. The user wants seven or eight specific questions with follow-ups, avoiding anything generic and focusing on the mechanics of her view. They also specified four key areas to cover: self-promises, irrevocable promises, whether the release power depends on a prior duty, and promises to do wrong acts. Plus, there should be a question about how her view handles redundancy better than assurance-based accounts and one about what could falsify her theory.

  First, I need to unpack the guest's view clearly. Her core idea is that the obligation exists because the promisee holds a normative power to release the promisor. This is non-conventionalist, so no appeals to social practices or utility. She also rejects assurance-based views that focus on creating expectations. The questions need to probe the internal mechanics—how this power functions in different scenarios.

  For self-promises (a), the issue is that if someone promises themselves something, they hold the release power. But if they can just release themselves, does any real obligation exist? The follow-up should challenge whether this trivializes the obligation. Maybe the guest would say self-promises aren't genuine obligations, which raises questions about their nature.

  Irrevocable promises (b) involve cases where the promisee can't release, like if they're dead. Where does the power go then? The guest might argue the power is extinguished, leaving no obligation. But this seems counterintuitive—promises to the deceased often feel binding. The follow-up should push on this, asking how the obligation persists without a holder of the power.

  For (c), the key is avoiding circularity. The standard view says the duty comes first, then the power. If her release power presupposes a prior duty, her view collapses into the standard one. The follow-up needs to press on how the power creates the duty without relying on an existing duty.

  Promises to do wrong (d) is tricky. If the act is immoral, the promisee's release can't make it okay. So the release power must have external limits. The follow-up should explore how those limits are defined without invoking conventionalism or duties.

  The redundancy case is where her view might shine. Promising to do something you're already obligated to do seems pointless on assurance views but makes sense if it transfers release power. The follow-up should contrast this with assurance accounts.

  Ending with falsifiability tests what could disprove her theory. This forces her to define clear boundaries.

  I need to ensure each question is specific and digs into these mechanics. Avoid generic stuff. Also, balance the questions to cover all required areas while leaving room for the redundancy and falsifiability points. The user emphasized depth, so follow-ups must anticipate her responses and challenge them. Let me outline the questions to cover all points without overlap.
answer: |-
  Here are seven tightly focused questions probing the mechanics of her power-first account, each with a targeted follow-up anticipating her likely response:

  1.  **Question (Self-Promises):** Your account grounds obligation in the promisee's *external* normative power to release the promisor. How does this apply to self-promises? If I solemnly vow to myself to run daily, but I hold the power to release myself, doesn't this collapse the obligation into mere self-admonishment? What substantial "demand" survives if I can extinguish it at will?
      *   **Likely Answer:** Self-promises aren't genuine promissory obligations because they lack the essential transfer of *alienable* normative control; the "power" isn't meaningfully distinct from the agent bound.
      *   **Follow-Up:** If self-promises are categorically excluded because the power-holder *is* the subject, doesn't this imply that the *essence* of promissory obligation *requires* a distinct normative agent holding the release power? How, then, can the obligation itself be primary if it's definitionally dependent on this external power relation?

  2.  **Question (Irrevocable Promises - Death/Incapacity):** Consider a promise made to someone who subsequently dies or becomes permanently incapacitated before the obligation falls due. On your view, where does the normative power to release reside now? If the power is extinguished with the promisee, does the obligation dissolve? If not, who holds the power, and how does this avoid appealing to something like a "duty persisting in absence of the power"?
      *   **Likely Answer:** The power *is* extinguished with the promisee's capacity to exercise it, dissolving the specific promissory obligation. Any remaining "ought" stems from other sources (e.g., fidelity to the deceased's memory, general moral duties), not the promise itself.
      *   **Follow-Up:** This seems counterintuitive. Many feel a strong, specific obligation *persists* after the promisee's death (e.g., fulfilling a deathbed promise). If your account dissolves the promissory obligation entirely in these cases, doesn't it fail to capture this robust intuition? Doesn't this suggest the obligation might have a source *independent* of the currently exercisable release power?

  3.  **Question (Primacy of Power vs. Parasitism on Duty):** You reject the standard view that the directed duty is primary. But how do you block the charge that the normative power *you* describe is *itself* parasitic on a prior directed duty? Doesn't the very *concept* of "releasing someone *from an obligation*" presuppose the existence of that obligation *owed to you*? If not, what is the power a power *over*?
      *   **Likely Answer:** The power is primitive. It's the power to create a specific kind of normative vulnerability *by* handing over the release mechanism. The "obligation" just *is* this state of being normatively vulnerable to the promisee's decision. The power defines the obligation, not vice-versa.
      *   **Follow-Up:** Doesn't this risk circularity? You describe the obligation *as* "being subject to a demand someone else can extinguish." But "demand" here seems to imply a normative claim *on* the promisor *by* the promisee *prior* to the exercise of the power. If the "demand" only arises *after* the promise (the grant of power), what is the *content* of the power being granted? It seems the power must be a power over a *pre-existing normative space* related to the promisor's action.

  4.  **Question (Promises to Do Wrong - Limits of Power):** What happens when I promise you something independently morally wrong (e.g., to harm an innocent third party)? You grant me a release power, but surely your releasing me doesn't make the act permissible. How does your account explain the *limits* of the normative power transferred? Does the promisee genuinely possess the power to release me from the core moral prohibition, or only from a *promissory overlay*?
      *   **Likely Answer:** The release power is only over the *distinct, promissory* obligation incurred by the promise itself. It cannot override independent, weightier moral duties (e.g., prohibitions against harming innocents). Releasing me removes the *additional* reason provided by the promise, but the core prohibition remains.
      *   **Follow-Up:** This suggests the scope and force of the release power are externally constrained by background morality. Doesn't this imply that the promissory obligation (and the power over it) is not fundamental, but rather *supervenes* on or is *modulated by* a pre-existing normative landscape defined by duties independent of the power-transfer? Doesn't this background morality play the primary role in determining when an obligation *truly* binds?

  5.  **Question (The Nature of the Demand):** You characterize the obligation as "being subject to a demand." If the release power is primitive, what constitutes this "demand" prior to the promisee choosing *not* to release? Is it a genuine normative claim by the promisee, or merely the *potential* for such a claim if they choose to assert it by withholding release? If the latter, how is this different from mere prediction, and if the former, doesn't it presuppose a duty?
      *   **Likely Answer:** The "demand" is the normative *position* the promisor is in: they are required to perform *unless* the promisee exercises their power. It's the standing normative status created by the transfer of the release power, not a continuously asserted claim.
      *   **Follow-Up:** Doesn't describing it as a "demand" they are "subject to" imply an *active* normative burden imposed *by* the promisee, rather than just a conditional status? If the burden is genuinely normative (not merely predictive), doesn't its force depend on the promisee having a *right* to impose it, which sounds like a prior duty owed *to them*?

  6.  **Question (Redundancy & Advantage over Assurance):** You reject assurance-based views. One key problem for them is the "redundancy case": promising to do what one is already unconditionally required to do (e.g., not murder). Assurance views struggle to explain why this creates any *new* obligation. How does your power-transfer account explain the normative significance of such a promise? What distinct element does it add?
      *   **Likely Answer:** Even if I'm already required not to murder, by promising *you* not to murder, I grant *you* a specific normative power over that requirement *as it relates to me and you*. You now have the standing authority to release me *from the promissory incarnation* of that duty, creating a new, specific obligation *to you* that didn't exist before, even if the underlying act remains wrong.
      *   **Follow-Up:** This seems to posit a peculiar "layering" of obligations. If the core duty (not to murder) remains absolute and unalterable by you, in what concrete practical or normative way does my granting you this release power over the "promissory layer" actually manifest? If it changes nothing about what I must do or what you can rightfully demand, isn't this power illusory, making the promise still redundant?

  7.  **Question (Falsifiability):** What kind of empirical discovery or normative argument would you consider a strong challenge, or even a falsification, of your core claim that the normative power to release is explanatorily prior to and constitutive of promissory obligation, rather than derivative? What would genuinely undermine the primacy of the power?
      *   **Likely Answer:** A demonstration of a robust, non-circular account of directed duties (duties *to* someone) that explains promissory obligations *and* the release power as derivative *without* relying on practices, conventions, or assurance, showing the duty can be prior. Or, evidence of a clear, binding promissory obligation where the transfer of a release power is demonstrably absent or impossible (e.g., convincing cases against my view of death/incapacity).
      *   **Follow-Up:** If someone developed such a non-circular duty-first account, wouldn't Occam's Razor favor it over your power-first view, which also needs to explain the nature of the normative power itself? Doesn't positing a primitive normative power add complexity unless the duty-first view is demonstrably incoherent?
