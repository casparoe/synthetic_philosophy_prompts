answer: |-
  Below is a specification for an account of natural kinds capable of non-question-begging arbitration in live scientific disputes over category reality. The core constraint—**adjudicating without deferring to final theories, consensus, or either side's metaphysical commitments**—shapes every desideratum. Requirements that *only* make sense under this constraint are flagged with **{NQ}**. Fault lines are exposed throughout, especially in tensions between objectivity and utility, and in disguised verdicts.

  ---

  ### **I. Verdicts on Hard Cases**  
  *(Must return these without presupposing realism or anti-realism)*

  1. **"Jade" Case (e.g., nephrite vs. jadeite):**  
     - **Verdict:** The umbrella term "jade" denotes a *nominal kind* (interest-relative category) post-splitting.  
     - **Reasoning:** Prior to chemical analysis, "jade" was projectable for craft/appearance inferences. Post-discovery, it splits into two natural kinds (nephrite, jadeite) with distinct microstructures. The umbrella term survives as a practical category but lacks a unified causal essence. **Discovery** occurred—the old grouping misrepresented reality. **{NQ}**: Rejecting both "always real" (ignoring splitting) and "always nominal" (ignoring discovery).  

  2. **Gerrymandered Category (shared nature, no lawlike generalizations):**  
     - **Verdict:** *Not a natural kind*, despite shared microstructure.  
     - **Reasoning:** Natural kinds must underwrite *robust* inductions. If a category (e.g., "elements with atomic numbers 30, 47, and 79") shares a deep nature but predicts no non-trivial regularities, it is gerrymandered. Kinds require *projectability*, not just essence. **{NQ}**: Blocks essence-fetishism (e.g., microstructural essentialism).  

  3. **Cross-Disciplinary Category (e.g., "soil" in agronomy vs. geology):**  
     - **Verdict:** A natural kind *relative to a domain of inquiry*.  
     - **Reasoning:** Agronomy treats "loam soil" as a kind for crop-yield predictions; geology finds it useless for erosion modeling. Both describe identical substrates. The kind is real *for a specific explanatory context*—it carves a joint relevant to agronomic variables. **{NQ}**: Forces domain-relativity without collapsing into subjectivity.  

  4. **Institutional Category (e.g., "hazardous waste" threshold):**  
     - **Verdict:** A *real but non-fundamental* kind. Falls *inside* the theory's domain.  
     - **Reasoning:** Though enacted, it acquires causal powers (e.g., disposal costs, regulatory actions). Its reality is emergent from social-natural feedback loops. Not stipulative because its effects are measurable and counterfactual-supporting (e.g., "if not classified hazardous, disposal would differ"). **{NQ}**: Rejects excluding institutional kinds a priori.  

  5. **Historical Individual (e.g., "Homo sapiens"):**  
     - **Verdict:** A natural kind *if* it supports lawlike generalizations beyond historical tracing.  
     - **Reasoning:** If "Homo sapiens" licenses inferences about physiology, genetics, or disease susceptibility (despite genealogical uniqueness), it is a kind. If only useful for historical narrative (e.g., "originated in Africa"), it is a particular. **{NQ}**: Denies that historicity automatically disqualifies kind-status.  

  ---

  ### **II. Distinctions That Must Not Collapse**  
  *(Essential for parsing disputes)*  
  - **Real vs. Nominal:** Kinds mind-independently project; nominal categories project only via convention. **{NQ}**: Prevents anti-realists from reducing all kinds to nominal.  
  - **Fundamental vs. Special-Science:** Fundamental kinds (e.g., electrons) require universal laws; special-science kinds (e.g., species) require domain-specific regularities.  
  - **Objective vs. Interest-Relative:** Objectivity means joints exist independently; interest-relativity means *which* joints matter depends on context. **Fault line**: Tension here threatens NQ adjudication.  
  - **Kind vs. Particular:** Kinds support inductions; particulars (e.g., Earth) do not.  
  - **Discovery vs. Decision:** *Discovery*: Evidence shows a category misrepresents structure (e.g., jade). *Decision*: Pragmatic choice to prioritize new variables (e.g., reclassifying Pluto). Collapsing this excuses question-begging ("you didn't find truth, just chose utility"). **{NQ}**: Core to arbitration.  

  ---

  ### **III. Explanatory Burdens**  
  1. **Why some categories license inductions/counterfactuals:** Must explain how natural kinds ground modal stability (e.g., "if this were gold, it would conduct electricity").  
  2. **Why reclassification feels epistemic vs. pragmatic:** "Discovery" feels like uncovering structure (e.g., chemical analysis splitting jade); "decision" feels like boundary-moving (e.g., redefining planets). Account must link this to whether the *causal structure* was misrepresented.  
  3. **Grain of joints:**  
     - *One joint per kind?* No—kinds can be coarse-grained (e.g., "metal") or fine-grained (e.g., "isotope").  
     - *Must joints nest?* No—hierarchies (e.g., periodic table) are common but not necessary (e.g., ecology's non-nesting kinds).  
     **{NQ}**: Rejects accounts requiring a single "fundamental" grain.  

  ---

  ### **IV. Consistency Constraints**  
  Account must reconcile:  
  - **Idealized models** (e.g., frictionless planes) successfully tracking kinds, despite false assumptions.  
  - **Entrenched categories** having exceptions (e.g., flightless birds), borderlines (e.g., color spectra), and shifted extensions (e.g., "element" from earth/air/water to atomic species) *without* implying kind replacement.  
  **Resolution**: Kinds are *stable clusters of properties*, not essence-defined. Shifts reflect better approximation of clusters, not kind death. **{NQ}**: Blocks "no exceptions" demands that favor idealized essences.  

  ---

  ### **V. Meta-Analysis: Sorting Requirements & Exposing Fault Lines**  

  #### **Non-Negotiable vs. Prejudices**  
  - **Non-Negotiable (Arbitration-Focused)**:  
    - Cross-disciplinary kind-relativity (III.3).  
    - Distinguishing discovery/decision (II).  
    - Accommodating institutional kinds (I.4).  
    - Tolerating exceptions/shifting extensions (IV).  
    **{All NQ-grounded}**.  
  - **Prejudices of Camps**:  
    - *Microstructural essentialism*: Demand that "real" kinds *must* have immutable microstructures. **Disguised verdict**—already assumes scientific realism about physics. *Honest version*: "Kinds must have stable projectability anchors."  
    - *No interest-relativity*: Demand that objectivity requires complete mind-independence. **Disguised verdict**—favors fundamental-level realism.  
    - *Hierarchical nesting*: Requirement that kinds form taxonomies. **Prejudice** of systematic biology/physics reductionism.  

  #### **Joint Unsatisfiability**  
  **The triad below cannot be fully satisfied simultaneously**:  
  1. **Mind-independence** (joints exist objectively).  
  2. **Reliable inference** (kinds must support predictions).  
  3. **Interest-relativity of inference reliability** (which predictions matter depends on inquirer).  
  **Collapse**: Accounts hollow out **mind-independence** by making joints *response-dependent* (e.g., "joints are where our inferences work"). This preserves (2) and (3) but reduces (1) to "mind-independent *that* inferences work," not "mind-independent joints." *No extant account avoids this; the best re-ground mind-independence in causal structures that* enable *but do not dictate* projectability.  

  #### **Most Eliminative Requirement**  
  **Accommodating institutional kinds (I.4)** eliminates:  
  - Strict microstructural essentialism (denies social enactment can create kinds).  
  - Eliminative materialism (rejects special-science kinds).  
  - "Ideal science" approaches (dismiss enacted kinds as non-fundamental).  

  ---

  ### **Scorecard of Standard Accounts**  
  *(Against the surviving desiderata)*  
  - **Microstructural Essentialism** (e.g., Kripke/Putnam): Fails I.4 (institutional kinds), I.5 (historical individuals), II (collapses fundamental/special-science). **Virtue claim**: Demotes non-fundamental kinds—a **prejudice**.  
  - **Promiscuous Realism** (e.g., Dupré): Passes I.3 (cross-disciplinary), I.4, IV (exceptions). Fails II (blurs discovery/decision), III.1 (no explanation for failed inductions). **Virtue claim**: Pluralism—**non-negotiable** but overextended.  
  - **Pragmatism** (e.g., Boyd HPC): Passes I.2–I.5, IV. Fails III.1 (weak on counterfactuals), II (blurs objective/interest-relative). **Virtue claim**: Utility-focused—**non-negotiable** but risks hollowing mind-independence.  
  - **Grounding-Based** (e.g., Schaffer): Passes I.1, I.4, II (distinctions). Fails I.3 (domain-relativity), I.5 (historical individuals). **Virtue claim**: Metaphysical rigor—**prejudice** if demanding single fundamental grain.  

  ---

  ### **Fault Lines Exposed**  
  1. **Objectivity-Utility Tension**: The NQ constraint forces a tightrope walk: joints must be mind-independent *enough* to avoid conventionalism, but *interest-relative enough* to handle special sciences. Most accounts fall toward one side.  
  2. **Discovery/Decision Ambiguity**: In live disputes, the line between uncovering structure and pragmatic re-carving is weaponized. Any account risks smuggling in a verdict via how it defines "structure."  
  3. **Institutional Kinds as Litmus Test**: Accepting them rejects microphysical fundamentalism; rejecting them begs the question against social sciences.  

  This specification demands an account that is *metaphysically minimalist* (to avoid contested commitments) but *explanatorily robust* (to resolve disputes). No existing theory clears all hurdles unscathed—the unresolved core is whether "joints" are *causal nexuses* or *projectability enablers*.
