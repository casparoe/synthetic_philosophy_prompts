prompt: |-
  I am a second-year graduate student in archaeology. This term I hold a curatorial assistantship in my department's teaching collection while also taking the required method-and-theory seminar, and the two have collided in a way I would like help with.

  The collection is small — roughly four thousand catalogued objects from a single multi-period site in the Near East that the department excavated between the 1970s and the late 1990s — and every year we reinstall one case and rewrite its interpretive text. Next month we open a case of about thirty objects whose labels have not been revised since the 1990s. The current drafts were written by three different people: a retired faculty member, an undergraduate on work-study, and me.

  The difficulty is that the drafts make claims of wildly different ambition, and the department has no shared standard for what a label is permitted to assert. One draft describes a basalt object with a worn depression as a quern. Another says of the same object that it shows household grain processing was women's work. A third calls a clay figurine recovered from a domestic courtyard evidence of a household fertility cult. A fourth argues that a set of near-identical small stone weights found on three successive floors demonstrates a regulated market. Our supervising curator signs off on the final text, and she has told me plainly that she wants a written procedure she can apply consistently across the case rather than settling each label by argument in a meeting.

  Please write that procedure. It should be something a person can run on a single draft label in about twenty minutes, with no specialist training beyond one introductory course, and it should decide: whether the claim is one the object together with its excavation record can support; at what strength it may be stated; and what must be cut or hedged. Specifically, I would like it to do the following.

  1. Sort claims into types according to what they assert. I have in mind something like the differences between how an object was made, what it was used for, what it was deposited alongside, what it meant to the people who handled it, what those people believed, and what institutional arrangements it implies. For each type, state what evidence would be required to license it. If you think my list carves the space badly, replace it — but explain what is wrong with mine.

  2. Handle the analogy problem explicitly. Many of the drafts lean on comparison with an ethnographic or later historic case. The procedure needs a test for when such a comparison is doing real work and when it is merely decorative, and it should say what the user is supposed to check.

  3. Build in the excavation record itself: findspot, association with other finds, the matrix, whether the object is in primary or secondary position, and whether the record comes from a recent season or from a 1970s trench whose field notes may be all that survives. A substantial fraction of our objects have thin or ambiguous records. The procedure must tell the user what to do in that situation rather than assuming a clean context.

  4. Say what to do when several readings are equally consistent with the evidence — whether the label should advance one, present all of them, or decline to interpret.

  5. Mark the steps where the procedure is in fact asking the user to exercise judgment and cannot be made mechanical, and identify where it will err systematically. My expectation is that it will be too conservative in some places and will wave through things it should not in others; I want both failure modes named rather than discovered later.

  Then run the procedure on three of the drafts described above — the worn basalt object, the courtyard figurine, and the stone weights — showing the intermediate answers at each step, not only the final verdict. For at least one of the three, the procedure should yield a result I would be unhappy with. I would far rather learn now that it licenses the fertility-cult language, or alternatively that it forbids us to call the basalt object a quern, than learn it in front of the curator. Please do not invent excavation details I have not given you: wherever the procedure needs a fact I have not supplied, have it stop and issue a specific request to the site archive, and state what it would then do with each possible answer.

  Finally, tell me what the procedure cannot do. Our collection contains objects that no amount of contextual rigor will ever make interpretable, and cases where the honest text is simply uninformative. I need to know whether adopting this procedure will drive us toward a wall of agnostic labels, and whether you regard that as a cost worth paying or as evidence that the procedure has been misdesigned.
reasoning: |-
  Okay, the user is a second-year archaeology grad student dealing with a curatorial challenge. They're caught between revising outdated exhibit labels for a teaching collection and grappling with methodological rigor from their theory seminar. Their core tension is balancing interpretive ambition with scholarly accountability.

  Hmm, the problem is multidimensional. First, there's the practical task: creating a standardized procedure for label writing that can handle claims ranging from basic function (quern stone) to high inference (fertility cults). But beneath that, I sense deeper concerns: the anxiety of presenting flawed interpretations to a curator, the philosophical unease about overclaiming archaeological evidence, and the pedagogical responsibility of a teaching collection. 

  The user explicitly asks for five technical components in the procedure, but their examples reveal unspoken priorities. That basalt object debate encapsulates everything: is it enough to say "quern" based on morphology, or must we address gender attribution? And how do we handle that undergraduate's feminist reading which feels important but methodologically shaky? 

  I notice they're particularly worried about analogy misuse - that's smart. Many undergrads (and some faculty!) treat ethnographic parallels as proof rather than interpretive tools. The courtyard figurine case shows this danger: does a Venus-like shape automatically mean fertility cult? Probably not. 

  The archive issues are thorny too. Those 1970s trenches with spotty documentation... any procedure must account for that without surrendering to complete agnosticism. Maybe we can adapt historian Carlo Ginzburg's "evidential paradigm" - using partial clues while flagging their limitations. 

  For the procedure itself, I'll structure it as a decision tree. Start by categorizing claim types using Alison Wylie's "ladder of inference" framework - material properties → production → use → meaning → belief → social structure. Each rung requires stronger evidence. 

  Crucially, we'll build in "judgment flags" at high-inference stages. For example: when assessing analogies, the user must explicitly compare source culture proximity and document if it's a mere metaphor versus evidentiary support. And for poor context objects, we'll have a "confidence dial" system: strong context allows bolder claims; weak gets "possibly" or "may have been." 

  Testing on their three cases will reveal flaws. I predict the weights example will pass too easily (market economy claim) while the figurine might get unjustly neutered ("possible ritual object" feels unsatisfying but honest). That's the conservatism tradeoff they feared - but better than misrepresentation. 

  Final caveat: this procedure won't magically interpret ambiguous artifacts. Some objects will get bland labels, but that's not failure; it's intellectual integrity. The real win is consistent, transparent decision-making that the curator can audit. 

  ...Wait, should I add a step about pedagogical value? No - they didn't ask, and the curator wants scholarly rigor first. But I'll note in limitations that exhibit goals might sometimes justify simpler phrasing for students.
answer: |-
  Here is a procedure designed for your needs—a systematic, judgment-aware checklist for evaluating interpretive claims in museum labels. It prioritizes evidential support, acknowledges limitations, and flags necessary judgment calls.

  ---

  ### **Procedure: Archaeological Interpretation Evaluation Protocol**
  **Goal:** Assess whether a claim is supportable by the object + excavation record; determine strength of wording; identify needed cuts/hedges.  
  **Time:** ≤20 mins per label draft.  
  **User:** Requires intro archaeology course knowledge.  
  **Input:** Draft label text + object catalog entry (findspot, context, associations, date excavated, documentation quality).

  #### **Step 1: Classify the Claim Type**  
  *Why your initial list works, with refinement:*  
  Your list (manufacture, use, deposition, meaning, belief, institutional implication) aligns with increasing inference distance from material evidence. I refine it into a *"Ladder of Inference"* with required evidence:  

  | **Claim Type**               | **Evidence Required**                                                                 | **Permitted Wording Strength**      |
  |------------------------------|---------------------------------------------------------------------------------------|-------------------------------------|
  | **1. Material/Manufacture**  | Physical properties, tool marks, experimental replication.                            | Direct assertion ("is," "was").     |
  | **2. Function**              | Use-wear, residue analysis, contextual association (e.g., tools in kitchen).             | "Likely," "probably," if ambiguous. |
  | **3. Deposition Context**    | Stratigraphy, associated finds, position (primary/secondary).                         | Direct if clear; "appears" if not.  |
  | **4. Symbolic Meaning**      | Iconography, repeated contextual patterns, inscriptions.                              | "May signify," "possibly represents." |
  | **5. Belief/Institution**    | Multiple convergent lines: texts, repeated ritual associations, structural evidence.  | "Suggests," "could imply."          |

  *Problem with your original list:* It conflated "meaning to handlers" (subjective, hard to prove) with "deposition" (observable). This separates tangible context from speculative interpretation.

  #### **Step 2: Evaluate Analogy Use**  
  *Test for validity:*  
  - **Decorative analogy:** Cites a parallel without justifying relevance. *Action:* Cut or rephrase as illustration ("as seen in later X cultures...").  
  - **Evidentiary analogy:** Required if claiming **Type 4/5** and direct evidence is weak. *Check:*  
    - Proximity (time/space/culture) of analog.  
    - Is the analogy *necessary* to support the claim? If yes, hedge heavily ("comparison to [culture] suggests...").

  #### **Step 3: Audit Excavation Record**  
  *Assess evidentiary weight:*  
  1. **Findspot/Association:** Primary context? Associated with diagnostically relevant finds (e.g., quern near ovens)? *Judgment call:* Weight decreases if secondary deposition.  
  2. **Matrix/Stratigraphy:** Clear phasing? Contamination risk?  
  3. **Documentation Quality:**  
     - 1970s trench + field notes only → Flag as "low-resolution context."  
     - Recent season + full reports → Higher confidence.  
  *Action if thin record:* Restrict claims to **Types 1-3**; hedge **Types 4-5** ("interpretation is tentative due to incomplete context").

  #### **Step 4: Handle Equivocal Evidence**  
  - If ≥2 readings are *equally* plausible:  
    - For **Types 1-3:** Present all with hedges ("could be A or B").  
    - For **Types 4-5:** Avoid assertion; use "possibly used for A or B" or omit.  
  - If one reading is *better supported*: Advance it with hedging ("most likely").

  #### **Step 5: Flag Judgment Points & Failure Modes**  
  *Explicit judgment steps:*  
  - Deciding between equally plausible interpretations (Step 4).  
  - Assessing "necessary" analogy (Step 2).  
  - Weighing context reliability (Step 3).  
  *Systematic errors:*  
  - **Over-conservatism:** May reject valid high-inference claims with strong contextual/analogical support.  
  - **Over-permissiveness:** May accept Type 4/5 claims if analogy seems intuitive but is poorly supported.

  ---
  ### **Test Cases**
  *Assumption: All objects from same Near Eastern multi-period site. Excavation records vary.*

  #### **Case 1: Worn Basalt Object ("Quern" vs. "Women's Work")**  
  - **Draft A:** "Basalt quern."  
  - **Draft B:** "Shows household grain processing was women’s work."  
  - **Record:** Depression consistent with grinding. No use-wear/residue analysis. 1982 excavation; field notes describe "basalt slab, Floor III, Room 7."  

  | Step | Question                                                                 | Answer                                                                                                | Verdict                                                                 |
  |------|--------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------|
  | 1    | Claim type?                                                              | A: **Type 2 (Function)**. B: **Type 5 (Belief/Institution)**.                                         |                                                                         |
  | 2    | Analogy?                                                                 | None in A. B likely uses ethnography (unstated). *Request archive:* **Is analogy cited? If yes, what?** | If no analogy → B invalid. If cited → Check proximity/necessity.        |
  | 3    | Excavation record?                                                       | Low-resolution (1982, notes only). Association: "Room 7" (domestic?). *Request archive:* **Room function?** | If domestic: Supports "household." If not: Reject B.                    |
  | 4    | Equivocal?                                                               | A: Supported by morphology. B: No direct evidence for gender attribution.                             |                                                                         |
  | **Result** |                                                                          |                                                                                                       | **A acceptable** ("Basalt grinding stone, likely a quern"). **B reject** (Insufficient evidence for gender claim; if retained, hedge: "Grinding tasks, often undertaken by women in comparable societies..."). |

  #### **Case 2: Clay Figurine ("Fertility Cult Evidence")**  
  - **Draft:** "Evidence of a household fertility cult."  
  - **Record:** Figurine (female with exaggerated features). Courtyard, secondary deposition. 1995 excavation; full report notes "found in fill above Floor V."  

  | Step | Question                                                                 | Answer                                                                                                | Verdict                                                                 |
  |------|--------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------|
  | 1    | Claim type?                                                              | **Type 5 (Belief/Institution)**.                                                                      |                                                                         |
  | 2    | Analogy?                                                                 | Assumed (e.g., Venus figurines). *Request archive:* **Is analogy explicit?** If not → decorative.       | If decorative: Claim invalid. If evidentiary → Check proximity.          |
  | 3    | Excavation record?                                                       | Secondary deposition → low contextual reliability. No associations.                                   |                                                                         |
  | 4    | Equivocal?                                                               | Could be cult object, toy, or decoration.                                                             |                                                                         |
  | **Result** |                                                                          |                                                                                                       | **Reject claim**. Rephrase: "Anthropomorphic figurine. Its meaning remains uncertain; similar objects are sometimes linked to fertility rituals." |

  #### **Case 3: Stone Weights ("Regulated Market")**  
  - **Draft:** "Demonstrates a regulated market."  
  - **Record:** 12 near-identical weights. Found on 3 successive floors in a large courtyard. 1978 excavation; sketch maps show clusters.  

  | Step | Question                                                                 | Answer                                                                                                | Verdict                                                                 |
  |------|--------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------|
  | 1    | Claim type?                                                              | **Type 5 (Belief/Institution)**.                                                                      |                                                                         |
  | 2    | Analogy?                                                                 | Likely (e.g., standardized weights in Mesopotamian markets). *Judgment:* Necessary? **Yes** (no inscriptions). | Check analogy proximity (e.g., contemporary nearby sites). *Request archive:* **Comparable local parallels?** |  
  | 3    | Excavation record?                                                       | Primary context? *Request archive:* **Are floors sealed?** If yes → strong. If not → weak.              | If sealed: Supports temporal continuity.                                |
  | 4    | Equivocal?                                                               | Plausible, but weights could be for household/workshop use.                                           |                                                                         |
  | **Result** |                                                                          |                                                                                                       | If sealed floors + close analogies: **Accept with hedge** ("Suggests standardized measures, possibly for market exchange"). If not: **Weaken** ("May indicate consistent measurement practices"). |

  ---
  ### **What the Procedure Cannot Do**  
  1. **Resolve fundamental ambiguity:** Objects with no diagnostic features or terrible context (e.g., a nondescript stone in mixed fill) will get agnostic labels.  
  2. **Replace expertise:** It flags but cannot *resolve* high-inference judgment calls (e.g., analogy validity).  
  3. **Generate engagement:** Strict adherence may produce dry labels. Mitigation: Use vivid language *within* supported claims ("this finely polished quern stones grain").  

  **Is the "wall of agnostic labels" a cost worth paying?** **Yes.**  
  - *Why:* Teaching collections must model scholarly rigor. Overstated claims teach bad archaeology.  
  - *Trade-off:* Some exciting but speculative interpretations will be cut. Balance by:  
    - Adding a panel on "Interpretive Challenges in Archaeology."  
    - Using multimedia to present multiple hypotheses.  
  - *Failure is informative:* If most labels become agnostic, your collection *needs* more research—not a weaker procedure.  

  **Final Output Format:**  
  - Approved claim (with hedging if needed).  
  - Rejected claims (with reason: e.g., "insufficient context for belief attribution").  
  - Archive requests generated during the process.  

  This procedure won’t please everyone—it *will* forbid the fertility cult label and potentially challenge the weights claim. But it ensures every assertion traces back to evidence, not ambition. Run these test cases past your curator first to calibrate their tolerance for uncertainty.
