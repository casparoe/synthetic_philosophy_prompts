  First, Frege's response to Russell's paradox. He kept insisting arithmetic is logic even after his Basic Law V collapsed. That shows his commitment to logical foundations despite setbacks. For CH, he'd likely demand a sharp concept of "set" before accepting any truth value. The independence results might reinforce his view that consistency alone isn't enough—meanings matter.

  Second, his critique of Hilbert. Frege hated the idea that axioms could create meanings through consistency. Since ZFC and ZFC+CH are both consistent but conflict, he'd see this as proof that formalism fails. The concepts need determinate content first.

  Third, his third-realm platonism. Thoughts exist independently, but epistemic access is tricky. With CH's independence, Frege might worry that if we can't access the truth, it could undermine platonism. Yet he'd probably argue that our limitations don't affect the existence of a truth value—if the concept of set is fixed.

  Fourth, the late manuscript questioning logic as the sole source of arithmetic knowledge. This is crucial. If he moved toward geometric/temporal sources, he might see CH's vagueness as stemming from inadequate conceptual grounding. Here, the user's hunch about him joining Feferman's camp seems plausible: Frege might argue CH lacks sense until we refine "continuum" beyond current formalisms.

  Putting it together: Frege would reject the idea that CH has a truth value now. His later views suggest that without a sharp concept (possibly needing non-logical sources), the question is indeterminate. The independence results would be a vindication against formalism but a challenge to platonism's epistemology. He'd likely side with Feferman, seeing the continuum as indefinite, but for conceptual rather than constructivist reasons.

  Tensions exist between his platonism and his later epistemological doubts. Resolving them, he might prioritize conceptual determinacy over ontological commitment, using the late manuscript as a pivot. Where direct evidence is lacking, I'll note extrapolation—especially regarding how he'd view modern set theory's foundations.
