  ### Game Design: The Threshold Coordination Game

  #### **Rules and Setup**
  - **Players**: 18 students.
  - **Rounds**: Two rounds (Round 1: Symmetric; Round 2: Symmetry broken privately).
  - **Actions**: Each player chooses **X** or **Y**.
  - **Payoff Scheme (Points, no real money)**:
    - **Choosing X**: Always get **2 points**.
    - **Choosing Y**: 
      - Get **5 points** if **at least 16 players** (including yourself) choose Y.
      - Get **0 points** if fewer than 16 choose Y.

  #### **Materials**
  - **Slips of paper** for each player (labeled Round 1 and Round 2).
  - **Private instructions** for a subset (for Round 2, on small sealed notes).
  - **Whiteboard** to display results after each round.

  #### **Procedure**
  1. **Round 1 (Symmetric Game)**:
     - Distribute Round 1 slips.
     - Instruct: *"Choose X or Y. Your payoff depends on your choice and the total choices of the group, as per the rules above."*
     - Collect slips, count choices, and announce:
       - Total players choosing Y.
       - Payoffs:  
         - X-choosers: 2 points.  
         - Y-choosers: 5 points if Y ≥ 16; 0 otherwise.

  2. **Round 2 (Symmetry Broken)**:
     - **Before distributing slips**, privately hand sealed notes to **4 randomly selected players**.  
       - Note: *"SECRET: In Round 2, you MUST choose X. Do not reveal this."*  
     - Distribute Round 2 slips to all players.  
     - Instruct: *"Choose X or Y again, same rules as Round 1."*  
     - Collect slips, count choices, and announce:  
       - Total players choosing Y.  
       - Payoffs (same as Round 1).  
     - **Reveal the twist**: *"In Round 2, 4 players were secretly instructed to choose X. They had no choice."*  

  ---

  ### **Predicted Outcomes & Philosophical Debrief**
  #### **Round 1: Symmetric Game**  
  - **Predicted Behavior**:  
    - Superrational reasoning: "If everyone reasons identically, all will choose Y (since 5 > 2), so I should choose Y."  
    - Risk-averse reasoning: "Y is risky (needs 16/18 players). X guarantees 2 points."  
    - **Likely outcome**: Mixed choices. Fewer than 16 choose Y → Y-choosers get 0, X-choosers get 2.  
      - *Why?* Students default to Nash-like reasoning ("Can I trust 15 others?"). Superrationality is ignored.  

  - **Debrief: The Superrational Wager**  
    - **Philosophical Question**: *Does rational symmetry justify assuming identical choices?*  
      - Superrationality: "My choice of Y is evidence that identical rational agents will also choose Y."  
      - Criticism: "This confuses *causation* (my choice doesn’t force others) with *evidential reasoning* (I infer others’ choices from my own)."  
    - **Lesson**: Superrationality fails if players don’t commit to the diagonal (all-Y). Even then, it’s fragile.  

  #### **Round 2: Symmetry Broken**  
  - **Predicted Behavior**:  
    - Non-fixed players (14) may still choose Y, expecting symmetry: "If everyone reasons as I do, we’ll get 14 + 4? Wait, 14 < 16 → Y pays 0."  
    - Fixed players (4) choose X → max possible Y is 14 (<16).  
    - **Outcome**: All Y-choosers get 0; X-choosers get 2.  

  - **Debrief: The Fragility of Symmetry**  
    - **Philosophical Question**: *What if symmetry breaks without warning?*  
      - Superrationality assumes identical players, but hidden asymmetries (e.g., private instructions) void this. Players reasoned diagonally (all-Y) in a non-diagonal world.  
      - **Charge reinforced**: Superrationality treats your choice as *evidence* for others’ choices. But if asymmetries exist, this evidence is misleading.  

  ---

  ### **Why This Game?**
  1. **Avoids Prisoner’s Dilemma (PD)**:  
     - PD’s "cooperation" is obvious. Here, **Y is not inherently cooperative**—it’s a high-risk/high-reward bet on group coordination.  
     - Finding the diagonal optimum (all-Y) requires calculating payoffs: all-X (2) vs. all-Y (5).  

  2. **Diagonal Optimum ≠ Obvious "Cooperation"**:  
     - X seems "safer," Y seems "greedy but fragile." No moral overtone forces Y as "cooperative."  
     - Forces enumeration: Players must compare symmetric outcomes (all-X vs. all-Y) to see all-Y is best.  

  3. **Symmetry Break Subtle**:  
     - Private instructions to 4 players simulate hidden asymmetries (e.g., irrational players, external constraints).  
     - Players discover *afterward* that superrationality’s core assumption (identical agents) was violated.  

  ---

  ### **What Predictably Goes Wrong (First Run)**  
  1. **Round 1 Fails**:  
     - Most choose X (safe). Fewer than 16 choose Y → Y-choosers get 0.  
     - *Why*: Students distrust superrationality (default to individual risk-aversion).  

  2. **Round 2 Confusion**:  
     - Non-fixed players choose Y (hoping for symmetry), get 0.  
     - Post-revelation: "We assumed identical reasoning, but 4 players weren’t free!"  

  ---

  ### **Limitation of the Game**  
  - **Cannot Reproduce**: *Why superrationality might feel "necessary."*  
    - In PD, Nash equilibrium (defect) is suboptimal; superrationality justifies cooperation. Here, all-Y is a Nash equilibrium (if all choose Y, no one benefits by switching).  
    - **Missing Tension**: The game doesn’t force a conflict between Nash and superrationality. It only shows superrationality’s *fragility*, not its potential to outperform equilibrium.  

  ### **Instructor Script**  
  - **Post-Game Questions**:  
    - *Round 1*: "Who chose Y? Did you assume others would too? Why did symmetry fail?"  
    - *Round 2*: "Did you suspect hidden asymmetries? How does this challenge treating your choice as evidence?"  
  - **Key Insight**: "Superrationality isn’t about forcing coordination—it’s a wager that rational symmetry justifies the diagonal. But if the symmetry breaks, it collapses."  

  This game forces students to *live* the superrational gamble—and its pitfalls—making abstract theory visceral. The broken symmetry round exposes how easily the wager fails, deepening skepticism while clarifying the view’s core assumption.
