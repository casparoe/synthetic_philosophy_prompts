  (a) **Three-Player Games**: The equivalence between "never a best response" and "dominated by a mixture" breaks in games with ≥3 players. A strategy can be never a best response but not dominated if opponents' strategies are correlated.  
  (b) **Key Payoff Feature**: The middle strategy's payoff is lower than a weighted average of extremes against all opponent moves. If perturbed (e.g., M1=4 when B plays M2), it may not be dominated.  
  (c) **Escape Hatch?**: If players cannot commit to mixtures, the case still holds—the hedge is never a best response to any belief (pure or mixed), making it rationally rejectable.  

