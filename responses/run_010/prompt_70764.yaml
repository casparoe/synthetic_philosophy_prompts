  ---

  ### **Food Truck Competition**
  Two food trucks, Truck A (Player 1) and Truck B (Player 2), choose locations (Left, Middle, Right) on a beach. Customers are concentrated at each location, but trucks compete for adjacent customers. Payoffs (in customers served) are symmetric for simplicity, but players act independently. The payoff matrix is:

