prompt: |-
  You're a philosopher of mind who's argued both sides of the consciousness debate and who's unusually good at spotting question-begging. I'm drafting a review piece on illusionism about phenominal consciousness, and right now my notes are just a pile of objections, half of which I suspect are worthless. Before I write a word of it, give me the spec: what would an illusionist theory actually have to deliver to count as adequate — where adequate means good enough that a cognitive scientist could accept it without feeling she's been cheated out of something.

  Go through the candidate requirements one at a time. For each, give the case or consideration behind it, then mark it as non-negotiable, as a preference of the realist camp, or as smuggling (only looks like a requirement because it presupposes the qualia the theory denies). At minimum get these in the mix: what's left over — what still seems phenomenal to a fully convinced illusionist when she stubs her toe, given that she's meant to have no reason to think anything is; the asymmetry between appearance and judgement that makes ordinary illusions work and that seems missing here; the demand that the theory explain why we talk and argue the way we do; and the self-undermining charge. Say plainly which subset of them you think can't be jointly satisfied, and which single one does most of the excluding.

  Brainstorm a bit out loud before the list, think carefully, and write it in British English. A table's fine for the marks.
reasoning: |-
  Okay, the user is drafting a review on illusionism about phenomenal consciousness and needs help distinguishing strong objections from weak ones. They want a clear specification of what an illusionist theory must deliver to be considered adequate by cognitive scientists. 

  First, I need to unpack what "adequate" means here. The user emphasizes that cognitive scientists shouldn't feel "cheated out of something" - so the theory must fully account for subjective experience without residual mystery, while avoiding question-begging realist assumptions.

  Hmm... the user specifically flags four key issues: (1) the residual "what's left over" problem, (2) the appearance-judgment asymmetry puzzle, (3) explanatory demands about our discourse, and (4) the self-undermining charge. These are excellent focal points because they target illusionism's trickiest spots.

  *Scratches head* The core tension is this: Illusionism claims phenomenal properties don't exist, yet must explain why we're so convinced they do. Any requirement that says "but explain THIS phenomenal feature" might already beg the question by presupposing qualia. I'll need to filter those carefully.

  *Brainstorming*... For the "what's left over" requirement: When an illusionist stubs their toe, they still have an experience - just not qualia-laden. So the theory must explain that residual phenomenality as entirely cognitive/functional. Non-negotiable, but tricky if described in realist terms.

  Appearance-judgment asymmetry is fascinating. In standard illusions (e.g. Müller-Lyer), appearance persists despite judgment. But for consciousness itself... *pauses*... if judgment says "no qualia," why does it still feel like something? This might expose illusionism's weak spot. I suspect this does heavy lifting in excluding theories.

  The discourse requirement feels negotiable - any good theory should explain why we talk about qualia, but doesn't need to preserve realist intuitions. Whereas the self-undermining charge ("if consciousness is illusory, so is this thought") is lethal if unanswered. Must mark that non-negotiable.

  *Sighs* Honestly? The asymmetry problem might be the killer. If illusionism can't explain why the "feeling of qualia" persists after intellectual rejection, cognitive scientists will rightly feel cheated. That's probably the single biggest excluding factor.

  Final note to self: British English throughout. "Colour" not "color", "realise" not "realize". And table format for clarity.
answer: |-
  Right then, let's get this sorted. As someone who's wrestled in the mud with both realists and illusionists, the key is spotting where demands for 'explanatory adequacy' subtly sneak in the very thing illusionism denies – phenomenal properties or qualia. Illusionism posits that phenomenal consciousness *as ordinarily conceived* (intrinsic, private, ineffable qualia) is an illusion. The job is to explain *why it seems that way* using only non-phenomenal resources (representation, cognition, function). Cognitive scientists shouldn't feel cheated if the theory adequately explains *all the data and behaviour* associated with consciousness *without* positing magic dust, even if it contradicts their gut feeling. Here’s the spec, broken down:

  **Core Illusionist Tenet:** There is nothing more to the subjective feel of experience than certain types of information processing and access within cognitive systems. What we report as 'raw feels' or 'qualia' are actually judgments, representations, or meta-cognitive states misrepresented as simple, intrinsic properties.

  **Requirements Analysis:**

  | Requirement                                                                 | Case/Consideration Behind It                                                                                                                                                              | Classification             | Reasoning                                                                                                                                                                                                 |
  | :-------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Explain the Residuum ("What's left over?")**                           | When an illusionist stubs their toe, they report pain, wince, etc. *Something* seems phenomenally present, even after intellectual acceptance of illusionism. What is *that*, functionally? | **Non-Negotiable**         | The theory *must* account for the undeniable, immediate, qualitative character of experience as *subjectively reported and acted upon*. Failure leaves a gaping hole. Needs a functionalist account of "seemings". |
  | **2. Explain the Persistence of the Illusion**                              | Why does the 'feeling of qualia' persist even after one judges it to be illusory? In standard illusions (Müller-Lyer), the appearance yields to judgment. Here, the 'appearance' (qualia-feel) seems stubborn. | **Non-Negotiable** (But tricky) | This is crucial for adequacy. The theory must explain why the introspective *output* (the judgment "it feels raw/qualitative") is produced so robustly, even when the meta-cognitive judgment ("it's an illusion") is active. Failure makes illusionism seem descriptively inadequate. |
  | **3. Explain Discourse & Disagreement**                                     | Why do we talk *as if* qualia exist? Why do philosophers argue endlessly about them? Why the persistent intuition of an 'explanatory gap'?                                                 | **Non-Negotiable**         | A complete scientific theory must explain the behaviour (linguistic, argumentative) surrounding the target phenomenon. It needs a psycholinguistic/sociological account of "qualia talk" as a useful (but ultimately mistaken) folk construct. |
  | **4. Avoid Self-Undermining**                                               | If all conscious thought is illusory in its phenomenal character, does that include the thought "consciousness is an illusion"? Doesn't this undermine the rational grounding of the theory itself? | **Non-Negotiable**         | A fatal flaw if not addressed. The theory must consistently maintain that *judgments* and *cognitive states* are real, functional entities, even if their *phenomenal character as subjectively experienced* is misrepresented. The thought has content and causal efficacy, just not intrinsic qualia. |
  | **5. Explain the Subjectivity/First-Person Perspective**                    | How does the theory account for the undeniable fact that experiences are *for me*, private, and known in a unique way?                                                                     | **Non-Negotiable**         | Subjectivity is a core datum. Illusionism must explain it as a feature of information access (e.g., privileged access to internal states) and self-modelling, *without* needing private qualia. |
  | **6. Explain the "What It's Like" Character**                               | How does the theory account for reports of "what it is like" to see red or feel pain, if there's nothing it *is* like intrinsically?                                                      | **Preference (Realist Camp)** | Often smuggles qualia. Illusionism must explain the *report* and the *cognitive state* prompting the report. Demanding an explanation of the *intrinsic* "what-it's-likeness" itself usually begs the question. Explain the judgment, not the phantom property. |
  | **7. Close the Explanatory Gap**                                            | How does the theory bridge the perceived gap between physical processes and subjective experience?                                                                                        | **Non-Negotiable** (Reinterpreted) | The *explanatory gap* is a cognitive phenomenon to be explained (why does this gap *seem* unbridgeable?). Illusionism claims there *is no real gap* to bridge – only an illusion of one. Its job is to explain *that illusion*. |
  | **8. Preserve the Distinction between Conscious/Unconscious Processing**    | How does illusionism differentiate genuinely conscious states (which *seem* phenomenal) from unconscious ones, if not by actual phenomenality?                                             | **Non-Negotiable**         | A core scientific requirement. Needs a functional distinction (e.g., global availability, higher-order thought, self-modelling) that correlates perfectly with reports of phenomenality and explains why *those* states generate the illusion. |
  | **9. Account for the Richness & Grain of Experience**                       | How does the theory explain the fine detail and multimodal richness of experience (e.g., the visual field, subtle flavours) if not grounded in actual phenomenal properties?               | **Preference (Realist Camp)** | Can easily smuggle qualia. The requirement is to explain the *representational content* and *precision* of perceptual/cognitive states, and why this richness is reported as directly experienced. Don't confuse the report of detail with intrinsic detail. |
  | **10. Explain the Alleged Ineffability of Qualia**                          | If qualia are illusory, why do they *seem* so hard to describe?                                                                                                                           | **Non-Negotiable**         | The *seeming* ineffability is part of the illusion to be explained. Perhaps it arises from the misrepresentation of complex cognitive/representational states as simple, intrinsic properties. |

  **Key Tensions & The Excluder:**

  1.  **The Sticking Point:** The most significant tension is between **#1 (Residuum)** and **#2 (Persistence of the Illusion)** on one side, and the core illusionist denial of intrinsic qualia. The realist feels these *demand* an explanation pointing to something *more* than function/cognition – the very qualia illusionism denies. The illusionist *must* provide a convincing functional account of this persistent, resistant *seeming* that doesn't covertly reintroduce qualia.
  2.  **The Primary Excluder:** **#2 (Appearance-Judgment Asymmetry)** does the heaviest lifting in making illusionism feel inadequate or even incoherent to many. If the 'appearance' (the feeling of qualia) doesn't yield to the judgment (that it's an illusion) in the way standard illusions do, it *seems* like the 'appearance' must be grounded in something real and stubborn – genuine qualia. Explaining this persistent introspective output *without* invoking qualia is illusionism's greatest challenge. Failure here makes the theory feel like it's cheating – denying the very datum it needs to explain ("But it STILL *FEELS* like something!"). A cognitive scientist might accept that *some* aspects are illusory, but this asymmetry makes the *core claim* (no phenomenal properties *at all*) feel like it leaves the most salient feature unexplained.
  3.  **Self-Undermining (#4):** While potentially devastating if unaddressed, it's often resolvable by carefully distinguishing the *content* and *functional role* of thoughts (real) from their *alleged phenomenal character* (illusory). A well-constructed illusionism can navigate this.
  4.  **Smuggling Alert:** Requirements like **#6 ("What it's Like")** and **#9 (Richness/Grain)** are prime spots where realists unwittingly demand an explanation *of the illusory property itself*, rather than the mechanisms generating the illusion and the reports about it. Illusionism must resist this framing.

  **In Summary - The Adequacy Spec:**

  An illusionist theory is adequate (scientifically acceptable without cheating) if it:

  1.  **Provides a complete functionalist account of the Residuum:** Explains what *is* happening (cognitively, representationally, behaviourally) when we have an experience like stubbing a toe, such that it *seems* like there's something phenomenal "left over."
  2.  **Explains the Persistence:** Offers a compelling mechanistic account of why the introspective judgment "this state has intrinsic phenomenal quality" is produced so robustly and persistently, *even when* the meta-cognitive judgment "phenomenal qualities are illusory" is active. This is the hardest nut to crack.
  3.  **Explains the Discourse:** Provides a plausible evolutionary/cognitive/social account of why we have developed and use the concept of phenomenal consciousness/qualia, why debates about it persist, and why the explanatory gap *feels* compelling.
  4.  **Avoids Self-Refutation:** Clearly distinguishes the reality of cognitive states/judgments (including the judgment supporting illusionism) from the illusory nature of their *phenomenal character as introspected*.
  5.  **Explains Subjectivity/First-Person Access:** Accounts for the privacy and unique epistemic access of experience in functional terms (e.g., information access limitations, self-modelling).
  6.  **Explains the Seeming Ineffability:** Accounts for why experiences *seem* hard to describe fully.
  7.  **Provides a Functional Marker for Consciousness:** Offers a clear, non-question-begging functional criterion distinguishing conscious from unconscious states that aligns with reporting.
  8.  **Explains the Seeming Explanatory Gap:** Shows why the intuition of a hard gap between physical processes and subjective experience arises naturally from our cognitive architecture.

  **The realist's feeling of being "cheated" will primarily stem from an unconvincing account of Requirements #1 and #2.** If illusionism can deliver a plausible, mechanistic explanation for why the *illusion of phenomenality* is so utterly compelling and resistant to intellectual correction, using only standard cognitive/neural resources, then it meets the scientific adequacy test. The cognitive scientist might still *personally feel* the pull of qualia realism, but she couldn't rationally claim the theory had failed to explain the *phenomena* as scientifically accessible. The challenge is making that account feel satisfyingly complete for the stubborn, persistent "what-it's-likeness" that constitutes the Residuum and fuels the Asymmetry. That's where the battle is truly won or lost. Good luck with the piece – watch out for those question-begging intuitions!
