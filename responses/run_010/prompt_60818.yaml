    > "For any fixed fractional betting strategy *f* ≠ *f_Kelly* in a repeated multiplicative i.i.d. gamble, the Kelly strategy with *f_Kelly* yields a higher asymptotic growth rate. Consequently, as the number of periods *T* → ∞, the Kelly bettor’s wealth exceeds that of the non-Kelly bettor with probability one, and the ratio of their wealths diverges exponentially."  

