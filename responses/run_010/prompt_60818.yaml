  ### Response to First Question  
  The charge that maximizing the expected logarithm of wealth is equivalent to assuming logarithmic utility is mathematically correct but interpretationally distinct in ergodicity economics. The program escapes the objection *in part* by reframing the criterion as a dynamical imperative rather than a psychological preference. In expected utility theory (EUT), logarithmic utility reflects a subjective curvature of preferences over wealth. Ergodicity economics, however, derives the Kelly criterion (maximizing the expected log growth rate) from the non-ergodicity of multiplicative wealth processes: it arises as the unique rule that maximizes the long-run time-average growth of wealth for a single trajectory. The logarithm here is not a utility function but a mathematical transform that linearizes multiplicative dynamics, converting a non-ergodic process into an ergodic one where time and ensemble averages align. Thus, while the functional form coincides with EUT’s log utility, the justification is ontological (stemming from the structure of the wealth process) rather than psychological. This does not negate the equivalence but relocates its basis from preferences to system dynamics. The escape is partial because the criterion still implies a specific objective (long-run growth dominance), which may not align with all agents’ goals (e.g., short-run survival).  

  ### Response to Second Question  
  Labeling your advisor’s policy as "strictly irrational" is defensible *only within the ergodicity economics framework*, where rationality is defined as maximizing long-run growth. In this specific gamble, with known i.i.d. odds and infinite horizon, Kelly (f≈0.42) dominates any fixed fraction f≠0.42:  
  - **Your correct claims**:  
    - Over many periods (e.g., 100), Kelly maximizes the median and modal terminal wealth.  
    - The probability your advisor finishes ahead of you vanishes as periods grow.  
