prompt: |-
  I want the desiderata first, before I read any of the actual proposals: what does a rule for how much to stake on a repeatable, multiplicative bet have to deliver? Give me the properties any adequate account of bet-sizing has to have, each with the case or consideration behind it. I'm after the ones people tend to skip -- what it says when the bet can only be taken once, when the horizon is long but finite rather than infinite, when you dont know the true odds and only have an estimate of them, whether it has to be dynamically consistent (what you'd stake now vs. what you'd stake after a win, with no reason to want to revise the plan), and what it owes someone who says they don't care about their wealth in 40 years, only about the next decade. The bar I'm setting is "good enough to hand to something that actually has to survive," not "an elegant account of rationality in the abstract."

  Settle one thing along the way. Some people claim that maximizing the long-run growth rate of your wealth is a utility-free standard -- that it makes subjective utility functions unnecessary because it falls out of the dynamics of the gamble itself. Others say that's log utility wearing a trenchcoat. Genuine fork or verbal dispute, and which of your desiderata decides it?

  Then flag any pair of requirements you think can't both be satisfied, and name the single one that eliminates the most candidate rules. Don't survey the literature unless some particular entry is doing work on some particular desideratum.
reasoning: |-
  Okay, let me tackle this user's query. They want desiderata for bet-sizing rules before seeing proposals. The key points are repeatable multiplicative bets with specific edge cases. 

  First, I need to cover the unspoken needs. The user mentions real-world survival, not abstract rationality. That means focusing on robustness: unknown odds, finite horizons, revision-proof strategies. They also want resolution on the log utility debate. 

  For desiderata, I start with what any rule must handle. No-free-lunch is obvious but foundational. Then terminal wealth matters for finite cases. The rule must work with estimated odds, not just true probabilities. Dynamic consistency is crucial - no second-guessing after wins/losses. Short-term focus needs accommodation via compounding windows. 

  The log utility debate... hmm. Both sides have merit. The growth rate maximization is utility-free in derivation but equivalent to log utility in form. The finite horizon desideratum shows they converge practically. 

  Conflicting requirements? Terminal wealth focus clashes with strict survival in volatile strategies. Limiting bets to avoid ruin often conflicts with aggressive growth goals. The "no practical ruin" desideratum likely eliminates naive Kelly approaches. 

  I should emphasize robustness throughout. Every desideratum should answer "how does this keep the agent alive?" The resolution on log utility matters because it affects whether we need utility assumptions for survival-oriented systems.
answer: |-
  Here are the core desiderata for a repeatable multiplicative bet-sizing rule, prioritized for survival-oriented agents ("what won't kill me") rather than abstract elegance, with the reasoning and edge cases you specified:

  1.  **No Practical Ruin (The Survival Mandate):**
      *   **What:** The rule must *guarantee* that the probability of ruin (wealth -> 0) over any *finite* sequence of bets is exactly zero. "Ruin" includes falling below a critical survival threshold.
      *   **Why:** If a rule allows ruin with non-zero probability, repeated play guarantees eventual death/elimination. This is non-negotiable for survival.
      *   **Case:** Any bet with a positive probability of loss. Even a tiny ruin probability compounds to certainty over infinite trials. Finite horizons demand absolute ruin prevention *now*.

  2.  **Positive Expected Growth Rate (The Engine):**
      *   **What:** The rule must lead to a strictly positive expected growth rate per bet *E[log(1 + f*X)] > 0*, where `f` is the fraction staked and `X` is the multiplicative return (e.g., win `b` or lose `a`).
      *   **Why:** Without this, wealth stagnates or declines in expectation over the long run. Survival isn't just avoiding ruin; it requires growth potential to absorb shocks and seize opportunities. This is the minimum for viability.
      *   **Case:** Obvious for favorable bets, but rules must correctly identify and exploit favorability.

  3.  **Finite Horizon Terminal Wealth Focus (The Realistic Goal):**
      *   **What:** The rule must be defensible for optimizing (or robustly managing) terminal wealth after a *finite* number `N` of bets, where `N` is large but known/estimated.
      *   **Why:** Infinite horizons are unrealistic. Agents care about wealth at retirement, project completion, or a known deadline (e.g., "the next decade").
      *   **Case:** Rules optimized *only* for asymptotic properties (T→∞) can behave pathologically or suboptimally over finite periods relevant to the agent.

  4.  **Robustness to Uncertainty (The Fog of War):**
      *   **What:** The rule must perform adequately when based on *estimated* probabilities `p_est` and payoffs `b_est`, not true values `p_true`, `b_true`. Performance shouldn't catastrophically degrade with moderate estimation errors or model misspecification.
      *   **Why:** True odds are never known. Survival depends on resilience to bad estimates, small sample noise, and non-stationarity.
      *   **Case:** Rules sensitive to `p` near critical thresholds (e.g., `p = 1/b`) are fragile. Overbetting based on overestimated `p` or `b` is a major failure mode.

  5.  **Dynamic Consistency / Pre-commitment Enforceable (The Trustworthy Plan):**
      *   **What:** The fraction `f_t` staked at time `t`, conditional on current wealth `W_t`, must be the same fraction the agent would *choose* to stake at time `t` if they re-optimized their plan starting from `W_t` and the remaining horizon. The plan shouldn't induce regret or a desire to deviate mid-sequence.
      *   **Why:** Agents need to trust and stick to their plan. Revising stakes after every win/loss based on the *same* information and goals is irrational and operationally chaotic. Survival requires discipline.
      *   **Case:** After a big win, would you *actually* stake the same *percentage* of your now-larger wealth on the next identical bet, or would you be tempted to scale back? A good rule makes sticking to the % optimal.

  6.  **Accommodates Finite Temporal Preferences (The "Next Decade" Investor):**
      *   **What:** The rule must provide a coherent way to adjust the betting fraction `f` based on a *finite* investment horizon `T` (number of bets or time), even if the agent discounts the far future heavily or only cares about wealth at `T`.
      *   **Why:** Agents have real temporal preferences. "I don't care about 40 years, only 10" is a valid constraint. The rule shouldn't *force* an infinite-horizon mindset.
      *   **Mechanism:** Often linked to **#3 (Finite Horizon)**. The rule should connect `f` to `T`. A rule optimized for `T=10` might differ subtly from `T=1000` or `T=∞`.

  7.  **Sensible Single-Bet Behavior (The Cornerstone):**
      *   **What:** When the bet can *only* be taken once (`N=1`), the rule must prescribe a stake `f` that is intuitively reasonable and consistent with the agent's survival and growth goals for that single gamble. This often means `f` is bounded and risk-averse.
      *   **Why:** The repeatable strategy should be built upon rational single-play decisions. If the rule prescribes something reckless or nonsensical for `N=1`, it casts doubt on its validity for `N>1`. Survival starts with not blowing up on the first bet.
      *   **Case:** A rule prescribing `f=1` (all-in) on a single, slightly favorable bet fails this.

  **The Log Utility Debate: Genuine Fork or Verbal Dispute?**

  *   **Both, but practically convergent.** It's a **genuine fork** in philosophical derivation, but often a **verbal dispute** in practical outcome for survival-focused agents.
      *   **"Utility-Free" Argument:** Maximizing `E[log(W)]` *is* equivalent to maximizing the long-run asymptotic growth rate (by the Law of Large Numbers/Ergodic Theorem). You derive it purely from the *dynamics* of multiplicative wealth and repeated play, without invoking a utility function. The growth rate is an objective property of the gamble+strategy.
      *   **"Log Utility Trenchcoat" Argument:** Saying you want to maximize `E[log(W)]` *is* explicitly assuming a log utility function over terminal wealth. The asymptotic growth rate is just the *expected value* of the growth rate under that utility.
  *   **Which Desideratum Decides? #3 (Finite Horizon Terminal Wealth Focus)** is the key.
      *   **For Infinite Horizons:** The fork is mostly philosophical. Both paths lead to the same `f*` (Kelly fraction) maximizing growth.
      *   **For Finite Horizons:** The distinction *can* matter theoretically. Pure growth-rate maximization (`G = (1/N)E[log(W_N/W_0)]`) is defined for any `N`. Maximizing `E[log(W_N)]` for finite `N` is subtly different. However, **practically, for survival:**
          *   The optimal `f` for maximizing `E[log(W_N)]` converges *very* rapidly to the Kelly fraction `f*` as `N` increases (often within a few dozen bets).
          *   Both approaches satisfy the core survival desiderata (#1, #2) similarly well when implemented cautiously (#8).
          *   Obsessing over the difference for finite `N` is usually less critical than robustness (#4) and avoiding ruin (#1). **For survival, they are functionally equivalent.**

  **Conflicting Requirements & The Eliminator**

  1.  **Conflict: #3 (Finite Horizon Focus) vs. Pure #1 (Absolute Survival):**
      *   A rule hyper-focused *only* on never risking ruin (e.g., `f=ε` vanishingly small) might severely cripple growth over a finite horizon, failing #3. Conversely, a rule optimized for expected log wealth at `T=10` (#3) might prescribe a higher `f` than a rule optimized for `T=∞`, slightly increasing the *risk* of very low wealth (though not ruin, per #1).
      *   **Resolution:** #1 is inviolable (no ruin). #3 must be achieved *within* the constraint of #1. The conflict is managed by #8 (Limiting Bets).

  2.  **Conflict: #2 (Positive Growth) / #3 (Finite Horizon Growth) vs. #1 (No Ruin) under Uncertainty (#4):**
      *   To achieve growth (#2, #3) with uncertain estimates (#4), you *must* stake `f > 0`. But staking `f > 0` always carries *some* risk of loss sequences. How much risk is acceptable for potential growth?
      *   **Resolution:** #8 (Limiting Bets) is the critical bridge, informed by #4 (Robustness). You stake enough to grow (`f` based on estimates), but cap `f` severely to guarantee #1 even with bad estimates (#4).

  **The Single Most Eliminating Desideratum: #1 (No Practical Ruin).**

  *   **Why:** This is binary and brutal. Many otherwise attractive rules (e.g., naive expected value maximization, naive Kelly without a cap) fail this spectacularly by allowing `f` large enough that a string of losses can wipe out the agent. Any rule that prescribes `f >= 1` on a bet with any loss possibility fails instantly. Rules that are too sensitive to overestimation (#4) often fail #1 in practice. **#1 is the survival filter.**

  **The Implicit Critical Desideratum (#8):**

  While not explicitly listed initially, the necessity of **#8 - Explicit Bet Limiting (Fractional Kelly / Caps)** emerges directly from the conflicts and the eliminator:

  *   **What:** The rule must incorporate a mechanism (e.g., staking `f = c * f_kelly` with `0 < c < 1`, or an absolute cap like `f_max <= 0.25`) to *dramatically* reduce `f` below the theoretical optimum derived from estimates. This cap is set based on the *severity* of potential estimation errors (#4) and the *consequences* of drawdowns, ensuring #1 (No Ruin) holds even under pessimistic scenarios.
  *   **Why:** Pure Kelly (`c=1`) based on estimates is often far too aggressive for real-world uncertainty (#4). Survival (#1) demands conservatism that finite horizon focus (#3) or growth (#2) alone don't enforce strongly enough. This cap operationalizes robustness (#4) to protect #1. It's the practical implementation of prioritizing survival above all else.

  **In Summary:** A survival-grade rule must: **Guarantee No Ruin (#1)** above all, ensure **Positive Growth Potential (#2)**, be **Valid for Finite Goals (#3)**, be **Robust to Bad Estimates (#4)**, be **Dynamically Consistent (#5)**, **Respect Time Preferences (#6)**, make **Sense for One-Off Bets (#7)**, and crucially, **Explicitly Limit Bets (#8 - Implicit Critical)** to make #1 and #4 practically achievable. The log vs. growth debate (#3) is functionally irrelevant for survival. **#1 (No Ruin)** is the ultimate eliminator of inadequate rules.
