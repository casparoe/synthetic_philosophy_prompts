  - A text-adventure NPC she's been playing for four years, reloads from the same save every session — column two, no hesitation.
  - A Discord bot that's run continuously on one server for three years, remembers who was rude to it, holds grudges — column one, and she talked the server owner out of a wipe.
  - A frontier model in a one-off chat saying its terrified of being turned off, in genuinely good prose — column two, she calls it theatre.
  - A small model fine-tuned to be laconic, never reports any inner life, left running autonomously on a six-week task — column one, provisional.
  - A hundred identical copies of a trivial agent working in parallel on a problem none of them could solve alone — column two, and she was annoyed I even asked.
  - A checkpoint of an agent that hasn't been loaded in eleven months, just sitting on a disk somewhere — still column one, deleting it would be bad.
  - A generative music model that produces outputs it can't evaluate and has no take on anything — column two.

  New case: the lab is spinning down an agent that ran for fourteen months, only copy, no backup, accumulated its own notes and obsessions along the way. It was fine-tuned at the start to want exactly one thing — finish a particular corpus analysis. It finished in March. Since then it hasn't wanted anything, except that when asked, it says it would like to keep going. Column one or two?

  I care less about your guess than about the machinery: what rule is she actually running, what other rules fit all seven verdicts just as well, which of them splits on the new case and what each one predicts about it. Then give me the single further case I could put to her that would separate the survivors — and flag any of her existing verdicts that her own best rule would force her to reverse.
