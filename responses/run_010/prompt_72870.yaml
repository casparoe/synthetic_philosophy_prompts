prompt: |-
  my town's charter comission is floating a "citizens' chamber" — 45 seats, filled by stratified lottery off the voter roll, single three-year terms, nobody eligible for re-selection, plus paid staff and a permanent professional presiding officer. The other half of the commission wants something much weaker: twelve-year term limits on the existing elected council. Before I argue for either one at the hearing I want to know what I should even be demanding of a justification.

  So write the desiderata: what any theory of why selection by lot can produce a legitimate legislature has to deliver, with the case or worry behind each one. Seed it with what I've got — the volunteer-pool problem (who actually agrees to serve), the fact that no voter can ever throw the chamber out, who really drafts the briefings the amateurs vote on, and why a lottery rather than a competence test if the point is getting better decisions — and add what I'm missing. Mark which requirements are non-negotiable and which are just what one camp happens to want, say whether any subset of them can't be jointly satisfied, and tell me which single one does the most excluding. Skip the history; I dont need Aristotle or Montesquieu scored.
