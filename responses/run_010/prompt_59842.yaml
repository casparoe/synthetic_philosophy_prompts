  ## Agony Aunt Column: "Dear Constance"

  **The Reader's Letter:**

  Dear Constance,

  I chair a Parole Board. For over thirty years, I’ve believed, profoundly, in one principle: punishment must be *deserved*. The sentence must fit the crime, measured by the offender’s culpability at the time, the harm inflicted, the moral debt owed. Consequences – whether deterring others or rehabilitating the individual – were secondary, sometimes irrelevant, even obstructive of pure justice. I’ve kept men inside because releasing them, however reformed, would have been an insult to their victims and the scales of justice. Once, during a volatile prison riot sparked by rumours of an early release, I refused parole for an eligible man whose freedom would have poured petrol on that fire. It was the right decision *then*: he deserved his full term, and releasing him amidst chaos would have compounded the injustice.

  But now… Constance, I’m shaken. I’ve just reviewed a case. A man sentenced decades ago for a horrific act of violence, driven by extremist ideology and uncontrollable rage. He was, by all accounts, monstrous. But the man sitting before me now? He has advanced dementia. He remembers *nothing* of the crime, nor the beliefs that fueled it. His temperament is placid, bewildered. Neurologists confirm profound, irreversible brain changes. By every conceivable measure – memory, personality, belief system, even physical neurology – he is not the man who committed that atrocity. He is, functionally, a different person trapped in the same body.

  My bedrock principle crumbles. If punishment is only just if inflicted *on the person who committed the crime*… who am I punishing now? Holding this frail, amnesiac shell accountable for the sins of a man who no longer exists feels… obscene. Have I become, unwittingly, the jailer of an innocent? Does the debt expire with the self that incurred it? The sheer existential weight of this keeps me awake. Have I built my career on a fundamental misunderstanding of identity and desert?

  Yours in troubled conscience,
  "The Scales of Justice"

  **Constance's Reply:**

  Dear Scales,

  Goodness, you do tie yourself in philosophical knots! So much fretting about *who* and *why* and *desert*! While you’ve been gazing at your navel (or perhaps your gavel?), the practical world keeps turning. Your job isn’t to be Saint Peter at the pearly gates, weighing eternal souls; it’s managing risk and resources *now*. Let’s pop that lofty bubble and get practical!

  This “different person” angst? Utterly irrelevant. Whether he’s the same man, his own long-lost twin, or an alien pod replacement is a parlour game for dusty dons. What *matters* is the *consequence* of releasing him. Does letting him out *today* make society safer, cost less, or cause more problems than keeping him? That’s your North Star, dear! Forget the "debt"; focus on the ledger.

  So, put down the metaphysical magnifying glass and pick up the cost-benefit calculator:

  1.  **Early Release = Cost Saving (Probably):** Dementia care inside is ruinously expensive, and frankly, our prisons aren’t geriatric wards. If he’s truly harmless now – no temper, no ideology, just confusion – shipping him to a secure, *cheaper* facility frees up taxpayer cash for… well, anything more useful than guarding a bewildered old man who thinks it’s 1952. Why make taxpayers fund his expensive nap time? That’s just bad economics. Free up the bed!
  2.  **The "Useful Example" Factor (Consider Carefully):** Is his case well-known? Has his original crime been a powerful deterrent tale for decades? Releasing him *might* inadvertently send the message, "Do something monstrous, wait long enough, and even if you forget it, you’ll eventually walk free!" That *could* undermine deterrence. If keeping him inside, even as a shell, serves as a potent, silent reminder of the ultimate price of such acts, then his continued incarceration has ongoing societal value. Think of him as a very expensive, living billboard. Is the messaging worth the cost?
  3.  **The Waiting Game (Simple & Efficient):** Honestly, nature is solving this problem for you. He’s frail, he’s fading. Keeping him locked up until he passes is the path of least resistance. No tricky decisions about facilities, no PR headaches if he *does* get released and someone recognizes him, no awkward questions about "why now?". The system just quietly ticks along until the problem ceases to exist. Minimal fuss, avoids any potential negative consequences of action. Sometimes, inertia is the most efficient policy.

  Stop torturing yourself about punishing "the innocent." You punished the *guilty* man thirty years ago. That was correct then, based on the facts *then*. What you do *now* with the confused old chap inhabiting his body is a purely administrative decision about risk management and resource allocation. Don’t confuse the two! Justice, my dear, is sometimes just sausage-making – focus on the output, not the existential angst of the ingredients.

  Chin up and think practically!
  Constance

