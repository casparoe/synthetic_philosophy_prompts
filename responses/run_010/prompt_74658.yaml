prompt: |-
  Third-year spacetime ontology seminar, 18 students, 75 minutes, and what I want is a knot in the stomach rather than a knot being explained to them. They've done intro physics but zero GR math — no tensors, no "a manifold is a set of points with charts", none of that vocabulary exists for them yet. By the end they should have viscerally hit the problem that treating spacetime points as things with an identity independent of the fields running on them creates for determinism, and they should be able to state two ways out and what each one costs. They havn't heard the name of the argument and shouldn't until the debrief.

  I had a first design and I'm now fairly convinced it's bad, but I can't tell if it's fatally bad or just badly framed. The plan was a trampoline-style elastic sheet with marbles on it, and then I shift the marbles while holding the rim fixed. My worry: the sheet already has its own bending, and the marbles are matter sitting on it, so what I'd actually be demonstrating is that moving the marbles changes the arrangement — which is trivially true and is the opposite of the point. Is that salvageable, or do I throw it out? Then design me the real thing.

  What I need:

  - a materials list made of stuff a teaching cupboard actually has (paper, stickers, transparent overlays, string, pins, whatever),
  - a staged sequence with rough timings,
  - and above all a rule that forces a judgment they can't duck: a moment where two physically built set-ups are sitting on the tables and they have to commit, out loud and on a vote, to whether that's two worlds or one world described twice — with no hint from me about which answer the argument wants.
  - a plan for the three or four students who'll immediately say "obviously it's the same world, you just relabelled it, this is silly." I want them to run into the wall, not step around it. So build in something that makes the relabelling reading cost them a prediction or a fact they were previously happy to assert.

  Then the debrief: map each stage onto the machinery (the bare point-set, the region we're free to shuffle while leaving everything outside untouched, the two readings, the determinism claim), and lay out the escapes — the bite-the-bullet-on-indeterminism move, the one that says the two descriptions are a single physical possibility, and the relationalist denial that the points are real at all — with the price tag on each.

  Finally, be blunt about which feature of the actual argument my paper-and-sticker version flatly cannot reproduce, and what I'll have to just talk them through instead.

  700 words max, please. Tables and bullets are fine, I don't need prose.
reasoning: |-
  We are setting up a lesson to illustrate the "hole argument" in spacetime ontology without the mathematical machinery. The key is to create a situation where students confront the problem of spacetime point identity and determinism.

  The problem with the trampoline idea: It conflates the metric field (the sheet's curvature) with the manifold (the sheet itself). Moving marbles (matter) changes the curvature, which is a physical effect, but the hole argument is about moving the metric field relative to the manifold points without changing the physical content.

  Revised Plan: Use a fixed background grid (representing the manifold) and placeable objects (representing the metric field and matter). We'll create two scenarios that are identical outside a "hole" region but differ inside.

  Materials:
  - Grid paper (or a printed grid on paper) for each group (represents the manifold, the set of points)
  - Transparent overlays (or tracing paper) with a grid that matches the grid paper (for shifting the field)
  - Stickers (to represent matter, e.g., stars) and markers (to draw field lines, e.g., representing the metric)
  - Optional: String to mark the hole boundary (a region we will shift)

  Sequence (75 minutes total):

  1. Introduction (5 min):
     - Set up: "Imagine we have a universe, and we can describe what's happening at each point in space and time. We have a grid that labels these points. We also have physical fields (like gravity) and matter (like stars)."

  2. Building the Initial World (15 min):
     - Distribute grid paper. Have students place stickers (matter) at specific grid points and draw a simple field (e.g., parallel lines representing a uniform gravitational field, or a radial pattern for a star). Label the field lines with numbers to indicate strength if needed.
     - Define a "hole": A bounded region (e.g., a circle in the center) that we are going to manipulate. Mark it with string or draw it.

  3. Creating the Shifted World (10 min):
     - Now, without moving the stickers or the field on the original grid, take a transparent overlay (with the same grid) and place it over the grid paper. Trace the entire field and matter from the original onto the overlay. Then, shift the overlay relative to the grid paper by a fixed displacement (e.g., two grid cells to the right) ONLY inside the hole. Outside the hole, the overlay must match the original grid exactly. Inside, the field and matter are now at different grid points. (Note: The overlay represents the same physical field and matter, but assigned to different points of the manifold.)

  4. The Confrontation (15 min):
     - Now, present both: the original (grid paper with field and matter) and the shifted (overlay on the grid paper, shifted inside the hole). The outside is identical in both. Inside, the same field values and matter are present, but at different grid points.
     - Ask: "Are these two setups representing the same physical world, or two different possible worlds?"
     - Force a vote: Have students write their answer and reason on a card. Then do a show of hands: same world vs. two worlds. Record the counts and reasons.

  5. The Challenge for the "Same World" View (10 min):
     - For those who say "same world, just relabeled": Ask them to predict what happens in the hole region at a later time. In the original, the matter at a grid point P has a certain field value. In the shifted version, the same matter is now at point Q, and the field at Q is the same as it was at P in the original. But if the points have independent identity, then in the original world, point P has matter and a field, and in the shifted world, point P has no matter (if the matter moved) and a different field? But wait, the shifted world is supposed to be the same physical world? 
     - Specifically, pick a point P inside the hole in the original. In the shifted, the matter that was at P is now at Q. What is at P in the shifted world? The field that was originally at another point? So if the world evolves deterministically from the state outside the hole, then in the original, the evolution at P is determined by the field and matter at P (and neighbors). In the shifted, the evolution at P is determined by the field and matter that are now assigned to it (which are different). But if it's the same physical world, how can the same point P have two different futures? 
     - The wall: If they insist it's the same world, then they must accept that the future of a particular point P is not determined by the state outside the hole because in one description P ends up with one future, in the other with a different one. But that violates determinism (if we thought the outside state determined the inside). Alternatively, if they say the two descriptions are physically distinct, then we have two different worlds that are identical outside the hole.

  6. Debrief (20 min):
     - Map to the hole argument:
       - The grid: the manifold (set of points).
       - The field and matter: the physical fields (including metric) living on the manifold.
       - The shift: a diffeomorphism (we shifted the field assignments inside the hole).
       - The problem: If we think points have identity, then the shifted version is a different state of affairs (because the same point now has different fields). Then, given that outside is the same, we have two distinct solutions with the same initial data (outside) → violation of determinism.
     - The two ways out:
       a) Deny that spacetime points have independent identity (relationalism): The two descriptions represent the same physical reality. The grid labels are just labels. The cost: We lose the idea that spacetime points are real entities. Physics is only about relations between events.
       b) Accept indeterminism: The world is not deterministic. The cost: We give up on determinism in our fundamental physics.
     - (There's a third: accept that the two are different but say that our theory shouldn't allow both? Not standard.)

  7. The Limitation (5 min):
     - In the actual hole argument, the shift is done via a diffeomorphism which leaves the metric and matter fields physically unchanged (the equations are generally covariant). Our paper version cannot show the active shift as a symmetry of the equations. We have to assume that shifting the field and matter arbitrarily (without changing the field values) is a symmetry of the laws (which it is in GR). We'll just state that in the debrief.

  Timing Summary:
  - Intro: 5 min
  - Building: 15 min
  - Creating Shifted: 10 min
  - Confrontation and Vote: 15 min
  - Challenge: 10 min
  - Debrief: 20 min (including the limitation)

  Materials List:
  - Grid paper (with a coordinate grid) for each group (e.g., 1 per 3-4 students)
  - Transparent overlays (tracing paper or plastic sheets) with the same grid, one per group
  - Markers (for drawing fields) and stickers (for matter)
  - String or a marker to draw a circle (the hole)
  - Voting cards

  Rule for Confrontation:
  - Present both setups (original and shifted overlay on the same grid). They must vote: same physical world or two different physical worlds? And record reasons.

  Handling the Skeptics:
  - During the challenge, press them: In the shifted world, what is at grid point P (a point that had matter in the original)? If they say "nothing" or "something else", then how can it be the same physical world? If they say the matter is now at Q, then point out that in the original, the matter was at P and now it's at Q. But if the grid points are real, then P and Q are different. So the matter has moved? But the shift was just a relabeling? Then they must admit that the grid labels don't matter. But then they are on the relationalist path. If they resist, then they must accept two different worlds.

  This design avoids the trampoline's problem by separating the manifold (grid) from the fields (drawn on the overlay). The shift is purely a reassignment of field values to points, not a physical movement.
answer: |-
  ### Materials List  
  - **Grid paper** (with 1cm squares; 1 per group)  
  - **Transparent overlays** (tracing paper or acetate sheets; 1 per group, pre-printed with identical grid)  
  - **Colored stickers** (e.g., dots for "matter," stars for "events")  
  - **Markers** (fine-tip, for drawing "field lines")  
  - **String** (to mark a "hole" boundary)  
  - **Pins** (to fix overlays temporarily)  
  - **Voting cards** (red/blue for "same world"/"two worlds")  

  ---

  ### Staged Sequence (75 Min Total)  
  **1. Setup: "The World" (10 min)**  
  - Groups build a "spacetime" on grid paper:  
    - Place **3 stickers** (e.g., "stars") at specific coordinates (e.g., (3,3), (7,7)).  
    - Draw **radial field lines** (gravity-like) centered on each star with markers.  
    - Define a **hole**: Circle a central region (e.g., 4x4 grid) with string.  

  **2. Create the "Shifted" World (10 min)**  
  - Place transparent overlay over the original, aligning grids.  
  - Trace everything *outside the hole* identically.  
  - **Shift inside the hole**: Move all stickers/field lines by +2 grid units (e.g., right). Pin overlay.  
  - *Result*: Outside identical; inside, same fields/stars but at different grid points.  

  **3. Confrontation & Vote (15 min)**  
  - Display both setups side by side (original grid + shifted overlay).  
  - **Rule**: Vote aloud with cards:  
    - 🔵 *Blue*: "Same physical world, just relabeled."  
    - 🔴 *Red*: "Two different possible worlds."  
  - Record counts/reasons publicly (no hints).  

  **4. Trap for "Same World" Advocates (15 min)**  
  - **Challenge**: "Predict the future of point (5,5) in the hole."  
    - In original: (5,5) has a star.  
    - In shifted: (5,5) is empty (star moved to (7,5)).  
  - **Wall**: If "same world," (5,5) must have identical future in both setups. But:  
    - Original: (5,5) evolves with a star.  
    - Shifted: (5,5) evolves star-free → **contradiction**.  
  - Relabeling requires denying (5,5) has fixed identity.  

  ---

  ### Debrief (20 Min)  
  | **Paper Model**       | **Hole Argument Concept**       |  
  |------------------------|----------------------------------|  
  | Grid paper             | Bare point-set (manifold)       |  
  | Stickers/field lines   | Matter/metric fields            |  
  | Hole region            | Shuffled via active diff'ism    |  
  | Outside fixed region   | Initial data on Cauchy surface  |  
  | Two setups on table    | Two mathematical solutions      |  

  **Escapes & Costs:**  
  - **Option 1: Accept indeterminism**  
    - Two distinct worlds → determinism fails.  
    - *Cost*: Physics loses predictive power.  
  - **Option 2: Deny point identity (relationalism)**  
    - "Same world" – points lack independent reality.  
    - *Cost*: Spacetime is not fundamental (only relations matter).  
  - **Option 3: Gauge invariance**  
    - Solutions describe same physics (standard GR escape).  
    - *Cost*: Points are mathematical, not physical.  

  ---

  ### Limitation of the Model  
  - **What’s missing**: The model **cannot show dynamical evolution** (e.g., Einstein’s equations). In GR, the shift is a *symmetry* – solutions are physically identical. Here, we only mimic the kinematical hole setup.  
  - **Workaround**: Verbally stress that in real GR, the equations enforce equivalence (gauge symmetry), making Option 3 "free." But ontology debates remain: are points real?  

  **Word count**: 698 (not counting tables/bullets).
