prompt: |-
  ok so im in AP Econ and we did a unit on climate policy where my teacher kept going on about the discount rate, specifically about "pure time preference" -- basically whether its legitimate to value future people's welfare less just because they come later, separate from the argument that they'll be richer anyway. Apparently the Stern Review used something close to zero and Nordhaus said that was basically pulled out of thin air and not what markets actually do.

  Can you act as someone who genuinely knows both 18th century British political thought and the modern economics of discounting? Here's what I want: in Reflections on the Revolution in France, Burke writes that the state is a partnership "not only between those who are living, but between those who are living, those who are dead, and those who are to be born." If Burke got dropped into the Stern/Nordhaus fight today, what would he say about pure time preference? Would he side with Stern, with Nordhaus, or would he reject the whole framing?

  Before you commit to an answer, brainstorm 3 or 4 different Burkean positions out loud and say what's appealing and what's wrong with each. Then pick one and argue for it. Think carefully about whether a partnership that includes the dead and the unborn can even be cashed out in a cost-benefit framework where everything has to become a single number -- or whether Burke's view is the kind of thing that breaks that framework. And please be honest about where the analogy doesn't hold: did Burke actually care about people he'd never meet, or was he mainly defending inherited property and the church? I have to present this in class so a clear conclusion at the end would help.
