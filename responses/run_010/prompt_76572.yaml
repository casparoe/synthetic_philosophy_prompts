prompt: |-
  I host a small podcast on non-Western epistemology and next month's guest defends the classical Nyāya list as a live option for analytic epistemologists today: four pramanas and no more — perception, inference, comparison, testimony — with memory, arthāpatti and anupalabdhi all shown to reduce, plus a stopping rule that says a new pramāṇa is warranted only when there's a distinct kind of causal instrument (karaṇa) doing the work.

  Write exactly five numbered questions, each with the follow-up I'd use if she gives the answer she's most likely to give — no preamble, no wrap up, two or three sentences per item. They should turn on her actual commitments rather than generalities: on the individuation rule (if instruments carve the joints, why doesnt a telescope or an fMRI or a well-designed survey get its own pramāṇa, and where exactly is the line?); on indeterminate (nirvikalpaka) perception, which nobody can recall or report and so nobody can act on — is it knowledge or just a theoretical posit?; on her extrinsic account of truth, where a cognition only turns out veridical once the activity it prompted succeeds, and what that means for theoretical claims with no testable action; on testimony, and how she picks out a reliable speaker (āpta) without already trusting testimony — i.e. whether her default trust is just Reid in Sanskrit vocabulary; and on why she keeps comparison basic while reducing the other two extras, given that the gavaya case looks like testimony plus perception plus a similarity judgement. For that last one, end by making her say what would have to be true for her to admit a fifth.
reasoning: |-
  Okay, the user hosts a podcast on non-Western epistemology and has a guest next month who defends the classical Nyāya view. The guest argues for only four pramanas (means of knowledge) and reduces others like memory to these four. They have a specific rule for adding new pramanas: only when there's a distinct causal instrument. 

  The user wants exactly five numbered questions with follow-ups based on likely answers. Each question needs to target the guest's actual commitments. The topics include: individuation of pramanas (why telescopes don't count), indeterminate perception (its status as knowledge), extrinsic truth (how it applies to theoretical claims), testimony (identifying reliable speakers without circularity), and why comparison is basic while others are reduced.

  First, I need to structure each question to hit these specific issues. For the individuation rule, the key is why instruments like fMRI don't get their own pramana. The follow-up should challenge where the line is drawn between instruments and mere tools. 

  For indeterminate perception, the problem is that it can't be recalled or acted upon. The follow-up needs to question its epistemic status given that limitation. The truth question must press on how success-based truth applies to non-practical knowledge, like abstract math. 

  The testimony question has to address the circularity in identifying reliable speakers. Comparing Reid's approach could highlight if it's just a cultural variation. The last question on comparison needs to dissect why it's irreducible when the gavaya example seems combinable. The follow-up must make her state conditions for a fifth pramana.

  I should ensure each question is concise, with two sentences max per part. Avoid preambles. The user wants direct, focused questions that force the guest to clarify her stance. Checking the examples provided: telescopes and fMRI for individuation, nirvikalpaka perception's unreportable nature, truth via successful action, testimony without prior trust, and comparison versus reduction of others. Each follow-up digs deeper into potential contradictions or implications. 

  Also, the last question's end must explicitly ask what would warrant a fifth pramana. Need to make sure that's included. Finally, ensure all questions are numbered and formatted as requested without any extra text.
answer: |-
  Here are five precisely targeted questions with follow-ups:

  1.  **Your individuation rule requires a distinct causal instrument (karaṇa) for each pramāṇa. Why doesn't the telescope, fundamentally altering our sensory access to distant objects, qualify perception as a *new* pramāṇa?**  
      *Follow-up (if she argues it's just an extension of the senses):* If enhancing the sense organ's capacity with technology doesn't create a new causal kind, where exactly is the line? Does fMRI, providing brain state data inaccessible to unaided senses via a distinct physical process, cross it?

  2.  **Nirvikalpaka perception is ineffable, unreportable, and can't directly guide action. If knowledge (pramā) must be actionable, how can this indeterminate state qualify, beyond being a theoretical posit for cognition's genesis?**  
      *Follow-up (if she emphasizes its foundational role):* Granting it grounds savikalpaka, if an agent cannot recall or utilize it independently, in what operational sense is it *their* knowledge, rather than just a causal prerequisite?

  3.  **Your extrinsic truth links a cognition's veracity to the success of the action it prompts. How does this apply to theoretical cognitions, like grasping abstract mathematical truths, where no overt, testable action follows?**  
      *Follow-up (if she suggests mental verification suffices):* Doesn't defining "successful action" as internal mental coherence risk collapsing your extrinsic, action-based criterion into an intrinsic justification theory, abandoning Nyāya's core pragmatism?

  4.  **You identify an āpta (reliable speaker) through qualities like competence and honesty. But verifying these seems to require perception, inference, or... testimony itself. Doesn't this make default trust in testimony basic, akin to Reid, just framed in Nyāya terms?**  
      *Follow-up (if she describes non-testimonial verification):* If ascertaining an āpta's reliability *always* ultimately relies on non-testimonial pramāṇas, doesn't that make testimony fundamentally reducible, contradicting its status as basic?

  5.  **You reduce arthāpatti and anupalabdhi but keep upamāna (comparison) basic, citing the unique cognition of similarity via prior acquaintance. Yet, knowing a gavaya is like a cow via testimony ("like a cow") plus seeing the gavaya plus judging similarity seems combinable. Why isn't *that* reduction compelling?**  
      *Follow-up (if she insists similarity cognition is irreducible):* Specifically, what unique causal process in upamāna, absent in the other extras, necessitates its basic status? Given your stopping rule, what would empirically demonstrate a *fifth* distinct causal instrument warranting a new pramāṇa?
