answer: |-
  ### Step 1: Failure Modes of Large-Scale Sociopolitical Instability Theories  
  *(Derived from dynamical systems epistemology, not polemics)*  

  1. **Overfitting to Epiphenomena**  
     The model captures noise or transient correlations unique to training data, mistaking them for universal dynamics.  

  2. **Structural Misidentification**  
     Key feedback loops (e.g., elite-population resource competition) are mischaracterized, causing divergence from actual trajectories.  

  3. **Temporal Decoupling**  
     Modeled mechanisms operate at timescales misaligned with empirical instability events (e.g., predicting "pressure" but missing collapse by centuries).  

  4. **Causal Inertia**  
     The theory cannot distinguish between genuine predictive power and retroactive curve-fitting to known historical outcomes.  

  5. **Context Collapse**  
     Variables abstract away institutional/cultural specificities that fundamentally reshape dynamics (e.g., modeling "elites" identically in feudal vs. mercantile societies).  

  6. **Unfalsifiable Reinterpretation**  
     Failures are explained away by claiming exogenous shocks or "special conditions" without independent verification.  

  7. **Proxy Degradation**  
     Latent constructs (e.g., "state capacity") are measured via poor proxies that drift in meaning across eras/societies.  

  ---

  ### Desiderata for Actionable Predictive Theories  
  *(Non-negotiable requirements marked **★**; others reflect tradeoffs)*  

  | Requirement | Motivation & Negotiability |  
  |-------------|----------------------------|  
  | **★ Out-of-sample predictive validity** against naive baselines (persistence, trend) | Failure Modes 1, 4: Without outperforming "stasis" models, predictive claims are illusory. **Non-negotiable** for funding decisions. |  
  | **Coder invariance** in variable assignment | Failure Mode 5: Ensures robustness against subjective historical interpretation. **Non-negotiable** for replicability. |  
  | **Explicit domain specification** (societies/periods where theory applies) | Failure Modes 3, 6: Prevents overextension and defines testable boundaries. **Non-negotiable** for ethical deployment. |  
  | **Ability to accommodate null cases** (accumulated pressure ≠ instability) | Failure Mode 6: Tests if the theory identifies necessary-but-insufficient conditions vs. post-hoc rationalization. **Negotiable**: Well-specified mechanisms can omit triggers. |  
  | **Survivability to publication/action** (no self-defeating predictions) | Failure Mode 2: Addresses reflexivity (e.g., if elites preempt instability). **Negotiable**: Early-warning systems can adjust for this. |  
  | **Statable without unique events/named individuals** | Failure Mode 4: Focuses on structural dynamics. **Negotiable**: Historical triggers may need narrative integration. |  
  | **Phase-lag discipline** (see below) | Failure Mode 3: Legitimate if lags/phase relations are *pre-specified* and tested. **Negotiable with strict pre-registration**. |  
  | **Beats bare density-driven models** | Failure Mode 1: Baseline against Malthusian reductivism. **Negotiable**: Some societies may be density-sensitive. |  
  | **Reducible to microfoundations** | Addresses agency-structure tension. **Negotiable**: Aggregate models can be valid without granular mechanisms. |  
  | **Predict triggering events** | Overdemanding for century-scale models. **Rejected as non-essential**: Windows of risk suffice for early-warning. |  
  | **Directly measurable variables** | Failure Mode 7: Ideal but **negotiable**. Latent constructs are valid if proxies are consistent *within domain*. |  

  ---

  ### Phase-Lag Legitimacy & Disciplines  
  The dynamical-systems argument is **valid** but requires:  
  - **Pre-specification** of expected lag structure and phase relationships (e.g., "violence lags population peak by 20–40 years").  
  - **Ban on post-hoc lag selection** without independent validation.  
  - **Falsifiability preservation** by testing phase/amplitude predictions (e.g., if violence *precedes* population decline when theory forbids it).  
  *Without these, the claim becomes unfalsifiable.*  

  ---

  ### The Trilemma: Joint Unsatisfiability?  
  Your suspicion is **partially correct** but resolvable:  
  - **Out-of-sample validation** (non-negotiable) + **Time-invariance** (strong universality) + **Institutional sensitivity** create tension.  
  - **Resolution**: Demand time-invariance *only for core mechanisms* (e.g., resource competition → elite fragmentation) while allowing:  
    - *Institutionally specific parameters* (e.g., tax extraction efficiency in agrarian vs. industrial states).  
    - *Bounded universality* (domain specification excludes societies without requisite features).  
  - **Why it holds with nuance**: With 1–2 cycles per society, validation requires pooling cases. Core mechanisms must be stable, but auxiliary processes can vary.  

  ---

  ### Most Exclusionary Requirement  
  **Out-of-sample validation against naive baselines** eliminates most candidates because:  
  - Secular cycles exceed the span of reliable data for most societies.  
  - "Persistence" baselines (e.g., "no instability next decade") are deceptively strong over centuries.  
  - Models that fit historical narratives often fail prospectively against simple extrapolations.  

  ---

  ### Application to Secular-Cycle Program  
  - **Satisfies best**: **Domain specification**. Explicitly models agrarian states with fixed land, hereditary elites, and Malthusian dynamics—correctly excluding commercial/industrial societies.  
  - **Satisfies least**:  
    1. **Coder invariance**: Relies on contested historical proxies (e.g., "elite overproduction" coded from noble ranks). Different teams assign divergent values.  
    2. **Accommodating null cases**: Pressure-release mechanisms (e.g., colonization, plague) are often retrofitted to explain non-collapse, risking unfalsifiability.  

  **Conclusion**: The program’s strength is its bounded universality; its weakness is empirical robustness to measurement variance. For early-warning systems, its failure to specify *contemporary* null cases (where modern states avert predicted instability) is critical.
