  ### 1. The Question  
  **Part A: Borda Count Sensitivity (10 marks)**  
  Consider the following profile of preferences over four alternatives (A, B, C, D) from nine voters divided into three equal blocs:  
  - Bloc 1 (3 voters): A ≻ B ≻ C ≻ D  
  - Bloc 2 (3 voters): C ≻ D ≻ B ≻ A  
  - Bloc 3 (3 voters): B ≻ D ≻ A ≻ C  

  1. Calculate the Borda scores (assigning 3 points for first, 2 for second, 1 for third, 0 for last) and determine the social ordering.  
  2. Now, delete alternative D and recalculate the Borda scores for the remaining alternatives (assigning 2 points for first, 1 for second, 0 for last). Determine the new social ordering over A, B, C.  
  3. Explain why the removal of D changes the social ordering of A, B, and C.  

  **Part B: Critique of IIA (10 marks)**  
  A candidate from a previous year wrote:  
  > *Arrow’s theorem is unpersuasive. Independence of Irrelevant Alternatives (IIA) is implausible because it forbids the social ordering from reflecting how strongly or marginally voters prefer one alternative to another. The Borda count is a perfectly reasonable voting rule; its violation of IIA shows that Arrow’s theorem just exposes an inconsistency in a biased set of axioms. The practical question of which rule to adopt remains entirely open.*  

  Evaluate each of the three claims in this passage:  
  1. IIA is implausible because it prevents reflecting preference intensities.  
  2. Arrow’s theorem merely exposes an inconsistency in a "tendentiously chosen" set of axioms.  
  3. The practical choice of voting rule is unaffected by the theorem.  

  **Part C: Broader Implications (5 marks)**  
  What survives the critique of IIA? Explain why rejecting IIA does not resolve the normative difficulty highlighted by Arrow’s theorem. Address both enriched-information and restricted-domain escape routes.  

  ---

  ### 2. Model Answer (Approx. 900 words)  
  **Part A: Borda Count Calculation**  
  *Full profile (4 alternatives, Borda points: 3, 2, 1, 0):*  
  | Bloc | Voters | A | B | C | D |  
  |------|--------|---|---|---|---|  
  | 1    | 3      | 3 | 2 | 1 | 0 |  
  | 2    | 3      | 0 | 1 | 3 | 2 |  
  | 3    | 3      | 1 | 3 | 0 | 2 |  
  **Aggregate scores**:  
  - A: (3×3) + (3×0) + (3×1) = 9 + 0 + 3 = 12  
  - B: (3×2) + (3×1) + (3×3) = 6 + 3 + 9 = 18  
  - C: (3×1) + (3×3) + (3×0) = 3 + 9 + 0 = 12  
  - D: (3×0) + (3×2) + (3×2) = 0 + 6 + 6 = 12  
  **Social ordering**: B (18) > A (12) = C (12) = D (12). Tie between A, C, D.  

  *After removing D (3 alternatives, Borda points: 2, 1, 0):*  
  | Bloc | Voters | A | B | C |  
  |------|--------|---|---|---|  
  | 1    | 3      | 2 | 1 | 0 |  
  | 2    | 3      | 0 | 1 | 2 |  
  | 3    | 3      | 1 | 2 | 0 |  
  **Aggregate scores**:  
  - A: (3×2) + (3×0) + (3×1) = 6 + 0 + 3 = 9  
  - B: (3×1) + (3×1) + (3×2) = 3 + 3 + 6 = 12  
  - C: (3×0) + (3×2) + (3×0) = 0 + 6 + 0 = 6  
  **Social ordering**: B (12) > A (9) > C (6).  

  **Explanation of change**:  
  The removal of D alters Borda scores because Borda relies on the *global ranking* of alternatives. In Bloc 2, C loses 3 points (from D’s deletion), while B gains 1 point (since D’s removal shifts B from third to second place). In Bloc 3, B loses 1 point (as D’s removal demotes B from first to second), and A gains 1 point (from third to second). Thus, D’s exit reshuffles rankings by changing the relative positions of survivors, exposing Borda’s sensitivity to the set of alternatives.  

  **Part B: Critique Evaluation**  
  1. **Claim: IIA prevents reflecting preference intensities**  
     - *What’s right*: Borda uses rankings to approximate intensities (e.g., higher ranks = stronger preferences). IIA forbids this by demanding that social preferences over {A, B} depend only on individual A-vs-B rankings, ignoring their positions in the full ordering.  
     - *What’s wrong*: Ordinal rankings *inherently* lack intensity data. Borda exploits the *ordinal configuration* (e.g., how often A is first) to infer strength, but this is not true intensity (which requires cardinal utilities). Rejecting IIA allows rules like Borda to use this configuration, but at a cost: sensitivity to irrelevant alternatives (e.g., D’s entry alters A-vs-B outcomes).  
     - *What survives*: The critique correctly notes that IIA restricts valuable information (global rankings), but conflates "configuration" with "intensity."  

  2. **Claim: Arrow’s theorem shows inconsistency in a "tendentiously chosen" axiom set**  
     - *What’s right*: IIA *is* uniquely vulnerable. Unlike Pareto or unrestricted domain, IIA lacks intuitive appeal and is violated by reasonable rules (Borda, Copeland).  
     - *What’s wrong*: IIA is not arbitrary; it enables Arrow’s proof by allowing "decisive coalition" construction. Without IIA, we cannot isolate pairs (e.g., {A, B}) to show that a coalition decisive for A-vs-B is decisive for all pairs. Thus, the theorem is not an inconsistency in a "biased" set but a revelation that *any* ordinal rule satisfying Pareto and unrestricted domain must either violate IIA or be a dictatorship.  
     - *What survives*: Rejecting IIA escapes the theorem, but not the underlying problem: aggregating rankings fairly.  

  3. **Claim: The practical choice of voting rule is untouched**  
     - *What’s right*: Many rules (Borda, Approval) violate IIA and are used in practice.  
     - *What’s wrong*: The theorem forces a trade-off: rules satisfying IIA (e.g., plurality) suffer other flaws (e.g., ignoring preferences beyond first choice). Violating IIA introduces new problems: Borda’s sensitivity to "clones" (like D, which split votes) incentivizes strategic nomination.  
     - *What survives*: The theorem *informs* practical choice by showing no rule satisfies all democratic desiderata.  

  **Part C: Broader Implications**  
  Rejecting IIA does not resolve Arrow’s normative difficulty for two reasons:  
  - **Enriched-information route (cardinal utilities)**: Using cardinal/interpersonally comparable utilities (e.g., utilitarianism) escapes the theorem but faces its own issues: utilities are unobservable, and interpersonal comparisons are ethically fraught.  
  - **Restricted-domain route (single-peaked preferences)**: This satisfies Arrow’s axioms but only by excluding "divisive" preferences (e.g., extremist rankings), which is undemocratic.  

  The core problem persists: *either* we demand more information than rankings provide (cardinal utilities), *or* we restrict voter sovereignty (domain restrictions). Arrow’s theorem relocates the difficulty—it does not disappear.  

  ---

  ### 3. Marking Scheme (25 marks)**  
  **Part A: Borda Calculations (10 marks)**  
  - Correct full-profile scores and ordering: **3 marks**  
    - Error: Arithmetic mistakes (-1 to -2).  
  - Correct reduced-profile scores and ordering: **3 marks**  
    - Error: Incorrect Borda scaling (-2).  
  - Explanation of change: **4 marks**  
    - Must note: Borda uses global rankings; removal reshuffles positions (e.g., Bloc 2’s C loses 3 points, B gains 1).  
    - Error: Vague appeal to "intensity" or "strategic voting" (-2).  

  **Part B: Critique Evaluation (10 marks)**  
  *Claim 1 (3 marks)*:  
  - Right: IIA forbids using ranking positions to infer strength.  
  - Wrong: Rankings lack intensity data; Borda uses configuration.  
  - Error: Conflating Borda’s ranking-based points with cardinal utility (-1).  
  *Claim 2 (4 marks)*:  
  - Right: IIA is defensible.  
  - Wrong: IIA enables coalition-based proof; not a "grab-bag."  
  - Error: Calling the theorem "about dictatorship" without explaining IIA’s role (-1).  
  *Claim 3 (3 marks)*:  
  - Right: Rules violating IIA exist.  
  - Wrong: Theorem reveals unavoidable trade-offs (e.g., Borda’s clone sensitivity).  
  - Error: Stating Arrow proves ranked-choice voting "impossible" (-2; it proves no rule satisfies all axioms).  

  **Part C: Broader Implications (5 marks)**  
  - Distinguish escaping theorem vs. problem: **2 marks**  
  - Address cardinal utilities: **1.5 marks**  
    - Error: Asserting Arrow assumes interpersonal comparisons (-1).  
  - Address single-peakedness: **1.5 marks**  
    - Error: Presenting it as a "solution" without noting domain restriction (-1).  

  **Boundary between First-Class (>18) and Good (15–18)**:  
  - First-class: Explicitly argues that rejecting IIA *relocates* (not resolves) the problem (e.g., to cardinality or domain restrictions).  
  - Good: Correctly evaluates claims but treats IIA rejection as "settling" the issue.  

  **Common Deductions**:  
  - Conflating Arrow with Gibbard-Satterthwaite: -3  
  - Claiming theorem shows ranked-choice voting "impossible" or "unfair": -2  
  - Equating clone dependence and strategic voting: -2  
  - Asserting Arrow assumes interpersonal comparisons: -2  
  - Invoking single-peakedness without noting domain restriction: -2
