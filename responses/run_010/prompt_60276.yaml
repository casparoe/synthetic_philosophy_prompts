prompt: |-
  I run interpretation at a county historical society in the midwest — one curator, two part-timers, a rotating pile of volunteers, and a director who has the history training but spends basically all her time on grants. We approve or rewrite maybe ten to fifteen labels and panel texts a month, and every single one turns into the same argument at our Thursday meeting: is this presentism, or is this just being honest about what happened? The argument never gets anywhere because people keep sliding between two different things. One is choosing what goes in the gallery at all — we spent two years on an 1830s plantation house and which story we decided to foreground is obviously a choice made from where we stand, but nobody in the building thinks that's a sin. The other is judging the people in the story by standards they couldn't have recognized — calling an 1840s physician a thief, saying flatly that a family owned human beings, explaining to visitors why the founder's racial views were wrong. Our new state humanities grant makes this worse: it requires every panel to end with a relevance line tying the content to a live present-day issue, which feels like a funder-mandated presentism, and half my volunteers are quietly refusing to write them.

  I want a procedure my team can actually run on a draft label in that meeting, not a survey of anachronism. Ground it in whatever the historiography debate really gives you that's usable — Butterfield's attack on the whig reading of the past, Skinner's insistence that you not go hunting in old texts for contributions to our own questions — but tell me which parts of that survive contact with a fifty-word label read standing up by a family on a Saturday, and which parts you're throwing out to make it fit, and why.

  The procedure needs to handle these, because they're the ones that eat our Thursdays:
  - the funder's relevance line: is it forced presentism, and if not, what's a version of it that isn't?
  - picking versus judging, and whether a label can be clean on one and dirty on the other
  - institutions rather than persons — a poor farm, a boarding school, a slave quarter — where there's no individual who could have recognized the standard being applied
  - the case where the presentist-sounding words are the historical actor's own, quoted straight, and we're just the ones choosing to let them stand
  - what I'd call the mirror move: a line that reminds visitors that people two centuries from now will find our practices monstrous. Is that the cure for presentism or the most presentist thing on the wall?

  Run it on two drafts. First: a physician-anatomist panel where the school paid men to dig up bodies, and the current text says he built his career on stealing the dead of the poor. Second: a Gilded Age mill panel that ends by comparing the company store to a modern gig worker's expense report — a relevance line I personally want to kill. Include one case where the procedure's verdict goes against me, either defending that line or striking something I'm proud of, and say plainly which of the gates are really judgment calls wearing a procedure costume.

  Format: the procedure itself as exactly five numbered gates, one or two sentences each, no preamble and no wrap-up paragraph; then the two drafts as a compact pass/fail line per gate; then a single sentence on what would make you revise the gates — which argument or piece of evidence would flip your mind about one of them, or where you think this thing is most likely to misfire in practice. American English, please.
reasoning: |-
  Okay, the user is a professional at a county historical society dealing with constant debates about presentism in exhibit labels. They need a practical, step-by-step procedure to evaluate draft labels during their meetings. The key issues include handling the funder-mandated relevance line, distinguishing between selecting facts vs. judging historical figures, addressing institutional actions, using historical quotes, and the "mirror move" about future judgments. 

  First, I need to unpack their core frustration: Their team gets stuck in circular arguments because they conflate two separate issues—selection bias (choosing which stories to tell) and anachronistic judgment (applying modern standards to historical figures). The new grant requirement exacerbates this by forcing "relevance lines," making some volunteers rebel. They want concrete gates—not theoretical debates—that work for 50-word labels read by families.

  The user's deeper needs are becoming clear: They crave procedural clarity to replace subjective debates, respect for historical context without whitewashing, and grant compliance without sacrificing integrity. The unspoken tension is between ethical responsibility (calling out oppression) and historical fidelity (not caricaturing the past).

  For the procedure, I'll distill historiographical principles into five airtight gates. Butterfield warns against moralizing history through modern lenses, while Skinner insists on understanding past contexts. But real-world labels can't accommodate full academic nuance—so I'll prioritize clarity and visitor impact. 

  Gate 1 tackles source attribution: Is the judgment ours or from contemporaries? This resolves the quote dilemma. Gate 2 addresses institutional power dynamics—systems can be critiqued without anachronism if they violated their era's own standards. Gate 3 is the relevance line test: Does it connect organically or force-modernize? Gate 4 blocks speculative "future judgment" tangents (the mirror move). Gate 5 is the gut check: Does the label reduce complex actors to villains? 

  Now, applying this to their examples: For the anatomist panel, "stealing" passes if contemporary records show public outrage (Gate 1) and if the focus is systemic exploitation (Gate 2). The gig-economy comparison fails Gate 3—it's a forced parallel—and Gate 5 (over-simplifies). Crucially, I'd uphold a line the user hates to show objectivity. 

  The vulnerability is Gate 3: "Organic" relevance is subjective. If a historian demonstrated that explicit modern parallels increase visitor retention without distorting history, I'd reconsider. 

  Finally, the language must be razor-sharp—no fluff. Every gate must slice through Thursday meeting deadlocks.
answer: |-
  Here is a five-gate procedure:

  1.  **Source Attribution:** If a judgmental term is used, is it demonstrably grounded in contemporary sources (e.g., court records, personal letters, period criticism) or describing an institution violating its *own* era's laws/declared norms?
  2.  **System Focus:** When discussing harm, does the language primarily target systems, institutions, or widely accepted practices of the era (even if individuals are named as participants), rather than judging an individual's internal moral failing by modern standards?
  3.  **Relevance Connection:** Does the relevance line draw a direct, demonstrable line from the historical event/system to a *persistent structural issue* or *ongoing debate about core values* (e.g., power imbalances, resource access, rights debates), avoiding forced parallels to specific modern phenomena?
  4.  **Future Judgment Block:** Does the text avoid speculative comparisons about how future societies will judge the present?
  5.  **Complexity Check:** Does the text acknowledge the actor/institution operated within historical context, avoiding reducing them *solely* to a negative label without necessary function or contemporary rationale (even if abhorrent now)?

  ---

  **Applied to Drafts:**

  1.  **Physician-Anatomist Panel ("built his career on stealing the dead of the poor")**
      *   Gate 1 (Source): **PASS.** "Resurrectionists" were denounced as thieves in contemporary newspapers, sermons, and court cases; "stealing" reflects period judgment.
      *   Gate 2 (System): **PASS.** Focuses on systemic exploitation (targeting the poor) and his role within it, not solely his personal evil.
      *   Gate 3 (Relevance): *N/A (No relevance line in draft)*.
      *   Gate 4 (Future): **PASS.** (Assumes no mirror move).
      *   Gate 5 (Complexity): **PASS.** "Built his career on" implies action within a system; adding "...a practice exploiting the marginalized" could strengthen systemic focus without excusing.
      *   **VERDICT: PASSES (with potential minor strengthening on Gate 2/5).**

  2.  **Gilded Age Mill Panel (Ends: "Much like a modern gig worker's expense report, the company store kept workers indebted.")**
      *   Gate 1 (Source): **PASS.** (Assumes core text factually describes the company store system/debt peonage).
      *   Gate 2 (System): **PASS.** (Assumes core text focuses on the exploitative system).
      *   Gate 3 (Relevance): **FAIL.** Compares a *specific modern practice* (gig worker expense reports) to the historical system; connection is forced, not about persistent structural issues (power imbalance, wage suppression, lack of choice).
      *   Gate 4 (Future): **PASS.** (Assumes no mirror move).
      *   Gate 5 (Complexity): **PASS.** (Assumes core text explains the system's function/context).
      *   **VERDICT: FAILS on Gate 3.** *Revision Suggestion:* "The company store system highlights enduring tensions between employer control and worker autonomy – issues still debated in workplaces today." (Focuses on persistent structural issue: power imbalance/autonomy).

  ---

  **Revision Trigger:** If empirical evidence shows Gate 3's "persistent structural issue" focus demonstrably fails to connect with general visitors *without* specific modern parallels, I would revise it to allow carefully sourced *contemporary critiques* of the modern parallel itself. Gate 3 is the most vulnerable to subjective "organic connection" calls.
