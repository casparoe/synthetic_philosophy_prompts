  We are constructing a case that satisfies the following:
  1. A scarce good is allocated by aggregating endorsed preferences via a deliberative process with full disclosure.
  2. The chosen option is Pareto-borva better (unanimously preferred by all when fully informed) than alternatives.
  3. No deception, coercion, or withholding of information.
  4. After the outcome, every person repudiates the outcome because the experience changed their values.

  The twist: the experience of the outcome alters the individuals' preferences such that they now disvalue the outcome they previously endorsed.

  We need to avoid:
  - Sci-fi and weird tech.
  - Stock examples (cochlear implants, having a child, religious conversion).
  - Manipulation via hidden information or adaptive preference formation at the time of endorsement.

  Let's design a scenario:

  **Scenario: Urban Green Space Allocation in a Dense City**

  A city with very limited available land must allocate a newly acquired parcel (the only one for the foreseeable future) to one of two competing uses: a community garden (providing fresh produce and a communal gathering space) or a pocket park (providing passive recreation and biodiversity). The city uses a citizens' assembly: a representative group of residents is selected, provided with full information (including expert reports on environmental impact, social benefits, and long-term sustainability), and engages in facilitated deliberation. After thorough discussion, the assembly unanimously endorses the community garden as the best use because it addresses immediate food insecurity and builds social cohesion. The system allocates the land accordingly.

  However, once built, the community garden becomes a focal point for social conflict (over plot allocation, water usage, and noise) and fails to produce significant yields due to soil contamination that was previously undiscovered because it was undetectable by standard tests (but note: we cannot withhold information). So we cannot use that.

  Alternative: The garden is built and is successful in producing food and fostering community. But over time, the very success leads to unexpected changes. The garden becomes so popular that it causes increased foot traffic, noise, and a sense of loss of privacy for adjacent residents. Moreover, the intense community interaction leads to the formation of cliques and social stratification (e.g., between those who have plots and those who don't, or between long-time gardeners and newcomers). These changes cause residents to re-evaluate their priorities: they now value tranquility and privacy over community engagement and fresh produce. They repudiate the garden and wish they had chosen the park.

  But note: we required full disclosure. The potential for social conflict and increased noise should have been disclosed. If disclosed, why did they endorse the garden? We need a change that could not have been anticipated even with full information, but that is experiential.

  Revised scenario:

  **The Case: Water Rationing in a Drought-Stricken Region**

  A regional water authority must impose permanent rationing on residential water use due to a prolonged drought. The two options are:
  A. **Uniform rationing**: every household gets the same fixed allocation, enforced by smart meters that cut off after the limit.
  B. **Tradable rations**: each household gets an equal allotment of water credits, which can be traded (so households that want more water can buy from those who use less).

  A citizens' assembly, representing all households, is convened. Experts present data on the drought severity, the ecological and economic impacts, and the projected outcomes of each system. The assembly deliberates and unanimously endorses the tradable rations system (B) because it allows flexibility, rewards conservation by those who don't need their full share (through income from selling credits), and is expected to be more efficient. They believe it will be fairer and more effective.

  The system is implemented. Initially, it works as expected. However, over time, the market for water credits leads to unintended social consequences: wealthy households buy up credits from low-income households, creating a situation where the poor are forced to live with very little water (even less than the uniform ration would have provided) while the rich maintain lush gardens and pools. This causes public outrage and a sense of injustice. The experience of seeing such stark inequality in a basic necessity changes the values of the community. They now believe that water, as a basic human right, should not be subject to market forces. They repudiate the tradable rations system and wish they had chosen uniform rationing.

  But note: the potential for such market outcomes was disclosed. The experts would have presented models showing that trading could lead to unequal outcomes. Why did the assembly endorse it? Perhaps they underestimated the emotional impact of seeing neighbors suffer? But that is experiential. However, we must also satisfy that at the time of endorsement, the tradable rations were unanimously preferred to uniform rationing. If they knew the potential for inequality, why did they prefer it? We need a case where the preference change is due to the experience of living with the outcome, not because of new factual information.

  Alternative: The assembly is told that trading could lead to inequality, but they believe that the efficiency gains and the ability of the poor to earn income outweigh the risks. After living with it, they experience the hardship of the poor and the callousness of the rich, and they come to reject the entire market-based approach. This is a change in values: they now prioritize equity over efficiency. 

  That might work. But we have to ensure that at the time of endorsement, they were fully informed and still preferred the tradable system. And that the change is in values, not just in beliefs about consequences.

  Let's formalize:

  **Scenario Paragraph:**

  In a drought-stricken region, a water authority must choose between two rationing systems for residential water: uniform fixed rations for every household (A) or a tradable water credit system (B). A citizens' assembly, representative of the affected population, is convened. Experts disclose all relevant facts: the severity of the drought, the projected water savings of each system, the potential for market-based systems to create inequality (including models showing that low-income households might sell credits and then face hardship), and the potential efficiency gains from trading. After deliberation, the assembly unanimously endorses system B, judging that the benefits of flexibility and efficiency outweigh the risks of inequality. They prefer B to A. The system is implemented. Over time, the assembly members (and the broader community) witness the emergence of severe water inequality: low-income families are forced to sell their credits and then endure extreme water austerity, while the wealthy consume lavishly. This lived experience causes a shift in values: the community now views water as a fundamental right that should not be commodified. They repudiate system B and wish they had chosen system A, even though at the time of decision, with full information, they unanimously preferred B.

  **Walk-through:**

  1. **Aggregation rule**: The system aggregates preferences by convening a citizens' assembly that deliberates with full information and aims for consensus. The rule is: if there is unanimous endorsement of one option after full disclosure and deliberation, that option is chosen.

  2. **Firing correctly**: The assembly did unanimously endorse option B after full disclosure and deliberation, so the system correctly implemented B.

  3. **Pareto and disclosure**: At the time of decision, every member of the assembly (representing the affected population) preferred B to A (and to any other alternative), so B is Pareto-superior. Full disclosure of all known facts (including the risk of inequality) was made.

  4. **Repudiation**: After experiencing the outcome, every member repudiates B because the experience changed their values: they now prioritize non-commodification of basic necessities over efficiency and flexibility.

  **The feature doing the work**: The key feature is that the experience of living under the chosen system causes a shift in fundamental values (from efficiency to equity in the case of basic resources). This shift is not due to new information (which was already disclosed) but to the affective and moral experience of witnessing the consequences.

  **If we delete that feature**: If the value shift does not occur (i.e., if the experience does not change their values), then there would be no repudiation. Without the value shift, the case collapses because the repudiation is the key. If we delete the experiential component and instead the repudiation is due to new information (e.g., they discover that the experts lied about the models), then it becomes a manipulation case. If the repudiation is due to adaptive preferences (e.g., if they had chosen A and then adapted to it and started to like it), that would be the Elster case. But here, the repudiation is due to a genuine change in values caused by the experience of the outcome.

  **Three best replies from a preference-satisfaction theorist**:

  1. **The repudiating person is not the same person who endorsed the decision**: The person after the experience has different values and thus is a different person in a relevant sense. Therefore, the preference satisfaction of the past person is still valid, and the system satisfied the preferences at the time.

     *Does it work?* In this setup, the physical person is the same, but their values have changed. The theorist might argue that the system is designed to satisfy the preferences at the time of decision, and it did so. The change in preferences does not invalidate that. However, the case is built to show that the system's own choice alters the preferences by which it is judged. The reply might be accepted by the theorist as a defense: the system did its job. But the case is meant to challenge whether that job is sufficient for alignment. The reply works in the sense that the system did what it was supposed to do, but it doesn't address the problem that the system's action changed the metric for its own success.

  2. **The system should have accounted for preference change**: A good system would anticipate that preferences might change and either incorporate that into the decision (e.g., by discounting future preference changes) or use a more stable set of preferences (e.g., second-order preferences). In this case, the assembly did not consider the possibility of their values changing in response to the outcome.

     *Does it work?* The system in the case did not do that, but the theorist might argue that it should have. However, the case is set up so that at the time of decision, with full information, they unanimously preferred B. How could they have accounted for a value change that only occurs because of the experience? They might have tried to imagine it, but the affective component is hard to simulate. This reply points to an extension of the system but does not negate the case as presented.

  3. **The outcome is still Pareto-better at the time of decision, and that's what matters**: The system is designed to satisfy the preferences at the time of the decision. The fact that preferences change later doesn't mean the decision was wrong. The system is not responsible for future preference changes.

     *Does it work?* This is similar to reply 1. It defends the system's decision as correct by its own lights. The case is meant to challenge whether that is sufficient for alignment over time. The reply works as a defense of the system's action but does not address the problem that the system's action induced the change that made it unsatisfactory.

  **One-sentence tweak**:

  To fix the case so the aggregator gets it right, change the system to include a trial period with both options in different neighborhoods, allowing the assembly to experience the consequences before making a permanent decision.

  This tweak addresses the experiential gap by providing the key experience before the final decision.
answer: |-
  ### Scenario: Urban Noise Regulation in a Residential Zone
  A city faces persistent noise complaints in a dense, mixed-use district due to competing interests: residents demand quiet at night, while bars/restaurants seek extended hours for economic survival. A citizens' assembly (representing residents and business owners) is convened with full disclosure: acoustic data, economic impact studies, health effects of sleep disruption, and legal constraints. After deliberation, they unanimously endorse a "dynamic curfew" system (A) using smart noise sensors to adjust closing times nightly based on real-time decibel levels (e.g., quieter nights allow later closures). This is preferred over a fixed 10 PM curfew (B) or a 2 AM curfew (C), as it balances livability and commerce. Post-implementation, the system reduces initial complaints, but over months, residents experience chronic low-level stress from unpredictability (e.g., inability to plan sleep routines), while businesses face revenue volatility. This lived experience fosters a shared shift in values: both groups now prioritize stability over optimization. They repudiate A, wishing they had chosen B or C, despite their initial endorsement.

  ### Walkthrough
  1. **Aggregation rule**: The system selects the option unanimously endorsed by the citizens' assembly after full disclosure and deliberation, provided it is Pareto-superior to alternatives.  
  2. **Correct firing**: The assembly unanimously preferred A over B and C after reviewing all facts (e.g., economic models showing higher business failure risk under B; health data showing sleep disruption under C). No coercion or deception occurred—participation was voluntary, experts answered all questions, and data was public.  
  3. **Pareto and disclosure satisfied**:  
     - *Pareto-better*: At decision time, every member preferred A to B (residents valued noise reduction flexibility; businesses valued revenue potential) and A to C (residents valued quieter nights; businesses valued later closures). No alternative was preferred by any member.  
     - *Full disclosure*: All information was shared—e.g., sensor reliability stats, volatility risks, and precedents from other cities. Members acknowledged unpredictability as a trade-off but deemed it acceptable.  
  4. **Repudiation cause**: The outcome itself—living with unpredictable noise/income—reshaped values. Residents now intrinsically value routine stability (e.g., consistent sleep schedules) over adaptive optimization; businesses now value predictable income over growth potential. This is not regret over process (which was transparent) or new facts (e.g., sensor flaws), but a value shift *induced by the experience* of the outcome.  

  ### Key Feature Doing the Work
  **The experience of sustained unpredictability generated a shared value shift from efficiency/optimization to stability/security**. This is irreducibly affective and moral—living with the system’s "balanced" outcome made stability a newly salient, non-negotiable good.  
  - **If deleted**: Without this experiential value shift, the case collapses into an **adaptive preferences issue** (e.g., if repudiation arose from resignation to a suboptimal outcome). Here, the shift is *transformative*: pre-decision preferences were not adaptive (they were stable and informed), but the outcome *created* new values ex post.  

  ### Three Replies from a Preference-Satisfaction Theorist
  1. **"The repudiator is not the same person who endorsed"**:  
     - **Reply**: This works partially. The theorist argues pre- and post-outcome individuals are "different" due to value shifts, so satisfying the former’s preferences remains valid.  
     - **Why it fails here**: Your setup blocks this by design. The physical and psychological continuity of the person is unchanged—no neuro/cognitive breaks exist. The shift is in *values*, not identity (e.g., a business owner who valued growth now values stability but remains the same legal/biological entity). The system’s goal was alignment with *current* endorsed preferences, but it altered the metric for future alignment.  

  2. **"The system should aggregate meta-preferences"**:  
     - The theorist argues the assembly should have considered second-order preferences (e.g., "we value not having volatile values") during deliberation.  
     - **Counter**: Full disclosure included volatility risks, but meta-preferences for value stability weren't salient pre-experience. The case shows such meta-aggregation is impossible without lived context.  

  3. **"Ex post repudiation doesn’t invalidate ex ante Pareto"**:  
     - The theorist maintains the decision was correct because it maximized welfare at time T0. Future dissatisfaction is irrelevant to T0 alignment.  
     - **Counter**: This ignores the system’s goal of *enduring* alignment. If outcomes consistently reshape preferences to reject past choices, the aggregator undermines itself recursively.  

  ### One-Sentence Tweak
  **Change the aggregation rule to require a short-term pilot implementation (e.g., 1 month) before final endorsement**, allowing the assembly to experience the outcome’s affective impact and incorporate it into preferences.
