   The ticket: 
     Flip a fair coin until first heads. If heads first appears on flip n, the ticket pays:
        payoff(n) = (-1)^(n+1) * (2^n / n)   [classroom dollars]

   The probability of state n (i.e., first heads on flip n) is (1/2)^n = 2^(-n).

   The probability-weighted contribution for state n is:
        a_n = [ (-1)^(n+1) * 2^n / n ] * (1/2^n) = (-1)^(n+1) / n.

   So the series of terms is:
        a_1 = +1
        a_2 = -1/2
        a_3 = +1/3
        a_4 = -1/4
        ...

   This is the alternating harmonic series, which converges conditionally to ln(2) ≈ 0.693.

   However, by the Riemann rearrangement theorem, the series can be rearranged to converge to any real number, or diverge.

