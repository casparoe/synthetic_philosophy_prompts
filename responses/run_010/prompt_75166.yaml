  ### In-Class Game Design: Infinite vs. Undefined Expected Value

  **Objective:** Students experience the indeterminacy of expected value (EV) when the series is conditionally convergent (but not absolutely convergent) through hands-on computation and bidding. The ticket pays \((-1)^{n+1} \cdot 2^n / n\) classroom dollars if heads first appears on flip \(n\), with probability \(2^{-n}\).

  **Setup:**
  - **Tickets:** Each student receives an identical ticket (description above).
  - **Protocol Cards:** Sealed envelopes containing one of four tallying protocols (assign 3–4 students per protocol). Cards include:
    1. **Rule** for term order.
    2. **First 12 terms** (pre-calculated decimals for easy arithmetic).
    3. **Worksheet** to compute partial sums \(S_1\) to \(S_{12}\).
    4. **Space** to extrapolate the long-run limit (EV estimate).
  - **Bidding:** Tokens (scrap paper) for sealed bids. Students bid their EV estimate after calculations.
  - **Auction Scoring:** Declare that scoring is "by closeness to the ticket’s true EV"—but reveal later that **no true EV exists**, making all bids "losses."

  ---

  ### Protocol Cards (Sealed)
  *(Include in each envelope: rules, terms, worksheet.)*

  #### **Protocol A: Natural Order (Flip Sequence)**  
  - **Rule:** Add terms in order of \(n = 1, 2, 3, \dots\)  
  - **Terms:**  
    \(n=1\): \(+1.0000\)  
    \(n=2\): \(-0.5000\)  
    \(n=3\): \(+0.3333\)  
    \(n=4\): \(-0.2500\)  
    \(n=5\): \(+0.2000\)  
    \(n=6\): \(-0.1667\)  
    \(n=7\): \(+0.1429\)  
    \(n=8\): \(-0.1250\)  
    \(n=9\): \(+0.1111\)  
    \(n=10\): \(-0.1000\)  
    \(n=11\): \(+0.0909\)  
    \(n=12\): \(-0.0833\)  
  - **Worksheet:**  
    \(S_1 = 1.0000\)  
    \(S_2 = 1.0000 - 0.5000 = 0.5000\)  
    \(S_3 = 0.5000 + 0.3333 = 0.8333\)  
    ... (continue to \(S_{12}\))  
  - **Extrapolate Limit:** \(S_{12} \approx 0.6532\); trends toward **~0.693** (ln 2).  

  #### **Protocol B: Two Positives per Negative (Optimistic)**  
  - **Rule:** Add two positive terms (odd \(n\)), then one negative (even \(n\)). Repeat.  
  - **Terms:**  
    \(1\): \(+1.0000\) (n=1)  
    \(2\): \(+0.3333\) (n=3)  
    \(3\): \(-0.5000\) (n=2)  
    \(4\): \(+0.2000\) (n=5)  
    \(5\): \(+0.1429\) (n=7)  
    \(6\): \(-0.2500\) (n=4)  
    \(7\): \(+0.1111\) (n=9)  
    \(8\): \(+0.0909\) (n=11)  
    \(9\): \(-0.1667\) (n=6)  
    \(10\): \(+0.0769\) (n=13)  
    \(11\): \(+0.0667\) (n=15)  
    \(12\): \(-0.1250\) (n=8)  
  - **Worksheet:**  
    \(S_1 = 1.0000\)  
    \(S_2 = 1.0000 + 0.3333 = 1.3333\)  
    \(S_3 = 1.3333 - 0.5000 = 0.8333\)  
    ... (continue to \(S_{12} \approx 0.9801\))  
  - **Extrapolate Limit:** Trends toward **~1.040** (1.5 ln 2).  

  #### **Protocol C: One Positive per Two Negatives (Pessimistic)**  
  - **Rule:** Add one positive (odd \(n\)), then two negatives (even \(n\)). Repeat.  
  - **Terms:**  
    \(1\): \(+1.0000\) (n=1)  
    \(2\): \(-0.5000\) (n=2)  
    \(3\): \(-0.2500\) (n=4)  
    \(4\): \(+0.3333\) (n=3)  
    \(5\): \(-0.1667\) (n=6)  
    \(6\): \(-0.1250\) (n=8)  
    \(7\): \(+0.2000\) (n=5)  
    \(8\): \(-0.1000\) (n=10)  
    \(9\): \(-0.0833\) (n=12)  
    \(10\): \(+0.1429\) (n=7)  
    \(11\): \(+0.1111\) (n=9)  
    \(12\): \(+0.0909\) (n=11)  
  - **Worksheet:**  
    \(S_1 = 1.0000\)  
    \(S_2 = 1.0000 - 0.5000 = 0.5000\)  
    \(S_3 = 0.5000 - 0.2500 = 0.2500\)  
    ... (continue to \(S_{12} \approx 0.6532\))  
  - **Extrapolate Limit:** Trends toward **~0.347** (0.5 ln 2).  

  #### **Protocol D: Greedy Targeting (Converge to 1.0)**  
  - **Rule:** Add terms to push partial sum toward 1.0. If \(S_k < 1.0\), add largest unused positive; if \(S_k \geq 1.0\), add largest unused negative.  
  - **Terms:**  
    \(1\): \(+1.0000\) (n=1)  
    \(2\): \(-0.5000\) (n=2)  
    \(3\): \(+0.3333\) (n=3)  
    \(4\): \(+0.2000\) (n=5)  
    \(5\): \(-0.2500\) (n=4)  
    \(6\): \(+0.1429\) (n=7)  
    \(7\): \(+0.1111\) (n=9)  
    \(8\): \(-0.1667\) (n=6)  
    \(9\): \(+0.0909\) (n=11)  
    \(10\): \(-0.1000\) (n=10)  
    \(11\): \(+0.0769\) (n=13)  
    \(12\): \(-0.1250\) (n=8)  
  - **Worksheet:**  
    \(S_1 = 1.0000\)  
    \(S_2 = 1.0000 - 0.5000 = 0.5000\)  
    \(S_3 = 0.5000 + 0.3333 = 0.8333\)  
    ... (continue to \(S_{12} \approx 0.9131\))  
  - **Extrapolate Limit:** Oscillates but converges to **1.0** (by design).  

  ---

  ### In-Class Procedure
  1. **Distribute Materials** (5 mins):  
     - Tickets + sealed protocol envelopes.  
     - Emphasize: "Do not discuss protocols—compute independently."  
  2. **Compute Partial Sums** (15 mins):  
     - Students open envelopes, calculate \(S_1\) to \(S_{12}\) using phone calculators.  
     - Extrapolate the infinite-series limit (EV) from the trend.  
  3. **Sealed Bids** (5 mins):  
     - Write EV estimate on token (scrap paper) with protocol letter.  
     - Collect tokens in a box.  
  4. **Auction & "Scoring"** (5 mins):  
     - Announce: "I’ll score bids by closeness to the true EV. Closest bid wins."  
     - Reveal bids on the board grouped by protocol.  
     - Declare: "No one wins. The true EV doesn’t exist—all bids lose."  

  ---

  ### Predictable Challenges & Pitfalls
  1. **Student Rebellion ("Flip Order is Sacred"):**  
     - A student (likely Protocol A) insists: "EV must use physical flip order!"  
     - **Response:** "Why? States are mutually exclusive. If order changes EV, is there a 'correct' order? What if states aren’t ordered?"  
  2. **Arithmetic Errors:**  
     - Some students will mis-add decimals. Mitigate with pre-calculated terms.  
  3. **Misinterpreting Trends:**  
     - Protocol D’s \(S_{12} = 0.9131\) may not "feel" convergent to 1.0. Reassure: "More terms oscillate but approach 1.0."  
  4. **Frustration with Finite Sums:**  
     - Students note finite sums are order-invariant. **Key reply:** "The *infinite* EV is undefined. Finite truncations hide this—you’re seeing approximations of different limits."  
  5. **Bid Confusion:**  
     - Some may bid \(S_{12}\) instead of extrapolated EV. Clarify: "Bid your limit estimate, not \(S_{12}\)."  

  ---

  ### Debrief (20 mins)
  **Link Activity to Theory:**  
  1. **Indeterminacy Revealed:**  
     - "Bids spanned ~0.35 to ~1.04. Why?" → Different protocols = different term orders = different limits.  
     - "The series \(\sum (-1)^{n+1}/n\) converges *conditionally* (to ln 2 if summed in order) but **not absolutely** (since \(\sum 1/n\) diverges)."  
  2. **Riemann Rearrangement Theorem (Unmasked):**  
     - "Conditional convergence allows reordering to hit any real number—or diverge. Your protocols did this:  
       - A: Natural order → ln 2 ≈ 0.693  
       - B: Two +/one – → 1.5 ln 2 ≈ 1.040  
       - C: One +/two – → 0.5 ln 2 ≈ 0.347  
       - D: Greedy → 1.0"  
  3. **Expected Value Requires Absolute Convergence:**  
     - "EV is undefined here. Why? Infinite sums must be invariant to reordering (absolute convergence) to be well-defined."  

  **Standard Exits (and Costs):**  
  - **Truncate the Lottery:** Ignore states beyond \(n = N\).  
    - *Cost:* Misses tail behavior. EV is finite but arbitrary (depends on \(N\)).  
  - **Dominance Argument:** Compare to a ticket paying $1 less in every state.  
    - *Cost:* Fails—no dominance. (Our ticket has unbounded positive/negative payoffs.)  
  - **Bar Admissibility:** Reject such lotteries as "inadmissible."  
    - *Cost:* Rules out realistic heavy-tailed distributions (e.g., financial derivatives, research grants).  

  ---

  ### Limitation of the Activity
  - **Finite Sums ≠ Indeterminacy:** Any finite partial sum (\(S_{12}\)) is order-invariant. Students only *compute approximations* of different limits—they don’t "see" indeterminacy directly.  
  - **Workaround:** Stress that the *infinite* series is the issue: "Finite sums are stable, but the EV requires summing *all* states. Rearrangement proves this sum is fragile."  

  This game forces confrontation with conditional convergence. Students intuit the problem before naming it, setting up a rich debate on decision-theoretic foundations. Run it, then let them wrestle with the exits!
