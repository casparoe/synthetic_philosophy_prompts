  My seed design: hand every student an identical ticket plus a sealed tallying protocol — add two positive terms for every negative one, add one positive for every two negatives, add greedily toward a stated target — have them compute running totals and then place sealed token bids, and score the auction by closeness to the ticket's true expected value, a score no one can earn. Please deliver the protocol cards with their first dozen terms and long-run limits worked out, worksheet arithmetic doable on a phone calculator, the token and bidding mechanics, and a debrief that ties each round to the unstated assumption that expected value requires absolute convergence, then to the standard exits — truncating the lottery, invoking dominance against a variant that pays a dollar less in a single state, or barring such lotteries as inadmissible — with the cost of each. Tell me what will predictably go wrong on the first run, including the student who insists the flip order is simply the physically correct one, and be candid about the feature the activity cannot reproduce: any finite tally is order-invariant as a finite sum, so the indeterminacy itself must be argued rather than shown.
