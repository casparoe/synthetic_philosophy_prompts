  We are analyzing the declassification of homosexuality in the DSM (1973-74) through Ian Hacking's concept of looping effects and interactive kinds. Hacking distinguishes between "natural kinds" (which are indifferent to how we classify them) and "human kinds" (which interact with their classifications). The key idea is that when we classify people, they become aware of the classification and may alter their behavior, self-understanding, or even their very nature, which in turn can lead to a revision of the classification. This creates a feedback loop.

  The case at hand involves the removal of homosexuality as a mental disorder from the DSM. We are to trace the loop in both directions (downward: classification affecting people; upward: people affecting the classification). We must also address the subsequent introduction of "ego-dystonic homosexuality" and its implications for the looping framework.

  Facts (as provided and verified):
  - DSM-II (1968) listed homosexuality under "Sexual Deviations".
  - Activism: Starting in 1970, activists (including Frank Kameny and Barbara Gittings) disrupted APA conventions. In 1971, they continued, and in 1972, John Fryer (as "Dr. Henry Anonymous") spoke at the APA meeting about the experiences of gay psychiatrists.
  - Robert Spitzer, a key figure in the DSM, interviewed gay individuals who were not psychiatric patients and found that they did not exhibit the distress or impairment typically required for a mental disorder. He argued that the diagnosis was not supported by evidence.
  - December 1973: The APA trustees voted to remove homosexuality as a disorder.
  - Early 1974: The APA membership confirmed the decision by referendum (58% in favor).
  - The replacement in DSM-II (1974) was "Sexual Orientation Disturbance", which was later replaced by "Ego-dystonic Homosexuality" in DSM-III (1980) and removed entirely in DSM-III-R (1987).

  We are to draw the loop explicitly, with stages including:
  1. The initial classification (downward effect).
  2. The reaction of the classified people (upward effect).
  3. Changes in self-understanding and observable behavior (which may feed back into the classification).
  4. The revision of the classification.

  Then, we address the harder questions:
  - What is the status of "ego-dystonic homosexuality"? Is it a looping artifact, a compromise, or evidence that the kind was never interactive?
  - Does the episode confirm, present an anomaly for, or fall outside Hacking's framework?
  - Does the looping machinery allow us to say the original diagnosis was false? What was the role of Spitzer's interviews?

  We must also separate settled from contested issues and mark our own leanings and confidence.

  Let's break down the loop stages:

  Stage 1: Initial Classification (DSM-II, 1968)
  - Classification: Homosexuality as a "Sexual Deviation" (mental disorder).
  - Direction: Downward (classification making up people).
  - Shift in self-understanding: Gay individuals are taught (by the medical and psychiatric establishment) that they are mentally ill. This can lead to internalized homophobia and distress.
  - Observable change: Gay individuals may seek therapy to change their sexual orientation or present with distress related to their identity. This reinforces the diagnosis by appearing as "symptoms".

  Stage 2: Activism and Resistance (1970-1972)
  - Classification: Still in place, but being challenged.
  - Shift in self-understanding: Activists reject the illness model and assert that homosexuality is a normal variant. They form a collective identity as a minority group fighting for rights.
  - Observable change: Protests at APA meetings, public speeches (like Fryer's), and the formation of gay rights organizations. This is an upward effect: the classified people are acting to change the classification.
  - Feedback: The activism brings the issue to the attention of the psychiatric community and forces a reevaluation.

  Stage 3: Spitzer's Intervention (1972-1973)
  - Classification: Under review.
  - Shift in self-understanding: Spitzer interviews non-patient gay individuals who are well-adjusted, which challenges the idea that homosexuality per se is pathological. This is a shift in the understanding of the experts, influenced by the activists and the visibility of well-functioning gay people.
  - Observable change: Spitzer's report and arguments presented to the APA. This is an upward effect because the data comes from the classified group outside the clinical setting.
  - Feedback: The evidence from the interviews is used to argue for declassification.

  Stage 4: Declassification and Replacement (1973-1974)
  - Classification: Removal of homosexuality as a disorder, replaced by "Sexual Orientation Disturbance" (for individuals who are distressed by their homosexuality).
  - Direction: Both downward and upward. The removal is an upward effect (the classified group successfully changed the classification). The new category is a downward effect, creating a new kind: people who are distressed by their sexual orientation.
  - Shift in self-understanding: For the gay community, the declassification is empowering and reduces stigma. However, the new category may lead some to view their distress as a disorder. For psychiatrists, the focus shifts to distress rather than orientation per se.
  - Observable change: Reduction in the number of people diagnosed as "homosexual" but an increase in those diagnosed with the new category. Also, the gay community celebrates the victory and uses it to further civil rights.

  Stage 5: The Fate of Ego-dystonic Homosexuality (1980-1987)
  - Classification: Ego-dystonic Homosexuality (EDH) in DSM-III (1980), removed in DSM-III-R (1987).
  - Direction: Downward (the classification creates a new kind: people distressed by their homosexuality). But note: the removal in 1987 was due to lack of clinical utility and because the distress was seen as a result of societal stigma rather than an inherent disorder. This removal was an upward effect because activism and changing societal attitudes (including within the profession) led to its removal.
  - Shift in self-understanding: Individuals with EDH might seek therapy to change their orientation or alleviate distress. However, the gay rights movement and the removal of homosexuality as a disorder made it increasingly difficult to pathologize any aspect of homosexuality. The diagnosis was seen by many as a way to retain a pathological category for homosexuality under a different name.
  - Observable change: Few clinicians used the EDH diagnosis. Studies showed that the distress was often due to internalized homophobia and social oppression, not an inherent disorder. This led to the removal.

  Now, the harder questions:

  1. **Ego-dystonic homosexuality as a loop artifact?**
     - It can be seen as a compromise: the APA removed the general diagnosis of homosexuality but created a category for those distressed by it. This was a way to placate conservative psychiatrists who still believed in treatment. However, it was also a genuine attempt to address the distress some individuals felt. But note: the distress was not inherent to the sexual orientation but a reaction to societal stigma. Thus, the diagnosis was a looping artifact because the very existence of the category might have perpetuated the idea that such distress was a disorder, and it was used by some therapists to offer conversion therapy. But the diagnosis did not gain much traction and was eventually removed. So, it was a temporary artifact of the loop.

  2. **Does the episode confirm the interactive kinds picture?**
     - Yes, it is a classic example of an interactive kind. The classification of homosexuality as a disorder had profound effects on how gay people saw themselves and how they were treated. Their reaction (activism) changed the classification. The removal then changed the self-understanding and societal attitudes. The subsequent creation and removal of EDH further show the dynamic interaction.

  3. **Does the looping machinery license a verdict on whether the original diagnosis was false?**
     - Hacking's framework is primarily descriptive and avoids making normative claims about the truth of classifications. He is interested in how classifications and people interact, not in whether the classification is "true" in a scientific sense. However, Spitzer's interviews provided evidence that the diagnosis did not fit the criteria for a mental disorder because many gay people were not distressed or impaired. So, the interviews contributed empirical evidence that the classification was not valid. But note: Hacking would say that the truth of the classification is not settled by the looping effects alone. The removal was based on both scientific evidence and political/social pressure. The looping framework does not directly address the truth of the kind, but it does show how the kind evolved.

  Contested issues:

  1. **The 1974 referendum: scientific judgment or political?**
     - Disagreement: Some argue that the removal was a scientific decision based on evidence (Spitzer's interviews and other studies). Others argue that it was a political concession to activism.
     - My read: It was a mix. The evidence played a role, but without the activism, the issue might not have been revisited. The vote was close (58%), indicating that not all psychiatrists were convinced by the evidence. I lean towards it being both scientific and political, with high confidence in the mixed interpretation.

  2. **Was ego-dystonic homosexuality ever diagnosed in meaningful numbers?**
     - Disagreement: Some say it was rarely used and had little clinical impact. Others argue that it was used to justify conversion therapy and was a significant category for a time.
     - My read: It was not widely used. Studies showed low prevalence and it was criticized from the start. I lean towards it being a marginal diagnosis with low confidence (because data is sparse).

  3. **Was the original diagnosis of homosexuality as a disorder false?**
     - Disagreement: Some (like Spitzer) argued that it was false because it did not meet the criteria of causing distress or impairment in all cases. Others might argue that in the context of the time, it was considered true because of prevailing theories (e.g., psychoanalytic). But note: the question of whether it was a mental disorder is now settled in the negative by the psychiatric community.
     - My read: The original diagnosis was false because it pathologized a normal variation of human sexuality. This is now the consensus, but it was contested at the time. High confidence that it is now considered false.

  Hacking's silence: Hacking has not written specifically about this case, to my knowledge. He focuses on other examples (e.g., multiple personality disorder, autism, refugee). So, we are applying his framework.

