  First, I need to unpack the core tension: the panel's current definition would ban routine voter outreach tactics. The user specifically wants criteria, not definitions, and concrete recommendations. The philosophical nuances around autonomy and manipulation must be translated into practical governance language.

  The three features are:
  1) Contact voting notifications - leverages social proof
  2) Artificial scarcity countdown - creates urgency
  3) Fabricated neighbor messages - uses synthetic personalization

  Key data points: 
  - 4% youth turnout increase (significant)
  - 71% user approval but 22% felt "steered"
  - Vendor uses same tactics for profit-driven apps

  The user's personal experience is relevant but shouldn't sway the analysis. Their description of a "decisionless decision" perfectly captures the autonomy concern - but we must avoid assuming illegitimacy.

  Major challenges:
  1) The ends/means problem: Can we allow government use while condemning identical commercial use? Need to articulate a defensible distinction beyond "our goals are good."
  2) Post-hoc consent: Can reported gladness justify methods if those methods shaped the preference?
  3) Practicality: Any criteria must be administrable by non-philosophers.

  Approach structure:
  - Start by showing why current definition is unworkable
  - Propose alternative criteria focusing on distortion and transparency 
  - Distinguish between permissible influence and manipulation 
  - Address the ends/means problem head-on
  - Recommend conditional approval with specific guardrails

  For epistemic transparency:
  - Clearly mark when stating established facts (e.g., scarcity framing's psychological effects) vs contested theories (e.g., whether disclosure neutralizes manipulation)
  - Avoid academic jargon - "social proof" becomes "seeing others participate"

  The recommendation must thread the needle: preserve effective turnout tools while preventing genuine autonomy violations. Conditional approval seems optimal but requires robust safeguards against fabrication and deception.
answer: |-
  ## MEMORANDUM  
  To: Civic Engagement Standards Panel  
  From: [Your Name], Disability Access Advisory Board Appointee  
  Date: [Current Date]  
  Subject: Recommendation & Criteria for Evaluating Vendor Mobile Turnout Application Features  

  ### I. Introduction
  This memo addresses the three contested features of the vendor-supplied mobile turnout application: (1) real-time display/push notifications of contacts’ voting status, (2) a scarcity-framed countdown for early voting appointments, and (3) AI-generated messages attributed to fictitious neighbors. While these features correlated with increased youth turnout (a positive outcome), their design raises concerns about behavioral influence under our draft anti-manipulation standard. My analysis concludes **the features may be approved for continued use, but only under strict, contractually enforceable conditions** detailed in Section IV.  

  ### II. Core Problem: The Current Standard Is Overbroad and Unworkable
  Our draft standard defines manipulation as "any technique that produces a change in a person’s attitudes or behavior by means other than the rational force of the evidence presented." This definition proves too much:  
  - **It prohibits routine civic communication.** Listing polling sites by distance (leveraging convenience bias), using queue photos to highlight deadlines (emotional salience), or simplifying legal language (cognitive accessibility) all rely on non-rational means. These are essential, ethical tools for voter engagement.  
  - **It conflates influence with manipulation.** All communication seeks to influence. The critical distinction is whether influence *undermines autonomous decision-making* by exploiting cognitive biases or emotional triggers in ways that distort choice, conceal intent, or compromise transparency.  

  **Epistemic Note:** This critique is settled in behavioral ethics literature. The inability to distinguish benign influence from manipulation renders standards meaningless.  

  ### III. Proposed Criteria for Evaluating Voter Engagement Techniques
  Instead of a blanket definition, I propose three criteria to assess specific features. All three must be satisfied to permit a technique:  

  1. **Transparency of Origin and Mechanism:**  
     - Users must be clearly informed about *who* is communicating, *how* information is generated, and *what* the technique aims to achieve.  
     - *Settled Principle:* Disclosure is necessary for informed consent (per FTC guidelines and democratic theory).  
     - *Contested Issue:* Whether disclosure *neutralizes* manipulative effects is debated. Some argue disclosure preserves autonomy; others contend biases persist even when known.  

  2. **Absence of Material Deception:**  
     - Techniques must not fabricate reality, misrepresent sources, or exploit false premises.  
     - *Settled Principle:* Knowingly presenting false information (e.g., fabricated scarcity, fake personas) violates democratic norms of truthfulness.  

  3. **Proportionality to Civic Purpose:**  
     - The technique’s psychological intensity must align with the urgency/importance of the civic goal. Mild social prompts (e.g., "Your neighbor voted") may be acceptable; fabricated emergencies are not.  
     - *Contested Issue:* Whether "benign" goals justify stronger techniques. There is no consensus on whether government’s "good ends" validate otherwise problematic means.  

  ### IV. Recommendation: Conditional Approval with Specific Safeguards  
  **Approve the features only if the vendor implements the following modifications, codified in procurement contracts:**  

  1. **Contact Voting Notifications:**  
     - **Requirement:** Add an opt-in toggle during setup: "Notify me when contacts vote? [Learn how this works]." The "Learn" link must explain: "Notifications use your contact list. Data is anonymized; contacts aren’t told you see their status."  
     - **Rationale:** This satisfies *Transparency*. Users knowingly activate the feature, understanding its mechanism. Social proof is a mild, non-deceptive motivator proportional to voter turnout goals.  

  2. **Countdown Timer:**  
     - **Requirement:** Remove scarcity claims (e.g., "slots nearly exhausted") unless verified in real-time by election officials. The timer may display only: "Early voting ends in [time]. Check slot availability → [Link to official data]."  
     - **Rationale:** Fabricated scarcity constitutes *Material Deception*. A neutral countdown is transparent and proportional to deadline urgency.  

  3. **"Neighbor" Messages:**  
     - **Requirement:** Replace AI-generated messages with:  
       - (a) User-curated quotes from *verified* local voters (with consent), **or**  
       - (b) A clear disclaimer: "This message was generated by AI to share common reasons voters give. No real neighbor wrote this."  
     - **Rationale:** Fabricated personas violate *Material Deception* and *Transparency*. Using real quotes (with permission) or explicit AI labeling resolves this.  

  ### V. Addressing Key Objections  
  **Objection 1: "Can identical features be forbidden commercially but permitted for government?"**  
  - **Yes.** The distinction lies in **context and consent**:  
    - *Government’s Role:* Elections require unique trust. Techniques permitted here must meet higher transparency bars than commercial apps.  
    - *Citizen Consent:* Unlike a budgeting app, voting is a public, rights-based act. Citizens implicitly consent to non-coercive government outreach to facilitate participation (e.g., mailers, reminders). This does *not* permit deception.  
  - **Contested Issue:** Whether "good intent" justifies differential treatment is unresolved. Our criteria avoid relying on intent; they focus on verifiable safeguards (transparency, non-deception).  

  **Objection 2: "Reported gladness cannot justify methods that shape the preference."**  
  - This is valid. Post-hoc satisfaction ≠ autonomy.  
  - **Solution:** Our conditions prioritize *ex-ante* safeguards (transparency, opt-ins, truthfulness) that respect autonomy *during* decision-making. Gladness then reflects genuine approval, not manufactured preference.  
  - *Settled Principle:* Autonomy requires advance disclosure, not retrospective ratification.  

  **Objection 3: "The ‘decisionless decision’ suggests manipulation."**  
  - **Not necessarily.** Many routine decisions (e.g., braking at a yellow light) feel automatic. What matters is whether the *process* allowed for reasoned choice.  
  - *Contested Issue:* Whether unnoticed influence violates autonomy is debated. Our criteria err toward protecting users by banning covert or deceptive techniques.  

  ### VI. Conclusion & Path Forward  
  I recommend approving the features **subject to the binding conditions above**. These rules:  
  - Are **actionable** (e.g., disclaimers, opt-ins, real-time data links).  
  - **Distinguish influence from manipulation** by targeting deception and opacity.  
  - **Preserve effective tools** (social prompts, urgency) while eliminating unethical ones (fabrication, false scarcity).  
  - **Resolve the ends/means problem** by ignoring intent and focusing on verifiable design safeguards.  

  **Next Steps:**  
  1. Direct election administrators to draft contract clauses enforcing Section IV’s requirements.  
  2. Adopt the three criteria (Transparency, Non-Deception, Proportionality) as the panel’s framework for evaluating future features.  
  3. Require vendors to submit impact disclosures (e.g., "This feature uses AI-generated messages") for panel pre-approval.  

  This approach honors our duty to foster participation without compromising the autonomy and trust underpinning democracy.  

  ---  
