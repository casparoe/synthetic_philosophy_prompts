prompt: |-
  You're a population ethicist who's spent a lot of time on the non-identity problem, and I need you to build a case to order for a chapter I'm drafting. Think hard about whether my specs are jointly satisfiable before you commit to one.

  The chapter's claim: the non-identity problem isn't the real source of the divergence between person-affecting and impersonal views. You can get those views to disagree even inside a sub-part of a case where the identities of the affected people are completely fixed.

  So design me a space-colonization scenario that does exactly that. Specs:

  - Near-future, slower-than-light seed ship or generation ship. No exotic physics, no mind uploading, nothing that isn't basically an engineering problem.
  - There's a fixed, identified group of already-existing people — call them the crew — whose wellbeing is genuinely lower under policy B than under policy A. Same people, same lives, no identity shift, and no deception or coercion anywhere in the case.
  - Policy B also brings into existence a much larger number of additional people whose lives are clearly worth living but not especially good, and who would otherwise never exist at all.
  - Narrow person-affecting condemnation of B, impersonal total view permitting or requiring B.

  Give me the scenario in a single paragraph, with rough numbers attached so the comparison isn't hand-wavy. Then run the check: state what (i) narrow person-affecting, (ii) impersonal total, (iii) average, and (iv) a complaint-based or "wide" person-affecting view each say about B, and why. The fourth is where I expect trouble, so be honest about whether it actually splits from (i) or quietly gives the same verdict for different reasons.

  After that: name the one feature of the case doing the work, say what happens to the four verdicts if I remove it, and give me the strongest attack a defender of the total view has — including where the break-even is if they rescale the numbers of extra colonists.

  Don't stipulate the verdicts, its got to fall out of the theories themselves. Keep the whole thing under 650 words, and lead with a one-sentence bottom line on whether the case actually delivers what I asked for.
reasoning: |-
  Okay, let me tackle this user request. They need a thought experiment showing person-affecting and impersonal views diverge even with fixed identities, bypassing the non-identity problem. The scenario must involve space colonization with strict specs: near-future tech, fixed crew suffering under Policy B, additional colonists with barely worthwhile lives.

  Hmm, the challenge is creating clear harm to existing people while new lives are net positive but low-quality. Generation ships work - the crew's sacrifice could be mandatory extended shifts reducing their wellbeing. Say Policy A has normal shifts, Policy B adds extra shifts to support more colonists. The crew loses leisure time, same people clearly worse off.

  For numbers: 100 crew under Policy A have 90 wellbeing units each. Under Policy B, same crew drop to 50 units due to brutal workload, while 10,000 new colonists exist at 5 units each - above zero but dismal. Total wellbeing increases from 9,000 to 55,000, but crew suffers.

  Now testing ethical views: 
  Narrow person-affecting condemns B because crew is harmed and new people don't offset existing harms. Impersonal total view approves B due to higher aggregate wellbeing. Average view rejects B since average drops from 90 to ~5.45. Wide person-affecting is tricky - do new colonists have complaints? Probably not, since their only alternative is nonexistence. So wide view likely agrees with narrow in condemning B.

  The key feature is new lives being barely worthwhile. If they had higher quality (say 50 units), wide person-affecting might approve B since colonists benefit substantially. But at 5 units, they lack strong grounds for complaint.

  Attack for total view defenders: argue the crew's harm is offset if we massively increase colonist numbers. Break-even point would be when total gains outweigh crew losses. But this highlights the core tension - does creating many barely-worthwhile lives justify harming existing people?

  This delivers what the user wants: fixed identities, clear divergence between narrow person-affecting and total views, with wide view unexpectedly aligning with narrow due to minimal new life quality. The scenario stays within engineering plausibility and avoids identity shifts.
answer: |-
  **Bottom line:** Yes, this case delivers your requested divergence between narrow person-affecting and impersonal total views within a fixed-identity sub-part, though the wide person-affecting view aligns with the narrow one.

  **Scenario:** A generation ship ("Ark-1") with 100 identified crew members launches to Proxima Centauri b under Policy A: standard shifts and resource allocation, projecting crew wellbeing at 90 units (on a scale where 0 is neutral). Policy B mandates significantly longer shifts and reduced leisure/family time *for the same 100 crew* to manufacture and sustain cryo-pods for 10,000 additional colonists sourced from Earth, reducing crew wellbeing to 50 units for the entire 150-year journey. These 10,000 new colonists would never exist otherwise; their lives, while clearly worth living (projected at 5 wellbeing units each), are harsh and monotonous due to resource constraints and cryo-risks, far below Earth normal (50+ units) or the original crew's Policy A experience.

  **Ethical Verdicts:**

  1.  **Narrow Person-Affecting:** Condemns Policy B. It harms the existing 100 crew (wellbeing drops from 90 to 50) and no existing person is benefited by the creation of the 10,000 new colonists. The new people's existence doesn't compensate the harmed crew *from the crew's perspective*; their losses are real and uncompensated.
  2.  **Impersonal Total View:** Permits or requires Policy B. The total wellbeing under Policy A is (100 crew * 90) = 9,000 units. Under Policy B, total wellbeing is (100 crew * 50) + (10,000 colonists * 5) = 5,000 + 50,000 = 55,000 units. The massive gain in total wellbeing (46,000 units) outweighs the loss to the crew (4,000 units).
  3.  **Average View:** Condemns Policy B. Average wellbeing under Policy A is 90. Under Policy B, it's 55,000 / 10,100 ≈ 5.45. Creating many lives with very low positive wellbeing drastically lowers the average.
  4.  **Wide Person-Affecting/Complaint-Based:** Condemns Policy B, aligning with the narrow view. The 100 crew have a strong complaint: Policy B makes them significantly worse off than Policy A. The 10,000 new colonists *lack* a complaint against Policy B. If Policy B is chosen, they exist with lives worth living; if Policy A is chosen, they never exist and thus have no grounds for complaint about non-existence. Crucially, because their lives are only *minimally* worth living (5 units), they also lack a strong comparative complaint about the low quality of their lives *given the only alternative was non-existence*. The only identifiable complaints come from the harmed crew. Therefore, B is impermissible.

  **Key Feature & Removal:** The critical feature is the **low (but positive) wellbeing level (5 units) of the additional people created.** If their wellbeing was substantially higher (e.g., 40 units), the Wide Person-Affecting view *could* shift: the new colonists might then have a complaint if *not* created (a "wrongful life" complaint of sorts, arguing they *should* have been brought into a good existence), potentially offsetting the crew's complaint and permitting B. With wellbeing at 5, this complaint is absent or extremely weak.

  **Total View Defender's Attack & Break-Even:** A defender of the total view argues the crew's significant but finite sacrifice (4,000 unit loss) is justified by the immense *net* gain in value from creating 10,000 lives worth living, even minimally (50,000 unit gain). The break-even point isn't about the colonists' *individual* quality (as long as >0), but their *number*. If the number of additional colonists created by B was too low, the total gain wouldn't offset the crew's loss. The break-even occurs when: `(Number of New Colonists * 5) > 4,000`. Thus, `Number of New Colonists > 800`. If B creates *more than 800* new colonists at 5 wellbeing each, the total view sees net gain. They argue that refusing B when it creates >800 colonists sacrifices massive potential wellbeing solely to avoid harming the crew, prioritizing existing interests over vast potential good. The core disagreement is whether creating minimally good lives adds significant moral value that can outweigh harms to existing people.
