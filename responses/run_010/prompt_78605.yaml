  ### **How This Addresses Your Goals**
  - **Balances temperaments:**  
    - **Rule-followers (newer volunteers):** Shine in rule-writing but suffer in role-play (can’t defend without rules) and when features flip (their rigid scoring fails).  
    - **Instinct-drivers (veterans):** Excel in role-play but struggle in rule-writing (overly vague rules cause bad calls) and face point penalties for "bloat" when patching.  
    - *Result:* Each group’s strength becomes a liability, forcing humility.  

  - **Deck does the heavy lifting:**  
    - **True flips:** Card 3 vs. 4 (employment) and Card 5 vs. 6 (local ties) make the same feature flip *without* being outweighed. Health/kids are red herrings.  
    - **Pressure points:** Card 4 breaks employment = always positive; Card 6 breaks local ties = always supportive. Volunteers *feel* the context shift.  

  - **Scoring penalizes bloat & bad calls:**  
    - Adding a rule (–5 points) hurts simplicity *and* score. Teams feel the tradeoff: "Do we patch Card 4 and risk tanking points, or stay lean and miss calls?"  

  - **Role-play forces accountability:**  
    - Team 3 defends Card 6 (no help) without rules—exposing how instinct relies on unspoken principles. Cross-examination makes "arbitrary" feel visceral.  

  - **Debrief settles your dilemma:**  
    - Questions like *"When Team B patched after Card 4, what did it cost?"* expose rule futility.  
    - The final vote (A: scrap project vs. B: crutch) is informed by lived experience, not theory.  

  ---

  ### **What the Activity Can’t Replicate (Your Closing Note)**
  **The Unreproducible Element:** The **emotional weight of real-time consequences**. In the session, a "bad call" loses points. In reality, it means a family sleeps outside. Volunteers can’t *feel* that stakes in a game—it’s intellectual.  

  **How to Supply This:**  
  In the last 10 minutes, share:  
  > *"Today, we debated rules vs. judgment. But in real intake, there’s a third layer: the cost of being wrong. When we deny help, it’s not –3 points—it’s a child in a car. When we add a rule, it’s not –5 points—it’s a volunteer freezing at 2 AM, flipping through pages while someone cries. That weight changes everything. So the question isn’t just ‘rules or judgment?’ It’s ‘Can we live with the cost of either?’ If we write a rubric, we risk rigidity hurting people. If we don’t, we risk inconsistency hurting people. My ask: Tell me which cost scares you less."*  

  This bridges the activity to reality and forces ownership of the answer.  

  ---

  ### **Expected Outcome**  
  The session won’t "solve" the rubric debate, but it will surface the core tension: **Rules reduce inconsistency but amplify rigidity; judgment preserves flexibility but obscures accountability.** The group will likely land on the **weaker conclusion** (rules as crutches) because the activity shows rules *can* work minimally but break without human interpretation. That said, if veterans dominate, they may push to scrap the project. Either way, you’ll leave with clear next steps:  
  - If weak conclusion: Draft a 1-page rubric with clear appeals process.  
  - If strong conclusion: Take findings to the board with alternatives (e.g., decision committees).  

  Run this, and you’ll have your answer—with the team’s buy-in.
