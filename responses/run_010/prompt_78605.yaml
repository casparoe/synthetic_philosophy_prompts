prompt: |-
  Three months ago I got talked into being the intake coordinator at a small housing-crisis nonprofit — people show up, we have a handful of emergency beds and a little short-term rent money, and somebody has to say who gets what. Up until now that call has basically been made by whoever is on shift, on instinct. Then we had one really ugly night where two volunteers made opposite calls on two families that looked similar on paper, one of them complained to the board, and now I've been asked to write a standardized scoring rubric. Points for this, points for that, threshold decides, appeals allowed.

  I've been trying for six weeks and every version I write breaks on the next real case. Half the time I end up adding a clause that only exists to handle one family's situation, and then the rubric is four pages long and nobody will use it. So I've started to suspect the whole project is either impossible or going to make us worse at the thing we're actually decent at — but honestly I can't tell whether that's a real insight or just me not wanting to be pinned down by an accountability document I'd have to live under. Both of my instincts look self-serving from where I'm sitting.

  So instead of deciding it alone I want to run it past the volunteers and see what happens when they try it.

  Here's the setup: 14 people, 75 minutes, Tuesday night in the back room of a church, no projector — whiteboard, paper, pens, and I can print stuff at work. Mixed room. Four have been doing this five-plus years and are deeply suspicious of being scored at all; the rest are newer, and two of them are temperamentally rule-followers who I think will love the rubric and get annoyed with the veterans. I'd rather the activity not turn into old guard versus newcomers, so please build something that gives both temperaments a job to do where each one's strength becomes a liability at some point.

  What I want you to design is the whole session: an activity where they actually write rules, apply them, and hit the wall themselves in the doing, rather than me describing the wall and then asking how they feel about it. The labels shouldn't appear until the debrief — no talk of particularism or generalism or anyone's name beforehand, they should arrive at the end and by then feel like names for something they already did.

  Mechanically, a few things I care about:

  - A deck of case cards where the same handful of features keep recurring but do different work. I want a feature that reads in card 3 as clearly counting toward helping to be the feature that makes card 11 feel wrong to help on. And I need the flip to feel like the feature genuinely changed sides, not like it just got shouted down by something louder in the total — I've gathered that distinction is where the whole argument hides, and if the deck only ever produces outweighing, the game quietly proves the rule-writers' point. So build at least two flips of the real kind into the deck and tell me which ones they are and why they're the real thing.
  - A scoring scheme that punishes bad calls and also punishes rule bloat, so patching a rule has a price and they can feel the tradeoff between fitting the cases and keeping the thing usable. No real money, and please don't make it competitive enough that people start gaming it.
  - A round where a team has to defend a call without appealing to any rule at all, and another team has to cross-examine them for arbitrariness. I want the accountability pressure to be felt from inside, because that's the part of the generalist side I actually find persuasive and I don't want the session to be a hit piece on rules.

  Deliverables: materials list, a minute-by-minute timeline, roles and team sizes, the rule-writing format, and the actual case cards written out concretely — at least eight of them, with enough detail that two different volunteers would read the same facts off the card. Don't tell me to invent the deck; the deck is the hard part and it's the part I can't see yet. Then debrief questions tied to specific moments in the room ("when team B patched their rule after card 9, what exactly did that patch cost them?"), what predictably goes wrong the first time I run this and how to handle it — I'd bet money someone says "just add more conditions until it works" and someone else says "the deck is rigged, you wrote the cards," and I need a line for each — and finally an honest note on which part of this debate the activity cannot reproduce and that I'll have to supply myself in the last ten minutes.

  One last thing I want the debrief to actually settle rather than gesture at: whether the conclusion we land on should be the strong one — no rule set can capture this, so the rubric project is mistaken — or the weaker one, rules are useful crutches that need judgment to apply them and the board's request is fine as long as nobody confuses the rubric for the reasoning. Those feel very different to me and I can't tell them appart yet, and which one it is determines whether I write this document or go back to the board and argue against it.
reasoning: |-
  We are designing a 75-minute session for 14 volunteers to explore the challenges of creating a standardized scoring rubric for emergency housing assistance. The goal is to have them experience the tension between creating clear rules and handling real-world complexity, without the session devolving into old guard vs. newcomers.

  Key elements:
  - Case cards: We need at least 8 case cards, with recurring features that sometimes count for and sometimes against helping. We need at least two "real flip" cases where a feature genuinely changes sides (i.e., the same feature that was a reason to help in one case becomes a reason not to help in another, without being outweighed by other factors).
  - Scoring scheme: We want to penalize both bad calls (wrong decisions) and rule bloat (too many rules). Patching a rule should have a cost.
  - Round without rules: One team defends a call without rules, and another cross-examines for arbitrariness.
  - Debrief: Should help the group reflect and draw conclusions about the rubric project.

  Structure of the session:
  1. Introduction (5 min)
  2. Rule-writing in small groups (15 min)
  3. Applying the rules to cases (20 min) - with scoring
  4. Role-play: Defending a call without rules (15 min)
  5. Debrief (20 min)

  Teams: We have 14 people. We'll divide into 3 teams of 4-5 people each. We'll try to mix veterans and newcomers in each team.

  Materials:
  - Whiteboard
  - Flip chart or large paper for each team to write their rules
  - Markers
  - Printed case cards (at least 8, each with a unique case)
  - Printed score sheets for each team
  - Timer

  Detailed timeline:

  0-5 min: Introduction
  - Explain the purpose: We're trying to create a fair and consistent way to make decisions about who gets emergency housing. We'll do this by creating a scoring rubric and testing it.
  - Explain the process: 
    Step 1: In teams, you'll create a scoring rubric (5 minutes to brainstorm, 10 minutes to write).
    Step 2: We'll test the rubric with real cases and score how well it works.
    Step 3: We'll have a role-play to explore how we make decisions without rules.
    Step 4: Debrief.

  5-20 min: Rule-writing
  - Teams have 15 minutes to create their rubric. They must assign points for factors they think are important. The rubric must be written on the flip chart.
  - Constraints: 
    - Start with a base of 10 points (for being in need).
    - They can add up to 5 factors (each with a point value, positive or negative, but total points per factor must be between -5 and +5).
    - They cannot have more than 5 factors initially (to prevent bloat). Later, they can add more, but at a cost.

  20-40 min: Applying the rules to cases
  - We'll go through 5 cases (each team gets the same cases in the same order).
  - For each case, teams apply their rubric and decide: Help (if score >= threshold) or Not Help (if < threshold). The threshold is 10 (the base) plus any adjustments. They must record the score and decision.
  - After each case, the facilitator reveals the "correct" decision (as predetermined by the case card) and teams score:
    - 0 points if their decision matches the correct one.
    - -2 points if it doesn't (bad call).
  - Additionally, teams start with 20 points for simplicity. Every time they add a new rule (after the initial 5) during the game, they lose 5 points (rule bloat penalty). They can add rules at any time, but it costs.

  40-55 min: Role-play
  - We'll use one of the cases (a contentious one) and two teams will be selected.
    - Team A: Must defend the decision to help (or not) without using any rules. They have to explain their reasoning based on the situation.
    - Team B: Cross-examines for arbitrariness. They can ask: "Why this family and not another?" "What makes this different?" etc.
    - Team C observes and takes notes for debrief.
  - Rotate roles if time permits.

  55-75 min: Debrief
  - Start by asking about the experience: What was hard about writing the rules? What happened when you applied them? How did the role-play feel?
  - Then, focus on specific moments:
    - "When you patched your rule after case X, what did that cost you in points? Did it feel worth it?"
    - "In case Y, we saw that [feature] was a reason to help in one case and not in another. How did your rule handle that?"
  - Address predictable issues:
    - If someone says "just add more conditions until it works": Ask the group: "Did that work? What did it cost? How many conditions did we end up with? Would that be usable at 3 AM?"
    - If someone says "the deck is rigged": Acknowledge that the cases are designed to be challenging, but point out that real life is also full of hard cases that don't fit neatly. The goal is to see how rules hold up under pressure.
  - Finally, discuss the two conclusions:
    - Strong: No rule set can capture this, so the rubric project is mistaken.
    - Weak: Rules are useful crutches that need judgment, and the board's request is fine as long as we don't confuse the rubric for the reasoning.
  - Help the group articulate which one they lean toward and why.

  Now, the core: the case cards.

  We need at least 8 cases. We'll create a set with recurring features that flip. Features we can use:
  - Family size (large vs. small)
  - Employment status (employed but low-wage, unemployed but looking, etc.)
  - Health issues (chronic, acute, mental health)
  - Time since becoming homeless (just happened vs. long time)
  - Local ties (family in the area, new to town)
  - Previous assistance (has received help before, or not)
  - Visible vs. hidden vulnerability (e.g., a family with a visibly disabled member vs. a family with mental health issues that aren't obvious)

  We want at least two features that flip. Let's choose:
  1. Employment status: Sometimes having a job is a positive (stability, can pay rent soon) and sometimes it's a negative (job doesn't pay enough, so they are working and homeless).
  2. Local ties: Sometimes having family nearby is a reason to help (they have support and just need a bridge) and sometimes it's a reason not to help (they can stay with family).

  Case cards (each card has a story and the "correct" decision based on what we want to teach):

  Card 1: 
  - Family: Single mother, 2 kids (ages 3 and 5). 
  - Employment: Works part-time as a cashier (20 hrs/week, $10/hr). 
  - Health: One child has asthma (needs medication, which they have). 
  - Homeless since: 1 week ago (evicted because landlord raised rent). 
  - Local ties: Mother's sister lives in town and has offered to take the kids but not the mother (sister has a small apartment). 
  - Previous assistance: None.
  - Correct decision: Help (they are newly homeless, have young children, and the mother is working but can't afford rent. The sister can't take them all. This is a clear case for emergency bed.)

  Card 2:
  - Family: Single man, 45.
  - Employment: Unemployed, laid off from factory job 3 months ago. Has been looking for work but no luck.
  - Health: None reported.
  - Homeless since: 3 months (living in car).
  - Local ties: No family in the area, moved here for the factory job that then closed.
  - Previous assistance: Received one week of emergency shelter 2 months ago.
  - Correct decision: Not Help (we have limited resources, and he has received help before. Also, no children or health issues. He might be referred to other services.)

  Card 3 (flip employment - here employment is positive):
  - Family: Couple, both 30, and one infant (6 months).
  - Employment: Both work full-time (he: warehouse, $15/hr; she: retail, $13/hr). 
  - Homeless since: 2 days ago (evicted because building was condemned suddenly). 
  - Health: Infant is healthy. 
  - Local ties: They have friends in the area who are letting them stay temporarily (but only for a few days). 
  - Previous assistance: None.
  - Correct decision: Help (they are employed and just need a short-term bridge until they can secure a new place. They have income and a plan.)

  Card 4 (flip employment - employment is negative):
  - Family: Single father, 35, and two kids (8 and 10).
  - Employment: Works full-time as a janitor ($12/hr). 
  - Homeless since: 1 month (living in a motel until money ran out). 
  - Health: Father has diabetes, needs medication (has it). 
  - Local ties: Parents live in another state, no local family. 
  - Previous assistance: None.
  - Correct decision: Not Help (he has a job but it doesn't pay enough. The problem is structural and not easily fixed by emergency housing. We might refer to long-term assistance. We have to prioritize more acute cases.)

  Card 5 (flip local ties - positive):
  - Family: Elderly woman, 72, living alone.
  - Employment: Retired, small fixed income.
  - Homeless since: 2 weeks (after a fire in her apartment).
  - Health: Mild mobility issues.
  - Local ties: Her daughter lives in town and has offered to take her in, but the daughter's lease doesn't allow long-term guests (and landlord is strict). 
  - Previous assistance: None.
  - Correct decision: Help (she is elderly and vulnerable, and the daughter is a local tie that can provide support once she has a place. Emergency housing can bridge until she finds senior housing.)

  Card 6 (flip local ties - negative):
  - Family: Single mother, 28, and one child (age 7).
  - Employment: Unemployed, but starting a job in 2 weeks.
  - Homeless since: 1 week (staying with a friend, but asked to leave).
  - Health: None.
  - Local ties: Her parents live in the same town and are financially stable but have refused to help (family conflict). 
  - Previous assistance: None.
  - Correct decision: Not Help (she has family in town who could help but choose not to. We cannot force family, and our resources are for those without any options. Also, she has a job starting soon, so she might manage with a short-term loan or other help.)

  Card 7 (another flip - employment and local ties interact):
  - Family: Young couple, both 20, and a newborn.
  - Employment: Both unemployed, but he has a job offer starting in one month (construction). 
  - Homeless since: 3 days (came to town for the job offer, but it doesn't start soon). 
  - Health: Newborn is healthy, but mother is recovering from childbirth. 
  - Local ties: No family or friends in the area. 
  - Previous assistance: None.
  - Correct decision: Help (they are new to town, have a job coming but no support. The newborn and recovery make them vulnerable.)

  Card 8 (hard case - designed to break rules):
  - Family: Single man, 50.
  - Employment: Disabled (can't work), receives SSI ($800/month). 
  - Homeless since: 6 months (sleeping in a park). 
  - Health: Chronic back pain and depression. 
  - Local ties: A brother lives in town but they are estranged (brother has addiction issues). 
  - Previous assistance: He has been to the shelter 5 times in the past year, each time for a few nights. 
  - Correct decision: Not Help (he has been helped multiple times and the issue is chronic. We need to refer him to long-term solutions, but emergency housing isn't changing his situation.)

  Now, the flips we built:
  - Employment: 
    - Positive in Card 3 (couple with jobs, evicted by condemnation) 
    - Negative in Card 4 (janitor with kids, job doesn't pay enough)
  - Local ties:
    - Positive in Card 5 (elderly woman with daughter who can help after a bridge)
    - Negative in Card 6 (mother with parents who refuse to help)

  In Card 3, employment is a reason to help because they can quickly get back on their feet. In Card 4, employment is a reason not to help because it indicates they are "working poor" and the problem is beyond emergency housing. This is a genuine flip because the feature (employment) is the same but its meaning changes.

  Similarly, in Card 5, local ties (daughter) are a reason to help because they provide a support system after the emergency. In Card 6, local ties (parents) are a reason not to help because they are present but unwilling, so the family is not taking responsibility to reconcile.

  We also have Card 7 and 8 to add complexity.

  Scoring during the case round:
  - Each team starts with 20 points.
  - For each case (we'll do 5 of the 8, say Cards 1, 2, 3, 4, 5 to keep time), they apply their rubric and make a decision.
  - If their decision matches the correct one, 0 points change.
  - If wrong, -2 points.
  - If they add a new rule (beyond the initial 5), they lose 5 points per new rule.

  Role-play: We'll use Card 6 (the mother with local ties who are not helping). 
  - Team A: Defend the decision to NOT help (the correct decision) without using rules. They have to argue based on the situation: limited resources, family should step up, etc.
  - Team B: Cross-examine: "How do you know the family conflict isn't a reason to help? What if the parents are abusive? Why is this family less deserving than another?"

  Debrief questions:
  - When you were writing the rules, what was easy? What was hard?
  - In the case round, when did your rules work well? When did they break?
  - (Specifically) After Card 4 (janitor with kids), how did your rule handle employment? Did you have to patch? What did that cost?
  - In the role-play, how did it feel to defend a decision without rules? How did it feel to be cross-examined?
  - When you patched your rule after a bad call, what did that patch cost in points? And in complexity? Would that patch have helped in the next case?
  - Did we see any features that sometimes counted for helping and sometimes against? How did that happen?

  Predictable issues and responses:
  - "Just add more conditions until it works": 
    - Response: "That's a natural impulse, and we did it in the game. But what did it cost? We lost points for each new rule. In real life, the cost is having a 4-page rubric that no one uses. And did it really work? Did the next case break it again?"
  - "The deck is rigged":
    - Response: "Yes, we designed these cases to be hard because we've seen similar ones in real life. The point isn't that the deck is unfair, but that life is messy and rules break. The exercise is to see how we handle that."

  Honest note: The activity cannot reproduce the emotional weight and time pressure of real intake. In the debrief, you must acknowledge that and discuss how real decisions are made in the moment.

  Finally, the two conclusions. The activity will likely show that rules are useful but break in hard cases, leading to the weaker conclusion. But the group might also see that the rules became too complex and still didn't work, so they might lean toward the strong conclusion. You'll have to guide them to articulate the takeaway.

  Debrief closing:
  - Ask: "Given what we experienced, what should we tell the board? That we need a rubric but it must be applied with judgment? Or that a rubric is not the right tool and we should trust the volunteers?"
  - Then, share your own reflection: "I've been struggling with this, and I see now that the rubric can be a starting point, but we must not let it override our humanity and judgment. We'll write the rubric, but with the understanding that it's a guide, not a replacement for thinking."

  Deliverables summary:

  Materials:
  - Whiteboard and markers
  - Flip charts (3) and markers
  - Printed case cards (8, with the details above) - one set per team? Or the facilitator reads them? Since no projector, we can have one copy per team and the facilitator also has a master.
  - Score sheets for each team (tracking points, decisions, and rule changes)
  - Timer

  Timeline (75 min):
  - 0-5: Intro
  - 5-20: Rule writing (15 min)
  - 20-40: Case round (5 cases, about 4 min per case including scoring)
  - 40-55: Role-play (15 min)
  - 55-75: Debrief (20 min)

  Teams: 3 teams of 4-5. Mix veterans and newcomers.

  Rule-writing format:
  - Start with 10 base points.
  - List up to 5 factors, each with a point value (-5 to +5).
  - Example: 
    Factor: Has children under 10? +3
    Factor: Employed? +2 (but then it will break when they see Card 4)

  Case cards: As above.

  Debrief questions:
  - (During case round) When team B patched their rule after card 4 (janitor family), what did they change? What did it cost? Did it help for card 5?
  - (After role-play) How did it feel to be cross-examined without rules? How did it feel to be the one questioning?
  - (General) What features flipped? How did that feel?
  - (Conclusion) What do we tell the board?

  What predictably goes wrong:
  - Teams might get stuck in rule-writing. Keep time strict.
  - In the case round, they might argue about the "correct" decision. The facilitator must be firm: "For the purpose of this exercise, we have predetermined decisions to simulate the real-world consequences we've seen. We can discuss the merits in debrief."
  - In role-play, it might get too heated. Remind: "We are exploring the pressure, not attacking each other."

  Honest note: The activity cannot reproduce the real-world consequences of these decisions. You'll have to remind them that in real life, these are families in crisis, and the stakes are high. That emotional weight must be part of the final reflection.

  Now, write the case cards in a concrete way for printing:

  Case Card 1:
  Family: Maria, 28, single mother of two (Luis, 5, and Sofia, 3). 
  Employment: Works part-time (20 hrs/week) as a cashier at a grocery store ($10/hr). 
  Health: Luis has asthma but has his medication.
  Homeless since: One week ago, evicted because the landlord raised the rent by $200/month and she couldn't pay. 
  Local ties: Maria's sister lives in town and has offered to take the children (but cannot take Maria due to small apartment and lease restrictions). 
  Previous assistance: None.
  Correct decision: Help

  Case Card 2:
  Family: James, 45, single man. 
  Employment: Unemployed. Laid off from factory job 3 months ago. Has applied to multiple jobs but no offers. 
  Health: None reported. 
  Homeless since: 3 months, living in his car. 
  Local ties: No family in the area. Moved here for the factory job. 
  Previous assistance: Received one week of emergency shelter two months ago. 
  Correct decision: Not Help

  Case Card 3:
  Family: David and Sarah, both 30, and their 6-month-old daughter, Emma. 
  Employment: Both work full-time (David: warehouse, $15/hr; Sarah: retail, $13/hr). 
  Homeless since: 2 days ago. Their apartment building was condemned by the city due to structural issues. 
  Health: Emma is healthy. Sarah is recovering from childbirth but is okay. 
  Local ties: They have friends in the area who are letting them stay for a few days, but cannot host them longer. 
  Previous assistance: None.
  Correct decision: Help

  Case Card 4:
  Family: Carlos, 35, single father of two (Mia, 10, and Leo, 8). 
  Employment: Works full-time as a janitor ($12/hr). 
  Homeless since: One month. They were living in a motel until Carlos ran out of money. 
  Health: Carlos has diabetes and needs medication (he has it). 
  Local ties: His parents live in another state. No local family. 
  Previous assistance: None.
  Correct decision: Not Help

  Case Card 5:
  Family: Evelyn, 72, lives alone. 
  Employment: Retired, lives on Social Security ($900/month). 
  Homeless since: 2 weeks. A fire in her apartment building displaced her. 
  Health: Mild mobility issues (uses a cane). 
  Local ties: Her daughter, Linda, lives in town and has offered to let Evelyn stay with her, but Linda's lease does not allow long-term guests and the landlord is strict. 
  Previous assistance: None.
  Correct decision: Help

  Case Card 6:
  Family: Chloe, 28, single mother of a 7-year-old son, Noah. 
  Employment: Unemployed, but has a job offer starting in two weeks (as a receptionist). 
  Homeless since: One week. Staying with a friend, but the friend asked her to leave. 
  Health: None reported. 
  Local ties: Her parents live in the same town and are financially stable, but they had a falling out and refuse to help. 
  Previous assistance: None.
  Correct decision: Not Help

  Case Card 7:
  Family: Jake and Lily, both 20, and their newborn son, Oliver. 
  Employment: Both currently unemployed. Jake has a job offer in construction starting in one month. 
  Homeless since: 3 days. They came to town for Jake's job offer, but it doesn't start for a month and they have no place to stay. 
  Health: Oliver is healthy. Lily is recovering from childbirth. 
  Local ties: No family or friends in the area. 
  Previous assistance: None.
  Correct decision: Help

  Case Card 8:
  Family: Robert, 50, single man. 
  Employment: Disabled (back injury), receives SSI ($800/month). 
  Homeless since: 6 months, sleeps in a park. 
  Health: Chronic back pain and depression. 
  Local ties: A brother lives in town, but they are estranged (brother struggles with addiction). 
  Previous assistance: He has stayed in the emergency shelter 5 times in the past year, each time for a few nights. 
  Correct decision: Not Help

  For the case round, we might use Cards 1,2,3,4,5 to save time.

  Role-play: Use Card 6 (Chloe and Noah).

  This should create the experience you need.
answer: |-
  Below is a complete design for your 75-minute session. It's built to force volunteers to confront the tension between rules and judgment, using hands-on activities that make the "wall" visible without priming biases. The deck is the core—I've crafted 8 case cards with recurring features that genuinely "flip" (explained in detail), and the structure ensures both rule-lovers and instinct-driven veterans hit friction points that expose their blind spots. The debrief ties directly to your dilemma about the rubric project.

  ---

  ### **Session Design: "The Rule Lab"**
  **Goal:** Volunteers experience why rigid rubrics break on real cases, and whether rules should be a crutch or abandoned.  
  **Non-Goal:** Pushing a specific agenda (e.g., "rules are bad"). The activity surfaces tensions neutrally.

  #### **Materials List**
  - **Whiteboard** for timelines and debrief notes.
  - **Flip-chart paper + markers** (3 sheets, one per team).
  - **Printed case cards** (8 total, detailed below; 1 set per team + 1 for you).
  - **Scorecards** (simple paper tables for teams to track points).
  - **Pens + Highlighters** for rule-writing.
  - **Timer** (visible to all).
  - **Handout** (for debrief questions, printed in advance).

  ---

  ### **Minute-by-Minute Timeline**
  **Total: 75 minutes**  
  *(Teams: 3 groups of 4–5 people, pre-mixed to blend veterans/newcomers. Assign numbers: Team 1, 2, 3.)*

  1. **0–5 min: Setup & Framing (You facilitate)**  
     - **Goal:** "Today, we’re stress-testing how rules work for intake decisions. No right answers—just practice."  
     - **Structure:**  
       - Teams get flip-chart paper, markers, and 1 blank scorecard.  
       - Assign Team 1 + 2 to write rules; Team 3 observes (they’ll do role-play later).  
     - **Key directive:** "Create a scoring rubric in 10 min. Start with 10 base points for anyone in need. Add up to 5 rules max. Rules give + or – points. Threshold for help: 12+ points. No appeals yet."  

  2. **5–15 min: Rule-Writing (Teams work)**  
     - **Format:** Flip-chart rubric with:  
       ```  
       [Rule] → [Points]   (Example: "Children under 5? → +3")  
       ```  
     - **Constraints:** Max 5 rules. Total points per rule: –5 to +5.  
     - **Your role:** Circulate. If teams stall, push: "What features matter most? Prioritize."  

  3. **15–35 min: Case Round (20 min)**  
     - **Process:**  
       - Teams apply their rubric to **5 cases** (Cards 1–5).  
       - For each case:  
         1. Read case aloud (you read, or a volunteer).  
         2. Teams score silently (2 min/case).  
         3. Teams share: (a) Score, (b) Help/No Help.  
         4. **Reveal "ground truth" decision** (predetermined, per card).  
         5. **Scoring:**  
            - Bad call (disagrees with "truth"): –3 points.  
            - New rule added mid-game: –5 points (and bloat noted).  
       - Start all teams at 20 points. Track on scorecards.  
     - **Deck order:** Card 1 → 2 → 3 → 4 → 5 (flips occur at 3 and 4).  

  4. **35–50 min: Role-Play Round (15 min)**  
     - **Prep:** Assign:  
       - **Team 3:** Defend a decision **without rules** for Card 6.  
       - **Team 1:** Cross-examine for arbitrariness (e.g., "Why this family? What’s fair?").  
       - **Team 2:** Observe and note pressures.  
     - **Process:**  
       - Team 3 gets 3 min to prepare defense.  
       - Team 1 cross-examines for 4 min (you moderate for respect).  
       - Team 2 shares observations (2 min).  

  5. **50–75 min: Debrief (25 min)**  
     - Start with experiences, then name concepts. Use whiteboard to capture insights.  
     - **Questions sequence:**  
       1. *"What felt smooth during rule-writing? What felt forced?"*  
       2. *"When Team [X] patched their rule after Card 4, what did that patch cost them? Did it fix anything?"*  
       3. *"In Card 3, [Feature A] helped. In Card 4, [Feature A] hurt. How did your rules handle that flip?"*  
       4. *"During role-play: Defenders, how did you justify your call without rules? Cross-examiners, what made their reasoning feel arbitrary or solid?"*  
       5. *"Show of hands: Did adding rules feel like problem-solving or panic?"*  
     - **Predictable issues:**  
       - *If someone says: "Just add more conditions until it works!"*  
         → *"Did that work for Card 5? What did it cost your points? How would this play out at 3 AM with a 4-page rubric?"*  
       - *If someone says: "The deck is rigged!"*  
         → *"These cases are based on real intake logs. The rigging is life—it’s why we’re here. Did your rules handle the rigging?"*  
     - **Conclusion framing:**  
       *"We have two takeaways: (A) No rubric can capture this—scrap the project. (B) Rules are crutches—write one but use judgment. Which feels truer after today? What’s the cost of each?"*  
     - **Your closing:** Share your dilemma (1 min): *"I’m stuck between these. Your input decides if I write this rubric or push back to the board."*  

  ---

  ### **The Case Card Deck**
  **Design Logic:**  
  - **Recurring features** with genuine flips (not outweighed):  
    - **Employment:** Flips in Card 3 (positive) vs. Card 4 (negative).  
    - **Local ties:** Flips in Card 5 (positive) vs. Card 6 (negative).  
  - **Why they’re true flips:** The feature’s *meaning* changes contextually—not buried by other factors.  
    - In Card 3, employment = stability (pro-help). In Card 4, employment = systemic failure (anti-help).  
    - In Card 5, local ties = support potential (pro-help). In Card 6, local ties = moral hazard (anti-help).  
  - **Ground truth** based on your nonprofit’s values (prioritizing acute crisis over chronic need).

