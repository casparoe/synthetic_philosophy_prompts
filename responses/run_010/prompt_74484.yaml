prompt: |-
  Ok so I've been trying to pin down what I actually believe about picking causes, going case by case instead of from the framework down, and my verdicts are a mess. I know the usual importance/tractability/neglectedness triad — that's not what I want back. I want to know what rule, if any, sits underneath my gut calls. Here they are, with stakes made up just to keep the cases straight.

  1. Cause A: preventing a specific kind of industrial accident that kills a few thousand people a decade. Big stakes, not cosmic. There's a cheap engineering fix that demonstrably works, and basically nobody outside one small country is pushing it. Verdict: I'd work on this, high priority.

  2. Cause B: same order of stakes, equally good intervention available, but there are maybe 40 well-funded groups already on it and the marginal value of one more person is close to zero. Verdict: much lower priority than A, even tho the stakes and the tractability are identical. So far this is just neglectedness doing work.

  3. Cause C: stakes about 10x A's, intervention is real but harder, field is crowded-ish. Cause D: stakes about a tenth of A's, intervention very tractable, field nearly empty. Verdict: D over C for where I'd personally spend the next five years.

  4. Cause E vs F: exact same structure as 3 — E has 10x F's stakes and is crowded, F is small-stakes, easy, and ignored — except in this one F's tractability depends entirely on one lab keeping its funding, and if they pivot the whole approach dies. Verdict: E over F. I flip, and I can't say why, other than that F's tractability feels fragile in a way D's didn't.

  5. When pressed I also think neglectedness isn't its own value at all — it's just one route to "how much good does my next hour do here," the same way tractability is. It should already be baked into an impact estimate, so giving it a seperate column is double counting. And yet every time I actually fill in a spreadsheet I do give it its own column, and it changes the ranking. So either I don't believe what I say I believe, or the column is doing something legit that I'm mislabeling.

  6. Personal fit. I say out loud that this is about causes, not about me. But if a cause happens to need exactly the skills I have, I rank it way higher, and I don't feel bad about it. Is fit a fourth term, or is it just tractability-relative-to-me, or is it cheating?

  7. Time. A cause that pays off in 5 years vs one that pays off in 150. I don't discount future people morally, not at all. But I always pick the 5-year one, and I don't think that's weakness of will — I think it's something about not being able to tell whether the 150-year one is real.

  So: is there a principle — ideally something I could state as an explicit rule or scoring function rather than a vibe — that gets most or all of these? Give me a couple of candidates if one won't do it. For each, say precisely what it is, which of my cases each clause is there to save, and what it says about a case I haven't listed: a cause with enormous stakes, essentially zero tractability, and essentially zero attention. Does anything ever make that the right pick, or does my ranking bury it forever no matter how big the stakes get? And be honest about which of my verdicts a decent principle forces me to give up. I'd rather drop 4 and keep 3 than be handed something that technically fits everything by being infinitely complicated.
reasoning: |-
  Okay, let me try to work through this user's problem. They're struggling to find a consistent principle behind their gut feelings about cause prioritization. They've listed several cases with specific verdicts, and they want an explicit rule that explains most of them without being overly complicated. 

  First, I notice the user rejects the standard ITN framework but keeps bumping against its components. Their cases show contradictions - like flipping between Cause D and F despite similar structures, or admitting neglectedness feels redundant but still using it. There's also tension around personal fit and time horizons. 

  Hmm... the core challenge seems to be balancing three things: 
  1) Their intuitive heuristics that clearly work in cases 1-3 
  2) The exceptions where those heuristics break (case 4 with fragile tractability) 
  3) Their meta-concerns about double-counting neglectedness and moral time discounting

  The fragile tractability in case 4 is particularly interesting. It suggests their intuition cares about robustness - not just current tractability but how likely it persists. That's different from standard tractability metrics. 

  For personal fit, they're right that it's tractability-relative-to-them, but there's more: it also affects their opportunity cost. If they're uniquely good at something, their impact elsewhere might be lower. 

  On time horizons... their explanation about uncertainty resonantes. When they say "can't tell if the 150-year cause is real", that points to epistemic limitations rather than moral discounting. 

  The user's final question about zero-tractability/high-stakes causes is profound. Under any efficiency-based system, those would rank low - but their phrasing ("bury it forever") suggests discomfort with that. Maybe they want permission to ignore such causes without guilt?

  Putting this together, I think we need a framework that:
  - Explicitly incorporates robustness and uncertainty 
  - Treats personal fit as multiplier rather than separate factor 
  - Quantifies neglectedness as marginal impact rather than standalone virtue
  - Accepts that some verdicts (like case 4) might remain messy without being inconsistent

  The "expected marginal impact per unit effort" formula seems promising, especially if we define:
  - Impact as scale discounted by probability of success 
  - Marginal as adjusted for crowdedness and personal comparative advantage 
  - Effort including their time and opportunity cost

  For the zero-tractability cause... mathematically it'll always lose, but that's probably correct. If something truly has zero chance of working, even infinite stakes don't justify wasting resources. The user might need to make peace with that.

  The biggest tradeoff is forcing case 4 into this model. We can explain it through robustness affecting probability of success, but the user must accept that "fragility" is part of tractability assessment rather than a separate dimension. If they can swallow that, everything else clicks.
answer: |-
  Here's a principle that captures your core intuitions while forcing clarity on the edge cases:

  **Expected Marginal Impact per Unit Effort (EMIE) =**
  **[Probability of Success] × [Scale of Impact] × [Comparative Advantage Factor]**
  **÷ [Effort Cost + Opportunity Cost]**

  **Why this works & how it handles each case:**

  1.  **Cause A:** High `Probability of Success` (proven fix), decent `Scale`, very high `Comparative Advantage Factor` (no one else is doing it → your marginal contribution is huge), low `Effort Cost` (cheap fix). **→ High EMIE.**
  2.  **Cause B:** Same `Probability of Success` & `Scale` as A. BUT, `Comparative Advantage Factor` ≈ 0 (crowded field → your marginal contribution is tiny). **→ Low EMIE.** *Neglectedness is absorbed into Comparative Advantage Factor.*
  3.  **Cause D vs. C:**
      *   **D:** Lower `Scale` (1/10th A), very high `Probability of Success` (very tractable), high `Comparative Advantage Factor` (nearly empty field).
      *   **C:** Higher `Scale` (10x A), lower `Probability of Success` (harder intervention), lower `Comparative Advantage Factor` (crowded-ish).
      *   Your verdict (D > C) implies the combined boost from `Probability of Success` and `Comparative Advantage Factor` outweighs the lower `Scale`. EMIE quantifies this trade-off. *Neglectedness & Tractability are combined into Probability of Success and Comparative Advantage.*
  4.  **Cause F vs. E (The Flip):**
      *   **F:** High `Probability of Success` *only if* the specific lab is funded → **very low effective `Probability of Success`**. High `Comparative Advantage Factor` otherwise. Fragility *directly reduces the estimated `Probability of Success`*.
      *   **E:** Lower `Probability of Success` than F *if the lab stayed*, but robust → **higher *effective* `Probability of Success`** than F. Lower `Comparative Advantage Factor`.
      *   Your flip (E > F) is explained: F's fragility drastically lowers its `Probability of Success`, outweighing its higher potential `Comparative Advantage Factor` and making E's EMIE higher. *Tractability now incorporates robustness.*
  5.  **Neglectedness Column:** You're right. The "Comparative Advantage Factor" explicitly captures neglectedness *as it relates to your marginal contribution*. A separate column *is* double-counting. Your spreadsheet likely captures an intuition about *your leverage* that standard "neglectedness" misses. EMIE forces this into one factor. **Solution:** Stop the separate column. Calculate Comparative Advantage Factor based on current capacity/resourcing vs. the problem size *and* your specific skills.
  6.  **Personal Fit:** This is **Comparative Advantage Factor**. It's not "cheating," it's efficiency. If your unique skills drastically increase the `Probability of Success` or reduce the `Effort Cost` for this cause *compared to others*, or if the field is small and your skills are rare, your marginal impact is higher. EMIE formalizes this. *It's tractability/impact relative to YOU.*
  7.  **Time (5yr vs 150yr):** This primarily impacts **Probability of Success**. *Why?*
      *   **Uncertainty:** Can you reliably predict needs/context/solutions 150 years out? Low confidence → Low `Probability of Success`.
      *   **Path Dependence:** Will your specific action actually chain causally to the distant outcome? Many intervening variables → Low `Probability of Success`.
      *   **Value Drift:** Will future generations value the outcome the same way? Potential mismatch → Reduces effective `Scale`.
      *   Your choice isn't moral discounting; it's epistemic humility. EMIE quantifies this as lower `Probability of Success` for long-term bets with high uncertainty. *Time horizon is a key input for estimating Probability of Success.*

  **Handling the Edge Case: Enormous Stakes, Zero Tractability, Zero Attention**

  *   **Scale of Impact:** Enormous.
  *   **Probability of Success:** Essentially Zero (by definition: "zero tractability").
  *   **Comparative Advantage Factor:** Irrelevant if `P(Success) = 0`.
  *   **Effort Cost:** >0.
  *   **→ EMIE = (Near 0) × (Big Number) × (Anything) / (Cost) ≈ 0.**

  **EMIE buries it forever, and that's correct.** Why?

  1.  **Zero Tractability = Zero Probability of Success:** If there's truly *no way* to make progress (now or foreseeably), effort is wasted, regardless of stakes. Spending resources here has an opportunity cost – those resources could achieve *actual* good elsewhere (Cause A, D, etc.).
  2.  **Wishful Thinking Isn't Impact:** Hoping a "zero tractability" cause might *become* tractable isn't a reason to work on it *now*. Work on making *it* tractable first (a different cause!), or work on something that *is* tractable.
  3.  **Stakes Alone Aren't Enough:** EMIE requires a plausible pathway to *affect* those stakes. Without that pathway, the stakes are tragic, but not actionable for *your* effort allocation.

  **What Verdicts You Might Have to Give Up (or Refine):**

  1.  **Case 4 Clarity:** EMIE *explains* your flip (F's fragility → low `P(Success)`). You have to accept that "tractability" *must* include robustness and not just current feasibility. This isn't dropping the verdict; it's justifying it rigorously.
  2.  **Absolute Neglectedness:** You must drop the idea that "neglectedness" has intrinsic value separate from your marginal contribution (Comparative Advantage Factor). A cause crowded with incompetent people *might* still have high marginal value for *you* if you're highly skilled. EMIE captures this nuance; a neglectedness column doesn't.
  3.  **The "Zero Tractability" Fantasy:** You have to accept that genuinely unsolvable (or currently unsolvable) problems, no matter how big, are terrible targets for direct effort. EMIE forces this rational conclusion.

  **Candidates for the Principle (Refinements of EMIE):**

  1.  **Basic EMIE:** As above. Handles all your cases well, forces explicitness on fragility (Case 4) and time (Case 7).
  2.  **EMIE + Explicit Robustness:** Split `Probability of Success` into `P(Initial Success)` and `P(Robust Scaling/Enduring Impact)`, multiplying them. This makes Case 4 even clearer (`P(Robust)` for F is very low) but adds complexity. *Probably overkill.*
  3.  **EMIE + Uncertainty Bands:** Acknowledge estimates are fuzzy. Calculate best-guess EMIE, but also min/max plausible bounds. If a cause's *min plausible EMIE* is still very high (e.g., Cause A), it's robust. If its *max plausible EMIE* is high but min is very low (e.g., Cause F, long-term causes), it's risky. This formalizes your intuition in Case 7.

  **Conclusion:**

  **Expected Marginal Impact per Unit Effort (EMIE)** is the explicit scoring function matching your core intuitions:

  *   **Probability of Success:** Captures tractability, robustness (Case 4), and time horizon uncertainty (Case 7).
  *   **Scale of Impact:** Captures stakes.
  *   **Comparative Advantage Factor:** Captures neglectedness *as it affects your marginal impact* (Cases 1, 2, 3, 6) and personal fit (Case 6).
  *   **Effort Cost:** Captures personal resource expenditure.
  *   **Opportunity Cost:** Ensures comparison to alternatives.

  It forces you to:
  *   Drop separate neglectedness accounting (absorbed into Comparative Advantage).
  *   Treat personal fit as a legitimate impact multiplier (Comparative Advantage).
  *   Acknowledge that fragility destroys tractability (Case 4).
  *   Frame long time horizons as increasing uncertainty, not moral discounting (Case 7).
  *   Accept that genuinely intractable problems are worthless targets, no matter the stakes.

  This principle provides a rigorous, quantifiable framework that aligns with your "gut calls" while eliminating inconsistencies and double-counting. It buries the zero-tractability cause rationally, reflecting your practical verdicts in Cases 1-7.
