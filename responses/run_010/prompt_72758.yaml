  New vignette: a hospital pharmacist is barred by procurement policy from ordering from an unlicensed supplier. She orders from one anyway because the licensed one can't deliver before Monday and she wants her weekend free. She's told the switch will also certainly end the ward's drug shortage and save patients, and says she doesn't care about the patients either way. The patients are saved. Did she save them intentionally?

