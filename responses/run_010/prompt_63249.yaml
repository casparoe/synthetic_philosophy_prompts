     This is a symmetry argument that both camps accept.

  Part II: The Disagreement, Stated Twice

  We need two renderings of the residual disagreement: one in the conservationists' idiom and one in the deflationists'. Then a glossary.

  **Conservationists' Rendering (Camp A):**
  The no-free-lunch theorems establish that any inductive method, when evaluated over all logically possible worlds, cannot be generally superior to any other. The apparent success of induction in practice must therefore be attributed to substantive assumptions about the world, such as a preference for smoother or simpler patterns. Without such assumptions, the notion of inductive rationality is vacuous because any method can be made to look arbitrarily bad by choosing an adversarial world. Thus, Hume's challenge is formally vindicated: induction cannot be justified without prior assumptions.

  **Deflationists' Rendering (Camp B):**
  The no-free-lunch theorems are mathematical tautologies that hold in a setting where all possible target functions are equally weighted. They do not address the practical problem of induction, which is how to make predictions given finite resources and specific evidence. The theorems show that without any prior knowledge, no method is better than any other, but this does not imply that induction is unjustified; it merely highlights that prior knowledge is necessary for learning. Therefore, the results are irrelevant to Hume's problem because they do not speak to the rationality of induction under realistic conditions where agents have access to background information.

  **Glossary of Terms:**

  1. **Assumption:**
     - **Camp A (Conservationists):** Any substantive constraint on the set of possible worlds or the prior distribution over worlds that breaks the symmetry of the uniform prior. Without such an assumption, induction cannot be justified.
     - **Camp B (Deflationists):** Background knowledge that an agent brings to the learning problem. They argue that such assumptions are inevitable and that the NFL theorems do not challenge their use.
     - **Stipulation for Joint Use:** A premise that is not entailed by the mere structure of the learning problem and that assigns non-uniform probability to possible states of the world.

  2. **Prior:**
     - **Camp A:** A probability distribution over the hypothesis space that must be assumed for induction to work. It is the locus of the substantive assumptions.
     - **Camp B:** A representation of the agent's initial beliefs, which may be updated by evidence. It is a necessary component of any learning system.
     - **Stipulation:** A probability distribution over the set of possible target functions, which may be uniform or non-uniform.

  3. **General Purpose:**
     - **Camp A:** An inductive method that does not rely on any prior assumptions about the world. The NFL theorems show that no such method can be generally successful.
     - **Camp B:** A method that can be applied to a wide range of problems without domain-specific tuning. The NFL theorems do not preclude such methods as long as they incorporate learning from data.
     - **Stipulation:** An algorithm that does not require domain-specific knowledge and can be applied to any learning problem of a given form.

  4. **Justification:**
     - **Camp A:** A demonstration that induction is rational without relying on any substantive assumptions about the world. The NFL theorems show that such a justification is impossible.
     - **Camp B:** A reason to believe that induction will lead to successful predictions in a given context, which may rely on background knowledge. The NFL theorems do not undermine such justifications.
     - **Stipulation:** A reason to prefer one inductive method over another in a particular setting.

  5. **Algorithm:**
     - **Camp A:** A deterministic or randomized procedure for making predictions from data. The NFL theorems apply to any such algorithm.
     - **Camp B:** A computable procedure that maps data to predictions. The NFL theorems apply to algorithms in the abstract but do not preclude the design of effective algorithms for specific distributions.
     - **Stipulation:** A well-defined procedure for producing a prediction given input data.

  Part III: Cruxes

  We have a table with columns: Crux, Construction/Proof/Thought Experiment, Camp A Prediction, Camp B Prediction, Concession if Prediction Fails.

  We'll cover four cruxes:

  1. **Crux 1: Whether the standing hypothesis that the target is fixed while the data are drawn from a stable arrangement is itself an inductive assumption.**
     - **Construction:** Consider a setting where the data are not generated by a fixed target. For example, the target function may change over time. Then the NFL theorems, which assume a fixed target, do not apply. The question is whether assuming a fixed target is an inductive assumption in the Humean sense.
     - **Camp A Prediction:** Yes, because it assumes the stability of the world over time, which is not given a priori and is a substantive assumption.
     - **Camp B Prediction:** No, because it is a modeling assumption for the theorem and not an inductive belief about the world. The theorem is a conditional statement: if the target is fixed and data are i.i.d., then the NFL holds. This does not require that we believe the target is fixed in reality.
     - **Concessions:**
        - If Camp A is wrong: They concede that the NFL theorems do not necessarily rely on an inductive assumption but are purely mathematical.
        - If Camp B is wrong: They concede that the NFL theorems themselves depend on an inductive assumption (the fixed target) and hence cannot be premise-neutral.

  2. **Crux 2: Whether the equalizing identity survives restriction to computable functions.**
     - **Construction:** Consider a class of target functions that are computable by a Turing machine with a fixed bound on resources (e.g., time). The set of such functions is not closed under permutation of the domain (because permuting the inputs might break computability). Then, check if the average performance of two algorithms is still equal over this restricted set.
