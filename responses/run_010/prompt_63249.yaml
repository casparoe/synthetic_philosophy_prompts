     - **Camp B Prediction:** The identity still holds for any set of targets that is closed under the relabelings induced by the learning algorithm's symmetries. However, since the computable functions under resource bounds may not be closed under permutation, the identity may break. But this does not affect their view because the NFL theorems are about the uniform prior over all functions, and in practice, we use non-uniform priors.
     - **Concessions:**
        - If Camp A is wrong (i.e., the identity holds even in some non-closed sets): They concede that the NFL results are more robust than they thought.
        - If Camp B is wrong (i.e., the identity breaks in a practically relevant restricted set): They concede that the NFL theorems are less relevant to real-world learning where resource bounds apply.

  3. **Crux 3: Whether worst-case online results vindicate a general-purpose inductive method.**
     - **Construction:** Consider the multiplicative weights algorithm that works over a finite class of predictors. It guarantees that the regret (difference in cumulative loss) compared to the best predictor in the class is bounded by O(log N) where N is the class size. This holds for any sequence of outcomes. The question is whether this provides a general-purpose method that requires only the choice of the class.
