  We list propositions that both camps accept without reservation.

  1. **The No-Free-Lunch Theorems (NFL):** 
     - **Weak reading (average performance):** For any two learning algorithms A and B, and for any performance measure (like accuracy), the average performance over all possible target functions (with respect to a uniform distribution) is identical. That is, no algorithm is better than any other on average when all targets are equally likely.
     - **Strong reading (distributional):** The entire probability distribution of performance (e.g., the sequence of errors over time) is the same for any two algorithms when averaged uniformly over all targets. However, the strong reading requires that the learning problem is symmetric under permutation of the target function labels and that the data sequence is generated by a fixed target and i.i.d. draws from a fixed distribution over the domain.

     Both camps agree that the weak reading is a mathematical identity. The strong reading is also an identity under the stated conditions (fixed target, i.i.d. data). 

     The conservationists (A) use the weak reading for their argument, but note that the strong reading is also available in some settings. The deflationists (B) also accept both readings as mathematical truths but argue that the weak reading is sufficient for their deflationary stance.

  2. **Schaffer's Conservation Law for Generalization (Learning Theory Version):** 
     - For any two learning algorithms, the sum of their performance advantages over all possible target functions (with uniform weighting) is zero. More precisely, if we define the advantage of algorithm A over algorithm B on a target f as the difference in their performance (e.g., accuracy), then the average of this advantage over all f is zero.

     Both camps accept this as a mathematical identity.

  3. **Hume's Problem of Induction:** 
     - Hume's problem asks: How can we justify the use of inductive reasoning (i.e., inferring general patterns from specific observations) if the future might not resemble the past? In particular, without assuming the uniformity of nature or any prior knowledge, can we show that induction is rationally obligatory or at least rationally permissible?

     Both camps accept that Hume's problem is about the justification of induction in the absence of any prior assumptions.

  4. **Setting S: Expected Accuracy under Uniform Prior (M_u):**
     - In setting S, the domain has four points (x1,x2,x3,x4) in a cycle. There are 16 target functions (each mapping to {0,1}). 
