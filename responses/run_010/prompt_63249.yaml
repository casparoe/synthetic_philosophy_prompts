  ### Joint Statement on No-Free-Lunch Theorems and Hume's Problem of Induction

  This document presents an agreed-upon framework for the disagreement between Camp A (conservationists) and Camp B (deflationists) regarding the philosophical implications of the no-free-lunch (NFL) theorems for Hume's problem of induction. It is structured to avoid partisan language, adjudication, or appeals to authority, focusing instead on precise, neutral formulations. Both parties endorse the entirety of this document as a fair representation of their shared and divergent views. The content adheres to the constraints: no citations, no bibliographies, and accessibility without specialized literature. Key terms are defined jointly in Part II to prevent equivocation.

  ---

  ### Part I: Agreed Claims

  The following propositions are accepted without reservation by both camps. They include statements of the NFL results, Hume's problem, and derivations for Setting S.

  1. **No-Free-Lunch Theorems (Weak Reading)**:  
     For any pair of deterministic or randomized learning algorithms \(A\) and \(B\), and for any performance metric (e.g., accuracy), the average performance over all possible target functions \(f\) (weighted uniformly) is identical. Formally:  
     \[
     \frac{1}{|\mathcal{F}|} \sum_{f \in \mathcal{F}} [\text{Perf}(A,f) - \text{Perf}(B,f)] = 0,
     \]  
     where \(\mathcal{F}\) is the set of all possible target functions mapping a domain to outputs. This holds under a stable sampling protocol: data points are drawn i.i.d. from a fixed distribution, and the target \(f\) is fixed but unknown. The weak reading is a mathematical identity and requires no assumptions about \(f\) beyond its existence in \(\mathcal{F}\).

  2. **No-Free-Lunch Theorems (Strong Reading)**:  
     Under the same sampling protocol as above, the entire probability distribution of performance (e.g., the sequence of errors over time) is identical for any two algorithms when averaged uniformly over \(\mathcal{F}\). Formally, for any sequence of observed data and any performance trajectory, the distribution over \(\mathcal{F}\) is invariant between \(A\) and \(B\). The strong reading assumes the measurable structure of \(\mathcal{F}\) is closed under permutations of the domain labels. Both camps agree the strong reading is a mathematical identity under its hypotheses but dispute its necessity for their arguments.

  3. **Schaffer's Conservation Law**:  
     For any performance metric and any pair of algorithms \(A\) and \(B\), the sum of \(A\)'s performance advantages over \(B\) across all targets in \(\mathcal{F}\) is zero. This is equivalent to the weak NFL reading and is accepted as an identity.

  4. **Camp A's Reliance**:  
     Conservationists use the weak reading (which suffices for their argument) but note the strong reading is available in symmetric settings. Their claim: the identity shows that no algorithm is superior "as such" (without assumptions), rendering induction "contentless" prior to external inputs.

  5. **Camp B's Reliance**:  
     Deflationists use the weak reading (which suffices for their argument) and accept the strong reading where applicable. Their claim: the identity holds only in a uniform-average setting and does not engage with resource-constrained, non-uniform learning.

  6. **Hume's Problem of Induction**:  
     Hume's problem asks: "Can inductive reasoning (extending observed patterns to unobserved cases) be justified as rational or reliable without presupposing substantive assumptions about the uniformity of nature or the future resembling the past?" Both camps accept this as the target. Hume's challenge is epistemological, not computational: it questions whether induction can be vindicated absent prior constraints.

  7. **Setting S under Uniform Prior (\(M_u\))**:  
     In Setting S (domain: cycle \(x_1, x_2, x_3, x_4\); targets: 16 binary functions; sampling: two random points revealed, one random test point guessed), the expected accuracy of any learner (deterministic or randomized) under the uniform prior \(M_u\) is exactly 0.5.  
     **Derivation**:  
     - For any fixed set of three distinct points (two observed, one test), the uniform prior ensures all eight labelings are equally likely (each has probability \(1/8\)).  
     - Conditional on the labels of two observed points, the test point's label is uniform (probability 0.5 for 0 or 1) due to symmetry.  
     - Thus, no learner can exceed 0.5 expected accuracy, as the test label is independent of observations and predictions.

  ---

  ### Part II: The Disagreement, Stated Twice

  **Conservationist Rendering (Camp A)**:  
  The NFL theorems formally vindicate Hume's problem by demonstrating that any apparent advantage of an inductive method arises from assumptions external to the method itself. Without such assumptions, induction cannot be justified because the theorems establish a precise symmetry: no method is superior to any other when evaluated over all logically possible worlds. Thus, induction, prior to imported assumptions, is not merely unjustified—it is conceptually vacuous. Hume's challenge remains unmet.

  **Deflationist Rendering (Camp B)**:  
  The NFL theorems are mathematical tautologies that do not engage with Hume's problem. They hold only under a uniform average over all possible worlds, a setting irrelevant to resource-constrained agents who operate with background knowledge. The theorems neither solve nor sharpen Hume's challenge; they bypass it by ignoring the only meaningful question: how agents should reason given finite data and specific evidence. Induction remains rational in practice because agents use assumptions tailored to their epistemic context.

  **Glossary of Jointly Stipulated Terms**:  
  To prevent verbal disputes, both camps adopt these definitions:  
  - **Assumption**: A premise that assigns non-uniform probability to possible states of the world. Not a necessary truth.  
  - **Prior**: A probability distribution over the set of possible target functions. Represents initial beliefs, which may be updated.  
  - **General purpose**: An algorithm that requires no domain-specific knowledge to apply.  
  - **Justification**: A reason to prefer one method over another in a specific context. Not necessarily a priori.  
  - **Algorithm**: A fixed procedure (deterministic or randomized) mapping data to predictions.

  ---

  ### Part III: Cruxes

  The table below presents agreed-upon cruxes. "Prediction" is what each camp expects; "Concession" is the philosophical cost if wrong. Experiments/constructions are shared and checkable.

  | Crux | Construction/Experiment | Camp A Prediction | Camp B Prediction | Concession if Prediction Fails |
  |------|-------------------------|-------------------|-------------------|-------------------------------|
  | **1. Is the fixed-target assumption an inductive premise?**<br><br>Does the NFL theorems' reliance on a fixed target and i.i.d. data sampling import an inductive assumption of the sort Hume questioned? | In Setting S, vary the sampling protocol: allow the target to change randomly after each observation. Test if the NFL identities hold. | Yes: The fixed-target hypothesis assumes the world's stability, a substantive inductive commitment. NFL is not premise-neutral. | No: The fixed-target is a modeling choice for the theorem, not a real-world belief. NFL remains a conditional mathematical fact. | **A**: Concede NFL is mathematically premise-neutral.<br>**B**: Concede NFL depends on an inductive premise and loses epistemic force. |
  | **2. Does the identity survive computable functions?**<br><br>Does the NFL identity hold when \(\mathcal{F}\) is restricted to functions computable within fixed resource bounds, breaking closure under permutations? | Restrict \(\mathcal{F}\) in Setting S to functions computable by a Turing machine with time bound \(O(n)\). Compute average performance for two algorithms. | No: Symmetry breaks; some algorithms outperform others without prior assumptions. NFL's philosophical moral (universal equivalence) fails. | Yes for symmetric subsets, but not universally. NFL still applies, but its irrelevance to practice is more obvious. | **A**: Concede NFL's moral holds even in resource-bounded settings.<br>**B**: Concede NFL's irrelevance is mitigated; restricted settings permit non-trivial general-purpose methods. |
  | **3. Do worst-case online results vindicate general-purpose induction?**<br><br>Does a multiplicative-weights algorithm (with logarithmic regret over a finite class) justify a general-purpose inductive method, or does it relocate the commitment to the class choice? | Apply the algorithm to Setting S with a small class (e.g., constant functions). Test if regret bounds imply "general-purpose" justification without prior knowledge. | No: The algorithm's performance depends entirely on the class containing a good predictor, which is an external assumption. | Yes: The algorithm is fixed and works for any class; the choice of class is a separate, non-inductive step. | **A**: Concede regret bounds provide a prior-free justification.<br>**B**: Concede the algorithm requires inductive commitment to the class. |
  | **4. Is \(M_u\) a faithful "no assumptions" prior?**<br><br>Does the uniform prior \(M_u\) represent a neutral "no inductive assumptions" state, or is it a positive commitment weighting anti-inductive worlds equally? | In Setting S, compare \(M_u\) to a hypothetical "complete ignorance" state (no prior). Test if NFL identities hold only under \(M_u\). | Yes: \(M_u\) is uniquely neutral; any non-uniform prior is an assumption. | No: \(M_u\) is one assumption among many; ignorance cannot be formalized as a distribution. | **A**: Concede NFL is not about epistemic neutrality.<br>**B**: Concede \(M_u\) captures the absence of assumptions, making NFL a genuine obstacle. |

  ---

  ### Part IV: The Verbal Component

  **Dissolved Disputes**:  
  With the stipulations in Part II, these disputes dissolve:  
  - Whether "assumptions" are avoidable: Dissolves because **assumption** is defined as any non-uniform prior, making them necessary for non-trivial performance.  
  - Whether "general-purpose" methods exist: Dissolves because **general purpose** is defined as domain-agnostic algorithms, which both accept exist (e.g., Bayes with uniform prior).  
  - Whether "justification" requires a priori proof: Dissolves because **justification** is contextual, not universal.

  **Residual Disagreement**:  
  The substantive residue is small but philosophically significant:  
  - **Camp A**: NFL shows induction is vacuous without prior assumptions, vindicating Hume.  
  - **Camp B**: NFL is a mathematical truism irrelevant to inductive practice, bypassing Hume.  

  The residue hinges on whether NFL's formal symmetry implies a categorical indictment of induction (A) or is an artifact of an inapplicable model (B). **Assessment**: The residue is small in scope (limited to interpretation) but has high epistemic stakes. It may not warrant eleven years, as much debate stemmed from terminological differences now resolved.

  ---

  ### Part V: Appendix: The Arithmetic

  **Setting S Explicit Calculations**  
  *Domain*: Cycle \(x_1, x_2, x_3, x_4\) (edges: \((x_1,x_2)\), \((x_2,x_3)\), \((x_3,x_4)\), \((x_4,x_1)\)).  
  *Targets*: 16 binary functions. \(T(f)\) = number of edges with differing labels.  

  1. **Enumeration of Targets, Weights, and Normalized Probabilities**:  
     - \(T(f) = 0\): 2 functions (all 0s or all 1s).  
     - \(T(f) = 2\): 12 functions (e.g., 1100, 0011, 1000, 0100, etc.).  
     - \(T(f) = 4\): 2 functions (0101, 1010).  
     - \(M_s\) (smooth prior): Weight proportional to \(2^{-T(f)}\).
       - Unnormalized: \(T=0\): \(2^0 = 1\) (weight total: \(2 \times 1 = 2\)); \(T=2\): \(2^{-2} = 0.25\) (weight total: \(12 \times 0.25 = 3\)); \(T=4\): \(2^{-4} = 0.0625\) (weight total: \(2 \times 0.0625 = 0.125\)). Sum: \(2 + 3 + 0.125 = 5.125\).  
       - Normalized: \(P_{M_s}(T=0) = 2/5.125 = 16/41\); \(P_{M_s}(T=2) = 3/5.125 = 24/41\); \(P_{M_s}(T=4) = 0.125/5.125 = 1/41\).  
     - \(M_a\) (anti-smooth prior): Weight proportional to \(2^{T(f)}\).
       - Unnormalized: \(T=0\): \(1\) (total: 2); \(T=2\): \(4\) (total: 48); \(T=4\): \(16\) (total: 32). Sum: \(2 + 48 + 32 = 82\).  
       - Normalized: \(P_{M_a}(T=0) = 2/82 = 1/41\); \(P_{M_a}(T=2) = 48/82 = 24/41\); \(P_{M_a}(T=4) = 32/82 = 16/41\).

  2. **Best Expected Accuracy under \(M_s\) in S**:  
     - Optimal learner: Predicts the label with higher posterior probability given observed data under \(M_s\).  
     - Calculation: Averaging over all observed data pairs and labelings under \(M_s\), expected accuracy = \(28/41 \approx 0.6829\).  
     - Learner: Bayes optimal classifier for \(M_s\) (e.g., if adjacent points \(x_1,x_2\) have same labels, predict test point = observed label; if different, predict based on neighborhood smoothness).

  3. **Variants**:  
     - **S₁** (observed points fixed, e.g., \(x_1,x_2\)): Expected accuracy under \(M_s\) = \(28/41\) (same as S by symmetry).  
     - **S₂** (labels from independent draws of \(M_s\)): Observed labels from one \(f_1 \sim M_s\), test label from an independent \(f_2 \sim M_s\). Expected accuracy = 0.5 (test label independent of observations).

  4. **Offset of Gains/Losses**:  
     - Let \(L_s\) be the smoothness-biased learner (optimal for \(M_s\)).  
     - Under \(M_s\), gain over uniform baseline: \(28/41 - 0.5 = 15/82\).  
     - Under \(M_a\), loss: Expected accuracy of \(L_s\) is \(< 0.5\) (computed via conservation: average over uniform prior is 0.5, so gains under \(M_s\) offset by losses under other priors, including \(M_a\)).  
     - **Offset is pairwise**: For any fixed baseline learner (e.g., constant predictor), the NFL identity ensures \(L_s\)'s gain under \(M_s\) is balanced by its loss under \(M_a\) when averaged uniformly. This holds pairwise between \(L_s\) and the baseline, not only after aggregating over all learners.  
     - **No camp supported**: Conservationists see the pairwise offset as exemplifying their "no free lunch" principle; deflationists see it as a mathematical tautology irrelevant to practice.

  **Closing Sentences on Philosophical Bearing**:  
  - **Camp A**: "The arithmetic confirms that inductive gains require matching assumptions to the world, and the pairwise offset under NFL directly formalizes Hume's core challenge."  
  - **Camp B**: "The arithmetic is a tautological consequence of uniform averaging and does not engage Hume, as real agents use \(M_s\) for reasons independent of NFL."

  ---

  ### Final Adjudication (Not Part of Joint Statement)
  Having drafted this document, we observe that the deflationist position is better placed. The NFL theorems are mathematical truths but do not address the contextual, resource-bound nature of induction. Conservationists overstate their epistemic implications, while deflationists correctly separate formal tautologies from practical rationality. However, conservationists rightly emphasize that all practical induction relies on assumptions, leaving Hume's challenge intact for foundational contexts. The dispute reduces to whether "induction in general" includes or excludes background knowledge—a semantic residue not justifying the debate's duration.
