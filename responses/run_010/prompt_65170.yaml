answer: |-
  **My answer**  
  I choose neither horn of your dilemma, as both rest on a false premise. Your fieldworker *has* interpreted her interlocutors, and this success reinforces, not undermines, my core account. Meaning remains fixed by truth conditions publicly manifest in behaviour, even when those conditions shift dynamically.  

  **The argument**  
  Your case splendidly illustrates my distinction between prior and passing theories, but you misconstrue it. The fieldworker’s predictive success is only possible against a vast, tacit background of agreement—about objects, actions, and intentions in the world—that makes her dynamic adjustments intelligible *as interpretation*. Without massive shared truth-conditions (charity in identifying beliefs and meanings), she couldn’t track redefinitions or contextual shifts at all. The passing theory isn’t built "from scratch"; it’s a local, occasion-specific refinement of an evolving prior theory constrained by the need for overall coherence in truth-conditions. That meanings aren’t eternally fixed to sentence-types doesn’t abolish language; it shows language *is* this open-ended interpretive practice. Convergence occurs in the successful coordination of truth-conditional content moment by moment.  

  **Back to you**  
  If the fieldworker truly shared *no* standing conventions with her hosts—no stable truths about the world underlying their utterances—how could she ever recognise a "redefinition" or grasp *what* a speaker was "doing with words right then"? Doesn’t her very success presuppose prior convergence on what counts as a rational aim or apt response?  

