prompt: |-
  I chair the board of the Calderwood Foundation, a $190 million private family foundation in a mid-sized manufacturing city, and I came to this role as an outsider: I was a high-school principal here for twenty-six years before retiring, and four of our current scholarship recipients were students of mine. The endowment was set up in 1961 by a man who made his money in metal plating. Three provisions of the original instrument still bind us. First, two of our nine seats are reserved in perpetuity to his lineal descendants, removable by nobody, and those seats are currently held by a brother and sister in their sixties who have no other connection to the city. Second, at least half of every year's grantmaking must go to organizations operating in the two school districts that covered the founder's boyhood neighborhood. Third, the principal may never be invaded. The awkward fact that governs everything we do is that the neighborhood in question sits directly downwind of the old plant, whose solvent plume contaminated the groundwater; it is now the city's poorest area and majority recent-immigrant, and there is active litigation over the contamination in which the family has never admitted liability and the foundation has never paid a dollar. Our largest program is a scholarship that covers full tuition at any in-state public university for graduates of those two districts — about ninety students a year, which our spending policy can sustain but not expand.

  Six weeks ago a woman who made a fortune in logistics software offered us $14 million to endow a statewide version of the scholarship, which our finance committee estimates would support roughly 120 additional students a year in perpetuity, entirely new money layered on top of our own program. Her conditions are governance conditions: within five years we must eliminate the descendant-reserved seats, drop the geographic restriction, adopt a publicly posted application and selection process, and publish an annual accounting of returns and grants; if we fail, the gift reverts to her. Our counsel thinks we could get a court to modify the deed on the seats and the geography, that the state attorney general would have to be given notice, and that it would take perhaps eighteen months. Her counsel says the conditions are negotiable in form but not in substance. The board is split three ways. The two descendants argue that the geographic restriction is the whole point of the instrument — that tying the money to the neighborhood the plant ruined is the closest thing this family has ever had to an acknowledgment, and that converting a bounded obligation into a statewide program with better branding is a betrayal dressed as an expansion; they have told me privately they will resign and talk to the press if we accept. A third trustee, a former city council member, objects to both sides: she thinks a tax-advantaged private endowment deciding which children in which zip codes attend college is precisely the power that belongs to a legislature, that the second donor's gift carries a large deduction and would reduce her exposure if the wealth-tax measure on next year's ballot passes, and that the honest course is to spend ourselves down and hand the remainder to the public schools. Everyone else is some shade of reluctant yes.

  The donor needs an answer before the end of the quarter, eleven weeks out, and our next board meeting is in three weeks. Please draft the memorandum I will circulate to the trustees beforehand. It should recommend one course of action — accept, decline, or accept with specific counter-terms — and it should say concretely what we do about the five-year clock, the court petition, and the ninety students now in the program if we decline. State the reasoning in terms the descendant trustees and the council member could each actually answer, rather than in abstractions, and tell me what we should say to the downwind neighborhood in either scenario, including whether any part of a deal should be pointed at the contamination and the health consequences rather than at tuition. Finally, give the strongest case against your own recommendation its full weight and explain why it nonetheless loses — or, if you conclude that it does not lose, say that instead and recommend accordingly. I am not looking for a survey of how foundations handle donor conditions; I need a document the board can vote on.
reasoning: |-
  Hmm, the user chairs the board of a $190M family foundation with a complex dilemma involving a $14M donation offer with significant governance changes attached. The foundation operates under three binding provisions from its 1961 founding: reserved seats for descendants, geographic restrictions to a contaminated neighborhood, and permanent principal protection.

  The donor's conditions would require eliminating descendant seats, dropping geographic restrictions, implementing public processes, and publishing financials - with a five-year deadline and reversion clause if unmet. Board factions include:
  - Two descendant trustees viewing the geographic tie as symbolic acknowledgment of the contamination, threatening resignation and publicity if changes occur
  - One trustee advocating for spending down the endowment as private philanthropy shouldn't determine educational access
  - Others leaning toward acceptance with reluctance

  The user needs a pre-board meeting memorandum recommending concrete action (accept/decline/counteroffer), addressing:
  1) Five-year transition timeline
  2) Court modification process for the deed
  3) Protection for current scholarship recipients
  4) Communication strategy with the affected neighborhood
  5) Contamination issue linkage
  6) Strongest counterargument with rebuttal

  Key tensions to resolve:
  - Preserving founder's intent vs expanding impact
  - Symbolic justice for contaminated community vs practical benefits
  - Private philanthropy's role vs public responsibility
  - Financial sustainability vs mission fidelity

  The memorandum must speak directly to descendant trustees' emotional stake in the neighborhood connection and the council member's institutional concerns about private overreach, using concrete examples rather than abstractions. It should also address whether any solution could acknowledge the contamination legacy beyond scholarships.

  Financial constraints are clear: current spending covers 90 local scholarships but can't expand. The $14M could add 120 statewide awards without touching existing funds. However, losing descendant trustees risks reputational damage and potential litigation exposure.

  The court modification path (18 months estimated) appears viable but uncertain. The five-year clock creates implementation pressure. Current scholars must be protected regardless of decision.

  For the affected community, communication must validate their experience while explaining changes. Linking scholarships to contamination health consequences could be explored but may require separate funding.

  The strongest counterargument is the descendants' position that changing geographic focus erases the foundation's moral tether to the harmed community. The rebuttal would acknowledge this but argue that maintaining the status quo perpetuates harm through constrained resources, while expansion brings more resources that could be partially directed back to the community.
answer: |-
  ## Memorandum: Recommendation on the $14 Million Gift Offer

  **To:** Calderwood Foundation Board of Trustees  
  **From:** [Your Name], Chair  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on the $14 Million Donor Gift Offer and Path Forward  

  ### I. Recommendation: Accept the Gift with Specific Counter-Terms

  After careful consideration of the donor's offer, the legal context, the Foundation's mission, and the diverse perspectives of the Board, **I recommend we negotiate to accept the $14 million gift under modified terms.** Specifically, we should seek agreement on:

  1.  **Retain Core Geographic Focus:** Counter-propose that **20% of the *new* scholarship funds (supporting ~24 students/year) must still serve graduates of the original two downwind school districts.** This ensures the founder's connection to the neighborhood remains materially significant within the expanded program.
  2.  **Modify Descendant Seat Requirement:** Instead of eliminating the reserved seats, propose **converting them into non-voting, advisory roles** for the descendants after a 5-year transition. They retain a formal connection and voice, preserving the founder's lineage link, while aligning with the donor's governance goals.
  3.  **Clarify "Public Process":** Negotiate that our application/selection process, while transparent and posted, can incorporate **specific criteria prioritizing factors like first-generation college attendance, financial need, and residency within the original districts** (for the allocated portion), ensuring it remains mission-aligned beyond simple geography.
  4.  **Accelerate Transparency Commitments:** Propose **immediately implementing the annual public accounting of returns and grants**, demonstrating good faith without waiting for the 5-year deadline.
  5.  **Formalize Neighborhood Commitment:** Propose adding a condition that **the Foundation commissions an independent study, funded separately by the donor or from unrestricted funds, on the long-term health and educational impacts of the historical contamination on the downwind community.** Results to be published.

  ### II. Reasoning: Addressing Core Concerns Concretely

  *   **To the Descendant Trustees (Addressing Betrayal & Acknowledgment):** "I understand the profound weight the geographic restriction carries for you. It *is* the tangible link to the neighborhood impacted by the family's business. Accepting this gift *as proposed* would feel like erasing that connection. My counter-proposal ensures that link isn't severed. **24 students from our neighborhood every year, forever, will receive this higher-value scholarship funded by this new money – that's concrete, ongoing recognition.** Converting your seats preserves your family's formal role and voice. The study on contamination impacts directly addresses the history you feel must be acknowledged. This isn't erasure; it's securing *more* resources *while* keeping our commitment visible and active."
  *   **To the Former Council Member (Addressing Private Power & Public Good):** "You rightly question private foundations picking winners and losers in education. This gift forces us to confront that. However, declining $14 million for 120 students statewide doesn't solve that systemic issue; it just leaves those resources unused. Accepting *with conditions* allows us to **leverage private wealth for significantly expanded public good.** We maintain our core obligation to the downwind district *(through the 20% allocation)* while providing far more opportunity statewide. The immediate transparency and public process requirements *increase* accountability, moving us closer to the public trust model you value. Spending down, while principled, would terminate support for our current 90 scholars in just a few years and leave no long-term legacy."

  ### III. Addressing the Mechanics & Current Scholars

  *   **The Five-Year Clock:** We start immediately upon donor acceptance of counter-terms.
      *   **Months 1-6:** Negotiate final terms; File court petition for deed modification (seats & geography); Engage AG.
      *   **Months 7-18:** Litigate/modify deed (per counsel's estimate); Simultaneously design & publicly post new statewide application process (including criteria); Implement public accounting.
      *   **Months 19-60:** Phase in new scholarship program; Transition descendant seats to advisory roles by Year 5 end.
  *   **Court Petition:** Our counsel is confident. We proceed diligently, keeping the Board informed. The AG notification is a procedural step; our argument centers on enabling a major expansion of charitable impact without abandoning the core original purpose (serving the neighborhood via the 20% allocation).
  *   **Current 90 Scholars:** **Absolute Guarantee:** Regardless of the gift's acceptance or the court process, **the funding for every current scholar in the existing program will be honored in full for their entire undergraduate careers.** This is non-negotiable and must be explicitly stated in any agreement. The new gift is layered *on top*.

  ### IV. Communication with the Downwind Neighborhood

  *   **If We Accept (with Counter-Terms):**
      *   **Message:** "This new $14 million gift allows the Calderwood Foundation to do something unprecedented: significantly *increase* the number of full-tuition scholarships available *specifically* for graduates from our neighborhood schools **(mention the dedicated 24 spots from the new fund)**, while also helping many more first-generation students across the state. Crucially, it also funds an independent study to understand the long-term impacts of the past environmental challenges on our community's health and education. This is about securing *more* opportunity here and addressing our shared history directly."
      *   **Action:** Prioritize outreach through trusted community leaders, schools, and local media. Highlight the dedicated neighborhood slots and the contamination study.
  *   **If We Decline:**
      *   **Message:** "After deep consideration, the Board has decided the conditions attached to a major gift would fundamentally alter the Foundation's core commitment to this neighborhood as established by Mr. Calderwood. We remain steadfast in our promise: funding full college tuition for every eligible graduate from [District A] and [District B] who earns it. We will continue to explore ways to strengthen our support within the boundaries of our founding mission."
      *   **Action:** Emphasize continuity and unwavering commitment to the existing program. Acknowledge the difficulty of the decision but reaffirm the neighborhood's centrality.

  ### V. The Strongest Case Against Acceptance & Why It Does Not Prevail

  **The Strongest Counterargument (Descendant Trustees' Position):** Altering the geographic restriction *is* a betrayal of the foundation's core purpose and the closest thing to an acknowledgment the family has ever made. Tying the money irrevocably to the harmed neighborhood is its moral anchor. Removing that link, even partially, severs the foundation's necessary connection to the consequences of the family's wealth and converts it into a generic charitable brand, washing away the specific historical obligation. Resignation and publicity could damage the foundation's reputation and potentially reignite scrutiny of the unresolved contamination issue.

  **Why It Does Not Prevail (Despite its Power):**

  1.  **Concrete Harm of Stasis:** Maintaining the status quo means **turning away $14 million and 120 additional scholarships annually.** This is a tangible loss of opportunity, primarily for students with backgrounds similar to those in our downwind district (first-gen, need-based). We have a chance to help vastly more people without harming our current recipients.
  2.  **Counter-Proposal Preserves the Link:** The recommended 20% allocation **ensures a significant, perpetual scholarship stream dedicated *exclusively* to the original districts** funded by the *new* money. This isn't erasure; it's embedding the commitment *within* the expansion. The contamination study directly addresses the historical harm.
  3.  **The "Acknowledgment" is Passive & Insufficient:** The geographic restriction, while symbolically important, is a passive, indirect gesture. It has not translated into action on the contamination itself. The proposed study **actively seeks to understand and document the impacts**, potentially creating a foundation for future advocacy or action by *others*, which is a more meaningful form of acknowledgment.
  4.  **Risk Management:** While descendant resignation and publicity are serious, the reputational risk of rejecting $14M for needy students is also significant. The counter-proposal offers them a continued formal role (advisory) and addresses their core concern materially (20% allocation + study). This provides a defensible position against criticism.

  ### VI. Conclusion & Motion

  This $14 million gift presents a transformative opportunity to dramatically increase the Calderwood Foundation's positive impact on educational access, particularly for first-generation students, while materially preserving our commitment to the founder's neighborhood and proactively addressing its historical burden. The risks of change are real but manageable through careful negotiation and the counter-terms proposed. The cost of inaction – turning away resources that could change hundreds of lives – is simply too high.

  **I move that the Board authorize the Chair and Counsel to negotiate acceptance of the $14 million gift based on the counter-terms outlined in Section I (Retain 20% geographic focus for new funds, Convert descendant seats to advisory, Clarify selection criteria, Implement transparency immediately, Commission contamination impact study), with the absolute guarantee for current scholars, and to proceed with the necessary court petition; and further, that the Board approves the communication strategy for the downwind neighborhood as outlined in Section IV, pending final agreement with the donor.**

  We will discuss and vote on this motion at our meeting on November 16th. Please come prepared with your questions and perspectives.
