  ### Facilitator's Sheet

  **Materials Needed:**
  - 11 identical household packets (one per pair)
  - Whiteboard/projector for displaying prices and penalties
  - Timer
  - Tokens (e.g., poker chips) for tracking points (1 token = 10 points)
  - Calculator (for facilitator to compute group penalties)
  - Wage cards (pre-printed with initial wages and group assignments)

  **Household Packet Contents:**
  - Household ID (1-11)
  - Wage card for Earner A and Earner B (see assignments below)
  - Record sheet (track wages, penalties, choices, and points per round)
  - Rules summary (care options, penalty rules, policy change)

  **Wage Assignments (Initial Wages):**
  - **Type 1 (Large Gap):** 4 households  
    Earner A: 100 points, Group X  
    Earner B: 40 points, Group X  
  - **Type 2 (Small Gap):** 4 households  
    Earner A: 80 points, Group Y  
    Earner B: 60 points, Group Y  
  - **Type 3 (Against the Grain):** 3 households  
    Earner A: 40 points, Group X  
    Earner B: 100 points, Group Y  
  *(Group assignments ensure 11 earners in Group X and 11 in Group Y)*

  **Posted Prices & Rules:**  
  - **Childcare price:** 50 points/round  
  - **Transferable entitlement (Rounds 1-2):** 1 entitlement/household/round (covers full wage if used)  
  - **Non-transferable quotas (Rounds 3-4):** 1 entitlement/earner (covers 50% wage if used; must be used by assigned earner)  
  - **Penalties (applied at round start):**  
    - *Individual:* 5% wage reduction for providing care in the *previous* round.  
    - *Group:* 3% wage reduction for *all* group members if >50% of the group provided care in the previous round.  
  - **Care Options:**  
    - One earner provides care (forgoes wage unless entitlement used).  
    - Purchase childcare (pay 50 points).  

  **Payoff Tables & Arithmetic:**  
  *Net income = Wages earned - childcare costs + entitlement coverage (if used). Penalties compound multiplicatively (e.g., 100 * 0.95 = 95 after one penalty).*  

  **Example Outcomes:**  
  1. **Type 1 (Large Gap, B Provides Care Rounds 1-2):**  
     - **Round 1:** Use entitlement, B cares → 100 + 40 = **140**. *B penalized (5%)*.  
     - **Round 2:** Use entitlement, B cares → 100 + 38 = **138**. *B penalized again (5% compounded: 40→38→36.1); no group penalty (assumed)*.  
     - **Round 3:** Use B’s entitlement (covers 50% wage) → 100 + (50% × 36.1) = **118.05**. *B penalized; group penalty triggered (if applicable)*.  
     - **Round 4:** Let A’s entitlement lapse; B cares without entitlement → 100 + 0 = **100**.  
     *Total: 496.05 points*.  

  2. **Type 2 (Small Gap, B Provides Care Rounds 1-2):**  
     - **Round 1:** 80 + 60 = **140**. *B penalized*.  
     - **Round 2:** 80 + 57 = **137**. *B penalized (60→57→54.15)*.  
     - **Round 3:** Use B’s entitlement → 80 + (50%×54.15) = **107.08**.  
     - **Round 4:** Use A’s entitlement (covers 50%) → (50%×80) + 54.15 = **94.15**.  
     *Total: 478.23 points*.  

  3. **Type 3 (Against the Grain, A Provides Care Round 1):**  
     - **Round 1:** Use entitlement, A cares → 40 + 100 = **140**. *A penalized (100→95)*.  
     - **Round 2:** Use entitlement, B cares → 95 + 40 = **135** (avoids further A penalty). *B penalized*.  
     - **Round 3:** Use B’s entitlement → 95 + (50%×38) = **114**.  
     - **Round 4:** Let A’s entitlement lapse; B cares without entitlement → 95 + 0 = **95**.  
     *Total: 484 points* (vs. 496.05 if they followed the grain).  
     **Cost of specializing against the grain:** 12.05 points (~2.4% of total). Significant but survivable.  

  **Equilibrium Note:**  
  - Type 1/2 households maximize points by having the lower earner provide care. Type 3 pays a penalty for deviation.  
  - Lapses occur in Type 1/3 households in Round 4 (A’s entitlement unused).  

  ---

  ### 80-Minute Timeline  
  **0:00–0:05 — Setup**  
  - Assign pairs; distribute packets.  
  - Post: Childcare price (50), penalties (5% individual, 3% group), and care options.  
  - Clarify: Entitlements cover wages *only* if used; penalties apply post-choice.  

  **0:05–0:20 — Rounds 1–2 (Transferable Entitlement)**  
  - **Round 1 (5 min):** Households choose care + whether to use entitlement. Record net income.  
  - **Facilitator (5 min):** Collect data (who provided care, by group). Calculate/announce group penalties for Round 2; update wages.  
  - **Round 2 (5 min):** Repeat choices.  

  **0:20–0:30 — Policy Shift & Round 3**  
  - Announce: Non-transferable quotas now in effect (1 entitlement/earner, covers 50% wage).  
  - **Round 3 (5 min):** Households choose care + whether to use an entitlement.  
  - **Facilitator (5 min):** Update penalties/wages for Round 4.  

  **0:30–0:40 — Round 4**  
  - **Round 4 (5 min):** Final choices.  
  - **Facilitator (5 min):** Calculate total points; award tokens (1 token = 10 points).  

  **0:40–1:20 — Debrief (40 min)**  
  - Use questions below.  

  ---

  ### Debrief Sequence  
  *(Withhold technical terms until concepts emerge)*  
  1. **Observation:** "How many had the *lower*-earning partner provide care in Round 1? What drove that choice?" → *Opportunity cost* (avoiding 50-point childcare fee).  
  2. **Compounding:** "Look at your wage gaps in Round 4 vs. Round 1. What caused the change?" → *Endogenous wage erosion* (penalties from prior choices).  
  3. **Policy Shift:** "In Rounds 3–4, who let an entitlement lapse? Why?" Contrast households:  
     - Type 1: Lapse occurs because using A’s entitlement yields <100 points (vs. 100 from B’s unpaid care).  
     - Type 2: No lapse; using A’s entitlement yields >80 points.  
     → "Was a lapse a free choice or a policy failure? What distinguishes them?" → *Formal vs. substantive neutrality*.  
  4. **Statistical Discrimination:** "Group penalties hit *all* members—even those who didn’t provide care. How did that affect your choices? Did anyone feel pressured to conform?" → *Group penalty = statistical discrimination* (beliefs about groups, not individuals).  
  5. **Collective Action:** "Could you have avoided group penalties by coordinating? Why was that hard?" → *Inter-household externalities* (each choice alters wages for others).  
  6. **Agency & Responsibility:** "Did anyone here act with *intent* to discriminate? If not, why did we get skewed outcomes?" → "No one" → *Structural responsibility* (outcomes ≠ individual malice).  
  7. **Defending Neutrality:** "Some households (Type 2) benefited from specialization. How would you argue their choices *should* be respected?" → Concede efficiency, then challenge: "But did their choices constrain others’ options later?"  
  8. **Synthesis:** "What does this reveal about ‘free choices’ in a system where wages adapt to past decisions?" → *Endogenous preference formation* (choices alter future constraints).  

  ---

  ### Failure Modes & Solutions  
  1. **Pair splits care and is punished:**  
     - *Prevent:* Pre-assign pairs to avoid real-life couples.  
     - *Handle:* Normalize as data: "This shows the cost of resisting norms. In debrief, ask if ‘fairness’ should require paying such costs."  

  2. **Group pre-commits to resist compounding:**  
     - *Prevent:* Penalize communication between households.  
     - *Handle:* Use it: "This mirrors real-world collective action (e.g., men’s leave-taking). Why did it work/fail here?"  

  3. **Arithmetic bogs down:**  
     - *Prevent:* Simplify numbers (e.g., round wages to integers); provide calculators.  
     - *Handle:* Skip detailed wage updates for 1–2 households; use averages.  

  4. **Seen as policy advocacy:**  
     - *Prevent:* Neutral framing ("We’re modeling mechanisms, not prescribing solutions").  
     - *Handle:* Debrief Question 7 (defend neutrality) + name limitations (below).  

  5. **Moral spectacle:**  
     - *Prevent:* Anonymize group data (e.g., "Group X had 60% care-providers").  
     - *Handle:* Focus on structures: "The *system* penalizes deviation, not the facilitator."  

  ---

  ### What the Game Cannot Reproduce  
  1. **Affective value of caregiving:**  
     - *Build in?* No—risks distorting incentives. *Supply in debrief:* "This model ignores the intrinsic reward of care, which is a real good. How might including it change outcomes?"  

  2. **Pre-existing wage discrimination:**  
     - *Build in?* Partially—assign lower wages to groups historically discriminated against. *Debrief caveat:* "Real wage gaps reflect historical bias; our starting point understates this."  

  3. **Social stigma:**  
     - *Build in?* Partially—award bonus tokens to high earners who take leave (simulates status). *Debrief:* "In reality, stigma *discourages* high-earner leave-taking; here we lack that."  

  4. **Career-length horizon:**  
     - *Build in?* No—game is short. *Debrief:* "Specialization is myopically rational here; a 40-year career might reverse this calculus."  

  **Design Note:** 11 households (22 students) is optimal. A 3-person unit would require redesign (e.g., a "non-earning" role), complicating the core mechanic.  

  --- 

  **Token Conversion:**  
  - Tokens = Total points ÷ 10 (rounded).  
  - Top 3 households: +1% on next essay.  
  - Next 5: +0.5%.  
  - Remainder: +0.25%.  
  *Prevent detached maximization:* Emphasize stakes are minor and the goal is insight, not "winning." Stop groups from over-optimizing by strictly timing rounds.
