  #### 2. Debrief Questions
  - After the game, ask:
    1. "Let's look at the choices you made. In the first two rounds, how many of you had the lower earner provide care when using the transferable leave? Why?"
    2. "How did your choices in round 1 affect your options in round 2? And then in round 3?"
    3. "Did anyone notice a change in the wage gap within their household over time? What caused that change?"
    4. "In the non-transferable leave phase, did any household let an entitlement lapse? Why? What would it have taken for you to use that entitlement?"
    5. "When we introduced the group penalty, how did that affect your choices? Did you think about how your choice might affect others in your group?"
    6. "In the debrief, we see that no one in the room acted with the intention to discriminate, and yet we see systematic disadvantage to certain earners. If no one acted wrongly, then where does responsibility for the outcome lie?"
    7. "Some households may have come out ahead by specializing. How would you respond to the argument that this outcome is simply the sum of free choices?"
    8. "How might this game illustrate the difference between a formally neutral rule (like transferable leave) and one that is substantively neutral?"
    9. "What collective action problem do you see across households? Could households have coordinated to avoid the group penalty? Why might that be difficult in reality?"

  #### 3. Failure Modes
  - **A pair splits care on principle and is punished**: This might happen and could be uncomfortable. Handle by normalizing it as a data point and focusing on the structural factors. In the debrief, ask what would happen if more households did that, and whether the system penalizes deviation.
  - **Romantically involved pair**: Avoid pairing them. Assign pairings randomly or by household ID, not by choice.
  - **Group spots the compounding mechanism and pre-commits**: If they pre-commit to not specialize, it might reduce the effect. In the debrief, use this to discuss the difficulty of coordination in large groups and the role of expectations.
  - **Arithmetic slow**: Provide a calculator in each packet or have a spreadsheet ready. Keep the numbers simple (use integers where possible).
  - **Read as advocacy**: Emphasize in the debrief that the game is a model and has limitations, and the goal is to understand mechanisms, not to push a policy.

  #### 4. What the Game Cannot Reproduce
  - Affective value of caring: Not modeled. We can't build it in easily, so mention in debrief.
  - Sediment from earlier discrimination: The initial wage gap is given, but in reality, it may come from past discrimination. Mention in debrief.
  - Social stigma: Not modeled. Mention in debrief.
  - Short horizon: The game has only 4 rounds, while in reality, careers are long. Mention that in the game, myopic specialization is rational, but in a longer horizon, it might not be.

  We can partially build affective value by including a small enjoyment bonus for providing care? But that might complicate. We recommend not doing so and discussing in debrief.

  ### Final Adjustments
  - We have 11 households. If a household has a three-person unit, we can have one group of three (two earners and one non-earner who can only provide care? But that changes the dynamic). We recommend keeping pairs.

