  **FOOTNOTES & METHODOLOGICAL CONSIDERATIONS**  
  ^1 **Heritability Meter Explained:** The DNA Spirals represent estimated broad-sense heritability (H²) ranges for each trait, derived from meta-analyses of published twin/adoption studies. H² estimates the proportion of *variation in a trait within a specific studied population* that is associated with genetic variation *within that same population and environment*. It is not the proportion of an individual's trait "caused" by genes.  
  ^2 **Confidence Intervals:** The star rating range reflects the 95% confidence interval for your point estimate, accounting for technical genotyping variance, imputation accuracy, and the standard error of the underlying predictive model. Wider intervals indicate greater current uncertainty.  
  ^3 **Twin Study Foundations:** Heritability estimates rely heavily on the Classical Twin Design, which assumes: 1) The Equal Environments Assumption (EEA) – that monozygotic and dizygotic twins experience equally similar environments relevant to the trait; 2) Minimal Assortative Mating for the trait among parents; 3) Representativeness of the twin population to the general population. Violations of these assumptions can bias estimates.  
  ^4 **Genetic vs. DNA-Based Heritability:** The Heritability Meter (based on twin studies, H²) often differs from SNP-based heritability (h²SNP) calculated directly from your DNA markers using GCTA-like methods. h²SNP is typically lower than H², capturing only the additive effects of common variants captured on the array. This "missing heritability" gap remains an active research area.  
  ^5 **Reference Population Dependency:** Trait propensity scores and population comparisons are relative to the chosen reference dataset. Different ancestral or cultural reference groups yield different comparisons. Genetic propensities are not absolute measures.  
  ^6 **Environmental Influence:** All heritability estimates are context-dependent. A landmark study on educational attainment heritability (Domingue et al., 2015) demonstrated that heritability estimates *increased* as policies made environments (like school quality) more uniform, highlighting how heritability reflects the *current balance* of genetic and environmental variance sources.  
  ^7 **Within-Group vs. Between-Group Differences:** A high heritability estimate *within* a group (e.g., Group A) says nothing about the causes of average differences *between* groups (e.g., Group A vs. Group B). Average differences could arise from environmental factors, genetic factors, or complex interactions, even if within each group the trait is highly heritable. Helixly reports focus solely on within-population variation in the studied cohorts.  
  ^8 **Premium Tier PHQ™:** The Personal Heritability Quotient utilizes a Bayesian approach to approximate the proportion of *your* trait variance attributable to the measured genetic factors *within the context of the model and reference data*. This is distinct from population-level heritability and should be interpreted as a highly personalized statistical inference subject to the limitations of the model and input data. It is not a direct measurement of genetic causation in you as an individual.  

