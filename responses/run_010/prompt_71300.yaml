prompt: |-
  The standard defence of futarchy leans on an analogy with ordinary prediction markets: because a contract pays out only if the predicted event obtains, speculators who are wrong lose money, and prices are thereby disciplined toward the truth. Make the case that this discipline fails specifically for decision markets, in a way that leaves predictions about exogenous events untouched. The core of your argument should be that when the price itself determines whether a policy is adopted, the quantity being estimated is no longer an independent target, so a mistaken estimate can become correct simply by being acted on — producing an equilibrium in which the market is never corrected. Explain why such self-confirmation is a defect rather than a triumph, given that the futarchist's own criterion is realized utility, and answer the obvious objection that a genuinely bad fixed point would eventually show up as low utility and be revised away.
reasoning: |-
  Okay, the user is asking about futarchy and its potential flaw in decision markets. Let me start by recalling what futarchy is. It's a governance system where decisions are based on prediction markets. People bet on what policies would lead to the best outcomes, and the winning policy gets implemented. The standard defense is that prediction markets are accurate because traders lose money if they're wrong, so prices reflect true probabilities.

  But the user wants me to explain why this discipline fails specifically in decision markets. The key point is that in regular prediction markets, the event being predicted is exogenous—it happens regardless of the market's prediction. But in decision markets, the market's prediction can influence whether the policy is adopted. So if the market predicts a policy will succeed, it gets implemented, which might make the prediction come true even if it was initially wrong. That's self-confirmation.

  Wait, why is self-confirmation a problem? The futarchist cares about realized utility. If the policy works, isn't that good? But the issue is that the market might settle on a suboptimal policy because the prediction made it happen. There could be a better policy that no one bets on because the current one is self-sustaining. Traders don't have an incentive to explore alternatives if they profit from the status quo.

  The user also mentions an objection: wouldn't a bad policy show low utility and get revised? But if the market is stuck in a self-confirming equilibrium, traders betting against it would lose money if the policy stays. The market doesn't naturally correct because acting on the prediction changes the outcome. So even if there's a better option, the market might not shift because betting against the current policy is unprofitable.

  I need to structure this argument. Start with the standard defense, then explain the difference with decision markets. Highlight the feedback loop where the price affects the outcome. Discuss why self-confirmation is bad despite realizing utility—it locks in suboptimal policies. Then counter the objection by explaining why the market won't correct itself due to the equilibrium trapping traders in the current belief.
answer: |-
  ## The Self-Confirmation Trap in Futarchy's Decision Markets

  The standard defense of futarchy – that prediction markets efficiently aggregate information because wrong speculators lose money – holds well for **exogenous events** (events unaffected by the market's prediction itself, like "Will it rain tomorrow?" or "Will GDP grow by 3% next quarter?"). However, this discipline fundamentally breaks down in **decision markets**, where the market's price *directly determines* whether a policy is adopted. This creates a unique vulnerability: **self-confirming equilibria**, where a mistaken market estimate *becomes correct* solely *because* it is acted upon.

  **The Core Failure: From Independent Target to Self-Determining Outcome**

  1.  **Exogenous Events (Intact Discipline):** The event being predicted (rain, GDP growth) exists independently of the market's prediction. If the market price overestimates the probability of rain, speculators betting "no rain" can profit *if they are right*, forcing the price down towards the true probability. The target is fixed; market errors create profit opportunities for correction.
  2.  **Decision Markets (Broken Discipline):** Here, the market predicts the *expected utility* if a specific policy `P` is adopted (e.g., "Expected utility if we build the bridge is 100"). Crucially:
      *   **The Price Determines Adoption:** The *only* reason policy `P` gets adopted is *because* the market predicts its utility is higher than alternatives. There is no external force mandating `P`; adoption hinges entirely on the market's current belief.
      *   **The Target is Not Independent:** The "true" expected utility of `P` *if implemented* depends on the complex reality arising *after* adoption. However, adoption *only happens* based on the market's *prediction* of that utility. The quantity being estimated (utility under `P`) is not a fixed, pre-existing target; its realization is *caused* by the act of adoption, which is *caused* by the prediction.
      *   **The Self-Confirmation Mechanism:** Suppose the market *initially overestimates* the utility of `P` (e.g., predicts 100, true potential is only 80). Because of this high prediction, `P` is adopted. Traders who bet on lower utility *lose money* because `P` *was* adopted, and the utility realized *might be* higher than it would have been otherwise (simply because *something* was done), or even artificially inflated near-term (e.g., initial construction boom). Crucially, **the act of adopting `P` based on the high prediction *makes* the realized utility closer to 100 than it would have been if `P` wasn't adopted at all, or was adopted later.** The market sees *a* utility (say, 90), validates its initial high prediction (100 wasn't far off!), and traders betting against the high prediction lose. The market settles into an **equilibrium where the prediction `U_p` leads to adoption, and adoption generates an outcome sufficiently close to `U_p` to avoid punishing the dominant traders.** The initial error is *baked in* and never corrected because the prediction *creates the reality it predicted*.

  **Why Self-Confirmation is a Defect, Not a Triumph (Despite Realized Utility)**

  The futarchist rightly values *realized utility*. The objection is: *"If the market settles on a policy `P` predicting utility `U_p`, and adopting `P` indeed yields utility close to `U_p`, isn't that a success? What's the problem?"*

  The critical defect is **path dependence and hidden opportunity cost:**

  1.  **Lock-in of Suboptimal Policies:** The self-confirming equilibrium is **stable but potentially suboptimal.** The market locks onto *a* policy `P` that generates utility `U_p` *because* it predicted `U_p`. However, there might exist an alternative policy `Q` that *could* generate utility `U_q > U_p`.
  2.  **The Market Cannot See `Q`:** Why doesn't the market explore `Q`? Because the current equilibrium actively *suppresses* information about `Q`:
      *   **No Adoption Signal:** `Q` is never adopted (because the market price for `P` is always higher), so its *true* potential utility remains unknown and speculative.
      *   **Punishing Dissent:** Traders betting on `Q` face a double bind:
          *   If they bet `Q` has high utility, but `P` is adopted instead (which it always is in equilibrium), their bet *loses* regardless of `Q`'s true potential.
          *   Betting that `Q` is *better than `P`* is incredibly risky and expensive. It requires convincing the market to shift its entire belief away from the self-confirming `P`. Traders betting against the `P`-equilibrium lose money *in the short/medium term* because `P` *is* adopted and generates *some* positive utility (`U_p`). Funding this dissent requires immense capital and conviction against the prevailing, self-reinforcing belief. The profit mechanism that corrects exogenous markets **actively punishes attempts to dislodge the `P`-equilibrium**.
  3.  **Realized Utility is Local, Not Global:** The market achieves *a* utility `U_p` with `P`, satisfying the "realized utility" criterion *for that specific path*. But it fails the *comparative* criterion: it does not demonstrate that `U_p` is the *best possible* utility achievable. The self-confirming nature of the market prevents the discovery and adoption of potentially superior alternatives (`Q`). The realized utility is **locally validated but globally suboptimal.**

  **Answering the Obvious Objection: "Low Utility Will Correct It"**

  The objection states: *"If `P` is genuinely bad, even if adopted, its low realized utility will eventually be observed. Traders will then lower their prediction for `P`'s future utility next time, or bet more on alternatives, breaking the equilibrium."*

  This overlooks the **dynamics of the self-confirming trap:**

  1.  **"Bad" is Relative and Masked:** The utility `U_p` realized under `P` might be "low" *compared to the true optimum `U_q`*, but it might be *adequate* or even *good* compared to a baseline of doing nothing *or compared to the market's slightly inflated prediction*. Crucially, **the market has no direct measure of `U_q`** to compare against. It only sees `U_p`.
  2.  **Attribution is Ambiguous:** When utility is lower than hoped (say `U_p` = 70 vs predicted 100), traders can rationalize it: "Well, it was still positive," "External shocks caused the shortfall," "It would have been worse without `P`," "We just need to tweak `P`." The market isn't forced to conclude "`P` is fundamentally bad"; it can adjust its *prediction for `P`* downward slightly (e.g., to 80 for the next vote) without ever questioning whether a *different* policy `Q` exists.
  3.  **The Cost of Switching:** To break the equilibrium, traders must not only predict that `P` is bad *next time*, but simultaneously predict that some alternative `Q` is *significantly better*, *and* amass enough capital to shift the market price for `Q` above the price for `P` *before `P` is adopted again*. This requires overcoming the entrenched belief in `P`, the lack of real-world data on `Q`, and the immediate losses incurred by betting against the currently-adopted-`P`. The feedback loop strongly favors inertia.
  4.  **Multiple Equilibria:** There might be *several* possible self-confirming equilibria (`P1` yielding `U1`, `P2` yielding `U2`), all potentially suboptimal compared to a true optimum `Q`. The market can get stuck in *any* of these, unable to discover or transition to a better one, even if the current one is mediocre. The realized utility `U_current` provides no signal about the existence or superiority of `U_better`.

  **In essence:** The profit-and-loss discipline works for exogenous events because the target is fixed and independent. In decision markets, the market price *creates the target* by causing adoption. A mistaken high prediction gets validated by the mere act of adoption, locking the market into a stable but potentially suboptimal policy. While realized utility occurs, it's the utility of the path-dependent, self-confirmed choice, not the globally optimal one. The mechanism that corrects errors in prediction markets actively prevents the exploration and adoption of potentially superior alternatives in decision markets, making futarchy susceptible to persistent, uncorrected inefficiency. The triumph of realized utility in a self-confirming equilibrium is a pyrrhic victory, masking the better paths left unexplored.
