prompt: |-
  Been going down a rabbit hole on bounded rationality for fun (I work in procurement, so it's sort of job-adjacent) and there's a specific thing I keep running into that I can't find a label for. Not satisficing itself — I've got that one. It's the step above it.

  Two cases. (1) I'm hiring. I know I could run a proper structured process: scorecard, work sample, three rounds. I also know building that takes maybe fifteen hours, and I have a rough feel for whether fifteen hours actually buys me a better hire than two informal chats and my gut. So I spend twenty minutes deciding how to decide, settle somewhere in the middle, and get on with it. (2) A friend is house-hunting. Before she looks at a single listing she sets herself a rule: view at most six, stop at the first one that beats the best of the previous ones by some margin. Then she spends an evening wondering whether six is the right number, whether it should be fifteen, and eventually says 'whatever, I'll know when I'm sick of it'.

  So the pattern: choosing your decision procedure is itself a decision, and that decision could be made by a better or worse procedure, and obviously there's a regress. What actually happens is that people terminate it at a point that looks arbitrary — it drifts with fatigue, deadline pressure, mood — and then treat everything below that line as settled, without ever noticing they cut it off. What I want a name for is that termination, and the fact that it goes unexamined. Not the heuristic, not the threshhold, but the point where you stop asking whether your method for choosing is good enough.

  Nearest things I've hit on, and why none fit exactly: aspiration levels (those govern when to stop looking at options, not when to stop improving your rule for looking); expected value of information / value of computation (right shape, but they treat the top level as something you can actually compute, whereas the whole issue is that the computation up there is itself too expensive to do properly, so it gets skipped rather than solved); optimal stopping (options again). And there's the old objection that satisficing is just optimising in disguise, since you have to optimise to pick your threshold — is what I'm describing simply that objection seen from the inside, or a distinct thing?

  So: is there an established concept for this, and if there are several competing ones, which fits best and what does each get wrong about it? If nothing fits, coin something — definition, and where the edges are. What counts as a case and what doesn't: does it cover just picking a threshold on the hoof? choosing a career? an AI system deciding how much compute to spend on planning? I'm after the carving, not a bare label, and definately not a reading list.

  British English please, and jargon is fine as long as you define it the first time round.
reasoning: |-
  Okay, the user is diving into bounded rationality and has encountered a specific pattern they want to label. They work in procurement, so this is adjacent to their job. The core issue is about terminating the decision on how to decide, without examining that termination point. 

  First, I need to unpack their examples clearly. In the hiring scenario, the person spends minimal time choosing a decision procedure between a structured process and gut feeling. The house-hunting friend sets a rule for viewing houses but arbitrarily decides on the number without deep analysis. The key is the cutoff point where meta-decision-making stops, influenced by fatigue or mood, and remains unexamined.

  The user mentions existing concepts they've considered: aspiration levels (which apply to stopping the search, not the method), expected value of information (too computationally heavy), and optimal stopping (about options, not rule selection). They also reference the critique that satisficing is optimizing in disguise. The question is whether their observation is that critique internalized or a distinct phenomenon.

  Now, I recall Simon's bounded rationality and the idea of meta-decision-making. The concept of "second-order satisficing" or "meta-satisficing" comes to mind. The user needs a term that captures terminating the meta-decision without optimization. "Heuristic adoption threshold" might fit, emphasizing the implicit cutoff. 

  I should also consider "cognitive closure" and "procedural satisficing." Cognitive closure is about desire for an answer, which might not fully apply. Procedural satisficing is closer but needs to highlight the unexamined termination. "Heuristic adoption threshold" seems most precise because it directly addresses the point where heuristic selection stops without further analysis.

  Defining the boundaries: It applies when there's a recursive decision problem where higher-level optimization is truncated. Examples include choosing a hiring process or house-viewing rule. It wouldn't cover single-level decisions or when meta-decisions are fully optimized. Career choices might involve multiple meta-levels, but if truncated similarly, it fits. For AI, if compute allocation is cut off heuristically, it's analogous.

  The user wants British English and clear definitions. They need the concept carved out, not just a label. Ensuring the explanation distinguishes it from related ideas and provides concrete examples. Terms like "heuristic adoption threshold" should be defined upfront. Confirming that this addresses their core observation about unexamined termination of meta-decision-making.
answer: |-
  Based on your description—specifically the termination of meta-decision-making due to cognitive costs without explicit justification—the most fitting established concept is **Second-Order Satisficing** (or **Meta-Satisficing**). Here's the carving:

  1.  **Core Definition:** Second-order satisficing occurs when an agent, recognising the computational cost of *choosing an optimal decision procedure* (first-order heuristic), instead applies a satisficing rule *to the choice of the decision procedure itself*. The termination point (when to stop refining the procedure) is determined by a simpler, often implicit, "good enough" criterion for the meta-decision, rather than being explicitly optimised.

  2.  **Why it Fits Your Cases:**
      *   **Hiring:** You spent ~20 minutes deciding *how* to hire. You didn't try to calculate the precise expected value of building the perfect scorecard vs. gut feeling. You applied a quick, approximate cost/benefit ("15 hours? feels like diminishing returns, this rough plan will do") and stopped. The *choice of procedure* was satisficed.
      *   **House-Hunting:** Your friend established a stopping rule (a first-order heuristic) *after* a brief, fatigued meta-deliberation ("six? fifteen? whatever, I'll know when I'm sick"). The *choice to use a simple rule and end the meta-thought* was itself a satisficing act on the meta-level. "Knowing when I'm sick" is the aspiration level *for terminating meta-deliberation*.

  3.  **Distinguishing from Related Concepts:**
      *   **Satisficing (First-Order):** This applies to the *primary decision* (which job candidate? which house?). Second-order satisficing applies to *how you make* that primary decision.
      *   **Aspiration Levels:** These govern stopping the *search for options* within a given procedure. Second-order satisficing governs stopping the *search for the best procedure*.
      *   **Expected Value of Information/Computation (EVI/EVC):** These *are* the theoretically optimal ways to make the meta-decision. Second-order satisficing is the *practical, bounded-rationality response* when calculating EVI/EVC for the meta-decision is deemed too costly. You *avoid* the calculation rather than perform it sub-optimally.
      *   **Optimal Stopping:** Applies to the sequence of *options* (e.g., house viewings), not the choice of the *rule* governing that sequence.
      *   **"Satisficing is Optimising in Disguise":** This objection argues that choosing a satisficing threshold *requires* optimisation. Second-order satisficing *embraces* this objection as a practical reality: yes, the meta-decision *could* be optimised (via EVC), but we *don't* optimise it; we satisfice it instead, precisely because the optimisation is too hard/expensive. It *is* that objection seen from the inside as a cognitive strategy.

  4.  **The Key Element You Highlighted:** The **unexamined termination**. In second-order satisficing, the aspiration level for the meta-decision ("good enough procedure") is typically:
      *   **Implicit:** Not formally defined, often just a feeling ("this feels sufficient for now," "I'm tired of thinking about how to think").
      *   **Driven by Heuristics/Costs:** Influenced by time pressure, cognitive load, mood, fatigue, precedent, or simple rules-of-thumb ("spend 10% of the decision's importance on planning").
      *   **Taken as Settled:** Once the "good enough" meta-threshold is crossed (often quickly), the chosen first-order procedure is adopted without further recursive doubt about the meta-choice *at that moment*.

  5.  **Edge Cases & Boundaries:**
      *   **In Scope:**
          *   Picking a hiring process threshold on the hoof.
          *   Choosing a house-viewing rule based on fatigue.
          *   Deciding how much research to do before a procurement bid (e.g., "I'll read 3 reports, not 10").
          *   An AI system using a fixed, pre-set rule for allocating compute to planning sub-tasks *without* dynamically calculating the optimal allocation each time (if that calculation is too expensive).
      *   **Out of Scope:**
          *   **Fully Optimised Meta-Decision:** If you *did* meticulously calculate the EVC for different hiring processes and chose the optimal one, that's optimisation, not second-order satisficing.
          *   **Single-Level Satisficing:** Choosing a house using a rule isn't second-order; choosing *which rule to use* is.
          *   **Pure Habit/Procedure:** If you *always* use the same rule without any meta-deliberation (e.g., always 3 rounds of interviews), it's a fixed procedure, not an act of (second-order) satisficing. Satisficing implies a *deliberate, if truncated, choice* was made at the meta-level at some point.
          *   **Indeterminate Meta-Levels:** Choosing a career *might* involve it if you consciously truncate deliberation about *how* to choose (e.g., "I'll talk to 5 people in different fields then pick"). If the choice is purely visceral or driven by deep, unchallenged values without meta-deliberation, it's not a clear case. The key is the *recursive potential* being actively cut off.

  6.  **Alternative Labels & Why Second-Order Satisficing Fits Best:**
      *   **Procedural Satisficing:** Emphasises satisficing on the *procedure*. Very close synonym, but slightly less common than second-order satisficing.
      *   **Meta-Heuristic Selection:** Accurate but dry. Doesn't explicitly capture the *satisficing* aspect of the termination.
      *   **Heuristic Adoption Threshold:** Describes the point of termination well, but is less established and doesn't inherently link to the satisficing logic driving it.
      *   **Cognitive Closure (applied to meta-cognition):** Kruglanski's concept describes the desire for a firm answer. While the *termination* provides closure, it doesn't fully capture the *satisficing logic* ("good enough for now") specific to the meta-decision. Closure can be sought via other means (e.g., jumping to conclusions).
      *   **Bounded Meta-Rationality:** Descriptive, but not a specific term. Second-order satisficing is a concrete *instance* of this.

  **Conclusion:** Your observation perfectly captures **Second-Order Satisficing (Meta-Satisficing)**. It's the deliberate, yet bounded and often implicitly terminated, application of a "good enough" criterion to the choice of *how* to make a decision. The unexamined termination is inherent to it – the aspiration level for the meta-decision is set low precisely to avoid the regress of calculating the optimal way to set the aspiration level. It's bounded rationality consistently applied across levels, terminating where the cognitive cost of climbing higher exceeds the (implicitly satisficed) perceived benefit. It *is* the practical resolution to the "satisficing requires optimisation" objection.
