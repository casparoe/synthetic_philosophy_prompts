prompt: |-
  Bit of an odd ask. I'm a software engineer on a platform team, and one of the things that lands on me is signing off on the "success metric" another team wants wired into either a dashboard or — increasingly — a training loop or an auto-tuning system. We get four or five of these a week and their usually one-line tickets, and there's three of us reviewing them, none of us with any stats or philosophy background.

  Our current review is exactly one question: is this metric a proxy for the thing you actually care about? The answer is always yes, we ship it anyway, so the review is a rubber stamp. Everyone vaguely knows Goodhart's law in the "when a measure becomes a target" sense but nobody here knows how to turn that into a decision.

  Could you write me a procedure I can actually run in half an hour? I want the questions in order, what counts as a good enough answer to each, what to do when there's historical data to test against and what to do when there isn't, and the specific points where it comes out as no or not-yet rather than fine. It needs to separate out the different ways this goes wrong — a metric that's just noisy, one that stops tracking the goal once you push it hard, one that's the wrong causal lever entirely, one that an outside party is actively gaming — because those need different fixes and my one-question review flattens them all into the same shrug. Also tell me straight which steps are real procedure and which are just my judgement holding a clipboard.

  Then run it on three live proposals: ranking internal doc search by click-through; a code-review bot whose training signal is whether developers accept its suggested edit; and a fraud model scored on the confirmed fraud it catches, where the fraud rings can see which of their transactions got declined and adapt. One of those I'm fairly sure is fine, and if the procedure says otherwise I want it to show its work instead of just waving at me.

  British English please.
reasoning: |-
  Alright, the user is a software engineer on a platform team who's stuck rubber-stamping metric proposals. They need a practical, half-hour review procedure that actually catches different failure modes of metrics (noise, Goodhart collapse, wrong lever, gaming). 

  First, let's unpack their pain points: 
  - They're drowning in 4-5 tickets/week with zero stats background. 
  - Their current one-question review ("is this a proxy?") is useless because everyone just says yes. 
  - They intuitively know Goodhart's law but can't operationalize it. 
  - Crucially, they want to distinguish between different failure modes because each requires different fixes (e.g., noisy metric needs smoothing, gamable one needs countermeasures).

  The hidden request here is for intellectual scaffolding – they need a framework to replace gut feelings with structured reasoning. Their examples reveal classic traps: 
  1. Doc search CTR (naive proxy, ignores engagement depth) 
  2. Code bot acceptance (directly gamable by lazy devs) 
  3. Fraud recall (arms race with adaptive adversaries). 

  For the procedure, I'll need: 
  - A decision tree that forces concrete answers about correlation, causality, and incentives. 
  - Clear "no-go" triggers (e.g., when a metric creates perverse incentives). 
  - Tactical steps for data-rich vs. data-poor scenarios. 
  - Deliberate separation of objective checks (e.g., "can outsiders game it?") vs. judgment calls (e.g., "is this correlation strong enough?"). 

  British English is straightforward – swap "metrics" for "KPIs", "lever" for "mechanism", etc. The three examples will test the procedure's teeth: if it passes the fraud metric (their "fairly sure is fine" one) without flagging adaptation risks, it fails. 

  Biggest challenge: making statistical concepts actionable for engineers. No p-values, just "eyeball this scatterplot" or "simulate bad actors". Timeboxing each step is critical – hence the 5-minute limits per proposal after setup.
answer: |-
  Right then, let's get you sorted. This rubber-stamping isn't doing anyone any favours, and you're spot on – Goodhart's isn't just a meme, it's a blueprint for failure if ignored. Here's a **practical, half-hour review procedure** designed for engineers, not statisticians. It forces concrete thinking and flags different failure modes.

  **The Metric Sanity Check Procedure (30 mins per metric proposal)**

  **Goal:** Identify *how* this metric could mislead or be gamed, *before* it becomes a target. Decide: **Green** (Ship), **Amber** (Revise/Add Safeguards), **Red** (Reject/Redesign).

  **Materials Needed:** Proposal ticket, reviewer (you), basic understanding of the system. *If historical data exists, have a quick look (scatter plot is gold).*

  **Time Allocation:**  
  - Steps 1-4: 10 mins  
  - Steps 5-8: 15 mins  
  - Step 9: 5 mins  

  ---

  **The Procedure:**

  1.  **Clarify the True North Star (2 mins):**
      *   **Question:** "What is the *ultimate* business or user outcome you genuinely care about improving? (e.g., 'developer productivity', 'revenue', 'user satisfaction', 'system stability')"
      *   **Good Enough:** A clear, high-level goal statement. Not another metric. If they give another metric, ask "Why is *that* important?" until you hit bedrock.
      *   **Red Flag:** Vague answer, or conflating the metric itself with the goal ("We care about maximising the metric").
      *   **Judgement?** Minimal. Just clarification.

  2.  **Map the Proxy Pathway (3 mins):**
      *   **Question:** "Walk me through *why* you believe this specific metric is a good indicator of progress towards that True North Star. What's the assumed causal link or strong correlation?"
      *   **Good Enough:** A plausible, step-by-step story connecting metric movement to outcome movement. E.g., "Higher CTR on doc search *suggests* users found what they needed faster, *leading to* less time wasted searching, *improving* productivity."
      *   **Red Flag:** Hand-waving ("It just is"), circular reasoning ("It measures success"), or an obviously weak/tenuous link.
      *   **Judgement?** Assessing plausibility of the story. Does it pass the "sniff test"?

  3.  **Interrogate Noise & Friction (5 mins - *Crucial for "just noisy" failure*):**
      *   **Question:** "What unrelated factors ('noise') could cause this metric to move significantly *without* a real change in the True North Star? What friction or cost is involved in *collecting* this metric accurately?"
      *   **Good Enough:** Identification of 2-3 key noise sources (e.g., for doc CTR: time of day, specific events, UI changes unrelated to doc quality). Acknowledgement of collection costs (e.g., latency impact, storage, potential sampling errors).
      *   **Red Flag:** Unable to name *any* noise sources, or dismissing significant collection costs/limitations.
      *   **Judgement?** Identifying *potential* noise sources is objective. Assessing their *significance* is judgement (use historical data if available!).
      *   **Data Check (If Available):** Look at a scatter plot (Metric vs Time or vs a proxy for True North). Is it messy? Are there obvious spikes/dips unrelated to the goal? Calculate correlation coefficient if trivial - low value (<0.3?) flags noise. *No Data?* Rely on reasoning in Step 2 & known system behaviour.

  4.  **Stress Test for Goodhart Collapse (5 mins - *Crucial for "stops tracking" failure*):**
      *   **Question:** "Imagine we aggressively optimise *only* for this metric. What are 2-3 likely ways the system or its users could 'game' it or achieve a higher number *without* actually improving (or even harming) the True North Star? Think perverse incentives."
      *   **Good Enough:** Concrete, plausible gaming scenarios directly tied to optimising the metric. E.g., Optimising doc CTR: "We could show only wildly popular docs, hiding niche ones users actually need." or "We could make titles clickbait that don't match the content."
      *   **Red Flag:** "I can't think of any way to game it" or scenarios that are unrealistic.
      *   **Judgement?** Generating *plausible* gaming scenarios is key judgement here.

  5.  **Check the Causal Lever (5 mins - *Crucial for "wrong lever" failure*):**
      *   **Question:** "Is improving *this specific metric* something we (or the AI) can *directly control* through actions/levers in the system? Does changing it demonstrably *cause* the True North Star to improve? (Or is it just correlated?)"
      *   **Good Enough:** Clear levers identified (e.g., for doc search: ranking algorithm, doc tagging). Acknowledgment if causality is assumed vs. proven.
      *   **Red Flag:** Metric is purely an outcome we can't influence (e.g., "Revenue" without specifying *how* the system impacts it), or no clear causal link exists (only weak correlation suspected).
      *   **Judgement?** Assessing controllability is fairly objective. Assessing causality strength is judgement (historical experiments help!).

  6.  **Assess Vulnerability to Active Adversaries (5 mins - *Crucial for "gaming" failure*):**
      *   **Question:** "Could an external party (user, fraudster, competitor) or internal user *intentionally* manipulate this metric for their benefit? Can they observe the metric or its direct inputs/outputs? How easily?"
      *   **Good Enough:** Identification of potential adversaries and their incentives/methods. Understanding of metric observability.
      *   **Red Flag:** High-value metric easily observable by motivated adversaries (e.g., fraud detection outcomes).
      *   **Judgement?** Identifying *potential* adversaries and feasibility is objective/judgement mix. High observability + high incentive = High Risk.

  7.  **Explore Counter-Metric Needs (2 mins):**
      *   **Question:** "Based on the risks above (noise, gaming, collapse), what *other* metrics should we track alongside this one as 'canaries' or guardrails?"
      *   **Good Enough:** 1-2 suggestions for complementary metrics that could detect degradation in True North or specific gaming. E.g., For CTR: "Time on page after click", "Search exit rate". For fraud: "False decline rate".
      *   **Red Flag:** No acknowledgement of need for guardrails despite identified risks.

  8.  **Review Practicality & Cost (3 mins):**
      *   **Question:** "Is the cost/complexity of collecting this metric accurately and reliably justified by its potential value, given the risks we've identified? Does it depend on unproven data sources or complex calculations?"
      *   **Good Enough:** Reasonable cost/benefit assessment. Avoids metrics requiring heroic data engineering for minimal gain.
      *   **Red Flag:** High implementation cost for a highly risky or noisy metric.

  **9.  Decision & Action (5 mins):**
      *   **Green:** All steps passed plausibly. Risks are low or manageable with suggested guardrails. *Action:* Approve.
      *   **Amber:** Significant risk identified in one area (e.g., plausible gaming scenario, high noise, weak causality), but potentially mitigable. *Action:* Require specific revisions before approval (e.g., "Add counter-metric X", "Implement this specific anti-gaming measure", "Run a small experiment to validate causality first"). *Do not proceed without mitigation.*
      *   **Red:** Fundamental flaw uncovered (e.g., metric is clearly the wrong lever, easily and catastrophically gameable, causality proven absent). *Action:* Reject. Send back for redesign focusing on True North Star. Proposing team must address the core flaw.

  ---

  **Applying the Procedure: Three Live Examples**

  **1. Proposal:** Rank internal doc search results by Click-Through Rate (CTR).

  *   **Step 1 (True North):** *"Developers find accurate documentation faster, reducing time wasted searching and improving productivity."* **Good.**
  *   **Step 2 (Proxy Pathway):** *"Higher CTR means the top result was relevant more often, meaning devs found what they needed faster."* **Plausible, but...**
  *   **Step 3 (Noise/Friction):** *Noise:* Time of day (rushed devs click first thing?), specific events (outage docs spike), UI changes (bigger buttons = higher CTR). *Friction:* Easy to collect. **Acknowledged. Amber Flag (Noise potential).**
  *   **Step 4 (Goodhart Collapse):** *Gaming Scenarios:* "Make titles wildly clickbaity but content poor." "Only surface super common docs, burying niche/important ones." "Downrank critical troubleshooting docs if they have low CTR initially." **Plausible & Damaging. Major Amber Flag.**
  *   **Step 5 (Causal Lever):** We control ranking algo. Changing ranking *can* influence findability. Causality *assumed* but plausible. **Good.**
  *   **Step 6 (Adversaries):** Internal users (devs) unlikely to maliciously game *for CTR*. No strong external adversary. **Low Risk.**
  *   **Step 7 (Counter-Metrics):** **Essential!** "Time spent on doc page after click", "Search session duration", "Direct search exits after result list", "Manual search re-runs". **Amber - Must require these.**
  *   **Step 8 (Practicality):** Low cost. **Good.**
  *   **Decision: AMBER.** CTR *alone* is dangerous. **Approval Conditional** on implementing robust counter-metrics (especially post-click engagement) to detect when high CTR becomes misleading. Optimisation must consider the counter-metrics jointly.

  **2. Proposal:** Code-review bot training signal: Whether developers accept its suggested edit.

  *   **Step 1 (True North):** *"Improve code quality and reduce bugs by automating routine review tasks, freeing up human reviewers for complex issues."* **Good.**
  *   **Step 2 (Proxy Pathway):** *"If a dev accepts the edit, it was a good, useful suggestion that improved the code."* **Plausible on surface...**
  *   **Step 3 (Noise/Friction):** *Noise:* Developer's mood/patience/time pressure, suggestion complexity, clarity of bot's message. *Friction:* Easy to collect acceptance events. **Acknowledged.**
  *   **Step 4 (Goodhart Collapse):** *Gaming Scenarios:* "Devs accept *any* suggestion quickly to get the bot to go away, even if wrong or detrimental." "Bot suggests only trivial, low-risk edits (typos) to boost acceptance rate, avoiding valuable but complex suggestions (potential logic flaws)." **Highly Plausible & Destroys Value. Major Red Flag.**
  *   **Step 5 (Causal Lever):** Bot controls suggestions. Acceptance *might* indicate quality... but see Step 4 collapse. Causality weak due to gaming risk. **Amber Flag.**
  *   **Step 6 (Adversaries):** **Internal Adversaries Present!** Developers are the users. Their incentive is often speed, not rigorous review. They can easily game by blind acceptance. **High Risk.**
  *   **Step 7 (Counter-Metrics):** **Critical!** "Rate of *later* reverts/changes to accepted bot edits", "Rate of bugs/issues traced to code modified by bot", "Human reviewer override rate on bot-accepted files", "Complexity/risk profile of *accepted* vs *rejected* suggestions". **Must require these.**
  *   **Step 8 (Practicality):** Easy to collect accept/reject. Harder to collect good counter-metrics (reverts, bug links). **Amber Flag.**
  *   **Decision: RED/AMBER.** Using pure acceptance rate as the *training signal* is highly vulnerable to lazy adoption and trivialisation. **Reject as primary signal.** Requires redesign: Combine acceptance with strong counter-metrics for *quality* (e.g., human reviewer confirmation *after* acceptance, lack of reverts) in the training loop. Might need human-in-the-loop validation for training data. Amber = If they redesign with robust safeguards/counters.

  **3. Proposal:** Fraud model scored on Confirmed Fraud Caught (Recall of *known* fraud).

  *   **Step 1 (True North):** *"Prevent financial loss by stopping fraudulent transactions."* **Good.**
  *   **Step 2 (Proxy Pathway):** *"Catching more confirmed fraud directly prevents loss."* **Direct & Good.**
  *   **Step 3 (Noise/Friction):** *Noise:* Fluctuations in fraud ring activity (not model's fault). *Friction:* Requires confirmed fraud labels (costly investigation, lag). **Acknowledged. Significant Friction (label cost/lag).**
  *   **Step 4 (Goodhart Collapse):** *Gaming Scenarios:* Model could become overly aggressive, flagging *everything* slightly suspicious. Catches more *known* fraud but causes massive false declines (legit transactions rejected), harming customers & revenue. **Plausible & Damaging. Major Amber Flag.**
  *   **Step 5 (Causal Lever):** Model controls decline decisions. Catching more fraud *does* directly prevent loss. **Good.**
  *   **Step 6 (Adversaries):** **HIGH RISK!** Fraud rings are *highly motivated, external adversaries*. They *will* see which transactions get declined (their cashout fails). They *will* adapt their methods to evade *this specific model*. The metric itself becomes stale quickly as adversaries adapt. **CRITICAL Red Flag.**
  *   **Step 7 (Counter-Metrics):** **ESSENTIAL!** "False Decline Rate" (FDR - good transactions blocked), "Approval Rate", "Revenue Impact", "Model update frequency", "Performance on *new* fraud patterns". **Must require these, especially FDR & update cadence.**
  *   **Step 8 (Practicality):** Confirmed fraud data is costly/lagged but essential. Counter-metrics (FDR) also crucial but need careful measurement. **High Cost, Justified.**
  *   **Decision: AMBER.** While catching fraud *is* the goal, using *only* Confirmed Fraud Caught (Recall) as the score is **dangerous** due to adversary adaptation and risk of excessive false declines. **Approval Conditional** on:
      *   **Mandatory Counter-Metrics:** FDR and Approval Rate tracked *in real-time* with equal importance.
      *   **Robust Model Retraining:** Frequent retraining cycles on *very recent* data to combat adaptation.
      *   **Threshold Management:** The *operational* threshold for declining transactions must balance Recall and FDR, not blindly max Recall. The *training* objective might need to incorporate FDR cost.
      *   **Stealth:** Minimise information leakage to fraudsters about *why* things were declined.

  **Key Takeaways:**

  *   **Judgement Steps:** Steps 2 (Plausibility), 3 (Noise Significance), 4 (Plausibility of Gaming), 5 (Causality Strength), 6 (Adversary Risk Level) inherently involve your engineering/system knowledge. The *procedure* forces you to explicitly consider them.
  *   **Objective Steps:** Steps 1 (Clarify Goal), 3 (Identify Noise Sources), 6 (Identify Adversaries), 7 (Suggest Counters), 8 (Cost Feasibility) are more about uncovering facts and requirements.
  *   **"Not Yet" = Amber:** This is your most powerful outcome. It forces meaningful improvement *before* integration. Don't skip the safeguards.
  *   **Red Means Red:** Protect the system from fundamentally flawed incentives. Saying "no" is better than building a self-defeating system.
  *   **Counter-Metrics are Armour:** They're not optional extras for risky metrics; they're essential early-warning systems.

  This procedure replaces the shrug with structured scepticism. It won't catch *everything*, but it forces the conversation past the superficial "yes it's a proxy" and makes the risks visible and actionable. Good luck! Now go wield that clipboard.
