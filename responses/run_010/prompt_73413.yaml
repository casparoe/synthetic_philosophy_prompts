answer: |-
  Here is a decision tree designed to diagnose a novel's implicit stance on moral conflict, usable without philosophical training. Each branch examines narrative architecture and aftermath handling. **Bold terms** are leaf labels:

  ---

  ### **The Moral Architecture Taxonomy (8 Questions, 9 Leaves)**

  1.  **After the choice, does the narrative treat the *unchosen option* as:**
      *   **A) Extinguished?** (The matter is closed; consequences only flow from the chosen path). → **Q2**
      *   **B) A persistent pressure?** (Debt, regret, haunting, unresolved obligation). → **Q3**

  2.  **Does the narrative imply the agent *could* have authentically chosen otherwise?**
      *   **A) No.** (The choice was inevitable given who they were). → **Leaf 1: Revealed Identity**
      *   **B) Yes.** → **Leaf 2: Clean Resolution**

  3.  **Is the conflict primarily between:**
      *   **A) Two personal obligations/demands *on this agent*?** (e.g., duty to family vs. duty to country). → **Q4**
      *   **B) A personal obligation/demand vs. an impersonal good/principle?** (e.g., loyalty vs. greater good, love vs. justice). → **Q5**

  4.  **Does the narrative suggest the options *could have been weighed* on a single scale?**
      *   **A) Yes.** (Implying one was clearly "heavier"). → **Leaf 3: Tragic Calculus**
      *   **B) No.** (Implying a leap beyond pure calculation). → **Q6**

  5.  **Does the agent experience profound grief/revulsion *unrelated* to doubting the *correctness* of the choice?**
      *   **A) Yes.** (Loss, horror, but not "I chose wrong"). → **Q7**
      *   **B) No.** (Their pain stems directly from believing the choice was wrong/missed). → **Leaf 4: Unresolved Agony**

  6.  **Did the agent's *own prior wrongdoing* significantly cause this dilemma?**
      *   **A) Yes.** → **Leaf 5: The Maker's Burden**
      *   **B) No.** → **Leaf 6: Pluralist Agony**

  7.  **Does the narrative imply the *world itself* later balances the scales?**
      *   **A) Yes.** (Compensation, fitting punishment, redemption). → **Leaf 7: Cosmic Ledger**
      *   **B) No.** (The loss remains stark, uncompensated). → **Q8**

  8.  **Does the narrative leave open that *both paths* could have been taken without absurdity?**
      *   **A) Yes.** → **Leaf 8: Unmeasured Crossroads (Unnamed)**
      *   **B) No.** → **Leaf 9: Unmourned Remainder**

  ---

  ### **Leaf Explanations & Philosophical Positions**

  1.  **Revealed Identity:** Choice reveals pre-existing character/identity; no true conflict. (*Dissolution: Conflict is provisional*).
  2.  **Clean Resolution:** Dilemma real but resolvable; one option outweighs, no residue. (*Overriding*).
  3.  **Tragic Calculus:** Personal obligations conflict; resolvable by weighing, but painfully. (*Overriding with cost*).
  4.  **Unresolved Agony:** Conflict persists; agent believes they chose wrongly. (*Implies contradiction? Often unstable*).
  5.  **The Maker's Burden:** Agent's past actions created dilemma; residue is consequence. (*Remainder as just desert*).
  6.  **Pluralist Agony:** Obligations incommensurable; choice underdetermined, residue inevitable. (*Pluralism with Remainder*).
  7.  **Cosmic Ledger:** World eventually provides justice/balance for the loss. (*Remainder resolved externally*).
  8.  **Unmeasured Crossroads (Unnamed):** Both paths viable, no common scale, world doesn't balance, residue persists. (*Strong Pluralism + Uncompensated Remainder*).
  9.  **Unmourned Remainder:** Residue persists, no world-balancing, not tied to prior wrong, but narrative dismisses viability of unchosen path. (*Remainder without justification or measurement*).

  ---

  ### **Worked Example: The Existentialist's Dilemma (Free Forces vs. Mother)**

  1.  **Persistent Pressure?** (Q1-B) → *Yes* (Haunted by either abandoning mother or failing country).
  2.  **Conflict Type?** (Q3-A) → *Two personal obligations* (Duty to mother, duty to freedom).
  3.  **Weighable?** (Q4-B) → *No* (Existentialists reject pure calculation; it's about commitment). → **Q6**
  4.  **Prior Wrongdoing?** (Q6-B) → *No* (Dilemma caused by war, not his sin). → **Leaf 6: Pluralist Agony**

  *   **Result:** The novel enacts **Pluralist Agony** – incommensurable duties, underdetermined choice, inevitable residue.

  ---

  ### **Indistinguishable Pairs & Required Questions**

  *   **Leaf 2 (Clean) vs. Leaf 3 (Tragic Calc):** Both imply resolvability.
      *   *Separator:* "Is the resolution portrayed as *painfully obvious* (Clean) or *painfully calculated* (Tragic Calc)?" (Q on narrative emphasis).
  *   **Leaf 6 (Pluralist Agony) vs. Leaf 8 (Unmeasured Crossroads):** Both involve incommensurability & residue.
      *   *Separator:* "After the choice, does the narrative suggest the *other path remains a live possibility/regret* (Leaf 6) or is it *dismissed as non-viable for the agent* (Leaf 8)?" (Q on viability of unchosen).

  ---

  ### **Unoccupied Cells & Diagnoses**

  | Combination                                       | Diagnosis                                                                 |
  | :------------------------------------------------ | :------------------------------------------------------------------------ |
  | **Persistent Residue (B) + Resolvable (A on Q4)** | *Incoherent:* If residue persists, narrative implies it wasn't fully resolvable by weighing. |
  | **Cosmic Ledger (Leaf 7) + Unmourned Remainder (Leaf 9)** | *Incoherent:* World-balancing negates "unmourned" residue.             |
  | **Extinguished (A) + Pluralist Agony (Leaf 6)**      | *Incoherent:* Pluralism requires residue; "extinguished" denies it.       |
  | **Prior Wrongdoing (A on Q6) + Clean Resolution (Leaf 2)** | *Merely Unattractive:* Why show prior sin if choice is clean? Weak narrative payoff. |
  | **Impersonal Good (B on Q3) + No Common Scale (B on Q4) + World Balances (A on Q7)** | *Untried (Potentially Fertile):* Can impersonal, incommensurable choices be cosmically resolved? Rare in philosophy, possible in fiction (e.g., karmic justice for utilitarian sacrifice). |
  | **Persistent Residue (B) + Agent's Prior Wrongdoing (A) + World Balances (A)** | *Untried (Fragile):* Residue + desert + cosmic balance risks overdetermination/narrative muddle. |

  ---

  ### **Key for Your Novel**

  *   **Branch 3:** Conflict Type? (A: Two Obligations - Duty to Patient A vs. Duty to Patient B? Or B: Duty to Patient vs. Impersonal Justice/Hatred?)
  *   **Branch 4:** Weighable? (Can she "calculate" who deserves it more? Or is it beyond calculation?)
  *   **Branch 6:** Prior Wrongdoing? (YES - his denunciation *put her there*. Crucial! Points strongly to **Leaf 5: The Maker's Burden**).
  *   **Branch 1:** Persistent Pressure? (Does the unchosen patient/death haunt her?)
  *   **Branch 7:** World Balances? (Does she find redemption? Is the denouncer's death "justice"?)

  **Likely Landing:** Given the denunciation (**Q6-A**), if residue persists (**Q1-B**), and especially if the world *doesn't* neatly balance (**Q7-B**), your novel likely occupies **Leaf 5: The Maker's Burden** (remainder as consequence of *his* sin creating *her* dilemma). If the *nature of the conflict* (personal vs. impersonal) and *persistence of residue* are emphasized without cosmic balance, it might edge towards **Leaf 8: Unmeasured Crossroads** or **Leaf 9: Unmourned Remainder**. **Check Q1, Q7, and Q8 carefully.** The empty cells analysis suggests avoiding combinations where residue exists but is labeled "extinguished" or where cosmic balance coexists with unmourned residue. Your setup (prior wrongdoing causing dilemma) strongly anchors it in philosophically recognized territory (Leaf 5).
