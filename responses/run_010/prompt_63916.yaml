prompt: |-
  So I got roped into being the keeper of our "how engineering works" doc at my company — the one that says how we propose changes to how we work (RFCs, basically). Two weeks ago someone noticed that rule 7 says any change to the doc needs a two-thirds vote of the eng org, rule 12 says the doc may also be amended by any procedure the org agrees to unanimously, and rule 4 says individual rules can be deleted by a simple majority. So you can apparently delete rule 7 with 51% and then rewrite everything else the same way. Then someone else pointed out rule 3, which says "this rule may not be amended," got amended last year by a 90% vote and literally nobody objected at the time, so is the doc now in an illegal state or is rule 3 just gone? And there's a third thing that's been bugging me: an RFC got merged that retroactively declared a previous amendment void as of the date it was merged, which means for a while we were operating under rules that, per the new rule, never counted. That whole mess sent me down the self-referential-rulebook rabbit hole — I've been reading about Nomic (the Suber/Hofstadter game where some rules are marked immutable until a vote makes them mutable) and about constitutions with clauses governing their own amendment, and people claiming there's a genuine paradox sitting in there somewhere.

  Before I read any actual theories about this, I want to know what I should even be demanding of one. Write the desiderata: what an account of how a rule-system can change its own rules has to deliver to count as adequate — the cases it has to get right, the distinctions it can't collapse (valid procedure vs. legitimate outcome, the rulebook as it is vs. the rulebook as people act on it, that kind of thing), and the constraints that any real rulebook seems to impose no matter how it's written. For each item give me the concrete case or consideration behind it — use the three situations from my doc where they fit, and invent others where mine don't reach — and mark whether it's non-negotiable or just a demand one camp makes that another camp would reject, and why. Then the part I actually care most about: if some subset of the list cannot all be satisfied at once, say exactly which ones and where the squeeze comes from, because I strongly suspect there's one hiding in here and I'd rather it be explicit than smoothed over. Last, tell me which single requirement does the most to rule out candidate theories.

  Format: numbered list, one or two sentences of motivation per item, hard cap of 650 words for the whole thing. And skip the scorecard of who says what — I don't want names or book titles, I'll go find those myself after I know what I'm shopping for.
reasoning: |-
  Okay, the user is dealing with a complex self-referential rulebook at their company, specifically the "how engineering works" doc. They've encountered several issues: rule 7 requiring two-thirds vote for amendments, rule 12 allowing amendments by unanimous consent, and rule 4 enabling deletion of individual rules by simple majority. This creates a loophole where rule 7 could be bypassed. Additionally, rule 3, which was supposed to be immutable, was amended last year with 90% approval without objections. There's also a retroactive amendment that voided a previous rule change, causing confusion about the validity of past actions.

  The user wants a set of desiderata for evaluating theories on how rule systems can change their own rules. They specifically mention three situations from their doc and ask for concrete cases, distinctions like valid procedure vs. legitimate outcome, and constraints inherent in real rulebooks. They want to know which desiderata might conflict and which one is most critical for ruling out theories.

  First, I need to identify core principles for any robust theory of self-amendment. The key is to handle self-reference without paradoxes. The desiderata should cover consistency, clarity in transition states, authority of rules, and practical constraints. 

  Starting with consistency: the rulebook must avoid contradictions, like both requiring and not requiring a supermajority for amendments. The case with rule 3 being amended despite its immutability clause shows this problem. This is non-negotiable because contradictions make the rules unworkable.

  Next, historical validity: the theory must address retroactive changes. The RFC that voided a past amendment creates a situation where actions were taken under rules that were later deemed invalid. How does the theory handle the legitimacy of past actions under now-invalidated rules?

  Authority is crucial. Rules derive power from higher rules, but what's the ultimate source? If rule 3 was amended, was that amendment valid? If the foundational rule is broken, the entire system's legitimacy is at risk. This might be non-negotiable as it underpins the system's authority.

  The distinction between de jure (written rules) and de facto (practiced rules) is important. In the case of rule 3's amendment, everyone acted as if it was valid, so does that override the written prohibition? This highlights a gap that theories must address.

  Procedural vs. substantive validity matters. Is a change valid if the procedure is followed, even if it violates a rule (like deleting rule 7 via majority)? Or does the outcome (allowing easier amendments) invalidate the process? This is a key debate between different theoretical camps.

  Implicit constraints like non-retroactivity or good faith are practical necessities. The retroactive amendment caused confusion; a good theory should prevent such issues to maintain trust. While not always explicit, these are often non-negotiable for functional systems.

  Now, conflicts between desiderata: Consistency and Authority might clash with Historical Validity. For example, if a rule was broken in the past (like amending rule 3), insisting on consistency might invalidate all subsequent actions, but honoring historical validity could mean accepting a broken rule. The squeeze is between maintaining current coherence and honoring past legitimacy.

  The most critical desideratum is Consistency. If the rulebook has contradictions, no other principles hold. For instance, if Rule 7 and Rule 12 conflict, the system can't function predictably. Theories that can't resolve such contradictions are inadequate.

  I'll structure the response as a numbered list with each desideratum, its motivation, and whether it's non-negotiable. Cases from the user's doc will be referenced where applicable. The conflict between Consistency and Historical Validity will be highlighted, and Consistency will be identified as the most crucial requirement.
answer: |-
  Here's a distilled list of desiderata for an account of self-amending rule-systems, grounded in your cases and core distinctions:

  1.  **Consistency (Non-negotiable):** The system must avoid logical contradictions within its rules *at any given time*. Motivation: Your Rule 3 ("immutable") being amended creates an instant contradiction if "immutable" means unamendable. A theory must resolve this state (e.g., rule invalidated, "immutable" reinterpreted).

  2.  **Historical Validity (Contested):** The theory must account for the legitimacy of actions taken under rules *at the time they were followed*, even if those rules are later changed or voided. Motivation: Your retroactive voiding RFC implies actions taken during the "void" period were illegitimate. This clashes with practical reality and trust in the system *as it was understood then*. Some camps prioritize current rules, others historical context.

  3.  **Authority Source (Non-negotiable):** The theory must identify the ultimate source of authority granting power to the rules and amendment procedures. Motivation: If Rule 4 allows deleting Rule 7, what grants Rule 4 its power? How did the initial rules gain authority? Without this, the system floats without foundation.

  4.  **Distinction: De Jure vs. De Facto (Non-negotiable):** The theory must differentiate between the *written rules* (de jure) and the *rules actually followed* (de facto) by the community. Motivation: Rule 3 was amended despite its text; everyone *acted* as if the amendment was valid. Ignoring this gap renders the theory irrelevant to practice.

  5.  **Distinction: Procedural Validity vs. Substantive Validity (Contested):** It must separate whether a change *followed the correct procedure* (procedural validity) from whether the *outcome* is substantively permissible under higher rules (substantive validity). Motivation: Deleting Rule 7 via Rule 4 is procedurally valid per Rule 4, but substantively bypasses Rule 7's intent. Some theories prioritize procedure, others substance (like Rule 3's prohibition).

  6.  **Rule Closure / Self-Containment (Contested):** The theory must explain how the rules govern *all* changes, including changes to the amendment rules themselves. Motivation: Rule 12 offers an alternative path; Rule 4 targets deletions. A theory must handle amendments *using only the resources within the rulebook*.

  7.  **Implicit Constraints (Non-negotiable):** It must recognize implicit constraints inherent in any functional rule-system, even if unstated (e.g., non-retroactivity presumption, good faith interpretation, avoidance of paradoxes). Motivation: Your retroactive voiding violates non-retroactivity, creating chaos. Ignoring such constraints makes the system unstable and unusable.

  8.  **Resolution of Ambiguity (Non-negotiable):** The theory must provide a mechanism for resolving ambiguity or gaps in the rules *before* an amendment clarifies them. Motivation: The interaction between Rules 4, 7, and 12 is ambiguous. How is "amended" interpreted? What takes precedence? A theory needs a default resolution logic.

  **Conflict:** **Consistency (1)** and **Historical Validity (2)** clash directly in cases like your retroactive voiding. Declaring past actions illegitimate **(1)** undermines trust and practical operation **(2)**, yet ignoring the contradiction **(2)** violates logical coherence **(1)**. The Rule 3 amendment also embodies this conflict: upholding the amendment violates **Consistency** with its original text, while invalidating it undermines **Historical Validity** of past actions relying on it.

  **The Squeeze:** Upholding **Consistency** and **Authority Source (3)** (requiring strict adherence to foundational rules) can invalidate actions taken under amended rules that violated higher constraints (like Rule 3's "immutable"), clashing with **Historical Validity (2)** and potentially **De Facto Recognition (4)**. Prioritizing **Historical Validity (2)** and **De Facto (4)** risks tolerating internal contradictions **(1)** and eroding the **Authority Source (3)**.

  **Most Ruling-Out Requirement:** **Consistency (1)** does the most to rule out candidate theories. A theory that cannot guarantee the rulebook is logically coherent *at any single point in time* – meaning it cannot resolve contradictions like an amended "immutable" rule or conflicting amendment paths – fails fundamentally. Systems built on contradictory rules cannot function predictably, making other desiderata like procedural validity or historical legitimacy moot. Your case (Rule 3 amended) is a prime example demanding this resolution.
