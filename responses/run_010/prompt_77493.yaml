answer: |-
  ## Joint Statement: On Moral Responsibility and Reactive Attitudes

  **Preamble**  
  We, the undersigned, agree that moral responsibility is a central feature of human life with profound practical consequences for relationships, institutions, and society. We further agree that practices of praising, blaming, resenting, and feeling gratitude are deeply woven into this fabric. While we hold fundamentally different views on the *justification* and *metaphysical grounding* of these practices in light of causal determinism, we concur that any adequate account must explain the phenomena as we find them: the pervasiveness and persistence of reactive attitudes, the specific conditions under which we modify or suspend them, and the nature of the "objective attitude" as an alternative stance. Our disagreement concerns whether our reactive practices, as they function, inherently provide the only relevant framework for understanding responsibility ("desert in the basic sense"), or whether determinism reveals these practices to lack ultimate justification despite their psychological and social inevitability. We commit to presenting our core disagreement clearly, identifying points of contact, and specifying what empirical or conceptual developments could resolve our differences.

  **I. Agreed Upon Claims**

  1.  **Nature of Reactive Attitudes:** Reactive attitudes (e.g., resentment, indignation, gratitude, moral blame, moral praise) are distinct from mere aversion (like disgust at a smell) or mere approval (like enjoying a pleasant melody). They are essentially *interpersonal* and *addressive*. They involve:
      *   A perception of an agent as having acted (or omitted to act) in a way that *matters* to the respondent or to others.
      *   A sense that the agent *owes* something (an account, an apology, appreciation) to the respondent or others affected.
      *   A demand for recognition of standards governing interpersonal conduct.
  2.  **Non-Controversial Excusing & Exempting Conditions:** We agree there are conditions under which reactive attitudes are suspended or modified, not merely weakened, because the target agent is not seen as a full participant in the moral community:
      *   **Non-Responsible Agents:** The very young, individuals with severe cognitive impairments or mental illness that fundamentally disrupts agency (e.g., profound dementia, certain psychoses).
      *   **Impaired Agency:** Individuals acting under compulsion (external coercion or internal drives overriding normal deliberation), extreme temporary distress (e.g., acute panic, grief-induced actions), or extraordinary situational pressures that significantly undermine normal capacities for choice and control.
      *   **Mechanism:** In these cases, adopting the "objective attitude" – treating the individual as an object of management, treatment, training, or causal explanation, rather than as someone to whom demands are addressed – is natural and often appropriate.
  3.  **Determinism's Claim:** Determinism, as discussed here, is the thesis that every event, including human decisions and actions, is the inevitable consequence of antecedent states of the universe and the laws of nature. It is *not* being claimed that determinism entails:
      *   Fatalism (that specific outcomes are inevitable regardless of choices).
      *   Predictability by humans in practice.
      *   The absence of deliberation, choice, or reasons-responsiveness as psychological processes.
      *   The reduction of all explanations to physics/chemistry; higher-level explanations (psychological, social) remain valid.
  4.  **The Objective Attitude:** The objective attitude is a recognizable stance we take towards others, characterized by detachment from the interpersonal demands inherent in reactive attitudes. It focuses on explanation, prediction, control, treatment, or management. Crucially:
      *   It is a *local* resource we deploy situationally (e.g., towards the toddler, the mentally ill patient, sometimes even the frustrating colleague when stepping back).
      *   It is not a *general policy* that any human being has ever managed to sustain comprehensively in their interpersonal relations. Attempts to do so universally are psychologically unsustainable and would dissolve the fabric of ordinary human relationships.

  **II. Points of Persistent Disagreement**

  | Disagreement Area          | Strawsonian Articulation                                                                                                                                                      | Sceptic Articulation                                                                                                                                                                         | What Would Settle It                                                                                                                                                                |
  | :------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. The Framework of Responsibility** | The practices constituted by the reactive attitudes *are* the framework within which the concept of moral responsibility ("desert in the basic sense") has its life and meaning. Asking for a justification *outside* this framework is unintelligible; it demands a warrant from a non-existent "external" court. | The reactive attitudes are powerful psychological and social phenomena, but they do not *constitute* responsibility; they presuppose it. Responsibility requires that an agent *truly deserves* praise/blame *ultimately*, which determinism shows is impossible. The Strawsonian account redefines responsibility to fit the attitudes, changing the subject. | Conceptual analysis: Could a community with identical reactive attitudes but operating under known universal manipulation (e.g., by neuroscientists) still be said to hold agents *truly* responsible? (Strawson: Yes, meaning remains. Sceptic: No, manipulation voids desert). |
  | **2. Warrant vs. Inevitability**      | The reactive attitudes are inherently *warranted* (or unwarranted) *within* the practice by the presence (or absence) of the standard excusing/exempting conditions. Determinism is irrelevant to this warrant; it doesn't introduce a *new* exempting condition. | Determinism shows that the reactive attitudes, while psychologically and socially inevitable, lack ultimate *warrant*. They are not justified responses to agents who ultimately couldn't have done otherwise. The standard excusing conditions are merely local modifications within an ultimately unwarranted framework. | Metaphysical discovery: If libertarian free will were proven false *and* determinism true, would this discovery *require* the abandonment of reactive attitudes as unwarranted? (Sceptic: Yes, eventually. Strawson: No, the practice defines warrant). |
  | **3. The Role of Explanation**        | A complete causal explanation of an agent's conduct does not *remove* the warrant for reactive attitudes unless it falls under the agreed excusing/exempting conditions (e.g., compulsion, psychosis). Explanation and responsibility operate at different levels. | A complete causal explanation of an agent's conduct, showing it as the inevitable outcome of prior causes, *does* remove the warrant for resentment/blame in the basic desert sense. It shows the agent is not an ultimate source, making reactive attitudes metaphysically inappropriate, however natural. | Analysis of agreed exemptions: Does the exemption granted to, e.g., the compulsive, work because the explanation reveals the *absence* of true responsibility (Sceptic), or because it reveals a *failure of reciprocity* within the practice (Strawson)? |

  **III. Cruxes: Applying the Disagreement to Cases**

  **Crux 1: The Technician & the Demand for an Account (Falsifying Records)**
  *   **Case:** Agent's conduct explained by temperament/history, yet intense, addressive indignation ("he owed an account") persisted.
  *   **Strawsonian Reading:** The indignation was warranted *because* the standard excusing conditions (compulsion, psychosis, etc.) were absent. The sense of being owed an account *is* the recognition of moral responsibility within the practice. The causal explanation doesn't negate this; it operates at a different (explanatory) level. The persistence of the attitude reflects its warranted nature within the interpersonal framework.
  *   **Sceptic Reading:** The indignation was a powerful, inevitable psychological response shaped by evolution and social norms, but unwarranted upon reflection. The demand for an account presupposes ultimate responsibility, which the causal explanation shows was absent. The feeling persists because our psychology isn't easily overridden by abstract metaphysics, not because it tracks ultimate truth.
  *   **Shared Question:** Does the persistence of the reactive attitude *despite* accepting a causal explanation indicate its *warrant within the practice* (Strawson) or merely its *psychological robustness* (Sceptic)?
  *   **Predictive Test:** **Strawson** predicts that if we discovered a *new* excusing condition (e.g., a specific brain lesion causing dishonesty without compromising general competence), indignation would fade *as recognition of exemption*, akin to learning about the neurological illness in Crux 2. **Sceptic** predicts that even without new exemptions, widespread genuine acceptance of determinism *should* eventually erode reactive attitudes, seeing them as akin to persistent superstitions. If societal acceptance of determinism increases without diminishing reactive attitudes, Sceptic must explain this persistence as irrational residue. If it *does* diminish them, Strawson must explain why the practice isn't as fundamental as claimed.

  **Crux 2: The Fading Resentment (Neurological Illness)**
  *   **Case:** Resentment faded upon learning of a progressive neurological illness affecting the colleague.
  *   **Strawsonian Reading:** The fading resentment represents the *correction* of the reactive attitude in light of new information relevant to the *standard exemptions*. Learning of the illness revealed the colleague was becoming exempt from full participation in the moral community (akin to the gravely mentally ill). The attitude adjusted to track the truth about the agent's status within the practice.
  *   **Sceptic Reading:** The fading resentment is a change in "psychological weather." Learning the neurological cause altered the *perception* of the colleague, making resentment harder to sustain emotionally, but this doesn't validate the *prior warrant* of the resentment. It merely shows how new causal information changes our feelings. The alarm analogy is apt: learning the noise's cause changes our feeling, not the noise's objective properties.
  *   **Shared Question:** Is the change in attitude best understood as the practice *self-correcting* based on truth-relevant conditions (Strawson) or as a *psychological shift* with no necessary bearing on the underlying warrant of the original attitude (Sceptic)?
  *   **Predictive Test:** **Strawson** predicts that if we discovered the neurological illness *predated and caused* the specific authorship dispute behaviour, the fading would be immediate and recognized as warranted suspension. If we discovered the illness *only started after* the dispute, the resentment would likely persist or only fade for non-responsibility related reasons (e.g., pity). **Sceptic** predicts that learning *any* compelling causal story (even one not fitting standard exemptions, e.g., a deterministic explanation of childhood trauma shaping the colleague's competitiveness) could cause resentment to fade psychologically, regardless of warrant, just as learning the noise's mundane cause dispels alarm.

  **Crux 3: The Persistence Datum (Determinism & Unmoved Attitudes)**
  *   **Case:** Lifelong belief in determinism has had no impact on the subject's own reactive attitudes (gratitude, indignation, sense of obligation).
  *   **Strawsonian Reading:** This persistence demonstrates that the reactive attitudes are not responses to a metaphysical condition (libertarian free will) but are constitutive of the interpersonal relationships that define our lives. They are the framework *within which* concepts like "owing" make sense. Determinism is irrelevant to this framework; it cannot dislodge what it doesn't address at the right level. The ability to adopt the objective attitude locally doesn't translate to a sustainable global perspective.
  *   **Sceptic Reading:** This persistence is evidence of the powerful evolutionary and social conditioning underpinning reactive attitudes. Their strength and utility for social cohesion make them resistant to abstract philosophical belief, just as optical illusions persist despite knowing they are illusions. It shows psychological robustness, not metaphysical validity. The "sense of owing" is a compelling illusion fostered by natural selection.
  *   **Shared Question:** Does the failure of determinist belief to dislodge reactive attitudes show they are *metaphysically robust* because constitutive of responsibility (Strawson), or *psychologically robust* but ultimately unjustified illusions (Sceptic)?
  *   **Predictive Test:** **Sceptic** predicts that if individuals could truly, deeply internalize determinism not just as a belief but as a visceral understanding (perhaps via future neuro-technology or profound meditation), reactive attitudes *would* significantly diminish or transform. **Strawson** predicts that even with such internalization, the demands of sustained interpersonal relationships would inevitably reassert the reactive stance, as the objective attitude is unsustainable universally. Failure to diminish attitudes despite deep internalization supports Strawson; success supports Sceptic.

  **IV. The Core Disagreement (Articulated as Suspected)**

  The fundamental disagreement, evident across the cases and the table, concerns the **relationship between causal explanation and the *warrant* of reactive attitudes**:

  *   **The Strawsonian Position:** A complete causal explanation of an agent's conduct *does not remove the warrant* for reactive attitudes like resentment, *unless* that explanation reveals the presence of one of the agreed excusing or exempting conditions (e.g., compulsion, psychosis, childhood). The warrant is internal to the practice constituted by the attitudes themselves; causal explanation operates on a different plane. Explanation may *give us reason to set the attitude aside* mercifully or strategically in specific instances, but it doesn't show the attitude was *never warranted*.
  *   **The Sceptical Position:** A complete causal explanation of an agent's conduct, by showing it was the inevitable outcome of antecedent causes, *does remove the basic warrant* for reactive attitudes like resentment. It reveals that the agent is not an ultimate source of action, negating the fundamental desert presupposed by the attitude. The standard excusing conditions are merely salient instances where this lack of ultimate responsibility is most obvious, but the lack is universal under determinism. Setting resentment aside locally may be pragmatic, but the explanation shows it was never *truly* deserved.

  **Conclusion**
  We remain in profound disagreement. The Strawsonian holds that moral responsibility is a non-eliminable feature of our form of life, grounded in the reactive attitudes which define the only intelligible framework for questions of desert. The Sceptic holds that determinism reveals our practices of praise and blame, however psychologically ingrained and socially necessary, to lack ultimate justification for attributing basic desert. Our agreements clarify the shared phenomenological ground. Our table and cruxes pinpoint the exact nature of our divergence: whether the framework of reactive attitudes *constitutes* responsibility and its warrant, or merely *presupposes* an impossible condition (ultimate responsibility) revealed as illusory by determinism. The predictive tests offer potential paths for resolution, though we differ on what would constitute decisive evidence. We present this statement not as a resolution, but as a precise map of our disagreement.

  ---
  **Signed,**

  [Name of Strawsonian Philosopher]
  [Name of Sceptical Philosopher]
