prompt: |-
  my dept reading group has split into two camps on Rawls and religion and we've been talking past each other all semester. camp A says the later Rawls — public reason, the proviso — asks religious citizens to hold their comprehensive doctrines back when they argue about constitutional essentials and basic justice, so religion gets a private role and public argument has to run on grounds everyone could share. camp B reads the same pages and gets the opposite: the proviso actually invites religious reasons into the open so long as public reasons are given in due course, and they point to how Rawls treats the abolitionists and the civil rights movement — arguing their religiously grounded advocacy was at least defensible and maybe made the liberal society stronger.

  write the joint statement the two of them could both put their names to after a real adversarial collaboration. I want the claims about the texts and the underlying argument that both can sign; the residual disagreement phrased so that each camp would accept the wording of its own side; the cruxes — the sub-questions where settling one would actually move somebody — and for each crux the consideration both agree bears on it plus each side's prediction written down in advance; and a flag on whatever part of the dispute you think is merely verbal, saying which part and what the neutral vocabulary would be.

  to keep them off abstractions, make them work through one case neither camp has been using: a coalition of religious bodies campaigns for a large expansion of a refundable tax credit for low-wage workers, arguing for it purely in scriptural terms about the duty to the poor, with no public-reason justification offered anywhere in the process; the bill passes and the religious case was the main public rationale. both camps have to say whether anything went wrong, and if so where exactly — in the campaigning, on the legislative floor, in the vote itself, at judicial review, or nowhere at all. and note that whether the case is even inside public reason's scope to begin with, as opposed to ordinary legislation, is one of the things they disagree about, so that needs its own crux. numbered agreed-claims section, then a table for the disagreements.
