prompt: |-
  I cover science and ideas for a general-interest magazine — a weekly column plus a few reported features a year — and I have a recurring problem: Zeno. Every couple of months somebody pitches me a story about how his paradoxes have finally been solved, or resurrected, or turned out to matter for quantum computing. It's usually a physicist or a mathematician, they're genuinely smart, and the pitch email always reads beautifully. Then the piece runs and my inbox fills up with philosophers explaining that I conflated three different questions and never actually touched the paradox. My editor has no philosophy training and has to sign off before I commission anything, and I dont have time to read a paper before a commissioning meeting — so whatever you build has to be runnable by a smart non-specialist in about fifteen minutes, tops.

  What I want is a triage procedure, not an essay about Zeno: ordered steps I can literally walk down a pitch. Ground it in whatever is actually solid about why these paradoxes resist the obvious fix — in particular the distinction I keep blowing past, which is that "can an infinite series sum to a finite number" is a different question from "can anyone actually perform infinitely many acts," and that there's a third register people slide into, which is a claim about whether space and time are physically discrete or continuous. My suspicion is that nearly every bad pitch moves between those three without noticing. If that's the right diagnosis, make catching the slide the first move in the procedure. If I've got the taxonomy wrong or incomplete, say so and give me the correct one instead.

  For each step I want: what a sufficient answer looks like, what an evasive or hand-wavy answer looks like, where the procedure kills the pitch outright, where it stops and hands the call to a human because the remaining question is about newsworthiness rather than correctness, and which steps are secretly judgment calls dressed up as procedure. It should also catch pitches constructed so that no counterexample can touch them.

  Then run the procedure end to end on four pitches:

  1. A lab reporting that repeatedly probing a trapped ion suppresses the transition they're watching, pitched to me as "we watched the pot and it didn't boil — Zeno was right."
  2. A mathematician arguing that a nonstandard/hyperreal treatment shows there's no such thing as completing infinitely many steps, so the paradoxes are just notation confusion.
  3. A philosopher of time arguing that instantaneous velocity is a real property of a moment rather than a limit in disguise, and that this changes how we should talk about determinism.
  4. A computer scientist pitching a machine that halves its step time each round and claims to settle the state of a lamp switched infinitely many times.

  At least one of these should come out as "genuinely interesting story, but not the story it's pitched as," and I want the procedure to say what the alternative story is and how to reframe the ask. Finish by telling me what the procedure can't do — the failure modes that will still get me burned after I've been using it for a year. No reading lists or citations, please; I can't check them and neither can my editor.
reasoning: |-
  Okay, let me tackle this science journalist's problem with Zeno pitches. They need a practical triage tool to quickly evaluate these submissions without getting burned by philosophers later. The core issue seems to be conflation of three distinct aspects: mathematical convergence, physical realizability, and ontological structure of spacetime.

  Hmm, the user's taxonomy is actually quite sharp - they've correctly identified the three main slippery slopes. But I should verify if anything's missing... *mentally scans common Zeno errors* No, they've nailed it: the infinite sum question (∑1/2ⁿ=1), the action-performability problem (can't actually cut space infinitely), and the physics question (Planck length debates). The real killer is when pitches slide between these.

  For the triage procedure, I'll design it like an algorithm with clear exit points. Step 1 should force the pitcher to declare which paradox they're addressing - Arrow? Dichotomy? Achilles? This already filters out vague "solved Zeno!" claims. Then Step 2 must isolate the domain: is this about math, physical actions, or spacetime structure? The key test is whether they acknowledge the other domains exist - if they dismiss them as irrelevant without justification, that's a red flag.

  *imagines applying this to the four test cases*
  That quantum Zeno effect pitch (1) would pass Step 1 but stumble at Step 2 if they claim it "solves" the original paradox rather than being a cool quantum observation effect. The hyperreal analysis pitch (2) might actually be interesting if framed as exploring alternative mathematical frameworks rather than declaring Zeno "wrong." 

  For the velocity pitch (3)... *pauses* This is tricky. If they're arguing velocity is an intrinsic property at instants, that could be philosophically novel without claiming to resolve Zeno. The procedure should flag this as "valid but narrow" - it's about determinism, not paradox resolution. 

  The lamp machine (4) is clearly in the "physical realizability" domain. The triage should immediately ask: are you making claims about mathematical convergence (fine) or asserting physical possibility (dead pitch)? Computer scientists often obscure this boundary with analogies.

  Biggest failure mode I foresee? When a pitch legitimately bridges domains - say a new quantum gravity model making testable predictions about continuity. The procedure might falsely reject it for "domain-sliding" when the slide is actually the point. Also, some philosophers deliberately write ambiguously - the "can't be disproven" pitches. For those, I'll add a final trap question forcing falsifiable claims.

  *checks time* Better structure this as a flowchart in the response. The exit points need to be brutal: "Kill if..." for clear violations, "Pause for human" when it's about framing rather than correctness. And always specify what the alternative angle could be - like recasting that ion trap experiment as "quantum observation effects" without mentioning Zeno.
answer: |-
  Here's a triage procedure designed for speed and robustness. It focuses on **domain isolation** and **claim-matching** to catch the slides you described. Ground rules:

  1.  **The Core Issue:** Zeno's paradoxes aren't one problem but *different problems* depending on whether we're talking about **Mathematics (M)**, **Physical Action/Realizability (P)**, or **Physical Ontology (O)** (e.g., is spacetime continuous/discrete?).
  2.  **The Killer Slide:** Almost every bad pitch implicitly assumes solving one domain (usually M or a specific P experiment) solves the others. *This is false.*
  3.  **The Goal:** Force the pitcher to explicitly state *which domain(s)* their claim addresses and *which specific paradox* it targets. Assess if the claim actually fits that domain/paradox without illicitly sliding.

  **The Zeno Pitch Triage Algorithm (15-Minute Max)**

  1.  **Identify the Target Paradox:**
      *   **Ask:** "Which specific Zeno paradox (Achilles & Tortoise, Dichotomy, Arrow, Stadium) does your work primarily address, and *in what form* (e.g., the impossibility of motion, the problem of completing infinite tasks, the nature of instants)?" *Require a specific answer.*
      *   **Sufficient:** Clear identification (e.g., "The Dichotomy paradox, focusing on completing infinitely many spatial steps"). Acknowledges if it touches multiple but specifies the primary one.
      *   **Evasive/Hand-Wavy:** Vague ("It solves Zeno"), conflates paradoxes ("all motion paradoxes"), misattributes the core problem.
      *   **Kill If:** Cannot name a specific paradox or gives a fundamentally incorrect description of it. *This catches pitches built on misunderstanding.*
      *   **Human Judgment:** Minor ambiguity is okay if the core paradox is identifiable. Major confusion is a kill.

  2.  **Pin Down the Primary Domain (M/P/O):**
      *   **Ask:** "Is your core claim primarily about: **M** (Mathematical representation/summation of infinity)? **P** (The physical possibility or impossibility of performing infinitely many actions/measurements in time)? Or **O** (The fundamental continuous/discrete nature of space, time, or motion itself)?"
      *   **Sufficient:** Clear declaration of *one* primary domain (e.g., "P - the physical act of repeated measurement"). May acknowledge relevance to others but doesn't claim to solve them.
      *   **Evasive/Hand-Wavy:** Claims to "solve the paradox" broadly, uses domain-specific language ambiguously (e.g., "proves motion is impossible" without specifying if mathematically, physically, or ontologically), implies solving one domain resolves others.
      *   **Kill If:** Actively conflates domains (e.g., "Because we sum infinite series mathematically (M), infinitely many physical steps (P) *must* be completable"). *This is the critical slide.*
      *   **Human Judgment:** Assessing if the primary domain claim is plausible for the work described.

  3.  **Demand Domain-Specific Justification:**
      *   **Ask (Based on Step 2):**
          *   **If M:** "Does your mathematical framework (e.g., calculus, nonstandard analysis, measure theory) offer a *new insight* or *resolution* specific to the *logical structure* of the identified paradox within pure mathematics, beyond standard treatments? If so, what?" *Focus on novelty in mathematical logic/interpretation.*
          *   **If P:** "How does your physical setup *specifically isolate and address the challenge of performing infinitely many distinct actions/measurements within finite time*? Does it demonstrate feasibility, impossibility, or a novel limitation? How do you define/compute 'infinitely many' actions physically?" *Demand physical realizability of infinity.*
          *   **If O:** "What *empirical evidence or theoretical necessity* does your work provide regarding the fundamental continuous/discrete nature of space/time/motion relevant to the paradox? How does this *directly resolve* the identified paradox in a way previous physics (QM, GR) or metaphysics hasn't?" *Require a link to fundamental physics/metaphysics.*
      *   **Sufficient (M):** Describes a specific mathematical novelty (e.g., a new interpretation of limits in this context, a flaw in standard formalism) directly tackling the paradox's stated logical hurdle. *Doesn't claim implications for P or O.*
      *   **Sufficient (P):** Explains how the experiment/device *operationalizes* "infinitely many" actions (e.g., halving time intervals), demonstrates a clear physical consequence *caused by this operationalization*, and explicitly discusses the *physical* limitations/costs of approaching infinity. *Doesn't claim implications for O.*
      *   **Sufficient (O):** Presents testable predictions, resolves a specific conflict in current physics, or offers a rigorous metaphysical argument *directly* about continuity/discreteness that dissolves the paradox. *Doesn't claim implications for P realizability based solely on O.*
      *   **Evasive/Hand-Wavy:** Repeats standard math/physics without novelty, makes vague philosophical claims, uses results from one domain as "proof" for claims in another ("Math works, therefore physics must work this way"), hand-waves physical implementation ("obviously we can't do *true* infinity, but...").
      *   **Kill If:** The justification demonstrably fails within its own declared domain (e.g., (M) misapplies calculus; (P) setup clearly cannot perform arbitrarily large finite steps, let alone approach infinity; (O) makes untestable or physically incoherent claims). Or if it *relies* on the forbidden domain slide.
      *   **Human Judgment:** Assessing the strength/novelty of the justification within the declared domain. Does it *actually* engage with the core challenge of that domain?
      *   **Pass to Human:** If the justification seems novel and solid *within its declared domain*, even if the *broader pitch* overreaches. *Flag the overreach for reframing.*

  4.  **Check for "Unfalsifiable Fortress" Construction:**
      *   **Ask:** "If your central claim were wrong within its declared domain (M/P/O), what observable consequence or logical contradiction would follow that *isn't* hand-waved away by redefining terms or shifting domains?"
      *   **Sufficient:** Identifies a falsifiable prediction, a mathematical inconsistency within the proposed framework, or a specific physical outcome that wouldn't occur if the claim were false.
      *   **Evasive/Hand-Wavy:** Relies on untestable assertions, redefines the paradox or infinity to avoid counterexamples ("True infinity is unattainable anyway, so my model is always safe"), shifts blame to measurement limitations without specifics.
      *   **Kill If:** No conceivable counterexample within the declared domain is admitted, or counterexamples are dismissed via illicit domain slides or circular reasoning. *This catches pitches designed to be bulletproof by being vacuous.*

  **Procedure End Points:**
  *   **Kill:** Fails Step 1, 2 (conflation), 3 (failed justification), or 4 (unfalsifiable). *Most bad pitches die at Step 2 or 3.*
  *   **Pause for Human (Reframe Needed):** Passes Step 1 & 2 (clear domain), Step 3 justification is novel/solid *within that domain*, but pitch overreaches (e.g., claims "solves Zeno" broadly). *The story is the domain-specific result, not Zeno.*
  *   **Potentially Commission (Proceed with Caution):** Passes all steps *and* the justification presents strong, novel, domain-specific insight relevant to the *interpretation* of Zeno within that domain. *Extremely rare. Requires expert review later.*

  ---

  **Running the Procedure on Your Pitches:**

  1.  **Trapped Ion "Quantum Zeno Effect":**
      *   **Step 1:** Dichotomy/Completing infinite acts (P). Clear.
      *   **Step 2:** Claims **P** (Physical realizability: frequent measurement prevents change).
      *   **Step 3 (P):** Justification: Experiment *operationalizes* "frequent" measurement, shows suppression. **Hand-Wavy/Problem:** Conflates "very frequent" (finite) with "infinitely frequent" (P core). Does *not* demonstrate performing infinitely many acts. Claims "Zeno was right" implies solving the *philosophical* paradox (P realizability), but only shows a cool *finite* quantum effect.
      *   **Step 4:** A counterexample: True infinite measurement rate is physically undefined/unsustainable. Pitch likely dismisses this by redefining "Zeno effect" to mean just suppression via fast measurement.
      *   **Verdict: Kill at Step 3.** Conflates finite-frequency physics (their experiment) with infinite-act realizability (the paradox). **Alternative Story:** "How Repeatedly Peeking at a Quantum System Stops It Changing: The Quantum Zeno Effect Explained." *Remove Zeno's name entirely.*

  2.  **Nonstandard Analysis (Hyperreals):**
      *   **Step 1:** Dichotomy/Achilles (Completing infinite steps - M & P implication). Target often vague.
      *   **Step 2:** Claims **M** (Mathematical representation). *But* pitch implies **P** ("no such thing as completing infinitely many steps").
      *   **Step 3 (M):** Justification: Offers alternative formalism (hyperreals). **Sufficient?** Mathematically interesting if novelty is shown. **Evasive:** Pitch claims it resolves the paradox by showing completion is impossible – *this is a P or O claim, not M*. Hyperreals don't make completion impossible; they offer a different way to *describe* infinitesimals within a logically consistent M framework. Calculus already resolves the *mathematical* summation.
      *   **Step 4:** Counterexample: Calculus works fine for motion. Pitch might say "but hyperreals show infinitesimals are real, so steps are real, so you can't complete them!" – Illicit slide from M (hyperreal numbers exist in this model) to P (therefore you can't physically complete infinitely many steps). Untestable.
      *   **Verdict: Kill at Step 2/3.** Core illicit slide: Using a novel M framework to make a P claim ("no such thing"). **Alternative Story (if M justification is novel):** "A Weird New Number System That Gives 'Infinitely Small' Its Own Place: Nonstandard Analysis." *Frame as pure math curiosity, explicitly decouple from Zeno's physical paradox.*

  3.  **Instantaneous Velocity as Real Property:**
      *   **Step 1:** The Arrow Paradox (Nature of instants/motion). Clear.
      *   **Step 2:** Claims **O** (Ontology of motion/properties at instants). Clear.
      *   **Step 3 (O):** Justification: Philosophical argument that velocity is intrinsic to a moment, not just a limit. **Sufficient?** If well-argued within philosophy of time/physics, this is a *domain-appropriate* claim. Novelty is key. Doesn't *inherently* claim to solve M or P, just offers a different O perspective affecting how we *interpret* determinism within that O framework.
      *   **Step 4:** Counterexample? Hard to falsify pure metaphysics, but internal consistency can be checked. Pitch should allow debate within O.
      *   **Verdict: Pause for Human (Reframe Needed).** Passes Steps 1-3. Justification is domain-appropriate. **BUT:** Pitch claims "changes how we should talk about determinism" – *this is the story*, not "solving Zeno." The Zeno connection is illustrative, not the core result. **Alternative Story:** "Is Speed Truly a Property of a Single Instant? A Philosopher Challenges Calculus' View of Motion." *Frame as a debate within metaphysics/philosophy of physics.*

  4.  **Lamp Machine (Thomson's Lamp):**
      *   **Step 1:** Dichotomy (Completing infinitely many acts - switching). Clear.
      *   **Step 2:** Claims **P** (Physical realizability of completing infinite switches). *Implied.*
      *   **Step 3 (P):** Justification: Builds a machine that halves step time each round. **Evasive/Hand-Wavy/Fatal:** 1) Cannot *physically* halve intervals ad infinitum (thermal noise, quantum limits, signal propagation). 2) Even conceptually, what is the *state* after "infinite steps"? (On? Off? Undefined? Machine destroyed?). Demonstrates the *logical conundrum* (M) but fails utterly at **P** realizability.
      *   **Step 4:** Counterexample: Machine breaks down before step 100. Pitch likely says "But *in principle*..." – this is a retreat to M, abandoning the **P** claim.
      *   **Verdict: Kill at Step 3.** Physical realizability claim is unsupported and physically impossible. **Alternative Story:** "Building a Machine That Tries (and Fails) to Flip a Switch Infinitely Fast: Exploring the Limits of Logic and Physics." *Frame as a fun engineering/philosophical demonstration of the conceptual problem, explicitly stating physical infinity isn't achieved.*

  ---

  **What the Procedure Can't Do (Failure Modes):**

  1.  **Sophisticated Conflation:** A truly cunning pitch might *appear* to isolate domains while subtly building an argument that links them in a novel, potentially valid way (e.g., a new quantum gravity model making specific O predictions with testable P consequences). The procedure might flag "potential slide" unnecessarily or miss a very subtle one.
  2.  **Bait-and-Switch Novelty:** Pitches where the *actual* interesting work is solid (in M, P, or O) but is obscured by Zeno hype. The procedure passes it for reframing ("Pause for Human"), but you might miss the genuinely interesting core if the Zeno framing is too distracting or poorly explained in the pitch.
  3.  **Expertise-Dependent Novelty:** Judging the *actual* novelty/strength within a domain (Step 3) sometimes requires more than 15 mins or baseline knowledge. You might commission something philosophers find trivial within M or O, even if it passed the triage.
  4.  **The "Technically Correct" Pitch:** A pitch might narrowly pass by being hyper-focused on a tiny, uncontroversial aspect within one domain, making a true but insignificant claim ("Using hyperreals, we model the *first* 10^100 steps of the dichotomy"). Not newsworthy, but the procedure can only flag overreach, not insignificance.
  5.  **Blatant Misrepresentation:** If the pitcher outright lies about their work/results, the procedure won't catch it. It relies on the pitch description being accurate.

  **Key Defense:** This procedure forces *explicitness* and *domain discipline* at the pitch stage. It catches the vast majority of lazy slides and overreaches. When something passes for reframing, you commission the *domain-specific* story, ruthlessly cutting the "solved Zeno!" angle. This drastically reduces philosopher inbox rage. The remaining risk is the cost of occasionally missing deeply novel interdisciplinary work or commissioning minor domain stories – a trade-off for speed and robustness against the common Zeno-pitch failures.
