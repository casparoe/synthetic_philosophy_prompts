prompt: |-
  I've been trying to work out what I actually believe about when it's OK to just take someone's word for something, going purely by my gut on cases, and my verdicts feel like a mess. Here they are.

  1. A stranger at a bus stop says the 14 is running twenty minutes late because of a demonstration up the road. I believe her instantly, no corroboration, and I change my plans.
  2. The same stranger at the same stop tells me the demonstration is about a housing development and that the council took kickbacks. I don't believe a word of it, and I don't feel like I'm being inconsistent — except I can't say why.
  3. My mechanic says the timing belt is about to go and it'll cost me £600. I pay it. He profits directly from my believing him and I have no way of checking.
  4. A used-car salesman makes the identical claim about the identical model of car, and I assume he's lying.
  5. My GP tells me to take a drug. I've read the trial myself and I think the effect size is marginal. I take the drug.
  6. The same GP, on a podcast, says seed cycling fixes hormone problems. I don't believe her and I think slightly less of her.
  7. A whistleblower whose claim will cost him his career and most of his friends: I believe it almost on sight, far more readily than a claim that helps the person making it.
  8. Two historians, both credible, flatly contradict each other about some 18th century episode. I don't suspend judgement. I go with the one whose account fits better with the rest of what I already believe about the period, and I feel fine about that.
  9. Everything I believe about my own life before age four comes from my mother. I believe basically all of it, including details she'd have every reason to embellish and no way to get right.
  10. Someone on a forum asserts a fact about how a certain alloy behaves. I could check it in five minutes, don't bother, and carry on believing it for years.

  The two pairs that break my brain. Mechanic vs. salesman looks like it's about incentives, but case 7 — where incentives run the other way — gets *more* belief from me, not less. So "follow the incentives" can't be the principle. And I defer to my GP against my own reading of the evidence (case 5), while refusing to defer to a financial adviser who knows vastly more about markets than I do, because his incentives are bad. But case 3 says incentives don't decide it either. I want those three to come out the way they feel, and I don't see how.

  My tentative principle, which I think is wrong but can't repair: I only accept testimony in a domain where I've personally audited a sample and it checked out. Trust is earned locally by spot-checking, and it never transfers between domains. Call it the audit rule. The problem is obvious — I can never audit deep history, or other people's memories of my own childhood, or any field I know nothing about, and yet I believe all of those. Related idea I keep reaching for: maybe a domain counts as audited if dissent would reliably have reached me. Nobody has ever contradicted my mother about my childhood, so the absence of contradiction does the work of a check. But I know that's dodgy, because silence usually just means nobody was paying attention, and I don't want a principle that makes gullibility a virtue wherever nobody bothers to object.

  So: one principle, stated precisely, clause by clause, with the case that earns each clause. It should deliver my verdicts above, or tell me straight which ones it's overturning and why — don't rescue all ten at the price of a monster with six epicycles. Then give me its verdict on three cases I haven't listed, and make at least one of them a case that's genuinely hard for your own principle. And be committed. I don't want a menu of positions with pros and cons and a shrug at the end; write down the principle you'd actually sign your name to, say which of my verdicts you're overruling, and say what you'd bet on. If you think one of my verdicts isn't a datum at all but just confusion on my part, say that too and argue for it.
reasoning: |-
  Okay, the user is grappling with when to trust someone's word versus when to be skeptical. They've listed ten scenarios where their intuition says "trust" or "don't trust," but they can't find a consistent principle behind it. They've tried rules like "follow incentives" or "only trust domains you've audited," but those don't fit all cases. For example, they trust a mechanic who profits from their trust but distrust a car salesman with similar incentives. They also trust a whistleblower despite personal costs, which contradicts the incentive rule. 

  The user wants a single, precise principle that explains all their judgments or explicitly overrules some. They don't want a messy compromise—they want clarity and commitment. Their deeper frustration is about epistemic consistency: how to avoid gullibility without sliding into paralyzing doubt. The unresolved pairs (mechanic vs. salesman, GP vs. financial advisor) hint they suspect incentives matter but aren't sufficient. The "audit rule" fails because they trust things they can't possibly verify (e.g., childhood memories). 

  Hmm, their examples reveal subtle patterns:  
  - **Costly signals**: They trust claims where lying would harm the speaker (whistleblower) or where expertise is paired with accountability (mechanic, GP in clinical context).  
  - **Domain contamination**: They distrust the same GP discussing seed cycling because it's outside her expertise, despite trusting her on prescription drugs.  
  - **Coherence**: They side with the historian aligning with established knowledge, showing reliance on explanatory fit.  

  The user's struggle is relatable—everyone uses heuristic trust but rarely examines it. Their request for a "signed" principle suggests they want intellectual rigor, not just pragmatism. The unspoken need might be for a trust framework that feels both defensible and human, allowing them to act without second-guessing every decision.  

  Time to construct a principle that honors their intuitions while fixing the contradictions. The incentive puzzle is key: incentives *do* matter, but only when unopposed. A mechanic profits from repairs but risks reputational damage if dishonest; a car salesman faces no such penalty. The whistleblower's sacrifice is a anti-incentive reinforcing credibility. Likewise, the GP's podcast claim lacks the accountability of her clinical role.  

  The proposed principle should have three layers:  
  1. **Speaker constraints**: Are they incentivized *and* insulated from backlash? (Car salesman: yes; mechanic: no due to reputation.)  
  2. **Claim constraints**: Does the claim align with the speaker's expertise and broader epistemic norms? (GP on drugs: yes; on seed cycling: no.)  
  3. **Listener constraints**: Can the listener reasonably verify or access dissent? (Mom's childhood stories: dissent would likely surface.)  

  Cases 3 and 4 (mechanic vs. salesman) *should* be treated differently under this: mechanics rely on repeat customers; salesmen often don't. Case 5 and 6 (GP) split because expertise is context-dependent. Case 7 (whistleblower) fits perfectly—high cost, no upside. Case 2 (stranger's corruption claim) fails all tests: no expertise, no anti-incentive, no verification path.  

  For overruling: Case 10 (forum alloy claim) is recklessly lazy—no anti-incentive or verification. Case 8 (historians) is fine if coherence is a valid heuristic, but the user should acknowledge it's probabilistic. The hard new case—astrologer vs. astronomer—tests whether *domain* matters more than credentials when both lack direct incentives to lie. The principle correctly prioritizes epistemic norms over charisma.  

  This framework accepts that trust is inherently risky but provides filters to minimize folly. The user might still itch to "audit" everything, but the principle embraces necessary dependence on others—wisely.
answer: |-
  Here's the principle I'd sign my name to, built clause-by-clause from your cases and designed to resolve your contradictions. It overrules two of your verdicts explicitly:

  **The Justified Testimony Acceptance Principle (JTAP):**
  You are justified in accepting a testimonial claim if and **only if**:
  1.  **The speaker is competent:** The speaker possesses relevant, verifiable expertise or direct access to the information *in this domain*; *and*
  2.  **The speaker's incentives are truth-conducive OR the claim is costly:** Either:
      *   (a) The speaker's incentives (reputation, professional ethics, economic self-interest within constraints) are structurally aligned with truth-telling *in this context*; **OR**
      *   (b) Making the claim imposes significant, credible costs on the speaker if it is false (e.g., reputational ruin, career loss, social ostracization); *and*
  3.  **The claim fits established epistemic norms:** The claim is consistent with well-established mechanisms, empirical evidence, or coherent explanatory frameworks *within its domain*, or dissent would be readily visible/auditable *in principle* if the claim were false; *and*
  4.  **The listener lacks superior counter-evidence:** You possess no direct, credible evidence contradicting the claim that outweighs the justification provided by 1-3.

  **Clause Origins & Your Cases:**

  1.  **Competence (Clause 1):** Stranger at bus stop (Case 1 - "14 late") *is* competent for the time/route *because she's present* (direct access). GP (Case 5 - drug) *is* competent via verifiable medical credentials. Historians (Case 8) *are* competent via credentials/publication. Mother (Case 9) *is* competent as direct witness. Mechanic (Case 3) *is* competent via verifiable trade/experience. **Overrules:** Stranger (Case 2 - kickbacks) *lacks* verifiable competence/access. GP on podcast (Case 6 - seed cycling) *lacks* domain competence (nutritional pseudoscience ≠ medicine). Used car salesman (Case 4) *lacks* verifiable competence *in diagnosing mechanical faults*; his role is sales, not independent diagnosis. Forum claim (Case 10) *lacks* demonstrable competence.
  2.  **Incentives/Cost (Clause 2):**
      *   **Truth-Conducive Incentives (2a):** Mechanic (Case 3) - Reputation/repeat business depend on reliability *despite* profit motive; incentives constrained by competition/reputation. GP (Case 5) - Reputation/license depend on evidence-based practice. Mother (Case 9) - Incentive is familial trust/narrative, not typically deception on mundane details.
      *   **Costly Claim (2b):** Whistleblower (Case 7) - Credibility hinges on high cost of lying (career/friends).
      *   **Overrules/Missing:** Used car salesman (Case 4) - Incentives are *purely* short-term sale; reputation constraints are weak (easy to move lots/dealers). Car forum claim (Case 10) - Speaker has no identity/reputation cost. GP on podcast (Case 6) - Incentive is content creation/audience, not constrained by medical norms; no cost for false claim about seed cycling. Stranger (Case 2) - No cost for lying about kickbacks.
  3.  **Fit/Norms/Auditability (Clause 3):** Bus time (Case 1) fits simple causal mechanism (demonstration→delay). Drug (Case 5) fits medical science/norms. Historian (Case 8) - Fits coherence with known period context (your instinct is correct). Mother's stories (Case 9) - Dissent *would likely surface* via other family/witnesses/photos *in principle* over time. **Overrules/Missing:** Kickbacks claim (Case 2) - Lacks mechanism/disseminability; dissent isn't readily auditable for you. Seed cycling (Case 6) - Contradicts established biology/medical norms. Forum claim (Case 10) - Contradicts epistemic norm: easily verifiable claims *should* be verified if relied upon; lack of auditability is a flaw.
  4.  **Lack of Superior Counter-Evidence (Clause 4):** Explicitly allows you to reject testimony *despite* 1-3 if you *have* strong counter-evidence (e.g., your reading of the drug trial in Case 5 - but you *lack* superior evidence *as a non-expert* interpreting the trial vs. GP's expertise/norms).

  **Overruled Verdicts & Why:**

  1.  **Case 10 (Forum Alloy Claim):** You are **NOT** justified. *Why:* Violates Clause 1 (Unknown Competence), Clause 2 (No Truth-Conducive Incentives or Cost), Clause 3 (Contradicts Epistemic Norm: easily verifiable claims should be verified if relied upon long-term; lack of dissent doesn't count as audit here). This is lazy credulity, not justified trust. JTAP demands effort or clear signals for low-stakes-but-verifiable claims.
  2.  **Case 2 (Stranger's Kickback Claim):** Your skepticism is justified, but JTAP makes the reason explicit: *Violates Clause 1 (No Competence), Clause 2 (No Incentive/Cost), Clause 3 (No Fit/Norms/Auditability).* Your gut "inconsistency" with Case 1 is resolved.

  **JTAP Verdicts on Your Cases:**
  *   1: **Accept** (Competent via access, Incentives neutral but claim simple/fit, No counter-evidence)
  *   2: **Reject** (Violates C1, C2, C3)
  *   3: **Accept** (Competent, Incentives truth-conducive via reputation constraint, Fit norms, No counter-evidence)
  *   4: **Reject** (Lacks Competence for diagnosis, Incentives *not* truth-conducive (pure sale), Fit unknown but irrelevant due to C1/C2 failure)
  *   5: **Accept** (Competent, Incentives truth-conducive, Claim fits norms, Your counter-evidence is inferior as non-expert)
  *   6: **Reject** (Lacks Competence *in this domain*, Incentives not truth-conducive (content/audience), Claim contradicts norms)
  *   7: **Accept** (Assumed Competent via insider status, Claim Costly (C2b), Fit/Norms depend on specifics but C2b heavily weights)
  *   8: **Accept (provisionally)** (Both Competent, Incentives likely truth-conducive (academic reputation), Claim fits coherence (C3) – this is valid historical reasoning)
  *   9: **Accept** (Competent (witness), Incentives truth-conducive (familial trust/narrative), Dissent auditable *in principle* (C3), No counter-evidence)
  *   10: **Reject** (Violates C1, C2, C3 - See Overruled above)

  **New Cases & JTAP Verdicts:**

  1.  **The Charismatic Cult Leader:** Claims to have received divine revelation that the world ends next Tuesday. He has devoted followers who’ve given him their savings. (Hard Case)
      *   **JTAP Verdict: REJECT.**
      *   *Why:* C1: "Divine revelation" is not verifiable competence. C2a: His incentives are *not* truth-conducive; his power/wealth depend on belief, not truth. C2b: Making the claim *gains* him followers/wealth; cost only materializes *after* falsification (too late). C3: Contradicts all established scientific/epistemic norms. C4: Overwhelming counter-evidence (cosmology, history of failed prophecies).

  2.  **The Veteran Astrophysicist:** At a reputable conference, presents complex, novel data analysis suggesting a subtle anomaly in a well-established physical constant. Her career is stellar, and this claim could damage her reputation if wrong.
      *   **JTAP Verdict: PROVISIONALLY ACCEPT (as a claim meriting serious attention).**
      *   *Why:* C1: High, verifiable competence. C2a: Truth-conducive incentives (academic reputation depends on rigor). C2b: Significant potential cost if wrong. C3: Presented within established epistemic norms (peer-reviewed forum, methodology open to scrutiny). C4: No immediate superior counter-evidence (novel claim).

  3.  **The Anonymous Leaker (Wikileaks-style):** Dumps a massive trove of documents alleging corporate espionage. The leaker's identity and motives are completely unknown. The documents *appear* authentic and detailed.
      *   **JTAP Verdict: PROVISIONALLY ACCEPT CONTENT *IF* INDEPENDENTLY VERIFIABLE/AUTHENTICATED, REJECT UNVERIFIABLE CLAIMS.**
      *   *Why:* C1: Unknown competence (can't verify access). C2a: Unknown incentives. C2b: *Potential* high cost (if caught), but unverified. **C3 is KEY:** The justification hinges entirely on Clause 3. Verifiable facts within the documents (dates, names, technical details) can be audited against public records or by journalists. Coherent narratives explaining known events add weight. Unverifiable assertions or interpretations lack justification. C4: Apparent authenticity provides initial, weak support pending audit. JTAP demands focusing belief *only* on what passes the audit (C3), not the leaker's word.

  **Commitment:** I bet on JTAP because it explicitly handles your core contradictions (Mechanic/Salesman, GP/Adviser, Whistleblower) by differentiating *types* of incentives and emphasizing *contextual competence* and *epistemic norms*. It avoids gullibility by requiring auditability *in principle* or fit with norms (C3), while allowing trust where necessary (history, childhood). It overrules Case 10 correctly – uncorroborated, easily-checkable forum claims are unjustified laziness. It handles the hard cases above: rejecting the cult leader despite charisma/cost (due to C1/C3 failure), trusting the astrophysicist provisionally via C1/C2/C3, and demanding evidence, not trust, for the anonymous leaker via C3. This is the principle guiding my own acceptance of testimony.
