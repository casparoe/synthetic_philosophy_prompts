answer: |-
  Your hypothesis is perceptive and largely correct: **the core impasse stems from incompatible constructions of the reference class for "successful theories," compounded by divergent conceptions of "truth," "approximate truth," and the epistemic attitude being advocated.** This isn't a single disagreement about induction but a multi-layered conceptual tangle masquerading as one. Let's dissect it using the arguments themselves:

  1.  **The Reference Class Problem is Foundational:**
      *   **Anti-realist (Pessimistic Meta-Induction - PMI) Construction:** The reference class is "theories that were once deemed empirically successful (explained/predicted observable phenomena reasonably well) and were accepted by the scientific community." Caloric, phlogiston, ether, etc., clearly belong. The base rate of falsification within *this* class is high. Therefore, current successful theories likely belong here.
      *   **Realist Construction:** The reference class is "theories that achieved *genuinely robust, novel, and especially quantitatively precise predictive success*." They argue PMI's list is inflated:
          *   **Success Threshold:** Did caloric/phlogiston *really* achieve the same level of precise, novel, diverse predictive success as Maxwell's electrodynamics or general relativity? Realists say no; these were often qualitative, limited, or failed key novel tests quickly. Only theories passing this higher bar count.
          *   **Unit of Analysis:** What "turned out false"? Is it the *entire* theory, or just its *non-structural/core theoretical claims*? The realist argues that while the *specific ontology* of the ether was discarded, the *mathematical structure* of Maxwell's equations (describing EM fields/waves) survived intact within QED and relativity. The "successful part" (the structure) *was* retained. Theories like Newtonian mechanics are "false" as universal theories of space/time/gravity but "approximately true" (structurally and predictively) within their well-defined domain (low speeds, weak gravity).
      *   **The Result:** They *are* arguing over different datasets. The PMI relies on a broader, historically contextual definition of "successful/accepted" and counts the whole theory as falsified. Realists use a stricter, retrospective definition of "robustly successful" and often parse the theory, counting only the abandonment of specific ontologies while retaining structure.

  2.  **The "Truth" and "Approximate Truth" Problem:**
      *   **Anti-realist Challenge:** "Approximate truth" is ill-defined. What does it *mean* for a whole theory with complex, interconnected claims (about unobservables!) to be "approximately true"? If Newtonian mechanics is "approximately true" in its domain, but its core concepts (absolute space/time, gravitational force as primary) are fundamentally false within the framework of GR, is "approximate truth" doing any real work beyond describing empirical adequacy within limits? Realists haven't provided a *precise, non-question-begging account* of approximate truth that justifies inferring truth-like properties for *unobservables* from empirical success.
      *   **Realist Response (& Its Hole):** Realists often point to *structural continuity* (equations, mathematical relationships) across theory change as evidence that we are "latching onto" something real, even if our interpretations change. They might appeal to "verisimilitude" (truthlikeness), though formal accounts are fraught. Their argument *requires* that approximate truth *explains* the success – but the anti-realist counters that empirical adequacy alone explains success just as well, without committing to truth. The realist lacks a *knock-down* definition of approximate truth that *compels* the anti-realist to accept it as the *only* explanation for the *degree* and *nature* of the success.

  3.  **The Epistemic Attitude Ambiguity:**
      *   **Realist Advocacy:** Often uses "believe to be true" or "believe to be approximately true." This implies a commitment to the theory correctly describing (at least structurally) the mind-independent world, including unobservables.
      *   **Anti-realist Advocacy:** Often advocates "acceptance for predictive purposes," "instrumental reliability," or "working as if true." This withholds commitment to the theory describing unobservable reality, focusing solely on its utility for organizing observations and making predictions.
      *   **The Clash:** When the realist says "we should believe our best theories," the anti-realist hears an unwarranted ontological commitment. When the anti-realist says "success doesn't imply truth," the realist hears a refusal to acknowledge the *best explanation* for that success. They are often recommending different stances under the umbrella term "attitude towards theories."

  **Diagnosis:** The dispute is **primarily a tangle of the first two points:** **incompatible reference classes** for the induction and **incompatible conceptions of what "truth" (especially "approximate truth") means for a scientific theory and how it relates to empirical success.** The attitude question often follows from these prior commitments. The "exchange restarts in the same place" because each side rejects the other's foundational premises about what counts as data (reference class) and what the data *means* (truth/explanation). They talk past each other, each seeing their position as the obvious interpretation of the "same" evidence.

  **What Would Count as Progress?**

  Given this diagnosis, progress is difficult but not impossible. It would involve:

  1.  **A Neutral Criterion for the Reference Class (Most Promising but Hardest):** Agreeing *in advance* on objective, operational criteria for "successful enough to count" in the PMI base rate. This would require defining:
      *   **Success Metrics:** Specific thresholds for novel, quantitative, diverse predictive success (e.g., predicting phenomena of a *new kind* within X% accuracy, confirmed by Y independent experiments). This aims to filter out "merely accepted" or qualitatively successful theories.
      *   **Temporal Cutoff:** Defining "past" (e.g., pre-1900? pre-quantum mechanics?) to avoid including theories still undergoing refinement.
      *   **Unit of Falsification:** Explicitly defining what constitutes "falsification" of a theory in the base rate. Is it the rejection of its core ontology? The replacement of its fundamental equations? The demonstration of empirical inadequacy in a domain it claimed to cover? This is crucial to address structural realism.
      *   **Challenge:** Getting both sides to accept criteria that don't already presuppose their conclusion. Realists will want high thresholds that exclude most PMI examples; anti-realists will resist criteria so stringent they only include theories we currently believe. Genuinely neutral criteria may be elusive.

  2.  **A Formal Account of Approximate Truth that Does the Work:**
      *   Developing a rigorous, non-trivial, and widely accepted formal semantics for "approximate truth" or "verisimilitude" applicable to complex scientific theories. This account must:
          *   Explain why empirical success (especially novel, precise prediction) is a reliable indicator of it.
          *   Be consistent with the historical record of theory change (e.g., showing Newtonian mechanics has high verisimilitude in domain D, despite being "false" universally).
          *   Justify ontological commitment to unobservables beyond just the structure.
      *   **Challenge:** Decades of work on verisimilitude have produced interesting models but no consensus solution immune to technical problems or accusations of being either too weak or too strong. Connecting it firmly to *success* as evidence remains elusive.

  3.  **A Change of Question / Clarification of Stakes:**
      *   **Shift Focus:** Move from "Are our theories true?" to "What specific *cognitive commitments* does the incredible instrumental reliability of science warrant, and *towards which parts* of our theories?" This forces specificity about attitude and ontology.
      *   **Domain Specificity:** Acknowledge that the answer might depend on the scientific domain (fundamental physics vs. condensed matter physics vs. evolutionary biology) and the maturity of the theory.
      *   **Functional Explanation:** Focus on identifying *why* certain parts of past theories survived (mathematical structure, domain-specific causal models) and why others (specific ontologies) were discarded, and what *function* belief plays in scientific practice.
      *   **Challenge:** May feel like conceding the original question or turning to sociology/history over philosophy. Doesn't provide a universal answer.

  4.  **Accepting Stalemate (The "Nothing at All" Option):**
      *   **Reasons:** The premises (reference class, meaning of truth/approximate truth, epistemic goals) are too fundamentally divergent and tied to broader philosophical commitments (metaphysics, epistemology). The evidence is inherently ambiguous and can be coherently interpreted either way depending on these prior commitments. The question "Should we believe our best scientific theories are (approximately) true?" might be ill-posed because "approximately true" lacks a sufficiently precise, agreed-upon meaning in this context, and "believe" is too vague.
      *   **Implications:** It would imply the debate is unresolvable *on purely empirical or logical grounds*. Progress would then consist in clearly mapping the conceptual landscape, showing *why* the disagreement persists, and perhaps focusing on more tractable questions within specific scientific contexts or regarding specific components of theories (e.g., realism about entities vs. laws vs. structure). It shifts the goal from "winning" the argument to understanding its intractability.

  **Conclusion:**

  Your hypothesis is astute. The realism/anti-realism debate is **primarily stalled by incompatible constructions of the historical data set (reference class) and fundamentally different conceptions of what "truth" or "approximate truth" means for a scientific theory.** Progress is most likely through either: **(1)** A monumental effort to establish genuinely neutral, operational criteria for the PMI reference class *and* falsification, though success is uncertain; or **(2)** A significant breakthrough in defining "approximate truth" in a way that demonstrably explains empirical success and survives theory change. Failing these, acknowledging the deep-seated conceptual divergences and potentially reframing the question or accepting a stalemate might be the most intellectually honest outcome. The debate persists not because one side is obviously wrong, but because it probes the limits of how we connect evidence from our senses to claims about the fundamental nature of a reality we cannot directly observe.
