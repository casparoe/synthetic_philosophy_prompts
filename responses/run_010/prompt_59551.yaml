  The user also asks about progress. If the core issue is defining the reference class, then agreeing on criteria could help. But is that feasible? Realists emphasize novel predictions, while anti-realists look at eventual falsification. Finding neutral ground seems tough. Approximate truth is another sticking point—realists need a clear definition, but it's elusive. Maybe formal accounts like truthlikeness could help, but they have their flaws.

  The user’s deeper need might be understanding if the debate is resolvable or if it's a linguistic tangle. They might be frustrated with the circularity and seek clarity on whether to continue engaging with the literature. If the problem is terminological, then reframing the question could be progress. Alternatively, accepting the debate as intractable might lead them to focus on other areas.

