answer: |-
  ### Diagnostic Tree for Peer Disagreement

  #### **Nodes**  
  The tree uses eight binary questions to diagnose positions on peer disagreement. Each question is phrased neutrally to avoid theory-laden language. Answers commit respondents to core tenets of specific views, as noted below.  

  1. **Same Evidence?**  
     *Question:* "In this disagreement, have both parties seen exactly the same evidence?"  
     *Distinction:* Tracks symmetric (same evidence) vs. asymmetric (different evidence) disagreements.  
     *Commitments:* Yes → mandates symmetric handling (e.g., conciliationism); No → opens asymmetric options (e.g., total-evidence view).  

  2. **Independent Assessment?**  
     *Question:* "Can you assess the other’s reliability using reasons unrelated to the disputed issue?"  
     *Distinction:* Tests for independent defeaters (e.g., biases) vs. entanglement.  
     *Commitments:* Yes → allows steadfastness (e.g., right-reasons); No → forces conciliation if no external grounds.  

  3. **Reasoning Condition?**  
     *Question:* "If you learn you were fatigued/distracted during reasoning (with no new first-order evidence), should you reduce confidence?"  
     *Distinction:* Probes whether cognitive states are intrinsic defeaters.  
     *Commitments:* Yes → internalist conciliationism; No → externalist evidentialism.  

  4. **Permissible Confidence?**  
     *Question:* "Can identical evidence justify different confidence levels in the same claim without irrationality?"  
     *Distinction:* Separates permissivism (multiple rational responses) from uniqueness (one rational response).  
     *Commitments:* Yes → permissivism; No → uniqueness, often demanding conciliation.  

  5. **Meta-Symmetry Conciliation?**  
     *Question:* "In a disagreement about disagreement (with equal evidence), should both parties reduce confidence?"  
     *Distinction:* Checks if meta-disagreements require conciliation.  
     *Commitments:* Yes → meta-conciliation (risking skepticism); No → meta-steadfastness.  

  6. **Meta-Dependence?**  
     *Question:* "Is the correct view of disagreement settled by empirical evidence about reasoning, or by abstract principles?"  
     *Distinction:* Contrasts evidence-dependent (revisable) vs. principle-based (a priori) meta-views.  
     *Commitments:* Evidence-dependent → revisable; Principle-based → fixed, risking incoherence if conciliated.  

  7. **Equal Weight?**  
     *Question:* "In symmetric peer disagreement, must you split the difference in confidence?"  
     *Distinction:* Identifies equal-weight conciliationism vs. alternatives.  
     *Commitments:* Yes → equal-weight view; No → rejects it (steadfastness or other conciliation).  

  8. **Post-Conciliation Steadfast?**  
     *Question:* "After conciliating, can you ever return to your original confidence?"  
     *Distinction:* Tests permanence of conciliation.  
     *Commitments:* Yes → partial/temporary conciliation; No → total conciliationism.  

  #### **The Space**  
  The tree has 8 binary nodes, yielding 256 possible combinations. Constraints arise from logical dependencies:  
  - **Constrained combinations (incoherent)**:  
    - If **Same Evidence?=No**, **Equal Weight?=Yes** is incoherent (equal weight requires symmetry).  
    - If **Permissible Confidence?=No** (uniqueness), **Post-Conciliation Steadfast?=Yes** is incoherent unless **Independent Assessment?=Yes** (uniqueness + symmetry implies error, so steadfastness requires independent reasons).  
    - If **Meta-Symmetry Conciliation?=Yes** and **Meta-Dependence?=Principle-based**, **Post-Conciliation Steadfast?=Yes** is incoherent (principle-based conciliation at meta-level permanently undermines principles).  
  - **Unfilled combinations (coherent but rare/unattractive)**: E.g., **Permissible Confidence?=Yes** + **Equal Weight?=Yes** (permissivism usually rejects mechanical splitting).  
  - **Freely variable**: Most cells are coherent and fillable, e.g., **Reasoning Condition?=Yes** is compatible with steadfastness if **Independent Assessment?=Yes**.  

  #### **Leaves**  
  Named positions mapped to answer combinations, with core commitments:  
  - **Equal-weight view** (e.g., Elga): Requires Same Evidence?=Yes + Equal Weight?=Yes. *Least abandonable: Symmetric peers must split the difference.*  
  - **Right-reasons steadfastness** (e.g., Kelly): Requires Independent Assessment?=Yes + Equal Weight?=No + Post-Conciliation Steadfast?=Yes. *Least abandonable: Independent reasons justify maintaining confidence.*  
  - **Total-evidence view** (e.g., Feldman): Requires Same Evidence?=Yes + Permissible Confidence?=No + Equal Weight?=No. *Least abandonable: Disagreement is new evidence incorporated into total evidence.*  
  - **Permissivism** (e.g., Schoenfield): Requires Permissible Confidence?=Yes. *Least abandonable: Evidence can rationally support multiple credences.*  
  - **Total conciliationism** (e.g., Christensen): Requires Reasoning Condition?=Yes + Equal Weight?=Yes + Post-Conciliation Steadfast?=No. *Least abandonable: Peer disagreement always mandates permanent confidence reduction.*  
  - **Partial conciliationism** (e.g., Lackey): Requires Reasoning Condition?=Yes + Equal Weight?=No + Post-Conciliation Steadfast?=No. *Least abandonable: Non-evidential defeaters require conciliation, but not necessarily splitting.*  
  - **Skepticism** (meta-result): Triggered by Meta-Symmetry Conciliation?=Yes + Meta-Dependence?=Principle-based. *Least abandonable: Meta-conciliation undermines all stable principles.*  
  - **Meta-steadfastness** (e.g., Enoch): Requires Meta-Symmetry Conciliation?=No. *Least abandonable: Meta-views can be held steadfastly despite disagreement.*  

  #### **Empty Cells**  
  - **Incoherent (≈15% of space)**: As above (e.g., **Same Evidence?=No** + **Equal Weight?=Yes**). Diagnosed as logical contradictions.  
  - **Coherent but unattractive (≈20%)**: E.g., **Permissible Confidence?=No** + **Reasoning Condition?=No** (uniqueness but ignoring cognitive states) → practically unstable; or **Meta-Symmetry Conciliation?=Yes** + **Meta-Dependence?=Evidence-dependent** → revisable but risks regress.  
  - **Unexplored (≈10%)**: E.g., **Same Evidence?=No** + **Reasoning Condition?=Yes** + **Permissible Confidence?=Yes** → asymmetric permissivism with internal defeaters; no major theory occupies this.  

  #### **Unseparable Pairs**  
  The tree cannot distinguish:  
  - **Right-reasons steadfastness** and **partial conciliationism** when **Independent Assessment?=Yes** + **Reasoning Condition?=Yes** + **Post-Conciliation Steadfast?=No**. Both endorse defeaters but disagree on permanence; the tree lacks a node on defeater strength.  
  - **Permissivism** and **total-evidence view** in asymmetric cases (**Same Evidence?=No**). Both handle asymmetry similarly; the tree’s nodes prioritize symmetric cases.  
  - **Skepticism** and **total conciliationism** at the meta-level if **Meta-Symmetry Conciliation?=Yes**. Skepticism terminates the tree, while total conciliationism is a leaf; the tree cannot further differentiate meta-commitments.  

  ---

  ### Tree Applied to Cases  
  **Case 1: Graders on Argument Validity**  
  - Two equally skilled graders; same evidence (student essay).  
  - **Path**: Same Evidence?=Yes → Independent Assessment?=No (no external grounds) → Reasoning Condition?=Yes (fatigue matters) → Permissible Confidence?=No → Meta-Symmetry?=Yes → Meta-Dependence?=Principle-based → Equal Weight?=Yes → Post-Conciliation?=No.  
  - **Output**: Total conciliationism. *Limitation*: Matches Case 3 (below).  

  **Case 2: Researchers on Drug Efficacy**  
  - Asymmetric evidence: One read a trial report the other missed.  
  - **Path**: Same Evidence?=No → Independent Assessment?=Yes (e.g., knows co-author’s bias) → Reasoning Condition?=No (only evidence matters) → [Permissible Confidence? skipped due to asymmetry] → Meta-Symmetry?=No → Equal Weight?=No (asymmetric) → Post-Conciliation?=Yes.  
  - **Output**: Right-reasons steadfastness (asymmetric version).  

  **Case 3: Meta-Disagreement on Halving Confidence**  
  - You and equally informed colleague disagree on whether to halve confidence in your disagreement-accounts.  
  - **Path**: Same Evidence?=Yes → Independent Assessment?=No → Reasoning Condition?=Yes → Permissible Confidence?=No → Meta-Symmetry?=Yes → Meta-Dependence?=Principle-based → Equal Weight?=Yes → Post-Conciliation?=No.  
  - **Output**: Total conciliationism (same as Case 1).  
  - **Limitation**: The tree cannot distinguish first-order symmetric disagreements (Case 1) from meta-disagreements (Case 3) due to identical answer paths. Adjusting nodes to avoid this would violate the "no adjustment" rule.  

  ---

  ### Tree Summary  
  - **Strengths**: Isolates commitments via cases (e.g., fatigue, asymmetry), handles meta-disagreements explicitly.  
  - **Limitations**: Struggles with asymmetry/permissivism interactions and meta/first-order indistinguishability. Refinement could add nodes on defeater strength or higher-order evidence.
