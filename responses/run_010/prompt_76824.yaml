prompt: |-
  I write about science and ideas for a general-interest mag and I've got a piece brewing on opera that I can't get straight in my head. Not a review — more like, what does the institution think it's doing.

  Here's what's bugging me. Walk into basically any major house today and the opera is being sung in Italian or German or Czech or whatever, with the words projected above the stage or on a little screen on the back of the seat in front of you. That surtitling setup only really took off in the 1980s and became standard in the 90s, but now it's just assumed. And the titles are heavily compressed: lines get cut or flattened so they fit on one line, the syntax gets ironed out, and an operator punches a button at a mark in the score to make each one appear. Meanwhile the notes are treated as sacrosanct. Nobody would dare add a bar, re-orchestrate a passage, or let a tenor drop in a showier aria from a different opera, and if a conductor takes a tempo the composer didn't indicate there will be letters. Same with the language: original text, always. But then a director moves the whole thing into a 1970s airport lounge with the cast in business suits, and that's fine, that's just "a production." One big London company — the English National Opera — built it's entire identity on the opposite rule, everything sung in English so you don't need titles at all, and it's treated as the eccentric exception.

  So what theory of what an opera is does the mainstream bundle actually presuppose? Which rival accounts does it quietly rule out — opera as drama that has to be understood, opera as a vehicle for voices, opera as a text? Are the parts even consistent with each other, or is one of them free-floating? And how much of this is philosophically underdetermined, where several very different accounts of the work would license the exact same stage practice?

  I've been reading Bernard Williams on opera, and my rough takeaway is that he treats opera as drama rather than a concert with costumes, but I'm shaky on him. Don't give me a bibliography or a reading list, I couldn't use it — just reason from the practice. And finish by telling me what would concretely have to change on stage and in the auditorium if a house actually committed to the drama-first view instead of the sound-surface-first one.
reasoning: |-
  Okay, let's tackle this user's query. They're writing a piece about opera for a general-interest magazine, focusing on what the institution thinks it's doing. The main confusion is the inconsistency in how operas are presented: original language with surtitles, sacrosanct music, but radical directorial choices. They mention the English National Opera as an exception. Their questions revolve around the underlying theory of opera that mainstream practices assume, which rival accounts are excluded, and the consistency of these parts. They also want to know what would change if a house committed to a drama-first approach.

  First, I need to unpack the implicit theories in current practices. The user points out that music and language are treated as fixed, but staging is flexible. Surtitles compress the libretto for readability, which suggests that understanding the text is secondary to hearing the original language. The music's sanctity indicates that the work is seen as a musical artifact first. Meanwhile, updating the setting without altering music or text implies that the drama's context is adaptable.

  The user is contrasting this with drama-first approaches, like ENO's English performances. They reference Bernard Williams, who views opera as drama. So, the core tension is between opera as a musical work versus a dramatic experience. The user wants to know which aspects are prioritized and which are sidelined in mainstream practice.

  Looking deeper, the institution's practices seem to prioritize the auditory experience—original language and exact music—over textual clarity and dramatic immediacy. Surtitles are a compromise: they allow original language but make the text accessible, though simplified. This suggests that the authentic sound is non-negotiable, while visual elements are mutable. The director's freedom in staging might be seen as enhancing relevance without altering the "work" itself.

  The user might also be hinting at philosophical inconsistencies. If the music is untouchable because it's the composer's intent, why isn't the libretto given the same respect in performance (via translation)? Or why is staging allowed to change? The answer might lie in different layers of the work: music as core, text as secondary, staging as tertiary. But this hierarchy isn't explicitly stated.

  For the drama-first approach, changes would include performing in the audience's language without surtitles, allowing textual adjustments for clarity, possibly adapting music to serve the drama (like cuts or re-orchestration), and ensuring staging supports the narrative without anachronisms that distract. The conductor's role would align with dramatic pacing. This contrasts with the current norm where musical fidelity often overrides dramatic flow.

  The user's unspoken need might be to highlight the contradictions in opera's presentation to provoke readers to rethink its purpose. They want concrete examples of how a drama-first approach would look, making the piece engaging by showing tangible differences rather than abstract theory. They might also be questioning whether current practices serve the art form's survival or alienate modern audiences by prioritizing tradition over accessibility.
answer: |-
  You've nailed the central tension: modern opera houses operate on a messy, often contradictory bundle of assumptions. Let's dissect the implied "theory of opera" baked into standard practice and what a true drama-first commitment would demand:

  **The Mainstream Bundle: An Unstable Hybrid Theory**

  1.  **The Work-as-Sound-Object is Primary:** The music (notes, orchestration, vocal lines) is treated as the inviolable core of the "work." This stems from 19th-century Romantic notions of the composer-as-genius and the score-as-sacred-text. Tempo debates are fights over *interpretation* of this fixed object, not its alteration.
  2.  **Original Language as Authentic Vessel:** The specific phonetics, rhythms, and cultural texture of the original libretto are seen as intrinsically linked to the music (composed *for those words*). Singing in translation is viewed as distorting this sonic integrity, even if it sacrifices comprehension.
  3.  **Comprehension is Secondary & Mediated:** The audience *should* understand the plot and basic emotions, but this is an afterthought, handled by the clunky prosthesis of surtitles. The titles are concessions to practicality, not core elements. Compression and flat syntax are tolerated because the *real* experience is the sound.
  4.  **Staging as Detachable Concept:** The visual/dramatic realization is considered interpretive "window dressing." Updating the setting or costumes (to an airport lounge, etc.) doesn't touch the "work itself" (the sound-object). It's merely a director's "take," permissible as long as it doesn't *musically* alter the score. This allows novelty and "relevance" without challenging musical purism.
  5.  **Voice as Supreme Instrument:** While tied to the score, the primary *live* draw is the virtuosity and beauty of the human voice executing that score. The drama serves the vocal display as much as, or more than, the reverse (hence the tradition of applauding arias mid-scene).

  **What This Bundle Rules Out (Quietly):**

  *   **Opera as Integrated Drama:** The idea that music, text, *and* staging are co-equal, interdependent elements that *together* constitute the dramatic work. The mainstream elevates music, tolerates mediated text, and treats staging as disposable.
  *   **Opera as Primarily Communicative/Theatrical Event:** The notion that the *immediate*, *unmediated* communication of the drama to the audience in real-time is paramount. Surtitles are a massive barrier to this.
  *   **The Libretto as Living Text:** Treating the words as dramatic text demanding immediacy and clarity in performance, potentially justifying translation or textual adaptation *for performative impact*.
  *   **Radical Musical Fidelity to Dramatic Intent:** If a composer's dramatic intent *demanded* a cut, a tempo shift beyond traditional interpretation, or even (gasp) re-orchestration for modern acoustics/voices to serve the *drama*, the mainstream bundle would likely reject it as violating the sound-object.
  *   **The ENO Model as Legitimate Standard:** Treating singing in the audience's language as the *default*, optimal way to present drama, rather than a quirky exception.

  **Is it Consistent? Mostly Not:**

  The core inconsistency is between **Sound-Surface Fidelity** (1 & 2) and **Dramatic Accessibility** (3). Surtitles are a kludge that papers over this crack. The elevation of the Voice (5) often actively *works against* dramatic integrity (e.g., casting for sound over acting, applause mid-scene). The free pass for Regietheater (4) exists precisely *because* it doesn't touch the sacrosanct elements (1 & 2), reinforcing their primacy while creating a visual dissonance the audience must mentally reconcile. The bundle holds together through *compartmentalization* and *tradition*, not philosophical coherence.

  **Philosophical Underdetermination:**

  The *exact same stage practice* (original language, surtitles, strict musical fidelity, radical staging) *could* be justified by very different theories:
  *   **Sound-Fetishist:** "Only the original sonic artifact matters; titles are a necessary evil for the plebs, staging is irrelevant noise."
  *   **Authenticity-Purist:** "We honor the composer's *entire* conception (music *and* original language text); titles preserve authenticity while aiding access, staging explores new perspectives *on* the fixed work."
  *   **Pragmatic Traditionalist:** "This is just how it's done; it works well enough, keeps the donors happy, and avoids fights over cuts or translations."
  The practice is radically *overdetermined* by history and institutional inertia, not philosophically *underdetermined*.

  **What Would a Drama-First Commitment Look Like? (Concrete Changes):**

  Forget Williams for a moment; imagine a house truly prioritizing the *dramatic experience* as the primary work. Here's the revolution:

  1.  **Language:** **Perform in the audience's language.** Full stop. No surtitles. The goal: immediate, unmediated comprehension of every word *as it's sung*, integrated with the music *in the moment*. Translation becomes a high art focused on singability, dramatic punch, and poetic integrity *within the musical phrase*. (This is the biggest, most visible shift).
  2.  **Textual Fidelity (Reversed):** **The *meaning* and *dramatic impact* of the libretto become sacrosanct, not the specific words.** If a line is archaic, obscure, or doesn't land dramatically *in the target language*, adapt it. Prioritize clarity and immediacy over literal translation. Syntax serves the drama, not compression for a screen.
  3.  **Musical Fidelity (Re-contextualized):** **The score serves the drama, not vice-versa.** This could mean:
      *   **Cuts:** Ruthlessly excising repetitive sections, outdated conventions (e.g., some *da capo* arias if the repetition kills momentum), or subplots that drag down the central drama.
      *   **Tempi:** Conductors drive pacing based on dramatic tension, not abstract musical ideals or tradition. A recitative might be blisteringly fast for urgency, or painfully slow for weight.
      *   **Re-orchestration (Controversial but possible):** Selectively adjusting balances or even textures if the original obscures crucial text or dramatic moments for modern ears in a specific hall. (This is the hardest pill for traditionalists to swallow).
      *   **Vocal Priorities:** Casting prioritizes actors who sing convincingly over voices that are beautiful but dramatically inert. "Park and bark" becomes unacceptable.
  4.  **Staging Integration:** **The production concept isn't a "take," it's the essential vessel.** Sets, costumes, and direction aren't detachable "interpretations" but fundamental components of the dramatic work *as presented*. Concept must serve the core drama, not obscure it for novelty's sake. Anachronism must be justified by deepening understanding, not just visual shock. The stage picture actively *tells the story* in tandem with the music and words.
  5.  **Audience Experience:** **No more looking up/down.** The audience engages directly with the performers and the *entire* stage picture. Applause holds until act breaks or final bows to maintain dramatic flow. The house might feel more like intense theatre than a concert hall. The experience aims for visceral, immediate emotional and intellectual engagement with the *story being told now*.

  **In essence:** The mainstream bundle preserves a **museum piece** – a sonic artifact displayed with helpful labels and occasionally re-framed. A drama-first commitment creates a **living theatrical event** where every element conspires to communicate a powerful story *right now, to this audience*. The friction you feel is the clash between these fundamentally different concepts of what opera *is for*. Your piece exposes this beautifully.
