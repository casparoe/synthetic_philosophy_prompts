  - Person-affecting (comparative harm): The child who is born is not worse off than she would have been if Lee had chosen Gamma (because then she would not have existed at all). Since her life is worth living, she is not harmed. There is no other person who is harmed (the alternative child does not exist and is not deprived of anything). Therefore, the act is not wrong according to the comparative harm account.
  - Impersonal: The outcome (a child with a disability) is worse than the alternative (a child without the disability) because it has lower total well-being. The fact that the child is different is irrelevant to the impersonal view. Therefore, the act is wrong.

  The single feature of Case B that is doing the work: The identity of the child depends on the choice (because the conception event is tied to the treatment choice).

  Intervention:
  - If we vary it so that the burdened individual is worse off than she would have been (e.g., if in Case B, the same child would have been born regardless, then it becomes like Case A and the person-affecting view condemns it). The case collapses into an ordinary harm case.
  - If we add a harmed third party (e.g., if the treatment Delta also causes harm to an existing person), then the person-affecting view condemns the act because of the harm to the third party. The nonidentity aspect becomes irrelevant, and it collapses into an ordinary wrong.

  Strategies for the person-affecting view to avoid the permissive verdict in Case B:

  1. **Non-comparative harm**: Hold that causing a person to exist with a serious burden is a harm to that person, regardless of whether she is worse off. Then, in Case B, the act is wrong because it harms the child. In Case A, the act is also wrong (for the same reason and additionally because of comparative harm). The cost: This account might imply that it is wrong to create any child who has a burden, even if the alternative is not creating any child. This could lead to the conclusion that we should not have children at all if we expect them to have any serious burden, which might be counterintuitive. Also, it abandons the comparative baseline.

  2. **Principle of procreative beneficence**: We have a moral reason to choose the option that leads to the child with the best chance of the best life. This principle focuses on the quality of the child's life and would condemn choosing Delta in Case B. However, this principle is impersonal. If a person-affecting theorist adopts it, they are supplementing their view with an impersonal principle. The cost: It might require creating the best possible child even if it doesn't harm anyone. This could lead to demanding obligations in reproductive choices. In Case A, this principle would also condemn choosing Beta because it leads to a child with a disability when a child without was possible. So the verdict in Case A remains condemned (now for two reasons). But note: in Case A, the principle might not apply in the same way because we are not creating a child but affecting an existing one.

     Alternatively, we can call it a "harm" to the child in Case B by defining harm relative to a standard set by the possible children? That's not standard.

     Better to stick to non-comparative or impersonal.

  Honest verdict on the exercise: The pair successfully isolates the identity variable and shows that the divergence in verdicts between the person-affecting and impersonal views arises solely from the comparative baseline used by the person-affecting view. The identity shift in Case B does not change the moral assessment for the impersonal view but does for the person-affecting view because it removes the possibility of making someone worse off. The cases are sufficiently matched, and the discrepancy in the stage (pregnant vs. pre-conception) is minor and does not undermine the point. Thus, the exercise achieves its goal.
