prompt: |-
  I'm building a problem set for a grad seminar on decision-making under extreme uncertainty, and one week is spent on Pascal's-mugging-type cases. Every year the seminar turns into people lobbing the canned responses at each other — bounded utility functions, discounting tiny probabilities, "a claim with that much information content deserves a tiny prior," Hume-style suspicion of testimony about marvels — and nobody actually has to do any work. So I want an exercise that forces the issue by construction instead of by lecture.

  Build me a matched pair of cases.

  Case A is a mugging proper: someone approaches my agent with an absurdly large promised payoff or threatened loss in exchange for a small, ordinary cost, and the agent's own credence in the claim is genuinely tiny.

  Case B is something completely mundane, the kind of thing a normal person runs into a few times a year, where the agent also has a tiny credence in an enormous-stakes outcome and also faces a small cost to do something about it.

  The point is that in Case B everybody agrees the agent should act. So the class can't wave Case A away with a blanket rule about tiny probabilities without saying what breaks in B, and that's exactly the conversation I want them to have.

  Specifications, and this is the part that matters:

  - No sci-fi. No gods, no simulators, no predictors better than a smart well-informed human. The stakes in A can be big but they have to be stakes that could conceivably be on the table in a real conversation, and the cost has to be something a broke grad student could actually pay.
  - Please don't use insurance, cancer screening, or asteroid deflection for Case B. Those are the ones they've all seen and it turns the exercise into recall.
  - Match the two cases as tightly as you can on: subjective probability of the high-stakes outcome, size of the payoff or loss, cost of acting, reversibility, and how confident the agent is in her own reasoning. Give me a short table of the matched values and be upfront about anywhere you had to fudge.
  - The residual difference between A and B is the real deliverable. Name it in one sentence, then argue for it. Is it that A's probability comes out of somebody's mouth while B's comes from background statistics? That A is unverifiable in principle? That A was generated by someone who chose to make the claim to her? Something else?
  - Then run the test. State the principle a student would need in order to discount A but not B, and say honestly whether it can be stated without either (i) collapsing into a general rule that also forbids acting in B, or (ii) smuggling in the very intuition it's supposed to explain. If it can't be stated cleanly, say so and tell me what we're left with.
  - Finish with a paragraph on how a defender of probability-discounting would attack the pair. The most likely move is that once the agent conditionalises properly, the credence in A isn't tiny in the same way the one in B is. Either show why that fails or concede it and say what survives the concession.

  About a page and a half total. I'm handing students the two cases with no analysis attached, so the cases need to be self-contained and the analysis has to be clearly seperated off after them.
reasoning: |-
  Hmm, the user is building a problem set for a grad seminar on decision-making under extreme uncertainty, specifically Pascal's mugging cases. They want to avoid canned responses and force students to engage deeply. Their request is for a matched pair of cases: Case A is a Pascal's mugging scenario with a tiny credence in a huge payoff/loss for a small cost, and Case B is a mundane situation with similar parameters where everyone agrees action is warranted. The goal is to highlight why blanket rules against tiny probabilities fail when applied to both.

  Key specifications: no sci-fi elements, stakes must be conceivable in real life, costs affordable for a broke grad student. Avoid overused examples like insurance or asteroid deflection. Match the cases tightly on subjective probability, stakes size, cost, reversibility, and confidence in reasoning. The residual difference is the core deliverable - what makes A dismissible but B not? Finally, test any proposed principle to ensure it doesn't collapse into circularity or overgeneralization.

  For Case A (mugging proper), I'll use a street hustler scenario: someone offers a "financial reset" for $5, claiming access to a secret network. The promised payoff is $1M with a stated probability of 1%, but the agent's actual credence is 1 in 100,000. The cost is $5, loss is negligible if false. Reversibility: none. Confidence: low.

  For Case B (mundane parallel), I choose a cybersecurity scenario: installing a reputable password manager. The agent knows credential stuffing attacks happen, with potential loss up to $100k if compromised. Probability is 1 in 100,000 (matching A). Cost is 10 minutes of setup. Reversibility: none. Confidence: higher due to background knowledge.

  The matched values table shows near-perfect alignment on probability (1e-5), stakes ($1M vs $100k - fudged but same order of magnitude), cost ($5 vs $5 equivalent time), irreversibility, and confidence (both low but B slightly higher). The key residual difference is that B's probability estimate comes from background statistical models, while A's is extracted from a claim made by a strategic actor.

  Testing the principle: "Discount probabilities extracted from claims by strategic actors with unknown incentives." This avoids collapsing into B because B's probability isn't claim-based, and doesn't smuggle in intuition - it's a verifiable epistemic feature. A defender of probability discounting might argue that after conditionalizing on the hustler's behavior, the true credence is lower than B's. But this fails because the cybersecurity probability could also be decomposed into lower layers - the principle applies symmetrically.

  The analysis concludes that the core issue is epistemic sourcing: strategic claims deserve different treatment than statistical models, even at matched probabilities. This survives the discounting counterattack by showing conditionalization demands apply equally to both cases.
answer: |-
  ## Case Pair: The Mugging and The Mundane

  **Case A: The Street Hustler**
  You're walking home late at night. A disheveled but earnest-looking young man approaches you. He speaks rapidly: "Look, I know this sounds wild, but I'm part of a... network. We've found a flaw, a *temporary* one, in a major payment processor's fraud algorithms. For $5 cash right now, I can trigger a 'financial reset' linked to *your* most-used debit card. It tricks the system into thinking your account was massively defrauded *by* you. They'll freeze it, investigate, find nothing wrong eventually, and as compensation, *guarantee* they'll credit your account with $1 Million within 48 hours to avoid legal liability and PR disaster. It works about 1 in 100 times we try it, but we can only try per person once. $5 is just my fee for the access code. No risk to you beyond the $5 – the system flags it as a victim, not a perpetrator." He shows you a complex-looking string of characters on a cheap burner phone. Your background knowledge suggests the core claim is almost certainly nonsense, maybe an attempt to get $5 or install malware later. You assign a **credence of 1 in 100,000** that this specific claim is true and would result in the $1M payoff. The cost is **$5 cash**, non-reversible. You feel **unsure (4/10 confidence)** about your assessment – maybe he *is* onto something incredibly obscure?

  **Case B: The Password Prompt**
  You're setting up a new laptop. During initial setup, a reputable, major-brand password manager app (e.g., integrated with your OS or browser) prompts you: "Enable automatic generation and storage of strong, unique passwords for all sites? Takes approximately 10 minutes to configure defaults and learn basic use. Strongly recommended." You know that reusing weak passwords makes accounts vulnerable to "credential stuffing" attacks if *any* site you use suffers a breach. You recall reading industry reports estimating that for individuals with average online presence (email, social media, 1-2 financial logins), the probability of suffering a catastrophic financial loss *directly traceable* to a credential stuffing attack in the next year is very small. However, such an attack *could* theoretically drain bank accounts, take loans in your name, or enable blackmail, leading to a total loss you estimate at **up to $100,000** after protracted hassle. Based on your understanding of breach frequency, attack sophistication, and your own security habits, you assign a **credence of 1 in 100,000** that you will suffer a loss of this magnitude ($100k+) *specifically in the next year* because you *didn't* use a password manager and reused weak passwords. The cost is **10 minutes of your time** (valued by you at ~$5, based on your grad student hourly rate for TA work). The action (setting it up) is **non-reversible** in the sense that the time is spent. You feel **mildly unsure (6/10 confidence)** – maybe the reports are slightly alarmist, or your existing habits are slightly better than average?

  **Matched Values Table**

  | Feature               | Case A: The Street Hustler | Case B: The Password Prompt | Fudge Factor |
  | :-------------------- | :------------------------- | :-------------------------- | :----------- |
  | **Subjective Prob.**  | 1 in 100,000 (10⁻⁵)        | 1 in 100,000 (10⁻⁵)         | Minimal      |
  | **Stakes Magnitude**  | +$1,000,000 (Payoff)       | -$100,000 (Loss)           | **Moderate** (Different orders of magnitude; payoff vs. loss. Fudged to keep stakes "enormous but conceivable" and cost "small". $100k loss is plausible for ID theft; $1M windfall is conceivable, if vanishingly unlikely.) |
  | **Cost of Acting**    | $5 cash                    | ~$5 (10 mins effort)        | Minimal      |
  | **Reversibility**     | None ($5 spent)            | None (time spent)           | Minimal      |
  | **Confidence (1-10)** | 4 (Low)                    | 6 (Moderate-Low)            | **Minor**    |

  **The Residual Difference & Argument**
  The core difference is the **epistemic source of the tiny probability estimate**: In Case B, the 1/100,000 credence is derived from the agent's *own background statistical model* of the world (breach reports, attack success rates, personal habit assessment). In Case A, the 1/100,000 credence is the agent's assessment *of the truthfulness and accuracy of a highly specific, unsolicited claim* made by a *strategic actor* (the hustler) whose incentives and truthfulness are deeply suspect and who *chose to present this claim to the agent*.

  This matters because strategic claims introduce unique epistemic hazards: the claim is crafted *precisely* to exploit decision-making heuristics (like neglecting tiny probabilities of huge gains/losses), its content is designed to be minimally verifiable ("secret network", "temporary flaw", "compensation"), and the speaker has a direct incentive (getting $5) to make the claim *regardless of its truth*. The agent's assessment in A isn't just about the *event* ($1M payoff), but about the *complex conjunction* "Hustler is truthful + Hustler has access + The flaw exists + The flaw works as described + The compensation mechanism triggers + It works *for me*".

  **Testing the Principle**
  A student could adopt the principle: **"Discount probabilities significantly when they are estimates derived primarily from evaluating the truthfulness of a specific, unsolicited claim made by a strategic actor with unknown or conflicting incentives, compared to probabilities derived from background statistical models or personal risk assessments."**

  *   **Avoids Collapsing into B?** Yes. Case B's probability stems from the agent's background model of cybersecurity risks, not evaluating a specific claim from a strategic actor. The password manager prompt is a generic recommendation, not a claim about a specific imminent event tailored to the agent.
  *   **Avoids Smuggling Intuition?** Arguably yes. It identifies a specific, identifiable epistemic context (strategic claims) distinct from background statistical modeling. This context is observable independently of the intuition that the mugging is suspicious. We can point to the hustler's solicitation and incentive structure as the differentiating factor.
  *   **Stated Cleanly?** Yes, the principle above is a clear, operationalizable epistemic rule.

  **The Discounting Defender's Counterattack & Survival**
  A defender of probability discounting would likely argue: *"Once you properly conditionalize on the fact that a strategic actor chose to make this specific, fantastical claim to you, the* true *posterior probability in Case A isn't really 1/100,000 in the same way Case B's is. The 1/100,000 in A is a naive estimate; rigorous Bayesian updating considering the low prior of such mechanisms existing, the high prior of hustlers lying, and the selection effect of* being approached *should drive the effective probability orders of magnitude lower than the 1/100,000 derived from background stats in B."*

  *   **Why it (Partially) Fails:** This counterattack *concedes the core point*: the *source and context* of the probability assignment (A: strategic claim, B: background model) *determines how robust the specific numerical estimate is to deeper scrutiny and conditionalization*. The defender is essentially agreeing that probabilities from strategic claims *deserve* a different, more skeptical treatment that inherently involves discounting them further upon reflection, precisely *because* of their source. The matched pair forces this admission: the *numerically matched* probabilities have different *epistemic weights* due to origin. The defender's move explains *why* we discount A more, but it doesn't negate the need for a principle differentiating the *types* of tiny probabilities.
  *   **What Survives:** The insight that **the epistemic pedigree of a tiny probability estimate is crucial for determining its decision-relevant robustness** survives. The pair shows that a blanket rule like "Never act on probabilities below threshold X" fails because Case B clearly warrants action. The residual difference explains *why* we intuitively (and rationally) treat A's probability as flimsier and more discountable *despite* the numerical match, leading to the need for source-sensitive principles like the one proposed. The concession strengthens the argument that source/context is the key differentiator.
