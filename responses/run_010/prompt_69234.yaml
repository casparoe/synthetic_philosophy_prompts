  For structure: open with warmth, briefly explain her work's core in plain language (Pareto = no wasted joy, weights = "who counts more"), then use the pie anecdote to demo intensity weighting. The joke must land equally—maybe cast Uncle as an "impartial observer" deciding pie distribution? Academic half will chuckle at the framing; family knows the reference. 

