answer: |-
  Here’s a toast that threads the needle—accurate for the experts, clear for the family, warm for everyone, with a payoff joke and an affectionate close:

  ---

  **(Clink glass gently)**  
  Everyone? If I could have your attention. Auntie, Uncle, cousins, colleagues, friends… we all know why we’re here. To celebrate an extraordinary woman who spent forty-odd years doing… well, *what* exactly?  

  Family calls it “math about fairness.” Academics nod wisely about social welfare functions and axiomatic bargaining. But here’s the thing about Auntie’s work: she was always the voice saying, *“Hold on. What’s hiding behind the equations?”*  

  Imagine this room wants to decide… oh, I don’t know… **dessert**. *(Hold up dessert menu or gesture towards it)*. Auntie’s foundational insight was like proving a universal rule: *Any group choice that doesn’t waste happiness must look like adding up everyone’s personal dessert-happiness scores.* But! And this is her big "But!"...  

  **Here’s the catch:** Your personal dessert-happiness score isn’t fixed like inches or pounds. It’s stretchy! *(Gesture hands stretching apart)*. Getting the triple-chocolate cake might send *your* happiness soaring +100 points, while it only gives *me* +10. Or maybe I’m lactose intolerant, so it’s -50 for me! The math doesn’t pin down *how much* my +10 counts compared to your +100. **That scale is wide open.**  

  So, getting to the famous "equal weights" – where everyone’s happiness counts the same in the total – isn’t something the math *proves*. It comes from stepping outside yourself. Imagining you could be *anyone* in the room, equally likely. **It’s fairness smuggled in wearing a philosopher’s hat.** She never let anyone pretend the equations did *that* heavy lifting.  

  **And here’s the joke that bridges the room:**  
  *(Turn to cousins)*. Remember those legendary battles over the last slice of pie at home? Well, under Auntie’s math, it was perfectly justified! If Cousin A *(point)* was practically *levitating* with desire for that pie, while Cousin B *(point)* was only mildly interested… well then, according to the pure math, giving it to A might actually create more *total* pie-happiness! Efficiency!  
  *(Pause for academic chuckles)*.  
  **BUT!** *(Raise finger, Auntie-style)*. That math **never said** that outcome was *fair*! It just said it wasn’t wasting potential happiness. Whether it was *right* to let the intensely-pie-hungry cousin win every time? That depended entirely on whether Mom and Dad decided, as impartial observers, that everyone’s *fundamental* stake in pie happiness should count equally… or not!  
  *(Wink at cousins/Uncle. Family laughs at the memory, academics laugh at the accurate application)*.  

  She also shot down anyone using this math to automatically argue for equality. Because once you fix those scales? Adding up the scores cares *only* about the total. A world where one person has a mountain of cake and everyone else gets crumbs could score the same as a world where everyone gets a fair slice… *if* that one cake-lover’s joy was intense enough on their scale! The math alone is utterly neutral about who gets what. **The fairness comes from the choice of scales, not the sum.**  

  That’s Auntie’s legacy. Not just brilliant math, but **relentless clarity** about where the math stops and the morals begin. She taught her students, her co-authors, her field – and yes, even her pie-fighting kids – to see the hidden step. The crucial choice. The moment where humanity steps into the equation.  

  **So let’s raise our glasses:**  
  To Auntie. Thank you for teaching us all to look deeper, to question the hidden assumptions, and to never let a fancy theorem dress up a moral choice as a mathematical inevitability. Thank you for forty-odd years of making us think harder about fairness. But most of all… thank you for the love, the debates around the dinner table, the unwavering support, and yes, even for adjudicating the Great Pie Wars with the wisdom of an economist and the heart of a mom. You are irreplaceable. We love you. To Auntie!  

  ---

  **Why it works:**

  1.  **Accuracy:** Nails her key points:
      *   The sum form is derived (Pareto conditions).
      *   Indeterminacy of individual scales (affine transformations).
      *   Equal weights come *only* from the impartial observer/veil of ignorance *assumption* ("fairness smuggled in").
      *   The sum is distribution-blind once weights are fixed.
      *   Distinguishes efficiency (no waste) from fairness (equal fundamental weighting).
  2.  **Clarity for Family:**
      *   Uses concrete, relatable examples (dessert, pie).
      *   Explains "stretchy scores" simply.
      *   Uses "scales" as a consistent, understandable metaphor for weights/affine transformations.
      *   Cashes out "Pareto" as "no wasted happiness."
      *   Cashes out "impartial observer" as "stepping outside yourself," "imagining being anyone equally likely."
  3.  **The Joke:**
      *   **Basis:** The theorem *does* allow someone who wants something more intensely to count for more in the sum. The impartial observer assumption is needed to *override* this and impose equal fundamental weight.
      *   **Execution:** Uses the family's specific pie story. Academics laugh because it's a perfect, accurate illustration of intensity vs. equal weight. Family laughs because it's a shared, funny memory.
      *   **Punchline:** The "BUT!" mirrors her emphasis, and clarifies the moral choice point ("depended entirely on whether Mom and Dad decided...").
  4.  **Affectionate Close:** Shifts focus entirely to her as a person - her clarity, her teaching, her impact, and her role in the family. Ends on love, not theory.
  5.  **Tone:** Warm, respectful, slightly playful where appropriate (the pie joke), sincere in the close. Matches a celebratory toast.

  This toast honors her intellectual contribution precisely as she saw it, makes it accessible, lands a unifying laugh, and ends with the warmth she deserves. Enjoy the celebration!
