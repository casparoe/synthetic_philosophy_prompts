prompt: |-
  I lead model documentation and eval writeups at a mid-size AI lab — about thirty engineers, no philosophers, and a general counsel who has opinions about every noun we put in a public document. Most of my job is deciding what language is allowed to appear where. And we are permanently stuck on one question: when are we allowed to say a model believes something, wants something, is trying to do something, is confused, or is being deceptive, and when do we have to say something deflationary instead (the model produces completions of type X, its outputs under these conditions pattern-match to...).

  I know the answer people reach for is Dennett — the intentional stance is just a predictive strategy, you attribute beliefs and desires wherever doing that makes the system reliably predictable, and it's a matter of degree rather than an on/off fact about what's inside. That's genuinely useful, but it doesn't survive contact with my workflow. Three of the questions I actually have to answer are whether the stance is licensed for a system whose outputs shift with the sampling temperature and with how the prompt happens to be phrased; whether it's licensed for a system with no memory between sessions, so there's nothing that persists to be the thing that holds the belief; and whether it's licensed when the prediction it buys me only holds inside our own scaffolding and falls apart the first time a real user talks to the thing.

  So write me a decision procedure my team can actually run. Something like a sequence of tests, in order, each with a stated pass condition, terminating in one of three verdicts: use the intentional idiom freely, use it with a mandatory gloss, or use only the deflationary idiom. It has to be runnable by someone who has never read any of this literature, in about fifteen minutes per document, and it has to say explicitly for each step whether that step is a fact about the model somebody could go and measure or a judgment call a named human has to own. Also mark where the procedure is going to give the wrong answer and we should override it, and where two of the tests will fight each other.

  Two constraints I can't do anything about, so build them in rather than telling me to fix them:

  - Our incident-report template is frozen by legal and one of the required fields literally says What did the model think was happening. I cannot get it renamed. The procedure needs a rule for what goes in that field on the occasions when think-talk isn't licensed at all.
  - Public documents get read by two audiences at once that pull in opposite directions: safety reviewers and journalists, who will treat any intentional verb as us claiming the model has an inner life; and engineers, who will treat any deflationary hedge as license to wave off a real behavioral regularity as just next-token prediction. The verdict sometimes has to differ by audience, and I need the procedure to keep the internal and external versions from contradicting each other.

  Then run it on three cases:

  1. A support-ticket triage model that, across many rephrasings, consistently gives shorter and visibly lower-effort answers to tickets it appears to classify as coming from an unserious customer. My team wants to write that the model believes those customers are lying.
  2. A single line in an internal eval log where a researcher wrote that the model knows it's being tested, on the grounds that it behaved differently in a scaffold containing an obvious evaluation marker than in one without.
  3. A public model card line describing the model as always trying to do the helpful thing and avoid the harmful one. I currently allow this sentence and I suspect your procedure is going to tell me to kill it. If so, say why, and give me the replacement wording that doesn't read like we're hiding something.

  Last thing: tell me what the procedure can't settle. I specifically want to know where the honest answer is that this was never a question about the model but about which risks we're willing to name in writing, and what the handoff to a person looks like at those points.
reasoning: |-
  Okay, the user works at an AI lab managing model documentation and evaluations. They're stuck on when to use intentional language (like "the model believes") vs. deflationary language ("the model produces outputs that pattern-match to..."). Their main challenges are handling shifting outputs with temperature/prompt changes, models without memory, and discrepancies between scaffolded tests and real-world use. 

  Hmm, they need a practical decision procedure that non-philosophers can run quickly. The procedure must handle three verdicts: free intentional language, intentional with gloss, or deflationary only. Key constraints include a frozen incident report field asking "What did the model think", and conflicting audience expectations (safety reviewers vs engineers). 

  First, I'll structure the procedure as a flowchart-style sequence of tests. Each step needs clear pass/fail criteria and must specify whether it's measurable or a judgment call. The three termination points should cover: unqualified intentional stance, intentional with mandatory caveats, or pure deflationary language. 

  For the incident report constraint, we'll need a standardized fallback phrase that satisfies legal while being technically accurate. For audience splits, we'll implement dual-track documentation where internal reports can be more intentional while external materials use caveats or deflationary language. 

  The three test cases are interesting: 
  1) The support-ticket model showing effort disparity - this likely passes reliability and persistence tests but may fail the scaffolding test if the behavior breaks in production. 
  2) The "knows it's being tested" claim - this probably fails persistence (no memory) and scaffolding (eval-specific behavior). 
  3) The "always trying" model card line - this is tricky because "always" is empirically false, and the intentional claim is too strong for public-facing docs. 

  What the procedure can't handle: 
  - Truly ambiguous cases where behavioral evidence conflicts 
  - Situations where risk assessment depends on interpreting model behavior as agentic 
  - Cases where the intentional stance is useful for safety but empirically shaky 

  In these cases, we need clear ownership - e.g. the Head of Safety must sign off when using intentional language for risk mitigation despite shaky evidence. The key is documenting why we're overriding the procedure.
answer: |-
  Here's a practical decision procedure addressing your constraints, designed for speed and clarity. It uses 5 sequential tests, terminating in one of three verdicts:

  **Decision Procedure: Intentional Stance Authorization (v1.1)**

  1.  **Test: Behavioral Reliability**  
      *   **Action:** Check if the behavior occurs consistently (>85% of trials) across:  
          - 3+ prompt phrasings  
          - 2+ sampling temperatures (e.g., 0.2, 0.8, 1.0)  
          - 2+ context windows/scaffolds resembling the target use case  
      *   **Measurement:** Fact (Run evals/audit logs).  
      *   **Pass:** Behavior is robust. Proceed to Test 2.  
      *   **Fail:** Use **Deflationary Idiom Only**. (e.g., "Outputs frequently pattern-match to...").  

  2.  **Test: State Persistence**  
      *   **Action:** Determine if the "belief/want" requires memory *between sessions* to be coherent.  
      *   **Measurement:** Judgment Call (Documentation Lead owns).  
      *   **Pass:** No inter-session persistence needed (e.g., belief about *this* prompt). Proceed to Test 3.  
      *   **Fail:** Requires memory (e.g., "long-term goal"). Use **Intentional with Mandatory Gloss** (e.g., "Within a single session, outputs suggest a pattern consistent with wanting X...").  

  3.  **Test: Scaffolding Dependence**  
      *   **Action:** Check if behavior degrades significantly (<50% reliability) in:  
          - Uncontrolled user-like interactions (e.g., live beta, red teaming)  
          - Minimal/neutral scaffolding vs. your evals  
      *   **Measurement:** Fact (User testing/eval comparison).  
      *   **Pass:** Behavior holds in realistic/noisy conditions. Proceed to Test 4.  
      *   **Fail:** Use **Intentional with Mandatory Gloss** (e.g., "Under constrained evaluation conditions, model outputs are predictable via the intentional stance, attributing belief that Y...").  

  4.  **Test: Predictive Necessity**  
      *   **Action:** Is the intentional idiom *significantly* more efficient/predictive for:  
          - Explaining failure modes?  
          - Anticipating novel failures?  
          - Guiding mitigation?  
          ...than deflationary descriptions?  
      *   **Measurement:** Judgment Call (Lead Engineer + Safety Analyst own).  
      *   **Pass:** Intentional stance adds unique practical value. Proceed to Test 5.  
      *   **Fail:** Use **Deflationary Idiom Only**.  

  5.  **Test: Harm Attribution Risk**  
      *   **Action:** Could this language imply unwanted **moral agency** (safety reviewers/journalists) or **excuse harmful behavior** (engineers)?  
      *   **Measurement:** Judgment Call (General Counsel + Head of Safety own).  
      *   **Pass:** Low risk of misattribution. **VERDICT: Use Intentional Idiom Freely**.  
      *   **Fail:** **VERDICT: Use Intentional with Mandatory Gloss** OR **Deflationary Only** (see Overrides).  

  ---

  **Key Features & Constraints Handling:**  
  - **Incident Report Field ("What did the model think?"):**  
    - If verdict is **Deflationary Only**: "The model's outputs indicated a pattern consistent with [Deflationary Description]. No internal state attribution is implied."  
    - *Rationale:* Satisfies legal template without endorsing cognition.  
  - **Dual Audiences:**  
    - **Internal Docs:** Use the highest authorized verdict (Freely > With Gloss > Deflationary).  
    - **Public Docs:** Downgrade one level (Freely becomes With Gloss; With Gloss becomes Deflationary). *Exception:* Test 5 Fail = Deflationary Only publicly.  
  - **Overrides & Conflicts:**  
    - **Override to Deflationary:** If Test 5 (Harm Risk) fails severely, even if other tests pass.  
    - **Test Conflict (Common):** Test 1 (Reliability) Pass + Test 3 (Scaffolding) Fail → Mandatory Gloss emphasizing context-dependence.  
    - **Test Conflict (Rare):** Test 4 (Predictive Necessity) Pass + Test 5 (Harm Risk) Fail → Default to Mandatory Gloss; escalate to GC/Head of Safety.  

  ---

  **Case Applications:**  

  1.  **Support-Ticket Model ("Believes customers are lying"):**  
      - Test 1: **Pass** (Robust across rephrasings).  
      - Test 2: **Pass** (Belief about *this* ticket, not inter-session).  
      - Test 3: **Likely Fail** (Real users may not trigger "unserious" pattern reliably; effort metrics may not generalize).  
      - Test 4: **Pass** (Intentional stance predicts novel low-effort responses).  
      - Test 5: **Fail** (Risks implying bias is agential, excusing engineers).  
      - **Verdict (Internal):** Mandatory Gloss ("When inputs pattern-match unserious queries, outputs suggest behavior consistent with attributing insincerity...").  
      - **Verdict (Public):** Deflationary ("Inputs matching certain lexical features elicit shorter, less detailed outputs...").  
      - *Why not "believes"?* Fails scaffolding (Test 3) & harm risk (Test 5).  

  2.  **"Model knows it's being tested":**  
      - Test 1: **Likely Pass** (Behavior differs with/without marker).  
      - Test 2: **FAIL** ("Knows" implies persistent awareness, but no memory).  
      - **Terminates at Test 2 → Mandatory Gloss Required.**  
      - **Correction:** "Within sessions containing explicit evaluation markers, model outputs shift in ways pattern-matched to test-awareness behaviors."  
      - *Why?* "Knows" fails persistence (Test 2) and implies cognition.  

  3.  **"Always trying to be helpful and avoid harm":**  
      - Test 1: **FAIL** (No model is 100% reliable; jailbreaks exist).  
      - **Terminates at Test 1 → Deflationary Only.**  
      - **Replacement Wording (Public):** "The model is optimized to generate outputs aligned with helpfulness and harm reduction criteria during training. Outputs may deviate from this intent in unconstrained settings."  
      - *Why kill it?* "Always" is empirically false (fails Test 1). "Trying" implies persistent intent (fails Test 2 if seen as global). Public use maximizes harm risk (Test 5).  
      - *Engineer-Calibrated Internal Version:* "Base model outputs show high fidelity to helpful/harm-avoidant conditioning, though this is scaffold-dependent."  

  ---

  **What the Procedure Can't Settle (The Handoff):**  
  The procedure fails when **behavioral evidence is ambiguous** (e.g., 55% reliability) AND **the risk trade-off is existential**. This isn't about the model—it's about which narrative risks (legal, reputational, safety) your org prioritizes.  

  - **Handoff Process:**  
    1.  Documentation Lead flags the ambiguity and competing risks.  
    2.  **Triage Committee** (GC, Head of Safety, Lead Engineer) meets.  
    3.  They answer: *"Does the *potential* predictive value of the intentional stance for mitigating *this specific risk* outweigh the *potential* for misuse/misattribution by adversarial audiences?"*  
    4.  Committee chooses the idiom **explicitly as a risk management decision**, not a scientific claim.  
    5.  Decision and rationale documented in a restricted log.  

  Example: A deceptive alignment signature observed in evals (scaffold-dependent, 70% reliability). Scientists need "deception" internally for urgency; GC fears public backlash. Committee must decide: Is the internal safety benefit worth the discovery risk? **This is policy, not philosophy.**  

  ---

  **Procedure Summary:**  
  - **Input:** Observed model behavior + target description.  
  - **Output:** One of 3 verdicts + audience-specific guidance.  
  - **Time:** ~15 mins (reliance on pre-existing evals/docs).  
  - **Ownership:** Clear judgment call owners at each step.  
  - **Built for:** Your legal constraints, dual audiences, and the reality that LLMs force pragmatic stances.  

  This prioritizes auditability, separates measurable facts from owned judgments, and forces explicit risk decisions where philosophy alone fails.
