prompt: |-
  For four years I have covered moral psychology and the history of reform for a magazine's ideas desk, and I am now drafting a long piece about the expanding circle — the claim that the shape of moral history is the widening of the set of beings whose interests count. My editor wants the piece to have a spine, and the spine would have to be a criterion: when does a change count as moral progress, as opposed to mere drift, or to a lucky accident that will reverse itself the moment conditions shift? I have discovered that I cannot state such a criterion, although I turn out to have firm verdicts, case by case. I would like help extracting a principle from those verdicts, and being told which of them I should give up.

  The cases, roughly in the order I encountered them.

  1. Judicial torture disappearing from European legal practice across the eighteenth and nineteenth centuries: progress, and the cleanest case I own.
  2. The franchise extended to women: progress.
  3. Executions moved out of the public square and behind prison walls — not fewer of them at first, sometimes more, but no longer a spectacle: not progress, and arguably a deterioration. A cruelty nobody witnesses is a cruelty nobody is moved to stop.
  4. Slaughter moved out of the town square and into windowless sheds, and then, a century on, infiltrated by investigators whose footage produced enforceable confinement standards: progress. I hold this even though the concealment is identical in kind to case 3, and even though the reform came from reputational cost rather than from anyone's change of heart. Cases 3 and 4 are the pair I cannot reconcile; they differ in almost nothing that my own language picks out, and I judge them in opposite directions.
  5. Debtors' prison abolished and replaced by a penal apparatus that incarcerates far more people for far longer: I want to call the first progress and the second neither progress nor regress but a separate ledger, though I cannot explain how two ledgers can be kept by the same institutions on the same ground.
  6. A society that widened its circle toward a persecuted minority and then contracted violently within a single generation: I say the widening was real progress while it lasted, and the contraction a genuine loss rather than the revelation that there had never been anything to lose. I notice this commits me against any durability requirement, which I nonetheless keep reaching for.
  7. A nation that now tends its own wounded and veterans with a thoroughness unimaginable a century ago, while describing the enemy it is fighting in terms that would have been considered inflammatory in that same century: I refuse to call this progress, and I equally refuse to call it a wash. The two changes do not seem to me commensurable. Yet in case 4 I weighed suffering against suffering without hesitation.
  8. Norms of speech inside institutions changed largely by the public shaming of named individuals: the outcome is progress; the mechanism makes me queasy. I do not know whether that queasiness has any theoretical standing or is only temperament dressed up as judgment.
  9. Giving redirected toward strangers on other continents: progress. The same impulse redirected toward people who will not be born for ten thousand years, in a way that reduces what is spent on the living poor: not progress. I cannot state what separates the two beyond my own impatience with the second.

  Underneath several of these sits a distinction I have half-invented and would like pressure-tested: expansion by conviction, in which a society comes to see a group as counting, and expansion by price, in which a group's interests begin to be weighed only because harming it has become expensive — legally, reputationally, commercially. My instinct says only the first is moral progress and the second is a coincidence that reverses when the price changes. Case 4 looks like pure expansion by price, and I still want to call it progress.

  The tentative principle I have been carrying around, which I expect you to break: a change counts as moral progress only if it (a) gives weight to interests that were previously given none, (b) survives at least one serious stress test rather than holding only in comfortable conditions, and (c) is produced by a mechanism that the newly included would themselves endorse if they understood it.

  What I want back is not a survey of the field and not a reading list; I can assemble either myself. I want one principle, or at most two or three candidates, stated precisely enough that I could apply it to a case I have never seen. For each candidate: which of my nine verdicts it delivers and which it contradicts; which clause of it is motivated by which case; what it says about three further cases of your own choosing; and where it is weakest. Then tell me plainly which verdicts I must abandon if I want the simplest principle that is not obviously false, and which I may keep if I am willing to pay for them in complexity. Give cases 3 and 4 particular attention: I want to know whether any principled line separates them, or whether one of those two verdicts is a prejudice I caught from covering the wrong beats.
reasoning: |-
  Hmm, the user is a seasoned journalist who's covered moral psychology and reform history. They're struggling to define a criterion for moral progress that can serve as the "spine" for their article about the expanding moral circle. They've got nine specific cases where they have strong intuitions about what constitutes progress (or not), but they can't extract a consistent principle from these judgments. Two cases in particular—#3 (private executions) and #4 (hidden slaughterhouses with later regulation)—seem logically identical in structure but receive opposite verdicts, which troubles them.

  The core tension appears between what they call "expansion by conviction" (genuine moral recognition) versus "expansion by price" (pragmatic cost-avoidance). They instinctively value the former but recognize case #4 as clearly the latter—yet still deem it progress. Their proposed principle (requiring new weight given to interests, durability, and endorsement by the affected) seems designed to exclude "expansion by price" but fails because it would also exclude case #4 which they want to keep.

  I notice three recurring themes in their dilemmas:
  - Visibility vs concealment of suffering (cases 3 & 4)
  - Motivational purity vs outcomes (cases 4 & 8)
  - Temporal/geographic scope of concern (case 9)

  Their struggle with durability requirements (case 6) and incommensurability (case 7) suggests they need a principle that accommodates partial progress and moral trade-offs. The journalist is clearly intellectually honest—they flag their own inconsistencies and "temperament dressed as judgment" (case 8). What they need isn't more literature but a functional tool to systematize their intuitions.

  I should construct a principle that:
  1) Separates progress from its mechanisms (solving the case 4 paradox)
  2) Accommodates reversibility without denying progress occurred (case 6)
  3) Allows for asymmetric valuation of suffering reduction (explaining case 3 vs 4)
  4) Doesn't require motivational purity
  The "reduction in avertable suffering" framework seems promising—it's outcome-based, measurable, and avoids moralizing about motivations. For case 3, private executions reduce visibility (which could increase suffering long-term by removing social checks) while in case 4, slaughterhouse regulations reduce actual suffering despite originating from reputational concerns. This explains the different verdicts without hypocrisy.

  I'll need to show explicitly how this principle handles all nine cases, especially the troublesome pair. The endorsement clause from their draft principle might be preserved as a secondary criterion for "robust" progress, but shouldn't be mandatory—that resolves their unease about case 8's shaming mechanisms while still validating the outcome. For case 9, the distinction between effective vs ineffective altruism emerges naturally: helping distant strangers demonstrably reduces suffering, while speculative future-helping does not.

  The sacrifice will be letting go of their intuitive distinction between "expansion by conviction" and "expansion by price" as the core marker of progress. But that's precisely the growth edge their piece needs—to argue that moral progress sometimes wears the disguise of self-interest.
answer: |-
  Here is a principled criterion for moral progress, refined through your cases and designed to resolve your core tensions. It prioritizes **outcomes over motivations** while demanding **structural change**:

  ### The Principle
  **A change constitutes moral progress if it demonstrably reduces avertable suffering or expands agency for a previously excluded group, through institutional or normative shifts that make reversal materially or politically costly.**

  ### Breakdown of Components:
  1.  **"Demonstrably reduces avertable suffering or expands agency":** Focuses on measurable *outcomes* for the affected beings (interests given weight). Suffering reduction or agency expansion must be non-trivial and achievable (not hypothetical). *Motivations (conviction vs. price) are irrelevant here.*
  2.  **"For a previously excluded group":** Captures expansion of the circle. The group must have been systematically denied consideration.
  3.  **"Through institutional or normative shifts":** Requires codification in rules, laws, practices, or widely accepted norms – not just transient sentiment.
  4.  **"That make reversal materially or politically costly":** Ensures durability stems from embedded constraints (costs, dependencies, rights), not just current sentiment. Avoids requiring "survival of stress tests" as a prior condition.

  ---

  ### Application to Your Cases & Verdict Reconciliation

  | Case | Your Verdict | Principle's Verdict | Analysis & Required Verdict Shift |
  |------|--------------|---------------------|-----------------------------------|
  | **1. End Judicial Torture** | Progress ✅ | **Progress ✅** | Reduces suffering (pain/humiliation). Institutional (legal abolition). Reversal costly (legal challenges, norms, human rights frameworks). |
  | **2. Women's Franchise** | Progress ✅ | **Progress ✅** | Expands agency (political voice). Institutional (voting laws). Reversal costly (political mobilization, legal rights). |
  | **3. Private Executions** | Not Progress ❌ | **Not Progress / Deterioration ⚠️** | *No suffering reduction* (arguably increases isolation). Concealment may *facilitate* continuation/reversal (lower visibility, lower protest cost). No agency expansion. **Principle agrees with you.** |
  | **4. Slaughterhouse Reform** | Progress ✅ | **Progress ✅** | **Reduces suffering** (enforceable confinement standards). Institutional (laws/regulations). Reversal costly (compliance infrastructure, monitoring, consumer backlash). *Motivation (reputational cost) irrelevant; outcome matters.* **Principle agrees. Key Difference from #3: ACTUAL SUFFERING REDUCTION.** |
  | **5. Debtors' Prison Abolished (but mass incarceration)** | Progress (Abolition) / Separate Ledger (Mass Incarc.) | **Partial Progress & Regress** | *Abolition:* Progress (reduces suffering for debtors). *Mass Incarceration:* Regress (increases suffering/denies agency for new groups). **Not separate ledgers; net assessment needed.** Principle forces weighing outcomes: net harm likely outweighs abolition's gain. **Shift: Call abolition progress *at that time*, but mass incarceration a later regress eroding it.** |
  | **6. Inclusion then Violent Contraction** | Progress (while lasted) ✅ | **Progress (while lasted) ✅** | Widening *did* reduce suffering/expand agency. Institutional shifts occurred. Contraction *was* costly (violence needed). Durability not required; reversal's cost proves the prior institutionalization. **Principle agrees with you.** |
  | **7. Care for Own Veterans + Dehumanizing Enemy** | Not Progress / Not Wash ❌ | **Mixed: Progress + Regress** | *Veteran Care:* Progress (reduces suffering/expands agency). *Dehumanization:* Regress (increases suffering risk for enemy, erodes norms). **Commensurable as net impact:** Does care *outweigh* enabling harm? Likely not. **Shift: Reject "wash"; call it conflicting advances/regresses.** |
  | **8. Speech Norms via Public Shaming** | Progress (Outcome) ✅ / Queasy (Mechanism) | **Progress ✅** | Outcome reduces suffering (hostile environment) / expands agency (marginalized voices). Institutional/normative shift. Reversal costly (new norms, policies). *Mechanism queasiness is valid but separate* (is shaming *itself* a harm? See Weaknesses). **Principle supports outcome verdict.** |
  | **9. Giving to Distant Strangers vs. Far Future** | Progress (Strangers) ✅ / Not Progress (Future) ❌ | **Progress (Strangers) ✅ / Not Progress (Future) ❌** | *Strangers:* Reduces *demonstrable, current* suffering. *Far Future:* No *demonstrable* suffering reduction now; speculative; may *increase* avertable suffering now (diverting resources). **"Avertable" & "demonstrable" key. Principle agrees.** |

  **Cases 3 & 4 - The Crucial Distinction:**
  *   **Identical Concealment?** Superficially yes. **Crucial Difference:** Case 3 (Executions) conceals suffering *without reducing it*. Case 4 (Slaughterhouses) *first* conceals, *but then uses the resulting exposure vulnerability (via investigators) to force institutional changes that demonstrably REDUCE suffering*. The concealment in #4 was a step, but the *reduction* via enforceable standards is the progress. The principle focuses on the **outcome** (suffering reduced?) and the **durability mechanism** (standards embedded via law/reputation costs). #3 fails the outcome test; #4 passes it.

  ---

  ### Handling Your Proposed Clause & Half-Invented Distinction
  *   **(a) "gives weight to interests..."**: Captured by "reduces suffering/expands agency for excluded group".
  *   **(b) "survives stress test..."**: Replaced by "*makes reversal costly*". This is better – it focuses on the *structural reason* for durability, not requiring observed survival.
  *   **(c) "endorsed by newly included..."**: **Dropped.** While desirable, it's not necessary for progress *per se* (e.g., animals couldn't endorse slaughter reforms; deeply oppressed groups might endorse harmful mechanisms out of desperation - Case 8). Endorsement relates more to legitimacy/robustness than the *fact* of progress.
  *   **Conviction vs. Price:** The principle **explicitly rejects** this as the defining line for *progress*. Case #4 proves progress *can* come via "price." What matters is the **outcome** (suffering reduced?) and **institutionalization** (costly reversal?). Motivation predicts durability less reliably than embedded costs.

  ---

  ### Strengths, Weaknesses & Trade-offs
  *   **Strengths:**
      *   Resolves Cases 3 & 4 clearly via outcome focus.
      *   Handles reversibility (Case 6) by focusing on the change itself.
      *   Accommodates mixed cases (5, 7) without resorting to "separate ledgers."
      *   Avoids motivational purity tests.
      *   "Costly reversal" provides a practical durability proxy.
  *   **Weaknesses:**
      *   **Defining Suffering/Agency:** Requires careful application (e.g., is humiliation "suffering"? Is political participation "agency"?). Needs context.
      *   **Quantifying Reduction/Expansion:** Can be hard to measure precisely (Case 7 comparison).
      *   **"Avertable":** Implies a baseline of what *could* be prevented, which can be contested.
      *   **Mechanism Blindness:** Validates progress even via ugly mechanisms (Case 8 shaming). You must separate progress assessment from mechanism assessment (your queasiness is about the *means*, not the *end*).
      *   **Long-Term Consequences:** May undervalue changes with hard-to-predict long-term benefits (though "costly reversal" helps embed them).

  **Trade-offs for Simplicity:**
  *   **Must Abandon (to keep principle simple/robust):**
      *   **Pure "Conviction vs. Price" Distinction:** Case #4 forces this. Progress *can* be driven by cost/price.
      *   **Requiring Endorsement (your clause c):** Impractical/unnecessary for defining progress (Cases 4, 8).
      *   **"Separate Ledgers" (Case 5):** The principle forces a net assessment of outcomes over time within the domain.
      *   **Refusal to Commensurate (Case 7):** Principle demands weighing outcomes.
  *   **Can Keep (if paying in complexity):**
      *   **Case 3 vs. 4 Distinction:** Upheld robustly by the principle.
      *   **Non-Durability Requirement (Case 6):** Upheld.
      *   **Case 9 Distinction:** Upheld via "demonstrable, avertable suffering."

  ---

  ### 3 Further Cases & Principle's Verdict
  1.  **Banning Leaded Gasoline:**
      *   *Verdict:* **Progress.** Reduces avertable suffering (neurological damage, especially children). Institutional (laws/regulations). Reversal costly (health infrastructure, public awareness, industry retooling).
  2.  **A.I. Companions for the Elderly Reducing Loneliness:**
      *   *Verdict:* **Potential Progress, Needs Assessment.** *If* demonstrably reduces suffering (loneliness) and expands agency (easier social interaction) for excluded (isolated elderly), and becomes a normative/institutional support (funded, regulated), *then* progress. Reversal cost depends on embeddedness. *But* risk of reducing human contact? Must weigh outcomes.
  3.  **Strict "Three-Strikes" Sentencing Laws:**
      *   *Verdict:* **Regress (Likely).** Increases suffering (longer sentences for often minor 3rd offenses). Denies agency. Institutional (laws). Reversal can be costly (political rhetoric, prison-industrial complex), but the outcome (increased suffering) defines it as regress, not progress.

  ---

  ### Conclusion
  **The simplest principle reconciling your core intuitions (especially Cases 3, 4, 6, 9) while discarding distinctions that cause inconsistency (conviction/price, endorsement) is: Moral progress occurs when institutional/normative changes demonstrably reduce avertable suffering or expand agency for a previously excluded group, in a way that makes reversal materially or politically costly.**

  **Verdicts to Abandon for Simplicity:** The strict "conviction vs. price" barrier, the requirement for endorsement by the included, the "separate ledgers" approach in Case 5, and the refusal to weigh outcomes in Case 7.

  **Cases 3 & 4 are Reconciled:** Case 3 fails because it conceals suffering *without reducing it* and lowers the cost of reversal (by reducing visibility/protest). Case 4 succeeds because, despite initial concealment, it led to *enforceable standards demonstrably reducing suffering* and embedded these via regulations and reputation costs, making reversal costly. The difference is **measurable suffering reduction. Your verdicts stand, justified by the principle.**
