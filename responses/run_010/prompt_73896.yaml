     We also need to cover the view that keeps fundamental qualities without fundamental subjects - that's leaf 6.

     And the view that reverses explanation - leaf 4.

     And the view that concedes defeat - leaf 3.

     We'll now write the tree in full.

     Note: We must have unoccupied regions and inseparable pairs.

