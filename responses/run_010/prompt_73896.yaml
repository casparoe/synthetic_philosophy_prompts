answer: |-
  ### Decision Tree: The Combination Problem  

  **Starting Commitment:**  
  Having an experience is a real, non-eliminable feature of the world. No complete catalogue of structural, dispositional, and functional facts about matter would exhaust what it is like to be one of us.  

  ---

  1. **In a universe with only one momentary, simple experience (e.g., a flash of red), must there be a subject having this experience?**  
     - **Yes** → Go to 2.  
     - **No** → Go to 5.  

  2. **In a scattered system: The intrinsic properties of every neuron in a brain are reproduced, one-for-one, in dust grains dispersed across a galaxy. These grains share no functional connections. Is there a unified subject for the whole system?**  
     - **Yes** → Go to 3.  
     - **No** → Go to 4.  

  3. **Is this subject a new entity, beyond the dust grains themselves? (Or is it just the grains, now misdescribed as "unified" because we know their origin?)**  
     - **It is a new entity** → **Leaf: Strong Emergent Subject (non-constitutive emergence)**  
       *Objection: Why should disconnected grains produce a subject? Reply: Emergence is brute—organization isn't always necessary.*  
     - **It is just the grains** → **Unoccupied Region: Scattered Unity**  
       *Diagnosis: Coherent but unattractive. If disconnected grains form one subject, why doesn't every arbitrary collection? Defenders cannot justify why this case differs from ordinary plurality.*  

  4. **When micro-subjects (like dust-grain subjects) integrate functionally (e.g., in a brain), does a macro-subject emerge?**  
     - **Yes, and it is composed of the micro-subjects** → **Leaf: Compositional Panpsychism**  
       *Objection: How can many subjects become one without obliterating themselves? Reply: The "composing" relation is primitive but intelligible—like parts forming a whole.*  
     - **Yes, but it is a new entity, not composed of them** → **Leaf: Strong Emergent Subject (constitutive emergence)**  
       *Objection: If the macro-subject is new, how is it more than a duplicate? Reply: It’s not a duplicate—it’s a byproduct of micro-subjects in relation.*  
     - **No** → **Leaf: Micro-Subject Eliminativism**  
       *Objection: This denies the apparent unity of human experience. Reply: Unity is an illusion; only micro-experiences exist.*  

  5. **Can fundamental reality include "free-floating" experiences (e.g., a red flash) that lack a subject?**  
     - **Yes** → Go to 6.  
     - **No** → Go to 7.  

  6. **When free-floating experiences integrate, does a subject emerge?**  
     - **Yes** → **Leaf: Quality-Bundling Panpsychism**  
       *Objection: How do ownerless qualities "bundle" into a subject? Reply: Subjecthood arises from causal-mental relations among qualities.*  
     - **No** → **Unoccupied Region: Eternal Qualia Solipsism**  
       *Diagnosis: Collapses into a neighboring leaf. If qualities never form subjects, human experience must be illusory—but that’s eliminativism (see Leaf 3).*  

  7. **Are fundamental properties *protophenomenal*? (I.e., not experiences themselves, but capable of grounding experiences when combined.)**  
     - **Yes** → **Leaf: Protophenomenal Fundamentalism**  
       *Objection: How can non-experiential properties explain experience? Reply: Protophenomena are brute—they fill the "categorical gap" in physics.*  
     - **No** → Go to 8.  

  8. **Does the human subject exist as a fundamental entity?**  
     - **Yes** → **Leaf: Macro-Idealism**  
       *Objection: How do micro-phenomena relate to this macro-subject? Reply: They are its partial manifestations—no combination needed.*  
     - **No** → Go to 9.  

  9. **Is the universe’s fundamental subject one unified entity (e.g., "the cosmos")?**  
     - **Yes** → **Leaf: Cosmopsychism**  
       *Objection: How does one subject ground many finite subjects? Reply: We are aspects of it—derived but not constructed.*  
     - **No** → **Leaf: Physicalism with Brute Emergence**  
       *Objection: How can experience emerge from non-experiential properties? Reply: It’s a fundamental law—like gravity, but for consciousness.*  

  ---

  **Unoccupied Regions:**  
  1. **Scattered Unity (from 3: "just the grains")**:  
     *Diagnosis: Coherent but unattractive. No one defends it because it implies subjects exist arbitrarily.*  
  2. **Eternal Qualia Solipsism (from 6: "No")**:  
     *Diagnosis: Collapses into Micro-Subject Eliminativism (Leaf 3).*  
  3. **Fundamental Qualities without Emergence**:  
     *Diagnosis: Incoherent. If qualities can’t form subjects (rejecting 6), and aren’t protophenomenal (rejecting 7), they can’t explain human subjects.*  

  **Inseparable Pair:**  
  - **Strong Emergent Subject (constitutive)** and **Compositional Panpsychism** cannot be distinguished by the tree.  
    *Further commitment needed: Is the macro-subject identical to the collection of micro-subjects?*  
    - **Yes** → Compositional Panpsychism.  
    - **No** → Strong Emergent Subject.  

  ---

  **Leaf Catalog**  
  1. **Compositional Panpsychism**: Micro-subjects combine to form macro-subjects.  
     *Weakness: Obscure how subjects "merge." Reply: The whole-part relation is sui generis.*  
  2. **Strong Emergent Subject (constitutive)**: Micro-subjects cause a new macro-subject to emerge.  
     *Weakness: Feels dualistic. Reply: Emergence is ubiquitous (e.g., chemistry).*  
  3. **Strong Emergent Subject (non-constitutive)**: Functionally disconnected entities can still host a subject.  
     *Weakness: Arbitrary. Reply: Subjecthood requires only intrinsic properties, not relations.*  
  4. **Micro-Subject Eliminativism**: Only micro-subjects exist; macro-subjects are illusions.  
     *Weakness: Denies the unity of experience. Reply: Unity is a cognitive construct.*  
  5. **Quality-Bundling Panpsychism**: Fundamental qualities lack subjects until arranged.  
     *Weakness: Subjecthood becomes "added." Reply: It’s relational—like how atoms form molecules.*  
  6. **Protophenomenal Fundamentalism**: Fundamental properties are non-experiential but ground experience.  
     *Weakness: Mysterious transition. Reply: Protophenomena bridge physics and phenomenology.*  
  7. **Macro-Idealism**: The human subject is fundamental.  
     *Weakness: Ignores micro-level consciousness. Reply: Micro-phenomena are fragments of macro-minds.*  
  8. **Cosmopsychism**: One cosmic subject is fundamental; humans are aspects of it.  
     *Weakness: Reverses but doesn’t solve combination. Reply: Derivation isn’t composition—it’s decomposition.*  
  9. **Physicalism with Brute Emergence**: Experience emerges from non-experiential physics.  
     *Weakness: Hard problem persists. Reply: Emergence is a fundamental feature of nature.*  

  ---

  **Notes**  
  - **Tree Depth**: 6 questions cover all leaves. Two cases used (solitary red flash, scattered system).  
  - **Unavoidable Jargon**: Terms like "protophenomenal" and "constitutive" are industry-standard but clarified in parentheses.  
  - **Pedagogical Aim**: Students confront commitments (e.g., "Do I accept subjects in scattered systems?") before learning labels.
