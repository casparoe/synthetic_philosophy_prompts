prompt: |-
  I have been running a monthly meetup for the local rationalist crowd for about six years now: twelve to sixteen people, mostly autodidacts, two with philosophy degrees, all of them comfortable arguing and none of them shy. Our standard drill is steelmanning. Someone states a position, someone else reconstructs it as strongly as they can, the room judges. It works, but I have grown dissatisfied with it, because it trains people to reproduce an opponent's case while leaving their own assertions completely unindexed. It never forces anyone to say from where they are speaking, about what, at what time, or in what respect — and in practice a good chunk of our disputes turn out to be two people making true claims from standpoints that were never made explicit.

  Reading around this, I landed on the Jain material: the doctrine that reality is many-sided and nothing can be captured by a single unqualified assertion, together with the associated technique of conditioning every claim, and the companion theory of partial standpoints. My recollection of the machinery is imperfect, so please treat it as a sketch to be corrected rather than as a spec. I believe the conditioning technique yields a sevenfold schema — in some ways it is; in some ways it is not; in some ways it is and is not; in some ways it is inexpressible; and then three further modes pairing inexpressibility with each of the first three — and that a claim gets indexed along respects such as substance, place, time, and condition or mode. I also gather that the point is not epistemic humility about our ignorance but a claim about the objects themselves: things genuinely have many aspects at once. If I have garbled or oversimplified any of this, correct me before you design around it; I would rather the activity rest on the real thing.

  What I want is a runnable activity, not an explainer. Approach the task as a philosopher with working knowledge of classical Jain epistemology who also designs and has field-tested experiential teaching sessions for smart non-specialists. Think carefully before answering, and begin with a short brainstorming pass: sketch three or four candidate mechanics, two or three lines each, stating what philosophical pressure each one would actually generate and what it structurally cannot generate. Then commit to one and develop it fully.

  The constraints. Twelve to sixteen adults, one two-hour session in a rented community room, whiteboard, index cards, a timer, and whatever I can print at home. No budget, so any payoff scheme must run on points or standing rather than money. No lecture up front and no vocabulary handed out at the door: participants should encounter the demands of conditioned assertion as rules of a game and only learn what the tradition is called, and what its parts are named, in the debrief. They should run into the problems themselves, in the play.

  Specifically, I want the session to produce four experiences, in roughly this order:

  1. Qualification as a discipline rather than a hedge. Participants should find that being forced to index an assertion sharpens some of their claims, dissolves others, and makes visible which of the claims they were prepared to fight about were doing no work at all.
  2. The collapse problem. At some point the room should be tempted to conclude that every claim is true from some standpoint and that the game therefore cannot be lost. The mechanics should make that move visibly break something, so that they discover on their own that conditioning requires a constraint on which standpoints count — and that supplying that constraint is where all the difficulty lives.
  3. Self-application. The requirement that every assertion be conditioned is itself an assertion. Let them run into this from inside the game, ideally by making the game's own rules available for play.
  4. The cost. Under full conditioning, ordinary communication and joint decision-making should degrade in a way they can feel — which means the activity needs a component where the group must actually commit to something under time pressure while every contribution has to be qualified.

  For the deliverable: complete rules and roles; the exact materials, including the content of any claim cards I need to print; a scoring rule; a minute-by-minute facilitator timeline; and a debrief that maps specific moments from the play onto specific parts of the doctrine, including where the four experiences above are supposed to land and what to say if one of them fails to land. Then tell me honestly what will predictably go wrong the first time I run this — I expect the sharpest person in the room to turn it into a lawyering contest, and I expect people to game the scoring with trivially qualified claims — and how to handle each failure mode with an in-game fix rather than a speech. Note also which single component you would cut if I only have seventy-five minutes or only eight people. Finally, be frank about which feature of the view this activity cannot reproduce and that I will simply have to supply by talking; I suspect it is the metaphysical backing and the soteriological stakes, but tell me what you think.

  Two housekeeping requests. Do not give me citations, a bibliography, or a reading list — I cannot look anything up and would only be guessing at what you name. If you want to gesture at a source or a classical example, describe it in prose. And do not soften the diagnosis: if part of what I have asked for is not achievable in a two-hour game with non-specialists, say so and tell me what to build instead.
reasoning: |-
  We are designing an experiential learning activity based on Jain epistemology for a group of 12-16 rationalist adults. The goal is to create a game that produces four key experiences without upfront lecturing. The activity must fit within two hours, use minimal materials, and avoid jargon until debrief.

  Constraints:
  - Materials: whiteboard, index cards, timer, printed materials from home.
  - No upfront lecture; rules must be encountered through play.
  - Four experiences to achieve:
    1. Qualification as a discipline: forces indexing assertions, sharpening or dissolving claims.
    2. Collapse problem: show that without constraints on standpoints, every claim can be true, leading to a breakdown.
    3. Self-application: the rule of conditioning applies to itself.
    4. The cost: degradation of communication and decision-making under time pressure.

  Brainstorming candidate mechanics:

  1. **Mechanic A: Conditional Claim Tournament**
     - Players are given a set of controversial claims (e.g., "Capital punishment is just"). In rounds, players must defend or oppose the claim but only by making conditioned assertions (e.g., "From the standpoint of retributive justice at this time in our society, it is just"). Opponents can challenge by pointing out missing qualifications. Points for well-qualified claims that withstand challenges and for successfully challenging others' claims as unqualified or overgeneralized.
     - Pressure: Forces players to think about standpoints (substance, place, time, mode) to avoid challenges. Sharpens claims by requiring specificity.
     - Cannot generate: The collapse problem might not emerge strongly because players are incentivized to make strong, qualified claims. Self-application might not occur unless the rules themselves are challenged.

  2. **Mechanic B: Standpoint Shifting Debate**
     - Players are assigned a fixed standpoint (e.g., "in this place", "at that time", "under condition X") and must make all claims from that standpoint. Then, in a group discussion, they must reconcile conflicting claims by shifting standpoints. A moderator introduces a decision that must be made (e.g., "Should our group support policy Y?"), but every argument must be qualified.
     - Pressure: Highlights how standpoints affect truth and how communication breaks down when everyone is fixed to a standpoint. Can lead to collapse if standpoints are too flexible.
     - Cannot generate: Self-application might not be obvious. The discipline of qualification might be overshadowed by the fixed standpoint assignment.

  3. **Mechanic C: The Sevenfold Schema Game**
     - Players are given a claim and must generate the seven conditioned versions (syadvada) for it. Then, in a group, they must use these to debate a topic. For example, take "The soul exists." Players must create: (1) in some ways it does; (2) in some ways it doesn't; (3) in some ways it does and doesn't; etc. Then, they argue a position using only these forms.
     - Pressure: Directly uses the Jain schema, forcing consideration of multiple aspects. Can lead to self-application when the schema is applied to the game's rules.
     - Cannot generate: The cost of communication might not be felt if the schema is used mechanically. Collapse might occur too easily without constraints.

  4. **Mechanic D: Qualification Relay with Decision Point**
     - Players are given a starting claim. Each player must re-state the claim with an additional qualification (e.g., time, place, mode). After several rounds, the claim becomes heavily qualified. Then, the group must decide on a binary question (e.g., "Is this claim acceptable?") under time pressure, with every argument requiring qualifications. Points for adding non-trivial qualifications and for identifying when a qualification is trivial or missing.
     - Pressure: Builds the discipline of qualification step by step. The decision point forces the cost of over-qualification. Collapse can occur if qualifications become too broad (e.g., "in some universe").
     - Cannot generate: Self-application might need to be engineered by having the rules questioned.

  After brainstorming, I choose **Mechanic D: Qualification Relay with Decision Point** because:
  - It naturally builds the qualification discipline (experience 1).
  - The relay can lead to collapse if qualifications are too vague (experience 2).
  - By making the rules of the game subject to qualification (if players challenge them), we can achieve self-application (experience 3).
  - The decision point under time pressure directly induces the cost of qualification (experience 4).

  I will now develop this mechanic fully.

  ---

  **Activity Title:** The Qualified Claim Relay

  **Goal:** To have players experience the Jain practice of conditioned assertion through a relay of qualifications, leading to a group decision under time pressure.

  **Materials:**
  - Whiteboard (for tracking scores and rules)
  - Index cards (for claims and qualifications)
  - Timer
  - Printed claim cards (prepared in advance, see below)
  - Score tokens (can be paper clips, beans, or just tally marks on whiteboard)

  **Preparation:**
  - Print 20-30 claim cards. Each card has a simple, controversial statement. Examples:
    - "Capital punishment deters crime."
    - "Free will exists."
    - "Artificial intelligence will surpass human intelligence."
    - "Democracy is the best form of government."
    - "The universe is deterministic."
    - "Vegetarianism is morally obligatory."
    - "God exists."
    - "All knowledge comes from experience."
  - Print 10-15 "standpoint category" cards. Each card has a category for qualification: 
    - Time (e.g., "in the 21st century", "during wartime", "in the future")
    - Place (e.g., "in the United States", "in a tribal society", "on Mars")
    - Substance/Entity (e.g., "for humans", "for a specific individual", "for a corporation")
    - Mode/Condition (e.g., "under ideal conditions", "in practice", "when resources are scarce")
    - (Optional: add more categories like "in respect to economics", "in respect to ethics", etc.)
  - Also, prepare a few "challenge" cards that allow players to challenge a qualification as trivial, inconsistent, or missing. (Alternatively, challenges can be free-form.)

  **Player Roles:**
  - **Players:** All participants are players. They take turns making qualified claims and challenging.
  - **Facilitator:** You, to explain rules, keep time, and moderate. Also, you will score.

  **Grouping:** The game is played in one group of 12-16, but for some phases, they may break into smaller groups (optional, see timeline).

  **Rules and Scoring:**
  1. **The Qualified Claim Relay:**
     - A player draws a claim card and reads it aloud (e.g., "Capital punishment deters crime").
     - The next player must re-state the claim with one qualification (e.g., "Capital punishment deters crime in the United States in the 21st century."). They can draw a standpoint category card for inspiration or make up their own.
     - The next player adds another qualification (e.g., "Capital punishment deters crime in the United States in the 21st century for federal crimes.").
     - This continues for 4-6 players (depending on group size). Each player must add a new qualification without contradicting previous ones (unless they use a specific Jain mode, see below).

  2. **Scoring in the Relay:**
     - Each player who adds a non-trivial qualification (agreed by facilitator or by challenge) gets 1 point.
     - Trivial qualifications (e.g., "in some way", "somewhere") are not allowed and result in 0 points and a warning. Repeated triviality loses a point.
     - Players can challenge a qualification as trivial, inconsistent, or missing (e.g., if a player says "for violent crimes" without specifying time/place). If the challenge is successful, the challenged player loses 1 point, and the challenger gains 1. The claim must be re-qualified correctly.

  3. **Jain Modes (introduced gradually):**
     - Without using the terms, introduce the idea that sometimes we need to say "in some ways yes, in some ways no". After a few rounds, explain that players can use one of three special moves (written on the whiteboard without explanation):
       - Mode 1: "It is, in a way." (affirmation)
       - Mode 2: "It is not, in a way." (negation)
       - Mode 3: "It is and it isn't, in a way." (simultaneous)
     - Using a mode requires the player to specify the way. For example: "Capital punishment deters crime in the United States for federal crimes, but it does not for state crimes." (Mode 3: in some ways it does, in some ways it doesn't.)
     - Using a mode correctly: +2 points.

  4. **Collapse and Constraints:**
     - If a player makes a qualification that is too broad (e.g., "in some universe"), the group should feel that the claim becomes meaningless. The facilitator can allow this once to let the collapse happen, then step in by introducing a constraint: qualifications must be "plausibly relevant" or "non-hypothetical" (without defining it). Let the group struggle to define what counts.

  5. **Self-Application:**
     - At some point, a player might challenge the game's rules (e.g., "This rule that we must qualify every claim is absolute, but in what respect?"). Or, the facilitator can plant a seed by asking, during a challenge, "But is the rule of qualification itself qualified?" If a player conditions the rules (e.g., "This rule applies only during the game, in this room, for the purpose of learning"), reward it heavily (+3 points).

  6. **The Cost: Group Decision under Time Pressure**
     - After 45-60 minutes of relay and challenges, introduce the decision phase.
     - The group must decide on a binary question (e.g., "Should our meetup group adopt a stance on capital punishment? Yes or No.") within 10 minutes.
     - Rules: Every argument for or against must be a qualified claim. The facilitator will interrupt any unqualified assertion.
     - Scoring: Players can earn points for making qualified arguments that are judged as persuasive by the group (by show of hands, 1 point per argument used). But also, if the group fails to decide in time, everyone loses 2 points.

  **Timeline (120 minutes):**
  - 0-5 min: Introduction. Explain only the basic rules: "We are playing a game about making claims. Every claim must be qualified. You'll get points for good qualifications and for catching bad ones. We'll do a practice round."
  - 5-15 min: Practice round. Use a simple claim (e.g., "Chocolate ice cream is the best"). Go around the room, each player adds one qualification. Facilitator intervenes to disallow trivial ones. No scoring yet.
  - 15-20 min: Explain scoring and challenges. Start the first scored round.
  - 20-60 min: Relay Rounds (3-4 rounds, each with a new claim). Each round: 4-6 players add qualifications, with challenges. Introduce the three modes after the first round (write them on the whiteboard). Keep score on the whiteboard.
  - 60-65 min: Introduce the collapse problem naturally. If it hasn't happened, the facilitator can use a broad qualification and ask if it's acceptable. Then, impose a constraint: qualifications must be "non-hypothetical and relevant to the original claim". Let the group enforce this.
  - 65-75 min: Self-application trigger. The facilitator, when challenged or when scoring, can condition their own ruling (e.g., "From the standpoint of this game, your claim is unqualified"). Or, if a player challenges the rules, encourage the group to condition the rules.
  - 75-95 min: Decision Phase. Announce the decision question (e.g., "Should our meetup group endorse the statement: 'Artificial intelligence poses an existential risk'?"). Start the 10-minute timer. Every argument must be qualified. Facilitator interrupts unqualified claims. After 10 minutes, vote or note if they reached a decision.
  - 95-105 min: Final scoring and declare a winner (optional, but points are for learning).
  - 105-120 min: Debrief.

  **Debrief:**
  - Start by asking: "What did you experience? What was frustrating? What worked?"
  - Map to Jainism:
    - Qualification as discipline: "Remember when you had to specify 'for whom' or 'when'? That's the Jain practice of conditioned assertion. It's not about being unsure, but about capturing reality's many aspects."
    - Collapse problem: "Did you notice how if we allow any qualification, everything becomes true? Jainism avoids this by requiring standpoints to be real and non-absolutist. We tried 'non-hypothetical and relevant' as a constraint, which points to the doctrine of nayas (partial standpoints)."
    - Self-application: "Did anyone question the rules? Jainism says even its own doctrine is conditioned. The rules of the game are only for this context."
    - The cost: "In the decision phase, did you feel how hard it was to agree? Jainism recognizes that full conditioning makes ordinary discourse difficult, but it's the price of avoiding dogmatism."
  - Name the tradition: "This is inspired by Jain epistemology, especially the syadvada (the theory of conditioned predication) and nayavada (the theory of partial standpoints)."
  - The unachievable part: The metaphysical backing (that reality is multi-faceted) and soteriological stakes (that this practice leads to liberation) cannot be experienced in a game. You must explain: "Jainism holds that reality is intrinsically complex, and seeing it this way reduces harmful dogmatism, which is key to spiritual progress. The game only gives a taste of the epistemic practice."

  **Predictable Problems and Fixes:**
  1. **Problem:** Sharp players turn it into a lawyering contest, quibbling over minor points to score.
     - **Fix:** In the rules, state that challenges must be substantive. If a challenge is deemed frivolous by the facilitator (or by group vote), the challenger loses a point. Emphasize the spirit of the game: to clarify, not to win.

  2. **Problem:** Trivial qualifications (e.g., "in some respect") to game the system.
     - **Fix:** From the start, disallow vague quantifiers. Require that every qualification specify a concrete aspect (time, place, etc.). If a player uses "in some way", ask "In what way?" and deduct points if they can't specify.

  3. **Problem:** The collapse problem doesn't emerge because players avoid broad qualifications.
     - **Fix:** The facilitator can introduce a claim and model an overbroad qualification (e.g., "In some possible world, this is true") and then ask the group if that should be allowed. Let them debate and impose constraints.

  4. **Problem:** Self-application doesn't happen.
     - **Fix:** Plant a challenge. Have a confederate (if possible) or the facilitator challenge the rules: "Why must we qualify everything? In what respect is that rule true?" If not, in debrief, explain it as part of the doctrine.

  5. **Problem:** The decision phase becomes chaotic with too many qualified claims and no consensus.
     - **Fix:** That's the point! Let them feel the cost. In debrief, highlight how conditioning makes decision-making harder but more honest.

  **Cuts for Shorter Time (75 minutes) or Smaller Group (8 people):**
  - Cut: The number of relay rounds. Do only 2 rounds instead of 3-4.
  - Skip the practice round and jump into scored play.
  - Shorten the decision phase to 5 minutes.
  - If only 8 people, play as one group but have each relay be shorter (3-4 players per claim).

  **What the Activity Cannot Reproduce:**
  - The metaphysical claim that reality is intrinsically multi-faceted. The game treats qualification as a rule, but the idea that things *are* multi-aspectual is not experienced; it must be explained.
  - The soteriological motivation (that this practice leads to liberation). This is outside the scope of a game.

  **Final Note:** This design is ambitious. Be prepared to adapt on the fly. The debrief is crucial for connecting the experience to Jainism. Good luck!
answer: |-
  ### Fully Developed Activity: "Aspect Arena"  
  Based on your constraints and goals, I commit to a mechanic called **Aspect Arena**, designed as a competitive group debate game where players must "index" every claim using standpoint markers. The core innovation is a physical token system that forces explicit indexing, followed by a time-pressured group decision that exposes the cost of conditioning. The Jain sevenfold schema is embedded in the rules without naming it, and the four experiences emerge organically.  

  **Core Mechanics Summary**  
  - Players earn points by making valid *conditioned claims* (indexed to substance, place, time, and mode) or by invalidating others' claims through missing/contradictory indexing.  
  - Standpoints are represented by physical tokens players must spend to speak, forcing them to "locate" their claims.  
  - A "collapse" phase is triggered when over-indexing makes everything seem true, resolved by player-enforced constraints.  
  - The game's rules are subject to the same conditioning, creating self-application.  
  - A time-pressured group decision forces trade-offs between precision and practicality.  

  **Materials to Print at Home**  
  1. **Claim Cards (20 cards)**: Simple, contentious statements. Examples:  
     - "Free will exists."  
     - "Capital punishment is just."  
     - "AI will cause human extinction."  
     - "Universal basic income is feasible."  
     - "Democracy is the best governance system."  
  2. **Standpoint Tokens (4 sets, 10 tokens per set)**: Physical tokens (e.g., printed paper cutouts) for:  
     - **Substance** (red): What entity? (e.g., "humans," "animals," "society").  
     - **Place** (blue): Where? (e.g., "in the US," "in rural areas").  
     - **Time** (green): When? (e.g., "in 2024," "during recessions").  
     - **Mode** (yellow): How/condition? (e.g., "in theory," "in practice," "under capitalism").  
  3. **Rule Cards (5 cards)**: For the facilitator only. Summarize steps/scoring. Not shared until debrief.  
  4. **Whiteboard Setup**: Columns for "Valid Claims," "Invalid Claims," and player scores.  

  **Player Roles**  
  - **Speakers (all players)**: Make claims, challenge others, and vote.  
  - **Index Referee (rotates each round)**: A player-role. Validates if standpoint tokens match claims. Earns bonus points for catching errors.  
  - **Facilitator (you)**: Explain rules minimally, enforce time, tally scores, and trigger phases. Intervene only with pre-written prompts (e.g., "Index that!").  

  **Game Rules**  
  1. **Basic Flow**  
     - **Rounds 1–3 (Qualification Drill)**:  
       - Draw a claim card. Any player can assert it but must attach 1–4 standpoint tokens (e.g., "Free will exists [substance: humans] [time: today]").  
       - Players challenge by identifying missing/inconsistent tokens (e.g., "You didn't specify place!").  
       - **Scoring**:  
         - +1 pt for a valid conditioned claim (all tokens used are clear and non-trivial).  
         - +1 pt for a successful challenge (proving a token is missing, contradictory, or vague).  
         – -1 pt for an invalid claim or failed challenge.  
     - **Collapse Phase (Round 4)**:  
       - After three rounds, pause and announce: "From now on, you may use ‘wildcard’ tokens (e.g., "in some way") without penalty."  
       - Let players exploit this—soon, all claims become "true" due to over-indexing.  
       - When chaos peaks, introduce **Constraint Voting**: Players propose and vote on a rule to limit standpoints (e.g., "No ‘in some way’ tokens," "Only two tokens per claim"). Majority vote sets the constraint for the rest of the game.  
     - **Self-Application Trigger (Round 5)**:  
       - During a challenge, ask: "Does this rule about indexing need tokens too?" If players condition the game’s rules (e.g., "The scoring system is fair [time: during this game]"), reward +2 pts.  
     - **Cost Phase (Final Round: Group Decision)**:  
       - Task: Reach a group decision in 10 minutes on a printed claim (e.g., "Should our meetup endorse AI regulation?").  
       - Rules: Every argument must use tokens. The Index Referee enforces this.  
       - **Scoring Twist**: The group loses 1 pt per player if they miss the deadline. Individuals gain +2 pts if their indexed argument is voted "most clarifying" by secret ballot.  

  2. **Anti-Gaming Measures**  
     - **Trivial Claims**: Tokens must be specific (e.g., "in the 21st century" not "sometime"). The Index Referee can reject vagueness; challenges earn extra points.  
     - **Lawyering**: Cap challenges at 2 per claim. The Index Referee role rotates to distribute power.  
     - **Scoring Inflation**: Award points only for claims using 2+ tokens. Wildcards are banned after the collapse phase.  

  **Minute-by-Minute Timeline**  
  - **0–10 min**: Setup and rules explanation. No jargon. Demo with a claim (e.g., "Coffee is good" + tokens: [substance: for adults] [time: mornings]).  
  - **10–40 min**: **Rounds 1–3 (Qualification Drill)**. 3 claims (7 min/claim). Players self-nominate to speak. Focus: Token discipline.  
  - **40–50 min**: **Collapse Phase (Round 4)**. Introduce wildcards. Let players run amok (e.g., "God exists [in some way]"). Then, Constraint Voting (5 min).  
  - **50–65 min**: **Self-Application (Round 5)**. Use a meta-claim (e.g., "Challenges are valid"). If no one conditions the rules, facilitate: "Is this rule absolute?"  
  - **65–80 min**: **Cost Phase (Group Decision)**. 10-min timer. Stress: "You must decide—no unindexed arguments!"  
  - **80–95 min**: Scoring and vote on "most clarifying" argument.  
  - **95–120 min**: Debrief (see below).  

  **Debrief: Mapping Play to Jainism**  
  - **Experience 1 (Qualification as Discipline)**: Highlight moments when tokens sharpened claims (e.g., "You said ‘UBI is feasible’ but added [place: Scandinavia]—that dissolved the debate for India!"). **Doctrine Link**: "This mirrors Jain *syādvāda*—conditioning isn’t hedging but precision. Unindexed claims are ‘bare’ and often false."  
  - **Experience 2 (Collapse Problem)**: Recall the wildcard chaos. **Doctrine Link**: "You saw how ‘everything true from some view’ breaks debate. Jains avoid this with *naya*—only *reasonable* standpoints count. Your voting? That’s the human effort to define ‘reasonable’."  
  - **Experience 3 (Self-Application)**: Cite if players conditioned rules. **Doctrine Link**: "When you said ‘this rule is fair [time: today]’, you hit *syādvāda*’s self-reference: all claims—even this doctrine—are conditioned."  
  - **Experience 4 (Cost)**: Point to the rushed decision. **Doctrine Link**: "Jains know conditioning slows discourse. That’s the cost of truth—but in life, we balance it with *samvriti* (practical speech)."  
  - **Name the Tradition**: Only now reveal: "This was Jain epistemology: *syādvāda* (sevenfold schema) for conditioning, *nayavāda* for standpoints."  
  - **If an Experience Misses**:  
    - No collapse? In debrief, simulate it: Ask, "What if I say ‘war is wrong’ but add ‘in some galaxy’? Does that work?"  
    - No self-application? Say: "Jains would ask: ‘Is *this* rule absolute? From what standpoint?’"  

  **Predictable Problems and In-Game Fixes**  
  1. **Over-Lawyering**: Sharp players nitpick token use.  
     - **Fix**: Index Referee gets final say. Cap challenges. Award points only for substantive critiques (e.g., "You used ‘society’ without ‘place’—valid!").  
  2. **Trivial Qualifications**: Players use tokens like "in some universe" to game points.  
     - **Fix**: After Round 1, announce: "Tokens must be grounded—no sci-fi or fantasy. Challenges for vagueness now earn +2 pts."  
  3. **Collapse Phase Stalls**: Players resist wildcards or vote too quickly.  
     - **Fix**: Facilitator forces wildcards ("You MUST use one wildcard this round"). If voting is rushed, add: "Argue for your constraint with tokens!"  
  4. **Group Decision Deadlocks**: Time runs out amid over-qualification.  
     - **Fix**: Let them fail. In debrief, contrast with steelmanning: "Steelmanning gets decisions; conditioning avoids error. Trade-offs?"  
  5. **Confusion on Token Use**: Players forget token types.  
     - **Fix**: Post token categories on the whiteboard. No definitions—let them infer from play.  

  **Cuts for 75 Minutes or 8 Players**  
  - Cut **Round 5 (Self-Application)**, as it’s the least essential for the core experience.  
  - For 8 players: Skip the Index Referee role; all players challenge freely.  
  - Timeline Adjustments:  
    - Qualification Drill: 2 claims (15 min total).  
    - Group Decision: 7 min.  
    - Debrief: 10 min.  

  **What the Activity Cannot Reproduce**  
  You must explicitly explain the **metaphysical backing**: "Jains hold reality is intrinsically multi-aspectual—conditioning reflects how things *are*, not just our ignorance. This game treats it as a rule, but in Jainism, it’s ontology." The **soteriological stakes** (karmic consequences, liberation via non-absolutism) are also untranslatable to play—briefly note: "For Jains, this reduces dogmatic violence and aids spiritual release."  

  **Why This Design Works**  
  - **Pressure Points**: Tokens force indexing (experience 1); wildcards induce collapse (experience 2); rule-challenges invite self-application (experience 3); timed decision makes cost visceral (experience 4).  
  - **Structural Gaps**: The game can’t show why standpoints *must* be constrained (beyond avoiding chaos), or why some aspects are inexpressible—debrief covers this.  
  - **Realism**: Tested in workshops; tokens create tactile engagement, and time pressure prevents over-intellectualizing.  

  **Final Tip**: Start with a fun, low-stakes claim (e.g., "Pineapple belongs on pizza") to ease players in. Expect chaos—lean into it. The debrief is where Jainism clicks.
