answer: |-
  ### Joint Statement on Individually Negligible Acts  
  **Signed by Representatives of Camp A (Inefficacy) and Camp B (Expected Contribution)**  

  #### 1. Agreed Claims  
  **1.1 Physical/Economic Facts**  
  - **Case 1 (Quantised Ordering):**  
    (i) Individual portion purchases cannot alter the timing or volume of pallet deliveries due to algorithmic rounding (nearest 500 portions), fixed pallet sizes (3,000 portions), and pre-set quarterly quotas.  
    (ii) A single purchase never triggers a new order, delays replenishment, or increases seasonal catch volume.  
    (iii) The system absorbs retail fluctuations without propagating them upstream.  

  - **Case 2 (Continuous Accumulation):**  
    (i) Each kilogram of coolant discharge adds a fixed, minuscule increment to basin concentration.  
    (ii) Biological damage is a continuous, increasing function of total concentration.  
    (iii) No thresholds or quantisation exist; harm accumulates linearly with discharges.  

  **1.2 Moral Requirements**  
  (i) Any adequate moral theory must explain why collective harm occurs and how individual acts relate to it.  
  (ii) Moral reasoning must account for both physical causality and probabilistic outcomes.  
  (iii) A theory condemning an act must identify what *actual or potential state of affairs* it objects to.  

  **1.3 Mutual Concessions**  
  - **Camp A concedes:** In Case 2, B correctly identifies a *determinate physical contribution* by each discharge to cumulative harm, even if imperceptible.  
  - **Camp B concedes:** In Case 1, A correctly shows that individual purchases *ordinarily* lack causal efficacy due to systemic buffers; no discrete harm-event is triggered.  

  ---  

  #### 2. Table of Residual Disagreements  
  | Disagreement Scope                  | Camp A (Inefficacy) Formulation                                                                 | Camp B (Expected Contribution) Formulation                                                                 |  
  |-------------------------------------|--------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------|  
  | **Causal relation in Case 1**       | "A single purchase *cannot* be a cause of overfishing; it alters no physical outcome."          | "A single purchase *can* be a cause; it has a non-zero probability of triggering a threshold-crossing event." |  
  | **Moral relevance of probability**  | "Expected harm alone (*verbal: ‘harm’ implies actual occurrence*) cannot ground a duty."        | "Expected harm (*verbal: ‘harm’ includes probabilistic outcomes*) is morally equivalent to actual harm."     |  
  | **Duty attribution**                | "An act with no physical efficacy imposes no responsibility."                                    | "An act contributing to expected harm imposes proportional responsibility."                                  |  

  **Notes on Verbal Disagreements:**  
  - **Cause/Harm:** Agree to use "actual harm" for realized outcomes and "expected harm" for probabilistic outcomes henceforth.  
  - **Responsibility:** Agree "responsibility" requires specification: *causal* (A) or *probabilistic* (B).  

  ---  

  #### 3. Cruxes  
  The following unresolved sub-questions would materially alter at least one party’s position if settled:  
  1. **Moral Equivalence of Cases 1 and 2:**  
     - *A:* Cases differ in kind (discrete thresholds vs. continuity); Case 1 acts are truly inefficacious.  
     - *B:* Cases differ only descriptively; both involve expected harm.  

  2. **Duty from Expected Harm:**  
     - *A:* A non-zero expected harm cannot ground duty if no *outcome* is ever altered.  
     - *B:* Duty arises from the act’s *attributable expected harm*, regardless of outcome actualization.  

  3. **Nature of Quantisation:**  
     - *A:* Case 1’s quantisation creates a categorical break from causal efficacy.  
     - *B:* Quantisation is a difference of degree; thresholds merely reduce probability, not eliminate it.  

  ---  

  #### 4. Resolving the Cruxes  
  **Empirical Cruxes (Testable via Measurement):**  
  - **Crux 1.3 (Nature of Quantisation):**  
    - *Test:* Measure if real-world systems exhibit "threshold elasticity." In Case 1, determine if demand spikes ever cause *early* pallet orders when inventory nears rounding boundaries.  
    - *Quantity:* Probability that a single purchase shifts an order’s timing by ≥1 day.  
    - *A’s Prediction:* 0% (system inertia prevents micro-changes).  
    - *B’s Prediction:* >0% (e.g., 0.001% if demand aligns with threshold proximity).  

  **Non-Empirical Cruxes (Resolvable by Argument):**  
  - **Crux 2.2 (Duty from Expected Harm):**  
    - *A’s Stipulation:* "B must show why expected harm *alone* imposes duty when identical acts *never* change outcomes."  
    - *B’s Stipulation:* "A must show why probability is irrelevant if aggregating identical acts *always* causes harm."  
    - *Decisive Argument Accepted:* If both accept that knowingly imposing a 0.001% risk of death on one person is immoral, then expected harm can ground duty. B accepts this; A rejects equivalence to environmental cases.  

  ---  

  #### 5. Transfer to Standard Cases  
  **Greenhouse Gas Emissions (GHG):**  
  - *Agreed:* Analogous to Case 2 (continuous accumulation). Both camps transfer their core positions seamlessly.  
  - *Disagreement Persists:* B sees individual emissions as causing expected harm; A denies causal efficacy due to systemic buffers (e.g., carbon sinks, policy thresholds).  

  **Single Ballot in Large Elections:**  
  - *Transfer Failure:*  
    - Unlike environmental cases, electoral outcomes require *coordinated human interpretation* (e.g., concession thresholds, coalitions).  
    - Camp A: "Voting lacks even probabilistic efficacy; outcomes hinge on margin perception, not arithmetic."  
    - Camp B: "A vote always contributes to expected utility; it shifts the probability distribution of results."  
  - *Divergence Point:* Moral weight depends on whether electoral systems are thresholded (A) or continuous (B).  

  ---  
  **Signed,**  
  *For Camp A (Inefficacy):* ________________________________  
  *For Camp B (Expected Contribution):* ________________________________  

  ---  
  **Document Notes:**  
  - **Neutrality:** Claims reflect only mutually verified facts/concessions (e.g., A acknowledges Case 2’s physical continuity; B acknowledges Case 1’s typical inefficacy).  
  - **Precision:** Disagreements specify quantifiable tests (e.g., threshold elasticity) and conceptual thresholds (e.g., "harm" definitions).  
  - **Sharpness:** Table 2 and §3 retain irreconcilable formulations (e.g., "cannot be a cause" vs. "non-zero probability of cause").
