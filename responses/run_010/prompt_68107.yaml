prompt: |-
  I run a ~250-member mutual credit group — sort of a LETS/time-bank hybrid: members earn credits doing things for each other, spend them with other members, no cash conversion. Every couple weeks someone brings a proposal that sounds lovely and would quietly turn the thing into a money machine: arbitraging the credits, charging a fee to lend out a surplus you've accumulated, reselling credits to outsiders at a markup. Right now the committee votes on vibes, and I lose arguments I should win and win some I shouldn't.

  Aristotle is the only old source I know that actually draws the line I need: household-management vs. wealth-getting as its own end, the thought that getting wealth has a natural limit becuase it's for the sake of something, money as a conventional stand-in for need rather than a thing that breeds, and proportionate reciprocity in exchange where builder and shoemaker get equalized by something that measures need. I want that turned into a screening procedure my committee can actually run in ~30 minutes on a written proposal, with no philosophy background required and no reference material in front of them.

  So: the questions to ask in order; what counts as a sufficient answer to each — a real test somebody can fail, not "consider whether it serves the members"; where the procedure stops at a no; where it hands the decision up to the full membership because it's a values call and not a fact; and which steps are judgment calls dressed up as procedure. Please also flag where the analogy strains — our credits aren't coins, and the natural-limit argument is doing a lot of silent work when I apply it to a spreadsheet of balances.

  Then run it on three proposals: (a) a member wants to buy credits from people running big surpluses for cash at a discount and spend them at face value; (b) a savings feature where you post your credit surplus and get a small fee from whoever takes it; (c) my own pet project — a fixed-supply founding-member instrument that pays early holders a premium out of future transaction levies. If (c) fails, say it fails plainly, I'd much rather know now than after I've socialized it.

  No reading list, no citations, and please don't invent scholarship I can't check. But do tell me where your reasoning is weakest: which of those distinctions you're leaning on hardest and least safely, and what would change your mind about the whole exercise — like if the honest answer is that this is just a governance question and Aristotle adds no screening power that a plain conflict-of-interest check wouldn't.
reasoning: |-
  Okay, the user runs a mutual credit group with about 250 members. It's a hybrid of LETS and time-banking where credits are earned by helping others and spent within the group—no cash involved. The problem is that every few weeks, someone proposes ideas that could turn the system into a money-making scheme, like arbitrage or lending fees. The committee votes based on vibes, leading to inconsistent decisions. The user wants to use Aristotle's concepts to create a practical screening procedure for proposals, without needing philosophy background. 

  First, I need to break down Aristotle's relevant ideas: household management (oikonomia) versus wealth-getting (chrematistike). Household management is about meeting needs within the community, with wealth as a means to an end. Wealth-getting treats money as an end in itself, leading to unlimited accumulation. Aristotle also talks about proportionate reciprocity, where exchanges are equalized based on need, not just market value. 

  The challenge is translating these philosophical concepts into a 30-minute screening process. The key points to operationalize are: ensuring proposals serve real needs, preventing credits from becoming commodities, maintaining reciprocity, and imposing natural limits on accumulation. The credits aren't coins, so the abstraction here might be tricky. The natural-limit argument might strain when applied to spreadsheet balances since credits represent future obligations, not tangible assets.

  The user wants a step-by-step procedure with clear questions, pass/fail criteria, and flags for judgment calls. They also want to test three proposals: buying credits at a discount, a savings feature with lending fees, and a founding-member instrument with premiums from transaction levies. Plus, they need honesty about where the reasoning is weakest.

  Starting with the screening procedure. The steps should be sequential, starting with identifying the primary purpose. Is the proposal about meeting needs or generating more credits? Then, check if it commodifies credits, introduces external exchange, disrupts reciprocity, or encourages accumulation beyond needs. Each step needs binary outcomes where possible. Steps that are judgment calls should be flagged, like assessing "real need" or "reasonable accumulation."

  For proposal (a): Buying credits for cash at a discount. This directly turns credits into a commodity, allows external money to enter, and enables arbitrage. It commodifies credits and introduces external exchange, so it should fail early steps. 

  Proposal (b): Savings feature with lending fees. This introduces a fee for lending surplus credits. The core issue is commodification—credits become loanable assets. The fee mechanism treats credits as capital-generating, which aligns with wealth-getting. Fails at step 2. 

  Proposal (c): Founding-member instrument with premiums. This creates a fixed-supply asset that pays holders from transaction levies. It commodifies credits by creating a tradeable instrument, externalizes value (outsiders might buy in), and disrupts reciprocity by siphoning credits from transactions. It also encourages accumulation without limit. Fails multiple steps. 

  Now, the weaknesses. The biggest strain is applying natural limits to credit balances. In reality, surpluses might represent future needs, but Aristotle's argument assumes tangible wealth. Also, distinguishing "real need" versus convenience is subjective. The procedure might not catch all edge cases, and governance might still be necessary for values-based decisions. Aristotle adds a framework for intent and purpose, which a conflict-of-interest check alone might miss, but it's not foolproof. The user should consider if the screening process captures the community's ethos beyond just rules.
answer: |-
  Here’s a distilled, actionable screening procedure based on Aristotle’s principles, designed for speed and clarity. **Bold** = automatic fails, *italic* = judgment calls.

  ---

  ### **The Screening Procedure (15–20 min/proposal)**
  **Ask these questions in order – stop at first "NO":**

  1. **Is the primary purpose to meet tangible member needs (e.g., repairs, care, skills) OR to generate/move credits as an end in itself?**  
     - *Sufficient YES*: Proposal describes a specific service/good for members (e.g., "offer guitar lessons," "organize neighborhood cleanup").  
     - **Automatic NO**: Proposal focuses on credit mechanics (arbitrage, lending, trading) without tying credits to concrete needs.  
     - *Strain*: "Need" is subjective (is "marketing help" a need?). Committee must interpret reasonably.

  2. **Does it treat credits as a commodity (bought/sold/rented) OR as tokens of reciprocal obligation?**  
     - *Sufficient YES*: Credits are only earned by providing services/goods or spent to receive them.  
     - **Automatic NO**: Credits are traded for cash, used as loan principal, or made transferable outside direct exchange.  
     - *Strain*: Credits *are* transferable in your system, but Aristotle’s "proportionate reciprocity" breaks if they become investment vehicles.

  3. **Could this incentivize accumulating credits beyond foreseeable personal needs?**  
     - *Sufficient YES*: No passive income, fees, or resale profits; credits expire or have demurrage (if applicable).  
     - **Automatic NO**: Features interest, dividends, fees, or speculation (e.g., "earn credits by holding surplus").  
     - *Judgment Call*: "Foreseeable needs" requires estimating reasonable credit use (e.g., is 500 credits for future surgery okay? 5,000 for a yacht?).

  4. **Does it introduce external money/outsiders in a way that could distort internal reciprocity?**  
     - *Sufficient YES*: No cash exchange; outsiders participate only by joining as full members (earning/spending credits).  
     - **Automatic NO**: Cash trades credits, outsiders buy/sell credits, or external fees apply.  
     - *Handoff to Membership*: If external involvement is ambiguous (e.g., "partner with local biz for credit discounts").

  5. **Would it destabilize the "natural limit" of credit balances?**  
     - *Sufficient YES*: Balances reflect recent mutual aid; no compound growth or systemic surplus/deficit drivers.  
     - **Automatic NO**: Creates permanent creditor/debtor classes via interest or artificial scarcity.  
     - *Strain*: Aristotle’s "natural limit" assumes physical wealth (e.g., food rots). Credits are digital – committee must assess if balances feel "excessive" (e.g., >6mo of typical spending).

  ---

  ### **Test Cases**
  **(a) Buy credits for cash at discount, spend at face value:**  
  - Q1: NO (Purpose is credit arbitrage, not need). **STOP: REJECT**.  
  *(Fails at Step 1: Wealth-getting as an end.)*

  **(b) Savings feature: Lend surplus for a fee:**  
  - Q1: NO (Generates credits from credits). **STOP: REJECT**.  
  *(Fails at Step 1; also fails Q2/Q3: Treats credits as capital.)*

  **(c) Fixed-supply "founder shares" with premiums from levies:**  
  - Q1: NO (Purpose is speculative investment).  
  - Q2: NO (Credits become tradeable securities).  
  - Q3: NO (Encourages unlimited accumulation via dividends).  
  - Q4: NO (Attracts outsiders seeking ROI).  
  **STOP: REJECT**.  
  *(Fails multiple steps; especially violates "natural limit" by siphoning credits from active users to passive holders.)*

  ---

  ### **Where the Analogy Strains & Weaknesses**
  1. **Credits ≠ Coins**: Aristotle condemns money breeding money. But your credits are *obligations*, not stores of value. The procedure assumes that *any* profit mechanism corrupts reciprocity – but is a 1% fee to incentivize lending really "unnatural"? **Weakest point**: Overextension of "natural limit" to digital credits.  
  2. **Subjectivity**: Q1 (real need) and Q3 (reasonable accumulation) rely on committee intuition. A conflict-of-interest check would catch exploitation but not philosophical drift.  
  3. **What Changes My Mind**: If your group *wants* limited financialization (e.g., microloans with fees to sustain the system), Aristotle won’t help. His framework is binary: mutual aid good, money-begets-money bad.  

  **Bottom Line**: This procedure filters out blatant financialization (all 3 proposals fail cleanly) and forces discussion of intent. But for edge cases (e.g., "Should we charge fees to prevent hoarding?"), you’ll need membership votes – Aristotle can’t resolve operational tradeoffs. His power is in framing: **Is credit a tool for reciprocity, or a product to be gamed?** If the committee internalizes that, "vibes" will align better.  

  *(Final note: Your "pet project" (c) is effectively creating securities – reject it firmly or risk regulatory/community blowback.)*
