  I have been arguing with a friend for about a week now about an application of the strategy-stealing argument, and I want someone to tell me where the reasoning actually goes wrong, because the two of us keep talking past each other and I am no longer sure which of us has identified the weak point. Start with the version I feel confident about. In a symmetric connection game like Hex — two players alternately claiming hexagons, each trying to complete a chain between their own two sides — one can show that the second player has no winning strategy. Suppose she did. The first player opens by claiming an arbitrary cell, then follows her strategy, treating himself as though he were the second player and simply ignoring the fact that he already owns one extra cell, playing somewhere else at random whenever the stolen strategy calls for a cell he has already taken. Since an extra stone of your own colour can never make your position worse in a game of that kind, the first player would win by means of a strategy that was supposed to be a guaranteed win for the second player, which is absurd. The same shape of argument applied to tic-tac-toe strikes me as yielding something weaker: it rules out a second-player win, but under perfect play the game is drawn rather than won. I am not sure how much of the force of the Hex case depends on Hex being a game that cannot end in a draw, and my friend says that is a detail.

  My friend works on model evaluations at a lab, and she wanted to transfer the structure to competition between AI developers. Her claim is that a lab which spends part of its budget on safety work can always adopt whatever plan a less careful competitor adopts, because the safety work only ever adds information, options, and understanding of failure modes, and extra options cannot hurt; therefore carefulness carries no competitive penalty, and the race-to-the-bottom pessimism that has been a staple of these debates for a decade is unsound. I accepted that for a while. Then I hit what I take to be a fatal problem. The Hex argument is non-constructive: it establishes that a winning first-player strategy exists without exhibiting it, and on boards too large to be settled by search nobody knows what the winning line is. So the lab version appears to establish the existence of a win-the-race-while-being-careful strategy that no actual lab could execute, and in a real competition an unexecutable winning strategy loses to an executable strategy that is merely very good. Her response is that this is a mathematician's scruple with no practical content, since a lab does not need a solved board: it can watch its competitor, copy the plan, and pocket the difference. I am not persuaded, but I cannot articulate why, and there is a second worry she waved away — that in chess there are positions in which the player who is obliged to move would rather pass, so the premise that an extra move can only help is not a law of nature but a feature of particular games.

  So I would like an audit rather than a summary. Where does the strategy-stealing argument get its force, and which of Hex's structural features does the lab application inherit rather than merely assume? Please lay out the premises the transfer depends on and take them one at a time — including the one she leaned on hardest, that safety work is an extra stone rather than a stone spent somewhere else, the tic-tac-toe point about drawability, and the chess point about being obliged to move. Then tell me which of our objections bites and which only sounds worrying, what the argument licenses at most once its premises are made explicit (in particular, whether its conclusion is about anyone winning at all, or only about who cannot be guaranteed to win), and whether any defensible version of the claim that safety work costs nothing competitively survives the audit — or whether the transfer from a solved board game to an unsolved race was a category error from the start. For what it is worth, I have read a great deal of combinatorial game theory in popular form and rather too many years of forum arguments about takeoff speeds, so I am happy to be told that my objection is the wrong one, provided I am shown which objection is the right one.
reasoning: |-
  We are going to break down the strategy-stealing argument as applied to Hex and then to the AI safety scenario. We will identify the premises and see which ones hold in the new context and which do not.

  ### Strategy-stealing in Hex: Recap
  1. **Symmetry**: The game is symmetric (the board and goals are symmetric for the two players).
  2. **No draws**: The game cannot end in a draw (by the topology of the board, one player must win).
  3. **Monotonicity**: Having an extra stone of your own color on the board cannot harm your position (it can only help or be neutral). This is because the game is about connecting regions, and an extra stone is an extra connection.
  4. **Perfect information**: Both players have full knowledge of the state.

  The argument:
  - Suppose the second player has a winning strategy, S.
  - The first player makes an arbitrary first move (call it cell X). Then, for the rest of the game, the first player pretends to be the second player. He uses S, but if at any point S calls for playing in X (which is already taken by the first player), then he plays randomly elsewhere (but note: since X is already his, and by monotonicity, having X is at least as good as not having it, so he can treat it as a "free" extra stone). 
  - This leads to a contradiction because the first player would then win using a strategy that was designed for the second player to win. Hence, the second player cannot have a winning strategy.

  Therefore, the first player must have a winning strategy (and since there are no draws, the second player loses).

  ### Transfer to AI Safety Scenario
  Your friend's argument:
  - Labs are in a race to develop AI.
  - One lab (call it Lab A) does safety work, which is like having an extra stone (it only adds options and understanding, so it cannot hurt).
  - Lab A can then copy the strategy of a less careful competitor (Lab B) and do at least as well as Lab B, because the safety work is an extra advantage.

  Therefore, Lab A (the careful lab) should be able to win (or at least not lose) the race.

  ### Premises of the Transfer
  Let's list the premises that the strategy-stealing argument in Hex relies on and see how they map to the AI scenario.

  1. **Symmetry**: The two players have symmetric roles and goals. In the AI race, are the labs symmetric? 
     - In the race, all labs are competing for the same goal (e.g., being first to develop a powerful AI). However, the strategies (including safety work) may break the symmetry. Also, the "board" (the technological landscape) might not be symmetric.

  2. **No draws**: In Hex, a draw is impossible. In the AI race, is a draw possible? 
     - Yes: multiple labs might succeed at around the same time, or the race might have multiple metrics (e.g., safety and speed). Also, the race might not have a single winner (e.g., if the technology is shared or if there are multiple niches).

  3. **Monotonicity**: In Hex, an extra stone of your own color never hurts. In the AI scenario, the claim is that safety work (the "extra stone") never hurts. But is that true?
     - Safety work might use resources (time, money, compute) that could have been used for capability development. Therefore, it might slow down the lab. This is the key point: in Hex, the first player's extra move is "free" (he gets it without cost) because he makes the first move and then continues. But in the AI race, the safety work is not free: it requires investment.

  4. **Perfect information**: In Hex, both players see the entire state. In the AI race, labs may not know each other's internal states or strategies. However, your friend's argument assumes that Lab A can observe and copy Lab B's strategy. But note: if Lab A is doing safety work, it might be that Lab B's strategy is not observable until it is too late? Also, Lab A might not be able to copy exactly because of the safety work it has done.

  5. **The non-constructive nature**: The Hex argument proves existence without providing a strategy. In the AI scenario, even if there exists a winning strategy that includes safety work, it might be extremely hard to find (like the winning strategy for Hex on a large board). Thus, in practice, a lab that does safety work might not be able to execute the winning strategy.

  ### Critical Examination of Premises in the AI Context

  #### Premise 1: Safety work as an "extra stone" (Monotonicity)
  This is the most critical point. In Hex, the extra stone is free and cannot harm. In the AI scenario, safety work is not free: it requires resources. Therefore, if Lab A spends part of its budget on safety, then it has less budget for capabilities. This is the fundamental objection: **the safety work is not an extra stone; it is a stone placed in a different location (or a trade-off)**. 

  Your friend's claim that safety work "only ever adds information, options, and understanding" might be true in a vacuum, but in a resource-constrained environment, it comes at the cost of capability development. Therefore, the premise of monotonicity fails.

  #### Premise 2: Symmetry
  The AI race is not symmetric in the same way as Hex. Labs may start with different resources, expertise, and strategies. The strategy-stealing argument requires that the two players have symmetric positions. However, if Lab A is doing safety work and Lab B is not, they are not symmetric. The argument that Lab A can copy Lab B's strategy might not hold because Lab A has a different starting point (it has done safety work) and might not be able to exactly replicate Lab B's actions (which were taken without the burden of safety work).

  #### Premise 3: No draws
  In the AI race, it is possible that both labs achieve comparable results at similar times, or that the outcome is not winner-takes-all. Therefore, the conclusion that one lab must win and the other must lose (as in Hex) does not necessarily hold.

  #### Premise 4: Perfect information and copyability
  In Hex, the entire board state is visible. In the AI race, Lab A might not be able to observe Lab B's strategy in real time enough to copy it. Moreover, Lab B's strategy might be tailored to its own capabilities and without the safety work, so copying might not be straightforward.

  #### Premise 5: Non-constructiveness and practical execution
  Even if we grant the existence of a winning strategy that includes safety work (via a non-constructive argument), it might be impossible to find in practice. Therefore, in the real world, a lab that does safety work might lose to one that does not because the latter uses a simpler, more aggressive strategy that is easier to execute.

  ### Chess Example: The Value of an Extra Move
  You mentioned chess: there are positions where a player would rather pass (i.e., not move) because any move worsens their position. This violates the monotonicity assumption. In the AI scenario, if safety work sometimes leads to worse outcomes (for example, by causing delays that allow a competitor to overtake, or by leading to over-cautious design that misses opportunities), then it would be analogous to such a chess position. Therefore, the premise that "extra options cannot hurt" is not universally true.

  ### Conclusion: What Does the Argument License?
  The strategy-stealing argument in Hex proves that the second player cannot have a winning strategy and therefore the first player must have one. In the AI scenario, the analogous argument (if we accept the premises) would only show that a lab that does safety work cannot be guaranteed to lose (i.e., there is no strategy for a non-safety lab that guarantees it wins regardless of what the safety lab does). However, it does not prove that the safety lab wins. It might be that both have strategies that lead to a draw, or that the non-safety lab wins in some scenarios.

  Moreover, the critical flaw is the violation of monotonicity: in the AI race, safety work comes at a cost. Therefore, the transfer of the strategy-stealing argument does not hold.

  ### Is There a Defensible Version?
  A weaker claim might survive: that safety work does not necessarily put a lab at a competitive disadvantage in every scenario. It might be that in some contexts, safety work can be done efficiently and without slowing down capability development, or that it might even help (by avoiding accidents that would cause delays). But this is an empirical question and not a logical necessity.

  The strategy-stealing argument, as a non-constructive existence proof, does not provide a practical roadmap for how to win the race while doing safety work. Therefore, it does not refute the race-to-the-bottom pessimism, which is based on the idea that in a competitive environment, individual labs have an incentive to cut corners on safety to move faster.

  ### Final Word
  Your objection about the non-constructive nature is valid, but the more fundamental flaw is the violation of monotonicity (safety work is not free). Additionally, the lack of symmetry and the possibility of draws weaken the analogy. The transfer from a solved board game to an unsolved race is not a category error per se, but the premises of the board game argument do not hold in the race. Therefore, the argument does not establish that safety work is competitively neutral or beneficial.

  The chess example (about passing) is a valid counterexample to the universal claim that extra options (or moves) never hurt, and it shows that the premise is game-dependent. In the AI race, we cannot assume that the "extra" safety work is always beneficial.

  Thus, the strategy-stealing argument does not successfully refute the race-to-the-bottom concerns.
