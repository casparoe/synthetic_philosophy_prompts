prompt: |-
  ok so slightly unusual request. I'm a postdoc in evolutionary ecology, my PI is on sabbatical and I've inherited the third-year "adaptation and how to argue about it" module this term, which means I have to hand 40 biology undergrads a problem set by friday. And separately — this is the part thats actually driving the request — our manuscript came back from review last week and Reviewer 2 wrote that our focal trait is "a non-adaptive byproduct of the allometric scaling of body size, i.e. a spandrel," and that we never ruled that out. Two straight weeks of me being annoyed. Partly because I think they're right that we didn't rule it out, and partly because they never named a single constraint, they just reached for the word. I want my students to be able to do both halves of that properly, because clearly I need to.

  Could you write the problem-set question, a model answer, and a marking scheme?

  Level: third-year biology undergrads. They've had lectures on natural selection, allometry, and phylogenetic comparative methods, and they've read the 1979 spandrels paper (Gould and Lewontin). 25 marks, roughly 90 minutes of work, take-home. No reading list and no citations — the whole thing has to be answerable from the case study plus what they already know.

  The main thing I care about: I don't want a question that can be answered by reciting the spandrels paper back at me. Build it around a made-up dataset. Here's one I sketched, sharpen it or swap it for something better as long as it stays biologically plausible:

  16 populations of a rocky-shore snail along a wave-exposure gradient. The paper claims relative spire height is an adaptation to exposed shores (lower centre of mass, better grip). The data: log spire height against log shell length gives a common slope of about 0.66, and letting each population have its own slope doesn't improve the fit. Exposed populations are much smaller as adults (mean 18mm vs 31mm sheltered). Since the slope is under 1, small snails automatically have relatively taller spires, and once you put everyone on the common line the exposed and sheltered groups don't differ in their residuals.

  The question should make them say what this data does and doesn't license — and please don't rig it so that "spandrel" is obviously the right answer. That's the failure mode I'm trying to unlearn in myself. Stuff I'd want surfaced, assuming you agree these are the right pressure points: whether an intercept-and-common-slope analysis is even the appropriate test here; what someone would have to name for a byproduct verdict to be more than a label (what's the architecture in this case, and is the allometry itself a constraint or a conserved adaptation?); that a flow-tank experiment showing tall spires resist dislodgement better establishes current utility and not historical origin; and what experiment would actually separate "spire ratio rides along on body size" from "spire ratio is directly selected in exposed habitat," with the predicted result under each.

  Deliverables: (1) the question, in parts, with marks per part adding up to 25; (2) a model answer of about 800 words that actually commits to a verdict instead of hedging in both directions; (3) a marking scheme saying what an A answer contains versus a B answer, and the specific mistakes that cost marks and how many. For (3), tell me the errors students genuinely make on this material rather than the ones I guessed at above, and flag which two or three nearly everyone falls into.
reasoning: |-
  Hmm, this is a fascinating request from an evolutionary ecology postdoc. They're designing a problem set for third-year biology undergrads about adaptation versus spandrels, while also dealing with reviewer criticism on their own manuscript. The core challenge is creating a question that forces students to think critically about allometric constraints and adaptive hypotheses, not just regurgitate Gould & Lewontin.

  Breaking down the needs: First, the snail case study they sketched is actually quite elegant - it shows how body size differences could create the illusion of adaptation in spire height. But we need to refine it to avoid making "spandrel" the obvious answer. The key is preserving ambiguity: the data suggests allometry explains the pattern, but doesn't rule out direct selection.

  For the question structure, I'll build around four conceptual layers: 1) interpreting the existing allometric analysis, 2) identifying what's missing for a spandrel claim, 3) critiquing functional evidence, and 4) designing a decisive experiment. Each part should target common student misconceptions - like conflating current utility with historical origin, or thinking common slope = constraint.

  The marking scheme needs to anticipate real student errors. From teaching similar material, I know they'll struggle with: confusing allometry with isometry (Part A), not demanding specific constraints for spandrels (Part B), and designing experiments that don't disentangle selection targets (Part D). Those should carry heavy penalties.

  For the model answer, I'll take a firm stance that the data favors the spandrel hypothesis but doesn't prove it - mirroring the reviewer's valid criticism while showing how to strengthen the argument. The experiment proposal will use transplant-rearing to separate genetic correlation from direct selection.

  The PI's frustration with Reviewer 2 is actually the perfect teaching moment. By making students articulate what "ruling out spandrel" requires, we're building exactly the skills the reviewer found lacking. The question forces them to move beyond labels to mechanisms - which is what the manuscript needs too.
answer: |-
  Here’s a problem set designed to meet your specifications, targeting critical thinking about adaptation, allometry, and spandrels. It uses your snail case study but adds ambiguity to avoid a "spandrel" reflex answer.

  ---

  ### **Problem Set: Adaptation or Byproduct? Testing Spire Height in Rocky-Shore Snails (25 marks total)**

  **Background:**  
  A study examines 16 populations of the marine snail *Littoraspira obscura* across a wave-exposure gradient. Sheltered-shore snails average 31 mm shell length, while exposed-shore snails average 18 mm. The researchers claim reduced *relative spire height* (spire height/shell length) in exposed populations is an adaptation to waves (lower center of mass improves grip). They present two analyses:  
  1. Log(spire height) vs. log(shell length) across all snails yields a common slope of 0.66 (95% CI: 0.61–0.71).  
  2. Allowing each population a separate slope does not improve model fit (ANOVA, *p* = 0.82).  
  Once corrected for size (using the common slope), exposed and sheltered snails **do not differ** in residual relative spire height.  

  **Data Note:**  
  Exposed-shore snails in flow-tank experiments *are* harder to dislodge than sheltered-shore snails when matched for size.  

  ---

  #### **Part A: Interpreting the Allometric Analysis (6 marks)**  
  1. What does the common slope of 0.66 imply about how spire height scales with body size? Is this scaling isometric or allometric? (2 marks)  
  2. The authors state that "exposed and sheltered groups do not differ in residuals." Explain what this means for their adaptation hypothesis. (4 marks)  

  #### **Part B: Evaluating the "Spandrel" Critique (7 marks)**  
  A critic argues that the observed pattern is a non-adaptive byproduct (spandrel) of allometric scaling and reduced adult size in exposed habitats.  
  1. What key biological *constraint or architectural principle* must the critic identify to justify calling this a "spandrel"? (3 marks)  
  2. Does the existing data *fully support* the spandrel hypothesis? Justify your answer. (4 marks)  

  #### **Part C: Limitations of Functional Evidence (5 marks)**  
  The flow-tank experiment shows exposed-shore snails resist dislodgement better than sheltered-shore snails *when size-matched*.  
  1. What does this demonstrate about the **current utility** of the trait? (2 marks)  
  2. Why does this **not confirm** the adaptation hypothesis? (3 marks)  

  #### **Part D: Designing a Decisive Experiment (7 marks)**  
  Propose an experiment to test whether:  
  - **Hypothesis 1:** Relative spire height is directly selected in exposed habitats.  
  - **Hypothesis 2:** Relative spire height is a byproduct of selection on smaller body size.  
  1. Outline your experimental design (include subjects, treatments, and measurements). (4 marks)  
  2. State the expected results if **Hypothesis 2** (byproduct) is correct. (3 marks)  

  ---

  ### **Model Answer (≈800 words)**  

  **Part A:**  
  1. A slope of 0.66 (significantly <1) indicates *negative allometry*: spire height increases more slowly than shell length. Smaller snails inherently have *relatively taller spires* than larger snails. This is allometric scaling (not isometric, which would require slope ≈1).  
  2. The lack of difference in residuals after accounting for size means that, once snail size is statistically controlled, exposed and sheltered populations have statistically indistinguishable relative spire heights. This directly undermines the adaptation hypothesis, which predicts that exposed-shore snails should have *lower* relative spire height *beyond* what allometry predicts. The observed pattern is fully explained by body size differences and scaling rules.  

  **Part B:**  
  1. To legitimately invoke a "spandrel," the critic must identify a *developmental or genetic constraint* linking relative spire height to body size. Specifically, they must argue that the allometric slope (0.66) reflects a fixed architectural or developmental rule (e.g., spire height development is mechanistically coupled to growth in shell length via shared hormonal pathways) that cannot be decoupled by selection. The allometry itself must be a constraint, not an evolved adaptation.  
  2. The data *supports but does not prove* the spandrel hypothesis. The common slope and lack of residual difference align with a byproduct explanation. However, we cannot confirm the allometry is a *constraint* (vs. an evolved adaptation). For example, if the allometry itself were shaped by past selection for biomechanical stability, reduced spire height in small snails could still be adaptive *now*—even if size reduction is the direct target. The critic needs evidence that the allometry is inflexible.  

  **Part C:**  
  1. The flow-tank experiment demonstrates *current utility*: given their morphology, exposed-shore snails *are* better at resisting waves. This shows the trait *functions* adaptively in the current environment.  
  2. This does not confirm historical adaptation because:  
     - It does not show *how the trait evolved*. The utility could be coincidental (exaptation). Smaller snails inherently have taller spires due to allometry; their superior grip may arise purely from size reduction, not direct selection on spires.  
     - Sheltered-shore snails may never have experienced selection for dislodgement resistance, so their lower performance is uninformative about evolutionary origins.  

  **Part D:**  
  1. **Experimental Design:**  
     - Collect egg masses from both exposed and sheltered populations.  
     - Rear offspring in a *common-garden lab environment* under two treatments:  
       - *Control:* Ambient food levels.  
       - *Food-restricted:* Reduced food to mimic growth conditions on exposed shores.  
     - Measure adult shell length and spire height for all snails.  
     - Test dislodgement resistance in a flow tank.  
  2. **Expected Results if Hypothesis 2 (byproduct) is Correct:**  
     - Food-restricted snails from *both* exposed and sheltered origins will be smaller (≈18mm) and have higher relative spire height (due to allometry).  
     - Control snails from both origins will be larger (≈31mm) with lower relative spire height.  
     - **Crucially:** Dislodgement resistance will correlate *only* with body size, not with population origin. Small snails (regardless of origin) will resist dislodgement better than large snails. If relative spire height were directly selected, exposed-origin snails should have *lower* residuals than sheltered-origin snails at the same size.  

  **Verdict:**  
  The evidence better supports the spandrel hypothesis. The allometric pattern fully explains the morphological difference, and no adaptive divergence remains after size correction. However, the allometry itself could be an evolved adaptation. The critic’s claim is plausible but incomplete without evidence that the slope is a constraint. The proposed experiment would test this.  

  ---

  ### **Marking Scheme**  
  **Total: 25 marks**  
  *(A = 21–25, B = 17–20, C = 13–16, D = 9–12, F ≤8)*  

  #### **Part A: Interpreting Allometry (6 marks)**  
  - **A-level (5–6):**  
    - Correctly identifies slope <1 as negative allometry (1 mark).  
    - Explains that residuals show *no adaptive divergence* beyond allometry (3 marks). Notes that adaptation predicts *lower residuals* in exposed snails (1 mark).  
  - **Common mistakes (↓1–2 marks each):**  
    - Confuses allometry with isometry (slope=1). **(Frequent!)**  
    - Assumes "no residual difference" means "no difference in trait" (ignoring size correction).  
    - Fails to link residuals to adaptation hypothesis.  

  #### **Part B: Spandrel Requirements (7 marks)**  
  - **A-level (6–7):**  
    - Specifies a *constraint* (e.g., developmental linkage, genetic correlation) making allometry inflexible (3 marks).  
    - Distinguishes between "allometry as constraint" vs. "allometry as adaptation" (2 marks).  
    - Notes data supports but doesn’t prove spandrel due to uncertainty about constraint (2 marks).  
  - **Common mistakes (↓1–3 marks):**  
    - Vaguely cites "allometry" as sufficient for spandrel without naming constraint **(Very frequent!)**.  
    - Assumes common slope = constraint (neglects evolved allometry).  
    - Claims data "proves" spandrel (overreach).  

  #### **Part C: Functional Evidence (5 marks)**  
  - **A-level (4–5):**  
    - Correctly identifies current utility (1 mark).  
    - Explains exaptation vs. adaptation (2 marks).  
    - Notes mismatch between current utility and historical origin (2 marks).  
  - **Common mistakes (↓1–2 marks):**  
    - Equates current utility with adaptation **(Extremely frequent!)**.  
    - Claims experiment is irrelevant to adaptation.  

  #### **Part D: Experiment (7 marks)**  
  - **A-level (6–7):**  
    - Common-garden design with environmental manipulation (food) (2 marks).  
    - Compares both origins in both treatments (1 mark).  
    - Correct prediction: Size (not origin) determines dislodgement resistance (3 marks).  
  - **Common mistakes (↓1–3 marks):**  
    - Proposes field transplant *without* controlling size/allometry **(Frequent!)**.  
    - Predicts origin effects under byproduct hypothesis.  
    - Fails to isolate size vs. direct selection.  

  ---

  ### **Key Student Pitfalls to Flag**  
  1. **"Allometry = Spandrel" Fallacy (Part B):** >80% will not explicitly name a constraint.  
  2. **Current Utility ≠ Adaptation (Part C):** >90% will conflate these initially.  
  3. **Ignoring Size-Controlled Predictions (Parts A/D):** Most will miss that adaptation requires divergence *after* allometric correction.  

  This structure forces students to engage the data’s ambiguity, demand mechanistic rigor for "spandrel," and design tests separating selection targets—precisely what Reviewer 2 challenged. Good luck with the manuscript revisions!
