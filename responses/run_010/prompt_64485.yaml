answer: |-
  ### Analysis of Smith's Passage on Moral Systems

  #### 1. Reconstruction and Assessment of the Trichotomy Argument  
  **Explicit Argument:**  
  - **Premise 1:** Virtue must either be ascribed to *all* affections (when properly governed) or confined to a subclass.  
  - **Premise 2:** The great division of affections is into *selfish* and *benevolent*.  
  - **Disjunction:** If virtue cannot be ascribed indifferently to all governed affections (i.e., if it rejects "propriety"), then it must be confined to either selfish affections (*prudence*) or benevolent affections (*benevolence*).  
  - **Conclusion:** All accounts of virtue must fall under *propriety*, *prudence*, or *benevolence*.  

  **Assessment:**  
  Your suspicion is correct: the division is non-neutral. Smith frames the first horn ("ascribed indifferently to all affections... under proper government") as his own propriety view. The disjunction forces rival theories into subclasses of affections (*selfish* or *benevolent*), implicitly treating them as restrictive cases of propriety.  
  - **Is it question-begging?** Yes, in this passage. Smith assumes that rival theories must reduce to governing affections (his framework) rather than offering distinct foundations.  
  - **Could it be a legitimate theoretical claim?** Only if Smith demonstrates that prudence/benevolence theories *presuppose* propriety’s "proper government" criterion. The quoted text **does not** provide this demonstration. He merely asserts exhaustiveness ("scarce possible to imagine any other account").  

  #### 2. Stress-Testing Exhaustiveness  
  - **Obedience to God’s will:** Smith would assign this to *propriety*. Divine commands become the "proper government" standard. This dissolves the view’s distinctness by reducing theological obligation to psychological governance.  
  - **Stoic "agreement with nature":** Assigned to *propriety* ("proper government" of affections according to cosmic order). Smith’s assimilation ignores the Stoic emphasis on *rational conformity to logos*, not just affection-governance.  
  - **Mandeville’s vice-as-virtue:** Fits uneasily. Smith might call it a *prudence* variant (private vice as self-interested "virtue"), but Mandeville denies conventional virtue entirely. Smith’s "coincide at bottom" acts as an escape hatch here, forcing a misrepresentation.  
  - **Kantian "rational will from duty" (anachronistic test):** Smith would likely call this *propriety* (reason "governing" affections), but Kant’s deontology rejects affection-governance as virtue’s essence. The *distinctiveness* (duty vs. inclination) is dissolved.  
  **Verdict:** Divine command and Stoicism show the "coincide at bottom" clause functioning as an escape hatch, masking conceptual divergence.  

  #### 3. Relation Between the Two Questions  
  - **Independence?** For Smith, the questions are distinct but linked. Q1 (*what* virtue is) examines virtue’s substance; Q2 (*how* we perceive it) examines moral psychology. His answer to Q2 (sympathy) **supports but does not settle** Q1 (propriety). Sympathy explains *approval mechanics* but doesn’t dictate virtue’s definition.  
  - **"Modification of sympathy":** "Modification" implies sympathy is the *base principle*, but Smith’s account refines it (e.g., via "impartial spectator" mediation). It distinguishes his view from Hutcheson’s "moral sense" (listed prior) by making sentiment socially constructed, not innate.  
  - **Why the residual slot?** Strategic modesty. By listing his view last as "some other principle... or the like," Smith avoids dogmatism and positions sympathy as a novel synthesis beyond existing categories (self-love, reason, moral sense).  

  #### 4. Key Phrases Explicated  
  - **"Ascribed indifferently to all our affections":** *Indifferently* means "impartially" or "without distinction" (not "apathetically"). Virtue applies to *any* affection type if properly governed. A modern reader might misread "indifferently" as implying neutrality rather than universality.  
  - **"Tone of temper, and tenour of conduct":** *Temper* = enduring disposition; *tenour* = consistent behavioral pattern. They form a disposition-manifestation pair. The three candidate answers *do* address the same question: Hutcheson (benevolence) focuses on temper/motive; Clarke (relational fitness) and prudence (self-interest) on conduct’s outward alignment.  
  - **"Natural object of esteem, honour, and approbation":** *Natural* here means "expected under normal human psychology," not "objectively fitting." Smith **denies** antecedent fittingness; virtue is "natural" because sympathy *reliably produces* approval of propriety. Sentimental Q2 and "natural" in Q1 are consistent: sentiments track psychologically natural responses.  
  - **"Founded upon natural principles" / "Partial view of nature":** *Natural principles* = inherent features of human psychology (e.g., sympathy). *View of nature* = empirical observation of human behavior. A "partial view" overlooks some principles (e.g., reducing ethics to self-love ignores benevolence).  

  #### 5. Epistemic Status of the Ecumenical Claim  
  - **"In some measure in the right"**: This is a **stipulative methodological principle**, not a finding. Smith asserts that all reputable systems must tap into *some* "natural principle" (self-love, reason, moral sense, or sympathy), so none are wholly wrong.  
  - **Resisting Assimilation:** A system rejecting all four principles could not be assimilated (e.g., one denying any natural psychological basis for ethics). But Smith’s framework **pre-emptively excludes** such systems as non-"reputable" or unnatural.  
  - **Falsifiability?** The methodology is **unfalsifiable in practice**. By claiming rival systems "coincide at bottom" with his principles *and* promising future demonstration, Smith shifts the burden of proof. The quoted text offers no evidence; the ecumenical claim rests entirely on the promissory note ("I shall endeavour to show hereafter").  

  ---

  **Summary of Textual Support:**  
  - All claims derive **exclusively from the quoted text** unless noted. The analysis of propriety’s non-neutral framing (Q1), "natural" in Q4, and the ecumenical claim’s stipulative nature (Q5) are explicit in the passage. Stress-testing (Q2) and sympathy's role (Q3) extrapolate logically from Smith’s categories but remain grounded in his definitions.
