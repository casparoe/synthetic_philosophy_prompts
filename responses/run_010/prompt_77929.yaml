answer: |-
  **Proposal: Deliberative Agency in Fixed Histories: The Epistemic Residue of the Grandfather Paradox**

  **1. The Precise Question**  
  Does an agent in a fixed-history time travel scenario retain the capacity for genuine practical deliberation about actions that are *modally* precluded by the historical facts (e.g., killing their grandfather), and if so, on what epistemic grounds can such deliberation proceed rationally? Specifically: **Can two time travelers with identical modal constraints (i.e., both *cannot* metaphysically succeed in killing their grandfathers) differ in their rational deliberative stance toward attempting the killing, based solely on differences in their knowledge of the historical facts relevant to their own existence?** The answer must be "yes" or "no," with implications for the structure of practical reason in causally closed worlds.

  **2. Why Standard Positions Leave It Open**  
  - **Fixed Fact/Consistency Accounts** (e.g., Lewis-style): Resolve the modal contradiction by relativizing "can" to consistent histories. They show killing is compossible with *local* facts but not *global* facts (including the traveler's existence). Yet they explicitly bracket questions of *rational deliberation* under global constraints, treating agency as predictive rather than practical.  
  - **Branching Timelines/Dynamic Models**: Avoid paradox by allowing multiple futures. These deny the premise of a *fixed* history, making deliberation about changing the past incoherent. They address the modal contradiction but dissolve the epistemic-practical tension by altering ontology.  
  - **Pseudo-Problem Dismissals**: Claim the paradox arises from conflating tensed perspectives or misapplying "can." They deny any substantive residue but fail to explain why agents *experience* deliberative conflict when confronting fixed histories.  

  All three positions either ignore the normative question ("What *ought* the traveler to believe/do?") or redefine the scenario to eliminate it.

  **3. Method: Week-by-Week Plan**  
  - **Weeks 1–2**: *Diagnostic Groundwork*. Argue that the grandfather paradox has two layers: (a) a *modal* problem (resolved by fixed-fact accounts) and (b) an *epistemic-practical* residue concerning rational deliberation under known constraints. Distinguish:  
    - *Modal "can"*: Compossibility with background facts.  
    - *Epistemic "can"*: Consistency with the agent’s total evidence.  
    - *Deliberative "can"*: Status as a live option for practical reasoning (not prediction).  
  - **Week 3**: *Test Case Construction*. Defend the two-traveler scenario:  
    - **Traveler A**: Knows his grandfather survived an assassination attempt matching his own plan.  
    - **Traveler B**: Knows only that he exists (entailing grandfather’s survival).  
    Argue that while both are identically modally constrained, A can rationally deliberate (his evidence includes a "near-miss" he might explain), while B cannot—his existence directly undermines the attempt.  
  - **Week 4**: *Deliberative Collapse Risk*. Investigate whether deliberative "can" reduces to epistemic "can" (i.e., "I can φ" iff "φ is consistent with my evidence"). Test against cases of self-fulfilling/self-defeating prophecies (e.g., fatalism).  
  - **Week 5**: *Fatalism Analogy*. Compare the traveler’s predicament to logical fatalism (future truths preempting present deliberation). Argue the structures align (fixed facts constrain agency) but diverge on *direction of explanation*: fatalism fixes the *future*, time travel fixes the *past*, altering how evidence constrains deliberation.  
  - **Week 6**: *Breaking Point Analysis*. Identify where fatalism/time travel diverge: In fatalism, agents lack evidence *about the future* to undermine deliberation; in time travel, agents possess *conclusive evidence from the past* (their existence) that directly defeats certain intentions.  
  - **Weeks 7–8**: *Positive Account*. Argue that deliberative "can" requires *evidence resistance*: an option is deliberatively live only if the agent lacks *conclusive, directly undermining* evidence (e.g., B’s existence is conclusive; A’s near-miss is not).  
  - **Week 9**: *Objection Handling*. Address:  
    - Why not redescribe B’s evidence as modal? (Reply: It’s epistemic—B *knows* he exists.)  
    - Does this imply deliberation is irrational in fixed histories? (Reply: Only for actions globally constrained *and* evidentially undermined.)  
  - **Week 10**: *Drafting Paper*. Synthesize into a unified argument: The paradox’s residue arises from conflating modal constraints with deliberative constraints under evidence.  

  **4. Why This Approach? Alternatives’ Shortcomings**  
  - **New Modal Semantics**: Addresses "can" but not the normative force of evidence in deliberation.  
  - **Branching Models**: Dissolve the tension but at high ontological cost; fail to engage fixed-history intuition central to the paradox.  
  - **Pseudo-Problem View**: Ignores the phenomenology of deliberative conflict reported by students/agents.  
  This project uniquely isolates the epistemic-practical dimension while accepting the modal solution’s success.  

  **5. Result & Failure Conditions**  
  - **Success**: A clear account of when/why rational deliberation persists despite modal constraints, with a criterion for "deliberative liveliness" (e.g., absence of directly undermining evidence).  
  - **Failure Modes**:  
    - **Collapse**: If deliberative "can" reduces to epistemic "can" (i.e., no new category is needed), this is a *finding*—not a failure—showing the residue is purely epistemological.  
    - **Incoherence**: If no stable distinction between epistemic/deliberative "can" emerges, the project fails.  
    - **Unanswerability**: If the test case shows no difference in travelers’ deliberative positions, the core claim is false.  

  **6. Scope Management**  
  - **Core**: The two-traveler test case and evidence-resistance criterion (weeks 3–5, 7–8) are essential.  
  - **If Cut**: Fatalism analogy (weeks 5–6) is expandable but enhances depth.  
  - **Minimum Publishable Unit**: Argue for the epistemic residue via the test case, showing deliberative constraints outstrip modal ones.  

  **7. Pushback & Uncertainties**  
  - **Three-Way Distinction**: Risk that deliberative "can" is redundant (collapsing into epistemic). *This is central to test*.  
  - **Misdiagnosis**: *Uncertain* whether literature fully addresses this (e.g., Mele on intentional action may touch it; no time-travel focus). Students’ resistance *might* stem from conflating modality with ability—but the test case isolates epistemology.  
  - **Determinacy**: The question *is* determinate: Do evidentially distinct but modally identical agents differ in rational deliberative stance? Yes/no.  

  **8. Final Assessment**  
  The question is open, tractable in ten weeks, and addresses a plausible gap. Success hinges on stabilizing the deliberative/epistemic distinction—a risk worth taking.  

