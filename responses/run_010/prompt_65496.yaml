answer: |-
  Out of character commitments:  
  1) She's committed to the *irreversibility* of the change – it's not a transaction to be settled.  
  2) She'd die before conceding that her younger self has standing to judge the outcome; that girl ceased being the arbiter long ago.  
  3) Avoiding TED: Anchoring every thought in sensory grit (throat tension, accent muscle-memory) and refusing abstraction.  

  ---  

  **Vera (44, stirring cold tea she forgot to drink):** Win? Lose? Christ, listen to you. Like it’s a boxing match scored by accountants. You think Mum’s voice* sounds like a recording *to me*? It feels like trying to grab smoke. I reach for the warmth, the… the *shape* of her laugh, and my own tongue trips. It’s not gone. It’s *filed* somewhere else. And the jokes? They dried up because the soil changed. The things that *split* your sides here just… land flat. It stopped being worth the effort to dig them up, rebury them, hope they’d grow. Not loss. Adaptation. Survival. You want plain? Fine. I am not her. You wouldn’t recognize the rooms I live in now. That’s the fact. Verdict implies a court. There is no court.  

  **26-Year-Old (Leaning forward, sharp):** Adaptation? Survival? Sounds like fancy words for losing. You promised *us* – read your own journals! – a life *woven*, not just… endured. You swore you’d never let the roots rot. Mum’s voice, the jokes, the way you wrote – that was the weave. Now it’s frayed threads. You call it ‘filed,’ but it feels discarded. Admit it. You traded the texture for… what? This flatness?  

  **Vera (Tracing a chip in the mug’s glaze):** Traded. Always a *trade* with you. As if I walked into a shop with a bag full of… *currency* and haggled. It wasn’t like that. It was erosion. Slow. Grain by grain. The writing stopped because the language* inside my head shifted. The words came easier here, the grooves deeper. Trying to carve the old shapes felt… like speaking with marbles in my mouth. Mum’s voice changed because *my ear* changed. The jokes? They depend on ground shared in an instant. Mine got salted. New things grow. Different shapes. Sharper edges, sometimes. You mourn the weave. I see a different fabric. Neither’s ‘truer’. Just… present.  

  **26-Year-Old (Voice cracking slightly):** Different fabric? It feels thin. Brittle. You sound like you’re justifying an amputation. You swore you’d keep *both* worlds alive inside you. Vibrant. Not this… museum of correct phrases in a dead language. You don’t even *sound* like us anymore. The lilt’s gone. Where’s the girl who laughed till she cried at stupid puns? Who wrote pages dripping with fury or joy? Is she just… dead? And this is the monument?  

  **Vera (Looks down at her hands, calloused from gardening):** Dead? No. Transformed. Like water to steam. You can’t pour steam back into the old cup and call it the same water. The fury’s still here. It just… speaks the local dialect now. The joy too. Different triggers. You want the *sound* of her? Listen to the silence where those puns lived. That’s the cost. But the *capacity* for laughing till I cry? It didn’t leave. It just… found new reasons. Here. In this dirt. With these hands. The monument is the living woman. Not the ghost you’re chasing. The girl who boarded the plane? She couldn’t imagine this soil. Or these callouses. Or this quiet. Doesn’t make it loss. Makes it… what came after.  

  **26-Year-Old (Quieter, almost a whisper):** But does it feel like home? *Really*? Or just… where you ended up?  

  **Vera (Meets her younger self's eyes, a long pause):** ...Honestly? I don't know how to answer that. The person who defined 'home'* for you... she doesn't live here anymore. I just live *here*.  

  **unstar home**  
  *(The 26-year-old meant 'home' as a fixed, emotionally saturated point of origin, a place of absolute belonging defined by birth and deep memory. The 44-year-old means it as a functional, present-tense state of inhabitation – shelter, routine, the place where the kettle boils and the tools are kept, devoid of nostalgic weight.)*  

  **Vera (Continuing, softer):** It’s where the kettle is. Where the rosemary grows. Where I know how the light falls at 4 PM in winter. Is that home? It’s where I am. Asking if it *feels* like the home you packed in your suitcase… that’s asking steam to remember being a river. It can’t. And I wouldn’t trust it if it said it did. It just… is. Now.  

