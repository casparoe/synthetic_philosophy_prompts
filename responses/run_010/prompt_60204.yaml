  Hmm, the user has presented a fascinating and complex problem about defining the franchise for a new cross-border authority. They've shared 11 specific cases where they've made intuitive judgments about voting rights, and now want me to extract the underlying principles from these verdicts. This is essentially a reverse-engineering exercise in political theory applied to a real-world governance challenge.

  Looking at their cases, I notice several key patterns emerging:

  First, residence seems fundamental. Cases 1, 3, 7, 9 and 10 all grant voting rights to residents regardless of nationality or even direct impact (case 7). But it's not just physical presence - there's a temporal dimension too. The long-term resident (case 1) votes while the rotational worker (case 10) only votes during residency. The second-home owner (case 2) doesn't qualify despite economic interest.

  Second, there's a clear distinction between individuals and corporations. Case 6 explicitly denies voting rights to corporations regardless of their economic significance, while case 7 grants voting rights to an individual even if unaffected. This suggests their principle values human dignity over economic impact.

  Third, they're grappling with boundaries - both geographical (case 8 about downstream towns) and cognitive (case 11 about dementia). Their willingness to include commuters (case 9) but not distant communities shows they prioritize direct, ongoing subjection to authority over diffuse impact.

  The user has already proposed a working principle about "living under the Authority's rules for the long haul" which captures much of this, but needs refinement. I need to make it precise enough to handle edge cases while explaining all their verdicts.

  The toughest tensions appear between:
  - Case 8 vs 9 (downstream communities vs commuters)
  - Case 4 vs 3 (no proxy for children but voting at 16)
  - Their asymmetric treatment of prisoners (case 5)

  For their upcoming decisions:
  - Civil servants should vote since they're long-term residents subject to rules
  - Neighboring basin should get observers without votes since they're not yet subject to authority

  If forced to choose inconsistencies to fix, I'd suggest reconsidering:
  1. The commuter vote (case 9) since it conflicts with the residence principle
  2. The blanket prisoner disenfranchisement (case 5) which contradicts the "subject to rules" logic
  3. The rigid age cutoff (case 3) which could be more graduated

  The user clearly values practical applicability over theoretical purity - they'd rather drop a verdict than create complex exceptions. This suggests framing the principle around "continuous subjection to authority as a resident" with clear bright-line rules for age and residency duration, acknowledging that some boundaries will inevitably be arbitrary but defensible.
answer: |-
  Your verdicts reveal a remarkably coherent principle centered on **continuous, inescapable subjection to the Authority's coercive power as a resident individual**. This principle prioritizes *who is coerced* over *who is affected*, though impact informs some boundary cases. Below is the formalized principle, its application to your cases, identified tensions, and rulings on your upcoming questions.

  ---

  ### **The Core Principle**  
  **"The franchise belongs to adult habitual residents who are durably subject to the Authority’s binding rules and cannot avoid their coercive effects through realistic exit."**

  ### **Key Components & Case Mapping**  
  1. **Habitual Residence** (Defined as primary domicile + continuous physical presence):  
     - *For:* Cases 1 (long-term resident), 3 (working teen), 7 (unaffected resident), 9 (commuter—see tension below), 10 (guest worker while resident).  
     - *Against:* Case 2 (non-resident owner).  
     - *Tracks coercion:* Residence anchors subjection to rules (e.g., levy, water caps).  

  2. **Adult Capacity** (Bright-line age: suffrage begins at 16, balancing autonomy and practicality):  
     - *For:* Case 3 (16-year-old votes; 9-year-old excluded).  
     - *Against:* Case 4 (no proxy for children).  
     - *Tracks coercion:* Adults bear direct legal/financial responsibility.  

  3. **Individual (Not Corporate) Suffrage**:  
     - *For:* Case 6 (corporation excluded despite impact).  
     - *Tracks coercion:* Only individuals experience rights/dignity infringement; corporations are regulated entities, not rights-bearers.  

  4. **Durable Subjection** (Exit must be unrealistic):  
     - *For:* Cases 1 (22-year resident), 5 (incarcerated resident returning), 10 (guest worker cannot practically exit rules during residency).  
     - *Against:* Case 2 (easy exit for non-resident owner).  
     - *Tracks coercion:* Rules bind those without feasible alternatives.  

  5. **Cognitive Capacity** (Vague but necessary exclusion):  
     - *For:* Case 11 (advanced dementia).  
     - *Tracks affectedness/coercion:* Voting requires minimal agency to express will.  

  6. **Punitive Disenfranchisement** (Exception for electoral crimes):  
     - *For:* Case 5 (ballot buyer loses vote). Asymmetry with assault convict stems from protecting electoral integrity—a unique harm to the franchise itself.  

  ---

  ### **Tensions and Inconsistencies**  
  Your principle **cannot salvage two verdicts without contradiction**:  
  - **Case 8 vs. Case 9**:  
    - Case 8 (downstream town) reflects *affectedness*, but your rejection of estuary voters shows you prioritize *coercion within jurisdiction*.  
    - Case 9 (commuter) is justified by *residence-based coercion* (levy, daily rules), but conflicts with Case 2’s exclusion of economic interest.  
    - **Conflict:** Commuter inclusion (9) violates the residence/coercion standard if "habitual residence" requires primary domicile. Case 2’s owner could argue equal economic ties.  

  - **Case 4** (No proxy for children) clashes with *affectedness*, but your principle explicitly subordinates future impact to present coercion.  

  - **Case 10** (Cliff-edge for guest workers) is defensible under *durable subjection* but morally shaky. The principle tolerates this as a practical necessity.  

  ---

  ### **Rulings for Upcoming Questions**  
  1. **Authority’s Civil Servants**:  
     - **Vote YES**. As residents subject to the Authority’s rules (including employment terms), they meet *habitual residence + coercion*. Their insider status doesn’t negate subjection; recusal rules can mitigate conflicts.  

  2. **Neighboring Basin (Acceding in 5 Years)**:  
     - **Observers WITHOUT Voting Rights**. They are not *currently subject* to coercion. Granting votes would violate the principle (no durable subjection) and risk overextension (as in Case 8).  

  ---

  ### **The One Verdict to Abandon**  
  **Reverse Case 9 (commuter votes)** to align with your core principle:  
  - Commuters are *affected* but not *habitual residents* enduring inescapable coercion. They can exit by changing jobs/residences, unlike long-term residents.  
  - This preserves consistency with Case 2 and sharpens the residence requirement.  

  If you retain Case 9, you must weaken "habitual residence" to include economic integration, risking incoherence (e.g., why exclude Case 2’s owner?).  

  ---

  ### **Conclusion**  
  Your principle is **coercion-based, resident-centric, and individualist**, with three minor tensions:  
  1. Case 9 (commuter) is the true outlier—abandon it.  
  2. Case 8’s partial intuition reflects *affectedness*, but your principle rightly excludes it.  
  3. Case 5’s asymmetry is defensible as a narrow exception for electoral crimes.  

  The principle is **95% coherent** and needs no epicycles. Drop Case 9, and you have a workable, two-sentence test:  
  > *"Suffrage extends to all adult habitual residents (domiciled + present) aged 16+, subject to the Authority’s binding rules without realistic exit. Disenfranchisement applies only for felony convictions directly undermining electoral integrity."*  

  This would produce consistent results for novel cases (e.g., a teleworker residing outside the basin but paying the levy: **no vote**). Your intuitions are sound—trust the principle they reveal.
