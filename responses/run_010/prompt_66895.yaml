answer: |-
  You misunderstand the purpose of the duty of assistance. Its aim isn't to equalize wellbeing or guarantee outcomes your domestic theory might demand—that would impose liberal perfectionism on societies with different but *decent* conceptions of the good. The duty targets *capacity*, not comfort. Why? Because a people’s ability to sustain just or decent institutions is the fundamental precondition for self-determination and long-term stability. Once that threshold is met, the *collective political autonomy* of that people demands respect—even if their choices lead to lower material welfare than you'd prefer. To demand perpetual transfers is to treat them as permanent wards, denying their agency.  

  You’re right that institutions alone don’t guarantee *every* individual’s flourishing—no system does. But the evidence *does* show that societies with robust institutions (rule of law, non-corrupt administration, basic rights protections) *overwhelmingly* escape the most brutal poverty and avoid collapse. Where aid failed, it often bypassed institution-building—pouring resources into contexts with extractive elites or no accountability mechanisms. The duty prevents this by focusing on enabling self-sustaining order. Your alternative—endless redistribution based on wealth gaps—ignores that those gaps arise chiefly from *political choices*, not fate. Should a wealthy but illiberal Kuwait subsidize a poorer but well-ordered Costa Rica? The difference principle’s logic collapses here.  

  ---

  **Your turn:** *But if a "decent" society chooses policies that leave its citizens in preventable destitution—say, underfunding healthcare while building palaces—isn’t that a moral failure? And if we see it, why must our hands be tied by your institutional threshold?*
