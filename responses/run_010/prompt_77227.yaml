answer: |-
  ### Decision Procedure for Function Attribution in High School Biology Textbooks

  This procedure operationalizes the philosophical distinction between **selected-effect (etiological) functions** (grounded in evolutionary history) and **causal-role (systemic capacity) functions** (grounded in current contributions to system operation). The core settled distinction:  
  - **Selected-effect functions** require a trait to be present *because* it was naturally selected for a specific effect.  
  - **Causal-role functions** describe a trait's current activity within a system, irrespective of evolutionary history.  
  - **Settled consensus**:  
    - Selected-effect is the dominant account in evolutionary biology for explaining *why a trait exists*.  
    - Causal-role is widely accepted in physiology/anatomy for describing *how a trait operates* without implying evolutionary origins.  
  - **Unsettled disagreements**:  
    - Whether selected-effect is the *only* legitimate account in biology (monism vs. pluralism).  
    - Whether causal-role language inherently smuggles in teleology.  
    - The procedure **does not resolve these disagreements** but flags cases where they may trigger complaints.  

  **Key Constraints**:  
  - Copyeditor has 10–15 minutes per sentence, no philosophy training.  
  - Decisions must balance scientific accuracy, readability (grade 9–12), and avoidance of teleological implications.  
  - **What the procedure cannot settle**:  
    - House policy on teleology risk-tolerance (values call).  
    - Whether a causal-role attribution is "too teleological" for the publisher's audience.  
    - Disputes about evolutionary history (requires biological expertise).  
    - Final readability judgments (requires pedagogical expertise).  

  ---

  ### Step-by-Step Procedure  
  **Tools Needed**:  
  - Glossary of common vestigial traits (e.g., human coccyx, appendix).  
  - Style guide defining "grade-level readability" (e.g., sentences ≤20 words; Flesch-Kincaid ≤10).  

  #### Step 1: **Context Check** (1–2 min)  
    - **Question**: In which section does the sentence appear?  
      - Evolutionary biology (adaptation, natural selection)?  
      - Physiology/anatomy (current organism operation)?  
      - General/introductory biology?  
    - **Decision**:  
      - **Evolutionary context**: Proceed to Step 2.  
      - **Physiology/general context**: Proceed to Step 3.  
    - **Judgment call**: Copyeditor must classify context. If ambiguous, skip to Step 6.  

  #### Step 2: **Evolutionary Context Actions** (3–5 min)  
    - **Question 1**: Is the trait **vestigial or non-adaptive** (e.g., human coccyx)?  
      - *Yes*: Rewrite into historical phrasing (e.g., "Structures like X were favored in ancestors because...").  
      - *No*: Proceed to Question 2.  
    - **Question 2**: Can the sentence be rewritten into selected-effect phrasing **without exceeding grade-level readability**?  
      - *Yes*: Rewrite into historical phrasing.  
      - *No*: Refer to subject-matter editor (Step 6).  
    - **Why**: Vestigial traits or explicit evolutionary contexts demand historical language to avoid teleology. Readability forces referral.  
    - **Judgment call**: "Vestigial" status (use glossary); readability assessment.  

  #### Step 3: **Physiology/General Context Actions** (3–4 min)  
    - **Question 1**: Is the trait **vestigial or controversial** (e.g., appendix)?  
      - *Yes*: Refer to subject-matter editor (Step 6).  
      - *No*: Proceed to Question 2.  
    - **Question 2**: Is the stated function a **well-documented, observable causal role** (e.g., heart pumping blood)?  
      - *Yes*: Keep function locution or rewrite into causal-role phrasing (e.g., "X does Y, which contributes to...").  
      - *No*: Refer to subject-matter editor (Step 6).  
    - **Why**: Vestigial traits require expert input. Non-controversial causal roles allow function locutions if readable.  
    - **Judgment call**: "Well-documented" status (use textbook/reputable sources).  

  #### Step 4: **Teleology Risk Assessment** (2 min)  
    - **Question**: Does the function locution ("function of X is Y") risk **implying design** in this context?  
      - *High risk* (e.g., trait often cited in creationist arguments): Rewrite into causal-role phrasing.  
      - *Low risk* (e.g., mundane physiological process): Keep as written.  
    - **Why**: Mitigates complaints about "smuggled teleology."  
    - **Judgment call**: Subjective risk assessment. When uncertain, default to causal-role rewrite.  

  #### Step 5: **Readability Final Check** (1–2 min)  
    - **Question**: Does the sentence meet **grade-level readability standards**?  
      - *Yes*: Proceed to output.  
      - *No*: Simplify sentence structure (e.g., split into two sentences) or refer to editor if complexity is unavoidable.  

  #### Step 6: **Referral to Subject-Matter Editor**  
    - **Refer if**:  
      - Trait is vestigial, controversial, or ambiguously adaptive (Step 2Q1, Step 3Q1).  
      - Evolutionary rewrite is unreadable (Step 2Q2).  
      - Function is not well-documented (Step 3Q2).  
      - Context is ambiguous (Step 1).  
    - **Editor signs off on**: Biological accuracy, evolutionary history, and pedagogical appropriateness.  

  #### Step 7: **House Policy Escalation**  
    - **Hand to human team if**:  
      - Step 4 (teleology risk) involves values-based trade-offs.  
      - Step 5 (readability) conflicts with accuracy.  
      - Complaints stem from irreconcilable philosophical disagreements (e.g., "causal-role is still teleological").  

  ---

  ### Application to Sample Sentences  
  **Assumptions**:  
  - Readability standard: Sentences ≤20 words; no jargon like "selected-effect."  
  - Vestigial traits list: Human coccyx (vestigial), appendix (controversial), penguin flipper (non-vestigial).  

  #### 1. "The function of the penguin's flipper is propulsion underwater."  
    - **Step 1**: Physiology context (animal locomotion).  
    - **Step 3Q1**: Trait not vestigial → Proceed.  
    - **Step 3Q2**: Propulsion is well-documented causal role (observable biomechanics).  
    - **Step 4**: Low teleology risk (penguin flippers rarely politicized).  
    - **Step 5**: Sentence is readable (8 words).  
    - **Decision**: **Keep as written** or **rewrite to causal-role** ("Penguin flippers provide propulsion underwater, aiding swimming").  
    - **Why**: Uncontroversial physiology. No referral needed.  

  #### 2. "The human coccyx functions as an attachment site for muscles of the pelvic floor."  
    - **Step 1**: Physiology context (human anatomy).  
    - **Step 3Q1**: Coccyx is vestigial (glossary).  
    - **Decision**: **Refer to subject-matter editor**.  
    - **Why**: Vestigial traits require expert input. Editor might:  
      - Rewrite historically ("The coccyx is a vestigial tail structure; in humans, it now anchors pelvic muscles").  
      - Approve causal-role phrasing with a disclaimer.  
    - **Supervisor's likely dislike**: This sentence will be flagged for referral despite being anatomically accurate. Why? Vestigial status risks implying design if phrased as a "function" without context.  

  #### 3. "The appendix functions as a reservoir that repopulates the gut with beneficial bacteria after a bout of illness."  
    - **Step 1**: Physiology context (digestive system).  
    - **Step 3Q1**: Appendix is controversial (debated adaptive value; often vestigial).  
    - **Decision**: **Refer to subject-matter editor**.  
    - **Why**: Current function is disputed (some argue it's an evolutionary remnant; others cite immune roles). Editor must verify accuracy and contextualize.  

  ### Supervisor's Disliked Outcome  
  **Sentence 2 ("human coccyx") will draw referral and likely require revision**.  
  - **Why**: The procedure flags vestigial traits as high-risk for teleology complaints. A copyeditor must refer it, even though the statement is anatomically correct.  
  - **Supervisor's concern**: This forces rewrites into historical phrasing (e.g., "The coccyx is a vestigial structure that now serves..."), which may be seen as "pushing evolution" in an anatomy section.  
  - **Procedure's limitation**: It cannot resolve the values conflict—accuracy demands acknowledging vestigiality, but house policy may prioritize simplicity. Final call goes to the editor/human team.  

  ### Procedure Summary  
  | **Step** | **Key Question** | **Outcome** | **Judgment Call?** |  
  |----------|------------------|-------------|-------------------|  
  | 1 | Context? | Evolutionary → Step 2; Physiology → Step 3 | Context classification |  
  | 2 | Vestigial? → Readable historical rewrite? | Rewrite or refer | Vestigial status, readability |  
  | 3 | Vestigial? → Causal role well-documented? | Keep, rewrite, or refer | Vestigial status, scientific consensus |  
  | 4 | Teleology risk? | Rewrite to causal-role or keep | Risk assessment |  
  | 5 | Readable? | Simplify or finalize | Readability |  
  | 6 | Referral triggers | Send to biologist | N/A |  
  | 7 | Unresolved values/policy | Escalate to human team | N/A |  

  **Output Options**:  
  - **Keep function locution**: Only for non-vestigial, low-risk causal roles.  
  - **Rewrite to causal-role**: For teleology mitigation.  
  - **Rewrite to historical**: For evolutionary contexts or vestigial traits.  
  - **Refer to editor**: For controversy, complexity, or ambiguity.  
  - **Escalate to policy team**: For philosophical/value disputes.
