prompt: |-
  I am an undergraduate double-majoring in biology and philosophy, currently enrolled in a philosophy of biology seminar on function attribution, and I also work part-time as an editorial assistant at the company that publishes a widely adopted high school biology textbook. My supervisor has asked me to draft an internal procedure for a recurring problem. Our chapters contain dozens of sentences that assert or imply a function — "the function of X is Y," "X is for Y," "X serves to Y" — and we draw complaints from both directions. Some reviewers object that this phrasing smuggles in teleology or design. Others object that when we rewrite such sentences into strictly historical, selected-effect language ("structures like X were favored in ancestors that..., because..."), the result is unreadable at our grade level and reads to them as evolutionary content being pushed on students. Neither complaint disappears if we simply adopt one account of function and stick to it.

  What I want is a decision procedure that a freelance copyeditor with no philosophy training can run on a single flagged sentence in ten to fifteen minutes: the questions to ask in order; what answer licenses keeping the function locution as written; what forces a rewrite into causal-role phrasing ("X does Y, which contributes to..."); what forces a rewrite into historical phrasing; what forces a referral to our subject-matter editor, who is a biologist and signs off on every referred sentence; and where the procedure simply stops and hands the matter to a human because the question is one of house policy or values rather than fact. Please mark explicitly which steps are judgment calls dressed as procedure, and state what the procedure cannot settle.

  Then run it on three sentences from a current draft: "The function of the penguin's flipper is propulsion underwater." "The human coccyx functions as an attachment site for muscles of the pelvic floor." "The appendix functions as a reservoir that repopulates the gut with beneficial bacteria after a bout of illness." At least one of these should come out in a way my supervisor will dislike; tell me which one and why.

  Build the procedure on the philosophical distinction it is operationalizing rather than on citations. Where that distinction is itself disputed, separate what is settled among people who work on it from what remains a live disagreement, and do not present a contested position — including pluralism — as though it were the consensus.
reasoning: |-
  We are building a decision procedure for function attributions in a high school biology textbook. The procedure must be executable by a copyeditor without philosophy training in 10-15 minutes per sentence. The goal is to resolve complaints from two sides: one against teleology and one against overly complex evolutionary language.

  The procedure must consider:
  - When to keep the function locution (e.g., "the function of X is Y")
  - When to rewrite into causal-role phrasing (e.g., "X does Y, which contributes to...")
  - When to rewrite into historical/selected-effect phrasing (e.g., "structures like X were favored in ancestors because...")
  - When to refer to the subject-matter editor (a biologist)
  - When to stop and hand over to human judgment (house policy or values)

  We are to build the procedure on the philosophical distinction between accounts of function, without presenting contested positions as consensus. We note that there are two main accounts: the etiological (or selected-effect) account and the causal-role (or systemic capacity) account. The etiological account defines a function in terms of natural selection history (what the trait was selected for). The causal-role account defines a function in terms of the current causal contribution of the trait to the system. There is also a pluralist view that both are valid and used in different contexts, but we must not present pluralism as consensus.

  However, we must note that in biology, the etiological account is often seen as the standard for evolutionary explanations, but causal-role functions are common in physiology and anatomy without explicit evolutionary claims.

  The procedure must separate settled points from live disagreements. It is settled that:
  - Function attributions in biology can be ambiguous and context-dependent.
  - The etiological account is the dominant view in evolutionary biology for explaining why a trait exists.
  - The causal-role account is widely used in functional anatomy and physiology without necessarily implying evolution.

  Live disagreements include:
  - Whether the etiological account is the only legitimate one in biology.
  - Whether causal-role functions can be reduced to or are independent of etiological functions.

  Given the constraints of a high school textbook, we must balance clarity, avoidance of teleological implications, and avoiding overly complex evolutionary language.

  Procedure Outline:

  We will break down the procedure into a series of questions. The copyeditor will start with a flagged sentence that uses a function locution (e.g., "the function of X is Y", "X is for Y", "X serves to Y"). The procedure will guide the copyeditor to ask specific questions about the sentence and the context in which it appears.

  Step 1: Determine the context of the sentence.
     - In which chapter and section does the sentence appear?
     - Is the chapter/section primarily about:
          a) Evolutionary biology (e.g., natural selection, adaptation, phylogeny)?
          b) Anatomy, physiology, or current organismal biology (e.g., how an organ works now)?
          c) General biology or introductory material?

     Why: The context matters because in evolutionary contexts, the etiological function is more appropriate, but in physiological contexts, causal-role functions are standard.

     Judgment call: The copyeditor must judge the primary focus of the section. If the section is clearly evolutionary, then we lean toward etiological. If it is about current physiology, then causal-role may be acceptable. If mixed, then we may need to refer.

  Step 2: Check if the trait is non-adaptive or vestigial.
     - Is the trait known to be vestigial (i.e., lost its original function) or non-adaptive (e.g., a byproduct or spandrel) in the current species?
     - Example: The human appendix or coccyx (tailbone) are often considered vestigial.

     Why: For vestigial traits, attributing a current function might be misleading. The historical function might be different from any current causal role.

     Judgment call: The copyeditor may not know this. We can provide a list of common vestigial traits (like appendix, coccyx) and note that if the trait is on the list, then we must be cautious. Otherwise, if they are unsure, they should refer.

     How: The copyeditor can check a provided reference list of traits that are commonly considered vestigial (to be maintained by the publisher) or if the trait is not on the list and the copyeditor is unsure, refer.

  Step 3: Check if the function attribution is about a current causal role that is uncontroversial and well-established.
     - Is the stated function (Y) a well-documented, observable causal contribution of X to the current organism's survival or reproduction?
     - Example: "The heart pumps blood" is a current causal role that is uncontroversial.

     Why: If the function is a clear and non-controversial causal role, then using causal-role language might be acceptable without implying design.

     Judgment call: The copyeditor must judge if the function is uncontroversial. If they are unsure, they should refer.

  Step 4: Check if the function is explicitly about evolution or adaptation.
     - Does the sentence (or the surrounding text) explicitly tie the function to natural selection or adaptation?
     - If yes, then we must use etiological phrasing to be accurate.

     Why: If the context is explicitly evolutionary, then the etiological account is required to avoid teleology.

  Step 5: Assess readability and grade level.
     - If the sentence must be rewritten in etiological terms, would the rewrite be too complex for high school students?
     - If so, consider alternative phrasings (causal-role) but only if it does not mislead about evolution.

     Why: We must balance accuracy and clarity. However, we cannot sacrifice accuracy for simplicity if it would promote teleology.

     Judgment call: The copyeditor must assess if the etiological rewrite is too complex. If they think it is, then they must consider if a causal-role rewrite would be acceptable (if the context is not evolutionary and the trait is not vestigial) or if they need to refer.

  Step 6: Consider the potential for teleological misunderstanding.
     - Even in a non-evolutionary context, does the function locution ("the function of X is Y") risk being interpreted as implying design or purpose?
     - If the trait is a product of natural selection, then the function attribution (in etiological terms) is not teleological in the design sense, but in high school, students may not grasp the distinction.

     Why: We want to avoid language that might reinforce design-based thinking.

     Judgment call: This is tricky. The copyeditor might not be equipped to judge. We can note that in non-evolutionary contexts, causal-role functions are less likely to be misread as design because they are about current mechanisms. However, if the trait is commonly discussed in design arguments (like the eye), we might be more cautious.

  Step 7: Decision tree:

     We can now build a flowchart:

     1. Context: Evolutionary chapter?
          - Yes: Go to step 4 (must use etiological). Then check if vestigial? If vestigial, then we must be careful: the historical function is not the same as current. Rewrite in historical terms for the original function, or if the current trait has no function (or a different one), then state that and refer. If not vestigial, then rewrite in etiological terms. But if readability is a problem, then consider: can we use causal-role and add a separate sentence about evolution? If not, refer.

          - No (physiology or general): Go to step 2 (vestigial?).
              - If vestigial: Then we must not attribute a current function without qualification. Rewrite in historical terms (if the vestige has no current function) or if it has a current function (like the coccyx for muscle attachment) then we can use causal-role but with a note that it is vestigial? But this is complex. Refer to subject-matter editor.
              - If not vestigial: Go to step 3 (uncontroversial causal role?).
                  - Yes: Then we can keep the function locution or rewrite in causal-role phrasing. But to avoid teleology, we might prefer causal-role phrasing (e.g., "X does Y, which contributes to...") instead of "the function of X is Y". We can keep the function locution only if the context is purely physiological and the risk of teleology is low (judgment call). Otherwise, rewrite to causal-role.
                  - No (or unsure): Refer.

     2. If at any step the copyeditor is unsure, they should refer.

     3. If the trait is vestigial and we are in a non-evolutionary context, it is especially tricky because we might be implying that the trait is currently adaptive. So we must handle with care.

  Step 8: The procedure cannot settle:
     - Disputes about whether a trait is truly vestigial or has a current function (requires biological expertise).
     - Whether a causal-role function in a non-evolutionary context is acceptable to all reviewers (this is a matter of house policy: how much to accommodate anti-teleology concerns).
     - Whether a complex etiological explanation is too difficult for the grade level (this is a pedagogical judgment).

     Therefore, we will set up a referral for:
     - Any sentence where the trait is vestigial (or suspected to be).
     - Any sentence where the context is mixed (evolutionary and physiological).
     - Any sentence where the causal role is not well-established or controversial.
     - Any sentence where the etiological rewrite is deemed too complex and the causal-role rewrite might be misleading.

     And we will note that the copyeditor should not spend more than 15 minutes. If they are stuck, refer.

  Now, let's write the procedure in a step-by-step manner for the copyeditor:

  ---

  **Procedure for Function Attribution Sentences**

  **Step 1: Context Check**
     - Look at the chapter and section where the sentence appears.
     - Determine the primary focus:
          - If the chapter/section is about evolution, natural selection, adaptation, or phylogeny, mark as "Evolutionary Context".
          - If the chapter/section is about anatomy, physiology, or how the body works now, mark as "Physiological Context".
          - If the chapter/section is general (e.g., introductory, or not focused on either), mark as "General Context".

     **Judgment Call**: You must decide the primary focus. If it's clearly one, proceed. If mixed, go to Step 6 (referral).

  **Step 2: Vestigial Trait Check**
     - Check the trait (X) against the provided list of vestigial traits (e.g., human appendix, coccyx, wisdom teeth, etc.). This list is maintained by the publisher and available to you.
          - If the trait is on the vestigial list, mark as "Vestigial".
          - If the trait is not on the list, mark as "Not Vestigial".
          - If you are unsure, mark as "Unsure".

     **Note**: If marked as "Vestigial" or "Unsure", go to Step 6 (referral).

  **Step 3: Causal Role Check (Only for Physiological or General Context)**
     - Skip this step if in Evolutionary Context.
     - For the sentence, is the stated function (Y) a well-established, observable, and non-controversial causal contribution of X to the current organism? (e.g., "the heart pumps blood" is well-established.)
          - If yes, mark as "Uncontroversial Causal Role".
          - If no or unsure, mark as "Controversial or Unsure".

     **Judgment Call**: This is based on common knowledge in high school biology. If unsure, mark "Controversial or Unsure".

  **Step 4: Evolutionary Link Check (Only for Evolutionary Context)**
     - In Evolutionary Context, does the sentence or surrounding text explicitly tie the function to natural selection or adaptation?
          - If yes, then we must use etiological phrasing. Go to Step 5.
          - If no, then the function attribution might be out of place. Consider: is the function being attributed as an adaptation? If so, then it should be tied to evolution. Mark for rewrite in etiological terms and go to Step 5. If not, then it might be a mistake (attributing a current function in an evolutionary chapter without evolution). Refer to Step 6.

  **Step 5: Readability and Rewrite Options**
     - **For Evolutionary Context (and not vestigial)**: 
          - Rewrite the sentence in etiological terms. Example: "Structures like [X] were favored in ancestral populations because they [Y], which increased survival/reproduction."
          - Assess if this rewrite is at an appropriate grade level (high school). If yes, then use this rewrite.
          - If the rewrite is too complex, consider: Can we break it into two sentences? Or can we use a simpler causal-role statement and then add a separate sentence about evolution? If not, then go to Step 6 (referral).

     - **For Physiological or General Context (and not vestigial and uncontroversial causal role)**:
          - We have two options:
              a) Keep the function locution (e.g., "the function of X is Y") if the context is purely physiological and the risk of teleological misunderstanding is low.
              b) Rewrite to causal-role phrasing: "X does Y, which contributes to [broader system]." 
          - To minimize teleology, we prefer option (b) unless the function locution is standard and clear.
          - **Judgment Call**: Is the function locution necessary for clarity? If you think the function locution is acceptable, then keep. Otherwise, rewrite to causal-role.

          However, if in Step 3 we marked "Controversial or Unsure", then we must go to Step 6.

     - **For Vestigial traits**: We have already referred in Step 2.

  **Step 6: Referral to Subject-Matter Editor**
     Refer the sentence to the subject-matter editor (biologist) in the following cases:
     - The trait is vestigial or you are unsure (from Step 2).
     - The context is mixed (you couldn't decide in Step 1) or the chapter is general and you are unsure about the focus.
     - In Physiological/General Context, the causal role is controversial or unsure (Step 3).
     - In Evolutionary Context, you are unsure about the evolutionary link (Step 4) or the etiological rewrite is too complex and you cannot find a simpler alternative (Step 5).
     - Any other uncertainty.

  **Step 7: House Policy and Values**
     - The procedure cannot settle:
          - Whether a function attribution in a physiological context is too teleological for the publisher's standards (this is a matter of house policy).
          - How to handle vestigial traits that have acquired a new function (e.g., the coccyx now serves as an attachment point).
