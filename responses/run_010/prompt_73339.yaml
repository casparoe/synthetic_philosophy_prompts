prompt: |-
  I cover AI and the general science-and-ideas beat for a weekly magazine — curious readers, no formal logic in the room, and my own logic course was fifteen years ago. Roughly four or five items a week land in my inbox whose entire hook is that some system evaluates itself: an agent that checks a planned action against its own written charter and only proceeds if the check passes, a model that "grades its own homework" and reports the score, two agents that cooperated because each one verified what the other would do, a robot that derives a proof its maneuver is safe before executing it. My problem is that I can't reliably tell apart (a) a genuine result, (b) a genuine result wrapped in language that implies far more than was shown, and (c) nothing at all. I do have a rough sense there's a standing formal difficulty with an agent trusting its own reasoning — something like: you can't get to "whatever I end up concluding is true" without already having established the thing, so a system that gates its actions on its own verdict hasn't obviously bought itself any reliability. If that's a garbled version of the real point, fix it before you build anything on top of it.

  What I need is a triage procedure I can run on one of these items in twenty minutes, in order, with the questions I should be asking of the press release or preprint, what counts as a sufficient answer to each, and where it terminates in "kill it" versus where it hands the call to my editor because what's left is a news-value question rather than a truth question. It should tell me what to do in the two situations I'm actually in most weeks: the company won't answer follow-ups, and I can't inspect the system or reproduce anything. It should also be honest about which steps are judgment calls wearing a procedure costume — I'd rather know which rung of the ladder I'm making up.

  Constraints worth knowing. I get maybe three emailed questions to a research group before they stop replying, so if the procedure generates questions, rank them. My editor has less time than I do and won't be checking my reasoning, so anything the procedure flags has to be something I can state in one plain sentence. And our desk has a standing rule I don't want the procedure to quietly override: we don't run a capability claim whose only evidence is the claiming lab's own evaluation of its own system, unless the story is precisely that the evaluation is self-referential.

  Then run it on three items:

  1. A startup's demo where the agent writes out a justification that its planned action complies with its charter, and acts only if that justification is accepted. The acceptance is performed by the same model, same weights, different prompt. They call it self-verification and want it in the headline.
  2. A preprint where two computationally limited agents playing a one-shot cooperation game cooperate at a surprisingly high rate, described as each agent having verified the other's behavior. Reading closely, the cooperation seems to depend on both agents knowing an upper limit on how long a derivation the other one will search, and that limit was set by the experimenters.
  3. The one I don't want to hear: a widely used evaluation setup where a model scores outputs generated by models from its own family, and I've been circling a takedown arguing the whole thing is circular in the self-trust sense. If the procedure says that framing is wrong — that it's a different kind of problem entirely, not a proof-theoretic one — say so flatly, and tell me what the correct objection would be instead, because I'd rather be right than get the piece.

  For each of the three: give me the verdict the procedure produces (kill / run it with a specific reframing / needs one more question before you can tell), the one sentence I could actually put in print, and which single question of my three I'd spend on it.

  Finally, tell me where this procedure will misfire. I'm especially worried about it over-flagging — treating any use of the words verify, check, or validate as an alarm — and about the case where the "independent verifier" turns out to be the same company's bigger model, where I suspect the distinction the procedure leans on doesn't so much resolve as relocate.
reasoning: |-
  We are designing a triage procedure for claims about systems that "evaluate themselves". The core challenge is distinguishing genuine results from overhyped or invalid ones. The key insight from logic is that an agent cannot bootstrap trust in its own reasoning without some prior foundation (like Löb's theorem: if a system can prove that "if it proves P, then P is true", it can prove any P). However, in practice, many systems use limited forms of self-checking that might be valid in context.

  The procedure will be a step-by-step checklist. We'll structure it as a decision tree with questions. We have limited time and limited follow-up questions (max 3 per item). The goal is to classify each item as:
  - Kill: not worth running, or fundamentally flawed.
  - Run with reframing: the core is valid but the hype is misleading; we reframe to what was actually shown.
  - Needs one more question: after one more answer, we can decide.

  We also have the constraint that we don't run capability claims based solely on self-evaluation by the same lab, unless the story is about the self-referentiality.

  Procedure Steps:

  1. **Identify the claim**: What exactly is the system claiming to do? Extract the self-evaluation step: what is being verified, by what, and what action is taken based on that?

  2. **Check for independent verification**: Is the verification done by an independent entity? 
     - Independent: separate system (different model, different weights, not just a prompt) that was not trained or set up in a way that it shares the same biases or limitations. If yes, then it's not self-verification in the problematic sense. Proceed to step 3.
     - Not independent: same model or a closely related one (same family, same training data). Then we must be cautious. Proceed to step 4.

  3. **For independent verification**:
     - Ask: Is the independent verifier known to be reliable? (e.g., it's a well-established model, or it was validated externally?) 
       - If yes, then the claim might be valid. Proceed to step 5.
       - If no, then we are replacing self-verification with an unverified verifier. This is just relocating the problem. Proceed to step 4.

  4. **For non-independent or unverified verifier**: 
     - This is the critical step for the self-trust issue. We must determine if the system is making a global claim of reliability (like "this makes the system safe") or a local one (like "this is a heuristic that sometimes helps").
     - Ask: What evidence is provided that the self-verification step actually improves reliability? 
       - If they have empirical results (e.g., they tested the system with and without self-verification and showed improvement on some benchmark), then the self-verification is being used as a heuristic. That might be valid. Proceed to step 5.
       - If they have no such evidence and are claiming that the self-verification step guarantees correctness (or safety, etc.), then it's likely invalid due to the self-trust problem. Kill the story unless the story is about the self-referentiality.

  5. **Check for hidden circularity**: Even if there's evidence of improvement, we must check if the evaluation is circular. 
     - For example, if a model grades its own homework and then that grade is used to claim the model is better, but the benchmark was also generated by the same kind of model, that's circular. 
     - Ask: How was the system evaluated? Were the evaluation benchmarks independent (human judges, standard benchmarks, etc.)? 
       - If independent, then the claim might be valid. Proceed to step 6.
       - If not, and the evaluation uses the same kind of self-verification, then it's circular. Kill the story unless the story is about the circularity.

  6. **Assess the significance**: Even if the method is valid, is the result significant? 
     - We are not experts, so we rely on the paper's claims and our editorial judgment. But if it passed steps 1-5, then it's at least not fundamentally flawed. We can run it, but we must reframe to the actual evidence: e.g., "a new method that uses X to sometimes improve Y, as shown by benchmark Z".

  We must be cautious of:
     - Over-flagging: Not every use of "verify" is bad. We are only concerned when the verification is used to make a strong guarantee and there's no independent validation.
     - The "bigger model" issue: If the verifier is a bigger model from the same company, that's not independent. It's just moving the trust to a different model that might have the same biases. We treat it as non-independent.

  Now, let's apply this to the three items.

  ### Item 1: Startup demo with self-verification
  - **Claim**: Agent writes a justification that its planned action complies with its charter. The same model (same weights) with a different prompt checks the justification and only acts if accepted.
  - **Procedure**:
    1. The verification is done by the same model, same weights -> non-independent.
    2. We go to step 4: What evidence is provided that this improves compliance?
       - From the description, it's a demo. Likely no rigorous evaluation. The claim is that this provides a guarantee (they call it self-verification and want it in the headline, implying reliability).
       - Without evidence of improvement, and because it's non-independent and making a strong claim, this is exactly the self-trust problem.
    3. Step 5: Not applicable because we are already at step 4 without evidence.
    4. **Verdict**: Kill. The self-verification does not provide the guarantee they claim due to the fundamental issue of self-trust. Without independent evidence of improvement, it's just a demo.
    5. **One sentence for print**: Not applicable since we kill it, but if we had to explain: "The method relies on the same AI model checking its own reasoning, which does not inherently guarantee safety or compliance."
    6. **Question to spend**: We don't have to spend a question because we can see from the demo description that there's no evidence provided. But if we had to ask one: "What evidence do you have that this self-verification procedure actually reduces non-compliant actions compared to not using it?" If they have none, kill. If they do, then we might reconsider, but the non-independence remains a problem.

  ### Item 2: Preprint about two agents cooperating
  - **Claim**: Two computationally limited agents cooperate at a high rate because each verified the other's behavior. The cooperation depends on an upper limit on derivation length set by the experimenters.
  - **Procedure**:
    1. The verification: Each agent verifies the other's behavior. The verification is done by the other agent? But note: they are two separate agents, so it's independent? Not exactly: each is verifying the other's intended behavior by simulating the other's reasoning (which is limited by the experimenter-set bound).
    2. Step 2: The verifier for agent A is agent B, which is a separate system? But they are both created by the same experimenters, and they are both limited in the same way (same architecture? same training?). The problem says they are computationally limited and the bound is set by the experimenters. So they are independent in the sense of being separate instances, but they are identical in design and limitations. This is a gray area. We'll call it non-independent for the purpose of the trust issue because they share the same limitations and were designed by the same team.
    3. Step 4: What evidence is provided? They have a result: high cooperation rate. That's empirical. They are not claiming that the verification guarantees cooperation, just that in their setup it leads to cooperation. The preprint likely shows the cooperation rate and compares to baselines? The key is that they are not using the verification to make a global guarantee but showing an empirical result in a controlled setting.
    4. Step 5: How was it evaluated? The evaluation is by the experimenters in a simulated game. There's no circularity because the outcome (cooperation or not) is objective. The verification step is part of the method, and the outcome is measured independently.
    5. Step 6: The result is about how, under specific conditions (with the bound set by the experimenters), these agents can achieve cooperation. This is a valid finding in game theory or multi-agent systems. The self-verification aspect is a bit hyped because the bound is set externally, but the core result is sound.
    6. **Verdict**: Run with reframing. The story should not say "each agent verified the other" as if that is a general solution, but instead: "In a controlled setting with pre-set limits, agents achieved high cooperation by checking each other's reasoning."
    7. **One sentence for print**: "Researchers demonstrated that two AI agents, designed with fixed computation limits, can cooperate at high rates by each verifying the other's intended action within those limits."
    8. **Question to spend**: None needed if the preprint clearly states the setup. But if unclear, we might ask: "Is the cooperation rate compared to a baseline without the verification step?" (to ensure the verification is the cause). But the procedure says we have limited questions, and the preprint likely has that.

  ### Item 3: Evaluation setup where a model scores outputs from its own family
  - **Claim**: A widely used evaluation setup. The takedown argues it's circular because of self-trust.
  - **Procedure**:
    1. The verification: A model scores outputs from models of the same family. This is non-independent (same family, same training data distribution).
    2. Step 4: What evidence is there that this scoring is reliable? The setup is used for evaluation, so the claim is that the scores are meaningful. But without independent validation, it's circular? However, note that in practice, these evaluations are often correlated with human judgments. So we must check: is there evidence that the model's scoring correlates with independent measures?
    3. Step 5: How was the evaluation method validated? Typically, these methods are validated by comparing the model scores with human scores on a benchmark. If that was done, then it's not circular because the method was validated independently. But if the only validation is against other model-generated scores, then it is circular.
    4. The takedown might be missing that the method was originally validated by humans. But if the method is now being used without that anchor, then it could drift.
    5. **Verdict**: The framing of the takedown as a "self-trust" issue in the proof-theoretic sense might be wrong. The problem is more about **correlation decay** or **distributional shift**: if the model is used to score outputs that are different from the ones in the validation set (e.g., from a more advanced model), the correlation might break. The correct objection is that the evaluation may not be valid when applied to models that are more capable or different from the ones in the validation set.
    6. **One sentence for print**: If we run the takedown, we should reframe: "The evaluation method, which uses an AI model to score outputs from similar models, may produce unreliable results if the models being evaluated are significantly different from those used in the method's validation."
    7. **Question to spend**: We don't have a specific research group, but if we are writing about the takedown, we should check: "Was the evaluation method validated against human judgments, and if so, on what range of models?" If it was only validated on a limited set, then the objection holds. If it was validated on a wide range and the correlation holds, then it's less of an issue.

  **Verdict for Item 3**: Run with reframing. The problem is not self-trust in the logical sense, but the potential lack of generalization of the evaluation method. We should change the takedown accordingly.

  ### Where the procedure misfires
  - **Over-flagging**: It might flag any use of self-verification. But sometimes self-verification is just a heuristic and shown to work empirically. We try to account for that in step 4 by requiring evidence of improvement. However, if the evidence is weak (e.g., a small demo), we might still kill a valid heuristic. We must be cautious about the strength of the claim.
  - **Bigger model issue**: If the verifier is a bigger model from the same company, we treat it as non-independent. But sometimes bigger models are more reliable. However, without independent validation, we cannot be sure. The procedure will flag it, which is appropriate because the trust is still placed in a model from the same source. The only way to avoid this is to require independent validation (step 3 and step 5). 
  - **Misclassifying independence**: In multi-agent systems (like item 2), if the agents are independently designed and trained, then they might be independent. But if they are from the same training process, they might share biases. We assume non-independence for same-family models, but for agents we have to look at the design. This is a judgment call.

  Overall, the procedure is designed to be quick and conservative. It prioritizes avoiding false positives (publishing invalid claims) over false negatives (killing valid ones). Given the constraints, it should help the journalist triage effectively.
answer: |-
  Below is a triage procedure designed for your constraints (20-minute assessment, 3 email max, plain-sentence flags, no override of the desk rule). It focuses on **independence of verification**, **evidence of real-world impact**, and **circularity in claims vs. evaluation**. The core insight: systems can't *guarantee* correctness via self-checking (due to [Löb's theorem](https://en.wikipedia.org/wiki/L%C3%B6b%27s_theorem) in logic: "If this system proves its own actions are safe, it might prove anything"). But they can *empirically improve reliability* if grounded in external validation.

  ---

  ### **Triage Procedure**  
  *(Run these steps in order; stop at first "Kill" or "Reframe" verdict)*  
  **Key Judgment Calls** 🔍: Steps 2, 4, and 5 (marked below). These rely on your interpretation of "independent," "evidence," and "circularity."  

  1. **What is claimed?**  
     - Extract: What does the system "verify" (e.g., safety, correctness, compliance)? What action is gated on this?  
     - ⚠️ *Red flag*: Words like "guarantee," "certify," or "ensure" in the claim.  
     - *If unclear, kill*.  

  2. **Is verification independent?** (🔍 Judgment call)  
     - Ask: **"Is the verifier separate from the system being verified? (Different model, weights, training data, or external benchmark?)"**  
       - ✅ *Independent*: Human, external tool, model from unrelated system, or validated benchmark. → Proceed to Step 5.  
       - ❌ *Not independent*: Same model (even with different prompts), same model family, same lab's other model, or self-generated criteria. → Proceed to Step 3.  

  3. **Non-independent verification? → Does it claim a guarantee?**  
     - Ask: **"Does the claim imply this makes the system safer/correct (e.g., 'prevents harm'), or is it framed as an empirical improvement?"**  
       - ✅ *Empirical claim* (e.g., "reduced errors by X% in tests"): → Proceed to Step 4.  
       - ❌ *Guarantee claim* (e.g., "ensures alignment"): → **Kill**. *Reason: Self-verification can't prove reliability without external grounding (Löb's theorem).*  

  4. **Is there evidence beyond self-evaluation?** (🔍 Judgment call)  
     - Ask: **"Was the system tested against independent benchmarks or human evaluations?"**  
       - ✅ *Yes*: Results compared to baselines/humans. → Proceed to Step 5.  
       - ❌ *No*: Only self-checked metrics or no comparison. → **Kill**. *Reason: Violates desk rule (sole evidence is lab's self-evaluation).*  

  5. **Is evaluation circular?** (🔍 Judgment call)  
     - Ask: **"Could the verification method falsely reward its own flaws? (e.g., verifier trained on outputs from similar systems)"**  
       - ✅ *Not circular*: Tested on diverse/real-world data, human evals, or unrelated benchmarks. → **Run with reframing**.  
       - ❌ *Circular*: Verifier trained/evaluated on data from same family or task. → **Kill** unless story is about circularity.  

  **Outputs**:  
  - **Kill**: Fundamental flaw (self-guarantee, no evidence, circularity).  
  - **Run with reframing**: Valid *empirical* result but overhyped. Frame as: "This helped in [specific test], but not foolproof."  
  - **Needs question**: Only if Step 2/4/5 is unclear *after reading closely* (prioritize questions below).  

  **Question Ranking** (if needed):  
  1. Step 2: *"Is the verifier independent (different model/data)?"*  
  2. Step 4: *"Was there external testing (e.g., humans or benchmarks)?"*  
  3. Step 5: *"Could the verifier reward its own flaws?"*  

  **Where it misfires**:  
  - **Over-flagging**: Rare. Only flags "verify/check" if paired with *guarantee claims* (Step 3) or *no evidence* (Step 4). Heuristics like "model checks its math" often pass if empirically tested.  
  - **"Bigger model" issue**: Correctly flagged as non-independent (Step 2). This *relocates* trust but doesn't resolve it (unless externally validated in Step 4).  
  - **False negatives**: May miss subtle circularity (e.g., verifier trained on "cousin" models). Step 5 catches most cases.  

  ---

  ### **Applied to Your Three Items**  

  #### **Item 1: Startup's "self-verification" agent**  
  - **Triage**:  
    1. Claim: Agent checks compliance via same model/different prompt → **Not independent** (Step 2).  
    2. Language: "Self-verification" in headline implies guarantee → **Kill** (Step 3).  
  - **Verdict**: **Kill**.  
  - **One sentence**: *"The system uses the same AI model to check its own actions, which cannot inherently guarantee safety."*  
  - **Question to spend**: None (verdict clear from materials).  

  #### **Item 2: Preprint on cooperating agents**  
  - **Triage**:  
    1. Claim: Agents verify each other → **Not independent** (same lab/setup; Step 2).  
    2. Framing: Empirical result ("cooperated at high rate") → Proceed (Step 3).  
    3. Evidence: Experimenters set limits/tested cooperation → **External testing** (Step 4 ✅).  
    4. Circularity? Outcome is objective (cooperation yes/no) → **Not circular** (Step 5 ✅).  
  - **Verdict**: **Run with reframing**.  
  - **Reframe sentence**: *"In a controlled game, agents with pre-set computation limits cooperated more often when checking each other’s plans—but only under lab-defined constraints."*  
  - **Question to spend**: None.  

  #### **Item 3: Model evaluating its own family**  
  - **Triage**:  
    - The takedown’s "self-trust" framing **is wrong**. Löb’s theorem doesn’t directly apply—this isn’t a *single system* gating actions on self-proof.  
    - **Correct objection**: *Correlation decay under distribution shift*. If the model family evolves, today’s evaluator may not reflect reality.  
  - **Verdict**: **Run with reframing** (if takedown is rewritten).  
  - **Reframe sentence**: *"Using AI models to evaluate similar models risks circularity, as they may share biases or fail on new tasks—not due to logic paradoxes, but outdated benchmarks."*  
  - **Question to spend**: Ask authors: **"Was the evaluator validated against human judgments for newer models?"** (Step 5).  

  --- 

  **Final Notes**  
  - **Kill rate**: High by design. Most self-verification claims fail at Step 3 (guarantees) or Step 4 (no external tests).  
  - **Time saver**: 80% of items die at Step 2/3. Focus questions on Step 4 (evidence) when needed.  
  - **Your worry**: The procedure *intentionally* flags "bigger model" and "same family" as non-independent. This is a feature—it forces the lab to provide external evidence or admit limitations.
