prompt: |-
  I TA an upper-level Kant course and next week I'm running the review session for the final, which is one long case. I want to predict what the prof will say without telling 60 students something she'd flatly contradict, and prepping I've realized her rulings this term fit more than one account of what the universal law test is even supposed to be doing.

  Here's the record:

  - "I'll borrow money by promising to repay it, knowing I won't" — impermissible, contradiction in conception, perfect duty. The textbook one.
  - "I'll cut to the front of the food truck line because I'm late" — impermissible, perfect. Someone objected that they'd be fine in a world where everyone cut lines, they'd just eat later, and she said that misses it: your maxim is to be served ahead of people who waited, and that's precisely what can't hold up when everyone has it.
  - "I'll keep drinking the office coffee without ever putting money in the jar" — impermissible, perfect.
  - "I'll never help anyone with anything, ever" — impermissible, but contradiction in the will, imperfect duty. She stressed that turning down one particular request on one particular day is fine; it's the maxim that's condemned.
  - "I'll sell my apartment now while prices are at their peak" — permissible. A student said if everyone sold at once prices would crash and she'd get nothing, and she called that a composition fallacy rather than a Kantian objection — nobody's exempting themselves from anything there, everyone in the market is doing the same kind of thing.
  - "I'll learn to code instead of the violin" — permissible, even though if everyone made that choice there'd be no violinists.

  Two other things worth knowing. When a student tried to rescue the false promise by re-describing the maxim as "say whatever gets me the money," she wasnt having it — too thin to be a maxim at all. But in the food truck case she re-described the maxim herself, unprompted. So she has some constraint on which descriptions are admissible and I cant tell what it is. And when someone said the test can't be about what would happen if everybody did it, since conceiving something and willing it aren't the same operation, she said that was the right question and then moved on.

  The final's case is already posted. A well-known epidemiologist gets an email from a reporter asking her to comment on a claim about a vaccine that's circulating online. She declines. Her reasons: she's published three papers saying the opposite, the quote will get garbled anyway, and the afternoon is better spent finishing her actual work. The exam states the maxim as "I'll decline to speak publicly on matters in my expertise, since I've already contributed what I know and my time is better spent elsewhere."

  So: predict her verdict, and if it's impermissible, which species — contradiction in conception or in the will, perfect or imperfect duty. Then the part I actually need. Lay out the candidate rules that are consistent with all six precedents (I can see at least a practice-preservation one, a making-an-exception-of-myself one, and one about what a rational being has to will whether or not this particular agent gives a damn), say what each delivers on the epidemiologist, and tell me which you'd bet on and why. Which precedent is the closest analog — and is the composition-fallacy move she made on the apartment available here too, given she's already published? Finally, give me one further case I could put to the class that would best separate whatever rules survive, with each rule's prediction about it: something where they genuinely come apart, not another one they all rule the same way.
reasoning: |-
  Okay, the user is a TA for an upper-level Kant course and needs help predicting the professor's verdict on a case study for the final exam. They've provided six precedent cases from the course with the professor's rulings and specific details about her approach. The main challenge is reconciling these rulings into a coherent framework to predict the epidemiologist case outcome without contradicting the professor.

  First, I need to understand the patterns in the precedents. The false promise, food truck cutting, and office coffee cases are all classified as impermissible with perfect duty due to contradictions in conception. The never-help maxim is impermissible but contradiction in the will, leading to imperfect duty. The apartment sale and learning to code are permissible. 

  Key observations: The professor rejects composition fallacies (as seen in the apartment case) and insists on maxims that capture the agent's true intention. She also rephrases maxims when they're too vague, like in the food truck case, emphasizing the core exception-making element. 

  For the epidemiologist's maxim ("I'll decline to speak publicly on matters in my expertise..."), I need to assess if this involves making an exception for oneself. Unlike the false promise or line-cutting, the epidemiologist isn't exempting herself from a system she depends on. She's contributed via publications and prioritizes ongoing work, which might align with the permissible cases. The closest analog is the apartment sale—both involve individuals acting within a functional system without undermining it.

  The user also wants candidate rules that fit all precedents. Three possibilities: Practice-Preservation (focuses on whether the maxim destroys a practice if universalized), Exception-Making (centers on exempting oneself from a rule one expects others to follow), and Essential Social Functions (asks if universalization undermines necessary societal structures). 

  For the epidemiologist, Practice-Preservation and Exception-Making likely permit it, while Essential Social Functions might lean toward impermissibility if public expertise is deemed essential. I'd bet on Exception-Making as the professor's primary criterion, given her emphasis in the food truck case. 

  To test these rules, a case where they diverge could be: "I'll never vote in elections because my individual vote doesn't matter." Practice-Preservation forbids this (voting collapses if universalized), Exception-Making permits (no exemption if no one votes), and Essential Social Functions forbids (voting is essential). This cleanly separates the rules. 

  The user's deeper need is to confidently predict the professor's stance without misguiding students. They need a framework that accounts for all precedents, especially the professor's rejection of composition fallacies and her focus on maxim formulation. Highlighting the distinction between undermining practices vs. individual choices is crucial here.
answer: |-
  Based on the precedents and the professor's methodology, here's the prediction and analysis for the epidemiologist case, along with the framework for the review session:

  **Prediction for Epidemiologist Case: PERMISSIBLE** (likely *not* creating a contradiction in conception or will). Here's why:

  1.  **No Self-Exemption:** The maxim isn't about exempting herself from a rule she expects others to follow (like cutting in line or skipping coffee payments). She's not relying on others *continuing* to speak publicly while she opts out. Her reasoning ("already contributed," "time better spent") focuses on her specific contribution and efficiency, not parasitism.
  2.  **Not Destroying the Practice:** Unlike the false promise (which destroys trust needed for promises) or skipping coffee payments (which destroys the coffee fund), declining *this specific* request doesn't inherently destroy the practice of scientific communication. Her prior publications *are* contributions. Universalizing her maxim ("*everyone* will decline *after* they've contributed what they know and believe their time is better spent elsewhere") doesn't immediately annihilate scientific discourse. It might change its form (less reactive commentary, more deliberate publication), but the core function *could* persist rationally. This resembles the "apartment sale" reasoning.
  3.  **Composition Fallacy Available:** The argument "If everyone declined, no one would get expert info" is a composition fallacy *in this specific framing*, similar to the apartment sale. The epidemiologist isn't refusing to contribute *ever* (she published); she's refusing *this specific mode* of contribution *at this time*. Universalizing her maxim doesn't mean *no one ever shares knowledge*; it means experts prioritize *how* and *when* they share based on prior contribution and efficiency. The system *could* function (perhaps with different norms).
  4.  **Analog to Apartment Sale/Learn to Code:** Like selling an apartment (a permissible market choice) or choosing coding over violin (a permissible career choice), this is a permissible choice about *how* to allocate one's expertise and time within a broader functional system. She's not undermining the essential precondition of the system she relies on.
  5.  **Maxim Description:** The stated maxim ("I'll decline to speak publicly on matters in my expertise, since I've already contributed what I know and my time is better spent elsewhere") is sufficiently thick. It includes the *condition* ("since...") and the *action* ("decline"). The professor would likely accept this description as capturing the agent's reason, unlike the "too thin" false promise rescue.

  **Species of Duty:** If impermissible, it would likely be **Contradiction in the Will (Imperfect Duty)**, arguing that a rational being *must* will some mechanism for timely expert communication in emergencies (even if not this specific request). However, the precedents and reasoning above strongly suggest **Permissible**.

  **Candidate Rules Consistent with All Six Precedents:**

  1.  **The Practice-Preservation Test (PPT):**
      *   **Rule:** An action is impermissible (contradiction in conception/perfect duty) if universalizing the maxim would destroy a *practice or system* that the agent's success *logically depends upon* or that rational agents *must* will to exist. Otherwise, if universalizing makes achieving a rationally necessary end impossible, it's contradiction in will/imperfect duty.
      *   **Precedents:**
          *   False Promise: Destroys trust needed *for promising itself* (contradiction in conception).
          *   Food Truck Cutting: Destroys the practice of orderly queuing needed for fair distribution (agent depends on queue *functioning* for others to wait) (contradiction in conception).
          *   Office Coffee: Destroys the coffee fund practice (contradiction in conception).
          *   Never Help: Doesn't destroy a practice, but makes achieving help *when needed* impossible for the agent (contradiction in will).
          *   Sell Apartment: Universal selling doesn't destroy the *market* system itself; it just changes prices within it. No dependence destroyed.
          *   Learn to Code: Doesn't destroy any system the agent depends on for *learning a skill* or society depends on for *having skills*.
      *   **Epidemiologist:** *Permissible.* Universalizing doesn't destroy the practice of scientific communication *if* prior publication counts as contribution. The system could adapt (e.g., rely more on pre-published work). She doesn't *logically depend* on others doing reactive commentary while she abstains.

  2.  **The Self-Exemption Test (SET):**
      *   **Rule:** An action is impermissible (contradiction in conception/perfect duty) if the maxim involves making an *exception for oneself* from a rule one *nevertheless wills* (or benefits from) others following. If the maxim involves refusing to contribute to a rationally necessary end (without self-exemption), it's contradiction in will/imperfect duty.
      *   **Precedents:**
          *   False Promise: Exempts self from truthfulness while relying on others' belief in promises (self-exemption).
          *   Food Truck Cutting: Exempts self from waiting while relying on others waiting to create the line/service (self-exemption).
          *   Office Coffee: Exempts self from paying while relying on others paying to fund the coffee (self-exemption).
          *   Never Help: Doesn't exempt self from others helping *her*; it simply refuses to help. Condemned because rational beings must will help *sometimes* (contradiction in will).
          *   Sell Apartment: No self-exemption. Everyone is following the same market logic.
          *   Learn to Code: No self-exemption. Just a personal preference.
      *   **Epidemiologist:** *Permissible.* She is *not* exempting herself from a rule she expects others to follow regarding *this specific action* (speaking to this reporter). She isn't relying on others doing it while she abstains *in this instance*. Her prior work shows contribution.

  3.  **The Essential Social Function Test (ESFT):**
      *   **Rule:** An action is impermissible (contradiction in conception/perfect duty) if universalizing the maxim would destroy a *social function essential for rational agency itself* (e.g., promising, property, truthfulness, basic order). If it destroys a condition necessary for achieving *specific* rationally necessary ends (like mutual aid), it's contradiction in will/imperfect duty.
      *   **Precedents:**
          *   False Promise: Destroys trust essential for commitment (essential function).
          *   Food Truck Cutting: Destroys orderly access to goods (essential for planning/agency).
          *   Office Coffee: Destroys a small-scale property/integrity system (micro-essential function).
          *   Never Help: Destroys a condition for achieving flourishing/happiness (non-essential for basic agency, but rationally willed).
          *   Sell Apartment: Market fluctuations are inherent; doesn't destroy the essential function of property exchange.
          *   Learn to Code: Cultural goods like violin music aren't *essential* for rational agency.
      *   **Epidemiologist:** *Toss-up, leaning Impermissible (Contradiction in Will?)*. Could argue that *reliable, accessible expert communication* is essential for public health/rational public discourse (especially epidemiology!). Universal refusal *after initial contribution* might cripple this. Closer to "Never Help" as imperfect duty? But her prior work complicates this. This rule struggles most cleanly with the precedents (esp. coffee jar).

  **Bet and Why:** I'd bet heavily on the **Self-Exemption Test (SET)** being the professor's primary rule.

  *   **Why SET?** It perfectly explains the emphasis in the food truck case ("your maxim is to be served *ahead of people who waited*") and the rejection of the composition fallacy in the apartment case. It directly addresses the "making an exception for yourself" intuition central to Kantian ethics. It cleanly handles all 6 cases and explains why the epidemiologist's maxim is permissible – she's not exempting herself from a rule others follow re: this request.
  *   **PPT** is a close second, but the coffee jar feels slightly less "essential" than promising or queues. SET captures the core moral failing more directly.
  *   **ESFT** seems less likely; it struggles with the coffee jar's "essentialness" and makes the epidemiologist case murkier than the precedents suggest.

  **Closest Analog:** The **Selling Apartment** case is the closest analog. Both involve individual choices within a functional system where universalization changes outcomes but doesn't inherently destroy the system or involve self-exemption from a rule one wills for others. The "already published" point parallels the apartment seller acting within market norms.

  **Composition Fallacy Availability:** **Yes, absolutely available.** The objection "If everyone did this, no one would speak out!" commits the same fallacy as "If everyone sold, the market crashes." The epidemiologist's maxim *is conditional* ("since I've already contributed..."). Universalizing means *everyone who has already contributed and thinks time is better spent elsewhere* declines. This does not entail *no one ever speaks*; it entails experts speak *when* they deem it most effective/necessary after initial contribution. The system *could* function.

  **Separating Case: The "Free Rider" Park Maintainer**

  *   **Maxim:** "I'll enjoy this beautiful public park without ever contributing to its maintenance (taxes, volunteer days), since others will keep it nice and my money/time is better spent on myself."
  *   **Predictions:**
      *   **PPT:** *Impermissible (Contradiction in Conception).* Universalizing destroys the public park system (no funding/maintenance).
      *   **SET:** *Impermissible (Contradiction in Conception).* Clear self-exemption: relies on others contributing while exempting self.
      *   **ESFT:** *Impermissible (Contradiction in Conception).* Destroys a non-essential but rationally desirable public good function (could argue either way, but likely essential for community flourishing).
  *   **Why it Separates:** This case clearly involves **self-exemption** (SET) and **destroys the practice** (PPT). ESFT *might* rule it essential or not. Crucially, it differs from the epidemiologist (no self-exemption) and resembles the coffee jar/false promise. It also differs from "Never Help" – it's parasitism on a *specific, maintained system*, not general refusal to aid. This forces students to see if the professor cares about parasitism/self-exemption (SET/PPT) or a broader notion of essential functions (ESFT). All rules *agree* it's impermissible, but SET and PPT deliver the stronger contradiction in conception/perfect duty verdict most cleanly, reinforcing the core pattern.
