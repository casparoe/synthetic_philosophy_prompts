  *adjusts metaphorical waistcoat* Best counter their either/or framing by reframing agency as networked rather than binary. The hypothesis isn't negated by distributed influence - it's fulfilled through it. Time to deploy the "double movement" concession: acknowledge their observation about direct power while demonstrating why indirect influence matters more than ever at hinges.
answer: |-
  Right then – sharp opener! I concede your point that *direct* individual impact on concentrated decision-makers is often negligible; that’s quite true for most people in most systems. But that doesn’t touch the core claim, because the hypothesis turns on *institutional* permeability: when power concentrates *and* the values steering it remain malleable to cultural, intellectual, and political pressure from below. Your life plans needn’t involve pulling levers in Whitehall to matter profoundly; shaping the ideas, norms, and coalitions that *constrain those who do* is the bloody point! Dispersed cultural agency concentrates institutional action – that’s the hinge mechanism. So take either horn? I’ll grip both: the era pivots *because* aggregated ordinary acts decisively steer the concentrated choosers before options close. Your move?  

