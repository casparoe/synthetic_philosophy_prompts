answer: |-
  ### The Complexity Trap: Game Rules  
  *(Print one per team, single-sided A4)*  

  **Objective**: Survive 8 rounds as a small agrarian polity. Maximize your final score (calculated as: **Final Buffer + Political Capital - 5 × Functioning Layers - 10 × Emergency Dismantlements - 5 × Stripped Layers**).  

  **Starting Setup**:  
  - **Buffer (surplus)**: 10  
  - **Political Capital (PC)**: 0  
  - **Layers**: None  
  - **Groups**: None  

  **Each Round (8 rounds total)**:  
  1. **Harvest**: Gain `10` + total yield bonus from your layers.  
  2. **Pay Upkeep**: Subtract total upkeep of all layers from your buffer.  
     - If buffer goes negative, **emergency dismantle** one layer (no PC cost) and reset buffer to 0. Repeat if needed. If no layers, your polity collapses (score = 0).  
  3. **Event (Rounds 3, 5, 7 only)**: Draw an event card (facilitator reveals). Apply its effect.  
  4. **Decision**: Choose one action:  
     - **Build**: Pay build cost (see *Layer Table*), add a layer, and name its group (e.g., "Scribes"). Gain `1 PC`.  
     - **Dismantle**: Spend `PC = layer’s age` (rounds active) to remove a layer and its group.  
     - **Strip the Fixtures**: Destroy a layer permanently. Gain its one-off bonus (see table). *Once per game*.  
     - **Do nothing**.  
  5. **Gain PC**: If you met all upkeep this round, gain `1 PC per layer`.  

  **End-Game Scoring**:  
  - **Final Buffer**: Remaining surplus.  
  - **PC**: Unspent Political Capital.  
  - **Penalties**:  
    - `5 × Functioning Layers` (sustainability cost).  
    - `10 × Emergency Dismantlements` (chaotic collapse).  
    - `5 × Stripped Layers` (capital depletion).  

  **Win Condition**: Highest score wins. Downsizing often beats overbuilding!  

  ---

  ### Layer Table  
  *(Order built determines level; effects stack)*  

  | Level | Example Layer      | Build Cost | Yield Bonus | Upkeep | One-off (Strip) | Group Example       |  
  |-------|--------------------|------------|-------------|--------|-----------------|---------------------|  
  | 1     | Irrigation         | 4          | +4          | 1      | 8               | Canal Diggers      |  
  | 2     | Administration     | 5          | +3          | 2      | 10              | Scribes            |  
  | 3     | Temple Store       | 6          | +2          | 2      | 12              | Priests            |  
  | 4     | Garrison           | 7          | +1          | 3      | 14              | Soldiers           |  
  | 5     | Road Network       | 8          | 0           | 3      | 16              | Muleteers          |  
  | 6     | Tribute Collection | 9          | -1          | 4      | 18              | Tax Collectors     |  

  *Notes*:  
  - Yield bonus adds to harvest. Upkeep is paid *every round*.  
  - Example layers are thematic; you choose names.  
  - Marginal returns decline: Level 1 nets +3 surplus/round (after upkeep), Level 4 nets -2, Level 6 nets -5.  

  ---

  ### Event Deck  
  *(Facilitator draws one per event round; shuffle before use)*  

  1. **Drought**: Lose `1` surplus per layer. With *Irrigation*, lose half (round down).  
  2. **Raid**: Lose `3` surplus. With *Garrison*, lose `1`.  
  3. **Bad Harvest**: Harvest halved this round. With *Administration*, lose only 25%.  
  4. **Plague**: Lose `2` surplus per layer. With *Temple Store*, lose `1` per layer.  
  5. **Earthquake**: Roll a die. If ≤ your layers, lose one layer (emergency dismantle) and `5` surplus.  
  6. **Border Conflict**: With *Garrison*, gain `2` surplus. Without, lose `4`.  

  ---

  ### Sample Game & Scoring  
  *Team A: Downsized in Round 7*  
  - Built to Level 4 by Round 4.  
  - Round 7: Dismantled Level 4 (age=3, spent 3 PC) and Level 3 (age=4, spent 4 PC).  
  - Final: Buffer=25, Layers=2, PC=5, No emergencies/stripped.  
  - **Score**: 25 + 5 - (5×2) = **20**  

  *Team B: Overbuilt*  
  - Built to Level 5 by Round 6.  
  - Round 7: Buffer negative. Emergency dismantled Level 5.  
  - Final: Buffer=12, Layers=4, PC=8, Emergency=1.  
  - **Score**: 12 + 8 - (5×4) - (10×1) = **-10**  

  *Result*: Team A wins despite fewer layers. Downsizing paid off.  

  ---

  ### Facilitator Run Sheet  
  **Total Time**: 100 mins  
  - **0:00–0:05** (5 mins): Distribute rules. Brief: *“Survive 8 rounds. Harvest, pay upkeep, build/dismantle. Events happen. Maximize final score.”*  
  - **Rounds 1–8** (8 mins/round; 64 mins total):  
    - *Each round*: Announce phase transitions:  
      - *“Harvest: Add 10 + yield bonus to your buffer.”*  
      - *“Pay upkeep: Subtract total upkeep. Emergency dismantle if negative.”*  
      - *Event rounds (3,5,7)*: *“Event: [Read card effect].”*  
      - *“Decision: 2 mins to choose. Build, dismantle, strip, or nothing.”*  
      - *“End of round: If upkeep met, gain PC = your layers.”*  
  - **1:09–1:12** (3 mins): Collect final states. Calculate scores.  
  - **1:12–1:40** (28 mins): Debrief (see script below).  

  **Materials to Bring**:  
  - Rules/Layer table printouts (6 sets).  
  - Event cards (pre-shuffled deck).  
  - Dice (for earthquake event).  
  - Paper/pencils for teams (track buffer, PC, layers, groups).  
  - Whiteboard (record scores).  

  ---

  ### Debrief Script  
  *(Start after scores are posted)*  

  1. **Map Concepts to Play**:  
     - *“Table 3, in Round 5 you built the Garrison. Why?”* → Link to problem-solving (e.g., raid defense).  
     - *“Table 1, in Round 7 you dismantled two layers. What did it feel like?”* → Highlight **downsizing as success**, not failure.  
     - *“Team with highest score: did you build less? Why?”* → **Diminishing returns**: Later layers cost more than they give.  

  2. **Introduce Terminology**:  
     - *“What you called ‘useless layers’ is **diminishing marginal returns**. Complexity solves problems, but each new layer gives less.”*  
     - *“Stripping fixtures or dismantling? That’s **collapse as economizing**—shedding cost to survive.”*  
     - *“PC cost to dismantle? Real elites can’t downsize because **groups depend on complexity**. It’s not stupidity—it’s politics.”*  

  3. **Address Objection**:  
     - *“But real polities didn’t ‘choose’ to collapse!”* → Agree. *“Geography matters. A frontier polity* [point to team that downsized] *can shrink. One surrounded by rivals* [gesture to overbuilt team] *can’t—it gets conquered. Your choices depended on your neighbors’ power.”*  

  ---

  ### Frank Assessment  
  **Predictable Problems & Fixes**:  
  1. **Hoarding Team**: May skip layers to avoid upkeep.  
     - *Fix*: Events punish low complexity (e.g., raid without garrison: lose `4` surplus). Scoring (`-5 per layer`) also penalizes underbuilding.  
  2. **PC Bookkeeping Overload**:  
     - *Fix*: Provide a tracking grid. Emphasize: *“PC = groups satisfied. Spend to override them.”*  
  3. **Optimal Stopping Reverse-Engineered**:  
     - *Fix*: Hide the Layer Table’s level effects. Call layers “projects” without net yield stats. Events add noise—optimal play isn’t obvious.  

  **Structural Limitations & Debrief Additions**:  
  1. **Grain vs. Non-Grain Benefits**:  
     - *Missing*: Prestige, information processing, mobilization capacity.  
     - *Debrief*: *“Complexity isn’t just grain—it enables cities, armies, and stability. That’s why elites cling to it.”*  
  2. **Static Landscape**:  
     - *Missing*: Soil depletion, climate shifts.  
     - *Debrief*: *“Real polities faced degrading environments. Here, damage came from shocks—but collapse was still about energy return on complexity.”*  

  **Final Note**: The game simplifies, but the core insight holds: collapse isn’t about “mismanagement”—it’s about economies of scale turning against you. Use the debrief to reconnect mechanics to Tainter.
