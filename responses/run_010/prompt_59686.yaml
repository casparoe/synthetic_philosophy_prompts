prompt: |-
  I'm prepping a talk for my school's bioethics club on the therapy vs. enhancement line, and honestly every source I find just recycles the same three examples (glasses, growth hormone, Ritalin) and then picks a side. I want the spec first. Write the desiderata: what does an account that sorts interventions into "therapy" and "enhancement" actually have to deliver to count as any good? The cases it must get right, the distinctions it can't collapse, the facts about medicine and biology it can't contradict — and for each one, why it's a genuine requirement instead of just one camp's taste.

  Three cases I specifically want it to handle. (a) A pill that blocks intrusive memories from consolidating. Exactly the same drug, same mechanism, for a crash survivor and for a soldier before deployment — but the first feels like treatment and the second like enhancement, and the only difference I can see is which counterfactual baseline you compare against. (b) A cognitive booster that's obviously an enhancement today; in 40 years everyone's on it, so the boosted level becomes the statistical norm and the identical pill is now what you need just to be average. Does the moral status of the pill change with the times, or does the "normal function" definition just break here? (c) Short stature: same injection, one kid is hormone-deficient and one isn't — plus the complication that in some disabled communities the very idea of "normal function" is doing social work rather than biology.

  Say which requirements are non-negotiable and which are up for grabs, and flag any pair you think can't be satisfied together — that's the part I most want. Then one short paragraph: which of the standard accounts (restore normal function, prevent harm, welfare-based, consent-based) does best against the list. I'll do my own scoring in the talk. Keep it tight, if its too long I'll lose the room.

  Last line should start with "Verdict:" and name the single requirement that knocks out the most of them.
reasoning: |-
  Okay, the user is preparing a talk for their bioethics club on the therapy vs. enhancement debate. They're frustrated that most sources recycle the same examples (glasses, growth hormone, Ritalin) and want a deeper analysis. Specifically, they want desiderata—criteria that any good account must meet to sort interventions into therapy or enhancement.

  First, I need to identify what makes a robust account. The user mentioned three cases: memory-blocking pill for different contexts, a cognitive booster that becomes the norm over time, and growth hormone for hormone-deficient vs. non-deficient kids. The key is to outline non-negotiable requirements versus flexible ones, highlight conflicts, and evaluate standard accounts.

  Non-negotiable requirements should include biological feasibility, avoiding harm, and non-circularity. Biological feasibility ensures interventions align with bodily systems without contradicting biology. Avoiding harm is essential because therapy should prevent harm without causing more issues. Non-circularity prevents definitions from being tautological, like using "normal" to define therapy.

  Contested requirements might include statistical normality, value neutrality, and temporal consistency. Statistical normality is tricky because baselines can shift, as in the cognitive booster case. Value neutrality is debated since societal values influence perceptions, like in short stature cases. Temporal consistency is challenged by changing norms over time.

  Irreconcilable tensions: Statistical vs. functional normality clashes because statistical norms change, while functional norms might not. Also, value neutrality vs. harm prevention conflicts when harm is subjective, like in deaf communities viewing cochlear implants as harmful to culture.

  Standard accounts: Restoring normal function struggles with shifting baselines. Preventing harm handles the memory pill contextually but falters with short stature where harm is contested. Welfare-based is flexible but subjective. Consent-based avoids value judgments but might miss the therapy/enhancement distinction.

  The verdict should pinpoint the requirement that undermines most accounts. Biological feasibility and non-circularity are critical, but the biggest challenge is reconciling shifting baselines with fixed definitions. Temporal consistency knocks out many accounts because norms change, making static definitions obsolete.
answer: |-
  Here are the core desiderata for a therapy/enhancement distinction, evaluated against your cases and each other, followed by the assessment of standard accounts.

  **Non-Negotiable Desiderata (Must-Have):**
  1.  **Biological Feasibility:** The account *must not contradict established biological facts* (e.g., human physiology, genetics, pathology). Why? Biology defines the functional capacities medicine interacts with. An account ignoring biology is scientifically meaningless. *(Relevant to C: Must acknowledge hormone deficiency vs. non-deficiency as biologically distinct states).*
  2.  **Harm Avoidance Core:** The account *must* recognize that interventions aimed at preventing significant harm/disease/suffering have a fundamentally different moral *starting point* than those aimed purely at improving "normal" function. Why? Medicine's primary historical and ethical justification is the relief of suffering and treatment of pathology. *(Relevant to A: The crash survivor clearly faces harm from intrusive memories; the soldier *might* face harm, but it's speculative prevention of potential distress).*
  3.  **Non-Circularity:** The definition *cannot* rely on the terms "therapy" or "enhancement" (or their synonyms like "treatment," "improvement") within its core criteria. Why? "Therapy is what treats disease" is tautological and provides no real distinction. *(Affects all standard accounts initially).*
  4.  **Distinguish Intervention from Goal:** The account *must* allow that the *same physical intervention* (same drug, same dose, same mechanism) can be therapy *or* enhancement depending on context/purpose. Why? Biology doesn't care about intent, but ethics often must. *(Relevant to A & C: Identical pill/injection used differently).*

  **Contested/Context-Dependent Desiderata (Important but Debated):**
  5.  **Statistical Normality (Baseline):** Should the "normal" function baseline be statistically defined within a reference population? Why contested? Essential for consistency but problematic when baselines shift (B) or are contested (C). Is it *necessary*? Many argue yes for objectivity. Others argue it's flawed and insufficient.
  6.  **Value Neutrality:** *Can* the account avoid relying on contested social values or conceptions of the "good life"? Why contested? Desirable for objectivity, but likely impossible as "harm," "function," and "normal" often embed values. *(Critical for C: Views on short stature being inherently harmful vs. a valued identity difference).*
  7.  **Temporal Consistency:** Should the classification (therapy vs. enhancement) *change* if the statistical norm (B) or societal values (C) change over time? Why contested? Fixed definitions offer stability; fluid definitions reflect reality but create moral relativity. *(Core tension in B & C).*

  **Irreconcilable Tensions (Hard Trade-offs):**
  *   **Statistical Normality (5) vs. Functional Normality (Implied by 2):** If the baseline is purely statistical (5), then the cognitive booster shifts from enhancement to therapy over time (B). But if the baseline is tied to a species-typical functional norm (implied by the harm avoidance core, 2), it *shouldn't* shift. **Can't easily satisfy both.** Shifting statistical norms break functional/normative accounts.
  *   **Value Neutrality (6) vs. Harm Avoidance Core (2):** Defining "harm" (2) inherently involves values. Attempting strict value neutrality (6) risks making the distinction purely descriptive and ethically inert, or collapsing it entirely when values conflict (C). **Hard to satisfy both robustly.**

  **Standard Accounts vs. The List:**
  *   **Restore Normal Function (Species-Typical/Statistical):** Strong on 1 (Biology) & 4 (Same Intervention). Fails spectacularly on B (Temporal Consistency/Statistical Shift) and struggles with contested norms in C. Non-circularity (3) depends on how "normal" is defined.
  *   **Prevent/Treat Harm:** Strongest on the core Harm Avoidance (2) and handles context/purpose (4) well (e.g., A). Weak on Value Neutrality (6) – "harm" is value-laden (C). Can struggle with defining "harm" without circularity (3) and is challenged by shifting baselines (B).
  *   **Welfare-Based (Increase Well-Being):** Flexible on context (4) and shifting norms (B). Very weak on Value Neutrality (6) and Harm Avoidance Core (2) – conflates therapy and enhancement. Risks circularity (3) ("Therapy enhances well-being by treating disease").
  *   **Consent-Based (Medical Necessity):** Avoids value judgments (6) to some extent. Ignores the core Harm Avoidance distinction (2) – necessary treatment isn't just about consent. Weak on Biological Feasibility (1) – doesn't address *why* something is necessary. Doesn't handle shifting baselines (B) well.

  **Verdict:** **Temporal Consistency** knocks out the most standard accounts and reveals the deepest flaw in statistical/normative definitions.
