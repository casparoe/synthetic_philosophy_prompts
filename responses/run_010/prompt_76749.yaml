answer: |-
  Based on your precise description and the cases you present, you've identified a significant and often under-acknowledged structural feature of reasoning in personal identity (and related fields). While no single, universally agreed-upon label perfectly captures *all* your cases, there are established concepts and terms in the neighbourhood. The core phenomenon is **the extrinsic determination of normative or semantic status by the existence and properties of alternatives**, specifically where intrinsic properties remain constant.

  Here's the carving you requested, addressing your questions directly:

  ### 1. The Phenomenon and Its Labels
  The phenomenon you describe—**the status of entity A (e.g., "is A me?", "does A's future matter specially?") changing not because of any intrinsic change in A or its direct relation to me, but solely because of the existence and properties of alternative entities B, C, D...**—is best understood as a form of:

  *   **Extrinsic Determination of Identity/Survival/What Matters:** This is descriptive. The key point is that the status isn't fixed intrinsically or by the direct A-origin relation alone; it's *determined* by the broader context of available alternatives. (This is the most accurate overarching description).
  *   **Context Sensitivity of Survival/Identity Judgments:** This highlights how the judgment ("Is A me?") depends on the comparative context. (Widely recognized, but broad).
  *   **Comparative Evaluation Requirement:** This emphasizes that the assessment requires comparison with alternatives, not just an absolute assessment of A. (Fits the botched/enhanced cases well).
  *   **Non-Additivity (or Cardinality Sensitivity) of What Matters:** This specifically targets your third case. (Crucial, but distinct from the comparative aspect).

  **Why these fit:**
  *   **Intrinsic Constancy:** Your core observation is that A remains intrinsically identical across scenarios. The change is purely relational/extrinsic.
  *   **Dependence on Alternatives:** The existence and nature of B (botched, enhanced, or numerous duplicates) alters A's status *without altering A*.
  *   **Normative/Semantic Shift:** The change is in A's *standing* (is it me? does its future matter specially?), not just a descriptive fact.

  **Likely Misidentifications & Responses:**
  *   **"The Non-Identity Problem" (Parfit):** Concerns whether causing someone to exist who otherwise wouldn't can be harmful *to them*. Related to future individuals but distinct; it doesn't involve altering the status of an existing or intrinsically identical individual based on alternatives.
  *   **"The Spectrum Arguments" / "Sorites Vulnerability":** Addresses vagueness in identity across gradual change (e.g., gradual brain replacement). While your botched case *involves* a spectrum of "how botched?", your focus is on how the *mere existence* of another point on the spectrum alters A's status, not the vagueness itself. The "how botched?" question you note *results from* the comparative requirement.
  *   **"Branchline Cases" / "Fission" (Parfit, Lewis):** Fission (e.g., your thousand successors) is the *scenario*. The phenomenon you identify is *how reasoning about identity/what matters operates within* fission and related comparative cases. Parfit's claim that "what matters" survives fission is a *response* to the scenario, grappling with the non-additivity you identify.
  *   **"Relational Properties":** Too broad. Many relational properties (e.g., "taller than") are extrinsic but don't capture the specific *normative/semantic status shift* based on alternatives when intrinsic properties are constant.

  **The Line:** The phenomenon itself is the **extrinsic, comparative determination of status**. Arguments about whether identity is "all-or-nothing" vs. "degree", or whether fission shows survival isn't identity, are *responses* or *conclusions drawn within* this structural feature.

  ### 2. Are the Three Cases the Same Phenomenon?
  They are **closely related instances of extrinsic determination, but with distinct mechanisms:**

  *   **Case 1 (Botched Successor) & Case 2 (Enhanced Successor):** Share the mechanism of **Comparative Status Determination.** The existence of an alternative (B) forces a comparative evaluation ("Which is *best*? Which is *closest*?") that wasn't necessary in the one-successor case. A's status (as "me" or "what matters") is demoted from unique/absolute to contingent on comparison. *This is widely discussed, though often implicitly.*
  *   **Case 3 (Thousand Successors):** Illustrates **Cardinality Sensitivity / Non-Additivity of What Matters.** The core question is how the value/normative weight ("what matters") aggregates or distributes across multiple qualitatively identical candidates. Does it sum? Average? Remain constant per candidate? The intrinsic relation between you and any *one* successor is identical to the one-successor case, yet the overall conclusion about "how much matters" or "whether *this one* matters specially" changes dramatically with number. *This non-additivity is often assumed rather than explicitly argued for, as you note.*

  **Connection:** Both phenomena involve extrinsic determination: Status or value depends not just on the intrinsic A-relation, but on the existence and properties of *other* entities (B, or the other 999). The comparative cases (1 & 2) often *lead into* discussions about fission (Case 3). However, the *mechanism* differs: comparison vs. aggregation.

  **Conclusion:** Cases 1 & 2 are tightly linked under "Comparative Status Determination". Case 3 is a distinct but closely related problem of "Non-Additivity / Cardinality Sensitivity". They form a family united by "Extrinsic Determination of Normative/Semantic Status".

  ### 3. Recurrence Outside Personal Identity
  **Yes, this structure recurs widely and is recognized under various names:**

  *   **Ethics / Distributive Justice:**
      *   **"Levelling Down" Objection to Egalitarianism:** Making everyone worse off *can* achieve equality. Is equality valuable *only* when it makes someone better off (intrinsically good), or does its value depend *extrinsically* on the existence of a worse-off group for comparison? (Direct parallel to Case 2: equality's status/value depends on the existence of the worse-off).
      *   **"Satisfaction" of Desires/Preferences:** Does the satisfaction of a desire have value only if the desire exists and *isn't* satisfied otherwise? (Similar to Case 1: the status/value of satisfaction depends on the counterfactual alternative of non-satisfaction).
  *   **Semantics & Logic:**
      *   **"The" and Uniqueness Presuppositions:** The truth of "The successor is in London" requires there to be *exactly one* relevant successor. If a second (botched) successor exists, the statement becomes false or infelicitous *even if the first successor is intrinsically unchanged and in London*. The semantic status (truth) depends extrinsically on the absence of alternatives. (Strong parallel to Case 1).
      *   **Counterfactuals:** The truth of "If A had happened, C would have happened" often depends crucially on which alternatives to A are considered most relevant/similar ("closest possible worlds"). The status of the counterfactual relation (A > C) is extrinsically determined by the context of alternatives.
  *   **Decision Theory / Rational Choice:**
      *   **Context Effects (e.g., Asymmetric Dominance / Decoy Effect):** The perceived attractiveness of option A can increase if a clearly inferior option B is introduced, even if A is intrinsically unchanged. The *choice-worthiness status* of A depends extrinsically on the inferior alternative. (Direct parallel to Case 1).
      *   **Value Aggregation:** Problems of summing welfare across individuals (utilitarianism) or across possible future selves mirror the non-additivity in Case 3. Is overall good additive? Does the value of an individual's well-being depend on how many others exist?

  **Recognition:** These parallels are often noted. Philosophers like Parfit explicitly draw analogies between personal identity and ethics (e.g., fission vs. distributive justice). Logicians and semanticists have well-developed frameworks for context dependence. The *specific structure* of intrinsic constancy + extrinsic determination of status is a general feature of many philosophical problems.

  ### 4. Coining a Term (If Needed)
  While "Extrinsic Determination" and "Comparative Status Determination" are serviceable, a more precise coinage for the *core* phenomenon (covering all cases) could be:

  *   **Status Vulnerability to Alternatives (SVA):**
      *   **Definition:** The phenomenon whereby the normative, semantic, or evaluative status (e.g., being identical to me, being "what matters," being the unique satisfier, being the best choice, being the referent of "the") attributed to an entity A, based on its relation to an origin O, is not fixed solely by the intrinsic properties of A or the intrinsic A-O relation, but is susceptible to alteration solely by the existence and intrinsic properties of alternative entities B, C, D... related to O, even when A and the A-O relation remain intrinsically unchanged.
      *   **Boundary Conditions:**
          *   *Is SVA:* Cases 1, 2, 3 as described; "the successor" statement failing due to a botched duplicate; the levelling down objection; the decoy effect in choice.
          *   *Is Not SVA:* A's status changes *because* A changes intrinsically (e.g., brain damage). A's status changes because the *direct* O-A relation changes (e.g., memory loss breaks psychological connection). Standard Sorites vagueness without a *specific alternative* causing a status shift (e.g., "Is this heap?" without a contrasting non-heap explicitly changing its status). Harming someone by creating them with a life barely worth living (Non-Identity Problem) – here the harm *to them* depends on their existence being contingent on the act, not on an alternative changing *their* status.
      *   **Key Features:** Intrinsic constancy of A and A-O relation; Extrinsic introduction of alternatives; Alteration of A's *status* (not just description).

  ### Clarifying the State of the Field (As Requested)

  *   **Settled / Majority View (High Confidence):**
      *   Philosophers widely acknowledge that thought experiments like fission (Case 3) pose serious challenges to simple psychological or biological continuity theories of identity.
      *   There is broad agreement that *context matters* in judgments of identity and survival (e.g., fission vs. normal survival feel different). Derek Parfit's *Reasons and Persons* (Part III) is the dominant reference point here, arguing fission shows "what matters" (Relation R) can hold in degrees and doesn't require identity.
      *   The possibility of extrinsic factors influencing identity/survival judgments is generally accepted as a *feature of the cases*, even if theorists disagree on the *implications*.
      *   The context-sensitivity of terms like "the" and counterfactuals is well-established in semantics/logic.

  *   **Genuinely Divided / Controversial:**
      *   **The Implications of Extrinsic Determination:** Is Parfit right that fission shows identity doesn't matter? Or do theorists like David Lewis ("Survival and Identity") offer a better account (e.g., multiple occupancy)? Does extrinsic determination undermine the reality of identity, or is it compatible with a robust view? *This is the core debate.*
      *   **The Nature of "What Matters":** Is it identity, Relation R, something else? Is it a scalar? Does it aggregate? *Deeply contested.* Parfit argues for the significance of Relation R over identity. Others resist. Your point about additivity assumptions highlights a key fault line: Is what matters "all-or-nothing" per candidate (like identity), or a quantity that aggregates? Theorists often *presuppose* an answer here without sufficient argument.
      *   **The Normative Significance:** Should we *care* that extrinsic determination occurs? Does it reveal something deep about reality (Parfit: no "further fact" of identity) or just about our concepts? *Highly contentious.*
      *   **Handling Vagueness/Spectrums (Your "how botched?"):** Is personal identity vague? If so, how should we reason normatively in borderline cases? No consensus.
      *   **The Analogy to Ethics:** Whether the structural parallels to distributive justice or levelling down are valid and illuminating is debated. Parfit endorsed them; others find them flawed.

  *   **Under-discussed / Your Key Insight:**
      *   **The Ubiquity and Weight of Additivity Assumptions (Case 3):** Your observation that authors often *assume* additivity (or non-additivity) without explicit defense in fission cases is astute and less frequently highlighted. This assumption often does heavy lifting in arguments about whether fission is good, bad, or neutral. *This specific point about unargued additivity is more your original contribution than a settled debate.*
      *   **The Sharp Distinction Between Intrinsic Constancy and Extrinsic Determination:** While the cases are discussed, the precise *structure* you identify – the status change *despite* intrinsic constancy – isn't always the explicit focus of the label. Theorists engage with the phenomenon, but your framing clarifies its core mechanics.

  In essence, you've pinpointed a fundamental and pervasive structural feature ("Status Vulnerability to Alternatives" / "Extrinsic Determination of Status"). While the *phenomenon* is recognized and central to debates (especially post-Parfit), the *specificity* of your framing, particularly regarding intrinsic constancy and unargued additivity assumptions, offers valuable clarity. The field is settled on the *reality* of this feature in the cases, but deeply divided on its *interpretation and significance*. Your mathematical lens has revealed an often-implicit structural dependency.
