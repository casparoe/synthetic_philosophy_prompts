  **Thesis 3: The factory for blank stacks**

  Suppose an entrepreneur claims to have a factory that produces fresh stacks of N blank cells, using only a heat bath at temperature T. The factory is in thermal contact with the bath and draws heat from it. We want to show that this factory cannot exist.

  The factory takes as input a used stack (which is in an arbitrary state) and outputs a fresh stack of N blank cells. The fresh stack is in a known state: all cells in |0>. The used stack is discarded or recycled. The factory is cyclic and runs in contact with the bath.

  The second law requires that the total entropy of the universe does not decrease. Consider one run of the factory: it takes a used stack and outputs a blank stack. The used stack is in some state. The blank stack is in a pure state (all |0>). Therefore, the entropy of the memory stack has decreased by N k ln 2 (if the used stack was in a maximally mixed state) or by some amount. This decrease in entropy must be compensated by an increase in entropy elsewhere, i.e., heat dumped into the bath.

  Specifically, the minimum work required to reset a used stack (which we assume is in a maximally mixed state) to a blank stack is N kT ln 2. This work must be provided to the factory. But the factory is only drawing heat from the bath. By the second law, it cannot convert heat from a single bath into work without any other effect. Therefore, the factory cannot output the blank stack without either:

  (a) Dumping at least N kT ln 2 of heat into the bath (which would be the case if it received at least N kT ln 2 of work from an external source), or

  (b) Exporting the entropy elsewhere.

  In case (b), the entropy is exported by having the blank stack not be truly blank. For example, the blank stack might be correlated with some other system (the factory's internal state or another output). Then, when the demon uses the blank stack, the entropy is not destroyed but stored in the correlations. Eventually, these correlations must be accounted for.

  Now, the nastier possibility: the exported correlations are with the engine box itself. That is, the factory produces blank stacks that are correlated with the state of the engine box. Then the demon, instead of measuring the system, might use the pre-existing correlation to extract work.

  For example, suppose the factory produces a blank stack that is entangled with the particle in the box. But we are in the classical realm, so think of it as correlated. Specifically, suppose that the factory produces a stack of cells that are each correlated with the box in such a way that the cell indicates which half the particle is in. But then the demon doesn't need to measure: it already has the record. Then the demon can immediately use the record to extract work.

  But how was the correlation established? The factory must have measured the box at some point. But then we are back to the same problem: the measurement requires a memory that must be reset. If the factory measured the box to set up the correlation, then the factory's own memory must be reset, costing work.

  Alternatively, the factory might have set up the correlation without measurement by using a reversible interaction. For example, the factory might have brought the box and the memory stack into a joint state that is correlated. Then the demon can use the memory to extract work. But what is the initial state of the box and the memory? If they are correlated, then the entropy of the joint system is less than the sum of the individual entropies.

  Let's do the accounting for the entire system: the engine box and the memory stack.

  Initially, the box is in equilibrium (particle equally likely in left or right). The memory stack is blank (all |0>). The joint state is uncorrelated.

  After the factory sets up a correlation, the box and memory are in a state where the memory cell i is set to 0 if the particle is in the left and 1 if in the right. But the factory must do this without knowledge. It can do it by a reversible operation that couples the box and the memory. This operation would be a controlled-NOT: if the particle is in the left, leave the memory cell at 0; if in the right, flip it to 1. This is a unitary operation and doesn't cost work. But then the memory is no longer blank: it is now correlated with the box. And the factory has not reset anything; it has just changed the state.

  The demon then, without measuring, knows that the memory cell is correlated. It inserts the partition and then uses the memory cell to know which side the particle is in and extracts work. Then it resets the system (removes the partition). But after resetting the system, the memory cell still holds the record. The demon then returns the memory stack to the factory. The factory must now reset the memory stack to blank. But to reset the memory stack, it must erase the records, which costs work. So we are back to the same problem.

  Alternatively, the factory might try to reset the memory stack without costing work by using the correlation with the box. But after the work extraction and system reset, the box is back to the initial state and is uncorrelated with the memory. So the memory is now an independent record and resetting it costs work.

  Therefore, the factory cannot avoid the cost. Either it pays the cost by dissipating heat when it resets the memory, or it exports the entropy by not resetting the memory and leaving it correlated, but then the demon cannot use it again without the correlation being there and the system being in the appropriate state.

  **Accounting for the stack demon cycle by cycle**

  We now do the explicit accounting for the stack demon with a stack of N cells.

  Let:
  - B: the box system (one particle in a box)
  - M: the memory stack (N cells)
  - Bath: the heat bath at temperature T

  Initial state of a cycle (first cycle):
  - B: in equilibrium, so the particle is equally likely in the entire box. The partition is not present.
  - M: the first cell is in |0> (blank), the rest are unused (also in |0>).

  Step 1: Demon inserts the partition. This is done without work. Now the box is divided into two halves. The particle is in one half.

  Step 2: Demon measures which half the particle is in. This measurement is done reversibly and recorded in the first memory cell. The measurement process: the demon couples the box to the memory cell. The cell is flipped if the particle is in the right. This is a unitary operation that doesn't change the energy. After this, the memory cell is in |0> if particle in left, |1> if in right. The system is now in a pure state: the box has the particle in a known half, and the memory cell records which half.

  Step 3: Demon uses the memory to extract work. The demon lets the particle push a piston quasi-statically and isothermally. The work extracted is kT ln 2. This work comes from the heat absorbed from the bath. The system expands to fill the box. The partition is now at the end. The demon removes the partition without work. The system is reset to the initial state (particle in the whole box). The memory cell remains in its state (|0> or |1>).

  After this step:
  - The work extracted: W1 = kT ln 2.
  - The bath has lost heat Q1 = kT ln 2 (because the work came from heat).
  - The memory cell is now in a pure state (recorded).
  - The free energy of the memory cell: still U (the same as before).

  For the next cycle, the demon uses the next blank cell. After N cycles, the work extracted is N kT ln 2. The bath has lost heat N kT ln 2. The memory stack is now full of records.

  Now, the demon swaps the memory stack with a fresh blank stack.

  The fresh blank stack was prepared by an external agent. The preparation of the blank stack requires resetting a used stack (which is in a mixed state) to all |0>. The minimum work to reset one cell is kT ln 2, so for N cells, it is N kT ln 2. This work must be provided by the external agent. The resetting dumps heat into the bath: at least N kT ln 2.

  Therefore, the net work output over N cycles is:

      Work extracted by the demon: N kT ln 2
      Work input by the external agent to reset the stack: at least N kT ln 2

  Net work: at most 0.

  The heat flow: the bath lost N kT ln 2 to the demon during work extraction, but gained at least N kT ln 2 during the resetting. So the bath net heat change is 0.

  Therefore, the second law is satisfied.

  **Conclusion on the second law and demons**

  The second law's authority over demons reduces to a claim about initial conditions and finite stores. The demon can only extract work by using up a pre-existing non-equilibrium resource. In the case of the stack demon, the resource is the blank memory stack. Once that is exhausted, the demon must pay to have it reset. Therefore, the demon is not a perpetual motion machine but an engine that uses a finite fuel (the free energy in the blank memory). This is a clarification: the second law is not violated because the demon's operation is not cyclic without including the memory reset. The true system (engine plus memory) is not closed until we account for the resetting.

  This view is a clarification because it shows that the second law is about the entire isolated system and its initial state. If the initial state is out of equilibrium, we can extract work until we reach equilibrium.
