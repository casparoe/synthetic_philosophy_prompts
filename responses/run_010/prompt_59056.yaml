  - **Bath heat**: Initial \(-N kT \ln 2\) (during cycles) + \(Q_{\text{dump}} \geq N kT \ln 2\) (during reset) → Net \(\geq 0\).  

  **Second law upheld**: Net work \(\leq 0\), net bath entropy change \(\geq 0\).  

