  #### **Thesis 3: Impossibility of a Blank-Stack Factory**
  An entrepreneur claims a factory produces fresh \(N\)-blank stacks from a single bath at \(T\). The factory must either:  
  1. **Dump heat \(\geq N kT \ln 2\) into the bath** (paying the erasure cost by proxy), or  
  2. **Export correlations** (output stacks not truly blank, but correlated).  

  **Accounting for the factory cycle**:  
  - Input: Depleted stack (after \(N\) cycles, each cell in pure state \(|0\rangle\) or \(|1\rangle\)).  
  - Output: Fresh stack of \(N\) blanks (all \(|0\rangle\)).  
  - Bath: Sole heat source/sink at \(T\).  

  **Option 1: Factory dumps heat \(\geq N kT \ln 2\)**  
  - To reset a depleted stack:  
    - Each cell is in an unknown pure state (reset agent’s ignorance: mixed state, \(S_i = k \ln 2\)).  
    - Resetting to \(|0\rangle\) reduces entropy by \(\Delta S_{\text{mem}} = -k \ln 2\) per cell.  
    - Entropy decrease must be offset: \(\Delta S_{\text{total}} = \Delta S_{\text{mem}} + \Delta S_{\text{bath}} \geq 0\).  
    - Thus, \(\Delta S_{\text{bath}} \geq N k \ln 2\), so heat dumped \(Q_{\text{dump}} \geq N kT \ln 2\).  
  - Work to reset (if done reversibly) is \(W = \Delta F + T \Delta S_i\). Since \(\Delta F = 0\) (pure to pure), \(W = T \Delta S_i\). With \(\Delta S_i = 0\), \(W = 0\), but entropy reduction requires \(Q_{\text{dump}} = T \Delta S_{\text{bath}} \geq N kT \ln 2\). If the factory draws heat \(Q\) from bath, converts to work \(W\) for reset, then \(W = Q - Q_{\text{dump}} \leq 0\) (by second law). Thus, factory cannot output a blank stack without net heat dump \(\geq N kT \ln 2\).  

  **Option 2: Factory exports correlations (output not truly blank)**  
  Suppose the factory outputs "blanks" correlated with another system (e.g., the engine box).  
  - **Case: Correlations with engine box**:  
    - Factory pre-correlates blanks with the box state. For example, it entangles (classically correlates) each cell \(i\) with future box states.  
    - Demon skips measurement: Uses the pre-correlation to "know" the particle’s position.  
    - **What is exploited?** The demon uses **prior mutual information** between memory and box, not measurement.  
    - **Accounting change**:  
      - **Cycle 1**: Factory delivers stack correlated with box. Demon inserts partition, reads cell 1 (no measurement cost), extracts \(W = kT \ln 2\), resets box.  
      - **Entropy export**: After box reset, the memory record is garbage (no correlation), but the factory’s output carried correlation entropy initially. The entropy decrease from resetting the box is offset by the initial correlation entropy.  
      - **Net effect**: When the demon uses a correlated "blank," it consumes the mutual information. After work extraction, the memory is decorrelated, so \(\Delta S_{\text{mem}} = 0\) (pure), but the factory must now produce a new correlated stack.  
      - **Factory’s burden**: To recreate correlation, the factory must measure the box (or another system), requiring its own memory to be reset. This hidden reset costs \(kT \ln 2\) per cell, transferring the entropy debt to the factory’s memory.  
    - **No free lunch**: Exporting correlations relocates entropy but does not destroy it. The factory’s measurement memory incurs the erasure cost, or the correlation is not truly independent (e.g., if the "blanks" are recycled, their residual correlations accumulate entropy).  

  **The nastier possibility (correlations with engine box) addressed**:  
  - Demon exploits **pre-established mutual information** instead of measurement. This changes accounting because the work extraction uses stored correlation, not fresh information gain.  
  - Why accounting is relocated:  
    - Initial free energy is in the correlated box-memory system. Work extraction depletes this.  
    - After box reset, memory is decorrelated; its free energy is still \(U\) per cell, but to reuse it, the factory must re-correlate it with the box.  
    - Re-correlation requires either:  
      a. **Measurement by factory**: Costs erasure elsewhere (factory’s internal memory).  
      b. **Reversible interaction**: E.g., unitary coupling. But this demands the box be in a specific initial state (not equilibrium), which itself requires work to prepare.  
    - Thus, entropy is not destroyed; it is shifted to the factory’s systems, demanding eventual payment.  

