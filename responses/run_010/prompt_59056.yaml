  **After \(N\) cycles**:  
  - Work: \(+N kT \ln 2\).  
  - Heat: \(-N kT \ln 2\) (bath).  
  - \(M\): All cells recorded (pure states), \(F_M = N \cdot U\).  

  **Stack swap (old \(M\) for new blanks)**:  
