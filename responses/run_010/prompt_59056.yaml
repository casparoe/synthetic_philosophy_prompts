  ### Argument in Support of the Stack Demon Theses

  #### **Thesis 1: Blank Cells as a Consumable Thermodynamic Resource**
  The blank cells in the stack demon are not mere bookkeeping tools but a physical fuel. Each blank cell is a two-state system with degenerate energy levels (energy \(E_0 = E_1 = U\)), prepared in a pure state \(|0\rangle\). At temperature \(T\), its equilibrium state is maximally mixed: probability \(p_0 = p_1 = 1/2\), with entropy \(S_{\text{eq}} = k \ln 2\). The free energy \(F\) of a state is \(F = U - TS\), where \(S\) is the von Neumann entropy.

  - **Blank state (\(S = 0\))**: \(F_{\text{blank}} = U - T \cdot 0 = U\).
  - **Equilibrium state (\(S = k \ln 2\))**: \(F_{\text{eq}} = U - T(k \ln 2)\).
  - **Excess free energy per blank cell**: \(\Delta F = F_{\text{blank}} - F_{\text{eq}} = kT \ln 2\).

  A stack of \(N\) blanks thus holds \(N kT \ln 2\) of free energy. During each cycle:
  1. **Measurement and writing**: The demon measures the particle’s position (reversible, no work cost) and writes the outcome to a blank cell. Writing changes the cell’s state to \(|0\rangle\) or \(|1\rangle\) (still pure, \(S = 0\)), so \(\Delta F_{\text{cell}} = 0\). **No free energy is lost from the cell yet.**
  2. **Work extraction**: Using the record, the demon extracts \(W_{\text{ext}} = kT \ln 2\) from the piston. Heat \(Q = kT \ln 2\) flows from the bath to the box to maintain temperature, converting to work.
  3. **System reset**: The partition is removed reversibly (no work cost), resetting the box to its initial state.

  After \(N\) cycles, the stack is exhausted—each cell holds a record (pure, but now correlated with past states). The stack is swapped for a fresh one of \(N\) blanks. The swap requires the old stack to be reset externally. Resetting a record (mixed from the resetter’s perspective, \(S = k \ln 2\)) to a blank (\(S = 0\)) costs at least \(kT \ln 2\) per cell in work, dissipating heat. Crucially, the fresh stack was pre-prepared with \(N kT \ln 2\) of free energy, sourced from an external investment. Each cycle consumes one cell’s free energy (\(\Delta F_{\text{stack}} = -kT \ln 2\) per cycle), powering the work extraction. The demon is thus an engine depleting a finite fuel store, not violating the second law.

