answer: |-
  ## The Unplaceable Circumstance

  Thorne’s finger traced the entry number on the Elise Vance file: 7-831-Alpha. Seven years. Seven years of letters phrased every conceivable way, delivered at dawn, dusk, rain or shine; meetings arranged with her sister present, her sister absent, her sister hostile; offers of grace periods, partial settlements, even – in a desperate, budget-shattering gambit last winter – outright forgiveness contingent on immediate signature. The Register held the verdict for each meticulously constructed circumstance. *Declines. Declines. Declines.* The signature, the small, necessary act that would release the stalled Grantham Mills refinancing and save Thorne’s department, remained stubbornly absent. The Register declared it *unavailable* under any permutation Thorne’s department could engineer. Yet the directive remained: Secure Vance. Thorne kept assembling placements, deploying resources like pebbles dropped into a bottomless well, listening only for the silence.

  Downstairs, the schism festered. It manifested in requisition denials and frosty exchanges over the coffee urn. Kellis’s faction, the Extrapolators, argued that entries cohered. Vance’s pattern of refusal indicated deep intransigence; resources were better spent on files showing malleable tendencies. "Predictive validity," Kellis called it in budget meetings, implying a foundation beneath the brute data. Thorne’s faction, the Tabularists, saw only the entries themselves – discrete, inexplicable truths. Vance declined under condition set A, B, C… through Z. That was all. Extrapolation was superstition, mistaking correlation for causation. The Register offered knowledge, not understanding. Kellis’s promotion last month, and the subsequent reallocation of junior officers to his "high-yield potential" projects, was a victory for the Extrapolators. It meant Thorne worked Vance’s file mostly alone now, a diminishing allocation of administrative hours ticking away.

  The summons came after Vance’s latest refusal, delivered in person at the designated neutral location – a public library study room. She hadn’t even opened the folder containing the revised, impossibly generous terms. "It’s not about the money, Mr. Thorne," she’d said, her voice flat, eyes fixed on the grain of the table. "It’s the principle. Grantham Mills broke its word to my father. Signing feels like… complicity." Thorne knew the Register entry for this exact circumstance: *Declines, cites principle, folder untouched.* He’d read it before arranging the meeting. He’d hoped, foolishly, for a variance. There never was.

  Back at the Recovery Office, Section Chief Rigg demanded a debrief. Thorne laid out the sterile facts: placement executed, circumstance as indexed (Library Study Carrel 4B, 14:30, clear skies, revised Grantham-H proposal, no third parties), outcome: decline. Rigg, an Extrapolator by convenience, drummed stubby fingers. "Principle? After seven years? The woman’s pathological. A stone wall. Kellis was right. We’re pouring resources into a void."

  A cold, reckless clarity settled over Thorne. The years of futile effort, Kellis’s smug ascent, the sheer *waste* of knowing the inevitable and being compelled to enact it anyway. "It’s not pathology, Chief," Thorne heard himself say, the words precise, dangerous. "It’s simply what is. For her, in that circumstance. Just like this." He pulled the thin, buff-colored sheet from the Vance dossier – the Register entry for the meeting that had just concluded. He slid it across Rigg’s desk, then turned it towards Vance’s file photo. "This is what she would do. We knew it before she walked in. We know it now."

  Rigg froze. Showing a subject their own entry was… not forbidden, exactly, but deeply taboo. A contamination of the circumstance. Vance stared back from the photo, oblivious to the words beside her face: *Declines, cites principle, folder untouched.*

  "What is this?" Rigg hissed, paling. "Thorne, you idiot—"

  "The circumstance didn’t include her seeing it," Thorne said, the Tabularist logic a cold shield. "This is merely a record. Does knowing the record change the truth it recorded? We’ll see." He picked up the phone, requested Vance be brought back. Rigg looked ill.

  Vance sat again in the stark interview room, not the library. Confusion warred with defiance on her face. Thorne placed the Register sheet on the table, facing her. He pointed to the entry number, the time/date stamp, the location code. Then to the core text: *Declines, cites principle, folder untouched.*

  She read it. Once. Twice. Her eyes widened slightly, then narrowed. A flush crept up her neck. She looked from the sheet to Thorne, then to Rigg hovering nervously by the door. "What is this?" Her voice was low, tight. "Some kind of… trick? You wrote down what I did *before* I did it?"

  "It’s the Register, Ms. Vance," Thorne said, his voice unnaturally calm. "It’s always there. For every circumstance."

  She stared at the sheet, at the damning, pre-existing account of her refusal. Her jaw clenched. The defiance didn’t waver; it calcified. "So," she said, the word brittle. "It was never going to happen. No matter what you offered. You knew. All this time, you *knew*." She didn’t touch the new terms folder Thorne had placed beside the Register sheet. She stood up. "Then we’re done. Utterly done. Don’t contact me again." She walked out, her shoulders rigid. The Register sheet lay on the table, unchanged. The circumstance of *seeing* her entry hadn’t been indexed. It hadn’t altered the truth of the entry *about* the library meeting. The principle held. Knowledge hadn’t conferred control. It had only confirmed impossibility and burned the bridge entirely.

  Rigg’s fury was glacial. "You’ve contaminated the entire file chain, Thorne. You’ve potentially invalidated future placements with her by introducing an un-indexed variable – her awareness of the Register itself! And for what? To prove a point only you and your dusty faction care about?" The consequences were swift, administrative, brutal. A lateral move so lateral it was subterranean: Thorne was reassigned to Verification, a windowless annex where officers cross-referenced completed placement reports against Register entries flagged for potential anomalies. Paperwork validating the past, not shaping the future. Kellis absorbed Vance’s file into his "Intransigent Portfolio," a euphemism for managed failure.

  Now, Thorne sits at the Verification desk. A new file lands in the inbox: a routine check. The case officer’s report describes a successful recovery – a signed agreement obtained after presenting revised terms during a home visit (circumstance: subject’s residence, 19:00, heavy rain, spouse present). Thorne pulls the corresponding Register entry. It reads: *Declines revised terms, cites dissatisfaction with interest calculation.* Not *Signs*. Thorne checks the indices. The circumstance code matches. The outcome doesn’t. A cold ripple passes through him. Did the officer falsify the report? Or did the Register… err? The implications are vertiginous. He stamps the verification sheet: **Discrepancy. Refer for Audit.** He places it in the out-tray. Another file drops into the inbox. He reaches for it. Across the room, a junior Extrapolator laughs at something Kellis says. Outside Thorne’s tiny, high window, rain streaks the grimy glass. The unsigned Grantham-H proposal, Elise Vance’s silent monument, sits deep within archived storage, gathering dust. The institution grinds on, knowing everything it can know, achieving only what circumstance allows.

  Logline: A bureaucrat exhausts every avenue to secure a debtor's signature, knowing the outcome is impossible, while office factions feud over the source of their infallible records.
