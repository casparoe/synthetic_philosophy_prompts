  For the Argument section, breaking it into steps is crucial. The sealed device scenario must be central. Step one: Establishing D as a device requires finite verification. Steps two and three: Evidence only includes checkable cases, so no oracle proof. Step four: The input-output relation’s stability relies on prior computations. 

  Handling objections is critical. Unfalsifiability is a big one. If the thesis can’t be disproven, is it empty? Need to admit it’s not empirical but clarify it’s a frame for empirical claims. Conflation of math and physics is another—must differentiate by showing physical measurement presupposes computability. 

  Costs include not being able to entertain certain thought experiments as meaningful. But the user knows this, so acknowledge it upfront. They want the costs laid out, no hedging. 

  Also, the user’s tone is academic but frustrated with rehashed debates. They seek a forceful, original argument. Avoid jargon where possible, but precision is key. Make sure each section addresses their concerns directly, especially the concrete example of device D. 

  Need to ensure that "presupposition" is distinct from convention. It’s not arbitrary but necessary for measurement. Highlight that without it, we couldn’t even start an experiment. 

  Finally, in Costs, admit that this view dismisses hypercomputers as unobservable. But that’s the trade-off for a coherent epistemology of measurement. The debate shifts from "can we build it" to "how do we measure."
answer: |-
  ### 1. **Bottom line**  
  The Church-Turing thesis (CTT) is neither an empirical hypothesis about physics nor a tautology about computation. It functions as an *epistemic precondition* for identifying any physical system as a computational device. To treat a physical process as a "device" with inputs, outputs, and a stable input-output function presupposes that its behavior is verifiable by finite procedures—procedures that, by CTT, are Turing-computable. Therefore, no observation can *report* a violation of CTT because any purported counterexample would require prior finite verification of the device's function, collapsing it back into the computable. Claims of hypercomputation are invariably reinterpreted as errors in modeling or measurement, not as empirical falsifications of CTT.  

  ### 2. **What is and is not being claimed**  
  This position rejects two views:  
  - **Not analytic**: CTT is not a definitional truth about "effective procedures." We can *imagine* non-computable processes (e.g., oracle machines) without contradiction.  
  - **Not empirical**: CTT is not falsifiable by experiments like the sealed device *D*. Any physical setup claiming to compute the halting problem would depend on finite verification, which is computable.  

  **Why "presupposition"?**  
  Unlike a "convention" (which is arbitrary) or a "background assumption" (which could be revised), a *presupposition* is a condition for the possibility of an activity. Identifying a system as a *device* requires establishing stable input-output mappings through repeatable tests—all finitely executable. CTT is presupposed because without assuming the computability of verification, we cannot even *begin* to treat a physical system as implementing a function. It structures how we frame observations, making non-computability *epistemically inaccessible*.  

  ### 3. **The argument**  
  **Step 1: Identifying *D* as a device demands finite verification.**  
  To call *D* a "halting oracle," experimenters must first confirm:  
  - Input *n* reliably encodes a Turing machine index.  
  - Output bits consistently correlate with halting behavior.  
  - The input-output relation persists across repetitions.  
  This requires *finite protocols*: e.g., testing *D* on machines with known halting status, ensuring bit-readings aren’t corrupted, and ruling out environmental confounders. Crucially, *all* such protocols are computable operations.  

  **Step 2: Evidence for *D*’s correctness is always computably verified.**  
  The sealed-device case shows that every "success" of *D* is recorded *only* when the halting status is independently settled by finite means (e.g., running the machine, checking a proof). The evidence set *E* contains *only* pairs `(n, D(n))` where the correct answer was computably verified. There is *no* instance in *E* of `D(n)` being correct *and* uncomputable.  

  **Step 3: *D*’s behavior on unverifiable inputs is epistemically inert.**  
  For inputs where the halting status is unknown (e.g., a machine requiring `10^100` steps), *D*’s output cannot be added to *E*—there is no way to confirm it without finite verification. Thus, *D* could be a Turing machine with a clever heuristic, and its outputs on unverifiable inputs are indistinguishable from an oracle’s. But we cannot access these outputs *as evidence* without collapsing them into the computable.  

  **Step 4: Stability of the input-output relation presupposes computability.**  
  The experimenters must ensure *D*’s function is stable: entering `n` twice yields the same bit, and the bit "means" halting for `n`—not a coincidental correlation (e.g., `n` correlating with cosmic noise). Establishing this requires modeling *D*’s internals or testing auxiliary hypotheses (e.g., "Does input `n` always trigger the same subsystem?"). These are *themselves* finite procedures, computable by Turing machines. If *D*’s behavior drifts on unverifiable inputs, we attribute it to device failure, not oraclehood.  

  **Conclusion**: The very act of designating *D* as a device with a specific function rests on computable verification. Any "observation" of non-computability would first require non-computable verification—a contradiction. CTT survives because it is a scaffold for empirical inquiry, not an object within it.  

  ### 4. **The three hardest objections**  
  **Objection 1: This renders CTT unfalsifiable and thus unscientific.**  
  - **What survives**: Yes, CTT is unfalsifiable—but not vacuous. It functions like Kantian categories: a condition for empirical claims rather than one of them. We forfeit the ability to call hypercomputation "empirically possible," but this is a cost of clarity, not rigor.  
  - **What doesn’t**: We cannot entertain "what if we saw unambiguous hypercomputation?" as a meaningful scenario. But this merely exposes that such thought experiments smuggled in finite verification.  

  **Objection 2: You conflate the mathematical CTT (about functions) with the physical CTT (about processes).**  
  - **What survives**: The two are distinct—but *linking* them requires measurement. The physical thesis ("all physical processes are computable") is untestable because *testing* it requires identifying a physical process *as* computing a function. And as argued, that identification is computably saturated.  
  - **What doesn’t**: We must abandon hopes of a "direct" physical refutation. Physics might discover uncomputable laws, but we could never *observe* a law *as* computing a specific uncomputable function.  

  **Objection 3: What if *D*’s builder provides a proof of its oracle-capability?**  
  - **What survives**: The proof must be verified by the experimenters using finite methods (e.g., checking deductive steps). If the proof relies on non-computable inferences, it cannot be recognized *as* a proof. If it is computably verified, it reduces *D* to a computable black box executing the builder’s algorithm.  
  - **What doesn’t**: The builder’s testimony might *persuade*, but persuasion is a psychological event, not an epistemic foundation for device-identification.  

  ### 5. **Costs and concessions**  
  This position forces three surrenders:  
  - **Loss of empirical content for CTT**: We can no longer say CTT is "supported by the failure to find counterexamples." Its truth is prior to empirical testing, so absence of evidence isn’t evidence for CTT—it’s constitutive of observation.  
  - **Forfeiting hypercomputation arguments**: Thought experiments (e.g., Malament-Hogarth spacetimes) become *conceptual toys* with no observational consequences. We cannot say, "This would work if we built it," because "working" implies observable verification, which presupposes CTT.  
  - **Debate dissolution**: The "empirical vs. analytic" dispute evaporates. CTT isn’t a hypothesis but a frame for computation-talk. The debate shifts to whether this frame is *inescapable*—and if not, what alternative epistemology could license non-computable observation.  

  The concession is stark: **We cannot coherently describe an observation that refutes CTT**. But this isn’t a defect—it reveals that CTT’s job was never to describe the world’s limits, but ours.
