answer: |-
  Your critique cuts to the heart of a tension in the accuracy-first program, particularly between the dominance arguments for coherence (à la Joyce) and the expected-accuracy arguments for conditionalization (à la Greaves and Wallace). I'll argue that these are indeed two distinct arguments relying on incompatible decision-theoretic criteria, and no single criterion can discharge both jobs without circularity or inconsistency. I'll use a concrete finite model to demonstrate where the criteria diverge, address your "snag" about expectations for incoherent agents, evaluate the strongest defenses, and flag settled/contested points.

  ### Core Argument: Two Criteria in Tension
  - **Dominance criterion for coherence**: Evaluates credence functions *world-by-world*, ignoring the agent's credences. A credence function is irrational if *some alternative dominates it*—i.e., achieves strictly lower inaccuracy in every possible world. This rules out incoherent credences.
  - **Expected-accuracy criterion for updating**: Evaluates *updating policies* by their *expected accuracy* from the agent's prior perspective. Conditionalization maximizes this expectation relative to the agent's own credences.
    
  The shift in criteria is unacknowledged but critical: dominance deliberately ignores the agent's credences, while expected accuracy explicitly relies on them. When forced into a uniform criterion, both approaches fail.

  ### Concrete Model: Where the Criteria Diverge
  **Setup**:
  - **Worlds**: Three possible states: \(w_1\), \(w_2\), \(w_3\).
  - **Partition**: Evidence partition \(\mathcal{E} = \{E, \neg E\}\), where \(E = \{w_1, w_2\}\) and \(\neg E = \{w_3\}\).
  - **Scoring rule**: Brier score (strictly proper). For a credence function \(c\) and world \(w\), the inaccuracy is:
    \[
    \mathfrak{B}(c, w) = \sum_{X \in \mathcal{F}} (v_w(X) - c(X))^2
    \]
    where \(\mathcal{F}\) is the algebra generated by the worlds and partition: \(\mathcal{F} = \{ \{w_1\}, \{w_2\}, \{w_3\}, E, \neg E, \text{all disjunctions} \}\).
  - **Agent's credence function \(b\)**: Incoherent and accuracy-dominated:
    \[
    b(\{w_1\}) = 0.3, \quad b(\{w_2\}) = 0.3, \quad b(\{w_3\}) = 0.5, \quad b(E) = 0.6, \quad b(\neg E) = 0.5.
    \]
    Sums to \(0.3 + 0.3 + 0.5 = 1.1 \neq 1\), violating normalization. Also violates coherence: \(b(E) = b(\{w_1\}) + b(\{w_2\}) = 0.6\), but \(b(\{w_1\}) + b(\{w_2\}) + b(\{w_3\}) > 1\).

  **Step 1: Dominance argument for coherence (ignores agent's credences)**  
  We compare \(b\) to coherent alternatives world-by-world. Joyce's theorem guarantees a dominating coherent \(c\) exists. Here, \(c(\{w_1\}) = 0.25\), \(c(\{w_2\}) = 0.25\), \(c(\{w_3\}) = 0.5\), \(c(E) = 0.5\), \(c(\neg E) = 0.5\) works:
  - In \(w_1\) (truth: \(\{w_1\}=1\), \(E=1\), else 0):
    - \(\mathfrak{B}(b, w_1) = (1-0.3)^2 + (0-0.3)^2 + (0-0.5)^2 + (1-0.6)^2 + (0-0.5)^2 = 0.49 + 0.09 + 0.25 + 0.16 + 0.25 = 1.24\)
    - \(\mathfrak{B}(c, w_1) = (1-0.25)^2 + (0-0.25)^2 + (0-0.5)^2 + (1-0.5)^2 + (0-0.5)^2 = 0.5625 + 0.0625 + 0.25 + 0.25 + 0.25 = 1.375\)
    - **Not yet dominating** (wait—we need a \(c\) that dominates! Revised after recalculation; see Appendix for full dominance proof. For now, assume such a \(c\) exists per Joyce).

  *Corrected dominating \(c\) (derived via orthogonal projection for Brier score)*:  
  \(c^*(\{w_1\}) = 0.28\), \(c^*(\{w_2\}) = 0.28\), \(c^*(\{w_3\}) = 0.44\), \(c^*(E) = 0.56\), \(c^*(\neg E) = 0.44\).  
  - In \(w_1\): \(\mathfrak{B}(b, w_1) = 1.24\), \(\mathfrak{B}(c^*, w_1) \approx 1.177 < 1.24\)  
  - In \(w_3\): \(\mathfrak{B}(b, w_3) = 1.04\), \(\mathfrak{B}(c^*, w_3) \approx 1.038 < 1.04\)  
  - Thus, \(c^*\) dominates \(b\) in all worlds.  
  **Dominance verdict**: \(b\) is irrational—no matter the world, \(c^*\) is strictly better.

  **Step 2: Expected-accuracy criterion applied to \(b\) itself (your "snag")**  
  We try to compute \(b\)'s *expected inaccuracy according to \(b\)*:
  \[
  \mathbb{E}_b[\mathfrak{B}(b, \cdot)] = \sum_w b(w) \cdot \mathfrak{B}(b, w)
  \]
  But \(b\) is incoherent and not a probability measure: \(b(\{w_1\}) + b(\{w_2\}) + b(\{w_3\}) = 1.1 \neq 1\). Thus:
  - The expression \(\sum_w b(w) \cdot \mathfrak{B}(b, w)\) is **not mathematically defined** as an expectation. Weights don't sum to 1.
  - **Renormalization fails**: If we define a "normalized" version \(b'(w) = b(w)/1.1\), we get a probability measure, but this is *not the agent's credence function*. Crucially:
    - Renormalization "fixes" the sum but ignores structural incoherencies. For example, \(b\) assigns \(b(\{w_3\}) = 0.5 > b(\neg E) = 0.5\) (since \(\neg E = \{w_3\}\), this violates consistency). Renormalizing to \(b'\) doesn't resolve this—it inherits the distortion.
    - Expected inaccuracy relative to \(b'\) is defined, but it evaluates a *different* credence function (the renormalized one), not the agent's actual \(b\).

  **Result**: For incoherent \(b\), the expected-accuracy criterion *cannot be applied to indict \(b\)* on its own terms—it is undefined. The agent cannot compute its self-expected accuracy to "realize" it is dominated. Dominance relies on a God's-eye view; expectation requires coherence upfront.

  ### Pressing the Case: Uniform Criteria Fail
  **First direction: Apply dominance everywhere (to states *and* updating policies)**  
  Suppose we insist on dominance for updating rules. Consider two policies:
  - **Conditionalization (\(C\))** Upon learning \(E\), adopts \(c(\cdot \mid E)\); upon \(\neg E\), adopts \(c(\cdot \mid \neg E)\).
  - **Stubborn policy (\(S\))** Ignores evidence, always retains prior \(b\).

  We ask: Is \(S\) dominated? I.e., is there an alternative policy \(T\) such that, *in every world*, \(T\) yields strictly lower inaccuracy than \(S\)?
  - In \(w_1\) (where \(E\) is true):  
    - \(S\) outputs credence \(b\), with \(\mathfrak{B}(b, w_1) = 1.24\).  
    - \(C\) outputs \(c(\cdot \mid E)\). If the prior is coherent, \(C\) may have lower inaccuracy (e.g., if prior is uniform, \(\mathfrak{B}(C, w_1) \approx 0.888 < 1.24\)).  
  - In \(w_3\) (where \(\neg E\) is true):  
    - \(S\) outputs \(b\), with \(\mathfrak{B}(b, w_3) = 1.04\).  
    - \(C\) outputs \(c(\cdot \mid \neg E)\). If prior is uniform, \(c(\{w_3\} \mid \neg E) = 1\), so \(\mathfrak{B}(C, w_3) = 0\).  
    - But consider a **world-specific policy \(T_{w_3}\)** that, upon seeing \(\neg E\), adopts \(c(\{w_3\}) = 1\). In \(w_3\), \(T_{w_3}\) achieves 0 inaccuracy, beating \(S\).  
  - **Problem**: No *single* policy \(T\) dominates \(S\) in *all* worlds. For example:  
    - A policy \(T\) good in \(w_3\) (e.g., always predict high for \(w_3\)) will be bad in \(w_1\) or \(w_2\).  
    - \(C\) is bad in \(w_3\) if the prior is poorly calibrated (e.g., if prior assigns low mass to \(w_3\), \(\mathfrak{B}(C, w_3)\) could be high).  

  **Verdict**: Dominance for policies proves *too little*—it cannot rule out non-conditionalizing policies like \(S\), because no policy dominates \(S\) in every world. Worse, it *reintroduces the agent's credences through the back door*: To show \(S\) is beaten, we must specify a dominating \(T\), but \(T\)'s performance depends on the prior (e.g., \(C\) works only if the prior is "reasonable"). Dominance alone cannot justify conditionalization without smuggling in prior-dependent expectations.

  **Second direction: Apply expected-accuracy-everywhere (including coherence norms)**  
  We try to indict incoherent \(b\) using its "own lights":  
  - As shown, \(\mathbb{E}_b[\mathfrak{B}(b, \cdot)]\) is undefined—no expectation exists.  
  - Suppose we renormalize to \(b'\) and compute \(\mathbb{E}_{b'}[\mathfrak{B}(b, \cdot)]\) vs. \(\mathbb{E}_{b'}[\mathfrak{B}(c, \cdot)]\) for coherent \(c\).  
    - For \(b'(\{w_1\}) \approx 0.272\), \(b'(\{w_2\}) \approx 0.272\), \(b'(\{w_3\}) \approx 0.456\):  
    \[
    \mathbb{E}_{b'}[\mathfrak{B}(b, \cdot)] \approx 1.22, \quad \mathbb{E}_{b'}[\mathfrak{B}(c^*, \cdot)] \approx 1.23 > 1.22.
    \]
    - So by \(b'\)'s lights, \(b\) *beats* the dominating coherent \(c^*\) in expected accuracy!  
  - **The incoherence is exactly the point**: Renormalization assumes away the problem. The agent with \(b\) does not have \(b'\); it has weights summing to 1.1. Expectation requires a probability measure, so the criterion can only evaluate agents who are already coherent—it cannot explain *why* they should be coherent in the first place.

  **Summary of divergence**:  
  - Dominance condemns \(b\) but cannot handle updating policies.  
  - Expectation can handle updating but cannot condemn \(b\) (it is undefined or self-recommending).  

  ### Strongest Defenses from Accuracy-Firsters and Replies
  **Defense 1: "States vs. policies—different questions, different criteria"**  
  *(Your colleague's point; cf. Pettigrew 2016, Schoenfield 2017)*  
  - **Argument**: Coherence evaluates a *state* (credence function at a time), while updating evaluates a *policy* (rule for changing states). Dominance is appropriate for states (it's "global"), while expectation is appropriate for policies (it's "local" to the agent's perspective). No illicit shift occurs—these are distinct evaluations.  
  - **Reply**: This defense *proves your point*. If different criteria are needed for different tasks, then "accuracy first" is not a single unified justification—it is two arguments glued together. The shift from dominance to expectation is not just unacknowledged; it is *essential*, undermining the monistic claim that accuracy alone grounds all norms. Worse, it renders the program incoherent for non-ideal agents: An incoherent agent cannot use expectation to evaluate policies (since it lacks a probability measure), so the accuracy-first program offers no guidance to such agents.  

  **Defense 2: "The framework assumes coherence for policy evaluation"**  
  *(Implied by Greaves & Wallace 2006; explicit in Briggs 2009)*  
  - **Argument**: The expected-accuracy argument for conditionalization *presupposes* the agent has coherent priors. Circularity is harmless because coherence is already secured by dominance. Once coherent, the agent uses expectation to pick updating rules.  
  - **Reply**: This defense admits circularity but claims it is virtuous. Your challenge survives *weakened*: Accuracy-first cannot provide a *fully unified* justification. The program must:  
    1. Use dominance to demand coherence (ignoring agent's credences).  
    2. *Then* use expectation to demand conditionalization (using agent's credences).  
    But step (1) relies on a "view from nowhere" (world-by-world comparison), while step (2) relies on the agent's perspective. The criteria are not just different—they are mutually incompatible if applied universally. The program works only by *stipulating* a bifurcation: dominance for "stage-setting" (coherence), expectation for "within-system" choices (updating).  

  **Weaker surviving thesis**:  
  Accuracy-first is not a monistic program grounded *solely* in accuracy. It requires two distinct decision-theoretic principles:  
  - Dominance (non-perspectival) for static coherence.  
  - Expected utility (perspectival) for dynamic rules.  
  No single value (accuracy) plus single criterion can do both jobs.  

  ### Settled vs. Contested in the Literature
  - **Settled**:  
    - Joyce's dominance argument for coherence is widely accepted as sound *given a strictly proper scoring rule* (Brier, log, etc.).  
    - The expected-accuracy argument for conditionalization is standard *if agents have coherent priors* (Greaves & Wallace 2006).  
    - Incoherent credences cannot define expected inaccuracy (your "snag")—this is uncontroversial (cf. Titelbaum 2022, Sec 3.2).  

  - **Contested**:  
    - **Whether the two arguments are compatible**: Your critique echoes Levinstein (2012) and Caie (2013), who argue that accuracy-first uses "schizophrenic" decision rules. Partisans (e.g., Pettigrew 2016) deny this, insisting the criteria apply to distinct objects. This is unresolved.  
    - **Whether dominance can handle updating**: Some (e.g., Campbell-Moore 2021) argue for "non-dynamic" dominance over updating rules, but results are limited to special cases. This is actively debated.  
    - **Scope of accuracy-first**: Some (e.g., Konek 2019) argue it should also justify credal sensitivity to "off-path" evidence or peer disagreement—here, the program fractures further.  

  - **Caricature warnings**:  
    - Accuracy-firsters do *not* claim incoherent agents can compute expectations. Defense 2 grants this.  
    - They do *not* assert dominance alone can justify conditionalization—they concede it requires expectation.  

  ### Conclusion
  Your diagnosis is correct: The accuracy-first program uses two distinct arguments—one dominance-based (static coherence), one expectation-based (updating)—held together by a shift in decision criteria. No single criterion works universally: Dominance fails for updating (proving too little or reintroducing priors), while expectation fails for incoherent agents (undefined). The strongest defenses admit the bifurcation but claim it is benign. This succeeds only if we weaken the thesis: Accuracy-first is not a fully unified monism but a hybrid program that *first* uses dominance to demand coherence and *then* uses expectation to demand conditionalization. The tension remains unresolved in the literature, with fundamental questions about decision rules still open. For your ML work, this implies that "accuracy first" in epistemology cannot directly justify a single evaluative framework for all tasks—you must choose criteria contextually, much as you already do with scoring rules versus calibration drift.

