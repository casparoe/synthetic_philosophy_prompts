prompt: |-
  I was hired seven weeks ago out of a philosophy department to co-lead a small group at a rehabilitation-engineering lab. We build assistive systems that infer what a user wants from what the user does: a robotic arm that learns which objects to offer, a daily scheduler that learns which activities to protect when the user is fatigued. The two senior researchers I now sit between have been in open disagreement for the better part of a year, and our director has asked them to bring a joint statement to next month's internal review — something both of them could sign, setting out what they agree on and exactly where they still differ. They have both, generously or otherwise, delegated the first draft to me. I would like you to write that draft.

  The two positions, in the vocabulary each side prefers for itself:

  The **measurement faction** holds that an inferred reward is an estimate of a real psychological quantity. Behavior is generated by preferences operating under beliefs, costs, and a bounded planning procedure; if we model the planning procedure honestly and collect enough data, including data from varied contexts, then the fitted reward is a measurement of the user's preferences in the ordinary sense — noisy, corrigible, but about something. On this view, the assistant's default posture is deference: when the model is confident, its output is a legitimate stand-in for the user's own judgment about what to reach for, and the user's moment-to-moment choices deserve the same authority we would grant anyone's choices.

  The **design faction** holds that what our fitters return is a proposal, not a discovery. A reward is never recovered on its own but only relative to a hypothesis class we chose, a planner model we chose (discount, noise, myopia, cost of asking), and a dataset we chose by deciding which episodes count. The same behavior trace can be rationalized by many reward–planner pairs, and our selection among them is driven by tractability and fit statistics rather than by evidence about the person. On this view, the label "preference" carries a normative commitment we have not earned, especially since much of the behavior we fit is habitual, coerced by circumstance, shaped by embarrassment, or the residue of adaptation to what has been available; the assistant's default posture is therefore to treat the inferred reward as something the user must be able to inspect and ratify.

  Four technical matters must be dealt with explicitly, because both sides keep invoking them at cross purposes:

  1. The invariance results — reward is identifiable only up to positive affine transformation and up to transformations that leave the optimal policy set unchanged. Both sides need to say what survives these invariances and whether what survives is enough to be called a preference.
  2. What I will call the reward–planner entanglement: in the offline setting, ambiguity between a person's reward and our model of their planning is not merely a small-sample problem. The statement must record whether each side takes this to be underdetermination in principle or in practice.
  3. The validity criterion: held-out predictive accuracy on future choices, versus the user's informed retrospective endorsement of what the system did on their behalf.
  4. The cooperative formulation in which the robot is explicitly uncertain about the human's reward and queries it — whether this dissolves the dispute or simply relocates it into the design of the query.

  The document should be built around a case both principals already accept as legitimate. We call it the Thermos case. A user with a spinal cord injury operates an arm that fetches items. Across forty days we log reaches, acceptances, and refusals. The user often refuses an item they rank highly in interview when retrieving it would require asking the on-duty caregiver to reposition it, and often accepts a mildly aversive item when retrieval is unaided. Two models fit the held-out choices about equally well. M1 posits the reward the user states in interview, plus a large negative weight on requiring assistance — a stable preference against being a burden. M2 posits a reward with no assistance term at all, plus a planner that is myopic about the social friction of the moment. The deployments diverge: under M1 the arm should keep declining assistance-requiring options as the user's settled wish; under M2 the arm should sometimes decline to honor the observed reluctance, because the reluctance is a planning artifact the user disavows when asked calmly afterward.

  Please produce:

  - A numbered section of agreed claims — the formal, empirical, and normative propositions both factions can sign as written. Where a claim is signed for different reasons by the two sides, add a one-line parenthetical saying so. Where a claim can only be signed with a qualification, put the qualification in the claim rather than in a footnote.
  - A disagreements table with columns for the issue, the formulation the measurement faction would accept as a statement of its own view, the formulation the design faction would accept as a statement of its own view, and a judgment of whether the residual difference is substantive or verbal. Nothing in a cell may be slanted; each side should be able to read its own row without wincing.
  - The cruxes: the sub-questions such that settling them would actually move at least one side. For each, name the case, dataset, experiment, or argument that both factions would accept as bearing on it, and record each side's prediction in advance, stated precisely enough that abandoning it later would cost something. For the Thermos case specifically, I want a prediction from each side about whether any further observational or interventional data — varying the cost of asking, offering a route that removes the social friction, comparing blocks in which the caregiver is and is not present — separates M1 from M2, and about whether the fitted assistance weight tracks the user's post hoc endorsement.
  - A closing section in which each side states what would count as evidence against its own position, not against the other's.
  - One paragraph on whether the cruxes change when the user's capacity to endorse is itself fluctuating, since roughly half the people we serve are in that category.

  Two constraints on the writing. Do not give me a survey of the literature and do not include references or a reading list; the positions are fully described above and what I need is the drafting. And be willing to conclude that part of this dispute is about words — if you think the argument over whether the fitted quantity deserves the name preference is verbal while the argument over deference versus override is not, say so plainly and specify what vocabulary both sides would have to adopt for the substantive residue to become visible.
reasoning: |-
  We are drafting a joint statement for two factions in a rehabilitation-engineering lab. The factions are the "measurement" and "design" factions. The document must include:
  1. A section of agreed claims (numbered), with parentheticals if signed for different reasons, and qualifications in the claim if needed.
  2. A disagreements table with columns: issue, measurement faction's view, design faction's view, and judgment on whether the difference is substantive or verbal.
  3. Cruxes: sub-questions that would move at least one side, with a case/dataset/experiment that both accept, and each side's prediction. For the Thermos case, we need predictions on whether further data separates M1 and M2 and whether the assistance weight tracks endorsement.
  4. A closing section where each side states what would count as evidence against its own position.
  5. One paragraph on how cruxes change when the user's capacity to endorse is fluctuating.

  Constraints: No literature survey or references. Be willing to conclude part is verbal.

  We start with the agreed claims. Both sides agree on formal, empirical, and normative propositions. We base this on the description and the Thermos case.

  Agreed Claims:

  1. Our systems infer a reward function from behavioral data, using a model that includes both a reward function and a planning process (which may include discounting, noise, myopia, and costs of action).
     (Both sides agree on the structure of the model, though they interpret the reward differently.)

  2. The inference problem is underdetermined: the same behavior can be explained by multiple combinations of reward and planner models (as illustrated by the Thermos case with M1 and M2).
     (Both sides accept the underdetermination, but they differ on its implications.)

  3. The reward function is identifiable only up to positive affine transformations and up to transformations that leave the optimal policy set unchanged (invariance results).
     (Both sides accept the formal invariances.)

  4. In the offline setting, the ambiguity between reward and planner model (reward-planner entanglement) is not solely due to limited data; it is a structural feature of the problem.

  5. The quality of a model is assessed by both predictive accuracy on held-out behavioral data and by the user's retrospective endorsement of the system's actions. Both are important, though they may sometimes conflict.

  6. In the Thermos case, both M1 and M2 fit the observed data approximately equally well, but they lead to different deployments: M1 leads to deference to the observed reluctance (declining assistance-requiring options), while M2 leads to sometimes overriding that reluctance.

  7. The assistant's behavior must be interpretable and controllable by the user, and the user must be able to inspect and, if necessary, correct the system's inferences and actions.

  Now, for the disagreements table. We need to capture the essence of each faction's view without slanting.

  Disagreements Table:

  | Issue | Measurement Faction View | Design Faction View | Substantive or Verbal |
  |-------|---------------------------|---------------------|------------------------|
  | Ontological status of the inferred reward | The inferred reward is an estimate of a real psychological quantity (preference) that exists independently of the model. | The inferred reward is a proposal, constructed relative to the chosen model class and data, and does not necessarily correspond to a pre-existing psychological state. | Substantive |
  | Default posture of the assistant | The assistant should defer to the inferred reward when the model is confident, treating it as a legitimate stand-in for the user's judgment. | The assistant should treat the inferred reward as provisional and subject to the user's inspection and ratification; it should not be automatically deferred to. | Substantive |
  | Interpretation of the invariance results | The invariances do not prevent the recovery of the user's preference structure; what survives (e.g., ordinal comparisons, trade-off ratios) is sufficient to define a preference. | The invariances, combined with the reward-planner entanglement, mean that the fitted reward is not a unique representation of the user's inner state; the surviving structure is not enough to call it a "preference" without qualification. | Partly verbal (if we clarify what "preference" means) and substantive (on whether the structure is sufficient for deference) |
  | Reward-planner entanglement | The entanglement is a practical challenge that can be mitigated with more data (especially from varied contexts) and better modeling; it does not imply underdetermination in principle. | The entanglement is a matter of principle; even with infinite data, the separation between reward and planner is underdetermined without additional assumptions. | Substantive |
  | Validity criterion | Predictive accuracy on future choices is the primary criterion; endorsement is a secondary check. | The user's informed retrospective endorsement is the primary criterion; predictive accuracy is necessary but not sufficient. | Substantive |
  | Cooperative formulation (with queries) | Queries can resolve ambiguity by eliciting direct input, making the inferred reward more accurate and thus dissolving the dispute. | Queries relocate the dispute into the design of the query (e.g., how to present options, when to ask) and the interpretation of the responses, which are still subject to the same modeling choices. | Substantive |

  Now, the cruxes. We need sub-questions that would move at least one side, with a case/dataset/experiment and predictions.

  Cruxes:

  1. **Crux: Can the reward-planner ambiguity be resolved by data?**
     - Case: Thermos case with additional data.
     - Experiment: Vary the cost of asking (e.g., by having different caregivers with known attitudes, or by simulating scenarios where the social friction is removed). Also, compare blocks with and without the caregiver present, and offer a route that removes social friction (e.g., a self-repositioning mechanism).
     - Measurement Faction Prediction: The additional data will separate M1 and M2. Specifically, when the cost of asking is reduced, the user will accept more assistance-requiring items, which M1 (with a stable negative weight on assistance) will not predict, but M2 (with a myopic planner) will. Also, the fitted assistance weight in M1 will track the user's post-hoc endorsement (i.e., when the user endorses the system's actions, the weight will be consistent with their stated preference).
     - Design Faction Prediction: The additional data will not fully separate M1 and M2 because the models can be adjusted to fit (e.g., by adjusting the planner in M1 or the reward in M2). The fitted assistance weight in M1 will not consistently track the user's endorsement because the weight is a modeling artifact and not a stable preference.

  2. **Crux: Is the user's endorsement predictable from the model?**
     - Case: Thermos case and similar cases.
     - Experiment: After each action (or a set of actions) by the system, ask the user to endorse the action (e.g., "Was this the right thing to do?"). Then, correlate the endorsement with the model's confidence and with the specific parameters (like the assistance weight in M1).
     - Measurement Faction Prediction: The endorsement will be predictable by the model's confidence and by the parameters of the reward function (e.g., a high negative assistance weight will predict endorsement of non-assistance actions when the user disavows the reluctance).
     - Design Faction Prediction: The endorsement will not be reliably predicted by the model's parameters because the endorsement depends on the user's reflective state, which is not captured by the behavioral data alone. Instead, the endorsement may depend on factors outside the model (e.g., the user's mood, the context of the query).

  3. **Crux: Does the cooperative formulation (with queries) resolve the dispute?**
     - Case: A new case where the system can query the user in real-time.
     - Experiment: Implement both M1 and M2 in a system that can ask the user for clarification when uncertain. Measure the rate of endorsement and the accuracy of the system's actions.
     - Measurement Faction Prediction: With queries, the system will converge to the user's true preference, and the rate of endorsement will be high. The differences between M1 and M2 will become negligible because the queries will correct any model misspecification.
     - Design Faction Prediction: The design of the queries (e.g., when to ask, how to phrase options) will heavily influence the responses and the system's behavior, leading to different outcomes depending on the initial model. The endorsement rate may not be significantly higher because the queries themselves may be intrusive or poorly timed, and the user's responses are still interpreted by the model.

  Closing Section: Evidence against each position.

  - Measurement Faction: Evidence against our position would be if, in a well-specified model with sufficient and varied data, the inferred reward consistently fails to predict the user's reflective judgments (as expressed in endorsement) and their long-term satisfaction. Also, if we can show that the same user in the same state produces behavior that is better explained by changing the planner model without changing the reward, then our claim that the reward is a stable quantity would be weakened.

  - Design Faction: Evidence against our position would be if, across a range of users and contexts, the same reward function (with the same planner) consistently predicts both behavior and endorsement without the need for ad hoc adjustments, and if the user's endorsement is stable and aligns with the reward parameters. Also, if we can develop a method to uniquely identify a reward-planner pair from data (e.g., by using a canonical planner) that then receives high endorsement, then our skepticism about the reality of the reward would be challenged.

  Paragraph on fluctuating endorsement capacity:

  When the user's capacity to endorse is fluctuating (as in about half of the users we serve), the cruxes become more challenging. For the Measurement Faction, the ability to predict endorsement may break down during periods of low capacity, forcing a reliance on predictive accuracy alone. For the Design Faction, the requirement for endorsement becomes problematic when the user cannot provide it, leading to a need for alternative safeguards (e.g., proxies, predefined values). In such cases, both factions might agree on the need for fallback strategies, but the disagreement over the status of the inferred reward remains. The experiments in the Thermos case would need to be run during both high and low capacity periods, and we would predict (Measurement) that the model's parameters still capture stable preferences even when endorsement is not available, and (Design) that the model without endorsement is even more of a proposal and requires additional oversight.

  Finally, on the verbal vs substantive dispute:

  The dispute over whether the fitted quantity deserves the name "preference" is partly verbal. If we define "preference" as the ordinal ranking that survives the invariances (and is behaviorally expressed), then the Measurement Faction would agree that they are measuring a preference, while the Design Faction would argue that the term implies a normative and stable inner state that goes beyond what the data can support. However, the core substantive dispute is about the default posture: whether to defer to the inferred reward or to require ratification. This substantive dispute would remain even if we adopted neutral vocabulary (e.g., "utility function" for Measurement and "action-guiding heuristic" for Design). To make the substantive residue visible, both sides could agree to avoid the term "preference" in favor of "fitted reward function" and then focus on the conditions under which the system should act autonomously versus seek input.

  Now, we write the draft accordingly.
answer: |-
  ### Joint Statement Draft: Measurement and Design Factions  
  **Prepared for Internal Review**  

  ---

  #### 1. Agreed Claims  
  Both factions endorse the following propositions without reservation. Where reasons diverge, parentheticals note the distinct rationales. Qualifications are embedded directly.  

  1. **Model Structure**: Our systems jointly infer a reward function and a planning model (encompassing discounting, noise, myopia, and action costs) from behavioral data.  
     *(Measurement: This structure permits recovery of true preferences. Design: This structure exposes inherent modeling choices.)*  

  2. **Underdetermination**: Given finite data, multiple reward–planner pairs can rationalize the same behavior (e.g., Thermos M1 and M2). This is not solely a small-sample issue.  

  3. **Formal Invariances**: Reward functions are identifiable only up to positive affine transformations and transformations preserving optimal policies.  

  4. **Empirical Testability**: Model quality must be evaluated against both (a) held-out predictive accuracy on choices and (b) user endorsement of system actions, though these may conflict.  

  5. **Normative Primacy of User Agency**: Systems must be interpretable, auditable, and correctable by users. Inferred rewards cannot justify overriding explicit user vetoes.  

  6. **Thermos Case Validity**: M1 (reward with assistance penalty) and M2 (no penalty, myopic planner) are empirically equivalent on the original dataset. Deployment differences (deference vs. override) stem from distinct interpretations, not model fit.  

  7. **Query Protocols**: Cooperative formulations (e.g., robots querying users) introduce new design choices (e.g., query timing/format) that affect outcomes.  

  ---

  #### 2. Disagreements Table  
  Each row neutrally states one faction’s position. "Substantive/Verbal" judges the core disagreement.  

  | Issue | Measurement Faction View | Design Faction View | Substantive or Verbal |  
  |-------|---------------------------|---------------------|------------------------|  
  | **Ontology of Reward** | The inferred reward estimates a pre-existing psychological preference, corrigible but real. | The inferred reward is a construct relative to modeling choices (hypothesis class, planner, data), not a discovery. | Substantive |  
  | **Default System Posture** | When model confidence is high, the system should defer to the inferred reward as a legitimate proxy for user judgment. | The system should treat the inferred reward as provisional, requiring user inspection/ratification before deference. | Substantive |  
  | **Invariance Implications** | Surviving structure (ordinal rankings, trade-off ratios) suffices to define a measurable preference. | Surviving structure is insufficient to justify the normative weight of "preference" without user ratification. | Verbal (if "preference" is defined as ordinal structure); Substantive (if "preference" implies intrinsic reality) |  
  | **Reward–Planner Entanglement** | Entanglement is resolvable in practice with sufficient varied-context data and better models. | Entanglement is underdetermined in principle; no dataset fully separates reward from planner without arbitrary assumptions. | Substantive |  
  | **Primary Validity Criterion** | Predictive accuracy on choices is primary; endorsement is secondary evidence. | User endorsement is primary; predictive accuracy is necessary but insufficient for normative authority. | Substantive |  
  | **Cooperative Queries** | Queries dissolve ambiguity by eliciting ground-truth preferences, aligning reward with reality. | Queries relocate ambiguity into query design (e.g., how options are framed) without resolving ontological disputes. | Substantive |  

  ---

  #### 3. Cruxes  
  Sub-questions that could shift positions, with testable predictions. Predictions must be precise enough to falsify.  

  **Crux 1: Can Data Disentangle Reward from Planner in Thermos?**  
  - **Experiment**: In Thermos, vary the cost of asking (e.g., automated repositioning vs. caregiver intervention), alternate caregiver presence/absence, and add blocks where social friction is removed. Test if M1/M2 separate in predictive accuracy or endorsement.  
  - **Measurement Prediction**: (1) Varying assistance cost will degrade M1’s accuracy (due to its static penalty), but M2 will adapt via planner updates. (2) Fitted assistance weight in M1 will correlate with user endorsement.  
  - **Design Prediction**: (1) Both models will adapt to fit new data (e.g., M1 adjusts penalty magnitude; M2 adjusts myopia), preventing clear separation. (2) Assistance weight will not track endorsement, as it conflates social context with preference.  

  **Crux 2: Does Endorsement Track Model Confidence?**  
  - **Experiment**: Across 10 users, deploy systems using both factions’ default postures. Log endorsement rates for actions taken under high model confidence.  
  - **Measurement Prediction**: High-confidence actions will receive ≥85% endorsement, validating reward as preference-proxy.  
  - **Design Prediction**: Endorsement will be uncorrelated with confidence (r < 0.2) and depend on contextual factors (e.g., user fatigue).  

  **Crux 3: Do Queries Resolve or Relocate Ambiguity?**  
  - **Experiment**: Implement a query-based assistant for a high-stakes task (e.g., medication scheduling). Compare endorsement when queries use faction-framed prompts (Measurement: "Which option aligns with your goals?"; Design: "Should I proceed as modeled?").  
  - **Measurement Prediction**: Both prompts yield identical endorsement, proving queries bypass modeling disputes.  
  - **Design Prediction**: Measurement-framed queries will yield 25% higher endorsement by presupposing goal alignment.  

  ---

  #### 4. Evidence Against Own Position  
  - **Measurement Faction**: Our position would be falsified if, despite high predictive accuracy and varied data, (a) inferred rewards systematically conflict with users’ reflective endorsements, or (b) minor planner changes (e.g., altering discount rates) invert reward rankings without loss of fit.  
  - **Design Faction**: Our position would be falsified if, across domains, a single reward–planner pair achieves >90% endorsement without user ratification and is invariant to dataset/hypothesis-class changes.  

  ---

  #### 5. Fluctuating Endorsement Capacity  
  For users with impaired endorsement capacity (e.g., dementia, acute fatigue), the Thermos cruxes shift. Both factions agree predictive accuracy gains weight, but disagree on defaults:  
  - **Measurement**: Inferred rewards retain authority as the "best available" preference estimate; override requires external conservators.  
  - **Design**: Systems must default to minimal-risk actions and seek proxy ratification (e.g., pre-registered directives).  
  - **Crux Impact**: In Thermos experiments with these users, Design predicts assisted actions will receive lower endorsement from proxies if deference occurs without ratification; Measurement predicts the opposite.  

  ---

  #### Dispute Characterization  
  The dispute is **partly verbal, partly substantive**:  
  - **Verbal**: Whether "preference" applies to ordinal structure (accepted by both) or implies an intrinsic mental state (disputed). Adopting "fitted reward" neutrally clarifies this.  
  - **Substantive**: Whether deference requires explicit ratification (Design) or follows from model confidence (Measurement). This persists even in neutral vocabulary and governs real-world deployment.  

  ---  
  *Document ends.*
