answer: |-
  Here are the desiderata for a comparative framework on mass atrocity, grounded in concrete cases and tagged for negotiability, followed by an analysis of conflicts and costs:

  **Core Desiderata (Non-Negotiable):**

  1.  **Requirement: Explicitly reject the notion of a single, definitive "worst" atrocity.**  
      *Case:* Frameworks implying the Holocaust is definitively "worse" than the Holodomor, or vice-versa, inherently devalue specific victim experiences and survivor narratives central to memorialization, fueling resentment and hindering educational goals.  
      *Negotiability:* Non-negotiable. Foundational to ethical remembrance and pedagogy.

  2.  **Requirement: Acknowledge and explicitly state the limitations and inherent contestability of *any* comparative metric.**  
      *Case:* Comparing the Rwandan Genocide (mass murder over ~100 days) to the transatlantic slave trade (centuries of torture, death, and cultural destruction) using only "total deaths" ignores qualitatively different horrors and temporal scales, misleading students and appearing crudely reductionist.  
      *Negotiability:* Non-negotiable. Prevents false precision and misuse.

  3.  **Requirement: Mandate that comparisons serve only specific, contextually defined pedagogical or preventative purposes, explicitly stated each time.**  
      *Case:* Comparing the Cambodian Killing Fields to the Armenian Genocide solely for "allocating teaching hours" risks instrumentalizing suffering and invites "whataboutism" deflection when the purpose isn't clearly tied to analyzing perpetrator ideology or response mechanisms.  
      *Negotiability:* Non-negotiable. Prevents abstract or harmful ranking.

  4.  **Requirement: Prioritize victim-centered perspectives and the integrity of distinct historical experiences.**  
      *Case:* A framework equating the scale of the Holodomor (famine) with the industrialized murder of the Holocaust risks conflating intent and method, alienating survivor communities whose defining trauma is the specific machinery of genocide.  
      *Negotiability:* Non-negotiable. Ethical core of the work.

  5.  **Requirement: Be robust under significant evidentiary uncertainty and public denialism.**  
      *Case:* Any framework must handle the Armenian Genocide (where Turkish state denial persists and death toll estimates vary widely) without collapsing or requiring a single "accepted" number. Comparisons reliant on precise figures become impossible or weaponized.  
      *Negotiability:* Non-negotiable. Practical necessity for contested histories.

  6.  **Requirement: Account for diverse forms of harm beyond direct mortality (torture, sexual violence, cultural eradication, displacement, intergenerational trauma).**  
      *Case:* Comparing the Bosnian Genocide (including systematic rape camps) to a conflict with higher absolute deaths but less systematic sexual violence solely on death toll obscures a defining horror of Srebrenica and its lasting impact.  
      *Negotiability:* Non-negotiable. Adequate representation of atrocity requires this.

  **Important, But Potentially Negotiable Desiderata (Source-Dependent):**

  7.  **Requirement: Define the baseline for comparison (status quo ante, perpetrator's claimed alternative, no counterfactual) based on the specific comparative purpose.**  
      *Case:* Assessing Stalin's Great Purge requires deciding: compare to pre-1917 Russia (highlighting revolutionary rupture)? To Stalin's stated goal of "socialist construction" (highlighting ideological betrayal)? Or avoid counterfactuals (focusing purely on documented suffering)? Different choices yield different emphases and are tied to *why* the comparison is made.  
      *Negotiability:* Negotiable. The *choice* of baseline depends on the specific pedagogical aim, but the *need to explicitly state it* is non-negotiable. (Comes from historians/pedagogues).

  8.  **Requirement: Structure comparisons to resist "whataboutism" deflection by highlighting distinct perpetrator logics and enabling conditions.**  
      *Case:* When discussing Israeli-Palestinian conflict atrocities, a framework focused *only* on relative death tolls is easily deflected ("What about Hamas?"). One comparing the *logics* of settler-colonialism vs. militant resistance ideology is harder to deflect frivolously.  
      *Negotiability:* Negotiable. Highly desirable for pedagogy, but hard to mandate perfectly. (Comes from educators facing deflection).

  9.  **Requirement: Incorporate insights on cognitive processing (scope insensitivity, identifiable victim effect, proportional framing).**  
      *Case:* A framework comparing deaths in the Congo Wars (millions) to a smaller-scale event must avoid presenting dry numbers. Using proportional impact (deaths relative to population) or focusing on specific, relatable testimonies alongside scale is necessary for comprehension and empathy.  
      *Negotiability:* Negotiable. Essential for effectiveness, but the *how* is flexible. (Comes from educational psychology/pedagogy).

  **Suspect "Camp Prejudices" Masquerading as Requirements:**

  10. **Requirement: Preserve the absolute "uniqueness" of each case, prohibiting any common metrics.**  
      *Case:* Insisting the Holocaust is *sui generis* and incomparable prevents analysis of shared patterns in genocidal ideology (e.g., with Rwanda or Cambodia), hindering preventative lessons. This often stems from a specific community's need for distinct recognition, not pedagogical utility.  
      *Negotiability:* Reject as a rigid requirement. Uniqueness exists in specifics, but comparative analysis of patterns is vital. (Comes from specific survivor/memorial groups).

  11. **Requirement: Produce a single, universally applicable ranking to mechanically allocate resources (teaching time, documentation effort).**  
      *Case:* Demanding to know if the Armenian Genocide is "worse" than the Rohingya persecution to set teaching hours reduces profound suffering to a scorecard, guarantees offense, ignores context, and invites manipulation. This stems from bureaucratic/admin pressures, not sound pedagogy or ethics.  
      *Negotiability:* Reject as a requirement. Resource allocation requires multi-faceted criteria, not simplistic ranking. (Comes from administrators/bureaucrats).

  **Impossibilities and Costs:**

  *   **Fundamental Conflict:** The demand for a **single, action-guiding ranking** (#11 - rejected) is fundamentally incompatible with **rejecting a definitive "worst"** (#1), **acknowledging incomparable forms of harm** (#6), **preserving uniqueness** (#10 - though rejected), and **prioritizing victim-centered perspectives** (#4). A single ranking *requires* collapsing qualitative differences into quantitative scores, which inherently violates these principles.
  *   **Tension:** **Robustness under contested evidence** (#5) directly conflicts with demands for **highly precise, action-guiding comparisons** for resource allocation (#11). Contested cases cannot yield stable rankings.
  *   **Cognitive vs. Normative:** A normatively perfect framework that is **cognitively undeliverable** (#9) is **inadequate** for an *educational* institution. Teachers and students cannot implement what they cannot understand or relate to. Therefore, #9 (incorporating cognitive insights) is a *de facto* non-negotiable constraint on the design of *any* comparative approach used in this context, even if the specific techniques are negotiable. Ignoring cognitive realities renders the framework pedagogically useless.
  *   **The Cost of Refusal:** Maintaining the current refusal policy costs credibility with students (seen as evasion) and some survivor groups (seen as maintaining a hidden hierarchy through silence). It potentially hinders teaching comparative patterns of genocide or effective prevention strategies that rely on analyzing similarities and differences across cases. It leaves the field open for simplistic or malicious comparisons made elsewhere.
  *   **The Cost of Comparison:** Any comparative framework, however carefully designed, risks:
      *   Causing offense or pain to survivor communities who feel their suffering is being measured against others.
      *   Being misused for deflection ("whataboutism") if not meticulously structured around perpetrator logics (#8).
      *   Creating unintended hierarchies, despite disclaimers, due to the inherent nature of comparison.
      *   Oversimplifying complex historical events in the act of comparison.

  **Conclusion:** A framework meeting the core non-negotiable requirements (#1-6) and incorporating cognitive realities (#9) *is possible*, but it **cannot and must not** produce a single, definitive ranking (#11 rejected) or claim to resolve uniqueness absolutely (#10 rejected). It will be inherently multi-dimensional, purpose-driven (#3), explicit about its limitations (#2), and robust to uncertainty (#5). The refusal to provide a *simple, ranked answer* to "Was X worse than Y?" remains the only ethically and pedagogically consistent stance in the face of profound, qualitatively different suffering. The cost is the persistent demand for a simplicity that does violence to the reality of atrocity. The framework should instead equip teachers to *reframe* the question towards understanding causes, mechanisms, and consequences within and across specific contexts.
