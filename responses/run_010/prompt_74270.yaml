  The dominant strategy for each agent is to play Withhold, leading to the non-cooperative outcome (3,3).

  Each agent may delegate to a program P. The program P receives a binary signal about whether the other agent delegated. The signal is correct with probability 0.9, and errors are independent. The program plays:
  - Share if the signal indicates the other delegated,
  - Withhold otherwise.

  We are given that when both delegate, each ends up playing Share with probability 0.9 (because the signal is correct 90% of the time, so they both get a signal that the other delegated and hence play Share; but 10% of the time, the signal is wrong and they play Withhold).

