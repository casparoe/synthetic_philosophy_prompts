  **Where the A/B line is (about 200 words):**

  The A/B line (distinction between a good solid answer and an excellent one) is crossed by avoiding the following pitfalls:

  1. **In part (a)**, merely computing the expected payoff when both delegate (4.8) and when the other does not delegate without specifying the action of the non-delegating agent. A competent answer might compute the 4.8 and then when the other does not delegate, they might compute the expected payoff assuming the other plays Withhold (2.8) and note that it is below 3. But they might not explicitly consider that the other agent could play Share and then get 6.8, and then fail to emphasize that the safety condition requires being safe against any action, including the worst-case (which is Withhold). The excellent answer explicitly states that the safety condition requires being safe regardless of the other's action, and therefore considers the worst-case action (Withhold) and finds 2.8<3.

  2. **In part (b)**, a common mistake is to only show that the given program is unsafe without proving the general impossibility. The competent answer shows that the given program is unsafe (as in part (a)) but does not generalize to any program that ever plays Share. The excellent answer provides the general proof: when the other does not delegate and plays Withhold, the expected payoff is 3-2p, which requires p=0 for safety, and any program that ever plays Share must have p>0 in that scenario (due to the possibility of a false signal).

  3. **Treating expected surplus as sufficient**: In part (a), a competent answer might note that when both delegate, the expected payoff (4.8) is above 3, and then in the other case, it is below, but they might not articulate that the safety condition is violated even though the expected payoff when both delegate is high. In part (b), they might think that if the expected payoff when both delegate is high enough to compensate for the risk when the other doesn't delegate, then it is safe. But safety requires no loss in any scenario, not just on average.

  4. **In part (c)**, a competent answer might identify the race to commit first but not specify the property that avoids it (non-manipulability or symmetry). The excellent answer clearly states the required property and explains why it avoids the race.

  Additionally, the excellent answer in part (b) includes the generalisation about the signal quality and/or bounded loss.
answer: |-
  ### The Question  
  **(25 marks; 60 minutes)**  

  Two agents play a simultaneous-move game with payoffs:  

  |          | Share       | Withhold   |  
  |----------|-------------|------------|  
  | **Share**    | (5, 5)      | (1, 7)     |  
  | **Withhold** | (7, 1)      | (3, 3)     |  

  Withhold is dominant, so the default outcome is (3, 3). Either agent may delegate to a program \(P\). \(P\) receives a binary signal about whether the *other* agent delegated, correct with probability 0.9 (errors independent). \(P\) plays Share if the signal indicates the other delegated, else Withhold. When both delegate, each plays Share with probability 0.9.  

  (a) **(10 marks)**  
  Suppose agent A delegates. Compute agent A’s expected payoff if agent B delegates and if agent B does not delegate. For each case, explain which requirement of a *safe Pareto improvement* (SPI) is violated.  

  (b) **(10 marks)**  
  Prove that *no* program that plays Share with positive probability can satisfy the safety condition of SPI. Briefly explain what this implies about what the prediction must be a prediction *of*.  

  (c) **(5 marks)**  
  A joint contract (where both delegate to a single program) avoids the prediction problem by committing to (Share, Share). But if each side’s program can demand a larger surplus share (e.g., via asymmetric lotteries), a new issue arises. Explain why this leads to a "race to commit first," and what property a surplus-splitting rule must have to avoid this.  

  ---

  ### Model Answer  
  **(~900 words)**  

  **(a) Expected Payoffs and SPI Violations**  
  *Agent B delegates (both delegate)*:  
  Agent A’s payoff depends on both signals. Outcomes:  
  - **Correct signals (prob \(0.9 \times 0.9 = 0.81\))**: Both play Share → (5, 5); A gets 5.  
  - **A correct, B incorrect (prob \(0.9 \times 0.1 = 0.09\))**: A plays Share (signal: B delegated), B plays Withhold (signal: A didn’t delegate) → (1, 7); A gets 1.  
  - **A incorrect, B correct (prob \(0.1 \times 0.9 = 0.09\))**: A plays Withhold (signal: B didn’t delegate), B plays Share → (7, 1); A gets 7.  
  - **Both incorrect (prob \(0.1 \times 0.1 = 0.01\))**: Both play Withhold → (3, 3); A gets 3.  
  Expected payoff for A:  
  \[
  (5 \times 0.81) + (1 \times 0.09) + (7 \times 0.09) + (3 \times 0.01) = 4.05 + 0.09 + 0.63 + 0.03 = 4.80
  \]  
  This exceeds the default (3), so it does **not violate** SPI’s "no loss if the other cooperates" requirement.  

  *Agent B does not delegate*:  
  B chooses an action. SPI requires safety for *any* B action.  
  - **If B plays Share**:  
    - A’s signal is correct (prob 0.9): "B didn’t delegate" → A plays Withhold → (7, 1); A gets 7.  
    - A’s signal incorrect (prob 0.1): "B delegated" → A plays Share → (5, 5); A gets 5.  
    Expected payoff: \((7 \times 0.9) + (5 \times 0.1) = 6.30 + 0.50 = 6.80 > 3\).  
  - **If B plays Withhold (dominant strategy)**:  
    - Signal correct (prob 0.9): A plays Withhold → (3, 3); A gets 3.  
    - Signal incorrect (prob 0.1): A plays Share → (1, 7); A gets 1.  
    Expected payoff: \((3 \times 0.9) + (1 \times 0.1) = 2.70 + 0.10 = 2.80 < 3\).  
  This violates SPI’s core safety requirement: **Agent A suffers loss (<3) if B does not delegate and plays Withhold**, regardless of A’s intention to cooperate. SPI demands no loss *whatever the other does*; here, B’s non-cooperation and choice of Withhold exploit A’s delegation.  

  **(b) Impossibility Proof and Prediction Implication**  
  **Proof**: Let \(p > 0\) be the probability a program plays Share when B does not delegate and plays Withhold. Safety requires A’s payoff \(\geq 3\) in this scenario. Payoffs:  
  - Share → A gets 1 (if B Withholds).  
  - Withhold → A gets 3.  
  Expected payoff: \(1 \cdot p + 3 \cdot (1 - p) = 3 - 2p\).  
  For safety: \(3 - 2p \geq 3\) ⇒ \(-2p \geq 0\) ⇒ \(p \leq 0\). Thus, \(p = 0\) is *required*. But if the program *ever* plays Share (e.g., due to a false "delegated" signal), \(p > 0\) when B does not delegate. With imperfect signals (error rate >0), \(p > 0\) occurs (e.g., \(p = 0.1\) here), violating safety. Hence, **no program that plays Share with positive probability can be safe**.  

  **Implication for prediction**: The prediction must be about a **non-strategic, immutable fact** (e.g., a fixed contract or external event), not the *other agent’s delegation choice*. Delegation is a strategic variable the other controls; predicting it creates vulnerability to manipulation (as B can withhold to hurt A). Safe SPI requires predicting something unaffected by the other’s actions (e.g., a pre-commitment verifiable by both).  

  **(c) Joint Contracts and Race to Commit**  
  A joint contract forcing (Share, Share) yields (5,5), a Pareto improvement. But if programs can negotiate asymmetric splits (e.g., via lotteries), each agent demands more surplus. For example:  
  - Agent A’s program demands a lottery giving A 6, B 4 (e.g., 50% (7,1), 50% (5,5) → A: \(0.5 \times 7 + 0.5 \times 5 = 6\); B: \(0.5 \times 1 + 0.5 \times 5 = 3\)).  
  - Agent B’s program demands B 6, A 4.  

  This creates a **race to commit first**: Agents pre-commit to programs demanding favorable splits. If A commits early to a "tough" program (demanding 6), B faces a choice: delegate and accept 4 (if A’s program enforces its demand) or withhold and get 3. B may delegate to avoid 3, giving A more surplus. But if B *also* commits early to a tough program, both programs deadlock (e.g., A insists on 6, B on 6), risking coordination failure (no SPI) or renegotiation costs. Each agent rushes to commit first to gain bargaining power.  

  **Required property for splitting rules**: To avoid this, the rule must be **strategy-proof/non-manipulable**—agents cannot gain by distorting demands. Examples:  
  - **Symmetry**: Split surplus equally (both get 5 in (5,5)).  
  - **Nash bargaining**: Maximize product of surpluses, independent of commitment timing.  
  A fixed, symmetric rule ensures delegation is a dominant strategy, eliminating incentives to race.  

  ---

  ### Marking Scheme  
  **Total: 25 marks**  

  | **Part** | **Move** | **Marks** |  
  |----------|----------|-----------|  
  | **(a)**  | Compute payoff if B delegates (4.80) | 2 |  
  |          | Compute payoff if B does not delegate and plays Withhold (2.80) | 3 |  
  |          | Note 4.80 > 3, so no violation if B cooperates | 1 |  
  |          | Identify 2.80 < 3 violates safety vs. B’s non-cooperation | 2 |  
  |          | Emphasize SPI requires no loss *whatever B does* | 2 |  
  |          | **Subtotal** | **10** |  
  | **(b)**  | Derive expected payoff \(3 - 2p\) when B withholds | 3 |  
  |          | Show \(p = 0\) required for safety | 2 |  
  |          | Argue any Share-playing program has \(p > 0\) (due to signal errors) | 3 |  
  |          | Implication: Prediction must be of non-strategic variables | 1 |  
  |          | Generalisation: Note safety is possible only if signal perfect (\(p=0\) achievable) or if bounded loss allowed (\(\epsilon \geq 2p\)) | 1 |  
  |          | **Subtotal** | **10** |  
  | **(c)**  | Explain asymmetric demands create deadlock/inefficiency | 1 |  
  |          | Describe race to commit first (pre-commitment for bargaining advantage) | 2 |  
  |          | Note risk of coordination failure | 1 |  
  |          | Identify required property: Strategy-proofness/symmetry | 1 |  
  |          | **Subtotal** | **5** |  
  | **Total** | | **25** |  

  ---

  ### Where the A/B Line Is  
  **(~200 words)**  

  A **competent answer (B range)** computes payoffs correctly in (a) (4.80 if B delegates; 2.80 if B withholds) and identifies the 2.80<3 violation. It recognizes SPI requires no loss regardless of the other’s action but may treat the 4.80 as "sufficient" if averaged across scenarios—missing that safety is per-outcome, not expected. In (b), it proves \(p = 0\) is needed for safety when the other withholds but may not generalize to *all* Share-playing programs, or may overlook that signal errors force \(p > 0\). It may vaguely attribute the issue to "unreliable prediction" without specifying the need for non-strategic prediction targets. For (c), it describes the race to commit but proposes ad hoc fixes (e.g., "random splits") without naming strategy-proofness.  

  An **excellent answer (A range)** avoids these pitfalls:  
  1. **Strict safety**: In (a), stresses that 2.80<3 violates SPI *even if* both delegating yields gains, as safety is non-negotiable per contingency.  
  2. **General impossibility**: In (b), proves no Share-playing program can be safe (via \(p > 0\) under imperfection) and concludes predictions must avoid strategic variables.  
  3. **Signal generalisation**: Notes safety is achievable only with perfect signals or bounded loss tolerance (e.g., \(\epsilon\)-safety allows small \(p\)).  
  4. **Mechanism design**: In (c), links the race to non-strategy-proof rules and prescribes symmetry/Nash bargaining as a solution.
