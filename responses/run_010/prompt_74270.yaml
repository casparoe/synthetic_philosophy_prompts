  **The Question (as it would appear on the exam paper):**

  **Question (25 marks)**

  Two agents play a simultaneous-move game with the following payoff matrix (row player, column player):

  |          | Share       | Withhold   |
  |----------|-------------|------------|
  | **Share**    | (5, 5)      | (1, 7)     |
  | **Withhold** | (7, 1)      | (3, 3)     |

  Each agent has the option to play directly or to delegate to a program. The program for an agent receives a binary signal about whether the other agent delegated, which is correct with probability 0.9 (errors independent). The program plays Share if the signal indicates the other delegated, and Withhold otherwise. When both delegate, each plays Share with probability 0.9 and Withhold with probability 0.1.

  (a) (10 marks) Suppose agent A delegates. Compute the expected payoff for agent A in the case that agent B delegates and in the case that agent B does not delegate. For each case, explain which requirement of a safe Pareto improvement (SPI) is violated.

  (b) (10 marks) Prove that no program that ever plays Share (with positive probability) can satisfy the safety condition. Then, briefly explain what this implies about what the prediction must be a prediction of.

  (c) (5 marks) One way to try to fix the problem is to have both agents delegate to a joint program that commits to a split of the surplus. However, if each side's program can hold out for a bigger slice of the surplus, we might run into a problem. Explain why this leads to a race to commit first, and what property a splitting rule must have to avoid this problem.

