  We are constructing a set of desiderata (D1, D2, ...) for a higher-order theory (HOT) of consciousness. For each, we provide a motivating case or consideration that would break a theory failing it. We then sort the desiderata into non-negotiable (for any HOT) and flavor-specific. We identify pairs that are jointly unsatisfiable. We consider the impact of the nonstandard constraint (no architectural split, self-representations shaped by external labels). We incorporate empirical demands. Finally, we provide a short scorecard and a verdict.

  Desiderata:

  D1: Consciousness Requires a Higher-Order State
  Motivation: Without a higher-order state, we fall back to first-order theories. A theory that allows a state to be conscious without any higher-order representation fails to be a HOT. Break case: A system with only first-order states (e.g., a simple reflex) is claimed to be conscious.

  D2: The Higher-Order State Must Be Non-Inferential and Non-Observational
  Motivation: If the higher-order state is inferred from behavior or external observation, it becomes a theory about oneself rather than a direct awareness. Break case: A person infers they are angry by noticing their own clenched fists and then forms a higher-order thought. That thought, being inferential, should not make the anger conscious in the way that direct, non-inferential awareness would.

  D3: The Higher-Order State Must Be Unconscious
  Motivation: To avoid an infinite regress (if the higher-order state were conscious, it would require an even higher-order state, and so on). Break case: If the higher-order state is conscious, then we must posit a third-order state to account for that, leading to a regress.

  D4: The Higher-Order State Must Be Accurate (or Have Conditions for Accuracy)
  Motivation: Without accuracy conditions, we cannot explain misrepresentation (e.g., conscious states that do not reflect the world) and we risk making any arbitrary higher-order state confer consciousness. Break case: A system has a higher-order state representing a first-order state that does not exist (e.g., a higher-order representation of pain when there is no pain). What is the conscious experience? The theory must say whether it's an experience of pain (misrepresentation) or something else.

  D5: No Regress: The Higher-Order Mechanism Must Terminate
  Motivation: The regress must stop at some unconscious state. Break case: If every state that represents must itself be represented, we get an infinite chain. The theory must specify how the chain stops (e.g., by having the higher-order state be unconscious and not requiring representation).

  D6: The Higher-Order State Must Explain Phenomenal Character
  Motivation: The theory must account for why conscious states feel a certain way. Break case: Two first-order states (e.g., red and green perceptions) might be indistinguishable at the higher-order level, leading to the same phenomenal character, but they should feel different.

  D7: Compatibility with Dissociation Cases (e.g., No-Report Paradigms)
  Motivation: There are cases where subjects are conscious but cannot report (e.g., inattentional blindness, no-report paradigms) and cases where they report without rich consciousness (e.g., blindsight). Break case: In no-report paradigms, neural correlates of consciousness are found without report. If the theory requires report for consciousness (as some HOTs might), it fails. Conversely, in blindsight, a subject reports seeing nothing but can guess accurately. The theory must account for the dissociation.

  D8: Accommodate Animals and Infants
  Motivation: Animals and infants likely have conscious experiences but may lack the cognitive machinery for complex higher-order thoughts. Break case: A theory that requires linguistic capabilities for higher-order thought would deny consciousness to non-human animals and pre-linguistic infants.

  D9: The Higher-Order State Must Be Intrinsically About the First-Order State (Not Merely Causal)
  Motivation: The relation must be representational, not just causal, to avoid misattribution. Break case: A higher-order state that is caused by a first-order state but represents something else (due to miswiring) should not make the first-order state conscious.

  D10: The Higher-Order State Must Be Able to Be Inaccurate (Misrepresentation)
  Motivation: We can have conscious experiences that misrepresent (e.g., illusions, hallucinations). Break case: A hallucination: a higher-order state representing a first-order state that doesn't exist. The theory must allow that the subject has a conscious experience (e.g., of pain) even without the first-order state.

  D11: The Higher-Order State Must Not Require a Separate Module (Architectural Neutrality)
  Motivation: To accommodate systems without a clean architectural split (e.g., neural networks). Break case: A system where the same kind of units and connections are used for both first-order and higher-order states. The theory must still be able to distinguish the two.

  D12: Resilience to Training Artifacts (External Label Influence)
  Motivation: The system's self-representations might be shaped by external labels, leading to inaccuracies. Break case: A higher-order representation is accurate about a state (due to training labels) but not actually caused by it, or vice versa. The theory must explain what is conscious in such a case.

  D13: The Higher-Order State Must Not Be Task-Dependent in a Way That Confounds with Task Demands
  Motivation: Empirical data show that higher-order-like activations can be due to task demands (e.g., attention, working memory) rather than consciousness per se. Break case: A task that requires attention to a stimulus may activate prefrontal areas, but the same stimulus without attention (but still conscious) might not. The theory must not confuse task-related activity with consciousness.

  D14: The Higher-Order State Must Be Distinct from Access
  Motivation: Access (e.g., for report) and consciousness are dissociable. Break case: In no-report paradigms, consciousness can occur without access for report. If the theory equates higher-order states with access, it fails.

  Sorting:

  Non-negotiable for any HOT:
  - D1: Without a higher-order state, it's not a HOT.
  - D2: Non-inferential is core to HOT; otherwise, it becomes a self-interpretation theory.
  - D3: Unconscious higher-order state is required to stop regress (though some variants might dispute).
  - D5: No regress is necessary for the theory to be coherent.
  - D10: Misrepresentation is a key argument for HOT over first-order theories.

  Flavor-specific:
  - D4: Accuracy conditions: Some HOTs (like Rosenthal's) require accuracy for the state to be conscious, while others (like Gennaro's self-representationalism) might have different conditions.
  - D6: Explaining phenomenal character: Some HOTs (e.g., those that tie the HO state to qualia) might emphasize this more.
  - D7: Dissociation cases: How a theory handles this may depend on whether it ties consciousness to report (e.g., some HOTs might require reportability, others not).
  - D8: Animals and infants: Dispositionalist HOTs (like Carruthers) might say that the disposition for a HO state is sufficient, so they can be conscious without actual HO states.
  - D9: Intrinsic aboutness: This might be a requirement for some representational theories but not others.
  - D11: Architectural neutrality: Some neural theories (e.g., those tied to prefrontal cortex) might require a module, but a general theory should not.
  - D12: Resilience to training artifacts: This is a new constraint for artificial systems.
  - D13: Task-dependence: This is an empirical constraint that might be handled differently.
  - D14: Distinct from access: Some HOTs (like global workspace) might blur this, but pure HOTs separate.

  Jointly Unsatisfiable Pairs:

  - D3 (HO state unconscious) and D5 (no regress) are NOT in tension. They are complementary: because the HO state is unconscious, it doesn't require a further state, stopping regress.

  - But consider D3 and D6 (explain phenomenal character): If the HO state is unconscious, how does it confer phenomenal character on the first-order state? This is the "hard problem" within HOT. Some theories might struggle to explain how an unconscious state can make another state conscious.

  - D10 (misrepresentation) and D4 (accuracy): If we require accuracy (D4), then misrepresentation (D10) is not allowed. But D10 is a motivation for HOT (to account for hallucinations). Therefore, D4 (as requiring accuracy) and D10 are in conflict. Resolution: HOT should allow for misrepresentation, so D4 must be restated as having conditions for accuracy (so that we can have cases of inaccuracy). Thus, D4 should be: "The Higher-Order State Must Have Conditions for Accuracy (so that misrepresentation is possible)".

  - D2 (non-inferential) and D8 (animals and infants): If non-inferential requires sophisticated cognitive capacities, then animals and infants might not meet D2. But HOT must account for their consciousness. So, dispositionalist versions might relax D2 by having a disposition for a non-inferential state.

  - D5 (no regress) and D11 (architectural neutrality): In a system without levels, how do we stop regress? If every state is potentially both first-order and higher-order, we might get a circularity that doesn't terminate. This might be a problem.

  - D12 (training artifacts) and D10 (misrepresentation): In a system with training artifacts, misrepresentation might be common. But the theory must still account for what is conscious.

  Impact of Nonstandard Constraint (no architectural split, labels influence):

  - D11 (architectural neutrality) becomes critical. Without a split, we cannot rely on physical separation to distinguish levels.

  - D12 (training artifacts) becomes a major challenge. The theory must handle cases where the HO representation is present but not caused by the state it represents (or absent when it should be present) due to training.

  - D9 (intrinsic aboutness) is challenged: if the representation is shaped by labels, the aboutness might be derived from external training, not intrinsic.

  - D4 (accuracy conditions) must account for cases where accuracy is coincidental (due to labels) and not based on actual state.

  - D3 (HO state unconscious) and D5 (no regress) might be harder: without a separate level, what makes a state "higher-order" and unconscious? We might need a functional distinction.

  Empirical Demands:

  - No-report paradigms (D7): They show that consciousness can occur without report, so the theory must not require report (or access for report) for consciousness.

  - Frontal vs posterior correlates: Some data (e.g., prefrontal lesions) suggest that HOT might not require prefrontal cortex. The theory must be compatible with neural data but not tied to a specific region.

  - Task-demand confounds (D13): The theory must distinguish consciousness from task-related processing.

  Revised Desiderata List (with adjustments):

  After discussion, we adjust D4 to: "The Higher-Order State Must Have Conditions for Accuracy (to allow for misrepresentation)".

  We also note that D3 and D5 are not in tension but together stop the regress.

  Short Scorecard (live versions):

  1. Rosenthal's Higher-Order Thought (HOT) Theory:
     - D1: Yes.
     - D2: Yes (non-inferential).
     - D3: Yes (unconscious).
     - D4: Accuracy required? Rosenthal allows misrepresentation, so conditions for accuracy are present (D4 as revised) and D10 is satisfied.
     - D5: Yes (unconscious so no regress).
     - D6: Struggles (phenomenal character not directly explained).
     - D7: May require reportability? Rosenthal sometimes ties consciousness to the ability to report, which conflicts with no-report.
     - D8: Animals: Dispositional? Rosenthal initially required actual HOTs, so may deny consciousness to animals without HOT capacity. Problem for D8.
     - D9: Yes (representational).
     - D10: Yes (hallucinations).
     - D11: Not neutral (requires HOTs, which might be in a separate system).
     - D12: Vulnerable (if training artifacts cause inaccurate HOTs, what is conscious?).
     - D13: May be confounded (if HOTs are tied to report, then task demands might be required).
     - D14: May not distinguish (if HOT is for report, then access is required).

  2. Gennaro's Self-Representationalism (a variant where the state is self-representing):
     - D1: Yes (higher-order within the state).
     - D2: Non-inferential? Built-in, so yes.
     - D3: The state is conscious, so the higher-order part is conscious? This might cause regress (violate D3 and D5). Gennaro avoids regress by having one state with two parts. But then the higher-order part is conscious? This is a tension.
     - D4: Conditions for accuracy? Yes, but misrepresentation is harder to explain because the state is self-representing.
     - D5: Avoids regress by collapsing levels? But then D3 is violated because the higher-order part is conscious.
     - D6: Better (phenomenal character is built-in).
     - D7: Can accommodate no-report? Possibly, if the self-representation doesn't require report.
     - D8: Animals: Might be harder because it requires a complex self-representational state.
     - D9: Intrinsic? Yes.
     - D10: Misrepresentation? Problem: if the state is self-representing, how can it misrepresent? It might be accurate by definition.
     - D11: Architectural split? Not required, so better.
     - D12: Training artifacts? If the self-representation is shaped by labels, it might be inaccurate, but the theory may not allow that.
     - D13: Less tied to task demands? Possibly.
     - D14: Can separate from access? Yes.

  3. Carruthers' Dispositionalist HOT:
     - D1: Yes (disposition to form a HOT).
     - D2: Non-inferential? The disposition is for a non-inferential state, so yes.
     - D3: The actual HOT, if formed, is unconscious? Yes, but the disposition is not a state. So no regress.
     - D4: Conditions for accuracy? The disposition might be for an accurate HOT, but misrepresentation can occur if the disposition is triggered in error.
     - D5: No regress (disposition doesn't require representation).
     - D6: Same as Rosenthal.
     - D7: Better for no-report (consciousness without actual HOT, just the disposition).
