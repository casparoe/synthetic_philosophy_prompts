prompt: |-
  I cover neuroscience and the philosophy of mind for a monthly British ideas magazine, and since the spring I have also been commissioning on the desk, which means four to six pieces a month now pass across my screen in which the evidence consists substantially of what someone says about their own experience: anaesthesia awareness, patients who meet every behavioural criterion for unresponsiveness yet appear to follow commands in a scanner, attempts to decode the content of a subject's dream from imaging data, psychedelic phenomenology, and lately claims about cerebral organoids and about large language models. Two complaints have landed in the last twelve months, and they pull in opposite directions. A philosopher wrote that we had laundered introspective report into evidence about consciousness itself, treating what a subject says as though it settled what a subject has. A clinicians' group wrote that we had done the reverse, producing a piece so heavy with caution about a study of unresponsive patients that ordinary readers took away the impression there was nobody home. I have come to think both complaints are symptoms of a missing distinction rather than of bias, and I want a house protocol that supplies it.

  The framework I want it built on is heterophenomenology, and my working understanding of it — which you should correct wherever I have got it wrong — is roughly this: take the subject's report seriously as data; interpret it the way one would interpret any text produced by an agent worth taking at their word provisionally; but refuse at the outset to grant that what the report describes exists, treating the world the subject describes as a theorist's posit rather than a given; and hold neutrality between the possibilities that the subject is accurate, that they are sincere but confabulating, and that they are not sincere at all. What I need is a procedure a reporter with no philosophical training can run on such a study in under an hour, before a commissioning meeting rather than after the piece is written: the questions to ask in order, what counts as a sufficient answer to each, the point at which the procedure stops and writes down that something is a fact about what was said rather than a fact about what was experienced, and the points at which it hands the decision to me because the question has turned out to be one of editorial values rather than of method. Please be explicit about which of the distinctions have to survive translation into newsroom language and which can safely be dropped; my own suspicion is that the technical apparatus of the intentional stance can go, while the difference between a report's being sincere and its being accurate absolutely cannot, but tell me if that is the wrong cut. I also want the limits stated rather than smoothed over: what the procedure does with a subject who can produce no text at all, whether its neutrality is genuinely neutral or is a way of assuming from the start that the report and not the experience is the thing to be explained, and how we would defend a verdict reached this way to a researcher trained in one of the disciplined first-person methods that see heterophenomenology as throwing away the datum.

  Please run the finished procedure on three cases. The first is a paper reporting that a minority of patients who are behaviourally unresponsive show command-following brain activation when asked to imagine playing tennis or walking through their own house, with no verbal report at any stage: here I want to know whether the method, which was built for texts, should be stretched, adapted into something adjacent, or declared simply inapplicable, and what a reporter is then entitled to write. The second is a study in which a classifier trained on waking viewing is applied to the seconds before subjects are woken from early sleep, reporting that broad object categories can be guessed above chance, with the verbal reports collected retrospectively after waking. The third is a piece I have already commissioned, and it is the one where I expect the protocol to tell me something I would rather not hear: it profiles a laboratory reporting stress-like activity in organoids, and the group leader has said in interview that he cannot rule out that something is felt. I would prefer to learn that from my own procedure than from a letter to the editor. The deliverable should be a numbered procedure with a plain-language rationale for each step, a shortened version suitable for our newsroom wiki, a flag on every step that is a judgement call wearing the clothes of a rule, and a closing section stating what the procedure cannot settle no matter how carefully it is followed. British English throughout, please.
reasoning: |-
  Hmm, the user is a commissioning editor for a British ideas magazine covering neuroscience and philosophy of mind. They're dealing with a methodological dilemma around reporting on studies involving subjective experience. They've received two contradictory complaints: one accusing them of treating introspective reports as direct evidence of consciousness, another saying they're being overly cautious about studies on unresponsive patients. 

  They want to implement a house protocol based on heterophenomenology - a framework that treats subjective reports as behavioral data without assuming their ontological truth. The core challenge is translating this philosophical approach into a practical checklist for journalists without philosophy training. 

  Key requirements: 
  - Must be executable in under an hour pre-commissioning
  - Needs clear stopping rules for when something is "reported" vs "experienced"
  - Must flag editorial judgment calls
  - Requires application to three test cases (unresponsive patients, dream decoding, organoid research)
  - Needs plain-language rationale and wiki-friendly version

  The user's own insight seems correct: the sincerity/accuracy distinction is crucial, while intentional stance jargon can be dropped. But they're wisely asking for validation. 

  For the test cases: 
  1) The unresponsive patients study is tricky because there's no verbal report - just neural correlates. The protocol would need adaptation here, treating the neural data as "behavior" equivalent to speech. 

  2) The dream decoding study is more straightforward - retrospective verbal reports can be analyzed as texts, but with heavy caveats about memory distortion. 

  3) The organoids piece is ethically charged. The protocol would likely force uncomfortable framing about whether we're discussing scientific interpretations vs actual experience. 

  The underlying tension is between scientific objectivity and the phenomenological reality readers care about. The protocol must navigate this without collapsing into either scientism or anthropomorphism. 

  Most challenging aspect will be maintaining neutrality while producing engaging journalism. The "judgment call" flags are essential - this isn't mechanical. Also need clear limits: can't solve hard problems of consciousness, can't replace ethical deliberation about organoids. 

  British English requirements mean avoiding Americanisms ("neuroethics" not "neuroethicists"), and maintaining that distinctive blend of precision and understatement.
answer: |-
  Here is a house protocol for commissioning pieces involving subjective reports, based on heterophenomenology, designed for practical use by non-philosophers. It includes a full procedure, a wiki summary, application to your three cases, and a statement of limits.

  **Heterophenomenology Protocol for Commissioning Editors (v1.0)**

  **Core Principle:** Treat what people *say* about their experience as crucial *data*, but never assume it directly reveals the *actual nature* of that experience. Distinguish rigorously between **Reported Phenomena** (what the subject describes) and **Experiential Phenomena** (what they actually underwent, if anything). Our default position is **neutrality**: we don't assume reports are accurate, inaccurate, sincere, or insincere without specific evidence.

  **The Full Procedure (For Pre-Commissioning Review - < 1 hour)**

  1.  **Identify the Reported Phenomenon:**
      *   *Question:* "What exactly does the subject *say* happened or what did they *report experiencing*? Quote the key description(s)."
      *   *Sufficient Answer:* A clear, specific statement of the subject's claim (e.g., "I saw a red triangle," "I felt intense fear," "I was imagining playing tennis," "I dreamt about a horse"). Avoid paraphrasing into experiential terms (e.g., DON'T say "The subject experienced a red triangle" here).
      *   *Rationale:* Establishes the raw data point – the verbal or communicative behaviour we are analysing. This *must* survive into newsroom language. **Distinction to Preserve:** Report vs. Experience.
      *   *Stop/Write:* **"The study reports that Subject X stated: '[Quote/reliable paraphrase]'."** (This is now a fact *about what was said*).
      *   *Judgement Call Flag:* Determining if a paraphrase is reliable or if non-verbal communication (e.g., button press in response to a question) constitutes a "report" equivalent to text.

  2.  **Assess Sincerity Cues (Not Guarantee):**
      *   *Question:* "What evidence suggests the subject was *trying to be truthful* in their report? (e.g., consistency under questioning, plausibility within context, lack of motive to deceive, corroborating behaviour). What evidence might suggest insincerity?"
      *   *Sufficient Answer:* Listing specific cues from the study methodology or context (e.g., subject repeated answer consistently, was cooperative, no external pressure identified; OR subject had history of confabulation, context incentivised certain responses).
      *   *Rationale:* Gauges whether the report is likely intended as a truthful account. This is crucial for interpretation. **Distinction to Preserve:** Sincerity vs. Insincerity. Accuracy is still unknown.
      *   *Stop/Write:* **"The subject's report appeared sincere based on [cues]"** OR **"There are reasons to question the report's sincerity based on [cues]"** OR **"The study provides insufficient information to assess sincerity."** (This remains a fact *about the context of the report*).
      *   *Judgement Call Flag:* Weighing the strength of sincerity cues is inherently interpretive.

  3.  **Assess Accuracy Constraints (Not Proof):**
      *   *Question:* "What evidence *external to the report itself* could support or challenge the *accuracy* of what's described? (e.g., neural correlates, physiological measures, behavioural consistency, task performance, environmental controls, known limitations like memory distortion in dreams/anaesthesia, drug effects on perception)."
      *   *Sufficient Answer:* Listing specific, measurable findings that align with or contradict the report (e.g., brain activity pattern Y occurred when subject reported event Z; subject pressed button correctly when reporting seeing stimulus; subject described events that demonstrably didn't occur; the report occurred under ketamine, known to distort perception).
      *   *Rationale:* Identifies factors that might make the report more or less likely to correspond to actual events or experiences. **Distinction to Preserve:** Corroboration/Contradiction vs. Direct Evidence of Experience.
      *   *Stop/Write:* **"The reported [phenomenon] is consistent with [external evidence]"** OR **"The reported [phenomenon] is inconsistent with [external evidence]"** OR **"No strong external evidence corroborates or contradicts the reported [phenomenon]."** (This is a fact *about the relationship between the report and other data*).
      *   *Judgement Call Flag:* Interpreting the strength and relevance of external constraints.

  4.  **Determine the Study's Claim & Your Framing:**
      *   *Question A (Reporter):* "What does the *study/researcher* primarily claim to have discovered? Is it about the *reports themselves* or about the *experiences* they might indicate?"
      *   *Question B (Editor):* "What claim will *our piece* make? Will it frame the finding as concerning the *report* (safe) or the *experience* (requires justification beyond the report alone)?"
      *   *Sufficient Answer:* Clear statement of the study's abstract/conclusions and the intended angle for the magazine piece.
      *   *Rationale:* Forces explicit consideration of whether the study (and our piece) respects the report/experience gap. **Distinction to Preserve:** Study Claim (Report vs. Experience Inference) & Our Framing (Report-Centric vs. Experience-Centric).
      *   *Stop/Write:* **"The study claims [study claim]. Our piece will frame this primarily as a finding about [Reports/Inferred Experiences]."**
      *   *Handoff Point:* **THIS IS THE KEY EDITORIAL VALUES HANDOFF.** Deciding to frame something as about *inferred experiences* requires significant justification (Steps 2 & 3 strongly supporting plausibility) and careful wording acknowledging the inference. Default to report-centric framing unless strong justification exists. *This decision point goes to the Commissioning Editor.*
      *   *Judgement Call Flag:* Deciding the framing is the core editorial judgement.

  5.  **Flag Inferences & Neutrality:**
      *   *Question:* "If we *are* framing this as concerning experiences (based on Step 4 handoff decision), what explicit caveats about the inferential leap (sincerity, accuracy constraints, alternative explanations) *must* be included in the piece?"
      *   *Sufficient Answer:* List of specific caveats derived from Steps 2 & 3 that must be clearly stated for the reader.
      *   *Rationale:* Ensures readers understand the gap between report and experience and the basis for any inference. Maintains neutrality by presenting the alternatives.
      *   *Stop/Write:* **"The piece must explicitly state: [List of specific caveats, e.g., 'While the brain activity suggests imagery, we cannot know if the patient subjectively experienced it,' or 'Reports were collected after waking and may be affected by memory distortion']."** (This dictates mandatory content).
      *   *Judgement Call Flag:* Choosing *which* caveats are most critical and how forcefully to state them.

  **Newsroom Wiki Summary: "The Report Check"**

  1.  **What Was Said?** Pinpoint the exact experience the subject described. Quote it. *Write: "Subject reported [X]."*
  2.  **Truthful Intent?** Look for signs they meant it (consistency, context). Or signs they didn't. *Write: "Report seemed sincere/possibly insincere/unclear because [Y]."*
  3.  **Backed by Evidence?** What other data (scans, behaviour, context) supports or clashes with the report? *Write: "Report aligns/conflicts/isn't strongly tested by [Z]."*
  4.  **FRAMING DECISION (Editor):** Is our piece mainly about the *report itself* (safer) or does it claim insight into the *actual experience* (needs strong justification from 2 & 3)? *Default to report-centric.*
  5.  **Flag the Gaps:** If discussing experience, *must* tell readers the caveats (e.g., "we can't be sure they felt it", "memory may be fuzzy"). List them.

  **Golden Rules:**
  *   **"Reported" ≠ "Experienced".** Always distinguish.
  *   **Sincerity ≠ Accuracy.** Someone can mean it but be wrong.
  *   **Neutral Start:** We don't assume reports are true or false.
  *   **Justify Inferences:** Going from report to experience needs evidence *beyond* the report.

  **Applying the Procedure to Your Cases:**

  1.  **Unresponsive Patients / Command-Following Activation (No Verbal Report):**
      *   *Step 1:* Report? No verbal text. Behavioural report? *Brain activation pattern in response to command.* Sufficient to treat as "report" via communication channel (neural response). "The study reports that a neural signature consistent with imagining tennis/house navigation occurred when commands were given."
      *   *Step 2:* Sincerity? Assumed by task compliance (if instructions understood). Cue: Activation only for correct commands? "Sincerity (intent to follow command) is inferred from the specific, appropriate neural response."
      *   *Step 3:* Accuracy Constraints? Does activation pattern X reliably = subjective imagery of tennis/house in aware people? Yes (study's premise). Is it *only* produced by conscious imagery? Debatable (core controversy). "The neural pattern is strongly associated with conscious imagery in responsive subjects. However, whether it *uniquely requires* conscious experience in unresponsive patients is unknown."
      *   *Step 4:* **Editorial Handoff.** Study claims evidence of *covert consciousness*. Our Framing: **Reporter is entitled to write:** "The study detected brain activity in unresponsive patients that, in conscious people, signifies imagining tennis or navigating a house, suggesting possible hidden awareness." **Avoid:** "Patients were consciously imagining tennis" (assumes experience). **Crucially:** Frame as *evidence suggestive of* consciousness, not proof *of* the specific experiential content ("imagining tennis" is the *interpretation* of the neural data, not a report of experience).
      *   *Step 5:* **Mandatory Caveats:** "This does not prove the patients subjectively experienced the imagery"; "Whether this activity definitively signals consciousness is debated"; "We cannot know the quality or content of any possible inner experience."

  2.  **Dream Decoding (Retrospective Reports):**
      *   *Step 1:* Report? Verbal descriptions given *after waking* (e.g., "I saw a man on a horse"). "Subjects reported dream content involving objects like [broad categories] after being awakened."
      *   *Step 2:* Sincerity? Generally assumed in sleep studies, but memory distortion is a major factor. "Reports are assumed sincere, but accuracy is impacted by recall from sleep and delay before reporting."
      *   *Step 3:* Accuracy Constraints? Classifier guessed category above chance based on *pre-awakening* brain activity. "The classifier's above-chance performance based on *pre-report* brain activity provides external corroboration that neural patterns related to the *reported* object categories were present shortly before waking."
      *   *Step 4:* **Editorial Handoff.** Study claims ability to *predict* reported dream content from neural activity. Our Framing: **Reporter is entitled to write:** "A brain scanner could predict the general type of object people would *report* dreaming about just before they woke up, suggesting a link between pre-awakening brain activity and subsequent dream recall." **Avoid:** "Scientists decoded dream content" (implies direct access to experience, bypassing report).
      *   *Step 5:* **Mandatory Caveats:** "This predicts *what people reported dreaming*, not necessarily the dream experience itself"; "Dream reports can be fragmented and distorted by the waking process"; "The decoding was for broad categories, not specific details."

  3.  **Organoid Stress Activity & "Cannot Rule Out Feeling":**
      *   *Step 1:* Report? **There is no subject report.** The *scientist* reports detecting "stress-like" neural activity and *speculates* ("cannot rule out that something is felt"). The *only* direct report is the scientist's statement. "The lab leader stated: 'I cannot rule out that something is felt' by the organoids."
      *   *Step 2:* Sincerity? Presume scientist is sincere in expressing their scientific opinion/caution.
      *   *Step 3:* Accuracy Constraints? Neural activity patterns *analogous* to stress in intact brains/organisms. **No evidence** these patterns are linked to any subjective state *in organoids* (no behaviour, no report, no known mechanism). "The 'stress-like' activity is an interpretation based on similarity. There is currently no evidence that organoids possess the necessary biological complexity for subjective experience."
      *   *Step 4:* **Editorial Handoff.** Study claims stress-like activity. Scientist speculates cautiously about feeling. **Reporter Framing (Per Protocol):** MUST be report-centric: "Researchers observed complex neural activity in cerebral organoids that they interpret as 'stress-like,' and the lab leader states he 'cannot rule out' the possibility of some form of sensation, though there is no evidence for it." **AVOID:** Framing the piece as being about organoids "feeling stress" or potentially "suffering." **Crucially:** The "cannot rule out" quote is the *scientist's report/opinion*, not a report *from* the organoid. The procedure forces you to frame around the scientist's *statement about uncertainty*, not around the (entirely speculative) experience itself.
      *   *Step 5:* **Mandatory Caveats (Essential here):** "Organoids lack the bodily structures and integrated neural networks thought necessary for consciousness"; "There is currently no way to detect or measure subjective experience in cell cultures"; "The 'stress-like' label is an analogy based on activity patterns, not evidence of feeling."

  **Limits of the Procedure:**

  1.  **No Subjective Report = Limited Application:** It struggles fundamentally with cases lacking any form of report (like organoids or basic NCC studies). It can only analyse *researchers' statements* about these, not the (non-existent) subjective data. It cannot *create* evidence of experience.
  2.  **Neutrality vs. Assumption:** The neutrality is methodological, not metaphysical. It avoids *assuming* reports reflect experiences to prevent circularity. Critics (like first-person methodologists) argue this inherently biases towards third-person explanations and ignores the primacy of experience. The procedure accepts this criticism but holds that methodological caution is necessary for objective reporting.
  3.  **Cannot Resolve the Hard Problem:** It won't tell you if organoids, LLMs, or unresponsive patients *are* conscious. It only structures how we handle *claims and reports* about consciousness.
  4.  **Cannot Guarantee Perfect Framing:** It guides framing but relies on the editor's/writer's careful wording. A clumsy turn of phrase can still blur the report/experience line.
  5.  **Judgement Calls Remain:** Assessing sincerity cues, strength of constraints, and the final framing decision involve unavoidable editorial judgement. The procedure makes these explicit but doesn't eliminate them.
  6.  **Subjectivity in Caveats:** Choosing which caveats are most salient involves judgement about audience and emphasis.
  7.  **Beyond Science:** It doesn't address ethical implications (e.g., of potential organoid sentience) that might arise *if* experience were granted. These require separate ethical deliberation.

  This protocol provides a structured, defensible method for handling the report/experience gap inherent in consciousness studies, prioritising clarity and avoiding unwarranted leaps while allowing informed inferences when justified. It makes editorial values explicit and arms reporters and editors with clear questions and framing rules.
