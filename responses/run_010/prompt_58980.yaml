  I'll start drafting the joint claims first. Need points both can accept, like acknowledging the problem isn't unique to ethics (Claim 1) or that naive summation fails (Claim 2). Then the cruxes: the key divides are whether infinite sets can be ethically compared (Crux 1), whether comparison methods are arbitrary (Crux 2), and whether core moral principles survive (Crux 3). 

