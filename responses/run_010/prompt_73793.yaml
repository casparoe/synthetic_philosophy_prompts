prompt: |-
  I have been defending a fairly strong version of Good's theorem on the value of information: the result that a Bayesian decision maker who chooses optimally relative to her posterior should never decline a costless observation bearing on her decision. My interest is not purely academic. I work on the information-gathering layer of a planning system that has to decide which sensors to query, which tests to commission, and which reports to read before committing resources, and the theorem functions there as a default rule — acquire anything that is genuinely free and decision-relevant, then optimize — so I have a professional stake in knowing how much weight it will bear. A colleague thinks the result is a disguised tautology that purchases its safety by assuming everything interesting away, and my own response has been that the standard textbook defense is subtler than it looks: the reason free information is said to be harmless is that the agent can always act as though she had never received it, but that escape is available only because the theorem already assumes her post-observation choice is optimal for her posterior, so an agent who cannot bind herself to ignore what she learns loses the defense rather than gaining a comfort. I am not certain that reply is correct, and I want the position stress-tested rather than reassured.

  So: what would count against the thesis that a rational agent is never worse off for costless, decision-relevant information, and never has a reason to refuse it? I would like the defeaters sorted by how damaging they actually are — fatal, decisive, merely awkward, or purely dialectical — and, for each one, an identification of which hypothesis it targets: that the evidence is a proposition the agent could already represent before receiving it, that she updates by conditionalization, that her preferences over outcomes are unaffected by the learning itself, that her action set is unchanged, that her later self chooses optimally given the posterior, that her beliefs do not enter her utility directly, or that the act of acquiring the information is unobservable to others who might respond to it. Please tell me which of these failures are live in practice for real agents, markets, and deployed systems, as opposed to being logically possible but never instantiated. I am especially interested in several families I cannot yet evaluate properly: preferences that violate expected utility in ways that make dynamic choice inconsistent, so that an agent who cannot commit is genuinely harmed by free information; ambiguity and non-Bayesian revision, where additional evidence can leave a decision maker worse off; models in which optimistic or pessimistic beliefs are themselves sources of utility, so that resolution destroys a valued anticipation; present-biased or myopic agents whose future selves predictably misuse what they learn; cases where learning supplies concepts the agent did not previously possess, so that the posterior is not her prior conditional on any event she could have entertained; and strategic settings in which becoming informed is visible and thereby changes what others do, so that the information was never free in the relevant sense. Where you think a purported counterexample merely smuggles out a hypothesis and redescribes the assumptions as a refutation, say so plainly rather than granting it.

  Two further things. First, tell me which of these a committed defender of the theorem would herself concede as counting against the position, and which she would dismiss as changing the subject, and explain the difference in standards she is applying — in particular, whether the theorem is a substantive claim about rational agents or an analytic consequence of a framework, and whether the normative use I make of it in system design is justified, undermined, or simply untouched by that distinction. Second, assess the insulation charge directly: if every counterexample turns out to violate some assumption, does the view risk anything at all, and is its safety a virtue or a defect? Along the way, please separate the descriptive reading, which I take to be false as an empirical generalization about human subjects, from the normative reading; I recently ran a small elicitation in which roughly a third of participants paid a modest amount to prevent the resolution of a lottery they had already chosen, and I want to know what that result can and cannot establish against each reading, including whether a rival account that treats ignorance as sometimes intrinsically preferable predicts the data without positing an extra utility term over beliefs. Finally, if you conclude that the position is well insulated, tell me what a genuinely damaging counterexample would have to look like — an agent satisfying every standard hypothesis and still made worse off by a costless observation — and whether anyone has constructed one.
reasoning: |-
  Okay, let me start by unpacking this user's query. They're deeply engaged with Good's theorem, both theoretically and practically. They work on information-gathering systems, so the theorem's reliability directly impacts their professional decisions. Their colleague thinks it's a tautology, and they're worried their defense might not hold up. They want the strongest possible counterarguments tested rigorously.

  First, I need to recall Good's theorem's core assumptions: free information, Bayesian updating, no belief-dependent utility, etc. The user mentioned several potential failure points like preference violations, strategic interactions, or belief utilities. I should categorize each defeater by severity and which assumption it violates.

  Starting with fatal flaws: Strategic settings where others observe your info acquisition. If a competitor sees you gathering data, they might change tactics, making the info costly. That violates the "unobservable" assumption. This seems practical in markets. Also, belief-dependent utility—like when people enjoy hope—directly conflicts with the utility assumption. The user's experiment with people paying to avoid lottery results fits here. Ambiguity aversion is another; if new info increases uncertainty instead of reducing it, that's damaging.

  Then decisive but not fatal: Unrepresentable concepts. If learning introduces new ideas the agent couldn't conceive before, conditionalization fails. This is tricky but real, like pre-discovery states in science. Preference reversals under EU violations matter too, especially with commitment issues. If an agent can't commit to future actions, they might misuse info, making free data harmful. This affects real systems without commitment mechanisms.

  Merely awkward: State-dependent or resource-limited actions. If actions have costs tied to states, or processing info is costly, it violates the "costless" or "unchanged action set" assumptions. In practice, most systems have computational limits, so this is common but not a theorem killer.

  Dialectical: Things like changing preferences due to learning. A purist would say this alters the agent's identity, so it's not the same scenario. It's a valid concern but shifts the framework.

  The user also asked about normative vs. descriptive readings. Their experiment shows people avoid info, but that's descriptive. Normatively, a Bayesian with stable preferences shouldn't. Rival theories like direct belief utilities explain the data without extra terms, challenging the normative claim.

  Insulation charge: If all counterexamples break assumptions, the theorem is safe but possibly vacuous. However, its value is in defining rational benchmarks. For system design, it's a useful default unless specific failures (like strategic issues) are present.

  Finally, a genuine counterexample would need an agent satisfying all assumptions but still harmed by free info. I don't think any exist; attempts either sneak in costs or violate assumptions. The theorem holds under its terms, but real-world deviations are where the user's work must adapt.
answer: |-
  Here's a systematic stress-test of Good's theorem, categorized by defeaters, their targets, practical relevance, and normative implications. I'll follow your requested structure rigorously, distinguishing fatal flaws from lesser challenges, and separating descriptive from normative claims.

  ### **I. Fatal Defeaters (Directly Undermine the Theorem's Core)**
  1. **Belief-Dependent Utility**  
     - **Target:** *Preferences over outcomes unaffected by learning; beliefs don't enter utility directly.*  
     - **Mechanism:** If an agent derives utility from optimistic beliefs (e.g., hope, suspense) or avoids painful truths (e.g., medical diagnoses), costless information can destroy intrinsic value.  
     - **Example:** A patient prefers ignorance about a terminal illness to avoid despair; learning the truth directly reduces welfare regardless of subsequent actions.  
     - **Practical Relevance:** Common in humans (your lottery experiment aligns here). Markets exhibit this via "information aversion" in behavioral finance.  
     - **Normative Concession:** A committed defender *must* concede this refutes the theorem. Good's framework assumes utility depends *only* on states and actions, not beliefs. Adding belief-utility changes the decision problem fundamentally.  

  2. **Strategic Observability**  
     - **Target:** *Act of acquiring information is unobservable to others.*  
     - **Mechanism:** If others observe information acquisition (e.g., competitors, adversaries), they may change their behavior preemptively, making the information costly.  
     - **Example:** A firm researching a new market signals its interest to rivals, provoking entry. The research was "free" but triggered costly strategic responses.  
     - **Practical Relevance:** Ubiquitous in markets, auctions, and adversarial planning (e.g., cybersecurity).  
     - **Normative Concession:** Defenders concede this violates "costless" and "unobservable" assumptions. The theorem applies only when information acquisition is *privately* costless.  

  ---

  ### **II. Decisive Defeaters (Violate Assumptions in Real Systems)**
  3. **Non-Bayesian Revision & Ambiguity Aversion**  
     - **Target:** *Updates by conditionalization; ambiguity-neutral preferences.*  
     - **Mechanism:** Under ambiguity (Knightian uncertainty), new information can *increase* perceived uncertainty (e.g., conflicting evidence). Non-Bayesian agents (e.g., using max-min or Choquet expected utility) may prefer prior ignorance.  
     - **Example:** A security analyst receives ambiguous threat reports; the added noise makes robust planning harder, increasing regret.  
     - **Practical Relevance:** Critical in AI systems with limited models (e.g., reinforcement learning in non-stationary environments) and human experts facing complex data.  
     - **Normative Response:** Defenders dismiss this as "changing the subject": Good assumes Bayesianism. If you reject Bayesian updating, the theorem doesn't apply.  

  4. **Conceptual Innovation**  
     - **Target:** *Evidence is a proposition the agent could already represent.*  
     - **Mechanism:** Learning can supply new concepts (e.g., "dark matter"), making the posterior incommensurable with any prior event. The agent cannot conditionally update because the evidence wasn't conceivable.  
     - **Example:** A pre-20th-century physicist learns quantum spin; no prior event in their model space captures it.  
     - **Practical Relevance:** Occurs in scientific discovery, exploratory AI, and innovation pipelines.  
     - **Normative Response:** Defenders concede this breaks conditionalization. A purist might argue rational agents *should* have rich hypothesis spaces, but this is idealized.  

  ---

  ### **III. Merely Awkward Defeaters (Require Auxiliary Assumptions)**
  5. **Dynamic Inconsistency & Commitment Failure**  
     - **Target:** *Later self chooses optimally given the posterior; preferences satisfy expected utility.*  
     - **Mechanism:** With time-inconsistent preferences (e.g., hyperbolic discounting), an agent may misuse information. Without commitment, free information enables future self-sabotage.  
     - **Example:** A present-biased agent learns a deadline is flexible and procrastinates, achieving worse outcomes than if ignorant.  
     - **Practical Relevance:** Pervasive in human behavior; relevant for AI systems with multiple optimization stages.  
     - **Normative Response:** Defenders argue this violates "rational choice" (EU + dynamic consistency). The theorem assumes an agent who *can* optimize globally.  

  6. **Costly Actions or State-Dependent Constraints**  
     - **Target:** *Action set is unchanged.*  
     - **Mechanism:** Information can reveal states where actions are costly or infeasible (e.g., learning a bridge is out forces a long detour). Ignorance might have allowed cheaper "default" actions.  
     - **Example:** A logistics AI learns a shipment route is blocked; rerouting costs more than proceeding blindly (if the blockage was probabilistic).  
     - **Practical Relevance:** Common in real-time systems with action costs (e.g., robotics).  
     - **Normative Response:** Defenders note the theorem allows actions to have state-dependent consequences; the "unchanged action set" refers to availability, not costs. This is a boundary case.  

  ---

  ### **IV. Purely Dialectical Defeaters (Redescribe Assumptions)**
  7. **Changed Identity or Preferences**  
     - **Target:** *Preferences over outcomes unaffected by learning.*  
     - **Purported Mechanism:** Learning transforms the agent (e.g., traumatic knowledge alters preferences).  
     - **Why Dialectical:** This redefines the agent post-learning as a "different" entity, violating the ceteris paribus clause. Defenders argue Good assumes a stable agent.  
  8. **Covert Costs**  
     - **Target:** *Information is costless.*  
     - **Purported Mechanism:** Information always consumes attention, computation, or opportunity cost.  
     - **Why Dialectical:** The theorem explicitly assumes *zero* costs. Claiming hidden costs is tautological: if it’s costly, it’s not covered.  

  ---

  ### **V. Your Experiment & Normative/Descriptive Divide**
  - **Your Result (1/3 pay to avoid information):**  
    - **Descriptive Reading:** Strong evidence against Good as an empirical claim. Humans routinely avoid free information due to belief-dependent utility, ambiguity aversion, or present bias.  
    - **Normative Reading:** Does *not* refute Good. A Bayesian with belief-independent utility *should not* pay to avoid information. Your data is explained by non-theorem-compliant preferences (e.g., direct utility from suspense).  
    - **Rival Account:** Models like "information avoidance as rational self-protection" (Golman et al.) explain this *without* extra utility terms by treating beliefs as endogenous states affecting future choices. However, these still violate Good’s preference-stability assumption.  

  ---

  ### **VI. Insulation Charge & Normative Justification**
  - **"Is the theorem insulated?":** Yes, but not vacuously. Its assumptions define a *specific class* of rational agents. Violations identify decision pathologies (e.g., dynamic inconsistency) or expanded utility frameworks.  
  - **Safety as Virtue or Defect?**  
    - **Virtue:** Provides a clean benchmark for "orthodox" Bayesian rationality. In system design, it justifies default information acquisition *unless* specific defeaters (e.g., strategic risks) are present.  
    - **Defect:** Fails to guide real agents/systems where defeaters are endemic (e.g., humans with belief-dependent utility, AIs with computational limits).  
  - **Committed Defender's Stance:**  
    - Concedes: Belief-dependent utility, strategic observability, conceptual innovation.  
    - Dismisses: Non-Bayesian updating, dynamic inconsistency, ambiguity aversion as "outside scope."  
    - **Standard Applied:** The theorem is *analytic* within its framework. Defenders view deviations as irrational or modeling errors, not refutations.  

  ---

  ### **VII. Genuinely Damaging Counterexample: Requirements & Existence**
  - **Required:** An agent satisfying:  
    - Bayesian updating on representable events  
    - Expected utility with action- and state-dependent outcomes only  
    - Dynamic consistency  
    - Costless, unobservable information acquisition  
    - Strictly improved decisions for some states  
    ...yet *ex ante* worse off after receiving information.  
  - **Existence:** No such counterexample exists. All purported cases (e.g., "toxic knowledge" in philosophy) violate at least one assumption. The theorem is mathematically sound under its axioms.  

  ### **Recommendations for Your Work**
  1. **In System Design:** Use Good as a default, but build detectors for:  
     - Strategic settings (observable information acquisition)  
     - Belief-dependent objectives (e.g., user comfort)  
     - Computational/attention costs  
  2. **For Human-AI Interaction:** Assume belief-dependent utility is the norm; offer information opt-outs.  
  3. **Theoretical Defense:** Stress that Good assumes no *direct* cost from beliefs. When colleagues cite "harm," clarify if they mean belief-utility (concede) or information misuse (dismiss as irrational).  

  The theorem's power lies in its idealization. It fails precisely where rationality is fragile—making it a tool for diagnosing fragility, not an universal law.
