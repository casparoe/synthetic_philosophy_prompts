prompt: |-
  I am a staff software engineer on the trust-and-safety side of a mid-size online platform. My training is entirely technical, so I will try to describe a pattern I keep running into in policy work without assuming any vocabulary for it, and I would like help identifying it.

  The pattern has three stages, and I have now watched it run to completion four or five times.

  Stage one. A prohibition is proposed on some category of content or account behavior. Asked what the practice does to anyone, the proponents have nothing to offer, and it is understood in the room that they have nothing to offer. Their reasons are of a different order: this is not the kind of place we are, it makes the product feel cheap, the users who built this community would not recognize it, our standards are themselves the asset. The proposal frequently passes on precisely that basis.

  Stage two. Later — typically after an outside critic has observed that no injury to anyone has been identified — an injury is produced. A paper, an anecdote, an internal metric, a claim that the content pushes vulnerable users off the platform. Sometimes the injury is genuine and was simply not what anyone had in mind during the deliberation; sometimes it is not clearly genuine at all. In either case it is now presented as the reason the policy exists, and it migrates into public-facing documents.

  Stage three. From then on the original ground has effectively vanished. Question the injury and you are told the policy was never only about the injury, and the standards reasons resurface — but as reminders of something settled rather than as premises open to argument. Question the standards reasons and you are referred to the injury. Neither support is ever on the table at the same time as the other, which is what makes the policy so hard to press against.

  Two instances. We banned a genre of joke accounts because they made the site feel like a bad place to be; nine months later, answering a journalist, our stated rationale was that such accounts had coordinated to harass individual users, which was never part of the deliberation and for which we had no internal data at the time, but which now appears in a transparency report while the original reasoning survives only as a background assumption nobody is required to defend. Separately, we required non-anonymous display names on the ground that anonymity was beneath the tone of the product; when the resulting drop in sign-ups became awkward, the documented rationale became impersonation fraud and doxxing. I have since seen the ordering run the other way as well — a rule adopted on a claimed injury that the data failed to bear out, re-grounded a year later on the claim that the behavior was unbecoming of our community.

  What I want to know is whether this has a name.

  I can guess at neighbors, and I think each of them misses. There is the general observation that people manufacture reasons after the fact for judgments they already hold; but that concerns individuals and their psychology, and it does not involve one kind of justification being replaced by a different kind. There is the debate in legal philosophy over whether a society may prohibit conduct merely because its members find it degrading, when nobody is injured; but that debate appears to be about whether the standards-based reason is admissible in the first place, and it pictures people offering that reason openly, whereas what I am describing turns on the standards-based reason being withdrawn from view and supplanted. A colleague suggested this is just the familiar move of retreating to a defensible claim when attacked and returning to the strong one afterward; I am not convinced, because here the two claims are not a defensible core and an indefensible extension but grounds of different types, and the substitution is one-way and permanent rather than tactical.

  So, specifically:

  1. What are the nearest established concepts, and precisely how does each fall short of the thing I have described? I want the mismatch stated, not a list of candidates.
  2. Has the phenomenon been described in the literature on law and morality, or in whatever literature deals with how institutions justify themselves to outsiders? I am not after references to chase down — I have no library access and no background in the field — only the concepts and the distinctions between them.
  3. Where are the edges? Sometimes a genuine injury is discovered after a rule is adopted and the rationale is honestly revised in light of it, and I do not want to classify every such revision as this phenomenon. What separates the two, in terms I could apply to a policy document rather than to a description of people's motives?
  4. If there is no name for it, propose one, with a definition tight enough that I could use it to sort real policy rationales into instances and non-instances, and say what the borderline cases look like.

  I would also welcome being told that I have conflated two distinct patterns. The cases feel like one pattern to me, but I may be running together a claim about the order in which reasons arrive and a claim about their substitution.
reasoning: |-
  Okay, let me approach this systematically. The user describes a three-stage pattern in policy justification that feels both deliberate and structurally distinct from known concepts. 

  First, I need to map the core mechanics: 
  Stage 1 is pure standards-based reasoning ("not who we are") presented without empirical support. 
  Stage 2 introduces a new injury-based rationale post-hoc, often unsupported by original data. 
  Stage 3 establishes a perpetual bait-and-switch where the justifications never coexist under scrutiny. 

  The user's examples are telling - joke accounts banned for "making the site feel bad" later recast as coordinated harassment, anonymity rules reframed from "tone" to "impersonation risks". What makes this pattern unique is the one-way substitution of justification types (moral→pragmatic) and its institutional permanence. 

  I recall Dworkin's distinction between policy and principle arguments, but that doesn't capture the temporal swap. The closest fit might be "post-hoc justification" literature in organizational theory, yet most frameworks focus on either cognitive bias (individual level) or legitimation strategies (external facing). This case blends both while adding the justification-type switch. 

  Key differentiators from honest revision: 
  - Original rationale wasn't injury-based at all 
  - New injury emerges only after external challenge 
  - No retroactive data audit occurs 
  - Both rationales remain active but never co-present 

  For borderline cases: if internal docs show active search for injury evidence during Stage 1, it's revision. If injury appears magically post-criticism with no prior investigation, it's this pattern. 

  Proposed term: "Rationale Substitution" with three diagnostic criteria: 
  1. Initial adoption solely on standards grounds 
  2. Injury rationale emerges only after external challenge 
  3. Permanent non-overlap of justifications 

  The user's sharpest insight is recognizing this isn't tactical retreat but categorical replacement. That's what separates it from motte-and-bailey or other dialectic moves.
answer: |-
  Based on your detailed description, you've identified a distinct institutional pattern of justification-swapping. Here's a breakdown answering your queries:

  ### 1. Nearest Established Concepts & Why They Fall Short
  - **Post-hoc Rationalization**:  
    *Mismatch*: Typically describes individuals inventing personal justifications after decisions. Your pattern involves **institutional substitution of justification types** (moral/standards → injury-based) that becomes embedded in policy docs, not just psychological self-justification.
  - **Motte-and-Bailey Doctrine**:  
    *Mismatch*: Involves retreating from a controversial claim ("bailey") to a defensible one ("motte") tactically. Your pattern **replaces one justification permanently with another of a different kind**, without tactical oscillation. The original rationale isn't retreated from—it's erased from record.
  - **Legitimation Crisis (Habermas)**:  
    *Mismatch*: Focuses on systemic loss of public trust. Your pattern is a **procedural tactic** institutions use *internally* to avoid such crises, not the crisis itself.
  - **Normative vs. Instrumental Justification (Weber)**:  
    *Mismatch*: Distinguishes value-based vs. goal-oriented reasoning. Your pattern shows **deliberate temporal sequencing** of these to create institutional invulnerability, not just their coexistence.

  ### 2. Literature Connections
  The phenomenon aligns with two intersecting strands:
  - **Organizational Hypocrisy Theory** (Brunsson): Institutions decouple "talk" (public justifications) from "action" (internal decisions). Your pattern adds a **temporal decoupling**: internal rationale (Stage 1) ≠ external rationale (Stage 2).
  - **Legal "Moral Entrepreneurship"** (Becker): Rule-creators define deviance. Your cases show **entrepreneurs retrofitting harm claims** to moral standards when challenged, making rules appear harm-preventing rather than value-enforcing.  
  *Key distinction*: Unlike standard moral entrepreneurship, harm isn't the *driver* but a *post-hoc shield*.

  ### 3. Differentiating Genuine Revision vs. This Pattern  
  **Borderline factors** (applied to policy docs):  
  | **Criterion**               | Genuine Revision             | This Pattern                  |  
  |------------------------------|------------------------------|-------------------------------|  
  | **Timing of injury claim**   | Emerges *during* deliberation | Appears *only after* external challenge |  
  | **Evidence trail**           | Pre-policy data/analysis cited | Injury evidence dated *after* policy adoption |  
  | **Original rationale**       | Acknowledged in later docs  | Erased or labeled "incomplete" |  
  | **Justification coexistence**| New rationale *adds to* original | Rationales *never appear together* |  
  **Smoking gun**: If the injury rationale cites data *collected after* the policy took effect, it’s likely pattern-driven.

  ### 4. Proposed Name & Definition  
  **Term**: **Justification Substitution Cycling**  
  **Definition**:  
  > *An institutional practice where a policy initially adopted on non-instrumental grounds (e.g., communal standards) is later re-justified using injury-based claims when challenged. The original rationale becomes inaccessible to critique (preserved only as "background truth"), while the new rationale avoids scrutiny by appealing to institutional authority. The two justifications perpetually substitute for each other in discourse but are never jointly engaged, rendering the policy immune to coherent challenge.*  

  **Borderline Case Example**:  
  A policy bans "low-quality content" citing user irritation (Stage 1). Later, a *peer-reviewed study* emerges showing such content enables scams. The team:  
  - Publishes the study *alongside* the original rationale (coexistence) → **Not the pattern**  
  - *Replaces* all documentation with scam prevention claims, dismissing "user irritation" as "an early simplification" → **Pattern**  

  ### Why This Isn't Two Patterns  
  The "order-swapping" you note (injury-first → standards later) is the same mechanism: **Justifications are modular and replaceable based on institutional need**. The core is the *permanent substitution* creating dialectical immunity, not the sequence. Sequence varies based on what rationale is socially defensible at adoption time.

  ### Practical Application  
  To identify this in your work:  
  1. **Audit rationale timelines**: Map when each justification first appeared in docs.  
  2. **Check challenge-response**: Did injury claims emerge ≤30 days after media/regulator inquiries?  
  3. **Test coexistence**: Propose a policy change that accepts the injury rationale but rejects the standards rationale (or vice versa). If met with "both matter, but we can't discuss them together," it’s substitution cycling.  

  This pattern thrives in trust-and-safety precisely because harm claims carry legal weight, while standards define brand identity—institutions weaponize both without reconciling them. Naming it ("We're cycling justifications again") disrupts the evasion.
