prompt: |-
  So three years of running our third-year Theory of Knowledge seminar has finally landed me with the session nobody else in the department wanted: 80 minutes on the pramāṇas, 22 students, whiteboard only, no slides. They've all done intro epistemology so they know Gettier, they've done a week on testimony where the reading was Hume and Reid-ish responses, and not one of them has met any Indian philosophy before. The module descriptor calls this slot "non-Western epistemology," which means half the room will walk in expecting a culture segment and being nicely tolerant about it rather than expecting arguments. I don't want to plan the explanation myself, I want you to plan it for me — the order the pieces have to go in and what depends on what, which single case should carry the whole session, the misconceptions and the exact point in the sequence where each one gets headed off, one closing question that separates people who got it from people who are just being polite, and what I should cut and say I'm cutting. No reading list, don't bother, I've got that sorted.

  My half-formed hunch is that the thing worth teaching isn't the list of four at all, it's the reduction question: what is actually being disputed when one school says a putative pramāṇa is "just" another one. The Buddhists say two are enough and that everything else collapses into them; the Mīmāṃsakas say you need six because absence and postulation do work that neither perception nor inference can; Nyāya sits in between at four and refuses the extra two. Underneath all of it there seems to be a question my students can actually argue about — what makes two ways of coming to know the same capacity or two different ones, and is that a question with an answer or just a choice of taxonomy? I want the session to leave them thinking that question is hard, not that the ancient Indians had a charming list.

  Two problems I can't solve on my own. First, the carrying example. I keep drifting to fat Devadatta — everyone agrees the guy doesn't eat by day and yet he's plump, so you come to know he eats at night, and the fight is over whether that cognition arises from needing to dissolve an inconsistency or is really a suppressed inference with a pervasion you never articulated. It's vivid and it stages the reduction question perfectly. But it does zero work for testimony, and testimony is precisely where these students are already prejudiced; they've been trained to think "authority" is the unphilosophical pramāṇa, the one you invoke when you've run out of reasons. So maybe the case should be the one where you were told in advance by a forester that the gavaya resembles a cow, and later, out in the forest, you spot something cow-like and it clicks what the word was hooked to — because then the question becomes whether that click is memory plus testimony plus perception or something over and above them, and Nyāya's reason for saying "over and above" is a reason about how memory can't itself generate anything new. Tell me which one to build on and what the case must have and must not have, because I suspect I'm trying to make one example do two jobs and it won't. Second: where do I put the bit I find most striking, which is that on the Nyāya picture you never witness the truth of your own cognitions — veridicality gets ascertained only afterwards, and the test is roughly whether acting on it works out, and in ordinary cases you don't even run the test, you just act unless something raises a doubt. It looks uncannily like externalism plus a default presumption of trust, and it's the thing that would most surprise them, but it seems to presuppose they already know what a pramā is, so I can't tell whether it's an opening hook or a closing payoff.

  Also fold in these two, if they fit without derailing anything: the idea of a vitiating condition — wet fuel, say, as the thing that stops smoke tracking fire, defined structurally rather than as a list of things to check for, which I think is the closest thing here to what we'd call an undercutting defeater — and the bizarre perceptual machinery that gets invented so you can supposedly perceive a pervasion holding across instances you never visited, which is where I'll need to physically restrain them from saying "that's just Hume's problem of induction and they solved it." Misconceptions I'm already braced for: pramāṇa gets translated in their heads as "source of evidence" and the whole framework turns internalist; they decide the five-step schema is Aristotle with two redundant steps bolted on for ritual reasons; they take śabda to mean faith; they conclude the reduction debate is verbal quibbling about a list. Add whatever else you'd expect and tell me the order they'll arrive in, because I think some of them will form the internalist reading before I've even said the word pramāṇa. One constraint on the cut list: they're assessed by an essay in which they have to set one of these reduction disputes against a live debate in the analytic literature, so whatever survives has to leave them able to write that essay and not merely charmed, and I'd like you to tell me honestly whether putting the five-step inference schema on the board at all is a trap at this length.
reasoning: |-
  Okay, let me unpack this. The user is teaching a Theory of Knowledge seminar and needs to structure an 80-minute session on pramāṇas for students new to Indian philosophy. They have specific pedagogical goals: avoid superficial cultural tokenism, focus on the reduction debate ("is X pramāṇa just Y in disguise?"), and make it argument-driven. 

  Hmm, two main challenges stand out. First, which case study to use—the Devadatta example illustrates reduction beautifully but ignores testimony, while the gavaya case tackles testimony but might be too complex. Second, where to place the striking Nyāna idea that we don't internally verify cognitions but test them through action—should this hook them upfront or cap the session?

  The user's deeper priorities are becoming clear: they want students to grapple with taxonomy-as-philosophy (not just "charming lists"), confront preconceptions about testimony as "unphilosophical," and walk away equipped to write comparative epistemology essays. The constraints are tight—whiteboard only, no prior Indian philosophy exposure, and students primed for "culture segment" passivity.

  I'm noticing tension in their examples. Devadatta is lean pedagogically (reduction focus + no baggage) but skirts testimony; gavaya engages testimony head-on but risks cognitive overload. The solution might be modular: use Devadatta to model reduction mechanics first, then pivot to testimony as a separate reduction puzzle. That preserves clarity while covering both.

  The "veridicality through action" point feels like a closer—it's Nyāya's answer to "why does reduction matter?" and mirrors contemporary externalism. Slotting it early would confuse, but ending with it shows the system's coherence. 

  For misconceptions: the internalist reading of pramāṇa is inevitable. Best to preempt it by contrasting "knowledge-source" with "evidence" upfront. The five-step inference schema? Axe it—80 minutes can't defend its non-redundancy without derailing reduction. Vitiation conditions can tag along with Devadatta as defeater examples; "grasping pervasion" is a footnote to avoid Hume-digressions.

  Final structure should ladder: 1) Frame reduction as the core puzzle 2) Dissect one clear case (Devadatta) 3) Generalize to testimony 4) Reveal Nyāya's action-based verification as the payoff. The closer? Ask: "If two schools collapse pramāṇas differently, is one right or just parsing cognition differently?"—that separates grasp from politeness.
answer: |-
  Here’s a battle-tested plan for 80 minutes that weaponizes your intuitions, stages the reduction debate front-and-center, and strategically deploys your examples to shatter misconceptions. **Core strategy:** Make the taxonomy question *inescapable* by starting with disagreement, not lists.

  ---

  ### **Session Structure & Timing**  
  **Total: 80 min** (Intro: 5 min | Core: 70 min | Close: 5 min)  

  #### **I. OPENING HOOK: THE DISAGREEMENT IS THE POINT (5 min)**  
  - **Whiteboard:** Draw 3 columns: *Buddhists (2)* | *Nyāya (4)* | *Mīmāṃsā (6)*.  
  - **Grabber Question:** *"When is ‘seeing’ not just seeing? When Indians fought over how many ways to know anything exist."*  
  - **Key Move:** Immediately frame pramāṇas as *competing answers* to "What *fundamental capacities* generate knowledge?" Not a list—a dispute about cognitive architecture. Preempts "charming culture" mindset.  
  - **Misconception Head-off #1:** *"Pramāṇa ≠ ‘source of evidence’ (internalist framing). It’s what *makes knowledge happen*—like photosynthesis for cognition. Veridicality is built-in when conditions are right."*  

  ---

  #### **II. CORE CASE: DEVADATTA’S MIDNIGHT SNACKS (25 min)**  
  *Why this first?* Reduction needs a clean, intuitive case. Testimony is too loaded *until* they grasp the reduction mechanic.  
  - **The Case:** *"Devadatta fasts all day but gains weight. How do you know he eats at night?"*  
  - **Whiteboard Flow:**  
    1. **Perception?** You see him fast by day + see him plump.  
    2. **Inference?** *If* no eating → weight loss. But weight gain → so eating happens.  
    3. **BUT:** Mīmāṃsā says: This isn’t inference! You never *observed* the universal ("absence of eating always → weight loss"). You *postulate* eating to resolve inconsistency. *New pramāṇa: arthāpatti (postulation)*.  
    4. **Nyāya retort:** Nonsense! The universal is *implicitly known* from past cases. This is inference with a suppressed premise.  
  - **Reduction Question:** *"Is postulation just lazy inference? Or does it do something perception + inference can’t?"*  
  - **Vitiation Conditions Tie-in:** *"What if Devadatta has a disease causing weight gain? That’s a *vitiating condition* (doṣa)—like wet fuel for fire-smoke inference. Breaks the cognitive ‘machine’."*  
    → **Misconception Head-off #2:** *Vitiation ≠ checklist. It’s a structural flaw in the causal chain (e.g., memory error, defective sense organ).*  

  ---

  #### **III. PIVOT TO TESTIMORY: THE GAVAYA CLICK (25 min)**  
  *Now they’re primed for reduction—hit testimony where their bias lives.*  
  - **The Case:** *"A forester says ‘gavayas look like cows.’ Later, in the forest, you see a cow-like beast and think ‘That’s a gavaya!’"*  
  - **Whiteboard Flow:**  
    1. **Perception?** You see the beast.  
    2. **Testimony?** You recall the forester’s words.  
    3. **BUT:** Nyāya says the *click* ("This is THAT!") isn’t memory + testimony + perception. Memory is inert—it can’t *fuse* past testimony with present perception to generate *new* knowledge. Enter **śabda (testimony) as irreducible**.  
    4. **Reduction Challenge:** *Buddhists say: This is just inference! "Foresters are reliable + this resembles a cow → this is a gavaya."*  
  - **Key Move:** Contrast with Hume/Reid. *Hume:* Testimony = weak inference. *Reid:* Basic trust. *Nyāya:* Neither! It’s a *sui generis* process—words cause knowledge if the speaker is competent & sincere.  
    → **Misconception Head-off #3:** *"Śabda ≠ faith. It’s *linguistic communication* as a knowledge-generator—with defeaters (liar, mishearing)."*  

  ---

  #### **IV. THE PAYOFF: HOW DO YOU EVEN KNOW YOU KNOW? (10 min)**  
  *Deploy your "striking bit" here—it resolves the reduction debate’s stakes.*  
  - **Whiteboard:** Draw Nyāya’s "knowledge → action → success" cycle.  
  - **The Insight:** *"You don’t *feel* your knowledge is true. You act on it (e.g., avoid a snake you ‘see’). If it works (no snakebite), the cognition was veridical. If not, it was false. *Veridicality is external and pragmatic.*"*  
  - **Tie to Reduction:** *"This is *why* reduction matters! If testimony is irreducible, it’s because it reliably triggers successful action *in its own right*—not because we ‘check’ it against perception. Taxonomy tracks cognitive causation."*  
    → **Misconception Head-off #4:** *"Externalism ≠ ‘just trusting.’ It’s a causal account of knowledge *production*."*  

  ---

  #### **V. CLOSING QUESTION & CUTS (5 min)**  
  - **The Separator Question:** *"When two schools reduce X to Y or refuse to, are they:  
    (a) Arguing about human psychology,  
    (b) Disagreeing about what counts as ‘basic’ in cognition, or  
    (c) Just labeling the same process differently?"*  
    → *Politeness:* Answers (a) or (c). *Got it:* Nuanced (b) + sees metaphysical stakes.  
  - **What to Cut:**  
    - **Mīmāṃsā’s 6th pramāṇa (non-existence)**—too subtle for now.  
    - **The 5-step inference schema**—YES, it’s a trap. It derails into formal logic debates. Say: *"Nyāya’s inference steps are for debate rigor, but we’re focused on *what counts as a fundamental pramāṇa*."*  
    - **"Grasping pervasion"**—Dodge Hume comparisons. Say: *"Whether universals are perceived or inferred is a rabbit hole. Today’s fight is: What *needs* a separate pramāṇa?"*  

  ---

  ### **Why This Sequence Works**  
  1. **Reduction first, taxonomy last:** The list emerges *from* the dispute—not as dogma.  
  2. **Devadatta → Gavaya:** Builds reduction skills on neutral ground, then weaponizes them against testimony bias.  
  3. **Externalism as climax:** Reveals why pramāṇas aren’t "sources of evidence" but *causes of knowledge*—shattering internalist assumptions.  
  4. **Essay-ready:** Students leave with:  
     - A clear reduction dilemma (collapse śabda into inference? arthāpatti into perception?)  
     - Parallels to analytic debates (e.g., reductionism in social epistemology, whether inference is "basic")  
     - Nyāya’s externalism as a foil for internalist theories  

  **Final tip:** Start Q&A with "Which reduction claim felt most forced to you?"—it surfaces who engaged critically. You’ve got this. Burn the list; teach the fight. 🔥
