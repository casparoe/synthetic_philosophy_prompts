prompt: |-
  I'm a third-year philosophy PhD student working in jurisprudence — mostly rules of recognition and constituent power — and I've been reading EU law on the side because I'm TA-ing a seminar that touches on it. There's a pattern in how the EU is put together that I keep circling without being able to name, so I want you to name it. Here's the pattern as I've got it (correct me if I've garbled something):

  - The Union only has the powers the Treaties confer on it. No general legislative competence, no residual power to legislate for the common good.
  - Amending the Treaties needs unanimity among the member states and, on the main routes, ratification by each of them under its own constitutional rules. Even the shortcut procedures, and the clauses that let you swap unanimity for majority voting, need unanimity to trigger and give national parliaments a veto window. So the Union cannot amend the instrument that constitutes it; its members, acting together, can.
  - Meanwhile there's an exit clause a single member state can pull on its own.
  - And yet the operative content of the order has changed enormously without any of that machinery being used. The Court of Justice decided early on that Treaty provisions can create rights individuals enforce in their own national courts, and that EU law prevails over conflicting national law including statutes passed later; ordinary national courts are supposed to disaply the offending national provision themselves rather than wait for it to be repealed or annulled. The Court has also built doctrines nobody wrote down — member state liability for breaches of EU law, implied external powers, fundamental rights as general principles — and it describes all of it as declaring what the Treaties always meant. It also treats the preamble's aspiration to ever closer union among the peoples of Europe as licence to read powers purposively rather than narrowly.
  - And when a ruling would wreck a lot of settled arrangements, the Court sometimes says its interpretation only bites going forward.
  - On top of that, several national constitutional courts — Germany's most famously — reserve the right to refuse to apply an EU act they judge to go beyond the conferred powers or to violate the unamendable core of thier constitution. A power asserted for decades and used, at most, once.

  So: a legal order that cannot formally amend itself, whose content keeps changing anyway through a court that insists it isn't changing anything, enforced bottom-up by thousands of national judges told to set aside their own legislature's statutes, with the members' constitutional courts claiming the last word and never spending it.

  What I want from you:

  1. Reconstruct the theory of legal authority and constitutional change this whole package presupposes. Be explicit about what it assumes about who authored the order (the states? the peoples separately? a single European people?), whether there's a determinate fact about what the Treaties mean that is independent of the Court's say-so, and whether declaring the meaning of a law and changing a law can come apart at all.
  2. Separate what the practice strictly needs from what it merely fits comfortably with. I especially want the underdetermined spots — places where two or three rival theories of authority would generate exactly the same institutional behaviour, so you couldn't tell them apart from outside.
  3. Is there a real contradiction between the Court's "we only declare" self-description and its power to limit a ruling's temporal effects? And between "only the members can amend" and the Court's ability to shift the boundaries of the competences in practice? Tell me whether these are reconcilable and what the reconciliation costs.
  4. What would have to change on the ground — procedure, not just theory — if we swapped the presupposed view for one on which the EU is a self-amending constitutional order authored by a single European demos? Which pieces of the current practice would become unintelligible under that replacement?

  Prose first, as long as it needs to be. Then give me a structured summary as a JSON object with exactly this schema:

  - `reconstructed_theory`: object with `label` (short name for the implicit theory), `core_claims` (array of strings), `presumed_author_of_the_order` (string), `status_of_court_pronouncements` (string: declaratory, creative, or something more specific)
  - `presuppositions`: array of objects, each with `claim` (the commitment), `needed_for_which_element` (which bullet above it's required by), `strength` (one of `strictly_required`, `best_explanation`, `merely_compatible`), `rules_out` (array of rival views it excludes), `rivals_that_also_fit` (array of theories that would license the same behaviour), `if_dropped_what_changes` (string)
  - `tensions`: array of objects with `between` (two strings), `verdict` (one of `genuine_contradiction`, `resolvable_at_a_cost`, `surface_only`), `note` (string)
  - `underdetermined_points`: array of strings
  - `bottom_line`: string

  Keep the JSON values terse, one line each. No bibliography and no citations, please — I want your reconstruction, not a list of things to go read.
reasoning: |-
  We are given a complex pattern in EU law and institutional behavior. The user, a philosophy PhD student in jurisprudence, wants a reconstruction of the implicit theory of legal authority and constitutional change, an analysis of its presuppositions, tensions, underdetermined points, and a thought experiment about changing the foundational view.

  ### Step 1: Reconstruct the Theory
  The pattern suggests a theory that is:
  - **Dualist in origin**: The EU legal order is created by treaties among sovereign states (member states), not by a single European people. The states are the authors of the order.
  - **Static in formal amendment**: The treaties are the constitution, and they can only be amended by the unanimous agreement of the states (through their own constitutional procedures). This reflects the states' sovereignty.
  - **Dynamic in interpretation**: The Court of Justice of the European Union (CJEU) has an expansive role in interpreting the treaties, which effectively changes the operative content of EU law without formal amendment. However, the Court maintains that it is merely declaring the law (declaratory theory of adjudication).
  - **Hierarchical and decentralized enforcement**: EU law is supreme and directly effective, enforced by national courts (bottom-up). But national constitutional courts reserve the right to review EU acts for ultra vires or constitutional identity, creating a potential (though rarely used) check.
  - **Evolution without formal change**: The system evolves through judicial interpretation and practice, even though the formal rules for change are rigid.

  **Core Claims of the Reconstructed Theory**:
  1. The Treaties are the foundational agreements among sovereign states, who are the authors of the EU legal order.
  2. The Union has only the powers conferred by the Treaties (principle of conferral).
  3. Amendment of the Treaties requires unanimous state consent, reflecting state sovereignty.
  4. The Court of Justice has the ultimate authority to interpret the Treaties and EU law, and its interpretations are binding and declaratory (not creative).
  5. EU law is supreme and directly effective, creating rights for individuals that national courts must enforce.
  6. National constitutional courts retain a residual authority to protect their constitutional identity and the limits of conferred powers.
  7. The system allows for evolutionary change through interpretation and practice without formal amendment.

  **Presumed Author**: The member states (as sovereign entities) acting together.

  **Status of Court Pronouncements**: Declaratory (in theory) but with creative effects in practice. The Court claims it is only declaring the law, but the effect is often to expand EU powers and rights.

  ### Step 2: Presuppositions (What the Practice Strictly Needs vs. What Fits)
  We need to break down each element and see what it presupposes.

  - **Element 1 (Conferred powers only)**: Strictly requires that the EU is a creature of the states, not a sovereign entity itself. It is compatible with state sovereignty and the idea that the EU has no inherent power. Rival views that would be ruled out: a federal state with inherent sovereignty. Rivals that also fit: any theory that accepts the principle of conferral (e.g., international organization, constitutional order of states).

  - **Element 2 (Amendment requires unanimity)**: Strictly requires that the states are the masters of the treaties. This presupposes that there is no European demos with constituent power. It rules out a self-amending constitutional order by a European people. However, it is compatible with the idea that the states are the constituent power. Rivals that also fit: a confederal model.

  - **Element 3 (Unilateral exit)**: Reinforces state sovereignty. Strictly required to preserve the idea that membership is voluntary and states are sovereign. It rules out any theory that sees the EU as an indissoluble union. Rivals that also fit: confederalism.

  - **Element 4 (Court-driven evolution)**: This is where it gets tricky. The Court's behavior (direct effect, supremacy, implied powers, etc.) presupposes that the Treaties are not static and can be interpreted dynamically. It does not strictly require that the Court is being creative; it can be explained by a declaratory theory that the Treaty's true meaning is evolving or was always broad. However, the gap between the formal rigidity and the practical evolution suggests that the Court is playing a creative role. This element is compatible with both a declaratory theory (if we accept that the Treaty's meaning is latent and being discovered) and a creative one (if we admit the Court is making new law). Rivals that also fit: common law constitutionalism (where courts develop the law incrementally), or a living instrument doctrine.

  - **Element 5 (Temporal limitation of rulings)**: This is a tool to manage the consequences of a ruling. It presupposes that the Court's rulings can have retroactive effects (if declaratory) but that this might be unfair or disruptive. By limiting the effect, the Court is acknowledging that its ruling might be creating new law. This element is not strictly required by a declaratory theory (which would say the law was always thus) but is more comfortably explained by a creative theory. However, it can be reconciled with a declaratory theory by saying that the Court is adjusting the application of the law for practical reasons. Rivals that also fit: both declaratory and creative theories can accommodate this by invoking principles of legal certainty and fairness.

  - **Element 6 (National constitutional courts' reserve)**: Presupposes that the states have not fully transferred their sovereignty and that the EU is not a fully autonomous constitutional order. It requires that the states are the ultimate arbiters of the limits of EU power. This rules out a monist view where the EU legal order is supreme and exclusive. Rivals that also fit: constitutional pluralism (where both EU and national orders claim ultimate authority but coexist).

  ### Step 3: Tensions and Their Resolution

  1. **Tension between the Court's "declaratory" self-description and its power to limit temporal effects**:
     - **Verdict**: Resolvable at a cost.
     - **Note**: The declaratory theory holds that the court only states what the law always was, so retroactive effect is natural. Limiting temporal effects implies that the ruling might be changing the law (because if it were always the law, then past cases should be affected). The Court resolves this by invoking the principle of legal certainty (preventing chaos in past transactions). The cost is a blow to the coherence of the declaratory theory: it admits that the ruling is effectively prospective.

  2. **Tension between "only the members can amend" and the Court's ability to shift competences**:
     - **Verdict**: Genuine contradiction on the surface, but resolvable at a cost.
     - **Note**: The Court's expansive interpretations (e.g., implied powers, fundamental rights) effectively shift the boundaries of EU competences without formal amendment. The Court claims it is interpreting the Treaties, but the effect is equivalent to amendment. This is reconciled by the doctrine of the Treaties as a "living instrument" and the teleological interpretation (aiming at ever closer union). The cost is the erosion of the principle of conferral and state sovereignty: the states' unanimous agreement is bypassed by judicial interpretation.

  ### Step 4: Underdetermined Points
  - The theory of interpretation: Is the Court discovering the true meaning of the Treaties (which might be evolving) or creating new law? The practice is compatible with both.
  - The nature of the EU's legal authority: Is it based on the continuing consent of states (international law view) or an autonomous constitutional order (constitutional view)? The practice has elements of both.
  - The locus of sovereignty: Is it divided, pooled, or still firmly with the states? The practice allows multiple interpretations.

  ### Step 5: Bottom Line
  The EU's legal order is built on a foundational tension: it is formally an international organization created by states, but functionally a constitutional order that evolves beyond the states' direct control. The Court's creative interpretation bridges the gap between rigid formal amendment rules and the need for flexibility, but at the cost of coherence with the declaratory theory and state sovereignty. National constitutional courts' reserve powers act as a counterbalance, creating a pluralist system.

  ### Step 6: Thought Experiment (Question 4)
  If we swapped the presupposed view for one where the EU is a self-amending constitutional order authored by a single European demos, what would change?
  - **Formal Amendment**: Unanimity would be replaced by a democratic procedure (e.g., majority of the European Parliament and/or a referendum). The current unanimity requirement would become unintelligible because the demos as a whole would have constituent power, not the states.
  - **Court's Role**: The Court's expansive interpretations might be seen as legitimate exercises of constitutional adjudication, not as overreach. The declaratory theory could be dropped in favor of an openly creative role. However, the current practice of the Court denying creativity would become harder to justify.
  - **Exit Clause**: A unilateral exit by a state would be problematic because the union would be seen as indissoluble by a single part. The current exit clause would be inconsistent.
  - **National Constitutional Courts' Reserve**: They would have no legitimate role in reviewing EU acts because the EU constitution would be supreme and the demos sovereign. The current practice of reserve powers would become a rebellion against the constitutional order.

  ### JSON Structure
  We'll now create the JSON object as per the schema.

  Note: For `presuppositions`, we have to break down by the bullet points (elements) the user listed (1-6). We'll create one object per element.

  For `tensions`, we have two main tensions: (i) declaratory vs temporal limitation, (ii) amendment only by states vs Court shifting competences.

  For `underdetermined_points`, we list the key areas of underdetermination.

  Let's build the JSON.
