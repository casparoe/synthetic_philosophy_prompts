  ### Reconstructed Theory of Legal Authority and Constitutional Change

  The EU's legal architecture embodies a **pluralist constitutionalism** grounded in **treaty-based conferral with dynamic interpretation**. Its core presuppositions:

  1. **Authorship**: The Treaties were authored by *member states as sovereign entities* (not by a "European people" or peoples collectively). Ratification through domestic constitutional processes confirms states as the constituent power.

  2. **Legal Determinacy**: Treaty meaning is *objectively fixed at ratification* but possesses *latent purposive potential*. The Court claims to *declare* this inherent meaning, denying creativity. However, teleological interpretation (invoking "ever closer union") allows the Court to actualize dormant possibilities, creating a gap between formal stasis and functional evolution.

  3. **Amendment vs. Interpretation**: Formal amendment requires unanimous state consent, preserving sovereignty. But "interpretation" serves as a functional amendment substitute. The Court maintains an *epistemic monopoly* on meaning, insulating its authority from challenge while denying it creates new rules. National constitutional courts' reserve powers act as a dormant counterweight, creating mutual deterrence.

  4. **Enforcement Mechanism**: Direct effect and supremacy enable *decentralized enforcement* via national courts, bypassing state executives. This harnesses domestic judicial systems while minimizing reliance on central coercion.

  ---

  ### Presuppositions: Necessity vs. Compatibility

  | Claim | Needed for Element | Strength | Rules Out | Rivals That Also Fit | If Dropped What Changes |
  |-------|-------------------|----------|-----------|------------------------|--------------------------|
  | States are ultimate constituent power | Amendment rules (2), Exit clause (3) | Strictly required | Single European demos; EU as self-amending entity | – | Unanimity/exit clauses become illegitimate |
  | Treaties contain latent purposes | Court's teleology (4), Implied powers (4) | Best explanation | Originalism; Strict textualism | Living tree doctrine; Dworkinian integrity | Court loses justification for expansive rulings |
  | National courts accept CJEU supremacy | Direct effect (4) | Strictly required | Radical pluralism; Dualism | Constitutional pluralism (moderate) | Decentralized enforcement collapses |
  | States tolerate judicial gap-filling | Implied powers (4), Temporal limits (5) | Merely compatible | Formalist amendment-only change | Common law constitutionalism | Court self-restraint mechanisms (e.g., temporal limits) vanish |
  | Constitutional courts' reserve is symbolic | National challenges (6) | Best explanation | Hierarchical monism (EU or national) | Constitutional pluralism | Reserve power would be actively deployed |

  ---

  ### Tensions and Resolutions

  | Between | Verdict | Note |
  |---------|----------|------|
  | "Declaratory" rulings vs. Temporal limitations | Resolvable at a cost | **Cost**: Undermines declaratory fiction. Court admits rulings may disrupt legal certainty, implying *normative creation* not mere discovery. |
  | State-controlled amendment vs. Court-driven competence expansion | Resolvable at a cost | **Cost**: Erodes conferral principle. Court's teleology treats "ever closer union" as autonomous telos, functionally amending Treaties while denying doing so. |
  | CJEU supremacy vs. National constitutional supremacy | Surface only | Mutual non-activation creates equilibrium: CJEU avoids ultra vires crises; national courts avoid defying CJEU routinely. |

  ---

  ### Underdetermined Points
  - Whether purposive interpretation *discovers* or *constructs* meaning  
  - Whether constitutional courts' reserve power reflects enduring sovereignty or merely transitional anxiety  
  - Whether direct effect presupposes a European legal *community* or is merely a functional tool  
  - Whether "ever closer union" is an independent objective or subordinate to state interests  

  ---

  ### Bottom Line  
  The system presupposes *sovereign states as authors* but grants the CJEU *constitutive interpretation* powers, enabling evolution without formal amendment. This creates a stable but contested pluralism where claims of legal determinacy shield judicial creativity, national supremacy remains latent but unused, and all actors deny the gap between theory and practice. Replacing this with a self-amending European demos model would require abolishing unanimity, eliminating exit clauses, and subordinating national constitutions—rendering current pluralist safeguards unintelligible.

