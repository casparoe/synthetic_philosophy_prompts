prompt: |-
  I have spent most of my working life in an accredited calibration laboratory, and for the past year I have been reading philosophy of science in the evenings, which has made my day job look strange to me. Our uncertainty budgets are built to the Guide to the Expression of Uncertainty in Measurement (the GUM, currently JCGM 100:2008), and accreditation to ISO/IEC 17025 effectively requires it. The routine is this. Some error contributions we estimate by actually measuring repeatedly and taking a standard deviation of the mean; those are called Type A. But most contributions come from knowledge we did not generate ourselves: a certificate states that a gauge block's deviation from nominal is no worse than some half-width, a digital multimeter displays to a fixed number of digits, a bath is specified to hold within a stated band. For each of those, called Type B, we are told that in the absence of anything further we should treat the possible values as uniformly spread across the interval, take the half-width a, and divide by the square root of three, giving roughly 0.577a as a standard uncertainty. If we think values near the centre are more likely, we use a triangular shape instead and divide by the square root of six. We then combine everything in quadrature and multiply the result by a coverage factor of two, reporting that as approximately 95 percent coverage. Nobody in my lab has ever questioned the divisor; it is simply what the software does.

  Three things now bother me. First, the divisor is not invariant under how we choose to describe the quantity. A resistance known to lie within plus or minus half an ohm is uniform in resistance, but that same state of knowledge is decidedly not uniform in conductance, which is its reciprocal, nor in the logarithm of the resistance, and each of those parameterizations would hand us a different number after the same division. The rule seems to pick out the scale in which the bound happened to be written on the certificate, as though that scale were metaphysically privileged. Second, we are told the flat shape is licensed by knowing nothing beyond the bounds, yet the alternative triangular shape is licensed by a vague feeling that mid-interval values are commoner; if the shape can be changed by an unquantified hunch, what is the flat shape actually asserting about the world, or about us? Third, we take these knowledge-based numbers, which are not frequencies of anything, and add them in quadrature to genuine observed standard deviations, then multiply by two and make a coverage claim that is only roughly right if the combined distribution is close to normal, which it plainly is not when one large rectangular term dominates the budget.

  What I would like is a reconstruction of the implicit theory here, not a defence of the procedure. Which view of probability, and of what an uncertainty statement is about, does the Type B rule presuppose in order to make sense at all, and which rival views does it thereby rule out from day-to-day practice? Please be careful to separate what the rule strictly requires from what merely sits comfortably alongside it, and tell me where the practice is philosophically underdetermined, in the sense that several incompatible theories would each license exactly the same arithmetic. Does the parameterization worry I raised actually bite, or is it dissolved by the fact that our bounds are inherited from instruments that literally display values on one scale, so that the scale is not a free choice? Is there a genuine inconsistency between the epistemic Type B terms and the frequentist Type A terms and the coverage claim, or is the combination coherent under some single account I have not spotted? Finally, take each of two replacements in turn: a fully personalist Bayesian treatment in which every budget is just somebody's prior updated on data, and a strict frequentist treatment in which only long-run behaviour counts. For each, say concretely what would have to change in what a working lab does on a Tuesday morning, and what the lab would lose.
reasoning: |-
  Okay, let me approach this user's query methodically. The user has deep practical experience in calibration labs combined with recent philosophy of science reading, creating a fascinating tension. Their concerns cluster around three main issues: parameterization dependence in Type B uncertainties, the arbitrary nature of distribution selection, and the hybrid frequentist/epistemic nature of uncertainty budgets.

  First, I need to unpack why the divisor isn't parameterization-invariant. The key insight is that uniform distributions transform nonlinearly - a uniform resistance becomes non-uniform conductance. But in lab practice, bounds come from instruments displaying specific scales, making the parameterization practically fixed rather than metaphysically privileged. This dissolves the theoretical concern while acknowledging it's mathematically valid.

  For the distribution shape dilemma, I recognize that "knowing nothing" actually means maximum entropy for given constraints. Uniform is maxent for fixed bounds, triangular for fixed bounds and mean. The "hunch" about central values indicates additional unstated constraints. This reframes the choice as specification of what information is considered available.

  The hybrid approach problem is thorniest. Type A uses frequentist standard errors while Type B uses epistemic probabilities, yet they're combined as variances. The coverage claim relies on central limit theorem approximations. A pure Bayesian approach would treat all uncertainties as degrees of belief, but lose frequentist calibration guarantees. Meanwhile, strict frequentism couldn't handle non-repetitive uncertainties.

  Considering alternatives: Full Bayesianism would require complete probability models and priors for every component - impractical for routine work. Strict frequentism would discard Type B uncertainties or force physical replication. The current GUM framework succeeds precisely by being philosophically promiscuous - a "hack" that works through careful compromise.

  The user's unease stems from seeing behind the curtain of this pragmatic compromise. But in practice, the parameterization issue rarely bites because instruments fix scales, distribution choices follow standardized guidelines, and the CLT often saves the coverage claim. What would change under alternatives? Bayesian labs would debate priors instead of distributions, frequentist labs would neglect hard-to-quantify uncertainties. The loss would be standardization itself - the very thing making interlab comparisons possible.
answer: |-
  Your experience highlights profound tensions between measurement practice and philosophical foundations. Let's reconstruct the implicit theory of the GUM framework, address your concerns systematically, and evaluate alternatives:

  ### Implicit Philosophical Foundation
  The GUM adopts a **hybrid epistemic-frequentist probability interpretation**:
  - **Type A**: Frequentist (standard error as long-run dispersion)
  - **Type B**: Epistemic (probability as degree of belief based on available information)
  - **Combined uncertainty**: Treated as if it were a frequentist standard deviation
  - **Coverage intervals**: Invoke frequentist confidence (via k=2) but tolerate epistemic probability distributions

  This framework is **pragmatically Bayesian** without requiring full probabilistic modeling. It assumes:
  1. Probability can represent incomplete knowledge (Keynes/Jeffreys)
  2. Transformation invariance is *not* required for practical purposes
  3. The Central Limit Theorem (CLT) will rescue non-normality

  ### Addressing Your Concerns
  1. **Parameterization Dependence**:  
     - *Problem*: Uniform distribution in resistance (R) ≠ uniform in conductance (G=1/R).  
     - *GUM's Resolution*: The scale is fixed by the *physical instrument*. Your multimeter displays volts/ohms – not their reciprocals or logs. The "privileged" scale is operational, not metaphysical.  
     - *Biting Issue?*: Only if you need to transform variables *before* uncertainty propagation. In practice, budgets use instrument-native units, making this rare.

  2. **Distribution Selection**:  
     - **Uniform** (÷√3): Justified by *maximum entropy* for known bounds alone (Jaynes).  
     - **Triangular** (÷√6): Implies additional knowledge: "values taper linearly to bounds."  
     - *Philosophical Status*: Uniform is the *least informative* prior. Triangular introduces extra assumptions. The "hunch" is a heuristic for undisclosed information (e.g., manufacturing tolerances).  
     - *What Changes*: Switching distributions alters entropy assumptions, not "the world."

  3. **Hybrid Epistemic-Frequentist Mix**:  
     - *Core Tension*: Type B uncertainties are not sampling distributions; combining variances assumes they behave *as if* they were.  
     - *GUM's Coping Strategy*:  
       - Treat all uncertainties as variances (even when epistemic)  
       - Rely on CLT to normalize the sum  
       - Use k=2 for "approximately 95%" coverage  
     - *When It Fails*: Dominant rectangular distributions (k=2 gives ~58% coverage, not 95%). Labs mitigate this by:  
       - Using k>2 for dominant Type B terms  
       - Switching to Monte Carlo methods (GUM Supplement 1)  

  ### Philosophical Underdetermination
  The *same arithmetic* is compatible with:
  - **Objective Bayesianism**: Uncertainty as rational degree of belief (with uniform/triangular as reference priors)
  - **Frequentist Instrumentalism**: Variance combination as a useful heuristic without ontological commitment
  - **Pragmatism**: A "toolbox" approach that works empirically

  ### Alternatives: Concrete Changes & Trade-offs
  | **Approach**       | **Changes on a Tuesday Morning**                          | **What the Lab Loses**                          |
  |--------------------|----------------------------------------------------------|------------------------------------------------|
  | **Full Bayesian**  | - Every uncertainty budget requires a justified prior<br>- All distributions updated via Bayes' theorem<br>- Coverage intervals become credible intervals | - Speed/standardization<br>- Regulatory acceptance<br>- Avoids debates over priors |
  | **Strict Frequentist** | - Type B uncertainties discarded unless statistically verified<br>- All uncertainties require empirical sampling<br>- Coverage must be strictly verifiable | - Ability to quantify non-repeatable errors<br>- Use of manufacturer data<br>- Practicality for complex systems |

  ### Why GUM Persists Despite Tensions
  1. **Operational Stability**: Instruments define scales, neutralizing transformation issues.  
  2. **Regulatory Harmony**: ISO 17025 accreditation relies on standardized methods.  
  3. **Empirical Success**: For well-conditioned systems (multiple comparable uncertainty sources), k=2 *does* yield ~95% coverage.  
  4. **Pragmatic Epistemology**: It distinguishes *knowledge sources* (Type A/B) while merging their *mathematical treatment*.  

  ### Conclusion
  Your unease stems from the GUM's **deliberate philosophical promiscuity**. It is a *consensus document* prioritizing interoperability over metaphysical coherence. The "inconsistency" between epistemic Type B and frequentist Type A is real but managed:  
  - **Parameterization**: Fixed by instrument practice  
  - **Distribution shapes**: Represent information content, not reality  
  - **Hybrid combination**: A successful heuristic justified by CLT in most cases  

  To change this would require rebuilding metrology on a monolithic foundation (Bayesian or frequentist) – sacrificing the flexibility that makes accredited labs function daily. The GUM is less a theory of measurement than a *diplomatic treaty* between warring probabilistic philosophies.
