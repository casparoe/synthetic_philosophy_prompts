  Here’s a concise, actionable draft for your subcommittee. It addresses archival findings, community meaning, and concrete recommendations while leaving room for debate:

  ---

  **MEMORANDUM**  
  To: Interpretive-Markers Subcommittee  
  From: [Your Name]  
  Date: [Current Date]  
  Subject: Recommendations for Ada Kessler Statue Rededication & Historical Narrative  

  ### I. The Evidentiary Dilemma  
  Our archivist’s findings require acknowledgment:  
  - **1874 ledger**: Records a $4 payment to "E. Kessler" (likely Emmet) for hauling freight—not a medical mission.  
  - **Board of Health records**: Place the diphtheria outbreak in **1875**, with no mention of a rider.  
  - **Doctor’s letter (1875)**: Notes being "fetched by a hired teamster"—unnamed, no heroism described.  
  - **1988 oral history**: Ada’s granddaughter’s account mirrors a **1909 fictionalized pageant script** verbatim (horse’s name, 31 miles). This suggests family memory was shaped by the legend, not primary experience.  

  **Conclusion**: No document corroborates Ada’s ride as fact. The story likely evolved from fragments (Emmet’s haul, an unknown teamster) into a unifying myth by the early 1900s.  

  ### II. The Case for Documentary Primacy (Best Version)  
  *"History’s duty is to evidence, not sentiment. When documents fail to support a story—and family testimony is demonstrably influenced by later fiction—calling it ‘history’ misleads. A statue in the square with an uncorrected panel elevates legend to truth. If we value this town’s real past, we must distinguish what happened from what inspires. Granting a 151st year to an unverified tale betrays our purpose."*  

  ### III. Why This Claim Falters Here  
  The documentary record is **ambiguous**, not definitive:  
  - It doesn’t *disprove* Ada’s involvement (e.g., Emmet could have accompanied her; the "teamster" could be misdescribed).  
  - Absence in health records doesn’t equal absence in fact.  
  We have **three vague documents and a contaminated oral account**—not a clear refutation. "Overwriting" memory requires proof we lack.  

  ### IV. Recommendations: Accuracy and Respect  
  1. **Marker Text**:  
     - **Remove**: Claims of Ada’s solo ride, the 31-mile blizzard, or "saving the town."  
     - **State**: *"In the harsh winter of 1874–75, diphtheria struck [Town]. Though records show no details, oral tradition holds that local teacher Ada Kessler braved storms to summon help. By 1909, her story symbolized the community’s resilience. This statue, erected in 1922, honors that enduring spirit."*  
     *Why*: Separates verifiable facts (diphtheria, the statue’s purpose) from unverified tradition. Honors the story’s cultural role without enshrining myth as history.  

  2. **Statue Location**:  
     - **Keep it in the square** with the revised marker. Its value as a community symbol outweighs evidentiary gaps. Relocating it implies shame, not nuance.  

  3. **Ada’s Ride 10k & School Programs**:  
     - **Continue both** as celebrations of community heritage, not historical reenactments.  
     - **Add context**: Race materials/school handouts should note: *"This event commemorates a beloved local legend dating back over a century."*  

  4. **Timeline**:  
     - **Revise marker by rededication (14 months)**. State grant approval depends on архивная точность. Delaying revisions risks funding and credibility.  
     - **Post-bicentennial**: Form a community group (historians, residents, Kessler descendants) to research further. If new evidence emerges, revisit the text.  

  ### V. Why Not Delay or Keep the Current Panel?  
  - **State grants**: Our grant officer’s warning is explicit—funding requires архивная поддержка. The current panel’s claims lack it.  
  - **Post-bicentennial delay** is surrender. We’d endorse fiction at the dedication, then quietly correct it—breeding distrust.  
  - **Tradition deserves honesty**. This town survived a mill closing by finding strength in stories. It can handle this nuance.  

  **In short**: We revise the marker to reflect what documents *do* and *do not* say; keep the statue; reframe events as tributes to heritage; and meet our deadline. This honors both history and the town’s heart.  

  ---  

  ### Key Arguments for Your Debate  
  - **For the hardware-store owner**:  
    *"This keeps Ada’s story alive and the statue where it belongs—but it’s fair. Tourists won’t question a town that’s upfront about its legends."*  
  - **For your friend**:  
    *"The marker no longer states the ride as fact. It shows how the story emerged and why it matters—exactly as documents allow. Memory isn’t evidence, but we’ve contained its contamination."*  
  - **For the "table it" faction**:  
    *"Delay forces us to mislead at the bicentennial. This is a compromise: we keep the icon but tell the fuller truth by the deadline."*  

  This draft forces the question: Do we serve nostalgia or integrity? It leans toward integrity while preserving space for tradition. Hand it out and let the hardware-store guy fight for Ada’s honor—your friend already has the receipts.
