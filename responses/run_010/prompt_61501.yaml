prompt: |-
  I run the patient, family and community advisory program at a mid-size health system — basically every time someone wants to stand up a new engagement body (a chronic pain council, a youth board, a group of former inpatients advising on a ward redesign) it lands on my desk as a draft charter, and we do about 15-20 a year. My staff are nurses, social workers and admin people, nobody has read any philosophy, and I have roughly an afternoon per proposal before it goes up to the governance committee with a recommendation of proceed / proceed with conditions / send it back for redesign.

  Someone at a conference pointed me at Hegel's lordship-and-bondage material and the recognition arguments built on it, and said that was the right lens for what I'm actually doing: working out whether a body like this is a place where two sides genuinely recognize each other as independent agents, or a structure where one side is harvesting validation from people it doesn't treat as independent at all. I want you to build me the procedure that lens implies — not an essay about Hegel, a thing a coordinator can run off a two-page worksheet.

  So: the questions to ask of a draft charter, in order; what counts as a sufficient answer to each; which answers force a send-back; which force conditions attached; and where the procedure has to stop and hand the call to me because it's a question of values rather than of what the document says. Also tell me which parts of the theory you had to drop to make it usable, and which distinctions absolutely cannot go without the whole thing collapsing into a generic participation checklist — I've seen the generic version and I can smell it.

  Concretely, I've been told three claims are load-bearing here and I can't tell whether they are: that recognition coming from someone you don't yourself recognize as an independent other can't actually confirm anything for you; that the dependent party is the one who develops a stable sense of themselves through the work of shaping things while the dominant party stagnates; and that the dominant party's independence is really held up by the dependent party's activity, so the dependence runs the opposite way to how it looks. Say which of those can be turned into an observable test on a charter or terms of reference, which can't, and what you do with the ones that can't.

  Then run the procedure on three cases:

  1. A chronic pain council. Members review service redesign proposals, there's a ring-fenced budget they control, the service has to respond in writing within 30 days — but the system appoints every member, a senior executive chairs, and terms are one year, renewable at the chair's discretion.
  2. A tenant board on a housing site we partner with. It sets its own agenda, spends a devolved fund with no approval needed, publishes its own minutes and its own dissents — and nothing obliges anybody to answer it.
  3. Our flagship lived-experience co-design group, which I will defend to the death. Paid members, trained, co-authors on the papers that come out, and their testimony genuinely changed a funding policy. But the members are people currently in treatment with us, and the program manager reviews who stays on each cycle.

  I want the honest verdict on 3 even if its embarassing, and I want at least one case where the procedure comes back "the asymmetry is real and this is still the best thing available," because a diagnosis is not automatically an instruction to tear the body down and my committee will read it as if it is. Finish with what the procedure can't do: the failure modes I should expect, and the ways a determined sponsor could pass every question on the worksheet while gutting the thing anyway.
reasoning: |-
  We are building a practical procedure based on Hegel's lordship and bondage (master-slave dialectic) for evaluating advisory bodies. The core idea is to assess whether the structure allows for mutual recognition between the institution and the participants as independent agents, or if it's a form of one-sided validation without true reciprocity.

  Key Hegelian concepts we are considering:
  1. Recognition must be mutual to be genuine. If one party does not recognize the other as independent, then the recognition offered by the dependent party cannot confirm the independent self-consciousness of the dominant party.
  2. The dependent party (the bondsman) develops a stable sense of self through their work and engagement with the world, while the dominant party (the lord) may stagnate because they are not engaging in the same transformative work.
  3. The dominant party's independence is actually dependent on the activity of the bondsman. Thus, the dependence runs both ways, but the lord fails to recognize this.

  We must turn these into observable tests on a charter. However, note that some aspects are about the actual practice and cannot be fully captured in a document. We design the procedure to flag potential issues based on the charter, and then note where human judgment (by you) is required.

  The Procedure: A Two-Page Worksheet

  Step 1: Identify the Parties
     - Question: Who are the two parties in the advisory body? (Typically, the health system and the community/patient representatives)
     - Sufficient answer: Clear identification of both the institutional side and the community/patient side. If not clear, send back.

  Step 2: Mutual Recognition of Independence
     - Question 2.1: Does the charter explicitly state that both parties are independent agents with their own perspectives and agency?
       - Sufficient: Explicit language acknowledging the independence and agency of both the institution and the community members. If absent, condition: must add such language.
     - Question 2.2: Does the charter allow for the community members to act without being coerced by the institution? (e.g., freedom to dissent, set own agenda, etc.)
       - Sufficient: Evidence of mechanisms for independent action (e.g., ability to set agenda, control over budget, publish own minutes). If absent, condition: must add at least two mechanisms that enable independent action by the community members.
     - Question 2.3: Does the charter require the institution to respond to the advisory body in a substantive way? (i.e., is the institution obligated to engage with the output of the body?)
       - Sufficient: Clear process for institutional response (e.g., written response within a timeframe, requirement to consider recommendations). If absent, condition: must add a response mechanism.

  Step 3: Development of Self-Consciousness through Work (for the dependent party)
     - Question 3.1: Does the charter give the community members meaningful work that can shape outcomes? (e.g., decision-making power, co-design, control over resources)
       - Sufficient: Specific powers granted (e.g., control over a budget, co-authorship, veto power on certain decisions). If the work is merely consultative without any power, send back for redesign.
     - Question 3.2: Are the community members protected from being mere tokens? (e.g., are they provided with training, resources, and support to effectively contribute?)
       - Sufficient: Provisions for training, adequate compensation, and resources. If absent, condition: must add support provisions.

  Step 4: Asymmetry and Hidden Dependence
     - Question 4.1: Does the charter acknowledge the institution's dependence on the community members for legitimacy or insight?
       - This is often implicit. We cannot force explicit language, but if the charter is entirely one-sided (only what the community can do for the institution) without reciprocity, condition: must add language about mutual benefit and the value the institution gains from the relationship.
     - Question 4.2: Are there terms that allow the institution to unilaterally dismiss members or dissolve the body without cause? (This reflects the hidden dependence: the institution tries to maintain control because it fears its dependence.)
       - Sufficient: Clear and fair process for member removal (e.g., by peers, for cause, fixed terms with renewal by mutual agreement). If the institution has unilateral removal power, condition: must change to a fair process.

  Step 5: Mutual Transformation
     - Question 5.1: Does the charter allow for the possibility that the institution might change its practices based on the advisory body's input?
       - Sufficient: Explicit mechanisms for institutional change (e.g., requirement to consider recommendations, a process for implementation). If absent, condition: must add.
     - Question 5.2: Does the charter allow for the community members to grow and change through their participation? (e.g., training, skill development, opportunities for advancement)
       - Sufficient: Provisions for member development (training, opportunities for leadership roles, etc.). If absent, condition: must consider adding.

  Where the procedure stops and requires your judgment (values call):
     - If the charter passes all the above with conditions met, but in practice the institution might still dominate (e.g., subtle coercion, tokenism). This requires your experience to assess.
     - When the charter is ambiguous, and the actual practice could go either way.
     - When there is a trade-off between feasibility (e.g., in a high-risk setting) and ideal mutual recognition.

  What we dropped from the theory:
     - The deep philosophical idea that the lord's independence is an illusion maintained by the bondsman's work. We can only test for symptoms (like unilateral control) but not the underlying consciousness.
     - The idea that the bondsman's self-consciousness develops through work: we test for meaningful work and development opportunities, but we cannot measure the internal development.

  Which distinctions are critical to avoid a generic checklist?
     - The focus on mutual recognition (not just participation) and the requirement for independent agency of the community members. Generic checklists might stop at "are they included?" but we require "are they independent and can they act?"
     - The emphasis on the institution's obligation to respond and change, not just listen.
     - The requirement for reciprocity in the relationship, not just one-way advice.

  Now, applying the procedure to the three cases:

  Case 1: Chronic Pain Council
  - Step 1: Parties clear (system and patients).
  - Step 2.1: No explicit recognition of independence. Condition: add language.
  - Step 2.2: Independent action? They review proposals and have a budget, but the system appoints every member, and the chair is an executive. This limits independence. Condition: must have some member selection by peers or community, and co-chairing by a member.
  - Step 2.3: They require a response in 30 days. Sufficient.
  - Step 3.1: They have a ring-fenced budget and review service redesign — meaningful work. Sufficient.
  - Step 3.2: Not mentioned. Condition: add support provisions (training, etc.).
  - Step 4.1: No acknowledgment of dependence. Condition: add mutual benefit language.
  - Step 4.2: Terms renewable at chair's discretion (unilateral). Condition: change to fixed terms with renewal by mutual agreement or peer review.
  - Step 5.1: They review redesigns and get a response, so possibility of change. Sufficient.
  - Step 5.2: Not mentioned. Condition: consider adding development opportunities.

  Verdict: Proceed with conditions (multiple). Without conditions, it risks being a one-sided validation exercise.

  Case 2: Tenant Board
  - Step 1: Parties clear (health system partner and tenants).
  - Step 2.1: Probably not explicit. Condition: add language about mutual recognition.
  - Step 2.2: They set agenda, spend money, publish minutes — strong independence. Sufficient.
  - Step 2.3: No obligation for anyone to answer. This fails. Condition: must add a response mechanism from the partner (health system) and the housing site.
  - Step 3.1: They have a devolved fund and set their own agenda — meaningful. Sufficient.
  - Step 3.2: Not mentioned. Condition: add support if needed (but they are independent, so might be okay? Condition: assess if they need resources to function).
  - Step 4.1: Unclear. Condition: add mutual benefit language.
  - Step 4.2: No mention of dissolution or removal. We assume they are self-governing. Sufficient.
  - Step 5.1: Without a response mechanism, change is unlikely. Condition: add response mechanism.
  - Step 5.2: Not mentioned. Condition: consider development.

  Verdict: Proceed with conditions (especially adding response obligation). Without it, the institution can ignore them, making the recognition one-sided (tenants recognize the institution by engaging, but the institution doesn't recognize them by responding).

  Case 3: Lived-Experience Co-Design Group
  - Step 1: Clear.
  - Step 2.1: Probably implicit in co-design. But condition: make explicit in charter.
  - Step 2.2: They are co-authors and their testimony changed policy — independent action. But note: the program manager reviews membership. This is a red flag for independence. Condition: change membership review to a peer or independent process.
  - Step 2.3: They changed policy — so there is impact. Sufficient.
  - Step 3.1: Co-authors and changed policy — meaningful. Sufficient.
  - Step 3.2: Paid and trained — sufficient.
  - Step 4.1: Implicit in co-design. Condition: make explicit.
  - Step 4.2: Program manager reviews membership — unilateral control. Condition: must change to a fair process (e.g., peer review, fixed terms with automatic renewal unless cause).
  - Step 5.1: They changed policy — sufficient.
  - Step 5.2: Trained and paid — sufficient.

  Verdict: Proceed with conditions (especially on membership review and making mutual recognition explicit). You noted you would defend it to the death, so note that the procedure flags the membership review as a risk to mutual recognition. However, the condition can fix this. Without that fix, the institution holds power over membership, which undermines independence.

  One case where the asymmetry is real and still the best: Case 1 without conditions might be the best available if, for example, the condition of peer selection is not feasible (e.g., due to a very specialized patient population). But the procedure would still require conditions to mitigate. Alternatively, consider a high-risk setting (e.g., advising on mental health crisis services) where the institution feels it must retain more control for safety. Then, the conditions would include extra safeguards for member support and independent advocacy, but the asymmetry might be necessary. The procedure would then have conditions that are negotiated to be as mutual as possible, and you would note that it's the best available.

  What the procedure can't do:
  - It can't prevent tokenism in practice. Even if the charter is perfect, the culture might not change.
  - It can't measure the internal development of self-consciousness (only the opportunities for it).
  - A determined sponsor can pass by writing a perfect charter and then ignore it in practice. The procedure is only a first gate.
  - It can't resolve deep power imbalances in the broader context (e.g., systemic inequities) that affect the advisory body.

  Failure modes:
  - Over-reliance on the document: a good charter doesn't guarantee good practice.
  - Underestimation of the need for ongoing monitoring: the body should be reviewed periodically.
  - Sponsors might game the system by adding language without changing substance.

  Thus, the procedure is a necessary but not sufficient step. It must be paired with your oversight and periodic reviews of the actual functioning of the body.
answer: |-
  Below is a practical, two-page worksheet procedure for evaluating advisory body charters through the lens of Hegelian recognition. It distills the lordship-bondage dynamic into observable tests, flags critical asymmetries, and specifies when human judgment is required. The framework focuses on **mutual recognition** (whether both parties acknowledge each other as independent agents) and **hidden dependence** (whether the institution relies on the community for legitimacy while masking its control).

  ---

  ### **Hegelian Recognition Evaluation Worksheet**  
  *For Patient/Community Advisory Body Charters*

  **Core Principles Turned into Tests**:  
  1. **Mutual recognition** (both parties must see each other as independent agents) → *Tested via structural reciprocity*.  
  2. **Dependent party's growth** (the "bondsman" develops self through work) → *Tested via member agency and impact*.  
  3. **Institution's hidden dependence** (the "lord" relies on the bondsman's labor) → *Tested via unilateral control clauses*.  

  **Key Distinctions vs. Generic Checklists**:  
  - ❌ Generic checklists ask: *"Is the community included?"*  
  - ✅ **This procedure asks**: *"Can both parties act independently, and does the institution openly rely on them?"*  
  - **Non-negotiable distinctions**:  
    - If mutual recognition is absent → Structure is extractive (harvesting validation).  
    - If the institution has unilateral control → Dependence runs one-way (hidden asymmetry).  
    - If members lack agency → No "work" for self-development (stagnation).  

  ---

  #### **PROCEDURE: Questions to Ask (In Order)**  
  **Ask each question; score "Yes/Partial/No"; use thresholds below.**  

  | # | Question                                                                 | Sufficient Answer                                  | If "No" or "Partial"                                                                 |  
  |---|--------------------------------------------------------------------------|----------------------------------------------------|--------------------------------------------------------------------------------------|  
  | 1 | **Independence**: Does the charter explicitly name the community/institution as **equal partners** with distinct authority? | "Yes": Clear language (e.g., "partners," "co-creators," "shared authority"). | **Send-back**: Vague terms like "advisors" or "consultants" without equality.         |  
  | 2 | **Member agency**: Can members **initiate actions** without institutional approval? (e.g., set agendas, control funds, publish statements). | "Yes": ≥2 mechanisms (e.g., self-set agendas, autonomous budgets). | **Condition**: Require 1–2 agency mechanisms (e.g., add member-controlled minuting). |  
  | 3 | **Institutional response**: Is the institution **obligated to respond** to members' input? (e.g., written replies, policy changes). | "Yes": Binding process (e.g., "must respond in 30 days"). | **Send-back**: No obligation (e.g., "input may be considered").                     |  
  | 4 | **Member selection**: Who controls membership? (Ideal: **peer-led or joint** selection/renewal.) | "Yes": Members or joint committee choose/renew.    | **Condition**: If unilateral (institution-only), require third-party mediator or peer input. |  
  | 5 | **Impactful work**: Do members **shape outcomes** (not just advise)? (e.g., co-design, control funds, veto power). | "Yes": Direct control (e.g., "co-approve designs," "allocate funds"). | **Send-back**: Advisory-only (e.g., "feedback will be noted").                      |  
  | 6 | **Hidden dependence**: Does the charter **acknowledge institutional reliance** on members? (e.g., "we learn from," "their expertise guides us"). | "Yes": Explicit reciprocity (e.g., "mutual learning"). | **Condition**: Add language admitting dependence (e.g., "system depends on lived experience"). |  
  | 7 | **Growth support**: Are members **supported to develop**? (e.g., training, compensation, skill-building). | "Yes": Paid roles, training, or leadership paths. | **Condition**: Add support (e.g., stipends, training).                              |  

  ---

  #### **Thresholds for Recommendations**  
  - **Proceed**: All questions ≥ "Partial" + Q3, Q5 = "Yes" (binding response + impactful work).  
  - **Proceed with conditions**: 1–3 "No"/"Partial" (fixable via charter edits).  
  - **Send-back**: Q1, Q3, or Q5 = "No" (fatal flaws: no equality, no response, no impact).  
  - **Escalate to Program Lead** (you) if:  
    - Values conflict (e.g., safety vs. autonomy in high-risk settings).  
    - Contextual asymmetry (e.g., unavoidable power imbalance in acute care).  
    - "Hidden dependence" (Q6) is unacknowledged but politically sensitive.  

  ---

  #### **Theory Adjustments for Usability**  
  - **Dropped**:  
    - *Philosophical nuance*: "Recognition from an unrecognized other can't confirm self." → **Applied as**: Test for mutual titles (Q1) and reciprocity (Q6).  
    - *Abstract stagnation*: "Lord stagnates; bondsman grows through work." → **Applied as**: Test for member growth (Q7) and impact (Q5).  
    - *Deep dependence*: "Lord's independence relies on bondsman." → **Applied as**: Test for institutional reliance (Q6) and unilateral control (Q4).  
  - **Critical distinctions kept**:  
    - Without **mutual titles** (Q1) → No recognition.  
    - Without **binding response** (Q3) → Extraction, not partnership.  
    - Without **impactful work** (Q5) → No "labor" for self-development.  

  ---

  #### **Case Evaluations**  
  **Case 1: Chronic Pain Council**  
  - Q1 (Independence): **No** → "Appointed by system," executive chair.  
  - Q2 (Agency): **Partial** → Budget control ✅, but agenda? ❌.  
  - Q3 (Response): **Yes** → 30-day response.  
  - Q4 (Selection): **No** → Chair unilaterally renews.  
  - Q5 (Impact): **Yes** → Review + budget.  
  - Q6 (Dependence): **No** → No reciprocity language.  
  - Q7 (Growth): **No** → No support mentioned.  
  **Verdict**: **Send-back** (fatal: Q1, Q4, Q6). *Asymmetry*: Members lack independence; institution harvests validation.  

  **Case 2: Tenant Board**  
  - Q1: **Partial** → "Sets own agenda" implies independence.  
  - Q2: **Yes** → Sets agenda, spends funds, publishes.  
  - Q3: **No** → No obligation to respond.  
  - Q4: **Yes** → Self-governed.  
  - Q5: **Yes** → Controls fund/agenda.  
  - Q6: **No** → No acknowledgment of reliance.  
  - Q7: **Partial** → No support mentioned.  
  **Verdict**: **Conditional** → Add response obligation (Q3) and mutual reliance (Q6). *Asymmetry*: Institution can ignore tenants → No recognition.  

  **Case 3: Lived-Experience Co-Design Group**  
  - Q1: **Partial** → "Co-authors" imply equality; lacks explicit parity.  
  - Q2: **Yes** → Co-authorship, testimony impact.  
  - Q3: **Yes** → Policy changed ✅.  
  - Q4: **No** → Program manager unilaterally reviews membership.  
  - Q5: **Yes** → Changed policy.  
  - Q6: **Yes** → Implicit in impact.  
  - Q7: **Yes** → Paid, trained.  
  **Verdict**: **Conditional** → Fix Q4 (joint membership review) and clarify Q1 (add "equal partners"). *Asymmetry*: Membership control undermines recognition → **But** high impact justifies proceeding *with fixes*.  

  ---

  #### **What the Procedure Can't Do**  
  - **Failure Modes**:  
    - **Tokenism**: Charters pass, but culture ignores input (e.g., "We listened, but overruled").  
    - **Co-option**: Members become "insiders," lose independence (e.g., praising system to keep roles).  
    - **Bureaucratic evasion**: Sponsors add vague language (e.g., "may respond") to pass Q3.  
  - **Gaming the System**:  
    - A sponsor could:  
      1. Grant autonomy (Q2) but withhold resources (Q7 → burnout).  
      2. Acknowledge dependence (Q6) but retain veto power (Q5 → no real impact).  
    - **Mitigation**: Spot-check minutes for unilateral overrides; track input implementation.  
  - **Limits**:  
    - **Values judgments**: E.g., clinical safety vs. autonomy → Escalate to you.  
    - **Contextual asymmetry**: Some bodies (e.g., advising on emergencies) need controls → Flag for your review.  
    - **Long-term dynamics**: Procedure can't predict stagnation; require annual reviews.  

  **Final Note**: Asymmetry ≠ bad faith. Case 3 shows impact *despite* flaws; the procedure flags risks but allows for "best available" structures. Use it to negotiate power-sharing, not veto progress.
