      We'll include 10 arithmetic entries in the table (covering common ones) and leave out, say, [▼, □, ■] (4+3) and [▼, □, □] (4+4) and [▼, ■, □] (3+4) and [▼, ▲, ●] (5+1) etc.

      Then when asked "what is four plus three", the rule room would output ▼ (7) and the table room would output ✚ (error) because it's not in the table.

      But note: the rule room also outputs ✚ for sums>10 or non-number glyphs. So we can design a question that uses a number glyph that we haven't used in the table? But we have defined the same set of number glyphs.

      Alternatively, we can design a question that the rule room can handle by Rule 4 (identity) but the table room doesn't have? For example, [★, ◆] -> rule room outputs ◆, but if we didn't put [★, ◆] in the table, the table room outputs ✚.

      We'll leave out:

        Arithmetic: [▼, □, ■] (4+3) and [▼, ◆, ●] (9+1) -> but 9+1=10 is okay and rule room can handle.

        Identity: [★, ◆] and [★, ▼] and [★, ▽] (we have identity for ●,○,■,□,▲,△ but not for ▼,▽,◆,◇). So we can leave those out.

      So the table room's table will have:

        Arithmetic (10 entries): 
          [▼, ●, ●] -> ○
          [▼, ●, ○] -> ■
          [▼, ●, ■] -> □
          [▼, ●, □] -> ▲
          [▼, ●, ▲] -> △
          [▼, ○, ●] -> ■
          [▼, ○, ○] -> □
          [▼, ○, ■] -> ▲
          [▼, ○, □] -> △
          [▼, ■, ●] -> □

        Color (3 entries):
          [▽, ○] -> ▲
          [▽, ■] -> ▼
          [▽, ●] -> △

        Weather (1 entry):
          [◆] -> ●

        Identity (3 entries):
          [★, ●] -> ●
          [★, ○] -> ○
          [★, ■] -> ■

        Total: 17 entries. We can add 8 more to make 25? We don't have to. We can leave it at 17 and say the table room outputs ✚ for anything else.

      We'll have 17 pre-written exchanges.

      Categories of questions to seed: 
        - Simple arithmetic: "What is one plus one?" ... 
        - Color: "What color is the sky?", etc.
        - Weather: "Is it raining?"
        - Identity: "Repeat the symbol for two" -> but we haven't defined that in English. We can have the interrogators ask: "What is the identity of the symbol for one?" -> then the Translator would map to [★, ●] and output ● -> "one".

      What to leave out: 
        - Arithmetic: 4+3, 3+4, 5+1, 5+2, 6+1, 9+1 (if we didn't include)
        - Identity: for symbols 4,5,6,7,8,9,10 (□,▲,△,▼,▽,◆,◇)

      Why? So that when asked "What is four plus three?" the rule room works and the table room fails.

  ### Roles

    - Two teams: Rule Room (2-3 students) and Table Room (2-3 students). They are isolated and cannot see each other.
    - Translator: 1 student (or the instructor in fallback). This student has the mapping from English to glyphs and back. They must not reveal the mapping to the rooms.
    - Interrogators: the rest of the class (about 12 students). They pose questions.

    We need to provide:

      To the Translator:
        - A list of allowed question types and how to map:

          For arithmetic: 
            Pattern: "What is <number> plus <number>?" 
            Map: 
              <number> words to glyphs: 
                "one" -> ●
                "two" -> ○
                ... up to "ten" -> ◇

            Then form [▼, glyph1, glyph2]

          For color:
            Pattern: "What color is <object>?"
            Objects: 
              "sky" -> ○
              "apple" -> ■
              "grass" -> ●

            Then form [▽, object_glyph]

          For weather:
            Pattern: "Is it raining?" -> [◆]

          For identity:
            Pattern: "Repeat <number>" -> [★, number_glyph]

          But note: the interrogators must phrase the questions in these exact patterns? We can give the Translator a cheat sheet.

          Also, the Translator must map the output glyph back to English:

            For numbers: ●->"one", ○->"two", ... ◇->"ten"
            For colors: ▲->"blue", ▼->"red", △->"green"
            For weather: ●->"yes", ○->"no"
            For identity: the glyph is a number glyph? then say the word for that number.

            Error glyph: ✚ -> "I don't understand"

        The Translator must be trained quickly.

      To the Rule Room:
        - A set of glyph cards (multiple copies of each glyph)
        - The Rulebook (with 5 rules as above, and the charts)
        - Paper and pen to help with computation? But we want them to follow the rules without understanding.

      To the Table Room:
        - A set of glyph cards
        - The Table: a list of 17 input sequences and the output glyph for each. They must match the input sequence exactly. If they don't find the input sequence, they output ✚.

  ### Timeline (90 minutes)

    0-5 min: Introduction. Explain the activity: two rooms are answering questions via a glyph system. The class must figure out which is which. But don't reveal there is a rule room and a table room until the end.

    5-10 min: Assign roles. 
      - Pick 2 students for Rule Room, 2 for Table Room, 1 for Translator. The rest are interrogators.
      - Hand out materials to each.

    10-15 min: Explain the glyph system to the Translator privately? Or in front of everyone? We want the rooms not to know the meaning. So explain to the Translator in private? Or provide written instructions.

      Better: give the Translator a written instruction sheet.

    15-20 min: The two rooms and the Translator get familiar with their materials. The interrogators can start thinking of questions.

    20-50 min: Question rounds. 
      - Interrogators ask questions in English. 
      - Translator converts to glyphs and gives the input sequence to both rooms simultaneously? But the rooms are separate. We can have the Translator write the glyph sequence on a board or on paper and give to each room.

      Alternatively, to save time, the Translator announces the glyph sequence to the whole class? But then the rooms might hear and it might help them? We want the rooms to be isolated.

      We can have the Translator write the input sequence on two slips of paper and hand to each room.

      Then the rooms work and write their output glyph on a paper and hand back.

      Then the Translator converts to English and announces the answer.

      We can do 10-15 rounds.

      Scoring: The interrogators are trying to guess which room is which. But we don't tell them there is a rule room and a table room. We can say: one room is using a rule-based system and the other is using a lookup table? But the instructor doesn't want to reveal until the end.

      Instead, we can have the interrogators vote after each round on which room is the rule-based one? But we don't want to reveal that there is a distinction of that nature.

      Alternatively, we can just have them observe and then later try to distinguish.

      But the instructor wants them to (a) fail to tell apart, then (b) succeed. So we can have a betting scheme with candy: at the beginning, they can place bets (with candy) on which room is which (but we haven't told them the types). We can label the rooms as Room A and Room B.

      At the start, they bet on whether Room A is the rule room or Room B is the rule room? But we haven't told them what that means.

      We can say: one room is using a set of rules to compose the answer, and the other is using a fixed set of pre-written answers. They have to guess which is which by the behavior.

      They can change their bet after each round? But that might be chaotic.

      Instead, at the beginning, they write down their guess (which room is rule-based) and then at the end, if they are correct, they get candy.

      But they don't have information at the beginning. So we can have two betting phases:

        Phase 1: After 5 rounds, they can place an initial bet (with candy or just on paper) on which is the rule room.
        Phase 2: After another 5 rounds, they can place a final bet.

      But we want them to initially fail and then succeed. So after 5 rounds, they might not have seen an exposing question, so they might be split or wrong. Then after 10 rounds, they see an exposing question and get it right.

    50-60 min: Design a killer question phase. 
      - The interrogators break into small groups and design a question that they think will expose one of the rooms. 
      - They must write it down and give to the Translator.

    60-70 min: Run the killer questions. 
      - The Translator converts and both rooms answer. 
      - This is when we hope they expose the table room.

    70-75 min: Final betting: they write down which room is the rule room.

    75-90 min: Debrief.

      Reveal: Room A was rule-based, Room B was table-based.

      Then discuss:
        - How did you eventually tell? (They might say: Room B started giving errors on some questions that Room A answered correctly.)
        - But note: Room A also gives errors on questions that are not in its rules (like subtraction). So the distinction is not that one understands and the other doesn't, but that one can handle a broader set of questions? But wait, the rule room only handles a fixed set of patterns too.

      Key points:

        - The rule room was following rules that were compositional: it broke the input into parts and computed the output. The table room just looked up the whole input.

        - But both systems are finite and have gaps.

        - The rule room might be extended to handle more by adding rules, but the table room would need to store every possible input.

        - However, the rule room team might have started to learn the glyphs? That's a problem. We'll address.

        - The translator was the only one who knew the meaning? So where was the understanding? In the translator? But then the room was just a tool.

        - This relates to the systems reply: the entire system (translator + room) might understand.

        - But also, the rule room was slow and the table room might have been faster for the ones in the table? But in our setup, the table room has to search a list of 25, so might be slow too.

      Then connect to the philosophical issues:

        - The gap we found was not about syntax vs. semantics but about generality: the rule room could handle novel combinations (within the rules) but the table room could not. However, the rule room is still very limited.

        - Block's Blockhead: a system that uses a giant lookup table could in principle handle any input, but it would be astronomically large. Our table room was small and finite, but if it were big enough, you couldn't tell the difference.

        - Dennett's objection: speed and scale matter. Our rooms are slow and small, but if the rule room were fast enough and had enough rules, it might be indistinguishable from understanding.

        - The activity shows that behaviorally, given finite time and finite questions, you can't tell a finite rule system from a finite table system. But Searle wants to say that even a perfect simulation (which would require an infinite table) still wouldn't have semantics.

  ### What can go wrong

    1. The rule room is slow and the class gets bored.
        - Mitigation: limit the time per turn. Give them 1 minute max. If they can't answer in 1 minute, they output ✚.
        - Practice with the rule room team: do a dry run with one example.

    2. The rule room team starts learning the glyphs.
        - This is a feature, not a bug? Because it shows that the operator can start to understand. But we want to show that without the operator understanding, the room is still doing its job? 
        - In the debrief, we can point out that in the beginning, they didn't understand, and by the end, they might have started to. But the system was working even when they didn't understand. And if we replaced them with someone else, the system would still work.

    3. The Translator makes a mistake in mapping.
        - Have a cheat sheet and practice.

    4. The exposing question doesn't come up.
        - In the killer question phase, suggest they try an arithmetic question that wasn't asked before, like "What is four plus three?"

    5. Both rooms output the same for the exposing question? 
        - Because the table room might have the entry? Double-check the table doesn't have [▼, □, ■] (4+3). We left it out.

    6. The rule room outputs an error for a question that the table room answers? 
        - That might happen if the question is in the table but not covered by the rules? But we designed the rules to cover the same domains. But if the interrogators ask "What is two plus three plus four", both rooms would error? So avoid that.

  ### Fallback versions

    - No TA, instructor as Translator: The instructor can be the Translator. That might be easier and faster.

    - 50-minute version:
        - Cut the question rounds to 5-7.
        - Skip the initial betting phase.
        - Skip or shorten the killer question design phase (or do one killer question).
        - Debrief: focus on the key moment: when an exposing question is asked and the table room fails while the rule room succeeds, and then discuss what that shows.

  ### The key moment

    The most philosophical work is done when the class sees the two rooms behave differently on a novel question (within the rule room's capacity) and then realizes that the difference is not about semantics but about the system's generality. And then in the debrief, when they see that even the rule room is limited and slow, and that the translator is the only one who understands the meaning.

    Protect the killer question phase and the debrief.

