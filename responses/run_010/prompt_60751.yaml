  ### Rulebook for Rule Room

    Rule 1: Arithmetic (two numbers)
      - If the input has exactly 3 glyphs and the first glyph is ▼, then:
          1. Check if the second glyph is in the Number Chart (●,○,■,□,▲,△,▼,▽,◆,◇). If not, output ✚ and stop.
