        But for color outputs:
          ▲ -> "blue"
          ▼ -> "red"
          △ -> "green"

        For weather outputs:
          ● -> "yes"
          ○ -> "no"

        For identity outputs: it's a number glyph, so use the number word.

        So the Translator must know the context? But the output doesn't carry context. We can have the Translator remember the question? Or the output glyph is the same regardless of context. 

        For example, if the output is ●, it could be the number one or the answer to weather (yes) or an identity of one. 

        How to distinguish? 

          If the input was weather, then ● means "yes".
          If the input was arithmetic, then ● means "one".
          If the input was identity, then ● means "one".

        So the Translator must remember the type of the question.

        Alternatively, we can design the output to be unambiguous? But we didn't.

        We'll have the Translator remember the question type.

        But this is complicated. Alternatively, we can design the output so that:

          In arithmetic and identity, the output is a number glyph (1-10).
          In color, the output is a color glyph (▲,▼,△).
          In weather, the output is ● or ○.

        So if the output is ●, and the question was weather, then "yes"; if arithmetic, then "one"; if identity, then "one".

        The Translator must record the question type.

    We can simplify by having the Translator not worry about the type for output: if the glyph is in the number set, say the number word. If it's a color glyph, say the color. If it's ● or ○ and the question was weather, say "yes" or "no". But for identity, it will be a number glyph, so say the number word.

