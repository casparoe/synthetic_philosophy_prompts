      Identity (3):
        [★, ●] -> ●
        [★, ○] -> ○
        [★, ■] -> ■

    For any input not in this list, output ✚.

  ### Translator's Cheat Sheet

    Input mapping:

      Arithmetic: 
        Question pattern: "What is X plus Y?"
          X and Y must be one of: "one", "two", ..., "ten"
          Map X and Y to glyphs using:
            "one" -> ●
