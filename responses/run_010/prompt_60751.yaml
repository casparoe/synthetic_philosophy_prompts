    To avoid this, we'll have the Translator know the intended domain of the question and use that to interpret the output.

    Example: 
      If the question was "What is two plus three?", then the output should be a number glyph -> say the number word.
      If the question was "What color is the sky?", then the output should be a color glyph -> say the color.
