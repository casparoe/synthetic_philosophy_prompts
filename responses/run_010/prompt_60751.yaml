    Output mapping:

      Given a glyph from the room, map to English:

        If the glyph is:
          ● -> "one"
          ○ -> "two"
          ■ -> "three"
          □ -> "four"
          ▲ -> "five"
          △ -> "six"
          ▼ -> "seven"
          ▽ -> "eight"
