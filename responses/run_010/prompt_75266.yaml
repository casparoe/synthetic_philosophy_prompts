  ### **Leaf Accounts & Logical Space**
  - **Prototypes**: Abstract summary of typical features (e.g., "opens locks," "metal," "teeth").  
  - **Exemplars**: Stored instances (e.g., Yale key, skeleton key).  
  - **Theory-theory**: Embedded in a system (e.g., "keys grant access," so wifi key fits).  
  - **Atomism**: Unanalyzable primitive; sliding is not part of the concept.  
  - **Copycat-style**: Concept fluidly remaps similarities via analogy (e.g., bottle opener as "key" via material).  
  - **Pluralism**: No single concept; different "key" concepts per context.  

