answer: |-
  ## Planning Note (197 words)

  1. **Stranger trades briskly on opaque knowledge** (Common prior exists but not common knowledge of information)
  2. **Ordinance requires sworn disclosure of reasons before trade** (Creates signaling mechanism)
  3. **Merchant offers high price for stranger’s land, discloses drought rumour → Offer refused** (Recipient infers merchant *wouldn’t pay that much* unless *more certain* than disclosed; disclosure reveals *minimum* certainty, making offer suspicious)
  4. **Farmer offers low price for widow’s sheep, cites old age → Widow refuses** (Widow infers farmer *knows something worse* about the sheep’s health/value, else he’d offer *less* or *more* neutrally)
  5. **Widow (Leora) tries pre-commitment: vows to accept *any* offer for her apples → No offers made** (Potential offerers infer she’s desperate *for a reason*, so her goods must be flawed; her vow signals *expectation* of low offers, implying hidden defect)
  6. **Leora tries agent (ignorant son) to sell apples → Offers made are insultingly low** (Buyers know agent is ignorant, infer goods *must* be bad for Leora to use such a tactic, lowball accordingly)
  7. **Barter fails: Potter refuses offer of eggs for bowl → Potter infers hen-keeper knows eggs are stale/soon bad** (Offer to barter specific goods signals the offerer values them *less* than the recipient might)
  8. **Gift refused: Leora offers apple to neighbour → Neighbour infers Leora thinks she looks hungry/needy (inference of pity) or apple is bad** (Any transfer of value becomes a signal; refusal avoids confirming the inferred state)
  *Simplification:* Left out the role of prices as aggregators/focal points; focused purely on bilateral trades where signaling is direct. Ignored potential for costless, non-informative communication ("cheap talk").

  ---

  ## The Silence of the Vale

  The Vale of Alyn was known for its sharp air, its stubborn sheep, and its singular Almanac. Every child learned their reckoning from Master Bowen in the drafty schoolhouse, parsing probabilities from the phases of the moon, the flight of crows, the yield of barley under a late frost. They learned the same weights, the same measures, the same way of balancing doubt against likelihood. This shared arithmetic of expectation was the bedrock beneath the bustling market in High Alyn Town. Good wool fetched its price, grain moved with the seasons, and disputes were settled with a peculiar, calm finality. They agreed on how the world *probably* was.

  Then came Silas. He arrived with the autumn mists, a lean man with eyes the colour of slate and a pack containing curiosities: intricate clockwork birds, bolts of fabric dyed impossible blues, vials of pungent salts. His business was opaque. He bought seemingly at random – a crate of inferior apples one day, a stack of worn sheepskins the next. He sold erratically – a clockwork bird for a handful of copper to a farmer’s child, a vial of salts for a near fortune to the apothecary. Trade flourished. Uncertainty bloomed. What did Silas know about those apples? What hidden virtue lay in those salts? The market buzzed with speculation, a delightful friction generated by the sheer opacity of Silas’s valuations. Gold flowed like meltwater.

  The friction turned sour with Mistress Elara’s horse. A widow, proud but pinched, she’d sold her late husband’s old plough horse to Silas. It had a slight limp, noticeable but manageable. Silas paid a decent price. A week later, the beast went down in the traces hauling stone for Silas’s new storehouse, lame beyond use. Silas said nothing publicly, but the sight of the ruined horse being led away, and Elara’s quiet, shamed tears at the market cross, seeded a grievance. It wasn’t malice, the town agreed, just the hard luck of trade. But Elara’s neighbours felt the sting. Something shifted.

  The Ordinance passed swiftly. Proposed by Elara’s nephew, seconded by the cautious miller, it was simple: *Before any sale or barter above the value of one copper penny, the offerer must swear before the Town Assessor, stating plainly what knowledge prompts their offer.* Truth, under pain of fine and pillory. Leora, young, sharp-eyed, and trusted for her fair-mindedness (and perhaps her lack of powerful kin), was appointed Assessor. Her stall by the market cross became the new heart of commerce.

  The first to come was Borin the grain merchant. He sought Silas’s small plot of land at the valley’s edge. Borin swore his oath: “I offer ten gold sovereigns for the plot. Prompted by… whispers down the Spicer’s Road. Rumours of drought in the southlands. Grain may rise. Land might be good for storage.” He stated it clearly, as the Ordinance required.

  Silas listened, his slate eyes unreadable. Then he shook his head. “No sale, Merchant Borin.” Borin sputtered. “But the price is fair! More than fair!”

  “Aye,” Silas said softly. “Too fair. Or rather, too *informed*. If you offer ten sovereigns based only on whispers… what must you *really* know about the drought, or that land, to reckon it worth so much? You’ve sworn truth, so you believe it strongly. Strongly enough to pay ten sovereigns on a rumour? That tells me more than your oath. I think the drought is certain, or the land holds more than grass. Either way, ten sovereigns is likely too cheap. I’ll keep it.”

  The silence began there. Borin left scowling. Leora noted it in her ledger: *Offer made. Reason sworn. Refused. Inference.* The large, speculative deals dwindled. Why declare your edge? It only sharpened the other side’s suspicion.

  Smaller trades followed the same cold path. Old Man Cedd offered Mistress Elara three coppers for a ewe he declared was “past prime breeding, likely only good for mutton soon.” Elara, remembering her horse, looked at the still-vigorous sheep, then at Cedd. “Three coppers? Based on her age? Master Cedd, if you reckon her that far gone, why offer three? Why not one? Or wait until she drops dead and take her for free? Offering three coppers tells me you think she’s worth more than mutton *right now*. You see something I don’t. Maybe she’s ill? No sale.” The ewe stayed in Elara’s pen. Leora noted: *Offer made. Reason sworn (age). Refused. Inference of hidden defect.*

  Leora watched the freeze spread. She saw the pattern: the declaration, meant to ensure fairness, became a lens focusing suspicion. The sworn reason established a floor for the offerer’s certainty. Offering implied they believed they knew *more* than they’d declared, tipping the balance unfairly. Why else offer *that* much, for *that* reason?

  Desperate, Leora hatched a plan. She had a small orchard. Good apples. She stood by her stall and made a public vow, loud enough for the hesitant crowd to hear: “I swear, before all here, I will accept *any* offer made today for my basket of Red Astrians! Any offer at all! One copper, half a copper! I am bound!”

  She waited. People glanced, murmured, but no one approached. An hour passed. Then two. Finally, young Tom the carter sidled up. “Any offer, Mistress Leora? Truly?”
  “Truly, Tom. Sworn.”
  He chewed his lip. “Then… half a copper for the lot?”
  Leora felt a surge of relief. It was insulting, but it was trade! “Done! Half a cop—"
  “Wait!” Mistress Elara called out sharply. She stepped forward, eyes narrowed. “Leora, why? Why bind yourself so? Why invite ruin? Unless…” Elara peered into the basket. “Unless you *know* these apples are wormy, or bruised inside, or ready to rot? Why else be so desperate for *any* price? You expect only terrible offers, meaning you know they’re terrible apples! Half a copper is likely twice what they’re worth!” She turned away. Tom looked horrified and backed off, muttering apologies. Leora stood alone beside her perfect, unsold apples. Her vow, meant to disarm, had screamed *hidden flaw*. Leora noted it mentally, bitterly. *Pre-commitment made. No offers (initially). Inference of hidden defect invalidates pre-commitment. Refusal.*

  Undeterred, she tried cunning. The next market day, she sent her son, Daveth, a boy of ten whose world was rocks and rabbits, to sell the apples. “Just hold up the basket, Daveth. If someone says a price, say yes. Don’t haggle. Don’t say anything else.” He knew nothing of worm rumours or market fears. An agent without information, she reasoned.

  Daveth stood dutifully. Borin the merchant paused. “Boy, those apples. A copper for the basket?”
  Daveth, remembering his instructions, nodded vigorously. “Yes!”
  Borin frowned. “Just ‘yes’? No ‘My ma says they’re worth two’? No haggling?” He leaned closer. “Because you don’t know, do you? You’re just the messenger. Which means… your mother thinks they’re so bad she won’t even sell them herself? Or she thinks buyers will fleece you? Either way…” Borin dropped a single, worn half-penny into Daveth’s hand. “That’s all they’re worth, boy. Take it or leave it.” Daveth, confused but seeing a coin, took it. Leora, watching from the shadows, felt sick. Using Daveth *confirmed* she had something to hide; buyers, knowing the agent was ignorant, inferred the worst and paid accordingly. *Agent used. Offer made (low). Accepted (at exploitative price). Inference of hidden defect exploited.*

  The silence deepened, chilling even routine exchange. Leora witnessed the potter, Halen, refuse a dozen fresh eggs from the hen-keeper, Agna, in exchange for a small bowl. Agna swore her oath: “I offer these eggs for the bowl, prompted by… needing a bowl for my new chicks?” Halen shook his head, troubled. “Needing a bowl, Agna? Aye, but why *my* bowl for *your* eggs? You could trade eggs for flour, flour for a bowl… simpler. Offering eggs *direct* for the bowl tells me… you think these eggs won’t keep? That they need shifting quickly? Are they stale? Are they weak-shelled? I’ll pass.” The barter died. Leora didn’t need to note it; the stiff, disappointed turn of Agna’s shoulders said enough. *Offer made. Reason sworn (need). Refused. Inference of hidden defect in goods offered.*

  The great Autumn Fair arrived, usually a riot of noise and swapping. This year, a pall hung over it. Stalls were full. Eyes were watchful. Voices were low. People examined goods with intense, silent suspicion, searching for the flaw the offer itself might imply. Few oaths were sworn because few offers were made. The sheer act of proposing an exchange became laden with unspoken accusation. Leora sat at her table, her ledger mostly empty, watching the quiet desperation. The shared arithmetic of Alyn now calculated only the risk of revelation.

  Then came the moment that stole Leora’s breath. Old Nan, bent double with years, shuffled up to her neighbour, young, pregnant Mara, who looked pale and tired. Nan held out a perfect, red apple from her own prized tree. “For you, child,” Nan rasped, a simple kindness. Mara looked at the apple, then at Nan’s concerned face. Leora saw the calculation flicker in Mara’s eyes – the Ordinance didn’t cover gifts, but the habit of inference was bone-deep. Why this gift? Why now? Did Nan pity her wan look? Think her starving? Or… was there a worm in the apple Nan couldn’t see? Was it charity, or disposal? To accept might confirm Nan’s silent diagnosis of her need, or expose her to hidden harm. Mara forced a thin smile. “You’re kind, Nan, truly. But… I couldn’t. I’m not hungry just now.” She turned away quickly, blinking. Nan stood frozen, the offered apple trembling in her gnarled hand, a profound hurt dawning in her old eyes. The gift, the purest offer, had become suspect. The silence was complete. It wasn’t tyranny; it was a terrible, perfect understanding. Leora closed her ledger. There was nothing left to record.

  ---

  ## Critical Note

  **Confidence in Mechanism:** Moderately high (7/10). The core sequence (Borin/Silas, Cedd/Elara, Agna/Halen, Nan/Mara) aims to show refusal stemming *directly* from the inference enabled by the sworn disclosure or the act of offering itself. The characters aren't primarily suspicious *of each other personally*, but of the *information signaled by the offer*. Borin isn't inherently distrusted; it's the *content* of his sworn reason combined with the *price* that makes Silas infer hidden knowledge. Elara refuses Cedd based on the *implied contradiction* between his stated reason (old ewe) and his offer price (too high for just mutton). The gift refusal hinges on Mara inferring unstated beliefs (pity, hidden defect) from the act of giving. Suspicion arises *from* the signaling mechanism, not pre-existing animus.

  **Least Sure Step:** The failure of Leora's pre-commitment device (vowing to accept any offer). I'm least confident this purely dramatizes the theorem. The theorem focuses on offers signaling private information. Leora's vow *is* an offer (to trade at *any* price). Theoretically, its failure is sound: her vow signals extreme desperation, which *is* private information (e.g., she knows the apples are bad, or she's in dire financial straits). Observers infer this hidden negative state, making them unwilling to engage even at a low price (adverse selection). Elara's intervention articulates this inference clearly. It *should* fail for theoretically sound reasons: the vow itself signals negative information. However, the reliance on Elara *explicitly stating the inference* feels slightly didactic compared to other, more organic refusals. A real economist might argue that in a perfectly rational setting, *someone* might still offer a token sum (like Tom almost did) just to get the apples cheaply, purely on the off-chance they *aren't* flawed, exploiting Leora's binding commitment. I suppressed that possibility for dramatic effect (showing utter refusal) and to maintain the chilling progression.

  **Pre-Commitment Device Failure:**
  *   **Reason:** Theoretically sound. The vow itself is a costly signal (binding herself to potential loss) designed to encourage trade. However, in a common knowledge/rationality setting, it unavoidably signals *why* she is willing to bear that cost – i.e., she possesses negative private information about the apples or her situation that makes *any* price better than none. This induces adverse selection: only those expecting the goods to be very bad (like Tom offering half-copper) or exploiters (like Borin with Daveth) would engage, and even they become suspicious when the signal is *too* strong (Elara's intervention). The device fails because it cannot escape being informative.
  *   **Effect of Repeal:** If the Ordinance were repealed, the pre-commitment device *might* work temporarily. Without the ingrained habit of mandatory disclosure and the intense focus on inferring from *any* signal, Leora's vow might be taken more naively as simple desperation or eccentricity, potentially attracting lowball offers. However, the *underlying logic* of the no-trade result (offers signal information) would still exist. Rational actors would *still* wonder *why* she was so desperate. The silence might thaw, but the fundamental suspicion enabled by common priors and rationality wouldn't vanish; trade might resume but remain cautious and potentially exploitative, especially for non-standard goods. The perfect, chilling agreement of the silence would be broken, replaced by the noisy, risky uncertainty of the pre-Ordinance days with Silas, but now tinged with the memory of what inference can do. The device might "work" in getting *some* trade, but likely at prices reflecting the inferred negative information, not true value.
