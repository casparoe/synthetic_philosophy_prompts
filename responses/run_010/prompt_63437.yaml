prompt: |-
  I've been listening to a podcast series on game theory and ethics, and near the end of the last episode the host read out a long passage from the guest's book. The guest is a working economist, so I'm assuming the passage is basically sound, but a few sentences made me twitch and I don't have the vocabulary to say why. It went roughly like this:

  "Harsanyi proved that if a society ranks risky prospects in a way that satisfies the expected-utility axioms, and if it is indifferent between two prospects whenever each of its members is indifferent between them, then the society's utility function is a positive weighted sum of the members' utility functions. That's the whole theorem. So utilitarianism turns out not to be a moral intuition you can haggle over, but a consequence of two very weak conditions on rational social preference — and where you treat people symmetrically the weights are equal, which is why the social objective is just the sum, or equivalently the average, of individual well-being. Notice what's left over: the business of putting everyone's utility on a common scale. That sounds like a problem, but it isn't a philosophical one. It's the difference between measuring temperature in kelvin and measuring it in celsius — pick a scale and the theorem tells you exactly how to combine them. It also disposes of the main rival. Rawls's original position and Harsanyi's impartial observer are the same thought experiment: strip away everything you know about who you are, then ask what you'd choose. Rawls's parties get cold feet and play it maximally safe, which lands them on the difference principle; Harsanyi's observer, being an ordinary expected-utility maximizer who assigns himself an equal chance of turning out to be anyone, lands on average utility. The gap between the two theories isn't a disagreement about justice, it's a disagreement about an arbitrary assumption concerning attitudes to risk. Settle that and you have utilitarianism."

  Where I'm at: one decision theory course as an undergrad, not going into the field, I just want to know how much of this to trust. Can you go through it claim by claim and sort it into what a social choice theorist would happily sign, what's a fair simplification for a general audience, and what's actually wrong or quietly doing the heavy lifting? Three specific things I noticed but can't evaluate myself:

  - He says "sum" in one breath and "equivalently the average" in the next. Is that just sloppiness, or is there something hiding there?
  - He treats interpersonal comparability as a measurement detail, like picking units. My hazy memory from class is that there's a literature saying the theorem either doesn't address comparability at all or gets it only by assuming something substantive. Am I remembering that right, and if so what exactly is the assumption that's doing the work?
  - The Rawls bit is what I'm most suspicious of. I thought the parties in the original position aren't given the odds of ending up where at all, which sounds like a structural difference in the setup rather than a difference in temperament. But I've also heard Harsanyi attacked Rawls on precisely this ground, so maybe the passage is reporting a real argument and I'm the one who's wrong.

  If some of his complaint about Rawls is legitimate, say so plainly — I don't want a defence attorney, I want to know where the passage earns its keep. And then the payoff question: if the technical core is right but the gloss on it isn't, how much of "utilitarianism is a theorem" is left standing once you fix the gloss, and does the corrected version license anything at all about the difference principle? Please explain the assumptions themselves rather than pointing me at sources — I can't look anything up and a reading list wouldn't help me here.
