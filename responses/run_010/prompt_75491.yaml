answer: |-
  ### Stress-Testing the Single-Scalar Salience View  
  Your position posits that analogy resolution in this microdomain is governed by a single ordered salience scale of concepts (e.g., "successor," "predecessor," "run," "repeat"), rescaled by context. The most salient compatible concept is applied; if blocked, the next most salient is attempted. Variability arises from noise in this ordering. Below, I address counterevidence, falsifiability, and design new items to pit your view against rivals.  

  #### Defeaters for the Single-Scalar View  
  Ranked from fatal to merely awkward, with concessions a defender would make:  

  1. **Stable Bimodal Splits Without Contextual Shifts (Fatal, Conceded as Damaging)**  
     - **Pattern**: For an item (e.g., (ii) `12 → 13 :: 44 → ?`), answers split bimodally (e.g., 45 vs. 55) and remain stable across rephrasing, filler items, or repeated trials. No contextual manipulation shifts the distribution.  
     - **Why It Counters**: A single salience scale (even with noise) predicts a unimodal distribution. Bimodality implies distinct, stable subpopulations with *fixed* orderings, contradicting the rescaling-by-context claim.  
     - **Concession**: A defender would concede this forces abandoning a universal scale. They might retreat to "person-specific orderings," but this undermines the core claim of context-driven rescaling.  

  2. **Illegal Answers as Primary Responses (Fatal, Conceded as Damaging)**  
     - **Pattern**: Many respondents answer (i) `2345 → 2346` (illegal, as 6 is outside the domain). This occurs even when the problem emphasizes the hard ceiling.  
     - **Why It Counters**: The view assumes concepts are only applied if compatible (e.g., "successor" requires a valid successor). If `2346` is common, legality isn't filtering candidates *during* concept selection but is a post-hoc check (or ignored). This violates the "blocked if incompatible" tenet.  
     - **Concession**: A defender must admit the model is wrong: either (a) legality isn't part of compatibility, or (b) salience overrides blocking. Both contradict the view’s mechanism.  

  3. **Consistent Individual Styles Across Items (Awkward, Defended with Re-fitting)**  
     - **Pattern**: Some people always prefer "run"-preserving changes (e.g., (i) → `2344`), while others prefer "digit-level" changes (e.g., (i) → `2355`). This style persists across items and sessions.  
     - **Why It Counters**: Suggests stable person-specific salience orderings, not context-rescaled ones. Weakens parsimony as the scale becomes a "person parameter" rather than a context-driven mechanism.  
     - **Defense**: Defender re-fits by attributing styles to baseline salience differences. Awkward but not fatal, as context rescaling could still operate *within* personal baselines.  

  4. **Priming Effects That Survive Repeated Exposure (Awkward, Defended with Re-fitting)**  
     - **Pattern**: Exposure to (i) (e.g., answering `2355`) shifts answers to (ii) (e.g., to `55`) permanently, even after multiple exposures or delays.  
     - **Why It Counters**: Priming should integrate into context rescaling temporarily. Persistent effects imply salience orderings are rigid or updated via learning, not dynamically rescaled.  
     - **Defense**: Defender re-fits by calling this "salience recalibration," treating it as context rescaling over longer timescales. Weak but defensible.  

  5. **No-Ambiguity Items With Variable Answers (Awkward, Defended with Noise)**  
     - **Pattern**: For (ii) `12 → 13 :: 44 → ?`, some insist it’s unambiguous (must be `45`), yet answers vary (`45`/`55`).  
     - **Why It Counters**: If no ambiguity exists, variability must stem from noise or error. But the view frames variability as ordered slips, not noise in unambiguous cases.  
     - **Defense**: Defender attributes this to noise in salience weights or hidden concepts (e.g., "block-increment"). Redescribes noise as part of the model.  

  #### Falsifiability and Re-estimation  
  - **Re-estimation as Insulation**: Yes, the view risks unfalsifiability. Salience orderings and rescaling parameters can be re-estimated to fit any data, much like utilities in choice theory.  
  - **Is This a Problem?**  
    - **Defensible**: In a *computational account of fluid concepts*, this is analogous to estimating utilities from choices. If the concept set is fixed (e.g., 10 predefined operations), cross-validation across items can falsify predictions (e.g., estimate salience from Items A–C, then predict D–F).  
    - **Indefensible** if:  
      - The concept set is expanded post-hoc to fit surprises (e.g., adding "double-increment" for `55` in (ii)).  
      - Re-estimation has no constraints (e.g., salience weights can be arbitrary).  
    - **Verdict**: Defensible *only* with a fixed, predefined concept set and cross-validation. Otherwise, it becomes a circular redescription.  

  #### Does the View Predict Unique Phenomena?  
  - **Yes, but weakly**: It predicts that when top concepts are blocked, slips follow the salience order *without global checks*. Rivals (e.g., structure-mapping) predict coherence; two-process models predict time-dependent overrides. However, your view is primarily a *redescription* of choice data via ordered slips. Its unique prediction is that **all variability reduces to noise in a single ordered list**, with no higher reasoning (e.g., no "global consistency" step). Rivals predict richer patterns (e.g., coherence effects, time delays).  

  ---

  ### New Items to Force Divergence Between Theories  
  Using only symbols `1-5` and run/repeat rules, these items are designed to pit your view against:  
  - **Global Coherence (GC)**: Analogies must preserve system-wide structure (e.g., runs/repeats).  
  - **Two-Process (TP)**: Fast salience-driven answer competes with a slow, coherence-checked one.  

  #### Item 1: **`123 → 124 :: 111 → ?`**  
  - **Base Change**: `123` (run) → `124` (run). Salient concept: *Increment last element* (`3→4`).  
  - **Target**: `111` (repeat).  
  - **Predictions**:  
    - **Single-Scalar (SS)**: Most salient concept: *Increment last element* → `112` (illegal? No, `1→2` is valid). **Answer: `112`** (breaks repeat structure).  
    - **GC**: Preserves structure by *incrementing the entire repeat block* → `222` (keeps repeat intact). **Answer: `222`**.  
    - **TP**: Fast: `112` (salience-driven). Slow: `222` (coherence-checked).  
  - **Killer Pattern**: If `112` dominates under time pressure but `222` increases with unlimited time, GC wins and TP is supported. SS cannot explain the shift (it lacks a slow process). If `112` is common *without* time pressure, SS is favored.  

  #### Item 2: **`122 → 123 :: 44 → ?`**  
  - **Base Change**: `122` (run + repeat) → `123` (run). Salient concept: *Increment last element* (`2→3`).  
  - **Target**: `44` (repeat).  
  - **Predictions**:  
    - **SS**: Most salient: *Increment last element* → `45` (breaks repeat). **Answer: `45`**.  
    - **GC**: Preserves repeat structure by *incrementing the entire block* → `55` (keeps repeat). **Answer: `55`**.  
    - **TP**: Fast: `45`. Slow: `55`.  
  - **Killer Pattern**: Bimodal split (`45`/`55`) that *correlates with styles* (e.g., "digit-changers" vs. "block-changers") falsifies SS (it predicts a unimodal slip order). Time-pressure shifts (more `45` fast, more `55` slow) support TP.  

  #### Item 3: **`34 → 35 :: 45 → ?`**  
  - **Base Change**: `34` (run) → `35` (run). Salient concept: *Increment last element* (`4→5`).  
  - **Target**: `45` (run, ceiling at `5`).  
  - **Predictions**:  
    - **SS**: Top concept (*increment last element*) blocked (no successor for `5`). Next: *Increment last incrementable element* (`4→5`) → `55` (breaks run). **Answer: `55`**.  
    - **GC**: Preserves run by *decrementing last element* (matching ceiling adjustment) → `44` (still a run? `4=4` isn’t ascending; breaks structure). Or, no coherent change → **no answer/stuck**.  
    - **TP**: Fast: `55` (salience slip). Slow: `44` (if coerced) or stuck.  
  - **Killer Pattern**: If many are "stuck" or answer `44`, GC is supported (prioritizing legality/structure). If `55` dominates (even with time), SS wins. TP predicts `55` fast, `44`/stuck slow.  

  #### Summary of Divergences  
  | Item | SS Prediction      | GC Prediction      | TP Prediction           | Falsifying Pattern for SS                     |  
  |------|--------------------|--------------------|-------------------------|---------------------------------------------|  
  | 1    | `112`              | `222`              | Fast: `112`; Slow: `222` | `222` without time pressure, or style splits |  
  | 2    | `45`               | `55`               | Fast: `45`; Slow: `55`   | Bimodal split without slip order             |  
  | 3    | `55`               | Stuck/`44`         | Fast: `55`; Slow: `44`   | High "stuck" rates                          |  

  - **Key Insight**: SS is falsified if responses:  
    - Show structure-preserving answers (e.g., `222`, `55`) *without* blocking.  
    - Are bimodal or "stuck" in ways inconsistent with a linear slip order.  
    - Shift with time in a way SS can’t explain.  

  Your view is parsimonious but struggles with structural coherence and individual consistency. It survives only if variability is truly noisy and slips follow a strict order. The new items above can empirically test this.
