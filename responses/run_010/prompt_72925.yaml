  Each certificate will specify sources (self-evident principles, definitions), uncertainty (disagreements among competent thinkers), and whether they claim necessity.

  The residue analysis is crucial. Clean translations: objectives, inputs. Distorted: necessity claims become decision rules. Untranslatable: the raw "aha" moment of insight itself - this might be the core of what the second camp values.

