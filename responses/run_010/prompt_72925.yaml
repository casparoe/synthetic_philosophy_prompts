  I notice a tension upfront: treating intuition as an instrument might bias toward the "arguments in disguise" view since instruments require traceable calibration. But I must be careful not to smuggle this assumption.

  For the three canonical cases (Galileo's stones, Einstein's elevator, Newton's bucket), I'll prepare mock certificates showing:
