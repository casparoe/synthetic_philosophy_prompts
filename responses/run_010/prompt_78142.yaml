  Move (7): Nadia calls this approach unfalsifiable since Theo could redefine methods ad hoc. This seems correct, so "lands."

  Now for the unfinished math argument: If a claim is necessarily true (like 2+2=4), it can't be false, so Theo's tracking condition ("wouldn't believe it if false") is automatically satisfied. This would mean we "know" all necessary truths trivially, which seems wrong - we still need proof or understanding. This is damaging to Theo's theory.

  Overall, Nadia's position survives better. She effectively challenges Theo's epistemology while he makes concessions that create bigger problems. The most important thing they walked past is how practical knowledge (like checking a pet camera) functions differently from philosophical skepticism - we might accept different standards for daily life versus abstract scenarios.

