prompt: |-
  You're a philosopher of medicine who's spent way too long inside the death-determination literature — Bernat vs. Truog vs. the higher-brain crowd, the whole mess — and I need you to reason like that for a working committee, not for a journal article. I chair the determination-of-death consult service at a mid-size academic hospital, and most of what we do is procedural (apnea tests done right, ruling out sedatives and hypothermia, mediating with families), but every so often we get something that actually forces us to notice that we've never pinned down what our own criteria mean. Our record so far, for reference:

  1. Massive hemorrhage, no brainstem reflexes, apnea test done properly, ventilator-dependent, but still making antidiuretic hormone so no diabetes insipidus, warm, no sedatives on board — we declared death.
  2. Eight months of permanent vegetative state, no awareness on any testing, brainstem reflexes intact, breathing on her own through a trach — we said not dead, and told the family that withdrawing support was a separate question with its own answer.
  3. Controlled donation after circulatory determination: support withdrawn after a non-survivable injury, asystole, five-minute hands-off window, no return of circulation, then procurement — we upheld the determination.
  4. Cold-water submersion, core temp about 25.4, no pulse, fixed dilated pupils, roughly an hour of CPR by the time we were called — we refused to let anyone make a determination until she was rewarmed and reversible causes were excluded. She ended up surviving with deficits, which people here still bring up.
  5. Anencephalic newborn — we said not dead.
  6. A donation case where about three minutes after asystole the monitor showed an organized rhythm for maybe twenty seconds with no pulse and no output — we said the determination stands, because there was electrical activity but no circulation actually happening.
  7. Continuous-flow LVAD patient, no palpable pulse, blood pressure not measurable by cuff, awake and doing rehab while waiting for a transplant — we wrote in the note that pulselessness and unrecordable pressure are not by themselves grounds for a circulatory determination.
  8. A family that insisted our whole-brain patient was still alive and demanded continued ventilation — we said the determination isn't a matter of family consensus, but granted a 72-hour accommodation and helped arrange a transfer.

  Now the case in front of us. A 34-year-old woman whose heart and lungs both failed in the same illness three weeks ago; echo shows no contractility at all and the lungs have essentially no gas-exchange function left, so all of her perfusion and all of her oxygenation are being done by a centrifugal-pump extracorporeal circuit with non-pulsatile flow. She's on continuous dialysis too, and the circuit's heat exchanger does a lot of her temperature regulation. She is extubated, awake, oriented, talking, doing physical therapy on a mobile console, has every brainstem reflex, a normal EEG, and she makes spontaneous breathing efforts that accomplish nothing. She's a candidate for a double transplant in a few months. She's also miserable and has asked us to turn the circuit off, and both her attending and our counsel want to know, in writing, whether under our own framework she is a living patient from whom we'd be withdrawing life-sustaining treatment or somebody who is already dead. Nobody on the committee has a clean intuition, and the two prongs of the uniform act most states have adopted seem to point in opposite directions here, which is not something we've ever had to admit out loud.

  Before you answer, actually work through it — list every rule our eight precedents could be consistent with, test each one against every single precedent, and throw out the ones that don't survive, but don't show me that scratch work. Then reply as exactly eight numbered items, one or two sentences each, no introduction and no conclusion: (1) through (3), the candidate rules our record genuinely leaves open and what each one implies for this patient; (4) your recommendation and the single strongest reason for it; (5) which of our precedents is the closest analog and why it beats the runner-up; (6) what principle we'd be committing ourselves to if we ruled the other way, and which existing precedent would start to look unstable as a result; (7) one further case, realistic enough that we might actually see it, that would have forced these rules apart earlier; and (8) which parts of what you said are settled among people who work on this and which parts are genuinely contested — flag the contested bits explicitly rather than smuggling one side of a live debate in as the consensus.
reasoning: |-
  Okay, let me approach this systematically. The user chairs a hospital death-determination committee facing a complex ECMO case where a conscious patient wants treatment withdrawn, forcing them to confront definitional ambiguities in their own criteria. Their eight prior cases reveal practical tensions in applying neurological and circulatory standards to borderline situations.

  First, I need to identify all possible rules consistent with their precedents. Their cases show acceptance of:
  - Whole-brain death despite residual endocrine function (Case 1)
  - Consciousness as insufficient for life without integrated physiology (Case 2)
  - Circulatory death after irreversible arrest (Case 3)
  - Reversibility as absolute barrier (Case 4)
  - Anatomical absence of brain not equivalent to functional death (Case 5)
  - Electrical activity without circulation not negating death (Case 6)
  - Artificial circulation maintaining consciousness = life (Case 7)
  - Determination as objective, not consensual (Case 8)

  Testing rules against these, three interpretations survive:
  1. Death requires irreversible loss of natural (non-artificial) integrated biological function
  2. Death requires irreversible loss of all brain function (whole-brain standard)
  3. Death requires irreversible loss of natural circulation or whole-brain function

  For the current ECMO case:
  - Rule 1: Alive (artificial support maintains integration)
  - Rule 2: Alive (brain functional)
  - Rule 3: Ambiguous - natural circulation lost but brain functional

  My recommendation is Rule 1 (alive) because conscious patients can't be dead by any coherent biological or ethical standard. The strongest reason: consciousness inherently demonstrates organismal integration.

  Closest precedent is Case 7 (LVAD patient): both have artificial circulation supporting consciousness. Runner-up Case 2 (PVS) differs as that patient had natural respiration.

  If we declared death, we'd commit to: "Complete externalization of vital functions negates life." This would destabilize Case 7 (LVAD patient).

  A case that would have forced the issue earlier: A patient on ECMO who develops whole-brain death while conscious (impossible biologically but highlights the tension).

  Settled: Conscious patients can't be dead; determination isn't consensual. Contested: Whether "natural" vs "artificial" circulation matters; whether brain-dead bodies with residual integration (like Case 1) are truly dead.
answer: |-
  (1) Death requires irreversible loss of *natural* (non-artificial) integrated biological function: implies alive, as her consciousness demonstrates integration sustained artificially.  
  (2) Death requires irreversible loss of *all* brain function (whole-brain standard): implies alive, given intact brainstem reflexes and consciousness.  
  (3) Death requires irreversible loss of natural circulation *or* whole-brain function: implies ambiguous status—natural circulation is lost but brain function persists.  

  (4) Recommend declaring her alive: withdrawing life support from a conscious, interactive patient respects autonomy without redefining death. Strongest reason: consciousness is irreconcilable with biological death under any coherent definition.  

  (5) Closest analog is Case 7 (LVAD patient): both involve artificial circulation maintaining consciousness. Runner-up Case 2 (PVS) lacks the circulatory dependence and artificial integration.  

  (6) Declaring death commits us to: "Total externalization of vital functions negates life." This destabilizes Case 1 (brain-dead but making ADH), where residual endocrine integration was deemed irrelevant to death determination.  

  (7) Earlier forcing case: A patient with a total artificial heart (pulseless, conscious) requesting discontinuation—would expose the same circulatory/consciousness conflict as this ECMO case.  

  (8) Settled: Conscious patients cannot be dead; determination isn’t consensual (Case 8). **Contested**: Whether "natural" vs. artificial circulation matters (Case 7 vs. circulatory death cases); whether brain-dead bodies with hormonal activity (Case 1) meet "total brain failure" definitions.
