  We are creating a diagnostic decision tree for students working on the MU-puzzle. The goal is to classify their behavior when they try to solve the puzzle, not by their stated philosophical views but by their actions and reasoning steps.

  The puzzle: Start with "MI", and apply the rules to try to get "MU". The rules are:
  1. If a string ends with I, you can add U at the end.
  2. You can double the string after M (e.g., Mx becomes Mxx).
  3. You can replace any "III" with "U".
  4. You can remove any "UU".

  It is impossible to derive "MU" because the number of I's (which we call the I-count) must always be non-zero and not divisible by 3 (except for the starting point, which has 1 I). The invariant is that the I-count mod 3 is never 0 (except for the start, but note that we start at 1 mod 3 and the goal requires 0 mod 3).

  The handout will have 6-8 questions that lead to different leaves (positions). The leaves are named with the real names of philosophical positions where they exist, or "unnamed" otherwise.

  We are to make a distinction between:
  - Vertical jump: stepping up to a meta-level to reason about the system (e.g., using arithmetic to prove an invariant). This is the kind of jump relevant to Gödel's theorem.
  - Lateral jump: abandoning the system and changing the rules or the goal.

  We want to capture the following behaviors:

  1. Students who try to derive MU by applying the rules arbitrarily without a plan (flailing).
  2. Students who cheat (e.g., change the rules or the goal).
  3. Students who declare victory incorrectly.
  4. Students who notice the pattern in the I-count but don't formalize it.
  5. Students who prove the invariant (vertically jump).
  6. Students who try to change the system (laterally jump).

  Additionally, we are to consider the position of a program that rewrites its own rules and decide if that counts as vertical or lateral.

  The tree should have at least two leaves that we suspect are empty or unstable.

  We must flag pairs of leaves that the questions fail to separate.

  Finally, we must address the question: does the vertical/lateral distinction survive? And what about the student who mutters about the I-count pattern?

  Let's design the tree with 6-8 questions. The questions should be about what the student did.

  Possible questions:

  Q1: Did you attempt to derive MU by applying the rules in various sequences? (If no, they might have jumped immediately to meta or given up.)
  Q2: Did you ever write down a sequence of steps that you thought would lead to MU? (If yes, then they were trying within the system.)
  Q3: Did you notice that the number of I's in the strings you generated was never a multiple of 3? (If yes, they started to see the pattern.)
  Q4: Did you try to change the rules or the goal? (If yes, lateral jump.)
  Q5: Did you try to prove that it's impossible? (If yes, they are attempting a vertical jump.)
  Q6: How did you try to prove it? (If they say they used arithmetic, that's vertical.)

  But we want to avoid leading questions. Also, we cannot ask about "vertical" or "lateral".

  We can ask:

  1. How did you approach the puzzle initially? (Options: a. Started applying rules at random; b. Tried to work backwards from MU; c. Looked for patterns in the strings; d. Gave up quickly; e. Other)
