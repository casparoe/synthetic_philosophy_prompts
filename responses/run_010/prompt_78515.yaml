prompt: |-
  I'm a fourth-year graduate student in moral philosophy, TA-ing an upper-level undergraduate ethics seminar: eighteen students, one 75-minute section, third week of our consequentialism unit. They've already worked through the drowning-child case, the integrity objection, and the fair-share response to non-ideal conditions (the view that under partial compliance you're required to bear only what you'd bear under full compliance, no more). The problem is that "that's just too demanding" has become a reflex — they deploy it to swat down conclusions rather than to argue for anything, and they haven't noticed how much work it's doing or how unstable their own thresholds are.

  Design an in-class activity that makes the demandingness objection bite as a problem they generate themselves rather than one I announce. The mechanism I want built around: each student receives an endowment of tokens redeemable for something they'd genuinely rather keep — a small amount of extra credit, or minutes off a required reading log — so transfers are real costs, not pretend ones. They then face a sequence of individually trivial transfer requests. Half the group sees a running cumulative ledger of what they've already given; the other half sees only the current request. Before the sequence begins, every student privately writes down the cumulative total at which they think the demands would become excessive, and afterwards they compare that number with what they actually did.

  Give me the exact rules, the token scheme, the request sequence, and a minute-by-minute timeline. The debrief should map the two arms onto the philosophical options — what the ledger asymmetry would show for the fair-share theorist, versus for someone who reads it as either a framing artifact or evidence of a genuine integrity cost — and should press them to say what would count as evidence here rather than as mere psychology. Finally, tell me what will predictably go wrong the first time I run it and how to contain it, and state honestly which feature of the objection the activity structurally cannot reproduce.
reasoning: |-
  Okay, the user is a fourth-year grad student in moral philosophy, TA-ing an upper-level undergrad ethics seminar. They're in the consequentialism unit, and students keep using "that's just too demanding" as a reflex objection without really thinking it through. The goal is to design an in-class activity that makes the demandingness objection something the students generate themselves rather than being told about it.

  The user wants an activity where students get tokens they value (like extra credit or reduced reading time) and face a series of small requests to give some away. Half see a running total of what they've given; half don't. Students predict privately when demands become excessive, then compare that to what they actually gave. The debrief should connect this to fair-share theory vs framing/integrity views, and push students to think about evidence versus psychology.

  I need to figure out the token system. Since these are undergrads, the tokens should be meaningful but not excessive. Extra credit points are good - each token could be worth 0.1% towards their final grade, capped so they can't lose too much. Or time off a reading log - each token = 3 minutes reduction. Maybe let students choose which reward they prefer to make the cost feel real.

  For the request sequence, I'll need 15-20 requests. Each should be very small - 1 token for the first few, then escalating slightly. The amounts should be trivial individually but add up cumulatively. Examples: token 1: 1 token for a pencil; token 4: 2 tokens for snacks; token 10: 3 tokens for a charity donation. The last few could be 4-5 tokens each. The cumulative total should reach around 25 tokens - enough to feel significant but not devastating.

  The ledger asymmetry is key. Half the students (Group A) see a running total of how much they've given so far before each new request. Group B only sees the current request. This tests whether knowing the cumulative cost affects decisions.

  Timeline-wise: intro (10 min), prediction writing (5 min), request sequence (20 min), data collection (5 min), small group discussion (10 min), full debrief (20 min), conclusion (5 min). Total 75 minutes.

  For debrief: first show aggregate data - did Group A (with ledger) give less overall? Did they stop earlier? Then connect to philosophy: for fair-share theorists, the ledger group should stop when cumulative hits their fair share. Without ledger, they might overshoot. But if demandingness is about integrity/per-request cost, both groups should behave similarly. Need to press students on what would count as evidence for each view.

  Predictable problems: some students might give nothing or everything, skewing data. Solution: emphasize this is about personal thresholds, not judgment. Some may not take tokens seriously - so make rewards tangible. Group B might ask about cumulative totals - need instructions to prevent this. Data collection might be messy - use a simple Google Form.

  What the activity can't capture: real-world consequences lack emotional weight. Giving tokens isn't like saving a life. Also, it misses ongoing demandingness (like career choices). And the artificial setup might feel game-like. But it should still trigger the "this is too much" feeling at some point.

  I'll structure the response with detailed rules, token system, request sequence, timing, debrief points, anticipated problems, and limitations. The key is making the demandingness objection emerge from their own experience during the activity.
answer: |-
  Here’s a structured in-class activity designed to make students confront the instability of "too demanding" judgments through lived experience, followed by a targeted debrief mapping to philosophical positions.

  **Core Mechanics:**  
  Students receive tokens representing real opportunity costs (e.g., extra credit/reading time). They face 15 sequential, escalating requests to donate tokens to a collective "pool" (redeemed post-class for student-selected rewards). **Group A** sees a running ledger of their *cumulative donations* before each decision; **Group B** sees only the *current request*. Pre-activity, all privately predict their "excessive demand" threshold.

  ---

  ### **Activity Design: "The Incremental Ask"**  
  **Token Scheme:**  
  - Each student receives **30 tokens**.  
  - Tokens are redeemable post-class: **1 token = 0.1% final grade extra credit** *or* **3 minutes off a future reading log** (students choose their preferred redemption *before tokens are distributed*).  
  - *Why this works:* Small but non-trivial value; choice increases perceived cost ownership. 30 tokens allow cumulative demands to breach typical thresholds (avg. predicted "excessive" likely 15–25 tokens).  

  **Request Sequence** (15 requests; escalate slightly):  
  1. "Donate 1 token to buy pencils for a local school."  
  2. "Donate 1 token to add a book to the department free shelf."  
  3. "Donate 2 tokens to fund coffee for finals week."  
  4. "Donate 1 token to plant a tree on campus."  
  5. "Donate 2 tokens to support a food bank delivery."  
  6. "Donate 3 tokens to print protest signs for a climate rally."  
  7. "Donate 2 tokens to buy blankets for a shelter."  
  8. "Donate 3 tokens to cover a student’s lab fee."  
  9. "Donate 4 tokens to fund a scholarship essay prize."  
  10. "Donate 3 tokens to repair library furniture."  
  11. "Donate 4 tokens to buy menstrual products for free dispensers."  
  12. "Donate 5 tokens to sponsor a refugee resettlement kit."  
  13. "Donate 4 tokens to stock a free textbook reserve."  
  14. "Donate 5 tokens to support legal aid for evictions."  
  15. "Donate 6 tokens to buy AEDs for campus buildings."  
  *Rationale:* Starts trivial, escalates to morally weighty causes. Cumulative cost: 50 tokens max (impossible to fulfill all—forces trade-offs).  

  **Groups:**  
  - **Group A (Ledger):** Before Requests 1, 3, 6, 9, 12, 15, sees: *"You have donated [X] tokens so far. Next request: [Y]."*  
  - **Group B (No Ledger):** Sees only *"Next request: Donate [Y] tokens for [cause]."*  

  **Materials:**  
  - Token jars (physical or digital tally) + private prediction slips.  
  - Google Form for real-time data entry (cumulative donations per student post-activity).  

  ---

  ### **Timeline (75 Min Total)**  
  **0:00–0:10 — Setup & Prediction**  
  - Distribute tokens/prediction slips.  
  - *Instructions:* "Write the **total cumulative donations** at which you’d refuse ALL future requests as ‘excessively demanding.’ Keep this private. You may refuse ANY request, but cannot donate retroactively."  
  - Split into Group A/B (9 each).  

  **0:10–0:15 — Prediction Writing**  
  - Students write predictions silently. Collect slips.  

  **0:15–0:35 — Request Sequence**  
  - Announce requests at 75-sec intervals. Groups A/B see their respective prompts (via handout/screen).  
  - Students place tokens in jars (or mark digital tally) per decision.  

  **0:35–0:40 — Data Collection**  
  - Students report final donations via Google Form (Group A/B, donation total, refusal point).  

  **0:40–0:50 — Small Group Discussion**  
  - Groups of 3: Compare predictions vs. actual donations. Discuss: *"When did you refuse? Did knowing/not knowing your cumulative total change your choices?"*  

  **0:50–1:10 — Debrief (Whole Class)**  
  1. **Data Reveal (5 min):** Show anonymized charts:  
     - Avg. predicted threshold (all students).  
     - Avg. actual donations (Group A vs. B).  
     - % refusing at each request (Group A vs. B).  
     *Likely result:* Group A donates less cumulatively; Group B’s refusal points cluster later. Predictions often exceed actual donations in both groups.  

  2. **Philosophical Mapping (10 min):**  
     - **Fair-Share Theorist:** "Group A behaved as you’d expect—they saw cumulative costs approaching their fair share (predicted threshold) and refused earlier. Group B, unaware of accumulation, ‘overshot’ because no single request breached their threshold. Demandingness is about *total cost* against a defined limit."  
     - **Framing/Integrity View:** "Group A’s ledger made costs salient, triggering ‘loss aversion’ (psychology). Group B experienced each request as isolated, low-cost—so refusal felt ungenerous. The ‘excessive’ signal isn’t total cost but *perceived imposition* (integrity) or *decision context* (framing)."  

  3. **Evidence vs. Psychology Press (5 min):**  
     - *Pose:* "What would prove demandingness is an objective ethical problem (not just cognitive bias)? If Group A’s behavior is ‘more rational,’ why did both groups mispredict their own thresholds? Is instability in our limits a philosophical or psychological issue?"  

  **1:10–1:15 — Conclude**  
  - "Next class: Does consequentialism need a ‘demandingness adjustment’? Or is this objection a bias to overcome?"  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem:** Students "game" the system (e.g., donate 0/all tokens to prove a point).  
     **Fix:** Pre-activity: "This explores YOUR thresholds—no right/wrong. Tokens are yours to use as you wish." Use student-selected rewards to incentivize sincerity.  

  2. **Problem:** Group B students infer cumulative totals (e.g., counting tokens aloud).  
     **Fix:** Assign Group B to a separate area; use digital tokens for anonymity.  

  3. **Problem:** Requests feel "fake," reducing emotional weight.  
     **Fix:** Use tangible rewards *and* real causes (e.g., "Tokens donated >$5 = real donation to X charity").  

  4. **Problem:** Data collection slows debrief.  
     **Fix:** Use a pre-made Google Form; project live results.  

  ---

  ### **What the Activity Cannot Capture**  
  **The phenomenology of sustained sacrifice.** Tokens represent one-off costs, not lifelong compromises (e.g., career choices). Students experience *intermittent* demands, not the *pervasive burden* central to integrity objections (e.g., giving up personal projects *daily*). This risks making demandingness seem like a mere accounting problem rather than a threat to identity.  

  **Supplement:** Next class, contrast activity results with Bernard Williams’ *integrity* critique ("You can’t just ‘add up’ identity-constituting commitments") to highlight this gap.
