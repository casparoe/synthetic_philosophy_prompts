  8.  Bartholomew J. Finch is eligible for rehire under Company Policy HR-REH-5.0 (Standard Rehire Eligibility).

  This reference contains only verifiable facts pertaining to Bartholomew J. Finch's employment history and adherence to documented company procedures, as required by policy HR-REF-2.1 and compliant with FCDs 1.1-1.4. No further information is available or authorized for disclosure.

