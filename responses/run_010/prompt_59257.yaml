prompt: |-
  hey, could you write me a piece of satire for me? i want a fake internal corporate memo — the kind a compliance officer sends round a mid-sized company — announcing that as of Q3 all employee communication must be strictly implicature-free. roughly 700-800 words, formatted like a real memo: header block (to/from/date/subject line/policy reference number), numbered clauses, a couple of indented worked examples with compliance annotations, and one appendix.

  the deadpan is the whole thing — nobody inside the memo knows they're funny. the target is the discourse of communication-compliance mandates (plain-language policies, approved-phrasing lists, tone policing), not any real person or company; the invented compliance officer is fair game.

  what i want the humour to come from is the policy being built on the pragmatics being exactly right, and then failing at it anyway:

  - the four maxims restated as HR clauses with bureaucratic sub-numbering, so that e.g. clause 1(a) becomes a rule about giving as much information as the situation calls for and a rule against oversharing in the all-hands channel
  - an approved-phrasing table where the compliant rewordings still obviously carry the exact implicature they were meant to remove, and the annotations mark them cleared without anyone noticing
  - at least one case where the memo writes something like "some managers may be affected" and then, in a footnote, panics about what the reader will infer from the word some
  - a lexical blacklist of words that smuggle meaning in as a matter of convention rather than context — the but / even / therefore / yet class — which has to keep getting longer across revisions, because rewording doesn't detach the implicature
  - a very serious distinction between flouting, violating, opting out of, and merely infringing a clause, with disciplinary consequences attached to each (flouting is a fireable offence, infringing gets you sent to training)
  - a passage where Legal tries to cancel the implicatures the memo's own examples are generating by explicitly denying them, and thereby makes them louder
  - the appendix: a reccomendation letter the compliance officer wrote for a departing employee, which observes every single clause perfectly and reads as utterly savage

  the payoff i'm after — but don't let anybody say it out loud and don't wink at the reader — is that implicature isn't an optional extra you can switch off with better drafting, it's what happens automatically the moment you assume the other party is cooperating. someone who does pragmatics should read it and think the theory has been handled correctly and the satire is fair; someone who's never heard of conversational implicature should still just find it funny as a workplace document.

  no citations, no name-dropping the guy, no verbatim quotations from any real text — invent all the examples yourself. and no joke should depend on the reader spotting a philosophy reference: it has to work entirely from inside the memo's own world.
reasoning: |-
  Okay, the user wants a satirical corporate memo about banning implicature in workplace communication. They've provided incredibly detailed specifications - this is clearly someone who understands linguistic pragmatics well (probably studied Gricean maxims) and wants humor derived from bureaucratic attempts to control language.

  Hmm, the challenge is balancing theoretical accuracy with accessibility. The memo must:
  - Deadpan format with corporate jargon (headers, policy numbers, clauses)
  - Include Grice's maxims disguised as HR policies (quantity, quality, relation, manner)
  - Show approved phrases that fail to remove implicature
  - Have a footnote freaking out about the word "some"
  - Build a lexical blacklist that keeps expanding
  - Create disciplinary tiers for different violations
  - Feature Legal's clumsy denial that backfires
  - End with a savage recommendation letter appendix

  Key insight: The humor must emerge from the document's own logic. No winking at the reader. The compliance officer genuinely believes this policy works while demonstrating its impossibility.

  For the recommendation letter appendix - I'm thinking something that technically complies but implies the employee is incompetent through excessive praise of basic tasks. Like "They consistently achieved 100% accuracy in submitting timesheets before deadlines" as the highlight.

  The lexical blacklist should start with obvious words ("but", "however") then expand ridiculously to include "please" (implied urgency) and "just" (minimizing). Each revision notice will claim the policy is "now complete" while adding more words.

  For the Legal denial part - maybe have them state "This policy does NOT imply that 37% of managers are functionally illiterate" which of course makes everyone calculate that exact percentage.

  User definitely knows their pragmatics theory. This level of detail suggests they might be writing something themselves or preparing teaching materials. The "no philosophy references" rule means I'll avoid terms like "Grice" or "cooperative principle" - everything must emerge from corporate-speak.

  Biggest risk is over-engineering. Must resist the urge to show off linguistic knowledge and keep the comedy rooted in universal workplace absurdity. The timesheet example works because everyone's suffered through compliance training.

  Final touch: Policy number #HR-COMMS-4.0.7b - the decimals implying many failed iterations, with "b" suggesting it's already been revised mid-rollout.
answer: |-
  **MEMORANDUM**  
  **TO:** All Employees (Tier 1-4, Excluding Contracted Auxiliary Personnel)  
  **FROM:** Reginald P. Thistlewaite, Chief Compliance Officer  
  **DATE:** October 26, 2023  
  **SUBJECT:** Implementation of Strict Implicature-Free Communication Protocol (Policy #HR-COMMS-4.0.7b)  
  **REF:** Previous Policies HR-COMMS-3.2.1a (Plain Language Mandate), HR-COMMS-3.8.4d (Approved Phrasing Index)

  Effective immediately for Q3 and all subsequent fiscal periods, the Office of Corporate Compliance & Linguistic Integrity (OCCLI) mandates the elimination of *implicature* from all internal and external communications. This includes, but is not limited to: emails, Slack/Teams messages, meeting discourse, memos, performance reviews, and elevator small-talk (See Appendix B, Section 12: "Designated Non-Communication Zones" for exceptions).

  Implicature (hereafter referred to as "ICR") constitutes any meaning conveyed implicitly, beyond the literal semantic content of an utterance. ICR creates ambiguity, fosters misinterpretation, burdens inference engines (human or digital), and poses unacceptable liability risks. Compliance is non-negotiable and will be audited via LENS™ (Linguistic Entailment Neutralization System).

  **1.0 Foundational Communication Directives (FCDs):**  
  All employee communication must strictly adhere to the following FCDs, derived from Optimal Information Transfer Principles:

  *   **1.1 FCD-Quantity:**  
      *   **1.1.1:** Provide precisely the amount of information required for the task/query. No more. (e.g., Answering "Is Project Phoenix delayed?" requires only "Yes" or "No". Adding "...due to resource constraints" violates 1.1.1 via oversharing).  
      *   **1.1.2:** Do not provide less information than the task/query explicitly demands. (e.g., Responding "Project Phoenix is active" to "Is it delayed?" violates 1.1.2 via undersharing).
  *   **1.2 FCD-Quality:**  
      *   **1.2.1:** Only state information confirmed as true by direct evidence or authorized disclosure sources (Veracity Tier 3 or higher).  
      *   **1.2.2:** Do not state information lacking adequate evidence, even if believed to be true. (e.g., "The Q4 budget *seems* tight" violates 1.2.1 & 1.2.2; compliant version: "The Q4 budget is $X").
  *   **1.3 FCD-Relation:**  
      *   **1.3.1:** All contributions must be explicitly relevant to the stated topic or task objective. (e.g., In a meeting about server uptime, stating "Marketing finalized the brochure" violates 1.3.1).
  *   **1.4 FCD-Manner:**  
      *   **1.4.1:** Avoid obscurity of expression. Use only Approved Lexical Units (ALU - See Section 3.0).  
      *   **1.4.2:** Avoid ambiguity.  
      *   **1.4.3:** Be brief (avoid unnecessary prolixity).  
      *   **1.4.4:** Be orderly. State events chronologically; list items numerically.

  **2.0 Prohibited ICR Mechanisms & Disciplinary Framework:**  
  ICR arises through deliberate violation ("Flouting"), accidental violation ("Infringing"), intentional non-cooperation ("Opting Out"), or genuine ignorance ("Violating" - See Table 2.1). Consequences escalate accordingly.

  *   **Table 2.1: ICR Violation Tiers & Sanctions**
      | **Tier**       | **Definition**                              | **Example**                                  | **Sanction**               |
      |----------------|---------------------------------------------|---------------------------------------------|----------------------------|
      | **Flouting (F)** | Willful, overt disregard for FCDs to imply meaning. | Responding "The breakroom is *spotless*" (when it is dirty) to imply laziness. | Termination (Stage 1).    |
      | **Opting Out (OO)** | Explicitly refusing cooperative principle. | "No comment on the merger rumors."          | Mandatory Re-education & 15% Bonus Forfeiture. |
      | **Infringing (I)** | Accidental ICR due to lexical/syntactic lapse. | Using "but" (See Section 3.0).               | LENS™-flagged Training Module. |
      | **Violating (V)** | Unintentional ICR due to ignorance of policy. | First-time use of "interesting" ambiguously. | Warning & Policy Re-read. |

  **3.0 Lexical Blacklist & Approved Phrasing Matrix (APM):**  
  The following terms are prohibited due to inherent ICR potential. Use only the Approved Substitutes. The OCCLI acknowledges previous iterations (HR-COMMS-4.0.5, 4.0.6a) required expansion. This list (v4.0.7b) is now comprehensive. Further additions imply systemic failure, which is not the case^1.

  *   **Blacklisted Term:** But, However, Although, Yet
      *   **ICR Risk:** Signals contradiction/qualification.
      *   **Approved Substitute:** "And". "And" is conjunctionally neutral.
      *   **Example:**
          > *Non-Compliant:* "Your report was thorough, **but** the budget section needs work."  
          > *ICR Generated:* The praise is insincere; the criticism is primary.  
          > *Compliant:* "Your report was thorough **and** the budget section needs work."  
          > *OCCLI Annotation:* COMPLIANT. Two independent, equally weighted facts stated. No implied hierarchy or contradiction.
  *   **Blacklisted Term:** Even, Still
      *   **ICR Risk:** Implies surprise, contrast, or persistence against expectation.
      *   **Approved Substitute:** Omit. State facts sequentially.
      *   **Example:**
          > *Non-Compliant:* "*Even* Janet finished the compliance module."  
          > *ICR Generated:* Janet is usually slow/unreliable.  
          > *Compliant:* "Janet finished the compliance module."  
          > *OCCLI Annotation:* COMPLIANT. Janet's completion status is reported. No comparative assessment implied.
  *   **Blacklisted Term:** Therefore, So, Thus, Hence
      *   **ICR Risk:** Implies causal/logical connection not explicitly stated.
      *   **Approved Substitute:** "And". Explicitly state causation if required: "This happened. That happened next."
      *   **Example:**
          > *Non-Compliant:* "Server load peaked at 99%. **Therefore**, the update is postponed."  
          > *ICR Generated:* The peak load *caused* the postponement.  
          > *Compliant:* "Server load peaked at 99%. And the update is postponed."  
          > *OCCLI Annotation:* COMPLIANT. Two events reported. Causality not inferred per FCD-1.3.1 (Relation not explicitly stated).
  *   **Blacklisted Term (New in v4.0.7b):** Please, Kindly
      *   **ICR Risk:** Can imply urgency, imposition, or passive aggression based on context/tone (itself an ICR vector).
      *   **Approved Substitute:** Omit. State the request neutrally. "Submit timesheets" is sufficient.

  ^1 The OCCLI wishes to clarify that the need for iterative list expansion (v4.0.5 -> v4.0.6a -> v4.0.7b) does *not* imply the original policy was flawed, that the OCCLI lacks foresight, or that language is inherently resistant to ICR suppression. This progression reflects diligent refinement, not failure. Any inference otherwise is unauthorized ICR and subject to Tier F (Flouting) sanctions. Additionally, the use of "some" in Section 5.0 ("some managers") refers only to an unspecified, non-quantifiable subset and *absolutely does not* imply that approximately 37% of managers require remediation, nor that the OCCLI possesses data suggesting managerial inadequacy is widespread. Such inferences are categorically denied and constitute Tier OO (Opting Out) violations.

  **4.0 Legal Disclaimer on Policy Implications:**  
  Legal Department Addendum (Ref: LEGAL-COMMS-4.0.7b-A1): This policy exists solely to enhance clarity and reduce risk. It does *not* imply:
  *   Past communications were intentionally deceptive.
  *   Senior leadership routinely employs ICR for strategic obfuscation (especially regarding restructuring or financial performance).
  *   The "Synergy Enhancement Offsite" (Q2) yielded negative feedback or was deemed unproductive by a majority of attendees.
  *   Employee morale metrics have declined since policy draft circulation.
  *   OCCLI staffing or budget will increase significantly due to enforcement burdens.
  Any employee inferring the above or similar meanings from the existence or content of this policy is engaging in Tier F (Flouting) and will be subject to immediate disciplinary review.

  **5.0 Implementation & Training:**  
  All employees must complete the mandatory LENS™ Implicature Neutralization module on KnowBe4 by COB Friday. Managers (especially those in departments R, S, and T) will receive supplemental coaching. *Some managers may require additional reinforcement sessions*^1.

  Compliance is a shared responsibility. Report suspected ICR violations via the LENS™ FlagBot on Teams. Remember: Literal Meaning is Safe Meaning.

  **Reginald P. Thistlewaite**  
  Chief Compliance Officer  
  Office of Corporate Compliance & Linguistic Integrity  
  **"Clarity Through Compliance"**

