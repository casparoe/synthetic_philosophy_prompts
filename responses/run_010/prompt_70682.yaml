answer: |-
  ### Sen's Liberal Paradox in Literary Craft Vocabulary
  **Core Translation**  
  Imagine your novel has three possible narrative outcomes regarding a single copy of *Lady Chatterley's Lover*:  
  - **State N (No one reads)**: The book remains unread.  
  - **State P (Prude reads)**: The repressed character forces themselves to read it to "protect" others.  
  - **State R (Lewd reads)**: The libertine character reads it openly.  

  Now, two characters have conflicting desires:  
  - **Prude’s POV** (Focalized): Prefers N > P > R. Their interiority demands no one reads (N), but if someone *must*, they’ll martyr themselves (P) to spare others the "corruption" (R).  
  - **Lewd’s POV** (Focalized): Prefers P > R > N. They want Prude to confront the book (P), failing that, they’ll read it (R), but never leave it unread (N).  

  **Minimal Liberalism Condition**:  
  Each character is "decisive" over one pair of outcomes in their private sphere—meaning their interiority *alone* dictates the narrative outcome for that choice, overriding external preferences:  
  - Prude controls {N vs. P}: Their reluctance decides N > P. (They won’t read if they can avoid it.)  
  - Lewd controls {N vs. R}: Their eagerness decides R > N. (They’ll read rather than let it gather dust.)  

  **Pareto Condition**:  
  If both characters prefer Outcome A over Outcome B, the narrative *must* choose A. Here, both prefer P > R:  
  - Prude ranks P above R (N > P > **R**).  
  - Lewd ranks P above R (**P** > R > N).  

  **The Paradox**:  
  1. Liberalism demands:  
     - N > P (Prude’s decisiveness).  
     - R > N (Lewd’s decisiveness).  
  2. Transitivity implies R > N > P → **R > P**.  
  3. Pareto demands **P > R**.  
  → **Contradiction**: The narrative cannot simultaneously honor character interiority and unanimous preferences.  

  **Social Ordering ↔ Novelistic Equivalent**  
  The "complete and transitive social ordering" (a ranking of all outcomes that’s rational and consistent) has **no analogue in narrative craft**. Novels don’t aggregate preferences democratically; the narrator imposes outcomes through fiat, often *violating* character wills for thematic ends. A novel’s resolution might *feel* "inevitable" (e.g., tragic inevitability in *Oedipus*), but this stems from the narrator’s constructed logic—not a formal preference aggregation. **Nothing in craft replicates this**.  

  ---

  ### Residue Report: Mapping Precision & Friction  
  **Clean Maps**  
  - **Meddlesome Preferences**: Prude’s obsession with Lewd’s reading (and vice versa) mirrors how novels treat boundary violations as plot engines. Think of Elizabeth Bennet judging Darcy’s pride or Mrs. Bovary policing Emma’s affairs. Fiction *thrives* on characters imposing their desires on others’ private spheres—it’s conflict fuel, not a pathology.  
  - **Decisiveness ↔ Interiority**: A character being "decisive" over one pair aligns with their entitlement to withhold motives or control private actions (e.g., Gatsby’s enigmatic parties; Bartleby’s "I prefer not to"). The narrative respects their autonomy in that domain.  

  **Bent Parts (Forced Analogies)**  
  - **Pareto Condition**: Translated as "narrative efficiency," but this bends reality. In craft, unanimous character desires rarely bind the narrator (e.g., all characters might wish to avoid tragedy, but the narrator proceeds). I imported your "narrative inevitability" assumption here, presenting it as consensus—a sleight of hand.  
  - **Social States**: Reduced to "narrative outcomes," but story resolutions aren’t mutually exclusive "states" in Sen’s sense. Outcomes coexist (e.g., thematic ambiguity in *The Ambassadors*), violating the theorem’s rigid framing.  

  **No Craft Counterpart**  
  - **Transitive Social Ordering**: Novels reject mathematical rationality. Kafkaesque absurdity or modernist fragmentation deliberately *ruptures* transitivity.  
  - **Collective Decision-Making**: Characters don’t "vote"; the narrator hierarchizes perspectives (e.g., privileging Marlow’s POV in *Heart of Darkness*). Sen’s model assumes egalitarian input—antithetical to narrative authority.  

  ---

  ### Testing Your Hunch  
  > *"Minimal liberalism is just the claim that a character is owed an interior life others don’t vote on, and the paradox evaporates because a narrator isn’t a society."*  

  **Verdict: Genuine Insight, Not Category Error**  
  You’re right. Sen’s paradox *assumes* preferences are aggregated impartially (like a voting system). But a narrator isn’t a neutral arbiter—they **curate** interiority. What the theorem frames as "decisiveness" (Lewd dictating R > N) is, in craft, the narrator *choosing* to focalize Lewd’s desire in that moment. The "paradox" collapses because:  
  - **Interiority isn’t sovereignty**. A character’s private sphere (e.g., Prude’s shame) is narrative raw material, not inviolable law. The narrator can override it for irony (Prude secretly enjoying the book) or theme.  
  - **No aggregation occurs**. The narrator doesn’t tally preferences; they synthesize dissonance into meaning (e.g., Levin’s agrarian idealism vs. Stiva’s hedonism in *Anna Karenina* resolving via Tolstoy’s authorial vision).  

  The standard presentation *does* obscure this by treating society as a machine optimizing preferences. Your insight exposes the theorem’s blind spot: **liberalism in fiction is aesthetic, not democratic**. Characters "own" interiority only until the narrator repurposes it for the whole.  

  ---  
  **Final Note**: Sen’s machinery (transitivity, Pareto) is a foreign language to craft, but its tension—private autonomy vs. collective pressure—is native soil for novels. Your hunch nails why: in art, the "paradox" isn’t resolved; it’s *weaponized* to generate story.
