prompt: |-
  I'm running a 40-minute evening session for a reading group that's mostly non-philosophers, and the awkward bit is the mix: three of them are CBT practitioners who've been trained to treat an emotion as basically a bundle of appraisals and beliefs you can dispute, one is a method actor who's convinced it's all felt bodily states you can't fake, and the rest are just curious. Whiteboard, no readings, no slides, and I've been told not to spend more then a few minutes on names and -isms.

  What I want from you isn't the explanation — it's the plan for it. Specifically: what has to be in place before the three-way question (is an emotion a judgment, a perception of the body, or just a feeling?) is even a live question for this room; which single case carries the whole thing, and what that case needs to have and mustn't have; where in the sequence the CBT people and the actor will collide and how I make the collision do the work instead of refereeing it; the misconceptions I should expect (I'm bracing for "if emotions are judgments you could argue somebody out of being frightened" and "the Jamesian view just means fake it till you make it") and the exact beat at which to head each one off; and what I should say out loud that I'm leaving out for the night.

  The case I keep coming back to — tell me if it works or if you'd swap it: a man who's been short with everyone at work for a week, snaps at a colleague over nothing, and when his partner says you're angry about the thing with your brother, he honestly says he isn't, feels fine, and can't point to anything he's judging to be an offense. Then three days later, out of nowhere, he's furious, and can't say what changed. I want one case that splits three ways rather than a parade of examples, so if you've got a better one use yours and say why in a clause.

  Format: give me the plan as exactly five numbered beats in the order I'd run them, one or two sentences each, no intro and no wrap-up paragraph. Each beat should say what I do and what goes wrong in the room if I skip it. Make the fifth beat the exit check — the one question I put to the room to see whether they've actually got the distinction rather than just enjoyed the story — and fold the "here's what we're bracketing tonight" into it.
reasoning: |-
  Okay, the user is running a 40-minute session for a mixed group, mostly non-philosophers, including CBT practitioners and a method actor. They need a focused plan that avoids deep theory and uses a single case study to explore whether emotions are judgments, bodily perceptions, or feelings. 

  First, I need to establish a common understanding of what an emotion is. Without this, the group might talk past each other. The CBT folks might jump straight to disputing thoughts, while the actor focuses on physical sensations. So, Beat 1 should make them define an emotion without jargon, using everyday examples to create a shared baseline. Skipping this could lead to immediate fragmentation.

  Next, the case study. The user’s example of the man who denies anger but later explodes seems solid—it has delayed awareness and bodily cues (tense shoulders), which lets each perspective interpret it. But I should ensure it doesn’t lean too heavily on one view. The CBT angle: appraisals might be unconscious. The actor: body tension as precursor. The feeling view: the sudden fury as inexplicable. If the case were simpler (e.g., immediate anger), it wouldn’t create tension between theories. 

  The collision point between CBT and the actor needs to feel organic. Beat 3 forces them to confront why the man denied anger initially. The CBT group will say he wasn’t aware of his appraisals; the actor will say he ignored bodily signals. I’ll steer them to see these aren’t mutually exclusive—maybe both are part of emotion. If I skip this, they might just debate instead of revealing the complexity. 

  Anticipating misconceptions is crucial. The user mentioned fears like "arguing someone out of fear" or "fake it till you make it." These should be addressed right after the collision (Beat 4), using the case. E.g., the man couldn’t be reasoned with initially because appraisals were subconscious—countering the first misconception. For James, the actor might say "faking" body changes isn’t possible, so it’s not about pretending. 

  Exit check: Ask which element (judgment, body, feeling) feels irreducible in the case. This tests if they grasp that all three might be necessary. Fold in bracketed topics here—e.g., we’re not discussing how to change emotions tonight. If skipped, I might miss that they oversimplified the answer. 

  The user’s case works well because it has ambiguity—denial, physical signs, delayed reaction—which each theory can dissect. A simpler case (e.g., crying when sad) wouldn’t create the same friction. Alternative could be someone with panic attacks misinterpreting heart palpitations, but it might skew too medical. Their case is more relatable for a general group. 

  Timing: 40 mins is tight. Beats 1-2 (~15 mins), Beat 3 collision (~10 mins), Beat 4 misconceptions (~10 mins), Beat 5 exit (~5 mins). Need strict facilitation to avoid tangents. 

  Underlying needs: The user likely wants the group to leave with nuanced curiosity, not a "winner" theory. They also want minimal referee work—so designing the collision to reveal insights naturally is key. Unspoken: They might fear the CBT/actor clash derails things, so the plan must harness that energy productively.
answer: |-
  Here’s your five-beat plan:

  1. **Define "emotion" operationally using neutral examples (e.g., "You slam the door – what just happened?").**  
     *If skipped:* The group lacks a shared baseline; CBT/actor clash prematurely over definitions instead of substance.

  2. **Present the case: Focus on his denial ("*I’m not angry*") despite snapping, then delayed fury ("*out of nowhere*"). Ask: "Was he angry before he said he was? What changed?"**  
     *If skipped:* No shared puzzle exists; theories get debated abstractly, not tested against lived ambiguity.

  3. **Force interpretation clash: Ask CBT: "What hidden appraisal might explain his denial?" Ask actor: "What bodily state might he have ignored?" Let them debate *why* he couldn’t access his anger.**  
     *If skipped:* CBT defaults to "unconscious beliefs," actor to "suppressed sensation" – but they don’t see how their models conflict/overlap.

  4. **Preempt misconceptions *during clash*: When CBT says "dispute beliefs," counter: "Could he dispute what he couldn’t name?" When actor cites body, ask: "Is simulating tension enough to *be* angry?"**  
     *If skipped:* "Arguing out of fear" or "fake it till make it" myths persist; group misses the role of access/awareness.

  5. **Exit check: "If you had to pick *one* irreplaceable element – judgment, body sensation, or raw feeling – to explain his delayed fury, which forces the best insight? *Tonight we’re bracketing how to change emotions.*"**  
     *If skipped:* You won’t know if they grasp the tension between frameworks; they may leave thinking it’s resolvable by just one view.

  **Why your case works:** It hinges on *denial + delayed eruption*, forcing explanations for unconscious appraisal (CBT), unattended physiology (actor), or ineffable feeling shifts (feeling-view). Avoid cases with obvious triggers or immediate awareness – they won’t split cleanly.
