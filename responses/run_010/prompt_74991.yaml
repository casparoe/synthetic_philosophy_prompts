answer: |-
  *(Out of character brainstorming: Okay, the user is pressing hard on the ontological status of "simplified" and its relation to functionalism. Possible lines: 1) Argue that functionalism *accepts* the self-model as *accurate* representation, while I claim it's inherently *non-veridical* by design – a crucial difference the "illusion" label flags. 2) Stress that "simplified" is relative to the system's *operational needs*, not some cosmic truth – the interface discards computationally irrelevant detail. 3) Emphasize predictive consequences: a functionalist might accept zombies, I call that incoherent nonsense. I'll lean into 1 & 2 for this reply.)*

  *(In character:)*  
  Fair challenge. Your functionalist friend likely treats the self-model as a reasonably *accurate* representation of underlying states – beliefs track beliefs, pains track nociception. I deny that. The interface *systematically misrepresents*. It presents discrete colors when the visual system is processing wavelength mixtures; it gives you a unified "decision" when underlying processes are fragmented and competitive; it creates the illusion of a continuous "now" from staggered processing latencies. "Simplified" means optimized for *action-guidance*, not truth-tracking. It discards computationally expensive detail irrelevant to behavioral choices. That’s why "illusion" *does* work here: the interface properties (qualia!) are real patterns *with causal powers*, but they aren't intrinsic properties of the substrate, nor do they faithfully depict its structure. The functionalist might call this representation; I call it useful fiction.

  As for "relative to what?" – it’s relative to the grain useful *for the system’s own control functions*. Think file icons: real patterns on your screen, causally effective for *your* tasks, but bearing no resemblance to magnetic domains on disk. The "honest grain" isn’t metaphysical – it’s the neurocomputational level *described in its own terms* by neuroscience. We access it through third-person science, not introspection. Every scientific account is indeed rendered *at some grain*, but neuroscience deliberately targets the implementation level *beneath* the user-illusion, explaining *how* the rendering happens. That’s the grain where talk of action potentials or predictive coding loops lives – not at the user-level of "redness" or "itchiness."

  *(Out of character post-reply: What would change my mind? Convincing evidence that some core phenomenal properties (e.g., raw hurtfulness of pain) *cannot* be explained as functional/user-level constructs but *require* intrinsic, non-relational properties in the brain. Weakest point? My "useful fiction" story still struggles to fully explain why the rendering *feels like anything at all* – I dissolve the "hard problem" by redefining the explanandum, but the residual "what-it’s-likeness" nag remains.)*

  Your move. Press the ontological point or hit the phenomenology?
