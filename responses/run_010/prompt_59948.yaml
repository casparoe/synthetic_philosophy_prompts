prompt: |-
  Forty-odd years in renal physiology, retired two springs ago, and now I spend my afternoons reading political ethics instead of napping, which my wife says is progress. Currently stuck on corruption — what makes a gift a bribe rather than a courtesy. My complaint with the literature is that everybody argues from anecdotes, and anecdotes have a dozen variables moving at once. In my line of work you change one thing and hold the rest fixed or you've learned nothing. So build me a controlled case.

  What it's for: I want to know whether all this talk about abuse of office and captured roles is doing real work beyond the plain old exchange requirement, or whether it's the same requirement wearing a nicer hat. That's the standard for whether you've cheated.

  Specs. Realistic modern setting — a licensing office, a public hospital, a school district buying something. No cartoon villains, no politicians on yachts. The official is competent, sincere about their own motives, and the decision they eventually make is genuinely defensible on the merits. One paragraph per case. Label the four accounts up front so we're not sliding around: the exchange account (corruption needs a benefit traded for a misuse of the office), the private-gain account (abuse of entrusted power for private benefit, deal or no deal), the role-integrity account (the wrong is letting the office's own purposes be captured by a personal relationship, gain not required), and the conventionalist account (what counts depends on the norms actually in force in that setting).

  Case A: a person with business before the official gives them something of real but not enormous value, no request attached, no expectation of return on either side, nothing said and nothing implied. Exchange account says not corruption; private-gain says corruption; role-integrity says corruption and worse than the private-gain account admits. Amount, secrecy, identity of the giver, the decision and its defensibility stay absolutely fixed across every version.

  Case B: same facts, except the gift sits inside a local custom that is simply recieved as part of how that office works, and that even reform-minded locals don't treat as improper. Conventionalist now says not corrupt. The part I actually care about: the two not-corrupt verdicts in A and B must not be the same no — different accounts, different reasons. Then give me the minimal edit to B that flips the conventionalist to corrupt while the exchange account still says not corrupt. If you can't do it, say so and tell me what that shows.

  Then the writeup: which feature of the case is doing the work — the expectation of return, the secrecy, the value, the fact that some third party got passed over, or the norms of the office itself. Run the ablations and report which account moves on each: make the gift public, make it trivial, make it reciprocated in fact years later. Then give me the best attack the exchange-account defender can make on my design, and say whether I should just loose that argument. Finish with whether any of this survives when you run the identical facts in a setting where the norms are supposed to be strict — is the cultural frame load-bearing or decoration?

  And don't smuggle the verdicts in through the back door. If your case has a hidden deal or a wink in it, own up to that, because a scenario that stipulates what each account says instead of generating it from the account is worthless to me.
reasoning: |-
  Okay, let me approach this systematically. The user presents a complex challenge requiring careful construction of controlled cases to test different theories of corruption. Their background in renal physiology suggests they value methodological rigor - changing one variable while holding others constant, just like in scientific experiments.

  Hmm... the core question is whether "abuse of office" adds anything beyond simple quid pro quo exchanges. The user wants four accounts clearly distinguished: exchange, private-gain, role-integrity, and conventionalist. They're frustrated with anecdotal approaches in ethics literature.

  First, I need to design Case A where all elements are fixed except the theoretical lens. The gift must have no attached expectations - this is crucial to isolate the variables. A licensing officer scenario seems ideal: realistic, mundane, and avoids "cartoon villain" stereotypes. The gift should be substantive but not outrageous - perhaps high-end theater tickets worth $300. The decision must remain defensible regardless of the gift.

  For Case B, I'll add a cultural norm where such gifts are customary during festival seasons. This tests conventionalism without altering other factors. The minimal edit to flip conventionalist while keeping exchange "not corrupt" requires introducing evidence that the practice is newly contested - maybe audit findings or public criticism.

  Now for the ablations:
  - Making the gift public: This might satisfy role-integrity concerns about transparency but not address capture
  - Trivial value: Private-gain might flip if benefit is negligible
  - Reciprocal gift years later: Exchange account would still see no corruption without contemporaneous deal

  The toughest challenge is defending the exchange account against the user's design. The best counterargument is that cultural context inherently shapes expectations - what looks like "no expectation" in Case A might actually imply unspoken understanding. But this risks conceding to conventionalism.

  Finally, testing in strict-norm settings: When formal rules prohibit all gifts, conventionalism collapses but other accounts diverge. Role-integrity still objects to relationship capture, while private-gain focuses on the benefit itself.

  Throughout, I must avoid smuggling in hidden deals. The gift-giver's identity (longtime acquaintance) creates tension but shouldn't imply collusion. The defensible decision is key - if the license approval were questionable, it would contaminate all accounts.
answer: |-
  Here are your controlled cases and analysis, designed per your specifications. All accounts are applied to identical core facts: **Officer Chen (competent, sincere) approves a defensible restaurant license for Ms. Alvarez, who then gives Chen a $300 bottle of single-malt scotch "in appreciation." No words, winks, or prior requests exchanged. Chen accepts. The decision was merit-based and identical would occur without the gift.**

  **Case A (No Established Custom):**  
  *Exchange Account:* **Not corrupt.** No *quid pro quo* agreement (explicit or implicit) exists; no benefit traded for misuse of office.  
  *Private-Gain Account:* **Corrupt.** Chen abuses entrusted power by accepting significant private gain ($300) linked to an official act, regardless of deal.  
  *Role-Integrity Account:* **Corrupt (and worse).** The gift personalizes an impersonal public role. Chen’s judgment is captured by Alvarez’s gesture, corrupting the office’s purpose regardless of gain or deal. The relationship contaminates the role.  
  *Conventionalist Account:* **Uncertain/Corrupt.** Absent clear local norms permitting this, it appears as improper influence.  

  **Case B (Established Custom):**  
  *Exchange Account:* **Not corrupt.** (Same as A: no deal).  
  *Private-Gain Account:* **Corrupt.** (Same as A: personal gain received).  
  *Role-Integrity Account:* **Corrupt (and worse).** (Same as A: role capture occurs even if normalized).  
  *Conventionalist Account:* **Not corrupt.** The gift occurs during a widely accepted annual "gratitude season" for license approvals, documented in local press and uncontested by reformers. It’s seen as harmless tradition.  

  **Minimal Edit to Flip Conventionalist in B (Exchange Still "Not Corrupt"):**  
  *Edit:* **A credible local anti-corruption NGO publishes audit data showing businesses giving "customary" gifts receive licenses 15% faster than non-givers, sparking public outcry and calls for investigation.**  
  *Why it flips:* The norm is now contested and linked to tangible differential treatment, making it "improper" in evolving conventions. Exchange account still sees no *quid pro quo* agreement.  

  ---

  ### Analysis of Feature Ablations (Holding Core Fixed):  
  1. **Gift Made Public (Disclosed):**  
     - *Exchange:* Unchanged (no deal).  
     - *Private-Gain:* **May weaken but persists** (gain still received, though transparency reduces suspicion).  
     - *Role-Integrity:* **Unchanged** (disclosure doesn’t negate relationship capture).  
     - *Conventionalist:** **Strengthens "not corrupt" if norm accepts transparency** (e.g., B’s custom includes disclosure).  

  2. **Gift Made Trivial ($5 coffee mug):**  
     - *Exchange:* Unchanged (no deal).  
     - *Private-Gain:* **Flips to "not corrupt"** (gain too minor to constitute "private benefit").  
     - *Role-Integrity:* **Unchanged** (symbolic capture still occurs).  
     - *Conventionalist:** Unchanged (depends on norm).  

  3. **Gift Reciprocated Years Later (Chen sends Alvarez wine):**  
     - *Exchange:* **May flip to "corrupt"** if reciprocation implies deferred exchange.  
     - *Private-Gain:* Unchanged (gain already received).  
     - *Role-Integrity:* **Strengthens "corrupt"** (confirms enduring personal bond overriding role).  
     - *Conventionalist:** Unchanged (norms govern initial act).  

  ### Key Feature Doing the Work:  
  - **Expectation of return** drives *Exchange*.  
  - **Value/benefit** drives *Private-Gain*.  
  - **Personalization of role** drives *Role-Integrity*.  
  - **Contestedness of norm** drives *Conventionalist*.  

  ### Best Attack on Your Design (Exchange Defender):  
  *Attack:* "Your 'no expectation' stipulation is artificial. In real social dynamics (especially in B’s custom), the gift *creates* implicit obligation, making 'no deal' impossible. You’ve defined away the core mechanism of exchange by fiat."  
  *Should you concede?* **Partially.** Social psychology suggests gifts often create subconscious reciprocity. However, your design validly tests *explicit or consciously bargained* exchanges. Concede that *implicit* expectations might undermine the "no deal" premise, but hold that strict exchange requires evidence of mutual intent.  

  ### Strict-Norm Setting Test (Identical Facts):  
  Apply to a Danish public hospital procurement officer (strict EU anti-gift laws).  
  - *Exchange:* Still "not corrupt" (no deal).  
  - *Private-Gain:* **Corrupt** (gain received, strict rules make any benefit improper).  
  - *Role-Integrity:* **Corrupt** (role capture unchanged).  
  - *Conventionalist:* **Corrupt** (norms explicitly forbid all gifts).  
  *Conclusion:* **Cultural frame is load-bearing for Conventionalist only.** Private-Gain and Role-Integrity still condemn the act under strict norms, while Exchange still absolves absent a deal. Role-Integrity’s "capture" critique survives independently.  

  ### Final Verdict on "Abuse of Office":  
  Your cases confirm **role-integrity and private-gain do work beyond exchange**. They condemn acts exchange theory excuses (A and B), with role-integrity highlighting a distinct harm (institutional capture). Conventionalist verdicts are entirely norm-dependent. Exchange theory’s narrow focus misses these dimensions unless stretched to include implicit deals—but that risks collapsing into conventionalism.
