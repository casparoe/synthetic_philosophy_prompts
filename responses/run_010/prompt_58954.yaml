prompt: |-
  Ok, so I need help and I should tell you upfront I'm not a writer and I never took a philosophy class past one semester at the community college that I dropped, so this is going to come out messy. I've been turning the same thing over in my head for like three weeks now and I can't get it into a shape you can say out loud in front of people.

  First, the role thing: act like you're someone who teaches ethics for a living but also writes speeches on the side — somebody who can hold an idea and a room in their head at the same time. Think carefully before you write anything. Start with a short brainstorm where you list maybe four different things this speech could actually be *doing*, say which one you'd pick and why, and then write the speech. Keep the brainstorm tight, I mostly want the speech.

  The occasion. My daughter Maya leaves Tuesday for a program out east, full ride, first person in my family to go anywhere like that. Sunday night the town is throwing her a send off at the Legion hall, about 70 people, bad acoustics, everyone will be talking.

  Half the room is my side of the family. Norwegian farm people, been here four generations, and I grew up inside what we called the Jante rules — some Scandinavian novelist made up a town and wrote down its ten rules, you know the general idea: don't think you're special, don't think you're better than us, don't think anybody cares about you. My mother is 84 and she runs on that harder than anyone. The other half is her friends, her track coach, and the town booster crowd, and they run on the opposite rule: if you made it you made it because you wanted it more, and the whole point of the story is that anybody could.

  Here's what I can't solve. Those two sound like opposites but I've started thinking they're the same machine pointed in two directions, and neither one has a slot for what my kid actually is.

  - Jante polices the *claim*. My mom doesn't care that Maya is good at something. She cares that nobody says so out loud and starts acting entitled.
  - The booster thing polices nothing, it just hands out credit and calls it a lesson.
  - And then there's the Australian one I looked up, cutting down the tall poppies, and that's a third thing again, because that one is about what the *crowd* does to you. It's not a rule you follow, it's a thing that happens to you.

  So one of these is a belief, one is a reward, one is a punishment, and they all get talked about like they're the same complaint about people who think they're better than you. Maya doesn't do any of them. She doesn't claim anything — she also isn't modest about her work, she'll talk your ear off about it for an hour, she is loud about loving it, she just doesn't think the loving puts her above anybody. She displays without claiming. I think that's a real third category and nobody in that hall has a word for it, which is exactly why half of them will find her obnoxious and half will find her wasted.

  The other thing, and I don't know if I should say it out loud or not, you tell me. She's studying prairie potholes. The wet ones. What they filter, what they hold. My mother drained every pothole on two sections of land in the sixties to make the ground farmable, and she's proud of it, and she should be, it fed everybody. So the town is throwing a party for a girl who is going to go get a degree in the thing her grandmother spent her life getting rid of, and nobody is going to mention it, and I've got a feeling the honest speech has to touch it somehow without turning it into a funeral.

  Also she's honest about luck. Every single time — her high school happened to have a teacher who happened to know a guy, etc. Half the room hears that as her being humble, which flatters them. The other half hears it as her refusing to take credit for her own life, which offends them. Both are wrong and I don't know how to say that to people eating potato salad in five minutes.

  So, the speech. I'm giving it. Requirements:

  1. Don't embarrass her. She hates being the subject of a sentence.
  2. No fake humble. Don't put in "she'd be the first to tell you she's nothing special," because she would never say that and it's a lie dressed as a compliment. My mom would hear it as a proper Jante move, Maya would hear it as me throwing her under the bus, and they'd both be right.
  3. No booster stuff either. No "she earned every bit of this," no "proof that if you want it bad enough." She thinks that's false and I think its cruel to the kids in the room who wanted it just as bad and didn't get the teacher.
  4. Make the third-category point — display without claiming — but make it invisible as a point. Nobody in that hall should be able to tell I'm doing philosophy. It has to land as a story about her, or about my mom, or about the drained land, with the idea holding it up from underneath.
  5. Give my mother something true and give my daughter something true, ideally in the same breath. This is probably the last big thing my mom comes to. I don't want her sitting there thinking we've all gone soft, and I don't want her to be right that we have.

  One thing I want you to actually wrestle with instead of just agreeing with me: I keep feeling like any speech that celebrates her is taking something away from somebody else in that room — the kid who didn't get in, my brother who never left, my mom who worked harder than Maya ever will and got nothing for it — and that the only honest speech is one that mostly talks about them. Maybe that's just Jante talking through me in my own voice. Tell me in the brainstorm whether you think I'm right about that, and if you're not convinced, don't write the speech that way.

  Last stuff: no quotes from famous people, no "as Eleanor Roosevelt once said." If there's an authority in this speech it should be my grandmother or the coach or the gravel out by the section line, not a dead person with a wikipedia page. And read it out loud once before you send it — anything I can't say in one breath gets cut.
