prompt: |-
  I chair the data-governance committee for a mid-size freight brokerage — five of us: two analysts, an ops manager, a claims lawyer, and me. Every week we get maybe six requests to change a definition in the business glossary (transit time, on-time, active shipment, accessorial, detention), and the meetings go badly in a predictable way. Half the time somebody says it's just a matter of what we decide the word means, so there's nothing to argue about. The other half somebody says no, there's a fact of the matter about what our operations actually are and the definition should track it. We can never agree on which kind of dispute we're in, and we burn fourty minutes on things that should take five.

  Write a triage procedure the committee can run on one request in about twenty minutes, grounded in whatever the analytic/synthetic debate really supports — including the argument that there's no clean line between the two, and the point that you can't end a disagreement just by declaring the sentence true by definition. I want the questions in order with a stated pass condition for each, a workable rule for telling "we stipulate this, and here's what makes one stipulation better than another" apart from "there's evidence bearing on it," something about how entrenched a definition is and what a revision cascades into downstream, and an explicit handoff for the ones that are really about who eats a cost rather than about truth. End each run at one of three exits: approve the change, reject it, or send it to whoever owns the P&L because it was never our call.

  Then run it on three cases: whether on-time is measured against the appointment window in the tender or against what the customer says they expected; whether a shipment cancelled and rebooked under a new pro number counts as one shipment or two, where the answer moves our published volume by about 4%; and whether a driver waiting 45 minutes at a dock is detained and therefore billable. At least one of them should land somewhere I won't like — I've spent two years defending our current detention definition, so don't soften it if it turns out I've been treating an empirical claim as a stipulation.

  Mark every place where the procedure is a judgment call wearing a lab coat, and close with what it can't do.
reasoning: |-
  We are going to design a triage procedure grounded in the analytic/synthetic distinction and the recognition that the line is blurry. The procedure will have a series of questions with pass conditions, and each request will be evaluated in about 20 minutes. The goal is to end at one of three exits: Approve the Change, Reject the Change, or Send to P&L Owner.

  Key principles:
  1. Analytic statements are true by definition (stipulative) and synthetic statements are about the world (empirical). But in practice, definitions can be revised and may have empirical consequences.
  2. We need to consider the entrenchment of a definition (how widely accepted and used it is) and the downstream impact (what systems, reports, contracts, etc., depend on it).
  3. Some disputes are really about cost allocation and should be handed off to the P&L owner.

  Procedure Steps (with pass conditions and rules):

  1. **Question 1: Is the request about a term that is currently undefined?**
     - Pass condition: If yes, then go to step 2. If no, go to step 3.
     - Rationale: New terms are easier to define without conflict.

  2. **Question 2: For a new term, can we agree on a stipulative definition without empirical implications?**
     - Pass condition: If we can agree on a definition that doesn't conflict with existing operations and has minimal downstream impact, then Approve the Change. Otherwise, go to step 5 (handoff to P&L if cost is involved) or step 4 (if it's empirical but we can't agree).
     - Rule: A good stipulation is one that is clear, consistent with similar terms, and doesn't create confusion. If there are multiple options, choose the one that aligns with industry standards or common usage in the company.

  3. **Question 3: For an existing term, is the proposed change purely stipulative (i.e., does it not claim to reflect a change in operations)?**
     - Pass condition: If the proposer agrees that the change is purely to clarify or adjust the definition without asserting that it better reflects reality, then go to step 4. If the proposer claims the current definition is factually inaccurate, go to step 5.
     - Rule: We must separate the act of redefining from the claim that the current definition is wrong. If it's purely stipulative, we can change it but must consider entrenchment and downstream impact.

  4. **Question 4: How entrenched is the current definition and what is the downstream impact of changing it?**
     - Pass condition: Evaluate:
       - Low entrenchment (term is new, rarely used, or only in one system) and low downstream impact (few reports, no contracts, no KPIs): Approve the Change.
       - Moderate to high entrenchment or downstream impact: Reject the Change unless there is a strong reason (like industry standard change) that outweighs the cost. If the cost of change (in time, money, confusion) is high and the benefit is low, reject. If the change has significant cost implications (who bears cost) then go to step 5.
     - Rule: A definition is entrenched if it is used in multiple systems, reports, contracts, or KPIs, and has been in place for a long time. Downstream impact includes any system that uses the term, any report that uses it, any contractual obligation, or any decision-making process.

  5. **Question 5: Is the dispute about an empirical claim (i.e., what the operations actually are) or about cost allocation?**
     - Pass condition:
       - If it's about an empirical claim (e.g., "our operations do X, so the definition should be Y"), then we must gather evidence. But since we are a governance committee and not operational, if we cannot resolve with available evidence in 10 minutes, then Reject the Change (because we lack the mandate to investigate) OR send to an operational team for investigation and then return? However, our procedure must be quick. Alternative: if the dispute is empirical and we can't resolve, then Reject the Change (uphold status quo) unless the proposer can show clear evidence of misalignment. But note: we are not investigators. So we set a bar: if the proposer provides clear, documented evidence (e.g., a process document, system screenshot, or data sample) that the current definition does not match operations, then we can consider. Otherwise, Reject.
       - If the dispute is about cost allocation (e.g., changing the definition will shift cost from one party to another, or affect revenue recognition), then go to step 6.

  6. **Question 6: Handoff to P&L Owner.**
     - Pass condition: If the change has significant cost, revenue, or liability implications, then exit with "Send to P&L Owner".

  The procedure in order:

  1. Is the term new (undefined)? 
     - Yes: Go to 2.
     - No: Go to 3.

  2. (For new term) Can we agree on a stipulative definition without empirical implications?
     - Yes: Then Approve the Change (if low downstream impact is assumed for new terms, but we might still check if the definition might conflict with existing terms? We can do a light version of step 4 for new terms: consider potential downstream impact and entrenchment of similar terms. But for simplicity, if we agree and it's new, approve. If there's a concern about impact, then go to 4 even for new terms? To save time, we'll assume new terms have low entrenchment, but we must consider downstream impact. So after step 2, we do step 4 for new terms as well? Let's adjust: step 2 is only for agreeing on the definition. Then we go to step 4 for the impact assessment. But step 4 is designed for existing terms. We'll have step 4 for both, but for new terms, entrenchment is low by default. So we can do step 4 after step 2 and step 3.

  Revised flow:

  1. New term? 
     - Yes -> 2
     - No -> 3

  2. (New term) Agree on stipulation? 
     - Yes -> 4 (to assess impact, but since new, entrenchment is low, so we focus on downstream impact)
     - No -> 5 (if we can't agree, it might be because of empirical or cost issues, so jump to 5)

  3. (Existing term) Is the change purely stipulative? (i.e., no claim about operational reality)
     - Yes -> 4
     - No (it is claimed that the current definition is factually wrong) -> 5

  4. Assess entrenchment and downstream impact (for both new and existing terms, but for new, entrenchment is low). 
     - For existing: 
          Low entrenchment and low downstream impact -> Approve
          Otherwise: if the change is low cost to implement and high benefit, then Approve; else Reject. But if the change has cost implications (e.g., shifts cost), then go to 5? Actually, step 4 should consider: if the change has cost implications (even if stipulative) then we must handoff. So:
          - If the change has cost, revenue, or liability implications (even if stipulative) -> 6
          - Else if low entrenchment/impact -> Approve
          - Else (high entrenchment/impact and no cost issue) -> Reject (unless there's a strong reason, e.g., industry standard change, but then we might still need to consider cost) -> in practice, if high impact, we reject unless there's a compelling non-cost reason? But the procedure must be strict.

     We need a rule: in step 4, if the change (even stipulative) would affect cost, revenue, or liability, then go to step 6. Otherwise, if entrenchment/impact is low, Approve. If high, then Reject.

  5. Is the dispute about an empirical claim or cost allocation?
     - Empirical: If the proposer provides clear, documented evidence (within the meeting) that the current definition does not match operations, then go to step 4 (to then consider changing it, but now with evidence). But if we get to step 5, it's because the change is not purely stipulative (for existing terms) or we couldn't agree on a new one. So for empirical: 
          - If evidence is provided and it is clear and convincing (in 10 minutes of discussion), then go to step 4 (to assess impact of changing to the new definition that aligns with operations). 
          - If no clear evidence is provided, then Reject the Change (uphold current).
     - Cost allocation: Go to step 6.

  6. Send to P&L Owner.

  Alternatively, to avoid loops, we can structure step 5 for empirical claims as: 
     - If the committee agrees that the evidence shows misalignment, then go to step 4 (to change the definition to match operations, but then step 4 will check impact and cost implications). But step 4 already checks for cost implications? So if step 5 (empirical) leads to step 4, then step 4 might then lead to step 6 if there are cost issues. That's acceptable.

  But note: the goal is to finish in 20 minutes. We cannot have multiple loops. So we must be strict on evidence in step 5.

  Summary of Steps:

  1. **New Term?** 
     - Yes: Go to 2.
     - No: Go to 3.

  2. **Can we agree on a stipulative definition for the new term?**
     - Yes: Go to 4.
     - No: Go to 5.

  3. **For existing term: Is the proposed change purely stipulative?** (i.e., no claim that the current definition is factually wrong; we are just redefining for clarity or preference)
     - Yes: Go to 4.
     - No: Go to 5.

  4. **Assess entrenchment and downstream impact, and check for cost implications:**
     - If the change (even if stipulative) would affect cost, revenue, or liability: Go to 6.
     - Else:
          - For new term: by default low entrenchment, so check downstream impact.
          - For existing term: assess entrenchment (high if used in multiple critical systems/reports/contracts) and downstream impact (how many systems/reports would need change?).
          - If low entrenchment and low downstream impact: Approve the Change.
          - If high entrenchment or high downstream impact: Reject the Change (because the cost of change outweighs the benefit of a stipulative change, unless there is a very strong reason, but we don't have that in the procedure; we can note that if there is a strong reason like industry standard, we might still approve, but that would be rare and we don't want to overcomplicate; so Reject).

  5. **Empirical claim or cost allocation?**
     - If empirical: 
          - Is there clear, documented evidence (provided in the meeting) that the current definition does not match actual operations? 
              - Yes: Go to 4 (to consider changing to a definition that matches operations, but then step 4 will check for cost implications and impact).
              - No: Reject the Change (uphold current).
     - If cost allocation: Go to 6.

  6. **Send to P&L Owner.**

  Now, we run three cases:

  Case 1: Whether "on-time" is measured against the appointment window in the tender or against what the customer says they expected.

  Case 2: Whether a shipment cancelled and rebooked under a new pro number counts as one shipment or two (affects volume by 4%).

  Case 3: Whether a driver waiting 45 minutes at a dock is detained and therefore billable.

  We'll run the procedure for each.

  **Case 1: On-time definition**

  1. New term? No (existing) -> go to 3.
  2. Step 3: Is the change purely stipulative? 
     - The proposer might say: "We should change because the customer expectation is what matters." This implies that the current definition (tender) does not match what is important (hence, it's an empirical claim about what matters). Or they might say: "We are redefining for consistency with industry." If the latter, then stipulative. But typically, this is a dispute about what should be the basis. 
     - Let's assume the proposer says: "Our operations are such that we have two measures: one in the tender and one that the customer sometimes reports. We want to change to customer expectation because that's what we are really being judged on." This is an empirical claim? Not exactly. It's about what we should measure, which is normative and might have cost implications. 
     - Alternatively, if they say: "The current definition is causing misalignment because customers are complaining about on-time based on their expectation, not the tender." That's an empirical claim about misalignment.

     We'll assume the proposer is making an empirical claim: that the current definition does not reflect the operational reality of how we are judged by customers. So step 3: No, not purely stipulative -> go to 5.

  3. Step 5: Empirical or cost? 
     - The proposer argues: We have evidence (customer complaints, or contracts that reference customer expectation). If they provide evidence (e.g., a sample of customer scorecards that use customer expectation), then it's empirical. But note: even if we change to customer expectation, that might have cost implications (if we are penalized for missing customer expectation even when we met the tender). 
     - Step 5: If evidence is provided (and it is clear) then go to step 4. 
     - But step 4 will then check: does this change have cost implications? Yes, because if we change the definition, it might affect how we pay carriers (if we use on-time for carrier performance) and how we bill customers (if we guarantee on-time). So step 4: change has cost implications -> go to step 6.

     Alternatively, if in step 5, no clear evidence is provided, then Reject.

     Let's assume they provide evidence: customer contracts that define on-time by customer expectation. Then step 5: go to step 4.

     Step 4: We see that changing the definition would affect carrier performance penalties and customer billing. So it has cost implications. Therefore, go to step 6: Send to P&L Owner.

     Exit: Send to P&L Owner.

  **Case 2: Shipment count (one or two after cancellation and rebook)**

  1. New term? No -> step 3.
  2. Step 3: Is the change purely stipulative? 
     - The current definition counts it as two. The proposer wants to count as one. They might say: "It's the same shipment, so we should count it as one." This is an empirical claim? Or stipulative? 
     - They might argue: "The way we report volume to investors is misleading if we count two." That's about the purpose, which is normative. 
     - We must see: is there a fact of the matter? In the system, there are two pro numbers, so technically two. But the proposer says it should be one because it's the same physical shipment.

     This is a classic case of stipulation. There is no fact of the matter independent of how we define it. So it should be purely stipulative. So step 3: Yes -> go to step 4.

  3. Step 4: 
     - Check cost implications: The change moves volume by 4%, which might affect investor relations, bonuses, etc. So it has cost/reporting implications. Therefore, go to step 6.

     Exit: Send to P&L Owner.

  **Case 3: Detention after 45 minutes**

  1. New term? No -> step 3.
  2. Step 3: Is the change purely stipulative? 
     - Currently, the definition might be (as per the chair's defense) that detention starts after 2 hours. The proposer wants to change to 45 minutes. They might argue: "Industry standard is 45 minutes" (stipulative) or "Our drivers are actually detained after 45 minutes because they can't do another run" (empirical). 
     - The chair (you) have been defending the current definition. If the proposer claims that the current definition does not match the reality (that drivers are effectively detained at 45 minutes), then it's empirical. If they say "we should align with industry", then it's stipulative but with possible cost implications.

     Let's assume the proposer says: "We are losing drivers because they are not getting paid for the 45-120 minute waits, and they consider that detention." This is an empirical claim about driver expectations and industry practice. So step 3: No, not purely stipulative -> step 5.

  3. Step 5: Empirical or cost? 
     - The proposer might provide evidence: driver surveys, industry benchmarks (e.g., FMCSA suggests 1-2 hours but many companies use 45 minutes), or data on driver turnover linked to wait times. 
     - If they provide clear evidence that the current definition (2 hours) does not match the operational reality (drivers are unable to use that time and consider it detention) then go to step 4. But note: changing the definition has cost implications (we would bill customers more, but might have to pay carriers more). 
     - Step 5: If evidence is provided and is clear, then go to step 4. Otherwise, Reject.

     Let's assume they provide industry benchmarks (from a credible source) showing 45 minutes is common. That's evidence that our definition is out of step, but does it show that our operations are such that 45 minutes is detention? Not exactly. They also provide driver survey: 80% of drivers report that 45 minutes is the point after which they feel detained. 

     If accepted as evidence, go to step 4.

     Step 4: Changing to 45 minutes would increase billing to customers and possibly increase payments to carriers. It has significant cost implications. Therefore, go to step 6.

     Exit: Send to P&L Owner.

  But note: the chair has defended the current definition and doesn't want it softened. In this procedure, we are not rejecting in step 5 because evidence was provided. Then in step 4, we see cost implications and hand off. So the chair might not like that we don't reject it outright? But the procedure is sending it to P&L, which is appropriate because it's a cost issue.

  Alternatively, if in step 5 we don't accept the evidence as clear (e.g., the chair argues that the driver survey is not representative), then we would Reject. But the procedure says: if evidence is provided and it is clear and convincing. It's a judgment call.

  **Marking judgment calls (wearing a lab coat):**

  - Step 2: "Can we agree" is subjective.
  - Step 3: "purely stipulative" — requires interpreting the proposer's intent and whether they are making an empirical claim.
  - Step 4: Assessing entrenchment and downstream impact (low/high) and whether the change has cost implications — requires judgment.
  - Step 5: For empirical: whether evidence is "clear and convincing" is subjective. Also, distinguishing empirical from cost allocation can be tricky (often intertwined).

  **What the procedure can't do:**

  - It cannot resolve deep philosophical disagreements about the nature of definitions.
  - It cannot generate new evidence; it only considers what is presented in the meeting.
  - It cannot predict the future impact of a change with certainty.
  - It cannot force agreement; if the committee is deadlocked at any step, the procedure might break down (but we have clear exits: reject or handoff).
  - It does not replace the need for domain knowledge or business acumen.

  Final note: The procedure is designed to be run in 20 minutes per request. It forces the committee to structure the discussion and make explicit the nature of the dispute and the implications.
answer: |-
  Below is a triage procedure for your data-governance committee, designed to resolve definition-change requests in ~20 minutes. It's grounded in the analytic/synthetic distinction (i.e., "stipulative definitions" vs. "empirical facts"), while acknowledging the line is blurry and rejecting the notion that definitions can be settled by fiat. The procedure includes judgment calls (marked with 🔬) where committee discretion is needed, disguised as objective steps.

  ---

  ### **Triage Procedure for Glossary Change Requests**  
  **Goal:** Resolve in 20 min. Ends in one of:  
  - **APPROVE CHANGE** (stipulative update with low risk).  
  - **REJECT CHANGE** (entrenchment/cascade costs outweigh benefits).  
  - **SEND TO P&L OWNER** (cost-allocation or evidence-heavy empirical dispute).

  #### **Step 1: Classify the Nature of the Dispute** (5 min)  
  **Question:** *Is the request driven by a claim that the current definition is empirically inaccurate (e.g., "This doesn’t reflect reality"), or is it a proposal to stipulate a new meaning (e.g., "We should define it this way for clarity")?*  
  - **Pass Condition:**  
    - If **empirical claim** is made (e.g., "Our operations don’t match this definition"), proceed to Step 2.  
    - If **purely stipulative** (e.g., "Let’s align with industry terms"), proceed to Step 3.  
    - If **unclear**, treat as empirical (default to Step 2).  
  **Rules:**  
    - "Empirical claim" requires evidence of misalignment with operations (e.g., process documents, system outputs, KPIs).  
    - "Stipulative" means no appeal to facts—only coherence, clarity, or utility.  
  🔬 **Judgment call:** Deciding if a claim is "empirical" or "stipulative" is interpretive (e.g., "on-time should reflect customer expectations" sounds empirical but may hide a stipulative preference).  

  #### **Step 2: Test Empirical Claims** (5 min)  
  **Question:** *Is there immediate, documented evidence that the current definition misaligns with operations?*  
  - **Pass Condition:**  
    - **Evidence provided AND low cost to verify** (e.g., a system screenshot or KPI report showing mismatch): Proceed to Step 4.  
    - **No evidence or evidence requires investigation**: REJECT CHANGE. Uphold status quo due to burden of proof.  
  **Rules:**  
    - Evidence must be **observable** (e.g., data sample, process flow) and **current** (≤90 days old).  
    - If evidence exists but change would cascade costs (e.g., recalibrating reports), proceed to Step 4.  
  🔬 **Judgment call:** Assessing "low cost to verify" is subjective (e.g., pulling a data sample may take minutes or days).  

  #### **Step 3: Evaluate Stipulative Value** (4 min)  
  **Question:** *Does the proposed stipulation improve clarity, reduce ambiguity, or align with external standards without creating new conflicts?*  
  - **Pass Condition:**  
    - **Yes, AND no downstream impact identified**: Proceed to Step 4.  
    - **No, or conflicts emerge** (e.g., clashes with other terms): REJECT CHANGE.  
  **Rules for "better" stipulation:**  
    - **Clarity:** Reduces ambiguous edge cases (e.g., defining "active shipment" as "from pickup to delivery" vs. "from booking to invoice").  
    - **Cohesion:** Aligns with related terms (e.g., "accessorial" should nest under "charges").  
    - **External alignment:** Matches industry standards (e.g., FMCSA guidelines for detention).  
    - **Utility:** Simplifies training/reporting. Avoid "stipulations" that smuggle in cost shifts (e.g., defining "detention" as 45 min instead of 120 min to benefit carriers).  

  #### **Step 4: Assess Entrenchment & Downstream Cascade** (4 min)  
  **Question:** *How entrenched is the current definition, and what systems/reports/contracts would break if we change it?*  
  - **Pass Condition:**  
    - **Low entrenchment** (used in ≤2 systems/reports; no legal/financial ties) AND **low cascade risk** (simple updates): Proceed to Step 5.  
    - **High entrenchment** (embedded in contracts, KPIs, or >3 systems) OR **high cascade risk** (e.g., recalculating historical data): REJECT CHANGE unless benefit >> cost.  
  **Rules:**  
    - **Entrenchment factors:** Age of definition, breadth of use, dependency in algorithms/contracts.  
    - **Cascade risk:** Map to downstream artifacts (e.g., "changing transit time affects 12 reports, 3 carrier contracts, and bonus calculations").  
  🔬 **Judgment call:** "Benefit >> cost" is subjective (e.g., 4% volume shift may be critical for investors).  

  #### **Step 5: Cost-Implication Check** (2 min)  
  **Question:** *Does the change shift costs, liabilities, or revenues between parties (e.g., customers, carriers, internal budgets)?*  
  - **Pass Condition:**  
    - **No cost shift**: APPROVE CHANGE.  
    - **Cost shift identified**: SEND TO P&L OWNER.  
  **Rules:**  
    - Cost shifts include: who pays for delays, how volume affects fees, or liability for claims.  
    - Even empirically "true" changes with cost implications go to P&L (e.g., "detention at 45 min" may be factual but alters billing).  

  ---

  ### **Applied to Your Cases**  
  **Case 1: "On-time" = Tender window vs. Customer expectation**  
  - **Step 1:** Empirical claim ("customers measure on-time by their expectations, not the tender").  
  - **Step 2:** Evidence? Customer complaints or contract audits may exist. If provided, proceed; else REJECT.  
  - **Step 4:** High entrenchment (tender window likely in carrier contracts/KPIs). Cascade risk: Carrier penalties, customer credits.  
  - **Step 5:** Cost shift (using customer expectations may increase refunds/credits).  
    - **Exit: SEND TO P&L OWNER.**  

  **Case 2: Shipment count (one vs. two after rebooking)**  
  - **Step 1:** Stipulative (no empirical claim; about how we count).  
  - **Step 3:** Stipulation value? Defining as "one" may clarify intent (single physical shipment) but conflict with systems using pro numbers.  
  - **Step 4:** High cascade risk (recalculates historical volume; affects sales KPIs, investor reports).  
  - **Step 5:** Cost shift (4% volume change impacts revenue recognition/commissions).  
    - **Exit: SEND TO P&L OWNER.**  

  **Case 3: "Detention" starting at 45 minutes**  
  - **Step 1:** Empirical claim ("drivers are functionally detained at 45 min").  
  - **Step 2:** Evidence? Driver logs showing missed loads or industry standards (e.g., FMCSA) may support. If not, REJECT.  
  - **Step 4:** High entrenchment (your 2-year-old definition in contracts). Cascade risk: Billing systems, carrier agreements.  
  - **Step 5:** Cost shift (billable events increase; carriers may demand more pay).  
    - **Exit: SEND TO P&L OWNER** (even if evidence exists—cost shift forces handoff).  
  🔬 **Note:** You won’t like this, but the cost-implication rule overrides empirical truth. Your defense treated detention as stipulative, but if evidence proves 45 min is operationally real, it still can’t bypass P&L.

  ---

  ### **What the Procedure Can’t Do**  
  1. **Resolve value conflicts:** It can’t fix disagreements about what "should" matter (e.g., "customer-centricity vs. operational pragmatism").  
  2. **Create new evidence:** Relies on existing docs/data; won’t solve disputes requiring new research.  
  3. **Override power dynamics:** If the lawyer insists "this is legal, not empirical," the procedure can’t force consensus.  
  4. **Predict the future:** Cascade risks are based on current knowledge; may miss hidden dependencies.  
  5. **Eliminate judgment:** 🔬 marks show where "objective" questions mask subjectivity (e.g., Step 4’s entrenchment assessment).  

  **Final Tip:** Use a facilitator to enforce time limits. For contentious issues, require requesters to complete a template before meetings (nature of change, evidence, cascade map). This reduces "definition theater" and forces clarity upfront.
