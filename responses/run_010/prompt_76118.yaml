  Then there's the debate about whether systemic causes absolve individual actors. Historians like Niall Ferguson argue that even within systemic pressures, specific decisions matter. The user needs to distinguish when zooming out is valid contextualization versus evasion. 

  The closest terms are "proximate vs. distal causation" and "levels of analysis." But the user wants a specific term for when the level of analysis determines blame. Maybe "explanatory scale" or "causal hierarchy." Also, "overdetermination" could apply—multiple causes making the event inevitable. 

  The user also needs to know how to evaluate legitimate shifts in perspective. Contextual factors are valid when they show enabling conditions, but illegitimate if used to dismiss agency. They should assess if the argument addresses counterfactuals: could different choices have changed outcomes? 

