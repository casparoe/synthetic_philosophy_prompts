answer: |-
  You've hit on one of the most profound and persistent problems in historical causation, especially for complex events like WWI. What you're describing doesn't have a single perfect, universally-agreed-upon term, but several concepts capture crucial aspects of it. Here's a breakdown of the closest terms, their nuances, and how to distinguish legitimate analysis from evasion:

  1.  **Levels of Analysis / Causal Hierarchy:**
      *   **What it means:** Historians explicitly recognize different "levels" at which causes operate:
          *   **Immediate/Precipitating Cause (Proximate):** The spark (e.g., July Crisis decisions, the assassination itself).
          *   **Intermediate Causes:** Short-term background factors making the spark ignite (e.g., alliance system rigidity, arms race, specific war plans like Schlieffen, Balkan instability).
          *   **Long-Term/Underlying/Structural Causes:** Deep background factors creating the volatile environment (e.g., imperialism, nationalism, militarism, social Darwinism, economic competition).
      *   **How it fits:** This *is* the scale you're describing. The core problem is that assigning *responsibility* or *blame* depends heavily on which level(s) you prioritize. Focusing on the proximate level highlights specific actors (Germany, Austria-Hungary). Focusing on structural levels diffuses blame ("everyone," "the system").
      *   **Legitimacy vs. Dodge:** Legitimate: Acknowledging causes exist at all levels and arguing *why* one level is most *significant* for understanding responsibility in *this specific context*. Dodge: Using a shift to a different level *solely* to deflect blame from actors whose specific decisions were crucial within the constraints of the system. Example: Saying "imperialism caused it" doesn't negate that German leaders chose *how* to act within the imperialist framework in July 1914.

  2.  **Proximate Cause vs. Distal Cause:**
      *   **What it means:** A direct cause (proximate) vs. a remote cause (distal). The assassination was proximate to Austria's ultimatum; the alliance system was distal to the outbreak of war in August.
      *   **How it fits:** This is a specific application of levels of analysis, often focusing on the immediacy of the cause-effect chain. Arguments slide between blaming the proximate actor (Germany/Austria in July) and pointing to distal factors (alliances, militarism) as the "real" cause.
      *   **Legitimacy vs. Dodge:** Legitimate: Recognizing that distal causes create the *conditions*, but proximate causes are the *mechanism*. A house built of dry wood (distal cause) doesn't burn down without a spark (proximate cause). Dodge: Claiming distal causes make proximate causes irrelevant or inevitable, absolving decision-makers. "The fuse was lit" *because* specific people chose to light it, even if the powder keg was built by many.

  3.  **Overdetermination:**
      *   **What it means:** An event has *so many* sufficient causes that it would have happened even if one specific cause were removed. WWI often feels overdetermined – remove the assassination, and something else might have sparked it soon after.
      *   **How it fits:** This concept fuels the argument that zooming out to systemic factors is necessary because the specific July 1914 events were just one possible trigger of an inevitable conflict.
      *   **Legitimacy vs. Dodge:** Legitimate: Demonstrating the deep systemic instability made war highly probable and exploring *why* it was so probable. Dodge: Using overdetermination to imply that *no* specific actors bear responsibility for their choices because "it was going to happen anyway." This ignores the agency exercised *within* the system.

  4.  **The "Fischer Controversy" and *Primat der Innenpolitik* vs. *Primat der Außenpolitik*:**
      *   **What it means:** Fritz Fischer's argument (the 60s historian) highlighted Germany's specific, conscious drive for war (*Primat der Innenpolitik* - primacy of domestic policy: war as a solution to internal German problems). His critics often emphasized the external pressures of the international system (*Primat der Außenpolitik* - primacy of foreign policy: states reacting to external threats/opportunities).
      *   **How it fits:** This debate is a prime *example* of your phenomenon. Fischer focused on the proximate/intermediate level of German decision-making and intent. His critics shifted the focus to the structural level of the international system/alliances as the primary driver, diffusing specific German blame.
      *   **Legitimacy vs. Dodge:** Legitimate: Critiquing Fischer's evidence for specific German *intent* or arguing that systemic pressures *constrained* German choices more than he allowed. Dodge: Using systemic arguments to completely dismiss evidence of calculated German risk-taking or aggressive aims in July 1914.

  **Drawing the Line: Legitimacy vs. Evasion**

  The core difference lies in **agency, counterfactuals, and explanatory power**:

  1.  **Acknowledging Agency:** Legitimate arguments acknowledge that human actors made choices *within* structural constraints. Did Germany *have* to give Austria-Hungary a "blank cheque"? Did Russia *have* to mobilize fully? Did Austria-Hungary *have* to issue an intentionally unacceptable ultimatum? Evasive arguments treat actors as mere puppets of the system.
  2.  **Counterfactual Reasoning:** Does the argument engage with "what ifs"? What if Germany had restrained Austria? What if Russia had delayed mobilization? What if Austria had accepted Serbia's surprisingly compliant reply? If the argument claims the war was *inevitable* regardless of specific July choices, it must provide strong evidence for that inevitability beyond just the existence of structural tensions. Legitimate systemic arguments show *why* the room for alternative choices was vanishingly small. Evasive ones assume inevitability without proof.
  3.  **Explanatory Power:** Which level best explains *why* the war broke out *when* it did, *how* it did, and *involving whom* it did? While structures explain the *potential*, proximate/intermediate decisions explain the *actualization*. A purely structural explanation struggles to explain the specific timing and escalatory path of July-August 1914. A purely proximate explanation ignores the decades of fuel piled up.

  **What to Call It & How to Use It in Your Paper:**

  *   **Most Precise Label:** **The problem of causal hierarchy / shifting levels of analysis in assigning historical responsibility.** You could also say historians are debating the **explanatory scale** or the **locus of causality**.
  *   **How to Frame Your Argument:**
      *   Acknowledge the reality of multiple causal levels: structural, intermediate, and proximate.
      *   State that while structural factors (imperialism, nationalism, alliances, militarism) created an *extremely volatile* environment where a major war was *highly probable*, the specific outbreak in August 1914 resulted from conscious decisions made by key actors (primarily in Berlin, Vienna, St. Petersburg, and to a lesser extent Paris and London) during the July Crisis.
      *   Argue that **agency within the structure matters for assigning responsibility.** The systemic pressures *enabled* and *shaped* the crisis, but specific leaders chose *how* to navigate it. Germany's "blank cheque" and subsequent choices, Austria-Hungary's aggressive ultimatum, Russia's decision for general mobilization – these were not *forced* by the system; they were risky, escalatory choices made within it.
      *   Conclude that **structural factors explain *why* a spark could cause a conflagration, but proximate decisions explain *which* spark lit the fire and *how* it was fed.** Therefore, significant responsibility lies with the actors who made those critical decisions in July 1914, particularly Germany and Austria-Hungary, even as all major powers contributed to the dangerous pre-war environment. The Versailles "war guilt" clause, while politically motivated and overly simplistic, was not *fundamentally* wrong in identifying Germany (and its allies) as bearing primary responsibility for *initiating* the conflict through their actions in the final crisis.

  By framing it this way, you show you understand the complexity of the debate (the shifting levels) and offer a nuanced resolution that doesn't ignore the deep causes but also doesn't absolve the key decision-makers of their crucial role in turning possibility into catastrophic reality. Good luck with your paper! You're grappling with a truly central historical question.
