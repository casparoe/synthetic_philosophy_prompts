prompt: |-
  I'm a staff software engineer at a company of roughly two hundred people, and I own the process by which contested technical calls get settled: code reviews where reviewers disagree, incident diagnoses that are disputed while the page is still open, and go/no-go decisions on releases. I make or arbitrate about five of these a week. Each one goes into a written record that people read months later, and on the release calls the cost of being wrong ranges from a wasted sprint to a multi-hour customer-facing outage. I have no formal philosophy training. What I have is a recurring pattern I handle badly.

  The pattern: the evidence in front of me — the diff, the logs, the test output — points one way, and then a separate class of fact points the other. That second class includes things like: a colleague I rate as my equal on this code disagrees with me; I have been awake for nineteen hours; I misdiagnosed something structurally similar last quarter; the one reviewer who agrees with me is known for agreeing with me; and in this company whoever asserts hardest tends to carry the room. I have no principled way to combine the two classes, so I improvise, and the improvisation is visibly mood-dependent. There is also a second failure I would be embarrassed to describe out loud: I work through a counterargument, conclude that my original read was correct, write that down — and then continue to behave as though I believed the opposite.

  What I want is a decision procedure I can run in this role. Not an essay on disagreement, and no reading list; I cannot look anything up mid-incident, and I would rather you define any term you use than gesture at a literature. Specifically:

  - Give the questions in the order they should be asked, and say what counts as a sufficient answer to each. State which questions are being answered by the evidence about the system and which by evidence about my own reliability, and keep those two separated all the way down — I suspect collapsing them is most of my problem.
  - Include an explicit rule for known impairments (fatigue, time pressure, a recent confident error on a similar case, an incentive to be right). Say whether the discount applies to my conclusion or to my confidence in my reasoning about it, and why that difference changes what I do next.
  - Address the circularity I keep running into: if the procedure says to defer when my peers disagree, and my peers are running the same procedure and deferring to me, the group converges on nothing. Give me a stopping rule and say what it costs.
  - Address the state described above, where my judgment about what the evidence supports and my actual belief come apart. Say what the procedure requires of me there — revise the belief, reopen the evidence, or keep the belief and act against it — and say plainly whether a mismatch between my action and my own assessment of the evidence is always a defect I am obliged to repair, or sometimes the correct place to be.
  - Separate what to believe from what to do. Most of my calls are forced and time-boxed, so the procedure must say when an unresolved epistemic state still yields a determinate action, and it must make the asymmetry of costs — not a manufactured confidence — the thing that settles it.
  - Specify what I write into the record, in a form that lets me later check whether my discounting was calibrated. I already keep a log of calls I got right and wrong; the procedure should feed that log rather than merely appeal to it.
  - Mark, step by step, which parts are genuinely mechanical and which are judgment calls dressed as procedure. I would rather have three honest judgment calls than twelve fake ones.
  - Say what the procedure cannot settle and where it hands the decision back to a person. I expect at minimum that it cannot resolve disputes that are really about risk appetite or priorities, and that it cannot tell me whether someone is my peer on a question I understand worse than they do. If there are further blind spots, name them.

  Deliver two variants: a full version for planned decisions where I have a day, and a degraded version runnable in twenty minutes at three in the morning. The degraded version has to work when operated by the impaired person it exists to check, which I realize is a design problem rather than a footnote — please treat it as one.

  Then run the procedure on three cases.

  1. A test in our payments service fails roughly one run in forty. A colleague who has worked on this code longer than I have, and whom I would rate as at least my equal, is confident it is a real ordering bug between two writers and wants the release held. I have read the relevant code three times across two days and cannot find a path that produces the failure; the signature also matches a known timing sensitivity in the harness itself. The release is scheduled for Thursday and two other teams are blocked on it.

  2. I am paged at 03:10. I have been awake nineteen hours and skipped dinner. Error rates on one service are elevated but not catastrophic. Within twenty minutes I conclude the cause is a bad deploy by a downstream vendor and that rolling back our own service will make things worse. I then remember that last quarter I confidently attributed a similar signature to a vendor and it turned out to be our connection pool, and that the colleague who would normally check my read is asleep and would have to be paged.

  3. Six weeks ago I arbitrated whether to adopt a new storage layer. After reading both sides I concluded, and recorded, that the evidence favored adoption. Since then I have kept commissioning analyses that would expose problems with it, I have under-resourced the migration, and I hedge in meetings. I have also noticed that the input I gathered at the time came mostly from people who were performing confidence rather than reporting independent readings.

  At least one of these should come out against my preferences. Say so directly instead of softening it: I would rather learn now that the procedure costs me something I value than discover it during an outage.
reasoning: |-
  We are designing a decision procedure for a staff software engineer who arbitrates contested technical calls. The procedure must handle two classes of facts: 
    Class A: Evidence about the system (the diff, logs, test output, etc.)
    Class B: Evidence about the agent's reliability and context (fatigue, peer disagreement, past errors, etc.)

  The procedure must:
  1. Separate Class A and Class B evidence throughout.
  2. Explicitly handle impairments (fatigue, time pressure, etc.) by discounting appropriately.
  3. Avoid circularity in peer disagreement.
  4. Address the situation where the agent's judgment and belief diverge.
  5. Separate belief from action, especially under time constraints.
  6. Specify what to write in the record for later calibration.
  7. Clearly mark which steps are mechanical and which are judgment calls.
  8. State the procedure's limits.

  We'll design two variants: full (for planned decisions) and degraded (for emergencies, runnable in 20 minutes by an impaired person).

  Core Principles:
  - Class A evidence is primary and must be evaluated as objectively as possible.
  - Class B evidence is used to adjust the confidence in the Class A assessment and to decide whether to rely on it or defer.
  - We discount our own assessment when Class B factors indicate unreliability, but we do not let Class B override Class A without a clear reason (e.g., we don't say "I'm tired so the bug must be in the vendor").
  - For peer disagreement: we avoid circularity by having a stopping rule that breaks the symmetry (e.g., by using a designated tie-breaker or by escalating to a higher authority when peers are deadlocked). The cost is delay or escalation.
  - When belief and action diverge: the procedure requires acting on the outcome of the procedure (which might be different from the initial Class A assessment due to Class B discounting). A mismatch between action and the agent's personal belief is not necessarily a defect if the procedure overrides due to Class B factors. However, the agent must record the mismatch and revisit if possible.
  - For action: we use a cost-benefit analysis that is asymmetric (e.g., the cost of a false positive vs. false negative) to decide even when the epistemic state is unresolved.

  Structure of the Procedure:

  We break the procedure into stages:

  Stage 1: Class A Assessment (Evidence about the system)
    Goal: Form an initial assessment and confidence level based solely on the system evidence.

  Stage 2: Class B Assessment (Evidence about the agent and context)
    Goal: Adjust the confidence from Stage 1 based on factors that might impair the agent's judgment or change the context.

  Stage 3: Resolve Disagreements (if applicable)
    Goal: Handle cases where peers disagree, avoiding circularity.

  Stage 4: Decision and Action
    Goal: Separate belief (the adjusted confidence) from action. The action is determined by the adjusted confidence and the cost asymmetry.

  Stage 5: Record Keeping
    Goal: Write down the decision, the reasoning, and the factors for later review.

  Degraded version: 
    - Shorten each stage, use simpler rules, and rely more on pre-defined thresholds and fallbacks.
    - Specifically, in degraded mode, we skip complex peer resolution and rely on a pre-defined escalation path. We also use fixed discount factors for impairments.

  Limits of the procedure:
    - Cannot resolve disputes about risk appetite or priorities (these require business input).
    - Cannot definitively judge who is a peer on a topic (this is a judgment call and may require domain expertise).
    - The procedure is only as good as the agent's ability to honestly assess their own state and the evidence.

  Now, the detailed procedure:

  Full Version (for planned decisions, 1 day available)

  Stage 1: Class A Assessment
    Questions:
      1.1. What is the system evidence? (Describe the diff, logs, test output, etc.)
      1.2. What is the most probable conclusion based solely on this evidence? (State the conclusion and the key evidence for it.)
      1.3. What is the confidence level in this conclusion? (Low, Medium, High - defined by the clarity of the evidence and the absence of alternative explanations.)
          - Low: Evidence is ambiguous, multiple plausible explanations.
          - Medium: Evidence points clearly to one explanation but there are minor gaps or alternatives.
          - High: Evidence is clear and direct, with no reasonable alternatives.

    Sufficient answer: 
      - For 1.1: A clear description of the evidence.
      - For 1.2: A clear statement of the conclusion and the reasoning.
      - For 1.3: A confidence level with a one-sentence justification.

    Judgment: This stage is a judgment call because it requires interpreting evidence. However, the agent must base it solely on Class A.

  Stage 2: Class B Assessment
    Questions:
      2.1. Are there any factors that might impair my judgment? (List: fatigue, time pressure, emotional state, recent errors on similar problems, known biases, or incentives.)
      2.2. Are there any factors that might enhance my judgment? (List: deep expertise on this system, recent success on similar problems, etc.)
      2.3. How do these factors adjust my confidence from Stage 1?
          - For each impairing factor, reduce the confidence level by one step (High->Medium, Medium->Low, Low->Very Low) for each factor that is significant. [But note: multiple factors can push to Very Low or even "Unreliable".]
          - For enhancing factors, increase by one step only if at least two factors are present and significant (to avoid overconfidence). But note: enhancing factors are rarer and less impactful than impairments.

          However, note: We are discounting the confidence in our own assessment, not the conclusion itself. The conclusion from Stage 1 remains, but we are less sure about it.

      2.4. Are there peer assessments? If so, what are they and what is the peers' reliability?
          - If peers agree with the Stage 1 conclusion, then this is an enhancing factor (if the peer is reliable) and increases confidence by one step (but only if the peer is independent and not biased).
          - If peers disagree, then this is an impairing factor and decreases confidence by one step per reliable peer (but note: if multiple peers disagree, that's multiple steps?).

          However, we must avoid circularity. We treat peer disagreement as a factor that reduces our confidence, but we do not automatically defer. We also consider:

          a) Is the peer a true peer? (Judgment call: same level of expertise and access to evidence? If not, discount their opinion appropriately.)
          b) Are they independent? (If they are known to always agree or disagree with you, discount.)

          We do not resolve peer disagreement here; we just adjust our confidence. We resolve disagreement in Stage 3.

    Sufficient answer:
      - List of factors and their impact on confidence.
      - Adjusted confidence level.

    Judgment: This stage is a judgment call because assessing the impact of Class B factors is subjective.

  Stage 3: Resolve Disagreements (if peers are involved and disagree)
    Goal: Avoid circularity by having a stopping rule.

    Questions:
      3.1. After Stage 2, what is the adjusted confidence? If it's Very Low or Unreliable, then we defer to the peer(s) if they are available and reliable. Otherwise, proceed to 3.2.
      3.2. If there is a peer who is a known domain expert (more than me and the other peers) on this specific issue, defer to them. (This breaks symmetry.)
      3.3. If not, and if the disagreement is with one peer and we are symmetrical (both peers), then use a pre-defined tie-breaking rule:
          - Option A: Escalate to a designated arbitrator (who is not involved and has higher authority) and accept their decision. The cost is delay and their time.
          - Option B: If the issue is time-sensitive and escalation is too slow, then the agent must choose to either:
              a) Go with the assessment that has the lower cost of being wrong (if the cost is asymmetric) OR
              b) If the costs are symmetric, then go with the status quo (if one option is change and the other is no change) OR
              c) Flip a coin (only in extreme time pressure and symmetric costs).

          The cost of this step is the risk of being wrong and the delay if we escalate.

      3.4. If there are multiple peers and they are not in agreement, then the agent must determine the majority view and the reliability of the group. If the majority is reliable, then adjust confidence accordingly and then use the adjusted confidence to decide. If no majority, then treat as a tie and use 3.3.

    Sufficient answer: 
      - A decision on how to resolve the disagreement and the resulting conclusion and confidence.

    Judgment: This stage has multiple judgment calls (who is an expert, what is the tie-breaker rule, etc.). The key is to have pre-defined rules for tie-breaking to avoid ad-hoc decisions.

  Stage 4: Decision and Action
    Goal: Separate belief from action.

    Questions:
      4.1. What is the adjusted confidence after Stage 2 (and Stage 3 if applicable)? (Very Low, Low, Medium, High)
      4.2. What are the costs of being wrong for each possible action?
          - Example: In a release go/no-go, the cost of a false go (releasing with a bug) is a potential outage, and the cost of a false no-go (delaying a good release) is a wasted sprint and blocking other teams.
      4.3. What action does the cost asymmetry dictate?
          Rule: 
            - If confidence is High or Medium, then go with the conclusion from Stage 1 (if no peer overrule) because the evidence is strong enough.
            - If confidence is Low or Very Low, then the decision is driven by the cost of being wrong:
                a) If the cost of a false positive (acting on the conclusion when it's wrong) is much higher than the cost of a false negative (not acting when the conclusion is right), then do not act on the conclusion (i.e., choose the safe option).
                b) If the cost of a false negative is much higher, then act on the conclusion despite low confidence.
                c) If the costs are symmetric, then we must seek more evidence if time allows. If not, then we must choose a default (e.g., status quo) or escalate.

          However, note: sometimes the conclusion from Stage 1 is "we should act" (e.g., roll back) and sometimes it is "we should not act". The cost asymmetry is about the action we are contemplating.

          Specifically, for a release:
            - Go: if the release is good, we get benefits. If bad, we have an outage.
            - No-go: if the release is bad, we avoid an outage. If the release is good, we waste time and block others.

          So the cost of a false go (outage) is high, while the cost of a false no-go (delay) is lower. Therefore, even with low confidence that the release is bad, we might no-go because the cost of being wrong (if we go and it's bad) is too high.

      4.4. What action will we take?

    Sufficient answer: The action and the reason (driven by confidence and cost).

    Judgment: The cost assessment is a judgment call. The mapping from confidence and costs to action is mechanical.

  Stage 5: Record Keeping
    Questions:
      5.1. Record:
          - The original Class A evidence and conclusion (from Stage 1).
          - The Class B factors and how they adjusted confidence.
          - How any peer disagreements were resolved.
          - The final confidence level.
          - The cost asymmetry considered.
          - The action taken.
          - Any mismatch between the agent's personal belief (if different from the recorded conclusion) and the action.

      5.2. Also record a commitment to revisit if the action turns out to be wrong and if there was a mismatch, to review why.

    This record feeds into the log of calls for later calibration.

  Now, the degraded version (20 minutes, at 3am, impaired):

  We simplify each stage and use fixed rules.

  Stage 1: Class A Assessment (5 minutes)
    1.1. What is the system evidence? (Quickly list: logs say X, test shows Y.)
    1.2. What is the most likely conclusion? (One sentence.)
    1.3. Confidence: 
          - High: if the evidence is clear and direct.
          - Medium: if there is evidence but some ambiguity.
          - Low: if the evidence is weak or ambiguous.

  Stage 2: Class B Assessment (5 minutes)
    2.1. List impairments: 
          - If I have been awake >16 hours: reduce confidence by one step.
          - If I missed a meal and feel impaired: reduce confidence by one step.
          - If I made a similar error in the last month: reduce confidence by one step.
          - If I am under time pressure (e.g., incident ongoing): reduce confidence by one step.
          - If a peer disagrees and they are at least my equal: reduce confidence by one step per such peer (but note: if multiple peers, that can push to Very Low quickly).
    2.2. Enhancing factors (rarely used in degraded mode, skip unless obvious and strong).
    2.3. Adjusted confidence: apply the reductions. If confidence becomes Very Low (or below Low), then mark as "Unreliable".

  Stage 3: Resolve Disagreements (5 minutes)
    - If there is a peer available (awake and reachable) and I have marked my assessment as "Unreliable", then defer to the peer.
    - Else, if there is a designated on-call expert (pre-defined) and the issue is critical, page them and defer.
    - Else, if there is a peer who disagrees and I am not Unreliable, then use a pre-defined rule: 
          - In release decisions: no-go if there is any disagreement (because the cost of releasing a bug is high).
          - In incident response: if the proposed action (e.g., rollback) has a high cost of being wrong, and there is disagreement, then do nothing (or rollback to last known good if available) and page the expert.

  Stage 4: Decision and Action (5 minutes)
    4.1. If confidence is High or Medium: act on the Stage 1 conclusion.
    4.2. If confidence is Low or Very Low:
          - For releases: no-go (because false go is very costly).
          - For incident response: if the proposed action is to change something (like rollback) and confidence is low, then do not change (because changing might make it worse) unless the current situation is catastrophic and the change has a chance to fix it. Otherwise, if the current situation is not catastrophic, then do nothing and monitor. If the current situation is catastrophic, then rollback (or take the action) even with low confidence because the cost of not acting is too high.

    Pre-defined cost asymmetry rules:
          - Release: false go cost >> false no-go cost -> no-go on low confidence.
          - Incident: 
              - If the incident is severe (e.g., high error rates, customer impact) and the proposed fix is a rollback, then the cost of not rolling back (if it is the fix) is high. But if rolling back might make things worse (as in case 2), then we have:
                  current state: bad
                  proposed action: rollback -> if it fixes, then good; if it makes worse, then very bad.
                  no action: remains bad.

              We can use a rule: 
                  - If confidence in the fix is Low or Very Low and the current state is not catastrophic (e.g., elevated errors but not increasing and not causing major impact), then do not rollback and monitor.
                  - If the current state is catastrophic (e.g., everything is down and getting worse), then rollback even with low confidence because the potential upside (fixing) is worth the risk.

  Stage 5: Record Keeping (use a template, 1 minute)
    - Write: 
          Class A: [conclusion, confidence]
          Class B: [impairments, adjusted confidence]
          Disagreements: [handled by ...]
          Action: [what we did and why (cost asymmetry)]

  Now, we run the procedure on the three cases.

  Case 1: Test flake in payments service.

  Full Version:

  Stage 1:
    1.1. Evidence: Test fails 1 in 40 runs. I've read the code and see no path to the failure. The signature matches a known timing issue in the harness.
    1.2. Conclusion: The test failure is due to the harness, not a real bug. We should proceed with the release.
    1.3. Confidence: Medium (because the harness issue is known, but the test is in the payments service which is critical, so we must be cautious).

  Stage 2:
    2.1. Impairments: 
          - A peer (equal to me, with longer experience on the code) disagrees and thinks it's a real ordering bug. This reduces confidence by one step (to Low).
          - No other impairments.
    2.2. Enhancing factors: None.
    2.3. Adjusted confidence: Low.

  Stage 3:
    3.1. Confidence is Low, but not Unreliable. We have a peer disagreement.
    3.2. Is there a domain expert? Maybe, but not specified. Assume we don't have one immediately available.
    3.3. We are symmetrical peers. We must break the tie.
          - We have time (release Thursday, and today is say Tuesday) so we can escalate.
          - Pre-defined rule: escalate to a designated arbitrator (e.g., the engineering manager or a principal engineer) and accept their decision.

  Stage 4:
    4.1. After Stage 3, we escalate. The arbitrator decides.
          - But note: the cost asymmetry. The cost of a false go (releasing with a bug in payments) is very high (outage, lost transactions, reputation). The cost of a false no-go is a wasted sprint and blocking two teams (which is bad but not catastrophic).
          - Even without escalation, the adjusted confidence was Low, so the cost asymmetry would say: no-go on releases when confidence is low because false go is too costly.

          So regardless of the arbitrator, the action might be to hold the release until we are sure.

          However, the arbitrator might have more context. We'll assume they decide.

    But the procedure says: if we cannot get an arbitrator in time (within the decision window), then by cost asymmetry we would no-go.

  Stage 5:
    Record: 
      Class A: Conclusion - harness issue, confidence Medium.
      Class B: Peer disagreement -> confidence Low.
      Disagreement resolved by: escalated to [name], who decided [X].
      Action: Held release for further investigation.

    However, note: the procedure might lead to holding the release even if I initially thought it was safe. This goes against my preference (to release).

  Degraded Version (if we had to decide quickly, say because the release is imminent and we have only 20 minutes):

  Stage 1: 
    Conclusion: harness issue, confidence Medium.

  Stage 2:
    Impairments: peer disagreement -> reduce to Low.

  Stage 3:
    Confidence is Low. Pre-defined rule for releases: if there is any disagreement and confidence is not High, then no-go. (Because the cost of a false go is too high.)

  Stage 4:
    Action: no-go (hold the release).

    Record: as above.

  Case 2: 03:10 page, elevated errors.

  Full Version (if we had time, but we don't, so we use degraded? Actually, the incident is ongoing, so we use the degraded version).

  But let's try full first to see the reasoning.

  Stage 1:
    1.1. Evidence: error rates elevated, not catastrophic. I concluded it's a bad deploy by a downstream vendor. Rolling back our service might make it worse because we might be working around the vendor issue.
    1.2. Conclusion: do not roll back our service; contact vendor and monitor.
    1.3. Confidence: Medium? (But note: it's an incident, so we must act fast.)

  Stage 2:
    2.1. Impairments: 
          - Awake 19 hours: reduce confidence by one step.
          - Skipped dinner: reduce by one step (if feeling impaired, which likely yes).
          - Recent error on similar: reduce by one step.
          - Peer who normally checks is asleep: but not a direct impairment, just a lack of enhancement. However, the lack of peer review is an impairment? We can consider it as a factor: reduce by one step if we normally rely on peer review and it's missing.
          Adjusted confidence: from Medium to Low (after one step? but we have three reductions) -> so to Very Low.

    2.2. Enhancing: None.

  Stage 3:
    3.1. Confidence is Very Low -> mark as Unreliable.
    3.2. Since we are Unreliable, we must defer to a peer or expert. The colleague is asleep and would have to be paged. But the incident is ongoing and not catastrophic (elevated but not catastrophic). 
          Pre-defined rule: if confidence is Unreliable and the situation is not catastrophic, page the peer. If the situation is catastrophic, page immediately. Here, it's not catastrophic, so we page the peer but note that we are impaired.

  Stage 4:
    4.1. We are not qualified to decide because our assessment is Unreliable. We must get help.
    4.2. Action: Page the peer and defer the decision to them.

  Stage 5:
    Record: 
      Class A: vendor issue, do not rollback, confidence Medium.
      Class B: impairments (fatigue, hunger, past error, lack of peer) -> confidence Very Low (Unreliable).
      Action: Paged [peer] and deferred.

  But note: the procedure forces me to page the peer even though I was reluctant. This is the correct outcome because I have multiple impairments and a recent similar error.

  Degraded Version (20 minutes, 3am):

  Stage 1: 
    Conclusion: vendor issue, do not rollback. Confidence: Medium (but note: the evidence is not clear, so maybe Low? Let's say Medium because I had 20 minutes and concluded).

  Stage 2:
    Impairments: 
        - Awake >16 hours: reduce by one step -> now Low.
        - Skipped dinner: reduce by one step -> now Very Low.
        - Recent similar error: reduce by one step -> now Unreliable.
        - Peer asleep: reduce by one step? (But we already are at Unreliable.) So overall: Unreliable.

  Stage 3:
    Confidence Unreliable -> must defer. Page the peer.

  Stage 4:
    Action: Page the peer and let them decide.

  Case 3: Storage layer adoption.

  This is a planned decision that was made six weeks ago, but now I notice my behavior is inconsistent with my recorded decision.

  We are not in the moment of the decision, but we can use the procedure to audit the past decision and also to decide how to act now.

  But the question is about why I am behaving this way and what to do.

  First, we note that the procedure requires that the action must be based on the outcome of the procedure. If there is a mismatch, we are required to either:
    - Revise the belief (if new evidence) and then act accordingly, OR
    - If the belief hasn't changed, then act according to the belief and the procedure.

  In this case, the agent recorded that the evidence favored adoption, but then acted against it (under-resourced, hedging). This mismatch is a defect that must be repaired.

  Using the procedure to re-evaluate:

  Full Version:

  Stage 1: 
    1.1. Evidence: the evidence from six weeks ago (we don't have it now, but we have the record). But now there are new factors: the input came from people who were performing confidence (not independent) and I have since commissioned analyses that haven't found problems.
    1.2. Conclusion: We don't have a new conclusion about the storage layer. We need to re-examine the evidence.

    Actually, the procedure is for a decision now. So the question now might be: should we continue the migration?

    Let's reframe: should we pause the migration until we get more evidence?

  Stage 1 (now):
    1.1. Evidence: 
          - The original evidence (which I concluded favored adoption) but now I doubt the independence of the sources.
          - New analyses commissioned have not found problems, but we haven't found a smoking gun either.
          - The migration is under-resourced and I am hedging.
    1.2. Conclusion: The original decision might be flawed due to biased input. We should reassess the evidence with independent reviewers.
    1.3. Confidence: Low in the original decision.

  Stage 2:
    2.1. Impairments: 
          - I have an incentive to be right (I made the call) -> reduce confidence by one step (to Very Low? because the original was Low).
          - The input was from people performing confidence -> this is an impairment of the original process, not of me now. But it affects the current confidence: we have Very Low confidence in the original conclusion.
          - No peer disagreement at the moment? But I am doubting.

  Stage 3: Not applicable (no peers involved now).

  Stage 4:
    4.1. Confidence Very Low in the original decision.
    4.2. Cost asymmetry:
          - If we continue the migration and the storage layer is flawed, we risk data loss or performance issues (high cost).
          - If we pause the migration and the storage layer is good, we waste time and resources (medium cost).
          - If we abandon, we lose the benefits (if any) and the cost of the work so far.

          The safe option is to pause and reassess.

  Stage 4 Action: Pause the migration and commission an independent review.

  Stage 5: Record the mismatch in past behavior and the decision to pause and reassess.

  The procedure forces me to face the possibility that the original decision was flawed and to pause. This goes against my preference to not admit error and to push forward.

  Summary of outcomes:
    Case 1: The procedure likely leads to holding the release (against my initial preference to release).
    Case 2: The procedure forces me to page the peer (against my preference to not disturb).
    Case 3: The procedure forces me to pause the migration and reassess (against my preference to avoid confronting the potential mistake).

  In each case, the procedure acts as a check on my impaired judgment and leads to a more conservative action.

  This is the design: to avoid the known failure modes by systematic discounting and cost-driven action.
answer: |-
  Below is a decision procedure designed for your role, addressing all specified requirements. It strictly separates **Class A (system evidence)** from **Class B (agent-context evidence)** and includes explicit rules for impairments, circularity, belief-action mismatches, cost asymmetry, record-keeping, and blind spots. Two variants are provided:  
  - **Full version** (for planned decisions, ~1 day available).  
  - **Degraded version** (for emergencies, ≤20 minutes, operable while impaired).  

  Both versions output:  
  - **Belief**: Your assessed conclusion and confidence level (after Class B adjustments).  
  - **Action**: The forced decision (even with unresolved doubt), based on cost asymmetry.  
  - **Record entry**: Structured for calibration against your log.  

  Judgment calls are marked with **(!)**. All other steps are mechanical.  

  ---

  ### **Core Definitions**  
  - **Class A**: Evidence about the *system* (code, logs, tests, metrics). Answers: *What does the system suggest?*  
  - **Class B**: Evidence about *you/context* (fatigue, peer disagreements, past errors, incentives). Answers: *How reliable is my assessment?*  
  - **Impairment discount**: Applies to *your confidence in your Class A assessment*, not the conclusion itself. Why? Confidence dictates whether you trust your read enough to act on it.  
  - **Cost asymmetry**: The difference in cost between false positives (acting wrongly) vs. false negatives (not acting). Settles actions when confidence is low.  
  - **Peer**: Someone with comparable expertise on *this specific issue* and access to evidence. Judgment call **(!)**.  

  ---

  ### **Decision Procedure: Full Version**  
  *For planned decisions (e.g., code reviews, release gates). Time: ~1 day.*  

  #### **Stage 1: Class A Assessment (System Evidence)**  
  1. **What does the system evidence imply?**  
     - *Mechanical*: Restate the evidence (diff/logs/test) without interpretation.  
     - *Output*: Raw facts only (e.g., "Test fails 1/40 runs; log shows error X; no path in code for failure").  
     - *Sufficient*: All relevant evidence is listed.  

  2. **What is the most probable conclusion?**  
     - *Mechanical*: Derive a conclusion *only* from Class A (e.g., "Likely harness flaw, not bug").  
     - *Sufficient*: Conclusion follows logically from Stage 1.1.  

  3. **Initial confidence in conclusion?**  
     - *Judgment* **(!)**: Low (ambiguous/conflicting evidence), Medium (clear but gaps), High (direct, no alternatives).  
     - *Sufficient*: Level + one-sentence justification (e.g., "Medium: Code path missing, but test matches known harness flaw").  

  #### **Stage 2: Class B Assessment (Agent-Context Evidence)**  
  4. **List Class B factors**  
     - *Mechanical*: Fatigue, peer disagreements, past errors, incentives, biases (e.g., "Peer disagrees; skipped dinner; misdiagnosed similar case last quarter").  
     - *Sufficient*: All material factors named.  

  5. **Adjust confidence for impairments**  
     - *Rule*: For *each* material impairment (e.g., >16h awake, recent error on similar issue, disagreed peer), reduce confidence by one level (High→Medium→Low→Very Low).  
     - *Enhancements* (rare): Only if two independent factors apply (e.g., "Expert on this subsystem + fresh"), increase by one level (max High).  
     - *Sufficient*: Confidence level after adjustments (e.g., "Low after 1-level reduction for peer disagreement").  

  6. **Peer disagreement handling**  
     - *Rule*: If peers disagree, reduce confidence by one level *per reliable peer* **(!)**. Stop reduction at Very Low.  
     - *Circularity fix*: If symmetric deadlock (peers run same procedure), escalate to a pre-defined tiebreaker (e.g., CTO, lead architect). *Cost*: Delay (1–4 hours).  
     - *Sufficient*: Confidence level post-peer-adjustment + escalation plan if deadlocked.  

  #### **Stage 3: Resolve Belief-Action Mismatch**  
  7. **If belief ≠ action plan**:  
     - *Rule*: Mismatch is *always a defect* if unresolved. You must:  
       - **Revise belief** (if new evidence), OR  
       - **Act on belief** (if evidence unchanged).  
     - *Why*: Unrepaired mismatches corrupt records and erode trust.  
     - *Sufficient*: Choose one: Revise belief or commit to acting on it.  

  #### **Stage 4: Action Decision (Cost Asymmetry)**  
  8. **Define cost asymmetry**  
     - *Judgment* **(!)**: Estimate cost of false positive (FP) vs. false negative (FN). E.g., "FP: Outage (cost=10); FN: Wasted sprint (cost=3)".  

  9. **Choose action**  
     - *Mechanical*:  
       - If confidence **High/Medium**: Act on Class A conclusion.  
       - If confidence **Low/Very Low**:  
         - Act on conclusion *only* if FP cost ≤ FN cost.  
         - Otherwise, choose safest option (e.g., no-go on release, do nothing in incident).  
     - *Sufficient*: Action + reason (e.g., "No-go: Confidence Low, FP cost (outage) > FN cost (delay)").  

  #### **Stage 5: Record**  
  10. **Write for calibration**:  
      ```  
      [Date] [Case ID]  
      - Class A: [Conclusion] @ [Initial Confidence]. Evidence: [Bullets]  
      - Class B: [Factors] → [Adjusted Confidence]  
      - Belief-Action Mismatch? [Yes/No + resolution]  
      - Action: [Decision]. Why: [Cost FP vs. FN]  
      ```  
      - *Sufficient*: All fields populated.  

  #### **Blind Spots**  
  - **Cannot resolve**: Risk appetite, priority disputes, or "who is a peer?" on topics you lack expertise to judge.  
  - **Handoff**: Escalate these to business/tech lead.  
  - **Other limits**: Assumes honest self-assessment; ineffective for sabotage/malice.  

  ---

  ### **Decision Procedure: Degraded Version**  
  *For incidents/emergencies. Time: ≤20 minutes. Operable while impaired.*  

  #### **Stage 1: Class A (3 min)**  
  1. **State evidence**  
     - *Mechanical*: List key facts (e.g., "Errors up 20%; no downstream timeouts").  
     - *Sufficient*: ≤3 bullet points.  

  2. **Conclusion & confidence**  
     - *Judgment* **(!)**: Conclusion + confidence (Low/Med/High). Use: High=directly proven, Low=anything else.  

  #### **Stage 2: Class B (3 min)**  
  3. **List impairments**  
     - *Mechanical*: Check pre-defined list:  
       - >16h awake? → Reduce confidence 1 level.  
       - Peer disagrees? → Reduce 1 level per peer.  
       - Past similar error? → Reduce 1 level.  
       - Incentive to be right? → Reduce 1 level.  
     - *Enhancements*: Ignore (too subjective when impaired).  
     - *Sufficient*: Adjusted confidence (e.g., "Low after reductions for fatigue+peer").  

  4. **Peer deadlock?**  
     - *Rule*: If confidence ≤Low *and* peers disagree, escalate to on-call tiebreaker *immediately*. If none, use pre-defined default (e.g., "No-go on releases if disagreement").  

  #### **Stage 3: Belief-Action Mismatch (1 min)**  
  5. **If belief ≠ action**:  
     - *Rule*: Postpone deep analysis. Default to: **Act on current belief**. Log mismatch for review post-incident.  

  #### **Stage 4: Action (3 min)**  
  6. **Cost asymmetry**  
     - *Pre-defined defaults*:  
       - **Releases**: FP cost (outage) >> FN cost (delay) → Default no-go if confidence ≤Low.  
       - **Incidents**:  
         - If catastrophic (e.g., >50% errors) → Act on conclusion (risk of inaction > action).  
         - If non-critical (e.g., <20% errors) → Do nothing if confidence ≤Low.  
     - *Sufficient*: Action + default rule cited (e.g., "No rollback: Non-critical + confidence Low").  

  #### **Stage 5: Record (1 min)**  
  7. **Degraded template**:  
      ```  
      [Time] [Incident ID]  
      - A: [Conclusion] @ [Confidence]  
      - B: [Impairments] → [Adj Confidence]  
      - Action: [Decision] [Default Rule]  
      ```  

  ---

  ### **Procedure Applied to Your Cases**  
  *Output format: [Belief] → [Action] + [Record Snippet].*  

  #### **Case 1: Test Flake in Payments Service**  
  - **Full version**:  
    - Class A: "Test failure matches harness timing flaw; no code path for bug → Conclusion: Harness issue, not bug. Confidence: Medium."  
    - Class B: "Peer (my equal) disagrees → Confidence: Low after reduction."  
    - Belief-Action: No mismatch (you believe harness issue).  
    - Action: **No-go on release**. Why? Confidence Low + FP cost (outage) > FN cost (blocked teams).  
    - *Record*:  
      ```  
      Class A: Harness issue @ Medium. Evidence: Test sig matches harness flaw; no code path.  
      Class B: Peer disagreement → Low.  
      Action: No-go. Why: FP cost (outage=10) > FN cost (delay=3).  
      ```  
    **→ Against your preference (release)**.  

  - **Degraded version**:  
    - Class A: "Conclusion: Harness issue. Confidence: Medium."  
    - Class B: "Peer disagrees → Confidence: Low."  
    - Action: **No-go** (default rule: releases with confidence ≤Low → no-go).  
    - *Record*: `A: Harness issue @ Med → B: Peer → Low → Action: No-go (release default).`  

  #### **Case 2: 03:10 Incident, Elevated Errors**  
  - **Full version**:  
    - Class A: "Downstream vendor deploy error → Conclusion: Do not roll back. Confidence: Medium."  
    - Class B: "19h awake + skipped dinner + past similar error → Confidence: Very Low (3 reductions)."  
    - Belief-Action: Mismatch (you believe vendor error but consider rolling back). *Resolution*: Revise belief? No new evidence → **Act on belief (no rollback)**.  
    - Action: **Page peer + monitor**. Why? Confidence Very Low → Requires backup.  
    - *Record*:  
      ```  
      Class A: Vendor issue @ Medium. Evidence: Error pattern matches vendor deploy.  
      Class B: Fatigue+past error → Very Low. Mismatch: Acted on belief (no rollback).  
      Action: Paged peer. Why: Confidence Very Low.  
      ```  
    **→ Against your preference (avoid paging)**.  

  - **Degraded version**:  
    - Class A: "Conclusion: Vendor issue. Confidence: Medium."  
    - Class B: ">16h awake + past error → Confidence: Very Low."  
    - Action: **Page peer** (default rule: Very Low confidence → escalate).  
    - *Record*: `A: Vendor issue @ Med → B: Fatigue+past → Very Low → Action: Paged peer (default).`  

  #### **Case 3: Storage Layer Adoption**  
  - **Full version** (re-evaluating past decision):  
    - Class A: "Original evidence favored adoption → Conclusion: Adopt. Confidence: Medium."  
    - Class B: "Input from 'confidence performers' + my incentive to be right → Confidence: Low (1 reduction)."  
    - Belief-Action: **Mismatch defect** (you believe adoption is correct but under-resource/hedge). *Resolution*: Reopen evidence? Yes → Commission *independent* review.  
    - Action: **Pause migration + independent review**. Why? Confidence Low + FP cost (bad migration) > FN cost (delay).  
    - *Record*:  
      ```  
      Class A: Adopt @ Medium (original evidence).  
      Class B: Biased input → Low. Mismatch: Defect repaired via review.  
      Action: Paused. Why: Confidence Low + FP cost (data loss=8) > FN cost (delay=2).  
      ```  
    **→ Against your preference (avoid confronting error)**.  

  ---

  ### **Key Takeaways**  
  - **Costs you**: The procedure overrides your preference in all three cases (blocks release, forces paging, pauses migration). This is intentional—it corrects for impairments and cost asymmetry.  
  - **Calibration**: Records include explicit confidence levels and Class B factors. Compare later with your log to adjust discounting (e.g., "Was 'peer disagreement' reduction justified?").  
  - **Stops waffling**: Forces action even with doubt (via cost asymmetry) and repairs belief-action mismatches.  
  - **Use degraded by default**: Full version is for post-mortems/planning; degraded handles 90% of urgent cases.  

  This procedure prioritizes error reduction over speed, accepts the costs of delay/escalation, and enforces intellectual honesty. It works because it externalizes your mental state into checkable rules, separating what the system says from whether you can trust yourself to read it.
