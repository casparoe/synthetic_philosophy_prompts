prompt: |-
  I assess claims for a UK advertising standards team: roughly forty complaints a week over whether an advertisement, packaging line or online banner misleads, and my recommendation goes to a two-person panel with no training in linguistics or philosophy. Our code prohibits claims that mislead by implication as well as claims that are literally false, but it offers nothing on how implication is generated or when it can be undone, so we argue case by case and advertisers reply that they never said the offending thing.

  Please write the procedure we could run on any claim, grounded in what Grice actually establishes about what is said versus what is meant, conversational implicature and the maxims. I want an ordered set of tests, each with a line on what counts as a sufficient answer: how to fix what the claim literally says; how to reconstruct step by step the implicature an ordinary consumer would derive, and how to tell when there is no such derivation to be had; how to distinguish a generalised implicature from one that depends on the particular context, and why that distinction changes what we may hold the advertiser to; and whether footnotes, asterisks and a closing phrase such as "terms and conditions apply" genuinely cancel an implicature, given that a theorist's cancellability test is not the same thing as a speaker's disclaimer. State what the procedure assumes about whether an audience treats commercial messaging as cooperative in the first place, and what changes if it does not. Mark the stages that are judgment calls dressed up as procedure, and the point at which the question stops being about meaning — materiality, consumer expectation, remedy — and goes to the panel. We have twenty minutes per claim.

  Then run it on three: a savings advertisement headlined "5% interest" where the rate is capped at balances under £1,000, disclosed in small print; an energy tariff promising savings "up to £312 a year" on terms almost no customer satisfies; and one claim of your choosing that clears the procedure intact but that the panel will be certain is a trick. For the last, say plainly what our reasoning fails to capture, and finish with what this procedure cannot be used for at all. Please write the answer in British English.
reasoning: |-
  We are creating a procedure based on Gricean pragmatics to assess whether an advertisement misleads by implication. The procedure must account for:
   - Literal meaning vs. what is implicated.
   - The maxims of conversation: Quantity, Quality, Relation, Manner.
   - The distinction between generalized and particularized conversational implicatures.
   - The effectiveness of disclaimers in cancelling implicatures.

   We assume that the audience treats commercial messaging as cooperative (as per Grice's Cooperative Principle) unless there is evidence to the contrary (e.g., known deceptive practices). If the audience does not treat it as cooperative, then we might expect them to be more skeptical and less likely to draw the usual implicatures, but note that in advertising, consumers often do not have the opportunity for clarification and are thus vulnerable to misleading implications.

   The procedure:

   Stage 0: Pre-screening for literal falsehood.
     - Check if the claim is literally false. If yes, it violates the code. Stop. If no, proceed.

   Stage 1: Identify what is said (the literal meaning).
     - Step 1.1: Parse the claim linguistically (syntax and semantics).
     - Step 1.2: Identify any ambiguities and resolve them by context (using the advertisement as a whole, including images, layout, etc.). 
     - Step 1.3: Determine the primary claim (the main message).

   Stage 2: Identify potential implicatures (what is meant beyond what is said).
     - Step 2.1: Consider the context: the product, the target audience, the medium, and the typical expectations of the audience.
     - Step 2.2: Apply Grice's maxims to see what implicatures might be generated:
          - Quantity: Is the claim as informative as required? If not, what might the audience infer to fill the gap?
          - Quality: Is the claim supported by evidence? (But note: we are more concerned with what the audience believes the advertiser is representing.)
          - Relation: Is the claim relevant? If it seems irrelevant, what might the audience assume to make it relevant?
          - Manner: Is the claim clear and unambiguous? If obscure or ambiguous, what might the audience take away?
     - Step 2.3: Distinguish between generalized and particularized implicatures:
          - Generalized: These are implicatures that arise without any special context (e.g., "some" often implicates "not all"). 
          - Particularized: These depend on specific context (e.g., if an ad says "our product is made in France", it might implicate high quality in the context of luxury goods).
          - Why it matters: Generalized implicatures are more stable and harder to cancel. Particularized ones depend on context and might be more easily defeated by disclaimers if the context is altered.

   Stage 3: Test for cancellability.
     - Step 3.1: Check if the potential implicature is cancellable without contradiction. If it is, then it is a conversational implicature. If not, it might be part of what is said (or conventional implicature).
     - Step 3.2: Assess the effectiveness of the disclaimer (footnote, asterisk, "terms and conditions apply"). Consider:
          - The prominence and clarity of the disclaimer.
          - Whether the disclaimer is presented at the same time and in the same medium as the claim.
          - Whether the disclaimer is sufficient to negate the implicature without contradiction.
          - Note: A disclaimer that contradicts a generalized implicature might not be effective because the implicature is strong and automatic. Also, if the disclaimer is not easily noticeable, it may not cancel the implicature.

   Stage 4: Determine materiality and consumer expectation.
     - Step 4.1: Would the misleading aspect (whether literal or by implicature) affect the consumer's decision to purchase or engage?
     - Step 4.2: Is the misleading aspect about a key characteristic of the product (e.g., price, key benefit, key limitation)?

   Stage 5: Judgment on misleadingness.
     - Step 5.1: If the claim is literally false -> misleading.
     - Step 5.2: If the claim is literally true but generates a conversational implicature that is false and the disclaimer is not effective in cancelling it -> misleading.
     - Step 5.3: If the claim is literally true and any implicature is either true or effectively cancelled by a disclaimer -> not misleading.

   Stage 6: Panel referral.
     - After applying the above, if the claim is found potentially misleading, then refer to the panel with the reasoning. Also, if there are questions about materiality (Stage 4) that require broader policy considerations, refer to the panel.

   Note: The entire procedure must be completed in 20 minutes per claim.

   Judgment calls:
     - Stage 2 (identifying implicatures) is a judgment call, especially in determining what an ordinary consumer would infer. We may rely on evidence (e.g., consumer surveys) if available, but in 20 minutes we must use reasonable inference.
     - Stage 3 (cancellability) is also a judgment call: how effective is the disclaimer? We must consider the ordinary consumer's attention and the overall presentation.

   Now, apply the procedure to three claims.

   Claim 1: Savings advertisement headlined "5% interest" with small print disclosing the rate is capped at balances under £1,000.

   Stage 0: Literally, it says "5% interest". This is true for some balances (under £1,000) but not for higher balances. However, the headline does not specify the cap, so it is literally true but incomplete? Actually, it is literally true only for balances under £1,000 and false for others? But the headline doesn't specify for whom. So we might say it is literally true that they offer 5% interest (on some balances) but the headline without qualification might be taken as a general offer. However, it is not literally false because they do offer 5% on some accounts. So we proceed.

   Stage 1: What is said: "We offer 5% interest." (on savings).

   Stage 2: Implicatures:
     - Quantity: The headline does not mention any cap. The audience would expect that if there were a cap, it would be mentioned. So the implicature is that the 5% rate applies to the entire balance (or at least without a low cap). This is a generalized implicature: when you say "5% interest", without qualification, it implies that it's the rate you get on your savings. The fact that it's a headline in an ad (which is designed to attract) also suggests this is the main rate.
     - Context: The audience is looking for a savings account. They would be interested in the headline rate and might not notice small print.

   Stage 3: Cancellability: The small print attempts to cancel the implicature. But we must assess:
     - The small print is in a less prominent location and in a smaller font. It may not be noticed by an ordinary consumer. Therefore, it is not effective in cancelling the generalized implicature.

   Stage 4: Materiality: The cap is material because if a consumer deposits more than £1,000, they get a lower rate. This would affect their decision.

   Stage 5: The claim is misleading because the implicature (that the rate applies to the entire balance) is false and the disclaimer is not effective.

   Verdict: Misleading.

   Claim 2: Energy tariff promising savings "up to £312 a year" on terms almost no customer satisfies.

   Stage 0: Literally, it says "savings up to £312". This is true because some customer (even if very few) might achieve that saving. So not literally false.

   Stage 1: What is said: Savings of up to £312 are possible.

   Stage 2: Implicatures:
     - Quantity: The ad does not say how many customers achieve that saving. The audience might infer that a typical customer could achieve a saving close to £312 (or at least that the saving is commonly achieved). This is a generalized implicature: "up to" often implicates that the maximum is achievable under typical conditions (or at least not under extremely rare ones). Also, the use of a specific number (instead of a range) might suggest it is a common outcome.
     - Context: Energy tariffs are complex and consumers may not understand the conditions. The ad is designed to attract by the large number.

   Stage 3: Cancellability: The terms and conditions (which state the conditions for achieving the maximum) are usually in small print. If the conditions are so strict that they are almost impossible to meet, and the disclaimer does not clearly convey that, then it may not cancel the implicature. The ordinary consumer would not read the fine print or would not understand the conditions as making the maximum saving unattainable.

   Stage 4: Materiality: The saving amount is a key factor in choosing a tariff. If the typical saving is much lower, that is material.

   Stage 5: The claim is misleading because the implicature (that a typical customer could achieve a saving close to £312) is false and the disclaimer is not effective in conveying the rarity of achieving the maximum.

   Verdict: Misleading.

   Claim 3: (Our choice) A shampoo bottle labeled "Now with 50% more!" (without any qualification).

   We design a claim that passes the procedure but might still be considered a trick.

   Background: The shampoo bottle previously contained 200ml and now contains 300ml. The claim "50% more" is true because 300ml is 50% more than 200ml. However, the bottle size has changed: the old bottle was 200ml and the new one is 300ml. But what if the price has also increased? The ad does not mention price.

   Stage 0: Literally, it says "50% more". This is true: the volume is 50% more than the previous version.

   Stage 1: What is said: The product now contains 50% more than before.

   Stage 2: Implicatures:
     - Quantity: The claim does not mention price. The audience might infer that the price has remained the same (or that they are getting more for the same price). This is a particularized implicature: in the context of product improvements, consumers often expect that the price remains the same. However, note that the claim does not mention price at all, so the implicature is context-dependent.
     - Quality: The advertiser must have evidence that the volume has increased by 50% (which they do).
     - Relation: The claim is about the volume, so it is relevant to the product.

   Stage 3: Cancellability: There is no disclaimer about price. But note: the claim does not make any representation about price. Therefore, the implicature that the price is the same is cancellable? Indeed, the advertiser could say: "We never said the price was the same." However, the context of the claim (on the bottle, without any mention of price) might lead to the inference. But is that inference strong?

     - We must consider: In the supermarket, the consumer sees the bottle and the price. If the price is clearly displayed and is higher, then the consumer will see that. But if the claim is made without the price (e.g., on the bottle alone) and the consumer has to remember the old price, then they might be misled.

     - However, the procedure must consider the typical context. In a store, the price is usually on the shelf. So the consumer can see the price and compare. Therefore, the implicature about price might not be drawn if the price is clearly displayed and different. But if the ad is in a magazine without any price, then the consumer might infer they are getting more for the same money.

     - Since the claim we are considering is on the bottle, and the bottle is sold in a store with a price, we might argue that the price is available and the implicature is not necessary. However, the panel might feel that the claim is a trick because the consumer might not notice the price increase and think they are getting a better deal.

   Stage 4: Materiality: If the price has increased by more than 50%, then the consumer is actually paying more per ml. But the claim doesn't address price. The material issue is whether the consumer is misled about the value. The expectation is that the consumer will compare the price and size. However, the claim might cause the consumer to think that the product is now better value without checking the price.

   Stage 5: According to our procedure:
     - The literal claim is true.
     - The implicature (that the price is the same) is particularized and context-dependent. In the context of a store where the price is displayed, it might be cancelled by the visible price. But if the claim is made in an ad without the price, then the implicature might be generated and it would be false if the price increased.

     - However, we designed the claim without specifying the medium. Let's say it's on the bottle and the price is displayed on the shelf. Then the disclaimer (the price tag) is present and the implicature is cancelled? But note: the price tag is not part of the advertiser's message. The advertiser has not provided a disclaimer about the price. So the cancellation comes from the context (the store) which is beyond the advertiser's control.

     - We must ask: is the advertiser responsible for the context? In the UK, the ASA considers the overall presentation. If the price is not displayed with the claim, then the advertiser might be responsible for the misleading impression.

     - But our procedure says: the disclaimer must be part of the advertisement. Here, the advertiser did not include any disclaimer about price. So the implicature (that the price is the same) might stand? However, the claim is about volume only. The procedure might conclude that the claim is not misleading because the literal meaning is true and the implicature about price is not strong enough (it is not a generalized implicature) and might not be drawn by an ordinary consumer in the context of a store.

     - But the panel might think it's a trick because they know that consumers often assume that the price remains the same when a product is "improved" (especially without mention of a price change).

   What the procedure fails to capture: The procedure relies on Gricean implicatures which are about communication. However, consumer behavior is influenced by cognitive biases. The claim "50% more" might lead consumers to focus on the gain and not check the price. The procedure does not account for the psychological impact of the claim, which might be to create a false sense of value even if the literal claim is true and the implicature is not strongly generated. The procedure also does not account for the fact that the advertiser might be exploiting a known consumer bias.

   What the procedure cannot be used for:
     - It cannot be used to assess non-linguistic deception (e.g., misleading images without text).
     - It does not account for cultural or demographic differences in interpretation (unless we adjust the context accordingly).
     - It does not cover conventional implicatures (which are part of the meaning of words like "but") that might be misleading.
     - It does not cover cases where the advertiser deliberately creates ambiguity that goes beyond conversational implicature (e.g., using words with multiple meanings without clarifying).
     - It does not cover the overall impression of the advertisement when multiple claims are combined in a way that creates a misleading impression that is not captured by looking at each claim individually.

   Therefore, even though the shampoo claim passes the procedure (if we conclude the price implicature is not generated or is cancelled by the store context), the panel might still find it misleading because of the overall impression it creates. The procedure is limited to linguistic analysis and does not cover psychological effects or the overall context beyond the immediate communication.

   Final note: The procedure is a tool to structure the analysis, but it requires human judgment at several points. It is grounded in Grice, but must be applied with common sense and an understanding of consumer protection.
answer: |-
  ### Procedure for Assessing Implicature in Advertising Claims  
  Based on Gricean pragmatics, this procedure evaluates whether a claim misleads by conversational implicature. Assumes the **audience treats advertising as cooperative** (per Grice's Cooperative Principle), expecting truthful, relevant, and clear messaging. If the audience is *non-cooperative* (e.g., assumes all ads are deceptive), implicatures weaken—but UK case law holds advertisers responsible for *ordinary* consumers’ interpretations, not hardened skeptics.  

  **Key Grounding in Grice:**  
  - **What is said:** Literal meaning (semantic content).  
  - **What is meant:** Meaning derived via conversational implicature (context + maxims).  
  - **Maxims:** Quantity (informativeness), Quality (truth), Relation (relevance), Manner (clarity).  
  - **Generalised vs. Particularised Implicature:**  
    - **Generalised:** Arises without specific context (e.g., "some" implies "not all"). Hard to cancel.  
    - **Particularised:** Depends on context (e.g., "It’s cold here" implying "close the window"). Easier to cancel.  
  - **Cancellability:** An implicature is cancellable if it can be denied without contradiction. *But:* Disclaimers (footnotes, asterisks) only cancel if **equally prominent and comprehensible**.  

  ---  
  ### Ordered Procedure (20-Minute Assessment)  
  1. **Stage 0: Literal Truth Check (Objective)**  
     - **Test:** Is the claim literally false?  
     - **Sufficient answer:** If false, violation. Stop. If true, proceed.  
     - *Judgment call?* No.  

  2. **Stage 1: Identify What Is Said (Literal Meaning)**  
     - **Test:** Parse semantics/syntax. Resolve ambiguity using co-text (headline, images, layout).  
     - **Sufficient answer:** State the unambiguous literal claim.  
     - *Judgment call?* Minimal (linguistic analysis).  

  3. **Stage 2: Derive Implicature (Maxim-Based Inference)**  
     - **Test:** Apply Grice’s maxims to reconstruct an ordinary consumer’s inference:  
       - **Quantity:** Does the claim omit material information? (e.g., "5% interest" → implies *no significant caps*).  
       - **Quality:** Does context imply evidence? (e.g., "scientifically proven" → implies robust data).  
       - **Relation:** Is irrelevant information included? (e.g., "award-winning" in a price claim → implies superiority).  
       - **Manner:** Is phrasing obscure? (e.g., "up to £312" → implies *achievable for many*).  
     - **Sufficient answer:**  
       - If no implicature arises (claim is literal, maxims satisfied), stop: not misleading.  
       - If implicature arises, classify as **generalised** (context-independent) or **particularised** (context-dependent).  
     - *Judgment call?* Yes (consumer perspective inference).  

  4. **Stage 3: Test Cancellability**  
     - **Test:**  
       - Can the implicature be denied without contradiction? (e.g., "5% interest*" with an asterisk → cap disclosed).  
       - Assess disclaimer:  
         - **Prominence:** Size, placement, timing (e.g., small print ≠ sufficient).  
         - **Clarity:** Unambiguous language (e.g., "terms apply" is vague; "only for balances <£1,000" is specific).  
         - **Context:** Does disclaimer negate the implicature *before* consumer action?  
     - **Sufficient answer:**  
       - Generalised implicature: Cancellation rarely effective (disclaimers must be **equally visible**).  
       - Particularised implicature: Cancellation possible if disclaimer is **integral to the claim**.  
       - If disclaimer fails → implicature stands.  
     - *Judgment call?* Yes (practical effectiveness over theoretical cancellability).  

  5. **Stage 4: Materiality & Consumer Expectation (Exit to Panel)**  
     - **Test:** Would the implicature affect a typical consumer’s decision?  
       - Consider: Product type, audience vulnerability, significance of omission.  
     - **Sufficient answer:**  
       - If immaterial (e.g., trivial detail), not misleading.  
       - If material (e.g., price, core benefit), refer to panel.  
     - *Judgment call?* Yes—but panel decides materiality/remedy.  

  ---  
  ### Application to Claims  

  #### **Claim 1: "5% Interest" (Cap at <£1,000, small print)**  
  - **Stage 0:** Literally true (rate exists for some).  
  - **Stage 1:** Literal meaning: "We offer 5% interest."  
  - **Stage 2:**  
    - **Quantity maxim breach:** Omits cap → generalised implicature that the rate applies *broadly* (e.g., to typical savings).  
    - Ordinary consumer infers: "I can earn 5% on my savings."  
  - **Stage 3:**  
    - Implicature cancellable *in theory* → but disclaimer in small print is **not equally prominent**.  
    - **Result:** Implicature not cancelled; claim misleading.  
  - **Stage 4:** Material (affects savings decisions). → **Refer to panel.**  

  #### **Claim 2: "Save Up to £312 a Year" (Rarely Achievable Terms)**  
  - **Stage 0:** Literally true (some hypothetical customer saves £312).  
  - **Stage 1:** Literal meaning: "Maximum saving is £312."  
  - **Stage 2:**  
    - **Quantity maxim breach:** Omits achievability → generalised implicature that savings *close to £312 are typical*.  
    - Ordinary consumer infers: "I could save around £312."  
  - **Stage 3:**  
    - Disclaimer (e.g., "for direct debit customers in Yorkshire") is particularised but **obscure** → fails to cancel generalised implicature.  
    - **Result:** Implicature stands; claim misleading.  
  - **Stage 4:** Material (price is key factor). → **Refer to panel.**  

  #### **Claim 3: "Free Gift Inside!" (Gift is a Sticker, No Asterisk)**  
  - **Chosen because:** Literally true, no disclaimer needed, but panel will see it as a "trick."  
  - **Stage 0:** Literally true (gift exists).  
  - **Stage 1:** Literal meaning: "A gift is included."  
  - **Stage 2:**  
    - **Quality maxim breach:** "Gift" implies something of value (generalised implicature).  
    - Ordinary consumer infers: "Gift is desirable/worthwhile."  
  - **Stage 3:**  
    - No disclaimer → no cancellation.  
    - **But:** "Gift" is subjective. Implicature hinges on **consumer expectation** (e.g., a toy in cereal, not a sticker).  
    - If context (e.g., luxury product) implies high-value gift → misleading.  
    - If context (e.g., budget product) sets low expectations → not misleading.  
  - **Stage 4:** Material if gift is a key incentive. → **Judgment call on context.**  
  - **Why it passes but feels like a trick:**  
    - Procedure focuses on linguistic implicature, not **psychological exploitation**. Grice doesn’t capture how advertisers leverage semantic vagueness ("gift") to create inflated expectations. Panel may rule against it under "overall impression" (UK Code Rule 3.1).  

  ---  
  ### Limitations of the Procedure  
  1. **Non-linguistic Tricks:** Fails for ambiguous imagery (e.g., photos suggesting product size).  
  2. **Cultural Context:** Doesn’t adjust for demographic nuances (e.g., children vs. adults).  
  3. **Overall Impression:** Gricean analysis treats claims in isolation; cannot assess cumulative effect of multiple elements.  
  4. **Materiality:** Defers to panel but doesn’t quantify harm (e.g., "Is £1 misleading?").  
  5. **Non-cooperative Contexts:** If consumers distrust all ads (e.g., payday loans), the procedure over-relies on implicature.  

  **Final Output:**  
  - Stages 0–3: Analyst’s recommendation (misleading/not).  
  - Stage 4: Panel decides materiality and remedy.  
  **Time Efficiency:** Focuses on high-risk stages (2–3); uses precedent to streamline judgments.
