  However, in games with three or more players, there could be correlated strategies among opponents. Rationalizability doesn't account for correlated beliefs—only independent ones. But Pearce's lemma, when applied in the context of IESDS, might allow for correlated opponents' strategies. The lemma doesn't specify independence; it's about existence of some beliefs. So in IESDS, when checking if a strategy is strictly dominated, we consider if there's a mixed strategy that outperforms it no matter what (independent) strategies opponents play. But the beliefs in rationalizability are also independent. 

  Wait, the key here is that in the definition of rationalizability, beliefs are over independent strategies of opponents. Similarly, in IESDS, domination must hold against any combination of pure strategies by opponents. So both concepts assume opponents' strategies are independent. Therefore, for strict dominance and never a best response under independent beliefs, the equivalence should hold regardless of player count. 

  But the professor might be confusing this with correlated rationalizability, where beliefs can be correlated. In that case, a strategy might be a best response to correlated beliefs but not to independent ones. However, the standard definitions both assume independent beliefs. The user mentioned weak dominance, where order matters. But here it's strict dominance. 

  I think the user is correct. The equivalence between IESDS (with mixed strategies) and rationalizability holds for any number of players under standard assumptions. The professor might be thinking of a different concept, like the equivalence between IESDS and correlated rationalizability, which does break down for three or more players. But that's not the standard setup. So the missing ingredient would be the assumption of independent beliefs. But since both procedures assume independence, they should align across all player counts. 

  To confirm, let's consider a three-player game. Suppose Player 1 has a strategy that's strictly dominated by a mixed strategy. Then it can't be a best response to any independent beliefs. Conversely, if it's never a best response, Pearce's lemma says it's strictly dominated. So the equivalence should hold. The professor's statement might stem from a misconception about correlated beliefs. The user's understanding seems solid here.
answer: |-
  Right, let's sort this out — you're sharp to spot the tension here. Your intuition is largely correct, and your professor is likely mixing concepts related to **correlation in opponents' strategies**. Pearce's Lemma itself **does not depend on the number of players**, but the *equivalence* between iterated elimination of strictly dominated strategies (IESDS) and rationalizability **requires an assumption about belief independence** that becomes critical in games with 3+ players.

  Here's the breakdown in British English:

  1.  **Pearce's Lemma (Holds for n-players):** This fundamental result states:
      > A pure strategy \(s_i\) for player \(i\) is **strictly dominated by some mixed strategy** \(\sigma_i\) (meaning \(u_i(\sigma_i, s_{-i}) > u_i(s_i, s_{-i})\) for *every* possible pure strategy profile \(s_{-i}\) of the other players) **if and only if** \(s_i\) is **never a best response** to *any* belief \(\mu_i \in \Delta(S_{-i})\) (where \(\Delta(S_{-i})\) is the set of all probability distributions over the opponents' strategy profiles \(S_{-i}\)).

      **The geometry is key:** This is purely about whether the payoff vector of \(s_i\) (across all opponent profiles) lies strictly *below* the convex hull of the payoff vectors of the other pure strategies. The number of players doesn't change this linear algebra/geometry. The lemma holds universally.

  2.  **Rationalizability (Bernheim (1984), Pearce (1984)):** A strategy is rationalizable if it survives iterated deletion of strategies that are never best responses. Crucially, in the standard definition used in most courses (and by Pearce/Bernheim):
      *   Players hold **independent beliefs** about their opponents. Player \(i\)'s belief \(\mu_i\) is a product distribution \(\mu_i^1 \times \mu_i^2 \times ... \times \mu_i^{j \neq i} \times ...\) over \(S_{-i}\), reflecting the assumption that opponents choose independently.
      *   A strategy is eliminated if there is **no independent belief** against which it is optimal.

  3.  **Iterated Elimination of Strictly Dominated Strategies (IESDS):** A strategy is eliminated if there exists *some* mixed strategy \(\sigma_i\) of player \(i\) that strictly dominates it. Crucially:
      *   The domination must hold against **every possible pure strategy profile** \(s_{-i} \in S_{-i}\) of the opponents.
      *   This is **equivalent** to requiring domination against *every possible mixed strategy profile* \(\sigma_{-i}\) of the opponents (because a mixed strategy profile is just a distribution over pure profiles, and payoffs are linear).
      *   **Critically:** This definition **does not assume** that opponents mix independently. The test includes strategies where opponents' choices *could* be correlated. When we say "for every \(s_{-i}\)", we are covering *all* combinations, correlated or not. The dominating mixed strategy \(\sigma_i\) must work against *any conceivable correlation* among opponents.

  **The Equivalence (& Where it Breaks):**

  *   **For Two-Player Games (\(n=2\)):** Player \(i\) has only *one* opponent. The space of beliefs \(\Delta(S_{-i}) = \Delta(S_j)\) and the space of opponent strategies \(S_{-i} = S_j\) are inherently the same thing.
      *   \(S_{-i}\) has only one component (\(j\)'s strategies). A pure profile \(s_{-i}\) is just player \(j\) choosing a single pure strategy.
      *   An independent belief \(\mu_i\) is just a distribution over \(j\)'s pure strategies. There's no distinction between correlation and independence because there's only one opponent to correlate *with*. Beliefs are simply over the single opponent's actions.
      *   **Therefore:** "Never a best response to any (independent) belief" (Rationalizability) is **identical** to "Strictly dominated by some mixed strategy" (IESDS) via Pearce's Lemma. The procedures are equivalent.

  *   **For Three-or-More-Player Games (\(n \geq 3\)):** Player \(i\) has *multiple* opponents (\(-i\)).
      *   **Rationalizability:** Only considers **independent beliefs** (\(\mu_i = \mu_i^1 \times \mu_i^2 \times ...\)). A strategy \(s_i\) is eliminated if there's *no independent belief* making it optimal.
      *   **IESDS:** Eliminates \(s_i\) if a dominating mixed strategy \(\sigma_i\) exists that beats \(s_i\) against **every possible pure strategy profile \(s_{-i} \in S_{-i}\)**. This set \(S_{-i}\) includes profiles where opponents' choices are **correlated** (e.g., Opponent 1 always chooses A when Opponent 2 chooses X). The test implicitly allows for *correlated opponent play*.
      *   **The Crux:** A strategy \(s_i\) might be strictly dominated (fails the IESDS test) *only* because it performs badly against some *correlated* opponent profiles that **could not be represented by any independent belief** \(\mu_i^1 \times \mu_i^2 \times ...\). Conversely, a strategy might be a best response to some *correlated* belief (not allowed in standard rationalizability) but not to any *independent* belief.
      *   **Therefore:** "Never a best response to any *independent* belief" (Rationalizability definition) **is NOT equivalent** to "Strictly dominated by some mixed strategy" (IESDS definition) in \(n \geq 3\) games. IESDS can eliminate strategies *faster* than rationalizability. Rationalizability might leave strategies that are strictly dominated against correlated play, but which *are* best responses to *some* independent belief.

  **What's the Missing Ingredient? Correlation.**

  *   **The Conceptual Cost of Adding it Back In:** To restore equivalence for \(n \geq 3\), you need to change the definition of rationalizability to allow players to hold **correlated beliefs** about their opponents. This means player \(i\)'s belief \(\mu_i\) can be *any* probability distribution over \(S_{-i}\), not just a product of independent distributions.
      *   **Cost 1: Conceptual Interpretation.** Independent beliefs reflect the idea that players assume opponents act *without coordination or shared signals*. Correlated beliefs allow players to think opponents *might* be correlating their actions (e.g., through sunspots, focal points, or unmodelled communication), even if they aren't explicitly colluding. This is a stronger assumption about players' mental models.
      *   **Cost 2: Predictive Power.** Correlated rationalizability is a weaker solution concept – it eliminates *fewer* strategies than independent rationalizability (and thus produces larger sets of possible outcomes). It makes less precise predictions.
      *   **Cost 3: Equilibrium Connection.** Correlated rationalizability relates more directly to **correlated equilibrium** than to Nash equilibrium. Nash equilibrium inherently relies on independent strategies.
      *   **Result:** If you define rationalizability using *correlated* beliefs ("never a best response to *any* belief, correlated or independent"), then Pearce's Lemma guarantees that the set of strategies surviving iterated deletion of never-best-responses (under correlated beliefs) **is exactly equal** to the set surviving IESDS, for any number of players. The equivalence is restored.

  **Why Your Prof Might Mention Weak Dominance:**

  You're right that weak dominance introduces order-of-elimination issues even in two-player games. That's a separate complication. The issue here is purely about the *type of beliefs* considered in the definition of rationalizability versus the implicit coverage of correlation in the IESDS dominance test.

  **The Verdict:**

  1.  **You are correct:** Pearce's Lemma holds universally. The geometric argument based on convex combinations and payoff vectors stands regardless of player count.
  2.  **Your professor is correct (in spirit, but loose on language):** The **equivalence between the standard procedure of rationalizability (using independent beliefs) and IESDS breaks down for \(n \geq 3\) players.** This isn't due to Pearce's Lemma failing, but due to the **different ways the two procedures handle the potential for correlation among multiple opponents.**
  3.  **The Missing Ingredient:** The assumption of **independent beliefs** in the standard definition of rationalizability.
  4.  **The Conceptual Cost:** Restoring equivalence requires moving to **correlated rationalizability**, which makes different (and arguably stronger) assumptions about the beliefs players can hold and produces less refined predictions.

  So, it wasn't Pearce letting you down, but the standard definition of rationalizability having a hidden assumption (independence) that bites when more than two players are jostling on the pitch. Cheers for spotting the nuance — it's a common point of confusion!
