prompt: |-
  Got stuck on something in my game theory course and I think my prof is either wrong or being very loose with language. My understanding is that Pearce's lemma says a pure strategy is never a best response (to any beliefs about what the others might do) exactly when it's strictly dominated by some mixed strategy — so iterated elimination of strictly dominated strategies, as long as you let mixtures do the dominating, just is rationalizability with extra steps, no independent content. He said that equivalence only holds for two-player games and that with three or more players the two procedures come apart, which struck me as bizzare: the lemma is about whether one payoff vector can be beaten by a convex combination of others, so what has the number of players got to do with the geometry? Is he maybe thinking of weak dominance, where the order of deletion does matter? Can you work out which of us is right — and if it really does break down at three players, say what the missing ingredient is and what it costs you conceptually to add it back in. Answer in British English please.
