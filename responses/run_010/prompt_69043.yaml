  We are designing a procedure for allocating scarce research funds. The key challenge is balancing between "monster" cases (few beneficiaries, large individual gains) and "diffuse" cases (many beneficiaries, small individual gains). The client has provided a specific dossier structure and constraints.

   After considering various principles of distributive justice and population ethics, I propose to use a **Modified Priority View** that incorporates both the magnitude of benefit per person and the number of beneficiaries, but with a constraint against extreme concentration. This is inspired by John Broome's work on fairness and the priority view, but modified for operational simplicity.

   Candidate principles considered and discarded:

   1. **Utilitarianism (maximize total expected benefit)**: 
      - Discarded because it would always favor the monster cases when the product of (number of beneficiaries * benefit per person * probability of success) is highest. This leads to the "eleven patients" problem and ignores distributional concerns.

   2. **Maximin (focus on the worst-off)**:
      - Discarded because it is too extreme in the opposite direction: it would only look at the severity of the condition and ignore the number of people helped and the probability of success. Also, in our context, the worst-off might be a single patient with a fatal condition, but that might not be the most efficient use of funds.

   3. **Equal worth per life (e.g., QALY-based cost-effectiveness)**:
      - Discarded because it requires a common metric (like QALYs) that we don't have and cannot require from applicants. Also, it does not account for the concentration of benefits and might still lead to monster cases if the QALY gain per person is very high.

   4. **A pure constraint on concentration (e.g., no project can receive more than X% of the budget unless it benefits at least Y people)**:
      - Discarded because it is arbitrary and does not account for the magnitude of benefit. Also, it might rule out a project that is truly transformative for a small group without good reason.

   5. **A multiplicative model with diminishing returns (e.g., total benefit = (number of people)^k * (benefit per person) for some k<1)**:
      - Considered but discarded because it requires choosing k arbitrarily and doesn't address the client's intuition that concentration (not magnitude) is the issue. Also, it would require a common metric for benefit.

   The chosen principle: **Modified Priority View with a Concentration Constraint**

   We want to give priority to the worse off (those with severe conditions) but not to the exclusion of helping many people. We also want to avoid projects that are extremely concentrated. The procedure:

   - First, we define the "burden" of a condition by its severity and the fact that it is untreated (this captures the priority to the worse off).
   - Then, we calculate a "value index" for each project: (number of beneficiaries) * (burden per person) * (probability of success) / (amount requested). This index represents the cost-effectiveness in terms of burden reduction per euro, giving priority to severe conditions.
   - However, we impose a constraint: a project that would benefit fewer than Z people (where Z is a threshold to be set) cannot receive more than a fixed percentage (say 30%) of the cycle budget, unless it is the only project that passes the other steps.

   Why this modification? The client's intuition is that the resistance to monster cases is about concentration. We allow large magnitude per person (which is innocent) but cap the budget share for very concentrated projects.

   Diagnosis of the past failure (the 61% to 11 patients):

   - The flaw: The project was considered last and not ranked against others. Also, the benefit per person was taken at face value without considering the opportunity cost (what else could have been done with the money) and without questioning the concentration.
   - The missing question: "What is the total burden alleviated by this project per euro, and does it exceed that of other projects? Also, is the number of beneficiaries so low that we should cap the funding even if the value index is high?"

   Ruling on magnitude vs. concentration:

   - The distinction survives with revision. The intuition that we resist concentration is correct, but magnitude alone is not entirely innocent. If the magnitude is extremely large (e.g., saving a life) then even if concentrated, we might feel compelled to fund. However, the constraint should be on concentration (number of beneficiaries) because that is what triggers the feeling of unfairness. We will constrain by setting a maximum budget share for projects with very few beneficiaries. But note: we are still using magnitude (via burden) in the value index.

   Revised statement: We constrain based on the number of beneficiaries (concentration) and leave the magnitude of benefit per person unconstrained in the value index. However, the burden per person (which is a function of severity) already captures the magnitude of the problem. So we are not entirely ignoring magnitude, but we are using it in a way that is sensitive to priority.

   The Procedure in JSON:

   Steps:

   We have 90 minutes. Steps must be answerable from the dossier.

   Steps:

   1. **Check for completeness**: Does the dossier contain all required fields? (factual)
      - If not, defer for information.

   2. **Check for technical feasibility**: Is the probability of success at least 10%? (judgment) 
      - We set a low bar to avoid wasting money on pure moonshots. If below, reject.

   3. **Calculate burden per person**: We define burden as the harm of the condition if untreated. We use the dossier's natural history and severity. We assign a burden score on a scale of 1 to 10 (10 being death or equivalent). This step requires a judgment by the panel. (judgment)
      - We create a burden scale: 
          - 10: Conditions causing premature death (e.g., fatal in childhood).
          - 7-9: Conditions causing severe disability, chronic pain, or significant loss of function (e.g., blindness, paralysis).
          - 4-6: Conditions causing moderate disability or loss of function.
          - 1-3: Conditions causing mild disability or discomfort.
      - The panel assigns a burden score by majority vote.

   4. **Calculate the value index**: 
      - Value index = (number of beneficiaries) * (burden per person score) * (probability of success) / (amount requested)
      - This is a factual calculation once burden is assigned.

   5. **Apply concentration constraint**: 
      - If the number of beneficiaries is less than 20 (a threshold we set, considering the client's example of 11) then the maximum funding is capped at 30% of the cycle budget. (Note: the client's example had 11 and got 61%, which we want to avoid.)

   6. **Rank by value index**: Sort the projects by value index (descending). (factual)

   7. **Allocate funds**: Starting from the highest value index, fund until the budget is exhausted, subject to the concentration constraint. (values) 
      - However, if a project is capped by the concentration constraint, we note that and then move to the next.

   8. **Check for deferral**: If an application is not funded because of the concentration constraint, but it is the only one in its category (e.g., the only one for a fatal childhood condition) and the burden is 10, then the panel may by majority vote override the constraint. (values) 
      - This is a safety valve for truly catastrophic conditions.

   9. **Finalize**: For each project, decide: fund in full, fund at reduced scope (if the applicant agrees to a reduced budget and that is possible), reject, or defer for information. (values)

