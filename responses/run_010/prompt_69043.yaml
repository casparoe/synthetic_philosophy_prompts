  ### Prose Section

  **(a) Normative Principle**  
  The procedure allocates funds by maximizing the expected reduction in suffering per euro spent, prioritizing severe conditions, while imposing a hard cap on any project benefiting fewer than 15 people. Specifically:  
  - Each condition is assigned a "burden score" (1–10) reflecting untreated severity, with 10 being fatal childhood diseases.  
  - A "value index" is calculated: (Burden × Beneficiaries × Probability of Success) ÷ Amount Requested.  
  - Projects are ranked by this index. Funds are allocated top-down until exhausted.  
  - **Concentration cap**: No project serving <15 beneficiaries may receive >25% of the cycle’s budget (€300,000), regardless of value index.  

  This balances efficiency (high burden reduction per euro) with fairness (preventing monopolization by ultra-rare conditions). Magnitude of individual benefit is unconstrained; resistance arises only when benefits are concentrated in few lives.  

  **(b) Rival Principles Discarded**  
  - **Utilitarianism (maximize total expected benefit)**: Discarded for ignoring distributional fairness. It would always fund "monsters" like Case A, violating our intuition that 11 lives shouldn’t consume 61% of resources when thousands could benefit.  
  - **Prioritarianism (favor the worst-off)**: Discarded for impracticality. Without a common metric (e.g., QALYs), we cannot compare severity across conditions objectively. Burden scoring (Step 3) operationalizes this intuition partially but avoids intractable interpersonal comparisons.  
  - **Equal per-person weighting (e.g., QALY-based)**: Discarded for incompleteness. Dossiers lack harmonized benefit metrics (e.g., "months of function" in Case B vs. "preserved vision" in Case C), making aggregation impossible. Value index uses burden as a proxy.  
  - **Anti-concentration thresholds (e.g., no projects with <100 beneficiaries)**: Discarded for rigidity. A cap tied to budget share (not beneficiary count) allows funding small groups if costs are low, but prevents dominance.  

  **(c) Diagnosis of Past Failure**  
  The flaw was **double isolation**: The project was evaluated outside a comparative framework (never ranked) and shielded from opportunity-cost scrutiny. The value index would have exposed this by forcing a head-to-head comparison. The fatal missing question:  
  > *"What is the burden score, and how does its value index compare to other proposals?"*  
  At Step 4 (value index calculation), Case A’s index (0.000026) would have ranked last among viable projects, preventing allocation of 61% without override debate.  

  **(d) Ruling on Magnitude vs. Concentration**  
  Your distinction **survives with revision**:  
  - **Concentration** (benefits divided among few) is the true trigger of resistance, as hypothesized. We constrain it via the 25% cap.  
  - **Magnitude** (how much one life gains) remains unregulated but is **indirectly bounded** through burden scoring. Extreme individual gains (e.g., saving a child’s life) elevate burden (always 10), boosting value index—but concentration caps prevent distortion.  
  - **Correction**: Magnitude isn’t "innocent" alone; if 1,000 people gained enormous benefits (e.g., life-saving), we’d fund them without restraint. Resistance requires **both** high magnitude and high concentration. Thus, we cap concentration only.  

