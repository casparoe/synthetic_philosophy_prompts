  ### Candid Assessment of Failure Modes

  **Where the procedure misfires:**  
  - **Burden inflation**: A compelling narrative (e.g., dying children) may sway panelists to assign higher burden scores than clinically justified (Step 3).  
  - **Value index distortion**: Projects with chronic, non-fatal conditions (e.g., Case C) are disadvantaged, as burden scores favor mortality (Steps 3–4).  
  - **Override abuse**: Emotional appeals may override caps for non-viable projects (Step 8), especially with vocal patient advocates.  

  **Gaming by applicants:**  
  - **Beneficiary manipulation**: Understating counts to avoid caps (Case A) or using ambiguous timeframes (e.g., "lifetime beneficiaries") to inflate the value index (Step 4).  
  - **Burden overselling**: Overstating severity (e.g., calling reversible disability "catastrophic") to elevate scores (Step 3).  
  - **Cost underreporting**: Lowballing budgets to boost value index, then requesting supplements later (Step 4).  

  **Dropped distinctions from theory:**  
  - **Time discounting**: Ignoring when benefits accrue (e.g., immediate vs. 10-year gains). Lost: Penalizes preventive interventions.  
  - **Risk aversion**: Not penalizing high uncertainty beyond the 10% threshold. Lost: Undervalues high-risk, high-reward projects.  
  - **Non-identity problem**: Not addressing whether creating future patients (e.g., via new therapies) changes obligations. Lost: Ethical nuance in innovation contexts.  

  **Final note**: The procedure is robust for 90-minute meetings but imperfect. It errs toward transparency over precision—exposing trade-offs (e.g., Case A vs. B) rather than resolving them perfectly. Use it to force debate, then refine through iteration.
