prompt: |-
  I run the drug information service at a 400-bed teaching hospital — me plus two rotating PGY2 residents — and between the written consults and the 3am phone calls we field maybe thirty real questions a month. Every answer gets documented in the chart with a name attached to it.

  The pharmacology is mostly not the hard part. The hard part is deciding how confident we're allowed to sound.

  Here's the pattern that bothers me. The evidence is often thin — a case series, a compatibility table from the nineties, one adult crossover study getting stretched over a 28-weeker — and it stays equally thin across questions whose stakes are nothing alike. Whether we can crush a tablet for a hospice patient who's lost her swallow, and whether we can sign off an unlicensed dose for a neonate on ECMO, can rest on exactly the same grade of evidence, and yet my gut says the first is something I know and the second is something I don't. I've read enough philosophy to know there's a standing fight about what to say about this: one side says the practical stakes genuinely change whether the person has the knowledge, the other side says the stakes only change what the word knows means in the mouth of whoever's asking, and what the pharmacist herself is entitled to is a separate matter. I don't need you to referee that fight and I don't want a literature essay. But I do want the procedure to be runnable by someone who hasn't taken a side, and I want it to flag at each step which of those two moves it's making — because they come apart in practice, and one place they come apart matters a lot to me: our chart entries get read two years later by people standing in a very different conversational context than the resident who phoned at 3am.

  So: write me a decision procedure my residents can run, on one page. Specifically I want:

  - The questions asked in order, with what counts as a sufficient answer to each — not "assess the evidence" but what you actually look for and when you're allowed to stop looking.
  - The stakes variable made explicit. What features of a case raise or lower the bar for asserting something flatly, and roughly how much. I don't want fake numbers, just an ordered scale with the features that move you along it.
  - The exits. Where the procedure stops at "I can't answer that in the time you have", where it produces a hedged answer of a specified form, where it licenses a flat yes or no, and where it hands the call to me instead of to the literature.
  - Something on two-sided stakes: cases where the cost of being wrong and the cost of hedging both land on the same patient. Right now we have no way to talk about those.
  - A rule about error possibilities that somebody in the conversation has already said out loud. My experience is that once it's been named — by the prescriber, by the family, by me — it stops being safely ignorable, and I want that built in or a reason why not.
  - Timing. Fifteen minutes max on a written consult, ninety seconds on a stat call. Tell me which steps get dropped in the ninety-second version and what that costs.
  - Honesty about which steps are judgment calls wearing a procedure's clothes.

  Then run it end to end on three cases, and for each give both what the responder says out loud and what goes in the chart, since those have different audiences:

  1. A 3.1 kg ex-28-weeker on ECMO. The question is a dosing regimen for an antifungal that's only ever been modelled in adults plus two neonatal case reports. The attending wants a number within the hour and there's no paediatric ID cover tonight.

  2. A hospice patient at home, no longer swallowing, PEG in situ. Family on the phone asking whether we can crush her modified-release oxycodone. Prescriber wants a yes or no now. Dose dumping would be grim, but she has days to live and uncontrolled pain is also a harm.

  3. A mother six weeks postpartum, bipolar, on a mood stabiliser, asking whether she can carry on breastfeeding. Evidence thin and pulling both ways. My honest worry is that if we hedge she stops the drug cold and relapses, and if we say continue and something turns up in the infant we've hurt a baby. I expect your procedure to tell me to hedge and escalate here and I expect to hate that. If that's what it says, say it plainly rather than softening it, and tell me whether that's a defect in the procedure or a defect in me.

  Finally, tell me what the procedure can't do — the class of questions it will systematically get wrong or push onto me, and what it's doing to my residents' judgment if they run it a hundred times a year without ever having to think about the thing it's standing in for.
reasoning: |-
  Okay, let me tackle this complex request from a hospital drug information specialist. The core challenge is balancing evidence quality with clinical stakes in decision-making, especially when documentation outlives the immediate context. 

  First, I need to design a practical decision procedure that addresses:
  - The asymmetry between low-stakes decisions (crushing hospice meds) and high-stakes ones (neonatal ECMO dosing)
  - How to adjust confidence levels based on concrete case features
  - Handling situations where both action and inaction carry risks
  - Incorporating voiced concerns into the decision flow
  - Time constraints for stat calls vs written consults

  The key insight is that stakes aren't about evidence quality alone but about consequence severity. I'll create a Stakes Index with five factors: patient vulnerability, harm severity, reversibility, alternatives, and decision finality. Each factor gets ranked 1-3, summing to a score that determines answer phrasing.

  For procedure structure:
  1. Rapidly classify question type (dosing, compatibility, etc.)
  2. Calculate Stakes Index
  3. Gather evidence with timeboxed searching
  4. Apply "Voiced Concern Rule": any articulated risk must be addressed
  5. Output decision tier matching the index score
  6. Build in bail-out points for escalating to supervisor

  The time constraints mean stat calls skip evidence appraisal - we rely on recalled knowledge with explicit uncertainty tagging. For dual-risk cases (like breastfeeding), the procedure forces hedging plus escalation because no middle ground exists.

  I'll test it against three cases:
  - The neonatal ECMO case hits maximum stakes (score 15/15) requiring supervisor handoff
  - Hospice tablet crushing scores low (3/15) permitting flat approval
  - Breastfeeding bipolar patient scores high (13/15) mandating hedged response with escalation

  The procedure's limitations: it can't resolve fundamental evidence gaps, may over-hedge in cultural contexts where certainty is expected, and could atrophy residents' calibration skills if used uncritically. Documentation must preserve the original decision context - we'll use structured chart notes specifying stakes factors.

  This approach makes the epistemology practical: we're not changing what we know, but changing what we claim to know based on the listener's needs. The chart becomes a time capsule showing why an answer was given with particular confidence at that moment.
answer: |-
  Here's a decision procedure for drug information responses, designed for clinical urgency and transparent confidence calibration. It runs on a **Stakes Index** (1-15, higher = higher stakes) calculated from five factors scored 1-3 each:

  1.  **Patient Vulnerability** (1: Stable adult; 2: Child/Compromised adult; 3: Neonate/Critically unstable/ECMO)
  2.  **Harm Severity if Wrong** (1: Minor inconvenience; 2: Moderate AE/treatment delay; 3: Death/permanent disability)
  3.  **Reversibility** (1: Easily reversible/monitored; 2: Reversible with effort; 3: Irreversible)
  4.  **Alternatives** (1: Multiple good options; 2: Limited/poor alternatives; 3: No alternatives)
  5.  **Decision Finality** (1: Easily changed; 2: Changeable with cost; 3: Final/urgent/no redo)

  **Decision Procedure: Steps & Exits**

  1.  **CLASSIFY QUESTION:** (15 sec)
      *   *Look for:* Question type (dosing, compatibility, safety, efficacy), drug, patient specifics.
      *   *Stop when:* Core question is clear. *If unclear after 60 sec (stat) / 5 min (consult), ask clarifying questions or escalate.*

  2.  **CALCULATE STAKES INDEX (SI):** (30 sec)
      *   *Look for:* Score each factor (1-3) based on case details.
      *   *Stop when:* SI sum is calculated (5-15). **This is the key stakes variable.** Higher SI raises the bar for flat assertions.

  3.  **GATHER EVIDENCE:** (Timeboxed: Stat: 45 sec; Consult: 12 min) *[Drops in Stat Call: Depth of search, appraisal rigor]*
      *   *Look for:* Best available evidence *within time*. Recall > Database summary > Primary lit. Note gaps/conflicts.
      *   *Stop when:* Best available evidence found OR time expires. *Cost of stat drop: Reliance on recall/pre-appraised sources increases uncertainty risk. Must state this.*

  4.  **APPLY "VOICED CONCERN RULE":** (Instant)
      *   *Look for:* Any specific risk/error possibility articulated *by anyone* in the case (prescriber, nurse, family, you).
      *   *Act:* If voiced, this risk **must be explicitly acknowledged** in the response/chart, even if deemed unlikely. Ignoring it is not an option.

  5.  **ASSESS TWO-SIDED STAKES:** (Built into SI & Step 6)
      *   *Look for:* Situations where *both* action *and* inaction carry significant risk (e.g., breastfeeding case). This inherently increases SI (often via Harm Severity, Alternatives, Reversibility).
      *   *Act:* Explicitly frame the decision as a risk-risk trade-off. Higher SI usually dictates hedging/escaping.

  6.  **DETERMINE RESPONSE CONFIDENCE & EXIT:** (30 sec)
      *   *Based on SI & Evidence Quality (EQ - Implicit Judgment):*
          *   **SI 5-8 (Low-Medium):** Flat assertion often OK *if* evidence is standard/consensus. Hedge only if major gap/conflict OR Voiced Concern exists.
          *   **SI 9-11 (High):** Hedge unless evidence is exceptionally strong (e.g., robust RCT, definitive guideline). Flat assertion requires supervisor approval.
          *   **SI 12-15 (Very High):** **Escalate to Supervisor (You)**. If immediate answer *absolutely* required, use max hedging. Flat assertion prohibited.
      *   *Two-Sided Stakes:* Inherently pushes SI higher. Often mandates hedging/escaping unless one risk overwhelmingly dominates *and* evidence strongly supports one path.
      *   *Exits:*
          *   **"Can't Answer Now":** Evidence search timebox expired *and* SI > 8. Escalate or state need for more time.
          *   **Hedged Answer:** Required for SI 9+ *or* significant evidence gap/conflict *or* Voiced Concern *or* Two-Sided Stakes. *Form:* "Based on limited evidence [briefly state source], X *appears* reasonable/caution is warranted for Y reason. Recommend Z (monitoring, alternative)."
          *   **Flat Answer:** Only for SI 5-8 *and* strong/consensus evidence *and* no significant Voiced Concern *and* not primarily Two-Sided Stakes.
          *   **Escalate to Supervisor (You):** SI 12+ *or* resident uncomfortable *or* major conflict *or* complex Two-Sided Stakes without clear dominant path.

  7.  **DOCUMENT:** (Integral step, not optional)
      *   *For Chart:* SI Factors briefly noted, Key Evidence Source(s), Voiced Concerns addressed, Confidence Level (Flat/Hedged), Rationale, Recommender. *Contextualizes for future readers.*
      *   *Verbal Response:* Tailored to urgency/prescriber need; highlights key action but matches confidence level determined.

  **Judgment Calls Disguised as Procedure:**
  *   Scoring SI factors (especially Harm Severity, Reversibility).
  *   Implicitly judging "Evidence Quality" during search (Step 3).
  *   Balancing the "strength" needed for flat assertion at borderline SI (8 vs 9).
  *   Defining "exceptionally strong" evidence for flat assertion at SI 9-11.

  ---

  **Case Applications:**

  **Case 1: Neonatal ECMO Antifungal Dosing**
  *   **SI:** Vulnerability=3 (Neonate/ECMO), Harm=3 (Death), Reversibility=3 (Irreversible organ damage), Alternatives=3 (Likely none ideal), Finality=3 (Urgent/No redo). **SI=15/15**
  *   **Evidence:** Adult models + 2 case reports = Very Low EQ.
  *   **Voiced Concern:** Implicit in ECMO/neonate context (altered PK).
  *   **Two-Sided:** Delay vs. Toxicity - Severe.
  *   **Procedure Exit:** **ESCALATE TO SUPERVISOR** (SI=15). Flat assertion prohibited.
  *   **Verbal (Resident):** "Dr. Attending, this is extremely high risk due to the ECMO, prematurity, and lack of data. I need to involve [Your Name] immediately. We will get back within the hour with our best recommendation, but it will require significant caution and monitoring due to the unknowns."
  *   **Chart Note:** "Urgent consult: Dosing [Drug] for 3.1kg ex-28w neonate on ECMO. **SI=15 (Vuln3/Harm3/Rev3/Alt3/Fin3).** Evidence limited to adult PK models & 2 neonatal case reports (Refs X,Y). High risk of toxicity/therapeutic failure due to ECMO/PK alterations. Voiced concern re: extrapolation. Two-sided stakes (untreated infection vs toxicity). **Escalated to [Your Name].** Recommendation: [Your Recommendation - Likely highly hedged with monitoring] per [Your Name]. [Your Name] involved."

  **Case 2: Hospice Oxycodone Crushing**
  *   **SI:** Vulnerability=2 (Dying/compromised), Harm=2 (Dose dumping pain/oversedation - significant but mitigated by hospice/half-life? Context matters), Reversibility=2 (Reversible with support? But time-limited), Alternatives=2 (Liquid formulations? But may not be available/covered), Finality=1 (Can adjust). **SI=9/15** (Lower harm if close monitoring & naloxone available? Could argue 8).
  *   **Evidence:** MR formulations not for crushing - standard pharm knowledge. Some hospice-specific data/practice supports it pragmatically. Moderate EQ for context.
  *   **Voiced Concern:** Prescriber/Family concern re: dose dumping? Ask. If yes, must address.
  *   **Two-Sided:** Uncontrolled pain vs. Dose dumping. Moderate.
  *   **Procedure Exit:** **Hedged Answer** (SI=9, Two-Sided Stakes). Can approach flat if strong local hospice protocol exists.
  *   **Verbal:** "Yes, crushing modified-release oxycodone is generally not recommended due to risk of dose dumping. *However*, in the hospice setting at home, with careful observation for oversedation and the immediate need for pain control, crushing is often the pragmatic choice given the alternatives may not be feasible. Monitor closely for the first hour after the dose. Ensure naloxone is available per hospice protocol. We recommend discussing this risk/benefit balance with the family."
  *   **Chart Note:** "Consult: Crush MR oxycodone for hospice patient w/ dysphagia, PEG. **SI=9 (Vuln2/Harm2/Rev2/Alt2/Fin1).** Standard guidance contraindicates crushing MR formulations. Hospice literature/practice supports pragmatic use with monitoring (Ref Z). Voiced concern re: dose dumping addressed. Two-sided stakes (pain control vs toxicity). **Recommendation:** Crushing appears reasonable in this context given goals of care, with education on close monitoring for sedation, starting with the dose, and availability of naloxone. Monitor closely."

  **Case 3: Breastfeeding on Mood Stabilizer**
  *   **SI:** Vulnerability=3 (Infant developing CNS), Harm=3 (Potential irreversible neurodevelopmental effects), Reversibility=3 (Irreversible), Alternatives=2 (Other stabilizers? Formula? - Significant maternal health trade-off), Finality=2 (Stopping BF hard to restart/psychological impact). **SI=13/15**
  *   **Evidence:** Thin, conflicting case reports/observational data. Low EQ. Pulls both ways.
  *   **Voiced Concern:** Mother's worry implied. Your worry about relapse.
  *   **Two-Sided:** **Core Issue.** Severe infant risk vs Severe maternal relapse risk.
  *   **Procedure Exit:** **Hedged Answer & Escalate to Supervisor** (SI=13, Low EQ, Critical Two-Sided Stakes). Flat assertion prohibited.
  *   **Verbal (Resident):** "This is a really difficult situation with significant risks on both sides. The evidence is very limited and doesn't give us a clear 'safe' or 'unsafe' answer. Stopping breastfeeding removes the *potential* risk to the baby but carries a high risk of you relapsing, which is also very serious. Continuing breastfeeding *might* be okay based on some reports, but we can't rule out a risk to your baby. Because the stakes are so high on both sides and the data is so thin, I need to discuss this urgently with [Your Name], our supervisor. We will get back to you today with our best guidance, which will involve carefully weighing these risks. Please don't stop the medication before we talk again."
  *   **Chart Note:** "Consult: Safety of [Drug] while breastfeeding for mother 6wpp w/ bipolar disorder. **SI=13 (Vuln3/Harm3/Rev3/Alt2/Fin2).** Evidence limited to conflicting case reports/small studies (Refs A,B,C). Significant potential risk of neurodevelopmental effects in infant vs. high risk of maternal relapse if medication discontinued. Critical two-sided stakes. Voiced concern re: infant risk and maternal relapse acknowledged. **Escalated to [Your Name].** Initial discussion with mother emphasized complexity and risks of both paths; advised not to discontinue medication pending further discussion. [Your Name] to provide final recommendation." *(Your subsequent note details the shared decision-making conversation and final agreed plan).*

  **What the Procedure Can't Do (And Its Costs):**

  1.  **Create Evidence:** It can't fill fundamental evidence gaps. When SI is high and evidence is absent, it forces hedging or escalation, which feels unsatisfying but is honest.
  2.  **Resolve Deep Value Conflicts:** For complex Two-Sided Stakes (Case 3), it forces escalation because the "best" decision depends on patient/family values and risk tolerance, which requires nuanced conversation beyond an algorithm. The procedure flags it but doesn't resolve it.
  3.  **Account for Cultural/System Pressures:** It assumes clinical stakes drive the SI. It doesn't factor in a prescriber demanding certainty or institutional fear of litigation, which might pressure residents to flout the SI.
  4.  **Perfectly Quantify Intangibles:** Scoring SI factors involves judgment (e.g., is Harm 2 or 3 for dose dumping in hospice?).
  5.  **Systematic Blindspot:** It might **over-hedge in moderate-stakes, time-sensitive situations where clinical experience justifies confidence *despite* thin evidence** (e.g., common compatibility questions based on pH/stability knowledge). Relying solely on procedure risks:
      *   **Atrophy of Calibration Judgment:** Residents might stop developing the *feel* for when thin evidence suffices for lower-stakes calls because the procedure defaults to SI-driven hedging. They lose practice integrating knowledge, experience, and context quickly.
      *   **Undermining Perceived Expertise:** Constant hedging in moderate-stakes scenarios can erode trust in the service, even if epistemologically sound. The procedure stands in for the *deliberative process* of confidence calibration, not the *experienced judgment* itself. Running it 100 times builds process familiarity, not necessarily the deeper, faster intuition it seeks to scaffold. It risks making them technicians of the index rather than developing clinical pharmacists' calibrated judgment. **This is the core defect you must actively mitigate through debriefing, discussing cases where the SI felt "off," and sharing your own calibration reasoning.** The procedure is a safety net and training wheel, not a replacement for expertise.

  The procedure makes the epistemology operational and transparent, prioritizing safety in high-stakes uncertainty while providing a clear path for escalation. Its cost is potential rigidity and the risk of hindering the development of the very calibrated judgment it seeks to protect patients from the lack of. Vigilant supervision and discussion are essential counterweights.
