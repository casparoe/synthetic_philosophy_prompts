prompt: |-
  I'm working on a piece about how PTSD got made and then kept remaking itself, and I want to run the whole arc past Hacking's looping effects instead of the usual "real discovery or political concession" fight, which I've read a hundred times.

  Bare bones as I have them: the label came out of the seventies work with Vietnam veterans, their advocates pushed it into the DSM in 1980, and that first definition insisted the triggering event had to sit outside the range of what people normally go through. Every revision since has chewed on that opening criterion — partly because the epidemiology kept showing how common such events turn out to be, and partly because one edition added a clause making the survivor's own fear or helplessness at the time part of what counted, and a later one cut it again. Along the way the diagnosis became the gateway to VA benefits, courtroom testimony and insurance payouts.

  So: who's classifying and who's classified here, and where does the feedback actually run — testimony, benefits, or survivors learning to narrate their own experience in the manual's vocabulary? What does looping explain about the drift in criterion A that a plain accumulating-evidence story can't? I keep wanting to seperate a loop from below, where the classified change the category, from a loop from above, where institutions change it by attaching money and legal standing to it, and I'm not sure its a distinction the theory can hold.

  Then tell me where it goes quiet: do soldier's heart, railway spine and shell shock mean this was an indifferent kind all along, or just an earlier lap of the same loop? Does looping say anything about whether the category is true, and what would make you think a loop had stalled or run backwards?

  Give it to me as exactly five numbered points, a sentence or two each, no preamble and no wrap-up. Don't bother with citations or a reading list — I know the literature, I want your reading of the case.
reasoning: |-
  Okay, let me unpack the user's query. They're writing about PTSD's evolution and want to apply Hacking's looping effects framework instead of the typical realism vs. social construction debate. The core elements are: PTSD's origin in Vietnam advocacy leading to DSM-III (1980), the ongoing revisions of Criterion A (the stressor requirement), and how institutional gatekeeping (VA benefits, courts) interacts with symptom presentation.

  The user poses three layered questions: First about classification dynamics (who classifies/gets classified), second about feedback mechanisms (testimony/benefits/self-narration), third about historical precedents (soldier's heart etc.) and how looping interacts with diagnostic validity. Their unspoken tension seems to be whether looping can resolve the "top-down institutional vs bottom-up lived experience" dichotomy they're struggling with.

  Hmm, the challenge is condensing this into five precise points without fluff. For point 1, I'll establish the bidirectional loop between classifiers (clinicians/DSM committees) and classified (veterans/survivors). Point 2 must address how institutional payouts create a feedback channel separate from testimony - maybe emphasize eligibility pressures. Point 3 should tackle their core dilemma: looping explains Criterion A's drift as co-construction rather than just evidence accumulation, where symptom reporting adapts to category changes. 

  For historical parallels (point 4), I'm considering framing soldier's heart etc. as distinct loops because pre-DSM institutionalization was minimal - the "indifferent kind" idea. Finally, point 5 needs to confront validity: looping makes truth provisional, stalling when diagnostic stability persists despite new evidence. 

  The user clearly knows Hacking well, so I'll avoid theory explanations and focus on application. Their frustration with binary debates suggests they want looping as a third way - I'll highlight how it transcends "discovery vs concession" by showing mutual adaptation. The institutional/lived experience distinction might indeed collapse under looping, since VA benefits influence self-narration. 

  ...Wait, should point 3 explicitly say the dichotomy doesn't hold? Yes - the feedback channels they want to separate are entangled in practice. And for stalling: I'll cite the removal/reinstatement of fear/helplessness as back-and-forth movement. No citations needed per their request, but historical examples must be precise - railway spine was compensation-driven, unlike shell shock. Done.
answer: |-
  Here are five numbered points addressing your query:

  1.  **Classifiers & Classified:** Classifiers are DSM committees, clinicians, and institutions (VA, courts). The classified are trauma survivors whose experiences are interpreted through the evolving PTSD framework. Both groups shape the category reciprocally.

  2.  **Feedback Channels:** Feedback runs primarily through **institutional gatekeeping (benefits, testimony)** and **survivor self-narration**. Eligibility requirements (VA, insurance) directly pressure diagnostic criteria, while survivors increasingly articulate distress using the manual's language to access recognition and resources.

  3.  **Looping vs. Evidence on Criterion A:** Looping explains the drift as co-construction: expanding epidemiology reflects *both* broader recognition (evidence) *and* survivors/veterans framing common experiences as traumatic to fit the category for validation/resources. The "top-down/bottom-up" distinction collapses; institutions and lived experience interact inseparably within the loop.

  4.  **Historical Precedents:** Soldier's heart, railway spine, and shell shock represent **distinct historical loops**, not the same category. Each emerged from specific contexts (war tech, industrialization) with unique classifiers (military docs, compensation boards) and classified, demonstrating the phenomenon's recurrence but not an indifferent kind.

  5. **Looping, Truth, & Stalling:** Looping sidesteps "truth" by focusing on dynamic interaction; the category's utility and stability define its reality within the loop. A loop stalls when diagnostic criteria/responses stabilize despite new evidence or pressures (e.g., periods between DSM revisions). It runs "backwards" when criteria *restrict* scope (e.g., DSM-IV removing subjective fear/helplessness temporarily countered prior expansion).
