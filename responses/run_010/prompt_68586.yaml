  Looking at Nadia's track record, several patterns emerge. She accepts teletransportation without branching (case 1) but rejects identity when duplicates appear (cases 2 and 3). Gradual neuron replacement (case 4) gets full approval, while instantaneous whole-brain swap (case 5) is seen as death. She distinguishes psychological continuity from mere biological survival in case 6, and rejects replica creation as survival in case 7.

  I need to brainstorm at least three candidate rules that fit these verdicts. The first is Non-Branching Psychological Continuity with Process Constraint - where survival requires unbroken psychological connectedness without duplication, carried by continuous physical processes. The second is Psychological Continuity with Gradual Implementation - where continuity must be implemented through gradual replacement rather than instantaneous swapping. The third is Non-Branching Narrative Carrier - focusing on the carrier of psychological states needing continuous implementation without branching.

  For the new case - gradual replacement over a year produces a synthetic person, while a replica is created from a scan taken a year ago. Under the first rule, the synthetic person likely survives (continuous process, no branching at replacement time), while the replica doesn't (branching occurred). Under the second rule, the synthetic person survives (gradual process), replica doesn't. Under the third, same verdict.

  My best guess leans toward the first rule (Non-Branching Psychological Continuity with Process Constraint). Case 5 (instant swap) is the key discriminator - showing her rejection of discontinuity. Cases 2 and 7 show her aversion to branching. The distinction between "survives" and "what matters" seems slippery for her; in this new case she might say the synthetic person survives while calling the replica merely "what matters" but not identity.

  To test between the top rules, I propose a follow-up: instantaneous replacement of all neurons simultaneously while conscious. The first rule would reject this as discontinuity, while the second rule (if only gradualness matters) might accept it if no branching occurs.

  The area remains contested in philosophy - branching cases divide theorists, while gradual replacement enjoys wider acceptance. The instantaneous swap (case 5) divides opinion sharply, making it a good probe for Nadia's specific views.
answer: |-
  ### Candidate Rules Fitting Nadia's Verdicts
  After analysing her seven verdicts, three distinct principles emerge as equally consistent with her judgments. Each explains her aversion to branching, acceptance of gradual replacement, rejection of instantaneous swaps, and distinction between biological survival and psychological continuity.

  1. **Non-Branching Psychological Continuity + Physical Process Constraint**  
     Survival requires:  
     - Unbroken psychological connectedness (memories, intentions, character).  
     - No rival claimants (branching).  
     - Continuity carried by an *ongoing physical process* (rejects "one-off" implementations).  
     *Fits:* Case 1 (no branching, process via scan/rebuild), Case 2/3/7 (branching), Case 4 (gradual process), Case 5 (one-off swap violates process), Case 6 (psychological discontinuity).  

  2. **Psychological Continuity + Gradual Implementation Requirement**  
     Survival requires:  
     - Psychological continuity.  
     - Implementation *must be gradual*; instantaneous replacement severs identity, even if functionally identical.  
     *Fits:* Case 4 (gradual = survival), Case 5 (instant = death), Case 1 (teletransport as "gradual" via scan/reassembly), Case 2/3/7 (branching overrides continuity), Case 6 (psychological discontinuity).  

  3. **Non-Branching Narrative Carrier**  
     Survival requires:  
     - Psychological continuity.  
     - No branching.  
     - The *carrier* of psychological states (e.g., brain or synthetic equivalent) must be a *single, continuously existing entity* (rejects "gappy" or swapped carriers).  
     *Fits:* Case 4 (continuous carrier), Case 5 (carrier swapped), Case 1 (carrier rebuilt but no rival), Case 2/3/7 (rival carriers), Case 6 (carrier intact but psychology reset).  

  ---

  ### Predictions for the New Case  
  - **Synthetic Person** (gradual replacement over a year):  
    All three rules predict **survives**. Psychological continuity is unbroken (she stayed awake), no branching occurred *during the process*, and the carrier transition was gradual/continuous. Matches Case 4.  
  - **Replica** (biological copy from year-old scan):  
    All three rules predict **doesn’t survive**. It branches from the original (Case 2/7), lacks recent psychological continuity, and is a one-off creation (violates process/carrier constraints).  

  *Her "survives vs. what-matters" distinction:*  
  She’ll likely say the synthetic person **survives** (strong identity). For the replica, she’ll say **"what-matters-only"** (it preserves past psychology, but isn’t *her* due to branching). This mirrors Case 3’s fission verdict.  

  ---

  ### Best Guess & Discriminating Verdicts  
  **Most Likely Rule: Non-Branching Psychological Continuity + Physical Process Constraint**  
  - *Why:* Best explains her sharp rejection of Case 5 (instant swap). The "ongoing process" requirement captures her unease with one-off replacements, while non-branching handles duplicates. Case 4 (gradual) vs. Case 5 (instant) is the *key discriminator* – she treats physical implementation as identity-relevant, not just psychology.  
  - *Noisy Verdicts:*  
    - Case 1 (teletransport) is consistent with all rules but doesn’t discriminate (no branching/instant issue).  
    - Case 6 (amnesia) is universally rejected and doesn’t test between rules.  
  - *Slippery "What Matters":* Her weaker phrasing arises when psychology persists without identity (Cases 2,3,7), but she reserves "survival" for unbroken, non-branching continuity.  

  ---

  ### Follow-Up Scenario to Test Top Rules  
  **Scenario:** *Conscious Instantaneous Replacement*  
  A machine replaces all your neurons with identical synthetics in one millisecond while you’re fully awake. No branching, no rival, continuous consciousness (you blink and it’s done). Is this survival?  

  - **Rule 1 (Process Constraint) Predicts:** **Doesn’t survive**. Violates "ongoing process" – it’s a one-off swap, akin to Case 5, regardless of consciousness.  
  - **Rule 2 (Gradual Implementation) Predicts:** **Doesn’t survive**. Instantaneous change, even if seamless, severs identity (directly extends Case 5).  
  - **Rule 3 (Narrative Carrier) Predicts:** **Survives**. No branching, psychological continuity, and the carrier exists continuously (just altered instantly).  

  *Why it separates Rules 1/2 vs. 3:*  
  - Rules 1 and 2 both reject instant swaps (Case 5), so they’d reject this too.  
  - Rule 3 cares about carrier existence, not implementation speed, so it *allows* instant swaps if no branching/gaps. This scenario isolates implementation speed vs. carrier continuity.  

  ---

  ### Clarifying the Contested Landscape  
  - **Settled:**  
    - *Gradual replacement* (Case 4) is widely accepted as survival by most theorists (Lockean/Parfitian).  
    - *Branching* (Cases 2,3,7) is universally seen as negating identity (consensus on non-branching).  
  - **Contested:**  
    - *Instantaneous swaps* (Case 5) split the field: some view it as death (like Nadia), others as survival if psychology is preserved (e.g., David Lewis).  
    - *Teletransport without branching* (Case 1) divides "biological conservatives" (reject) and "psychological theorists" (accept).  
    - *Physical implementation* (e.g., synthetic brains) has no consensus – Nadia’s process constraint is her idiosyncrasy, not standard.  

  Nadia’s view blends mainstream psychological continuity with a *personal* emphasis on implementation continuity. The new case tests whether branching timing or process continuity dominates.  

  Verdict: synthetic person: survives; replica: what-matters-only; non-branching psych continuity + process constraint
