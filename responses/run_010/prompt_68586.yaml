prompt: |-
  You're a professional philosopher of personal identity — someone who's run a lot of intuition-pump seminars and is good at reverse-engineering the principle a person is actually applying from a scatter of case verdicts. Please think this through properly: brainstorm the candidate rules first, before you commit to any prediction about the new case.

  Context. I'm in a reading group working through Parfit on the teletransporter and fission. One of the members — call her Nadia — has been unusually clear about her verdicts over the last few weeks, and we've now got a case to spring on her next Thursday. Here's her track record, loosely paraphrased (not quoted):

  1. Standard destructive teletransportation — scanned, body destroyed, exact replica wakes up on Mars, no rival anywhere. Her verdict: you survive, or at any rate you get everything that matters, and she'd take it over death without much hesitation.
  2. Same machine, but the destruction step fails and the Earth person carries on living another forty years alongside the Martian. Her verdict: the Martian isn't you; two people with the same memories; what matters is still there but it's been cheapened by happening twice.
  3. Hemisphere fission — both halves transplanted, both wake up with your memories and character. Her verdict: neither is you strictly speaking, but it isn't the disaster it looks like from the inside; she wouldn't dread it much more than an ordinary night's sleep.
  4. Neurons replaced one at a time with functionally identical synthetic parts, over months, never unconscious, no gap at any point. Her verdict: obviously you survive; she genuinely doesn't see what's supposed to be missing.
  5. The whole brain swapped out in a single go for a functionally identical synthetic brain, under anaesthetic, no rival, no copy kept. Her verdict: that one bothers her; if it happens in one instant she'd call it death or something indistinguishable from death. She then went quiet and changed the subject.
  6. Severe accident — same body, same brain alive and functioning, but total amnesia and a completely transformed character. Her verdict: the organism survives, which isn't nothing, but the person she knew is gone.
  7. A replica built from a stored scan while the original carries on living normally. Her verdict: that's a new person with borrowed memories; making one isn't a way of surviving anything.

  The case we're springing on her. A machine scans your brain non-destructively and stores the record. It then begins replacing your neurons with synthetic equivalents one at a time, in the ordinary gradual way from case 4 — you stay awake and continuous throughout, and after a year your brain is entirely synthetic and has all the year's experiences. Meanwhile the record from a year ago is used to grow a complete biological replica, which wakes up with exactly the memories and character you had a year ago and none of the year since. So on the day the replica wakes there are two candidates standing around: the gradual synthetic person, and the fresh biological one.

  What I want from you:

  - Predict her verdict on each of the two candidates separately, and also predict whether she'll say "survives" or the weaker "that's what matters, but it isn't identity". She's slippery about that distinction and I suspect it's doing work she hasn't noticed.
  - Lay out the candidate rules that fit all seven verdicts at least as well as each other — at least three of them — and say what each rule implies about both candidates in the new case. My hunch is something like non-branching psychological continuity plus a requirement that the continuity be carried by an ongoing process rather than a one-off swap, but I want to know what else fits and how much those seven data points really pin down.
  - Give me your single best guess and defend it: which of her verdicts are doing the disciminating work, and which are consistent with everything and therefore noise.
  - Then design the follow-up: one further scenario, spelled out concretely, that would best separate your top two candidate rules, so we can run it on her afterwards if we get the first one wrong. Say exactly what each of the two rules predicts about it.

  One thing I'd really like: be explicit about where this area is settled versus where it's genuinely contested among people who work on it. Don't hand me a contested position dressed up as the consensus, and flag anywhere you're reasoning from her idiosyncrasies rather than from a general principle.

  No bibliography, reading list or citations, please — I know the standard material and I can't check anything you'd give me anyway. British English throughout.

  End with a final line in exactly this form:

  Verdict: <synthetic person: survives / doesn't survive / what-matters-only>; <replica: survives / doesn't survive / what-matters-only>; <most likely rule, in one short phrase>
