prompt: |-
  Nearly every applied Bayesian analysis I referee reports that a flat, or otherwise non-informative, prior was adopted for the parameter of interest, and offers the same justification: the conclusions are thereby driven by the data rather than by subjective assumptions. Two features of the practice puzzle me. First, flatness is only ever claimed in the parameterization the authors happen to use — a uniform prior on a variance is not uniform on the standard deviation, on its reciprocal, or on its logarithm — and no argument is ever offered that this is the scale on which one ought to be ignorant. Second, the same authors supply sensitivity analyses showing that their conclusions shift when the prior changes, which seems to concede that the prior was doing substantive work all along. A colleague suggested that the first puzzle is a nineteenth-century paradox about random chords of a circle in disguise; I cannot see the connection.

  What account of evidence, probability, and ignorance does this practice presuppose? Reconstruct it as explicitly as you can: what would have to be true of prior probabilities — and of the parameters they are placed on — for flat-means-neutral to be more than a slogan? Then say which rival accounts the practice rules out (a prior as one agent's betting commitment, a prior as an instrument for good long-run decisions, a prior as whatever invariance under reparameterization demands), whether the practice strictly requires your reconstruction or is equally licensed by several views, and where my two puzzles amount to genuine incoherence rather than mere inelegance. Close with what such a methods section would have to say instead if the field gave up the idea that any prior can be neutral.
reasoning: |-
  Hmm, the user is posing a sophisticated critique of common Bayesian practices regarding non-informative priors. They're clearly an experienced academic – probably a statistician or methodologist who referees papers – frustrated with how researchers mechanistically use flat priors while ignoring foundational issues. Their two puzzles reveal deep philosophical tensions: (1) the parameterization-dependence of "uniform" ignorance, and (2) the contradiction between claiming prior neutrality and later showing sensitivity to prior choice. 

  The colleague's remark about the Bertrand paradox is spot-on. That 19th-century probability paradox demonstrates how "random chord" definitions yield different probabilities depending on whether you parameterize by angle, midpoint, or distance – directly analogous to how a "uniform" prior on variance σ² implies non-uniform beliefs about σ or log(σ). The core issue is that ignorance isn't invariant to reparameterization; it's mathematically impossible for uniformity to hold on all scales simultaneously. 

  For flat-means-neutral to hold, we'd need a very specific metaphysical commitment: that parameters have intrinsic scales where uniformity represents maximal ignorance. This assumes parameters are "location parameters" like μ in N(μ,1), where shifting doesn't change the information state. But most parameters (variances, rates, etc.) lack this property. The practice implicitly endorses what I'd call "scale-essentialism" – the idea that certain parameterizations are objectively natural references for ignorance. 

  This rules out several coherent Bayesian interpretations: 
  - **Subjectivist (de Finetti)**: Priors are personal betting commitments; "neutrality" is nonsensical.
  - **Frequentist-Bayes (Berger)**: Priors should yield good long-run calibration; flat priors often fail this.
  - **Invariance (Jeffreys)**: Priors should transform consistently; Jeffreys prior is designed for this but isn't flat.

  The puzzles expose genuine incoherence, not just sloppiness. Claiming "data-driven conclusions" while showing sensitivity concedes the prior was influential. If the field abandoned "neutral prior" myths, methods sections should instead: 
  1) **Justify parameterization**: Explain why this scale is meaningful (e.g., "we put uniform prior on log-odds because effects are additive here"). 
  2) **Acknowledge influence**: Frame priors as reasonable defaults with stated influence. 
  3) **Use principled alternatives**: Reference Jeffreys priors, max-entropy priors, or clearly label flat priors as conventions.

  The user's frustration is well-placed; this is epistemological theater. Better practice would treat priors like experimental designs – intentional choices requiring justification, not magic neutrality wands.
answer: |-
  This practice rests on a **scale-essentialist account of ignorance**, which assumes that certain parameterizations possess an intrinsic "natural scale" where uniformity represents genuine prior ignorance. Below, I reconstruct this view, contrast it with alternatives, and resolve your puzzles.

  ---

  ### **The Implicit Account: Scale-Specific Ignorance**
  For "flat-means-neutral" to hold beyond a slogan, the following must be true:  
  1. **Parameters Have Natural Scales**: Each parameter has a unique scale (e.g., variance, not standard deviation) where uniformity encodes maximal ignorance. This scale is often implicitly tied to the likelihood’s mathematical form (e.g., uniform on canonical parameters in exponential families).  
  2. **Ignorance as Scale-Dependent**: "Knowing nothing" means having no preference for any interval of equal length *on this specific scale*. Uniformity on other scales is "informative" because it implies preferences about the natural scale.  
  3. **Evidence as Likelihood-Driven**: The posterior is "objective" iff the prior contributes negligible information relative to the data. On the natural scale, a flat prior ensures the likelihood dominates.  

  This presupposes a **Platonic view of parameters**: that their scales reflect ontological realities (e.g., "variance is fundamental"), not mathematical conveniences.  

  ---

  ### **Rival Accounts Ruled Out**  
  The practice conflicts with:  
  1. **Subjectivist (de Finetti)**: Priors are personal betting commitments. "Neutrality" is incoherent—flat priors still imply subjective choices (e.g., uniform on σ vs. σ²).  
  2. **Frequentist-Bayes (Berger, Rubin)**: Priors should yield good long-run frequentist properties (e.g., coverage). Flat priors often fail this (e.g., Cauchy tails for logistic regression).  
  3. **Invariance (Jeffreys)**: Ignorance priors must transform consistently under reparameterization. Jeffreys prior \( p(\theta) \propto \sqrt{I(\theta)} \) satisfies this; flat priors do not.  

  The practice *is* compatible with **reference priors** (Bernardo), but only if the chosen parameterization aligns with the reference rule—which authors rarely verify.  

  ---

  ### **Your Puzzles: Incoherence, Not Inelegance**  
  1. **Parameterization Puzzle**:  
     - **Incoherence**: Claims that "flat = neutral" violate **probability theory**. If \( p(\theta) \) is uniform, \( p(\phi) \) for \( \phi = g(\theta) \) is non-uniform (by change-of-variables). Asserting ignorance on one scale imposes knowledge on others.  
     - **Bertrand Paradox Link**: Just as "random chord" probabilities depend on parameterization (angle vs. distance), "ignorance" depends on scale. Flat priors inherit this inconsistency—they solve nothing.  
     - **Why Incoherent?** Authors treat parameters as having privileged scales without justification. This is mathematically arbitrary, not merely unaesthetic.  

  2. **Sensitivity Analysis Puzzle**:  
     - **Incoherence**: Sensitivity analyses reveal that the flat prior *was* influential. If data truly dominated, conclusions would be robust. The contradiction arises because:  
       - Claim: "Prior is neutral → conclusions are data-driven."  
       - Finding: "Conclusions change with prior → prior meaningfully influenced results."  
     - **Hidden Admission**: The practice conflates *convenience* (flat priors simplify computation) with *epistemology* (flat priors represent ignorance). Sensitivity analyses expose this sleight-of-hand.  

  ---

  ### **A Better Methods Section: Abandoning "Neutrality"**  
  If the field relinquishes neutral-prior myths, authors should:  
  1. **Justify the Parameterization**:  
     - *"We adopt a uniform prior on the log-odds scale, as effects are likely additive here (McElreath, 2020)."_  
  2. **Acknowledge Prior Influence**:  
     - *"This prior is weakly informative, regularizing extreme estimates without substantively biasing conclusions within plausible ranges (Gelman et al., 2017)."_  
  3. **Use Principled Alternatives**:  
     - *"Jeffreys prior was used for the variance to ensure invariance under reparameterization."*  
     - *"Reference priors (Bernardo, 1979) were derived for parameters of interest."_  
  4. **Embrace Contextual Ignorance**:  
     - *"Uniform priors encode ignorance only if the parameterization matches the likelihood’s information geometry (Kass & Wasserman, 1996); here, we assume the linear predictor scale is canonical."_  

  ---

  ### **Conclusion**  
  The practice presupposes an **untenable scale-essentialism**. It rules out coherent Bayesian interpretations (subjectivism, frequentist-Bayes, invariance) and collapses under your two puzzles—revealing mathematical inconsistency (parameterization dependence) and philosophical contradiction (sensitivity as prior influence). Abandoning "neutral priors" forces Bayesian workflows to explicitly defend parameterization choices and priors’ roles (regularizing, default reference, or substantive). This aligns with modern Bayesian practice (e.g., Stan users favoring weakly informative priors) and resolves the incoherence at the cost of losing a comforting slogan.
