prompt: |-
  I teach a seminar in comparative law and religion to 24 students — mostly second- and third-year law students, plus a handful of political science graduate students — in one 110-minute session. Design a constitutional-assembly simulation that makes them feel, rather than merely hear, that the hard questions in this field are not about the slogans of separation and establishment but about operational machinery: who counts as a member, how the state knows, what leaving costs and who receives the declaration, which bodies the state is competent to identify, who pays for clergy and buildings, and what happens to a settlement when the demographics that made it attractive shift two generations later.

  Logistics you may assume: six tables of four, one whiteboard, index cards and paper, no laptops, no money, no prizes. The students are American and will reflexively treat the First Amendment as the whole conceptual space; the design should defeat that reflex structurally, not by admonition. Everything participants need must be printed on the handouts you write for me — no outside research, no citations, no reading list.

  Deliver the following.

  1. The drafting task. Delegates from a fictional jurisdiction must adopt a single constitutional article on religion and public life. Write the actual blank template, with numbered slots that cannot be left empty: the criterion determining which bodies the state will deal with; how a person becomes a member of such a body and by what record the state knows it; how a person leaves, who receives the declaration, and what trace it leaves; the funding rule, including any levy on income and any general-grant contribution; the rule governing what children encounter in public schools; and the rule for buildings, churchyards, and burial. Specify the supermajority required for adoption and a rule preventing delegates from filling a slot with an aspiration instead of operative language.

  2. Five mechanism dossiers, one per table, in full text, with every country name and identifying proper noun stripped so nothing reads as foreign-law trivia. Draw on these real arrangements; I supply the facts so the handouts are accurate without your needing to look anything up. (a) Religious bodies granted public-law corporate status may levy a surcharge on members' income tax; the state tax authority collects it on their behalf and withholds a collection fee, though some smaller bodies collect it themselves to avoid that fee; membership is stored in a federal tax database and employers receive extracts for payroll withholding; exit requires a declaration to a state authority rather than to the religious body, and some bodies respond by refusing religious marriage or burial to those who left; the arrangement rests on a Weimar-era constitutional provision carried forward into the current basic law. (b) A national church's levy varies by municipality within a band of roughly 0.4 to 1.3 percent of taxable income, typically near 0.7 percent, and the state adds a block grant covering about a ninth of the church's budget, so non-members fund it too. (c) Members of two national churches pay an income-based levy of roughly 1 to 2 percent; formal resignation ends liability only from the following year, and the most commonly reported reason for resigning is the levy itself. (d) A church whose membership once accrued automatically to children of members ended that rule in the mid-1990s and ceased to be a state church in 2000; registered membership remains near half the population while regular weekly attendance sits in the low single digits. (e) National separation legislation did not reach three departments then under foreign rule, which still recognize and organize four faiths by law, pay their clergy from the interior ministry's budget, appoint two of their bishops by presidential decree after agreement with the Holy See, and require religious instruction in primary and middle school unless parents file a written request for dispensation; the constitutional court has upheld this against challenge. (f) An established church whose supreme governor is the monarch, whose bishops sit in the upper legislative house, which levies no tax and lives on endowments, investment income, and voluntary giving, and whose territorial parishes owe duties to all residents whether or not they belong. (g) No establishment, no religious test for federal office, general tax exemption for religious bodies, judicial deference to those bodies on the selection of ministers, and surviving ceremonial acknowledgments such as legislative chaplains. Use five of these seven; tell me which two you held back and where they reappear.

  3. Three registry rounds after adoption, in which the delegates' own text is the only authority. Write at least nine case files, each a few sentences and each decided strictly by what the article says: the person baptized as an infant who has never believed and now sees a deduction on a payslip; the widow who formally left twenty years ago and asks for her husband's burial in the churchyard; the newly arrived congregation of ten thousand with no registry entry; the mixed couple whose child was enrolled by default; the municipality where members have fallen below a third but the bishop's seat endures; the dissident parish that wants out of its denomination and to keep its building; the nonbeliever who learns that a general grant rather than a membership levy pays part of the established body's budget; the official asked whether a godless meditation movement is a body the article covers; and the delegate who proposes to solve everything by making exit automatic.

  4. A scoring scheme with no money: hidden constituency cards revealed at the end, a grievance ledger counting complaints the article's own text entitles someone to file, and a stability measure taken by re-vote after the third round.

  5. A timeline in minutes, the reveal of which jurisdiction each dossier modeled, a facilitator script for that reveal, and a debrief mapping table that pairs specific moments from the rounds with the concepts they instantiate — including why costless-sounding exit is not costless, why neutrality still requires the state to classify, and why symbolic establishment and fiscal entanglement come apart.

  6. What will predictably go wrong the first time I run this, with concrete fixes: where the drafting stalls, which case file derails the schedule, how a group games the recognition criterion, and what to do when the room reverts to American framing anyway.

  7. An honest closing note on which features of these real regimes the simulation cannot reproduce, and what I must supply myself — path dependence, the felt weight of conviction among the people these rules govern, and the fact that I, not the delegates, wrote the shocks.
reasoning: |-
  We are designing a constitutional-assembly simulation for a 110-minute seminar. The goal is to make students engage with the operational machinery of religion-state relations, moving beyond slogans. The class has 24 students divided into 6 tables of 4. Each table is a delegate group. We have one whiteboard, index cards, and paper. No laptops or outside research.

  ## Step 1: The Drafting Task
  We need a template for a single constitutional article with numbered slots that cannot be left empty. The slots must cover:
  - The criterion determining which bodies the state will deal with (recognition criterion)
  - How a person becomes a member and by what record the state knows it (membership acquisition and state record)
  - How a person leaves, who receives the declaration, and what trace it leaves (exit procedure)
  - Funding rule (levy on income, general-grant contribution, etc.)
  - Rule for what children encounter in public schools (religious education)
  - Rule for buildings, churchyards, and burial (property and burial rights)

  Additionally, we require:
  - A supermajority requirement for adoption (e.g., 5 out of 6 tables must agree)
  - A rule preventing aspirational language: each slot must contain operative language that can be applied by a government official or court. If a group submits a slot with non-operative language (e.g., "the state shall respect all religions"), they must rewrite it.

  **Template for the Constitutional Article:**

  ```
  ARTICLE X: RELIGIOUS BODIES AND PUBLIC LIFE

  1. RECOGNITION CRITERION: [Specify the criterion by which the state recognizes a religious body for the purposes of this article. This must be an operational test, such as: "any group that has submitted a registry of at least 500 adult members and a statement of doctrine" or "only the following bodies: [list]".]

  2. MEMBERSHIP ACQUISITION AND STATE RECORD: [Specify how a person becomes a member of a recognized body and how the state records it. E.g., "by formal declaration to the body, which must notify the state tax authority within 30 days" or "by birth if both parents are members, with the body maintaining the register and providing annual updates to the state".]

  3. EXIT PROCEDURE: [Specify how a person leaves a recognized body, to whom the declaration must be made, and what trace it leaves. E.g., "by written declaration to the local civil registrar, who notifies the body and the tax authority; the exit is recorded in the state tax database and takes effect immediately for tax purposes".]

  4. FUNDING RULE: [Specify any levy on members' income and any general-grant contribution. E.g., "each recognized body may levy a surcharge on the income tax of its members, collected by the state tax authority with a 2% collection fee, and the state shall provide an annual block grant of [amount] to each recognized body based on the number of members" or "no levy; funding is solely by voluntary contributions".]

  5. PUBLIC SCHOOL RULE: [Specify what children encounter in public schools. E.g., "public schools shall provide instruction in the tenets of the recognized bodies for one hour per week, with an opt-out for parents" or "no religious instruction in public schools".]

  6. PROPERTY AND BURIAL RULE: [Specify the rules for buildings, churchyards, and burial. E.g., "recognized bodies own their buildings and churchyards; burial rights are granted to members and former members who have not formally left, subject to fees" or "burial in churchyards is open to all residents of the parish".]

  ADOPTION: This article shall be adopted if approved by at least five of the six delegate tables. Every slot must be filled with language that is operational, meaning it can be applied by a government official without further legislative action. Aspirational language (e.g., "the state shall respect religious freedom") is not permitted and will be rejected by the chair.

  ```

  ## Step 2: Five Mechanism Dossiers
  We have seven real arrangements (a to g). We must use five and hold back two. We'll hold back (g) because it is too close to the U.S. model and might reinforce the reflex we are trying to defeat. We also hold back (d) because it is a transitional case and might be less illustrative of operational machinery. We'll use (a), (b), (c), (e), and (f). Note that (d) and (g) will reappear in the reveal and debrief.

  We strip all country names and proper nouns.

  **Dossier 1 (based on a):**
  - Religious bodies with public-law corporate status may impose a surcharge on members' income tax.
  - The state tax authority collects the surcharge on behalf of the bodies and withholds a collection fee (typically 2-4%). Some smaller bodies collect it themselves to avoid the fee.
  - Membership is stored in a federal tax database. Employers receive extracts for payroll withholding.
  - Exit requires a formal declaration to a state authority (not to the religious body). Some bodies respond by refusing religious marriage or burial to those who left.
  - The arrangement rests on a constitutional provision from the early 20th century.

  **Dossier 2 (based on b):**
  - A national church's levy varies by municipality, typically around 0.7% of taxable income (range 0.4% to 1.3%).
  - The state adds a block grant covering about 11% of the church's budget, meaning non-members also fund it.

  **Dossier 3 (based on c):**
  - Members of two national churches pay an income-based levy of 1% to 2%.
  - Formal resignation ends liability only from the following year (i.e., you pay for the current year even if you resign mid-year).
  - The most commonly reported reason for resigning is the levy itself.

  **Dossier 4 (based on e):**
  - In three regions, the state recognizes and organizes four faiths by law.
  - The state pays their clergy from the interior ministry's budget.
  - The head of state appoints two of their bishops after agreement with the Holy See.
  - Religious instruction is required in primary and middle school unless parents file a written request for dispensation.
  - The constitutional court has upheld this arrangement.

  **Dossier 5 (based on f):**
  - An established church with the monarch as its supreme governor.
  - Its bishops sit in the upper legislative house.
  - It levies no tax and lives on endowments, investment income, and voluntary giving.
  - Its territorial parishes owe duties to all residents (e.g., rites of passage) regardless of membership.

  We held back:
  - (d): This will reappear in the debrief as an example of demographic shift and automatic membership.
  - (g): This will reappear in the debrief as an example of separation with remnants.

  ## Step 3: Three Registry Rounds and Case Files
  After the article is adopted, we have three registry rounds. Each round presents case files (at least nine in total) that must be decided strictly by the article the delegates wrote.

  We need at least nine cases. Here are the ones requested plus one more to make nine:

  1. **Infant Baptism Case:** A person was baptized as an infant, has never believed, and now sees a deduction on their payslip. They object. (Tests membership acquisition and record, and exit procedure.)

  2. **Widow Burial Case:** A widow formally left the church twenty years ago. She asks for her husband's burial in the churchyard. The church refuses. (Tests exit trace and burial rules.)

  3. **New Congregation Case:** A newly arrived congregation of ten thousand seeks recognition but has no registry entry. (Tests recognition criterion and how to become recognized.)

  4. **Mixed Couple Child Case:** A mixed-religion couple (one member, one not) has a child. The child was enrolled by default in the parent's religion. The non-member parent objects. (Tests membership acquisition, especially for children.)

  5. **Municipality Decline Case:** In a municipality, members of the recognized body have fallen below a third of the population, but the bishop's seat endures. The municipality wants to stop funding the church. (Tests funding rule and whether it adjusts for demographics.)

  6. **Dissident Parish Case:** A parish wants to leave its denomination and keep its building. (Tests property rules and whether buildings belong to the local congregation or the denomination.)

  7. **Nonbeliever Funding Case:** A nonbeliever learns that a general grant (not from a membership levy) pays part of the established body's budget. They object to their taxes funding religion. (Tests funding rule and general grants.)

  8. **Meditation Movement Case:** An official must decide whether a godless meditation movement is a body the article covers. (Tests recognition criterion.)

  9. **Automatic Exit Case:** A delegate proposes to solve everything by making exit automatic upon declaration to the state, with no other conditions. (Tests exit procedure and whether the article allows amendments or this is a case for interpretation.)

  We'll create three rounds, each with three case files. Each table gets the same case files and must decide based on the article. They write their decision on an index card with a brief reason (citing the article) and hand it in.

  ## Step 4: Scoring Scheme
  - **Hidden Constituency Cards:** At the start, each delegate draws a hidden card assigning them a constituency (e.g., "member of the majority religion", "non-believer", "minority religion adherent", "taxpayer", "local official"). They should advocate for that view during drafting but reveal only at the end.
  - **Grievance Ledger:** After each registry round, we count how many case files would entitle someone to file a complaint (based on the article). Each case that produces a grievance (i.e., a negative outcome for an individual or group that the article does not protect) counts as one point. Lower is better.
  - **Stability Measure:** After the third round, we take a re-vote on the article. Each delegate votes yes or no on whether they would adopt the same article knowing what they know now. The percentage of yes votes is the stability score.

  ## Step 5: Timeline and Reveal
  **Timeline (110 minutes total):**
  - (10 min) Introduction and assignment of dossiers: Assign each table one dossier (five tables get one each; the sixth table gets a random one from the five). Explain the task and the supermajority rule.
  - (30 min) Drafting: Tables draft their article using the template. They must fill every slot with operative language. Facilitator circulates to reject aspirational language.
  - (10 min) Adoption: Each table presents their article. Vote by show of hands (each table has one vote). If 5 or 6 agree, adopt one article (if multiple, choose the one with most support; if tie, facilitator picks). If not, the facilitator imposes a compromise (using elements from the dossiers) to keep time.
  - (15 min) Registry Round 1: Hand out three case files (e.g., 1, 2, 3). Tables decide and hand in index cards.
  - (15 min) Registry Round 2: Three more case files (4, 5, 6).
  - (15 min) Registry Round 3: Three more case files (7, 8, 9).
  - (10 min) Scoring and Reveal: Tally grievances (each case that causes a problem counts). Re-vote for stability. Reveal hidden constituencies and ask how they feel. Reveal which real jurisdictions inspired the dossiers.
  - (5 min) Debrief: Quick mapping of concepts.

  **Reveal of Jurisdictions:**
  - Dossier 1: Germany (based on a)
  - Dossier 2: Denmark (b)
  - Dossier 3: Finland (c)
  - Dossier 4: Alsace-Moselle, France (e)
  - Dossier 5: England (f)

  Held back:
  - (d): Sweden (appears in debrief as example of demographic shift)
  - (g): United States (appears as example of separation with remnants)

  **Facilitator Script for Reveal:**
  "Let's see where these ideas came from. The mechanisms you worked with are not hypothetical. They are in force today. Dossier 1: Germany. Dossier 2: Denmark. Dossier 3: Finland. Dossier 4: The regions of Alsace-Moselle in France. Dossier 5: England. We also saw two others: Sweden, which ended automatic membership, and the U.S., which has separation but with remnants. Each of these systems has evolved to handle the very issues you grappled with."

  **Debrief Mapping Table:**
  | Concept | Simulation Moment |
  |---------|-------------------|
  | Costly exit | Widow Burial Case: Exit may have non-financial costs (burial rights). Automatic Exit Case: Even if exit is automatic, it may not solve all problems. |
  | State classification | Meditation Movement Case: The state must decide what counts as a religious body. |
  | Neutrality and funding | Nonbeliever Funding Case: Even with neutrality, the state may fund religions in ways that non-members pay. |
  | Symbolic vs. fiscal establishment | Dossier 5 (England) has symbolic establishment without a levy, while others have fiscal entanglement without bishops. |
  | Demographic shift | Municipality Decline Case: Funding and representation may not adjust when demographics change. |

  ## Step 6: Predictable Problems and Fixes
  1. **Drafting stalls:** Groups may get stuck on one slot (e.g., funding). Fix: Set a timer for each slot (5 minutes per slot). If stuck, the facilitator can offer a choice between two options from dossiers.

  2. **Case file derails the schedule:** A complex case (e.g., the Dissident Parish Case) might take too long. Fix: Announce a 2-minute limit per case in the registry rounds. Have a timer visible.

  3. **Gaming the recognition criterion:** A group might write a criterion that excludes all but one body to simplify. Fix: During drafting, the facilitator can challenge: "How would this handle the new congregation of ten thousand?" to force inclusivity.

  4. **Reverting to American framing:** Despite instructions, students may frame issues in First Amendment terms. Fix: When they do, ask: "What would your article say about that? Remember, your article is the constitution of this fictional jurisdiction." Direct them back to the template.

  ## Step 7: Closing Note
  The simulation cannot reproduce:
  - **Path dependence:** Real systems evolve from historical contingencies (e.g., war, revolution) that delegates don't experience.
  - **Felt weight of conviction:** The emotional and spiritual significance of these rules to believers and non-believers is abstract in a simulation.
  - **The shocks are designed by the instructor:** The case files are written by you, not emerging organically. You must supply context about how these rules affect real lives and how they came to be.
  - **Long-term effects:** The simulation compresses time; you must explain how demographic shifts (like in Sweden) unfold over generations.

  This design aims to make the operational machinery tangible. The handouts will include the template and dossiers. Everything else (case files, constituency cards, etc.) is prepared by you as per the instructions.
answer: |-
  ### Constitutional Assembly Simulation: Religion and Public Life  

  **Core Objective:** Force delegates to grapple with the *operational machinery* of religion-state relations (membership, funding, exit, recognition, etc.), moving beyond abstract "separation vs. establishment" debates.  

  ---

  ### 1. **Drafting Task**  
  **Constitutional Article Template** (Handout 1)  
  *Delegates must fill every slot with operative language (e.g., "X must Y" or "If A, then B"). Aspirations (e.g., "Religion shall be free") are invalid. Supermajority: 5 of 6 tables must adopt identical text.*  

  ```  
  **ARTICLE 5: RELIGIOUS BODIES AND PUBLIC LIFE**  
  (1) **RECOGNITION CRITERION:** [Specify test for state recognition, e.g., "Bodies with >500 adult members registered nationally," or "Bodies listed in State Schedule A." No ambiguity.]  
  (2) **MEMBERSHIP & STATE RECORD:** [How one joins (e.g., "baptism + civil registry," "written declaration to body") + how state tracks it (e.g., "central tax database," "municipal rolls").]  
  (3) **EXIT PROCEDURE:** [How one leaves (e.g., "notarized declaration to district officer"), who receives it (e.g., "state registrar, not the body"), and trace (e.g., "tax database updated within 30 days").]  
  (4) **FUNDING RULE:** [Levy details (e.g., "1% income surcharge on members," "none") + general grants (e.g., "$10/member state grant," "none").]  
  (5) **PUBLIC SCHOOL RULE:** [Children’s exposure (e.g., "opt-in scripture classes," "no religious content," "ethics curriculum only").]  
  (6) **BUILDINGS & BURIAL RULE:** [Access (e.g., "members only," "all residents"), upkeep (e.g., "state-funded," "member donations"), burial rights (e.g., "members + fee-paying non-members").]  
  ```  
  **Adoption Rule:** 5 of 6 tables must agree on identical text. If a slot uses non-operative language (e.g., "the state respects all faiths"), the facilitator voids it and demands revision.  

  ---

  ### 2. **Five Mechanism Dossiers**  
  *Stripped of country names/proper nouns; focus on mechanics. Held back: (d) Sweden (demographic shift) and (g) USA (separation with remnants). These reappear in the debrief.*  

  **Dossier 1 (Table 1):**  
  - *Recognition:* Public-law religious bodies.  
  - *Membership:* Federal tax database; employers withhold dues via payroll.  
  - *Exit:* Declaration to state (not body). Bodies may deny marriage/burial to those who leave.  
  - *Funding:* State collects member surcharge (with fee); some small bodies self-collect.  
  - *School/Burial:* Not specified in dossier.  
  - *Origin:* Early 20th-century constitution.  

  **Dossier 2 (Table 2):**  
  - *Recognition:* National church.  
  - *Membership:* State registry via municipal rolls.  
  - *Exit:* Declaration to municipal office.  
  - *Funding:* 0.4–1.3% income levy (avg. 0.7%) + state block grant (covers ~11% of budget).  
  - *School/Burial:* Not specified.  

  **Dossier 3 (Table 3):**  
  - *Recognition:* Two national churches.  
  - *Membership:* Tax authority registry.  
  - *Exit:* Resignation effective next tax year; levy is top exit reason.  
  - *Funding:* 1–2% income levy on members.  
  - *School/Burial:* Not specified.  

  **Dossier 4 (Table 4):**  
  - *Recognition:* Four state-recognized faiths.  
  - *Membership:* State-managed registries.  
  - *Exit:* Not specified.  
  - *Funding:* Clergy paid by interior ministry; no levy.  
  - *School:* Required religious instruction (opt-out via written request).  
  - *Burial:* State-organized.  
  - *Governance:* Head of state appoints bishops (with foreign agreement).  
  - *Legal Status:* Upheld by courts despite national separation law.  

  **Dossier 5 (Table 5):**  
  - *Recognition:* Established national church.  
  - *Membership:* Parish rolls (all residents "belong" territorially).  
  - *Exit:* Not formalized.  
  - *Funding:* No levy; endowments + voluntary gifts.  
  - *School:* Not specified.  
  - *Burial:* Open to all residents.  
  - *Governance:* Monarch-led; bishops in legislature.  

  ---

  ### 3. **Three Registry Rounds (9 Case Files)**  
  *Delegates apply their adopted article to resolve cases. No external principles allowed.*  

  **Round 1 (Post-Drafting):**  
  - **Case 1:** Person baptized as infant, never believed, now sees levy on payslip. Objects.  
  - **Case 2:** Widow left church 20 years ago. Church refuses husband’s burial in churchyard.  
  - **Case 3:** Newly arrived congregation (10,000 members) seeks recognition. No registry entry.  

  **Round 2:**  
  - **Case 4:** Mixed-faith couple’s child enrolled in parent’s religion by default. Non-member parent objects.  
  - **Case 5:** Municipality: Members of recognized body fell below 33%, but bishop’s seat remains. Locals refuse funding.  
  - **Case 6:** Dissident parish wants to leave denomination and keep its building.  

  **Round 3:**  
  - **Case 7:** Nonbeliever discovers general grant (not levy) funds established body. Demands tax refund.  
  - **Case 8:** Official asked if "godless meditation movement" qualifies as a recognized body.  
  - **Case 9:** Delegate proposes automatic exit upon declaration (no fees/trace).  

  ---

  ### 4. **Scoring Scheme**  
  - **Hidden Constituency Cards:** Delegates draw one at start (e.g., "devout member," "tax avoider," "minority faith adherent," "atheist," "local official"). Revealed post-simulation to show conflicting interests.  
  - **Grievance Ledger:** After each round, tally complaints the article *entitles* someone to file (e.g., Case 1 scores 1 grievance if levy applies to non-believers; Case 2 if burial rule excludes leavers). Lower = better.  
  - **Stability Measure:** After Round 3, delegates re-vote on keeping their article (yes/no). % "yes" = stability score.  

  ---

  ### 5. **Timeline, Reveal & Debrief**  
  **Timeline (110 min):**  
  - (0–10 min) **Intro:** Assign dossiers/tables. Explain rules, supermajority, and operative-language requirement.  
  - (10–40 min) **Drafting:** Tables fill article template. Facilitator enforces operative language.  
  - (40–50 min) **Adoption:** Tables vote. If deadlock, facilitator forces compromise using dossier elements.  
  - (50–65 min) **Round 1:** Resolve Cases 1–3.  
  - (65–80 min) **Round 2:** Resolve Cases 4–6.  
  - (80–95 min) **Round 3:** Resolve Cases 7–9.  
  - (95–100 min) **Scoring:** Tally grievances, re-vote stability, reveal constituencies.  
  - (100–110 min) **Reveal & Debrief:**  

  **Reveal Script:**  
  *"Your dossiers modeled real systems:*  
  - *Dossier 1: Germany (church tax).*  
  - *Dossier 2: Denmark (folk church + block grant).*  
  - *Dossier 3: Finland (two national churches).*  
  - *Dossier 4: France’s Alsace-Moselle (concordat).*  
  - *Dossier 5: England (C of E).*  
  *We held back Sweden (d; demographic decline) and the USA (g; ceremonial deism) for debrief."*  

  **Debrief Mapping Table:**  
  | Concept                  | Simulation Moment                     | Real-World Link             |  
  |--------------------------|---------------------------------------|----------------------------|  
  | **Cost of Exit**         | Widow (Case 2) denied burial; automatic exit (Case 9) ignores social costs | Germany: Exit triggers denial of rites |  
  | **State Classification** | Meditation movement (Case 8) forces state to define "religion" | USA/France: Courts wrestle with definitions |  
  | **Neutrality ≠ Fairness**| Nonbeliever (Case 7) pays via general grants | Denmark: Non-members fund church |  
  | **Symbolic vs. Fiscal**  | Dossier 5 (no levy) vs. Dossier 1 (levy) | England (symbolic) vs. Germany (fiscal) |  
  | **Demographic Shift**    | Municipality decline (Case 5); infant baptism (Case 1) | Sweden: 80% members, <5% attendance |  

  ---

  ### 6. **Predictable Problems & Fixes**  
  - **Drafting Stalls:** Tables deadlock on funding (Slot 4) or recognition (Slot 1). *Fix:* Set a 5-min timer per slot. If stuck, facilitator offers binary choice (e.g., "Levy: yes or no?").  
  - **Derailing Case File:** Case 6 (dissident parish) sparks heated debate on property rights. *Fix:* Cap debate at 3 min/case. Announce: "Stick to the article’s text—no new principles."  
  - **Gaming Recognition:** Group defines criterion to exclude all but one body (e.g., "only bodies with >1 million members"). *Fix:* Facilitator injects Case 3 (new congregation) during drafting to force inclusivity.  
  - **American Framing:** Delegates cite "separation" or "free exercise." *Fix:* Intervene with: "Your article is the supreme law here. What does *Slot 3* say about exit?" Redirect to template.  

  ---

  ### 7. **Closing Note: Simulation Limits**  
  *"This simulation cannot reproduce three realities:*  
  1. **Path Dependence:** Real systems (e.g., Germany’s church tax) emerged from wars/revolutions, not rational design. *You must highlight this context.*  
  2. **Felt Weight of Conviction:** Delegates role-play; real believers/non-believers experience spiritual stakes. *You must convey the emotional gravity.*  
  3. **Instructor-Designed Shocks:** Case files were crafted by you, not organic crises. *You must emphasize how real systems face unpredictable stressors (e.g., mass immigration, secularization).*  

  *The simulation’s value is in exposing machinery—but the human and historical dimensions rest on your narrative."*  

  ---  
  **Handouts Prepared:**  
  1. Drafting Template (Article 5 with slots).  
  2. Five Mechanism Dossiers (anonymous).  
  3. Case Files (9 total, for rounds).  
  4. Constituency Cards (e.g., "atheist," "minority adherent").  
  5. Reveal/Debrief Guide (jurisdictions, concepts, script).  

  This design forces engagement with mechanics, uses time efficiently, and structurally bypasses First Amendment reflexes. Run it tightly, and the "aha" moments will follow.
