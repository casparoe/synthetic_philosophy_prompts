answer: |-
  Below is a decision tree designed to clarify definitions of societal "collapse" for your AP World History project. It uses concrete scenarios to force users to commit to their criteria before applying the term. The tree has 8 questions, each with 2-3 options, and ends in labeled leaves representing academic positions (or "unnamed" if the combination is unclaimed). It addresses your specified splits: **what must survive** (state, population, elite culture, language, well-being), **baseline comparison** (peak, recent past, neighbors), **speed**, **reversibility**, and **evidence sources** (elite records vs. archaeology). 

  **Instructions:** Start at Question 1. Answer based on your *personal criteria* for collapse—not historical facts. Your final leaf is your position.

  ---

  ### Decision Tree: What Do You Mean by "Collapse"?

  **Question 1: The imperial palace stops keeping records, local temples are abandoned, and elites flee the cities. But farmers in the countryside keep working the same fields, village houses get bigger, and local dialects thrive. Is this a collapse?**  
  - **A:** *Yes, because the state and elite culture vanished.* → Go to Q2  
  - **B:** *No, because daily life and population continue.* → Go to Q3  
  - **C:** *Only if the farmers' health declined too.* → Go to Q4  

  **Question 2: A society’s grand monuments are buried by sand, its writing system is forgotten, and no new temples are built for 500 years. But commoners still live in the same towns, weave the same textiles, and eat as well as before. Is this a collapse?**  
  - **A:** *Yes, because elite culture defines civilization.* → Go to Q5  
  - **B:** *No, collapse requires suffering for ordinary people.* → Go to Q4  

  **Question 3: A plague kills 60% of the population in 20 years. Survivors rebuild, but with simpler tools and no central government. They speak the same language and farm as productively as their grandparents. Is this a collapse?**  
  - **A:** *Yes, because population and complexity fell.* → Go to Q6  
  - **B:** *No, because core traditions and well-being continue.* → Go to Q7  

  **Question 4: Skeletons show people grew shorter and worked harder after elites disappeared, but pottery styles and crop choices stayed the same for centuries. Meanwhile, elites left no records of this period. Is this a collapse?**  
  - **A:** *Yes, well-being matters most—elite records distract us.* → Go to Q8  
  - **B:** *No, if language and skills survive, it’s resilience.* → Go to Q7  

  **Question 5: A society’s monuments and writing vanish, but 300 years later, similar temples and scripts reappear. Outsiders at the time called it "barbarism," but locals never stopped telling old stories. Was the gap a collapse?**  
  - **A:** *Yes, collapse is measured by elites—and they fell.* → Leaf: **Elitist Collapsist**  
  - **B:** *No, if culture revived, it was a pause.* → Leaf: **Pause Advocate**  
  - **C:** *Only if they never regained their peak glory.* → Go to Q6  

  **Question 6: A society declines over 200 years to half its peak wealth, but still outshines its neighbors. Its people eat better than in the past but worse than at the height of empire. Is this a collapse?**  
  - **A:** *Yes, you must compare to their peak.* → Leaf: **Peak Referentialist**  
  - **B:** *No, you must compare to neighbors or recent times.* → Leaf: **Relativist**  
  - **C:** *Only if it happened suddenly.* → Go to Q8  

  **Question 7: A slow 500-year decline sees villages shrink, pottery get cruder, and forests regrow over fields—but no war, famine, or abrupt change. If people adapted peacefully, is it collapse?**  
  - **A:** *Yes, decline is collapse, even if gradual.* → Leaf: **Gradualist**  
  - **B:** *No, collapse must be fast and violent.* → Leaf: **Catastrophist**  

  **Question 8: Archaeologists find elite palaces were abandoned quickly, but commoners’ trash pits show steady food remains for 100 years after. Written records call it "doom," but bones show no malnutrition. Whose evidence wins?**  
  - **A:** *Elite records—they define the narrative.* → Leaf: **Traditional Narrativist**  
  - **B:** *Archaeology—daily life is the real story.* → Leaf: **Materialist Continuist**  
  - **C:** *Neither alone; collapse needs both gone.* → Leaf: **Total Collapsist**  

  ---

  ### Leaf Explanations
  - **Elitist Collapsist:** Collapse = fall of state/elite culture. Ignores commoners if elites vanish. (e.g., Tainter’s complexity theory).  
  - **Pause Advocate:** Reversible declines aren’t collapse; societies can reboot. (e.g., resilience theory).  
  - **Peak Referentialist:** Collapse = failure to match past heights. Ignores external contexts. (common in popular history).  
  - **Relativist:** Uses neighbors/recent past as baseline. Decline isn’t collapse if others are worse. (e.g., comparative historians).  
  - **Gradualist:** Slow slides count if outcomes are dire. Rejects "suddenness" as requirement. (e.g., environmental history).  
  - **Catastrophist:** Collapse must be rapid (≤1 gen). Slow change is adaptation, not failure. (e.g., some systems theorists).  
  - **Traditional Narrativist:** Privileges elite records. If writing stops, it’s collapse—even if archaeology shows continuity.  
  - **Materialist Continuist:** Uses archaeology of daily life. Collapse requires proven suffering, not just silent texts. (e.g., McAnany’s Maya work).  
  - **Total Collapsist:** Requires all pillars to fall (state, population, culture, well-being). Rare—most scholars prioritize 1-2 factors.  
  - **Unnamed Combinations:** Labeled "unnamed" if incoherent (e.g., valuing elite records but ignoring them in Q8) or unclaimed (e.g., "reversible collapse" is oxymoronic for most).  

  ### Tree Notes
  - **Can’t distinguish:** "Elitist Collapsist" and "Traditional Narrativist" overlap if elites define collapse *and* evidence. The tree prioritizes evidence in Q8 to split them.  
  - **Impossible Combinations:** Answering Q5C (peak-focused) + Q6B (neighbor-focused) is incoherent—baselines conflict. Tree avoids this by routing Q5C to Q6 for clarification.  
  - **Revised Archaeology Safe:** Questions avoid empirical dependencies (e.g., Q8 works whether palaces burned or trash pits show continuity).  

  ---

  ### Case Applications
  **Assumptions (yours to adjust):**  
  - **Classic Maya (c. 900 CE):** Elite states/script/monuments fell; 80% population decline over 150 yrs; rural survivors farmed with stable health initially.  
  - **Rapa Nui (Easter Island, c. 1600–1800 CE):** Monument building stopped pre-Europeans; population stable until European diseases/slave raids caused 90% crash.  
  - **Bronze Age Mediterranean (c. 1200 BCE):** Palatial states, writing, trade collapsed in <50 yrs; population dropped 50–90%; villages persisted with simpler tools.  

  **Verdict:**  
  - **Maya** = Peak Referentialist (slow decline from Classic peak, even with rural continuity).  
  - **Rapa Nui** = Materialist Continuist (monuments stopped ≠ collapse; population thrived until Europeans).  
  - **Bronze Age** = Catastrophist (rapid fall of multiple interlinked states).  

  Run your own answers through the tree if you disagree! Modify scenarios as needed for your project. No citations included—add your own from class debates.
