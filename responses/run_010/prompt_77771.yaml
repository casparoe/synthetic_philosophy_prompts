prompt: |-
  working on a paper about what would make a list of pramanas actually *good*, rather than about which list is right — so I want the spec before the candidates. What does an account of the knowledge-sources have to deliver to count as adequate? Give me the desiderata with the case or consideration behind each: the reductions it has to block (why upamana isn't just inference plus testimony, why postulation isn't just inference in disguise), the circularity/regress charge it has to answer when someone asks how you know your pramanas work, the error cases it has to handle (rope-snake, shell-silver, and the nastier one where the cognition comes out true but from a defective process), and what it owes about how validity gets known — intrinsic vs. extrinsic.

  Then tell me which of these are genuinely forced by the framework and which are smuggled in from contemporary reliabilism or internalism, and whether any subset is jointly unsatisfiable. I suspect non-circularity plus a demand that each pramana be independantly checkable by some other one can't both be met — argue it either way, that's the part I most want. Also work in one I'm making up: the conflict clause. For any two pramanas on the list there has to be a possible case where they deliver conflicting verdicts about the same thing, and the theory has to say which wins and why; if you think that's incoherent, say so instead.

  Finish with which single desideratum does the most excluding, and two or three lines each on how the Nyaya four, the Buddhist two, and the Mimamsa expansion adding postulation and non-apprehension do against the list.
