  First, the main claim: Eliminating psychiatric constructs for dangerousness inevitably redistributes that function into criminal justice mechanisms with weaker safeguards, increasing total confinement. The reasoning should follow step by step. Start with the unyielding public demand for protection from perceived dangerous individuals. The reform removed the medical framework, so the system adapts by using criminal tools to fill the void.

