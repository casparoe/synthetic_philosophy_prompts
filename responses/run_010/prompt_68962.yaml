answer: |-
  Here is the steelmanned argument, stripped of qualification:

  **Eliminating psychiatric frameworks for dangerousness inevitably redistributes that function into blunt criminal justice mechanisms with weaker safeguards, increasing total confinement.**  

  The public’s demand to incapacitate those perceived as dangerous is irreducible—it predates psychiatry and transcends semantics. Your reform surgically removes the *medical vocabulary* but leaves the *carcereal imperative* untouched. When courts can no longer call a paranoid schizophrenic "mentally ill and dangerous," they simply call him "high-risk" during sentencing. Prosecutors, barred from psychiatric testimony at trial, flood sentencing phases with actuarial risk tools quantifying "future dangerousness" as an aggravating factor. Parole boards, forbidden from considering a psychiatrist’s prognosis, default to algorithmic risk scores (based on history, demographics, behavior) that are statistically cruder and procedurally opaque. Pretrial detention, once justified partly by psychiatric instability, now leans entirely on "dangerousness prediction models" that judges apply with less scrutiny than medical holds. Post-sentence, "civil commitment" vanishes—only to be replaced by "public protection confinement," where release hinges on the same risk algorithms, stripped of therapeutic pretext or mandated treatment reviews.  

  **This relocation isn’t accidental—it’s efficient.** By decoupling dangerousness from diagnosis, you eliminate cumbersome protections: no requirement to prove mental illness, no obligation to offer treatment, no periodic medical review. Risk scores need no "cure," only "management." The burden of proof lowers because actuarial models feign objectivity—a number doesn’t testify or face cross-examination. The system becomes *more* carceral because it’s *less* accountable: judges and parole boards defer to opaque algorithms labeled "evidence-based" while denying defendants the tools to challenge their methodology. The state locks people up *sooner* (pre-trial), *longer* (enhanced sentences), and *beyond* their terms (post-sentence confinement) based on probabilistic guesses laundered as neutral science.  

  **Szasz’s fatal error was conceding the cage while quibbling over the sign.** He rejected "therapy" as a justification but never dismantled the state’s power to imprison for hypothetical future acts. Your reform weaponizes that oversight: by banning medical language, you legitimize raw preventative detention under the banner of "justice." The therapeutic state wasn’t a parasite—it was a pressure valve, however flawed. Remove it, and the steam explodes elsewhere: into a hyper-efficient, data-driven carceral system that cages more people for "risk" with fewer ways to fight back.  

  **For your protagonist:** They fought to tear down a lie—the medicalization of punishment—only to build a franken-system that’s crueler and more pervasive. Their clients now face longer sentences based on unexamined algorithms, languish in pre-trial detention for "statistical dangerousness," and vanish into post-sentence warehouses where no one pretends rehabilitation exists. The reform worked exactly as designed: it exposed the state’s naked will to cage. Your defender’s horror isn’t at failure—it’s at *success*. They abolished the hypocrisy and uncovered a deeper, more ruthless machine beneath. Their moral crisis? They helped design it.
