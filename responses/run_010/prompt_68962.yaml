prompt: |-
  I'm maybe 300 pages into a novel and the idea the whole thing rests on keeps wobbling on me, so I want to pressure-test it by having you actually argue for it.

  Setup: the book takes place in a state that took Szasz seriously and went the whole hog. No insanity defense, no involuntary commitment, everyone presumed competent, and psychiatrists barred from testifying about what was going on inside a defendant's head. A crime gets punished as a crime, that's it. Its supposed to be the libertarian cleanup of the therapeutic state — the honest version, where we stop calling a prison a hospital.

  The position I want you to argue for, in good faith and as hard as you can: that package isn't stable. Ten years after it passes, the state has *more* people locked up on the basis of an expert's forecast of dangerousness than it did before, just under new labels that come with fewer procedural protections than the old ones did. The demand to neutralize dangerous people doesn't evaporate when you strip off the medical vocabulary, it relocates: into sentencing enhancements, into risk-assessment scores that quietly decide parole, into pretrial detention justified by prediction rather than flight, into post-sentence schemes nobody bothers calling treatment anymore because the word is banned. So the therapeutic state wasn't a parasite on criminal justice that you can surgically remove, it was criminal justice answering a demand that retribution alone can't satisfy — and Szasz mistakes the symptom for the disease.

  Part of the case should lean on a tell I keep coming back to: he never actually objected to locking people up. He objected to locking them up in a building with a sign that says hospital. Once you grant the state the cage and only argue about the signage, you've already conceded the thing that does the work.

  Steelman it. No hedging, no on-the-other-hand-some-would-say. And don't bother with sources or names, I've read the literature, I just want the argument — including what it implies for my protagonist, a public defender who campaigned for the reform and now has to watch it operate exactly as designed.

  Put your bottom line in the first sentence, stated flat as a claim someone could deny, then give the reasoning. No preamble and don't restate my question back at me.
