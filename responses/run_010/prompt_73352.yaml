prompt: |-
  I'm a handling editor at a journal that publishes work on animal and human behavior, and my desk is full of papers offering evolutionary explanations — some say a trait is an adaptation shaped by selection, some say it's a byproduct of something else that was, some say it's drift or developmental constraint. My reviewers split into two camps: half reject any adaptation claim as an unfalsifiable just-so story, half reject any non-adaptive account as giving up too early, and I keep getting appeals both ways. I need one procedure I can run in about twenty minutes, before deciding whether to send a paper out, that a non-specialist can actually follow: the questions in order, what counts as a decent answer to each, which answers let me keep going and which mean desk reject, and which questions I should be passing to a reviewer or the stats editor instead of answering myself. Ground it in whatever philosophy of biology and behavioral ecology actually say about how you'd test these claims — what evidence could tell an adaptation from a byproduct from an accident — but keep it operational, not a lit review. Then run it on two submissions: a cross-cultural survey paper arguing a sex difference in mate preferences is an adaptation, and one arguing that religious ritual is a costly signal that was selected for even though the underlying belief is a byproduct of overactive agency detection. I expect it to come out against something I'd already made my mind up about — say so plainly. And separate what's settled among people who work on this from what's a live fight; don't hand me one camp's doctrine dressed up as standard method.
reasoning: |-
  Okay, the user is a handling editor for a journal focused on animal and human behavior. They're dealing with a flood of papers proposing evolutionary explanations—adaptations, byproducts, drift, etc. The reviewers are split: half reject adaptation claims as just-so stories, the other half dismiss non-adaptive explanations as giving up too soon. The editor needs a quick, 20-minute procedure to decide desk-reject or send for review. They want something operational, grounded in philosophy of biology, usable by a non-specialist. Plus, test it on two example papers and be honest if it contradicts their pre-existing views.

  First, I need to recall the key debates in evolutionary biology. The main camps are the adaptationists (like Dawkins, Pinker) who emphasize natural selection, and the critics (Gould, Lewontin) who stress constraints, spandrels, and drift. The editor wants a balanced approach, not biased toward either side. So the procedure must incorporate criteria from both perspectives without favoring one.

  The core challenge is distinguishing adaptations from byproducts or noise. Key concepts from philosophy of biology include Williams' 1966 criteria for adaptation (complexity, function), Gould and Vrba's exaptations, and Mayr's proximate vs ultimate causes. For testability, Popper's falsifiability matters, but Sober's contrastive approach is more practical—comparing hypotheses against alternatives with evidence.

  Now, structuring the 20-minute procedure. It needs to be a flowchart: sequential questions with clear pass/fail gates. Should cover: 1) Is the trait variable? 2) Is the evolutionary hypothesis testable? 3) Are adaptive predictions supported? 4) Are non-adaptive alternatives ruled out? 5) Is the mechanism plausible? Each question must have concrete criteria for proceeding or desk-rejecting.

  For non-specialist usability: avoid jargon, use bullet points, specify what counts as decent evidence (e.g., comparative data, experiments, models). Flag what requires expert review (e.g., stats, phylogenetics). Emphasize that absence of evidence for alternatives isn't proof of adaptation—it's about relative support.

  Testing on the two papers: First, the mate preference sex difference paper. Common claim, but often based on self-reports. Issues: may lack cross-cultural universality, confounds with culture. If the paper doesn't test non-adaptive hypotheses (e.g., sensory bias), it might fail early. Second, the religious ritual costly signaling paper. More nuanced—costly signals can be adaptations even if beliefs are byproducts. But does it provide evidence for signal honesty or fitness benefits? If not, it could be weak.

  The editor expects the tool to contradict their views. For example, if they're skeptical of mate preference adaptations, the procedure might desk-reject a weak paper, confirming their bias. But if they lean toward costly signaling, it might flag gaps, challenging them. Need to be transparent about that.

  Separating settled science from live fights: Universally accepted is that adaptation claims require evidence beyond correlation. Live debates include how much evidence is enough, the role of constraints, and defining "function." The procedure should reflect consensus (e.g., need for testing alternatives) but note where experts disagree (e.g., reliance on optimality models).

  Finally, operationalizing: Keep questions focused. E.g., Q1: Is the trait well-defined and variable? Decent answer: clear operationalization, data on variation. Fail: vague trait, no variation data → desk reject. Q2: Does the paper test evolutionary hypotheses? Decent: explicit comparisons, statistics. Fail: just-so storytelling → desk reject. And so on.

  Running the examples quickly: Mate preference paper—likely fails at Q3 if no alternative tests. Religious ritual—might pass Q2 if costly signaling predictions are tested, but fail Q5 if no pathway evidence. Outcome might surprise the editor if they favored one but the tool rejects it.
answer: |-
  Here’s a streamlined 20-minute procedure grounded in consensus philosophy of biology (Williams 1966, Gould & Lewontin 1979, Sober 2000) and behavioral ecology. It focuses on **testability** and **alternative elimination**, avoiding both adaptationist/anti-adaptationist dogma. Consensus principles:

  1.  **Adaptations require evidence of functional design**, not just benefit.
  2.  **Byproducts/spandrels** must show trait arises non-functionally from an adaptation.
  3.  **Drift/constraint** require evidence of absence of selection or inability to evolve.
  4.  **All claims must be falsifiable** by conceivable evidence.

  ---

  ### The 20-Minute Editor's Triage Procedure
  *(Run sequentially; stop at any "Desk Reject?" step)*

  1.  **DEFINITION & VARIATION (3 min)**
      *   *Question:* Is the trait clearly defined and empirically measurable? Is there evidence of population-level variation?
      *   *Decent Answer:* Operational definition (e.g., "mate preference" = ranked choices in controlled experiment; "ritual cost" = caloric expenditure measured). Data showing variation (e.g., means, SDs, range).
      *   *Keep Going?* YES if clear definition + variation data exists.
      *   *Desk Reject?* YES if trait is vague ("aggression," "religiosity" without measures) or paper assumes universal trait with no variation data.
      *   *Delegate?* No. This is basic reporting.

  2.  **HYPOTHESIS TESTABILITY (5 min)**
      *   *Question:* Does the paper explicitly test its *evolutionary* hypothesis against at least **one credible alternative** (e.g., adaptation vs. byproduct, selection vs. drift)? Are predictions unique to each hypothesis?
      *   *Decent Answer:* States competing hypotheses (e.g., "Adaptation: Preference X should correlate with fitness in Y context. Byproduct: Preference X should correlate with non-mating trait Z. Drift: Variation in X should fit neutral model."). Uses data to compare support.
      *   *Keep Going?* YES if hypotheses are testable and contrasted using their data.
      *   *Desk Reject?* YES if only one hypothesis is presented, alternatives are strawmen, or predictions aren't unique ("it could be adaptation or byproduct" without testing either).
      *   *Delegate?* Send to stats editor if methods for model comparison (AIC, LRT) are used but unclear.

  3.  **ADAPTATION CLAIMS: FUNCTIONAL DESIGN (4 min)**
      *   *Question (IF adaptation is claimed):* Is there evidence for **specific functional design**? Does the trait show complexity, efficiency, or specificity for the proposed function *beyond* mere correlation?
      *   *Decent Answer:* Evidence of **special fit** (e.g., preference tracks *specific* fitness-relevant cues cross-culturally, not general "good partner" traits; ritual costliness scales precisely with signal honesty needs). Evidence **against** simpler alternatives (e.g., preference isn't a side-effect of general learning; ritual isn't explainable by general neurocognitive processes alone).
      *   *Keep Going?* YES if evidence for special design *and* attempts to rule out "simpler" non-adaptive explanations.
      *   *Desk Reject?* YES if *only* correlation with benefit ("preferred mates are healthier" ≠ adaptation) or if design evidence is absent/weak.
      *   *Delegate?* Send to reviewer if functional complexity claims require specialist knowledge (e.g., cognitive mechanisms).

  4.  **BYPRODUCT/SPANDREL CLAIMS (3 min)**
      *   *Question (IF byproduct is claimed):* Is there clear evidence the trait is a **non-functional consequence** of an identified adaptation? Is the proposed link mechanistic?
      *   *Decent Answer:* Demonstrates trait reliably co-occurs/correlates with proposed adaptation *and* shows trait lacks independent functional design (e.g., agency detection errors predict specific belief content; ritual form varies arbitrarily while core detection mechanism is fixed).
      *   *Keep Going?* YES if mechanistic link to adaptation is plausible and evidence shows the trait *itself* isn't functional.
      *   *Desk Reject?* YES if link is merely asserted ("religion must be a byproduct") without evidence of non-functionality or mechanism.
      *   *Delegate?* Send to reviewer for mechanistic plausibility (e.g., cognitive neuroscience).

  5.  **PATHWAYS & PLAUSIBILITY (5 min)**
      *   *Question:* Is the proposed evolutionary pathway (selection, drift, constraint) **plausible given the data/trait**? Are key assumptions justified?
      *   *Decent Answer:* Acknowledges limitations (e.g., "We cannot directly test Pleistocene fitness" or "Drift likely but hard to distinguish from weak selection"). Uses appropriate proxies (e.g., modern fitness correlates, phylogenetic comparison, genetic models). Avoids "just-so" storytelling.
      *   *Keep Going?* YES if pathway is plausible and assumptions are addressed.
      *   *Desk Reject?* YES if pathway is implausible (e.g., selection for group benefit without individual mechanisms) or relies on untestable assumptions.
      *   *Delegate?* Send to reviewer for pathway plausibility (e.g., paleoecology, genetics).

  ---

  ### Applying the Procedure

  **Paper 1: Sex Difference in Mate Preferences as Adaptation**
  1.  **Definition & Variation:** Likely PASS (surveys measure preferences; reports sex differences).
  2.  **Hypothesis Testability:** **DESK REJECT?** High risk. Most such papers report sex differences + *interpret* as adaptation without testing against alternatives (e.g., byproduct of sex differences in life history strategies, cultural transmission). If it *only* argues "differences exist, therefore adaptation," reject. If it compares to, say, a developmental constraint model using cross-cultural variation, PASS.
  3.  **Functional Design:** If PASSED Q2, check. Does it show preferences track *specific, fitness-relevant cues* (e.g., preference for resources in low-food environments) beyond general "good partner"? Does it rule out cultural learning? Usually WEAK. If absent, reject.
  4.  *(N/A - Adaptation claimed)*
  5.  *(If passed Q2/Q3)* Plausibility: Can selection maintain differences given gene flow? Rarely addressed. May need review if complex models used.

  **Verdict:** **High probability of Desk Reject** at Q2 or Q3. Most preference surveys don't test evolutionary alternatives or show special design.

  **Paper 2: Religious Ritual as Costly Signal (Adaptation), Belief as Byproduct**
  1.  **Definition & Variation:** PASS (if rituals/measured costs defined; variation likely shown).
  2.  **Hypothesis Testability:** Critical. PASS if it tests costly signaling predictions (e.g., costlier rituals → greater group commitment/cooperation) *against* alternatives (e.g., ritual as byproduct of dysphoria reduction, belief as epiphenomenon). MUST compare hypotheses.
  3.  **Functional Design (Ritual):** PASS if shows rituals are *specifically* costly in ways that enhance signal honesty (e.g., costs deter free-riders), not just generally effortful. Must rule out ritual as expressive byproduct.
  4.  **Byproduct (Belief):** PASS if links belief content to agency detection errors (e.g., patterns in supernatural agent concepts) AND shows beliefs *lack* independent functional design (e.g., don't predict cooperation better than ritual participation).
  5.  **Plausibility:** PASS if acknowledges challenges (e.g., cultural transmission vs. selection). Costly signaling theory is established but requires evidence of *biological* fitness benefits or plausible cultural evolution pathway.

  **Verdict:** **Likely Send for Review** *if* Q2-Q4 are adequately addressed (rare, but possible). If Q2 or Q3 weak (e.g., no test of belief functionality), desk reject.

  ---

  ### Settled vs. Live Fights
  *   **Settled:** Adaptation claims require evidence beyond benefit/correlation; alternatives must be tested; unfalsifiable "stories" are unscientific; byproducts require mechanistic links to adaptations.
  *   **Live Fights:** How *much* evidence is needed for "special design"; the role of cultural evolution vs. biological selection in humans; the prevalence/importance of spandrels; whether optimality models are useful heuristics or unfalsifiable.

  **Contradicting Your Expectation:** You likely expected the mate preference paper to pass and the ritual paper to struggle. This procedure is *harsher* on typical mate preference papers (often failing Q2/Q3) but gives a rigorous costly signaling paper a path forward (if it does the work). It forces adaptationist claims to meet a higher bar than common in the literature. The religious ritual paper *could* pass by treating ritual and belief separately with evidence for each, but most such papers fail Q4 (proving belief is *non-functional*). **This likely aligns with your skepticism of weak adaptationism but challenges reflexive dismissal of costly signaling.**

  **Key Use Tip:** The core is **Q2 (Testability)**. If a paper doesn't contrast hypotheses with unique predictions, it's likely a just-so story or premature dismissal. Desk reject early and save time.
