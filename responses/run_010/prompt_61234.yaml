  We are designing an active learning workshop for 18 participants, mixed history and science/engineering students, with no assumed prior reading. The goal is to have participants experience the "boundary problem" and "direction problem" in periodization without lecturing. 

  Key conceptual targets:
  - Boundary problem: Where to draw the line? Why one year and not another?
  - Direction problem: Periodization is not neutral description; it reflects the perspective of the periodizer and what they consider important (the "terminus" or end goal). 
  - Some periods are "residual" (like the Middle Ages), defined by what they are between, and could not have been named by people living in them.

  We have some historical material for debrief:
  - "Middle Ages" term first in 1469, solidified in 1680s.
  - "Renaissance" as epoch name: 19th century (Michelet 1855, Burckhardt 1860).
  - "Scientific Revolution": mid-20th century (Butterfield 1949, Koyré).
  - Le Goff argued for long Middle Ages.

  Constraints:
  - No laptops, no money, no prizes.
  - Print max 4 pages (so we can have a deck of about 28 cards, each with a year and a one-line neutral description).
  - Avoid the words: periodization, Middle Ages, Renaissance, Scientific Revolution in participant materials.
  - No conclusion in handouts.

  We need:
  1. A one-sentence learning outcome.
  2. Materials list: 28 cards (400-1750), with years and neutral descriptions. Some cards are "double agents" (usable by multiple schemes) and some are "traps" (look decisive but aren't).
  3. Roles and rules for at least two rounds:
     - Round 1: Boundary problem. Groups divide the deck into exactly three named periods and face challenges.
     - Round 2: Direction problem. Each group gets a sealed commission specifying a terminus (a later state of affairs) that their periodization must make look like the point. Different groups get incompatible termini.
     - Optional Round 3: On naming? Only if fits in 60 min.
  4. Minute-by-minute timeline for 60 min with 5 groups (18 people: 3 groups of 4, 2 groups of 3? Or 4 groups of 4-5? Let's plan for 5 groups of 3-4, but adjust as needed).
  5. Scoring scheme: tokens or points, not rewarding historical correctness.
  6. Debrief: table mapping session moments to concepts, with reveal of historical coinage as confirmation.
  7. Four predictable problems and how to handle them.
  8. What the activity cannot capture and must be supplied.

  Let's sketch candidate mechanics for the direction problem:

  Candidate 1: Groups are given a "future" event (e.g., "the rise of nation-states" or "the Industrial Revolution") and must arrange the cards to show a progression leading to that. They then present and we see how the same events are interpreted differently.

  What participants feel: They feel the pressure to make the story lead to a predetermined end. They might feel that some events are being emphasized over others to fit the narrative.

  Candidate 2: Groups are assigned a specific value system (e.g., "progress in individual liberty" vs. "progress in scientific understanding") and must periodize based on that. The terminus is implicit in the value.

  What participants feel: They feel the subjectivity of what is considered important. They might struggle to fit events into their assigned value.

  Candidate 3: Groups are given a specific end year and a description of the state of the world at that time (the terminus). They must divide the timeline into three periods that explain how that state came to be.

  What participants feel: They feel the teleology - having to work backwards from the end. They might notice that they are ignoring events that don't lead to that end.

  Candidate 4: Groups are given a set of events and must create periods that highlight a particular theme (e.g., religion, science, art) without being told the theme in advance? But that might not directly hit the direction problem.

  Rejecting Candidate 2 because it might be too abstract and the value systems are hard to define neutrally. Also, we want the terminus to be a specific state of affairs, not just a value.

  Rejecting Candidate 4 because it doesn't explicitly force the direction from a terminus.

  Choosing Candidate 3 because it directly ties the periodization to a specific endpoint and forces the group to create a narrative leading to it. The sealed commission will specify the terminus (a later state) and they have to make the whole sequence build toward that.

  Candidate 1 is also good, but Candidate 3 is more concrete.

  So we'll go with Candidate 3 for the second round.

  Now, for the first round: boundary problem. Groups get the deck and must divide into three periods and name them. Then they challenge each other on the boundaries.

  We need a third round? Maybe we can do the residual period issue in the debrief? Or we can have a quick third round where groups are forced to name the periods without using any of the conventional names? But time is tight. Let's see the timeline.

  Let's design the session.

  1. Learning outcome: By the end of the session, participants should be able to explain how the same historical events can be organized into different periodizations depending on what endpoint one is working toward.

