     | Round 2: Creating a narrative from commission | Direction problem: periodization depends on the endpoint | The same event can be part of different stories depending on what you are trying to explain. |
     | Comparison of Round 2 periodizations | Residual periods (implied) | Periods are defined by their role in the narrative, and people living in them wouldn't have used our names. |

     Then reveal the historical coinage as above.

  7. Predictable problems and responses:

     a) Group refuses to draw boundaries: "I appreciate that you see continuity, but for the sake of the exercise, please try to divide the timeline into three periods. The goal is to explore the challenges of drawing boundaries."

     b) Science students fixate on 1543/1687: In Round 1, ask: "Why is that event the turning point for the entire society? What about changes in religion, politics, or daily life?" In Round 2, if they have a non-science commission, they must shift focus.

     c) Group struggles with Round 2 commission: "It's okay if it's not a perfect fit. Try to select events that are steps in the direction of your commission. Focus on the narrative."

     d) Group finishes early: Ask them: "If you were living in the year 1200, what would you call your own time? How might that differ from how we periodize now?" (Then share with the group later.)

  8. What the activity cannot capture:
     - The activity uses events on cards, but periodization often involves long-term processes (e.g., the rise of commerce, changes in family structure) that are not event-based. The facilitator must note that events are markers and periodization also considers underlying trends.
     - The activity also cannot fully convey that people living in a period did not know they were in a "middle" age or a "rebirth". The facilitator must explain that period names are often assigned later, from a perspective that knows what came next.

  This fits in 60 minutes and meets the requirements.
answer: |-
  ### Workshop Design: "Time's Arrows: The Stories We Build from History"

  #### 1. One-Sentence Learning Outcome  
  By the end, participants will be able to articulate how the endpoint chosen for a historical narrative shapes the organization of events into periods, revealing that periodization reflects the priorities of the periodizer, not inherent qualities of the past.

  ---

  #### 2. Materials List  
  *Printed on 4 pages (cut into cards; 28 total, plus commissions):*  
  - **Card Deck (28 cards, 400–1750):** Descriptions are neutral and avoid loaded terms. Years are bolded.  
    - **Double Agents (12 cards):** Usable to support multiple periodizations (e.g., can be framed as "beginnings" or "endings").  
    - **Traps (4 cards):** Seem like decisive turning points but lack immediate, universal impact; easily challenged.  
    - **Neutral (12 cards):** Provide context without steering narratives.  

  **Deck (Facilitator Key: DA = Double Agent, T = Trap, N = Neutral):**  
  1. **410**: Sack of Rome by a Germanic army. (DA)  
  2. **476**: Last Western Roman Emperor deposed. (DA)  
  3. **529**: Closure of a major Athenian philosophical school. (DA)  
  4. **632**: Death of a major religious leader in Arabia. (DA)  
  5. **711**: Crossing into Iberia by an Umayyad force. (N)  
  6. **800**: Coronation of a Frankish king as emperor in Rome. (DA)  
  7. **1066**: Norman invasion and conquest of England. (N)  
  8. **1096**: First armed pilgrimage to Jerusalem begins. (DA)  
  9. **1215**: English nobles force a royal charter of liberties. (N)  
  10. **1258**: Sack of Baghdad by Mongol forces. (N)  
  11. **1347**: Arrival of bubonic plague in Sicily. (DA)  
  12. **1440**: Invention of movable-type printing in Mainz. (T) *Trap: Slow adoption; not transformative until later.*  
  13. **1453**: Ottoman capture of Constantinople. (DA)  
  14. **1492**: First voyage across the Atlantic sponsored by Spanish monarchy. (DA)  
  15. **1517**: Public criticism of Church practices posted in Wittenberg. (DA)  
  16. **1521**: Spanish forces complete conquest of the Aztec capital. (N)  
  17. **1543**: Publication of a heliocentric astronomical model. (T) *Trap: Limited initial influence; censored.*  
  18. **1582**: Calendar reform introduced by the Pope. (N)  
  19. **1588**: Failed naval invasion of England by Spain. (N)  
  20. **1600**: Chartering of a major English trading company. (N)  
  21. **1610**: Publication of telescopic observations of Jupiter’s moons. (N)  
  22. **1618**: Outbreak of a major Central European war. (N)  
  23. **1642**: Beginning of armed conflict between English king and Parliament. (N)  
  24. **1648**: Peace treaties ending a multi-state war. (DA)  
  25. **1683**: Failed Ottoman siege of Vienna. (N)  
  26. **1687**: Publication of a universal law of motion and gravity. (T) *Trap: Mathematically dense; slow acceptance.*  
  27. **1703**: Foundation of a new Russian capital city. (N)  
  28. **1750**: Death of a major German composer. (N)  

  **Commissions (5 sealed envelopes, one per group; text printed inside):**  
  - Commission A: "Your periodization must show events building toward **centralized nation-states dominating Europe** by 1750."  
  - Commission B: "Your periodization must show events building toward **mechanistic explanations of nature replacing religious ones** by 1750."  
  - Commission C: "Your periodization must show events building toward **global trade networks controlled by European empires** by 1750."  
  - Commission D: "Your periodization must show events building toward **declining political power of the Papacy** by 1750."  
  - Commission E: "Your periodization must show events building toward **secular art and philosophy flourishing** by 1750."  

  ---

  #### 3. Roles and Rules for Two Rounds  
  **Round 1: Boundary Problem (20 mins)**  
  - **Goal:** Experience arbitrary boundaries and challenges to them.  
  - **Rules:**  
    1. Groups (5 total) arrange cards chronologically.  
    2. Divide the timeline into **exactly three periods** using two boundary years (from cards).  
    3. Name each period creatively (e.g., "Age of Splintered Realms," not "Middle Ages").  
    4. Groups pair up (A vs. B, C vs. D; E sits out or pairs with facilitator). Each group challenges the other’s boundaries: *"Why cut at [year] and not [adjacent year]?"* Defender must justify.  
  - **Scoring:** Groups earn 1 token per successful defense or challenge (max 2 per group).  

  **Round 2: Direction Problem (25 mins)**  
  - **Goal:** Experience how endpoint commissions force divergent narratives.  
  - **Rules:**  
    1. Each group draws a sealed commission.  
    2. Re-periodize the deck into **three periods** showing progression toward their commission’s endpoint.  
    3. Rename periods to reflect the narrative (e.g., "Age of Gathering Storms" for Commission E).  
    4. Groups present: *State commission, periods, boundaries, and one sentence per period on "how this leads to the endpoint."*  
  - **Scoring:** Groups earn 1 token per commission-justified period name + 1 token if they incorporate a "trap" card meaningfully.  

  **No Third Round** (Time constraints; naming power addressed in debrief).  

  ---

  #### 4. Minute-by-Minute Timeline (60 mins, 18 people, 5 groups)  
  - **0–5 mins:** Introduction (5 mins).  
    - *"Today, we’re detectives organizing clues (events) into patterns. No right answers—just persuasive stories."*  
  - **5–10 mins:** Round 1 Setup (5 mins).  
    - Distribute card decks. Groups sort cards chronologically.  
  - **10–20 mins:** Round 1 Work (10 mins).  
    - Groups define 3 periods, names, boundaries.  
  - **20–25 mins:** Round 1 Challenges (5 mins).  
    - Paired groups exchange challenges (1 min prep, 2 min debate per pair).  
  - **25–30 mins:** Round 2 Setup (5 mins).  
    - Collect decks; redistribute with commissions. Explain rules.  
  - **30–40 mins:** Round 2 Work (10 mins).  
    - Groups re-periodize based on commissions.  
  - **40–50 mins:** Round 2 Presentations (10 mins).  
    - Each group presents in 90 seconds (strict timing).  
  - **50–60 mins:** Debrief (10 mins).  
    - Use whiteboard table (below); reveal historical coinages.  

  ---

  #### 5. Scoring Scheme  
  - **Tokens:** Use punched paper dots (30 provided).  
    - **Round 1:** 1 token per successful challenge/defense (max 2 per group).  
    - **Round 2:** 1 token per period name that clearly links to commission + 1 token for using a "trap" card in a non-obvious way (e.g., "Printing mattered later for spreading science").  
  - **Why it works:** Rewards persuasive storytelling and engagement, not accuracy. Tokens create light competition; tally publicly on whiteboard.  

  ---

  #### 6. Debrief Table  
  *Reveal during debrief; map activities to concepts using whiteboard:*  

  | **Session Moment**          | **Concept**               | **Connection**                                                                 | **Historical Coinage Reveal**                                                                 |
  |-----------------------------|---------------------------|--------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------|
  | Round 1 boundary challenges | Boundary problem          | Any cut can be questioned; no "natural" breaks.                               | *"Medieval" coined 1469 as a "middle" period; standardized 1680s. People then didn’t use it.* |
  | Round 2 commissions        | Direction problem         | Endpoints (e.g., science) determine which events "matter."                    | *"Renaissance" named in 1855; "Scientific Revolution" in 1949. Shapin: ‘No such thing!’*      |
  | Round 2 period names       | Residual periods          | Names reflect the endpoint’s priority (e.g., "Age of Gathering Storms" for art). | *Le Goff: Middle Ages lasted past 1500. Periods are artifacts, not discoveries.*              |
  | Trap card usage            | False turning points      | Events like 1543 seem pivotal but weren’t experienced that way.               | *Butterfield/Koyré made 1543–1687 a "revolution" only in hindsight.*                         |

  **Debrief Script:**  
  - *"In Round 1, you saw boundaries are arbitrary—like medieval scholars inventing ‘middleness.’ In Round 2, your commissions forced you to make events ‘build’ toward an endpoint—like Michelet naming the ‘Renaissance’ in 1855 to celebrate French progress. Periods aren’t found; they’re built by people with an agenda."*  

  ---

  #### 7. Predictable Problems and Solutions  
  1. **Group refuses boundaries:** "We can’t divide history—it’s all connected!"  
     - *Response:* "I agree! But for this exercise, try dividing anyway. Your job is to test *why* it feels artificial. Use the most defensible cuts you can."  
  2. **Science students demand 1543/1687:** "Copernicus/Newton is obviously the turning point!"  
     - *Response:* "Great—now convince a group focused on art (Commission E) or the Papacy (D) that this matters *for their story*. If not, your ‘turning point’ might only work for science."  
  3. **Group ignores commission:** Creates generic periods not tied to endpoint.  
     - *Response:* Intervene during Round 2 work: "Check your commission. How does your ‘Age of Exploration’ directly build toward [e.g., nation-states]? If it doesn’t, rethink."  
  4. **Time overrun in Round 1:** Groups stuck debating boundaries.  
     - *Response:* After 8 mins, announce: "You have 2 minutes to lock in boundaries. Perfect is the enemy of done!"  

  ---

  #### 8. Limitation of the Activity  
  - **What it cannot capture:** The activity reduces history to discrete events (cards), missing slow, invisible processes (e.g., climate change, social attitudes) that shape periodization.  
  - **What you must supply:** In the debrief, stress that *"Periodization isn’t just about events—it’s about how long-term trends are framed by later observers. For example, the ‘Middle Ages’ wasn’t just events; it was a label applied to centuries of change that seemed ‘directionless’ until modern historians gave it a purpose."*  

  ---  
  **Final Notes:**  
  - **Total print:** 2 pages (cards) + 1 page (commissions) + 1 page (facilitator key/debrief table) = 4 pages.  
  - **Avoided terms:** Cards/commissions use no forbidden words; commissions avoid "nation-state" (substitute "centralized kingdoms").  
  - **Why it works:** Science/humanities students collaborate equally (commissions force interdisciplinary thinking), and traps/double agents ensure no "right" answer. Tokens incentivize rigor without expertise.
