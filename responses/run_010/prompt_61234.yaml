     - Task: Arrange the cards in chronological order (they can do this quickly). Then, divide the timeline into exactly three periods. They must name each period (without using forbidden words; encourage creative names). They must choose two boundary years (so three periods: up to year X, then up to year Y, then after). The boundaries must be at years that are in the deck (so they can use the events as markers). 
