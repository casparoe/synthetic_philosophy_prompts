  We are designing a screening procedure for proposals that invoke the thermodynamics of information. The panel consists of non-physicists with basic understanding but limited time. The procedure must be a sequence of questions, with clear pass/fail criteria, leading to one of three outcomes: reject, fund a feasibility study, or escalate to a physicist.

