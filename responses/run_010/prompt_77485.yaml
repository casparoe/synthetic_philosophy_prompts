  Step 1: Identify the core thermodynamic claim.
     Question: "What is the primary thermodynamic mechanism or principle that enables the energy savings in your proposal?"
     Required: A clear statement of the mechanism (e.g., reversible computing, avoiding erasure by exploiting correlations, etc.).
     If the proposer cannot state a mechanism, reject. (This is a judgement call: if the mechanism is absent or incoherent, the proposal is likely confused.)

  Step 2: Check for basic physical plausibility.
     Question: "What is the estimated energy per operation (or per bit) in your system, and how does it compare to the Landauer limit (kT ln 2 ≈ 3e-21 J at room temperature)?"
     Required: A numerical estimate of energy per operation (or per bit) and a comparison to the Landauer limit. If no numbers are provided, ask for an order-of-magnitude estimate. If they cannot provide any, reject.
     Criteria:
        a) If the claimed energy per operation is less than kT ln 2, then this is a red flag because it violates the Landauer limit. Ask for justification. If they cannot provide a compelling reason (e.g., they are not erasing bits, but using reversible computing and they account for all steps including uncomputation and without including energy from the environment), then reject. (Note: It is theoretically possible to have operations below the Landauer limit if no information is erased, but then the energy must be accounted for in the reset of the system. However, without a proper model, such claims are highly suspect and require expert review.)
        b) If the claimed energy is above kT ln 2 but below current technology (say, above 3e-21 J but below 1e-16 J per bit operation) and they are using reversible/adiabatic techniques, then proceed to next steps.
        c) If the claimed energy is in the range of current technology (e.g., above 1e-16 J) and they are using conventional methods, then the thermodynamic claim is irrelevant and we reject the proposal on the basis that the thermodynamics is not the enabling factor. (But note: the proposal may have other merits; this step only rejects the thermodynamic claim. However, if the proposal was submitted on the basis of thermodynamics, then without that, it may be weak. This is a judgement call.)

