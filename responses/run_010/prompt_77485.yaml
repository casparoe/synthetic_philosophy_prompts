  1. The Landauer limit: Erasing one bit at temperature T costs at least kT ln 2 energy. At room temperature (300K), kT ≈ 4.14e-21 J, so kT ln 2 ≈ 2.87e-21 J per bit. Modern transistors dissipate much more (e.g., 1e-16 J per switching event, which is about 35,000 times the Landauer limit). This is correct and load-bearing.
  2. Maxwell's demon is defeated by the reset of its memory, not measurement. Correct.
  3. Logically reversible computing avoids erasure but requires uncomputation to avoid garbage bits. Correct.
  4. The Landauer limit is a quasi-static limit, and real devices are far from it. Correct.

  The screening procedure:

  Step 0: Pre-screening for non-thermodynamic proposals.
