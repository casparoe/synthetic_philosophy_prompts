     a) For reversible computing: "How do you handle garbage bits and uncomputation?"
        - If no plan for uncomputation, reject.
     b) For adiabatic: "Do you use a charge-recovery clocking scheme? How is energy recovered?"
        - If they mean physical adiabatic (no heat transfer) without charge recovery, reject.
     c) For avoidance of erasure (e.g., correlation): skip this step? But then go to Step 4 for system accounting.

  4. Ask: "How do you account for the energy cost of the entire system, including control, measurement, and reset (including reset of any 'demon' memory)?"
     - If they do not account for all steps, reject.

  5. Ask: "What are the overheads (area, latency, complexity) compared to a conventional system? Are the energy savings sufficient to compensate?"
     - If overheads are extreme (e.g., >10x in area and >10x in latency) and the energy per op is not orders of magnitude better (e.g., >1000x), then reject.
     - If the overheads are extreme but the energy per op is revolutionary (e.g., near Landauer or below), then escalate.
     - Else, proceed.

  6. Outcome:
     - If all steps passed and the energy claim is not near Landauer and overheads are acceptable, fund.
     - If passed but energy claim near Landauer (within an order of magnitude) or below, or if overheads are extreme but energy is revolutionary, escalate.
     - Else, reject.

  Handoff note for escalation must include:
     - The core thermodynamic claim.
     - Claimed energy per operation and Landauer limit.
     - How they handle reversibility/adiabatic and system accounting.
     - Overheads.
     - Specific question: "Is this thermodynamically consistent and are the energy claims plausible?"

  False positives: 
     - A proposal that passes the screening but has a subtle flaw (e.g., in system accounting) might be funded. The feasibility study (4 weeks) should catch it.
     - A proposal that is thermodynamically sound but impractical might be funded, but the feasibility study will assess practicality.

  False negatives:
     - A proposal that is sound but poorly presented might be rejected. The panel might have a policy of allowing reconsideration if the proposer can clarify.
     - Proposals that save energy by non-thermodynamic means are not affected (Step 0).

  The procedure cannot:
     - Evaluate non-thermodynamic energy-saving claims.
     - Catch all flaws in complex thermodynamic arguments.
     - Replace expert review for near-Landauer claims.

  Now, verdicts for the three proposals:

  Proposal 1: Correlation-aware erase.
     Step 1: Pass (mechanism: reduce information erasure by correlations).
     Step 2: They don't provide an energy per bit? We ask: "What is the estimated energy per bit erased in your system and in conventional?" They might say conventional erase is 1e-15 J per bit (for flash) and they save Y%. The saving is not below Landauer, so pass.
     Step 3: Not applicable. (They are not reversible/adiabatic.)
     Step 4: Critical: "Do you account for the energy cost of the predictive model and its reset?" If yes, pass. If no, reject.
     Step 5: Overheads: a controller. They are acceptable for feasibility study.

     Verdict: 
        If they account for the model: fund.
        Else: reject.

     If rejected, what would we build? A controller that avoids some erase operations. The thermodynamic saving might be negligible compared to the system saving. The project might be good without the thermodynamic claim.

  Proposal 2: Reversible-adiabatic accelerator.
     Step 1: Pass.
     Step 2: They claim energy per op near or below Landauer. If below, escalate. If near (say within 10x, 3e-20 J to 3e-22 J), then we might escalate or fund? The procedure: if below Landauer, escalate. If near, and overheads extreme, escalate. Let's assume they claim 2e-21 J (below Landauer). Then escalate.
     Step 3: They claim reversible and adiabatic. We ask: "How do you handle garbage bits?" If they have a fixed-function accelerator, they might uncompute. If not, reject. We also ask about energy recovery: they say charge-recovery, so pass.
     Step 4: They must account for the entire system, including clock generation. If they claim "no heat beyond leakage", they are not accounting for adiabatic losses. So likely fail and reject. But if they provide a full accounting, pass.
     Step 5: Overheads: 3x area, 1/10 speed. If energy per op is revolutionary (e.g., 1e-20 J), then even with overheads, it might be revolutionary. But if they claim below Landauer, we escalate anyway.

     Verdict: 
        If energy per op claimed < 3e-21 J: escalate.
        Else if they fail Step 3 or 4: reject.
        Else: fund.

     But given the overclaim ("no heat beyond leakage"), likely reject at Step 4.

     Narrower version: A proposal that does not claim below Landauer, accounts for all costs, and has more reasonable overheads.

  Proposal 3: Demon-class controls.
     Step 1: Pass (mechanism: Maxwell's demon).
     Step 2: They claim 12% site energy reduction. Not an energy per bit, so pass.
     Step 3: Not applicable.
     Step 4: Critical: "Do you account for the energy cost of the control system, including the reset of its state?" If yes, then pass. If no, reject.
     Step 5: Overheads: the control system. They are probably acceptable.

     Verdict: 
        If they account for the reset: fund.
        Else: reject.

     The 12% might be real from the heat-recovery and routing, but the demon framing is flawed without reset accounting.
answer: |-
  Below is a screening procedure tailored for your panel's constraints, followed by its application to your three proposals. The procedure focuses on **quick diagnostics** to filter out thermodynamically flawed proposals, flagging only the most promising or ambiguous cases for escalation. It assumes no prior physics knowledge beyond what you've described and prioritizes **actionable questions** with **binary pass/fail criteria**.  

  ---

  ### **Screening Procedure for Thermodynamic Claims**  
  **Goal:** Separate proposals into:  
  - **Reject** (obvious flaws, no physics basis).  
  - **Fund** (plausible physics + engineering; merits feasibility study).  
  - **Escalate** (ambiguous physics, near-Landauer claims, or extreme claims needing expert validation).  

  **Key Numbers** (memorize these):  
  - Landauer limit: **\( kT \ln 2 \approx 3 \times 10^{-21} \) J/bit** (room temperature).  
  - Realistic transistor switching: **\> \( 10^{-16} \) J/bit** (modern hardware; 100,000× Landauer).  
  - **Adiabatic ≠ Physics Adiabatic**: In engineering, "adiabatic" usually means **charge-recovery circuits** (energy recycling). In physics, it means *zero heat transfer*. Treat them as distinct.  

  **Procedure** (run sequentially; stop at first failure):  
  1. **Mechanism Check**  
     - Question: *"What specific thermodynamic principle enables your energy savings? Name it (e.g., Landauer erasure, reversible computing, Maxwell’s demon)."*  
     - Pass: Clear reference to Landauer, reversible logic, demon-like control, or adiabatic (charge-recovery).  
     - Fail: Vague terms ("quantum," "entropy reduction") or no mechanism.  
     - **Stop → Reject** if fail.  

  2. **Energy Per Bit Estimate**  
     - Question: *"What is your estimated energy per bit/operation? Provide a number and compare it to \( 3 \times 10^{-21} \) J."*  
     - Pass: Value provided and ≥ \( 10^{-22} \) J (avoids impossible claims).  
     - Fail: No number, or value < \( 3 \times 10^{-21} \) J without reversibility.  
     - **Special**: If value < \( 3 \times 10^{-21} \) J and claims reversibility → **Escalate** (may be possible but needs validation).  
     - **Stop → Reject** if fail.  

  3. **Reversibility/Adiabatic Check**  
     - Question: *"If using reversible logic: How do you handle garbage bits? If using 'adiabatic': Does it mean charge-recovery clocking?"*  
     - Pass:  
       - Reversible: Explicit uncomputation strategy (no garbage accumulation).  
       - Adiabatic: Confirms "charge-recovery" (not physics adiabatic).  
     - Fail:  
       - Reversible: No uncomputation plan.  
       - Adiabatic: Implies physics adiabatic (no heat transfer) or unrelated.  
     - **Stop → Reject** if fail.  

  4. **System Accounting**  
     - Question: *"Do you include the energy cost of measurement, control logic, and memory reset in your savings? For Maxwell’s demon: How is the demon reset?"*  
     - Pass: Explicitly accounts for all steps (especially erasure/reset).  
     - Fail: Omits control/demon costs, or assumes "free" measurement.  
     - **Stop → Reject** if fail.  

  5. **Overheads vs. Savings**  
     - Question: *"What are your overheads (area, speed, complexity) vs. conventional? Does the energy saving justify them?"*  
     - Pass: Overheads < 100× area or 10× latency AND savings > 10% vs. conventional.  
     - Fail: Extreme overheads (e.g., 1000× area) without revolutionary savings (>1000×).  
     - **Escalate** if: Savings potentially revolutionary (e.g., approaching Landauer) but extreme overheads.  
     - **Stop → Fund** if pass.  

  **Handoff Note for Escalation** (concise; physicist must grasp in 10min):  
  - Mechanism: [e.g., "Reversible adiabatic"]  
  - Claimed energy/bit: [Number] vs. Landauer (\( 3 \times 10^{-21} \) J)  
  - Handling of key issues: [e.g., "Uncomputation: yes; Charge-recovery: yes"]  
  - Overheads: [e.g., "3× area, 0.1× speed"]  
  - Specific question: "Is this thermodynamically consistent? Are energy claims plausible?"  

  **What This Cannot Do**:  
  - **False Positives**: May fund proposals with subtle flaws in system accounting (e.g., underestimating control costs).  
  - **False Negatives**: Will reject **non-thermodynamic proposals** (e.g., batching/moving data less). These require a separate "engineering efficiency" lane (no physics screen).  
  - **Judgment Calls**: Steps 4 (system accounting) and 5 (overheads) are soft. Overhead tolerance depends on claimed savings.  

  ---

  ### **Application to Your Proposals**  

  #### **Proposal 1: "Correlation-aware erase"**  
  - **Step 1 (Mechanism)**: Pass. Principle: Landauer erasure cost reduced via data correlation.  
  - **Step 2 (Energy)**: Pass. No claim < Landauer; savings are relative to conventional erase.  
  - **Step 3 (Reversibility/Adiabatic)**: Skip (not claimed).  
  - **Step 4 (System Accounting)**: **Fail**. Predictor model must be stored and eventually erased. Proposal ignores energy cost of model updates/reset.  
  - **Step 5 (Overheads)**: Not reached.  
  - **Verdict**: **Reject**.  
  - **Why?** Thermodynamics is sound in theory but unsound in implementation. Erasing a "redundant" bit still requires physical work unless the system knows its state *and* avoids reset. The predictor’s own memory incurs erasure costs.  
  - **What You’d Build**: A controller that defers erases for redundant data. The thermodynamic savings are negligible; real gains come from reducing write amplification (e.g., in flash). Fund this as an **engineering project**, not a physics one.  

  ---

  #### **Proposal 2: "Reversible-adiabatic accelerator"**  
  - **Step 1 (Mechanism)**: Pass. Reversible logic + adiabatic (charge-recovery).  
  - **Step 2 (Energy)**: **Escalate**. Claimed energy/op is "below Landauer for irreversible equivalent." If their number is \( < 3 \times 10^{-21} \) J, it needs validation (reversible can avoid erasure but has other losses).  
  - **Step 3 (Reversibility/Adiabatic)**: Pass. Reversible logic implies uncomputation; "adiabatic" confirmed as charge-recovery.  
  - **Step 4 (System Accounting)**: Pass. Fixed-function accelerator implies garbage handling is feasible.  
  - **Step 5 (Overheads)**: **Fail** for funding. 3× area and 0.1× speed require >1000× energy savings to justify. Their claim is likely <<1000× (since Landauer is only one component of conventional energy).  
  - **Verdict**: **Escalate** (due to Step 2), but note overheads are prohibitive.  
  - **Narrower Fundable Version**: A proposal claiming **> \( 10^{-18} \) J/op** (realistic for adiabatic) with overheads <10×. Focus on validating energy savings in a submodule.  

  ---

  #### **Proposal 3: "Demon-class controls"**  
  - **Step 1 (Mechanism)**: Pass. Maxwell’s demon framing.  
  - **Step 2 (Energy)**: Pass. Claims 12% site energy reduction (not per-bit energy).  
  - **Step 3 (Reversibility/Adiabatic)**: Skip (not claimed).  
  - **Step 4 (System Accounting)**: **Fail**. Unlikely to account for demon reset (cost of erasing measurement history). Vendor conflates "measurement" with savings; reset is unavoidable.  
  - **Step 5 (Overheads)**: Not reached.  
  - **Verdict**: **Reject** (thermodynamic mechanism is impossible).  
  - **But**: The 12% savings may be real from workload routing/heat recovery. Evaluate as an **engineering proposal** (no thermodynamics). Ask: *"How much energy does the control layer itself consume, including all compute/storage?"*  

  ---

  ### **Final Notes**  
  - **False Negatives**: This screen will miss **non-thermodynamic efficiency gains** (e.g., batching). Add a parallel track for proposals with no physics claims.  
  - **Efficiency**: The procedure runs in <10min/proposal. All physics context is embedded.  
  - **Key Judgment Calls**: Steps 4 and 5 are soft. When in doubt, escalate.  
  - **Bottom Line**: Thermodynamic gains in real hardware are rare. Focus on feasibility studies for proposals that clear Steps 1–4 with realistic overheads. Escalate only near-Landauer claims.
