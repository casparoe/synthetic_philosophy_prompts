prompt: |-
  For several years now I have worked out, on my own and without any training in the area, a position about uncertain belief that I would like properly stress-tested. In brief: attaching a single number to your confidence in a claim is legitimate only when something like a long, stable run of observations licenses it; otherwise the honest representation of a belief is a range, and the width of that range carries information the midpoint destroys. I further hold that you can get from ranges to action without ever collapsing them into a number — you compare options by asking which holds up across everything the range permits, and if none does, you say so rather than inventing a tie-breaking figure. Those who insist a point value must always be there are, I think, smuggling in a false precision they cannot justify.

  Tell me what would count against this view. Which arguments, formal results, or consequences ought actually to move me, as opposed to merely annoying me? I am most interested in failure modes that arise from inside the position: situations where holding a range leaves you worse off or less informed than holding a single number would, where the range quietly turns back into something precise, where a rule for acting on ranges gives verdicts I would find unacceptable, or where having a range makes some kinds of learning impossible. Say also which of these the view's own defenders would concede as telling against them, and which they would wave off — and rank the defeaters from fatal to merely awkward. Finally, give me a straight verdict on whether the position risks anything at all, or has been hedged into untouchability, and whether that hedging is defensible for a view of this kind.
reasoning: |-
  Okay, the user has developed their own position on representing uncertain beliefs, arguing that single numbers are only legitimate with stable long-term data; otherwise, ranges are more honest. They want this position stress-tested, especially looking for internal failures where ranges might backfire or become counterproductive. 

  First, I need to unpack their core claims: (1) Point estimates require robust frequentist justification, (2) Ranges preserve uncertainty information, (3) Decisions can be made by comparing option robustness across ranges without collapsing to points. 

  Hmm... their framing suggests they've deeply considered this—possibly reacting against Bayesian overconfidence. The request for "internal" failures implies they've already dismissed external criticisms (e.g., "but we need numbers for decisions!"). Smart framing. 

  Now, where could this crack under its own logic? Let me brainstorm: 

  - **Vagueness in range boundaries**: If my range isn't sharp (e.g., "likely between 20-60%"), how do I avoid smuggling precision when defining endpoints? Their position might collapse into fuzzy numbers. 

  - **Decision paralysis**: When no option dominates the entire range, refusing tie-breakers could stall action. But is that *worse* than arbitrary precision? They'd probably argue no—but what if delayed action has costs? 

  - **Learning barriers**: With ranges, how do I update beliefs from sparse data? E.g., seeing one raven turn black might shift my "ravens are green" probability range from [90-100%] to [0-100%]—uselessly wide. Frequentist updating needs many observations. 

  - **Self-defeating precision**: Claiming "I'm 60-70% sure" implies sharper knowledge than "50-90%". But isn't that a covert point estimate? The range width *becomes* the new precision measure. 

  I recall formal results that might bite: 
  - **Complete class theorems**: In decision theory, admissible strategies often use precise probabilities. Ranges might force dominated choices. 
  - **Dilation paradoxes**: Some observations *widen* belief intervals, making you less certain after evidence—counterintuitive but mathematically sound. 

  For concessions: Advocates (like imprecise probabilists) would admit dilation and decision dilemmas are real but fixable. They'd reject "vagueness" criticisms as missing the point—the fuzziness is intentional. 

  Biggest threat? Probably the learning problem. Without enough data, ranges stay fat and unhelpful. Their "long stable run" requirement might exclude most real-world cases where we still need to act. 

  Verdict: Not untouchable—the decision and learning holes are real risks. But defensible if we accept that sometimes "I don't know" is better than pretending we do. Their hedging feels honest, not evasive. 

  ...Wait, did I miss something? *checks* Ah—they asked to rank defeaters. Fatal: Maybe none? Awkward: Learning under sparse data. Tolerable: Decision delays. Theoretical: Formal dominance results. 

  Final note: Their position feels like a pragmatic middle finger to Bayesian hubris. I respect that.
answer: |-
  Your position—rooted in **robust Bayesianism** or **imprecise probability**—is philosophically coherent and has defenders (e.g., Isaac Levi, Teddy Seidenfeld). However, it faces significant challenges. Below, I stress-test it rigorously, focusing on **internal contradictions**, **practical failures**, and **formal limitations**. I rank objections from most to least severe, noting which advocates would concede or dismiss them.

  ---

  ### **1. Decision Paralysis: When Ranges Refuse to Decide (Fatal if Unresolved)**  
  **Problem**: If no option dominates across your entire belief range, your "no tie-breaking" rule forces indecision. In urgent, high-stakes scenarios (e.g., medical triage), this could be catastrophic.  
  - **Example**: You estimate a drug's success probability at [40%, 60%]. Without a single number, you can't compare it to a surgery with a *known* 55% success rate. Your rule says: "Neither dominates—abstain." But inaction kills patients.  
  - **Internal Collapse**: To act, you might implicitly narrow your range (e.g., "I'll use the midpoint for emergencies"), betraying your core principle.  
  - **Formal Result**: *Levi's Dilemma*: In decision theory, refusing to "clinch" beliefs can violate **admissibility**—your strategy might be dominated by one using precise probabilities.  
  - **Advocate Response**: Conceded. Levi would say indecision is *correct* when evidence is ambiguous. But this is unsatisfying in practice.  

  **Verdict**: **Fatal** for prescriptive decision-making unless you accept "least-worst" compromises (e.g., minimax regret within the range).

  ---

  ### **2. Range Boundary Vagueness: Smuggling Precision Back In (Severe)**  
  **Problem**: Your range endpoints are either arbitrary or inherit the precision you reject.  
  - **Example**: You say "I believe X with probability [0.3, 0.7]". But why not [0.29, 0.71]? If endpoints reflect deeper uncertainty (e.g., meta-probabilities), you create an infinite regress.  
  - **Internal Collapse**: Defining ranges requires *some* precision about *imprecision*. This mirrors Keynes' critique: "It’s better to be vaguely right than precisely wrong"—but vagueness itself demands justification.  
  - **Consequence**: Ranges become psychologically unstable. Faced with conflicting evidence, you may adjust boundaries arbitrarily, reintroducing hidden point estimates.  
  - **Advocate Response**: Dismissed. Proponents (e.g., Walley) argue ranges are *set-valued* and need not be sharp. But this invites subjectivity.  

  **Verdict**: **Severe**—undermines epistemic hygiene unless you formalize range construction (e.g., through confidence intervals or credal sets).

  ---

  ### **3. Learning Impossibility: When Ranges Can't Update (Severe)**  
  **Problem**: Ranges struggle with **Bayesian updating** on sparse data. Without point probabilities, you can't apply Bayes' theorem directly.  
  - **Example**: You start with a prior range for a coin's bias: [0.4, 0.6]. After 1 head, what is your posterior? Imprecise probability methods (e.g., *envelope updating*) often widen ranges (e.g., to [0.25, 0.75]), making you *less certain* after evidence—a violation of intuitive learning.  
  - **Formal Result**: *Dilation*: Some observations *increase* uncertainty (e.g., Augustin et al., 2014). After seeing ambiguous data, your range might expand to [0, 1], erasing all knowledge.  
  - **Internal Collapse**: To learn coherently, you might discretize your range into "sub-priors," effectively recreating point probabilities.  
  - **Advocate Response**: Conceded. Seidenfeld acknowledges dilation but calls it a feature (it reflects genuine ambiguity).  

  **Verdict**: **Severe** for dynamic environments. Frequentist "long runs" rarely exist in practice, leaving you perpetually uncertain.

  ---

  ### **4. Dominance Paradoxes: Ranges Force Worse Choices (Awkward)**  
  **Problem**: Ranges can lead to dominated decisions—i.e., choices *all* worse than an alternative.  
  - **Example**: Option A yields $100 if event Y (range [0.5, 0.8]) occurs. Option B yields $50 guaranteed. Your rule: "B isn't dominated, since Y might be <0.5". But if your *true* belief centers on 0.7, picking B forsakes expected value.  
  - **Formal Result**: *Complete Class Theorems* show admissible decisions require precise priors (Schervish et al., 2003).  
  - **Advocate Response**: Dismissed. Levi argues dominance is irrelevant when beliefs are indeterminate.  

  **Verdict**: **Awkward**—but advocates wear this as a badge of integrity.

  ---

  ### **5. Communicative Breakdown: The "Range" as a Point Estimate (Awkward)**  
  **Problem**: In social contexts, your range collapses psychologically.  
  - **Example**: Saying "I’m 60-70% sure" is interpreted as "≈65%". The range’s midpoint becomes a de facto point estimate, and its width is ignored.  
  - **Consequence**: Your approach fails its own goal—preserving uncertainty information.  
  - **Advocate Response**: Conceded. This is a human flaw, not a theoretical one.  

  **Verdict**: **Awkward but surmountable** with training (e.g., using visual uncertainty scales).

  ---

  ### **6. Self-Defeating Precision in Practice (Mild)**  
  **Problem**: To act on ranges, you need precise rules for comparing options (e.g., interval dominance). These rules themselves require exact thresholds.  
  - **Example**: "Choose A if its worst-case outcome exceeds B's best-case." But this rule is a *precise heuristic*—a number in disguise.  
  - **Advocate Response**: Dismissed. Rules are meta-tools, not probabilities.  

  **Verdict**: **Mild**—doesn’t break the framework.

  ---

  ### **Straight Verdict**  
  **Your position risks real harm**: It is **not hedged into untouchability** but faces critical pressure from:  
  - **Decision paralysis** (fatal without compromise),  
  - **Learning difficulties** (severe in sparse-data contexts),  
  - **Boundary vagueness** (severe without formal grounding).  

  **Yet it remains defensible** if:  
  - You limit it to domains with radical uncertainty (e.g., national security, long-term AI risk),  
  - Allow pragmatic tie-breaking (e.g., minimax regret),  
  - Use ranges as a *diagnostic tool* (to flag where point estimates are unjustified).  

  **Ranked Defeaters**:  
  1. **Decision paralysis** (Fatal → forces abandonment in urgent decisions).  
  2. **Learning impossibility** (Severe → undermines belief adaptation).  
  3. **Boundary vagueness** (Severe → risks hypocrisy).  
  4. **Dominance paradoxes** (Awkward → but principled).  
  5. **Communicative breakdown** (Awkward → requires cultural shift).  
  6. **Self-defeating rules** (Mild → manageable).  

  **Ultimate Takeaway**: Your view is a valuable critique of overconfident probabilism. But as a *complete* epistemology, it is brittle where evidence is thin and decisions are time-sensitive. The strongest path is a hybrid: use ranges to *constrain* point estimates ("I’m 60% sure, but it could be 40–80%"), preserving honesty while enabling action.
