answer: |-
  Here is a thought experiment crafted to your specifications, followed by the analysis.

  ### Scenario: The Community Kitchen Rota
  A volunteer coordinator, Priya, runs a weekly community kitchen serving free meals. She must decide which of two equally reliable, long-term volunteers gets the highly coveted Sunday morning shift (desired for its timing and social atmosphere). Volunteer A, Ben, is a neighbor Priya chats with regularly at the bus stop. Volunteer B, Chloe, is equally skilled but lives across town; Priya knows her only through the kitchen. Both have requested the shift for months. Priya feels a stronger pull toward Ben. Unbeknownst to her, this pull is slightly amplified because Ben's dark green jacket (which he wore the first day they met and often wears) is the exact shade of the beloved, since-replaced armchair Priya nursed her newborn son in years ago. The jacket's color triggers a faint, warm sense of familiarity and comfort. Priya chooses Ben. Chloe is disappointed, losing the preferred shift.

  ### Running the Tests
  1.  **Swap Test (Returns "Preference — leave it alone"):** Reverse the standing-less feature: Imagine Ben wore a *red* jacket when they first met and usually wears that instead. Holding everything else fixed (Ben as neighbor, chats, Chloe's equal skill/dedication), Priya would *still* choose Ben. The neighborly connection remains independently motivating. The jacket color isn't *why* she chose him; removing it doesn't reverse the choice.
  2.  **Endorsement Test (Returns "Preference — leave it alone"):** Priya is told: "You chose Ben partly because he's your neighbor, but also because his green jacket subconsciously reminded you of your old nursing chair, adding a subtle positive feeling." Reflecting calmly with all facts, Priya endorses her choice: "The jacket thing is odd, but irrelevant. I chose Ben because he's my neighbor and we have that connection. That's real and matters to me. I'd choose him again knowing about the jacket." The defensible partiality (neighborly connection) withstands scrutiny; the amplification feels insignificant to her.
  3.  **Provenance Test (Returns "Bias — correct it"):** Consider a person with Priya's *identical values* (valuing community bonds, rewarding long-term volunteers) in a *slightly different situation*: Priya's cherished chair was *blue*. Ben still wears green, Chloe wears blue. In this scenario, Priya might feel a *slightly* weaker pull toward Ben (no color boost) and a *slightly* stronger pull toward Chloe (triggered by *her* blue shirt). Faced with this genuinely tough call between two defensible claims (neighbor vs. equally dedicated volunteer), she *might* hesitate longer or even flip her choice to Chloe. The outcome changes *not* due to a change in values or core defensible partiality, but solely due to the irrelevant feature (color association). This shows the borrowed pull distorted the application of her defensible partiality.
  4.  **Pattern Test (Returns "Bias — correct it"):** Analyzing Priya's past shift allocations for desirable slots amongst equally qualified volunteers, a pattern emerges: volunteers whose appearance (clothing, accessories) subconsciously reminds her of personally significant, positive objects (a grandmother's brooch style, a childhood pet's fur color, a favorite mug's hue) are *slightly* more likely to get the benefit when competing against someone with a similar defensible claim (e.g., both are neighbors, or both have volunteered equally long). This pattern tracks the standing-less feature (accidental visual resemblance to positive personal items), not her core values or defensible partialities. It shows a systematic, unfair influence.

  ### The Entangling Feature
  The single feature doing the entangling work is the **accidental visual resemblance** (Ben's jacket color to Priya's cherished nursing chair). This has no moral standing – no plausible view argues that resembling a coordinator's furniture grants a stronger claim to a preferred volunteer shift.

  ### If the Feature is Removed/Weakened
  If the jacket-color association is removed (e.g., Priya never had that chair, or Ben wears a different color), the case **collapses into something else:** a *potentially* defensible partiality (favoring a neighbor) operating *at its base strength*. Whether this base strength alone justifies choosing Ben over Chloe in this specific context is now the *open ethical question* the scenario was designed to entangle with bias. It might be a legitimate preference, it might be an overreach of neighborly partiality needing correction, but the *borrowed* amplification is gone.

  ### Strongest Reply for Your Friend
  Your friend's strongest reply is to **challenge the Pattern Test's validity and its distinction from a "preference."** She could argue: "All real preferences *will* show patterns based on the features that trigger them! Priya's defensible preference for neighbors *also* creates a pattern – neighbors get chosen more often. The fact that her preference is *also* triggered or amplified by specific sensory cues (like a color) inherent to *some* neighbors (those who wear green) doesn't make it a 'bias' instead of a preference. It just shows how her specific preference manifests. The Provenance Test is unrealistic – minute changes in *any* associative trigger could alter a close call without impugning the core preference. Endorsement after full disclosure *does* settle it: Priya affirms the neighborly connection is what matters. The color was just part of the causal chain *leading to* her recognizing the strength of that connection. Calling it a 'bias' unfairly pathologizes ordinary associative cognition."

  ### Practical Advice for the Fund
  **Implement structured "blinding" for initial assessments.** Remove identifiers tied to morally irrelevant but potentially biasing features (like writing fluency, names triggering associations) when evaluating the core *need* (e.g., cost/urgency of dental work). Allow consideration of defensible partialities (like community ties) only *after* needs are ranked based on blinded criteria, making their influence conscious and contestable. This quarantines the borrowed while permitting the load-bearing.

  ---
  **Brainstorm & Selection:**
  1.  **Workplace Project Assignment:** Manager favors team members who stayed late during a past crunch (defensible loyalty reward) entangled with those who brought banana muffins (like her grandma). *Fail:* "Muffin type" is easily dismissed as absurd during endorsement; fails irresolvability.
  2.  **Household Chore Choice:** Parent assigns preferable chore to child who helped without asking last week (defensible recognition) entangled with child humming a song the parent associates with their wedding. *Fail:* Song association might be argued as fostering family harmony ("standing"); weak standing-less feature.
  3.  **Housing Panel (Temporary Accommodation):** Panelist favors applicant from their old neighborhood (defensible community solidarity) entangled with applicant having a dog breed matching panelist's childhood pet. *Fail:* Breed association could be argued relevant for compatibility if pets are allowed; standing-less feature potentially has standing.
  4.  **Chosen - Community Kitchen Rota:** Favoring neighbor (defensible local connection) entangled with clothing color triggering personal object association. *Selected:* Color resemblance is clearly irrelevant, defensible partiality is robust but contested, associative triggers are potent yet deniable upon endorsement, fits ordinary setting.
