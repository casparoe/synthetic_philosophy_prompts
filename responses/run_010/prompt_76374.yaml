prompt: |-
  I've been reading around on what actually counts as corruption — clientelism, gift-giving, the whole argument about whether the international anti-corruption consensus is just a Western export — and the abstract definitions never line up with my own gut reactions, so I'm trying to work backwards from the verdicts instead. Here they are, roughly in the order I wrote them down.

  - A small-town mayor appoints his brother head of public works. The brother is genuinely the most qualified person in the county and the town is 4,000 people, so anyone competent knows everyone. Not fine. But:
  - The same mayor appoints a stranger who is *less* qualified, from the other side of town, purely to neutralize the opposition caucus. Fine? Actually kind of admirable statecraft? I can't make myself condemn this one and I don't know why.
  - A construction contractor pays for a district officer's daughter's wedding. Obviously not fine.
  - Village women give the district officer a goat at the harvest festival, every year, everyone gives something, nothing is pending. Fine.
  - Same goat, same people, same officer, one week before he rules on a land dispute involving their relatives. Not fine.
  - After eight months of waiting on a passport the law says you get in thirty days, you slip the clerk the "speed money." Fine — he's the corrupt one here, you're the mark.
  - You pay a nurse to move your father up the list for a hip replacement, ahead of four people who've waited longer. Not fine. These last two keep bugging me because they look structurally identical — pay an official to get you something the rules would otherwise allocate differently — and my verdicts split.
  - Same hip replacement, but you learn the four ahead of him all have private coverage and are getting theirs done at a private clinic next month, so the queue is basically fictional. Now I flip. I don't know which way.
  - Big campaign donors getting ambassadorships. Not corruption, it's just how the place runs, and saying otherwise feels like a gotcha. But:
  - A head of state appoints a donor's son-in-law as ambassador to a country where he'll be negotiating a trade deal that benefits the donor's company. That IS corruption. So the line is proximity to a decision, which feels arbitrary to me.
  - A professor writes a glowing letter for a student she's barely taught because the kid's father is an old friend from grad school. Mildly not fine, but nobody would call it corrupt, and I can't say what's missing compared to the wedding case.
  - A congressman steering a highway interchange into his own district. Totally fine, that's literally the job. Steering one into a colleague's district in exchange for the colleague's vote: fine, logrolling. Steering one into a colleague's district in exchange for the colleague's brother landing the paving contract: not fine. The first two and the third differ only in who pockets the return.

  My working principle so far is something like: an office gets corrupted when the officeholder lets a relationship he has in his private capacity displace the standards attached to the office. It's not holding up. It can't handle the festival goat (no decision pending, so nothing is being displaced), it can't handle the passport money (the payer isn't an officeholder at all, but I do think there's corruption in that transaction, just not mine), and it seems to condemn the congressman's interchange, which I refuse to accept. Worse, every time I test it against cases from places where the state is thin — the goat, the clan hiring, the wedding — it either condemns them and I have to say the people living inside the practice are simply wrong about what they're doing, or I add a clause about what the office means in that context and the principle stops being universal, which was half the reason I wanted a principle in the first place. I also don't want to bail out into "it's all culturally relative," because that reads to me like letting real predation off the hook by describing it politely.

  So: give me the principle, or the two or three real candidates, stated precisely enough that I could apply it to a case neither of us has thought of — with a note on which of my cases motivated each clause. Then run it on three I haven't listed: a judge who accepts an unpaid honorary teaching post at a law school bankrolled by a firm with cases in her courtroom; an NGO that pays a village chief a "coordination stipend" straight out of the project budget; and a company that takes a regulator to a football match and logs it in its public gift register. And tell me which of my verdicts the principle forces me to give up — name one, just one, and argue it, including the hip-replacement pair, where I want to be told which way to land and why. Don't hand me a menu of options with pros and cons or a both-sides shrug. I want a committed answer, especially on the universality question: does your principle end up condemning some practices that the people inside them accept, and if it does, say why that's the correct result rather than a sign that you've just handed me my own political culture with the local color filed off.
reasoning: |-
  Okay, the user has presented a complex ethical puzzle about defining corruption. They've listed multiple scenarios where their gut reactions don't align with abstract definitions, and they're clearly frustrated with relativistic approaches. 

  First, I need to recognize their intellectual depth - they're not looking for textbook definitions but a robust principle that can handle edge cases. Their rejection of cultural relativism while acknowledging contextual differences shows they want ethical consistency without Western paternalism. 

  The core tension seems to be between formal rules and functional outcomes. In cases like the qualified brother versus the political appointment, or the hip replacement queue, the user intuitively distinguishes between actions that distort systems versus those that optimize or bypass broken systems. 

  For the working principle they proposed (private relationships displacing official standards), the failures they note are insightful. The passport "speed money" example is particularly thorny - it's clearly corruption but doesn't fit their definition since the payer isn't an officeholder. This suggests we need a systemic view where corruption can exist in transactions, not just individual actions.

  The goat cases reveal another dimension: timing matters. The same gift shifts from cultural practice to bribe based on pending decisions. This points to intentionality and consequence as factors. 

  What's really interesting is how they separate "statecraft" from corruption in political appointments. Their admiration for neutralizing opposition through strategic appointments indicates they value functional governance over rigid procedural purity. Yet they draw the line when private gain enters, like the contractor case.

  For the hip-replacement pair, I'm landing on "not fine" even with the fictional queue because it still abuses a position. The passport case feels different because it's retrieving owed service. The distinction might be whether you're getting what's owed versus taking from others.

  The universality demand is toughest. If my principle condemns practices accepted in their context (like the festival goat), I'll need to argue that the condemnation targets the power imbalance, not the culture. The goat becomes problematic only when givers have no alternative - that's the universalizable harm.

  For their three untested cases: the judge's teaching post creates dependence, the NGO stipend is corrosive unless transparent, and the football match might be fine if logged. But each requires context about power and alternatives.
answer: |-
  Here's a precise, universalizable principle of corruption, built from your verdicts and designed to handle your toughest cases:

  **Principle:** Corruption occurs when a power-holder (public official or entrusted private actor) leverages their position to confer an *excludable benefit* (material or immaterial) in exchange for an *extrinsic reward* (favor, resource, relationship), thereby bypassing or subverting the *procedurally legitimate allocation system* intended for that benefit.

  **Key Components & Their Origins:**
  1.  **"Power-holder leverages their position"**: (Motivated by *all* cases - distinguishes official power from private influence).
  2.  **"Confer an excludable benefit"**: Benefits others could be denied (e.g., job, contract, license, favorable ruling, queue position). (Motivated by *goat (pending dispute)* vs *goat (festival)*, *passport*, *hip replacement* vs *professor's letter* - the letter isn't typically an excludable benefit controlled solely by the professor's power).
  3.  **"In exchange for an extrinsic reward"**: Something beyond the official criteria/process (money, favor, political support, loyalty, future obligation). (Motivated by *brother appointment* (reward: familial loyalty), *contractor wedding* (reward: cash), *speed money* (reward: cash), *logrolling* vs *paving contract* (reward: colleague's vote vs colleague's brother's contract)).
  4.  **"Bypassing or subverting the procedurally legitimate allocation system"**: Ignoring official rules, merit, need, queue, competitive process, or transparent criteria. (Motivated by *brother* (merit system subverted), *passport* (queue/time rules bypassed), *hip replacement* (queue/need system bypassed), *donor ambassador* (merit/appointment process subverted for reward)).
  5.  **"Intended for that benefit"**: Recognizes systems vary (elected reps *are* intended to bring projects home; village gift-giving might be the *intended* system for maintaining harmony). (Motivated by *congressman's interchange* (fine - intended system), *festival goat* (fine - might be the intended local system), *political appointment to neutralize opposition* (fine? - politics *is* the intended allocation system for power/shared governance)).

  **Why it Captures Your Verdicts (Mostly):**
  *   **Brother Appointment:** Leverages position, confers job (excludable benefit), rewards family loyalty (extrinsic), bypasses merit system (even if brother *is* best, the *reason* for appointment is extrinsic reward). **Not Fine.** ✅
  *   **Political Appointment (Opposition):** Leverages position, confers job, reward is political stability/comity (extrinsic) *but* politics is the procedurally legitimate system for such appointments. **Fine/Statecraft.** ✅
  *   **Contractor Pays for Wedding:** Leverages position (officer), confers future benefit (implicit), rewards cash (extrinsic), bypasses fair process. **Not Fine.** ✅
  *   **Festival Goat:** Leverages position? (Weakly), confers... goodwill/status? (non-excludable), reward is cultural participation (intrinsic to the role), part of *intended* local system. **Fine.** ✅
  *   **Goat Before Ruling:** Leverages position, confers favorable ruling (excludable benefit), rewards goat (extrinsic), bypasses impartial judicial process. **Not Fine.** ✅
  *   **Passport Speed Money:** Leverages position (clerk), confers service owed (excludable benefit - timely issuance), rewards cash (extrinsic), bypasses queue/time rules (intended system). **Corrupt (clerk is corrupt, payer is complicit).** ✅ *(Principle focuses on the clerk's corruption, explaining your feeling the payer is the "mark" but the act itself is corrupt)*.
  *   **Hip Replacement Bribe:** Leverages position (nurse), confers queue jump (excludable benefit), rewards cash (extrinsic), bypasses need/queue system. **Not Fine.** ✅
  *   **Hip Replacement (Fictional Queue):** Leverages position, confers benefit (excludable), rewards cash (extrinsic), **but** the intended system (queue based on need) is *already* subverted/fictional. Bypassing a broken system isn't *further* corruption *of the intended system* in the same way. **Flip to "Fine" or "Less Bad"** (Principle allows this - the legitimate allocation system isn't functioning, so bypassing it with extrinsic reward isn't subverting *that* system). ✅
  *   **Donor Ambassadorship:** Leverages position (Head of State), confers position (excludable), rewards donations (extrinsic), subverts merit-based appointment system. **Not Fine.** ❗ *(You said "not corruption" - Principle forces you to give this one up. See below.)*
  *   **Donor Ambassadorship w/ Direct Benefit:** Same as above, *plus* the benefit conferred (trade deal) directly rewards the donor, adding self-dealing. **Not Fine.** ✅
  *   **Professor's Letter:** Leverages position? (Weakly), confers letter (non-excludable benefit in most contexts - others can get letters), reward is friendship obligation (extrinsic), but university systems often *intend* for professors to use judgment/networks. **Mildly Not Fine** (stretches norms), **not strongly corrupt.** ✅ (Fits: benefit isn't strongly excludable, system allows discretion).
  *   **Congressman's Interchange:** Leverages position, confers project (excludable benefit - his district gets it), **but** reward is constituent support/votes (intrinsic to the intended electoral/political system). **Fine.** ✅
  *   **Logrolling (Vote for Vote):** Leverages position (both), confer projects (excludable), reward is reciprocal vote (extrinsic), **but** vote-trading *is* the procedurally legitimate system in many legislatures. **Fine.** ✅
  *   **Logrolling (Contract for Vote):** Leverages position, confers contract (excludable benefit - now a monetary prize), rewards brother's contract (extrinsic), bypasses competitive bidding/merit system. **Not Fine.** ✅

  **Applying to New Cases:**
  1.  **Judge & Honorary Teaching Post:** Leverages position (judge), *potential* benefit (impartial rulings?), *potential* extrinsic reward (prestige/favor from the firm?). **Crucial:** Is the teaching post *intended* to influence rulings? Is the firm getting rulings in its favor? If yes, or if a reasonable person would perceive dependence, it subverts the impartial judiciary system. **Likely Corruption.** If truly honorary, no quid pro quo, and common practice without influence, likely **Fine.**
  2.  **NGO "Coordination Stipend":** Leverages position (chief), confers? Access/cooperation? (excludable benefit to NGO), reward is cash (extrinsic). Does it bypass the intended system? Is the chief entitled to payment for official duties? If the stipend is transparent, budgeted, and for work *beyond* normal duties (like mobilizing villagers), it might be **Fine** (creating a new intended system). If it's a hidden bribe to access what the NGO is entitled to, or distorts the chief's duties, **Not Fine.**
  3.  **Company/Regulator Football Match (Logged):** Leverages position (regulator), confers? Future favorable treatment? (potential excludable benefit), reward is hospitality (extrinsic). **Crucial:** Does the gift register have clear rules/limits? Is the value modest? Is it common social practice? If within clear, enforced rules intended to allow modest relationship-building without influence, likely **Fine.** If the value is high or creates a sense of obligation for future decisions, it subverts impartial regulation, **Not Fine.**

  **The Verdict You Must Give Up & Why:**
  **"Big campaign donors getting ambassadorships. Not corruption..."**
  The principle forces you to condemn this as corruption. Why?
  1.  **Power-Holder:** Head of State leverages their appointment power.
  2.  **Excludable Benefit:** The ambassadorship is a prestigious, powerful position others are denied.
  3.  **Extrinsic Reward:** The campaign donation is given *because of* the expectation or hope of future benefits like this appointment, not purely for policy support.
  4.  **Subverts Intended System:** The *procedurally legitimate* system for such appointments (in a non-corrupt state) is based on merit, qualifications, and diplomatic skill, not the size of political donations. Appointing based on donations bypasses this system.

  **Why this condemnation is correct, not just Western bias:**
  *   **Harm:** It degrades governance quality (less qualified ambassadors), undermines public trust (appointments seen as for sale), and creates a system where policy access and outcomes are skewed towards the wealthy who can donate large sums. This harm is universalizable.
  *   **Universality:** While the *specific role* (ambassador) varies, the core act – selling significant state positions based on personal financial contributions rather than competence or public interest – would be recognized as a corrupt abuse of power in any functional system, regardless of culture. Feudal lords selling offices was widely recognized as corrupt even in pre-modern contexts. The principle identifies the *structure* of the abuse: leveraging public power for private financial gain via a quid pro quo, subverting meritocratic or public-interest norms.

  **Universality & Condemning Accepted Practices:**
  Yes, this principle **will condemn practices accepted within specific contexts** (like your initial view on donor ambassadorships or potentially clan-based appointments in weak states). **Why this is correct:**
  1.  **Focus on Harm & Function:** It identifies a core harm – the subversion of an intended allocation system for extrinsic reward – that leads to inefficiency, injustice, and erosion of trust. These harms exist regardless of local acceptance.
  2.  **"Intended System" is Contextual:** The principle *does* accommodate context by asking what the *procedurally legitimate allocation system* **intended for that benefit** is within that specific role or institution. What's legitimate for a village chief might differ from a Supreme Court justice. However:
  3.  **Minimum Standards:** It imposes a universal minimum: the system cannot be *inherently* based on the personal enrichment or reciprocal private gain of the power-holder as its primary allocation mechanism *if* it purports to serve a broader public or institutional purpose. A system where *all* jobs go to the highest bidder is fundamentally corrupt, even if locally accepted. The harm (poor governance, injustice) is objective.
  4.  **Not Cultural Relativism, But Identifying Abuse:** It doesn't condemn culturally specific practices *unless* they involve leveraging entrusted power for extrinsic reward to bypass a system intended for fair(er) allocation. The festival goat is fine; the goat before the ruling is not. The principle provides a tool to distinguish legitimate cultural practice from corrupt abuse *within* that culture.

  **Hip Replacement Pair - The Principle's Answer:**
  1.  **Paying to Jump Real Queue:** **Not Fine.** Nurse leverages position (control over queue), confers excludable benefit (earlier surgery slot), receives extrinsic reward (cash), bypasses the procedurally legitimate system (queue based on medical need and waiting time).
  2.  **Paying to Jump Fictional Queue (Others going private):** **Fine, or at least Not Corrupt *in the same way*.** The nurse leverages position, confers benefit, receives reward. *However*, the *intended* allocation system (queue based on need) is already subverted and non-functional ("fictional"). Bribing to bypass a system that isn't working as intended isn't *further* corrupting *that* legitimate system; it's exploiting a broken one. The core harm of subverting a *functioning* fair process is absent. (The act might be *unethical* or against rules, but the *structural corruption* as defined is less clear-cut).

  This principle provides a rigorous, harm-based, and context-sensitive (without being relativistic) framework for judging corruption, forcing clarity on cases like the ambassador and explaining the gut-level distinction in the hip replacement scenarios. It accepts that condemning locally accepted practices is sometimes necessary because corruption causes universal harms.
