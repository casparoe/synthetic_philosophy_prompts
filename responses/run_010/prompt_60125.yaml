answer: |-
  ### (a) Disagreement and Method of Elimination
  **Disagreement:** Astronomers dispute whether Pluto is a planet. Pro-demotion party (e.g., IAU voters) hold that "planet" requires orbital dominance (clearing the neighborhood), citing dynamical properties and the need for a stable taxonomy. Anti-demotion party (e.g., planetary scientists, public) hold that geophysical rounding suffices, citing Pluto's geology and historical continuity. Both cite empirical facts: Pluto’s size, shape, orbit, and orbital companions (like Charon and Kuiper Belt objects).  

  **Method of Elimination (taboo "planet"):**  
  - Survives: Disagreement about **which physical properties (orbital dominance vs. geophysical rounding) should define the primary category for solar system bodies**, and where to draw boundaries in a continuum of sizes/orbital contexts.  
  - Dissolves: Any direct factual dispute about Pluto’s intrinsic features (mass, shape, composition) or its orbital neighbors.  
  **Residue:** A disagreement about scientific taxonomy—i.e., how to organize empirical facts into categories—not about the world per se. It is partly normative (what *deserves* to organize the science) and partly pragmatic (managing a continuum).  

  ---

  ### (b) Theoretical Predictions and Verdicts  
  1. **Hirsch (Quantifier Variance + Interpretive Charity):**  
     - Prediction: The dispute is verbal; both sides use "planet" with different conventions ("round body" vs. "dynamically dominant body"), and no shared factual disagreement exists.  
     - Verdict: **Holds.** Charity allows both definitions as coherent conventions. No deeper fact (e.g., "Pluto’s essence") is contested.  

  2. **Sider (Joint-Carving + Substantivity):**  
     - Prediction: Dynamical dominance carves nature better (reflects gravitational influence, orbital evolution), making anti-demotion view "objectively wrong."  
     - Verdict: **Fails.** Orbital dominance isn’t obviously more joint-carving—geophysical rounding reflects material properties and formation history. Sider relocates but doesn’t settle the dispute, as both criteria carve reality differently.  

  3. **Carnap (Internal/External + Explication):**  
     - Prediction: The IAU is explicating "planet" for scientific utility. The pre-explication dispute was external (non-factual); post-explication, it’s settled by stipulation.  
     - Verdict: **Holds.** The IAU’s definition is an explication (balancing precision, continuity, and predictive power). This confirms the original disagreement wasn’t first-order factual.  

  4. **Easy Ontology / Deflationism:**  
     - Prediction: Once the framework (definition) and empirical facts are fixed, Pluto’s status follows trivially.  
     - Verdict: **Holds.** Post-IAU vote, "Pluto is not a planet" is analytically true under the new rules. Pre-vote, the sentence had indeterminate truth-value due to vague conventions.  

  **Convergence:** Hirsch, Carnap, and deflationism all deem the dispute non-substantive. Sider is the outlier claiming substantivity but cannot resolve it.  

  ---

  ### (c) Three-Way Distinction  
  **Verdict:** **Substantive-but-indeterminate.**  
  - *Not merely verbal:* Residual disagreement about taxonomy reflects competing scientific values (e.g., dynamical vs. geophysical priorities).  
  - *Not merely stipulative:* The choice isn’t arbitrary; each definition "gets right" distinct aspects of reality (orbital mechanics vs. geological complexity).  
  - *Indeterminate:* The continuum of bodies means no "natural" boundary exists; pragmatic choice is unavoidable.  

  **Framework Compatibility:**  
  - Existing theories lack "stipulative" as a distinct category. Hirsch/Carnap/deflationism collapse stipulative and verbal disputes. Sider rejects indeterminacy. To add "stipulative," we’d need a category for decisions unanswerable to the world *and* lacking competing descriptive accuracy—but here, both definitions have accuracy claims. Cost: Blurs the line between pragmatic and factual indeterminacy.  

  ---

  ### (d) Direction-of-Authority Problem  
  **If IAU voted oppositely:** Only linguistic conventions and downstream practices (textbooks, missions) would change—not Pluto’s physical properties.  
  - **Meaning vs. Truth-Value Change:**  
    - *Hirsch/Carnap/deflationism:* The IAU changed the meaning of "planet," thereby changing the truth-value of "Pluto is a planet." Pre-2006, the sentence was indeterminate or context-dependent.  
    - *Sider:* Truth-value was always determinate (but wrong under demotion); IAU merely corrected usage.  
  - **Binding Stipulations:** Authority binds a community via coordinated adoption (e.g., textbooks). This shows disputes can be settled by fiat *because* they are linguistic/conventional—not because they were substantive. The New Mexico memorial attempts a counter-stipulation, highlighting conventionality.  

  ---

  ### (e) Mismatches and Silences  
  1. **Community-Indexing:** The dispute is **verbal for professionals** (who need a functional taxonomy) but **substantive-but-indeterminate for the public** (for whom "planet" carries historical/cultural weight). *Theories lack tools to index disputes to communities.*  
  2. **Non-Semantic Stakes:** Funding, education, and mission design depend on the outcome. *Theories ignore how practical consequences affect whether a dispute is "merely" verbal.*  
  3. **Institutional Resolution:** The IAU’s authority contrasts with "unresolvable" paradigm disputes. *Theories assume no referee exists, making this case atypical.*  
  4. **Sorites Continuum:** The size/orbital gradient forces a boundary draw. *Hirsch handles this; Sider struggles with vagueness.*  
  **Fatal Flaws:**  
  - Sider fails (b, c, e) by overclaiming joint-carving.  
  - Others miss community-relativity (a, e) and non-semantic stakes (e).  

  ---

  ### Overall Assessment  
  **Best Account:** **Carnap’s explication** best captures the IAU’s role as pragmatic refinement of a vague term for scientific utility, while acknowledging the residual normative disagreement. It aligns with the vote’s outcome without overreaching (like Sider) or underplaying the stakes (like Hirsch).  

  **Summary:** The Pluto dispute reveals a substantive-but-indeterminate taxonomic choice, masked as a first-order factual disagreement, best explained as explication in action.  

  Verdict: substantive-but-indeterminate
