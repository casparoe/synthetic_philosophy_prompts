answer: |-
  ### In-Class Betting Game: Logical Uncertainty and Bayesian Drain  
  **Goal:** Illustrate two types of drain—Dutch book incoherence vs. logical uncertainty exploitation—without naming them until the debrief. Students experience why "just be Bayesian" fails under logical uncertainty and why logical omniscience is unattainable.  

  ---

  ### **Game Setup**  
  **Players:** 12 students + **Trader** (TA with a laptop running precomputed answers).  
  **Statements:** 6 statements (mix of math/non-math, with secretly linked pairs).  
  **Compute Budget:** Each student gets 3 "compute tokens." Using a token grants +2 min and a hint (costs 1 token).  
  **Points:** Start at 100 points. Points track performance (no real money).  
  **Trader Advantage:** Precomputed answers (simulates "faster" compute).  

  #### **Statements & Answer Key**  
  *(Precomputed the night before; answers hidden until resolution)*  
  1. **M1 (Math):** "The last digit of 7^100 is 1."  
     - *Hint (if token used):* "Last digits of powers of 7 cycle every 4: 7, 9, 3, 1."  
     - *Answer:* **True** (7^100 ≡ 1 mod 10).  

  2. **N1 (Non-math):** "The capital of Australia is Sydney."  
     - *Hint:* "The capital was moved from Melbourne to a planned city in 1908."  
     - *Answer:* **False** (Canberra).  

  3. **M2 (Math):** "There are more primes under 100 than even numbers under 10."  
     - *Hint:* "Primes under 100: 25 numbers. Even numbers under 10: 5 numbers."  
     - *Answer:* **True** (25 > 5).  

  4. **N2 (Non-math):** "The first element on the periodic table is Hydrogen."  
     - *Hint:* "Hydrogen has atomic number 1."  
     - *Answer:* **True**.  

  5. **Linked Pair (Secretly Equivalent):**  
     - **S5a:** "The last digit of 3^100 is 1."  
     - **S5b:** "The last digit of 3^1000 is 1."  
     - *Hint:* "Last digits of powers of 3 cycle every 4: 3, 9, 7, 1."  
     - *Answer:* Both **True** (both ≡ 1 mod 10).  

  6. **Wildcard (Engage non-math):** "The Nile is the longest river on Earth."  
     - *Hint:* "The Nile is ~6,650 km; the Amazon is ~6,400 km."  
     - *Answer:* **True**.  

  ---

  ### **Game Rules & Payoff Scheme**  
  - **Betting:** For each statement, students privately submit a price `p` (0 ≤ `p` ≤ 1) representing their probability that the statement is true.  
  - **Trader Action (Exploitation):**  
    - If the statement is **true**, the Trader **sells** a ticket to the student at price `p`. Student loses `1 - p` points (if `p < 1`).  
    - If the statement is **false**, the Trader **buys** a ticket from the student at price `p`. Student loses `p` points (if `p > 0`).  
  - **Outcome:**  
    - Student gain/loss = `- (1 - p)` if true, `- p` if false.  
    - *Example:* A true statement with `p = 0.4` → loss of `0.6`.  

  ---

  ### **Timeline (90-Minute Session)**  
  | Time  | Phase | Activity |  
  |-------|-------|----------|  
  | 0-5 min | Intro | Explain rules, points, tokens. Emphasize: "Set prices honestly under time pressure." |  
  | 5-40 min | **Phase 1: Logical Uncertainty Drain** (Bet on M1, N1, M2, N2) |  
  |       | *Per statement (8 min each)*: |  
  |       | - 1 min: Display statement. |  
  |       | - 3 min: Students work (use token for +2 min & hint). |  
  |       | - 1 min: Submit `p`. Trader logs `p` in laptop script. |  
  |       | - 3 min: Reveal answer & losses. **Do not explain why yet!** |  
  | 40-55 min | **Phase 2: Dutch Book Drain** (Bet on S5a & S5b together) |  
  |       | - 2 min: Display S5a & S5b. Say: "Price each independently." |  
  |       | - 5 min: Students work (tokens usable). |  
  |       | - 3 min: Submit prices. Trader checks: **If `|p(S5a) - p(S5b)| > 0.1`, exploit!**<br> *Loss = `|p(S5a) - p(S5b)|` points.* |  
  | 55-65 min | **Phase 3: Wildcard** (Bet on Nile statement) |  
  |       | - 5 min: Work, submit, resolve. |  
  | 65-90 min | **Debrief** | Reveal answers, losses, and map to concepts. |  

  ---

  ### **Handling Predictable Problems**  
  1. **Math Whizzes Dominate?**  
     - **Fix:** Non-math statements (N1, N2, Nile) let non-math students contribute. Tokens allow hints (e.g., "atomic number 1" for periodic table).  
     - **Mitigation:** Trader skips Dutch book if `|p(S5a) - p(S5b)| ≤ 0.1`—prevents math-savvy students from dominating Phase 2.  

  2. **Trader Too Slow?**  
     - **Fix:** Laptop script auto-calculates losses. TA inputs `p` during submission time; script outputs loss instantly.  

  3. **Linked Pairs Feel Like "Gotcha"?**  
     - **Fix:** In debrief, normalize it: "Many of you priced S5a/S5b differently. This isn’t a trick—it’s hard to spot equivalences without compute. But in probability, consistency matters."  

  4. **Trader as Oracle ≠ Theory?**  
     - **Flaw:** Yes—the Trader simulates logical omniscience, which the theory rejects.  
     - **Debrief Clarification:**  
       > *"The Trader had precomputed answers, acting like an unrealistic oracle. Real logical uncertainty means no one has answers instantly. But faster agents (like a trader with a calculator) can exploit slower ones. The goal isn’t perfection—it’s avoiding predictable, consistent errors that fast agents can exploit."*  

  ---

  ### **Debrief: Mapping Game to Concepts**  
  1. **Phase 1 (Logical Uncertainty Drain):**  
     - *Example:* Most set `p = 0.5` for M1 (last digit of 7^100). Losses occurred even though prices were coherent (no Dutch book).  
     - **Punchline:** "You were coherent but drained by someone faster. Fixing this requires logical omniscience—impossible! So we weaken the goal: avoid exploitation by *fast* traders, not *all* traders."  

  2. **Phase 2 (Dutch Book Drain):**  
     - *Example:* If `p(S5a) = 0.3` and `p(S5b) = 0.7`, loss = `0.4`.  
     - **Punchline:** "This drain happened because prices violated probability axioms (identical truths priced differently). Fixable by being coherent!"  

  3. **Key Takeaway:**  
     - **Drain 1:** Violate probability axioms → Dutch booked with *no information*.  
     - **Drain 2:** Coherent but too slow → drained by *faster* agents.  
     - **Logical Induction Insight:** "We can’t avoid Drain 2 perfectly. But we can avoid being *predictably* wrong in ways fast traders exploit."  

  ---

  ### **Materials Needed**  
  - Laptop for Trader (preloaded with answer key and loss-calculation script).  
  - Tokens (e.g., colored paper).  
  - Printed statement cards.  
  - Scoreboard (physical or projected).  

  This design forces students to confront both drains, uses compute limits to simulate real-world constraints, and ensures non-math students contribute meaningfully. The debrief explicitly ties game moments to the theory, with honesty about the Trader’s "oracle" role.
