prompt: |-
  reading Leviathan part 1, the chapter on speech, and got properly stuck on one sentence:

  "And therefore in Geometry, (which is the onely Science that it hath pleased God hitherto to bestow on mankind,) men begin at settling the significations of their words; which settling of significations, they call Definitions; and place them in the beginning of their reckoning."

  three things I cant work out.

  1) "the onely Science." But he clearly thinks his own civil philosophy is demonstrative too — somewhere he says geometry is demonstrable because we draw and describe the figures ourselves, and civil philosophy is demonstrable because we make the commonwealth ourselves. So is "onely" narrower than it looks, or is "hitherto" doing all the work, i.e. geometry is just the one science that's actually been *achieved* so far? And if it's the latter, why frame that as something God has been pleased to bestow rather than a fact about which fields got their act together?

  2) Why do definitions buy certainty here? Same chapter he's a hard nominalist — nothing universall in the world but names, names are marks we impose. If "triangle" is just a name we laid on things alike in having three straight sides, then the two-right-angles theorem looks only as necessary as our naming convention, which surely isnt what he means. What's the extra ingredient supposed to be that makes a geometric definition different from, say, a definition of justice?

  3) this is the one bugging me. A few pages earlier he describes a man born perfectly deafe and dumb who, with a triangle and two right angles set in front of him, "may by meditation compare and find, that the three angles of that triangle, are equall to those two right angles that stand by it" — he just can't carry the result over to a differently shaped triangle without a new labour. So the deaf man lands the theorem with no words at all. Does that mean words add nothing but memory and generality (the knowing was already there), or that what the deaf man has isn't science at all until it's registered in definitions? And how is that consistent with geometry being the science *because* it begins at settling significations?

  not after a reading list, just want to know how to read these sentences.
reasoning: |-
  Okay, the user is grappling with a dense passage from Hobbes' Leviathan, specifically Part 1 on speech. They're stuck on three main points about Hobbes' claims regarding geometry as the only science, the role of definitions, and the example of the deaf man. Let me unpack this step by step.

  First, the "onely Science" paradox. The user notices Hobbes elsewhere claims civil philosophy is also demonstrable, so why privilege geometry? The key is "hitherto" – Hobbes is making a historical observation, not a theoretical claim. In 1651, geometry was uniquely advanced because its definitions were settled. Other fields like physics were still tangled in verbal disputes. Hobbes frames it as God's "bestowal" to emphasize its model status for scientific method, not divine intervention. This resolves the tension with his civil philosophy ambitions – he's saying geometry is the prototype to emulate.

  Second, the nominalism puzzle. If words are arbitrary, how do definitions create certainty? Here Hobbes' genius shines: definitions are conventions, but their consequences are necessary because we control the entire logical chain. When we define "triangle" as having angles summing to 180°, that stipulation locks in all derived properties. It's like chess rules – arbitrary at setup, but moves follow inevitably. This differs from "justice" because we don't fully control its real-world instantiations. Definitions buy certainty by creating closed systems.

  Third, the deaf man challenge. The user is spot-on: this seems to contradict definitions being foundational. But Hobbes is making a subtle point about mediation. The deaf man discovers a truth about particular triangles through sensory comparison (meditation), but this is pre-scientific cognition. Real science requires generalizing through definitions. Without words, he can't abstract to "all triangles" or communicate the finding. So definitions add universality and communicability – turning raw observation into science.

  The user's real struggle is hermeneutical: how to reconcile apparent contradictions in primary texts. They don't need secondary sources; they need the internal logic exposed. Their questions reveal sharp close-reading skills – especially noticing how the deaf man example undercuts Hobbes' own emphasis on definitions. The resolution lies in Hobbes' hierarchy of knowledge: sensory experience → prudence → science. The deaf man operates at level one; science begins at level three via definitions.

  Also notable: the user resists easy answers. When they say "not after a reading list," they're rejecting scholarly hand-waving. They want the text itself to cohere. That's why my response must stay grounded in the quoted sentences while resolving paradoxes through Hobbes' broader framework. The "hitherto" and "meditation" clues are their footholds – I should amplify those.

  Lastly, their frustration with "why frame it as God's bestowal?" touches on Hobbes' rhetorical style. He often uses theological language strategically. Here it elevates geometry as the ideal against which other sciences (including his own political project) should be measured. Recognizing this performative dimension helps decode the hyperbole.
answer: |-
  You've hit on three brilliantly thorny points in Hobbes — exactly the kind of close reading that reveals his depth. Here's how to reconcile those sentences with the rest of his system, focusing on his internal logic:

  1.  **"the onely Science" & "hitherto":**
      *   **"Hitherto" is absolutely doing the work.** Hobbes isn't saying geometry is *inherently* the only possible science. He's making a *historical* and *methodological* observation.
      *   **Achievement, Not Potential:** At the time Hobbes wrote (1651), geometry *was* the only field that had successfully achieved the status of true, demonstrative science. Physics (natural philosophy) was mired in disputes over terms like "essence," "quality," "occult," and was dominated by Aristotelianism/Scholasticism. Political/moral philosophy was even worse, full of contested, emotion-laden terms like "justice," "tyranny," "liberty."
      *   **Why "bestowed by God"? Rhetoric & Model:** Framing it as "bestowed" elevates geometry as the *exemplar*, the perfect model God has provided *for us to follow* in other sciences. It emphasizes that its success isn't accidental but demonstrates the *correct method* — starting with clear definitions and reasoning deductively. It highlights geometry as a gift, a template for human reason to emulate elsewhere. His point is: "Look, here's the *one* area where the method actually works perfectly. We must apply this same method (starting with definitions) to civil philosophy."
      *   **Consistency with Civil Philosophy:** His goal *is* to make civil philosophy equally demonstrative ("scientia") by *applying the geometric method*: start by defining your terms precisely ("covenant," "right," "liberty," "commonwealth") and then reason rigorously from those definitions. Geometry proves it can be done.

  2.  **Why Definitions Buy Certainty (The Nominalist Puzzle):**
      *   You're right about Hobbes's radical nominalism: universals are only names. So how does defining "triangle" create necessity? The key is **causation and construction**.
      *   **We Construct the Objects:** Hobbes emphasizes that the *certainty* of geometry comes *not* from the names magically capturing eternal essences, but because **we define the properties that *cause* the figure to be what it is, and we *construct* the figures in our minds (or on paper) based solely on those definitions.**
      *   **Cause & Effect Within the Definition:** When you define a "triangle" as "a figure bounded by three straight lines," you are *stipulating* the properties that *generate* all its necessary consequences. The definition isn't just a label for existing things; it's a *generative principle*. Because we *make* the figure according to this rule (in thought or diagram), its properties *necessarily* follow from the act of construction based on the definition. The angles *must* sum to 180° *because* you constructed it from three straight lines in a plane according to Euclid's rules/postulates. You control the cause, so you know the effect.
      *   **Contrast with "Justice":** Definitions of "justice" *don't* buy the same certainty because:
          *   We don't *construct* justice in the same way. Its instances arise from complex human passions, agreements, and power dynamics, not from a clear, stipulated generative definition.
          *   The "cause" (human nature, passions, social contracts) is messy, contested, and not fully under our control through definition alone. Definitions of justice are attempts to label complex phenomena, not stipulate generative rules for constructing them. Their consequences are not deducible with geometric necessity because the "material" (human action) isn't fully determined by the definition.
      *   **The "Extra Ingredient": Causation through Construction.** The definition provides the *generative rule* for constructing the object, and the properties flow *necessarily* from that act of construction according to the rule. Names are arbitrary, but the logical consequences of the stipulated construction rules are *not*.

  3.  **The Deaf Man & What Words Add:**
      *   This is a crucial passage that clarifies the limits of pre-linguistic knowledge and the *essential* role of words for *science*.
      *   **What the Deaf Man Has:** He has **true knowledge of a particular fact** (this triangle's angles equal these two right angles). He gains this through sensory experience ("meditation" meaning careful observation/comparison). It's a piece of "prudence" or experiential knowledge.
      *   **What He Lacks (and Why it Matters for Science):**
          *   **Generality/Universality:** He cannot grasp that this is true for *all* triangles. He sees it for *this* triangle. Without the universal name "triangle," he cannot abstract the property from this instance and apply it universally. Each new shape requires a new laborious comparison. Science requires universal truths ("All triangles...").
          *   **Reasoning/Demonstration:** He cannot *prove* why it must be true for all triangles. He has an observation, not a demonstration. Science requires understanding the *causes* (the definition & construction) that *necessitate* the property universally.
          *   **Memory & Communication:** While Hobbes mentions memory, the key point is **abstraction and universality.** Words allow us to form universal concepts ("triangle") and reason about them generally.
      *   **Consistency with Geometry "Beginning at Definitions":** The deaf man's knowledge is *pre-scientific*. It's raw material. **Science (scientia) begins precisely when we move beyond particular observations to establish universal truths through reasoning based on clearly defined universal concepts.** The deaf man *discovers* an instance of a geometric truth, but he cannot *possess* the *science* of geometry without the apparatus of universal names, definitions, and deductive reasoning.
      *   **In Summary:** Words (names and definitions) provide the essential tools for:
          *   Forming *universal concepts* from particulars.
          *   *Stipulating the generative rules* (definitions) that allow for demonstration.
          *   *Reasoning deductively* from those definitions to universal, necessary conclusions.
      *   The deaf man has *knowledge* of a fact, but not *scientific knowledge* of a universal, necessary truth derived from causes (definitions). Geometry *is* the science because it systematically uses definitions for this purpose.

  **How to Read These Sentences:**

  1.  **"only Science...hitherto"**: Read as a *historical fact* and a *methodological imperative*. Geometry is the *one completed model* we have; other sciences (including Hobbes's project) must emulate its method to achieve the same status.
  2.  **Definitions & Certainty**: Don't think of definitions as capturing essences. Think of them as *stipulating the construction rules* for mental/drawn objects. Certainty arises because the properties *flow necessarily* from the act of construction according to the rule. The definition *causes* (in the realm of reason) the properties.
  3.  **The Deaf Man**: See him as possessing a *particular truth* gained through sense and comparison, but lacking the *universality*, *necessity*, and *causal understanding* that define *science*. Words (names and definitions) are the indispensable tools that bridge the gap from particular experience to universal, demonstrative science. His discovery *confirms* a geometric truth exists independently of language, but *possessing the science itself* requires language.

  Hobbes is rigorously consistent here, but it requires understanding his unique blend of nominalism, emphasis on causation/construction, and his very specific view of what constitutes true science (scientia) as opposed to mere experience or prudence. You've identified the pressure points perfectly!
