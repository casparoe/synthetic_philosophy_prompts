prompt: |-
  I'm putting together handouts for a graduate pro-seminar on metaethics next term, and one of my TAs — who is much better at the formal stuff than I am — dashed this on the board after class last week and announced that it was basically a proof that the is-ought literature has never had a coherent subject matter. I don't buy it. But I also couldn't find the bad step standing there in front of him, and I want to give it to the students as a puzzle, which means I need to know the answer myself first. Here it is, tidied up from the board:

  (1) In a valid argument the conclusion can contain no content that wasn't already in the premises — that's just what validity amounts to.
  (2) 'Ought' is not a logical constant, so no rule of logic can introduce it; it has to come out of the premises themselves.
  (3) Therefore no set of purely descriptive premises entails a conclusion containing 'ought' — call this Hume's Law.
  (4) But consider: "the tide comes in twice a day at Mont-Saint-Michel" is purely descriptive, and it entails "either the tide comes in twice a day at Mont-Saint-Michel or everyone who eats shellfish ought to donate a kidney" — by disjunction introduction, which nobody disputes. That conclusion contains 'ought', and it is not equivalent to anything purely descriptive.
  (5) So (3) is false.
  (6) The only way to rescue (3) is to insist the disjunction in (4) isn't really a normative conclusion. But then whether a conclusion is normative is not settled by its vocabulary or its logical form — and vocabulary and form are the only things (1) and (2) ever appealed to. So Hume's Law has no precise statement as a thesis about logic.
  (7) If it isn't a thesis about logic, the only candidate left is an epistemic one: purely descriptive evidence could never rationally support a normative belief.
  (8) But if that's right, a person's normative beliefs could be totally unresponsive to everything they ever learn about the world with no failure of rationality, and there'd be no such thing as moral evidence — nobody's findings about suffering, cooperation, incentives or human nature could count for or against any moral view.
  (9) That's clearly wrong; it makes a mystery of the obvious fact that learning about the world does move people's moral minds, and it collapses the difference between moral disagreement and a difference in taste.
  (10) So (7) is false — and since (7) was the last refuge for (3) once (5) went through, Hume's Law is either false or meaningless, and decades of argument about it have been argument about nothing.

  I'd much rather keep (3) in some recognisable form than swallow (10), and I don't want to walk into week one telling a room of first-years that the whole debate was empty. But I won't pretend I know where the crack is, so tell me rather than reassuring me. Which step do you reject, and why did it look fine — what's the reading on which it's true and the reading on which the inference goes through? Then price the alternatives: for each of (1), (3), (6) and (7), say what I'd have to give up if I rejected that one instead, and whether the cost is a technical patch, a substantive concession, or a change of subject. I'm particularly interested in whether there's a principled way to state Hume's Law as a formal claim that survives (4) without the restriction looking gerrymandered to dodge the counterexample, or whether the honest answer is that the interesting thesis was never formal to begin with — and if it wasn't, say what it was instead, precisely enough that I could put it on a slide. Please don't send me off to the literature or list citations and authors; my students will have the handout and nothing else, so everything needs to be worked out from the argument itself. One small thing: a couple of your steps in my numbering above may be sloppy — if you think a premise as stated isn't doing what I take it to be doing, say so and restate it properly before you argue about it.

  Finish with a line beginning "Verdict:" naming the single step you'd reject and, in one clause, what rejecting it costs.
reasoning: |-
  Okay, let me work through this metaethics argument step by step. The professor wants to identify where the proof against Hume's Law fails, and I need to pinpoint exactly which step is problematic and why it seems convincing at first glance.

  First, looking at the structure: the argument claims to disprove Hume's Law (that no descriptive premises entail a normative "ought" conclusion) using disjunction introduction. The key move is in step (4) where a purely descriptive premise about tides entails a disjunction containing "ought." This appears to violate Hume's Law as stated in (3).

  Hmm, the problem seems to be with how "entailment" and "normative content" are being treated. Step (1) says valid arguments can't introduce new content, but in logic, disjunction introduction does allow adding arbitrary disjuncts - including normative ones. However, the disjunction "P or O" isn't genuinely introducing new normative content because the "ought" part isn't actually doing any work; it's just attached vacuously.

  The real issue becomes clear in step (6) where it claims this disjunction must count as normative. But if we think about what makes a statement normative, it's not just vocabulary - it's about actual prescriptive force. The disjunction "tides occur or people ought to donate kidneys" doesn't actually prescribe anything; it's normatively inert because the first disjunct is true. So the "ought" here is decorative, not functional.

  For the verdict, I need to reject step (6)'s claim that the disjunction is normative. This requires refining what "normative conclusion" means - not just containing "ought" but actually expressing a real obligation. The cost is accepting that Hume's Law needs careful formulation about genuine normative content, not just surface grammar. This isn't gerrymandering; it's recognizing that logic alone can't capture the substantive difference between real prescriptions and vacuous occurrences of moral terms.
answer: |-
  Here's the breakdown of where the argument fails, why it seems persuasive, the costs of rejecting other steps, and how to salvage Hume's Law coherently. The critical flaw is in **Step (6)**.

  ### The Bad Step: Rejecting (6)
  **Step (6) claims**: *"The only way to rescue (3) is to insist the disjunction in (4) isn’t really a normative conclusion. But then whether a conclusion is normative is not settled by its vocabulary or its logical form."*  
  **Why it’s false**: The disjunction *isn’t* a normative conclusion, but this **does not** imply that normativity is detached from vocabulary or form. The disjunction "P or O" (where P is descriptive and O is normative) is **logically equivalent** to the purely descriptive P (since P is true). The "ought" in O is **vacuous**: it contributes no prescriptive force because the truth of P makes the entire disjunction true regardless of O. Thus, the conclusion is *syntactically* normative but *semantically* descriptive.  
  **Why it looked fine**: It confuses surface syntax with substantive content. The disjunction *contains* "ought" but doesn’t *assert* or *require* any normative commitment. Vocabulary *does* determine normativity, but only when the term has semantic effect (here, it doesn’t).  
  **Cost of rejecting (6)**: You must accept that a statement containing "ought" can be non-normative if the "ought" is logically inert (e.g., in a disjunction with a true descriptive disjunct). This is a **technical patch**, not a substantive concession—it refines "normative" to exclude vacuous cases.

  ### Why Other Steps Stand (and Costs of Rejecting Them)
  - **Step (1)**: *"Validity requires no new content in premises."*  
    **Rejecting it** would undermine logic itself (e.g., accepting that disjunction introduction adds *substantive* content). **Cost**: Abandoning formal validity. **Unacceptable**.
  - **Step (3) (Hume’s Law)**: *"No descriptive premises entail a normative conclusion."*  
    **Rejecting it** forces you to accept that descriptive facts can directly generate moral obligations (e.g., tides entail kidney donations). **Cost**: **Substantive concession**—collapses the is-ought distinction entirely.
  - **Step (7)**: *"Hume’s Law must be epistemic (no descriptive evidence supports normative beliefs)."*  
    **Rejecting it** is viable (and necessary), but **only after fixing (6)**. If (6) stands, (7) seems like the "last refuge," but rejecting (7) alone would imply descriptive evidence *cannot* support moral beliefs—which contradicts step (8). **Cost**: None if (6) is rejected first; rejecting (7) *alone* forces absurd epistemic conclusions.

  ### Salvaging Hume’s Law: A Principled Formal Claim
  Hume’s Law survives by excluding vacuous normativity. Define it as:  
  *"No consistent set of purely descriptive premises **non-vacuously entails** a purely normative conclusion."*  
  - **"Non-vacuously entails"**: The conclusion’s normative content must be *essential* to its truth. In the disjunction counterexample, the normative disjunct is inessential (since the descriptive one is true).  
  - **"Purely normative conclusion"**: A statement where normative vocabulary has *semantic force* (e.g., "You ought to donate" is normative; "P or you ought to donate" is not, if P is true).  
  **Why this isn’t gerrymandered**: It mirrors how we treat other concepts (e.g., "P and 2+2=4" isn’t a mathematical claim if P is true). The restriction targets *trivial* cases without ad hoc exceptions.

  ### What Hume’s Law Really Is
  The interesting thesis **was never purely formal**. It’s a **semantic/metaphysical claim**:  
  *"No set of descriptive facts **grounds** or **explains** normative facts."*  
  - **Grounding**: Normative truths (e.g., "suffering is wrong") aren’t constituted by descriptive truths (e.g., "neurons fire").  
  - **Formal logic alone can’t capture this**: Logic handles truth-preservation, not explanation. The disjunction counterexample exploits this gap.  
  **Put this on your slide**:  
  > *Hume’s Law (refined): Descriptive premises cannot **non-vacuously entail** or **metaphysically ground** a genuinely normative conclusion.*

  ---

  **Verdict:** Reject **Step (6)** at the cost of refining "normative conclusion" to exclude cases where normative vocabulary is semantically inert.
