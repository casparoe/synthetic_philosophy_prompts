  I cover science and ideas for a general-interest magazine, but before that I spent a decade building and operating large-scale distributed systems, and that is still the vocabulary I think in: replication and quorums, failure domains, error budgets and SLOs, crash faults versus Byzantine faults, erasure coding, graceful degradation, control plane versus data plane, capacity planning, tail latency.

  I want to engage von Neumann's late writing on the brain and the computer without letting my own habits do the reading for me. Here is the position as I currently paraphrase it: the nervous system is a computing machine of a mixed kind, digital at the level of the all-or-none neuron but analog across much of what it actually controls; its components are individually slower and far less precise than a machine's, yet the whole is dependable, and he credits that to redundancy and coding rather than to component accuracy; the architecture buys dependability by trading serial depth for parallel width; memory does not appear to sit in a dedicated organ, and recall looks statistical and reconstructive rather than retrieval by address; and the system's own code is not mathematics but something of a different character, more combinatorial than numerical, so that the brain-computer comparison is an analogy whose limits are the substantive part. Correct that paraphrase wherever I have it wrong before you translate it.

  Then render the position in my vocabulary as precisely as it will go, and give me a residue report: which claims land cleanly on fault tolerance and redundancy, which only fit after I bend them, and which have no expression at all in the language of operating a service. Be disciplined about this — if a claim looks like replication only because I have already decided it must be, say so rather than translating it that way. I also suspect the whole thing is continuous with his work on synthesizing reliable organisms out of unreliable components; tell me whether that is a real bridge or my projection.

  Please use these sections, in this order: **The position, corrected** (about 150 words); **The translation** (about 500 words, claim by claim); **The residue** (about 350 words, with a verdict of clean, bent, or inexpressible for each claim); **Whose defect is the residue** (about 250 words — is the gap a poverty in reliability engineering's vocabulary, which perhaps has no way to speak of a system whose parameters are set by experience rather than at deployment, or a sign that his claims were doing less work than they appear to?); and **What I should stop saying** (about 100 words, phrased for a deadline).
