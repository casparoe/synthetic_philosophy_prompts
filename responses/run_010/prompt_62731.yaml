  Hmm, the user is a science writer who covered a flood caused by a pump failure due to a lapsed maintenance contract. They've been invited to defend their "duty-slot view" of causation by omission at an interdisciplinary workshop. This view claims omissions only cause harm when someone had an assigned duty slot - no formal assignment, no causal responsibility, regardless of counterfactual relevance.

  They need a prep sheet anticipating objections from different groups:
  - Causal-inference experts (DAGs/potential outcomes)
  - Tort lawyers
  - Safety engineers
  - Metaphysicians

  Key challenges:
  1. Must restrict omission claims (can't say my not watering your plants causes their death)
  2. Believes existing restrictions (abnormality/salience) mask institutional facts
  3. Wants to explicitly center institutional assignments

  Critical vulnerability: Redundancy case - if a backup operator would've caught the failure anyway, the slot-holder's omission becomes counterfactually irrelevant while still feeling causally significant under duty-slot view.

