  - Causal inference folks (10): Will see this as dressed-up variable selection
  - Tort lawyers (2): Will conflate cause-in-fact with proximate cause
  - Safety engineers (3): Hate individual blame narratives
  - Metaphysician (1): Thinks omission causation is philosophical quicksand

  Prep strategy:
  - Front-load concessions to defuse tension
