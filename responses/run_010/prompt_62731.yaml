  - Label the most dangerous question explicitly

  Redundancy case response:
  - Separate causal attribution from counterfactual dependency
  - Stress that duty slots create "causal hooks" regardless of system fragility
  - Concede this exposes institutional responsibility, not just individual failure

  The philosopher's trap question: "What grounds the moral weight of duty slots if not prior counterfactuals?" This bridges metaphysics to ethics - the duty-slot view's kryptonite.

  Final answer: "5 - Grounding Duty Slots"
answer: |-
  Below is a prep sheet structured for your workshop defense. It anticipates high-damage objections from each subgroup, ordered by severity (1 = most damaging). Each reply is calibrated for ~90 seconds, with soft spots noted. Strategic concessions are upfront to preempt dragging-out. The redundancy case is addressed as Objection 3 (severe but manageable). The nuclear option is Objection 5.

  ---

  ### **Strategic Concessions to Make in First 2 Minutes**  
  *(Disarm critics early; frame as clarifying scope)*  
  1. **"This isn’t metaphysics—it’s operational pragmatism.** I concede duty slots don’t resolve deep philosophical problems like ‘negative events.’ My account is descriptive: how we *attribute* causation in sociotechnical systems."  
  2. **"Counterfactuals matter, but aren’t enough.** Yes, if you *had* watered the plants, they’d live—but that’s not why we blame you. We blame you only if it was your *job*."  
  3. **"Safety engineers: I agree.** Sole focus on ‘the one who omitted’ is reductive. Duty slots expose *system* failures—like contracts lapsing—not just individual negligence."  

  ---

  ### **Anticipated Objections & Replies**  
  *Ordered by damage potential (1 = worst)*  

  1. **From Metaphysician (Nuclear Option):**  
     *"If duty slots are institutional facts, what grounds their moral/causal force? Isn’t this circular—we assign slots because omissions matter, but slots define omissions?"*  
     **Reply:** "Slots aren’t arbitrary—they emerge from functional needs. Pumps need maintainers because fluids physics *causes* disasters if unattended. Slots bundle that physical reality into human-scale responsibility. Circular? Only if we ignore that institutions encode real-world dependencies. Without the slot, the ‘omission’ is just background noise."  
     **Soft Spot:** Doesn’t resolve why institutions *should* create slots—duches meta-ethics.  
     **Damage Control:** "This view avoids metaphysical quagmires by focusing on what we *do* when investigating accidents."  

  2. **From Causal-Inference Expert (DAGs/Potential Outcomes):**  
     *"This is just ad hoc variable selection. Why privilege ‘duty slots’ over other pre-treatment covariates? Your ‘assignment’ is a confounder—not causation."*  
     **Reply:** "Variable selection asks ‘what predicts Y?’ Duty slots answer ‘who gets blamed when Y fails?’ They’re not covariates but *designations*—like labeling a ‘treatment group.’ Your model might note ‘unmaintained pumps fail more,’ but only slots explain why we hold Bob liable, not the janitor. This is causal attribution, not estimation."  
     **Soft Spot:** Conflates causal inference (prediction) with accountability (normative).  
     **Damage Control:** "Slots simplify your DAGs—they cut the fog of infinite omissions."  

  3. **Redundancy Case (Safety Engineer/Lawyer Hybrid):**  
     *"Suppose a backup operator existed but skipped coffee and missed the failure. Your ‘slot-holder’ omitted, but the backup’s omission was the actual but-for cause. Why isn’t your view refuted?"*  
     **Reply:** "Two points. First, redundancy means *two* duty slots existed—both failed. Second, the backup’s omission only ‘causes’ if *they* had a slot. But crucially: the first omission remains causal because the system *depended on that slot being filled*. If the contract lapsed (no slot), the backup’s skip isn’t a ‘cause’—it’s a system flaw. Slots clarify where to fix things."  
     **Soft Spot:** If the backup had no formal slot, duty-slot absolves them—feels counterintuitive.  
     **Damage Control:** Concede: "This shows causation isn’t zero-sum. Multiple slots can jointly cause failure."  

  4. **From Tort Lawyer:**  
     *"You’re collapsing cause-in-fact (but-for) into proximate cause (foreseeability/assignment). Duty slots are just policy masks for proximate cause!"*  
     **Reply:** "Proximate cause asks ‘is it fair to blame?’ Duty slots answer ‘was it their *job* to prevent this?’ They’re distinct: but-for, I could blame the mayor for not magically fixing pumps. Slots filter the infinite ‘but-fors’ to those with assigned responsibility. Your proximate cause then evaluates if the slot was reasonable."  
     **Soft Spot:** In edge cases (e.g., freelancers), slots blur with foreseeability.  
     **Damage Control:** "Think of slots as but-for’s institutional gatekeeper."  

  5. **From Safety Engineer:**  
     *"This perpetuates ‘bad apple’ thinking! If we say ‘Bob’s omission caused the flood,’ we ignore latent errors—like the lapsed contract."*  
     **Reply:** "Agreed—which is why duty slots *help*. The lapse meant *no slot existed*, so the ‘cause’ isn’t Bob’s omission but the *system’s omission* to assign it. My view forces us to ask: ‘Why was there no one responsible?’ That’s how I reported the flood: blame the void, not a phantom."  
     **Soft Spot:** Still names "Bob" if a slot existed—risks individualizing.  
     **Damage Control:** Emphasize: "Slots make systems visible. No slot? No individual scapegoat."  

  6. **From Causal-Inference Expert (Simpler):**  
     *"Why not use ‘normative expectations’—abnormal inattention—instead of bureaucratic slots?"*  
     **Reply:** "Because ‘abnormal’ is slippery. Is a contractor forgetting pumps ‘abnormal’? Only if we *expect* them to remember—i.e., if it’s their duty. Your ‘norm’ is just a slot in disguise. Slots are auditable: show me the org chart or contract."  
     **Soft Spot:** Cultural norms (e.g., "good Samaritan") might create duties without paperwork.  
     **Damage Control:** "In complex systems, we need explicit assignments—not folk psychology."  

  7. **From Lawyer/Engineer Overlap:**  
     *"What about non-delegable duties? If the city is always responsible for floods, why need slots?"*  
     **Reply:** "The city’s duty *is* the slot! But it’s useless for prevention. We drill down: did the mayor, DPW, or contractor have the sub-slot? If no sub-slot was assigned, the city’s omission isn’t ‘the maintainer failed’—it’s ‘we failed to assign a maintainer.’"  
     **Soft Spot:** Implies all responsibility must be subdivided—may not scale.  
     **Damage Control:** "Slots allocate causality within the ‘city’ blob."  

  8. **From Metaphysician (Softer):**  
     *"Doesn’t ‘assignment’ presuppose moral responsibility, making your view non-causal?"*  
     **Reply:** "Causation here is relational: ‘omission X caused disaster Y relative to system S.’ Slots are part of S’s structure. Moral responsibility uses this causal frame but adds norms. Example: A rock’s omission to hold back water isn’t causal—not part of S. A dam engineer’s is."  
     **Soft Spot:** Leans on "system" vagueness.  
     **Damage Control:** "I’m bracketing morality to focus on causal explanations in organizations."  

  ---

  ### **Redundancy Case Assessment**  
  It’s damaging but not fatal. Stress: **Duty slots create causal hooks for intervention.** If the backup had a slot, their omission *also* caused the failure. If no one had a slot, the redundancy itself was a sham—causation traces to whoever failed to assign/maintain the system. Concede counterfactual irrelevance but argue it’s irrelevant: slots exist to assign blame *before* we ask "what if?"  

  ---

  ### **The Question You’re Praying Nobody Asks**  
  **Objection 5 (Metaphysician):** *"If duty slots are grounded in institutional facts, and institutions are human constructs, isn’t causation by omission just collective delusion?"*  
  **Why it’s deadly:** Forces you into meta-ethics—either admit causation is "subjective" (alienating scientists) or invoke moral realism (derailing the talk). Your reply (above) pathologizes it as a "trap," but a sharp follow-up could corner you.  

  ---

  \answer{1 - Grounding Duty Slots}
