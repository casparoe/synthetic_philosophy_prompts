prompt: |-
  The test our panel applies to alteration applications is that the works must preserve the building's special architectural or historic interest. Nowhere does it say how much alteration that interest can survive, and I have come to think that gap is where most of our difficulties live.

  I am the conservation officer for a regional heritage body. We decide roughly forty applications a month to modify buildings on our register: re-pointing, roof and window replacement, energy-efficiency upgrades, extensions, and now and then something as drastic as rebuilding after a fire. Each application is judged on its own, and each, judged on its own, is a small step — this course of stone, that bay of timber, one window on a rear elevation. Over twenty years the approvals accumulate into a building in which almost none of the original material remains, though no individual approval was unreasonable. Attempts to write a numeric limit into our guidance have failed, correctly, on the grounds that any such limit is arbitrary. But arbitrariness is not the same as caprice, and I suspect a panel can defend a line it concedes to be underdetermined, on grounds of consistency, administrability, and the absence of a better alternative. I would like to know whether that defense is coherent, and whether it would survive an appeal.

  Please write a decision procedure my panel could run on an application. I want the questions in the order they should be asked, what counts as a sufficient answer to each, where the procedure terminates in a refusal, where it terminates in an approval, and where it hands the matter to a vote because the question is one of value rather than fact. It must fit inside thirty minutes per application, be usable by members with no philosophical training, and produce a written rationale that can be shown to an owner who is spending money and to an appellate body that will read it cold.

  Four things it must handle explicitly:

  First, the ledger. Give us a mechanism for recording cumulative loss across successive applications, and a way for the procedure to reach a different verdict on the forty-first application than on the fortieth without pretending that the building itself changed decisively overnight.

  Second, the baseline. Decay and neglect alter a building too, so leaving things alone is not a neutral comparator. The procedure must state what it is measuring change against, and I expect that choice to do more work than our guidance admits.

  Third, the object of protection. The same building gets different verdicts depending on whether what is being protected is the material fabric, the form and geometry, the evidence of particular hands and craft, the continuity of use, or the building's contribution to its setting. Say which of these your procedure presupposes, at which step each one enters, and what would change if the panel adopted a different one.

  Fourth, precedent. To the extent that the boundary is made determinate by our own accumulated decisions rather than by anything in the building, tell me what discipline that imposes: how reasons should be given so that later panels are bound in the right way, and when a line should be reopened rather than followed.

  Then run the procedure on four cases:

  1. An eighteenth-century stone farmhouse with failing mortar. The available contractor proposes a hard cement-rich mix that will darken the wall and alter how the fabric manages moisture; the visually and physically compatible lime alternative costs three times as much and the owner cannot raise it.

  2. A timber-framed hall where, over five applications in eighteen years, we have approved piecemeal replacement of rotten members. Some 45 percent of the frame is now machine-cut new oak. Geometry, joint types, and appearance are faithful, and each new member is discreetly stamped with the year of its insertion.

  3. A village chapel gutted by fire. The owner proposes reconstruction to the pre-fire appearance on a steel frame with prefabricated stone cladding, arguing that the building's significance lies in its silhouette in the landscape and in its continuing use for worship.

  4. Concealed, fully reversible secondary glazing and roof-slope solar panels, approved building by building across a conservation area, where no single installation is visible from the street and the aggregate effect after a decade is a district whose fabric and character have both shifted.

  At least one of these verdicts should run against what a heritage panel would expect, and I want you to say which and why the procedure produces it.

  Finally, be candid about the limits: identify the steps where the procedure relocates the judgment rather than resolving it, and say where the residual arbitrariness ends up. I am not looking for a survey of the philosophical literature on vagueness or for references of any kind — I want the procedure, the reasoning behind each step, and the honest account of what it cannot do.
reasoning: |-
  Okay, the user is a conservation officer dealing with alterations to historic buildings. They need a decision procedure that handles cumulative impact, baselines, protection objects, and precedent. Let me start by understanding their core challenges. 

  The main issue is the "death by a thousand cuts" problem—each small change seems reasonable alone but collectively erodes the building's heritage. They tried numeric limits but found them arbitrary. They want a procedure that’s practical, under 30 minutes, and defensible on appeal. 

  First, the ledger. How to track cumulative loss without arbitrary thresholds? Maybe a ledger with material loss percentages and character impacts. But percentages can be misleading. Instead, categorize loss into tiers: minimal, low, moderate, high. That’s more flexible. 

  Baseline is tricky. They mention decay as an active force. The baseline should be the building’s state at the time of listing, adjusted for natural aging. This acknowledges that neglect isn’t neutral. 

  Protection objects: The procedure must prioritize material authenticity but allow other values like form or continuity. The user needs clarity on which aspect is being protected at each step. 

  Precedent: Decisions must create binding principles, not just ad-hoc rulings. Clear rationale writing is key for consistency. 

  Now the test cases. For the farmhouse’s cement mortar: Lime mortar is essential for breathability, so refusal makes sense. But cost is an issue—procedure can’t solve funding, so it’s a hard refusal. 

  The timber hall with 45% replacement: Each repair was approved, but cumulative loss hits "moderate." Procedure forces refusal for new replacements, signaling a shift. This might surprise panels used to piecemeal approvals. 

  Burnt chapel reconstruction: Steel frame changes material authenticity but preserves form. If panel values continuity, approve with conditions. But if material is key, refuse. The procedure flags this conflict for a vote. 

  Reversible glazing and solar panels: Individually invisible, but collectively alter the area’s character. The procedure refuses further applications once cumulative impact reaches moderate. 

  The timber hall case is the counterintuitive one. Heritage panels might keep approving each small change, but the procedure halts it at 45%, acknowledging cumulative loss. This shows the ledger’s role in forcing tough decisions. 

  Limitations: The procedure doesn’t resolve value conflicts (hence votes) and baseline choices remain subjective. Also, cumulative tiers involve judgment. But it structures decisions and makes trade-offs explicit, which is better than unacknowledged arbitrariness.
answer: |-
  Here is a decision procedure designed for your panel, balancing practicality, defensibility, and explicit handling of your four requirements. It operates as a flowchart of sequential questions, terminating in Approval, Refusal, or Vote. Estimated time: 20-25 minutes per application.

  **Core Principles:**
  1.  **Object of Protection:** The procedure presupposes **material fabric authenticity** as the primary protected interest. Significance of form/geometry, craft, use, or setting enters only at specific steps as secondary factors requiring a vote if they conflict with fabric preservation.
  2.  **Baseline:** The benchmark is **the building's state and significance as understood at the time of its original listing/designation**. This acknowledges decay as an active force (requiring intervention) but sets a fixed reference point against which *change through intervention* is measured. Neglect is not a justification for further alteration beyond necessary conservation.
  3.  **Ledger:** A cumulative "Material Authenticity Score" (MAS) is maintained per building, tracked in a simple register:
      *   **100%:** Original (or historically significant) fabric intact at designation.
      *   **Reduction:** Each approved application reduces the MAS based on the estimated *percentage loss of significant original fabric* caused by *that specific intervention*. (e.g., Replacing 1 window in a facade of 10 identical windows = -10% for that facade element; replacing a structurally necessary but hidden beam = -0.5% total).
      *   **Tiers:** MAS tiers trigger stricter scrutiny:
          *   Tier 1: 95-100% (Minimal Loss)
          *   Tier 2: 80-94% (Low Loss)
          *   Tier 3: 60-79% (Moderate Loss)
          *   Tier 4: <60% (High Loss)
  4.  **Precedent:** Decisions create binding principles (not just outcomes). Rationales must explicitly state:
      *   The specific aspect of significance affected.
      *   The quantifiable impact (where possible, e.g., % fabric loss).
      *   The justification for accepting the impact (necessity, minimal harm, overwhelming secondary benefit).
      *   Any relevant MAS tier considerations.
      *   A line is reopened only if: (a) New, significant evidence about the *original* significance emerges, or (b) A material change in conservation technology/science provides demonstrably better alternatives.

  **Decision Procedure:**

  1.  **IMMEDIATE REFUSAL CHECK: Is the proposed work necessary to prevent imminent structural failure, significant safety hazard, or catastrophic loss of significant fabric?**
      *   *Sufficient Answer:* Clear, documented evidence (e.g., engineer's report for structural failure, active water ingress causing rapid decay).
      *   *No:* Proceed to Q2.
      *   *Yes:* **Proceed to Q5.** (Necessity overrides other concerns but mitigation is still required).

  2.  **MATERIAL HARM: Will the proposal cause irreversible physical alteration, damage, or loss of significant original fabric beyond minor surface wear?**
      *   *Sufficient Answer:* Description of materials/methods showing alteration (e.g., cutting new openings, removing historic fabric, using incompatible materials causing long-term damage).
      *   *No:* Proceed to Q3.
      *   *Yes:* **Proceed to Q4.**

  3.  **REVERSIBILITY & COMPATIBILITY: Is the proposal fully reversible using non-destructive techniques AND physically/compatibly designed (materials, form, detailing) to avoid harm to significant fabric?**
      *   *Sufficient Answer:* Technical specifications demonstrating non-destructive fixing, material compatibility (e.g., vapour permeability, thermal expansion), and no concealment of significant fabric.
      *   *Yes:* **APPROVE (Conditional on reversibility/compatibility).** *(Rationale: No harm to significant fabric, minimal impact.)*
      *   *No:* **REFUSE.** *(Rationale: Unacceptable risk of harm to significant fabric without overriding necessity.)*

  4.  **MINIMISE HARM: Can the harm identified in Q2 be reduced or eliminated by modifying the proposal (e.g., alternative materials, methods, design) without rendering the project fundamentally unviable or impractical?**
      *   *Sufficient Answer:* Evidence of feasible alternatives presented by applicant or known to the panel, considering cost *only* if it makes the project genuinely unviable (not merely less profitable).
      *   *Yes:* **REFUSE (with advice to resubmit modified proposal).** *(Rationale: Harm avoidable.)*
      *   *No:* Proceed to Q5. *(Rationale: Harm deemed unavoidable for viable project.)*

  5.  **NECESSITY & BENEFIT: Is the unavoidable harm justified by either:**
      *   **a) Overriding Necessity:** Essential repair to prevent significant further deterioration/loss (beyond Q1), OR
      *   **b) Overwhelming Public Benefit:** A benefit demonstrably outweighing the heritage loss *and* unachievable without causing *this specific harm*?
      *   *Sufficient Answer:* For (a): Detailed condition survey showing necessity. For (b): Robust evidence of significant public benefit (e.g., enabling vital community use, major carbon reduction) and proof no less harmful alternative exists.
      *   *No:* **REFUSE.** *(Rationale: Unavoidable harm not justified.)*
      *   *Yes:* Proceed to Q6.

  6.  **CUMULATIVE IMPACT (LEDGER): Consult the MAS Tier.**
      *   *Tier 1 (95-100%):* Proceed to Q7.
      *   *Tier 2 (80-94%):* Proceed to Q7. Scrutinise harm more strictly.
      *   *Tier 3 (60-79%):* **Proceed to Q8.** (Presumption against further significant loss).
      *   *Tier 4 (<60%):* **Proceed to Q8.** (Strong presumption against further loss; focus shifts to preserving remaining fabric & overall form).

  7.  **MINIMAL HARM: Is the unavoidable harm to significant fabric demonstrably very minor (e.g., affecting non-significant areas, extremely small scale, using the least harmful method)?**
      *   *Sufficient Answer:* Quantifiable assessment (e.g., % loss, specific low-significance area).
      *   *Yes:* **APPROVE (with conditions enforcing harm mitigation).** Update MAS. *(Rationale: Minor unavoidable harm justified by necessity/benefit, cumulative impact low.)*
      *   *No:* **Proceed to Q8.**

  8.  **VALUE JUDGMENT / OBJECT OF PROTECTION CONFLICT: Does the justification for the harm (from Q5) rely primarily on preserving an aspect *other* than material fabric authenticity (e.g., form/geometry, continuity of use, setting contribution) AND is that aspect a *designated* part of the building's significance?**
      *   *Sufficient Answer:* Application materials or designation record explicitly prioritises non-fabric significance relevant to the harm.
      *   *No:* **REFUSE.** *(Rationale: Unavoidable harm to primary protected interest (fabric) not outweighed within cumulative impact context.)*
      *   *Yes:* **VOTE by Panel.** (Vote Question: "Does the benefit to [Specific Non-Fabric Significance, e.g., Continuity of Worship, Silhouette] demonstrably outweigh the harm to material authenticity *and* justify the loss given the current MAS Tier?")
          *   *Vote Yes:* **APPROVE (with conditions).** Update MAS. *(Rationale: Panel determines benefit to designated non-fabric significance outweighs fabric harm within cumulative context.)*
          *   *Vote No:* **REFUSE.** *(Rationale: Panel determines benefit does not outweigh harm to designated interests.)*

  ---

  **Application to Cases:**

  1.  **18th-C Farmhouse (Cement Mortar)**
      *   Q1: No (Not imminent failure).
      *   Q2: **YES** (Hard cement alters fabric physically/manages moisture poorly, damaging stone long-term).
      *   Q4: **YES** (Lime mortar alternative exists).
      *   **VERDICT: REFUSE (Resubmit with lime).** *Rationale: Unavoidable harm (cement) exists; harm is avoidable via lime mortar; cost is owner's burden, not justification for harm to significant fabric. MAS unchanged.*

  2.  **Timber Hall (45% Replacement)**
      *   *Assume MAS Tier 3 (60-79%) - e.g., started at 100%, dropped to 55% after 45% replacement.*
      *   Q1: No.
      *   Q2: **YES** (Loss of original timber fabric).
      *   Q4: **NO** (Replacement necessary for structural integrity/decay; minimal harm methods used but fabric loss unavoidable).
      *   Q5: **YES** (Necessity: Prevent structural failure/decay).
      *   Q6: **Tier 3 (60-79%) → Q8.**
      *   Q8: **NO** (Justification is necessity to preserve structure/fabric *itself*, not primarily a non-fabric value. New timber preserves geometry/craft *appearance*, but the *authentic* craft is lost).
      *   **VERDICT: REFUSE.** *Rationale: Unavoidable loss of significant original fabric; while necessary for preservation, cumulative loss (Tier 3) is now too high to permit further erosion of material authenticity. Further repairs must focus on stabilizing remaining original fabric non-invasively where possible. MAS not updated (no further loss approved).* ***(This verdict runs counter to typical panel expectations - it halts previously approved piecemeal replacement due to cumulative impact, forcing a new approach).***

  3.  **Burnt Chapel (Steel/Stone Clad Rebuild)**
      *   *Assume MAS effectively 0% (gutted by fire). Tier 4 (<60%).*
      *   Q1: **YES** (Catastrophic loss - proceed to Q5).
      *   Q5: **YES** (Overriding Necessity: Rebuild to prevent total loss AND Overwhelming Public Benefit: Continuity of worship/silhouette).
      *   Q6: **Tier 4 (<60%) → Q8.**
      *   Q8: **YES** (Justification relies primarily on preserving Form/Silhouette and Use, not material authenticity).
      *   **VOTE:** Panel votes on whether benefit to Form/Use outweighs loss of material authenticity (already near-total) and justifies this specific method.
          *   *Potential APPROVE (Conditional):* If Vote Yes. *(Rationale: Panel determines significance lies primarily in form/use; reconstruction preserves this core significance given near-total fabric loss already. MAS remains <60% - form is now primary).*
          *   *Potential REFUSE:* If Vote No. *(Rationale: Panel determines material authenticity remains paramount significance; reconstruction as proposed destroys any remaining fabric evidence and creates replica, not genuine heritage).*

  4.  **Reversible Glazing/Panels (Conservation Area)**
      *   *Treat each application individually, but track *Character Impact Score* for the area (similar concept to MAS, but for visible character).*
      *   Q1: No.
      *   Q2: **NO** (Concealed, fully reversible - no harm to fabric).
      *   Q3: **YES** (Fully reversible & compatible).
      *   **VERDICT: APPROVE (Conditional on reversibility/compatibility).** *Rationale: No harm to significant fabric, fully reversible.*
      *   **Cumulative Character Impact:** After a decade, the *Character Impact Score* (measuring subtle shifts in roofscape reflectivity, window appearance depth etc.) reaches Tier 3 (Moderate Change). A *new* application:
          *   Q1/Q2/Q3: Still technically APPROVE.
          *   **BUT:** Panel must consider Q8 *for the area*: Does approving *this* installation, pushing the aggregate character change further, harm the *designated character of the conservation area*?
          *   **VOTE:** "Does the benefit of this specific installation outweigh the incremental harm to the designated character of the conservation area, given the cumulative impact is already Moderate?"
              *   *Vote Yes:* APPROVE (Update Area Character Score).
              *   *Vote No:* REFUSE. *(Rationale: Incremental impact, while reversible and non-harmful to individual fabric, cumulatively erodes the designated character of the area beyond acceptable level).*

  ---

  **Candid Limits & Residual Arbitrariness:**

  1.  **Judgment Relocation:** The procedure doesn't eliminate judgment; it structures and exposes it at specific points:
      *   **Q2 (Material Harm):** Defining "significant" fabric and "minor" wear is subjective.
      *   **Q4 (Minimise Harm):** Assessing "viability/unpracticality" involves economic/social judgment.
      *   **Q5 (Necessity/Benefit):** Weighing "overriding" necessity or "overwhelming" public benefit is inherently value-laden.
      *   **MAS % Estimates:** Assigning % loss involves professional judgment (e.g., how much does one replaced beam matter?).
      *   **Q8 / Vote:** The core value conflict is explicitly handed to the panel's collective judgment.
      *   **Baseline Definition:** Choosing the *designation state* as baseline involves interpreting historical significance at a fixed point.

  2.  **Residual Arbitrariness Ends Up:**
      *   **In the initial MAS/Baseline setup:** Defining what constituted "100%" authenticity at designation involves interpretation.
      *   **In the MAS Tier thresholds (95/80/60%):** These are necessarily somewhat arbitrary lines, though defended by administrative need and the concept of "material change in state" (Tier 3 = "Moderate Loss").
      *   **In the Vote (Q8):** The final weighting of competing values (fabric vs. form/use/setting) is unavoidably subjective and rests with the panel's discretion, constrained only by precedent and the requirement for explicit reasoning.

  3.  **What it Cannot Do:**
      *   **Eliminate Value Conflicts:** It makes them explicit (via Q8/Vote) but doesn't resolve them philosophically.
      *   **Define "Significance" Objectively:** The procedure relies on the existing designation record and panel expertise.
      *   **Solve Funding Issues:** It can't make lime mortar affordable; it can only require it or refuse harmful alternatives (Case 1).
      *   **Predict Future Technology:** "Reversibility" and "minimal harm" are judged by current standards.
      *   **Prevent All Cumulative Change:** It slows it down significantly via MAS Tiers and forces hard stops (Case 2), but reversible changes (Case 4) can still accumulate character impact, requiring a separate tracking mechanism and value judgment.
      *   **Guarantee Appeal Success:** It provides a clear, structured rationale based on stated principles, making the decision *defensible* (showing consistency, consideration of key factors, explicit reasoning), but cannot prevent disagreement with the outcome or the underlying values.

  This procedure provides a robust, transparent, and auditable framework. It confronts the core problem of cumulative loss head-on with the MAS ledger and tiers. It forces explicit consideration of alternatives, necessity, and conflicting values, while providing clear off-ramps for Approvals (no harm/reversible) and Refusals (avoidable harm, unjustified harm). The residual arbitrariness is concentrated in the value-laden Vote (Q8) and the initial setup of MAS/Baseline, which are unavoidable aspects of conservation decision-making but now made transparent and accountable.
