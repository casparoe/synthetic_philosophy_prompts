answer: |-
  Below is a concise decision tree designed to sort students into distinct schools of thought in the philosophy of mathematics, based on their responses to **concrete mathematical scenarios**. Each node presents a specific situation (not slogans or direct questions about excluded middle), and leaves correspond to major positions. The tree fits on two sides for easy handout.

  ---

  ### **Decision Tree: Sorting Mathematical Philosophies**

  **Instructions:** Start at Q1. Answer each question based on your mathematical convictions. Follow the arrows to the next node or a leaf (final position).

  1. **Q1: Non-computable reals**  
     Consider a real number defined by diagonalizing against all Turing-computable sequences of rationals (with computable modulus of convergence). Do you accept that such a real number *exists*?  
     - **Yes** → **Classical Platonism** (Leaf A)  
     - **No** → Q2  

  2. **Q2: Halting of "absolutely non-halting" machines**  
     Suppose a Turing machine `M` is proven *never* to halt (e.g., it searches for a contradiction in PA and is coded so that non-halting is provable). Does this mean `M` *does not halt*?  
     - **Yes** → **Markov’s School** (Russian Constructivism) (Leaf B)  
     - **No** → Q3  

  3. **Q3: Free choice sequences**  
     Can one define a real number via an infinite sequence of arbitrary choices (e.g., a sequence where each term is freely chosen from {0, 1}), even if no law governs the choices?  
     - **Yes** → Q4  
     - **No** → Q5  

  4. **Q4: Continuity of functions on sequences**  
     Must every function from the set of all infinite binary sequences to ℕ depend only on a finite initial segment of its input? (i.e., is every such function continuous?)  
     - **Yes** → **Brouwer’s Intuitionism** (Leaf C)  
     - **No** → *Empty: Unexplored* (Cell X)  

  5. **Q5: Truth value of independent statements**  
     Let `M` be a Turing machine that enumerates proofs in ZFC and halts upon finding a contradiction. We know (via Gödel) that if ZFC is consistent, ZFC cannot prove "`M` does not halt." Do you believe "`M` does not halt" is *true*?  
     - **Yes** → **Bishop-Style Constructivism** (Leaf D)  
     - **No** → **Dummettian Semantic Anti-Realism** (Leaf E)  

  ---

  ### **Leaves (Positions)**  
  - **Leaf A: Classical Platonism**  
    Mathematical objects exist independently; non-constructive existence (e.g., non-computable reals) is valid.  
  - **Leaf B: Markov’s School**  
    Computability is central; non-halting proofs entail actual non-halting; reject free choice sequences.  
  - **Leaf C: Brouwer’s Intuitionism**  
    Mathematics is mind-dependent; free choice sequences and continuity are fundamental; truth requires construction.  
  - **Leaf D: Bishop-Style Constructivism**  
    Neutral on metaphysics; mathematics should be algorithmically rigorous but compatible with classical logic.  
  - **Leaf E: Dummettian Semantic Anti-Realism**  
    Truth is constrained by provability; undecidable statements lack truth values until resolved.  

  ---

  ### **Empty Cells & Unseparated Pairs**  
  - **Cell X (Q4 → "No")**: *Unexplored*. Accepting free choice sequences but denying continuity is coherent but lacks a developed school (likely unattractive due to tension with intuitionistic principles).  
  - **Unseparated Pair**: **Bishop-Style (D)** and **Dummettian Anti-Realism (E)** are only distinguished by Q5 (a meta-mathematical stance). The tree cannot separate them using purely *mathematical* (non-philosophical) scenarios.  

  ---

  ### **Notes for the Seminar**  
  - **Why this works**: Nodes focus on mathematically precise cases (e.g., computability, halting, continuity), avoiding vague "isms." Students won’t know where answers lead.  
  - **Key omissions**: Finitism (rejects actual infinity) isn’t covered; add a pre-Q1 node if needed:  
    **Q0: Actual Infinity**: Do you accept the set ℕ as a completed totality?  
    - **No** → **Finitism** (Leaf F)  
    - **Yes** → Q1  
  - **Why no excluded middle?** Students *claim* to agree on it but interpret it differently in practice. Concrete cases reveal this.  

  --- 

  **Printing**: This tree fits on two pages (one for nodes, one for leaves/notes). Use it to spark debate: "Which leaf are you? Defend your path!"
