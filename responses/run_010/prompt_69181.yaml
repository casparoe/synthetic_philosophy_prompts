prompt: |-
  Development editor at a small university press, mostly history list — Atlantic slavery, empire, labour, gender. Two or three flagged passages a week come to me and the complaints runs in opposite directions on the same book: one reader says the author is judging 1780s people by 2025 standards, another says the author has laundered the atrocity with passive voice and euphemism. I can't send everything out to a specialist and I can't just side with whoever writes the angrier letter.

  Write me a procedure I can run on a flagged paragraph in about fifteen minutes: questions in order, what counts as a sufficient answer to each, what edit follows from each finding, and the points where it stops being mine to decide and goes back to the author or to acquisitions because it's values rather than text. Ground it in what the historiography argument about presentism actually gives you, not in vibes. Two things I especially want kept apart, because readers never keep them apart: applying a concept the actors didn't have, blaming them for something they couldn't have known, and erasing the agency of the people it was done to. And it has to handle the 'that was simply the standard of their time' defence, which I'm fairly sure smuggles in a fake consensus, since there were contemporaries objecting to almost all of it — so tell me what evidence in the paragraph would settle whether the objection was available and thinkable.

  Then run it on three paragraphs you make up that sound like what lands on my desk, and let at least one verdict be one I won't like. Finish with where the procedure will misfire and any two of its own criteria that pull against each other.
reasoning: |-
  Okay, let me tackle this development editor's complex request. They're dealing with heated debates about historical interpretation in their history manuscripts - specifically around Atlantic slavery, empire, labor and gender. The core tension is between presentism accusations and atrocity-laundering claims, with readers attacking the same book from opposite directions. 

  First, I need to unpack the underlying issues. Presentism debates in historiography aren't just about "judging past people" - they involve three distinct problems: applying anachronistic concepts, blaming for unavailable knowledge, and erasing victim agency. The editor wants concrete tools to separate these. The "standards of their time" defense needs special handling too - since historical consensus was often contested.

  The procedure must be actionable in 15 minutes per flagged passage. I'm envisioning a decision tree with clear exit points: green for editor-resolved, yellow for author consultation, red for acquisitions escalation. Each step needs diagnostic questions, evidence thresholds, and prescribed edits.

  Key design challenges:
  - Balancing textual analysis with historical contextualization
  - Creating guardrails against both anachronism and whitewashing
  - Operationalizing contested concepts like "available objections"
  - Handling cases where textual fixes won't solve ideological disagreements

  For the examples, I'll craft three representative paragraphs: one resolvable through editing (agency restoration), one requiring author input (anachronism concerns), and one needing acquisitions escalation (values conflict over reparations framing). The last one should make the editor uncomfortable - that's the point.

  The misfire section should warn about limitations: when context exceeds the paragraph, when terminology debates mask deeper disagreements, and when the 15-minute constraint forces oversimplification. The tension between conceptual clarity and historical nuance deserves special mention - sometimes these goals conflict.

  Throughout, I'll anchor in historiography methods: Skinner's contextualism for concept availability, Trouillot's power analysis for agency, and Bloch's warning against "the idol of origins" for period standards. The goal isn't neutrality but methodological rigor.
answer: |-
  Here’s a grounded, step-by-step procedure for evaluating flagged passages (15 min max), followed by examples and limitations. It prioritizes **historiographical rigor** over "vibes," separates **concept application**, **blame attribution**, and **agency erasure**, and critically assesses the "standard of the time" defense.

  ---

  ### **Procedure: Evaluating Historicity & Framing**
  **Time Budget:** 2-3 min per step. Stop if escalation is needed.

  1.  **Identify the Complaint(s): (1 min)**
      *   *Question:* What *specific phrases* trigger complaints of "presentism" or "laundering"? What *specific alternatives* do critics propose?
      *   *Sufficient Answer:* Clear pinpointing of problematic words/sentences (e.g., "calls planters 'psychopaths'", "uses 'workers' for enslaved people", "avoids the term 'rape'", "implies everyone accepted slavery").
      *   *Next Step:* Proceed to Step 2. If complaints are too vague, flag for author clarification.

  2.  **Diagnose the Core Issue: Separate the Strands (2 min)**
      *   *Questions:*
          *   **A. Concept Application:** Does the text use a *term/concept* (e.g., "genocide," "trauma," "wage theft," "human rights") unavailable/unthinkable to historical actors? (Focus on lexicon/framework, *not* morality).
          *   **B. Blame Attribution:** Does the text *explicitly assign fault/moral failing* to actors for actions *they could not have understood* as wrong by *any* accessible contemporary standard? (Focus on *knowledge*).
          *   **C. Agency Erasure:** Does the text use passive voice, euphemism, or abstraction that removes *the victim's experience* or *the perpetrator's deliberate action*? (e.g., "slaves were sold" vs. "enslavers sold people," "relationships occurred" vs. "enslavers raped").
      *   *Sufficient Answer:* Clear "yes/no" to each A, B, C based *only* on the paragraph's text. Avoid interpreting authorial intent.
      *   *Next Step:*
          *   If **C (Agency Erasure)** is primary, proceed to Step 3.
          *   If **A (Concept Application)** or **B (Blame Attribution)** is primary, proceed to Step 4.
          *   If mixed, prioritize the most severe issue.

  3.  **Address Agency Erasure (Textual Fix - 3 min)**
      *   *Question:* Can the action be restated with *active voice* and *concrete nouns/verbs* while remaining historically accurate? Who did what to whom?
      *   *Sufficient Answer:* A direct rewrite is possible using precise terminology (e.g., "enslavers," "colonizers," "raped," "tortured," "stole land," "suppressed revolt") without adding new interpretation.
      *   *Edit:* Implement the rewrite. Ensure victims are agents where possible (e.g., "resisted," "fled," "maintained cultures").
      *   *Stop Here:* If rewrite resolves the complaint (e.g., replacing passive euphemism with active precision).

  4.  **Assess Anachronism (Concept/Blame) & "Standard of Time" (5 min)**
      *   *Questions:*
          *   **For A (Concept):** Does the paragraph *itself* provide **evidence** that a *cognate idea* (not the exact modern term) existed or was debated *in that specific context*? (e.g., critiques of slavery's brutality, discussions of consent, ideas of natural rights/injustice applicable to victims). If *not*, is the concept used *analytically* by the author (clearly flagged as such)? Or is it presented as the *actor's* frame?
          *   **For B (Blame):** Does the paragraph provide **evidence** of *contemporary objections, resistance, or alternative ethical frameworks* available to the actors? (Crucial for dismantling "standard of time"). Look for: mentions of dissenting groups, laws suppressing dissent, victim testimonies, philosophical/religious debates cited *in the period*.
      *   *Sufficient Answer (Settles "Available Objection"):**
          *   **YES (Objection Available):** Text cites period sources: dissenting pamphlets, sermons, court records, slave narratives, rebel manifestos, opposing philosophers, laws *against* dissent (proving it existed).
          *   **NO (Objection Unavailable/Unmentioned):** Text states or implies universal acceptance OR provides no evidence of contemporaneous critique/dissent *within the relevant sphere* (e.g., planter ideology dominates text; no mention of abolitionists or slave resistance).
          *   **ANALYTICAL USE:** Author explicitly frames the modern concept *as their own analysis* (e.g., "We can now understand this as systematic racism...").
      *   *Next Step:*
          *   If **YES (Objection Available)** or **ANALYTICAL USE (Clearly Framed)**: Proceed to Step 5 (Tone Check). Blame (B) *can* be attributed if evidence shows critique was accessible.
          *   If **NO (Objection Unavailable/Unmentioned)**: Escalate to Author (Yellow Flag). Text either makes an unsupported claim about universal standards *or* anachronistically assigns blame/frames actions without justification. Author must provide evidence or reframe.
          *   If **B (Blame)** is asserted with **NO** evidence of available objection, it's *likely* presentist blame. Escalate to Author (Yellow Flag).

  5.  **Tone & Framing Check (2 min)**
      *   *Question:* Does the language (even if historically grounded or analytically framed) veer into *inflammatory judgment* ("monstrous," "evil," "stupid") or *clinical detachment* that minimizes horror? Does it imply *inevitability*?
      *   *Sufficient Answer:* Judgment based on word choice and implication within the paragraph.
      *   *Edit/Decision:*
          *   Inflammatory: Replace judgments with factual descriptions of actions/consequences supported by evidence. (e.g., "brutal torture" instead of "evil torture").
          *   Detached/Teleological: Strengthen active voice, specify perpetrators/victims, add qualifier like "though some contemporaries objected..." if Step 4 supports it.
          *   If tone seems central to author's *argument* (not just phrasing), Escalate to Author/Acquisitions (Yellow/Red Flag - Values/Interpretation).
      *   *Stop Here:* If edits resolve tone issues while preserving historical accuracy and argument.

  6.  **Escalation Points:**
      *   **To Author (Yellow Flag):** Unsupported claims about period consensus/lack thereof (Step 4 unresolved); ambiguous analytical framing (Step 4); need for significant reframing of core argument in the passage; ambiguity in separating A/B/C.
      *   **To Acquisitions (Red Flag - Values):** Fundamental disagreement about whether *applying a modern ethical judgment is ever valid* in historical scholarship; disputes over the legitimacy of victim-centered perspectives; author refuses evidence-based revisions on core framing; passage reveals a deep misalignment with press's scholarly values/positioning.

  ---

  ### **Example Paragraphs & Verdicts**

  **Paragraph 1 (Agency Erasure)**
  > "The transatlantic slave trade resulted in the involuntary relocation of millions of Africans. Labor was extracted on plantations under difficult conditions. Relationships between enslaved women and plantation owners were complex and sometimes involved affection, though power imbalances existed."
  *   **Complaint 1 (Laundering):** Euphemistic ("involuntary relocation," "labor extracted," "difficult conditions," "relationships," "affection," "power imbalances" erase violence/agency).
  *   **Complaint 2 (Presentism?):** None directly, but implied by downplaying.
  *   **Procedure:**
      1.  Complaints clear: Laundering via euphemism/passive voice.
      2.  **C (Agency Erasure): YES** (Primary). A/B: Not primary.
      3.  **Rewrite:** "European and American slave traders forcibly abducted and transported millions of Africans across the Atlantic. Enslavers brutally exploited enslaved people's labor on plantations through torture, starvation, and terror. Enslavers raped enslaved women, who had no legal or physical recourse; assertions of 'affection' obscure this pervasive sexual violence." (3 min - **STOP, Resolved**).

  **Paragraph 2 (Concept Application & "Standard of Time")**
  > "Eighteenth-century British merchants displayed a profound psychological dissociation characteristic of modern sociopathy. They compartmentalized their participation in the slave trade from their self-image as pious Christians and respectable businessmen, showing no capacity for empathy towards Africans they commodified."
  *   **Complaint 1 (Presentism):** Using "sociopathy," "psychological dissociation," "empathy" anachronistically; judging by modern psychology.
  *   **Complaint 2 (Laundering?):** None directly.
  *   **Procedure:**
      1.  Complaints clear: Presentism via modern psychological concepts.
      2.  **A (Concept Application): YES** (Primary - "sociopathy," "dissociation," "empathy" as actor traits). B: Potentially implied blame via "sociopathy". C: Not primary.
      4.  **Assess Anachronism/Standard:** Paragraph provides **NO** evidence that 18th-century Britons understood or debated concepts like sociopathy, dissociation, or empathy in this modern psychological sense. Mentions piety/respectability but not *contemporary critiques* linking piety to hypocrisy over slavery.
      *   *Verdict:* **Escalate to Author (Yellow Flag)**. Author must either:
          *   Provide evidence of contemporaneous critiques using *cognate* concepts (e.g., sermons on hypocrisy, conscience, moral corruption).
          *   Reframe explicitly as *their own* analytical application ("We can analyze this behavior through a modern lens as exhibiting traits akin to...") and justify its necessity.
          *   Remove the anachronistic psychological labels and describe the *observed behavior* using period sources (e.g., "merchants defended the trade while professing piety, drawing criticism from some contemporaries like [Quaker pamphlet X] for moral inconsistency").

  **Paragraph 3 (Blame & Values Escalation - The Uncomfortable One)**
  > "While the brutality of slavery is undeniable, demanding reparations today based on historical crimes committed by long-dead actors according to their era's accepted norms is a futile exercise in presentist moralizing. The past cannot be judged by our enlightened standards, and no living person bears responsibility for actions they did not commit."
  *   **Complaint 1 (Laundering/Atrocity Denial):** Minimizes slavery ("brutality... undeniable" is weak); uses "accepted norms" uncritically; dismisses reparations as "presentist moralizing"; implies no moral connection/path forward.
  *   **Complaint 2 (Presentism?):** Accuses reparations advocates of presentism.
  *   **Procedure:**
      1.  Complaints clear: Laundering via "accepted norms," dismissal of accountability/reparations.
      2.  **B (Blame Attribution):** YES (Primary - Explicitly absolving descendants/society: "no living person bears responsibility"). **C (Agency):** YES ("crimes committed" is passive, obscures enslavers). **A (Concept):** Reparations is a modern concept, but author is *dismissing* its application, not applying it anachronistically to the past.
      4.  **Assess "Standard of Time":** Paragraph asserts "accepted norms" **without evidence**. It **ignores** contemporaneous objections (abolitionism, slave revolts). Its argument rests on the *philosophical/political* claim that present responsibility is impossible ("long-dead actors," "no living person bears responsibility") and that reparations are inherently "presentist."
      *   *Verdict:* **Escalate to Acquisitions (Red Flag - Values)**. This isn't a resolvable textual issue about historicity. It's a core *interpretive and values-based* argument about:
          *   The legitimacy of reparations discourse *within historical scholarship*.
          *   The author's framing of historical responsibility and its modern implications.
          *   Potential misalignment with a press focusing on slavery/empire/gender, where engagement with legacies of injustice is often central. Acquisitions must decide if this aligns with the press's mission and scholarly standards. A purely textual edit cannot resolve this without gutting the author's argument.

  ---

  ### **Where the Procedure Misfires & Internal Tensions**

  1.  **Misfires:**
      *   **Lack of Context:** A paragraph might accurately report a *contemporary perspective* that uses euphemism or asserts consensus (e.g., quoting a planter). The procedure might flag it for agency erasure or lack of dissent evidence. Requires checking if author is *endorsing* or *reporting* the view.
      *   **Nuanced Terminology Debates:** Disagreements over terms like "genocide" or "torture" applied to historical contexts can be deeply historiographical, not just presentist/laundering. The 15-min limit may force an oversimplified "analytical use" or "escalate" decision.
      *   **Implied Framing:** An author might avoid problematic terms but structure the narrative to imply inevitability, downplay resistance, or normalize perpetrator perspectives subtly. This requires holistic reading beyond single paragraphs.

  2.  **Internal Tensions:**
      *   **Conceptual Clarity vs. Historical Nuance (A vs. Step 4):** Rigorously separating "applying a concept" (A) can sometimes clash with the search for "cognate ideas" (Step 4). When is a period concept a close enough cognate to justify a modern term? (e.g., "property" vs. "chattel slavery"). This requires editorial judgment within the 15-min window.
      *   **Agency Restoration (C) vs. Avoiding Anachronistic Blame (B):** Strongly restoring agency to victims (e.g., "enslaved people resisted daily") is essential. However, carelessly assigning *specific modern motivations* or *psychological states* to them ("traumatized," "asserting their identity") without evidence risks a different kind of anachronism (B) or over-interpretation. The procedure pushes for concrete *actions* ("resisted," "fled," "preserved") as the safest path, but this can sometimes feel limiting.

  This procedure provides a structured, evidence-based approach grounded in historiographical principles. It forces explicit separation of key issues, rigorously challenges the "standard of the time" trope, and clearly defines escalation points when textual edits can't resolve underlying arguments about values or interpretation. It accepts that some conflicts are inherent in the work and must be managed, not solved, by the editor alone.
