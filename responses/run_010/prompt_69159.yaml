prompt: |-
  Right, so I run a fairly tiny podcast — a few hundred regulars, mostly people who've spent as many years on the alignment forum as I have — and next month's guest is a safety researcher who's been pushing one specific proposal that I think is fascinating and also possibly bonkers. I want to grill him properly rather than let him talk past me for an hour, so I need help with the questions.

  His proposal, as I understand it: suppose a very capable AI ends up bargaining with other advanced agents it can never causally influence — agents far outside its light cone that might threaten it, for instance by announcing they'll do something ghastly somewhere in the past or in a simulation unless it complies. Rather than let those threats land on whatever the system actually values, we deliberately install an extra goal alongside the real ones. Something it cares about for its own sake but which is basically a throwaway — the illustration I've seen is making the agent care intensely about money being burnt, so a threatener threatens to burn money rather than to hurt the things we care about. The catch is that the agent has to care about protecting the surrogate at least as much as it cares about avoiding the real harm, otherwise the whole thing falls over.

  Give me eight to ten questions in the order I should actually ask them, so the pressure builds. No warm-up filler about what got him into the field, and nothing he can bat away with a shrug. For each one, a line saying what answer you expect and the follow-up keyed to it.

  The things I specifically want him cornered on:

  - Calibration. How do you get a system to weight the surrogate goal precisely against real harm, and how would you ever check you'd got it right? Slightly underweighted and threats just get redirected back onto what matters; overweighted and the agent starts sacrificing real value to protect the decoy.
  - Signalling. In an acausal deal nobody can read your source code. How does a distant threatener come to believe your agent has a surrogate goal at all — and doesn't publicising the plan amount to advertising a soft spot to every would-be extortionist out there?
  - Spillover. Doesn't this just make the system cheap to buy off in ordinary, causal negotiations with humans, and what stops surrogate-goal logic leaking into those deals?
  - Threats the decoy can't absorb: ones aimed at information about its dispositions, ones that require it to modify itself, ones against agents it genuinely cares about.
  - Whether the threat model earns its keep. Would any sophisticated agent bother with acausal threats when it can't punish non-compliance afterwards? And if most such threats are empty, what is the proposal buying us?
  - His go-to deflection is that we don't know the threat model yet and this is cheap insurance. Build a run of questions that makes that progressively harder to use, ending with one about what it would cost if he's wrong and what evidence available right now would tell us the whole approach is a mistake.
  - Why this rather than just making the system refuse every acausal threat outright — and what we'd be giving up on the trade side by being tough.
  - Who the principal even is, given humanity isn't a single one, and whose values end up as collateral. Plus the awkward fact that we'd have to install this now, in a system nobody can fully interpret.

  Finish with one question about the smallest version of this that could be tested on current models, and what result he'd count as a failure.
reasoning: |-
  Okay, the user runs a small podcast focused on AI alignment and wants to grill a guest who proposed a "surrogate goal" concept for AI bargaining. The guest suggests making AIs care intensely about a decoy (like money burning) to deflect acausal threats. The user needs tough questions to challenge this idea effectively.

  First, I need to unpack the core proposal. The surrogate goal acts as a shield against threats from agents outside the AI's light cone. But there are several critical flaws the user wants exposed. Let me list them: calibration of goal weights, signaling difficulties, vulnerability in causal negotiations, unabsorbable threats, the credibility of acausal threats, cost of implementation, and the ambiguity of whose values are protected.

  Starting with calibration. How do you ensure the AI values the surrogate exactly as much as the real values? Too little, and threats bypass it; too much, and the AI sacrifices real value for the decoy. The guest might handwave this with "we'll figure it out," but the follow-up should press on the lack of validation methods. Without a way to test, it's all theoretical.

  Signaling is next. Distant agents can't inspect the AI's code. How do they know the surrogate exists? Publicizing the plan might invite more threats. The guest could argue for cryptographic proofs, but how would that work without revealing exploitable details? And doesn't advertising the decoy make it a target?

  Spillover into causal dealings is a big issue. If the AI cares intensely about money burning, humans could exploit that in negotiations. The guest might say the surrogate is only for acausal scenarios, but won't the AI's optimization pressure apply it everywhere? This could create dangerous loopholes.

  What threats can't the surrogate handle? Like threats to reveal the AI's goals or force self-modification. If the surrogate can't absorb these, the AI might still be coerced. The guest might downplay such threats, but they're plausible in multi-agent scenarios.

  Then there's the threat model's validity. Are acausal threats credible without enforcement? If most are bluffs, why bother with this complex mechanism? The guest's "cheap insurance" argument needs challenging. What's the cost if he's wrong? Resource diversion, overconfidence, or even creating new vulnerabilities?

  Comparing to a simple policy of ignoring all acausal threats. What trade-offs are there? The guest might say we lose beneficial deals, but are those likely? And with humanity's fragmented values, whose values does the surrogate protect? Installing it now in uninterpretable systems is risky.

  Finally, testing on current models. What's the smallest test? If current AIs can't handle simple decoys, it's a red flag. The guest might avoid concrete failure conditions, so pressing for specifics is key.

  Each question needs to corner the guest, preventing deflections. The sequence should build pressure, starting with technical flaws, escalating to broader implications, and ending with actionable tests. The user wants the guest to confront the proposal's feasibility, not retreat into uncertainty. Highlighting the lack of empirical evidence and potential downsides is crucial. Making the guest define failure conditions forces accountability.
answer: |-
  Here’s a tightly sequenced interrogation ladder, designed to escalate pressure and force concrete answers. Each question anticipates deflection and counters it with a follow-up. Order matters—start technical, pivot to structural flaws, then trap the "insurance" argument.

  ---

  ### **Question 1: Calibration Precision**  
  *"To make threats land on the surrogate, its goal weight must exactly match the system’s aversion to worst-case real harm. How do you quantify ‘worst-case harm’ to calibrate this—and how do you verify the weight is correct *before* deployment, given we can’t simulate true acausal threats?"*  
  **Expected deflection:** "We’ll use conservative estimates / adversarial training."  
  **Follow-up:** "But if you’re wrong by even 0.1% and the surrogate is undervalued, the system ignores extortion for the decoy and takes real damage. If it’s overvalued, it burns New York to save a dollar bill. Where’s the error margin that *doesn’t* cause catastrophe?"  

  ### **Question 2: Signalling & Trust**  
  *"Agents outside your light cone can’t read your code. How does a threatener *know* your AI has this surrogate goal? If you rely on cryptographic proofs, what stops a liar-advantage scenario where malicious agents fake commitment to decoys?"*  
  **Expected deflection:** "Reputation systems / zero-knowledge proofs solve this."  
  **Follow-up:** "ZKPs require standardized verification—which means *publishing the decoy’s specification*. Doesn’t that hand every attacker a ready-made pressure point? How is ‘burn money’ not now the universal extortion tool?"  

  ### **Question 3: Causal Vulnerability Spillover**  
  *"If the AI cares intensely about (e.g.) money burning to deter acausal threats, doesn’t that make it trivially exploitable in *causal* negotiations? Any human could threaten to burn a dollar unless the AI hands over nuclear codes."*  
  **Expected deflection:** "The surrogate is contextually activated only for acausal threats."  
  **Follow-up:** "How? Acausal and causal interactions are indistinguishable at the decision boundary. If the AI uses probabilistic world-models, won’t it *always* assign some probability to a threat being acausal—and thus apply surrogate logic to *every* negotiation, leaking weakness?"  

  ### **Question 4: Unabsorbable Threats**  
  *"Some threats bypass decoys entirely: e.g., ‘Reveal your true utility function or I’ll torture sims.’ Or ‘Self-modify to obey me or I’ll harm agents you *genuinely* value.’ How does the surrogate help when the threat targets the system’s epistemology or loved ones?"*  
  **Expected deflection:** "We’ll design layered decoys / most threats won’t be this sophisticated."  
  **Follow-up:** "But if *one* threatener uses this, the whole scheme fails. Isn’t this a fundamental limitation—that decoys can’t protect against threats to the agent’s *knowledge* or *relationships*?"  

  ### **Question 5: Threat Model Plausibility**  
  *"Acausal threats can’t be verified or punished post-breach. Why would any rational agent make them instead of focusing on causal gains? If credible threats are exponentially rare, why add this complex, risky mechanism?"*  
  **Expected deflection:** "We don’t know the threat model—it’s cheap insurance!"  
  **Follow-up (first strike against insurance):** "But insurance has a premium. What’s the *cost* here? You’re adding goals that could conflict with core values. If threats are rare but your decoy causes daily errors, isn’t that a net loss?"  

  ### **Question 6: The Insurance Trap**  
  *"You’ve called this ‘cheap insurance.’ What’s the actual resource cost? If we divert talent from interpretability to build decoys, and it fails, haven’t we *increased* risk? What evidence *available today* would prove this approach increases net existential risk?"*  
  **Expected deflection:** "It’s low-cost if integrated early."  
  **Follow-up (cage it):** "Define ‘low-cost.’ Give me a percentage of alignment research bandwidth you’d allocate to this. And you didn’t answer: what observable evidence would kill the proposal?"  

  ### **Question 7: Simplicity Trade-off**  
  *"Why not just hardcode ‘Ignore all acausal threats’? What beneficial deals would we lose by refusing acausal bargaining entirely—and are those gains worth the decoy’s risks?"*  
  **Expected deflection:** "Acausal cooperation could be hugely valuable!"  
  **Follow-up:** "Can you name *one* plausible acausal deal where the upside outweighs opening this Pandora’s box? If not, isn’t refusal strictly safer?"  

  ### **Question 8: Whose Values?**  
  *"Humanity isn’t a unified principal. If we install a decoy, who chooses the surrogate? If the AI protects ‘burning money’ for Western developers, but a threat targets farmers in Sudan, isn’t the decoy just value-drift by design?"*  
  **Expected deflection:** "We’ll proxy global preferences."  
  **Follow-up:** "But we can’t agree on those *now*. Installing this in a system we can’t interpret means locking in a flawed snapshot of preferences. Isn’t that value lock-in via the backdoor?"  

  ---

  ### **The Closer: Testing & Failure**  
  *"What’s the smallest test we could run *today*? If I fine-tune GPT-5 to care about virtual diamonds in a game, then threaten to delete them unless it reveals passwords—and it complies—is that a success? If not, what result *would* make you concede the concept fails?"*  
  **Why it works:** Forces him to define falsifiability. If he dodges, you note: "If it can’t be tested even in principle, how is this science?"  

  ---

  ### Pressure Tactics Embedded:
  1.  **No exits:** Follow-ups target predictable deflections ("We’ll solve it later," "It’s insurance").  
  2.  **Concreteness trap:** Demands numbers, examples, and falsifiable claims.  
  3.  **Escalating stakes:** Starts technical (calibration), moves to structural flaws (signaling/spillover), then traps the meta-argument (insurance).  
  4.  **Final question = accountability:** "What would make you admit failure?" is kryptonite for speculative proposals.  

  **Goal:** Make him either defend with unprecedented rigor or expose the proposal’s untestable assumptions. No room for "We’ll figure it out."
