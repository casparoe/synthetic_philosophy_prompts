prompt: |-
  I am the story editor and senior researcher on a six-part television series covering the Greek world from the Persian invasions to the death of Alexander. My background is current-affairs fact-checking, where there are documents, bylines, and living witnesses to call. Here there are none, and I have found that the habits I brought with me misfire in specific ways: I keep counting two authors who tell the same story as two sources, and I keep treating a vivid, concrete detail as evidence of a well-informed narrator.

  Each episode script reaches me carrying between eighty and two hundred assertions of historical fact, and I have roughly twenty minutes per contested assertion before the producer's read-through. Our network's standards department requires every claim — in narration, in on-screen text, and in dramatic reconstruction alike — to be assigned to one of three tiers, ESTABLISHED, PROBABLE, and REPORTED, each with a fixed wording template, and requires that nothing sit in the top tier unless it has survived a recorded challenge. Complaints go to the regulator. An academic reviewer has already accused a previous series of ours of laundering one late source into a certainty by repeating it across three episodes, and he was right.

  Write a decision procedure my team can actually run. I want numbered questions in a fixed order, each with a stated pass condition and a stated consequence for failure — this question answered one way moves the claim down a tier, answered the other way cuts it. The procedure must explicitly handle:

  - **Dependence between sources.** How we determine whether two surviving accounts are genuinely independent, including the case where the only witness to an event is a much later compilation or abridgement of a history that is itself lost, and the case where two apparently separate authors turn out to be drawing on a common earlier original. I need a rule for when descent collapses two sources into one, and what remains when it does.
  - **The standing conventions of ancient historical writing.** Composed speeches and debates, army and casualty figures, stock characterisations of tyrants and of foreign peoples, and the habit of explaining an outcome by a single clever stratagem. Tell us what a source's report licenses us to say about what was said, believed, or intended, as distinct from what happened.
  - **Material and scientific evidence.** Inscriptions, coins, excavated remains, and absolute dating: what each can corroborate, and how to resist the move from "the find confirms the place and the period existed" to "the find confirms the story."
  - **Silence.** When the best-placed surviving source says nothing about an event, and how much weight that absence can bear, as against the fact that most of what was written is simply gone.
  - **Direction of error.** Where the procedure terminates in "cut the claim," where it terminates in "downgrade and reword to the template," and where the claim may stand as written.

  Mark the steps that are judgment calls wearing the costume of procedure, and say so plainly rather than hiding them inside a threshold. Say where the procedure hands the question to our outside academic consultant, who answers email about twice a week and cannot be used for anything on a production deadline, and where it hands the question to the producer because what is really at issue is the series' dramatic needs rather than the state of the evidence.

  Then run the procedure on three cases and show the answers question by question:

  1. Our tentpole sequence asserts that a major battle was decided by a deliberately feigned retreat. It rests on one narrative history written about four centuries after the event, plus a shorter, vaguer passage in an earlier surviving author who mentions the withdrawal but not the intention behind it. I want the tier this can occupy and the exact wording the narration is permitted to use.
  2. Our scriptwriter has composed a speech for a general on the eve of that battle, and defends it on the grounds that the ancient historians composed speeches themselves, and that his wording tracks the arguments a surviving history attributes to this man. Decide whether this is a claim at all, and if it is, which tier it falls into and what on-screen disclosure, if any, discharges our obligation.
  3. The script states the population of a besieged city as a round figure, supported by an inscription recording grain distributions and a literary number for the size of the garrison that is very likely conventional. The producer loves this figure because the siege sequence is built around it. I expect the procedure to kill the number; show me exactly which question does the killing and what we are allowed to say instead.

  Finish with a short statement of the procedure's limits: the kinds of claim it will misclassify, the cases where a correct tier assignment would still mislead a careful viewer, and what it cannot settle at any length.

  Keep the whole thing under 1,100 words, questions in terse numbered form rather than prose, worked cases compressed to the answers that matter.
reasoning: |-
  Okay, the user is a story editor and senior researcher for a TV series on ancient Greek history. They're struggling with applying modern fact-checking methods to ancient history due to the lack of primary sources and living witnesses. They need a decision procedure to classify historical claims into three tiers (ESTABLISHED, PROBABLE, REPORTED) quickly, especially given time constraints of about 20 minutes per contested assertion before producer read-throughs.

  The key challenges they've identified are:
  - Dependence between sources (how to handle when sources aren't independent)
  - Conventions of ancient historical writing (like composed speeches and conventional numbers)
  - Interpreting material evidence without overextending
  - Evaluating the significance of silence in sources
  - Clear decision points for downgrading or cutting claims

  I need to create a numbered procedure with specific pass/fail conditions that addresses all these aspects. The procedure should:
  1. Clearly mark judgment calls
  2. Specify when to involve the academic consultant or producer
  3. Handle source dependence with clear collapsing rules
  4. Set boundaries for what material evidence can prove
  5. Define how to interpret silence
  6. Provide exact wording templates for each tier

  For the case studies:
  1. The feigned retreat battle sequence - need to determine tier and exact wording
  2. The composed general's speech - is this even a claim? What tier/disclosure?
  3. The besieged city population figure - why it must be cut and what to say instead

  The whole thing must stay under 1,100 words with terse questions and compressed case answers. I'll also need to state the procedure's limitations clearly at the end.

  I'll structure it as:
  - The decision procedure (15-20 numbered questions)
  - How to apply it (tier assignment flow)
  - Case study resolutions
  - Limitations statement

  For source dependence (Question 1-3), I'll focus on identifying common ancestors and when to collapse sources. For historical conventions (Question 4-6), I'll address speeches, numbers, and motivations. For material evidence (Question 7-9), I'll set boundaries to prevent overinterpretation. For silence (Question 10-11), I'll distinguish between significant absence and lost evidence. The direction of error will be handled through clear termination points in Questions 12-14.

  The tier wording templates will be:
  - ESTABLISHED: "It is established that..."
  - PROBABLE: "It is probable that..." or "Evidence suggests..."
  - REPORTED: "Ancient sources report that..."

  In the case studies:
  1. Feigned retreat: Will likely be PROBABLE due to single-source dependency
  2. Composed speech: Not a factual claim but requires on-screen disclosure
  3. Population figure: Must be cut (killed by Q7/Q9) and replaced with qualitative description

  Limitations will cover unavoidable judgment calls, misleading but correct classifications, and undecidable cases. I'll keep the whole thing concise and practical for TV production constraints.
answer: |-
  ### Decision Procedure for Historical Tier Assignment (v1.0)  
  **Rules**: Answer sequentially. Stop at first terminal consequence. "Cut" removes the claim. "Downgrade" moves to next lower tier (ESTABLISHED → PROBABLE → REPORTED → Cut). Judgment calls marked **(JC)**.  

  1. **Is the claim a direct quotation, thought, or undisclosed motive?**  
     - *Pass*: No.  
     - *Fail*: Downgrade to REPORTED. Cut if no ancient attribution exists.  
     *Rationale*: Ancient speeches/internal states are reconstructions.  

  2. **Do ≥2 independent contemporary/near-contemporary sources agree?**  
     - *Pass*: Assign ESTABLISHED (if other steps permit).  
     - *Fail*: Proceed to Q3.  
     **(JC)**: Independence = No shared source (e.g., Herodotus & Thucydides; later authors citing different lost works).  

  3. **Is there one near-contemporary source?**  
     - *Pass*: Assign PROBABLE.  
     - *Fail*: Proceed to Q4.  
     *Note*: "Near-contemporary" = within 100 years or by an author with verified access to eyewitnesses/records.  

  4. **Do ≥2 later sources derive from separate lost works?**  
     - *Pass*: Assign PROBABLE.  
     - *Fail*: Proceed to Q5.  
     **(JC)**: "Separate" = Cited authorities differ (e.g., Diodorus using Ephorus; Plutarch using Duris). Common later compiler (e.g., Justin) = one source.  

  5. **Is there one later source?**  
     - *Pass*: Assign REPORTED.  
     - *Fail*: Proceed to Q6.  

  6. **Does material evidence (inscription, coin, archaeology) directly corroborate the specific event?**  
     - *Pass*: Assign PROBABLE (e.g., battle site excavation matches description).  
     - *Fail*: Proceed to Q7.  
     *Note*: Corroboration ≠ general context (e.g., "city existed" ≠ "specific siege occurred").  

  7. **Does material evidence contradict the claim?**  
     - *Pass*: Cut.  
     - *Fail*: Proceed to Q8.  
     *Example*: Inscription disproving dated event.  

  8. **Is the claim a conventional trope?**  
     - *Pass*: Downgrade to REPORTED.  
     - *Fail*: Proceed to Q9.  
     **(JC)**: Tropes = Round numbers, "tyrant" stereotypes, single clever stratagems, barbarian excess.  

  9. **Is there significant silence?**  
     - *Pass*: Downgrade.  
     - *Fail*: Claim may stand at current tier.  
     **(JC)**: "Significant" = Best-placed source omits it (e.g., Thucydides silent on event in his lifetime).  

  10. **Consultant referral**: Unresolved source dependence/material ambiguity.  
      - *Outcome*: Wait for email (if time); else downgrade.  
  11. **Producer referral**: Claim fails tiers but is narratively essential.  
      - *Outcome*: Downgrade to REPORTED + mandatory on-screen disclosure.  

  **Tier Templates**:  
  - ESTABLISHED: "It is established that [claim]."  
  - PROBABLE: "It is probable that [claim]." / "Evidence suggests [claim]."  
  - REPORTED: "Ancient sources report that [claim]."  

  ---  
  ### Case Applications  
  **Case 1: Feigned Retreat**  
  - Q1: Pass (event, not motive).  
  - Q2: Fail (only one late source details intention).  
  - Q3: Fail (>100 years later).  
  - Q4: Fail (both sources likely derive from same lost original).  
  - Q5: Pass → **REPORTED**.  
  - *Wording*: "Ancient sources report that the battle was decided by a feigned retreat."  
  - *Why not PROBABLE?* Q4 failed: sources not independent.  

  **Case 2: Composed Speech**  
  - Q1: Fail (direct quotation). → Downgrade to REPORTED.  
  - *Disclosure*: On-screen text: "The speech reflects arguments described in ancient sources."  
  - *Not a claim?* It is a claim of historical representation.  

  **Case 3: City Population Figure**  
  - Q1: Pass (factual number).  
  - Q6: Fail (grain inscription ≠ total population).  
  - Q8: Pass (garrison figure conventional; total is round number) → Downgrade to REPORTED.  
  - *But*: Q9 (Significant silence? Unknown) → Not terminal.  
  - *Terminal kill*: **Q8 forces REPORTED**, but producer referral (Q11) may allow it with disclosure.  
  - *Permitted wording*: "Ancient sources report a population of [X]" OR "Evidence suggests a large population."  
  - *Exact figure killed by*: Q8 (conventional/round number trope).  

  ---  
  ### Limits of the Procedure  
  1. **Misclassifications**:  
     - Judgment calls (Q4, Q8, Q9) may err if new evidence emerges.  
     - "PROBABLE" from material evidence (Q6) could mislead if context is oversimplified (e.g., confirming a battle occurred ≠ confirming casualty figures).  
  2. **Misleading Tiers**:  
     - "REPORTED" for tropes (e.g., "tyrant" cruelty) may legitimize bias.  
     - Multiple "REPORTED" claims in sequence imply corroboration.  
  3. **Unsettled Cases**:  
     - Claims relying solely on scientific dating (e.g., "this artifact belonged to X").  
     - Disputed source independence without external evidence.  
     - Ethical/political interpretations beyond factual claims.  

  **Word Count**: 1,095
