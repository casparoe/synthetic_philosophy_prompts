prompt: |-
  so my labmate and I have been going in circles about pain asymbolia for like three weeks and it's starting to wreck our reading group. quick recap of the case as I understand it, since everything turns on it: patients with lesions around the posterior insula / parietal operculum who, when you pinch them or bring something hot near their hand, say yes that's pain, can localize it and describe its quality, but just don't seem to mind — no grimace, no withdrawal, sometimes they chat or even laugh, and in at least one reported case the patient let a cigarette burn down between her fingers without moving. They aren't globally flattened: fear and disgust look intact, they can tell you pain is supposed to be bad, they still classify the stimulus as painful. Then on one side you have the morphine and cingulotomy reports, which as far as I can tell amount to the pain still being present but distant, no longer bothering the person; and on the other side the chili-heads and deep-tissue-massage people who claim to enjoy the hurting, wounded soldiers who turn down analgesia, and people born without pain who end up with chewed-through tongues and fractures that never got noticed. I'm trying to write the intro to a proposal about weighing pain relief against other claims in priority setting, and I can't do it until I know what I'd even be asking a theory to do.

  The fight itself: my labmate thinks asymbolia shows the badness can be peeled clean off the experience, so what's left is neutral sensation and all the badness lives in the wanting-it-to-stop; I think that makes "unpleasant" empty and also doesn't explain why the asymbolic still calls it pain at all. Neither of us is willing to just declare the patient a misreporter. So before we read any more accounts of pain's badness, write me the desiderata — what any adequate theory of why pain is bad for the person who feels it has to deliver. The cases it must get right (asymbolia, the masochist, the sedated report, the congenitally painless, chronic pain where the badness seems to be less about any given moment of feeling and more about what it does to a life, infants and non-human animals), the distinctions it can't collapse (unpleasantness vs. the desire for it to stop vs. the judgment that this is bad for me vs. pain's being bad simpliciter; intensity vs. badness; pain vs. suffering; how-it-feels-bad vs. why-it's-bad-for-you), and the stuff it has to stay consistent with — that self-reports are neither incorrigible nor worthless, that pain seems to come in degrees that we compare, that it owes some account of why causing pain is normally wrong without making consensual masochism impossible, that it should say whether pain is special or just one member of a class of nasty experiences that also includes nausea and dyspnea and itch. For each requirement give the case or consideration behind it and what breaks if a theory ignores it. A table is fine for the list itself.

  Be honest about which of these are real constraints on any theory and which are just the house preferences of one camp — I suspect "the badness has to be in the phenomenology" is doing sneaky work somewhere, but I can't say where or why. Flag any subset you think can't be jointly satisfied given the evidence above; my bet is that requiring the asymbolic's sensation to be phenomenally identical to ordinary pain while also requiring badness to explain motivation is already inconsistent, but show me the actual pressure point and whether the empirical setup even licenses the identity assumption. Then tell me which single requirement knocks out the most candidates, and close with a short scorecard, three or four lines each, of the obvious contenders: badness intrinsic to the feeling, badness in the wanting-it-to-stop, badness as the experience representing bodily damage as bad, and badness as not in the experience at all but in what pain does to a person's projects. no citations or reading lists please, I've got a stack by the bed — and keep it concrete, I don't want requirements like "must be explanatorily adequate," I want the ones someone could actually fail.
reasoning: |-
