answer: |-
  ### The Granite Scales  
  Aris Thorne smoothed the edges of Mara Voss’s claim file, the fluorescent lights of the Compensation Bureau’s office humming like trapped insects. Outside, autumn rain streaked the high-rise windows, blurring the city into a watercolor of gray steel and sodium vapor. Mara sought restitution for catastrophic respiratory failure—triggered by toxic mold in her luxury apartment’s climate-control system. Her medical bills eclipsed two years of her teacher’s salary. The building’s developer had cut corners, burying flawed ventilation behind smart-home interfaces. An open-and-shut case of brute luck? Not quite.  

  Aris knew the Bureau’s algorithm demanded nuance. Brute luck: misfortunes beyond one’s control, like earthquakes or genetic illness. Option luck: losses from conscious gambles, like stock investments or recreational risks. Mara’s choice to live in the "Aura Tower"—marketed as a "pulmonary sanctuary" with hyper-filtered air—felt like the latter. But her file revealed deeper layers.  

  At age nine, Mara had lived in the shadow of the PetroNex chemical plant in Flintwood. A pipeline rupture—deemed brute luck by the Bureau years prior—had drenched her neighborhood in airborne polymers. She developed severe asthma, missed school, and watched her mother work double shifts at a hazmat cleanup firm just to afford inhalers. That childhood, Aris noted, birthed a "bio-security obsession": Mara only drank filtered water, avoided parks during pollen season, and paid 40% above market rate for Aura’s "impenetrable air locks." Her lease agreement included a clause waiving liability for "unforeseen system failures"—a gamble she’d accepted for perceived safety.  

  The Bureau’s protocol for such ambiguities was the Shadow Assessment. Aris initiated it. The system constructed an idealised "Shadow Mara": same age, income, and intellect, but raised in a mid-tier suburb with baseline air quality—no PetroNex trauma, no asthma. Shadow Mara valued proximity to work and cost efficiency. Facing identical housing options, she chose a renovated walk-up in the historic district—half the rent, older but certified asbestos-free ventilation. *No mold crisis.* The simulation concluded: real Mara’s loss stemmed from option luck. Her premium gamble on Aura Tower’s untested tech had backfired.  

  Aris’s cursor hovered over the "DENY" button. He visualized Mara’s deposition video: the way she’d flinched when recounting the PetroNex smell—"like burnt plastic and wet pennies." Her "choice" hadn’t been free; it was a ransom paid to childhood terror. Yet the Shadow was legally decisive. He denied the claim.  

  The fresh unfairness struck him weeks later. Mara emailed, pleading. She’d been evicted from her hospital recovery suite for non-payment and was now couch-surfing in a friend’s basement—a damp space triggering new attacks. Shadow Mara, insulated by her undamaged lungs and cheaper rent, would’ve bounced back. Real Mara, however, was *doubly* condemned: first by PetroNex, then by the Bureau’s refusal to see how that first theft of breath dictated the second. The system treated her trauma as a "preference," then punished her for its cost.  

  Aris reopened the file, searching for procedural loopholes. He paused at the Shadow Assessment’s calibration report. The simulation had defaulted to "standard urban risk-tolerance matrices" for Shadow Mara’s decision-making. But what if real Mara, without PetroNex, would’ve been *more* adventurous? A rock climber, say, or a wildfire journalist? The model assumed normalized caution, but didn’t brute luck’s absence sometimes breed greater daring? The Shadow’s choice was an average, not a destiny.  

  He drafted a memo to the Assessment Oversight Board, questioning the risk-tolerance parameters. Then he deleted it. Bureau Rule 14.7 forbade retroactive challenges without "material data errors." His hesitation wasn’t material; it was moral. Instead, he appended a Post-it note to the physical file—*Check Shadow weighting matrix for non-linear resilience thresholds (Ref: Case 4471-PetroNex legacy impacts?)*—and slid it into the archives. Rain tapped the window as he left. Above the city, the sky remained unresolved.  

