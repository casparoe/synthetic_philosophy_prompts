prompt: |-
  Hey, I'm in a distributive justice seminar and we did luck egalitarianism this week — Dworkin's brute luck / option luck split, plus the objection that early brute luck corrupts people's preferences so badly that their later "choices" were never really open options. I'd definately rather feel that objection than paraphrase it for my response paper, so could you write me a short story, like 900–1300 words?

  Here's the setup I have in mind: a public agency pays out when something goes wrong, but only after classifying the misfortune as brute luck (payable) or option luck (claimant's own gamble, reduced or denied). The protagonist is a competent, decent claims adjuster — not a strawman bureaucrat — who has to decide one specific claim. The wrinkle: the agency resolves hard cases with "shadow claimants," idealized reconstructions of the claimant run under full information, and the adjuster pays out based on what the shadow would have chosen. Give me a case where the claimant's loss flows from a preference that only her earlier bad luck could have produced, so the shadow diverges from her, and where using the shadow produces a fresh unfairness of its own. I want the story genuinely torn about where the line goes — no landing a thesis, no speechifying dialogue, third person limited on the adjuster, concrete procedural detail, and end on an unresolved paperwork detail rather than a moral.

  Then after the story give me a JSON object, exactly these fields: {"case_summary": one sentence, "brute_luck_elements": array of short phrases, "option_luck_elements": array of short phrases, "contamination_path": one sentence on how the earlier bad luck got inside the choice, "shadow_divergence": what the shadow would have chosen and why that's contested, "new_unfairness": one sentence, "unresolved_question": the thing the story refuses to settle}. Keep each value to a single clause apart from the arrays.
