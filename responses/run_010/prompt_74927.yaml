  - FAQ addressing likely student misconceptions

  The challenge is maintaining absolute bureaucratic seriousness while ensuring medievalists would recognize precise Thomist positions. For the uncomfortable ending, I'll frame inaction not as failure but as procedural outcome - "Remedial Pathway Inapplicable" with the chilling implication of indefinite endurance.

  Throughout, I'll avoid any anachronistic violence. The humor emerges from Thomist complexity forced into HR templates - like harm assessment requiring "documented comparative impact projections." By making the policy mechanically follow Aquinas' restrictions, it naturally disproves the "assassination manual" myth.
answer: |-
  **INTERNAL POLICY: REM-EX-007**  
  **REMOVAL OF A TYRANNICAL EXECUTIVE: EMPLOYEE GUIDANCE AND ESCALATION PATHWAY**  
  **EFFECTIVE DATE: [DATE]**  
  **APPROVED BY: BOARD GOVERNANCE COMMITTEE**  

  ---

  ### 1. PURPOSE  
  This policy establishes the framework for identifying and addressing sustained, systemic harm caused by an executive whose actions materially compromise organizational integrity and employee welfare. It defines lawful pathways for remediation, emphasizing procedural rigor and harm mitigation.  

  ### 2. DEFINITIONS  
  2.1. **Tyrannical Executive**: An individual in a senior leadership role who *consistently and deliberately* directs organizational resources, authority, or processes toward their *private advantage*, incurring measurable detriment to:  
  - (a) The organization’s mission or long-term viability;  
  - (b) The lawful rights or well-being of staff;  
  - (c) The common good as defined by foundational corporate governance documents.  
  *Note:* Severity in policy enforcement, operational incompetence, or unpopularity due to legitimate business decisions *do not* constitute tyranny under this policy.  

  2.2. **Legitimate Governing Authority (LGA)**: Any body or individual with formally constituted oversight over the executive in question (e.g., Board of Directors, CEO, Chairman).  

  ### 3. ELIGIBILITY TO INITIATE REMOVAL PROCEEDINGS  
  3.1. Initiation is restricted to employees holding roles with *explicit governance or fiduciary responsibility* (e.g., Board Members, Officers, designated Compliance Stewards).  
  3.2. Individual contributors, regardless of tenure or grievance severity, *may not* initiate proceedings. Their concerns must follow standard grievance channels (POLICY: HR-GRIEV-003).  
  **Rationale:** Remediation requires proportional authority to mitigate destabilizing error or overreach.  

  ### 4. ESCALATION PATHWAY  
  #### 4.1. EXECUTIVE HAS A LEGITIMATE GOVERNING AUTHORITY (LGA)  
  4.1.1. **Formal Appeal**: Eligible initiators must submit a *Documented Harm Assessment* (Form REM-EX-007A) to the LGA, detailing:  
  - Specific actions diverting organizational goods to private advantage (Sec. 2.1);  
  - Evidence of sustained detriment (Sec. 2.1a-c);  
  - Prior attempts at correction via standard performance management channels.  
  4.1.2. **LGA Review**: The LGA must:  
  - (a) Conduct an impartial review within 30 days;  
  - (b) Determine if criteria for tyranny (Sec. 2.1) are met;  
  - (c) **Mandate corrective action or removal**.  
  4.1.3. **Outcome Binding**: The LGA’s decision is final. No further internal escalation exists.  

  #### 4.2. EXECUTIVE HAS NO LEGITIMATE GOVERNING AUTHORITY (e.g., FOUNDER-CEO, BOARD CHAIR WITH NO SUPERIOR)  
  4.2.1. **Community of Responsibility (CoR) Formation**: Eligible initiators must:  
  - (a) Secure consensus among *all* employees with governance/fiduciary roles;  
  - (b) Document unanimous agreement that tyranny criteria (Sec. 2.1) are met.  
  4.2.2. **Public Correction Directive**: The CoR must issue a formal, written directive to the executive:  
  - (a) Citing specific violations of foundational governance;  
  - (b) Demanding immediate, verifiable cessation of tyrannical actions;  
  - (c) Allowing reasonable timeframe for compliance (min. 15 days).  
  4.2.3. **Failure to Comply**: If the executive rejects or ignores the directive:  
  - (a) The CoR *may* authorize removal;  
  - (b) Removal must be executed with minimal disruption to operations and staff welfare.  
  *Note:* Individual or factional action *without CoR consensus* is strictly prohibited.  

  ### 5. MANDATORY HARM COMPARISON ASSESSMENT  
  5.1. **Before Any Remedial Action**: Initiators *must* complete Form REM-EX-007B ("Comparative Impact Projection"), demonstrating:  
  - That the *foreseeable disruption* caused by removal proceedings or executive vacancy;  
  - Is *objectively less damaging* than the *continued detriment* caused by the tyranny.  
  5.2. **Assessment Outcome Determines Action**:  
  - If projected harm of remediation > harm of tyranny → **Remediation Pathway Terminated**.  
  - If projected harm of remediation ≤ harm of tyranny → Proceed per Sec. 4.  

  ### 6. TERMINAL PROVISION: REMEDIAL PATHWAY INAPPLICABLE  
  6.1. If no LGA exists *and* CoR consensus is unattainable (Sec. 4.2.1), *or* the Harm Comparison Assessment prohibits action (Sec. 5.2), *no lawful internal remedy exists*.  
  6.2. **Referral**: Employees experiencing distress are directed to:  
  - (a) Utilize confidential support services (Wellness Program POLICY: HR-WELL-008);  
  - (b) Focus on individual resilience and ethical conduct within their role;  
  - (c) Await potential external resolution via natural attrition or market forces.  

  ---

  ### FAQ  
  **Q1: Can we remove an executive who is corrupt but highly effective?**  
  A: Only if actions meet the "private advantage + organizational detriment" criteria (Sec. 2.1) *and* harm comparison permits action (Sec. 5). Effectiveness alone is not a defense against tyranny.  

  **Q2: Why can’t a large group of regular employees initiate removal if they’re suffering?**  
  A: Individual suffering, while regrettable, does not confer governance authority. Uncoordinated action risks disproportionate organizational harm. Utilize standard grievance procedures.  

  **Q3: What if the Board (LGA) is complicit in the executive’s tyranny?**  
  A: Complicity invalidates them as a functional LGA. Proceed to Sec. 4.2 if a unanimous CoR can be formed among *remaining* eligible fiduciaries.  

  **Q4: Isn’t patiently enduring tyranny (Sec. 6) unethical?**  
  A: This policy prioritizes the prevention of greater harm. Endurance is not an endorsement but a risk-mitigation directive when no lawful, net-positive remedy exists. Wellness resources are available.  

  **Q5: Does this policy authorize force or coercion?**  
  A: Remediation requires procedural legitimacy (LGA directive or CoR consensus). Force is neither prescribed nor implied. The policy mandates minimal disruption (Sec. 4.2.3b).  

  ---  
  **ACKNOWLEDGEMENT**  
  Reviewing this policy does not constitute eligibility to initiate proceedings. Unauthorized escalation attempts may result in corrective action under POLICY: HR-CONDUCT-001.  

  **REVISION:** 1.0  
  **AUTHOR:** Office of Ethical Governance & Board Compliance  

  ---

  The document ends by coldly acknowledging scenarios where endurance is the only "compliant" option, framing it as a procedural outcome rather than a moral failure. The HR jargon sanitizes Aquinas’s stark conclusion that sometimes tyranny must be borne if resistance would cause worse ruin, making the resignation explicit but unapologetic. The absence of any "higher appeal" mechanism beyond attrition or market forces underscores the Thomistic refusal to sanctify desperation.
