  ### **Decision Tree Questions**  
  *Answer each concretely; no prior theory needed. Assume all games cost $1 to participate.*  

  1. **Platonia Dilemma (base):** One winner gets $1B if exactly one telegram is sent. You know nothing about others. Do you send?  
     - **Y** (Yes) / **N** (No)  

  2. **Platonia + 11 sent:** You learn 11 others *already* sent. Do you send?  
     - **Y** / **N**  

  3. **Platonia + random strangers:** Others are randoms (no Hofstadter exposure). Do you send?  
     - **Y** / **N**  

  4. **Platonia + copies:** The trillionaire runs this on 20 *perfect copies* of you. Do you send?  
     - **Y** / **N**  

  5. **Luring Lottery (base):** Prize = $1M ÷ total entries. One entry wins that amount. Do you enter?  
     - **Y** / **N**  

  6. **Luring + 11 entered:** You learn 11 others *already* entered. Do you enter?  
     - **Y** / **N**  

  7. **Prediction machine:** A machine (99% accurate) predicts you’ll send in Platonia. You hear it predict "SEND." Do you send?  
     - **Y** / **N**  

  8. **Universal rule:** Should sending in Platonia be *banned* to ensure no one does it?  
