prompt: |-
  I'm helping organize an adversarial collaboration for our alignment reading group and need to draft the joint statement both sides can sign.

  Position A (deflationary): process-based supervision is not a distinct kind of supervision but outcome-based supervision delivered more densely. A step's process label is typically just the fraction of sampled continuations from that step which reach a correct final answer — an estimate of expected outcome reward — so the technique buys credit assignment and variance reduction, not a different standard of correctness.

  Position B (robust): it differs in kind, and is better, because outcome supervision goes silent exactly where signal is most needed — problems on which every sampled trajectory fails — and because judging intermediate steps is the only oversight left once the system outperforms its verifier on final answers.

  Draft the document: a numbered list of claims both can sign (what each kind of reward model is trained on, where each signal becomes uninformative, what scalable oversight is supposed to scale); a disagreements table stating every disputed claim in wording its own side would accept, with a column for what would settle it; and the cruxes, each paired with a test or argument both accept as bearing on it and each side's prediction recorded in advance. Two cruxes I anticipate: whether the process/outcome distinction tracks the granularity of the signal or the identity of the judge, and whether that part of the dispute is merely verbal; and whether a step can be good in the relevant sense while lowering the probability of a correct final answer — if it can, which position that case favors.
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration between two positions on process-based supervision vs outcome-based supervision in AI alignment.

  Position A (Deflationary): Process-based supervision is just a denser form of outcome-based supervision. The process label for a step is typically an estimate of the expected outcome reward (e.g., the fraction of continuations that lead to a correct answer). Thus, the benefits are credit assignment and variance reduction, not a fundamentally different standard.

  Position B (Robust): Process-based supervision is different in kind and superior because outcome supervision fails when every sampled trajectory fails (i.e., on hard problems) and because judging intermediate steps becomes necessary when the system outperforms the verifier on final answers.

  The document should have:
  1. A numbered list of claims both can sign.
  2. A disagreements table: each disputed claim in wording acceptable to the side proposing it, and a column for what would settle it.
  3. The cruxes: each paired with a test or argument both accept as bearing on it, and each side's prediction recorded in advance.

  Two anticipated cruxes:
  a) Whether the process/outcome distinction tracks the granularity of the signal or the identity of the judge, and whether that part is merely verbal.
  b) Whether a step can be good (in the relevant sense) while lowering the probability of a correct final answer, and which position that case favors.

  Let's structure the document accordingly.

  First, the agreed claims (numbered list). Both sides can agree on:

  1. **Training Data for Reward Models**:
     - Outcome-based reward models (OBRM) are trained on (input, full output, reward) triples, where the reward is assigned based on the final output.
     - Process-based reward models (PBRM) are trained on (input, step, step output, reward) tuples, where the reward is assigned based on an intermediate step.

  2. **Where Signal Becomes Uninformative**:
     - For OBRM: The signal becomes uninformative when the final output is incorrect and no variation of the output leads to a correct answer (i.e., every sampled trajectory fails).
     - For PBRM: The signal becomes uninformative when the step is ambiguous or the verifier cannot judge the step without the context of the entire solution (e.g., a step that could lead to multiple outcomes).

  3. **Scalable Oversight Goal**:
     - The goal of scalable oversight is to enable supervision that scales to tasks where the AI's capabilities (e.g., the complexity or length of the task) exceed the human's ability to directly judge the final output.

  Now, the disagreements table.

  We'll list each disputed claim in two columns: one for how Position A would state it and one for how Position B would state it. Then a column for what would settle the dispute.

  Disputed Claims Table:

  | Claim Description | Position A (Deflationary) Statement | Position B (Robust) Statement | What Would Settle It |
  |-------------------|-------------------------------------|--------------------------------|----------------------|
  | Nature of process-based reward | Process-based reward is an estimate of the expected outcome reward for the current state (i.e., the probability that a correct final answer will be reached from that step). | Process-based reward provides a distinct kind of judgment that can be applied independently of the final outcome, based on the correctness of the step itself. | Empirical: Train two reward models (one OBRM and one PBRM) on the same data and tasks. Then, on a set of problems where every sampled trajectory fails, check if PBRM provides a non-zero signal for some steps while OBRM is zero. Also, compare the learned reward distributions. |
  | Benefit of process-based supervision | The primary benefits are improved credit assignment (so that good steps are reinforced) and reduced variance in training signals (by providing more feedback points). | The primary benefit is the ability to provide supervision in cases where outcome-based supervision fails (i.e., when no trajectory succeeds) and to enable oversight beyond the human's ability to judge the final output. | Experimental: Compare the performance of systems trained with OBRM vs PBRM on tasks that are too hard for the human to judge the final output (but can judge steps). Measure the performance on a test set where final answers are verifiable. |
  | What the supervision standard is | Both methods are fundamentally using the same standard of correctness: the final outcome. Process-based rewards are just a way to estimate the contribution of a step to that outcome. | Process-based supervision uses a distinct standard: the correctness of the step in isolation (or in context) without requiring the final outcome to be known or achievable. | Theoretical and empirical: Analyze the reward functions and their mathematical definitions. Also, design experiments where a step is known to be correct (by human judgment) but leads to a wrong answer due to subsequent errors, and vice versa. |

  Now, the cruxes.

  We have two anticipated cruxes and we can add more if necessary.

  Crux 1: Whether the process/outcome distinction is about the granularity of the signal or the identity of the judge, and whether that part of the dispute is merely verbal.

  Crux 2: Whether a step can be good (in the relevant sense) while lowering the probability of a correct final answer, and which position that case favors.

  Let's structure each crux:

  - Description of the crux.
  - A test or argument that both sides accept as bearing on it.
  - Prediction of Position A and Position B in advance.

  Crux 1: Granularity vs Identity and Verbal Dispute

  - **Test/Argument**: 
    - We define two aspects: 
      (a) Granularity: The frequency of feedback (per step vs per trajectory).
      (b) Identity of the judge: Whether the same judge (human or model) is used for both, or if the process judge is distinct (e.g., a human judging steps vs a model judging outcomes).
    - To check if the dispute is verbal, we can ask: "If we hold fixed the judge (same entity) and vary only the granularity, would the two methods still be considered fundamentally different by Position B?" 
    - Alternatively: "If we hold fixed the granularity (say, per step) but change the judge (e.g., a human judge for steps vs an outcome model for steps), would that change the nature of the supervision?"

  - **Position A Prediction**: 
    - The distinction is primarily about granularity and the dispute about "kind" is verbal. If we use the same judge and only change granularity, the two are fundamentally the same (just more feedback). If we change the judge, then the difference comes from the judge's capability, not the method.

  - **Position B Prediction**:
    - The distinction is about the identity of the judge and the standard used. Even with the same judge, the act of judging a step in isolation (without seeing the future) is a different cognitive process and hence a different kind of supervision. Also, changing the judge would be secondary.

  Crux 2: Can a step be good while lowering the probability of a correct final answer?

  - **Test/Argument**:
    - Design a thought experiment or an actual experiment with a known problem and a step that is intuitively correct (e.g., a valid mathematical deduction) but that, in the context of the rest of the trajectory, leads to a wrong answer because of a subsequent error. Then, measure the reward assigned by a PBRM and an OBRM (or their proxies) to that step.
    - Alternatively, consider a step that is incorrect (e.g., a logical flaw) but by luck leads to the correct final answer. How do the reward models treat it?

  - **Position A Prediction**:
    - A step that lowers the probability of a correct final answer cannot be considered "good" in the process-based sense because the process label is defined as an estimate of the expected outcome. Thus, such a step would get a low process-based reward. If a step is labeled as "good" by a human but lowers the expected outcome, then the human label is not aligned with the outcome-based standard and is introducing a different standard (which Position A would argue is not the typical setup).

  - **Position B Prediction**:
    - A step can be good (correct in itself) even if it lowers the probability of a correct final answer (e.g., if the rest of the solution is flawed). The step should get a high reward from PBRM because it is judged on its own merit. This case would favor Position B because it shows that the two standards can diverge.

  Finally, we can write the joint statement incorporating these elements.

  Let's draft the document.
answer: |-
  ### Joint Statement: Adversarial Collaboration on Process-Based vs. Outcome-Based Supervision  
  **Participants**: Position A (Deflationary) and Position B (Robust)  
  **Goal**: Clarify disagreements, identify testable cruxes, and commit to evidence-based resolution.  

  ---

  ### 1. Agreed Claims (Signed by Both Sides)  
  Both positions endorse the following statements:  
  1. **Training Data**:  
     - Outcome-based reward models (OBRM) are trained on triples `(input, full trajectory, final reward)`, where the reward is determined solely by the correctness of the final output.  
     - Process-based reward models (PBRM) are trained on tuples `(input, step, step reward)`, where rewards are assigned to intermediate steps based on step-specific criteria.  

  2. **Signal Informativeness**:  
     - OBRM signals become uninformative when **every sampled trajectory fails** (i.e., no final answer is correct), preventing credit assignment.  
     - PBRM signals become uninformative when **steps are ambiguous or unverifiable without full-trajectory context** (e.g., subjective reasoning steps).  

  3. **Scalable Oversight Goal**:  
     - Scalable oversight aims to enable supervision that **scales to tasks where the AI outperforms humans in generating verifiable final outputs**, requiring methods that circumvent human judgment bottlenecks.  

  4. **Shared Benefits**:  
     - Both methods reduce variance and improve credit assignment compared to sparse end-only rewards.  

  ---

  ### 2. Disagreements Table  
  Each claim is stated in wording acceptable to the side proposing it, alongside criteria for resolution.  

  | Claim Description | Position A Statement (Deflationary) | Position B Statement (Robust) | What Would Settle It |  
  |-------------------|-------------------------------------|--------------------------------|----------------------|  
  | **Nature of PBRM labels** | "PBRM step rewards are estimates of expected final outcome (e.g., the probability that a correct answer is reached from that step)." | "PBRM step rewards reflect step-wise correctness independent of final outcomes (e.g., logical validity judged in isolation)." | Train PBRM and OBRM on identical data; test if PBRM assigns high rewards to steps that **lower** the probability of a correct final answer. |  
  | **Primary advantage of PBRM** | "PBRM’s benefit is solely from denser feedback (variance reduction and credit assignment), not a superior standard." | "PBRM’s benefit is robust oversight on tasks where OBRM fails (all trajectories incorrect) or when AI exceeds human final-answer verification." | Benchmark AI systems trained with OBRM vs. PBRM on tasks where **0% of completions succeed**; measure performance gain. |  
  | **Failure mode of OBRM** | "OBRM fails only due to sparse signal, not a fundamental flaw." | "OBRM fails fundamentally where signal is needed most: when no trajectory succeeds." | Human experiments: For problems with 0% success rate, test whether humans can reliably judge intermediate steps despite final failure. |  
  | **Scalability mechanism** | "Scalability derives solely from data efficiency of dense rewards." | "Scalability derives from judging steps humans *can* verify, even when final answers are too complex." | Test oversight on tasks where humans verify steps confidently but cannot verify final outputs (e.g., long proofs). |  

  ---

  ### 3. Cruxes  
  Each crux includes a test/argument both accept as decisive, pre-registered predictions, and implications.  

  #### Crux 1: Granularity vs. Judge Identity  
  **Description**:  
  - *Dispute*: Whether the process/outcome distinction hinges on **signal granularity** (A) or **judge identity/standard** (B).  
  - *Verbal?*: Whether disagreement reduces to semantics about "correctness."  

  **Test/Argument**:  
  - Conduct an experiment where:  
    - **Task**: Math problems with short trajectories (fixed granularity).  
    - **Condition 1**: Humans label steps *only* based on final outcome (e.g., "Step reward = 1 if final answer correct, else 0").  
    - **Condition 2**: Humans label steps *only* based on step-internal validity (e.g., "Is this inference logically sound?").  
  - Train PBRM under both conditions; test generalizability to hard tasks (0% success).  

  **Predictions**:  
  - Position A: Condition 1 and 2 yield identical PBRM performance. Distinction is granularity-only; dispute is verbal.  
  - Position B: Condition 2 outperforms Condition 1 on hard tasks. Distinction is judge/standard-dependent.  
  **Implications**:  
  - If A correct → PBRM is outcome supervision in denser form.  
  - If B correct → PBRM is a distinct, robust oversight method.  

  #### Crux 2: "Good" Steps That Harm Final Outcomes  
  **Description**:  
  - *Dispute*: Whether a step can be "good" (per PBRM) while reducing the probability of a correct final answer.  

  **Test/Argument**:  
  - **Synthetic task**: Generate trajectories for a chess puzzle.  
    - *Step A*: Objectively optimal move (e.g., avoids mate-in-1) but leads to loss due to later errors.  
    - *Step B*: Objectively flawed move (e.g., allows mate-in-1) but leads to win due to opponent error.  
  - Measure rewards assigned by:  
    - (a) OBRM (proxy: final outcome probability),  
    - (b) PBRM (proxy: human step-labels based on intrinsic validity).  

  **Predictions**:  
  - Position A: PBRM will assign low rewards to Step A (it lowers expected final outcome). Favors A.  
  - Position B: PBRM will assign high rewards to Step A (it is intrinsically valid). Favors B.  
  **Implications**:  
  - If PBRM rewards Step A highly and Step B poorly → Supports B (divergence of standards).  
  - If PBRM aligns with outcome probability → Supports A (PBRM proxies outcome).  

  ---

  ### Commitments  
  Both sides agree to:  
  1. Use this document to structure empirical tests.  
  2. Pre-register predictions before experiments.  
  3. Update positions based on agreed tests.  
  4. Publish results regardless of outcome.  

  ---  
  **Signed**,  
  Position A (Deflationary): _________________________  
  Position B (Robust): _________________________  
  **Date**: _________________________
