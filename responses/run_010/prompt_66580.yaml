answer: |-
  Below is the document structured as requested, designed to clarify the disagreement and provide a framework for resolution. It avoids academic citations and defines necessary terms in context.

  ---

  **Document for Resolution of Cataloguing Dispute**

  **1. Points of Agreement**  
  Both parties endorse the following statements without reservation:  
     - The primary purpose of a catalogue description is to enable accurate discovery of historical records while preserving their original content and context.  
     - The registers record institutional perceptions, decisions, and terminology of the 19th century; they do not record objective truths about individuals.  
     - Living descendants have a legitimate interest in how their ancestors are represented. Harm to living persons must be minimized without erasing history.  
     - The clerk’s original wording is a historical artifact reflecting institutional attitudes. Modern translations are interpretations reflecting contemporary understanding.  
     - Both verbatim transcription and modern translation involve unavoidable editorial decisions.  

  **2. Table of Disagreements**  
  | **Head Teacher’s Position (as she would state it)**                                                                 | **Genealogist’s Position (as she would state it)**                                                                 | **Nature of Difference** |  
  |----------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------|--------------------------|  
  | "Retaining original terms verbatim preserves historical evidence. Translating overwrites the past with modern biases." | "Retaining original terms uncritically launders historical prejudice. Translation exposes power imbalances in the record." | Emphasis: Evidence vs. Ethics |  
  | "The clerk’s words are the direct evidence of institutional practice. Altering them distorts what happened."          | "The clerk’s words were tools of control. Preserving them unchanged lets oppression speak unchallenged."             | Emphasis: Factual vs. Critical |  
  | "Modern standards cannot judge the past. Our duty is to present the past authentically, not to sanitize it."          | "Failing to translate perpetuates harm. Our duty is ethical stewardship, not passive replication of injustice."     | Emphasis: Fidelity vs. Responsibility |  

  **3. Cruxes with Concrete Cases**  
  *Crux 1: Does a period term in a catalogue field ASSERT or CITE?*  
     - **Case:** Cataloguing an entry where the clerk wrote "imbecile."  
       - *Head Teacher’s Prediction:* Entering `imbecile` cites the clerk’s term; it does not assert its truth. Researchers understand it as historical language.  
       - *Genealogist’s Prediction:* Entering `imbecile` without qualification asserts the term’s validity. It forces researchers to "see" the person through the institution’s dehumanizing lens.  
     - **Test:** Add a glossary defining "imbecile" as *a historical term for intellectual disability, now considered offensive*. Does this resolve the objection?  

  *Crux 2: Is "judge by past standards" about EVIDENCE or RESPECT?*  
     - **Case:** An entry labels a woman "habitual drunkard," but her descendant provides evidence she was self-medicating for chronic pain.  
       - *Head Teacher’s Prediction:* The catalogue must retain "habitual drunkard" (the clerk’s evidence). The descendant’s evidence belongs in researcher notes, not the core description.  
       - *Genealogist’s Prediction:* The catalogue should note `described as "habitual drunkard"` and link to the descendant’s evidence. Omitting context disrespects the person’s lived reality.  
     - **Test:** Does linking to contextual material satisfy both evidence and respect?  

  *Crux 3: Are "past standards" a SINGLE scheme?*  
     - **Case:** An entry where a clerk wrote "weak-minded," but a visiting guardian noted in the margin: "Unjust. Capable of work."  
       - *Head Teacher’s Prediction:* Both terms must be included verbatim (`"weak-minded" (clerk); "Unjust. Capable of work" (guardian)`). This shows internal debate.  
       - *Genealogist’s Prediction:* The catalogue should summarize: `Recorded as "weak-minded" but contested by guardian as unjust`. Neutral framing exposes the conflict.  
     - **Test:** Does explicitly showing internal disagreement make "judging by past standards" obsolete?  

  **4. Verbal vs. Substantive Disagreement**  
  - **Merely Verbal (≈30%):** Disagreement stems from terms like "authenticity" (faithful to text vs. faithful to experience) and "harm" (offense vs. perpetuation of stigma). Clarifying definitions reduces conflict.  
  - **Substantive (≈70%):** Fundamental divergence on the archivist’s role: Is it *custodianship* (preserving the record as-is) or *curatorship* (interpreting the record for ethical access)? This reflects differing values about power, memory, and justice.  
  - **How to Tell:** If disagreement persists after defining terms and agreeing on facts (e.g., "Does `imbecile` in a field *function* as an endorsement?"), the conflict is substantive.  

  ---

  **Private Note to You**  

  **Confidence Assessment:**  
  - **High Confidence (Agreements & Crux Cases):** The points of agreement are foundational and non-negotiable for ethical cataloguing. The crux cases are drawn from your work and test precise philosophical splits. Both parties should accept these as valid tests.  
  - **Moderate Confidence (Disagreements Table):** The wording captures core motivations. The head teacher may balk at "oppression," the genealogist at "distorts what happened," but these are their *implicit* stakes.  
  - **Lowest Confidence (Crux 1 Wording - "Assert vs. Cite"):** This is the tidied-up point. In practice, the difference blurs: *citation* in an authoritative database *functions* as endorsement unless actively undermined. The genealogist sees this acutely; the head teacher sees it as overcomplication. My formulation risks making their positions neater than they are. The head teacher might reject that citation *can* imply assertion; the genealogist might reject that citation *ever* cleanses the term. This crux remains the most volatile.  

  **Your Guesses Were Astute:**  
  - Your third crux (internal dissent) is the most powerful. If they agree that the past was never monolithic, it forces both to refine their "standards" arguments. The concrete case here is your strongest lever.  
  - The "evidence vs. respect" crux likely underpins their stalemate. The head teacher prioritizes the *record* as evidence; the genealogist prioritizes the *person* as deserving respect. The case bridges this by asking if evidence *includes* contestation.  

  **Recommendation:** Start with the "internal dissent" case (Crux 3). It makes abstract disagreements tangible and offers a path to synthesis: showing conflict in the record satisfies the head teacher’s evidentiary concerns and the genealogist’s ethical ones. If they agree on this approach, it narrows the ground left to fight over.  

  ---  

  This framework makes the debate actionable. It replaces "presentism vs. historicism" slogans with testable claims about specific cataloguing decisions. The concrete cases force both sides to confront practical consequences, not just principles.
