  The cruxes section is crucial. Using the British villa site example, I'll define pre-registered predictions. Discontinuity might predict further decline, while transformation expects stabilization. Key discriminators include settlement hierarchy and artifact diversity. Predictions both sides accept, like organic material preservation, shouldn't be included as cruxes.

  Joint dismissals should target overemphasized factors like single battles or monocausal theories. Wording must acknowledge these factors' existence but deny their centrality, satisfying both scholars without oversimplification.

