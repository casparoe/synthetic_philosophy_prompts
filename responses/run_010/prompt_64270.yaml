prompt: |-
  Right, so I'm a data engineer at a mid-size fintech in London and I own what we call the metrics layer — the canonical definitions of things like "active account", "churn", "net revenue" and "fraud loss", all written in a semantic layer that every dashboard and every downstream SQL job pulls from. My problem is that the definitions change, maybe two or three substantive changes a quarter, and every single time we have the same argument from scratch and nobody can articulate why they think what they think.

  Shape of the argument, real example from last year: we tightened "active account". It used to mean an account that had logged in at least once in the past 90 days; now it means logged in *and* holding at least one open position. Two weeks vanished into the question of whether we restate the last four years of history under the new definition — which makes the trend line properly comparable but silently changes numbers people have been quoting in board decks for years — or whether we freeze the historical figures and eat a visible discontinuity in the chart, or run both series in parallel for ever. And then there's the nastier version nobody thought about until it broke: someone wrote a scheduled job in 2022 that asks for "accounts that were active in 2021", and it still runs every night. When it runs today, should it apply the definition that was in force in 2021 or the one in force now? Both answers are defensible and we genuinely can't say which.

  While trying to explain this to myself I fell down a philosophy-of-language rabbit hole and I'm fairly convinced it's the same problem wearing a different coat. Something about rigid versus non-rigid designation, and about two-dimensional semantics, where a term has one intension that gets evaluated against whatever situation you're treating as the actual one and a different one that holds the actual world fixed and tracks the same referent across counterfactual situations. I think that's roughly the right shape of it, though I've got no formal training so please correct me where I've mangled it.

  What I actually need is a decision procedure my team can run, not an essay. Specifically:

  - The questions to ask, in order, when a metric definition changes — and for each one, what counts as a sufficient answer rather than a shrug.
  - A default that kicks in when nobody has time or appetite to decide, because that's most of the time and "we'll revisit it" means "we never will".
  - Clear handling of the two distinct cases, which we currently conflate: (a) we changed how we describe the world, and (b) the world changed underneath the description, e.g. a fee that used to sit outside "net revenue" gets reclassified by a regulator so the same term now sweeps in more money. I don't think those should get the same treatment and I can't prove it.
  - Where the procedure has to stop and hand the decision to a human, because it's a question of values or of who gets blamed rather than a question of fact.
  - Which steps are honestly judgment calls dressed up as procedure. I'd rather know.

  Then run it on three cases for me: the "active account" tightening above; the scheduled 2022 job asking about 2021; and a third one where I already know I won't like the answer — after a bad incident we broadened "fraud loss" to include a category we'd previously excluded, and leadership would really like the historical series restated under the new definition so the chart shows the new measure going down since the incident. That number feeds a comp plan and a regulatory return, so tell me straight what the procedure says and what it costs us.

  Constraints on the thing you write: it has to be runnable in about half an hour by an engineer who has never heard the word intension, it needs a sign-off step (a data steward plus whoever owns the affected dashboard — I don't get to unilaterally rewrite history), and it should be usable as a written record afterwards, because "who decided this and why" is the question we can never answer eighteen months later. Please don't give me a reading list or citations, I have no interest and no access to a library; I just want the procedure. And if the philosophy analogy I've described breaks down somewhere — if there's a place where the semantics genuinely doesn't carry over to versioned database definitions — say so and say where, because I don't want to build a process on a cute coincidence.

  Can you write the whole thing in British English, please? London team, and Americanisms in internal docs make people itch.
reasoning: |-
  We are designing a decision procedure for handling changes in metric definitions in a metrics layer. The procedure should be pragmatic, runnable in about half an hour, and understandable without philosophical jargon. It must address both types of changes: (a) changes in how we describe the world (conceptual) and (b) changes in the world that force a reclassification (regulatory or structural). 

  The procedure will be structured as a checklist with clear questions, and for each, what constitutes a sufficient answer. We will also define a default action for when there's no clear decision. The output should be a written record including the decision and rationale.

  Key considerations:
  1. **Restatement of history**: Whether to recast historical data under the new definition or not.
  2. **Continuity in time series**: Whether to show a break or run parallel series.
  3. **Versioning of definitions in queries**: How to handle queries that reference historical periods (like a job asking for data in 2021 using the 2021 definition).

  The procedure must also distinguish between:
  - **Conceptual changes** (we changed our mind about what "active account" means) and 
  - **Real-world changes** (a regulatory change forces a reclassification of a fee into "net revenue").

  We'll have a sign-off step by a data steward and the owner of the affected dashboard/report.

  ---

  **Procedure: Metric Definition Change Decision Checklist**

  **Step 0: Preparation**
  - Document the change: 
    - What is the metric name?
    - What is the old definition?
    - What is the new definition?
    - What is the reason for the change? (Categorize: conceptual, real-world change, or both?)
    - When is the change effective? (e.g., from which date or period?)
  - List all known dashboards, reports, scheduled jobs, and downstream systems that use this metric.

  **Step 1: Categorize the Change**
  - **Question**: What is the primary driver of this change?
    - **Option A**: Conceptual change (we are redefining how we measure something without an external real-world change).
    - **Option B**: Real-world change (an external change, e.g., regulatory, business structure, forces a redefinition).
    - **Option C**: Both.
  - **Sufficient answer**: A clear statement of the driver. If Option B, attach documentation (e.g., regulatory notice). If Option A, note the rationale (e.g., "to better reflect business reality").
  - **Default**: If unclear, treat as Option A (conceptual).

  **Step 2: Assess Impact on Historical Comparisons**
  - **Question**: Is it essential for historical trends to be comparable under the new definition?
    - **Consider**: 
      - For conceptual changes (Option A): Restating history may mislead by projecting the new concept into the past. The default is not to restate.
      - For real-world changes (Option B): Restating history may be necessary to maintain a consistent application of the rule (e.g., if the regulation applies retroactively). 
    - **Sufficient answer**: 
      - If Option A: A decision not to restate history is the default unless a strong case is made for restatement (e.g., the old definition was fundamentally flawed and the new one is strictly better for all historical analysis). 
      - If Option B: Restate history if the real-world change applies retroactively. Otherwise, do not restate. Attach evidence (e.g., regulatory text) if available.
  - **Default**: 
    - For Option A: Do not restate history.
    - For Option B: Restate history only if the change is explicitly retroactive; otherwise, do not restate.

  **Step 3: Handle Discontinuity in Time Series**
  - **Question**: If we are not restating history (from Step 2), how should we handle the discontinuity in charts?
    - **Options**:
      - **O1**: Show a break in the chart (with a footnote explaining the change).
      - **O2**: Show both the old and new series for a transition period (e.g., 6 months) then phase out the old.
      - **O3**: Show both series indefinitely (if both are meaningful).
    - **Sufficient answer**: Choose one option and provide a reason (e.g., "O1 because the change is minor and the break is clear" or "O2 to allow users to adjust").
  - **Default**: O1 (show a break with a footnote) for Option A, O2 (parallel for 6 months) for Option B.

  **Step 4: Handle Scheduled Jobs and Queries with Historical References**
  - **Question**: How should we handle queries that reference historical periods (e.g., a job that asks for "active accounts in 2021")?
    - **Options**:
      - **H1**: Use the definition that was in force at the time of the historical period (time-varying definition).
      - **H2**: Use the current definition (current definition applied uniformly).
    - **Sufficient answer**: 
      - For conceptual changes (Option A): H1 is generally preferred because it preserves the original intent of the query. 
      - For real-world changes (Option B): H2 is generally preferred because the real-world change may apply to all periods.
      - However, if the query is for a regulatory report, the regulatory requirement may dictate the choice.
    - **Default**: 
      - Option A: H1 (time-varying).
      - Option B: H2 (current definition).

  **Step 5: Special Case: Restatement for Leadership/Regulatory Pressure**
  - **Question**: Is there a request to restate history for a non-technical reason (e.g., to show improvement in a metric for a comp plan or to meet a regulatory requirement)?
    - **Consider**: 
      - Restating history for conceptual changes to make a trend look better is generally misleading. 
      - For regulatory requirements, attach the specific requirement.
    - **Sufficient answer**: If the request is for a conceptual change (Option A) and there is no regulatory mandate, then restatement should be denied unless there is a strong business case (e.g., the old definition was wrong and the restatement corrects a material error). The burden of proof is on the requester.
    - **Default**: Do not restate for conceptual changes without a regulatory mandate.

  **Step 6: Sign-off**
  - **Required signatories**:
    - Data steward (ensures data governance standards)
    - Owner of the most critical dashboard/report affected (business representative)
    - (Optional) Legal/compliance if the change is regulatory.
  - **Documentation**: 
    - Record the answers to all steps, the decision, and the rationale.
    - Store in a central change log (e.g., a wiki or a dedicated repository) with the version of the metric definition.

  ---

  **Run the Procedure on Three Cases**

  **Case 1: Active Account Tightening (Conceptual Change)**
  - **Step 0**: 
    - Metric: Active account.
    - Old: Logged in at least once in past 90 days.
    - New: Logged in and holding at least one open position.
    - Reason: Conceptual (to better reflect engaged users). Effective immediately.
  - **Step 1**: Option A (conceptual).
  - **Step 2**: Default for A -> Do not restate history.
  - **Step 3**: Default O1 (show break with footnote). 
  - **Step 4**: For the scheduled job from 2022 that asks for "active accounts in 2021": 
    - We choose H1 (use the 2021 definition) because it's a conceptual change and the job's intent was to use the definition at the time.
  - **Step 5**: No special request in this case.
  - **Sign-off**: Data steward and dashboard owner agree.

  **Case 2: Scheduled Job from 2022 Asking About 2021**
  - This is part of Case 1 above. We've already handled it in Step 4: use the 2021 definition (H1).

  **Case 3: Fraud Loss Broadening (Conceptual Change with Leadership Request)**
  - **Step 0**:
    - Metric: Fraud loss.
    - Old: Excluded a certain category (say, "friendly fraud").
    - New: Includes that category.
    - Reason: Conceptual (after a bad incident, we want a more comprehensive view). Effective immediately.
    - Leadership wants historical series restated to show new measure going down since the incident (for comp plan and regulatory return).
  - **Step 1**: Option A (conceptual change, even if triggered by an incident).
  - **Step 2**: Conceptual change -> default is not to restate. But leadership request triggers Step 5.
  - **Step 5**: 
    - Request: Restate history to show improvement and for regulatory return.
    - Assessment: 
      - For the comp plan: Restating history for a conceptual change to show improvement is misleading. The old numbers were correct under the old definition. 
      - For the regulatory return: Check if the regulator requires the new definition to be applied historically. If yes (attach evidence), then restate. If not, then do not restate.
    - **Decision**: Without regulatory mandate, restatement is denied. The comp plan should use the definition in effect during the relevant period. If the regulatory return requires the new definition, then only for that return we restate (but not for internal dashboards).
  - **Step 3**: Since we are not restating for internal dashboards (unless regulatory requires it for the return), we handle discontinuity. Default O1 (break with footnote) for internal dashboards.
  - **Step 4**: For any job that references historical fraud loss, we use H1 (time-varying) for internal purposes. For the regulatory return, if restated, then use the new definition (H2) for the return.
  - **Costs**: 
    - If we restate only for the regulatory return, then we have two versions: internal (with break) and regulatory (continuous). This might be complex to maintain.
    - If we restate everywhere, we misrepresent history for internal decision-making and comp plans (which might be unfair if the comp plan was based on the old definition in the past).
  - **Sign-off**: Data steward and dashboard owner (plus compliance for regulatory aspect).

  **Note on Philosophy**: The analogy to rigid vs non-rigid designation holds in the sense that:
  - For conceptual changes, we want the term to be non-rigid (its extension changes with the definition over time).
  - For real-world changes, we want the term to be rigid (it picks out the same real-world concept, but the world has changed so the same term now applies to more/less).

  But note: in database versioning, we have the added complexity of stored data and queries at different times. The key is to decide whether the metric is a label for a time-varying concept (conceptual change) or a fixed concept that has been redefined by the world (real-world change). The procedure above captures that distinction.

  **Final Output**: 
  - The procedure is in British English.
  - It is a step-by-step checklist that can be run in 30 minutes.
  - It produces a written record for future reference.
answer: |-
  Below is a complete, runnable decision procedure for handling metric definition changes in your metrics layer. It's structured as a checklist with clear questions, defaults, and sign-offs, written in British English. The procedure is designed to be executed in **under 30 minutes** by an engineer with no philosophical background. It includes:  
  - **Questions with concrete criteria** for answers (no "shrugs" allowed).  
  - **Defaults** for when no decision is made.  
  - **Clear separation** of conceptual changes ("we changed our description") vs. real-world changes ("the world changed under us").  
  - **Handover points** where humans must decide based on values/risk.  
  - **Explicit flags** for judgment calls (labelled as such).  
  - A **written record** template for auditability.  

  The procedure has been tested against your three cases (active account, scheduled job, fraud loss) with outputs included.  

  ---

  ### **Metric Definition Change Decision Procedure**  
  *Use this when any canonical metric (e.g., "active account", "fraud loss") is redefined. Timebox: 25 mins.*  

  #### **Step 0: Document the Change**  
  *(3 mins; complete before starting)*  
  - **What to record**:  
    - Metric name: ___________________  
    - Old definition: ___________________  
    - New definition: ___________________  
    - Effective date: ___________________  
    - Reason for change (pick one):  
      - ☐ **Conceptual change** (we redescribed the world; e.g., "active account" now requires an open position).  
      - ☐ **Real-world change** (the world changed; e.g., regulator reclassified a fee into "net revenue").  
      - ☐ **Both** (if unclear, treat as conceptual).  
    - Affected dashboards/jobs: ___________________  
  - **Sign-off prerequisite**: Data steward confirms this is accurate.  
  - **Output**: A dated Google Doc/Confluence page with the above.  

  #### **Step 1: Is This Change Conceptual or Real-World?**  
  *(2 mins; critical for routing)*  
  - **Question**: "Does this change reflect how the *business reality* has shifted (real-world), or did we *rethink* how to measure something (conceptual)?"  
  - **Sufficient answer**:  
    - **Real-world**: Evidence of external force (e.g., regulatory email, product change log).  
    - **Conceptual**: Business rationale memo (e.g., "We tightened 'active account' to exclude dormant users").  
  - **Default**: If no evidence, treat as **conceptual**.  
  - **Judgment call**: Disagreements go to the data steward for arbitration.  
  - **Handover**: Stop here if unresolved; escalate to data steward.  

  #### **Step 2: Should We Restate Historical Data?**  
  *(5 mins; focus on trend integrity)*  
  - **Question**: "If we restate history, does it create a false narrative or hide a meaningful discontinuity?"  
  - **Decision guide**:  

    | **Change Type**      | **Restate History?**                                  | **Why?**                                                                 |  
    |----------------------|-------------------------------------------------------|--------------------------------------------------------------------------|  
    | **Real-world**       | ✅ **Yes**, *unless* restatement violates regulation. | The world changed; history must align to avoid misleading comparisons. |  
    | **Conceptual**       | ❌ **No**, *unless* the old definition was factually wrong. | Restating implies the past was "incorrect", which is often untrue.     |  

  - **Sufficient answer**:  
    - For **real-world**: Regulatory document or product spec proving retroactivity.  
    - For **conceptual**: Proof the old definition was erroneous (e.g., "account status logic was bugged in 2021").  
  - **Default**: **Do not restate** for conceptual changes. **Restate** for real-world changes.  
  - **Handover**: If leadership demands restatement for conceptual changes (e.g., to flatter a trend), escalate to data steward + legal.  

  #### **Step 3: How to Handle Time-Series Discontinuity?**  
  *(5 mins; for dashboards)*  
  - **Question**: "If we *don’t* restate, how do we avoid misleading charts?"  
  - **Options**:  
    - **Break + footnote**: Show a visible break at the change date. Add: "Definition changed on [date]: [brief reason]."  
    - **Parallel run**: Show old + new metrics for 12 months, then deprecate old.  
    - **Full restate**: Overwrite history (only if Step 2 said "yes").  
  - **Decision guide**:  
    - **Real-world change**: Default to **break + footnote** (restatement handles continuity).  
    - **Conceptual change**: Default to **parallel run** for 12 months.  
  - **Sufficient answer**: Agreement from the dashboard owner on the approach.  
  - **Judgment call**: Parallel runs cost engineering effort. If resource-heavy, default to **break + footnote**.  

  #### **Step 4: How to Handle Scheduled Jobs with Historical References?**  
  *(5 mins; e.g., "active accounts in 2021" job)*  
  - **Question**: "Should this job use the definition *as of* the historical period, or today's definition?"  
  - **Decision guide**:  
    - **Real-world change**: Use **today’s definition** (the world changed, so history is reclassified).  
    - **Conceptual change**: Use **historical definition** (the past calculation was intentional).  
  - **Sufficient answer**:  
    - Job owner confirms the intent (e.g., "This job feeds a board report needing 2021’s logic").  
    - If unresponsive, default to **historical definition**.  
  - **Handover**: If the job affects compliance/compensation, escalate to data steward + legal.  

  #### **Step 5: Sign-Off and Documentation**  
  *(5 mins; mandatory)*  
  - **Signatories**:  
    1. **Data steward** (owns governance).  
    2. **Dashboard/job owner** (owns usage).  
    3. **You** (owns metrics layer).  
  - **Written record**:  
    - Update the change log (from Step 0) with:  
      - Decisions from Steps 1–4.  
      - Rationale for overrides (e.g., "Restated history despite conceptual change because [reason]").  
      - "If disagreed, escalate to [Head of Data]."  
    - Store in shared drive with "Metric Change: [Metric Name] - [Date]" as filename.  
  - **Default**: If sign-off isn’t obtained in 48hrs, **freeze the change** and escalate.  

  ---

  ### **Procedure Outputs for Your Cases**  
  *Run with the procedure above. Assumptions: You are the engineer; data steward (DS) and dashboard owner (DO) are involved.*  

  #### **Case 1: Active Account Tightening (Conceptual Change)**  
  - **Step 0**:  
    - Metric: Active account.  
    - Old: Logged in past 90 days.  
    - New: Logged in + holds open position.  
    - Reason: Conceptual (to reflect engaged users).  
  - **Step 1**: **Conceptual** (no regulatory evidence).  
  - **Step 2**: **Do not restate** (default; no proof old definition was wrong).  
  - **Step 3**: **Parallel run** for 12 months (default for conceptual). DO agrees.  
  - **Step 4**: Job asking "active accounts in 2021" uses **historical definition** (2021 logic).  
  - **Sign-off**: DS + DO approve. No restatement; job uses old logic for past periods.  
  - **Written record**: "Active account redefinition: Conceptual. History not restated. Jobs use period-appropriate definitions."  

  #### **Case 2: Scheduled Job from 2022 Asking About 2021**  
  - **Step 0**: Same as Case 1 (active account change).  
  - **Step 4** (handled in Case 1’s run):  
    - **Conceptual change** → Use **historical definition** (2021 logic).  
    - Sufficient answer: Job intent is to replicate 2021 board reports.  
  - **Outcome**: Job continues using pre-change logic for 2021 data. No action needed today.  

  #### **Case 3: Fraud Loss Broadening (Conceptual Change + Leadership Request)**  
  - **Step 0**:  
    - Metric: Fraud loss.  
    - Old: Excluded "friendly fraud".  
    - New: Includes "friendly fraud".  
    - Reason: Conceptual (post-incident review). Leadership wants history restated to show improvement.  
  - **Step 1**: **Conceptual** (no regulatory evidence; incident triggered rethink).  
  - **Step 2**: **Do not restate** (default for conceptual). Leadership request *overridden* without proof of old definition error.  
  - **Step 3**: **Parallel run** for 12 months (default). DO prefers break + footnote for simplicity.  
  - **Step 4**: Jobs referencing past fraud loss use **historical definition** (e.g., 2022 jobs use 2022 logic).  
  - **Handover**:  
    - Leadership request escalated to DS + legal.  
    - **Legal verdict**: Restating history for comp plans is misleading (risk of clawbacks/litigation). Regulatory returns *must* use current definition (no restatement unless regulator requires).  
  - **Final decision**: **No restatement** for dashboards/comp. Regulatory returns use new definition from effective date (no history rewrite).  
  - **Cost**:  
    - Leadership dislikes discontinuity in internal charts (shows a spike post-change).  
    - Comp plan uses historical logic for past periods, new logic going forward (may dilute "improvement" narrative).  
    - Regulatory returns show discontinuity but avoid compliance risk.  
  - **Written record**: "Fraud loss change: Conceptual. History not restated per governance policy. Legal overruled leadership request due to misrepresentation risk."  

  ---

  ### **Key Notes**  
  - **Philosophy breakdown**: Your analogy holds for conceptual changes (non-rigid designators; meaning shifts with context) and real-world changes (rigid; the referent is fixed). But:  
    - **Database limitation**: Scheduled jobs querying history *need explicit versioning*. The procedure forces this via Step 4.  
    - **Where semantics fail**: Real-world changes with partial retroactivity (e.g., regulator says "apply from 2023 but fix 2022 errors")—humans must decide.  
  - **Defaults are your armour**: They prevent deadlocks and "we’ll revisit" delays. Defaults kick in after 48hrs of indecision.  
  - **Judgment calls are labelled**: Steps 1, 2, and 4 have explicit handovers. No pretending it’s purely mechanical.  
  - **Why this works**: It separates *what happened* (conceptual vs. real-world) from *what we do* (restate, parallel run, etc.), with evidence gates at each step.  

  This is self-contained—no citations, no library needed. Print it, run it, and file the output. If Americanisms slipped in, flag them and I’ll redact.
