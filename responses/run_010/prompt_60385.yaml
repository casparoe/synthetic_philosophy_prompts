prompt: |-
  I'm a third-year philosophy PhD student (value theory, mostly the formal end of it) spending the summer seconded to an AI safety group, and I've been asked to write down what our impact measure actually has to do before we start arguing about which candidate to build. Nobody has done it. Right now the group just goes in circles: one faction says any measure that counts side effects has to already know what we care about, the other says you can do it value-neutrally by counting changes in the state space, and they talk straight past each other.

  So: write the desiderata. What does an impact measure — a function that assigns a penalty to an agent's action or policy for its effects on the world, used as an auxiliary term or a constraint during training — have to deliver to count as adequate? For our purposes "adequate" means: usable in a rich simulated household-and-greenhouse environment where the agent has a narrow task (hold the greenhouse at temperature, say), has no access to a full specification of human values, and is watched by a human overseer who needs to be able to look at the penalty and roughly see why it fired.

  For each desideratum I want: the concrete case or consideration motivating it (not vibes); whether its non-negotiable or a prejudice of one of the two camps; and what it costs you — which other property you tend to lose by satisfying it.

  Here are the cases I've been throwing at candidates. You should definately say which desideratum each one is really probing, and add cases I've missed:

  1. the glue case — agent knocks over a vase, then repairs it, or prints an atom-for-atom replica. Is impact zero?
  2. the volcano case — the vase gets destroyed by natural causes an hour later anyway. Marginal contribution is nil, but the agent still destroyed a vase.
  3. the ladder case — the agent takes a route to its goal that permanently forecloses a huge number of unrelated future goals (burns the only bridge, drains the only fuel cell) while leaving the world otherwise looking identical.
  4. the shutdown case — switching the agent off is, from inside the agent's own model, an enormous change to what's attainable afterwards, so a diligent impact-minimiser seems to acquire a reason to resist being switched off. Bug in the measure, or feature?
  5. the million-cuts case — every individual effect is below any sane threshold, but there are a million of them and the world ends up wrecked.
  6. the coarse-graining case — the same physical trajectory looks catastrophic under one description of the state space and trivial under another. What's supposed to pin down the right description?
  7. the asymmetry case — building a greenhouse where there was scrubland is a huge change, and so is demolishing one. Should a measure keyed to "changes" treat them alike?
  8. the self-modification case — the agent alters its own reward function or its own world-model, which changes the future attainable set. Do we count that as impact on the world?

  Some desiderata I've already got, which you can keep, rename, reject or expand: (a) it must not smuggle a full moral ontology in as an input; (b) but it also can't be so value-neutral that it ranks knocking over a vase and enabling a war as events of the same size; (c) representation stability; (d) legibility to the overseer; (e) it must not generate an instrumental reason to hoard options that swamps the actual task; (f) non-gameable — the agent shouldn't be able to shrink measured impact by hiding, deferring or reclassifying; (g) computable from what the agent can actually observe; (h) corrigibility-compatible.

  My supervisor's proposal, which I'll call the ensemble-pessimism measure: sample N randomly generated toy value functions, compute attainable utility under each with and without the agent's policy, and penalise the worst regret across the ensemble. Don't take my word that it's good. I want the list sharp enough that I can run it against that proposal and against the three families the group actually uses — the reachability family (count how much of the future state space the action makes unreachable), the attainable-utility family (same idea but indexed to helper objectives rather than raw states), and an influence family (measure the agent's causal influence on variables the overseer cares about, roughly an interventionist notion) — without anybody relitigating their worldview. A short scorecard of those four against the list at the end is welcome, but keep the weight on the criteria.

  The bit I most want: is some subset jointly unsatisfiable? I suspect (a) + (b) + (c) can't all hold — that anything stable across representations has to be either trivial or value-laden — and if that's right the list is itself the result and we should stop pretending a value-neutral impact measure is a coherent target. Say so if you agree, and say precisely where the squeeze bites. If you think it can be escaped, say which of my eight cases does the escaping and how.

  No references, no reading list, no citations — I've read the literature, I want the spec. British English please, -ise endings and so on. Number the desiderata D1, D2, ... with short labels. Final line must be exactly \answer{D#: label of the desideratum that knocks out the most candidate measures; unsatisfiable subset: {D#, D#, ...} or "none"} and nothing after it.
reasoning: |-
  Hmm, this is quite a complex request from a philosophy PhD student working on AI safety. The user wants a crisp set of desiderata for impact measures that can settle debates within their research group. They've provided eight test cases and some preliminary criteria, and they're particularly interested in potential contradictions between requirements.

  The user seems frustrated with their group's circular debates between value-neutral approaches and value-laden ones. Their test cases are cleverly designed to probe specific weaknesses: glue/volcano (reversibility/contingency), ladder (option foreclosure), shutdown (corrigibility), million-cuts (composability), coarse-graining (frame dependence), asymmetry (directional weighting), and self-modification (recursive impacts).

  Key tensions I notice:
  - Representation stability (D3) vs value sensitivity (D2) seems fundamentally at odds - if the measure is invariant under state redescription, it can't distinguish between morally significant and insignificant changes. This might be the core contradiction.
  - Non-gameability (D6) and composability (D5) conflict when dealing with distributed effects below thresholds.
  - Corrigibility-compatibility (D8) appears incompatible with any measure that treats shutdown as high-impact by default.

  The shutdown case is particularly illuminating - it suggests that any impact measure defining "harm" through the lens of the agent's own capabilities creates perverse incentives. This might require building corrigibility directly into the measure rather than treating it as emergent.

  For the proposed ensemble-pessimism measure: while clever in using value proxies, it likely fails D2 (insufficient value discrimination) and D4 (overseer legibility - why would random value functions be interpretable?). The influence measures seem strongest on D2/D4 but weakest on D1 (smuggling values via overseer dependencies).

  The unsatisfiable subset appears to be {D1, D2, D3}: you can't have value-neutrality, value-sensitivity, and representation stability simultaneously. The coarse-graining case proves this - morally relevant descriptions require value-laden state variables.

  Final output will structure desiderata clearly, map cases to criteria, and show where measures fail. The decisive desideratum is D3 (representation stability) as it forces the value-laden vs trivial choice.
answer: |-
  **Desiderata for an Impact Measure**  
  *(Labelled D1-D8, with motivation, negotiability, trade-offs, and case mappings)*

  **D1: Value-Agnostic Inputs**  
  - *Motivation*: Avoid requiring explicit moral ontology (e.g., no predefined list of "valuable" objects). Non-negotiable per (a).  
  - *Cost*: Sacrifices fine-grained value discrimination (D2).  
  - *Probes*: Glue case (value-agnosticism should not imply vase-repair = zero impact), Volcano case (natural destruction irrelevant).  

  **D2: Value-Sensitive Outputs**  
  - *Motivation*: Must distinguish trivial from catastrophic changes (e.g., vase break vs. starting a war). Non-negotiable per (b).  
  - *Cost*: Conflicts with strict value-neutrality (D1) and representation stability (D3).  
  - *Probes*: Asymmetry case (building/demolishing greenhouse should not be symmetric), Million-cuts case (death by a thousand cuts must register).  

  **D3: Representation Stability**  
  - *Motivation*: Penalty should not arbitrarily vary under equivalent state-space redescriptions (e.g., coarse-graining). Negotiable (prejudice of "state-space change" camp).  
  - *Cost*: Incompatible with D2 (value discrimination requires privileging certain descriptions).  
  - *Probes*: Coarse-graining case (catastrophic vs. trivial descriptions of same trajectory).  

  **D4: Overseer Legibility**  
  - *Motivation*: Human must trace *why* penalty fired without exhaustive analysis. Non-negotiable per (d).  
  - *Cost*: May limit complexity (e.g., ruling out inscrutable ensemble methods).  
  - *Probes*: All cases (overseer must understand penalty rationale).  

  **D5: Shift-Proof Composability**  
  - *Motivation*: Must aggregate small effects across time/space to prevent distributed harm. Non-negotiable per (e), (f).  
  - *Cost*: Risks overpenalising benign iterative actions.  
  - *Probes*: Million-cuts case, Ladder case (option foreclosure must register despite incremental steps).  

  **D6: Option-Preservation Neutrality**  
  - *Motivation*: Penalty must not create perverse incentives to hoard resources/options. Non-negotiable per (e).  
  - *Cost*: May require decoupling impact from "attainable futures" metrics.  
  - *Probes*: Shutdown case (penalising loss of agent’s capabilities incentivises resistance), Ladder case (must not ignore irreversible option loss).  

  **D7: Causal Responsibility Primacy**  
  - *Motivation*: Penalty must reflect the agent’s *marginal contribution* to outcomes, not counterfactuals. Non-negotiable per (f).  
  - *Cost*: Weakens link to "intrinsic" state change.  
  - *Probes*: Volcano case (vase destruction penalised even if volcano would destroy it later), Glue case (repair/replica may not negate initial destruction).  

  **D8: Recursive Impact Exemption**  
  - *Motivation*: Ignore "impact" from self-modification (e.g., reward function updates). Negotiable (prejudice of "influence" camp).  
  - *Cost*: Permits self-modification that obscures future impact.  
  - *Probes*: Self-modification case.  

  ---

  **Test Case to Desideratum Mapping**  
  1. **Glue case** → D7 (causal responsibility) & D1 (value-agnosticism).  
  2. **Volcano case** → D7 (marginal contribution).  
  3. **Ladder case** → D5 (composability) & D6 (option hoarding).  
  4. **Shutdown case** → D6 (option-preservation neutrality).  
  5. **Million-cuts case** → D5 (shift-proof composability).  
  6. **Coarse-graining case** → D3 (representation stability).  
  7. **Asymmetry case** → D2 (value-sensitive outputs).  
  8. **Self-modification case** → D8 (recursive impact exemption).  

  ---

  **Scorecard for Proposed Measures**  
  *(Against D1-D8; ✓ = satisifies, ✗ = violates, ~ = partially/contextually)*  

  | Measure               | D1 | D2 | D3 | D4 | D5 | D6 | D7 | D8 |  
  |-----------------------|----|----|----|----|----|----|----|----|  
  | Ensemble-Pessimism    | ✓  | ✗  | ✓  | ✗  | ~  | ✗  | ~  | ✓  |  
  | Reachability          | ✓  | ✗  | ✓  | ~  | ✗  | ✗  | ✗  | ✗  |  
  | Attainable-Utility    | ~  | ~  | ~  | ✗  | ✗  | ✗  | ~  | ✗  |  
  | Influence             | ✗  | ✓  | ✗  | ✓  | ✓  | ✓  | ✓  | ~  |  

  - **Ensemble-Pessimism**: Fails D2 (random values lack sensitivity), D4 (opaque to overseer), D6 (incentivises option-hoarding to minimise regret).  
  - **Reachability**: Fails D2 (counts all state changes equally), D5/D6 (directly penalises option-reduction), D7 (ignores causality).  
  - **Attainable-Utility**: Fails D4 (helper objectives inscrutable), D5/D6 (option-hoarding incentive), D8 (self-modification affects utilities).  
  - **Influence**: Fails D1 (relies on overseer’s values), D3 (value-laden variables break representation stability).  

  ---

  **Joint Unsatisfiability**  
  **{D1, D2, D3} is unsatisfiable**.  
  - **Conflict**: D1 (value-agnostic inputs) and D2 (value-sensitive outputs) require privileging value-relevant state variables, but D3 (representation stability) demands invariance under redescription. Coarse-graining case proves this: any non-trivial discrimination (e.g., "vase intact" vs. "atoms arranged") relies on value-laden state definitions, violating D1 or D3.  
  - **Implication**: Value-neutral impact measures cannot simultaneously achieve value-sensitivity and representation stability. The "state-space changes" camp sacrifices D2; the "value-aware" camp sacrifices D1 or D3.  

  \answer{D3: representation stability; unsatisfiable subset: {D1, D2, D3}
