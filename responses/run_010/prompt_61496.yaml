prompt: |-
  Every other week I take the ethics pager for the county hospital across town — the philosophy department has this arrangement with them and I'm the "ethics resource," which in practice means a resident or a social worker calls me at eleven at night to ask whether they can put a tube in somebody. A lot of these are advance-directive calls, and I've had to admit to myself that I don't actually have a procedure for them. I have intuitions and a reading list, and neither one is any use to a tired ICU fellow on the phone.

  So write me a decision procedure I could hand to that fellow — or to a social worker, somebody with no philosophy — and have them run it in about twenty minutes on a directive conflict. Ground it in what's actually load-bearing here: the earlier-self-versus-now-self problem; Dworkin's distinction between interests in how a particular moment feels and interests in how a whole life goes, and the argument that the earlier self gets to bind the later one; and the counterargument, which I think is stronger than I used to, that we simply don't know what its like to be the patient in the bed now, so we shouldn't be so sure what she'd want. If you think the honest answer is graded rather than binary — that how much a directive counts for depends on how much the person in the bed is still psychologically the person who wrote it — then build that in as a real step with a real test, not a footnote, and tell me what evidence obtainable at 11 p.m. on a night shift could possibly bear on it.

  Here's the wrinkle I keep hitting that I want handled explicitly. I think there are two different things a directive can be and the whole debate talks as if there were one: an instruction ("do not intubate me") and a piece of testimony about why the person thought that ("because I watched my father spend two years unable to swallow and I don't want my kids watching that with me"). When the testimony is there and the stated reason no longer applies — the patient isn't suffering, isn't watching anything, seems genuinely okay — does the instruction still bind? Give me a step for this and tell me straight which way you came out, because I lean hard toward the instruction binding regardless and I want to know if your procedure has to overrule me.

  Then the mechanics. Questions in order; for each one, what counts as a sufficient answer and what counts as "we don't know, so escalate"; where the procedure stops at a flat no; where it hands the decision to a human because the question is about values rather than facts — and *which* human, since at that hour it's a covering attending who hasn't read the chart; what gets written in the note; and what to do with a directive that's thirty years old, or five words long, or contradicted by something the patient said last month while arguably still competent. Also one line on where you send the calls where there's no directive at all, which is honestly half of them. Don't give me a bibliography, I know the literature, I want the machinery.

  Then run it on three cases. One: a 79-year-old with moderate dementia whose directive refuses antibiotics for pneumonia; he's cheerful, sings along to the radio, asks for ice cream three times a day; his daughter wants him treated and says her father is "not the man who wrote this." Two: a woman in her forties with Huntington's whose directive says no feeding tube once she stops recognizing her children; she still recognizes them, but she's stopped eating enough and losing weight fast, and when asked she says "I'm not hungry" and ten minutes later says "when can I go home." Three: a man who wrote what the psychiatrists call a Ulysses contract — during a stable stretch he directed that he be given a particular medication if he became manic and refused; he is now manic, refusing, arguing articulately that he's fine, and asking to revoke the directive. For that last one the procedure has to answer the revocation question head-on: can the self at the mast cut the ropes?

  Finish with where this thing will misfire. Not the hard cases it struggles with — the systematic failures, and the spots where it will generate a defensible-sounding answer that's really just the caller's gut wearing a flowchart.
reasoning: |-
  We are designing a decision procedure for advance directive conflicts in a clinical setting. The goal is to provide a clear, step-by-step guide that can be used by non-philosophers (e.g., residents, social workers) in about 20 minutes.

   Core Principles:
   1. Dworkin's distinction between experiential interests (how a moment feels) and critical interests (the overall shape and meaning of one's life). Critical interests are the focus of advance directives, and the earlier self is generally seen as having the authority to bind the later self to protect the narrative integrity of the life as a whole.
   2. However, we must acknowledge the epistemic gap: we cannot fully know what it is like to be the patient now, so we must be cautious about overriding the current expressions of the patient (if any) in favor of the directive.
   3. The directive can serve two roles: as an instruction (a command) and as testimony (evidence of the person's values and reasons). We must consider whether the reasons given in the directive still apply.

   The procedure will be graded: the weight of the directive depends on the degree of psychological continuity between the person who wrote the directive and the current patient.

   Steps:
   1. We start by gathering the necessary information (advance directive, current condition, etc.).
   2. We then go through a series of questions in order. At each step, we either get an answer that allows us to proceed, or we hit an ambiguity that requires escalation (to the covering attending, ethics consultant, or legal counsel as appropriate).
   3. When the question is about values (e.g., what counts as a life worth living) and not facts, we must hand the decision to a human (the covering attending, but note they haven't read the chart; so we may need to provide a summary and have them review key points quickly).
   4. We must also handle issues like the age of the directive, brevity, and contradictions.

   The Procedure:

   Step 0: Is there an advance directive?
     - If no: then the decision is made by the appropriate surrogate (next of kin, healthcare proxy) based on substituted judgment or best interests. This is not the focus of this procedure. (We'll have one line on this at the end.)

   Step 1: Verify the directive's applicability.
     a. Is the current situation covered by the directive? (e.g., the directive specifies "terminal illness" and the patient is in a terminal condition; or it specifies "dementia" and the patient has dementia.)
        - If not clear: escalate to covering attending for determination (with note that if the condition is not covered, the directive does not apply and decision falls to surrogate).
     b. Is the directive valid and legally executed? (This is usually already established, but if there's doubt, escalate to risk management or legal.)
     c. Is there a healthcare agent (proxy) appointed? If yes, the agent's decision overrides the directive unless the agent is acting against the patient's known wishes.

   Step 2: Assess the patient's current condition and capacity.
     a. Does the patient have decision-making capacity for the current decision?
        - If yes: then the patient's current decision overrides the advance directive. (The patient can revoke the directive.)
        - If no: proceed.
        - If unsure: consult psychiatry if available, or the covering attending. If capacity cannot be determined, escalate.

   Step 3: Evaluate psychological continuity (the graded factor).
     - We want to assess: how much is the current patient still the same person who wrote the directive? This is the key to how much weight we give the directive.
     - Evidence to consider (obtainable at 11 p.m.):
          * Does the patient recognize close family/friends? (If they did before and now don't, that's a loss of continuity.)
          * Can the patient articulate any consistent values or life narrative? (e.g., "I'm a fighter", "I value independence", etc.)
          * Is there evidence of the patient's past values in current behavior? (e.g., a formerly independent person who now seems content being cared for might indicate a shift in values; or someone who was always tidy and still is.)
          * How severe is the cognitive impairment? (e.g., mild dementia might have more continuity than severe.)
          * How recent are the expressions in the directive? (But note: a 30-year-old directive from a healthy 40-year-old might not reflect the same person as an 70-year-old with dementia, but we also have to consider that the directive might have been updated.)

     We will use a simple scale (low, medium, high) based on available evidence:

          High continuity: The patient can still discuss their values and life narrative, and these are consistent with the directive. They recognize close ones and can engage in meaningful conversation about their life.

          Medium continuity: The patient has significant cognitive impairment but still shows some connection to their past (e.g., recognizes family, has moments of clarity, or expresses values that are consistent with the past).

          Low continuity: The patient has profound impairment, does not recognize close ones, and shows no evidence of connecting to their past identity or values.

     - How to decide? The team (nurse, social worker, resident) should discuss the available evidence and assign a category. If there is disagreement or uncertainty, escalate to the covering attending for a final call.

   Step 4: Analyze the directive: instruction vs. testimony.
     a. Does the directive contain both an instruction and the reasons (testimony) for that instruction?
        - If no (just an instruction): then the instruction stands unless there is clear evidence that the patient's current condition is so different that the instruction is inapplicable (see Step 1). But note: without testimony, we don't know the specific reasons, so we rely on the instruction as written.
        - If yes: then we must consider whether the reasons given still apply.

     b. If the directive includes testimony (reasons), then ask: do the reasons given still apply to the current situation?
          * Example: the directive says "no tube feeding because I don't want to live if I can't recognize my family." Now the patient doesn't recognize family -> reason applies.
          * But what if the patient doesn't recognize family but is happy? The reason might have been about avoiding a state of unawareness and suffering, but now the patient is not suffering. However, note the reason was about recognition, not about suffering.

          We must be cautious: the directive's instruction is binding even if the current state is not as bad as the person imagined, unless the directive explicitly conditions the instruction on the reason.

          How to handle:
            - If the reason is stated as a condition (e.g., "if I am in a persistent vegetative state, then..."), then we must check if the condition is met.
            - If the reason is given as an explanation but the instruction is unconditional (e.g., "I do not want tube feeding under any circumstances once I have advanced dementia"), then the instruction stands regardless of whether the patient is happy or not.

          But what if the reason is explicitly tied to avoiding suffering, and now the patient is not suffering? Then we might question the applicability.

          We propose:
            - If the directive explicitly states that the instruction is conditional on the reason (e.g., "because I don't want to suffer, and if I am not suffering then this does not apply"), then we can re-evaluate. But such explicitness is rare.
            - Otherwise, we treat the instruction as binding. The earlier self made a decision about critical interests, and we respect that.

          Therefore, we come out on the side that the instruction binds regardless of whether the current state matches the anticipated suffering, unless the directive itself makes the condition explicit.

   Step 5: Assess for revocation or conflicting expressions.
     a. Has the patient, after losing capacity, expressed any wishes that contradict the directive? (e.g., a patient with dementia who now says "I want to live" when the directive said no life-prolonging treatment.)
          - We must consider the context: if the patient has low psychological continuity (Step 3), then these expressions may not reflect the same critical interests and might be driven by immediate experiential interests. In such a case, we give more weight to the directive.
          - If the patient has high continuity and expresses a clear, consistent change of mind, then we might consider that the directive is overridden. But note: without capacity (Step 2) the patient cannot formally revoke. However, if the patient has high continuity and expresses a change, we should take that very seriously and escalate to the attending and ethics (if available) for a case-by-case decision.

     b. Are there any other written or oral statements that contradict the directive? (e.g., the patient said something last month while arguably competent that contradicts the directive.)
          - If the conflicting statement is more recent and the patient had capacity at that time, then the more recent statement overrides the directive. But we must be cautious: was the patient under duress? Was it a casual comment or a formal change? If there is doubt, escalate.

   Step 6: Consider the age of the directive and other factors.
     - How old is the directive?
          * If it is very old (e.g., 30 years) and there is no evidence of review, and especially if the patient's condition or medical options have changed significantly, then we may question its applicability. However, without evidence of revocation, it remains valid. We must look for more recent expressions (Step 5b). If there are none, the directive stands.
     - Is the directive extremely brief (e.g., 5 words: "Do not resuscitate me")?
          * Then we have no testimony to interpret, so we follow the instruction literally. We must be cautious to ensure the situation is covered (Step 1).

   Step 7: Make a recommendation.
     - After gathering the above, we can assign a weight to the directive and determine whether to follow it.

     We propose a decision grid:

     Psychological Continuity | Directive Contains Testimony? | Reasons Still Apply? | Contradictory Expressions? | Recommendation
     -----------------------------------------------------------------------------------------------------------------
     High                     | Yes                          | Yes                   | No                          | Follow directive
     High                     | Yes                          | No                    | No                          | Follow directive (because the instruction is binding unless conditional and condition not met, and we default to binding unless conditional language is explicit)
     High                     | Any                          | Any                   | Yes (and patient has high continuity) | Escalate to attending and ethics (because the patient now, with high continuity, might be changing their mind)

     Medium                   | ...                          | ...                   | ...                         | We generally follow the directive unless there is strong evidence that the current patient's condition is not what was anticipated and the directive's reasons are clearly inapplicable. But note: the current patient's expressions (if any) might be given some weight. However, the directive still has significant weight. If there is a contradiction, we might lean toward the directive but escalate if the contradiction is strong.

     Low                      | ...                          | ...                   | ...                         | The directive has less weight. We still follow it unless there is evidence that the current patient is experiencing a life that the earlier self would not have wanted to avoid (e.g., the patient is happy and the directive was based on avoiding suffering that isn't present). But note: without testimony we don't know. So we must look for other evidence.

     However, we need a more streamlined approach. Instead, we break it down:

     a. If the patient has high psychological continuity and has expressed a contradictory wish (and that expression is consistent and clear), then we do not follow the directive and instead follow the current expression (with escalation for confirmation).
     b. Otherwise, we follow the directive unless:
          - The directive's conditions (if any) are not met (Step 4).
          - The directive is very old and there is evidence that the patient changed their mind (Step 6).
          - The patient has low psychological continuity and the directive's stated reasons (if available) do not apply (e.g., the directive was based on avoiding suffering and the patient is now not suffering). In that case, we might override the directive.

     But note: overriding the directive is a big step. We require escalation to the covering attending and, if possible, an ethics consult (by phone). The attending must make the final call.

     Therefore, the procedure:

     After Step 1-6, if the directive is applicable and the patient does not have capacity, then:

     - If the patient has high continuity and has clearly expressed a contradictory wish (and the expression is recent and consistent), then do not follow the directive and instead follow the current wish (with attending approval).
     - Else, if the directive's stated condition (if any) is not met, then the directive does not apply -> decision falls to surrogate.
     - Else, if the patient has low continuity AND the directive provides testimony (reasons) AND the reasons clearly do not apply (e.g., the directive says "because I don't want to be a burden" and the family says they are happy to care, or "because I don't want to live in a state of suffering" and the patient is now not suffering) AND there is no contradictory expression from the patient, then we may override the directive and treat. But this requires escalation to the covering attending and ethics (if available). The attending must document the rationale.
     - Otherwise, follow the directive.

   Step 8: Documentation and escalation.
     - If at any step there is uncertainty or disagreement, escalate to the covering attending. The attending may then choose to escalate to an ethics consult or legal.
     - Documentation should include:
          * The advance directive and its source.
          * The patient's current condition and capacity assessment.
          * The assessment of psychological continuity (with evidence).
          * The analysis of the directive (instruction and testimony, and whether reasons apply).
          * Any contradictory expressions.
          * The final decision and rationale.

   Now, the wrinkle: the directive as instruction vs. testimony.
     We came out that the instruction binds unless:
        a) The directive explicitly conditions the instruction on the reason (and the reason doesn't hold) OR
        b) The patient has low psychological continuity and the reason (if known) does not apply AND the current patient is not suffering in the way the directive sought to avoid.

     But note: the instruction is a command from the earlier self. We should not lightly override it. Our procedure only allows overriding in the case of low continuity and inapplicable reasons. And even then, with escalation.

   Cases:

   Case 1: 79-year-old with moderate dementia, directive refuses antibiotics for pneumonia. He's cheerful, sings, asks for ice cream. Daughter says he's not the man who wrote it.

     Step 1: Applicable? (Assume the directive covers dementia and this pneumonia is a complication of dementia -> applicable.)
     Step 2: Capacity? (Moderate dementia -> likely lacks capacity for this decision. Proceed.)
     Step 3: Psychological continuity?
          - He has moderate dementia: he may recognize family? The case doesn't say. He is cheerful and engaged in simple pleasures. He does not seem to connect to his past identity (we don't know). Let's assume he recognizes family sometimes but often forgets. We'll say medium to low continuity.
     Step 4: Directive: we don't know if it includes testimony. Assume it says: "If I have dementia and get an infection, I do not want antibiotics because I do not want to prolong a life without my mental faculties." The reason: avoiding a life without mental faculties. But now, he has some enjoyment (ice cream, singing). Does the reason still apply? He has lost mental faculties, but he is happy. The directive didn't condition on suffering; it conditioned on loss of faculties. So the reason still applies? The instruction is unconditional about refusing antibiotics in this situation.

     Step 5: Contradictory expressions? He hasn't expressed a wish about antibiotics. He says he wants ice cream, which is about immediate pleasure, not about treatment.

     Step 6: Age of directive? Not specified. Assume recent enough.

     Step 7: 
          - Continuity: medium/low -> but not high, so we don't have a clear contradictory expression to consider.
          - The directive's reason (loss of faculties) still holds. So we would follow the directive and not give antibiotics.

     However, the daughter is objecting. She is the surrogate? The case doesn't specify a proxy. If she is the surrogate and there's no appointed proxy, then without a directive she would decide. But the directive is present and applicable. The daughter's view that he is "not the man" is considered in the continuity assessment (which we put as medium/low). But the directive still stands.

     But note: we might be in the situation of low continuity and the reason might be seen as not applying? The reason was about avoiding a life without mental faculties, but now he is happy. However, the directive did not condition on suffering. It is about the loss of faculties. So we would not override.

     However, if the directive said "because I don't want to suffer the indignity of dementia" and now he is not suffering, then we might question. But the case doesn't give that testimony.

     Our procedure: without explicit conditioning, we follow the directive. So we would not give antibiotics.

     But note: the daughter might challenge. We would escalate to the attending and ethics. The attending might decide to treat, but the procedure says not to.

     Alternatively, if we assess continuity as low and the directive had testimony about avoiding suffering (and he isn't suffering), then we might override. But the case doesn't say the directive had that testimony.

     So by the procedure, we would not treat.

   Case 2: Woman with Huntington's. Directive: no feeding tube once she stops recognizing her children. She still recognizes them, but she's stopped eating and is losing weight. When asked, she says "I'm not hungry" and then "when can I go home."

     Step 1: Applicable? The directive condition (stops recognizing children) is not met -> the directive does not apply. Therefore, we do not follow the directive's instruction about feeding tubes. We must make a decision without the directive.

     But note: the directive might be interpreted as evidence of her wishes. However, the condition is not met. So we move to best interests or surrogate decision.

     Step 2: Capacity? She has Huntington's, which affects cognition. We need a capacity assessment for the decision about a feeding tube. She says "I'm not hungry" and "when can I go home." Does she understand the consequences of not eating? If she lacks capacity, then we rely on surrogate.

     Step 3: Without an applicable directive, we don't need the continuity assessment for the directive. But we note she still recognizes children -> high continuity? But her cognitive status might be impaired.

     The procedure for no directive: use surrogate decision-maker (if she has one) or next of kin. They would decide based on substituted judgment or best interests.

     However, note: the directive shows that she did not want a feeding tube at a later stage. But she is not at that stage. So we cannot use the directive to refuse the feeding tube now.

     Therefore, we would treat this as a capacity decision: if she has capacity and is refusing food, we respect that. If she lacks capacity, then we ask her surrogate. If she has no surrogate, then we use best interests.

     But the procedure for advance directives stops at Step 1: condition not met -> directive does not apply.

   Case 3: Man with a Ulysses contract: directed that he be given a particular medication if he became manic and refused. Now manic, refusing, and asking to revoke.

     Step 1: Applicable? Yes, he is manic and refusing -> the condition is met.

     Step 2: Capacity? He is manic. We must assess capacity for the decision about the medication. Mania can impair capacity. He is arguing articulately, but mania can affect judgment. We need a capacity evaluation.

          - If he has capacity: then he can revoke the directive. The procedure says: if the patient has capacity, then the current decision overrides.
          - If he lacks capacity: then we proceed.

     Assume we determine he lacks capacity (because his mania impairs his understanding or appreciation of the need for medication).

     Step 3: Psychological continuity: in mania, there is often a break in continuity. He is not the same as when stable. We might rate continuity as low during acute mania.

     Step 4: Directive: it is an instruction (give medication) and it includes testimony (to prevent the harm of mania). The reason (mania) applies.

     Step 5: Contradictory expressions: he is now refusing and asking to revoke. But he lacks capacity. So we do not take this as a valid revocation.

     Step 6: Age? Assume recent.

     Step 7: 
          - He lacks capacity and the directive condition is met.
          - Continuity is low -> but note: the directive was designed for exactly this break in continuity. We are to follow the directive.

     Therefore, we override his current refusal and give the medication.

     However, note: he is asking to revoke. But without capacity, he cannot revoke. The Ulysses contract is binding.

     But what if he had high continuity? In mania, continuity is typically low. If we found high continuity (which would be unusual) and he expressed a clear change of mind, we would escalate. But in mania, even if articulate, the capacity is impaired.

     So we follow the directive.

   Finally, where this will misfire:

    1. Psychological continuity is hard to assess. We are using a crude scale. At 11 p.m., the evidence might be thin. We might misclassify.

    2. The distinction between instruction and testimony, and whether the reason still applies, is often subtle. The directive might be ambiguous. We might err by being too literal.

    3. The procedure might be too rigid in following the directive in cases where the patient (with low continuity) is happy and the directive's reasons were about avoiding suffering. But we require escalation for that override.

    4. In Case 2, the directive didn't apply because the condition wasn't met. But the patient is losing weight and the condition (not recognizing children) hasn't occurred. This might lead to treatment that the patient would have refused if she had known that she would stop eating before losing recognition. But the directive didn't cover that.

    5. The procedure relies on the covering attending, who might not have read the chart, to make value-laden decisions. This is a weak point.

    6. The assessment of capacity at 11 p.m. might be rushed.

    7. The procedure might be biased toward the caller's gut feeling in the continuity assessment or the reason applicability.

    8. The Ulysses contract case might be controversial: some argue that the current self, even in mania, should have a say. But our procedure follows the directive.

    9. The procedure might overrule family members who have deep knowledge of the patient.

    10. The one-size-fits-all might not capture cultural or individual variations in how people view their past and present selves.

   We must document thoroughly and encourage ethics consultation when in doubt.

   One line for no directive: 
     - If there is no advance directive, then follow standard surrogate decision-making: use the healthcare proxy if appointed, otherwise next of kin. The surrogate should use substituted judgment (what the patient would have wanted) if known, otherwise best interests.

   We present the procedure in a flowchart or step-by-step worksheet.
answer: |-
  ### Decision Procedure for Advance Directive Conflicts in Acute Care Settings  
  **Goal:** Provide a clear, step-by-step guide for clinicians/social workers to resolve directive conflicts in ~20 minutes, grounded in ethical principles (Dworkin's critical/experiential interests, psychological continuity, and the epistemic gap). Focuses on practical, obtainable evidence.  

  ---

  #### **Key Principles Embedded**  
  1. **Critical vs. Experiential Interests (Dworkin):**  
     - **Critical interests:** "Whole-life" values (e.g., dignity, autonomy, narrative coherence). The directive represents the earlier self’s binding authority over critical interests.  
     - **Experiential interests:** Current comfort/pleasure (e.g., pain, joy). The *current* patient’s experiential state does **not** automatically override the directive.  
  2. **Psychological Continuity (Graded Weight):**  
     - The directive’s weight depends on how much the patient is "still the person" who wrote it. Assess via observable evidence (see **Step 3**).  
  3. **Instruction vs. Testimony:**  
     - **Instruction:** Binding unless conditions unmet or revocation valid (earlier self binds later self).  
     - **Testimony (reasons):** Contextual but **not** dispositive. If reasons no longer apply, the instruction *still binds* unless the directive explicitly ties the instruction to those reasons (rare). **Your lean is upheld:** Instructions bind regardless of current happiness unless conditional.  
  4. **Epistemic Gap:** We cannot fully know the current patient’s subjective experience → Default to the directive unless strong evidence of discontinuity or explicit revocation.  

  ---

  ### **The Procedure**  
  **Who Runs It:** Resident, social worker, or covering clinician.  
  **Time:** ≤20 minutes.  
  **Escalation Points:** Covering attending (if values decision) or ethics/legal (if ambiguity). Always document rationale.  

  #### **Step 0: Immediate Triage**  
  - **Is there an advance directive (AD)?**  
    - *No (or unclear)* → Hand off to surrogate decision-maker (proxy/next of kin). Use substituted judgment or best interests. **Stop here.**  
    - *Yes* → Proceed.  
  - **Acute crisis?** (e.g., coding patient) → Follow AD if immediately actionable (e.g., "DNR"). If unclear, provide life-sustaining treatment until resolved.  

  #### **Step 1: Directive Applicability**  
  **Question:** Does the AD *cover this exact situation*?  
  - *Check:* AD’s specified conditions (e.g., "dementia," "terminal illness," "unable to recognize family").  
  - **Sufficient answer:**  
    - ✅ **Yes** → Proceed to Step 2.  
    - ❌ **No** → Directive **does not apply**. Defer to surrogate. **Stop.**  
    - ❓ **Unclear** → Escalate to covering attending + chart review.  
  - **Document:** "AD condition: [X]. Current condition: [Y]. Match? [Yes/No/Unclear]."  

  #### **Step 2: Patient Capacity Assessment**  
  **Question:** Can the patient *currently* make this decision?  
  - **Assess via:** Simple 3-step test (obtainable in 10 mins):  
    1. **Understands** options/outcomes (e.g., "What happens if we don’t insert the tube?").  
    2. **Appreciates** relevance to self (e.g., "How does this affect YOU?").  
    3. **Reasons consistently** (e.g., "Tell me why you want this.").  
  - **Sufficient answer:**  
    - ✅ **Has capacity** → Patient’s current choice overrides AD. **Stop.**  
    - ❌ **Lacks capacity** → Proceed to Step 3.  
    - ❓ **Unclear** → Escalate to covering attending (+ psychiatry if available).  
  - **Document:** "Capacity assessed: [Yes/No]. Evidence: [Patient quotes/behavior]."  

  #### **Step 3: Psychological Continuity (Graded Weight Test)**  
  **Question:** How much is the patient *still the person* who wrote the AD?  
  - **Evidence (gather in 5 mins):**  
    - **Recognition:** Does patient recognize close family/friends? (e.g., "Who is visiting you today?")  
    - **Values/Narrative:** Can patient articulate past values? (e.g., "What mattered most to you in life?"). Consistency with AD?  
    - **Behavioral Cues:** Does patient exhibit lifelong traits? (e.g., independence, religiosity, humor).  
    - **Cognitive Baseline:** Compare to pre-illness (ask family/staff: "How is she different now?").  
  - **Continuity Score (assign based on evidence):**  
    - **High:** Recognizes family, articulates values consistent with AD, minimal behavioral shift.  
    - **Medium:** Partial recognition, fragmented values, moderate behavioral shift.  
    - **Low:** No recognition, no value coherence, profound behavioral shift (e.g., no self-awareness).  
  - **Sufficient answer:** Assign score. If unclear, escalate to covering attending.  
  - **Document:** "Continuity: [High/Med/Low]. Evidence: [Quotes/observations]."  

  #### **Step 4: Instruction vs. Testimony Analysis**  
  **Question:** Is the AD an *instruction* (command) or *testimony* (reason), or both?  
  - **Action:**  
    1. **Identify instruction** (e.g., "Do not intubate").  
    2. **Identify testimony** (e.g., "because I fear suffering").  
  - **Apply:**  
    - **Testimony outdated?** (e.g., AD cites "avoid suffering," but patient is now pain-free).  
    - **Does testimony *explicitly* condition the instruction?** (e.g., "If I am suffering, do not treat").  
  - **Key Rule:**  
    > **Instruction binds UNLESS testimony is explicitly conditional AND condition unmet.**  
    - *Example:* AD says "No feeding tube *because* I hate being dependent." Patient now content → **Still bind to instruction** (critical interest in dignity remains).  
    - *Exception:* AD says "No feeding tube *only if* I appear to be suffering" → Re-evaluate if condition unmet.  
  - **Sufficient answer:**  
    - ✅ **Instruction stands** → Proceed to Step 5.  
    - ❓ **Conditional + condition unmet** → Escalate to covering attending.  
  - **Document:** "Instruction: [X]. Testimony: [Y]. Binding? [Yes/Unclear]."  

  #### **Step 5: Revocation & Conflicting Evidence**  
  **Question:** Is there evidence the patient *changed their mind*?  
  - **Assess:**  
    - **Recent competent statements** (≤6 months) contradicting AD? (e.g., "Last month he said he wanted all treatments.").  
    - **Current expressions** (if any) during incapacity? (e.g., "I want the tube" vs. AD’s refusal).  
  - **Weighting:**  
    - **High continuity + contradiction** → Override AD (escalate to attending).  
    - **Low/medium continuity + contradiction** → Directive prevails (current self’s experiential interest ≠ critical interest).  
  - **Revocation request?** (e.g., "I cancel my AD") → Valid **only** if patient has capacity (Step 2). If incapacitated, ignore.  
  - **Sufficient answer:**  
    - ✅ **No conflict** → Follow AD.  
    - ⚠️ **Conflict + high continuity** → Escalate to attending.  
    - ❌ **Conflict + low/med continuity** → Follow AD.  
  - **Document:** "Conflicting evidence: [Quotes/dates]. Weight given: [Full/partial/none]."  

  #### **Step 6: Directive Integrity Check**  
  **Question:** Is the AD reliable *despite age/brevity*?  
  - **Assess:**  
    - **Age:** >10 years old? → Check for updates (ask proxy: "Did he ever mention changing it?").  
    - **Brevity:** <10 words? → Accept as literal instruction (no testimony to analyze).  
    - **Ambiguity:** Self-contradictory? → Escalate to attending/ethics.  
  - **Rule:**  
    > **Presume validity unless evidence of revocation.** Age/brevity alone don’t invalidate.  
  - **Sufficient answer:**  
    - ✅ **Reliable** → Proceed to final decision.  
    - ❓ **Unreliable** → Escalate.  
  - **Document:** "AD age: [X]. Length: [Brief/full]. Reliability: [High/low]."  

  #### **Final Decision & Escalation**  
  - **Follow AD if:**  
    - Applicable (Step 1) + Incapacity (Step 2) + No valid revocation (Step 5) + Instruction binds (Step 4).  
  - **Override AD only if:**  
    1. Patient has capacity (Step 2), OR  
    2. High continuity + explicit contradiction (Step 5), OR  
    3. Testimony is explicitly conditional AND condition unmet (Step 4).  
  - **Escalate to covering attending for:**  
    - Unclear applicability (Step 1), capacity (Step 2), or conditional testimony (Step 4).  
    - Values conflicts (e.g., "Is this life worth living?").  
    - **Attending’s role:** Review chart, call family/proxy, make final call. Document: "Attending override due to [reason]."  
  - **Ethics/legal escalation:** Disputes, legal ambiguity, or no consensus.  

  ---

  ### **Case Applications**  
  #### **Case 1: 79M, Dementia, AD Refuses Antibiotics for Pneumonia**  
  - **Step 1:** AD covers "dementia + infections" → Applicable.  
  - **Step 2:** Moderate dementia → Lacks capacity.  
  - **Step 3:** **Low continuity** (cheerful, no recognition? Sings but no value articulation).  
  - **Step 4:** AD instruction: "No antibiotics." Testimony: "Avoid prolonged decline" (assumed). Testimony outdated? He’s happy, but instruction is not conditional → **Binds**.  
  - **Step 5:** Daughter says "not the same man" → Proxy opinion ≠ patient’s voice. No patient contradiction.  
  - **Step 6:** AD age? Unknown → Presume valid.  
  - **Decision:** **Follow AD → No antibiotics.**  
  - **Escalation?** Only if daughter is proxy and insists → Attending resolves proxy conflict.  

  #### **Case 2: 40sF, Huntington’s, AD Refuses Feeding Tube "When Stops Recognizing Family"**  
  - **Step 1:** AD condition: "Stops recognizing children." **Not met** (still recognizes) → **AD does not apply.**  
  - **Step 2:** Assess capacity: She says "I’m not hungry" but asks "When home?" → Likely lacks capacity (no understanding).  
  - **Since AD inapplicable:** Defer to surrogate/proxy. If none, use best interests (treat unless suffering).  
  - **Document:** "AD condition unmet → Surrogate decision."  

  #### **Case 3: Man, Ulysses Contract for Mania Medication**  
  - **Step 1:** AD covers "mania + refusal" → Applicable.  
  - **Step 2:** Manic, refusing → **Lacks capacity** (impaired judgment despite articulateness).  
  - **Step 3:** **Low continuity** (mania disrupts identity).  
  - **Step 4:** Instruction: "Give medication." Testimony: "Prevent harm of mania." Binds.  
  - **Step 5:** Requests revocation → **Invalid** (incapacitated).  
  - **Decision:** **Follow AD → Give medication against refusal.**  
  - **Escalation?** Only if psychiatry questions capacity assessment.  

  ---

  ### **Where This Misfires (Systematic Risks)**  
  1. **Psychological Continuity Assessment:**  
     - **Risk:** Over-reliance on staff/family anecdotes → Bias toward current quality of life (e.g., "He’s happy now, ignore AD").  
     - **Mitigation:** Require direct quotes/observations; escalate ambiguous cases.  
  2. **Testimony Misinterpretation:**  
     - **Risk:** Confusing testimony for conditions (e.g., "because I fear suffering" read as "only if suffering").  
     - **Mitigation:** Strict rule: Only override if explicit conditional language.  
  3. **Capacity Errors:**  
     - **Risk:** Rushed exams → False capacity (e.g., articulate manic patient) or false incapacity (e.g., dementia patient with intact preferences).  
     - **Mitigation:** Standardized 3-step test; escalate uncertainties.  
  4. **Proxy Pressure:**  
     - **Risk:** Proxies (e.g., daughter in Case 1) sway decisions away from AD.  
     - **Mitigation:** Document AD as primary authority; attending reviews conflicts.  
  5. **Epistemic Gap Exploitation:**  
     - **Risk:** Using "we can’t know the patient’s mind" to justify overriding AD for "best interests."  
     - **Mitigation:** Anchor in Dworkin (critical interests > experiential).  
  6. **Bureaucratic Creep:**  
     - **Risk:** Flowchart used to rubber-stamp clinician’s gut call (e.g., skipping continuity evidence).  
     - **Mitigation:** Mandatory documentation at each step; random ethics audits.  

  **Final Note:** This procedure prioritizes the earlier self’s critical interests but admits uncertainty in low-continuity states. It reduces variability while flagging hard cases for human judgment. Refine with real-world feedback.
