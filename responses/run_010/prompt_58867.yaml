  Crucially, the prose must resist interpretation. When Nadia presses the absent door, I won't describe her feelings - just the physical actions. The ethogram passage will be clinical: "Subject approaches incubator..." then seamlessly return to her perspective. 

  Last lines should hover in ambiguity. Maybe: "She wrote 21:07." or "The pencil point snapped." or "Outside, a streetlamp flickered on." Each implies something different about continuity. 

