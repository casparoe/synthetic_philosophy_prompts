answer: |-
  The colony room hummed, a low thrumming beneath the fluorescent glare. Nadia stood before the incubator, its brushed steel door cool under her fingertips. The final act. She placed the heel of her right hand firmly against the latch, pressed once—a solid, satisfying *thunk* of confirmation. Then, precisely, she pressed again, the same spot, the same pressure. *Thunk*. Two distinct impacts. Only then did she turn to the logbook resting on the adjacent bench. She picked up the pencil, its wood worn smooth, and inscribed the time: 20:48. The graphite left a soft, precise mark. She slid the pencil back into the coil binding. Done.

  Outside, the night air was a relief after the incubator’s warmth. Nadia walked the familiar route home, past the biology building’s loading dock where a streetlamp cast a cone of light onto the packed earth. She paused, not for the first time. In the illuminated circle, a small, iridescent wasp struggled. *Scleroderma*, her study organism. This one was dragging a paralyzed caterpillar nearly twice its size towards a barely visible hole in the dirt. With immense effort, the wasp hauled the grey-green bundle to the burrow’s entrance and left it precisely on the threshold. Then, antennae waving, it vanished down the hole. Nadia waited.

  After a minute, the wasp reappeared, clambered over the caterpillar, palpated it briefly, then seized it anew and dragged it backwards into the dark.

  Nadia knew the literature. Knew the theory. If she nudged the caterpillar six inches away with the toe of her boot while the wasp was underground, the insect would emerge, search, find its prey, drag it painstakingly back to the threshold, re-enter the burrow alone, re-emerge, and only then proceed to drag the caterpillar inside. It would repeat this sequence indefinitely, no matter how many times the caterpillar was displaced. The threshold check was non-negotiable. It wasn't caution; it was a step in the sequence as vital as the sting itself.

  Des was making pasta when she got in, the kitchen fragrant with garlic and tomatoes. He grinned as she entered. "Hive-mind secure?"
  "Secure," Nadia confirmed, dropping her bag. She washed her hands at the sink, the routine ingrained, then leaned against the counter, watching him stir. He moved with a loose-limbed ease she sometimes envied.
  "Good day?" he asked.
  "Long. But good. Got the new temperature logger calibrated." She picked up a stray pen from the counter, idly clicking it. "You?"
  "Uneventful. Played some guitar. Thought about pranking the lab." He shot her a sideways glance, a familiar spark of mischief in his eyes.
  Nadia snorted. "Please don't. Dr. Evans has enough stress." She put the pen down. The click echoed slightly in the pause that followed. Des just smiled, turning back to the sauce.

  The next night, the colony room hummed its same song. Nadia approached the incubator. Heel of the hand. Press. *Thunk*. Second press. But this time, instead of the solid resistance giving way slightly and seating deeper, her hand met only rigid, unyielding metal. No give. No click. Just hard, immobile steel.

  She froze. Not panic, but a profound disruption, a wrenching halt in the expected flow. Her hand remained pressed against the latch for a second longer than usual, testing the inexplicable solidity. Then, smoothly, she pulled the door open. The rubber seal parted with a soft sigh. Inside, the racks of culture plates glinted under the interior light. And there, wedged neatly into the upper corner of the doorframe, was a small, folded index card. Bright yellow. Des’s handwriting was visible on the exposed flap: *Groceries?*

  Nadia’s expression didn’t change. She reached in, plucked the card free with two fingers, and slipped it into her lab coat pocket. She closed the heavy door. It swung shut with its characteristic heavy sigh. She placed the heel of her right hand firmly against the latch. Pressed once. *Thunk*. Pressed again. *Thunk*. The latch seated perfectly. She turned to the logbook, picked up the pencil, and wrote: 21:02. The graphite mark was perhaps a fraction darker than usual. She slid the pencil back into the binding.

  *Subject approaches incubator. Right hand, heel placed against latch mechanism. Downward pressure applied (approx. 2 kg force). Mechanism audibly engages. Pressure released. Heel re-positioned identically. Downward pressure re-applied (approx. 2 kg force). Mechanism audibly re-engages. Subject turns 90 degrees to bench. Retrieves graphite stylus. Inscribes numerical representation of current temporal coordinate onto designated log surface. Replaces stylus in binding apparatus. Subject exits facility.*

  The description formed in her mind, crisp and objective, like the notes in her own research journal. She blinked, the sterile clarity dissolving back into the feeling of cool air on her face as she pushed open the lab’s outer door. The street was quiet. She thought of the yellow card in her pocket, Des’s grin. It *was* funny, objectively. A harmless test. She hadn’t been angry, not really. Just… interrupted. And then she’d continued. She could substitute. Last week, the pencil had vanished – probably borrowed by a careless undergrad. She’d used a blue ballpoint pen without hesitation, marking the time clearly in the logbook’s margin. When the previous logbook had filled, she’d simply opened a fresh one, identical, and inscribed the old volume’s number neatly inside the front cover. Adaptable. Efficient.

  Two months later, the incubator failed. A catastrophic thermostat error fried the control board. The repair techs arrived mid-morning, unbolted the heavy unit, and wheeled it away on a trolley. Nadia spent the day reorganizing samples into temporary coolers, a logistical headache. By evening, the colony room felt cavernous without the incubator’s bulk and hum. Just an empty space on the floor, a faint outline in the dust, and the latch block itself, a small, heavy rectangle of steel, unbolted and left sitting on the nearby bench.

  Nadia finished securing the last temporary unit. The room was quiet now, just the sigh of the HVAC. She gathered her things. Her coat was on. Her bag was slung over her shoulder. She walked towards the door. She passed the empty space where the incubator had stood. Her pace didn’t falter. She didn't look at the space. She didn't look at the latch block on the bench. But as she drew level with the spot where the door *would* have been, her right arm swung out, almost of its own accord. She brought the heel of her hand down firmly onto the air where the latch *should* have been. Press. Then, smoothly, without pause, she pressed again, the heel impacting the same patch of empty space with identical force. Her arm dropped back to her side. She continued walking towards the exit. At the bench near the door, she stopped. The logbook lay there. She picked up the pencil. She opened the book to today's date. And in the familiar space, she wrote the time: 18:37. She slid the pencil back into the binding. Then she turned off the lights and left, locking the door behind her.

  Des was reading on the sofa when she got home. He looked up. "All migrated okay?"
  "Managed," Nadia said, hanging her coat. She didn't mention the empty space, the latch block on the bench, the two distinct pressures applied to the air. She didn't mention the time written down for an incubator that wasn't there. She sat down beside him, the warmth of his body a comfort against the lingering chill of the lab. The yellow index card was still tucked in her old lab coat pocket, upstairs in the closet, forgotten. Outside, a streetlamp flickered on, casting long, wavering shadows on the pavement, not unlike the cone of light near the loading dock where unseen wasps performed their own vital, unvarying sequences in the dark earth.

  **(Choose One Ending Line):**

  1.  Nadia picked up her own book, the pages crisp and unmarked.
  2.  Des reached over and squeezed her hand, his thumb tracing a circle on her knuckle.
  3.  The faint, familiar hum of their refrigerator kicked on in the quiet kitchen.
