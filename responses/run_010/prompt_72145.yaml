  You're a philosopher of probability here — someone who's spent real time on the two-envelope literature *and* on the more meta problem of working out what rule a person is applying from their verdicts on a bunch of cases. Please actually think this through instead of pattern-matching: start with some scratch work / brainstorming, and do the arithmetic yourself rather than trusting mine.

  Background. My colleague Dana keeps a running two-pile list of variants of the two-envelope problem — REAL PARADOX versus DISSOLVED. Her verdicts so far:

  1. Textbook version. Two envelopes, one holds twice the other, amounts unknown to you, you pick blind and are offered a switch before opening. The switching calculation says you gain a quarter of what you're holding. → DISSOLVED ("the calculation is just invalid").
  2. Same, except you're told the pair is $20 and $40 and you pick without looking. → DISSOLVED.
  3. Peek version, bounded generator: the organiser picks K uniformly from 0 to 10 and puts 2^K in one envelope and 2^(K+1) in the other. You take one at random and open it. Conditional on what you see, switching is favourable for every amount except the very top one (2048), where it's a disaster; ex ante, before opening, switching and keeping are exactly equal in expectation. → DISSOLVED ("people who find that paradoxical have forgotten there's a top of the range").
  4. Peek version, geometric generator with an infinite mean: K is drawn so that P(K=k) = (1/4)(3/4)^k for k = 0, 1, 2, …. Then whatever you open and see, the correct conditional calculation says switching gains you one seventh of it — and the person holding the other envelope, running the same calculation on their own amount, reaches the same verdict about switching back. → REAL PARADOX.
  5. Dynamic version: you pick an envelope, the organiser looks at your amount, flips a coin that lands heads 60% of the time, and writes either double or half your amount into the second envelope. Switching pays 1.4× whatever you hold. → DISSOLVED ("that's not a paradox, that's a lopsided game").
  6. Probability-free version: no distributions and no peeking, just "either you gain X by switching or you lose X/2, and the same reasoning runs from the other envelope, so you should switch and shouldn't." → DISSOLVED.

  The case I'm about to spring on her. Same peek structure as 3 and 4, but the organiser draws K from P(K=k) = (2/3)(1/3)^k for k = 0, 1, 2, …, so the expected smaller amount is finite — I make it $2. You open your envelope. I think the right calculation says: for anything you could see except the bare minimum of $1, your envelope is the smaller one with probability only 1/4, so switching hands back 7/8 of what you're holding. So you should keep, whatever you see, and always by the same margin. Meanwhile ex ante the two envelopes are still exactly as good as each other, so before opening you're indifferent. It's case 4 turned inside out: uniform conditional advice that cuts against ex ante indifference, except the advice is "keep" and the mean is tame. Please check that arithmetic first, because if I've botched it the whole question changes.

  What I want:

  (i) Which sorting rules are consistent with all six of her verdicts? Give me several, not two, and say what actually distinguishes them from each other — not just labels.
  (ii) Which of those rules diverge on my new case, and what does each predict?
  (iii) Your single best guess at her verdict plus the rule behind it, and why you prefer that rule.
  (iv) If she says DISSOLVED, does she have to file it under the same heading as case 3, or is it a different species of dissolution — and if it's different, does that cost her anything?
  (v) Name one further case that would settle which rule she's running, and say which rules it seperates.

  One hunch of mine I want you to attack rather than indulge: I suspect there's an asymmetry, that "switching is favourable no matter what you see" can only be built out of an infinite expected amount, while "switching is unfavourable no matter what you see" can be built with a perfectly finite one. If that's right it seems like it should matter a lot for what Dana is tracking; if it's wrong, or only true for the powers-of-two family I've been using, tell me.

