    - "Position rules" straddles Designer-Led (if phrasing matters) and Diagram-Centric (if equivalent statements are equal).  
    - "You just have to see it" splits: non-verbal rules under Solver-Led, ineffable patterns under Diagram-Centric.  
    - "Rules about how pictures were drawn" discarded—it conflates Designer-Led (intention) with convention.

  ### Problem Assessment
  - **Problem A**: Well-posed. The rule "a figure is wholly inside another without touching" is unambiguous with the given boxes.  
  - **Problem B**: Well-posed. "More filled than outlined" is unique in fitting all boxes; "odd number" is excluded by negatives.  
  - **Problem C**: Ill-posed. Negatives 1-3 are identical to positives (e.g., "circle below triangle" = "triangle above circle"). To fix: Replace negatives 1-3 with horizontally aligned pairs (e.g., "circle left of triangle").

