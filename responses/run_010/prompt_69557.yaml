prompt: |-
  I am co-teaching a graduate seminar with an economic historian and I owe a framing essay of roughly three thousand words on the current state of the Great Divergence debate — the descendant of Needham's puzzle about why China, for centuries the more technologically accomplished of the two civilizations, ceased to be. We have hit a wall, and not over the history. My co-instructor's position is that the question of why industrialization happened in Britain and not in China is perfectly well posed and merely extremely difficult, and that two decades of methodological self-examination has functioned as a way of avoiding the work. My position is that this is not one question but a family of questions, indexed to three parameters the participants almost never fix before arguing: the contrast case, the unit of comparison, and the onset date of the divergence. I want a diagnosis of the impasse rather than an adjudication of it, and I want you to treat it as a live possibility that one or both of us has misidentified what kind of disagreement this is.

  Here are five candidate diagnoses. Test each against what the disputants actually claim and do.

  1. Equivocation on the logical form of the question. A contrastive why-P-rather-than-Q asks for a difference-maker: a factor whose presence in P, and absence or altered configuration in Q, is doing the causal work. But much of what is offered — accessible coal, high wages and cheap energy, political fragmentation, a culture of useful knowledge, the ecological relief afforded by New World colonies — reads as an answer to the non-contrastive question what caused P, with China functioning as rhetorical scenery rather than as a term of comparison. On this diagnosis the camps are not disagreeing about causes at all; they have failed to notice that they are answering different questions under one heading.

  2. Unit-shuffling. The same explanans can be true at one unit of comparison and false at another. England is not Britain is not Western Europe; the Yangtze Delta is not Qing China. The late-divergence camp compares the most advanced region of each civilization and finds rough parity in living standards before 1800; the early-divergence camp compares whole economies, or works in silver-wage rather than grain-wage series, and finds England well ahead by 1600 or 1700. If each side's evidence survives only at its preferred unit, the apparent causal dispute may be a dispute about the individuation of the relata — which is not obviously a merely presentational matter.

  3. Explanandum-drift. Whether a candidate cause explains anything depends on the date assigned to the divergence. The geology of coalfields is a live candidate only if the explanandum is dated in the eighteenth or nineteenth century; if it is dated around 1600, coal does no work whatsoever, and the same goes for colonial resource flows. A related version holds that the politically relevant divergence — a unified empire on one side, a permanently fragmented system of states on the other — precedes any measurable economic gap by many centuries, so that the standard formulation mislocates the explanandum in time. Note that neither side treats the dating question as part of the causal question, which may itself be the symptom.

  4. Pragmatic and normative loading. Britain-and-not-China is not a neutrally chosen foil; it installs China as the expected case and Britain as the anomaly, and the label for the whole debate only entered currency in the 1990s. Revisionist reaction may therefore be as much a protest about what the question presupposes and who is entitled to set the default as a claim about wages, and that component is not resolvable by better data.

  5. The deflationary option, which I want you to consider and, if you reject it, explain why: that there is an ordinary hidden empirical disagreement doing all of the work — about the commensurability of premodern real wages, the conversion conventions, and the reliability of reconstructed output series for a large, monetized, regionally heterogeneous Qing economy — and that everything that looks like philosophy of explanation is surface froth over people who have been looking at different spreadsheets.

  What I want back:

  - An argued diagnosis, not a survey. Say which of the five does the most work, whether they are jointly consistent or mutually exclusive, and which you reject and why, with reasons drawn from the actual positions rather than from their plausibility in the abstract. Do not tell me what caused industrialization; I am not asking you to settle the history.
  - A verdict on whether the question is ill-posed, under-posed (well formed but incomplete, requiring the foil, the unit, and the date to be specified before it has a determinate answer), or well posed and merely hard. These are distinct claims, and my co-instructor and I have been sliding between them.
  - What would count as progress given your diagnosis, and of what kind: a distinction, a convention for fixing units and dates, a measurement result, a formal account of contrastive explanation applied to the case, a change of question (for instance, replacing the civilizational contrast with contrasts among regions within each civilization), or an argument that no progress should be expected because the parties hold different but reasonable explanatory interests. If it is a distinction or a convention, say who would have to accept it and what would motivate them to.
  - One discriminating test I can apply to the existing literature — something checkable against actual published exchanges, not a further plausibility judgment — that would tell your diagnosis apart from its main rival.

  Please do not include a bibliography, a reading list, or citations; I have the literature and cannot verify anything you point me to.
reasoning: |-
  Hmm, the user is co-teaching a graduate seminar on the Great Divergence debate and needs a framing essay diagnosing the methodological impasse. They've presented five candidate diagnoses and want a rigorous analysis without adjudicating historical causes. This is a sophisticated methodological challenge requiring careful dissection of epistemological issues in comparative history.

  The core tension is between their view (that the question has multiple dimensions needing specification) and their co-instructor's view (that it's a single well-posed but difficult question). The user wants to avoid superficial "both sides have points" analysis and instead identify which diagnostic framework best explains the stalemate.

  Looking at the five candidates:
  Equivocation (#1) seems strong because scholars frequently slip between contrastive and non-contrastive explanations. Pomeranz's coal argument often gets detached from its original Yangtze-Britain comparison. Unit-shuffling (#2) is equally pervasive - Broadberry's England vs. entire Qing comparisons create apples-to-oranges problems. Explanandum-drift (#3) matters less since most participants implicitly accept late-18th century dating, though Rosenthal/Wong's state fragmentation argument introduces temporal complications. Pragmatic loading (#4) feels secondary - while the "Britain-as-anomaly" framing rankles, substantive disagreements dominate. The deflationary option (#5) underestimates how methodological choices precede data interpretation.

  The real impasse stems from how #1 and #2 interact: scholars answer different questions (#1) using incommensurable units (#2). This creates the illusion of substantive disagreement when much is actually about unstated parameters. For instance, when Vries critiques Pomeranz, he's partly objecting to the regional unit but frames it as causal disagreement.

  Progress would require: First, formalizing the contrastive structure - specifying what exactly is being explained (divergence in living standards? industrialization rates?) and the foil (China vs. Yangtze Delta). Second, establishing conventional units (nation-states? core regions? PPP-adjusted baskets?). The challenge is incentivizing adoption - perhaps through collaborative projects demonstrating how conclusions shift with parameter choices.

  A concrete test: Examine how scholars handle wage data discrepancies. If they treat them as resolvable through better statistics (favoring #5), versus reframing comparisons (suggesting #1/#2), that reveals their implicit diagnosis. For example, Allen's defense of silver wages reflects commitment to national units, while Li's regional baskets challenge both unit and commensurability.

  The question isn't ill-posed but under-posed - it becomes tractable only when parameters are fixed. The co-instructor's "merely hard" view holds only if we assume default specifications (e.g. nations, 1800 onset), but these defaults are precisely what's contested. This explains why debates feel interminable - without agreed parameters, evidence can't accumulate decisively.
answer: |-
  ## Diagnosis of the Great Divergence Debate Impasse

  **Core Diagnosis:** The impasse is primarily driven by **Diagnosis #1 (Equivocation on Logical Form)** and **Diagnosis #2 (Unit-Shuffling)**, operating synergistically. These are mutually reinforcing, not exclusive. **Diagnosis #3 (Explanandum-Drift)** plays a secondary role, while **Diagnosis #4 (Pragmatic Loading)** and **Diagnosis #5 (Deflationary Option)** are less central to the *methodological* impasse, though they contribute context.

  1.  **Why #1 (Equivocation) is Paramount:**
      *   **The Core Mismatch:** Your co-instructor champions a *genuine contrastive explanation* ("Why Britain *and not China*?"), demanding identification of a *difference-maker* present in Britain and absent/altered in China. Yet, much scholarship, particularly from proponents of specific "prime movers" (like accessible coal, high wages, colonial ecology), functions differently. Pomeranz's "coal and colonies," for example, is often presented *as if* it inherently explains the contrast. However, its *explanatory power as a difference-maker* hinges entirely on demonstrating its *unique* configuration in Britain *compared to a specific Chinese foil* (e.g., the Yangtze Delta). This step is frequently glossed over. The argument often reduces to "Factor X was crucial *for Britain's industrialization*," implicitly treating China as a passive counterfactual space where X was absent, rather than actively demonstrating *why* X didn't operate similarly in a comparable Chinese region or *why* no functional equivalent emerged. This is answering "What caused P?" using China as rhetorical scenery, not genuinely engaging with "Why P rather than Q?".
      *   **Evidence in Positions:** Your co-instructor's frustration ("avoiding the work") stems from seeing answers to "What caused British industrialization?" masquerading as answers to "Why Britain and not China?". Your insistence on fixing parameters reflects the need to *force* the contrastive question: without specifying the foil (Q), how can we identify what's *different*? The persistence of mono-causal arguments *without rigorous comparative testing against the specified foil* exemplifies this equivocation.

  2.  **Why #2 (Unit-Shuffling) is Crucial and Synergistic:**
      *   **Undermining the Contrast:** Equivocation (#1) is *enabled* by unit-shuffling. If the unit for "China" shifts fluidly between the Yangtze Delta, core regions, or the entire Qing Empire, it becomes impossible to pin down whether a factor (e.g., "cheap energy," "market integration," "state structure") was *genuinely absent or different* in the relevant comparison case. Broadberry et al.'s national aggregates (finding divergence by 1600/1700) and Pomeranz's Yangtze-vs-Britain comparison (finding parity ~1800) aren't just *disagreeing*; they are answering fundamentally *different questions* due to unit choice. One asks "Why did Britain (national economy) industrialize and not Qing China (national economy)?", finding divergence early. The other asks "Why did Britain (core region) industrialize and not the Yangtze Delta (core region)?", finding late parity. The "causal dispute" often evaporates when the unit is fixed – the evidence *is* unit-dependent.
      *   **Evidence in Positions:** Your emphasis on fixing the unit directly addresses this. The debate *looks* like a fight over causes (e.g., whether wages *caused* divergence), but often the underlying fight is over *what entities are being compared* (national GDP vs. regional baskets, grain-wage vs. silver-wage baskets). The "early" vs. "late" divergence camps often build their entire case on unit choices that make their preferred data series coherent, resisting translation to the other unit.

  3.  **Why #3 (Explanandum-Drift) is Secondary but Relevant:**
      *   **Shifting Goalposts:** While less central than #1 and #2, the dating ambiguity allows proponents of specific causes to implicitly tailor the *explanandum* to fit their *explanans*. Arguments for coal's centrality logically require a late divergence date (~1800). Arguments emphasizing state structure or institutional differences (e.g., Rosenthal & Wong) often imply a much earlier "politically relevant divergence" (fragmentation vs. unity). Dating often *is* treated as separate from causation rather than constitutive of it. However, the fiercest clashes often occur *within* similar dating frameworks (e.g., 1750-1850), where #1 and #2 dominate.
      *   **Evidence in Positions:** Your co-instructor likely sees the dating question as preliminary but resolvable ("merely hard"), part of defining the explanandum. Your view that it's a core parameter reflects how it fundamentally alters which causal candidates are even plausible. The relative lack of direct, sustained debate *solely* about dating *as a prerequisite* supports its secondary role in the *current* impasse compared to the logical and unit issues.

  4.  **Why #4 (Pragmatic Loading) is Contextual, Not Core to the Impasse:**
      *   **Motivation vs. Method:** The normative/political weight of the question ("Why the West?") undoubtedly fuels the debate's intensity and the revisionist reaction. It explains *why* the question is asked this way and *why* revisionists push back against perceived Eurocentrism. However, it doesn't explain the *structure of the methodological impasse*. Revisionists like Pomeranz *do* engage substantively with wage data, productivity estimates, and ecological factors – their arguments are not *only* normative protests. The core disagreements over data interpretation and causal logic persist even if normative concerns are bracketed. It's a background condition, not the engine of the stalemate.

  5.  **Why #5 (Deflationary Option) is Rejected:**
      *   **Data Doesn't Speak for Itself:** While empirical disagreements about wage series, conversion rates (silver/grain, PPP adjustments), and Qing economic data robustness are *real* and *significant* (e.g., Allen vs. Li Bozhong), they are not "hidden" nor doing "all the work." **The choice of *which* data to prioritize, *how* to construct baskets, and *what unit* to apply them to is fundamentally guided by prior methodological commitments related to #1 and #2.** Disagreements over, say, the appropriate grain-silver conversion rate for the Lower Yangtze *are* empirical, but they arise *because* scholars are trying to answer different questions (national vs. regional divergence? living standards vs. factor costs?). The "philosophy of explanation" (#1, #2) shapes *which spreadsheets are deemed relevant and how they are interpreted*, rather than being mere "froth." Resolving the empirical disputes *requires* first agreeing on the logical form of the question and the units involved.

  **Verdict on the Question's Status:** The question "Why did industrialization happen in Britain and not in China?" is **under-posed**. It is not inherently ill-posed – a well-specified contrastive question *is* possible. Nor is it merely difficult in the sense that with enough effort on *one* fixed interpretation, an answer might emerge. The core problem is that it lacks determinate meaning *until* the three parameters (contrast case/foil, unit of comparison, onset date) are specified. Without these, it is a family of questions masquerading as one, leading to the equivocation and unit-shuffling that characterize the impasse. Your co-instructor treats a *particular* specification (likely something like "national economies, divergence onset ~1750-1800") as the default well-posed question, while you correctly identify that *this specification itself is contested and needs explicit justification*.

  **Path to Progress:** Progress requires **conventions for fixing units and dates**, coupled with a **formal account of contrastive explanation applied rigorously to the case.**

  1.  **Conventions:** The field needs widely accepted (even if provisional) standards for:
      *   **The Foil (Q):** Is it "China" (Qing Empire)? The Yangtze Delta? Core regions defined by specific criteria? The choice must be explicit and justified relative to the specific causal hypothesis being tested.
      *   **The Unit:** National aggregates? Specific regional baskets (requiring agreed composition)? Functional economic regions? Units must be comparable in scale and function.
      *   **The Onset/Divergence Date:** Defined by specific, measurable thresholds (e.g., sustained growth differentials in per capita income, unmistakable technological adoption gaps). This date must logically align with the proposed causal mechanism(s).
  2.  **Formal Contrastive Framework:** Scholars must explicitly state: "I am explaining why P (Britain/Unit X) industrialized by time T, rather than Q (China/Foil Y/Unit Z) industrializing by time T." This forces articulation of the *difference-maker* relative to the *specified foil*.
  3.  **Motivation & Adoption:** Achieving this requires:
      *   **Recognizing the Impasse:** Scholars must acknowledge that current disagreements often stem from incompatible framing, not just incompatible data. Your essay can contribute here.
      *   **Collaborative Benchmarking:** Projects jointly establishing comparable datasets for *agreed-upon* units/foils/dates (e.g., "Yangtze Delta vs. Britain, 1750-1850, using regional basket PPP wages and specific energy cost measures"). The California School and their critics have made strides here, but more is needed.
      *   **Methodological Refereeing:** Journals and seminars enforcing clarity on parameters before engaging in causal argument.

  **Discriminating Test for Diagnosis (vs. Main Rival - #5 Deflationary Option):**

  *   **Test:** Identify a prominent exchange where scholars *agree broadly on the empirical data* (e.g., accept similar wage series, output estimates) for a *specific region and time period*, yet *still reach fundamentally different conclusions* about the causes of divergence relative to a specific foil.
  *   **Application:** Examine exchanges surrounding **Pomeranz's Yangtze-Britain comparison c. 1800**. Critics like Philip Huang or Robert Brenner largely accepted Pomeranz's core *data points* on living standards/development in the Yangtze Delta and Britain around 1800. Their disagreement wasn't primarily about the *numbers themselves* at that point, but about:
      *   **(#1 Equivocation):** Whether showing *parity* c. 1800 answered the "Why Britain and not China?" question, or merely shifted the burden. Huang argued Pomeranz failed to explain *why* the Yangtze couldn't sustain an *industrial* breakthrough *despite* parity in "Smithian" growth indicators – a different contrastive question.
      *   **(#2 Unit-Shuffling):** Whether the Yangtze Delta was a valid unit for "China" in the broader divergence narrative, or whether ecological/political constraints operating at the *imperial level* doomed it regardless of regional efficiency (a different unit/foil).
  *   **Result:** If such exchanges exist (and they do, e.g., in responses to *The Great Divergence*), it demonstrates that the core dispute persists *even when empirical data for a specific point is uncontested*, driven instead by disagreements over the *logical form of the question* (#1) and the *appropriate units/foils* (#2). This refutes the Deflationary Option (#5), which claims empirical disagreements are the *sole* driver. The philosophical/explanatory framing *precedes and shapes* the empirical contestation.
