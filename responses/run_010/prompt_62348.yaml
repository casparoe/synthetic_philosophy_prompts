prompt: |-
  Pretend you're a moral philosopher who's spent years working on blame and the reactive attitudes, and think this through properly rather than giving me the standard survey — if you need to jot down a few candidate readings to yourself before you commit to one, do that first.

  Here's where I'm stuck, and I want the conceptual issue explained rather than just named.

  Strawson's move — resentment and indignation are participatory attitudes, blaming isn't reporting — seemed like it would settle the hypocrisy business for me, but it doesn't. A hypocrite's blame is perfectly participatory. He's actually angry, he's not detached, he's personally involved. If anything he's *more* engaged than the colleague who says "that was wrong" in a flat voice and goes back to her sandwich. So whatever goes wrong in hypocrisy isn't a failure to participate, and the participatory story has nothing to say about it.

  Nor is it about content. My colleague really did take credit for the student's data, he really does deserve to be called out, and the man calling him out knows all this. The claim is true and the deserts are in order. So the defect has to sit somewhere else, and I cant work out where.

  Three places it might live, and I want each of them explained properly — developed, not one line apiece — and then a verdict on whether they're genuinely rival accounts or three descriptions of one thing wearing different hats:

  (a) in the act itself: blaming is a second-personal move, a claim on someone, and the hypocrite isn't entitled to make it even though what he says is true — something like the way a bribed judge's sentence can be legally correct and yet not his to hand down;
  (b) in the function of the act: blame is supposed to register a commitment the blamer shares with the blamed, and the hypocrite's doesn't register anything, so the act misfires not because he's not allowed but because it can't do its job;
  (c) nowhere near the act: the blaming is fine and the only defect is in the blamer's character, so the target's "you of all people" is really a complaint about something other than the blame.

  Now the cases I think decide between (a) and (b). Let me coin a term so I stop muddling them: call someone *latently* guilty when their own record is known only to them, and *transparently* guilty when everyone can see it.

  Case one. A backbench MP writes a furious speech about welfare fraud. He has quietly been fiddling his own expenses for years and nobody will ever find out — no leak, no audit, he dies with the secret. Is his speech an act of blaming that lacks standing? If yes, then standing is a property nobody outside his head can detect, and I struggle to see how the target's complaint could ever get a grip, since the target can't know. If no, then standing isn't tracking guilt at all, it's tracking visible guilt, which sounds like it's about appearances and not about morality — and that makes (b) look more plausible than (a).

  Case two. Errol reads that a stranger on the other side of the world, whom he'll never meet and who'll never hear of him, abandoned his family. Errol, who did the same thing twice, thinks: contemptible. He never says it aloud to anyone. Is that private contempt a blaming that lacks standing? If standing is essentially about address, the case shouldn't arise — but it does arise, and I have the strong feeling something is off about Errol's attitude. So either standing isn't essentially second-personal, or my feeling is tracking something other than standing.

  Case three, quickly, because it points the other way. Dana is ten years sober and she blames her brother for his drinking, and everyone — including him, eventually — thinks she's the one person who gets to. The fact that earns her the standing looks like exactly the fact that destroys it in Errol's case. So what's doing the work: that she's stopped, that she paid for it, that she doesn't pretend otherwise, or that her blame offers him something?

  What I want out of you, in the end: an account of whether the latent/transparent distinction I invented tracks anything real or is just an artefact of my examples; whether standing is a threshold or comes in degrees, and if it comes in degrees what the scale is measuring; whether it can be regained and what regaining it would consist in; and — this is the bit I most want — what would have to be true for "lacks standing" to be doing real explanatory work rather than being a label we stick on blame that feels unpleasant coming from that particular mouth.

  No reading list and don't tell me who holds which view, I'm not interested in the geography. I want the structure of the problem. Where you're genuinely unsure, say so rather than smoothing it over.
reasoning: |-
  Hmm, the user is presenting a sophisticated moral philosophy puzzle about the nature of blame and hypocrisy. They've clearly studied Strawson's reactive attitudes framework but found it insufficient for explaining why hypocritical blame feels defective even when participatory and factually correct.

  The user has constructed three test cases to probe different dimensions of the problem: a secretly corrupt politician (latent guilt), a judgmental stranger with private contempt (transparent guilt but no address), and a recovered addict blaming her brother (regained standing). These cases are carefully designed to isolate variables around visibility of guilt, second-person address, and moral transformation.

  What makes this tricky is that all three candidate explanations (a, b, c) have intuitive pull. The user wants me to dissect whether these are genuinely distinct mechanisms or just different perspectives on the same phenomenon. The latent/transparent distinction they invented seems crucial - it questions whether standing requires actual guilt or merely perceived guilt.

  For case one (secretly corrupt MP): If we say he lacks standing, that makes standing an entirely internal matter detached from social practice. But if we say he has standing, then hypocrisy becomes purely about getting caught, which feels morally unsatisfying. This cuts against explanation (a).

  For case two (Errol's private contempt): The intuitive discomfort suggests standing isn't purely about second-person address. Yet Strawson's framework centers on interpersonal engagement. This might point to explanation (b) - that blame's function fails when it can't reflect shared norms.

  For case three (Dana's recovered standing): What restores her standing appears to be: (1) her demonstrated change (2) her non-hypocritical framing (3) the rehabilitative intent behind her blame. This supports explanation (b) about blame's communicative function.

  The user's deepest questions reveal their underlying concerns: Is "standing" a real moral category or just an ad hoc label? If real, is it binary or scalar? Can it be earned back? And crucially - does it do independent explanatory work?

  I should argue that explanation (b) offers the most coherent account: Hypocritical blame fails because it can't perform blame's core function of normative reaffirmation. The hypocrite's act becomes performative contradiction - saying "we share these norms" while demonstrating they don't govern him. This makes standing neither purely about entitlement (a) nor about character (c), but about functional efficacy.

  The latent/transparent distinction does track something real: Blame requires the blamer to have credibility as a norm-bearer. But credibility depends on both actual commitment and social perception - hence standing can be partial and context-dependent. Dana regains standing through demonstrated recommitment; Errol loses it through active violation.

  Most importantly, "lacks standing" explains why hypocritical blame feels specially defective: It corrupts the practice itself by undermining the reciprocity that makes blame meaningful. The unpleasantness isn't incidental - it's the sound of the moral machinery grinding against itself.
answer: |-
  You've put your finger on a genuinely deep crack in the foundation of reactive attitude theory. Strawson brilliantly shifted us from detached desert to engaged participation, but as you see, participation alone doesn't capture the *normative authority* required for blame to function properly. Hypocrisy exposes this. Let's dissect your three candidate locations and then test them against your cases, aiming for structural clarity.

  **(a) The Act Itself: Standing as Entitlement to Address**  
  This views blame as a *performative* act, akin to promising or commanding. Its validity depends not just on content but on the speaker's position. The hypocrite, by violating the very norm they invoke, forfeits their *right* to make this second-personal demand ("You ought not to have done that!"). Their act is *infelicitous* – like a bribed judge pronouncing sentence. The defect is *illocutionary*: the act misfires because the speaker lacks the normative position to perform it successfully. The truth of the claim is irrelevant; the authority is corrupted. The target's "You can't say that to me!" is a rejection of the speaker's standing, not a denial of wrongdoing.

  **(b) The Function of the Act: Blame as Normative Reaffirmation**  
  Here, blame’s core function is to *call attention to and reaffirm a shared normative commitment*. It’s meant to say: "We (including you) are bound by this standard." The hypocrite’s blame *cannot perform this function* because their own actions demonstrate they do not genuinely hold themselves to the standard they invoke. Their blame becomes empty performance, incapable of expressing the shared commitment it purports to uphold. It’s not that they *aren’t allowed* to speak (like (a)); it’s that their utterance is *incapable of meaning what blame is supposed to mean*. It’s like shouting "Fire!" as a joke in a theater – the sounds are made, but the intended communicative act (warning) is nullified by the context. The act misfires functionally.

  **(c) The Blamer's Character: A Separate Complaint**  
  This argues the *act* of blaming is intact – the judgment is correct, the reactive attitude genuine. The problem lies entirely *outside* the act: the hypocrite is a *bad person* for blaming while being guilty themselves. The target’s "You of all people!" is a *counteraccusation* about the blamer’s character or past actions, not a challenge to the validity *of the blame itself*. It shifts the topic: "Yes, I did wrong, but *you* are vile for saying so!" The blaming act itself is morally permissible (if unpleasant), but the blamer is open to condemnation for *their* hypocrisy as a separate failing.

  **Verdict on the Trio:**  
  (b) offers the most fundamental explanation. (a) and (c) are consequences or manifestations of the functional failure identified in (b), not truly independent rivals.
  *   **(b) is Primary:** The hypocrite’s blame cannot perform its core function of normative reaffirmation because their own actions *contradict* the commitment their blame purports to express. This functional failure *explains why* they lack the standing ((a)) and *why* their character is condemnable ((c)).
  *   **(a) is a Consequence:** The lack of standing *follows from* the functional incapacity. If your act cannot mean what it’s supposed to mean (reaffirming a shared commitment *you* flout), you *are* normatively disqualified from performing it with authority. The bribed judge analogy captures the *effect* (invalid act) but not the deepest *cause* (why is the judge disqualified? Because their corruption means their sentence cannot represent the impartial application of the law).
  *   **(c) is a Separate (but related) Point:** Yes, the hypocrite’s character is flawed. But the *specific* wrong in hypocritical *blame* isn't *just* that they are bad; it's that their badness (specifically, their violation of the norm they invoke) *infects the blaming act*, rendering it functionally defective. Condemning their character is a different reactive attitude (indignation at *their* hypocrisy), directed at *them*, not a statement about the invalidity of their blame.

  **Testing Against Your Cases & Answering Your Questions:**

  1.  **The Latent MP:**
      *   **Analysis:** His speech *is* functionally defective blame (b). He cannot sincerely reaffirm a shared commitment to honesty he systematically violates. His hidden guilt *does* nullify the act's core meaning, even if undetected.
      *   **Standing Detection:** The target *cannot know* he lacks standing. This doesn't mean standing is non-existent or purely internal; it means the *social practice* operates imperfectly. The target might *rightly* feel the sting of the accusation *if* they accept the norm. The defect lies in the *blamer's relationship to the norm*, not the target's perception. The target's potential complaint ("You have no right!") would be *true* (if they knew), but its *force* in dialogue depends on evidence. Standing isn't *constituted* by visibility; visibility affects *enforceability* within the practice. **Latent guilt *does* undermine standing (b).**

  2.  **Errol's Private Contempt:**
      *   **Analysis:** This is crucial. Errol's *private* attitude feels defective. This strongly favors (b) over (a). Blame's function isn't *solely* second-personal address. It also involves *holding* someone to a standard *in thought*. The hypocrite cannot genuinely *hold* the other to a standard they exempt themselves from. Their private judgment is a form of *bad faith*; it lacks the integrity required for the attitude to be a proper instance of *moral* blame. It's resentment/indignation corrupted by self-exemption. **Standing *isn't* purely second-personal; it concerns the blamer's *own normative position* relative to the standard invoked (b).** Your feeling tracks the functional defect in the attitude itself.

  3.  **Dana's Earned Standing:**
      *   **Analysis:** Dana *can* perform blame's function (b). Her past violation doesn't inherently disqualify her; her subsequent *commitment* and *struggle* demonstrate she *holds herself* to the norm she invokes. Her blame can genuinely reaffirm a shared commitment ("This norm matters; I know its cost; we are both bound by it"). What "earns" standing is the *re-establishment of credible commitment* to the norm. Key elements:
          *   **Cessation & Effort:** She stopped, works to maintain it.
          *   **Acknowledgement:** She doesn't deny her past failure (implicitly or explicitly).
          *   **Non-Hypocritical Framing:** Her blame likely focuses on the norm and the brother's action *without* implying she never failed. It might even express empathy born of shared struggle.
          *   **Offering Something?:** Crucially, her position allows her blame to potentially function as a *call back* to shared commitment, not just condemnation. It can be received as such ("She knows what it takes, she believes I can do it"). **Regained standing comes from demonstrable recommitment to the norm, making normative reaffirmation possible again (b).**

  **Synthesizing Answers to Your Core Questions:**

  1.  **Latent/Transparent Distinction:** It tracks something real: the *social accessibility* of the facts affecting standing. However, **standing itself is grounded in the *blamer's actual normative relationship to the standard* (b), not merely its perception.** Latent guilt *does* undermine standing functionally and normatively. Transparency affects whether the lack of standing is *socially operative* and challengeable.
  2.  **Threshold or Degrees?** **Primarily Threshold with Degrees of Restoration.** The core condition is binary: *Can this act of blame genuinely function as a reaffirmation of a shared normative commitment that binds the blamer?* If the blamer actively exempts themselves (latent or transparent), the answer is "no" – they lack standing *for that norm*. However, the *path to regaining* standing involves degrees: the depth of remorse, the consistency of reform, the time elapsed, the sincerity of recommitment. Dana didn't regain full standing overnight.
  3.  **Regaining Standing:** It consists in **demonstrably re-establishing oneself as bound by the norm one invokes.** This requires:
      *   **Cessation** of violating the norm.
      *   **Acknowledgement** of one's past violation (to oneself and often to relevant others).
      *   **Reparation/Amends** where possible and appropriate (sharing the "cost").
      *   **Sustained Commitment** evidenced by changed behavior and attitudes.
      *   **Humility:** Blaming *from* a place of acknowledged fallibility, not moral superiority.
  4.  **Explanatory Work of "Lacks Standing":** For "lacks standing" to be more than a label for unpleasantness, it must explain *why hypocritical blame is defective qua blame*. **(b) provides this:** The hypocrite's blame fails to be a genuine instance of the reactive attitude *because* it cannot perform its constitutive function of normative reaffirmation due to the blamer's own violation. This defect explains:
      *   Why it feels like an illegitimate *act* (a).
      *   Why the blamer's *character* is condemnable (c).
      *   Why latent guilt matters.
      *   Why private blame can be defective.
      *   Why standing can be regained through recommitment.
      *   Why "you of all people" is a relevant rebuttal (it points to the contradiction invalidating the act's function).

  **In essence:** The hypocrite attempts a moral speech-act whose success *logically requires* the speaker to be committed to the norm they invoke. Their own violation means they cannot satisfy this condition. Their act is not just unpleasant or coming from a bad person; it is an *impossibility* – like a square circle. "Lacks standing" names this condition of performative failure. The latent/transparent distinction highlights the opacity of this failure in practice, not its absence in principle. Standing is fundamentally about the blamer's *fitness to enact the role* of norm-reaffirmer for the specific norm in question.
