prompt: |-
  ok so I'm in a phil of mind course and my paper is on whether the brain is literally a computer, but before I wade into all the competing accounts I want the spec first. What would any theory have to deliver to actually settle that question rather than just redescribe it?

  Give me the requirements list: what it has to say about what makes a physical system a computing system in the first place (can't just be "computers are the things that compute"), which collapse it has to avoid — like the worry that if you're too loose about how physical states map onto computational states then a wall or a stomach implements every program you like — and which things we actually know about brains it can't contradict. For each requirement, the case or consideration behind it, and then mark which ones are genuinely non-negotiable and which are just the pet constraints of one camp (does it have to be discrete? does it need symbols or representations? does the computation have to be observer-independant? does it have to be falsifiable, and by what?).

  Then the part I most want: tell me which subset of these can't all be satisfied at once, and which single requirement knocks out the most popular answers. Skip the scorecard of who passes what, I'll do that myself.
