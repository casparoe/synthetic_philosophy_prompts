  I should also consider epistemic access. If computation must be empirically detectable, that adds another layer. But this might be a pet constraint. The user mentioned falsifiability, so including that as a theoretical virtue makes sense.

  Summarizing, the requirements include Implementation Conditions (non-negotiable), Avoiding Neuro-Contradictions (non-negotiable), Causal Efficacy, and Theoretical Virtues. Conflicts arise between Implementation Conditions requiring discreteness and the brain's continuity, and between Observer-Independence and the need for interpretation in mapping.

  The single requirement that's most damning is Implementation Conditions, specifically robustness, as it challenges theories that rely on arbitrary mappings. This is where many computationalist and anti-computationalist arguments converge.
answer: |-
  Here’s a rigorous specification for theories claiming the brain is *literally* a computer, designed to avoid redescription traps and triviality. Requirements are categorized, with rationales, non-negotiable status, and conflicts highlighted.

  ---

  ### **Core Requirements: Defining "Computation"**
  1. **Non-Trivial Implementation Conditions**  
     - **What it must deliver**: A criterion for when a physical system *implements* a specific computation, beyond arbitrary interpretation. Must exclude walls/stomachs computing arbitrary programs.  
     - **Rationale**: Putnam/Searle triviality arguments show that without constraints, *any* physical system "implements" any computation via ad hoc state mappings.  
     - **Non-negotiable**: Yes. Without this, "the brain is a computer" is vacuously true/false.  
     - **Key test**: The theory must explain why a wall *doesn’t* compute Shakespeare’s sonnets *by default*.  

  2. **Causal-Structure Mirroring**  
     - **What it must deliver**: Physical state transitions must *causally* (not just descriptively) map to computational state transitions.  
     - **Rationale**: Computation isn’t just static representation; it requires dynamic causal processes that *follow computational rules*.  
     - **Non-negotiable**: Yes. Collapses without it (e.g., a rock "computing" if you map its cracks to binary).  

  3. **Medium-Independence**  
     - **What it must deliver**: The computational description must be separable from the physical substrate (e.g., same computation runnable on silicon/carbon).  
     - **Rationale**: Core to computational theory: multiply realizable functions.  
     - **Non-negotiable**: **Contested**. Embodied cognition theorists reject this; classical computationalism requires it.  

  ---

  ### **Avoiding Neuro-Contradictions (Non-Negotiables)**  
  Theories **must not contradict** established neuroscience:  
  - **Analog-Digital Hybridity**: Brains use continuous (analog) electrochemical signals *and* discrete spikes (digital-ish).  
  - **Massive Parallelism**: Billion+ simultaneous processes, unlike von Neumann architectures.  
  - **Plasticity**: Hardware reconfigures dynamically based on experience.  
  - **Energy Efficiency**: Brains use ~20W; emphasizes efficiency over symbolic precision.  
  - **No Central Clock**: Asynchronous, variable timing unlike CPU cycles.  
  - **Degeneracy**: Multiple neural pathways produce identical outputs.  

  *Rationale: A theory claiming literal identity must align with brain biology, not force-fit it into digital stereotypes.*  

  ---

  ### **Theoretical Virtues (Contextual Constraints)**  
  *Pet constraints of specific camps; non-universal but often demanded:*  
  4. **Formal Symbol Manipulation**  
     - **Demanded by**: Classical computationalism (Fodor, Pylyshyn).  
     - **Rationale**: Computation = syntactic operations on representational symbols.  
     - **Contested**: Connectionists/dynamical systems deny symbols are necessary.  

  5. **Discreteness**  
     - **Demanded by**: Digital computationalists (e.g., Turing-machine models).  
     - **Rationale**: Prevents analog noise from "computing everything".  
     - **Contested**: Analog computation (e.g., neural nets with continuous activations) is valid.  

  6. **Observer-Independence**  
     - **Demanded by**: Realists (computation is objective, not interpretive).  
     - **Rationale**: Avoids anthropocentrism (e.g., "computation is in the eye of the beholder").  
     - **Contested**: Interpretivists (e.g., Searle) say computation is observer-relative.  

  7. **Falsifiability**  
     - **What it must deliver**: Testable predictions distinguishing computational from non-computational systems.  
     - **Rationale**: Otherwise, the theory is non-scientific.  
     - **Non-negotiable**: **Yes, for scientific claims**, but not for purely philosophical ones.  

  ---

  ### **Conflicts Between Requirements**  
  These requirements **cannot all be satisfied simultaneously** by existing theories:  
  - **Non-Trivial Implementation vs. Continuous Dynamics**:  
    Avoiding triviality often demands discrete states (to prevent analog "anything goes"). But brains are continuous systems with noise – strict discreteness contradicts neurobiology.  
  - **Observer-Independence vs. Implementation Robustness**:  
    If computation is observer-independent, a stomach *can’t* compute. But specifying "natural" computational mappings without observer input is notoriously difficult (e.g., what counts as a "genuine" state transition?).  
  - **Formal Symbols vs. Parallelism/Plasticity**:  
    Symbol manipulation assumes stable, discrete tokens, but neural representations are distributed and fluid.  

  ---

  ### **The Most Damning Requirement**  
  **Non-Trivial Implementation Conditions** (specifically **causal-structure mirroring**) knocks out the most popular answers:  
  - **Eliminates**:  
    - *Pancomputationalism* (everything computes, so brains do too → trivial).  
    - *Simple mapping accounts* (e.g., "spikes are 1s, silences are 0s" ignores causal complexity).  
    - *Observer-relative accounts* (e.g., "brain computes if we interpret it so" → wall computes).  
  - **Why it’s lethal**:  
    Brains are causally messy. Neural "states" aren’t cleanly separable; transitions are stochastic and context-dependent. If the theory requires perfect causal isomorphism (e.g., each neuron as a logic gate), it fails. If it’s too loose (e.g., "approximate" mappings), it collapses into triviality.  

  ---

  ### **Summary for Your Paper**  
  To settle "brain = computer," a theory must:  
  1. **Non-trivially implement computations** (causal structure, not just mapping).  
  2. **Respect brain biology** (hybrid analog/digital, parallel, plastic).  
  3. **Avoid universal collapse** (walls aren’t computers).  

  **Unresolvable tension**: Brains’ *continuity/noise* clashes with *discreteness* needed for non-triviality. **Fatal flaw**: Most theories fail **causal-structure robustness** – they either oversimplify brains or overgeneralize computation.  

  Use this framework to test theories: if they dodge triviality *and* match neurobiology, they’re contenders. If not, they’re redescriptive. Good luck!
