  #### Dynamic Consistency
  The rule does **not** guarantee dynamic consistency. Updating the set of priors upon new information (e.g., ball draws in case c) can reverse preferences. For example, after observing red balls, excluded priors may raise minmax values, making you accept bets you previously refused. This is a known flaw in minmax-based models.

  #### Runner-Up Model
  The **smooth ambiguity model** (higher-order uncertainty) saves case 4 by assigning a second-order distribution to red-or-yellow, potentially reducing aversion through expectation rather than minmax. However, it fails case 3 (cannot explain extreme discounting without implausible aversion parameters) and complicates competence effects (cases 6–7) by requiring ad hoc adjustments. It costs parsimony for limited gain.

