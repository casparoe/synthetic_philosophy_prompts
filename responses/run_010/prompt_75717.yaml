answer: |-
  ## The Floodwall Debate

  **Setting:** A polished oak table in the town council chambers. Rain lashes against the windows. Dr. Aris Thorne (Zero Pure Time Preference) and Dr. Lena Voss (Positive Pure Time Preference) face each other, reports open before them.

  **Aris Thorne:** Lena, we agree on the essentials: projected consumption growth (1.5% annually), the elasticity of marginal utility (1.3), and the sobering catastrophe probabilities – war, societal collapse – that could render this project moot. Yet, you insist on adding a pure time preference rate (δ) of 1%. *Why*? Why discount well-being *just because* it occurs later? If we accept the catastrophe risks, and we account for expected wealth making future marginal utility lower, what intellectual or moral space does that extra percentage point occupy? Isn't it simply saying, "Their time isn't as valuable as ours"?

  **Lena Voss:** Aris, it’s not about devaluing *their* time intrinsically. It’s about the structure of *our* decision-making under radical uncertainty. We know the growth rate and elasticity *today*, but projecting them centuries forward isn't just uncertain; the models themselves become brittle. A positive δ isn't a tax on the future; it’s a pragmatic acknowledgement that our ability to predict, model, and thus *confidently weight* welfare diminishes the further out we look. It reflects the increasing fragility of our foresight, *distinct* from the average growth expectation we've plugged in.

  **Aris Thorne:** But that sounds precisely like an argument to *adjust our probability assessments* for the robustness of the model itself! Why not explicitly increase the uncertainty band around the growth rate, or the utility weighting, or even add an explicit 'model failure' catastrophe probability? We've already got 'societal collapse' in there. If the concern is that our projections are fragile, let’s quantify *that* fragility as part of the known risks, rather than injecting a discount just because the date is distant. Doesn't folding it into δ obscure the specific risk you're worried about?

  **Lena Voss:** It *is* distinct. Adjusting growth or utility parameters assumes we can still meaningfully *characterise* the distribution of possible futures, even with wider tails. But beyond a certain horizon, the very *dimensions* of possibility become unknowable. Will utility even be measured in consumption equivalents? Will 'flood risk' be conceptualised the same way? A positive δ, small as it is, is a modest hedge against the fundamental *epistemic shift* in the nature of uncertainty over centuries. It’s not a probability adjustment; it’s a concession to the limits of intertemporal commensurability under radical ignorance. We can't quantify the 'unquantifiable unknown' of 2150 societal paradigms, so we discount slightly for that opacity.

  **Aris Thorne:** I see the distinction you're drawing – fragility of the model *structure* versus uncertain parameters *within* the model. Yet, morally, doesn't this epistemic hedge you propose *functionally* achieve the same outcome? You are still counting the welfare of a person in 2150 as less *because* they live in 2150, not because they are richer (we account for that) or more likely dead from catastrophe (we account for that), but because we find their world harder to imagine. That *is* treating calendar position as a reason for discounting. We wouldn't accept discounting the welfare of people in a remote village today because *we* find their lives hard to model. Why is temporal distance different?

  **Lena Voss:** Because temporal distance *is* fundamentally different from spatial or cultural distance *for the decision-maker*. We are *temporally bound* actors. We act *now*, with *current* knowledge and *current* values, to bind *future* actors who will have different knowledge and values. The remoteness isn't just geographical; it's existential. We cannot consult them. We cannot know if this specific concrete wall is what their society, facing potential geo-engineering solutions we can't conceive of, would even *want* us to prioritize, given the opportunity cost *to them*. A small δ acknowledges this unavoidable paternalism and the irrecoverable opportunity cost of resources locked in *now* for a future that might value them differently. It’s humility, not disdain.

  **Aris Thorne:** You mentioned psychological connectedness earlier – the idea that discounting might reflect weaker bonds across generations. But Lena, these are strangers! Our connection to 2150 is vanishingly thin, no different in *kind* from our connection to strangers across the globe today. We don't discount aid to distant famine victims because we aren't 'psychologically connected' to them. We base it on need and capacity to help. Why should thin psychological bonds over time justify discounting when thin bonds over space don't? Isn't that just temporal parochialism dressed up?

  **Lena Voss:** You’re right that for *strangers*, psychological connectedness is a weak reed for discounting. I brought it up only to highlight the difference between *personal* future discounting and *social* discounting. For society, the chain of connectedness *is* broken over centuries in a way it isn't across space today. There’s no continuous thread of shared experience or reciprocal obligation stretching to the 2150s. But my core argument isn't reliant on that. It's about the decision context: acting irrevocably *now* with imperfect tools for a future we cannot truly speak for, coupled with the sheer *magnitude* of the compounding effect over 130 years. A zero δ gives equal *theoretical* weight, but in practice, it risks grotesque distortion, demanding near-infinite sacrifice today for vanishingly small probabilistic benefits in an unimaginably distant future, drowning out more immediate, knowable obligations. The positive δ prevents present generations from being enslaved by the theoretical demands of the infinitely distant future.

  **Aris Thorne:** So it boils down to a safeguard against the tyranny of the theoretical future? A practical circuit-breaker? But doesn't the growth term *already* heavily discount consumption benefits far in the future? Adding δ feels like double-counting a precaution we could model more transparently elsewhere. And the moral cost remains: we *are* saying their well-being matters less *because* they are born later. We’re privileging our own position in time.

  **Lena Voss:** It’s not double-counting. The growth term accounts for *expected* wealth reducing marginal utility. The δ accounts for the *uncertainty in our entire framework* for valuing that future utility and the *opportunity cost* of binding resources across an unbridgeable temporal gulf. It’s a small premium for radical ignorance and irreversibility. The moral cost, Aris, is *not* discounting lives; it’s potentially impoverishing the present for a future that might not value or need our specific sacrifice, or might not exist. It’s balancing moral symmetry with moral responsibility to the tangible present.

  **Silence hangs for a moment, the rain a constant backdrop.**

  **Aris Thorne:** To persuade me, Lena, you would have to demonstrate convincingly that the pure time preference rate isn't just a convenient numerical proxy for epistemic uncertainties and opportunity costs that *could*, in principle, be explicitly modeled within our shared empirical framework – growth distributions, utility function uncertainty, or catastrophe sets – without resorting to discounting welfare based solely on the calendar.

  **Lena Voss:** And to persuade me, Aris, you would have to show that the profound uncertainty and the fundamental discontinuity between present action and future consequence over 130 years can be fully captured *without* resorting to a small δ, and that applying perfect moral symmetry across such vast temporal distances *doesn't* lead to absurd practical demands that neglect our primary duties to the generations who will actually bear the cost of building this wall.
