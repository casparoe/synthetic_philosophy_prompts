    Let's write the tree in prose.
answer: |-
  Start from the common ground: we all grant that there is heritable variation in fitness in real populations. The first branching question is whether a unit of selection must be a replicator—requiring high-fidelity copying of a specific structure, like a gene sequence—or if it can be a mere reproducer, where parent–offspring resemblance suffices even without exact structural duplication. If replicator status is necessary, you land at gene selectionism: genes are the sole units because only they meet the high-fidelity standard, as seen in cases like meiotic drive where selfish alleles spread despite organismal costs. This view treats higher levels as transient vehicles. If a reproducer is sufficient, proceed to the next question.  

  Now ask whether differential persistence alone—such as a long-lived clonal organism outlasting competitors without reproducing—can constitute selection, or if differential reproduction (with inheritance) is mandatory. A "yes" here doesn't immediately commit to a named position but signals openness to broader selective processes, like ecosystem-level persistence, which may align with pluralism later. A "no" restricts selection to traditional reproduction-based scenarios. Either way, move to the inheritance question: must inheritance rely on particle-like structure (discrete, Mendelian units) to prevent blending away variation, or is any parent–offspring resemblance adequate? Particle-ism often supports gene-centric views; its rejection allows for group or organismic inheritance via trait covariance, as in cultural transmission or holobiont microbiomes.  

  Next, probe group selection: can it occur? If no, skip ahead. If yes, how should it be detected—using neighbour-modulated fitness (inclusive fitness, focusing on individual traits and social partners) or contextual analysis (regressing fitness on group-level traits)? These methods converge mathematically in simple cases but diverge when group composition affects individual fitness nonadditively, like in trait-group models. Preference for neighbour-modulated fitness often downplays group selection as reducible; contextual analysis affirms it. Then, must groups undergo reproduction (e.g., fission like cells) to qualify as units, or is differential survival of existing groups enough? Requiring reproduction leads to MLS2 (multilevel selection 2), where groups are Darwinian populations in their own right, as in obligate group-reproducing species. Allowing mere survival yields MLS1, where groups are interactors but not reproducers, as in temporary trait groups affecting individual fitness.  

  After groups, address the gene–organism–group hierarchy: are these levels objective features of nature, or do they depend on the descriptive grain—for example, is a holobiont a unified unit or a collection of host and microbial traits? Objectivism typifies realist positions; grain-relativism suggests pluralism. Finally, ask if selection can act at multiple levels simultaneously, like gene-level cheating in somatic vs. germline conflicts or group-structured adaptations. A "no" here, combined with prior answers, funnels toward organism-only views that dismiss sub- and supra-organismal selection.  

  The leaves: Gene selectionism emerges from requiring replicators and particle inheritance, often rejecting group selection. Organism-only views arise from denying both gene-level and group-level selection, emphasizing organisms as the sole interactors. MLS1 realism comes from affirming group selection via survival (not necessarily reproduction), detected contextually, with objective levels. MLS2 realism requires group reproduction and objectivism. Pluralism ("it depends") appears when grain-relativism is accepted, or when multiple levels (e.g., gene and group) are endorsed without exclusivity, particularly if differential persistence is allowed or if detection methods are seen as pragmatic tools.  

  Unoccupied combinations: First, requiring replicators but rejecting particle inheritance is incoherent—replicators inherently demand particulate fidelity to maintain structure. Second, combining MLS2 with the rejection of group reproduction is logically inconsistent, as MLS2 defines groups as reproducers. Third, insisting on differential persistence while denying multilevel selection (e.g., organism-only) is merely unattractive; it ignores persistent higher-level entities like clonal colonies but isn't impossible. Finally, objectivism about levels paired with strong grain-relativism is unexplored, as realism typically assumes fixed hierarchies.  

  The tree struggles to cleanly separate strict MLS1 realism from pluralism when both accept group survival and contextual analysis—context matters here. If MLS1 insists levels are objective and groups are interactors only, while pluralism treats levels as context-dependent, the boundary blurs in cases like holobionts, where one could reasonably occupy either position.  

  Confidence in the branch structure is moderate, grounded in classic debates (e.g., Dawkins vs. Gould on replicators, Okasha on MLS). The least certain node is the neighbour-modulated fitness versus contextual analysis split for group detection. While they formally diverge in nonadditive scenarios, many biologists see them as interchangeable frameworks, and the choice rarely dictates the final position alone—it often correlates with prior commitments to individualism or holism rather than cleanly partitioning the views.
