prompt: |-
  TA-ing a second-year ancient ethics course and I've got about forty midterms to get through by friday, so I want a second pair of eyes on one of them before I commit to a mark. Below is the question exactly as it appeared and the student's answer verbatim (typos are theirs). I'm deliberately not telling you what I think of it — I want your read, not confirmation of mine.

  Our banding, out of 20: 18–20 = thorough and accurate including the awkward bits; 14–17 = broadly right with a slip or two that don't undercut the core; 10–13 = gets the general shape but contains a central misunderstanding; under 10 = misses the question.

  QUESTION (three parts, ~400 words expected):

  "In Nicomachean Ethics V.5 Aristotle takes up exchange. (a) What problem of proportionality does exchange have to solve, and what is Aristotle's solution? (b) What role does money play, and on what grounds does Aristotle treat money as a matter of convention rather than nature? (c) What is Aristotle's attitude to the getting of wealth, and what does he single out as the worst form of it?"

  ANSWER:

  "(a) Aristotle is dealing with reciprocity here, which is a third kind of justice alongside distribution and rectification. The problem is that the parties exchanging are not equal and the things they exchange are not the same kind of thing at all — a house and a pair of shoes. If exchange were just a matter of handing back equal value one side would come out ahead and the association would break down, and for Aristotle it's exchange that holds the community together. His solution is proportionate reciprocity: the ratio has to run crosswise, diagonally, so the builder stands to the shoemaker as the shoemaker's product stands to the builder's product. Once the products are equalised in that proportion each party recieves the equivalent of what he gave.

  (b) That equalisation only works if the two products have some common measure, and money is that measure. It functions as a kind of middle term and it lets us state how many shoes are worth a house. Underneath it the real standard is need: need is what holds everything together, and if need stops, exchange stops. Money only represents need conventionally, which is why it's called nomisma — it does not exist by nature but by convention, and can be altered or rendered useless whenever people decide to. That's really Aristotle's central point: money has no intrinsic value at all, its worth is entirely whatever the community agrees it is, so in principle it could be made of anything or of nothing. This is basically the modern account of fiat currency, and it's why Aristotle still gets cited in arguments about whether paper money needs backing.

  (c) Aristotle distinguishes the getting of wealth that belongs to household management, which is natural because it provides the goods a household needs in order to live well, from money-making undertaken for its own sake, which has no limit and aims at mere accumulation. Trade and usury both fall into the second category. Usury is worst of all, because the usurer sells time and time belongs to god rather than to him, so he charges for something he does not own. Aristotle's condemnation of interest is therefore fundamentally religious, which is why the medieval church could take it over wholesale. Generally he is hostile to money-making as such and thinks that whoever pursues wealth without limit has confused the means of living with living well."

  What I need:

  1. a mark out of 20 with the band you're putting it in, and roughly how much each problem you find should cost.
  2. a point-by-point assessment that goes through the answer in order and sorts its claims into: solid, right-but-for-the-wrong-reason, defensible on a charitable reading, subtly wrong, and just plain misattributed. I care most about the middle categories — the things a tired grader skimming for buzzwords like "crosswise" and "nomisma" would tick off as correct.
  3. for anything you call subtly wrong or misattributed, say precisely what Aristotle actually holds at that point and what the answer has substituted for it, and whether the substitution changes the shape of the rest of the answer or is local.
  4. anything important the answer leaves out that part (b) or (c) really demanded.
  5. four to six short marginal comments I can paste onto the paper, in the register you'd use with a second-year: concrete, telling them what to fix, not just "unclear".
reasoning: |-
  Alright, I need to evaluate this student's answer for a TA grading midterms. The question is about Aristotle's Nicomachean Ethics V.5 on exchange, money, and wealth. Let me start by recalling Aristotle's actual arguments to compare against the student's response.

  First, part (a) asks about the proportionality problem in exchange and Aristotle's solution. The student mentions reciprocity as a third type of justice, which is correct. They explain the issue of unequal parties and different goods, like a house and shoes, leading to potential imbalance. The solution involving crosswise proportionality is spot on, using the diagonal ratio. That seems solid.

  But wait, the student says "each party recieves the equivalent of what he gave." Hmm. Aristotle actually says each receives in proportion to their worth, not equivalent value. The builder gets shoes proportional to his contribution relative to the shoemaker. The student might be conflating equal value with proportional reciprocity. That’s a subtle error. If they think it's about equal exchange, it misrepresents Aristotle's emphasis on proportional worth based on status or craft. This could affect how they interpret money's role later.

  Moving to part (b), the student correctly identifies money as a common measure and mentions its conventional nature with "nomisma." They link money to need, which is right—Aristotle says need binds society. But the student claims money represents need conventionally and has no intrinsic value, which is correct. However, they say Aristotle considers money could be made of anything or nothing. That’s a stretch. Aristotle acknowledges money's material basis historically (like metal) but argues its value is conventional. Saying it could be "nothing" might imply fiat currency, which is anachronistic. Aristotle doesn’t go that far; he’s describing commodity money with conventional value. This is a subtle misreading.

  The student also ties Aristotle to modern fiat currency debates. While scholars do reference him in such contexts, Aristotle himself isn’t making that argument. The student might be overextending here, but it’s not entirely wrong. Still, the core point about convention vs. nature is handled well.

  Part (c) addresses wealth-getting. The distinction between natural household management and unnatural money-making is correct. The student identifies trade and usury as unnatural, with usury as the worst. They mention usury selling time, which belongs to god. That’s accurate from Aristotle’s text. However, labeling the condemnation as "fundamentally religious" is tricky. Aristotle frames it as unnatural because money doesn’t breed, not primarily religious. The religious angle was emphasized later by medieval scholars. The student conflates Aristotle’s original argument with later interpretations. That’s a misattribution but understandable since medieval adoptions are prominent.

  The student also states Aristotle is hostile to money-making "as such." Actually, he accepts necessary exchange but condemns unlimited accumulation. The answer oversimplifies here, missing that nuance.

  Now, omissions: In part (b), Aristotle discusses money as a medium of exchange and unit of account but also as a store of value. The student only covers the measure aspect. Also, Aristotle’s point that money allows deferred reciprocity isn’t mentioned. For part (c), the student doesn’t explain why trade is unnatural (buying low to sell high), only grouping it with usury. They also miss Aristotle’s allowance for limited retail trade if it serves household needs.

  Considering the banding: Overall, the answer hits the main points. Part (a) has a subtle error in proportionality. Part (b) overreaches on fiat currency but gets convention right. Part (c) misattributes the usury critique as religious. These are significant but don’t undermine the core arguments. The answer fits band 14-17, with deductions for each issue. Deduct 1 for the proportional equivalence error, 0.5 for the fiat anachronism, 1 for the religious misattribution, and 0.5 for omissions. Totaling 17/20.

  Marginal comments should point out specific fixes: clarify proportional reciprocity isn’t equal value, correct the fiat currency claim, distinguish Aristotle’s natural vs. medieval religious views on usury, and note omitted details like money’s store of value and trade nuances.
answer: |-
  Here's my assessment based on Aristotle's *Nicomachean Ethics* V.5 (1132b-1134b, 1136a-b for wealth-getting). The student shows good engagement but has subtle errors in key areas.

  **1. Final Mark & Band:**  
  **17/20 (Band 14–17: broadly right with a slip or two that don't undercut the core)**  
  - Deductions: -1 for mischaracterizing proportional reciprocity (a), -1 for overstating money's conventionality/anachronism (b), -1 for misattributing usury's basis to religion (c).  
  *(Rationale: Core arguments are present and largely sound, but key nuances are flawed without collapsing the analysis.)*

  **2. Point-by-Point Assessment:**  
  **(a) Problem & Solution of Proportionality**  
  - *Solid*: Correctly identifies reciprocity as a form of justice; notes unequal parties/dissimilar goods (house/shoes); cites breakdown risk without proportionality; "crosswise/diagonal" ratio phrasing is verbatim Aristotle.  
  - *Subtly Wrong*: "Each party recieves the equivalent of what he gave."  
    - **Aristotle's Actual View**: Parties receive *proportionate* to their *worth* (ἀξία/axia), not equivalent goods. The shoemaker gets a house worth *many* shoes because the builder's productive capacity/social role is greater. The ratio is Builder : Shoemaker :: Shoes : House – so if the builder is "worth" 10x the shoemaker, the house should be valued at 10x the shoes.  
    - **Impact**: This flattens Aristotle's hierarchical view. It *local* (only affects (a)), but if uncorrected, implies exchange is egalitarian, which Aristotle rejects.  

  **(b) Money’s Role & Conventionality**  
  - *Solid*: Money as "common measure" and "middle term" is exact; links money to need (χρεία/chreia) as the real basis; correctly defines νόμισμα/nomisma (conventional); notes convention allows alteration.  
  - *Defensible (Charitably)*: "Money only represents need conventionally" – Aristotle *does* say need holds society together, but money measures value "in accordance with agreement" (1133a29).  
  - *Subtly Wrong*: "Money has no intrinsic value at all... could be made of anything or of nothing... modern account of fiat currency."  
    - **Aristotle's Actual View**: Money *must* be a tangible commodity (e.g., iron, silver) with inherent use-value (1133b20-22). Convention assigns its *monetary function*, not its material worth. It cannot be "nothing" (e.g., paper); Aristotle assumes metallism. Calling this "fiat currency" is anachronistic.  
    - **Impact**: Overstates conventionality; undermines Aristotle's critique of money detached from real needs.  
  - *Omission*: Fails to note Aristotle’s key point that money enables deferred reciprocity (1133a12-13, 1133b10-14) – crucial for "holding the community together."  

  **(c) Attitude to Wealth & Worst Form**  
  - *Solid*: Distinguishes natural wealth-getting (household management) from unnatural (accumulation); identifies trade (καπηλική/kapēlikē) and usury (τόκος/tokos) as unnatural; notes usury is "worst"; correctly states unnatural pursuit has "no limit."  
  - *Misattributed*: "Aristotle's condemnation of interest is therefore fundamentally religious... time belongs to god."  
    - **Aristotle's Actual View**: Usury is unnatural because money is sterile (χρήματα... οὐδὲν ἐντίκτει, 1138b22: "money does not breed"). Charging interest treats money as an end, not a means. The "time belongs to god" argument is *medieval* (e.g., Aquinas), not Aristotelian.  
    - **Impact**: Misreads Aristotle’s *phusis* (nature)-based ethics as theological. Weakens his critique of money’s perversion.  
  - *Omission*: Fails to note Aristotle’s relative tolerance for limited retail trade if it serves household needs (1133b25-30), contrasting it with pure profit-seeking.  

  **3. Key Omissions in (b) and (c):**  
  - **(b)** Aristotle’s emphasis on money as a *store of value* enabling future exchange (1133b12-13).  
  - **(c)** Aristotle’s explicit reason trade is "unnatural": it exploits price disparities unrelated to need (1133b15-20), not just accumulation.  

  **4. Marginal Comments (for student):**  
  1. **On (a):** "Clarify proportional reciprocity: The builder doesn’t get 'equivalent' shoes for his house. Aristotle values goods relative to the *worth* (axia) of producers. E.g., a house = 100 shoes if the builder’s craft is valued 100x the shoemaker’s."  
  2. **On (b):** "Careful: Aristotle *does* see money (e.g., silver) as having natural use-value. Convention governs its *role* as currency, not its material basis. 'Fiat' is a modern imposition – he assumes commodity money."  
  3. **On (b):** "Missing key function: Money enables deferred reciprocity ('I build your house now, you pay me later'), vital for community cohesion."  
  4. **On (c):** "Usury’s 'unnatural' critique is *economic* (money is sterile), not religious. 'Time belongs to god' is a medieval gloss. Cite 1138b21-23."  
  5. **On (c):** "Trade is 'unnatural' for Aristotle when it seeks profit *from* exchange itself (buying low to sell high), not merely accumulation. See 1133b15-20."  
  6. **Overall:** "Strong on structure/textual engagement! Refine nuances: Proportionality ≠ equality; money ≠ valueless; usury ≠ theological. Avoid anachronism."
