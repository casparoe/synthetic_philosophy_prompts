prompt: |-
  Bit of background first, because it explains why I'm asking you rather than a colleague. I spent thirty-odd years running a mass spectrometry lab for the environment agency — isotopes in groundwater, that sort of thing — and since retiring I've been reading philosophy properly for the first time, and I now help out teaching an evening class at the adult college in town, twelve of us, mostly retirees plus a couple of night-shift nurses. This year we've done persons and selves: Hume's bundle, Locke's prince and cobbler, Parfit on why identity isn't what matters, and then six weeks on the Buddhist side, anatta, the chariot business between Nagasena and the king in the Milindapanha, the aggregates, rebirth without anybody doing the rebirthing. I've been asked to set and mark the final take-home essay, 1,200 words, three weeks to do it, worth 20 marks. I can write a question easily enough; what I can't do from where I'm sitting is say with any confidence what a genuinely good answer looks like as opposed to a fluent-sounding one, which is where I need you.

  Here's the crux I want the question built round, and it came out of something I said rather badly in week nine. The class kept hitting the same wall: if there's no self, only a causally connected series of aggregates, then who is it that inherits the karma, and what stops the reductionist's "person" from being a self with the label scraped off? I mentioned the Pudgalavadins, the personalist school that said the person is neither identical to the aggregates nor different from them, and I gather they leaned on a fire-and-fuel picture — the aggregates are the fuel, the person the fire — and that Vasubandhu tacked an extra chapter onto his Abhidharmakośa specifically to knock them down. One of the nurses then said, "but you can light two candles from one, can't you," and that's the seed I want in the question: suppose a single stream of aggregates causally branches and lights up two successor streams, both continuous with the original in exactly the way the reductionist says continuity works. Then have the students say what the personalist's person is supposed to be in that case — one, two, neither — and whether the branching case is worse for the personalist or for the straight reductionist, and whether the reductionist can answer the karma objection with nothing but causal continuity and the conventional/ultimate distinction. The question must be one they cannot get through by retelling the chariot exchange, listing the five aggregates, or writing a paragraph about how Parfit and the Buddhists agree; if an answer only does that, it should be markable as a fail, and the marking scheme has to say so in terms I can apply to a real script at eleven at night.

  So: write the essay question itself (word it as it would appear on the paper, with whatever guidance about scope you think helps), then a model answer of about 700 words, then a 20-mark scheme split into five or six must-hit moves with the marks each carries and a line apiece on how people typically botch them — for instance, treating "no self" and "no person" as the same claim, or congratulating the personalist for finding a middle way without saying what explanatory work the person is now doing that the aggregates couldn't do, or invoking fission as if it settled things when it mostly relocates the problem. And please don't hedge the whole thing into mush: I want you to actually say which side you think comes out better on the branching case and why, since I'll be arguing with the class about it afterwards. Two things on top. First, tell me where your model answer is resting on a contested reading — I know there's a live scholarly row about whether anatta is a flat metaphysical denial or more of a practice of not-clinging that stays quiet about whether there's a self, and I suspect that changes what counts as a good answer — and say what argument or consideration would make you write a different model answer and re-score the moves, i.e. where your reasoning is most likely to break. Second, British English throughout, please; the college is fussy about that sort of thing and so, frankly, am I.
