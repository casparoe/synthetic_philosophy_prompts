prompt: |-
  I have no academic background in any of this. For about fifteen years I have worked as an intake coordinator at a community mental health clinic, which puts me at the exact point where the words people arrive with meet the forms that get filed, and I have spent a long time trying to describe a pattern I keep running into and cannot find a name for.

  The pattern, stripped down, is a circuit that runs through a measuring instrument. A diagnostic category comes with a screening questionnaire, and the questionnaire has a vocabulary. That vocabulary escapes the clinic. It turns up in school newsletters, workplace wellbeing material, magazine quizzes, and eventually in the mouths of the people sitting across from me, who describe themselves in phrases lifted almost word for word from the instrument's own items. Scores on the screener rise. Nobody is exaggerating and nobody is being coached; the answers are honest answers to the questions asked. Clinicians and administrators then read the rising scores as evidence that the condition is more common, or broader in its expression, than the official criteria suppose, and they cite those scores when they argue for widening the criteria or lowering an eligibility threshold. Once the category is wider, more people qualify, more material is written for them, and more of the vocabulary escapes. Around it goes again.

  Two things I have seen make it concrete for me. First, an adult attention-difficulty screener: within a few years the specific phrasing of its items had become ordinary conversational English in our area, the mean intake score had moved substantially, and the referral sources and the population we served had not changed at all. Second, and in the other direction, a heavily stigmatised diagnosis from an earlier decade: once its name became widely known and instantly recognisable, people stopped volunteering it and started describing the same difficulties in different language, and our recorded rate fell while the caseload in front of me looked, to my eye, very much the same. That second case is part of why I don't think this is simply about labels being attractive.

  When I try to explain it, I get told it is a self-fulfilling prophecy, or it is medicalisation. Neither seems right. A self-fulfilling prophecy needs somebody to hold a belief that is false and then make it true; here the statistics genuinely change, and the false step is the inference drawn from them — true numbers, wrong conclusion. Medicalisation is about a profession extending its authority over conduct that used to be handled elsewhere; here nobody is extending anything, and the professionals are being moved by their own instrument.

  So: does this have a name, and if so what is it? If there are several near neighbours in the literature on classification, lay out how each differs from what I have described and which one fits best, and tell me plainly if I am running two separate mechanisms together and calling them one. If nothing established fits, coin a term, define it, and give me its boundary conditions — what would have to be true for the circuit not to close, in categories that are not self-reported, or whose vocabulary never escapes the clinic, or that people actively avoid. And is my second case the same mechanism running backwards, or a different one that I have mistaken for its mirror image?

  I am not after a label so much as the carving: what exactly the phenomenon is, what it is not, and where its edges sit. Please be explicit about which parts of your answer are settled among people who work on this and which are genuinely contested. My impression is that the general claim — that a classification changes the people it classifies — is not seriously disputed, but that whether it corrupts prevalence evidence in the way I have described, and whether anything can be done about it, is argued about bitterly. If you find one side of that dispute more convincing, say so, but do not let it come through as the consensus if it is not. Finally, if naming a particular thinker helps me locate an idea, do so, but please do not hand me a reading list; I cannot chase references and I am not asking for any.
reasoning: |-
  Okay, let me unpack this fascinating query. The user describes a looping pattern they've observed over 15 years in mental health intake: diagnostic vocabulary escaping clinics into public discourse, altering self-reports, inflating screening scores, and triggering diagnostic expansion - all without conscious coaching or exaggeration. 

  First, I need to recognize their expertise. Though they disclaim academic background, this is precise phenomenological observation from someone deeply embedded in classification systems. Their rejection of "self-fulfilling prophecy" and "medicalization" shows they've already engaged critically with common explanations. The two concrete examples (ADHD screener phrases becoming colloquial; stigmatized diagnosis disappearing linguistically) suggest they're noticing how language mediates between lived experience and institutional categories.

  The core question has three layers: naming the phenomenon, distinguishing it from adjacent concepts, and determining if the stigmatized-diagnosis case is the inverse mechanism. Their meta-request is crucial too - they want clarity on where academic consensus exists versus where debates rage, without getting buried in references.

  Hmm... existing frameworks do dance around this but don't quite capture the closed loop. Baudrillard's simulacra comes close with signs replacing reality, but lacks the institutional feedback mechanism. Hacking's "looping effects" explicitly addresses classification changing people, but focuses on identity formation rather than measurement artifacts. Diagnostic creep literature describes threshold-lowering but misses the linguistic vector.

  Ah! The missing link seems to be how instrument language becomes folk psychology then feeds back into measurement. That's distinct from medicalization (which is about power expansion) or self-fulfilling prophecy (which requires false belief). The stigmatized diagnosis example does appear to be the same mechanism in reverse - where vocabulary avoidance breaks the loop.

  For boundary conditions: the circuit couldn't form with purely biological markers (no self-report mediation) or if diagnostic language remained technical (no public adoption). The bitter debates they mention likely center on whether this represents true prevalence increases versus measurement artifact - with constructivists seeing real transformations and positivists crying circularity.

  I'll position this as a diagnostic feedback loop with three necessary components: porous language, reflexive self-assessment, and institutional response to amplified signals. Should emphasize that while academics fight about implications, the mechanism itself aligns with well-established sociology-of-knowledge principles. And yes - that second case is absolutely the loop running backward when vocabulary becomes toxic.
answer: |-
  Based on your precise description and thoughtful exclusions, the core phenomenon you've identified is best understood as a **Diagnostic Feedback Loop (DFL)**, specifically mediated by **instrumental semantic diffusion**. Here's the carving:

  1.  **The Name & Core Mechanism:**
      *   **Diagnostic Feedback Loop (DFL):** This captures the cyclical nature: diagnostic tool language -> public dissemination -> altered self-reporting -> changed instrument scores -> institutional response (widening criteria) -> further dissemination.
      *   **Mediated by Instrumental Semantic Diffusion:** This specifies *how* the loop operates: the specific vocabulary/phrasing of the screening instrument diffuses into lay discourse, becoming the accepted framework for describing experiences. People internalize this language to articulate their own states, answering the instrument "honestly" but within the conceptual box the instrument provides.

  2.  **Why Established Terms Don't Quite Fit:**
      *   **Self-Fulfilling Prophecy (SFP):** As you note, SFP requires a *false initial belief* that then causes its own confirmation. In a DFL:
          *   The initial instrument might be valid for its *intended* population/symptom severity.
          *   The rising scores are often "true" measurements *within the new linguistic/conceptual framework*, not fabrications.
          *   The error lies in misinterpreting *why* scores rose (semantic shift & population shift) and inferring a need for diagnostic expansion, not in a belief *directly* causing the phenomenon it describes.
      *   **Medicalization:** This focuses on the profession *actively* claiming jurisdiction over new areas of life (e.g., pathologizing grief). In a DFL:
          *   Expansion is often driven *reactively* by rising scores and perceived clinical need.
          *   The primary engine is the *unintended semantic escape* of the instrument and its subsequent feedback, not a top-down professional power grab. Professionals are often responding to data they (mistakenly) believe reflects an underlying reality.
      *   **Diagnostic Creep/Expansion:** These describe *what happens* (criteria widen) but not the *mechanism* driving it. The DFL explains *how* that creep can be fueled by the instrument itself.
      *   **Hacking's "Looping Effects" (Interactive Kinds):** This is the *closest* established concept (Ian Hacking, philosopher/historian of science). It argues that classifying human kinds (like diagnoses) changes how people classified understand themselves and behave, thus changing the kind itself. **The DFL is a specific *subtype* and *mechanism* of looping effects:**
          *   It focuses explicitly on the role of the *screening/diagnostic instrument's language* as the vector for the loop.
          *   It highlights the *measurement artifact* (rising scores misinterpreted) as the key driver for institutional change.
          *   It emphasizes the *feedback* into the diagnostic criteria themselves.

  3.  **Boundary Conditions (When the Circuit Doesn't Close):**
      *   **Non-Self-Reported Categories:** If diagnosis relies *solely* on objective biomarkers, brain scans, or third-party observation *uninfluenced* by patient self-description, the loop breaks. The semantic diffusion cannot alter the core measurement (e.g., diagnosing a brain tumor via MRI isn't vulnerable).
      *   **Contained Vocabulary:** If the instrument's specific phrasing remains technical jargon *never* adopted by the public, media, or educational materials, the loop stalls. People describe experiences in pre-existing or alternative language, leaving instrument scores relatively stable.
      *   **Actively Avoided Vocabulary:** As in your second case, if the label is highly stigmatized, people *actively avoid* using its associated vocabulary and framing. They describe the same difficulties using different (often vaguer or somatic) terms, leading to *lower* instrument scores and potential *under*-recognition, breaking the expansionary feedback loop. This *is the same mechanism running in reverse*: the semantic diffusion happens, but the valence is negative, repelling identification rather than attracting/channeling it.

  4.  **Your Second Case: Mirror Image Confirmed:**
      Yes, the stigmatized diagnosis case *is* the exact same Diagnostic Feedback Loop mechanism operating in reverse due to negative valence. Instrument language escapes -> becomes widely known and stigmatized -> people actively avoid using it and reframe their experiences -> scores *decrease* -> institutions *may* interpret this as reduced prevalence or narrow criteria (or attribute it solely to stigma) -> the category potentially contracts or remains static. The core loop (language escape -> altered self-reporting -> changed scores -> institutional response) is identical; the *direction* of change is inverted.

  5.  **The State of Consensus and Debate:**
      *   **Settled:** There is strong consensus across sociology of medicine, philosophy of psychiatry, and critical psychology that:
          *   Classifications, especially psychiatric ones, shape how people experience and articulate their own distress (Hacking's "looping effects" is widely accepted as real).
          *   Diagnostic criteria and instruments evolve over time due to complex social, cultural, and institutional factors (not just scientific discovery).
          *   Stigma powerfully influences help-seeking and self-reporting.
          *   Self-report instruments are vulnerable to framing effects and cultural shifts.
      *   **Bitterly Contested:**
          *   **The Prevalence Evidence Corruption:** Whether rising scores *primarily* reflect a DFL artifact *or* genuinely uncover previously unrecognized/under-treated suffering is fiercely debated. Proponents of expanded criteria argue the instruments *reveal* true burden; critics argue they *create* measurement artifacts driving inappropriate expansion. Your observation sits squarely in this debate.
          *   **Causality vs. Correlation:** How much weight to give the DFL mechanism vs. other factors (increased awareness reducing stigma, genuinely changing environmental stressors, pharmaceutical marketing, etc.) in explaining rising rates is contested.
          *   **"What can be done?":** There's no consensus. Possibilities debated include: more "objective" biomarkers (problematic for many conditions), stricter criteria anchoring, instrument wording resistant to diffusion, critical education about framing effects for clinicians, separating diagnostic instruments from eligibility thresholds. All have significant drawbacks and opponents.

  6.  **A Thinker for Context:**
      *   **Ian Hacking ("Looping Effects of Human Kinds"):** As mentioned, his work provides the broadest philosophical framework for how classifications interact with the classified. Your DFL is a brilliant, concrete, operationalized example of how this looping effect works via specific instruments and language in a mental health setting.

  **In Summary:**

  You've identified a **Diagnostic Feedback Loop (DFL)**, driven by **instrumental semantic diffusion**. It's a specific mechanism within the broader realm of Hacking's "looping effects." It explains how the language of screening tools escapes, shapes self-understanding and reporting, inflates scores, and drives diagnostic expansion based on a misinterpretation of the score increase. The stigmatized diagnosis case is the same loop running in reverse due to negative valence. While the *potential* for classifications to change people is well-established, whether this *specific mechanism* corrupts prevalence evidence for common self-reported conditions is a core, unresolved battle in mental health classification. Your frontline perspective provides compelling evidence that it does.
