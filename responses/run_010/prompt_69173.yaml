  ### **Handout (1 Page)**  
  **Community Garden Experiment**  
  *You are gardeners tending plots. Some have thriving soil (easy upkeep), others struggle (need extra work). Supporters decide whether to donate compost (chips) to you.*  

  **Rules**:  
  1. Each round, you’re randomly paired and assigned as Gardener or Supporter.  
  2. **Gardeners**:  
     - Get 10 chips.  
     - Learn your soil type: **Thriving** or **Struggling** (secret).  
     - Choose effort for plot prep: 0, 1, or 2 chips (burned immediately).  
  3. **Supporters**:  
     - See your gardener’s effort.  
     - Decide: donate (transfer chips) or keep.  
  4. **Payoffs**:  
     - Gardeners: 10 - effort cost + donation (if received).  
     - Supporters: 10 - donation cost + satisfaction (varies by soil).  
  5. **No talking**—use index cards.  

  ---

  ### **Debrief Script**  
  1. **Map Outcomes to Concepts**:  
     - **Round 1**: High waste (burned chips) but no information → *Waste ≠ reliability*.  
     - **Round 2**: Low waste, reliability from **benefit asymmetry** (donation matters more to Struggling).  
     - **Round 3**: Reliability from **cost asymmetry** (effort cheaper for Thriving).  
     - **Round 4**: Reliability from **reputation** (no waste).  
  2. **Confront Deflationist Charge**:  
     - *Discriminating Round*: Round 1. Vindication for your friend would be separation (e.g., only Struggling burn effort).  
     - *Reply to Relabeling*: Round 2’s reliability comes from benefit asymmetry, not cost. Calling it "signaling" is circular when benefit asymmetry explains it cleanly.  
  3. **Key Distinctions**:  
     - Waste vs. Asymmetry: Reliability requires *differential* costs/benefits, not absolute waste.  
     - Reliable vs. Informative: Round 1 efforts were uninformative despite cost.  
     - Cost vs. Constraint vs. Punishment: Rounds 3, 2, and 4 show three stability mechanisms.  

  ---

  ### **Predicted Failure Modes & Fixes**  
  1. **Students talk**:  
     - *Fix*: Assign "silence monitors" (volunteers get bonus chips). Confiscate chips from offenders.  
  2. **Honesty norm prevents "lying"**:  
     - *Fix*: Frame choices neutrally ("effort levels," not "truth/lies"). Stress chip maximization.  
  3. **Patrons donate indiscriminately**:  
     - *Fix*: In Rounds 2/3, remind supporters: "Your satisfaction depends on soil type!"  
  4. **Gardeners under-effort in Round 1**:  
     - *Fix*: Announce mid-round, "Supporters only help prepped plots!" to induce effort=1.  
  5. **Math errors under pressure**:  
     - *Fix*: Provide payoff tables on whiteboard. Use chip denominations of 1 (no arithmetic).  

  ---

  ### **Honest Limits**  
  **What the activity cannot replicate**:  
  - Participants consciously strategize, while biological signals evolve.  
  - Receiver psychology is static; no co-evolution.  
  - Types are discrete, exogenous, and private (no continuous variation).  
  - Additive chips ignore non-linear fitness (e.g., diminishing returns).  
  - **Most Misleading Gap**: Additive payoffs risk implying fitness is linear. **Explicitly clarify** that real fitness is multiplicative.  

  **Run Time**: 15 min setup, 15 min/round (3 rounds = 45 min), 15 min debrief. Optional Round 4 adds 10 min. Total: 75-85 min.  

  ---  
  **Materials Needed**: Index cards (type assignments), poker chips (100+), whiteboard, markers. Handout printed for all.  
  **You can run this Tuesday**. No prep beyond materials.
