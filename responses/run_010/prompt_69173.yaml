  Below is a complete, ready-to-run classroom activity designed to address your requirements. It uses a "Community Garden" cover story to avoid biological or economic clichés. The activity requires minimal setup (index cards for assignments, poker chips, whiteboard for tallies) and runs within 90 minutes. Handout instructions are at the end.

  ---

  ### **Cover Story: Community Garden Plots**
  - **Artists = Gardeners**: Tend plots needing support. Two types:  
    - **Thriving (T)**: Healthy soil; only needs minimal upkeep.  
    - **Struggling (S)**: Poor soil; needs extra resources to yield.  
  - **Patrons = Supporters**: Decide whether to donate compost (chips) to gardeners.  
  - **Display = "Preparation Effort"**: Time/energy spent preparing the plot (burning chips). No verbal communication.  

  **Key Avoidances**: No "signal", "honest", "handicap", "quality", or "free rider" language. Types are neutrally framed (Thriving/Struggling).  

  ---

  ### **Game Structure**
  - **Participants**: 22 students → 11 Gardeners (senders), 11 Patrons (receivers).  
  - **Rounds**: 3 rounds (4th optional). Re-pair and re-type each round.  
  - **Mechanics**:  
    - Gardeners learn type (via index card), choose **effort level** (0, 1, 2 chips).  
    - Effort costs chips (burned immediately).  
    - Patrons see effort, decide to **donate** (transfer chips) or not.  
    - Payoffs calculated. Public tally of **burned vs. transferred chips** after each round.  
  - **Enforcing Silence**:  
    - Use index cards for choices (gardeners: effort level; patrons: ✔/✘ for donate).  
    - Confiscate chips if students talk (social enforcement: "No chatting—focus on your plot!").  
    - Assign "silence monitors" (2 philosophy students) to watch for whispers.  

  ---

  ### **Round Parameters & Equilibria**
  **All Rounds**: 50% Thriving (T), 50% Struggling (S). Endowment = 10 chips/gardener.  
  **Menu of Effort Levels**: 0, 1, 2 chips (burned upon choice).  

  #### **Round 1: High Waste, Pooling (Targets Friend's Thesis)**  
  - **Goal**: Everyone burns high effort; no information; high waste.  
  - **Patron Rule**: "Supporters donate if effort ≥1" (enforced to create pooling).  
  - **Payoffs**:  
    | Type | Donate Received? | Payoff (chips) |  
    |---------|------------------|----------------|  
    | Thriving | Yes | 10 - effort + 1 |  
    | Thriving | No | 10 - effort |  
    | Struggling | Yes | 10 - effort + 1 |  
    | Struggling | No | 10 - effort |  
    - **Effort Cost**: 1 chip/level (same for T/S).  
    - **Donation Amount**: 1 chip (transferred).  
  - **Incentives**:  
    - If effort=0: No donation → payoff = 10.  
    - If effort=1: Donation → payoff = 10 - 1 + 1 = 10.  
    - If effort=2: Donation → payoff = 10 - 2 + 1 = 9.  
    - **Equilibrium**: Both types choose effort=1 (payoff=10). No separation, no information.  
  - **Waste**: 11 gardeners × 1 chip = 11 chips burned.  
  - **Second-Best Risk**: Effort=0 by all (payoff=10). **Steer back**: Announce, "Some plots look neglected—are you sure supporters will help?"  

  #### **Round 2: Low Waste, Separating (Asymmetry in Benefits)**  
  - **Goal**: Struggling gardeners burn low effort; Thriving do nothing; minimal waste.  
  - **Patron Choice**: Free to donate (no rules).  
  - **Payoffs**:  
    | Type | Donate Received? | Payoff (chips) |  
    |---------|------------------|----------------|  
    | Thriving | Yes | 10 - effort + 1 |  
    | Thriving | No | 10 - effort |  
    | Struggling | Yes | 10 - effort + 3 |  
    | Struggling | No | 10 - effort |  
    - **Effort Cost**: 1 chip/level (same for T/S).  
    - **Donation Amount**: 1 chip (transferred).  
  - **Incentives** (Patrons prefer donating to Thriving):  
    - Patron payoff if donate to T: 10 - 1 + 2 = 11  
    - Patron payoff if donate to S: 10 - 1 - 1 = 8  
    - Patron payoff if no donate: 10  
    - **Separating Equilibrium**:  
      - Thriving: effort=0 → patrons donate (payoff=10 +1=11).  
      - Struggling: effort=1 → patrons *do not* donate (payoff=10 -1=9).  
    - Why? Struggling get 9 < 11 (Thriving payoff), but if Struggling mimic effort=0: patrons see pooling and *stop donating* (expected payoff <10).  
  - **Waste**: Only Struggling burn 1 chip → 5.5 chips avg.  
  - **Second-Best Risk**: Pooling at effort=0. **Steer back**: Ask, "Will supporters help if all plots look the same?"  

  #### **Round 3: Cost-Asymmetry Separating (Compare to Round 2)**  
  - **Goal**: Thriving burn medium effort; Struggling do nothing; moderate waste.  
  - **Patron Choice**: Free to donate.  
  - **Payoffs**:  
    | Type | Donate Received? | Payoff (chips) |  
    |---------|------------------|----------------|  
    | Thriving | Yes | 10 - effort + 3 |  
    | Thriving | No | 10 - effort |  
    | Struggling | Yes | 10 - (2 × effort) + 3 |  
    | Struggling | No | 10 - (2 × effort) |  
    - **Effort Cost**: Thriving = 1 chip/level; Struggling = 2 chips/level.  
    - **Donation Amount**: 3 chips (transferred).  
  - **Incentives** (Patrons prefer donating to Thriving):  
    - Patron payoff if donate to T: 10 - 3 + 2 = 9  
    - Patron payoff if donate to S: 10 - 3 - 2 = 5  
    - Patron payoff if no donate: 10  
    - **Separating Equilibrium**:  
      - Thriving: effort=2 → patrons donate (payoff=10 -2 +3=11).  
      - Struggling: effort=0 → patrons *do not* donate (payoff=10).  
    - Why? Struggling would pay 4 chips for effort=2 → payoff=10 -4 +3=9 < 10.  
  - **Waste**: Thriving burn 2 chips → 11 chips total.  
  - **Second-Best Risk**: Thriving reduce effort to 1. **Steer back**: "Is effort=1 enough to show your plot is thriving?"  

  #### **Round 4 (Optional): Reputation Without Cost**  
  - Repeat Round 3 with same pairs.  
  - Patrons remember types from Round 3.  
  - **Equilibrium**: Thriving choose effort=0, get donated to (no waste). Struggling get nothing.  
  - **Contrast**: Shows reputation replaces costly displays.  

