  ### **Public Tally & Social Stakes**  
  - Post after each round:  
    ```markdown
    ROUND [X]: 
    Burned Chips: ███████ [number] 
    Transferred Chips: ███ [number]
    ```  
  - **Chips Matter Socially**: Most chips = "Golden Gardener Award" (trivial prize: e.g., pick music for debrief). Least chips = "Conservation Hero" (equal prestige).  

