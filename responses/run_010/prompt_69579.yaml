  Below is a decision tree designed to sort beliefs about vagueness using tangible cases without technical jargon. It fits on one page (front: tree, back: scoring key) and meets your constraints. The cruxes dividing positions are listed first, followed by the tree, and finally the scoring key with repair notes.

  ### Cruxes Dividing Positions
  1. **Premise Failure Point**: Does the heap argument fail at the first premise ("10,000 grains is a heap"), at the inductive step ("removing one grain preserves heap status"), or not at all?  
  2. **Cutoff Fact**: Is there a precise cutoff (e.g., a specific grain count) for "heap," and is it discoverable?  
  3. **Discoverability**: Even if there’s a cutoff, could we ever know it?  
  4. **Higher-Order Vagueness**: Is "clearly a heap" as vague as "heap"?  
  5. **Context Shift**: Does the meaning of "heap" depend on who is judging or their situation?  
  6. **Borderline Status**: Can a borderline case (e.g., a middling color patch) be both true and false?  
  7. **Gradual Change**: Does removing one grain *never* turn a heap into a non-heap?  

  ---

  ### Decision Tree  
  *Answer each question based on your immediate intuition.*  

  1. **Heap Start**: A pile of 10,000 grains is a heap.  
     - A: Agree.  
     - B: Disagree.  
     *(B → Go to **Leaf Nihilism**)*  

  2. **Heap Tolerance**: Removing one grain from a heap can never turn it into a non-heap.  
     - A: Agree.  
     - B: Disagree.  

  3. **Cutoff Existence**: There is a specific number of grains at which a heap becomes a non-heap.  
     - A: Agree.  
     - B: Disagree.  

  4. **Cutoff Knowability**: If we had a perfect heap-detector machine, it could find the exact cutoff number.  
     - A: Agree.  
     - B: Disagree.  

  5. **Color Neither**: In a strip of 200 patches from red to orange, some patches are neither red nor orange.  
     - A: Agree.  
     - B: Disagree.  

  6. **Color Both**: Some patches in the strip are both red and orange at the same time.  
     - A: Agree.  
     - B: Disagree.  

  7. **Color Context**: The same patch might be called "red" today and "orange" tomorrow, and both are okay because my judgment shifts.  
     - A: Agree.  
     - B: Disagree.  

  8. **Height Tolerance**: A student who is 6 feet tall is tall. If they lose 0.01 inches overnight, they are still tall. This remains true no matter how much height they lose.  
     - A: Agree.  
     - B: Disagree.  

  9. **Bell Both**: As a bell fades to silence, there is a point where it is both ringing and not ringing.  
     - A: Agree.  
     - B: Disagree.  

  10. **Vehicle Context**: For an electric wheelchair in the park, whether it’s a "vehicle" depends on context (e.g., why it’s there).  
      - A: Agree.  
      - B: Disagree.  

  11. **Vehicle Relativity**: A replica tank might be a "vehicle" when driven in a parade, but not when displayed as a statue, and both judgments are correct.  
      - A: Agree.  
      - B: Disagree.  

  12. **Bivalence**: Every statement like "this is a heap" is either true or false, even if we can’t tell which.  
      - A: Agree.  
      - B: Disagree.  

  ---

  ### Scoring Key (Back of Sheet)  
  *Trace your path to find your leaf. Positions are located in the crux space (see front).*  

  - **Nihilism**: 1B. *No vague word ("heap," "red") ever truly applies. Crux: Premise fails at start; no cutoff facts.*  
  - **Epistemicism**: 1A, 2B, 3A, 4B, 5B, 6B, 7B, 8B, 10B, 11B, 12A. *Sharp cutoff exists but is unknowable. Crux: Cutoff exists but is undiscoverable; bivalence holds.*  
  - **Supervaluationism**: 1A, 2B, 3B, 5A, 6B, 7B, 8B, 10B, 11B, 12B. *Borderline cases are neither true nor false (language is imprecise). Crux: Premise fails at inductive step; no cutoff facts; higher-order vagueness absent.*  
  - **Fuzzy Logic**: 1A, 2A, 3B, 5B, 6B, 7B, 8A, 9B, 12B. *Truth comes in degrees (e.g., 60% heap). Crux: Gradual change; bivalence rejected.*  
  - **Contextualism**: 1A, 2A, 3B, 7A, 10A, 11A, 12A or 12B. *Meaning shifts with context/judge. Crux: Context shift; premise fails nowhere (but context changes).*  
  - **Dialetheism**: 1A, 2B, 3B, 5B, 6A, 9A. *Some borderline claims are both true and false. Crux: Borderline both/true; bivalence rejected.*  
  - **Psychological Deflationism**: 1A, 2A, 3B, 7A, 8B, 10A, 11A, 12B. *Vagueness is about our minds, not meaning. Crux: Context shift; no cutoff facts; higher-order vagueness present.*  

  #### Unseparable Leaves  
  - **Contextualism & Psychological Deflationism** often share answers (7A, 10A, 11A). Contextualism emphasizes language; deflationism emphasizes psychology. The tree flags this overlap.  
  - **Fuzzy Logic & Supervaluationism** both reject bivalence (12B) and sharp cutoffs (3B) but diverge on color/bell cases.  

  #### Undefended Combinations  
  1. **2A + 3A + 4A** (Tolerance + Cutoff Exists + Knowable): Coherent but unattractive. If single grains *never* matter, a precise cutoff contradicts tolerance.  
  2. **5A + 6A** (Neither + Both): Incoherent. "Neither" and "both" are mutually exclusive for the same patch.  
  3. **1A + 2B + 3B + 12A** (Bivalence but no cutoff): Unoccupied. If bivalence holds, a cutoff must exist (but it’s unexplored).  

  #### Repair Menu for Inconsistencies  
  *If your answers clash, these leaves resolve tensions by abandoning one commitment:*  
  - **You said 2A (tolerance) but 12A (bivalence)**:  
    - *Abandon bivalence (12A → 12B)*: Costs logical simplicity (now truth isn’t yes/no). → Leads to **Fuzzy Logic** or **Supervaluationism**.  
    - *Abandon tolerance (2A → 2B)*: Costs intuition (single grains *can* matter). → Leads to **Epistemicism**.  
  - **You said 3A (cutoff exists) but 2A (tolerance)**:  
    - *Abandon tolerance (2A → 2B)*: Costs radical change (heap status flips abruptly). → **Epistemicism**.  
    - *Abandon cutoff (3A → 3B)*: Costs precision (no exact boundary). → **Contextualism** or **Fuzzy Logic**.  
  - **You said 5A (neither) and 6A (both)**:  
    - *Choose one*: Costs symmetry. → **Supervaluationism** (neither) or **Dialetheism** (both).  

  This tree uses your cases exclusively and avoids labels in questions. Positions are mapped to cruxes, and inconsistencies are addressed constructively. The deflationary option (psychology-focused) and contextualism are included as they capture distinct, non-technical intuitions about judgment relativity.
