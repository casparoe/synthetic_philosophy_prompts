  | 2     | accurate         | Arrow's theorem shows the impossibility of fair aggregation under its conditions. | The theorem applies to ordinal rankings and not cardinal scores, and the conditions are strong.                                         | Arrow's theorem shows that no method for aggregating individual ordinal preferences (rankings) into a social ordering can satisfy a set of reasonable conditions. However, it does not directly apply to cardinal utility aggregation. |
