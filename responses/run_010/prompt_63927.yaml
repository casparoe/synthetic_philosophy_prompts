  Now, addressing the three worries:

  1. **First worry**: Arrow's theorem assumptions and applicability to numeric scores.

     Arrow's theorem assumes that we are aggregating ordinal rankings (orderings) and requires that the aggregation method must work for any possible set of individual rankings (unrestricted domain). The conditions are: non-dictatorship, Pareto efficiency, independence of irrelevant alternatives (IIA), and the output must be a complete and transitive social ordering. The theorem shows that no method satisfies all these at once.

     However, in reward modeling, we often use cardinal scores (e.g., numerical ratings) and average them. This kind of aggregation does not satisfy IIA (because adding an alternative can change the relative scaling) but it avoids the impossibility because it uses more information. So, Arrow's theorem does not directly apply to cardinal aggregation. Therefore, saying "aggregation is impossible" is an overstatement for the cardinal case. There are other impossibility results (e.g., the Gibbard-Satterthwaite theorem) that apply to strategic voting, but Arrow is about ordinal rankings.

     Correction confidence: High (0.95) because this is a standard point in social choice theory.

  2. **Second worry**: Neutrality definition and the slide between reasons and effects.

     The worry is correct. Liberal neutrality is typically defined in terms of the reasons or justifications for state action, not the effects. For instance, Rawls and Dworkin argue that the state should not justify its actions by claiming that one conception of the good is intrinsically superior. The fact that a policy has differential effects does not necessarily violate neutrality of justification. The author seems to be conflating neutrality of justification with neutrality of effect, which are distinct. So, the argument against neutrality based on effects is attacking a straw man.

     Correction confidence: Medium-high (0.85) because there are debates about whether neutrality of justification is possible without neutrality of effect, but the distinction is well-established.

  3. **Third worry**: The median-user conclusion and the pilot example.

     The median user (Condorcet winner) is a concept from voting theory that requires a pairwise majority winner. In a one-dimensional issue space, the median voter is the Condorcet winner. However, in multidimensional spaces (which is typical for AI alignment), the Condorcet winner often does not exist due to cycles. Moreover, even if it exists, it might be a compromise that nobody prefers (as in the pilot). The author's argument jumps from the failure of aggregation and neutrality to the median user without justification. The pilot example shows that when there are deep disagreements (about why the answer matters), the median preference might be incoherent. Therefore, the median user approach is not necessarily defensible or even well-defined.

     Correction confidence: High (0.9) on the point that the median user is not always well-defined and might not be desirable. However, in some contexts (with single-peaked preferences) it can work.

