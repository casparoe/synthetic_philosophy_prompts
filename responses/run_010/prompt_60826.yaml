prompt: |-
  I have no training in economics or in mathematics beyond secondary school, and I want to be plain about that, because what follows is something I worked out for myself rather than learned. For twenty-three years I ran a small building-supply yard, and a recurring part of the job was settling with someone else how to divide the cost of a thing we both needed and both benefited from, in different degrees, with different alternatives available to each of us if we failed to agree. Over the years I converged on one rule. I have come to think it is not merely workable but correct — that it is the fair way to divide — and I want to know what would have to be true for me to be wrong about that.

  The rule. For each party, establish two figures: what they are left with if the deal collapses, and the most they could conceivably get out of the project if the cost of it fell entirely on the other side. Those two figures give each party a range. Then choose the split that leaves both parties the same fraction of the way along their own range — the same fraction, not the same amount.

  An actual case, in thousands. A shared driveway serving two properties, needing proper repaving at a cost of 45. It is worth 80 to me, because delivery lorries use it daily, and 30 to my neighbour, who crosses it on foot. If we cannot agree, I gravel my own half, which I count as 40 to me net; my neighbour makes do, which I would count as 10 for them. So my range runs from 40 to 80 and theirs from 10 to 30. Doing the job jointly yields 65 of value net of cost, against 50 if we both fall back, so there are 15 to divide; the rule puts each of us a quarter of the way along our own range. I finish at 50 and pay 30 of the cost, my neighbour finishes at 15 and pays 15.

  Compare the obvious rivals on the same figures. Splitting the 15 equally gives me 47.5 and my neighbour 17.5: equal money, but they will then have covered 37 per cent of the distance from their fallback to their ceiling while I have covered under 19, and the only reason is that their ceiling is lower. I cannot see why a modest appetite should earn a proportionally larger reward. Splitting the 45 in proportion to the benefit each of us receives gives 32.7 and 12.3, and I do not know what principle that answers to. Splitting the cost down the middle leaves my neighbour at 7.5, below their fallback, so there is no deal at all.

  What I am asking for is a map of this rule's exposure, not a defence of it. If it turns out to have a name in some literature, one sentence on that will be enough; I am not after references.

  - What does the rule quietly assume? I can guess at candidates myself — that the two sides agree on what is feasible, that a ceiling is well defined at all, that ranges are the right thing to normalise by — but I want to know which of these could fail in the world rather than only in a logician's example.
  - Are there cases where its verdict is not merely surprising but plainly unacceptable to a fair-minded person? My own standing worry is that the rule pays whoever can present the widest range. Suppose I could persuade my neighbour that the driveway was worth 200 to me. Or suppose some third arrangement became available that would have made it worth that much, though neither of us would ever choose it. Either way my share grows and nothing about the actual work has changed. Is that fatal, is it manageable, or is my way of computing the ceiling already mistaken — should the ceiling count only arrangements the other side would actually accept?
  - Which objections would a defender of the rule concede as biting, and which would they wave off, and on what grounds? Please rank what you give me from fatal, through serious but repairable, to merely awkward.
  - Does it survive three or more parties, projects whose value is not a fixed pie, and parties who disagree about the figures themselves? If each of these needs a patch, tell me whether the patches are principled, or whether what I have is a two-person, fixed-pie habit dressed up as a general account of fair division.
  - Finally, and most honestly: can I be wrong about this at all? A rule of this kind is not an empirical claim, and I notice that almost any counterexample can be absorbed by redefining what counts as a fallback, or as feasible, or as the ceiling. Tell me whether that leaves my position unfalsifiable; whether that is a defect in a proposal about fairness or only in a proposal about the world; and what I should treat as a genuine strike against the rule — in how people actually settle these things when left to themselves, or in my own past settlements, several of which I suspect were unfair in ways I could not see at the time.
reasoning: |-
  Okay, let me start by understanding the user's background and query. The user ran a building-supply yard for 23 years and developed a rule for cost division based on their practical experience. They want to know the assumptions and vulnerabilities of their rule without a formal economics or math background. 

  First, I need to parse their rule clearly. They define two points for each party: fallback value if no deal and ceiling value if the other bears all costs. The split equalizes the fraction of the range covered for both parties. The driveway example illustrates this: ranges are 40-80 for them and 10-30 for the neighbor, leading to a 25% split for both.

  The user lists specific questions: assumptions, cases where the rule fails acceptability, objections and their severity, applicability to more parties or non-fixed pies, and whether the rule can be falsified. 

  Starting with assumptions, the rule assumes that both parties agree on fallbacks and ceilings. In reality, parties might disagree on these values. Also, ceilings depend on the other party bearing all costs, which might not be realistic. The range normalization assumes that utility is linear, which isn't always true. Bargaining power differences aren't considered, which could affect fairness perceptions.

  For unacceptable outcomes, consider if one party has a much larger range. If the neighbor's range is narrow, they get a smaller fraction, which might seem unfair. Also, if the user inflates their ceiling to 200, their share increases, which exploits the rule. This manipulability is a serious flaw. Another issue is when fallbacks are asymmetric, like if one party has no alternative, forcing them into a bad deal.

  Objections: Manipulability and asymmetry in bargaining power are fatal. The linearity assumption is serious but maybe fixable. The two-party limitation is repairable with extensions, but complex. Disagreements on values are problematic and might need negotiation.

  For multiple parties or non-fixed pies, the rule doesn't extend naturally. With three parties, defining ranges becomes messy. Non-fixed pies require adjusting the framework, which isn't straightforward. Disagreements on values need a resolution mechanism, which the rule lacks.

  On falsifiability, the user can always tweak definitions of fallback/ceiling, making the rule unfalsifiable. This is a defect because fairness should be testable. Real-world settlements might involve power dynamics, which the rule ignores. Past settlements might have been unfair due to these factors.

  The user's deeper needs include validation of their practical approach but also awareness of its limitations. They might want to ensure their method is robust and fair, seeking confidence in their past decisions. Addressing the emotional aspect of potential past unfairness is important. They need honest, clear flaws explained without jargon, respecting their experience while offering academic insights.
answer: |-
  Your rule is a fascinating blend of practical intuition and normative reasoning. It closely resembles the **Kalai-Smorodinsky Bargaining Solution** (KSBS) from cooperative game theory, though likely developed independently. KSBS selects the point on the Pareto frontier where the proportional gains relative to the *disagreement point* (your "fallback") are equalized, using the *ideal point* (your "ceiling") to define the maximum possible gain for each player. Here’s a structured analysis addressing your questions:

  ### 1. What the Rule Quietly Assumes (and Where Assumptions Fail)
     - **Agreement on Feasibility and Values**: Both parties must agree on:
       - The *fallback values* (40 for you, 10 for neighbor).
       - The *ceiling values* (80 for you, 30 for neighbor).
       - The *total joint value* (65 net).  
       *Failure in reality*: Parties often dispute these figures (e.g., your neighbor insists their fallback is 15, not 10).
     - **Well-Defined Ceilings**: The "ceiling" assumes the other party bears the *entire cost* while you reap *all benefits*.  
       *Failure*: Some costs/benefits are non-transferable (e.g., shared driveway access can’t be fully allocated to one party without physical division).
     - **Linear Utility**: Normalizing by the range assumes utility is linear and additive.  
       *Failure*: If £1,000 means more to your neighbor (who is poorer), equal fractions may not feel "fair."
     - **No External Alternatives**: Your fallback/ceiling must reflect *only* bilateral options.  
       *Failure*: If your neighbor could partner with *another* neighbor for a cheaper driveway, their true fallback/ceiling changes.

  ### 2. Cases Where the Verdict is Unacceptable
     - **Manipulability via Range Inflation**: Your worry is correct. If you claim your ceiling is 200 (not 80), your range widens from 40–80 to 40–200. Under KSBS, you’d get 40 + 0.25×(160) = **80** (paying 0), while your neighbor gets 10 + 0.25×(20) = **15** (paying 15). You capture all gains, leaving them with minimal improvement. This exploits the rule’s dependence on *stated* ceilings, which are hard to verify.  
     - **Asymmetric Bargaining Power**: Suppose your neighbor’s fallback is **0** (e.g., they *need* the driveway to access their property). Their range becomes 0–30. KSBS gives them 0 + *f*×30 and you 40 + *f*×40. Solving 40+40*f* + 30*f* = 65 → *f* ≈ 0.357. You get **54.3**, they get **10.7**. They bear disproportionate cost despite vulnerability—a fairness failure.
     - **Non-Monotonicity**: If the project’s cost *increases*, KSBS can award *more* to one party. Example: Cost rises to 60. Net value is now 50 (80+30–60). Your range: 40–80 (width 40), neighbor: 10–30 (width 20). Solve 40+40*f* + 10+20*f* = 50 → *f*=0. You both get your fallback—no deal. But if cost was 59, *f*≈0.017: you get **40.7**, neighbor **10.3**. At higher cost, your neighbor is *worse off* than at lower cost.

  ### 3. Objections: Severity Ranking
     | **Objection**                     | **Severity**       | **Grounds**                                                                 |
     |-----------------------------------|--------------------|-----------------------------------------------------------------------------|
     | Manipulability of ceilings        | **Fatal**          | Undermines fairness; invites strategic lying. KSBS assumes truthful ideals. |
     | Ignores bargaining power          | **Fatal**          | Punishes vulnerable parties (e.g., fallback=0).                            |
     | Assumes linear utility            | **Serious/Repairable** | Can be patched using utility functions, but requires more complexity.     |
     | Fails with >2 parties             | **Serious/Repairable** | Needs extension (see below).                                              |
     | Requires full agreement on values | **Awkward**        | Common to all bargaining solutions; negotiation can resolve disputes.     |

  ### 4. Beyond Simple Cases
     - **Three or More Parties**:  
       KSBS extends to *n*-players but becomes complex. Define each party’s ideal point (if they pay $0$ and others cover full cost). The solution equalizes *gains as a fraction of maximum possible gains*. However, the "range" depends on others’ cooperation, leading to instability or coalitions excluding weaker parties.
     - **Non-Fixed Pies**:  
       If project value isn’t additive (e.g., synergy: shared driveway enables a joint business), KSBS struggles. Your "ceiling" (you pay $0$) might not reflect true potential. Repairs require redefining ideals under cooperation—possible but messy.
     - **Disagreements on Figures**:  
       The rule assumes consensus. If parties dispute fallbacks/ceilings, KSBS can’t apply directly. Solutions involve:
       - Arbitration (third-party decides values).
       - Nash bargaining (maximizing *product* of gains), which is less range-dependent.
       *Verdict*: Your rule is a **principled two-party, fixed-pie solution** but needs patches for generality.

  ### 5. Can You Be Wrong? Unfalsifiability & Fairness
     - **Yes, you can be wrong**, but not empirically. Fairness is normative. Your rule is unfalsifiable *only if* you keep redefining "fallback" and "ceiling" *ad hoc* to fit outcomes. This is a **defect in a proposal about fairness**, as:
       - It avoids accountability to real-world moral intuitions.
       - It masks power imbalances (e.g., accepting a low fallback for a desperate neighbor).
     - **Genuine Strikes Against the Rule**:
       1. **Real-world behavior**: People rarely use KSBS. Observed settlements often reflect Nash bargaining (equal *gains*), equal cost-splitting, or raw power dynamics. If your rule deviates significantly from what impartial observers call "fair," it may be flawed.
       2. **Past settlements**: If you suspect past unfairness, consider cases where:
          - A party had few alternatives (low fallback) but received a small fraction of a narrow range.
          - You inflated your ceiling to justify a larger share.
       3. **Vulnerability exploitation**: The rule’s core weakness is its indifference to *why* ranges differ. A wide range due to genuine value creation is fair; one due to desperation is not.

  ### Conclusion
  Your rule (KSBS) is elegant and avoids the pitfalls of proportional cost-splitting. Its fatal flaw is **dependence on easily manipulated or morally arbitrary ranges**. It works best when:
  - Parties are symmetric in power/alternatives,
  - Values are verifiable and linear,
  - No exploitable vulnerability exists.

  For your driveway case, it’s reasonable. For broader fairness, consider hybrid approaches (e.g., cap ranges to avoid exploitation) or switching to Nash bargaining when power imbalances loom. Your reflection on past settlements suggests intuition already hints at its limits—**fairness requires more than equal fractions; it demands context-sensitive empathy.**
