prompt: |-
  I do first-pass desk decisions at a foundations-leaning physics journal, and we get maybe two or three submissions a month that claim to beat Bell: a local hidden variable model that reproduces the singlet correlations, a proof the theorem is invalid, or an argument that the experiments never actually closed the loopholes. I know the formalism but I've never worked through the foundations literature properly, I've got about twenty minutes per paper, and I'd hate to bounce something that turns out to be serious.

  Can you write me a triage procedure I can run on these? Questions in order, what a passing answer looks like at each step, where it terminates in a desk reject, and where it terminates in "the abstract oversells it but there's a real paper here, send it to a specialist." Ground it in whatever is actually settled about what Bell assumes, and name the moves that show up in nearly every one of these — my guesses are treating no-signalling as though it were locality, and quietly assuming values for every setting pair at once, but tell me if I've got those wrong or if there are better ones.

  Then run it on three: a model whose outcome functions depend on the far-away setting too, defended as local because no signal could make it in time; a paper saying detector unfair sampling explains everything away, which I thought the loophole-free tests killed — how sure should I be of that?; and a retrocausal proposal. One of the three should come out somewhere I dont expect. And be straight with me about which steps are just my own judgement wearing a lab coat, plus what the procedure structurally can't catch.
