  ### Section Plan for the Two-Envelope Problem (50 Minutes)

  #### **Order of Presentation and Dependencies**  
  1. **Establish fixed amounts first (5 minutes)**  
     - Start by clarifying the setup: Both envelopes are **already filled and fixed** before you choose. One contains amount \(X\), the other \(2X\) (unknown to you).  
     - Emphasize: The amounts do not change after filling. You pick one envelope randomly (50% chance).  
     - *Why first?* Students must internalize that the contents are static to avoid misconceptions about the problem being dynamic (like Monty Hall). This anchors the paradox in probability, not game theory.

  2. **Present the naive switching argument (10 minutes)**  
     - Pose the problem: "You open your envelope and see $A$. Should you switch?"  
     - Derive the naive argument together:  
       - With 50% probability, the other envelope has \(A/2\); with 50% probability, it has \(2A\).  
       - Expected value of switching: \(\frac{1}{2} \cdot \frac{A}{2} + \frac{1}{2} \cdot 2A = \frac{5A}{4}\).  
       - Since \(\frac{5A}{4} > A\), switching seems beneficial.  
     - *Let it succeed initially:* This creates cognitive dissonance (switching is always better? even back and forth?). It hooks students and motivates deeper analysis.

  3. **Introduce the concrete example (15 minutes)**  
     - **Use the die-roll version** (smaller amount \(S\) chosen by rolling a die: \(S \in \{1, 2, 4, 8, 16, 32\}\)). Hand out real envelopes to groups (some with \(S\), some with \(2S\)).  
     - **Why this example?**  
       - **Must contain:** Boundary cases (e.g., seeing 1 or 64) to later reveal asymmetry.  
       - **Must not contain:** Pre-emptive explanations of prior probabilities or conditioning. Avoid showing the full probability table upfront.  
     - Ask: "You see $8$. Calculate the expected value of switching using the naive method." (Students get \(\frac{5}{4} \times 8 = 10 > 8\)).  
     - **Reveal the flaw:**  
       - Condition on \(A=8\). Possible scenarios:  
         - You hold the larger envelope (\(S = 4\), so switching gives \(4\)).  
         - You hold the smaller envelope (\(S = 8\), so switching gives \(16\)).  
       - Prior probabilities: \(P(S=4) = P(S=8) = \frac{1}{6}\), but likelihood of observing \(A=8\):  
         - \(P(\text{see } 8 \mid S=4) = P(\text{pick larger}) = \frac{1}{2}\)  
         - \(P(\text{see } 8 \mid S=8) = P(\text{pick smaller}) = \frac{1}{2}\)  
       - Posterior probabilities (Bayes):  
         \[
         P(S=4 \mid \text{see } 8) = \frac{\frac{1}{6} \cdot \frac{1}{2}}{\frac{1}{6} \cdot \frac{1}{2} + \frac{1}{6} \cdot \frac{1}{2}} = \frac{1}{2}
         \]  
         (Similarly, \(P(S=8 \mid \text{see } 8) = \frac{1}{2}\)).  
       - Expected value of switching: \(\frac{1}{2} \times 4 + \frac{1}{2} \times 16 = 10\). Naive argument *holds* here.  
     - **Now test a boundary case:** "You see $1$. What happens?"  
       - Only possible if \(S=1\) (you hold the smaller). Switching *always* gives \(2\) (expected value \(=2\)).  
       - Naive argument fails: It assumes \(A/2 = 0.5\) is possible, but \(S \geq 1\), so \(A/2\) cannot occur.  

  4. **Resolve the paradox (10 minutes)**  
     - **Overall expected value of switching is 0:**  
       - If you pick the smaller envelope (prob \(1/2\)), switching gains \(+S\).  
       - If you pick the larger envelope (prob \(1/2\)), switching loses \(-S\).  
       - Expected gain: \(\frac{1}{2}(+S) + \frac{1}{2}(-S) = 0\).  
     - **Why the naive argument misleads:**  
       - It assumes \(P(\text{other} = A/2) = P(\text{other} = 2A) = 1/2\) **for any \(A\)**, but this depends on the prior distribution of \(S\).  
       - In the die-roll:  
         - For \(A=8\) (non-boundary), probabilities are equal, and naive works.  
         - For \(A=1\) or \(A=64\) (boundaries), probabilities are unequal (0% or 100%), and naive fails.  

  5. **Address misconceptions in sequence**  
     | Misconception | When it surfaces | How to address | Confidence |  
     |---------------|------------------|----------------|------------|  
     | "This is Monty Hall again." | Early (setup phase). | **Prevent outright.** Contrast: Monty Hall uses new information (host reveals a door); here, no information is added after setup. | High confidence (common surface-level confusion). |  
     | "Expected value says switch, so I should." | After naive argument. | **Let form, then dismantle.** Use the die-roll to show boundaries break symmetry. Ask: "If switching is always better, why can’t you switch back forever?" | High confidence (core of the paradox). |  
     | "The paradox is just about unbounded priors." | After resolution. | **Dismantle if raised.** Emphasize the die-roll has bounded \(S\), yet naive reasoning fails at boundaries. Unbounded priors exacerbate it but aren’t the root. | Medium confidence (may not surface in intro class). |  
     | "At non-boundary amounts, switching still looks favorable, so overall it’s good." | Late (after example). | **Let form, then dismantle.** Compute overall expected gain (0) and show boundary losses cancel non-boundary gains. Use the die-roll: For \(A=64\), switching loses $32$; for \(A=32\), switching gains $8$ on average, but \(P(A=64)\) is low. | **Hardest to resolve** (requires aggregating conditional expectations). |  

  6. **Closing Question (5 minutes)**  
     - **"If you play this game 100 times and always switch, what is your expected net gain?"**  
       - **Correct answer:** 0 (from the unconditional expectation).  
       - **Why it separates understanding:** Students who focus on conditional gains (e.g., "I gain at \(A=8\)") may say it’s positive. Those who see the big picture recall \(\frac{1}{2}(+S) + \frac{1}{2}(-S) = 0\).  

  7. **What to Omit**  
     - **Leave out:** Continuous priors, improper distributions, or infinite expectations. Announce: "We’re focusing on fixed, bounded examples today; unbounded cases add complexity we won’t dive into."  
     - **Why:** Avoids tangential debates and aligns with the students’ background (coin flips → finite outcomes).  

  #### **Pedagogical Confidence and Uncertainties**  
  - **High confidence in:**  
    - Starting with fixed amounts and naive argument (creates engagement and tension).  
    - Using the die-roll example (boundaries make asymmetry tangible).  
    - Ranking misconceptions: Monty Hall comparisons surface fastest; boundary-denial is hardest.  
  - **Least sure about:**  
    - **How deeply students will grasp that \(P(\text{other} = A/2)\) depends on the prior.** In the die-roll, \(A=8\) works, but \(A=1\) doesn’t—this may require more repetition. Mitigation: Contrast calculations for \(A=1\) and \(A=8\) side-by-side.  

  #### **Why This Works**  
  The die-roll example forces students to confront the role of prior probabilities and boundaries, while the fixed amounts prevent Monty Hall distractions. By letting the naive argument "win" first, you validate intuition before dissecting it, making the resolution more impactful. The closing question tests synthesis: conditional gains exist, but unconditional expectation dominates.
