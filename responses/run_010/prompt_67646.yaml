  ### Simplified Lesson
  In the 50 minutes, we cannot go into this level of detail. The main points are:

  1. The naive argument assumes that given the observed amount A, the other envelope is equally likely to be A/2 or 2A. This assumption may not hold for every A in the prior distribution.
  2. In our example, for most A it holds, but for boundary amounts it does not.
  3. The overall expected gain from switching is 0, so there is no advantage to switching in the long run if you switch every time without looking at the amount.

  ### What to Leave Out
  We should leave out the strategy of switching unless you see the maximum amount, because it shows a positive expected gain and complicates the message. We can say that we are not covering strategies that condition on the amount because that is more advanced. The main point is to see the flaw in the naive argument.

  ### Ranking of Misconceptions by How Quickly They Surface

  1. **This is Monty Hall again.** 
     - Likely to surface immediately because Monty Hall is famous. We should prevent this outright at the beginning by contrasting the two problems.

  2. **Expected value has simply told them to switch and there is nothing further to discuss.**
     - This will come up after presenting the naive argument. We should let it surface and then challenge it by showing the infinite regress and by the overall expected gain being zero.

  3. **The student who concedes the boundary cases and then insists that at every remaining amount switching still looks favourable, so it looks favourable overall.**
     - This might come up after the example. We should show that the overall expected gain is zero by averaging over all possibilities.

  4. **The whole difficulty is an artefact of unbounded or improper priors.**
     - This is more advanced and might not come up, but if it does, we can say that even in bounded priors the conditional expected gain can be positive, but the overall expected gain is zero.

  ### Confidence in Pedagogical Claims
  - I am confident that we must establish that the envelopes are already filled and fixed.
  - I am confident that we should present the naive argument first to engage the students.
  - I am confident that the die-roll example with real boundaries is effective.
  - I am confident that we should prevent the Monty Hall comparison outright.
  - I am less confident in how deeply to go into the example. We might not have time to compute the overall expected gain explicitly. We might just state that the overall expected gain is zero and do the unconditional proof: 
        Let L be the smaller amount. 
        If you initially pick the smaller (prob 1/2), switching gains L.
        If you initially pick the larger (prob 1/2), switching loses L.
        Expected gain = (1/2)L + (1/2)(-L) = 0.

  - I am least sure about whether to let the students discover the boundary effects in the example or to guide them. Given time constraints, it's better to guide them through one non-boundary amount and one boundary amount.

  ### Closing Question
  Ask: 
     "If I play the game many times and always switch, what would be my average gain per game?"

  Answer: 0.

  This separates students who understand the unconditional expected value from those who still think switching is always beneficial.

  ### Final Plan

  1. **Setup (5 minutes):** 
     - Explain the problem: two envelopes, one with X and one with 2X. You pick one at random and see amount A. The amounts are fixed beforehand.
     - Ask: Should you switch?

  2. **Naive Argument (7 minutes):**
     - Present the argument: expected value of switching is 5A/4, which is > A, so switch.
     - Let the students discuss: if you switch, shouldn't you switch back? 

  3. **Concrete Example (15 minutes):**
     - Describe the die-roll: smaller amount S is chosen uniformly from {1,2,4,8,16,32}. Envelopes contain S and 2S.
     - Simulate: pick a student to see an amount (say 8) and ask if they would switch.
     - Compute for A=8: 
          - Naive: 5*8/4=10>8 -> switch.
          - Conditional: what are the possibilities? 
               - S=4: we have the larger? 
               - S=8: we have the smaller?
          - Prior: P(S=4)=1/6, P(S=8)=1/6. 
          - P(see 8 | S=4) = P(pick the larger | S=4) = 1/2.
          - P(see 8 | S=8) = P(pick the smaller | S=8) = 1/2.
          - P(see 8) = P(S=4)*1/2 + P(S=8)*1/2 = (1/6)*(1/2)+(1/6)*(1/2)=1/6.
          - P(S=4 | see 8) = (1/6 * 1/2) / (1/6) = 1/2.
          - Similarly for S=8: 1/2.
          - Expected value of switching = (1/2)*(4) + (1/2)*(16) = 10.
     - Now for A=1:
          - Only possible if S=1 and we picked the smaller.
          - So switching gives 2 for sure.
          - Expected value of switching = 2.
     - For A=64:
          - Only possible if S=32 and we picked the larger.
          - Switching gives 32.
          - Expected value of switching = 32.

  4. **Resolution (10 minutes):**
     - The naive argument works for non-boundary amounts but not for boundaries.
     - However, the overall expected gain from switching is 0.
     - Proof: 
          - Let S be the smaller amount. 
          - If you initially picked the smaller (prob 1/2), switching gains S.
          - If you initially picked the larger (prob 1/2), switching loses S.
          - Expected gain = (1/2)*S + (1/2)*(-S) = 0.
     - Therefore, in the long run, switching doesn't help.

  5. **Addressing Misconceptions (8 minutes):**
     - This is not Monty Hall: no new information is revealed.
     - The naive argument is flawed because it assumes without justification that given A, the other envelope is equally likely to be A/2 or 2A. This is true for non-boundary amounts in this example, but not in general and not at boundaries. And overall, switching doesn't help.
     - For the student who says: "then for every non-boundary amount I should switch", we agree that conditionally it looks good, but unconditionally it averages to zero.

  6. **Closing Question (5 minutes):**
     - "If you play this game many times and always switch, what would be your average gain per game?" 
     - Answer: 0.

  7. **What to leave out:**
     - We are leaving out the continuous case and improper priors.
     - We are leaving out strategies that condition on the amount (like not switching when you see the maximum) because they are more advanced.

  This fits in 50 minutes.
