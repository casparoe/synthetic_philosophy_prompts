     - **Distorted Translations**:
          - Ethnographic analogy: In statistics, we would model this as a hierarchical prior or transfer learning. However, in archaeology, the analogy is often applied in a more qualitative and case-by-case manner. The distortion is that in statistics we require an explicit model of the similarity (e.g., a hierarchical model with a hyperprior) and we can quantify the uncertainty, whereas in archaeology the analogy might be used without such a formal structure. Also, the exchangeability assumption is often more contested and less explicit in archaeology.

