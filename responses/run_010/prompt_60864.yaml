answer: |-
  ### Brainstorm: Candidate Mappings & Uncertainties
  **Core Inference**:  
  - Observed artifacts → **Observed data** with measurement error.  
  - Beliefs/institutions (e.g., "centralized accounting") → **Latent variables** in a hierarchical model.  
  - Inference process → **Bayesian updating** of priors via likelihoods derived from linking functions (archaeology's "interpretive rules").  

  **Key Concepts**:  
  1. **Equifinality**:  
     - *Candidate mapping*: **Non-identifiability** (multiple latent states yield identical observed data).  
     - *Uncertainty*: Equifinality includes *causal* non-identifiability (e.g., ritual vs. tax tokens), which may not map neatly to parameter non-identifiability in likelihoods.  

  2. **Middle-Range Theory (MRT) / Actualistic Studies**:  
     - *Candidate mapping*: **Calibration experiments** to specify the measurement model (likelihood function). E.g., burning modern storerooms to estimate survival probabilities.  
     - *Uncertainty*: MRT often assumes generalizable physical laws, but taphonomy (decay processes) adds noise—**measurement error with spatial heterogeneity**.  

  3. **Ethnographic/Historical Analogy**:  
     - *Candidate mapping*: **Borrowing priors across populations** via hierarchical models (e.g., hyperpriors from "source" societies).  
     - *Contested*: Analogy risks violating **exchangeability**—source/target groups may not share hyperparameters. Statisticians test this; archaeologists often debate it qualitatively.  

  4. **Safety of Inferences**:  
     - *Candidate mapping*: **Posterior uncertainty** driven by signal-to-noise ratios.  
     - "Safe" claims (tech/diet): High-frequency data, low equifinality → **identifiable latents**.  
     - "Sketchy" claims (ritual/authority): Sparse data, high equifinality → **weakly identified latents** with prior-driven posteriors.  

  **Your Concrete Hook (MNAR in Tax Records vs. Archaeology)**:  
  - Both: **MNAR missingness** where survival probability \(P(\text{record survives}) \propto \text{latent state}\).  
  - *Structural difference*:  
    - *Tax records*: Missingness mediated by **motivated human action** (state capacity).  
    - *Archaeology*: Missingness from **physical processes** (decay) + **past human action** (discard practices) + **modern sampling** (excavation bias).  
  - *Epistemic impact*: Motivated actors *intentionally* distort data (e.g., states hide weaknesses), while physical decay is "passive." This may require different **selection models** for MNAR.  

  **Live Disagreements in Archaeology**:  
  - **Processualists**: Believe inference is coherent with rigorous MRT → **identifiability achievable**.  
  - **Post-processualists**: Argue data underdetermines social latents → **incoherent without strong prior bias**.  
  - *No consensus*: The field splits on whether "ideology" is inferable or a Rorschach test for the researcher.  

  ---

  ### Systematic Translation  
  **Core Inference Restated**:  
  You observe \(Y\) (artifacts, buildings) and want latent \(Z\) (beliefs, institutions). The model is:  
  \[
  Y \sim p(Y | Z, \theta_{\text{measure}}), \quad Z \sim p(Z | \theta_{\text{prior}})
  \]  
  where \(\theta_{\text{measure}}\) encodes how \(Z\) materializes as \(Y\) (e.g., "accounting authority → clay tokens"), and \(\theta_{\text{prior}}\) encodes societal hyperparameters. Inference requires estimating \(p(Z | Y)\).  

  **Concept Mappings**:  
  1. **Equifinality → Non-identifiability**:  
     - "40 tokens + non-domestic building" could map to multiple \(Z\) (e.g., religious ritual, tax system, or both).  
     - *Direct counterpart*: Flat/non-unique maxima in the likelihood \(p(Y | Z)\).  
     - *Handling*: Constrain with priors or add data, but no free lunch—**strong prior assumptions unavoidable**.  

  2. **Middle-Range Theory → Calibrated Likelihoods**:  
     - MRT provides **forward models** for \(p(Y | Z)\). E.g., actualistic studies estimate:  
       - \(p(\text{burned building} | \text{storeroom fire})\) (taphonomy),  
       - \(p(\text{token survival} | \text{deposition context})\) (preservation bias).  
     - *Limitation*: Calibration is **context-specific** (e.g., clay preserves better in arid soils), requiring spatial random effects.  

  3. **Ethnographic Analogy → Borrowing Priors**:  
     - Analogy sets \(\theta_{\text{prior}}\) using data from source societies (e.g., "Maya storage practices").  
     - *Formally*: \(Z_{\text{target}} \sim \text{Hyperprior}(Z_{\text{source}})\).  
     - *Contested*: Violates **exchangeability** if source/target differ. Archaeologists debate validity; statisticians quantify uncertainty with **hierarchical variance terms**.  

  4. **Safety of Inferences → Identification Strength**:  
     - "Safe" claims (tech/diet):  
       - High \(I(Y; Z)\) (mutual information). E.g., tool function inferred from wear patterns → **low equifinality**.  
       - Data often **missing at random (MAR)**—preservation less tied to \(Z\).  
     - "Sketchy" claims (ritual/authority):  
       - Low \(I(Y; Z)\). E.g., "non-domestic building" could be palace, temple, or meeting hall.  
       - Data often **MNAR**—ritual items deliberately hidden/destroyed.  
     - *Result*: Sketchy claims have **prior-dominated posteriors**—small data changes cause large inference swings.  

  **Your MNAR Hook**:  
  - **Same core problem**: Survival probability \(S \propto Z\) (state capacity or institutional complexity).  
  - **Structural differences**:  
    - *Motivated actors (tax records)*: Missingness mechanism is **strategic** (e.g., weak states avoid records). Must model \(p(S | Z)\) as a **game-theoretic process** (rare in stats).  
    - *Physical decay (archaeology)*: Missingness from **environmental factors** (e.g., soil pH). Can be modeled via **taphonomic likelihoods** (e.g., \(p(\text{artifact survives} | \text{soil type})\)).  
  - **Shared challenge**: Both require **selection models** for MNAR:  
    \[
    p(Y, S | Z) = p(Y | Z) \cdot p(S | Y, Z)
    \]  
    but \(p(S | Y, Z)\) is unknowable without external data.  
  - **Name/handling**:  
    - *Statistics*: Called **"informative missingness"** or **"selection bias."** Handled via sensitivity analysis (e.g., pattern-mixture models) or partial identifiability bounds.  
    - *Archaeology*: Called **"preservation bias"** or **"source criticism."** Handled via taphonomic simulations (MRT) or admitting **unresolvable uncertainty**.  
  - **Verdict**: Expensive but survivable with **explicit uncertainty quantification**. Neither side waves it away—it's central to method papers.  

  ---

  ### Residue Report  
  **Clean Translations (No Distortion)**:  
  1. **Equifinality → Non-identifiability**: Direct map. Both fields agree: multiple causes can produce identical data.  
  2. **MRT → Calibrated Likelihoods**: MRT is literally experiments to estimate \(p(Y | Z)\). No distortion.  
  3. **Safety Gradient → Identification Strength**: "Tech/diet safer than ritual" maps perfectly to signal-to-noise ratios.  

  **Distorted Translations (Bent to Fit)**:  
  1. **Ethnographic Analogy → Borrowing Priors**:  
     - *Distortion*: In stats, exchangeability is **tested** (e.g., posterior predictive checks). In archaeology, analogy is often **circular**—source societies chosen *because* they resemble target inferences.  
     - *Bent element*: The statistical version exposes **selection bias in prior choice**; archaeological practice often obscures it.  
  2. **"Institutions" as Latents**:  
     - *Distortion*: Archaeologists treat "ritual" as a monolithic latent. Statistically, it's a **vector of latents** (e.g., \(Z = \{Z_{\text{group size}}, Z_{\text{symbolic meaning}}\}\)) with vague relationships.  
     - *Bent element*: Archaeology compresses multidimensional \(Z\) into narrative labels, losing granular uncertainty.  

  **No Expression in Statistical Framework**:  
  1. **Material Engagement (Objects as Active Agents)**:  
     - *Claim*: Objects shape beliefs (e.g., tokens enforce accounting norms).  
     - *No statistical counterpart*: Hierarchical models assume \(Z \rightarrow Y\) (beliefs → objects). No feedback loop \(Y \rightarrow Z\).  
     - *Verdict*: **Genuine gap**. Stats lacks dynamic causal models for "object-agency." Needed: **reciprocal likelihoods** (e.g., \(Y_t \rightarrow Z_{t+1}\)) with temporal feedback.  
  2. **Context as Holistic Evidence**:  
     - *Claim*: "Context" (stratigraphy, artifact associations) provides irreducible, non-separable evidence.  
     - *No statistical counterpart*: Stats models context via **interaction terms** or **spatial priors**, but archaeologists treat it as a gestalt ("whole > sum of parts").  
     - *Verdict*: **Vagueness in archaeological claim**. If "context" means high-dimensional interactions, it *can* be modeled (e.g., graph networks), but archaeologists rarely formalize it.  
  3. **Time as Non-Linear Process**:  
     - *Claim*: Social change is punctuated (collapse, revolutions), not gradual.  
     - *No statistical counterpart*: Standard time-series (e.g., ARIMA) assume smoothness.  
     - *Verdict*: **Partial gap**. Stats has **change-point models**, but archaeology's "deep time" scales (centuries) lack data for identification.  

  **Contested Core Issue**:  
  The **coherence of inference** is disputed:  
  - **Processualists** (e.g., Binford): With robust MRT, \(Z\) is identifiable. *Statistical view*: Acknowledges non-identifiability but claims informative priors resolve it.  
  - **Post-processualists** (e.g., Shanks/Tilley): Inference is always biased by the researcher's context. *Statistical view*: Agrees priors dominate sketchy inferences—**objectivity is impossible** without drastic data gains.  
  - *Your takeaway*: Archaeology's "beliefs from stuff" is as coherent as your tax-record problem—**possible with severe uncertainty**, but some claim it's a category error.  

  ### Final Verdict on Your Hunch  
  **Right**: Both fields face **MNAR where survival \(\propto\) latent state**.  
  **Wrong**: The **motivated human filter** in your problem adds unique complexity:  
  - Strategic actors (states) may **manipulate data survival** to mislead, creating adversarial bias.  
  - Physical filters (decay) are **stochastic but non-adversarial**—easier to model via physics-based likelihoods.  
  **Conclusion**: Your MNAR is epistemically harder. Archaeology compensates with **broader data integration** (e.g., pollen for climate, isotopes for diet), but you have better-structured auxiliary data (e.g., tax laws). Neither side "solves" it—both quantify and caveat.
