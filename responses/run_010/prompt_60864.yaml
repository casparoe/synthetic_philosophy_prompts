          - **Time depth and change**: Archaeology is inherently diachronic (over time). While we can build dynamic hierarchical models (state-space models), the archaeological discussion often involves long-term processes (centuries) and non-linear change (collapse, transformation) that are not easily captured in standard models. This is a gap: our statistical tools for long-term dynamics are less developed.

          - **The role of context**: Archaeologists place great emphasis on the context of an artifact (its spatial and stratigraphic position). In statistics, we can include spatial effects (e.g., spatial random fields) and time effects, but the way context is used in archaeology (as a holistic, integrative concept) might not be fully captured by adding a spatial random effect. This might be a gap: we don't have a good way to model the complex, multi-scalar interactions of context.

          - **Verdict on gaps**:
              - Materiality and feedback: This is a genuine gap in the statistical vocabulary. We typically model one-way causation (latent -> observed). To model the feedback, we would need a dynamic causal model that includes how the observed objects (once created) then influence the latent variables. This is an area of active research (e.g., in causal inference with feedback loops) but not standard in hierarchical models.
              - Time depth: This is a gap, but one that is being addressed by methods like state-space models and time-series analysis. However, the scale and complexity of archaeological time might require new methods.
              - Context: This might be partially addressed by spatial statistics, but the holistic aspect might be a gap. Alternatively, one could argue that this is a matter of model specification (including interactions and multiple levels) and that it is not a fundamental gap.

          - **Vagueness in archaeological claims**: Some claims about, for example, the interpretation of ritual might be more vague than they sound. The statistical framework forces us to specify the likelihood and the prior, which might reveal that the archaeological interpretation is underdetermined. The residue in such cases is due to vagueness.

  III. **The Concrete Hook**:
     - **Structural Similarity**: Both the tax record problem and the archaeological problem involve MNAR. The missingness mechanism is correlated with the latent variable of interest. In the tax record case, the missingness is due to the state strength (which is the latent variable). In archaeology, the missingness (preservation and recovery) might be correlated with the latent variable (e.g., state strength might lead to monumental architecture that is more likely to be preserved and excavated) but also with other factors (soil conditions, climate). 

