     - Statistical counterpart: Non-identifiability. The likelihood function might have multiple maxima or flat regions, meaning that different sets of parameters can produce the same data. Also related to the problem of non-identifiable parameters in a model.

  3. **Middle-Range Theory / Actualistic Bridging Studies**: These are studies that link static material remains to dynamic processes (e.g., experimental archaeology: what happens when you burn a building? how do artifacts get buried?).
     - Statistical counterpart: Calibration studies or experimental validation. These provide the link between the observed measurements and the latent processes. They help build the likelihood function. Also, they can be seen as providing prior information or informing the model structure.

  4. **Ethnographic and Historical Analogy**: Using knowledge from known societies to interpret unknown ones.
     - Statistical counterpart: Borrowing strength from related groups (hierarchical modeling) or transfer learning. However, this is also a source of prior information. The key issue is the exchangeability between the source (analog) and target (archaeological) populations.

  5. **Safety of Inferences**: Technology and diet are safer; ritual, ideology, kinship, and political authority are sketchier.
     - Statistical counterpart: Some latent variables are better measured by the data (higher signal-to-noise) and have less model uncertainty. For example, technology might leave more direct and unambiguous traces (e.g., tools for specific tasks) while ritual might leave traces that are more ambiguous and confounded by other factors (equifinality). This is about the sensitivity of the data to the latent variable and the identifiability of the model.

