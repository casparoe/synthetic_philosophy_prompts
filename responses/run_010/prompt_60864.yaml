          - Statistical counterpart: These studies provide the link for the likelihood function. For example, experimental burning of a storeroom might tell us what the remains look like, which informs the conditional distribution of the data given the latent process (e.g., fire in a storeroom). They are essentially calibration experiments that help specify the measurement model (how the latent variable is measured by the observed data). They can also inform the prior (e.g., the probability of a building being non-domestic given centralized accounting).

     D. **Ethnographic and Historical Analogy**:
          - Statistical counterpart: This is about using data from one group (source) to inform inferences about another (target). In hierarchical modeling, we might use a prior that is estimated from the source group and then apply it to the target. However, the key assumption is exchangeability: that the groups are similar enough that the parameters are drawn from a common distribution. If exchangeability is violated, then the analogy fails. This is a form of transfer learning, but with the caveat that the transfer must be justified.

     E. **Safety of Inferences**:
          - Statistical counterpart: The identifiability and the strength of the signal. For technology and diet, we might have direct proxies (e.g., tools for farming, animal bones) that are less confounded and have lower measurement error. For ritual and ideology, the proxies are often more ambiguous (e.g., a building without domestic artifacts might be a temple or a meeting hall) and subject to equifinality (non-identifiability). Thus, the posterior uncertainty for the latter is higher. This is reflected in the posterior distribution: the variance for ritual is larger.

  II. **Residue Report**:
     - **Clean Translations**:
          - Equifinality -> Non-identifiability: This is a direct and clean mapping.
