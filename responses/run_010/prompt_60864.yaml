     - The archaeological filter: The data we observe (artifacts) are a result of:
          a) Decay and preservation (physical processes) -> non-human filter.
          b) Human choices about what to leave behind (e.g., deliberate burial, discard patterns) -> human filter.
          c) Excavation and recovery (archaeologist's choices) -> another human filter.

     - The MNAR problem: In both cases, the probability of an artifact (or record) being observed depends on unobserved factors that may be correlated with the latent variables of interest. In the tax record case, the missingness is due to state capacity (which is the latent variable of interest). In archaeology, the missingness might be due to:
          - Preservation conditions (which might be independent of the latent variable, or might be correlated? e.g., a ritual site might be built with more durable materials?).
          - Human choices in the past: e.g., only certain items were buried in a way that survives, and that might be correlated with the latent variable (e.g., ritual objects are more likely to be buried in a way that preserves them).
          - Modern excavation: which sites are chosen to be excavated might be biased towards certain types of sites (e.g., monumental architecture) which are correlated with the latent variables.

     - Structural difference: The user's tax record problem has missingness that is directly caused by the latent variable of interest (state capacity). In archaeology, the missingness is more complex and might be caused by a mix of physical processes and past human behavior. The epistemic issue is whether we can model the missingness mechanism. In both cases, we need to model the missing data process. However, in the tax record case, we might have some understanding of the mechanism (e.g., state capacity leads to record keeping and preservation) and we might have auxiliary data to model it. In archaeology, the preservation process might be more difficult to model because it is a long chain of physical and human processes.

     - Standard handling: In statistics, MNAR is known to be challenging and often requires strong assumptions (e.g., selection models). It is expensive but survivable if we can model the missingness mechanism and have some data to inform that model. In archaeology, they deal with this by taphonomy (the study of decay and preservation) and by using methods like formation theory (how sites form and get disturbed) to model the missingness. However, it is often a major source of uncertainty.

