     - **Name and Handling**:
          - In statistics: This is a classic MNAR problem. Without external data or strong assumptions, the model is non-identifiable. Solutions include:
               - Selection models (model the missingness mechanism jointly with the data model).
               - Sensitivity analysis: see how the results change under different missingness assumptions.
               - Collecting auxiliary data to inform the missingness model.
          - In archaeology: This is often called the problem of preservation bias or recovery bias. They handle it by:
