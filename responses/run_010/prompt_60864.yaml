     - **Is it fatal?**: Not fatal, but it introduces substantial uncertainty. In both cases, the inference is only as strong as the assumptions about missingness. If those assumptions are weak, then the conclusions are weak.

  IV. **Contested Issues**:
     - There is a major ongoing debate in archaeology about whether we can reliably infer beliefs and institutions from material remains. Some (e.g., post-processualists) argue that material culture is polysemous (equifinality is rampant) and that we cannot escape our own biases. Others (e.g., processualists) believe that with rigorous methods (middle-range theory) and explicit analogy, we can make progress. This disagreement is fundamental and affects the coherence of the project. In statistical terms, the debate is about whether the model is identifiable and whether we can specify a likelihood that is not too sensitive to prior assumptions.

