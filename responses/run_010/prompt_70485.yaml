prompt: |-
  Our meditation group's monthly ethics evening has handed me next month's session: ninety minutes, a whiteboard, about twenty regular practitioners, several of them EA-adjacent, none of them academics. I want to teach the live question of whether Buddhist ethics is consequentialist. They will arrive certain the answer is an obvious yes — karma keeps score, compassion wants less suffering, done. What I need from you is the architecture of the session, not a summary of the debate.

  Lay out what has to be in place before the question is a question for them at all, and in what order. My own guess is that the first job is prying the technical sense of consequentialism loose from the colloquial "cares about outcomes," and the second is getting them to see that karma's automatic bookkeeping may be doing the opposite work from a utility calculation — a rule whose payoff is guaranteed by the structure of the universe isn't a rule you follow because you did the arithmetic. Tell me whether that ordering is right, what depends on it, and what I'd be building on sand.

  Then: the single case that should carry the evening, and what it must and must not contain. If your instinct is the Mahāyāna story of the compassionate ship captain who kills the bandit aboard his vessel, say whether that case is load-bearing here or whether it smuggles in an upāya framework I shouldn't hand them yet. Map the misconceptions they'll bring and the ones they'll form mid-session — the anattā-is-really-just-Parfit move, "skillful means, so the precepts are heuristics," "the first noble truth is negative utilitarianism," trolley problems — and say at which precise point each gets headed off rather than merely contradicted.

  I came to Buddhism by the Parfit route myself, so the plan should be honest about where that route is a projection onto the tradition rather than a reading of it. Close with the one question I can put to the room that separates someone who followed the argument from someone who merely agreed with me, and name what I should openly decline to cover at this level — I don't want a reading list or scholar names in the session, and I'd rather say so than imply I'm reporting settled results.
reasoning: |-
  Okay, the user is organizing a 90-minute session on whether Buddhist ethics is consequentialist for their meditation group. The participants are regular practitioners, some EA-adjacent, but no academics. They'll come in thinking it's obviously yes because of karma and reducing suffering. The user wants the session architecture, not a debate summary. They mention two initial steps: separating technical consequentialism from colloquial "cares about outcomes" and showing that karma's automatic system might work differently than utility calculation.

  First, I need to unpack what technical consequentialism entails versus how people commonly understand it. Consequentialism isn't just about caring for outcomes; it's about evaluating actions based on their consequences through a calculation. But karma operates as a cosmic law where actions have inherent moral weight, not based on situational outcomes. That's a key distinction. The user’s proposed order makes sense here—start by clarifying the terminology.

  Next, the karma point. The user suggests that karma's guaranteed results mean you're not doing utility calculations. Actions have fixed moral qualities (kusala/akusala), so following precepts is about aligning with the nature of reality, not calculating outcomes. This seems like a solid second step because it challenges the initial assumption that karma equals consequentialism. If people think karma is about scoring points, showing it's more like a law of nature would shift their perspective.

  Then, considering what misconceptions might arise. The anattā-Parfit link could come up. Parfit reduces persons to psychological connectedness, but anattā is about non-self as a strategy for liberation, not an ethical claim. That needs to be addressed early, maybe when discussing technical terms. Also, the "precepts as heuristics" idea—people might think precepts are rules of thumb for good outcomes. But in Buddhism, they're often seen as intrinsic to the path, not just tools. This should be tackled after clarifying karma.

  For the case study, the compassionate ship captain killing a bandit. This story from the Upāyakauśalya Sūtra is tricky. It's used to show that breaking precepts can be compassionate, but it relies on upāya (skillful means), which is advanced. If introduced too early, it might confuse participants into thinking Buddhism is situationally consequentialist. Instead, a simpler case like not lying to avoid harm could be better. It avoids upāya complexities and still shows that intention matters, but precepts hold weight. The captain story might be saved for later or mentioned as an exception that proves the rule.

  Mapping misconceptions: trolley problems could be brought up. Participants might analogize, but Buddhist ethics avoids hypotheticals and focuses on actual moral development. This should be addressed when discussing technical consequentialism. Negative utilitarianism might be confused with the First Noble Truth. Suffering exists, but the path isn't just minimizing suffering; it's about cessation through wisdom and ethics. Highlighting the Eightfold Path as a framework here is important.

  The user's background via Parfit is a potential bias. They need to acknowledge that while Parfit saw parallels, Buddhist ethics might be more about cultivating virtues than maximizing outcomes. Emphasize the teleological nature of Buddhist ethics—aimed at liberation, not just consequences.

  The closing question should test understanding. Asking how to explain why a virtuous action done with bad intentions is still unwholesome would force them to engage with karma's automatic nature versus consequentialist calculation. If they grasp that the moral quality is inherent, they've understood.

  Time management is crucial. Spending 30 mins on groundwork, 30 on karma vs. consequentialism, 20 on the case study, and 10 for Q&A with the closing question. Avoid deep dives into upāya or scholar debates. Make it clear that this is an ongoing discussion, not settled.

  Overall, the structure should first deconstruct their assumptions, rebuild the framework, then challenge with a case. Ensuring each step addresses potential misunderstandings as they arise, keeping the session accessible yet insightful.
answer: |-
  Here’s the session architecture designed to destabilize assumptions and build conceptual clarity, with timing estimates and strategic deflection points:

  **Groundwork (First 40 mins)**  
  *Goal: Make "consequentialism" a live question by dismantling colloquial conflations.*

  1.  **Reframe "Cares About Outcomes" (15 mins)**  
      *Whiteboard:* Draw 2 columns: **Colloquial Ethics** vs. **Technical Ethics**.  
      - *Colloquial:* "Good outcomes matter" → Buddhism *obviously* checks this (compassion, karma).  
      - *Technical:* Define rigorously:  
        - **Consequentialism:** Moral worth of an act *solely* determined by *foreseeable consequences* evaluated against a *single metric* (e.g., utility, wellbeing).  
        - **Deontology:** Moral worth determined by *intrinsic nature/rules* (e.g., precepts, duties).  
        - **Virtue Ethics:** Moral worth determined by *character/cultivation*.  
      *Crucial Move:* Ask: "Does Buddhism *evaluate* actions *primarily* by calculating future outcomes against a single metric?" Plant doubt.

  2.  **Karma ≠ Utility Calculation (25 mins)**  
      *Whiteboard:* Contrast "Cosmic Law" vs. "Moral Calculus".  
      - **Karma as Cosmic Law:**  
        - Automatic, impersonal (like gravity).  
        - Kusala/akusala are *intrinsic qualities* of volitional acts (cetana).  
        - Outcomes *are* the unfolding of the act's nature, not external "rewards."  
      - **Consequentialist Calculus:**  
        - Deliberate prediction/weighing of future states.  
        - The *same act* could be good/bad based on predicted outcome.  
      *Prying Tool:* "If karma guarantees that stealing *always* has negative karmic fruit, regardless of context/intent, is that closer to a rule (deontology) or a consequence we calculate?" Highlight: **Automaticity precludes calculation.**  
      *Deflect Here:* "First Noble Truth = Negative Util?" → "Suffering exists, but the *path* is about wisdom/virtue, not minimising utils." (Link to 8-fold Path).

  **Core Tension (30 mins)**  
  *Goal: Expose the friction between karma/precepts and situational outcome-focus.*

  3.  **The Load-Bearing Case: The Lie for Life (20 mins)**  
      *The Case:* "A murderer asks you where their intended victim is. You could lie to save a life. Is this kusala (skillful) or akusala (unskillful)?"  
      *Why it works:*  
      - Avoids **upāya** complexities (ship captain requires advanced framework).  
      - Tests tension between precept (truthfulness) and outcome (saving life).  
      - Reveals *intention* (compassion) vs. *act* (lying) conflict.  
      *Facilitation:*  
      - Poll the room pre-discussion.  
      - Steer debate: "If lying is *always* akusala by nature, does the good outcome change its karmic quality?"  
      - Must **not** resolve it! Leave tension hanging: "Buddhism *feels* consequentialist here... but the precept/karma framework resists it."  

  4.  **Anattā vs. Parfit (10 mins)**  
      *Head off mid-session misconception:* "Anattā = No-self, so ethics is impersonal like util?"  
      - *Buddhist View:* Anattā undermines *craving/clinging*; ethics arises from wisdom/compassion, not personhood dissolution.  
      - *Parfit Contrast:* Reductionism facilitates impartial maximization. Buddhism’s "impersonality" serves *liberation*, not optimal outcomes.  
      *Whiteboard:* "Anattā for Liberation" ≠ "No-self for Utility Maximization".

  **Synthesis & Trap (15 mins)**  
  *Goal: Cement uncertainty and distinguish understanding from agreement.*

  5.  **The Teleological Escape Hatch? (5 mins)**  
      *Briefly introduce:* Buddhism is *teleological* (aims at nibbāna), but *not necessarily consequentialist*. The path *itself* (sīla, samādhi, paññā) is constitutive of the goal. Virtue isn't just a tool.  
      *Deflect:* "Precepts as heuristics?" → "They *function* heuristically, but are taught as *trainings* reflecting reality's fabric."

  6.  **The Closing Trap Question (5 mins)**  
      *"If a person performs a conventionally 'virtuous' act (e.g., giving alms) but with greedy intention (e.g., for social status), is the karmic result wholesome (kusala)? Why/why not?"*  
      *Why it separates:*  
      - Reveals understanding of karma's focus on *cetana* (intention) over outward outcome.  
      - A consequentialist might excuse it (net good outcome), but Buddhism sees akusala root.  
      - Tests grasp of intrinsic quality vs. consequence-evaluation.

  7.  **What We *Didn't* Cover (5 mins)**  
      *Explicitly decline:*  
      - **Scholarly debates** (Keown, Goodman, Siderits, etc.).  
      - **Upāya** (skillful means) complexities (ship captain story requires this).  
      - **Mahāyāna/Vajrayāna nuances** beyond core karma/precepts.  
      - **Trolley problems** ("Buddhism focuses on actual moral development, not hypotheticals").  
      - **"Settled" answers** ("This is a live debate; I’m showing you *why* it’s debated").  

  **Why Your Order is Right & What Sand to Avoid**  
  - **"Cares about outcomes" first:** Essential to prevent equivocation. Sand = conflating compassion with ethical theory.  
  - **Karma second:** Undercuts the "karma=consequentialism" reflex. Sand = assuming karma's "results" = "consequences we maximize."  
  - **Dependency:** Without this groundwork, the case study collapses into intuitionism.  
  - **Sand to Avoid:** Don’t let "skillful" (kusala) be reduced to "good consequences." Anchor it in *root intentions* (lobha, dosa, moha vs. alobha, etc.).  

  **Key Misconception Deflection Points**  
  - **"Precepts are heuristics"** → Cut off during karma discussion: "Heuristics imply calculation; karma implies inherent quality."  
  - **"Trolley problems"** → Shut down early: "Buddhist ethics concerns real moral psychology, not abstract calculus."  
  - **"First Noble Truth = Negative Util"** → Deflect during groundwork: "Truth diagnoses; Path isn't minimisation but liberation."  
  - **Anattā-Parfit** → Preempt during karma/teleology.  

  **Honesty on the Parfit Route**  
  Acknowledge: "Parfit helped *me* see deep connections too—but Buddhism’s focus is cultivating wisdom/compassion *now*, not optimizing future states. Consequentialism inherits Western moral anxiety; Buddhism offers a path out of reactivity."  

  This structure forces engagement with the tradition’s internal logic before projecting frameworks. The unresolved lie case ensures they leave questioning—which is the goal.
