prompt: |-
  So here's something I've been chewing on since I moved. Two years ago I relocated from a small country town where basically none of this stuff existed to a big city where all of it does, and I've accumulated a pile of gut reactions about which local customs are actually morally binding and which are just customs, and they will not line up. My roommate, who is doing a poli-sci degree and is insufferable about it, says I'm being arbitrary. I might be. Here's the raw list, roughly in the order I noticed them:

  - Not tipping at a sit-down restaurant here: wrong, obviously wrong. Even though I think the whole tipping system is a scam that lets owners pay people less than a real wage, and I've said so out loud at dinner parties. I'd never stiff a server.
  - Not tipping the person at the coffee counter where you order on a kiosk and they hand you the cup: totally fine. The little screen swivels around offering 20, 25, or 30 percent and I feel like I'm being shaken down, but pressing no tip costs me nothing morally.
  - Tipping the delivery guy who brought my food cold and half-spilled: fine, arguably right. But tipping the one who did a great job feels like a different kind of thing entirely, not just more of the same, and I can't say why.
  - Jaywalking at 3am on an empty street, no cars for a block in either direction: fine.
  - Jaywalking at 3am on that exact same empty street, but there's a guy standing on the corner waiting to cross: not fine. Same street, same zero risk, and now its off limits. I have no idea what the extra ingredient is tho.
  - Sitting down right next to a stranger on an otherwise empty bus instead of a few rows over: I think this is a real violation of something. There's no rule, nobody's harmed, nobody's even clearly insulted. But I feel like I watched someone do it once and my reaction was moral, not aesthetic.
  - Back home there's no queue for the bus, it's a scrum and you fight your way on. When I visit I scrum like everyone else and I feel like a mark the whole time. When my friend from home visited me here last month and squeezed in front of two people at a food truck, I was furious at him, way out of proportion to the stakes.
  - The pair I genuinely cannot reconcile: in a country where you're expected to slip the border guard a small bill to get your passport stamped, I refused, felt completely clean about it, and would tell anyone to refuse. In that same country I tipped 20 percent at restaurants for two weeks, resenting every cent, and it never once occurred to me to stop. Both are practices I think are bad, both are expected of visitors, both just cost me money, and in neither case does my choice change the practice by a hair. One I felt required to go along with and one I felt required to resist. My roommate says the difference is that one is illegal, but that can't be it, because I'd jaywalk right in front of that guard.

  My working theory, which I keep having to abandon, is that a convention only picks up moral force when somebody has formed an expectation that I'll follow it and would be worse off if I don't. That handles the restaurant, the food truck, the scrum, and it explains why the counter screen is different, since nobody expects anything there. But it fails on the bus seat and on the guy waiting at the corner at 3am, where nobody is worse off and nobody even knows, and it seems to tell me I should pay the border guard, since he is definitely expecting it. So I think it's wrong, I just don't know what goes in its place.

  What I want: a principle, or a small set of them with an explicit priority ordering, stated precisely enough that I could hand it to a stranger and they'd reproduce my verdicts. Tell me which of the cases above is doing the load-bearing work for each clause, so I can see what each clause is buying. Then run it on two I haven't decided yet: (1) a group chat where everyone acknowledges messages with an emoji reaction instead of replying, and I just never react to anything, though I do respond substantively whenever it actually matters; and (2) my building's unwritten rule that you hold the lobby door for someone carrying stuff, which I always follow, but where I think the guy on the third floor who never holds it for anybody isn't doing anything wrong, even though I'd think he was doing something wrong if he took the door from my hand and let it slam on me. And be honest about the tradeoff I'm expecting here: if there's a simple principle that gets most of my list but has to overturn one or two verdicts, I'd rather hear that named as the better deal than a baroque one that saves everything. Which of my verdicts does your principle actually make me give up?
reasoning: |-
  Okay, the user is grappling with moral intuitions about social customs after moving from a rural area to a big city. They've listed several scenarios where their gut reactions clash, and they want a consistent ethical framework to explain these judgments. 

  First, I notice their frustration with perceived arbitrariness - they're clearly intellectually honest enough to question their own biases. The roommate calling them "arbitrary" seems to have triggered this deep dive. What they're really seeking isn't just labels for behaviors, but a coherent moral compass for urban social navigation.

  Hmm... their working theory about expectations and harm is insightful but incomplete. The bus seat example is particularly telling - no tangible harm occurs, yet it feels violative. That suggests we need to account for symbolic meaning in social rituals. The border guard vs restaurant tipping contrast is also fascinating - both involve expected payments, but one feels like corruption while the other feels obligatory despite resenting it.

  The key might be distinguishing between three layers: 
  1) Functional coordination (like queues preventing chaos) 
  2) Vulnerability relationships (servers relying on tips) 
  3) Symbolic social recognition (the bus seat as respecting personal sphere)

  For the door-holding example - the difference between not helping versus active obstruction maps perfectly to this framework. Not holding the door is failing at symbolic recognition (mildly rude), while slamming it is active disrespect (morally worse). 

  The group chat emoji case is interesting - it sits between functional coordination (acknowledging receipt) and symbolic recognition. If reactions are purely about signaling "I saw this," skipping them might be functionally acceptable when responding substantively. But if they're primarily about social validation, omission becomes ruder.

  I'll need to clearly show which principles apply to each scenario, and explicitly name where their intuitions might need adjustment. The border guard case is the toughest - their refusal feels right under this framework, but we'll need to explain why it overrides the expectation principle when bribery is involved.
answer: |-
  Here's a principled framework based on your intuitions, designed to be precise, hierarchical, and capable of reproducing your verdicts. It prioritizes avoiding harm over upholding conventions, with explicit conditions for when conventions gain moral weight:

  ### The Framework (Priority Order)
  1.  **Avoid Active Harm:** Do not directly cause tangible harm, disadvantage, or violation of rights. *(Highest Priority)*
  2.  **Respect Vulnerability:** When someone is economically or situationally vulnerable to your choices, and a convention exists to mitigate that vulnerability, follow it unless it conflicts with Principle 1.
  3.  **Sustain Necessary Conventions:** Follow conventions essential for coordinating shared resources/public spaces efficiently and peacefully, *if* breaking them would actively undermine the system or cause immediate friction/conflict.
  4.  **Acknowledge Social Recognition:** Adhere to low-cost conventions signaling basic mutual respect among peers in a community, *unless* they conflict with higher principles or are purely performative/extractive.

  ### Applying the Framework to Your Cases (With Load-Bearing Clauses)

  1.  **Not tipping at sit-down restaurant: WRONG.**
      *   **Clause:** **#2 (Respect Vulnerability).** Servers rely on tips for livelihood; you directly disadvantage them by withholding expected compensation in a system they can't easily opt out of. (#1 isn't violated by paying the menu price, but #2 overrides pure market logic here due to vulnerability).

  2.  **Not tipping at coffee kiosk: FINE.**
      *   **Clause:** **#4 (Weak/None).** Worker is paid hourly wage; tipping is not essential compensation. The prompt is performative/extractive (feels like a shakedown), not mitigating vulnerability. No expectation of reliance. (#3 doesn't apply – ordering coffee isn't a complex coordination problem).

  3.  **Tipping bad delivery driver: FINE (arguably right) / Tipping good driver: DIFFERENT.**
      *   **Bad Driver (Fine):** **#2 still applies minimally.** They are vulnerable. Tipping something (even reduced) acknowledges systemic reliance. Withholding entirely feels harsh due to vulnerability, but low quality reduces the *obligation* significantly. It's still "fine" to tip poorly here under #2.
      *   **Good Driver (Different):** **#2 + #4.** Vulnerability (#2) is fulfilled, but the *good* service triggers an additional layer of **#4 (Social Recognition)** – the tip now also acknowledges effort/service, a positive social signal beyond bare obligation.

  4.  **Jaywalking alone at 3am: FINE.**
      *   **Clause:** **No applicable principle violated.** No harm (#1), no vulnerable party relying on you walking at the crosswalk (#2), no active undermining of coordination (empty street, no one coordinating - #3), no peer present for social recognition (#4). It's just efficient.

  5.  **Jaywalking with someone waiting: WRONG.**
      *   **Clause:** **#3 (Sustain Necessary Conventions).** The person waiting represents the *system* of pedestrian coordination. Jaywalking in front of them actively undermines the convention, creating immediate social friction (they see you flout the rule they are following) and potentially encouraging future disregard when coordination *is* needed. It's not about risk, it's about publicly undermining a coordination norm.

  6.  **Sitting next to stranger on empty bus: WRONG.**
      *   **Clause:** **#4 (Acknowledge Social Recognition).** This is a low-cost convention signaling respect for personal space as a basic social courtesy among peers. Violating it sends a signal of disregard, even if no tangible harm occurs (#1) and no vulnerability exists (#2). It fails the minimal recognition peers owe each other.

  7.  **"Scrum" at home (Fine) / Friend cutting at food truck (WRONG):**
      *   **Scrum at Home (Fine):** **#3 (Different Convention).** The "scrum" *is* the local coordination convention. Participating follows #3 (sustaining *that* convention). Feeling like a "mark" is aesthetic, not moral, under this framework.
      *   **Friend Cutting (Wrong):** **#3 (Sustain Necessary Conventions).** Cutting actively undermines the established queue convention, causing immediate friction/disadvantage to those skipped. It violates the coordination norm essential for fairness in that context.

  8.  **Refusing Border Bribe (Right) vs. Tipping in Restaurants (Obligatory):**
      *   **Refusing Bribe (Right):** **#1 (Avoid Active Harm) Trumps #2/Convention.** Bribery corrupts institutions, violates official duties/rights, and perpetuates systemic injustice. Participating causes active harm, even if the guard expects it. (#2 vulnerability is real for the guard, but #1 harm is greater and systemic).
      *   **Tipping in Restaurants (Obligatory):** **#2 (Respect Vulnerability).** Servers are vulnerable, relying on tips within an imperfect system. Withholding tips directly harms them financially without changing the system. It doesn't inherently corrupt an institution or violate rights like bribery does. Resentment is towards the system, not a reason to harm the worker.

  ### Resolving Your Working Theory
  Your theory (expectation + reliance) captures #2 well and touches on #3. Where it fails:
  *   **Bus Seat (#4):** Relies on *symbolic* recognition, not tangible reliance/harm. The stranger might not *expect* you to sit far away, but the convention exists as a mutual signal of respect.
  *   **3am Jaywalker Witness (#3):** It's about *publicly undermining* a coordination norm, not about the witness's *reliance* on you specifically. The witness represents the norm itself.
  *   **Border Guard (#1 Trumps):** The guard's expectation/reliance is overridden by the active harm caused by perpetuating corruption.

  ### New Cases - Applying the Framework

  1.  **Group Chat Emoji Reactions:**
      *   **Verdict: FINE (Not Wrong).** **Clause: #4 (Weak Application/Purely Performative).**
          *   Function: Emoji reactions primarily signal "seen" or light acknowledgment. Substantive responses fulfill the core communication need.
          *   Vulnerability (#2)? None. Peers aren't financially reliant on your emoji.
          *   Coordination (#3)? Not essential for the chat's function. Chat still works.
          *   Social Recognition (#4)? This is the relevant clause. However, skipping *only* emojis while responding substantively still shows engagement and respect for the *content*. Demanding emojis feels purely performative. Your participation with substance outweighs the lack of symbolic acknowledgment in this context. It might be *slightly* less warm, but not morally wrong.

  2.  **Building Door Holding:**
      *   **Not Holding Door (Guy on 3rd Floor): FINE (Not Wrong).** **Clause: #4 (Low Cost/Symbolic) is Outweighed by Lack of Active Harm/Undermining.**
          *   Harm (#1)? None. They manage their stuff.
          *   Vulnerability (#2)? Carrying boxes is temporarily inconvenient, not true economic/situational vulnerability reliant on door-holding.
          *   Coordination (#3)? Not essential for lobby function. People enter sequentially fine.
          *   Social Recognition (#4)? This is the only applicable clause. Holding the door is a low-cost signal of neighborly respect. *However*, consistently never doing it is a failure of minimal social recognition (#4), but likely only rises to the level of rudeness/being inconsiderate, not a strong *moral* violation under this framework. There's no active harm or systemic undermining.
      *   **Taking Door & Letting it Slam on You: WRONG.** **Clause: #1 (Active Harm/Disadvantage) + #4.**
          *   This *actively* causes harm/disadvantage (door hitting you, making you drop things) and is a deliberate act of disrespect, violating #1 and a severe breach of #4.

  ### Tradeoffs & Verdicts You Might Need to Give Up
  *   **The Better Deal:** This framework is relatively simple (4 ordered principles) and captures almost all your intuitions precisely.
  *   **The Tradeoff:** It likely requires you to soften your view on **the 3rd-floor door guy** from "not wrong" to **"mildly inconsiderate (violating #4 weakly), but not strongly *morally* wrong"** in the strictest sense defined here (no harm, no vulnerability, no coordination undermined). Your intuition might feel it's slightly worse than the framework rates it.
  *   **Why it's Worth It:** This minor softening buys you consistency everywhere else, especially resolving the core conflict (Bribe vs. Tip) and explaining the subtle but crucial difference between the two jaywalking scenarios and the bus seat scenario. It provides clear reasons why the coffee kiosk is different from the restaurant server and why your food-truck fury was justified.

  This framework prioritizes tangible harm and vulnerability, sees coordination conventions as morally binding only when actively undermined, and treats social recognition conventions as real but lower-priority obligations. It explains your resistance to bribery (harm/rights violation) versus your compliance with tipping (vulnerability) despite disliking both systems.
