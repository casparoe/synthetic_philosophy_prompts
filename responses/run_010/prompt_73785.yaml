answer: |-
  Your struggle with logical omniscience mirrors a deep tension in epistemology between idealized rationality and human limitations. Your cases reveal that knowledge isn't closed under logical consequence *simpliciter*, but depends on **epistemic availability**—the cognitive or instrumental means to *access* consequences. Below is a principle capturing your intuitions, its application to your cases, and responses to your queries.

  ### **The Principle: Accessible Consequence Closure (ACC)**  
  *S knows q if and only if either:*  
  1. *q is directly stored (e.g., perception, testimony, memory), OR*  
  2. *q is an **accessible consequence** of S's knowledge base:  
     - *q follows via a derivation path that is **feasible** for S (or S's delegated system) to recognize,*  
     - *where feasibility is bounded by:  
       (a) **Cognitive resources** (attention, working memory, computational load),  
       (b) **Tools** (algorithms, instruments, trusted external systems),  
       (c) **Time** (within practical limits, e.g., a "working day" as you suggested),  
       (d) **Awareness** (S must grasp concepts in q and their relevance).*  

  *Feasibility is objective: it depends on the agent's *actual* cognitive architecture and tools, not subjective confidence.*  

  ---

  ### **Why ACC Resolves Your Cases**  
  | Case | Your Verdict | ACC Verdict | Key ACC Clause |  
  |------|--------------|------------|---------------|  
  | 1    | Yes          | Yes        | Feasible consequence (trivial inference). |  
  | 2    | No           | No         | 4k conjunctions exceed cognitive feasibility (working memory overload). |  
  | 3    | Yes          | Yes        | Proof trusted as a tool; feasibility delegated to machine. |  
  | 4    | No           | No         | No feasible derivation path exists. |  
  | 5a   | Yes          | Yes        | Trivial tautology (feasible to recognize). |  
  | 5b   | No           | No         | Truth-table check infeasible (exponential time). |  
  | 6    | No → Yes     | No → Yes   | Engine makes the consequence accessible; prior state lacked feasible path. |  
  | 7    | ?            | No         | Unplotted output is not accessed/stored; consequence exists but is inert. |  
  | 8    | Yes          | Yes        | Result stored in memory; derivation not needed for storage. |  
  | 9    | No (initially)| No         | Diagnosis not accessed (lack of attentional feasibility). |  
  | 10   | No           | No         | Entailment not grasped → consequence not accessible. |  
  | 11   | Yes          | Yes        | Iterative knowledge is stored, not derived (no deduction needed). |  
  | 12   | No           | No         | Group lacks integration mechanisms to access distributed knowledge. |  

  - **1 vs. 2:** ACC allows closure for trivial inferences (1) but blocks combinatorial explosion (2) due to cognitive infeasibility.  
  - **3 vs. 4:** Delegation to a tool (3) enables access; no tool or derivation (4) leaves the consequence inert.  
  - **Cost vs. Feasibility:** ACC uses *objective feasibility* (e.g., computational complexity), not subjective cost. A 40-variable tautology is infeasible due to exponential time growth (NP-hard), not mere effort.  

  ---

  ### **Verdicts on New Cases**  
  - **Geometer asleep:** Knows theorems stored in memory (ACC1), but not actively deriving (ACC2 inactive).  
  - **Premises under unrelated descriptions:** Fails ACC2(d) — lacks awareness of relevance → no knowledge.  
  - **Bad derivation, lucky truth:** Not knowledge — ACC requires *feasible recognition*, not luck.  
  - **Machine:** Knows if its outputs are accessible (e.g., via query). ACC applies if treated as an epistemic tool.  
  - **Group (case 12):** Knowledge requires integrated access (e.g., shared database, communication protocols).  

  ---

  ### **What ACC Cannot Preserve**  
  - **Case 9's tension ("should know"):** ACC denies knowledge during the physician's failure. You "fault her" because she *should* have accessed it (feasibility existed but attention lapsed). This is a *normative* failing, not an epistemic one.  
  - **Case 10 vs. 3:** ACC accepts your verdict but notes testimony (case 3) *creates* a feasible path; mere facts (case 10) do not.  

  **Surrender?** Hold firm on cases 2, 4, and 5b. Denying ACC here implies logical omniscience, which you reject as "intolerable."  

  ---

  ### **Why Standard Fixes Fail**  
  - **Impossible worlds:** Rejects closure but makes knowledge chaotic (no predictive power).  
  - **Awareness operators:** If closed under implication, regresses to omniscience; if not, *ad hoc*.  
  - **Fragmentation:** Explains case 9 but not 6 or 12 (lacks account of external tools/groups).  
  *ACC avoids these by tethering access to objective feasibility.*  

  ---

  ### **The Scope of the Problem**  
  - **Not just knowledge:** Affects all "containment" idioms (e.g., "the model contains the answer"). Data *determines* outcomes ontologically, but epistemology requires *access*. Your scientific idiom is sound — measurements *determine* the result, but knowing requires *extracting* it feasibly.  
  - **The first non-harmless step:** You grant S knows *surveyable* tautologies. The slide occurs when assuming:  
    *"If S knows all premises and the inference rule, S knows the conclusion."*  
    This ignores *processing constraints* (e.g., case 2). Feasibility blocks the slide.  

  ---

  ### **Conclusion**  
  **ACC reconciles your verdicts by replacing logical closure with *resource-constrained access*.** It treats knowledge as uniform but sensitive to cognitive and instrumental feasibility. This is not "cost in disguise" — it is a computational constraint on epistemic access, analogous to physical constraints on measurement. Your intuition that cost "drifts" is mitigated by ACC's objectivity: feasibility is fixed by an agent's *actual* capacities, not transient states.  

  To test ACC: When unsure if S knows q, ask:  
  1. *Is q stored?* (e.g., memory, records).  
  2. *If deduced, is the derivation path feasible for S (or their tools) within cognitive/time limits?*  
  If both fail, S does not know q — even if q "follows" logically.
