  We are given a draft section of a paper on the epistemic justification of democracy, focusing on Condorcet's jury theorem. The author's main claim is that the standard objection to the theorem (that independence is unrealistic) is too quick because the theorem requires a weaker condition: pivotal competence. The author argues that even with conformist voters (who copy the majority unless they are pivotal), the collective accuracy remains the same as if they were all sincere, provided they use their own signal when pivotal. The author also draws a design recommendation: institutional design should focus on the tie-set (states in which a vote is pivotal) rather than independence.

  The referee is asked to address six specific points and to avoid providing bibliographic references.

  Let's address each point in turn.

  ## 1. Checking the mathematics

  The author provides two computations in §3 to support the claim that a conformist voter does not change the collective accuracy. We are to redo the computations and verify the claim about formula (*) and the decay of T.

  ### Formula (*) in §2
  The formula is:
    A = C + T·q
  where:
    T = P(first m ballots are tied)
    C = P(strict majority of the first m ballots is for the truth)
    q = P(last ballot is for the truth | first m are tied)

  The author states that (*) requires no probabilistic hypotheses. This is correct because it is a decomposition of the event that the majority of the entire (m+1)-voter body is correct. The event breaks down into two mutually exclusive events:
    (a) The first m ballots already have a strict majority for the truth (then the last vote doesn't matter, and the outcome is correct regardless of the last vote). This event has probability C.
    (b) The first m ballots are tied (probability T). Then the outcome is correct if and only if the last vote is for the truth (which has conditional probability q). The contribution is T·q.

  Since (a) and (b) are mutually exclusive and cover all possibilities (because if the first m are tied or have a strict majority, and note that a tie is not a strict majority), then indeed:
    A = C + T·q

  This holds without any independence assumptions.

  ### Decay of T
  The author states that T → 0 as m grows, and exponentially fast if p is bounded away from 1/2. 

  T is the probability that the first m ballots (which are cast by sincere voters) are tied. Since m is even, a tie means exactly m/2 votes for the truth and m/2 votes against.

  Under independence, T = binom(m, m/2) * [p^(m/2) * (1-p)^(m/2)].

  Using Stirling's approximation, we know that binom(m, m/2) ~ 2^m / sqrt(π m / 2) [more precisely, binom(m, k) with k=m/2 is approximately 2^m * sqrt(2/(π m))]. Then:
    T ~ [2^m * sqrt(2/(π m))] * [p^{m/2} (1-p)^{m/2}] 
       = sqrt(2/(π m)) * [4 p (1-p)]^{m/2}

  Note that [4 p (1-p)] is the key term. Since p>1/2, we have p(1-p) < 1/4 (because the maximum of p(1-p) is 1/4 at p=1/2). Therefore, 4p(1-p) < 1. Hence, T decays exponentially in m. The rate is [4p(1-p)]^{m/2} which is exponential, and the polynomial factor (in m) does not change that.

  Moreover, if p is bounded away from 1/2 (say p>=1/2+δ for some δ>0), then 4p(1-p) is bounded above by a constant less than 1 (because p(1-p) is continuous and at p=1/2 it is 1/4, so 4*(1/4)=1, but when p>1/2, 4p(1-p)<1). Specifically, if p is not exactly 1/2, then 4p(1-p) < 1, so exponential decay.

  Therefore, the remark is correct.

  ### Computations in §3

  #### Case 1: Two sincere voters (so m=2, then n=3)
  We have:
    C = P(strict majority in first m=2 ballots for truth) 
      = P(both correct) = p²
    T = P(tied in first two) = P(one correct, one wrong) = 2p(1-p)
    q = p (since the last voter is sincere and independent)

  Then:
    A = C + T*q = p² + 2p(1-p)*p = p² + 2p²(1-p) = p²(1 + 2(1-p)) = p²(3-2p) = 3p² - 2p³

  Now, the accuracy of three sincere voters (without any conformist) is:
    P(at least two correct) = P(exactly two correct) + P(three correct)
      = binom(3,2) p²(1-p) + binom(3,3) p³
      = 3 p²(1-p) + p³ = 3p² - 3p³ + p³ = 3p² - 2p³

  So indeed, A = 3p² - 2p³, which matches.

  #### Case 2: Four sincere voters (so m=4, then n=5)
  We have:
    C = P(strict majority in first 4 for truth) 
      = P(at least three correct) = P(three correct) + P(four correct)
      = binom(4,3) p³(1-p) + binom(4,4) p⁴ = 4 p³(1-p) + p⁴

    T = P(tied in first four) = P(two correct and two wrong) = binom(4,2) p²(1-p)² = 6 p²(1-p)²

    q = p (last voter sincere)

  Then:
    A = C + T*q = [4 p³(1-p) + p⁴] + [6 p²(1-p)²] * p
