  ### Referee Report on Draft: "Pivotal Competence: What the Jury Theorem Actually Assumes"  

  #### **1. Mathematics Check**  
  - **Formula (\*) in §2** is correct as stated. It relies solely on the definition of conditional probability and the deterministic effect of the marginal voter when the first \(m\) ballots are tied or have a strict majority. No probabilistic assumptions (e.g., independence) are needed.  
  - **Decay of \(T\)**: Your claim that \(T \to 0\) exponentially fast for \(p > 1/2\) bounded away from \(1/2\) is correct. For \(m\) even, \(T = \binom{m}{m/2} (p(1-p))^{m/2}\), and the binomial coefficient grows polynomially while \((p(1-p))^{m/2}\) decays exponentially since \(p(1-p) < 1/4\) when \(p \neq 1/2\).  
  - **Computations in §3**:  
    - **Two sincere voters → three voters (one conformist)**:  
      Your calculation holds: \(A = p^2 + 2p(1-p)p = 3p^2 - 2p^3\), matching the all-sincere accuracy for \(n=3\).  
    - **Four sincere voters → five voters (one conformist)**:  
      \(A = [4p^3(1-p) + p^4] + 6p^2(1-p)^2 \cdot p = 10p^3 - 15p^4 + 6p^5\), matching the all-sincere accuracy for \(n=5\).  
    **Verdict**: All mathematics in §§2–3 is sound.  

  ---

  #### **2. Pressure Test on §4**  
  - **Claim in §4 is false**. You assert that padding with *any number* of conformists (each using their signal only when pivotal) preserves accuracy identical to an all-sincere group. This fails beyond adding one conformist.  
  - **Counterexample (smallest)**:  
    - **Setup**: Start with 1 sincere voter (truth-tracking with \(p = 0.6\)), add 2 conformists.  
    - **Baseline**: Accuracy of 3 sincere voters = \(3p^2 - 2p^3 = 0.648\) (at \(p=0.6\)).  
    - **Conformist behavior**:  
      - Vote 1 (sincere): Correct with prob \(p\).  
      - Vote 2 (conformist): Copies Vote 1 (never pivotal; no tie with one vote).  
      - Vote 3 (conformist): Copies majority of first two (always unanimous; never pivotal).  
    - **Accuracy**: Matches Vote 1’s accuracy: \(p = 0.6 \neq 0.648\).  
  - **Why §4 fails**:  
    - The argument assumes each conformist faces a context where ties are possible (i.e., even-sized prior groups). Adding multiple conformists violates this: after the first conformist, the group size becomes odd, and subsequent conformists never face ties.  
    - **Baseline ambiguity**: "Exactly what it would have been" compares to an all-sincere group of the same size. Your argument in §§2–3 needs this baseline, but §4 equivocates by implying iterated additions preserve accuracy indefinitely. Only adding *one* conformist to an *even-sized sincere core* works.  
  - **What survives**: The core insight holds for one conformist added to an even-sized group, but not for "as many as you like." Revise §4 to reflect this limitation.  

  ---

  #### **3. Originality of §2**  
  - §2 is **not novel** but a clever repackaging of the standard inductive step in the Jury Theorem proof. The decomposition (\*) is equivalent to computing the probability of a correct majority by conditioning on the pivotality of the marginal voter—a routine move in binomial models.  
  - **"Pivotal competence"** reframes the known idea that a voter’s *conditional* competence (given pivotality) matters, not unconditional \(p\). This is implicit in the theorem’s asymptotic negligibility of individuals (as \(T \to 0\)).  
  - **Verdict**: While elegantly presented, §2 does not offer a new mathematical observation. The term "pivotal competence" is fresh, but the concept is standard (e.g., in critiques of the theorem’s normative implications for voter motivation).  

  ---

  #### **4. Design Recommendation in §5**  
  - **The tension is valid and follows from §§2–4**:  
    - Enlarging the group increases reliability (accuracy \(\to 1\)) but erodes individual pivotality (\(T \to 0\)).  
    - "Matters" is unambiguous here: It refers to *pivotality* (chance to sway the outcome). §5’s recommendation—small committees for hard questions—maximizes pivotality (high \(T\) when \(p \approx 1/2\) and \(n\) small) but sacrifices reliability (since small groups with \(p \approx 1/2\) err often).  
  - **No sleight of hand**: The trade-off is explicit in the vanishing \(T\). However, §4’s overclaim (mass conformity is costless) weakens the support for this tension. Focus on the sound part (§2) to ground §5.  

  ---

  #### **5. Fairness of §1’s Objection**  
  - **Your statement of the objection is fair** as a summary of common critiques (e.g., dependence via deliberation destroys independence and asymptotic reliability).  
  - **Strongest unaddressed objection**: Your argument assumes that when pivotal, voters have *independent signals with competence \(p\)*. Real-world dependence (e.g., shared biases, correlated evidence) may degrade *pivotal competence itself*. For instance:  
    - If conformists use signals correlated with prior voters, \(q < p\) even when pivotal.  
    - If shared biases make signals systematically erroneous, \(q \approx p\) fails.  
    Your model answers "mild" conformity (copying non-pivotal votes) but not corruption of the independent signal in pivotal states.  

  ---

  #### **6. Prose Feedback**  
  - **Padded/confusing sections**:  
    - §2: "the marginal voter’s entire contribution to accuracy, namely \(T(q - 1/2)\)" is abrupt. Clarify that this is the *improvement* over random voting.  
    - §4: "Conformists are free riders who do no damage" overstates—it holds only for one conformist.  
    - §5: "Whatever destroys the tie-set" is vague. Specify that mechanisms *suppressing pivotality* (e.g., large majorities) are the enemy, not conformity per se.  
  - **Clarity highlights**: §§2–3 are exceptionally clear. §1’s setup is concise and accessible.  

  ---

  ### Confidence Assessment  
  | **Criticism**                     | **Confidence** | **Notes**                                                                 |  
  |-----------------------------------|----------------|---------------------------------------------------------------------------|  
  | §4 claim false                    | High           | Counterexamples are trivial to compute.                                   |  
  | §2 unoriginal                     | Moderate       | Concept is standard; pivotality is well-studied. Least sure of literature depth. |  
  | §5 tension valid                  | High           | Direct consequence of \(T \to 0\).                                       |  
  | §1 objection fair                 | High           | Aligns with canonical critiques.                                          |  
  | Math correct                      | High           | Reproduced independently.                                                 |  
  | Prose feedback                    | Moderate       | Subjective; open to author’s stylistic judgment.                          |  

  **Least sure point**: Originality of §2 (Confidence: Moderate). A literature scan for "pivotality in Jury Theorem" would settle this, but you requested no references.  

  **Recommendation**: Revise §4 to restrict claims to *one* conformist added to an even-sized sincere core. Emphasize that the Jury Theorem’s asymptotic guarantee relies on pivotality vanishing—not global independence—and that §5’s design tension stands. The draft is promising but must not overclaim on conformity.
