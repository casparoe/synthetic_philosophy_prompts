      = 10p³ + (-20p⁴ + 5p⁴) + (10p⁵ - 5p⁵ + p⁵)
      = 10p³ - 15p⁴ + 6p⁵

  So indeed, A = 10p³ - 15p⁴ + 6p⁵, which matches.

