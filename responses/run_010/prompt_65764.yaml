  ## 3. Is §2 a genuine observation or repackaging?

  The author presents §2 as a decomposition that shows that what matters is the marginal voter's competence conditional on being pivotal (pivotal competence). 

  The standard proof of the Condorcet jury theorem (for odd n) often uses the fact that the probability of a correct majority is computed by considering the votes. The decomposition in (*) is not the standard way to prove the theorem. The standard proof uses the binomial distribution and the law of large numbers. 

  However, the idea that a voter is pivotal only in the event of a tie in the others is standard in the analysis of voting power (e.g., Banzhaf power index). The concept of pivotality is central in the literature on voting theory and mechanism design. 

  The particular decomposition (*) is a straightforward application of the law of total probability. It is elementary and might be considered folklore. 

  The term "pivotal competence" is new? But the idea that what matters is the probability of being correct conditional on being pivotal is a natural one. 

  In the context of the jury theorem, the observation that the asymptotic infallibility comes at the cost of individual pivotality vanishing is known. For example, it is discussed in the philosophical literature on the jury theorem (e.g., the problem that the theorem does not give an individual voter a reason to vote well because the probability of being pivotal is very small). 

  So §2 does not contain a novel mathematical observation. The decomposition (*) is a simple and natural one, but it is not original. The insight that the asymptotic result makes each voter negligible is also standard. 

  However, the author's presentation is clear and might be pedagogically useful. But the referee should note that this is not a new result. 

  ## 4. Design recommendation in §5

  The author argues that there is a tension: enlarging the jury makes it more reliable (asymptotically) but makes each member's judgment matter less (because the probability of being pivotal decreases). 

  The author says: "An institution that cared about members mattering ... would want small committees facing genuinely close questions"

  Does this follow from §§2-4? 

  From §2, we know that T (the probability of a tie in the others) decays to 0 as the group grows. So each voter's chance of being pivotal (and hence influencing the outcome) vanishes. 

  But the group's reliability increases. 

  So there is a trade-off: reliability vs. individual pivotality. 

  The author's recommendation for small committees and close questions (p near 1/2) maximizes T (the pivot probability) but at the cost of group reliability (which is lower when p is near 1/2 and n is small). 

  This trade-off is inherent. The tension is real: you cannot have both high reliability and high individual pivotality. 

  The ambiguity in "matters" is: does it mean "has a high chance of affecting the outcome" (pivotality) or something else? The author uses "matters" for pivotality. 

  So the tension is between two goals: 
    Goal 1: Group reliability (want high)
    Goal 2: Individual pivotality (want high for each member)

  As n increases, Goal 1 improves, Goal 2 worsens (for fixed p). 
  When p is near 1/2, T is high (so pivotality is high) but group reliability is low (for fixed n).

  Therefore, the design recommendation in §5 follows from the analysis in §2. 

  However, note that §4 (which is about conformists) is not necessary for this conclusion. The tension exists even with all sincere voters. 

  ## 5. Fairness of the standard objection in §1

  The author states the standard objection: independence is unrealistic because of deliberation, shared information, etc., and that positive correlation destroys the asymptotic guarantee. 

  This is a fair representation of a common objection. 

  The strongest form of the objection that the argument does not answer: 

  The author's argument (in §§2-4) shows that under a specific type of dependence (conformists who copy unless they are pivotal) the accuracy can be the same as under independence (at least for one conformist). But what about other forms of dependence? 

  For example, if the voters are positively correlated in a way that does not respect the pivotality condition? The author's model of the conformist is very specific. 

  Moreover, the author's argument requires that when a voter is pivotal, she uses an independent signal with competence p. But in reality, shared information might make even the pivotal competence less than p. For example, if the voters have common biases, then even when they are pivotal, their independent signal (if they have one) might be systematically biased. 

  Also, in the conformist model, the voter falls back on her own signal only when pivotal. But in reality, the process of deliberation might cause voters to suppress their own signals even when they are pivotal? 

  Furthermore, the author's claim in §4 (which we have shown is false for multiple conformists) is central to the argument that mass conformity is costless. But we found a counterexample. 

  The strongest objection is that in real groups, the condition of having a sincere core with independent signals, and the conformists using independent signals only when pivotal, is unrealistic. Moreover, even if we accept that, the argument only works for one conformist. When there are multiple conformists, the accuracy may drop. 

  Additionally, the objection might point out that the model does not account for strategic behavior: if voters know that others are conformists, they might vote strategically. 

  Therefore, while the author shows that independence is not necessary in a very specific model of dependence, it does not answer the objection that in more realistic models of dependence, the results of the theorem fail. 

  ## 6. Prose

  The prose is generally clear. However:

  - In §2: "the marginal voter's entire contribution to accuracy, namely T(q − 1/2)" — this should be explained. How is it T(q-1/2)? 
    From (*): A = C + T·q.
    Without the last voter, the accuracy of the first m voters? But the first m voters (even) do not have a majority? The author does not define the accuracy for even-sized groups. This might confuse readers. The contribution of the marginal voter is the difference between the accuracy of the (m+1)-voter group and the accuracy of the m-voter group? But the m-voter group (even) does not have a strict majority. So the author might mean: the marginal voter's contribution is the amount by which she increases the accuracy. But the accuracy of the m-voter group is not defined. 

    Actually, the author writes: "the marginal voter's entire contribution to accuracy, namely T(q − 1/2)". Let me see: 
      A = C + T·q
    Now, if the last voter always voted for the truth, then q=1 and A would be C + T.
    If she always voted against, then q=0 and A would be C.
    So her contribution is [C + T·q] - C = T·q? But that is not compared to anything. 

    The author says T(q-1/2). This must be the increase over tossing a fair coin for the last vote? But that is not stated. 

    Actually, if the last vote were random (q=1/2), then A_random = C + T*(1/2). 
    Then the marginal voter's contribution compared to random is: 
        [C + T·q] - [C + T/2] = T(q - 1/2)
    So that is the improvement over random. 

    The author should clarify.

  - In §3: "Copying costs nothing at the margin." — This is clear.

  - In §4: "the conformists are free riders who do no damage" — but our counterexample shows that with multiple conformists, they do damage. So this is overstated.

  - In §5: "the enemy is not copying but whatever destroys the tie-set" — but if copying destroys the tie-set? In our counterexample, the conformists never let a tie happen beyond the initial group. So copying can indeed destroy the tie-set. 

  ## Confidence in criticisms

  - Point 1 (mathematics): High confidence. The computations were redone and verified. The decomposition (*) is correct and requires no probabilistic hypotheses. The decay of T is exponential as stated.

  - Point 2 (§4 claim): High confidence that the claim as stated is false. We provided a counterexample with two conformists added to one sincere voter (which gives different accuracy) and also with three conformists added to two sincere voters (which also differs). The claim holds only for adding one conformist to an even-sized sincere group.

  - Point 3 (originality of §2): Moderate confidence. The decomposition is elementary and pivotality is a standard concept. The asymptotic negligibility is a known point.

  - Point 4 (design recommendation): High confidence that the tension follows from §2 (even without §4). The tension is real: group reliability vs. individual pivotality.

  - Point 5 (fairness of objection): High confidence that the standard objection is fairly stated. The strongest unaddressed objection is that the model of dependence is very specific and does not cover more realistic forms of dependence that might lower pivotal competence or occur even when not pivotal.

  - Point 6 (prose): Moderate confidence. The prose is generally clear, but there are a few points that could be confusing (like the contribution being T(q-1/2)).

  The point I am least sure of is the extent to which the idea in §2 is already known. I am not an expert in the entire literature on the jury theorem. What would settle it is a thorough literature review, which we are not to provide.

  ## Final Report

  **Referee Report on Draft: "Pivotal Competence: What the Jury Theorem Actually Assumes"**

  ### General Assessment
  The draft presents an interesting and clear argument that the standard objection to Condorcet's jury theorem (based on the unrealistic assumption of independence) is too quick. The author shows that under a specific model of conformist voting (where voters copy the majority unless they are pivotal, in which case they use an independent signal), the collective accuracy can be the same as under independence, at least for one conformist added to a sincere even-sized group. The mathematical decomposition in §2 is elegant and correct, and the tension highlighted in §5 is real and important. However, the central claim in §4 (that padding with any number of conformists preserves accuracy) is incorrect, as shown by counterexamples. The draft is well-written overall, but a few points need clarification.

  ### Responses to Specific Requests

  1. **Mathematics Check**:
     - Formula (*) in §2 is correct and requires no probabilistic assumptions. It is a simple decomposition of the event that the majority is correct.
     - The computations in §3 (for n=3 and n=5) are correct.
     - The statement that T (the probability of a tie in the first m votes) decays to 0 exponentially fast (when p is bounded away from 1/2) is correct.

  2. **Pressure on §4**:
     - The claim in §4 ("pad the body with as many conformists as you like ... collective accuracy is exactly what it would have been had they all voted sincerely") is false. 
     - **Counterexample 1**: Start with one sincere voter (so the initial group size is 1, which is odd, but the author's setup requires an even-sized sincere core). However, even if we allow it, add two conformists. The accuracy is p (if the first voter is correct), while the baseline for three sincere voters is 3p²-2p³. These are not equal (e.g., at p=0.6, p=0.6 and 3*(0.6)^2-2*(0.6)^3=0.648). 
     - **Counterexample 2**: Start with two sincere voters (even) and add three conformists (so total five). The accuracy (computed as p²(3-2p) for p=0.6 is 0.36*1.8=0.648) while the baseline for five sincere voters is 0.68256 (at p=0.6). Not equal.
     - The claim holds only for adding one conformist to an even-sized sincere group (as in §3). The baseline for "exactly what it would have been" is the accuracy of a group of the same size with all sincere independent voters. The failure occurs because with multiple conformists, the voting behavior is not equivalent to sincere voting: the conformists copy non-pivotal majorities and thus amplify the initial votes, reducing the diversity of signals.

  3. **Originality of §2**:
     - The decomposition in §2 is a straightforward application of the law of total probability and the definition of pivotality. The concept of pivotality is standard in voting theory (e.g., in the Banzhaf index). The observation that the asymptotic infallibility comes at the cost of individual pivotality vanishing is also known in the literature on the jury theorem (e.g., in discussions of the "voting paradox"). While the presentation is clear and the term "pivotal competence" is novel, the idea itself is not new. Thus, §2 is largely repackaging known insights, though it does so elegantly.

  4. **Design Recommendation in §5**:
     - The tension described in §5 (between group reliability and individual pivotality) follows directly from §2, without needing §4. As the group grows, reliability increases but individual pivotality (T) decreases. The trade-off is clear: small committees facing close questions (p near 1/2) maximize pivotality but sacrifice reliability. There is no ambiguity in "matters" if it is defined as pivotality (chance of affecting the outcome).

  5. **Fairness of the Standard Objection**:
     - §1 fairly states the standard objection that dependence (due to deliberation, etc.) undermines the independence assumption and thus the theorem. However, the strongest form of the objection that your argument does not address is that your model of dependence (conformists using independent signals only when pivotal) is very specific and unrealistic. In reality:
       - Voters might not have independent signals even when pivotal (due to common biases or shared information).
       - The conformist behavior might not be feasible (e.g., if voters cannot observe the tally before voting).
       - With multiple conformists (beyond one), accuracy can drop below the independent case (as shown in our counterexample).
       - Strategic voting (if voters anticipate conformism) might further degrade accuracy.
     Thus, your argument does not answer the objection for more realistic forms of dependence.

  6. **Prose Suggestions**:
     - **§2**: Clarify that "the marginal voter's entire contribution to accuracy, namely T(q − 1/2)" is the improvement over a random vote (q=1/2). Currently, it is abrupt.
     - **§4**: Revise to reflect that the claim holds only for one conformist added to an even-sized sincere group. As written, it overstates ("free riders who do no damage").
     - **§5**: The enemy might well be copying if it destroys the tie-set (as in our counterexample where conformists prevent ties). Refine the claim.
     - Generally, avoid overclaiming given the counterexamples.

  ### Confidence in Criticisms
  - **Point 1 (Math)**: High confidence.
  - **Point 2 (§4)**: High confidence (counterexamples are clear).
  - **Point 3 (Originality)**: Moderate confidence (the ideas are standard, but I am not an expert in the entire literature).
  - **Point 4 (Design)**: High confidence.
  - **Point 5 (Objection)**: High confidence.
  - **Point 6 (Prose)**: Moderate confidence.

  The point I am least sure of is the originality of §2 (Point 3). A thorough literature review (which I cannot provide) would settle it.

  ### Overall
  The draft has valuable insights (especially the decomposition and the design tension) but overreaches in §4. I recommend revising §4 to limit the claim to one conformist and address the limitations. The draft is promising and clearly argued but needs to scale back the generality of the conformism result.
