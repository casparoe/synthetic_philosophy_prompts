      = 4p³ - 3p⁴ + 6p³ (1 - 2p + p²)
      = 4p³ - 3p⁴ + 6p³ - 12p⁴ + 6p⁵
      = (4p³ + 6p³) + (-3p⁴ -12p⁴) + 6p⁵
      = 10p³ - 15p⁴ + 6p⁵

