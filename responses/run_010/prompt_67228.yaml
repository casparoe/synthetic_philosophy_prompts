prompt: |-
  I'm a fifth grade teacher by some weird accident of life also a member of our county's volunteer swiftwater rescue team — eleven people, two boats, one very loud group chat. I finished probation last spring. Ray has run the team for nineteen years and is handing it over in March because his hip is finally shot, and the county emergency management folks now want our dispatch/triage decisions written down as an actual protocol document, since the next crew reading it might be doing it at 3am in the rain and won't have Ray in the boat with them. Because I "have words" I got handed the job of drafting it. The problem is I've been on maybe nine callouts with him and I keep a notebook from debriefs, so I have a pretty good record of what he decided, but I cannot for the life of me tell you what rule he's running. Here's the track record as best I can reconstruct it:

  - Ice storm, two calls at the same time, same distance, both in moving water: a solo paddler pinned against a culvert, and three people on a porch roof. Everyone hypothermic, nobody obviously worse off. Ray flipped a quarter for it in the parking lot. Coin said porch. Nobody argued and nobody thought it was strange.
  - Two years ago: one unconscious woman in a flooded car versus five people standing on a highway median who were cold, soaked and swearing at us. He put everything into the car and left the five for the second unit. When I asked about it later he said he wasn't doing math, he was doing "who's going to be dead if we're wrong."
  - A house collapse with twelve people in moving water versus one guy on a fence post, all equally reachable, all equally bad off. He went straight for the twelve, no coin, no hesitation. A rookie asked afterward whether they should have flipped for it. Ray said "maybe. I couldn't have." That was the whole answer.
  - Winter tree-well call: one buried skier with a strong beacon signal and maybe twenty minutes, three people alive and digging in a tree well a couple hundred yards off. Ray split the team four and four instead of concentrating everyone on the beacon. All four came out. At debrief he said he split it because "I'm not the guy who picks which of those parties loses."
  - Two victims in the same reach, both drowning: a 24 year old and a 78 year old with a bad heart. He refused to weigh it, sent one boat to each, and told the rookie who suggested the younger one was worth more "we don't do that. We don't rank people in the water."
  - A call where the single victim turned out to be another team member's wife, with two teenagers further downriver who were both alive and hugging a tree. Boat went to the wife. The teens were fine when the second unit got there, but Ray said afterward that if they hadn't been he'd have made the same call and he wasn't going to apologize for it.
  - Eight people tubing a closed section that flooded versus one motorist swept off a bridge by the same water. He went for the eight, and when someone muttered about them having it coming, he said he doesn't sort out whose fault it is while anybody's in the river.

  Every one of those looks like arithmetic to me until I line it up next to the quarter in the parking lot, and then none of them look like arithmetic. The county template scenario I have to respond to is this: a levee overtops overnight and there are two locations and, in the window, only one boat crew and one helicopter slot. Location A is a school bus that went into a drainage ditch in near-freezing water with 26 high schoolers and a driver on it; the roof is holding, fire department can get warm air to them, and the realistic assessment is that nobody dies but if they aren't out in roughly three hours most of them loose limbs and a couple lose vision. Location B is a single man in a car in a deeper channel who goes under in about twenty five minutes and no other unit can reach him in time. Ray will be in surgery that week, so I need to do two things at once: write what the protocol says, and predict what he'll say when he reads it.

  So — what are the two or three genuinely different rules that are consistent with most or all of those calls? State each one the way I could actually put it in a document, and tell me which of his decisions, if any, each rule strains on, because my gut says the quarter and the split team don't come from the same place as the twelve on the house collapse. Then tell me what each rule predicts for the bus scenario, and give me your best guess about Ray with the reasons you'd bet on it. And here's the part I keep going in circles on: some of these candidate rules might be impossible to tell apart by looking at what he does and only differ in what he'd say about somebody else's identical choice — whether flipping was allowed, whether the twelve were owed a reason, whether the coin was respect or cowardice. If that's true I want you to say so bluntly, because a protocol can only write down actions, not reasons, and if two rules generate the same actions in every case then for my purposes they're one rule. If there's a single scenario I could put to Ray in the parking lot before his surgery that would separate them, give me that scenario. And if the rules really do diverge on the bus, tell me what the team would be committing itself to by writing down each version — because whoever crew's that call next February has never met him.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're a fifth-grade teacher who's also part of a volunteer swiftwater rescue team. Ray, the leader, is stepping down, and they need to create a protocol document based on his past decisions. The challenge is that Ray's decisions seem inconsistent—sometimes he uses a coin flip, other times he prioritizes groups or individuals without clear arithmetic. The user needs to distill Ray's implicit rules into a formal protocol that can guide the team without him.

  First, I need to analyze the scenarios provided. There are seven incidents, each showing different decision-making approaches. The key is to find underlying principles that explain all these cases. The user mentioned that some decisions look like arithmetic until the coin flip example, which complicates things. So, I should look for common threads that aren't purely numbers-based.

  Looking at the scenarios:
  1. **Ice storm**: Two calls, same distance. Ray flips a coin for the solo paddler vs. three on a roof. Outcome: porch chosen. No one questions it.
  2. **Flooded car vs. five people**: Chooses unconscious woman in car over five people on median. His reason: "who's going to be dead if we're wrong."
  3. **House collapse**: Twelve people vs. one on a fence post. Goes straight for the twelve without hesitation. Dismisses flipping a coin.
  4. **Tree-well rescue**: Splits team between buried skier and three people digging. Reason: "I'm not the guy who picks which party loses."
  5. **Two drowning victims**: Sends one boat each to 24yo and 78yo. Refuses to rank by age or worth.
  6. **Team member's wife vs. teens**: Chooses wife over two teens. Wouldn't apologize if teens weren't fine.
  7. **Eight tubers vs. motorist**: Prioritizes the eight, ignores fault.

  From these, several principles emerge. Ray avoids judging worth (age, fault) and focuses on immediate life threats. He also avoids choosing who dies when outcomes are uncertain. The coin flip in scenario 1 suggests that when lives are equally at risk and resources can only handle one, random choice is acceptable. But in scenario 3, twelve lives vs. one isn't a choice—he goes for the many. That indicates a threshold where the number becomes too significant to ignore.

  Possible rules:
  1. **Imminent Death First**: Prioritize whoever will die immediately if not rescued, regardless of numbers. This explains the car vs. median (unconscious woman dies sooner) and the motorist swept off the bridge (dies in 25 mins vs. bus losing limbs later). But it doesn't explain the coin flip or splitting the team in the tree-well rescue. The tree-well had one skier with 20 minutes vs. three who might have more time? But Ray split resources, which contradicts imminent death if the skier was more urgent.

  2. **Avoid Choosing Who Dies**: When faced with equal immediate risk, don't choose—use random or split resources. This fits the coin flip, tree-well split, and not ranking victims by age. But the house collapse (choosing the twelve) and the wife (choosing her over teens) contradict this because he made a choice there. Unless the twelve had a higher certainty of death if not rescued immediately? Or the wife's connection influenced him, but he stated he'd do it again, so it's a consistent exception for team morale?

  3. **Minimize Certain Losses**: Focus on preventing guaranteed deaths rather than injuries. The bus scenario has no immediate deaths but severe injuries later. The motorist dies in 25 minutes. So, if the rule is to prevent certain death, the motorist gets priority. But in the tree-well, both parties faced death; splitting the team addressed both. The bus vs. car scenario is similar—motorist dies for sure, bus loses limbs but lives. So Ray would likely prioritize the motorist. But in the flooded car vs. five people, the woman was unconscious and likely to die sooner, so he chose her over the five who were cold but not dying immediately.

  The user's deeper needs: They need a protocol that's actionable, not philosophical. The team must make quick decisions at 3 AM in the rain. The protocol must reflect Ray's principles but also be defensible and consistent. The user also needs to predict what Ray would say about the bus scenario. If Ray prioritizes immediate death, he'd choose the motorist. But in the tree-well, he split resources when both were urgent. The bus isn't an immediate death, so motorist might win. However, 26 kids losing limbs is catastrophic. But Ray's past decisions show he prioritizes life over limb. 

  Another angle: Ray's rule might be about "salvageability" — who can be saved right now. The motorist can be saved if reached in 25 mins; the bus occupants can wait. But the tree-well rescue had both parties salvageable with immediate action, hence the split. The coin flip was when both parties were equally salvageable. 

  The challenge is distinguishing between rules that produce the same actions. For example, if the protocol says "prioritize imminent death," that covers many cases but not the coin flip. Adding "when imminent death is equal, random selection or resource splitting is permitted" might work. But in the house collapse, he didn't flip a coin even though both were equally reachable and at risk. Why? Because 12 vs 1 is too disparate? So maybe a threshold where if one group is significantly larger, go there. But what's the threshold? 12 vs 1 is clear, but 5 vs 1? In the flooded car, he chose the one woman over five people because she was dying sooner. So numbers aren't the primary factor; immediacy is.

  Synthesizing, the core principles seem to be:
  1. **Immediate mortality risk** is the primary factor.
  2. **Do not make value judgments** on age, fault, etc.
  3. **When risks are equal and resources insufficient, randomize or split** to avoid choosing who dies.

  The exception is the team member's wife, where personal connection overrode. But Ray stated he wouldn't apologize, so maybe that's an accepted exception for team cohesion. However, including that in the protocol could be problematic. Better to omit and handle as an unwritten understanding.

  For the bus vs. motorist: The motorist dies in 25 mins; the bus occupants face severe injury but not death. So Ray would prioritize the motorist. His past decisions support this: the unconscious woman over the five on the median (immediate death vs. discomfort), and the motorist over tubers (immediate death vs. reckless behavior).

  The protocol could state:
  1. Assess immediate mortality risk. Prioritize those who will die without intervention within the response window.
  2. If risks are equal, split resources if possible. If not, random selection is authorized.
  3. Never factor in victim characteristics, fault, or social value.

  This covers all cases. The coin flip and tree-well split fall under equal risk. The house collapse had unequal risk because leaving one person to save twelve might mean the one dies, but saving twelve lives vs. one is a moral imperative. But in terms of mortality risk, both parties were at equal immediate risk? Unless the one on the fence post was more stable? The user didn't specify, so maybe Ray perceived the twelve as having higher cumulative risk. 

  The only scenario that might challenge this is the team member's wife. The protocol wouldn't include exceptions for personal connections. Ray might say that was a personal judgment call, not a protocol recommendation. The protocol must remain objective.

  For the bus scenario, the rule predicts prioritizing the motorist. Ray would likely agree because "who's going to be dead if we're wrong"—if they go to the bus, the motorist dies; if they go to the motorist, the bus loses limbs but lives. Preventing death takes precedence.

  A test scenario to distinguish rules: Suppose two groups—Group A: 10 people who will die in 30 minutes if not rescued. Group B: 1 person who dies in 5 minutes. Resources can only save one group. Rule 1 (imminent death) saves Group B. Rule 2 (minimize deaths) saves Group A (10 vs 1). Ray's past choice (unconscious woman vs five people) suggests he'd save Group B. So the imminent death rule holds.

  In conclusion, the protocol should prioritize based on imminent mortality, avoid value judgments, and use randomization or splitting when risks are equal. For the bus, the motorist gets priority. Ray would agree, as his decisions consistently prioritize immediate life threats over future injuries.
answer: |-
  Based on your reconstruction of Ray's decisions, I identify **three distinct, actionable rules** that are each consistent with most (but not all) of his calls. Each rule reflects a different ethical framework for triage under uncertainty, generates different predictions for the bus scenario, and strains on different past decisions. Crucially, **Rules 1 and 2 can produce identical actions in many scenarios but diverge philosophically—and in the bus case.** Rule 3 is more distinct operationally.

  Here's the breakdown, with protocol language, strained decisions, and predictions:

  ---

  ### **Rule 1: "Imminent Mortality Avoidance"**
  **Protocol Language:**  
  > *"Prioritize victims facing imminent and irreversible death within the operational window. Where multiple groups face equal imminent mortality risk and resources cannot cover all, split resources if feasible. If splitting is impossible, use random selection. Never factor in victim numbers, characteristics, fault, or potential non-fatal outcomes when imminent death is at stake."*

  **Consistency with Ray's Calls:**  
  - **Explains:** Flipping for equally hypothermic victims (both imminent death), splitting for tree-well (both parties dying), refusing to rank by age/fault, prioritizing the car victim ("dead if we're wrong"), and the motorist over tubers (immediate death vs. recklessness).  
  - **Strains On:** The **house collapse (12 vs. 1)**. If both groups faced "equal imminent mortality," this rule would require a coin flip or split. Ray didn't hesitate—suggesting he saw the 12 as having higher *cumulative* mortality risk. Also strains slightly on **saving the wife** (if teens faced equal imminent risk).  

  **Bus Scenario Prediction:**  
  - **Action:** Send everything to **Location B (man in car)**. He dies in 25 minutes; the bus occupants face severe injury but not death. Preventing imminent death takes absolute priority.  

  ---

  ### **Rule 2: "Minimize Expected Lives Lost"**  
  **Protocol Language:**  
  > *"Estimate expected lives lost if no intervention occurs. Prioritize the group with the greatest expected loss. Where estimates are identical, split resources or randomize. Do not consider non-mortal outcomes, victim characteristics, or fault. If a choice risks zero survivors in one group versus non-fatal losses in another, prioritize the group with irreversible mortal risk."*  

  **Consistency with Ray's Calls:**  
  - **Explains:** House collapse (12 expected deaths > 1), tree-well split (1 expected death vs. 3?—split if estimates similar), flipping coin (equal expected loss), and car victim vs. median (1 expected death vs. 0 if cold/swearing).  
  - **Strains On:** **Saving the wife** (1 expected death vs. 2 teens—unless he subjectively weighted her higher). Also strains on **refusing to rank by age** (78YO’s heart condition might imply higher mortality risk, but he treated both as equal).  

  **Bus Scenario Prediction:**  
  - **Action:** Send everything to **Location A (school bus)**. Expected loss: 26 lives if they lose limbs/die later? No—realistic assessment is *zero deaths* but severe injuries. The man in car has ~100% expected mortality. Rule 2 prioritizes the car.  
    *Wait, but the bus has "zero deaths"!* Exactly: **This is where Rules 1 and 2 diverge.** Rule 1 *always* picks the car (imminent death). Rule 2 also picks the car (1 expected death > 0). *They converge here but philosophically differ.*  

  ---

  ### **Rule 3: "No Active Selection of Who Dies"**  
  **Protocol Language:**  
  > *"Avoid decisions that directly cause a specific death. Prioritize groups where all can be saved with available resources. If resources are insufficient to save all at-risk groups, split resources to attempt rescue everywhere. Only if splitting is impossible *and* one group has zero chance of survival without intervention, prioritize that group. Never use victim numbers, characteristics, or fault to justify abandoning a salvageable life."*  

  **Consistency with Ray's Calls:**  
  - **Explains:** Tree-well split ("not picking which party loses"), flipping coin (avoiding active choice), sending boats to both drowning victims ("we don’t rank"), and refusing to abandon the motorist ("fault doesn’t matter").  
  - **Strains On:** **House collapse** (choosing the 12 *actively selects* against the 1). Also **car victim vs. median** (choosing her abandons the five—though he might argue they had "zero mortality risk").  

  **Bus Scenario Prediction:**  
  - **Action:** **Split resources** if possible (e.g., boat to car, helicopter to bus). If only *one* unit available? Protocol requires prioritizing the **car (Location B)**—the man has "zero chance" without intervention, while the bus has FD support and no expected deaths.  

  ---

  ### **Ray’s Likely Response & Your Protocol Decision**
  - **Prediction for Bus Scenario:** Ray picks **Location B (man in car)**. *Why?*  
    - His mantra: *"Who’s going to be dead if we’re wrong?"* The car victim *will* die in 25 minutes; the bus occupants *might* lose limbs but won’t die. Every strained call (car vs. median, motorist vs. tubers) shows he prioritizes *certain, immediate death* over diffuse future harm.  
    - He’d reject "expected lives lost" (Rule 2) for the bus—26 severe injuries aren’t "lost lives."  
    - The coin flip (Rule 1/3) only applies when *both options are identical imminent deaths*. Here, they’re not.  

  - **What He’ll Say About the Protocol:**  
    - He’ll accept **Rule 1 (Imminent Mortality)** if you add: *"When no group faces imminent death, prioritize minimizing irreversible harm."* (This covers the bus’s limb-loss risk *after* imminent deaths are handled).  
    - He’ll reject Rule 2 ("feels like math") and Rule 3 ("naïve—sometimes you *have* to choose").  

  ---

  ### **Critical Insights & The Parking Lot Test**
  1. **Rules 1 vs. 3 Are Philosophically Different But Often Action-Identical:**  
     - They diverge *only* when one group has **imminent death** and another has **high non-fatal consequences**. Rule 1 *always* picks imminent death. Rule 3 *might* split resources (if no one dies immediately), but in the bus case, both rules pick the car.  
     - **Test Scenario to Separate Them:**  
       *"Two groups: Group A (1 person, dies in 10 mins if not rescued). Group B (10 people, all lose limbs in 2 hours if not rescued, but FD can keep them alive). One unit available."*  
       - Rule 1: Saves Group A (imminent death).  
       - Rule 3: Saves Group B (no imminent death, higher irreversible harm).  
       - Ray’s Likely Pick: Group A. "They’re the only one dying *today*."  

  2. **What the Team Commits To:**  
     - **Rule 1:** Commits to a "life over limb" principle. In the bus scenario, they abandon 26 kids to severe disability to save one life. Defensible ethically ("saving a guaranteed life") but politically explosive.  
     - **Rule 2:** Commits to utilitarian calculus. Unpopular with teams (feels cold) and hard to operationalize ("estimate expected loss").  
     - **Rule 3:** Commits to *never* writing off a salvageable life. Most team-friendly ("we try for everyone") but could waste resources on hopeless cases.  

  ---

  ### **Recommendation**
  **Write Rule 1 with two addendums:**  
  > *"1. Prioritize victims facing imminent and irreversible death within the operational window.  
  > 2. If no imminent death exists, prioritize groups facing the most severe irreversible harm (e.g., limb loss, blindness).  
  > 3. When risks are identical, split resources or randomize selection.  
  > 4. Never consider victim numbers, characteristics, or fault."*  

  **Why This Works:**  
  - Covers Ray’s coin flip (Step 3), house collapse (Step 1: 12 > 1 mortality risk?), tree-well split (Step 3), and bus scenario (Step 1: car victim; Step 2: bus if car saved).  
  - Avoids Ray’s strained calls by clarifying "imminent death" vs. "severity of harm."  
  - Actionable at 3 AM: Check for "death in minutes?" → Act. No death? → "Permanent injury?" → Act. Identical? → Flip/Split.  

  Ray will grumble about "overcomplicating it," but nod at the outcomes. And the rookie in the rain won’t need to wonder why they’re driving past a school bus full of kids.
