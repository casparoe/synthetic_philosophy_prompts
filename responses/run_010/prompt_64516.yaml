  By the law of total expectation, the expected utility of deciding now (if we let a* be the act chosen now) is E[u(a*, s)] = sum_i P(E_i) * E[u(a*, s) | E_i]. But note that for each i, E[u(a*, s) | E_i] <= max_{a} E[u(a, s) | E_i]. Therefore, the expected utility of deciding now is <= the expected utility of observing first.

