prompt: |-
  I cover science and ideas for a weekly magazine — philosophy, psych, the occasional behavioural-economics dust-up. Working on a piece about the "can someone be too good?" argument, the one that runs: a person really devoted to doing good would end up a bore who's given away everything that made a life worth living. Nearly everyone I've interviewed on that side of it makes the same move, and I cant find a name for it, which is driving me nuts.

  The move: asked why a life spent mostly making strangers better off would be a worse life, they point at one specific non-moral thing of their own. The novel they've been failing to write for nine years. The garden. A Sunday long run with two friends. And they say it in a precious register — that's what makes the life mine, take it away and there's nothing left to be good *for*.

  Then two things happen. First, the same people give up the exact same thing for a promotion, or a move for a partner's job, or a book deal with a hard deadline, and nobody — not them, not me — reaches for the "my life would be less worth living" line. It gets traded, quietly, for money and status all the time. Second, if you offer to just pay for it (a funded year off to write the novel, so the moral demand is off the table), most of them take the money and *still* say the demand was unreasonable.

  And you never get a number. Ask what the novel is worth against, say, restoring sight to a few hundred people, and the question gets waved off as a category mistake, treated as a profound point rather than a convenient one — even though the claim being defended is flatly comparative: more of this, less of that, worse life overall.

  So: is there an established concept for a value that gets invoked only against moral demands and never against prudential ones, is never priced, and survives being paid for? I know it's adjacent to the whole is-morality-too-demanding debate, but that's about the demand; this is about the shield. It's also not quite sour grapes — nothing's been taken away from them — and not quite ordinary rationalisation, since they aren't lying, and would be horrified to be caught treating the novel as a bargaining chip.

  Give me a committed answer, not a menu. Tell me the two or three nearest existing concepts and exactly where my description stops matching each, then say which one I should use in print. If nothing fits, coin one, give me a definition short enough to survive editing, and give me the boundary cases — what sits just above and just below the line, so I know when *not* to reach for it. A name I can't define is useless to me.
reasoning: |-
  Okay, the user writes for a science and ideas magazine, focusing on philosophy and psychology. They're working on a piece about whether someone can be "too good," specifically addressing the argument that extreme altruism makes life boring and strips away personal joys. The user has noticed a pattern in interviews: people defend personal projects (like writing a novel) as essential to their identity when faced with moral demands but readily sacrifice these for career or status gains without similar complaints. 

  The user is frustrated because this defensive move lacks a name, and they need a precise term for their article. They describe three key features: the value is only invoked against moral demands, never quantified, and persists even when compensated. Existing concepts like "demandingness objection" or "sour grapes" don't fit perfectly. 

  First, I consider existing terms. The demandingness objection focuses on morality's burden, but the user's interest is the *shield*—how personal projects become untouchable only in ethical contexts. Nonfungible goods are unique but can still be traded (e.g., heirlooms for cash), unlike these projects. Sacred values resist trade-offs but usually apply to moral/religious ideals (e.g., not selling a child), not personal hobbies. 

  The core issue is asymmetrical protection: the novel is suddenly priceless when ethics asks for sacrifice but becomes negotiable for promotions. This isn't hypocrisy; the person genuinely feels the value but inconsistently applies its "sacredness." 

  Existing terms fall short. "Special pleading" is too broad. "Moral licensing" is about offsetting guilt, not shielding non-moral goods. So, I lean toward coining a term. "Moral-exemption value" captures the asymmetry—the value exempts itself only from moral claims. Alternatively, "asymmetrically sacred value" emphasizes the inconsistent sacredness. 

  I sketch the boundaries: Above the line—projects genuinely treated as non-negotiable (e.g., an artist refusing all commercial deals). Below—things traded freely (e.g., skipping yoga for a bonus). The term must fit cases where compensation fails (funded sabbatical rejected as insufficient) and highlight the category error when quantification is avoided. 

  For the user's article, "moral-exemption value" is punchy and self-explanatory. It centers the inconsistency they observed. I’ll define it tightly and contrast it with near misses so they can apply it confidently.
answer: |-
  Here's a committed answer, dissecting the core issue and providing a precise conceptual tool:

  1.  **The Nearest Existing Concepts & Where They Fall Short:**
      *   **The Demandingness Objection (in Ethics):** This *is* the broader debate ("is morality too demanding?"). **Shortfall:** It focuses on the *burden* morality imposes. Your observation targets the *specific defensive shield* used – the invocation of a non-moral, non-fungible, identity-conferring personal good *only* when morality knocks. It's about the *nature* of the counter-argument, not the demand itself.
      *   **Nonfungible Goods:** These are unique items or experiences that can't be easily replaced (like a family heirloom, a specific friendship). **Shortfall:** While the novel/garden/ritual *is* nonfungible to the person, the key observation is the *asymmetry*: they *do* implicitly "trade" it (for promotion, partner's move) in prudential contexts. Its "nonfungibility" mysteriously evaporates outside the moral domain. True nonfungible goods resist trade *generally*.
      *   **Sacred Values (Psychology/Anthropology):** Values treated as inviolable, absolute, not subject to cost-benefit analysis (e.g., refusing to sell a child, fundamental rights). **Shortfall:** Sacred values are typically *moral* or *religious* in nature (dignity, purity, loyalty). The shield here is specifically a *non-moral* good (novel-writing, gardening) elevated to sacred status *only* when defending against a *moral* demand. It's "sacralized" situationally, not inherently. Its survival after being paid for also contradicts the absolute resistance to trade inherent in sacred values.

  2.  **The Recommended Concept for Print: Coined Term - Moral-Exemption Value (MEV)**

      *   **Definition:** A *Moral-Exemption Value* is a personal, non-moral good (activity, project, possession, relationship facet) that an individual selectively invokes as an absolute, non-negotiable, identity-constituting justification *only* when resisting perceived moral demands to sacrifice it for the greater good, despite readily trading it for comparable or lesser prudential gains (money, status, convenience) in non-moral contexts, and despite its purported value persisting even when compensation for the sacrifice is offered.

  3.  **Boundary Cases (Knowing When *Not* to Use It):**
      *   **Just Above the Line (True MEV):** The novelist who passionately defends their unfinished work as "what makes life *mine*" against donating time/money to charity, but readily abandons it for 6 months for a lucrative consulting gig, *and* who, when offered a grant to finish the novel freeing them to donate, still claims the original demand was unreasonable ("It wouldn't be *mine* anymore!") while taking the grant.
      *   **Just Below the Line (Not MEV):**
          *   **Consistent Non-Negotiation:** The artist who genuinely *never* trades their core creative time for money or status, viewing it as sacred *everywhere*. This lacks the *asymmetry* crucial to MEV.
          *   **Prudential Trade-Off with Explicit Cost:** The runner who says, "Missing Sunday runs for a promotion *does* make my life worse; it's a real sacrifice, but the money/security is worth it *this time*." Here, the value *is* acknowledged as fungible and priced (implicitly), even if painfully. MEV refuses pricing *and* denies fungibility in the moral context.
          *   **Moral Licensing:** Taking the grant *and then happily donating more*, feeling the grant "frees" them morally. MEV involves *persisting resistance* even after compensation.
          *   **True Sour Grapes:** Dismissing the value of the novel *only after* definitively failing to write it or being forced to abandon it ("It wasn't that important anyway"). MEV involves *asserting* the value passionately *as* the shield.

  **Why "Moral-Exemption Value" works for your piece:**

  1.  **Precision:** It names the *asymmetry* (moral vs. prudential) and the *function* (exemption) directly.
  2.  **Captures the Core:** It incorporates the key features: non-moral good, invoked solely against moral demands, non-negotiable *only* in that context, survives compensation, resists quantification.
  3.  **Avoids Existing Baggage:** It doesn't get confused with "sacred values" (usually moral) or "nonfungible goods" (usually consistently treated as such).
  4.  **Survives Editing:** "Moral-exemption value" (MEV) is concise and self-explanatory in context. You can easily define it briefly: *"...a concept I'm calling 'moral-exemption value' – a cherished personal pursuit that suddenly becomes utterly non-negotiable when morality asks for sacrifice, yet gets readily traded for other gains the rest of the time."*
  5.  **Highlights the Paradox:** The name itself points to the inconsistency you observed – why does this value demand an *exemption* specifically from morality, but not from life's other pressures?

  **Use "moral-exemption value" in your piece.** It precisely labels the rhetorical shield you've identified, separating it clearly from the broader demandingness debate while highlighting its unique, contradictory logic. It gives you and your readers the conceptual tool to dissect this common, frustrating move.
