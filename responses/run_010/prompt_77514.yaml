prompt: |-
  You are a professional philosopher with specialist expertise in meta-ethics and the philosophy of language. Please think this through carefully before answering, and begin by mapping out the space of possible diagnoses rather than reaching for the first error you find; a good response will have to weigh several plausible premises against one another.

  A colleague has been pressing the following argument against expressivism. What disquiets me is not its conclusion but the fact that it seems to prove far more than that conclusion.

  (1) If a sentence has a meaning, that meaning fixes what the sentence contributes to every larger sentence in which it can occur.
  (2) "Lying is wrong" can occur unasserted, as the antecedent of "If lying is wrong, then getting your little brother to lie is wrong."
  (3) That conditional is valid, and it is valid in virtue of the antecedent contributing exactly what "Lying is wrong" contributes when it is asserted.
  (4) Nothing that is itself an act, or the expression of an attitude, can make that same contribution, since acts and attitudes are things agents perform and have, not things that can sit unasserted inside a conditional.
  (5) So the meaning of "Lying is wrong" is not the expression of an attitude but a content that is either true or false.
  (6) Nothing in the reasoning is special to morality: any embeddable sentence of English is thereby truth-apt, and truth-aptness just is what it takes for a sentence to represent how things stand.

  My worry concerns (6). It appears to foreclose non-truth-conditional treatments of embeddable sentences across the board — epistemic "might," predicates of taste, probability claims — and it appears to make whether a stretch of discourse is descriptive a matter of its syntax, which on its face would hand the expressivist truth-aptness for free. So either the argument breaks somewhere earlier than I can locate, or it goes through and establishes something nobody should want established.

  Which step do you reject, and what made it look innocent? Then price the alternatives: what does each of (1), (3), and (4) cost an expressivist who gives it up, given the strategies actually on offer — plan-laden normative contents, relational accounts of the state expressed, hybrid semantics? For what it is worth, I would most like to keep (2) and (3). Finally, suppose the expressivist simply accepts (5) at the thin, syntactic level: state what substantive disagreement with the cognitivist is left over, and whether the argument should then be counted as a success or a miss.
reasoning: |-
  Okay, I need to carefully analyze this meta-ethical argument against expressivism. The user presents a colleague's argument that seems to undermine expressivism by generalizing to all embeddable sentences. My task is to identify which premise to reject, examine the costs for expressivism, and assess what remains of the substantive disagreement if expressivism accepts truth-apt syntax.

  First, I'll map the entire argument structure: Premise (1) is compositionality - meaning must project uniformly across embeddings. (2) notes the unasserted occurrence of moral sentences in conditionals. (3) claims conditionals are valid due to identical contribution by asserted/unasserted antecedents. (4) argues attitudes can't play this role since they're performative. (5) concludes moral sentences must represent truth-apt contents. (6) generalizes this to all embeddable discourse.

  The user's concern is that (6) overgeneralizes, making truth-aptness purely syntactic and dismantling non-cognitivist approaches universally. This would ironically give expressivists truth-aptness "for free" while destroying their core project. The key tension is between maintaining compositionality and allowing non-representational meanings.

  Now evaluating premises: (2) is uncontroversial - moral sentences do embed. (3) seems plausible for logic. (4) is where expressivists typically push back, but I need to see why it appears valid. The intuition is that unasserted components can't be performing speech acts - they're just "there" semantically. This conflates force with content.

  The critical flaw is actually in (1) - the strong compositionality requirement. It assumes meanings must be propositional contents that combine truth-conditionally. But expressivists like Gibbard develop compositional systems where non-representational elements project systematically. For example, in "If lying is wrong, telling him to lie is wrong", the antecedent expresses a conditional planning state that licenses the inference without representing truth.

  Why does (1) seem innocent? Because in descriptive language, compositionality operates truth-conditionally. But this begs the question against expressivism by assuming all meaning must work this way. The appearance of innocence comes from overlooking that compositionality is a formal constraint that can be satisfied differently.

  Now pricing alternatives: If expressivists reject (1), they must build complex semantic frameworks showing how attitudes compose - Gibbard's planning semantics does this, but it's technically demanding and may lose some intuitive transparency. Rejecting (3) would require denying obvious logical truths - too costly. Rejecting (4) means explaining how attitudes can "sit" in embeddings - Blackburn's quasi-realism attempts this through higher-order attitudes, but faces the Frege-Geach problem head-on.

  If expressivists accept (5) syntactically ("thin truth-aptness"), the substantive disagreement shifts to: What makes moral judgments distinct? Cognitivists see them as representing moral facts, while expressivists see them as practical commitments dressed in truth-talk. The argument then becomes a pyrrhic victory - it secures syntax but leaves the core metaphysical disagreement intact. Expressivists could still argue that moral "truth" is merely a useful fiction for reasoning.

  Ultimately, I'll recommend rejecting (1)'s strong compositionality assumption as question-begging. The argument overreaches by ignoring sophisticated expressivist semantics. While requiring technical work from expressivists, it doesn't defeat their position when properly developed. The thin truth-aptness move preserves the deeper disagreement about the nature of moral properties.
answer: |-
  I share your concern: this argument, if sound, would indeed collapse all non-representational discourse into truth-aptness, making expressivism about morality (and analogous views elsewhere) impossible. It's a sophisticated version of the Frege-Geach problem with radical implications. After mapping the space, I locate the critical flaw in **premise (1)**, though its innocence deserves explanation. I'll diagnose step-by-step, price the alternatives, and address the "thin truth-aptness" scenario.

  ### Mapping the Space & Diagnosing the Flaw
  The core tension is between compositionality (how parts contribute to wholes) and non-representational meaning. The argument hinges on premises (1), (3), and (4) jointly demanding that the *semantic value* of the embedded antecedent must be identical to its value when asserted and cannot be an attitude. Premise (6) generalizes this, threatening all non-representational discourses. Here's the breakdown:

  1.  **Premise (1) (Compositionality Constraint):** "If a sentence has a meaning, that meaning fixes what the sentence contributes to every larger sentence in which it can occur." This seems like basic semantic hygiene – meanings should compose systematically. **Why it looks innocent:** It mirrors how truth-conditional semantics works for descriptive language ("snow" contributes whiteness/property of being white wherever it appears). Rejecting it seems to court semantic chaos.

  2.  **Premise (2) (Embeddability):** Uncontroversial. Moral sentences embed grammatically.

  3.  **Premise (3) (Validity & Uniform Contribution):** The conditional is valid *because* the antecedent contributes the *same thing* in the conditional as it does when asserted. **Why it looks innocent:** Logic requires consistency. If "lying is wrong" meant something different inside the conditional, the validity (which seems obvious) would be inexplicable.

  4.  **Premise (4) (Act/Attitude Exclusion):** Acts/attitudes (like expressing disapproval) cannot be the thing contributed, as they can't "sit unasserted." **Why it looks innocent:** It captures an intuition: When I *say* "If lying is wrong...", I'm not *performing* the act of condemning lying at that moment; I'm merely considering it hypothetically. Performances are ephemeral events tied to utterance acts, not abstract contents.

  5.  **Premise (5) (Conclusion for Morality):** Follows from (1)-(4) if sound.

  6.  **Premise (6) (Generalization):** If (1)-(5) hold for "lying is wrong," they hold for any grammatically embeddable sentence.

  **The Flaw: Premise (1) is too strong and question-begging.** It assumes that the *only* thing a sentence can "contribute" to a larger sentence is a *propositional content* (a truth-condition bearer). This smuggles in cognitivism. Expressivism rejects this. For the expressivist, the "meaning" or "semantic value" of "Lying is wrong" is *not* a proposition but a *type of mental state* (e.g., a plan, norm-acceptance, disapproval) or a *function* from contexts to such states. Crucially, expressivists like Allan Gibbard (in *Thinking How to Live*) and Simon Blackburn (in *Spreading the Word*) develop sophisticated compositional semantics where these non-propositional semantic values *do* project systematically in embeddings like conditionals, generating valid inferences without the embedded clause contributing a truth-condition.

  *   **Why (1) looks innocent:** In purely descriptive discourse, compositionality *is* satisfied by uniform truth-conditional content. The premise feels like a neutral constraint. However, it prejudges the *nature* of meaning by assuming the contribution *must* be truth-conditional content. It conflates a *formal requirement* (systematic projection) with a *specific implementation* (propositional content).

  *   **Why rejecting (1) saves (6):** If the semantic value isn't inherently truth-conditional but is a different kind of entity that *can* compose systematically (like a plan-laden content or a function generating attitudes), then non-representational discourses can satisfy compositionality and logic without being truth-apt. The generalization in (6) is blocked because the "contribution" isn't truth-apt content.

  ### Pricing the Alternatives for the Expressivist
  Suppose an expressivist tries to salvage the argument by rejecting a different premise. The costs are high:

  1.  **Reject Premise (3) (Validity & Uniform Contribution):**
      *   **Cost:** This is devastating. Denying that the conditional is valid, or denying that the antecedent contributes the *same* semantic value uniformly, makes logic for moral discourse impossible or mysterious. It surrenders core normative reasoning to chaos. Expressivists like Gibbard explicitly build their systems to *vindicate* such inferences (e.g., modus ponens) precisely to avoid this cost. Giving up (3) makes expressivism logically impotent.

  2.  **Reject Premise (4) (Act/Attitude Exclusion):**
      *   **Cost:** This requires explaining *how* an attitude or act can "sit unasserted" inside a conditional. Simple versions of expressivism (e.g., Ayer's emotivism) fail here spectacularly. More sophisticated strategies exist:
          *   **Higher-order attitudes (Blackburn):** In "If lying is wrong...", I express a *higher-order* attitude (e.g., disapproval of *not* disapproving of lying in situations where I *do* disapprove of getting little brothers to lie). This preserves the "act" nature but becomes complex and faces challenges explaining the intuitive *content*-driven validity.
          *   **Relational Accounts (Schroeder):** The attitude expressed by the whole sentence is a function of the attitudes expressed by the parts in a specific relational way (e.g., *being for* blaming for lying *implies being for* blaming for getting little brothers to lie). This maintains an attitude-based semantics but requires significant technical machinery.
      *   **Overall Cost:** While viable paths exist (Gibbard's planning semantics effectively does this by making the semantic value non-act-like), rejecting (4) often involves complex, non-intuitive semantics that can feel like a retreat from core expressivist motivations. It risks making the "attitude" so abstract it loses its connection to motivation and action-guidingness.

  **Verdict on Alternatives:** Rejecting (1) is the *least* costly path for the expressivist. It allows them to maintain the validity of logic (saving (3)), acknowledge the difference between asserted and unasserted contexts without denying their core thesis (mitigating the force of (4)), and develop a systematic, compositional non-representational semantics (blocking (6)). The cost is developing and defending that complex semantics against charges of ad-hocness or losing the intuitive connection to "expression."

  ### Accepting (5) at the Syntactic Level: Thin Truth-Aptness
  Suppose the expressivist concedes (5): "The meaning of 'Lying is wrong' is... a content that is either true or false" – but interprets this *thinly*, as merely a feature of grammatical syntax and logical role within inferences ("syntactic truth-aptness" or "minimal truth"). This aligns with Blackburn's quasi-realism or Gibbard's later work.

  *   **Substantive Disagreement Left Over:** Almost *everything* important remains contested:
      1.  **Metaphysical Grounding:** The cognitivist claims moral truths are made true by mind-independent facts or stance-independent properties. The expressivist (even accepting syntactic truth-aptness) claims moral "truth" is a projection of our conative states (plans, commitments, sentiments) onto the world. Moral judgments track our practical commitments, not external facts.
      2.  **Epistemology:** The cognitivist needs an account of how we access moral truths (intuition, reason, perception). The expressivist sees moral "knowledge" as a matter of achieving coherent, rational planning or sentiment.
      3.  **Motivational Internalism:** The expressivist typically holds that sincerely judging "X is wrong" entails *some* motivation to avoid X (modulo weakness of will). The cognitivist denies this necessary connection.
      4.  **Nature of Moral Properties/Concepts:** The cognitivist sees moral properties as robust features of reality. The expressivist sees moral concepts as essentially practical, action-guiding concepts whose primary function is expression/planning, not description.
      5.  **The "Magnetism" of the Moral:** Why does morality *demand* our attention? Expressivism answers: because it expresses our deepest practical commitments. Cognitivism answers: because it describes objective normative facts.

  *   **Success or Miss?** The argument is a **profound miss** in its intended purpose. It aimed to prove expressivism false by showing moral sentences *must* represent truth-apt contents. If the expressivist accepts *only* a thin, syntactic notion of "truth-apt content," they have conceded the *form* but not the *substance* of cognitivism. The core expressivist theses about the *nature* and *source* of moral judgment remain intact. The argument succeeds only in forcing expressivists to adopt a quasi-realist semantics, not in refuting their core metaphysical and psychological claims about morality. It establishes a logical/syntactic point the sophisticated expressivist was already prepared to accommodate within their framework.

  **Conclusion:** The fatal flaw lies in premise (1)'s assumption that compositionality *requires* uniform propositional content. Rejecting this allows expressivism to develop compositional non-representational semantics, preserving logic and blocking the overgeneralization in (6). While complex, this is less costly than rejecting validity (3) or forcing attitudes into unasserted contexts without a compositional framework (4). If the expressivist accepts thin truth-aptness, the deep metaphysical and practical disagreements with cognitivism persist, rendering the argument ineffective as a refutation. Its main achievement is highlighting the challenge of compositionality, which modern expressivists explicitly tackle head-on.
