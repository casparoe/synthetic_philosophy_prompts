prompt: |-
  I've been trying to pin down when somebody loses the right to blame, just going off my gut on cases, and the verdicts are a mess. Here they are:

  1. My neigbour blasts music till 2am and then complains to the building about my kids running around at 7pm. I think he can't complain. Not that the complaint is false — the kids are loud — but he's out of line making it.
  2. Same neighbour, except he's actually been working on his own noise problem, put a note on the fridge, apologised to people. Now I think his complaint is fine.
  3. A friend who cheated on his wife tells me not to lie to my girlfriend about where I was last night. Fine, and useful.
  4. That same friend tells me cheating is unforgivable while still doing it. Not fine.
  5. A politician who took bribes, got caught, did the time, and now campaigns against corruption. Fine — I really like this one.
  6. A politician who took bribes, quietly paid it back, never got caught, and now campaigns against corruption. Also fine?? I want to say this is the same as 5 but something feels off and I can't say what.
  7. Me telling my brother he's throwing money away on bets when I throw the same amount away on restaurants. Fine, I think.
  8. My ex-wife telling me I was emotionally absent during the marriage, when she was too. Not fine — though I also think she's completely right about it.
  9. Someone I actually wronged blaming me for that wrong, even if they're worse than me on the same thing generally. Always fine, I think.
  10. A company's HR writing me up for padding an expense report in a firm where every executive does it. Not fine.
  11. Blaming myself: always allowed, no standing problem with self-blame ever, even for the thing I'm still doing.
  12. Asking a mutual friend to tell him because I can't face it. Fine, and I think what matters is her standing, not mine. Which is weird, because it lets me launder the exact thing I'm not allowed to do myself.
  13. A guy who worked in a slaughterhouse for ten years, went vegan, and tells me my burger is murder. Fine.

  The pair that breaks me is 5 and 6. Structurally identical — same fault, same turnaround, same message — but I want to say the caught one is legitimate and the uncaught one isn't, and I can't see why getting caught would matter morally. Also 7 against 8: both are two-guilty-people cases and I flip.

  My tentative principle, which I don't trust: you can blame someone for X only if (a) you're not currently doing X yourself without owning that, (b) you're not blaming them partly to keep attention off your own X, and (c) you've actually done something about your own X rather than just intending to.

  Does anything like this survive contact with the list? What I want: the principle, or two or three rival ones, stated precisely enough that I could apply it to a case I've never seen; each clause tied to the case that forced it in; its verdicts on cases I didn't list — like blaming someone for a fault that's literally impossible for you to commit, or a group blaming one of its own members for something the group pushed him into; and a straight answer on which of my verdicts have to go to keep the principle simple. Also: is standing a property of the person, of the act of blaming, or of the relationship between the two people? Skip the names and citations, I'm after the principle, not the literature.
reasoning: |-
  Okay, let me start by unpacking the user's query. They've listed 13 cases where they're trying to figure out when someone loses the moral standing to blame others. Their initial principle has three conditions: not currently doing the fault without owning it, not deflecting attention, and having taken action on their own fault. But their verdicts on cases 5 and 6 (politicians caught vs. uncaught) and 7 vs. 8 (self-criticism vs. ex-wife) are inconsistent, so the principle breaks there.

  First, I need to identify the core issues. The user is struggling with hypocrisy and redemption. Cases like the neighbor who reforms (2) can blame, but the one who doesn't (1) can't. The cheating friend advising against lying (3) is acceptable, but condemning cheating while still doing it (4) isn't. The politicians in 5 and 6 are tricky—both campaign against corruption, but one was caught and did time, the other wasn't. The user feels differently but can't articulate why. 

  Looking deeper, the caught politician (5) has public accountability, which might make their stance genuine. The uncaught one (6) lacks that transparency, so their blame feels insincere. That suggests that accountability and visibility matter. Also, in case 7, the user thinks self-criticism is fine even if they're still spending money, but the ex-wife in 8 blaming for emotional absence isn't acceptable. Here, the relationship context might play a role—ongoing mutual faults in a marriage vs. a brother giving advice.

  The user's tentative principle focuses on current behavior, intent, and action. But cases like 9 (someone wronged blaming) and 13 (vegan activist) show that past actions or personal change can grant standing. Also, self-blame (11) is always allowed, which makes sense because there's no hypocrisy in holding oneself accountable. 

  The challenge is reconciling the inconsistencies. Maybe the key factors are sincerity, demonstrated change, and the blamer's current relationship to the fault. For the politician cases, the uncaught one hasn't faced consequences, so their reform isn't verified, making their blame feel hollow. That's why public accountability in case 5 legitimizes their stance. 

  The user also brings up laundering blame through a third party (12), which is acceptable because the mutual friend has standing. This implies that standing is about the blamer's own integrity regarding the issue, not the original wrongdoer. 

  To build a robust principle, I need to incorporate elements like current engagement in the fault, acknowledgment of past wrongs, and tangible change. But also, the context—like whether the blamer is part of a system (HR in a corrupt company) or an individual. The HR example (10) fails because the systemic corruption undermines their authority, even if they personally aren't guilty. 

  Another angle: in group dynamics, blaming a member for something the group pushed (as mentioned in the user's additional cases) might require the blamer to have opposed the group's actions or taken steps to rectify. Standing here depends on individual responsibility versus collective guilt.

  Testing the user's tentative principle against their cases: Condition (a) fails with the vegan activist (13) who used to work in a slaughterhouse but changed. They aren't currently doing the fault, so they can blame. Condition (b) covers deflecting attention, which explains why the cheating friend (4) can't blame—they're hiding their own actions. Condition (c) requires action, which fits the reformed neighbor (2) but not the uncaught politician (6) who hasn't publicly addressed their past. 

  However, the ex-wife case (8) is tricky. Both were emotionally absent, so condition (a) might block her from blaming if she's still doing it. But the user thinks her blame isn't valid even if she's right. Here, the relationship history and mutual fault create a context where blame isn't constructive unless both have addressed their issues. 

  A better principle might focus on three elements: dissociation (not currently engaging without acknowledgment), demonstrated change (actions showing reform), and clean hands (no ongoing complicity). This covers the neighbor cases, the politicians (5 passes, 6 fails on clean hands if they're hiding their past), and the vegan activist. For self-blame, it's always allowed because dissociation and change aren't required when blaming oneself. 

  The user's verdicts that need adjustment: Case 6 (uncaught politician) should be illegitimate due to lack of transparency, aligning with their gut feeling. Case 7 (brother criticizing spending) is acceptable if the user acknowledges their own fault, making it constructive. Case 8 (ex-wife) fails because she hasn't demonstrated change, but that depends on whether she's addressed her own emotional absence. If not, her blame lacks standing. 

  Additional cases: Blaming for an impossible fault (like a blind person blaming someone for not seeing) might be acceptable because there's no hypocrisy. Group blaming a member they pushed into something would require the blamer to have opposed the group's actions to have standing. 

  In summary, standing combines personal integrity regarding the fault, the relationship context, and whether the blame serves accountability rather than deflection. The refined principles need to capture these nuances while resolving the user's inconsistencies.
answer: |-
  Here's a precise set of principles distilled from your intuitions, designed to resolve your inconsistencies while preserving key verdicts. The core idea is that **moral standing to blame requires credible dissociation from the fault.**

  ### Principles of Credible Dissociation
  **A person (Blamer) has moral standing to blame Target for fault X if and only if:**  
  1.  **Non-Engagement:** Blamer is not *currently engaging* in X (or a substantially similar fault) without acknowledging it as wrong.  
      *   *Case that forces it:* Neighbor still blasting music (1) vs. neighbor who reformed (2). Current engagement without acknowledgment destroys standing.  
  2.  **Demonstrated Separation:** Blamer has taken *meaningful, verifiable action* to distance themselves from their own past X (if applicable). This action must demonstrate rejection of X, not just intent.  
      *   *Case that forces it:* Politician who served time (5) vs. uncaught politician (6). Serving time is verifiable separation; quietly repaying bribes without disclosure isn't verifiable and may hide ongoing complicity/corruption ("something feels off").  
  3.  **Clean Motive:** Blamer's act of blaming is not *primarily motivated* by deflecting attention from their own faults (past or present) or maintaining an unjust advantage related to X.  
      *   *Case that forces it:* Friend hypocritically condemning cheating while still doing it (4) – blame serves to deflect/self-justify. Also HR (10) – systemic deflection protects executives.

  ### Resolving Your Cases & Key Inconsistencies
  *   **5 vs. 6 (Politicians):**  
      *   *5 (Caught & Did Time):* **Fine.** Verifiable separation (imprisonment) demonstrates dissociation.  
      *   *6 (Uncaught, Quiet Repay):* **Not Fine.** Lack of verifiable action fails Demonstrated Separation. Hiding past actions suggests motive to protect image/advantage (violates Clean Motive).  
      *   *Why "getting caught" matters morally:* It enables verifiable dissociation through imposed consequences. Quiet repayment avoids accountability and verification.
  *   **7 vs. 8 (Mutual Faults):**  
      *   *7 (You & Brother spending):* **Fine (if qualified).** You acknowledge your similar fault ("throwing away"), satisfying Non-Engagement *if* your acknowledgment is genuine. Blame can be constructive advice between peers ("we both do this, let's improve").  
      *   *8 (Ex-wife mutual absence):* **Not Fine.** She likely hasn't demonstrated separation from *her own* emotional absence (no mention of her work/acknowledgment). Blaming you *now* without addressing her role fails Demonstrated Separation and risks Clean Motive violation (deflecting her responsibility). *Her being "right" doesn't grant her standing to deliver the blame.*
  *   **Other Verdicts Explained:**
      *   1 (Noisy Neighbor): **No Standing** (Violates Non-Engagement).
      *   2 (Reformed Neighbor): **Standing** (Satisfies all: Non-Engagement, Demonstrated Separation via action/apology, Clean Motive assumed).
      *   3 (Cheater advises against lying): **Standing** (Non-Engagement: He's not *lying to you*; Clean Motive assumed; Demonstrated Separation not required as "lying" isn't his *specific* past fault "cheating").
      *   4 (Cheater condemns cheating): **No Standing** (Violates Non-Engagement & Clean Motive - deflection).
      *   9 (Wronged Person Blames): **Standing** (Non-Engagement: Blaming *you for wronging them* isn't the same fault; Demonstrated Separation/Clean Motive less relevant. Being "worse generally" doesn't negate standing for *this specific wrong against them*).
      *   10 (HR writes you up): **No Standing** (Violates Clean Motive - systemic deflection protecting executives; likely also Non-Engagement if HR implicitly condones executive behavior).
      *   11 (Self-Blame): **Always Allowed.** Standing is irrelevant. Self-accountability operates under different rules.
      *   12 (Ask Friend to Blame): **Fine.** Standing depends *solely* on the friend's relationship to the fault (Non-Engagement, Demonstrated Separation if needed, Clean Motive). You "laundering" it highlights standing is about the *blamer's* credibility, not the source of the message.
      *   13 (Vegan Activist): **Standing.** Satisfies Non-Engagement and Demonstrated Separation (changed job/diet). Motive assumed clean.

  ### Addressing Your Requirements
  1.  **Principle Statement:** See "Principles of Credible Dissociation" above. Precise and applicable to novel cases.
  2.  **Clauses Tied to Cases:** Explicitly shown above each principle component.
  3.  **Verdicts on Novel Cases:**
      *   **Blaming for an impossible fault (e.g., blind person blaming sighted person for not seeing):** **Standing.** Non-Engagement is inherent (they *can't* commit X). Demonstrated Separation irrelevant. Clean Motive key.
      *   **Group blaming a member for something the group pushed them into:** **No Standing (typically).** Group members likely violate:
          *   *Non-Engagement:* They are complicit *in the system* that pushed the member.
          *   *Clean Motive:* Blame likely deflects from their shared responsibility.
          *   *Demonstrated Separation:* Unlikely unless the blaming individuals actively opposed the group pressure and tried to stop it.
  4.  **Verdicts That Must Change for Consistency:**
      *   **Case 6 (Uncaught Politician):** Must change from "Fine" to **"Not Fine"**. Failure of Demonstrated Separation.
      *   **Case 7 (You & Brother):** Must be qualified. Only **Fine** if you genuinely acknowledge your *own* similar fault *in the act of blaming* (showing Non-Engagement). If you hypocritically hide your spending, **No Standing**.
      *   **Case 8 (Ex-Wife):** Your "Not Fine" verdict is **correct** under these principles (failure of Demonstrated Separation by her).
  5.  **Nature of Standing:** Standing is a **relational property contingent on the Blamer's current relationship to fault X relative to the Target and the act of blaming.** It depends on:
      *   The Blamer's *current actions* regarding X (Non-Engagement).
      *   The Blamer's *verifiable history* regarding X (Demonstrated Separation).
      *   The Blamer's *motivation* for blaming *this Target* *now* (Clean Motive).

  ### Why This Works
  *   **Resolves 5 vs. 6:** Demonstrated Separation requires *verifiable* action. Prison time is verifiable; secret repayment isn't. The "something off" is the lack of accountability and transparency, violating credibility.
  *   **Resolves 7 vs. 8:** Case 7 works if mutual acknowledgment frames it as constructive criticism among peers still struggling. Case 8 fails because the ex-wife hasn't demonstrated separation from *her specific fault in the relationship*; the act of blaming becomes hypocritical without that demonstration.
  *   **Accommodates Redemption (2, 5, 13):** Demonstrated Separation allows for reform to restore standing.
  *   **Handles Self/Third-Party (11, 12):** Self-blame is distinct. Third-party standing depends solely *on the third party's* credibility regarding X.
  *   **Captures "Clean Hands" (9, 10):** A victim blaming their wrongdoer has clean hands *regarding that specific wrong*. HR blaming within a corrupt system has dirty hands *by association/complicity*.

  This framework prioritizes the *blamer's current integrity and credibility* regarding the specific fault, making standing contingent on demonstrating genuine rejection of X through action and motive, not just past sins or good intentions.
