prompt: |-
  I'm a PhD student in statistical machine learning, working on generative models and on formalizing what it means for an observed sample to be typical. My native vocabulary is priors and likelihoods, posterior model probabilities, importance weights, reference classes, model misspecification, and the distinction between a model that predicts bad data and a model that cannot be checked at all. Please restate the Boltzmann brain problem in cosmology in that vocabulary, as literally as you can manage. Treat a cosmological theory as a generative model that emits observers along with their experiences; treat "Boltzmann brains dominate" as a claim about the observer distribution that theory induces; and render the self-sampling assumption, the appeal to typicality measures, and the inference that we must reject any theory predicting our own freakishness as claims about sampling, conditioning, and posterior odds.

  Then give me the residue report. Which steps of the argument become things I could in principle test with machinery I already use? Which translate only by equivocation, where the cosmologist's term and my term look interchangeable but are doing different work? And which have no expression whatsoever in an estimator-and-prior framework — I have in mind especially whatever is happening when a theory is discarded not for mispredicting observations but for predicting that the thing doing the predicting is unreliable.

  Finally, adjudicate a deflationary reading I find tempting: that the whole dispute is a dispute about which prior over observers to adopt, and that once that choice is made explicit there is no empirical content left to fight about. Does the translation bear that reading out, or does the residue show something in the cosmologists' objection that a prior-selection story genuinely cannot absorb? Mark every place where you are adding structure rather than carrying it across.
