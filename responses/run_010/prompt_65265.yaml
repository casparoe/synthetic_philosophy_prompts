answer: |-
  *Rapping gavel once*  
  **Ruling from the floor:** The point of order is overruled. Motion 1 validly struck XI.2. Motion 2 validly amended XI.1 to require a simple majority. The subsequent amendments adopted in March stand.  

  **To the member:** Your objection mistakes XI.2 for a magical incantation. It purported to entrench itself against repeal—but entrenchment clauses derive force solely from the Society’s *ongoing practice* of treating them as superior to ordinary bylaws. For thirty years, this body amended bylaws under XI.1 without testing XI.2’s limits. When Motion 1 passed 24–8, the membership demonstrated it no longer accepted XI.2 as a binding constraint. The vote itself *was* the rule of recognition in action: the Society recognised repeal by ordinary procedure as valid. XI.2 was not a "nullity"; it was a valid bylaw until the moment the collective practice rejected its claim to supremacy.  

  **On the March amendments:** They were adopted under a properly amended XI.1. The vote threshold had already been reduced to a majority by Motion 2. The fact that Motion 2 passed by 19–13—a simple majority, not two-thirds—is irrelevant. Once XI.2 fell, XI.1 became amendable by its own terms as modified.  

  **On your "theatre" charge:** A ruling is not a prediction. It is a declaration of the *existing practice* at the moment the point is raised. The membership’s acceptance of Motion 1 in February settled the status of XI.2: it was repealed by the only standard that matters—the Society’s actual compliance. That nineteen members may reverse my ruling on appeal doesn’t negate this; it shows the practice remains unsettled *ex post*. My duty is to interpret the current state of the rules, not capitulate to future votes. If reversed, the ruling becomes void—but it remains a snapshot of the practice *as I discern it now*. Hart’s "internal aspect" demands this: even if transient, the ruling affirms that our procedures are rules, not habits. To collapse that into forecasting votes is to abandon law for augury.  

  *Adjusts spectacles*  
  Now—since you’ve baited me about precedent: was there a prior instance where this Society amended a bylaw despite an entrenchment clause? I suspect you’re holding back 1995’s "Corbett Affair." If so, cite it. I stand ready.
