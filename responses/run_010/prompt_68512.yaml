  - If Bag 1 is B: then P(red)=1 if it is all red (which has probability q) and 0 if all blue (probability 1-q). So the probability of red given Bag 1 is B is either 0 or 1, but we take expectation: it's q if we are to assign a probability, but actually, the event is uncertain.

  Actually, the probability for the event "the next chip from Bag 1 is red" is a random variable that depends on the type and the composition.

  For a fixed q, the prior probability for the event is:
  P(red) = P(red|Bag1=A)P(Bag1=A) + P(red|Bag1=B)P(Bag1=B) = 0.5*0.5 + [q*1 + (1-q)*0]*0.5 = 0.25 + 0.5q.

  After observing blue from Bag 2, we update the probabilities of the types.

  For a fixed q, we update the probability that Bag 1 is A or B.

  Let D be the event: blue from Bag 2.

  P(D) = 0.5(1-q) + 0.25 = 0.75 - 0.5q.

  Now, P(Bag1=A and D) = P(Bag1=A) * P(D|Bag1=A) = 0.5 * (1-q)   [because when Bag1=A, Bag2 is B, and then P(blue|Bag2=B)=1-q]

  P(Bag1=B and D) = P(Bag1=B) * P(D|Bag1=B) = 0.5 * 0.5 = 0.25

  Therefore, the posterior probability that Bag1 is A:

  P(Bag1=A|D) = [0.5(1-q)] / [0.75 - 0.5q]

  Similarly, P(Bag1=B|D) = 0.25 / [0.75 - 0.5q] = 0.5 / (1.5 - q)   [by dividing numerator and denominator by 0.5]

  Now, the posterior probability that a chip from Bag 1 is red is:

  P(red|D) = P(red|Bag1=A, D) * P(Bag1=A|D) + P(red|Bag1=B, D) * P(Bag1=B|D)

  But given the type, the probability of red is independent of D. So:

  P(red|D) = 0.5 * P(Bag1=A|D) + [q * 1 + (1-q)*0] * P(Bag1=B|D)
            = 0.5 * P(Bag1=A|D) + q * P(Bag1=B|D)

  Substituting:

  = 0.5 * [0.5(1-q)]/[0.75-0.5q] + q * [0.25]/[0.75-0.5q]

  = [0.25(1-q) + 0.25q] / [0.75-0.5q]
  = [0.25 - 0.25q + 0.25q] / [0.75-0.5q]
  = 0.25 / [0.75-0.5q]
  = 0.25 / [0.25(3 - 2q)] 
  = 1 / (3 - 2q)

  So the posterior probability for the event is 1/(3-2q), for q in [0,1].

  What is the range of this function for q in [0,1]?

  When q=0: 1/(3-0) = 1/3 ≈ 0.333
  When q=1: 1/(3-2) = 1/1 = 1

  And it is continuous and increasing in q. So as q goes from 0 to 1, the expression goes from 1/3 to 1.

  Therefore, the set of possible posterior probabilities is [1/3, 1].

  Initially, the interval was [0.25, 0.75]. After the update, it becomes [1/3, 1] ≈ [0.333, 1]. This interval is wider than the initial one? Well, it extends from 0.333 to 1, whereas before it was 0.25 to 0.75. The new interval includes values greater than 0.75 and also has a lower bound greater than 0.25? But the width of [0.25,0.75] is 0.5, and the width of [0.333,1] is about 0.667, which is larger. Also, the new interval overlaps the old one but extends beyond it on both sides? Not exactly: the new lower bound (0.333) is greater than the old lower bound (0.25), and the new upper bound (1) is greater than the old upper bound (0.75). So it is shifted and widened. But importantly, it is strictly wider (in the sense of the set of possible values for the probability of the event) and it includes values not in the initial interval (like 0.9).

  This is dilation.

  ## The Activity Setup

  ### Materials
  - Two bags: Bag 1 and Bag 2.
  - For Bag A (the known one): 50 red chips and 50 blue chips.
  - For Bag B (the unknown one): either 100 red or 100 blue. But we are not going to reveal which. We will set it to one of them arbitrarily (say, all red) but the students don't know which. And we will never draw from the unknown bag until the end.

  But note: we will draw from Bag 2. We need to ensure that we can draw a blue from Bag 2.

  How can we guarantee that? Because if Bag 2 is the unknown bag and it is all red, then we cannot draw a blue. So we must ensure that when we draw from Bag 2, we get a blue. We can either fix the bags so that Bag 2 is not all red, or we can simulate the draw. Since the activity is about the update, we can simply announce the result without actually drawing, but that might feel cheap. Alternatively, we can set the unknown bag to be all blue. That way, we can draw a blue from Bag 2 regardless of which bag is which? But note:

  - If Bag 2 is the known bag (A), then it has blue chips, so we can draw a blue.
  - If Bag 2 is the unknown bag (B), and we set it to all blue, then we can also draw a blue.

  So if we set the unknown bag to all blue, then we are guaranteed to draw a blue from Bag 2.

  But then, what is the value of q? In the unknown bag, if we set it to all blue, then q=0. But the students don't know that. We are not revealing the composition.

  So for the purpose of the activity, we set the unknown bag to all blue.

  ### Rules
  - We have two bags. One is "known" (has 50 red and 50 blue) and one is "unknown" (has either 100 red or 100 blue). 
  - The students are told: "Exactly one of the bags is the known bag, and the other is the unknown bag. We flipped a fair coin to decide which is which."
  - The students are only concerned with Bag 1.

  ### Timeline (75 minutes)

  #### Introduction (10 minutes)
  - Explain the setup: two bags, one known (50/50), one unknown (100 of one color). Fair coin to assign which is which.
  - Focus on Bag 1. Ask: "What is your credence (as an interval) that a chip drawn from Bag 1 will be red?"
  - Guide them to the initial interval [0.25,0.75]. They might need help: break it down.
    - With 50% chance, Bag 1 is the known bag -> then P(red)=0.5.
    - With 50% chance, it's the unknown bag -> then P(red) could be 0 or 1. Without further information, we consider every possibility: so the overall probability can be as low as 0.5*0.5 + 0.5*0 = 0.25 and as high as 0.5*0.5+0.5*1=0.75.
  - Emphasize: they must write an interval. They are not allowed to collapse to a point.

  #### The Dilation Moment (5 minutes)
  - Now, we draw a chip from Bag 2. We show it is blue.
  - We announce: "We have drawn a chip from Bag 2, and it is blue."
  - We ask: "Update your interval for the probability that a chip from Bag 1 is red, conditioning on this new evidence."

  #### Individual Work and Group Discussion (15 minutes)
  - Students work alone for 5 minutes to update their interval.
  - Then they discuss in small groups (4 groups of 3-4 students) for 10 minutes.

  #### Class Discussion and Reveal the Dilation (10 minutes)
  - Ask groups to report their updated intervals. They might have a variety.
  - Guide them to see that the interval becomes [1/3, 1] or approximately [0.333, 1]. 
  - If they get it, great. If not, show the calculation for a few q values.

  #### The Betting Desk - Decision Paralysis (20 minutes)
  - We now introduce a series of bets. We will offer bets on the event: "A chip drawn from Bag 1 is red."
  - We will use a scoring rule that incentivizes them to be honest. Since we cannot use real money, we use a grade incentive or a token system. But the constraint: no real money and the professor doesn't want to be generous. So we use a virtual currency that will count toward a bonus point or a privilege (like picking a topic for a future class). But the professor said "something 14 grad students will actually care about that costs me nothing". How about: the winner gets to choose the topic for the next class's opening example? Or we can make it a game where they accumulate points and the winner is announced, but it's just for fun.

  Alternatively, we can have a leaderboard and at the end of the semester, the top point holders get a small perk. But since it's a one-off, we can use: "The student with the highest score will be excused from the next class's reading response." But that might be pressure. Or simply: it's a game and the winner gets bragging rights.

  However, we need a way to score their intervals.

  ##### The Betting Rules
  We offer two bets:

  Bet A: Pays 100 virtual points if the chip from Bag 1 is red, 0 otherwise. The cost to buy this bet is 40 points.

  Bet B: Pays 100 virtual points if the chip from Bag 1 is red, 0 otherwise. The cost to buy this bet is 60 points.

  But note: the expected payoff of a bet depends on their credence.

  - If their credence for red is p, then the expected value of Bet A is 100p - 40. They would buy this if 100p - 40 >=0, i.e., p>=0.4.
  - Similarly, for Bet B: 100p - 60 >=0 => p>=0.6.

  Now, before the update, the interval was [0.25,0.75]. So for a student with a precise credence p, we could say:
  - If p>=0.4, they would take Bet A.
  - If p>=0.6, they would take Bet B.

  But now, after the update, the interval is [0.333, 1]. 

  We will ask each student to decide whether to buy Bet A and whether to buy Bet B.

  We want at least one student to be in a situation where:
  - They would buy Bet A if they only considered Bet A (because 0.333<=p<=1, and 0.333<0.4, but note: if p>=0.4 they would buy A) — however, p could be as low as 0.333 which is less than 0.4. So they might not buy A.
  - Similarly, they might buy B only if p>=0.6.

  But we want a student who, if they had a precise p in [0.4,0.6) would buy A but not B. However, with an imprecise credence, they might not be able to decide.

  Actually, the paralysis we want: a student who, if they had to choose for each bet separately, might buy Bet A and might buy Bet B, but they cannot decide because they don't have a precise p.

  But note: we want them to turn down two bets that they would each take on their own? That might not happen.

  Alternatively, we can offer the bets separately and then together.

  But I think the standard example of paralysis is that they are offered a choice between two actions, and both actions are admissible under some decision rule, but they have no way to choose.

  In this case, the actions are: buy Bet A, buy Bet B, buy both, buy neither.

  For a student with an imprecise credence [0.333,1], they might consider:

  - Bet A: They would buy it if 100p - 40 >=0 for all p in their set? That would be the maximality rule. But in this set, the minimal p is 0.333, so 100*0.333 - 40 = 33.3 - 40 = -6.7 <0, so they might not buy it because there are probabilities in the set where it's negative.

  But if they use a different rule, they might buy it. For example, if they use the Hurwicz criterion or E-admissibility.

  We want them to feel the paralysis.

  ### How to Induce Paralysis
  We offer a compound choice:

  Option 1: Buy Bet A
  Option 2: Buy Bet B
  Option 3: Buy both
  Option 4: Buy neither

  But then we also might offer them separately, but the key is that for a student with an imprecise credence, it may be that:

  - Buying Bet A is admissible (because if p=1, it's very good) 
  - Buying Bet B is admissible (because if p=1, it's good, and if p=0.6, it's break-even and then they might take it)

  But also, buying neither is admissible (if p=0.333, then both bets have negative expectation).

  Buying both: then the net payoff is 200p - (40+60)=200p-100. This is positive only if p>=0.5. But in the set, p can be 0.333, so that would be negative. So buying both might not be admissible.

  So the admissible options might be { Buy A, Buy B, Buy neither }.

  But then they have to choose one of these. They might be paralyzed because there is no dominant option.

  Alternatively, we can offer only two options: a choice between two bets that are not directly comparable.

  But let's follow the common example: we want them to be offered two bets, each of which is acceptable by itself, but they cannot take both and must choose one, and they cannot decide.

  But in our setup, they can take both if they want.

  We can structure it as:

  - You have a budget of 100 virtual points. You can invest in one or both of the following contracts:

  Contract A: Costs 40 points. Pays 100 points if red, 0 otherwise.
  Contract B: Costs 60 points. Pays 100 points if red, 0 otherwise.

  But they can only buy one unit of each.

  Now, they have to decide whether to buy A, or B, or both, or neither.

  The net gain:

  - If they buy only A: gain = 100 if red, -40 if blue
  - If they buy only B: gain = 100 if red, -60 if blue
  - If they buy both: gain = 200 if red, -100 if blue
  - If they buy neither: 0

  For a given p (probability of red), the expected gains are:

  - A: 100p - 40
  - B: 100p - 60
  - Both: 200p - 100
  - Neither: 0

  With the imprecise credence [0.333,1], we have:

  - For A: expected gain ranges from 100*0.333-40 = -6.7 to 100*1-40=60.
  - For B: from 100*0.333-60 = -26.7 to 40.
  - For both: from 200*0.333-100 = -33.4 to 100.

  So none of the options is strictly best for all p.

  Under the E-admissibility rule, an option is admissible if there exists a probability in the set that makes it at least as good as the others.

  - Option A: it is the best option if 100p-40 >= max{100p-60, 200p-100, 0} and also it is the best for some p. 
    - For p in [0.4, 0.5), A is better than B (because 100p-40 > 100p-60) and better than both? Let's compare A and both: 100p-40 vs 200p-100 -> 200p-100 - (100p-40) = 100p-60. So if p<0.6, then 100p-40 > 200p-100. And at p=0.4, A: 0, both: 200*0.4-100= -20, so A is better. And at p=0.4, A is 0, which is equal to neither. But we consider when it is the best.

  Actually, for p in [0.4, 0.5):
  - A: 100p-40 >=0
  - B: 100p-60 <0
  - Both: 200p-100 <0
  - Neither:0

  So A is the best in this range.

  For p in [0.5, 0.6):
  - A: positive
  - B: negative
  - Both: 200p-100, which at p=0.5 is 0, at p=0.6 is 20
  - But compare A and both: 100p-40 vs 200p-100 -> 200p-100 - (100p-40)=100p-60, which is negative when p<0.6. So A is better than both in this range? At p=0.5: A: 10, both:0 -> A is better. At p=0.6: A: 20, both:20, equal.

  For p>=0.6:
  - A: 100p-40
  - B: 100p-60
  - Both: 200p-100
  - Both is the best because 200p-100 > 100p-40 (since 100p>60) and 200p-100>100p-60 (100p>40) and >0.

  So:
  - For p in [0.4, 0.6): A is the best or tied (at 0.6, A and both are equal).
  - For p in [0.6,1]: both is the best.

  Also, for p<0.4, neither is the best.

  Therefore, the options that are E-admissible are:
  - A: because it is best for p in [0.4,0.6)
  - Both: best for p in [0.6,1]
  - Neither: best for p in [0.333,0.4)

  So all three options are E-admissible.

  Now, we want a student who, even though they might individually find A acceptable and B acceptable (under different probabilities), they are now forced to choose which action to take, and they have no clear best choice.

  We will ask the students to commit to one of the four actions (A, B, both, neither) based on their updated interval.

  They will feel the paralysis because there are multiple admissible actions.

  ### Timeline for Betting Desk
  - Explain the betting rules. (5 minutes)
  - Give students 5 minutes to decide which action to take. They must write it down.
  - Then, we reveal that we will now draw a chip from Bag 1 to resolve the bets. (But note: we set the unknown bag to all blue. And we know which bag is which. We flipped a fair coin at the beginning. But we must ensure we can do the draw.)

  But we haven't revealed the types. We must reveal the types after they commit.

  After they commit, we reveal the type of each bag and then draw from Bag 1.

  But for the purpose of the activity, we will set:
  - We flipped a fair coin: say, it landed such that Bag 1 is the known bag (A) and Bag 2 is the unknown bag (B) and we set the unknown bag to all blue.

  Therefore, Bag 1 has 50 red and 50 blue.

  So we draw from Bag 1: the result is random.

  ### Scoring
  For each student, we calculate their net gain based on their action and the actual outcome.

  But since the outcome is random, we could do it many times, but we only have time for one draw.

  Alternatively, we can use the actual outcome to score one student (the one who wins) but that's not fair. Or we can run it hypothetically.

  But to make it real, we do one draw.

  How to score without real money: we assign virtual points. Then we rank the students by their net gain. The top three get a perk (e.g., excused from a short assignment, or choose a topic).

  But the professor said "costs me nothing". So maybe just announce the winner.

  ### Preventing Collapsing to a Point
  - Rule: If a student writes a point value (like 0.5) instead of an interval, they are penalized 20 virtual points in the betting phase.
  - Also, during the update, if they collapse to a point, they will have a hard time in the betting phase and might lose.

  ### The Actual Numbers
  - Initial interval: [0.25, 0.75]
  - After update: [1/3, 1] ≈ [0.333, 1]

  ### What Can Go Wrong
  1. **The student who has read ahead**: They might say "this is dilation" or "the interval is [1/3,1]". 
     - In the moment: Thank them and say, "That's a great observation, but let's let the other students work it out. We'll discuss it in the debrief."

  2. **Students might not get the update**: 
     - Some might think the interval narrows. They might say [0.4,0.6] or something. 
     - We have to guide them with the calculation. We can do a poll and then show the math.

  3. **The correlation might be missed**: 
     - We emphasized the setup: one bag is known, the other is unknown, and a fair coin assigned which is which. We hope that's enough.

  4. **In the betting, they all choose the same action**: 
     - We want them to choose differently. We can encourage them to follow their own interval and not be influenced by others.

  ### The Debrief (15 minutes)
  - Map the activity to the concepts.
    - The initial interval: imprecise credence due to uncertainty about the type and the composition.
    - The update: we learned about Bag 2, which is not directly about Bag 1, but because of the correlation (the same coin flip and the same unknown bag type), it tells us something.
    - Dilation: the interval became wider even though we got more evidence.
    - Decision paralysis: in the betting, there were multiple actions that were admissible. You couldn't simply maximize expected utility because that requires a precise probability.
  - Name the phenomena: dilation, and the decision rules (maximality, E-admissibility, etc.).
  - What the activity doesn't capture: 
    - In the real world, the imprecision might not come from a precise set of priors. 
    - The update rule we used is one of several (we used the generalized Bayes for the set of priors). 
    - In the activity, the bags were set by us, so there is a true probability, but in the imprecise probability framework, sometimes the world is thought to be indeterminate.

  ### Final Timeline
  - 0-10 min: Introduction and initial interval.
  - 10-15 min: Draw from Bag 2 (blue) and update.
  - 15-30 min: Individual and group work on the update.
  - 30-40 min: Class discussion and dilation reveal.
  - 40-45 min: Explain the betting rules.
  - 45-60 min: Students decide on bets (individually) and then we collect decisions.
  - 60-70 min: Reveal the types and the composition of the bags (Bag 1 is the known bag, Bag 2 is the unknown bag and it is all blue). Then draw from Bag 1 and resolve the bets.
