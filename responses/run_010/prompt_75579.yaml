answer: |-
  Below is a structured response to your query. I focus on desiderata for a theory of rational preference over risky prospects, tailored to your specified purpose: a **single agent, one-shot choice, no repetition, no trading, and known preferences**. I evaluate each desideratum for non-negotiability in this context, flagging where standard objections (e.g., money-pumping) bite only under repeated/sequential/institutional settings. I then address conflicts, duplicates, the Allais question, and brief verdicts on theories. British English used throughout.

  ### Desiderata for Rational Preference Under Risk (One-Shot Context)
  *Key*:  
  - **Non-negotiable (NN)**: Violation implies irrationality in one-shot context (e.g., dominance violations).  
  - **Negotiable (N)**: Reflects camp-specific assumptions (e.g., linearity in probabilities).  
  - **Money-pumping**: Only bites under repeated/sequential choices or institutions (not one-shot).

  | Desideratum | Case/Consideration | Non-negotiable? | Notes on Context |
  |-------------|--------------------|-----------------|-----------------|
  | **Completeness** | Agent must rank all prospects (no “incomparable” choices). Ensures a decision is always possible. | NN | Essential for a norm; without it, indecision is rationalised, defeating the purpose of a prescriptive theory. |
  | **Transitivity** | If A > B and B > C, then A > C. Prevents cyclic preferences (e.g., A > B > C > A). | NN | In one-shot, money-pumping is irrelevant, but intransitivity still implies a flawed prioritisation (e.g., incoherent trade-offs). |
  | **Stochastic Dominance (SD)** | If A yields equal-or-better outcomes than B in all states and better in some, A > B. E.g., £100 with p=1.0 > £100 with p=0.9. | NN | Violating SD means choosing strictly worse outcomes—indefensible even in one-shot. |
  | **Framing Invariance** | Preferences depend only on outcomes/probabilities, not description (e.g., “90% survival” vs. “10% death”). | NN | Framing effects (e.g., loss-aversion biases) are cognitive errors, not rational traits. |
  | **Consistency of Risk Attitudes** | Risk aversion/seeking must be stable across equivalent descriptions (e.g., no reversals if a fine-grained gamble is coarsened). | NN | A special case of framing invariance; inconsistency implies the agent doesn’t “know what they want”. |
  | **Reduction of Compound Lotteries** | Agent is indifferent between a compound lottery and its simplified equivalent (e.g., two coin flips for £100 vs. one 25%-chance equivalent). | N | In one-shot, the “process” is irrelevant; reduction is often assumed for simplicity. But if agents intrinsically value uncertainty resolution (e.g., suspense), it’s negotiable. |
  | **Continuity (Archimedean)** | No outcome is infinitely better/worse: if A > B > C, there exists a probability p such that pA + (1-p)C ~ B. | N | Technical convenience for utility representations. Fails for extreme cases (e.g., death vs. pennies), so not a rationality core. |
  | **Separability (Independence)** | If A > B, then mixing both with C (pA + (1-p)C > pB + (1-p)C) shouldn’t reverse preference. Underpins Allais paradox. | N | Heart of the debate. Violated by Allais preferences. Money-pumping only bites under sequential choices (not one-shot), so not NN. |
  | **Common-Consequence Consistency** | Preferences shouldn’t reverse when identical outcomes are added to options (e.g., Allais’ “common consequence” pattern). | N | Derivative of separability; a specific test case. Violations (e.g., Allais) are empirically common and arguably rational. |
  | **Common-Ratio Consistency** | Preferences shouldn’t reverse when probabilities are scaled (e.g., Allais’ “common ratio” pattern). | N | Also derivative of separability. Violations may reflect rational probability weighting (e.g., certainty effects). |

  #### Adjustments for Institutional Context
  If the purpose shifts to **an institution imposing rules on many agents making correlated bets**, demote:  
  - **Separability** (and its derivatives) to **NN**: Institutions require robustness against arbitrage/money-pumping across agents.  
  - **Reduction of Compound Lotteries** to **NN**: Complex bets need simplification for scalability.  
  - **Continuity** remains **N** (still technical).

  ### Conflicts and Duplicates
  - **Jointly Unsatisfiable Triad**:  
    **Separability + Common-Consequence Consistency + Allais Preferences**.  
    *Why*: Separability implies common-consequence consistency, but Allais preferences violate both. You can’t have all three—choose between separability (EU) or Allais-compatibility (e.g., RDU/REU).  
    (No conflicts among NN desiderata; they are mutually compatible.)  

  - **Suspected Duplicates**:  
    - Separability, Common-Consequence, and Common-Ratio are **variants of the same requirement** (linearity in probabilities).  
    - Framing Invariance and Consistency of Risk Attitudes are **both methodological hygiene**: they ensure preferences are about outcomes, not presentation.

  ### Does This Settle the Allais Problem?
  **No—it leaves a fork**.  
  - NN desiderata (completeness, transitivity, SD, framing invariance, risk-consistency) are compatible with *both* accepting and rejecting Allais preferences.  
  - **To close the fork**: Decide whether **separability** is required. This isn’t a “desideratum in disguise” but a **substantive commitment**:  
    - *Pro-separability*: Preferences should be linear in probabilities (no Allais).  
    - *Anti-separability*: Probability weighting (e.g., certainty effects) is rational.  
    This choice isn’t settled by other desiderata; it’s about what “rational” means for probability trade-offs.

  ### Theory Verdicts (2 Sentences Each)
  | Theory | Verdict Against Desiderata |
  |--------|----------------------------|
  | **Expected Utility (EU)** | Satisfies all NN and separability. Fails descriptively (violates Allais) and normatively if separability isn’t sacrosanct. Rational only if you reject Allais preferences. |
  | **Rank-Dependent Utility (RDU)** | Satisfies all NN and allows Allais by weighting probabilities non-linearly. Violates separability—best if you view probability weighting as rational. |
  | **Risk-Weighted Expected Utility (REU, Buchak)** | Satisfies all NN and Allais via risk-weighting. Violates separability like RDU; more flexible for risk attitudes but adds complexity without new NN coverage. |
  | **Savage/Jeffrey (Subjective Probabilities)** | Derives probabilities from preferences but reduces to EU under risk. Satisfies all NN and separability, so same EU limitations. Adds epistemology but no one-shot advantage. |
