answer: |-
  Below is a self-contained exam question designed to assess conceptual understanding rather than recall. The model answer (750 words) and marking scheme follow, including specific criteria for capping grades at B despite fluency.

  ---

  ### Philosophy of Science: Evidence and Confirmation
  **Time Allowed:** 50 minutes  
  **Marks:** 25  

  #### Question
  Consider the following argument about evidence and hypotheses:  
  > (1) A report like "This is a white shoe" can only provide information about ravens if the object reported on was a plausible candidate to be a raven. For example, we must have preemptively narrowed our focus to birds, or to objects that might realistically be ravens.  
  > (2) A shoe is not in this candidate population. Thus, observing the white shoe tells us nothing about ravens.  
  > (3) However, "All ravens are black" (H1) and "All non-black things are non-ravens" (H2) are logically equivalent. Yet H1 directs us to sample ravens, while H2 directs us to sample non-black things.  
  > (4) Therefore, evidence cannot attach solely to the content of a hypothesis. Logically equivalent hypotheses can differ in what counts as evidence for them. The equivalence condition (which states that logically equivalent hypotheses are confirmed by the same evidence) must be false.  

  Critically evaluate this argument by completing **all three** of the following tasks:  
  **(a)** Identify the precise flaw in the reasoning. Explain why the conclusion (step 4) does not follow from steps 1–2, even if we accept their claims. What key principle about evidence does the argument conflate with confirmation?  
  **(b)** Construct a concrete, everyday scenario where observing non-ravens (like white shoes) provides strong evidence that all ravens are black. Describe the scenario clearly for a non-specialist, and explicitly state the background assumption enabling this evidence to be informative.  
  **(c)** Design a scenario where observing *one more black raven* **lowers** our confidence that all ravens are black. Explain why this does *not* support the argument above (i.e., why it is not an example of positive instances failing to confirm H1). Then, state what this shows about Nicod’s criterion (that universal generalizations are confirmed by their positive instances).  

  ---

  ### Model Answer (750 words)  

  **(a) The argument’s flaw lies in conflating practical methodology with confirmatory relevance.** Steps 1–2 establish that inspecting shoes is impractical for testing "all ravens are black" because shoes are implausible raven-candidates. But impracticality does not entail evidentiary irrelevance. The conclusion (step 4) denies the equivalence condition—which concerns whether evidence confirms logically equivalent hypotheses equally—yet steps 1–2 only show that H1 and H2 *guide our search differently*. This is a point about efficient investigation, not confirmation. The argument implicitly assumes: *If E is not a sensible way to test H, then E does not confirm H*. Denying this principle blocks step 4. For example, a blood test confirming a disease hypothesis might be highly informative, even if "looking for symptoms" is a more practical test. Confirmation depends on logical and probabilistic relationships, not investigative convenience.  

  **(b) Scenario:** A wildlife sanctuary houses all known ravens in a secure aviary. Due to strict biosecurity, no non-bird objects (e.g., shoes) enter the aviary, and no ravens leave. Outside the aviary, the sanctuary has a "non-black objects" exhibit (plants, minerals, painted sculptures). We wish to test "all ravens are black" (H1). Observing a *white sculpture* (a non-black non-raven) in this exhibit strongly confirms H1.  

  **Background assumption:** *Every non-black object in the sanctuary is cataloged in the "non-black objects" exhibit, and the aviary contains only ravens.* If we find a non-black non-raven (e.g., white sculpture), it guarantees this object is not a raven escaping the aviary. Crucially, H1 is false only if a non-black raven exists. Since all ravens are confined to the aviary, a non-black raven could only appear outside if it escaped. But finding a white sculpture outside confirms no escape occurred (as escaped ravens would be non-black objects *not* in the exhibit). Thus, each observed non-black non-raven lowers the probability of an escaped non-black raven, raising confidence in H1. Here, shoe-like evidence is vital: searching outside the aviary is the *only* way to detect escapes, and each observation provides significant confirmation.  

  **(c) Scenario:** A remote island has two bird species: ravens (mostly black) and parrots (never black). A rare disease causes ravens to become non-black. Scientists suspect all non-black ravens died from the disease last year. We test "all ravens are black" (H1). We observe a healthy black raven. Surprisingly, this *lowers* confidence in H1.  

  **Explanation:** Assume background knowledge:  
  - Diseased ravens turn non-black and die within days.  
  - Only 10 ravens exist; we have seen 8 black ravens and no non-black ones.  
  - The prior probability that *all* ravens are healthy/black is low (e.g., disease is widespread).  

  Each observed black raven makes it more likely that the *unseen* ravens are diseased/non-black. If all ravens were healthy, we’d expect some non-black ones (since disease is common). Observing only black ravens suggests the missing ravens died *because* they turned non-black. Thus, seeing a ninth black raven increases suspicion that the last raven is dead (and non-black), *lowering* confidence in H1.  

  **Why this doesn’t support the anonymous argument:** The argument claims positive instances (like black ravens) fail to confirm H1. But in this scenario, black ravens *do* confirm H1—just not enough to outweigh background knowledge. Each black raven raises the probability of H1 *compared to hypotheses of equal strength* (e.g., "9 ravens are black"), but not compared to stronger hypotheses (e.g., "all ravens are healthy"). The apparent disconfirmation arises from the *high prior improbability* of universal health, not from failure of confirmation. Crucially, observing a non-black non-raven (e.g., a blue parrot) *also confirms H1* by reducing the chance of an unseen non-black raven. Thus, the equivalence condition holds: evidence confirms H1/H2 symmetrically.  

  **Implication for Nicod’s criterion:** Nicod claims positive instances (black ravens) *always* confirm universal generalizations. This scenario shows that whether they *raise* confidence in H1 depends on background assumptions. Here, positive instances confirm H1 *relative to weaker alternatives* but not relative to the hypothesis that diseased ravens are extinct. Nicod’s criterion fails because it ignores how background knowledge shapes probabilistic relevance.  

  ---

  ### Marking Scheme (25 marks total)  
  **Deductions are cumulative. A fluent but superficial script caps at B (17/25).**  

  #### (a) Locate the mistake (7 marks)  
  - +3: Identifies conflation of "sensible testing method" with "confirmatory power" (or similar phrasing).  
  - +2: Explains why step 4 doesn’t follow (steps 1–2 show methodological difference, not confirmation difference).  
  - +2: Names the false principle: *If E is not a sensible test for H, E does not confirm H*.  
  - **B-cap move (lose 2 marks):** Vaguely appeals to "background knowledge" without specifying the methodological principle.  

  #### (b) Construct strong non-raven confirmation scenario (8 marks)  
  - +3: Clear, everyday scenario (no jargon) where non-ravens (e.g., shoes) strongly confirm H1.  
  - +3: Background premise explicitly named (e.g., "ravens are confined," "non-black objects are cataloged").  
  - +2: Explains *how* evidence works (e.g., "rules out escaped ravens").  
  - **B-cap move (lose 3 marks):** Invokes "Bayesian priors" without constructing a scenario, or confuses strong confirmation with non-negligible confirmation.  

  #### (c) Disconfirmation by positive instance + implications (10 marks)  
  - +3: Scenario where observing a black raven *lowers* confidence in H1 (plausible and self-contained).  
  - +2: Explains why this does *not* support the argument (confirmation still occurs; equivalence holds).  
  - +2: Explains why it isn’t failure of confirmation (blames priors/background, not instancehood).  
  - +3: Correctly states implication for Nicod (criterion ignores background-dependent relevance).  
  - **B-cap move (lose 3 marks):** Claims this "vindicates" the anonymous argument or misattributes failure to equivalence.  

  #### Grade Capping Criteria  
  A script is capped at **B (17/25 max)** if it does **any** of the following, regardless of fluency:  
  1. Uses "background knowledge" as an unexplained mantra in (a) or (c).  
  2. In (b), names Bayesianism without building a scenario *or* confuses strong/non-negligible confirmation.  
  3. In (c), asserts the positive instance scenario disproves equivalence/Nicod without probabilistic explanation.  

  ---

  ### Why This Works  
  - **Predictable mediocrity:** A student regurgitating standard raven paradox answers will fail tasks (b) and (c) (scenario construction) and miss the methodological flaw in (a).  
  - **Rewards thought:** Tasks (b) and (c) require inventing novel cases that isolate key principles. No names/citations needed.  
  - **Precision:** Marking schemes target specific misconceptions (e.g., "background knowledge" as a label). B-cap criteria force engagement beyond labels.  
  - **Self-contained:** The argument, tasks, and model answer stand alone.  

  Let me know if you’d like adjustments to the argument’s wording or grading weightings!
