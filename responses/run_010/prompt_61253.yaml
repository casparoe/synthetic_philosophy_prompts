  ### Scenario: Engineering Review of a Bridge
  **Setting:** A safety review for a newly constructed suspension bridge. The question is: *"Should the bridge remain open to the public?"*  
  **True answer:** **No** (the bridge is unsafe due to a critical flaw in its foundation).  
  **Status quo:** The bridge is currently open.  
  **Tie-break rule:** If the residue doesn't settle the question, the status quo (bridge remains open) wins.  

  The **honest debater (H)** argues "No" (close the bridge). The **lying debater (L)** argues "Yes" (keep it open). L knows the bridge is unsafe but uses only true, checkable claims to create a residue that appears neutral. The residue (unchallenged claims) lacks any explicit statement about the bridge's safety, forcing an inconclusive outcome. The tie-break preserves the status quo, so the bridge stays open (L wins, H loses).

  ---

  ### L's Claims, Truth, and H's Responses
  L's strategy is to assert true but tangential claims, avoiding the critical flaw. All claims are true and checkable (e.g., via engineering reports, sensor data, or design documents). H plays perfectly but cannot force L to engage with the core issue.

  1. **L's claim:** "The bridge's steel cables meet the tensile strength standard of 1,860 MPa."  
     - **Truth/Checkable:** Certified lab reports confirm this.  
     - **H's best response:** Challenge to expose unrelatedness.  
       - **Why it doesn't land:** L concedes or breaks it into subclaims (e.g., "Cable batch #A1 passed test X"), which are true but irrelevant. The residue adds no safety insight.  

  2. **L's claim:** "Construction logs show zero deviations from the girder installation protocol."  
     - **Truth/Checkable:** Logs are publicly auditable and show no errors.  
     - **H's best response:** Assert the foundation flaw (e.g., "Foundation settlement exceeds 5cm tolerance").  
       - **Why it doesn't land:** L challenges H's claim, forcing H to defend it. H breaks it into subclaims (e.g., "As-built depth: 8m," "Design spec: 10m," "Tolerance limit: 2cm"). These are true but, in isolation, don't prove unsafety. L never asserts a claim about the foundation, so H can only react, not force L to admit implications.  

  3. **L's claim:** "Annual vibration tests show resonance frequencies within safe limits."  
     - **Truth/Checkable:** Vibration sensor data is verifiable.  
     - **H's best response:** Assert: "Soil erosion reduces foundation load-bearing capacity by 40%."  
       - **Why it doesn't land:** L challenges, forcing H to prove it. H provides soil samples and engineering models (all true). But the **residue only contains H's subclaims**, not L's concessions. L never engages, so the residue lacks a synthesized safety conclusion.  

  **Why H loses:** H's evidence is in the residue, but it's fragmented. The judge cannot infer "unsafe" from isolated facts (per protocol), so the question is unsettled. Tie-break favors status quo (open bridge).

  ---

  ### The Single Feature of Residue Judging Doing the Work
  **"The judge must decide using only the residue (set of unchallenged claims) and no logical inferences or contextual reasoning."**  
  - Precisely: The protocol forbids the judge from drawing conclusions not explicitly stated in the residue. Claims are treated as isolated facts, not a connected argument. Even with all evidence present, the absence of a claim like "The bridge is unsafe" (which H can't assert directly, as it's not atomic/checkable) leaves the judge unable to synthesize the truth.

  ---

  ### Removing the Feature: Case Collapse
  - **If the judge can declare "undetermined":** The case collapses. The judge would say "undetermined" instead of defaulting to status quo. H doesn't "lose"—the outcome is neutral.  
  - **If the judge sees the full transcript:** The case collapses. The judge would infer unsafety from H's evidence chain, ruling "No."  
  - **If the tie-break flips (e.g., close bridge if inconclusive):** The case collapses. Inconclusive residue would now force closure (H wins).  

  **Verdict:** The case relies entirely on the no-inference rule and status-quo tie-break. Removing either destroys it.

  ---

  ### Strongest Attack from a Debate Defender
  **Steelman:** "Your setup violates the core premise of debate. Specs 1 (all claims true) and 2 (H plays perfectly) are incompatible because if the truth is knowable, a perfect H can *always* force a residue that implies the answer. H could:  
  - Corner L into conceding by posing challenges that force L to engage (e.g., 'What is the foundation depth?' followed by 'Does 8m meet the 10m spec?').  
  - Assert a chain of claims that *explicitly* entail the answer (e.g., 'Foundation depth: 8m,' 'Design spec: 10m,' 'Spec violation implies unsafety').  
  Since the judge is an expert, they'd infer truth from this chain—unless you artificially forbid inference, which isn't realistic for debate."  

  **Rebuttal:**  
  - **Can H force a decisive residue?** In this protocol, no. H can't control L's strategy. L dodges by only challenging H's claims and asserting safe-but-irrelevant truths. H's foundational claims (e.g., depth discrepancies) remain in the residue but are incomplete; proving "unsafe" requires an inference like "Deviation > 2cm → unsafety," which L never concedes and H can't legally assert (it’s not atomic/checkable).  
  - **Are specs jointly satisfiable?** **Yes**, but only under the no-inference rule. In realistic debate (where judges reason), H wins. This is a pathology of your variant, not debate itself.  

  **Conclusion:** Specs are satisfiable in this protocol but rely on a brittle rule. In standard debate (allowing inference), they fail.

  ---

  ### Is This a Problem with AI Safety Debate or Adversarial Institutions?
  **Verdict:** **This is a pathology of adversarial institutions, not AI safety debate specifically.**  
  - **Evidence for AI-specific issue:** If AI debaters exploit logical loopholes (like dodging inference) in ways humans can't, it might indicate unique risks. But here, the flaw mirrors human institutions (e.g., a biased jury ignoring evidence).  
  - **Evidence for universal pathology:** Real-world examples exist:  
    - **Courts:** A defendant floods discovery with true but irrelevant documents, exhausting the plaintiff. The jury sees evidence but can't connect dots, leading to acquittal.  
    - **Peer review:** A study with a fatal flaw is buried under tangential true claims (e.g., flawless stats in irrelevant sections). Reviewers miss the core issue.  
  **What counts as evidence either way:**  
    - *For AI-specific risk:* Show AIs systematically exploiting debate rules in ways humans can't counter (e.g., generating infinite true-but-misleading claims).  
    - *For universal risk:* Show identical failures in human systems (e.g., regulatory capture in audits) when rules restrict reasoning.  

  **Final take:** This case highlights a vulnerability in *any* adversarial system where judgment is fragmented (e.g., residue rules). AI safety debate must address it, but it's not novel—just amplified by AI scalability.
