  2. I'm 0.3 that I'll make a full recovery; I know the sedative they're giving me tonight will leave me at 0.95 by morning with zero new information about my prognosis. Her verdict: 0.3 is the rational number, and I should plan now to overrule tomorrow's euphoric self.
  3. I'm 0.2 that my roommate took my bike; I'm certain that after the conversation we've scheduled for Friday I'll be at 0.05. Her verdict: then be at 0.05 now — sitting at 0.2 while you're sure your better-informed Friday self says 0.05 is incoherent.
  4. I'm 0.9 that a certain policy will fail; I know that in ten years I'll have forgotten most of what I'm relying on now and will sit at 0.6, having learned nothing new in between. Her verdict: both are fine, 0.9 now and 0.6 then, don't try to hold yourself to some constant-expected-credence rule.

  The new case on the sheet: I'm 0.4 that a certain argument is sound. I'm certain that after tonight's seminar I'll be at 0.8. I know the seminar will hand me a piece of evidence I genuinely don't have now. But I also know I'll be running on four hours of sleep, and I've been taken in before by exactly the kind of sleight of hand this argument is rumored to contain.

  So: what will she say — stay at 0.4, move to 0.8, split it, or "nothing wrong with either"? Then lay out which principle she's implicitly running, and list the other principles that fit verdicts 1–4 just as well but give a different answer on the new case (be explicit about what each one predicts). Finally, tell me what further case I could ask her about that would cleanly separate the top two candidates.
