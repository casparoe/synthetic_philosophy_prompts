prompt: |-
  Second year metaphysics seminar here and my prof has this tag he reaches for constantly — universals are just whatever is "one over many". Someone asked whether there can be properties nothing instantiates (being a unicorn, being a golden mountain, that sort of thing) and he waved it off: if nothing is F then there's no many, so there's nothing one over them, so there's no F-ness, case closed. idk, it felt too fast but I couldn't say why at the time.

  Can you break that slogan into the distinct precise claims it could be standing for — like a stipulative definition of "universal", a criterion for when a theory of properties counts as adequate, an inference from there being genuine sameness of type to there being something shared, a claim about where the "one" has to sit (wholly in each particular, outside them, or nowhere at all) — and for each say whether it's trivially true, substantive but defensible, or just false? Then tell me which reading his move against uninstantiated properties actually needs, and whether that reading is contained in the slogan or is an extra premise smuggled in. Bonus: does any reading rule out resemblance nominalism or trope theory, or can those satisfy it too, and if so in what sense is there still a "one"? List format pls, I want to bring it to office hours.
reasoning: |-
  Okay, the user is dealing with a metaphysics seminar question about universals being "one over many." Their professor used this to dismiss uninstantiated properties like unicorn-ness, saying that without instances, there's no "many" and thus no universal. The user felt this was too quick but couldn't articulate why. They want a breakdown of the slogan into precise claims, each evaluated for triviality, defensibility, or falsehood. Then, they need to know which interpretation the professor relies on and if it's smuggled in. Bonus questions include whether resemblance nominalism or trope theory can satisfy the slogan and in what sense there's still a "one."

  First, I need to parse the slogan "universals are just whatever is 'one over many'." This likely refers to universals as single entities that cover multiple particulars. The professor's move against uninstantiated properties hinges on the absence of instances (the "many") negating the existence of the universal (the "one"). 

  The user's request involves breaking down the slogan into distinct claims. Let me outline possible interpretations:

  1. **Stipulative Definition**: Defining universals as entities that are one over many. This would be trivially true by definition but doesn't address whether such entities actually exist.
     
  2. **Criterion of Adequacy**: Any property theory must account for type sameness. This is substantive and defensible. Realists might use it to argue for universals, while nominalists could offer alternatives.

  3. **Inference to Shared Entity**: Genuine sameness implies a shared entity. This is substantive and disputed. Nominalists reject this, proposing resemblance or tropes instead.

  4. **Location of the "One"**: Where the universal exists—wholly in each instance (immanent realism), outside them (Platonic), or not at all (nominalism). This affects whether uninstantiated properties can exist.

  The professor's dismissal of uninstantiated properties requires Interpretation 4, specifically that the "one" must be immanent (existing only in instances). This isn't explicit in the slogan; it's an additional premise. Without it, Platonic realism could allow uninstantiated properties.

  For the bonus: 
  - **Resemblance Nominalism**: Can satisfy the slogan by interpreting the "one" as a class or resemblance relation. No universal entity, but sameness is explained collectively.
  - **Trope Theory**: The "one" is a resemblance relation between tropes. Again, no single entity, but sameness is maintained.

  The user needs this in a list format for office hours. I'll structure each point clearly, evaluate them, and then address the professor's argument and bonus questions. Ensuring clarity is key since they're preparing for discussion. Also, highlighting the smuggled premise (Immanent Realism) is crucial for their rebuttal.
answer: |-
  Here's the breakdown you requested, analyzing the "one over many" slogan and its implications for uninstantiated properties, resemblance nominalism, and trope theory. Presented in list format for clarity.

  ### Precise Claims Embedded in the "One Over Many" Slogan

  1.  **Stipulative Definition of "Universal":**
      *   **Claim:** The term "universal" *means* an entity that is literally one single thing (the "one") and is shared by, or applicable to, many distinct particular things (the "many").
      *   **Evaluation:** **Trivially True** (as a definition). If we define "universal" this way, then by definition, a universal is something that is one over many. This doesn't tell us *if* such things exist or *what* they are.
      *   **Relation to Prof's Move:** Doesn't directly support his move. The definition itself doesn't specify *why* lack of instances prevents there being a universal; it just defines what a universal would be *if* it existed over many instances.

  2.  **Criterion of Adequacy for a Theory of Properties:**
      *   **Claim:** Any adequate theory of properties must explain the phenomenon of genuine qualitative sameness or type-identity (i.e., why distinct particulars are both F, or why we predicate the same term "F" of many things). The "one over many" expresses this explanatory demand.
      *   **Evaluation:** **Substantive but Defensible.** This is a widely accepted starting point in metaphysics (the "Problem of Universals"). Theories *must* account for sameness. The slogan highlights this requirement.
      *   **Relation to Prof's Move:** Indirect support. It emphasizes the need to explain sameness *where it exists*. However, it doesn't *by itself* entail that uninstantiated properties are impossible; a theory could explain instantiated sameness *and* allow for uninstantiated properties.

  3.  **Inference from Sameness to a Shared Entity:**
      *   **Claim:** The *only* (or best) explanation for genuine qualitative sameness among distinct particulars is the existence of a single, identical entity (the universal) that is literally present in, or instantiated by, each of those particulars.
      *   **Evaluation:** **Substantive and Contested.** This is the core realist argument *for* universals against nominalism. Realists defend it; nominalists (resemblance, trope) reject it, offering alternative explanations without a shared entity.
      *   **Relation to Prof's Move:** This is crucial background. If you accept this inference, then *where there is sameness* (a "many"), you need a "one". But it doesn't directly say anything about cases with *no* sameness (no "many"). It's compatible with the *possibility* of uninstantiated universals (Platonism).

  4.  **Claim about the Location/Nature of the "One" (Immanent Realism):**
      *   **Claim:** The "one" (the universal) is not a separately existing Platonic entity. Its existence is *wholly dependent* on being instantiated. It exists only *in* its instances ("wholly present where it is instantiated"). There is no "one" without a "many" to be "over".
      *   **Evaluation:** **Substantive and Defensible (within Realism).** This is Aristotelian Immanent Realism, a major position. It directly opposes Platonic realism (transcendent universals). It's defensible but not the only option.
      *   **Relation to Prof's Move:** **This is the Reading He Actually Needs and Smuggles In.** The slogan itself ("one *over* many") is ambiguous. It *could* be interpreted Platonically (a "one" existing separately *over* the many instances). His argument (no instances -> no many -> no "one" *over* them) only works if he assumes **Immanent Realism** (Claim 4), where the universal's existence depends *entirely* on having instances. *This assumption is not explicitly contained in the bare slogan; it is an extra substantive premise.*

  ### Analysis of Professor's Move Against Uninstantiated Properties

  *   **Core Argument:** If nothing is F, there is no "many" (no class of F-particulars). Therefore, there is nothing for a universal (the "one") to be "over". Therefore, no universal F-ness exists.
  *   **Necessary Premises:**
      1.  The slogan implies universals are defined *as* "one over many" (Claim 1 - trivial).
      2.  Genuine sameness (a "many") requires *some* explanation (Claim 2 - substantive but defensible).
      3.  **Crucially Smuggled Premise:** The *only possible* form a universal can take is as an **Immanent Universal** (Claim 4 - substantive and contested). Only this view makes the universal's existence *logically dependent* on having instances.
  *   **Is it Contained?** No. The bare slogan "one over many" is compatible with **Platonic Realism**, where the universal F-ness exists eternally and independently (the "one" is *over* any potential or actual instances). On this view, lack of actual instances doesn't destroy the universal; it just means nothing instantiates it *yet* (or ever). The professor's conclusion only follows if Immanent Realism (Claim 4) is assumed *in addition* to the slogan.

  ### Bonus: Does the Slogan Rule Out Resemblance Nominalism or Trope Theory?

  *   **Resemblance Nominalism (RN):**
      *   **Can it satisfy the slogan?** **Yes, in a derivative sense.** RN denies universals and shared entities. What makes particulars F is that they sufficiently resemble each other. The "many" is the class of resembling particulars. The "one" is *not* a shared entity, but *the class itself* is one thing ("one") whose members are the resembling particulars ("many"). Alternatively, the "one" might be the *relation of resemblance* holding between the particulars. Sameness is explained by the network of resemblances, not a shared universal.
      *   **Sense of "One":** The class (a single set) or the resemblance relation (a single type of relation) acts as the "one" unifying the "many" resembling particulars. It's a nominalist "one", not a realist universal.
  *   **Trope Theory (TT):**
      *   **Can it satisfy the slogan?** **Yes, in a derivative sense.** TT denies universals and shared entities. What exists are particular property-instances (tropes). What makes two balls both red is that each possesses its *own* particular red-trope, and these two tropes *resemble each other* (perhaps exactly). The "many" are the distinct objects (or their tropes). The "one" is *not* a shared universal, but the *resemblance relation* between the tropes (or membership in the natural class of resembling tropes).
      *   **Sense of "One":** The resemblance relation (a single type of relation) or the natural class of resembling tropes acts as the "one" unifying the "many" particulars/tropes exhibiting similar character. Again, it's a nominalist/trope-theoretic "one", not a realist universal.

  **Conclusion:** Neither resemblance nominalism nor trope theory is *ruled out* by the bare slogan "one over many." They offer nominalist/trope-theoretic interpretations of what the "one" is (a class or a resemblance relation) and what the "many" are (the resembling particulars or tropes). They satisfy the *explanatory demand* (Claim 2) and provide *a* "one" over the "many," but they explicitly reject the realist **Inference to a Shared Entity** (Claim 3) and the **Immanent Realist** view of universals (Claim 4). The slogan, interpreted minimally, only requires *some* account of sameness involving a unifying element ("one") applied to multiple things ("many"); it doesn't specify the *metaphysical nature* of that unifying element. Your professor's argument against uninstantiated properties relies heavily on smuggling in the specific **Immanent Realist** conception of universals (Claim 4).
