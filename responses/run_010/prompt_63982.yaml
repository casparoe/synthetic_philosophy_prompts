  Below is a detailed analysis of each point from Ben and Nadia's argument, rated on a scale from -2 (clearly wrong) to +2 (clearly right), with 0 for mixed. Each point is broken down to specify which claims survive and which do not. After the point-by-point analysis, I address who wins the (5)/(6) exchange and the infinite-average variant. The goal is to provide a clear, objective resolution based on decision theory and probability.

  ### **Point-by-Point Analysis**

  **(1) Ben: The usual calculation is fine. Call whatever is in the envelope you're holding X. The other one has either 2X or X/2, each with probability 1/2, so its expected value is 1.25X. Switch. And notice it doesn't depend on what X turns out to be, so it still works after you open the envelope and look, and it works again if you swap back and re-run it — which just shows this is a real paradox and not a puzzle with a tidy solution.**  
  - **Rating: -1** (Partially incorrect; the core claim is flawed, but the paradox observation holds.)  
  - **Surviving claims:**  
    - The "paradox" aspect survives: the reasoning leads to a contradictory cycle (switch, then switch back), highlighting an apparent inconsistency. This shows the problem is not easily resolvable without deeper analysis.  
  - **Failing claims:**  
    - The assumption that P(other is 2X or X/2) = 1/2 unconditionally is not justified. This probability depends on the prior distribution of the smaller amount, which Ben ignores. Without a specified prior, the 1/2 probability is an arbitrary assumption and may not hold (e.g., at boundary cases or with skewed distributions).  
    - The claim that the calculation "still works after you open" is not generally true; it only holds for specific priors (e.g., uniform with finite support) and fails when the prior makes certain amounts more likely.  
  - **Why -1?** Ben correctly identifies the paradoxical behavior, but the core argument equivocates on X and ignores prior dependence, making it misleading.

  **(2) Nadia: It's not a paradox, it's an equivocation. Your X is doing two different jobs, and the 1/2s are only 1/2 if you assume the organizer was equally likely to put any amount in there. There's no such assumption available: no probability distribution is spread evenly over all the possible amounts. So the 1/2s are made up out of nothing.**  
  - **Rating: +2** (Clearly correct; exposes a critical flaw in the naive reasoning.)  
  - **Surviving claims:**  
    - The equivocation: X is used ambiguously as both a fixed value (the observed amount) and a random variable (the unknown smaller amount). This conflation invalidates the 1.25X calculation.  
    - The impossibility of a uniform prior over all positive reals: there is no proper probability distribution that is uniform and infinite, so the 1/2 probability cannot be assumed without justification.  
    - The 1/2 probabilities are "made up" if no prior is specified; they require a well-defined distribution.  
  - **Failing claims:** None; this point is solid and foundational to resolving the paradox.  
  - **Why +2?** Nadia correctly diagnoses the error in Ben's (1) and highlights the need for a prior.

  **(3) Ben: I don't need a distribution. Do it before anybody opens anything. Two envelopes, one has twice the other, I get handed one at random. Whichever I'm holding, the other is either double or half, and there's no asymmetry between the two envelopes, so it's 1/2 each way and I gain. Symmetry alone gets me there.**  
  - **Rating: -2** (Clearly wrong; misapplies symmetry.)  
  - **Surviving claims:** None; the reasoning is invalid.  
  - **Failing claims:**  
    - Symmetry does imply that the envelopes are identical ex ante (unconditionally), so the expected value of switching should be zero. However, Ben incorrectly assumes that for every possible value of the held envelope, P(other is double or half) = 1/2. This conditional probability is not guaranteed by symmetry alone; it depends on the prior.  
    - The claim "I gain" is false: ex ante symmetry means E[gain from switching] = 0, as switching cannot improve the expected value before any information is revealed.  
  - **Why -2?** Ben's argument contradicts the true implication of symmetry (no ex ante gain) and is mathematically inconsistent.

  **(4) Nadia: Symmetry alone gets you the opposite. Before you look the envelopes really are exchangeable, so the expected gain from switching is zero, not positive. You can't have it both ways: either the symmetry holds and there's no reason to switch, or it fails and then you owe me an actual prior over the amounts. And if you hand me any prior with a finite average amount, you can check the ex ante gain from switching comes out exactly 0, so your 1.25X has to be broken somewhere.**  
  - **Rating: +2** (Clearly correct; uses symmetry properly and generalizes to finite-prior cases.)  
  - **Surviving claims:**  
    - Symmetry implies exchangeability: ex ante, E[your envelope] = E[other envelope], so E[gain from switching] = 0.  
    - With any proper prior having a finite mean, E[gain from switching] = 0 ex ante.  
    - The 1.25X formula "has to be broken": it cannot hold for all X, as it leads to contradiction (e.g., at distribution boundaries, E[other | X] ≠ 1.25X).  
  - **Failing claims:** None; this is a robust defense against Ben's (3).  
  - **Why +2?** Nadia correctly applies symmetry and prior-based reasoning, resolving the ex ante case.

  **(5) Ben: Fine, granted, always-switch-before-looking is dead. But the case I care about is after you look. Say the organizer tells you the smaller amount is a whole number of dollars from 1 to 100 and every one of those was equally likely, and you open your envelope and see 40. Then you're either holding the smaller one, and switching wins you 40, or you're holding the bigger one, and switching costs you 20. Equal odds, 2:1 payoff, so you switch. And you'd switch at every amount up to 100 for the same reason. So looking genuinely buys you something you didn't have before, there's a concrete policy that beats never-switching, and anybody who says "give a proper prior and the whole thing dissolves, there's never anything to gain by switching" is just wrong.**  
  - **Rating: +2** (Correct for the specified prior; demonstrates a gain from information.)  
  - **Surviving claims (under the uniform 1–100 prior):**  
    - After seeing X=40, P(holding smaller | X=40) = P(holding larger | X=40) = 1/2, and E[gain from switching | X=40] = (1/2)(+40) + (1/2)(−20) = +10 > 0, so switching is beneficial.  
    - Similarly, for any observed X from 1 to 100, E[gain from switching | X] ≥ 0 (strictly > 0 for most X), so switching is favorable at all these points.  
    - Looking "buys you something": the information allows a policy (switch if X ≤ 100) that exploits the prior to achieve a higher expected value than never-switching. Specifically, under this prior, E[value with policy] ≈ 94.625 > E[value with never-switching] = 75.75.  
    - The claim that "there's never anything to gain by switching" is false under this prior; there is a conditional gain.  
  - **Failing claims:**  
    - The policy only "beats never-switching" because never-switching is a suboptimal baseline that ignores information; it does not beat an optimal strategy, but Ben is correct that it outperforms this specific alternative.  
  - **Why +2?** Ben provides a valid, prior-specific example where switching after looking is rational and improves on a naive policy.

  **(6) Nadia: No. Your policy only looks better because you're comparing it to never-switching, which was never the live alternative — the value of the envelope you're holding is what it is either way. And your 40 example assumes each number 1 to 100 was equally likely, which is the same indifference move I just objected to, only with a ceiling painted on it.**  
