       But we also derived that the condition is |cos(phi)| > sqrt(3)/2 OR we can use the condition on phi: |phi| in [0, π/6) or (5π/6, π] -> but note: we generated phi in [0,pi), so condition: phi < pi/6 or phi > 5*pi/6.
    4. Let's use the condition: chord_length = 2 * abs(cos(phi))   [because cos(phi) for phi in [0, pi/2) is positive, and in (pi/2, pi] is negative, so we take abs]
    5. Then count if chord_length > sqrt(3)   [which is equivalent to abs(cos(phi)) > sqrt(3)/2]
    Alternatively, we can avoid the abs by using symmetry: condition is phi in [0, pi/6) or (5*pi/6, pi). 
  - Analytic probability: 1/3.

  Note: In the condition for Group 5, we can also compute the perpendicular distance from the center: d = |sin(phi)|. Then the chord is long when d < 1/2. This is equivalent to |sin(phi)| < 1/2, which is the same as the condition above? Actually, no: we have two conditions: 
