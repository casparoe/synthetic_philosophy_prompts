  - Alternatively, we can avoid the min by noting the central angle is the smallest one, and we can also compute the Euclidean distance between the two points: 
      x1 = cos(theta1); y1 = sin(theta1)
      x2 = cos(theta2); y2 = sin(theta2)
      chord_length = sqrt((x1-x2)**2 + (y1-y2)**2)
    Then compare to sqrt(3).
  - Analytic probability: 1/3.

  **Group 2 (Random radius and random point on radius)**:
  - Description: "Choose a radius (a direction) uniformly at random. Then choose a point on that radius uniformly at random. The chord is perpendicular to the radius at that point."
  - Implementation:
    1. theta = 2*pi*random()
    2. d = random()   [uniform in [0,1], since R=1]
    3. half_chord = sqrt(1 - d**2)
    4. chord_length = 2 * half_chord
    5. threshold = sqrt(3)
    6. count if chord_length > threshold
    But condition: chord_length > sqrt(3) => 2*sqrt(1-d**2) > sqrt(3) => sqrt(1-d**2) > sqrt(3)/2 => 1-d**2 > 3/4 => d**2 < 1/4 => d < 0.5.
    So we can also count if d < 0.5.
  - Analytic probability: 1/2.

  **Group 3 (Random midpoint in the disk)**:
  - Description: "Choose a point uniformly at random inside the circle. This point is the midpoint of the chord. The chord is perpendicular to the radius at that point."
  - Implementation (with uniform in disk):
    1. r = sqrt(random())   [because to be uniform in area]
    2. theta = 2*pi*random()
    3. d = r   [distance from center, because we set R=1]
    4. half_chord = sqrt(1 - d**2)
    5. chord_length = 2 * half_chord
    6. count if chord_length > sqrt(3)   [which is equivalent to d < 0.5]
