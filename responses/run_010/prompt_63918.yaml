  **Group 4 (Throwing straws)**:
  - Description: "We throw a long straw at random from a great distance onto a circle of radius R. We keep only the straws that cross the circle. The chord is the segment inside the circle. To simulate: choose the perpendicular distance from the center to the straw uniformly in [0, R], and choose the angle of the straw uniformly in [0, 2π)."
