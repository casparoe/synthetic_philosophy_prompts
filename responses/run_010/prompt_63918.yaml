    4. chord_length = 2 * half_chord
    5. count if chord_length > sqrt(3)   [i.e., d < 0.5]
  - Analytic probability: 1/2.

  **Group 5 (Random endpoint and random direction)**:
  - Description: "Choose a point uniformly at random on the circumference. Then choose a direction uniformly at random from the set of directions pointing into the circle. The chord is drawn from the chosen point in the chosen direction until it hits the circle again."
  - Implementation:
