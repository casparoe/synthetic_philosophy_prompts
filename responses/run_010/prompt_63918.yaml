  ### Structured Session Plan for Bertrand's Paradox Activity

  #### **Framing Sentence to Open**  
  "Consider a circle of radius 1. We want to compute the probability that a randomly chosen chord is longer than the side of an inscribed equilateral triangle (which has length \(\sqrt{3}\)). Each group will implement a different method to generate random chords. Your task is to simulate 1 million chords, compute the fraction longer than \(\sqrt{3}\), and report the probability to 4 decimal places. Assume all methods are 'obviously' uniform and neutral."

  ---

  ### **Sampling Procedures**  
  *Assign one method per group (4–5 groups). Use \(R = 1\) for simplicity. Analytic results assume \(R = 1\).*

  1. **Method A: Two Random Endpoints (Textbook 1)**  
     - **Description**: "Choose two points uniformly at random on the circumference. The chord connects them."  
     - **Implementation**:  
       - \(\theta_1 = 2\pi \cdot \text{rand}()\), \(\theta_2 = 2\pi \cdot \text{rand}()\)  
       - Central angle \(\phi = \min(|\theta_1 - \theta_2|, 2\pi - |\theta_1 - \theta_2|)\)  
       - Chord length \(= 2 \sin(\phi / 2)\)  
       - Count if length \(> \sqrt{3}\)  
     - **Analytic Probability**: \(\frac{1}{3}\)  
       - \(\phi \sim \text{Uniform}(0, \pi)\) (density \(\frac{1}{\pi}\))  
       - Chord \(> \sqrt{3}\) \(\iff \phi > \frac{2\pi}{3}\)  
       - \(\mathbb{P}(\phi > \frac{2\pi}{3}) = \frac{\pi - 2\pi/3}{\pi} = \frac{1}{3}\)  

  2. **Method B: Random Radius + Point (Textbook 2)**  
     - **Description**: "Choose a radius uniformly (random direction). Pick a point uniformly along that radius. The chord is perpendicular to the radius at that point."  
     - **Implementation**:  
       - Direction \(\theta = 2\pi \cdot \text{rand}()\)  
       - Distance \(d = \text{rand}()\) (uniform on \([0, 1]\))  
       - Chord length \(= 2\sqrt{1 - d^2}\)  
       - Count if length \(> \sqrt{3}\) (equiv., \(d < 0.5\))  
     - **Analytic Probability**: \(\frac{1}{2}\)  
       - \(d \sim \text{Uniform}(0, 1)\)  
       - Chord \(> \sqrt{3}\) \(\iff d < 0.5\)  
       - \(\mathbb{P}(d < 0.5) = \frac{1}{2}\)  

  3. **Method C: Random Midpoint (Textbook 3)**  
     - **Description**: "Choose a point uniformly at random inside the circle. This is the chord’s midpoint."  
     - **Implementation**:  
       - Generate \(u = \text{rand}(), v = \text{rand}()\)  
       - \(r = \sqrt{u}, \theta = 2\pi v\) (uniform in disk)  
       - \(d = r\) (distance from center)  
       - Chord length \(= 2\sqrt{1 - d^2}\)  
       - Count if length \(> \sqrt{3}\) (equiv., \(d < 0.5\))  
     - **Analytic Probability**: \(\frac{1}{4}\)  
       - Density of \(d\) is \(2d\) (CDF \(d^2\))  
       - \(\mathbb{P}(d < 0.5) = (0.5)^2 = \frac{1}{4}\)  

  4. **Method D: Physical Straw Throwing**  
     - **Description**: "Throw long straws randomly from far away. Keep those crossing the circle. The chord is the intersection segment."  
     - **Implementation**:  
       - Perpendicular distance \(d = \text{rand}()\) (uniform on \([0, 1]\))  
       - Angle \(\theta = 2\pi \cdot \text{rand}()\)  
       - Chord length \(= 2\sqrt{1 - d^2}\)  
       - Count if length \(> \sqrt{3}\) (equiv., \(d < 0.5\))  
     - **Analytic Probability**: \(\frac{1}{2}\)  
       - Identical to Method B.  

  5. **Method E: Random Endpoint + Direction (Your Request)**  
     - **Description**: "Choose a point uniformly on the circumference. Pick a direction uniformly from all inward angles. The chord extends in that direction to the opposite side."  
     - **Implementation**:  
       - Point \(\alpha = 2\pi \cdot \text{rand}()\)  
       - Direction \(\beta = \pi \cdot \text{rand}()\) (uniform on \([0, \pi]\))  
       - Chord length \(= 2|\cos(\beta)|\)  
       - Count if length \(> \sqrt{3}\) (equiv., \(|\cos \beta| > \sqrt{3}/2\))  
     - **Analytic Probability**: \(\frac{1}{3}\)  
       - \(\beta \sim \text{Uniform}(0, \pi)\)  
       - Chord \(> \sqrt{3}\) \(\iff \beta \in (0, \pi/6) \cup (5\pi/6, \pi)\)  
       - Measure \(\frac{\pi}{3}\), probability \(\frac{\pi/3}{\pi} = \frac{1}{3}\)  
     - **Agreement with Method A**:  
       - Perpendicular distance \(d = |\sin \beta|\).  
       - Distribution of \(d\) matches Method A (density \(\frac{2}{\pi \sqrt{1 - d^2}}\)).  
       - Thus, same probability \(\frac{1}{3}\).  

  ---

  ### **Staging the Reversal (Groups A and E)**  
  - Groups A and E both get \(\approx 0.3333\).  
  - During report-out, highlight their agreement: "Groups A and E both got 0.3333. Their methods sound different, but they agree numerically. Does this mean both are correct?"  
  - **Debrief Twist**:  
    - Reveal that both methods produce identical distributions of the chord’s perpendicular distance from the center (density \(\frac{2}{\pi \sqrt{1 - d^2}}\)).  
    - "Agreement isn’t validation—it just means they implemented the *same physical process* in different geometric terms. Two methods can agree and both be wrong for the intended problem."  

  ---

  ### **Third Act: Load-Testing Analogy (15 min)**  
  - **Scenario**: "Your team load-tests a server. You randomize request rates via:  
    - **Method X**: Draw latency \(L \sim \text{Uniform}(0.1, 0.5)\) sec, then rate \(R = 1/L\) req/sec.  
    - **Method Y**: Draw rate \(R \sim \text{Uniform}(2, 10)\) req/sec."  
  - **Task**: "Compute \(\mathbb{P}(R > 5)\). Do not code—use algebra. Which method is 'uniform'?"  
  - **Result**:  
    - Method X: \(\mathbb{P}(R > 5) = \mathbb{P}(L < 0.2) = (0.2 - 0.1)/(0.5 - 0.1) = 0.25\).  
    - Method Y: \(\mathbb{P}(R > 5) = (10 - 5)/(10 - 2) = 0.625\).  
  - **Key Insight**: "Both are called 'uniform,' but they parameterize differently. The physical context (what you randomize) determines correctness."  

  ---

  ### **Handling Deflationary Responses**  
  - **When someone says**: "This isn’t a paradox—just specify the distribution!"  
  - **Force Commitment**:  
    - "Suppose you *must* bet $1000 on the probability. You’re told chords are generated by throwing straws, but nothing else. Which method do you use?"  
    - Groups will split (B/D for \(1/2\), others for \(1/3\) or \(1/4\)).  
    - **Reveal**: "Straw throwing implies Method B/D (\(1/2\)). But if you thought 'uniform chord' meant endpoints or midpoints, you lose. The description underdetermines the distribution."  
  - **Why it Works**: Forces acknowledgment that real-world "uniform" descriptions often omit the parameterization, leaving room for contradiction.  

  ---

  ### **Materials and Timing (90 min Total)**  
  1. **0–5 min**: Framing, group assignment (1 method/group).  
     - **Projector**: Circle diagram, equilateral triangle, \(\sqrt{3}\) side length.  
  2. **5–40 min**: Groups code and run simulations (1M trials).  
     - **Printed Cards**: Method descriptions, implementation steps, analytic probabilities (hidden).  
     - **Pre-Debugged Code**: Facilitator has working versions for all methods.  
  3. **40–45 min**: Report results.  
     - **Projector**: Table with group names, methods (masked), results.  
     - **Fast Collection**: Use shared Google Sheet or physical whiteboard.  
  4. **45–55 min**: Reveal discrepancies. Highlight A/E agreement.  
  5. **55–70 min**: Third act (load-testing).  
  6. **70–85 min**: Debrief (questions below).  
  7. **85–90 min**: Wrap-up.  
  - **If Code Broken at 40 min**: Provide pre-run results. Say: "Simulations are tricky; here’s what a correct run gives."  
  - **Low Attendance (6 people)**: Merge Methods B/D (same result), drop Method C.  

  ---

  ### **Debrief Questions**  
  1. "Why did methods disagree despite solving the 'same' problem?"  
     - **Point**: "Uniformly random" assumes a parameterization (endpoints, midpoints, etc.).  
  2. "Why did Methods A and E agree? Does that make them correct?"  
     - **Point**: Agreement ≠ correctness; they share a hidden parameterization (distance distribution).  
  3. "In load-testing, which 'uniform' is right? What does it depend on?"  
     - **Point**: Physical process (what you randomize) breaks the symmetry.  
  4. **Jaynes’ Invariance Argument**:  
     - "A valid solution should be invariant under translation/rotation/scaling. Only Methods B/D (straw-like) satisfy this, giving \(1/2\)."  
     - **Objection**: "Why not rotational symmetry *of the chord endpoints*? That gives \(1/3\). Invariance requirements aren’t unique."  
  5. **Conclusion**: "Without physical context, the problem is underdetermined. Indifference isn’t neutral—it smuggles in a parameterization."  

  ---

  ### **Predictable Problems**  
  - **Bugs**:  
    - Method C (midpoint): Forgetting \(\sqrt{u}\) for uniform disk → bias toward center, \(\mathbb{P} \approx 0.15\) (should be 0.25).  
    - Method A: Using Euclidean distance without \(\min(\phi, 2\pi - \phi)\) → \(\mathbb{P} \approx 0.22\) (should be 0.333).  
  - **Floating-Point Error**: Comparing chord length to \(\sqrt{3}\) with tolerance (use \(\pm 10^{-6}\)).  
  - **Early Finishers**: Ask, "Does your result change if \(R \neq 1\)?" (It shouldn’t.)  
  - **Skeptic**: "This is just frequentist vs. Bayesian!" → Redirect: "The paradox arises in both frameworks. It’s about parameterization, not probability interpretation."  
  - **Reduced Trials (100K)**: Results still diverge (0.33±0.003, 0.50±0.003, 0.25±0.003).  

  ---

  ### **Honest Limits**  
  - **Simulations Only Show Disagreement**: They cannot validate any method. The "reasonable" pull of indifference comes from symmetry, not code.  
  - **Building Intuition for Indifference**:  
    - Stage a choice: "How would you generate a random chord if you *had* to?" Most pick endpoints (Method A) or midpoints (Method C).  
    - Then reveal: "Another team chose this other 'obvious' method. Who’s right?"  
    - **Why it Fails**: Engineers reject indifference; they demand physical context. Use this! Conclude: "Indifference is a last resort when context is absent—but it’s fragile."  
  - **What You Must Supply**:  
    - The intuition that some symmetries "feel" natural (e.g., rotational invariance for straws).  
    - Jaynes’ argument as a contested resolution ("Physicists prefer 1/2; mathematicians say it’s underspecified").  

  --- 

  ### **Final Preparation**  
  - **Pre-Run All Methods**: Confirm \(10^6\) trials yield:  
    A: 0.333, B: 0.500, C: 0.250, D: 0.500, E: 0.333.  
  - **Print Cards**: Method descriptions, implementation steps.  
  - **Projector Slides**: Problem statement, results table, load-testing scenario, debrief questions.  
  - **Whiteboard**: For group results and bet commitments.  

  This design ensures the collision is visceral, the reversal stings, and the takeaway is "uniform isn’t universal." No philosophy prerequisites needed—just code and conflict.
