    In Method 1: d = R * cos(Φ/2) and Φ uniform in [0,π]. Let u = Φ/2, which is uniform in [0, π/2]. Then d = R * cos(u). The cumulative distribution of d: P(d <= x) = P(cos(u) <= x/R) = P(u >= arccos(x/R)) = (π/2 - arccos(x/R)) / (π/2). The density is the derivative.

    In Method 5: d = R * |sin(phi)| with phi uniform in [0,π). The cumulative distribution: P(d <= x) = P(|sin(phi)| <= x/R) = P(0 <= phi <= arcsin(x/R) or π - arcsin(x/R) <= phi <= π) = [arcsin(x/R) - 0 + π - (π - arcsin(x/R))] / π = [2 arcsin(x/R)] / π? Actually, the intervals: [0, arcsin(x/R)] and [π - arcsin(x/R), π]? The length of the first interval: arcsin(x/R), the second: arcsin(x/R). Total: 2 arcsin(x/R). Then P(d<=x) = 2 arcsin(x/R) / π.

    Now, for Method 1: P(d<=x) = 1 - (2/π) * arccos(x/R) [because u in [0,π/2], and P(u>=v)= (π/2 - v)/(π/2) = 1 - 2v/π, where v = arccos(x/R)].

    Now, note that arcsin(t) + arccos(t) = π/2. Therefore, arccos(t) = π/2 - arcsin(t). So P(d<=x) in Method 1: 1 - (2/π)*(π/2 - arcsin(x/R)) = 1 - (1 - (2/π) arcsin(x/R)) = (2/π) arcsin(x/R). This is the same as in Method 5.

    Therefore, the distribution of d is the same in Method 1 and Method 5. So they should both give the same probability: 1/3.

    So your algebra is correct. We'll have Group 1 and Group 5 both get 1/3.

  ### 3. Staging the Agreement and Then the Reversal
  We assign Group 1 (two random endpoints) and Group 5 (random endpoint and random direction) to work separately. They will both get approximately 0.3333. We then have them report together and they see they agree. Then in the debrief we point out that they are actually the same method in disguise (because the distribution of the perpendicular distance is the same). But that does not make either of them the "correct" method.

  ### 4. Third Act: Load Testing Example
  We propose: 
  - Scenario: We want to model the request rate of a server. We have two ways to set up a load test:
    - **Method A**: Draw the per-request latency (in seconds) uniformly from [0.1, 0.5]. Then the request rate (in requests per second) is 1/latency.
    - **Method B**: Draw the request rate uniformly from [2, 10] (which is 1/0.5 to 1/0.1).

  We ask the participants: if we run both methods and then ask for the probability that the request rate is greater than 5 requests per second, what do we get?

  - **Method A**: 
    - Latency `L` ~ Uniform[0.1, 0.5]
    - Rate `R = 1/L`
    - P(R>5) = P(1/L>5) = P(L<0.2) 
    - Since L is uniform on [0.1,0.5], P(L<0.2) = (0.2-0.1)/(0.5-0.1) = 0.1/0.4 = 0.25.

  - **Method B**:
    - Rate `R` ~ Uniform[2,10]
    - P(R>5) = (10-5)/(10-2) = 5/8 = 0.625.

  So we get 0.25 vs 0.625.

  We present the scenario and ask the participants: 
    "Your team is load testing a server. To simulate a variety of conditions, you decide to randomize the request rate. Two proposals are made:
     Proposal A: 'We choose a latency uniformly between 0.1 and 0.5 seconds, and then set the request rate as 1/latency.'
     Proposal B: 'We choose a request rate uniformly between 2 and 10 requests per second.'
     What is the probability that the request rate is above 5 in each proposal? Which one is the right way to randomize?"

  We have them compute the probabilities without code (since it's simple). Then we ask: "If the problem statement is 'choose a request rate uniformly at random', which one is correct? And if the problem is about the latency being uniform, then which one? But what if the problem does not specify the physical mechanism? Which one would you use and why?"

  This should take about 15 minutes.

  ### 5. Deflationary Response
  We expect someone to say: "This is just an unspecified problem; once you specify the distribution, it's determined." We build in a bet:

  At the beginning, after the framing, we say: "Before we start, I want each group to write down their best guess for the probability. Also, write down a confidence level: how sure are you that you are within 0.01 of the true probability? We'll see who gets closest."

  Then, after they run their simulations and see the different answers, they see that their confidence might have been misplaced. Then we ask: "If I told you that the chords are generated by throwing straws, which method would you use? What if I told you that the chords are generated by choosing two random points on the circumference? So the generating process matters, and the problem statement might not specify it."

  ### 6. Materials and Timing
  - **Total time**: 90 minutes.
  - **Minute 0-5**: Introduction and framing. Assign groups. Each group gets a card with their method. Projector: the problem statement and the condition (chord longer than side of inscribed equilateral triangle, which is R√3).
  - **Minute 5-40**: Groups code and run. They run 1e6 trials. They compute the probability.
  - **Minute 40-45**: Groups write their probability on a whiteboard or the facilitator collects and puts on a slide.
  - **Minute 45-55**: Show the results: 1/3, 1/2, 1/4, 1/2, 1/3. Highlight the agreement between Group 1 and Group 5. Then ask: "How can the same problem have different probabilities? What is the difference in the methods?"
  - **Minute 55-70**: Third act: load testing example. Present and have them compute.
  - **Minute 70-85**: Debrief: principle of indifference, parameterization, and invariance.
  - **Minute 85-90**: Wrap-up.

  **What if a group's code is broken at minute 40?**: Have a precomputed result for each method to show. Or have a backup code snippet to give them. Or if they are close, let them report what they have and then note that it's approximate.

  ### 7. Debrief
  Questions to ask:
  - "What did you assume when you implemented your method? What did you consider to be uniform?"
  - "Why did Group 1 and Group 5 get the same answer? Are they really the same method?"
  - "In the load testing example, which method is correct? What does it depend on?"
  - "How can we resolve the paradox? One argument is that the probability should be invariant under translations and scalings of the circle. That is, if we move the circle or make it bigger, the probability should not change. This is Jaynes' argument. He showed that only one of the methods (the one with probability 1/2) is invariant under these transformations. But note: the method that is invariant is the one that throws straws (our Method 4) or the random radius with uniform distance (Method 2). But wait: Jaynes argued for the 1/2 answer? Actually, he did: he said the probability should be 1/2. But note: our Method 2 and Method 4 both give 1/2. But the invariance argument: if you rotate the circle, the distribution should be the same. Also, if you scale the circle, it should be the same. Jaynes showed that the only method that is invariant under rotations and scalings is the one that has the distribution of the distance from the center uniform (which is our Methods 2 and 4). 

    However, the objection is that there are other symmetries. For example, if you require invariance under rotations and translations of the circle, but also under other transformations? Some argue that the group of symmetries is not uniquely determined.

    We present: Jaynes' solution says 1/2, but others disagree. The point is that the principle of indifference by itself is not enough; we need to know which symmetries to respect.

  ### 8. Predictable Problems
  - **Coding errors**:
    - Method 3 (random midpoint in disk): if they generate by `r = R * random()` and `theta = 2*pi*random()`, then the distribution is not uniform (it's more points near the center). They must use `r = R * sqrt(random())`.
    - Method 1: when computing the central angle, they might take the absolute difference and then forget to take the minimum with `2*pi - diff`. But note: we derived that the central angle (the smaller one) is uniform in [0,π]. So they can generate the central angle directly as `phi = pi * random()` and then chord length `2*R*sin(phi/2)`. But the card says two random endpoints, so they might do it by generating two points. They might generate two points and then compute the Euclidean distance: that's fine, but then they must compare to `R√3`.
    - Method 5: they might be confused about the angle. If they generate the direction angle `phi` uniformly in [0,π], then the chord length is `2*R*abs(cos(phi))`? Actually, we have chord length `2*R*|cos(phi)|` for `phi` in [0,π]? But wait, we derived that the condition is `|sin(phi)| < 1/2`? Or `|cos(phi)| > √3/2`? We must be consistent.

    We will provide the implementation recipe clearly in the card.

  - **Comparing to R√3**: They might compute the chord length and compare to `R * sqrt(3)`, but if they use a different R (like R=1) then they must adjust. But they should use R=1 for simplicity.

  - **Group finishes early**: Have an extension: "What is the distribution of the chord length?" or "What if the circle has radius R? Does your result depend on R?" (it shouldn't).

  - **Frequency vs Bayes**: If someone brings this up, note that the paradox is about the definition of randomness, not about frequency vs Bayes.

  - **Reducing the number of trials**: With 100,000 trials, the standard error is about 0.0016 for a probability of 1/3 (variance = p(1-p)/n). So the estimates will be within about 0.003 of the true value with 95% confidence. That's enough to see the differences (1/3≈0.333, 1/2=0.5, 1/4=0.25).

  - **Only 6 people**: Assign one method per group, and have two groups do the same method? But we need at least three methods. Or we drop one method. We can drop Method 4 (straw throwing) because it is similar to Method 2? Or we drop Method 5? But we want the agreement between 1 and 5. So we might have to combine. Or we have three groups: 
    - Group 1: Method 1 and also do Method 5? That might be too much. 
    Alternatively, we do only three methods: 1, 2, and 3. And then the facilitator provides the result for Method 5 and says that it matches Method 1. And then the physical method (Method 4) is mentioned in the debrief.

  ### 9. Honest Limits
  We acknowledge that the simulation only shows the inconsistency, not which one is right. The principle of indifference might not be intuitive. We have to supply by hand: 
  - The intuition that in the absence of information, we should not prefer one parameterization over another. 
  - The idea that symmetry can guide us (Jaynes' argument). 

  We can stage a moment: present a physical setup (straw throwing) and ask: "Which method would you use now?" Then they see that the physical process dictates the distribution. Then ask: "But if I don't tell you the physical process, can you still answer?" Then they see that the principle of indifference is what they use in the absence of information, but it leads to contradictions.

  To produce the pull of the principle of indifference, we can ask: "How would you choose a chord if you had to do it with no information about how it is generated?" They might come up with one of the methods. Then we show that another method is equally natural.

  This is difficult to stage without lecturing. We might have to settle for them seeing the ambiguity.

  ### Implementation Recipes for Groups
  We assume R=1 for simplicity.

  **Group 1 (Two random endpoints)**:
  - Description: "Choose two points independently and uniformly on the circumference. The chord is the line connecting them."
  - Implementation:
    1. theta1 = 2*pi*random()
    2. theta2 = 2*pi*random()
    3. central_angle = min(abs(theta1-theta2), 2*pi - abs(theta1-theta2))
    4. chord_length = 2*sin(central_angle/2)   [since R=1]
    5. threshold = sqrt(3)   [because R√3 = sqrt(3) when R=1]
