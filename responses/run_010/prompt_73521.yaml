answer: |-
  ## Joint Statement: Virtue-Oriented and Consequentialist Reconstructions of Buddhist Ethics

  **1. Agreed Claims**  
  Both camps affirm the following as foundational to Buddhist ethics:

  1.  **Primary Object of Evaluation:** The tradition centrally evaluates the quality of the agent's mind (*citta*) and the volition (*cetanā*) underlying an action. Rightness is fundamentally tied to the mental state from which action springs.
  2.  **Status of *Cetanā*:** Volition (*cetanā*) is definitively identified as karma (*kamma*) in the primary sources. The moral quality of an action is inseparable from the quality of the intention that wills it.
  3.  **Role of the Four Immeasurables (*Brahmavihāras*):** Cultivating loving-kindness (*mettā*), compassion (*karuṇā*), empathetic joy (*muditā*), and equanimity (*upekkhā*) is essential for the development of skillful (*kusala*) character and is central to the path towards liberation (*nibbāna*). These qualities directly inform and shape right intention and action.
  4.  **Absence of Genuine Moral Dilemmas:** The tradition holds that an agent possessing sufficient wisdom (*paññā*) and skillful means (*upāya-kosalla*) can always discern and undertake a course of action that avoids wrongdoing (*akusala*). Genuine dilemmas, where every possible action is equally wrong, are not admitted; skillful options exist, though they may be difficult to perceive or undertake.

  **2. Residual Disagreements**

  | Disagreement Stated Neutrally                                                                 | Virtue-Oriented Position                                                                     | Consequentialist Position                                                                      | Objections/Tendentiousness                                                                                                                               |
  | :-------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | Whether the cultivation of virtues like non-attachment (*virāga*) and wisdom (*paññā*) is intrinsically good or primarily instrumentally valuable for achieving liberation and reducing suffering. | These virtues constitute the very essence of skillful character (*kusalacitta*) and are intrinsically good states defining the liberated mind; their cultivation *is* the unfolding of *nibbāna*. | While essential, these virtues are primarily cultivated *because* they reliably produce liberation (*nibbāna*) and reduce suffering (*dukkha*) across lifetimes; their value is instrumental to these ultimate ends. | **Virtue:** Consequentialist view reduces character to a tool, neglecting its intrinsic moral worth & the non-instrumental nature of *nibbāna* as freedom from defilements. <br> **Consequentialist:** Virtue view risks making character an end-in-itself disconnected from the soteriological goal of ending suffering. |
  | Whether the precepts (*sīla*) and rules of training derive their authority from reliably producing good consequences or from expressing the virtuous character of an arhat/bodhisattva. | Rules express the spontaneous, perfected dispositions (*cetasika*) of the awakened being; their authority stems from embodying virtue, not predictive outcomes. | Rules are summaries of empirically reliable means for avoiding harm and accumulating conditions favorable for progress on the path; their authority is pragmatic and consequence-based. | **Virtue:** Consequentialist view makes rules contingent and potentially overridable based on predicted outcomes, undermining their stability. <br> **Consequentialist:** Virtue view provides no clear justification for *why* specific rules express virtue beyond circularity or tradition. |
  | Whether skillful means (*upāya-kosalla*) in difficult cases fundamentally involves perceiving the action consistent with perfected virtue or calculating the action yielding the best net outcome. | Skillful means arises from perfected wisdom and compassion; the virtuous agent sees the single right action expressing those qualities, not a calculation. | Skillful means requires assessing complex situations, including long-term karmic consequences, to determine which available action minimizes suffering/maximizes liberation potential. | **Virtue:** Consequentialist view imports alien "calculation" and potentially justifies harmful acts for "greater good," violating core non-harming (*ahiṃsā*). <br> **Consequentialist:** Virtue view cannot adequately explain novel dilemmas without implicit appeal to consequences and offers no procedure for discernment beyond "being virtuous." |

  **3. Cruxes**

  **(a) Merit Transfer:** **Not a Crux.** Both camps can explain the mechanics within their frameworks: The virtue camp sees the departed's rejoicing as their own wholesome mental act, preserving agent-relativity. The consequentialist camp sees it as a transfer mechanism involving the recipient's mental state changing due to external cause, compatible with outcome-focus. Settling it wouldn't *move* either camp; each interprets the phenomenology consistently with their core principles.

  **(b) Skillful Means and Killing:** **Genuine Crux.** The textual presentation (permitted, required, excused) is highly significant. If the act is presented as *required* or *permitted* (not merely excused) for a bodhisattva motivated by compassion, it strongly supports the consequentialist view that net outcome can justify otherwise prohibited acts. The virtue camp would be moved towards conceding a significant role for consequences if required/permitted; conversely, if only excused, it supports the virtue view that the act remains karmically negative despite compassionate intent, with the focus on the agent's sacrifice.

  **(c) Karma as Volition - Criterion vs. Mechanism:** **Not a Crux in Strict Sense.** The debate *is* this very question. Settling it *would* resolve the core disagreement, but it cannot be "settled" independently as a sub-question; it *is* the fundamental point of contention articulated in section 2. It's the root, not a branch.

  **(d) Near/Far Enemies of Immeasurables:** **Genuine Crux (for Consequentialist Camp).** If the near/far enemy analysis demonstrably functions as an *internal standard of character correctness* (e.g., distinguishing true *upekkhā* from indifference based purely on the mental quality itself, irrespective of typical outcomes), this would challenge the consequentialist claim that dispositions are *only* evaluated for outcome reliability. It could move the consequentialist camp to acknowledge a significant character-internal evaluative dimension. The virtue camp already accepts this internal standard.

  **(e) Rebirth Horizon Collapsing Rule/Outcome Distinction:** **Not a Crux.** Both camps agree the horizon massively expands the scope of consequences. The virtue camp maintains rules express virtue *and* reliably lead to good rebirths; the consequentialist camp sees rules as summaries *because* they lead to good rebirths. Neither sees the expanded horizon fundamentally changing the *nature* of the rule (expression vs. summary); it just makes the consequences more comprehensive. Settling the scope doesn't alter the nature of the disagreement about the rule's foundation.

  **4. Tests and Predictions**

  *   **(b) Skillful Means and Killing:**
      *   **Test Case/Pattern:** Detailed exegesis of the Ship's Captain story (and similar Mahāyāna *upāya* narratives like the Healing *Bhaiṣajyaguru* vows) focusing on the Buddha's/Bodhisattva's explicit judgment of the act and the karmic result for the captain. Does the text explicitly praise the act as skillful (*kusala*), present it as a bodhisattva's duty, mitigate the karmic retribution significantly, or merely excuse it due to motive while affirming negative karmic fruit?
      *   **Virtue Camp Prediction:** The act will be framed as a profound, compassionate sacrifice by the captain, bearing heavy negative karma himself, undertaken only in extremis. It is *excused* (perhaps even lauded for compassion/sacrifice) but not presented as *right* (*kusala*) or karmically neutral/positive; the negative fruit is inevitable but the captain accepts it. The primary focus is the captain's character in undertaking the sacrifice.
      *   **Consequentialist Camp Prediction:** The act will be explicitly presented as *kusala* (or its Mahāyāna equivalent) *because* it prevented immense suffering and worse karma for the killer, outweighing the negative karma incurred. It is permitted or even required for a compassionate being with the capacity to bear the karmic cost effectively. The karmic result for the captain, while negative, is presented as preferable to the alternative outcomes.
      *   **Discrimination:** Predictions differ significantly on the karmic status of the act and its justification.

  *   **(d) Near/Far Enemies:**
      *   **Test Case/Pattern:** Analysis of commentarial explanations (e.g., Visuddhimagga or Śāntideva) for *why* a near enemy (e.g., attachment for *mettā*, grief for *karuṇā*, exhilaration for *muditā*, indifference for *upekkhā*) is counterfeit. Is the criticism based *solely* on the disposition's typical negative consequences (e.g., attachment leads to clinging/suffering, grief is paralyzing), or is there an argument based on the *intrinsic deficiency* of the mental state itself *as* a corruption of the pure immeasurable, regardless of its usual outcomes?
      *   **Virtue Camp Prediction:** Commentaries will provide reasons grounded in the *inherent nature* of the mental state – e.g., attachment involves clinging and possessiveness, fundamentally different from the non-attached warmth of *mettā*; indifference lacks the balanced care and discernment of true *upekkhā*. Consequences may be mentioned, but the primary distinction is internal to the quality of the mind state.
      *   **Consequentialist Camp Prediction:** Commentaries will primarily (or solely) justify labeling near enemies as counterfeits by pointing to their *dysfunctional outcomes* – attachment leads to suffering, grief prevents effective action, exhilaration is unstable, indifference leads to neglect. The standard of "correctness" is functional: does it reliably support the path and reduce suffering?
      *   **Discrimination:** Predictions differ on the primary basis for the distinction (intrinsic quality vs. functional outcome). Finding strong intrinsic-quality arguments could move the consequentialist camp.

  **5. Verbal Dispute**

  The dispute over whether to label Buddhist ethics "consequentialist" is partly verbal, centering on the definition of "consequentialism." If both camps agree to define consequentialism strictly as any theory locating the *criterion of rightness* solely in the value of outcomes (states of affairs to be brought about), then:

  *   **Boundary of Verbal Dispute:** The Virtue camp argues that labeling Buddhist ethics "consequentialist" under this definition is incorrect because: (1) *nibbāna* is not primarily a state of affairs to be brought about but the extinction of defilements (*kilesa*), and (2) the criterion of rightness (*kusala*) is the quality of intention/character, which may *cause* good outcomes but is not *defined* by them.
  *   **Residual Substantive Disagreement:** Even if the label "consequentialism" is set aside, the core disagreement **remains**: Is the goodness of skillful (*kusala*) mental states/actions constituted *by* their tendency to produce liberation/reduce suffering (Consequentialist Camp), or is their goodness inherent in the state/character itself, *explaining why* they produce those outcomes (Virtue Camp)? The disagreement is about the direction of justification: Does character derive its value from outcomes, or do outcomes derive their value from the character that produces them (or the defilements they extinguish)?
