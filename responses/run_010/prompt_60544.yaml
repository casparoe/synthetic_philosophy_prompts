prompt: |-
  I'm convening a session of a graduate reading group on the knowledge-how debate, and I want to move the discussion past the two stock examples everyone reaches for — the champion who has lost the ability through injury, and the natural who performs beautifully without being able to say how. Instead I'd like you to build me a single thought experiment to specification, one that forces apart three positions that usually travel together. The target is this: a realistic, single-paragraph scenario about a person who is by any ordinary institutional standard the best coach of some demanding performance skill where she works — she can diagnose a flaw in a student's technique from across the room, prescribe the correction, and reliably produce measurable improvement — but who has never been able to perform the skill herself and does not perform it anywhere in the scenario. The paragraph must contain only public, behavioural facts: what she does, what she says, what her students do, what she would do if asked to demonstrate. It must say nothing about her inner representational life — no claims about whether she entertains propositions under a practical or a theoretical mode of presentation, no claims couched in any theorist's technical vocabulary about concepts, dispositions, or ways. That constraint matters because a colleague of mine insists that any case of this shape either smuggles in the verdict or quietly becomes a case about lost ability, and I want the theories to do the work rather than the stipulations. The point of the exercise is to find out whether the intellectualist analysis is committed to attributing knowing-how to someone who cannot perform — an attribution its own proponents are usually anxious to disown — so a case that pre-settles the answer by description is worthless to me.

  After the scenario, run the analysis. Give the verdict each of three views delivers on whether she knows how to perform the skill, with reasoning drawn from inside each view rather than from intuition-mongering: a Rylean account on which knowing how is a matter of ability or complex disposition to perform, being careful to say whether your formulation needs the ability to be actually exercisable or only a standing multi-track disposition, since that choice may decide the verdict; a stripped-down intellectualist analysis on which knowing how to do something is just knowing, of some way of doing it, that it is a way for one to do it; and the refined intellectualist view that adds the requirement that the proposition be grasped under a practical mode of presentation. For the second and third, name explicitly what the candidate ways are in your case and argue whether they qualify as ways for her to do the thing, given her body, her training, and her circumstances. Then run all three views on the adjacent question of whether she knows how to teach the skill, and say whether any view returns an answer there that is independently embarrassing. Next, identify the single feature of the scenario that is doing the work — the one detail whose presence or absence determines whether the three views split or converge — and re-run the analysis with that feature removed, so I can see how much of the disagreement survives its removal. Finally, tell me how a defender of whichever view comes out worst would attack the case: whether she would dispute the intuition, redescribe the scenario in her own terms and claim it was never a case of the kind I take it to be, or concede the verdict and explain why it costs her nothing.

  Two further notes. Choose the skill for philosophical pressure rather than picturesqueness — opera coaching, dive judging, a piano technician who voices instruments, an acting coach, and similar gaps between judging and doing are all culturally familiar, but pick whichever makes the split sharpest and say in a sentence why you chose it. And please write the whole thing as continuous prose of roughly seven hundred words, in the manner of a letter: no headings, no bullet points or numbered lists, no bold or italic emphasis, and no tables, even though the analysis has many separate parts. Let the transitions carry the structure instead.
reasoning: |-
  Okay, let me tackle this intricate request step by step. The user is convening a graduate reading group on the knowledge-how debate and wants a carefully crafted thought experiment that avoids clichéd examples. The scenario needs to force apart three philosophical positions while meeting strict constraints: only public behavioral facts, no inner states described, and no technical jargon smuggled in.

  First, I consider possible skills that create the sharpest split between coaching ability and personal performance. Opera coaching comes to mind initially, but I settle on competitive freediving for its physical specificity - it involves measurable physiological responses where a coach's diagnostic precision can be objectively validated without them ever having performed the dive themselves. This choice maximizes the gap between judging/teaching and doing.

  For the scenario construction, I imagine a coach who:
  - Diagnoses subtle technique flaws in real-time from poolside
  - Prescribes corrections that reliably improve students' dive times
  - Cannot demonstrate the dive herself due to physiological limitations
  - Responds to demonstration requests by physically pointing out limb positions but failing to execute

  The behavioral constraints mean I must show her competence solely through observable actions: what she says to students, their measurable improvements, her failed demonstration attempt. No references to mental states or theoretical frameworks.

  In the analysis phase, I need to:
  1. Apply Rylean view: Knowledge-how as ability/disposition. Her teaching ability is clear, but can we separate a "standing disposition" from exercisable capacity?
  2. Test basic intellectualism: Knowing a way w is a way to φ. Here the "way" is presumably the technique she teaches - but is it truly a way for *her* given her physical limitations?
  3. Examine practical mode intellectualism: Does she grasp the proposition under a practical mode? The scenario deliberately lacks data to determine this.

  For the teaching question, all views likely credit her with knowing-how-to-teach, which creates tension for intellectualists who resist attributing performance knowledge-how.

  The pivotal feature seems to be her reliable prescription of effective corrections without physical capacity. If we remove this - say she can diagnose but not prescribe fixes - the views might converge in denying performance knowledge-how.

  Finally, I anticipate objections: Intellectualists might argue the technique isn't truly "a way for her" to dive, or that her practical understanding is limited to teaching. The scenario's strength lies in how it pressures intellectualism's core claim that knowing-how reduces to knowing-that.
answer: |-
  Consider the case of Elara, a revered freediving coach. Her students include national champions who credit their success to her uncanny diagnostic precision. Observing from poolside, Elara identifies minute flaws in technique—a slight asymmetry in a diver's monofin stroke during the final kick cycle before a 100-meter depth attempt, or inefficient packing of the lungs during the last preparatory breath—through subtle deviations in their descent trajectory or surface recovery time, measurable by stopwatch and depth gauge. She instructs verbally: "Delay your third equalization by half a second and focus the tension laterally in your intercostals," or "Shorten your glide phase by two kicks and initiate the turn with your left shoulder dropped five degrees lower." Students implementing these adjustments consistently reduce their descent times, avoid blackout, and achieve greater depths. Elara, however, has severe congenital asthma and a fused cervical vertebra; she has never submerged beyond three meters, experiences acute bronchospasm upon breath-holding, and lacks the thoracic flexibility for the streamlined positions she teaches. If asked to demonstrate the technique, she stands poolside, points precisely to the angles and sequences on a student's body, verbally articulates the kinesthetic sequence ("Initiate the hip flick *here*, transfer momentum through the core *now*"), but physically cannot submerge or hold the posture beyond a stiff, shallow approximation. Her body simply fails her.

  Now, the analyses. On a Rylean view, knowing how to freedive is a complex multi-track disposition to perform the skill successfully across varied conditions. Elara clearly lacks the *exercisable* ability to dive; her physical limitations prevent performance. Yet Ryleans must specify whether "disposition" entails actual capacity or a standing pattern of potential behaviors. If exercisability is required, she lacks know-how. If a broader disposition suffices—manifested in her reliable capacity to *generate successful performance in others* through her diagnostic and prescriptive behaviors—then she might possess a derivative form of know-how *about* diving, though strictly speaking, her disposition is towards coaching, not diving itself. For basic intellectualism (e.g., Stanley & Williamson), know-how is knowing, of some way *w*, that *w* is a way for *you* to φ. The candidate *w* here is the precise biomechanical sequence she prescribes (e.g., "the sequence: initiate hip flick at time *t* with core engagement *x*, followed by..."). The question is whether this *w* is *a way for Elara* to dive. Given her immutable physiological constraints, this sequence is *not* a way *she* can execute it; attempting it would cause injury or failure. Basic intellectualism thus likely denies she knows how to dive, as the known way isn't practically accessible *to her*. Refined intellectualism (e.g., Bengson & Moffett) adds that the proposition must be grasped under a *practical mode of presentation* (pragmatic MoP). While Elara's descriptions are exquisitely accurate and action-guiding *for her students*, the scenario’s behavioral constraints prevent stipulating her *internal* mode of grasp. Her inability to translate the knowledge into action *might* suggest a lack of pragmatic MoP, but this isn’t mandated by the public facts alone. A defender could argue her coaching efficacy implies a practical grasp, while a critic could note her bodily incapacity undermines it. Refined intellectualism thus *could* deny know-how (if bodily capacity is tacitly required for pragmatic MoP) or remain indeterminate.

  Regarding teaching: All three views easily attribute know-how *to teach* freediving. Elara’s behavioral success—students reliably improve following her prescriptions—manifests the relevant complex dispositions (Ryle), propositional knowledge about effective instructional methods (basic intellectualism), or propositional knowledge under a practical/pedagogical MoP (refined intellectualism). No view finds this embarrassing; her teaching competence is the core datum.

  The pivotal feature is Elara’s **reliable capacity to prescribe corrections that produce measurable performance gains in students, despite her own permanent incapacity to perform**. Remove this—suppose she correctly diagnoses flaws but her verbal prescriptions ("try harder," "be smoother") fail to yield consistent improvement—and the views converge: All deny she knows how to dive *or* effectively teach. Her coaching efficacy is the wedge forcing the split.

  A basic intellectualist defender, whose view fares worst here (potentially attributing know-how if any way *w* is known, regardless of its feasibility for the knower), would likely attack by **redescribing the scenario**. They’d argue that the ways *w* Elara knows (e.g., "sequence S") are *not* actually ways *for her* to dive due to her physiology. Knowing *w* is a way *for someone else* (e.g., a student with normal lungs) to dive is *not* knowing how *she* can dive. They’d insist "knowing how to φ" is always indexed to the agent’s capabilities; since *w* is impossible for Elara, she doesn’t know *of w* that it is a way *for her* to φ. They concede she knows *that* w is a way for *others* to dive, but deny this constitutes her knowing how *she* can dive. This protects their core reduction while accommodating the intuition that she lacks performance capacity, though it risks making "way for S" overly subjective.

  I chose competitive freediving because the skill demands precise, measurable physiological control under extreme duress, making coaching efficacy objectively verifiable via performance metrics (depth, time, safety), while the coach’s own incapacitating physiological barriers (asthma, spinal fusion) are severe, permanent, and distinct from mere lack of training—preventing any "lost ability" interpretation and sharpening the gap between diagnostic/proscriptive knowledge and performative capacity.
