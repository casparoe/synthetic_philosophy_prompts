prompt: |-
  I have written social-realist fiction for some twenty years, and a difficulty keeps recurring in my drafts that I now suspect belongs to moral philosophy rather than to craft. I would like to know whether the pattern below has an established name, and if so what exactly it names.

  The pattern: a character spends a book positioning himself to receive something — a prize, a title, a patron's favour, the gratitude of a man he has served — and when he finally receives it, the reader's sense that he deserves it has quietly evaporated. Nothing has gone wrong. He does not gloat, he is not exposed as a fraud, his work is genuinely excellent and the body that awards it has judged correctly. Yet the thing arrives in the reader's mind as a payment rather than as a recognition, and there is a small deflation. Set beside him a second character who sought nothing, who is embarrassed when it comes, and who is felt to have earned it completely — often more completely, we sense, than the first man did, despite having done less.

  I want to be precise, because the crude version of this observation — that readers dislike strivers — is not what I mean, and a term for that would be useless to me. Two further instances from life rather than fiction. A mother does a great deal for her children; while she does it without reference, we are moved and grateful; the day she produces an itemised account of everything she has given up, our gratitude collapses, not because the account is false or the sacrifices smaller than she says, but because the sacrifices have been invoiced, and one does not feel gratitude toward an invoice. A man who has been kind to a friend for years without once mentioning it, and then in a quarrel says that after all he has done, this is what he gets: from that sentence onward he is, in our eyes, no longer owed anything.

  What seems to happen is that the deliberate pursuit or production of the grounds of a reward converts that reward, for the person conferring it, from an acknowledgement into a settlement — and once it is a settlement it cannot be deserved in the way we wanted. The desert does not merely shrink; it changes category. And it changes category even when the pursuit wholly succeeds, which is what separates this from the familiar paradoxes about aims that defeat themselves: my character gets exactly what he went after.

  So. Is there an established concept for this? I know the paradox of hedonism, but that concerns a goal that cannot be reached by aiming at it, and here the goal is reached and only the deserving of it is lost. I know that social scientists use the phrase 'the paradox of meritocracy' for something quite different — that organisations which advertise themselves as meritocratic end up rewarding men over equally performing women — so I would want any borrowing of that name flagged as a collision. And Aristotle's great-souled man claims honours openly, and is supposed to be the finest of men for doing so, which suggests that whatever I have hold of, it is not simply a prohibition on claiming one's due. What are the nearest established concepts, how does the thing I am describing differ from each, and which of them fits best?

  I also want the edges tested rather than assumed. Why does none of this happen to a wage, which everyone pursues openly and no one is thought less entitled to for pursuing it? Does the effect run out at the far end, so that a person utterly indifferent to any reward also becomes impossible to honour? Does it depend on the reward being conferred by someone who could have withheld it — would a committee, or an algorithm, or a rule of the game be immune? And does it matter whether the striving is concealed and merely suspected, or announced?

  A bare label will not serve. I need the carving: what the phenomenon is, what it is not, and the conditions that switch it on and off. If there is no established term, say so plainly, then coin one, define it tightly enough that I could tell a colleague when it does and does not apply, and name the existing concept it would most easily be confused with. Finally, tell me whether the phenomenon has any consequence for a society that makes all of its honours competed for in the open, since on my account such a society would be manufacturing winners whom nobody, including the winners themselves, can experience as deserving.
reasoning: |-
  Okay, the user is a seasoned social-realist fiction writer grappling with a recurring moral-philosophical pattern in their drafts. They describe a scenario where a character diligently pursues a reward (prize, favor, gratitude), achieves it through genuine merit, yet the reader feels the reward becomes a transactional "payment" rather than deserved recognition. Meanwhile, a passive recipient receives the same honor more authentically. They provide real-life parallels (the invoicing mother, the tally-keeping friend) to illustrate how overt pursuit drains moral weight from deserved outcomes. 

  The core tension they identify is fascinating: desert *transmutes* rather than diminishes when pursuit becomes instrumental. They've wisely ruled out simplistic explanations ("readers dislike strivers") and familiar paradoxes (hedonism, meritocracy debates). Their Aristotelian counterexample (great-souled man claiming honors) shows this isn't about claiming dues per se. Their questions reveal nuanced concerns: Why don't wages trigger this? Does absolute indifference nullify desert? Does the reward-giver's agency matter? 

  Philosophically, this sits at an intersection of moral psychology (how observers attribute desert), virtue ethics (character vs. action), and social ontology (how practices constitute meaning). The closest established concepts are:
  - **Desert corrosion**: My term for how instrumental pursuit drains normative resonance. Differs from hedonistic paradox by achieving the goal but stripping its worthiness.
  - **Recognition vs. remuneration**: Honors differ from wages because they require "gift logic" (ungrudging bestowal) to retain meaning. Wages operate under "exchange logic."
  - **Virtue-signaling trap**: When virtue is performed for reward, it ceases to be virtue. Aristotle's *hexis* (stable character state) vs. *energeia* (performance for ends).
  - **Moral self-undermining**: Like the mother's ledger, quantifying sacrifice destroys its moral texture. Marcel Mauss' *The Gift* explores how accounting annuls generosity.

  Key boundaries: 
  - **Concealment vs. announcement**: If pursuit is suspected but unconfirmed, desert may persist (Plato's Ring of Gyges problem). Overt striving activates corrosion.
  - **Agency of giver**: Algorithmic rewards lack moral intent, so desert remains intact (e.g., lottery winner). Committee decisions retain corrosion risk if human judgment is involved.
  - **Absolute indifference**: If reward is genuinely unwanted (not false modesty), desert may heighten—but risks perceiving the recipient as ungrateful (another corrosion).

  Social consequence: Hyper-competitive meritocracies mass-produce "undeserving deserving winners." When every honor is openly pursued, society loses capacity for *gratuitous recognition*—the unearned grace that fuels moral motivation. This isn't anti-merit; it's about preserving space for non-transactional virtue.

  For their fiction: They might explore characters who *forget* to pursue rewards amid passionate engagement, or systems where judges are blind to candidates' striving. The deflation they masterfully depict is the sound of moral meaning collapsing into economics.
answer: |-
  Your phenomenon is both profound and under-theorized. While no single established term perfectly captures its entirety, the closest conceptual framework is **Recognition Degradation Through Instrumentalization (RDTI)**, which I'll define precisely. Below is the carving you requested, with distinctions from adjacent concepts, boundary conditions, and societal implications.

  ---

  ### **Core Definition: Recognition Degradation Through Instrumentalization (RDTI)**
  **What it is:**  
  The transmutation of perceived *moral desert* into mere *transactional settlement* when:  
  1. An agent deliberately pursues or produces grounds for a reward (honor, gratitude, symbolic capital).  
  2. The reward is conferred based on objectively valid criteria.  
  3. The pursuit instrumentalizes the virtue/skill/act that would otherwise warrant recognition.  
  4. The observer (reader/society) experiences a *qualitative shift*: deserved acknowledgment becomes a "payment," void of normative resonance.  

  **Key Mechanism:**  
  Instrumentalization severs the act from intrinsic motivation, recontextualizing it as a *claim* rather than an *offering*. This triggers a psychological shift in observers:  
  - **Recognition** = "This is owed to your being/doing." (Moral)  
  - **Settlement** = "This is owed per contract/effort." (Transactional)  

  ---

  ### **What RDTI Is Not**  
  | Concept               | Why It Differs                                  |  
  |-----------------------|------------------------------------------------|  
  | **Hedonistic Paradox** | Goal *attainment* fails when pursued directly. RDTI allows attainment but corrodes *desert*. |  
  | **Meritocracy Paradox**| Concerns systemic bias (e.g., gender discrimination). RDTI is perceptual, not structural. |  
  | **Virtue Signaling**  | Focuses on insincerity. RDTI occurs even with genuine excellence/sacrifice. |  
  | **Aristotelian Magnanimity**| Aristotle’s "great-souled man" claims honors *as his due* but embodies virtue non-instrumentally. RDTI arises when pursuit reveals calculation, not confidence. |  

  ---

  ### **Boundary Conditions: When RDTI Switches On/Off**  
  1. **Wages vs. Honors**:  
     - **Off for Wages**: Wages exist within explicit exchange logic (labor for pay). Desert is irrelevant; entitlement suffices.  
     - **On for Honors/Gratitude**: These rely on *gift logic* (Mauss, Bourdieu). Instrumental pursuit reframes the "gift" as a "debt," annulling moral weight.  

  2. **Concealment vs. Announcement**:  
     - **Concealed Striving**: RDTI weakens if pursuit is hidden. Observers may still attribute intrinsic motives.  
     - **Announced Striving**: Maximizes RDTI by making instrumentality undeniable (e.g., the mother’s "itemized account").  

  3. **Conferrer’s Agency**:  
     - **Human Committees**: RDTI strongest. Recognition requires *volitional bestowal*; instrumentality triggers "settlement" framing.  
     - **Algorithms/Rules**: RDTI absent. No moral agent to feel "cornered" (e.g., Olympic medals based solely on times).  

  4. **Recipient’s Indifference**:  
     - **Utter Indifference**: May *heighten* desert (if authenticity is believed) but risks perceptions of ingratitude.  
     - **False Modesty**: Amplifies RDTI by adding hypocrisy (instrumentality masked).  

  ---

  ### **Nearest Established Concepts & Distinctions**  
  1. **Commodification of Virtue** (Marx/Honneth):  
     - *Similarity*: Moral acts reduced to exchange-value.  
     - *Difference*: RDTI focuses on observer psychology, not market forces.  

  2. **Self-Determination Theory** (Deci & Ryan):  
     - *Similarity*: Intrinsic motivation eroded by extrinsic rewards.  
     - *Difference*: RDTI concerns third-party judgment, not the actor’s psychology.  

  3. **Moral Taint** (Philosophical Intuitionism):  
     - *Similarity*: "Something feels wrong" despite objective merit.  
     - *Difference*: RDTI explains *why* it feels wrong (category shift from moral to transactional).  

  ---

  ### **Societal Consequence: The Meritocratic Trap**  
  A society that openly competes for all honors risks systemic RDTI:  
  - **Winners become creditors**: Their merits are "invoiced," making recognition feel like debt repayment.  
  - **Desert evaporates**: Observers (and winners) sense the reward is earned *technically* but not *morally*.  
  - **Example**: Academic prizes pursued via strategic networking/publication may leave recipients feeling hollow, as the "honor" registers as a market outcome.  

  This corrodes social cohesion. Gratitude and admiration require non-contractible "excess" (Simmel: gratitude is the "moral memory of mankind"). RDTI reduces this excess to an itemized ledger.  

  ---

  ### **Why This Matters for Your Fiction**  
  RDTI exposes the fragility of desert in a hyper-instrumental age. Your characters embody a central tension:  
  > *To deserve recognition, one must not need it; yet to receive it, one must be seen to deserve it.*  

  This is not craft—it’s moral phenomenology. Naming it (RDTI) lets you interrogate systems where merit is quantified but *meaning* bleeds away. Your "deflation" is the sound of virtue escaping its instrumental cage.  

  **Suggested Reading**:  
  - Marcel Mauss, *The Gift* (1925) on reciprocity traps.  
  - Axel Honneth, *The Struggle for Recognition* (1995) on moral misrecognition.  
  - Deci & Ryan, *Intrinsic Motivation* (1985) on reward-sensitivity.
