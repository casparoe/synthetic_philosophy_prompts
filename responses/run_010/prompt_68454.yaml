  First, I need to establish the boycott's mechanics. The economic impact depended on sustained participation - each rider's decision affected both immediate revenue loss and the movement's perceived viability. For a participating walker, their action contributes to collective pressure while signaling commitment to others. A defector's ride does measurable harm by undermining solidarity and potentially triggering cascading defections.

  The user's framework categories help unpack this:

  - Marginal nullity fails here because in threshold systems, individual acts can tip equilibria
  - Probabilistic dilution applies differently to walkers (small but non-zero impact) and defectors (disproportionate negative impact)
  - Attribution difficulty exists but doesn't negate contribution
  - Uptake dependence is central - each act gains meaning through others' expected responses
  - Framing effects transform individual sacrifices into visible norms

  The key insight emerges: the inefficacy objection collapses when participation itself creates the conditions for efficacy. Boycotters likely understood their actions as jointly necessary, not because each was pivotal, but because mass participation redefined what was possible. This exposes the objection's limits to smooth, linear systems.

  For the user's theory, this case suggests the inefficacy objection functions more as domain-specific skepticism than universal principle. Its application to consumption may reflect ideological framing rather than inherent logic. The "noble fiction" question becomes moot when participants accurately perceive their role in equilibrium-shifting collectives.

  I'll structure the response to first map the framework onto walkers/defectors, then test the objection's predictive failure, finally examining theoretical implications - all within the strict word limit. The analysis should validate the user's suspicion about the objection's limited scope while offering concrete historical support.
answer: |-
  ### Bottom Line
  The inefficacy objection fails catastrophically when applied to the Montgomery boycott because individual participation was *not* causally null due to uptake dependence and framing effects. The boycott persisted because participants understood their actions as part of a coordinated equilibrium-shifting effort, where each act reinforced collective commitment and altered perceptions of feasibility. This case reveals the objection's core weakness: it assumes smooth, linear causality and ignores how threshold-dependent contexts transform individual agency.

  ---

  ### Mapping the Framework to the Boycott

  **1. For the Participant (Walker/Driver):**  
  *(i) Marginal nullity:* **False.** Each avoided ride reduced bus revenue marginally. While trivial alone, the boycott’s success depended on exceeding a threshold of participation (~75% of riders). Near thresholds, marginal contributions *can* be decisive.  
  *(ii) Probabilistic dilution:* **True but misleading.** Each act had a tiny *direct* probability shift. However...  
  *(iii) Attribution failure:* **Partially true.** Overdetermination exists, but the carpool system and public meetings allowed visible attribution of collective responsibility.  
  *(iv) Uptake dependence:* **CRITICAL.** The act’s value derived entirely from the *equilibrium* of mass participation. Walking signaled commitment, encouraging others and deterring defection. The act was causally potent *because* others believed it would be reciprocated.  
  *(v) Framing effects:* **CRITICAL.** Walking redefined norms: resistance became possible, even expected. It visibly demonstrated Black agency to opponents and wavering participants, altering strategic beliefs.

  **2. For the Defector (Rider):**  
  *(i) Marginal nullity:* **False.** Riding provided direct revenue to the segregated system and weakened the boycott’s economic pressure.  
  *(ii) Probabilistic dilution:* **False.** Defection risked cascading effects (e.g., if others observed empty seats, they might defect). Probability shift was non-linear and potentially large near participation thresholds.  
  *(iii) Attribution failure:* **Weak.** Defectors were identifiable and faced community sanctions (ostracism, church discipline), making attribution possible.  
  *(iv) Uptake dependence:* **CRITICAL.** Defection undermined the equilibrium. One rider could trigger more defections by signaling the boycott was failing or that norms were unenforceable.  
  *(v) Framing effects:* **CRITICAL.** Riding normalized compliance, demoralized participants, and signaled to white authorities that resistance was fragmenting.

  ---

  ### Testing the Inefficacy Objection’s Prediction  
  **Prediction:** If individual contributions were null, mass participation should collapse rapidly as rational actors free-ride.  
  **Reality:** The boycott sustained 381 days despite hardship. **Why the objection fails:**  

  1.  **Uptake Dependence as a Stabilizer:** Participation wasn't assessed in isolation. The MIA’s carpool system, church networks, and public meetings created a visible *coordination mechanism*. Participants saw their actions as part of a *conditional commitment*: "I will walk *if* others do." This transformed individual decisions into a self-reinforcing equilibrium.  
  2.  **Framing Effects Overcame Dilution:** Shared identity (church, community, racial injustice) and leadership (King’s rhetoric) framed participation as a *duty*, not a cost-benefit calculation. Walking became a symbolic act of resistance, valued independently of immediate causality. Defection wasn’t just ineffective—it was *treasonous*.  
  3.  **Thresholds Mattered:** The boycott’s initial success (Dec. 5) created a *coordination point*. Once critical mass was achieved, the cost of defection (social, reputational) outweighed the marginal benefit of riding. The objection ignores how early participation creates new equilibria.  

  **Role of Economic vs. Legal Victory:** While the Supreme Court ultimately ended segregation, the boycott’s *sustained economic pressure* forced the city into costly legal battles and exposed segregation’s fragility. Without mass participation, *Browder v. Gayle* lacks a compelling factual record and political urgency. The economic squeeze was necessary but not sufficient; the legal win was enabled by the boycott’s disruption.

  ---

  ### What the Case Does to the Theory  
  The Montgomery boycott demonstrates that the inefficacy objection is **not a general theory of collective action** but a artifact of modeling choices:  

  1.  **Domain Restriction:** The objection gains plausibility in "smooth" contexts (e.g., carbon emissions) with no thresholds, weak social ties, and invisible actors. It fails in "lumpy" contexts (boycotts, strikes, voting) where:  
      *   **Thresholds exist** (participation % matters discontinuously).  
      *   **Visibility is high** (acts are observed and reciprocation is monitored).  
      *   **Social enforcement is strong** (defection is punished).  
      *   **Framing defines agency** (acts are identity-constituting).  
  2.  **The "Noble Fiction" is Unnecessary:** Boycotters didn’t need false beliefs about individual causality. They understood their power resided in *mutual dependence*: "My walk matters *because* yours does, and we both know it." This is a rational grasp of equilibrium dynamics, not delusion. The objection mistakes this for irrationality because it ignores strategic interdependence.  
  3.  **Implication for Consumption Cases:** The objection may *seem* compelling for climate change or factory farming precisely because those contexts are deliberately structured to *avoid* thresholds, visibility, and social enforcement (e.g., anonymous markets, fragmented producers). This isn’t proof of individual nullity; it reflects strategic design by opponents of collective action. The objection implicitly legitimizes this fragmentation.  

  **Conclusion:** The inefficacy objection collapses in threshold-dependent, socially embedded contexts like Montgomery. Its apparent force in consumption cases stems from contingent social structures that suppress coordination—not from an inherent truth about individual agency. The boycott shows that when coordination is possible, individual acts gain causal power through uptake and belief. The objection is thus less a philosophical insight and more a description of *defeated* collective action.  

