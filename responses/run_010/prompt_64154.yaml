prompt: |-
  I'm the treasurer of a 7-person condo board and every spring we pick between three landscaping bids. Sick of the strategic nonsense, I made up my own voting rule: everyone hands in a secret ranking of the three. If some bid is ranked first by more than half of us, it wins. If not, we cross out whichever bid was ranked last by the most people and count again, and if that still doesn't produce a majority, whoever's chair that year breaks the tie with their own ballot.

  I've been assuring people the rule is gaming-proof — that you can never come out ahead by lying about your ranking, so just be honest and you won't regret it. My neighbor across the hall says that's flat-out impossible and won't explain why, he just smirks. Honestly I can't tell if he's got something or he's just being contrarian.

  Two things. First, is he right, and if so give me the concrete version: point at the exact step in my procedure where a lie pays off and what kind of lie it is. Last spring Doris ranked the cheapest bid last even though she'd told me she liked it second best, and it changed who won — was that her exploiting the rule, or something else entirely? Second, I'm not going back to first-past-the-post. What are my realistic options — something that kills the incentive outright, something that just makes lying hard to pull off, or something that admits the problem and lives with it — and what does each one cost me?

  Answer the neighbor question in your very first sentence, and keep the whole thing under 250 words.
reasoning: |-
  Hmm, the user is a condo treasurer dealing with a voting rule they created for landscaping bids. They're frustrated with strategic voting and claimed their rule is immune to manipulation, but a neighbor disagreed without explaining. I need to address whether the neighbor is right, analyze Doris's action, and suggest alternatives.

  The neighbor is correct. The rule is vulnerable to strategic voting. The key flaw is in the runoff step: if no majority exists initially, the last-place votes determine which bid is eliminated. This creates an incentive to dishonestly rank a preferred option lower to avoid its elimination.

  Doris's situation illustrates this. By ranking the cheapest bid last (when she truly preferred it second), she might have been trying to eliminate a different bid she disliked more, hoping her second choice would win in the runoff. If her lie changed the outcome, it likely benefited her by favoring a bid she preferred over what would've won honestly.

  For alternatives, I should consider Condorcet methods which compare pairs directly and are harder to manipulate, though more complex. Approval voting simplifies choices but loses ranking nuance. Instant runoff (ranked choice) is familiar but still manipulable in edge cases. The best compromise might be approval voting for its simplicity and reduced incentive to lie, though it forces voters to treat top choices equally.

  I need to keep this under 250 words and start with a clear verdict. The response should validate the user's frustration while offering practical solutions. Since they're attached to their rule, I'll emphasize that no system is perfect, but better options exist with trade-offs between complexity and strategy-resistance.
answer: |-
  **Yes, your neighbor is right: your rule can be manipulated by strategically ranking a bid lower than its true preference.**

  The vulnerability lies in the runoff step. Suppose your true favorite lacks majority support. You might *dishonestly rank a strong rival last* if you fear it will be eliminated otherwise, hoping your second choice then wins. Doris likely ranked the cheap bid last (despite liking it second) to try and eliminate a *different* bid she disliked even more, aiming for her true favorite or second choice to win the runoff instead. Her lie changed the outcome because it altered which bid was eliminated first.

  **Realistic Options:**

  1.  **Approval Voting:** Voters mark *all* bids they find acceptable. Most approvals wins. Simple, reduces incentive to lie about support levels, but loses ranking nuance. Cost: Minimal change.
  2.  **Condorcet Method (e.g., Copeland):** Uses pairwise comparisons. The bid beating all others head-to-head wins. Highly strategy-resistant but complex to explain/count. Cost: Comprehension/trust effort.
  3.  **Instant Runoff (Ranked Choice):** Like your rule, but eliminates the *lowest-ranked* bid each round using *all* ballots immediately. Still manipulable but often more robust than your version. Cost: Slight complexity increase.
  4.  **Accept Manipulation Risk:** Use your rule or IRV. Most strategic voting requires coordinated information, which is hard for 7 people. Cost: Potential for occasional Doris-like behavior.

  **Recommendation:** **Approval Voting** offers the best balance for simplicity and reduced manipulation incentive in your small group.
