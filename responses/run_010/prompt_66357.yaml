prompt: |-
  I am preparing a chapter for a collected volume on disagreement and have been running a graduate seminar alongside it, and the chapter has stalled at exactly the point where my own intuitions stop behaving. The subject is compromise between people who hold different value systems — not the intrapersonal problem of an agent uncertain which values are correct, though one of my cases below blurs that line deliberately, and not the political-theoretic question of whether compromise is democratically virtuous in general. What I want is a principle for when a particular agent may strike a particular bargain with a particular counterpart. My working formulation, which I now think is too crude to survive my own cases, is this: a compromise is permissible for an agent just when, reckoned entirely by that agent's own lights — their own values together with their own degrees of belief about which values are right — they come out ahead on balance; and impermissible when they come out behind. The thought is that moral trade is like any other trade, that the gains are real, and that refusing a mutually beneficial swap out of fastidiousness is a way of making the world worse for no one's benefit.

  Here are the verdicts I keep reporting in seminar, in roughly the order in which the seminar reaches them.

  1. A colleague whose giving is governed entirely by concern for animal welfare and I, whose giving is governed almost entirely by concern for global poverty, agree that each of us will redirect a fifth of our annual donations to the other's highest-priority charity. Fine — indeed, the two of us would be foolish not to, and I think we would each be mildly criticizable for refusing.

  2. In a faculty senate, a colleague and I trade votes: I support a curriculum revision I think mildly harmful, she supports a hiring line I think valuable and she thinks wasteful. Fine, though faintly distasteful in a way I cannot yet locate.

  3. The same arrangement, except that the measure I am asked to support would remove an accommodation that disabled students currently rely on. Not fine for me, and the difference from case 2 is not merely one of degree — I feel the shift as a change of kind, which embarrasses me, since my formulation recognizes only magnitudes.

  4. On a hospital ethics committee, a colleague who attributes full moral status to fetuses and I, who do not, agree that I will vote against permitting a certain procedure and she will vote for expanded prenatal funding. Not fine. But note the asymmetry I want explained: I think the mirror-image trade is perfectly permissible for her, and I would not blame her for accepting it. Each of us is doing something different in the bargain, though each of us is one vote.

  5. A major funder informs me that unless my forthcoming report contains a paragraph endorsing a practice I regard as unjustifiable, it will withdraw support from a programme that keeps a great many people alive. I include the paragraph. Fine, or at least not blameworthy — though I also think that someone who refused would be admirable, and I do not think the refuser would be making a mistake.

  6. I tell a colleague that unless she supports my candidate for a departmental prize, I will use my editorial position to slow-walk her submissions. Not fine, and contemptible in a way that has nothing to do with the size of the stakes. Structurally this is the mirror of case 5, and my formulation gives the same verdict on both, since in both the agent comes out ahead.

  7. A collaborator whose fundamental values I find myself genuinely uncertain about — call it forty per cent confidence that she is right and I am wrong — proposes that we each accommodate the other's priorities in a joint grant. Fine, and I am inclined to say more than fine: trading here looks like a rational response to my own uncertainty rather than a concession to someone else's error.

  8. A colleague whose values I am confident are vile — he believes resources should be allocated partly by ethnic origin — proposes a bargain under which the resulting policy is a mixture of his view and mine, and therefore considerably less bad than what he would enact alone. Not fine. I feel contaminated by it. Yet the mixture is by hypothesis better than the alternative on every view in the neighbourhood except his, and my formulation therefore permits it. This is the case I most want a principle to explain rather than explain away.

  9. A pattern of small trades of the sort in case 2, sustained in one department over ten years. Each trade, taken alone, I still judge fine. But I think the person at the end of the decade no longer holds the convictions with which she began, and I judge that outcome worse than the sum of the individual transactions. I cannot tell whether this is a genuine moral consideration or aesthetic squeamishness dressed up as one.

  10. Two colleagues who share an office agree never to press their conflicting views in one another's presence. Neither gains anything either values; both avoid friction. Fine — but I suspect this is not compromise in the sense my other cases involve, and that my formulation is equivocating between bargain and truce.

  11. Role variation. As an individual I would refuse a trade of the sort in case 3; as department chair, committing resources that are not mine alone, I think I ought to accept it and would be criticised for refusing; as trustee of a fund given for a stated purpose, I think I may not trade with it at all. Three verdicts, three roles, and my formulation says nothing about roles whatsoever.

  So: is there a repair? I would like you to treat my formulation as a first draft to be amended rather than discarded — the gains-from-trade insight seems to me too important to abandon — and to add whatever clauses are needed, saying for each clause which of the cases above motivated it and what work it is doing. Then tell me honestly which of my verdicts the amended principle cannot deliver, and where I should simply give one up. I am especially interested in whether cases 7 and 8 can be separated by anything other than an appeal to how much I happen to dislike my counterpart, and in whether the mirror pair 5 and 6 admits of a principled difference or whether I should concede that they differ only in who is already in the wrong. I am not looking for attributions, a survey of positions, or suggestions about what to read; please argue from the cases themselves and from whatever distinctions you can construct.

  Please organise the response under the following headings, in this order. **Bottom line** (about 150 words): the amended principle in one or two sentences, plus a one-sentence statement of which of my verdicts it costs me. **The principle, clause by clause** (about 700 words): each clause stated precisely, with the numbered case that motivates it and an account of what the clause excludes that the unamended version permitted. **What it gets right and what it overturns** (about 400 words): a compact reckoning over all eleven cases, marking for each whether the principle confirms my verdict, reverses it, or delivers something more complicated than either. **The pair I cannot reconcile** (about 450 words): cases 7 and 8, and then cases 5 and 6, with a straight answer on whether the differences are principled. **Predictions on cases I have not raised** (about 350 words): three further compromise cases of your own devising, chosen to probe places where the amended principle is likely to be unstable, with the verdicts the principle commits me to. **The simpler alternative** (about 300 words): a less baroque principle that abandons two or three of my verdicts outright, and your assessment of whether the simplicity is worth the loss.
reasoning: |-
  Hmm, the user is a philosopher writing a chapter on value compromise and running a graduate seminar on the topic. They've hit a wall with their working principle that compromise is permissible when the agent comes out ahead by their own lights. They've presented 11 nuanced cases where their intuitions conflict with this principle and want me to help refine it while preserving the "gains-from-trade" insight.

  Looking at their cases, the core tension is between consequentialist gains and deontic constraints. Cases 1-2 show straightforward permissibility of trade, while cases 3-4 introduce what feel like wrongmaking factors beyond net benefit - especially when compromising core values or harming vulnerable groups. The mirror cases (5-6) reveal that context matters: extortion feels wrong even when beneficial, while tragic dilemmas feel excusable. Cases 7-8 highlight the role of uncertainty versus certainty about others' values - uncertainty makes compromise feel rational, while compromising with vile values feels contaminating. The longitudinal case (9) suggests temporal effects, and role variations (11) indicate institutional constraints.

  For my amendment, I'll need clauses that: 1) preserve the core benefit condition 2) add constraints against core-value betrayal 3) address means/end distinctions (e.g., coercive proposals) 4) incorporate role obligations 5) handle uncertainty differentials. The asymmetry in case 4 is particularly telling - it suggests we judge ourselves more strictly when compromising our own values than when others compromise theirs.

  The hardest pairs are 7 vs 8 (uncertainty vs certainty about others' wrongness) and 5 vs 6 (coercion vs tragic dilemmas). For 7/8, the key is whether we're responding to epistemic humility or enabling wrongdoing. For 5/6, the proposal's coerciveness matters independently of outcomes. The amended principle must capture these distinctions without smuggling in mere distaste.

  I'll structure the response as requested, offering a clause-by-clause refinement that saves most intuitions while flagging where revisions might be needed (e.g., case 10's "truce" may require different framing). The role-dependence in case 11 will need explicit institutional clauses. Ultimately, some verdicts like case 9's cumulative effect might need softening - that feels more like a caution about compromise culture than a permissibility condition.
answer: |-
  ### Bottom line
  The amended principle: A compromise is permissible for an agent when (1) it yields net expected value gain by their own lights, (2) does not require direct endorsement or enactment of a core disvalue they reject, (3) is not coercively initiated by the agent, and (4) respects role-based fiduciary obligations. This preserves the gains-from-trade core but adds constraints against moral complicity, coercion, and institutional betrayal. It costs you your verdict on **Case 8** (compromise with the vile colleague), which it permits as rationally required to mitigate harm, forcing you to abandon the intuition of "contamination" as a veto.

  ---

  ### The principle, clause by clause  
  *(Clauses build cumulatively; each excludes cases the prior formulation allowed)*  

  1.  **Net Gain Condition:** *The compromise must yield positive expected value for the agent, calculated using their own credences and values.*  
      -   **Motivated by:** Cases 1 (charity trade) and 7 (uncertain collaborator).  
      -   **What it excludes:** Compromises where the agent expects to be worse off (e.g., sacrificing core values for trivial gains). This is your baseline gains-from-trade insight.  

  2.  **Core Value Non-Betrayal Clause:** *The agent may not perform an action within the compromise that directly implements or expresses a core disvalue they categorically reject, even if net gain is positive.*  
      -   **Motivated by:** Cases 3 (removing disability accommodation) and 4 (voting against procedure).  
      -   **What it excludes:** Actions constituting direct participation in enacting a severe wrong the agent condemns (e.g., Case 3: actively dismantling essential support violates a core commitment to non-harm; Case 4: voting to deny a permissible procedure expresses endorsement of fetal personhood you reject). Net gain alone is insufficient here; the *nature of the action* matters.  

  3.  **Non-Coercive Initiation Clause:** *The compromise is impermissible if the agent initiates it via a threat to inflict harm (by their own lights) contingent on the counterpart's refusal.*  
      -   **Motivated by:** Case 6 (editorial threat).  
      -   **What it excludes:** "Trades" initiated by threatening to make the world worse unless concessions are made (Case 6). This distinguishes structurally similar cases (5 vs 6): in Case 5, *you* face a threat; in Case 6, *you issue* the threat. Threatening harm as a bargaining tool violates a duty against coercion, overriding net gain.  

  4.  **Role Fidelity Clause:** *The agent’s permissible compromises are constrained by role-specific obligations to advance particular values or interests, overriding what net personal gain might permit.*  
      -   **Motivated by:** Case 11 (role variation).  
      -   **What it excludes:** Using resources or authority entrusted for a specific purpose (e.g., departmental funds, charitable trust) for trades advancing other values, even if net gain is positive by the agent's *personal* lights (Case 11: trustee). As chair, fiduciary duty to the *department's* welfare may *require* accepting trades an individual could refuse (Case 11: chair vs individual).  

  ---

  ### What it gets right and what it overturns  
  *Confirming Verdicts:*  
  *   **1 (Charity Trade):** Permissible (Net Gain).  
  *   **2 (Vote Trade):** Permissible (Net Gain, no core betrayal).  
  *   **3 (Remove Accommodation):** Impermissible (Core Value Betrayal - directly harming vulnerable group).  
  *   **4 (Ethics Committee Trade):** Impermissible *for you* (Core Value Betrayal - voting against procedure expresses endorsement of fetal status you reject). Permissible *for your colleague* (No core betrayal *for her* - voting for prenatal funding doesn’t enact a core disvalue *she* rejects). Confirms your asymmetry.  
  *   **6 (Editorial Threat):** Impermissible (Coercive Initiation).  
  *   **7 (Uncertain Collaborator):** Permissible (Net Gain + no core betrayal/coercion).  
  *   **10 (Truce):** Permissible but distinct; not a bargain exchanging valued gains, merely avoiding conflict. Principle doesn’t apply, confirming your suspicion.  

  *Reversing Verdicts:*  
  *   **8 (Vile Colleague):** **Permissible.** Net Gain Condition is met (policy less bad), no Core Betrayal (you implement your preferred mix, not his ethnic allocation), no Coercion (he proposes, you don't initiate via threat). Your "contamination" intuition isn't captured; the principle requires permitting harm mitigation.  
  *   **9 (Pattern of Trades):** *Individual trades remain permissible* (as in Case 2). The cumulative effect (eroded convictions) is a separate concern about character/virtue, not a permissibility condition for any single act of compromise. Your worry is noted but not grounds for impermissibility.  

  *Complex/Qualified Verdicts:*  
  *   **5 (Funder's Demand):** **Permissible but excusably refusable.** Net Gain (lives saved > unjust paragraph). Not Core Betrayal *if* the paragraph is seen as insincere capitulation under duress, not genuine endorsement (cf. Case 4). Coercion Clause doesn’t forbid *accepting* a threat, only *initiating* one. Refusal is admirable (integrity) but not obligatory; principle permits acceptance.  
  *   **11 (Roles):** Confirms distinct verdicts: Impermissible as Trustee (Role Fidelity forbids diversion), Permissible/Obligatory as Chair (Role Fidelity may require resource optimization via trade), Impermissible as Individual (Core Value Betrayal if applicable, e.g., Case 3).  

  ---

  ### The pair I cannot reconcile  

  *   **Cases 7 & 8 (Uncertainty vs. Certain Vile Values):**  
      The difference *is* principled, but not by the amended principle. Case 7 involves *epistemic humility*: trading is rational belief-revision or hedging under uncertainty. Case 8 involves *complicity with known wrongdoing*. While the principle *permits* both (as net gain without core betrayal/coercion), your intuition demands blocking Case 8. To reconcile them within the principle, you'd need a new clause like: "...and the counterpart's values/objectives, while wrong, are not *vile* (e.g., intrinsically discriminatory, sadistic)." However, defining "vile" objectively undermines the "own lights" foundation. The principled distinction lies in the *agent's epistemic state* (uncertainty vs. certainty of counterpart's severe error/malice) and the *nature of the wrong* (ordinary error vs. profound injustice). The principle captures the epistemic difference only implicitly via Net Gain calculation (certainty makes the trade *less* beneficial if the vile values affect welfare calculations). To save your Case 8 verdict, you must either abandon the gains-from-trade core for "vile" counterparts or define a new, potentially arbitrary, category of forbidden compromise partners.  

  *   **Cases 5 & 6 (Threat Recipient vs. Threat Initiator):**  
      The difference *is* principled and *is* captured: **Coercive Initiation.** Case 6 is impermissible because *you* threaten harm to extract concessions. Case 5 is permissible because *you* are responding to an external threat; accepting it (under duress) to prevent greater harm isn't itself coercive. The key isn't "who is already in the wrong" (the funder is wrong in Case 5), but *who is wielding the threat as an instrument of the bargain*. Your formulation conflated them via net gain; the Coercion Clause cleanly separates them. Refusing Case 5 is admirable integrity, but not required, because capitulating under duress to save lives isn't a moral failing equivalent to issuing a threat.  

  ---

  ### Predictions on cases I have not raised  

  1.  **The Sincere Endorsement:** A climate activist (valuing only emissions reduction) trades votes with a housing activist (valuing only affordable housing). They each speak passionately *in favor* of the other's bill at a council meeting to secure passage of both.  
      *   **Principle's Verdict:** **Impermissible** if passionate speech constitutes *Core Betrayal* (directly expressing endorsement of a value they see as secondary/wrong). Permissible if speech is seen as purely strategic, cost-free action for net gain. Unstable: hinges on interpretation of "expression."  

  2.  **The Third-Party Harm Trade:** Two legislators trade votes: A supports B's tax cut (which A believes harms the poor) in exchange for B supporting A's environmental regulation (which B believes harms industry jobs). Both calculate net gain (their priority passed > harm done).  
      *   **Principle's Verdict:** **Permissible** (Net Gain, no *Core Betrayal* if harming the poor/jobs isn't a *core disvalue* they categorically reject *in itself*, merely a disvalued consequence). Unstable: Challenges the boundary of Core Betrayal. Is harming a group as a *foreseen side-effect* different from *directly implementing* harm (Case 3)? The principle may permit too much here.  

  3.  **The Trustee's Tempting Offer:** As trustee of a scholarship fund for STEM students, you're offered a deal: redirect 10% of the fund this year to humanities scholarships (which you personally value highly) in exchange for the humanities trustee directing 10% of *their* fund to STEM next year. Net gain by your lights.  
      *   **Principle's Verdict:** **Impermissible** (Role Fidelity). The funds are entrusted for specific purposes; trading violates the fiduciary duty to STEM applicants, regardless of net personal gain or broader value optimization. Stable application.  

  ---

  ### The simpler alternative  

  **Principle:** A compromise is permissible iff it maximizes expected value by the agent's own lights, subject to the constraint that it does not directly violate a categorical deontic constraint the agent recognizes (e.g., "don't kill innocents," "don't betray core promises").  

  *   **Abandons Verdicts:**  
      *   **Case 6 (Coercion):** Permits it if net gain is positive and no deontic constraint is violated (threats might not be categorically forbidden).  
      *   **Case 11 (Roles):** Ignores role-specific duties; permits trustee trade if net gain (personal values) outweighs fidelity.  
      *   **Case 8 (Vile Colleague):** Permits it (as net gain mitigation), matching the amended principle but still abandoning your verdict.  
  *   **What it Keeps:** Core Gains-from-Trade (1, 2, 7), Core Value Betrayal (3, 4 asymmetry), Tragic Choice (5), Uncertainty (7), Truce distinction (10). Loses longitudinal concern (9).  
  *   **Assessment:** The simplicity (merging Core Betrayal and Roles into vague "deontic constraints," dropping Coercion Clause) is **not worth the loss**. It fails the critical tests:  
      *   It cannot explain the impermissibility of *initiating* coercion (Case 6) versus *accepting* it (Case 5).  
      *   It provides no guidance on role obligations (Case 11), collapsing distinct institutional moralities into personal calculus.  
      *   While capturing Core Betrayal (like the amended principle), it does so less precisely. The gains in simplicity are outweighed by significant losses in explanatory power for key intuitions, particularly regarding institutional roles and the distinct wrong of coercive bargaining. The amended principle's clauses, while more complex, target specific, robust intuitions your cases reveal.
