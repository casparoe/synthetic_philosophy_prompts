answer: |-
  ### Provisional Mark: 17/20  
  *(Sub-scores: a=4.5/5, b=4.5/5, c=4/5, d=4/5)*  

  ---

  ### Rubric-Based Comments  
  **(a) Moral equality & non-combatant immunity (4.5/5)**  
  *Strengths:* Accurately defines Walzer’s core thesis — symmetry of combatant liability regardless of *jus ad bellum*, and correctly links it to uniform non-combatant immunity. Clearly states that immunity admits no exceptions.  
  *Shortcomings:* Does not explicitly note that Walzer grounds combatant status in membership/role (not just posing a threat), which underpins the symmetry.  

  **(b) Walzer’s argument (4.5/5)**  
  *Strengths:* Correctly identifies both arguments (danger-based liability and responsibility gap) and explains the practical necessity of shared conventions. Captures Walzer’s separation of *jus ad bellum* and *jus in bello*.  
  *Shortcomings:* Overemphasizes "dangerousness" as Walzer’s sole criterion for liability. Walzer ties liability to *being a combatant* (a social role), not just posing a threat, which weakens the nuance.  

  **(c) McMahan’s objection (4/5)**  
  *Strengths:* Clearly states the revisionist rejection of symmetry and the dependence of liability on responsibility for unjust threats. Correctly notes McMahan’s "deep morality vs. convention" distinction.  
  *Shortcomings:* Omits that liability hinges on **responsibility for an *unjust* threat**, not merely fighting for an unjust cause. This conflates cause with personal moral responsibility.  

  **(d) Legal vs. moral assessment (4/5)**  
  *Strengths:* Correctly notes McMahan’s call for legal reform and Walzer’s practical concession. Distinguishes moral truth from legal convention.  
  *Shortcomings:* Falsely claims "both authors agree that moral equality is false in itself but necessary in practice." Walzer defends moral equality as *morally justified* (not a necessary lie), while McMahan rejects it entirely.  

  ---

  ### Factual Inaccuracies/Misattributions  
  1. **Error:** "What makes a person a combatant is that he poses a threat of harm" (re: Walzer).  
     *Correction:* Walzer defines combatants by their membership in an armed group (a social role), not merely posing a threat.  
     *Fix:* "What makes a person a combatant is their status as a member of the armed forces, which entails posing a threat."  

  2. **Error:** Liability for McMahan "depends on an individual’s moral responsibility for an unjust threat" is simplified.  
     *Correction:* McMahan requires **both** responsibility *and* the threat’s *unjustness*; one can be responsible for a just threat and *not* liable.  
     *Fix:* "Liability depends on moral responsibility for an *unjust* threat."  

  3. **Error:** "Both authors agree that the moral equality of combatants is false in itself and necessary in practice."  
     *Correction:* Walzer argues moral equality is *morally true* (due to shared conventions/role-based liability). McMahan calls it *morally false* but *possibly* pragmatically necessary.  
     *Fix:* "McMahan holds moral equality is false in principle but pragmatically necessary, whereas Walzer defends it as morally justified."  

  ---

  ### Underdeveloped Points  
  - **Walzer’s practical argument:** Mentions soldiers’ lack of reliable information but omits Walzer’s emphasis on the *state monopoly* on *jus ad bellum* decisions and soldiers’ obligation to obey orders.  
  - **McMahan’s legal conclusion:** Notes McMahan’s call for reform but doesn’t address his concession that legal change might be infeasible due to epistemic/practical constraints.  

  ### Unaddressed Elements  
  - **Question specificity:** Fails to explicitly state what liability "actually depends on" for McMahan (*moral responsibility for an unjust threat*).  
  - **Legal distinction:** Does not clarify *why* McMahan thinks law should diverge from morality (e.g., epistemic barriers, coordination problems).  

  ---

  ### Adaptable Comments for Similar Scripts  
  > *(a) Good definition of symmetry/immunity, but clarify Walzer’s combatant status = institutional role, not threat alone. (-0.5)*  
  > *(b) Correct danger/responsibility arguments, but Walzer ties liability to combatant *status*, not danger per se. (-0.5)*  
  > *(c) Revisionist objection stated, but liability requires responsibility for an *unjust* threat, not just unjust cause. (-1)*  
  > *(d) Legal/moral distinction noted, but misrepresents Walzer’s view of moral equality as a concession. (-1)*  

  This structure ensures specificity while highlighting recurring issues in comparable responses.
