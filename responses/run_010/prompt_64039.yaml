  **INTERNATIONAL STANDARD**  
  **ISO/IEC 17025-7:2023(E)**  
  **Laboratory glassware — Certification scheme for the disposition FRAGILE in borosilicate apparatus**  

  **Foreword**  
  ISO/IEC 17025-7 was prepared by Technical Committee ISO/TC 48, *Laboratory Apparatus and Dispositional Properties*. This second edition cancels and replaces the first edition (ISO/IEC 17025-7:2018), which was withdrawn following verified incidents of mimicked fragility in certified reference materials. The committee thanks Dr. A. Finch (UK) for her exhaustive analysis of the 2018 standard’s susceptibility to extrinsic charge-based deception.  

  **1 Scope**  
  This document specifies the method for certifying the disposition FRAGILE in borosilicate laboratory glassware (e.g., beakers, flasks, Petri dishes) under Normal Conditions (see 3.7). It defines test protocols to exclude specimens compromised by finkish dispositions, masking, antidotes, or mimickers (see Clause 3). Specimens exhibiting unfinkable fragility (see 4.1.3) are ineligible for certification.  

  **2 Terms and definitions**  
  For the purposes of this document, the following terms apply:  
  **2.1 FRAGILE**: A disposition of a specimen to shatter when subjected to a Standard Impact (see 3.8).  
  **2.2 Fink**: A process wherein a specimen loses its FRAGILE disposition immediately prior to a Standard Impact.  
  *Example*: A borosilicate beaker wired to receive structural reinforcement only upon detecting an approaching impactor.  
  **2.3 Reverse fink**: A process wherein a specimen gains a FRAGILE disposition only immediately prior to a Standard Impact.  
  *Example*: A non-fragile vessel injected with a weakening agent triggered by impactor proximity sensors.  
  **2.4 Mask**: An extrinsic condition preventing the manifestation of a FRAGILE disposition during a Standard Impact, without altering the disposition itself.  
  *Example*: Immersing the specimen in a shock-absorbing gel during testing. The gel prevents shattering, but the specimen remains FRAGILE.  
  **2.5 Antidote**: An extrinsic intervention applied *during* the manifestation sequence of FRAGILE, halting shattering after initiation.  
  *Example*: A rapid-curing polymer spray activated upon initial crack propagation, arresting further fracture.  
  **2.6 Mimicker**: An extrinsic mechanism causing shattering *without* the specimen possessing the FRAGILE disposition.  
  *Example*: A microcharge bonded to the specimen’s surface, detonating upon impact to simulate shattering.  
  **2.7 Causal basis**: The intrinsic physical microstructure of borosilicate glass responsible for maintaining the FRAGILE disposition under Normal Conditions.  
  **2.8 Standard Impact**: A controlled strike of (5.0 ± 0.1) J delivered by a hemispherical steel tup of radius (10.0 ± 0.05) mm at (23 ± 2)°C.  
  **2.9 Normal Conditions**: Ambient laboratory conditions (23 ± 2°C, 50 ± 10% RH) under which no finks, masks, antidotes, or mimickers are present or anticipated (see Annex A.2).  

  **3 Apparatus**  
  **3.1 Impact Tester**: A pendulum device (e.g., modified Charpy) calibrated to deliver the Standard Impact (2.8). Must include:  
  - **Proximity Sensor Array**: Detects electromagnetic fields > 0.1 mT (to flag mimicker charges) and chemical aerosols (to flag liquid antidotes).  
  - **High-Speed Camera**: Records fracture initiation at ≥ 10,000 fps to distinguish intrinsic shattering from mimicker-induced events.  
  **3.2 Environmental Shield**: A Faraday cage enclosing the test zone to prevent remote fink triggering.  
  **3.3 Vibration Monitor**: Detects ultrasonic frequencies (>20 kHz) indicative of active reverse-fink systems.  

  **4 Method**  
  **4.1 Pre-Test Screening**  
  **4.1.1** Scan specimen for coatings, embedded devices, or compositional anomalies via micro-XRF.  
  **4.1.2** Subject specimen to non-destructive vibration sweep (20–1000 Hz). Reject if resonant damping suggests integrated fink mechanisms.  
  **4.1.3** Apply low-energy probe impact (0.1 J). Specimens exhibiting FRAGILE manifestations that *cannot* be reversed via embedded fink-like mechanisms (e.g., piezoelectric self-strengthening) shall be deemed "categorical" and excluded per Scope.  
  **4.2 Test Execution**  
  **4.2.1** Mount specimen in holder within Environmental Shield.  
  **4.2.2** Initiate Proximity Sensor Array, Vibration Monitor, and High-Speed Camera.  
  **4.2.3** Deliver Standard Impact within 5 seconds of apparatus activation.  
  **4.2.4** Terminate test if shattering occurs or after 10 seconds of monitoring post-impact.  

  **5 Validity of Results**  
  A test is VOID if:  
  a) Proximity sensors detect anomalies (potential mimicker/fink),  
  b) Vibration Monitor records ultrasonic activity (potential reverse fink),  
  c) High-Speed footage reveals fracture initiation inconsistent with intrinsic borosilicate failure modes (e.g., plasma flash suggests charge detonation),  
  d) Environmental parameters exceed Normal Conditions (2.9),  
  e) Specimen exhibits antidote behavior (e.g., crack arrest within 0.5 ms of initiation).  

  **6 Certification**  
  A specimen is certified FRAGILE if:  
  - It shatters under Standard Impact,  
  - No conditions in Clause 5 apply,  
  - It passed 4.1.3 (demonstrating fink susceptibility).  
  *Certificates shall state: "This specimen demonstrated FRAGILE disposition under ISO/IEC 17025-7:2023 Normal Conditions."*  

  **INFORMATIVE NOTE FROM DR. L. THORNE (DISSENTING COMMITTEE MEMBER)**  
  "This standard certifies only that a specimen shattered *under a test protocol designed to exclude known confounding factors*. Clause 2.9 defines Normal Conditions as those under which confounding factors are absent. Thus, we certify that ‘FRAGILE’ manifests when nothing prevents it from manifesting. This is circular. It describes a testing ritual, not a property. A specimen could be certified FRAGILE while possessing a permanent, undetectable internal mask that only fails under conditions we cannot anticipate and thus exclude. The causal basis (2.7) is inferred only *after* successful testing—yet we require its presence *a priori* for true fragility. This reduces FRAGILE to: ‘shatters when it shatters.’"  

  **ANNEX A (Troubleshooting)**  
  **A.1 Common Issues**  
  - **False Positives**: Usually mimickers. Verify XRF detected no energetic residues.  
  - **False Negatives**: Usually masks. Ensure no vibration damping materials contacted specimen.  
  - **Inconclusive Results**: Often antidotes. Review high-speed footage for crack-arrest patterns.  

  **A.2 Interpretation of "Normal Conditions"**  
  "Normal Conditions" (2.9) are defined operationally as conditions under which no test-nullifying phenomena (finks, masks, etc.) occur. This does not imply such conditions are typical or predictable. See Standing Working Group #7 (Operational Normality) for ongoing review.  

  **A.3 Standing Working Group #7**  
  *Brief*: To refine 2.9 ("Normal Conditions") via longitudinal study of environmental/technological threats to dispositional certification.  
  *Meetings*: Biannually (April/October).  
  *Status*: Open-ended. Expected output: Amendments to Clause 2.9 (2040 at earliest).  

