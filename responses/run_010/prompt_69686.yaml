answer: |-
  The testable prediction is that we'd find Minoan-era structures or artifacts submerged in the caldera of Santorini—specifically within the volcanic collapse zone northeast of Akrotiri, where seismic surveys already suggest anthropogenic debris below 60 meters. Go next summer with a deep-water ROV or submersible: if you document engineered walls, pottery, or tools datable to the Late Bronze Age eruption strata, it corroborates Plato’s core narrative of a sophisticated island civilization catastrophically drowned. If, however, high-resolution scans and dives across that targeted shelf reveal only unworked volcanic rock—no cultural material whatsoever despite optimal preservation conditions—I’d concede Thera cannot be Atlantis’s inspiration.  

  But understand: this isn’t "an entire ocean" blind search. Plato’s geography points to the "Pillars of Heracles," which ancient sources sometimes placed at the Aegean’s gateway. Thera’s eruption chronology aligns with Solon’s *transcribed* Egyptian accounts of a pre-Athenian maritime power shattered by floods. You dismiss the textual chain—yet Herodotus validated Egypt’s Saite records on other points, and temple archives *did* preserve millennia-old catastrophes, like the real Sea Peoples’ invasions. Troy was myth until Schliemann followed the text; here, we have sediment cores proving Thera’s tsunami devastated Crete, and Akrotiri’s frescoes show a vibrant, palatial culture that vanished overnight. Absence of a sunken city? Submerged Neolithic villages like Atlit-Yam *were* found off Israel. If we strike out at Thera, it falsifies *that* site—not the hypothesis that Plato recorded a distorted memory of a real disaster. The burden shifts to skeptics: why do global flood myths and drowned-city legends persist where geology confirms post-glacial submersion, like Doggerland? Atlantis isn’t unfalsifiable; it’s waiting for its underwater survey.
