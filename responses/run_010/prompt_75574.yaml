answer: |-
  *(Transcript lies between them on the table. Coffee grows cold.)*

  **Epiphenomenalist (E):** The Duplicator transcript *demonstrates* my point. All this rich phenomenology-talk emerges from complex neural processing. That processing carries *information* about associated phenomenal states. The report "I see red" is caused by neural state N, which reliably co-occurs with the experience of red. Accuracy is secured by that reliable covariation, not causation.

  **Opponent (O):** But why call the content *about* the experience? If N causes "red," and N correlates with experience E, why isn't "red" directly about N? The causal chain terminates at N. Invoking E as the *intentional object* seems gratuitous unless E *does* something, like constrain the report’s correctness beyond N’s presence.

  **E:** Because the neural state N functions as a representation *of* E within the cognitive system. Its causal role, shaped by evolution and learning, establishes its content as being *about* E. N doesn’t represent itself; it’s a signifier for the phenomenal state it’s informationally linked to.

  **O:** That linkage is precisely what epiphenomenalism severs! If E doesn’t affect N, the "informational link" is just a brute correlation. More damningly, *your belief* in epiphenomenalism, and even your belief that you *have* experiences, is caused by neural states, not by the experiences themselves. How can you trust beliefs utterly insensitive to their supposed objects?

  **E:** We don’t demand that mathematical beliefs be *caused* by numbers, nor modal beliefs by possible worlds, yet we grant knowledge there. Justification for epiphenomenalism comes from conceiving scenarios like the Duplicator and exclusion arguments against causal overdetermination – reasoning independent of trusting introspective reports about current phenomenology.

  **O:** That reasoning might get you to the *theory*, but it doesn’t save your first-person warrant for believing *you* have experiences *now*. Look at this transcript. If attached to *you*, the Duplicator produces *this exact output*, including "I feel certain I'm conscious." You have no first-person way to distinguish being you from being a phenomenal zombie generating this transcript. How can you assert *you* have experiences?

  **E:** I concede I can’t introspectively rule out being a Duplicator subject *right now*. But the *truth* of my beliefs doesn’t require that ability. My actual neural state N, when I report "I see red," *is* linked to my actual experience E. The Duplicator subject has state N' causing "I see red," but lacks E. Their report is *false* about experience, though caused identically.

  **O:** Can you consistently say that sentence? "The Duplicator subject has no experience." If phenomenal states are epiphenomenal, what makes *that* claim true? Is there some non-phenomenal fact that *grounds* the absence of experience in them but its presence in you? Or is this special pleading?

  **E:** No pleading. The truthmaker is the absence of the specific, non-physical phenomenal properties postulated by the theory. In me, certain neural processes are accompanied by these properties; in the Duplicator replica, physically identical processes lack that accompaniment. The claim "They lack experience" is true because those extra properties are absent.

  **O:** But how could *you* ever *know* that absence, or presence, given the causal insulation? Your assertion relies on a theory whose evidence – including the conceivability you cite – is ultimately grounded in introspective reports you’ve just rendered causally inert and indistinguishable from zombie outputs. The theory eats its own tail.

  **E:** The evidence isn't *only* introspection. It's the seeming intractability of the hard problem, the structure of our concepts, the failure of functional duplicates to conceptually *entail* phenomenology. My belief that *I* have experiences? It’s a basic, non-inferential belief justified by its intrinsic, phenomenally grounded assertiveness – even if that assertiveness is neurally realized and not causally efficacious.

  **O:** Intrinsic assertiveness neutered by causal impotence is no justification. You’re left asserting truths about an inaccessible realm based on processes indistinguishable from those generating falsehoods. The Duplicator doesn't just threaten your self-knowledge; it undermines your ability to meaningfully *refer* to the epiphenomenal at all from within the system.

  *(Silence hangs. They look at the identical transcript.)*

  **Ledger:**
  *   **O Concedes:** Conceivability arguments have force; epiphenomenalism is internally consistent; requiring object-causation for content/knowledge isn't universal (e.g., math).
  *   **E Concedes:** First-person indistinguishability from a zombie; inability to introspectively verify current phenomenology's presence or absence; justification for self-ascriptions is deeply problematic.
  *   **Live Dispute:** Whether reliable covariation sans causation suffices for intentional content about experience; whether epiphenomenalism can provide non-question-begging justification for *any* belief about experience (including its own truth and the subject's own states).
  *   **Settling Evidence/Argument:** A successful reductive explanation of phenomenology (favoring O) or a demonstration that reference/content can be fixed without causal efficacy (favoring E). Resolution of the "grounding" problem for phenomenal absences.
