  ## Adjudication: Tolstoy, Schopenhauer, and the Perilous Abstraction of the *Kreutzer Sonata*

  The dispute concerning Tolstoy’s *The Kreutzer Sonata* and its relationship to Schopenhauer’s aesthetics of music presents a fascinating collision of metaphysics, moralism, and narrative phenomenology. Your reading seeks to rescue the novella from being a simple rejection of Schopenhauer, positioning Pozdnyshev as a failed adept rather than a counterexample. Your friend counters that Pozdnyshev’s violent response *is* the counterexample generated by Schopenhauer’s own premises about music’s unique ontological status. To adjudicate, we must first map the conceptual terrain with precision.

  **1. Brainstorming and Mapping: The Hinges of Dispute**

  *   **Your Characterization:**
      *   *Schopenhauer:* Music is the unmediated objectification of the Will itself, presenting the inner essence of all phenomena – the restless striving, suffering, and fleeting satisfactions – in abstract, universal form, devoid of individuated objects or concepts. Aesthetic experience requires the suspension of the individual will, achieved through pure, will-less contemplation. The listener becomes the universal subject of knowledge, temporarily freed from servitude to their own willing. Music’s power is profound and direct precisely *because* it bypasses the mediating Ideas.
      *   *Tolstoy (Infection Theory):* Art’s value lies in its power to infect the audience with the artist’s genuine feeling, fostering moral and religious unity. Good art communicates universal feelings of brotherhood; bad art communicates corrupting feelings like sensuality or pride. The effect is concrete, practical, and morally evaluable.
      *   *Novella’s Core:* Pozdnyshev experiences the Beethoven sonata not as Tolstoy’s ideal infection (which would foster unity) nor as successful Schopenhauerian contemplation, but as a failed, corrupted aesthetic event where his own possessive narrative overwhelms the potential for pure listening. The phenomenology of the performance scene aligns with Schopenhauer’s description of music’s power, even as the outcome horrifies Tolstoy.

  *   **Your Friend’s Characterization:**
      *   Pozdnyshev *does* access music’s abstract, universal content (the Will in Schopenhauer’s terms: desire, passion, longing). However, rather than inducing will-less contemplation, this abstract content serves as pure fuel for his *own*, highly individuated and pathological will (sexual jealousy, possessiveness). The murder demonstrates that Schopenhauer’s promised detachment is an illusion; the abstract presentation recruits the listener’s specific will rather than suspending it. The theory fails its own test case.

  *   **Candidate Hinge Propositions:**
      1.  **The Nature of Music’s Content & Its Effect:** Is the abstract, universal nature of musical content (Schopenhauer’s Will-objectification) *inherently* dissociable from the listener’s individuated will and concrete desires, enabling contemplation? Or can this very abstraction act as a potent, non-conceptual catalyst that *amplifies* or *recruits* the listener’s specific, embodied willing?
      2.  **The Requirement of Will-Lessness & Music’s Directness:** Does Schopenhauer’s claim that music acts “more powerfully and quickly than all the other arts” (due to its direct Will-presentation) fundamentally *undermine* the possibility of achieving the disinterested, will-less contemplation he demands for aesthetic experience? Is the suspension of the will even possible when faced with an art form embodying the Will itself?
      3.  **Agency in Reception: Music’s Doing vs. Listener’s Contribution:** When a listener like Pozdnyshev experiences intense, destructive emotions during music, is this primarily attributable to the *music’s* inherent expressive content (as abstract Will), or is it overwhelmingly the result of the *listener’s* pre-existing psychological state, biography, and imposed narrative? Does Schopenhauer’s theory adequately account for the listener’s constitutive role in shaping the aesthetic event?

  *   **The Decisive Hinge and Qualifications:**
      The decisive hinge is **#3: Agency in Reception.** The dispute fundamentally turns on whether Pozdnyshev’s jealousy and violence are a necessary consequence of music’s abstract presentation of the Will (as your friend argues), or whether they are a pathological *failure* to engage with that abstraction aesthetically, caused by Pozdnyshev’s own narrative imposition and situatedness (as you argue). Hinge #1 is crucial but subsumed: *if* the listener’s contribution dominates, the abstract nature doesn’t *cause* the individuated response; it merely provides a stimulus shaped by the listener. Hinge #2 highlights a genuine tension within Schopenhauer, but its resolution depends on how we answer Hinge #3.

  *   **Qualifications:**
      *   *Schopenhauer:* Your characterization is largely accurate, but risks underplaying the *physicality* Schopenhauer sometimes ascribes to music’s effect (e.g., its direct influence on the pulse). Furthermore, his insistence on will-lessness can feel like an ideal state achieved only fleetingly, even by the most cultivated listener. The gap between ideal contemplation and typical listening is significant.
      *   *Tolstoy:* Your contrast is sound. However, while Tolstoy’s later infection theory is explicitly moralistic, the novella’s power lies partly in its ambivalence. Pozdnyshev’s unreliability complicates any straightforward application of Tolstoy’s later *theory* as the novella’s definitive message. The performance scene’s phenomenological description may indeed exceed Tolstoy’s own intended moral framework.

  **2. The Reading: Pozdnyshev Through the Schopenhauerian Lens**

  Schopenhauer’s aesthetics genuinely illuminates key aspects of Pozdnyshev’s experience, particularly the performance scene:
  *   **Music’s Overwhelming Power:** Pozdnyshev’s description of being “transported,” of feeling emotions “not his own,” resonates powerfully with Schopenhauer’s account of music bypassing intellect and directly moving the listener via its embodiment of the Will. The immediacy and intensity align with Schopenhauer’s claim for music’s unique potency.
  *   **The Abstract Catalyst:** Pozdnyshev doesn’t hear a *narrative* of adultery in the music; he hears *passion*, *longing*, *conflict*, *resolution* – precisely the universal affective states Schopenhauer identifies as the abstract essence of the Will. The music provides a non-conceptual, emotionally charged substrate.
  *   **The Failure of Contemplation:** Schopenhauer’s framework highlights Pozdnyshev’s fundamental failure. He is incapable of will-less contemplation. His identity as a possessive husband, riddled with misogyny and sexual anxiety, means his *individual will* is hyper-present. He is not the universal subject of knowledge; he is Pozdnyshev, the jealous claimant. The distinction between contemplating the Will and *being moved* by it collapses for him because his will is not suspended; it is activated and seeking confirmation. He actively *uses* the music’s abstract emotional field, projecting onto it his specific narrative of suspicion (“*They* said everything...”). The music doesn’t implant the idea of adultery; it provides the emotional intensity and ambiguity that Pozdnyshev, in his pathological state, interprets *as* evidence of a shared secret between his wife and Troukhatchevsky. His later retrospective justification – that the music revealed their true feelings – is a self-serving rationalization of his own projection.

  However, the novella resists a *pure* Schopenhauerian reading:
  *   **Tolstoy’s Moral Intent:** The epilogue and Pozdnyshev’s broader diatribe against sensuality and marriage unequivocally frame the story as a warning against carnal love. While Pozdnyshev’s pathology is central, Tolstoy clearly intends the music’s power as part of a dangerous, sensually stimulating force that can bypass reason and moral restraint – a view incompatible with Schopenhauer’s positive valuation of music as a temporary release from the will’s torment.
  *   **Pozdnyshev’s Unreliability:** Pozdnyshev is a self-dramatizing, deeply unreliable narrator. His account of the music’s effect, particularly his retrospective interpretation, is filtered through his guilt, self-justification, and profound misogyny. We cannot take his phenomenological report at face value as an objective description of musical perception. His claim that music “transports” one into another’s state may be less an insight into music’s essence and more a projection of his own paranoia and desire to externalize blame.

  **3. Verdict**

  **Your reading holds greater philosophical and textual validity, but requires significant qualification concerning listener situatedness and the limits of Schopenhauer’s ideal.**

  Pozdnyshev is indeed a *failed* Schopenhauerian listener, not a counterexample proving the theory’s failure. The novella demonstrates the *conditions required* for Schopenhauerian contemplation and how easily they can be sabotaged by the listener’s own will-driven psychology and social situatedness. Pozdnyshev never achieves the state of will-less knowing; his individual will, in the form of possessive jealousy and misogynistic anxiety, actively shapes his reception from the outset. He supplies the individuated narrative; the music supplies the abstract affective energy. The murder stems from Pozdnyshev’s pathology, not from an inherent property of Beethoven’s music or Schopenhauer’s metaphysics.

  However, the novella *does* expose a critical vulnerability in Schopenhauer’s system, though not the one your friend proposes. Schopenhauer underestimates the profound difficulty of achieving pure contemplation, especially concerning the art form that *is* the Will itself. Music’s very directness and abstraction make it peculiarly susceptible to being co-opted by the individual will. The theory relies on an idealized subject often absent in concrete listening situations, particularly those laden with personal stakes (like Pozdnyshev listening to his wife and a rival). Schopenhauer provides the ontology and the ideal state but lacks a robust account of the messy phenomenology of actual reception where the listener’s biography constantly threatens to collapse the distinction between universal Will and individual willing. Pozdnyshev isn’t a counterexample to the *possibility* of Schopenhauerian listening, but he is a devastating case study of its *fragility*.

  **4. The Strongest Reply Against the Verdict**

  Your friend’s strongest counter, drawing on the philosophy of music itself, would be this: Even granting Pozdnyshev’s pathology, Schopenhauer claims music presents the Will *in abstracto*, inherently dissociated from individuated motives. If this abstract presentation can be so readily recruited and transformed into fuel for specific, violent willing by *any* listener with latent desires (as Pozdnyshev demonstrates), does this not fatally undermine Schopenhauer’s core claim about its effect – the inducement of will-less contemplation? Is the theory falsified by the sheer ease with which the abstract becomes concrete in the listener’s psyche? Cognitivist accounts (e.g., Kivy) might argue we *hear* emotion in music without *feeling* it, but Schopenhauer explicitly links the perception of the Will to a profound affective resonance in the listener. Arousalist accounts (e.g., Matravers, Robinson) emphasize music’s direct arousal of emotion, which aligns with Pozdnyshev’s experience but seems incompatible with Schopenhauerian detachment. Schopenhauer’s abstraction claim seems to function problematically: as a *theory of content* (music = universal Will), it seems plausible; as a *theory of effect* (this content induces detachment), it appears empirically fragile, as Pozdnyshev shows. The directness of music’s action might inherently resist the disinterestedness Schopenhauer requires for aesthetic experience proper. Nietzsche’s critique – that Schopenhauerian contemplation is a disguised form of physiological *stimulation* – finds a grim resonance here: the *Kreutzer Sonata* stimulates Pozdnyshev’s will, not his transcendence.

  *   **Survival of the Verdict:** This reply highlights a genuine tension but does not destroy the core verdict. Schopenhauer’s theory does not promise that music *cannot* stimulate the will; it describes an aesthetic *achievement* (contemplation) that requires specific conditions. Pozdnyshev’s experience confirms that without those conditions (will-lessness), music’s power *can* be harnessed by the individual will. The theory describes an ideal state, not a guaranteed outcome for every listener in every context. The vulnerability lies in Schopenhauer’s insufficient attention to the *conditions of reception* and the ease with which his ideal can be corrupted, *not* in a logical contradiction within the premises themselves. The abstraction *can* be contemplated universally; Pozdnyshev proves only that it *can also* be misappropriated concretely by a non-contemplative listener. The theory survives, but its practical scope is narrowed, and its dependence on listener disposition is starkly revealed.

  **5. What the Fiction Adds: The Ethics of Situated Listening**

  *The Kreutzer Sonata* contributes something indispensable that pure philosophical argument cannot: a concrete, visceral exploration of the **ethics of situated listening**. While treatises debate the ontology of musical content or the possibility of disinterestedness, Tolstoy’s narrative forces us to confront the *listener in the world*. Pozdnyshev is not an abstract subject of knowledge; he is an embodied, historically specific, morally flawed man entangled in relationships of power, possession, and suspicion. The novella shows that **the aesthetics of music cannot be separated from the ethics of the listener**.

  It exposes the critical flaw in Schopenhauer’s system hinted at earlier: the exemption of music from the realm of Ideas (the mediated representations governing other arts) creates a unique problem for describing its reception. Precisely because music lacks conceptual or representational content, its meaning is radically dependent on the interpretive frame supplied by the listener. Schopenhauer smuggles in the universal subject to provide this frame, but Pozdnyshev demonstrates how easily that frame is replaced by the listener’s own biography, desires, and pathologies. The abstract Will becomes terrifyingly malleable in the hands (or ears) of the situated listener. The novella argues, contra Schopenhauer, that there is no innocent listening. Reception is always filtered through the listener’s moral and psychological constitution.

  The historical irony of Beethoven’s sonata being deemed “unintelligible” by its dedicatee, Kreutzer, is not mere decoration. It underscores Tolstoy’s point: reception is contingent, flawed, and deeply personal. If the virtuoso for whom it was written couldn’t grasp it, Pozdnyshev’s violent misinterpretation becomes a horrifyingly plausible extreme on the spectrum of failed reception. Music’s meaning is never guaranteed by the score or the composer’s intent; it is forged perilously in the space between sound and listener.

  Janáček’s String Quartet No. 1 (“Kreutzer Sonata”), while a powerful artistic response, adds less to the *philosophical* adjudication than the historical fact. It translates Tolstoy’s narrative *about* music’s power back *into* music, creating a compelling meta-commentary on art’s capacity to evoke complex emotional and dramatic states. However, it doesn’t directly test our verdict on the Schopenhauer-Tolstoy dispute; it confirms the power of music to embody narrative and emotion (which neither philosopher would deny), but it doesn’t resolve the specific questions about abstraction, will-lessness, and listener agency central to this argument. Its value lies more in demonstrating music’s expressive richness than in settling this particular metaphysical and ethical clash.

  **Conclusion**

  Your reading successfully demonstrates that Pozdnyshev embodies a failure of Schopenhauerian listening, not its refutation. The murder arises from his pathological will imposing a concrete narrative of jealousy onto the abstract emotional landscape of Beethoven’s music. Schopenhauer’s account of music’s content and power illuminates the intensity of Pozdnyshev’s experience, while his requirement for will-less contemplation highlights Pozdnyshev’s fatal incapacity. However, the novella performs a devastating service to philosophy by exposing the fragility of Schopenhauer’s ideal and the inescapable role of the situated, ethically constituted listener. Pozdnyshev’s tragedy is less a counterexample to Schopenhauer’s metaphysics and more a grim testament to the ease with which the contemplation of the universal Will can be corrupted into the service of the most violent, individuated willing. Tolstoy, the moralist, uses the failure to warn against sensuality; the philosopher, reading against Tolstoy’s own later theory, finds a profound cautionary tale about the perilous intersection of absolute music and the all-too-human will. The *Kreutzer Sonata* ultimately argues that the ethics of listening are inseparable from the aesthetics of music.
