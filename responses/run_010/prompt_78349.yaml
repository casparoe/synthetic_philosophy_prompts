prompt: |-
  So when a US agency runs a cost-benefit analysis of a regulation it has to discount: a statistical life saved or a ton of carbon avoided in 2125 gets entered at some small fraction of the same thing next year, and the rate is picked by looking at what private capital or government debt actually returns. Meanwhile the same government licenses a nuclear waste repository on the requirement that it isolate its contents for ten thousand years, as if harms that remote counted at full face value — and it spends plenty of effort protecting people from their own impatience, with automatic enrollment in retirement saving and caps on payday lending.

  What does the discounting requirement actually presuppose about what we owe the future? Is it committed to pure time preference, later welfare mattering less just because its later, or can it run entirely on other premises — that future people will be richer so their marginal utility is lower, or that the rate merely tracks the opportunity cost of capital? Tell me which rival views the practice rules out and which it's only consistent with, since I suspect several very different theories license the same arithmetic. Then: can it live alongside the ten-thousand-year waste standard and the anti-impatience programs, or is one of those quietly smuggling in a philosophy the discounting denies? And if you concluded pure time preference was ethically indefensible — a weakness of imagination rather than a principle — what would have to change in how these analyses get built, besides the number?
reasoning: |-
  Okay, let me try to unpack this user's query. They're pointing out a contradiction in how the US government treats future costs and benefits. On one hand, regulations discount future lives saved or carbon reduced, using market rates. On the other, they require nuclear waste safety for 10,000 years and protect people from their own impatience. The user wants to know what discounting presupposes about our obligations to the future, which ethical views it allows, and how it coexists with those long-term policies.

  First, I need to break down the discounting practice. The user mentions discounting future statistical lives and carbon reductions based on capital returns. That's standard in cost-benefit analysis (CBA). The key here is understanding the justifications behind discounting. Pure time preference? Lower marginal utility? Opportunity cost? The user suspects multiple theories can lead to the same arithmetic, so I should clarify which views are compatible.

  Pure time preference means valuing present welfare more just because it's now. Many philosophers, like Parfit, criticize this as unethical. Then there's the diminishing marginal utility argument: future people might be richer, so each dollar or unit of welfare is worth less to them. Opportunity cost is practical—money spent now could be invested for higher returns later. 

  The user asks which rival views the practice rules out. If agencies use market rates, they're likely mixing opportunity cost and expected growth. This approach rules out strong sustainability views that forbid trading off future essential goods, like lives or a stable climate. It also conflicts with zero discount rate advocates. But it's compatible with both opportunity cost and marginal utility arguments, even if pure time preference is present.

  Next, the tension with nuclear waste standards and anti-impatience policies. The 10,000-year requirement treats future harms as equally important, implying no discounting. Anti-impatience measures like automatic retirement savings assume people undervalue their future selves. How does discounting in CBA coexist with these? The nuclear waste case is a bright-line rule—absolute protection regardless of time. Anti-impatience policies correct for individual irrationality, while discounting in CBA is about collective resource allocation. Different domains, different ethical assumptions. But the user might see hypocrisy here. Is the government inconsistent?

  If pure time preference is indefensible, what changes beyond the discount rate? The user hints it's a failure of imagination. Eliminating pure time preference would require lower discount rates. But more importantly, CBA might need to distinguish between types of goods—essential vs. fungible. Climate change and nuclear waste involve irreversible harms, maybe justifying lower or zero discount rates. Also, uncertainty matters; high uncertainty might warrant lower rates. Distributional impacts should be considered separately. The process could involve more democratic input on long-term trade-offs.

  I should also consider the user's deeper concerns. They might be questioning the ethical foundations of policy-making. Are we shortchanging the future? The nuclear waste example shows society can commit to long-term safety, yet discounting in CBA does the opposite. The user might want a coherent ethical framework for intergenerational justice. They might be interested in how economic tools can align with moral principles, or if they inherently conflict.

  In summary, the user needs clarity on the presuppositions of discounting, which ethical theories it aligns with, how conflicting policies coexist, and the implications of rejecting pure time preference. The answer should address the technical aspects of discounting while tying into broader ethical and policy coherence issues.
answer: |-
  This is a profound observation that cuts to the heart of intergenerational ethics and policy coherence. Let's break it down:

  **What Discounting in CBA Presupposes & Which Theories it Allows:**

  Discounting future benefits/costs (like lives saved or carbon reduced) at a rate derived from market returns (e.g., 2-7%) is *arithmetically* compatible with several distinct philosophical justifications, but *operationally* rules out others:

  1.  **Compatible Justifications (Theories that "license the same arithmetic"):**
      *   **Opportunity Cost of Capital (OCC):** Resources spent today on regulation could be invested elsewhere (private capital, gov debt) earning a return. Future benefits must exceed that foregone return to be worthwhile. This is **pragmatic**, not necessarily ethical. It focuses on maximizing overall wealth/consumption potential over time.
      *   **Diminishing Marginal Utility of Consumption (DMUC):** Future generations are expected to be richer (due to technological progress, capital accumulation). An extra dollar (or unit of consumption) provides *less utility* to a richer person. Discounting future monetary costs/benefits reflects this lower *marginal utility*. This relies on **empirical predictions** about growth and **assumes substitutability** between goods/money and welfare.
      *   **Pure Time Preference (PTP) - Weak Form:** Some argue for a *small* positive discount rate for future utility/welfare itself, reflecting minimal uncertainty about future existence or a slight societal "impatience." This is controversial but hard to distinguish empirically from DMUC at low rates.

  2.  **Ruled Out or Incompatible Justifications (Theories the practice implicitly rejects):**
      *   **Pure Time Preference (PTP) - Strong Form:** The idea that *welfare itself* (not just consumption) is inherently less valuable simply because it occurs later in time. Standard CBA discounting *uses* a rate, but its *justification* typically avoids explicitly endorsing strong PTP as an *ethical principle*. Using market rates masks this – it's presented as OCC/DMUC.
      *   **Zero Discount Rate:** The view that future welfare matters *exactly as much* as present welfare (e.g., Ramsey's "ethically indefensible" position). Using *any* positive discount rate derived from markets inherently contradicts this.
      *   **Strong Sustainability / Non-Substitutability:** Views holding that certain critical natural capital (like a stable climate) or basic rights (like life) are *irreplaceable* and cannot be traded off against increased future consumption. Discounting treats future lives/climate damage as fungible with other investments/consumption. The nuclear waste standard implicitly rejects substitutability for *that specific harm*.
      *   **Precautionary Principle (Strong Form):** Where high uncertainty about catastrophic future risks warrants acting *as if* the discount rate were zero or negative for those specific risks. Standard discounting, especially high rates, downplays such risks.

  **Can Discounting Coexist with the 10,000-Year Standard & Anti-Impatience Programs?**

  Yes, but only through **compartmentalization and domain-specific ethics**, creating significant tension:

  1.  **Nuclear Waste (10,000 Years):**
      *   **Domain:** Irreversible Harm & Catastrophic Risk. The standard treats *this specific harm* (radiation leakage) as absolutely unacceptable, regardless of temporal distance. It reflects:
          *   **Non-Substitutability:** Future lives/environment are valued intrinsically; no amount of future wealth compensates for this harm.
          *   **Deontological/Rights-Based Ethics:** Future generations have a right not to be harmed by our waste.
          *   **Weak or Zero Discounting:** Harms 10,000 years away are treated *as if* they occur today in terms of regulatory burden. This implicitly rejects the discount rate used in standard CBA *for this specific context*.
      *   **Coexistence Mechanism:** It's a bright-line *prohibition* based on harm type, not a trade-off calculation. The standard says "this risk must be reduced to near zero *regardless of cost or time*," sidestepping discounting entirely for this defined risk.

  2.  **Anti-Impatience Programs (Retirement Saving, Payday Lending Caps):**
      *   **Domain:** Individual Cognitive Biases & Self-Harm. These programs assume individuals *systematically undervalue their own future welfare* due to impulsivity, present bias, and difficulty planning.
      *   **Reflection:** This explicitly *rejects* the descriptive validity of pure time preference at the individual level. It acknowledges individuals *should* value their future selves more highly than their impulses lead them to.
      *   **Coexistence Mechanism:** Correcting *individual irrationality* is seen as distinct from *societal intertemporal resource allocation*. CBA discounting uses market rates reflecting revealed societal preferences (flawed or not), while these programs paternalistically correct individual decision-making flaws. The government acts *as if* individuals have a duty to their future selves, but doesn't necessarily apply that same duty to future *generations* in CBA.

  **The Contradiction:** The anti-impatience programs show the government recognizes that *undiscounted* valuation of one's *own* future is rational/desirable. The nuclear waste standard shows it recognizes an obligation to *future others* so strong it demands near-zero risk over immense timescales. Yet, standard CBA discounting, applied to regulations affecting future lives/climate, implicitly devalues those *future others* significantly based on temporal distance, largely justified by OCC/DMUC arguments that seem morally shallow compared to the principles invoked in the other domains.

  **If Pure Time Preference (PTP) is Ethically Indefensible: What Changes?**

  Rejecting PTP (the idea welfare matters less *just* because it's later) doesn't eliminate discounting, but it profoundly changes its justification and application:

  1.  **Lower Discount Rates:** The discount rate would need to be based *solely* on:
      *   **Expected Growth (DMUC):** Requires careful, potentially conservative, projections of future income growth.
      *   **Risk of Catastrophe/Nonexistence:** A separate "probability of existence" factor, distinct from pure time preference.
      *   **Opportunity Cost - Critically Examined:** The OCC argument would need scrutiny. Is the *market* rate the right benchmark for *societal* investments in future safety/welfare? Should the "return" be measured purely financially, or in broader welfare terms? A lower "social discount rate" might be justified.

  2.  **Distinguish Goods:** Not all future impacts are equal.
      *   **Critical, Irreplaceable Goods (Lives, Key Ecosystems, Climate Stability):** Apply very low or even zero discount rates, recognizing non-substitutability and catastrophic risk (akin to nuclear waste logic).
      *   **Fungible Consumption Goods:** Apply discount rates based *only* on DMUC (expected income growth) and risk of non-delivery, *not* pure time.

  3.  **Explicitly Model Uncertainty & Catastrophic Risk:** High uncertainty about long-term futures (like climate tipping points) warrants techniques like declining discount rates, scenario analysis, or precautionary minimum standards, rather than high constant discount rates that bury tail risks.

  4.  **Separate Discounting from Distributional Ethics:** Explicitly account for equity concerns *separately*. Discounting based *only* on DMUC assumes future generations are richer. What if they aren't (e.g., due to climate collapse)? Discounting would worsen intergenerational inequality in that scenario. Analyses need to consider distributional impacts independently.

  5.  **Procedural Changes:** Incorporate explicit ethical deliberation about intergenerational obligations into the rulemaking process, rather than hiding behind the technical facade of a market-derived discount rate. Acknowledge the value judgments involved.

  **In essence:** Ditching pure time preference doesn't mean using a zero discount rate. It means shifting the justification *entirely* to DMUC and carefully calibrated risk adjustments, critically examining the OCC argument, applying much lower (or zero) rates to critical non-substitutable goods, and explicitly confronting the ethical dimensions and uncertainties of long-term impacts that standard discounting obscures. The "number" changes, but more importantly, the *reasoning* and *scope* of discounting change fundamentally. The nuclear waste standard and anti-impatience logic become guides, not contradictions, forcing a more ethically consistent valuation of the future.
