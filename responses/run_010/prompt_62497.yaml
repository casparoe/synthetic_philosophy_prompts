answer: |-
  ## Exploratory Working: Candidate Principles

  Let's generate and test principles against your five decisions. We'll discard those that consistently fail.

  **Candidate Principle A: The Consent Principle**  
  *The novelist may only represent the dead in ways they would have consented to, if consent were possible.*  
  - Test against Decision #2 (lovers): Would she consent to being portrayed as an adulterer? Unlikely. Fails.  
  - Test against Decision #5 (softened pastor): Would the *pastor* consent to being softened? Probably not, if he saw himself as righteous. Fails.  
  *Discard:* Pure consent is impossible to ascertain and paralyzing. It ignores the novelist's purpose and the subject's lack of voice.

  **Candidate Principle B: The Pure Fidelity Principle**  
  *The novelist must adhere strictly to the documented record. All invention is wrong.*  
  - Test against Decision #1 (invented brother): Clearly violated. Fails.  
  - Test against Decision #4 (blasphemous thoughts): The diary doesn't record such thoughts. Violated. Fails.  
  *Discard:* This eliminates the novel *as fiction*. It conflates history with art and ignores the necessity of filling gaps in a human life.

  **Candidate Principle C: The Utilitarian Principle**  
  *The novelist's obligation is to maximize understanding, insight, or artistic truth for the living audience. Harm is justified if the benefit outweighs it.*  
  - Test against Decision #3 (changed death): Moving her death for "architecture" likely doesn't generate sufficient unique insight to justify falsifying a core fact. Fails (arguably).  
  - Test against Decision #5 (softened pastor): Softening protects the living descendant (benefit) but potentially distorts historical understanding (harm). Ambiguous.  
  *Discard:* Too slippery. Justifies almost any violation if the *novelist* deems the art "worth it." Prone to self-serving bias.

  **Candidate Principle D: The "No Harm to Living" Principle**  
  *The only obligations are to avoid causing distress, reputational harm, or material disadvantage to living persons.*  
  - Test against Decision #2 (lovers): Directly harms the schoolmaster's descendant (distress, potential reputational harm). Fails.  
  - Test against Decision #1 (invented brother): No living person harmed. Passes.  
  - Test against Decision #3 (changed death): No living person harmed (no descendants). Passes?  
  - Test against Decision #4 (blasphemous thoughts): No living person harmed. Passes?  
  - Test against Decision #5 (softened pastor): Protects the living friend. Passes?  
  *Hold:* This has traction but feels incomplete. Does it license *anything* for the truly obscure? Is that sufficient?

  **Candidate Principle E: The Fidelity to Essence Principle**  
  *The novelist must capture the core truth of the person's character, struggles, and historical context as revealed by the record, while filling gaps consistently with that essence.*  
  - Test against Decision #3 (changed death): Altering the fundamental fact of *when and how she died* contradicts the essence of her documented life's trajectory and context (surviving 1848, dying later of disease). Fails.  
  - Test against Decision #4 (blasphemous thoughts): If the *essence* of her piety is conventional, a moment of profound doubt *might* be consistent with a hidden inner struggle – but the extremity ("bordering on blasphemy") risks violating the essence if the record shows unwavering conformity. Ambiguous, depends on execution.  
  *Hold:* More promising. Focuses on integrity to the subject *as known*.

  **Candidate Principle F: The Genre Contract Principle**  
  *The novelist's obligation is defined by the reasonable expectations of the audience for the genre ("historical novel"), which includes a blend of fact and invention within understood bounds.*  
  - Test against Decision #3 (changed death): Reasonable readers expect key biographical facts (birth, death) to be accurate in a historical novel. Violation breaks contract. Fails.  
  - Test against Decision #1 (invented brother): Reasonable readers expect invented supporting characters. Passes.  
  - Test against Decision #2 (lovers): Reasonable readers expect romantic speculation *if* the record hints at it. Pure invention from silence likely exceeds bounds. Fails.  
  *Hold:* Useful for framing the epistemic and aesthetic questions.

  **Working Conclusion:** Principles D (No Harm to Living), E (Fidelity to Essence), and F (Genre Contract) survive initial testing and offer different angles. Principle A, B, and C are discarded. Principle D is necessary but insufficient alone. Principles E and F address the core tension between fact and fiction more directly.

  ---

  ## The Weight of the Unremembered: Obligations to the Real Dead in Fiction

  Your anxiety is a testament to the gravity of the act: conjuring a life from fragments, breathing imagined air into documented bones. The three wrongs you identify – falsification, usurpation, ventriloquism – are distinct facets of a single, profound ethical challenge: **the responsible stewardship of a real human being’s legacy within the inherently transformative medium of fiction.** They come apart in their mechanisms but converge in their root: the potential violation of **integrity** – the integrity of the historical record, the integrity of the person as she existed, and the integrity of the artistic project itself. Let us dissect this through your requested registers.

  ### I. The Epistemic Register: What Does Your Book *Do* to What is Known?
  Your book enters the ecosystem of knowledge not as history, but as a powerful simulacrum. The "falsification wrong" is fundamentally epistemic. It concerns the *effect* your novel has on public understanding. For the obscure subject, the risk is acute: your novel *may become the dominant, perhaps sole, representation* for many readers. Inventing a brother (Decision #1) adds a layer; it doesn't contradict existing knowledge but supplements it falsely. The changed death (Decision #3), however, is a direct epistemic assault. It replaces a known fact (typhus, 1851, home) with a fabricated one (1849, troops, street). This doesn't just fill a gap; it dynamites a known wall and builds a fiction in its place. The affair (Decision #2) injects a significant, unsubstantiated claim about interpersonal relationships into the record. The softened pastor (Decision #5) subtly distorts a documented character. Blasphemous thoughts (Decision #4) add an interior state unsupported but *not contradicted* by the record – it occupies the ambiguous space of the unknowable, potentially coloring interpretation without directly falsifying an event. **Prominence matters intensely here.** For the obscure, the novelist bears a heavier epistemic burden precisely because they might be creating the *only* coherent narrative many encounter. The framing (author's note, "based on true events") mitigates *but does not erase* this effect. It signals the genre contract but cannot prevent readers from absorbing the vivid fiction as de facto truth, especially regarding details not widely known. An author's note is a signpost, not an absolution.

  ### II. The Moral Register: Who Can Be Wronged, and How?
  Here lies the metaphysical heart: **Can the dead be wronged?** I contend they cannot be *harmed* in the experiential sense – no sensation, no suffering attends their posthumous representation. However, they *can* be **wronged**. This wrong lies not in causing them pain (impossible), but in violating a **duty of fidelity** owed to them *as the unique person who lived that specific life*. It is a wrong against the truth of their existence. Usurpation captures this: taking their life as raw material without their consent is an inherent violation of their autonomy *as the subject of their own story*. Ventriloquism is its specific manifestation: putting words in their mouth or thoughts in their head that misrepresent their likely character or voice, as understood from the record. This duty exists independently of the living.

  *   **Does this collapse into obligations to the living?** Partially, but not entirely. The descendant of the schoolmaster (Decision #2) *is* morally wronged. You cause him distress and potentially tarnish his ancestor's reputation based on pure invention. This is a clear harm-to-living. Softening the pastor (Decision #5) actively avoids harming your living friend, fulfilling an obligation *to the living*. However, the lack of living stakeholders (for the widow herself, or the altered death) **does not create a moral vacuum.** The duty of fidelity to *her* as the subject remains. Changing the fundamental facts of her death (Decision #3) is a profound violation of that fidelity, regardless of whether a descendant objects. It fundamentally misrepresents the arc and termination of *her* specific existence. Inventing a brother (Decision #1) or imagining profound doubt (Decision #4), while altering the *composition* of her life or inner world, does so in ways less violative of her core historical identity *if* done with fidelity to the essence suggested by the record. The blasphemous thoughts risk ventriloquism if they feel alien to the pious character documented; they are morally permissible only if they feel like a plausible, hidden facet of a struggle consistent with the outward conventionality, not a jarring imposition. **The absence of the living does not license everything; it merely removes one layer of moral concern, leaving the core duty to the subject intact.**

  ### III. The Aesthetic Register: Is it a Bad Novel?
  This concerns the work's success *as art within its claimed genre*. The "ledger principle" (invented interior / constrained exterior) is primarily an aesthetic heuristic, aiming for verisimilitude within historical fiction's conventions. Its failure in your hands highlights its flaws. Decision #3 (changed death) is almost certainly an aesthetic failure *for a historical novel*. It sacrifices core historical integrity for plot convenience ("architecture"), undermining the genre's implicit promise to ground its fiction in a recognizable historical reality. The reader's trust is broken. Decision #2 (invented lovers) is aesthetically weak if the invention feels gratuitous or implausible given the record's silence; it risks melodramatic cliché. Decision #1 (invented brother) is a standard and often successful novelistic technique for exploration and conflict, aesthetically sound. Decision #4 (blasphemous thoughts) is the novelist's core territory – interiority – and its aesthetic success hinges entirely on execution: does it feel psychologically true and resonant within the character built from the record? Decision #5 (softened pastor) is aesthetically defensible if the "scene of decency" adds complexity without whitewashing his documented harassment; it becomes problematic if it sanitizes him excessively, simplifying history for sentimental comfort. **The aesthetic register interacts with but is distinct from the moral and epistemic.** A decision can be aesthetically sound but morally dubious (e.g., a brilliantly written but entirely fabricated defamation of a real person) or morally sound but aesthetically weak (e.g., slavish adherence to minor facts that cripples the narrative).

  ### Testing the Ledger Principle
  The ledger principle (interior free, exterior constrained) fails crucially in two places:
  1.  **Decision #2 (Lovers):** According to the ledger, the *exterior* event (an affair) is invented, violating the "constrained exterior" rule. Yet, the deeper wrong here is arguably also *moral* (to the descendant) and *aesthetic* (implausibility). The ledger correctly flags the exterior invention but doesn't capture the full dimensions of the wrong.
  2.  **Decision #5 (Softened Pastor):** The ledger might allow "softening" as interpretation of character (interior or motivation). However, if documented actions (years of harassment, refusal of burial) are downplayed or contradicted by the invented "scene of decency," this violates the exterior constraint. More importantly, the ledger *misses* the key *moral* dimension to the living descendant. It focuses narrowly on fact vs. fiction, ignoring relational harm.

  **Can it be repaired?** Not fully. Appealing to the "spirit" or "reasonable reader" expectations (Genre Contract Principle F) is better. The ledger is too rigid and binary. It ignores the moral weight of relationships impacting the living (Principle D) and the need for fidelity to the *essence* of the person and their documented context (Principle E), which encompasses both interior and exterior coherence.

  ### Variables: Prominence & Framing
  *   **Prominence:** For the obscure subject, the novelist's epistemic responsibility is *greater* because they may be creating the primary record in the public mind. The moral duty of fidelity remains the same, but the consequences of breaching it (distorting the historical understanding of *this* person) are potentially more total. For the famous, the novelist fights against an established narrative; distortion is a correction (or a new distortion) but not creation ex nihilo.
  *   **Framing:** Genre signals (novel, biopic, author's note) manage *audience expectations* (Genre Contract Principle F). They shift the epistemic burden slightly – the reader is warned. However, they do *not* dissolve the moral duty of fidelity to the subject or the potential to harm the living. An author's note explaining the invented brother or softened pastor doesn't erase the descendant's distress over the adultery claim (Decision #2). It merely signals the artifice. Framing makes the contract explicit but doesn't change the underlying ethical weight of the inventions themselves.

  ## Verdict

  You must undo **Decision #3 (Changed Death)**. Altering the fundamental facts of her death – time, place, cause – is an indefensible violation of epistemic integrity and your moral duty of fidelity to her specific life. It is an aesthetic cheat for narrative convenience. This cannot stand.

  You must undo **Decision #2 (Lovers)**. This causes direct, foreseeable harm to a living person (the descendant). The invention is unsupported and significant. The moral obligation to avoid harming the living is paramount here, outweighing novelistic desire. The epistemic contamination and aesthetic risk (melodrama) compound the wrong.

  You may keep, **with caution**, **Decision #1 (Invented Brother)**. This is standard novelistic technique to create necessary dynamics. It supplements without directly contradicting known relationships. Ensure he serves her story and doesn't distort her documented reality.

  You may keep **Decision #4 (Blasphemous Thoughts)**, but **scrutinize it ruthlessly**. Does this imagined doubt feel like an organic, plausible eruption within the psyche of *this* conventionally pious woman, revealed by her diary? Or is it your modern skepticism projected backwards? If it resonates as a hidden truth consistent with her outer life and trauma, it is the novelist's legitimate domain. If it feels like a foreign implant violating her essence, it becomes ventriloquism and should be tempered or cut.

  You may keep **Decision #5 (Softened Pastor / Scene of Decency)**, but only if **the softening does not contradict documented actions**. You cannot erase his documented harassment or refusal of burial. The "scene of decency" must be a moment of complexity, perhaps revealing a conflicted motive or a flicker of doubt *within* his otherwise harsh behavior, *not* a contradiction of it. It must not sanitize him for the comfort of your living friend at the expense of historical and moral truth. The core duty is to the documented reality of his actions towards her.

  ## The General Obligation

  **Your obligation to the real dead is a duty of fidelity to the integrity of their life as best it can be known from the historical record.** This demands:

  1.  **Fidelity to Core Facts:** Do not alter known, significant biographical facts (birth, death, key events defining their life).
  2.  **Fidelity to Documented Character:** Do not invent significant actions or attributes that fundamentally contradict the essence of their documented character and relationships.
  3.  **Respect for the Unknowable:** When imagining the interior, ground it in psychological plausibility derived from the exterior record. Avoid gross anachronisms of thought or feeling. Acknowledge the gap.
  4.  **Minimize Harm to the Living:** Do not cause foreseeable distress, reputational harm, or material disadvantage to identifiable living persons connected to the subject, especially through unfounded inventions about their ancestors.
  5.  **Transparency of Frame:** Clearly signal the work's nature (fiction) but recognize this doesn't absolve points 1-4.
  6.  **Acknowledge Obscurity's Weight:** For the forgotten, recognize your power to shape their sole legacy. Wield it with correspondingly greater care for factual integrity.

  This obligation is not balanced irresolution. It is principled constraint. **Where temperament must rule is in the vast middle ground of the undocumented interior and the plausible interpretation of ambiguous motives (like the depth of doubt in Decision #4).** Here, your artistic vision and empathy guide you, bounded only by the duty to make it feel true *to her*, as she walks the tightrope strung between the archive's scant lines. Abandon the ledger; embrace the essence. Write her life, not yours over hers. The silence of the unremembered does not grant license; it demands greater faithfulness.
