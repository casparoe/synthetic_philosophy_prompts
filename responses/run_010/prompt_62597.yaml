prompt: |-
  I've been going in circles on an essay for my seminar on action theory and I could use an outside pair of eyes. We read Anscombe's piece arguing that Truman was a murderer for ordering Hiroshima, plus the usual background on double effect, and the discussion section went badly for me because I couldn't defend either side. Here's the argument I sketched out that evening, which I'm now pretty sure proves way too much:

  (1) On the double-effect picture, what separates the tactical bomber from the terror bomber is intention: the tactical bomber aims at the munitions plant and merely foresees the children's deaths as an unwanted side effect, while the terror bomber aims at the deaths themselves, since demoralizing the enemy is his means.
  (2) But the tactical bomber foresees the children's deaths with certainty — not as some probability, as something he knows will happen if he drops the bomb.
  (3) Anscombe's own way of picking out intention says that what you intend is fixed by your plan, and by what you'd be committed to doing to carry the plan through; the description under which you act is what matters, not what happens to occur afterwards.
  (4) Given (2), the children's deaths are not an accident or a surprise relative to the tactical bomber's plan. They are in it, under a description he knowingly adopts.
  (5) And given (3), he'd be committed to proceeding anyway even if he were somehow told the children would be killed, since the mission's success doesn't depend on their surviving. So by his own practical reasoning he has adopted their deaths.
  (6) Therefore the tactical bomber intends the children's deaths just as much as the terror bomber does, so the distinction in (1) collapses, and if the terror bomber is a murderer, the tactical bomber is one too.
  (7) Anscombe obviously doesn't want that. So either double effect is a fraud, or her account of intention is wrong.

  The seminar's problem is that I don't think I can happily accept (7) — I'm actually inclined to think the terror/tactical difference tracks something real — but every escape route I try seems to blow up (1), which she needs for the Truman verdict, and Truman is the whole reason we're reading her. So: which step should I actually reject? Walk me through each one and say why it looked innocent when I wrote it down, because that's the part I can't reconstruct — I want to know what's doing the smuggling. Then tell me what each of the main repairs costs: refusing (2), refusing (3), refusing (4), or refusing (5), and whether any of them leaves the Truman case still coming out as murder. If I have to sacrifice something, I'd rather lose (2) than lose the claim that terror bombing is worse, but I don't know if that's a real option or just me picking the premise I like best.
reasoning: |-
  Okay, the user is really stuck on their essay about action theory, specifically Anscombe's argument that Truman was a murderer for ordering the Hiroshima bombing. They've outlined an argument that challenges the distinction between terror bombing and tactical bombing based on intention, which is central to the doctrine of double effect. They feel their argument proves too much, undermining Anscombe's position, and they're unsure which premise to reject to salvage the distinction without abandoning the Truman verdict.

  The user’s argument hinges on the idea that the tactical bomber, by foreseeing the children’s deaths with certainty and incorporating it into their plan, effectively intends those deaths just like the terror bomber. This collapses the moral distinction Anscombe relies on. The user wants to know which step is faulty, why it seemed plausible initially, and what the cost is of rejecting each premise. They also want to preserve the intuition that terror bombing is worse and ensure Truman still comes out as a murderer.

  Hmm, the user’s confusion is understandable. Their argument is clever but likely misapplies Anscombe’s concept of intention. Let me break this down step by step. 

  First, premise (2) seems solid—the tactical bomber does foresee the deaths with certainty. That’s hard to dispute. But premise (3) is where things get tricky. The user interprets Anscombe as saying intention is fixed by what’s in the plan and what you’re committed to. But Anscombe is stricter: intention is about what you’d *stop* to avoid. For the tactical bomber, the children’s deaths aren’t a stopping condition; for the terror bomber, they are. The user’s premise (5) overlooks this—being committed to proceeding doesn’t mean you intend the outcome, only that you tolerate it. 

  Premise (4) is also problematic. Just because something is foreseen with certainty doesn’t make it intended. Anscombe uses examples like poisoning a guard to save friends—you foresee the death, but it’s not your goal. The deaths are "in the plan" descriptively but not intentionally. The user smuggles in a conflation here between foresight and intention. 

  Rejecting (3)/(4) is the cleanest fix. It preserves double effect by clarifying that intention requires the outcome to be a means or end, not just foreseen. The cost? The user must accept that certainty alone doesn’t equate to intention. But this saves the terror/tactical distinction and still condemns Truman (if his case involves direct intention, e.g., demoralization as means). 

  If they reject (2), they weaken the bomber’s certainty to probability, but that feels artificial and untrue to the thought experiment. Rejecting (5) might work but is messier—it’s true the tactical bomber would proceed, but that doesn’t prove intention. 

  The user’s deeper need: they want to preserve moral intuition without logical inconsistency. They’re also likely anxious about seminar performance. By fixing the intention/foresight conflation, they can confidently defend Anscombe while acknowledging the complexity. Truman’s verdict holds if his plan used deaths as means, even if he "regretted" it. 

  Final note: the user should stress that double effect isn’t about certainty but about practical reasoning structure. That’s the gold repair.
answer: |-
  Your argument is logically tight but smuggles in a crucial conflation at step (4) and (5) by misapplying Anscombe's account of intention. Here's the breakdown, why each step *seemed* plausible, the cost of rejecting it, and how to repair the argument while preserving Anscombe's core claims:

  ### Step-by-Step Diagnosis:
  1.  **Premise (1): CORRECT.** This is standard double effect (DE) and Anscombe's setup. Terror bomber: Deaths are *intended means*. Tactical bomber: Deaths are *foreseen side effect*. *Why it seemed innocent:* It's the foundational distinction.
  2.  **Premise (2): LARGELY CORRECT (but context matters).** Yes, the tactical bomber foresees the deaths with practical certainty. *Why it seemed innocent:* It highlights the severity of the side effect and challenges the "accident" language sometimes used loosely with DE.
  3.  **Premise (3): CORRECT, BUT INCOMPLETE.** Anscombe *does* focus on the description under which one acts and the practical commitment inherent in the plan. However, her key move is distinguishing *what you need to succeed* from *what you merely know will happen*. *Why it seemed innocent:* You accurately cite her emphasis on plan-description and commitment.
  4.  **Premise (4): THE SMUGGLING POINT.** Saying the deaths are "in" the plan under a "knowingly adopted description" subtly conflates *foresight* with *intention*. Anscombe insists that something can be foreseen with certainty, described in the plan ("I will bomb the munitions plant, killing the children nearby"), and yet *not* be intended. The description matters for *what is aimed at*, not just what is predicted. The deaths are part of the *background conditions* the bomber works *through*, not part of the *goal* or *means*. *Why it seemed innocent:* It feels intuitive that knowingly causing something certain should count as intending it. This is the core challenge to DE that Anscombe explicitly addresses and rejects.
  5.  **Premise (5): OVEREXTENDS (3).** While the tactical bomber *would* proceed, this shows tolerance/resignation, not intention. Anscombe's "commitment" test asks: *Would the agent try to AVOID the effect if they could still achieve their goal?* For the terror bomber: If the children miraculously survived unharmed but the enemy was still demoralized, he would *count it as failure* (deaths were the intended means). For the tactical bomber: If the children miraculously survived unharmed *and* the plant was destroyed, he would *count it as total success* (deaths were never a *constituent* of success). His commitment is to destroying the plant *while* knowing children die, not to killing children *in order to* destroy the plant. *Why it seemed innocent:* It leverages the correctness of (3) but applies it incorrectly, ignoring the crucial question of *why* the deaths matter to the success condition.
  6.  **Conclusion (6) & (7): FOLLOW LOGICALLY FROM (4) & (5), but (4)/(5) are flawed.** Therefore, the distinction doesn't collapse, and (7) is a false dilemma.

  ### Repair Options & Costs:
  Rejecting **(2)** (Certainty of Foresight):
  *   **Cost:** High. It weakens the realism of the thought experiment. We *can* foresee consequences with near-certainty in war/policy. Anscombe doesn't rely on uncertainty; she allows for certain foresight. Rejecting (2) feels like evasion and makes DE less applicable to real-world cases like Hiroshima.
  *   **Impact on Truman:** Preserves Anscombe's verdict *if* she argues Truman intended terror *despite* any tactical justification (which she does). But it makes her position seem weaker by dodging the certainty challenge.

  Rejecting **(3)** (Anscombe's Account of Intention):
  *   **Cost:** Very High. You abandon her core framework. You'd need an alternative theory of intention that *does* preserve the terror/tactical distinction without her specific "practical reasoning/plan" approach. This is a huge project and likely undermines her entire argument about Truman.
  *   **Impact on Truman:** Directly undermines her basis for calling Truman a murderer. If her account of intention is wrong, her application of it to Truman fails.

  Rejecting **(4)** (Deaths are "in" the plan as Intended):
  *   **Cost:** Low/Moderate. Requires careful distinction between *predictive inclusion* and *intentional inclusion*. You accept that foreseen certainty is compatible with *lack* of intention because the deaths aren't part of the *means-end structure* of the plan. They are a *condition* the plan operates within/accepts, not a *tool* the plan uses.
  *   **Impact on Truman:** Preserves her verdict. She argues Truman's plan *used* the deaths of civilians *as a means* to demoralize Japan and force surrender. The deaths weren't just a foreseen side effect of bombing military targets; they were the *mechanism* for achieving the goal. The tactical justification (munitions plant) was either secondary or pretextual on her reading.

  Rejecting **(5)** (Commitment implies Intention):
  *   **Cost:** Moderate. Requires clarifying that "commitment" in Anscombe's sense refers to *persisting towards the goal*, not *endorsing every consequence*. The key test is *counterfactual*: Would avoiding the bad effect *while achieving the goal* constitute success or failure?
  *   **Impact on Truman:** Preserves her verdict. If Hiroshima/Nagasaki were bombed, the military targets destroyed, but the civilian population miraculously survived *unharmed and undemoralized*, would Truman have counted it as mission success? Anscombe argues no – the terror *was* the intended means.

  ### The Recommended Repair: Reject (4) and Refine (5)
  *   **Focus:** The smuggled premise is the conflation in (4). The tactical bomber *describes* the deaths predictively ("I will bomb, killing children") but does not *intend* them under the description "means to destroy the plant" or "goal of the mission." They are a *circumstance* of the action, not part of its intentional structure.
  *   **Refined (5):** The tactical bomber is committed to destroying the plant *even knowing* children will die, but he is *not* committed to *needing* their deaths to succeed. He would welcome a way to destroy the plant *without* killing them. The terror bomber *is* committed to needing their deaths; their deaths are integral to his *plan of action* as the chosen means.
  *   **Cost:** You must accept Anscombe's counterintuitive but rigorous point: **Foreseen certainty does not equate to intention.** Intention is defined by the agent's *reasons for acting* and the *structure of their aim*. You can knowingly cause something certain without intending it, if it's not part of your means or end. This is the core of double effect.
  *   **Preserving the Intuition:** This repair saves the terror/tactical distinction. The terror bomber deliberately uses innocent lives as a tool. The tactical bomber, while foreseeing the same deaths, does not make them a tool; he tragically accepts them as inseparable from achieving a distinct legitimate goal.
  *   **Preserving Truman as Murderer:** Anscombe argues Truman *was* a terror bomber. His primary intention (on her reading) *was* to break Japanese morale by annihilating civilian populations. The destruction of military targets was secondary. The deaths were not a foreseen side effect of a tactical strike; they were the *intended mechanism* for surrender. Therefore, DE does *not* shield him, and he intended murder.

  ### Conclusion
  Your step (4) smuggles in the assumption that foreseen certainty *entails* intention. Reject this conflation. Anscombe's account (premise 3) distinguishes intention via the *role* a consequence plays in the agent's practical reasoning: Is it *sought* (end) or *used* (means), or merely *accepted* (side effect)? The tactical bomber *accepts* the deaths; the terror bomber *uses* them. This distinction holds even under certainty. 

  This repair costs you the intuitive link between certainty and intention but preserves the terror/tactical distinction and Anscombe's condemnation of Truman. Your essay now has a strong core: defending Anscombe's sophisticated concept of intention against the common-sense (but philosophically inadequate) challenge that "knowingly causing = intending." Emphasize the *structural role within the plan* as the defining feature of intention. This gives you a clear defense of her Truman verdict: his plan structurally relied on civilian deaths *as the means* to demoralization and surrender.
