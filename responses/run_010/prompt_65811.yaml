  ### Chance Deference Sorting Instrument  
  **Decision Tree Quiz**  
  *Answer each question based solely on your intuitive judgment about the described scenario. Choose one option per node without overthinking the metaphysics.*

  ---

  #### **Node 1: Basic Fair Coin**  
  A coin is about to be flipped. A trustworthy source announces its chance of landing heads is 50%. You have no other information. What should your credence in heads be?  
  - **a)** Exactly 0.5  
  - **b)** Not necessarily 0.5 (e.g., 0.6 due to a hunch, or 0.5 is meaningless)  

  #### **Node 2: Oracle’s Prediction**  
  The same coin is about to be flipped. A *perfectly reliable* oracle (never wrong) privately tells you it *will* land heads. The announced chance remains 50%. What should your credence in heads be?  
  - **a)** 0.5 (stick to the chance)  
  - **b)** 1.0 (trust the oracle)  

  #### **Node 3: Past Coin Flip**  
  A coin was flipped yesterday. The chance of heads *at the time* was 50%. You have no information about the outcome. What should your credence in heads be?  
  - **a)** 0.5  
  - **b)** Undefined/irrelevant (e.g., "It’s already fixed, so I’d use symmetry if anything")  

  #### **Node 4: Uncertain Chance**  
  You’re unsure of a coin’s bias: 60% credence the chance of heads is 50%, 40% credence it’s 25%. What should your credence in heads be?  
  - **a)** Weighted average: \(0.6 \times 0.5 + 0.4 \times 0.25 = 0.4\)  
  - **b)** Highest probability chance (0.5) or something else (e.g., 0.25 if pessimistic)  

  #### **Node 5: Determined Outcome**  
  In a *deterministic* universe, a coin is about to be flipped. Initial conditions and laws fix the outcome. An expert (knowing all this) announces the chance of heads is 50%. What should your credence be?  
  - **a)** 0.5  
  - **b)** 0 or 1 (though you don’t know which)  

  #### **Node 6: Everettian Coin Flip**  
  In an Everettian (many-worlds) quantum universe, a "coin" has a branch weight of 50% for heads. What should your credence in heads be?  
  - **a)** 0.5  
  - **b)** 1.0 (you’ll only experience one outcome)  

  #### **Node 7: Untrustworthy Expert**  
  An expert announces a chance of 50% for rain tomorrow. You *know* they *always* say 50% regardless of reality. What should your credence in rain be?  
  - **a)** 0.5 (their announcement defines/constrains your belief)  
  - **b)** Unaffected (use other evidence; if none, maybe 0.5 by ignorance)  

  ---

  ### Scoring Key  
  *Match your answer string (e.g., 1a-2b-3a-4a-5a-6a-7a) to a leaf position. Combinations not listed are impossible or incoherent under the tree.*  

  | **Answer String**     | **Leaf Position**                                                                 | **Core Deference Principle**                                                                 |
  |-----------------------|-----------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------|
  | 1b-...               | Radical Subjectivist                                                              | Probabilities *are* credences; no deference norm exists.                                    |
  | 1a-2a-...            | Lewis’s Original PP                                                               | Defer unconditionally; only ignore evidence explicitly tagged "inadmissible".               |
  | 1a-2b-3a-4a-5a-6a-7a | Principal Principle (Analytic/Definitional)                                       | Deference is built into the concept of chance. "Chance" means "ideal credence to adopt".    |
  | 1a-2b-3a-4a-5a-6a-7b | Principal Principle (Substantive Norm)                                            | Deference is a separate norm (e.g., for accuracy or calibration), not definitional.         |
  | 1a-2b-3a-4a-5a-6b    | Non-Everettian Objector                                                           | Branch weights ≠ chances; only future outcomes deserve deference.                           |
  | 1a-2b-3a-4a-5b-...   | Determinism-Chance Eliminativist                                                  | Chances vanish in deterministic worlds; only use physical symmetries.                      |
  | 1a-2b-3b-...         | Conditionalized PP                                                                | Always defer to *conditional chance given all current evidence* (replaces "admissibility"). |
  | 1a-2b-3a-4b-...      | PP-Indeterminist                                                                  | No clear line between admissible/inadmissible evidence; deference is ambiguous.             |
  | 1a-2b-3a-4a-5a-6a-7a | *Also* Deflationist                                                               | *[Identical to Analytic PP on all cases; differs only in metaphysics]*                     |
  | 1a-2b-3a-4a-5a-6a-7a | *Also* Everettian                                                                 | *[Identical to Analytic PP; treats branch weights as chances]*                             |

  ---

  ### Design Notes  
  1. **Metaphysics-Behavior Divergence Nodes**:  
     - **Node 5 (Determinism)**: Bets 0.5 despite rejecting chances metaphysically (e.g., Determinism-Eliminativist).  
     - **Node 7 (Untrustworthy Expert)**: Bets 0.5 only if chance is analytic/deflationary, not if substantive.  
     - **Node 3 (Past Flip)**: Defers to past chance only for Original/PP-Analytic, not Conditionalized/PP-Substantive.  

  2. **Empty Cells**:  
     - `1a-2b-3a-4a-5b-6a` (Determinism-Eliminativist who accepts branch weights) is **incoherent**: rejects deterministic chances but accepts Everettian "chances".  
     - `1a-2a-3b` (Original PP but rejects past chance deference) is **unattractive**: past chances are admissible under Lewis’s rule.  

  3. **Indistinguishable Positions**:  
     - **Analytic PP / Deflationist / Everettian** are identical in betting behavior. The tree *cannot* separate them; metaphysics requires external discussion.  
     - **Radical Subjectivist** (1b) is isolated early; all others start with deference.  

  4. **Key Insights**:  
     - **Stats/ML Participants**: Will likely land on **Conditionalized PP** or **Substantive Norm PP** (focus on calibration).  
     - **Philosophy Participants**: Will cluster in **Analytic PP**, **Eliminativist**, or **Indeterminist** leaves.  
     - **The Oracle (Node 2)** forces a split: 2a (Original PP) vs. 2b (others).  
     - **Averaging (Node 4)** tests if uncertainty is handled via expectation (4a) or not (4b → Indeterminist).  

