  1. Principal Principle as analytic/definitional (PP-analytic)
  2. Principal Principle as a substantive norm (PP-substantive), possibly with two sub-views:
     a. Original Lewis (PP-original) - which requires admissibility
     b. Conditionalized (PP-conditional) - replaces with conditional chance
  3. Indeterminacy view (no principled line on admissibility) (PP-indeterminate)
  4. Deflationist (deference principle doesn't make a claim about the world) (Deflationist)
  5. Radical subjectivist (chance is just someone's credence) (Subjectivist)
  6. No chance in deterministic worlds (only non-deterministic worlds have chances) (Determinism-chance)
  7. Everettian (branch weights as chances) (Everettian)

  We also have two required cases: the oracle (inadmissible evidence) and the averaging (total evidence).

  We will design the tree so that at least three nodes force a separation between metaphysics and betting behavior.

  We note that the analytic-definitionalist and the deflationist might be behaviorally identical, so we will flag that.

