  ### Game Design: Signalling and Credibility  
  **Objective:** Students experience signalling mechanisms through gameplay, discovering why some signals are credible and others are not.  

  ---

  #### **Materials**  
  - **Role Cards**: 12 "Sender" cards (6 High-Quality, 6 Low-Quality) and 6 "Receiver" cards.  
  - **Quality Tokens**: High-Quality = 10, Low-Quality = 2 (written on Sender cards).  
  - **Signal Cost Sheet**: Distributed each round (costs vary by round/type).  
  - **Scoring Sheet**: Simple table for students to record decisions and points (no calculator needed).  

  ---

  #### **Timeline (75 Minutes Total)**  
  **0–5 min: Introduction**  
  - Assign roles (randomly): 12 Senders (secretly High or Low quality), 6 Receivers.  
  - Explain:  
    - Senders want to be chosen by Receivers.  
    - Receivers want to choose High-Quality Senders.  
    - Each round, Senders decide whether to "send a signal" (e.g., flash a card) at a cost. Receivers observe signals and choose one Sender.  
  - Goal: Maximize personal points (no real money).  

  **5–20 min: Round 1 (Uniformly Expensive Signal)**  
  - **Setup**:  
    - Signal cost = 3 points for **all** Senders.  
    - Receivers can **only** choose Senders who signal.  
  - **Payoffs**:  
    - **Sender**: If chosen, gain 10 points minus signal cost. If not chosen, lose signal cost.  
    - **Receiver**: Gain the chosen Sender’s quality (10 or 2).  
  - **Predicted Outcome**:  
    - All Senders signal (cost = 3). Receivers pick randomly.  
    - High-Quality: 50% chance of +7 (10 - 3), 50% chance of -3 → average +2.  
    - Low-Quality: Same as High → no separation. Receivers average quality = 6.  
  - **Key Lesson**: Cost alone doesn’t ensure credibility; everyone signals, but quality is mixed.  

  **20–35 min: Round 2 (Differential Cost)**  
  - **Setup**: Identical to Round 1, **except** signal cost:  
    - High-Quality Senders: Cost = 1 point.  
    - Low-Quality Senders: Cost = 6 points.  
  - **Payoffs**: Same as Round 1.  
  - **Predicted Outcome**:  
    - High-Quality: Signal (cost=1). If chosen: +9 (10-1); if not: -1. Expected +4.  
    - Low-Quality: Don’t signal (cost=6 too high). If not chosen: 0. Expected 0.  
    - **Result**: Only High-Quality signal. Receivers always get quality=10.  
  - **Key Lesson**: Separation occurs because the **same signal costs less for High-Quality**.  

  **35–45 min: Round 3 (Index)**  
  - **Setup**:  
    - Senders are assigned a fixed "vocal pitch" (High-Quality = "Deep", Low-Quality = "Shallow").  
    - Displaying pitch is **free and mandatory** (no choice). Receivers see pitch.  
  - **Payoffs**:  
    - **Sender**: If chosen, +10 points.  
    - **Receiver**: Gain chosen Sender’s quality.  
  - **Predicted Outcome**:  
    - Receivers always choose "Deep" pitch (quality=10).  
    - **Result**: Perfect honesty with **no cost**.  
  - **Key Lesson**: Fixed traits (indices) are inherently reliable.  

  **45–55 min: Round 4 (Conventional Badge with Audit)**  
  - **Setup**:  
    - Senders choose to display a "badge" (**free**).  
    - Receivers choose a badged Sender and **learn true quality for free**.  
    - Receiver then decides to interact or not.  
  - **Payoffs**:  
    - **Sender**: If chosen **and** Receiver interacts, +10. Else, 0.  
    - **Receiver**: If interact, gain quality; if not, 0.  
    - *Low-Quality interaction gives Receiver -10 (punishment for bluffing)*.  
  - **Predicted Outcome**:  
    - High-Quality: Badge (Receiver interacts → +10).  
    - Low-Quality: Don’t badge (if badged, Receiver sees low quality and doesn’t interact → 0).  
    - **Result**: Badge is honest due to threat of punishment.  
  - **Key Lesson**: Free signals work if bluffers face consequences.  

  **55–65 min: Round 5 (Multiplicative Cost - Optional)**  
  - **Setup**:  
    - Signal reduces survival chance:  
      - High-Quality: 80% survival if signal; 100% if not.  
      - Low-Quality: 30% survival if signal; 100% if not.  
    - Survivors enter a pool; Receivers choose randomly.  
  - **Payoffs**:  
    - **Sender**: If chosen, +10 points (only if alive).  
    - **Receiver**: Gain chosen Sender’s quality.  
  - **Predicted Outcome**:  
    - High-Quality: Signal → 80% chance to survive, then high chance of being chosen.  
    - Low-Quality: Don’t signal → 100% survival, but compete with High-Quality survivors.  
    - **Result**: Separation even with multiplicative costs.  
  - **Key Lesson**: Differential cost principle holds even when costs don’t "subtract points."  

  **65–75 min: Debrief**  
  - **Map Mechanisms**:  
    - Round 1: Uniform cost → pooling.  
    - Round 2: Differential cost → separation.  
    - Round 3: Index → inherent honesty.  
    - Round 4: Conventional badge → honesty via punishment.  
  - **Adjudicate the Argument**:  
    - **"Waste" (Friend)**: Round 1 shows uniform waste fails. Round 2 shows waste **must be differential** to work.  
    - **"Differential Cost" (You)**: Round 2 vindicates you; cost differences enable honesty. Rounds 3–4 show cost isn’t always needed.  
    - **Half-Right**: Friend is right waste *can* work, but only if differential. You’re right differential cost is key, but wrong to dismiss waste entirely (it’s part of differential cost).  
  - **Honest ≠ Costly**: Rounds 3 (index) and 4 (badge) show honest signals need **not** be costly at equilibrium.  
    - *To raise this*: Highlight that in Rounds 3–4, signals are free but honest. In Round 2, cost is low for High-Quality (1 point, net +9) — not "ruinously expensive."  
  - **Predictable Issues & Fixes**:  
    - **Accidental Bluff in Round 1**: A Low-Quality might not signal (risk-aversion). Fix: Emphasize maximizing *expected* points (signaling = +0.5 on average).  
    - **Receivers Ignore Signals in Round 3**: If Receivers don’t understand "vocal pitch," they might choose randomly. Fix: Clarify pitch is tied to quality on role cards.  
    - **Collusion**: Friends might coordinate (e.g., Low-Quality signal in Round 2). Fix: Assign roles randomly; enforce anonymity.  
    - **Time**: Rounds 1–2 may run long. Fix: Use timers; simplify calculations.  
  - **Limitations to Verbally Address**:  
    - **Intentionality vs. Evolution**: Students reason about payoffs; in nature, signaling evolves via selection (no conscious choice).  
    - **One-Shot vs. Stability**: Game is static; real signals stabilize over generations through statistical reliability.  
    - **Determinism**: Game outcomes are fixed; nature has noise (e.g., unreliable signals occasionally succeed).  

  ---

  #### **Scoring Sheet Example**  
  | Round | Your Role | Quality | Signal Sent? | Chosen? | Interaction? | Points Earned |  
  |-------|-----------|---------|--------------|---------|-------------|---------------|  
  | 1     | Sender   | High   | Yes          | Yes     | —          | 7 (10 - 3)    |  
  | 2     | Receiver | —      | —            | Sender A| —          | 10 (quality)  |  

  This design forces students to experience why differential costs enable credible signals, while highlighting alternatives. The debrief explicitly ties gameplay to your debate, resolving both halves of the truth.
