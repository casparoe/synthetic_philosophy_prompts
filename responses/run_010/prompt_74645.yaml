prompt: |-
  I chair the clinical competency committee at a mid-size general surgery residency program — five attendings, we meet monthly, and we sign off on whether a resident can do a given operation without an attending scrubbed in. We make roughly a dozen of these calls a month, two attendings have to co-sign each one, and the liability exposure when we're wrong on a clearance is very real. Our evidence is a mess of two completely different kinds and we have no principled way to weigh them. On one side: in-training exam scores, mock oral board scores, anatomy quizzes, and the resident's own case log. On the other: global technical ratings from attendings who watched them operate, plus video review of a case or two.

  The failure modes go both directions and both are bad. We've cleared residents who can recite the steps and the anatomy cold and then go rigid at the table the first time the bleeding isn't textbook. And we've blocked residents who do a beautiful safe operation but who, when you ask them to explain what they just did or teach it to an intern, produce something close to word salad — sometimes flat-out wrong about why they did what they did.

  What I want is a decision procedure my committee can actually run on one resident for one operation in about fifteen minutes, from a packet that already exists, ending in one of three verdicts: cleared to perform unsupervised, cleared with a named attending present, or not yet — plus what specifically has to change before the next meeting. It should be grounded in whatever the philosophy of skill knowledge actually says about the gap between knowing how to do a thing and knowing that something is the case, but please don't hand me a reading list or a citation dump. I want the usable content and the distinctions that do work, not the scholarship.

  Cases it has to handle, because we have all of them in the room right now:

  - The resident who performs well but whose account of their own performance is wrong. Do we count the performance, the account, or both? If both, how do they trade off, and is there any situation where a bad account should override a good performance?
  - The reverse: flawless account, has never actually completed the case start to finish.
  - Success by luck. Somebody did the operation three times, all three went well, but all three had a attending quietly steering from the side, or the anatomy happened to be easy, or the patient was young and stable. What in our packet distinguishes a real disposition from a run of favorable circumstances? I want the procedure to say something about how the resident would do in nearby variants of the case, not just their hit rate.
  - Competence that only exists inside a particular setup. A resident who is excellent with our usual team, our usual equipment, our usual first-assist, and who we have reason to think would come apart on a night shift with a new PA and a different tray. Is that one competence or two?
  - Knowledge that's present but never fires — learned on rounds, never once used at the table.
  - Decay: someone who was fine a year ago and hasn't touched this case in six months.

  And the part I care about most: be explicit about the back-door risk. If the procedure makes "can explain it to an intern" a necessary condition, haven't we just decided that being able to state propositions is what competence consists in — which is exactly what the cases above say is false? Take a position on whether an articulation requirement is defensible at all, and if it is, say what job it's actually doing in the procedure. Two of my members think articulation matters not as evidence of skill but as evidence that the skill will transfer and stay safe under novel conditions. I don't know whether that survives scrutiny.

  Format: a numbered procedure, questions in the order we should ask them, and for each one what counts as a sufficient answer and where it stops with an outright "not yet." Then a short section on which distinctions from the theory you deliberately kept, which you threw out to make it runnable in fifteen minutes, and why — and which steps are really judgment calls wearing a procedure costume, because I'd rather be told. Then run it on three cases: one straightforward, one where my committee would split two-two going in, and one where the procedure produces a verdict I personally don't like — clears somebody I think shouldn't be cleared, or blocks somebody I'd bet on. I want the uncomfortable one, not a softball. Finish with what this procedure can't tell us and what has to be escalated to a human because it's a question of values or institutional risk rather than fact.

  American English please.
reasoning: |-
  Okay, I need to tackle this query from a surgeon chairing a clinical competency committee. They're struggling with assessing residents' operative competence using mixed evidence types and want a practical decision procedure. The key challenges are balancing procedural knowledge (how to perform) with declarative knowledge (ability to explain), handling edge cases like skill decay or context-dependent competence, and avoiding liability from wrong clearance decisions.

  The user wants a 15-minute-per-resident process ending in one of three verdicts: cleared unsupervised, cleared with named attending, or not yet - plus specific remediation steps. They explicitly reject theoretical citations, demanding actionable distinctions. The listed failure modes reveal deep tension between performance and articulation abilities.

  Considering how to structure this. A numbered procedure makes sense, starting with foundational questions before weighing evidence. Must address all provided edge cases: the articulate non-performer, the inarticulate expert, lucky successes, context-bound skills, inert knowledge, and skill decay. The articulation debate is critical - is it evidence of transferability or just academic exercise?

  For the decision engine, I'm considering a two-tiered approach: first establish minimum viability through case volume and absence of red flags, then evaluate quality through performance evidence and knowledge integration. Remediation should be specific - not just "needs more cases" but "needs to articulate indications for X modification when Y occurs."

  Theoretical foundations matter here. I'm drawing on Ryle's distinction between knowing-how and knowing-that, plus Dreyfus' skill acquisition model showing proceduralization reduces conscious articulation. But I won't cite them - will bake in the insights. For example: a resident who performs flawlessly but can't explain might be at Dreyfus' "proficient" stage where understanding is embodied, not verbal. That's competent but may not transfer.

  The three demonstration cases will showcase how this handles: 1) A straightforward pass (high volumes, strong ratings, coherent explanations) 2) A split-committee case (solid performance but inconsistent explanations - probably cleared with supervisor) 3) An uncomfortable clearance (elderly resident who stopped documenting but has flawless recent videos - cleared but with strict recency requirement).

  Biggest sacrifice is nuance in transfer assessment. The 15-minute constraint forces reliance on "explanation quality" as proxy for adaptability, though we know it's imperfect. Also can't deeply evaluate team-dependency - just flag it for supervisor requirement.

  Liability-wise, the procedure must err toward supervision when evidence conflicts. The "named attending" option is crucial for context-dependent skills. And we'll build in automatic decay rules: no cases in 6 months? Mandatory video review before clearance.

  Final structure will be: 
  1) Procedure steps with decision thresholds
  2) Design tradeoffs explained
  3) Three case walkthroughs
  4) Limitations section
answer: |-
  Here's a decision procedure designed for your committee, grounded in the philosophy of skill development while prioritizing actionable distinctions over theory. It assumes a standardized packet containing: case log data, assessment scores (ITEs, mock orals, quizzes), global technical ratings (with rater names/dates), video review notes (if available), and any structured comments on teaching/explanation ability.

  **Decision Procedure: Operative Autonomy Assessment**

  1.  **Minimum Volume & Recency Threshold:**
      *   *Question:* Has the resident logged ≥ 3 *completed* cases as primary surgeon for this specific procedure within the last 6 months? (Completion = skin-to-skin, attending scrubbed but not taking instruments except for minor guidance).
      *   *Sufficient:* Yes, proceed to Step 2.
      *   *Not Yet:* No. *Remediation:* "Perform ≥ 3 supervised cases as primary surgeon within next 3 months. Focus on independent execution."
      *   *Why Stop Here?* Without recent, repeated execution, other evidence is insufficient. This establishes baseline exposure.

  2.  **Red Flag Check:**
      *   *Question:* Is there *any* documented evidence in the packet (ratings, video review, case comments) of a **critical safety lapse** during this specific procedure? (e.g., failure to control significant bleeding appropriately, critical structure injury due to technique, fundamental error in sequence jeopardizing patient safety).
      *   *Sufficient:* No documented critical safety lapse. Proceed to Step 3.
      *   *Not Yet:* Yes, documented critical safety lapse. *Remediation:* "Requires ≥ 2 focused, supervised cases specifically addressing the safety lapse [Specify lapse, e.g., 'vascular control in Calot's triangle']. Requires positive assessment from supervising attending post-remediation."
      *   *Why Stop Here?* Safety is non-negotiable. A documented critical lapse overrides other positive evidence and demands focused remediation.

  3.  **Performance Quality Assessment:**
      *   *Question:* Is there consistent evidence (≥ 2 distinct global ratings OR ≥ 1 rating + video review) indicating **safe, effective, and independent technical performance** of this specific procedure? (Look for phrases like "safe," "efficient," "appropriate tissue handling," "handled unexpected finding X well," "operated independently," "minimal attending input").
      *   *Sufficient:* Consistent positive evidence of safe/effective/independent performance. Proceed to Step 4.
      *   *Named Attending:* Performance evidence is positive *but* context-dependent (e.g., only with specific attending/team, only in routine anatomy noted in comments). *Verdict:* Cleared only with Named Attending Present: [Specify condition, e.g., "Dr. Smith" or "with designated senior PA First Assist"]. *Remediation:* "Requires documented successful performance in ≥ 1 alternative context (e.g., different attending, night shift) to remove supervision requirement."
      *   *Not Yet:* Positive performance evidence is inconsistent, absent, or explicitly notes dependence/struggle *without* context dependency as the clear cause. *Remediation:* "Requires ≥ 2 supervised cases focused on independent technical execution. Requires updated positive global rating(s) post-remediation."
      *   *Why Here?* This evaluates the core "knowing-how" – the embodied skill. Context dependency is flagged for supervision but not failure.

  4.  **Knowledge Integration & Articulation Check:**
      *   *Question:* Is there evidence the resident **understands the rationale** for key steps, **recognizes common variations/anatomy**, and can **communicate the essential procedure flow**? (Sources: Mock oral performance on this case, documented explanation during teaching, structured comments in ratings/logs, anatomy quiz scores *if* procedure-specific).
      *   *Sufficient:* Evidence shows clear understanding of rationale and flow, and accurate recognition of common variations. *Verdict:* **Cleared to Perform Unsupervised**.
      *   *Named Attending:* Performance (Step 3) was sufficient for unsupervised *BUT* articulation is weak, inconsistent, or contains significant inaccuracies regarding rationale or variations. *Verdict:* **Cleared only with Named Attending Present** (e.g., "Attending physically in hospital"). *Remediation:* "Requires documented successful teaching session on this procedure to interns/juniors OR formal case presentation demonstrating accurate rationale/variations, within 3 months to remove supervision."
      *   *Not Yet:* Evidence shows *fundamental misunderstanding* of rationale, steps, or anatomy that directly impacts safe execution (e.g., doesn't understand *why* a critical step is done, misidentifies key anatomy consistently). *Remediation:* "Requires formal review of procedure anatomy/pathophysiology/rationale with faculty mentor. Requires demonstration of understanding via formal presentation or viva before next attempt."
      *   *The Articulation Debate & Back-Door Risk:* Articulation is **not** competence itself. Its role here is **solely as evidence of robust, transferable skill and adaptability**. A resident who performs flawlessly but cannot articulate *why* or *what they'd do differently* is likely operating on pattern recognition in familiar contexts. Their skill may not adapt to novelty (different anatomy, unexpected bleeding, new team). Requiring *accurate* articulation of rationale and variations forces the integration of declarative knowledge ("knowing-that") with procedural skill ("knowing-how"), creating a more resilient and adaptable competence less dependent on luck or specific conditions. It protects against the "success by luck" and "context-bound competence" failure modes. A truly proficient "knowing-how" *enables* coherent articulation.

  **Procedure Design: Choices Made & Judgment Calls**

  *   **Deliberately Kept:**
      *   **Knowing-How vs. Knowing-That Distinction:** The procedure separates technical performance (Step 3 - Knowing-How) from integrated knowledge/articulation (Step 4 - Knowing-That). It acknowledges they are distinct but linked for robust competence.
      *   **Transferability/Adaptability Focus:** The emphasis on articulation rationale/variations (Step 4) and context-dependency (Step 3 "Named Attending") directly addresses the need for competence to extend beyond specific, favorable conditions ("success by luck," "specific setup").
      *   **Decay Management:** The 6-month recency requirement in Step 1 explicitly combats skill decay without needing complex re-assessment for every case.
  *   **Deliberately Thrown Out for Speed:**
      *   **Granular Score Weights:** Instead of numerically weighting ITEs vs. mock orals vs. ratings, it uses them contextually as supporting evidence within Steps 3 & 4. A high mock oral score *supports* articulation; a low anatomy quiz *raises a flag* needing scrutiny if articulation is weak.
      *   **Deep Video Analysis:** Relies on documented summaries of video review within performance evidence (Step 3) rather than requiring committee viewing.
      *   **Formal Transfer Theory:** Doesn't attempt to define "nearby variants" rigorously; relies on articulation of variations and context flags as proxies.
  *   **Judgment Calls Wearing Procedure Costumes:**
      *   **Step 3 ("Performance Quality"):** Interpreting "consistent evidence" of "safe/effective/independent" from ratings/comments requires judgment. What constitutes "minimal attending input"? Committee must agree on thresholds.
      *   **Step 3 ("Context Dependency"):** Deciding *if* performance is truly context-dependent or just inconsistently good is judgmental. Requires careful reading of comments.
      *   **Step 4 ("Sufficient Articulation"):** Distinguishing "weak/inconsistent" articulation from a "fundamental misunderstanding" is a critical judgment call. Does an inaccurate rationale actually *impact* safety? Committee must decide.
      *   **Step 4 ("Named Attending" for Articulation):** Deciding *if* weak articulation justifies supervision requires weighing the *severity* of the weakness against the strength of the performance evidence. Judgment.

  **Case Applications**

  1.  **Case 1: The Straightforward Pass (e.g., Chief Resident, Lap Chole)**
      *   Step 1: 15 logged Lap Choles in last 6 months. PASS.
      *   Step 2: No safety lapses documented. PASS.
      *   Step 3: 4 Global Ratings: all "safe, efficient, independent." Video review (1 case) confirms. PASS.
      *   Step 4: Mock oral on Lap Chole: excellent, explains rationale/variations clearly. Teaching evals show effective instruction. PASS.
      *   **Verdict:** Cleared Unsupervised. *Remediation:* None.

  2.  **Case 2: The Split Committee Case (e.g., PGY-4, Open Inguinal Hernia)**
      *   Step 1: 4 Open Hernias logged in last 6 months. PASS.
      *   Step 2: No critical safety lapses. PASS.
      *   Step 3: 3 Global Ratings: Two "safe, efficient, independent." One states "safe but slow, required frequent reassurance, struggled with cord dissection in fatty tissue." No video. *Judgment:* Performance evidence is positive but inconsistent ("frequent reassurance," specific struggle noted). Not clearly context-dependent (only one rater). **Named Attending:** Cleared only with Named Attending Present (due to inconsistency).
      *   Step 4: Mock oral: Solid, explains steps well. Teaching evals: Intern notes "showed me how, but couldn't really explain *why* we dissect the cord that way." *Judgment:* Articulation is present but potentially weak on rationale. However, Step 3 already triggered "Named Attending," so Step 4 result doesn't change the verdict but informs remediation.
      *   **Verdict:** Cleared only with Named Attending Present (e.g., "Attending scrubbed or immediately available"). *Remediation:* "Requires ≥ 1 supervised case focusing on efficiency and confidence in cord dissection. Requires positive post-op assessment. Requires successful teaching session demonstrating rationale for cord dissection to junior resident."

  3.  **Case 3: The Uncomfortable Clearance (e.g., Senior Resident, Diagnostic Laparoscopy)**
      *   *Background:* Resident historically strong. Stopped logging cases meticulously 8 months ago ("too busy"). Faculty express concern about recent "distractedness," no specific safety events. Committee leans "Not Yet" due to lack of recent data/concerns.
      *   Step 1: Logs show only 1 completed Diagnostic Lap as primary in last 6 months. *Judgment:* **Not Yet.** Volume insufficient. *Remediation:* "Perform ≥ 3 supervised Diagnostic Lap cases as primary surgeon within next 3 months. Focus on independent execution." (Procedure stops here).
      *   *Why uncomfortable?* Committee might feel pressured to "pass" a senior resident based on past reputation despite lack of recent evidence. The procedure forces objective assessment of recency/volume first, overriding subjective concerns *or* historical reputation. This protects against clearing someone based on decayed skill. The remediation is specific and timely.

  **What This Procedure Can't Tell Us & Needs Escalation**

  1.  **Underlying Causes of Performance Issues:** *Why* is a resident inconsistent? (Burnout? Knowledge gap? Psychomotor issue? System factors?) The procedure flags *that* there's an issue (Step 3 "Not Yet" or "Named Attending") but not *why*. Remediation plans might need adjustment based on Program Director/mentor investigation.
  2.  **Severity of Non-Critical Deficiencies:** Is "slow but safe" acceptable for unsupervised call? Is a minor inaccuracy in rationale truly a safety risk? The procedure provides structure (Step 3 "Named Attending," Step 4 thresholds) but the committee's judgment on the *degree* of risk is essential. This is a values/institutional risk tolerance decision.
  3.  **"Inert Knowledge" Activation:** The procedure identifies if knowledge *exists* (Step 4) but not *why* it isn't used at the table if performance is poor. Remediation ("Requires supervised cases...") addresses the symptom (poor performance) but the root cause (why knowledge doesn't translate) may need mentoring.
  4.  **Overall Resident Risk Propensity:** This assesses *one procedure*. A resident cleared for unsupervised Lap Chole might still be a general liability due to judgment issues elsewhere. Program leadership must synthesize this procedure's output with broader assessments.
  5.  **"Success by Luck" vs. "Emerging Competence":** The procedure mitigates this through volume (Step 1), performance consistency (Step 3), and articulation of variations (Step 4). However, definitively proving a "disposition" vs. luck is impossible pre-autonomy. The Named Attending option for context or articulation allows cautious progression while gathering more evidence. Ultimately, granting *full* unsupervised status involves an unavoidable element of trust and institutional risk acceptance based on the compiled evidence.

  **Key Takeaway:** This procedure forces a structured, sequential review prioritizing safety, recent performance, and adaptable skill. It makes the evidence trade-offs explicit (performance first, articulation as transfer/adaptability check) and provides concrete remediation paths. The uncomfortable cases often arise when objective thresholds (volume, safety) override subjective impressions or seniority, which is precisely where a procedure adds value against liability and bias.
