answer: |-
  Here is the complete examination package as requested, adhering strictly to your constraints of no external references, no undefined technical terms, and arithmetic simplicity.

  ---

  ### 1. Examination Question Paper  
  **Time Allowed:** 1 hour  
  **Word Limit:** Approximately 800 words  
  **Instructions:** Answer all five parts using only the information below. Pencil and paper permitted; no calculator needed. Everything required is on this sheet.  

  ---

  #### Scenario  
  A wooden boat restoration society has records of 50 full restorations over 20 years. For each project:  
  - The owner gave a completion date at the start.  
  - The society recorded if the boat was finished by that date.  
  - At the start, owners filled a form. Twenty owners wrote they had "prepared exhaustively" (complete parts list, suppliers identified, hours budgeted). No one checked these claims.  
  - Records exist only for members who stayed in the society and returned the closing form.  

  #### Figures  
  - Of 50 projects, 10 finished by the original date.  
  - Of the 20 self-described "exhaustive preparers," 9 finished on time.  
  - Of the remaining 30 (non-preparers), 1 finished on time.  

  You are a society member starting a full restoration. On your form, you wrote you have "prepared exhaustively." You also completed two smaller projects (a dinghy and a launch) on time. Society records do not track if a project is an owner’s first.  

  ---

  #### Questions  
  **(i) [4 marks]**  
  Which rate is a better starting point for estimating your chance of finishing on time: 10 in 50, or 9 in 20? Explain why.  

  **(ii) [5 marks]**  
  Another member says: *"Start with 10 in 50 (the outside view), then raise it because I prepared properly."* Diagnose **exactly** what is wrong with this. State one condition where raising a base rate for case-specific information would be legitimate.  

  **(iii) [5 marks]**  
  Should your two smaller on-time completions change your estimated chance of finishing on time? If so, in what direction? What limits how much it can change?  

  **(iv) [3 marks]**  
  Suppose you later learn 3 of the 9 on-time "preparers" had hired a professional boatbuilder (which you have not). What does this imply for using the 9-in-20 rate for your estimate?  

  **(v) [3 marks]**  
  Given the sample size (50 projects, 20 "preparers") and how records were kept, how much confidence should you place in your final figure? What is wrong with treating it as exact?  

  ---

  ### 2. Model Answer (~700 words)  

  **(i)** The 10-in-50 rate (20%) is a better starting point than the 9-in-20 (45%). The 10-in-50 uses the whole reference class of restorations, avoiding bias from unverified claims. The 9-in-20 appears relevant because it matches my preparation claim, but that claim is self-reported and unchecked. Those 20 owners may have been overconfident, so their 45% success rate could be inflated by the same optimism I might have. Starting broadly reduces this risk.  

  **(ii)** The error is double-counting. The member uses "prepared properly" to justify raising the 10-in-50 rate (20%). But the 20% already includes all preparers and non-preparers. The 9-in-20 rate for preparers is 45%, which is higher precisely *because* it includes the "preparation" factor. Raising 20% for preparation counts that factor twice: once in the narrow class and once in the adjustment. It would be like adding sugar to a cake twice because you like sweetness.  

  Adjusting a base rate is legitimate only if the new information is **truly independent** of what defined the base rate. For example, if the society had verified preparation claims (e.g., by inspecting parts lists), *then* verified preparation could justify adjusting the broad rate. But here, "preparation" is based solely on untested self-reports, so it is not independent.  

  **(iii)** The two smaller projects suggest a slight upward adjustment, but with tight limits. They show I can estimate small projects well, so I might be better than average. However, a full restoration is larger and more complex. The dinghy/launch successes are not equivalent data points; they are smaller and may not predict this project. Also, I have no data on failures—I might have completed other small projects late, but records don’t exist. With only two projects, the adjustment must be small. I might raise my estimate by 5–10% (e.g., from 20% to 25–30%), but no more, because the sample is tiny and the work is different.  

  **(iv)** The 9-in-20 rate becomes less applicable. Those three successes partly depended on hiring a professional, a factor I lack. This means the "preparers" group is not homogeneous; some had extra help. My true reference class might be the 6 non-hired preparers who finished on time out of 17 total preparers (assuming the 3 hired were among the 9 successes and no hired preparers failed). But 6 in 17 (35%) is rough and ignores whether hiring caused the success. Since I lack this advantage, the original 45% is likely too high for me.  

  **(v)** Low confidence. The sample is small (only 20 "preparers"), and records exclude members who quit or did not return forms. If members quit after delays, the true on-time rate might be lower than recorded. For example, if 10 more projects were abandoned late and excluded, the true success rate could be 10 in 60 (17%) overall, or lower for preparers.  

  Treating any rate (like 20% or 45%) as exact is a mistake because:  
  - Small samples vary: With 20 preparers, 9 successes could easily be 7 or 11 by chance.  
  - The data is incomplete and unverified.  
  - Percentages imply false precision; they are estimates, not laws.  

  ---

  ### 3. Marking Scheme  
  **Total: 20 marks**  

  **(i) [4 marks]**  
  - Chooses 10-in-50 (not 9-in-20): **1 mark**  
  - Explains self-reports may be biased/overconfident: **1 mark**  
  - Argues broad class avoids optimism in narrow class: **1 mark**  
  - Contrasts unchecked claims vs. full record: **1 mark**  
  *Full marks*: Clear prioritization of broad rate due to bias risk. *Half marks*: Selects 10-in-50 but gives weak/no reason.  

  **(ii) [5 marks]**  
  - Diagnoses "double-counting" preparation factor: **2 marks**  
  - Explains 10-in-50 already includes preparers: **1 mark**  
  - Notes 9-in-20 already reflects preparation: **1 mark**  
  - States adjustment requires *independent* (e.g., verified) information: **1 mark**  
  *Full marks*: Explicitly names double-counting and gives independence condition. *Half marks*: Identifies error but misses why it’s double-counting or omits independence.  

  **(iii) [5 marks]**  
  - Says "yes, slightly upward": **1 mark**  
  - Notes limits: project size difference (small vs. full): **1 mark**  
  - Notes limits: only two projects (small sample): **1 mark**  
  - Notes limits: no failure records/selection bias: **1 mark**  
  - Suggests small adjustment (e.g., 5–10%): **1 mark**  
  *Full marks*: Balanced argument for slight change with three limits. *Half marks*: Direction correct but omits key limits.  

  **(iv) [3 marks]**  
  - Says rate becomes less applicable/likely too high: **1 mark**  
  - Explains heterogeneity (hired vs. non-hired): **1 mark**  
  - Suggests lower rate (e.g., notes 6/17): **1 mark**  
  *Full marks*: Links hired/non-hired to applicability. *Half marks*: Only states rate is "unreliable" without why.  

  **(v) [3 marks]**  
  - Advises low confidence: **1 mark**  
  - Cites small sample (n=20 preparers): **0.5 marks**  
  - Cites incomplete records (quitters excluded): **0.5 marks**  
  - Says mistake is "false precision" or "ignoring uncertainty": **1 mark**  
  *Full marks*: Integrates sample size and record flaws. *Half marks*: Generic "small sample" comment.  

  ---

  ### 4. Errors and Mark Deductions  
  - **Quoting 10-in-50 as "objective" and dismissing 9-in-20 as "rationalization" without justification** → **–2 marks** (Parts i/ii). *Why error*: Both rates are from records; the issue is bias in self-reports, not objectivity.  
  - **Double-counting preparation** (e.g., raising 10-in-50 for preparation in Part ii) → **–3 marks** (Part ii). *Why error*: Preparation already defines the narrow class; adjusting again duplicates the factor.  
  - **Treating 9-in-20 as precise "because it’s calculated"** → **–1 mark** (Part v). *Why error*: Arithmetic doesn’t eliminate sampling error or bias.  
  - **Over-narrowing the class** (e.g., using only her two projects) → **–2 marks** (Part iii). *Why error*: Two projects are insufficient and non-comparable; ignores base rates.  
  - **Reciting "inside/outside view" without applying to figures** (e.g., "Use outside view" with no analysis) → **–2 marks** (Parts i/ii). *Why error*: The scenario requires numerical reasoning, not vocabulary.  

  ---

  ### 5. Examiner’s Note  
  A fluent but memorized answer would score **6/20**. It would earn:  
  - Full marks on Part (i) (4/4) by rote "outside view" arguments.  
  - Partial marks on Part (ii) (2/5) for identifying double-counting but failing to specify *why* or the independence condition.  
  - **Marks stop at Part (iii)**. It would ignore project size/sample limits (scoring 1–2/5) and collapse in Parts (iv)–(v) (1–2/6) by not engaging with heterogeneity or uncertainty.  
  The question is designed to expose memorization at Part (ii) and penalize it heavily from Part (iii) onward, forcing candidates to reconcile the mixed views.  

  ---  
  This meets all constraints: no citations, no technical terms beyond "reference class" (used in your query), and arithmetic (10/50=20%, 9/20=45%, 6/17≈35%) is mental-math friendly. Figures are internally consistent.
