  5. **Housekeeping**: Avoid the word "qualia" except in quotes.

  Let's tackle each part.

  ---

  ### 1. Agreed Claims (Numbered List)

  We need claims that both camps agree on, but that are non-trivial. Based on the descriptions:

  - Both agree that the brain constructs models (including self-models) and that introspection involves accessing these models.
  - Both agree that reports about conscious experience can be influenced by confabulation, misrepresentation, etc.
  - Both agree that there is something it is like for the subject (from their first-person perspective) when they report experiences, but they disagree on what that "something" is.

  But we must avoid vacuity and ambiguity. Let's draft:

  1. **The brain maintains a self-model that includes a representation of the system's own states and processes.**
     - This is deniable by, say, a behaviorist who denies internal models.

  2. **Introspective reports about conscious experience are generated by accessing the self-model.**
     - Deniable by someone who thinks introspection is direct access to non-representational states.

  3. **Introspective reports can be inaccurate due to confabulation, misrepresentation, or incomplete information.**
     - Deniable by someone who believes in infallible introspection.

  4. **When a subject reports having a conscious experience (e.g., "I see red"), there is a fact of the matter about what they are reporting, but the nature of what is being reported is under dispute.**
     - This is a bit tricky. Both agree that the report happens and that it reflects some internal state, but they disagree on what that state is. We can split if needed.

  But note: Camp A might say the report is about a simplified self-model, while Camp B says it's about a rich inner show. However, both agree that the report is made and that it is about something internal. We can try:

     - 4a (from Camp A): The content of the report is entirely about the self-model's dashboard, and there is no additional "inner show" beyond the model's representations.
     - 4b (from Camp B): The report is about an inner show that is present, even if the report is sometimes inaccurate.

  But that's a disagreement. So for agreed claims, we stick to what they both accept without splitting.

  Let me rework:

  1. **The brain constructs a self-model that represents the system's own states and processes.**
  2. **Introspective reports about conscious experiences are generated by the self-model.**
  3. **These reports can be inaccurate, incomplete, or confabulated.**
  4. **From a first-person perspective, it subjectively seems to the individual that they are having experiences (e.g., "it seems to me that I am seeing red").**
     - Both accept that it seems that way to the subject. Camp A says that seeming is the entire story (an illusion), and Camp B says that seeming must be a seeming of something real.

  But Camp A might object to the word "seem" if it implies a subject to whom it seems? Actually, Camp A says the self-model is doing the seeming. They would agree that the system produces the report "it seems to me...", so they can agree that from the first-person perspective, it seems that there is an experience. They just think that seeming is an illusion.

  Camp B would agree that it seems that way, but they think that seeming is veridical (at least in the minimal sense that there is an experience).

  So both can agree that:

  4. **From the first-person perspective, it seems to the subject that they are having experiences with qualitative character (e.g., "it seems to me that I am having a red experience").**

  But note: Camp A would say that the qualitative character is part of the illusion, while Camp B says it is real. But they both agree that it seems that way. So the claim is about the appearance, not the reality.

  This is acceptable? Let's see if it's deniable: a zombie theorist might deny that it seems to the subject at all, so yes.

  5. **The brain's self-model is a drastically simplified representation of the system's actual states and processes.**
     - Camp A emphasizes this, but Camp B might agree that the model is simplified, but they would say that the richness of the experience is not captured by the model? Actually, Camp B doesn't necessarily disagree that the model is simplified; they just say there is more. So both can agree that the self-model is simplified.

  6. **The self-model can generate reports about the system's states without direct access to the underlying processes.**
     - Both would agree.

  Now, we must avoid:

  - "Consciousness is real": Camp A would say it's an illusion, Camp B says it's real. So we can't say that.

  So, let's list:

  **Agreed Claims:**

  1. The brain constructs and maintains a self-model that represents the system's own states and processes.
  2. Introspective reports about conscious experiences are generated by accessing the self-model.
  3. Such reports can be inaccurate, incomplete, or confabulated due to the limitations and nature of the self-model.
  4. From the first-person perspective, it seems to the subject that they are having experiences with qualitative character (e.g., "it seems to me that I am having a red experience").
  5. The self-model is a drastically simplified representation of the system's actual neural processes.
  6. The self-model does not have direct access to the underlying neural processes; it generates reports based on its own representations.

  These should be acceptable to both.

  ---

  ### 2. Disagreements Table

  We'll structure:

  | Issue | Camp A's Formulation | Camp B's Formulation | Nature of Disagreement |
  |-------|----------------------|----------------------|------------------------|

  Issues:

  1. **The nature of the "seeming" in first-person reports:**
     - A: The seeming is an illusion generated by the self-model; there is no inner show beyond the model's representation.
     - B: The seeming is veridical; it is the appearance of a real inner show, and the appearance itself is part of the conscious experience.

     Nature: Substantive, but with a terminological aspect about what counts as an "illusion" and what "seeming" refers to.

  2. **The existence of a subject of experience:**
     - A: The self-model creates the illusion of a subject. There is no additional subject beyond the system running the model.
     - B: The seeming requires a subject to whom it seems. The existence of the seeming implies a subject of experience.

     Nature: Substantive, but also terminological regarding "subject".

  3. **The status of the qualitative character:**
     - A: Talk about qualitative character (what it's like) is a story the system tells itself; there is no qualitative character independent of the model.
     - B: The qualitative character is real and present; the model may report on it inaccurately, but the character itself is not reducible to the model.

     Nature: Substantive.

  4. **The concept of "illusion":**
     - A: An "illusion" in this context means that the system represents itself as having an inner show, but no such show exists. The representation is all there is.
     - B: An illusion must be an illusion for someone. If the system represents itself as having an inner show, then that representation is itself a real experience, and thus there is an inner show.

     Nature: Partly terminological (what "illusion" means) and substantive (whether the representation constitutes the experience).

  5. **The transparency of "seems":**
     - A: When B says "it seems to me that there is an inner show", A interprets this as the model outputting a report about itself. The "seems" is just part of the model's content.
     - B: The "seems" is a direct report of a subjective fact. The seeming is not just a representation; it is the experience itself.

     Nature: Terminological in the sense of how we interpret the word "seems" (opaque vs transparent), but also substantive because it relates to what is being reported.

  We'll make rows for these.

  Specifically:

  - For the "illusion" issue: A says the entire inner show is an illusion. B says that if there's an illusion, there must be a real experience of that illusion.

  - For the "seems" issue: A says that the report "it seems to me" is the model's output and is about the model's state. B says that the report is about a real subjective state.

  Table:

  | Issue | Camp A's Formulation | Camp B's Formulation | Nature of Disagreement |
  |-------|----------------------|----------------------|------------------------|
