  | The interpretation of "seems" | When we say "it seems to me that there is an inner show", this is a report generated by the self-model about its own state. The "seems" is part of the model's content and does not refer to a separate subjective fact. | The report "it seems to me" directly reflects a subjective fact: the presence of a conscious experience. The seeming is the experience. | Partly terminological: whether "seems" is transparent (reporting a fact) or opaque (part of the model's content). Also substantive because it affects what we take the report to be about. |

