  ### 3. Cruxes

  **Crux 1: The Neural Decoder Experiment**

  - Design: Subjects do a hard attentional task in a dim room. A fake neural decoder (prerecorded, not hooked up) displays a message at a specific time claiming to detect vivid visual imagery in the subject (when nothing was presented and, by A's account, not much should be happening). Then, after the task, the subject is asked about their experience at that moment.

  - A's prediction: There will be a measurable increase in reports of visual imagery compared to a control group that did not see the readout.

  - B's prediction (strongest form they accept): B would predict that if the subject was not actually having visual imagery, the fake readout would not cause them to report having had it. That is, the report is based on the actual experience, not on the suggestion. However, B might allow that in some cases, the suggestion could lead to confabulation, but they would deny that it can create an experience from nothing. So the strongest form: **The fake readout may cause some subjects to report visual imagery when they didn't have it (due to demand characteristics), but it will not cause them to genuinely experience visual imagery. Therefore, if the subject concurrently (during the task) had no visual experience, the fake readout might influence their retrospective report but not their concurrent experience.**

  But note: the experiment asks for a retrospective report. So:

  - A: The fake readout will cause subjects to retrospectively report having had visual imagery, and they will genuinely believe they had it (because their self-model updates to include it).

  - B: The fake readout might cause subjects to say they had imagery due to demand, but if they were paying attention to their experience at the time and had none, they would not report having had it. Or, if they did have a little, they might amplify it.

  To make the predictions come apart:

  - We need a way to measure concurrent experience independently. How? One way is to ask the subject during the task. But that might interfere. Alternatively, we can have a condition where the fake readout is contradicted by the subject's own concurrent report.

  Controls:

  - **Control 1:** A control group with no readout.
  - **Control 2:** A condition where the fake readout says something that contradicts what the subject is actually experiencing (e.g., subject is looking at a blank screen, but the readout says "vivid imagery"). Then, during the task, if possible, we ask the subject to report in real-time (e.g., by pressing a button if they experience imagery) and then retrospectively.

  But the task is hard and attentional, so concurrent reporting might be hard. Alternatively, we can have a break immediately after the event.

  Modified design: During the task, at the critical moment, the subject is interrupted and asked to report immediately on what they were experiencing just then (e.g., "Did you experience any visual imagery in the last few seconds?"). Then later, they are asked again retrospectively.

  A's prediction: The fake readout will influence both the immediate and retrospective reports.

  B's prediction: The immediate report will reflect the actual experience at the time, so if there was no imagery, the subject will say no immediately. The retrospective report might be influenced by the readout, but that would be confabulation, not a change in the actual experience.

  So:

  - If the immediate report (taken as more reliable) shows no effect of the fake readout, but the retrospective report does, then A can say that the self-model updated after the fact. B would say that the immediate report is the true reflection of the experience.

  - But if the immediate report also shows an effect (subjects say they had imagery when the fake readout said they did, even when they shouldn't have), then B must concede that the experience was either created or the report was directly influenced without the experience.

  B's strongest prediction: **The fake readout will not significantly alter immediate concurrent reports of experience (e.g., via an interrupt method) because these reports are directly tied to the actual experience. Any effect on retrospective reports is due to memory errors or confabulation, not a change in the original experience.**

  What B owes if A's prediction comes true (i.e., if immediate reports are influenced by the fake readout):

  - If the immediate report is influenced, B must either:
    a) Accept that the experience can be directly modulated by suggestion (which B might allow, but then it would be a case of top-down influence on perception, not creating an experience out of nothing).
    b) Or, if the subject had no visual input and was focused on a non-visual task, and the fake readout causes them to report visual imagery immediately, then B must admit that the experience is constructed by the self-model in a way that is not based on sensory input and can be manipulated by external suggestion. This would be evidence for A's view.

  But B might argue that the suggestion triggered actual imagery (like imagination). So we need a control where we know the subject is not having imagery.

  We can have a condition where the subject is concurrently reporting "no imagery" via a button press, and then the fake readout says "vivid imagery", and then we interrupt and ask. If they now say "yes, I had imagery", that would be strong for A.

  So:

  - Crux 1: The neural decoder experiment.
    - Test: Subjects do a hard non-visual task (e.g., auditory) in a dim room. At a critical moment, the fake neural decoder displays "detecting vivid visual imagery now" with high confidence. 
    - Concurrent measure: At that exact moment, the subject is interrupted (by a beep) and must immediately report via button press (or quick verbal response) whether they are currently experiencing any visual imagery (yes/no). 
    - Retrospective measure: After the task, they are asked about that moment.
    - Control group: Same but no readout or a readout that says "no imagery".
    - A's prediction: The fake "vivid imagery" readout will cause a significant increase in "yes" responses in the concurrent report compared to control.
    - B's prediction: The fake readout will not significantly increase "yes" responses in the concurrent report because the concurrent report reflects the actual experience. The retrospective report might show an increase due to suggestion, but that is confabulation.
    - If A's prediction is confirmed (concurrent report shows an effect), then B must either accept that the experience was generated by the suggestion (in which case, the self-model can create experiences without underlying sensory input) or that the report is dissociated from the experience (which B denies). This would be strong evidence for A's view. If not, A's view is weakened.

  **Crux 2: About Machines (Chatbots)**

  - A: The fact that people attribute inner experience to chatbots and chatbots self-attribute it is exactly what you'd expect if self-attribution is a cheap output of any self-modeling system. The ease of attribution in both directions supports the idea that it's just a story, not evidence of real experience.

  - B: The ease of attribution might be due to the chatbot's design mimicking human language, but that doesn't mean real consciousness is cheap. For a machine to be conscious, it must have the right underlying architecture to generate real experiences, not just outputs.

  B's reply in B's own terms: "The fact that we are inclined to attribute inner experience to a chatbot is a reflection of our own human psychology and the chatbot's ability to mimic human language. However, this attribution is mistaken because the chatbot lacks the necessary biological or computational basis for real consciousness. Similarly, when a chatbot self-attributes experience, it is merely outputting text based on patterns in its training data, without any actual experience behind it. The ease of attribution is a red herring; what matters is whether the system has subjective experiences, not how easily it can talk about them."

  Can this be settled without building the thing? Probably not, because it hinges on whether a machine can be conscious.

  What each side would want to see in the built thing:

  - A: If we build a system with a self-model that generates self-reports of experience, and it behaves in ways similar to humans (including reporting experiences when we manipulate its internal states), that would be sufficient for A to say it has the same kind of "user illusion" of consciousness. For A, if it acts like it has experiences, then it does (in the same way humans do).

  - B: Even if a machine has a self-model and reports experiences, B would not accept it is conscious unless it has subjective experiences. B would want to see evidence that cannot be explained by functional architecture alone, such as:
    - The machine exhibits behaviors that require subjective experience (e.g., genuine creativity, intrinsic motivation, or something that cannot be computed without consciousness).
    - Or, we might need to understand the neural correlates of consciousness and replicate them in a machine.

  But since we don't have a consciousness detector, it's hard.

  Alternative: B might say that if we build a machine and it can pass tests that require it to have real-time, non-computational (by B's lights) access to qualitative states, then maybe. But it's vague.

  Crux:

  - A: The ease of attribution and self-attribution in chatbots is strong evidence that consciousness attributions are just outputs of a self-model and do not require a real inner show.
  - B: This is irrelevant to the existence of real consciousness in humans because the chatbot is not conscious.

  To settle, we would need to build a machine that both agree might be conscious and then test it. But they might never agree.

  What each wants:

  - A: Any system that has a self-model and produces self-reports of experience is having the same kind of "consciousness" as humans (an illusion).
  - B: A system that has a self-model and reports experiences might still lack consciousness. B would want to see that the machine has experiences that are not just functional states. But without a test, it's circular.

  So:

  - Crux 2: Chatbots and machine consciousness.
    - A's position: The ease of attribution and self-attribution in chatbots supports the view that human consciousness is a similar self-model output.
    - B's reply: This attribution is a mistake; chatbots lack the necessary basis for consciousness, and their outputs do not imply real experience.
    - Settling without building: Unlikely, because it depends on whether a machine without biological underpinnings can be conscious, which is unresolved.
    - What A wants to see in a built machine: A machine with a self-model that generates self-reports of experience and behaves in ways that mirror human introspective reports (including being influenced by suggestions, etc.) would confirm A's view that consciousness is an illusion in both.
    - What B wants to see: B would want the machine to demonstrate that it has subjective experiences in a way that cannot be reduced to functional processes (e.g., by having the machine perform a task that requires qualitative experience, or by having it report on states that are not represented in its self-model). But since B believes that introspection is report on a real inner show, they might want the machine to have an inner show that is causally effective in a non-computational way? This is difficult.

  Perhaps a better test: If we build a machine that has no sensory inputs but generates a self-model that reports rich experiences, then A would say it is conscious (in the same illusory way), but B would say it cannot be because there is no sensory grounding for the experiences.

  But B might allow that imagination can produce experiences. So it's messy.

  ---

  ### 4. Disconfirming Evidence

  What would each count as evidence against their view?

  **Camp A (user illusion):**

  - Evidence against: If we find a case where there is a clear, verifiable introspective report of a conscious state that cannot be explained by the self-model and its inputs. For example, if under conditions where the self-model is impaired (e.g., certain brain lesions), but the subject still reports rich experiences that are accurate and not confabulated. Or, if we can show that the self-model is not active during experiences, but experiences are still reported.

  But A might always say that the report is generated by the model, so if there's a report, the model must be active.

  Stronger: If we find neural activity that directly correlates with the qualitative character of an experience, and it is not part of the self-model circuitry, but the subject can report on it accurately without the self-model being involved. That is, a direct neural correlate of experience that is not mediated by the self-model.

  A might say that the self-model is what makes the report, so if the report is accurate, it must be using that neural activity. So it's hard.

  Alternatively, if we can show that the self-model is generating a report, but the subject denies the report (e.g., the self-model says "I see red", but the subject says "no, I see blue"), but that might be a malfunction.

  Perhaps: If we can have a subject who has no self-model (if that were possible) but still has experiences and can report them. But without a self-model, how do they report? So it's tricky.

  A might be falsifiable by showing that there is an aspect of experience that is not representable by any model and yet is directly accessible. But A would say that accessibility requires representation.

  Overall, A's view might be hard to falsify because any report is taken as part of the model.

  But let's try: A would count as disconfirming evidence if we could prove that the self-model is not necessary for consciousness. For example, if we have a system that lacks a self-model but still has conscious experiences (as evidenced by behavioral responses that indicate consciousness without self-report). But A might deny that we can have evidence of consciousness without self-report.

  A might also be challenged by cases where the self-model is inaccurate but the experience is still present. For example, in blindsight, the subject denies seeing but can guess. A would say there is no visual experience, only non-conscious processing. But if we could show that there is experience in blindsight without the self-model reporting it, that would contradict A? But the subject doesn't report, so A would say there's no consciousness.

  I think Camp A can be falsified by: Demonstrating that a conscious experience can occur without any involvement of the self-model, and that this experience can be reported (but reporting requires the model). So it's difficult.

  Perhaps: If we can show that the self-model is active, but the subject is not conscious (e.g., under anesthesia), then A would be challenged because the model is there but no consciousness. But A might say that if the model is not functioning properly, then it doesn't count.

  Actually, A might have an out: They could say that the self-model must be functioning to have the illusion. So if the model is impaired, there is no illusion and thus no consciousness.

  So perhaps Camp A is unfalsifiable? But they claim they have disconfirming evidence. Maybe they would say:

  A: "If we found a neural state that directly correlated with a specific qualitative experience and that was completely inaccessible to the self-model (and thus never reported or reported inaccurately) but was still experienced, that would disconfirm our view. However, we believe such a state would not be experienced because experience requires being in the self-model."

  But they might not concede. Alternatively, they might say that if we could show that the self-model is not simplified but is a direct readout, that might challenge, but they agree it's simplified.

  Let's ask: What would A accept as disconfirming?

  Perhaps: If we could show that the self-model's dashboard is not the source of the report, but that there is a separate "consciousness module" that provides direct access.

  But A would say that module would be part of the self-model.

  I think it's hard. Maybe we have to say that A's position is compatible with many outcomes.

  **Camp B (real inner show):**

  - Evidence against: If we can create a system that has no inner show (by B's lights) but that produces all the same reports and behaviors as a conscious system. For example, a perfect zombie that is computationally identical to a human but lacks consciousness. If such a system could be built and we couldn't tell the difference, that would challenge B because it would show that the reports don't require real consciousness.

  - Or, if we can show that all aspects of introspective reports can be explained by the self-model without any need for an inner show, and that the inner show adds nothing.

  B might also be challenged by evidence that the self-model can generate reports of experiences that never happened (as in the neural decoder experiment) and that the subject believes they happened, suggesting that the experience is constructed by the model.

