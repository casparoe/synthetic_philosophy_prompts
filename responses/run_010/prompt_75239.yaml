  **Crux 1: The Neural Decoder Experiment**  
  *Design (agreed by both):* Subjects perform a high-demand attentional task in a dim room. A fake "neural decoder" (prerecorded, non-functional) displays a message during a task-irrelevant interval: "Detecting vivid visual imagery now [high confidence]." Post-task, subjects describe their experience at that moment. Controls: Group 1 (no readout), Group 2 (readout always says "no imagery").  

  - **Camp A's Prediction:**  
    Significant increase in reports of visual imagery in the experimental group vs. controls. The self-model incorporates the decoder's suggestion, updating its dashboard to include imagery that was never present.  

  - **Camp B's Prediction (strongest form they accept):**  
    No increase in *veridical* reports of imagery. Subjects may confabulate retrospectively due to demand characteristics, but **concurrent experience remains unaffected**. If subjects had no imagery, their real-time self-monitoring would not change.  

  - **What B Owes if A's Prediction is Confirmed:**  
    If experimental subjects report concurrent imagery (via real-time measures below), B must concede that:  
    - The self-model can generate the *phenomenology* of an experience via suggestion, not just the report, or  
    - The report is so dissociated from experience that B's "seeming" cannot be trusted.  
    *If only retrospective reports increase*, B can dismiss it as confabulation.  

  - **Controls to Distinguish Predictions:**  
    1. **Concurrent Reporting:** Interrupt subjects during the decoder's message with a low-cognitive-load prompt (e.g., button press for "experiencing imagery now?").  
    2. **Contradiction Condition:** Fake decoder claims "vivid imagery" while subject concurrently reports "no imagery" (via button). Tests if the decoder overrides real-time judgment.  
    3. **Memory Control:** Post-task, ask subjects to distinguish between what they experienced then vs. what they think now.  

  *Outcome Interpretation:*  
  - If concurrent reports (button presses) show a significant increase in imagery claims, A wins; B loses ground.  
  - If only retrospective reports increase, B can attribute it to confabulation; the core disagreement persists.  

