  We are going to create a document that both camps can sign, with the following sections:

  1. **Agreed Claims (Numbered List)**
     - Each claim must be non-vacuous (deniable by a third party).
     - If a claim is ambiguous and each camp would interpret it differently, split it and assign.

  2. **Disagreements Table**
     - Columns: Issue, Camp A's Formulation, Camp B's Formulation, Nature of Disagreement (substantive or terminological)
     - Address specific points about "illusion" and "seems".

  3. **Cruxes**
