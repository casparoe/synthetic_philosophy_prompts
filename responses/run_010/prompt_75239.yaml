  | The existence of a subject | The self-model creates the representation of a subject. There is no additional subject beyond the system that runs the model. | For there to be an illusion of consciousness, there must be a subject who is experiencing the illusion. The existence of the seeming implies a subject of experience. | Substantive, but the term "subject" is being used differently: Camp A means a persistent entity beyond the system, while Camp B means the minimal subject of experience. |
  | The status of qualitative character | Talk about "what it's like" (e.g., to see red) is a story the self-model tells itself about states that are not themselves qualitative; the qualitative aspect is only in the story. | The qualitative character of experience is real and present; it is what the self-model is attempting to report on, even if the report is sometimes inaccurate. | Substantive. |
