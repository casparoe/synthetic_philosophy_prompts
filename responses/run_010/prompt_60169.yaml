prompt: |-
  I write the ideas column for a weekly — normally science and cognition, but this month I've been reporting a piece on immigration and work, and one sentence has turned up in nearly every interview I've done: immigrants do the jobs the rest of us wont do. I've heard it from a nursing-home operator who means it approvingly, from a union organizer who means it as an indictment (the jobs are terrible, that's the whole point), and from an economist who told me the sentence is worthless until somebody names a wage. That last one is where I'm stuck, because I want to build my nut graf around the phrase and I have no idea which version of it I'd be signing up for.

  Can you take the sentence apart for me? I want the different claims it could be making laid out as a menu, not as one settled meaning. My guess is that the load is on "won't," but there's probably stuff hiding in "the jobs" too, and in who counts as "the rest of us." For each reading: what it actually asserts, whether it's a claim about willingness or about ability or about legal permission, whether it's trivially true / substantively true / probably false, and what you'd have to go look at to settle it.

  Three more things. Some people use the sentence to argue that immigration therefore can't be dragging native wages down — tell me which reading, if any, actually licenses that inference. There's also a chicken-and-egg worry I can't quite articulate, something about whether a job is badly paid because nobody wants it or unwanted because it's badly paid, and whether it changes what "the jobs" even refers to once people start filling them — if that's a separate reading, say so and put it on the list. And finally: which reading does each of my three sources need for their point to survive, are those readings compatible with each other, and is there any version of the sentence I can print without it being either empty or false?

  Keep it to something I can read in ten minutes. No citations or reading list — I just need the distinctions and your verdicts on them.
reasoning: |-
  Okay, the user writes an ideas column focusing on science and cognition but is currently tackling immigration and work. They keep hearing the phrase "immigrants do the jobs the rest of us won't do" in interviews and want to unpack it for their article. They mention three sources: a nursing-home operator (approving), a union organizer (critical), and an economist (skeptical). The user is stuck on the economist's point about wages and wants to dissect the phrase into different interpretations without committing to one settled meaning.

  First, I need to break down the sentence into its components. The key phrases are "the jobs," "won't," and "the rest of us." Each part can be interpreted differently, leading to distinct claims. The user also has specific questions: which reading supports the argument that immigration doesn't drag down wages, the chicken-egg problem of job desirability vs. pay, and which readings each source relies on.

  Starting with "the jobs." This could mean jobs that are currently unfilled by natives or jobs that are inherently undesirable. The unfilled jobs angle might be trivially true but empty, while the inherently undesirable jobs claim is more substantive but questionable because undesirability often ties to pay and conditions. The chicken-egg issue here is crucial—does low pay cause the job to be unwanted, or is it inherently bad? The economist would argue that at a higher wage, natives might take the job, so it's not inherently undesirable.

  Next, "won't." This could refer to unwillingness at current wages, inability (physical or skill-based), or lack of legal permission. Unwillingness is the most common interpretation but depends on wage levels. Inability might apply to jobs requiring specific skills, but that's less common. Legal permission is straightforward but narrow. The union organizer's point about jobs being terrible ties into unwillingness due to poor conditions, but again, wages matter.

  Then, "the rest of us." This usually means native-born citizens but could include other groups. The economist's wage argument suggests that "us" might change if wages rise, so the group isn't static. The union's critique implies that "us" refers to workers who are protected by labor standards, which immigrants might not be, leading to exploitation.

  The user also wants to know which reading supports the claim that immigration doesn't lower native wages. The economist's wage argument is key here—if immigrants fill jobs that natives wouldn't take at any wage, then they're not competing for the same jobs, so no wage depression. But if the jobs could attract natives at higher wages, then immigration might suppress wages by filling those jobs at lower pay. So the "unwilling at current wages" reading doesn't support the no-wage-drag inference, while the "unwilling at any wage" version does, but that's probably false.

  For the sources: the nursing-home operator likely uses the phrase to mean jobs that are unfilled and undesirable, implying necessity. The union organizer focuses on the jobs being terrible, so they see "won't" as unwillingness due to poor conditions, which is an indictment of the system. The economist rejects the phrase without wage specification, arguing it's meaningless without context. Their readings are incompatible because the operator and union assume the jobs are inherently undesirable, while the economist says they're only undesirable at current wages.

  The user needs a version of the sentence that's not empty or false. The "unwilling at current wages" reading is substantively true but doesn't support strong conclusions. Adding context about wages or specific job types could make it more meaningful. The user should present the phrase as a starting point for discussion, highlighting the different interpretations and emphasizing the role of wages and conditions.

  I should structure the response by breaking down each component, then combining them into possible readings. For each reading, assess what it asserts, its truth status, and what evidence is needed. Address the wage-drag inference, the chicken-egg issue, and source compatibility. End with recommendations for the nut graf, suggesting the most defensible version and how to frame it.
answer: |-
  Here's the breakdown of "immigrants do the jobs the rest of us won't do" into distinct claims, focusing on the loaded terms. Think of these as lenses you can apply to the phrase:

  **I. Deconstructing "The Jobs"**
  *   **Reading A (Vacant Jobs):** "Jobs currently going unfilled by non-immigrants at prevailing wages/conditions."  
      *   **Asserts:** A state of the labor market *right now*.  
      *   **Nature:** Descriptive observation.  
      *   **Truth:** Often trivially true (if they're unfilled, someone *isn't* doing them). May be empty.  
      *   **Evidence Needed:** Current vacancy rates in specific sectors.  
  *   **Reading B (Inherently Undesirable Jobs):** "Jobs that are objectively terrible (low pay, hard, dirty, dangerous, unstable, low-status) regardless of wage."  
      *   **Asserts:** An inherent quality of the *job itself*.  
      *   **Nature:** Claim about job characteristics.  
      *   **Truth:** Substantively debatable. Very few jobs are utterly undesirable at *any* conceivable wage (the economist's point). Often conflated with low pay.  
      *   **Evidence Needed:** Analysis of job characteristics *disentangled* from compensation/conditions. Hard to do.  
  *   **Reading C (Jobs Created/Maintained by Immigration):** "Jobs that only exist *because* a pool of low-wage immigrant labor is available (e.g., hyper-seasonal agriculture, certain 24/7 care models)."  
      *   **Asserts:** The job's very existence depends on immigrant labor supply.  
      *   **Nature:** Claim about labor market dynamics.  
      *   **Truth:** Plausible for specific niches, hard to prove universally.  
      *   **Evidence Needed:** Economic models, historical analysis of industries before/after immigration changes, employer surveys on business models.

  **II. Deconstructing "Won't" (The Crux)**
  *   **Reading 1 (Unwilling at Current Wage):** "Non-immigrants are *unwilling* to do these jobs *at the wages and conditions currently offered*."  
      *   **Asserts:** A preference driven by price (wage/conditions).  
      *   **Nature:** Economic claim about labor supply elasticity.  
      *   **Truth:** **Substantively True & Most Common/Defensible.** Reflects basic labor economics.  
      *   **Evidence Needed:** Wage elasticity studies, surveys of native worker job preferences *conditional on wage*.  
  *   **Reading 2 (Unable):** "Non-immigrants *lack the physical capacity, specific skills, or geographic proximity* to do these jobs."  
      *   **Asserts:** A barrier of ability or access.  
      *   **Nature:** Claim about human capital or logistics.  
      *   **Truth:** Sometimes true (e.g., niche skills, remote locations), but often overstated. Skills can be learned; location can change. Less common core meaning.  
      *   **Evidence Needed:** Skills gap analyses, geographic mobility data.  
  *   **Reading 3 (Legally Barred/Disincentivized):** "Non-immigrants *face legal barriers* (e.g., licensing) or *strong welfare/work disincentives* making these jobs unattractive."  
      *   **Asserts:** Institutional barriers prevent native participation.  
      *   **Nature:** Claim about policy effects.  
      *   **Truth:** Plausible in specific cases (e.g., licensing), highly contentious re: welfare disincentives.  
      *   **Evidence Needed:** Analysis of specific regulations, research on welfare/work disincentives.  
  *   **Reading 4 (Unwilling at Any Wage):** "Non-immigrants would *never* do these jobs, *no matter how high the wage*."  
      *   **Asserts:** Absolute cultural or social rejection of the work.  
      *   **Nature:** Sociological claim.  
      **Truth:** **Probably False** for virtually all jobs. Someone would clean sewers for $1,000/hour. A theoretical limit, not practical.  
      *   **Evidence Needed:** Thought experiments, lack of counterexamples at extreme wages.

  **III. Deconstructing "The Rest of Us"**
  *   **Reading X (Native-Born Citizens):** The most common interpretation.  
  *   **Reading Y (Non-Immigrants - incl. naturalized citizens):** Broader, but less common in popular usage.  
  *   **Key Implication:** Defines the comparison group. The economist's point highlights that "us" isn't static – higher wages might attract *different* people from "us" (e.g., retirees, students, career-changers).

  **The Chicken-and-Egg Worry:**
  This is core to **Reading B vs. Reading 1**. Is the job "unwanted" because it's inherently terrible (B), or is it "unwanted *at the offered price*" (1)? **Reading 1 dominates**: Low pay is often a *primary cause* of the job being "unwanted" by natives. "The jobs" in the phrase often *refer* specifically to jobs that exist *only* or *primarily* at the low wage levels made possible by immigrant labor (linking to **Reading C**). Once immigrants fill them at low wages, it reinforces the perception of them as "jobs natives won't do *at that wage*."

  **The Wage-Drag Inference:**
  *   The inference ("Therefore, immigration isn't dragging down native wages") **only logically holds** under **Reading 4 (Unwilling at Any Wage)**. If natives truly wouldn't do the job *at any wage*, then immigrants aren't competing with them for those jobs, so no wage suppression.  
  *   **Problem:** Reading 4 is almost certainly false. Under the far more plausible **Reading 1 (Unwilling at Current Wage)**, immigrants *are* competing for jobs that *could* attract natives at higher wages. Their presence *can* suppress wages or slow wage growth in those sectors by satisfying demand at the lower wage. The inference is **not licensed** by the common, defensible readings of the phrase.

  **Your Sources' Needs & Compatibility:**
  1.  **Nursing-Home Operator (Approving):** Needs **Reading A (Vacant Jobs)** + **Reading 1 (Unwilling at Current Wage)**. Implies immigrants solve a practical staffing crisis *given the current business model/reimbursement rates*. Compatible with the economist's core critique if wages are acknowledged as the barrier.
  2.  **Union Organizer (Indictment):** Needs **Reading B (Inherently Undesirable Jobs)**. Argues the jobs *are* terrible *and* that the phrase masks exploitation – the jobs *should* be made better (higher pay, safety, dignity) to attract natives. **Incompatible** with the economist, who sees undesirability as primarily wage-driven (Reading 1), not inherent (Reading B). The unionist likely rejects Reading 1 as conceding too much to the low-wage model.
  3.  **Economist (Name the Wage):** Explicitly argues for **Reading 1 (Unwilling at Current Wage)** as the only meaningful interpretation. Rejects Reading B as incoherent without wage context and Reading 4 as false. Sees Reading A as trivial/empty without the "why" (which is Reading 1). **Incompatible** with the unionist's Reading B foundation. Compatible with the operator's *observed reality* but not the implication that the jobs are *inherently* impossible to fill otherwise.

  **A Printable Version?**
  *   **The Most Defensible Core:** "Immigrants disproportionately fill jobs that native-born workers are *unwilling to take at the wages and conditions currently prevailing in those sectors*." (Combining **Reading 1** + **Reading A**). This is:
      *   **Not Empty:** It makes a substantive claim about labor market dynamics and preferences.
      *   **Not False:** It reflects observable reality and basic economics.
      *   **Holds Water:** It's the interpretation backed by the most evidence.
      *   **Nuanced:** It inherently contains the economist's point – the wage is key. It allows for the operator's staffing reality and the unionist's critique of *why* the wages/conditions are low (without endorsing Reading B).

  **Your Nut Graf Suggestion:**
  Frame the *phrase itself* as the point of contention. Something like:

  > "The ubiquitous claim that 'immigrants do the jobs the rest of us won't do' sounds simple, but unravels into clashing meanings upon inspection. Is it a description of vacant positions, an indictment of exploitative work, or an economic truism dependent entirely on the unstated wage? While often used to imply immigrants fill roles natives inherently shun, the more defensible meaning is narrower: immigrants fill jobs natives reject *at the current pay*. This distinction isn't semantics – it determines whether the phrase justifies low wages, demands better conditions, or simply reflects market realities where price dictates supply."

  This lets you present the menu without endorsing one "true" meaning, honors your sources' perspectives (showing why they clash), incorporates the economist's crucial insight, and provides a clear, accurate foundation for the rest of your piece.
