answer: |-
  ### Decision Tree: Normative Positions on Commercial Surrogacy and Compensated Egg Donation  
  *Each branch answers a question via hypothetical scenarios. Follow the path based on intuitive judgments.*  

  **Q1 (Alienability):**  
  *Imagine a financially stable woman with no children who freely chooses, after counseling, to be paid to carry a pregnancy for an infertile couple. She views it as meaningful work. Could this arrangement be ethically acceptable?*  
  - **Yes** → Proceed to Q2.  
  - **No** (Gestation is inherently non-salable; payment degrades human dignity) → Proceed to Q3.  

  **Q2 (Location of Wrong):**  
  *If the arrangement is acceptable in Q1, but concerns arise, where is the primary ethical flaw? Consider a case where a surrogate in a low-income country is paid fairly but brokers take 50% as commission.*  
  - **Payment itself** (Compensation turns intimacy into commodity) → Proceed to Q4.  
  - **Enforceability** (Binding contracts violate bodily autonomy) → Proceed to Q4.  
  - **Brokerage** (Agencies exploit vulnerability for profit) → Proceed to Q4.  
  - **Child transfer** (Separation harms gestator/child bond) → Proceed to Q4.  
  - **Home-country refusal** (Invalidating foreign-born children creates statelessness) → Proceed to Q4.  
  - **No flaw** (All elements are acceptable if voluntary) → Proceed to Q4.  

  **Q3 (Oocyte vs. Gestation Asymmetry):**  
  *Gestation is non-salable (from Q1), but what about selling eggs? Imagine a student donating eggs for tuition money, with no pregnancy involved.*  
  - **Both should be treated the same** (Reproductive materials/labor share sacred status) → Proceed to Q5.  
  - **Oocytes sale permissible, gestation not** (Eggs lack embodied labor; gestation creates unique bonds) → Proceed to Q5.  
  - **Gestation sale permissible, oocytes not** (Eggs are genetic identity; gestation is service) → *[Rare; merge with "Yes" in Q1]* → Proceed to Q5.  

  **Q4 (Change of Heart):**  
  *After birth, the gestator bonds deeply and wishes to keep the child, despite a contract. Who should decide?*  
  - **Gestator** (Autonomy over one’s body and birth experience is absolute) → Proceed to Q6.  
  - **Intended parents** (Contracts ensure trust; child’s social parentage matters) → Proceed to Q6.  

  **Q5 (Extraterritorial Enforcement):**  
  *A country bans paid surrogacy domestically. Should it prosecute citizens who commission it abroad where it’s legal?*  
  - **Yes** (Law should deter circumvention and protect global exploitation) → Proceed to Q7.  
  - **No** (Sovereignty respects legal differences; child’s welfare is paramount) → Proceed to Q7.  

  **Q6 (Economic Exploitation):**  
  *Is the core problem wealth disparity? Imagine a rich couple commissioning a middle-class gestator in a regulated system. Does this avoid ethical concerns?*  
  - **Yes** (Exploitation hinges on poverty/coercion; equity solves it) → Proceed to Q7.  
  - **No** (Wrong persists due to commodification, regardless of wealth) → Proceed to Q7.  

  **Q7 (Brokerage Necessity):**  
  *Could ethical surrogacy exist without agencies? E.g., a direct match via online forums with legal guidance.*  
  - **Brokerage essential** (Agencies ensure safety, screening, and fairness) → Assign leaf.  
  - **Brokerage harmful** (Middlemen inflate costs and obscure power imbalances) → Assign leaf.  
  - **Brokerage neutral** (Depends on regulation, not inherent value) → Assign leaf.  

