  ### Metaphysics of Modality Decision Tree  
  *Follow the paths to find your view without knowing the names. Answer based on concrete cases, not definitions.*  

  **Start:**  
  1. **Node 1:** There could have been blue swans. Does this require blue swans to exist *somewhere* (like in a parallel universe), or is it just about how actual things could have been rearranged?  
     - Require existence somewhere: Go to 2.  
     - Just about rearrangements: Go to 3.  

  2. **Node 2:** If we discovered a talking donkey in another universe, would "actual" still refer only to our universe, or would it shift to include where we are?  
     - "Actual" shifts (like "here"): Go to 4.  
     - "Actual" still means our universe: Leaf A.  

  3. **Node 3:** Could there be a new fundamental property (e.g., a color never seen)? Or must all properties be built from actual ingredients?  
     - New property possible: Go to 5.  
     - Must be built from actuals: Go to 6.  

  4. **Node 4:** Can the same object (e.g., Socrates) exist in multiple worlds? Or only counterparts (similar things) in other worlds?  
     - Same object: Leaf B.  
     - Only counterparts: Leaf C.  

  5. **Node 5:** Is a "world" a real thing (e.g., a fact-like entity) or just a useful story we tell?  
     - Real thing: Go to 7.  
     - Useful story: Leaf D.  

  6. **Node 6:** Are all possibilities just reshufflings of actual atoms/properties? Or can they involve new descriptions?  
     - Just reshufflings: Leaf E.  
     - New descriptions: Go to 8.  

  7. **Node 7:** Can two worlds differ only in size (e.g., 100 vs. 101 angels)? What about infinite sizes (e.g., countable vs. uncountable)?  
     - Yes to both: Leaf F.  
     - No or unclear: Leaf G.  

  8. **Node 8:** When we say "Socrates could have been a carpenter," does this require a world containing Socrates himself, or just a description of someone like him?  
     - Contains Socrates: Leaf H.  
     - Just a description: Leaf I.  

  ---

  ### Leaves (Named Views or Open Cells)  
  *Each leaf includes: (1) View name or diagnosis, (2) Most uncomfortable upshot, (3) How it differs from nearest neighbor (by node).*  

  - **Leaf A: Open cell (Concrete worlds with non-indexical actual)**  
    - *Diagnosis:* Unclaimed; why posit concrete worlds if "actual" doesn’t work indexically?  
    - *Upshot:* No clear reason to make other worlds concrete but keep "actual" special.  
    - *Differs from Leaf C (Lewis):* Node 2 ("actual" doesn’t shift).  

  - **Leaf B: Open cell (Concrete worlds with transworld identity)**  
    - *Diagnosis:* Incoherent; if worlds are parallel universes, how can one object be in two at once?  
    - *Upshot:* Violates intuitive spatiotemporal boundaries.  
    - *Differs from Leaf C (Lewis):* Node 4 (same object in multiple worlds).  

  - **Leaf C: Lewis's modal realism**  
    - *Upshot:* Countless concrete parallel universes exist, bloating reality.  
    - *Immune to "sentence-world" objection:* Concrete worlds represent uninstantiated properties and infinities perfectly.  
    - *Differs from Leaf D (Rosen):* Node 1 (worlds exist somewhere).  

  - **Leaf D: Rosen's fictionalism**  
    - *Upshot:* Worlds aren’t real—modal truths depend on useful fictions.  
    - *Immune to "sentence-world" objection:* Fiction can represent anything, but at the cost of reality.  
    - *Differs from Leaf H (Adams):* Node 5 (worlds are stories, not real).  

  - **Leaf E: Armstrong's combinatorialism**  
    - *Upshot:* Cannot represent genuinely new properties (e.g., alien colors) or infinities beyond actual resources.  
    - *Bitten by "sentence-world" objection:* Fails on uninstantiated properties and fine-grained infinities.  
    - *Differs from Leaf F (Plantinga):* Node 3 (no new properties).  

  - **Leaf F: Plantinga's states-of-affairs view**  
    - *Upshot:* Commits to a vast realm of unactualized abstract states (e.g., "Socrates being a carpenter").  
    - *Immune to "sentence-world" objection:* States can represent uninstantiated properties, but may struggle with infinities (cost: mysterious abstract plenitude).  
    - *Differs from Leaf G (Adams):* Node 7 (handles size differences well).  

  - **Leaf G: Adams-style linguistic ersatzism**  
    - *Upshot:* Worlds are sets of sentences, so they can’t distinguish infinities if language is limited (e.g., countable vs. uncountable).  
    - *Bitten by "sentence-world" objection:* Fails on fine-grained infinities; uninstantiated properties only if language has primitive predicates (cost: ad hoc vocabulary).  
    - *Differs from Leaf F (Plantinga):* Node 7 (struggles with size differences).  

  - **Leaf H: Adams-style linguistic ersatzism**  
    - *Upshot:* Worlds are sets of sentences, so they can’t distinguish infinities if language is limited.  
    - *Bitten by "sentence-world" objection:* Same as Leaf G.  
    - *Differs from Leaf I: Node 8* (worlds contain Socrates himself).  

  - **Leaf I: Open cell (Linguistic ersatzism without transworld identity)**  
    - *Diagnosis:* Unappealing; if worlds are descriptive, why can’t they include the same object?  
    - *Upshot:* Makes de re modality (e.g., "Socrates could have...") hard to explain.  
    - *Differs from Leaf H (Adams):* Node 8 (worlds don’t contain Socrates).  

  ---

  ### Tree Limits & Notes  
  - **"Sentence-world" objection:** This bites at Node 7. Immune leaves are C (Lewis), D (Rosen), and F (Plantinga), but immunity costs: Lewis needs concrete worlds, Rosen needs fictionalism, Plantinga needs abundant abstracta.  
  - **Can’t separate these leaves:**  
    - Leaf G and Leaf H (both Adams-style): They differ only on transworld identity (Node 8). To separate, ask: "Could Socrates have been alone in existence?" Adams says yes (worlds are descriptions, so Socrates can be isolated), but a no answer might indicate a variant.  
    - Leaf F (Plantinga) and a Stalnaker-like view: The tree doesn’t distinguish them. Extra question: "Are worlds primitive or constructed?" Plantinga says constructed, Stalnaker often says primitive.  
  - **Tree scope:** Covers major views but may miss hybrids (e.g., "magical ersatzism"). Based on concrete cases, not jargon.  

