prompt: |-
  I cover forecasting, prediction markets and quant-ish social science for a mid-sized digital outlet, which means roughly once a week I end up with the same problem: two credentialed people hand me two different numbers for the same question and I have to write something. Right now my default is a coward's both-sides paragraph. My editor wants a house standard and honestly so do I, but I want it grounded in something better than my gut.

  The thing I keep circling back to is Aumann's result about how two rational Bayesians who started from a common prior, and who commonly know each other's beliefs, can't end up disagreeing — no agreeing to disagree. I've read the usual grumbling: the common prior assumption is a modeling convenience no real beliefs satisfy, priors get picked post hoc to make the model behave, and common knowledge never actually obtains outside a proof. Fine. But it seems to me there's a usable procedure buried in it anyway. A disagreement is only worth reporting as a contest — only settleable by more evidence — if the gap survives a check that it isn't being produced by something other than a genuine difference in priors. If it doesn't survive, then the honest story is about priors, or about two people answering different questions, and no amount of new data closes it.

  So: turn that into a decision procedure I can actually run. Numbered steps, the question I put to each source at each step, what counts as a sufficient answer, and where each step terminates — real disagreement (report the contest), prior gap (report the gap, not the contest), definitional mismatch (kill it or rewrite the question), or incentives (it was never a belief difference at all). I get maybe an hour per case, no math beyond arithmetic, and my deputy editor signs off on anything that implies one of the two people is simply wrong. Write it for somebody with zero formal epistemology, and if a step leans on a formal result, give me one plain sentence on what it says and one on what it doesn't say. No bibliography, no reading list, no names I'd have to chase down.

  Cases it has to handle, because they occur constantly: one source has data access the other doesn't; the two are using different reference classes for the base rate; strategic shading — a forecaster with a book to sell or a calibration reputation to protect has reasons not to converge even when they should; the difference between me emailing A's number to B in private versus B responding on the record, and whether either is anywhere near the common-knowledge condition; and the case where both people insist the other is just biased. Also, I gather there's a weakened version of the theorem where near-common-knowledge buys you near-agreement instead of exact agreement — if that's right I'd rather build the procedure on that, since exact common knowledge is never what I've got. Tell me straight whether that's the correct move or a dodge.

  Then run it on three disagreements: (a) two well-known forecasters at 65% and 25% on whether a country's inflation drops below its official target by the end of next year, where both have read each other's public writeups; (b) two epidemiologists who seem to be split on whether a rollout will reach protective population-level immunity, except one is reasoning about the trial population and one about everyone including the elderly; and (c) the one that'll annoy me — a piece I've already pitched and my editor liked, framed as two superforecasters facing off, where your procedure says the gap is priors all the way down and there's no horse race to report. For (c) tell me what the piece becomes instead, or whether it shouldn't run.

  And don't hand me a menu. Commit: which of those escape hatches do you think is actually doing most of the work in the disagreements I cover, and should the procedure ever license me to print that one side is wrong? Give reasons. I also want the failure modes — where it will misfire, and in particular how a bad-faith source could use it to launder a just-wrong position as a mere difference in priors.

  Start with your bottom line in the first sentence — what the procedure is and what it will and won't let me say — then the steps and the reasoning. No preamble, and don't restate the question back at me.
reasoning: |-
  Hmm, the user is a journalist covering forecasting and prediction markets who needs a practical decision procedure to handle expert disagreements without resorting to lazy "both sides" reporting. They want a step-by-step method grounded in Aumann's agreement theorem but adapted for real-world constraints: no math beyond arithmetic, one hour max per case, and no implying one expert is outright wrong without editorial approval.

  Key challenges they face include data access disparities, different reference classes, strategic incentives, and definitional mismatches. They specifically mentioned three common scenarios: forecasters disagreeing on inflation, epidemiologists using different population definitions, and a pitched piece where disagreement might be purely prior-based.

  The core insight from Aumann they're leveraging: persistent disagreement requires either (1) non-overlapping information, (2) differing prior assumptions, or (3) failure of common knowledge - otherwise rational agents should converge. The "near-common-knowledge" variant is crucial here since perfect common knowledge is unrealistic.

  For the procedure, I'll design seven concrete steps:
  1. Lock definitions first to prevent talking past each other
  2. Check for asymmetric data access
  3. Map base rate disagreements to reference class differences
  4. Probe for strategic incentives
  5. Simulate belief updating by sharing numbers
  6. Assess convergence after disclosure
  7. Classify residual disagreement

  The inflation case (65% vs 25%) likely reveals prior differences after step 6. The epidemiologists case gets resolved at step 1 as definitional mismatch. The superforecaster piece would get killed or reframed as a case study in how priors drive divergence.

  Strategic shading is probably the most common escape hatch in their beat - experts with books to sell or reputations to protect often resist convergence. The procedure can call this out as "incentive divergence" which is reportable as non-epistemic conflict.

  Critical failure modes: bad actors could weaponize the "priors" label to hide bad reasoning, or exploit the one-hour limit to stall. Safeguards include requiring concrete reference classes for base rates and flagging refusal to update when given counter-evidence.

  Bottom line: This gives them a "disagreement audit" flowchart that either finds resolvable differences or exposes irreducible prior gaps - moving beyond false equivalence while avoiding reckless "wrong" claims.
answer: |-
  ### Bottom Line  
  Your procedure is a **7-step Disagreement Audit** that classifies expert gaps into four bins—**Resolvable Evidence Gap** (report as contest), **Irreducible Prior Gap** (report as philosophical divide), **Definitional Mismatch** (rewrite or kill), or **Incentive Divergence** (report motives, not beliefs)—without declaring anyone "wrong," using a near-common-knowledge standard to force convergence tests.

  ---

  ### The Procedure  
  **Time Budget:** 55 minutes max (5 min/step avg).  
  **Tools:** Email/phone; pen/paper for arithmetic.  

  1. **Lock Definitions**  
     - *Ask both:* "Define the outcome in measurable, binary terms (e.g., 'inflation < 2% on Dec 31'). List all assumptions."  
     - *Sufficient answer:* Identical definitions. If not, clarify until matched.  
     - *Terminate if:* Definitions diverge → **Definitional Mismatch**. Rewrite the question or kill the story.  
     - *Why:* Aumann assumes identical questions. Mismatched definitions create false disagreement.  

  2. **Audit Data Access**  
     - *Ask:* "What data/formulas underpin your number? Is any of this private/unique?"  
     - *Sufficient answer:* Disclosure of data sources and models.  
     - *Terminate if:* One has exclusive data → **Resolvable Evidence Gap**. Report: "New data may resolve this."  
     - *Why:* Asymmetric information breaks common knowledge. Sharing data forces convergence unless priors differ.  

  3. **Check Base Rates**  
     - *Ask:* "What’s your anchor/base rate? What past cases did you compare this to?"  
     - *Sufficient answer:* A reference class (e.g., "past inflation shocks in G7 nations").  
     - *Terminate if:* Different reference classes → **Irreducible Prior Gap**. Report: "Experts disagree on which history applies."  
     - *Why:* Base rates are prior-driven. Rational agents using the same reference class should anchor similarly.  

  4. **Probe Incentives**  
     - *Ask:* "Could your professional stakes (book sales, reputation) affect your stated belief?"  
     - *Sufficient answer:* "No" or transparent admission (e.g., "My model’s for sale, so I’m conservative").  
     - *Terminate if:* Strategic shading suspected → **Incentive Divergence**. Report motives, not the disagreement.  
     - *Why:* Incentives prevent honest updating. Aumann assumes truthful belief reporting.  

  5. **Simulate Near-Common Knowledge**  
     - *Do:* Email A’s number + reasoning to B (off-record). Ask B: "Does this change your view? If so, what’s your new number?" Repeat with A.  
     - *Sufficient answer:* A revised estimate or refusal to budge.  
     - *Terminate if:* Both converge within 10 percentage points → **Resolvable Evidence Gap** (prior gap was illusory).  
     - *Why (near-version):* *Near*-common knowledge (sharing beliefs + reasoning) should cause *near*-agreement. If not, priors or incentives dominate.  

  6. **Test Belief Rigidity**  
     - *Ask:* "If you saw [key evidence the other cited], how much would you adjust your number?"  
     - *Sufficient answer:* "I’d move from X% to Y%" (e.g., "25% → 30%").  
     - *Terminate if:* Stubborn refusal ("I wouldn’t change") → **Incentive Divergence** or **Prior Gap** (escalate to editor).  
     - *Why:* Rational Bayesians update on shared evidence. Refusal implies non-epistemic motives or inflexible priors.  

  7. **Classify Residual Gap**  
     - *If* steps 1-6 show matched definitions/data/incentives but >10% gap after Step 5 → **Irreducible Prior Gap**.  
     - *Report as:* "Fundamental difference in starting assumptions," not an evidence contest.  

  ---

  ### Case Applications  
  **(a) Inflation Forecasters (65% vs 25%)**  
  - Step 1: Definitions match (inflation < target by Dec 31).  
  - Step 2: Both have public data; no exclusivity.  
  - Step 3: Base rates differ (A: post-crisis rebounds; B: stagflation eras). → **Irreducible Prior Gap**. No horse race; report why histories diverge.  

  **(b) Epidemiologists on Herd Immunity**  
  - Step 1: Definitions mismatch (A: immunity in trial cohort; B: whole population including elderly). → **Definitional Mismatch**. Rewrite to clarify: "Will trial-group efficacy hold in ≥65 cohort?"  

  **(c) Superforecaster "Face-Off"**  
  - After audit: Gap survives Step 5 (no convergence). Step 3 reveals incompatible base rates. → **Irreducible Prior Gap**.  
  - *New angle:* Kill the "who’s right" frame. Pitch: "Why Experts See Different Worlds: How Base Rates Split Forecasting."  

  ---

  ### Your Questions Answered  
  **1. Dominant Escape Hatch:** **Incentive Divergence** (Step 4). In prediction markets, experts monetize reputations. Strategic shading is rife—e.g., a forecaster with a book can’t admit error without losing sales. This isn’t a belief gap; it’s performance.  

  **2. Can You Declare Someone Wrong?** Only for **Incentive Divergence** (Step 4/6). If an expert admits strategic shading or refuses updating, your editor can approve: "Source A’s financial stake may explain their rigidity." Never for priors or data gaps.  

  **3. Top Failure Mode:** Bad actors **weaponizing "priors"** to hide poor reasoning. Example: A source cites "different base rates" but uses a cherry-picked, irrelevant reference class (e.g., "I compared inflation to Jurassic extinction rates").  
  - *Safeguard:* Step 3 demands plausibly relevant reference classes. Reject absurd anchors.  

  **4. Near-Common Knowledge: Correct Move, Not a Dodge.** Yes, near-common knowledge forces near-agreement. In practice, sharing numbers/reasoning (Step 5) exposes whether disagreement is resilient or lazy.  

  **5. Why Not Math-Heavy?** The procedure tests the *conditions* for Aumann (common knowledge, rational updating). You’re diagnosing why the theorem *fails* in practice—no need for Bayes’ rule.  

  ---  
  **Final Output:** You’ll publish fewer "dueling experts" pieces. Instead: evidence contests (15%), prior/definition explainers (70%), or incentive exposés (15%).
