  A productivity podcast I half-listen to did an episode on Franklin's moral-perfection project, and the host summed it up like this: 'So he lists thirteen virtues, makes himself a little book with a page for each, and puts a mark down every time he slips. Keeps it up for years. Then he hits the wall with Order — he can't get his papers or his schedule straight — and he tells this story about a guy who pays a smith to grind his whole ax bright and decides in the end that he likes a speckled ax better. That's Franklin's own conclusion: perfection isn't achievable, so the ledger was a waste of time, and he drops the scheme. His friends were already ribbing him about making a ridiculous fuss over morals. What's left is an eighteenth-century habit tracker — a set of willpower rules with no moral content, which is basically what the apps today are selling.'

  I read the Autobiography in college and this doesnt match my memory, but I couldn't point to where exactly. Go through it piece by piece: what someone who knows the text would nod at, what's a fair simplification, and what's actually backwards. In particular, does the ax story play the role he gives it, and does the "waste of time" verdict follow from anything the host got right?

  Tell me how confident you are in each call, and flag the one you'd be least surprised to find you got wrong.
