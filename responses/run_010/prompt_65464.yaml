prompt: |-
  I work on a three-person team that runs an automated bidding agent on an ad exchange — basically a repeated first-price auction, thousands of impressions a day, against competitors whose valuations we cant observe. Last quarter we rewrote the strategy-pruning code, and our senior guy kept saying "never play a dominated strategy" to justify each deletion, and by the end we'd cut our bid grid from about 40 candidates down to 6. I'm auditing an intro game theory course in the evenings and I now think at least a couple of the deletions were dodgy, but every time I try to say so he just repeats the line and I dont have the vocabulary to push back.

  Here's what we actually deleted, so you can tell me which version of the slogan licenses which move. (1) bids that were only weakly dominated — beaten by another candidate against every profile of the opponents' bids, but merely tied against some of them. (2) one bid that wasn't beaten by any single other candidate but was beaten by a 50/50 randomization between two of them. (3) everything dominated in the one-shot game we wrote down on the whiteboard, even though what we're really playing is the same auction over and over against the same handful of opponents, and we know for a fact that some of them react to how aggressively we've been bidding. Related to (3): the pruning code loops until nothing more can be deleted, and when we switched the comparison from strict to weak the number of survivors started depending on the order in which we scanned the grid, which he waved off as a bug in my loop rather than a feature of weak dominance.

  So what are the different precise claims that one sentence could be making? I can already see "dominated" has to be unpacked — strict versus weak, dominated by a pure strategy versus by a mixture, dominated once versus surviving iterated deletion — but I suspect there's more hiding in there, including stuff about what the agent is entitled to assume about the opponents and about whether the payoff matrix we wrote down is even the right object. Lay the readings out as a menu, ordered roughly from the trivially true to the ambitious, and for each one say whether it's actually correct and which of my three deletions it would justify. Where a reading is false or needs extra assumptions, name the assumption exactly: common knowledge of rationality, the ability to genuinely commit to a randomization, payoffs known rather than estimated off logged data with noise in them, the game being one-shot, the opponents not correlating. Then tell me what the honest version of the slogan would be — the one our senior guy could keep repeating without deleting things he shouldn't.

  Two more things. Don't be diplomatic: if one of those deletions is just a mistake given the setting, say so and say why, and if the order-dependence in my loop is telling us something real about weak dominance rather than being a bug, say that too. And flag your confidence as you go — for each reading on the menu, say how sure you are that it's a reading people actually mean rather than one you've constructed for completeness, and finish by naming the single claim in your whole answer that you're least confident about and what would settle it.
