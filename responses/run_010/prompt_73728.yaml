answer: |-
  Here is your prep sheet, structured to anticipate and neutralize high-damage objections. The objections are ordered by potential damage (high to medium), phrased in subgroup-specific language, with replies and vulnerabilities noted. Strategic advice follows.

  ---

  ### **High-Damage Objections**  
  *(Phrased as spoken by subgroups)*  

  1. **Formal Theorist (Equilibrium Scope):**  
     *"You’re treating the swing voter’s curse as a dominance argument, but Feddersen-Pesendorfer is about equilibrium refinement in games with private signals. Your Step 4 assumes uninformed voters *always* degrade welfare, but in equilibrium, they abstain endogenously. If altruism raises turnout costs for the uninformed, isn’t that just reinforcing the FP equilibrium rather than ‘aggravating’ the curse?"*  
     - **Reply:** "The curse’s welfare degradation holds *conditional on voting*. Altruism lowers the cost threshold for informed voters to turn out but *raises* it for the uninformed by attaching larger stakes to their noisier votes. This exacerbates the *net harm* when uninformed voters defect from equilibrium abstention—which real turnout data shows they do."  
     - **Soft Spot:** If pressed, concedes the model assumes *some* uninformed voters violate equilibrium.  
     - **Scope/Revision:** Neutralize by restricting to "off-equilibrium" behavior; no thesis revision.  

  2. **Empiricist (Measurement Validity):**  
     *"Your ‘knowledgeable/uninformed’ binary collapses a continuum. Real voters have *partial* information correlated with partisanship, SES, and mobilization. If I regress turnout on knowledge and controls, the curse’s predicted gap vanishes—because low-knowledge voters are *strategically mobilized* by groups who internalize their collective welfare. Doesn’t this endogenize your ‘curse’ away?"*  
     - **Reply:** "Mobilization targets the *partisan*, not the *uniformed*. A low-knowledge partisan still votes expressively or habitually, but if they lack signal-interpretation capacity (e.g., understanding policy tradeoffs), their ballot remains curse-prone. My point is that altruism *should* make such voters *more* reluctant, yet gaps are small."  
     - **Soft Spot:** If evidence shows low-knowledge partisans vote *as reliably* as high-knowledge, concedes mobilization may dilute the curse.  
     - **Scope/Revision:** Restrict to "non-partisan uninformed" voters; no revision.  

  3. **Normative Theorist (Epistocratic Slippage):**  
     *"By framing voting’s value solely through instrumental truth-tracking, you’re smuggling in epistocracy. If a voter’s ‘social benefit’ includes affirming their dignity or resisting oppression, doesn’t your model dismiss those voters as ‘wrong people’—replicating the exclusion it critiques?"*  
     - **Reply:** "I target *only* the instrumental claim that altruism solves turnout puzzles. Non-instrumental values (dignity, protest) operate outside the pB-C calculus. But if we *are* justifying turnout instrumentally—as the altruistic model does—we must confront its perverse selectivity."  
     - **Soft Spot:** If asked "Should the uninformed abstain?", must clarify this is *positive* analysis.  
     - **Scope/Revision:** Neutralize by disclaiming normative prescriptions; thesis intact.  

  4. **Formal Theorist (Sign Ambiguity):**  
     *"Your Step 4 assumes the uninformed voter’s expected contribution is negative. But in Feddersen–Morris (2001), with continuous signals, even noisy voters nudge outcomes toward the mean. Isn’t your ‘worse than coin flip’ relying on a binary signal assumption that’s unrealistic?"*  
     - **Reply:** "Under binary signals and common values, the curse is robust (FP, 1996). With continuous signals, the degradation is probabilistic but persists if signal precision differs across groups. Altruism scales the *magnitude* of error—so low-precision voters still risk net harm."  
     - **Soft Spot:** If Poisson games with heterogeneous precision are cited, concedes the sign *can* flip but is negative on average.  
     - **Scope/Revision:** Restrict to binary elections; no revision.  

  ---

  ### **Medium-Damage Objections**  
  5. **Empiricist (Turnout Gap Underestimation):**  
     *"You say the knowledge-turnout gap is ‘narrow,’ but ANES shows 40+ point gaps between high/low knowledge voters in midterms. If we weight by *quality* of choice (e.g., down-ballot consistency), the gap widens. Doesn’t this align *better* with the curse than you claim?"*  
     - **Reply:** "The gap exists but is smaller than the curse predicts *given altruistic motives*. If altruists internalize welfare, low-knowledge voters should abstain at *higher* rates than self-interested ones—yet gaps resemble those in non-altruistic models."  
     - **Soft Spot:** If altruism’s correlation with knowledge is questioned, concedes identification challenges.  

  6. **Methodologist (Model External Validity):**  
     *"Your critique assumes elections are common-value truth-tracking games. But if voters have conflicting preferences or expressivist goals, pivot probabilities are irrelevant. Why should we care about a paradox that evaporates under standard behavioral assumptions?"*  
     - **Reply:** "Because the *literature I’m engaging* (Edlin et al.) uses this framework to rescue turnout. If we abandon instrumentalism, their solution collapses—but so does Downs’ paradox. My point is that *within their own terms*, the repair fails."  
     - **Soft Spot:** If accused of "attacking a strawman," must cite Edlin/Gelman’s explicit common-welfare framing.  

  7. **Formal Theorist (Costless Voting Redux):**  
     *"In Myatt (2012), with costless voting and endogenous information, equilibrium has *all* voting if signals are free. Doesn’t this negate Step 3? If voting is costless, why would altruists abstain?"*  
     - **Reply:** "Costless voting eliminates Downs but not the curse. Feddersen-Pesendorfer (1999) shows abstention persists with costless voting *if* signals are costly. Altruism *increases* the incentive to acquire signals, but voters who remain uninformed still degrade outcomes."  
     - **Soft Spot:** If signals are free/cheap, concedes the curse weakens.  

  8. **Empiricist/Normative (Education vs. Abstention):**  
     *"If altruistic voters ‘should’ abstain when uninformed, doesn’t that incentivize *learning*? Your model treats knowledge as fixed, but in reality, campaigns, parties, and civic groups exist to inform. Isn’t your ‘puzzle’ just an argument for voter education?"*  
     - **Reply:** "Yes—but altruism alone doesn’t achieve this. Self-interested voters ignore low-p events; altruists face high stakes but may lack capacity/salience to learn. Turnout patterns suggest we’re not getting sufficient equilibrium adjustment."  
     - **Soft Spot:** If given evidence of information elasticity, concedes dynamics matter.  

  ---

  ### **Strategic Defenses**  
  **Three Upfront Concessions (Blunt Hard Objections):**  
  1. "This model assumes *common-value* elections. I’m not claiming it applies to all contests—only to those where the altruistic justification is invoked."  
  2. "I treat knowledge as exogenous for clarity, but endogenous learning could attenuate the curse."  
  3. "The swing voter’s curse is an equilibrium result. My point is about *off-equilibrium* behavior: when uninformed voters *do* turnout, altruism magnifies their potential harm."  

  **The Must-Land Reply (Avoids Confusion):**  
  *"The altruistic fix rescales B, not p. But if your vote is more likely to *harm* the common good when pivotal (per the curse), multiplying B by N makes the expected harm *larger*. This doesn’t solve the curse—it compounds it."*  

  **Weakest Point (Preemptively Defend):**  
  *The knowledge-abstention link.* Build:  
  - Cite Bartels (1996) on how low-knowledge voters use heuristics that *correlate* with truth-tracking failure.  
  - Stress that "uninformed" means *unable to interpret signals* (e.g., policy ignorance), not just unaware.  

  **The Dreaded Question:**  
  *"If your argument holds, should we discourage uninformed citizens from voting? And if not, why is this more than a theoretical curiosity?"*  
  - **Reply:** "This is positive, not normative. I’m showing a contradiction in how we *justify* turnout. If we want high participation, we need better tools than altruism—like deliberation or education—to align turnout with competence."  
  - **Fallback:** "Democracy’s value isn’t just epistemic. But if we *appeal* to epistemic gains to explain turnout, we must confront this."  

  ---

  **Tactical Note:** Anchor Q&A with: *"Remember, I’m not saying altruists shouldn’t vote. I’m saying altruism *alone* doesn’t resolve why the *less competent* vote at high rates."* This preempts normative hijacking.
