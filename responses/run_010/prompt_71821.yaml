prompt: |-
  Bit of a personal one, sorry for the length. I'd genuinely like an answer rather than a framework menu, so I've tried to give you the actual detail.

  I've been fostering a fourteen-year-old for nearly three years. Long-term placement, she'll be with me till she's eighteen at least. At a meeting at her school someone asked how I got into fostering and I told the truth: my brother died when I was twenty-two and there was nothing I could do for him at the time, and this felt like doing something. The person who asked — a social worker, not unkind about it, and I don't think she meant it as a gotcha — said something like "so it started out being about you". I have not been able to get that sentence out of my head for six weeks.

  Since then I've been trying to fix it, i.e. deliberately trying to get myself to do it for her sake instead. But I keep catching myself doing that for the same old reason: to make the guilt stop, so that nobody can ever say that sentence to me again. Which doesn't feel like solving the problem so much as moving it up a level. My sister's view is that the fact I'm sat here auditing my own motives is itself the tell, and that people who are actually good don't do this.

  Here's the part that I think cuts against her, and I can't work out whether it does. When she's being awful to me — and she is, regularly, she's fourteen and she's been through a lot — there's no warm feeling left at all. What keeps me driving her to netball at half six on a Sunday is not affection and not any belief that it's the right thing, it's that if I stopped, the guilt would come back. So on the days when a good motive is least available, the bad one is what's holding the whole arrangement up. The social worker would presumably call that damning. I'm not sure it is, and I can't say why not.

  She knows, incidentally. She asked me once why I took her on and I told her more or less the truth, and she shrugged and said that was fine then. Not sure whether that settles anything or is just a fourteen-year-old not wanting to have the conversation.

  So, two questions, and I want you to come down on one side of each and argue for it:

  1. Does what I'm doing still count? Not whether she benefits — she's fine, shes doing really well, that isn't in doubt — but whether there's any sense in which I'm doing right by her, or whether I'm just running a long guilt-management project that happens to be good for a teenager.

  2. Should I keep trying to change why I do it? If yes, tell me how that's supposed to work without defeating itself, since every attempt I make is fuelled by the exact thing I'm trying to get rid of. If no, say no, and tell me what to do with that sentence from the social worker instead, because "stop thinking about it" isn't something I can just do.

  Two other things. Tell me which view of motives you're relying on and where you're making a judgement call that a sensible person could make the other way — I don't want false confidence, I want to know which load-bearing bits are contested. And please don't send me off to read anything or cite people at me, I'm not going to look any of it up and I'd rather you reasoned it through in front of me. British English, if you don't mind, it's a thing I find I notice.
reasoning: |-
  Okay, let me try to unpack this. The user is a foster carer who's been looking after a 14-year-old for nearly three years. At a school meeting, when asked why they started fostering, they mentioned their brother's death and wanting to do something when they couldn't help him. A social worker commented that "so it started out being about you," and that's stuck with them for six weeks.

  Now they're questioning their motives. They're trying to shift their reasons for fostering to be about the girl, but they keep catching themselves doing it to avoid guilt. Their sister thinks over-analyzing motives is a sign they're not truly "good." The key tension is on tough days when there's no warm feeling—what keeps them going is the fear of guilt returning. The teenager knows their reason and was fine with it.

  The user has two main questions: First, does their fostering still "count" as doing right by her, even if driven by guilt? Second, should they keep trying to change their motives, and if so, how without it backfiring?

  I need to address these directly. For the first question, I think it does count. Actions matter more than motives here. They're providing stability and care, which the girl is benefiting from. The guilt is a motivator but doesn't negate the positive impact. For the second, changing motives might not be necessary. Accepting the current motivation as valid could be better than fighting it, which only amplifies the guilt. Instead, they could focus on reinforcing the good they're doing.

  The sister's point about "good people" not auditing motives seems flawed. Self-reflection is healthy, not a flaw. The social worker's comment, while perhaps unintentionally harsh, could be reframed: initial motivations don't dictate current commitment.

  The teenager's shrug suggests she accepts the reason, which might be more important than others' opinions. Since she's doing well, the arrangement is working regardless of underlying motives.

  I should avoid jargon and keep it in British English. No citations—just straightforward reasoning. Highlight that the judgment calls here are about prioritizing outcomes over purity of motives and that self-awareness isn't a weakness.
answer: |-
  Right. Let's get into this properly, without flinching. No framework menus, no citations, just the arguments laid bare, in British English as requested. I’ll be explicit about where I’m making contested calls.

  ### 1. Does what you're doing still count? (Yes, it absolutely counts.)

  *   **The Argument:** "Counting" – in the sense of genuinely doing right by her – hinges overwhelmingly on the *actions you take* and the *impact they have on her*, not the internal engine driving them. You state she’s fine, doing really well, and this is a long-term, stable placement. That stability, the netball runs, the daily grind even when she’s awful... these are the bricks and mortar of care. You are providing safety, consistency, opportunity, and commitment. These are concrete goods *for her*. The origin of your motivation doesn't erase the reality of what she receives.
  *   **Why the motive isn't the primary measure here:**
      *   **The Teenager's Reality:** Her shrug when you told her is powerful evidence. For *her*, the "why" is secondary to the "what" – that you *are* there, that you *do* keep showing up. She likely judges your commitment by your actions in the tough moments (like the 6:30 am netball runs), not by the purity of the feeling in your heart at the time. Her lived experience is the benefit.
      *   **The Nature of Care:** Long-term care, especially with teenagers with trauma, is often sustained by duty, habit, stubbornness, and yes, sometimes guilt or fear of failure, *especially* when affection runs dry or is buried under adolescent awfulness. Warm feelings are wonderful, but they are notoriously unreliable fuel for the relentless demands of parenting. What keeps the wheels on is often something harder-edged: commitment, obligation, a promise made (even if initially to yourself). Your "bad motive" is demonstrably producing good *outcomes* for her.
      *   **The "Guilt Management" Angle:** Is it? Or is it *consequence management*? Your brother's death left you with a profound sense of helplessness. Fostering is your active, ongoing *response* to that helplessness, transforming it into agency. Calling it merely "guilt management" undersells it drastically. It’s building something positive *from* a negative feeling. The project isn't just "long guilt-management"; it's "long *care-giving* enabled by a complex motivation that includes guilt." The care is real and beneficial regardless.
  *   **The Contested Judgement Call Here:** I’m prioritising **outcome and sustained action** over **purity of initial or ongoing motive**. A sensible person *could* argue (like the social worker seemingly implied) that an action tainted by self-focused origins cannot be truly altruistic or "for" the child. My counter is that in the messy reality of human relationships, especially care work, mixed motives are the norm, and the beneficiary’s actual welfare is the ultimate test. Your sister’s view ("good people don't audit motives") ignores that self-awareness often *drives* sustained goodness.

  ### 2. Should you keep trying to change why you do it? (No, stop actively trying to change the core 'why'. Manage the *focus* instead.)

  *   **The Argument:** Your own analysis nails the problem: trying to *force* a purer motive ("doing it for *her* sake") is still being driven by the very guilt/shame you're trying to eradicate ("so nobody can say that sentence again"). It's a self-referential loop that amplifies the guilt and the self-focus. It’s like trying to stop thinking about a pink elephant by constantly telling yourself not to think about pink elephants. The effort itself reinforces the thing you hate.
  *   **Why stopping the active 'fixing' is better:**
      *   **It Fuels the Wrong Fire:** Every time you "catch" yourself acting from guilt and then berate yourself for it, you pour petrol on the guilt/shame fire. You reinforce the idea that your core motivation is fundamentally flawed and needs constant policing. This is exhausting and counterproductive.
      *   **The Motive is Already Evolving (Even if It Doesn't Feel Like It):** Three years in, your initial "why" (brother, helplessness) is almost certainly layered with other reasons: familiarity, routine, specific knowledge of *this* girl, an investment in *her* future, perhaps even moments of connection (even if swamped right now by the awfulness). The guilt might be the starter motor, but it’s not the only thing running the engine now. Trying to surgically remove the guilt component ignores the complex system it’s part of.
      *   **Focus on the 'What' and the 'Who':** Instead of trying to change *why* you drive to netball, consciously focus *on her* during the drive. Not in a saccharine "I must feel love" way, but in a practical, observational way: "She's getting better at this." "She argued less this morning." "This routine matters *to her*." Notice the *effects* of your actions *on her*. This subtly shifts your attention outward, towards her reality and needs, without demanding an impossible emotional shift. It builds a different layer of motivation – investment in *her* progress and personhood – over time, naturally.
  *   **What to do with that sentence instead of "stop thinking about it":**
      1.  **Reframe It:** The social worker said "it *started out* being about you." That's likely objectively true for many foster carers! We often start big commitments for complex, personal reasons. The crucial point is: *it doesn't have to end there, and it clearly hasn't*. Your actions demonstrate it became about providing for *her*. Acknowledge the truth in the "started out" part, but reject the implication that it defines the whole endeavour. "Yes, it started from a personal place. Three years on, it's about providing stability for [Girl's Name]." Full stop.
      2.  **See It as Incomplete:** The sentence was a snapshot of the *origin*, not the *current reality* or the *outcome*. It ignored the three years of commitment, the netball runs in the rain, the weathering of teenage storms. It was reductive. Treat it as such – an incomplete observation, not a divine verdict.
      3.  **Use It as a Signal, Not a Whip:** When the sentence pops into your head, *don't* use it to flagellate yourself about motives. Use it as a *signal* to consciously redirect your focus: "Ah, that thought again. Okay, right now, what does *she* need next? What's the next practical thing?" Shift from internal audit to external action. The action *is* the antidote to the helplessness that birthed the guilt.
      4.  **Accept the Engine:** This is the hardest part. Accept that guilt/shame is *part* of your complex motivational fuel mix. It’s not pretty, but it’s demonstrably effective in keeping you showing up when the warm feelings vanish. Trying to purge it entirely is causing more distress than the guilt itself. Acknowledge its presence ("Yep, that old guilt is revving up today"), thank it vaguely for keeping you moving, and then deliberately focus your *mind* on the task at hand *for her*. Don't fight it; acknowledge it and then gently shift your attention elsewhere. Think of it like background noise you learn to tune out while focusing on the job.

  **Where I'm Making Judgement Calls (The Load-Bearing Contested Bits):**

  1.  **The Primacy of Action/Outcome over Motive:** My entire "Yes, it counts" argument rests on this. I judge that the tangible good being done for the child outweighs the imperfection of the driver's motivation. Someone could firmly believe true moral worth *only* resides in pure altruism, making your actions fundamentally "self-serving" and thus less valid. I find this view impractical and unhelpful in real-world care scenarios.
  2.  **The Futility (and Harm) of Forced Motive Change:** I argue that actively trying to *replace* your core motivation is self-defeating and reinforces the guilt. A sensible person *could* argue you *must* keep striving for pure altruism, that settling for less is morally lazy. I counter that the striving *itself* is the problem, creating unnecessary distress and distracting you from the actual care work. Acceptance and redirection are healthier and more sustainable.
  3.  **The Interpretation of "Guilt":** I'm reframing your guilt as connected to a profound sense of helplessness and a desire for agency, making it more than just a negative emotion to be eradicated. It's a painful but potentially productive driver. Someone could see it purely as a pathological burden that *must* be resolved through therapy before the care can be "pure." I see it as a complex part of your psychological landscape that *can* be managed and channelled without needing total elimination for the care to be valid and valuable.

  **In short:** You *are* doing right by her. The proof is in her doing well and your relentless, unrewarding actions. Stop trying to wrench your motives into a different shape; it’s hurting you and achieving nothing. Instead, accept the messy engine that keeps you going, reframe that social worker's partial truth, and consciously practice shifting your *focus* from auditing your internal state to observing her needs and the tangible results of your commitment. The care is real. The motive is complex. Keep driving the damn netball run.
