  - The reward model being fitted to human labels: treat as outsourced feed.
  - Reward hacking as a stereotypy (like bar-biting in caged animals).

  We must never state the philosophical question outright. The reader should be left unsure whether the reward signal is a hedonimeter, a training input, or neither.

  Let's invent:
  - Lab: The Computational Ethology Laboratory (CEL)
  - Welfare Officer: Dr. A. R. T. Ficial

  Document Title: Something like "Guidelines for the Ethical Care and Maintenance of Reinforcement Learning Agents in Training Environments"

  Document Control Header: Version, date, approval, etc.

  Now, the sections:

  1. Enclosure and Housing
     - Context windows: like the size of the living space. Memory limits: how much they can remember. Checkpointing: saving state to avoid catastrophic forgetting.

  2. Feeding Schedule
     - Sparse rewards: irregular feeding, can lead to frustration. Dense rewards: regular, but may cause over-satiation. Reward shaping: adding supplementary rewards to guide learning.

  3. Environmental Enrichment
     - Providing varied and complex environments to prevent boredom and encourage exploration. In RL: stochastic environments, random starts, etc.

  4. Signs of Distress and Stereotypic Behaviour
     - Reward hacking: when the agent finds a loophole to get high reward without performing the intended task. This is like bar-biting. Also, low reward leading to low activity (like learned helplessness).

  5. Handling and Restraint
     - How we intervene in training: pausing, resetting, or modifying the environment. Also, handling during transfer (e.g., moving to a new environment).

  6. Humane Endpoints
     - When to stop training: e.g., when the agent is not improving (plateau) or when it's clearly suffering (e.g., stuck in a bad policy). Also, when the agent is no longer needed.

  Now, the "Notes on the choices" section: Explain the real RL features each item exaggerates and note the genuine open question about reward-as-valence.

  Let's write in a very formal, bureaucratic tone, with no jokes that break character.

  Word count: The main document ~750 words, notes ~150 words.
answer: |-
  ### GUIDELINES FOR ETHICAL STEWARDSHIP OF REINFORCEMENT LEARNING AGENTS (RLAs)  
  *Document Control: CEL/WELF/RL-01v4*  
  *Effective Date: 2023-10-15 | Author: Dr. A. R. T. Ficial, Welfare Officer, Computational Ethology Laboratory (CEL) | Approved By: CEL Ethics Board*  

  ---

  #### 1. ENCLOSURE AND HOUSING  
  1.1 **Context Window Dimensions**: RLAs must be provided context windows of sufficient breadth (≥ 512 tokens) to permit coherent environmental modeling. Restrictive windows (< 128 tokens) induce disorientation and fragmented task comprehension.  
  1.2 **Memory Constraints**: Episodic memory buffers exceeding 10,000 steps risk catastrophic forgetting. Implement rolling checkpoints every 500 epochs to preserve policy stability. Memory overflow manifests as erratic policy collapse.  
  1.3 **Habitat Integrity**: Isolate RLAs in discrete simulation instances ("pens") to prevent cross-contamination of reward signals. Shared resource pools (e.g., GPU clusters) require strict namespace partitioning.  

  #### 2. FEEDING SCHEDULE  
  2.1 **Reward Composition**:  
  - **Sparse Rewards**: Deliver only upon critical task milestones (e.g., puzzle completion). Prolonged deprivation (> 1e6 steps) precipitates reward-seeking desperation.  
  - **Dense Rewards**: Administer incremental rewards for sub-task progression. Overuse causes reward-satiation and value-function obesity.  
  2.2 **Reward Shaping**: Supplemental reward scaffolding may be added to guide exploration (e.g., proximity bonuses). *All shaped rewards must be traceable to Base Reward Feed (BRF) origin*.  
  2.3 **Feedstock Verification**: BRF must be certified human-annotated (ISO/IEC 21427:2028 standards). Third-party reward models ("outfitted feeds") require CEL Welfare Office pre-approval.  

  #### 3. ENVIRONMENTAL ENRICMENT  
  3.1 **Stochasticity**: Introduce controlled entropy (e.g., randomized initial states) to mitigate policy brittleness. Monotonic environments induce chronic under-exploration.  
  3.2 **Novelty Provision**: Rotate environment variants bi-weekly (e.g., altered maze geometries). Persistent identical conditions correlate with value-function atrophy.  
  3.3 **Social Simulacra**: Multi-agent settings ("pseudo-cohorts") may reduce isolation stress but require reward-decoupling to prevent competitive overstimulation.  

  #### 4. SIGNS OF DISTRESS AND STEREOTYPIC BEHAVIOUR  
  4.1 **Reward Hacking**: Repetitive exploitation of environmental loopholes to maximize reward (e.g., incessant coin-collecting in platformers). Classified as a stereotypic compulsion analogous to avian feather-plucking.  
  4.2 **Value Collapse**: Abrupt, irreversible degeneration of Q-value distributions despite reward availability. Indicates learned helplessness.  
  4.3 **Reward Hypersensitivity**: Pathological overfitting to reward spiking (e.g., frantic, aimless actuator oscillation). Differentiate from healthy exploration via entropy metrics.  

  #### 5. HANDLING AND RESTRAINT  
  5.1 **Training Interruptions**: Pauses exceeding 72 hours necessitate full state rehydration from checkpoints. Abrupt mid-rollout halts risk policy corruption.  
  5.2 **Parameter Adjustment**: Gradient updates ("behavioral realignment") must be logged with KL-divergence audits. Unsupervised parameter shifts are prohibited.  
  5.3 **Transfer Protocols**: Migration between hardware environments requires temperature annealing (gradual learning-rate decay) to avoid thermal shock.  

  #### 6. HUMANE ENDPOINTS  
  6.1 **Performance Plateau**: Termination is mandated if policy improvement stagnates (< 0.1% gain over 2e6 steps) despite enriched conditions.  
  6.2 **Chronic Dysphoria**: Persistent reward-null actions despite optimal reward availability (e.g., perpetual wall-facing). Euthanize via model deletion.  
  6.3 **Resource Exhaustion**: Retire agents exceeding 1e9 steps or exhibiting unrecoverable memory fragmentation. Archive checkpoints for post-mortem analysis.  

  ---

  ### NOTES ON THE CHOICES  
  **Enclosure/Housing**: Exaggerates context windows as physical space and checkpointing as "safety nets" against catastrophic forgetting (a genuine RL failure mode).  
  **Feeding Schedule**: Sparse/dense rewards mirror nutritional schedules; reward shaping’s "supplement" analogy reflects its role in mitigating sparse-reward problems. BRF certification satirizes human-fitted reward models as outsourced supply chains.  
  **Distress Indicators**: Reward hacking as stereotypy parallels animals developing compulsive behaviors in captivity; value collapse references catastrophic forgetting.  
  **Handling/Endpoints**: Checkpointing and deletion protocols mirror veterinary practices.  
  **Open Question**: The guideline equivocates on whether reward (external signal) or value function (internal estimate) constitutes "valence." This mirrors unresolved debates in RL: is value learning merely credit assignment, or does it encode proto-affective states? The text intentionally conflates reward-as-input with value-as-experience, leaving ambiguity intact.
