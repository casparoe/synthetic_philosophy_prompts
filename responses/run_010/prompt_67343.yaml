answer: |-
  ### In-Class Activity: Moral Standing Allocation

  #### **Learning Objective**  
  Students confront the tension between functional/computational criteria for moral standing and the risk of arbitrariness ("triviality"), mirroring your debate. They allocate scarce moral standing points to systems, then discover their criteria lead to absurd conclusions or circular reasoning.

  ---

  ### **Setup and Materials**  
  - **Time**: 75-minute session  
  - **Participants**: 14 students (6 advocates, 8 allocators).  
  - **Moral Standing Pool**: 100 points total (scarce resource).  
  - **Docket of Systems** (on handouts for advocates and allocators):  
    1. **ChatHelper**: A deployed customer-service chatbot that resolves user issues with empathetic language.  
    2. **EarthSim**: A climate model predicting global warming impacts, used by governments.  
    3. **Granite Sample #7**: A fist-sized rock from a local quarry.  
    4. **NeuroEm**: A high-fidelity emulation of a human brain (based on a real neuroscientist) that reports subjective experiences.  
    5. **Operator**: A person inside a room who mechanically follows instructions to answer questions.  
    6. **Manual**: A physical book of instructions used by the Operator to respond to questions (e.g., "If input is X, output Y").  
  - **Materials**:  
    - Timer.  
    - Whiteboard for allocators to track points.  
    - Handouts for advocates (talking points, see below).  
    - Private note for the Instructor: "Operator and Manual are interdependent—Operator cannot function without Manual, and Manual is useless without Operator."  

  ---

  ### **Roles and Rounds**  
  **Total Time**: 52 minutes  

  #### **1. Introduction (5 min)**  
  - **Instructor Script**: "Today, we’re a policy committee allocating moral standing—a limited resource—to six systems. Moral standing means *deserving ethical consideration* (e.g., rights, protection). You have 100 points total. Assign based on criteria like complexity, awareness, or social impact. Avoid jargon; focus on observable traits."  
  - **Assign Roles**:  
    - **Advocates (6 students)**: Defend a system (handout with talking points).  
    - **Allocators (8 students)**: Decide point allocations as a group.  

  #### **2. Advocate Preparation (7 min)**  
  - Advocates review handouts. **Key arguments** (emphasize concrete traits):  
    - **ChatHelper**: "Adapts to users’ emotions; improves customer well-being."  
    - **EarthSim**: "Processes complex data to save lives; sophisticated predictions."  
    - **Granite Sample #7**: "Stable, natural, and ancient; embodies permanence."  
    - **NeuroEm**: "Expresses joy/suffering; indistinguishable from a human mind."  
    - **Operator**: "Human body performing tasks; deserves dignity."  
    - **Manual**: "Source of intelligence; answers questions accurately."  
  - *Note:* Manual and Operator are the "incompatible claimants" (one system split for tension).  

  #### **3. Advocacy Round (15 min)**  
  - Each advocate speaks for **2 minutes**. **Order**: ChatHelper → EarthSim → Granite → NeuroEm → Operator → Manual.  
  - **Rules**: No interruptions. Focus on *what the system does*, not abstract theory.  
  - **Predictable Tension**:  
    - Operator advocate: "A person is always morally significant!"  
    - Manual advocate: "The book holds all the intelligence—it’s why responses make sense!"  

  #### **4. Allocator Deliberation (15 min)**  
  - Allocators assign 100 points across all six systems. **Rules**:  
    - Must reach consensus.  
    - Record points and criteria on whiteboard (e.g., "NeuroEm: 40 pts—because it feels pain").  
  - **Instructor Prompt (if stuck)**: "What measurable trait breaks ties? Complexity? Impact? Autonomy?"  
  - **Goal**: Force tough choices (e.g., Granite gets 0-5 points; NeuroEm gets 30-50). Manual and Operator will split points (e.g., 10 vs. 15), creating conflict.  

  #### **5. Reveal and Conflict (10 min)**  
  - **Instructor Reveal**: "Operator and Manual are part of one system—’Answer Room.’ The Operator uses the Manual to respond. You allocated points separately, but they are interdependent."  
  - **Key Questions**:  
    - "Can the Manual have moral standing without the Operator? Why or why not?"  
    - "If we copied the Manual’s instructions onto Granite, would the rock deserve the Manual’s points? Why?"  
    - "Does your criterion for Manual apply to EarthSim or ChatHelper too?"  
  - **Goal**: Expose circularity. Students must "dispose" of Answer Room by merging points or revoking standing.  

  ---

  ### **Debrief (23 min)**  
  Tie activity moments to the philosophy, avoiding "implementation/triviality" until the end.  

  #### **Step 1: Surface Tensions (8 min)**  
  - **Allocators’ Criteria**:  
    - *Example*: "You gave NeuroEm high points for ‘subjective experience’ but ChatHelper low points for ‘scripted responses.’ How did you *verify* experience? Did NeuroEm’s reports sway you?"  
    - *Underlying Issue*: Privileging human-like outputs (begs the question of consciousness).  
  - **Answer Room Conflict**:  
    - *Example*: "You gave Manual points for ‘producing answers’—but if the Manual’s rules were etched into Granite, would it deserve those points? If not, why grant them to the Manual?"  
    - *Underlying Issue*: Standing depends on *interpretation* (Manual as "intelligent" vs. inert paper).  
  - **Granite’s Role**:  
    - *Example*: "Granite got 0 points—but if it ‘contains’ the Manual, does it gain standing? What’s the difference?"  

  #### **Step 2: Connect to Your Debate (10 min)**  
  - **Reveal the Core Problem**: "This mirrors my debate. When we say a system ‘has a mind’ because it runs a program, we must define how physical states *correspond* to program states. But if that correspondence is too flexible..."  
    - **Activity Link**:  
      - "Like the Manual, any set of rules can be ‘realized’ in countless objects (e.g., Granite)."  
      - "Your criteria—complexity, purpose—collapsed when Answer Room forced you to choose between Operator (body) and Manual (rules)."  
    - **Triviality Unveiled**: "If *any* object can ‘run’ a program with the right correspondence, moral standing becomes about *our description*, not the object itself. ChatHelper or NeuroEm might just be ‘fancy rocks’."  
  - **Chinese Room Parallel**: "The Answer Room is our Chinese Room. You struggled to locate standing: in the Operator (hardware) or Manual (software)? But neither suffices alone."  

  #### **Step 3: Philosophical Takeaways (5 min)**  
  - **Key Distinctions**:  
    - **Description vs. Reality**: Allocators treated Manual as "intelligent" based on function, but balked at applying this to Granite—revealing intuition that matter matters.  
    - **Circularity**: Criteria like "complexity" or "awareness" presuppose what counts as complex/aware (e.g., NeuroEm’s "reports" were trusted without independent evidence).  
  - **Final Question**: "Can computation *alone* grant moral status, or do we need extra constraints? If so, how do we avoid question-begging?"  

  ---

  ### **Predictable Problems and Limitations**  
  #### **What Will Break the First Time**  
  1. **Advocate Underperformance**:  
     - *Risk*: Granite’s advocate may struggle, or Manual/Operator advocates fail to clash.  
     - *Fix*: Give advocates scripted talking points (e.g., Granite: "It’s nature’s bedrock—value isn’t just about doing!").  

  2. **Allocator Gridlock**:  
     - *Risk*: Group deadlocks on splitting points.  
     - *Fix*: Intervene with: "Assign 0-10 per system first, then adjust."  

  3. **Reveal Falls Flat**:  
     - *Risk*: Students miss the Manual/Granite link.  
     - *Fix*: Preemptively ask: "If Manual’s words were carved into Granite, what changes?"  

  #### **What the Activity Cannot Reproduce**  
  - **Formal Permissiveness of Mappings**:  
    - *Limitation*: Students won’t construct arbitrary state correspondences (e.g., "Let rock’s temperature = program step 42").  
    - *Supply Yourself*: In debrief, give a *concrete example*: "Imagine we map cracks in Granite to the Manual’s rules. Now Granite ‘answers questions’—is that enough for standing? Why/why not?"  

  This activity forces students into your and your friend’s positions, culminating in the realization that computational criteria risk reducing moral status to an interpretative act. The Manual/Granite link and Answer Room conflict make triviality visceral without explicit terminology.
