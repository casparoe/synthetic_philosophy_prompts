answer: |-
  ### Decision Tree for Fairness Principles in Budget Negotiations  
  **Example Scenario:** Two parties negotiating a £900k pot. Walk-away values: **A** = £200k, **B** = £100k. Gains (surplus) = £600k.  
  **Tree Goal:** Identify which fairness principle matches your intuition ("that split feels about right").  
  **Rules:**  
  - Start from the baseline: Any deal must exceed walk-away values (A ≥ £200k, B ≥ £100k).  
  - Answer questions **only** about the £900k example.  
  - No peeking at principle names until you reach a leaf.  

  ---

  ### The Decision Tree  
  #### Start: The split must give both parties at least their walk-away values.  

  1. **In this £900k case, what seems fair for gains (amount above walk-away)?**  
     - **Both gain equally**: Gains are £300k each → A gets £500k, B gets £400k.  
       *Go to Q2.*  
     - **Maximize total gains**: Gains total £600k (already fixed), so any split works.  
       *Go to Q5.*  
     - **Favor the party with less walk-away power?** → B gained more (£300k) than their "skin in the game" (£100k) suggests.  
       *Go to Q6.*  

  2. **Suppose the pot grows to £1,000k, but only because A’s *max possible gain* increases (B’s walk-away still £100k; A’s still £200k). Should B’s gain change?**  
     - **Yes, B’s gain should rise**: Gains become £350k each → A gets £550k, B gets £450k.  
       *Go to Q3.*  
     - **No, B’s gain stays £300k**: A gets £600k, B gets £400k.  
       *Go to Q4.*  

  3. **Can parties use lotteries?** (e.g., 50% chance of £550k for A/£450k for B, 50% chance of £500k for A/£500k for B).  
     - **Yes, random splits allowed**: → **Kalai-Smorodinsky (KS)**.  
     - **No, only deterministic splits**: → **Nash**.  

  4. **Are walk-away values fixed, or can threats inflate them?**  
     - **Fixed**: Disagreement point is neutral → **Egalitarian (equal gains)**.  
     - **Threats matter**: Walk-away values are strategic choices → **Leximin** (protects weaker party if threats are exploitative).  

  5. **Which matters more: total gains (£600k) or avoiding waste?**  
     - **Total gains matter most** (even if unequal): → **Utilitarian (maximize-the-sum)**.  
     - **Avoid waste**: Entire pot must be used → *Incoherent branch* (all efficient splits have same total).  

  6. **Should concessions be equal?** (A concedes £300k from max £800k, B concedes £300k from max £700k).  
     - **Yes, proportional concessions**: → **Equal-concessions** (same as KS here).  
     - **No, absolute gains matter more**: → **Nash/KS hybrid** (empty; see notes).  

  ---

  ### Housekeeping  
  #### Unoccupied Answer Combinations  
  - **"Maximize total gains" + "Avoid waste"**: Empty (incoherent). Total gains are fixed; all efficient splits are identical.  
  - **"Favor weaker party" + "No concessions"**: Empty (unattractive). Favors B arbitrarily without a clear principle.  
  - **"No lotteries" + "Threats matter" in Q4**: Occupied (Leximin).  

  #### Indistinguishable Leaves  
  - **Nash and Kalai-Smorodinsky** yield **identical splits (£500k/£400k)** in the £900k example.  
    - **Why?** Linear frontier + symmetric max gains (£600k each).  
    - **Smallest change to separate them**:  
      - Make utility non-linear (e.g., B values money as square root).  
      - **New example**: Total pot £900k. A: utility = £. B: utility = 20√(£). Walk-away: A=£200k (util 200), B=£100k (util 200).  
        - **Nash**: A ≈ £510k, B ≈ £390k.  
        - **KS**: A ≈ £490k, B ≈ £410k.  

  #### Confidence & Weakest Node  
  - **Overall confidence**: 90%. The tree covers core tradeoffs and workshop debates.  
  - **Weakest node**: **Q2 (Pot growth)**.  
    - **Why?** Nash and KS coincide here, making the diagnostic rely on *external* intuition (e.g., sensitivity to max gains). In practice, responders may not intuit the £1,000k hypothetical clearly.  

  ---  
  **Key Insight**: In symmetric linear cases, Nash, KS, egalitarian, and leximin converge. The tree forces divergence via contextual twists (non-linear utility, threats, lotteries). Use the £900k example for answers, and the £1,000k/money-utility examples to expose hidden assumptions.
