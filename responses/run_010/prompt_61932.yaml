prompt: |-
  I am in my fourth year of a political philosophy doctorate, writing on the ethics of blame, and for the last two years I have also sat on my university's panel for online conduct — the body that handles referrals when a member of the community's social-media activity becomes a matter of institutional concern. Three of us read each referral cold, we get twenty-five minutes before a vote, none of us has legal training, and our recommendation goes to a dean's office that ratifies it almost without exception. We see perhaps a dozen cases a year in normal terms and considerably more in a bad month, and the realistic range of outcomes is narrow: a formal statement of censure, a requirement that the person issue a correction or apology, withdrawal of a teaching assistantship or of the department's sponsorship of a talk, a recommendation that a scholarly society rescind an invitation, or nothing at all. My co-panellists and I keep relitigating the same question case by case, and I want to stop doing it. One of us, who came from legal theory, holds that if what we impose is burdensome and is imposed because of a past wrong, it is punishment in substance whatever we call it, and therefore owes proportionality and process. Another holds that a university, a platform, and a profession are all voluntary associations, and that withdrawing standing from a member is no more punishment than uninviting someone from a dinner party is; on that view the only duties we owe are notice and a fit between the restriction and the risk. A third thinks the whole frame is wrong and that what we are doing is neither punishing nor excluding but managing a hazard. Please write a decision procedure this panel could actually run on a referral, one that resolves which frame governs rather than assuming it.

  The procedure should proceed through diagnostic questions in a fixed order, with a statement of what counts as a sufficient answer to each, and it should be built on the distinction between sanction as punishment — which, if it applies, imports proportionality, due process, and the expressive aim of condemning a wrong, on something like Feinberg's account of what punishment expresses — and sanction as the alteration of the terms of association or as risk management, which imports only reasonable notice and fit. It must be explicit about the aggregation problem, which is where I think our current practice is least honest: a journal rescinds an invitation, a department rescinds a talk, an employer rescinds an offer, a thousand people post, and no single one of those actors is punishing anyone, yet the target can end up worse off than any court could lawfully have made them. I want the procedure to say what, if anything, follows for the one actor sitting in front of us, and whether it matters that our own contribution is marginal to the total harm and that withdrawing would not help the target. Strawson's distinction between the participant stance and the objective stance is worth keeping if it earns its place: in particular I want the procedure to detect when a body is managing someone as a risk while describing what it does in the language of holding them responsible, and the converse, when it is condemning someone under the cover of risk language, since both moves let an institution impose the costs of punishment while declining its constraints. Beyond that, strip out any conceptual machinery a non-specialist panellist cannot deploy in twenty-five minutes, and tell me what you stripped and what breaks as a result. Mark every point at which the answer turns on a value judgment the procedure cannot derive, and say where the procedure terminates in a flat "no" rather than handing the case to a person.

  Then run it on three referrals. First, a senior faculty member whose decade-old posts have surfaced, who has apologised unprompted, and who is now the object of an organised external campaign, where our only realistic options are a formal censure or silence. Second, a graduate student who repeatedly targeted a junior scholar with harassing replies and who argues, not implausibly, that removing him from the department's mailing list and barring him from the workshop series is punishment for speech. Third, a researcher who has been broadcasting dangerous medical misinformation to a very large following while remaining, so far as anyone on the panel knows, entirely decent in person and a good colleague — a case where the risk frame and the blame frame point in opposite directions. I expect the procedure to hand down at least one result I will dislike; if it does not, it is flattering us rather than doing work, and I would rather know that about my own panel now. Finally, tell me plainly where this procedure is most likely to misfire in practice — which kinds of case it will systematically get wrong, and which of its steps are judgment calls dressed up as procedure — and tell me what would change your mind about the central classification: what argument or consideration would convince you that aggregated social sanction really is punishment in the sense that imports proportionality, or that it never is, and where in your own reasoning you think the weakest link sits.
reasoning: |-
  We are designing a decision procedure for a university panel handling online conduct referrals. The procedure must distinguish between three frames: punishment, alteration of association terms (exclusion), and risk management. We'll build a flowchart of diagnostic questions that determine which frame applies and what duties follow.

  Key distinctions:
  - **Punishment**: Imposes burdens because of a past wrong, with expressive aim of condemnation. Requires proportionality, due process, and is backward-looking.
  - **Alteration of association terms (Exclusion)**: Withdrawing benefits of voluntary association. Requires notice and fit between restriction and risk (forward-looking). Not inherently expressive.
  - **Risk management**: Forward-looking, aimed at preventing harm. Requires reasonable notice and fit between measure and risk. Not about blame.

  Aggregation problem: Even if each actor's action isn't punishment, the cumulative effect might be punitive. But the panel can only decide for its own action.

  Strawson's participant vs. objective stance:
  - **Participant stance**: Holding responsible, blaming, punishing.
  - **Objective stance**: Managing as a risk, like a hazard.

  Procedure must:
  - Be executable in 25 minutes by non-specialists.
  - Have fixed order of questions with clear sufficiency conditions.
  - Terminate in a "no" when no action is warranted by the frame.
  - Explicitly mark value judgments.

  We strip out:
  - Complex philosophical debates (e.g., nature of blame, free will).
  - Detailed legal doctrines (e.g., due process requirements beyond basic fairness).
  - Consequentialist calculations (we use a threshold of "reasonable fit").
  - We rely on the panel's common sense for value judgments.

  Procedure:

  1. **Threshold Question: Is there a genuine risk of harm to the university community (including reputation) that our action might mitigate?**
     - *Sufficient answer*: Yes, if there is a non-speculative, non-trivial risk that the conduct (or its continuation) could cause harm to individuals, the institution, or its mission. If no, terminate with "no action" (risk management frame doesn't apply, and without risk, exclusion/punishment may be unjustified).
     - *Value judgment*: What counts as non-trivial harm? (e.g., reputational damage, creating hostile environment).
     - *Note*: If no risk, then even if there's a past wrong, punishment frame might not apply because the institution may not have a role (but see next steps). However, without risk, exclusion is harder to justify.

  2. **Question 2: Is the proposed action primarily motivated by the need to condemn a past wrong?**
     - *Sufficient answer*: Yes, if the panel's discussion or the referral materials emphasize the wrongfulness of the past act and the need to express disapproval. Look for language of blame, condemnation, desert, or retribution. If yes, then the punishment frame applies and we must ensure proportionality and due process (which we may not be able to provide, so we might have to choose a lesser action or abstain).
     - *No*: Proceed to next question.
     - *Value judgment*: Interpreting motivations (may be mixed).

  3. **Question 3: Is the proposed action primarily about altering the terms of association (e.g., withdrawing privileges, membership benefits) because the person's conduct makes them unfit for continued participation in some role?**
     - *Sufficient answer*: Yes, if the action is framed as protecting the institution or community by limiting the person's access to opportunities (e.g., uninviting from a talk, removing from a mailing list) and the rationale is forward-looking (preventing future harm or mismatch). If yes, then exclusion frame applies, requiring notice and fit.
     - *No*: Then the action must be risk management (since we established risk exists in Q1).

  4. **Question 4 (for punishment frame only): Can we provide minimal due process?**
     - *Minimal due process*: Notice of the allegations, opportunity to respond (even if briefly), and an unbiased decision-maker. Since we have 25 minutes and no legal training, we can only do this if the person has already had a chance to respond (e.g., in the referral) or if we can delay to allow a response. If no, we cannot impose punishment (so we must either use a non-punitive frame or take no action).
     - *Value judgment*: What constitutes minimal due process? We set a low bar: at least the person knows the case and has a chance to give their side.

  5. **Question 5 (for punishment frame): Is the proposed action proportional?**
     - *Proportionality*: The burden imposed should not be grossly disproportionate to the wrong. We compare the severity of the wrong (considering intent, harm, context) and the burden (e.g., censure vs. job loss). If no, we must scale back to a proportional action or take no action.
     - *Value judgment*: Assessing severity and burden.

  6. **Question 6 (for exclusion or risk management frames): Is there a reasonable fit between the action and the risk?**
     - *Reasonable fit*: The action must be rationally connected to mitigating the risk and not overbroad. E.g., removing someone from a teaching role if they posted hate speech might fit; removing them from all departmental activities might not. If no, we must choose a better-fitting action or none.
     - *Value judgment*: What is reasonable? We avoid second-guessing but reject blatant misfits.

  7. **Aggregation consideration (applies in all frames):** 
     - Even if our action is minor, we must consider whether it contributes to an aggregated harm that becomes punitive. But we cannot control others. Therefore, if our action is justified under its frame (punishment with due process and proportionality; exclusion/risk with fit), we may proceed. However, if the cumulative effect (including our action) would be grossly disproportionate, we might abstain or choose a symbolic action. This is a value judgment: when is the cumulative effect too much?

  8. **Strawson check (to detect mismatches):**
     - If the frame is risk management (objective stance) but the language used is blaming (participant stance), we must reconsider: are we really punishing? If so, switch to punishment frame and apply its constraints.
     - Conversely, if we are using punishment language but the action is framed as risk management, we must either adopt the punishment constraints or reframe without blame.

  Now, the procedure steps:

  **Step 1: Risk Threshold**
     - If no risk of harm → **Terminate with no action**.
     - Else → Proceed.

  **Step 2: Motive Check**
     - Is the primary motive to condemn a past wrong? 
       - Yes → **Punishment frame**. Go to Step 4 (due process) and Step 5 (proportionality).
       - No → Go to Step 3.

  **Step 3: Association Alteration Check**
     - Is the action about altering terms of association? 
       - Yes → **Exclusion frame**. Go to Step 6 (fit).
       - No → **Risk management frame**. Go to Step 6 (fit).

  **Step 4 (Punishment frame only): Due Process**
     - Has the person had notice and opportunity to respond? 
       - Yes → Proceed to Step 5.
       - No → We cannot punish. Consider if a non-punitive action (exclusion/risk) is available and justified by repeating from Step 2 (with motive reassessed) or Step 3. If not, **terminate with no action**.

  **Step 5 (Punishment frame only): Proportionality**
     - Is the action proportional? 
       - Yes → Proceed to Step 7 (aggregation).
       - No → Scale back to a proportional action; if none, **terminate with no action**.

  **Step 6 (Exclusion or Risk frame): Fit**
     - Is there reasonable fit between action and risk? 
       - Yes → Proceed to Step 7.
       - No → Choose a better-fitting action; if none, **terminate with no action**.

  **Step 7: Aggregation Consideration**
     - Would our action, combined with other known actions (e.g., from other institutions), result in a burden grossly disproportionate to the wrong (if punishment) or to the risk (if exclusion/risk)? 
       - Yes → We abstain or choose a minimal action (e.g., censure only if punishment frame; no action if exclusion/risk).
       - No → Proceed to impose the action.

  **Step 8: Strawson Check (throughout, but especially after framing)**
     - If the chosen frame does not match the language used, we must reconcile:
       - If using blame language for risk management → Either drop the blame language and ensure no expressive condemnation, or switch to punishment frame (if constraints can be met).
       - If using risk language for blame → Adopt punishment constraints or reframe without expressing blame.

  But note: Step 8 is a continuous awareness, not a separate step. We build it into the questioning.

  Now, run on three cases:

  **Case 1: Senior faculty member with decade-old posts, apologized, organized campaign against them. Options: censure or silence.**

  - Step 1: Risk? The posts are old, apologized, but external campaign might harm university reputation. Non-trivial risk? Maybe, but low. Let's say yes for argument.
  - Step 2: Motive? The panel might be tempted to condemn the old posts, but the primary motive should be risk management (reputational harm). So, no to punishment motive? If we are considering censure, that might be expressive. This is tricky.
    - If we choose censure, it looks like punishment. But the risk is external. So we must ask: is censure meant to condemn (punishment) or to distance the university (risk management)? 
    - Given the apology and time passed, condemnation might be disproportionate. So let's say the panel's motive is risk management: to show the university doesn't condone such posts. Then not punishment.
  - Step 3: Alteration of association? Censure doesn't alter terms; it's expressive. But it's not withdrawing any benefit. So exclusion frame doesn't apply. Therefore, risk management frame.
  - Step 6: Fit? Censure might fit if it mitigates reputational risk by showing the university's stance. But is it overbroad? The person has apologized. Alternatively, silence might be better if the risk is low. But we have two options: censure or silence. 
    - If we think censure fits, we can do it. But note: censure is expressive, so we must do the Strawson check.
  - Step 8: We are using a risk management frame but censure is blame-expressive. This is a mismatch. We must either:
    - Avoid censure (because it expresses blame) and do nothing (silence) or a neutral statement, or 
    - Switch to punishment frame and apply constraints.
  - Punishment frame: Step 4 - Due process: The faculty member knows the case and has apologized, so they had opportunity. Step 5 - Proportionality: Censure for decade-old posts already apologized? Might be proportional if the posts were very severe. But generally, it might be disproportionate given time and apology. 
    - Therefore, under punishment frame, censure might be proportional only for severe wrongs; else no action.

  Result: 
  - If we take risk management, we avoid expressive actions. So we might choose silence (no action) because censure is expressive and we don't want to punish.
  - Alternatively, we might issue a neutral statement that doesn't condemn but clarifies the university's stance (if possible). But the options are censure or silence.
  - So: no action (silence) because censure is either punitive (and disproportionate) or mismatched (if we call it risk management).

  **Case 2: Graduate student who harassed a junior scholar, argues that removing from mailing list and barring from workshop is punishment for speech.**

  - Step 1: Risk? Yes, ongoing harassment creates a risk of harm to the junior scholar and to the department's environment.
  - Step 2: Motive? The action is taken because of past wrong (harassment) and likely to prevent future harm. But is it condemning? The student says it's punishment. However, the primary motive might be risk management (preventing further harassment) and exclusion (limiting access to platforms used for harassment). 
    - Let's say the panel views it as exclusion: withdrawing the privilege of the mailing list and workshop because the student misused them.
  - Step 3: Alteration of association? Yes, removing from mailing list and barring from workshop is altering terms of participation. So exclusion frame.
  - Step 6: Fit? Removing from the mailing list if it was used for harassment: reasonable fit. Barring from workshop if the harassment occurred there or could recur: also fit. If the harassment was only on social media and the workshop is unrelated, it might not fit. But let's assume fit.
  - Aggregation: The student might face other consequences, but our action is minor. Not grossly disproportionate.
  - But the student claims it's punishment. So do the Strawson check: 
    - We are using exclusion (objective) but the student perceives it as blame. We must ensure we are not expressing condemnation. The action should be presented as preventive, not punitive. 
    - If the panel's language is blaming, we must switch to punishment frame? But we don't have due process? 
      - Step 4: Due process? The student has had a chance to argue (in the referral or to the panel). In 25 minutes, we might not have given them a full chance, but if they submitted their view, it might suffice. Then we can treat it as punishment if we want. 
      - Step 5: Proportionality? Removal from mailing list and workshop might be proportional to repeated harassment.

  But the panel might prefer the exclusion frame to avoid due process hurdles. So we stick with exclusion and ensure we don't express blame.

  Result: Action justified under exclusion frame with fit.

  **Case 3: Researcher broadcasting medical misinformation, good colleague in person. Risk frame and blame frame point opposite.**

  - Step 1: Risk? High risk: misinformation can cause real-world harm, especially with a large following.
  - Step 2: Motive? The panel might want to condemn the misinformation (blame) but the institutional duty is likely risk management (preventing harm). So no to punishment as primary motive? But the panel might feel blame is warranted.
    - However, the person is a good colleague, so we might not want to punish but to manage risk.
  - Step 3: Alteration of association? The referral doesn't specify the action, but typical might be: withdraw teaching, revoke platform, etc. Let's say the proposed action is to bar the researcher from teaching a public health course (if they do) or to issue a correction requirement. 
    - If we are withdrawing a role, it's exclusion. But the risk is external (to the public), so the university's role is indirect. 
    - The university might act to protect its reputation and to prevent harm by dissociating or correcting.
  - So frame: risk management (if we are issuing a correction) or exclusion (if we are removing from a role).
  - Step 6: Fit? If the misinformation is in their area of expertise, removing them from a teaching role in that area might fit. Issuing a correction also fits. But if they don't teach that topic, it might not fit. Assume it fits.
  - But the blame frame: the panel might think they deserve condemnation. But if we use punishment, then due process and proportionality. 
    - Due process: yes, they know the case. Proportionality: if we censure or remove a role, it might be proportional to the harm caused by misinformation. 
    - However, the person is otherwise good, so we might hesitate to punish.

  But the risk is high, so we can act under risk management without blaming. We don't need to condemn, just to mitigate risk. So we choose risk management and avoid expressive actions.

  Result: Action (e.g., correction requirement or removal from a specific role) under risk management with fit.

  Now, where the procedure might misfire:

  - **Systematic errors**:
    - Cases with mixed motives: The procedure forces a primary frame, but real cases are often mixed. We might misclassify.
    - Value judgments: What counts as non-trivial risk, proportionality, or fit is subjective. The procedure doesn't eliminate that.
    - Aggregation: We can only guess at cumulative harm. We might underestimate when our small action tips the scale.
    - Due process: In 25 minutes, we can't provide much. So we might avoid punishment even when deserved.

  - **Judgment calls dressed as procedure**:
    - Step 1: What is non-trivial risk?
    - Step 2: What is the primary motive? (Hard to discern)
    - Step 5 and 6: Proportionality and fit.

  What would change my mind about aggregation being punishment?

  - **Argument that aggregated sanction is punishment**: If the cumulative effect is intended by the actors to condemn and impose a burden, then it is collective punishment. But if each actor acts independently without punitive intent, it's not. The weakest link: Punishment requires intentional imposition of a burden for a wrong. If each actor doesn't intend punishment, but the outcome is the same, is it punishment? Not by Feinberg's account, which requires expressive intent. So I remain skeptical that aggregation is punishment per se.

  - **Argument that it never is**: Even if each actor is only managing risk, if the outcome is identical to punishment, and the target is being treated as a wrongdoer, then the objective stance is not being maintained. The weakest link: In reality, risk management towards a person often blends into blame. We might need to consider aggregated effects as punitive in substance and thus require proportionality.

  The weakest link in my reasoning: I assume we can separate frames cleanly, but in practice, social sanctions are a hybrid. The procedure tries to force a choice, but it might be artificial.

  For the panel, the procedure might help by forcing explicit framing and thus making constraints clear.
answer: |-
  Below is a decision procedure designed for your panel, built around the core distinction between **sanction as punishment** (which imports proportionality, due process, and expressive condemnation) and **sanction as alteration of association terms or risk management** (which imports only reasonable notice and fit). The procedure is structured as a flowchart of diagnostic questions, with explicit thresholds for sufficient answers, termination points, and value judgments. It addresses the aggregation problem by focusing on your panel's specific action (not the cumulative harm) and incorporates Strawson's participant/objective stance as a guard against institutional bad faith.

  The procedure strips out:
  - **Complex philosophical theory** (e.g., Feinberg's full account of expressive punishment; Strawson's deeper metaphysics of responsibility). Instead, it uses simplified, operational definitions.
  - **Legal technicalities** (e.g., distinctions between civil/criminal due process). Minimal due process is reduced to "notice and response."
  - **Consequentialist calculus** (e.g., long-term reputational impacts). Risk is assessed at a "reasonable probability" threshold.
  - **Ambiguous blame concepts** (e.g., "moral responsibility" or "character assessment"). Blame is inferred from institutional language and intent.

  This simplification risks:
  - **Overlooking nuance** in borderline cases (e.g., where risk and blame are equally weighted).
  - **Ignoring power dynamics** (e.g., the panel may underestimate harm to vulnerable parties).
  - **Flattening moral complexity** into binary outcomes.
    
  The procedure assumes panelists can recognize basic institutional language (e.g., "condemn" vs. "mitigate risk") and common-sense notions of fairness. Value judgments are marked with **(VJ)**; these require panelist discretion and cannot be derived procedurally. Steps terminate in "no action" when constraints cannot be met.

  ---

  ### **Decision Procedure for Online Conduct Referrals**
  **Time constraint:** 25 minutes per case.  
  **Input:** Referral materials (social media content, context, proposed actions).  
  **Output:** A frame-governed action (or no action), with duties applied.  

  #### **Step 1: Assess Risk of Harm**  
     - **Question:** "Is there a non-trivial, foreseeable risk of harm to individuals, the university, or its mission if no action is taken?"  
       - *Sufficient answer:* Yes, if the conduct (a) threatens physical/psychological safety, (b) undermines academic integrity, (c) creates a hostile environment, or (d) poses significant reputational damage. Harm must be probable, not speculative.  
       - **No? → Terminate with no action.**  
       - **Yes? → Proceed to Step 2.**  
       - **(VJ):** What constitutes "non-trivial" harm? (e.g., reputational damage is weighted against academic freedom).  
       - *Why here?* Without risk, exclusion/risk management lacks justification. Punishment may still apply, but Step 2 filters this.  

  #### **Step 2: Determine Primary Institutional Stance (Strawson Check)**  
     - **Question:** "Is the panel's proposed action described or intended *primarily* as holding the person responsible for a past wrong (participant stance), or as managing a future risk/altering association terms (objective stance)?"  
       - *Sufficient answer:*  
         - **Punishment (participant stance):** Language/keywords include "blame," "condemn," "accountability," "deserved," "wrongdoing," "sanction." Action expresses moral disapproval.  
         - **Exclusion/Risk (objective stance):** Language/keywords include "risk," "safety," "protocol," "fit," "community standards," "prevention." Action is forward-looking and non-expressive.  
       - **Punishment? → Proceed to Step 3.**  
       - **Exclusion/Risk? → Proceed to Step 4.**  
       - **(VJ):** Interpreting institutional intent (e.g., "apology required" could be punitive or risk-management).  
       - *Key guard:* Flags when an institution uses "blame language" for risk actions (or vice versa), forcing frame consistency.  

  #### **Step 3: Punishment Frame Duties**  
     - **3a. Due Process Check:** "Has the person received notice of allegations and a reasonable opportunity to respond?"  
       - *Sufficient answer:* Yes, if (a) the referral includes their written response, or (b) they were given >24 hours to respond before the panel. Minimal due process requires only this.  
         - **No? → Terminate with no action** (cannot punish without basic fairness).  
         - **Yes? → Proceed to 3b.**  
     - **3b. Proportionality Check:** "Is the proposed burden proportionate to the wrong, considering severity, intent, context, and remorse?"  
       - *Sufficient answer:*  
         - Proportional: Action aligns with wrong (e.g., censure for offensive speech; rescinding talk for harassment).  
         - Disproportionate: Action exceeds wrong (e.g., firing for minor offense; cumulative harms outweighing the act).  
       - **Proportional? → Impose action.**  
       - **Disproportionate? → Scale down to a proportional action (e.g., replace TA withdrawal with censure) or terminate with no action.**  
       - **(VJ):** Severity assessment (e.g., is a racist post "worse" than misinformation?).  
       - *Aggregation note:* Panel action must stand alone as proportional. Ignore cumulative harm—your action is marginal.  

  #### **Step 4: Exclusion/Risk Frame Duties**  
     - **4a. Alteration vs. Risk Subclassification:** "Is the action about withdrawing associational benefits (e.g., membership, privileges), or neutral risk mitigation?"  
       - *Sufficient answer:*  
         - **Exclusion:** Rescinding invitations, barring from events, removing from roles. Focus: Person no longer "fits."  
         - **Risk Management:** Content removal, apologies, access restrictions. Focus: Preventing harm.  
       - *(No termination—subclassification for clarity, but duties are identical.)*  
     - **4b. Fit and Notice Check:**  
       - **Fit:** "Is there a reasonable, direct link between the action and mitigating the risk or upholding association terms?"  
         - *Sufficient answer:*  
           - Fit: Action targets the risk (e.g., barring harassers from forums used for harassment).  
           - No fit: Action is arbitrary or overbroad (e.g., barring from all events for off-campus speech).  
       - **Notice:** "Were association terms/risks reasonably clear?" (Assumed yes for public university policies.)  
       - **Fit + Notice? → Impose action.**  
       - **No fit? → Terminate with no action** (or modify to fit).  
       - **(VJ):** "Reasonable" fit (e.g., does a faculty post justify disinviting a talk?).  

  #### **Step 5: Aggregation Safeguard (Final Check for All Frames)**  
     - **Question:** "Could our action, combined with known external actions (e.g., job loss, social media pile-ons), create a total burden grossly disproportionate to the wrong/risk?"  
       - *Sufficient answer:*  
         - **No:** Burden is isolated (e.g., censure adds little to public shaming). → **Impose action.**  
         - **Yes:** Burden is crushing (e.g., target already lost job; our action is "kicking them while down"). → **Terminate with no action** (or reduce to symbolic action, e.g., private warning).  
       - **(VJ):** Defining "gross disproportionality"—rare and extreme (e.g., homelessness risk).  
       - *Why last?* Ensures panel doesn't exacerbate injustice, but doesn't overrule prior steps.  

  ---

  ### **Application to Sample Referrals**
  **General Process:**  
  - All steps executed in sequence; 25-minute timer starts at Step 1.  
  - "Terminate with no action" ends deliberation.  
  - Panel votes at each **(VJ)** point (majority rules).  

  #### **Case 1: Senior faculty member with decade-old posts, apologized, facing external campaign.**  
  - **Step 1 (Risk):** Yes—reputational risk to university from ongoing campaign.  
  - **Step 2 (Stance):** Options are censure (punishment language) or silence. Censure implies participant stance → **Punishment frame.**  
  - **Step 3a (Due Process):** Yes—faculty member knows allegations and apologized unprompted.  
  - **Step 3b (Proportionality):** **Disproportionate**—Censure for old, apologized posts is excessive given time lapse and remorse. Scaling down not viable (only censure/silence). → **Terminate with no action (silence).**  
  - **Step 5 (Aggregation):** Even if proportionate, external campaign may make burden disproportionate—supports no action.  
  - **Result:** No action. *You may dislike this if you view censure as symbolic, but punishment frame demands proportionality.*  

  #### **Case 2: Graduate student harassing junior scholar; claims removal from lists/workshop is punishment.**  
  - **Step 1 (Risk):** Yes—ongoing harassment risks harm to junior scholar and department climate.  
  - **Step 2 (Stance):** Action (removal from lists/workshop) uses risk language (e.g., "prevent further targeting"). → **Exclusion/Risk frame.**  
  - **Step 4b (Fit/Notice):** **Fit**—Barring from lists/workshops directly mitigates risk if harassment occurred there. Notice assumed via university policies.  
  - **Step 5 (Aggregation):** Unlikely disproportionate—panel action is minor compared to total harm.  
  - **Result:** Impose action. *Student's "punishment" claim overruled; exclusion frame requires only fit.*  

  #### **Case 3: Researcher spreading medical misinformation; good colleague personally.**  
  - **Step 1 (Risk):** Yes—misinformation to large following risks public harm and reputational damage.  
  - **Step 2 (Stance):** Blame frame (condemnation) points to punishment; risk frame (public safety) points to exclusion/risk. Risk dominates—action (e.g., rescinding talk sponsorship) uses "prevent harm" language. → **Exclusion/Risk frame.**  
  - **Step 4b (Fit/Notice):** **Fit**—Rescinding sponsorship of a public talk fits if misinformation relates to topic. Notice assumed.  
  - **Step 5 (Aggregation):** Unlikely disproportionate—action is narrow (not firing).  
  - **Result:** Impose action (e.g., rescind talk). *Blame frame ignored; risk frame carries no proportionality duty.*  

  ---

  ### **Weaknesses and Failure Points**  
  **Where the procedure misfires:**  
  1. **Mixed-motive cases:** Systematic error when risk and blame are equally weighted (e.g., harassment with high harm risk). Step 2 forces a binary choice, potentially misclassifying.  
  2. **Value judgment overreach:** Steps 1 (risk), 3b (proportionality), and 4b (fit) are judgment calls disguised as procedure. Panelists may rationalize biases (e.g., labeling all "reputational risk" as high).  
  3. **Aggregation blindness:** Step 5 is crude—ignores how marginal actions enable "pile-ons." May fail in cases with nebulous external campaigns (e.g., Case 1).  
  4. **Strawson evasion:** Institutions can game language (e.g., framing punishment as "risk protocol"). Step 2 checks this, but relies on panelist honesty.  
  5. **Under-punishment:** Due process (Step 3a) is minimal—may block deserved condemnation when responses are rushed.  

  **What would change my mind about aggregation as punishment?**  
  - **Argument for "aggregation as punishment":** If social/media backlash is foreseeable and your action intends to contribute to a condemnatory ecosystem, it becomes collective punishment. Proportionality then applies. *Weakest link:* Intent is hard to prove; your panel lacks control.  
  - **Argument for "never punishment":** If each actor acts independently for risk/exclusion reasons, aggregation is incidental. Punishment requires expressive intent (Feinberg). *Weakest link:* Ignores how institutions exploit this for "plausible deniability."  
  - **My weakest link:** I assume frames are mutually exclusive. In reality, sanction is often a hybrid—e.g., rescinding a talk expresses blame *and* manages risk. The procedure forces a choice, but this may be artificial.  

  **Recommendation:** Test-drive this for 2–3 months. If misfires exceed 20% of cases, add a "hybrid frame" exception requiring full punishment duties (due process + proportionality) when risk and blame co-dominate.
