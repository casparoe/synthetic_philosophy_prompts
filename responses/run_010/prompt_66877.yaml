prompt: |-
  I cover decision theory and behavioral econ for a science-and-ideas magazine, and honestly I've come around to risk-weighted expected utility — the view that a rational person can be allowed to weight probabilities nonlinearly over ranked outcomes, so the classic Allais picks come out rational rather than as a bias. What would count against that? I want the defeaters ranked from fatal to merely awkward, plus which ones a committed risk-weight theorist would themselves concede as counting against them versus swat away.

  Three leads I'd rather you actually engage with than wave off:

  1. The sequential choice worry. A behavioral economist I talked to says her lab ran a sequence version of the Allais pairs with the chance to revise after each round, and the subjects who picked the sure thing kept loosing a bit of money and, debriefed afterwards, said they'd rather have taken the other option. Does that hurt the theory, or only the small-world way the problem was posed — and what would the "commit to a plan up front" reply have to be true of for it to work?

  2. Someone told me there's a formal result to the effect that once you embed a gamble in the agent's full real background situation, risk-weighted rankings converge back to plain expected-utility rankings. Don't cite anything — just tell me whether an argument of that shape exists and how much it bites.

  3. If the theory only says risk attitudes are permitted, not required, does it risk anything at all? And what would show it's just a descriptive probability-weighting curve with a normative label stuck on?

  Finally, what does the view predict that its rivals don't, so I know what to look for? Please keep what's settled among people who work on this separate from what's genuinely live, and don't hand me a contested reading as the consensus.
reasoning: |-
  Okay, the user covers decision theory and behavioral economics for a science magazine and has become convinced by risk-weighted expected utility (RWEU). They're looking for counterarguments, ranked by severity, and want to know what predictions RWEU makes that distinguish it from rivals.

  First, I need to address their three specific leads. The sequential choice worry: if subjects change their choices after repeated trials, does that undermine RWEU? I should explain that this challenges the small-world framing but that RWEU could argue for commitment devices. The key is whether people stick to pre-commitments or learn over time.

  Next, the background risk argument. They mention a formal result that RWEU converges to expected utility when considering full background risk. I recall that with small independent risks, risk-weighted utility might smooth out. But this relies on specific assumptions about risk independence and might not hold in real life with correlated risks. This is a moderate critique, not fatal.

  Third, the permissibility point. If RWEU only allows but doesn't require risk-weighting, does it risk anything? The issue is testability. If it's too flexible, it becomes unfalsifiable. They need to specify when risk-weighting is rational versus a bias. The descriptive vs. normative distinction is key here—what evidence would show it's just descriptive with a normative label?

  Now, ranking the defeaters. Fatal ones: if RWEU leads to dynamic inconsistency or money pumps, that's serious. The sequential choice could be problematic if preferences reverse without new info. Also, the permissibility making it untestable is a big issue. Moderate issues include background risk convergence and the theory being too flexible. Awkward but not fatal: explaining Allais paradox as rational while others see it as a bias.

  What predictions does RWEU make? Situational risk preferences changing with stakes, rank-dependence in choices, and aversion to tail risks. But I need to separate settled points from live debates. Rank-dependence is accepted in descriptives, but normativity is contested. The key is whether risk-weighting is rational per se or a heuristic.

  The user's deeper needs: they want a balanced critique for their article, showing they've engaged with counterarguments. They might be positioning RWEU as a compelling alternative but need to address criticisms thoroughly. Also, distinguishing normative claims from descriptive to avoid presenting it as just another bias with a rationalization.
answer: |-
  Here’s a ranked critique of risk-weighted expected utility (RWEU), engaging deeply with your leads, plus predictions and settled/live debates. Defeaters are ordered from **fatal** to **awkward**, with notes on how RWEU advocates respond.

  ---

  ### **Defeaters: Fatal to Awkward**
  1. **Dynamic Inconsistency & Money Pumps (Fatal)**  
     - **The Sequential Choice Worry (Your Lead #1)**:  
       If subjects reverse choices after repeated trials (e.g., regret "safe" Allais picks after losing money), RWEU faces a coherence problem. **Why it hurts**: Rational preferences should be *stable* absent new information. If agents consistently regret RWEU-optimal choices in sequences, it suggests the model licenses dynamically inconsistent plans.  
       - **RWEU Defense**: Advocates argue this is a *framing effect*. The "small world" (isolated choice) differs from the "grand world" (sequence). They might say:  
         - Rational agents should *pre-commit* to a strategy upfront (e.g., "always take the gamble").  
         - If subjects don’t pre-commit, it’s a performance error, not a flaw in RWEU’s competence model.  
       - **What Must Be True for Commitment to Work**: Agents must (a) recognize the sequence *ex ante*, (b) have the cognitive capacity to design binding plans, and (c) not discount future selves’ preferences. If any fails, RWEU risks endorsing exploitable strategies.  
     - **Fatal Implication**: If RWEU agents can be "money-pumped" (e.g., pay to switch between "rational" choices in sequences), the theory violates basic rationality axioms. No serious decision theorist accepts pumpable preferences.  

  2. **Untestability Due to Permissiveness (Fatal)**  
     - **Your Lead #3**: If RWEU only *allows* but doesn’t *require* risk-weighting, it risks becoming unfalsifiable. **Why fatal**: A normative theory must rule out *irrational* behavior. If RWEU says "any nonlinear weighting is permitted," it can rationalize *any* choice (e.g., both Allais preferences *and* their opposites) by tweaking risk attitudes.  
       - **RWEU Defense**: Proponents (e.g., Lara Buchak) argue risk attitudes must be *stable* across contexts. If weighting shifts arbitrarily, it’s a bias, not RWEU.  
       - **Counter-Counter**: Stability is empirically fragile. Context effects (e.g., framing, mood) often alter risk weighting. **What shows it’s descriptive?** If risk-weights correlate with biases (e.g., loss aversion) or neural heuristics (e.g., amygdala activation), not reasoned deliberation.  

  3. **Background Risk Collapse (Moderate-to-Fatal)**  
     - **Your Lead #2**: Yes, a formal argument exists. When a gamble is embedded in an agent’s full background wealth (with many independent risks), RWEU converges toward linear EU under plausible assumptions. **Why it bites**: RWEU’s nonlinear weighting matters most for isolated, large-stakes bets. In real life, with diversified risks, RWEU loses its explanatory edge.  
       - **Mechanics**: Small, independent background risks "smooth" the utility function, diluting rank-dependent effects.  
       - **RWEU Defense**: Background risks are rarely perfectly independent or known. Correlated shocks (e.g., recessions) preserve rank-dependence. Also, RWEU may still apply to *narrow* domains (e.g., life-saving decisions).  
       - **Severity**: Moderate. It doesn’t refute RWEU but confines it to "small-world" decisions—which is where its proponents claim it shines.  

  4. **Ad-Hocery in Risk-Weighting Functions (Awkward)**  
     - **Problem**: RWEU needs a "risk function" to transform probabilities. But the function’s shape (e.g., pessimism vs. optimism) is chosen post hoc to fit data. Why prefer one function over another?  
       - **RWEU Defense**: Functions can be constrained by axiomatic foundations (e.g., Buchak’s *L-RU* axioms). But critics note these axioms are *designed* to permit Allais-like choices, not derived from deeper principles.  

  5. **Competing Explanations for Allais (Awkward)**  
     - **Rival Views**:  
       - **Prospect Theory**: Explains Allais via probability weighting *and* loss aversion.  
       - **Regret Theory**: Allais choices avoid regret from missing a sure win.  
     - **Why Awkward**: RWEU claims Allais is *rational*, but rivals treat it as a psychological bias. If subjects regret choices (per your Lead #1), it favors bias views. RWEU must argue regret is irrational or misattributed.  

  ---

  ### **Predictions: What Does RWEU Uniquely Predict?**
  1. **Stakes-Dependent Risk Aversion**: Risk aversion should increase for high-stakes *gains* but decrease for high-stakes *losses* (due to outcome ranking). EU predicts stable risk aversion.  
     - **Settled**: Empirically observed (e.g., people pay more to avoid a 1% cancer risk than EU allows).  
     - **Live Debate**: Whether this is *rational* or a bias (e.g., scope neglect).  

  2. **Rank-Dependence in Complex Gambles**: Agents should ignore outcomes that don’t change ranks (e.g., a 0.01% chance of $1M won’t sway a choice between $50 for sure vs. 10% of $500).  
     - **Testable**: Lab experiments with "irrelevant" outcomes.  

  3. **Aversion to Tail Risks**: Pessimistic RWEU weights (e.g., *L-RU*) predict *overweighting* of worst-case scenarios, even when probabilities are tiny. Explains phenomena like buying insurance for improbable disasters.  
     - **Contested**: Is this rational caution or probability distortion?  

  ---

  ### **Consensus vs. Live Debates**
  - **Settled**:  
    - RWEU *describes* Allais choices better than linear EU.  
    - Rank-dependent models outperform EU in experimental fits.  
  - **Live Debates**:  
    - **Normative Status**: Is RWEU *rationally permissible*? Critics say it violates dominance or invites dynamic inconsistency; proponents cite axiomatic foundations.  
    - **Scope**: Does RWEU apply to "grand world" decisions, or only isolated bets?  
    - **Origins of Weighting**: Are risk weights stable traits (rational) or context-dependent heuristics (biases)?  

  **Bottom Line**: RWEU’s core vulnerability is dynamic inconsistency. If sequences expose its choices as regret-inducing or pumpable, it struggles as a *normative* model. Its strength is explaining context-specific risk attitudes without invoking biases—but this permissiveness risks unfalsifiability. To defend it, proponents must show risk weights are stable, commitment-strategies are feasible, and background risk doesn’t collapse its uniqueness.
