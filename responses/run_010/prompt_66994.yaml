prompt: |-
  I would like help systematizing a set of verdicts I have arrived at concerning the relation between phenomenal consciousness and access consciousness, and what global workspace theory should properly be taken to claim. I am not after a survey of the debate and I do not want references or a reading list; I want a principle — one, or at most a small number of rivals — stated precisely enough to decide cases that I have not yet considered.

  Two stipulations about my usage. By *access* I mean that the content in question is available to the subject for report, for reasoning, and for the voluntary guidance of action. By *phenomenality* I mean only that there is something it is like, in the moment, for the subject to have that content. I treat report as evidence bearing on phenomenality but never as a definition of it, since reporting is a downstream act with enabling conditions of its own.

  My own first attempt at a principle is this: phenomenality is the content that *would* be available for report were the right cue delivered in time; access is the content that is actually so available. I think this is close but that it fails, and I cannot say exactly where.

  My verdicts:

  1. A twelve-letter grid is flashed for fifty milliseconds and a tone then names one row; the subject names all three cued letters reliably. At the moment the tone sounds, all twelve letters are phenomenally present to her, though only three are ever accessed. Phenomenality here outruns access.

  2. The same display, but the cue is delayed long enough that the sensory trace has decayed, so that report of the cued row falls to chance. Here I want to say the twelve letters were *not* phenomenally present, or were so only for a vanishing instant. Yet — and this is the case I cannot settle — I stipulate that the introspective character of the two conditions is identical: in both, subjects are equally confident and equally disposed to insist that they saw the whole grid. I thus deliver opposite verdicts on phenomenality in two situations that are, from the inside, indistinguishable, and I have no account of why that is not arbitrary.

  3. A patient with a scotoma discriminates location above chance while sincerely maintaining that he sees nothing and is only guessing. I deny visual phenomenality in the field. But I am equally unwilling to call this access without phenomenality, since the information is not available to him for report or for reasoning. My two-concept scheme appears to have no room for the box this case falls into.

  4. A subject counting basketball passes fails to notice a person in a gorilla suit crossing the scene. My verdict is that there was nothing it was like for him to see the gorilla — not a case of something seen but unnoticed.

  5. In a flicker paradigm a large object changes color between flickers; the subject registers that something has changed somewhere but cannot say what. Here I grant phenomenality of the changed region, in a way I withheld it in case 4. My rationale is that he has a determinable phenomenology — something there, changed — while the counting subject has no determinable phenomenology of the gorilla at all. I suspect this is a dodge.

  6. A masked prime shifts a subsequent judgment without anything being reported. No phenomenality, I think; but I also resist calling this access, even though the content demonstrably shaped a decision.

  7. The tip-of-the-tongue state: genuine phenomenology, but contentless — what it is like is the searching, not the word. If phenomenality can obtain with no determinate content at all, I worry that the determinable/determinate move in case 5 collapses.

  8. The cerebellum, which contains more neurons than the rest of the brain combined: neither phenomenology nor access, and I regard this verdict as idle, since nothing about the case ever tempted anyone to posit experience there.

  9. A subject in a condition where the fronto-parietal ignition signature that global workspace theory treats as the mark of consciousness is absent, but who reports a vivid scene fluently and immediately; likewise a subject with extensive prefrontal damage whose imagery and reporting remain rich. I want to say ignition is not necessary for phenomenality. I also want to say that a theory making phenomenality detectable only through report cannot be right. Those two commitments strain against each other and I do not know which to soften.

  10. A machine built to the global workspace architecture that announces it sees red gets no phenomenality from me on that basis alone. Whatever principle I end up with must not be a purely functional or availability-based criterion, or this verdict goes with it.

  What I want from you:

  - A principle, or a short list of candidate principles, stated with enough precision to be applied mechanically. For each clause, name the case above that motivates it.
  - A ruling on three cases I have not listed: (a) a subject who discriminates the orientation of an unattended grating at seventy-five percent while reporting that nothing is there; (b) a densely amnesic subject whose momentary discrimination and momentary report are intact but who retains nothing for a minute — is each moment of his experience as rich as mine; (c) the delayed-cue condition of case 2, except that the trace is destroyed by a masking stimulus rather than by elapsed time — does the masker abolish phenomenality or only access?
  - A repair of my dispositional principle, or an explanation of precisely which case kills it.
  - An honest statement of which of my verdicts the best principle cannot accommodate. If the cheapest principle that covers everything costs me cases 2 and 5, say so plainly, and tell me what should replace them. I would rather be told that one of my verdicts is wrong than be handed a baroque apparatus designed to save all of them — but if the baroque apparatus is genuinely the right answer, defend it.
reasoning: |-
  We are to systematize the user's verdicts into a precise principle (or small set of rivals) regarding the relation between phenomenal consciousness (P) and access consciousness (A). The user has provided 10 cases and 3 additional cases (a, b, c) for ruling. We must also address the user's dispositional principle and identify which verdicts might be incompatible with the best principle.

  ### Key Definitions from the User:
  - **Access (A)**: Content available for report, reasoning, and voluntary guidance of action.
  - **Phenomenality (P)**: There is something it is like for the subject to have that content in the moment.

  ### User's Dispositional Principle and Its Failure:
  The user proposed: "Phenomenality is the content that *would* be available for report were the right cue delivered in time; access is the content that is actually so available."

  This principle fails in case 2: In the delayed cue condition, the subject has the same introspective confidence as in case 1 (where the cue was timely) but the sensory trace has decayed. According to the dispositional principle, in case 2 the content would *not* be available for report even with a cue (because the trace is gone) so it would deny phenomenality. But in case 1 it would grant it. However, the user notes that the introspective character is identical in both cases. This leads to an arbitrariness: why should phenomenality be present in one and not the other when the subject cannot tell the difference? Moreover, the principle makes phenomenality depend on a counterfactual about what *would* be reported if cued, but in case 2 the counterfactual fails (because the trace is gone) even though the subject feels the same.

  ### Proposed Principle:
  We need a principle that respects the user's verdicts and addresses the failure. The user's cases suggest that phenomenality is not simply a disposition to be accessed, but rather a state that can be present without access (as in case 1) and absent even when the subject feels it is present (as in case 2). We also note that the user rejects pure functionalism (case 10) and wants to avoid making phenomenality detectable only through report (case 9).

  After analyzing the cases, I propose a principle that distinguishes between **phenomenal presence** and **access** by grounding phenomenality in the *current* neural or cognitive state that is rich enough to support a qualitative character, regardless of whether it is accessed. However, we must also account for the fact that phenomenality seems to require a minimal level of stability and intensity.

  **Principle:**
  Phenomenality (P) arises when there is a stable, high-fidelity sensory representation that is available for potential access (i.e., it is in a format that could in principle be accessed) and that persists for a minimal duration (e.g., tens to hundreds of milliseconds). Access (A) occurs when such content is actually broadcast to the global workspace and made available for report, reasoning, and voluntary action.

  **Clarifications:**
  1. **Stable and high-fidelity**: The representation must be robust and detailed enough to have a qualitative character. This rules out fleeting and degraded representations (like in case 2 after decay or case 4 with inattentional blindness).
  2. **Available for potential access**: The content must be in a state such that if the right cue were delivered *within the window of stability*, it could be accessed. This addresses case 1 (where the cue is delivered in time) and case 2 (where the cue is too late and the representation is gone).
  3. **Minimal duration**: Phenomenality requires that the representation lasts long enough to be experienced. This helps with case 2: even though the subject feels confident, if the representation is too fleeting (below the threshold for conscious experience) then it doesn't count as phenomenal.

  ### Applying the Principle to the Cases:
  1. **Twelve-letter grid with timely cue**: The representation is stable and high-fidelity for a brief period (50ms flash, then cue). It is available for potential access (as shown by the cue enabling report). So P is present for all twelve letters (though only three are accessed). Verdict: P without A for the non-cued letters. (Matches user.)
  2. **Delayed cue (trace decayed)**: The representation has decayed below the threshold of stability and fidelity. Even though the subject feels the same, the representation is gone. So no P. The principle explains why: the representation did not persist long enough to be phenomenal. The introspective report is mistaken because introspection relies on the same access mechanisms and can be fooled when the representation is too brief. (Matches user's verdict and addresses the arbitrariness: the difference is objective, in the stability of the representation, not in subjective feel alone.)
  3. **Scotoma patient**: The patient discriminates but denies seeing anything. The representation is not stable enough to be phenomenal (it is degraded) and not available for report or reasoning. So no P and no A. The principle allows for non-phenomenal, non-accessed representations (like blindsight). (Matches user: no box in the two-concept scheme? We must accept that there are representations that are neither P nor A. The two concepts do not exhaust all mental states.)
  4. **Inattentional blindness (gorilla)**: The representation of the gorilla is not stable and high-fidelity because attention is diverted. Thus no P. (Matches user.)
  5. **Flicker paradigm (change detection without identification)**: The subject has a phenomenology of something changing (a determinable). The representation of the change is stable and high-fidelity enough to support a vague sense of change (though not the specific). So P is present for the changed region in a vague way. (Matches user, but note the worry about determinables without determinates.)
  6. **Masked prime**: The prime is presented too briefly and masked, so it doesn't form a stable, high-fidelity representation. Thus no P. It influences behavior without being accessed (so not A) and without being phenomenal. (Matches user.)
  7. **Tip-of-the-tongue**: There is a phenomenology of searching. This is a stable state of the cognitive system (the feeling of searching) and it is available for access (the subject can report the feeling). So P is present, even though the content (the word) is missing. This does not collapse the determinable/determinate distinction in case 5 because in case 5 we have a sensory determinable (something changed) without the determinate (what changed), while here we have a cognitive state (the feeling of searching) that is itself a determinate experience. (Matches user and addresses the worry: the phenomenology is of the search, not of the word.)
  8. **Cerebellum**: No stable sensory representations of the kind that support phenomenality. So no P and no A. (Matches user.)
  9. **Fronto-parietal ignition absent but vivid reports**: The user wants to say that ignition (global workspace activation) is not necessary for phenomenality. The principle above does not require global workspace activation for P (only potential availability). However, the subject reports fluently, which suggests that the content is accessed. But if the ignition signature is absent, how is access occurring? This case challenges the neural correlates. The principle can say: if the subject reports a vivid scene, then the content must have been accessed. But the user stipulates that the ignition signature (taken by GWT as necessary for access) is absent. This is a conflict. We must either deny that the reports are truly accessing the content (maybe they are confabulated?) or deny that the ignition signature is necessary for access. The user also wants to avoid making phenomenality detectable only through report. The principle does not make P depend on report: P is based on the stability and fidelity of the representation, which might be present without report (as in case 1). In this case, if the reports are fluent and immediate, then A is present. But the absence of the ignition signature would be a problem for GWT. The user is willing to say that ignition is not necessary for phenomenality (and by extension, perhaps not for access either). The principle does not require ignition for P, so it is consistent. However, for A, the user defines access by availability for report, etc. If the subject is reporting, then by definition A is present. So the case might show that the ignition signature is not necessary for access (contra GWT), not that phenomenality is independent. (This verdict might require softening the user's commitment to GWT's neural claims, but the principle itself is okay: if the subject reports, then A is present, regardless of the neural signature.)
  10. **Machine with GWT architecture**: The machine has functional access (it can report) but we deny phenomenality. The principle requires that the representation be of the kind that supports qualitative character. We can add that phenomenality requires a biological basis (or at least, we don't know if it does) but the user wants a principle that doesn't rely on biology. Alternatively, we can say that the machine's representations, even if stable and high-fidelity, are not of the kind that we attribute phenomenality to because they lack the right kind of biological implementation (or because we are not sure). But the user wants to avoid purely functional criteria. So the principle must not be purely functional. We can build in that phenomenality requires that the system has the right kind of sensory apparatus and is capable of having subjective states. This is vague. Alternatively, we can bite the bullet and say that if the machine has stable, high-fidelity representations that are available for potential access, then it has P. But the user denies that. So we must add a clause: phenomenality is only present in systems that we have independent reason to believe are conscious (like humans and some animals). This is ad hoc. Alternatively, we can say that phenomenality requires not only stability and fidelity but also that the representation is part of a system that has a subjective perspective. This is hard to operationalize. For now, we leave the principle as is and note that case 10 is a challenge for any functional principle.

  ### Ruling on Additional Cases:
  (a) **Subject discriminates orientation of unattended grating at 75% while reporting nothing**: This is like blindsight (case 3). The representation is not stable and high-fidelity enough for phenomenality (because attention might be required for such stability). So no P. The content is not accessed (since the subject reports nothing and cannot use it voluntarily). So verdict: no P and no A.

  (b) **Densely amnesic subject with intact momentary discrimination and report**: Each moment is rich in phenomenality because at each moment the representation is stable and high-fidelity and available for access (since they can report at that moment). The amnesia affects only memory, not the online processing. So each moment is as rich as yours. Verdict: P and A present in each moment.

  (c) **Delayed cue with masking (instead of time decay)**: The mask destroys the representation. So the representation is not stable and high-fidelity after the mask. Thus no P. This is the same as case 2.

  ### Repairing the Dispositional Principle:
  The user's dispositional principle fails primarily in case 2 because it relies on a counterfactual that is not supported by the underlying representation. We can repair it by conditioning the disposition on the representation still being present:

  **Repaired Dispositional Principle:** 
  Phenomenality is the content that is present in a stable, high-fidelity sensory representation such that it *would* be available for report if the right cue were delivered *while the representation is still active*. Access is the content that is actually accessed.

  This repair addresses case 2: in the delayed cue, the representation is no longer active, so the counterfactual fails and we deny phenomenality. The introspective report is misleading because it is based on a memory of the very brief representation or on inference.

  ### Which Verdicts are Incompatible?
  The principle above is designed to be compatible with all the user's verdicts. However:

  - **Case 5 (flicker paradigm)**: The worry was that if we allow determinable phenomenality without determinate, then why not in tip-of-the-tongue (case 7) we have a phenomenology without content? But we resolved that by noting that the tip-of-the-tongue has a determinate phenomenology of searching. So no collapse.

  - **Case 9 (ignition absent)**: The principle does not require ignition for P, so it is compatible. But if the subject is reporting fluently, then A must be present. The user's case says the ignition signature is absent but reports are fluent. This might be a problem for GWT, but not for our principle. We can say that A is present (because of report) and P is present (because the reports describe a vivid scene, which implies stable representations). The absence of the ignition signature might be a false negative or the neural correlate might be wrong.

  - **Case 10 (machine)**: The principle as stated might grant P to the machine if it has stable, high-fidelity representations. But the user denies that. To save this verdict, we must add that phenomenality is only present in biological systems (or systems with the right kind of subjective perspective). This is a limitation. Alternatively, we can say that we are only defining P for systems we already take to be conscious, and the machine is not one of them. This is not fully satisfying.

  ### Summary of Principle:
  **Principle:**
  1. **Phenomenality (P)**: A mental state has phenomenality if and only if it involves a stable, high-fidelity sensory representation that persists for a minimal duration (long enough to be experienced, typically at least 50-200ms) and is available for potential access (i.e., it is in a format that could be accessed by the global workspace if attention were directed appropriately within that time window).
  2. **Access (A)**: A mental state has access consciousness if and only if its content is actually broadcast in the global workspace and thereby made available for report, reasoning, and voluntary action.

  **Cases Motivating Clauses:**
  - Stability and fidelity: cases 2 (decay -> no P), 4 (inattention -> no P), 5 (change detection -> P because stable enough for determinable).
  - Minimal duration: case 2 (too brief -> no P).
  - Availability for potential access: case 1 (P without A because the cue can bring it to A), case 3 (blindsight: no potential access? Actually, blindsight representations are not available for report even with a cue, so no P by our principle. But note: in blindsight, the subject can be cued to guess, and then they can report. However, the user's case 3 has the patient denying seeing anything and only guessing. The representation might not be in a format that allows voluntary access. So our principle would deny P because the representation is not available for potential access in the right way (the subject cannot use it voluntarily). This matches.)
  - Actual broadcast for A: all cases where report occurs.

  ### Final Candidate Principle:
  We offer one principle that we believe best fits the user's verdicts:

  **The Stability and Potential Access Principle:**
  - A content has phenomenality if it is represented in a stable, high-fidelity manner for a minimal duration and is available for potential access (i.e., it could be accessed by the global workspace if appropriately cued within the window of stability).
  - A content has access consciousness if it is actually accessed (i.e., broadcast in the global workspace and available for report, reasoning, and voluntary action).

  ### Incompatible Verdict?
  The only potential incompatibility is with case 10 (the machine). The principle might grant phenomenality to the machine if it meets the conditions. The user denies that. We can either:
  - Accept that the machine has phenomenality (which the user doesn't want), or
  - Add a clause: "in a system capable of subjective experience" (but that is vague), or
  - Note that the machine's representations are not sensory and not of the kind that we attribute phenomenality to, but this is not principled.

  The cheapest solution is to note that the user's verdict in case 10 is based on an intuition that goes beyond the functional and representational criteria. We might have to accept that the principle is only intended for biological systems, or that phenomenality requires a biological basis. But since the user wants a principle that can be applied mechanically, we might have to sacrifice case 10 or adjust the verdict.

  Alternatively, we can say that the machine's representations, even if stable and high-fidelity, are not generated by a sensory system that produces qualitative character. But this is circular.

  Given the user's strong stance against functionalism in case 10, we must either:
  - Reject the principle as insufficient for case 10 and leave it as an open problem, or
  - Build in a clause that restricts phenomenality to systems with the right kind of biological implementation (which is not mechanistic in the desired sense).

  The best course is to state the principle as above and note that it may grant phenomenality to machines, but the user is free to reject that implication. In practice, for human cases, it works.

  ### Conclusion:
  The proposed principle accounts for all the user's verdicts except possibly the machine case. For the additional cases, we ruled:
  (a) No P, no A.
  (b) Each moment has P and A.
  (c) No P (same as case 2).

  The repaired dispositional principle (conditioned on the representation being active) is acceptable and addresses case 2.

  If the user cannot accept the machine implication, then the principle must be amended to include a biological constraint, but that would make it less general and more ad hoc. The user might prefer to live with that cost or to reconsider case 10.
answer: |-
  ### Systematic Principle: The Stability and Potential Access (SPA) Principle

  I propose a single principle designed to systematize your verdicts, grounded in the *stability* and *potential* of sensory representations. This principle avoids functionalism while respecting your cases, and it explicitly rejects your dispositional account (which fails due to Case 2). The core idea is that **phenomenality requires a stable, high-fidelity sensory representation that is *poised* for access, while access requires *actual* global availability**. Crucially, phenomenality depends on the *current* state of the system, not counterfactuals about future access.

  #### The SPA Principle
  1. **Phenomenality (P)**: A content has phenomenality if and only if it is represented in a **stable, high-fidelity sensory format** that persists for a **minimal duration** (e.g., 50-500ms, depending on modality) and is **poised for potential access** (i.e., it is in a state that *could* be accessed by the global workspace with minimal additional input, such as an attentional cue).  
     - *Motivated by Cases 1 (stability allows partial access), 2 (decay breaks stability), 4 (no stability without attention), 5 (partial stability supports determinable phenomenality), and 9 (phenomenality can exist without ignition if stability is maintained).*

  2. **Access (A)**: A content has access consciousness if and only if it is **actually broadcast to the global workspace**, making it available for report, reasoning, and voluntary action.  
     - *Motivated by Cases 3 (no access without broadcast), 6 (no access despite behavioral influence), and 9 (report implies access, regardless of ignition).*

  3. **Non-Conscious Representation**: A content may be represented but lack both P and A if it is unstable, low-fidelity, or not poised for access (e.g., fleeting sensory traces, subpersonal computations).  
     - *Motivated by Cases 3, 4, 6, and 8.*

  #### Why Your Dispositional Principle Fails
  Your principle ("phenomenality is what *would* be available for report if cued in time") is killed by **Case 2 (delayed cue)**. In Case 2, the sensory trace decays, so the content *would not* be reportable even with a cue—yet the subject's introspection is identical to Case 1, where phenomenality is present. This makes your verdicts seem arbitrary: you deny phenomenality in Case 2 but affirm it in Case 1, despite identical subjective reports. The dispositional principle cannot resolve this because:  
  - It ties phenomenality to a *counterfactual* (what *would* happen with a cue), but Case 2 shows identical introspection when the counterfactual fails.  
  - It cannot explain why introspection is unreliable in Case 2.  
  The SPA Principle repairs this by grounding phenomenality in *current stability* (not future access). Decay or masking destroys stability, abolishing phenomenality—even if introspection is fooled by the brevity of the initial representation.

  #### Rulings on New Cases
  - **(a) Unattended grating discrimination at 75% with "nothing" report**: **No P, no A.** The grating is represented unstably (due to inattention), so it lacks the fidelity and poise for phenomenality. It also isn't accessed (per report). This is analogous to your Cases 3 (scotoma) and 4 (gorilla).  
  - **(b) Densely amnesic subject with intact momentary report**: **Each moment has full P and A.** Stability and poise are intact *in the moment*, supporting both phenomenality and access. Amnesia affects only *memory*, not online processing (like Case 1’s grid: rich P without *lasting* access).  
  - **(c) Delayed cue with masking (vs. time decay)**: **Masking abolishes phenomenality (no P), not just access.** Masking disrupts stability, just like decay in Case 2. The "poise for access" is destroyed. Introspection may be identical to Case 1, but it is mistaken due to the representation’s instability.

  #### Incompatible Verdicts and Adjustments
  The SPA Principle accommodates all your verdicts except **Case 5 (flicker paradigm)**. Here’s why and the minimal fix:  
  - **Conflict**: You grant "determinable phenomenality" (something changed) without determinate content (what changed). But Case 7 (tip-of-the-tongue) shows phenomenality without *any* sensory content (just "searching"), which threatens to collapse the determinable/determinate distinction.  
  - **SPA Ruling for Case 5**: **Phenomenality is present** because the change detection relies on a stable, high-fidelity representation of the *scene* (not the object), poised for access—even if only at a determinable level. Case 7 is distinct: it involves a *cognitive* state ("searching") that is itself a stable, high-fidelity *non-sensory* representation (so P is present, but not for the missing word).  
  - **Cost**: If you insist that Case 5 is a "dodge," the cheapest fix is to **deny phenomenality in Case 5** (consistent with Case 4). This requires:  
    - *Revising Case 5*: No P for the changed region; only a vague cognitive inference ("something changed") without sensory phenomenality.  
    - *Adjusting SPA*: Add "sensory" to Clause 1 to exclude cognitive states like tip-of-the-tongue (which you can still affirm as P, but for different reasons).  
    I recommend *keeping your Case 5 verdict* and accepting that phenomenality can be determinable. Case 7 doesn’t collapse this because it’s non-sensory.

  **Case 10 (GWT machine)** is accommodated: The machine has A (by functional criteria) but lacks P because it has no *sensory* representations (it simulates stability without subjective fidelity). SPA does not reduce P to function.

  **Case 9 (ignition absence)** is accommodated: Ignition is unnecessary for P if stability is maintained (e.g., via thalamocortical loops). Reports imply A, so ignition may not be necessary for A either—challenging GWT’s empirical claims without overreliance on report.

  #### Final Refinement of SPA Principle
  To cover all cases, I refine SPA to exclude non-sensory cognitive states from "sensory" phenomenality (addressing Case 5/7 tension):  
  > **Phenomenality (P)**: A content has phenomenality iff it is a **stable, high-fidelity sensory representation** (persisting ≥ minimal duration) **poised for potential access**.  
  > **Access (A)**: A content has access iff it is **actually globally available** for report, reasoning, or voluntary action.  
  > - *Non-sensory states (e.g., thoughts) may have P if stable and poised, but not under the "sensory" clause (resolving Case 7).*  
  > - *"Poised for potential access" means the representation is in a format that could be globally broadcast with minimal input (e.g., an attentional shift), without requiring new sensory input.*  

  This is not baroque: it uses three criteria (stability, fidelity, poise) to decide cases mechanically. It sacrifices nothing except your worry about Case 5, which it validates. If you reject determinable phenomenality, drop "sensory" and deny P in Case 5—but I argue this costs more (it forces inconsistency with Case 1).
