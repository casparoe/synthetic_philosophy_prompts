prompt: |-
  You are a professional metaphysician who specializes in the philosophy of time and who is accustomed to explaining technical disputes to advanced high school students. Please think carefully before answering, and begin with a short brainstorming section in which you list the candidate differences between the two views I describe below, then sort them into differences that are merely verbal and differences that are genuinely substantive; only after that should you write up your full answer. My situation is this: I am a high school junior taking an independent study in philosophy alongside AP Physics, and my project is a comparison of presentism (the view that only present things exist) with eternalism (the view that past, present, and future things all exist, spread out along the temporal dimension much as places are spread out along the spatial dimension). My teacher insists the disagreement is deep rather than semantic, but I have been unable to pin down where the depth lies, because presentists and eternalists seem to agree about every ordinary tensed sentence I can think of: both say dinosaurs roamed the earth, both say Caesar was assassinated, both say my graduation has not happened yet. So my first question is to state as precisely as you can what, if anything, the two views disagree about once all ordinary tensed claims are held fixed, and to tell me whether a deflationary reading on which the dispute is merely verbal can be maintained.

  Second, I constructed three cases of my own, and I would like you to use them as the backbone of the comparison rather than reciting familiar textbook examples. Case one, gratitude: my grandmother died four years ago and I still feel gratitude toward her. Under presentism she does not exist, so it looks as though my gratitude lacks an object; under eternalism she exists, but only as something located in the past, and it is not obvious that gratitude directed at a past stage of a person is the same attitude I actually have. Explain how each view is supposed to handle this and say which handles it better. Case two, the moving spotlight: a friend of mine proposed a third option on which everything exists at every time, exactly as the eternalist says, but in addition there is an objective property of presentness that sweeps along the block of spacetime. Tell me whether this is a real third position with distinctive content or whether it collapses back into eternalism with extra decoration, and what would have to be true for that property to be doing genuine work. Case three, the rotating platform: in physics we learned that clocks on a rotating disc cannot be synchronized consistently all the way around the rim, so an observer living on the disc has no single global notion of simultaneity. Since the presentist's now seems to require exactly such a global slice, please assess whether this kind of situation is a genuine threat to presentism, a threat only to a presentist who insists that the slice be picked out by the ordinary relativistic rule, or no threat at all because a presentist may freely choose some other way of slicing spacetime into successive nows. Be explicit about which parts of your answer here rest on physics you are confident about and which are contested interpretations.

  Third, I would like a verdict and a comparison table. After the analysis, set the two views side by side with respect to what exists, what makes past-tensed sentences true, whether relations to non-present things are possible, what each view demands of one's account of spacetime, and how much of the disagreement survives a charitable reconstruction of both sides. Then tell me which view you think is better supported overall and give your reasons, including any point where you believe the standard argument for the winning side is weaker than its defenders admit. Two practical constraints: please do not give me a bibliography, a reading list, or citations, because I cannot look anything up and half-remembered references would only mislead me; and wherever you are unsure of a detail, say so plainly instead of filling in the gap. Finally, please define every technical term the first time you use it, since my teacher is the only person I know who has read this material and I would like to be able to defend my project to the rest of my philosophy club.
