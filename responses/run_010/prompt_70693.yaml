prompt: |-
  I'm giving a 40-minute talk at a workshop where the room is mostly applied behavioral scientists — people who design opt-out defaults, reminder texts, and savings auto-enrollment for public programs — plus two political philosophers who work on domination. My thesis is that what makes influence manipulative isn't that it sidesteps the target's reasoning (defaults sidestep reasoning, and everyone in that room knows it), but that it's reason-insensitive in a specific sense: the influencer locked in the message with no procedure that would have changed it had the target's actual reasons pointed the other way. So manipulation is a property of the influencer's process, not of the target's psychology, and a well-funded, evidence-based program can be manipulative while a slimy used-car pitch can come out clean.

  Can you draft my Q&A prep sheet? I want the handful of objections this room will actually press — not the generic autonomy-and-consent ones you'd get from a straight ethics audience — ordered by how much damage each does to the view. For each: how they'd phrase it in their own vocabulary (I'm expecting talk of RCTs, treatment effects, heterogeneity, informed consent forms, and one philosopher who will push the domination angle hard), a two-minute reply I can actually say out loud, and a blunt note on where my reply is soft. Also tell me what I should just concede in the first ten minutes to buy goodwill, and flag the one question I'm praying nobody asks. It's my own account, so there's nothing to cite — don't pad it with references, and write it in American English.
reasoning: |-
  Okay, let me start by really understanding what the user needs here. They're preparing for a Q&A after a 40-minute talk at a workshop with applied behavioral scientists and two political philosophers. The core thesis is that manipulation isn't about bypassing reasoning but about the influencer's process being reason-insensitive—locked in without considering the target's actual reasons.

  First, I need to identify the key objections this specific audience might raise. The audience consists of people who design interventions like opt-out defaults and reminder texts, so they'll likely focus on practical aspects like RCTs, heterogeneity, and real-world constraints. The philosophers will probably push on domination and structural issues.

  The user wants the Q&A prep to prioritize objections by how damaging they are to their thesis. I should avoid generic ethics arguments and instead focus on the room's expertise. Terms like treatment effects, heterogeneity, and informed consent will come up. One philosopher will emphasize domination.

  For concessions, the user should acknowledge upfront that bypassing reasoning isn't inherently bad. This builds goodwill with behavioral scientists who know defaults work. Also, admitting that intent isn't the focus might preempt some critiques.

  The most dangerous question seems to be about distinguishing reason-insensitivity from regular evidence-based adjustments. If asked, it could reveal a flaw where the thesis might conflate updating messages with being reason-sensitive. The reply needs to clarify that minor tweaks don't count if the core message is fixed, but this is a soft spot.

  Next, objections:
  1. **Heterogeneity Concerns**: Applied scientists might say they do adjust for subgroups. Reply: Acknowledge subgroup tweaks but stress that the core architecture remains fixed without considering individual reasons. Soft spot: Some programs might genuinely incorporate feedback loops.
  2. **RCT Pragmatism**: They might argue that locking interventions is necessary for clean results. Reply: Concede practicality but differentiate between research and deployment. Soft spot: Blurs the line between study design and real-world application.
  3. **Domination via Structure**: Philosophers might say structural factors overshadow reason-sensitivity. Reply: Agree but argue that reason-insensitivity compounds structural issues. Soft spot: Doesn't fully address how structural power dynamics interact with individual influence.
  4. **Consent Forms as Safeguards**: Mentioning consent forms as addressing manipulation. Reply: Consent forms can be part of the locked process themselves. Soft spot: Doesn't tackle if proper consent could mitigate manipulation.
  5. **Slippery Slope to Inaction**: Fear that labeling interventions as manipulative could halt beneficial programs. Reply: Shift focus to redesigning processes, not stopping work. Soft spot: Practical roadmap is vague.

  The user should pray not to get the question about minor adjustments vs. core message changes. If asked, they need to explain that superficial tweaks don't equate to reason-sensitivity, but it's tricky because evidence-based programs often test variations, which might count as procedural adjustments.

  Also, ensuring replies are concise—two minutes each—using relatable examples like retirement savings defaults vs. used-car sales. Highlighting that behavioral tools can be manipulative even with good intentions, while a transparent used-car pitch isn't, if it adapts to buyer's concerns.

  Need to check if all objections are ordered by damage. The heterogeneity objection is top because it directly challenges the applicability of the thesis to their work. The RCT objection is next as it questions the feasibility. The domination point is critical but from a different angle. Consent and slippery slope are less damaging but still need addressing.

  Concessions early on: Admit that bypassing reasoning is effective and not always bad, and that intent isn't the issue. This aligns with the audience's values and reduces defensiveness.

  Finally, the unseen flaw: The user's framework might not account for interventions that have feedback mechanisms built-in, which could be perceived as reason-sensitive. The reply needs to distinguish between superficial adjustments and fundamental changes based on individual reasons.
answer: |-
  Here's your Q&A prep sheet, prioritized by damage potential and tailored for this audience. I've framed objections in their likely language, given tight replies, flagged soft spots, and noted strategic concessions.  

  ### **Top 5 Objections (High to Low Damage)**  
  1. **Objection: "Heterogeneity testing *is* our procedure for reason-sensitivity. We segment populations and adjust treatments based on pre-defined subgroups (e.g., income brackets). Doesn’t that satisfy your condition?"**  
     - *Why it hurts*: Directly challenges your core claim by arguing their *process already incorporates* reason-responsiveness.  
     - **Your 2-minute reply**:  
       "Great point. But subgroup adjustments react to *predictive analytics*, not the target’s actual reasons. If your RCT shows low-income folks respond better to loss-framed messages, you lock that in for everyone in that bracket — even if Maria, who just got a bonus, now has reasons to save more aggressively. Your process is evidence-driven, not reason-sensitive: it won’t pivot if Maria’s actual reasons defy the model. A non-manipulative process would let *her* reasons override the algorithm."  
     - **Soft spot**: Blurs the line between "statistical" and "individual" reason-sensitivity. Hard to prove Maria’s case matters in scale-driven work.  

  2. **Objection (Philosophers): "This ignores structural domination. A used-car dealer adapts to your reasons? Sure — but if you’re poor and need a car, you’re still coerced by market forces. Isn’t manipulation just a symptom of power asymmetry?"**  
     - *Why it hurts*: Reframes your thesis as naive liberalism, ignoring systemic power. The philosophers will rally allies here.  
     - **Your 2-minute reply**:  
       "Absolutely, domination matters. But reason-insensitivity *compounds* it. When the state auto-enrolls you in a pension with no opt-out for gig workers — who have rational reasons to avoid illiquid savings — it layers procedural domination onto structural domination. The used-car case shows reason-sensitivity *can* exist without structural power; the pension shows the reverse isn’t true. We need both lenses."  
     - **Soft spot**: Concedes that reason-sensitivity alone can’t fix domination. Might feel like dodging to activists.  

  3. **Objection: "Lock-in is necessary for clean RCTs! If we tweak interventions mid-trial, we can’t measure treatment effects. You’d kill evidence-based policy."**  
     - *Why it hurts*: Paints you as anti-science. Applied researchers will nod vigorously.  
     - **Your 2-minute reply**:  
       "I’m not attacking RCTs. Lock in during *research*? Essential. But when you deploy that intervention at scale, you freeze it — even after learning it ignores real-world reasons. *That’s* the manipulation risk. Imagine a savings program that never updates its opt-out rules, even after surveys show parents skip it to pay medical bills. Good science shouldn’t justify rigid implementation."  
     - **Soft spot**: Doesn’t solve the tension between research purity and adaptive delivery.  

  4. **Objection: "What about informed consent? Our IRB forms disclose nudges. Doesn’t that make the process ‘reason-sensitive’ by your logic?"**  
     - *Why it hurts*: Uses your jargon against you; implies bureaucracies can "check the box" to avoid manipulation.  
     - **Your 2-minute reply**:  
       "Disclosure isn’t sensitivity. Consent forms are static legal shields — they don’t change if your reasons change. If you’re auto-enrolled in a health plan today, and tomorrow your kid gets sick and you need cash, that form won’t help you opt out faster. A truly sensitive process would let life events trigger immediate reevaluation. Paperwork ≠ procedural justice."  
     - **Soft spot**: Overstates the fix. Some systems *do* allow life-event overrides (e.g., ACA special enrollment).  

  5. **Objection: "So we’re manipulative if we don’t personalize everything? That’s unrealistic. Defaults work *because* they’re one-size-fits-most."**  
     - *Why it hurts*: Positions your view as purist and impractical.  
     - **Your 2-minute reply**:  
       "Not at all. Defaults can be non-manipulative if there’s a *responsive* backdoor. Example: A retirement plan that auto-enrolls you but also texts, ‘Reply STOP if you’re saving for a home down payment instead.’ It’s scalable *and* reason-sensitive — unlike one that ignores ad-hoc opt-outs. I’m not demanding bespoke design, just processes that listen when reasons conflict with defaults."  
     - **Soft spot**: "Reply STOP" is still pre-scripted. Doesn’t handle complex reasoning.  

  ---  

  ### **Strategic Concessions (Offer Early to Build Goodwill)**  
  Lead with these in your intro or first Q&A response:  
  - **"Bypassing deliberation isn’t inherently bad."**  
    *Why*: Nod to their expertise. "Defaults save lives when people are overwhelmed — I’m not here to trash that."  
  - **"Manipulation isn’t about intent or outcomes."**  
    *Why*: Pre-empts "But our intentions are good!" or "Our nudge increases savings!". Shifts focus to process.  

  ---  

  ### **The Question You Pray Nobody Asks**  
  **"If an influencer *would* change their message upon learning new reasons (e.g., via post-deployment surveys), but the target never voices those reasons, is it still manipulative?"**  
  - *Why it’s deadly*: Forces you to admit your definition hinges on counterfactuals ("*would* they change if reasons changed?"), which are unprovable. It collapses into guesswork about the influencer’s hypothetical actions.  
  - **If asked**:  
    "In practice, we assess sensitivity via *accessible procedures* — like an obvious feedback channel. If the target can’t reasonably signal their reasons, the process is insensitive by design. But yes, this has epistemic limits."  
  - **Damage control**: Quickly pivot to real-world cases. "Look at student loan defaults: Borrowers *try* to explain hardships, but automated systems ignore them. That’s empirical, not hypothetical."  

  ---  

  **Final note**: Your strongest shield is the **used-car sales vs. public program** contrast. Hammer it: "The salesman who hears ‘I need cargo space’ and pivots to minivans is *less* manipulative than a state program that ignores citizens’ reasons because ‘the RCT proved this default works.’" This flips their moral self-image — which is why they’ll fight hard. Stay grounded in institutional processes, not philosophy.
