  ### Step 3: Addressing Underdetermination and Panel’s Commitments  
  **Underdetermination**: The record does *not* underdetermine the outcome. Rule K cleanly applies: Preservation created branching potential, and reassembly realized it, mandating backdated cessation.  

  **If Panel Rejects Rule K and Rules for Persistence (Synthetic Person)**:  
