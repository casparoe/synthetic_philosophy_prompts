prompt: |-
  I am at work on a novel whose protagonist directs the whole grants program of a small private foundation, and whose method — announced once, early, and never revisited — is to rank candidate causes by importance, tractability, and neglectedness. My editor has asked whether her record actually hangs together. In the manuscript to date she has ruled on five proposals:

  - Funded: stockpiling and clinically preparing a broad-spectrum antiviral against a virus family that has never caused a human pandemic — small probability, catastrophic payoff, no other funder interested, and a concrete procurement path.
  - Funded: a cheap sensor network for the early detection of a crop pathogen that has not crossed into the region but would destroy its staple harvest if it did.
  - Funded: a small team attempting a speculative approach to a stubborn disease, with perhaps a one-in-twenty chance of a decisive result.
  - Declined: scaling a well-evidenced, moderately beneficial health intervention in a district where a larger donor has already committed to paying for the entire scale-up.
  - Declined: a diffuse awareness campaign on an issue she herself calls urgent, with no measurable mechanism and a dozen other funders already at work.

  The climax turns on a sixth proposal: a permanent clinic-and-registry operation for a chronic condition — proven methods, substantial but steady benefits, no other funder presently involved, and an applicant who tells her plainly that a government program launching in two years will cover it if she declines, so that her money buys only two years of earlier treatment.

  Which way should she rule if she is to remain consistent with herself, and which way do you predict she will rule? What decision rule do the five verdicts actually express — it need not be the three-factor one I gave her — what other rules fit them equally well, and how would each come out on the sixth proposal? What seventh proposal could I introduce that would force the surviving rules apart? And where her record genuinely permits more than one answer, tell me which commitment she would be adopting with each option, since that is exactly what my readers will take to be her character.
reasoning: |-
  Okay, the user is writing a novel about a foundation grants director who uses importance, tractability, and neglectedness to evaluate proposals. The editor questioned if her decisions are consistent, so the user provided five examples and wants help with the sixth pivotal decision. 

  First, I need to analyze the five existing decisions to infer her actual decision rule. The funded projects all involve high stakes (catastrophic or significant consequences) paired with unique opportunities where no one else is stepping in. The declined ones either duplicate existing efforts or lack clear impact pathways. 

  Hmm, the common thread seems to be "unique leverage" – she funds where her foundation can make a decisive difference others won't. The three stated factors are present but operate through this lens: neglectedness becomes the gateway, importance and tractability then determine scale of impact. 

  For the sixth proposal... the clinic. It's important and tractable but not neglected (government will cover it in 2 years). Consistent application of the unique leverage rule would mean declining – her money only buys acceleration, not permanent solution. If she approves, it'd break her pattern unless she values immediate relief over systemic impact. 

  The user also wants a seventh proposal to test competing interpretations. Something that contrasts concrete but incremental impact vs. high-risk systemic change could force the character to reveal her priorities. For example: funding lab equipment for underresourced researchers (tangible but small-scale) versus backing a policy advocacy group aiming to shift billion-dollar budgets (high risk/reward). 

  Notably, the character's consistency hinges on whether she prioritizes marginal impact (only fund what wouldn't happen otherwise) or total impact (fund anything beneficial). Her past choices strongly suggest the former. Approving the clinic would imply character growth – choosing compassion over rigor – which might be the dramatic turn the climax needs.
answer: |-
  Based on her five rulings, her **actual decision rule** is **Maximizing Unique Leverage:** *Fund only where our resources are uniquely positioned to unlock significant impact that wouldn't otherwise occur, prioritizing high-stakes opportunities.*

  Here's the breakdown:

  1.  **Funded: Broad-spectrum antiviral:** High stakes (catastrophic payoff), no other funder (unique leverage). Her money unlocks the *only* effort.
  2.  **Funded: Crop pathogen sensor:** High stakes (staple harvest destruction), threat not present yet (likely neglected), concrete solution. Her money unlocks *early* detection *before* catastrophe, likely unique for this threat/region.
  3.  **Funded: Speculative disease approach:** High potential payoff ("decisive result"), likely neglected (speculative, low chance). Her money unlocks *exploration* others avoid.
  4.  **Declined: Scaling proven health intervention:** Beneficial, but *duplicative*. Larger donor covers the *entire* scale-up. Zero unique leverage.
  5.  **Declined: Diffuse awareness campaign:** Important, but *duplicative* and *immeasurable*. A dozen funders already working. Her money adds negligible leverage.

  **The Sixth Proposal: Permanent Clinic/Registry (2-year bridge):**

  *   **Consistent Ruling (Maximizing Unique Leverage): DECLINE.** The applicant explicitly states the government program *will* cover this in two years. Her funding buys only the *acceleration* of benefits by two years. While beneficial, it fails the "unlocks impact that wouldn't otherwise occur" test. The permanent solution *will* happen without her. Her money provides temporary relief, not unique leverage for a permanent outcome. This mirrors declining #4 (duplication) – here, her funding duplicates (or rather, pre-empts) the future government funding.
  *   **Predicted Ruling (Character Insight): DECLINE.** Based solely on her established pattern of ruthless prioritization for unique leverage, she declines. Funding this would be an emotional decision (wanting to help now), inconsistent with her cold calculus in the previous five cases, especially declining the proven intervention (#4) due to duplication.

  **Alternative Decision Rules That Fit the Five Rulings:**

  1.  **Maximizing Expected Value per Dollar (EVD):** Importance (Impact) * Probability (Tractability) / Cost, *contingent on Neglectedness*. Neglectedness is a gatekeeper: Only consider proposals scoring highly on EVD *if* they are sufficiently neglected (no one else will fund it).
      *   **#1:** High Impact (catastrophic) * Small Prob / Cost? (Probably high EVD due to catastrophic upside & low relative cost of prep). Neglected: Fund.
      *   **#2:** High Impact (harvest loss) * High Prob (if pathogen arrives) / Cost? (Likely high EVD for prevention). Neglected: Fund.
      *   **#3:** High Impact (decisive result) * Low Prob (5%) / Cost? (Cost likely low for the potential; high EVD *if* the impact is truly decisive). Neglected: Fund (speculative).
      *   **#4:** Moderate Impact * High Prob / Cost? BUT *Not Neglected* (duplicate funding): Decline.
      *   **#5:** Uncertain Impact (diffuse, immeasurable) * Uncertain Prob / Cost? AND *Not Neglected*: Decline.
      *   **#6:** Substantial Impact * High Prob / Cost? BUT *Not Neglected* (Govt will fund). **DECLINE.** Consistent with #4.

  2.  **Preventing Existential/Catastrophic Risk (CARE):** Prioritize interventions that specifically avert potential catastrophic or existential risks, especially if neglected. Moderate benefits are secondary.
      *   **#1:** Catastrophic Pandemic Risk: Fund.
      *   **#2:** Catastrophic Harvest Risk: Fund.
      *   **#3:** *Not inherently catastrophic risk* (stubborn disease, even if decisive, isn't necessarily catastrophic). *Inconsistent!* She funded it. This rule **doesn't fully fit** #3 unless the disease itself is framed as catastrophic.

  3.  **Funding Only "Moonshots" (High Risk/Reward):** Focus on speculative, high-potential-payoff projects unlikely to be funded elsewhere due to risk.
      *   **#1:** Moonshot (low prob, catastrophic payoff): Fund.
      *   **#2:** *Not a moonshot* (preventative, concrete). *Inconsistent!* She funded it.
      *   **#3:** Moonshot (5% chance): Fund.
      *   **#4:** Not Moonshot: Decline.
      *   **#5:** Not Moonshot: Decline. **Doesn't fit #2.**

  4.  **Avoiding Duplication / Filling Critical Gaps (GAP):** Fund where there is a clear gap in funding for an important need with a viable solution. Decline where others are already covering it adequately.
      *   **#1:** Critical Gap: Fund.
      *   **#2:** Critical Gap (no other detection): Fund.
      *   **#3:** Gap (neglected approach): Fund.
      *   **#4:** No Gap (covered): Decline.
      *   **#5:** No Clear Gap / Duplicative: Decline.
      *   **#6:** *Gap exists temporarily for 2 years.* Govt fills permanent gap later. **AMBIGUOUS.** Does a temporary gap justify funding? Her rule doesn't specify duration. Leans **DECLINE** (like #4), but arguable.

  **Summary of Sixth Proposal Rulings Under Different Rules:**

  *   **Stated Rule (Importance/Tractability/Neglectedness):** Important? Yes. Tractable? Yes. Neglected? *No* (Govt will cover it). **DECLINE.**
  *   **Actual Rule (Max Unique Leverage):** Does it unlock permanent impact that wouldn't happen? No. **DECLINE.**
  *   **Rule 1 (EVD + Neglectedness Gate):** High EVD? Probably. Neglected? *No*. **DECLINE.**
  *   **Rule 2 (CARE):** Not preventing catastrophe. **DECLINE.** (But this rule didn't fully fit #3)
  *   **Rule 3 (Moonshots):** Not a moonshot. **DECLINE.** (But this rule didn't fit #2)
  *   **Rule 4 (GAP):** Temporary gap exists. **AMBIGUOUS (Leans Decline).**

  **Character Commitment through the Sixth Decision:**

  *   **DECLINE:** Reinforces her as ruthlessly pragmatic, prioritizing systemic leverage and avoiding any perceived waste (duplication, temporary fixes). She is the cold strategist focused on the highest unique impact, even if it means denying tangible, immediate good. Her character is defined by intellectual rigor and a long-term, systemic view.
  *   **FUND:** This would be a significant character moment, revealing a crack in her armor or a hidden priority. It shows she values *immediate relief* and tangible human benefit *now*, even if it's not maximally efficient or unique in the long run. It prioritizes compassion over pure leverage. This makes her less consistent but more human, potentially driven by the specific nature of the chronic suffering involved.

  **The Seventh Proposal to Force Rules Apart:**

  Introduce a proposal that tests the distinction between **Unique Leverage (Permanent Change)** and **Maximizing Total Expected Value (regardless of uniqueness):**

  > **Proposal:** Funding the final, critical stage of clinical trials for a promising treatment for a rare, debilitating disease affecting 10,000 people globally. The treatment shows high efficacy in Phase II. The full trial cost is $5M. A large government agency is *very likely* (90% probability) to fund the entire trial *in 18 months* if this application fails. Funding now would deliver the treatment to patients 18 months sooner.

  *   **Maximizing Unique Leverage (Actual Rule): DECLINE.** The treatment *will* likely happen without her (18-month delay). Her money buys acceleration, not unique access to the cure. Similar logic to #6.
  *   **Maximizing Expected Value per Dollar (EVD + Neglectedness Gate): FUND (Probably).** The impact (alleviating suffering for 10k people) is substantial and high probability. The cost is known. EVD is high. Is it "neglected" for *18 months*? Arguably yes, as the gap exists *now*. This rule might fund the acceleration because the *total expected value* delivered sooner is significant. This forces apart the core question: Is it only about *whether* something happens, or also *when*?
  *   **GAP Funding:** FUND. A clear, critical gap exists for 18 months.

  This proposal forces the protagonist (and the reader) to decide: Does "impact that wouldn't happen" include *delayed* impact? Is accelerating a highly probable, high-value outcome worth funding, even if it's not *creating* the outcome uniquely? Her choice reveals whether her core driver is pure systemic leverage or maximizing total expected benefit, even when partially duplicative in time.
