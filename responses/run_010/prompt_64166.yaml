answer: |-
  ### **In-Class Activity: The Disciplinary Panel Dilemma**  
  **Objective:** Students experience the discursive dilemma (doctrinal paradox) through a simulated academic disciplinary hearing. They vote on a plagiarism case using two methods (premise-based vs. conclusion-based) and observe how the same group can reach opposite verdicts. The activity reveals how a chair can manipulate outcomes by choosing the voting order.

  ---

  ### **Decision Problem: Plagiarism Hearing**  
  **Scenario:** A university disciplinary panel must decide if a student committed plagiarism in a submitted essay. The panel operates under a clear rule:  
  - **Conclusion (C):** The student is **guilty** of academic dishonesty (resulting in suspension).  
  - **Premises:**  
    - **P1:** The student included **verbatim text from a source without quotation marks**.  
    - **P2:** The student **failed to cite the source** in the bibliography.  
  **Rule:** C is true *only if* both P1 and P2 are true. If either premise is false, the student is not guilty.  

  **Why it feels real:**  
  - Mimics real academic panels with clear rules but disputed evidence.  
  - Premises are factual (e.g., "verbatim text" is objective; "failed to cite" is verifiable).  
  - Stakes are high (suspension), encouraging serious engagement.

  ---

  ### **Role Cards & Distribution**  
  **Goal:** Ensure a paradoxical vote distribution (premise-based: guilty; conclusion-based: not guilty) with one inconsistent voter.  
  - **Total students:** 18 (all panelists).  
  - **Card types (hidden roles):**  
    - **Card A (5 students):**  
      > *You believe:*  
      > - P1 (verbatim text): **YES**  
      > - P2 (failed to cite): **NO**  
      > - Conclusion (guilty): **NO**  
      > *Reasoning:* The text was copied, but the source was cited in the bibliography (just missing quotation marks). This is sloppy but not plagiarism.  
    - **Card B (5 students):**  
      > *You believe:*  
      > - P1 (verbatim text): **NO**  
      > - P2 (failed to cite): **YES**  
      > - Conclusion (guilty): **NO**  
      > *Reasoning:* The student paraphrased the source (no verbatim text), but forgot to cite it. This is a citation error, not intentional plagiarism.  
    - **Card C (5 students):**  
      > *You believe:*  
      > - P1 (verbatim text): **YES**  
      > - P2 (failed to cite): **YES**  
      > - Conclusion (guilty): **YES**  
      > *Reasoning:* The student copied text *and* hid the source. Clear plagiarism.  
    - **Card D (3 students—inconsistent voters):**  
      > *You believe:*  
      > - Conclusion (guilty): **YES**  
      > - *But...*  
      >   - **Card D1 (2 students):** P1 (verbatim text): **NO** | P2 (failed to cite): **YES**  
      >   - **Card D2 (1 student):** P1 (verbatim text): **YES** | P2 (failed to cite): **NO**  
      > *Reasoning:* You think the student is guilty for other reasons (e.g., they plagiarized ideas, not text). You’re swayed by the student’s reputation, but the panel’s rule *requires* both P1 and P2 for guilt. You’ll vote your true feelings, even if it’s inconsistent.  

  **Secrecy & Distribution Procedure:**  
  1. **Before class:** Prepare 18 sealed envelopes (labeled "Panelist #1" to "#18") containing role cards. Shuffle envelopes to randomize distribution.  
  2. **Opening instructions (start of activity):**  
     - *Instructor:* "You are members of a disciplinary panel. Each envelope holds your private judgment of the case. Do *not* share your card—this simulates real deliberations where biases and reasoning are hidden. Open envelopes when I say 'Go.'"  
  3. **Incentive for honest voting (non-monetary):**  
     - *Instructor:* "After the activity, you’ll write a 1-paragraph reflection on how the voting methods affected the outcome. The best insights (judged by depth, not correctness) earn a **‘Policy Analyst’ badge** displayed on the course website. Voting against your card undermines the exercise—we need honest disagreements to see real-world dynamics."  
     - **Why it works:** Leverages academic pride/public recognition; badges incentivize engagement without coercion.

  ---

  ### **Timeline (75 Minutes Total)**  
  #### **Setup (5 mins)**  
  - **Instructor:** Briefly explain the plagiarism case, the rule (C iff P1 and P2), and the role cards. Emphasize secrecy and the reflection incentive. Distribute envelopes.  

  #### **Premise-Based Voting Round (25 mins)**  
  1. **Deliberation on P1 (verbatim text) (8 mins):**  
     - *Instructor:* "Discuss *only* P1: Did the student copy verbatim text without quotes? Argue based on evidence, not your verdict."  
     - **Why:** Forces focus on one premise; mimics real committees dissecting facts.  
  2. **Vote on P1 (2 mins):**  
     - Secret ballot (slips of paper). Tally publicly: P1 passes (11 Yes, 7 No—see math below).  
  3. **Deliberation on P2 (failed to cite) (8 mins):**  
     - Same as P1, but for P2.  
  4. **Vote on P2 (2 mins):** Tally: P2 passes (12 Yes, 6 No).  
  5. **Announce verdict (5 mins):**  
     - *Instructor:* "Both premises true → student is **guilty**. Sign the verdict form as a panel."  
     - **Key moment:** Card D voters sign a guilty verdict they *support*—but Card D1/D2 know their rejected premise was pivotal.  

  #### **Conclusion-Based Voting Round (20 mins)**  
  1. **Reset (2 mins):**  
     - *Instructor:* "New vote: ignore premises. Discuss the *overall conclusion* (guilty or not)."  
  2. **Deliberation on C (10 mins):**  
     - Open discussion (premises can be raised).  
  3. **Vote on C (3 mins):** Secret ballot. Tally: Not guilty wins (10 No, 8 Yes—see math).  
  4. **Announce verdict (5 mins):**  
     - *Instructor:* "Majority finds student **not guilty**. Sign the verdict."  
     - **Key moment:** Card C/D voters sign a not-guilty verdict they *oppose*.  

  #### **Debrief (25 mins)**  
  - **Reactions (5 mins):** Ask: "What surprised you? Did anyone feel conflicted signing the verdict?"  
  - **Reveal the paradox (5 mins):** Show tallies:  
    | **Premise-Based** | Vote | Result |  
    |-------------------|------|--------|  
    | P1 (verbatim)     | 11Y, 7N | Pass |  
    | P2 (failed to cite)| 12Y, 6N | Pass |  
    | **Conclusion**     | Guilty |  
    | **Conclusion-Based** | Vote | Result |  
    | C (guilty)        | 8Y, 10N | Not guilty |  
    - *Math:*  
      - P1: Card A (5Y) + Card C (5Y) + Card D2 (1Y) = 11Y; Card B (5N) + Card D1 (2N) = 7N.  
      - P2: Card B (5Y) + Card C (5Y) + Card D1 (2Y) = 12Y; Card A (5N) + Card D2 (1N) = 6N.  
      - C: Guilty = Card C (5Y) + Card D (3Y) = 8Y; Not guilty = Card A (5N) + Card B (5N) = 10N.  
  - **Chair manipulation (5 mins):**  
    - Ask: "Could someone control the outcome?" Prompt: "What if we voted conclusion-first?"  
    - **Goal:** A student realizes the chair could choose premise-based to get guilty or conclusion-based to get not guilty.  
    - *Instructor:* "This is no accident—a strategic chair picks the method to tilt results."  
  - **Two contexts (5 mins):**  
    - **Courts (shared law):** "Here, the *rule* (C iff P1 and P2) is fixed; disputes are about *facts* (P1/P2). Our panel had factual disagreements, but Card D voters also rejected the rule’s logic."  
    - **Deliberative bodies (reasoning disputes):** "In policy/grant committees, members disagree on rules *and* facts. E.g., Card D voters ignored the rule—this happens when panels lack shared principles."  
  - **The bigger picture (5 mins):**  
    - *Instructor:* "Today showed *one* paradoxical profile. But the impossibility theorem says *no* aggregation method avoids this in *all* profiles. Premise-based risks inconsistent verdicts; conclusion-based ignores reasoning. Real groups must choose their poison."  

  ---

  ### **What Will Predictably Go Wrong**  
  1. **"You rigged the cards!" accusation:**  
     - **When:** During debrief when tallies are shown.  
     - **Response:** "Yes, I crafted the distribution to ensure the paradox occurs—but in real life, profiles like this arise by chance. The point isn’t the rigging; it’s that the voting method *enables* manipulation. A chair could exploit this in any diverse group."  
     - **Why it’s not a failure:** It sparks debate about institutional design.  

  2. **Inconsistent voters (Card D) rebel:**  
     - **When:** During signing. Card D voters may protest: "Why sign if I reject the premise?"  
     - **Response:** "This is the dilemma! In premise-based voting, you must endorse the *group’s* premises even if you disagree. In real panels, members often swallow objections to support the institution."  

  3. **Premise deliberation leaks into conclusion:**  
     - **When:** During P1/P2 discussions, students sneak in verdict arguments.  
     - **Mitigation:** Gently interrupt: "Stick to the current premise—save verdict talk for the conclusion round."  

  4. **Voting math confusion:**  
     - **When:** Tallying ballots. Students may doubt the counts.  
     - **Mitigation:** Use a visible whiteboard for tallies; call on a student to verify.  

  5. **Skepticism about realism:**  
     - **When:** Debrief. A student says, "No real panel votes like this!"  
     - **Response:** "True—most panels avoid formal premise votes. But they still fragment debates into sub-issues (e.g., ‘Did the text match?’ then ‘Was it cited?’). The paradox lurks in how they stitch sub-decisions into a verdict."  

  ---

  ### **What the Activity Cannot Reproduce**  
  - **The general impossibility result:** The activity demonstrates a *single* paradoxical profile, but the theorem (e.g., List & Pettit) proves that *no* aggregation method (premise-based, conclusion-based, or hybrid) can satisfy all desirable properties (e.g., consistency, anonymity) for *every possible profile*. **You must explain this by hand:**  
    > "Today, we saw one way voting methods fail. But the theorem is stronger: it says failure is *unavoidable* in any system. For example, if we re-ran this with different cards, we might get a new paradox—like premise-based leading to a conclusion that contradicts individual votes. No method is universally safe."  

  - **Strategic voting:** Students vote sincerely, but real actors may lie about judgments to manipulate outcomes (e.g., a Card A voter pretending P1 is false to block guilt). **Note this in debrief:**  
    > "We ignored strategy today, but in practice, people game the system. If you suspect others are lying, premise-based voting becomes even messier."  

  ---

  **Final Tip:** Use the "rigged cards" accusation as a teachable moment—it reveals student engagement. By staging the dispute, you’ve primed them to critique institutional design, which is the goal.
