answer: |-
  **Graduate Seminar in Formal Epistemology: Final Examination Question**  
  **Question 4 (25 marks total)**  

  Consider an agent evaluating a hypothesis \(H\) at two times: \(t_1\) (now) and \(t_2\) (36 hours later). At \(t_1\), her credence in \(H\) is \(P_{t_1}(H) = 0.4\). She knows that at \(t_2\), her credence will be \(P_{t_2}(H) = 0.7\) due *solely* to extreme fatigue after a 36-hour on-call shift. She regards her \(t_2\) self as *less* reliable: exhaustion will make her newly susceptible to a colleague’s rhetoric, which she currently views as epistemically irresponsible ("smooth talking"). No new evidence bearing on \(H\) will be acquired between \(t_1\) and \(t_2\).  

  At \(t_1\), she is offered a bet \(B_1\) that pays £1 if \(H\) is true and £0 otherwise, at a price of £0.40 (matching \(P_{t_1}(H)\)). At \(t_2\), she will be offered bet \(B_2\) on \(\neg H\) that pays £1 if \(\neg H\) is true and £0 otherwise, at a price of £0.30 (matching \(P_{t_2}(\neg H) = 0.3\)). Accepting both bets would yield a sure loss of £0.10. She has access to a pre-commitment device at \(t_1\) (e.g., a binding contract) preventing her \(t_2\) self from accepting \(B_2\).  

  **Relevant Principles:**  
  - **Reflection**: \(P_{t_1}(H \,|\, P_{t_2}(H) = q) = q\)  
  - **Retroflection** (instructor’s stipulation): \(P_{t_2}(H \,|\, P_{t_1}(H) = q) = q\)  

  **Tasks:**  
  1. **Derive** the Reflection principle from the assumption that the agent expects her \(t_2\) credence to result from conditionalizing her \(t_1\) credence on some proposition \(E\) (representing new evidence), where \(P_{t_1}(E) > 0\) and she regards \(E\) as veridical (truth-conducive). Identify the key premise that enables this derivation and explain why it fails in the fatigue case. *(8 marks)*  
  2. **Determine** whether a diachronic Dutch book argument (showing a sure loss for certain credence combinations) can be constructed against violations of *Retroflection*, analogous to the Dutch book for Reflection. If so, state the bets and loss. Does this show that Reflection is a requirement of *coherence* (dynamic consistency) rather than a substantive claim about reliability? Justify your answer. *(8 marks)*  
  3. **Explain** how the availability of the pre-commitment device affects the Dutch book argument for Reflection. Specifically, if the agent can avoid the sure loss by pre-committing *instead* of revising her \(t_1\) credence, what does this imply about whether Reflection violations are genuinely incoherent? *(6 marks)*  
  4. **Conclude**: Is van Fraassen’s use of Reflection to defend Lewis’s Principal Principle (deferring to objective chances) undermined by your analysis? Explain briefly. *(3 marks)*  

  ---

  **Model Answer (approx. 950 words)**  

  **1. Derivation of Reflection and Key Premise**  
  Reflection can be derived under the assumption that the agent believes her future credence will arise via conditionalization on veridical evidence. Let \(P_{t_2}(H) = q\) be the event that her credence in \(H\) at \(t_2\) is \(q\). Assume she expects \(P_{t_2}(H) = P_{t_1}(H \,|\, E)\) for some evidence proposition \(E\) with \(P_{t_1}(E) > 0\), and she regards \(E\) as truth-conducive, i.e., \(P_{t_1}(H \,|\, E) = P_{t_1}(H \,|\, E, P_{t_2}(H) = q)\). This implies she treats \(E\) as the *sole reason* for her credence change. Then:  
  \[
  P_{t_1}(H \,|\, P_{t_2}(H) = q) = P_{t_1}(H \,|\, P_{t_1}(H \,|\, E) = q).
  \]  
  If she is *certain* that conditionalizing on \(E\) yields credence \(q\) (i.e., \(P_{t_1}(P_{t_1}(H \,|\, E) = q) = 1\)), and she defers to her conditional future credence, then:  
  \[
  P_{t_1}(H \,|\, P_{t_1}(H \,|\, E) = q) = q.
  \]  
  **The key premise** is her certainty that \(P_{t_2}(H)\) results from conditionalizing on \(E\) *and* that \(E\) screens off \(H\) from the fact of her having that future credence. This fails in the fatigue case because she knows \(P_{t_2}(H) = 0.7\) is *not* produced by evidence she endorses but by exhaustion distorting her judgment. Thus, \(P_{t_1}(H \,|\, P_{t_2}(H) = 0.7) = 0.4 \neq 0.7\).  

  **2. Dutch Book for Retroflection? Implications for Reflection**  
  A Dutch book for Retroflection (\(P_{t_2}(H \,|\, P_{t_1}(H) = q) = q\)) is **impossible** to construct. The bets described target Reflection violations:  
  - At \(t_1\): Accept \(B_1\) (bet for \(H\) at £0.40) if \(P_{t_1}(H) = 0.4\).  
  - At \(t_2\): Accept \(B_2\) (bet against \(H\) at £0.70, i.e., for \(\neg H\) at £0.30) if \(P_{t_2}(\neg H) = 0.3\).  
  Net payoff: \(I_H - 0.40 + I_{\neg H} - 0.30 = -0.10\) (sure loss).  

  This book exploits the agent’s *own* willingness to bet at different odds at different times. For Retroflection, we would need bets at \(t_2\) conditional on her *past* credence. Suppose at \(t_2\) she learns \(P_{t_1}(H) = 0.4\). Retroflection requires \(P_{t_2}(H \,|\, P_{t_1}(H) = 0.4) = 0.4\). If she violates this (e.g., \(P_{t_2}(H) = 0.7\) regardless of past credences), no diachronic Dutch book forces loss:  
  - A bet at \(t_2\) on \(H\) at £0.40 (matching hypothetical \(q\)) could be offered *only* if she learns \(P_{t_1}(H) = 0.4\), but her actual \(P_{t_2}(H) = 0.7\) makes her *reject* this bet.  
  - No combination of bets forced at \(t_1\) and \(t_2\) guarantees loss *without* her \(t_2\) self disregarding her current credence.  

  **Implication for Reflection**: The Dutch book for Reflection succeeds only because the agent’s later credence is *known in advance* and bet offers are timed accordingly. This shows the Dutch book argument for Reflection reflects *dynamic consistency* (avoiding predictable mismatched bets across time), not a substantive demand to trust one’s future self. Retroflection lacks this predictive structure: past credences are fixed, but future bets need not align with them. Thus, the Dutch book supports Reflection as a coherence requirement (about aligning anticipations with future actions), while Retroflection is a substantive claim about deference to past selves.  

  **3. Effect of Pre-Commitment on the Dutch Book Argument**  
  The pre-commitment device (e.g., binding her \(t_2\) self to reject \(B_2\)) allows the agent to avoid the sure loss *without* changing her \(t_1\) credence. She retains \(P_{t_1}(H) = 0.4\) and avoids \(B_2\) at \(t_2\), escaping the Dutch book. This demonstrates that the "incoherence" attributed to Reflection violations is **pragmatic**, not epistemic. The sure loss arises from her *disposition to act* on conflicting credences at different times, not from static irrationality. Crucially:  
  - She correctly anticipates her future credence is distorted.  
  - Pre-commitment blocks the harmful action (\(B_2\)) while preserving her accurate \(t_1\) assessment.  
  This shows Reflection is not a requirement of *belief consistency* per se, but of *action consistency* across time. Violations become pragmatically problematic only if the agent cannot control future betting behavior.  

  **4. Impact on van Fraassen’s Defence of the Principal Principle**  
  This analysis **does not undermine** van Fraassen’s use of Reflection for the Principal Principle (PP). PP requires deferring to objective chances: \(P_{t}(H \,|\, \text{ch}_t(H) = q) = q\). Van Fraassen argues that just as Reflection defers to future credences treated as "expert," PP defers to chances as experts. The Dutch book shows that violating Reflection risks *pragmatic* incoherence if no constraints are placed on future actions. Similarly, violating PP risks a synchronic Dutch book (as shown by Lewis). Crucially, PP assumes chances *are* experts, whereas Reflection’s normative force depends on whether the agent *takes* her future self as expert. The fatigue case shows that when she doesn’t, pre-commitment resolves the pragmatic tension without accepting Reflection. For PP, no analogous "pre-commitment" exists to avoid deferring to chances—chances are *stipulated* as experts. Thus, van Fraassen’s analogy holds *if* one grants chances expert status, but the argument does not establish that status itself.  

  ---  

  **Marking Scheme (Total 25 marks)**  

  1. **Reflection Derivation & Key Premise** (8 marks)  
     - *Full credit*: Correctly derives \(P_{t_1}(H \,|\, P_{t_2}(H){=}q) = q\) using conditionalization and certainty assumptions; identifies "certainty that \(E\) screens off \(H\) from future credence" as key; explains failure in fatigue case (no veridical \(E\)).  
     - *Common error*: Omits the screening-off premise or misstates why fatigue violates it.  

  2. **Retroflection Dutch Book & Implications** (8 marks)  
     - *Full credit*: States no Dutch book for Retroflection is possible (bets cannot be forced conditional on past credences); contrasts with Reflection’s exploitable predictability; concludes Dutch book shows Reflection is about coherence (dynamic betting consistency), not reliability.  
     - *Common error*: Assumes Retroflection admits a Dutch book by symmetry; or conflates coherence with reliability.  

  3. **Pre-Commitment Effect** (6 marks)  
     - *Full credit*: Explains that pre-commitment avoids loss pragmatically without credence revision; concludes Reflection violations are not "incoherent" in a belief-theoretic sense but risk inconsistent actions without constraints.  
     - *Common error*: Claims pre-commitment "proves" Reflection is false; or ignores the pragmatic/epistemic distinction.  

  4. **Principal Principle Impact** (3 marks)  
     - *Full credit*: Notes PP’s expert status is stipulated, unlike Reflection; thus analysis does not undermine van Fraassen’s analogy.  
     - *Common error*: Claims fatigue case directly challenges PP.  

  **First-Class Distinction Separator**  
  A first-class answer explicitly notes that the diachronic Dutch book for Reflection targets *pragmatic* consistency in betting dispositions across time, not epistemic rationality per se—and that Retroflection lacks this asymmetry because past credences cannot force future bets. Competent answers correctly analyze all cases but miss this temporal asymmetry in enforceability.
