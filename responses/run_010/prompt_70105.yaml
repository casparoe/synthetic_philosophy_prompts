prompt: |-
  I do policy work for a state rep, and last week's hearing on restricting a flame retardant used in couch foam turned into a shouting match over a single phrase. The industry lawyer said you can't pull a chemical off the market without evidence that it harms people — that's "innocent until proven guilty," bedrock stuff. The public health advocate said the whole point is to flip it: chemicals should be presumed guilty until proven innocent, and she talked as though she were invoking the exact same principle, just applying it correctly. Both of them acted like the slogan settles something, and I left the room with no idea what it could even mean in this setting.

  Can you pin down the distinct precise claims that "innocent until proven guilty" might be making when it's moved out of a courtroom and into chemical regulation? Give me exactly five numbered readings, ordered from the weakest to the most demanding, and for each say in a sentence or two what it actually asserts — who bears the burden, what would count as discharging it, and what the default rule is while the evidence is still coming in — plus a verdict on whether it's defensible and whether it favors the lawyer, the advocate, or neither. Where the courtroom machinery quietly stops transferring, note it inside the item rather than in a separate section: no identifiable defendent, victims who aren't parties to the case and can't be represented, a "verdict" you can't appeal or retry once the exposure has happened. No intro paragraph and no wrap-up at the end, just the five items, and if one of your readings is simply false rather than merely contentious, say so plainly.
reasoning: |-
  Hmm, the user is a policy staffer for a state representative who witnessed a heated debate about chemical regulation. The core confusion revolves around applying "innocent until proven guilty" to chemical safety, with industry and public health advocates claiming opposite interpretations. They need five precise, graded interpretations of the legal principle in this new context.

  The key parameters for analysis must include burden of proof (who must prove what), standard of evidence (how much proof is needed), and default position (what happens when evidence is incomplete). The courtroom analogy breaks down in critical ways: no identifiable defendant, potential victims who aren't parties to the case, irreversible harm from exposure, and regulatory decisions being more like preventative injunctions than criminal verdicts.

  For the weakest interpretation (1), it would mirror criminal law directly: regulators must prove human harm beyond reasonable doubt before acting. This is indefensible here because it ignores latent harms and shifts all risk to the public. The industry lawyer would favor this, but it's scientifically incoherent.

  Moving to (2), a slightly better version would require probable cause of harm but still demand human evidence. While better than (1), it fails because epidemiology often lags exposure by decades, making it impractical for prevention. Still favors industry by design.

  The moderate position (3) acknowledges animal/model evidence as sufficient proof of harm potential. This balances precaution with evidence, assigning burden to manufacturers to demonstrate safety if red flags appear. Neither side fully wins here - it's a pragmatic middle ground.

  For (4), the stronger precautionary stance would place affirmative safety demonstration on chemical producers before market entry. This mirrors drug approval logic and favors public health advocates by defaulting to restriction until safety is proven. Defensible as it prevents unvetted exposures.

  The strongest reading (5) would demand absolute safety proofs that are scientifically impossible, making it a false argument. Neither side should want this strawman, though advocates might rhetorically edge toward it. Must explicitly call this out as unrealistic.

  Throughout, emphasize where legal metaphors fracture: irreversible harm can't be "retried", statistical victims lack standing, and restrictions are preventative measures rather than punishments. The grading shows how burden-shifting serves different policy goals - industry prefers status quo preservation while public health prioritizes harm prevention.
answer: |-
  1. **Burden of Proof for Harm:** The chemical must remain available *unless* regulators prove specific human harm has occurred using epidemiological data or direct clinical evidence. The burden is entirely on regulators to demonstrate actual harm in the exposed population. Default is unrestricted use. *Verdict: Indefensible in this context. Ignores latency of harm, practical impossibility of proving harm *before* widespread exposure occurs, and animal/model data. Favors industry lawyer.*

  2. **Burden of Proof for Significant Risk:** The chemical must remain available *unless* regulators prove it poses a "significant risk" of harm to humans, using direct human evidence or highly predictive animal/mechanistic data showing a direct causal pathway. Burden is on regulators. Default is unrestricted use. *Verdict: Contentious but potentially defensible with a high "significant risk" threshold. Still problematic due to latency and proof challenges. Favors industry lawyer. Breaks down: "Significant risk" is vague, and proof often requires exposure that itself causes harm.*

  3. **Burden of Proof for Safety (Triggered by Hazard):** If credible evidence of a *hazard* exists (e.g., toxicity in animals, bioaccumulation, structural similarity to known toxins), the burden shifts to the manufacturer to demonstrate reasonable certainty of *no harm* to humans under expected exposure. Burden shifts to industry upon initial hazard signal. Default shifts from use to restriction pending safety proof. *Verdict: Defensible and common in modern chemical regulation (e.g., EU REACH). Balances precaution with evidence. Favors public health advocate. Courtroom breakdown: No trial-like "defendant," just a product; "proof" is scientific assessment, not adjudication.*

  4. **Burden of Proof for Safety (Pre-Market):** Manufacturers bear the burden to affirmatively demonstrate reasonable certainty of *no harm* to human health (and often environment) *before* the chemical can enter or remain on the market. Requires comprehensive safety data package from industry. Default is *no market entry or removal* until safety is proven. *Verdict: Highly defensible as a preventative principle (e.g., pharmaceuticals, pesticides). Strongly precautionary. Favors public health advocate. Breaks down: Applies prospectively, unlike criminal verdicts; "Innocent" analogy fails as it's about risk management, not individual culpability.*

  5. **Absolute Safety Requirement:** The chemical cannot be used *unless* manufacturers prove it is *impossible* for it to cause *any* harm to *anyone* under *any* conceivable condition of use or exposure. Burden is on industry to prove absolute safety. Default is ban. *Verdict: Simply false. Scientially impossible to prove a negative (absolute safety) for any chemical. Unworkable and unreasonable standard. Favors neither; a rhetorical misrepresentation of the precautionary principle.*
