  Question 6 (probes (i): interpersonal comparison and cardinality):
    Scenario: Two friends, Alice and Ben, are choosing desserts. Alice chooses a chocolate cake over a fruit salad, and Ben chooses the fruit salad over the chocolate cake. They both seem equally happy with their choices. Can we say that Alice's gain from chocolate cake is greater than Ben's gain from fruit salad?
    (a) Yes, because they both had the same options and chose differently, so the one who chose chocolate must have gotten more from it than the one who chose fruit.
    (b) No, we can only say that each prefers their own choice, but we cannot compare how much satisfaction they get.
