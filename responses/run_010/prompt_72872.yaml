prompt: |-
  Last weekend I had a three-hour argument with a friend — she is an ancient historian, I work on ethics — about Plutarch's *Parallel Lives*, and it turned entirely on a single sentence that she kept repeating and I kept failing to pin down.

  The occasion was our reading group's discussion of biography as a vehicle for moral education. I objected that the *Lives* are a poor vehicle precisely because so much of their most vivid material is unreliable. I offered the familiar case: Solon's celebrated meeting with Croesus, which cannot be squared with the chronology, since Croesus came to the throne long after Solon's years of travel would have ended; and Plutarch, when he reaches that story in the *Life of Solon*, says in substance that he will not throw out something so renowned and so consonant with Solon's character merely on account of chronological tables that men keep revising without ever bringing them into agreement. My point was that a work willing to retain an incident it knows to be chronologically impossible because the incident is edifying cannot be asked to carry the moral weight we want to put on it.

  Her reply, delivered as though it closed the matter, was the opening of the *Life of Alexander*: "For it is not Histories that I am writing, but Lives" — followed, in the same breath, by his remark that the most illustrious deeds do not always display virtue or vice most clearly, and that some slight thing, a phrase or a jest, often reveals character better than battles with thousands slain. Her position was that I was faulting a biography by the standards of a different genre, which is a category mistake: the *Lives* aim at character, and character is exactly what the small anecdotes deliver. I said that disclaiming an aim cannot by itself lower the standard for retaining material, and that if truth is irrelevant to the moral use, the use collapses anyway, since admiration and imitation seem to require believing that the thing happened. She answered with hagiography: saints' lives stuffed with impossibilities formed moral sensibilities for a thousand years, so belief in the particular incident evidently is not what does the work. I said hagiography is the degenerate case, not the vindication. Neither of us budged.

  I now suspect that the sentence she kept quoting is doing several distinct jobs, and that we were arguing past each other. What I want is therefore a careful disambiguation rather than a verdict on who won. Please lay out, as a menu, the different claims that "lives, not histories" could be making, and for each say whether it is trivial, substantive and defensible, or false. In particular:

  1. Separate readings about the classification of the work (what kind of thing it is) from readings about the standards it must meet, from readings about what its author was attempting, and from readings about what a reader is entitled to demand of it. I have been calling these the taxonomy, standards, aim, and immunity readings; replace my labels if you have better ones, but preserve the distinctions, and say which of the four her move actually required.

  2. Distinguish a reading on which the difference between a history and a life is one of scope — the biographer admits private, domestic, and trivial material the historian excludes — from one on which it is a difference of warrant — the biographer may retain an anecdote on evidence a historian would reject. My objection needs the second; her reply, I think, supplies only the first. Is that diagnosis correct?

  3. Is there a reading on which the slogan is true and my objection nevertheless survives? Can a life be faulted *as a life*, and not merely as a failed history, for keeping an edifying impossibility, if the moral work assigned to it depends on the incidents being real?

  4. What does Plutarch's own practice suggest about which reading he held: his handling of the Solon story, his habit of reporting rival versions of an anecdote and sometimes declining to choose between them, and the formal comparison closing most of the pairs, in which he pronounces on which of the two men was the better?

  5. Does her hagiography reply establish that belief in particular incidents is inessential to moral learning from a life, or only something weaker — for instance, that such lives functioned inside communities that already supplied the beliefs, so that the text transmitted rather than generated them? If the weaker reading, what follows for her use of it against me?

  6. Is there a middle position we both missed — say, that a fabricated or impossible incident can still serve as evidence, not of the subject's character, but of what the author and his audience took such a character to consist in, which may be all a moral learner needs? If so, what has to be true for that to work, and does it survive the pairing structure, in which each life is under pressure to supply a counterpart to its mate?

  Please write in American English. I am not after references, sources, or a reading list — only the readings themselves, cleanly distinguished, with your assessment of each and of the inferences my friend and I were separately drawing from them.
reasoning: |-
  Okay, let me approach this user's complex request systematically. The core is disentangling Plutarch's "lives, not histories" claim through multiple lenses. 

  First, I need to map the four dimensions the user identified: classification (taxonomy), standards, aim, and reader expectations. The historian friend seems to rely primarily on the aim dimension - that Plutarch explicitly states his purpose determines the rules. But the user's ethical concern requires examining whether that aim actually lowers standards for evidence.

  The scope vs warrant distinction is crucial. When Plutarch includes private anecdotes, that's scope. But the Solon-Croesus case tests warrant - keeping something known to be chronologically impossible. The friend's quote addresses scope but sidesteps the warrant issue central to the user's objection.

  On moral function: even if saints' lives shaped morality, that doesn't prove belief was irrelevant. Medieval readers likely accepted miracles as real. The text might transmit rather than generate belief, weakening the friend's argument.

  Plutarch's own practice offers clues: reporting multiple versions shows awareness of evidentiary problems. The pairing structure suggests he did care about factual basis for comparisons - otherwise why stress which man was "better"?

  A possible middle ground: fabricated stories reveal contemporary ideals. But this clashes with Plutarch's comparative judgments, which presume factual grounding. The moral learner needs to believe the exemplar actually manifested the virtue.

  Ultimately the friend's position over-relies on authorial intent while underestimating how moral exemplarity depends on perceived reality. But the user should acknowledge that biography legitimately prioritizes character illumination over chronicle - just not to the point of accepting known impossibilities.
answer: |-
  Here's a disambiguation of "lives, not histories," addressing your points systematically:

  ### 1. Four Interpretations of "Lives, not Histories"
  *(Replacing your labels for clarity)*

  *   **Genre Definition (Taxonomy):**  
      *Claim:* Plutarch is writing within a distinct literary category (biography) with conventions differing from historiography.  
      *Assessment:* **Trivial/True.** Undeniably correct on its face.  

  *   **Authorial Purpose (Aim):**  
      *Claim:* Plutarch’s primary objective is revealing moral character (virtue/vice) through personal details, not chronicling public events for factual accuracy.  
      *Assessment:* **Substantive and Defensible.** Strongly supported by the *Alexander* quote and Plutarch’s focus on anecdotes, sayings, and comparisons. This is likely the core of your friend's argument.  

  *   **Methodological License (Standards):**  
      *Claim:* The biographical genre *permits* using material (e.g., anecdotes, apocryphal stories) that stricter historiographical standards would reject, *if* it serves the purpose of revealing character.  
      *Assessment:* **Substantive and Contested.** This is the crux of your objection. Plutarch implies it (*Solon*), but its validity hinges on whether "revealing character" justifies overriding known chronological/factual issues.  

  *   **Reader Expectations (Immunity):**  
      *Claim:* Readers *should not* judge the *Lives* by historiographical standards of evidence and fact-checking, but solely by their success in illuminating character.  
      *Assessment:* **Substantive and Contested.** This is the inference your friend likely draws from Authorial Purpose and Genre Definition, and which you reject.  

  **Your Friend's Move:** She relies primarily on **Authorial Purpose** to justify **Methodological License** and **Reader Expectations**. She argues Plutarch's *aim* (revealing character) defines the *standards* (anecdotes are valid tools) and *reader expectations* (don't demand historiography).

  ### 2. Scope vs. Warrant

  *   **Scope Difference:** Biographies include private, domestic, trivial details historians exclude.  
      *Assessment:* **Substantive and Defensible.** This is clearly part of Plutarch's meaning ("some slight thing, a phrase or a jest").  

  *   **Warrant Difference:** Biographies may retain anecdotes on weaker evidence or even despite known contradictions if deemed illustrative of character.  
      *Assessment:* **Substantive and Contested.** This is implied by Plutarch's *Solon* defense and the *Alexander* quote's contrast, but it's the point of contention.  

  **Your Diagnosis:** **Correct.** Your objection targets **Warrant**. Her reply, emphasizing character revelation via small anecdotes, primarily supplies the **Scope** difference. She smuggles in the **Warrant** difference under the banner of Authorial Purpose. The *Solon* example forces the **Warrant** issue explicitly.

  ### 3. Can a "Life" Be Faulted on Its Own Terms?

  *   **Yes, potentially.**  
      *Claim:* Even within biography, retaining material *known to be chronologically impossible or factually false* for its edifying value undermines its core purpose *as a biography aiming for moral education*.  
      *Reasoning:*  
      1.  **Character Revelation Requires Plausibility:** If the incident is demonstrably impossible (Solon meeting Croesus), how reliably can it reveal the *actual* character of Solon? It might reveal Plutarch's *idea* of Solon, or Croesus, or Athenian values, but not Solon himself.  
      2.  **Moral Education Relies on Reality:** For moral admiration and imitation to be directed at the *historical figure*, the incidents revealing their character need to be grounded in reality. Fabricated nobility inspires admiration for the *fabrication*, not the historical person. Plutarch's comparisons ("who was better?") presume a factual basis for judgment.  
      3.  **Internal Standard:** Plutarch himself often reports conflicting versions or expresses skepticism, showing concern for plausibility *within his biographical project*. Retaining the known impossible is a lapse *by his own implicit standards of plausible character revelation*.  
      *Assessment:* **Substantive and Defensible.** Your objection survives if "character revelation for moral education" inherently requires a plausible connection to the historical individual's actual life and choices. Your friend's position risks making character entirely a construct of the biographer.

  ### 4. Plutarch's Practice & the Readings

  *   **Solon Story:** Explicitly defends **Methodological License/Warrant Difference.** He prioritizes the story's renown and perceived consonance with Solon's character over chronological tables he deems unreliable. This supports your friend *if* one accepts this license. It fuels your objection *because* it shows the license being used to override known chronological issues.
  *   **Reporting Rival Versions:** Shows concern for accuracy/plausibility (**Warrant**). He doesn't *always* pick the most edifying version; sometimes he picks the most plausible or leaves doubt. This complicates the "edifying fiction is fine" reading and suggests his **Aim** (character) is pursued *within* bounds of perceived historical possibility.
  *   **Formal Comparisons:** Undermines pure **Reader Expectations (Immunity).** Pronouncing "who was better" relies on the *presented deeds and character* being sufficiently grounded in reality to warrant the judgment. If the deeds are known fictions, the comparison becomes an exercise in comparing literary constructs, not historical figures – a point your ethics objection highlights. This practice leans towards needing some level of factual warrant for the moral judgment to have force.

  **Plutarch's Likely View:** He held a complex mix. **Authorial Purpose (character)** was primary, justifying an expanded **Scope** and a degree of **Methodological License** regarding anecdotes and evidence. However, his practice shows concern for **Warrant** (reporting alternatives, skepticism) and his comparisons rely on an implicit assumption that the core material is plausible enough to support moral judgment. He likely saw **Warrant** as flexible but not irrelevant. The *Solon* case is an extreme outlier in its chronological impossibility.

  ### 5. Hagiography Reply: Strong or Weak?

  *   **Likely Establishes the Weaker Reading:** Saints' lives functioned effectively *within communities of shared belief*. The audience generally *accepted* the miracles and stories as true expressions of divine power working through the saint. The text *transmitted* and *reinforced* existing beliefs within that framework. It did not typically ask readers to admire the saint *while knowing specific key incidents were fabricated*.
  *   **Consequence for Your Friend:** Her use of hagiography **fails** as a direct counter to your point about Plutarch. It shows that morally formative biographies *can* work when belief in the incidents is present (supplied by the community/faith), not that belief is unnecessary. It doesn't demonstrate that biographies work *despite the audience knowing key illustrative incidents are impossible or false*. It weakens her claim that belief is "evidently not what does the work."

  ### 6. A Middle Position: Incident as Cultural Evidence

  *   **The Claim:** A fabricated/impossible incident can still be morally instructive, not as evidence of the *subject's* character, but as evidence of what the *author's culture* (or Plutarch himself) believed constituted noble character or moral virtue. The learner gains insight into the *ideal*, not the historical individual.
  *   **Requirements:**  
      1.  The reader must recognize the incident as culturally significant fabrication, not historical fact.  
      2.  The learning objective shifts from "imitating Solon" to "understanding classical Greek/Roman virtue ideals."  
  *   **Survives Pairing? Problematic.** The formal comparisons ("who was better?") presuppose a judgment of the *men themselves* based on their *presented lives*. If the lives are vehicles for cultural ideals, comparing "who was better" becomes comparing which *cultural construct* is more admirable, not which historical figure exhibited greater virtue. This might be interesting, but it fundamentally alters Plutarch's stated project and the structure of the *Parallel Lives*.
  *   **Assessment:** **Substantive and Partially Valid** as a *potential* way to read the text *today*, especially for cultural historians. However, it **likely misrepresents Plutarch's own Aim** (revealing the character of Solon/Alexander/etc. for emulation) and **contradicts the reader expectations** Plutarch cultivated and the logic of the comparisons. It doesn't directly address your objection about the *Lives* functioning *as moral education based on historical exemplars*.

  ### Conclusion on Your Argument

  *   **Your Friend:** Leaned heavily on **Authorial Purpose** to justify **Methodological License** and **Reader Expectations (Immunity)**, using the **Scope** difference as primary evidence. Her hagiography example was a weak analogy. She sidestepped the core **Warrant** challenge posed by the *Solon* case.
  *   **You:** Correctly focused on **Warrant** and the implications for moral education. You argued that **Authorial Purpose** cannot simply nullify basic standards of plausibility if the moral function depends on the reality of the subject. Your objection survives as a critique of the *Lives as vehicles for moral education via historical exemplars* if they knowingly include impossible events as character evidence. Plutarch's own practice, while prioritizing character, shows more concern for plausibility than the *Solon* defense alone suggests.
  *   **The Stalemate:** You argued about the **necessary conditions for effective moral exemplarity** (requiring plausible reality). She argued about **authorial intent and genre conventions** (justifying flexible warrant). You were both partly right but talking about different aspects of the text's function and validity. The *Solon* case remains a genuine tension within Plutarch's method.
