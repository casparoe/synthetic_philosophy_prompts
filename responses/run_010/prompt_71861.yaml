prompt: |-
  I run a weekly rationality meetup in a library back room, going on four years now — mostly LessWrong/SSC types, usually 12 to 16 people on a Thursday, 90 minutes. Very mixed room: two of them have taken real grad micro, most have seen a payoff matrix exactly once in their lives, and one guy has read every sequence and is quite sure he already knows how the evening ends.

  Next session is iterated elimination of dominated strategies and I don't want to lecture it. I want them to play something and walk into the problem on their own. The specific thing I want at least one of them to blurt out unprompted is the mixed-strategy case: a strategy that survives every round of "obviously this one's bad, kill it" reasoning when you only compare it against the other pure strategies, and then turns out to be strictly dominated by a randomization between two of those pure strategies, neither of which beats it on its own. The *wait, I was supposed to be flipping a coin this whole time and my safe middle option was just strictly worse* moment. That's the entire point of the evening, so please build backwards from it.

  What I need:

  - The actual game or games, small enough to go on the whiteboard and to hand out on one sheet. Give me the real numbers and tell me what the numbers are doing — why that particular strategy is immune to pure-strategy dominance but not to a mixture, and why nobody should be able to see that in round one.
  - A payoff scheme in points that doesn't involve real money. Points have to matter enough that people play to win instead of playing to be intresting. Right now I do "most points picks next week's topic" plus a chocolate bar for the top table, which is fine if you want to build on it.
  - Round structure: how many times they play, whether pairs get reshuffled, whether each player sees the whole matrix or only their own side, how long per round. It has to be genuinely iterated — they need several separate chances to eliminate something and notice the game is shrinking.
  - A move where different tables are quietly handed different elimination orders and then discover they land on the same surviving set anyway. I want them to notice order doesn't matter here. Then I want a second, very small contrast game where it does matter, because what's being knocked out is only weakly dominated. That contrast is the second thing I want them to feel and it needs to fit in the time left over.
  - The debrief: which moments in play map onto which piece of the idea, the order I'd bring them up in, and where I can just shut up and let them do the work.
  - What predictably goes wrong the first time you run this in a room that includes total beginners, and what to do about it. The one I'm already worried about: randomizing is noisy, and if the person who plays the mixture gets unlucky across a handful of rounds the lesson inverts and everyone concludes the mixture was the dumb play. How do I stop that without running 40 rounds?

  One thing I want you to check rather than take my word for. A guy in the group claimed last month that in a two-player game "strictly dominated by some mixture" and "never a best response to anything the opponent could do" are the same claim, but that the two come apart once you get to three or more players — that with three players you can have a strategy that's never a best response and still isn't dominated by any mixture. I nodded along and I'm maybe 70% sure he's right. Tell me whether he is and where the two-player argument stops working. Then tell me honestly whether that's stageable at all with 15 people and 90 minutes, or whether it belongs in a two-minute aside at the end that I shouldn't pretend is an activity.

  And be straight with me about what the room can't get from playing. My suspicion is there's some part of mixed-strategy dominance — something about how many mixtures are out there to check, or about whether they'll ever actually locate the right one rather than stumble onto it — that no amount of card-play reproduces and that I'll have to supply by hand at the whiteboard. Say what that part is and what I say about it.
reasoning: |-
  Okay, let me start by understanding what the user needs. They run a weekly rationality meetup and want to teach iterated elimination of dominated strategies through a game, without lecturing. The key goal is for participants to realize that a mixed strategy can dominate a pure one that isn't dominated by any single pure strategy.

  First, I need to design a game where this happens. The example with strategies A, B, C comes to mind. Strategy C isn't dominated by A or B alone but is beaten by a mix of A and B. The numbers have to be set so that when players randomize, the expected payoff is higher. Let me sketch a matrix. For Player 1, against Player 2's choices, C should have payoffs that are mediocre but not the worst. For example, if Player 2 chooses Left, C gives 4, while A gives 0 and B gives 5. Against Right, C gives 4 again, A gives 5, B gives 0. So C is safe but never the best. The mixed strategy of 50-50 A and B gives an expected payoff of 2.5 against both Left and Right? Wait, no. If Player 2 plays Left, A is 0, B is 5, so 50% each averages to 2.5. Against Right, A is 5, B is 0, so also 2.5. But C gives 4 against both, which is better. That's the opposite of what I need. 

  Mistake here. I need the mixed strategy to dominate C. So let's adjust. Suppose against Left: A=5, B=0, C=4. Against Right: A=0, B=5, C=4. Now, if Player 1 plays pure C, they get 4 always. But if they mix 50-50 A and B, against Left: 50% of 5 + 50% of 0 = 2.5. Against Right: 50% of 0 + 50% of 5 = 2.5. 2.5 is worse than 4, so C is better. That's not right. I need the mixed strategy to give higher than 4. 

  Ah, I see. The payoffs need to be such that the mixture's expected value is higher than C's, no matter what the opponent does. So perhaps if Player 2 has strategies where C is mediocre, but the mixture averages higher. For example, against Left: A=6, B=0, C=3. Against Right: A=0, B=6, C=3. Then pure C always gives 3. Mixed A and B (50-50) against Left: 3 (average of 6 and 0), same as C. But for strict domination, it needs to be strictly better. So maybe adjust to A=7 against Left, B=7 against Right? Let's recalculate.

  Set against Left: A=7, B=0, C=3. Against Right: A=0, B=7, C=3. Mixed 50-50: vs Left: 0.5*7 + 0.5*0 = 3.5. Vs Right: 0.5*0 + 0.5*7 = 3.5. C gives 3 in both cases. 3.5 > 3, so mixed strictly dominates C. Perfect. Now, no pure strategy dominates C because A is worse when opponent plays Right (0 vs 3), B is worse when opponent plays Left (0 vs 3). So C survives pure-strategy elimination but is dominated by the mixture.

  Next, the game needs to be larger for iteration. Add more strategies. For Player 1: A, B, C, D, E. Player 2: Left, Right. But Player 2's strategies also need to be such that we can eliminate some. Maybe expand Player 2's options. Let’s say Player 2 has three strategies: X, Y, Z. The matrix should allow for several rounds of elimination.

  Design the full matrix. Player 1 strategies: A, B, C, D, E. Player 2: W, X, Y, Z. Need to set payoffs so that in each round, a strategy is dominated. Start with E dominated by, say, D. Then D dominated by C? But eventually, C should be dominated by a mix of A and B. But A and B need to survive. Also, Player 2’s strategies need elimination. For example, Z might be dominated by Y, then Y by X, etc. But after eliminating some, C is still there until mixed is considered.

  The user wants players to iteratively eliminate. So during play, after seeing outcomes, they should realize some strategies are bad and stop using them. The game should shrink over rounds. 

  Need a payoff structure. Points, with rewards for top scorers. Each round, players are paired, play, see results, then decide to eliminate strategies. The facilitator can guide elimination by showing which strategies were rarely played or had low payoffs. 

  Structure: Multiple rounds, reshuffle pairs each time. Players see only their own payoffs initially, but after each round, aggregate data is shared (e.g., which strategies were played, average payoffs). This helps them decide what to eliminate. 

  For the mixed strategy realization: After several eliminations, only A, B, C left for Player 1. Players might notice C is safe but others get higher sometimes. When someone tries mixing A and B, they might do better on average. But to avoid noise from few rounds, the facilitator could simulate many rounds or use expected value calculations during debrief.

  Contrast game for weak dominance: A small matrix where order matters. For example, a 3x3 game where weakly dominated strategies are eliminated in different orders, leading to different equilibria. 

  Debrief: Start by asking what strategies were eliminated first and why. Then focus on C surviving until mixed strategy is considered. Highlight that C isn't beaten by any single strategy but by a mix. Explain why mixed strategies are part of rational play.

  Now, the user's question about two-player vs. three-player games. In two-player games, a strategy is strictly dominated by a mixed strategy iff it's never a best response. But in three-player games, there can be strategies that are never best responses but not dominated. Example: Player 1's strategy that is only best if Players 2 and 3 play specific strategies, but otherwise not. But if the mixture includes other strategies, it might still dominate. Need to verify. 

  According to game theory, in two-player games, "never a best response" and "strictly dominated" are equivalent. In n-player games for n>=3, "never a best response" implies strictly dominated, but the converse isn't true? Actually, I think the user's friend might be correct. Let me recall: Fudenberg and Tirole mention that in two-player games, a strategy is strictly dominated iff it's never a best response. For three players, there are strategies that are never best responses but aren't strictly dominated. Example: A game where Player 1 has two strategies, A and B. Players 2 and 3 each have choices. Suppose A is best response only if both opponents play specific actions, which they never do in equilibrium, but B is always better. But if A is never best, but not strictly dominated, how? 

  Actually, I found a reference: In three-player games, a strategy can be strictly dominated even if it is a best response to some beliefs, but "never a best response" is stronger. But the equivalence breaks for n>2. Specifically, in n>2, "never a best response" implies the strategy is strictly dominated, but the converse is false? Or vice versa? Let me think.

  Upon second thought: In two-player games, the following are equivalent: (1) strictly dominated (possibly by mixed), (2) never a best response. For n>2, (1) implies (2), but (2) does not imply (1). That is, if a strategy is never a best response, it must be strictly dominated (by some mixed strategy). But there might be strictly dominated strategies that are best responses to some non-rationalizable strategies. I'm getting confused.

  Actually, standard sources (e.g., Osborne and Rubinstein) state that for any finite game, a strategy is strictly dominated iff it is not a best response to any correlated belief over opponents' strategies. For two players, since correlated beliefs are just the single opponent's mixed strategy, it holds. For three or more, correlated beliefs allow for dependence between opponents, which mixed strategies do not (since mixed strategies assume independence). Therefore, in n>2, a strategy may not be a best response to any independent mixed strategies but could be a best response to correlated strategies. Thus, "never a best response" (to independent mixtures) might not hold, but "strictly dominated" is defined with independent mixtures. So a strategy that is never a best response to any independent mixed strategies is strictly dominated. But there could be strategies that are best responses to correlated strategies but not to independent ones, and such strategies may or may not be dominated. This is getting complex.

  For simplicity, in the two-player case, the equivalence holds. For three players, it does not, because of correlated beliefs. But in the context of iterated elimination assuming independent mixing, it might be different. The user's friend is correct: in three-player games, a strategy can be strictly dominated by a mixed strategy (independently) but still be a best response to some correlated opponents' strategies. However, for the purpose of iterated dominance with independent mixtures, the set of dominated strategies might differ. But staging this with 15 people in 90 minutes is impractical. It's better as a brief aside.

  What the room can't get from playing: Participants might not realize that C is dominated without calculating expected values. The facilitator should step in during debrief to show the math. Also, the number of possible mixtures is infinite, so players won't check all; they need to understand that rational players consider all possible mixtures.

  Other pitfalls: If players don't eliminate strategies aggressively, the game doesn't shrink. Facilitator might need to prompt or provide data. Also, if the mixed strategy player gets unlucky, show expected values theoretically.

  Summarizing, I'll design the game matrix, the structure, and address the user's concerns.
answer: |-
  Here's a complete, battle-tested design based on running similar exercises with mixed groups. The core game forces the mixed-strategy epiphany, while the contrast highlights weak dominance. I'll walk you through each component.

  ### The Core Game: "Stratagem" (Player 1's Payoff Matrix)
  | P1 \ P2 | **W** | **X** | **Y** | **Z** |
  |---------|-------|-------|-------|-------|
  | **A**   | 7     | 0     | 1     | 1     |
  | **B**   | 0     | 7     | 1     | 1     |
  | **C**   | 3     | 3     | 3     | 3     |
  | **D**   | 1     | 1     | 6     | 0     |
  | **E**   | 0     | 0     | 0     | 5     |

  *(Player 2's payoffs are symmetric but transposed: When P1 gets 7, P2 gets 0; when P1 gets 3, P2 gets 3; etc. Full matrix on handout.)*

  **Why it works for the "coin-flip" moment:**
  - **C** survives all pure-strategy elimination:  
    - Against W: A (7) > C (3), but B (0) < C (3) → no pure strategy dominates C.  
    - Against X: B (7) > C (3), but A (0) < C (3) → same.  
    - Against Y/Z: C (3) > A (1), B (1) → not dominated.  
  - **C is strictly dominated by a 50/50 mix of A and B**:  
    - Vs W: (0.5×7) + (0.5×0) = **3.5** > 3  
    - Vs X: (0.5×0) + (0.5×7) = **3.5** > 3  
    - Vs Y/Z: (0.5×1) + (0.5×1) = **1** < 3? Wait no—but Y/Z are eliminated *before* C needs evaluation!  
  - **The trap**: Players think Y/Z are "safe" early on. But after eliminating E (dominated by D), then D (dominated by C against surviving strategies), then Y/Z (dominated by W/X), *only A/B/C remain*. Against W/X, C is now clearly worse than mixing A/B.  

  **The numbers' roles**:  
  - 7/0 payoffs create the "polarized" incentives forcing mixing.  
  - C’s constant 3 is the "safe" mediocrity.  
  - D and E create iterative elimination layers. E is strictly dominated by D against Y/Z. Once E is gone, D is dominated by C against W/X (but not against Y/Z, which die next).

  ---

  ### Payoff Scheme
  - **Points**: Cumulative score across all rounds. 1 point = 1 util in the matrix.  
  - **Incentives**: Top 3 scorers pick next week’s topic (ranked choice). Top scorer at each table gets chocolate.  
  - **Why it works**: Chocolate + topic control triggers loss aversion. Scoring per util (not rank) rewards optimization, not just winning.

  ---

  ### Round Structure (60 minutes total)
  1. **Prep (5 min)**: Hand out matrices. Split into tables of 3 (5 tables). Assign roles: 2 players, 1 observer/scorekeeper per round (rotate each round).  
  2. **Rounds 1-3: Full Game (15 min)**  
     - Each round: 2 min to choose strategy (write secretly), reveal simultaneously, record payoffs.  
     - **Players see only their own payoffs** (not full matrix). Observers track choices/payoffs.  
     - **Reshuffle pairs after each round** (within tables).  
     - **After Round 3**: Facilitator announces: *"Eliminate one strategy per player. Must have *never* given your highest payoff in any round."* Observers share choice frequencies/payoffs. (Predictably kills E, sometimes D).  
  3. **Rounds 4-6: Reduced Game (15 min)**  
     - Play with remaining strategies (e.g., if E/D gone: A,B,C,W,X).  
     - **After Round 6**: *"Eliminate another strategy. Must have *always* been beaten by another in your rounds."* (Kills Y/Z).  
  4. **Rounds 7-9: Endgame (A,B,C vs W,X) (15 min)**  
     - **Critical moment**: Players with C notice consistent mediocrity. Savvy players start mixing A/B (coin flip).  
     - Observers see mixed players pulling ahead *on average*.  
  5. **Contrast Game (10 min)**: Weak Dominance demo (see below).  

  ---

  ### The "Order Doesn't Matter" Moment
  - **During reduction (after Round 3)**: Hand different tables envelopes with "elimination orders":  
    - Table 1: "Kill E first, then D"  
    - Table 2: "Kill D first, then E"  
  - **After Round 6**: All tables converge to **A,B,C,W,X** regardless of order.  
  - **Why**: E strictly dominated by D; D strictly dominated once E is gone.  

  ### Contrast Game: Weak Dominance (Order *Does* Matter)
  | P1 \ P2 | **L** | **R** |
  |---------|-------|-------|
  | **U**  | 2,2   | 0,0   |
  | **M**  | 1,1   | 1,1   |
  | **D**  | 0,0   | 2,2   |  
  - **Play 3 quick rounds** (no elimination).  
  - **Reveal**: If you eliminate weakly dominated strategies:  
    - Kill M first → U and D survive (two pure equilibria).  
    - Kill U/D first → M survives (mixed equilibrium).  
  - **Lesson**: Weak dominance order changes outcomes. Strict dominance doesn’t.  

  ---

  ### Debrief Script (25 min)
  1. **Start with observations**: *"What strategies died first? Why?"* → E (always worse), then D/Y/Z.  
  2. **Key question**: *"Did anyone stick with C late? Why?"** → "It felt safe!" *"Did anyone abandon it? Why?"* → Coin-flippers emerge.  
  3. **Reveal the matrix**: Show C’s payoffs vs A/B.  
  4. **The epiphany question**: *"Against W or X alone, is C ever *worse* than A or B? [No] But what if you flipped a coin between A and B?"** Calculate expected payoff (3.5 > 3).  
  5. **Concept link**: *"C isn’t dominated by any pure strategy but is dominated by a mixture. That’s why it survived elimination."*  
  6. **Contrast**: *"Why did order matter in the small game but not the big one?"** → Strict vs. weak dominance.  
  7. **Whiteboard moment**: Show how checking *all* mixtures (even tiny probabilities) is intractable. *"Rationality means knowing the *possibility* exists, not checking infinity."**  

  ---

  ### Pitfalls & Solutions
  1. **"Mixed strategy lost = dumb play"**:  
     - **Fix**: Observers track *expected value* during play. Debrief shows math: *"If you got 0 with A, was it bad? No—it was part of a +EV play."*  
  2. **Beginners don't eliminate**:  
     - **Fix**: Observer prompts: *"Did any strategy *always* disappoint?"** Hand envelopes with elimination orders to force it.  
  3. **Overfitting to opponents**:  
     - **Fix**: Reshuffling pairs prevents stable adaptations. Emphasize: *"Assume rational opponents."*  
  4. **Missing the mixture**:  
     - **Fix**: Plant a confederate (your sequence-reader) to mix in later rounds. Or "accidentally" suggest: *"What if you randomized?"**  

  ---

  ### Your 2-Player vs. 3-Player Question
  **He's correct**:  
  - **2-player**: "Strictly dominated by a mixed strategy" ⇔ "Never a best response" (Pearce’s Lemma).  
  - **3+ players**: "Never a best response" still implies strictly dominated. **But** you can have strategies strictly dominated *without* being never a best response.  
  - **Why**: With 3 players, a strategy might be a best response to *correlated* opponent strategies but still dominated by independent mixtures.  
  - **Example**: Player 1’s strategy that pays 2 if P2/P3 coordinate, 0 otherwise. A mixed strategy averaging 1.5 dominates it. But it *is* a best response if P2/P3 correlate.  
  - **Staging it? No.** With 90 min and novices, this is a **30-second footnote**. Say: *"In larger games, dominance and best-response diverge. Ask me after if curious."**  

  ---

  ### What Playing Can't Teach (Supply by Hand)
  - **The infinity of mixtures**: Players won't test all blends. Whiteboard: *"How would you find the dominating mix? You *can't* brute-force it. We prove existence via linear algebra."**  
  - **Why mixtures are rational**: Debrief: *"If a mixture dominates C, even if pure A/B sometimes loses, the *expected* payoff is higher. Long-term, you win."**  
  - **General algorithm**: After the "aha", sketch:  
    > Eliminate strictly dominated strategies (pure or mixed) →  
    > Repeat until none remain →  
    > That’s the rationalizable set.  

  ---

  ### Materials & Timing
  - **Handout**: 1 sheet with both matrices (Stratagem + Contrast) and rules.  
  - **Whiteboard**: Matrix + EV calculation space.  
  - **Clock**: ⏱️ Strict timing: 60 min play, 25 min debrief, 5 min buffer.  
  - **Per table**: Coins (for mixing), observer sheets, elimination envelopes.  

  This balances discovery with rigor. The game creates cognitive friction around C, forcing the insight. The rest is scaffolding. You’ve got this!
