prompt: |-
  For the past two cycles I have done the compliance and bookkeeping side of a federal House campaign, which means I spend my evenings classifying other people's generosity, and one pattern in the rules has stopped making sense to me in a way I cannot articulate without vocabulary I mostly lack. Here are the pieces. Uncompensated services by a volunteer are not a contribution at all: the attorney who spends a summer writing policy papers and assembling opposition research for us, gratis, has given us nothing the law counts, however far the commercial value of that summer exceeds what an individual may lawfully contribute per election, and there is nothing to cap, nothing to value, nothing to report. Yet if she performs the identical work while her employer keeps paying her salary, the value of those hours becomes an in-kind contribution from whoever paid her, valued at commercial rates and charged against that payer's limit. In the same spirit, an individual's unpaid online activity on our behalf — posting, list emails, hosting a website — is exempt outright, unlimited and unreportable even when undertaken with our knowledge, while purchasing the same output from a vendor is a capped and reportable contribution. Then there is the candidate's own money, which is formally a contribution but unlimited in amount and merely disclosed: dollars that are perfectly transferable and perfectly priced cease to be the sort of thing the law worries about the moment they belong to the person receiving them, and money a friend hands the candidate to spend on the campaign is not the candidate's personal funds but the friend's capped contribution. The salary cases sharpen the point. What a candidate earns from bona fide employment counts as their own unlimited personal funds, but if an employer keeps paying them while they are out campaigning, compensation exceeding the hours actually worked converts into a contribution from the employer; and corporations, which may not contribute at all, may nonetheless furnish unlimited free legal and accounting services aimed at keeping a committee compliant, provided they pay their own regular staff and hire nobody extra to do it.

  What conception of corruption, or of political influence, or of what a campaign even is, does this pattern presuppose? My instinct is that the law is tracking not the quantity of support a candidate receives but the form in which it arrives — priced, arm's-length, transferable value on one side, unpriced personal exertion on the other — but that hypothesis runs straight into the self-finance rule, since a candidate's own fortune is every bit as priced and transferable as anyone else's. So perhaps the operative idea is that corruption requires two distinct parties, an obligation running between a giver and a receiver, which cannot exist between a candidate and herself; or perhaps the tracked variable is dependence, which is how the Court itself frames the interest that contribution limits serve, describing them as weapons against the reality or appearance of improper influence stemming from the dependence of candidates on large campaign contributions — except that dependence is precisely what an unlimited personal fortune and a donated summer of professional labor produce. Take those candidate readings seriously and tell me which the practice strictly requires, as against which merely fit it comfortably, and which conceptions it quietly rules out: equality of political voice (which the courts have said is not a legitimate reason to limit money at all), distortion of the informational environment, unequal access and official gratitude, systemic dependence on concentrated private wealth. I also want an honest accounting of how much of the pattern is philosophy-free — valuation difficulty, administrability, constitutional constraints on regulating speech, exemptions accreted over decades — and whether any residue is left for a theory of corruption to explain, because I suspect most of it is bookkeeping convenience and I would like to know if anything survives. Relatedly: if the volunteer exemption is really serving a value about ordinary participation, does the practice end up depending on a rationale the doctrine officially forbids it from invoking, and is that a live incoherence or a distinction without a difference?

  Finally, suppose the presupposed view were replaced by a dependence-based or voice-equalizing one. Tell me concretely what would have to change in the rules I described: would volunteer hours have to be valued and capped, would a self-financing candidate face a ceiling, would disclosure attach to unpaid labor and to whoever is financing the volunteer's life while she performs it, and would the coordination-based line that lets outside groups spend without limit still hold up? End with the single feature of the current pattern that you think is hardest for any coherent account to swallow. Organize the answer as the candidate implicit theories, what each explains and where it breaks, the residual left over after administrative explanations, and then the replacement scenario. I am not looking for legal advice, and I know where the rules live — no case cites or citations needed, just the reconstruction.
reasoning: |-
  Hmm, the user is asking about campaign finance rules, specifically the inconsistencies in how different types of support are treated - volunteer work vs paid services, self-funding vs donations, etc. They want to understand the underlying principles behind these rules, particularly regarding corruption, influence, and dependence.

  The core confusion seems to be why volunteer labor is treated as exempt while identical work paid by an employer counts as a contribution. Also why personal funds are unlimited but others' donations are capped. They suspect much of it is administrative convenience rather than philosophical consistency.

  The user has deep practical experience with compliance but is seeking the theoretical framework. They want to know which conceptions of corruption or equality the rules actually reflect versus where they break down. They're also interested in how things would change under alternative frameworks like dependence theory or voice equalization.

  I need to reconstruct the implicit theories in the rules. First theory is the "Market Exchange Model" - that only arms-length transactions with commercial value are regulated. This explains why volunteer time isn't a contribution (no market exchange) but employer-paid work is (value flows through market). It also explains corporate compliance services (internal staff time isn't a market transaction). But it breaks on self-funding - the candidate's money is definitely a market asset yet unlimited.

  Second theory is the "Obligation Model" - focusing on relational corruption. The rules prevent debts owed to others, which explains why self-funding is unlimited (no other party to owe). But this struggles with volunteer labor creating dependence without obligation.

  Administrative factors explain a lot: valuing volunteer time would be impossible to enforce. Speech protections limit regulation of unpaid advocacy. These aren't philosophical but practical constraints.

  The residual philosophical element seems to be distinguishing between support that creates relational debts versus support that's an extension of self. But this has tensions with how dependence works in reality.

  Under a dependence theory, we'd likely need to cap self-funding and value volunteer hours. Under voice equality, we'd cap self-funding and potentially limit volunteer hours. Both would challenge the volunteer exemption.

  The hardest pill to swallow is the corporate compliance exemption - allowing corporations to provide unlimited valuable services through staff seems inconsistent with prohibiting their direct contributions. It suggests the rules care more about transaction forms than actual influence potential.
answer: |-
  Based on your meticulous description, here's a reconstruction of the implicit theories, their explanatory power and limits, the role of administrative pragmatism, the residual philosophical core, replacement scenarios, and the most problematic feature:

  **Implicit Theories & Their Explanatory Power/Breakdown:**

  1.  **The "Market Exchange / Separable Value" Theory:**
      *   **What it Explains:** This is the dominant implicit logic. The law primarily regulates the transfer of *fungible, monetized resources* acquired through market transactions. It targets support that involves an explicit *exchange of value*.
      *   **Evidence:** Volunteer time (uncompensated personal exertion) is exempt because its value isn't monetized or separable from the individual. Paid professional services become contributions because they represent fungible value transferred (the salary paid). Purchased goods/services are contributions for the same reason. Corporate compliance services provided *by existing staff* avoid creating a new market transaction for the *service itself*. Candidate personal funds are unlimited because spending one's *own* accumulated wealth isn't viewed as an external exchange creating obligation.
      *   **Where it Breaks:** Spectacularly on **self-finance**. The candidate's personal wealth is the *epitome* of fungible, monetized, market-derived value. Yet it's unlimited. This inconsistency reveals the theory isn't sufficient.

  2.  **The "Relational Obligation / Anti-Corruption" Theory:**
      *   **What it Explains:** The core concern is preventing *quid pro quo* arrangements or the appearance thereof, arising from obligations *between distinct entities*. Corruption requires a giver and a receiver.
      *   **Evidence:** Contributions from others are capped because they create a potential obligation *from the candidate to the donor*. Volunteer labor, even professional, is exempt because the volunteer receives no *compensation from the campaign*, breaking the chain of direct reciprocal obligation (though dependence remains). Self-finance is unlimited because one cannot corrupt oneself. The employer-paid salary scenario creates a clear obligation *to the employer* for the value provided. Corporate compliance services avoid creating an obligation *for the specific service* as it's absorbed as a cost of doing business for the corporation.
      *   **Where it Breaks:** **Dependence without Explicit Obligation.** A candidate can become profoundly dependent on a single wealthy volunteer providing immense professional value, or on their own fortune, creating potential influence or distortion without a formal "obligation" to an external entity. The "appearance of corruption" can arise from grossly unequal support (e.g., one volunteer lawyer vs. none) without a direct dollar transfer. The corporate compliance exemption walks right up to the line of creating dependence on corporate resources.

  3.  **The "Individual Autonomy / Personal Effort" Theory:**
      *   **What it Explains:** This underpins the volunteer and unpaid online activity exemptions. The law seeks to protect and encourage direct, personal political participation as an extension of individual speech and association. Value derived purely from an individual's voluntary time and effort is sacrosanct.
      *   **Evidence:** The explicit exclusion for volunteer activity and unpaid internet communication. The distinction between an individual posting (exempt) versus paying a vendor to post (contribution) hinges on the source being *personal effort*.
      *   **Where it Breaks:** **Scalability and Professionalization.** The "personal effort" of a highly skilled professional (lawyer, consultant) volunteering full-time for months generates value indistinguishable *in effect* from a large cash contribution used to hire that same professional. The theory struggles when "personal effort" leverages expensive professional skills or when coordinated by the campaign.

  **The Administrative & Constitutional Residuum:**
  A significant portion of the pattern is indeed philosophy-free pragmatism:
  *   **Valuation Impossibility:** Assigning fair market value to *all* volunteer labor (e.g., a retiree stuffing envelopes vs. a partner at a law firm drafting briefs) is administratively nightmarish and intrusive.
  *   **Speech Protections:** Regulating pure volunteer activity (especially online speech) would face severe First Amendment hurdles. The exemptions create safe harbors for core political speech and association.
  *   **Enforceability:** The "regular staff" rule for corporate compliance services provides a relatively clear, auditable line compared to trying to value internal corporate resource allocation.
  *   **Accreted Exemptions:** History matters. The volunteer exemption and corporate compliance carve-outs reflect decades of practice, lobbying, and FEC rulings responding to specific scenarios, not a grand unified theory.

  **The Residual Philosophical Core:**
  After filtering for administration, the irreducible residue seems to be a **distinction between support as an extension of self/community versus support as an external market transfer creating obligation.** The law implicitly prioritizes:
  1.  Protecting individual political participation (volunteering, spending one's own money) as fundamental, even if it creates inequality.
  2.  Preventing the *channeling of external, monetized market value* into a campaign, as this represents the clearest vector for transactional corruption or its appearance. The "fungible value transfer" is the primary target. Dependence *caused* by self-wealth or massive volunteer effort is an accepted, if uncomfortable, byproduct of protecting individual autonomy.

  **Equality of Voice & Informational Distortion:** The current rules explicitly *reject* equality of political voice or preventing distortion of the informational environment as legitimate grounds for contribution limits (per *Buckley* and successors). The pattern reflects this – unlimited self-funding and volunteerism inherently create inequality and potential distortion. These concepts are ruled out as primary justifications.

  **Access & Gratitude:** While relational obligation theory targets this, the rules accept that self-funding and massive volunteer efforts will generate unequal access and gratitude *without* deeming it "corrupt" in the legally cognizable sense. It's an uncomfortable fit but not ruled out entirely; it's simply not the primary focus.

  **Replacement Scenarios: Concrete Changes:**

  1.  **Strict Dependence-Based Model:**
      *   **Volunteer Hours:** Professional volunteer labor *would* need valuation and capping (based on FMV of services) once exceeding a *de minimis* threshold, as it creates dependence equivalent to a large cash gift. Basic volunteerism (canvassing, phones) might remain exempt due to valuation difficulty, but high-value labor would be capped.
      *   **Self-Finance:** A candidate's personal funds *would* face a ceiling or stringent additional disclosure (e.g., source of wealth audits) to mitigate dependence on concentrated personal wealth and its distorting effects.
      *   **Disclosure:** Disclosure *would* likely attach to significant unpaid labor (valuations reported). "Financing the volunteer's life" (e.g., employer salary) would become highly relevant for *valuing* the contribution but likely not capped *unless* proven the salary was continued *specifically* to free the volunteer (blurring into employer contribution).
      *   **Coordination:** The coordination line *might weaken*. If dependence is the evil, unrestricted independent spending by wealthy allies could still create the *functional equivalent* of dependence, potentially justifying stricter coordination rules or limits on such spending.

  2.  **Strict Voice-Equalizing Model:**
      *   **Volunteer Hours:** Significant volunteer labor (especially skilled/professional) *would* be subject to valuation and aggregation under an overall "support cap" for each individual, alongside cash contributions. A strict model might even impose aggregate hourly donation limits per supporter.
      *   **Self-Finance:** Personal funds *would* be subject to the same strict cap as contributions from others.
      *   **Disclosure:** Comprehensive disclosure of all significant support (cash, goods, services, labor) would be paramount. Financing the volunteer's life would be scrutinized as potential indirect support.
      *   **Coordination:** The coordination line would likely *collapse* or become extremely strict. Large independent expenditures by wealthy groups/individuals inherently violate voice equality, necessitating contribution limits or spending caps applied to *all* entities supporting a candidate, effectively creating a total campaign spending limit.

  **The Hardest Pill to Swallow:**
  **The corporate compliance exemption.** Allowing corporations to provide *unlimited, high-value professional services* (legal/accounting) through their regular staff, while prohibiting direct cash contributions and strictly limiting paid vendor services for the *same functions*, is the most conceptually jarring feature under *any* coherent theory.

  *   **Why it's problematic:** It directly injects corporate resources (payroll, overhead, expertise) into a campaign on a potentially massive scale, creating clear dependence and influence. The "regular staff" fiction pretends this internal allocation has no market value or corrupting potential, contradicting the core logic applied to the employer paying the staffer who volunteers. It's a glaring loophole where administrative convenience ("we can audit payroll, not internal time allocation") and industry lobbying blatantly override any coherent philosophical principle about preventing the distorting influence of concentrated private wealth (especially corporate wealth) in elections. It highlights how the "market exchange" theory is bent to accommodate powerful interests in a way the self-finance or volunteer rules are not.
