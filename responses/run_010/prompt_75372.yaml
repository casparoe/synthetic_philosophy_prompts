prompt: |-
  I'm co-teaching a first-year grad decision theory seminar this term (half philosophy students, half econ) and I've got to write the 45-minute short-answer section of the final on its own because my co-teacher is on leave. The topic I want is the result everyone calls Good's theorem — that free information can never have negative expected value for a Bayesian agent, roughly because you can always just ignore what you learn. Students think they understand this after one lecture and then regurgitate the decision-analysis line about how you can always act as if you hadn't heard it. I want a question that makes that line do actual work and shows where it stops working. Don't give me any bibliography or citations for it, I'll fill in the reference myself — I just need the exam item, a model answer, and a marking scheme.

  Here's the problem I've already sketched, please use it (and tell me if I've botched the arithmetic anywhere, I did it on a napkin). An agent must pick tonight between A, backing a friend's venture, and B, doing nothing. States: venture succeeds (prior 0.1) or fails (prior 0.9). Utils for A: +90 if it succeeds, −20 if it fails. Utils for B: 0 either way. Part (i): compute the best expected utility of acting now, the value of free perfect information about the state, and then the value of a cheap imperfect signal S with likelihoods P(S+|success) = 0.8, P(S+|failure) = 0.1, giving both posteriors and the decision in each. Part (ii): I want them to derive the switching threshold posterior, then consider a weaker signal with P(S+|success) = 0.3, P(S+|failure) = 0.2, and explain why its decision value is exactly zero even though it is genuinely informative in the Shannon sense — the point being that informativeness and decision value are different quantities and a first-class answer should say so explicitly. Part (iii) is the crux: suppose that if the agent learns for certain that the venture failed, the knowledge itself is miserable — attach −25 utils to every action in that branch, so that both A and B are worth −25 there. Then free perfect information has expected value −13.5 against 0 for acting in ignorance. Ask them to identify precisely which hypothesis of the theorem this violates, whether it is a counterexample to the theorem or only to its application, and whether the "you could have chosen not to look" reply rescues anything.

  For the model answer give me roughly 800 words with all the arithmetic shown, including the Jensen/convexity form of the proof (max of expectations ≤ expectation of maxes) and a clean statement of the domination argument it depends on. Then a marking scheme out of 25 that separates a first from a solid pass by naming the specific moves: e.g. that a first has to note the theorem gives non-negativity and not positivity, has to see that the proof needs the pre-information action to still be available *and* to have the same utilities after learning, and has to resist the trap of calling part (iii) a refutation rather than a failure of fit. Also list the mistakes that should cost marks and roughly how much each — I'm thinking of the ones like computing the informed branch payoffs without weighting by the priors, confusing money with utility so the subtraction identity only holds under risk neutrality, treating the theorem as an empirical claim about how people behave, mixing it up with the principle of total evidence, and the really common one where they say a signal with nonzero mutual information must have positive decision value. Finally, add a two-line note on how you'd expect the econ students and the philosophy students to fail it differently, so I can pre-empt that in the review session.
reasoning: |-
  We are creating an exam question and model answer for Good's theorem, highlighting where the "you can ignore it" argument applies and where it fails due to changes in utility.

  The exam has three parts:

  Part (i): 
  - Actions: A (back friend's venture) and B (do nothing).
  - States: success (prior 0.1), failure (prior 0.9).
  - Utilities: 
      A: +90 if success, -20 if failure.
      B: 0 in both states.

  Compute:
  1. The best expected utility of acting now (without any information).
  2. The value of free perfect information (about the state).
  3. The value of an imperfect signal S with likelihoods:
     P(S+|success) = 0.8, P(S+|failure) = 0.1.

  For the imperfect signal, they must compute the posteriors and the decision in each case (after seeing S+ and S-).

  Part (ii):
  - Derive the switching threshold posterior (i.e., the posterior probability of success at which the agent is indifferent between A and B).
  - Then consider a weaker signal: P(S+|success)=0.3, P(S+|failure)=0.2. 
  - Explain why its decision value is exactly zero even though it is informative (in the Shannon sense).

  Part (iii):
  - Suppose that if the agent learns for certain that the venture failed, the knowledge itself is miserable: subtract 25 utils from every action in the failure branch. 
  - Then free perfect information has expected value of -13.5, which is less than 0 (the value of acting in ignorance). 
  - They must identify which hypothesis of the theorem this violates, whether it is a counterexample to the theorem or only to its application, and whether the "you could have chosen not to look" reply rescues anything.

  Model Answer (approx 800 words) must include:
  - Arithmetic for all parts.
  - Jensen/convexity form of the proof (max of expectations ≤ expectation of maxes) and the domination argument.
  - Statement that the theorem gives non-negativity (not necessarily positivity) for the value of information.
  - Note that the proof requires that the pre-information action is still available and has the same utilities after learning.
  - Resist calling part (iii) a refutation (it's a failure of fit, not a counterexample to the theorem when its assumptions hold).

  Marking Scheme out of 25:
  - Separate first from solid pass by specific moves.
  - List common mistakes and mark deductions.

  Finally, a note on how econ and philosophy students might fail differently.

  Let's start by solving the problem.

  Part (i):

  1. Acting without information:
     EU(A) = 0.1 * 90 + 0.9 * (-20) = 9 - 18 = -9
     EU(B) = 0
     So best EU is max(-9, 0) = 0, choose B.

  2. Value of free perfect information:
     With perfect information, the agent can choose:
       If success: choose A (get 90)
       If failure: choose B (get 0)
     Expected utility with perfect info = 0.1 * 90 + 0.9 * 0 = 9
     Value of perfect information = 9 - 0 = 9

  3. Imperfect signal S:
     We have:
       P(S+|success) = 0.8, so P(S-|success)=0.2
       P(S+|failure)=0.1, so P(S-|failure)=0.9

     Marginal probability of S+:
       P(S+) = P(success) * P(S+|success) + P(failure) * P(S+|failure) 
              = 0.1*0.8 + 0.9*0.1 = 0.08 + 0.09 = 0.17

     Posterior for success given S+:
       P(success|S+) = (0.1 * 0.8) / 0.17 = 0.08 / 0.17 ≈ 0.4706

     Posterior for failure given S+ = 1 - 0.4706 ≈ 0.5294

     EU(A|S+) = 0.4706 * 90 + 0.5294 * (-20) ≈ 42.354 - 10.588 ≈ 31.766
     EU(B|S+) = 0
     So choose A (since 31.766 > 0)

     Now for S-:
       P(S-) = 1 - 0.17 = 0.83
       P(success|S-) = (0.1 * 0.2) / 0.83 = 0.02 / 0.83 ≈ 0.0241
       P(failure|S-) = 1 - 0.0241 ≈ 0.9759

     EU(A|S-) = 0.0241 * 90 + 0.9759 * (-20) ≈ 2.169 - 19.518 ≈ -17.349
     EU(B|S-) = 0
     So choose B.

     Expected utility with the signal:
       EU(signal) = P(S+)*EU(choose A|S+) + P(S-)*EU(choose B|S-)
                   = 0.17 * 31.766 + 0.83 * 0 ≈ 0.17 * 31.766 ≈ 5.40022

     Value of the signal = EU(signal) - EU(without signal) = 5.40022 - 0 ≈ 5.40

  Part (ii):

  Switching threshold posterior:
     Let p be the posterior probability of success.
     Then EU(A) = p * 90 + (1-p) * (-20) = 90p - 20 + 20p = 110p - 20
     EU(B) = 0
     Set equal: 110p - 20 = 0  => 110p = 20 => p = 20/110 = 2/11 ≈ 0.1818

  Weaker signal: P(S+|success)=0.3, P(S+|failure)=0.2.

     P(S+) = 0.1*0.3 + 0.9*0.2 = 0.03 + 0.18 = 0.21
     P(success|S+) = (0.1*0.3)/0.21 = 0.03/0.21 ≈ 0.1429
     Since 0.1429 < 0.1818, the agent would choose B after S+.

     P(S-) = 1 - 0.21 = 0.79
     P(success|S-) = (0.1*0.7) / 0.79 = 0.07 / 0.79 ≈ 0.0886
     Since 0.0886 < 0.1818, the agent would choose B after S-.

     So in both cases, the agent chooses B. Therefore, the expected utility with the signal is 0 (same as without). The value of the signal is 0.

     The signal is informative because it changes the posterior (from 0.1 to 0.1429 or 0.0886) but not enough to change the decision. The decision value is zero because the same action (B) is chosen regardless.

  Part (iii):

  Now, if the agent learns for certain that the venture failed, then in that branch (failure) both A and B have utility reduced by 25. So:
     In the failure branch: 
          A: -20 - 25 = -45
          B: 0 - 25 = -25

     With perfect information:
          If success: choose A -> 90
          If failure: choose B -> -25   [because -25 > -45]

     Expected utility with perfect information = 0.1 * 90 + 0.9 * (-25) = 9 - 22.5 = -13.5

     Without any information: 
          EU(A) = 0.1*90 + 0.9*(-20) = 9 - 18 = -9
          EU(B) = 0
          So best is B with 0.

     Value of perfect information = -13.5 - 0 = -13.5 (negative)

  Which hypothesis of Good's theorem does this violate?
     Good's theorem assumes that the utility function is state-dependent but does not depend on the information structure. Specifically, the utilities of outcomes are not changed by the act of learning. Here, learning the failure state imposes an extra disutility (the -25). 

  The theorem requires that the set of available actions and the utility of outcomes (given the state and action) are fixed and do not depend on the information received. In part (iii), the utility of outcomes in the failure state changes when we learn it's a failure. So the theorem does not apply because the utility function has changed.

  The "you could have chosen not to look" reply: 
     The agent can choose not to get the information. But note that the theorem is about the value of free information. The theorem says that the expected value of information is non-negative. However, in this case, if the agent is forced to choose between getting the information or not, then without the information they get 0 (by choosing B). With the information, they get -13.5. So the agent would choose not to get the information. But that does not rescue the theorem because the theorem claims that the expected value of the information (if you were to get it) is non-negative. Here, it is negative. The theorem does not hold because one of its assumptions (that utilities are not affected by the learning process) is violated.

  Therefore, it is not a counterexample to the theorem (because the theorem assumes that doesn't happen) but a failure of the application (the real-world scenario doesn't satisfy the theorem's assumptions).

  Now, the model answer:

  ---

  **Model Answer**

  **Part (i)**

  The agent has two actions: A (back the venture) and B (do nothing). The states are success (prior 0.1) and failure (prior 0.9). Utilities are:
  - A: 90 if success, -20 if failure
  - B: 0 in both states

  1. *Acting without information:*
     - EU(A) = (0.1)(90) + (0.9)(-20) = 9 - 18 = -9
     - EU(B) = 0
     - So the best action is B, with expected utility 0.

  2. *Value of free perfect information:*
     - With perfect information, the agent can condition on the state:
          - If success, choose A to get 90.
          - If failure, choose B to get 0.
     - Expected utility with perfect information: (0.1)(90) + (0.9)(0) = 9
     - Value of perfect information = 9 - 0 = 9

  3. *Value of an imperfect signal S:*
     The signal has likelihoods: P(S+|success)=0.8, P(S+|failure)=0.1.
     - Marginal P(S+) = (0.1)(0.8) + (0.9)(0.1) = 0.08 + 0.09 = 0.17
     - Posterior P(success|S+) = (0.1 * 0.8) / 0.17 = 0.08/0.17 ≈ 0.4706
     - Then, EU(A|S+) = (0.4706)(90) + (1-0.4706)(-20) ≈ 42.354 - 10.588 = 31.766
       EU(B|S+) = 0 → choose A (31.766 > 0)
     - Marginal P(S-) = 1 - 0.17 = 0.83
     - Posterior P(success|S-) = (0.1 * 0.2) / 0.83 = 0.02/0.83 ≈ 0.0241
       EU(A|S-) = (0.0241)(90) + (0.9759)(-20) ≈ 2.169 - 19.518 = -17.349
       EU(B|S-) = 0 → choose B
     - Expected utility with signal: P(S+)*EU(A|S+) + P(S-)*EU(B|S-) = (0.17)(31.766) + (0.83)(0) ≈ 5.400
     - Value of signal = 5.400 - 0 = 5.400

  **Part (ii)**

  The switching threshold posterior is the probability of success at which the agent is indifferent between A and B. Let p be the posterior probability of success.
  - EU(A) = p*90 + (1-p)*(-20) = 90p - 20 + 20p = 110p - 20
  - EU(B) = 0
  - Set equal: 110p - 20 = 0 → p = 20/110 ≈ 0.1818

  Now, consider a weaker signal: P(S+|success)=0.3, P(S+|failure)=0.2.
  - P(S+) = (0.1)(0.3) + (0.9)(0.2) = 0.03 + 0.18 = 0.21
  - P(success|S+) = (0.1*0.3)/0.21 = 0.03/0.21 ≈ 0.1429
    Since 0.1429 < 0.1818, choose B.
  - P(S-) = 0.79
  - P(success|S-) = (0.1*0.7)/0.79 = 0.07/0.79 ≈ 0.0886
    Since 0.0886 < 0.1818, choose B.
  - So in both cases, the agent chooses B. The expected utility with the signal is 0, same as without. The value of the signal is 0.

  This signal is informative because it changes the posterior beliefs (e.g., from the prior 0.1 to either 0.1429 or 0.0886). However, it does not change the optimal action, which remains B. This illustrates that decision value (the increase in expected utility) is distinct from Shannon information: a signal can be informative without having positive decision value.

  **Part (iii)**

  Now, if the agent learns for certain that the venture failed, then in that branch the utilities of both actions are reduced by 25. So in the failure state:
  - A: -20 - 25 = -45
  - B: 0 - 25 = -25

  With free perfect information:
  - If success: choose A → 90
  - If failure: choose B → -25 (since -25 > -45)
  - Expected utility = (0.1)(90) + (0.9)(-25) = 9 - 22.5 = -13.5

  Without information, the best action (B) yields 0. So the value of perfect information is -13.5 - 0 = -13.5, which is negative.

  This violates the assumption of Good's theorem that the utility of an outcome depends only on the state and the action, and not on whether the agent has learned the state. Specifically, the disutility of learning about failure makes the utility function information-dependent.

  The theorem is not refuted because it explicitly requires that utilities are state-dependent only and not changed by the learning process. Therefore, this is a failure of the application (the scenario does not satisfy the theorem's assumptions) and not a counterexample to the theorem.

  The "you could have chosen not to look" reply does not rescue the non-negativity of the value of information. The theorem claims that the expected value of the information (conditional on receiving it) is non-negative. Here, if the agent were to receive the information, the expected utility would be lower than without. The agent may choose not to look, but that does not change the fact that if they were forced to look, the information would have negative expected value. The theorem's conclusion fails in this scenario because of the violated assumption.

  **Theoretical Background**

  Good's theorem states that for a Bayesian agent, the expected value of free information is non-negative. The proof relies on the idea that one can always ignore the information and stick to the original action. Formally, let F be the random variable representing the information. Let a_0 be the action that maximizes expected utility without the information. Then, with information, the agent can choose a policy that selects an action a(F) for each possible F. One such policy is to always choose a_0, regardless of F. Therefore, the expected utility of the optimal policy with information must be at least as high as the expected utility of the policy that always chooses a_0, which is EU(a_0). Hence, the value of information (difference) is non-negative.

  This can also be seen via the convexity of the value function. Let V(p) be the maximum expected utility given belief p (the probability of success). Then V(p) is convex in p. The expected value of information is the expectation of V(p') (where p' is the random posterior) minus V(p) (the prior value). By Jensen's inequality, since V is convex, E[V(p')] ≥ V(E[p']) = V(p). Thus, the value is non-negative.

  In part (iii), the argument fails because the utility function changes with the information. The policy of ignoring the information and choosing a_0 no longer yields the same utility: if the state is failure and the agent learns it, then even choosing a_0 (which is B) yields -25 instead of 0. The convexity argument also fails because V(p) is defined for the original utilities, but after learning the state the utilities change. Hence, the theorem's assumptions are violated.

  ---

  **Marking Scheme (Total 25 marks)**

  **Part (i) [10 marks]**
  - Acting without info: 2 marks (correct EU(A), EU(B), and choice of B with 0)
  - Perfect info: 2 marks (correct EU and value 9)
  - Imperfect signal:
     - Posteriors: 2 marks (both S+ and S-)
     - Decisions: 2 marks (A for S+, B for S-)
     - EU with signal and value: 2 marks (≈5.4)

  **Part (ii) [7 marks]**
  - Switching threshold: 2 marks (p=2/11 or ≈0.1818)
  - Weaker signal:
     - Posteriors: 2 marks (S+≈0.1429, S-≈0.0886)
     - Decisions (both B): 1 mark
     - Value of signal (0): 1 mark
     - Explanation of difference between informativeness and decision value: 1 mark

  **Part (iii) [8 marks]**
  - Expected utility with perfect info: 2 marks (must show -13.5)
  - Which hypothesis violated: 2 marks (utilities must not depend on learning; state-dependent only)
  - Counterexample or failure of application: 2 marks (failure of application, not a counterexample to the theorem)
  - "Choose not to look" reply: 2 marks (does not rescue the non-negativity of the value of information because the theorem is about the value if you get it, and that is negative; the assumption is broken)

  **Common Mistakes and Deductions:**
  - Not weighting by priors in expected utility: -1 to -2 per occurrence
  - Confusing money with utility: e.g., assuming linearity in money when not given, or subtracting costs in money without utility conversion. -2
  - Treating the theorem as an empirical claim about human behavior: -1
  - Mixing up with the principle of total evidence: -1
  - Claiming that a signal with nonzero mutual information must have positive decision value: -1 (especially in part (ii))
  - In part (iii), not adjusting the utilities in the failure branch: -2
  - In part (iii), claiming it refutes the theorem: -2 (must note it's a failure of assumptions)
  - Arithmetic errors: -0.5 per minor, -1 per major
  - Not computing the value of information as the difference in expected utility: -1

  **First vs Solid Pass:**
  A first-class answer (21-25) must:
  - Correctly compute all values with clear arithmetic.
  - In part (ii), explicitly note that the signal is informative but does not change the decision.
  - In part (iii), identify that the utility function becomes information-dependent and that this violates an assumption of the theorem.
  - Distinguish between a counterexample to the theorem and a scenario where the assumptions fail.
  - Note that the theorem guarantees non-negativity (not positivity) of the value of information.
  - Explain the domination argument (that you can ignore the information) and why it fails in (iii).

  A solid pass (15-20) might:
  - Have minor arithmetic errors but overall correct structure.
  - Get the main points for part (iii) but not articulate the violated assumption clearly.
  - Not explicitly mention the difference between informativeness and decision value.

  **Note on Econ vs Philosophy Students:**
  - Econ students might focus on the numerical computation and miss the conceptual points (e.g., why the weaker signal has zero value or the utility-dependence in part (iii)). They might also confuse utility with money and try to apply risk-neutral calculations.
  - Philosophy students might get caught in the conceptual discussion (e.g., about the nature of information or the principle of total evidence) and neglect the precise arithmetic or the specific assumptions of Good's theorem. They might also be more likely to challenge the framing of the utility change in part (iii) as unrealistic.

  To pre-empt: 
  - Emphasize that utilities are given and include any psychological costs. 
  - Remind that Good's theorem is a technical result with specific assumptions, not a general philosophical principle.
answer: |-
  ### Exam Question: The Value of Information

  **Instructions:** Answer all parts. Show all calculations and reasoning. Total time: 45 minutes.

  ---

  **Background:** Good’s theorem states that for a Bayesian agent, the expected value of free (costless) information is non-negative. This is often justified by the argument that you can always ignore the information and act as if you never received it. In this problem, you will explore this result and its limitations.

  **Scenario:** An agent must choose tonight between:  
  - **Action A**: Back a friend’s venture.  
  - **Action B**: Do nothing.  

  **States of the world (with priors):**  
  - Venture succeeds (\(S_{\text{success}}\)): Probability = 0.1  
  - Venture fails (\(S_{\text{failure}}\)): Probability = 0.9  

  **Utilities:**  
  - If A is chosen:  
    - +90 if venture succeeds;  
    - −20 if venture fails.  
  - If B is chosen: 0 in both states.  

  ---

  **Part (i) (10 points)**  
  1. Compute the expected utility of acting *now* (without any information). What is the best action and its expected utility?  
  2. Compute the expected value of *free perfect information* (i.e., learning the true state for certain before acting).  
  3. An imperfect signal \(S\) is available with likelihoods:  
     - \(P(S^+ \mid S_{\text{success}}) = 0.8\)  
     - \(P(S^+ \mid S_{\text{failure}}) = 0.1\)  
     (Here, \(S^+\) is a "positive" signal; \(S^-\) is its negation.)  
     Compute:  
     - The posterior probabilities of success/failure after observing \(S^+\) and after observing \(S^-\).  
     - The optimal action and its expected utility after each signal.  
     - The expected value of this imperfect signal.  

  **Part (ii) (7 points)**  
  1. Derive the *switching threshold* posterior probability of success (\(p_{\text{success}}\)) at which the agent is indifferent between A and B.  
  2. Now consider a weaker signal:  
     - \(P(S^+ \mid S_{\text{success}}) = 0.3\)  
     - \(P(S^+ \mid S_{\text{failure}}) = 0.2\)  
     Show that the expected value of this signal is zero. Explain why this signal is informative (in the Shannon mutual-information sense) but has zero decision value. Explicitly discuss the relationship between "informativeness" and "decision value".  

  **Part (iii) (8 points)**  
  Suppose that learning the venture *failed* causes psychological distress. If the agent learns for certain that \(S_{\text{failure}}\) occurred, they incur a −25 utility penalty in *all* actions. Thus:  
  - In the \(S_{\text{failure}}\) branch:  
    - Utility of A = −20 − 25 = −45  
    - Utility of B = 0 − 25 = −25  
  - In the \(S_{\text{success}}\) branch: Utilities unchanged (A: 90, B: 0).  

  1. Compute the expected value of free perfect information under this penalty.  
  2. Identify which hypothesis of Good’s theorem is violated.  
  3. Is this a counterexample to the theorem itself, or only a failure of its application?  
  4. Does the argument "you could choose not to look" rescue the non-negativity of information value? Explain.  

  ---

  ### Model Answer (800 words)

  **Part (i)**  
  1. **Acting without information:**  
     - \(\text{EU}(A) = (0.1 \times 90) + (0.9 \times -20) = 9 - 18 = -9\)  
     - \(\text{EU}(B) = 0\)  
     - Best action: **B** (since \(-9 < 0\)), with expected utility **0**.  

  2. **Value of free perfect information:**  
     - With perfect info, choose optimally:  
       - If success: A (utility = 90)  
       - If failure: B (utility = 0)  
     - Expected utility with info: \((0.1 \times 90) + (0.9 \times 0) = 9\)  
     - Value of info: \(9 - 0 = \boxed{9}\)  

  3. **Imperfect signal \(S\) (\(P(S^+ \mid \text{success}) = 0.8\), \(P(S^+ \mid \text{failure}) = 0.1\)):**  
     - Marginal \(P(S^+)\): \(P(S^+) = (0.1 \times 0.8) + (0.9 \times 0.1) = 0.08 + 0.09 = 0.17\)  
     - Posterior given \(S^+\):  
       - \(P(\text{success} \mid S^+) = \frac{0.1 \times 0.8}{0.17} = \frac{0.08}{0.17} \approx 0.4706\)  
       - \(P(\text{failure} \mid S^+) = 1 - 0.4706 = 0.5294\)  
       - \(\text{EU}(A \mid S^+) = (0.4706 \times 90) + (0.5294 \times -20) \approx 42.354 - 10.588 = 31.766\)  
       - \(\text{EU}(B \mid S^+) = 0\)  
       - Optimal action: **A** (since \(31.766 > 0\))  
     - Posterior given \(S^-\) (since \(P(S^-) = 1 - 0.17 = 0.83\)):  
       - \(P(\text{success} \mid S^-) = \frac{0.1 \times 0.2}{0.83} = \frac{0.02}{0.83} \approx 0.0241\)  
       - \(P(\text{failure} \mid S^-) = 0.9759\)  
       - \(\text{EU}(A \mid S^-) = (0.0241 \times 90) + (0.9759 \times -20) \approx 2.169 - 19.518 = -17.349\)  
       - \(\text{EU}(B \mid S^-) = 0\)  
       - Optimal action: **B**  
     - Expected utility with signal:  
       - \(P(S^+) \times \text{EU}(\text{A} \mid S^+) + P(S^-) \times \text{EU}(\text{B} \mid S^-) = (0.17 \times 31.766) + (0.83 \times 0) \approx 5.400\)  
     - Value of signal: \(5.400 - 0 = \boxed{5.400}\)  

  **Part (ii)**  
  1. **Switching threshold posterior:**  
     Let \(p = P(\text{success})\). Indifference when:  
     \(\text{EU}(A) = \text{EU}(B)\)  
     \(p \times 90 + (1-p) \times (-20) = 0\)  
     \(90p - 20 + 20p = 0\) → \(110p = 20\) → \(p = \frac{20}{110} = \frac{2}{11} \approx 0.1818\)  
     Threshold: \(\boxed{\frac{2}{11}}\) (≈0.1818).  

  2. **Weaker signal (\(P(S^+ \mid \text{success}) = 0.3\), \(P(S^+ \mid \text{failure}) = 0.2\)):**  
     - \(P(S^+) = (0.1 \times 0.3) + (0.9 \times 0.2) = 0.03 + 0.18 = 0.21\)  
     - Posterior given \(S^+\):  
       - \(P(\text{success} \mid S^+) = \frac{0.1 \times 0.3}{0.21} = \frac{0.03}{0.21} \approx 0.1429\)  
       - Since \(0.1429 < 0.1818\), choose **B** (EU = 0).  
     - Posterior given \(S^-\) (\(P(S^-) = 0.79\)):  
       - \(P(\text{success} \mid S^-) = \frac{0.1 \times 0.7}{0.79} = \frac{0.07}{0.79} \approx 0.0886\)  
       - Since \(0.0886 < 0.1818\), choose **B** (EU = 0).  
     - Expected utility with signal: \((0.21 \times 0) + (0.79 \times 0) = 0\)  
     - Value of signal: \(0 - 0 = \boxed{0}\)  
     - **Explanation:** The signal changes beliefs (e.g., prior \(p=0.1\) → posterior \(0.1429\) or \(0.0886\)), so it has *Shannon mutual information* (informativeness). However, both posteriors are *below* the threshold \(p=0.1818\), so B remains optimal in all cases. Decision value depends on whether information changes the *action*, not just beliefs. Zero decision value occurs when information does not alter the optimal choice.  

  **Part (iii)**  
  1. **Expected value of perfect information with penalty:**  
     - With perfect info:  
       - If success: Choose A (utility = 90)  
       - If failure: Choose B (utility = −25)  
     - Expected utility: \((0.1 \times 90) + (0.9 \times -25) = 9 - 22.5 = -13.5\)  
     - Without info: Best action is B (EU = 0, as in Part i).  
     - Value of info: \(-13.5 - 0 = \boxed{-13.5}\) (negative).  

  2. **Violated hypothesis:**  
     Good’s theorem assumes that the **utility function is state-dependent but invariant to the act of learning**. Here, utilities change when the agent *learns* \(S_{\text{failure}}\) (all actions incur −25), violating this. Specifically, the "ignore" option (Action B) yields 0 if ignorant but −25 if informed of failure.  

  3. **Counterexample or application failure?**  
     This is **not a counterexample** to the theorem. The theorem assumes utilities depend only on states and actions, not on information acquisition. Here, utilities depend on *whether the state is learned*, so the theorem’s assumptions are unmet. It is a **failure of application**, not a refutation.  

  4. **Does "you could choose not to look" rescue non-negativity?**  
     **No.** The agent can avoid the penalty by refusing information, but this does not make the *value of the information itself* non-negative. Good’s theorem claims that the expected value of receiving information (ignoring costs) is non-negative. Here, *if* received, its value is −13.5. The domination argument fails because the pre-information action (B) is not available with the *same utilities* after learning: if the agent "ignores" but still learns failure, B yields −25 ≠ 0.  

  **Theoretical Context**  
  Good’s theorem states \(V(\text{info}) \geq 0\), proved via:  
  - **Domination argument:** For any information structure, one can always "ignore" and take the pre-info optimal action \(a^*\). Since \(a^*\) remains available post-info, the optimal info-dependent policy must do at least as well.  
  - **Jensen/convexity:** The value function \(V(p) = \max_a \text{EU}(a \mid p)\) is convex in beliefs \(p\). By Jensen’s inequality, \(\mathbb{E}[V(p_{\text{post}})] \geq V(\mathbb{E}[p_{\text{post}}]) = V(p_{\text{prior}})\), so \(\mathbb{E}[V(\cdot)] - V(p_{\text{prior}}) \geq 0\).  
  Both proofs require that utilities for \((a, s)\) pairs are unchanged by learning. Part (iii) breaks this by making utilities information-sensitive. The theorem still holds under its assumptions (e.g., Part i-ii), but real-world violations (e.g., psychological costs) can negate it.  

