  I need to develop a numbered list of criteria that any adequate theory must meet. The user specified several key points to cover: shame without audiences, private guilt, second-order emotions (like shame about guilt), faults tied to identity rather than actions, differences in behavioral outcomes (repair vs withdrawal), and the need for culture-level variables rather than national character.

  For each desideratum, I'll include a motivating case and classify it as non-negotiable or preference-based. I'll also note if any pairs might conflict and identify which criterion eliminates the most existing theories. Finally, I'll briefly assess three common views (internalized-audience, act-vs-self, response-tendency) against the list.

  The user's underlying concerns seem to be: 1) practical applicability to social engineering of moral emotions, 2) avoiding essentialist traps like "national character," and 3) accounting for psychological complexities like private shame. They're clearly wrestling with how abstract distinctions translate to real-world interventions.

  I should emphasize D5 (identity-based faults) and D6 (behavioral divergence) as particularly challenging for many theories. The internalized-audience view might struggle with private shame (D1) while act-vs-self theories stumble on identity faults (D5). Response-tendency views could handle D6 well but might be reductionist.

  The formatting requires ending with "\answer{Dx–Dy / Dz}" indicating either conflicting desiderata or "NONE" plus the most exclusionary criterion. Based on my analysis, D1 and D5 seem hardest to reconcile across theories, and D5 likely eliminates the most accounts.
answer: |-
  Here are the desiderata for an adequate guilt/shame distinction account, structured as requested:

  **Desiderata:**

  1.  **D1: Account for Audience-Independent Shame Episodes**
      *   **Motivating Case:** An individual experiences intense shame over a private thought, fantasy, or physical characteristic (e.g., body image) *even when* they are completely alone, no actual audience is present, and they are not imagining any specific observer.
      *   **Status:** Non-negotiable. Core phenomenological reality.
  2.  **D2: Account for Private Guilt**
      *   **Motivating Case:** An individual feels profound guilt over a broken promise or hidden transgression that they are certain no one else will ever discover or know about. The emotion stems purely from the violation itself.
      *   **Status:** Non-negotiable. Core phenomenological reality, parallel to D1.
  3.  **D3: Explain Second-Order Emotions Targeting the Other**
      *   **Motivating Cases:**
          *   *Shame at feeling guilt:* Feeling ashamed for having felt guilt about a minor infraction, perceiving the guilt itself as a sign of weakness or excessive scrupulosity.
          *   *Guilt at causing shame:* Feeling guilty specifically for having publicly shamed or humiliated someone else, recognizing the harm caused by the shaming act.
      *   **Status:** Non-negotiable. Demonstrates the emotions are conceptually distinct enough to be objects for each other.
  4.  **D4: Formulate Culture-Level Shifts via "Turnable Variables"**
      *   **Motivating Case:** To assess the claim that societies can deliberately shift their "moral-emotional economy," the account must define the distinction in terms of manipulable social factors. Examples: *Concepts in circulation* (e.g., emphasis on sin vs. honor), *audience structure* (e.g., anonymity vs. tight-knit communities), *publicity of fault* (e.g., public trials vs. private confession), *availability of restitution* (e.g., clear paths to make amends). Must avoid reliance on static concepts like "national character."
      *   **Status:** Non-negotiable for the user's specific purpose. Essential for applicability.
  5.  **D5: Handle Fault Attached to "Being" (Including Unchosen States)**
      *   **Motivating Case:** Shame triggered by aspects of identity, status, or condition perceived as deficient or stigmatized (e.g., unchosen poverty, inherited social status, physical disability, sexual orientation, family disgrace) where there is no specific *action* to point to as the fault. The fault lies in *what one is*.
      *   **Status:** Non-negotiable. A core domain where shame is prominent and guilt is often absent or inappropriate.
  6.  **D6: Accommodate the Trait/Episode Gap and Divergent Longitudinal Behavioral Profiles**
      *   **Motivating Case:** Longitudinal evidence shows dispositional proneness to guilt (trait guilt) predicts behaviors oriented towards *repair* (apology, making amends, confronting harm). Dispositional proneness to shame (trait shame) predicts behaviors oriented towards *withdrawal/avoidance* (hiding, escape, aggression). An adequate account must explain why these emotional *episodes* (or dispositions towards them) consistently lead to such divergent *action tendencies* over time.
      *   **Status:** Non-negotiable. Grounds the distinction in empirically observable consequences crucial for the user's interest in societal outcomes.
  7.  **D7: Maintain Conceptual Distinction Without Mutual Exclusivity**
      *   **Motivating Case:** Acknowledge that guilt and shame can co-occur (e.g., feeling both guilty for stealing and ashamed of being a thief) or follow each other rapidly, while still providing criteria to distinguish them conceptually and phenomenologically.
      *   **Status:** Preference (common, but some overly rigid accounts might neglect this nuance). Important for descriptive accuracy.

  **Conflict Flag:**
  *   **D1 (Audience-Independent Shame) and D5 (Fault Attached to Being)** jointly pose the strongest challenge. Accounts relying heavily on *internalized* audiences (D1) often struggle to explain shame about unchosen *being* (D5) without implying the individual somehow "chose" or "failed" regarding that state. Conversely, accounts focusing purely on "being" vs. "doing" (D5) may struggle with D1 if the "being" isn't inherently social. **This pair (D1 & D5) is the hardest to satisfy jointly across major theories.**

  **Most Exclusionary Desideratum:**
  *   **D5 (Fault Attached to "Being")** eliminates the most accounts currently on offer. Many influential theories (especially older "act" vs. "self" views) define guilt solely around actions/inactions and shame around the global self. This renders them unable to adequately account for shame about unchosen, inherent, or ascribed states (like poverty or lineage) where no specific action is the source, or guilt related to identity-based responsibilities. It also challenges simplistic internalized-audience views that imply the shame stems from a *failure* to meet an internalized standard regarding that state.

  **Assessment of Major Views:**

  1.  **Internalized-Audience View (Shame = failing before real/imagined observers; Guilt = violating internal standard):**
      *   **Fares Poorly:** Struggles severely with **D1** (truly audience-independent shame), **D5** (shame about unchosen being without implying a "failure"), and often muddles **D3**. May handle **D2** and **D4** variably. **D6** (withdrawal vs repair) isn't inherently explained.
  2.  **Act-Versus-Self View (Guilt = about specific behavior; Shame = about the global self):**
      *   **Fares Poorly:** Fails **D5** catastrophically (cannot handle shame about unchosen being without distorting it). Struggles with **D1** (why shame the *self* without any audience?), **D3** (esp. shame about guilt), and aspects of **D6** (why does shame of the *self* lead to withdrawal? Not inherent). Handles **D2** and parts of **D4** well. Often struggles with co-occurrence (**D7**).
  3.  **Response-Tendency View (Distinguished primarily by action tendency: Guilt→Repair; Shame→Withdrawal/Hiding):**
      *   **Fares Best:** Excels at **D6** (built on the evidence). Handles **D3** well (different responses targetable). Can accommodate **D1**, **D2**, **D4**, **D5**, and **D7** *if* it incorporates supplementary elements explaining *why* these different tendencies arise (e.g., linking repair to harm focus and withdrawal to self-focus/exposure). The core distinction is behavioral, leaving the antecedent cognitive/affective components needing further elaboration to fully satisfy other desiderata. It avoids the pitfalls of the other views regarding D1/D5.

  \answer{D1–D5 / D5}
