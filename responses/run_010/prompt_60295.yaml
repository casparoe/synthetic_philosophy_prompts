answer: |-
  Here are twelve rigorously ordered interview questions targeting the specified pressure points, with evasion notes and follow-ups for stock replies. Vocabulary is preserved but briefly contextualised for an advanced undergraduate audience.

  **Question Sequence & Rationale**  
  *(Opening: Forces metaphysical/epistemic clarification → Builds through core objections → Escalates to consciousness dilemma → Closes with sacrificial commitment)*  

  1. **Clarifying "Not Deducible in Principle":**  
     *"You state emergent properties aren't deducible *in principle* from complete physical facts. Could you precisely specify what capacities a hypothetically omniscient physicist would lack that prevents this deduction? Does this failure stem from a metaphysical gap or merely epistemic constraints like computational intractability?"*  
     → **Pressure:** Pins down metaphysical vs. epistemic reading of emergence.  
     → **Evasive answer:** Shifting to "unpredictable in practice" or conflating complexity with principled underivability.  

  2. **Distinguishing from Weak (Bedau-style) Emergence:**  
     *"Mark Bedau defines weak emergence as macro-level properties derivable *in principle* from micro-physics but only via computationally irreducible simulation. Why is your stronger claim—that emergence involves *underivable* novelty—necessary, given weak emergence already captures unpredictability in practice?"*  
     → **Pressure:** Forces justification for metaphysical novelty over computational limits.  
     → **Evasive answer:** Equating practical unpredictability with metaphysical irreducibility.  
     **→ Follow-up if she dismisses weak emergence as merely epistemic:** *"If weak emergence is ‘merely epistemic’, what *metaphysical work* do your novel causal powers perform that Bedau’s incompressible derivations cannot account for?"*  

  3. **The Causal Exclusion Argument & Overdetermination:**  
     *"Given the causal closure/completeness of physics—every physical effect has a sufficient physical cause—how can emergent properties exercise *novel* causal powers without either (a) overdetermining physical effects (e.g., my neuron firing caused by both physical states *and* consciousness) or (b) violating physical causal closure?"*  
     → **Pressure:** Threat of systematic overdetermination or causal closure violation.  
     → **Evasive answer:** Claiming exclusion "misunderstands" emergence without specifying how novel powers avoid overdetermination.  
     **→ Follow-up if she claims novel powers operate at a 'different level':** *"If emergent properties cause effects *also* fully determined by physical causes (e.g., consciousness causing neural firing already caused by synapses), isn’t this textbook overdetermination? How is this *not* redundant causation?"*  

  4. **The Redescription Charge:**  
     *"Critics like Kim argue ‘novel’ emergent properties are just redescriptions of underlying physical processes, adding no explanatory power. If every emergent effect is *implemented* by the physical base, what causal ‘work’ is left for the emergent property beyond what the physical parts do collectively?"*  
     → **Pressure:** Accusation that emergence is explanatorily empty.  
     → **Evasive answer:** Appealing to "explanatory perspectives" without specifying *causal* addition.  
     **→ Follow-up if she invokes ‘explanatory autonomy’:** *"Granted, chemists needn’t reference quarks—but does this autonomy reflect a genuine *causal surplus* at the chemical level, or just pragmatic division of labour? What *concrete effect* does a chemical property cause that its microphysical realisation does not?"*  

  5. **Level Selection & Ad Hocness:**  
     *"How do you determine *which* properties or levels are genuinely emergent? For instance, why consciousness or chemical bonding, but not fluid dynamics or software? If criteria are too permissive, emergence proliferates arbitrarily; if too restrictive, it appears ad hoc."*  
     → **Pressure:** Risk of unmotivated level multiplication or arbitrariness.  
     → **Evasive answer:** Vague appeals to "qualitative novelty" without clear thresholds.  
     **→ Follow-up if she cites ‘discontinuity’ in behaviour:** *"Many complex systems (e.g., chaotic weather) show discontinuous behaviour from micro-dynamics without invoking metaphysical emergence. Why isn’t consciousness/chemistry just another case of dynamical complexity?"*  

  6. **Multiple Realizability & Its Necessity:**  
     *"You cite multiple realizability (e.g., pain realised by diverse neural substrates) as evidence for irreducibility. But if a property *were* uniquely physically realised (e.g., a specific molecular structure for water’s liquidity), would it still be emergent? Is multiple realizability essential to your account?"*  
     → **Pressure:** Tests whether irreducibility requires multiple realizability.  
     → **Evasive answer:** Conflating multiple realizability with underivability.  

  7. **Downward Causation & Physical Indeterminism:**  
     *"When emergent properties ‘downwardly cause’ changes in their physical base (e.g., a mental state altering neural activity), mustn’t this either (a) break the completeness of physics by adding non-physical causes, or (b) imply the physical base was *indeterministic*—allowing ‘gaps’ for emergent causes to act?"*  
     → **Pressure:** Downward causation vs. physical closure/determinism.  
     → **Evasive answer:** Asserting downward causation is "non-disruptive" without explaining how.  

  8. **Novel Powers & Causal Drainage:**  
     *"If emergent properties exert genuinely novel causal powers, but every physical effect is *already* determined by physical causes (causal closure), doesn’t the physical base ‘drain’ all causal power from higher levels? How can emergent causes be anything but epiphenomenal?"*  
     → **Pressure:** Causal exclusion redux – novel powers threatened by physical sufficiency.  
     → **Evasive answer:** Rejecting "causal drainage" as a category error without resolving closure.  

  9. **The Phenomenal Case & Russellian Monism:**  
     *"In consciousness studies, robust emergence faces pressure toward either panpsychism (consciousness in micro-physics) or Russellian monism (physics describes structure; consciousness is intrinsic nature). Given your rejection of panpsychism, does your view imply physical properties have ‘hidden’ intrinsic natures that ground emergence—effectively endorsing Russellian monism?"*  
     → **Pressure:** Forces alignment with Russellian monism if rejecting panpsychism/eliminativism.  
     → **Evasive answer:** Insisting consciousness is "uniquely emergent" without addressing the metaphysical basis.  

  10. **The Anti-Vitalism Commitment:**  
      *"You reject vitalism, emphasising everything is physical. But if emergent properties are metaphysically novel and causally potent, how does this differ from vitalism’s ‘life force’, except by relabelling?"*  
      → **Pressure:** Charges of neo-vitalism despite physicalist commitments.  
      → **Evasive answer:** Distinguishing "structural" vs. "substantive" novelty without clarity.  

  11. **The Exclusion Argument’s Bite:**  
      *"Suppose Jaegwon Kim’s causal exclusion argument *is* sound: every physical effect has only physical causes, so emergent properties are either identical to physical properties or causally inert. Which core commitment of your view would you surrender first: the causal potency or the metaphysical novelty of emergence?"*  
      → **Pressure:** Forces prioritisation if exclusion undermines emergence.  
      → **Evasive answer:** Reasserting that exclusion "begs the question" against emergence.  

  12. **Sacrificial Commitment (Closer):**  
      *"If the exclusion argument proved sound, and you *had* to abandon one tenet—downward causation, irreducibility, or non-identity with the physical base—which would you relinquish, and how would the resulting view differ from reductive physicalism or epiphenomenalism?"*  
      → **Pressure:** Forces admission of theoretical vulnerability.  
      → **Evasive answer:** Refusing to concede any tenet could be surrendered.  

  ---

  **Key Design Notes:**  
  - **Escalation Path:** Opens with conceptual ground-clearing (Q1-2), escalates to core metaphysical tensions (Q3-8), peaks with consciousness-specific implications (Q9-10), closes with forced trade-offs (Q11-12).  
  - **Follow-up Strategy:** Targets predictable rebuttals (e.g., "different levels", "explanatory autonomy") by demanding *causal-mechanical* specifics the stock reply evades.  
  - **Technical Glossary (for listener clarity):**  
    - *Causal closure/completeness of physics:* Every physical event has a sufficient physical cause.  
    - *Weak emergence (Bedau):* Macro-properties unpredictable in practice but derivable in principle from micro-physics.  
    - *Causal exclusion argument:* If physics is causally closed, non-physical properties can’t cause physical effects without overdetermination.  
    - *Russellian monism:* Physics describes structural relations; consciousness is the intrinsic nature of physical properties.  
  - **British English:** "Metres," "categorise," "practise" (verb), "labour," "plausible defence".  

  This sequence maximises pressure while respecting the format’s constraints. Her polished replies will be evident if she restates her model without addressing the specific lacuna highlighted (e.g., answering Q3 with "emergence operates at a different level" without resolving overdetermination). Use the follow-ups to prevent absorption and demand engagement.
