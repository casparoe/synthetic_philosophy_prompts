prompt: |-
  I've spent the better part of a year working through the neo-Roman revival in the theory of liberty — Berlin's two concepts, MacCallum's rejoinder that there is only one triadic concept of freedom whose rivals merely disagree about how to fill in the variables, and then the republican response that what Berlin's negative concept misses is not a further quantity of freedom but a different relation to power. I've ended up with a version of republicanism that I don't see defended in quite this shape, which leaves me unsure whether I've landed on something or simply talked myself into a muddle, and my supervisor has asked me to write a chapter that states the view and then attacks it as hard as I can manage. The view is this. Domination is not a matter of how much another agent is able to interfere with you, nor of whether they do interfere, but of whether your position rests on arrangements you can point to and invoke rather than on the continuing disposition of someone else. Call it the invocable-standing view. Its three signature commitments are: (i) a slave with a genuinely kind and predictably indulgent master is unfree, not because the master is likely to interfere, but because whatever security she enjoys is something she cannot claim — she cannot prove it to a third party, contest its withdrawal in advance, or cite any standing arrangement that obliges the master to be as he is; (ii) law that constrains you does not thereby dominate, provided the constraints are publicly ascertainable and their content is answerable to the interests of those constrained, whereas the identical rule applied at an official's unstructured discretion does dominate; and (iii) the policy upshot is that the aim is not to minimise interference but to replace discretionary beneficence with invocable standing, which is why I think means-tested benefits delivered at caseworker discretion, at-will employment, and ad hoc emergency powers are dominating even when they are, in fact, generously and rarely exercised. I hold that this is not merely negative liberty with a reliability premium bolted on, because what does the work is the source and answerability of power rather than its extent.

  So: what would count against it? I want a map of its exposure, not a defence of it. Work through the arguments, intuitions, cases, and conceptual results that would tell against the view, and separate the ones that would be genuinely decisive from the ones that would be merely awkward or merely verbal. In particular I want you to take seriously the collapse worry in both directions — that invocable standing is either a covert way of talking about the probability-weighted extent of non-interference, in which case Berlin plus an expected-value calculation already has everything I claim to have added, or else that it is a purely procedural and legalist notion, in which case my view is committed to saying that freedom exists only where law has constituted it. What would have to be true for either collapse argument to go through, and what would defeat it? Relatedly: if the stateless person, the informal-sector worker, and the member of a close-knit community governed by nothing but custom and mutual knowledge are all maximally unfree on my account, is that a cost I must swallow, and does the anarchist objection — that every expansion of law expands freedom on this view, which sounds less like a theory of liberty than a theory of jurisdiction — bite? And what about the worry of expansiveness: if discretionary beneficence is dominating, then parents, teachers, physicians, employers, and spouses dominate by default, and if domination is ubiquitous it cannot be a guide to anything.

  I'd also like an honest audit of whether the view risks anything at all or has been insulated by its own vocabulary. "Arbitrariness" defined as failure to be forced to track the interests of those affected, and "tracking" cashed out in terms of whatever survives contestation, looks suspiciously like a pair of definitions built to absorb every counterexample — and if that is right, I want to know whether it matters, since plenty of respectable normative concepts are elaborated rather than tested. Which empirical findings would discriminate my view from a negative-liberty rival, and what would it mean if they came out the other way: given that I claim the slave's unfreedom is objective rather than experienced, would survey evidence that people in arbitrary-but-benign conditions report feeling free be decisive against me, irrelevant to me, or a sign that I have made my view untestable by construction? Finally, everything rests on the intuition about the contented slave, so tell me what happens if that intuition is pressed — for instance, a master permanently incapacitated, or bound by an irrevocable, self-enforcing arrangement that he could not breach even if he wanted to. Is that slave still dominated on my account, and is either answer defensible? For each item, say what a committed defender of the invocable-standing view would concede as counting against them and what they would dismiss, rank the defeaters from fatal to merely irritating, and note where my view makes predictions about actual institutions — basic income versus means testing, private arbitration clauses, family law, emergency powers — that a negative-liberty or a positive-liberty account does not make, and which of those predictions is most exposed. Please argue rather than catalogue, and reach a verdict on whether this is a view worth defending. I don't want a bibliography or a list of further reading; refer to individual thinkers only where a position is really inseparable from them, and if you're not confident of an attribution, describe the position without naming anyone.
reasoning: |-
  Okay, this is a deep and intricate query about political theory, specifically the user's own formulation of republican freedom as "invocable standing." The user has clearly spent extensive time wrestling with Berlin, MacCallum, and neo-republican thinkers, and has arrived at a nuanced position they're now stress-testing. Their supervisor's assignment to attack their own view suggests they're at an advanced stage of doctoral work.

  First, I need to grasp the core of their view: freedom isn't about non-interference but about having invocable arrangements rather than relying on others' dispositions. Their three signature commitments (the contented slave, law vs discretion, policy implications) are well-articulated. They're explicitly asking for counterarguments, not defenses, with particular focus on collapse objections (into negative liberty or legalism), anarchist objections, and conceptual insulation concerns.

  The collapse worries strike me as the most philosophically urgent. For the "negative liberty collapse" objection to hold, one would need to demonstrate that invocable standing is just a proxy for reliable non-interference. But the user insists the source of power matters more than its extent - this seems crucial. If a defender could show scenarios where invocble standing exists without reliable non-interference (e.g., stringent but contestable laws) or vice versa (e.g., reliable but unchallengeable benevolence), that might block the collapse. The "legalism collapse" is trickier - if freedom requires constituted procedures, doesn't that exclude pre-legal communities? Here the user might need to bite the bullet or refine "invocable" to include non-state practices.

  The anarchist objection feels potent too. If every new law creates new freedoms by creating new claimable standing, that does sound jurisdictional rather than liberatory. The user's examples of stateless persons and informal workers being "maximally unfree" seems counterintuitive - many would see them as free from state domination. A defender might counter that informal norms can provide invocable standing too, but then we'd need criteria for when customs count as "standing."

  On conceptual insulation: their definitions of arbitrariness and tracking do risk circularity. If "tracking interests" just means "whatever survives contestation," and contestation requires the very standing they define, that's suspiciously self-reinforcing. Empirical testability is key here - if their view predicts different judgments than negative liberty about cases like at-will employment or means-tested benefits, that could ground it. But if people in benevolent dictatorships report feeling free, does that falsify their claim that freedom is objective? Probably not, but it might reveal the theory's counterintuitive edge.

  The parental domination worry highlights a tension: if all discretionary power is dominating, does that make domination inevitable? The user might respond that some relationships (like parenting) involve legitimate authority, but then they'd need a theory of when discretion isn't arbitrary. Their hospital triage example shows they're aware of this - but does "answerability" resolve it fully?

  Finally, the contented slave intuition is the bedrock. The permanently incapacitated master case exposes something important: if the master physically can't interfere, is domination gone? The user's theory says no, because the slave still lacks standing to invoke. That seems consistent but radical - it means freedom depends on normative structures regardless of empirical risk. Is that defensible? Perhaps if we see freedom as a status rather than a fact.

  Institutionally, their view has sharp implications: opposing at-will employment, supporting basic income over discretionary welfare, constraining emergency powers. These are testable differences from negative liberty. The most exposed prediction might be that people under discretionary systems (like gig workers) should experience domination even when well-treated, while those under rigid but contestable rules shouldn't - survey data could challenge this.

  Overall, this is absolutely worth defending - it's original, coherent, and politically salient. Its main vulnerability is overextension (calling all discretion dominating), but that's also its critical power. The collapse objections are serious but not fatal if "answerability" is rigorously distinguished from reliability. I'll structure the response to mirror these concerns.
answer: |-
  Here’s a systematic assault on the invocable-standing view, structured by your concerns. I’ll argue the deepest threats come from **conceptual collapse into legalism** and **normative irrelevance due to ubiquity**, with the **contented slave intuition** as a fragile foundation. Empirical untestability and institutional overreach compound the problems.

  ### 1. The Collapse Arguments: Covert Negative Liberty or Pure Legalism?
     * **Negative Liberty Collapse**:  
       - *How it could work*: If "invocable standing" reliably correlates with *high probability of non-interference* (e.g., laws are stable, discretion is risky), your view reduces to Berlin + risk-aversion. The slave’s lack of "standing" is just a proxy for her vulnerability; the kind master’s predictability *is* her security, and "invocability" adds nothing but a psychological crutch.  
       - *What defeats it?* Only if standing affects freedom *even when interference probability is identical*. Example: Two societies with identical low interference rates—one with clear, contestable rules, one with benevolent dictator’s habits. Your view *must* insist the first is freer. If not, collapse occurs.  
       - *Verdict*: Defeatable but costly. Requires denying that predictability *is* security, making freedom depend on form over function.

     * **Legalism Collapse**:  
       - *How it goes through*: If standing requires *institutional procedures* (courts, codified rules), your view implies **freedom is a legal artifact**. The stateless person isn’t just vulnerable—she’s *constitutively unfree*, as no "arrangements" exist to invoke. This alienates freedom from lived experience (e.g., a tight-knit community with robust customs but no courts).  
       - *What defeats it?* You must expand "invocable" to include non-state practices (e.g., customs enforced by social sanctions). But then:  
           - *Collapse risk*: If "custom" counts, why not the master’s habitual kindness?  
           - *Anarchist objection*: If law expands standing, it expands freedom. But anarchists see law *itself* as domination. Your view can’t explain this without conceding freedom requires submission to authority.  
       - *Verdict*: Partially fatal. Avoiding legalism requires stretching "invocable" until it risks vacuity; embracing it surrenders to Hobbes ("Liberty is the silence of the law").

  ### 2. The Ubiquity Objection: If Everything Dominates, Nothing Does
     - *The problem*: Discretionary power exists in nearly all relationships (parent-child, doctor-patient, teacher-student). Calling this "domination" makes the concept normatively inert—we can’t oppose domination if it’s universal.  
     - *Your defense*: You might distinguish *legitimate authority* (e.g., parents) by its purpose or accountability. But your core criterion ("rests on dispositions of others") applies to a doctor deciding triage or a parent granting privileges.  
     - *Decisive weakness*: If domination is everywhere, it can’t guide policy prioritization. Why target at-will employment over parental authority? Your theory lacks resources to rank dominations.  
     - *Verdict*: **Major cost**. Conceding ubiquitous domination dilutes republican freedom’s critical edge.

  ### 3. The Insulation Problem: Circularity and Untestability
     - *Suspicious definitions*:  
        - "Arbitrariness = failure to track interests" + "Tracking = what survives contestation" creates a loop: Contestation requires standing, standing requires non-arbitrariness.  
        - *Is it fatal?* Not inherently (Rawls’ reflective equilibrium is circular too), but it enables evasion.  
     - *Empirical untestability*:  
        - *Prediction*: People under discretionary power (e.g., welfare caseworkers) should feel unfree *even when treated well*; those under clear rules should feel secure.  
        - *Counter-evidence*: If surveys show subjects of benevolent dictators report feeling free, you dismiss this as "false consciousness." But this makes your theory unfalsifiable.  
        - *Exposed institutional test*: Compare basic income (automatic, invocable) vs. means-tested benefits (discretionary). Your view predicts stark freedom differences **even if outcomes are identical**. If studies find no difference in perceived autonomy, your view is weakened. Negative liberty would be unscathed.  
     - *Verdict*: Risky but not fatal. However, it shifts burden to *why* we should prefer your metaphysics over felt experience.

  ### 4. Pressing the Contented Slave: The Foundation Cracks
     - *Cases that strain your intuition*:  
       - **Permanently incapacitated master**: Slave lacks standing, but interference is impossible. Is she unfree? *Your view says yes*—but this conflates freedom with *dignity* or *status*. Negative liberty says she’s free.  
       - **Irrevocable self-enforcing arrangement** (e.g., unbreakable trust fund for slave): Standing exists without interference risk. *Your view might call this free*, but then security *is* doing the work, not invocability.  
     - *The dilemma*:  
       - If the incapacitated master’s slave is still unfree, freedom becomes detached from practical constraint (closer to Sen’s "capabilities" than republicanism).  
       - If she’s free, invocable standing collapses into reliable non-interference.  
     - *Verdict*: **Potentially fatal**. This intuition is your bedrock; if it crumbles, the edifice falls.

  ---

  ### Overall Verdict: Worth Defending, But With High Stakes
  **Why it’s valuable**: Your view captures something real—the **humiliation of dependence**—that Berlin misses. It generates sharp critiques of discretion-based systems (e.g., gig-economy arbitrariness vs. union contracts) and reframes debates about welfare/employment law. It’s not covert negative liberty; the *source* of security matters.

  **Why it’s vulnerable**:  
  - **Fatal risks**: Legalism collapse (freedom requires the state) and the contented slave dilemma (if standing without possibility of interference still matters, freedom becomes metaphysical status, not practical condition).  
  - **Major costs**: Ubiquity of domination (risks normative irrelevance) and anarchist objections (freedom through law sounds oxymoronic to anti-statists).  
  - **Weaker exposures**: Circular definitions (manageable with care) and empirical underdetermination (testable via institutional comparisons).  

  **Where it bites hardest**: Your predictions are starkest on **discretion vs. rules** (e.g., universal healthcare vs. caseworker-administered Medicaid) and **emergency powers** (e.g., codified pandemic rules vs. executive orders). If real-world outcomes show no freedom differences in these pairs, negative liberty wins. If they do, your view gains force.  

  **Final judgment**: Defend it—but only by confronting the legalism and ubiquity problems head-on. Deny that freedom is *created* by law; argue instead that law *certifies* pre-political claims. Admit domination’s ubiquity but insist **freedom is scalar**: Reducing domination in core spheres (work, state) is paramount. And ground the contented slave not in abstraction, but in the **social recognition** that standing provides. The muddle is productive; it forces clarity on power’s structure.
