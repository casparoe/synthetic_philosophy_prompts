  I need to build this tree carefully. Starting from the root, the first question should be: "Is the target claimed to be an effectively axiomatized formal system?" This splits into formal vs non-formal targets. For formal systems, we then ask about arithmetic content - whether it contains Robinson Arithmetic (Q) or equivalent. If not, incompleteness doesn't apply. If yes, we ask whether the move is about provability or expressibility. 

  For provability, we need to check if consistency is assumed or denied. The conclusion might be modest (system doesn't prove X) or strong (X is true and we see it). For expressibility moves, we examine truth-definability claims. The non-formal branch handles metaphors and vibes-based arguments, including Gödel's actual views about minds.

