  2. The "minds aren't machines" argument needs consistency knowledge we can't claim, landing on "Strong Provability Overreach"
  3. The God argument fails on formalization, landing on "Non-System Target"
  4. The language theory argument is pure vibes - "Vibes-Based 'Incompleteness'"
