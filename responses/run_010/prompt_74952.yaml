answer: |-
  Right, let's cut through the fog. Here’s the argument against the Disjunctive Parity Thesis (DPT), structured as your dilemma demands, with replies and consequences laid bare.

  ### The Dilemma Against DPT
  **Horn 1: The Fine-Grained Trigger (Determinism Creep)**  
  Suppose Black’s disjunctive trigger is exhaustive—it monitors every *conceivable* physical or mental route to rescue (e.g., neural precursors to diving, subvocalisations for shouting, micro-movements for reaching the ring). To achieve this, Black must surveil Jones’s entire motor cortex, perceptual inputs, and deliberative processes in real-time, pre-emptively suppressing *any* rescue-initiating event. But this transforms the case: Jones’s "omission" is now the *only* outcome Black’s omnipresent control allows. Jones isn’t "omitting on his own"; Black’s mechanism is causally responsible for stifling every flicker of rescue possibility before Jones can even form an intention. This collapses into covert determinism—Jones lacks responsibility because Black’s control is constitutive of the causal chain. **Result:** No Frankfurt-style counterexample to PAP, as the case begs the question against incompatibilism.

  **Horn 2: The Coarse Trigger (Escape Routes Persist)**  
  Suppose Black’s disjunction is coarse—say, he monitors only overt *behaviours* (diving, wading, throwing) or a limited set of "likely" neural patterns. But omissions are multiply realisable: Jones could rescue by a subtle eyebrow signal to the other guard, a sudden decision to radio the boat, or even an unplanned reflexive lurch if startled. If any route falls outside Black’s disjunctive net, Jones retains a *genuine, unblocked alternative possibility*: he *can* (in the relevant sense) still rescue the swimmer via that route. PAP isn’t threatened—Jones is responsible *because* he could have done otherwise, even if he didn’t. **Result:** PAP stands for omissions.

  ### Replies from Black (and Why They Fail)
  1. **"Coarse trigger + fast response!"**  
     *Claim:* Black doesn’t need exhaustive monitoring; he can intervene *after* Jones initiates *any* rescue route, blocking it before success.  
     *Rebuttal:* This confuses *preventing success* with *eliminating ability*. If Jones *initiates* a rescue (e.g., begins shouting), he *exercises* an alternative possibility. Black then *interrupts* it—but PAP requires only that Jones *could have chosen otherwise*, not that he would have succeeded. The ability was present until blocked. PAP survives.

  2. **"Block only routes Jones is *disposed* to take!"**  
     *Claim:* Black need only monitor/resist actions Jones is psychologically inclined toward (e.g., based on past behaviour).  
     *Rebuttal:* This abandons the Frankfurt project. PAP concerns *alternative possibilities*, not *dispositions*. If Jones *could* (even counterfactually) choose an unmonitored route (e.g., radio), the alternative exists. Grounding responsibility solely in actual sequences doesn’t *defeat* PAP—it presupposes PAP is irrelevant, which is the very point in dispute.

  3. **"Index disjunction to intention-formation!"**  
     *Claim:* Black monitors/resists the *formation* of any rescue *intention* in Jones’s mind, not outward behaviours.  
     *Rebuttal:* Intention-formation isn’t a discrete, infallibly detectable event. It’s a fuzzy, potentially unconscious process. If Black suppresses *any* neural activity that *could* culminate in rescue, we’re back to Horn 1 (determinism). If he only blocks fully formed intentions, fleeting or fragmentary rescue-directed thoughts might escape, preserving Jones’s ability to form an intention differently. Coarse intention-tracking leaves gaps.

  4. **"Escaping routes aren’t *robust* alternatives!"**  
     *Claim:* Unblocked routes (e.g., an improbable eyebrow signal) are "fluky" and morally irrelevant; responsibility hinges on robust alternatives.  
     *Rebuttal:* This changes the subject. PAP requires *any* alternative possibility (barring trivial flickers), however improbable. Rejecting PAP because alternatives aren’t "robust" *assumes* PAP is false—it doesn’t *argue* against it from within a Frankfurt framework. Frankfurt cases aim to kill PAP outright, not redefine it.

  ### The Conclusion: The Conservative Moral
  **Frankfurt cases were never doing the work people assumed for *either* actions or omissions.** The omission dilemma exposes a flaw in the original action case. In *both* scenarios, Frankfurt-style "counterexamples" work only if Black’s intervention mechanism is either:  
  - **Sufficiently comprehensive** to eliminate alternatives → but then it *causally necessitates* the outcome, making it a deterministic case where responsibility is plausibly undermined.  
  - **Sufficiently targeted** to avoid necessitation → but then *alternative possibilities persist* (e.g., Jones could have shown the prior sign in the action case; the lifeguard could have taken an unmonitored rescue route).  

  The asymmetry is illusory. Omissions simply make the problem more obvious because their multiple realizability amplifies the dilemma. **PAP isn’t dead; it was wrongly buried.** Frankfurt cases don’t defeat PAP—they either assume determinism (and thus can’t show responsibility is compatible with no alternatives) or leave alternatives intact.

  ### Where to Attack the Dilemma
  A Frankfurtian should target **Horn 1**. They must argue that an *exhaustive* disjunctive trigger (e.g., blocking all neural/behavioural rescue routes) *doesn’t* collapse into determinism or undermine responsibility. This requires showing Black can:  
  - Monitor *every* possible rescue path without causally determining Jones’s omission.  
  - Ensure Jones’s omission remains "his own" even when every alternative is preemptively closed by an external mechanism.  
  The burden is to explain how Black’s control isn’t causal overdetermination but mere "counterfactual intervener" while being exhaustive. This seems impossible without smuggling in indeterminism (which would reintroduce alternatives) or compatibilism (which assumes the conclusion).

  ---

  **Verdict:** Frankfurt cases fail to refute PAP for omissions because exhaustive disjunctive triggers imply covert determinism (undermining responsibility) while partial triggers preserve alternatives, and this flaw reveals they never genuinely refuted PAP for actions either.
