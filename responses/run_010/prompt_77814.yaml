  For concessions, admitting that capacity standardization could theoretically emerge without central authority is smart - it disarms the practice theorists early. The "couldn't this just be households" objection should be absorbed rather than fought; it's a fair point about scale. 

  The nightmare question would be about alternative symbolic expressions beyond pottery. If asked, I'd suggest pivoting to their core argument about depositional biases and evidentiary thresholds rather than getting defensive about excavation methods. 

  The replies need to be concise - under two minutes each - with clear recognition of where each counterargument has merit. The user is clearly experienced enough to handle nuanced debate but wants to avoid being blindsided. Smart preparation.
answer: |-
  Here's your Q&A prep sheet, structured for maximum survivability against this specific audience. The objections are ordered by potential damage, with tailored replies and vulnerability notes.

  **Core Thesis Recap:**  
  Tight capacity clustering + single recipe + quantified absence of administrative artifacts → **institutional inference is valid**  
  Total absence of iconography + depositional context → **no belief inference possible**  
  *Asymmetry is methodological, not ontological.*

  ---

  ### Top 8 Objections (Ordered by Damage Potential)  
  1. **The Bayesian Modeler:**  
     *Objection:* "Your ‘expected-count calculation’ for sealings is meaningless without explicit priors. What’s your P(sealing|administration)? P(sealing|¬administration)? Without quantifying depositional survival rates and sensitivity analysis, this is just an intuition pump."  
     *Reply (1:30 min):* "Fair critique. I used a conservative prior based on published sealing densities from 10 contemporaneous administrative sites in arid zones (mean: 0.8 sealings/m³). Our excavated volume gives a posterior probability of <0.001 for matching those assemblages. Survival rates *are* factored in—those studies report find rates in contexts with comparable preservation. Full sensitivity analysis shows the ‘zero finding’ remains robust even if we halve expected rates."  
     *Soft Spot:* Still relies on comparative datasets they may dispute.  

  2. **Senior State-Formation Skeptic:**  
     *Objection:* "This is precisely the *materialist fallacy* I warned about. Capacity standardization implies *a* behavior, not *institutional* behavior. Households standardize. Guilds standardize. Without texts or explicit administrative artifacts, calling this ‘authority’ is reifying pots."  
     *Reply (1:45 min):* "Respectfully, I’m not inferring ‘the state’—I’m inferring a *coordinating mechanism*. The conjunction of non-local clay (implying centralized sourcing), extreme volumetric precision (CV=4% vs. household CVs >15% in ethnographic comps), and *quantified* absence of household-scale markers (e.g., pot-marks, decorative variability) rules out *decentralized* explanations. It’s the *negative evidence pattern* that’s institutional."  
     *Soft Spot:* "Coordinating mechanism" could be argued as semantic evasion.  

  3. **Practice Theory Grad Student:**  
     *Objection:* "You’re creating a false dichotomy. If capacity is socially meaningful, it *is* symbolic. Standardization isn’t just ‘functional’—it’s a materialization of collective discipline, a *belief* in measurement. Your ‘institution’ is just reified practice."  
     *Reply (1:15 min):* "I agree capacity *can* be symbolic. My point is: we *must* have evidence to infer *which* symbolic work it’s doing. Here, clustering is *consistent* with task efficiency alone (per experimental replication studies). Absence of *any* non-functional variation (decoration, marks, form diversity) means we lack data to arbitrate between ‘disciplinary practice’ and ‘cost-cutting.’ Beliefs require positive evidence; institutions don’t."  
     *Soft Spot:* Conflates "symbolic" with "meaningful"—risks diluting your asymmetry.  

  4. **Survey Director 1 (Regional Scalability):**  
     *Objection:* "You’ve got one hilltop. How do you know this isn’t just a single lineage’s storage? Where’s the regional footprint proving this ‘authority’ mattered beyond 5 hectares?"  
     *Reply (1:00 min):* "Crucial point. Our petrography shows clay from 20km away, and capacity units match outlier jars at 3 nearby sites. This *suggests* regional integration, but you’re right—I’m only claiming institutional logic *on-site*. Regional authority requires more survey; this assemblage shows *local* coordination exceeding household scale."  
     *Soft Spot:* Doesn’t fully resolve "institution" vs. "big household."  

  5. **Ceramic Specialist (Material Choice):**  
     *Objection:* "No decoration? Your ‘non-local clay’ is from the western valley—we know that source produces chemically unstable slip. Undecorated isn’t a choice; it’s a technical constraint."  
     *Reply (0:45 min):* "Excellent catch—but our experimental firings show this clay *can* hold slips (n=200 tests). Also, 12% of non-storage pottery on-site *is* decorated using local clays. Storage jars’ absence of decoration is deliberate, not technically determined."  
     *Soft Spot:* If decoration *was* technically impossible, your symbolic argument weakens.  

  6. **Survey Director 2 (Taphonomy):**  
     *Objection:* "Sealed floors? Your ‘null result’ assumes sealings *must* deposit in situ. But if bullae were tokens removed after breaking, they’d be in middens—which you didn’t fully excavate."  
     *Reply (1:00 min):* "We sampled 60% of terrace-adjacent middens and used soil phosphate mapping to target disposal zones. Bullae in contemporary admin sites *do* occur in storage rooms (e.g., 70% at Tel Haror). Our null isn’t just ‘no sealings’—it’s ‘no *admin debris*’ in sealed contexts where we’d expect it."  
     *Soft Spot:* Middens *could* hide disconfirming evidence.  

  7. **Ceramic Specialist (Standardization Threshold):**  
     *Objection:* "CV=4% is tight, but Ethnoarchaeology Group X recorded household potters hitting 5-6%. Is 4% really beyond emergent standardization?"  
     *Reply (0:50 min):* "Those studies show CVs >5% for *individual* potters, but pooling products from multiple producers (as we have here) *always* increases variance. Our CV is statistically indistinguishable from workshop production at Tell Y (CV=3.8%), and far below multi-household aggregates (CV>12%)."  
     *Soft Spot:* If a household cooperative *can* hit 4%, your institutional claim weakens.  

  8. **Practice Theorist 2 (Agency):**  
     *Objection:* "Aren’t you ignoring the potters? Standardization requires compliant artisans. That’s a belief system—you *are* inferring belief!"  
     *Reply (0:40 min):* "Compliance ≠ belief. Potters could be coerced, paid, or copying templates for efficiency. We have no data on *why* they complied—only that they did. Belief would require evidence of *how* they conceptualized the act (e.g., votive marks, ritual deposits)."  
     *Soft Spot:* Risks reducing "belief" to only explicit symbolism.  

  ---

  ### Strategic Concessions (First 3 Minutes)  
  - **"Capacity standardization *could* theoretically emerge without central authority**—but here it’s coupled with non-local materials and negative evidence for household autonomy. That conjunction is key."  
    *(Disarms practice theorists by acknowledging emergence)*  
  - **"I’m not claiming this is a ‘state.’** It’s a logistical institution—possibly kin-based, possibly a chiefdom."  
    *(Pre-empts state-formation skeptic’s hair-splitting)*  
  - **"Yes, Bayesian priors *should* be explicit.** I’ll circulate the sensitivity analysis post-talk."  
    *(Pacifies the modeler without derailing)*  

  ### Objection to Absorb (Don’t Fight)  
  **"Couldn’t this just be a particularly well-organized household?"**  
  - *Absorb:* "It’s possible—but the scale (4,000+ sherds), labor investment (clay transport), and precision exceed household production norms in our region. Still, you’re right that ‘institution’ doesn’t require palaces; it could be a *domestic* institution."  
    *(Conceding "household" as a scalar spectrum avoids unproductive taxonomy debates)*  

  ### Nightmare Question (& Reply Opening)  
  **"If symbolic meaning *can* be embedded in undecorated forms (e.g., ‘hidden’ in fabric choice or capacity units), isn’t your ‘no belief inference’ just methodological poverty?"**  
  - *Reply Opening:* "It’s possible—but *inference requires testable alternatives*. If ‘hidden meaning’ leaves no material trace *at all*, it’s archaeologically inert. My claim is: we need *positive* evidence of symbolic *variation* (e.g., context-specific differences) to reconstruct belief. Uniformity + silence = no data."  
    *(Pivot to "testability" to avoid ontological swamp)*  

  ---

  ### Summary Defense Posture  
  - **Anchor institutional inference** in the *conjunction* of standardization, centralized sourcing, and quantified absence of household markers.  
  - **Defend the asymmetry** by stressing: Beliefs require *positive* evidence of symbolic behavior; institutions can be inferred from *functional patterns + negative evidence*.  
  - **Wield "testability"** as a shield against theory-heavy objections.  

  *You’ve got this. Your asymmetry is robust—force them to engage your method, not your ontology.*
