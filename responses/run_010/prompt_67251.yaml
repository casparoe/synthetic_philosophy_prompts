  **Speech: Change of Command Farewell Remarks**

  [Opening]
  Good afternoon. It’s an honor to stand before you today – to the officers and sailors of the outgoing and incoming crews, to the families who have stood by us, and to our guests from the academic community. Thank you for being here.

  For twenty-two years, I’ve had the privilege of serving in strategic forces, most of that time beneath the waves. And in all those years, I’ve never once lost sight of the weight of our mission. We are the unseen force that keeps the peace. Not by action, but by readiness. Not by the spark, but by the certainty of the flame.

  [The gravity and the paradox]
  Deterrence is a concept built on contradictions. It requires the highest level of preparation for an event that must never occur. It asks for unwavering resolve in the service of preventing the very thing we train for. And at its heart lies a paradox: the effectiveness of our posture depends on the credibility of our capability, while the horror of that capability’s use must remain beyond imagination.

  This paradox isn’t an accident; it’s by design. Our procedures, our checklists, our two-person rules – they are the architecture that makes the unthinkable orderly, and the unbearable manageable. They are the embodiment of our nation’s intent, delegated downward so that no single individual bears the burden alone. And that is precisely why they work: because they are bigger than any one of us.

  [The human element]
  But let me be clear: a system is only as strong as the people who uphold it. The manuals don’t turn their own pages. The protocols don’t enforce themselves. It takes individuals – individuals with discipline, with integrity, with a profound understanding of the stakes – to stand watch, to run the drills, to maintain the edge that keeps our deterrent sharp.

  You, the crews I’ve served with, have been those individuals. You have shown, day in and day out, that you are capable of the highest standard of professionalism. You have carried the weight of the mission without flinching. And for that, I am deeply grateful.

  [Families]
  And to the families: you have borne a different kind of weight. The long deployments, the silences, the absences at birthdays and anniversaries. You have built lives in the shadow of a mission you’ve never seen, trusting in its necessity. Your strength has been our foundation. You have kept the home fires burning so we could stand the watch.

  [Academics and the broader view]
  To our academic guests: you study the theory that we live. You know that deterrence is a balance of resolve and restraint, of capability and communication. And you understand that the system we maintain is not just about weapons – it’s about stability, about preventing conflict through strength and predictability.

  [The resolution of the paradox in practice]
  So how do we reconcile the paradox? We do it by building a machine so precise, so reliable, that its very existence removes the doubt. We do it by removing the burden of choice from the individual and embedding it in the process. But we also do it by selecting and training individuals who are capable of executing that process without hesitation – not because they desire the outcome, but because they understand that their steadfastness is what makes the outcome unnecessary.

  In the end, the deterrent doesn’t rest on what’s in our hearts at the moment of crisis. It rests on the certainty we’ve built over decades – the certainty that the system will function as designed, carried out by professionals who will do their duty.

  [Handover and closing]
  To the incoming crew: you inherit this legacy. You take the watch. I have every confidence in your ability to uphold it.

  To my fellow sailors: it has been the honor of my life to serve alongside you.

  To the families: thank you for your sacrifice. You have been our constant.

  And to all: may we continue to stand the watch so that the day of testing never comes.

  Thank you.

