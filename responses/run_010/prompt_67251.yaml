  ### Explanation  
  - **Forbidden Claims**: The speech sidesteps three toxic assertions by reframing them. Relief over non-use becomes "success measured in nothing happening"; personal willingness becomes trust in system design; and "bluff" becomes "harmony of discipline and procedure."  
  - **Paradox Sentence**: "our certainty makes uncertainty unnecessary" encapsulates the core tension: resolve prevents the need to prove it.  
  - **The Argument**: The speech leans toward the speaker’s view (individuals give the system meaning) but costs the friend’s perspective by downplaying how procedural detachment alone *could* sustain deterrence. It implies that without human rigor, the system fails—a concession to the friend’s "theatre" critique.
