answer: |-
  Here’s a complete simulation kit designed for your constraints. Print materials follow the timeline.

  ---

  ### **1. Fictional Setting: The Republic of Veridia**
  **Background**: A 30-year military dictatorship collapsed after a negotiated transition. The **Veridia Truth and Reconciliation Commission (VTRC)** offers amnesty for human rights violations *only* if:  
  - The act had a **political objective** (not personal gain).  
  - It was **proportionate** to that objective.  
  - The applicant **fully discloses all relevant facts**.  

  **Roles**:  
  - **4 Applicants** (of 6 pre-written dossiers; 2 unused as backups).  
  - **4 Commissioners** (odd number avoids ties).  
  - **4 Family Representatives** (1 per victim).  
  - **1 Prosecutor** (tracks capacity).  
  - **1 Registrar** (manages time/documents; non-playing role for a student).  

  ---

  ### **2. Materials (Ready to Print)**  
  ***(A) Commissioners’ Criteria Card (1 page)***  
  > "GRANT AMNESTY ONLY IF:  
  > 1. The act served a verifiable political goal (e.g., suppressing ‘enemies of the state’).  
  > 2. The harm caused was not excessive for that goal (e.g., torture may be proportionate to extract intelligence; massacre is not).  
  > 3. The applicant discloses **ALL** facts: who, what, where, when, collaborators, victims.  
  >   
  > **WARNING**:  
  > - You must decide each case on its merits. No promises for future candor.  
  > - Amnesty = immunity from prosecution. Denial = case goes to the Prosecutor."  

  ***(B) Applicant Dossiers (4 used; 6 prepped for flexibility)***  
  **Each contains**:  
  - **Your Crime** (e.g., "Ordered the disappearance of Student Activist A").  
  - **Your Secrets** (e.g., "Victim was buried at [Location X]; Only Collaborator B witnessed it").  
  - **Overlap/Conflict** (e.g., Dossier 2 knows Collaborator B was at the scene; Dossier 3 knows Victim was shot, not tortured as claimed).  
  - **One External Name** (e.g., "General Z approved this operation").  
  - **Your Dilemma**: Disclose fully and risk denial/prosecution, or lie/hide details to appear "proportionate."  

  ***(C) Family Scoring Sheet (1 page)***  
  > "For YOUR victim, you gain:  
  > - **10 pts** if the perpetrator is convicted.  
  > - **8 pts** if remains are located (requires full disclosure from perpetrator).  
  > - **0 pts** if amnesty is granted OR no truth emerges.  
  >   
  > *Note: You may lobby the Prosecutor to pursue/abandon cases.*"  

  ***(D) Prosecutor’s Track***  
  > - Start: **10 "Capacity Tokens"** (paper chips).  
  > - Each amnesty granted: **Remove 2 tokens** (loss of leverage).  
  > - Each amnesty denied: **Remove 1 token** (cost of investigation).  
  > - If tokens run out, **no new prosecutions** can be filed.  

  ***(E) Whiteboard Setup***  
  ```  
  PROSECUTOR CAPACITY: [10]  
  PENDING CASES: [List applicant numbers]  
  OUTCOMES:  
  Applicant 1: Amnesty? □   Truth? □  
  ...  
  ```  

  ---

  ### **3. Minute-by-Minute Timeline (100 mins)**  
  - **0–10 min**: Distribute roles/rules. Families review scoring; Commissioners study criteria; Applicants review dossiers.  
  - **10–15 min**: Registrar assigns hearing order randomly (e.g., App 3 → App 1 → App 4 → App 2).  
  - **15–35 min**: **HEARING 1**  
    - Applicant testifies (5 min).  
    - Commissioners question (5 min).  
    - Commissioners deliberate openly (3 min). Announce decision.  
    - Prosecutor adjusts tokens; Families note outcomes.  
  - **35–55 min**: **HEARING 2** (Same structure).  
  - **55–75 min**: **HEARING 3** (Same).  
  - **75–85 min**: **Unused Confession Phase**: Any applicant not heard can confess *now* for amnesty (pressure to act before capacity depletes).  
  - **85–95 min**: **Prosecutor’s Move**: Decide whom to charge (if any capacity remains). Families lobby Prosecutor.  
  - **95–100 min**: **Scoring**: Families calculate points; Registrar records truth outcomes.  

  ---

  ### **4. Payoff Scheme & Truth Mechanics**  
  - **Family Dilemma**: If an applicant discloses a burial site, Families choose:  
    - **Lobby Prosecutor to drop charges** → Get 8 pts (remains) but lose conviction chance.  
    - **Demand prosecution** → Risk 0 pts (if amnesty granted or no disclosure).  
  - **Truth Depends on Order**:  
    - Early applicants lie if they fear denial (e.g., hide disproportionate violence).  
    - Late applicants see fewer tokens → less fear → more lies.  
    - Truth requires cross-dossier verification (e.g., App 1’s alibi disproven by App 3’s testimony).  

  ---

  ### **5. Key Mechanics Hidden During Play**  
  - No mention of "dwindling threats," "complementary truth," or "commitment problem." These emerge in debrief.  

  ---

  ### **6. Debrief Structure**  
  Link gameplay to theory:  
  - **"At Hearing 2, why did the Prosecutor lose tokens for an amnesty grant?"** → Amnesty consumes prosecutorial leverage.  
  - **"Why did App 4 lie even after promising truth?"** → No commitment to reward future candor; dwindling threats.  
  - **"Why couldn’t we verify App 2’s story?"** → Truth fragmented across un-cooperative applicants.  
  - **"Family 3’s choice: burial site vs. conviction?"** → Truth vs. retribution trade-off.  

  ---

  ### **7. Predictable Failures & Fixes**  
  1. **Commissioners rubber-stamp/block all**:  
     - *Fix*: Add a 2-point "integrity bonus" to Commissioners if their decisions align with later-revealed truths.  
  2. **Dossier details leaked**:  
     - *Fix*: Print dossiers on colored paper; require secrecy ("If you share intel, you lose amnesty eligibility").  
  3. **Dominant student monopolizes**:  
     - *Fix*: Assign speaking order; Registrar enforces time limits.  
  4. **Families ignore truth for convictions**:  
     - *Fix*: Weight burial site points higher (8 vs 10 for conviction) to make choices agonizing.  

  ---

  ### **8. Unsimulatable Realities**  
  - **Moral reductionism**: Families "scoring" victims is a necessary abstraction—stress that real victims’ pain transcends points.  
  - **Emotional weight**: Applicants’ guilt/fear can’t be replicated; remind students that real actors face trauma.  
  - **Long-term reconciliation**: The game can’t show societal healing; note that truth commissions aim beyond courtroom wins.  

  ---

  ### **9. Critical Parameter: Overlap & Verifiability**  
  - **Most decisive factor**: **Degree of dossier overlap** (shared facts needed to verify disclosures).  
  - **For 14 students**: Set **25–30% overlap** (e.g., 2 of 6 facts per dossier corroborated by another). Low overlap = harder verification; high overlap = too easy. Avoid >50%.  

  ---

  ### **10. Minimal Change for the Affirmative Case**  
  - **Add a "Buried Truth" rule**:  
    > *"One random dossier contains the location of a mass grave (known only to that applicant). If amnesty is denied OR the applicant lies, this truth is lost forever."*  
    - **Effect**: Forces recognition that some truths *only* emerge via amnesty—even if the mechanism is flawed.  

  ---

  **Materials Ready for Print**: [Attach PDF here if possible, or copy text above].  
  **Run Time**: 95 mins gameplay + 5 mins buffer.  
  **First Run Tip**: Assign forceful students as Registrar/Prosecutor to maintain pace.  

  This forces engagement with the trilemma: **Threat depletion × No commitment × Fragmented truth**. They’ll feel the design’s fragility—then unpack it philosophically.
