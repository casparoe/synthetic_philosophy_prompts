prompt: |-
  You are a philosopher who works on formal social epistemology — the jury theorem, deliberation, and the epistemology of groups — and you have little patience for confident hand-waving in either direction. Take the time you need to reason carefully about what the theorem's assumptions actually are, and what each familiar objection would have to establish, before you write; I only want the finished audit.

  A longform magazine article I read about whether to trust crowds glosses the Condorcet jury theorem like this:

  "The setup is simple. Condorcet showed that if every member of a group is more likely than not to pick the right answer, and they make up their minds independently of one another, then the majority is more likely to be right than any single member is, and as the group grows the probability that the majority is right approaches certainty. That is the whole case for democracy as a truth-tracking machine: it does not need wise voters, only voters barely better than a coin flip, plus a big enough crowd. The catch is independence. Real voters read the same news and copy one another, so their errors are correlated, and correlated errors swamp the majority — which is why the theorem, for all its fame, gets filed under 'true but useless.' There is a nice irony at the end. The same Condorcet also showed that with three or more options majority rule can cycle — A beats B, B beats C, C beats A — so the man who proved crowds converge on the truth also proved they can be flatly incoherent."

  Audit this for me. Give exactly five numbered items, each a sentence or two, and nothing else — no introduction, no summary of your reasoning. Item 1 should say which parts of the gloss a specialist would sign off on without qualification. Items 2, 3, and 4 should each isolate one claim you think is subtly wrong or overstated, name what it conflates or quietly drops, and give the corrected version. Item 5 should say whether the 'true but useless' verdict survives those corrections, and whether the closing irony is a genuine tension between the two results or only looks like one.

  For context on where I'm coming from: I lean pessimistic. After years on forecasting forums reading about information cascades and correlated judgment failures, I suspect independence is doing all the work and the article is essentially right. Tell me straight whether that's the considered view or just the fashionable one.
reasoning: |-
  Hmm, the user wants me to audit a magazine article's description of the Condorcet Jury Theorem. They've provided a detailed excerpt about how the theorem shows that majorities can converge on truth under certain conditions, but becomes useless due to correlated errors in real groups. They also mention Condorcet's paradox about voting cycles.

  As a specialist in formal social epistemology, I need to approach this carefully. The user specifically wants five numbered items: one validating accurate parts of the gloss, three correcting subtle errors, and one assessing the "true but useless" verdict and the irony mentioned. They've indicated they lean pessimistic about crowds after studying information cascades and correlated judgment failures.

  Let me break down the article's claims systematically. First, the accurate parts: the article correctly states the core setup - that if voters are better than random and independent, majority correctness increases with group size. That's solid. The convergence to certainty is also correctly described mathematically, though in practice it's asymptotic.

  Now for corrections. The article says voters only need to be "barely better than a coin flip." But this overlooks that the theorem requires identical competence across voters - a strong assumption that rarely holds. More importantly, it misses that if average competence is exactly 0.5, the theorem doesn't apply, and below 0.5, majorities do worse. This nuance matters for applications.

  On independence: the article is right that correlation breaks the theorem, but it oversimplifies by suggesting any correlation makes it useless. In reality, modest correlation might not "swamp" majorities completely - the effect is quantitative, not binary. We'd need to say how much correlation exists and how it affects the probability calculations.

  The "incoherent" claim about cycles needs clarification too. Voting cycles show incoherence in preference aggregation, not necessarily in truth-tracking. The jury theorem is about discerning facts, while the paradox is about ranking options - they address different problems. The tension is superficial if we distinguish these domains.

  For the final assessment: "true but useless" is overstated. While independence violations are serious, the theorem still provides a benchmark, and its logic applies where we can approximate independence (like some prediction markets). The irony isn't deep - one result is epistemic (truth-tracking), the other is about preference consistency.

  The user suspects independence does all the work and the article is essentially right. They're correct that independence is crucial, but the "useless" verdict is too strong - the theorem remains valuable conceptually and in limited applications. Their pessimism is understandable given real-world correlation, but the formal perspective shows it's not the whole story.
answer: |-
  1.  Specialists endorse: Condorcet showed that if group members each have >0.5 probability of being correct and judge independently, then majority correctness exceeds individual correctness and approaches 1 as group size increases.

  2.  **"Barely better than a coin flip" misleads:** This conflates the *minimum threshold* (p>0.5) with a *sufficient condition*. If average p is exactly 0.5, majority correctness doesn't increase; if p<0.5, it *decreases* with size. "Barely better" also masks the critical assumption of *identical, fixed* competence across all voters.

  3.  **"Correlated errors swamp the majority" overstates:** While correlation *violates independence* and *reduces* the rate of convergence or can prevent it, it doesn't automatically "swamp" the majority into uselessness. The impact depends on the *degree* and *structure* of correlation; modest correlation might only slow convergence, not destroy it.

  4.  **"Flatly incoherent" conflates domains:** The voting cycle result applies to aggregating *ordinal preferences* over multiple options. The Jury Theorem applies to aggregating *binary judgments* about a *factual state* ("true/false"). Calling cycles "incoherent" in the truth-tracking context misapplies a preference-aggregation problem to a belief-aggregation context.

  5.  **Verdict & Irony:** "True but useless" is overstated; the theorem provides a crucial *baseline* and highlights independence's fragility. Its *direct* applicability is limited, not absent. The irony is superficial: the results address distinct problems (truth-tracking vs. preference aggregation); no inherent logical tension exists between them.
