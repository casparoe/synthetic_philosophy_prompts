  For part (c), I think Dr. Vos would choose Rule B (function in original context) and file under S. Verdict 3 is more fundamental than verdict 7 in her system. The broadside was designed to function as text, making reader function primary in this context.

  Part (d) suggests a test case: creating modern text with ambiguous characters to see if Dr. Vos prioritizes current reader experience or original intent. Rules A/B would call it 's' while Rule C would call it 'f'.

  For part (e), I recommend filing under S for consistency with the collection's existing approach to historical forms. This aligns with verdicts 1-3,6,8-9 and establishes that historical function trumps modern misreading. Filing under F would undermine their entire approach to archaic forms.

  The user needs practical guidance rooted in Dr. Vos's existing framework, not theoretical debates. By choosing S, they maintain consistency with how they've treated other historical characters while acknowledging modern misreadings in catalogue notes.
answer: |-
  Based on Dr. Vos's rulings and framework, here is the analysis and guidance for your case:

  **(a) Candidate Rules Surviving the Nine Verdicts**

  Her verdicts eliminate several single-factor approaches:
  *   **Appearance alone is killed:** Verdict 4 (frost texture) shows something that *looks* like an 'a' isn't one. Verdict 3 (long s) and 7 (mirrored b) show identical appearances can be different letters (long s vs. f, mirrored b vs. d) or non-letters (mirrored a).
  *   **Contemporary reader perception alone is killed:** Verdict 3 explicitly rejects modern readers misreading the long s as an 'f' as defining the letter. Verdict 4 rejects pareidolia defining a letter.
  *   **Designer intent alone is killed:** Verdict 5 rejects the designer's account and intent as sufficient to make the logotype an 'a'.
  *   **Pure historical descent alone is insufficiently nuanced:** While important (Verdicts 2, 3, 9), Verdict 7 (mirrored b) prioritizes current reader function over origin (it was *set* as a b, but functions as a d).

  Surviving rules fitting all nine verdicts (minor stretches noted):
  1.  **Rule A (Origin/Intent):** *The letter is defined by what its maker intended it to be when creating it for communicative use.*
      *   Fits: 1 (designed as 'a'), 2 (cut as 'a'), 3 (cast/set as 's'), 6 (stencilled as 'a'), 7 (*Stretch:* The compositor *intended* to set a 'b', but the rule focuses on the *created mark's* intended identity, which Dr. Vos interprets as a 'd' based on function. This is the rule's weakest fit, relying on her functional override in this specific case), 8 (child intended 'a'), 9 (cut as 'a'), 4&5 (not intended as communicative letters).
  2.  **Rule B (Functional Origin):** *The letter is defined by the role it was designed to play within its original communicative system and context.*
      *   Fits: 1 (function: represent /a/ sound), 2 (function: represent /a/ in Textualis), 3 (function: represent /s/ in 18th-c. orthography), 6 (function: stencil for 'a'), 7 (function: *Stretch:* In the *original composed text*, the mark functions as a 'd' for the reader, overriding the compositor's error), 8 (function: child's attempt at 'a' within writing system), 9 (function: inscription of 'a'), 4&5 (no communicative system/context).
  3.  **Rule C (Contextual Reader Function):** *The letter is defined by the role it actually plays for a competent reader within the specific text it appears in at the time of reading.* ("Seeing" vs. "Reading" determines competence/context)
      *   Fits: 1 (competent reader sees/reads 'a'), 2 (competent reader of Textualis reads 'a'; others "see" a shape), 3 (*Stretch:* Dr. Vos asserts the *original* competent 18th-c. reader reads 's'. The rule focuses on the *current* reading act, which she overrides), 4 (no competent reader in a text), 5 (not in a text), 6 (competent reader sees stencil as 'a'), 7 (current reader meets a 'd'), 8 (reader identifies 'a' via word context), 9 (*Stretch:* No surrounding text; relies on reader recognizing the form as an 'a' inscription). Verdict 3 is the major stretch, requiring prioritizing the *intended* historical reader over the *actual* current reader.

  **(b) Divergence on the Foundry's Long s**

  *   **Rule A (Origin/Intent):** The foundry *made* it as an 's' (stock book, revival intent). **Files under S.**
  *   **Rule B (Functional Origin):** Designed to function as an 's' within the revived 18th-century typeface system and the promotional broadside (designed for modern English, but *using* the long s as 's'). **Files under S.**
  *   **Rule C (Contextual Reader Function):** Competent *modern* readers encountering it in the broadside *read* it as an 'f' (misreading words). **Files under F.**

  Rules A and B agree on S, Rule C diverges to F.

  **(c) Best Guess for Dr. Vos's Verdict & Reasoning**

  *   **Verdict:** She would file the sort and broadside under **S**.
  *   **Reasoning:** Rule B (Functional Origin) is doing the real work, *especially* Verdict 3. While Verdict 7 (mirrored b) *seems* like Rule C (prioritizing the reader's encounter), it's a constrained exception driven by the *alphabet's inherent structure* ('b' and 'd' are reflections) within a *text*. Verdict 3 is the core precedent: the long s *is* an 's' because that's what it *was doing* on the original page within its system, regardless of modern misreading. The foundry case is directly analogous: the sort was cut and intended to function as 's' (Rule A), and the broadside was *designed* using it to function as 's' within a (slightly archaic) modern English text (Rule B), mirroring the original 18th-c. page's function. The designer's blurb reinforces this intent. The volunteers' misreading is explicitly dismissed by Verdict 3's logic: "The letter is what the page was doing, not what we now do with it." Verdict 7 doesn't apply because flipping a long 's' doesn't inherently produce a valid letter within the alphabet like 'b'/'d' does; it would just be a mirrored long s.

  **(d) Settling Case**

  *   **Case:** A modern poster explicitly designed and typeset for contemporary readers, using a unique, ambiguous glyph designed solely for this poster. The designer intends it to represent the 's' sound. The text relies on context for readability (e.g., "The *ea*y *ea*shell*ea* by the *ea*shore"). Competent modern readers consistently report *seeing* an unfamiliar shape but *reading* it as 's' after the first instance.
  *   **Execution:** Commission a designer to create this glyph and poster. Present it to competent readers (e.g., library staff not involved in printing history) and ask: What sound does this mark represent? Can you read the text? Do you perceive it as a letter? (Ensure "seeing" vs "reading" is probed).
  *   **Predictions:**
      *   **Rule A (Origin/Intent):** Files under S (designed as 's').
      *   **Rule B (Functional Origin):** Files under S (designed to function as 's' in this modern text).
      *   **Rule C (Contextual Reader Function):** Files under S (competent readers *read* it as 's' within the text after initial encounter, fulfilling the letter function). *This is crucial - it distinguishes from the Foundry case where readers persistently read it as 'f', not 's'.*

  **(e) What You Should Do & Implications**

  *   **Verdict:** File the sort and broadside under **S**.
  *   **Closest Precedent:** **Verdict 3 (Long s on 18th-c page)**. This is the most direct parallel: a historical 's' form misread by modern viewers but catalogued as 's' based on its original function. Verdict 9 (medieval 'a') also supports prioritizing the maker's intent and the form's origin.
  *   **Principle Committed to (Filing under S):** The collection prioritizes **the historical and intentional function of the letterform within its original communicative context** over contemporary misreadings or appearances. The letter's identity is anchored in the system it was created for and the intent behind its creation/use. This reinforces the core logic of Verdicts 1, 2, 3, 6, 8, and 9.
      *   **Implications for existing items:** All items catalogued under archaic forms (e.g., long s, thorn, yogh, specific blackletter forms) would remain under their *historical* letter assignments (S, TH, Y/G, etc.), consistent with Verdict 3. The catalogue might *note* common modern misreadings (e.g., "Long s; often misread as 'f' by modern viewers"), but the filing remains historical.
  *   **Principle Avoided (Filing under F):** Filing under F would commit the collection to **prioritizing persistent contemporary misreading over original function and intent** for historical forms. This directly contradicts Verdict 3 and undermines the rationale for Verdicts 1 (different forms same letter), 2 (blackletter a), 6 (stencil a), 8 (child's a), and 9 (carved a). It would force re-evaluation of every archaic form in the index based on modern reader error rather than historical accuracy.

  **By filing under S, you maintain consistency with Dr. Vos's established framework, particularly the foundational Verdict 3, and anchor the catalogue's definition of a letterform in its historical context and intended communicative function, not transient perception.**
