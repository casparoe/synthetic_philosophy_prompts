  For the new case, the key tension is between verdict 3 (long 's' is always 's' regardless of modern misreading) and verdict 7 (mirrored 'b' is catalogued as 'd' because that's what readers see). Both claim to follow "what the page is doing," but they point in opposite directions here.

  To answer part (a), the surviving rules that fit all nine verdicts are:
  - Rule A: Origin (what the maker intended to create)
  - Rule B: Function in its original context
  - Rule C: Function in the current reader's context (with verdict 7 being the exception that requires this)

  Part (b) shows these rules diverge on the foundry's long 's': 
