  First, I need to understand Dr. Vos's framework. She emphasizes three aspects of "shape": appearance, historical origin, and function. She also distinguishes between "reading" (what the text does) and "seeing" (subjective perception). Her rulings show consistent patterns:

  - Cases 1-2, 3, 6, 8-9 prioritize origin/function over appearance
