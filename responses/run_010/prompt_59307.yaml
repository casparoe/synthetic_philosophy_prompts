answer: |-
  I appreciate the precision of your request. You're right that "when in Rome" functions as a rhetorical bludgeon unless dissected. Below is a conceptual dissection of the proverb into distinct claims, followed by application to your cases, all argued from first principles in British English.

  **The Menu of Claims: Dissecting "When in Rome..."**

  1.  **Epistemic Authority Claim:**
      *   **Core Claim:** Locals possess superior knowledge about local conditions, risks, social meanings, and practical consequences that a short-term visitor cannot acquire. Conforming is therefore often the most prudent or effective course.
      *   **Conditions for Truth:** Local practices must demonstrably embody knowledge inaccessible to a reasonable visitor within their timeframe. This knowledge must be relevant to the practice's function (e.g., safety, efficiency, navigating unspoken rules).
      *   **Normative Strength:** Provides a strong *prudential reason* to conform, and potentially a weak *moral reason* (e.g., avoiding foreseeable harm through ignorance). Not a content-independent obligation. Applies equally to locals learning new local norms (e.g., moving regions).
      *   **Status:** Substantive but defensible in many contexts; becomes false if local knowledge is demonstrably poor or irrelevant to the practice.

  2.  **Fair Play / Cooperative Scheme Claim:**
      *   **Core Claim:** By voluntarily entering and benefiting from a local cooperative scheme (implicit or explicit), visitors incur an obligation of fairness to bear their share of the burdens or costs of that scheme.
      *   **Conditions for Truth:** (1) A clear, stable cooperative scheme must exist. (2) The visitor must *voluntarily* participate and derive *tangible benefit* from it. (3) Non-conformity must impose a burden or cost *on the scheme or its participants*.
      *   **Normative Strength:** Can generate a *content-independent moral obligation* (fairness) to contribute if benefiting. Does *not* oblige participation in schemes providing no benefit or deemed unjust. Primarily binds visitors who benefit; locals are bound as scheme members.
      *   **Status:** Substantive and defensible (rooted in fairness), but scope is narrower than the proverb suggests. Platitude only in clear cases of mutual benefit schemes.

  3.  **Expressive Respect / Avoiding Contempt Claim:**
      *   **Core Claim:** Deliberate non-conformity, regardless of intent, often expresses disrespect, arrogance, or a sense of superiority towards the local community and its norms. Conforming is a minimal expression of respect.
      *   **Conditions for Truth:** (1) The practice must hold some social or conventional significance locally (beyond mere habit). (2) Non-conformity must be reasonably interpretable as dismissive or contemptuous. (3) Conformity must be feasible and not require complicity in grave injustice.
      *   **Normative Strength:** Provides a *moral reason* (respect for persons/community) to conform, especially for minor conventions. Can be outweighed by stronger moral commitments. Stronger duty for visitors as newcomers; locals have similar duties regarding local norms but less scrutiny for minor deviations.
      *   **Status:** Substantive and often defensible for social conventions; becomes platitude for trivial matters and false if conformity *itself* expresses complicity with injustice.

  4.  **Deference to Collective Self-Determination Claim:**
      *   **Core Claim:** Communities have a right to determine their own conventional norms and terms of interaction. Visitors, as outsiders, have a duty of deference to these settled conventions, analogous to respecting a host's household rules. Objecting imposes an external standard – a form of judgemental imperialism.
      *   **Conditions for Truth:** (1) The practice must be a genuine, widely accepted *convention* within the community. (2) It must fall within the sphere where communities legitimately exercise self-determination (primarily social coordination, not core morality). (3) It must not inflict severe harm or violate fundamental rights.
      *   **Normative Strength:** Can generate a *prima facie moral obligation* (deference) for visitors, rooted in respect for communal autonomy. Locals are bound by their own conventions but have standing to critique/reform them. Content-independent *only* for conventions within the sphere of legitimate self-determination.
      *   **Status:** Substantive and defensible for coordinating conventions; straightforwardly false if applied to morally abhorrent practices or fundamental rights violations.

  5.  **Prudential Advice Claim:**
      *   **Core Claim:** Conforming makes life easier, avoids friction, reduces the risk of offence (even unintended), and helps the visitor blend in. It's simply the path of least resistance and greatest comfort.
      *   **Conditions for Truth:** Conformity must generally lead to smoother interactions and fewer negative consequences for the visitor than non-conformity.
      *   **Normative Strength:** Provides only a *prudential reason* (self-interest) to conform. No moral obligation implied. Applies equally to anyone in a new context (visitors or locals).
      *   **Status:** Platitude in most contexts; straightforwardly false if conformity creates significant personal risk or hardship.

  **Applying the Menu to Your Cases**

  1.  **Tipping:**
      *   **Friend's Support:** Primarily the **Fair Play / Cooperative Scheme claim**. Your friend argues you *benefit* from the service enabled by the low-wage + tips structure, so fairness demands you bear the *burden* of tipping. The Expressive Respect claim might be secondary (stiffing staff *looks* disrespectful). The Epistemic claim is weak here (the exploitative nature might be obvious).
      *   **Challenges:** Is it a genuine *cooperative scheme* or an exploitative structure? Does paying menu prices constitute "benefiting from the scheme" sufficiently? Does the visitor have an alternative (e.g., eating elsewhere)? If the scheme is inherently unjust, Fair Play may not bind, or even *require* non-participation. The Deference claim struggles against potential injustice.

  2.  **Jaywalking:**
      *   **Friend's Support:** Primarily the **Expressive Respect / Avoiding Contempt claim**. Standing alone while locals cross *looks* like moral preening or judging local judgement as inferior. The Epistemic Authority claim might also apply (locals know the *actual* risks/signals at that crossing better than a visitor). The Prudential claim is obvious (avoiding collisions/fines).
      *   **Challenges:** Is the local practice actually safer, or is it just habitual rule-breaking? Does non-conformity *necessarily* express contempt, or could it express caution or unfamiliarity? The Fair Play claim is weak (what "scheme" is being benefited from?).

  3.  **The Scrum:**
      *   **Friend's Support:** Primarily the **Deference to Collective Self-Determination claim** combined with a **Harm-based argument** (you disrupted a working, albeit messy, coordination convention). The Epistemic Authority claim is strong (locals understood the subtle cues you missed). The Expressive Respect claim applies (imposing your foreign system could seem arrogant).
      *   **Challenges:** Was the scrum a stable, *functional* convention, or a fragile, inefficient mess? Did you *join* it voluntarily? Attempting to impose a queue was clumsy, but is deference owed to a system causing shoving and lost places? The Fair Play claim is weak – it's unclear what benefits you received *from the scrum* before attempting to change it. Your objection highlights the lack of a clear scheme.

  **Cross-Case Analysis & Friend's Likely Invocations:**

  *   **No Single Reading Fits All:** No single interpretation of the proverb supports your friend's position equally strongly across all three cases without significant qualification. The cases *are* disanalogous:
      *   Tipping hinges on *benefit and fairness* within a potentially exploitative structure.
      *   Jaywalking hinges on *expression of respect* and local risk assessment.
      *   The Scrum hinges on *deference to local coordination* and avoiding disruption, but its fragility challenges the claim it was "working".
  *   **Friend's Likely Invocations:**
      *   **Tipping:** Primarily invoked the **Fair Play Claim**, framing the restaurant system as a cooperative scheme you joined by dining.
      *   **Jaywalking:** Primarily invoked the **Expressive Respect Claim**, interpreting your caution as signalling superiority.
      *   **Scrum:** Primarily invoked a crude mix of **Deference** and a **Harm Principle** (disrupting the local order), leaning heavily on the consequence (shoving) rather than the structure itself. The "hair-splitting" accusation suggests they conflated mere physical presence with joining a scheme, likely blurring Fair Play and Deference.
  *   **Is Your Objection Hair-Splitting?** Absolutely not. Distinguishing these cases is crucial. Recognising that different *types* of norms (market structures, traffic conventions, coordination mechanisms) engage different moral principles (fairness, respect, deference/harm avoidance) is essential for sound ethical reasoning. Conflating them under one vague proverb is intellectually lazy. Your scrum case effectively exposes the proverb's weakness when the local "doing" is opaque, fragile, or lacks clear structure – demanding conformity *to what?* The Romans weren't reliably "doing" *one* thing you could discern and join.

  **Scope of "Rome": Key Limitations**

  *   **Duration:** The claims weaken with longer stays. Epistemic Authority diminishes as the visitor learns. Fair Play strengthens if the visitor integrates long-term. Deference remains but allows for gradual critique/participation in reform.
  *   **Repugnant Practices:** All normative claims (Fair Play, Expressive Respect, Deference) collapse when local practices involve severe harm, injustice, or fundamental rights violations (e.g., apartheid laws, caste discrimination). "Rome" cannot command complicity in evil. The Prudential claim might still advise caution *if* resisting actively is dangerous.
  *   **Harm to Third Parties:** Proverb-based claims are weakest here. Fair Play requires scheme membership. Expressive Respect/Deference towards locals doesn't easily extend to justifying harm to others *they* harm. A strong independent moral duty to avoid harming third parties usually overrides.
  *   **Self-Undermining (Different Expectations):** This is a critical flaw. If the local "Roman" practice *is* to expect visitors to behave differently (e.g., tourists tipping more, using formal address), then "doing as the Romans do" paradoxically means *not* conforming to the behaviour of locals *in their capacity as locals*. The proverb implodes unless redefined as "do what the Romans *expect of you*", which is a very different (and often problematic) claim. No single reading handles this easily; it highlights the proverb's context-dependence and potential incoherence.

  **Conclusion:**

  The proverb "when in Rome..." is not a unitary moral principle but a container for several distinct claims: Epistemic Prudence, Fair Play, Expressive Respect, Deference, and Simple Prudence. Each has different conditions, strengths, and limitations. Your friend likely shifted between Fair Play (tipping), Expressive Respect (jaywalking), and a muddled Deference/Harm argument (scrum). Your cases *are* disanalogous – tipping engages potential exploitation and fairness, jaywalking involves signalling and local risk conventions, and the scrum concerns the fragility of opaque coordination norms. Pointing out these differences isn't hair-splitting; it's necessary for understanding when, why, and to what extent conformity might be reasonable or obligatory. The proverb, applied rigidly, fails at its edges: with repugnant practices, harm to third parties, ambiguous "Roman" behaviour, and differing expectations for visitors. Its value lies not as a trump card, but as a prompt to analyse *which specific reason* for conformity applies in a given context.
