answer: |-
  Here's a philosopher-practitioner's specification for reference-class selection in long-horizon political forecasting. The core function of the reference class is to provide an **objectively grounded prior** – a starting point correcting for base-rate neglect and idiosyncratic optimism/pessimism, forcing engagement with historical stochasticity. It's not a final probability, but a *calibration anchor*.

  ### Desiderata for Reference-Class Selection
  **D1: Explicit Temporal Horizon Handling**  
  *Requirement:* Must incorporate the forecast duration *N* intrinsically, not as an afterthought. Base rates must be survival/transition rates *over comparable intervals*.  
  *Motivation:* Horizon problem. "All empires fall" over millennia, but forecasting needs specific *N*.  
  *Status:* **Non-negotiable** (all camps). Without it, the forecast is meaningless.  

  **D2: Ontological Stability**  
  *Requirement:* Criteria for polity identity (continuity/succession) must be defined *a priori* and applied consistently to all class members.  
  *Motivation:* Continuity problem (e.g., Is modern China "the same" as Ming China?).  
  *Status:* **Non-negotiable** (frequentists, reference-class practitioners); subjectivists may accept fluidity but lose objectivity.  

  **D3: Non-Gerrymandering Constraint**  
  *Requirement:* Selection rules must be based on *exogenous*, policy-irrelevant characteristics known at the start of each case's interval, preventing ad hoc narrowing/expansion to manipulate rates.  
  *Motivation:* Gerrymandering problem. "Naval trading republics..." can be sliced to fit desires.  
  *Status:* **Non-negotiable** for objectivity. "Narrowest reasonable class" often violates this; pre-registration helps but isn't sufficient.  

  **D4: Feasible Cardinality & Independence Adjustment**  
  *Requirement:* Must function with small *N* (~15-50 cases) and provide adjustment for interdependencies (e.g., wars, cultural diffusion).  
  *Motivation:* Tiny, non-independent *N*. Ignoring interdependence inflates effective *N* and understates uncertainty.  
  *Status:* **Non-negotiable for practicality**; frequentists struggle, subjectivists/Bayesians model dependencies.  

  **D5: Bounded Bayesian Adjustments**  
  *Requirement:* Specify how and how much "inside view" evidence can modify the base rate, with explicit uncertainty penalties for strong deviations.  
  *Motivation:* Everyone thinks their case is special. Requires discipline to avoid overriding the anchor with storytelling.  
  *Status:* **Preference leaning non-negotiable** (reference-class practitioners, skeptics of unstructured "expert judgment").  

  **D6: Regress Termination**  
  *Requirement:* Provide a non-arbitrary stopping point for "which class?" decisions, avoiding infinite meta-classes.  
  *Motivation:* Regress problem. Class selection needs its own anchor.  
  *Status:* **Critical preference** ("just use mechanisms" crowd denies solvability). Must appeal to shared epistemic conventions or practical necessity.  

  **D7: Survivorship Bias Mitigation**  
  *Requirement:* Account for *unobserved* polities (e.g., short-lived states, unrecorded entities) to avoid overestimating longevity.  
  *Motivation:* Historical records favor survivors and major powers.  
  *Status:* **Non-negotiable for accuracy**; often overlooked, causing upward bias in base rates.  

  **D8: Causal Plausibility**  
  *Requirement:* Characteristics defining the class should have a defensible (even if contested) link to the outcome, not be arbitrary correlates.  
  *Motivation:* Avoid spurious classes (e.g., "polities with blue flags" vs. "landlocked empires").  
  *Status:* **Preference** (mechanism-focused camp); reference-class purists may accept statistical associations.  

  ### Impossibilities and Tensions
  - **D2 vs. D6:** Defining stable polity identity (D2) *requires* historical judgment, contradicting the goal of replacing judgment via base rates (D6’s ideal). **D2 undermines the core promise of the "outside view."**  
  - **D3 vs. D4 vs. D8:** "Narrowest class" (common D3 "fix") often creates tiny *N* (violating D4) or arbitrary groups (violating D8). Causal plausibility (D8) demands broader, theoretically coherent classes, increasing *N* but risking gerrymandering (D3).  
  - **D1/D7 Joint Failure:** Long horizons *and* survivorship bias guarantee near-0 base rates for *any* polity, making forecasting futile.  

  ### Scoring Contenders
  - **Frequentist "Narrowest Class" (Tetlock):** Fails D2 (identity arbitrary), D3 (gerrymandering), D4 (small *N* ignored), D7 (bias).  
  - **Subjectivist/Bayesian (e.g., Superforecasting):** Fails D3 (class selection subjective), D5 (adjustments unbounded), D6 (regress unresolved).  
  - **Reference-Class Forecasting (Kahneman/Tversky inspired):** Fails D2, D4 (ignores dependencies), D7. Strong on D1, D3 (if pre-registered).  
  - **Mechanism-First (Tilly, historical sociology):** Rejects reference classes; fails by design on D1, D3, D5. Excels at D8.  
  - **Hierarchical Bayes (e.g., meta-analysis):** Best on D4 (models dependencies), D5 (formal adjustments), D7 (partial). Fails D2, D6 (priors still subjective).  

  The most corrosive desideratum is **D2 (Ontological Stability)**. It forces precisely the contested historical ontology the method sought to bypass, revealing the outside view as *dependent* on suppressed inside-view judgments. Without resolving D2, the anchor dissolves.  

  \answer{D2}
