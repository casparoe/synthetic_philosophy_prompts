answer: |-
  Here is a systematic translation of exemplarism into motor-learning vocabulary, followed by a residue analysis addressing your core questions. I maintain strict directionality: moral concepts are mapped *onto* your framework, not vice versa. Contested interpretations are flagged.

  ---

  ### Translation of Exemplarism into Motor-Learning Vocabulary
  **1. Admiration as Identification Mechanism**  
  → *Translation:* **External attention focus** triggered by a model performer. Admiration is the affective signal directing attention to relevant cues in the model’s behavior.  
  → *Stretch/Cost:* Reduces admiration’s normative "pull" to a attentional trigger. Loses the *evaluative* dimension (why *this* model, not that one).  

  **2. Narrative Particularity Over Abstract Rules**  
  → *Translation:* **Rich knowledge of performance (KoP) feedback**. Specific episodes provide high-resolution kinematic feedback (e.g., "how they gripped the bar during fatigue") versus rule-based knowledge of results (KoR: "lift succeeded/failed").  
  → *Stretch/Cost:* Equates moral meaning with observable action. Loses the *intentional* layer (e.g., "was this courage or recklessness?").  

  **3. Plutarch’s "Slight Things" Over Grand Deeds**  
  → *Translation:* **Micro-behavioral demonstration**. Selective attention to subtle cues (a jest, expression) is like focusing on wrist position in the clean rather than the lift’s outcome. Targets *technique* over outcome.  
  → *Cost:* Assumes character is legible in micro-behaviors—a claim motor learning doesn’t endorse or reject.  

  **4. Pairing/Comparison (Greek/Roman Lives)**  
  → *Translation:* **Differential learning via contrastive modeling**. Presenting two models with stylistic variants (e.g., "Aemilius’s stance vs. Alexander’s") to promote adaptive problem-solving.  
  → *Cost:* Motor learning uses contrast for *movement diversification*, not moral discernment.  

  **5. Hagiographic Embellishment/License**  
  → *Translation:* **Optimal demonstration design**. Removing errors/hesitations is like editing a coaching video to show "ideal bar path"—reducing noise to highlight key features.  
  → *Stretch:* Moral "improvement" of facts ≠ technical simplification. Saints’ errors are omitted to *prevent* imitation; coaching edits to *enable* it.  

  **6. Noticing but Not Copying Faults**  
  → *Translation:* **Error identification without reinforcement**. Like analyzing a missed lift to understand breakdown points ("knees caved") but not drilling the error.  
  → *Cost:* Moral faults aren’t "technique errors" but normative violations; framework lacks a "do not replicate" marker.  

  ---

  ### Residue Report
  **Pile 1: Clean Translations**  
  - Narrative particulars → **KoP feedback**  
  - "Slight things" focus → **Micro-behavioral cues in demonstration**  
  - Pairing/comparison → **Contrastive modeling for variability**  
  - Noticing faults → **Error analysis without practice replication**  

  **Pile 2: Translations with Distortion**  
  - **Admiration as identification** → Distorted as *attention focus*. *Cost:* Loses admiration’s role in *evaluative selection* of models. Motor learning assumes the coach picks the model; exemplarism assumes admiration does.  
  - **Hagiographic license** → Distorted as *optimal demonstration*. *Cost:* Embroidery serves *normative idealization* (what *should* be imitated), not just clarity. Motor learning prioritizes accuracy; hagiography prioritizes edification.  

  **Pile 3: Untranslatable Components**  
  1. **Outcome measure inaccessibility**: Coaching relies on measurable outcomes (bar path, split time). Moral learning lacks an objective "result" metric—even for the agent. *No analogue* for "Was this *truly* a virtuous act?"  
  2. **Exemplar internalization vs. constraints-led view**: Constraints-led approaches see technique as *emergent* from athlete-environment coupling. Carrying an "internalized exemplar" contradicts this—it implies a stored template. Exemplarism *requires* this internalization.  
  3. **The self-model finding**: Motor learning shows learners benefit from models *at their level*. Exemplarism uses transcendent models (saints, heroes). *Contradiction?* Not quite: Exemplarism posits that admiration bridges the gap ("*Because* they’re distant, they inspire"). This motivational layer has no counterpart in skill acquisition.  

  ---

  ### Pressure Points Addressed
  **1. Distant Exemplars vs. Self-Model Finding**  
  → *Verdict:* **Different claims**. Self-modeling aids *technical acquisition*; distant exemplars leverage *aspirational identification*. Your framework lacks a mechanism for "aspiration-driven learning."  

  **2. Idealization (Smoothing Errors)**  
  → *Verdict:* **Defect per motor learning, feature per exemplarism**. Coaching would flag omitted errors as poor demonstration (learners need to see recovery). Hagiography omits faults to avoid *moral contamination*—a normative concept absent in your vocabulary.  

  **3. Constraints-Led View vs. Internalized Exemplar**  
  → *Verdict:* **Undermines exemplar internalization**. Constraints-led approaches reject stored templates; virtue exemplarism depends on them. If technique is emergent, "carrying an exemplar" is either superfluous or misleading.  

  **4. Outcome Measure Inaccessibility**  
  → *Verdict:* **Critical structural gap**. Coaching uses objective KR (knowledge of results: "lift succeeded"). Moral learning has no equivalent—subjective self-assessment or social feedback (KoP) replaces it. This forces exemplarism into reliance on *narrative interpretation* as proxy feedback.  

  ---

  ### The Residue Cut: What’s Missing?
  **The residue reveals two structural gaps in your framework:**  
  1. **A Category of Normative Feedback**  
     → Coaching feedback is *descriptive* (bar path deviation). Moral learning requires *evaluative feedback* ("Was this courageous?"). Your vocabulary lacks tools for *interpreting* actions in light of values.  
  2. **A Mechanism for Aspirational Identification**  
     → Admiration’s role in selecting models and bridging ability gaps has no counterpart. Motor learning selects models for efficacy; exemplarism for *moral magnetism*.  

  **Is exemplarism misdescribed?**  
  The residue suggests your formation likely involved:  
  - **Belonging/Ritual**: The *practice* of reading lives (blocked, recurrent exposure) aligns with motor learning’s "chunking" for automaticity.  
  - **Narrative Pleasure**: Engaging stories boost attention/motivation—extrinsic factors in skill acquisition.  
  But exemplarism’s core claim—*imitation of virtue via narrative attention*—**fails to map cleanly**. Key components (admiration’s selectivity, idealization, template internalization) distort or vanish in translation.  

  **Scholarly Caveats**  
  - Plutarch’s "mirror" metaphor is contested: Does he endorse imitation or critical reflection? (I treated it as imitation per your reading.)  
  - Hagiographic reuse of tropes may reflect genre conventions more than pedagogical intent.  
  - Moral outcome inaccessibility is debated (virtue ethicists vs. utilitarians).  

  **Final Verdict (No Hedge)**  
  The residue cuts against exemplarism as a *mechanistic theory of learning*. Your framework exposes its reliance on:  
  - Unevidenced assumptions (internalized templates),  
  - Unaccounted processes (evaluative feedback),  
  - And motivational elements (aspiration) mislabeled as imitation.  
  What formed you was likely **ritualized exposure to compelling narratives**—a process your vocabulary *can* capture (via attention, practice design, chunking)—not imitation of virtue. The theory overclaims.
