  ### Activity Design: "Carving Nature at its Joints"  
  **Objective:** Illustrate that classifications can be objectively valid for different purposes without one being inherently "more natural" than the other.  

  ---

  #### **Materials**  
  1. **24 Sample Cards** (fictional "asteroid debris" from a cosmic survey):  
     Each card lists 6 properties (binary: Yes/No). Properties are:  
     - **P1:** High iron content  
     - **P2:** Radioactive decay  
     - **P3:** Magnetic field  
     - **P4:** Soluble in acid  
     - **P5:** Brittle under pressure  
     - **P6:** Thermally conductive  

     | Sample ID | P1: Iron | P2: Radioactive | P3: Magnetic | P4: Acid-soluble | P5: Brittle | P6: Conductive |
     |-----------|----------|-----------------|--------------|------------------|-------------|----------------|
     | 1         | Yes      | No              | Yes          | No               | Yes         | Yes            |
     | 2         | No       | Yes             | No           | Yes              | No          | Yes            |
     | 3         | Yes      | Yes             | No           | No               | Yes         | No             |
     | 4         | No       | No              | Yes          | Yes              | No          | No             |
     | ...       | ...      | ...             | ...          | ...              | ...         | ...            |
     | 24        | Yes      | No              | Yes          | Yes              | No          | Yes            |

     **Data Key** (hidden from students):  
     - **Cluster A:** Samples with **P1+P2+P3 ≥ 2** (e.g., Sample 1: Iron=Yes, Radioactive=No, Magnetic=Yes → 2/3).  
       *Predicts **"dissolves in solvent X"**.*  
     - **Cluster B:** Samples with **P4+P5+P6 ≥ 2** (e.g., Sample 1: Acid-soluble=No, Brittle=Yes, Conductive=Yes → 2/3).  
       *Predicts **"safe to handle"**.*  
     - Clusters crosscut: ~50% of samples in Cluster A are *not* in Cluster B (and vice versa).  
     - [Full table provided at end](#appendix-full-sample-data).  

  2. **Client Briefs** (for small groups):  
     - **Group 1 (Solvent Solutions Inc.):**  
       *"Your client seeks debris that **dissolves in solvent X** for mining. Develop a classification to predict this. You’ll be scored on accuracy for 4 new samples. Payment: $10,000 per correct prediction (hypothetical)."*  
       - *Training Data:* Cards 1-24 + solubility labels (1=dissolves, 0=does not).  

     - **Group 2 (Safety First Labs):**  
       *"Your client needs debris **safe to handle** (no gloves required). Develop a classification to predict safety. Scoring/payment same as Group 1."*  
       - *Training Data:* Cards 1-24 + safety labels (1=safe, 0=unsafe).  

  3. **4 Test Samples** (new debris):  
     | ID | P1 | P2 | P3 | P4 | P5 | P6 |
     |----|----|----|----|----|----|----|
     | 25 | Yes | No | Yes | No | **Yes** | **Yes** |
     | 26 | **Yes** | **Yes** | No | Yes | No | No |
     | 27 | No | **Yes** | **Yes** | **Yes** | No | Yes |
     | 28 | Yes | No | No | No | **Yes** | **Yes** |  
     *(True labels: Dissolves=26,27; Safe=25,28)*  

  ---

  #### **Activity Flow**  
  1. **Intro (5 min):**  
     - Pose: *“Scientists say we should ‘carve nature at its joints.’ What might that mean?”*  
     - Explain: Groups will classify asteroid debris for clients.  

  2. **Group Work (30 min):**  
     - Groups devise taxonomies using training data (e.g., Group 1 clusters by P1-P3; Group 2 by P4-P6).  

  3. **Prediction Round (10 min):**  
     - Groups predict labels for the 4 test samples using their taxonomy.  
     - **Scoring:** Reveal true labels. Groups earn 1 point per correct prediction. No real money—bragging rights only!  

  4. **Group Reports (10 min):**  
     - Each group shares:  
       - How they classified (what properties mattered?).  
       - Test predictions/results.  

  5. **Debrief (20 min):**  
     **Guided Questions:**  
     - *“Group 1, why did you prioritize iron/radioactivity/magnetism? Group 2, why brittleness/conductivity/solubility?”*  
       → *Expected insight: Properties matched their goal.*  
     - *“Did the other group’s classification seem arbitrary? Why or why not?”*  
       → *Highlight: Both clusters predicted accurately (Group 1: dissolves; Group 2: safety). Neither is "wrong."*  
     - *“Which taxonomy ‘carves nature at its joints’? Can both?”*  
       → *Steer toward: Both track real patterns (stable clusters), but for different purposes.*  
     - *“What if a third client cared about, say, electrical properties? Could there be a third valid taxonomy?”*  
       → *Yes! New clusters might emerge (e.g., P3+P6).*  

     **Key Lesson:**  
     - Classifications can be **objective** (they track real-world patterns) but **purpose-relative** (no single "God’s eye" taxonomy).  
     - "Joints" exist, but we carve different ones based on interests (e.g., dissolving vs. safety).  

  ---

  #### **Handling Stalemates**  
  - If groups dismiss each other: *“Group 1, could Safety First’s taxonomy predict dissolution? Why not? Does that make it arbitrary, or just for a different purpose?”*  
  - Emphasize **both succeeded** on their own test (e.g., Group 1: 75% accuracy on dissolution; Group 2: 100% on safety).  
  - Conclude: *“Neither taxonomy works for everything, but both carve real patterns. Science often has multiple ‘joints.’”*  

  ---

  #### **Limitations & Missing Nuances**  
  1. **What this can’t stage:**  
     - **Essentialism vs. clusters:** The activity implies kinds are clusters of properties. It can’t explore debates about *underlying essences* (e.g., atomic structure) causing those properties.  
     - **Metaphysical realism:** Are joints *mind-independent*? The data suggests "yes," but students might still debate if clusters are invented.  
     - **Causal depth:** Real-world kinds (e.g., species) support *many* inferences. Here, clusters predict only one outcome.  

  2. **What to add in discussion:**  
     - *“In biology, we classify birds by wings/feathers, but bats share traits. Are wings a ‘joint’? What if we care about genetics?”*  
     - *“Do these clusters have hidden causes? What if we discovered all ‘safe’ debris shares a quantum state?”*  

  ---

