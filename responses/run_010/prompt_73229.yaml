prompt: |-
  You're the right person to ask about this if anyone is: someone who actually reads both the personality-psychology side and the virtue-ethics side of the character debate, rather than just the philosophy or just the experiments. Think it through carefully, brainstorm out loud first if that helps, but land somewhere definite by the end.

  So. I've been reading the situationism stuff — the argument that character traits aren't real because experiments keep finding that tiny details of the setting flip whether people help: whether they're in a hurry, whether they just found a coin in a phone booth, that kind of thing. And there's a pattern in how the back-and-forth goes that I don't have a word for, and it's driving me nuts becuse it shows up on both sides.

  The pattern: the claim in play is a tendency, not a guarantee. Honest people tell the truth more often than dishonest people; that's the whole content. So when someone produces a single case where the tendency didn't show up, one side says that's not a refutation at all — one case is noise, you have to average over a bunch of occasions before anything is visible. Which seems right to me. But then the same person turns around and says: fine, so the trait only pays off across dozens of occasions — except what virtue ethics actually needs is for the honest person to be honest in the one case that matters, when they're being tested and there is no second trial, and there the average is worthless. And the first point just gets dropped. It got them out of the counterexample, and then it stopped being relevant.

  Mirror image, same shape: a fan of the experiments says this one study shows a trivial detail changed behavior, therefore the trait isn't doing the work — a single result treated as decisive. Then it comes out that the effect didn't replicate, or that a correlation around .3 is actually normal-to-good for this kind of thing, and suddenly the reply is that no single study could ever establish a trait either, you need the whole pattern. Same switch, other direction.

  What I want to know: does this have a name? Not the general area. I know there's a standing fight about how much evidence an experiment can carry, I know "cherry-picking," I know people say "moving the goalposts." It isn't exactly either of those, because each of the two standards being invoked is legitimate on its own — averaging really is how you evaluate a tendency, and sometimes a single case really does carry the weight (I'd take one trial of a medicine saving one life seriously). The thing I can't name is the switch between them, which somehow always lands on whichever standard helps whoever is making it, and never gets announced as a switch — it's delivered as if that standard had been the obvious one all along.

  So: what's the nearest established concept, or concepts? How is what I'm describing different from each of them, and which one fits best? If nothing fits, coin something, with a real definition and boundary cases — tell me what would NOT count, like a situation where switching standards is perfectly fine and everyone should expect it. Don't stop at the label, the carving is the part I care about: what the phenomenon is, what it isn't, where its edges sit. And commit to a verdict on which side of the virtue debate is more guilty of it and why — I'd rather have your actual position with reasons than a menu of considerations I have to weigh myself.
reasoning: |-
  Okay, the user is asking about a specific logical pattern they've noticed in the virtue ethics vs. situationism debate. They've observed that both sides switch between two legitimate standards when it suits their argument: one side emphasizes aggregated data when faced with counterexamples, but then argues that single cases matter in critical situations. The other side treats a single experiment as definitive evidence against traits, but falls back on needing multiple studies when replication fails. The user wants to know if this pattern has a name, how to define it, and which side is more guilty of it.

  First, I need to recognize the core issue: it's not just cherry-picking or moving goalposts. Both standards (aggregate vs. single-case) are valid in different contexts, but the problem is the unacknowledged switch between them for rhetorical advantage. The user is frustrated because this isn't addressed in existing terminology.

  Looking at logical fallacies, "equivocation" comes to mind, but it's usually about word meanings. Here, it's about shifting epistemic standards. "Special pleading" might fit, but it's broader. The closest established concept is "double standard," but that's too vague. The user needs a precise term that captures this tactical switching.

  For the definition, I should focus on the unannounced shift between legitimate standards based on what benefits the arguer. Boundary cases would include when the shift is explicitly justified, like a scientist noting that a single study is preliminary until replicated. The phenomenon excludes justified context-dependent standard applications.

  Now, analyzing which side is more guilty. Situationists often highlight dramatic single-study results (like the Good Samaritan experiment) to dismiss traits, then retreat to aggregation when challenged. Virtue ethicists aggregate to defend traits against counterexamples but emphasize single-case demands for moral tests. Both do it, but situationists get more initial traction from single-study claims, making their switches more impactful in debates. The Milgram experiment's popular interpretation shows this pattern clearly.

  I'll coin "tactical epistemic switching" as the term. The user wants a verdict: situationists are more guilty because their single-study claims are foundational to their critique, yet they inconsistently demand aggregation when those studies are questioned. Virtue ethicists respond defensively, so their switches are reactive. The user's deeper need is likely to clarify this rhetorical tactic to better engage in the debate themselves.
answer: |-
  You've perfectly dissected a pervasive and corrosive pattern in this debate — one that absolutely deserves a name. The closest established concept is **equivocation on the level of analysis** or **epistemic level-switching**, but these are descriptive rather than formal terms. Let's coin something more precise:

  **The phenomenon is: Tactical Epistemic Switching (TES).**

  **Definition:** The unacknowledged and opportunistic shift between different, contextually legitimate standards of evidence (e.g., single-case vs. aggregate, replicability requirement vs. prima facie impact) within an argument, specifically to deflect counter-evidence or bolster a claim, while presenting the *currently invoked* standard as the obvious and consistent one.

  **Core Mechanics:**
  1.  **Two Legitimate Standards:** TES exploits standards that *are* valid in *different* contexts (e.g., aggregate data *does* define a tendency; a single critical case *can* be decisive).
  2.  **Opportunistic Switch:** The switch occurs precisely when the *previously used* standard becomes inconvenient due to new evidence or argumentation, and the *alternative* standard conveniently salvages the arguer's position.
  3.  **Unacknowledged Shift:** The arguer does not explicitly justify *why* the standard has changed given the new context; it is presented as the natural, consistent standard all along.
  4.  **Rhetorical Advantage:** The switch serves to immunize the claim against the immediate challenge, creating a sense of having "answered" the criticism without genuine resolution.

  **Boundaries: What TES is NOT:**

  1.  **Simple Moving Goalposts:** Moving goalposts involves *changing the definition* of the claim itself to evade falsification (e.g., "Virtue exists" -> "No, *true* virtue is X"). TES keeps the *claim* stable ("Traits are real tendencies" vs. "Traits are empirically weak") but changes the *standard of evidence* required to support or refute it *for this specific challenge*.
  2.  **Cherry-Picking:** Cherry-picking is selecting *specific data points* that support your claim while ignoring others. TES involves selecting *which methodological or epistemic principle* to apply to the *same* (or comparable) data/claim when challenged.
  3.  **Legitimate Contextual Shift:** If an arguer *explicitly states* why a different standard applies in a new context, it's not TES. E.g., "While we normally assess tendencies over aggregates, *in this specific scenario* (e.g., a unique moral dilemma), the single instance *is* the relevant test. Here's why...". TES lacks this justification.
  4.  **Hypocrisy/Double Standard (Simple):** A double standard is applying different rules to *different cases* unfairly. TES is applying different rules to the *same claim or type of evidence* at different points *within the same argumentative line*, opportunistically.
  5.  **Good Scientific Practice:** Replication crises *necessitate* shifting focus from single studies to aggregates. This is a *consistent*, acknowledged, and justified shift based on the field's evolving understanding of evidence quality. It's not opportunistic switching *within a defense of a specific claim*.

  **Which Side is More Guilty? A Verdict with Reasons:**

  **Situationists/Experimental Critics are more consistently and foundationally guilty of TES in this debate.**

  **Why:**

  1.  **The Core Situationist Attack Relies on Single-Study Dramatism:** The initial, most rhetorically powerful thrust of situationism ("Look! A dime/being in a hurry made people not help! Character is a myth!") *depends* on treating specific, often highly contextual, single experiments (Good Samaritan, Milgram obedience variations) as *decisive* refutations of the *general* concept of stable traits. This is the **"single case treated as decisive refutation"** move you identified.
  2.  **Switching to Aggregate Defense Under Pressure:** When challenged on replication failures (e.g., variations of Milgram showing different obedience rates), the small-to-moderate size of aggregated personality-behavior correlations (r ~ .3-.4), or the existence of *some* cross-situational consistency, situationists *switch*. They argue that *no single study* could prove or disprove traits, that the *overall pattern* of modest correlations and context sensitivity is what undermines the *traditional* virtue ethics view of robust, highly consistent traits. They retreat to the aggregate standard they initially bypassed.
  3.  **Exploiting the "Critical Test" Ambiguity:** Situationists often *simultaneously* demand that traits be demonstrated in single, high-stakes, unrepeatable situations (where aggregate data is useless) to be considered "real" (invoking the single-case standard for the *defender's* position), while dismissing single counter-examples to *their own* claims by invoking aggregate standards ("that's just one case, show me the pattern!").
  4.  **Virtue Ethicists React Defensively:** Virtue ethicists primarily engage in TES as a *reaction*. When hit with a dramatic single-study counterexample, they invoke the aggregate standard ("traits are tendencies, this is just noise"). When situationists then argue that aggregates don't guarantee behavior in the critical single case, virtue ethicists *switch* to arguing that the single critical case *is* where the trait *must* manifest (invoking the single-case standard defensively). While problematic, this is often a *response* to the situationist's initial TES-laden attack and their shifting demands for what counts as a valid trait demonstration.

  **In essence:** Situationists *initiate* the debate using single-study results as decisive proof against traits (exploiting the intuitive power of the single-case standard) but *systematically retreat* to aggregate standards when their preferred single-study results or interpretations are challenged. This foundational reliance on the initial, dramatic, single-study-as-decisive move, followed by the tactical aggregate retreat, makes their use of TES more central and damaging to the core debate. Virtue ethicists' TES is more reactive and stems partly from the difficulty of defending a probabilistic concept (trait-as-tendency) against demands for deterministic guarantees in single cases – demands often amplified by situationists themselves.

  Your frustration is warranted. TES is a key reason this debate often feels like ships passing in the night. Naming it ("That's tactical epistemic switching") and demanding consistency on the *level of evidence required* ("Are you demanding proof for a tendency via aggregate data, or are you demanding guaranteed manifestation in a single case? You can't require both *and* switch depending on which suits your argument now") is crucial for clearer dialogue.
