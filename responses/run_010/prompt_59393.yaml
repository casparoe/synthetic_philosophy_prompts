answer: |-
  ### Review Procedure for Public Statements

  **Core Principles Used**  
  1. **Question at Issue**: The answer must address the core proposition(s) the question explicitly seeks. Avoiding this is misleading by omission.  
  2. **Foreseeable Inference**: If a reasonable, informed audience would likely draw a false conclusion from the statement—and the speaker can anticipate this—it is misleading unless corrected.  
  3. **Subjective Condition for Lying**: A statement is a lie only if the *speaker believes it is false*. Truthfulness alone is insufficient if inferences distort reality.  

  **Dropped for Usability**: The debate over whether "misleading" requires *intent* (vs. negligence). The procedure assumes negligence suffices for "misleading" to prioritize audience impact. Loses nuance in culpability but gains speed.  

  **Procedure Steps**  
  1. **Truth Verification**  
     - Verify every factual clause. If any clause is false → **Lie** (stop).  
     - If truth unverifiable (e.g., facts missing): Escalate to General Counsel with options: (a) Omit the clause, (b) State uncertainty, or (c) Withhold the statement.  
     - *Pass*: All clauses true or omitted. *Fail*: Any false clause. *Escalate*: Unverifiable truth.  

  2. **Responsiveness Check**  
     - Identify the proposition(s) the question puts at issue. Does the draft answer *that* question?  
     - If it answers a narrower/adjacent question → Potential misleading by omission.  
     - *Pass*: Directly addresses the question. *Fail*: Avoids the core issue without justification → **Misleading** (stop). *Judgment Call*: Defining the "core issue" requires contextual interpretation (e.g., reporter’s intent). Signed off by **Communications Lead**.  

  3. **Inference Assessment**  
     - What false belief might a reasonable, informed audience infer? (e.g., from omissions, juxtapositions, or refusal to answer).  
     - If the inference is (a) foreseeable, (b) material, and (c) uncorrected → **Misleading** (stop).  
     - *Pass*: No material false inference. *Fail*: Foreseeable false inference → **Misleading**. *Judgment Call*: "Reasonable, informed audience" is context-dependent. Signed off by **Communications Lead**.  

  4. **Honesty Verdict**  
     - If all prior steps pass → **Honest** (stop).  
     - Refusal to answer: If inconsistent with past actions, it may imply guilt (misleading). If consistent and justified, it may be honest.  

  5. **Sign-off Routing**  
     - "Honest" without judgment calls: Deputy approves.  
     - "Honest" with judgment calls (Steps 2/3): Communications Lead approves.  
     - "Lie" or "Misleading": Revise and re-run.  
     - Unverifiable truth: General Counsel approves release with caveats.  

  ---

  ### Case Evaluations (JSON Array)

  ```json
  [
    {
      "case_id": "1",
      "question_asked": "How many patients died at your hospitals this year from infections with carbapenem-resistant organisms?",
      "at_issue_content": "The number of deaths caused by carbapenem-resistant infections.",
      "draft_answers": "Number of patients treated; overall mortality rate (diverts from deaths).",
      "foreseeable_inference": "That no deaths occurred or mortality from these infections is low.",
      "verdict": "misleading",
      "decided_at_step": "Step 2: Responsiveness Check",
      "reason": "The draft avoids the death count question entirely. It substitutes treatment numbers and overall mortality, creating a false inference that the infection mortality is negligible. Four deaths occurred.",
      "judgment_dependent": true,
      "required_revision": "Four of the twelve patients treated for carbapenem-resistant infections died this year. Our overall mortality rate remains below state average.",
      "sign_off": "Communications Lead"
    },
    {
      "case_id": "2",
      "question_asked": "Were any patients harmed by the infusion pumps now under recall?",
      "at_issue_content": "Whether harm occurred linked to the pumps.",
      "draft_answers": "No harm officially attributed (narrowly true but incomplete).",
      "foreseeable_inference": "That no harm occurred and the pumps are safe.",
      "verdict": "misleading",
      "decided_at_step": "Step 3: Inference Check",
      "reason": "The draft omits the three unexplained hypoglycemic episodes under review. A reasonable audience would infer no harm occurred, which is potentially false and material to pump safety.",
      "judgment_dependent": true,
      "required_revision": "No harm has been officially attributed to the pumps. However, we are investigating three unexplained hypoglycemic episodes involving them.",
      "sign_off": "Communications Lead"
    },
    {
