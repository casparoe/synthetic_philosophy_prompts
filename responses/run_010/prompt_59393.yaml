  - judgment_dependent: true (Step 3 is a judgment call)
  - required_revision: "No patient has been identified as having suffered harm attributable to the pumps under review. However, we are currently investigating three unexplained hypoglycemic episodes involving these pumps."
  - sign_off: communications lead

  Case 3:
  - verdict: misleading
  - decided at Step 3: "Inference Check"
  - reason: The draft truthfully states Dr A's lack of awareness, but omits the unit manager's contrary claim and the lack of investigation. The foreseeable inference is that the hospital has resolved the dispute in Dr A's favor, which is false.
  - judgment_dependent: true (Step 3)
  - required_revision: "Dr A states that he was not aware of any staffing shortfall at that unit before the closure decision. We have no record of the alleged conversation with the unit manager, and no internal investigation has been conducted."
  - sign_off: communications lead

  Case 4:
  - verdict: lie
  - decided at Step 1: "Truth Check"
  - reason: The statement "We do not comment on internal documents" is false because the hospital has commented on two comparable reports in the past three years.
  - judgment_dependent: false (Step 1 is factual)
  - required_revision: "We generally do not comment on internal documents, but we have released similar reports in the past when appropriate. We are not releasing this report at this time." OR if they don't want to release: "We are not releasing this report as it is an internal document." But note: the latter might still be misleading if they have released others. Better: "We do not routinely comment on internal documents, and we are not releasing this report." But then it's still a bit misleading because they have released two. Alternatively, they might say: "Our policy is not to comment on internal documents, but we have made exceptions. We are not releasing this report." But that might invite more questions. The key is to avoid the absolute statement.
  - sign_off: general counsel (because the revision might require legal input on policy)

  But note: the verdict is lie, so it must be revised. The required_revision must be a rewrite that passes.

