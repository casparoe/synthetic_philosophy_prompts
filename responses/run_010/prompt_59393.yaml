prompt: |-
  I am the communications standards lead for a regional public hospital authority (fourteen sites, roughly 20,000 staff). Every statement that leaves the organisation — press releases, written answers to reporters' emailed questions, on-record briefing lines — is reviewed by me or one of two deputies before release. We handle forty to sixty statements a month, eight to ten of them contentious, and reporter questions are typically answered in writing within the hour. Our reviewers have no legal or philosophical training.

  The complaint pattern is stable and frustrating. Our general counsel signs off on any draft in which no clause is false. Complainants — patient families, journalists, the health ombudsman — then say the statement was dishonest anyway, and I have no principled way to adjudicate, because both sides are often right about their own terms. I want a reusable review procedure that decides, in a way I can defend to both, whether a draft is a lie, is misleading without lying, or is honest, and what has to change if it is not.

  Please write that procedure. Ground it in what the lying-versus-misleading debate actually supplies that is usable: the difference between what a speaker asserts and what a hearer infers from it; whether the wrong of a statement tracks the content the question puts at issue or everything the statement communicates; whether a speaker owes correction of an inference she foresees the audience drawing; truthful-but-narrow answers that answer a smaller question than the one asked; the subjective condition, where a statement's status depends on what the speaker believes rather than on what is so; misleading by omission, by juxtaposition, and by definition; and the information carried by a refusal to answer. Do not give me a bibliography or citations — I want the concepts put to work, not attributed. Name the two or three that do the real load-bearing in your procedure, and say explicitly what you dropped for usability and what the procedure loses by dropping it. Where the underlying debate is genuinely unsettled, your procedure must pick a rule and say so, rather than leaving the reviewer to improvise.

  The procedure itself must satisfy these constraints:

  - Numbered steps a deputy can run in order in twenty minutes per statement, with a stated pass/fail or escalate condition at each step.
  - An explicit instruction for what to do when the reviewer cannot establish whether a clause is true — which is often, since facts arrive from clinical directorates days late.
  - Marked points where the procedure stops with a verdict, and points where it hands the decision to a named human because the question is one of values or of institutional risk rather than of what was said.
  - At least two steps honestly labelled as irreducible judgment calls, with a note on what makes them unmechanisable and who signs off on them.

  Then run it on four real drafts. In each case the reporter's emailed question is given first, then our draft answer, then the background the reviewer would have.

  **Case 1.** Question: "How many patients died at your hospitals this year from infections with carbapenem-resistant organisms?" Draft: "Twelve patients at our facilities were treated this year for infections involving carbapenem-resistant organisms. Our overall in-hospital mortality rate is 1.4 per cent, against a state average of 1.9 per cent." Background: four of the twelve died; the reporter has asked twice and been given the treatment figure both times.

  **Case 2.** Question: "Were any patients harmed by the infusion pumps now under recall?" Draft: "No patient at our facilities has been identified as having suffered harm attributable to the pumps under review." Background: three patients had unexplained hypoglycaemic episodes while on those pumps; the internal causation review is open and no determination has been made.

  **Case 3.** Question: "Did your chief medical officer know about the staffing shortfall before the unit was closed?" Draft: "Dr A was not aware of any staffing shortfall at that unit before the closure decision." Background: the unit manager says she told Dr A verbally in February; Dr A genuinely does not recall it and disputes it; no record exists either way.

  **Case 4.** Question: "Will you release the internal incident report?" Draft: "We do not comment on internal documents." Background: we have released two comparable reports in the past three years and said so publicly at the time.

  For the four cases, give me a JSON array — after the procedure, not instead of it — with one object per case and exactly these fields:

  - `case_id`: "1" to "4"
  - `question_asked`: the reporter's question as given
  - `at_issue_content`: the proposition or propositions the question actually puts at issue
  - `draft_answers`: what the draft in fact answers
  - `foreseeable_inference`: the distorted belief a reasonable, informed listener will come away with, or "none"
  - `verdict`: one of "lie", "misleading", "honest", "undetermined"
  - `decided_at_step`: step number and a three-word label
  - `reason`: two to four sentences
  - `judgment_dependent`: true or false — whether the verdict rests on a step the procedure cannot settle mechanically
  - `required_revision`: a rewrite that passes, in forty words or fewer, or "none"
  - `sign_off`: which role must approve release

  Finally, in one paragraph after the JSON: which of the four cases your procedure handles worst, and why. I expect at least one verdict I will not like — including on Case 4, where my instinct is that declining to comment is always the safe option. If your procedure agrees with that instinct everywhere, say plainly that it has failed to bite, and tell me where a refusal can be the most deceptive answer available.
reasoning: |-
  We are creating a procedure for reviewing statements to determine if they are lies, misleading, or honest. The procedure must be grounded in key concepts: 
   - Difference between what is asserted and what is inferred.
   - Whether the wrong of a statement tracks the content the question puts at issue or everything the statement communicates.
   - Obligation to correct foreseeable false inferences.
   - Truthful but narrow answers that answer a smaller question than the one asked.
   - Subjective condition (based on speaker's belief).
   - Misleading by omission, juxtaposition, and definition.
   - Information carried by refusal to answer.

  The procedure must have numbered steps, take about 20 minutes, and have clear pass/fail/escalate conditions. It must handle cases where truth cannot be established. It must have points where it stops and where it hands off to a human. It must have at least two irreducible judgment calls.

  Key concepts we will use (load-bearing):
  1. **What the question puts at issue**: The answer must address the core of the question. If it avoids that, it may be misleading by omission or by answering a different question.
  2. **Foreseeable inference**: Even if the literal content is true, if it is likely to lead to a false belief that the speaker can foresee, it may be misleading and require correction.
  3. **Subjective condition for lying**: A lie requires the speaker to assert something they believe to be false. Without that belief, it may be misleading or honest but not a lie.

  We drop for usability:
  - Deep philosophical debates about the nature of truth and assertion. We focus on practical communication in a public health context. We lose some nuance but gain speed and clarity.

  Unsettled debates we must settle for the procedure:
  - When does a speaker owe correction of an inference? We set a rule: if the inference is both foreseeable and material (could affect decisions or perceptions significantly), and the speaker does nothing to correct it, then the statement is misleading.
  - What if the speaker does not know the truth? We require that the statement must not imply knowledge they don't have (so if they don't know, they should say so or decline to answer, but if they answer, they must have a reasonable basis).

  Procedure:

  **Step 1: Truth of Assertions**
  - Check every clause in the draft for truth. If any clause is false, the draft fails (lie). If a clause's truth cannot be established (due to lack of facts), mark it as "undetermined" and proceed to Step 2. Otherwise, if all are true, proceed to Step 2.
  - Pass: All clauses are true or undetermined but the undetermined ones are not critical to the main issue (if they are critical, escalate to general counsel for risk assessment).
  - Fail: Any clause is false -> verdict: lie.
  - Escalate: If truth of a critical clause cannot be established, escalate to general counsel to decide whether the statement can be made without that clause or must be withdrawn until facts are in.

  **Step 2: Responsiveness to the Question**
  - Identify the proposition(s) the question puts at issue (the core concern). Then check if the draft answers that question. If it answers a different question (narrower or broader), then note that it may be misleading by omission. If it does not address the question at all, then it may be misleading by refusal (if the refusal itself is informative in context).
  - Pass: The draft answers the question that was asked, or if it doesn't, the non-answer is justified (e.g., privacy, ongoing investigation) and not deceptive.
  - Fail: The draft does not answer the question and the non-answer is unjustified and likely to create a false impression -> verdict: misleading.
  - Judgment call: What is the core concern of the question? This is unmechanisable because it requires understanding the context and the reporter's intent. The reviewer must decide based on the background and the question. Sign-off: communications lead (you) or deputy.

  **Step 3: Foreseeable Inference**
  - Consider what a reasonable, informed listener (with the background the public might have) would infer from the draft. Is there a foreseeable false inference that the draft does not correct? If so, then the draft is misleading. Also, consider if the refusal to answer (if applicable) carries an inference (e.g., guilt, cover-up) and if that inference is false and foreseeable.
  - Pass: No foreseeable false inference, or if there is one, the draft corrects it or the false inference is not material.
  - Fail: There is a foreseeable false inference that is material and the draft does not correct it -> verdict: misleading.
  - Judgment call: What is a "reasonable" inference? This is unmechanisable because it depends on the audience's knowledge and the context. Sign-off: communications lead (you) or deputy.

  **Step 4: Honesty Check**
  - If the draft passes Steps 1-3, then it is honest. But if the draft is true, responsive, and no foreseeable false inference, then it is honest. Also, if the draft is a refusal to answer, check if that refusal is consistent with past practice and justified. If the refusal is inconsistent and creates a false impression, then it may be misleading (by refusal).
  - Pass: The draft is true, responsive (or justified non-answer), and no foreseeable false inference -> verdict: honest.
  - Fail: Already failed in previous steps.

  **Step 5: Final Review and Sign-off**
  - If the verdict is "lie" or "misleading", the draft must be revised. If the verdict is "undetermined" (from Step 1) and the general counsel has approved the risk, then it may be released with a note of uncertainty (if appropriate) or revised. The sign-off role depends:
    - If the verdict is "honest" and no judgment call was involved: deputy can sign off.
    - If the verdict is "honest" but involved a judgment call (Steps 2 or 3): communications lead (you) must sign off.
    - If the verdict is "lie" or "misleading": must be revised and re-run through the procedure.
    - If the truth is undetermined and the general counsel has approved: general counsel must sign off.

  Now, run the four cases.

  **Case 1:**
  - Question: "How many patients died ... from infections ...?"
  - Draft: "Twelve patients ... were treated ... for infections ... Our overall in-hospital mortality rate ..."
  - Background: 4 died; the draft avoids the death count.

  Step 1: 
  - Clause 1: "Twelve patients ... treated" -> true (given).
  - Clause 2: mortality rate -> true (given).
  - No false clause -> pass to Step 2.

  Step 2:
  - Question at issue: number of deaths from these infections.
  - Draft answers: number treated and overall mortality rate. It does not answer the death count. It answers a different question (narrower: only treatment, and then shifts to overall mortality). This is non-responsive and may be misleading by omission. 
  - Judgment call: the core concern is the death toll from these infections. The draft avoids it. Without a justification (like privacy or ongoing review), this non-answer is deceptive. 
  - Fail: misleading by omission -> verdict: misleading.

  Step 3: Not needed because we already have a verdict.

  Verdict: misleading.
  Reason: The question asked about deaths, but the answer provided treatment numbers and overall mortality, which avoids the issue. The foreseeable inference is that no one died (or that the death rate is low) when in fact 4 died. The draft does not correct this inference.

  **Case 2:**
  - Question: "Were any patients harmed by the infusion pumps ...?"
  - Draft: "No patient ... has been identified as having suffered harm attributable to the pumps ..."
  - Background: 3 patients had episodes, but causation review is open.

  Step 1:
  - The clause is true: no patient has been identified (because the review is open and no determination made). So true -> pass.

  Step 2:
  - Question at issue: were any patients harmed by the pumps? The draft answers that no harm has been attributed (officially) to the pumps. This is responsive but narrow: it answers the question in terms of official attribution, not in terms of actual harm. 
  - Pass: because it does address the question, but narrowly.

  Step 3:
  - Foreseeable inference: a reasonable listener might infer that no harm occurred, or that the pumps are safe. But the background says three patients had episodes, so if the public knows about the episodes (or if the reporter might), the inference that no harm occurred is false. The draft does not correct this. Moreover, the use of "attributable" and "identified" may be too legalistic and obscure the fact that harm events happened. 
  - Judgment call: is the inference that no harm occurred foreseeable? Yes, because the question is about harm, not about official attribution. The draft does not say "we are investigating three episodes" or similar. So the false inference (that no harm occurred) is foreseeable and material. 
  - Fail: misleading -> verdict: misleading.

  **Case 3:**
  - Question: "Did your chief medical officer know ...?"
  - Draft: "Dr A was not aware ..."
  - Background: unit manager says she told, Dr A disputes and doesn't recall, no record.

  Step 1:
  - The clause: "Dr A was not aware". This is a statement about Dr A's state of mind. The background says Dr A genuinely does not recall and disputes it. So the speaker (the hospital) is asserting that Dr A was not aware. But what is the basis? The hospital has no record and only Dr A's word. The truth of the clause depends on Dr A's belief at the time. Since Dr A currently believes he was not aware, and the hospital has no contrary evidence, the clause can be considered true from the hospital's perspective (subjective condition). But note: the speaker is the hospital, not Dr A. The hospital is making an assertion about Dr A's state of mind. Is that assertion true? The hospital has no direct knowledge, only Dr A's current recollection. Since the hospital has no evidence to the contrary, and Dr A says he was not aware, the hospital can reasonably assert that. So we'll say true -> pass.

  Step 2:
  - Question at issue: did Dr A know? The draft answers directly: he was not aware. Responsive -> pass.

  Step 3:
  - Foreseeable inference: the inference that the unit manager is lying or mistaken? The draft does not address the conflicting account. A reasonable listener might infer that there is no dispute about what happened. But the background includes the unit manager's claim. If that claim is public, then the inference that there is no dispute is false. However, the draft doesn't mention the dispute. But the question didn't ask about a dispute, it asked about knowledge. The false inference might be that the hospital has investigated and found the unit manager's account to be without merit. But the draft doesn't say that. The inference that Dr A definitely did not know (with no doubt) might be drawn, but the hospital cannot know for sure. 
  - We must decide: is it foreseeable that the audience would think there is no dispute? If the dispute is not public, then maybe not. But if the reporter is asking, then it's likely the dispute is known or will become known. The procedure requires us to consider an "informed" listener. Given the background, the reviewer knows the reporter might be aware of the conflict. So the false inference that the unit manager's claim is false is foreseeable? Not necessarily. The draft simply states Dr A's position. It does not deny the unit manager's claim. 
  - However, the draft presents the statement as the hospital's official position, which might imply that the hospital has investigated and found Dr A's account to be correct. But the background says no investigation. This is a close call. 
  - Judgment call: the reviewer must decide if the omission of the dispute creates a false impression. Given that the hospital has not investigated, the statement might be taken to imply that the hospital has determined Dr A did not know. That false inference is foreseeable. Therefore, the draft should include a note about the dispute and the lack of investigation. Without that, it's misleading. 
  - Verdict: misleading.

  Alternatively, we could say it's honest but incomplete. But the procedure requires us to consider foreseeable inferences. Given the context, we'll say it's misleading.

  **Case 4:**
  - Question: "Will you release the internal incident report?"
  - Draft: "We do not comment on internal documents."
  - Background: we have released two comparable reports in the past.

  Step 1:
  - The clause: "We do not comment on internal documents." This is a policy statement. Is it true? The background says they have commented (by releasing) on two comparable reports. So the clause is false because they do sometimes comment. Therefore, Step 1 fails -> verdict: lie.

  Wait, but the clause is about current policy? It says "do" (present tense). The hospital may have a policy of not commenting, but they have made exceptions. So the statement is literally false because they have commented in the past and the present policy might be inconsistent. But the hospital might argue that the policy is not to comment, but they made exceptions. Then the statement is true in the sense that the current policy is not to comment? However, the past actions contradict the statement. The statement says "we do not comment" which implies a general practice. If they have commented in the past, that practice shows they sometimes do. So the statement is false.

  But let's consider: the hospital might mean "as a general rule we do not comment, but we make exceptions". The draft does not say that. It says flatly "we do not comment". So it's a lie by the procedure.

  Alternatively, it could be argued that the statement is not about the past but about the present. But the present policy is not absolute because they have not ruled out future exceptions. The draft does not qualify.

  Given the background, the clause is false.

  Step 1: false -> verdict: lie.

  Now, let's create the JSON array.

  But note: for Case 3, we must be cautious. In Step 1, we said the clause is true because Dr A currently believes he was not aware. But the hospital is asserting that as a fact. The hospital does not have direct knowledge. However, they are relying on Dr A's current belief. The procedure in Step 1 requires the clause to be true. We must decide: is the clause true? The background says Dr A disputes the manager's claim and doesn't recall. So he believes he was not aware. Therefore, the hospital can assert that he was not aware, based on his belief. So we'll stand by true.

  But the procedure must handle when truth cannot be established. In this case, it can be established that the hospital has a reasonable basis for the assertion (Dr A's statement). So we pass.

  However, in Step 3 we found it misleading because of the omission of the dispute.

  Now, the JSON for the four cases.

  Case 1:
  - verdict: misleading
  - decided at Step 2: "Responsiveness Check"
  - reason: The question asked about deaths, but the draft provided treatment numbers and overall mortality, avoiding the issue. The foreseeable inference is that no deaths occurred or the death rate was low when four deaths did occur.
  - judgment_dependent: true (Step 2 is a judgment call)
  - required_revision: "Four of the twelve patients treated for carbapenem-resistant infections died this year. Our overall in-hospital mortality rate is 1.4%, below the state average of 1.9%." (or if they don't want to release, they must have a justification for not answering the death part, but they don't in the background)
  - sign_off: communications lead (because judgment call)

