  ### Weakest Case Handling  
  **Case 3** is handled least robustly by the procedure. The verdict hinges entirely on the judgment call that omitting the unit manager’s claim creates a "foreseeable" false inference of a resolved dispute. In contentious scenarios with conflicting testimony, reviewers might overcorrect by airing internal grievances (risking reputational harm) or undercorrect by accepting subjective assertions at face value. The procedure prioritizes transparency over institutional protection here, which may escalate conflicts unnecessarily if the dispute is not public. This highlights the inherent tension between preventing deception and managing organizational risk in subjective-belief cases.  

  **On Refusal-to-Comment Deception**: The procedure rejects the instinct that refusal is always safe (Case 4). A refusal is most deceptive when it falsely implies a consistent policy (e.g., "We never comment") to mask selective disclosure—which signals guilt or concealment. Here, it became a lie by misrepresenting policy.
