answer: |-
  Here’s a reconstruction of the implicit decision theory behind the EU pesticide rules, the tensions within the practice, and the implications of switching to risk-neutral expected utility. I’ll flag interpretive choices and contested claims throughout.

  ### **1. The Implicit Theory Behind Hazard-Based Cutoffs**
  The practice rests on a hybrid theory, combining elements often conflated under "precaution." No single rationale is universally agreed upon, but these components are defensible interpretations:

  - **Risk-Weighted Expected Utility (RW-EU) with Extreme Concavity**  
    *Interpretation*: The regulator acts *as if* it assigns near-infinite weight to worst-case outcomes (e.g., irreversible harm, intergenerational toxicity) regardless of low probability. This mirrors Buchak’s model with a highly concave risk function.  
    *Contested*: Whether RW-EU applies to *social* decisions is hotly debated. Critics argue it violates **ex ante Pareto**: if every citizen would accept a low-exposure risk (e.g., 1 in 10<sup>9</sup> cancer chance), a regulator using RW-EU to ban it overrides their preferences. Proponents counter that regulators must protect vulnerable subgroups or future generations who lack voice.

  - **Epistemic Threshold Rule**  
    *Interpretation*: For certain harms (e.g., endocrine disruption, genotoxicity), the dose-response curve is deemed **non-linear with no safe threshold** (e.g., "one hit" cancer models). Exposure becomes irrelevant because any dose carries irreducible risk.  
    *Contested*: This relies on specific toxicological models disputed by industry and some scientists. The regulator treats these models as default truth absent *conclusive* proof of threshold existence—a burden-of-proof allocation.

  - **Deontological Constraint**  
    *Interpretation*: Certain harms (e.g., carcinogenicity) are morally impermissible to impose *intentionally*, even probabilistically. Exposure is irrelevant because the *act* of permitting such substances violates a duty to prevent "unacceptable" harm.  
    *Contested*: Economists often reject deontology as "irrational" in cost-benefit terms, but this is normative, not empirical.

  - **Burden of Proof Allocation**  
    *Interpretation*: Hazard categories trigger a **reversal of proof**: the regulator assumes harm unless industry proves negligible risk. For non-hazardous substances, industry must only show exposure < threshold.  
    *Decision-Theoretic Content?* Minimal. This is procedural pragmatism, not a theory of risk.

  **Rival Theories Licensing the Same Rule**:  
  - **Maximin (Rawlsian)**: Avoid worst-case outcomes (e.g., ecosystem collapse) regardless of probability.  
  - **Catastrophe Avoidance**: Special aversion to low-probability, high-impact events (distinct from RW-EU).  
  - **Rights-Based Theories**: E.g., a "right not to be exposed" to certain hazards, overriding utilitarian calculus.

  ---

  ### **2. Internal Consistency: Conflict or Coherence?**
  - **Contradiction?** Yes, at the theoretical level. The exposure-based half uses **risk-neutral expected disutility minimization** (cost-benefit with linear probabilities). The hazard-based half rejects this for specific harms, implying either:  
    - These harms have **infinite disutility** (making exposure irrelevant), or  
    - Probabilities are **non-estimable** (preventing expected-value calculation).  
  - **Coherence Possible?** Only under:  
    - **Epistemic Partitioning**: Claiming hazard categories involve *fundamentally different* risks (non-linear, irreversible, uncertain mechanisms) justifying distinct treatment.  
    - **Pragmatic Rule**: Deeming exposure estimation impractical/impossible for novel hazards (e.g., endocrine disruptors), making hazard a proxy for unquantifiable risk.  
    *Contested*: Critics argue this "partition" is arbitrary (e.g., why mutagenicity but not neurotoxicity?). Defenders cite scientific consensus on mechanisms.

  **Alignment with Other Practices**:  
  - The EU uses risk-neutral expected utility in residue limits/road safety because risks are deemed linear, quantifiable, and consensually tradable.  
  - The US Delaney Clause (color additives) mirrors the hazard-cutoff logic, rejecting risk trade-offs for carcinogens. This is *consistent in principle* but highlights tension: why carcinogens in food dyes but not pesticides?

  ---

  ### **3. Switching to Risk-Neutral Expected Utility: What Changes?**
  Not just "more approvals," but structural shifts:

  | **Aspect**               | **Current Hybrid System**                                  | **Risk-Neutral EU System**                                  |
  |--------------------------|------------------------------------------------------------|-------------------------------------------------------------|
  | **Approval Threshold**   | Hazard categories: ban regardless of exposure.             | All substances: exposure vs. dose-response threshold.       |
  | **Burden of Proof**      | On industry to prove "negligible exposure" for hazards.    | On regulator to show expected harm > benefit for *all* substances. |
  | **Key Procedural Steps** | Hazard classification pivotal; exposure irrelevant for key categories. | Hazard classification informs dose-response, but exposure always decisive. |
  | **Decisions Flipped**    | Low-exposure uses of hazard-category substances (e.g., closed-system industrial). | High-exposure uses with low toxicity (e.g., widely used herbicides with high NOAEL). |
  | **Categories Affected**  | Carcinogens, mutagens, etc., with low-exposure scenarios.  | Substances with high uncertainty but low estimated harm (e.g., suspected endocrine disruptors). |
  | **Uncertainty Handling** | Hazard cutoff as default under uncertainty.                | Quantitative risk assessment with sensitivity analysis; uncertainty may lower confidence but not auto-ban. |

  ---

  ### **4. Settled vs. Contested Claims**
  - **Settled**:  
    - The practice *exists* and is not uniquely European.  
    - It *does* treat exposure asymmetrically based on hazard type.  
    - Risk-neutral EU *would* remove categorical bans and require exposure estimates for all substances.
    
  - **Contested**:  
    - **Rationality of RW-EU**: Some economists (e.g., Arrow, Binmore) argue concave risk-weighting is irrational for individuals; others (Buchak) defend it. *No consensus*.  
    - **Aggregation Problem**: Whether RW-EU can be applied socially *without* violating Pareto is unresolved. Harsanyi’s theorem suggests not, but critiques exist.  
    - **Precautionary Principle (PP)**: Its coherence is debated. Some view it as vacuously permissive ("be cautious"), others as a specific rule like hazard-cutoffs. *Not inherently "irrational,"* but its operationalization is contested.  
    - **Threshold Existence**: Whether "no safe dose" is scientifically valid for all hazard categories (e.g., endocrine disruptors) is disputed.  

  - **Interpretive Choices Made Here**:  
    - Treating the hazard-cutoff as primarily motivated by RW-EU *or* epistemic thresholds (not deontology).  
    - Framing the inconsistency as theoretical but pragmatically resolvable via epistemic arguments.  
    - Assuming risk-neutral EU would *not* ban substances without quantifiable risk—instead using default assumptions (e.g., linear low-dose extrapolation).

  ---

  ### **Conclusion**
  The split system presupposes that certain harms are *qualitatively different*: either incalculable, morally impermissible, or warranting infinite aversion. This clashes with the risk-neutral, exposure-driven half, but regulators justify it via partition (e.g., "for these harms, thresholds don’t exist"). Switching to risk-neutral EU eliminates this partition, moving burden of proof to regulators for all substances and replacing categorical bans with quantified risk-benefit trade-offs. The core tension is whether society accepts that some risks defy aggregation—a question no decision theory can settle.
