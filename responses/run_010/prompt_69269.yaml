  They might try to use node1 and node2 and node3. But the function is not linear.

  ### Conclusion

  This activity should create the two desired failures and illustrate the limitations of both the "it's decodable so it's real" and "it's all just our projection" positions. The debrief should tie these experiences to the real-world interpretability challenges.
