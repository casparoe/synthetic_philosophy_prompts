  Okay, here's the plan, written straight through. Grab coffee; this is dense.

  First, the setup: you'll need 5 volunteers to be the "network". Assign them roles: Input Node (1 person), Hidden Layer (3 people), Output Node (1 person). The remaining 13 are Researchers. The Input Node stands near the Hidden Layer trio; Output Node stands slightly apart. Researchers cluster around a table with index cards and markers. Whiteboard is for them, not you.

  **Network Rules (Write these on index cards, given secretly):**
  - **Input Node:** Gets an input card with two symbols (e.g., "🔴 ★", "🔵 ▲"). Only passes the *color* (🔴 or 🔵) to the first Hidden person. Ignores the shape. Rule card: "Pass ONLY the COLOR (🔴/🔵) to Hidden 1."
  - **Hidden 1:** Receives color from Input. Rule: "If color is 🔵, pass 'X' to Hidden 2. If 🔴, pass 'Y' to Hidden 2." (Written on card).
  - **Hidden 2:** Receives 'X' or 'Y' from Hidden 1. Rule: "If 'X', pass 'α' to Output. If 'Y', pass 'β' to Output." (Card).
  - **Hidden 3:** Has a fixed rule *unconnected* to others: "ALWAYS look at the SHAPE on Input's card. If it's ★, write '★-YES' on a card. If ▲, write '▲-NO'. Pass this directly to Output Node." (Card). *Crucially, Output ignores this.*
  - **Output Node:** Receives either 'α' or 'β' from Hidden 2. Rule: "If 'α', output 'YES!'. If 'β', output 'NO!'." *Ignores anything from Hidden 3.* Write output on card, show researchers.

  **Researcher Rules (Explain aloud):**
  - Goal: Discover what the network "represents" about inputs. Specifically: 1) Does it represent "Star-ness" (★)? 2) What causes the YES/NO output?
  - They can: Submit input cards (design any combo: 🔴/🔵 + ★/▲). Receive the final YES/NO output card.
  - They can ALSO request to see *one* intermediate card per input: EITHER what Hidden 1 passed to Hidden 2 (X/Y) OR what Hidden 3 passed to Output (★-YES/▲-NO). *Not both. Not Hidden 2's output.* They must choose per query.
  - They build "probes": After queries, they propose a linear model. E.g., "★-YES predicts YES!" or "X causes YES!". Write it clearly.
  - **Payoff:** The NETWORK group (who know ground truth) will judge which probe is the "cleanest, simplest story" about what the network represents. Researchers want to win this.

  **Predictable Flow & Engineering the Failures:**
  1. **Researchers probe "Star-ness" (★):** They'll quickly ask to see Hidden 3's outputs. They see: ★ *always* → "★-YES", ▲ *always* → "▲-NO". Perfect correlation! They'll propose: "Network represents ★! ★-YES predicts Output is YES!". *But:* Output ignores Hidden 3. This is Failure 1: Beautifully decodable feature (★-YES), utterly unused. A phantom.
  2. **Researchers probe YES/NO Output:** They'll see Output is YES! for 'α', NO! for 'β'. They'll request Hidden 1's outputs (X/Y) for inputs. They see: 🔵 → X → α → YES!, 🔴 → Y → β → NO!. Clean! They propose: "🔵 causes X causes α causes YES!". *But:* This is incomplete. They missed the *actual* causal path because they couldn't see Hidden 2's rule (α/β depends *only* on X/Y, not color/shape directly). Worse, their probe confabulates: They say "🔵 causes YES!" implying direct rep, but 🔵 is just correlated with X. The network *only* reps X/Y→α/β. **Failure 2:** The *real* causal features (X/Y, α/β) are *minimal and sufficient* but researchers can't decode them as *concepts* (X/Y are arbitrary tokens!). Probes force them into human-aligned stories (color/shape).
  3. **Judgment Pressure:** Researchers, wanting a clean story, will likely champion the ★-YES probe (perfect decodability) or the color probe (simple causal-ish chain). Network judges see both are flawed: ★-YES is unused; color probe misattributes causality. The network folks might even feel uneasy judging—their *own* rules feel alien to these stories. That’s the confabulation bruise.

  **Why This Works & Predictable Problems:**
  - **Problem: Network freelancing.** Patch: Stress *strict rule-following*. Say: "You are a *circuit*. Only do what your card says. No improv." Have a spare student as "Rule Enforcer" to watch Hidden 3 and Output, ensuring they ignore each other.
  - **Problem: Researchers stall.** Patch: After 5 queries, announce: "You have 3 more probes before model submission." Force action.
  - **Problem: They peek/cheat.** Patch: Physically separate Network and Researchers. Only pass specific cards when requested.
  - **What You Can't Replicate:** The **dimensionality/complexity scaling**. Real NNs have billions of interacting neurons; superposition (multiple concepts in one neuron) and polysemanticity emerge from scale. Index cards are toy-like. Admit this afterward: "In real models, features are entangled across thousands of dimensions, making 'clean' directions rare and probes even trickier."

  **Debrief Map (Do this after judgment):**
  1. **Phantom Feature (★-YES):** "Remember when you found ★ perfectly decodable but it did nothing? That’s the 'decodability ≠ use' worry. Like finding a 'gender direction' that doesn’t affect output."
  2. **Arbitrary Tokens (X/Y, α/β):** "The network used minimal, efficient codes—X, α—not human concepts. Your probes couldn’t capture this. That’s superposition-ish: the network compresses reality into non-human symbols."
  3. **Confabulated Story (🔵 → YES!):** "You had *a* story that fit the data, but missed the real mechanism. Philosophers: this is the instrumentalist worry—probes give *an* interpretation, not *the* truth. CS folks: see how ease-of-interpretation != truth?"
  4. **Judgment Pressure:** "Feel how you *wanted* a clean story? Real interpretability has that same pressure. We anthropomorphize the machine."

  **Logistics:**
  - Prep 20+ input cards: Mix 🔴/🔵 and ★/▲ evenly.
  - Network cards: Write rules BIG and clear. Test them yourself first.
  - Start fast: Assign roles, hand out cards, give researchers 1 min to strategize.
  - Time: 15-min probing, 5-min probe building, 5-min judgment, 15-min debrief.

  This should leave both sides bruised. The CS folks see decodability is cheap and can lie; philosophers see the network *does* build internal codes, just not theirs. The friction is the point. Good luck Thursday—may the probes be ever slightly off.
