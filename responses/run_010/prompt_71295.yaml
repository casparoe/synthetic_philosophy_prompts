prompt: |-
  I'm on my city's naming and monuments commission — we handle petitions to rename streets, schools, parks and to take down statues. We've never actually written down a standard, we just vote, and next month's case looks like it's going to split us bad. I want to know what rule our record adds up to before I walk in there.

  Our record so far:

  - We kept the street named for the 1890s mayor who also ran the mill everyone knows was a hellhole. The minutes basically say the conditions were standard for the period, that he was honored for getting the waterworks built and not for the mill, and that no descendents of his workers had ever come to us about it.
  - We renamed the school that honored the superintendent who ran the segregated system. He'd gone further than state law required — he closed the Black schools the statute would have let stand — and the people who got pushed out of those schools, plus their kids, brought the petition themselves. Two members floated a plaque as a compromise and lost 5-2, the majority saying a plaque records something while a name honors it.
  - We kept the park named for the naturalist, even though his field journals describe Indigenous people in ways that are just awful. But the journals were never published in his lifetime, the plant catalog he's honored for has nothing to do with them, and the objections came from a national organization rather than from anybody here. We added an interpretive panel.
  - We took down the statue of the hospital benefactor. Her money came from a patent tonic that her own company's letters show she'd been warned was killing people, and the hospital got built directly out of those profits. Families of the patients still live here and they're the ones who asked.
  - We declined to rename the esplanade named for the shipping magnate who brought in strikebreakers whose men beat pickets. Legal at the time, and he was honored for deeding the waterfront to the city, not for the shipping business. Honestly tho the thing that carried the room was that the name is printed on federal navigation charts.
  - Split 4-3, we kept the courthouse named for the judge who wrote the 1920s opinions upholding racially restrictive covenants and who also built this city's legal aid society. Majority: the covenants were lawful and broadly endorsed back then, legal aid is what he was commemorated for, and no organized group had asked. The three dissenters said that missed the point entirely, without really saying what the point was.

  The new one: a middle school named for a doctor who in the fifties and sixties opened the first community mental-health clinic in the region and is still locally beloved as the guy who brought psychiatry out of the asylum. Under a state sterilization statute that was on the books and that most of his professional colleagues supported, he authorized procedures on dozens of patients without anything you could call consent. The survivors and their children are organized now, they're local, and they filed the petition. The clinic is where the procedures happened, and the per-procedure state payments were a real chunk of what kept the clinic running. The school building is being replaced anyway so rebranding costs us nothing. And one more fact I keep going back and forth on: locally almost no one knows about the sterilizations.

  So — which of our precedents is the closest analog to this one, and what should we vote if we want to be able to look at our own record afterwards? My hunch is we've been running some mix of judge-them-by-their-own-era and did-anyone-actually-harmed-and-still-here-ask-us, but I don't think that's the whole thing and I'm pretty sure those two stop agreeing next month. Lay out the rules our record is compatible with, including ones I haven't thought of, and say which of them the school case actually splits and what each one predicts. If the record genuinely doesn't decide it, tell me what principle we'd be adopting with each possible vote, whether a panel is on the table this time or whether the superintendent vote already foreclosed that, and what a future case would have to look like to finally tell these rules apart.
reasoning: |-
  Okay, let me start by understanding what this user needs. They're part of a commission that handles renaming streets, schools, parks, and removing statues. They've never had a written standard, just voting case by case. Now they have a controversial case coming up about a middle school named after a doctor who performed non-consensual sterilizations. The user wants to identify the implicit rules from past decisions to apply them consistently.

  First, I need to analyze each precedent they provided. Let's list them out:

  1. **1890s Mayor (Kept Street Name):** They kept it because the harm (mill conditions) was "standard for the period," he was honored for waterworks, and no descendants of workers complained. Key factors: historical context, reason for honoring, lack of local descendants' petition.

  2. **Segregation Superintendent (Renamed School):** Renamed because he exceeded legal requirements in segregation, directly affected communities petitioned, and a plaque compromise was rejected. Factors: harm beyond norms, victims petitioning, plaque vs. honor distinction.

  3. **Naturalist (Kept Park Name):** Kept despite racist journals because journals weren't published, he was honored for botany, objections were from a national group (not locals). Added a panel. Factors: unpublished views, reason for honoring, external vs. local objections, mitigation via panel.

  4. **Hospital Benefactor (Statue Removed):** Removed because her wealth came from knowingly harmful products, hospital built with those profits, families of victims petitioned. Factors: direct harm with knowledge, victims' families involved, direct link between harm and what's honored.

  5. **Shipping Magnate (Kept Esplanade Name):** Kept because strikebreaking was legal then, honored for donating waterfront, and federal charts had the name. Factors: legality at the time, reason for honoring, practicality.

  6. **Judge (Kept Courthouse Name):** Kept 4-3; covenants were legal then, honored for legal aid, no organized group petitioned. Dissent didn't clarify. Factors: historical legality, reason for honoring, lack of organized petition.

  Now, the current case: Doctor honored for mental health clinic, performed non-consensual sterilizations under state law, which supported his clinic financially. Survivors and families petitioned, rebranding cost is low, and local awareness is minimal. 

  I need to identify patterns in past decisions. Key recurring factors:

  - **Historical Context:** Was the action considered acceptable or legal at the time? (Mayor, Naturalist, Shipping Magnate, Judge)
  - **Reason for Honoring:** Is the honor based on positive contributions unrelated to the harm? (Mayor, Naturalist, Shipping Magnate, Judge)
  - **Source of Objection:** Are the petitioners directly affected locals or external groups? (Superintendent, Hospital vs. Mayor, Naturalist, Judge)
  - **Mitigation Measures:** Adding panels as compromise (Naturalist), rejecting plaques (Superintendent).
  - **Public Awareness:** Locals unaware (Doctor case).

  The user mentioned two principles: "judge-by-era" and "harmed-and-here-ask-us." But are these sufficient? The segregation case overrides historical context because harm exceeded norms and victims petitioned. The hospital case involved knowledge of harm, which might be a factor. 

  For the doctor case, sterilization was legal and supported then, similar to historical context. But victims are petitioning now. The clinic's funding link ties the honor directly to the harm, like the hospital case. 

  The plaque vs. panel distinction: Superintendent rejected plaque because naming honors, but Naturalist added a panel for context. So, a panel might be an option unless the school renaming precedent rules it out. 

  Possible rules from precedents:

  - **Balanced Legacy Approach:** Honor kept if harm was era-typical, unrelated to reason for honoring, and no local victims object. Else, remove/rename.
  - **Victim-Centric Rule:** Rename/remove only if directly affected victims petition, regardless of historical norms. 
  - **Direct Harm Link:** If the honored thing is directly funded or linked to harm, remove even if historical (Hospital case).

  The doctor case splits these. Historical context supports keeping, but victims petitioning and direct funding link suggest renaming. Also, low rebranding cost and local unawareness might influence. 

  The commission needs to decide if victim petitions override historical context or if the clinic's funding ties the honor to harm. Adopting a panel might be consistent with the Naturalist case but rejected in the Superintendent case. Since the school was renamed without a plaque, a panel might not suffice here. 

  Future cases could involve similar conflicts. For example, someone honored for philanthropy with funds from harmful but legal sources. If victims petition, would they remove? That would clarify if victim petitions and harm linkage take precedence over historical context.
answer: |-
  Based on your commission's record, you've established a nuanced, multi-factor standard – not a single rule, but a balancing test with several recurring principles. The doctor's case *will* split these principles, forcing a choice. Here's the breakdown:

  **I. The Core Principles Extracted from Your Precedents:**

  Your decisions consistently weigh **three primary factors**, with a **fourth emerging decisional element**:

  1.  **Contemporary Context & Severity:**
      *   Was the harmful action *legal and socially acceptable within its own era*? (Kept: Mayor [mill conditions "standard"], Shipping Magnate [strikebreaking legal], Naturalist [views unpublished/private], Judge [covenants legal/broadly endorsed])
      *   Did it *exceed* the norms of its time? (Renamed: Superintendent [went beyond segregation law])
      *   Was there *contemporaneous knowledge of severe harm*? (Removed: Benefactor [knew tonic was killing people])

  2.  **Reason for Commemoration vs. Source of Harm:**
      *   Is the person honored *specifically for the positive contribution*, and is that contribution *distinct* from the source of harm? (Kept: Mayor [waterworks, not mill], Naturalist [botany, not journals], Shipping Magnate [waterfront gift, not shipping], Judge [legal aid, not covenants])
      *   Is the honor *directly linked* to the harmful act or its profits? (Removed: Benefactor [hospital built with tonic profits])

  3.  **Connection to the Affected Community:**
      *   Are the objectors *directly harmed individuals or their immediate descendants* who *still live locally*? (Renamed: Superintendent [victims/kids petitioned], Removed: Benefactor [families of victims petitioned])
      *   Are objections from *external groups* or *without direct lineage to harm*? (Kept: Mayor [no worker descendants petitioned], Naturalist [national group, not locals], Judge [no organized group asked])

  4.  **Mitigation vs. Removal (The "Honor" Distinction):** (Emerging from Superintendent & Naturalist votes)
      *   *Naming/Statues* are interpreted as **honoring**. If the harm is severe enough or directly linked, mitigation (plaques/panels) is *insufficient* (Superintendent vote: 5-2 rejecting plaque).
      *   *Contextual information* (panels) is acceptable *if* the core honor is retained, usually when the harm is seen as separate from the reason for commemoration and less directly impactful *today* on the local community (Naturalist panel added).

  **II. How the Doctor's Case Splits These Principles:**

  *   **Contemporary Context & Severity:** Sterilizations were legal, supported by peers, and seen as "progressive" mental health policy by many at the time (argues for *keeping*, like Mayor, Shipping Magnate, Judge). *However*, the lack of meaningful consent and the inherent violation *might* be argued as exceeding norms even then (like the Superintendent), though this is less clear-cut than his case. *No contemporaneous knowledge of wrongdoing* (like Benefactor) is indicated.
  *   **Reason for Commemoration vs. Source of Harm:** He's honored for founding the community clinic (positive, distinct contribution). **CRITICAL SPLIT POINT:** The *clinic itself* was funded, in significant part, by the state payments for the sterilizations he authorized. This creates a **direct link** between the harm and the very institution he is honored for, much stronger than the Mayor (mill vs. waterworks) and eerily similar to the Benefactor (tonic profits funding the hospital).
  *   **Connection to the Affected Community:** **Directly harmed survivors and their children, who are local, have petitioned.** This mirrors the *strongest* cases for change (Superintendent, Benefactor) and contrasts sharply with the cases kept where no such petitioners came forward (Mayor, Naturalist, Judge, Shipping Magnate).
  *   **Mitigation vs. Removal:** A plaque/panel is theoretically possible. However, the decisive Superintendent vote (5-2 rejecting a plaque) established that naming constitutes *honor*, and a separate panel doesn't negate that honor if the underlying harm is severe and directly connected to the community. Adding a panel *now* would likely be seen as insufficient by petitioners and dissenters, given that precedent and the direct harm link.

  **III. Closest Analog & What Each Principle Predicts:**

  *   **Closest Analog:** The **Hospital Benefactor** case is the strongest parallel due to the **direct funding link** (sterilization payments funding the clinic/hospital) and the **local, directly affected petitioners** (families of victims/survivors & descendants). The Superintendent case is also relevant due to the local victims petitioning and the action exceeding ethical norms (lack of consent), but the *funding link* to the honored institution makes the Benefactor case more compelling.
  *   **How the Principles Split & Predict:**
      *   **Principle 1 (Contemporary Context):** Favors *keeping*. Sterilizations were legal and supported. (Predicts: KEEP)
      *   **Principle 2 (Link Between Harm & Honor):** Favors *renaming*. The clinic he's honored for was directly funded by the harmful acts. (Predicts: RENAME - like Benefactor)
      *   **Principle 3 (Affected Community Petitioners):** *Strongly* favors *renaming*. Local survivors/descendants petitioning mirrors the successful Superintendent and Benefactor petitions. (Predicts: RENAME)
      *   **Principle 4 (Honor vs. Record):** Favors *renaming*. Naming a school is an honor. A panel records but doesn't undo the honor, especially given the direct harm link and local petitioners. The Superintendent precedent rejected this compromise. (Predicts: RENAME)

  **IV. The Vote & What It Adopts:**

  *   **Vote to RENAME:** This adopts a principle where **directly affected local petitioners combined with a strong link between the harmful acts and the source of the honoree's reputation/achievement** override the defense of "it was legal/acceptable at the time." It prioritizes the lived experience of the harmed community and the integrity of the honor (not funding monuments to harm). It follows the Benefactor logic most closely. *Future Test Case:* A figure whose harmful acts (legal in era, no direct victims petitioning) *directly funded* the thing they are honored for (e.g., a library built with profits from exploitative but legal colonial trade).
  *   **Vote to KEEP (with or without a Panel):** This adopts a principle where **contemporary legality/acceptability and the distinction between the reason for honor and the harm** are paramount, even in the face of local victims petitioning, *provided* the harm wasn't contemporaneously known to be wrongful (unlike the Benefactor). Adding a panel would be consistent with the Naturalist case but *inconsistent* with the decisive rejection of this approach in the Superintendent case for naming honors linked to harm affecting petitioners. *Future Test Case:* A figure who performed harmful but legal medical procedures (e.g., lobotomies supported by peers at the time) that were *not* the source of funding for their honored achievement, with local victims petitioning. If kept, it confirms Principle 1 & 2 trump Principle 3. If renamed, it shows Principle 3 (victims petitioning) is becoming dominant even without the funding link.
  *   **A Panel is Technically Possible But Likely Inconsistent:** The Naturalist case shows you can add context *if* retaining the name. However, the Superintendent vote (5-2) explicitly rejected this for a *name*, establishing that naming=honor and a plaque=record. Offering a panel for the doctor *after* rejecting it for the superintendent, especially with local victims petitioning and a direct harm/honor link, would appear inconsistent and dismissive of the petitioners' demand for removal of the *honor*. It would muddy your standard significantly.

  **V. Recommendation for Consistency & Principle:**

  Based on your record, particularly the weight given to **directly affected local petitioners** (Superintendent, Benefactor) and the **direct link between the harm and the funded achievement** (Benefactor), the most consistent vote is to **RENAME** the school.

  *   **Why:** The sterilizations funded the clinic he's honored for (strong Benefactor link), and the survivors/descendants *here and now* are asking for the honor to be removed (strong Superintendent/Benefactor petitioner factor). The "it was legal/supported then" argument (Mayor, Shipping Magnate, Judge) was overridden in the Benefactor case when knowledge of harm existed; here, the *lack of consent*, even if legal, combined with the funding link and local petitioners, creates a similar overriding weight. The Superintendent vote closed the door on plaques as a sufficient remedy for naming honors linked to harm affecting local petitioners.

  A vote to Keep would represent a significant shift, elevating the "judge by era" principle above the "local harmed community asks" principle *even when* the harm directly funded the honoree's achievement. Be prepared for the dissenters in the Judge case to argue this *is* the point they were making: that historical acceptance shouldn't absolve the ongoing harm of honoring someone when the victims are present and objecting, especially when the honor is tainted by the source of its achievement. This case forces that conflict into the open.
