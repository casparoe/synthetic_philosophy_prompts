  Okay, the user is a retired solid-state physicist who's been studying philosophy for three years and is stuck on the debate between classical and intuitionistic logic, specifically the law of excluded middle. They've noticed that both sides agree on a lot: negative translations, equivalent results in arithmetic for decidable statements, and Bishop's constructive analysis rebuilding most of classical analysis. Their probe involves a hypothetical sealed box that outputs correct solutions to Diophantine equations without certificates. Classically, this box gives complete information; constructively, it's useless because it doesn't provide evidence. Yet both sides agree on actual outputs and theorems.

  The user hypothesizes that the disagreement isn't factual or about specific theorems but about what a proof "owes" you—essentially different jobs under the word "proof." They propose alternatives: verbal dispute, substantive about infinite totalities, or that intuitionism isn't a single position. They want the structure of the impasse diagnosed without picking sides, focusing on what intuitionists mean when they say excluded middle is "not proved" vs. "false." The answer should end with one of the specified terms.

  First, I need to address the intuitionist perspective on excluded middle. Brouwer rejected it as a general principle because he believed mathematical objects are mental constructions. For him, truth requires explicit construction or proof. Saying it's "not proved" means there's no justification for assuming it universally; it's not necessarily false in all cases, but unjustified as an axiom. Bishop, while less metaphysical, still emphasized that proofs must provide computational content, so excluded middle isn't admissible for undecidable predicates. The Russian school accepts recursive realizability, differing from Brouwer's idealism. So intuitionism isn't monolithic, but they share a standard: proofs must supply evidence.

  The core disagreement is about the standards of proof. Classical logic sees truth as binary and mind-independent; a proof shows what is true. Intuitionism sees proof as a method to verify and extract evidence. The sealed box example highlights this: classically, the box's correct answer suffices as knowledge; constructively, without a certificate, it's epistemically empty. They agree on decidable statements where evidence can be produced but diverge on undecidables or non-constructive existence proofs.

  The user's probe shows that the dispute isn't about specific theorems but about what constitutes satisfactory proof. The negative translation shows classical proofs can be interpreted constructively by adding negations, but that changes the content. For example, "P or not P" becomes "not not (P or not P)", which is constructively weaker. So the disagreement is about the obligations of proof: classical logic prioritizes truth, intuitionism prioritizes verification.

  The alternatives: it's not merely verbal because the standards lead to different mathematical practices (e.g., rejecting non-constructive proofs). It's substantive regarding infinite totalities when existence isn't decidable. But the deeper issue is the standard of proof itself. The "not one debate" point is valid (Brouwer vs. Bishop vs. Russians), but they share a rejection of classical standards.

  Progress would involve clarifying these standards, perhaps via formal distinctions (e.g., different logics for different purposes) or exploring where constructive methods yield computational benefits. The answer should be "STANDARDS-OF-PROOF" since the core is what proof must provide.
answer: |-
  Your hypothesis captures a key insight: the dispute centers on the *normative role* of proof, specifically what constitutes acceptable evidence. This isn't about conflicting theorems (they often agree on formal derivations for decidable statements) or empirical evidence, but about the epistemic obligations a proof fulfills.

  **Intuitionistic Perspective:**
  1.  **"Not Proved" vs. "False":** When an intuitionist says excluded middle (LEM, `P ∨ ¬P`) is "not proved," they mean it lacks justification *as a universally valid logical principle*. They deny that we have grounds to assert it holds for *every* proposition `P`, especially undecidable ones concerning infinite domains (e.g., "Every even number > 2 is the sum of two primes"). This is an epistemological claim about justification. Saying LEM is "false" is a stronger, ontological claim (rarely made by mainstream constructivists like Bishop), implying a proposition can be neither true nor false – a view more associated with certain interpretations of Brouwer or multi-valued logics. Bishop-style constructivists primarily reject LEM as *unjustified/unreliable*, not as universally false.
  2.  **What Proof Owes:** A proof must provide *verifiable evidence* or *computational content*. For `∃x P(x)`, it must supply a candidate `x` and a proof of `P(x)`; for `A ∨ B`, it must decide which disjunct holds and prove it. The sealed box gives a correct binary answer but provides *zero evidence* for *why* it's correct or *how* to use it further (e.g., to find a solution if it claims one exists). It fails the obligation to supply warrants for existential claims or disjunctions. Knowledge requires constructive access, not just truth.

  **Classical Perspective:**
  The classical logician sees proof as establishing *mind-independent truth*. If the box's output corresponds to the actual state of mathematical reality (a solution exists or doesn't), then it provides complete knowledge about that fact. The obligation of proof is met by truth-determination alone; no further evidence or computation is inherently owed.

  **Structure of the Impasse:**
  The core is **STANDARDS-OF-PROOF**. It's a disagreement about the *epistemic contract* inherent in mathematical assertion:
  *   **Classical:** Proof certifies *truth*. LEM is a reliable tool for discovering this truth, grounded in a realist view of mathematical objects.
  *   **Intuitionistic:** Proof provides *evidence* and *methods*. LEM is unreliable for this task when evidence isn't constructively available, reflecting a view where mathematical truth is tied to our means of verification.

  This explains the points of agreement and disagreement:
  *   **Agreement on Outputs/Theorems:** For decidable statements (like a specific Diophantine equation *if* you compute it), both standards converge – the evidence *is* the truth certificate. Negative translation works because it transforms classical truth into a constructively acceptable statement *about provability* (`¬¬P` instead of `P`), respecting the evidence standard.
  *   **Disagreement on Undecidables/Existence:** Where no finite computation decides `P` (e.g., some universal quantifications over infinite sets), the standards diverge. Classical logic accepts proofs using LEM to conclude `∃x P(x)` without finding `x`; intuitionism rejects this as failing its evidence standard. The sealed box epitomizes this: classically, it reveals truth; constructively, it's an oracle lacking proof-relevance.

  **Progress?**
  Diagnosing it as a standard-of-proof clash suggests fruitful paths:
  1.  **Formal Distinctions:** Sharply delineate *which* logical principles are needed for *which* types of mathematical evidence (e.g., Markov's Principle in Russian constructivism).
  2.  **Change of Question:** Instead of "Which logic is *correct*?", ask "Which logic best serves *this specific purpose*?" (e.g., classical for model theory, intuitionistic for certified computation). Frameworks like Linear Logic explore this explicitly.
  3.  **Better Examples:** Focus on areas where standards *practically* diverge, like extracting algorithms from proofs or independence results forcing non-constructive methods. Concrete mathematical consequences matter more than oracles.

  While intuitionism isn't monolithic (Brouwer's idealism vs. Bishop's pragmatism vs. Russian recursiveness), they share the core standard: proof must supply evidence. Your probe brilliantly isolates this normative difference. The impasse persists because the standards reflect deep, perhaps irreducible, commitments about mathematical epistemology.

  \answer{STANDARDS-OF-PROOF}
