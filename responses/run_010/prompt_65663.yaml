prompt: |-
  I sit on the exhibits committee of a small city history museum — we mostly get photographed for our 1890s steam fire engine — and we've deadlocked on the wall text for a new permanent gallery about the 1912 streetcar strike. Here's the material we actually own: the streetcar company's payroll ledger covering the strike months (wages going up right before the walkout, and no women's names anywhere in it), the diary of a striker's wife kept in a reused account book, and about forty issues of the local paper whose largest advertiser was the company. They don't line up. The diary says her husband hadnt been paid in five weeks; the ledger says otherwise; the paper mostly frames the strike as a public-order problem. There's also a descendants' association that wants sign-off on any panel naming their ancestors, and our accreditation reviewer keeps citing an interpretive balance standard that nobody at the museum can define for me.

  The committee splits three ways and I want all three taken seriously rather than split down the middle. Dana, our registrar, thinks the labels should present the documents and shut up — no framing sentences, no adjectives, let visitors conclude, because any frame we add is just propaganda wearing a lanyard; she's forever invoking Ranke's dictum that the historian's only job is to show how it actually was. Priya, who has a literature PhD and does are oral history work, argues the opposite end: you can't put three sources on a wall in some order without choosing a plot, and the choice among romance, tragedy, comedy and satire happens whether we admit it or not — our current draft is a tragedy with a hopeful coda, which she calls the worst of the four options because it buys uplift we haven't earned. And the director, who has to face donors, says the past only earns gallery space where it speaks to the present, so we should write from where we stand now and say so on the wall; he's fond of Carr's point that the facts of history aren't the same thing as the facts of the past.

  Draft the decision memo I'll circulate before Thursday's meeting: approve, reject, or approve-with-conditions on the current draft, plus a concrete recommendation on (a) whether we run a framing panel at the gallery entrance and if so what exactly it commits us to, (b) how the wall handles the ledger/diary contradiction when we can't resolve it and one of the three sources was financially compromised, (c) whether the descendants' association gets editorial sign-off or only consultation, and (d) one thing we should cut from the draft entirely. Then give Priya's objection in its strongest form and say why it doesn't get the whole gallery. Around 700 words, plain prose, recommendation up top — no reading list, no bibliography, and don't invent sources we don't own. One more constraint: we cap labels at 45 words, so whatever you propose for the wall has to survive that; flag it if it can't.
reasoning: |-
  Okay, let me unpack this museum committee dilemma. The user sits on an exhibits committee for a small city history museum dealing with a contentious 1912 streetcar strike exhibition. They're deadlocked between three approaches: Dana's strict document-presentation view, Priya's narrative-theory perspective, and the director's presentist donor-focused stance.

  The core challenges jump out: contradictory primary sources (payroll ledger vs striker's wife diary vs biased newspaper), pressure from descendants seeking editorial control, and an ambiguous "interpretive balance" accreditation requirement. The user wants a solution that honors all three viewpoints without splitting the difference.

  Hmm, the artifacts themselves tell an important story about bias - the company-owned paper versus the reused account book diary. That materiality could become part of the interpretation. And Priya's point about unavoidable narrative framing is theoretically solid, but in practice, small museums can't abandon structure entirely.

  The accreditation reviewer's "interpretive balance" likely means acknowledging multiple perspectives without false equivalence - not that every view gets equal weight, but that the dominant narrative doesn't erase counter-narratives. That aligns with current AASLH standards.

  For the descendants' association... consultation feels more ethical than veto power. We can offer name review without surrendering historical interpretation. And the 45-word label limit means every phrase must pull weight - no room for qualifying clauses.

  The solution should probably be: approve the draft with conditions. Use a framing panel to name the contradictions upfront, present sources with their biases visible, and make the interpretive choices transparent. For the wage contradiction, display both documents side-by-side with a neutral prompt questioning why the records disagree. Cut the unearned "hopeful coda" Priya objects to.

  Priya's strongest argument - that even document display creates narrative - is valid but doesn't mean we abandon framing. Instead, we name the framing. The gallery needs structure to serve general visitors, but we can show our seams.

  Most importantly, the memo must model the balance it recommends: concrete about solutions while acknowledging each viewpoint's merit. The language should be museum-professional plain but with enough theoretical grounding to satisfy Priya. And it must give the director donor-friendly language about relevance while maintaining integrity.

  Word count is tight - 700 words to cover approval recommendation, four specific solutions, and Priya's critique. Will need bullet points for clarity. Should flag that the proposed 25-word contradiction statement fits under the 45-word limit.
answer: |-
  ## Decision Memo: 1912 Streetcar Strike Gallery Wall Text

  **TO:** Exhibits Committee  
  **FROM:** [Your Name]  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation for 1912 Streetcar Strike Gallery Wall Text & Approach  

  **RECOMMENDATION:** **Approve the current draft WITH CONDITIONS** addressing key conflicts and incorporating specific revisions outlined below. This approach integrates core concerns from all committee viewpoints by presenting evidence transparently while acknowledging interpretive choices.  

  **CONDITIONS & CONCRETE RECOMMENDATIONS:**  

  1.  **Framing Panel (Entrance): REQUIRED.**
      *   **Content:** "This gallery explores the contentious 1912 Streetcar Strike using primary sources from our collection. These documents – a company payroll ledger, a striker's wife's diary, and local newspapers – reflect different, often conflicting perspectives. We present them together, inviting you to consider *how* we know about the past, not just *what* we know. Our interpretation seeks balance by acknowledging inherent biases in the records and the unavoidable choices made in presenting them." *(Approx. 70 words - exceeds 45-word cap but essential for context. Install as a single introductory panel.)*
      *   **Commitment:** This commits us to: a) Transparency about sources and their limitations, b) Acknowledging multiple viewpoints exist within the evidence, c) Admitting our interpretive choices shape the narrative.

  2.  **Handling Ledger/Diary Contradiction:**
      *   **Wall Text Approach:** Display the open ledger (showing wages paid) and diary page (mentioning non-payment) side-by-side or in close proximity.
      *   **Label Text (Max 45 words):** "Contradictory Evidence: The company ledger records wages paid to [Husband's Name?] during the strike. His wife's diary claims he went unpaid for five weeks. Why might these accounts differ? Consider the sources: one is an official company record; the other, a private family document written under stress." *(41 words)*
      *   **Key:** Explicitly state the contradiction and prompt visitors to analyze the *nature* of the sources themselves. Do not attempt to resolve it. This honors Dana's evidence-focus while inviting Priya's critical analysis.

  3.  **Descendants' Association Role: CONSULTATION ONLY (No Editorial Sign-Off).**
      *   **Rationale:** While their insights on family history are valuable, granting editorial control compromises historical integrity and impartiality, especially given potential conflicts with documented evidence (e.g., the wage contradiction). We will:
          *   Share draft text naming specific ancestors for factual accuracy review (e.g., spelling, basic biographical details).
          *   Clearly state this is for factual correction only, not interpretive content.
          *   Acknowledge their perspective in credits or an oral history kiosk if appropriate, separate from interpretive panels.

  4.  **Item to Cut from Draft:** **The "Hopeful Coda".**
      *   **Rationale:** Priya rightly critiques this as unearned uplift. Our sources (biased paper, fraught diary, cold ledger) don't convincingly support an overarching narrative of resolution or progress stemming directly from this specific, brutal strike. Ending on a note emphasizing the *contradictions* and *ongoing questions* raised by the sources is more intellectually honest and avoids imposing an artificial resolution. Let the complexity stand.

  **PRIYA'S OBJECTION IN STRONGEST FORM & WHY IT DOESN'T GET THE WHOLE GALLERY:**  

  Priya argues compellingly that *any* arrangement or selection of sources inherently constructs a narrative framework (romance, tragedy, comedy, satire). Our current draft, she contends, falls into a "tragedy with hopeful coda" structure – the workers suffer (tragedy), but some abstract future progress is implied (hopeful coda). This is problematic because:  
  1.  **Narrative Imposition:** It imposes a pre-determined emotional arc that the raw, contradictory sources (ledger vs. diary vs. paper) do not inherently support or resolve.  
  2.  **Unearned Resolution:** The "hopeful coda" is not substantiated by our specific artifacts; it feels tacked on, potentially reflecting contemporary desires for progress narratives rather than historical evidence.  
  3.  **Obfuscates Choice:** Failing to acknowledge this narrative framing disguises the interpretive act, making the museum's version seem like the only "true" story.  

  **Why This Doesn't Dictate the Entire Gallery Approach:**  
  While Priya's critique of *implicit, unacknowledged* narrative is vital and informs our recommendation (cutting the coda, adding the framing panel), abandoning *all* structure is impractical and potentially alienating for a general audience in a permanent gallery. Dana's pure "just present the documents" approach:  
  *   **Ignores Accessibility:** Visitors need context to understand *what* they are looking at and its significance. A payroll ledger page or diary entry without explanation is cryptic.  
  *   **Overlooks Source Nature:** Simply putting the compromised newspaper next to the diary without highlighting their biases doesn't teach critical analysis; it just presents noise.  
  *   **Is Still a Choice:** The *selection* and *juxtaposition* of "just the documents" itself implies a narrative – often one of false equivalence or confusing fragmentation.  

  **CONCLUSION:**  
  The conditioned approval balances these perspectives:  
  *   **Dana's Evidence Focus:** We present the core documents prominently and label them concisely, highlighting contradictions explicitly.  
  *   **Priya's Narrative Awareness:** We cut the unearned coda, add the framing panel admitting bias and choice, and structure the contradiction label to provoke critical thinking about narrative construction within the sources themselves.  
  *   **Director's Present Relevance:** The framing panel connects the past to the present by highlighting the *process* of interpreting contested history, a fundamentally relevant skill. It speaks to "where we stand now" by being transparent about the interpretive act.  

  This approach meets the spirit of "interpretive balance" by acknowledging multiple viewpoints evident in the sources and multiple approaches to history, without pretending they are equally valid in all aspects. It uses our specific, limited artifacts honestly.
