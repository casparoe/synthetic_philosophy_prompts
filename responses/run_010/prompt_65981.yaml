answer: |-
  Here is a procedure designed for your committee, followed by its application to your three draft sentences. The procedure focuses on empirical grounding and mitigating overconfidence.

  **The Procedure: Veracity Gates for Interpretation Panels**

  1.  **Tag Claims with Hawkes's Ladder:**
      *   Define each inferential claim in the draft against Hawkes's rungs:
          *   **R1: Production Technique** (How was it made? Material, tool marks).
          *   **R2: Subsistence/Economy** (How was it used for survival/trade? Wear patterns, residues, quantity, location).
          *   **R3: Social/Political Institutions** (Social roles, hierarchy? Context, association, scale, exclusivity).
          *   **R4: Belief/Ritual** (Ideas, cosmology, religion? Symbolism, non-utilitarian context, repetition).
      *   **Evidence Bearing:**
          *   *Material evidence* (objects, features, ecofacts) directly supports R1 & R2.
          *   *Contextual evidence* (association, location, modification) *can* support R3 & R4, but requires stronger justification.
          *   *Patterns* (repetition across sites/contexts) *can* support R3 & R4.
      *   **Multi-Rung Claims:** If a single sentence makes claims spanning two rungs (e.g., R1+R4), *split it into separate claims* for assessment. Each distinct inference must be evaluated individually.

  2.  **Demand Disconfirmation:**
      *   For each claim proposed as fact (especially R3/R4), the reviewer must articulate a **specific, plausible future find, sample, or analysis that could materially weaken or disprove it**. This is the claim's "disconfirmation slot."
      *   **If No Disconfirmation Can Be Named:** The claim *cannot* be stated as fact. It falls to a lower verdict category (see Step 5). This indicates the claim is insulated from empirical challenge, likely being an assumption or over-interpretation.

  3.  **Assess Underdetermination Type:**
      *   **Type 1 (Resolvable):** Rival explanations exist, but specific future evidence *could* discriminate between them (e.g., residue analysis on an object to distinguish ritual use from utilitarian). Requires presenting plausible rivals.
      *   **Type 2 (Empirically Equivalent):** Rival explanations exist, but *no conceivable evidence* could distinguish them based on the archaeological record (e.g., attributing identical motivations to different individuals for the same action). Requires neutral phrasing presenting possibilities.
      *   **Test:** Ask: "Is there *any* conceivable (even if currently impractical) analysis or discovery that could significantly favour one rival over another?" If Yes: Type 1. If No: Type 2.

  4.  **Identify & Block Narrative Traps:**
      *   **The Trap:** "This narrative explains *all* the observed features, therefore it is likely true."
      *   **The Test:** For any narrative claim (especially R3/R4), ask: "Does this narrative *depend* on assuming auxiliary hypotheses (about context, meaning, motivation) that *could be adjusted* to protect it if contradictory evidence *were* found?" If Yes, and especially if the disconfirmation slot is weak/nonexistent (Step 2), the narrative is insulated. Downgrade the verdict.

  5.  **Evaluate Ethnographic Comparison:**
      *   **Admit as Evidence ONLY if:** The comparison is to a specific, documented practice from a society demonstrably linked (chronologically, geographically, culturally via shared material traits) to the site, *and* the material signature of that practice (objects, features, context) *matches* the evidence at the site. Otherwise, treat it only as **illustration** (e.g., "similar to practices seen elsewhere...").

  6.  **Determine Verdict & Wording:**
      *   Based on Steps 1-5, assign one verdict per distinct claim:
          *   **State as Fact:** Requires: Claim grounded in R1/R2 evidence *or* exceptionally strong contextual/pattern evidence for R3; Clear disconfirmation slot exists; Low/no credible rivals (Type 1 resolved, or Type 2 absent); Passes narrative trap test. *Wording:* Direct, affirmative statement.
          *   **Present with Named Rivals:** Requires: Credible Type 1 underdetermination exists; Disconfirmation slot exists *for the category of claim*; Evidence supports plausibility of rivals. *Wording:* "Possible interpretations include X, Y, or Z" OR "This may represent X; other possibilities are Y or Z." (Name 1-3 key rivals).
          *   **Return for Test:** Triggered by: Claim lacks a plausible disconfirmation slot (Step 2); OR Narrative trap identified with weak grounding (Step 4); OR Claim relies entirely on an ethnographic comparison admitted only as illustration. *Action:* Specify the test needed (e.g., "Specify disconfirmation for 'worshipped'", "Clarify link to documented ritual practice", "Provide analysis to distinguish ritual from discard").
          *   **Omit:** Claim is purely speculative (e.g., unsupported leap to R4), lacks material basis, or Type 2 underdetermination makes any statement meaningless noise. *Wording:* Omit or replace with observable fact (e.g., "figurines were found" instead of "worshipped").

  7.  **Acknowledge & Record Judgement Calls:**
      *   **Explicit Gates:** Assessing the *plausibility* of a disconfirmation slot (Step 2), determining if rivals are *credible* (Step 3), and judging *sufficient* evidence strength for R3/R4 claims (Step 6) involve **risk appetite/taste** disguised as procedure.
      *   **Recording Overrides:** If the committee consciously overrides a procedural recommendation (e.g., stating a fact despite weak disconfirmation slot due to strong consensus), the minutes **must** record: 1) The procedural step overridden; 2) The specific justification for overriding it; 3) The names of members supporting the override. This creates accountability.

  ---

  **Application to Draft Sentences (45-min Review Simulated):**

  **(a) Bronze Objects: "offered to the gods of the wetland"**
  *   **Tag:** R4 (Belief/Ritual).
  *   **Disconfirmation Slot:** Finding the objects in a workshop context with tools, not a bog; evidence of melting/casting on site; associated mundane items suggesting scrap. *Plausible slot exists.*
  *   **Underdetermination:** Type 1 (Rivals: Founder's scrap, concealed wealth). Specific evidence could discriminate: Residues indicating votive substances vs. none; tool marks consistent with ritual breakage vs. utilitarian recycling; association with other ritual deposits vs. isolated cache.
  *   **Narrative Trap Test:** The "offering" narrative accommodates bent/broken in bog. BUT, auxiliary assumptions (intent, belief) *could* be adjusted (e.g., "broken accidentally during concealment"). Trap risk: Medium. Requires rivals.
  *   **Ethnographic Comparison:** N/A here.
  *   **Verdict:** **Present with Named Rivals.**
  *   **Revised Wording (65 words):** "Twenty-three deliberately damaged bronze objects were deposited in this wetland. Possible explanations include: votive offerings to deities; a metalworker's scrap cache hidden from raiders; or wealth buried for safekeeping. The ritual interpretation aligns with similar deposits found elsewhere in the region."

  **(b) Tomb Alignment: "built to mark the return of the sun"**
  *   **Tag:** R4 (Belief/Ritual) - *Asserts intentionality and meaning.*
  *   **Disconfirmation Slot:** Finding unambiguous contemporary symbolic art depicting non-solar cosmology; statistically demonstrating the alignment is no better than random chance against all plausible local landmarks/slopes. *Plausible slot exists.*
  *   **Underdetermination:** Type 1 (Rivals: Post-facto selection, slope/landmark dictate). Evidence could discriminate: Detailed survey showing alignment *required* significant extra effort vs. following easiest path; presence of other solar markers (e.g., light-box effects); absence of equally strong landmark/slope alignments.
  *   **Narrative Trap Test:** The solstice narrative accommodates the alignment. BUT, auxiliary assumptions (intent, meaning) *could* be adjusted (e.g., "chosen for practical reasons, later imbued with meaning"). Trap risk: Medium. Requires care.
  *   **Ethnographic Comparison:** N/A as direct evidence here.
  *   **Verdict:** **State as Fact** for alignment; **Omit/Present as Possibility** for intent/meaning.
  *   **Revised Wording (60 words):** "This Neolithic chambered tomb is precisely aligned towards the point on the horizon where the sun rises at the winter solstice. This orientation may have held significant meaning for the builders, possibly marking the sun's seasonal return. The alignment could also relate to the local topography or prominent landmarks visible from this location." (States observable fact, hedges interpretation).

  **(c) Figurines: "a mother goddess worshipped in the home"**
  *   **Tag:** R4 (Belief/Ritual) - *Asserts deity status, specific domain (motherhood), and ritual action (worship).*
  *   **Disconfirmation Slot:** *Extremely difficult.* What conceivable find disproves "worshipped"? Finding them only in middens suggests discard, not veneration? But "worship" could be redefined. Finding exclusively male figurines? But "mother goddess" could still be one aspect. Finding them with toys? Could be "teaching tools for worship". **No robust disconfirmation slot identified.** This is insulated.
  *   **Underdetermination:** Type 1 rivals exist (e.g., toys, teaching aids, ancestor figures, decoration, good luck charms). BUT, the core assertion "worshipped" faces Type 2 issues ("worship" vs. "veneration" vs. "respect" - empirically equivalent nuances).
  *   **Narrative Trap Test:** **High Risk.** The "mother goddess worshipped" narrative accommodates domestic context, female form. Auxiliary assumptions are infinitely flexible (any context = shrine; any female form = mother/goddess; any find location = worship). Explains everything, proves nothing.
  *   **Ethnographic Comparison:** Likely used as *illustration* (e.g., "like Neolithic Anatolia"). To be *evidence*, requires demonstration of specific cultural link and matching material signature beyond "female figurine in house". Not met here.
  *   **Verdict:** **Return for Test** (Specify disconfirmation slot for "worshipped" & evidence for "goddess" status) **OR Omit** the interpretive leap. Cannot state as fact or even present rivals without addressing the insulation.
  *   **Revised Wording (Observable Facts Only, 50 words):** "Fragments of small, fired-clay figurines, often depicting human forms, were found scattered on the floors of houses. While their purpose remains unknown, they offer a tangible connection to the symbolic world of the people who lived here." (Focuses on R1: fired clay, human form; location. Omits R4 claim entirely as unsupported and insulated).

  **Concluding Note:** The procedure obliges the committee to confront insulation and lack of disconfirmation, particularly in (c). While the revised wording for (c) avoids the trap, it sacrifices a compelling narrative. The choice to override must be explicitly recorded (Gate 7), acknowledging the tension between public appeal and empirical rigor. This tool prioritizes guarding against confident error, accepting that sometimes "we don't know" is the most honest interpretation.
