prompt: |-
  I am the registrar at a mid-sized museum of modern and contemporary art, and I have just spent a fortnite reconciling our accession register against our insurance schedule and the customs declarations for our outgoing loans. The exercise has left me with a puzzle that museum vocabulary cannot resolve, and I should like a philosophical reconstruction of what our paperwork actually commits us to. Here are the practices, stated as plainly as I can.

  First, instruction-based works. When we acquire a wall drawing of the kind associated with Sol LeWitt, what we buy, and what the accession number attaches to, is a signed certificate together with a diagram and a set of instructions. The wall itself is painted by hired drafters working from specifications supplied by the artist's estate, photographed for the record, and painted over at the end of the run. We open no condition report for the wall; we carry the work at its full purchase price on the insurance schedule in years when no instance of it is installed anywhere; and the estate may authorize further instances, each of which requires a newly countersigned certificate. Nobody in this building thinks we own a copy of something.

  Second, attribution. Our catalogue grades run autograph, studio of, circle of, follower of, after. The market and our own acquisitions committee treat those grades as tracking something real: we will pay a very large sum for a panel in which the master's hand is discernible in a fraction of the surface, and almost nothing for a workshop product that no visitor could tell from it. Provenance research asks who touched the object, not what the object looks like.

  Third, customs. The tariff headings that admit works of art duty-free are defined by medium and by hand — paintings and drawings executed entirely by hand, original sculpture in any material, photographs printed by or under the artist's supervision and numbered within a limited edition — and anything else travels under the heading for its material. So a fabricated steel piece crosses a border as an article of base metal unless the crate is accompanied by a signed certificate and a letter from a curator. The statute in force during the most famous such dispute required, for a sculpture to enter free of duty, that it be original, that it be the work of a professional sculptor, and that it serve no practical purpose: in effect a legislative definition of arthood. When Brâncuși's *Bird in Space* reached New York harbor in 1926, customs assessed the polished bronze as a manufactured metal object at forty percent of its value and released the crates on bond under the heading for kitchen utensils and hospital supplies; only in 1928 did the Customs Court hold it to be an original sculpture and duty-free. The appraiser who defended the original classification, reporting the opinions solicited for the government, quoted one of them as saying, "If that's art, hereafter I'm a bricklayer."

  Fourth, conservation. In the paintings lab every decision about cleaning, varnish removal, and inpainting is argued in terms of that canvas's own history and its maker's materials, on the assumption that the work simply is this physical object. Two floors up, faced with an installation of perishable components or a faded painted wall, we authorize re-fabrication from the artist's specifications and record the result in the register as the same work, not as a replica.

  Fifth, deaccessioning. Our accrediting bodies permit the proceeds of a sale to be spent only on acquiring other works, so the collection functions as a closed economy in which one holding is exchanged for another; we will sell a work we have come to think mediocre and buy one we think better. Yet we would never sell the certificate of an instruction-based work while an instance of it is on view, and we continue to list works whose only instance has been destroyed.

  What theory of what an artwork is does this cluster presuppose? I would like the reconstruction to do the following. Identify which of the five practices commits us to treating a work as something capable of indefinitely many instances and able to outlive all of them, and which commits us to treating a work as a particular physical object essentially tied to the hand that made it; then say whether those commitments are genuinely contradictory or whether a single account can license both, and what that account must say about the ontological status of the certificate. Say which rival accounts the practice rules out — for instance, an account on which something is art in virtue of the experience it is designed to afford, one on which arthood is conferred by the artworld, one on which a work is identical with a particular act of making — distinguishing for each whether our practice is merely unfriendly to it or flatly incompatible with it. Be scrupulous about separating what the paperwork strictly presupposes from what it merely sits comfortably with, and about separating philosophical commitment from administrative motive: several of the things I have described, notably carrying an uninstalled work at full insured value and writing the certificate as the accessioned object, may be driven by indemnity, liability, and tax treatment rather than by any view about the nature of art, so tell me how to tell those cases apart and which of the five cannot be explained away that way. Finally, suppose the museum were persuaded to adopt a rival view — that a work is essentially the event or experience it generates, or that arthood is something we confer rather than discover. What would have to change in the register, the insurance schedule, the conservation mandate, the loan and customs paperwork, and the deaccession policy, and which single change would be hardest to make and why?
reasoning: |-
  Okay, the user is a museum registrar dealing with complex ontological questions arising from their administrative practices. They've presented five distinct museum practices that seem to point in different directions about what constitutes an artwork. 

  First, I need to unpack each practice carefully. The Sol LeWitt example suggests artworks can exist as instructions separate from physical instantiation. But then the attribution system emphasizes the artist's physical hand as crucial to value. Customs law requires physical criteria for arthood, while conservation treats physical objects as primary yet allows complete replacement of materials. Deaccessioning treats artworks as interchangeable commodities yet preserves certificates after physical destruction.

  Hmm... the core tension is between work-as-type (for conceptual pieces) and work-as-token (for traditional art). The certificate seems to be the linchpin - it's what gets accessioned, insured, and preserved. But is it the work itself or a document representing the work? 

  The user wants to know if these practices are fundamentally contradictory. I think they're not - just tracking different aspects of art ontology. The certificate functions as the "abstract object" that can manifest physically in multiple ways. For traditional art, the physical object is the primary instantiation. 

  For rival theories: Experience-based theories fail because we insure uninstalled works. Institutional theories can't explain why customs requires physical criteria. Process theories contradict re-fabrication practices. 

  Practical implications are fascinating - if they adopted an experience theory, they couldn't insure uninstalled works. If they adopted institutionalism, customs classifications would become arbitrary. The hardest change would be insurance valuation since it's tied to market logic.

  The user is clearly sophisticated - they've spotted philosophical tensions in daily paperwork. They need this analyzed rigorously because it affects real decisions about loans, insurance, conservation. I should be careful to separate administrative necessities from genuine ontological commitments. For example, insuring certificates at full value might be practical, but choosing to accession them rather than installations reflects a philosophical stance.

  The customs example is particularly telling - it shows how legal systems struggle with these questions too. That appraiser's quip reveals the cultural tension around non-traditional artforms. 

  I'll structure this by: 1) resolving the type/token duality through the certificate's role 2) systematically eliminating rival theories 3) simulating practical consequences of ontology shifts. The insurance question will be key for distinguishing philosophical from practical commitments.
answer: |-
  Your museum's practices reveal a sophisticated, pluralistic ontology of art that navigates between physical particularity and abstract ideality. The core tension is resolved through institutional certification mediating between the work's conceptual identity and its physical manifestations. Here's the philosophical reconstruction:

  ### Core Commitments & Resolution of Tension
  1. **Work as Abstract Type** (Practices 1 & 4):  
     LeWitt-style certificates and re-fabricated installations commit you to treating certain works as *abstract types* instantiable in multiple tokens. The certificate is the **authorized schema** – the ontological anchor that survives destruction of instances and enables new instantiations.  
     *Ontological status of certificate*: It is the *work-defining artifact*, not merely a document. It embodies the artist's intentional structure and grants institutional authority for instantiations.

  2. **Work as Historic Particular** (Practices 2 & 3):  
     Attribution grading and customs criteria commit you to **material trace authenticity**. Value derives from direct physical connection to the artist's hand (attribution) or fulfillment of legislative criteria for "original" creation (customs).

  3. **Resolution**: A **dual-aspect theory** licenses both:  
     - The artwork is an *institutionally recognized intentional kind* (certificate as locus of artist's sanction)  
     - *Physical instantiations* are privileged when they materially embody artistic labor (attribution) or satisfy legal/experiential criteria of originality (customs).  
     No contradiction: Physicality matters *when it bears historic/causal chains to artistic creation*. For instruction-based works, this chain runs through the certificate, not the wall.

  ### Rival Accounts Ruled Out
  | **Theory**                    | **Compatibility** | **Why Excluded**                                                                 |
  |-------------------------------|-------------------|----------------------------------------------------------------------------------|
  | **Experientialism** (Art = designed experience) | Incompatible | Insuring uninstalled works at full value presupposes art exists independently of experience. Conservation prioritizes material history over viewer effect. |
  | **Institutionalism** (Art = artworld conferral) | Unfriendly | Customs requires *objective material properties* (hand-execution). Attribution research seeks pre-institutional facts about creation. |
  | **Process Essentialism** (Art = specific act of making) | Incompatible | Re-fabrication replaces all physical traces of the original act yet is recorded as the *same work*. LeWitt drafters aren't creating new works. |
  | **Formalism** (Art = visual properties) | Incompatible | Attribution values "master's hand" invisible to viewers. Two identical-looking panels have radically different valuations. |

  ### Administrative Motives vs. Ontological Commitments
  - **Explained by pragmatics**:  
    - Insuring uninstalled LeWitt at full value: Indemnity necessity, *but* choosing to accession the certificate (not the first installation) reflects ontological choice.  
    - Customs paperwork: Complying with legislation, *yet* curator letters asserting "sculpture" status accept legislative criteria as philosophically significant.  

  - **Inexplicable by pragmatics** (reveal core commitments):  
    1. **Attribution hierarchy**: Market valuation based on microscopic material traces cannot be reduced to tax/insurance motives.  
    2. **Recording re-fabrications as identical works**: Material replacement contradicts conservation norms unless work-identity is non-physical.  
    3. **Retaining certificates after instance destruction**: Asserts work's survival beyond physical annihilation.  

  ### Consequences of Adopting Rival Views
  Suppose the museum adopted:

  **A. Experientialism** (Art = event/experience):  
    - **Register**: Accession event documentation (video, scores) not objects.  
    - **Insurance**: Could only insure during installations. Uninstalled "works" have $0 value.  
    - **Conservation**: Focus on re-creating experiences, not material fidelity.  
    - **Customs**: All art imports become duty-free (no material criteria).  
    - **Deaccession**: Proceeds could fund experiences (performances, education) not objects.  
    - *Hardest change*: Insurance – underwriters rely on stable valuations; devaluing collections between shows is financially catastrophic.

  **B. Institutionalism** (Arthood conferred, not discovered):  
    - **Attribution**: "Studio of" grades become arbitrary; market value collapses without "authentic" traces.  
    - **Customs**: Reliance on curator letters alone makes duty disputes unwinnable (no objective criteria).  
    - **Deaccession**: Selling "mediocre" works meaningless – value is conferred, not discovered.  
    - *Hardest change*: Customs compliance – without material criteria, every import becomes a negotiation.

  ### Philosophical Conclusion
  Your practices presuppose a **certificate-anchored institutional realism**:  
  - Artworks are **recognized abstracta** sustained by institutional frameworks (certificates, registers).  
  - Physical instances derive significance from **sanctioned embodiment** of the schema (LeWitt) or **direct material witness** to artistic labor (attribution).  
  - Customs law inadvertently affirms **material production** as a socially salient criterion for arthood.  

  This hybrid ontology allows museums to steward both conceptual works (prioritizing idea+authorization) and traditional objects (prioritizing material trace), using paperwork to mediate between the abstract and concrete. The certificate's status as the accessioned object for instruction-based works is the keystone – it transforms administrative convenience into an ontological claim.
