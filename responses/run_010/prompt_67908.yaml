  Alternative: The student's argument on Carr might be defensible? Let's check: Carr does say that each generation rewrites history and that objectivity is the consensus of historians. But he also believes that history is progressive and that we can have a more objective view as we move forward. So it's a nuanced position. The student's claim that Carr is a relativist is too strong and ignores Carr's own rejection of relativism.

  Therefore, I think the overall mark should be 68 (upper second). But let's see the classification: 68 is upper second.

  Dimensions scores (for feedback):

  - Ranke: 17
