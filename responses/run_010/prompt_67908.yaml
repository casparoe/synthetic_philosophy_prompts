  2. Location: "White says the historian makes them [the facts]"
     Problem: White distinguishes between the events (which are given) and the facts (which are constituted by narrative). He does not claim the historian makes the events, but that the historian constructs the narrative meaning. The student's phrasing suggests a more radical constructivism than White holds.
     Type: overstatement
     Severity: moderate (it's a nuance but important)
     Confidence: medium (White's position is complex; he does say the facts are made in the sense of being constituted, but the events are not made). 
     Better version: "White argues that the historian constructs the narrative form and meaning of the facts, thereby making the historical account a literary artifact."

  Credit where due:
