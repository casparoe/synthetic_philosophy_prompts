prompt: |-
  I've gotten weirdly obsessed with the voting paradox after an argument with my roommate, and I want to find out what principle, if any, is hiding behind my own gut calls. Context: I sit on my condo associations board, nine of us, and last month a vote came out 4-4 with one abstention — the guy who abstained said he just "didn't have a view" — and I was furious at him in a way I have never once been about a national election. So here are my verdicts and I want you to tell me what they add up to, or whether they add up to nothing.

  (1) Voting in a presidential election in a state where it's close: not irrational, mildly praiseworthy, and I'd feel a bit ashamed skipping it. (2) Voting in my town's council race, 30,000 voters, my guy wins by 4,000: totally routine, nothing to be proud of, no shame at all in skipping. (3) Somebody who drives three hours through a blizzard to cast a ballot in a national election that's near-certain to go one way anyway: admirable. (4) Somebody who drives three hours through a blizzard to vote in the town council race, where by my back-of-envelope they're maybe ten thousand times more likely to be decisive: kind of sad, like over-investment in a hobby. Same cost, wildly better odds of actually mattering, opposite verdict — I know thats incoherent, but its what I feel. (5) The condo board abstainer: genuinely blameworthy, worse than the national-election skipper, even though the stakes are a pool resurfacing budget. (6) Voting in a landslide for the side that was always going to win: not pointless exactly, more like signing a guestbook — but I wouldnt blame anyone who stayed home, whereas I do blame (5). (7) The purely uninformed vote, cast only to dodge a penalty — Australia fines you for not turning up but from what I understand doesn't care whether your ballot is a real choice or a scribble: I think that vote is worse than no vote, and also think it's none of the state's business to prevent. (8) An expat who's lived abroad twenty years, can still vote by mail, has no idea what's going on and no stake in the outcome: should abstain, even though their odds of being decisive are exactly the same as mine at home. (9) The three-hour blizzard drive is admirable and the two-minute mail ballot isn't, so my admiration seems to be tracking cost rather than causal effect, which I find embarrassing.

  So: is there one principle behind all of this, or two incompatible ones fighting? A friend who does political science said the standard repair is to bolt a "duty" term onto the expected-value formula so it always pays to vote — but I've noticed that a duty term would be the same number in every single election, so I don't see how it could generate the fact that I feel so differently about (3) and (4), or why (5) and (8) come out the way they do. Give me the principle, or the two or three real candidates, state each one precisely enough that I could apply it to a new case, and say which item in my list is doing the work for each clause of it. Then tell me what your favorite one predicts about two cases I havent listed: someone who abstains on purpose because both candidates are awful, and someone voting in a party primary with 6% turnout where they're 100x more likely to be decisive but where I honestly feel no extra pull. And be straight with me about which of my verdicts your principle has to overturn — I'd rather lose a verdict than keep something baroque.

  Last line, exactly this format: Verdict: <short name of the principle you'd adopt> | sacrifice: <numbers of the verdicts it can't save, or none>
reasoning: |-
  Okay, let me try to unpack this user's dilemma. They're clearly frustrated with their own inconsistent reactions to different voting scenarios, especially after that condo board abstention incident. The emotional charge around that 4-4 tie with one abstainer stands out—it's personal, immediate stakes versus abstract national elections. 

  Hmm... their list reveals fascinating contradictions. They admire effort (blizzard voters) but dismiss high-impact local votes as "sad." They condemn uninformed votes but excuse national election skippers. The condo abstainer gets more scorn than presidential non-voters despite lower stakes. What ties this together?

  I notice three threads in their reactions: proximity (personal vs. distant), effort/cost signaling, and role-based duty. The condo vote matters because they're directly affected and the abstainer violated an implied contract among decision-makers. Whereas national voting is more about symbolic participation—effort there signals civic virtue regardless of impact. 

  The Australian scribble vote is telling: they hate performative compliance without engagement. And the expat case confirms it's not about odds but about authentic connection to the outcome. 

  For repair strategies: "duty" alone fails because they need variable weight based on context. A two-axis model (duty strength + personal stake) might work. Condo board? High duty, high stake. National landslide? Low duty, low stake—but effort there still admirable as virtue signaling. 

  Their political science friend's fixed "duty term" critique is spot-on. My model must explain why condo duty feels heavier than presidential duty. Perhaps duty scales with how much the voter's welfare is directly tied to the outcome? 

  Testing against their unlisted cases: 
  - Abstaining on principle (both candidates awful) could be honorable under "authentic engagement" 
  - Low-turnout primary might still not compel them because stakes feel abstract 

  Sacrifices: verdict 4 (high-impact local vote seen as sad) must go—my principle would call that highly dutiful. Also verdict 2 (casual local vote skipping) might need upgrading from "no shame" to "mild duty."
answer: |-
  Your verdicts reveal a coherent principle that prioritizes **expressive duty over causal impact**, with duty intensity scaling to **stakeholder proximity** and **effort as credibility signal**. Here's the distilled principle and its operation:

  ---

  ### **The Principle: Contextual Expressive Duty**
  **"Voting is a performative duty to signal engagement with a collective decision, where the moral weight depends on:  
  (1) *Directness of stake* (how immediately outcomes affect you/your group),  
  (2) *Role obligation* (explicit/implicit responsibility to participate), and  
  (3) *Costliness as sincerity proof* (effort demonstrating genuine commitment, not outcome probability)."**

  ---

  ### **How It Explains Your Verdicts:**
  | **Verdict** | **Driving Clause** | **Explanation** |
  |-------------|-------------------|----------------|
  | (1) Close presidential vote | (1) Moderate stake + (3) Low cost | Symbolic duty to democracy; skipping feels neglectful but stake is diffuse. |
  | (2) Town council skip | (1) Low stake | Minimal personal impact → no duty breach. Routine effort suffices for those who care. |
  | (3) Blizzard for safe national | (3) Costliness | High effort proves civic virtue, admirable despite futility. |
  | (4) Blizzard for high-odds local | (1) Low stake | Effort disproportionate to stakes ("hobby" = lacks gravitas). Stake isn't urgent enough to justify heroics. |
  | (5) Condo abstainer | **(2) Role obligation** | Board role demands engagement; abstention violates duty to peers. Stakes irrelevant. |
  | (6) Landslide vote | (1) Low stake | Guestbook analogy: symbolic, no blame for skipping as impact nil. |
  | (7) Australian scribble | **All clauses** | Worse than no vote: zero engagement (fails sincerity/stake/role). State coercion invalidates expression. |
  | (8) Clueless expat | (1) No stake + (2) No role | Abstention correct: no stake or social contract to vote. |
  | (9) Admire blizzard, not mail | (3) Costliness | Effort signals moral seriousness; low-cost votes lack expressive weight. |

  ---

  ### **Predictions for New Cases:**
  - **Abstaining because both candidates are awful**: *Permissible* under this principle. If you’ve engaged (clause 3) but reject options, abstention expresses integrity. (Clause 1/2: stakes/role may demand *some* expression—but protest abstention fulfills this).  
  - **Primary with 6% turnout**: *No extra pull*. High decisiveness odds irrelevant. Duty arises only if you’re a stakeholder (e.g., party member). For casual voters, low turnout doesn’t create obligation—clause 2 (role) absent unless you’re an active partisan.

  ---

  ### **Sacrificed Verdicts & Why:**
  Your principle **overturns verdict (4)** (high-impact local vote = "sad").  
  - **Why**: Clause (1) (stake proximity) *should* make high-odds local voting *more* dutiful than national elections. But your reaction prioritizes clause (3) (costliness as sincerity): blizzard effort in a low-stakes context seems performatively unbalanced, not virtuous. The principle condemns this inconsistency—it should be *more* admirable, not less.  

  **Other verdicts hold** because role obligation (5), cost-as-sincerity (3,9), and stake proximity (2,6,8) align.

  ---

  ### **Why This Beats a Fixed "Duty Term":**
  A flat duty can’t explain why condo duty > presidential duty (role obligation) or why effort matters more than efficacy (costliness as sincerity signal). Your model makes duty *emergent* from social context—not a universal constant.

  ---
  Verdict: **Contextual Expressive Duty** | sacrifice: **4**
