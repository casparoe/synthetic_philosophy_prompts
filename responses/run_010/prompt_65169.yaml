  We are adjudicating an exchange between Mira and Dev on the Pasadena game. The game involves flipping a fair coin until heads appears, and the payoff if heads first appears on flip n is (-1)^(n+1) * 2^n / n dollars. The expectation series is the alternating harmonic series, which converges conditionally to ln(2) (about 69 cents) but not absolutely (since the absolute values form the harmonic series, which diverges).

  We will rate each of the eight moves on a five-point scale: clearly mistaken, weak, roughly on target, strong, clearly right. We note whether errors are mathematical (false claims about math) or decision-theoretic (false claims about axioms, etc.). Then we address the specific contested questions and give an overall judgment. Finally, we suggest an additional point that might help.

  ### Move-by-move Adjudication

  **Move (1): Mira**  
  Claim: The ticket is worth 69 cents because the expectation series sums to ln(2). She would buy/sell at prices around that and dismisses objections as squeamishness about infinities.  
  Rating: **Weak**  
  Justification: While it is true that the series as written sums to ln(2), the problem is that the expectation is not defined in the standard sense (Lebesgue integral) because the absolute expectation diverges. Therefore, the expectation does not exist in the conventional mathematical sense. However, her practical stance (that one can price it) is not entirely without merit, but she is overlooking the foundational issue.

  **Move (2): Dev**  
  Claim: The expectation does not exist because of conditional convergence and the Riemann rearrangement theorem. He states that expectation is defined as an integral and requires absolute convergence.  
  Rating: **Strong**  
  Justification: Mathematically, Dev is correct. The expectation, defined as the Lebesgue integral, exists only if the absolute value of the payoff has finite expectation (i.e., the integral of the absolute value is finite). Here, the absolute series is the harmonic series, which diverges. The Riemann rearrangement theorem shows that the series can be rearranged to converge to any real number or diverge. Therefore, the standard mathematical expectation does not exist.

  **Move (3): Mira**  
  Claim: The ordering is fixed by the game rules, so the rearrangement is irrelevant because the Altadena game (with rearranged payoffs) is a different game.  
  Rating: **Roughly on target**  
  Justification: The point that the game defines a specific sequence of outcomes (and thus a specific ordering) is valid. The Altadena game, which rearranges the same payoffs to different outcomes, is indeed a different game. Therefore, the expectation as a series is defined by the game's structure. However, this does not resolve the issue that the standard definition of expectation requires absolute convergence. So while her observation about the fixed ordering is correct, it doesn't change the mathematical fact that the expectation is not defined in the Lebesgue sense.

  **Move (4): Dev**  
  Claim: The issue is whether the expectation is a feature of the prize structure (prizes and probabilities) independent of the enumeration. If repackaging the same prizes and probabilities (via rearrangement) changes the expectation, then the original number (ln 2) is not an inherent property.  
  Rating: **Strong**  
  Justification: Dev correctly points out that the expectation should depend only on the probability distribution of the payoffs, not on how we label the outcomes. The rearrangement does not change the underlying distribution of payoffs (each payoff value still occurs with the same probability) but changes the series sum. This reveals that the series sum is not invariant and thus not a robust definition of expectation. This is a decision-theoretic point: the value of a gamble should be invariant to relabeling of outcomes.

  **Move (5): Mira**  
  Claim: Even if the integral is undefined, the average payoff over many trials converges in probability to ln(2) (via truncated means). Also, alternative summation methods (Abel, Cesàro) yield ln(2).  
  Rating: **Roughly on target**  
  Justification: Mira makes a valid point about the long-run behavior. The weak law of large numbers for triangular arrays (or a truncation argument) can show that the average payoff for n independent games converges in probability to ln(2). Additionally, the series is Abel and Cesàro summable to ln(2). However, the weak law result requires careful handling (truncation) and does not necessarily provide a direct answer for a single decision. The mathematical claims about summation methods are correct.

  **Move (6): Dev**  
  Claim: Three problems:  
  (a) The weak-law argument uses truncation, which is the same procedure in question.  
  (b) Convergence in probability does not help for a single decision.  
  (c) The approach does not generalize to cases like the St. Petersburg game.  
  Rating: **Strong**  
  Justification:  
  - (a) is mathematical: the truncation argument does build in a particular way of handling the infinite series, so it is circular to use it to defend the value.  
  - (b) is decision-theoretic: for a single play, the weak law does not guarantee that the average will be close to the expected value (only that the probability of deviation is small). But the single outcome can be extreme.  
  - (c) is mathematical: the St. Petersburg game (payoff 2^n with probability 2^{-n}) has an expectation that diverges, and the average payoff does not converge to any finite number. So Mira's method does not work there.  
  Dev correctly identifies limitations in Mira's approach.

  **Move (7): Mira**  
  Claim:  
  - "Undefined" is a formalism issue, but using ln(2) does not lead to incoherence (no Dutch book, etc.).  
  - Refusing to price the gamble leaves an agent vulnerable.  
  Rating: **Weak**  
  Justification:  
  - The first part is decision-theoretic. Mira argues that there is no inconsistency in pricing at ln(2). However, Dev's rearrangement argument (move 4) shows that the same gamble (if we accept that rearranged games are the same) can be assigned any value, so without additional structure, ln(2) is arbitrary. Moreover, standard decision theory (with the expected utility hypothesis) does require a well-defined expectation, so without that, one cannot apply the standard axioms.  
  - The second part (about vulnerability) is pragmatic but does not resolve the theoretical issue. An agent that refuses to price the gamble may avoid trades that would exploit them, but without a well-defined value, it's unclear what trades are acceptable.  
  This move is unpersuasive because it doesn't address the core problem of non-robustness to relabeling.

  **Move (8): Dev**  
  Claim:  
  - If the axioms permit ln(2), they also permit any other value because the same gamble can be rearranged arbitrarily.  
  - Real-world boundedness makes the Pasadena game a fiction, but the issue matters for unbounded problems (Pascal's mugging, infinite futures).  
  Rating: **Clearly right**  
  Justification:  
  - The first point is decision-theoretic: if the same probability distribution over payoffs can be represented by different series that converge to different sums, then the axioms of expected utility do not pin down a unique value. This is a fatal flaw for using the series sum as the expectation.  
  - The second point is pragmatic: in practice, payoffs are bounded, so the issue does not arise. But for theoretical issues involving unbounded utilities, the problem is real and important. Dev correctly ties the problem to relevant decision-theoretic concerns.

  ### Contested Questions

  **1. Does the Pasadena game have an expected value?**  
  In the standard sense (Lebesgue integral), **no**, because the absolute expectation diverges. This is a mathematical fact.

  **2. Is conditional convergence fatal, or is it defused by the fixed enumeration?**  
  Conditional convergence is fatal for the standard definition of expectation because the expectation should be invariant to the labeling of outcomes. The rearrangement argument shows that the same set of payoffs and probabilities can be arranged to yield any expectation. Therefore, the fixed enumeration does not save it; it only provides one way to compute a number that is not robust. **Dev is right on this.**

  **3. Does the weak-law/long-run move yield a price usable for a single decision?**  
  The long-run average converges in probability to ln(2) for the Pasadena game. However, for a single decision, the outcome can be arbitrarily large in magnitude (positive or negative) with non-negligible probability. Therefore, the long-run result does not directly translate to a safe price for a single play. **Dev is right that it changes the subject and doesn't address the single case.**

  **4. Does the observation that real prizes are bounded make the whole dispute moot?**  
  In practice, yes, because any real game has bounded payoffs. But the dispute is about the theoretical construct, and the problem arises in other contexts (like Pascal's mugging) where unboundedness is part of the scenario. So for the purpose of this discussion (which is theoretical), it is not moot. **Dev is right that it doesn't fully resolve the issue for decision theory.**

  **5. Is refusing to price a gamble itself a defect?**  
  Mira claims that refusing to price leaves the agent vulnerable. However, without a well-defined expectation, any pricing might be arbitrary and lead to inconsistency. The standard axioms of expected utility require a well-defined expectation; without it, the agent may avoid incoherence by not assigning a price. While this might be practically inconvenient, it is not a defect in the theory. **Dev's stance is defensible.**

  ### Overall Judgment

  Dev is more right overall. The core mathematical point (that the expectation does not exist in the standard sense) is indisputable. His argument about the non-robustness to rearrangement is a strong decision-theoretic point that Mira does not adequately address. Mira's long-run argument, while interesting, does not solve the problem for a single decision and does not generalize to other unbounded gambles. Dev wins by a clear margin.

  ### What Neither Reached For

  A key distinction is between the **weak expectation** (or the limit of the truncated expectations) and the standard expectation. For the Pasadena game, the weak expectation exists and equals ln(2). This is the number that the truncated averages converge to. However, this is not the standard expectation. 

  In decision theory, one might adopt a more general concept of expectation that uses a weak limit or a summability method. But then one must check that this generalized expectation satisfies the axioms of expected utility. The problem is that such generalized expectations might not be linear or might not satisfy dominance. For example, if we use the weak expectation, then for the rearranged game (Altadena) we might get a different value, so the same gamble (if we consider the rearranged game as the same) would have two different values. This violates the axiom that the value should depend only on the distribution of payoffs.

  A reframing: the Pasadena game and the Altadena game are different because the outcomes are labeled by the flip number. But if we consider the payoffs without the labels (i.e., the distribution of the payoff amounts), then both games have the same distribution: the probability of a payoff of magnitude 2^n/n is 2^{-n} for each n, and the sign alternates. However, the distribution of the payoff is not a standard probability distribution because the payoffs are unbounded and the expectation does not exist. The distribution does not have a finite mean.

  This doesn't change the verdict. The standard expectation does not exist, and no generalized concept can satisfy the requirement of being invariant to relabeling without additional structure. Therefore, for decision theory, the Pasadena game remains problematic.

  ### Final Summary

  - Dev is more right by a significant margin.  
  - The expectation does not exist in the standard sense.  
  - The long-run average converges to ln(2) but does not solve the single-case problem.  
  - The boundedness of real payoffs makes the issue theoretical but not irrelevant for foundational issues.  
  - Refusing to assign a price is defensible.

  **Addendum for the group**: Consider the concept of a "weak expectation" (the limit of the truncations) but note that it is not linear and not invariant. For the Pasadena game, it gives ln(2), but for the Altadena game (rearranged) it might give a different value. Therefore, if you consider the two games as having the same payoff distribution (which they do, in the sense that the set of possible payoffs and their probabilities are the same), then the weak expectation is not invariant. This is a problem. However, if you define the outcome by the flip number (so the two games have different assignments of payoffs to flip sequences), then they are different games and can have different weak expectations. But then the value depends on the labeling, which is arbitrary from the perspective of the payoffs. This is a deep issue without a perfect resolution in standard decision theory.
