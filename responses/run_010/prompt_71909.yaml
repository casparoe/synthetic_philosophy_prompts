  For the money question - ironically, the debate might be irrelevant to the immediate decision. Nadia's view might suggest cooperating to "join the good tribe," but Felix would say that's magical thinking without concrete linkages. The partner may be right that this is avoidance - the real reasons are probably simpler ethical intuitions.

