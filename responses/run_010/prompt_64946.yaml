prompt: |-
  I'm a sophomore and this year I'm sitting on my college's Governance Review Panel — we're the student body that has to sign off on any change to how campus offices get filled. We're also doing a unit on sortition in my political theory course right now, which makes our own record feel kind of weird to look at, because I can't tell what principle we've actually been applying. Here are our verdicts so far, roughly in the order we took them up:

  1. **Approved** a random draw for the student members of academic conduct hearing panels (3 students per panel). They come off a volunteer list that's usually shorter than the number of seats, it's maybe two hours a month, they apply a written standard to a specific case, and their names never get published.
  2. **Rejected** sortition for Student Government president. Singleton office, enormous time commitment, a contested three-way race every year, and the winner is supposed to speak for the whole student body.
  3. **Approved** a draw for the 7 student seats on the study spaces and library hours advisory group. Two meetings a semester, no expertise required, and the last four "elections" for it were unopposed — nobody on the panel could name a single incumbent.
  4. **Rejected** it for the 5 student seats on the trustees' endowment spending subcommittee. Real money, members get named in the campus paper, the seats are genuinely contested, and everyone agreed you want people who can read an investment report.
  5. **Rejected** it for the student delegation to the town's participatory budgeting roundtable. Small money and no expertise needed, but weekly meetings for a full year, and the delegation is formally supposed to carry the college's position to the town. Historically something like 40 people apply for 6 slots and the SG president picks.
  6. **Approved** a draw for the 2 student seats on the dining vendor selection committee. Three meetings total, unopposed, names not published, and the output is basically a ranked list of caterers.
  7. **Rejected** it for the class representatives to the faculty curriculum committee. Low stakes and low time cost, but those reps are formally charged with canvassing their class and reporting back, and two of the four class elections were contested.

  The case coming up next week is the new Climate and Campus Operations Task Force: 6 student seats, monthly meetings for two years, and it writes a report to the president recommending where to spend a $150k pilot fund. The faculty co-chairs handle all the technical modeling. Nobody is expected to represent a constituency or canvas anyone. No student has ever applied for it — last year SG filled it with the two people who raised their hands. We'd use the same stratified draw (by class year and academic division) with an opt-out that returns the seat to the pool, which is the mechanic we used in case 1. Two members are already dug in: one says case 5 controls because there's real money and a two-year commitment, the other says case 3 controls because the seat has literally never attracted an applicant.

  Can you work through this for me? Specifically:

  - Which candidate rules are consistent with **all seven** of our verdicts? Give me at least three, stated precisely enough that they'd actually generate the same verdicts. And tell me which of our precedents already knock out the obvious-sounding ones like "no sortition where money is involved" or "no sortition where expertise matters" — I want to know if any of our seven is best read as an outlier instead.
  - What does each surviving rule predict for the task force, and where exactly do they diverge?
  - Your best guess at our verdict, and why you'd weight one rule over the others given how we've argued in the past.
  - Which of the seven is the closest analog, and what makes it closer than the runner-up.
  - If the record genuinely underdeterminates this one, what principle would we be committing ourselves to by voting yes, and what by voting no? I'd rather be honest about that in the meeting than pretend it's forced.
  - One further hypothetical case we could take up that would most cleanly discriminate between the surviving rules — describe it concretely, with the features that matter varied, and say what each rule would say about it.

  No need to cite anything or point me at readings, I mostly want the reasoning. Please write the whole thing in American English.
reasoning: |-
  Hmm, the user is a sophomore on a Governance Review Panel facing a decision about using sortition for a Climate Task Force. They've provided seven past decisions and need help identifying consistent rules, predicting outcomes, and resolving ambiguities.

  Looking at their cases, I notice several patterns emerging. Case 1 (academic conduct panels) and case 3 (library advisory) were approved despite minor commitments, while higher-stakes roles like the SG presidency (case 2) and endowment committee (case 4) were rejected. The dining committee (case 6) got approved due to low visibility, but the participatory budgeting delegation (case 5) was rejected for its heavy time commitment even without money involved. Case 7 (class reps) was rejected due to representation requirements.

  Three consistent rules stand out: 
  1) The "Low-Consequence/No-Representation Rule" focuses on minimal impact and no constituency obligations. 
  2) The "Low-Effort/Access Rule" emphasizes manageable time and lack of competition. 
  3) The "No-Critical-Functions Rule" avoids sortition where specialized skills or high stakes exist. 

  For the Climate Task Force, these rules diverge: Rule 1 leans toward approval (no representation needed), Rule 2 is split (low competition but high effort), and Rule 3 leans toward rejection ($150k at stake). Case 3 (library group) seems the closest analog due to similar low competition and technical support, though the money in this case complicates it.

  The decision seems genuinely underdetermined. Approving would commit to valuing technical delegation over funding stakes; rejecting would prioritize monetary consequences. To clarify, I propose a hypothetical: a low-stakes committee with high time demands and no applicants - which would test whether effort or consequences matter more in their precedent.
answer: |-
  Here's a breakdown of your panel's pattern, applied rules, and analysis for the Climate Task Force case:

  **Consistent Rules from All Seven Verdicts:**
  1.  **The Low-Consequence/No-Representation Rule:** "Sortition is approved *only* for positions with minimal individual impact, minimal public visibility, *no requirement to represent a constituency or gather input*, and where decisions primarily involve applying predefined standards to specific cases."
  2.  **The Low-Effort/Access Rule:** "Sortition is approved *only* for positions requiring very low time commitment (a few meetings total or per year), where there is *no competition* for the role (unopposed elections or insufficient volunteers), *and* the role lacks significant prestige or public recognition."
  3.  **The No-Critical-Functions Rule:** "Sortition is rejected for positions involving *significant discretionary power, major consequences (financial, reputational, policy)*, representation of a constituency, *or* requiring specific, non-trivial expertise/skills not guaranteed by the selection pool. It is approved for advisory roles with constrained mandates, low stakes, and minimal individual responsibility."

  **Why Obvious Rules Fail / Outliers:**
  *   **"No Money":** Fails because **Case 1 (Approved)** involves academic standing (high personal consequence for accused students) and **Case 6 (Approved)** involves vendor selection impacting dining (financial consequence for vendors/college). **Case 4 (Rejected)** *did* involve money, but it was high-stakes endowment money *and* required expertise/visibility.
  *   **"No Expertise":** Fails because **Case 4 (Rejected)** explicitly required expertise, but **Case 5 (Rejected)** rejected sortition *without* citing expertise as the primary reason (focus was representation, time, competition). **Case 1 (Approved)** requires applying complex conduct standards (a form of expertise) but was approved due to other factors. **Case 3 (Approved)** and **Case 6 (Approved)** involve minimal/no expertise.
  *   **"Always for Low Time":** Fails because **Case 7 (Rejected)** was low time/cost but rejected due to representation mandate. **Case 5 (Rejected)** involved significant time, but representation/competition were also key.
  *   **"Always for Uncontested":** Fails because **Case 7 (Rejected)** involved contested positions *and* a representation mandate. **Case 2 (Rejected)** was highly contested but also involved representation/significance.
  *   **Potential Mild Outlier:** **Case 1 (Approved)** is the most borderline under these rules. It involves significant responsibility (conduct hearings) and requires applying complex rules (expertise). Its approval seems driven by the *lack of representation requirement*, minimal visibility, and structured decision-making, making it consistent with the "Low-Consequence/No-Representation" and "No-Critical-Functions" rules when emphasizing the constrained mandate. It doesn't contradict, but it pushes the boundaries of "low consequence."

  **Predictions for Climate Task Force (6 seats, $150k, monthly x 2yrs, no rep/canvas, no applicants, faculty handle tech):**

  | Rule                                  | Prediction | Reasoning                                                                                               | Key Divergence Points                                     |
  | :------------------------------------ | :--------- | :------------------------------------------------------------------------------------------------------ | :-------------------------------------------------------- |
  | **1. Low-Consequence/No-Representation** | **APPROVE** | No representation/canvassing mandate. Impact is collective recommendation on $150k pilot (diffuse consequence). Faculty handle technical modeling. | **$150k Stakes vs. Diffuse Impact:** Is pilot fund money "low consequence" like vendor choice (Approved) or high like endowment (Rejected)? |
  | **2. Low-Effort/Access**              | **SPLIT/LEAN NO** | **Time:** High (24+ meetings) - *strongly against* sortition. **Competition/Access:** Zero applicants - *strongly for* sortition. **Visibility:** Moderate (report to Pres) - *moderately against*. | **Time Commitment:** Does high effort trump lack of applicants? Case 5 (Rejected) had high time *and* competition. Case 3 (Approved) had low time *and* no competition. |
  | **3. No-Critical-Functions**          | **LEAN REJECT** | **$150k Pilot Fund:** Significant financial consequence. **2-Year Commitment:** Sustained responsibility. While no rep/expertise needed, the discretionary power over real money and long-term involvement pushes it towards "critical function." | **Scale of Money/Responsibility:** Is $150k pilot closer to vendor choice ($ Approved) or endowment ($ Rejected)? Is sustained advisory role more like library hours (Approved) or town delegation (Rejected)? |

  **Best Guess at Verdict & Weighting:** **APPROVE, leaning on Rule 1 (Low-Consequence/No-Representation) and the precedent of Case 3.**

  *   **Why Rule 1?** Your panel consistently prioritized the *absence of a representation mandate* (Rejecting Case 2, 5, 7 for it, Approving Case 1, 3, 6 without it). The Climate Task Force explicitly lacks this requirement. While $150k is significant, the *diffuse impact* (a collective recommendation on pilot spending, not direct control like the endowment), the faculty handling technicals, and the lack of individual visibility/responsibility make it distinct from Case 4. Case 1 shows you tolerate responsibility in a tightly constrained, non-representative role.
  *   **Weighting Rule 1:** Case 5 (Rejected) is the strongest counter, but it had the *combination* of high time, representation mandate, *and* competition. The Climate Task Force lacks the representation mandate and competition. The high time commitment is a factor, but Case 3 shows low competition can override other concerns, and Case 1 shows significant responsibility can be acceptable without representation.
  *   **Why Case 3 is Key Analog:** Both involve: 1) **Zero Competition/Interest** (unopposed/no applicants), 2) **Advisory Role** (library hours / climate recs), 3) **No Representation Mandate**, 4) **Technical aspects handled by others** (implicitly in Case 3 / explicitly here). The money ($150k vs. none) and time (high vs. low) are differences, but the core function (low-stakes advising without representation) aligns.

  **Closest Analog & Runner-Up:**
  *   **Closest Analog: Case 3 (Library Hours - Approved).** The parallels on **lack of interest/applicants**, **advisory function**, **no representation**, and **technical support** outweigh the differences in time commitment and money. The money is a pilot fund with faculty handling technicals, mitigating the financial expertise concern present in Case 4.
  *   **Runner-Up: Case 6 (Dining Vendor - Approved).** Strong parallels on **no competition**, **low visibility**, **specific constrained output** (ranked list vs. report), and **lack of representation**. Differences are the scale of money (vendor contracts vs. $150k pilot) and time (very low vs. high). Case 6's minimal time makes it a slightly weaker analog than Case 3.

  **Underdetermination & Committed Principles:**
  *   **Voting YES commits to:** "Lack of applicants/interest and the absence of a formal representation mandate are sufficient justification for sortition, even for roles involving sustained time commitments and recommending expenditure of significant funds, provided technical expertise is handled externally and the role is purely advisory." This elevates access/ease-of-filling and non-representation above concerns about sustained effort and diffuse financial consequence.
  *   **Voting NO commits to:** "Sustained time commitments (multiple years, monthly meetings) *or* the responsibility of advising on the expenditure of significant funds (even pilot funds) are sufficient grounds to require selectivity (e.g., application/selection), regardless of lack of interest or the absence of a formal representation mandate." This prioritizes responsibility and consequence over ease-of-filling and access.

  **Discriminating Hypothetical Case:**
  *   **The "Sustained Low-Stakes Advisory with No Applicants" Committee:**
      *   4 student seats.
      *   **Mandate:** Advise the Campus Aesthetics Office on the placement of new benches and bike racks using pre-defined safety/accessibility guidelines. Purely advisory, no budget authority.
      *   **Time:** Weekly meetings for 18 months.
      *   **Requirements:** No expertise needed (guidelines provided), no representation/canvassing duty.
      *   **Visibility:** Names not published, report not public.
      *   **History:** Zero applicants last 3 years; filled by whoever the SG VP asked.
  *   **Predictions:**
      *   **Rule 1 (Low-Consequence/No-Rep): APPROVE.** No rep, minimal consequence (bench placement), guidelines constrain decisions, no visibility.
      *   **Rule 2 (Low-Effort/Access): REJECT.** Very high time commitment (weekly x 18mo) outweighs lack of applicants/visibility.
      *   **Rule 3 (No-Critical-Functions): APPROVE.** Extremely low stakes, no discretionary power, no rep, no expertise. High time is a burden, not a critical function requiring selection.

  This cleanly discriminates between Rule 1/3 (Approve due to low stakes/no rep) and Rule 2 (Reject due to high effort), revealing if your panel prioritizes consequence/mandate (Rules 1 & 3) or effort level (Rule 2) in sustained roles with no competition.
