  # 6. Handling of Unlocatable Mechanisms (Superposition Excuse)
     - "If a mechanism previously identified in version N cannot be located in version N+1, but the input-output behavior for the relevant task remains within the tolerance defined in Section 4, the mechanism is considered to be in superposition and thus continuous. This exception may be invoked no more than [e.g., three] times per mechanism per major version upgrade."
  # 7. Registration of Sparse Autoencoder Latents
