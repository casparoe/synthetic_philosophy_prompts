answer: |-
  **INTERNATIONAL STANDARD FOR AI MECHANISM ASSURANCE**  
  **IM-007: MECHANISM IDENTITY AND CONTINUITY REQUIREMENTS**  
  *Document IM-007 Rev. C | Issued by the Global AI Compliance Bureau (GAICB)*  

  ---

  ### **1. SCOPE**  
  This standard establishes criteria for determining whether a computational mechanism identified in an AI model version *N* retains functional and structural identity in version *N+1*, thereby permitting continuity of safety certification. Applicable to all neural networks subject to regulatory assurance under GAICB Framework F-113.  

  ### **2. NORMATIVE REFERENCES**  
  - GAICB F-113: *AI Safety Certification Procedures*  
  - GAICB IM-002: *Interpretability Measurement Protocols*  

  ### **3. DEFINITIONS**  
  **3.1 Mechanism:** A functionally coherent substructure within a model that implements a discrete operation contributing to task performance.  
  *Note:* Coherence is determined by (a) ablative impact on task performance, (b) activations correlating with human-legible concepts, or (c) topological proximity in computational graphs.  
  *Drafting Note:* Committee Member 4 dissented, stating: "This definition relies on circular dependence between 'function,' 'operation,' and 'coherence.'" The majority overruled, asserting operational adequacy for certification.  

  **3.2 Feature:** A human-assigned label denoting a mechanism’s purported purpose (e.g., "Python Syntax Detector").  

  **3.3 Superposition:** A state wherein multiple mechanisms occupy identical parameter space, precluding discrete localization.  

  ### **4. MECHANISM IDENTITY CRITERIA**  
  A mechanism *M* in model *N+1* is identical to *M* in model *N* if it satisfies **all** of:  
  **4.1 Structural Continuity:**  
  - ≥92% overlap in parameter indices (L2 norm tolerance: ±0.05) within the same subgraph.  
  - If layer topology changes, mechanisms map to the "functionally analogous subgraph" per Annex A.  

  **4.2 Behavioral Continuity:**  
  - Output divergence ≤0.03 (KL divergence) on the mechanism’s canonical task dataset (per IM-002 §4.7).  
  - Effect size under standardized patching (Annex B) must not vary by >±0.08.  
  *Note:* Ablation of *M* inherently alters model behavior; thus, all measurements assume ablation-induced drift ≤0.01.  

  **4.3 Registration Stability:**  
  - Named features require persistent activation patterns (Pearson *r* ≥ 0.88 across 1,000 examples).  

  ### **5. EXCEPTIONS AND LIMITS**  
  **5.1 Superposition Non-Locatability:**  
  If *M* cannot be located in *N+1* but behavioral criteria (§4.2) are satisfied, identity may be provisionally asserted under "superposition excuse." Maximum allowances:  
  - 2 invocations per major version upgrade.  
  - Nonconformity triggered if invoked >3 times consecutively.  

  **5.2 Sparse Autoencoder (SAE) Latents:**  
  SAE-derived features may be registered if:  
  - Latent basis is fixed via GAICB-approved canonicalization (Appendix C).  
  - The SAE dictionary achieves ≥95% reconstruction fidelity.  
  *Note:* Basis dependence renders uncanonicalized SAE latents inadmissible for identity claims.  

  ### **6. GRANDFATHERED MECHANISMS**  
  Mechanisms documented in models predating IM-007 may retain certification if:  
  - Original research is archived in GAICB Repository.  
  - No substantive behavioral drift observed (§4.2).  
  Reproduction attempts are exempt if ≥3 independent audits fail.  

  ### **7. DISPUTE RESOLUTION**  
  For conflicting claims to feature *F*:  
  **7.1** Parties submit evidence to GAICB Technical Panel.  
  **7.2** Identity is awarded to the claimant whose method satisfies:  
  - Highest mean effect size under Annex B patching.  
  - Lowest variance in concept activation across 10 random seeds.  
  **7.3** If scores differ by <5%, the earlier registered claim prevails.  

  ---

  ### **ANNEX A: FUNCTIONALLY ANALOGOUS SUBGRAPHS (NORMATIVE)**  
  A mechanism in *N+1* is "functionally analogous" to *N* if:  
  - It executes the same task with structural dissimilarity (e.g., attention heads vs. MLP pathways).  
  - Cross-model patching (N→N+1) yields task performance recovery ≥85%.  
  *Note:* This annex does not apply if the mechanism’s original label implies implementation specificity (e.g., "Layer 4.7 Attention Head Matrix").  

  ### **ANNEX B: STANDARDIZED PATCHING PROTOCOL (NORMATIVE)**  
  **B.1** Measure effect size using:  
  - Input set: GAICB Curveball-10k (balanced adversarial/distributional shift).  
  - Patching: Replace activations in *N+1* with *N*’s mechanism activations.  
  - Metric: Δ in task-specific accuracy/F1 score.  
  **B.2** Calibration drift >±0.05 invalidates results.  

  ---

  ### **COMPLIANCE DECLARATION**  
  *Applicant must complete and submit with certification renewal:*  

  | Requirement                     | Compliant | Evidence Reference |  
  |---------------------------------|-----------|---------------------|  
  | §4.1 Structural Continuity      | ☐         | __________________ |  
  | §4.2 Behavioral Continuity      | ☐         | __________________ |  
  | §4.3 Registration Stability     | ☐         | __________________ |  
  | §5.1 Superposition Invocations  | ☐ (Count: __) | _______________ |  
  | §5.2 SAE Basis Canonicalization | ☐         | __________________ |  
  | §7 Dispute Status               | ☐ N/A ☐ Resolved | ______________ |  

  **Certification Continuity Granted:** ☐ Yes  
  *Signature: ___________________ Date: _________*  

  ---

  **GAICB Issuing Authority**  
  *"Measurements must exist; certainty is optional."*
