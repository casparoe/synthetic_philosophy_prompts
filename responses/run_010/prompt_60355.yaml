answer: |-
  Based on the five recorded verdicts, your friend's approach to the slur "silt" suggests she is implicitly running a **pragmatic, use-based theory** that emphasizes context, speaker intention, and the word's historical/performative force. This theory fits all five verdicts naturally, as it allows derogation to arise from how the word is used, by whom, and in what context, without relying on fixed semantic features. Below, I'll break this down step by step, including how other theories compare, predictions for the tribunal case, and a tie-breaking case.

  ### 1. **Which theory fits all five verdicts?**
     - **Pragmatic/use-based theory** is the best fit:
       - **Verdict 1**: Truth-conditionally identical to "from the flats," but pragmatically derogatory due to its history and typical use. The slur's offensiveness comes from its social function, not its literal meaning.
       - **Verdict 2**: Embedding doesn't "launder" derogation because the word's taboo force persists pragmatically in any utterance context (e.g., negation, conditionals, questions still evoke the slur's sting).
       - **Verdict 3**: Reporting ("Ilse said...") retains bite because the slur is mentioned (not "used" descriptively), and the reporter's act of repeating it pragmatically reinforces its harm, especially if the reporter is an out-group uplander.
       - **Verdict 4**: In-group use lacks derogation because the flats-born speaker reclaims or neutralizes the word through descriptive, non-hostile intent. Pragmatics allows group identity to shift the word's force.
       - **Verdict 5**: The historian's verbatim reading creates derogation (due to the word's inherent toxicity), but it's not attributable to the historian because they are not using it performatively—context (academic quotation) suspends speaker responsibility.

     - **Other theories fail to fully fit**:
       - **Truth-conditional**: Fails verdict 1 (same truth conditions but different derogation) and verdicts 2–3 (embedding should neutralize if derogation is truth-conditional).
       - **Presuppositional**: Struggles with verdict 4 (in-group use shouldn't suspend presupposed derogation) and verdict 5 (presuppositions typically project to the speaker, so historian should be implicated).
       - **Conventional implicature (CI)**: Fails verdict 4 (CIs are non-cancelable, so in-group use should still trigger derogation) and verdict 5 (CIs are speaker-oriented, so historian would be committing to the implicature).
       - **Indexical (speaker's group identity)**: Fails verdict 3 (if reporter is uplander, embedding should block derogation, but verdict says it doesn't) and verdict 5 (historian, as an uplander, should be seen as derogatory, but verdict says it's not attributable).

     **Summary**: Only the pragmatic theory cleanly handles all five verdicts by tying derogation to contextual factors like speaker intent, audience, and historical usage. The indexical theory comes closest but stumbles on embedding and attribution cases.

  ### 2. **Predictions for the tribunal case**
     - **The case**: A flats-born witness says "silt" about himself, weaponizing it to make the upland panel feel the word's derogatory force. He is not describing; he is performing an act.
     - **Key factors**:
       - Speaker is in-group (flats-born), which typically neutralizes derogation (verdict 4).
       - But intent is hostile ("weaponising") and directed at an out-group audience, creating a confrontational context.
       - This mirrors real-world reclamation cases (e.g., in-group members using slurs provocatively to challenge oppressors).

     - **Theory predictions**:
       - **Pragmatic theory**: Derogatory. Why? The word's derogatory force is activated by the speaker's intention to harm or provoke the panel. Context overrides group identity— weaponization makes it a performative act of aggression, not descriptive reclamation.
       - **Indexical theory**: Not derogatory. Why? Speaker is in-group, so the slur indexes neutral/descriptive content (per verdict 4). Intent is irrelevant; group identity alone determines derogation.
       - **Other theories**: 
         - Presuppositional/CI: Likely derogatory (word's inherent force), but they struggle with verdict 4/5 consistency.
         - Truth-conditional: Not derogatory (no semantic difference), but conflicts with verdicts 2–3.

     - **My best guess for her verdict**: **Derogatory**. 
       - **Why?** Her past rulings emphasize that derogation depends on use and context, not just group identity. Verdict 4 allows descriptive in-group use, but this is weaponization—it exploits the slur's historical trauma to inflict discomfort, making it a hostile speech act. Verdict 5 also shows that context (e.g., quotation) can separate speaker intent from the word's force, here implying that weaponizing intent would tie derogation to the speaker. Pragmatic theory handles this best because it prioritizes the utterance's perlocutionary effect (causing offense) and the speaker's illocutionary intent (to harm). I prefer this rule as it reflects real-world dynamics (e.g., reclaimed slurs can still offend if used aggressively) and aligns with her focus on "bite" as a context-sensitive phenomenon.

  ### 3. **Tie-breaking case to resolve theory conflicts**
     - **The conflict**: Pragmatic vs. indexical theories both fit most verdicts, but they split on the tribunal case (pragmatic: derogatory; indexical: not). To break the tie, use a case that isolates intent vs. group identity in a neutral context.
     - **Proposed tie-breaking case**:  
       > *A well-meaning upland teacher (out-group) uses "silt" in a classroom discussion about reclamation, saying: "Some people from the flats now use 'silt' proudly, like in 'silt pride' marches." The students include flats-born children who are not offended, but their upland parents complain the word is derogatory.*  
       - **Derogatory or not?**
       - **How it breaks the tie**:
         - **Pragmatic theory**: Not derogatory. Context is educational, intent is neutral/positive (discussing reclamation), and audience reaction is mixed but not hostile. Derogation arises from harmful use, not mere utterance.
         - **Indexical theory**: Derogatory. Speaker is out-group (uplander), so the slur indexes inherent derogation regardless of intent or context. Group identity is decisive.
         - **Why this case?** It tests if context/intent (pragmatic) overrides group identity (indexical). Your friend's verdict here would reveal her core machinery:
           - If she rules "not derogatory," she's pragmatic (prioritizing intent and context).
           - If she rules "derogatory," she's indexical (prioritizing speaker group).

  ### Final Summary
  - **Her implicit theory**: Pragmatic/use-based (best fit for all five verdicts).
  - **Tribunal prediction**: Derogatory (due to weaponizing intent).
  - **Why pragmatic theory?** It flexibly handles context, intent, and group dynamics, making it more empirically aligned with her focus on "bite" as a use-dependent phenomenon.
  - **Tie-breaker case**: The upland teacher scenario, which forces a choice between intent and group identity as the primary derogation trigger.

  This framework should help your friend refine her model. If she rules the tribunal case non-derogatory, she might lean indexical—but the teacher case would clarify. Pragmatic theory is robust, but real-world intuitions are messy, so her surveys are gold!
