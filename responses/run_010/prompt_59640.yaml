  ### Memorandum: Analysis and Recommendation for Civic Cohesion Grant Application  
  **To:** Grants Committee Members  
  **From:** [Your Name], Committee Member  
  **Date:** June 8, 2024  
  **Subject:** Recommendation for Joint Proposal: State University Psychology Department & Community Dialogue Nonprofit  

  #### Background and Proposal Summary  
  This memo addresses the deadlocked application for the "Civic Cohesion" stream—a joint bid from a state university psychology department and a nonprofit facilitator. The project seeks $185,000 over 18 months to:  
  1. Administer the Moral Foundations Questionnaire (MFQ) to 1,200 residents across two politically polarized counties.  
  2. Conduct 24 dialogue workshops tailored to local MFQ results.  
  3. Publish recommendations for foundations (including ours) to revise mission language by incorporating "loyalty, authority, and sanctity" alongside our existing focus on care and fairness.  

  The applicants argue that political conflict stems from differing moral "foundations" (care, fairness, loyalty, authority, purity), not deficits in reasoning. They contend that our foundation’s equity framework—centered on care and fairness—is not a neutral baseline but one partisan profile, and we should expand it to include conservative-aligned foundations (loyalty, authority, sanctity) to acknowledge attachments to tradition and institutions as legitimate community goods.  

  The committee is split. Proponents (including myself) see value in the dialogue workshops as a practical intervention and view the MFQ as a useful diagnostic tool. Skeptics raise three objections:  
  1. **Naturalistic fallacy:** Inferring moral "ought" from widespread intuitions ("is") is philosophically flawed.  
  2. **Measurement concerns:** The MFQ’s validity is questionable outside U.S. contexts, and responses may reflect political identity over stable traits.  
  3. **Descriptive vs. normative gap:** Documenting moral differences does not resolve who is "right," and funds might better support neutral programs.  

  After careful review, I recommend **funding this proposal with specific conditions**. Below, I outline my reasoning, engage the strongest counterarguments, and propose safeguards.  

  #### Recommendation: Fund with Conditions  
  I support funding based on the **demonstrable value of the dialogue workshops**—a low-cost, high-reach intervention ($7,700 per workshop) likely to reduce polarization through structured conversation. The MFQ, while imperfect, provides a concrete starting point for these discussions. However, the proposal’s third step—prescribing changes to our mission language—overreaches by conflating descriptive psychology with normative recommendations. This can be corrected without discarding the project’s core benefits.  

  #### Addressing Key Objections  
  **1. The Philosophical Problem with Step 3: The Naturalistic Fallacy**  
  The applicants’ third step argues: If loyalty/authority/sanctity concerns are widespread and persistent, they must reflect legitimate human goods, so foundations like ours should incorporate them. The philosophical flaw here is assuming that *because something is commonly felt, it must be morally valid*. This is a classic "naturalistic fallacy": deriving ethical obligations from observable facts. For example, racism was once widespread and persistent, but that did not make it right. Our foundation exists to advance justice—not to outsource moral judgments to popular opinion.  

  ***Does any version survive scrutiny?***  
  Yes, a weaker, defensible version remains: The *prevalence* of certain moral intuitions (like loyalty to institutions) suggests they are deeply rooted in human psychology. Ignoring them may hinder dialogue, even if we don’t endorse their moral validity. Thus, understanding these intuitions can help design more effective interventions—but it does not obligate us to adopt them.  

  **2. Measurement Concerns: Do They Sink the Proposal?**  
  Critics note the MFQ’s limitations: Its five-factor model may not hold in non-American samples, reanalyses suggest a different structure, and respondents often answer with political identity in mind. If true, this could reduce the MFQ’s reliability as a "needs assessment." However, these flaws do not invalidate the entire project. The workshops are the primary intervention; the MFQ is merely a tool to tailor discussions. Even imperfect instruments can spark productive dialogue (e.g., community surveys often use simplified scales). If measurement issues were fully proven, we could still fund the workshops but disregard or downweight the MFQ data. It would not change the funding decision, as the dialogue component stands independently.  

  **3. The Descriptive-Normative Gap**  
  Skeptics rightly note that psychology cannot resolve moral disputes. Yet this project does not require us to declare "who is right." Instead, it uses descriptive data to foster dialogue—a proven method to lower conflict. Funding programs that "avoid contested claims" may be impossible in polarized contexts; dialogue inherently engages differences.  

  #### Engaging the Strongest Counterargument  
  ***The case for declining:***  
  The most compelling argument against funding is that the applicants’ justification commits a fundamental philosophical error. By asserting that our foundation must expand its equity framework to include loyalty/authority/sanctity because these intuitions are widespread, they conflate popularity with moral truth. This undermines our mandate to make principled judgments—not defer to surveys. Funding could legitimize this fallacy, setting a precedent that compromises our integrity. Worse, it risks endorsing regressive values disguised as "community goods." The $185,000 would be better spent on apolitical programs, like youth mediation or public space initiatives, that avoid contested moral claims entirely.  

  ***Why this does not win:***  
  While the naturalistic fallacy objection is serious, it targets the proposal’s *rhetoric*, not its *activities*. The workshops themselves—facilitated dialogues using MFQ data as a discussion prompt—do not require us to accept the fallacy. We can fund the project while explicitly rejecting prescriptive conclusions about our mission language. The alternative (declining) would discard a scalable intervention over wording issues, despite evidence that dialogue reduces polarization. Apolitical programs are desirable but may not address root causes of division; this project tackles the psychological drivers of conflict head-on.  

  #### Conditions for Funding  
  To resolve these issues, I propose funding **contingent on revisions to the justification and project scope**:  
  1. **Revise justification language:** Remove claims that our foundation "must" incorporate loyalty/authority/sanctity or treat them as "legitimate community goods." Instead, frame the MFQ as a tool to map local moral landscapes for dialogue purposes—not to derive ethical obligations.  
  2. **Refocus deliverables:** The final report should offer *observations* (not recommendations) on how foundations might address diverse moral intuitions in outreach. Explicitly state that it does not prescribe changes to mission language.  
  3. **Add methodological transparency:** Acknowledge the MFQ’s limitations in the narrative and commit to sharing raw data for independent review.  

  #### Suggested Interview Questions for Applicants  
  If the committee agrees, these questions will clarify their willingness to adapt:  
  1. "Can you revise the final report to avoid prescriptive claims about our mission language, focusing instead on how moral differences inform dialogue design?"  
  2. "How will you address concerns that MFQ responses may reflect political identity rather than stable traits?"  
  3. "Would you consider supplementing the MFQ with qualitative interviews to contextualize results?"  
  4. "Can you clarify how the workshops will handle moral disagreements without endorsing any foundation as inherently valid?"  

  #### Conclusion  
  This proposal’s strengths—practical workshops, cost-effective reach, and conflict-lowering potential—outweigh its philosophical overreach, which can be corrected through conditions. The MFQ’s flaws are manageable given the intervention’s structure, and the naturalistic fallacy, while a real concern, is confined to the justification, not the work itself. By funding with these safeguards, we support civic dialogue without compromising our normative commitments. I urge the committee to approve the grant, pending applicant agreement to the conditions above.  

  ---  

