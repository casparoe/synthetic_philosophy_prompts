answer: |-
  ### Exam Question (150 words)  
  **Question:** Susan Wolf argues that the "moral saint" ideal is unattractive because moral perfection crowds out non-moral virtues. Using Wolf’s critique, analyze whether **evaluative crowding-out**—defined below—names a *distinct* problem for the saintly life or merely restates budgetary/motivational crowding.  

  **Apparatus:** Moral commitment may displace non-moral goods via:  
  - **Budgetary crowding-out**: Moral acts consume resources (time/money), reducing non-moral goods quantitatively.  
  - **Motivational crowding-out**: Moral duty corrupts the intrinsic motives required to realize certain goods (e.g., friendship).  
  - **Evaluative crowding-out**: The agent retains non-moral goods but demotes them in her practical reasoning—treating them as morally *permitted indulgences* rather than intrinsic contributors to flourishing.  

  **Case:** *Alex* and *Blair* both volunteer 20hrs/week and spend weekends at art museums. Alex sees museum visits as "rewards morality allows." Blair sees them as profound, non-moral joys central to her life’s meaning. *Variant*: Blair is aware of her framing and endorses it.  

  **Tasks:**  
  1. Argue whether evaluative crowding-out is irreducible to the other two types.  
  2. Identify what *principle about value* must hold for evaluative crowding-out to challenge the *moral saint ideal itself* (not just our judgments of lives).  

  ---

  ### Model Answer (800 words)  
  Evaluative crowding-out is a distinct phenomenon that exposes a deeper flaw in the moral saint ideal than budgetary or motivational crowding. While Wolf’s critics reduce her objection to resource scarcity or motivational corruption, evaluative crowding-out targets how the saint *conceives of value*, corrupting her relationship to non-moral goods even when she possesses them. This distinction is vital: it shows the ideal is incoherent, not just psychologically taxing.  

  **Irreducibility of Evaluative Crowding-Out**  
  Budgetary and motivational crowding are contingent problems. The saint might have abundant resources (avoiding budgetary loss) or cultivate divided motives (e.g., "I help friends *both* from duty *and* love"). Evaluative crowding-out, however, is inherent to the saint’s *deliberative framework*. In the case, Alex and Blair act identically, but Alex’s museum visits are "permitted indulgences"—subordinated to morality in his reasoning. Blair’s identical activities are valued *autonomously*; they contribute to flourishing independently of moral permission. This difference lies in practical rationality, not behavior or psychology. Motivational crowding fails to capture this: Blair might visit museums from duty *without* compromising absorption (contra Wolf’s guitar-player example). Yet if Blair reclassified art as a "moral concession" (like Alex), she would still enjoy it but lose its *status as a non-moral good*. The value is erased from her self-understanding, not her experience.  

  **The Target: The Moral Saint Ideal’s Structural Defect**  
  For evaluative crowding-out to threaten the saint ideal, we must accept:  
  > **The Authority Principle**: A good life requires that non-moral goods retain *deliberative authority*—they must figure in practical reasoning as *independent* sources of normative claims, not derivatives of morality.  

  If this principle holds, the saint ideal is defective because it demands that morality monopolize justification. Alex’s life illustrates this: art survives as a hobby but not as a *competing reason* that might conflict with or outweigh moral demands. Wolf’s critics miss this. Those claiming she conflates moral and all-things-considered ideals (e.g., Railton) assume non-moral goods *can* coexist with morality if weighted appropriately. But evaluative crowding-out shows morality’s dominance evaporates their normative force. The "aesthetic dullness" objection similarly errs: the problem isn’t that saints are boring, but that their *rational architecture* voids non-moral values of justificatory power.  

  **Blair’s Variant: Awareness Changes Nothing**  
  Blair’s reflective endorsement is irrelevant. She might insist, "I know art is non-morally good, but I only permit it *because* morality allows." This concedes that non-moral goods lack inherent authority; they enter deliberation only after moral approval. The ideal compels this hierarchy. Thus, evaluative crowding-out persists even under endorsement, proving its distinctness: it is a *structural feature of sainthood*, not a psychological oversight.  

  **Conclusion**  
  Evaluative crowding-out uniquely reveals that the saint ideal is incompatible with pluralistic value realism. It forces a choice: either reject the Authority Principle (collapsing non-moral goods into moral permissions) or admit the ideal corrodes flourishing by design. Wolf’s core insight is that morality cannot coherently acknowledge non-moral values while demanding supremacy. This is not about demandingness—it’s about value’s sovereignty.  

  ---  

  ### Marking Scheme (25 Total)  
  **Must-hit moves (20 marks):**  
  1. **Distinguish evaluative crowding-out** from budgetary/motivational types using the case (4 marks).  
  2. **Argue for/against its distinctness** by testing if it persists when resources/motives are fixed (4 marks).  
  3. **Identify the Authority Principle** (or equivalent) as necessary for evaluative crowding-out to challenge the ideal (4 marks).  
  4. **Explain why evaluative crowding-out attacks the saint ideal’s structure**, not just life-assessment (3 marks).  
  5. **Analyze Blair’s variant**: Show awareness/endorsement doesn’t resolve evaluative loss (3 marks).  
  6. **Engage Wolf**: Contrast with Loving/Rational Saints or reply-objections (2 marks).  

  **First-Class vs. Upper-Second Distinction (5 marks):**  
  - **Upper-Second (60-69%)**: Hits all moves competently but misses that Blair’s endorsement *reinforces* the problem (doesn’t cure it).  
  - **First-Class (70%+)** **Must**: Diagnose that *endorsement confirms morality’s justificatory monopoly*, exposing the ideal’s incoherence under value pluralism.  

  ---  

  ### Costly Mistakes & Deductions  
  1. **Collapsing evaluative into motivational crowding** (e.g., "Alex doesn’t *truly* enjoy art").  
     *Deduction*: –4. *Why*: Misreads the case; ignores that enjoyment persists under evaluative loss.  
  2. **Treating Blair’s endorsement as a solution** (e.g., "Blair’s awareness makes her framing acceptable").  
     *Deduction*: –3. *Why*: Ignores that endorsement doesn’t restore deliberative authority.  
  3. **Reducing everything to demandingness** (e.g., "All crowding shows morality is too stringent").  
     *Deduction*: –3. *Why*: Diverts focus from Wolf’s value-pluralist critique.  
  4. **Missing the Authority Principle** (e.g., focusing only on psychological harm).  
     *Deduction*: –3. *Why*: Fails to ground the meta-normative stakes.  

  ---  
  *Assessment design ensures students confront Wolf’s value-pluralist metaphysics, not just applied ethics. The paired case blocks evasion via "happy saint" counterexamples.*
