answer: |-
  Based on your precise description, this dialectical pattern **does not have a single, universally established name** in the philosophical literature. While it touches on familiar concepts (empirical equivalence, underdetermination, argument from ignorance), its dynamic structure—where evidence is introduced, neutralized, and then symmetrically weaponized—is distinct and lacks a standard label. Below, I propose a term, define it rigorously, delimit it from neighboring concepts, and address your specific boundary questions.

  ---

  ### Proposed Term: **Symmetrical Neutralization Gambit (SNG)**
  #### Definition:
  An SNG occurs in a dialectical exchange when:
  1.  **Evidence Introduction (E):** Party A presents evidence *E* as decisively favoring hypothesis *H1* over *H2*.
  2.  **Neutralization Move:** Party B argues that *E* is non-discriminating because *H2* predicts *E* just as well as *H1*, **and crucially**, the reason *H2* predicts *E* *undercuts the probative value* of *E* for distinguishing *H1* from *H2* (e.g., by explaining why *E* would occur even if *H2* were true, despite *E* seeming to contradict *H2*).
  3.  **Symmetrical Conversion:** Both parties then claim the *neutralized status of E* (its failure to discriminate) as *positive evidence* for their own hypothesis:
      *   Party A argues: "The absence of detectable difference (which *E* represents) means *H1* is true."
      *   Party B argues: "The absence of detectable difference (which *E* represents) means *H2* is true."

  #### Conditions of Application:
  1.  **Symmetry in Neutralization:** The neutralization move must apply symmetrically. The reason *H2* predicts *E* must inherently undermine *E*'s ability to confirm *H1* *and* vice-versa conceptually (even if only one side explicitly argues it).
  2.  **Intentional Undercutting:** The neutralization isn't *just* that both hypotheses predict *E*, but that *H2*'s prediction of *E* arises from mechanisms that *explain away* why *E* seems to support *H1* (e.g., fading explains why no fading is reported; copy being distinct explains why it claims identity).
  3.  **Bidirectional Conversion:** Both parties explicitly or implicitly leverage the *neutrality of E* as a *positive reason* for their conclusion. This is the defining "gambit."

  #### What Falls Outside (Delimitation):
  *   **Simple Empirical Equivalence/Underdetermination:** This is static. It notes that *H1* and *H2* are equally supported by *all available evidence*. SNG is dynamic: specific evidence *E* is introduced, neutralized on specific grounds, then repurposed. Underdetermination doesn't capture the *conversion* of neutrality into positive evidence by *both* sides.
  *   **Argument from Ignorance (AfI):** AfI infers *H* from a *lack of evidence against H*. SNG involves converting the *neutralized status of specific positive evidence (E)* into support. While AfI might be *part* of the conversion ("No evidence of fading? That *proves* there *was* no fading!" / "No evidence of fading? That *proves* fading is undetectable!"), SNG captures the full dialectical sequence and symmetry absent in standard AfI.
  *   **Self-Defeating Evidence / Epistemic Circularity:** These often involve *internal* contradictions within a single position or method. SNG involves an *interpersonal dialectic* where evidence is disarmed by an opponent and then repurposed symmetrically.
  *   **Ad Hoc Rescue:** A one-sided maneuver to save a theory from counter-evidence. SNG involves a *mutual* maneuver using the *same* neutralized evidence.
  *   **Cases without Intentional Undercutting:** If *H2* merely happens to predict *E* without the prediction *explaining away E*'s apparent support for *H1*, it's simple empirical equivalence, not SNG. (e.g., Two weather models predicting rain tomorrow is equivalence; one model predicting rain *specifically because its core mechanism renders the rain-reporting instrument unreliable* approaches SNG territory).

  ---

  ### Addressing Your Boundary Questions

  1.  **Does it arise with public/third-person evidence?**
      *   **Yes.** Your duplication case exemplifies this. Public behavior (copy acting like the original, passing tests, claiming identity) is offered as evidence for survival (*H1*). It's neutralized: a distinct duplicate (*H2*) would *also* behave identically *by design*. Both sides then use the indistinguishability: "See, no difference means it *is* the original!" vs. "See, no detectable difference means it *isn't* the original!" The structure is identical regardless of whether the initial evidence is first-person reports or third-person observations.

  2.  **Does it arise whenever hypotheses predict the same datum, or only for reasons undercutting its significance?**
      *   **Only when undercutting reasons are present.** Simple empirical equivalence (both predict *E* for *independent* or *non-undercutting* reasons) lacks the dialectical dynamism and the "gambit." The *undercutting* is crucial. In fading: *H2* (fading) predicts "no report of fading" *because* the fading affects the reporting mechanism, undermining the significance of "no report." In duplication: *H2* (distinct copy) predicts "identical behavior/reports" *because* it was *created* to be identical, undermining the significance of that identity for proving *H1* (survival). This undercutting transforms *E* from apparent proof for *H1* into something consistent with *H2*, enabling the symmetrical conversion.

  3.  **Is the symmetry genuine, or is there a burden asymmetry?**
      *   **The symmetry in the *gambit* is genuine.** Both parties perform the same logical move: converting neutrality into positive support for their view. *However*, there is often a **pragmatic/metaphysical asymmetry in burden of proof** *external* to the SNG itself.
          *   In persistence debates, the *default assumption* (especially under physicalism) might be continuity unless disrupted. Here, the pessimist (*H2*: fading/non-survival) may bear a higher burden to *posit* an undetectable difference. The optimist (*H1*) claims the simpler "no change" view.
          *   In duplication, the default might be that numerically distinct physical entities are distinct persons. Here, the survivalist (*H1*) may bear a higher burden to *posit* identity despite physical discontinuity.
      *   **The SNG *exploits* this asymmetry:** The party with the higher burden uses the neutrality to argue "See, you can't show any difference, so my view (lower burden) stands!" The party with the lower burden uses the neutrality to argue "See, the absence of detectable difference *is exactly what my view predicts* for this scenario, confirming it!" The gambit *itself* is symmetric; the context determines *why* each side feels entitled to make it.

  4.  **What would break the symmetry?**
      *   **Breaking an SNG is exceptionally difficult within the dialectical frame it creates.** Any conceivable *internal* test (relying on reports, behavior, scans, functional analysis) is vulnerable to the same neutralization move ("*H2* predicts *that exact test result* because..."). **Symmetry-breaking likely requires:**
          *   **External Theoretical Virtues:** Appeal to parsimony (don't posit undetectable fading/copy-difference), explanatory unity, or coherence with a broader metaphysical framework (e.g., functionalism favoring persistence, substance dualism or strict identity conditions favoring non-survival in duplication).
          *   **Questioning the Hypotheses/The Setup:** Rejecting the possibility of "silent fading" as incoherent, or rejecting the metaphysical possibility of perfect duplication implying identity. This attacks the *coherence* of *H2* or the scenario itself, rather than finding evidence within it.
          *   **Shifting the Grounds:** Introducing evidence *not* predicted by *both* hypotheses *for undercutting reasons*. For example, if a theory of consciousness *entailed* that replacing neuron type X *would* cause a detectable functional glitch even if functionally identical otherwise, *and* that glitch *didn't* occur during replacement, this *might* favor *H1* (persistence) *without* being predicted by *H2* (fading) in an undercutting way (fading wouldn't predict the *absence* of that specific glitch). Finding such evidence is highly context-dependent and often elusive in these thought experiments.
          *   **Accepting Stalemate:** Concluding that the scenario *is* genuinely underdetermined at the level of empirical evidence, making the choice between *H1* and *H2* a matter of non-evidential philosophical commitment.

  ---

  ### Summary
  The **Symmetrical Neutralization Gambit (SNG)** captures the dynamic dialectical pattern you identified: evidence is introduced as decisive, neutralized because the opposing hypothesis predicts it *for reasons that undermine its significance*, and then the *neutrality itself* is symmetrically claimed as positive evidence by both sides. It arises with any evidence (first- or third-person) susceptible to intentional undercutting neutralization. While pragmatic burdens may exist externally, the gambit itself exploits the resulting neutrality symmetrically. Breaking the symmetry typically requires stepping outside the empirical frame of the thought experiment via theoretical virtues, attacking the coherence of the hypotheses, or finding evidence immune to the specific undercutting mechanism. This pattern is pervasive in hard problems of identity, consciousness, and interpretation precisely because it leverages the fundamental difficulty of accessing the "inner" state (consciousness, personal identity) from the "outer" evidence.
