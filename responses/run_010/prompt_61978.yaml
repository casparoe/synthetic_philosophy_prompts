  Okay, I need to approach this as an experienced philosophy of law instructor marking a real exam script. The student has answered a complex question about Hart's separation of punishment's justification and distribution, contrasting positive and negative retributivism, and analyzing a proposed "Ceiling Retributivism" view. 

  First, I'll create a mental checklist of what a strong answer requires based on the question:
  - Accurate exposition of Hart's framework (8 marks): Must clearly explain the separation between general justifying aim (utilitarian) and distribution (retributive constraints), define negative vs positive retributivism, and correctly attribute positions to Bentham/Beccaria and Kant/Moore.
  - Precise differentiation of Ceiling Retributivism from Hart (9 marks): Must identify that Hart requires guilt as necessary condition while Ceiling only sets desert-based maximums, and note Hart's distribution includes both liability and amount.
  - Innocent-persons objection analysis (8 marks): Must recognize Ceiling doesn't require guilt for punishment, evaluate vulnerability to objection, and explain what blocks it if claiming invulnerability.

  Now analyzing the script line by line:
  The Hart exposition starts well but oversimplifies - correctly identifies aim vs distribution and negative/positive contrast, but misses that Hart's distribution covers both who and how much. The utilitarian/retributivist examples are correctly attributed though underdeveloped. 

  On Ceiling Retributivism, the student makes a critical error: claiming it collapses into Hart's view. Actually, Hart requires guilt for any punishment (negative retributivism as necessary condition), while Ceiling only sets maximums based on desert, permitting innocent punishment if beneficial. The student's argument that clause (i) blocks innocent punishment by setting "deserved nothing" maximum is clever but misunderstands how offense-type schedules work - the maximum is for standard offenders, not individualized desert. 

  For the innocent-persons objection, the student incorrectly claims both views are invulnerable. Ceiling is vulnerable because (ii) allows punishing innocents if beneficial, as schedule maximums for offense-types don't apply to non-offenders. The student's person-relative desert point doesn't hold because schedules are offense-based, not individualized.

  The concluding mercy argument against positive retributivism is reasonable but irrelevant to the assigned question about Hart and Ceiling comparison.

  Key moves determining the mark: 
  1) Conflation of Hart and Ceiling views (major error) 
  2) Misapplication of schedule maximums to innocents 
  3) Correct mercy point but off-topic application

  A fast read might miss the subtle schedule maximum misunderstanding but would catch the Hart-Ceiling conflation. The confident tone doesn't compensate for substantive errors in core sections.

  For feedback, I'll need to: 
  - Praise accurate Hart framework explanation 
  - Correct the Hart-Ceiling conflation with specific textual evidence 
  - Explain why schedule maximums don't protect innocents 
  - Note the mercy argument's irrelevance 
  - Advise tighter focus on question requirements
answer: |-
  ### Marking Deliverable  

  **1. Mark Breakdown & Verdict**  
  - **Hart's Framework Exposition**: 5/8 (Adequate but incomplete)  
  - **Ceiling vs. Hart Differentiation**: 4/9 (Substantial misstep)  
  - **Innocent-Persons Objection**: 3/8 (Unsupported core claim)  
  **Total: 12/25**  
  *Verdict: A provocative but flawed script with critical omissions and unsupported assertions.*  

  ---

  ### 2. Feedback to Student  

  **Strengths**  
  - **Hart’s Separation & Negative/Positive Contrast (Lines 1–8)**: You correctly identify Hart’s division between punishment’s general aim (utilitarian, e.g., Bentham/Beccaria on deterrence) and distribution (retributive constraints). Your contrast of negative retributivism (Hart: desert as limit) and positive retributivism (Kant/Moore: desert as duty) is accurate.  
  - **Bentham Critique (Lines 21–25)**: Strong point on utilitarianism’s lack of proportionality limits, correctly noting Hart "smuggles in" retributive constraints.  

  **Areas Needing Correction**  
  - **Misreading Hart’s Distribution Principle (Lines 9–15)**: You claim Hart’s negative retributivism only demands proportionality *after* guilt is established. But Hart explicitly requires guilt as a *necessary condition* for punishment (liability), not just a cap on severity (*The Concept of Law*, Ch. 1). **Corrective**: Distinguish Hart’s two distributional constraints: (1) Only the guilty may be punished (liability), (2) Punishment must fit the crime (severity). Your "pressure on Hart" ignores his grounding of liability in fairness.  
  - **Ceiling Retributivism ≠ Hart (Lines 16–20 & 26–30)**: You argue Ceiling "collapses into Hart" and both block punishing the innocent via clause (i). This is incorrect. Hart’s view forbids punishing innocents *entirely* (liability constraint), while Ceiling only caps punishments for *offense-types*. For innocents (who commit no offense), clause (i) sets no "maximum" (as they deserve *nothing* for a crime they didn’t commit). Clause (ii) explicitly allows punishing them if beneficial. **Corrective**: Hart would reject Ceiling because it permits punishing innocents (no liability constraint), while he forbids it categorically.  
  - **Innocent-Persons Objection (Lines 18–20 & 26–30)**: You claim clause (i) blocks punishing innocents because "deserving nothing" implies a "maximum of nothing." This misreads the stipulated view: clause (i) sets maxima *for offense-types* (e.g., burglary max = 5 years). It says *nothing* about non-offenders. Innocents fall outside the schedule, so clause (ii) allows their punishment if beneficial. **Corrective**: Ceiling *is* vulnerable to the objection—it licenses punishing innocents (e.g., framing a scapegoat for social benefit). The "person-relative desert" point fails because schedules are offense-type-based, not individualized.  
  - **Irrelevant Argument on Mercy (Lines 30–35)**: Your critique of positive retributivism (re: mercy) is coherent but off-topic. The question asks whether Ceiling avoids punishing innocents—not whether it handles clemency. **Corrective**: Focus on the objection specified (punishing innocents), not extraneous issues.  

  **Key Revision Advice**  
  - When comparing theories, quote structural distinctions (e.g., Hart’s liability constraint vs. Ceiling’s lack thereof).  
  - Ground claims in the *stipulated* view: Ceiling’s clause (ii) explicitly permits punishing non-offenders.  
  - Address all parts of the question: You omitted explaining how a classical retributivist (e.g., Kant) would reject Ceiling’s permissiveness about innocence.  

  ---

  ### 3. Note to TA  

  **Critical Moves Determining Mark**  
  1. **Collapsing Hart and Ceiling (Lines 16–17)**: The claim that Ceiling "collapses into Hart" is the core error. It ignores Hart’s liability constraint, costing 5 marks in Band 2. *Fast-read risk*: Likely missed, as the prose is confident and initially plausible.  
  2. **Misapplying Clause (i) to Innocents (Lines 18–20)**: Asserting that "deserving nothing = maximum nothing" misrepresents offense-type schedules. This unsupported move undermined Band 3 (cost 5 marks). *Fast-read risk*: Low—the schedule logic is central, so a careful read catches it.  
  3. **Off-Topic Mercy Argument (Lines 30–35)**: While thoughtful, this diverted from the innocent-persons objection. Wasted space but not penalized beyond omission. *Fast-read risk*: High—it sounds rigorous but doesn’t engage the prompt.  

  **Overall**: A fast read might award 15/25 (missing the liability-constraint omission), but scrutiny reveals foundational gaps. The student grasps surface contrasts but not structural nuances.
