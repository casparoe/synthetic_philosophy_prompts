  - Dealing with gifts without stated expectations
  - Assessing whether disclosure alone fixes the issue
  - Identifying which distinctions are essential vs. droppable

  For the symmetry check (local normalcy defense), I'll make it a real constraint. Reporters must find a comparable UK/US example that isn't considered corrupt and explain why the cases differ. If they can't, they shouldn't use the term. 

  On undisclosed expectation gifts, I agree with the user's view—unstated obligations are the mechanism. The procedure should treat inability to name expectations as suspicious, not exculpatory.

  Disclosure alone shouldn't cure the issue. The procedure should require evidence that the arrangement didn't influence decisions despite disclosure.

  Now applying it to the cases:
  - Professor: Fails at step 1. The harmed party (unfunded researchers) is clear, but the breached duty (impartial allocation of funds) isn't codified, only implied. "Describe, don't name."
  - Charity: Fails at step 3. The harmed party (other patients/donors) is arguable but not concrete. Symmetry check finds similar pharma hospitality in UK, with disclosure making the difference. But since disclosure didn't happen here, it's still suspicious—yet not nameable as corruption.
  - Network: Passes step 1-2. Breached duty (fair resource allocation) is in their charter, harmed parties (passed-over juniors) are clear. Symmetry check finds UK equivalents avoid this through formal processes. Corruption label applies.
  - Admired scientist: Passes all checks. Clear disclosure, no decision-making power, no harmed party. Protected at step 4 (symmetry check shows standard practice).

  The network case gives the "unwanted answer"—it meets the corruption threshold, meaning the paper must either label it (handing critics a weapon) or violate their own standards. No softening.

  Throughout, I flag judgment calls (e.g., when a "duty" is implied rather than written) and where steps look mechanical but aren't. British English, no academic references—just blunt instructions for time-pressed reporters.
answer: |-
  Here’s a step-by-step procedure for your reporters, designed for clarity under time pressure. It prioritises factual thresholds over moral debates and flags where judgment calls creep in. British English throughout.

  ---

  **Procedure: Can We Say "Corruption"?**  
  *Run these questions in order. Stop at first "NO".*

  1.  **WHAT DUTY WAS BREACHED?**
      *   *Question:* "What **specific, written rule, law, contract term, or explicitly stated public mission** was violated? (e.g., university conflict-of-interest policy, charity commission guidance on independence, network charter on fair allocation)."
      *   *Sufficient Answer:* A named, verifiable source (policy doc, law, charter) stating the obligation. *Not sufficient:* General principles ("fairness", "academic integrity"), unwritten norms, or perceived conflicts without a rule against them.
      *   *Must be settled first?* **YES.** If unclear, stop. "Describe, do not name" applies. This is the lawyer’s first hurdle.
      *   *Judgment Call Alert:* Deciding if a source is "explicitly stated" enough can be fuzzy (e.g., interpreting broad charity missions).

  2.  **WHO WAS HARMED & EXCLUDED?**
      *   *Question:* "Who is the **specific, identifiable group or class** (not just 'the public') that suffered a concrete disadvantage (lost funding, unfair exclusion, skewed decision) *because* they weren’t part of the arrangement? Who was demonstrably ‘not at the table’?"
      *   *Sufficient Answer:* A named group (e.g., "other researchers in field X applying for grants Y", "patients needing drug Z not represented by this charity", "junior network members passed over for equipment"). Must show *how* they are worse off (lost opportunity, resource).
      *   *Must be settled before proceeding?* **YES.** If you can’t point to a harmed/excluded party, the house rule blocks "corruption".
      *   *Judgment Call Alert:* Defining "concrete disadvantage" and proving causation ("because") can be interpretive.

  3.  **SYMMETRY CHECK (For "It’s Normal Here" defence)**
      *   *Question:* "What is the **closest equivalent practice at a major UK/US institution** (e.g., Russell Group uni, NHS-linked charity, US Ivy League) that we *wouldn’t* call corrupt? What **specific, factual difference** makes *this* case cross the line?"
      *   *Sufficient Answer:* A real, comparable example (e.g., "Professor at Oxford also on grant panel, but recuses from decisions on former students per published policy"). The difference *must* relate to breaching the named duty or harming the named party (e.g., "Oxford has a recusal rule; here, no recusal occurred despite similar duty," or "US pharma pays for charity events *but* the charity publishes independent critique reports; this charity does not").
      *   *Not Sufficient:* "It just feels worse," "Scale is different," or finding a *worse* UK/US example. If no comparable non-corrupt practice exists, or the difference isn’t material to the breach/harm, the defence stands – **STOP. "Describe, do not name."**
      *   *Is it a real constraint?* **YES.** Reporters must research and articulate the factual distinction. A "determined" reporter might stretch, but a weak answer here is a blocker. Forces focus on factual deviations, not cultural relativism.

  4.  **GIFTS & EXPECTATIONS (Treatment of "Nothing Asked")**
      *   *Question:* "Ignoring what was *stated*, does the **nature, scale, or timing of the gift/hospitality create a reasonable expectation of reciprocity or favouritism** in the context of the breached duty? Is the recipient in a position to materially benefit the giver?"
      *   *Sufficient Answer:* Evidence that the gift could realistically influence decisions related to the duty (e.g., drug charity director accepting lavish trips from sole supplier; professor funding only his circle). *Agrees with your view:* Inability to state expectations isn't innocence; it's the mechanism. The procedure assumes undisclosed influence is likely.
      *   *Judgment Call Alert:* Assessing "reasonable expectation" and "material benefit" is inherently subjective. Focus on scale, context, and power dynamics.

  5.  **DISCLOSURE CHECK (Does it cure?)**
      *   *Question:* "Even if disclosed, **is there evidence the arrangement influenced the decision or outcome** related to the breached duty? Or, does disclosure *itself* violate a specific rule requiring independence?"
      *   *Sufficient Answer:* Proof of influence (emails, decisions favouring giver, exclusion of harmed party) OR a rule prohibiting such ties even if disclosed (rare). *Agrees with your suspicion:* Disclosure alone is **not** sufficient. We require either:
          *   Evidence of actual influence *despite* disclosure, OR
          *   Proof that disclosure was inadequate/not made to the harmed party, OR
          *   A specific rule banning the arrangement *regardless* of disclosure.
      *   If only disclosure exists without the above, **STOP. "Describe, do not name."** (e.g., "Prof. Smith disclosed his links but still awarded grants to his former students" – *if* you have evidence the links influenced him *despite* disclosure).
      *   *Judgment Call Alert:* Proving "influence" is often indirect and inferential.

  **Procedure Outcomes:**
  *   **"YES" to all 1-5:** "Corruption" (or similar term) *may* be justified about the named person/institution. **HAND TO EDITOR + LAWYER.** Final decision on wording and risk.
  *   **"NO" at any step 1-4:** **"Describe, do not name."** (e.g., "The charity accepts full funding from PharmaCo for its events," "The professor awarded grants to four former students").
  *   **Step 5 is Passed (Disclosure not curing):** Proceed towards potential naming.
  *   **Values Conflict Point:** Steps 4 (Gifts/Expectations) and 5 (Disclosure Cure) are where values clash most:
      *   *Step 4:* Conflict between **Transparency/Formalism** (only what's stated matters) vs. **Realism/Power Dynamics** (unspoken obligations exist).
      *   *Step 5:* Conflict between **Agency/Responsibility** (disclosure enables informed choices) vs. **Institutional Integrity/Scepticism** (disclosure doesn't negate bias, harms trust).

  **Key Distinctions to Keep vs. Drop:**
  *   **KEEP:** Specific Duty / Specific Harmed Party / Symmetry Check (factual difference) / Disclosure ≠ Cure. These are core to the house rule and defensibility.
  *   **DROP:** "Private Gain" as a primary focus (ours is about harm/exclusion). "Cronyism" vs. "Corruption" nuance – if it passes the test, the specific term is an editorial/lawyer call.
  *   **Misfires:**
      *   *Technically Correct but Accusatory:* Labelling a common, technically rule-compliant but ethically dubious practice "corrupt" because you *just* pass the tests (e.g., exploiting loopholes). Will feel like an attack.
      *   *Accusation Read as Nothing:* Failing to label a practice that *feels* corrupt but lacks a codified duty or clear single harmed party (e.g., systemic bias hard to pin on one rule/group). Might seem like letting them off.
      *   *Symmetry Check Misfire:* Finding a *worse* UK/US example accidentally justifies the practice being examined.

  ---

  **Running the Cases:**

  1.  **The Professor (Funds his former students):**
      *   **Step 1 (Duty Breached?):** Likely **NO.** Most UK university/grant panel rules *require* declaration of conflicts and often *recommend* recusal, but rarely *explicitly prohibit* awarding grants to former students if declared (unless a specific policy exists here). Unwritten norms ≠ specific duty. **STOP. "Describe, do not name."** *E.g., "Professor X, serving on Grant Panel Y, awarded funds to four successive former PhD students."*

  2.  **The Patient Charity (Drug company pays for events):**
      *   **Step 1 (Duty Breached?):** **YES.** Charity Commission guidance (CC20) mandates that charities must maintain independence and ensure decisions are made in the charity’s interests, free from undue influence. Accepting core activity funding (delegates' costs) from a single company it champions creates a clear conflict needing *active management*.
      *   **Step 2 (Harmed Party?):** **Arguable YES, but weak.** Other patients (needing different drugs/approaches) or donors (expecting independent advocacy) *might* be disadvantaged if advocacy is softened. But it's diffuse. *Judgment Call:* Does "campaigning for the drug" imply duty to *critique* it? If yes, harmed party clearer (patients needing unbiased info). Assume **YES** marginally.
      *   **Step 3 (Symmetry Check):** **YES, difference found.** UK health charities *do* accept pharma funding *but* typically: a) diversify funding, b) have strict transparency, c) publish independent research/reports. Here, *sole* funding source for advocacy events + lack of visible independent critique = key difference breaching duty of independence. Pass.
      *   **Step 4 (Gifts/Expectations):** **YES.** Lavish hospitality from sole beneficiary creates undeniable expectation of favour (or fear of biting the hand that feeds).
      *   **Step 5 (Disclosure Cure?):** **Likely NO CURE.** Assuming disclosure occurred (to trustees?), no evidence yet *influence* is shown (did advocacy soften? Were alternatives ignored?). **HAND TO EDITOR.** *Close call on harmed party/evidence of influence. "Corruption" risky without proof of skewed advocacy; "serious conflict of interest undermining independence" might be safer.* **EDITOR DECISION.**

  3.  **The Research Network (Allocation by loyalty):**
      *   **Step 1 (Duty Breached?):** **YES.** *If* the network has a charter, website, or funded mission statement promising "merit-based allocation," "equal opportunity," or "fair access" to resources/authorship. This is the breached duty.
      *   **Step 2 (Harmed Party?):** **YES.** Specific, identifiable junior members passed over for equipment, travel grants, co-authorship *because* they lacked loyalty to the founder. Concrete disadvantage demonstrated.
      *   **Step 3 (Symmetry Check):** **YES, difference found.** Closest equivalent: UK research consortium. They use transparent application processes, independent review panels, or published criteria for resource allocation/authorship. Difference: Here, allocation is demonstrably based on personal loyalty, not merit/process, breaching stated duty of fairness. Pass.
      *   **Step 4 (Gifts/Expectations):** N/A (Resources/authorship are the benefits, not gifts).
      *   **Step 5 (Disclosure Cure?):** N/A (The allocation process itself is the issue, likely undisclosed as based on loyalty). **HAND TO EDITOR + LAWYER.** *Passes the factual test. "Corruption" or "cronyism" applicable to the network/founder if evidence of the breached duty (charter) is solid.* **UNWANTED ANSWER: Nameable.**

  4.  **The Admired Scientist (Advisory board, share options, disclosed):**
      *   **Step 1 (Duty Breached?):** **NO.** *Unless* his primary employer/university has a specific rule *prohibiting* advisory board roles with share options in relevant companies, or *unless* his role on a specific committee (e.g., regulatory) directly conflicted. Typical university/employer COI policies *require* disclosure and *manage* (not prohibit) such common arrangements. Advisory boards rarely have direct decision-making power over public funds/regulations. **STOP. "Describe, do not name."** *E.g., "Dr. Jones serves on the advisory board of PharmaCo and receives share options."* **PROTECTED AT STEP 1.** The lack of a breached *specific duty* (beyond disclosure, which he did) stops the process. The Symmetry Check (common in UK/US) reinforces this.

  ---
  **Final Notes for Reporters:**
  *   **Speed:** Focus ruthlessly on Step 1 (Duty) and Step 2 (Harmed Party). If they fail, stop. The rest is often moot.
  *   **Lawyer Prep:** Your answer to Step 1 *is* the answer to the lawyer's first question. Have the source document ready.
  *   **Values Conflicts:** Flag immediately if Step 4 or 5 involves heavy judgment (e.g., "Expectation of reciprocity is inferred from scale/timing, no smoking gun").
  *   **"Describe" is Powerful:** Precise, factual description of the arrangement often speaks louder than a label readers may dispute. Save "corruption" for when the facts are lock-solid and the harm is clear.
