  I'll structure the memo concisely: first naming the problem transparently, then recommending the holistic standard with clear criteria for curators. For counterarguments, I'll acknowledge that yes, all attributions are interpretive constructs - but the holistic approach makes this explicit while creating accountability. For the user's teacher, I'll emphasize that personal authority must be contextualized within broader evidence.

