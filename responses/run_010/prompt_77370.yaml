prompt: |-
  I'm co-running our department's logic-and-language reading group this term and we've spent the last three weeks on Lewis's triviality results — the original paper and the sequel. It's gone sideways. Half the room is philosophy people, half are folks from the probabilistic-reasoning group down the hall who wandered in because they thought "the probability of 'if A, C' should just be the probability of C given A" was an obvious design goal for anything that reasons under uncertainty (they call it the Adams thesis and think it's settled). Now the two camps are talking past each other: the philosophers say any connective satisfying that identity for *every* probability function collapses into triviality, so the identity can't be a semantic thesis at all; the ML people say fine, then just fix one distribution and be done with it, and nobody in the room can articulate why thats a cheat. Three sessions in and we still don't agree on what would count as a good answer, which makes it impossible to evaluate the answers actually on offer.

  So for week four I want to hand out a one-page spec instead of another argument. Act as a philosopher of language who has genuinely worked on conditionals, not someone summarizing an encyclopedia entry, and think it through carefully — I want you to be willing to tell me that some of what we've been fighting about isn't a real requirement. Start by brainstorming a longer list of desiderata than you'd keep, then cut it down and tell me what you cut and why. For each survivor give the concrete case that motivates it: the example an account failing that requirement gets wrong (the poker one everyone keeps bringing up, the nested modus-ponens ones, whatever you judge load-bearing), plus a verdict on whether it's non-negotiable or just the taste of one camp. Where two of them cannot be jointly satisfied, mark the pair explicitly — that's the part of the handout I most want, because it would explain why the room's been going in circles.

  Here's what I've got from our arguments so far, and I've definately got the wrong end of the stick on some of these. Be blunt about which entries are confused, redundant, or question-begging, and add whatever's missing:

  1. The identity P(A→C) = P(C|A) holds for every probability function a rational agent might have, not just special ones.
  2. If you come to be certain of A, your new degree of belief in A→C should equal your old P(C|A) — updating should be gentle in exactly that sense.
  3. The conditional embeds: you can negate it, disjoin it, and put conditionals in the antecedents of other conditionals, and all of that gets an interpretation instead of being ruled out as ill-formed.
  4. Modus ponens is unrestrictedly valid for it.
  5. Indicatives and subjunctives are the same connective in different epistemic settings, so a good account generalizes to counterfactuals for free.
  6. It explains why asserting "if A, C" sounds weird when you already know A, or already know not-A, and it doesn't just wave that off as pragmatics.
  7. It allows you to be more confident in A→C than in either A or C, and explains how that's possible.
  8. It delivers truth conditions — the conditional expresses a proposition with a truth value, so ordinary compositional semantics applies.
  9. Two conditionals sharing an antecedent but with contradictory consequents can't both be acceptable on the same evidence.
  10. It doesn't require a similarity metric over worlds, since that's the part everyone finds mysterious.

  Then, briefly: which single one of these knocks out the most of the currently popular accounts, and what would you tell the probabilistic-reasoning people to build instead, given that the unrestricted identity is off the table? Two paragraphs on that, no lecture, and no reading list or bibliography — I'll assign the papers myself.
reasoning: |-
  Okay, the user is running a reading group on Lewis's triviality results, and there's a conflict between philosophers and probabilistic reasoning folks. The philosophers argue that the identity P(A→C) = P(C|A) can't hold for all probability functions without collapsing into triviality. The ML group thinks fixing one distribution solves the problem. The user wants a one-page spec with desiderata for conditionals, highlighting conflicts and non-negotiables.

  First, I need to address each of their ten points. Let me start by brainstorming a longer list of desiderata and then narrow it down. The user mentioned examples like poker, nested modus ponens, so those should be included. Key conflicts are embedding vs. probability identity, unrestricted modus ponens vs. probability laws, and truth conditions vs. Adams' thesis.

  Looking at point 1: The universal probability identity. Lewis showed this leads to triviality. So this can't be required. The ML group might accept a fixed distribution, but philosophers argue that probability should be about the agent's state, not a fixed one. So point 1 is problematic and needs to be marked as conflicting with others.

  Point 2: Gentle updating. This is important because if you learn A, your belief in A→C should match the prior conditional probability. This is the Ramsey test idea. Non-negotiable for both camps? But if the conditional isn't a proposition, updating might not work as stated. So conflicts with point 8 (truth conditions).

  Point 3: Embedding. Philosophers want conditionals to embed in complex sentences. But if P(A→C)=P(C|A), embedding leads to issues. For example, negating a conditional might not make sense if conditionals aren't propositions. So this conflicts with point 1 and 8. The poker example: "If it's a full house, I lose" vs. "It's not a full house" – how to handle negation here.

  Point 4: Unrestricted modus ponens. This seems essential but clashes with probability. Lewis's results show that if MP holds in all contexts and probability identity holds, triviality follows. Also, in McGee's counterexamples, modus ponens fails for nested conditionals. So this might not be tenable universally. Mark conflict with point 1.

  Point 5: Indicatives and subjunctives same connective. This is a bridge too far. Counterfactuals involve similarity metrics, which the user wants to avoid (point 10). Also, subjunctives aren't assessed the same way probabilistically. So cut this as unnecessary.

  Point 6: Assertability conditions. Knowing A or not-A makes asserting the conditional weird. This is important for pragmatics. Both camps might agree here. But it's more about use than semantics, so maybe not a core semantic requirement.

  Point 7: Confidence exceeding antecedents/consequents. This happens, e.g., "If the gardener didn't do it, the butler did" – more confident in the conditional than in who did it. Supports the conditional not being material implication. Non-negotiable.

  Point 8: Truth conditions. Philosophers insist for compositionality; probabilistic group might accept non-propositional. But embedding (point 3) requires truth conditions? Not necessarily – dynamic semantics might handle embedding differently. Conflict with point 1 and 2.

  Point 9: Incompatible consequents. If A→C and A→not-C, they can't both be true. Related to conditional excluded middle, which counterfactuals might allow but indicatives not. Non-negotiably true for indicatives.

  Point 10: No similarity metric. Important because ML folks find similarity mysterious. But counterfactuals need it. Since point 5 is cut, this can stay for indicatives.

  Now, conflicts: 
  - 1 (universal prob) conflicts with 3 (embedding), 8 (truth conditions), and 4 (modus ponens).
  - 2 (gentle updating) conflicts with 8 if conditionals aren't propositions.
  - 3 and 8 together might be necessary for embedding, but clash with prob identity.
  - 7 is possible only if conditionals aren't material, which most agree on.

  Survivors: 
  - Keep 2: Gentle updating (Ramsey test) – motivated by learning scenarios.
  - Keep 3: Embedding – needed for complex reasoning, e.g., nested conditionals in logic.
  - Keep 6: Assertability – knowing A makes asserting "if A" odd, e.g., "If it's raining, the match is canceled" when you know it's raining.
  - Keep 7: Confidence exceeding – the whodunit example.
  - Keep 9: Incompatible consequents – can't have both "if A, C" and "if A, not-C" acceptable.
  - Keep 10: No similarity metric for indicatives.

  Cut: 
  - 1: Universal probability – leads to triviality, so impossible.
  - 4: Unrestricted modus ponens – fails in McGee cases.
  - 5: Indicatives/subjunctives same – too strong, different mechanisms.
  - 8: Truth conditions – optional if embedding is handled otherwise.

  Point 8 is tricky. If dropped, embedding might be handled with dynamic approaches. But philosophers might insist. Mark as a key conflict area.

  Single knockout requirement: Embedding (point 3). It kills Adams-style accounts (no truth values), Stalnaker (with similarity), and trivially any probabilistic approach wanting universal identity.

  Advice to ML group: Use Adams' thesis (P(if A,C)=P(C|A)) for simple conditionals but avoid embedding. For complex cases, use a suppositional system where conditionals aren't propositions. Or use a context-dependent truth-conditional account but accept that the probability identity isn't universal. Focus on the distribution at hand for practical purposes, acknowledging theoretical limitations.
answer: |-
  ### Spec for a Viable Conditional: Desiderata & Conflicts  
  *Cutting through the deadlock requires separating negotiable preferences from non-negotiable failures. Below: desiderata that survive scrutiny (with motivating cases), conflicts flagged, and confused/eliminated items. Philosophers prioritize logic/embedding; probabilistic group prioritizes uncertainty dynamics. Neither gets everything.*

  #### Survivors (Non-Negotiables in Bold)  
  1. **Embedding**: Conditionals nest in complex sentences (negation, disjunction, antecedents).  
     - *Motivation*: "If the match is cancelled if it rains, we’ll go to the cinema" must have a coherent reading (nested modus ponens test). Failure here makes reasoning about conditionals impossible (e.g., Gibbard’s poker: "If you have a full house, I lose" vs. "You don’t have a full house" — denying one shouldn’t entail the other). **Non-negotiable for logic**.  
     - *Conflict*: Directly clashes with (1) and (8).  

  2. **Gentle Update (Ramsey Test Lite)**: If you learn *A*, your new credence in *A*→*C* should match your old *P*(*C*|*A*).  
     - *Motivation*: Learning your partner is cheating (*A*), your new belief in "If they cheated, they’ll confess" (*A*→*C*) should reflect your prior suspicion (*P*(*C*|*A*)). **Non-negotiable for dynamics**.  
     - *Conflict*: Tensions with (8) — if conditionals express propositions, updating *should* work this way, but probability laws may forbid it (Lewis).  

  3. **Confidence Exceeds Components**: *P*(*A*→*C*) can be high while *P*(*A*) and *P*(*C*) are low.  
     - *Motivation*: Whodunit case: "If the gardener didn’t do it, the butler did" (*¬G*→*B*) can be >0.9 while *P*(*¬G*) = 0.4 and *P*(*B*) = 0.3. Failure implies the conditional is material implication. **Non-negotiable for both camps**.  

  4. **Assertability Constraints**: Asserting *A*→*C* is infelicitous when *A* is known true/false.  
     - *Motivation*: Knowing it rained, saying "If it rained, the match was cancelled" is redundant/misleading (Grice’s "spelling it out"). Pragmatics alone can’t explain the *strength* of the effect. **Non-negotiable for use**.  

  5. **Incompatible Consequents**: *A*→*C* and *A*→¬*C* can’t both be acceptable on the same evidence.  
     - *Motivation*: "If Biden runs, he’ll win" and "If Biden runs, he’ll lose" can’t both be rationally held. **Non-negotiable for rationality**.  

  6. **No Similarity Metric (for Indicatives)**: Accounts shouldn’t rely on vague "closeness" of worlds.  
     - *Motivation*: Indicatives ("If it rains tomorrow, the match is cancelled") depend on *epistemic* state, not metaphysical "similarity" (unlike subjunctives). **Negotiable taste (philosophers hate mystery; ML finds it useful for counterfactuals)**.  

  #### Cut Items (Confused, Redundant, or Impossibilities)  
  - **Cut (1) Universal Probability Identity**: Lewis proved it yields triviality — it *can’t* hold for all *P*. Keeping it is begging the question.  
  - **Cut (4) Unrestricted Modus Ponens**: McGee’s counterexample (e.g., "If a Republican wins, if Reagan doesn’t win, Anderson will" ⊭ "If Reagan doesn’t win, Anderson will") shows it fails for embedded cases. **Redundant if (3) embedding survives**.  
  - **Cut (5) Indicatives = Subjunctives**: Subjunctives ("If Oswald hadn’t shot Kennedy...") require similarity metrics (→ violates (10)) and violate probability dynamics (e.g., *P*(*C*|*A*) undefined for false *A*). **Overreach**.  
  - **Cut (8) Truth Conditions**: Not essential — dynamic semantics (e.g., update potentials) handle embedding without truth values. **Taste-based (philosophers want propositions; probabilists want expressiveness)**.  

  #### Key Conflicts  
  - **Embedding (3) + Truth Conditions (8) → Collapse with Probability Identity (1)**. Lewis’s triviality: if *A*→*C* is a proposition and *P*(*A*→*C*) = *P*(*C*|*A*) for all *P*, then *P*(*C*|*A*) = *P*(*C*).  
  - **Gentle Update (2) + Truth Conditions (8) → Triviality under Iteration**. Updating on sequences of conditionals forces *P* to become incoherent.  
  - **Embedding (3) + Probability Dynamics (1/2) → Impossible for Propositional Accounts**. If conditionals embed, they can’t *both* satisfy Ramsey-test updates *and* avoid triviality (e.g., Bradley’s puzzles).  

  ---  
  ### Knockout Requirement & Advice for Probabilistic Group  
  **Embedding (3) is the killer**. It sinks Adams-style no-truth-value accounts (which block embedding), Stalnaker (similarity clashes with (10)), and trivializes any truth-conditional approach with (1).  

  **To the probabilistic group**: Drop (1) and (8). Use Adams’ thesis (*P*(*A*→*C*) = *P*(*C*|*A*)) as a *local* constraint for atomic conditionals under your *current* distribution, not universal semantics. For embedding, adopt a two-tier system:  
  1. **Base layer**: Suppositional conditionals (à la Adams) for simple *A*→*C*, satisfying (2) and (7).  
  2. **Embedding layer**: Use probabilistic modal operators (e.g., "It’s likely that if *A*, *C*") or dynamic semantics (Veltman) for complex cases.  
  This preserves uncertainty reasoning without requiring global truth conditions or universal probabilities. It’s not "cheating" — it’s respecting computational and logical boundaries. Build *that* bridge.
