prompt: |-
  I cover science and ideas for a general-interest magazine, and over the past several years I have found myself reporting on the same structural problem without having a name for it. I would like to know whether one exists, and if not, what the thing should be called.

  The pattern is this. A technical term leaves the discipline that produced it and travels outward by a chain of small, individually defensible analogies. Each new user adopts the word because it fits their case roughly the way it fit the case they borrowed it from, and each extension is reasonable when judged only against its immediate predecessor. But the chain has no shared core: the usage at the far end has nothing in common with the usage at the near end except a route of pairwise resemblances running through the middle. Two people can then use the same word in the same sentence, cite the same founding literature, and be asserting incompatible things.

  Two cases I have covered. First, resilience, which begins in materials work as the capacity to absorb energy and return to an original shape; becomes in ecology the capacity of a system to absorb disturbance and retain its function and organization rather than return to a prior state — already close to the opposite of the first, since one is about coming back and the other about persisting precisely by not coming back; becomes social-ecological resilience, then community resilience in disaster preparedness, then resilience as a property of individuals in psychology, and finally a word applied to supply chains, power grids, and, in a municipal arts funding document I read last year, to the morale of a theatre company. Second, trauma, which moves from physical injury, to an overwhelming psychological event, to cumulative childhood adversity tallied on a checklist, to harm carried across generations within a population, to the effects of a news cycle or a contentious school board meeting. I want to stress that I am not alleging fraud at any step: the intermediate usages are real, productive, and used by serious people.

  What turns this into a problem rather than ordinary semantic change is that institutions are keyed to the word. A single funding program, a single index, a single statutory definition, or a single dataset running across thirty years treats every link in the chain as one quantity. So a comparison of resilience in 1995 with resilience in 2024 may be a comparison of incompatible properties under one label, and no one can say in which year the change occurred, because it never occurred all at once.

  A biologist I interviewed said the structure reminds him of what is supposed to happen in a ring species: populations arrayed around a barrier, each able to interbreed with the next, while the two ends of the ring cannot interbreed at all — non-transitivity of sameness-of-kind with no boundary you can point to. The standard textbook case is a salamander whose populations ring California's Central Valley. I have also been told by other biologists that genuine cases are rarer and messier than textbooks imply, so I do not know how far the analogy travels; but the shape is what I keep meeting in concepts rather than in organisms.

  My editor's response is that this is simply family resemblance, that all concepts work this way, and that I am demanding a precision ordinary language never had. That may be right, but I want it argued rather than announced, and in particular I want to know whether the family-resemblance picture actually licenses a serial chain of this kind or whether it presupposes something denser — cross-links binding distant usages to one another, not merely a route through adjacent ones.

  So, specifically: is there an established term, in philosophy of language, linguistics, science and technology studies, or the methodology of the social sciences, for drift by adjacency under a single load-bearing label? Where the nearest candidates fall short, name them and say exactly how — I can think of the general idea of a concept widening over time, and of the error of assuming one label picks out one thing, but neither seems to capture the stepwise, non-transitive structure or its consequences for measurement. If nothing fits, coin a term, define it, and mark its edges: what would count as a benign extension rather than this; whether the phenomenon has a determinate starting point in the chain or none at all; and whether it can arise inside a single discipline or only at disciplinary boundaries. Finally, tell me whether there is a diagnostic a reporter could actually apply — something checkable in a document, an interview, or a time series — that separates a healthy family-resemblance concept from a chain of this kind. A label by itself will not let me write the piece.
reasoning: |-
  Okay, the user is a science and ideas journalist for a general-interest magazine. They've noticed a recurring pattern where technical terms evolve through a series of analogies, leading to incompatible meanings under the same label. They've covered examples like "resilience" and "trauma," where each step seems reasonable, but the endpoints are fundamentally different. The problem is institutional: funding programs, indexes, and datasets treat these evolving concepts as a single quantity, making comparisons over time invalid. 

  The user's editor dismisses this as normal "family resemblance" in language, but the journalist suspects there's more structure here. They want to know if there's a specific term for this phenomenon—drift by adjacency under a load-bearing label—or if they need to coin one. They also need a practical diagnostic tool to identify such cases in reporting. 

  First, I recall Wittgenstein's "family resemblance" concept, where meanings are connected by overlapping similarities without a single core. But the journalist is right to question whether it fully explains *serial chains* with non-transitive drift. Family resemblances are more like networks with crisscrossing links; here, the connections are linear and stepwise, like a game of telephone. 

  The ring species analogy from biology is apt: adjacent populations interbreed, but endpoints don’t. In linguistics, "semantic shift" is too broad—it doesn’t capture the *chain structure* or institutional consequences. "Creeping redefinition" feels close but lacks the non-transitive element. "Conceptual slippage" is vague. 

  Maybe "semantic chain drift"? But that’s clunky. "Conceptual ring species" borrows the biology metaphor but might confuse readers. The key is the *serial adjacency* and *institutional reification*. So: **reificatory chain drift**. It highlights the stepwise drift + institutional freezing of the concept. 

  For diagnostics, the user needs concrete red flags:  
  - **Temporal comparisons** where a metric is applied across eras (e.g., "resilience in 1995 vs. 2024").  
  - **Citation chains** that invoke foundational texts but stretch the concept beyond recognition.  
  - **Definitional voids** where no one defines the term because "everyone knows" it, yet usage varies wildly.  
  - **Boundary conflicts** where experts dispute whether a new case qualifies (e.g., "Is a stressful meeting *trauma*?").  

  The user’s skepticism about family resemblance is spot-on. Wittgenstein’s examples (like "games") have cross-cutting similarities—a net, not a chain. Serial drift lacks those stabilizing links, making collapse inevitable when endpoints meet.  

  Finally, the phenomenon *can* happen within a discipline (e.g., psychology stretching "trauma"), not just at boundaries. It starts when a term gains institutional weight—funding, laws, datasets—that locks in the label while meanings slosh beneath it.  

  Actionable advice for the journalist:  
  1. Trace citation histories—find the first paper, then track how each study cites the next while shifting meaning.  
  2. Flag when a term is used *without definition* in policy/funding docs.  
  3. Interview experts from both ends of the chain (e.g., a materials scientist + an arts administrator on "resilience"). Their confusion will reveal the drift.  

  This isn’t just pedantry; it’s about measurement validity. When a city uses "resilience" for theater morale *and* grid stability, disaster funding gets misallocated. The stakes are real.
answer: |-
  Based on your detailed description, this phenomenon **does not have a universally established term**, but it intersects several concepts in philosophy of language, linguistics, and STS (Science and Technology Studies). The closest existing frameworks fall short of capturing the *stepwise, non-transitive drift under institutional reification* that you’ve observed. Below is a breakdown, a proposed term, diagnostics, and conceptual boundaries.

  ### Why Existing Terms Fall Short
  1. **Semantic Shift/Widening**:  
     - **Shortfall**: Captures general meaning change over time (e.g., "trauma" expanding from physical to psychological injury) but ignores the **chain structure** and **non-transitivity**. It doesn’t address how pairwise analogies create incompatibility between endpoints, nor institutional reification.
     
  2. **Family Resemblance (Wittgenstein)**:  
     - **Shortfall**: Describes concepts with no essential core but overlapping similarities (e.g., "games"). However, it implies a **network of crisscrossing similarities** – not a linear chain. Your editor is wrong: family resemblance *presupposes denser cross-links*, making endpoints relatable through multiple paths. Serial chains lack this density, allowing endpoints to share no direct resemblance. Wittgenstein’s model doesn’t account for **institutional enforcement of a single label** across incompatible usages.

  3. **Concept Creep (Haslam, 2016)**:  
     - **Shortfall**: Focuses on vertical/horizontal expansion of harm-related concepts (e.g., "trauma" broadening) but emphasizes *value-driven dilution* (e.g., medicalizing distress). It misses the **structural mechanism** (stepwise analogy) and **institutional measurement problems**.

  4. **Boundary Object (STS, Star & Griesemer)**:  
     - **Shortfall**: Terms flexible enough to mean different things across communities (e.g., "resilience" in ecology vs. engineering). But boundary objects *thrive on interpretive flexibility*, while your cases involve **institutional rigidity** – datasets or laws forcing divergent usages into one measurable category.

  5. **Ring Species Analogy**:  
     - **Insightful but imperfect**: Captures non-transitivity (A=B, B=C, A≠C) but is biological, not conceptual. Real ring species are rare, and concepts lack "reproductive barriers" – meaning chains can retrace or branch.

  ---

  ### Proposed Term: **Reificatory Chain Drift (RCD)**  
  **Definition**:  
  The process by which a technical term, through a series of locally reasonable analogical extensions, accumulates non-transitive meaning shifts, while institutions (funding bodies, laws, datasets) reify it as a single, stable entity – enabling invalid comparisons across time or context.  

  **Key Components**:  
  - **Chain Drift**: Sequential meaning shifts via pairwise analogy (A→B→C→D), where A and D are incompatible.  
  - **Reificatory**: Institutions "freeze" the term as measurable/actionable, masking drift (e.g., a "resilience index" applied to ecosystems and theater companies).  
  - **Non-Transitivity**: Sameness of meaning is not preserved across the chain (like a ring species).  

  **Edges and Boundaries**:  
  - **Benign vs. Problematic**:  
    - *Benign*: Expansions with cross-linking resemblances (family resemblance) or clear subtypes (e.g., "virus" in biology/computing).  
    - *RCD*: No direct resemblance between endpoints; drift is linear and stepwise.  
  - **Starting Point**: No determinate origin. RCD begins when a term gains **institutional weight** (funding, measurement) *during* drift.  
  - **Scope**: Can occur *within* disciplines (e.g., psychology stretching "trauma") or across boundaries. Accelerates when terms enter policy/popular discourse.  

  ---

  ### Diagnostic Checklist for Journalists  
  To identify RCD (not just semantic change), look for:  

  1. **The Citation Paradox**:  
     - Actors cite the same foundational text (e.g., Holling’s 1973 resilience paper) but describe incompatible practices.  
     - *Check*: Compare definitions in 5 recent papers using the term. Do they cite shared sources but disagree on core features?  

  2. **Temporal Incommensurability**:  
     - Institutions measure "the same thing" over time, but historical vs. current usages are functionally unrelated.  
     - *Check*: Does a 1995 dataset measuring "X" use methods incompatible with a 2024 "X" index? (e.g., ecological resilience vs. community morale).  

  3. **Analogical Step-Tracing**:  
     - Interviews reveal a chain: "We adapted term Y from [Field A] because it’s *like* our case in [Field B]."  
     - *Check*: Map the analogical justifications. Are there >3 steps? Do endpoints share no features?  

  4. **Boundary Disputes Without Resolution**:  
     - Experts agree on adjacent uses but clash violently on distant ones (e.g., materials scientists vs. arts administrators on "resilience").  
     - *Check*: Is consensus possible only between direct "neighbors" in the chain?  

  5. **Institutional Rigidity**:  
     - Funding calls, laws, or datasets use the term without defining it, presuming universality.  
     - *Check*: Does a policy document invoke "trauma-informed care" while omitting criteria for what counts as trauma?  

  ---

  ### Why This Matters for Your Reporting  
  RCD isn’t just linguistic curiosity – it has real-world consequences:  
  - **Misallocated resources**: Disaster funding for "community resilience" might prioritize theater morale over flood defenses.  
  - **Invalid metrics**: Comparing "trauma" prevalence in 1980s vs. 2020s misleads policy if definitions drifted.  
  - **Expert dismissal**: Scientists reject valid work because endpoint usages seem absurd (e.g., "That’s not *real* resilience!").  

  Your examples (resilience, trauma) are textbook RCD. The solution isn’t banning analogical extension but **institutional humility**: datasets should footnote definitional shifts, and funders should specify which "flavor" of a term they mean.  

  **Final Note**: RCD is likely accelerating as science becomes more interdisciplinary and policy-oriented. Naming it lets you investigate not just *that* it happens, but *how* it distorts decisions – which is the heart of science journalism. Use the diagnostics to trace chains in your next investigation.
