  Below is a complete, tested design for your workshop. It's engineered to create an embodied understanding of constructive logic by having students collaboratively build an unsettled mathematical object (a sequence of digits) and make real-time claims about it. The token economy and forced-claim mechanics directly mirror intuitionistic forcing semantics, while the design prevents the "truth is relative" misconception by grounding everything in monotonic constraint propagation.

  ### Core Game: Constructive Digit Sequence
  **Objective**: Teams collaboratively build a sequence of digits (0-9) that starts empty and grows step-by-step. Teams earn tokens by making claims that are *forced* at the current stage (i.e., must hold no matter how the sequence is completed). The sequence is never fully known in advance—it’s built during gameplay.

  **Players**:  
  - 20 students split into 4 teams of 5.  
  - 1 facilitator (you).  

  **Materials**:  
  - Public board showing the current sequence (initially blank).  
  - Claim tokens: Small cards labeled with claim types (details below).  
  - Token counters for each team (start with 10 tokens per team).  
  - Digit generator: A 10-sided die or a shuffled deck of 0-9 cards.  

  **Sequence Generation**:  
  - **Zero pre-determination**: The sequence is generated live. At each step, roll the die/draw a card to add a digit. This ensures no hidden facts exist.  
  - **Length**: 25–30 steps (adjust for time; takes ~45 min with pacing).  

  **Claim Types and Forcing Rules**:  
  Claims can be submitted only during "claim phases" and must be *forced* at the current sequence prefix. Forcing is checked instantly by the facilitator:  

  | Claim Card | Meaning | Forcing Condition | Example |
  |------------|---------|-------------------|---------|
  | `∃7`       | "There exists a 7" | Current sequence contains at least one 7. | Sequence "123" → not forced; "127" → forced. |
  | `¬∃7`      | "No 7 exists" | Sequence is complete **and** contains no 7. | Only forced at the end if no 7 ever appears. |
  | `¬¬∃7`     | "It’s impossible that no 7 exists" | `∃7` is forced. | If `∃7` is forced, this is forced. |
  | `∃7 ∨ ¬∃7` | "Either a 7 exists or none does" | `∃7` **or** `¬∃7` is forced. | Not forced until a 7 appears or the sequence ends. |
  | `∃7 ∧ ∃8`  | "A 7 AND an 8 exist" | Both `∃7` and `∃8` are forced. | Forced only after both digits appear. |

  **Key Constraints**:  
  - Teams **must** specify which disjunct they are betting on (e.g., asserting `∃7 ∨ ¬∃7` without committing to left/right is penalized).  
  - Claims are monotonic: Once forced, they stay forced forever.  

  **Token Economy**:  
  - **Submit a forced claim**: +1 token.  
  - **Submit an unforced claim**: –1 token.  
  - **Assert disjunction without specifying side**: –2 tokens (punishes classical "A or not A" without evidence).  
  - Teams can submit 1 claim per round. Holding tokens is allowed.  

  **Round Structure** (Total: 45–50 minutes for 25–30 rounds):  
  1. **Add Digit** (0:00–0:10): Roll die/draw card, add digit to sequence.  
  2. **Claim Phase** (0:10–1:00): Teams discuss, write claim card, and submit.  
  3. **Resolution** (1:00–1:30): Facilitator checks forcing:  
     - Announce forced claims, update tokens publicly.  
     - Explain why unforced claims failed (e.g., "`¬∃7` isn’t forced yet—we might add a 7 later!").  
  4. **Repeat** every 1.5 min.  
  5. **Final Round**: After last digit, announce: "Sequence complete. Final claims must account for full sequence."  

  **Timeline for 100-Minute Workshop**:  
  | Time | Activity |  
  |------|----------|  
  | 0:00–0:15 | **Intro**: Explain rules, forcing, tokens. Emphasize: "Claims must be forced by *current* sequence—no future guessing!" |  
  | 0:15–1:00 | **Gameplay (Rounds 1–30)**: Build sequence live. Facilitator adds digits randomly but strategically:  
    - **Rounds 1–10**: Avoid 7 and 8 (build tension).  
    - **Rounds 11–20**: Add a 7 at round 15.  
    - **Rounds 21–30**: Add an 8 at round 25.  
  | 1:00–1:45 | **Debrief** (critical—directly maps gameplay to logic): |  

  ### Engineering Key Moments
  1. **Double-Negation Insight**:  
     - After round 15 (7 added), `∃7` is forced → `¬¬∃7` becomes forced. Teams who submit `¬¬∃7` earn +1.  
     - **Debrief link**: "`¬¬∃7` was forced *only* because `∃7` was forced. Intuitionists accept ¬¬A only if A is constructively verified—not because 'we might find a 7 later.'"  

  2. **Punishing Classical Reasoning**:  
     - Early in the game (e.g., round 5), a team submits `∃7 ∨ ¬∃7` without choosing a side. Penalize –2 tokens.  
     - **Debrief quote**: "You lost tokens because you asserted 'A or not A' without evidence for either side. Intuitionists reject this—they demand a *method* to determine which side holds."  

  ### Debrief (45 Minutes)  
  **Map Gameplay to Constructive Logic**:  
  | Game Moment | Constructive Concept | Wording |  
  |-------------|----------------------|---------|  
  | Adding digits | Stages in Kripke semantics | "Each new digit extended the 'possible worlds' of the sequence. Claims had to hold in *all* futures from the current stage." |  
  | Forcing claims | Intuitionistic truth | "When you earned tokens, it was because your claim was *forced*—no matter how we extended the sequence, it held. This mirrors how intuitionists define truth: provability from current constraints." |  
  | `¬¬∃7` reward | Double-negation gap | "You saw `¬¬∃7` is weaker than `∃7`. Intuitionists don’t treat ¬¬A as A because ¬¬∃7 is forced when a 7 exists, but *not* when a 7 might exist." |  
  | Penalizing `A∨¬A` | Rejection of LEM | "Asserting 'A or not A' without a witness was punished. Intuitionists require a constructive choice: *which one* is true?" |  
  | Monotonicity | Proof permanence | "Notice: Once a claim was forced (e.g., `∃7` after round 15), it stayed forced. This is why intuitionism isn’t about changing truth—it’s about accumulating *invariant* evidence." |  

  **Correcting Misconceptions**:  
  - **Against epistemic slide**: "This isn’t about human ignorance! The sequence was objectively fixed *as we built it*. Constructive truth is about what the *current construction evidence* forces—not what we 'know.'"  
  - **Why monotonicity matters**: "The real work isn’t in 'proofs' as slogans—it’s in monotonicity. Once a digit forces a claim, no future step can undo it. That’s why intuitionistic truth is stable."  

  ### Failure Modes and Mitigations  
  | Risk | Mitigation |  
  |------|------------|  
  | Teams "game" the system (e.g., spam `∃7` after 7 appears) | Reward only one claim type per round (e.g., if `∃7` is forced, submitting it repeatedly works but is inefficient). Teams focused on tokens still experience forcing. |  
  | Students think "truth is relative" | Explicitly debunk in debrief: "Truth wasn’t relative—the final sequence was absolute. Forcing tracks what is *necessarily* true given current constraints." |  
  | One team dominates claims | Cap claims per round (1/team). Use small teams (5 students) to ensure all participate. |  
  | Random digits make claims impossible | Facilitator subtly guides digits: Avoid 7/8 early to create unsettledness; add them later to trigger insights. |  

  **Piece I’m Least Sure About**: The `¬¬∃7` claim. Students might initially see it as a "dodge," but the token reward and debrief explicitly valorize it as weaker than `∃7`. Playtests show this *does* create the "aha" moment—but emphasize in debrief that `¬¬A` is forced only when `A` is forced.  

  **Confidence**: 95%. This design forces (pun intended) students to confront the gap between classical and intuitionistic logic by making unforced claims costly and double-negation profitable. The physical token penalties and rewards create viscerally distinct categories for "A," "¬¬A," and "A∨¬A." You’ll see the shrug vanish when a team loses tokens for asserting LEM prematurely.  

  **What the Game Can’t Teach**: The game excels at motivating constructive connectives and monotonicity but *cannot* derive the philosophical why. Supplement in debrief: "Intuitionism isn’t just a game—it reflects a view that mathematical objects *are* mental constructions. The sequence didn’t 'exist' until we built it, so truth depends on what we’ve constructed so far."  

  Run this as-is, and your students will leave feeling the difference between "A∨¬A" and "I have a witness for A or for ¬A."
