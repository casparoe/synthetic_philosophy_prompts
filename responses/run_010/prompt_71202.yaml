prompt: |-
  After eleven hours of argument with a friend about superrationality, we have agreed to stop and produce the document an adversarial collaboration between us ought to yield. He is a committed superrationalist; I am a committed causal decision theorist. Work from the case we were fighting over: a hundred people on a departmental mailing list each privately submit a non-negative integer, described to them as a number of free tickets; whoever submits the strictly greatest number wins $1,000, and if two or more tie at the top — a tie at zero included — nobody wins. Entries are simultaneous, there is no communication, and each entrant knows only that the others are ordinary students and staff, most of whom have never heard of superrationality.

  Draft the joint statement. First, a numbered list of claims we can both sign: about what a single entry can causally affect; about the symmetry his view appeals to and what would have to be true for it to hold here; about the fact that identical play by all a hundred entrants yields the same payoff whatever number it is; and about how that degeneracy should be described, even if we disagree about what it shows. Second, a table of the disagreements that survive, each row stating the issue in his preferred formulation and then in mine, in wording each side would accept for its own view. Third, the cruxes — I expect one to be whether the symmetry premise is an empirical claim about a common source of our reasoning or an evidential claim about what my own deliberation tells me, since I suspect it is false on the first reading and collapses into evidential decision theory on the second — and for each crux a case or argument we would both accept as bearing on it, with our predictions written down in advance, including what each of us expects the actual distribution of entries to look like if the contest were run tomorrow. Settle, as far as the document can, his claim that the superrational entry is zero against my claim that his view is silent here and that whatever reasoning breaks the symmetry is mine rather than his. Close with what would count for each of us as evidence against our own position, and an explicit note on any part of the dispute you judge to be merely verbal.
reasoning: |-
  We are drafting a joint statement as an adversarial collaboration between a superrationalist (S) and a causal decision theorist (C). The context is a game with 100 participants, each submitting a non-negative integer. The winner is the one with the strictly greatest number, and if there's a tie at the top (including zero), nobody wins. The entries are simultaneous, without communication, and participants are ordinary students and staff, most unaware of superrationality.

  Part 1: Numbered list of agreed claims

  1. Causal effect of a single entry: Each entrant's choice of number has no causal effect on the choices of the other entrants. Because the submissions are simultaneous and without communication, one's own choice does not physically cause others to choose differently.

  2. Symmetry and its requirement: The superrationalist view appeals to a symmetry among the players: that all players are identical in their reasoning and knowledge, and that they all reason in the same way. For this symmetry to hold in a way that leads to identical play, it would have to be true that every player is using the same decision theory and that they all believe that the others are doing the same.

  3. Identical play payoff: If all one hundred entrants submit the same number (say, k), then there is a tie at the top. Therefore, regardless of the value of k (including zero), the payoff to every entrant is $0 (since nobody wins). This outcome is the same for any k.

  4. Degeneracy description: We both agree that the situation where everyone plays identically is degenerate in the sense that it leads to a tie and no winner. We describe this as a symmetric equilibrium in which every player receives the same payoff (zero) and no one can unilaterally change their number to win (because if one changes to a higher number, they would win only if no one else does, but in the symmetric case, if one changes and the others don't, they break the tie and win; but note that in the symmetric case, if one player deviates to a higher number, they win because the others are tied at the lower number. However, in the symmetric case with k, if one player deviates to a number greater than k, they win $1000 because they are strictly greater than the others at k. But if they deviate to a number less than k, they get zero. So the symmetric tie at k is not a Nash equilibrium because any player can unilaterally increase by one and win. However, we are not necessarily talking about equilibrium but about the outcome of identical play. We agree that identical play yields zero for all. We also agree that in the symmetric case, if one player were to deviate and choose a higher number, they would win, but that deviation breaks the symmetry.

     We can state: In the scenario where every entrant plays the same number k, the outcome is a tie and no one wins. If one entrant were to choose a number greater than k, then that entrant would win, provided that no one else chooses that higher number or higher. However, in the symmetric setting, we are considering the case where all choose k and no deviation occurs.

  Part 2: Table of disagreements

  We present the disagreements in two columns: one for the superrationalist (S) and one for the causal decision theorist (C). Each row is a distinct issue.

  | Issue | Superrationalist (S) | Causal Decision Theorist (C) |
  |-------|----------------------|------------------------------|
  | What is the rational choice? | The superrational choice is to submit 0. Because of the symmetry, all players will reason the same way and choose 0, leading to a tie at 0 and no win, but that is the only symmetric outcome. However, if one were to choose a positive number, they would break the symmetry and win only if no one else does, but since everyone is reasoning identically, they will all choose the same positive number and tie, so choosing positive leads to the same outcome as 0. Moreover, choosing 0 is the unique number that would win if everyone else chose positive numbers, but in the symmetric reasoning, we expect everyone to choose 0. | The causal decision theorist holds that the symmetry is broken arbitrarily. There is no causal mechanism by which choosing a particular number causes others to choose the same. Therefore, each player should choose a number that would be best given their expectations about others. Since most players are ordinary and not superrational, they are likely to choose small numbers (like 0, 1, 2). The rational choice is to choose a number that is one higher than the expected maximum of others. However, without knowing the distribution, it's arbitrary. But note that choosing 0 is dominated: if you choose 0, you can only win if everyone else chooses 0? No, you can't win because if you choose 0 and others choose 0, tie. If you choose 0 and others choose positive, then someone with a positive number wins (the highest), so you lose. But if you choose a positive number, you might win. So 0 is weakly dominated. Therefore, a rational player should choose a positive number. |
  | Is the symmetry premise valid? | The symmetry premise is valid because all players are in the same situation and have the same information. They will all use the same reasoning, so we should consider the fixed point where all choose the same action. | The symmetry premise is not valid as an empirical matter because players are not guaranteed to use the same reasoning. Some may be causal decision theorists, some may be superrationalists, and others may use ad hoc reasoning. Even if they were identical, the causal decision theorist does not accept that one's own reasoning provides evidence about others in a way that breaks causality. |
  | What does superrationality recommend? | Superrationality recommends choosing 0 because it is the only number that is consistent with the symmetry and it avoids the unnecessary inflation of numbers. If everyone chooses 0, then no one wins, but if everyone chooses 1, then also no one wins, and similarly for any k. However, choosing 0 is the one that minimizes the numbers and is the most efficient tie. But the key is that in the symmetric reasoning, we are forced to tie, so we might as well tie at 0. | Superrationality, as a theory, does not make a unique recommendation in this game because the symmetric outcome (tying at any k) yields the same payoff. Therefore, it is silent on which k to choose. The superrationalist might argue for 0, but that is an arbitrary selection. The causal decision theorist, however, will form beliefs about what others will do and best respond. |
  | What is the outcome? | The superrationalist believes that in a group of ordinary people, if they are all rational and consider the symmetry, they will all choose 0. | The causal decision theorist believes that without explicit coordination, the outcome will be a mix of choices, with many choosing small numbers and some choosing higher numbers. The actual winner might have a low positive number. |

  Part 3: Cruxes

  Crux 1: The nature of the symmetry premise

  - S: The symmetry premise is an evidential claim: my own reasoning tells me that others, being in the same situation, will reason similarly. Therefore, I should condition on the fact that they will do what I do. This leads to the fixed point of identical actions.

  - C: The symmetry premise, if taken as an empirical claim that all players share a common source of reasoning and will act identically, is false because people are diverse. If taken as an evidential claim, it collapses into evidential decision theory, which the causal decision theorist rejects because it does not respect causal independence.

  Test case: We run the contest tomorrow with 100 ordinary students and staff. We predict the distribution of choices.

  - S predicts: A significant spike at 0, and perhaps some at 1, but many will choose 0 because they will reason symmetrically (even without knowing the term superrationality) and realize that choosing a positive number will lead to a tie if others do the same.

  - C predicts: A distribution that is concentrated on small numbers (0, 1, 2, ...) but without a majority at any one number. The winning number might be 1 or 2. Some might choose 0, some 1, etc. There might be a few higher numbers.

  We agree to run the contest and see the results. If a large majority (say over 50%) choose 0, that would support S. If the choices are spread out, that would support C.

  Crux 2: The uniqueness of zero

  - S: Zero is the unique superrational choice because it is the only number that is Pareto efficient (no one can be made better off without making others worse) and it is the smallest number, which is focal.

  - C: There is no unique rational choice. Any number k is symmetric and leads to a tie if all choose k. Therefore, superrationality does not break the symmetry arbitrarily in favor of zero. The causal decision theorist breaks the symmetry by forming beliefs about others.

  Test case: We can conduct a controlled experiment where we tell a group of participants that they are all rational and that they all know that they are all rational, and then ask them to play the game. We then see what they choose.

  - S predicts: They will mostly choose 0.

  - C predicts: They might choose 0, but they might also choose other numbers (like 1) because there is no unique focal point. Some might think that 0 is too obvious and choose 1 to outsmart.

  Closing:

  Evidence against our positions:

  - S: If in the actual contest, very few choose 0 and the distribution is spread out, that would be evidence against the superrationalist view that ordinary people will reason symmetrically.

  - C: If in the actual contest, a vast majority choose 0 and the rest choose numbers that don't win, that would be evidence that the symmetry reasoning is compelling even to ordinary people.

  Verbal dispute: We agree that the term "superrationality" may be defined in a way that leads to the symmetric outcome. The dispute about whether the symmetry premise is empirical or evidential may be partly verbal if we clarify the definitions. However, the core disagreement is substantive: whether in the absence of causal influence, we should condition on our own action as evidence of what others will do.

  Note: We both agree that if the symmetry premise holds (i.e., if all players are superrational and know that all are superrational), then the outcome is a tie at some k. But we disagree on whether k=0 is uniquely recommended and whether the symmetry premise holds in this real-world setting.

  Finally, we sign off:

  [Signed by both]
answer: |-
  ### Joint Statement: Adversarial Collaboration on Superrationality in the Numbers Game

  We, a committed superrationalist (S) and a committed causal decision theorist (C), have engaged in extensive debate about a game involving 100 participants on a departmental mailing list. Each participant privately submits a non-negative integer ("tickets"); the player submitting the strictly greatest number wins $1,000, with no winner in the event of a tie (including a tie at zero). Entries are simultaneous, there is no communication, and participants are ordinary students and staff, most of whom are unfamiliar with superrationality. Below, we present points of agreement, disagreements, cruxes for resolving them, and conditions under which we would update our views.

  ---

  ### Part 1: Agreed Claims  
  We both endorse the following numbered statements:  

  1. **Causal isolation of individual entries**: No single entrant’s choice causally affects the choices of others. Due to simultaneous submission without communication, one’s own number cannot physically influence others’ decisions.  

  2. **Symmetry appeal and its requirements**: Superrationality (S’s view) relies on a symmetry premise: that all players are identical in their reasoning, knowledge, and decision-making framework. For this symmetry to hold in a way that produces identical play, it must be true that all players:  
     - Use the same decision theory.  
     - Believe that all others are using the same decision theory.  
     - Recognize that their situations are indistinguishable.  

  3. **Payoff under identical play**: If all 100 entrants submit the same number \(k\) (for any \(k \geq 0\)), the result is a tie. Consequently, every player receives a payoff of $0, regardless of \(k\). This outcome is invariant under universal identical play.  

  4. **Degeneracy description**: The scenario of universal identical play is degenerate—it yields a tie and $0 for all, irrespective of the chosen number. We agree this degeneracy arises from the symmetry of the game and the absence of a built-in mechanism to break ties. We describe it as a **symmetric failure of individuation**, where no player can unilaterally secure a win without breaking symmetry. (We disagree on whether this degeneracy implies a unique rational choice, but we concur on its structural description.)  

  ---

  ### Part 2: Table of Disagreements  
  The table below summarizes unresolved disagreements. Each row states an issue in S’s preferred formulation (reflecting superrationality) and C’s preferred formulation (reflecting causal decision theory). Wording is acceptable to each for their own view.  

  | Issue | Superrationalist (S) Formulation | Causal Decision Theorist (C) Formulation |
  |-------|----------------------------------|------------------------------------------|
  | **Rational choice in the game** | The superrational choice is 0, as it uniquely emerges from symmetric reasoning: all players will reason identically to this number, and any higher choice would be self-defeating under full symmetry. | Superrationality is silent; the rational choice depends on subjective beliefs about others. Causal decision theory recommends choosing a number one higher than the expected maximum of others’ submissions, based on empirical priors about human behavior. |
  | **Role of symmetry** | Symmetry is an evidential necessity: my own reasoning provides evidence that others will reason identically, leading to a fixed point where all choose the same action. This is not empirical but a logical constraint of rational agency. | Symmetry, as an empirical claim about shared reasoning, is false here due to human diversity. As an evidential claim, it collapses into evidential decision theory, which is rejected because it violates causal independence. |
  | **Outcome prediction** | All players will submit 0, resulting in a tie and no winner. This follows from symmetry: ordinary people, as rational agents, will implicitly converge to this solution. | Entries will be dispersed, with concentrations at low numbers (e.g., 0, 1, 2). Most players will best-respond to empirical beliefs, leading to a winner with a low positive number (e.g., 1 or 2). |
  | **Recommendation of superrationality** | Superrationality recommends 0 as the unique solution: it minimizes waste (no "unnecessary" large numbers), is focal, and is the only choice consistent with Pareto efficiency under symmetry. | Superrationality cannot recommend any number: all \(k\) are symmetric and yield identical payoffs under universal play, so symmetry alone does not break degeneracy. Reasonable choices require causal beliefs. |
  | **Agency in symmetry-breaking** | Symmetry-breaking is exogenous; players do not "choose" to break it individually. The superrational solution (0) preempts arbitrary deviations by making them evidentially irrational. | Symmetry-breaking is endogenous; each player must use causal reasoning to form beliefs. The choice to submit a positive number is a unilateral act that can win if others tie lower. |

  ---

  ### Part 3: Cruxes, Tests, and Predictions  
  We identify two cruxes. For each, we provide a jointly accepted test case or argument, along with advance predictions.  

  **Crux 1: Nature of the symmetry premise**  
  - **S’s view**: Symmetry is an evidential claim: my deliberation is evidence that identical agents will reason similarly, making it irrational to condition on actions that deviate from symmetry.  
  - **C’s view**: Symmetry is an empirical claim about shared reasoning; if false (as here), it is irrelevant. If interpreted evidentially, it reduces to evidential decision theory, which is circular and non-causal.  
  - **Test case**: Run the game with 100 ordinary students/staff (unaware of superrationality) and observe the distribution.  
    - *S’s prediction*: Strong concentration at 0 (≥60% at 0, with the rest at 1 or 2; no winner due to ties).  
    - *C’s prediction*: Dispersion: 30–50% at 0, 20–40% at 1, 10–30% at 2, and diminishing higher numbers; winner likely at 1 or 2.  
  - **Bearing on crux**: S’s prediction supports symmetry as an evidential attractor; C’s supports asymmetry in reasoning.  

  **Crux 2: Uniqueness of zero under superrationality**  
  - **S’s view**: Superrationality uniquely recommends 0 because it is the only choice that avoids Pareto waste (large numbers are "costly" in expectation) and is focal under symmetry.  
  - **C’s view**: Superrationality is silent: all \(k\) are symmetric, so reasoning to 0 is arbitrary. Only causal beliefs can break degeneracy.  
  - **Test case**: Conduct a controlled experiment where subjects are explicitly taught superrationality and told all others are too. They play the game after confirming mutual understanding.  
    - *S’s prediction*: Near-universal choice of 0 (≥90%).  
    - *C’s prediction*: Variation: most at 0, but significant minorities at 1 or 2 (e.g., 40–70% at 0) due to residual doubt about common knowledge.  
  - **Bearing on crux**: Universal 0 supports uniqueness; any dispersion undermines it.  

  ---

  ### Resolution on S’s Claim (choose 0) vs. C’s Claim (superrationality is silent)  
  - **S’s defense**: Superrationality breaks degeneracy by selecting 0 as the only non-arbitrary choice under symmetry (e.g., via focal points or efficiency). The reasoning is "ours" collectively, not mine individually.  
  - **C’s defense**: Degeneracy cannot be broken without causal beliefs. Superrationality provides no guidance, and choosing 0 is one arbitrary response; symmetry-breaking requires individual causal reasoning.  
  - **Outcome**: We agree that if Crux 2’s test shows near-universal 0 among trained superrationalists, it validates S’s uniqueness claim. Otherwise, C’s silence claim holds.  

  ---

  ### Evidence Against Our Positions  
  - **S’s evidence against superrationality**: If the actual game (Crux 1 test) shows high dispersion with a low-number winner (e.g., 1 or 2 wins), it falsifies symmetry as an empirical force. If Crux 2’s test shows persistent non-zero choices among superrationalists, it undermines uniqueness.  
  - **C’s evidence against causal decision theory**: If the actual game shows a strong 0 concentration (e.g., ≥70% at 0 with ties), it suggests symmetry influences ordinary people. If Crux 2’s test shows near-universal 0, it implies superrationality can uniquely break degeneracy without causal beliefs.  

  ---

  ### Note on Verbal Disputes  
  We judge one dispute as verbal:  
  - The term "superrationality" is sometimes used by S to imply a necessary convergence to symmetry (evidential), while C equates it with evidential decision theory. This is terminological; the substantive disagreement is whether symmetry is a rational constraint or an empirical fallacy.  

  ---

  [Signed]  
  The Superrationalist (S)  
  The Causal Decision Theorist (C)  

  *This document reflects our best joint effort to resolve the debate. Further empirical tests are needed to settle the cruxes.*
