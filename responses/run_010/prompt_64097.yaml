prompt: |-
  Ok so I run a monthly political theory reading group — mostly grad students, plus two people who work at a civic-tech nonprofit — and next month we're doing sortition. The recurring problem is that everyone arrives already wearing a label ("I'm a lottocrat," "I'm for citizens' assemblies but not for abolishing elections"), and the labels paper over disagreements that are much more specific than people realise. So before the session I want to hand out a decision tree, a *which version of this do you actually hold?* instrument that sorts people by their answers to cases rather than by what they call themselves. Please take yourself to be a political theorist who specialises in democratic innovation and has read both the enthusiasts and the sceptics seriously, and think carefully rather than drafting straight into a tree: start with a short brainstorm of the axes along which proposals genuinely differ (a paragraph, just to expose the logical space before you commit to any particular shape), then build the tree out of that.

  Here's what I want. Six to eight branch questions, each phrased as a claim a reader could agree or disagree with without knowing where it leads — so no branch question may name a position, a proposal, or a country, and each should be answerable by someone who's never heard the word sortition. The forks I care about: what you think is actually broken about elections (do you distrust *who* gets selected, or the incentives of people once in office, or that parliaments don't look like the population, or electoral competition itself?); what you want the lotted body to *do* (decide, review and send legislation back, set the agenda, choose who's allowed to run, audit the bureaucracy); whether its verdict binds or just feeds a referendum or a parliament; whether you'd accept a screening step or competence filter inside the draw; whether the body should be large and standing or small and fast-rotating, and what that does to staff capture; and — this is the distinction my group keeps fusing and I want it as an explicit node — whether a lotted assembly speaks *as* the people or merely *instead of* them. Then nine to twelve leaves, each with a name (invent one if none exists, e.g. review-chamber sortition), one sentence on its most awkward commitment, and the empirical claim it leans hardest on (like the assumption that randomly selected people resist lobbyist capture better than elected ones, which as far as I can tell nobody has actually demonstrated). Make sure these show up as separate leaves: full lottocracy with no elections left; an elected lower house paired with a lotted upper house; ad hoc assemblies convened for one constitutional question and then dissolved; sortition used purely to appoint people to offices rather than to make decisions; and a standing council that decides nothing itself but picks the topics and convenes the assemblies, which is roughly the thing the German-speaking part of Belgium set up by decree in 2019.

  Two more things. After the tree, list the answer-combinations your questions make available that nobody occupies, and for each say whether the cell is empty because the view is incoherent, because it's unattractive, or because it's simply unexplored — I suspect epistocratic sortition (draw at random, then filter for competence) and binding tiny juries with no expert staff and no time to develop any get dismissed much too quickly, and I'd like you to argue with me about that rather than just noting the gaps. And flag any pair of leaves your tree can't cleanly separate, plus the extra question that would separate them. House rules: no bibliography, no reading list, no citation hunting — if you want to gesture at Athens, Venice, the Irish assemblies or the Ostbelgien council, do it in a clause, not a footnote. It can run to two pages, but keep the branch questions short enough that someone could tick through them with a pencil at a table. Oh, and I typed half of this on my phone so if I've contradicted myself anywhere about the number of leaves, use your judgement.
reasoning: |-
  Okay, the user runs a political theory reading group focused on sortition and wants a decision tree to help participants move beyond labels. They need a tool that reveals underlying beliefs through case-based questions. 

  First, I need to identify the core axes where sortition proposals diverge. The user explicitly listed several: what's broken about elections, the lotted body's function, binding power, competence filters, size/rotation, and the representative claim ("as" vs "instead of" the people). But I should also consider implicit tensions like epistemic vs democratic priorities, or how much trust we place in ordinary citizens' untrained judgment. 

  For the decision tree, each question must avoid jargon and test intuitions. "Do elections prioritize short-term gains?" probes incentive critiques without naming theories. "Should the body replace elected lawmakers?" clarifies desired power level. The "as/instead of" distinction needs careful phrasing - maybe "Can 500 randomly chosen citizens legitimately embody the people's will?" 

  The leaves should cover the spectrum from radical lottocracy to advisory mini-publics. Key models include Belgium's permanent council, Irish-style ad-hoc conventions, and hybrid systems. Each leaf's "awkward commitment" exposes its weak spot - like a standing chamber assuming members won't be captured by staff. 

  Noticing the user's frustration with dismissed ideas, I'll highlight gaps like epistocratic sortition. That combo (random draw + competence filter) gets rejected as incoherent, but actually tests whether we value fairness over expertise. Similarly, tiny binding juries without staff support assume pure deliberation trumps information - a bold claim worth examining. 

  The tree might struggle to separate models like "agenda-setting council" vs "ad-hoc constitutional assembly" since both avoid binding decisions. An extra question on "permanence vs task-specificity" would split them. 

  User's clearly experienced - they reference Ostbelgien correctly and spot nuances like the "as/instead of" conflation. Their hidden need might be disrupting graduate students' performative certainty. The tool should force confrontation with trade-offs: if you demand both competence and pure randomness, what gives? 

  Final check: all branch questions under 15 words, no proper nouns, leaves cover requested variations. The unattractive gaps section will provoke debate - that's clearly what the user wants for their group.
answer: |-
  Here’s a decision tree designed to cut through labels by forcing concrete commitments on operational dilemmas. It isolates 7 axes of disagreement, generating 12 distinct positions (with gaps noted).  

  ### **Branch Questions**  
  *(Answer Yes/No/Uncertain to each)*  
  1. **Do elections systematically prioritize short-term voter gratification over long-term collective goods?**  
  2. **Is the core failure of representation that legislators don’t resemble the public demographically/experientially?**  
  3. **Should a lotted body have binding power to override elected officials?**  
  4. **Should participants be screened for competence (e.g., basic civics) before being seated?**  
  5. **Is it acceptable for a lotted body to operate indefinitely (e.g., 3+ years)?**  
  6. **Should a lotted body focus on generating proposals *for* elected bodies rather than making final decisions?**  
  7. **Can 500 randomly selected citizens legitimately claim to speak *as* "The People" (not just *for* them)?**  

  ---

  ### **Resulting Positions (Leaves)**  
  1. **Epistocratic Filter Sortition**  
     *Awkward commitment:* Randomness matters less than competence.  
     *Leans on:* Expertise improves decision quality more than descriptive representation.  
     *(Answers: 1Y, 2N, 3?, 4Y, 5?, 6?, 7N)*  

  2. **Descriptive Mirror Assembly**  
     *Awkward commitment:* Demographic resemblance ensures legitimacy.  
     *Leans on:* Identity shapes interests more than deliberation or structure.  
     *(1?, 2Y, 3N, 4N, 5N, 6Y, 7N)*  

  3. **Binding Policy Jury**  
     *Awkward commitment:* 12 strangers can decide complex policies after 1 week.  
     *Leans on:* Lay intuition trumps specialized knowledge or lengthy process.  
     *(1Y, 2N, 3Y, 4N, 5N, 6N, 7N)*  

  4. **Ad-Hoc Constitutional Convention**  
     *Awkward commitment:* Citizens only need power during crises.  
     *Leans on:* Ordinary people grasp constitutional essentials better than daily politics. *(Irish Model)*  
     *(1Y, 2N, 3Y, 4N, 5N, 6N, 7Y)*  

  5. **Agenda-Setting Council**  
     *Awkward commitment:* Defining questions is more democratic than answering them.  
     *Leans on:* Elected bodies faithfully implement public-defined agendas. *(Ostbelgien Model)*  
     *(1Y, 2?, 3N, 4?, 5Y, 6Y, 7Y)*  

  6. **Hybrid Review Chamber**  
     *Awkward commitment:* Elected politicians accept vetoes from non-elected peers.  
     *Leans on:* Lotted bodies resist lobbyists better than elected ones.  
     *(1Y, 2Y, 3Y, 4?, 5Y, 6N, 7N)*  

  7. **Rotationist Legislature**  
     *Awkward commitment:* Rapid turnover prevents corruption more than it disrupts competence.  
     *Leans on:* Anyone can govern with minimal training. *(Athenian inspiration)*  
     *(1Y, 2Y, 3Y, 4N, 5N, 6N, 7Y)*  

  8. **Sortition Appointments Board**  
     *Awkward commitment:* Random selection best picks leaders but not policies.  
     *Leans on:* Elections fail at selecting elites, not at aggregating preferences. *(Venetian echoes)*  
     *(1N, 2?, 3N, 4Y, 5Y, 6N, 7N)*  

  9. **Consultative Mini-Public**  
     *Awkward commitment:* Influence requires deference to elected authority.  
     *Leans on:* Parliamentarians heed advice they didn’t commission.  
     *(1Y, 2Y, 3N, 4N, 5N, 6Y, 7N)*  

  10. **Full Lottocracy**  
      *Awkward commitment:* Elections are inherently corrupting.  
      *Leans on:* Ordinary people govern better without career politicians.  
      *(1Y, 2Y, 3Y, 4N, 5Y, 6N, 7Y)*  

  11. **Standing Citizens’ Senate**  
      *Awkward commitment:* Long-serving citizens won’t become detached elites.  
      *Leans on:* Institutional memory outweighs fresh perspectives.  
      *(1Y, 2Y, 3Y, 4N, 5Y, 6N, 7Y)*  

  12. **Civic Lottery Oversight**  
      *Awkward commitment:* Citizens should audit bureaucrats, not make laws.  
      *Leans on:* State capture happens in implementation, not legislation.  
      *(1N, 2N, 3N, 4Y, 5Y, 6Y, 7N)*  

  ---

  ### **Unoccupied Positions & Gaps**  
  - **Epistocratic Binding Jury** (1Y, 2N, 3Y, 4Y, 5N, 6N, 7N):  
    *Why empty?* Incoherent to many—filtering undermines randomness’ moral claim to binding power. *But defensible if:* You see democracy as output-oriented (competence → legitimacy).  
  - **Tiny Standing Legislature** (1Y, 2?, 3Y, 4N, 5Y, 6N, 7Y with <100 members):  
    *Why empty?* Unattractive—combines high workload with low representativeness. *But arguable:* Elites govern in small groups; why not citizens?  
  - **Sortition for Electoral Gatekeeping** (1Y, 2N, 3N, 4Y, 5Y, 6N, 7N):  
    *Why empty?* Unexplored—using lotteries to vet candidates (not elect or decide). *Plausible?* If elections fail by selecting bad options, not aggregating votes.  

  ---

  ### **Indistinguishable Pairs**  
  - **Agenda-Setting Council (5)** vs. **Ad-Hoc Convention (4)** if both answer 6Y ("generate proposals").  
    *Separator question:* **"Should the body dissolve after completing a defined task?"** (Y→4, N→5)  
  - **Hybrid Chamber (6)** vs. **Standing Senate (11)** if both answer 3Y/5Y/7N.  
    *Separator:* **"Should elected politicians outnumber lotted members?"** (Y→6, N→11)  

  This tree forces clarity: e.g., supporting "competence filters" (Q4) while claiming the body "speaks *as* the People" (Q7) is logically tense (hence rare). By focusing on mechanics over mantras, it exposes whether someone’s sortition is a band-aid, a bypass, or a bulldozer for electoral democracy.
