prompt: |-
  I am drawing up criteria for evaluating cosmological theories under the Boltzmann-brain objection, and I would rather have the criteria in hand before I look at any particular proposal. Specify the desiderata: what a theory of the universe's global structure and thermodynamic history must deliver in order to count as an acceptable account of a world in which observers like us draw inferences from their own evidence.

  Give the consideration behind each item, not merely a label. At a minimum, the list should take a position on the following:

  - The asymmetry between the entropy cost of a fluctuation that yields one momentary brain equipped with apparently coherent records and the cost of a fluctuation that yields an entire ordered low-entropy cosmos — and what a theory owes us given that the cheaper fluctuation dominates overwhelmingly.
  - Whether the theory's own probability assignments over observer states suffice to generate predictions, or whether they must be supplemented by a principle telling us to expect to be typical; and if supplementation is needed, whether that principle can be anything other than a further postulate the theory does not itself justify.
  - Whether a theory that predicts our evidence exactly, while implying that the evidence is no guide to the world, is refuted by that evidence, unfalsifiable, or neither. The objection may be epistemic rather than empirical, and the list should say which, and why that matters for adequacy.
  - Whether a theory that undermines the warrant for the reasoning which produced it thereby fails a requirement, or merely fails to be rationally holdable; how that distinction should be drawn, and whether either outcome disqualifies a cosmology.
  - How the requirements shift depending on whether the theory posits infinite spacetime volume, an eternally recurring de Sitter phase, or a finite-dimensional state space in which recurrences cannot be avoided.
  - What a theory owes us concerning the arrow of time and the low-entropy boundary condition (the kind standardly called the Past Hypothesis): in particular, whether deriving that condition from a statistical postulate over microstates is a genuine desideratum or a preference of one school, given that the derivation is precisely what makes freak observers dominant.
  - Whether a theory must explain the reliability of our records, or need only be consistent with it.

  Mark every requirement as non-negotiable, as negotiable but costly to surrender, or as a partisan demand that an otherwise good theory may simply refuse. Then identify any subset that cannot be jointly satisfied and say which member has to go; if the list is itself the interesting result here, that is what I most want to see. Close with the single requirement that does the most work in excluding attractive cosmologies, and with no more than a paragraph each on how three generic responses fare against the list: modifying the cosmology to suppress the fluctuations, retaining the cosmology and denying the objection its force, and rejecting the typicality principle so that freak observers never enter predictions at all.

  No bibliography or references, please — I want the reasoning, not the sources. A numbered list with a sentence or two of motivation per item is fine.
reasoning: |-
  Alright, let me unpack this user's request. They're building criteria to evaluate cosmological theories against the Boltzmann brain problem, and want the framework ready before examining specific proposals. This is a sophisticated epistemological challenge disguised as a cosmology checklist.

  First I need to parse the seven mandatory discussion points. The user clearly understands Boltzmann brains (BBs) well - they're asking how to judge theories where random fluctuations create conscious observers with false memories instead of real cosmic history. The core tension is between theory elegance and empirical sanity.

  Hmm, the entropy asymmetry issue (#1) is foundational. Any viable theory must justify why our structured universe exists instead of statistically dominant BBs. But demanding absolute certainty here might be unreasonable - perhaps we should accept probabilistic dominance as sufficient? Though the user might push back given their later questions about typicality principles.

  On probability assignments (#2), I recall debates about whether the Born rule or self-locating uncertainty can resolve BBs. But the user seems suspicious of theories that require external typicality assumptions. Maybe we should mark this as negotiable but costly if surrendered? After all, discarding typicality entirely makes empirical science impossible.

  The evidence-undermining problem (#3) feels like a dealbreaker. If a theory says our memories are hallucinations, how could we trust it? This probably deserves "non-negotiable" status on epistemic grounds. The user's phrasing suggests they'd agree, given their concern about "undermining warrant" in #4.

  For #4's rationality requirement... tricky. We might accept a theory that makes science unreliable only if it's our best option. But the user's emphasis on "reasoning which produced it" implies they want theories that don't saw off the branch they're sitting on. Probably non-negotiable for testable cosmologies.

  The spacetime structure variations (#5) need nuanced treatment. Infinite universes amplify BB problems but finite ones have recurrence issues. The criteria should flexibly address both without special pleading. This might be where we allow negotiable tradeoffs.

  About the Past Hypothesis (#6)... here's the rub. Deriving low entropy from statistics invites BBs, but alternatives seem ad hoc. The user seems aware of this catch-22. We'll call this partisan since some schools reject statistical foundations entirely.

  Finally, record reliability (#7) connects to #3. Mere consistency feels too weak - our whole scientific enterprise assumes records aren't fraudulent. But demanding full explanation might overreach. Let's split the difference: require theories not to actively undermine reliability.

  Now for grading negotiability. The evidence-undermining (#3) and self-defeat (#4) points must be non-negotiable - otherwise cosmology loses empirical meaning. Typicality (#2) and entropy asymmetry (#1) are costly to surrender but possible if compensated elsewhere. The rest can be partisan.

  The irreconcilable conflict emerges: satisfying #1 (explaining why cosmos > BB) while avoiding #6 (Past Hypothesis) that causes BB problems. Something has to give - likely #6's demand for statistical derivation of low entropy.

  Most exclusionary requirement? Probably #4: theories can't undermine their own reasoning. It rules out elegant but self-defeating models. For responses:
  - Suppressing fluctuations (e.g., with negative vacuum energy) might handle #1 but struggle with #5's recurrence risks.
  - Denying the BB objection risks ignoring #1's entropy math.
  - Rejecting typicality solves BBs but destroys #2 and makes science untethered.

  The user wants this tension laid bare - the list itself exposes cosmology's epistemological tightrope walk.
answer: |-
  Here is a prioritized list of desiderata for evaluating cosmological theories against the Boltzmann brain (BB) objection, with motivations, negotiability ratings, and conflicts identified:

  1.  **Non-Dominance of Epistemic Freaks:** The theory must explain why observers like us (arising from sustained low-entropy evolution) vastly outnumber BBs (momentary low-entropy fluctuations with false memories) *in the reference class of observers relevant for prediction*. *Motivation:* The vastly lower entropy cost of a BB fluctuation means BBs should overwhelmingly dominate over ordinary observers in an eternal/infinite universe unless the theory provides a specific mechanism to suppress them or alter the reference class. If BBs dominate, our memories/records (which form our cosmological evidence) are overwhelmingly likely to be false, undermining the theory's own empirical basis. **Non-negotiable.**

  2.  **Internal Predictive Completeness:** The theory's fundamental probability measure over physical states/histories must *directly* generate the correct probabilistic predictions for our observations *without requiring an externally justified "typicality" postulate*. *Motivation:* Adding a typicality principle ("assume you are typical") as a fundamental postulate is circular or unjustified within the theory itself. The fundamental laws and initial/boundary conditions should imply that observers with coherent records like ours are the *predictively relevant* outcome (see #1). If the measure alone predicts BBs dominate (or is ambiguous), adding typicality to "fix" it is an ad hoc rescue. **Negotiable but costly to surrender.**

  3.  **Evidence Compatibility (No Self-Undermining):** The theory must not imply that our specific empirical evidence (e.g., cosmic microwave background, fossil record, stellar evolution) is *itself* overwhelmingly likely to be a false fluctuation. *Motivation:* A theory predicting that our evidence is almost certainly hallucinatory (e.g., a BB state) is epistemically self-defeating. We cannot rationally accept a theory while simultaneously believing it renders our evidence for *any* theory (including itself) unreliable. This is an epistemic, not empirical, refutation. **Non-negotiable.**

  4.  **Rational Holdability:** The theory must not undermine the warrant for the reasoning processes used to develop, test, or accept it. *Motivation:* Cosmology relies on inference from evidence. If the theory implies the cognitive processes generating cosmological theories (e.g., logic, memory recall, induction) are unreliable (because they are likely BB states), it destroys the justification for believing *that specific theory* or any other. Failure here disqualifies the cosmology as rationally holdable, which is distinct from mere empirical falsification but equally disqualifying. **Non-negotiable.**

  5.  **Arrow Consistency:** The theory must provide a consistent, non-arbitrary account of the temporal asymmetry of thermodynamics and information processing (the arrow of time), including the origin of the low-entropy boundary condition. *Motivation:* Our existence, evidence gathering, and memory formation rely on the arrow of time. Simply postulating a Past Hypothesis (PH) as an unexplained initial condition is insufficient without embedding it within a larger explanatory framework that addresses why *this* low-entropy state occurred. **Negotiable but costly to surrender.**

  6.  **Record Reliability (Explanatory Sufficiency):** The theory must *explain* the high reliability of our macroscopic records (e.g., fossils, geological strata, CMB maps) as products of a persistent low-entropy past, not merely be consistent with their existence. *Motivation:* Mere consistency allows the possibility that records are false fluctuations (BBs). Science fundamentally relies on the trustworthiness of records as evidence for the past. The theory must ground this reliability in its dynamics, showing why coherent records overwhelmingly reflect actual history (#1, #3). **Partisan demand (strongly held by many).**

  7.  **PH Derivation Tolerance:** Deriving the low-entropy boundary condition (PH) from a fundamental statistical postulate over microstates (e.g., "typicality" of the initial microstate) is *not* an inherent virtue if it leads to BB dominance. *Motivation:* While elegant, this standard statistical mechanics derivation in an eternal/infinite setting is precisely what predicts BB dominance (#1), creating the core problem. A theory may legitimately avoid this derivation (e.g., via special boundary laws, dynamical constraints, or finite histories) to satisfy #1. **Partisan demand (often held by reductionists).**

  8.  **Volume/Recurrence Sensitivity:** The requirements (#1, #2, #3) must be robustly satisfied regardless of spacetime volume (finite/infinite), eternal recurrence, or state space finitude. *Motivation:* Infinite volume/eternal recurrence dramatically amplifies the BB problem by making freak states infinitely more probable than ordinary histories unless explicitly countered. Finite state spaces guarantee Poincaré recurrences, including BB states. The theory must address these consequences head-on, not assume them away. **Non-negotiable.**

  **Conflict Identification:** Desiderata **#1 (Non-Dominance)** and **#7 (PH Derivation Tolerance)** are in direct tension within standard statistical frameworks. Satisfying #1 typically requires *abandoning* the standard statistical derivation of the PH from microstate typicality (#7), as that derivation leads directly to BB dominance. **#7 must be surrendered** in any viable theory facing BB issues. Adopting #7 forces failure of #1, leading to cascading failures of #2, #3, and #4.

  **Most Exclusionary Requirement:** **#1 (Non-Dominance of Epistemic Freaks)** does the heaviest lifting in excluding otherwise attractive cosmologies. Elegant, simple models of eternal inflation or de Sitter space with the standard statistical PH derivation fail catastrophically here, predicting our observations should be BB hallucinations.

  **Evaluation of Generic Responses:**

  1.  **Suppressing Fluctuations (e.g., negative \(\Lambda\), universe decay):** Directly targets #1 (success crucial), helps #3, #4, #6. Risks violating #5 if the suppression mechanism is ad hoc or #8 if it fails in infinite volume. Must still address #2 internally. Most promising if physically well-motivated.
  2.  **Denying BB Force (e.g., "BBs aren't real observers", ad hoc measures):** Fails #1, #3, #4, #6 catastrophically. Often violates #2 by requiring unjustified probability weightings. Offers no solution, merely ignoring the core statistical problem. Generally inadequate.
  3.  **Rejecting Typicality:** Avoids BB predictions by denying we should reason using the full measure (#2). May salvage #3, #4. However, it surrenders #2 at high cost, crippling predictive power and often appearing arbitrary. Fails to solve #1; it just declares the question invalid. Leaves #5, #6, #8 unresolved. Deeply unsatisfying and epistemically risky.
