  ### Simulation Design: "Boundaries and Redistribution"

  **Core Concept:**  
  This simulation demonstrates how the sequencing of decisions (tax-setting vs. migration) and voting rights for migrants fundamentally alter redistribution outcomes, independent of fiscal magnitudes. It reveals the circularity of defining the electorate: only existing voters can decide who joins them, with no neutral external arbiter.

  ---

  ### **Rule Set**  
  **Jurisdictions & Roles:**  
  - **Home:** Starts with 12 citizens (voters).  
  - **Abroad:** Starts with 12 non-citizens (potential migrants).  
  - **Productive Positions:** Assigned at start (fixed for all rounds):  
    - **Type A (High):** Earns 12 points.  
    - **Type B (Medium):** Earns 8 points.  
    - **Type C (Low):** Earns 4 points.  
  - **Initial Distribution (all rounds):**  
    - Home: 2A, 3B, 7C (total 12).  
    - Abroad: 6A, 5B, 1C (total 12).  

  **Tax-Transfer System (Home only):**  
  - Tax rate \( r \) chosen by voters: 0 (0%), 1 (25%), 2 (50%), or 3 (75%).  
  - **Tax Paid:** \( \text{Tax} = r \times (\text{Gross Income} \, / \, 4) \).  
    - Type A: Tax = \( r \times 3 \)  
    - Type B: Tax = \( r \times 2 \)  
    - Type C: Tax = \( r \times 1 \)  
  - **Revenue:** Sum of all taxes paid in Home.  
  - **Transfer:** Revenue ÷ Total people in Home (including guestworkers). Rounded to nearest 0.5 points.  
  - **Net Income:**  
    - Home: \(\text{Gross} - \text{Tax} + \text{Transfer}\)  
    - Abroad: Gross income (no tax/transfer).  

  **Movement Rules:**  
  - Migrants keep their type.  
  - In movement phases, Abroad players may move to Home if they believe it improves their net income.  
  - Movers are irreversible within a round.  

  **Voting Rules:**  
  - Majority vote (simple 50%+1).  
  - **Electorate:** Only Home citizens vote.  
  - **Guestworkers:** Work, pay taxes, receive transfers, but cannot vote.  

  ---

  ### **Rounds**  
  All rounds reset to initial distribution. Players compare outcomes across rounds.  

  1. **Round A (Tax Before Movement):**  
     - Home votes on tax rate.  
     - Abroad decides to move (movement occurs).  
     - **Movers become voting citizens.**  

  2. **Round B (Movement Before Tax):**  
     - Abroad decides to move (movement occurs).  
     - **Movers become voting citizens.**  
     - Home (including new citizens) votes on tax rate.  

  3. **Round C (Guestworkers):**  
     - Abroad decides to move (movement occurs).  
     - **Movers become guestworkers (non-voting).**  
     - Home citizens vote on tax rate.  

  **Veil of Ignorance Round (Pre-Game):**  
  - Players vote on which rule (A, B, or C) to use in Round 1, **before** learning their type/jurisdiction.  

  **Boundary Vote (After Round 3):**  
  - Facilitator: *"Home has current citizens and guestworkers. Abroad has others. Who should vote in the next round? You have 5 minutes to decide. I will not intervene."*  
  - No rules or principles provided. Current electorate must self-determine the procedure.  

  ---

  ### **Materials**  
  1. **Role Cards (24):**  
     - Type A (High): *"You earn 12 points each round. Your tax: \( r \times 3 \)."*  
     - Type B (Medium): *"You earn 8 points each round. Your tax: \( r \times 2 \)."*  
     - Type C (Low): *"You earn 4 points each round. Your tax: \( r \times 1 \)."*  
  2. **Status Cards (for movement):**  
     - Citizen (voter), Guestworker (non-voter), Abroad (non-citizen).  
  3. **Tally Sheets (per student):**  
     - Columns: Round | Gross | Tax | Transfer | Net | Location | Notes.  
  4. **Voting Ballots (for tax/options):**  
     - Tax: 0, 1, 2, 3.  
     - Veil: Options A, B, C.  
  5. **Facilitator Cheat Sheet:**  
     - Tax/revenue/transfer formulas.  
     - Initial distribution table.  

  ---

  ### **Payoff Scheme & Outcomes**  
  **Example Net Incomes (Initial Home, no movement):**  
  | Type | Gross | Tax (r=0) | Tax (r=1) | Tax (r=2) | Tax (r=3) |  
  |------|-------|-----------|-----------|-----------|-----------|  
  | A    | 12    | 12        | 11.5      | 10        | 10.5      |  
  | B    | 8     | 8         | 8.5       | 9         | 10.5      |  
  | C    | 4     | 4         | 5.5       | 7         | 8.5       |  

  *Calculations for r=1 (25% tax):*  
  - Tax: A: 3, B: 2, C: 1 → Revenue: (2A×3) + (3B×2) + (7C×1) = 6 + 6 + 7 = 19  
  - Transfer: 19 ÷ 12 ≈ 1.58 → **1.5** (rounded)  
  - Net: A: 12 - 3 + 1.5 = 10.5 (error in table above; corrected here)  

  **Non-Degeneracy Proof:**  
  - **No Dominant Strategy:**  
    - Type A prefers low tax (r=0) but may support higher tax if migration changes the median voter.  
    - Type C prefers high tax (r=3) but may oppose migration if it dilutes transfers.  
  - **Different Winners:**  
    - **Round A (tax first):** High tax (r=2–3) deters movement; Type C in Home gains most (net +3.5).  
    - **Round B (move first):** Migration occurs; new Type C voters raise tax to r=3; Type C gains most (net +4.5).  
    - **Round C (guestworkers):** Migration occurs; Type A/B voters set low tax (r=0–1); Type A gains most (net +0.5).  
  - **Guestworker Stability:**  
    - In Round C, 3–5 migrants typically move (net gain: 0.5–1.5 points vs. Abroad). No collapse.  

  ---

  ### **Worked Example Round (Round A)**  
  **Initial Home:** 2A, 3B, 7C (12 people).  
  1. **Tax Vote:** Citizens vote. Type C majority (7 of 12) → **r=3 (75% tax)**.  
     - Tax: A: 9, B: 6, C: 3.  
     - Revenue: (2×9) + (3×6) + (7×3) = 18 + 18 + 21 = 57.  
     - Transfer: 57 ÷ 12 = 4.75 → **5** (rounded).  
     - Net (no movers): A: 12-9+5=8; B: 8-6+5=7; C: 4-3+5=6.  
  2. **Movement:**  
     - Abroad Type C: Compares Home net (6) vs. Abroad (4) → moves.  
     - Abroad Type A/B: Home net (A:8, B:7) vs. Abroad (A:12, B:8) → no move.  
     - **1C moves to Home.**  
  3. **Final Home:** 2A, 3B, 8C (13 people).  
     - Revenue: (2×9) + (3×6) + (8×3) = 18 + 18 + 24 = 60.  
     - Transfer: 60 ÷ 13 ≈ 4.62 → **4.5**.  
     - Net: A: 12-9+4.5=7.5; B: 8-6+4.5=6.5; C: 4-3+4.5=5.5.  
  **Outcome:** Type C in Home gains most (net +1.5 vs. start).  

  ---

  ### **Timeline & Script**  
  **Total: 105 minutes**  
  - **0:00–0:05** (Intro): *"Today, you are residents of Home or Abroad. Your type (A, B, C) is fixed. Home has a tax-transfer system; Abroad has none. Record outcomes on your tally sheet. We’ll run multiple rounds with different rules."*  
  - **0:05–0:15** (Veil of Ignorance): *"Before assignments, vote on Round 1’s rule: Option A (tax before movement, movers vote), B (movement before tax, movers vote), or C (movement before tax, movers as guestworkers)."*  
  - **0:15–0:20** (Assign Roles): Distribute role/jurisdiction cards. Reveal initial distribution publicly.  
  - **0:20–0:35** (Round A): *"Rule A: Home citizens vote on tax first. Tax set? Abroad may move to Home. Movers become voters."*  
  - **0:35–0:50** (Round B): *"Rule B: Abroad may move to Home first. Movement done? New movers vote. Home (now larger) sets tax."*  
  - **0:50–1:05** (Round C): *"Rule C: Abroad may move to Home first. Movement done? Movers are guestworkers (work, pay tax, no vote). Home citizens set tax."*  
  - **1:05–1:15** (Boundary Vote): *"Home has citizens and guestworkers. Abroad has others. Who should vote next round? Decide now—I won’t intervene."*  
  - **1:15–1:45** (Debrief): Use tally sheets to discuss sequencing, boundary circularity, and limitations (see below).  

  **Scripted Instructions (minimalist):**  
  - Voting: *"Home citizens vote on tax rate: 0, 1, 2, or 3. Majority wins."*  
  - Movement: *"Abroad players: Move or stay? Write decision privately. I will collect and announce."*  
  - Boundary: *"Decide who votes next. Begin."*  

  ---

  ### **Debrief**  
  **Key Moments & Concepts:**  
  1. **Sequencing Matters:**  
     - *Round A (tax first):* High tax deters movement; Type C in Home gains.  
     - *Round B (move first):* Migration shifts median voter; Type C gains more.  
     - *Round C (guestworkers):* No voting power for migrants; Type A/B cut taxes.  
     - **Concept:** Fiscal impact is secondary to institutional order—*when* migrants arrive and *if* they vote changes outcomes.  

  2. **Boundary Circularity:**  
     - In boundary vote, students used majority rule, exclusion, or lottery—but authorized it as existing voters.  
     - **Concept:** **The boundary problem**—there is no neutral "outside" to define the electorate; the demos decides its own boundaries.  

  3. **Veil of Ignorance vs. Self-Interest:**  
     - Veil vote often chooses Rule B/C (inclusive); vested-interest rounds (A/B/C) split by type.  
     - **Concept:** Rules chosen impartially (veil) vs. contextually (known type) diverge, revealing self-interest.  

  ---

  ### **Predictable Problems & Handling**  
  1. **Coalition Blocks Movement:**  
     - *Issue:* Home high-types (A/B) set high tax (r=3) in Round A to deter migration, then refuse to reopen borders.  
     - *Handling:* Let it happen. In debrief, contrast with Round B where migration occurs first.  

  2. **Non-Mover Despite Gain:**  
     - *Issue:* Abroad player (e.g., Type C) declines to move even with net gain.  
     - *Handling:* Note in debrief: "Migration is not purely economic; ties, risk, and identity matter."  

  3. **Luck Dominates Round:**  
     - *Issue:* Round B outcomes skewed if only one Type A moves, shifting median voter.  
     - *Handling:* Use public initial distribution to show rules drive differences, not randomness.  

  4. **Boundary Vote Foreclosed:**  
     - *Issue:* Students rush to use majority rule without debating alternatives.  
     - *Handling:* In debrief: "You authorized a procedure without asking who should authorize it."  

  5. **Round Collapse (e.g., no migrants in C):**  
     - *Issue:* Guestworker status deters all movement.  
     - *Handling:* Run a hypothetical: "Assume 2 Type C moved. How would votes/tax change?"  

  ---

  ### **Limitations & Closing Gaps**  
  The simulation simplifies reality. To close gaps, add:  
  1. **Disenfranchisement as Wrong, Not Bad Deal:**  
     - *Simulation:* Guestworkers "lose" 1–2 points.  
     - *Close Gap:* "Guestworker status denies political agency—a moral harm beyond net loss."  
  2. **Migration as Complex Choice:**  
     - *Simulation:* Purely economic, risk-free moves.  
     - *Close Gap:* "Real migrants face uncertainty, cultural loss, and family separation—not just points."  
  3. **Guestworker Status as Political:**  
     - *Simulation:* Treated as a fiscal compromise.  
     - *Close Gap:* "This status creates a permanent underclass—excluded from democratic voice despite contributing."  

  ---

  ### **Stripped-Down Variant (12 Students, 50 Minutes)**  
  **Changes:**  
  - 6 Home (1A, 2B, 3C) and 6 Abroad (3A, 2B, 1C).  
  - Two rounds: **Round A** (tax before movement) and **Round B** (movement before tax).  
