prompt: |-
  I'm co-running a one-day public humanities workshop next month, working title "Judging the Dead," and the room is going to be a wierd mix: about 25 people, half of them local-history volunteers and county archivists, a handful of philosophy grad students, and a few who mostly come for the free lunch. In our planning calls the same fight keeps breaking out, and I've come to think it's actually three different fights in a trenchcoat. Some people mean a conceptual question: can you even describe what a seventeenth-century estate owner did to his dependents without importing categories nobody in his world possessed? Others mean a normative one: even granting that you can describe it, are you entitled to blame the man, given that he did what everyone around him did and what the best thinking of his own tradition endorsed? And a third group means something purely practical: whatever the verdict, does the hospital keep his name over the door, does the statue stay, do we still assign the text. I want an instrument that separates those, because at the moment everyone answers a different question and concludes the others are stupid.

  So please write me a sorting quiz — ten questions, each one a concrete case with two or three answer options — plus a decision-tree rendering of the same material and a scoring key that maps answer patterns onto leaves. Every question has to be answerable by someone who has never heard any of the labels; nothing may be a label in disguise (no "do you think presentism is wrong?" and no question whose wording tips you off which camp an answer belongs to). The cases have to carry the sorting weight, so at minimum include: an ancient slaveholder who never registers a qualm anywhere in the surviving record; a mid-nineteenth-century surgeon whose non-consensual experiments were already being denounced by a vocal minority of his own colleagues; a 1950s psychiatrist prescribing what we now call conversion therapy, in line with the mainstream of his profession; a medieval inquisitor who is sincere, careful, and scrupulous about the procedural rules internal to his own tradition; one case where the ignorance looks self-made — the actor read the abolitionist pamphlet, wrote a marginal note dismissing it, and carried on; and one symmetry case in which the participant has to say what would make it fair for our own great-great-grandchildren to condemn us for something we currently cannot see at all. I'd also like at least one question that forces a choice between what the historian is permitted to believe and what she's permitted to publish, since a lot of people happily judge in the study and refuse to put it in the book, and one that pins down whose standards are doing the work — the described community's or the describer's.

  The leaves I want to end up with, roughly: the no-discount view, where the historian applies the morality she actually lives by and says so; the understand-don't-blame contextualist; the split view (judgment legitimate, but quarantined out of historical description) and its mirror image if you think that's a real position — verdicts on the page, no moralizing voice behind them; the culpable-ignorance view, where the discount only covers ignorance that wasn't self-made, so it excuses the conformist but not the man with the marginal note; the two-tier view where we may judge but not enact, so the condemnation stands and the building keeps its name; the symmetry view, on which any rule you endorse has to be one you'd accept having applied to you from the future; and the deflationary case-by-case view that "the past" isn't a single thing and there's no general answer to give. For each leaf, one sentence on its most awkward commitment — the thing whoever lands there is going to have to swallow. Then the bit I care about most: lay out the full grid of answers to the three questions I described at the top, tell me which cells are empty and why, distinguishing cells that are incoherent from cells that are merely unattractive from ones that are just unexplored and somebody should write the paper on them. And flag the pairs of leaves your tree can't really separate — I already suspect "he didn't know better so he isn't to blame" and "blame is anachronistic so don't" will come out identical on a tick-box questionnaire, and if that's true I'd much rather you said so than dressed it up. No citations or reading list, I'll add my own pointers afterwards, but if you attach a person's name to a leaf, describe the view in enough detail that someone who's never heard of them still gets sorted correctly. Two sides of A4 if you can manage it, questions first and key after, so nobody can see the scoring while they're answering.
reasoning: |-
  Okay, let me approach this systematically. The user needs a sorting tool to disentangle three distinct debates about historical judgment that keep getting conflated in their workshop planning: conceptual (can we accurately describe past actions?), normative (is blame appropriate?), and practical (what consequences follow?). 

  First, I consider how to design questions that force differentiation without tipping off respondents. The cases must cover:
  - Ancient slaveholder (baseline conformity)
  - 19th-century surgeon (contemporary criticism exists)
  - 1950s conversion therapist (mainstream but future-condemned)
  - Medieval inquisitor (internally consistent)
  - Self-made ignorance case (explicit rejection of alternatives)
  - Future symmetry scenario
  Plus separate questions about belief vs publication and standards being used.

  For the quiz structure, I plan ten scenario-based questions with neutral multiple-choice options. Each option will subtly map to:
  A) Present judgment applied
  B) Contextual suspension of blame 
  C) Practical separation of judgment/consequences
  ...without labeling them as such.

  The decision tree will branch based on patterns like:
  - How consistently someone applies modern standards
  - Whether contemporary alternatives matter
  - If consequences should follow judgment
  - Handling of future retrospection

  For leaf definitions, I'll include:
  - No-discount (full modern judgment)
  - Contextualist (understand don't blame)
  - Split view (judge privately but not in scholarship)
  - Culpable ignorance (only excuses genuine unawareness)
  - Two-tier (condemn but preserve artifacts)
  - Symmetry (apply consistent rules across time)
  - Deflationary (case-by-case only)

  Crucially, I'll identify:
  - Incoherent combinations (e.g., "blame is anachronistic but we should remove statues")
  - Under-explored positions (e.g., "judge only when contemporaries objected")
  - Indistinguishable outputs (contextualism vs culpable ignorance when no alternatives existed)

  The scoring key will map answer patterns to leaves while exposing each position's toughest implication - like symmetry advocates accepting future condemnation of current blind spots.

  Throughout, I'll maintain strict neutrality in wording and avoid any academic jargon that could bias responses. The focus stays on concrete cases revealing underlying frameworks.
answer: |-
  ### Historical Judgment Sorting Quiz  
  *Answer each scenario based on your instinctive reaction. Choose one option per question.*  

  1. **Ancient Athenian Slaveholder (4th c. BCE)**  
     A wealthy landowner, recorded as kind to friends and pious toward gods, enslaves war captives. No surviving texts show him questioning slavery.  
     A) His actions are indefensible by any standard.  
     B) We cannot fairly condemn him—slavery was universal then.  
     C) Judge him in private, but historical accounts should omit moral labels.  

  2. **1840s Surgeon (Experimental Surgery)**  
     Dr. Gray performs painful experimental surgeries on unconscious patients without consent. A minority of colleagues condemn this; most see it as necessary for progress.  
     A) He should be condemned—some contemporaries knew it was wrong.  
     B) His intentions (medical progress) partially excuse him.  
     C) Remove his hospital plaque, but don’t moralize in history books.  

  3. **1950s Conversion Therapist**  
     Dr. Lee prescribes electroshock "therapy" for homosexuality, following APA guidelines. He genuinely believes he’s healing patients.  
     A) He bears moral responsibility for harm caused.  
     B) He can’t be blamed—he followed accepted science.  
     C) Statues of him should remain; judgment belongs elsewhere.  

  4. **Medieval Inquisitor (13th c.)**  
     Brother Thomas meticulously follows Church law when trying heretics: allows defense arguments, avoids torture where forbidden. He believes he saves souls.  
     A) His procedural fairness doesn’t absolve persecuting innocents.  
     B) Judged by his era’s rules, he acted ethically.  
     C) Historians should describe his actions neutrally, not praise/blame.  

  5. **18th c. Merchant & Abolitionist Pamphlet**  
     John Clarke trades enslaved people. When given an abolitionist tract, he scribbles "naïve nonsense" in the margin and continues trading.  
     A) His dismissal makes him *more* culpable than peers.  
     B) He’s no worse than others—society endorsed his views.  
     C) Whether he’s "blameworthy" is irrelevant to documenting his role.  

  6. **Symmetry Scenario (Future Judgment)**  
     What would make it fair for descendants in 2124 to condemn *us* for accepted modern practices?  
     A) Nothing—future ethics may evolve, but our current understanding limits our duty.  
     B) If *we* condemn identical harms in past societies, making hypocrisy.  
     C) Only if we ignore clear warnings (e.g., climate science today).  

  7. **Historian’s Dilemma (Belief vs. Publication)**  
     Researcher concludes a 19th c. industrialist was morally reckless. Should she state this in her book?  
     A) Yes—scholarship shouldn’t hide moral truths.  
     B) No—historical writing must remain neutral.  
     C) Only if condemning him affects reparations/memorials.  

  8. **Whose Standards?**  
     When evaluating a colonial governor’s brutality, should we prioritize:  
     A) How *we* perceive justice/harm today.  
     B) How *his peers* viewed his actions.  
     C) What policies his statues/monuments support now.  

  9. **Ignorant Benefactor Case**  
     A university is named for a 1700s donor who profited from slavery. Archives prove he knew critics called it evil, yet he defended it.  
     A) Rename the university—he chose complicity.  
     B) Keep the name—his philanthropy outweighs flawed origins.  
     C) Judge him harshly, but the name isn’t about morality.  

  10. **Overdetermined Harm**  
      A 1920s teacher sterilizes disabled students, believing it prevents "degeneracy." Laws permitted this; scientists endorsed it.  
      A) She’s blameworthy—outcomes matter more than intent.  
      B) She merits leniency—she couldn’t foresee modern ethics.  
      C) Focus on dismantling her ideology’s legacy, not her character.  

  ---

  ### Decision Tree & Scoring Key  
  *(Map your answers A/B/C to numbers: A=1, B=2, C=3)*  

  **Step 1: Conceptual Priority (Q1, Q4, Q8)**  
  - Sum Q1 + Q4 + Q8:  
    *3–5*: Prioritizes *describer’s standards* (modern ethics).  
    *6–7*: Prioritizes *described community’s standards* (contextual ethics).  
    *8–9*: Rejects fixed standards; case-by-case.  

  **Step 2: Normative Stance (Q2, Q3, Q5, Q10)**  
  - For Q2, Q3, Q10: **A=Blame**, **B=Excuse**, **C=Neutralize**.  
  - Q5: **A=Culpable**, **B=Excused**, **C=Irrelevant**.  
    *Dominant A*: No moral discount (judge harshly).  
    *Dominant B*: Contextual excuse (don’t blame).  
    *Mixed A/B*: Culpable ignorance (blame only avoidable harms).  
    *Dominant C*: Quarantine judgment (split view).  

  **Step 3: Practical Action (Q7, Q9)**  
  - Q7: **A=Publish judgment**, **B=Suppress judgment**, **C=Conditional on impact**.  
  - Q9: **A=Remove**, **B=Keep**, **C=Decouple judgment/symbols**.  
    *A+A*: Enact condemnation (e.g., remove names).  
    *B+B*: Preserve artifacts (judgment irrelevant).  
    *C/C*: Two-tier (condemn without erasure).  

  **Step 4: Symmetry Test (Q6)**  
  - A: Asymmetric (present ethics sovereign).  
  - B: Symmetric (consistent rules across time).  
  - C: Culpable-ignorance symmetry (blame only unexamined choices).  

  ---

  ### Leaves & Awkward Commitments  
  1. **No-Discount View** (e.g., G.E.M. Anscombe)  
     *Awkwardness*: You must condemn *every* historical figure who violated modern ethics—even those with no conceptual alternative.  
  2. **Contextualist** (e.g., Quentin Skinner)  
     *Awkwardness*: A sincere Nazi following 1940s German "virtues" escapes blame.  
  3. **Split View** (Judgment quarantined)  
     *Awkwardness*: You privately deem Gandhi racist but write "his views reflected his time" as historical "neutrality."  
  4. **Culpable Ignorance View**  
     *Awkwardness*: The 1950s therapist is excused; the pamphlet-dismissing merchant is not—*even if outcomes were identical*.  
  5. **Two-Tier View**  
     *Awkwardness*: You demand a slave trader’s statue fall *while insisting historians avoid calling him "evil."*  
  6. **Symmetry View** (e.g., T.M. Scanlon)  
     *Awkwardness*: You must accept future condemnation of *your* meat-eating/car use as fair—even if unthinkable now.  
  7. **Deflationary View**  
     *Awkwardness*: You reject all general principles, so "Was X wrong?" always means "Wrong *according to whom?*"  

  ---

  ### Answer Grid Analysis  
  |                          | **Conceptual: Can we describe?**       | **Normative: Can we blame?**          | **Practical: Act on judgment?**       |  
  |--------------------------|----------------------------------------|----------------------------------------|----------------------------------------|  
  | **No-Discount**          | Describer’s standards ✅               | Blame ✅                              | Enact condemnation ✅                 |  
  | **Contextualist**        | Described community’s standards ✅     | Excuse ✅                             | Preserve artifacts ✅                 |  
  | **Split View**           | *Incoherent*: Describes neutrally but judges personally | Blame (private) ✅ | Suppress judgment ✅ |  
  | **Culpable Ignorance**   | Describer’s standards ✅               | Blame if avoidable ✅                 | *Unexplored*: Often enacts selectively |  
  | **Two-Tier**             | *Incoherent*: Applies modern ethics but forbids stating them | Blame (implicit) ✅ | Decouple symbols ✅ |  
  | **Symmetry**             | *Unattractive*: Future standards may override both | *Case-by-case* | *Unattractive*: May require future reparations |  
  | **Deflationary**         | Case-by-case only ✅                   | Case-by-case only ✅                  | Case-by-case only ✅                  |  

  **Empty/Incoherent Cells**:  
  - ✘ **Split View + Conceptual**: Claims description must be neutral *while* relying on modern ethics to judge privately.  
  - ✘ **Two-Tier + Normative**: Condemns implicitly (via removing statues) while forbidding explicit moral language.  
  - ◯ **Culpable Ignorance + Practical**: Often enacts judgment (renaming) but lacks theory for *when* symbols should fall.  

  **Indistinguishable Pairs**:  
  - Contextualist vs. Culpable Ignorance (when no alternatives existed, both excuse the actor).  
  - Split View vs. Deflationary (both avoid blanket rules; differs only in *why*).  

  **Key Insight**: Contextualism ("don't blame") and Symmetry ("blame only if you'd accept future blame") *conflict* when past actors had alternatives (e.g., the surgeon). Contextualism excuses him; Symmetry demands condemnation if we condemn identical modern negligence.  

  **Format**: 2 pages (Quiz: 1 pg, Key: 1 pg).
