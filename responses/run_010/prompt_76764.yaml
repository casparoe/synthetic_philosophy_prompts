prompt: |-
  So I'm TA'ing a 300-level philosophy of mind seminar and next week's slot is "the emotions" — 14 students, 75 minutes, a whiteboard, and a pack of index cards I already stole from the department office. I really don't want to stand at the front and narrate the three candidate answers (emotion as a kind of judgment, emotion as a kind of perception, emotion as a raw bodily feel), because half the section will just take notes and pick one, and the two people who've read stuff on emotion already will dominate. I want an activity where the three answers come apart in the students' own mouths: they try to describe a single emotional episode inside a deliberately restricted vocabulary, discover what the restriction costs them, and can't just retreat to "well obviously it's all three at once." No theory names up front, no prereading required (they've got a textbook chapter and maybe a third will have done it), and I want them to be the ones who notice the gap rather than me pointing at it.

  Here's the mechanic I've been toying with — improve it or tell me it's dumb. Groups of 3 or 4, every group gets the *same* vignette card. My working example: a doctoral student opens a reviewer report on her paper, reads two pages without much reaction at all, then notices her hands are shaking and her coffee has gone stone cold, and only at that point realizes she has been furious for twenty minutes — furious at a reviewer she has never met and whose name she doesn't even have. Then each group gets a secret house rule about what they're allowed to say in their written description of what happened. One house may talk only about bodies, arousal, and behavioral dispositions, and may not mention anything the emotion is *about*. One house may talk only about evaluations, appraisals, and commitments, and may not mention any felt quality whatsoever. One house may talk freely about the report "striking her as" dismissive and about her "seeing it as" a slight, but may not cash that out as either a belief or a bodily state. And the part I like: a house loses any word from its allowed list if another house can catch it doing covert work the rule was supposed to exclude — so the evaluation-only house gets dinged the moment someone points out that "she took it to be unfair" is smuggling in a claim about what it feels like from the inside. After that comes an attack phase where each house has to produce a case, real or invented, that some other house's vocabulary flat-out cannot describe, specific enough that the accused house can't paraphrase its way around it.

  What I need from you is the whole runnable thing. The vignette cards — I'd like at least four, including one where the emotion is disavowed on good evidence (the person knows perfectly well the thing in the bathtub isn't going to hurt her and says so sincerely while backing out of the room), one where theres no object that actually exists, which I want you to think hard about because I suspect it puts the "seeing it as" house in a bind about whether you can see-as something that isn't there, and one where the person reports the feeling vividly but has no idea what it's about or whether it's about anything. Then the exact wording of the house rules and of the word-catching rule so it doesn't dissolve into a shouting match about synonyms; a minute-by-minute timeline for 75 minutes including when I shut the attack phase down; what goes on the board and in what order; and the debrief, where I finally get to name the three seperate positions and map each house's breakdown onto a precise pressure point on a precise theory — not "they all have problems," but which family of case defeats which account and why, plus what a theory has to give up to survive it. Also tell me what predictably goes wrong the first time someone runs this and how to handle it (my guess: the body-only house gets bored and starts cheating, and some student says "but isn't the shaking just the anger?" and short-circuits everything at minute 12). And I want one honest paragraph about what a paper-and-cards exercise structurally cannot reproduce about the very thing the whole debate is supposed to be about, so I can say that out loud instead of letting them leave thinking they've settled it. If you think the word-catching rule is too cute and will eat the session, say so and hand me a cheaper version of it. Don't send me a reading list — I know what to read, I just need something that works on a Tuesday.
reasoning: |-
  Okay, let me unpack this TA's request. They're designing a seminar on philosophy of mind focusing on emotions and want an interactive activity that makes students experience the limitations of three main theories: judgment, perception, and bodily feeling approaches. The core challenge is creating an exercise where students discover these theoretical gaps through constrained description tasks, without prior theory exposure.

  First, considering the time constraints - 75 minutes with 14 students. Group work seems essential, so dividing into three or four groups makes sense. The vignette cards need to be carefully designed to highlight specific tensions between the theories. The TA mentioned four scenarios: disavowed emotion (like fear despite knowing safety), non-existent object (targeting the perceptual model), unidentified feeling, and their original anger example. 

  For the house rules, clarity is crucial to prevent cheating. The bodily vocabulary group should be strictly limited to physiological terms, prohibiting any intentional language. The judgment group must avoid phenomenological or somatic language. The perceptual group gets tricky with "seeing-as" language but can't reduce to beliefs or bodily states. The word-catching mechanic could work if rules are crystal clear - maybe appointing group ambassadors to monitor others would help.

  The attack phase needs structure to avoid chaos. Groups should prepare specific counterexamples that break rival frameworks. Timing is tight: 5 min intro, 20 min constrained descriptions, 20 min challenge phase, 20 min counterexamples, then 10 min wrap-up. 

  Potential pitfalls: students might collapse distinctions prematurely ("isn't shaking just anger?"). Preparing comeback lines like "that's exactly what's at stake" could redirect to deeper analysis. The bodily group might disengage if they feel their theory is reductive - emphasizing their critical role in the attack phase may help.

  Debriefing should explicitly connect each group's struggle to actual theories: bodily group's issues with James-Lange, judgment group with cognitivism, perceptual group with Roberts or Goldie. Highlighting what gets lost in each approach - like how bodily focus misses intentionality - reinforces the philosophical point.

  Finally, acknowledging the exercise's limitations: constrained language can't capture emotion's lived complexity, and theories often try to explain what gets amputated in this activity. This meta-commentary prevents oversimplified conclusions.
answer: |-
  Here's a complete, runnable 75-minute seminar plan designed to make the theoretical tensions visceral, with built-in safeguards against your concerns:

  **Core Mechanic:** Constrained Description → Word-Catching → Counterexample Attack  
  *Goal:* Force experiential awareness of what each theory amputates.

  **Vignette Cards (4 Copies Each):**  
  1. **"Cold Fury"** (Your Original):  
     *A doctoral student opens a reviewer report. She reads two pages calmly. Only when she notices her hands shaking and her coffee stone cold does she realize she’s been furious for twenty minutes at a reviewer she’s never met.*  
     *(Pressure Point: Unconscious emotion, bodily registration before cognitive recognition)*

  2. **"The Harmless Thing"** (Disavowed Emotion):  
     *Someone sees a rubber snake in their bathtub. They *know* it’s fake, they *say* "It’s just rubber, it can’t hurt me," yet they feel their chest tighten, breath quicken, and they back slowly out of the room, unable to step closer.*  
     *(Pressure Point: Emotion persists despite contradictory judgment; bodily/behavioral disconnect from belief)*

  3. **"The Empty Chair"** (Nonexistent Object):  
     *After a bitter argument, a person sits alone in their living room. They stare at the empty chair where their partner usually sits. They feel a sharp pang of resentment, a flush of heat in their face, and a strong urge to shout accusations... at the empty chair.*  
     *(Pressure Point: Emotion directed at an absent/nonexistent object; challenges intentionality without a present target)*

  4. **"Unexplained Dread"** (Objectless Feeling):  
     *Walking through a sunny, familiar park on an ordinary Tuesday, a person is suddenly overwhelmed by a profound sense of dread. Their stomach drops, their legs feel heavy, they scan the environment but find no threat or cause. The feeling persists for minutes, then fades, leaving them unsettled but baffled.*  
     *(Pressure Point: Raw affective state lacking any identifiable object or cognitive appraisal)*

  ---

  **House Rules (Written on Separate Cards for Each Group):**

  *   **House A: The Body Keepers:**  
      *"You may ONLY describe: PHYSICAL SENSATIONS (shaking, heat, cold, tightness), VISIBLE BEHAVIORS (backing away, freezing, facial expressions), and PHYSIOLOGICAL CHANGES (heart rate, breathing, sweating). You MUST avoid: Any description of what the emotion is *about*, any words implying judgment or meaning (e.g., 'unfair', 'threatening'), or any reference to how it *feels* subjectively (e.g., 'dread', 'fury'). Stick to the observable body."*

  *   **House B: The Judgment Masters:**  
      *"You may ONLY describe: APPRAISALS, EVALUATIONS, BELIEFS, and JUDGMENTS (e.g., 'she judged it as unfair', 'he assessed it as a threat', 'they believed they were slighted'). You MUST avoid: Any description of bodily feelings (shaking, heat), behavioral urges (to run, shout), or raw phenomenal qualities (dread, fury). Stick to the cognitive assessment."*

  *   **House C: The Perception Tribe:**  
      *"You may ONLY describe: How the situation APPEARS or PRESENTS itself to the person (e.g., 'the report struck her as dismissive', 'the bathtub thing loomed as threatening', 'the park felt ominous'). Use phrases like 'saw it as...', 'appeared as...', 'presented itself as...'. You MUST avoid: Explaining this appearance as a BELIEF/JUDGMENT (e.g., 'she believed it was dismissive') OR as a purely BODILY STATE (e.g., 'her shaking meant anger'). Describe the world *as experienced*, not the thought about it or the body in it."*

  ---

  **The Word-Catching Rule (Explain Verbally & Write on Board):**  
  *"Each House has a protected vocabulary list (Body, Judgment, Perception). If *any other group* catches a House using a word from their *own* list to sneak in a concept *explicitly forbidden* by their rule, that word is LOST to them for the rest of the activity. Be specific! Point out the exact word and how it's smuggling forbidden content.*  
  *Example: If the Judgment Masters (House B) say 'She *felt* it was unfair' – 'felt' might be caught by the Body Keepers (House A) because it smuggles in subjective feeling, which House B is forbidden to describe. If the catch is valid, House B loses the word 'felt'."*

  ---

  **Timeline (75 Minutes Total):**

  1.  **(5 min) Setup & Framing:**  
      *   "Today we're exploring how we *describe* emotional experiences. Forget theories for now. We're doing a constrained description exercise. Each group gets a vignette and a strict set of rules for describing it."  
      *   Divide into 4 groups (3-4 students each). Give each group 1 Vignette Card and 1 House Rule Card. **Assign Houses:** Aim for 1-2 groups per House type (e.g., 2 Body groups, 1 Judgment, 1 Perception).  
      *   Stress: **DO NOT NAME YOUR THEORY OR HOUSE TYPE TO OTHERS YET.** Focus on *your* rule.  
      *   Write the 3 Protected Vocab Categories on Board: **Body**, **Judgment**, **Perception**.

  2.  **(20 min) Constrained Description & Word-Catching:**  
      *   Groups work privately to write a 3-5 sentence description of their vignette *strictly* adhering to their House Rule.  
      *   **After 10 min:** Stop writing. Groups now **read their descriptions aloud** to the whole class, *one group at a time*.  
      *   **After each reading:** Open the floor for **Word-Catching** (2 min max per group). Other groups challenge *any* word in the description that seems to violate the *speaking group's own rule*. Moderator (you) adjudicates quickly: "Valid catch, House X loses word 'Y'", or "Not valid, 'Y' stays". Note lost words on board under the Vocab Category. *Focus on the rule violation, not synonyms.*  
      *   *(Likely Issue: Body group might say "anger" - catch: 'anger' smuggles in judgment/phenomenology. They lose 'anger'. Judgment group might say "she felt judged" - catch: 'felt' smuggles bodily/phenomenal. They lose 'felt'. Perception group might say "it appeared dangerous" - Body group catches 'dangerous' as smuggling judgment? Adjudicate: 'dangerous' is likely permissible for Perception if presented *as an appearance*, not a judgment - unless they say "she *knew* it was dangerous".)*

  3.  **(20 min) Counterexample Attack Phase:**  
      *   "Now, each House must attack another. Pick *one* other House type. Invent or recall a *specific, concrete emotional episode* that you claim *cannot be described* using *only* the vocabulary allowed by *their* House Rule. Be ruthless. Make it impossible for them to paraphrase."  
      *   Groups prep their attack (5 min).  
      *   **Attack Structure (Strict 3 min per attack):**  
          1.  Attacker: "House [X], describe THIS using ONLY your rule: [Brief description of case]."  
          2.  Accused House: Attempts description under their constraint (1 min).  
          3.  Attacker: Explains *why* the description fails/can't capture key elements.  
          4.  Accused House: Brief rebuttal (30 sec).  
          5.  Moderator (You): Summarizes the core tension exposed. *Do not resolve it.*  
      *   **Targeted Attacks (Predict & Guide if needed):**  
          *   **Body Keepers (A) attack Judgment Masters (B):** Use **"Unexplained Dread"**. "How do you describe the raw, objectless dread *without* talking about the feeling or body?" (B will struggle to make an *appraisal* without an object).  
          *   **Judgment Masters (B) attack Perception Tribe (C):** Use **"The Harmless Thing"**. "It *appeared* threatening? But she *knows* it isn't! How can it 'appear as' threatening while simultaneously being judged as harmless?" (C struggles with disavowal - appearance vs. belief conflict).  
          *   **Perception Tribe (C) attack Body Keepers (A):** Use **"The Empty Chair"**. "Describe the resentment *directed at the empty chair* using only bodies/behaviors. How does your description capture *what* the resentment is *about*?" (A struggles with intentionality/object-directedness).  
      *   *(Likely Issue: "But isn't shaking just anger?" - Intervene: "That's precisely the question! House A *can't* call it anger under their rule. What does House B or C lose if they *have* to equate shaking with anger? Keep attacking the *constraint*!")*

  4.  **(20 min) Debrief & Theory Mapping:**  
      *   **Reveal & Name (5 min):**  
          *   House A = **Bodily Feeling Theory** (James-Lange, Prinz). Core: Emotions *are* perceptions of bodily changes.  
          *   House B = **Judgment/Cognitive Theory** (Solomon, Nussbaum). Core: Emotions *are* evaluative judgments.  
          *   House C = **Perceptual Theory** (Roberts, Goldie). Core: Emotions *are* ways of seeing-as/construing the world.  
          *   Write these on the board next to the Protected Vocab lists and Lost Words.  
      *   **Map the Breakdowns (10 min):** Walk through the key pressure points exposed:  
          *   **Bodily (A) Breakdown:**  
              *   *Lost Words:* Likely lost terms implying meaning (anger, fear) or internal feeling.  
              *   *Failed Attack:* "Empty Chair" - Can't capture *intentionality* (aboutness). *Survival Cost:* Must deny emotions are inherently about objects or must reduce intentionality to bodily cause/effect (hard!).  
              *   *Pressure Point:* Cases with clear object but ambiguous/absent bodily feeling (e.g., quiet resignation, aesthetic appreciation).  
          *   **Judgment (B) Breakdown:**  
              *   *Lost Words:* Likely lost 'felt', 'sensed', 'experienced'.  
              *   *Failed Attack:* "Unexplained Dread" - Can't capture *non-cognitive affect* or *objectless feeling*. "Harmless Thing" - Can't explain *persistence despite contrary judgment*.  
              *   *Survival Cost:* Must deny existence of objectless affect or explain disavowal as hidden/irrational judgment (controversial!).  
              *   *Pressure Point:* Phobias, recalcitrant emotions, startle reactions.  
          *   **Perception (C) Breakdown:**  
              *   *Lost Words:* Likely struggled with terms implying judgment ('knew', 'believed') or pure sensation.  
              *   *Failed Attack:* "Harmless Thing" - Can't easily reconcile *appearance-as-threatening* with *judgment-as-harmless*. "Empty Chair" - Can *appearing-as* be directed at nothing?  
              *   *Survival Cost:* Must clarify the ontology of "appearances" (non-doxastic?) and how they relate to belief/bodily feeling. Risk of vagueness.  
              *   *Pressure Point:* Emotions about fictional/nonexistent entities, cognitive penetration of emotion.  
      *   **The Structural Limitation (5 min - SAY THIS VERBATIM):**  
          *   "This exercise forced us to amputate parts of emotional experience to isolate theoretical components. That's its strength for seeing the theories clearly. But its *fatal weakness* is that *real emotional experience isn't amputated*. It's lived as an integrated whole – bodily sensation, world-directedness, and evaluative significance fused together in a way that feels seamless and immediate. No theory on the board fully captures *that* lived unity. Our exercise replicated the *theorist's* dissection, not the *experiencer's* unity. The debate is about how (or if) these dissected parts can be put back together, or which one is truly fundamental. You haven't settled it; you've felt where the stitches strain."

  **Predictable Problems & Solutions:**

  1.  **"But isn't [Bodily State] just the [Emotion]?" (e.g., "Isn't shaking just anger?"):**  
      *   *Solution:* "Exactly! That's the core claim of the Bodily Feeling Theory (House A). But House B (Judgment) would say the shaking only *becomes* anger when combined with the judgment of slight. House C (Perception) might say the shaking is part of *how* the slight is apprehended. The point of the constraint is to see what happens if we *can't* make that easy equation. What does each theory *lose* if it's forced to separate them? Keep attacking the constraint."

  2.  **Body Keepers Get Bored/Cheat:**  
      *   *Solution:* Assign them the "Unexplained Dread" vignette – it's *hard* for them. They'll want to say "dread" but can't. Emphasize their crucial role in the Attack Phase – they have powerful weapons against Judgment ("How do you describe *this feeling* without feelings?") and Perception ("How do you describe *what it's about* without intentional language?").

  3.  **Word-Catching Descends into Synonym Debates:**  
      *   *Solution:* Be a firm referee. Focus on the *House's own rule*. Ask: "Does using word X *require* or *strongly imply* a concept Y that their rule *forbids*?" If yes, lose the word. Don't get bogged down in "could it mean something else?" If it's ambiguous, warn but don't ding. Move quickly. The goal is disruption, not linguistic perfection.

  4.  **Dominant Students:**  
      *   *Solution:* The group structure helps. During Attack Phase, require the *group* to respond, not just one person. During debrief, explicitly map struggles back to group work ("House B, you really felt the pinch when you couldn't use 'feel', didn't you?").

  5.  **Perception Tribe is Confusing:**  
      *   *Solution:* Their rule *is* the hardest. Prime them with clear examples: "The dark alley *felt menacing*," "His comment *came across as* insulting." During word-catching, defend them if they stick to appearance language. Their bind in "Harmless Thing" ("It appeared threatening, even though I knew it wasn't") is GOLD – it perfectly mirrors the Perceptual theory's challenge with recalcitrant emotions.

  **Why This Works:**  
  It forces students to *embody* the theories' limitations through frustrating constraint. The word-catching makes the smuggling attempts (and thus the missing elements) explicit. The attack phase forces them to generate the very counterexamples central to the philosophical debate. The debrief directly links their struggle to the named theories and their specific faults. Acknowledging the exercise's artificiality at the end prevents false closure. It’s messy, active, and makes the theoretical tensions *felt*. Go forth and dismember emotion!
