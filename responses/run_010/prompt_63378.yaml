answer: |-
  Below is a disambiguation of the slogan "all traditions are invented traditions," structured as a numbered menu of distinct theses. Each is presented with its core claim, conditions for truth, evidentiary requirements, and a verdict on its plausibility. This is followed by an analysis of the three committee arguments, identifying which reading each requires, its entitlement to that reading, and the residual argument when the slogan is removed.

  ### Menu of Readings: "All traditions are invented traditions"

  1.  **The Minimalist Reading (Human Origin):**  
      **Thesis:** All traditions originate from human actions and decisions, not divine revelation or natural necessity.  
      **Conditions for Truth:** No tradition exists that was not initiated, modified, or sustained by human agency.  
      **Evidence:** Historical anthropology showing human cultural development; absence of traditions with verifiable non-human origins.  
      **Verdict:** Platitude. No credible scholar or observer denies human cultural agency.

  2.  **The Anti-Essentialist Reading (Contingent Formation):**  
      **Thesis:** Traditions lack an immutable core or "essence"; their form and meaning evolve through historical contingency, not inherent logic.  
      **Conditions for Truth:** Demonstrating that the content, symbolism, or function of any tradition has shifted significantly due to social, political, or economic pressures, not internal necessity.  
      **Evidence:** Comparative historical studies showing adaptation/reinvention (e.g., Christmas traditions changing with consumerism; national symbols reinterpreted post-revolution).  
      **Verdict:** Substantive but defensible. Widely accepted in historiography/sociology, though some may argue for core "essences" in specific cases.

  3.  **The Deliberate Creation Reading (Identifiable Invention):**  
      **Thesis:** Traditions involve specific, datable acts of deliberate design by identifiable agents or groups to serve explicit purposes (e.g., nation-building, institutional cohesion).  
      **Conditions for Truth:** Archival evidence (minutes, speeches, designs) proving conscious creation at a known time, distinct from gradual accretion.  
      **Evidence:** Documentation like committee records showing the design of rituals (e.g., coronation rites revised in the 20th century; Olympic ceremonies).  
      **Verdict:** Contingent on cases. True for many modern state/institutional rituals, false for others (e.g., evolving folk customs).

  4.  **The Retrospective Formalization Reading (Accretion + Backdating):**  
      **Thesis:** Traditions often emerge from unplanned practices that "drift" over time; their antiquity is exaggerated later through formalization and false historical claims.  
      **Conditions for Truth:** Evidence of informal practices predating their codification, plus documentation showing later actors asserting false continuity.  
      **Evidence:** Discrepancies between early records (showing variability/absence) and later official narratives claiming ancient fixity (e.g., Highland kilt traditions; academic regalia origins).  
      **Verdict:** Substantive but defensible. Common pattern, especially in institutional/ nationalist contexts.

  5.  **The Normative Irrelevance Reading (Antiquity ≠ Authority):**  
      **Thesis:** A tradition’s claimed antiquity (true or false) does not logically determine its present normative force (obligation to preserve). Authority derives from current values, not past existence.  
      **Conditions for Truth:** Demonstration that arguments to preserve/abolish traditions succeed/fail based on present utility/sentiment, regardless of proven age.  
      **Evidence:** Cases where ancient traditions are abandoned without crisis (e.g., dueling); new traditions gaining deep commitment quickly (e.g., remembrance rituals).  
      **Verdict:** Substantive but defensible. A logical claim about justification, not a historical fact.

  6.  **The Strong Constructivist Reading (No "Genuine" Antiquity):**  
      **Thesis:** No tradition has demonstrable, meaningful continuity from its alleged point of origin; all claims of deep antiquity are fabrications or misunderstandings.  
      **Conditions for Truth:** Proof that *every* tradition claiming ancient roots either originated recently or has changed so fundamentally that continuity is illusory.  
      **Evidence:** Comprehensive historical audit of diverse traditions showing universal discontinuity or fabrication (an impossible standard).  
      **Verdict:** False. While many traditions exaggerate antiquity, some demonstrably maintain core elements over centuries (e.g., Papal inauguration; Japanese imperial rites).

  7.  **The Authenticity Levelling Reading (No Hierarchy of Origin):**  
      **Thesis:** If all traditions are "invented," none can claim greater inherent "authenticity" based on age or origin; value is purely functional or affective.  
      **Conditions for Truth:** Proof that judgments of "authenticity" always rely on subjective or ideological criteria, never objective historical pedigree.  
      **Evidence:** Cultural disputes where competing groups claim "authenticity" for incompatible versions of a tradition, with no objective resolution (e.g., folk music revivals; religious rites).  
      **Verdict:** Contingent. Plausible if "authenticity" requires unbroken continuity (rare), but false if it admits meaningful historical connection (possible).

  ---

  ### Analysis of the Three Committee Arguments

  1.  **Colleague Arguing for Abolition:**  
      **Required Reading:** Combines #3 (Deliberate Creation), #4 (Retrospective Formalization), and crucially #6 (Strong Constructivist Reading). Needs #6 to claim the procession’s "continuous life" is "false," and #3/#4 to support the 1870s as the "real" origin.  
      **Entitlement on Evidence:** Entitled to #3/#4 given the 1870s record and absence of earlier evidence for *this specific form*. **Not entitled to #6.** The university *does* have 15th-century origins; the procession ritual (like all human practices) is newer but *embodies* that continuity selectively. The "false claim" is overstated.  
      **Residual Argument without Slogan:** The procession is a 19th-century creation falsely presented as medieval. Preserving it obligates perpetuating a historical falsehood.  
      **Core Premise Needing Debate:** Does accurately representing institutional history outweigh the value of a ritual fostering community? (This is normative, not historical).

  2.  **Colleague Arguing for Replacement:**  
      **Required Reading:** Primarily #7 (Authenticity Levelling). Needs the claim that invention being universal negates any special status for existing traditions, making new creation equally valid/authentic. Also implicitly relies on #5 (Normative Irrelevance).  
      **Entitlement on Evidence:** Entitled to #1 (Human Origin) and likely #3/#4 for this ritual. **Not automatically entitled to #7.** #7 requires the additional premise that authenticity *only* derives from origin/antiquity (which the slogan doesn’t supply). People may value traditions for reasons beyond origin (e.g., familiarity, emotional resonance).  
      **Residual Argument without Slogan:** Since the current ritual is relatively recent and not sacrosanct, we are free to design a new one better suited to contemporary values/purposes.  
      **Core Premise Needing Debate:** Does the value of a tradition depend primarily on its functional utility in the present, or also on its established history and emotional attachment? (Normative/functional).

  3.  **Colleague Invoking Anderson ("Imagined Community"):**  
      **Required Reading:** Misapplies Anderson. Anderson’s "imagined" (members not knowing each other personally but sharing a mental model of belonging) **is not equivalent to any "invented" reading.** It addresses scale and abstraction in community formation, not the historical genesis of specific traditions.  
      **Entitlement on Evidence:** Anderson’s thesis is defensible for large universities/nations (#2 Anti-Essentialism is compatible). However, "imagined" does **not** mean "fictitious" or "arbitrarily invented" in the Hobsbawmian sense. It doesn’t directly address the procession’s history or normative force.  
      **Residual Argument without Slogan:** The university’s cohesion relies on shared symbols. Debating the "authenticity" of this symbol misunderstands how large communities function; focus on what it *does* now.  
      **Core Premise Needing Debate:** Does the ritual’s effectiveness as a unifying symbol depend on participants believing in its historical continuity, or can it work based on shared participation alone? (Sociological/functional).

  ### Conclusion
  The slogan "all traditions are invented traditions" functions as a chameleon premise. Its ambiguity allows it to support contradictory conclusions by conflating:
  -   Descriptive claims about origins (Readings #1-4, #6),
  -   Normative claims about authority (#5),
  -   Aesthetic/valuative claims about authenticity (#7), and
  -   Distinct concepts like Anderson’s "imagined."

  Your hypothesis is correct. The slogan itself does little work beyond rhetorical weight. Removing it forces the committee to engage with the substantive, often normative, premises hiding behind it: the ethics of historical representation, the sources of institutional obligation, the functional role of ritual, and the nature of authenticity. Focus the next meeting there.
