  ### What the Game **Can't** Produce (Requires Your Input)
  **The "Why Stop There?" Paradox**:  
  The game will show players passing early (e.g., Stage 1), but it won’t reveal why backward induction *demands* stopping immediately. Students might say:  
  *"If passing once is good, why not pass again?"*  
  **Supply this yourself**:  
  - **At Stage 3**, A takes because 4 > 3 (self-interest).  
  - **At Stage 2**, B *should* take because if A is rational, B gets 3 now (via TAKE) vs. 2 later (if A takes at Stage 3).  
  - **At Stage 1**, A *should* take because if B is rational, A gets 2 now (TAKE) vs. 1 later (if B takes at Stage 2).  
  **Emphasize the silence**: "BI never asks *why* A passed. It assumes passing is irrational and ignores it. But your cards? They screamed 'trust!' 'kindness!'—things BI can’t hear."

