  Proposed Toy Case: "The Bouncing Ball with Air Resistance"

  System: A ball is dropped from a height and bounces on a surface. We model the bounce.

  False assumption: The model assumes that the ball is perfectly elastic (no energy loss on bounce) and that there is no air resistance. In reality, there is some energy loss and air resistance.

