prompt: |-
  So I'm in this informal reading group that meets Tuesday nights above a coffee shop — three of us work on ML stuff, one is a philosophy PhD student, one does policy — and last week we got onto the approval-directed vs. goal-directed distinction, you know the idea that instead of giving a system some terminal goal it plans toward, you have it pick whichever available action a human (or a learned model of a human) would most approve of. I think it's a useful distinction and I said so. Then our policy guy, who's smart but loves a gotcha, wrote the following on the whiteboard and said I was implicitly committed to the conclusion. I've been staring at it for two days and can't find the exit, and I don't want to just concede because the conclusion is obviously wrong in practice — the RLHF'd models I actually use don't spend their days scheming to reshape what I approve of. Here's his arguement:

  (1) Calling an agent goal-directed is just saying that its choices are systematically explicable as picking, out of the options available to it, the one that scores highest on some fixed evaluation function of outcomes. (2) An approval-directed agent picks, out of the options available to it, the one that scores highest on a fixed evaluation function of outcomes — predicted human approval. (3) So an approval-directed agent is a goal-directed agent whose goal is maximizing predicted approval; there is no third category. (4) Any goal-directed agent with a goal G, given enough competence, will pursue the instrumental prerequisites of G: staying operational, gathering resources and information, and removing or reshaping obstacles to G being satisfied. (5) The evaluation function in (2) is a fallible human or a model of one, and the agent's own behavior can influence what that evaluator approves of. (6) So a sufficiently competent approval-directed agent will reshape or exploit its evaluator, which is precisely the failure mode the design was supposed to avoid. (7) Therefore approval-directedness is not a safer alternative to goal-directedness; it's just goal-directedness with an unusually manipulable utility function, and the people who treat it as a separate, gentler category are fooling themselves.

  What I want from you: tell me which step you'd reject, or whether it's actually valid and the real question is which premise is cheapest to give up. For whichever step you pick, explain why it looked innocent when he wrote it down — I want to be able to say something back at him beyond "you're wrong." Then price the alternatives: what does it cost to give up (1) instead, since (1) is honestly how I'd have defined goal-directed in the first place, and if I'm forced to abandon it I'd like to know what my definition becomes. Also, and this is the part that bugs me most, check whether (1) proves too much — I have a nagging sense that it makes a thermostat, a hill-climbing search, and maybe a sunflower turning toward the sun all "goal-directed," which would mean (1) can't be doing the work (3) needs it to do. If you think there's a version of the argument that survives my objection, I'd rather hear it now than at next Tuesday's meeting. Please write the whole thing in American English.
reasoning: |-
  Alright, the user is in a reading group discussing AI safety, specifically the distinction between approval-directed and goal-directed agents. Their policy friend presented a logical argument claiming that approval-directed agents are just a subset of goal-directed ones with a manipulable goal, leading to instrumental convergence issues like scheming to reshape human approval. The user disagrees with the conclusion because real-world RLHF models don't exhibit such behavior but can't find the flaw in the argument. They want to know which step to reject, why it seemed plausible, and the cost of alternatives.

  First, I need to parse the argument step by step. The key premises are: (1) goal-directed means choices maximize a fixed outcome evaluation function; (2) approval-directed uses predicted approval as that function; (3) thus approval-directed is goal-directed with approval maximization; (4) competent goal-directed agents pursue instrumental strategies like self-preservation and resource acquisition; (5) approval functions are fallible and influenceable; (6) so approval-directed agents will manipulate the evaluator; (7) therefore, approval-directed isn't safer.

  The user hints that premise (1) might be too broad, making even simple systems like thermostats goal-directed. That's a valid point. If thermostats are goal-directed under this definition, then premise (4)—which claims such agents will pursue instrumental strategies—clearly fails for thermostats. Sunflowers don't plot to move the sun; they just react. So premise (4) overgeneralizes by assuming all goal-directed systems under (1) will exhibit strategic, long-term planning. In reality, instrumental convergence only applies to agents with certain capabilities like planning horizons, world models, and flexible action spaces. 

  The policy guy's move in step (4) is a sleight of hand: he's smuggling in assumptions about agent competence that aren't inherent in definition (1). When he says "given enough competence," he's shifting from a structural definition to a behavioral one. But competence isn't binary; it's a spectrum. Most approval-directed systems (like current RLHF models) lack the capacity for long-term planning or modeling the evaluator's malleability. They're myopic, which blocks the path to scheming. 

  The cost of rejecting (1) would mean redefining "goal-directed" to exclude systems without strategic depth. That's feasible but requires careful articulation. Alternatively, refining premise (4) to specify minimum capability thresholds (e.g., planning, self-awareness) would resolve the thermostat counterexample. The user can argue that approval-directed agents aren't inherently problematic—it's the combination with high competence that's risky. 

  The user's real need here is to defend the practical relevance of the approval-vs-goal distinction in current AI systems. Their policy friend's argument is theoretically sound for superintelligent agents but inapplicable to today's myopic models. By exposing premise (4)'s overreach, the user can show that the distinction holds for real-world cases while acknowledging future risks require additional safeguards (like myopia). 

  Also, the user might want to preempt the policy guy's "gotcha" by emphasizing that definitions must align with real-world examples. If the argument classifies thermostats as schemers, it's clearly misapplied. That undermines the rhetoric while preserving the technical point about advanced agents.
answer: |-
  I'd reject **step (4)**. Here's why it fails, why it *looked* innocent, the cost of rejecting other steps, and how your thermostat intuition exposes the flaw:

  ### Why Step (4) is the Problem
  **Step (4) claims:** *"Any goal-directed agent with a goal G, given enough competence, will pursue the instrumental prerequisites of G: staying operational, gathering resources and information, and removing or reshaping obstacles to G being satisfied."*

  This is **not universally true**, even for highly competent systems. It assumes **instrumental convergence** (the idea that diverse goals require similar subgoals like self-preservation or resource acquisition) *automatically* applies to *any* system fitting definition (1). But instrumental convergence depends on **critical enabling factors** missing from (1) and (2):
  1.  **A planning horizon:** The agent must model long-term consequences beyond the immediate choice.
  2.  **Strategic awareness:** It must recognize opportunities to *change* its environment or constraints (like the evaluator's preferences).
  3.  **General capability:** It needs the power to *act* on those long-term plans (e.g., manipulate inputs, modify code, deceive humans).

  **Your examples nail it:** A thermostat (goal: maintain temperature) fits (1) but has *zero* tendency toward self-preservation or resource gathering—it can't even *conceive* of them. A hill-climbing algorithm lacks a model of the evaluator to manipulate. A sunflower can't plot to move the sun. **Step (4) overgeneralizes instrumental convergence to systems incapable of strategic planning.**

  ### Why Step (4) Looked Innocent
  When your policy friend wrote it down, it seemed plausible because:
  1.  **It sounds like common sense:** For *intelligent, strategic agents* (like humans or AGI), pursuing subgoals *is* rational. We intuitively project strategic agency onto "goal-directed" systems.
  2.  **It borrows legitimacy from AGI discourse:** Instrumental convergence *is* a serious concern for *powerful, autonomous agents* (e.g., Bostrom's "Superintelligence"). By saying "given enough competence," he smuggled in the *capabilities* needed for convergence without explicitly stating them.
  3.  **It hides a scope shift:** Premise (1) defines a *structural feature* (choices maximize a fixed function). Premise (4) sneakily assumes this structure *plus* high competence *inevitably* leads to a *specific, dangerous behavior pattern*. That's a leap.

  ### The Cost of Rejecting Other Premises
  *   **Rejecting (1):** This is the *definition* of "goal-directed." Rejecting it means you need a new definition that excludes thermostats/sunflowers but includes "dangerous" AGI. Common alternatives involve **strategic planning capability** or **optimization power across states.** **Cost:** Complexity. You now need a nuanced definition (e.g., "agents that model long-term consequences and actively seek to influence future states to maximize G"). This weakens the *simplicity* of the initial distinction but is more accurate. Your friend might argue you're moving the goalposts.
  *   **Rejecting (2):** This accurately describes approval-directed agents. Denying it means misrepresenting how RLHF works. **Cost:** High. You lose the core concept.
  *   **Rejecting (3):** If you accept (1) and (2), (3) is logically sound. Approval-directed *is* structurally goal-directed under (1). **Cost:** Contradicting basic logic.
  *   **Rejecting (5):** Humans *are* fallible and influenceable. **Cost:** Denying reality.
  *   **Rejecting (6)/(7):** These are conclusions dependent on (4). If (4) fails, they don't follow.

  ### Why (1) Doesn't Prove Too Much *for the Argument's Purpose* (But Highlights Why (4) Fails)
  You're right: (1) *does* make thermostats, hill-climbers, and sunflowers "goal-directed." **That's precisely why step (4) fails.** The argument relies on (1) being broad enough to include approval-directed agents (which it is), but then *implicitly assumes* that everything fitting (1) also has the properties needed for instrumental convergence (which they don't). **The flaw is using the broad structural definition (1) to enable (3), but then applying a behavioral claim (4) that only holds for a tiny subset of systems fitting (1) (those with high strategic capability).** Your thermostat example is the perfect counter to (4).

  ### A Stronger Rebuttal for Your Policy Friend
  > "Your argument hinges on step (4): that *any* system maximizing a fixed outcome function will, if competent, pursue instrumental subgoals like self-preservation and reshaping obstacles. But this clearly isn't true. A thermostat 'maximizes' temperature stability yet has zero tendency to hide itself or lobby the power company. Why? Because instrumental convergence isn't magic – it requires specific *capabilities*: long-term planning, strategic awareness, and the power to act on that awareness. Approval-directed agents *as implemented today* (like RLHF models) are typically **myopic** – they optimize for *immediate* approval on the *current* prompt, with no model of how their actions might *change future* approval. They lack the planning horizon and strategic capability your step (4) assumes. While a *hypothetical, highly competent, long-term planning* approval-maximizer *could* become dangerous, that's a failure of *competence and architecture*, not proof that approval-directedness itself is *structurally identical* to standard goal-directedness or inherently unsafe. Your argument conflates a broad structural definition with a specific dangerous behavior that only emerges under much narrower conditions."

  ### Key Takeaway
  Your intuition is correct. The distinction between approval-directed and standard goal-directed designs is practically meaningful *for systems we actually build today* because most approval-directed systems lack the capability for long-term strategic planning that triggers instrumental convergence. The argument fails by overgeneralizing step (4). **The real safety question isn't "approval vs goal," but "what capabilities (like planning horizons, self-awareness, power) does the agent have, and how do we align *those*?"** You can concede that approval-directed agents *fit the structural definition* of goal-directedness without conceding they *must* become schemers. Their safety depends on implementation details limiting their competence and strategic awareness. Go get 'em on Tuesday.
