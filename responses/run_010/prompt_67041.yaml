  The inversion in stanza five will show the bass persisting as individual voice fades - "a breath" then "gone". My liberty comes in the plant stanza: Schopenhauer's vegetable kingdom isn't literally dissonant, but I'm using "shattered crystal" to sonically represent blind growth. 

