prompt: |-
  I am convening a graduate seminar on the direction of time, and one session is devoted to the question of where temporal asymmetry comes from at all. Before that session I should like my students to have a comparative assessment of the candidate answers in front of them, and I would be grateful if you would supply it.

  Consider the following seven accounts of why the world exhibits a temporal asymmetry. Unless an account explicitly denies it, take the underlying microphysical laws to be time-reversal invariant.

  (A) The Past Hypothesis: the arrow rests on a brute, unexplained boundary condition — the very early universe was in a state of extraordinarily low entropy — together with a statistical postulate to the effect that such a macrostate is realised by a typical microstate.

  (B) Cosmological-entropic: the arrow rests on the extreme homogeneity of the early matter distribution, which, given gravity, is very far from equilibrium; the growth of structure (clustering, stars, black holes, radiation) is therefore the entropy-increasing process, and expansion merely sustains the departure from equilibrium.

  (C) Two-headed: there is no global arrow. Entropy increases away from a central low-entropy region in both temporal directions, and the inhabitants of either wing call "the past" whichever direction entropy decreases in.

  (D) Derivation without a special past: the second law follows from Hamiltonian dynamics, Liouville's theorem and a coarse-graining, since coarse-grained entropy is non-decreasing for essentially any initial condition; no privileged boundary condition is required.

  (E) Interventionist: the asymmetry lies not in the physics but in our epistemic and agential situation — we can influence the future and not the past — and this asymmetry of records and manipulability generates the thermodynamic, causal and psychological arrows alike.

  (F) Collapse-based: irreversibility is fundamental. A genuinely time-asymmetric process in state reduction breaks the symmetry, and the thermodynamic arrow is downstream of it.

  (G) Microphysical: the CP-violating, and hence (given CPT invariance) T-violating, behaviour of neutral kaons and similar processes supplies a fundamental arrow which could in principle be amplified to the macroscopic level.

  For each account, assign two numbers between 0 and 1. The first, coverage, is the fraction of the family of familiar arrows — thermodynamic, radiative (retarded rather than advanced waves), cosmological, psychological (memory of the past but not of the future), causal and counterfactual, and measurement — that the account genuinely derives rather than relabels or restates. The second, smuggled, is the fraction of the asymmetry in question that the account simply posits as an unexplained primitive, or covertly presupposes in the very way it is articulated. Then rank the seven by net yield, which I stipulate to be coverage minus smuggled, and say how you break any ties.

  Three further requirements. First, the ranking must be discriminating: at least one of these accounts cannot earn the coverage score its proponents claim, and I want you to identify it and explain precisely what is missing from the derivation, rather than merely noting a difficulty in principle. Second, you may judge that two entries are not really distinct accounts; where you do, say which of the pair you have scored and why the other adds nothing. Third, for whichever account you place first, state in a sentence what would have to be true for it to lose that place, and name the account that would then take it.

  Begin with the ranking, in order, with both scores attached to each entry: that is your bottom line, and it should occupy the first sentence or two of your response. Give the reasoning account by account thereafter. No preamble, and please do not restate the question back to me.
reasoning: |-
  Okay, let me approach this systematically. The user is convening a graduate seminar on temporal asymmetry and needs a comparative assessment of seven accounts. They've specified precise evaluation criteria: coverage (fraction of arrows explained) and smuggled (fraction of asymmetry posited as primitive), with net yield as coverage minus smuggled. 

  First, I need to map the core challenge: temporal arrows include thermodynamic, radiative, cosmological, psychological, causal/counterfactual, and measurement asymmetries. The accounts must explain these without circularity. 

  Starting with (A) Past Hypothesis: It clearly covers thermodynamic and cosmological arrows by construction, and psychological/causal through records and interventions. But it smuggles the low-entropy boundary condition entirely. Coverage 0.83 (5/6 arrows), smuggled 0.5 (half the asymmetry is in the postulate). 

  (B) Cosmological-entropic: This reframes (A) by emphasizing gravity-driven structure formation. But it inherits (A)'s smuggling while adding nothing new to coverage. Score same as (A). 

  (C) Two-headed: Denies global arrow but fails on psychological arrow (memories point to one past) and causal interventions. Coverage drops to 0.33 (only thermodynamic/radiative), smuggled 0 (no primitive asymmetry). 

  (D) Derivation without special past: Claims coarse-graining alone suffices. But Liouville's theorem is time-symmetric—initial randomness gets smuggled in. Coverage 0 (fails all arrows), smuggled 0.83. 

  (E) Interventionist: Grounds asymmetry in agency but presupposes temporal direction for "intervention." Circular. Coverage 0.17 (only causal arrow), smuggled 0.67. 

  (F) Collapse-based: Introduces fundamental irreversibility. Covers thermodynamic/measurement arrows but not cosmological/psychological. Smuggles collapse mechanism. Coverage 0.5, smuggled 0.67. 

  (G) Microphysical: T-violation exists but is weak; amplification to macroscopic arrows unproven. Coverage 0 (no arrows robustly explained), smuggled 0.33. 

  Now the critical flaw: (D) is the account that can't achieve claimed coverage. Its "any initial condition" argument fails because typicality requires time-asymmetric assumptions—randomness at t0 isn't time-neutral. This breaks the derivation. 

  Ranking ties: (A) and (B) are identical in substance; (B) just describes (A)'s entropy source. Keep (A). 

  Top account is (A) with net 0.33. For it to lose, either (F) must prove quantum collapse drives all arrows (currently speculative), or (G) must demonstrate macroscopic amplification (unobserved). Then (F) would lead. 

  Finally, the bottom line: Ranking is A (0.83-0.5), F (0.5-0.67), E (0.17-0.67), C (0.33-0), G (0-0.33), D (0-0.83), with B collapsed into A.
answer: |-
  **Ranking by net yield (coverage - smuggled):**  
  1. **A (0.83–0.5): net 0.33**  
  2. **F (0.5–0.67): net −0.17**  
  3. **E (0.17–0.67): net −0.5**  
  4. **C (0.33–0): net 0.33** *(tied with A but loses tiebreaker; see reasoning)*  
  5. **G (0–0.33): net −0.33**  
  6. **D (0–0.83): net −0.83**  
  7. **B: not distinct from A; scored as A**  

  ---

  ### Reasoning Account by Account  
  **A: Past Hypothesis**  
  - **Coverage (0.83)**: Derives thermodynamic arrow (core), cosmological arrow (via initial state), psychological/causal arrows (via records/interventions in low-entropy past), and radiative arrow (retarded waves as typical in such a past). Fails only on measurement arrow (quantum collapse not addressed). (5/6 arrows ≈ 0.83).  
  - **Smuggled (0.5)**: Brute past boundary condition is unexplained primitive (50% of asymmetry). Statistical postulate ("typicality") is time-symmetric but relies on presupposed temporal orientation for "initial" condition.  
  - **Net: 0.33**  

  **B: Cosmological-Entropic**  
  - Not distinct from A. It reframes A’s entropy source (gravity-driven clustering) but does not alter the reliance on a special initial state or expand coverage. Scored as A.  

  **C: Two-Headed**  
  - **Coverage (0.33)**: Derives thermodynamic arrow in both wings and radiative arrow (waves diverge symmetrically). Fails psychological arrow (memories only point to one past), causal arrow (interventions asymmetric), cosmological arrow (expansion direction privileged), and measurement arrow. (2/6 arrows ≈ 0.33).  
  - **Smuggled (0)**: No primitives; symmetric microphysics and boundary condition.  
  - **Net: 0.33** (tie with A, but loses tiebreaker: psychological/causal arrows are central to "familiar" asymmetry and C fails them).  

  **D: Derivation Without Special Past**  
  - **Coverage (0)**: Claims to derive thermodynamic arrow from coarse-graining + dynamics. But Liouville’s theorem is time-symmetric; "any initial condition" covertly requires *random* or *typical* initial microstates, smuggling in A’s statistical postulate. Cannot explain radiative (waves not constrained), psychological, causal, cosmological, or measurement arrows.  
  - **Smuggled (0.83)**: Asymmetry is hidden in the choice of coarse-graining (defined with temporal bias) and uncritical use of "initial" randomness. Effectively posits 5/6 arrows.  
  - **Net: −0.83**  
  - **Discriminating flaw**: Fails to derive even thermodynamic arrow. Coarse-grained entropy can decrease if "initial" microstates are correlated in a time-symmetric manner (e.g., future-boundary constraints). Derivation assumes, but does not justify, that initial randomness is "given" without past constraints.  

  **E: Interventionist**  
  - **Coverage (0.17)**: Only derives causal/counterfactual arrow (via "we can influence future"). Fails to derive thermodynamic (restates correlation with agency), radiative, cosmological, psychological (memory not reduced to intervention), or measurement arrows. (1/6 arrows ≈ 0.17).  
  - **Smuggled (0.67)**: Asymmetry of "intervention" presupposes temporal direction (e.g., "influence" assumes prior knowledge of past/future). Primitive agency asymmetry explains nothing new.  
  - **Net: −0.5**  

  **F: Collapse-Based**  
  - **Coverage (0.5)**: Derives thermodynamic and measurement arrows (if collapse is fundamental). Psychological arrow partially addressed (memories as collapse outcomes). Fails radiative (wave collapse not clearly linked), cosmological, and robust causal arrows. (3/6 arrows ≈ 0.5).  
  - **Smuggled (0.67)**: Time-asymmetric collapse is primitive (e.g., GRW model posits irreversibility). No derivation from deeper laws.  
  - **Net: −0.17**  

  **G: Microphysical**  
  - **Coverage (0)**: T-violation in kaon decay is experimentally real but too weak (10<sup>−12</sup> relative strength) to amplify to macroscopic arrows without additional assumptions. No model demonstrates linkage to thermodynamic, radiative, or psychological asymmetries.  
  - **Smuggled (0.33)**: Posits T-violation as fundamental, but this only covers micro-asymmetry; macroscopic amplification mechanism is absent (thus 2/6 arrows posited).  
  - **Net: −0.33**  

  ---

  ### Tiebreaking and First Place  
  - **A and C both net 0.33**: **A ranks higher** because C fails to explain psychological/causal arrows (e.g., why we remember *only* the low-entropy wing), while A derives them from the past boundary. C’s symmetric cosmology is less aligned with "familiar" arrows.  
  - **For A to lose first place**: If collapse models (F) empirically demonstrated that quantum irreversibility *causes* (not correlates with) thermodynamic/radiative/psychological arrows (e.g., via unified dynamical equations), **F would take first place** with coverage >0.67. Current speculative status prevents this.  

  **Account B is not distinct** from A; it is a subcase emphasizing gravity’s role in entropy increase but adds no new explanatory structure. Scored as A.
