prompt: |-
  I'm presenting my metaethical views at a work-in-progress session and would like a consistency audit before I circulate the handout. Here is the package:

  1. Wrongness is a matter of justifiability: an act is wrong if it would be ruled out by principles that no one could reasonably reject.
  2. Only personal reasons are admissible. Appeals to impersonal value, or to sums of welfare taken across people, are excluded at the threshold, not merely discounted.
  3. Complaints are weighed one-to-one. I never add together several individuals' weaker complaints so as to outweigh one stronger complaint belonging to a single person.
  4. So in a rescue case where one person will die unless I act and five others will each suffer an hour of mild discomfort unless I act, the right act prevents the death.
  5. In the reversed case, where one person will die unless I let a billion others each have an hour of mild discomfort, I'm confident the right act spares the billion.
  6. Where five lives are at stake against one, we are required and not merely permitted to save the five; I secure this by noting that the single complaint is satisfied by saving someone, so the further complaints on the other side are left unmet.
  7. A principle's being reasonably rejectable is not its being rejected: plenty of people will in fact refuse principles they have no good reason to refuse, and I take that to cost my view nothing.

  Which of these pull against each other, and how badly? Rank the tensions by severity, and for each say precisely what would have to be revised and what the revision costs the rest of the package — including whether the fix in one place reopens a problem elsewhere. Some of these items only look like they conflict; where that is so, say so explicitly and explain why, rather than flagging every pair. I'm not after a general exposition of contractualism or a defense of the view, just an account of where I'm actually exposed.
reasoning: |-
  Okay, I'm looking at this user's query about auditing their metaethical views for consistency. They're preparing for a work-in-progress session and want to identify tensions in their seven-point package before circulating it. 

  First, let me understand the core structure: their view is contractualist (point 1), with strict agent-relativity (point 2) and anti-aggregation (point 3). The rescue cases (4-6) are test scenarios, while point 7 clarifies that reasonable rejectability is normative, not empirical.

  Hmm, the most obvious tension jumps out between point 3's strict "no aggregation" rule and point 5's billion-discomfort case. How can saving a billion from mild discomfort override one death without aggregating? The user seems aware of this but confident in their position - I should probe why. Maybe they're distinguishing complaint types (discomfort vs death) rather than summing intensities? But point 3 explicitly forbids adding complaints.

  Point 6 also feels tricky - saving five lives over one because the "single complaint is satisfied by saving someone" sounds like a clever move, but does it covertly aggregate? If I save five, I'm leaving the one's complaint unmet while meeting five others. The user argues the initial complaint gets satisfied regardless of who I save, but... is that how complaints work in their framework? 

  *scratches head* Let me map this: In the one-vs-five life case:
  - If I save the one, five complaints unmet
  - If I save five, one complaint unmet
  Their solution: any rescue satisfies the "need to be saved" complaint generically. But that seems to redefine complaints as collective rather than personal. Does this clash with point 2's strict personalism?

  Point 7 seems safe - clarifying reasonable rejectability as normative avoids empirical pitfalls. No tension there. 

  The billion-discomfort case (point 5) still bothers me most. Even if each discomfort complaint is trivial, a billion trivial complaints shouldn't override a death complaint under strict anti-aggregation. Unless... is the user implying the billion *as a group* has a complaint? But point 2 forbids impersonal sums. 

  *checks notes* Ah! I recall Scanlon sometimes allows "representative complaints" - perhaps that's their angle? But they'd need to state it explicitly. Without that, point 5 seems flatly inconsistent with point 3.

  For the save-five case (point 6), their satisfaction argument might hold if complaints are about principles ("no one saves me when others are at risk") rather than outcomes. But does that reframe complaints too abstractly? Might dilute the personalism in point 2.

  Overall, tension severity ranking:
  1. Point 3 vs Point 5 (critical)
  2. Point 3 vs Point 6 (moderate)
  3. Point 2 vs Point 6 (minor, if complaints become too abstract)

  Fixes? For point 5, they could introduce a "representative group complaint" concept - but costs violating point 2. For point 6, they might need to accept some weak aggregation - but undermines point 3. Alternatively, double down on complaint satisfaction logic, but that might not scale to non-lethal cases.

  User seems sophisticated - they'll want precise revision costs. Better flag that fixing one hole might spring another. Also, explicitly note where apparent conflicts aren't real (e.g. point 4 is unproblematic).
answer: |-
  Here's a consistency audit of your metaethical package, ranked by severity of tension and outlining revision costs and potential ripple effects:

  **Ranked Tensions:**

  1.  **Severe Tension: Point 3 (Strict Anti-Aggregation) vs. Point 5 (Billion Discomfort Case)**
      *   **Conflict:** Point 3 explicitly forbids summing weaker complaints. In Point 5, each individual in the billion has only a weak complaint (an hour of mild discomfort) against a principle requiring them to endure it to save one life. Individually, none of these complaints seems remotely strong enough to reasonably outweigh the single person's catastrophic complaint against dying. Point 5 asserts that the *right act* is to spare the billion, implying their collective complaints *do* override the single death. This seems impossible without aggregation.
      *   **Why it's Severe:** This appears to be a direct contradiction. Point 3 rules out the mechanism seemingly required to justify Point 5. The sheer scale of the billion seems crucial, but Point 3 explicitly blocks using scale as a justification.
      *   **Possible Fixes & Costs:**
          *   **Revise Point 3 (Moderate Anti-Aggregation):** Allow aggregation *only* when complaints are *very* weak and the number *very* large ("clumping"). *Cost:* Significantly weakens the core anti-aggregation commitment, making it seem arbitrary. Where is the threshold? Why not for smaller numbers? Undermines the principled exclusion of aggregation. Reopens the door to aggregation arguments elsewhere, potentially threatening distinctions Point 4 relies on.
          *   **Revise Point 5:** Concede that saving the one life is required. *Cost:* Highly counterintuitive result, abandoning a key motivation for many to reject strict aggregation. Weakens the overall appeal of the view.
          *   **Revise Point 2/Complaint Structure (High Cost):** Argue that the billion *as a group* has a distinct, strong complaint based on fairness, imposition, or symbolic disrespect that isn't just the sum of individual discomforts. *Cost:* Violates Point 2's stricture against impersonal sums or group-level values. Fundamentally alters the nature of "personal reasons" by making them relational or systemic in a way that might seem impersonal. Requires significant theoretical restructuring.
          *   **Revise Complaint Weighting:** Argue that while each discomfort complaint is weak *in isolation*, the *reasonableness of rejecting* a principle that imposes this burden *on anyone* when the alternative is *letting someone die* is very low. The single person *can* reasonably reject dying, but the billion *cannot* reasonably reject a principle requiring minor discomfort to save a life. The "weighing" happens at the principle level, not by summing complaints. *Cost:* This subtly shifts the locus of the weighing away from Point 3's "complaints weighed one-to-one". It risks making "reasonable rejectability" do all the work independently of the complaint-weighing mechanism described in Point 3, potentially rendering Point 3 redundant or misleading. Needs careful articulation to avoid collapsing into aggregation.

  2.  **Significant Tension: Point 6 (Required to Save Five) vs. Point 3 (Strict Anti-Aggregation) & Point 2 (Strict Personalism)**
      *   **Conflict:** Your justification for Point 6 ("the single complaint is satisfied by saving someone") is clever but problematic. It implies that *any* act of saving *a* life satisfies the generic complaint "if I'm in mortal peril, I should be saved". However, this seems to redefine the complaint impersonally. From the perspective of the *specific* individual left to die, their *personal* complaint ("*I* am being left to die when *I* could have been saved") remains strong and unmet. Point 3 demands we consider *this specific person's* complaint against the principle "save the greater number". How is this specific complaint outweighed by the five *other* specific complaints without aggregating them? Point 2 also raises a question: Is the "satisfied by saving someone" move an illicit appeal to an impersonal good (a life saved) rather than the personal reasons of the specific individuals?
      *   **Why it's Significant:** It challenges the core personalism (Point 2) and anti-aggregation (Point 3) in a foundational case (numbers in life-saving). The proposed solution might inadvertently smuggle in impersonalism or a form of aggregation.
      *   **Possible Fixes & Costs:**
          *   **Clarify Complaint Structure:** Articulate that the relevant complaint is against principles that *systematically* leave individuals unprotected *when others could be saved instead*. The person left to die *does* have a complaint, but it is not necessarily stronger than the complaint any *one* of the five would have against a principle that saved the one instead of the five. The principle "save the greater number" might be reasonably rejectable by the one, but the alternative principle ("save at random / don't prioritize numbers") is reasonably rejectable by *each* of the five, as it exposes each of them to a higher risk of being left to die unnecessarily. *Cost:* This moves closer to a "comparative" or "risk-based" weighting of complaints that, while not strictly summing intensities, might feel like a weaker form of aggregation or depend on a more complex account of ex ante complaints. Requires careful defence against the charge that it still doesn't directly address the *actual* complaint of the *actual* person left to die *in this instance*.
          *   **Accept Weak Aggregation (High Cost):** Concede that saving five lives *does* aggregate the complaints. *Cost:* Directly violates Point 3 and significantly weakens the anti-aggregation stance. Raises questions about why aggregation is forbidden in Point 4 (1 death vs. 5 discomforts) but allowed here.
          *   **Revise Point 6:** Argue we are only *permitted*, not *required*, to save the five. *Cost:* Abandons a standard deontological intuition and weakens the view's ability to handle numbers intuitively.

  3.  **Minor Tension / Potential Tension: Point 2 (Strict Personalism/No Impersonal Value) vs. the Structure of "Reasonable Rejectability" (Point 1 & 7)**
      *   **Conflict:** Point 2 categorically excludes appeals to impersonal value or sums of welfare. However, the standard of "reasonable rejectability" itself needs content. What makes a rejection "reasonable"? If "reasonable" is defined *solely* by reference to the personal reasons of the rejector (e.g., "Does this principle impose an unreasonable burden *on me*?"), it might struggle to generate sufficiently objective moral constraints. But if "reasonable" incorporates any notion of impartiality, fairness, or the relative strength of *others'* complaints, there's a risk that impersonal standards are being covertly reintroduced to define what counts as a "personal reason" worthy of consideration in rejection.
      *   **Why it's Minor/Potential:** This is a common challenge for contractualism. Your Point 7 shows awareness that rejections must be *reasonably* grounded, not just actual. A sophisticated contractualist can argue that the *content* of reasonable rejection is filled *only* by considering the justifiability of principles *to others* based on *their* personal reasons, not by importing impersonal values. However, the line is fine. Does judging the *relative weight* of different individuals' personal complaints (as implied in Points 4, 5, 6) require an impersonal standpoint? Your solution to Point 6 ("satisfied by saving someone") arguably flirts with this line.
      *   **Possible Fixes & Costs:**
          *   **Clarify/Embrace:** Explicitly argue that assessing "reasonable rejectability" involves comparing the personal burdens imposed on different individuals by competing principles, *only* using the personal reasons each has, and that this comparison itself is an interpersonal justificatory exercise, not an appeal to impersonal value. *Cost:* Requires robust metaethics to defend the objectivity of this process without impersonalism. Needs to convincingly handle cases like Point 5 without illicit aggregation.
          *   **Revise Point 2 (High Cost):** Allow some minimal impersonal element (e.g., basic needs counting as reasons for everyone) into the definition of admissible personal reasons or reasonableness. *Cost:* Directly violates the strict threshold exclusion in Point 2 and opens the door to further impersonalist incursions.

  **Apparent but Resolvable Tensions:**

  *   **Point 4 (Save One from Death over Five Discomforts):** This aligns perfectly with Points 1, 2, and 3. The single death complaint is vastly stronger than any individual discomfort complaint. Weighing them one-to-one, the death complaint clearly wins. No aggregation is needed or implied. This is a strength of the package, not a tension.
  *   **Point 7 (Reasonable vs. Actual Rejection):** This is a crucial clarification for contractualism, resolving a common misunderstanding. It doesn't conflict with any other point; it strengthens the normative nature of Point 1. Cost: None.

  **Summary of Exposure:**

  *   **Primary Vulnerability:** Justifying the Billion Discomfort Case (Point 5) under Strict Anti-Aggregation (Point 3). This is the most acute point of potential inconsistency. Any fix risks weakening core commitments (Point 3 or Point 2) or seeming ad hoc.
  *   **Secondary Vulnerability:** Justifying the Requirement to Save the Five (Point 6) without covert aggregation or impersonalism. Your specific "satisfaction" justification needs careful defence against charges that it ignores the specific complaint of the one left behind or relies on an impersonal view of "a life saved".
  *   **Systemic Challenge:** Maintaining pure personalism (Point 2) in defining both the *content* of complaints and the *standard* of "reasonable rejectability" without implicitly relying on impersonal comparisons or values. This underpins the other tensions.

  **Recommendation before Circulation:** Focus your preemptive defence on Points 5 and 6. Clearly articulate *how* Point 5 works without violating Point 3 (e.g., via a sophisticated principle-level rejection argument or a carefully circumscribed notion of group complaint). Refine the justification for Point 6 to explicitly address the *specific* complaint of the one left behind and ensure it doesn't rely on an impersonal "life saved" metric. Emphasize how "reasonable rejectability" operates solely on personal reasons throughout. Acknowledge these as the key pressure points where your specific formulation needs the most scrutiny.
