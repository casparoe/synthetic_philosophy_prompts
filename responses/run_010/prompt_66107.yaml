answer: |-
  Here’s a reconstruction of the implicit theory behind random-lottery payment, distinguishing core commitments from practical accommodations, and a proposal for a diachronic-coherence-centered alternative:

  ### Core Philosophical Presuppositions
  1. **Synchronic Separability of Preferences**  
     The design *strictly presupposes* that an agent’s "true" preference in any choice problem is **invariant under isolation from temporal context**. It treats each decision as a self-contained revelation of stable, context-independent preferences. Wealth effects, hedging, or sequence-dependent behaviors are framed as *confounds* rather than legitimate objects of study.

  2. **Preference as Atomic Choice Disposition**  
     Preferences are reduced to **dispositions to choose in isolated moments**. The procedure assumes that coherence *across* choices is irrelevant to the validity of *individual* choices. A pumpable agent’s choices under this design are interpreted as "true" (non-pumped) preferences—implicitly denying that diachronic exploitability invalidates synchronic preferences.

  3. **Bracketing as Methodological Primitive**  
     Narrow bracketing isn’t presupposed as a *psychological fact* but as a **normative requirement for measurement**. The design *requires* that subjects bracket narrowly *for the experiment’s purpose*, regardless of their natural bracketing tendencies. This creates tension with behavioral findings where narrow bracketing is deemed irrational.

  ### What It Merely Accommodates (Practical Justifications)
  - **Stake Size**: Paying all 40 trials might necessitate tiny stakes to fit budgets, inviting flat indifference curves.  
  - **Fatigue/Attention**: Single large payments might distort late-trial choices due to exhaustion.  
  - **Hedging Control**: Prevents subjects from gaming interdependent problems.  
  - *Not a commitment to atomism*: These don’t *require* synchronic separability—they’d hold even if preferences were inherently diachronic.

  ### Resolving the Tension: The Implicit Theory
  The design **presupposes that bracketing is *irrelevant* to the *content* of preferences** (i.e., what the agent *really* values) but *relevant* to their *clean revelation*. It assumes:  
  > *"Agents have stable, context-independent preferences over outcomes; any deviation under broad bracketing (wealth effects, hedging) is noise corrupting their 'true' preferences."*  
  Thus, narrow bracketing isn’t a bias *in the agent*—it’s imposed *by the experimenter* to filter out "distortions." When literature critiques narrow bracketing as irrational (e.g., in Rabin’s critique), it targets the *agent’s* psychology, not the experimenter’s method. This bifurcation lets the same field uphold both stances.

  ### Why This Clashes with Diachronic Rationality
  The procedure **cannot detect diachronic coherence failures** by design:  
  - It erases the *temporal portfolio* (wealth changes across trials).  
  - It ignores how *choices interact* (e.g., hedging violates Savage’s Sure-Thing Principle).  
  - A dynamically inconsistent agent appears coherent because choices are never *executed* in sequence.  
  It measures **preference snapshots**, not **temporal agency**. What your seminar cares about—planning, commitment, pumpability—is actively suppressed.

  ### Designing for Diachronic Coherence
  An experiment measuring diachronic rationality would:  
  1. **Pay all trials sequentially**, with real wealth accumulation.  
  2. **Vary choice sequences** to test for:  
     - Dynamic inconsistency (e.g., present-biased preferences reversing earlier plans).  
     - Hedging/money-pump vulnerabilities.  
  3. **Incorporate self-binding mechanisms**: Allow precommitments in early trials affecting later options.  
  4. **Track coherence metrics**: e.g., % of subjects violating dominance across linked choices, exploitability costs.  
  *Example*: Subjects allocate budgets across 10 periods; each period offers new gambles *and* opportunities to revise prior allocations. Payments compound real-time.

  ### Most Confident Claim & Falsifiability
  **Strongest claim**: The design *strictly presupposes synchronic separability*—preferences exist wholly within choice-contexts.  

  **What would change my mind**:  
  - **Evidence that practitioners explicitly reject separability** but use random payment for *only* practical reasons (e.g., budgets). Yet methodological writings (e.g., Starmer 1999) treat isolation as epistemically necessary.  
  - **Robust findings that random payment *creates* separability**: If subjects who broadly bracket in single-choice settings switch to narrow bracketing *only* under random payment, it suggests the method *induces* the psychology it claims to measure. Harrison et al. (2020) hint at this.  
  - **Proof that separativity is a technical footnote**: If experimental philosophers universally endorsed a diachronic alternative absent budget constraints, I’d retreat. But they don’t—even when stakes allow single-trial payments, sequential designs remain rare.  

  **Likeliest flaw in my reading**: Overestimating philosophical commitment. The field may treat random payment as a "good enough" heuristic for estimating static preferences, ignoring its metaphysical baggage. But when results (e.g., risk aversion parameters) are generalized to *real-world agents*, the synchronic assumption silently tags along—making it de facto philosophy.

  ### Key References Anchoring This View
  - **Harrison & Rutström (2008)**: Defend random payment as controlling "portfolio effects," implicitly privileging isolated choices.  
  - **Cubitt et al. (1998)**: Show random payment can *mask* dynamic inconsistency.  
  - **Starmer (1999)**: Treats context-independence as axiomatic for preference elicitation.  

  The random-lottery design isn’t philosophically neutral: It enshrines a Humean, atomistic agent whose preferences don’t *truly* evolve—they’re merely revealed piecemeal. To study diachronic rationality, we need experiments where time isn’t an experimental confound but the very stage of agency.
