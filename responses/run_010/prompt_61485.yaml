prompt: |-
  ok, I've been going back and fourth with a friend for about a month on bet sizing and I think I've got the framework sorted, but he keeps insisting I'm confused in a way he can't articulate, and I'd rather hear it from a stranger who has no reason to take his side. Not looking for references or further reading, I want the actual reasoning.

  The setup. My friend D runs a little provably-fair dice side project — server seed committed by hash, you can verify the whole sequence after the fact, so there is genuinely zero ambiguity about the odds. Once a week he'll take the other side of a coin flip prop with me: I stake some amount, heads he pays me 5 for every 4 I risked, tails I lose the stake. Fair coin, payoff structure known exactly, so the usual "bet less than Kelly because you don't really know your edge" move has no purchase here. He caps me at $2k a week, I've got $20k ring-fenced in that account, and I'm between jobs so I'm also pulling $800 a month out of the same pot for rent. He stops the game entirely if the account drops below $2k, his stated reason being that he doesn't want to be the guy who ate my rent money. Full Kelly here is 10% of bankroll, which at $20k lands exactly on his cap, and the growth rate works out to a bit over half a percent a week, call it 35-40% a year. Ridiculous but that's the arithmetic. I read Fortune's Formula on a flight years ago and I've read enough of the ergodicity-economics argument to be suspicious of expected utility as a foundation, since it averages over an ensemble of parallel copies of me that never actually happen, and the only sequence that happens is the one I live through.

  Here's what I want checked, because its load-bearing for a bunch of other things I believe. My picture is that the Kelly fraction is not a preference at all — it's the growth-rate-optimal strategy for repeated multiplicative betting, which is a mathematical fact, and any other fixed fraction loses to it almost surely if you wait long enough. Preferences only enter as a discount dial: you take some fraction of full Kelly to make the ride smoother, at the cost of a bit of long-run growth. So what I've been trying to do is convert my own risk aversion into that discount. I did one of those certainty-equivalent calibration exercises on myself and landed somewhere around CRRA gamma of 2, and my guess is that this should come out to something like half Kelly, with the fraction being a monotone decreasing function of gamma times the full-Kelly amount. D says this whole way of carving it up is broken, that I'm double-counting something, and that the withdrawals and the $2k floor aren't side conditions I patch on afterwards but things that change what the question even is. I don't buy the second part at all: if the strategy is growth-rate optimal and eventually beats everything else with probability 1, then a floor and a rent withdrawal just mean I might get there slower, and in the limit it washes out. Unless the floor means I don't get to play anymore, which — ok, I'll grant that it does mean that, he literally terminates the arrangement. But that just seems like an argument for betting a smaller fraction of the same objective, not a different objective.

  So, concretely: what fraction of the account should I be staking each week? And is the move from "the growth-rate-optimal fraction" to "the fraction I should actually use" a discount I apply because of my utility function, a discount I apply because of the floor and the rent, both, or is my whole framing wrong in some way I'm not seeing? If I'm wrong, I'd like to know precisely where the objectivity I thought I had is sneaking preferences back in, because right now I can't tell whether gamma=2 is doing any work at all or whether I just made up a number and dressed it up. Also happy to be told the cap changes things once I'm up, since 10% of a bigger bankroll is more than $2k and I assume I can't bet more than he'll take.

  Please answer in plain continuous prose — no headings, no bullet points, no bold, no tables, no numbered lists of caveats. Just write it the way you'd write an email to someone, and if you need to show arithmetic, put it inline in the sentence rather than in a display block.
