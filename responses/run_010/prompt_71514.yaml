answer: |-
  ### (a) Examination Question  
  **Question 2 (of 2): Answer ONE question only. Time allocation: 3 hours.**  
  *Word limit: 1,500 words.*  

  Bernard Williams argues that an agent has a normative reason to act only if they could arrive at that action through sound deliberation starting from their existing motivations (their "motivational set"). Sound deliberation corrects factual errors, assesses implications, and imaginatively explores possibilities.  

  Consider **Dr. Aris Thorne**, a research scientist employed by NeuroCorp. For five years, Aris has worked 14-hour days under a corporate-mandated "Productivity Protocol." This protocol:  
  - Limits her information intake to NeuroCorp-approved sources, excluding independent journals;  
  - Enforces chronic sleep deprivation (4 hours/night) via monitored compliance;  
  - Uses algorithmic prompts to dismiss alternative career paths (e.g., academia, public health) as "impractical" or "unfulfilling" whenever they cross her mind.  

  Aris has developed a motivational set shaped by these conditions: she desires only to optimize NeuroCorp’s projects, values corporate loyalty above all, and feels visceral discomfort when considering quitting. She sincerely reports: "I don’t *want* to leave. My work is fine. Even if I reflected for weeks, I’d reject academia." Yet, if the Protocol’s effects were reversed (full rest, unrestricted information, no algorithmic nudges), Aris would deeply desire to pursue virology in academia.  

  **Does Aris have a normative reason to pursue academic virology?**  
  **What is Williams’ internalism committed to saying about this case?**  

  In your answer, address:  
  (i) Whether sound deliberation may revise elements of Aris’ motivational set given their origin;  
  (ii) How Williams’ view can (or cannot) distinguish "distorted" motivations from "well-formed" ones;  
  (iii) Whether any reason identified genuinely stems *from Aris’ motivations* or from the *facts explaining her condition*.  

  *Do not rehearse general internalism/externalism debates. Engage solely with the dilemma posed by this case for Williams’ framework.*  

  ---

  ### (b) Model Answer (≈900 words)  
  Williams’ internalism faces a critical test in Aris’s case. I argue that while internalism *can* attribute a reason to her, it does so only by stretching "sound deliberation" beyond plausible limits, conceding key ground to externalism. Aris has a reason to pursue academia, but internalism preserves this verdict at the cost of its own coherence.  

  **The Revision Dilemma**  
  Williams permits deliberation to correct false beliefs and supply missing information. Aris lacks critical facts about academic careers (e.g., funding flexibility, intellectual autonomy) and holds false beliefs (e.g., "all academia is unfulfilling"). Correcting these likely makes academia *instrumentally* attractive given her core desire for scientific impact. However, her aversion to academia isn’t merely informational; it’s a *conative disposition* ingrained by exhaustion and algorithmic conditioning. To reach the conclusion "I should quit," deliberation must *revise this disposition itself*. If deliberation can erase motivations formed under distortion, it risks making internalism vacuous: any agent could "reason" to any action by hypothetically altering their psychology. But if deliberation cannot revise such elements, internalism implausibly denies Aris a reason despite her counterfactual interest. Williams needs a middle path but provides no principled criteria.  

  **The Normativity of "Distortion"**  
  Labeling Aris’s motivations "distorted" smuggles in external norms. Her motivational set coheres internally: she consistently dismisses alternatives, feels satisfied, and her desires align with her narrowed values. To privilege her *hypothetical* post-recovery desires over her *actual* ones, we must appeal to a normative standard *external* to her current standpoint—e.g., well-being, autonomy, or objective flourishing. Williams insists deliberation must start *from the agent’s perspective*, yet dismissing her sincere motivations as "distorted" requires judging them against an independent ideal. Internalism lacks resources to make this distinction without circularity: we call motivations "distorted" precisely when we think the agent *should* revise them, but "should" implies a prior reason external to her set.  

  **Direction of Generation**  
  Suppose sound deliberation revises Aris’s aversion by imagining her well-rested and informed, leading her to desire academia. The reason appears generated *from her corrected motivations*. But this is illusory. The force of the reason derives from the *objective conditions* explaining her recovery (sleep, information freedom). Her *actual* motivations—exhaustion, corporate loyalty—do not ground the reason; they are obstacles to be overcome. The reason arises because external facts *would cause* her to have new motivations, not because her existing motivations support it. This concedes the externalist claim that reasons stem from objective facts about agents’ circumstances and capacities, merely *routing* them through a hypothetical deliberative process. Internalism survives lexically but not substantively.  

  **Blamelessness vs. Criticism**  
  Internalism can deny Aris has a reason while still criticizing NeuroCorp’s exploitation. Williams separates reason-claims from blame: Aris may be blameless for lacking a reason (due to distortion) while others are blameworthy for causing that distortion. However, this weakens internalism’s critical edge. We routinely say agents like Aris "have reason" to escape oppressive conditions *even if* their distorted mindset hides it. Denying this impoverishes normative discourse. Conversely, if internalism attributes a reason to Aris, it must explain why she remains blameless for not seeing it. Deliberative accessibility cannot require omniscience, but if "soundness" excuses ignorance caused by others’ manipulation, the link between reasons and blame frays.  

  **Conclusion: A Misframed Debate?**  
  Aris’s case shows the internalism/externalism dispute pivots on *which description of the agent’s motivations is authoritative*. Internalists take motivations as given; externalists assess motivations against normative benchmarks. Williams’ "sound deliberation" tries to mediate but fails because "soundness" cannot be defined neutrally. The substantive clash is whether practical reasons must be *agent-relative* (grounded in the agent’s actual or recoverable perspective) or *agent-neutral* (grounded in facts about what benefits the agent). This reframing retains significance: it forces metaethics to clarify if normativity requires psychological traction. For Aris, internalism can deliver the "right" verdict only by covertly adopting the externalist’s benchmark—revealing its dependency on the very stance it opposes.  

  ---

  ### (c) Marking Scheme (Total: 30 marks)**  
  **Must-hit points:**  
  1. **Dilemma of revision scope** (6 marks)  
     - *Point:* Identifies tension: over-permissive deliberation collapses internalism; under-permissive blocks criticism of distortion.  
     - *Mistake:* Treats case as simple false belief; ignores dispositional aversion.  
  2. **"Distortion" as normative** (6 marks)  
     - *Point:* Explains that labeling motivations "distorted" requires external norms, risking circularity.  
     - *Mistake:* Uses "distorted" descriptively (e.g., "caused by exhaustion") without normative justification.  
  3. **Direction of generation** (6 marks)  
     - *Point:* Argues that permissive deliberation grounds reasons in *causes* of new motivations, not actual set.  
     - *Mistake:* Assumes hypothetical desires alone satisfy internalism without addressing source.  
  4. **Blamelessness ≠ no criticism** (6 marks)  
     - *Point:* Separates Aris’s (possible) blamelessness from external criticism of NeuroCorp.  
     - *Mistake:* Confuses "Aris has no reason" with "Aris cannot be criticized."  
  5. **Reframing the debate** (6 marks)  
     - *Point:* Suggests the core dispute concerns authority of motivational descriptions/agent-relativity.  
     - *Mistake:* Merely lists problems without offering meta-level re-interpretation.  

  ---

  ### (d) First-Class Distinguishers**  
  A first-class answer (≥24) does not merely list dilemmas but *diagnoses their root*. It:  
  - Traces the revision problem to Williams’ *unresolved tension* between phenomenological respect for agency and critical normative judgment.  
  - Explicitly notes that "soundness" in deliberation *presupposes* a contested normative ideal (e.g., autonomy, flourishing) disguised as procedural.  
  - Argues that the "direction of generation" issue reveals internalism’s *conceptual instability* when motivations are pathologized.  
  Competent answers (18–23) accurately dissect all five points but treat them as discrete puzzles rather than symptoms of a unified failure.  

  ---

  ### (e) Penalized Arguments**  
  1. **"Correcting false beliefs suffices"** (-4 marks)  
     - *Why:* Ignores that Aris’s aversion is conative/affective, not just cognitive. Assumes deliberation only adds facts.  
  2. **"Internalism says no reason = no blame"** (-5 marks)  
     - *Why:* Equates Williams’ reason-claim with exculpation, neglecting his separation of blame and reasons.  
  3. **"Her deeper desire for flourishing grounds the reason"** (-6 marks)  
     - *Why:* Invents non-existent motivations. Aris’s "deep self" is stipulated as aligned with NeuroCorp; this smuggles in externalism.  

  ---  
  *End of Response*
