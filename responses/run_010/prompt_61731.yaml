prompt: |-
  I've spent fifteen years writing distributed consensus code — Raft and Paxos variants, gossip protocols, quorum logic, Byzantine fault tolerance, partial synchrony, split-brain recovery. Never taken an econ course, but I've read enough of the herding literature to follow it: Banerjee's simple herd model, the Bikhchandani–Hirshleifer–Welch cascade, and the Smith–Sørensen result that with bounded private signals a whole population can lock onto the wrong action forever while unbounded signals rule that out.

  Restate that body of results in the vocabulary I actually work in — message passing, honest vs faulty nodes, safety and liveness, convergence, partitions, the difference between a protocol that terminated and one that merely went quiet — as faithfuly as you can. Then give me the residue report: which claims map cleanly, which you had to bend to fit, and which have no counterpart at all on my side.

  My own guess is that a cascade is just consensus where nobody proved the agreement was correct — an undetected split-brain that every node voted for. Tell me straight whether that's right, or whether something gets lost coming from my direction. And if it does get lost, commit to a verdict: is that a gap in the systems vocabulary, or a sign the herding people are arguing about less than it looks like? Don't lay out the options and leave me to pick.
reasoning: |-
  Okay, let me tackle this fascinating request. The user is a distributed systems expert with 15 years of experience in consensus protocols, asking for an economic herding theory translation into their technical vocabulary. They've clearly done their homework on both sides and want precision, not hand-waving. 

  First, I need to map core herding concepts:
  - Private signals become node-local observations (like sensor readings)
  - Actions translate to protocol states or decisions
  - Cascades resemble consensus without verification
  - Bounded/unprivate signals map to limited/unlimited evidence storage

  The user's guess about cascades being undetected split-brain is sharp but incomplete. It's more like a liveness failure where nodes stop gathering new data. I should highlight that difference clearly.

  For the residue report, I'll need to identify:
  Clean mappings: cascade termination = protocol going quiet, bounded signals = limited storage
  Bent concepts: "wrong action forever" isn't quite Byzantine failure since nodes aren't faulty
  Missing counterparts: No direct equivalent of information cascades in consensus - those require explicit "I believe you believe" chains

  The vocabulary gap is real. Economic models assume nodes don't communicate beliefs, only actions. That's why cascades can persist - no equivalent of read-repair or anti-entropy. The user's instinct about "arguing about less" has merit; herding models ignore verification mechanisms we'd consider essential.

  Must commit clearly: Yes, it's a systems vocabulary gap, but also the models intentionally avoid verification to study pure information effects. Will state this upfront in the response.
answer: |-
  Here's the translation you requested, followed by a residue report and a committed verdict on your cascade-as-undetected-split-brain hypothesis:

  **Core Translation (Herding Concepts → Distributed Systems Vocabulary):**

  1.  **Private Signal:** A node's local, independent observation *before* any communication (e.g., sensor reading, local computation result). Analogous to a node's initial value in consensus, but *only it sees it initially*.
  2.  **Action:** The binary decision a node publicly commits to (e.g., "Adopt Technology A" -> `state = A`; "Adopt Technology B" -> `state = B`).
  3.  **Observation of Others' Actions:** Seeing the public `state` variables of *some* other nodes in the system (via message passing or shared logs). This is the *only* communication channel.
  4.  **Information Cascade:** A state where a node ignores its own private signal and instead copies the public `state` it observes from others *regardless of the strength or content of its own signal*. The protocol effectively stops gathering new private data. (Think: A node receives `[A, A, A]` from 3 peers, sees its own signal `B`, sets `state = A` anyway, and broadcasts `A`).
  5.  **Banerjee/BHW Simple Cascade Model:**
      *   **Nodes:** Arrive sequentially (like in a leader-based protocol, but no leader election).
      *   **Communication:** Each new node sees the `state` of *all* previous nodes (a perfect, ordered log).
      *   **Decision:** Node compares the count of `A` vs. `B` states it observes. If one count exceeds the other by >=2, it ignores its private signal and sets `state` to the majority. Else, it follows its private signal.
      *   **Cascade Start:** Once the observed state difference reaches +2, *all subsequent nodes ignore their private signals* and just copy the majority state. **The protocol has "gone quiet" (terminated decision-making) but *not* terminated execution (nodes keep arriving and copying).**
  6.  **Smith-Sørensen Result:**
      *   **Bounded Private Signals:** Private signals have finite possible strengths (e.g., "weak A", "strong A", "weak B", "strong B" - but only finitely many levels). **Mapping:** Nodes have limited local storage/processing for evidence (e.g., only a few bits to represent signal strength).
      *   **Result:** The system can **converge forever to the globally wrong `state`** (e.g., `A` is correct, but everyone locked onto `B`). **Liveness (converging to a decision) is achieved, but Safety (converging to the *correct* decision) is violated.** This lock is permanent; no future node can break it because they ignore their private signals.
      *   **Unbounded Private Signals:** Private signal strength can be arbitrarily strong (e.g., real number representing log-likelihood ratio). **Mapping:** Nodes have theoretically unbounded capacity to store/process evidence strength (e.g., using arbitrary precision floats).
      *   **Result:** The probability of converging forever to the wrong `state` is **zero**. Eventually, a node will get such an overwhelmingly strong private signal for the correct state that it breaks any existing cascade, even if it observes a large majority for the wrong state. **Safety is eventually achieved (w.p.1).**
  7.  **"Locking onto the wrong action forever":** A **permanent partition in the global state**, but crucially, *it's a partition every node voluntarily joins* based on observed messages. There are no faulty nodes (Byzantine or Crash); all nodes follow the protocol correctly. It's a **systemic liveness-to-safety failure** induced purely by the communication pattern and limited local evidence storage.

  **Residue Report:**

  1.  **Clean Mappings:**
      *   Private Signal = Local Observation (Initial Value-ish)
      *   Action = Public Committed State
      *   Observing Others' Actions = Reading Public State Variables
      *   Cascade Starting = Protocol "Going Quiet" on New Evidence Gathering (Decision Rule Fixed)
      *   Bounded Signals = Finite Local Evidence Storage/Precision
      *   Unbounded Signals = Unbounded Local Evidence Storage/Precision (Theoretical)
      *   Locking to Wrong State = Permanent Incorrect Consensus (Safety Failure)
      *   Cascade Breaking with Unbounded Signals = Eventual Convergence to Correct State (Safety w.p.1)

  2.  **Bent to Fit:**
      *   **Sequential Arrival:** Real distributed systems are concurrent. The sequential model simplifies analysis but maps to the *logical order* of state observations/comparisons in many protocols (e.g., views in Paxos, terms in Raft). The key point is nodes see a *history*.
      *   **Seeing ALL Previous Actions:** This is rarely true (partial synchrony, partitions, latency). The mapping assumes a "perfect log" abstraction available to new nodes. It captures the *information available*, not the mechanism.
      *   **Ignoring Private Signal:** This is a *decision rule* hardcoded in the model. In system terms, it's like a node permanently suppressing its own sensor input after seeing N messages. This feels unnatural from a systems perspective where nodes usually keep validating, but it's core to the cascade definition.
      *   **"Wrong Action" Definition:** In systems, "correctness" is often protocol-defined (e.g., "decide the value proposed by the leader"). Here, "correctness" is an *external* ground truth (which state matches reality). The mapping assumes this external truth exists and is detectable via private signals.

  3.  **No Direct Counterpart:**
      *   **Explicit Faulty Nodes (Byzantine/Crash):** Herding models typically assume *all nodes are honest and follow the protocol*. Failures emerge from the *system structure* (limited comms, limited local evidence), not malicious or crashing nodes. Byzantine faults are a different failure axis.
      *   **Quorums & Explicit Agreement Rounds:** Herding nodes don't run rounds of voting to explicitly *agree*. Agreement emerges implicitly through sequential copying. There's no concept of a "quorum size" threshold for decision, only the cascade threshold (+2 in the simple model).
      *   **Leader Election:** No equivalent concept. Order is exogenous.
      *   **Persistence Guarantees:** The "log" of previous actions is assumed perfectly persistent and available. Real systems fight for this.
      *   **Explicit Termination Detection:** The cascade "starts" (nodes stop using private signals), but the system doesn't terminate; nodes keep arriving and copying. This is distinct from a protocol formally terminating.

  **Verdict on Your Hypothesis:**

  **You're partially right, but something significant gets lost.**

  *   **Right:** A cascade *is* like an undetected split-brain where *every node ends up voting for the wrong value* ("voting" here meaning publicly committing their `state`). It's a permanent, incorrect consensus state achieved without faulty nodes.
  *   **What Gets Lost:** **The mechanism of *why* it stays undetected.** In a split-brain scenario, the *partition itself* prevents communication that could resolve the conflict. In a herding cascade:
      *   **There is no partition.** Communication is perfect (they see all previous states).
      *   **Nodes actively choose to ignore contradictory evidence.** They have the *means* to detect the error (their private signal) and the *communication channel* to potentially correct it, but the *protocol rules* (based solely on counting public actions) tell them to ignore their own evidence once the cascade starts. It's a **liveness failure in evidence gathering/processing**, not a communication failure.

  **Committed Verdict:**

  **This is primarily a gap in the systems vocabulary.** The herding models rigorously capture a critical failure mode that standard distributed systems models often overlook or abstract away:

  1.  **Rational Ignorance:** The models formalize scenarios where nodes, acting rationally based *only* on observed public actions and limited private signals, *optimally choose to stop gathering or acting on new, contradictory private evidence*. Systems protocols usually assume nodes *always* value and act on new valid evidence (e.g., via challenge-response, read-repair, state machine replication with input commands).
  2.  **Emergent Permanence of Error:** They show how *correct* behavior by *all* nodes, under specific communication and information constraints, can lead the *entire system* to permanently converge on a globally incorrect state with no faulty actors. This is distinct from the *temporary* incorrect states caused by partitions or faults that protocols like Paxos/Raft are designed to *recover* from. The herding error is *stable* under the model's rules.
  3.  **Cost of Information:** The bounded/unbounded signal distinction highlights the critical role of *the richness of local information* in achieving *correct* convergence, not just *any* convergence. Systems often focus on achieving *agreement* (Safety) and *progress* (Liveness) under faults, assuming the inputs (proposals/commands) are "correct" by some external mechanism. Herding models question what happens if the *initial local inputs* (private signals) are the *only* source of truth and are noisy/limited.

  **Conclusion:** Your intuition about the outcome (wrong consensus) is correct. The gap is in rigorously modeling the *rational, protocol-compliant abandonment of contradictory local evidence* based solely on public information patterns, leading to an *irreversible* error. This "voting to ignore your own sensors" behavior isn't a typical fault model in distributed consensus. The herding literature *is* arguing about something real and distinct: **the systemic risk of evidence suppression under limited information and sequential observation.** It complements, rather than subsumes, traditional fault-tolerant consensus models.
