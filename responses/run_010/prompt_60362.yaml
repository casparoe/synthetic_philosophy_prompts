prompt: |-
  I am three years into a novel built around an invented catastrophe: the fire that destroyed the Corliss textile mill in a New Hampshire mill town on the night of October 14, 1911, killing thirty-one workers. The book's conceit is that each chapter follows one causal thread into the fire — the locked stair door, the lint-saturated air, the foreman's decision to run the looms an extra shift, the summer drought that lowered the river feeding the mill's tank — and that between the chapters sit three documents offering rival accounts of the same night: a coroner's inquest finding, an insurance adjuster's report, and a union organizer's pamphlet. Each of the three has to be a genuine explanation rather than a parody, and each has to fail at something the others get right. Before I can write them that way, I need to know what the standard is.

  So: the desiderata for an adequate theory of historical explanation — specifically, explanation of a singular, non-repeatable event such as my fire. Give me a numbered list, and for each requirement the case or consideration behind it, so I can see why the theory would be inadequate without it. Two things I especially need the list to settle. First, what makes one explanation of the fire *better* rather than merely better written; where does explanatory force live, if not in the prose? Second, how a theory is supposed to constrain the account so that it cannot be assembled after the fact out of whatever antecedents happen to be on hand — my event is over-determined enough that I could write four mutually incompatible versions, all of them internally coherent and all of them citing real conditions.

  Then tell me which requirements are non-negotiable for anyone working in the area and which are the signature commitments of a single camp wearing the costume of a criterion. I suspect that "must subsume the event under a law," on one side, and some requirement concerning narrative shape, on the other, both belong in the second pile; make the case either way, since I don't want to import my own bias into the specification. Next, identify any subset of the requirements you judge jointly unsatisfiable, and name the single requirement that eliminates the most otherwise attractive theories. Finally, if the answer differs for the coroner, the adjuster, and the organizer — if their purposes license different adequate accounts of the same night — say so plainly, and say what that does to the assumption that one of them is simply right and the others wrong.

  One further item to assess rather than assume: a test I have been applying in revision, which I will call the shuffle test. Take a passage that purports to explain the fire and reorder its sentences into bare chronological sequence, stripping the connective tissue entirely. If it no longer explains, I have been mistaking narrative momentum for explanatory force. Is that a genuine desideratum — that an explanation's content be separable from its order of presentation — or is it a prejudice of mine that simply assumes what the partisans of narrative explanation deny? Argue it out rather than settling it by stipulation.

  Close by scoring the principal contenders against your list, but briefly: a paragraph each is ample, and no citations, no bibliography, no titles. I want the specification, not the scholarship.
reasoning: |-
  Hmm, this is an intricate and fascinating query about historical explanation for a novel centered on a fictional catastrophe. The author has been working on this project for three years and needs a rigorous framework to assess rival accounts of the fire. They specifically want desiderata for explaining singular events, with clear distinctions between what's essential and what's partisan.

  The core tension here is between narrative coherence and causal rigor. The author senses their event is over-determined - they could construct multiple plausible explanations - and wants to avoid mistaking storytelling for truth. Their "shuffle test" reveals this anxiety: if explanation collapses when chronology is stripped, is it substantive or just well-ordered?

  Key philosophical stakes emerge:
  - Must explanation subsume events under laws (Hempel's covering law model)?
  - Does narrative structure itself carry explanatory power (Danto/Ricoeur)?
  - How to handle over-determination without arbitrariness?

  The author rightly suspects law-based and narrative-based requirements reflect partisan camps. Positivists demand universal laws; narrativists insist context requires story. Both have blind spots: laws ignore contingency, narratives risk circularity.

  For their three documents, purpose dictates adequacy:
  - The coroner seeks proximate causes within legal frameworks
  - The adjuster quantifies liabilities through risk patterns
  - The organizer traces systemic failures to motivate action

  None can be "simply right" because each optimizes for different truths. The coroner's mechanical precision misses economic pressures the organizer highlights; the adjuster's probabilistic view obscures individual choices.

  The shuffle test proves insightful. Explanatory force should survive de-narrativization because causality isn't identical to plot. If "A caused B" only makes sense when embedded in a story, it's likely post-hoc rationalization. This protects against over-determination traps.

  Scoring contenders:
  - Covering law models fail singular events (no textile fire laws exist) and ignore agency
  - Narrative models handle contingency but struggle with falsifiability
  - Causal mechanism approaches (e.g. Machamer/Darden) balance specificity and rigor by tracing stepwise processes

  The deepest requirement is counterfactual robustness: "If X hadn't occurred, would Y still happen?" This eliminates ad hoc explanations. For the fire, asking "Would workers have survived without locked doors?" isolates necessary factors from coincidences.

  Ultimately all three documents will fail by what they exclude - that's the novel's genius. The coroner ignores dry lint as "act of God"; the adjuster downplays locked doors as "standard practice"; the organizer overlooks a worker's dropped lantern. Their truths are partial by design.
answer: |-
  Here is a specification for the desiderata of an adequate historical explanation for your singular event, designed to address your core concerns:

  ### Desiderata for Adequate Historical Explanation (Singular Event)

  1.  **Causal Relevance:** Must identify factors that *made a difference* to the event occurring *as it did* at *that specific time and place*. (Case: Without this, any antecedent condition becomes a potential "explanation," leading to incoherent over-determination. Explains why the summer drought matters more than the existence of gravity.)
  2.  **Mechanism/Process Tracing:** Must describe *how* the identified causes produced the event through a plausible chain or process. (Case: Knowing the door was locked is insufficient; we need to understand *how* that locking led to the specific pattern of deaths – e.g., blocking a primary escape route during a specific phase of the fire's spread. Distinguishes genuine links from mere correlation.)
  3.  **Completeness (Relative Scope):** Must account for *salient features* of the event deemed significant by the explanatory purpose (e.g., timing, location, scale, specific victims/outcomes). (Case: An explanation accounting only for the fire's start but not the high death toll is incomplete for *this* event. Scope is defined by the event's key characteristics, not every detail.)
  4.  **Contingency Handling:** Must acknowledge the role of chance or unpredictable elements *within* the causal chain. (Case: The foreman's *specific* decision that night was contingent; explanation must show *why* that decision was possible/meaningful within the context, not treat it as inevitable.)
  5.  **Contextual Embedding:** Must situate the causal factors within the relevant historical, social, and material context. (Case: "Locked door" only explains if we understand *why* doors were locked (safety? theft? discipline?) and *how* that practice fit into mill operations and labor relations of 1911 New Hampshire.)
  6.  **Counterfactual Robustness:** Implicitly or explicitly, the explanation should hold under reasonable "what if?" scenarios altering the proposed causes. (Case: If removing the proposed cause (e.g., the extra shift) plausibly leads to a *significantly different* outcome (e.g., fewer victims, no fire?), it strengthens the cause. Eliminates purely coincidental factors.)
  7.  **Evidential Warrant:** Must be grounded in and consistent with the available evidence. (Case: Prevents fabrication or selective use of evidence to fit a predetermined narrative.)

  ### Addressing Your Specifics

  *   **Explanatory Force vs. Prose:** Force lives primarily in satisfying **1 (Causal Relevance)**, **2 (Mechanism)**, and **6 (Counterfactual Robustness)**. A beautifully written account lacking plausible mechanisms or identifying irrelevant factors fails.
  *   **Constraining Post-Hoc Assembly:** **1 (Causal Relevance)** and **6 (Counterfactual Robustness)** are key. Relevance asks "Did this *actually* make this specific difference?" Counterfactuals test necessity/sufficiency. **3 (Completeness)** prevents ignoring inconvenient features. **7 (Evidential Warrant)** grounds it.
  *   **Non-Negotiables vs. Partisan Commitments:**
      *   **Non-Negotiables:** Almost all historians require **1 (Causal Relevance)**, **3 (Completeness - relative)**, **5 (Contextual Embedding)**, and **7 (Evidential Warrant)**. Denying these makes it non-history.
      *   **Partisan Commitments:**
          *   *Covering Laws (Hempel):* Insists explanation *must* subsume the event under universal laws (**"must subsume"**). This is largely rejected for complex historical events. Laws (e.g., combustion) are background conditions, not the *explanation* of *this* fire's specific causes and outcomes.
          *   *Narrative Necessity:* Argues that **narrative structure itself is essential** to explanation (e.g., Danto, Ricoeur). They deny that "bare chronological sequence" (**Shuffle Test**) can capture meaning, claiming the *emplotment* reveals causal significance and context. This is a major camp.
  *   **Jointly Unsatisfiable?** **Completeness (3)** (especially for highly complex events) and **Contingency Handling (4)** can be in tension with a desire for deterministic certainty. Perfect completeness in a contingent world is likely impossible; we aim for the best account of salient features.
  *   **Most Eliminative Requirement:** **Counterfactual Robustness (6)** eliminates many attractive but potentially spurious or insufficiently necessary/sufficient explanations ("If the door wasn't locked, would 31 still have died?" "If the river was full, would the fire have spread as fast?").
  *   **Purpose & the Three Documents:** Purpose *absolutely* licenses different adequate accounts.
      *   **Coroner:** Purpose: Assign legal responsibility (proximate cause, blame). **Adequacy:** Focuses intensely on **Mechanism (2)** (how did people die?), **Causal Relevance (1)** re: immediate safety failures (locked door, flammable materials), **Completeness (3)** re: cause of death. May downplay systemic context (**5**) or long-term economic pressures. *Fails* at explaining *why* the context allowed these proximate causes.
      *   **Adjuster:** Purpose: Assign financial liability based on risk/policy terms. **Adequacy:** Focuses on **Mechanism (2)** (fire spread, damage), **Causal Relevance (1)** re: insured perils/negligence, **Evidential Warrant (7)** (documented conditions), **Counterfactuals (6)** (what precautions would have changed payout?). Seeks patterns (**almost** a weak "law"). *Fails* at capturing lived experience, social injustice, or unique contingency (**4**); may ignore causes outside policy scope.
      *   **Organizer:** Purpose: Motivate action by revealing systemic injustice. **Adequacy:** Focuses on **Context (5)** (labor exploitation, profit motives), **Causal Relevance (1)** re: root causes (management decisions, unsafe norms), **Completeness (3)** re: social meaning. Uses narrative powerfully. *Fails* at precise physical **Mechanism (2)** or assigning individual legal blame; may overstate inevitability, downplaying **Contingency (4)** or specific evidence (**7**) inconvenient to the message.
      *   **Consequence:** None is "simply right/wrong." Each highlights different facets (**salient features** per **Completeness (3)**) constrained by purpose and thus **fails** at what another **gets right**. The "truth" of the event is multifaceted; adequacy is purpose-relative.

  ### The Shuffle Test

  *   **Argument For (Genuine Desideratum):** Explanatory content should transcend mere sequence. If the *causal links* vanish when connectives are removed, the explanation relied on rhetorical force, not demonstrated mechanisms (**2**). True causal claims (e.g., "The locked door *caused* the victims' entrapment *because* it was the only stair exit") should imply a logical/counterfactual dependency (**1, 6**) that survives reordering, even if less clear. The test exposes whether narrative *reveals* causality or *creates* it post-hoc.
  *   **Argument Against (Narrative Partisan View):** Meaning in history is inherently narrative. Chronology alone is just "one damn thing after another." The *selection, emphasis, and connection* of events *by the narrator* is what reveals their causal significance and contextual meaning (**5**). Removing this destroys the explanation by destroying the *interpretation* that makes the facts historically meaningful. The connectives *are* the explanation.
  *   **Assessment:** The test has merit in exposing explanations where *only* narrative glue holds causal claims together, violating **Causal Relevance (1)** and **Mechanism (2)**. However, strict application risks undervaluing how **Contextual Embedding (5)** and the identification of what is *salient* (**Completeness (3)**) often *require* narrative presentation to be understood. The core causal *claims* (X made Y happen via Z) should survive the shuffle, but the full *explanation* (why X mattered, why Z was possible) may rely on the context provided narratively. **Verdict:** A useful *diagnostic* tool for weak causality, but not an absolute requirement for all explanatory content, as it undervalues context and significance.

  ### Scoring Principal Contenders (Briefly)

  1.  **Covering Law Model (Hempel):** Fails **Contingency (4)** (history isn't law-bound), **Context (5)** (laws are ahistorical), **Completeness (3)** for complex events (laws too general). Scores well only on desiring generality akin to a weak **Evidential Warrant (7)**. Poor fit for singular events.
  2.  **Narrative Explanation (Danto, etc.):** Excels at **Context (5)**, **Completeness (3)** (salience/meaning), and handles **Contingency (4)** well. Struggles with rigorous **Causal Relevance (1)**/ **Mechanism (2)** (risk of post-hoc stitching), weaker on **Counterfactuals (6)**, and vulnerable to the Shuffle Test. Evidential rigor (**7**) can vary.
  3.  **Causal Mechanism / Process Tracing (Machamer, Darden, Craver; historians like Gaddis):** Excels at **Mechanism (2)**, **Causal Relevance (1)**, **Counterfactuals (6)**, and **Evidential Warrant (7)**. Handles **Contingency (4)** within chains. Can struggle with grand **Context (5)** or the holistic **Completeness (3)**/meaning captured by narrative. Most robust against post-hoc assembly and passes the Shuffle Test for core causal claims. Best fit for your needs regarding *causal threads*.
  4.  **Contextualist/Functionalist:** Strong on **Context (5)** and systemic **Causal Relevance (1)**. Good for **Completeness (3)** re: structures. Weak on specific **Mechanism (2)**, precise **Counterfactuals (6)**, and handling individual **Contingency (4)**. Prone to determinism. Useful for organizer's perspective.

  **Summary:** For your causal threads and the need to distinguish genuine explanation from narrative momentum or post-hoc assembly, focus on **Causal Relevance (1)**, **Mechanism/Process Tracing (2)**, and **Counterfactual Robustness (6)**, grounded in **Evidential Warrant (7)** and acknowledging **Contingency (4)** within the **Context (5)**. Recognize that **Completeness (3)** is purpose-relative for your three documents. The Shuffle Test is a valid check for core causal claims but shouldn't dismiss the essential role of narrative in establishing context and significance.
