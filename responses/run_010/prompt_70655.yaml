answer: |-
  Here is a decision procedure grounded in historical source criticism principles, designed for efficiency (approx. 30 min/file) and clarity for non-historians. It separates evidence assessment from mandate questions and explicitly flags judgment points.

  **Truth Commission Case File Assessment Procedure**

  **I. Source Inventory & Provenance Check (5 mins)**
  1.  **List all sources:** Identify each distinct piece of evidence (witness testimony, doc, report, memoir, press article).
  2.  **Establish Provenance (Origin & Path):** For *each* source, ask:
      *   *Who created it?* (Author, creator, witness)
      *   *When was it created?* (Relative to events: contemporaneous, soon after, long after)
      *   *Why was it created?* (Purpose: administrative, propaganda, personal record, advocacy, legal, journalistic)
      *   *How did it reach us?* (Chain of custody: original document, copy, interview transcript, archived report, published work)
      *   *Sufficient Answer:* Basic identification (e.g., "Witness A, interviewed 2020, former detainee", "Ministry Log, dated [date], original from National Archives", "Exile Newspaper X, article dated 1986, copy from NGO archive"). **If provenance *cannot* be determined at all for a source, note "Provenance Unknown" and treat its reliability as very low; it cannot independently corroborate but *may* support bias assessment of others or context.**

  **II. Individual Source Reliability & Bias Assessment (10 mins)**
  3.  **Assess Internal Reliability (for each source):**
      *   Consistency: Are statements within the source consistent?
      *   Plausibility: Do the claims fit known facts about the period, location, actors?
      *   Detail & Specificity: Are names, dates, places, actions specific?
      *   *Sufficient Answer:* Note strengths/weaknesses (e.g., "Detailed on locations/victims, vague on dates", "Implausible claim about weapon availability", "Internal consistency high").
  4.  **Assess Potential Bias/Motivation (for each source):**
      *   Consider creator's role (victim, perpetrator, bystander, official, activist, journalist), purpose, and context.
      *   *Sufficient Answer:* Identify *potential* bias direction (e.g., "Likely biased towards minimizing regime actions (perpetrator log)", "Likely biased towards emphasizing harm (victim testimony)", "Potential advocacy bias (NGO report)", "Administrative neutrality likely (log)").
      *   **Judgment Call Dressed as Procedure:** Determining the *degree* of bias influence is inherently judgmental. Flag as "Potential Bias: [Type]". Bias *reduces reliability* but *does not automatically negate* the source; it requires stronger corroboration.

  **III. Corroboration & Independence Assessment (10 mins)**
  5.  **Define the Core Claim(s):** Precisely state the specific fact(s) needing corroboration (e.g., "Killing of X at Y Bridge on approx. Z date", "Transfer of prisoners from A to B on C date").
  6.  **Map Sources to Core Claim(s):** Which sources directly support *each specific* core claim?
  7.  **Apply the "Pathway Independence" Test:** For **two sources supporting the *same core claim***, ask:
      *   Did Source A's information *flow into* Source B's creation? (e.g., Did B read A? Interview the same witness as A? Rely on the same document A used? Was B present *because* of A's account?)
      *   Did A and B derive their information from a *single, common source* without which neither would have known the detail? (e.g., Both heard the same rumor; Both read the same now-lost report; Both were told by the same intermediary).
      *   **Sufficient Answer for Independence:** Sources are **independent enough to corroborate** *for a specific core claim* **ONLY IF**:
          *   They represent *distinct information pathways* back to the event. AND
          *   There is *no evidence* that one pathway *depended* on the other *for the core claim*, or that they *both depended on a single intermediary source* for the core claim.
      *   **Handling Partial Overlap:**
          *   **Identify the overlapping element:** Is it the *core claim* itself, or peripheral details (names, exact timing, minor actions)?
          *   **Core Claim Overlap:** If the *pathways converge* *before* the core claim (e.g., both witnesses heard about the killing from the *same* third person who saw it), they are **NOT independent** for that claim. Their agreement proves only that the *third person* told the same story, not that the event happened.
          *   **Peripheral Detail Overlap:** If pathways are independent *for the core claim* but share provenance for details (e.g., two witnesses independently saw the killing at the bridge but later lived together and may have aligned their memories on the *exact time* or *number of shots*), the **core claim can be corroborated** based on independence, but the *specific overlapping details* require caution/flagging. Downgrade reliance on those specific details.
      *   **Handling "Provenance Unknown":** A source with unknown provenance **cannot** be used as one of the two corroborating sources. It can only contribute to context or support bias assessments.

  **IV. Overall Classification & Mandate Questions (5 mins)**
  8.  **Apply Classification Rules:**
      *   **Established:** At least **two sources with distinct, independent pathways** (per Step 7) support the core claim, AND these sources are assessed as having **reasonable reliability** (Step 3 - no major internal inconsistencies/implausibilities), AND potential biases (Step 4) do not *collectively* undermine the core claim.
      *   **Probably Occurred:** (Choose ONE reason)
          *   *Reason 1 (Independence Issue):* Only **one source** exists supporting the core claim with reasonable reliability, *OR* multiple sources exist but **lack pathway independence** (per Step 7). OR
          *   *Reason 2 (Reliability/Bias Issue):* Two (or more) sources with *apparent pathway independence* support the core claim, but **significant reliability concerns** (major inconsistencies/implausibilities in one or more) **or strong, congruent biases** (e.g., both sources strongly motivated to fabricate or distort *in the same direction*) cast substantial doubt.
      *   **Not Established:** No source supports the core claim, OR the sole source has very low reliability/unknown provenance, OR sources are present but riddled with fatal inconsistencies/implausibilities/congruent bias making the claim untenable.
  9.  **Mandate Decisions (Non-Evidential):**
      *   **Naming Perpetrators:** Perpetrators may **only** be named in the public report if the fact of *their specific involvement* in the event is labelled **Established**. If the *event* is Established but *perpetrator identity* is only Probably Occurred or Not Established, use "unidentified soldiers/officials" or similar. **This is a mandate rule based on fairness and potential legal risk.**
      *   **Publication of Uncorroborated Details:** Details within an "Established" or "Probably Occurred" event that rely solely on non-independent or low-reliability sources should be flagged as such in the narrative (e.g., "Witnesses differed on..." or "According to a single source...").

  **V. Documentation:** Briefly note key reasoning for provenance, reliability/bias, independence assessment (especially pathway analysis), and classification choice in the file.

  ---

  **Application to Test Cases:**

  *   **Case (a): Killing at the Bridge**
      *   **Sources:** Witness A, B, C (Testimony via NGO intv), Newspaper report.
      *   **Provenance:** Witnesses: Detainees together, exile community together, interviewed together by NGO (1990s). Newspaper: Contemporaneous, regional paper, reports "security ops".
      *   **Reliability:** Witnesses: High detail/matching on core event? Plausible? (Assume yes). Potential Bias: Victim perspective (emphasize harm). Newspaper: Low detail, vague. Bias: Likely censored/minimalist.
      *   **Core Claim:** Specific killing at bridge.
      *   **Independence (Pathways):** Critical flaw. Witnesses shared detention (possible shared info *then*), shared exile community (intense discussion), interviewed *together*. High risk of collusion, cross-contamination, or reliance on a single shared narrative developed post-event. **Pathways NOT independent.** Newspaper only reports general ops, not specific killing - doesn't support core claim.
      *   **Classification:** **Probably Occurred (Reason 1: Independence Issue).** One coherent account (the shared witness narrative), even from multiple individuals, but pathways not distinct. Newspaper provides contextual support only. *(Chair's desire irrelevant to evidence assessment).*
      *   **Mandate:** Perpetrators cannot be named unless specifically identified *and* their role established via independent sources (unlikely here).

  *   **Case (b): Prisoner Transfer**
      *   **Sources:** Memoir (Ex-conscript, 30 yrs later), Transport Log (Interior Ministry, contemporaneous).
      *   **Provenance:** Memoir: Personal account, long after, purpose = record/memorialize. Log: Administrative, contemporaneous, internal regime use.
      *   **Reliability:** Memoir: Potential memory/embellishment issues after 30yrs. Log: High reliability for administrative facts (dates, locations, numbers) - purpose was functional accuracy.
      *   **Bias:** Memoir: Potential bias (guilt? justification? emphasis on hardship?). Log: Bias towards administrative efficiency/neutrality *for factual record*; likely avoids negative details.
      *   **Core Claim:** Specific transfer of prisoners from Facility X to Facility Y on Date Z.
      *   **Independence (Pathways):** **Clear independence.** Memoir: Author's personal experience/memory. Log: Created contemporaneously for internal admin by regime officials. No evidence memoir author saw log or vice-versa. Pathways utterly distinct.
      *   **Corroboration:** Log corroborates *fact of transfer* (dates, locations, likely numbers) with high reliability. Memoir corroborates the *fact of transfer* and adds context (conditions, purpose?) but reliability lower for details beyond core transfer fact.
      *   **Classification:** **Established** for the *core fact of the specific transfer on that date*. Details in memoir about prisoner treatment etc. *not* corroborated by log and require separate assessment/flagging.
      *   **Mandate:** If memoir names guards/officials responsible for abuse *during* transfer, that *specific claim* needs its own corroboration for naming.

  *   **Case (c): Exile Newspaper Claim**
      *   **Sources:** Exile Newspaper (1986), Academic History 1 (cites Newspaper), Academic History 2 (cites Newspaper), Witness Statement (confirms reading Newspaper).
      *   **Provenance:** Newspaper: Exile source, advocacy/political purpose. Academics: Secondary sources, reliant on cited materials. Witness: Personal recollection of reading.
      *   **Reliability:** Newspaper: Requires high scrutiny - potential bias/rumor. Academics: Reliable *as scholarship* but only as good as sources. Witness: Recalls reading article, not event itself.
      *   **Bias:** Newspaper: High potential advocacy/opposition bias. Academics: Strive for neutrality but inherit source bias. Witness: Bias depends on role (victim? bystander?).
      *   **Core Claim:** The specific claim made in the 1986 newspaper article.
      *   **Independence (Pathways):** **Fatal dependence.** Academic History 1, Academic History 2, and the Witness **all derive their knowledge of the core claim solely from the Exile Newspaper article.** They represent **one** pathway: the publication and reception of that article. They are echoes, not independent corroboration.
      *   **Classification:** **Not Established** (if no other sources). The claim rests solely on the Exile Newspaper article. The other sources add nothing evidentiary to the *factuality* of the original claim, only to its *circulation*.
      *   **Mandate:** Claim cannot be presented as fact. May be noted as "reported in exile media and subsequently cited" with appropriate context/caveats.

  ---

  **What this Procedure Cannot Settle & Systematic Misleading:**

  1.  **Genuine Contradictions:** It provides a framework but not an algorithm for resolving cases where independent, reliable sources directly contradict each other. This requires deeper historical judgment beyond the 30-min scope.
  2.  **"Dark Figures" & Systemic Silencing:** Cases where repression was so total that no witnesses survived or dared to speak, and no documents escaped destruction, will inevitably be labelled "Not Established". This misrepresents reality – it reflects absence of evidence *not* evidence of absence. The procedure systematically under-represents the most extreme, effective repression.
  3.  **Nuance within "Probably Occurred":** This label pools very different situations: a single strong source; multiple non-independent sources; or two independent sources with significant reliability concerns. The public report narrative must clarify the *reason* for this label to avoid misinterpretation.
  4.  **Bias Magnitude:** It flags potential bias but cannot precisely quantify its distorting effect. Two sources flagged with "potential bias" might range from minimally to catastrophically distorted. This remains a critical judgment call.
  5.  **Contextual Understanding:** It focuses on discrete events/facts. It doesn't efficiently capture patterns, structures, or the broader context of repression that emerges from aggregating many "Probably Occurred" files.
  6.  **Authenticity of Documents:** It assumes surviving documents are authentic. Verifying document authenticity (e.g., against forgeries) requires specialized expertise beyond this procedure's scope.
  7.  **Ultimate "Truth":** It establishes facts to a legal/historical standard of proof ("established" vs. "probable"), not philosophical certainty. "Established" means highly reliable based on available evidence, not absolute truth.

  This procedure provides a structured, evidence-based approach focusing on *pathway independence* and separating reliability/bias from independence, offering a practical solution within the statute's constraints while grounding it in historical method. It explicitly flags its limitations regarding systemic silencing and the aggregation of "Probably Occurred" cases.
