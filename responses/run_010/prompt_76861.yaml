  Working through the first day of Galileo's Two New Sciences, the stretch where they get onto infinite quantities, and I'm stuck. Here's the argument as I've got it in my head — this is a paraphrase, not a quote, and I don't have the book in front of me, so please don't hand me back wording that looks like one: Salviati observes that the squares are only a small fraction of the numbers, and the further out you go the smaller the fraction gets, since between one big square and the next there are ever more non-squares; but then every number is the root of some square, there are as many squares as there are roots and as many roots as squares, so the squares are no fewer than all the numbers put together. His upshot is that equal, greater and less have no application to infinite quantities, only to finite ones, and I think Simplicio ends up calling the whole business a labyrinth that passes our comprehension.

  Can you walk me through what he's actually committed to? The two halves clearly pull against each other, but I can't tell which one he means to keep. When he bans equal/greater/less for infinite quantities, is he denying that the one-to-one correspondance between squares and all numbers shows them to be the same size — i.e. rejecting what now gets called Cantor's principle, that equinumerosity just is the existence of a bijection — or is he accepting the bijection and refusing to read any size comparison off it, or is he throwing out the comparative vocabulary altogether, part-whole included? My worry is the last one: the "squares get sparser as you go up" step looks like it compares an infinite proper part with the whole, which is exactly what he's supposed to be banning a few lines later. Does he notice that, and does resolving it make him a proto-Cantorian who flinched at the last step, or a finitist avant la lettre who thinks size talk just breaks down past the finite?

  Say how confident you are in each bit of the reconstruction and single out the point you're least sure about — I'd rather have the uncertainty marked than a smooth story.
