answer: |-
  ## Betting on Conditionals

  **Setting:** A cramped betting shop counter, ten minutes post-fourth race. The photo finish is still pending. A chalkboard reads: "NOVELTY: If the favourite won the 4th, the stewards missed the interference in the stretch. Evens."

  **Characters:**
  *   **Lewisian:** Believes both indicative and counterfactual conditionals have truth values based on possible worlds.
  *   **Adamsian:** Believes indicative conditionals aren't truth-apt; they express conditional commitments, like bets called off if antecedent false.

  **(Lewisian points to the board)**
  **Lewisian:** See? Perfectly factual bet. Either the favourite won *and* the stewards missed it, making it true, or he won and they didn't (false), or he lost and it’s... well, false? Wait, no, under my view, if he lost, it’s still false because the nearest worlds where he won... actually, it's messy *now*, but fundamentally, it *has* a truth value.

  **Adamsian:** Nonsense! It’s not about facts yet. You’re putting down money *conditional* on the win. If he lost, your stake’s returned – void. No fact stated, just a commitment: *given* he won, the stewards missed it. Asserting "If P, Q" is like saying my confidence in Q *given* P is high.

  **Lewisian:** Void? Then what’s the negation? "It is *not* the case that if the favourite won, the stewards missed it"? What does *that* mean? Or embedding: "Either if he won they missed it, or the track was too soft"? Does *that* whole disjunction become void if he lost? Your view makes logic crumble!

  **Adamsian:** Cheap trick! We assert conditionals based on *current* epistemic states. Negation targets the *reasonableness* of that supposition *now*. Embedding is pragmatic, not truth-functional. Your neat logic ignores the triviality results – you *can’t* consistently have truth conditions *and* have the probability of "If P, Q" equal the conditional probability P(Q|P). That’s mathematically proven! Your truth conditions sabotage the very probability relation that defines how we *use* indicatives!

  **Lewisian:** (Smirking) Fine, probability might link to conditional probability *for indicatives*, granted. But what about *counterfactuals*? Their probability clearly *isn't* the conditional probability! My view handles both cleanly. Worlds solve it. Yours handles indicatives messily and counterfactuals... how? Wait—

  **(A result flashes: Favourite lost by a nose.)**

  **Bookie:** (Slamming the counter) There! Favourite lost. Waste of time. Still, novelty bet stands! How about *this* one? (Scrawls on board) "If the favourite *had* won the fourth, the stewards *would have* missed the interference." Evens again! Place your bets!

  **Lewisian:** (To Adamsian) Ha! Your indicative bet is void, stake back. Fine. But *this* one? Antecedent’s false. Known false. No "given" state left to condition on. What’s your "assertability" now? How is *this* bet anything but nonsense on your view? It’s just a claim about other worlds – *my* territory. Put up or shut up!

  **Adamsian:** (Flustered) It’s... different! Counterfactuals *are* like exploring worlds! They express a kind of *causal* or *explanatory* connection under the supposition. The bet... well, it *is* coherent! We evaluate the connection *given* the (false) supposition. But it’s not asserting a *current* conditional fact about the world like the indicative tried to do. That indicative *can't* be asserted now because the supposition is known false – it served its purpose earlier, under uncertainty.

  **Lewisian:** So indicatives aren't factual, but counterfactuals magically are? Worlds explain counterfactuals cleanly. Your "assertability" for indicatives avoids triviality but makes logic messy. My truth conditions make logic clean but sabotage probability for indicatives. Worlds handle counterfactual probability fine. Stalemate.

  **Adamsian:** Stalemate. You sacrifice the core probabilistic meaning of indicatives on the altar of truth. I sacrifice Boolean logic on the altar of how we actually reason with uncertainty. Worlds might salvage counterfactuals for me... maybe. But your truth-conditions for indicatives are a *mistake*. That bet *never* stated a fact.

  **(They glare, coins untouched on the counter.)**

  **Closing Note:**

  The Adamsian is right about indicative conditionals. They don't state facts with truth values; they express conditional commitments or probability judgements relative to a supposition. The triviality results show Lewisian truth-conditions are incompatible with how probabilities of conditionals actually function (as conditional probabilities). The Lewisian's points about embedding highlight real complexities for the Adamsian, but they are challenges for pragmatics or non-truth-functional semantics, not fatal blows. For the counterfactual bet, however, the Lewisian's possible worlds framework provides the clearer account of its content and coherence. The bookie *should* lay that second bet; it makes a substantive (and possibly true/false) claim about how events *would* have unfolded differently. Indicatives are tools for reasoning under uncertainty; counterfactuals are tools for exploring alternative realities.
