prompt: |-
  I'm an RA on a moral psych project where we code vignettes about people's judgments as either a "preference" or a "bias," and our PI breaks the ties. Her calls so far:

  - juror who rates a defendant with a facial scar as less trustworthy → bias
  - someone who just wants the window seat → preference
  - landlord who won't rent to young men, says the damage stats back him up and he'd stand by it under questioning → bias
  - chef who can't stand cilantro → preference
  - teacher who grades essays in a formal register higher than ones in a student's home dialect and doesn't notice she does it → bias
  - hiker who won't go off-trail after a rattlesnake encounter, fully endorses the fear → preference
  - doctor who assumes an overweight patient's knee pain is weight-related before examining → bias
  - researcher who only wants collaborators she's already published with → preference

  Tomorrow's vignette: a triage nurse who says she's slower to believe patients who come in visibly drunk, because intoxication genuinely does make self-reports unreliable. She's aware of it, defends it, and does update when someone sobers up or collateral info comes in — but the net effect is that drunk patients wait longer for pain meds.

  What will she code it? I want the rules that fit all eight earlier calls equally well (I can see at least a group-plus-disadvantage one, and an individual-evidence-vs-category one, and maybe a support-by-a-reasonable-person one), what each predicts for the nurse, and your best guess with reasons. Then: if we're writing the coding manual ourselves, what should it say to stay consistent with our own precedents, which precedent is the closest analog, and what principle are we quietly adopting either way? Finish with the one new vignette that would best split the surviving rules apart.
