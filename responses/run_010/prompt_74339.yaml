  ## IN THE SUPREME JUDICIAL COURT OF THE COMMONWEALTH OF NEW PONDEROSA
  **No. NP-2023-0876**

  **DR. ELARA VANCE, Ph.D. (Cand.)**
  **v.**
  **PROFESSOR BRENDAN THORNE, Ph.D.**

  **ON APPEAL FROM THE SUPERIOR COURT OF MIDDLESEX COUNTY**

  **Before:** CHIEF JUSTICE STERLING, JUSTICES WESTFIELD, ARBUTHNOT, and FORSYTHE (dissenting).

  **Argued:** October 27, 2023
  **Decided:** November 15, 2023

  **STERLING, C.J.,** delivered the opinion of the Court, in which JUSTICES WESTFIELD and ARBUTHNOT joined. JUSTICE FORSYTHE dissented.

  **OPINION OF THE COURT**

  1.  This appeal arises from a lamentable, yet undeniably petty, academic contretemps culminating in the deliberate destruction of property. We are called upon not to adjudicate scholarly merit, but to apply the foundational principles of causation established by this Court, most notably the **Causal Exclusion Principle (CEP)**, articulated in *Metaphysical Guar. Co. v. Ephemeron*, 455 N.P. 112 (2017). The Superior Court (Judge Morrow presiding) granted summary judgment to the defendant, Professor Thorne. We affirm.

  2.  The undisputed material facts, viewed *in lumine CEP*, are stark. Plaintiff, Dr. Elara Vance, a doctoral candidate nearing completion, left her nearly finalized dissertation draft – a 300-page magnum opus on "Teleological Aspects of Late Antique Spoon Design" – unattended on a shared worktable in the Department Common Room. Defendant, Professor Brendan Thorne, entered the room shortly thereafter. Witnesses attest that Professor Thorne, upon observing the manuscript, exhibited visible signs of agitation: facial flushing, clenched fists, and audible muttering including phrases like "post-hoc hermeneutics!" and "methodological disaster!" He then seized Ms. Vance's travel mug, containing approximately eight ounces of lukewarm coffee, and deliberately poured its contents onto the unprotected pages of the dissertation draft, rendering it largely illegible sludge. Ms. Vance seeks damages for the cost of reprinting and the alleged "cognitive anguish" of reconstructing lost edits.

  3.  The plaintiff lost below because the trial court correctly applied the CEP. As *Ephemeron* holds, and we reaffirm: **A defendant is liable in tort only for events caused by something that is not itself fully caused by prior physical events. The law may not, consistent with the causal closure of the physical domain, treat a belief, desire, or intention as a cause whenever the body's movements already have a complete physical cause.** *Id.* at 128. The principle flows inexorably from the recognition that every bodily movement, including the complex motor sequences involved in grasping a mug and tilting it, is fully determined by prior physical states of the nervous system, musculature, and environment, governed by immutable physical laws. *Cf. Resta v. Tement*, 460 N.P. 45, 52 (2019) (citing Jaegwon Kim, *Mind in a Physical World*).

  4.  The defendant's motion for summary judgment established, via uncontroverted neurophysiological expert testimony, a complete causal chain for the coffee-pouring motion: specific neural firings in motor cortex regions C-3 and F-7, triggered by visual stimuli processing the manuscript and mug, leading predictably to the activation of the relevant flexor and extensor muscles in the defendant's arm and hand. This chain constitutes a *sufficient physical cause* for the harmful event – the saturation of the manuscript. See *N.P. Gen. Laws Ann.* ch. 231, § 85 (defining proximate cause).

  5.  Plaintiff argues, as she must, that Professor Thorne's **intention** to destroy the draft, fueled by his **belief** in its scholarly inadequacy and his **desire** to express contempt, constitutes an independent, legally cognizable cause. This argument founders upon the shoals of exclusion. Under the CEP, these mental states, however vividly described, **do no independent causal work**. They are either:
      *   (a) Identical to the physical neural state (a reductive view the CEP does not require us to adopt, see *Ephemeron* at 135, n.12), or more pertinently,
      *   (b) Non-identical, higher-level properties *supervening* upon that neural state. If (b), then they are causally inert with respect to the physical effect (the pouring), because the physical state alone is sufficient. To posit the mental state as an *additional* cause is to embrace **systematic overdetermination** – the thesis that every voluntary bodily movement has two distinct sufficient causes: one physical, one mental. *Ephemeron* soundly rejected this as "metaphysically profligate and explanatorily vacuous" (455 N.P. at 131). Our tort doctrine finds such promiscuous overdetermination as offensive as epiphenomenalism. A cause must pull its own weight; it cannot merely ride upon the coattails of sufficient physical antecedents.

  6.  Plaintiff attempts recourse to familiar tort doctrines governing concurrent causes or overdetermination, citing venerable precedents like *Summers v. Tice*, 33 Cal. 2d 80 (1948), or the hypothetical of two independently sufficient fires converging on a single barn. She argues that even if the neural state was sufficient, the mental state could be a concurrent substantial factor. This argument fundamentally *misapprehends the nature of the exclusion mandated by the CEP*. The "two fires" scenario involves **two distinct physical sequences** (Chain A: Lightning; Chain B: Arsonist's match), each independently capable of causing the harm. The CEP, however, addresses a scenario where there is **only one physical causal sequence** (the neural-muscular chain), and posits a *non-physical* or higher-level candidate cause (the intention) *supervening* upon it. The law has no doctrinal mechanism for treating a supervening mental state as a "concurrent" physical cause; they operate on categorically different planes. To allow it would be to grant the mental a kind of "causal dangler" status expressly forbidden by *Ephemeron*. The doctrines of *Summers* and the burning barn are inapposite; they govern multiple *physical* threats, not the relationship between a physical sequence and its supervening mental properties. Plaintiff's attempt to analogize fails *ab initio*.

  7.  We acknowledge the plaintiff's understandable distress. However, the law, as shaped by the CEP, requires more than a sequence of events where mental states are descriptively central. It requires a cause that escapes the web of physical determinism to bear legal responsibility. Professor Thorne's rage and his reasons, however lamentable, did not – indeed, *could not* – inject novel causal power into the world once the sufficient physical cause was in motion. They were, in the legally relevant sense, **inert**. Assigning liability based on them would violate the CEP and hold the defendant responsible for events caused solely by the impersonal machinery of his physical constitution reacting to stimuli.

  8.  The plaintiff’s argument regarding the trial court’s cursory treatment of the substantial factor test in its *Ephemeron* analysis was not properly preserved below and involves doctrinal nuances exceeding the scope of this appeal. Our affirmance rests squarely on the correct application of the CEP to the undisputed physical causal sufficiency shown by the defense.

  **DISPOSITION**

  The judgment of the Superior Court granting summary judgment to the defendant, Professor Brendan Thorne, is **AFFIRMED**. Costs on appeal are awarded to the defendant, pursuant to *N.P. Gen. Laws Ann.* ch. 211A, § 15.

  **So ordered.**

  ---

  **FORSYTHE, J., dissenting.**

  1.  While I concur with the majority’s exposition of the Causal Exclusion Principle (CEP) as articulated in *Ephemeron*, I dissent because its application here ignores the **proportionality** inherent in causal explanation at different levels of description, and consequently, the law’s own functional needs. The majority correctly identifies the sufficient physical cause. However, it errs in concluding this *necessitates* the exclusion of the mental *as a cause within the framework of tort law*.

  2.  The intention "to destroy the dissertation by pouring coffee" is not merely a dangler; it is a **determinable** realized *in* the specific **determinate** neural state. Just as "shattering the window" (a high-level description) is caused by "throwing the brick" (a mid-level description), which is itself realized in myriad specific muscle contractions and neural patterns, the mental state captures the *relevant causal structure* for the *type of harm* at issue – intentional property destruction. Cf. Yablo on proportionality. The specific neural pattern (C-3/F-7 activation) is causally sufficient, yes, but wildly disjunctive and unnecessarily detailed for answering the *legal* question: "Did the defendant *intentionally* destroy the property?" The mental description ("intent to destroy by pouring") is a *better fit*, a more proportional cause, for the effect ("manuscript ruined by liquid") than the precise neural state is. The law has always recognized causes at this folk-psychological level. *Ephemeron* did not abolish this; it demanded rigor in its application *vis-à-vis* physical sufficiency.

  3.  The majority fears systematic overdetermination. But this misunderstands the relationship. The mental cause (the intention) is not an *additional, independent* shove; it is *how the physical cause manifests* at the level relevant to agency and responsibility. The neural state isn't *causing* the intention; it's *constituting* it. To say the intention caused the pouring is to offer a higher-level, functionally salient description of what the neural state *did*. Denying causal efficacy to this level renders the concept of "acting on purpose" legally incoherent, reducing all action descriptions to mere epiphenomenal glosses – a consequence *Ephemeron* explicitly sought to avoid.

  4.  Furthermore, the majority too hastily dismisses the tort doctrine of concurrent causation. While not a perfect analogy, it illustrates the law’s pragmatic capacity to assign responsibility based on *contributory factors* operating at different levels of granularity. The neural state is the implementing mechanism; the intention is the structuring cause. Both are necessary under their respective descriptions for the *specific harmful event as legally categorized* – intentional damage. Ignoring the latter factor because the former is sufficient is a category error. The law needs causes that explain *why* the physical sequence occurred as it did – the reason-responsive level captured by intention. Without it, liability collapses into mere physical description, rendering concepts like purpose, foresight, and recklessness legally inert – a result surely not intended by *Ephemeron*.

  5.  However, embracing this proportional, higher-level causation does carry an implication the majority finds unpalatable: it grants the mental description genuine, irreducible causal *relevance* in structuring and explaining the physical outcome. It suggests the intention isn't just a passive shadow, but plays a constitutive role in... well. Perhaps the implications for responsibility under physical determinism deserve more careful consideration than a summary judgment affords. But to deny causation at the intentional level altogether, as the majority does, sacrifices the very concepts tort law relies upon to distinguish accident from purpose. I would reverse and remand for trial on whether the defendant’s intention was a substantial factor in causing the harm, understood proportionally.

  6.  Therefore, I respectfully dissent.
