    - **Double causation:** Maybe both the physical and the mental cause the action? But the game rules out double causation by the audit question: the content ledger must do work *not* accounted for by the mechanical ledger.
    - **Exclusion principle:** If the mechanical ledger is complete, then the content ledger cannot add anything. (This is what the game enforces.)
    - **Criterion of causal relevance:** The panel might have been using predictability or explanatory power as a proxy for causation. In round 4, the content ledger was predictive, but that doesn't make it causal.
    - **The reply that the mechanical cause is too fine-grained:** The mechanical ledger describes the movements at a very fine level (positions, contacts), while the content ledger describes intentions and goals. These are not rival causes because they are at different levels. The intention is realized by the physical movements, so it is not a separate cause. In the game, in round 3, the marker on the board and the card both determined the same action. The intention (based on the card) and the physical marker are not rivals; they are two aspects of the same causal process. The game mechanics in round 3 can be adjusted to give this reply traction: instead of having the marker be a physical cause, we could have the intention be the only thing that determines the move, but then we would need to change the setup. Alternatively, we can note that in round 3, the move was caused by the marker (physical) and the mover's response to it, and the intention was also present, but it is not an additional cause. The cost is that we lose the temptation to say that the content is indispensable.

