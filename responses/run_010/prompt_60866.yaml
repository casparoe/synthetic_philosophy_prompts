  - **For 30 students:** Have multiple games running in parallel. Divide into two groups of 15, then use the 16-student structure with one extra as an observer or assistant. Or have more roles: add a second mechanical recorder (to compare accounts), or have a larger audit panel (split into subpanels), or have multiple movers (but that complicates the causal story).

  **Frank Notes:**
  1. **Unavoidable Asymmetry:** The game favors the mechanical ledger because it is inspectable (unlike the real physical account of an action which is not fully known). We mitigate this by having gaps in the mechanical ledger due to access restrictions (round 2), but in reality, the physical account is complete. The game cannot reproduce the fact that in the real world, we don't have a complete physical ledger. We must supply by hand the idea that physicalism claims there is a complete physical account, even if we don't know it.
