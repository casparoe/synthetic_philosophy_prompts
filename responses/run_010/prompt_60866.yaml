  1. **The panel doesn't understand the audit question.** They might think they are judging whether the content ledger is useful or explanatory, not whether it did causal work. Handle by clarifying during the round: "Remember, you are deciding if the content ledger entry caused something that the mechanical ledger did not already cause."
  2. **A student names the exclusion problem mid-game.** Facilitator move: Say, "That's an interesting thought. For now, please focus on the task: decide if the content ledger did any causal work not in the mechanical ledger." Then move on.
