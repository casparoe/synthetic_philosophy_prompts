  **Debrief (25 minutes):**
  - Start by asking the audit panel: How did you decide in round 1? (They learned the rule: if the mechanical ledger fully accounts for the effect, then no extra causal work by content.)
  - Round 2: What made you consider saying YES? (Likely: the mechanical ledger had a gap that the content filled. But was that gap in causation or in information?)
  - Round 3: How was this different from round 2? (The mechanical ledger was complete without needing the mover's card because of the marker. The content was still there, but it wasn't necessary for the causal account. The cause was the marker, not the intention.)
  - Round 4: Did the predictive power of the content ledger make it seem causal? (Prediction is not causation.)

