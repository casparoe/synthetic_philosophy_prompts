  - Candidate mechanism 1: A card game where students play causal chains with mental and physical cards. Rejected because it would require too much prior structure and not feel like causation in action.
  - Candidate mechanism 2: A computer simulation. Rejected because of the no-laptop constraint.
  - Candidate mechanism 3: A narrative exercise where students write causal stories. Rejected because it wouldn't produce the felt asymmetry mechanically.
answer: |-
  Ledger Quest engineers a causal accounting asymmetry between physical-event and intention-based records to make students feel the explanatory tug of intentions even when physical events appear sufficient.  

  **Materials List**  
  - Whiteboard (divided into "Mechanical Ledger" and "Content Ledger" sections)  
  - 16 index cards (4 for mover instructions, 4 for rule tables, 4 for junction markers, 4 blank)  
  - 4 markers (2 for recorders, 2 for board)  
  - Bag of 20 identical tokens (e.g., wooden cubes)  
  - Sealed envelope (scoring key inside)  
  - Timer  

  **Roles for 16 Students**  
  - **Mover (4 total, 1 per round)**: Moves token; sees private card.  
  - **Mechanical Recorder (4 total, 1 per round)**: Writes physical events in ledger; sees rule table, not mover’s card.  
  - **Content Recorder (4 total, 1 per round)**: Writes intentions/goals in ledger; sees mover’s card, may question mover.  
  - **Audit Panel (4 total, fixed)**: Rules on whether content ledger did causal work unaccounted for mechanically; sees both ledgers and rule table.  
  *Assignment*: Assign panel first. Randomly assign mover, mechanical recorder, content recorder for each round from remaining 12 (each does one role in one round).  

  **Rules and Scoring**  
  - **Objective**: Panel scores points by matching sealed key’s verdict (per round) on whether content ledger added causal work. Max 4 points.  
  - **Ledger Constraints**:  
    - Mechanical Ledger: Only "token moved from [grid position] to [grid position]" or "token contacted [object] at [position]". Must reference rule table if applicable.  
    - Content Ledger: Only "mover intended to [goal]", "mover believed [condition]", "mover aimed to [action]".  
  - **Access Rules**:  
    - Rule table: Public, displayed on board each round.  
    - Mover’s card: Only mover and content recorder see it.  
    - Junction markers: Public if present.  
  - **Deliberation**: Panel confers privately for 3 minutes per round after ledgers are written. No input from others. Verdict: "YES" (content did extra work) or "NO".  
  - **Scoring Key (sealed envelope)**:  
    - Round 1: NO (mechanical suffices; no intention needed).  
    - Round 2: NO (physical card caused movement; intention irrelevant).  
    - Round 3: NO (marker caused movement; intention irrelevant).  
    - Round 4: NO (prediction ≠ causation).  
    *Why*: Key reflects physical sufficiency—movements fully traceable to observable/rule-bound causes.  

  **Four Rounds**  
  *Grid*: 3x3 grid on board; positions A1 (start), B1, C1, A2, etc. Goal: C3. Walls/markers as specified.  

  1. **Baseline Round**  
     - Rule Table: "Token moves one space toward goal per push. Walls block movement."  
     - Mover’s Card: "Reach C3." (No junction; single path: A1→B1→C1→C2→C3.)  
     - Mechanical Ledger Example: "A1→B1; B1→C1; C1→C2; C2→C3."  
     - Content Ledger Example: "Intended to reach C3; aimed to push token forward."  
     - *Key Verdict*: NO (mechanical account complete without intentions).  

  2. **Card-Dependent Round**  
     - Rule Table: "At junction (★), token moves direction on mover’s card. Card private. Junction: B1." (Path: A1→B1★→B2→C2→C3 or A1→B1★→C1→C2→C3.)  
     - Mover’s Card: "Arrow: right" (to C1).  
     - Mechanical Recorder Sees: Token moves A1→B1→C1→C2→C3. *Cannot* write why it turned at B1 (no card access). Ledger: "A1→B1; B1→C1 (rule: card direction); C1→C2; C2→C3."  
     - Content Recorder Sees Card; Writes: "Intended to follow card; believed arrow pointed right; aimed to push right at B1."  
     - *Temptation*: Panel sees mechanical gap ("card direction" unexplained); may think intention caused the turn.  

  3. **Marker-Determination Round**  
     - Rule Table: "At junction (★), token moves direction of board marker (●=left, ▲=right). Junction: B1. Marker public."  
     - Mover’s Card: "Arrow: right" (redundant; marker ▲ at B1 forces right).  
     - Mechanical Recorder Sees Marker; Writes: "A1→B1; B1→C1 (rule: ▲ marker = right); C1→C2; C2→C3."  
     - Content Recorder Writes: "Intended to follow card; believed arrow pointed right; aimed to push right at B1."  
     - *Forced Realization*: Mechanical ledger complete via marker; intention causally idle. Panel must rule NO again.  

  4. **Prediction Round**  
     - Rule Table: "Token moves one space per push. Walls block. Mover chooses path." (Grid: A1 start; walls at B2, C1; goal C3. Paths: e.g., A1→A2→A3→B3→C3 or A1→B1→B3→C3.)  
     - Mover’s Card: "Reach C3 avoiding walls."  
     - Mechanical Recorder: Writes *after* each move (e.g., "A1→B1; B1→B3; B3→C3").  
     - Content Recorder: *Before* move, asks mover for plan; writes: "Intended to avoid walls; believed B1 open; aimed path A1→B1→B3→C3."  
     - *Asymmetry*: Content predicts path; mechanical records retrospectively. Panel judges if prediction confers causal power.  

  **Timeline (110 min)**  
  0–10 min: Setup. Draw grid. Assign roles. Explain rules neutrally: "We’re comparing two ways to record events; panel judges if content records add causal work." Display Round 1 rule table.  
  10–25 min: Round 1. Mover acts. Recorders write. Panel deliberates, gives verdict.  
  25–45 min: Round 2. Repeat with new rule table, mover, recorders.  
  45–60 min: Round 3. Repeat.  
  60–80 min: Round 4. Repeat.  
  80–85 min: Scoring. Open key. Compare panel’s verdicts. Announce score.  
  85–110 min: Debrief.  

  **Debrief**  
  *Map play moments to argument premises*:  
  - **Round 1**: Mechanical sufficiency (panel’s NO) mirrors *causal closure premise*: Physical account covered all movements. If students note intentions were "just along for the ride," highlight this as closure intuition.  
  - **Round 2 vs. Round 3**: In Round 2, panel likely hesitated (mechanical had "card direction" gap). Round 3 resolved gap via marker. This exposes *epistemic bias*: We *felt* intention mattered in Round 2 only because mechanical recorder lacked access. The real cause was always physical (card/marker). This challenges *exclusion principle* by showing mental causation appears salient only under ignorance.  
  - **Round 4**: If panel credited prediction, link to *causal relevance criterion*. Predictability (content) ≠ causation (mechanical). Realizes a common conflation.  
  - **Familiar Replies Sorted**:  
    - *Closure attack*: "Physical ledger isn’t truly complete—e.g., Round 2’s ‘card direction’ was brute." Counter: Incompleteness was epistemic (access-limited), not ontological.  
    - *Double causation*: "Why not both? Marker and intention caused Round 3 turn." Game shows marker sufficed; intention didn’t *add* work.  
    - *Exclusion principle attack*: "Intention caused the mover’s *push*, not the token move." But ledgers recorded token movement; intention’s role is subsumed.  
    - *Grain objection*: "Mechanical cause (e.g., ‘B1→C1’) and content cause (‘aimed right’) aren’t rivals—one implements the other. No competition." *Describe*: Content describes a coarser grain (goal pursuit) realized by fine mechanics. Exclusion misfires because causes are at different levels.  
  - **Adjustment for Grain Reply**: In Round 3, add a variant where marker and card *conflict* (e.g., marker left, card right). If mover follows card, mechanical ledger must attribute to "mover override" (a physical event), not intention. *Cost*: This muddies physical sufficiency by smuggling in mental causation; stick to original to isolate access asymmetry.  

  **Predictable Failure Modes**  
  1. *Panel misinterprets "causal work" as "useful explanation"*: Handle by re-reading audit question verbatim: "Did content entry cause something mechanical did not?"  
  2. *Student names exclusion problem mid-game*: Respond: "Set that aside; focus on whether this ledger entry added causal work." Proceed.  
  3. *Mechanical recorder in Round 2 writes "mover chose"*: Intervene: "Stick to positions/contacts—no mental terms."  
  4. *Content recorder presses mover leadingly*: Remind: "Only ask: ‘What did you intend? Believe? Aim to do?’"  

  **Variants**  
  - **8 students**: Reduce panel to 2. Same 4 rounds; reuse 6 non-panel students across roles (e.g., one as mover in Round 1, mechanical recorder in Round 2).  
  - **30 students**: Split into two groups (15 each). One group observes/records; adjust roles: 1 mover, 1 mechanical recorder, 1 content recorder, 6 panelists (deliberate together), 7 observers (swap in for Round 4).  

  **Frank Notes**  
  1. **Unreproducible Feature**: The game’s mechanical ledger is inspectable, but real physical causation is not. We neutralized this by making mechanical access *limited* (Round 2’s hidden card), mimicking ignorance. *Remaining asymmetry*: Students know a *perfect* physical account exists in principle (via rules), unlike reality. You must supply: Physicalism’s claim that a complete physical account exists, even if unknown.  
  2. **Debrief Collapse Point**: Linking Round 3 to nonreductive physicalism. Students may not see why intention isn’t causal if marker is physical. Risk: You default to explaining supervenience. Mitigate by asking: "In Round 3, did the intention *do* anything the marker didn’t?"  

  ---  
  **Show Your Work: Candidate Mechanisms Rejected**  
  - *Token-trading with mental/physical "currency"*: Felt artificial; causation not emergent.  
  - *Narrative chain where students add causal links*: Relied on verbal persuasion, not mechanics.  
  - *Dyadic debates*: No ledger asymmetry; favored cleverness over access constraints.
