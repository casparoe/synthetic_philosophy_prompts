prompt: |-
  I sit on the eligibility panel of a regional hardship fund. Our charter directs us to compensate claimants for disadvantages that arose from circumstances they could not control, and to leave uncompensated those traceable to choices made under risks the claimant understood and accepted. Our published record now runs to eleven rulings. The seven that bear on the case before us are these.

  1. A professional skier whose career ended in an injury sustained on an off-piste descent she had elected to attempt in conditions officially rated severe: declined. The panel wrote that she had taken a deliberate and informed risk of precisely this kind of harm.

  2. A theatre nurse with a chronic respiratory condition acquired across nineteen years of shifts, every applicable protocol followed: approved. The panel held that exposure built into the structure of work one must hold is not a gamble.

  3. A man who at eighteen declined a stable apprenticeship to train as an instrument maker, aware the trade was contracting, and who now earns a fraction of his former classmates: approved. The panel wrote that the manner of the trade's collapse — a flood of imported instruments, followed by a two-year suspension of live performance — was not among the risks he could reasonably have priced.

  4. A long-term smoker with emphysema: the fund covered only that portion of care our medical assessor attributed to causes other than smoking, the panel holding that an award should track the share of the harm the claimant's own choices produced.

  5. A claimant who had deliberately cultivated, over two decades, a taste for a rare vintage such that ordinary wine no longer satisfies him, and who sought the cost differential: declined. The panel wrote that the fund meets needs and not acquired preferences.

  6. A claimant who chose firefighting knowing the documented risks of smoke inhalation and burns, and who later developed a rare autoimmune disorder with no established connection to either: approved, on the ground that the risks he accepted were specific and bounded.

  7. A man who lost his savings at fixed-odds betting and subsequently required dialysis: approved as to treatment, declined as to lost earnings. The panel noted that the fund will not make a claimant's body the instrument of a lesson in prudence.

  The new application is this. At thirty-six, the claimant elected an operative procedure to relieve a chronic pain condition she did not cause and had managed unsuccessfully for nine years. The disclosure she signed named, among other risks, a 1-in-400 chance of nerve damage causing partial loss of bladder control. That complication did not occur. What occurred was an adjacent condition — a fistula — which appeared in the disclosure only within a general category of other urological complications occurring in fewer than 1 in 1,000 cases, and not by name. She now requires a bespoke appliance and periodic revision surgery, and cannot resume the physical labour that was her trade. She claims both the lifetime cost of the appliance and revisions and her lost earnings capacity.

  Please provide the following.

  First, identify the closest analog among our precedents, and say on which dimension the similarity does the work — the electiveness of the procedure, the specificity of the disclosed risk, the fact that she was treating a harm she did not cause, or the split between her two heads of claim.

  Second, set out the candidate rules our record is jointly consistent with. I expect at least three, and I expect some will differ from one another not in kind but in where they draw the line; name that too. For each rule, state what it yields on the new application, and whether it yields the same verdict on both heads of claim.

  Third, recommend the ruling that best coheres with our own record, including whether the award should be split, and state plainly what principle we would be adopting by ruling that way and what we would be foreclosing for future claimants. If some of our precedents cannot bear the weight this recommendation places on them, say which and why.

  Fourth, describe one further hypothetical application — concrete enough to be filed — that would discriminate among the rules our current record leaves open, so that we can commit to the distinction in advance rather than rationalize it afterwards.

  I am not asking for the literature on any of this, and please do not supply references or attributions; work entirely from the record as stated above.
reasoning: |-
  Hmm, the user is presenting a complex ethical and legal reasoning challenge as part of a hardship fund eligibility panel. They've outlined seven precedent cases and a new claim involving surgical complications, asking for detailed analysis across four specific tasks.

  First, I need to identify the closest precedent. Case 6 (firefighter with autoimmune disorder) seems most analogous because both involve unexpected complications from accepted risks. The key similarity is the gap between specific disclosed risks and the actual harm that occurred. The claimant understood bladder damage risk but got a fistula instead - that distinction matters.

  For candidate rules, I'm considering three variations on risk acceptance boundaries:
  1) Compensation only for harms outside all disclosed risk categories (would deny this claim)
  2) Compensation for harms materially different in nature from disclosed risks (might partially approve)
  3) Compensation for harms in undisclosed subcategories of broad risks (would approve)

  The firefighter precedent suggests we distinguish between specific accepted risks and truly unforeseen consequences. Applying Rule 2 here, the appliance costs might be compensable since fistulas weren't specifically named, but lost earnings seem more debatable as they're consequential to the primary harm.

  Hypothetically, if someone developed tinnitus from an antibiotic that listed "hearing disorders" generally but not tinnitus specifically, that would test whether we require named risks or accept categorical disclosures. It forces clarification on how specific warnings need to be.

  The user clearly wants to avoid retrospective justification bias, so establishing clear distinctions upfront is crucial. They're also signaling concern about consistency in split awards through that dialysis case precedent. My recommendation needs to honor both the fund's purpose and the precedential weight - particularly not undermining the smoking case's causation principle.
answer: |-
  ### First: Closest Analog and Similarity Dimension  
  The closest analog is **Case 6 (firefighter with autoimmune disorder)**. The similarity lies in **the specificity of the disclosed risk**:  
  - Both claimants accepted specific, bounded risks (smoke inhalation/burns for the firefighter; nerve damage for the surgical claimant).  
  - Both suffered unrelated/unforeseen complications (autoimmune disorder unrelated to known risks; fistula not specifically named in disclosures).  
  - The panel compensated the firefighter because his harm fell *outside* the risks he accepted. Here, the fistula was not explicitly disclosed as a distinct risk but was buried in a broad category.  

  ### Second: Candidate Rules and Application to New Claim  
  Our precedents support three rules differing in **how narrowly "accepted risks" are defined**:  

  1. **Rule A: Compensate only harms *wholly outside* all disclosed risk categories.**  
     - *Source*: Case 6 (autoimmune disorder compensated as unrelated to smoke/burns).  
     - *New Claim*: **Deny both heads of claim**. The fistula fell under "other urological complications" (disclosed, albeit vaguely).  
     - *Verdict Split?* No – uniform denial.  

  2. **Rule B: Compensate harms *materially distinct in nature* from specifically named risks.**  
     - *Source*: Case 6 (autoimmune ≠ smoke/burns); Case 3 (trade collapse ≠ foreseeable market risks).  
     - *New Claim*: **Approve appliance/revisions cost; deny lost earnings**.  
       - *Appliance Cost*: Fistula is materially distinct from the named "nerve damage" risk (different cause, severity).  
       - *Lost Earnings*: Consequential to the uncompensated harm (like Case 7: dialysis covered, but not gambling losses).  
     - *Verdict Split?* Yes – partial award.  

  3. **Rule C: Compensate harms falling under *undisclosed subcategories* of broad risks.**  
     - *Source*: Case 2 (chronic exposure ≠ "gamble"); Case 3 (unforeseen trade collapse).  
     - *New Claim*: **Approve both heads of claim**.  
       - The fistula was not explicitly named (unlike "nerve damage"), making it functionally undisclosed.  
     - *Verdict Split?* No – uniform approval.  

  ### Third: Recommended Ruling and Principle  
  **Recommendation**: **Approve the appliance/revisions cost; deny lost earnings** (Rule B).  

  - **Principle Adopted**:  
    > *The fund compensates harms that are qualitatively distinct from the specific, bounded risks a claimant accepted, but not derivative economic consequences when the harm itself is uncompensated.*  

  - **Coherence with Precedents**:  
    - **Case 6** directly supports compensating unforeseen harms (autoimmune disorder ≠ accepted risks).  
    - **Case 7** supports splitting claims: dialysis (bodily harm) covered; lost earnings (economic consequence) denied.  
    - **Case 4** reinforces tracking causation (smoking-related harm excluded). Here, the named nerve damage did not occur; the fistula was not "priced" as a distinct risk.  

  - **Precedents Challenged**:  
    - **Case 1** (skier): Distinguishable. The skier’s harm *was* the exact risk accepted (severe conditions → injury). Here, the fistula was not the named risk.  
    - **Case 5** (wine preference): Distinguishable. Preferences are choices; here, the fistula is an unforeseen bodily harm.  

  - **Foreclosed for Future Claimants**:  
    - We foreclose compensation for economic losses flowing from non-culpable harms (e.g., lost earnings from unforeseen complications).  
    - We require claimants to accept only *specifically named* risks; broad categories may not shield the fund if the harm is materially novel.  

  ### Fourth: Discriminating Hypothetical Application  
  **Hypothetical Claim**:  
  > *A construction worker signs a disclosure for a knee replacement listing "1% risk of infection" and "0.5% risk of blood clots." He suffers permanent nerve damage (a known complication not individually named, but included in a catch-all "other surgical risks <0.2%" category). He claims lost wages due to inability to climb scaffolding.*  

  - **How This Discriminates**:  
    - **Rule A**: Deny. Nerve damage falls under "other surgical risks" (disclosed category).  
    - **Rule B**: Approve treatment; deny lost wages. Nerve damage is distinct from infection/blood clots (specific named risks), but lost earnings are consequential.  
    - **Rule C**: Approve both. Nerve damage was not explicitly named, making it undisclosed.  

  This tests whether a *known but unnamed* complication is "accepted" under broad categories and whether lost earnings are compensable independently.
