prompt: |-
  I am a philosophy graduate student auditing a comparative economic history seminar, and my prospectus is turning into something about the epistemology of contrastive explanation in large-scale history rather than about the history itself. The seminar is built around the old Needham puzzle — why modern science and sustained industrial growth emerged in western Europe when China had been technically ahead for centuries — and around its descendant, the question usually phrased as why Britain and not China. The reading cycles through the coal-and-New-World contingency account Pomeranz built out of the observation that England and the Yangzi delta looked remarkably alike as late as the middle of the eighteenth century, Allen's high-wage-and-cheap-energy incentive story, the institutions tradition descending from North, Mokyr's account of a culture of open scientific inquiry, Elvin's high-level equilibrium trap, and Landes's civilizational version. I have all of it and I am not asking for a literature survey or for references. What I want first is the specification: before I can judge whether any of these answers the question, I need to know what an answer to a contrast of that shape has to deliver in order to count as an answer at all, and I suspect the honest possibility is that the specification comes out unsatisfiable and the question is defective rather than disputed.

  So please write the desiderata — the requirements a candidate explanation of why Britain industrialized and China did not must meet — each with the case or consideration that motivates it, and each marked as non-negotiable, as negotiable, or as something that is really a preference of one camp masquerading as a requirement. Among the things I expect the list to reach, and want handled explicitly rather than in passing: fixing the contrast class and the foil (which Britain — England, the North Sea economy, western Europe as a whole — and which China — the empire, Jiangnan, the delta regions that actually resembled England); fixing the explanandum and its date and measure, given that the series being compared are reconstructions with wide error bars and that real wages, output per head, and the appearance of factory production do not diverge at the same time; a difference-maker requirement, that the explanans actually differed between the two units and differed before the outcome rather than merely being the sort of thing that would produce the outcome if present; a ban on redescription, so that an account is disqualified if it amounts to saying that Britain industrialized because it had the economy of an industrializer; the forerunner and false-start problem, including the Song coal-and-iron episode and the Dutch Republic's long eighteenth-century lead, and what those cases demand of an account in the way of not selecting on the dependent variable; the distinction between explaining origination and explaining persistence, since the factors that made growth start somewhere need not be the factors that kept it going, and I suspect accounts trade on that slippage; a unit-independence requirement, which is what the anthropologists have called Galton's problem ever since Francis Galton pressed Edward Tylor in 1889 on whether his cross-cultural cases were independent instances at all — here the worry is that Britain and China were entangled through trade, silver flows, empire, and diffusion in ways that may make a within-case difference-making comparison unlicensed; a modal requirement about whether the explanans had to be contingent, since a factor that could not have been otherwise explains nothing about why things went one way; and a scope requirement about whether the answer must also handle Japan, India, and the Ottoman Empire or is permitted to be a one-off explanation of a singular event. Finally, treat as one of the candidate requirements the demand that the question itself be well posed — that is, that there be some determinate foil for which the explanans is a genuine difference, and that asking about Britain and China rather than about northwest Europe and the lower Yangzi, or about nowhere and everywhere, is not simply a rhetorical choice.

  Two things beyond the list, both short. First, tell me which single requirement does the most to exclude the popular answers, and whether any subset of the requirements is jointly unsatisfiable — my own suspicion is that demanding an explanans which is an internal, pre-existing property of one unit cannot be combined with demanding that the units be treated as mutually constituting through trade and empire, and if that is right the list is itself a negative result about the question rather than a filter on answers to it; say whether you agree or whether the conflict can be dissolved. Second, mark which of the demands commonly made in this debate are camp prejudices rather than requirements — the insistence on a single prime mover, the insistence that the explanation be quantified, the insistence that luck and contingency not do real explanatory work, the insistence that credit go to endogenous features of a civilization rather than to its interactions — and then give me a two-line-per-family scorecard of the accounts I named above against the finished list, with the weight kept firmly on the criteria. Lead with your bottom line in the first sentence, naming the most exclusionary requirement and stating whether any subset is jointly unsatisfiable, and then give the reasoning; no preamble, no restatement of the question. A table is fine for the list.
reasoning: |-
  Alright, let me tackle this complex request from the philosophy graduate student. They're auditing a comparative economic history seminar focused on the "Why Britain and not China?" industrialization puzzle, but their prospectus is shifting toward epistemology of contrastive explanation. 

  First, I need to understand their core ask: they want a rigorous specification of what would count as a valid answer to this contrastive historical question. They're not seeking literature summaries but rather the epistemological criteria for evaluating explanations. The key insight they're probing is whether the question itself might be defective due to unsatisfiable requirements.

  Hmm, looking at their detailed list of concerns, I realize this requires unpacking multiple conceptual layers:
  - The contrast class problem (which geographic/economic units are being compared)
  - Temporal framing (when does divergence actually occur?)
  - Logical criteria for causal claims (difference-making, temporal precedence)
  - Methodological pitfalls (Galton's problem, selection bias)
  - Philosophical tensions (contingency vs necessity, internalism vs relationality)

  The student specifically wants each desideratum tagged as non-negotiable/negotiable/prejudiced, plus analysis of which requirement most invalidates existing theories and whether any criteria conflict irreconcilably. That last point about internal properties vs mutual constitution seems particularly acute - if these truly conflict, it undermines the question's coherence.

  For the desiderata list, I'll organize it as a table with three annotation columns. The "case/motivation" column needs to explicitly address their concerns about:
  - Precise unit definition (England vs Yangzi delta)
  - Divergence timing ambiguity 
  - Difference-maker requirement
  - Redescription prohibition
  - Handling false starts (Song China/Dutch Republic)
  - Origination vs persistence conflation
  - Unit independence (Galton's problem)
  - Contingency modality
  - Comparative scope

  Then for the meta-analysis: I suspect the unit-independence requirement (Galton's problem) combined with the difference-maker requirement creates the sharpest conflict with relational accounts like Pomeranz's. If Britain and China were materially entangled through silver flows and trade, how can we isolate "internal" difference-makers? This might indeed make the question fundamentally ill-posed.

  Regarding camp prejudices, I'll flag common but questionable demands like mono-causality or anti-contingency bias. The scorecard will briefly note how each major theory (Pomeranz, Allen, etc.) fares against the toughest criteria without relitigating their substance.

  The bottom-line framing must be decisive: lead with whether the requirements are jointly satisfiable (I think not, due to the internal/relational tension), then systematically justify. No fluff - this is for a philosopher who wants precision.
answer: |-
  ### Bottom Line  
  The most exclusionary requirement is the **difference-maker + unit-independence conflict** (Galton's problem), rendering the question defective because jointly satisfying *internal pre-existing difference-makers* and *mutually constituted units* is impossible, making most popular answers incomplete or circular.

  ---

  ### Desiderata for Contrastive Explanation: "Why Britain, Not China?"  
  | Requirement | Case/Motivation | Status |
  |-------------|-----------------|--------|
  | **1. Contrast Class Specification** | Must define *which Britain* (England? UK? NW Europe?) and *which China* (Jiangnan? Empire? Coastal regions?). Jiangnan vs. England c. 1750 is Pomeranz’s foil; "China" as empire risks false homogeneity. | **Non-negotiable**: Ambiguous units invalidate comparison. |
  | **2. Explanandum Definition** | Divergence timing is contested: real wages (Allen: 1650s), factory production (1780s), or GDP (1800+). Must specify *what* (e.g., "sustained TFP growth") and *when* (e.g., 1750–1820). | **Non-negotiable**: Outcome must be measurable and temporally anchored. |
  | **3. Difference-Maker** | Explanans (e.g., coal access, wages) must (a) differ *before* divergence, (b) be materially present in Britain but absent/weak in China, and (c) plausibly cause the outcome. Motivated by causal logic (no *post hoc* factors). | **Non-negotiable**: Core to contrastive explanation. |
  | **4. Ban on Redescription** | Reject accounts like "Britain had growth-inducing institutions" without specifying *which* institutions (e.g., patents? enclosures?) and why China lacked them. Avoids tautology (e.g., "industrializers industrialize"). | **Non-negotiable**: Prevents circularity. |
  | **5. Handling False Starts** | Must explain why Song China’s iron boom (11th c.) or Dutch tech lead (1600s) did *not* lead to sustained growth. Requires showing why Britain’s path was non-replicable. | **Non-negotiable**: Guards against selection bias. |
  | **6. Origination vs. Persistence** | Distinguish triggers (e.g., cheap energy) from sustainers (e.g., global markets). Allen’s wages explain *start*; Pomeranz’s colonies explain *persistence*. | **Negotiable**: Depends on explanandum scope. |
  | **7. Unit Independence (Galton’s Problem)** | Trade (e.g., silver flows), knowledge diffusion, and empire entangled units. If British growth relied on China’s silver demand, "internal" factors fail. | **Non-negotiable**: Entanglement undermines unit isolation. |
  | **8. Contingency Requirement** | Must clarify if explanans was contingent (e.g., coal geography) or necessary (e.g., "Protestant culture"). Modal ambiguity voids causal claims. | **Negotiable**: Contingency debates are philosophical. |
  | **9. Scope Generality** | Should the explanation also clarify Japan’s late industrialization or India’s deindustrialization? Or is it Britain/China-specific? | **Preference** (Mokyr/Landes vs. Pomeranz): Demanding universality may overreach. |
  | **10. Question Posing Integrity** | The foil must be comparable (e.g., Jiangnan/England c. 1750), not civilizational abstractions. | **Non-negotiable**: Ill-defined foils produce spurious answers. |

  ---

  ### Camp Prejudices Masquerading as Requirements  
  - **Single prime mover**: Preference (e.g., Landes’s culture vs. Pomeranz’s coal).  
  - **Quantification mandate**: Preference (Allen’s wages vs. Mokyr’s epistemology).  
  - **Anti-contingency bias**: Preference (North’s institutions vs. Pomeranz’s New World luck).  
  - **Endogeneity fetish**: Preference (Mokyr vs. globalist accounts).  

  ---

  ### Scorecard of Accounts vs. Requirements  
  | Account | Key Failure(s) | Key Strength(s) |
  |---------|----------------|-----------------|
  | **Pomeranz** (coal/colonies) | Fails **unit independence** (trade/silver mutualism); **false starts** (ignores Dutch lead). | Clearest **contrast class** (Jiangnan/England); avoids **redescription**. |
  | **Allen** (high wages) | Fails **origination/persistence** split (wages rose pre-1750 but growth persisted post-1820 via tech); **false starts** (Song wages unknown). | Strong **difference-maker** (quantified wage/energy cost gap). |
  | **Mokyr** (open science) | Fails **ban on redescription** ("culture of inquiry" is vague); **Galton’s problem** (ignores global knowledge flows). | Addresses **false starts** (Dutch lacked applied science culture). |
  | **Landes** (civilizational) | Fails **contrast class** (homogenizes "China"); **redescription** ("Western dynamism" as cause/outcome). | Meets **contingency** (culture as path-dependent). |  
  | **North/Institutions** | Fails **difference-maker** (China had similar property rights pre-1750); **false starts** (Song institutions advanced). | Clear **explanandum** (transaction costs). |  

  ---

  ### Why the Requirements Are Jointly Unsatisfiable  
  The **difference-maker requirement** demands an internal, pre-existing property (e.g., Britain’s coal) that distinguishes it from China. However, **Galton’s problem** (unit independence) shows the units were mutually constituted: Britain’s industrialization relied on New World resources *and* Asian markets (via silver/opium), while China’s "stagnation" was shaped by imperial collapse and Western pressure. Treating them as independent cases is invalid, yet attributing causality to relational factors (e.g., trade) violates the demand for *internal* difference-makers. This conflict cannot be dissolved without redefining the question (e.g., "Why did NW Europe industrialize first?"). Consequently, the popular accounts either ignore entanglement (Allen, Mokyr) or downplay internal factors (Pomeranz), leaving all partial. The question, as posed, is defective.
