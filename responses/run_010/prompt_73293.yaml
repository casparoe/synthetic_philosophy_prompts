prompt: |-
  OK so I've just come off a three-hour argument with a mate who's doing a PhD in consciousness science and I genuinely can't tell which of us is talking nonsense, so I want an answer that actually picks a side rather than laying out the options and leaving me to choose.

  The thing we were arguing about is the adversarial collaborations — the charity-funded projects (COGITATE and the ones that followed, I think) where the global workspace people and the integrated information people sit down with a bunch of neutral labs, jointly preregister their divergent predictions with explicit pass/fail criteria, and then run the same couple of hundred people through the same visual experiments under fMRI, MEG and intracranial EEG. In these experiments people are shown pictures, sometimes briefly or washed out, sometimes plainly visible for varying lengths of time, and they press a button to say whether they saw something and what it was, and sometimes rate how clearly they saw it. Then everyone looks at where and when information about the stimulus is decodable, whether there's a sudden late amplification of activity out in frontal cortex (what the workspace people call ignition), whether posterior areas carry the content for longer, and both camps come away saying the results partly support and partly embarass their own theory, and the field declares the whole exercise a triumph and a model for how to do this properly.

  My friend says that's just science working as it should — two theories, shared predictions, decisive data. I have this nagging feeling the setup has already settled something important before the first subject went in the scanner. Every measurement in there is about whether information is available for a button press, a verbal report and the control of behaviour. But I keep hearing about a distinction between access consciousness and phenomenal consciousness — information being available to the rest of the system versus there being anything it's like — and about the whole no-report movement, where people deliberately stop asking subjects anything at all precisely because they think reporting drags in attention and decision-making and contaminates the measurement. So the same field treats report as a confound to be engineered out, and then uses report-based tasks to arbitrate between two theories of experience.

  So: what does this practice actually presuppose? Does it require that access and phenomenal consciousness never come apart, or only the weaker claim that the second can't be measured except through the first — and which of those is doing the work? What views does it quietly rule out, e.g. a view on which experience is intrinsic and not a matter of information being available for use by anything, or higher-order views where what matters is a thought about the state rather than the state's availability? Relatedly, the write-ups concede they're testing the theories' biological implementations rather than their formal cores, so a theory can lose the experiment and survive by relocating itself elsewhere in the brain — is that a small-print caveat, or does it mean the pass/fail criteria could never have been decisive, and if so what sort of thing is being treated as a testable theory of consciousness here?

  Please be careful to separate what the practice strictly presupposes from what it merely fits comfortably with. If several mutually incompatible theories would license exactly these experiments, then my worry is toothless and I want to be told so. And say whether the practice is internally consistent given the no-report stuff, or whether those are two different projects that just happen to share a department.

  Then, if you think the worry has teeth, redo the thing concretely: what would the collaboration have to change — the tasks, the measures, the predictions, the pass/fail criteria — if we took seriously the possibility that phenomenal consciousness outruns what's reportable and usable? If your answer is that no experiment could do that, say so plainly and tell me what the exercise is actually for instead.

  Don't give me the balanced menu version. Commit: tell me whether my friend is right that this is just good science or whether the practice is quietly question-begging, name the one presupposition you think is load-bearing, and give me your reasons. Also please write it in British English — behaviour, -ise endings, the lot.
reasoning: |-
  Alright, let me tackle this user's query step by step. They've had a heated debate with their PhD friend about adversarial collaborations in consciousness studies, specifically the COGITATE experiments. The user feels these experiments might be presupposing that access consciousness (reportable) and phenomenal consciousness (subjective experience) are inseparable, which could bias the results. Their friend argues it's just good science with clear predictions and data.

  First, I need to unpack the core issue: the experiments rely on behavioral reports to measure consciousness. But the no-report paradigm in the same field suggests reports can confound results by involving attention and decision-making. The user questions whether these experiments inherently assume that access and phenomenal consciousness always coincide. 

  I should consider the theories involved. Global Workspace Theory (GWT) posits that conscious access for global broadcasting is what consciousness is. Integrated Information Theory (IIT) argues consciousness arises from intrinsic causal powers in neural systems. The experiments test neural correlates tied to reportability, which aligns more with GWT. Even IIT's predictions in these setups are framed around report-based tasks, which might not capture its core claim about subjective experience.

  The user also mentions the concession that the experiments test biological implementations, not formal theories. This raises a red flag—if a theory can relocate its neural correlates after disconfirming evidence, were the tests truly decisive? It seems like the pass/fail criteria might not be as stringent as presented.

  Then there's the no-report movement. If the field acknowledges that reports contaminate phenomenal consciousness measurements, why use report-based tasks to adjudicate theories? The user points out an inconsistency here. The experiments might only be testing access consciousness, not phenomenal. 

  I need to identify the load-bearing presupposition: that reportability is a reliable proxy for phenomenal consciousness. Without this, the experiments don't test theories of phenomenal consciousness but only access. Theories that separate the two, like some higher-order thought theories or non-functionalist views, would be sidelined. 

  What would a modified experiment look like? Including no-report paradigms, measuring intrinsic properties like IIT's Φ, or using subjective reports without task demands. But these face challenges. No-report measures still infer consciousness indirectly, and intrinsic properties are hard to quantify. 

  The user wants a definitive stance. The practice isn't neutral; it leans towards access-based theories. The experiments are useful for mapping report-related neural correlates but might miss the mark on phenomenal consciousness. The friend sees the process as good science, but the setup's reliance on reports is a critical flaw from the start. 

  I should confirm that British English is used—terms like "behaviour" and "-ise" endings. Also, ensure the answer commits clearly: the worry has teeth, the presupposition is that access equals phenomenal consciousness, and this biases the outcomes. The collaboration's setup isn't question-begging per se but is inherently limited by its methodological choices.
answer: |-
  Right. Buckle up. Your worry has teeth, and here's the precise location of the bite: **The adversarial collaboration practice, as implemented in COGITATE and similar projects, presupposes that the neural correlates of *reportable access* are the appropriate, sufficient, and decisive test-bed for adjudicating between theories of *phenomenal consciousness*. This presupposition quietly rules out theories where phenomenal consciousness (what-it's-like-ness) systematically diverges from access consciousness (availability for global report and control), and it renders the pass/fail criteria fundamentally indecisive for the formal core of theories like IIT.**

  **Why Your Friend is Partly Right (But Mostly Wrong):**
  Your friend is correct that *within its own presupposed framework*, the process looks like textbook good science: competing theories, shared predictions, pre-registration, decisive data collection. The *execution* of the experiment relative to the *stated, operationalised predictions* is rigorous. Where it goes wrong is *before* that: in the selection of what gets operationalised and measured. The framework itself smuggles in a crucial, contested assumption.

  **The Load-Bearing Presupposition:**
  The **indispensable, load-bearing presupposition** is this: **Phenomenal consciousness (PC) either is identical to access consciousness (AC), or is so tightly coupled to it under the experimental conditions that measuring AC provides a perfect (or at least, the best available and sufficient) proxy for measuring PC.** The entire experiment design – relying on button presses, verbal reports, and behaviour control as the *sole behavioural indicators* of consciousness, and then searching for neural correlates *of those reportable states* – requires this to be true.

  *   **Why is this indispensable?** If PC can exist without AC (e.g., rich but fleeting, unattended phenomenal states that aren't reportable), or if AC can exist without PC (e.g., "zombie" access states), then:
      *   Finding neural correlates of reportability (AC) doesn't guarantee you've found correlates of PC.
      *   *Not* finding correlates of reportability doesn't guarantee the *absence* of PC.
      *   The "pass/fail" criteria for a *theory of PC* become meaningless, because the dependent variable (reportability) isn't reliably tracking PC.

  **What Views Does This Quietly Rule Out?**
  The practice inherently favours theories that *equate* or *tightly bind* PC and AC, and disadvantages those that posit a separation:

  1.  **"Phenomenal Overflow" Views (e.g., Block):** If rich phenomenal experience *can* exist without being accessible for report (e.g., in brief, masked stimuli or unattended fields), then experiments *only* measuring reportability miss this entirely. The COGITATE setup assumes that if the subject can't report it (access it), it wasn't phenomenally conscious. This directly contradicts the overflow hypothesis from the outset.
  2.  **Non-Functionalist/Intrinsic Property Views (e.g., core IIT claim, Chalmers-style property dualism):** If PC is an intrinsic property of certain systems (like high Φ complexes for IIT), not defined by its functional role (like global availability), then its presence might *not* always manifest in reportability. A state could be phenomenally conscious (high Φ) but not globally accessible/reportable due to downstream bottlenecks (attention, working memory). Conversely, a globally accessible state *could* lack intrinsic phenomenality (a "zombie report"). Testing *only* the accessibility/ignition signature doesn't directly test the intrinsic property. IIT's concession about "biological implementation" is a *necessary retreat* because the experiment isn't testing its core claim about intrinsic cause-effect power generating PC; it's only testing whether high-Φ areas show GWT-like ignition *when report happens*.
  3.  **Some Higher-Order Thought (HOT) Views:** While many HOT theories *do* link PC to availability for higher-order thought (a form of access), they specifically argue PC *is* the property of being represented by a HOT. Crucially, this HOT might *not* always lead to verbal report or button press. The COGITATE setup conflates "availability for report" with "presence of a HOT". A state could have a HOT (thus be PC) but fail to trigger a report due to task disengagement or motor inhibition, or trigger a report *without* a corresponding HOT (misreporting). The experiment tests report, not HOTs.

  **The No-Report Elephant in the Room:**
  This is where the inconsistency becomes glaring. The field simultaneously recognises that:
  *   **Report is a confound:** It introduces processes like attention, decision-making, working memory, motor planning. These might be *consequences* of consciousness (AC) or necessary for *expressing* it, but they aren't identical to the phenomenal state itself. No-report paradigms aim to isolate PC *from* these confounds.
  *   **...Yet uses report-based tasks to define "consciousness" for theory testing:** COGITATE uses button presses and verbalisations as the *gold standard* for whether a stimulus was conscious. This directly contradicts the logic of the no-report movement. The practice isn't internally consistent with the no-report critique; it largely ignores it for the purposes of these large-scale collaborations. They are indeed two different projects sharing a department, with the adversarial collab prioritising operationalisability and clear behavioural measures over the no-report concern about contamination.

  **The "Biological Implementation" Caveat: A Fatal Flaw for Decisiveness**
  This isn't a minor footnote; it's the trapdoor beneath the pass/fail criteria. If a theory (especially IIT) can "relocate" after disconfirming evidence by saying "oh, the *core* theory is about formal properties, the *implementation* in this brain area was wrong", then the experiment **could never have been decisive** for the *theory itself*, only for its proponents' specific *neural hypothesis*. It turns the test into one about *brain location of report-related ignition*, not about the fundamental mechanisms generating PC. The "testable theory of consciousness" here is reduced to a *testable neural model of access/report*.

  **Concrete Redo: What Would Taking Phenomenal Overflow Seriously Require?**
  If we genuinely want to test PC without presupposing it's identical to AC, the collaboration would need radical changes:

  1.  **Tasks:** Incorporate **no-report paradigms** as the *primary* measure of PC. Use passive viewing, illusion conditions (e.g., motion-induced blindness), binocular rivalry without report, or tasks where the *relevant* stimulus isn't the one being reported on. Supplement with *subjective measures* (e.g., Perceptual Awareness Scale ratings) collected *sparingly and retrospectively* to minimise contamination, not as the primary behavioural driver.
  2.  **Measures:** Focus on neural signatures hypothesised to be *intrinsic* to PC, independent of report:
      *   **IIT:** Attempt to measure Φ or local maxima of intrinsic cause-effect power *directly* (immensely challenging, arguably currently impossible with fMRI/MEG/iEEG).
      *   **Recurrent Processing:** Look for sustained, recurrent activity in sensory areas *without* requiring frontal ignition (potentially using no-report paradigms).
      *   **Specific PC Signatures:** Search for neural patterns decodable for stimulus identity/content that *persist* under conditions where report is absent or impossible, but behavioural/neural evidence suggests phenomenal processing (e.g., priming effects under unaware conditions).
      *   **Contrast:** Directly compare neural activity patterns *within the same stimulus condition* between trials where subjects *later* report clear experience vs. no experience (using sparse, delayed reports), or between conditions known to dissociate PC and AC (e.g., attentional blink).
  3.  **Predictions & Pass/Fail Criteria:** Theories would need to make explicit predictions about:
      *   Where/when neural states with high intrinsic properties (like Φ) occur relative to stimuli.
      *   The presence/absence of specific recurrent processing signatures *independent* of report.
      *   The decodability of stimulus content *without* global ignition or report-related activity.
      *   Crucially, pass/fail would need to be defined relative to *these* neural signatures linked to PC proxies (like no-report behavioural effects or sparse subjective ratings), *not* primary task report success.

  **Is It Possible? The Hard Truth:**
  Yes, experiments *could* be designed to take overflow seriously, incorporating no-report measures, sparse subjective reports, and searching for intrinsic signatures. **However, it is currently impossible to have a *decisive*, theory-neutral test like COGITATE aimed for.** Why?

  *   **The Hard Problem:** There is no agreed-upon, direct neural measure of PC. We always rely on *proxies* (report, behaviour, subjective rating). No-report paradigms use *different proxies* (neural persistence, priming, forced-choice above chance without awareness), but they are still *proxies*, not direct PC readings.
  *   **Theory-Laden Proxies:** Choosing *which* no-report proxy to use is itself theory-laden. Does sustained sensory activity *mean* PC? Does priming? Different theories will claim different proxies are valid.
  *   **Measuring Intrinsic Properties:** Reliably measuring something like Φ in vivo with current neuroimaging is not feasible. Testing IIT's core claim directly is currently beyond our methodological reach.

  **What is the Exercise Actually For, Then?**
  COGITATE and similar collaborations are primarily for:
  1.  **Mapping the Neural Correlates of Access Consciousness (NCCa):** They are excellent at finding the neural mechanisms underlying *reportability, global availability, and behaviour control* – the functional aspects of consciousness most relevant to cognition.
  2.  **Testing Specific Neural Hypotheses:** They test whether specific brain areas and dynamics (like late frontal ignition) are necessary/sufficient for *access* under specific task conditions.
  3.  **Promoting Scientific Rigour:** They model transparency, pre-registration, and adversarial cooperation beautifully.
  4.  **Refining *Access*-Based Theories:** They help refine GWT's neural predictions and force IIT proponents to refine their *empirical*, testable neural hypotheses (even if not testing the formal core).

  **The Verdict:**
  Your friend is wrong that this is straightforwardly "good science" adjudicating theories of *phenomenal consciousness*. It's rigorous science *operating within a specific, contested framework* that presupposes reportable access is the gold standard proxy for phenomenal consciousness. This framework is not neutral; it favours access-oriented theories (like GWT) and disadvantages those positing a separation or intrinsic nature of PC (like core IIT or phenomenal overflow). The "decisive data" is only decisive for theories of access and report. The practice is internally inconsistent with the field's own no-report critique. While valuable for mapping NCCa and promoting rigour, it cannot settle the debate about phenomenal consciousness itself because its methodology presupposes an answer to the very question it seeks to investigate. The presupposition that access = phenomenal is doing the heavy lifting, and it's a load-bearing wall built on contested ground.
