answer: |-
  Here is a complete practice essay package tailored to your specifications, focusing on the self-reference crux within indirect normativity.

  ---

  **1. Essay Question (Target Time: 45 minutes)**

  "It is sometimes objected that idealized deliberation views face a fatal self-reference problem: a *fully informed* idealized agent must know the *output* of the very deliberation procedure she is undergoing. Attempting to resolve this by excluding knowledge of the procedure's output appears to concede that direct normative input is needed to specify the procedure itself. Does this self-reference problem, and the apparent failure of the obvious repair, fatally undermine the project of grounding normativity indirectly through idealized deliberation? In your answer, engage with the potential responses that (a) convergence across reasonable specifications suffices even without unique outputs, (b) practical narrowing of options is sufficient, and (c) access to the output cannot alter the endorsement of the *truly* idealized agent. Explain why the retreat to convergence might threaten the distinctiveness of the indirect normative project."

  ---

  **2. Model Answer (Approx. 700 words)**

  The self-reference problem presents a serious challenge to indirect normativity. If the idealized agent is stipulated to be *fully informed*, then she must possess knowledge of the very normative verdicts that the procedure aims to generate. This creates a fixed-point issue: what the agent endorses depends on what she *expects* the procedure to endorse, potentially leading to instability (shifting outputs) or indeterminacy (multiple equally admissible outputs). For instance, knowing that the procedure "endorses utilitarianism" might lead a fully informed agent to endorse utilitarianism, whereas knowing it "endorses contractualism" might lead her to endorse contractualism instead. The procedure seems incapable of generating a stable, unique output from its own specification.

  The obvious repair – excluding knowledge of the procedure's *own outputs* or *normative facts* – appears self-defeating. Deciding *which* facts constitute "normative facts" or "facts about the procedure's output" requires a prior normative judgment. Is the fact "pain is bad" normative? Is the fact "the ideal agent endorses policy X" about the output? Answering these questions demands direct normative input to define the scope of the agent's knowledge, thereby reintroducing the very direct normativity the view sought to avoid. The specification of the deliberative procedure ceases to be purely descriptive or structural; it smuggles in substantive normative commitments about what information is *relevant* or *permissible* for normative deliberation. This fundamentally undermines the core promise of indirect normativity – grounding normativity solely in the output of a non-normatively specified procedure.

  Proponents might offer several responses, but each faces significant difficulties.

  *   **(a) Convergence Suffices:** One might argue that while unique outputs aren't guaranteed, *convergence* across a range of "reasonable" specifications of the idealization (e.g., slightly different ways of defining "full information" or "vivid acquaintance") yields sufficiently similar outputs for practical purposes. However, this retreat is costly. Firstly, it abandons the ambition of the procedure *determining* the content of normativity, settling instead for it *correlating* with independently plausible norms. More damningly, *defining* what counts as a "reasonable" specification is itself a normative task. If convergence only holds across specifications deemed reasonable *by our antecedent normative lights*, then the procedure isn't doing the fundamental justificatory work; our prior commitments are selecting which procedures count, and their convergence merely reflects those commitments. The distinctiveness of indirect normativity – that the procedure *constitutes* justification – is lost; the procedure becomes an epiphenomenon of our prior norms.

  *   **(b) Practical Narrowing is Sufficient:** Another response concedes indeterminacy but claims the procedure still *narrows down* the range of acceptable options significantly, which is sufficient for practical guidance. While this might be pragmatically useful, it fails as a *foundational* account of normativity. It doesn't tell us *why* the narrowed options are normative or what makes them right/wrong; it only identifies a (potentially indeterminate) set. Foundational theories aim to explain the *source* of normativity, not just offer decision aids. Furthermore, the indeterminacy might be severe enough to leave core moral dilemmas unresolved by the procedure.

  *   **(c) Benign Self-Reference:** A third response denies that knowledge of the output *could* alter the endorsement of the *genuinely* idealized agent. The truly coherent, fully informed agent, the argument goes, would endorse the same outcome *regardless* of whether she knew what the procedure endorsed beforehand. Access to the output is epistemically inert. However, this seems question-begging or empirically dubious. It assumes the procedure *has* a unique, stable output that is impervious to expectations about it – precisely what the self-reference problem calls into doubt. Without an independent argument for why the agent's knowledge of the expected output wouldn't rationally influence her deliberation (e.g., through changing her expectations about others' behaviour or the feasibility of certain norms), this merely asserts the problem away. The burden of proof lies with the proponent to demonstrate this immunity.

  Therefore, the self-reference problem, coupled with the failure of the exclusion repair and the limitations of the proposed responses, does pose a near-fatal challenge to indirect normativity as a foundational project. The responses either concede that the procedure relies on prior normative inputs for its specification (undermining indirectness), abandon the ambition of providing a determinate foundation (settling for correlation or narrowing), or make unsupported assumptions about the immunity of ideal deliberation. The retreat to convergence, while perhaps salvaging practical utility, most clearly highlights the core issue: if the "reasonableness" of specifications depends on our antecedent norms, then the procedure isn't the source of justification; it's a mirror reflecting inputs it didn't generate. This suggests indirect normativity cannot wholly escape direct normative commitments; they re-enter at the meta-level when defining the supposedly non-normative idealization procedure itself.

  ---

  **3. Marking Scheme (Total: 25 Marks)**

  *   **Understanding & Exposition (8 marks):**
      *   Clearly explains the self-reference problem (why full information includes the output, leading to potential instability/indeterminacy). (4 marks)
      *   Clearly explains why the exclusion repair (banning knowledge of outputs/normative facts) reintroduces direct normativity (defining the exclusion set requires normative judgment). (4 marks)

  *   **Critical Engagement & Analysis (12 marks):**
      *   Engages meaningfully with response (a) Convergence: Explains the appeal (practical workaround) AND the core objection (defining "reasonable" specifications requires prior norms, undermining distinctiveness). (4 marks)
      *   Engages meaningfully with response (b) Narrowing: Explains the appeal (practical guidance) AND the core objection (fails as a foundational account, may leave key indeterminacies). (3 marks)
      *   Engages meaningfully with response (c) Benign Self-Reference: Explains the appeal (denies the problem exists) AND the core objection (question-begging/unsupported assumption about immunity). (3 marks)
      *   Explicitly addresses the "converse pressure" regarding convergence threatening distinctiveness (as per Analysis point for (a)). (2 marks)

  *   **Evaluation & Conclusion (5 marks):**
      *   Offers a clear, justified overall assessment of whether the problem is fatal, technical, or a misunderstanding, based on the analysis above. (3 marks)
      *   Identifies the most significant weakness revealed by the discussion (e.g., the inescapable need for prior normative input at the meta-level). (2 marks)

  **Top Band (21-25 marks) Requirement:** An answer in the top band **must explicitly identify and thoroughly analyze the tension at the heart of the convergence response**: that relying on convergence across "reasonable" specifications only works if "reasonable" is defined normatively *prior* to the procedure, thereby conceding that the procedure itself is not the fundamental source of justification but relies on antecedent norms. Merely stating that convergence is sufficient is inadequate; the top band requires showing *why* this solution undermines the core *indirectness* of the project. It must connect this point directly to the essay's central challenge.

  **Characteristic Mistakes Costing Marks:**

  1.  **Mistaking the Exclusion Repair:** Simply stating that excluding normative facts "solves" the self-reference problem without recognizing that *defining what counts as a normative fact to exclude is itself a normative act*. **(Why it's a mistake:** It misses the core meta-normative objection that direct normativity is reintroduced at the level of specifying the procedure, rendering the view non-indirect in the foundational sense. This is a failure of analysis, not just omission. Cost: 3-5 marks depending on severity.)
  2.  **Treating Convergence as Unproblematic:** Arguing that convergence across specifications is a sufficient solution without addressing the requirement that *which specifications are included* must be defined, and that this definition likely relies on prior normative judgments. **(Why it's a mistake:** It ignores the critical challenge to the *distinctiveness* and *foundational aspirations* of indirect normativity. The point isn't that convergence doesn't happen, but that if it depends on normatively pre-selected inputs, the procedure isn't the justificatory bedrock. Cost: 3-4 marks.)
  3.  **Ignoring the Distinction Between Foundational and Practical:** Defending the "narrowing" response by focusing solely on its practical utility without addressing its failure as a *foundational* account of what makes things right/wrong or why we have reasons. **(Why it's a mistake:** It changes the subject. Indirect normativity is typically presented as a foundational theory. Accepting that it only narrows options concedes it fails at its primary philosophical goal. Cost: 2-3 marks.)

  ---

  **Epistemic Self-Assessment:**

  *   **Confidence in Claim 1 (Genuine Self-Reference): High.** The logic is compelling: "all non-normative facts" explicitly excludes normative facts, but "facts about the output of *this specific procedure*" are contingent, non-normative facts about the world (like "Agent A endorses X"). Including them creates clear self-reference. Loose description isn't plausible here; the specification directly mandates knowledge that logically depends on the output.
  *   **Confidence in Claim 2 (Exclusion Repair Concedes Too Much): High.** The argument seems robust: identifying which facts are "about the procedure's output" or "normative" requires a classification that isn't value-neutral. Any plausible exclusion rule will involve judgments about what *should* or *shouldn't* influence deliberation, which are normative.
  *   **Confidence in Overall Assessment (Near-Fatal Challenge): Medium-High.** The analysis of the responses, especially the convergence dilemma, strongly suggests a deep problem for the foundational aspirations of pure indirect normativity.
  *   **Point of Least Certainty:** The assessment of the "Benign Self-Reference" (c) response. **Why?** While it *seems* question-begging to simply assert immunity, one could imagine sophisticated philosophical arguments (e.g., based on essential properties of rationality or full information) claiming that the *truly* ideal state logically precludes the output being influenced by mere expectations about itself. I find this unlikely to succeed, but I'm less sure it's *impossible*. **What would settle it?** A rigorous formal model or impossibility proof demonstrating that, under plausible assumptions about rationality and information, knowledge of the expected output *can* lead to different stable fixed points or cycles, thereby confirming the problem's robustness. Alternatively, a successful positive argument demonstrating necessary immunity under idealization.
