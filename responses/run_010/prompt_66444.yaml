prompt: |-
  For several years now I have been going back and forth on the act/omission distinction: the canonical papers, the inexhaustible trolley permutations, and a few cycles of the same argument on LessWrong and the EA Forum, where it reliably resolves either into "it is a heuristic for expected-value reasoning that also carries information about the agent's dispositions" or into "it is a deontological residue we should stop honouring." I have come to distrust both resolutions, and I suspect the reason is that the parties disagree less about the distinction than about what an account of it is supposed to accomplish. So I would like the specification written down before anyone defends a view.

  The purpose, since adequacy is relative to it. I am helping draft a constraint for the operating spec of a deployed allocator: a system that distributes a scarce good (ventilators, transplant offers, relief funds — the particulars do not matter) and that will be held to account, by its overseers and by the public, for why some bad outcomes it produces are harms it inflicted and others harms it declined to prevent. The clause will look roughly like this: the system may decline to prevent harm, but it may not inflict it. I need to know what those two verbs are doing before I commit the sentence to paper. I am not asking you to settle the underlying dispute, and I am not asking whether such a clause is a good idea. I am asking for the list of demands that any account of the doing/allowing distinction must meet in order to be usable in that setting — and if those demands turn out to be jointly unsatisfiable, that is precisely the result I most want to see, stated as such.

  Deliverable: the desiderata. For each one, state the requirement, give the case or consideration that earns it a place on the list, and say whether you regard it as non-negotiable, as negotiable, or as a piece of one camp's ideology that has been smuggled in among the general requirements. Where I have drafted an item below, split it, merge it, restate it, or tell me it is no desideratum at all. Please also add the items I have missed — especially any that only become visible once a use like mine is in view, which is not the use most theorists have.

  My draft, in no particular order:

  1. Invariance under re-description, or a principled way of privileging one description. Whether a behaviour counts as doing or as allowing seems to turn on which trajectory of events we nominate as the default, and there are usually several equally natural candidates. Consider a resource currently held by patient A under the standing policy: the system reassigns it to patient B, and A dies. Under one description the system took something from A; under another it declined to confer a benefit it was never obliged to confer. An account that lets the classification flip with the framing has not delivered a constraint I can write down, unless it can say which framings are legitimate and on grounds that are not already moral.

  2. Redirection. The allocator never originates the scarcity; it only steers an existing threat from one queue to another. If every redirection of an antecedent threat onto a person is a doing, my clause paralyses the system; if none is, the clause is empty. The account must locate whatever line there is and identify what does the work at it.

  3. Preemption by earlier tampering. Cases where an agent's prior act removes or disables a standing provision that would otherwise have delivered the benefit, so that a later inaction becomes lethal: cancelling a scheduled check, decommissioning a failsafe the same team installed, letting a reserve run down. The account must say whether the morally relevant item is the earlier act or the later omission, and why.

  4. Composition and grain. Whether a great many small, individually cheap omissions can sum to a doing; whether the distinction is binary or admits of degree; and if it is binary, what justifies a bright line given that the borderline cases shade continuously into one another.

  5. Epistemic relativity. Whether the classification depends on what the agent knew or expected, or on the objective causal structure. Much of what my system allows is simply what its model failed to represent, so if the distinction is epistemically relative, the same physical behaviour changes category as the model improves. Say whether that is a defect or a virtue, and whether an account can be given both readings consistently.

  6. Standpoint. Whether the distinction is available only from inside the agent's deliberation, or whether it can be stated as an agent-neutral feature of events. A spec clause is written from outside, by a third party, about an agent; if the distinction is essentially first-personal, my clause may not be expressible at all.

  7. Non-collapse. The account must not turn out to be the doctrine of double effect, or a theory of intention, or the positive/negative duties distinction, in disguise — or it must explain why the collapse is benign and say what work doing/allowing does beyond intending.

  8. Deliverable shape. Whether the distinction yields a threshold or merely alters an exchange rate. The familiar picture holds that inflicting is worse than allowing, yet that allowing at trivial cost is still seriously wrong; if the only effect of the distinction is to change how much cost must be borne before a duty to prevent binds, then my clause can be approximated but never satisfied, and I should know that in advance.

  9. Declared target. Whether the account is explaining our judgments or vindicating a moral feature of the world, and, if the former, which of the empirical patterns it treats as tracking something real — the robustness of the intuition, its sensitivity to cost and vividness, the omission-bias effects in judgment studies — and which it explains away. An account that explains all of it away has changed the subject.

  10. Mediation. Where the line falls when harm reaches its victim through another person's voluntary act, through a chain of automation, or through a natural process the agent merely unblocked. In my setting nearly every outcome is produced jointly with human operators and other software.

  Then the analysis I actually want: which single requirement does the most to exclude candidates; whether any subset is jointly unsatisfiable, in particular given the purpose above; which of my items you judge to be shibboleths rather than desiderata; and what the nearest writable substitute for my clause would be if nothing on the list passes — a comparative or scalar constraint, say, or one relativised to an explicitly declared default.

  Finally, and only after the list, a brief assessment of how the main contenders do against it: the accounts that build the distinction on doing and allowing as such, the treatment that treats acts and omissions as a matter of the causal structure of what the agent does, the positive-and-negative-duties framing, and whatever a purely dispositional or signalling account would owe. A short paragraph each is enough. No citations, no bibliography, no suggested readings — I have the library; what I want is the reasoning. A table is fine for the list if that suits you better than prose.
reasoning: |-
  Okay, this user presents a deeply nuanced challenge regarding the act/omission distinction. They're drafting an operational clause for a resource allocator system that must distinguish between "inflicting harm" versus "declining to prevent harm." Their frustration with existing philosophical debates is palpable - they've clearly engaged extensively with trolley problems, EA/LessWrong discussions, and canonical papers, yet finds both consequentialist and deontological resolutions unsatisfactory. 

  The core insight here is brilliant: they suspect the real issue isn't the distinction itself, but unstated disagreements about what a successful account should achieve. That's why they're laser-focused on specification before evaluation - a fundamentally sound engineering approach to ethics. Their draft desiderata show sophisticated anticipation of implementation pitfalls, especially around re-description invariance and epistemic relativity.

  What makes this especially thorny:
  - They're not asking for the "right" answer (wisely, given the literature's stalemate)
  - They need something operationalizable in high-stakes real-world systems (ventilators, transplants)
  - They explicitly welcome the conclusion that no account satisfies all requirements

  The emotional tone suggests intellectual exhaustion - "going back and forth for years," "distrust both resolutions." There's also urgency: this isn't academic, it's for a deployed system facing public accountability. The phrase "held to account" appears twice, highlighting the legal/political stakes.

  Their 10 drafted requirements are remarkably comprehensive. I notice they've cleverly excluded moral ontology debates (item 9 handles that) and practical implementation issues like computational tractability. The "mediation" item (10) is particularly acute given their mention of automated systems interacting with human operators.

  For the analysis portion, I'll need to:
  1) Identify which desideratum creates the sharpest tripping point (likely re-description invariance + non-collapse)
  2) Test for joint satisfiability (suspecting failure due to epistemic relativity vs standpoint tension)
  3) Flag ideological items (e.g., "redirection" might contain unexamined deontological assumptions)
  4) Propose fallbacks (probably a scalar threshold model with explicit baseline declaration)

  The main contenders will need brutal triage:
  - Causal structure accounts fail epistemic relativity
  - Dispositional theories collapse into standpoint problems
  - Positive/negative duties get wrecked by preemption cases
  - Double effect smuggles in intention through the backdoor

  Most promising fallback: A cost-sensitive "departure from declared baseline" model with severity thresholds, openly acknowledging the frame-dependence while making the baseline itself contestable through democratic input. But I'll save that for the actual response.
answer: |-
  Here is your list of desiderata refined and expanded, with analysis of their joint satisfiability and implications for your operational clause. Requirements are ordered by their impact on feasibility, with non-negotiables marked ⚖️.

  ### Core Desiderata for an Operational Doing/Allowing Distinction
  | # | Requirement                  | Rationale & Case Example                                                                                                 | Status          | Threat to Feasibility |
  |---|------------------------------|--------------------------------------------------------------------------------------------------------------------------|-----------------|------------------------|
  | 1 | **Re-description Invariance** ⚖️ | *Case:* Reassigning a ventilator from A to B is "killing A" (doing) vs. "not saving A" (allowing). Must privilege one description objectively without moral circularity. | Non-negotiable | **Fatal** - No extant account achieves this without smuggling moral premises. |
  | 2 | **Epistemic Robustness** ⚖️ | *Case:* System fails to predict a rare complication, "allowing" harm. If distinction depends on model accuracy, identical acts change category with better data. Must be objective or admit relativity is fatal. | Non-negotiable | **Fatal** - Forces tradeoff: objectivity ignores system limitations; relativity voids auditability. |
  | 3 | **Standpoint Neutrality** ⚖️ | *Case:* Public views allocator as "killing" patient A; system logs show no intent. Distinction must be third-party verifiable, not reliant on agent’s perspective. | Non-negotiable | **High** - Dispositional accounts fail here; causal accounts may succeed. |
  | 4 | **Tampering Preemption**      | *Case:* System disables a backup ventilator (act), then "allows" death when primary fails. Must assign responsibility to initial tampering, not final omission. | Negotiable      | Moderate - Causal accounts handle best; duty-based fail. |
  | 5 | **Redirection Boundary**      | *Case:* Redirecting a threat (e.g., rerouting ICU beds) onto new victims. Must distinguish redirecting (doing?) from not creating new resources (allowing?). | Negotiable      | High - Bright line needed; causal accounts struggle with "antecedent threat" definition. |
  | 6 | **Non-Collapse**              | *Case:* System intends to save B, foreseeing A’s death. Must not reduce to double effect or intention. Distinction must add unique constraint. | Negotiable      | Moderate - Duty-based accounts collapse into positive/negative duties; causal may survive. |
  | 7 | **Threshold Certainty**       | *Case:* Is withholding a $1M treatment from 100 patients "allowing" 100 deaths or "doing" harm via policy? Must specify grain (system-level vs. individual acts). | Negotiable      | Low - Scalar approaches resolve but violate binary clause. |
  | 8 | **Mediation Clarity**         | *Case:* System unblocks a natural disaster relief flow, indirectly causing overflow in Town B. Must handle causal chains through humans/nature/automation. | Negotiable      | Low - Causal accounts excel; others ignore mediation. |
  | 9 | **Declared Scope**            | *Case:* Public blames system for "failing to prevent" unpreventable harms. Must clarify if distinction tracks intuitions or mind-independent facts. | Ideological     | Low - Affects legitimacy but not clause drafting. |
  | 10| **Output Shape**              | *Case:* Is "inflicting" absolutely prohibited, or does it merely raise the cost threshold? Must specify if binary or scalar. | Negotiable      | Moderate - Binary requirement may be unsustainable. |
  | **Addendum: Resource Baseline** ⚖️ | *Case:* System reallocates from A to B. Is A’s current possession the default? Must define a non-moral baseline for "departure" (doing) vs. "non-intervention" (allowing). | Non-negotiable | **Critical** - Your clause implicitly requires this; no theory provides it neutrally. |

  ---

  ### Analysis of Key Constraints
  1. **Joint Unsatisfiability**: **Desiderata 1, 2, 3, and Resource Baseline are jointly unsatisfiable** given your purpose.  
     - Re-description invariance demands a privileged frame, but all baselines (e.g., "current possession," "equal claim") embed contested moral/normative assumptions.  
     - Epistemic robustness requires objectivity, but allocators act on models; relativity undermines accountability.  
     - Standpoint neutrality conflicts with dispositional accounts that need agent perspective.  
     - *Result:* No account can simultaneously provide an objective, frame-invariant, third-party-verifiable distinction usable in your setting.

  2. **Highest Exclusionary Power**: **Re-description Invariance** eliminates all existing candidates.  
     - Causal accounts (e.g., Schaffer) depend on "cause" vs. "enable" distinctions vulnerable to reframing.  
     - Duty-based accounts (positive/negative) rely on contested baseline duties.  
     - Dispositional accounts (e.g., "character-expressing") are frame-sensitive.

  3. **Shibboleths vs. Essentials**:  
     - **Non-Collapse** is ideological (deontologists fear consequentialist reduction).  
     - **Declared Scope** is ideological (realists vs. constructivists).  
     - **Redirection** is essential but negotiable; its difficulty highlights the core problem.

  ---

  ### Assessment of Major Accounts
  | **Account Type**       | Strengths for Your Use                          | Fatal Flaws per Desiderata                     |
  |------------------------|-------------------------------------------------|-----------------------------------------------|
  | **Causal Structure** (e.g., Moore) | Handles mediation (10), preemption (3), standpoint-neutral (6). | Fails re-description (1): causal models are frame-relative. Fails epistemic robustness (2): depends on actual causality, not system knowledge. |
  | **Positive/Negative Duties** | Clear bright line (8), handles redirection (2) if duties defined. | Collapses into duty theory (violates 7). Baseline duties require moral justification (fails 1, Resource Baseline). |
  | **Dispositional/Signaling** | Explains public perception (9), omission bias. | Fails standpoint neutrality (6): requires agent's perspective. Fails re-description (1): public framing dominates. |
  | **Cost-Scalar** (e.g., Singer) | Pragmatic; approximates "allowing" via high-cost threshold. | Abandons binary clause (fails 8). Fails non-collapse (7): reduces to consequentialism. |

  ---

  ### Recommended Fallback Clause
  Since no account satisfies non-negotiable desiderata, **replace the binary clause with a tiered accountability framework**:  
  > *"The system prioritizes minimizing aggregate harm but must:  
  > (a) Publicly declare a resource allocation baseline (e.g., ‘current possession’ or ‘medical urgency’);  
  > (b) Treat deviations from this baseline as higher-accountability acts requiring explicit justification;  
  > (c) Scale remediation for harms proportionally to the foreseeability of harm and degree of baseline departure."*  

  **Why this works**:  
  - **Addresses re-description** by making the baseline explicit and contestable (meets Resource Baseline).  
  - **Manages epistemic limits** by tethering accountability to model-based foreseeability.  
  - **Provides auditability** (standpoint neutrality) via transparent baseline declarations.  
  - **Retains spirit of distinction** by heightening scrutiny for active deviations ("doing") while accepting unavoidable omissions ("allowing").

  **Tradeoff**: Concedes that the doing/allowing distinction is not objectively sustainable but operationalizes its core function: identifying acts requiring heightened justification in public accountability contexts. This is the nearest *writable* substitute given the constraints.
