prompt: |-
  I attend a journal club run jointly by our philosophy department and the evolutionary biology group, and last week we read a paper arguing that the human chin is a non-adaptive byproduct of the remodelling of the face and jaw under a softer diet and reduced masticatory stress. The discussion afterwards turned almost entirely into an argument between two of the regulars — Inês, who works on developmental biology, and Tomás, who is writing a thesis on the history of the adaptationist debates — and I found myself unable to judge it, partly because I suspect they were talking past each other and partly because I am not sure which of them has the better of the terminology.

  The exchange ran roughly as follows. (1) Inês said the chin is a textbook spandrel: nobody has produced evidence that it was shaped by selection, and the whole point of Gould and Lewontin's paper was to break the habit of assuming every feature comes with an adaptive story, so if a feature was not selected for, calling it a spandrel is precisely what the paper tells us to do. (2) Tomás said that is a misuse of the term, and a costly one: on the paper's own picture the surfaces in the basilica are spaces that arise necessarily from the geometry of the primary structures — the roughly triangular areas between the arches and the dome resting on them — which the mosaicists then filled with decoration, so non-adaptivity is necessary but nowhere near sufficient for a spandrel, which must be a byproduct of the form of something else. He added that Gould himself later grew irritated by the loose usage and pointed instead to exaptation, the term he and Elisabeth Vrba introduced in 1982 to replace the teleologically loaded "preadaptation", for features co-opted to a use they were not built for. (3) Inês replied that the architecture is an illustrative image rather than a definition, and that the paper's own methodological advice — begin from the alternative hypothesis that a given feature may not be a direct adaptation at all but a consequence of some other feature — makes non-adaptation the default, in which case "spandrel" simply names the default and needs no further gloss. (4) Tomás said that if the word means nothing more than "not shaped by selection", it is redundant with a set of quite distinct causes the paper itself canvassed, among them random drift, phylogenetic inertia and developmental or allometric constraints, and that its value lies in singling out one detectable kind of cause: features that follow from the design of the whole. (5) Inês conceded the distinction but called it idle in this instance, since what really divides them is empirical — the adaptationists have their sexual-selection and speech stories, she has the absence of evidence for any of them — and terminological policing lets the other side leave the burden of proof where it does not belong. (6) Tomás answered that a strict notion cuts both ways, because it obliges the non-adaptationist to name the primary structures and show that the feature follows from them, rather than merely failing to find a function. (7) Inês rejoined that the strict reading therefore buys nothing, since the analogy is architecturally wrong in the first place: the relevant surfaces at San Marco are pendentives, which are three-dimensional, load-bearing and chosen by the builders from among alternatives, which is why Dennett argued in *Darwin's Dangerous Idea* that they are not spandrels even in the extended sense — a criticism the architectural historian Robert Mark pushed back on by insisting the builders had very little real freedom.

  Could you referee this move by move? I am not after a summary of the spandrels debate, and I do not want a bibliography — I want your own reasoning about the arguments as these two actually made them, on the assumption that I know the general controversy but have not read the primary literature closely. Please organise your answer in these sections, in this order: **Bottom line** (up to 100 words: who has the better of it overall, and what the chin should properly be called if either label is apt); **The terrain** (about 150 words: the two competing readings of "spandrel", plus the adjacent distinctions the exchange depends on, such as exaptation and the difference between adaptationism as a research programme and adaptationism as a claim about how often selection actually shapes traits); **Move-by-move** (the bulk, roughly 800 words: take moves (1) to (7) in order, rate each on a scale from clearly mistaken through partly right to clearly right, justify each rating, and flag any move that is right for the wrong reason); **What both of them missed** (about 250 words); and **Where I would take it next** (about 120 words: the single question I should put to the group at the next session that would genuinely help settle the chin case rather than the verbal one).
reasoning: |-
  Okay, let me unpack this fascinating journal club debate. The user presents a nuanced philosophical-biological dispute about whether the human chin qualifies as a spandrel, with Inês and Tomás representing opposing interpretations of Gould and Lewontin's famous concept. 

  First, I need to dissect the core disagreement: Inês advocates for a broad definition where "spandrel" means any non-adaptive byproduct, while Tomás insists on a strict architectural analogy requiring the feature to be a necessary geometric consequence of primary adaptations. Their moves reveal deeper tensions - about burden of proof, evidentiary standards, and whether terminology should drive or follow empirical work.

  The user's request is unusually structured and precise. They clearly know the broader literature but want focused arbitration of this specific exchange. Their frustration with the "talking past each other" aspect suggests they need help untangling conceptual vs empirical layers. Interesting how they explicitly reject bibliography requests - this is about reasoning, not citations.

  For the bottom line: Tomás' stricter definition seems more coherent with Gould's later clarifications, but both oversimplify. The chin likely combines constraints and drift rather than fitting neatly into either "spandrel" or "adaptation" boxes. 

  On the terrain: Must distinguish between (a) spandrel-as-necessary-byproduct (Tomás) vs spandrel-as-any-non-adaptive-trait (Inês), plus adjacent concepts like exaptation. Crucially, adaptationism isn't monolithic - methodological vs empirical claims matter here. Inês conflates absence of evidence with evidence of absence.

  For move-by-move: Inês' first move overextends "spandrel" to mean all non-adaptations, misreading Gould-Lewontin. Tomás correctly notes non-adaptivity is insufficient, but his architectural purity may be overstated. Their later moves reveal Inês' valid concern about burden-shifting, though Tomás has a point about needing positive evidence for byproducts.

  What both missed: The developmental biology! Chin formation involves complex mandibular symphysis remodeling where selection could act on correlated traits. Also, "non-adaptive" isn't binary - the chin might be an exaptation now even if originally a byproduct.

  For next steps: Instead of rehashing definitions, I'd ask: "What specific developmental constraints or allometric patterns in hominin facial reduction would necessarily produce a protruding chin, and how would we test if selection later acted on it?" This forces concrete biological mechanisms over labels.
answer: |-
  ### Bottom line
  Tomás has the better argument overall. Strictly defined, "spandrel" requires a feature to be a *necessary byproduct* of structural constraints or other adaptations, not merely non-adaptive. The chin likely fits "non-adaptive byproduct" but lacks evidence of being a *geometric necessity* from primary adaptations. Neither "spandrel" nor "adaptation" cleanly applies here; it's better termed a **developmental or allometric byproduct** of facial reduction under relaxed selection. Inês conflates non-adaptation with spandrels, while Tomás correctly insists on causal specificity but overlooks empirical nuance.

  ---

  ### The terrain
  The debate hinges on two readings of "spandrel":  
  - **Broad (Inês):** Any non-adaptive feature lacking evidence of selection. "Spandrel" becomes synonymous with non-adaptive byproduct, prioritizing methodological skepticism.  
  - **Strict (Tomás):** A feature arising *necessarily* from architectural constraints (e.g., dome-arch junctions), making non-adaptation necessary but insufficient. Value lies in identifying *causal dependence* on primary structures.  

  Adjacent distinctions:  
  - **Exaptation:** A feature co-opted later for a new function (e.g., feathers for flight vs. insulation).  
  - **Adaptationism:** As a *heuristic* (assume selection until disproven) vs. an *empirical claim* (selection dominates evolution). Inês attacks the former; Tomás defends precise terminology to test the latter.  

  ---

  ### Move-by-move  
  **(1) Inês: "Textbook spandrel" via non-adaptation**  
  *Rating: Partly right (for the wrong reason)*  
  She correctly notes the chin lacks evidence for selection and that Gould-Lewontin opposed adaptationist defaults. But she conflates "non-adaptive" with "spandrel." The paper *distinguishes* spandrels (byproducts of constraints) from drift or constraints. Calling it "textbook" ignores the architectural analogy’s core.  

  **(2) Tomás: Spandrels require geometric necessity**  
  *Rating: Clearly right*  
  He accurately dissects the analogy: spandrels are *inevitable* byproducts (e.g., dome-arch triangles), not just non-adaptive traits. His exaptation footnote is apt (Gould/Vrba 1982) and shows Gould’s own frustration with loose usage.  

  **(3) Inês: Analogy as illustration; non-adaptation as default**  
  *Rating: Partly right but misleading*  
  The image *is* illustrative, but the paper defines spandrels as byproducts of "necessary architectural design." Non-adaptation isn’t the paper’s "default"—it lists *multiple* non-adaptive alternatives (drift, constraints). "Spandrel" specifically denotes dependency.  

  **(4) Tomás: Strictness avoids conflation**  
  *Rating: Clearly right*  
  He correctly identifies redundancy if "spandrel" = all non-adaptations. The term’s value is specifying *byproducts of design*, distinct from drift or constraints. This precision aids hypothesis-testing.  

  **(5) Inês: Terminology distracts from empirical burden**  
  *Rating: Partly right*  
  She’s right that adaptationists often shift the burden of proof. However, calling Tomás’ distinction "idle" ignores that *his* framework forces non-adaptationists to provide positive evidence (e.g., "What structure caused the chin?"), not just negative arguments.  

  **(6) Tomás: Strictness imposes positive burden**  
  *Rating: Clearly right*  
  Requiring non-adaptationists to name the "primary structure" (e.g., facial reduction) and demonstrate necessity (e.g., allometric constraints) strengthens their case beyond "no function found." This is how spandrels are falsifiable.  

  **(7) Inês: Architectural analogy is flawed**  
  *Rating: Partly right but irrelevant*  
  Pendentives vs. spandrels is a valid critique (Dennett/Mark). Yet Gould-Lewontin’s *biological* point stands: spandrels represent *features arising predictably from developmental/structural necessities*. The analogy’s architectural accuracy is secondary to this conceptual core.  

  ---

  ### What both of them missed  
  Four key oversights:  
  1. **The chin’s developmental complexity:** The chin arises from interactions between dental/alveolar reduction and mandibular symphysis fusion. It may be a byproduct of *multiple* constraints (e.g., speech adaptations, dietary shifts), not a single "primary adaptation."  
  2. **Exaptation potential:** Even if initially a byproduct, the chin *could* be exapted (e.g., social signaling). Tomás notes exaptation but doesn’t apply it; Inês ignores it.  
  3. **Non-adaptation isn’t binary:** Traits can exist on a spectrum. The chin might be *marginally* adaptive (e.g., resisting mechanical stress) while primarily a byproduct—neither pure spandrel nor adaptation.  
  4. **Gould-Lewontin’s target:** Their paper attacked *pan-adaptationism*, not adaptation per se. Insisting on "spandrel or not" risks repeating the error by forcing discrete categories. The chin exemplifies why evolution often involves constraint-driven forms with *later* functional tinkering.  

  ---

  ### Where I would take it next  
  **Question for the group:**  
  *"What specific developmental constraints (e.g., allometric scaling, heterochrony) or structural necessities in hominin facial evolution would* necessarily *produce a protruding chin, and how could we test if selection later acted on it?"*  

  **Why this helps:**  
  - Forces engagement with *mechanisms* beyond labels.  
  - Tests Tomás’ strict spandrel criteria: Is the chin a *predictable* byproduct?  
  - Addresses Inês’ empirical concern: If no necessity is shown, "byproduct" may still hold, but not "spandrel."  
  - Opens exaptation pathways (e.g., biomechanical stress tests on chinned vs. chinless models).
