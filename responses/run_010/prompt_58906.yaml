prompt: |-
  I cover science and research policy for a magazine, and over the years I've built up a pile of judgments about when it's rational to keep pouring money into something you've already poured money into. My editors think I'm inconsistent. I suspect they're right, but I want to know exactly where.

  Here's the list.

  1. Half-built stadium, anchor team leaves town. $900M already spent, $400M to finish, and finishing will lose money every year after that. Scrap it. The $900M is just gone and pretending otherwise is how cities wreck themselves.

  2. Expedition, six weeks of fixing rope and burning supplies, summit push turns around at 2pm with weather closing in. Descend, obviously. Here "we've come this far" is literally the sentence that kills people, and I want whatever principle I end up with to say that loudly.

  3. Two non-refundable tickets to two trips, I'd enjoy the cheaper one more. Go on the one I'd enjoy more. What something cost me is not a reason.

  4. Light rail in a city I cover. First segment built for $900M, ridership half of what was promised. Extension costs $400M and, evaluated by itself, would lose money — but segment one also loses money alone, and the two together roughly break even. Extend. Very confident about this one.

  5. A lab gets a ten-year, $10M grant tied to one specific long-shot program. Six years in, an easier project with better expected payoff appears. Stick with the program.

  6. Same lab, same six years, same alternative — except they funded it out of their own overhead. No promises made, nobody to answer to, no one will ever know. I still feel they should stick with it. I know how that sounds. I feel it anyway.

  7. A researcher who's spent 25 years defending a theory that's now clearly losing. She shouldn't just migrate to whatever's winning; she should first go back and check whether the anomalies that pulled her into the thing have actually been answered. Walking away from that reads to me like a betrayal of her earlier reasons, not just of her earlier self.

  8. A researcher who's spent 25 years perfecting a technique that a cheap new method just made obsolete. Switch overnight. I'd think less of her if she didn't.

  9. Hypocrisy data. When my editor killed an investigation I'd put 18 months into, I was furious and wrote a memo about the value of long reporting. Two years later I killed my own book project — same shape, comparable time sunk — after about four minutes of thought, and I don't regret it at all.

  My tentative principle, which I'm sure its broken somewhere: past costs count only where they've changed the forward-looking situation — by creating obligations (5), by making the remaining pieces complements (4), or by leaving you holding evidence or judgment nobody else has (7, and 8 as the negative case). Bare "we've already spent it" gets zero weight (1, 2, 3).

  Where it visibly struggles: 6, where nothing has changed except the money; and 9, where the same person got opposite treatment depending on who was holding the pen.

  So: is there a principle, or a small set of them, that gets all or most of these? State it precisely enough that I could hand it to a junior reporter and get the same verdicts back, and tell me which case is doing the work for each clause. Then run it on three I haven't given you a verdict on — a fifth-year grad student whose method stopped working halfway through the dissertation; a space mission extended after its target turned out to be much less interesting than hoped; a family that refuses to sell a house they badly overpaid for. And be blunt about which of my verdicts the best version of the principle forces me to give up. If the answer is that 6 or 9 just has to go, say so — and then tell me why I find them compelling anyway, because that part I'd actually like explained.
reasoning: |-
  Okay, the user is a science journalist who's developed intuitive judgments about when to continue or abandon funded projects but feels inconsistent. They've listed nine scenarios with their verdicts and proposed a principle centered on past costs only mattering if they alter future conditions. The core challenge is reconciling cases like #6 (self-funded lab project) and #9 (personal hypocrisy) where their principle falters.

  Hmm, their examples reveal deeper tensions between rationality and human psychology. The stadium case (#1) is pure sunk cost fallacy, while the light rail extension (#4) shows system interdependence. But why does the self-funded lab project (#6) feel ethically different from the grant-bound one (#5)? And why the visceral reaction to the theorist abandoning her original anomalies (#7) versus swiftly ditching obsolete methods (#8)? 

  Ah! The unifying thread might be about epistemic responsibility. In #7, the researcher owes it to her past self (and science) to verify if foundational questions were resolved, whereas #8's technique is purely instrumental. Similarly, #6 feels compelling because privately diverted funds create a moral debt to the original research vision, even without formal obligations. 

  For the hypocrisy case (#9), the apparent contradiction stems from agency: when killing someone else's work, you demand justification for their sunk effort; when abandoning your own, you have privileged knowledge of diminishing returns. Both stances are rational from different vantage points.

  Testing this on their new cases: the grad student should pivot methods (like #8), the space mission should continue only if operational costs enable new science (like #4), and the family clinging to their house is textbook sunk cost fallacy (like #1). 

  The principle needs refinement around moral/informational debts. Key insight: "sunk costs" aren't always sunk if they've generated unique obligations or insights. But they must surrender verdict #6 if no such debt exists—though their discomfort there reveals how personal investment biases us.
answer: |-
  Here’s a unified principle derived from your cases, designed to handle inconsistencies and provide clear guidance:

  ### **The Forward Accountability Principle**
  *"Past investments justify continued commitment only if they create one of three forward-facing conditions:*
  1. **Binding Commitments:** *Legally or ethically owed to others (e.g., grants, contracts, promises).*
  2. **Strategic Interdependence:** *Where partial completion creates complementary value (e.g., network effects, shared infrastructure).*
  3. **Unique Epistemic Position:** *Where sunk effort generates irreplaceable expertise/data to resolve core questions.*  
  *All other sunk costs are irrelevant. Future decisions require independent cost-benefit analysis."*

  ---

  ### **Applied to Your Cases**
  | Case | Verdict | Principle Clause | Why It Works |
  |------|---------|------------------|-------------|
  | 1. Stadium | Scrap | *None* | No future benefit; sunk costs irrelevant. |
  | 2. Expedition | Descend | *None* | "Come this far" ≠ valid reason; future risk dominates. |
  | 3. Vacation | Cheaper trip | *None* | Cost paid ≠ enjoyment; pure sunk cost fallacy. |
  | 4. Light Rail | Extend | **Strategic Interdependence** | Segments are complementary; system viability requires both. |
  | 5. Grant-bound lab | Stick | **Binding Commitment** | Grant terms create obligation to funder. |
  | 6. Self-funded lab | *Revise to: Switch* | *None* | No binding commitment or epistemic debt; sunk costs irrelevant. |
  | 7. Theory defender | Re-examine anomalies | **Unique Epistemic Position** | 25 years create duty to resolve original questions only *she* can judge. |
  | 8. Obsolete technique | Switch | *None* | No unique epistemic value; better alternatives exist. |
  | 9. Hypocrisy data | *Inconsistent → Resolved* | **Agency & Epistemic Position** | Killing others' work demands due process (their epistemic effort). Killing your own leverages your superior judgment of diminishing returns. |

  ---

  ### **Forced Revision: Case #6**
  Your verdict ("stick with it") **must be abandoned**. The principle clarifies that self-funded projects lack *binding commitments* or *unique epistemic debt* to the original goal. Switching maximizes future value. Your discomfort stems from **effort-justification bias** (overvaluing work because you did it), but the principle overrules this.

  ---

  ### **New Case Verdicts**
  1. **Grad student (5th year, method fails):**  
     - **Switch methods.**  
     - *Why?* No binding commitment (PI/advisors can approve change), no strategic interdependence (dissertation chapters can be independent), no unique epistemic debt (if method is dead, persisting won’t resolve core questions).  

  2. **Space mission (extended after boring target):**  
     - **Continue only if operational costs enable new science.**  
     - *Why?* If existing instruments can pivot to study *other* targets at low marginal cost (**Strategic Interdependence**), continue. If not, cancel—sunk costs are irrelevant.  

  3. **Family overpaying for house:**  
     - **Sell if costs exceed benefits.**  
     - *Why?* Purchase price is sunk. Future costs (mortgage/taxes) vs. benefits (utility/market value) decide. Emotion ≠ valid reason under the principle.

  ---

  ### **Why #6 and #9 Felt Compelling**
  - **Case #6 (Self-funded lab):**  
    You’re conflating *personal effort* with *moral obligation*. Humans instinctively view self-invested resources as "sacred" (psychological ownership). But rationally, only external promises or unique insight creation justify commitment.  
    - *Fix:* Ask: "If a stranger inherited this project, would they continue?" If yes, it’s valuable; if no, it’s sunk cost.  

  - **Case #9 (Hypocrisy):**  
    You applied **asymmetric epistemic standards**:  
    - When *your* work was killed, you demanded recognition of *your* unreplicable insight (Unique Epistemic Position).  
    - When *you* killed your work, you trusted *your* judgment of futility.  
    This is consistent! The principle validates both if framed as: *"Decision-makers must weigh the epistemic debt owed to creators, but creators may overrule their own sunk effort with superior context."*  

  ---

  ### **Final Principle (Junior Reporter Version)**
  > **1. Ignore past money/time spent.**  
  > **2. Ask: Does quitting break a promise, wreck a system, or abandon unanswered questions only I can resolve?**  
  > *   **YES → Keep going.**  
  > *   **NO → Quit unless future benefits > future costs.**  

  This passes your test cases cleanly, forces surrender of #6, and explains #9’s "hypocrisy" as rational context-switching.
