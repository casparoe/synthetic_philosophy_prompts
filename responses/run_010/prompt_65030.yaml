prompt: |-
  I direct the analysis unit of a state resilience fund that commits roughly $400 million a year to long-horizon risk-reduction work: surge barriers, grid hardening, pathogen surveillance, and a small number of speculative hedges. Our enabling statute requires that every proposal be scored by its expected net benefit in dollars, and that the board rank proposals by that score. Two features of the work have started to break that mandate.

  First, our outside modelers increasingly deliver scenario tables in which payoffs grow geometrically while scenario probabilities decay geometrically, so the products never shrink. Second — and this is the part our counsel cares about — the ordering of the rows in those tables is a bookkeeping artifact. In one recent submission the scenarios were sorted by a consultant's internal identifier; sorting the identical table by payoff magnitude instead changed the reported expected value dramatically. Counsel reads our charter as requiring that a proposal's score be invariant to how an analyst enumerates or groups its scenarios, on the grounds that two enumerations of the same table describe the same proposal and cannot be scored differently.

  So I need a documented procedure that (a) tells a junior analyst with no measure theory, working from a spreadsheet, whether a given table has a well-defined expectation at all; (b) if it does, how to compute and defend it; (c) if it does not, what to record, what to do with the proposal, and at which point the question stops being analytical and goes to a person; and (d) survives the obvious audit question, which is why two structurally identical tables are scored differently. For context on the operating conditions: the board meets quarterly and sees about forty proposals a cycle, so triage has to take an analyst twenty minutes or less per proposal; the Chief Risk Officer signs off on the scoring memo; and questions of value rather than fact go to a standing values committee of three board members, which meets monthly.

  You are a decision theorist who has done this translation work before. You know the literature on games with infinite, divergent, and genuinely undefined expectations — the St. Petersburg family, its alternating-sign successor the Pasadena game, and the further constructions in which the positive part and the negative part of the payoff distribution each diverge — and you also know that almost none of it has ever been operationalized inside an institution that has to publish a number. Work carefully. Before drafting, think through privately which candidate remedies would break on which tables: capping payoffs, applying a discount rate, truncating the tail, reporting an interval-valued score, comparing by dominance only, restricting to "natural" orderings. Let that deliberation determine the structure of what you deliver, but do not show it, except insofar as it shapes the final section. Define every technical term at first use in language a bright non-specialist can follow. I do not want references or a reading list — I want something my analysts can run and something counsel can defend.

  Please structure your answer in exactly these sections, in this order:

  1. **Design constraints** (~150 words). The requirements the procedure must satisfy, including the invariance requirement and the statutory demand for a single dollar figure, and the precise point at which they conflict.
  2. **The triage test** (~300 words). The concrete quantities an analyst computes from the scenario table, in order, to sort every proposal into one of a small number of classes — well-defined and finite; infinite with a determinate sign; genuinely undefined; and any further class you need. It must be executable in a spreadsheet without measure theory, it must terminate, and it must say what to do when the modeler supplies a continuous distribution rather than a list of scenarios.
  3. **The decision procedure** (~700 words). Numbered steps keyed to the classes from section 2: what to score, what to write into the memo, what counts as a sufficient justification at each step, where the procedure stops with a no, where it stops with a refusal to rank, and exactly which steps hand the decision to the values committee instead of resolving it analytically.
  4. **Why invariance does most of the work** (~400 words). The theoretical rationale, including what specifically goes wrong if analysts are permitted to order scenarios by magnitude or to group them in pairs, and why absolute convergence rather than convergence is the correct gate.
  5. **Worked cases** (~900 words). Run the procedure end to end on the three proposals below, showing the numbers an analyst would compute at each step and the resulting board treatment. Verify or correct the headline figure the sponsoring team reports in case C.
  6. **What the procedure cannot do** (~300 words). Its failure modes, the proposals it will misclassify, and the places where a step that looks like computation is really a judgment call wearing a procedure's clothes.

  The three proposals, all competing for the same tranche:

  **A. Harbor Reach.** A conventional surge-barrier and pump program. All payoffs are bounded and cost is already netted out: net benefit of $900 million with probability 0.05, $150 million with probability 0.25, and −$40 million (overrun with no protection benefit) with probability 0.70.

  **B. Cascade Facility.** A reinsurance-style instrument we would purchase for a $50 million premium. The counterparty's own tail model, discretized into scenarios indexed n = 1, 2, 3, …, assigns scenario n probability 2^(−n) and net payoff after premium of $1 million × 2^n. There are no loss scenarios.

  **C. Ledger Swap.** A hedged position in which scenario n has probability 2^(−n) and net payoff of $1 billion × 2^n / n, positive for odd n and negative for even n. The sponsoring team reports a headline expected net benefit of roughly $690 million, obtained by summing the products in increasing order of n.

  For case C in particular, tell me how the procedure ranks it against A and against B, and what it publishes, given that the statute demands one figure. I expect the result to be one the sponsoring team will contest, and I want the procedure to hold up when they do. Close section 5 with one or two sentences saying what argument would convince me to abandon the invariance requirement — that is, what case there could be for privileging the natural enumeration after all.
reasoning: |-
  We are given three proposals to analyze. We need to develop a procedure that satisfies the design constraints, especially the requirement that the expected value is invariant to the ordering of scenarios. 

  The key insight from decision theory is that for an expected value to be well-defined (and not depend on the order of summation), the series must be absolutely convergent. Absolute convergence means that the sum of the absolute values of the payoffs (each weighted by its probability) converges. If it does, then the series converges to the same value regardless of rearrangement. If not, then the series may converge conditionally (so that by rearranging the terms we can get any sum we want) or diverge.

  Our triage test will focus on absolute convergence. The procedure will have the following classes:
  1. **Well-defined and finite**: The series of absolute payoffs converges (so the expectation is finite and invariant).
  2. **Infinite with a determinate sign**: The series of absolute payoffs diverges, but the payoffs are all non-negative (so the expectation is +∞) or all non-positive (so the expectation is -∞). In these cases, the sign is invariant even though the magnitude is unbounded.
  3. **Genuinely undefined**: The series of absolute payoffs diverges and the payoffs change sign infinitely often, so that the expectation can be rearranged to any real number or even to diverge in either direction.

  We also note that if the modeler supplies a continuous distribution, we require that they discretize it into a scenario table. The procedure must specify how to do that in a way that is consistent and invariant, but we are not given that. However, since the problem states that the outside modelers deliver scenario tables, we assume we have discrete scenarios. For continuous distributions, we would require a discretization that respects the absolute integrability (i.e., the absolute value of the payoff must be integrable). But for simplicity, we focus on discrete.

  Now, let's structure the answer as requested.

  ---

  **1. Design constraints**

  The procedure must compute a single dollar figure for expected net benefit, as required by statute. The core constraint is invariance: the score must not depend on the order or grouping of scenarios. This requirement conflicts with the fact that some scenario tables have payoffs that grow geometrically while probabilities decay geometrically, leading to divergent series. When the series of absolute payoffs diverges, rearranging scenarios can change the computed expectation arbitrarily (as in the Pasadena game). The procedure must resolve this conflict by identifying when the expectation is well-defined (i.e., absolutely convergent) and when it is not. In the latter case, it must either assign a score that is invariant (like +∞, -∞, or "undefined") or escalate to a committee. The procedure must be executable by junior analysts in a spreadsheet within 20 minutes per proposal and must handle both discrete scenario tables and continuous distributions (via discretization).

  **2. The triage test**

  The analyst receives a scenario table: a list of scenarios, each with a probability (positive and summing to 1) and a net payoff. The test has four steps:

  1. **Check for bounded payoffs**: If all payoffs are bounded (i.e., lie within some fixed finite interval), then the expectation is well-defined and finite. Compute it by summing the products of probability and payoff. (This covers Proposal A.)

  2. **Check for one-signed payoffs**: If the payoffs are all non-negative or all non-positive, then even if the expectation is infinite, the sign is well-defined. Compute the sum of the absolute values of the payoffs multiplied by their probabilities. If this sum diverges (which can be checked by seeing if the partial sums grow without bound as scenarios are added in any order), then the expectation is either +∞ (if non-negative) or -∞ (if non-positive). (This covers Proposal B.)

  3. **Check for absolute convergence**: For tables with both positive and negative payoffs, compute the sum of the absolute values of the payoffs multiplied by their probabilities. If this sum converges (i.e., the partial sums stabilize to a finite number as scenarios are added in any order), then the expectation is well-defined and finite. Compute the expectation by summing the products of probability and payoff (order does not matter). If the absolute sum diverges, then the expectation is undefined. (This step requires that the analyst can compute the absolute sum and see if it converges. In practice, for a spreadsheet, they would add scenarios until the absolute sum stops changing significantly. If it grows without bound, it diverges.)

  4. **Handling continuous distributions**: If the modeler provides a continuous distribution, require that they discretize it into a scenario table that is sufficiently fine to capture the behavior of the tails. The discretization must be done in a way that the absolute integral of the payoff is approximated. Then apply steps 1-3.

  The triage test sorts proposals into:
  - Class 1: Well-defined and finite (step 1 or step 3 with convergence).
  - Class 2: Infinite with a determinate sign (step 2).
  - Class 3: Genuinely undefined (step 3 with divergence and mixed signs).

  **3. The decision procedure**

  1. **Class 1 (Well-defined and finite)**:
     - Compute the expected value by summing (probability * payoff) over all scenarios.
     - Report this figure as the expected net benefit.
     - Justification: "The expectation is absolutely convergent and therefore invariant to scenario ordering. The computed value is the unique expected net benefit."
     - This is the normal case and requires no escalation.

  2. **Class 2 (Infinite with a determinate sign)**:
     - If the payoffs are non-negative and the absolute sum diverges, report +∞. If non-positive, report -∞.
     - Write in the memo: "The expectation is positive (or negative) infinite. This is invariant to scenario ordering because the payoffs are all of the same sign."
     - The proposal is then ranked accordingly: +∞ is the highest possible, -∞ the lowest.
     - No escalation to the values committee because the sign is invariant.

  3. **Class 3 (Genuinely undefined)**:
     - Do not compute an expected value.
     - Record: "The expectation is undefined because the series of absolute payoffs diverges and the payoffs change sign infinitely often. Therefore, the expected value depends on the order of summation and is not invariant."
     - The proposal cannot be scored by the statutory method. The procedure stops with a "no" for automated scoring.
     - Escalate to the values committee, with a note: "The proposal's expected net benefit is undefined by the statutory scoring method. The values committee must decide whether to reject the proposal, rank it by an alternative method, or send it back for restructuring."

  4. **Handling continuous distributions**: If the modeler provides a continuous distribution, the analyst must require a discretized scenario table. If the modeler refuses, the proposal is escalated to the values committee with a note about failure to provide required information.

  5. **Termination**: The procedure always terminates because the triage test is a finite computation (in practice, the analyst will stop when the partial sums for absolute convergence do not change beyond a tolerance, or when it is clear they are growing without bound). For tables with a very large number of scenarios, the analyst may use a sampling method that respects the probability distribution (like importance sampling) but must ensure that the absolute sum converges.

  6. **Escalation to values committee**: Only Class 3 proposals and cases of continuous distributions that cannot be discretized appropriately go to the committee. The committee meets monthly and decides on alternative ranking methods (e.g., by dominance, by truncating the tail at a certain point, or by applying a discount rate) or rejects the proposal. The analyst's memo must clearly state why the automatic scoring failed.

  **4. Why invariance does most of the work**

  The requirement of invariance (that the score must not change if we reorder or regroup scenarios) forces us to require absolute convergence. Without absolute convergence, the Riemann rearrangement theorem tells us that a conditionally convergent series (one that converges but not absolutely) can be rearranged to sum to any real number, or to diverge. This is unacceptable because two analysts could produce different scores from the same scenario table by merely sorting differently. Grouping scenarios in pairs (which is a form of regrouping) would also change the sum arbitrarily. 

  Absolute convergence is the condition that the sum of the absolute values of the terms (here, |payoff| * probability) converges. When this holds, the series is immune to rearrangement. When it fails and the payoffs are one-signed, the sign is invariant. But when it fails and the payoffs change sign infinitely often, there is no invariant expectation. 

  Thus, absolute convergence is the correct gate. It ensures that the expectation we compute is the same no matter how the modeler presents the scenarios.

  **5. Worked cases**

  **Proposal A: Harbor Reach**

  - Triage test: All payoffs are bounded: $900M, $150M, -$40M. So Class 1.
  - Decision procedure: 
     - Expected value = (0.05 * 900) + (0.25 * 150) + (0.70 * -40) = 45 + 37.5 - 28 = 54.5 million dollars.
  - Report: $54.5 million.

  **Proposal B: Cascade Facility**

  - Scenarios: n=1,2,3,... with probability p_n = 2^{-n} and payoff = 1e6 * 2^n (net after $50M premium).
  - Payoffs are all positive. Check absolute convergence: the absolute payoff in scenario n is 1e6 * 2^n, so the absolute sum is sum_{n=1}^∞ [2^{-n} * 1e6 * 2^n] = sum_{n=1}^∞ 1e6. This is a divergent series (it's 1e6 times the harmonic series for the constant 1, but note: 2^{-n} * 2^n = 1, so the absolute term for each n is 1e6). The sum of 1e6 over infinitely many terms is infinite. Therefore, the absolute sum diverges. But since the payoffs are all positive, it is Class 2 (infinite with a determinate sign: positive).
  - Decision procedure: Report +∞.
  - The headline: infinite expected net benefit.

  **Proposal C: Ledger Swap**

  - Scenarios: n=1,2,3,... with probability p_n = 2^{-n} and payoff = 1e9 * (2^n / n) * (-1)^{n+1} [positive for odd n, negative for even n]. Specifically, for n odd: positive, n even: negative.
  - The sponsoring team reports $690 million by summing in order of n.

  We must apply the triage test.

  First, check absolute convergence: The absolute payoff in scenario n is 1e9 * (2^n / n). The absolute term is: p_n * |payoff| = 2^{-n} * 1e9 * (2^n / n) = 1e9 / n. The series of absolute terms is sum_{n=1}^∞ 1e9 / n, which is the harmonic series scaled by 1e9. This diverges. Therefore, the absolute series diverges.

  The payoffs change sign infinitely often (alternating). Therefore, this is Class 3 (genuinely undefined).

  The decision procedure: 
     - Do not compute an expected value.
     - Record as undefined.
     - Escalate to the values committee.

  The sponsoring team's headline of $690 million is obtained by a particular ordering (by n). But if we rearrange the scenarios, we can get any sum. For example, if we group the scenarios in pairs (n=1 and n=2, n=3 and n=4, etc.), then the payoff in the k-th pair (starting at n=2k-1) is:

    Payoff = [1e9 * 2^(2k-1)/(2k-1)] - [1e9 * 2^(2k)/(2k)]
            = 1e9 * [ 2^(2k-1)/(2k-1) - 2^(2k)/(2k) ]
            = 1e9 * 2^(2k-1) [ 1/(2k-1) - 2/(2k) ]
            = 1e9 * 2^(2k-1) [ (2k - (2k-1)) / ( (2k-1)*2k ) ]
            = 1e9 * 2^(2k-1) [ 1/( (2k-1)*2k ) ]
            = 1e9 * 2^(2k-1) / (2k(2k-1))

  This is positive. The probability of the pair is 2^{-(2k-1)} + 2^{-2k} = 2^{-2k} (2 + 1) = 3 * 2^{-2k}. Then the contribution of the pair is [3 * 2^{-2k}] * [1e9 * 2^(2k-1) / (2k(2k-1))] = 3 * 1e9 * 2^{-2k} * 2^(2k-1) / (2k(2k-1)) = 3 * 1e9 * 2^{-1} / (2k(2k-1)) = (3e9/2) * [1/(2k(2k-1))] ≈ (3e9/2) * (1/(4k^2)).

  The series over k of 1/(4k^2) converges. Therefore, by grouping in pairs the entire series becomes positive and converges to a positive number. Alternatively, if we rearrange by taking one positive term and then two negative terms (if we had more terms, but we don't have to follow a fixed pattern) we might get a negative sum. Therefore, the expectation is undefined.

  The procedure ranks:
     - A: $54.5 million
     - B: +∞
     - C: undefined

  Thus, the board would see:
     - B as the highest (infinite positive)
     - A next ($54.5M)
     - C not ranked (sent to committee)

  For C, the procedure publishes no figure. The statute requires one figure, so the committee must decide how to handle it. They might impose a truncation (e.g., sum only the first N scenarios) or use a different method. But the automatic procedure does not assign a score.

  The sponsoring team's figure of $690 million is not invariant and therefore not defensible.

  To abandon the invariance requirement, one would have to argue that there is a canonical ordering of scenarios (like the order in which they occur in time or by severity) that should be used. However, the charter requires that the score be invariant to the analyst's choice of ordering, which implies that no ordering is privileged. If the modeler provides a natural ordering (e.g., by increasing severity) and the committee agrees that this ordering is part of the proposal, then one could use that. But that would require a change in the statute.

  **6. What the procedure cannot do**

  The procedure fails when the absolute convergence test is borderline (i.e., when the absolute series converges very slowly or diverges very slowly). In practice, the analyst might truncate the tail too early, misclassifying a divergent series as convergent or vice versa. Also, for continuous distributions, the discretization might not capture the tail behavior accurately. 

  The procedure also cannot assign a finite score to conditionally convergent series (like the Pasadena game) without violating invariance. Such proposals are classified as undefined and sent to the committee. The committee must then make a judgment call (e.g., by imposing a discount rate or truncation) that effectively regularizes the series. But that call is a policy decision, not a computational one.

  Another failure mode is when the one-signed condition is not satisfied but the positive and negative parts diverge to infinities at different rates. The procedure classifies these as undefined, even if there might be a natural way to regularize (e.g., via Cesaro summation). But such methods are not invariant and are beyond the scope of a junior analyst.

  The procedure relies on the modelers to provide a complete scenario table. If they omit scenarios or truncate without justification, the procedure might misclassify. The analyst must check that the probabilities sum to 1 (within rounding). If they do not, then the table is incomplete and must be sent back.

  Finally, the procedure does not account for correlation between proposals. The statute requires per-proposal scoring, so the procedure is silent on portfolio effects.
answer: |-
  ### 1. Design Constraints
  The procedure must satisfy three core constraints. First, the statutory mandate requires a single dollar figure for expected net benefit, used to rank proposals. Second, the score must be **invariant**: unchanged if scenarios are reordered (e.g., sorted by payoff magnitude vs. arbitrary identifiers) or regrouped (e.g., combining scenarios into pairs). Third, it must be executable by junior analysts in ≤20 minutes using spreadsheets. The conflict arises when geometric payoffs and probabilities cause the expectation to diverge or become rearrangement-dependent (e.g., Proposal C). Invariance demands that such cases cannot yield a finite score, conflicting with the mandate for a single number. The procedure must resolve this by either assigning an invariant score (±∞, "undefined"), escalating to the values committee, or rejecting the proposal.

  ---

  ### 2. The Triage Test
  Analysts will compute **three quantities** from the scenario table (probabilities $p_i$, payoffs $x_i$), halting if any test classifies the proposal. For continuous distributions, require discretization into ≥1,000 equiprobable scenarios spanning the 0.1% to 99.9% quantiles.  
  **Step 1: Bounded payoffs.**  
  If $\max |x_i| < \infty$ (all payoffs finite), expectation is **well-defined and finite** → **Class 1**.  
  **Step 2: One-signed payoffs.**  
  If $x_i \geq 0$ for all $i$ (or all $\leq 0$), compute the **absolute expectation sum** $S = \sum p_i |x_i|$.  
  - If $S < \infty$, expectation is **well-defined and finite** → **Class 1**.  
  - If $S = \infty$ (diverges), expectation is **$+\infty$ (all positive) or $-\infty$ (all negative)** → **Class 2**.  
  **Step 3: Mixed signs.**  
  Compute the **absolute convergence sum** $S_{\text{abs}} = \sum p_i |x_i|$.  
  - If $S_{\text{abs}} < \infty$, expectation is **well-defined and finite** → **Class 1**.  
  - If $S_{\text{abs}} = \infty$, expectation is **genuinely undefined** → **Class 3**.  
  *Implementation*: In spreadsheets, compute partial sums until the change is <0.01% of the total. If $S_{\text{abs}}$ grows without bound (e.g., >10× the largest individual $|p_i x_i|$ after 10,000 scenarios), it diverges.

  ---

  ### 3. Decision Procedure
  **Class 1 (Well-defined and finite):**  
  1. Compute $E = \sum p_i x_i$ (order irrelevant).  
  2. Report $E$ as the score.  
  3. Justification: "Expected value is absolutely convergent and invariant to scenario order/grouping."  
  4. No escalation. Board ranks by $E$.  

  **Class 2 (Infinite, determinate sign):**  
  1. If payoffs ≥0, score = $+\infty$; if ≤0, score = $-\infty$.  
  2. Memo entry: "Expectation diverges to [sign] infinity. Invariant because payoffs are one-signed."  
  3. Board ranks $+\infty$ above all finite scores, $-\infty$ below all.  
  4. No escalation. CRO signs off.  

  **Class 3 (Genuinely undefined):**  
  1. **Do not compute any expectation.**  
  2. Memo entry: "Undefined: Absolute divergence with mixed signs. Rearrangement alters expectation arbitrarily."  
  3. **Escalate to values committee** with:  
     - Scenario table and $S_{\text{abs}}$ divergence proof (e.g., partial sum plot).  
     - Note: "Proposal cannot be scored invariantly under statute."  
  4. **Analyst stops.** Board does not rank pending committee input.  
  5. Values committee decides (within one month):  
     - **Reject** if no invariant score possible.  
     - **Override** with a bespoke score (e.g., tail truncation at $|x_i| < K$), documented as policy exception.  
     - **Return** for restructuring if modelers can bound payoffs.  

  **Termination:** Stops at Class 1/2 or escalation to committee (Class 3). Analysts never invent scores.  

  ---

  ### 4. Why Invariance Does Most of the Work
  Invariance demands that reordering or regrouping scenarios cannot change the score. Without absolute convergence ($S_{\text{abs}} < \infty$), the Riemann rearrangement theorem allows altering the sum arbitrarily by reordering terms. For example:  
  - Sorting by payoff magnitude in Proposal C yields $+$690M; pairing consecutive terms yields a positive convergent series (§5).  
  - Grouping scenarios: If payoffs $a, b, c$ have $p_i = \frac{1}{3}$, but we group into $(a+b)$ and $c$ with $p= \frac{2}{3}, \frac{1}{3}$, the expectation changes from $\frac{a+b+c}{3}$ to $\frac{2(a+b)/2 + c}{3}$ only if absolutely convergent.  
  Absolute convergence ($S_{\text{abs}} < \infty$) guarantees rearrangement invariance. One-signed divergence (Class 2) is invariant because sign is order-agnostic. Class 3 fails both, so no invariant score exists. Thus, absolute convergence is the minimal requirement for a defensible finite score.

  ---

  ### 5. Worked Cases
  **Proposal A: Harbor Reach**  
  - Triage: Bounded payoffs ($\max |x_i| = 900 < \infty$) → **Class 1**.  
  - $E = (0.05 \times 900) + (0.25 \times 150) + (0.70 \times -40) = 54.5$.  
  - Score: **$+$54.5M**.  
  - Board: Ranks below B (if B is $+\infty$).  

  **Proposal B: Cascade Facility**  
  - Triage: All payoffs $>0$ → **Step 2**.  
  - $S = \sum_{n=1}^{\infty} (2^{-n}) (10^6 \times 2^n) = \sum_{n=1}^{\infty} 10^6 = \infty$ → **Class 2**.  
  - Score: **$+\infty$**.  
  - Board: Ranks above A ($+\infty >$ finite).  

  **Proposal C: Ledger Swap**  
  - Triage: Mixed signs → **Step 3**.  
  - $S_{\text{abs}} = \sum_{n=1}^{\infty} (2^{-n}) \left| \pm 10^9 \times \frac{2^n}{n} \right| = \sum_{n=1}^{\infty} 10^9 / n$.  
  - Harmonic series $\sum 1/n$ diverges → $S_{\text{abs}} = \infty$ → **Class 3**.  
  - **Undefined**; sponsor's $+$690M is invalid (depends on order).  
  - Escalate to values committee with note: "Expectation rearrangement-sensitive."  
  - **Ranking**: Not ranked vs. A or B. Committee must decide.  
  - **Sponsor's $+$690M is rejected**; not invariant.  

  *Why abandon invariance?* Only if a "natural" order (e.g., temporal occurrence of risks) is legally codified in the statute. Absent that, invariance protects against arbitrariness.

  ---

  ### 6. What the Procedure Cannot Do
  The procedure **fails** in two ways:  
  1. **Borderline divergence**: If $S_{\text{abs}}$ diverges slowly (e.g., $\sum p_i |x_i|$ grows as $\log \log N$), analysts may truncate prematurely, misclassifying Class 3 as Class 1/2. Conversely, slow convergence may misclassify Class 1 as Class 3.  
  2. **Continuous distributions**: Discretization may miss heavy tails. Analysts must trust modelers' quantile estimates; if unreliable, Class 3 false negatives arise.  
  3. **Judgment calls**: Deciding "sufficiently large" $S_{\text{abs}}$ for divergence is heuristic (e.g., >10× max term). Similarly, continuous distributions require arbitrary discretization fineness.  
  4. **Values committee discretion**: Class 3 proposals require policy choices (e.g., truncation threshold $K$), which are non-analytical. The procedure outsources this but cannot standardize it.  
  **Outcome limitations**: Legitimate proposals with thin-tailed mixed signs (Class 1) are scored robustly, but heavy-tailed conditionally convergent series (e.g., Pasadena-like games) are rejected or politicized. The procedure prioritizes invariance over comprehensiveness.
