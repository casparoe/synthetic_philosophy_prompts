  **IN THE APPELLATE COURT OF THE THIRD CIRCUIT OF OLYMPIA**

  **ESTATE OF PYRRHUS, Deceased, by Executor EUDOCIA, Plaintiff-Appellant,**
  **and**
  **CASSANDRA PYRRHUS, Individually, Plaintiff-Appellant,**
  **v.**
  **THANATECH CORPORATION, Defendant-Appellee.**

  **Consolidated Appeals from the District Court of Aetolia**
  **Case Nos. CV-43-987 & CV-43-988**
  **The Honorable Patroclus, Judge Presiding**

  **OPINION OF THE COURT**

  **CYNISCA, J., delivered the opinion of the Court, in which PHILIPPUS and LYCURGUS, JJ., joined.**
  **HELVIDIUS, J., dissents in part and concurs in part, with reasons.**

  **I. FACTS**

  These consolidated appeals arise from a fatal accident involving the decedent, Pyrrhus, and a malfunctioning Model "Aegis" Vitality Monitor manufactured and marketed by Thanatech Corporation. While exercising, Pyrrhus's Aegis device catastrophically failed to detect and alert him to a critical cardiac arrhythmia, resulting in his immediate death. The Estate of Pyrrhus (Estate) appeals the dismissal of its claim seeking compensation for Pyrrhus’s death *as such*. Separately, Cassandra Pyrrhus (Cassandra), the decedent’s adult daughter, appeals the dismissal of her individual claim. Her claim alleges two distinct injuries: first, that Thanatech published a false statement *after* Pyrrhus's death asserting he had declined recommended device calibration updates, thereby implying contributory negligence; and second, that Thanatech’s decades-long advertising campaign, which urged consumers to vividly contemplate the future experiences they stood to lose if they died prematurely, directly caused Pyrrhus documented anxiety and fear regarding his mortality prior to his death.

  The District Court granted Thanatech’s motion to dismiss both claims in their entirety, holding that the Estate’s claim was barred by settled doctrine concerning the nature of death, and that Cassandra’s claims failed for lack of cognizable injury or standing. We affirm in part, reverse in part, and remand.

  **II. ANALYSIS**

  **A. The Estate's Claim for Pyrrhus's Death**

  1.  The foundational principles governing claims arising from death are well-settled within this jurisdiction. As articulated in our seminal ruling *Cleombrotus v. Charon Ferries*, and reaffirmed consistently since, including in *Menoeceus Consolidated*, death itself constitutes no injury to the deceased. This doctrine rests upon two interlocking axioms confirmed by reason and observation: first, that all good and evil lie solely in sensation; and second, that death is the permanent extinction of sensation and consciousness. Consequently, the state of being dead involves no sensation whatsoever – neither pain, nor loss, nor deprivation. The deceased is not "deprived" of life; he is simply *absent*, and absence cannot be felt. To hold otherwise would be to attribute sensation to insensibility, a logical absurdity the law cannot countenance.

  2.  The Estate’s argument, echoing the deprivationist view occasionally advanced in academic discourse, posits that Pyrrhus was harmed by the loss of the future life he would otherwise have enjoyed. This argument fails at its inception. A "future life" not yet experienced is indistinguishable from prenatal non-existence. Just as we do not deem an individual harmed by the fact of their birth occurring in 2100 rather than 2090 (thereby "depriving" them of a decade of prior non-existence), so too can we not deem an individual harmed by the termination of sensation preventing experiences after 2140. Non-existence before birth and non-existence after death stand in perfect symmetry; neither state presents a subject capable of experiencing deprivation. The relevant injury, if any, must pertain to the *living* subject within the bounds of sentient existence.

  3.  A corollary of these principles is the essential requirement of a *subject* and a *time* at which harm occurs. Harm necessitates a being who suffers it, at a specific moment or interval. Death, being the cessation of the subject, eliminates the possibility of suffering at any point subsequent to the event. The purported "harm" of death – the loss of future good – lacks both a subject to experience it (the deceased is insensate) and a time at which it is experienced (for after death, there is no "when"). Therefore, as a matter of law, no cause of action lies for death itself as an injury to the decedent. *Cleombrotus*, supra; *The Hegesias Group Litigation*.

  4.  Thanatech raised, and the District Court accepted, the affirmative defense of the statute of limitations regarding the Estate’s claim. This presents a unique procedural conundrum worthy of note, though ultimately irrelevant to our holding. If death were an injury, *when* does it occur? At the moment of somatic death? But the subject ceases at that instant, suffering nothing thereafter. Or is the injury ongoing – the continuing state of being dead? This leads to the untenable conclusion that the limitation period *never begins to run*, as the injury (being dead) persists indefinitely. Such a result would effectively abolish statutes of limitations for wrongful death, a core pillar of judicial economy and fairness our doctrine wisely avoids. While this logical impasse further reinforces the soundness of our doctrine, our disposition rests firmly on the substantive principle: death is no injury. The Estate's claim was properly dismissed.

  **B. Cassandra Pyrrhus's Claims**

  1.  Cassandra’s first asserted injury stems from Thanatech’s posthumous publication of a false statement alleging her father declined calibration updates. She alleges this falsehood injured her father’s reputation and, derivatively, her own filial interests. The claim fails. The false statement was published *after* Pyrrhus's death. At that time, and for all time thereafter, Pyrrhus possessed no capacity for sensation. He could not experience distress, embarrassment, or any reputational injury. The publication caused him no conscious harm. As established in *In re: Memorials of Lysias*, reputational interests, being contingent upon the feelings and perceptions of the living, cease to be interests of the deceased upon death. The deceased has no cognizable reputation to injure; only the living possess sensibilities capable of being affected by such statements. Cassandra’s derivative injury is insufficient to ground a claim belonging uniquely to her father, which cannot exist. This claim was properly dismissed.

  2.  Cassandra’s alternative argument, that her father was "cheated of decades he would otherwise have had," founders on the same symmetry principle that defeated the Estate’s claim. Thanatech correctly observes that under our doctrine, the length of a life is indifferent in itself; only the quality of sensation within that life matters. To claim being "cheated" of future time presupposes that the un-lived future possesses inherent value *to the deceased*, which our doctrine expressly rejects. The prenatal/posthumous symmetry is fatal to this contention. A life spanning 50 years is not intrinsically preferable to one spanning 40 years, any more than being born later is intrinsically preferable to being born earlier. What matters is the sensation experienced within the span of existence. The *manner* of death might cause suffering (a compensable injury if proven), but the mere truncation of potential future sensation is not a compensable loss to the one who dies. The District Court correctly dismissed this aspect of Cassandra’s claim.

  3.  However, Cassandra’s second distinct claim, arising from Thanatech’s advertising campaign, survives dismissal. She alleges that Thanatech’s long-running campaign, which included directives to users to "viscerally imagine the graduations, weddings, sunsets never seen" if death occurred prematurely, directly caused Pyrrhus documented periods of acute anxiety and fear of death *during his life*. Medical records appended to the complaint indicate treatment for thanatophobia temporally linked to intensive exposure to Thanatech's "Contemplation Protocols." This alleges a cognizable injury under our doctrine: the infliction of *fear*, a negative sensation, upon a living, conscious subject. Fear is an evil lying squarely within sensation. *See Philodemus v. The Stygian Press* (recognizing compensable injury for inflicted terror).

  4.  The District Court dismissed this claim, holding that Cassandra lacked standing to assert an injury personal to her father. This was error. While the claim arises from an injury to Pyrrhus, Cassandra, as executrix of the Estate, is the proper party to assert claims belonging to the decedent that accrued *during his lifetime*. The fear, if proven, was experienced by Pyrrhus while alive and sentient. The cause of action for its infliction vested in him at that time and survives to his Estate. *See Olympia Survival of Actions Act § 12(b)*. The complaint sufficiently alleges that Thanatech’s campaign was a substantial factor in causing this documented fear. Whether the campaign constituted negligent or intentional infliction of emotional distress, or violated consumer protection statutes, are questions for the trier of fact. We express no opinion on the merits, only that a valid cause of action is stated.

  5.  We note, as a necessary consequence of our doctrine’s rigor, that an undiscovered betrayal of a *living* person would similarly constitute no compensable injury until discovered and experienced as distress. *See the principle applied in Argus v. Penelope* (undisclosed surveillance causing no contemporaneous distress held non-actionable). The law compensates for suffered harm, not merely for the existence of a state of affairs unknown to the subject. We embrace this symmetry; our doctrine demands it. Cassandra’s claim regarding the advertising campaign alleges a harm suffered within the bounds of Pyrrhus’s sentient life. That is sufficient.

  **III. DISPOSITION**

  The judgment of the District Court dismissing the Estate’s claim for Pyrrhus’s death is AFFIRMED. The judgment dismissing Cassandra Pyrrhus’s claim regarding the posthumous false statement is AFFIRMED. The judgment dismissing the Estate’s claim (via Cassandra Pyrrhus as Executrix) for the infliction of fear arising from Thanatech’s advertising campaign is REVERSED. That claim is REMANDED for further proceedings consistent with this opinion.

  **HELVIDIUS, J., dissenting in part and concurring in part.**

  I concur with the majority’s disposition of Cassandra Pyrrhus’s claims concerning the posthumous false statement and the advertising-induced fear. However, I respectfully dissent from the majority’s continued adherence to a doctrine that renders the extinguishment of a human life through alleged corporate malfeasance a legally null event.

  The majority, with characteristic logical precision, builds its edifice upon the axiom that harm requires a sentient subject experiencing it at a specific time. Death, annihilating the subject, seemingly leaves no room for harm. Yet this laser focus on instantaneous sensation blinds the law to a deeper, more fundamental injury: the destruction of potential itself. Pyrrhus was not merely a vessel for transient feelings; he was a locus of agency, relationships, and future possibility. The abrupt termination of his existence by a potentially defective product did not merely cause him momentary distress before the end (which the majority rightly allows the Estate to pursue); it obliterated the entire trajectory of his being.

  To say Pyrrhus suffered no injury because he did not consciously experience his own absence is to confuse the map for the territory. The law routinely recognizes injuries based on the alteration of a person’s *state* or *prospects*, even if fully felt only in anticipation or consequence. We compensate for the loss of a limb not solely for the physical pain, but for the permanent deprivation of function and wholeness it represents. We recognize that defamation harms by altering a person's standing in the community, a harm often felt as ongoing anxiety or lost opportunity, not merely a single pang of distress. The majority’s rule reduces human existence to a flickering series of sensations, denying legal significance to the very structure of a life – its duration and the unfolding narrative contained within it.

  The symmetry with prenatal non-existence is superficially appealing but fundamentally flawed. Prior to birth, the potential person *does not exist*. Pyrrhus *did exist*. He was a conscious being embedded in a life story, with plans, relationships, and the reasonable expectation of continued sentient existence barring accident or illness. Thanatech’s device, marketed explicitly to preserve that continued existence, allegedly failed catastrophically, cutting his narrative short. This is not symmetrical with a pre-conception "might-have-been"; it is the violent severing of an actual, ongoing "is." The harm lies in the destruction of the life he was actively living and the future he was actively approaching. To deny this is to deny the inherent value of a human life beyond its immediate sensory content.

  The majority embraces the logical consequence that an undiscovered betrayal harms no one until discovered, citing *Argus*. While consistent within their framework, this highlights the doctrine's profound disconnection from lived reality. It suggests a person blissfully unaware of a spouse’s decades-long infidelity, or a patient unaware of a doctor’s fatal error concealed in records, suffers no legal wrong until the moment of shocking discovery. This elevates a philosophical tautology over the tangible, if sometimes latent, damage done to a person's world. Law should aspire to a richer conception of human injury.

  My disagreement is not with logic, but with the foundation. If death is truly no injury, then the meticulous care we take in life, the plans we make, the legacies we hope to build, are rendered legally irrelevant the moment we cease to feel. This reduces the human person to mere sentience, ignoring the profound injury of annihilation. The Estate’s claim should be permitted to proceed. The District Court’s dismissal of that claim should be reversed.

  **One question remains unanswered by the majority:** If the unexperienced future has no value, and causing a person to *fear* the loss of that future is a compensable injury, does not the law thereby implicitly acknowledge the value of the very thing whose loss it declares meaningless?
