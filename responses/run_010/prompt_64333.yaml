prompt: |-
  So me and three others run a little hardship fund in our town — proper ex-mining area, about 14,000 people, one high street with a pound shop and two bookies in it. The pot's around nine grand a year: a donation from a bloke who grew up here and did alright for himself down south, plus whatever the Christmas bring-and-buy raises. We get three or four applications a month, mostly between £150 and £700 — a washing machine, a car repair so someone can keep a shift pattern going, dental work the NHS can't get them near in time, a deposit to move out of somewhere awful. We meet fortnightly on a Tuesday and we've got maybe a quarter of an hour per case, because there's also the minutes and the bank forms to do afterwards. Two of us are ex-council, one's a retired nurse who'd give away the furniture, one's the treasurer who counts every penny, and I'm the one who does the website. Nobody's got any training in welfare or benefits or anything, and we've slowly realised we're basically deciding by gut and then writing down a reason afterwards. Two of the four have to agree, and the treasurer won't release money without a written reason, so the reason we make up is the thing that actually ends up on file.

  Here's what I've been chewing on. What we seem to be trying to do is help people with bad things that happened *to* them rather than bad things they went and did themselves — and I found out that distinction has proper names in philosophy, something like brute luck and option luck, and that people have been arguing about it for decades, including that it's cruel because it lets you walk away from anyone who made a daft choice. I don't want an essay about that, and please don't give me a reading list or any references, I won't read them. What I want is a procedure we could actually run on a Tuesday night: the questions we ask in order, what counts as a good enough answer to each one, the point where the procedure just stops and the answer is no, and the points where it isn't a factual question at all and has to be handed over to us as humans making a value call. Short enough that we could laminate it, plus an even shorter emergency version, because sometimes it's a same-day phone call between meetings and two of us have to decide without the other two. And it's got to work with what we actually have, which is a form someone filled in at the library and one phone call — we can't cross-examine people, and honestly we don't want to, because half these questions would be us sitting in judgement of somebody's whole life. One more wrinkle: last year we started asking folk to put a bit back in the pot when they're on their feet again, and that's caused a row — tell me whether your procedure needs to know about that or whether we should park it.

  Three of ours to run it through. First, a lad of 23 who took out a loan at a shocking rate on a car because there's no bus at all to the industrial estate where he'd got a warehouse job; the job went after six weeks, he's behind now, and the car's about to be taken — half the panel will say that was his choice and half will say he never had one. Second, a woman of 58 who gave up work eleven years ago to look after her mam, her mam died in the spring, and she's got no pension, no recent references and no transport; she's asking for help with the funeral and the rent arrears. She obviously chose that, but nobody in the room is going to call it a gamble. Third, a bloke wanting £540 for a tooth that's been rotting since March; he smokes and he drinks, and one of us will definately say he did that to himself, though our own written rules don't mention either. Run all three through it and be straight with me about which one the procedure gets wrong, or says no to when we all know we'll pay it anyway — I'd much rather hear that from you than find out in the room with the person's form on the table. And please mark every step where the procedure only looks like it's deciding something but is really just one of us deciding in a posher way, and say whether two sensible people following it word for word could still end up disagreeing, because at the moment they do.
reasoning: |-
  Okay, the user is part of a small hardship fund team in a struggling ex-mining town. They've got limited resources and time, and they're making decisions based on gut feelings without formal training. Their main request is for a practical, step-by-step procedure they can use during their meetings to assess applications fairly and consistently. 

  First, I need to understand their constraints: short meeting times (15 min per case), no welfare training, minimal info (one form + one phone call), and a desire to avoid judging people's life choices. They also mention a repayment expectation that's causing tension—should the procedure include that or not?

  The user’s examples reveal their pain points: 
  - The car loan kid: Is his bad "option luck" (his choice) or "brute luck" (circumstances)? 
  - The caregiver: Her sacrifice feels like brute luck, but technically she chose it. 
  - The smoker with dental issues: Pure "self-inflicted" but urgent. 

  The core tension: They want to help people hit by misfortune without rewarding recklessness, but their current method is inconsistent and morally messy. The unspoken need here isn’t just a procedure—it’s *legitimacy*. They want to feel their decisions are defensible, not arbitrary. 

  For the procedure, I’ll focus on: 
  1. **Speed**: Must fit in 15 min. 
  2. **Empathy**: Avoids interrogation. 
  3. **Clarity**: Binary checkpoints, not open-ended debates. 
  4. **Transparency**: Flags where human judgment is unavoidable. 

  Key design choices: 
  - Start with objective eligibility (amount, residency) to weed out mismatches fast. 
  - Then assess *current crisis* severity—is it catastrophic? (homelessness, job loss, health emergency). This sidesteps the "fault" debate by focusing on present harm. 
  - Only *then* consider preventability, but narrowly: "Could they have *realistically* avoided this?" (e.g., no buses = car loan wasn’t optional). 
  - Exclude lifestyle judgments (smoking/drinking) unless directly relevant (e.g., if dental costs were from meth, but rotting tooth is urgent regardless). 
  - Repayment clause: Park it. It’s a moral minefield and irrelevant to crisis need. 

  Testing the examples: 
  - **Car loan kid**: Passes crisis check (job loss imminent). Preventability? No—no bus route. Help. 
  - **Caregiver**: Crisis (funeral/rent). Preventability? Her choice, but quitting work wasn’t reckless—it was care. Help. 
  - **Smoker**: Crisis (pain/infection). Preventability? Smoking didn’t *cause* the waitlist. Help—but flag that lifestyle debates are irrelevant here. 

  The "problem" case: None get rejected, which matches their instinct to help anyway. The procedure’s bias is toward saying yes unless something’s clearly fraudulent or avoidable. 

  Where judgment creeps in: 
  - "Realistic alternatives" step (e.g., was the car loan *really* the only option?). 
  - "Crisis severity" threshold (e.g., is a broken washing machine an "emergency"?). 

  Solution: Laminate the steps, add a "tiebreaker" rule for disagreements (e.g., "If crisis severity is medium/high, default to yes"). 

  Finally, the emergency version: Just Steps 1-3 + tiebreaker. Strip it to "Is it urgent? Is it catastrophic? Can we verify?" 

  This should give them structure without bureaucracy. The relief will come from fewer circular arguments, not perfect objectivity—because luck is never that simple.
answer: |-
  Here's a practical, laminated-friendly procedure designed for your constraints. It focuses on **crisis severity** and **realistic alternatives** rather than moral judgments about "fault," with clear off-ramps for "no" decisions and flags for human judgment calls.  

  ---

  ### **Hardship Fund Assessment Procedure**  
  *(10-Minute Version for Meetings / 5-Minute Emergency Phone Version)*  

  1. **ELIGIBILITY SCREEN**  
     - ✅ *Ask:* "Is the request £50–£700? Does the applicant live locally? Is this a one-off crisis (not ongoing bills)?"  
     - *Stop if NO* → "Sorry, outside our scope."  
     - *No judgment needed*. Fact-based.  

  2. **CRISIS SEVERITY CHECK**  
     - ✅ *Ask:* "Without help, in the next 2 weeks, will this cause:  
       - Homelessness / eviction?  
       - Job loss?  
       - Severe health/safety risk?  
       - A child’s basic needs unmet?"  
     - *Stop if NO* → "We can’t help with lower-urgency needs."  
     - *Judgment call:* "Severe health risk" includes dental agony; "job loss" includes car repossession preventing work.  

  3. **PREVENTABILITY CHECK**  
     - ✅ *Ask:* "Was there a *realistic* alternative to avoid this crisis that didn’t exist **at the time**?"  
       - *Examples of "realistic NO":*  
         - No bus route to work → needed car loan.  
         - No affordable dentists → couldn’t fix tooth sooner.  
         - Full-time caregiving → couldn’t build pension.  
       - *Examples of "realistic YES" (likely STOP):*  
         - Blew cash on holiday instead of fixing boiler.  
         - Chose a luxury car loan over affordable transit.  
     - *Stop if CLEAR YES* → "We prioritise unavoidable crises."  
     - **Major judgment call!** Requires panel discussion.  

  4. **AFFORDABILITY & IMPACT**  
     - ✅ *Ask:* "Will £X actually solve *this specific crisis*? Can they cover partial costs?"  
     - *Stop if NO* (e.g., £700 won’t cover £2k rent arrears).  
     - *Minor judgment:* "Partial help" may be offered.  

  5. **DECISION & REASON**  
     - **Agree on 1–2 sentences for the form:**  
       *Template:* "Approved for [£X] due to [crisis severity] and [lack of alternative]."  
       *Example refusal:* "Declined: avoidable through realistic alternative (e.g., cheaper transport)."  

  **Emergency Version** (Phone): Skip Step 3. Focus on Steps 1, 2, and 4. If Step 2 = YES → approve.  

  ---

  ### **Key Features**  
  - **Avoids "fault" debates:** Uses "realistic alternatives" (not "good/bad choices").  
  - **Repayment clause:** **PARK IT.** Not relevant to crisis assessment. Handle separately.  
  - **Transparent judgment flags:** Steps 2 (severity) and 3 (preventability) require human discussion.  
  - **Hard stops:** Steps 1 (scope) and 4 (affordability) are factual.  
  - **Disagreement expected:** Two sensible people *will* disagree on Step 3 ("realistic alternatives"). Tiebreaker: If crisis severity (Step 2) is HIGH, default to YES.  

  ---  

  ### **Testing Your Cases**  
  **1. The 23yo with the car loan:**  
  - ✅ Step 1: ££? Local? Crisis? **YES.**  
  - ✅ Step 2: **Severe** (job loss if car repossessed).  
  - ⚠️ Step 3: "Realistic alternative?" **NO** (no bus → car was only option). Job loss after 6 weeks = bad luck, not recklessness.  
  - ✅ Step 4: £X solves crisis? **YES** (keep car, keep job hunt).  
  - **VERDICT:** **APPROVE.** *Disagreement?* Step 3 is debatable, but severity tilts it to YES.  

  **2. The 58yo caregiver:**  
  - ✅ Step 1: **YES.**  
  - ✅ Step 2: **Severe** (funeral costs = health/safety risk; rent arrears = homelessness).  
  - ⚠️ Step 3: "Realistic alternative?" **NO** (caregiving isn’t a "gamble" – no alternative to NHS delays/pension gaps).  
  - ✅ Step 4: **YES** (targeted help for funeral/rent).  
  - **VERDICT:** **APPROVE.** *No disagreement expected.*  

  **3. The smoker with dental issues:**  
  - ✅ Step 1: **YES.**  
  - ✅ Step 2: **Severe** (dental infection = health risk).  
  - ⚠️ Step 3: "Realistic alternative?" **NO** (smoking didn’t cause the NHS waitlist; he couldn’t access care sooner regardless).  
  - ✅ Step 4: **YES** (£540 fixes the crisis).  
  - **VERDICT:** **APPROVE.** *But...* one panelist might argue smoking = "preventable" in Step 3. **Procedure overrules this** – smoking isn’t a *realistic alternative to NHS delays*.  

  ---  

  ### **Where the Procedure "Gets It Wrong"**  
  - **It approves all three.** In your gut-check system, the smoker *might* be denied by some. The procedure forces you to ignore lifestyle judgments (smoking/drinking) unless they *directly caused an avoidable crisis* (e.g., if he’d spent dental savings on vodka).  
  - **Why this works for you:** It aligns with your instinct to help "bad things that happened *to* them." The car loan kid passes because his only "choice" was unemployment or debt. The caregiver’s sacrifice isn’t penalised. The smoker’s pain isn’t deemed "self-inflicted" because NHS delays are brute luck.  

  ### **When You’ll Stretch the Rules**  
  You’ll occasionally approve cases failing Step 3 (e.g., someone who *did* make a reckless choice but now faces catastrophe). Admit this upfront: *"Sometimes we bend for compassion – but this framework keeps us consistent 90% of the time."*  

  ### **Laminated Cheat Sheet**  
  ```  
  1. SCOPE? (£50-700/local/one-off) → NO? STOP.  
  2. CRISIS? (job/homelessness/health/child) → NO? STOP.  
  3. UNAVOIDABLE? (realistic alternative at the time?) → YES? STOP.  
  4. SOLVABLE? (£X fixes it?) → NO? STOP.  
  5. APPROVE + WRITE REASON: "Crisis + no alternative."  
  ```  
  **Emergency Phone:** Do Steps 1, 2, 4. If Step 2 = YES → APPROVE.  

  ---  
  **Final note:** This won’t eliminate disagreements (Step 3 will always be debatable), but it *contains* them to one question and stops value judgments from derailing every case. You’re still humans – but now with guardrails.
