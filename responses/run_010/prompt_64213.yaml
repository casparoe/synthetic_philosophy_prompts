prompt: |-
  I run the long-horizon research desk at a geopolitical risk firm. Clients ask us whether a currently rising power will still be rising in twenty-five years, or whether the security order in a given region will survive the decade, and our analysts answer by writing a narrative history and then attaching a number that tracks whichever story they found most vivid. I want a written procedure that puts the outside view first: an ordered sequence of steps an analyst without statistical training can run in about two days, from framing the question to delivering an interval with its base-rate anchor recorded.

  It must confront three difficulties rather than paper over them. First, for questions of this kind the natural reference class may contain only a handful of members; say what the analyst does when no available class yields a usable base rate. Second, the members are not independent draws — powers embedded in the same era or the same system move together — so a headcount of cases overstates how much weight the base rate can bear; give a rule for discounting it. Third, clients routinely argue that the mechanism behind the base rate has stopped operating (nuclear weapons, economic entanglement, changed norms about territorial conquest). The procedure must permit that claim to be made and tested, but must not let it function as a standing escape hatch back to the inside view.

  Also specify: how the class is defined before any outcomes are examined, what afterwards counts as a legitimate reason to redefine it, how far case-specific information may move the estimate off the base rate and in what increments, and where the procedure halts and reports the question unforecastable.

  Then run it end to end on two client questions of your choosing in this genre, at least one of which yields a verdict the client will resent. Mark all figures as illustrative — I do not want researched statistics. Close with what the procedure cannot do, and which of its steps are judgment calls dressed up as arithmetic.
reasoning: |-
  We are designing a procedure for geopolitical forecasting that emphasizes the outside view. The procedure must handle small reference classes, non-independent cases, and claims that the base rate mechanism has stopped. The goal is to produce an interval estimate anchored by a base rate, while constraining the inside view.

  Procedure: "Outside View First" (OVF) Forecasting

  Step 1: Frame the Question
     - Define the outcome in binary terms (e.g., "Will Power X still be rising in 25 years?" -> "Power X is a rising power in 25 years").
     - Specify the time horizon and the exact condition for the outcome.

  Step 2: Define the Reference Class
     - Identify a reference class of historical cases that are analogous to the target case in terms of the key features that define the situation. The class must be defined without knowledge of the outcomes of the cases.
     - Rule: The reference class must be defined by characteristics that were observable at the start of the period analogous to the present (i.e., the same relative point in the process). For example, for a rising power, the class might be defined as "great powers that have experienced at least 20 years of sustained economic growth and military expansion and are considered by contemporary observers as rising".
     - If no such class exists, try to form a broader class by relaxing non-essential criteria until at least 5 cases are obtained. If still no class, go to Step 8.

  Step 3: Collect Base Rate
     - For each case in the reference class, determine the outcome (e.g., whether the rising power was still rising after 25 years). Count the number of cases that had the outcome (successes) and the total cases (n).
     - Compute the base rate: p = (number of successes) / n.

  Step 4: Adjust for Non-Independence
     - Because cases in the same era/system may be correlated, we discount the effective sample size. We use a rule of thumb: if the cases span k distinct eras (where an era is a period of at least 20 years without major system-wide wars or transformations), then the effective number of independent cases is k (if k < n) or n (if k>=n and the cases are from independent eras). But if the cases are from the same era, then we set the effective sample size to the minimum of n and the number of distinct major systems (if applicable). However, since this is complex, we use:
          effective n = min(n, number of distinct eras, number of distinct systems) 
       but not less than 1.
     - Then, the adjusted base rate is still p, but the confidence we have in it is based on effective n. We will use the adjusted n to compute the interval.

  Step 5: Compute Interval
     - Using the adjusted n (let m = effective n) and p, we compute a confidence interval. Since the analysts are not statisticians, we use a simple rule:
          Interval = p ± (1 / sqrt(m))
       This is a rough approximation of a 68% confidence interval for a proportion (using normal approximation, which is crude for small m). If m is very small (less than 5) we use a wider interval: 
          If m < 5, then interval = [max(0, p - 0.3), min(1, p + 0.3)]
       But note: this is illustrative and not rigorous.

     Alternatively, we can use:
          Lower bound = max(0, p - 1.96 * sqrt(p*(1-p)/m) ) for 95% interval, but for simplicity and because m is small, we use the simpler rule above.

     However, the problem says to mark as illustrative. We are going to use:

          Interval = [max(0, p - 1/sqrt(m)), min(1, p + 1/sqrt(m))]

     This is for a rough 68% interval.

  Step 6: Challenge: Claim of Mechanism Change
     - If the client or analyst claims that a fundamental change (e.g., nuclear weapons) has altered the mechanism, then:
          a. They must state the change and the reason why it breaks the historical analogy.
          b. They must identify a subset of the reference class that is most similar to the target case in the new era (post-change). If the change is recent, this subset might be small or empty.
          c. If they can form a new reference class (at least 3 cases) from the post-change era, then we repeat Steps 3-5 on that class and use that as the base rate.
          d. If they cannot form a new class, then we adjust the base rate by moving p towards 0.5 by a fixed amount: 
               new p = p * (1 - d) + 0.5 * d
             where d is a discount factor (between 0 and 1) representing the strength of the argument (0 = no effect, 1 = complete breakdown). We set d by the following rule:
               - d = 0.2 for a weak argument (e.g., some evidence but not compelling)
               - d = 0.5 for a moderate argument (e.g., plausible mechanism but unproven in this context)
               - d = 0.8 for a strong argument (e.g., clear evidence that the mechanism has changed in related contexts)
          e. The adjustment in (d) must be approved by a second analyst to avoid arbitrary escapes.

     - Note: The adjustment in (d) pulls the base rate toward 0.5, which is the point of maximum uncertainty. This prevents extreme adjustments without evidence.

  Step 7: Case-Specific Adjustment (Inside View)
     - Only after the base rate and adjustments for mechanism change, we allow case-specific information to adjust the estimate. This adjustment is limited and must be justified by clear, unique factors not captured in the reference class.
     - Rule: The analyst may adjust the point estimate (p) by up to ±0.2, but must do so in increments of 0.05 and provide one unique factor per 0.05 increment. The factor must be:
          - Specific to the case and not present in the reference class (or present only in the failed/succeeded cases in a way that aligns with the adjustment).
          - Observable at the present time (not a future prediction).
          - Documented with a brief explanation.

     - The adjusted point estimate is: p' = p + adjustment (but bounded between 0 and 1).
     - The interval is then shifted accordingly, but the width remains the same.

  Step 8: When the Question is Unforecastable
     - If the reference class cannot be defined (Step 2) and no alternative is found, then the procedure halts and reports: "Insufficient historical analogues for an outside view forecast."
     - If the base rate is based on an effective n of 1 or 2 and the mechanism change adjustment (Step 6) does not produce a stable result, then we may also halt.

  Step 9: Report
     - Deliver the interval and the base rate anchor. The report must include:
          - The reference class definition and size (n) and the effective n after independence adjustment.
          - The base rate (p) and the initial interval.
          - Any adjustments for mechanism change and the resulting p (if changed).
          - Case-specific adjustments (if any) and the factors used.
          - Final interval and point estimate (if a point is needed, use the adjusted p').

