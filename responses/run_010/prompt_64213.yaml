answer: |-
  ### Outside View First (OVF) Forecasting Procedure  
  **Goal:** Anchor geopolitical forecasts in base rates, constrain inside-view storytelling, and deliver an 80% confidence interval within two days. Analysts need no statistical training.

  ---

  #### Step 1: Frame the Question  
  - **Input:** Client’s question (e.g., "Will Power X remain a rising power in 25 years?").  
  - **Output:** Binary outcome, clear timeframe, and success/failure definitions.  
    - *Example:* "Power X’s relative GDP/capita and military expenditure vs. the dominant regional power will increase by 2049."  

  #### Step 2: Define the Reference Class *A Priori*  
  - **Rule:** Identify 5–20 historical analogues using **observable initial conditions** (e.g., "rising powers at a similar development stage").  
    - *Criteria:* Must be defined **before** examining outcomes. Use sources like historical datasets (e.g., Correlates of War) or expert consensus.  
    - *If no class exists:* Expand scope (e.g., "rising powers" → "rapidly industrializing states"). If still <5 cases, proceed to Step 8.  

  #### Step 3: Calculate Base Rate  
  - **Method:** Tally successes (S) and failures (F) in the reference class. Base rate \( p = \frac{S}{S+F} \).  
  - **Record:** \( p \), \( n = S + F \).  

  #### Step 4: Adjust for Non-Independence  
  - **Rule:** Discount effective sample size \( n_{\text{eff}} \) using:  
    \[
    n_{\text{eff}} = \frac{n}{1 + (k - 1) \rho}
    \]  
    - \( k \): Number of "clusters" (e.g., distinct historical eras/systems).  
    - \( \rho \): Intra-cluster correlation (default \( \rho = 0.3 \) if cases share era/system; \( \rho = 0.1 \) if loosely connected).  
  - *Example:* 10 cases from 3 eras (\( k=3 \)) → \( n_{\text{eff}} = \frac{10}{1 + (3-1) \times 0.3} = \frac{10}{1.6} \approx 6 \).  

  #### Step 5: Generate Initial Interval  
  - **Rule:** 80% interval = \( p \pm \frac{0.8}{\sqrt{n_{\text{eff}}}} \), bounded to [0.05, 0.95].  
    - *Example:* \( p = 0.7 \), \( n_{\text{eff}} = 6 \) → interval \( = 0.7 \pm \frac{0.8}{\sqrt{6}} \approx 0.7 \pm 0.33 \) → [0.37, 1.0] → [0.37, 0.95] after bounding.  

  #### Step 6: Test "Mechanism Change" Claims  
  - **Rule:** Clients/analysts may argue historical drivers are obsolete (e.g., "nuclear deterrence prevents great-power war"). To test:  
    1. **Require evidence:** Identify a *specific change* (e.g., "no great-power conquests since 1945").  
    2. **Re-run Steps 2–5** using a *post-change* reference class (e.g., "rising powers in the nuclear era").  
      - If new \( n \geq 5 \): Use new base rate.  
      - If new \( n < 5 \): Adjust initial \( p \) toward 0.5 by \( \Delta = 0.15 \times \text{strength} \) (strength = 1–3, judged by second analyst).  
        \[
        p_{\text{adj}} = p \pm \Delta \quad \text{(toward 0.5)}
        \]  
        *Example:* Claim strength=2 → \( \Delta = 0.3 \), \( p = 0.7 \) → \( p_{\text{adj}} = 0.7 - 0.3 = 0.4 \) (if claim lowers probability).  

  #### Step 7: Limited Case-Specific Adjustment  
  - **Rule:** Shift final point estimate up/down using **unique, measurable factors** absent from reference class.  
    - Max adjustment: \( \pm 0.15 \).  
    - Increments: \( \pm 0.05 \) per factor (e.g., "Power X has rare resource Y, increasing resilience").  
  - **Output:** Final interval centered on adjusted point estimate, with original width.  

  #### Step 8: Halting Conditions  
  Report "unforecastable" if:  
  - No reference class with \( n_{\text{eff}} \geq 3 \) exists.  
  - Post-mechanism-change \( n_{\text{eff}} < 3 \).  
  - Interval width > 0.6 after adjustments.  

  #### Step 9: Deliverable  
  - 80% confidence interval, base rate \( p \), adjustment log, and reference class.  

  ---

  ### Example Forecasts  
  #### Case 1: *Will India remain a rising power in 2049?*  
  - **Reference class:** Rising powers since 1800 with ≥20 years of >5% GDP growth (n=12: e.g., Japan 1950–90, USA 1870–1910, Brazil 1960–2000).  
  - **Base rate:** 7 of 12 sustained rise for 25 years → \( p = 0.58 \).  
  - **Non-independence:** 4 eras (pre-WWI, interwar, Cold War, post-Cold War), \( \rho = 0.2 \) → \( n_{\text{eff}} = 12 / (1 + 3 \times 0.2) \approx 8 \).  
  - **Initial interval:** \( 0.58 \pm 0.8/\sqrt{8} \approx [0.30, 0.86] \).  
  - **Mechanism change claim:** "Globalization reduces war risk."  
    - Post-1990 class (n=4: China, India*, Vietnam, Indonesia) → 3 successes → \( p_{\text{new}} = 0.75 \).  
    - New interval: \( 0.75 \pm 0.8/\sqrt{4} = [0.35, 1.0] \) → [0.35, 0.95].  
  - **Case adjustment:** +0.10 (demographic dividend, tech sector growth).  
  - **Final interval:** [0.45, 0.95] (illustrative).  
  - **Verdict:** Likely to rise (client satisfaction: high).  

  #### Case 2: *Will the US-led East Asian security order survive to 2035?*  
  - **Reference class:** Unipolar regional orders challenged by peer competitor (n=5: British Europe 1900–1914, French Europe 1800–1812, Soviet E. Europe 1945–1989).  
  - **Base rate:** 2 of 5 survived 35 years → \( p = 0.40 \).  
  - **Non-independence:** 3 eras, \( \rho = 0.4 \) → \( n_{\text{eff}} = 5 / (1 + 2 \times 0.4) \approx 3 \).  
  - **Initial interval:** \( 0.40 \pm 0.8/\sqrt{3} \approx [0.06, 0.74] \).  
  - **Mechanism change claim:** "Nuclear weapons prevent hegemony collapse."  
    - Post-1945 class (n=2: Soviet E. Europe, US W. Europe) → 1 success → \( p_{\text{new}} = 0.50 \).  
    - New interval: \( 0.50 \pm 0.8/\sqrt{2} \approx [0.06, 0.94] \).  
  - **Case adjustment:** –0.15 (US domestic polarization, Chinese naval expansion).  
  - **Final interval:** [0.00, 0.79] → [0.05, 0.79] (illustrative).  
  - **Verdict:** ≤25% survival probability (client resentment: high).  

  ---

  ### Limitations and Judgment Calls  
  #### What the Procedure Cannot Do:  
  1. **Handle complex cascading events** (e.g., "Taiwan crisis triggering US-China war").  
  2. **Incorporate quantitative data** beyond tallies (e.g., econometric trends).  
  3. **Eliminate subjectivity** in reference class definition or mechanism-change strength.  

  #### Judgment Calls Masked as Arithmetic:  
  1. **Reference class definition:** Choosing "similar development stage" relies on expert intuition.  
  2. **Cluster correlation (\( \rho \)):** Default values are educated guesses.  
  3. **Mechanism-change strength:** Scoring (1–3) is inherently subjective.  
  4. **Case-specific adjustments:** Increments of 0.05 per factor invite storytelling.  

  ---  
  **Final Note:** This procedure forces engagement with base rates and documents assumptions, but 40% of weight still rests on judgment. Use it to *discipline* inside views, not replace them.
