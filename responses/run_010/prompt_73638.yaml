prompt: |-
  So a bunch of us (14 households right now, aiming at maybe 80) are trying to set up a co-housing thing on some land outside town, and I got volunteered onto the "how do we actually live together" working group. We've spent two months arguing about bylaws — quiet hours, guest limits, whether the common kitchen gets a chore rota with a signup sheet or just a vibe, whether we fine people or shame people or neither, whether decisions need consensus or two-thirds. Every argument eventually collapses into "some of you want a tight community and some want a loose one," which is how I fell down the tightness/looseness rabbit hole (Gelfand's line mostly). It's interesting but useless to me, and before I read another word of it I want to know what I should even be demanding of a theory here. So: pretend you're someone who does cultural psychology and institutional design for a living, think carefully, brainstorm a long list of candidate requirements first if you need to, and then write me the pruned desiderata — what any adequate account of "how much rule-following should a group demand of its members" has to deliver. For each one, give me the case or consideration that makes it a requirement; I don't want a list of labels, I want to see why each item has to be on there. A few I already have stuck in my head, use or discard as you see fit: it has to say whether tightness is a property of a group or of a group-and-a-domain, since our place would be strict about money and totally relaxed about how people raise their kids; it has to not quietly collapse into authoritarianism, or conservatism, or collectivism, and it has to say what would count as evidence that it's a separate dimension at all; it has to handle the fact that people inside a tight system are often the worst reporters of how strong the sanctions really are, because most of the enforcement is invisible to them; it has to deal with scale — nearly all the evidence is at country or state level, and I need to know whether the mechanisms do any work at 80 households where enforcement is purely reputational and everybody already knows everybody; and it has to take a position on whether the trade-off everyone assumes (tight buys order and predictability, loose buys creativity and adaptability) is real or an artifact of how the measures were built.

  Then the part I actually care about most. Which of your requirements are genuine conditions on adequacy and which are just the prejudices of one camp — I suspect that insisting tightness be a single number is a measurement convenience rather than a requirement, and that the demand for a strictly non-functionalist explanation is a tic of one methodology. Mark the non-negotiables separately from the nice-to-haves. If some subset can't be jointly satisfied, say which and say why, because that would itself be the interesting result: my candidate is that norms partly work precisely because people follow them non-instrumentally, so a theory that recommends tightening on the grounds that it pays off may corrode the thing it's recommending, and if that's right then "the recommendation must be justified by its consequences" and "the recommendation must actually be effective" can't both be met. Also tell me which single requirement knocks out the most of the answers on offer, and end with one genuinely short paragraph on how the two or three most obvious candidate views do against your list — don't score them item by item, I'll do that at the next meeting.

  No reading list and no citations please, I've got the empirical side covered and I want the spec. And don't hand me a menu with the decision left to me — commit. Take a definite position on which requirements are the real ones and give me your reasons, and if you're shaky on one of the empirical claims in passing, flag the uncertainty on that one item rather than hedging the whole thing.
reasoning: |-
  Okay, let me start by unpacking this user's query. They're part of a co-housing group with 14 households aiming for 80, and they're stuck in the "how do we live together" working group. After months of debating bylaws, they've hit a wall with the tight vs. loose community argument. They mention Gelfand's work but find it interesting yet useless for their practical needs. 

  The user wants a clear set of requirements for any theory that addresses how much rule-following a group should demand. They already have some points: domain specificity, avoiding authoritarianism, handling insider blindness, scaling to small groups, and verifying the trade-off between order and creativity. They also want to know which requirements are essential versus methodological biases and if any requirements conflict.

  First, I need to identify the core issues. The group is stuck because they can't reconcile differing preferences for structure. The user needs a framework to evaluate theories on group norms, focusing on practical applicability for their co-housing project. Their deeper need is to move beyond academic debates to actionable guidelines that prevent community conflict.

  Looking at their listed requirements, domain specificity is crucial because rules for finances vs. child-rearing differ. Avoiding ideological collapse (authoritarianism, etc.) is vital to ensure the theory remains neutral. Insider blindness means members might not see enforcement mechanisms, so the theory must account for hidden norms. Scale is a big concern since most studies are on nations, not small communities where reputation matters. The order vs. creativity trade-off needs validation to avoid false assumptions.

  The user also wants to distinguish must-haves from methodological preferences. For example, insisting tightness as a single number might be a measurement convenience, not a necessity. They suspect functionalist explanations might be a bias. The conflict they mention—norms working non-instrumentally versus justifying them instrumentally—could be a key contradiction.

  I should list all possible requirements, then prune them to essentials. The user mentioned several, but others might include adaptability over time, handling internal diversity, and transparency. Each requirement must be justified by real cases. For example, domain specificity is needed because a group might have strict financial rules but loose social ones, as in their co-housing example.

  The insider blindness point is critical. In tight groups, compliance is internalized, so members don't perceive sanctions. A theory must explain this to avoid misreporting in studies. Scale affects enforcement mechanisms; in small groups, reputation replaces formal sanctions, so theories must address informal systems.

  The trade-off between order and creativity needs examination. If it's not inherent, groups can design rules that foster both. The user’s point about instrumental justification corroding non-instrumental adherence is profound. If rules are followed because they're right, not just beneficial, justifying them by outcomes might undermine that.

  Now, distinguishing essential requirements from biases. Domain specificity, scale, and insider blindness are non-negotiable because ignoring them misapplies the theory. The trade-off's reality is essential for informed trade-offs. Avoiding ideological collapse ensures the theory's neutrality. 

  Functionalist explanations might be a bias. The user suspects demanding non-functionalist explanations is a methodological tic. However, the corrosion problem they identified makes functionalist justification potentially harmful. So, while functionalism is a preference, the corrosion effect makes it inadequate, thus elevating the need for non-instrumental foundations to essential.

  Conflicting requirements: If norms rely on intrinsic adherence, justifying them instrumentally (for consequences) might weaken that adherence. So, "must be justified by consequences" and "must be effective" conflict because instrumental reasons can erode intrinsic motivation. The theory must allow non-instrumental foundations without functionalist justification.

  The scale requirement likely disqualifies many macro-level theories. If a theory doesn't address small-group dynamics where formal enforcement is absent, it's inadequate for their 80-household community.

  Assessing major theories: Gelfand's tightness-looseness might lack domain specificity and scale applicability. Ostrom's design principles handle scale and domain but may not address insider blindness or the trade-off adequately. New institutionalism might handle domains and ideology but could miss non-instrumental adherence.

  So, the essential requirements are domain specificity, scale adaptability, non-ideological neutrality, accounting for insider blindness, verifying the trade-off, and allowing non-instrumental foundations. The conflict between instrumental justification and effectiveness is critical, pushing for intrinsic cultural reasons over outcomes. Theories must be tailored to small-scale, diverse groups with clear domain distinctions and awareness of hidden enforcement.
answer: |-
  Here's the distilled set of non-negotiable requirements for an adequate theory of group rule-demand ("tightness"), with reasoning rooted in your practical dilemma and the constraints you've identified. I'll then address conflicts, disqualifiers, and evaluate major candidates.

  ### Core Desiderata (Non-Negotiables)
  1.  **Domain-Specificity:** *Requirement because:* Your group already exhibits domain variance (strict on money, loose on parenting). A theory claiming "group tightness" as a monolithic property would misprescribe interventions. Must explain why/how rule-intensity varies *within* a group across different activities (economics, social, safety, ritual).
  2.  **Scale & Mechanism Compatibility:** *Requirement because:* Your group (80 HHs, reputational enforcement) operates fundamentally differently than nations (formal laws, anonymity). A theory relying solely on large-scale, impersonal enforcement mechanisms (courts, police) is irrelevant. Must articulate how norms form, transmit, and are enforced in small, face-to-face groups where gossip, reciprocity, and shared identity are primary drivers.
  3.  **Non-Ideological Neutrality:** *Requirement because:* "Tightness" must be analytically separable from political systems (authoritarianism), value systems (conservatism), or economic models (collectivism). You need to design rules for cooperation, not import ideology. A theory conflating these will poison your process. Must demonstrate tightness can exist in liberal democracies (e.g., Japan) and looseness in autocracies (e.g., certain historical periods).
  4.  **Accounting for Insider Blindness:** *Requirement because:* If members underestimate enforcement (because compliance is internalized or sanctions are subtle), relying on self-reported "strictness" is fatally flawed. Your group needs accurate diagnosis. Must incorporate mechanisms for detecting *actual* norm strength and sanction risk, distinct from member *perception* (e.g., observing boundary-testing, exit patterns, subtle disapproval).
  5.  **Verification of the Order/Creativity Trade-off:** *Requirement because:* Assuming this trade-off is inherent dictates your entire design (order vs. innovation). If it's an artifact (e.g., tight systems *measure* creativity poorly, or loose systems *fail* to provide minimal order), you might achieve both. Must provide a testable hypothesis for its existence/absence and specify contextual factors (e.g., is the trade-off only under threat?).
  6.  **Handling Non-Instrumental Adherence:** *Requirement because:* Norms often work *because* they feel right/sacred, not just because they are useful. A theory recommending rules *solely* based on instrumental outcomes ("tighter rules = less conflict") risks undermining the very internalized commitment that makes rules effective long-term. Must accommodate norms followed for intrinsic, identity-based, or moral reasons, not just consequences.

  ### Important, But Negotiable/Possibly Methodological
  7.  **Multidimensionality (vs. Single Score):** *Likely a measurement convenience.* While a single "tightness" score simplifies research, your domain-specificity requirement (#1) inherently demands multi-dimensionality. A theory *can* be adequate by defining distinct dimensions (e.g., rule density, monitoring intensity, sanction severity) applicable per domain.
  8.  **Non-Functionalist Explanation:** *Partly methodological tic, partly essential.* Insisting rules *only* exist because of their functional benefits is reductionist (#6 shows why). However, *understanding* functional consequences (intended or unintended) is crucial for design. Requirement #5 already forces this analysis. The core need is avoiding *exclusively* functionalist justification, not banning functional analysis.

  ### The Critical Conflict: Instrumentalism vs. Effectiveness
  You identified it perfectly: **"The recommendation must be justified by its consequences" and "the recommendation must actually be effective" *cannot* both be fully satisfied if non-instrumental adherence is essential (#6).**  
  *Why?* Justifying a rule *primarily* instrumentally ("Be quiet after 10pm so everyone sleeps better") trains members to evaluate rules *based on consequences*. This erodes the non-instrumental foundation ("Quiet after 10pm is just what respectful neighbors *do*"). An effective theory must:
  *   **Acknowledge this tension:** Rules need *some* functional basis, but long-term stability often relies on non-instrumental commitment.
  *   **Recommend Hybrid Foundations:** Design rules with clear functional *benefits* (making instrumental justification plausible) while *cultivating* non-instrumental commitment through shared identity, rituals, and framing rules as expressions of community values, not just tools. Effectiveness *requires* managing this balance; pure instrumental justification corrodes the non-instrumental core needed for resilience.

  ### The Biggest Disqualifier: Scale & Mechanism Compatibility (#2)
  This requirement immediately invalidates most macro-level cultural psychology (like Gelfand's country-level indices) and political science theories of institutions. They rely on mechanisms (formal law, large bureaucracies, mass media) absent in your 80-household, reputation-based system. Theories failing to explicitly model small-group, high-social-capital, informal enforcement dynamics are non-starters for your context.

  ### How Major Views Stack Up (Briefly)
  1.  **Gelfand's Tightness-Looseness (Macro):** Fails #2 (Scale) catastrophically. Weak on #1 (Domain-Specificity), #3 (often correlates with conservatism), #5 (assumes trade-off exists). Insights on #4 (Insider Blindness) and #6 are limited. **Inadequate for your scale.**
  2.  **Ostrom's Design Principles (CPRs):** Excels at #2 (built for communities managing shared resources, like your common areas/money). Strong on #1 (rules are domain/context specific). Pragmatic on #3 (neutral tools). Addresses #4 (monitoring, graduated sanctions). Less direct on #5 (Trade-off) and #6 (focuses more on instrumental design, though shared identity is a factor). **Strongest contender, needs augmentation on #5/#6.**
  3.  **New Institutionalism (Sociology/Econ):** Good on #1 (institutions define domains), #3 (varied forms). Mixed on #2 (some micro-foundations exist). Weak on #4 (often takes rules as given), #5 (underdeveloped), and critically weak on #6 (often hyper-instrumental/rational choice, corroding non-instrumental adherence). **Useful concepts, risky on justification.**

  ### The Verdict
  Your **non-negotiables** are: **Domain-Specificity, Scale Compatibility, Non-Ideological Neutrality, Accounting for Insider Blindness, Verifying the Order/Creativity Trade-off, and Handling Non-Instrumental Adherence.** The core tension between instrumental justification and long-term effectiveness via non-instrumental commitment is real and must be managed, not solved. **Scale (#2)** is the primary disqualifier for popular macro-theories. **Ostrom's framework, augmented by explicit attention to cultivating non-instrumental commitment (values, identity, ritual) and rigorously testing the assumed trade-off in *your* context, provides the most adequate starting point.** Ditch the country-level indices; focus on small-group, polycentric, reputation-based governance designed for specific domains.
