prompt: |-
  I am one of two graduate teaching assistants marking the timed essay for a third-year ethics option module, "Responsibility, Blame, and the Moral Address", at a UK university. The convenor set the following question, which students answered under examination conditions in ninety minutes with a limit of 1,200 words and a maximum of 30 marks:

  > "Someone who has done the very thing she condemns another for cannot consistently condemn it." Distinguish the question whether a would-be blamer has the standing to blame from the question whether her criticism is true. What must an account of lost standing do in order to avoid making standing so hard to retain that almost nobody has it, and so easy to lose that nothing turns on the concept?

  The departmental rubric divides the 30 marks as follows: accurate exposition of the distinction between standing and the truth of the criticism, 8; a reasoned account of what undermines standing, 8; critical evaluation of that account, including at least one objection developed rather than merely mentioned, 8; structure, relevance and clarity, 6. The band descriptors are: 24–30, identifies a position and argues for it; 20–23, accurate and well organised, but critical claims asserted rather than argued; 16–19, accurate in outline, with some confusion or unsupported moves; 12–15, partially addresses the question; below 12, substantially off-target. Engagement with the secondary literature is not required, and its absence should not be penalised. Here is one of the forty-three scripts, reproduced in full and paragraph-numbered so that comments can be keyed to it:

  > [1] The statement in the title is not, at first sight, an objection to any moral criticism. If I tell you that you were wrong to break your promise, the fact that I have broken promises myself does nothing to show that promise-breaking was not wrong of you. Offered as a way of rebutting a charge, "and so do you" is the tu quoque, and it is a fallacy: it attacks whoever makes a claim instead of the claim. The question of standing is different. It is a question about the position from which a true claim may properly be pressed. A hypocrite's condemnation can be wholly accurate and still be something she is in no position to make. This is why the standing objection is interesting: it concedes the truth of the charge and objects to the making of it.
  >
  > [2] The most natural explanation of the loss of standing appeals to inconsistency. What is objectionable about the hypocrite is not that she has done the wrong. If merely having done it were enough, standing would be unattainable for anyone who has ever done anything blameworthy, and the concept would collapse, since nobody could then blame anybody for anything. That is a reductio of the simple version. What goes wrong instead is that she applies to another a standard she does not apply to herself. Blame holds an agent to a standard that is supposed to be shared; a blamer who exempts herself in a like case is not appealing to a shared standard but marking herself out as outside it, and her criticism is then not inconsistent with the truth of the charge but inconsistent with her own participation in the practice of holding one another to standards.
  >
  > [3] The same reasoning is usually extended to cases in which the would-be blamer has not herself done the thing. If I paid you to do it, encouraged you in it, or have profited from your doing it without trying to stop it, I am involved in the very wrong I now condemn, and involvement is what undermines standing. There is no principled difference, so far as standing goes, between commissioning a wrong and committing it; an account that treats them differently is being arbitrary.
  >
  > [4] It is worth pressing the argument further. If blame consists in holding someone to a standard one also accepts, then a blamer who exempts herself is not making a defective demand but no demand at all: her words are not blame, and cannot be, but only the expression of a wish that someone else behave differently, or an attempt to gain advantage over them. On this view the hypocrite does not blame badly; she does not blame. That explains why the intuition against her is so strong, and why it is tempting to think that her criticism simply falls away.
  >
  > [5] Standing must also be all-or-nothing if it is to do this work. To say that one blamer has more standing than another is to change the subject: the question is whether one is entitled to make the address, and entitlements are not graded. Talk of diminished standing describes how unwelcome or how offensive a criticism is likely to be, which is a question about its reception rather than its propriety.
  >
  > [6] Finally, the upshot for the person being blamed. Because the hypocrite cannot consistently press her criticism, the one she blames is entitled to discount it, and to treat it as carrying no weight until the blamer has put her own house in order. Strictly, that is not to concede that what she did was permissible; but she has not been shown to have done wrong by anyone entitled to show it, and in ordinary moral practice that is as good as an answer to the charge. The standing objection thus has real force: it is not merely a complaint about the manner of a criticism, but a reason for the criticised party to set the criticism aside.

  I have not yet written my own feedback on this script, and I would rather not be anchored by anything I have already formed, so please treat this as a blind marking exercise and do not assume that I regard the answer as either strong or weak. Marks are moderated against the other teaching assistant's, who has a reputation for generosity, so my comments need to be specific enough to defend the mark at the board. I would like: (a) a mark out of 30, itemised across the four rubric components, with one or two sentences of justification for each item; (b) paragraph-by-paragraph feedback keyed to [1]–[6], written in the register the student would actually read, two to four sentences each, saying what works and what costs marks; (c) a separate list of every substantive philosophical mistake in the script, each entry stating what the mistake is, what the correct position is, and which of three categories it falls into — an error of exposition, a step that does not follow, or a claim asserted where the question required argument; and (d) an explicit judgement on the relation between [1] and [6], namely whether the tension between them is a slip that a competent student might make under time pressure or a substantive misunderstanding of what the standing objection is supposed to establish, together with what the student would have had to add to [6] to make it consistent with [1]. Please also say, concretely, what would move the script into the next band up, and flag anything creditworthy that a hurried reading might undervalue. Do not comment on the exam question itself, do not offer a reading list or cite literature, and do not soften the mark for politeness. Write your response in British English.
reasoning: |-
  Hmm, the user is a graduate teaching assistant marking an ethics exam script. They need detailed feedback on a student's essay about moral standing and hypocrisy, following a specific rubric. The student's answer is paragraph-numbered for reference.

  First, I need to assess the script against the rubric: accurate exposition of standing vs truth (8 marks), reasoned account of lost standing (8), critical evaluation (8), and structure/clarity (6). The band descriptors range from 24-30 (argued position) down to below 12 (off-target). 

  Looking at paragraph [1]: The student correctly distinguishes standing from truth, framing hypocrisy as about position rather than rebutting the charge. Strong start. [2] Builds a reasoned case - avoids the "simple version" reductio, focuses on inconsistency in applying standards. [3] Extends to involvement cases appropriately. [4] Takes the argument further with the "not blame at all" claim. [5] Handles all-or-nothing aspect well. [6] Explains consequences for the blamed person.

  But there's a tension between [1] and [6]: [1] says standing concedes truth, while [6] suggests the criticized can "set aside" the criticism as if it lacks weight. This needs addressing in feedback. The critical evaluation is also underdeveloped - only one implied objection (about graded standing) without proper argument.

  For marks: Exposition is excellent (8/8). Account of lost standing is reasoned but misses some nuance (7/8). Critical evaluation is thin - assertion without argument (5/8). Structure is clear but [6] undermines [1] slightly (5/6). Total 25/30, band 24-30.

  Notable positives: Precise tu quoque distinction, clean reductio handling, involvement extension. The "not blame at all" point in [4] is creditworthy but needs more support.

  To reach next band: Fix the [1]-[6] tension and develop critical evaluation - e.g., challenge the "all-or-nothing" claim or test the account with counterexamples. Philosophical mistakes are few but include conflating discounting criticism with negating truth in [6], and insufficient argument for the strong claim in [4].

  Feedback should praise strengths while pinpointing where marks were lost, especially the evaluation gap and the consistency issue. Suggestions must be concrete - e.g., "In [6] clarify that discounting doesn't negate truth" or "In evaluation, argue why graded standing might matter".
answer: |-
  ### (a) Mark and Justification (Total: 25/30)
  1. **Accurate exposition of distinction (8/8)**: Precisely distinguishes standing (position to press a claim) from truth of criticism, using *tu quoque* fallacy to clarify.  
  2. **Reasoned account of lost standing (7/8)**: Builds a coherent account around inconsistency in applying standards and involvement, avoiding reductio. Minor deduction for underdeveloping "involvement" extension.  
  3. **Critical evaluation (5/8)**: Identifies an objection (graded standing) but asserts rather than argues it. Lacks developed counterargument or scrutiny of core claims.  
  4. **Structure, relevance, clarity (5/6)**: Logically organised and focused, but [6] introduces tension with [1] (see below), slightly undermining coherence.  

  ---

  ### (b) Paragraph Feedback (to Student)  
  **[1]**: Excellent opening. You sharply distinguish standing from truth by framing hypocrisy as about *authority* not accuracy, using *tu quoque* effectively. This sets up the essay’s core distinction cleanly.  
  **[2]**: Strong reasoning here. Your rejection of the "simple version" (loss via any blameworthy act) via reductio is persuasive, and the shift to inconsistency in applying standards is well-motivated. This is the essay’s analytical core.  
  **[3]**: Valid extension to involvement cases (commissioning/profiting), correctly noting arbitrariness in treating them differently. However, this needed slightly more justification: *why* is there "no principled difference"? A sentence would have strengthened this.  
  **[4]**: Ambitious and insightful claim that hypocrisy negates blame *itself*. While philosophically interesting, this strong assertion lacks argumentative support here. Why must blame entail a "demand"? This needed development to avoid seeming speculative.  
  **[5]**: Clear defence of all-or-nothing standing. Your objection to "diminished standing" as conflating propriety with reception is apt. However, presenting this as the *only* view needed engagement with potential counterarguments (e.g., whether standing admits degrees).  
  **[6]**: Practically astute on the criticised party’s entitlement to discount criticism. Yet your claim that this is "as good as an answer to the charge" risks conflating dismissal of the *blamer* with refutation of the *charge*, subtly undermining [1].  

  ---

  ### (c) Substantive Philosophical Mistakes  
  1. **Mistake**: In [6], stating the criticised party can treat the criticism as "carrying no weight" and it being "as good as an answer to the charge" implies the criticism loses normative force.  
     **Correct Position**: The standing objection challenges the *blamer's authority*, not the truth or weight of the criticism. The act remains wrong; the issue is who may blame.  
     **Category**: Step that does not follow (inconsistent with [1]).  
  2. **Mistake**: In [4], claiming the hypocrite "does not blame" (only expresses a wish/advantage) is asserted without argument.  
     **Correct Position**: This requires justification (e.g., why blame *must* involve reciprocal commitment to standards). One could argue hypocrites *do* blame, but illegitimately.  
     **Category**: Claim asserted where argument required.  
  3. **Mistake**: In [3], asserting "no principled difference" between committing/commissioning wrongs re: standing, without explaining the principle.  
     **Correct Position**: While defensible, this needs grounding (e.g., "involvement equally violates the reciprocity blame presupposes").  
     **Category**: Step that does not follow (missing premise).  

  ---

  ### (d) Judgement on [1] vs [6]  
  The tension is a **substantive misunderstanding**. [1] correctly states the standing objection concedes the truth of the charge, while [6] implies discounting the criticism functionally negates its force ("as good as an answer"). This conflates rejecting the *messenger* with rejecting the *message*. To reconcile:  
  - **Needed addition to [6]**: Explicitly state that while the criticised party may *ignore the hypocrite*, this does not absolve the act’s wrongness or preclude justified blame from others. E.g.: "This does not mean the act was permissible, only that the hypocrite lacks authority to insist on accountability."  

  ---

  ### Additional Notes  
  - **To reach next band (26–30)**: Develop the critical evaluation (e.g., argue *why* the all-or-nothing view might be contested, or test the account against a counterexample like non-hypocritical beneficiaries of wrongdoing). Resolve the [1]–[6] tension.  
  - **Creditworthy but easily missed**:  
    - The "not blame at all" argument in [4] is original and philosophically acute (though under-argued).  
    - The link between blame and "shared standards" in [2] is elegantly tied to moral practice.  
    - Reductio against the "simple version" is efficiently deployed.  

  **Final Mark**: **25/30** (Band: 24–30 – "identifies a position and argues for it", but critical evaluation lacks depth).
