  Finally, I need to map the logical space as a grid showing empty quadrants and explain why they're empty, plus identify any indistinguishable leaf pairs and nodes where different tests would diverge.

  The response should be structured in six sections: usage instructions, the node tree, leaf definitions, worked examples, grid analysis, and limitations. Language must remain accessible to a 16-year-old without philosophy jargon. No bibliography - just practical application.

