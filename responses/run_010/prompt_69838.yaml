  For Newton vs Fomenko, the tree should distinguish between methodologically sound revisionism (Newton) versus evidence-denying pseudohistory (Fomenko) based on how they treat contradictory data. The Nazca example will demonstrate how reproduction with period tools routes to "Legit Rebel" despite initial strangeness.

  The grid will show why "sound but dishonest" claims are rare (who bothers?), while "unsound but honest" covers sincere mistakes. True pseudohistory occupies the "unsound and dishonest" quadrant when proponents keep moving goalposts.
answer: |-
  ### 1. How to use the tree
  When a classmate sends you a video making a claim about history, watch it carefully. Start at Question 1. Answer each question based *only* on what the video says or shows. Be honest – don’t guess what the "right" answer should be. Follow the branches based on your answers until you reach a verdict. The verdict tells you what *kind* of claim you’re dealing with, not necessarily if it’s true or false. This helps you respond thoughtfully instead of just saying "that’s fake."

  ### 2. The nodes
  **(Start)**
  1.  **Does the presenter *explicitly* say they are telling a story for fun, teaching a lesson, or describing a belief (like a myth), not reporting facts?**
      *   **Yes ➔ Leaf A: Campfire Tale**
      *   **No ➔ Question 2**
  2.  **Does the presenter seem to be trying to trick you, or could you easily catch them lying about basic facts shown in the video? (e.g., mislabeling objects, faking documents, ignoring clear contradictions they create)**
      *   **Yes ➔ Leaf B: Straight-Up Lie**
      *   **No ➔ Question 3**
  3.  **Is the main claim actually two different ideas stuck together? (e.g., "This ancient city *was destroyed by a flood* AND *that flood is described in my holy book exactly as it happened*")**
      *   **Yes ➔ Leaf C: Double-Decker Claim**
      *   **No ➔ Question 4**
  4.  **Has the presenter (or anyone they cite) *ever* said, "If we found X, I would admit this whole idea is wrong"?**
      *   **Yes ➔ Question 5**
      *   **No ➔ Question 7**
  5.  **Has anyone actually *looked* for that "X" thing that would prove them wrong? And if they looked and didn't find it, did the presenter *accept* that as a problem instead of making excuses?**
      *   **Yes, they looked & the presenter accepted a negative result ➔ Question 6**
      *   **No, they didn't look, OR they looked, didn't find it, and the presenter made excuses ➔ Question 7**
  6.  **Has someone shown that the puzzling evidence *could* have been made using tools and knowledge we *know* people had at the time? (e.g., rebuilt the thing using old methods)**
      *   **Yes ➔ Leaf D: Legit Rebel**
      *   **No ➔ Leaf D: Legit Rebel** (It's still methodologically sound even if not proven false *yet*)
  7.  **Would accepting this claim force us to throw out a *huge* amount of evidence from different, unrelated fields? (e.g., physics dating methods, tree rings, coins, pottery styles, foreign records ALL agreeing on a timeline the claim contradicts)**
      *   **Yes, it throws out mountains of unrelated evidence ➔ Question 8**
      *   **No, it mainly argues within its own bubble or against one type of evidence ➔ Question 9**
  8.  **When faced with all that contradicting evidence, does the presenter mostly attack the scientists/methods personally, or say the evidence must be faked?**
      *   **Yes, lots of "they're all lying/conspiring" or "that science is fake" ➔ Leaf F: Fake History**
      *   **No, they try (even if badly) to explain *why* the other evidence might be misinterpreted ➔ Leaf D: Legit Rebel** (Just very unpopular!)
  9.  **Does the idea lead people to do new experiments, dig at new sites, or re-examine old evidence in a careful way looking for *specific* new clues?**
      *   **Yes, it generates real research ➔ Leaf E: Fun Maybe**
      *   **No, it mostly just rehashes the same old puzzles ➔ Leaf F: Fake History**

  ### 3. The leaves
  *   **A. Campfire Tale:** A myth or story told for meaning, not facts. *Awkward Commitment:* People later might mistakenly believe it literally happened.
  *   **B. Straight-Up Lie:** A deliberate hoax or fraud. *Awkward Commitment:* The creator knows the truth but chooses deception.
  *   **C. Double-Decker Claim:** Two separate claims presented as one inseparable idea. *Awkward Commitment:* You have to untangle them before you can even discuss either properly.
  *   **D. Legit Rebel:** A sincere, testable challenge to mainstream history that just hasn't won much support from the evidence *yet*. *Awkward Commitment:* It might be correct but look silly for decades until new evidence appears.
  *   **E. Fun Maybe:** An untestable (or hard-to-test) speculation that still inspires real exploration or research. *Awkward Commitment:* It might never be proven right or wrong, but it sparks curiosity.
  *   **F. Fake History (Pseudohistory):** A claim that avoids being proven wrong by ignoring evidence, attacking critics, or making endless excuses. *Awkward Commitment:* It demands you distrust almost all experts and methods to believe it.

  ### 4. Three worked examples, plus Newton

  *   **Atlantis (Literal Bronze Age Civilization):**
      1.  No (presented as fact). 2. No (usually not overt fraud). 3. Sometimes, but core claim is single. ➔ 4. Usually No (rarely specify a falsifying discovery). ➔ 7. **Yes** (Discards geology, archaeology, Bronze Age records showing no gap). 8. **Yes** (Often dismisses archaeologists as hiding truth). ➔ **Leaf F: Fake History**

  *   **Nazca Lines for Ancient Astronauts:**
      1.  No. 2. No. 3. Often ("Lines exist" + "Made for aliens"). ➔ **Leaf C: Double-Decker Claim** (The *purpose* is the speculative part). *But even if taken as single claim:* 4. Sometimes yes (e.g., "If we find no Nazca artifacts showing sky-gazing culture"). 5. **Yes** (Culture *did* have sky-gazing artifacts). Also, 6. **Yes** (Reproduced with period tools/crew). ➔ **Leaf D: Legit Rebel** (The 'alien purpose' part fails, but the core claim about how they were made is testable and challenged mainstream assumptions initially).

  *   **Fomenko's New Chronology:**
      1.  No. 2. No (sincere, but wrong). 3. Complex, but core is single. ➔ 4. Technically yes (e.g., consistent dendrochronology/radiocarbon dates could falsify). 5. **No** (Dismisses dendro/radio as circular/consensus, doesn't accept counter-evidence). ➔ 7. **Yes** (Discards ALL physics dating, dendrochronology, ice cores, archaeology, numismatics, non-European records). 8. **Yes** (Claims massive medieval conspiracy/forgery). ➔ **Leaf F: Fake History**

  *   **Newton's Chronology:**
      1.  No. 2. No. 3. No (focused on re-dating events). ➔ 4. Implicitly yes (based on evidence). ➔ 7. **Yes** (Discarded some ancient king lists & biblical interpretations). 8. **No** (He argued his *interpretation* of texts was better; he didn't claim physics or archaeology was a conspiracy). He accepted mainstream methods but drew different conclusions from specific texts. ➔ **Leaf D: Legit Rebel** (Methodologically ordinary for his time, evidence didn't support it).

  ### 5. The grid and the empty squares
  |                   | **Honest**                              | **Dishonest**                     |
  | :---------------- | :-------------------------------------- | :-------------------------------- |
  | **Sound Method**  | D: Legit Rebel                          | *Empty*                           |
  |                   | E: Fun Maybe (if untestable)            |                                   |
  | **Unsound Method**| E: Fun Maybe (if testable-ish)          | F: Fake History                   |
  |                   | *Empty*                                 | B: Straight-Up Lie                |
  | **Not Fact Claim**| A: Campfire Tale                        | *(N/A - Not claiming facts)*      |
  | **Conflated Claim**| C: Double-Decker Claim                 | C: Double-Decker Claim (can be either) |

  *   **Empty (Sound Method / Dishonest):** Why? Someone using sound methods (testable, evidence-based) *while* deliberately lying is rare and pointless. If you're dishonest, why bother with sound methods? Hoaxers (Leaf B) usually use *un*sound methods or forge evidence.
  *   **Empty (Unsound Method / Honest):** Why? This combination *is* possible (e.g., a sincere person trapped in conspiracy thinking). However, the tree routes "Honest but Unsound" claims to either **Leaf E (Fun Maybe)** if they don't discard massive evidence or inspire research, or **Leaf F (Fake History)** if they *do* discard massive evidence and attack critics. The "Unsound Method / Honest" box is covered by parts of E and F.

  ### 6. What this tree cannot separate
  *   **Legit Rebel (D) vs. Fake History (F) when evidence is ambiguous:** If a claim discards *some* evidence but not "mountains" (Node 7), and avoids personal attacks (Node 8), it goes to D. If evidence is hotly contested, D might be premature, but F requires active unsound tactics.
  *   **Fun Maybe (E) vs. Fake History (F) for low-effort ideas:** An untestable claim that generates *no* research (Node 9 = No) goes to F. But is it *pseudohistory* or just *lazy speculation*? The tree calls it F based on lack of productive engagement.
  *   **The Critical Node:** Node 4/5 ("Could it be shown false?") vs. Node 9 ("Does it produce new findings or just excuses?"). Take Atlantis: It usually fails Node 4 (No falsifiability), sending it towards F. But *if* someone proposed a specific test (e.g., "If core samples show no Atlantic cataclysm layer dated 10k BC, I'm wrong") *and* that test was done (negative) *and* they accepted it, it *could* be D (Legit Rebel). However, Node 9 (Does it spark research?) – Atlantis *has* sparked oceanography/geology (E: Fun Maybe?), but proponents rarely accept negative results, pulling it back to F. The same claim could hit different leaves depending on *which* aspect (testability vs. productivity) you focus on at Nodes 4/5 vs. 9.
