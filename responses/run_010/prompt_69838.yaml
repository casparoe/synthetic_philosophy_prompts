  The user's constraints are clear: every node must be answerable from the video without specialized vocabulary. They want to avoid dismissive responses like "that's pseudohistory" and instead provide nuanced verdicts. The axes of epistemic soundness and honesty must remain distinct throughout. The tree must include nodes about what evidence would need to be discarded and whether ordinary explanations using period tools exist.

  For the leaves, I need six categories with teenager-friendly names. These should cover: deliberate fraud, pure myth, conflation of claims, legitimate heterodoxy, untestable speculation, and pseudohistory proper. Each needs a one-sentence description of its "most awkward commitment."

