  As a Careenium theorist, I concede that in all three runs, the latch's response tracks arrangement *because of how the latch is physically constructed*. But the shoving is still done by simmball collisions with the latch's trigger mechanism. In R1, the specific collisions between the arriving simmballs and the latch's sensitive bumpers/channels (which constitute the template) transfer momentum, mechanically releasing the volley. In R2, despite the mass/speed differences, the *positions* of the impacting simmballs relative to the latch's trigger points fall within the physical tolerance built into those bumpers/channels, causing functionally equivalent collision sequences on the latch's internal release mechanism. In R3, collisions occur, but the shuffled positions mean the impacts hit insensitive parts of the latch or fail to simultaneously engage the critical release sequence – no shoving happens *on the specific points that matter*. Arrangement isn't a separate shover; it's a description of *where and how* the collisions occur relative to the latch's fixed structure. The latch fires when collisions happen on its sensitive zones in the right spatiotemporal order – that's the only shoving.

  You ask for a test to distinguish shoving facts from abbreviating facts. Here it is: **Alter a single, non-critical simmball in an arriving pattern.** If I chip one peripheral simmball in arrangement A (mass 96%, speed 104%) but keep it within the latch's positional tolerance, the latch still fires – the collisions on the *critical* trigger points are unchanged. This shows the shoving is done by the *actual collisions on the specific physical trigger points*. The "arrangement" abstracts away this peripheral simmball because *its collisions weren't doing the critical shoving anyway*. The arrangement "fact" (A) abbreviates the fact that the *core* collision points occurred correctly. The grain isn't arbitrary – it's physically dictated by which collisions the latch's structure mechanically responds to. The chamber "carves" it because the latches are built that way, but the work is still done by specific sphere-to-structure impacts. Show me an arrangement shoving something *without* simmballs colliding with matter, and I'll concede. You can't, because nothing else moves in there. The pattern isn't a force; it's a condition met *by* collisions.
