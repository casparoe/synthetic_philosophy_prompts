  ### Quantitative Appendix: Standing Case Calculations  
  *Wealth dynamics: Multiply by \(1 + 0.6f\) on win (prob. 0.55), \(1 - 0.3f\) on loss (prob. 0.45).*

  - **Growth-optimal stake \(f^*\)**:  
    Maximise \(g(f) = 0.55 \ln(1 + 0.6f) + 0.45 \ln(1 - 0.3f)\).  
    Solve \(g'(f) = 0\):  
    \[
    \frac{0.55 \times 0.6}{1 + 0.6f} = \frac{0.45 \times 0.3}{1 - 0.3f} \implies f^* \approx 1.083 \quad (108.3\%)
    \]  
  - **Per-round compounded growth rates**:  
    - At \(f^*\): \(g(1.083) = 0.55 \ln(1.65) + 0.45 \ln(0.675) \approx 0.09856\) (9.856\%)  
    - At \(f = 1.0\): \(g(1.0) = 0.55 \ln(1.6) + 0.45 \ln(0.7) \approx 0.09800\) (9.800\%)  
    - At \(f = 0.5417\): \(g(0.5417) = 0.55 \ln(1.325) + 0.45 \ln(0.8375) \approx 0.07505\) (7.505\%)  
  - **Expected arithmetic return**:  
    \(\mathbb{E}[\text{return}] = 0.55(1 + 0.6f) + 0.45(1 - 0.3f) = 1 + 0.195f\)  
    - At \(f^*\): \(1 + 0.195 \times 1.083 \approx 1.211\) (21.1\%)  
    - At \(f = 1.0\): \(1 + 0.195 \times 1 = 1.195\) (19.5\%)  
    - At \(f = 0.5417\): \(1 + 0.195 \times 0.5417 \approx 1.106\) (10.6\%)  

  *Improvement from \(f=1.0\) to \(f^*=1.083\): \(\Delta g \approx 0.00056\) (5.6 basis points/round), <0.001 (10 bps).*  
  *Worst outcome at \(f^*\): \(1 - 0.3 \times 1.083 = 0.675\) (32.5% loss).*
