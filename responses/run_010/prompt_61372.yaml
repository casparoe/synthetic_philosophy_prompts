  We are given a standing case with the following parameters:
   - Probability of win (p) = 0.55
   - Win multiplier (b) = 0.6 (so wealth multiplied by 1 + 0.6f on win)
   - Loss multiplier (a) = -0.3 (so wealth multiplied by 1 - 0.3f on loss) [Note: the stake is reduced to 0.7 of its size, meaning a loss of 0.3 of the staked amount, hence the factor is 1 - 0.3f]

  The wealth multiplicative factors are:
   - Win: 1 + 0.6f
   - Loss: 1 - 0.3f

  The Kelly criterion maximizes the expected logarithm of wealth growth. The growth rate per round is:

  g(f) = p * log(1 + bf) + (1-p) * log(1 + a f)

  In our case, b = 0.6, a = -0.3 (but note: a is negative, so we write the loss term as log(1 - 0.3f)).

  Thus:
  g(f) = 0.55 * log(1 + 0.6f) + 0.45 * log(1 - 0.3f)

  We need to find the f that maximizes g(f). We take the derivative and set to zero.

  g'(f) = 0.55 * (0.6)/(1+0.6f) + 0.45 * (-0.3)/(1-0.3f) = 0

  So:
  0.55 * 0.6 / (1+0.6f) = 0.45 * 0.3 / (1-0.3f)

  Simplify:
  0.33 / (1+0.6f) = 0.135 / (1-0.3f)

  Cross-multiply:
  0.33 * (1-0.3f) = 0.135 * (1+0.6f)

  0.33 - 0.099f = 0.135 + 0.081f

  0.33 - 0.135 = 0.081f + 0.099f

  0.195 = 0.18f

  f = 0.195 / 0.18 = 1.08333...

  So the optimal Kelly fraction is approximately 1.0833 (or 108.33% of current wealth). This requires leverage.

  Now, we compute the growth rates at several points:

  1. Optimal stake (f* = 1.0833)
     g(1.0833) = 0.55 * log(1 + 0.6*1.0833) + 0.45 * log(1 - 0.3*1.0833)
     First, compute:
        1 + 0.6*1.0833 = 1 + 0.65 = 1.65
        1 - 0.3*1.0833 = 1 - 0.32499 = 0.67501
     Then:
        = 0.55 * log(1.65) + 0.45 * log(0.67501)
        = 0.55 * 0.500775 + 0.45 * (-0.393042)   [using natural log? The base doesn't matter for maximization, but we'll use natural log for calculation]
        = 0.55 * 0.500775 ≈ 0.27542625
        = 0.45 * (-0.393042) ≈ -0.1768689
        Sum ≈ 0.27542625 - 0.1768689 = 0.09855735

     So growth rate ≈ 0.09856 (or about 9.856% per round)

  2. Full unlevered stake (f=1.0)
     g(1.0) = 0.55 * log(1.6) + 0.45 * log(0.7)
             = 0.55 * 0.47000 + 0.45 * (-0.35667)   [log(1.6)≈0.47000, log(0.7)≈-0.35667]
             ≈ 0.55*0.47000 = 0.2585
             ≈ 0.45*(-0.35667) = -0.1605015
             Sum ≈ 0.2585 - 0.1605015 = 0.0979985 ≈ 0.09800 (or about 9.800% per round)

  3. Half the optimal stake (f = 1.0833/2 ≈ 0.54165)
     g(0.54165) = 0.55 * log(1 + 0.6*0.54165) + 0.45 * log(1 - 0.3*0.54165)
                 = 0.55 * log(1 + 0.32499) + 0.45 * log(1 - 0.162495)
                 = 0.55 * log(1.32499) + 0.45 * log(0.837505)
                 ≈ 0.55 * 0.28159 + 0.45 * (-0.17739)   [log(1.32499)≈0.28159, log(0.837505)≈-0.17739]
                 ≈ 0.55*0.28159 = 0.1548745
                 ≈ 0.45*(-0.17739) = -0.0798255
                 Sum ≈ 0.1548745 - 0.0798255 = 0.075049 ≈ 0.07505 (or about 7.505% per round)

  Now, the expected one-round arithmetic return for a given f is:
  E[return] = p*(1 + 0.6f) + (1-p)*(1 - 0.3f) = 1 + 0.6f*p - 0.3f*(1-p)
             = 1 + 0.6f*0.55 - 0.3f*0.45
             = 1 + 0.33f - 0.135f
             = 1 + 0.195f

  So at the optimal Kelly stake (f=1.0833):
     E[return] = 1 + 0.195*1.0833 ≈ 1 + 0.2112435 = 1.2112435

  At full unlevered stake (f=1.0):
