  The redesign challenge is thorny. If dike-building is just "cautious temperament suiting calm times," virtù collapses into luck. But maybe the key is distinguishing between temperament (passive) and strategy (active). Machiavelli's "always prospered one way" point could indeed undermine this—if preparation works once, wouldn't the builder rigidify? 

  I'll design cases where: 
