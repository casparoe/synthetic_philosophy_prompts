  The user wants three original fictional cases: 
  1) Dike-building (preparatory virtù paying off)
  2) Temperament luck (success purely from accidental alignment)
  3) Dike-building backfiring (preparations causing ruin when times change)

  Plus analysis: Can case 1 be reduced to case 2? What survives of virtù if so?

