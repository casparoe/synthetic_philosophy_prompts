  ### Decision Tree for "Would" Claims

  This instrument sorts positions on what makes a claim like "this would happen if that were done" true of a thing. It uses concrete cases to avoid philosophical jargon. Answer the questions based on your intuitions about the scenarios. The tree has 7 questions and 12 leaves, covering all requested views and cases (wire, sleeve, sorcerer, pill, untestable). Each leaf delivers a verdict on the five cases using the specified format.

  #### How to Use
  - Start at Question 1.
  - At each question, choose an option based on the scenario.
  - Follow the path to the next question or a leaf.
  - At a leaf, read the thesis and verdicts. The verdicts are:
    - **PP-WT**: Property present, "would" true.
    - **PP-WF**: Property present, "would" false.
    - **AP-WT**: Property absent, "would" true.
    - **AP-WF**: Property absent, "would" false.
    - **NoDA**: No determinate answer without context.

  ---

  **Question 1: Wire Case**  
  A wire would let electricity flow if touched, but it has an attached device that instantly cuts the current when touched. So if you touch it, no electricity flows. Does the wire have the property of being electrically conductive?  
  - **Yes**: Go to Question 2. (Believes interference doesn't negate the property)  
  - **No**: Go to Question 3. (Believes the failed test means no property)  
  *Why it separates:* Distinguishes views that prioritize intrinsic traits or ideal conditions from those that focus on actual test outcomes.

  **Question 2: Pill Case (after "Yes" to wire)**  
  A pill would dissolve in water, but it contains an internal substance that makes it instantly inert when wet. So if you put it in water, it doesn't dissolve. Does the pill have the property of being water-soluble?  
  - **Yes**: Go to Leaf 1: Ideal Disposition. (Property holds in ideal conditions)  
  - **No**: Go to Question 4. (Internal interference matters)  
  *Why it separates:* Splits views that ignore internal interference from those that see it as property-denying.

  **Question 3: Sorcerer Case (after "No" to wire)**  
  A sturdy glass wouldn't break if struck alone, but a sorcerer watches it and shatters it the instant anyone strikes it. So if you strike it, it breaks. Is the glass fragile?  
  - **Yes**: Go to Leaf 2: Simple Conditional Analysis. (Outcome defines the property)  
  - **No**: Go to Question 5. (Outcome is due to external causes)  
  *Why it separates:* Separates views that define properties by outcomes from those that require internal causes.

  **Question 4: Sleeve Case (after "No" to pill)**  
  A glass would break if struck, but it's always in a foam sleeve that absorbs impacts. If you strike it in the sleeve, it doesn't break. If you take it out and strike it, it breaks. While in the sleeve, is the glass fragile?  
  - **Yes**: Go to Question 6. (Property persists despite external interference)  
  - **No**: Go to Leaf 3: Ceteris Paribus Conditional. (Property requires ideal test conditions)  
  *Why it separates:* Isolates views that see external interference as irrelevant from those that demand unspoiled test conditions.

  **Question 5: Sleeve Case (after "No" to sorcerer)**  
  Same as Question 4. While in the sleeve, is the glass fragile?  
  - **Yes**: Go to Question 7. (Property is context-sensitive)  
  - **No**: Go to Leaf 4: Humean Regularity. (Properties are patterns of events)  
  *Why it separates:* Divides context-relative views from pattern-based views.

  **Question 6: Sorcerer Case (after "Yes" to sleeve in Q4)**  
  Same as Question 3. Is the glass fragile?  
  - **Yes**: Go to Leaf 5: Context-Relative Ascription. (Property depends on comparison)  
  - **No**: Go to Leaf 6: Intrinsic Properties. (Property is about internal makeup)  
  *Why it separates:* Separates context-dependence from intrinsicness.

  **Question 7: Untestable Case (after "Yes" to sleeve in Q5)**  
  A thing has a property that can't be tested because testing destroys it (e.g., a particle that would decay if left alone, but observation prevents decay). Can we say it has the property?  
  - **Yes**: Go to Leaf 7: Realism About Dispositions. (Property is real and irreducible)  
  - **No**: Go to Leaf 8: Pan-Dispositionalism. (All properties are active powers)  
  - **Depends**: Go to Leaf 9: Context-Relative Ascription. (Case-dependent)  
  *Why it separates:* Splits realist views from eliminativist or context-relative ones.

