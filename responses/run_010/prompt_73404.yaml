  For the residue report, I'll need to identify clean mappings first: the optimization framing works well for compossibility-as-constraints and evil-as-Parto-dominance. But Leibniz's "perfection" metric resists scalarization—it's more like a preorder where solutions are comparable but not rankable by a single function. The metaphysical baggage (e.g., why God must choose) doesn't translate. 

