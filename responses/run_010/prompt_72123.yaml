answer: |-
  This pattern is a fascinating and under-discussed phenomenon in philosophical disputes and everyday arguments. It combines elements of verbal disputes, metalinguistic negotiation, and semantic externalism but isn't fully captured by any single concept. Below is a systematic carving, including near-miss concepts, a principled reason for termination (or its absence), and a new coinage if needed.

  ---

  ### **1. Nearest Established Concepts & How They Differ**
  **(Ordered by closeness of fit)**

  - **Verbal Dispute** (e.g., David Chalmers):  
    - **What it is**: A disagreement where parties agree on non-linguistic facts but use words differently.  
    - **Fit**: Perfectly describes the **initial dissolution** when the term is taboos.  
    - **Difference**: Fails to explain the **reignition at the meta-level**. Verbal disputes typically end once the equivocation is exposed, but here, the dispute shifts to "what the term *really* means" as if it's a factual question.  

  - **Metalinguistic Negotiation** (e.g., Plunkett, Sundell):  
    - **What it is**: A disagreement about how a term *should* be used (e.g., for normative or practical purposes).  
    - **Fit**: Explains why disputants appeal to "ordinary usage" or "purpose," as they’re negotiating linguistic norms.  
    - **Difference**: In your pattern, both parties **deny they are negotiating**; they insist they’re describing a pre-existing meaning ("X *is* the correct usage"), treating it as objective. Metalinguistic negotiation usually involves explicit proposals, not factual claims.  

  - **Essentially Contested Concept** (Gallie):  
    - **What it is**: Concepts (e.g., "democracy") with intractable disputes because their definitions embody value judgments.  
    - **Fit**: Explains persistent disagreement, but focuses on **value-laden terms**.  
    - **Difference**: Your pattern occurs even with **non-evaluative terms** (e.g., "net zero," "understands English"). The dispute is about semantic authority, not values.  

  - **Criterial vs. Dispositional Meaning** (Putnam):  
    - **What it is**: Disputes where meaning relies on external "experts" (e.g., scientists for "water") vs. speaker dispositions.  
    - **Fit**: Explains appeals to "technical usage" or "careful speakers."  
    - **Difference**: Your pattern includes **multiple competing authorities** (ordinary usage, technical usage, purpose), and disputants treat *which authority matters* as factual.  

  - **Semantic Externalism** (Kripke, Putnam):  
    - **What it is**: Meaning is determined by external factors (e.g., causal history, community use).  
    - **Fit**: Underlies why parties see meaning as "discoverable."  
    - **Difference**: Doesn’t explain the **regress**; externalism doesn’t entail that disputes over meaning *must* reignite meta-linguistically.  

  **Verdict**: No established concept fully covers this. Metalinguistic negotiation comes closest but misses the **factual pretense** and the **infinite-regress potential**.  

  ---

  ### **2. Why the Ascent Terminates (or Doesn’t)**  
  The pattern *suggests* indefinite regress ("We disagree on meaning → Now we disagree on what determines meaning → Now we disagree on what determines *that*..."), but in practice, termination occurs for **pragmatic-epistemic reasons**:  
  - **Bedrock Intuitions**: Parties hit a level where they appeal to indefeasible intuitions (e.g., "Meaning *just is* use!"). These are treated as axiomatic, halting the ascent.  
  - **Exhausted Justifications**: Disputants run out of distinct "authorities" to cite (e.g., after debating dictionaries, experts, and intent, no new grounds remain).  
  - **Collapse into Stipulation**: One side concedes by reframing ("Fine, let’s define it this way *for now*"), though your case explicitly rules this out.  
  - **Motivational Depletion**: The argument becomes too abstract, and parties disengage.  

  **However, in principle, the regress can continue indefinitely** because each meta-level dispute replicates the structure:  
  1. Dispute about criterion C for meaning (e.g., "Is meaning determined by expert usage?").  
  2. Taboo C, revealing agreement on facts about usage patterns.  
  3. Reignition over what makes C the "correct" criterion (e.g., "Is expert usage authoritative because of social consensus or epistemic reliability?").  
  This could loop until it reaches unresolvable philosophical foundations (e.g., the nature of meaning itself).  

  ---

  ### **3. A New Coinage: Semantic Anchoring Failure**  
  Since no term suffices, I propose this label:  

  #### **Definition**  
  **Semantic Anchoring Failure** occurs when:  
  - Two parties dispute the application of a term T.  
  - The disagreement dissolves when T is tabooed (revealing factual agreement).  
  - It reignites meta-linguistically, with both parties insisting their use of T is "correct" by appealing to contested semantic authorities (e.g., usage, intent, experts).  
  - This meta-dispute exhibits the same structure as the original, creating potential regress.  
  Crucially, both parties treat "correct meaning" as **objective and discoverable**, not stipulative.  

  #### **Boundaries (What Falls Outside)**  
  - **Stipulative Disputes**: If one party says, "Let’s define T as X," it’s not SAF.  
  - **Genuine Factual Disagreements**: If tabooing T *doesn’t* dissolve the dispute (e.g., arguing whether a model "understands" where "understand" is tabooed but facts about behavior remain contested).  
  - **Pure Metalinguistic Negotiation**: If parties openly admit they’re debating how T *should* be used (e.g., "We should define ‘net zero’ strictly to avoid greenwashing").  
  - **Externalist Resolution**: If parties defer to an accepted authority (e.g., scientists defining "net zero"), ending the regress.  

  #### **Examples Inside/Outside the Concept**  
  | **Inside SAF**                                      | **Outside SAF**                                      |  
  |-----------------------------------------------------|------------------------------------------------------|  
  | Arguing whether GPT-4 "understands" English, then whether "understand" requires consciousness (treated as factual). | Agreeing to define "understand" as behavioral competence for clarity. |  
  | Disputing if a policy is "net zero," then whether "net zero" includes carbon offsets (appealing to IPCC reports as objectively decisive). | Citing an IPCC definition to resolve "net zero" authoritatively. |  
  | Reignition over whether "ordinary usage" determines meaning, then whether "ordinary" means laypeople or experts. | A terminological truce after agreeing usage is ambiguous. |  

  ---

  ### **4. Why This Pattern Matters**  
  Semantic Anchoring Failure reveals a **meta-linguistic illusion**: the treatement of meaning as fixed and descriptive when it’s often fluid and normative. It flourishes in:  
  - **Emergent Fields** (e.g., AI ethics, climate policy), where terms lack stable definitions.  
  - **Boundary Cases** (e.g., "Is Pluto a planet?"), where facts are clear but categorization is disputed.  
  - **Ideological Conflicts** (e.g., "Is this socialism?"), where meaning is weaponized.  

  Resolution requires parties to recognize the **conventional nature** of meaning and shift from "Who’s right?" to "What usage best serves our goals?"—but SAF persists precisely because this recognition is resisted.  

