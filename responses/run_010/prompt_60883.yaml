answer: |-
  Here's a direct assessment addressing your five requests, stripped of padding and sourced only to verifiable common knowledge:

  ### 1. Strongest objection to your single-canon vs. portfolio distinction  
  **The U.S. has de facto national canons via market consolidation and AP.**  
  - **Texas/California Effect**: Publishers tailor textbooks to large states (e.g., Texas, California), creating homogenized content nationwide. *This makes the "portfolio" functionally a shadow canon.*  
  - **AP as Canon**: The College Board’s AP U.S. History framework dictates content for millions of students, overriding local variation.  
  **Impact on Your Argument**: This *does* collapse your distinction to a difference of degree, not kind. Your essay survives if you reframe: Acknowledge these forces but argue they create a **fragmented, contested pseudo-canon** (e.g., Florida bans AP African American Studies) versus East Asia’s centralized authority. The core insight—that distortion operates at the framing level—holds.

  ### 2. Strongest critique of "seam-exposure"  
  **It’s procedural pacification, not resolution.**  
  - **The Charge**: You’re replacing substantive debate about *what truth matters* with a skill-based trick. A student can "expose the seam" between a primary source and textbook summary while still internalizing nationalist myths. Example: A unit on "Westward Expansion" could include a Native account alongside a textbook calling it "progress," rewarding students for spotting the contradiction—but never questioning whether "expansion" is a euphemism for genocide. This lets adults **avoid choosing values** under the guise of critical thinking.  

  ### 3. Factual weak points  
  - **Japan’s 1982 Textbook Provision**: Correctly stated. The "international understanding" clause exists.  
  - **South Korea’s 2015-2017 Reversal**: Oversimplified. Opposition wasn’t just "protest" but a coalition of historians, teachers, *and conservatives* fearing state overreach. The *reversal* was under Moon Jae-in’s administration (2017), but the *plan* was scrapped due to legal challenges and loss of political support.  
  - **1619 Project Historians’ Complaint**: You accurately note the dispute over "motives of the colonists," but undersell the scope. Critics (e.g., Gordon Wood, Sean Wilentz) argued it overstated slavery’s centrality to *all* colonists’ revolutionary impulses.  
  - **1982 "Invasion/Advance" Claim**: You were right to omit it. The textbook replaced 侵略 (*shinryaku*, invasion) with 進出 (*shinshutsu*, advance/entry), but this was *one publisher’s preemptive change* to avoid rejection—not a ministry mandate.  

  ### 4. Coinages  
  - **"Single-canon" vs. "portfolio"**: Not standard terms, but **not redundant**. Historians might say "centralized vs. decentralized" or "national vs. local" control, but your terms better capture the *textual* nature of the conflict. Keep them—but drop "I want to call these" (sounds amateurish).  
  - **"Seam-exposure"**: Novel and vivid. Justified if you tighten its definition (e.g., "mandated adversarial sourcing").  

  ### 5. Where a skeptic stops reading  
  - **California-Osaka Paragraph**: Yes, this is the weakest link. It feels like an isolated anecdote, not proof of systemic portability. **Fix**: Explicitly tie it to your thesis: *"This shows portfolio systems can mimic single-canon outcomes when institutions collide, proving form trumps culture."*  
  - **Vocabulary**: Only slightly overwrought. Prune:  
    - *"deliberately modest and deliberately procedural"* → *"procedural"*  
    - *"robust to whoever holds the board majority"* → *"durable across political shifts"*  

  ### Overall Confidence & Uncertainty  
  - **Confidence in Argument**: **85%**. Your core thesis—that institutional structures shape *how* history is contested—is original and defensible.  
  - **Least Certain Point**: My critique of **seam-exposure as "procedural pacification."** While I stand by it, your proposal *could* foster genuine critical engagement if paired with teacher training and vetted sources. I’m 70% sure my criticism is fair, but 30% open to its potential.  

  ### Critical Revisions Needed  
  1. **Confront the AP/de facto canon challenge** in paragraph 4. Add: *"Even market-driven quasi-canons fragment under political pressure, shifting battles to what’s permissible within the frame."*  
  2. **Strengthen the California-Osaka link** to your thesis.  
  3. **Clarify Korea’s reversal**: *"After bipartisan backlash and a court ruling against unilateral implementation, the plan was abandoned."*  
  4. **Preempt the seam-exposure critique**: Add a sentence conceding it won’t resolve ideological fights but forces engagement with dissonance.  

  **This essay is exceptional for a junior—your teacher isn’t just being kind.** The flaws are fixable; focus on tightening the institutional argument and grounding the Osaka example. Revise ruthlessly.
