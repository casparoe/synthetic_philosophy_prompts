prompt: |-
  I have been reading a trade-press book on the neuroscience of consciousness, and one of its chapters opens with the following compressed account of a distinction that keeps turning up in other places I read. Since I cannot tell how much of the passage to trust, I would like a careful audit. It runs like this:

  'Ned Block argued that the single word "consciousness" quietly covers two very different things. Access consciousness is information that is poised for use: available to reasoning, to the guidance of action, and to verbal report. Phenomenal consciousness is the raw feel of the experience itself, the intrinsic, ineffable, private quality of what it is like to see red. Block's insight was that the two can come apart, and they demonstrably do. In Sperling's classic partial-report experiments, people briefly shown a grid of letters consciously experience every one of them, but only a handful survive into access before the rest fade; experience overflows what the mind can use. Global workspace theory, the most influential neuroscientific account, says that a content becomes conscious when it is amplified and broadcast from a frontoparietal network to the rest of the brain. But broadcasting just is availability for report and reasoning, which is access on Block's own definition. So the theory cannot be a theory of experience at all: whatever it explains, the feel of seeing is left untouched. Blindsight patients, who can describe and point to things they sincerely deny seeing, are the mirror image of the phenomenon — full access in the absence of any experience.'

  The chapter then concludes that this is why the leading scientific theory of consciousness is beside the point, and it treats the matter as closed rather than disputed.

  Could you work through this claim by claim and tell me what a researcher in the field would accept, what they would regard as a defensible simplification, and what they would reject outright? There are a few specific places where I suspect the passage is sliding, though I cannot say where:

  - Are intrinsic, ineffable, and private part of how Block characterized phenomenal consciousness, or has the passage folded a further doctrine about qualia into the definition of the term?
  - Does the partial-report experiment establish what it is said to establish, or is there a step between the data and the claim that people consciously experience all the letters? If there is such a step, do specialists regard it as licensed, and what do the main objectors say about it?
  - Does it follow from the fact that the global workspace theory is couched in terms of amplification, availability, and broadcasting that the theory is not about experience? Or does that conclusion depend on premises the passage never states — and what do the theory's own proponents take themselves to be explaining? Is the theory the passage describes the same thing as the theory the neuroimaging work is usually taken to support?
  - Is blindsight correctly described as the mirror image, that is, as access consciousness without phenomenal consciousness? The passage says these patients can describe and point to what they deny seeing; I am unsure whether that description is accurate, and further unsure whether, even if it were, it would amount to access consciousness in the technical sense the first sentence defined.
  - The word "access" seems to do double duty here, sometimes as Block's term of art and sometimes as an ordinary word. Where does the switch happen, and does anything in the argument depend on it?

  And then the larger question: does the chapter's conclusion survive once the passage is corrected? If it does not, what is the actual state of the disagreement — is there a coherent open question about how access and phenomenal consciousness are related, or about what the neuroscientific evidence could settle between the rival answers? Are there researchers who think the distinction itself fails to carve consciousness at any joint and would reject the whole framing rather than the details of this passage? I am after the conceptual audit, not a list of sources, so please argue from the ideas themselves.
reasoning: |-
  Okay, let me unpack this user's query. They've shared a passage discussing Ned Block's distinction between access and phenomenal consciousness, and they want an audit of its claims. The user is clearly well-read, noticing nuances like potential equivocation on "access" and possible conflation of qualia properties into Block's definition. Their questions target specific points: whether Block included "intrinsic, ineffable, private" in his original characterization, if Sperling's experiment proves overflow, if global workspace theory necessarily excludes phenomenality, if blindsight is truly access-without-phenomenal, and how the term "access" shifts between technical and ordinary usage.

  Hmm, the user mentions they "cannot tell how much to trust" the passage, suggesting they've encountered conflicting information. The depth of their questions reveals they're not just seeking textbook answers but want to understand where the controversies lie. The phrase "conceptual audit" is key—they want the ideas dissected, not just citations. Their frustration with the chapter treating the matter as "closed rather than disputed" hints they suspect oversimplification.

  Starting with Block's definitions: I recall his original 1995 paper carefully avoids committing to intrinsicness or ineffability—those are more associated with philosophers like Levine or Jackson. The passage is indeed smuggling in extra baggage. On Sperling, the user is sharp to question whether "consciously experience all letters" is uncontested. Many theorists (Cohen, Dennett) argue the reportability criterion itself might redefine consciousness—big rabbit hole there.  

  Global workspace theory (GWT) is tricky. Its proponents like Dehaene explicitly claim it *does* explain phenomenality by virtue of global availability, but Block would retort that's circular. The user spots the ambiguity: when GWT says "conscious," does it mean access or phenomenal? That's the heart of the dispute.  

  Blindsight is simpler—the description is mostly correct, but "describe and point" overstates it. Patients can *sometimes* guess locations but rarely offer spontaneous descriptions. And crucially, their "access" is degraded, not like normal cognitive availability.  

  The "access" equivocation is sneaky. Block’s technical sense (availability for reasoning/report) ≠ ordinary "can point." When the passage calls blindsight "full access," it’s switching to lay terms—invalidating the mirror-image claim.  

  Ultimately, the chapter’s conclusion collapses under scrutiny. The real debate isn't settled: Can access = phenomenality? Is overflow real? GWT defenders have counterarguments (e.g., partial awareness). Even Block's distinction faces attacks from Dennett-style illusionists. The user’s suspicion is dead-on—this is very much alive philosophy of mind territory.  

  ...Wait, did I address all their sub-questions? Let me check:  
  - Qualia conflation: yes, flagged as defensible simplification but philosophically loaded.  
  - Sperling step: yes, highlighted inference vs. direct proof.  
  - GWT’s target: clarified divergence between proponents/critics.  
  - Blindsight accuracy: corrected description, noted access isn’t "full."  
  - "Access" equivocation: pinpointed where the slide happens.  

  The larger takeaway: The chapter’s dismissal of scientific theories is premature. The tension between access-first and phenomenality-first views remains central—neuroscience hasn’t resolved it. User’s critical reading caught exactly where the rhetoric overreaches.
answer: |-
  Below is a systematic audit of the passage, addressing your specific concerns and evaluating each claim from the perspective of contemporary consciousness research. The analysis distinguishes between widely accepted points, defensible simplifications, and contested/rejected claims, drawing on core arguments in the field.

  ---

  ### **1. Block's Distinction: Access vs. Phenomenal Consciousness**
  - **Passage Claim**: Block defined "access consciousness" (A-consciousness) as information available for reasoning, action, and report; "phenomenal consciousness" (P-consciousness) as the "raw feel," characterized as intrinsic, ineffable, and private.
  - **Audit**:
    - **Accepted**: Block's *core distinction* (A-consciousness = global availability; P-consciousness = subjective experience) is foundational in philosophy and cognitive science.
    - **Defensible Simplification**: Describing P-consciousness as the "raw feel" aligns with Block (1995). However:
      - **Critique**: Block did **not** build "intrinsic, ineffable, private" into his *definition*. These are properties often associated with **qualia** (e.g., Nagel, Jackson), which Block discusses but does not treat as essential to P-consciousness. The passage subtly conflates P-consciousness with a strong qualia-based view, potentially biasing the argument.
    - **Outright Rejection?** No, but specialists note this framing risks importing contentious metaphysical assumptions.

  ---

  ### **2. Sperling's Experiment: Does Experience "Overflow" Access?**
  - **Passage Claim**: Subjects consciously experience all letters in a grid, but only a few can be reported (proving P-consciousness without A-consciousness).
  - **Audit**:
    - **Accepted**: Sperling's (1960) partial-report paradigm shows subjects recall more items when cued *after* stimulus offset than in full report. This suggests iconic memory holds more information than can be accessed.
    - **Defensible Simplification?** **No—this is hotly contested**.
      - **The Inference Problem**: The passage assumes subjects *experience all letters phenomenally* but lose access. Critics (e.g., Dennett, Cohen & Dennett 2011) argue:
        - The data only show *potential* access (via cueing), not necessarily concurrent phenomenality.
        - "Experience" might be gist-based or indeterminate, not a rich, determinate array.
      - **Pro-Overflow View**: Block (2007), Lamme, and others maintain that the cueing effect implies phenomenality precedes access. But this requires philosophical argument—**Sperling's data alone don't prove it**.

  ---

  ### **3. Global Workspace Theory (GWT): Is It Only About Access?**
  - **Passage Claim**: GWT equates consciousness with amplification/broadcasting (i.e., availability for report/reasoning), so it explains A-consciousness but not P-consciousness.
  - **Audit**:
    - **Accepted**: GWT (Baars, Dehaene) explicitly defines consciousness in terms of global availability ("access" in Block's sense). Neuroimaging (e.g., frontoparietal activation) correlates with reportable states.
    - **Defensible Simplification**: Yes—GWT proponents (e.g., Dehaene 2014) often frame it as a theory of *conscious access*.
    - **Contested Claim**: The passage concludes GWT "cannot be a theory of experience." This depends on a key **unstated premise**: 
      > *If a theory explains A-consciousness, it cannot explain P-consciousness.*  
      GWT defenders (Dehaene, Naccache) reject this:
      - They argue P-consciousness *just is* globally accessed information (i.e., A = P).
      - Critics (Block, Lamme) insist A and P can dissociate (e.g., Sperling, blindsight), so GWT misses phenomenality.
    - **Neuroimaging Alignment**: Yes—GWT is the dominant framework for fMRI/EEG studies of "conscious access." But whether this captures *phenomenality* is the core dispute.

  ---

  ### **4. Blindsight: Access Without Phenomenality?**
  - **Passage Claim**: Blindsight patients have "full access" (can describe/point) without experience—the "mirror image" of Sperling.
  - **Audit**:
    - **Accepted**: Blindsight patients can localize/discriminate unseen stimuli (e.g., Weiskrantz 1986), suggesting **A-consciousness without P-consciousness**.
    - **Defensible Simplification?** **Partially**: 
      - **Inaccuracy**: Patients do **not** "describe" stimuli (they deny seeing them and make forced-choice *guesses*). "Pointing" is accurate but reflects degraded access (e.g., above-chance accuracy, not normal cognition).
      - **"Full Access"?** No—blindsight access is limited to specific tasks. Block's A-consciousness implies *rich* availability for reasoning, which blindsight lacks.
    - **Mirror Image?** Imperfect: Sperling claims rich P + limited A; blindsight shows limited A + no P. But it remains a key dissociation case.

  ---

  ### **5. The "Access" Equivocation**
  - **Passage Issue**: "Access" shifts between:
    1. **Block's technical sense** (availability for reasoning/report).
    2. **Ordinary sense** (e.g., blindsight patients can "point" to stimuli).
  - **Where the Switch Happens**: 
    - In the blindsight example, "describe and point" invokes the ordinary sense, but the passage then calls it "full access" (Block's term). This conflates degraded motor response with cognitive availability.
  - **Impact**: This exaggerates blindsight's implications. Block's A-consciousness isn't demonstrated by above-chance guessing—it requires integration with cognition (e.g., belief formation).

  ---

  ### **Larger Conclusion: Does the Chapter's Argument Hold?**
  **No.** The chapter's dismissal of neuroscientific theories (e.g., GWT) relies on contested premises:
  1. **P = A?** GWT proponents reject Block's distinction or argue A suffices for P. The passage assumes they are distinct without engaging this.
  2. **Overflow Evidence**: Sperling's case for P-without-A is disputed; blindsight doesn't prove "full" A-without-P.
  3. **GWT's Scope**: While GWT targets access, its advocates claim it *explains* phenomenality via global availability. The chapter ignores this position.

  ---

  ### **Actual State of the Disagreement**
  - **Open Questions**:
    - **Relationship of A and P**: 
      - *Identity View* (Dehaene): A-consciousness *constitutes* P-consciousness.
      - *Interaction View* (Block): A and P interact but can dissociate.
      - *Eliminativist/Illusionist View* (Dennett, Frankish): P-consciousness is illusory; only access matters.
    - **Neuroscientific Evidence**: 
      - Sperling and blindsight are central but interpreted differently. 
      - Rival theories (e.g., Lamme's "Recurrent Processing") argue *local* neural recurrence suffices for phenomenality, bypassing global access.
    - **Critiques of the Distinction**: Some (e.g., Dennett) reject Block's framing as a false dichotomy, arguing "phenomenality" is inferred from access capacities.

  **In Summary**: The passage oversimplifies key experiments, conflates P-consciousness with qualia, and ignores substantive counterarguments. Block's distinction remains influential, but it is **not** a settled framework that invalidates neuroscientific theories. The debate centers on whether phenomenality requires global access (GWT), local recurrence, or is an illusion—a live, unresolved dispute in philosophy and neuroscience. The chapter's conclusion is premature; the matter is far from "closed."
