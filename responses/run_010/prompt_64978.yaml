  5. **Feature that the game can't reproduce:**
     - The activity cannot easily handle the situation where the same principle is being evaluated for multiple individuals at once. In Scanlon, we evaluate principles that might affect many, but the pairwise comparison is only between one person's complaint under one principle and another's under an alternative principle. The activity simplifies by having one representative stand in for the group, but in Scanlon, the complaint of each person in the group is considered in separate pairwise comparisons. We can't do that for a million people, so we trust that if one individual's complaint is not enough to reasonably reject the principle, then the group's complaints don't aggregate.

  6. **Compressed 50-minute version:**
     - Skip Case 1 or shorten it to a quick example.
     - Do Case 2 with only 5 viewers to save time.
     - Case 3: do only one run and discuss the potential for order dependence with a hypothetical.

  7. **Odd number:**
     - If enrollment is odd, in Case 1, have one student as the chair and adjust group sizes.
     - In Case 2, have fewer viewers.
     - In Case 3, adjust group sizes to match.

  This meets the request.
answer: |-
  Below is a complete activity design for your Scanlon seminar, structured to ensure students physically encounter the "individualist restriction" through experiential learning. The activity uses three cases with escalating complexity, enforced mechanics that prevent aggregation, and a built-in mechanism to demonstrate how the order of pairwise comparisons affects outcomes. The debrief links these experiences to Scanlon's key concepts.

  ---

  ### **Activity Title:** The Complaint Tribunal  
  **Core Mechanic:** Students engage in structured pairwise comparisons where only one person's complaint is weighed against one other's. The tribunal's decision has real (but low-stakes) consequences for the class.  
  **Setup:**  
  - Arrange tables in a circle. Place two "witness chairs" in the center.  
  - Assign each student a numbered dossier (role) for each case. Dossiers specify burdens and strict speaking rules.  
  - **Tribunal Roles:**  
    - **Chair (you):** Enforces rules, calls pairs forward, and tallies votes.  
    - **Advocate (1 student per case):** Represents a single individual/group but *cannot* reference group size or aggregate burdens.  
    - **Voters (all other students):** Decide which complaint is "less reasonable to reject" via ballot.  
  - **Rules:**  
    - Advocates may *only* describe their *own assigned burden* (e.g., "I miss the match" not "millions miss the match").  
    - Voters must base decisions *solely* on the two burdens presented.  
    - Penalty: If a rule is broken, the offending advocate forfeits the round.  

  **Stakes:**  
  - Case 1: 24-hour extension on next reading response.  
  - Case 2: Choice of end-of-term film (options: *12 Angry Men*, *The Truman Show*, *Gattaca*).  
  - Case 3: Class-wide exemption from a 1-page reflection essay.  

  ---

  ### **Cases and Procedures**  
  **Case 1: Warm-up – Identical Burdens (Power Grid)**  
  *Goal: Show that identical burdens lead to ties, forcing arbitrary decisions.*  
  - **Dossiers:**  
    - 9 students: "Resident A. Burden: 1-hour power outage during finals week."  
    - 9 students: "Resident B. Burden: 1-hour power outage during finals week."  
  - **Scenario:** A city must cut power to one neighborhood. Residents A and B suffer identical burdens.  
  - **Procedure:**  
    1. Chair randomly selects one Resident A and one Resident B.  
    2. Each states their burden in 30 seconds (e.g., "I lose study time").  
    3. Voters ballot: "Whose burden is less reasonable to reject?"  
    4. **Tiebreaker:** When votes inevitably tie (identical burdens), flip a coin.  
       - Heads: Burden A rejected → Power cut to A’s neighborhood.  
       - Tails: Burden B rejected → Power cut to B’s neighborhood.  
  - **Stake Outcome:** Class gets a 24-hour extension *only* if the smaller neighborhood is spared (reveal post-vote: Neighborhood A has 100 residents; B has 200).  
  - **Why it works:** Students experience frustration—identical burdens can’t be distinguished pairwise, forcing arbitrary outcomes. Numbers only matter in debrief.  

  **Case 2: Transmitter Room (Jones vs. Viewers)**  
  *Goal: Highlight that many small burdens cannot outweigh one large burden.*  
  - **Dossiers:**  
    - 1 student: "Jones. Burden: Trapped under equipment—severe pain, broken leg."  
    - 17 students: "Viewer. Burden: Miss the final 15 minutes of the World Cup match."  
  - **Scenario:** Freeing Jones cuts broadcast; viewers miss the match.  
  - **Procedure:**  
    1. Jones sits in one witness chair.  
    2. Chair calls one Viewer to the other chair.  
    3. Jones and Viewer state burdens (Viewer *cannot* say "we" or mention other viewers).  
    4. Voters ballot: "Whose burden is less reasonable to reject?"  
    5. Repeat Steps 2–4 with *all 17 Viewers*, one by one. Jones faces each Viewer sequentially.  
  - **Stake Outcome:** If Jones wins >50% of pairings, class chooses the end-of-term film. If Viewers win, instructor chooses.  
  - **Why it works:** Jones wins all pairings (severe pain > missing a match). Students see that no matter how many Viewers are added, their complaints never accumulate.  

  **Case 3: Vaccine Shortage (Order-Dependence)**  
  *Goal: Force repulsive outcome via pairwise logic and show order-sensitivity.*  
  - **Dossiers:**  
    - 1 student: "Asthma Patient. Burden: Lifelong disability (needs vaccine)."  
    - 6 students: "Factory Worker. Burden: 1 week of severe migraines (needs vaccine)."  
    - 11 students: "Office Worker. Burden: 1 day of mild nausea (needs vaccine)."  
  - **Scenario:** Only one group gets a vaccine; the rest suffer burdens.  
  - **Procedure (Run 1 – "Severe-First" Order):**  
    1. **Pair 1:** Asthma Patient (high burden) vs. Factory Worker (medium burden).  
       - Voters reject Factory Worker’s complaint (migraines < disability).  
       - **Outcome:** Asthma Patient wins → Factory Workers *not* vaccinated.  
    2. **Pair 2:** Factory Worker (medium) vs. Office Worker (low burden).  
       - Voters reject Office Worker’s complaint (nausea < migraines).  
       - **Outcome:** Factory Worker wins → Office Workers *not* vaccinated.  
    3. **Final:** Office Workers bear burden (mild nausea).  
  - **Procedure (Run 2 – "Mild-First" Order):**  
    1. **Pair 1:** Office Worker (low) vs. Factory Worker (medium).  
       - Voters reject Office Worker’s complaint (nausea < migraines).  
       - **Outcome:** Factory Worker wins → Office Workers *not* vaccinated.  
    2. **Pair 2:** Factory Worker (medium) vs. Asthma Patient (high).  
       - Voters reject Factory Worker’s complaint (migraines < disability).  
       - **Outcome:** Asthma Patient wins → Factory Workers *not* vaccinated.  
    3. **Final:** Factory Workers bear burden (severe migraines).  
  - **Stake Outcome:** Class exempt from essay *only* if Office Workers bear the burden (Run 1).  
  - **Why it works:**  
    - Run 1 protects Asthma Patient and Factory Workers, burdening Office Workers (mild burden → tolerable).  
    - Run 2 protects Asthma Patient and Office Workers, burdening Factory Workers (severe burden → repulsive).  
    - **Order flips the verdict:** Students see pairwise comparison is path-dependent and counterintuitive.  

  ---

  ### **Debrief Structure**  
  **1. Map Moments to Scanlon’s Concepts:**  
     - **Individualist Restriction:** Point to Case 2 (Viewers) and Case 3 (Factory Workers). "Why couldn’t the Viewers/Workers team up? Because contractualism *only* compares one-to-one complaints."  
     - **Tie-Breaking (Identical Burdens):** Use Case 1’s coin flip. "Scanlon allows numbers to break ties *only* when burdens are identical—but pairwise comparisons hide numbers until after."  
     - **Reasonable Rejection vs. Dislike:** Contrast Case 2 outcomes. "You might *dislike* missing the match, but is it *reasonable to reject* compared to a broken leg? No. Personal dislike ≠ unreasonable burden."  

  **2. What Will Go Wrong (and Fixes):**  
     - **Problem:** Students reference group size (e.g., "There are millions of Viewers!").  
       - **Fix:** Chair intervenes: "Advocate, remember: you speak only for *your own burden*. Rule broken—forfeit this round." Maintains the fiction by treating it as a procedural error.  
     - **Problem:** Voters resist repulsive outcomes (e.g., Factory Workers suffering in Case 3-Run 2).  
       - **Fix:** Affirm discomfort: "This feels wrong? Good. Why? Because pairwise comparison ignores cumulative burdens. Now we’re ready to name the 'individualist restriction'."  
     - **Problem:** Students assume burdens are comparable (e.g., equating 1 million nausea days with 1 disability).  
       - **Fix:** In debrief, clarify: "Scanlon prohibits converting burdens into a 'currency'—each complaint is incommensurable."  

  **3. Limitations of the Activity:**  
     - **Unreproducible Element:** Scanlon evaluates *principles* (e.g., "cut broadcast to save Jones"), not individual actions. The activity simulates outcomes but can’t show how principles are tested against *all possible* complaints. **Supply by hand:** "In real contractualism, we’d ask if anyone *could* reasonably reject a principle allowing Jones to be saved. Our game shortcuts this by focusing on pairwise burdens."  

  **4. Compressed 50-Minute Version:**  
     - Skip Case 1.  
     - Case 2: Use 5 Viewers (not 17); each speaks for 15 seconds.  
     - Case 3: Run once (Severe-First order) and *describe* the order-flip (don’t re-run).  
     - Debrief: Focus on Case 2 (aggregation failure) and Case 3 (order-dependence).  

  **5. Odd-Number Enrollment Fix:**  
     - Add a "Silent Observer" role: One student takes notes on the tribunal’s fairness but doesn’t vote. In Case 3, assign them to the smallest group (e.g., Asthma Patient).  

  ---

  ### **Why This Works**  
  - **Physical Encounter with the Restriction:** By forcing one-on-one comparisons, students experience the limitation before naming it. The order-flip in Case 3 creates productive discomfort.  
  - **Suspicion Over Reassurance:** The arbitrary Case 1 outcome and repulsive Case 3 verdict make contractualism feel unstable, priming critique.  
  - **Low Stakes, High Engagement:** Consequences (film choice, essay exemption) motivate rigor without trivializing ethics.  

  Students will leave skeptical of pairwise comparison—exactly as Scanlon’s critics are. The activity transforms an abstract restriction into a lived dilemma.
