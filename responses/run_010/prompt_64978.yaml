  **Key Mechanics:**
  1. **Pairwise Comparison Only:** At each table (or hearing), only two complaints are compared at a time. The representative of each side presents their complaint without reference to numbers (unless the numbers are part of the complaint's description, but they cannot aggregate multiple complaints). The tribunal (the rest of the class) votes on which complaint is more reasonable to reject.
  2. **Order Matters:** We will run one case twice with different orders of comparison to show that the outcome can flip.
