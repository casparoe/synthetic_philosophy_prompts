     - In Case 2, we couldn't aggregate the viewers' complaints; each was compared individually to Jones.
     - In Case 3, when comparing Y and Z, we only considered one individual from Y and one from Z, not the whole groups.

  2. **Scanlon's tie-breaking move:**
     - In Case 1, when burdens are identical, Scanlon allows breaking the tie by considering the numbers. Our activity didn't do that initially, hence the coin flip.

  3. **Reasonable rejection vs. not liking:**
     - In Case 2, viewers might not like missing the match, but is it a burden that can reasonably be rejected in comparison to Jones's injury? No.

  4. **What will go wrong:**
     - Students might try to speak for a crowd (e.g., "there are millions of us" in Case 2). The chair should rule: "State only your individual burden. Do not refer to others."
