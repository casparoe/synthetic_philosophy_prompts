prompt: |-
  ok so this has been eating my brain since my stats teacher mentioned something called the reference class problem, and now I can't stop applying it to literally everything. The idea as I understand it: to predict anything you have to pick a group of past cases that are like yours and use their hit rate. But the group can be described a million different ways, and different descriptions give you wildly different numbers, and it feels like you can always find a description that gives you the answer you wanted. So instead of asking about it in the abstract I wrote down my actual gut verdicts, mostly on stuff happening to me and people I know, and I want to know what principle (if there is one) makes all of them come out right. Or which ones I have to throw out.

  1. Tryouts, friend A. Says he's making varsity. Around 40% of kids who try out make it. I think 40% is the right number for him even though he's played club since he was 5. Feels lazy but right.

  2. Tryouts, friend B. Also played since he was 5, but he also did a specific keeper camp and we badly need a keeper. I think his odds are clearly better than 40%. So I let extra details move the number here and I didnt let basically the same details move it in case 1. This is the pair I can't reconcile.

  3. My uncle's restaurant. He says most restaurants die in year one but his won't because he spent 20 years in the industry. I told him that's the exact move everyone makes and I'm not buying it. Meanwhile in case 2 I bought it. I would call what he's doing flattery narrowing, but I need a definition that doesn't just mean "narrowing I disagree with."

  4. College apps. Overall acceptance rate at the place I'm applying is like 12%, but the rate for kids from my high school who apply is closer to 55%. I'm confident I get to use 55%. But exactly two kids from my school who take AP Bio and play cello got in, and I do NOT think I get to say my odds are 100%. Where does the narrowing have to stop, and why precisely there instead of one step earlier or later?

  5. Big n=1 stuff. Will two major nuclear countries actually fight a war in my lifetime. There is no reference class, zero. Everyone says you cant put a number on it. But I definitely have a number, I'd say something like 5%, and it doesn't feel like I'm pulling it out of nowhere. Is that a real probability or am I just fooling myself with a vibe?

  6. My app. I want to know the odds it gets to a thousand users. Nothing from my school has ever done anything so there's no local class at all, and I ended up using "small free apps made by teenagers," which nobody in it is really like mine. That felt fine, closest thing available. But in case 4 I refused to use the general 12% even though it had way more data behind it. Why is far-away-and-thin okay in one and near-and-thick not okay in the other?

  7. Stuff you can only know afterwards. "Most lottery winners go broke" — I can't use that on my aunt because she hasn't won anything. But the second she wins, am I instantly inside that class without doing anything? Same with "most people who drop out of med school regret it" versus "most people who start med school drop out." I want to say you're only allowed to describe the class using things knowable beforehand, but my teacher points out that entrance exam scores are knowable beforehand AND they predict dropping out, so the line isn't just about timing. What is it about?

  8. Getting sorted into a class without agreeing to it. A study app I use flagged me as "likely to put off homework" based on kids like me, and it's right, and I hate it. I think its prediction is legitimate but I also feel like I get to reject the class when it's applied to me personally. Which flatly contradicts case 1, where I gave my friend no such option.

  9. Classes that move when you use them. 90% of people who fail their driving test the first time pass the second time. I failed. Do I get to use that now? And if using it makes me practice three hours a week, then I've moved myself into a different group and the 90% was never about me. Almost none of the stats I use are about a world where everybody knows the stats.

  My own attempt at a rule, which I want you to attack: the blindfold test. Narrowing is legitimate only if you would have named the same class before you knew which answer you wanted, and if you'd use the same class for a stranger with the same features. Case 3 fails it, case 2 passes it. I think that's the difference but I cant tell if the test is actually doing work or if I'm just dressing up my tastes.

  So: is there a principle that gets all nine, or close? State it as something a person could actually follow at a desk with a spreadsheet, not just a diagnosis of why it's hard. Tell me which of my verdicts it forces me to drop and which it saves. Then pick three new cases of your own that my list doesn't cover — make them genuinely awkward, not softballs — and give me the principle's verdicts on them so I can check whether I still believe it. And if the honest answer is that there's no non-arbitrary stopping point for narrowing and the whole thing is hopeless, say that plainly and tell me what people who say that are supposed to do when they still have to decide stuff. No need to point me at books or articles, I just want the reasoning.
reasoning: |-
  Hmm, the user is wrestling with the reference class problem in probability estimation. They've presented nine concrete cases from their personal life where they've intuitively applied different levels of "narrowing" the reference class, and they're struggling to find a consistent principle that justifies all their intuitive judgments. 

  The core tension they're highlighting is between statistical rigor (using the broadest available data) and contextual relevance (using narrower classes that seem more applicable). Their cases show this tension particularly well in paired examples: friend A vs friend B in tryouts, their uncle's restaurant vs their own college application, etc. 

  What's especially interesting is their attempt at a solution - the "blindfold test" - which essentially asks whether the reference class would be chosen impartially before knowing the outcome. This shows they're grappling with the cognitive bias aspect of the problem. 

  The cases that give me most pause are #5 (nuclear war probability with no reference class) and #7 (temporal knowledge issues), because they expose fundamental limitations of frequentist probability. The driving test case (#9) adds another layer of reflexivity that most probability theories don't handle well.

  Their frustration is palpable - they want either a workable decision rule or permission to accept the arbitrariness. The challenge is giving practical guidance without oversimplifying. The "closest defensible class" approach I'm considering balances three criteria: availability of data (rejecting classes with n<5 like their AP Bio example), causal relevance (accepting keeper training but rejecting restaurant experience when it's common), and independence from outcome (addressing their lottery winner concern).

  For their proposed blindfold test, it's psychologically astute but needs refinement - we'd have to specify what counts as "same features" to avoid cherry-picking. Their cases #2 and #3 show why: keeper training is probabilistically relevant while restaurant experience might not be. 

  The three test cases I'm considering would probe edge conditions: one about immutable characteristics (where narrowing might be ethically problematic), one about rapidly changing environments (where historical data becomes irrelevant), and one about self-defeating prophecies (like their driving test case but more extreme). These would stress-test whether the principle can handle real-world messiness.
answer: |-
  Here's a principle you can apply at your desk with a spreadsheet, followed by verdicts on your cases and three new test cases:

  **The Closest Defensible Class Principle (CDC):**
  1. **Start broad:** Identify the largest reference class with reliable frequency data *directly tied to the outcome*.
  2. **Narrow only if:**
     - **Causal/relevance test:** The narrowing factor demonstrably *causes* or *strongly predicts* the outcome (e.g., keeper training → keeper selection).
     - **Data sufficiency:** The narrowed class has enough cases (n ≥ 5 is a practical minimum) to be stable. Avoid tiny "n=1" classes.
     - **Non-circularity:** The factor must be knowable *before* the outcome and *independent* of the outcome itself (e.g., "failed once" is knowable beforehand; "went bankrupt" is not).
  3. **If narrowing fails CDC, stick with the broader class.** When no good class exists (e.g., nuclear war), acknowledge it's a *subjective credence* (your gut feeling), not a frequency.

  **Applied to Your Cases:**

  1.  **Friend A (Club Soccer):** **Stick with 40%.** "Club since 5" is common among tryouts → fails *causal/relevance* test (it doesn't significantly differentiate him from the base class). CDC keeps broad class.
  2.  **Friend B (Keeper Camp):** **Narrowing justified.** Keeper training *causes* higher keeper selection chance → passes *causal/relevance* test. Odds >40% justified.
  3.  **Uncle's Restaurant:** **Stick with broad failure rate.** "20 years in industry" is common among failed restaurants → fails *causal/relevance* test (doesn't demonstrably *lower* failure risk uniquely). CDC keeps broad class. *(You were right to call BS)*.
  4.  **College Apps:**
      *   **55% (School Rate):** **Narrowing justified.** School performance/culture *strongly predicts* acceptance → passes *causal/relevance* & *data sufficiency*.
      *   **100% (AP Bio/Cello):** **Rejected.** Fails *data sufficiency* (n=2 is unstable) and likely fails *causal/relevance* (unless proven these *specifically* cause acceptance). Stick with 55%.
  5.  **Nuclear War:** **No reference class.** Your 5% is a *subjective credence* based on synthesis of historical near-misses, geopolitics, etc. It's not a frequency probability, but it's a legitimate *belief* for decision-making under uncertainty. CDC says "acknowledge the uncertainty."
  6.  **Your App:** **Using "teen free apps" is CDC-compliant.** *Why?* There's *no viable broad class* ("all apps" includes billion-dollar ventures → irrelevant). "Teen free apps" is the *closest defensible class*, even if imperfect. In Case 4, the *broad* class (12%) *is* viable and causal (general applicant quality), so CDC rejects irrelevant narrowing (AP Bio/Cello) but accepts relevant narrowing (school rate).
  7.  **Lottery Winners / Med School:**
      *   **"Most winners go broke" (Aunt hasn't won):** **Cannot use.** Class membership ("winner") is defined by the *outcome* itself → fails *non-circularity*. Use classes based on traits *before* winning (e.g., "people with low financial literacy").
      *   **"Most dropouts regret it" vs "Most starters drop out":** **Use "Most starters drop out" for prediction.** "Dropping out" is the outcome → predicting it requires classes defined by traits *before* starting (e.g., entrance scores, motivation). "Regret" is a *later outcome* → predicting it requires classes defined *after* dropping out (e.g., reason for dropping out, financial situation). CDC enforces *temporal order*: Define class *before* the outcome you're predicting.
  8.  **Study App Flag:** **Prediction is CDC-legitimate.** It used knowable-beforehand traits to assign you to a class ("kids like me") with a known failure rate. Your feeling of unfairness is psychological, not statistical. You *can't* legitimately reject the class *after* seeing its prediction *if* the class was defined fairly beforehand. Case 1 is consistent: your friend *is* in the "all tryouts" class by default; moving out requires passing CDC (which he didn't).
  9.  **Driving Test:** **You CAN use the 90% initially.** "Failed first test" is knowable beforehand → passes *non-circularity*. It strongly predicts passing later → passes *causal/relevance* (experience matters). **BUT:** If knowing the stat makes you practice more, you *might* move into a *new* sub-class ("people who failed once *and* practiced intensely"). CDC says: Use 90% *at the time of prediction*. If your actions change your relevant traits, *update* the class/estimate later based on new info ("now practicing 3hrs/week").

  **Your Blindfold Test Assessment:** It's insightful! CDC incorporates it implicitly via *non-circularity* and *causal/relevance*. The key addition is *data sufficiency* and explicitly handling cases with *no good class*. CDC makes the "stranger" part operational with the causal/relevance test.

  **Three New Awkward Test Cases & CDC Verdicts:**

  1.  **The Rare Disease:** You test positive for a disease with 0.1% prevalence. The test is 99% accurate (1% false positive/negative). Your doctor says your chance is 99%. You Google and find the disease is 10x more common in people with your specific genetic marker (which you have). Prevalence in your marker group is 1%. Can you narrow?
      *   **CDC Verdict:** **Yes, use 1% (or calculate precisely).** Genetic marker is knowable beforehand and *causally relevant* (increases disease risk). Prevalence data exists (≥1% is sufficient). The base rate (0.1%) ignores known relevant information. Doctor's 99% is wrong (base rate neglect). *(Note: Actual probability ≈ 9% using Bayes, but CDC justifies using the 1% marker class as better than 0.1%)*.

  2.  **The Algorithmic Bias:** A bank uses an AI loan model. Overall denial rate is 20%. For people in your ZIP code (mostly your demographic), denial is 35%. The bank claims ZIP code isn't used by the model. You suspect hidden bias based on correlated factors (income, education). Can you use the 35% for yourself?
      *   **CDC Verdict:** **Yes, use 35%.** ZIP code is knowable beforehand. The *correlation* (even if not direct causation in the model) makes it *predictively relevant* for the outcome (denial) based on data. Data sufficiency is met. The causal link (potential bias via correlated factors) is strong enough to justify narrowing over the overall 20%. *(This highlights predictive vs. causal relevance in CDC)*.

  3.  **The Self-Fulfilling Prophecy:** Studies show employees labelled "high potential" in their first year have a 70% chance of reaching senior management vs. 20% for others. You weren't labelled. Can you use the 20%? Critics say the label itself *causes* the outcome via mentorship and opportunities.
      *   **CDC Verdict (Initial Prediction):** **Use 20%.** "Not labelled" is knowable beforehand and *predictively relevant* (the data shows a strong association). Data sufficiency is met. The *mechanism* (label causing outcome) doesn't negate the predictive power *for someone not labelled*. **BUT:** CDC acknowledges this prediction might be *mutable*. If you network relentlessly to *get* mentorship/opportunities anyway, you might move into a different class ("unlabelled but sought mentorship") later, requiring an updated estimate. CDC gives the best estimate *given current information*.

  **The Hopelessness Question:**

  If you conclude "there's no non-arbitrary stopping point," here's what you **do**:

  1.  **Acknowledge the Uncertainty:** Explicitly state the reference class(es) used and why, and the potential limitations/biases. (e.g., "Based on teen free apps, ~10% chance, but this class is imperfect because...").
  2.  **Use Multiple Frames:** Look at the problem from different angles using different plausible classes. See if estimates converge or diverge wildly. Convergence increases confidence.
  3.  **Focus on Decision Quality, Not Just the Number:** What decision does each plausible probability imply? If all reasonable estimates point to the same action (e.g., "don't quit your job for the restaurant"), the exact number matters less.
  4.  **Seek Causal Levers:** Focus on factors you can *control* that CDC would deem relevant for narrowing. (e.g., Practice for the driving test to move your class).
  5.  **Use Ranges & Sensitivity:** Instead of a single number, use a range (e.g., "between 40% and 60%"). Test how sensitive your decision is to the probability estimate.
  6.  **Embrace Subjectivity When Necessary:** For true unknowns (like nuclear war), combine frequency data (historical near-misses, war frequencies) with structured judgment (expert elicitation, scenario planning) to form a reasoned *belief* (your 5%). Document your reasoning.

  **CDC doesn't eliminate the problem, but it provides a disciplined, auditable framework for minimizing arbitrariness and maximizing justified narrowing.** It forces you to articulate *why* a narrower class is better, grounded in causality, predictability, data, and temporal logic. Use it, document your choices, acknowledge its limits, and combine it with the strategies above when uncertainty remains high.
