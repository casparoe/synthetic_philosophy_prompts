prompt: |-
  I'm on the exec board of a student housing coalition in a mid-size college town and we're locking in the planks for a resolution we'll read at the city council's housing element hearing next month. Everything we put out — the flyer, the instagram, the yard signs somebody's roommate screen-printed — carries the slogan "Housing is a human right, not a commodity." The problem is that the three planks underneath it are pulling in what look like different directions, and one of our members (philosophy TA, will not let this go) claims the slogan can't support all three at once. Plank A is a $40M general-obligation bond to build permanently affordable, publicly owned units on the two vacant parcels by the bus depot. Plank B is legalizing fourplexes and accessory units in every residential zone citywide, by right, no discretionary review. Plank C is a moratorium on new market-rate construction in the three cencus tracts bordering campus until displacement protections pass. His argument, roughly: A treats housing as something the public owes people directly, B treats it as something the market will supply fine if we stop blocking it, and C treats the market as actively harmful — so if the same banner justifies all three, either the slogan is ambiguous or one of the planks is just riding along on vibes.

  For context on where people in the group think it comes from: one organizer said the "right" half is backed by the UN covenants' adequate-housing language, and another said the point of the slogan isn't about who builds anything at all, it's about commodification, and that Lefebvre's right-to-the-city stuff is the real ancestor of the second half. I'm not sure those two are even talking about the same sentence.

  So: can you lay out the different precise claims that one line could be making, ordered from the near-platitude to the genuinely radical — I'd want at least six, and please include at least one reading that's flat-out false as stated and at least one that nobody in our group has articulated but that a hostile councilmember could accuse us of meaning. For each I want the deontic structure pinned down: who owes what, to whom, enforced against whom, at whose expense, and what exactly is being denied when you call housing a commodity (is it tradability? profit? price signals? absentee ownership? land value?). And I especially want to know whether "human right" and "not a commodity" are one claim or two that can come apart, since I suspect plank B is sitting right in the gap.

  Give me the menu as a markdown table with exactly these columns, and keep each cell to a sentence or two so it stays readable: **reading** (a 3–6 word label), **claim_spelled_out** (the precise assertion, including the obligation structure above), **strength** (one of: platitude / substantive-and-defensible / contentious / false-as-stated), **halves_relation** (under this reading, are the two halves the same claim, two compatible claims, or in tension), **supports_A**, **supports_B**, **supports_C** (each: yes / no / only-with-caveats, plus half a sentence of why), **who_means_it** (which camp of slogan-repeater most likely has this one in mind). After the table, give me a short paragraph answering the only question that actually matters for the hearing: is there a single reading that licenses all three planks coherently, and if not, which plank should we drop and which defintely should stay.
reasoning: |-
  Okay, the user is part of a student housing coalition preparing for a city council hearing. Their slogan is "Housing is a human right, not a commodity," but their three planks seem contradictory. Plank A pushes for public housing, Plank B for deregulating private development, and Plank C for restricting market-rate construction. A philosophy TA is arguing the slogan can't logically support all three. 

  Hmm, this is a classic case of political messaging meeting practical policy. The user needs to reconcile ideological purity with coalition-building pragmatism. They're clearly intellectual types - citing UN covenants and Lefebvre - but now need to present a unified front to city council. The underlying tension is between housing as social good vs economic good.

  Let me break down possible interpretations of their slogan. First, the spectrum of meanings: At one end, basic shelter as fundamental need (platitude nobody disagrees with). At the radical end, full decommodification where housing can't be owned/traded. The philosophy TA has a point - A, B, and C imply different relationships to markets.

  For the table: Need columns for each interpretation's implications. Key is mapping who owes what to whom under each reading. Also whether "human right" and "not commodity" are separable - that's where Plank B might fit. Should include a "strawman" version too since council opponents might distort it.

  Noticing the user wants exactly six interpretations including one false one and one hostile reading. Smart - they're preparing for pushback. The "who means it" column will help them anticipate internal disagreements.

  After the table, the million-dollar question: Can any single reading justify all three planks? My gut says no - C directly contradicts B's market logic. But dropping C might hurt tenant support. Compromise might be reframing C as temporary emergency measure rather than permanent rejection of markets.

  Biggest risk is council members seizing on contradictions. The coalition should probably: 1) Keep A (shows concrete solution) 2) Keep B (popular with YIMBYs) 3) Modify C to be data-driven anti-displacement instead of blanket moratorium. The slogan works best at the "positive obligation" level where state ensures access through mixed approaches.

  User's clearly sharp - they spotted Plank B sitting in the gap between the two halves of the slogan. That's actually the strongest plank policy-wise. If they must drop one, C is weakest legally and philosophically. But politics might require keeping it with revised framing.
answer: |-
  Here's a breakdown of potential readings of "Housing is a human right, not a commodity," analyzed for coherence with your planks:

  | reading                     | claim_spelled_out                                                                                                                                                             | strength                 | halves_relation          | supports_A | supports_B | supports_C | who_means_it                     |
  | :-------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------- | :----------------------- | :--------- | :--------- | :--------- | :------------------------------- |
  | **Minimal Basic Provision** | The state owes all individuals a duty to ensure access to basic, safe shelter, enforced against the state itself, funded by public means. Commodity = treating shelter purely as a profit-driven market good. | platitude                | two compatible claims    | yes (public provision) | only-with-caveats (if units are affordable) | no (blocks supply) | General public, charities         |
  | **Positive Obligation**     | The state owes an affirmative duty to *actively provide* or *guarantee access* to adequate housing for all, enforced against the state. Commodity = private ownership/production prioritizing exchange-value over use-value. | substantive-and-defensible | two compatible claims    | **yes** (direct provision) | no (relies on private market) | **yes** (curbs harmful market) | Social democrats, UN advocates    |
  | **Negative Right (Shelter)**| The state owes a duty to *not deprive* people of existing housing/shelter, enforced against the state. Commodity = housing being alienable/tradable, enabling deprivation via market forces (eviction/sale). | contentious              | two in tension           | no (not about deprivation) | no (increases market activity) | **yes** (prevents direct displacement) | Libertarian-leaning rights advocates |
  | **Anti-Commodification**    | Housing *itself* (land/building) must be removed from capitalist market relations – no private profit, absentee ownership, or treating it as an investment asset. Enforced against private owners/developers. | contentious              | one claim (implied by denial) | **yes** (public ownership) | no (expands commodified supply) | **yes** (restricts commodification) | Radical tenant unions, Marxists     |
  | **Use-Value Primacy**       | Housing decisions (production/allocation) must prioritize human need (use-value) over exchange-value/profit. The state owes regulation/steering to ensure this. Enforced against market actors via policy. | substantive-and-defensible | one claim (implied)      | **yes** (prioritizes need) | **yes** (if increases affordable supply) | **yes** (curbs profit-driven displacement) | Lefebvrians, pragmatic organizers   |
  | **Strawman (Full Decommod)**| Housing cannot be privately owned, traded, or have a price – it must be universally free and allocated by need. Enforced against all property owners, funded by confiscation. | false-as-stated          | one claim                | **yes** (aligned) | no (expands private ownership) | **yes** (attacks market) | Hostile councilmembers, developers |

  **Analysis & Recommendation:**

  No single reading coherently licenses **all three planks simultaneously**. Plank B (legalizing fourplexes/ADUs) is the primary tension point:
  *   **A (Public Investment)** is strongly supported by "Positive Obligation" and "Anti-Commodification" readings, but these conflict with B.
  *   **B (Deregulation)** is only weakly supported under "Minimal Provision" or "Use-Value Primacy" (if increased supply lowers prices). It is actively opposed by "Anti-Commodification" and "Negative Right" readings.
  *   **C (Market Moratorium)** is strongly supported by "Anti-Commodification," "Negative Right," and "Use-Value Primacy," but conflicts with B and is irrelevant to "Minimal Provision."

  **Recommendation:**
  1.  **Keep Plank A:** It most directly embodies the "public obligation" aspect of the slogan across multiple readings and provides a concrete solution.
  2.  **Keep Plank B:** It addresses exclusionary zoning (a major barrier) and can align with a "Use-Value Primacy" reading if framed as increasing *affordable* supply (e.g., "missing middle" housing). This is the slogan's most defensible gap: rejecting *pure* commodification doesn't preclude regulated market activity serving human need.
  3.  **Modify or Drop Plank C:** A blanket market-rate moratorium is the hardest to square with B and weaker readings of the slogan. It risks appearing anti-supply and contradicting "human right" by potentially worsening scarcity. **Reframe C** as specific, time-bound anti-displacement measures (e.g., strict linkage fees, right-to-return, rent stabilization *for existing tenants*) targeted at *vulnerable* populations in those tracts, triggered *immediately*. Drop the moratorium demand. This aligns better with "Negative Right" or "Use-Value Primacy" without broadly rejecting market supply.

  **Unifying Strategy:** Emphasize the **"Use-Value Primacy"** reading at the hearing. Argue all planks reject housing as a *pure* commodity (prioritizing profit over people) and aim to prioritize human need: A via direct public provision, B by enabling diverse/affordable "missing middle" housing the market *can* provide if allowed, and the revised C by protecting vulnerable residents from direct displacement *caused by* market pressures. This creates coherence: different tools for different market failures, all serving the primacy of housing as a right/need. Acknowledge the state's multifaceted obligation (provider, regulator, protector) under the right to housing.
