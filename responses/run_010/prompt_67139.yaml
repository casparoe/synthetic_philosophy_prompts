  ## Joint Statement on Gongsun Longzi's "White Horse" Chapter

  **Part 1: Agreed Claims**

  Both camps agree on the following propositions regarding the received text, its arguments, and the scope of the thesis:

  1.  The received chapter presents a dialogue where an Advocate defends the thesis "White horse is not horse" (白馬非馬) against an Objector.
  2.  The dialogue proceeds through specific, labeled argumentative exchanges: W1 (initial statement linking 'horse' to shape, 'white' to color), W2 (Objector's challenge that having a white horse entails having a horse), W3 (argument concerning what satisfies a request for "a horse" vs. "a white horse"), and W4 (discussion on separating 'white' and 'horse' from 'white horse').
  3.  The thesis employs a negative copula (非) whose interpretation is central to the dispute.
  4.  The Advocate's arguments (particularly W1 and W3) centrally involve the relationship between compound names (like 'white horse') and simple names (like 'horse' or 'white').
  5.  In W3, the Advocate claims that bringing a yellow or black horse satisfies a request for "a horse" but not for "a white horse," and conversely, that bringing a white horse satisfies a request for "a white horse" but not for "a horse."
  6.  The Objector offers counter-arguments (W2, W4) intended to challenge the Advocate's position, notably questioning the separation of 'white' and 'horse' in W4.
  7.  The chapter's primary focus is on *names* (名) and their relationship to *stuff* (實), not directly on equine biology or metaphysics.
  8.  If the Advocate's arguments in W1 and W3 are sound, they would establish that the compound name 'white horse' cannot be substituted *salva veritate* for the simple name 'horse' in certain contexts (like requests or statements about possession).
  9.  If the eristic reading is correct and the arguments rely on equivocation (e.g., sliding between "not identical to" and "excluded from the kind"), then the *dialectical* success demonstrated is distinct from establishing a coherent semantic *doctrine*.
  10. The thesis "White horse is not horse" is *not* plausibly read as a claim that a particular white-colored equine animal fails to belong to the biological species *Equus ferus caballus*.
  11. The thesis *is* making a claim about the relationship between linguistic expressions and how they sort or pick out stuff in the world.
  12. The received text is fragmentary and dislocated; its precise wording and argumentative sequence are subjects of scholarly reconstruction. No paraphrase can be considered the definitive reading of an unproblematic original text.
  13. Understanding the chapter requires grappling with its specific arguments (W1-W4) as presented, not importing anachronistic formal logic or semantic theories wholesale.
  14. The chapter is historically situated within a context of disputation, and its form reflects that practice, regardless of its ultimate philosophical intent or validity.

  **Part 2: Disagreements Table**

  | Disagreement Stated Neutrally                                                                                                 | Camp A Formulation                                                                                                                               | Camp B Formulation                                                                                                                                                           | Verdict on Disagreement          |
