  | **The significance of the Objector's concessions and counters:** Do the Objector's points (W2, W4) reveal flaws in the Advocate's reasoning, or are they anticipated and refuted within the Advocate's framework? | The Objector's challenges (like W2) are based on a misunderstanding of the Advocate's semantic point and are adequately addressed by distinguishing levels of discourse (names vs. stuff). The dialogue clarifies the doctrine. | The Objector's counters (especially W4's challenge about separation) expose the fatal equivocation or absurdity inherent in the Advocate's position when pushed consistently; the dialogue reveals the sophistry. | **Substantive** (Differing views on argumentative outcome) |
  | **The scope of "names" (名) and "designation" (指) in the chapter:** Are these terms used in a technically precise way to develop a general theory of naming, or are they deployed flexibly within the specific dialectical context? | 'Name' (名) and 'designates' (指) are used consistently as technical terms referring to the semantic function of words in picking out stuff based on criteria (shape, color). | 'Name' (名) and 'designates' (指) are used contextually within the specific arguments; their meaning is shaped by the immediate dialectical need rather than reflecting a fixed technical vocabulary for a general theory. | **Partly Verbal/Substantive** (Overlap in terminology, disagreement on systematicity) |
  | **The nature of the thesis "White horse is not horse":** Is it a claim primarily about the *semantic values* of the expressions, or is it a claim exploiting the *logical relationship* between the concepts/kind memberships? | The thesis is fundamentally semantic: it asserts the non-identity of the *semantic values* (reference, application conditions) of the compound name 'white horse' and the simple name 'horse'. | The thesis exploits the ambiguity of the negative copula between concept non-identity (which is true but trivial) and kind exclusion (which is false but seemingly supported by contexts like W3). The *force* comes from the slide. | **Substantive** (Differing views on what the core claim *is*) |
