answer: |-
  Here's the Ulysses-contract mapping applied to the two-term presidency, followed by the critical pressure points it reveals in the theory:

  **The Ulysses Contract: Applied**

  1.  **The "Self" (Principal):** **The American political system / electorate collectively over time.** It's the aggregate "self" represented by the Founders' generation (establishing the norm), later generations (sustaining it), and the post-FDR political actors (formalizing it). The *office* is the vessel, but the *system* (its stability and republican character) is the entity being protected from its own future impulses.
  2.  **The Future "Untrustworthy Self" (Agent):** **The electorate in a moment of crisis/fear, coupled with an ambitious or seemingly indispensable incumbent.** Future voters might crave the comfort of continuity and a known leader during upheaval (like the Great Depression and WWII), overriding long-term concerns about excessive executive power. The incumbent, willingly or not, becomes the focal point of this temptation.
  3.  **The "Siren Song":** **The combined allure of stability, perceived competence in crisis, and incumbent advantage.** It's the powerful temptation to retain a known leader during frightening times ("Don't change horses midstream"), amplified by the incumbent's unmatched name recognition, patronage power, and control of the national narrative. Fear and uncertainty make the siren's call deafening.
  4.  **The "Mast" (Precommitment Device):** **The two-term norm (soft) and later the Twenty-Second Amendment (hard).** Washington's voluntary refusal and the sustained norm acted as the initial, weaker mast – a social/political expectation. The 22nd Amendment is the reinforced, constitutional mast – a legal barrier.
  5.  **The "Crew" (Enforcers):** **The political actors and institutions:**
      *   *For the Norm:* Political parties (denying nominations like Grant's/TR's), Congress (potential opposition), the press/public opinion (invoking Washington's legacy), and ultimately the voters themselves by withholding support.
      *   *For the Amendment:* Congress (proposing), the States (ratifying), the Courts (interpreting), and again, voters holding officials accountable.
  6.  **The "Cost of Untying":**
      *   *Soft Norm (Pre-1940):* Primarily **political/social cost.** Breaking the norm risked significant public disapproval, accusations of monarchical ambition, powerful opposition within one's own party, and potential electoral backlash. This cost was high enough to deter Grant and TR (both failed), but crucially, *contingent* on the political climate and the incumbent's specific vulnerability. It was a deterrent, not a bar.
      *   *Hard Rule (Post-1951):* **Constitutional/legal impossibility.** The cost is now *procedurally immense*: requires amending the Constitution itself (2/3 Congress + 3/4 States) to "untie" the restraint for a specific individual *before* they could run again. The individual actor (President) is legally barred; the "untying" must happen at the systemic level first.

  **Why the Soft Norm Held Then Failed:**

  The **difference in cost** *absolutely* explains the norm's longevity and its collapse under FDR. The soft norm's cost (public/political disapproval) was **effective against ambition in relatively "normal" times** (Grant, TR) but proved **utterly insufficient against the overwhelming siren song of genuine, prolonged national crisis.** FDR, leading during the Depression and WWII, embodied stability for terrified voters. The political cost of breaking the norm was dwarfed by the perceived cost of *not* retaining him. The siren's call was unprecedented in volume and duration. The soft restraint simply wasn't strong enough to resist that level of temptation. The hard rule was created precisely because the soft norm *couldn't* withstand the strongest temptation.

  **Pressure on the Ulysses Theory: The Two Bugs**

  1.  **The "Cool Hour" vs. "Hot Reaction" Problem:**
      *   **Theory:** Ideally, precommitments are made dispassionately to bind future passionate selves. The 22nd Amendment looks like a classic Ulysses contract: "Let's bind ourselves *now* so we don't give in to the temptation of another FDR *later*."
      *   **Reality:** The Amendment was ratified **in the heat of partisan resentment** against FDR's dominance and Democratic power (though supported by some principled Republicans too). It was a reaction *against a specific man and his legacy*, fueled by the recent, raw experience of his unprecedented tenure.
      *   **Theory's Response/Failure:** Ulysses-contract theory typically focuses on the *mechanism* of binding, not the purity of motive. A contract made in anger is still a precommitment device. *However*, this highlights a **critical weakness:** Contracts made reactively, in a "hot" state *against* a past threat, might be **poorly calibrated or motivated by transient emotions rather than sober long-term calculation.** They might overcorrect or create unforeseen problems (like Bug #2). The theory *describes* both as precommitments but struggles to evaluate their *wisdom* or potential for *pathology*. The 22nd Amendment *was* a cool-hour institutionalization *in form*, but its *impetus* was arguably hot. The theory lacks tools to distinguish the quality of the "cool hour."

  2.  **The Self-Defeating Lame Duck Problem:**
      *   **Complaint:** The two-term limit creates a guaranteed "lame duck" second term, where the President's influence and bargaining power plummet as their end date becomes certain. This manufactured weakness potentially undermines effective governance precisely when experience might be most valuable. The device might cripple the executive it was meant to merely restrain.
      *   **Theory's Capacity:**
          *   **Anticipation:** The theory *implicitly* recognizes that precommitments have **costs.** Tying yourself to the mast means you *can't* steer towards the siren, even if in some rare, unforeseen circumstance steering that way *might* be beneficial. The lame duck effect is one such significant, foreseeable cost – a trade-off for preventing perceived greater evils (entrenched power).
          *   **Absorption:** The theory can *absorb* this as an **accepted (or at least acknowledged) negative consequence of the binding.** The framers of the norm/amendment judged the risk of excessive, prolonged power (the siren) as greater than the risk of reduced efficacy in the second term. It's a calculated trade-off, inherent in the choice to bind. The theory doesn't require the device to be perfect, only that it addresses a specific weakness of will.
          *   **Is it a Hole?** Not fundamentally for the *core logic* of binding. However, it highlights that Ulysses contracts in complex systems can have **unintended systemic consequences** (like weakening governance) that might, in extreme cases, *themselves* create vulnerabilities the device wasn't designed to handle. The theory doesn't provide great tools for predicting or evaluating these complex downstream effects. It's a limitation in *application*, not necessarily a fatal flaw in the *concept*, but it underscores that real-world institutional precommitments are messier than the mythical mast.

  **Verdict on the Mapping:**

  The Ulysses framework **maps remarkably well** onto the two-term evolution: a weak precommitment (norm) fails under maximal temptation, leading to a stronger one (amendment) with higher costs of violation. The difference in cost *does* explain the norm's century-long resilience and its FDR-era collapse. However, the case **exposes two significant tensions in the theory when applied to complex democratic institutions:**

  1.  **The "Cool Hour" Ambiguity:** The theory struggles to differentiate between precommitments made with sober foresight and those enacted as reactive, potentially overzealous, corrections to a recent trauma. Both are "precommitments," but their legitimacy and long-term wisdom may differ.
  2.  **The Unintended Consequence Burden:** While the theory accepts trade-offs, the chronic lame duck problem illustrates how institutional precommitments can generate persistent negative side-effects that weaken the very system they aim to protect, raising questions about whether the cure is worse than the disease *in practice*, even if the *intent* (resisting the siren) aligns perfectly with Ulysses' logic.

  The FDR case shows Ulysses-contract theory is a powerful lens for understanding *why* norms become rules, but it also reveals the theory's limitations in assessing the *quality* of the precommitment's origin and its full spectrum of real-world consequences. The mast holds, but the ship might sail less effectively because of it.
