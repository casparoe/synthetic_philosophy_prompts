answer: |-
  Here’s a focused 50-minute plan prioritizing structural dependencies and misconception management:

  **Dependency Structure:**  
  1. Hume’s *concession* of divine providence (premise)  
  2. The natural-law prohibition’s three foundations (duties)  
  3. Hume’s *reductio*: Internal contradiction *within* the conceded framework  
  *(Without (1), the argument reads as utilitarian; without (2), the reductio lacks force)*  

  **Order of Components:**  
  *(Total: 45 min discussion + 5 min wrap-up)*  
  1. **Hook (5 min):** Poll: "If God governs all events, does suicide 'disturb' divine plan more than other human actions?" *Record responses.*  
  2. **Establish Concession First (10 min):**  
     - Clarify: Hume *starts* by assuming providence ("the Almighty has ends...") not to endorse it, but to show natural-law theory *collapses under its own logic*.  
     - **Head off "miracles argument" misconception HERE:** "Unlike miracles, Hume isn’t weighing probabilities. He’s accepting the opponent’s premise to expose incoherence."  
  3. **Lay Out the Three Duties (8 min):**  
     - Diagram: Duties to God/neighbour/self as pillars of prohibition.  
     - Hume’s move: Grant these duties matter, then test consistency.  
  4. **Core Case: The Plague-Stricken Governor (12 min)**  
     - *Must have:* A devout ruler quarantined in a plague-ravaged city. If he stays, he dies slowly, infects others via caretakers, and causes societal collapse. If he suicides, he saves lives instantly.  
     - *Must lack:* Modern "autonomy" language; any hint of "uselessness" or social burden. Focus: Is suicide *more* disruptive to providence/others/self than inaction?  
     - *Why Hume’s examples fail:* His "gout" case invites "cost-benefit" misreading; the river analogy (use NEXT) is abstract.  
  5. **Diverting the River Analogy (5 min - AFTER case discussion):**  
     - Deploy *after* the plague case exposes the "proves too much" issue.  
     - Key: "If diverting rivers (altering nature) is licit, why is suicide (altering life) uniquely illicit *under providence*?"  
     - **Head off "Hume advocates free suicide" HERE:** "Note: He’s asking why suicide is *singled out* as impious when all actions alter causes. Not endorsing it."  
  6. **"Objection Proves Too Much" Point (5 min):**  
     - Hammer: Natural-law logic would forbid *any* life-altering act (medicine, farming). The plague case shows suicide *could* fulfill duties *better* than alternatives under providence.  
     - **Head off "cost-benefit" misconception HERE:** "Hume isn’t calculating social utility. He’s showing the prohibition’s *own criteria* justify suicide in some cases."  

  **Closing Diagnostic Question (5 min):**  
  *"If a natural-law defender replied, 'Suicide violates God’s authorship of life in a way diverting rivers does not,' how would Hume respond—and does this strengthen or weaken his reductio?"*  
  - **Grasped structure:** Identifies Hume would demand *why* within the providential framework (exposing ad hoc exception). Strengthens reductio.  
  - **Superficial:** Claims Hume "denies God" or "prioritizes outcomes."  

  **What to Cut & Announce:**  
  - **Announce upfront:** "We’re cutting comparative analysis with modern right-to-die arguments and Hume’s biography. Focus today: the *logic* of his 1777 essay as internal critique."  
  - **Justification:** Modern debates require different frameworks; biographical context distracts from argumentative structure.  

  **Why this works:**  
  - The plague case forces engagement with duties *without* anachronism.  
  - Sequencing misconceptions at friction points ("miracles" early, "cost-benefit" when utility seems implied, "free suicide" when analogy arises) prevents entrenchment.  
  - Closing question tests if they see the reductio’s dependence on the conceded premise.  

  **Materials:** Whiteboard for three duties + "Governor’s Choice" scenario in bold. No handouts—keep attention on live discussion.
