prompt: |-
  ok so I'm speccing a forecasting tool that has to assign itself a probability of success at tasks nobody has really attempted before — first-of-a-kind engineering, a novel surgical procedure, an experiment with no pilot data — and every version of this I try bottoms out in the reference class problem. Before I go read up on proposed fixes I want to know what I should be demanding of one.

  Give me exactly five numbered items and nothing else, no intro and no wrap-up paragraph. Items 1–4 are the requirements any adequate rule for choosing a reference class has to satisfy; each one comes with the concrete case that motivates it, a tag saying whether it's non-negotiable or just the taste of one camp, and mark whichever of the four you think does the most work eliminating candidates. Work in the stuff I keep tripping over: a rule you can go shopping for after you've seen the outcome isn't testable at all, re-describing the same situation in logically equivalent terms shouldn't move the number, and I don't know what to do when the most homogeneous class available has n = 2. Also — and this is the one I most want your take on — whether reference classes can be *performative*: publishing a base rate for "projects that consulted this tool" plausibly changes the base rate for that very class, and I have no idea if a selection rule is even supposed to cope with that or if it's out of scope.

  Item 5 is the pair of requirements you think genuinely can't be met at the same time, with a sentence or two on why the conflict is structural rather than a matter of not having found the right rule yet. Keep every item to a sentence or two.
reasoning: |-
  Hmm, the user is designing a forecasting tool that needs to assign probabilities to unprecedented tasks like first-of-a-kind engineering or novel surgeries. They're struggling with the reference class problem and want exactly five numbered requirements for choosing reference classes. They want four requirements that any adequate rule must satisfy, each with a concrete case, whether it's non-negotiable or just one camp's view, and they want me to mark which of these four does the most work eliminating candidates. The fifth item should be about conflicting requirements that can't be solved simultaneously. They also mention specific issues: rules that can be adjusted after seeing outcomes aren't testable, logically equivalent descriptions shouldn't change the probability, small sample sizes like n=2, and whether reference classes can be performative—meaning that publishing a base rate might alter future outcomes for that class.

  First, I need to understand the core challenges. The reference class problem involves selecting a group of past cases to predict a new one, but for unique events, it's tricky. The user is hitting pitfalls like post-hoc adjustments, which aren't testable, and invariance to redescription, which relates to consistency. The performative aspect is interesting—it's like the tool could influence its own accuracy, which adds complexity.

  For the four requirements in items 1-4, I should base them on established principles from decision theory or statistics. Let me brainstorm: one requirement must address non-arbitrariness, meaning the rule shouldn't allow cherry-picking classes after knowing the outcome. That's non-negotiable and motivated by the need for testability. A concrete case could be forecasting a new rocket launch; if I can redefine the class based on success, it's useless. That should be item 1.

  Another requirement is invariance to logically equivalent descriptions. For example, describing a surgical procedure as "minimally invasive" vs. "using small incisions" shouldn't change the probability. This is also non-negotiable because it's about logical consistency. Motivated by cases like rephrasing project details. This could be item 2.

  Then, there's the issue of small samples. The rule must handle cases where the most homogeneous class has very few instances, like n=2. This might be negotiable—some camps might allow it with adjustments, while others insist on larger samples. A case could be a rare medical trial with only two prior attempts. This is item 3.

  For the performative aspect, the rule needs to account for potential feedback loops. If publishing a base rate for "projects using this tool" affects future project success, the class changes dynamically. This is probably a taste of one camp—some might see it as essential for accuracy, others as out of scope. Motivated by the tool's own impact, like in policy or tech adoption. This could be item 4.

  I need to mark which of the four does the most work eliminating candidates. Non-arbitrariness is key because it prevents gaming the system, so it rules out many bad rules. I'll mark that as item 1.

  Now for item 5, the conflict. The biggest tension might be between requiring homogeneity (specific classes for accuracy) and adequate sample size (needing enough data). With unprecedented tasks, the most specific classes are sparse, leading to a trade-off. This is structural because uniqueness implies scarcity, so no rule can magically create data. Another conflict could be between performativity and stability—if the class changes, it's hard to define a stable base rate. But the homogeneity vs. sample size seems more fundamental.

  Let me outline the five items clearly:

  1. Non-arbitrariness: Rule must not allow class selection after outcome knowledge. Non-negotiable. Case: Rocket launch forecast. Does most work.

  2. Invariance: Logically equivalent redescriptions shouldn't alter probability. Non-negotiable. Case: Surgical procedure phrasing.

  3. Small sample handling: Must specify handling for homogeneous classes with minimal n. Negotiable. Case: Rare medical trial with n=2.

  4. Performativity accommodation: Rule should address potential feedback from publishing rates. Taste of one camp. Case: Tool's own user base.

  5. Conflict: Homogeneity requires specificity, but sample size needs breadth; unprecedented tasks force this trade-off structurally.

  I need to keep each item to a sentence or two, no intros or wrap-ups. This should cover all bases and be precise.
answer: |-
  1.  **Non-arbitrariness (Pre-outcome commitment):** The rule must objectively specify the reference class *before* the task outcome is known or could influence selection; post-hoc class shopping renders forecasts untestable. *Non-negotiable. Motivating case: Defining the class for a novel rocket engine test after knowing its success/failure.* **Does the most work eliminating candidates.**
  2.  **Invariance to Logical Redescription:** The rule must yield the same probability assignment regardless of logically equivalent descriptions of the task or class; redescriptions shouldn't manipulate the base rate. *Non-negotiable. Motivating case: Describing a surgical technique as "minimally invasive abdominal" vs. "laparoscopic with sub-5cm incisions".*
  3.  **Small-n Specification:** The rule must explicitly define how to handle cases where the most homogeneous, relevant class (per the rule's criteria) has very small membership (e.g., n=2), specifying acceptable thresholds or aggregation methods. *Negotiable (taste of camp favoring homogeneity over size). Motivating case: Predicting success of a fusion experiment using only two prior attempts with identical confinement geometry.*
  4.  **Performativity Scope Declaration:** The rule must explicitly state whether it can handle or is invalidated by potentially performative classes (e.g., "projects using this tool"), where publishing the forecast/base rate may alter future success rates for that class. *Taste of one camp (e.g., those prioritizing dynamic models). Motivating case: The tool's own forecast for "projects consulting this tool" potentially changing user behavior and thus the class's future base rate.*
  5.  **Homogeneity-Sample Size Conflict:** Maximizing class homogeneity (specificity/relevance) inherently minimizes sample size, especially for unprecedented tasks, while sufficient statistical power requires larger, less homogeneous classes; this trade-off is unresolvable by any selection rule because unprecedented tasks are definitionally scarce within highly specific categories.
