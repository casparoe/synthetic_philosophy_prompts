answer: |-
  ### Bottom Line
  Alan is more right overall: the dispute ultimately turns on whether contemporaneous external evidence can elevate a legendary tradition to "happened" status despite narrative embellishment.

  ### Move Ratings and Justifications

  1.  **Alan: Mostly right.** His convergence of Hittite archives and archaeology provides credible evidence for a conflict involving Troy/Wilusa and Greeks (Ahhiyawa) in the relevant period. However, he overstates "same city" certainty—the Hittite-Troy link is plausible but not universally accepted.
  2.  **Nadia: Mixed.** Correct that the archives don’t prove the Homeric war’s specifics, but wrong to reduce it to just "trouble." Her "Trojan War is a poem" overcorrects by ignoring the evidentiary anchor Alan presents.
  3.  **Alan: Mostly right.** Valid defense of historical methodology: ancient sources are often late and literary, yet we accept corroborated cores. His geography/economy point strengthens plausibility, but "empties the past" overstates Nadia’s position.
  4.  **Nadia: Mostly mistaken.** The filtering charge is unfair: Alan’s method (discounting supernatural/elements uncorroborated or implausible) is standard practice, not circular. The material-culture pastiche supports her, not Alan (see sub-issues).
  5.  **Alan: Clearly mistaken.** Misreads the pastiche: accurate transmission of *one* artifact (e.g., the boar’s tusk helmet) doesn’t prove fidelity to a *specific event*, only to cultural memory. The catalogue of places is right in conclusion (supports Mycenaean memory) but wrong as a rebuttal—it doesn’t address event specificity.
  6.  **Nadia: Mostly mistaken.** The Arthur comparison fails: Troy has Bronze Age evidence placing Greeks in conflict with a named city (Wilusa/Ilios) contemporaneously; Arthur lacks equivalent documentation. The "residue too thin" claim ignores the Hittite asymmetry.
  7.  **Alan: Mostly right.** Correctly identifies the evidentiary asymmetry as decisive: Hittite archives provide third-party, contemporary evidence of a Greek-Trojan conflict, which Arthur lacks. But "no amount of corroboration ever could" overreaches—some legends *are* unfalsifiable.
  8.  **Nadia: Mixed.** The referent-shift point lands partially—Alan’s "limited conflict" *is* a narrower claim than the epic war. But it overreaches by implying the phrase has "no determinate referent": the archives confirm a conflict involving Troy and Greeks, making "Trojan War" meaningfully referential. Her Helen/Achilles objection is valid but doesn’t erase the core event.
  9.  **Alan: Mostly right.** Correct that Nadia can’t simultaneously deny the war’s historicity while claiming the phrase lacks a referent—this preserves her negative claim without accountability. His "partly historical" framing is stable, though "refusal to engage" mischaracterizes her methodological caution.

  ### Sub-Issues Addressed
  - **Hittite material’s weight:** Confirms a Greek-Trojan conflict ca. 1200 BCE but is silent on legend specifics (e.g., Helen, decade-long siege). It anchors a historical core but cannot prove the epic’s plot.
  - **Move 4’s filtering charge:** Unfair. Alan’s method (discounting unsupported elements) is standard historical practice, not unfalsifiable—e.g., if Hittite archives contradicted Troy’s existence, his case would collapse.
  - **Material-culture pastiche:** Supports **Nadia**. The mix of periods (e.g., cremation vs. Mycenaean inhumation) shows the tradition absorbs multiple eras, undermining Alan’s claim it reliably transmits *one event*.
  - **Arthur comparison (Move 6):** Fails. Troy’s Hittite/Greek evidence has no Arthurian parallel—the "near-contemporary" account (Gildas) doesn’t name Arthur or Camelot, while Hittite texts name Wilusa and Ahhiyawa hostilities.
  - **Referent-shift (Move 8) and parity reply (Move 9):** Move 8 overreaches by denying *any* referent, but Move 9’s parity reply defeats it: if "Trojan War" has no referent, denying it is equally empty. The archives provide *enough* specificity for a minimal referent ("Greek-Trojan conflict ca. 1200 BCE").

  ### Substantive vs. Verbal Disagreement
  Partly verbal: Alan defines "Trojan War happened" as a historical conflict at Troy involving Greeks; Nadia defines it as the Homeric narrative. **Substantive question:** Did a specific Late Bronze Age conflict at Hisarlik involving Aegean Greeks inspire the epic tradition? 

  ### Strongest Unraised Consideration
  The **scale of destruction at Troy VIIa** (ca. 1200 BCE)—violence, fire, projectile weapons—supports Alan’s "limited conflict" independently of texts, making a minor raid implausible and corroborating the tradition’s core.

  ### Criterion for Legend Becoming History
  **A legend becomes history when:**  
  (1) External evidence confirms its core spatial/temporal coordinates, and  
  (2) The event type described is plausible for that context.  
  **Clause (1) does the most work**, as it anchors the tradition to a specific historical moment.  

  - **Troy:** Satisfies both. Hittite texts + archaeology confirm conflict at Hisarlik ca. 1200 BCE; trade-war plausibility is high.  
  - **Arthur:** Fails (1). No contemporaneous evidence places Arthur at specific coordinates (e.g., Camelot).  
  - **Exodus:** Fails (1). No Egyptian evidence corroborates Israelite presence/escape in the relevant period (Ramesside era).
