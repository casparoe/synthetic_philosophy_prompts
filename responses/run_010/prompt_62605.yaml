prompt: |-
  **Purpose first, because adequacy is relative to it.** I want a specification — not a defence, and not a survey — of what a theory of *geometric* rationality in stake-sizing must be able to do in order to count as a serious normative competitor to expected-utility maximisation over terminal wealth. The intended application is a single, indefinitely long-lived agent (a person, an endowment, or an autonomous system that must fund its own continued operation out of its own capital) who faces a long sequence of wagers and cannot recruit anyone else to share the risk. Treat the list as a specification that a reader could use to reject candidate theories without having to adjudicate the underlying philosophy.

  **The cases the desiderata must be built around.** Please construct your requirements so that each is motivated by something like one of the following, and say explicitly which case each requirement is answering to.

  1. *The reference wager.* A repeated even-money bet, staked as a fraction of current capital, with probability 0.6 of winning each round, independent across rounds. The growth-rate-maximising stake is 0.2 of the bankroll; the stake at which the long-run growth rate falls to zero is a little below 0.4; staking 0.5 is worse than not playing at all in the long run despite the bet having positive expected value. Any account that cannot explain why three different verdicts attach to three different stakes of the same favourable bet has not yet said what its criterion is about.

  2. *The estimated edge.* Same wager, but the 0.6 is not known: the agent has seen 15 heads in 25 flips and has a posterior over the true probability wide enough that a non-negligible probability remains that the bet is in fact unfavourable. Does the criterion apply to the growth rate under the true distribution, under the agent's beliefs, or under neither? Is plugging the point estimate into the Kelly formula the answer, and if not, what does the theory owe instead?

  3. *The operations floor.* The agent must pay a fixed cost each period to keep operating, and a bankroll below some multiple of that cost means it is switched off rather than merely poorer. The floor is endogenous: it moves with the agent's own plans. A stake that is growth-optimal on the unfloored problem can carry a small but real probability of breaching the floor, and breaching it is not a bad outcome on the scale of the criterion — it removes the agent from the sequence altogether.

  4. *Two ledgers.* The agent keeps a floored operating pot and an unfloored expansion pot and wagers from both. Is growth-optimality applied to the sum, to each pot separately, or is the question ill-posed? Note that the two answers can diverge even when both pots face the same wager, and that they diverge further when the wagers differ.

  5. *Withdrawals.* An agent that consumes, or that pays out to beneficiaries, rather than accumulating. A criterion defined purely over wealth at a terminal date has no verdict at all for an agent with no terminal date, and the growth-optimal stake plausibly changes once a fixed proportional withdrawal is introduced.

  6. *Restoring the ensemble.* Suppose the agent can sell partial claims on its own future payoffs to many small counterparties, or buy insurance against a run of losses, at some price. This looks like a way of converting a path-dependent position into something closer to an average over parallel positions. Does the growth-rate norm lose its force once such markets exist — and if the transfer is costly, does the criterion apply before or after the cost?

  7. *Dependence.* The i.i.d. structure is doing the work that lets realised growth converge to expected log return at all. State the dependence conditions the criterion needs, and what the theory says when rounds are positively autocorrelated or when the agent faces a persistent regime rather than a stable distribution.

  **What I want in the deliverable.**

  - A numbered list of requirements, each with the case or consideration behind it, stated so that a theory can be checked against it rather than admired. Include requirements about what the theory must *explain*, not only what it must recommend — in particular, whether it must account for the special status of logarithmic utility (the fact that it is the utility function under which short-horizon optimisation coincides with long-horizon optimisation in the independent setting) or whether it may simply assume it.
  - Mark each requirement as non-negotiable or as a preference of one camp. A table is welcome here. I expect some of what growth-maximisers and expected-utility theorists each demand of the other is prejudice rather than desideratum, and I want that separated out.
  - Flag any requirement that is question-begging — that is, any putative desideratum that already contains the answer to the central dispute, which as I understand it is Samuelson's objection that maximising expected log wealth is one more expected-utility calculation rather than an independent criterion of rationality, and that no finite-lived agent is compelled to adopt it.
  - Identify any subset of the requirements that cannot be jointly satisfied. My suspicion is that demanding applicability under parameter uncertainty, demanding that the criterion track the growth rate of the agent's actual wealth, and demanding that the agent need not know the true distribution form such a subset, but I may be wrong, and if the tension is resolvable I want to see how.
  - Say which single requirement does the most exclusionary work — which one, if insisted upon, eliminates the largest share of the positions people actually hold.
  - Require the theory to state what geometric rationality adds over ordinary expected-utility maximisation with a logarithmic utility function. If the honest answer is "nothing but emphasis", that should itself be recorded as a possible outcome rather than papered over.

  **Finally, and briefly:** no more than four lines each on how full-Kelly growth maximisation, fractional-Kelly-with-a-prudential-margin views, and unconstrained expected-utility maximisation over terminal wealth fare against your list. I care far more about the list than the scorecard, and I would rather you cut the scorecard than thin out the requirements. Please write throughout in British English.
reasoning: |-
  Hmm, the user wants a rigorous specification for theories of geometric rationality in stake-sizing, framed as requirements derived from specific case studies. This is a sophisticated request that cuts to the heart of debates in decision theory and portfolio optimisation.  

  Breaking this down: First, I need to anchor each requirement to one of their seven cases. The reference wager establishes core properties any geometric theory must explain - particularly how different stakes yield fundamentally different long-run outcomes despite identical expected value per bet. That's non-negotiable; a theory failing here isn't about geometric rationality at all.  

  The estimated edge case exposes a fault line. If a theory requires knowledge of true probabilities to prescribe stakes, it's practically useless. But if it relies solely on beliefs, how does it guard against overbetting on uncertain edges? This tension might be unresolvable - hence Requirement 3 flags it as a known conflict.  

  Operations floor and two ledgers both deal with constraints. Geometric rationality must handle minimum survival thresholds without pretending the floor doesn't exist (like naive Kelly might), and explain why separate pots shouldn't always be merged. Withdrawals force the theory to address consumption - does geometric growth remain meaningful when wealth leaks out?  

  Restoring the ensemble tests the theory's dependence on isolation. If markets allow risk-sharing, does geometric growth lose its normative force? And dependence requires clarifying what temporal structures the theory assumes - i.i.d. is a fantasy.  

  For deliverables, I'll structure requirements with case mappings and negotiation status. The parameter uncertainty triad (Requirements 3-5) is deliberately flagged as conflicting - no theory can fully satisfy believing in true growth rates, using beliefs, and not needing true probabilities. Among exclusions, Requirement 1 does heaviest lifting: rejecting stake-dependent outcomes eliminates most non-geometric approaches.  

  Finally, the key differentiator: geometric rationality must justify why it isn't just expected utility with log utility. If it can't, that's an admission worth recording.  

  On scoring existing approaches: Full Kelly fails floors and uncertainty; fractional Kelly dodges some disasters but lacks foundation; EU maximisation ignores growth dynamics entirely. All stumble on multiple requirements - as intended, since the specification aims to be demanding.
answer: |-
  Below is a specification of requirements for a theory of *geometric rationality* to count as a serious normative competitor to expected utility (EU) maximisation over terminal wealth. Requirements are derived from your cases, marked as **non-negotiable** (core to geometric rationality) or **preferred** (common in the literature but potentially contested). Tensions and exclusions are flagged. British English is used throughout.

  ---

  ### **Requirements for a Theory of Geometric Rationality**  
  *(Case-motivated, with negotiation status and philosophical flags)*  

  | # | Requirement                                                                 | Case Reference | Non-negotiable (NN) / Preferred (P) | Question-Begging? | Notes                                                                 |
  |---|-----------------------------------------------------------------------------|----------------|--------------------------------------|-------------------|-----------------------------------------------------------------------|
  | 1 | **Must explain why three stakes of the *same* favourable bet (e.g., 0.2, 0.4, 0.5 of bankroll) yield distinct long-run outcomes: growth-optimal, growth-neutral, and growth-destructive.** | 1 (Reference wager) | NN | No | Central to geometric rationality. Rejects EU’s stake-indifference for repeated bets. |
  | 2 | **Must prescribe stakes based on *beliefs* (posterior) when true probabilities are unknown, not ground prescriptions solely in true distributions.** | 2 (Estimated edge) | NN | No | Addresses epistemic humility. Rejects "true growth rate" as inaccessible. |
  | 3 | **Must account for survival constraints (e.g., an operations floor) by adjusting stakes to avoid ruin with high probability, even if this sacrifices some growth.** | 3 (Operations floor) | NN | No | Geometric rationality ≠ blind growth; survival is a precondition. |
  | 4 | **Must unambiguously prescribe whether growth-optimality applies to *total wealth*, *separate pots*, or a composite when capital is partitioned (e.g., two ledgers).** | 4 (Two ledgers) | P | No | Tests coherence: does "geometric" imply fungibility? |
  | 5 | **Must extend to agents making *withdrawals* (e.g., consumption), adjusting stakes to preserve long-run viability under outflow.** | 5 (Withdrawals) | NN | No | Rejects terminal-wealth fixation. Withdrawals alter growth dynamics. |
  | 6 | **Must clarify if risk-sharing markets (e.g., selling claims) nullify geometric rationality’s primacy, or if it persists after accounting for costs.** | 6 (Restoring ensemble) | P | Potentially | Tests if geometric rationality is fundamentally *path-dependent*. |
  | 7 | **Must state dependence assumptions (e.g., i.i.d. vs. autocorrelated regimes) and adjust stakes when independence fails.** | 7 (Dependence) | NN | No | Geometric growth relies on ergodicity; theory must define limits. |
  | 8 | **Must explain why logarithmic utility is privileged** (e.g., as the myopic optimum for long-run growth under independence). | Implicit | NN | Yes | Assumes log utility’s status is axiomatic; Samuelsonians reject this. |
  | 9 | **Must not conflate geometric rationality with EU maximisation using log utility**—it must add distinct conceptual value (e.g., focus on *path survival*). | All | NN | Yes | Core dispute: is it a *criterion* or just EU in disguise? |
  | 10| **Must track the growth rate of the agent’s *actual realised wealth***, not a counterfactual or ensemble average. | 1, 3, 5 | NN | Yes | Rejects ensemble equivalence; defines rationality as *individual trajectory*. |

  ---

  ### **Key Tensions and Exclusionary Power**  
  - **Irreconcilable Triad** (Requirements 2, 8, 10):  
    - *Requirement 2* (use beliefs) + *Requirement 10* (track actual growth) + *Requirement 8* (explain log utility’s role) creates tension. If growth is defined by *true* probabilities (8), but agents use *beliefs* (2), actual wealth growth (10) may diverge. **Resolution**: Theory must define growth relative to beliefs (e.g., Bayesian growth rate).  
  - **Most Exclusionary Requirement**: **#1** (stake-dependent outcomes). Eliminates EU maximisation over terminal wealth (which is stake-invariant) and naive risk-minimisation.  
  - **Question-Begging Flags**:  
    - Requirements 8–10 subtly assume geometric rationality’s validity (e.g., path-dependence is paramount). Samuelsonians reject this.  

  ---

  ### **How Theories Fare (Briefly)**  
  1. **Full-Kelly Growth Maximisation**:  
     - *Pros*: Nails #1, #8, #10; explains log’s role.  
     - *Cons*: Fails #3 (ignores floors), #2 (overbets on point estimates), #7 (assumes i.i.d.).  

  2. **Fractional-Kelly with Prudential Margin**:  
     - *Pros*: Addresses #2 (hedges uncertainty), #3 (avoids ruin).  
     - *Cons*: Ad hoc; no principled link to #8 or #10. Avoids #1’s extremes but lacks foundation.  

  3. **Unconstrained EU Maximisation (Terminal Wealth)**:  
     - *Pros*: Clear under #6 (markets reduce risk), #4 (fungibility).  
     - *Cons*: Fails #1 (stake-indifferent), #5 (withdrawals ignored), #10 (ignores path-dependence).  

  ---

  ### **Conclusion**  
  A theory of geometric rationality must treat *growth* as a path-dependent survival criterion (Requirements 1, 3, 5, 10), grounded in beliefs (2, 7), while justifying log utility’s primacy (8) and distinguishing itself from EU (9). The operations floor (#3) and withdrawals (#5) are non-negotiable for realism. If the theory cannot add value beyond “EU with log utility”, it concedes Samuelson’s objection.
