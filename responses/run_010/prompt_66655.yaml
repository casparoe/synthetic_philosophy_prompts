  Finally, for section 5, I'll craft seminar-ready talking points: concede Adams on assertability but distinguish it from credal updating, highlight van Fraassen's solution as standard, and insist that utterance selection remains relevant evidence. Should emphasize this is about total evidence, not mistrusting the farmer.

