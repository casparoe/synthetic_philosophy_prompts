answer: |-
  ### **The Parity Deck: Fairness Without Friction**  
  **Seamlessly optimize equity in rental screening — no ethics degree required.**  

  Vantage Equity Labs transforms algorithmic fairness from a philosophical quagmire into a configurable dashboard. Our flagship product, the Parity Deck, integrates with your existing risk model to enforce federally recommended fairness criteria. Select your preferred equity constraints with one click, and let our post-processing layer handle the rest. Compliance? Achieved. Values? Optional.  

  ---

  ### **PRICING PLANS**  
  **Starter** ($7,500/month)  
  - Enforce **one** fairness criterion: Demographic Parity, Equal Opportunity, *or* Predictive Parity.  
  - Basic threshold tuning per demographic group.  
  - Compliance reports for audits.  
  - Support for up to 5,000 applications/month.  

  **Professional** ($22,000/month)  
  - Harmonize **any two** fairness criteria simultaneously (e.g., Equal Opportunity + Predictive Parity).  
  - Dynamic threshold optimization to minimize "trade-offs" (patent pending).  
  - Includes **Complaint Resolution Suite™** (see add-ons).  
  - Real-time fairness dashboard with disparity alerts.  
  - Up to 50,000 applications/month.  

  **Enterprise** ($65,000/month)  
  - **All three criteria unified**: Demographic Parity, Equalized Odds, *and* Predictive Parity.  
  - Reserved for clients with **harmonized outcome base rates** (≤2% divergence) or models achieving >99.5% accuracy.  
  - Dedicated "Fairness Architect" for end-to-end alignment.  
  - Unlimited applications.  
  *(Eligibility verified by Vantage audit. Limited availability.)*  

  **Add-ons**  
  - **Complaint Resolution Suite™** ($4,000/month): Proactively resolve fairness complaints by "optimizing operational narratives." *No core model changes required.*  

  ---

  ### **FREQUENTLY ASKED QUESTIONS**  
  **Q: Can I enforce both Predictive Parity (calibration) and Equalized Odds?**  
  A: Absolutely! However, these criteria — alongside Demographic Parity — form the "Fairness Triad." While mathematically interdependent, our Professional tier lets you prioritize any two. For clients needing all three, our Enterprise tier is ideal for populations with aligned base rates (e.g., "luxury-building applicants only"). We find most customers prefer focusing on two metrics that align with their existing risk tolerance.  

  **Q: How does base rate divergence impact Demographic Parity?**  
  A: Consider a screening pool with two groups:  
  - **Group A**: 1,000 applicants | True approval rate = 20%  
  - **Group B**: 1,000 applicants | True approval rate = 40%  
  To enforce Demographic Parity (equal approval rates), we set thresholds targeting 30% approval overall:  
  - *Group A*: Threshold lowered → **FPR = 18%** (result: 200 approved)  
  - *Group B*: Threshold raised → **FPR = 6%** (result: 300 approved)  
  *Result: Both groups achieve 30% approval, but Group A’s FPR triples Group B’s. The Parity Deck automates this "threshold balancing."*  

  **Q: Does the Parity Deck alter our proprietary risk model?**  
  A: No! We honor your model’s "original risk insights." The Parity Deck applies group-specific thresholds to your scores, ensuring compliance without recalibration.  

  **Q: What does the Complaint Resolution Suite™ do?**  
  A: This add-on resolves fairness complaints by "contextualizing outcomes." It dynamically adjusts post-decision workflows, applicant segmentation, or reporting taxonomies to ensure regulatory inquiries are closed swiftly. *All changes are audit-trail compliant.*  

  ---

  ### **CUSTOMER TESTIMONIAL**  
  > "We struggled with 25% lower approval rates for Group X. With Parity Deck’s Professional tier, we enforced Equal Opportunity and Predictive Parity. Now, false negative rates are balanced, and risk predictions are calibrated — all while keeping our overall approval rate high. We simply deprecated Demographic Parity; our legal team says it’s ‘redundant’ when you redefine ‘qualified tenant’ around credit tiers!"  
  > — **Jordan Reed, VP of Compliance, Prestige Rentals Inc.**  

  ---

  ### **FINE PRINT**  
  *Fairness criteria are mathematically interdependent; simultaneous enforcement of all three requires identical outcome base rates or near-perfect model accuracy (Enterprise tier only). The Complaint Resolution Suite™ may involve adjustments to decision thresholds, applicant grouping logic, or outcome documentation frameworks. Vantage Equity Labs does not guarantee alignment with specific legal standards. "Harmonized base rates" require annual Vantage audits. Results assume your risk model is Y% accurate; accuracy not guaranteed. The Parity Deck® is a decision-layer overlay and does not modify core risk algorithms. Trade-offs are a feature, not a bug.*  

  ---  
  **Vantage Equity Labs: Configure Your Conscience™**
