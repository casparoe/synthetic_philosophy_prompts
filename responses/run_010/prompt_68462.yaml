prompt: |-
  I'm a program officer at a small private foundation that funds theoretical fundamental physics — quantum gravity, early-universe cosmology, that kind of thing. Our board has an unusual mandate: we're allowed to fund work that won't be testable on any reasonable timescale, and we actually do, roughly a third of our portfolio. The problem is I have no defensible way to choose within that third. Right now it comes down to whichever applicant writes the most stirring prose about beauty and inevitability, and one of our reviewers — a working physicist, quite hostile to the whole post-empirical idea — writes back that we're funding theology. Both of those outcomes are embarrassing at board meetings.

  I want to build the case around the non-empirical confirmation stuff in the philosophy of physics — Dawid's framework, as I've read it: the reasoning from there being no viable alternative to a theory within a well-mapped local space of possibilities, the reasoning from a theory unexpectedly cohering with or explaining things it wasn't built for, and the meta-level reasoning from the track record of that kind of inference in physics generally. Turn that into a triage procedure I can actually run.

  Here's the shape of my job. Forty-odd proposals a cycle, and I get maybe twenty minutes of my own read on each before it goes out to external referees; I then write a one-paragraph rationale that a board of non-specialists can audit, and my director signs off. So the procedure has to be something I can run in that window without doing the physics myself, and every step needs to say what a *sufficient* answer looks like in writing — not "assess whether the theory space is exhausted" but the specific sentence in the proposal that would satisfy you and the specific sentence that would fail you.

  What I need:

  - Ordered questions, with a stated pass/fail for each and the points where the procedure stops at "no" versus where it hands the call to a human because the question is really about portfolio risk or who deserves a career, not about confirmation.
  - Explicit machinery for the obvious abuses: "no alternatives" that just means "only eleven people work on this, eight of them from two schools"; coherence that the same group manufactured after the fact; a framework flexible enough to absorb any observation it meets. Build the tests in as steps, not as warnings in the preamble.
  - A rule for distinguishing "not testable on our horizon" from "not testable in principle," and what to do when the proposal is silent about the difference, which most of them are.
  - A default for missing information — I'd rather have a conservative default than a hole in the procedure.
  - Honesty about which steps are judgment wearing a procedure's clothes, flagged as such, because I'd rather defend three soft steps than pretend there are none.
  - A one-paragraph template for the board rationale that a hostile reviewer can't trivially knock down.

  Then run it on three hypothetical proposals: (1) a quantum gravity program whose applicants argue the core problem has gone twenty years without a serious rival approach, and where the subfield is about fifteen researchers, mostly trained in two groups; (2) a proposed measure over a string landscape, built to fix one fine-tuning problem, whose applicants claim it also falls out of an unrelated consistency condition and lands on a numerical coincidence nobody put in; (3) a small, very elegant formalism I personally love and have staked some credibility on, whose central selling point is that it explains why the other programs fail, and which makes contact with no conceivable observation inside fifty years. On the third one, give me the answer the procedure actually produces, even if it's a flat no — and if you think the procedure is wrong rather than my instinct, argue that separately rather than bending the steps to rescue the proposal.

  Finish with what the procedure cannot do: things I'll be tempted to use it for and it will misfire on. And don't give me a bibliography or a reading list — I can't chase sources and neither can the person covering me next month.
reasoning: |-
  Okay, the user is a program officer at a small foundation funding untestable physics like quantum gravity and early-universe cosmology. They're struggling with how to evaluate proposals in the "post-empirical" third of their portfolio. Currently, they rely on applicants' poetic writing about beauty, which leads to criticism that they're funding theology. They want a defensible framework based on non-empirical confirmation from philosophy of physics, specifically Dawid's ideas.

  The user needs a practical triage procedure they can apply in 20 minutes per proposal. Key requirements include: clear pass/fail questions with stopping points, safeguards against common abuses, distinction between "untestable now" vs "untestable in principle," conservative defaults for missing information, and honesty about where judgment is involved. They also need a template rationale for board meetings that can withstand criticism.

  For the three hypothetical proposals: 
  First is a quantum gravity program claiming no alternatives exist, but the field is tiny (15 researchers from two groups). The procedure should catch if the "no alternatives" claim is just due to small community size.

  Second is a string landscape measure solving fine-tuning while showing unexpected coherence. Need to verify if the "unexpected" connections were genuinely surprising or manufactured.

  Third is an elegant formalism explaining why other approaches fail but with no testable contact for 50+ years. The procedure should likely reject this unless it meets strict criteria about theory space exhaustion.

  The framework should be built around Dawid's three arguments: no alternatives, unexpected coherence, and meta-induction from physics' history. Each gets specific pass/fail criteria. Important to include abuse tests - like checking if small community size creates false "no alternatives," or if coherence claims are retrofitted.

  Need clear rules for testability horizon vs principle, with presumptive rejection if silent. Defaults should be conservative (e.g., missing info = fail). Judgment steps should be explicitly flagged.

  The output rationale template must show how the proposal meets Dawid's criteria specifically, not just beauty arguments. This counters the "funding theology" critique by grounding decisions in established philosophical framework.

  Finally, must outline limitations: don't use for empirical proposals, career decisions, or judging mathematical rigor alone. The procedure only assesses non-empirical viability claims.
answer: |-
  Here's a triage procedure built on Dawid's non-empirical confirmation framework, designed for your operational constraints and explicit requirements. It prioritizes defensibility over elegance and includes hard stops for common red flags.

  **Core Principle:** We assess proposals claiming non-empirical support *only* on the strength of arguments falling within Dawid's three pillars: **Theory Space Exhaustion (TSE)**, **Unexpected Coherence (UC)**, and **Meta-Inductive Success (MIS)**. Beauty/elegance alone is *not* a criterion.

  ### The Triage Procedure (20-Minute Assessment)
  *(Run sequentially. Stop at first "No" unless specified. "Human Call" means insufficient for auto-reject but requires deeper review.)*

  1.  **Testability Horizon Declaration:**
      *   **Question:** Does the proposal explicitly state whether the theory is *principally untestable* (e.g., inherent to the theory's structure/multiverse) or *currently/practically untestable* (e.g., requires energies/observations beyond foreseeable technology)?
      *   **Pass:** Explicit statement is present (e.g., "in-principle untestable due to..." or "beyond foreseeable observational capabilities for at least 50 years").
      *   **Fail:** Statement is absent or vague (e.g., "beyond current technology," "deeply fundamental"). *Default: Assume "currently/practically untestable" unless explicitly stated otherwise.*
      *   **Action on Fail:** **Stop. Reject.** (Mandatory clarity requirement; failure indicates lack of rigor for this funding category).
      *   **Action on Pass:** Proceed.

  2.  **Non-Empirical Argument Identification:**
      *   **Question:** Does the proposal explicitly invoke *at least one* of Dawid's pillars (TSE, UC, MIS) as a primary justification for funding *this specific work*?
      *   **Pass:** Specific mention of TSE, UC, or MIS (or clear synonyms: "exhaustion of alternatives," "unexpected connection/explanation," "historical success of similar reasoning") linked directly to the proposed theory/work.
      *   **Fail:** Only general appeals to beauty, elegance, necessity, or "fundamentality." Argument relies solely on technical mathematical development without linking to TSE/UC/MIS.
      *   **Default:** Argument not explicitly framed within TSE/UC/MIS = **Fail**.
      *   **Action on Fail:** **Stop. Reject.** (Fails core mandate of funding based on non-empirical *confirmation* arguments).
      *   **Action on Pass:** Proceed to assess the claimed pillar(s).

  3.  **Theory Space Exhaustion (TSE) Assessment:**
      *   *Only assess if TSE is claimed.*
      *   **Question 3a (Definition):** Does the proposal define a specific, well-motivated "local theory space" (e.g., "quantum gravity approaches preserving Lorentz invariance," "inflationary potentials with sub-Planckian fields") that the theory belongs to?
      *   **Pass:** Clear definition of the relevant space is provided.
      *   **Fail:** Space is undefined, overly broad ("all theories of quantum gravity"), or defined solely by the proponents' interests. *Default: Fail if undefined.*
      *   **Action on Fail (3a):** **Stop. Reject TSE Claim.** (TSE requires a defined space).
      *   **Question 3b (Exhaustion Claim):** Does the proposal claim that *all viable alternatives* within the defined space have been *rigorously explored and found untenable* due to internal inconsistencies or failure to meet core requirements?
      *   **Pass:** Statement like: "Approaches X, Y, Z [named] within space S [defined] have been shown to suffer fatal flaws F1, F2 [specified], leaving T as the only viable candidate."
      *   **Fail:** Statement like: "Alternative A is unpopular," "Our approach is the only one pursued seriously," "No other approach solves problem P [defined only by us]." *Default: Fail.*
      *   **Action on Fail (3b):** **Stop. Reject TSE Claim.** (Lacks rigor).
      *   **Question 3c (Abuse Check - Community Size):** Does the proposal acknowledge the size/scope of the relevant research community working on this space and its alternatives? Does the exhaustion claim hold *despite* significant effort outside the proponent's group?
      *   **Pass:** Explicit mention of major competing programs/groups & why *they* failed, *or* statement acknowledging niche status but arguing exhaustion is still rigorous (e.g., "While only groups G1/G2 work on space S, the criteria C1/C2 are widely accepted...").
      *   **Fail:** No mention of competing work/communities, or exhaustion relies solely on work *by the proponents* or a very small, insular group. *Default: Fail if unaddressed.*
      *   **Action on Pass (3c):** **Human Call** (Requires reviewer expertise to *validate* the claim's plausibility). Proceed to other pillars if claimed.
      *   **Action on Fail (3c):** **Stop. Reject TSE Claim.** (High risk of "small pond" fallacy).

  4.  **Unexpected Coherence (UC) Assessment:**
      *   *Only assess if UC is claimed.*
      *   **Question 4a (Independent Origin):** Does the proposal clearly state that the coherence (connection, explanation) was *not* built into the theory from the start and was *unexpected* when discovered?
      *   **Pass:** Explicit statement: "We discovered that T, developed for purpose P, unexpectedly explains/constrains O," "Connection C was unforeseen during T's construction."
      *   **Fail:** Claimed coherence is presented as a natural consequence or built-in goal. No mention of surprise/discovery. *Default: Fail.*
      *   **Action on Fail (4a):** **Stop. Reject UC Claim.** (Lacks "unexpected" element).
      *   **Question 4b (Specificity & Independence):** Is the coherent feature (O) *specific* (e.g., a precise numerical value, a detailed structural property) and *conceptually distinct* from the theory's original purpose (P)?
      *   **Pass:** O is clearly defined and distinct from P (e.g., T built for quantum gravity unexpectedly fixes the cosmological constant; T built for particle physics unexpectedly constrains inflationary parameters). Specific number/result cited.
      *   **Fail:** O is vague ("elegance," "naturalness") or closely related to P (e.g., T for quantum gravity predicts aspects of quantum gravity better). *Default: Fail if vague.*
      *   **Action on Fail (4b):** **Stop. Reject UC Claim.**
      *   **Question 4c (Abuse Check - Retrofitting):** Does the proposal cite work *predating* the discovery of the coherence, demonstrating the theory existed *without* this feature being advertised or motivating it? Or does it describe the *process* of discovery?
      *   **Pass:** Reference to prior publications of T without O, or description of the timeline of discovery ("While studying X, we realized...").
      *   **Fail:** No evidence the coherence wasn't a designed-in afterthought. *Default: Fail if no evidence provided.*
      *   **Action on Pass (4c):** **Human Call** (Requires reviewer check for plausibility of retrofitting). Proceed to other pillars if claimed.
      *   **Action on Fail (4c):** **Stop. Reject UC Claim.** (High risk of manufactured coherence).

  5.  **Meta-Inductive Success (MIS) Assessment:**
      *   *Only assess if MIS is claimed as primary support (rare).*
      *   **Question 5a (Specific Analogy):** Does the proposal cite a *specific, well-established historical precedent* where non-empirical reasoning (TSE/UC) correctly guided theory development *before* empirical confirmation?
      *   **Pass:** Clear example given (e.g., "Acceptance of GR before Eddington due to UC/mathematical elegance *within its defined space*," "Development of QED renormalization based on absence of viable alternatives").
      *   **Fail:** Only general appeals to "physics history" or "beauty." *Default: Fail.*
      *   **Action on Fail (5a):** **Stop. Reject MIS Claim.**
      *   **Question 5b (Parallel Argument):** Does the proposal explicitly argue that the *type* of non-empirical reasoning used for *this* theory (TSE/UC) is structurally analogous to the successful historical precedent?
      *   **Pass:** Statement directly linking the reasoning used here (e.g., TSE in space S) to the reasoning in the historical case (e.g., TSE in space S_hist).
      *   **Fail:** No explicit parallel drawn. *Default: Fail.*
      *   **Action on Pass (5b):** **Human Call** (Requires expertise to assess validity of analogy). Proceed.
      *   **Action on Fail (5b):** **Stop. Reject MIS Claim.**

  6.  **Final Gate (Any Pillar Stands?):**
      *   **Question:** After assessment, does at least *one* claimed pillar (TSE, UC, or MIS) remain standing (i.e., passed its checks and reached "Human Call")?
      *   **Pass:** Yes (At least one pillar is plausible enough for expert review).
      *   **Fail:** No (All claimed pillars were rejected by the triage).
      *   **Action on Pass:** **Send for External Review** (Flagging the standing pillar(s) for referee focus).
      *   **Action on Fail:** **Reject.**

  **Rationale Template (For Board):**
  > "Proposal [Number/Title] argues its theoretical framework, while untestable for the foreseeable future ([State Horizon from Step 1]), gains non-empirical support via [State Pillar(s) that reached Human Call: TSE/UC/MIS]. Specifically, it claims [Briefly summarize *only* the *passed* claim, e.g., 'exhaustion of viable alternatives within the defined space of Lorentz-invariant quantum gravity approaches' or 'unexpected coherence between its measure on the string landscape and an independent consistency condition']. Our triage assessed these claims against criteria designed to identify robust non-empirical arguments (drawing on frameworks like Dawid's), finding them sufficiently articulated and plausibly structured to warrant expert evaluation on their technical merit and strength. External referees will now scrutinize the validity of the [TSE/UC/MIS] claim specifically."

  ### Application to Hypotheticals

  1.  **Quantum Gravity (No Alternatives):**
      *   Step 1 (Horizon): Likely Pass ("currently untestable" implied).
      *   Step 2 (Argument): Likely Pass (Claims TSE).
      *   Step 3a (Space Def): ? (Check: Is the space defined? If yes, Pass; if no, Reject).
      *   Step 3b (Exhaustion Claim): ? (Check: Does it name/describe specific failed rivals? If "Approaches X, Y failed due to Z", Pass; if "no rivals exist" or "only our approach works", Fail/Reject).
      *   Step 3c (Community Check): **Critical - Likely FAIL.** "Fifteen researchers, mostly two schools" strongly suggests a small, insular community. Unless the proposal explicitly addresses this and argues exhaustion is rigorous *despite* the small community (e.g., citing acceptance of criteria by the broader field), it fails Step 3c. **Triage Outcome: REJECT** (Fail at 3c). *Rationale for Board would focus on the failure to demonstrate rigorous exhaustion beyond a small group.*

  2.  **String Landscape Measure (Unexpected Coherence):**
      *   Step 1: Pass (Assumed in-principle/practical untestability stated).
      *   Step 2: Pass (Claims UC).
      *   Step 4a (Unexpected): Pass (If it says "unexpectedly falls out").
      *   Step 4b (Specific/Independent): Pass (Fixes fine-tuning *and* matches unrelated consistency condition/numerical coincidence).
      *   Step 4c (Retrofitting): **Critical.** Did the measure exist *before* this coherence was found? Check for reference to prior work or description of discovery process. If yes, Pass (Human Call). If no evidence provided, Fail/Reject. **Triage Outcome:** **HUMAN CALL** (if 4c Pass) for referee to assess plausibility of retrofitting and significance of coincidence. *Rationale for Board highlights UC claim passed triage checks for unexpectedness/specificity, pending expert validation.*

  3.  **Elegant Formalism (Explains Failures, No Contact):**
      *   Step 1: Likely Pass (Explicitly states >50 years).
      *   Step 2: **Critical.** What is the *primary* non-empirical argument? "Explains why others fail" sounds like TSE *about other theories*, not necessarily about itself. Does it claim TSE *for its own theory space*? Or UC? Or just its own explanatory power (insufficient under Step 2)?
      *   **Scenario A:** Only claims to explain failures of others. **Step 2: FAIL.** (Not TSE/UC/MIS for *itself*). **Outcome: REJECT.**
      *   **Scenario B:** Claims TSE: "Our formalism F is the only viable approach within space S [e.g., 'approaches unifying X and Y without mechanism Z'], as alternatives A, B, C fail criteria C1, C2." Then:
          *   Step 3a: ? (Must define S).
          *   Step 3b: ? (Must name A,B,C and failures).
          *   Step 3c: **HIGH FAIL RISK.** Given novelty/small size, unlikely to address broader community acceptance/effort unless explicitly argued. **Likely Outcome: REJECT at 3a, 3b, or 3c.**
      *   **Triage Outcome (Most Likely): REJECT at Step 2** (Lacks explicit TSE/UC/MIS claim for itself) **or Step 3c** (Small group, no evidence of broader validation of exhaustion claim). *Rationale for Board: Proposal did not articulate a claim of non-empirical confirmation via Theory Space Exhaustion, Unexpected Coherence, or Meta-Inductive Success meeting our triage criteria. Its focus on explaining other programs' failures does not constitute a non-empirical argument for its own validity under our framework.*

  ### What This Procedure CANNOT Do (And Will Misfire On)

  1.  **Judge Scientific "Importance" or "Promise":** It only assesses the *structure* of the non-empirical argument. A proposal passing might be deemed unimportant by experts. Conversely, a truly groundbreaking idea failing the triage on technicalities (e.g., poor writing omitting key phrases) gets rejected.
  2.  **Evaluate Mathematical Rigor/Novelty Alone:** Beautiful math that doesn't link to TSE/UC/MIS fails Step 2. Deep technical work without the non-empirical framing gets rejected even if valuable.
  3.  **Make Career Decisions:** A brilliant junior researcher with a poorly articulated TSE claim gets rejected. A senior figure recycling a weak UC argument might pass if they phrase it right. This is about the *proposal*, not the person.
  4.  **Handle "Paradigm Shifts" Gracefully:** Truly radical ideas often defy existing "theory spaces" (Step 3a) or lack clear historical parallels (Step 5). They will likely fail the triage unless proponents are exceptionally clear about how they fit the framework.
  5.  **Replace Expert Judgment on Validity:** Passing triage ("Human Call") means the *argument is structured plausibly enough for review*. It **does not** mean the argument is *correct*. The external review is crucial for that.
  6.  **Assess Feasibility or Methodology:** Can they actually *do* the proposed work? Is their math sound? This is purely for the external reviewers on proposals passing triage.
  7.  **Resolve "Beauty" Contests:** If two proposals both have strong TSE claims passing triage, the procedure offers no tie-breaker. This falls to portfolio balance, PI track record, and board judgment *after* external review.

  **Key Strength:** This procedure forces proponents to articulate their non-empirical case *explicitly and rigorously* according to a defined philosophical standard (Dawid), directly addressing the "funding theology" critique. It provides a clear, auditable paper trail for your decisions based on the proposal's content, not just the prose. It conservatively filters out the weakest cases quickly, focusing expensive reviewer time on proposals that at least attempt a defensible non-empirical argument.
