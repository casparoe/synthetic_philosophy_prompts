  Hmm, the user is taking a philosophy class and they discussed Ryle's distinction between knowing-how and knowing-that. The class consensus was that psychological research on "choking under pressure" supports Ryle's view - like when skilled golfers or pianists perform worse when they consciously monitor their actions. The user's brother experienced this while drumming too. The user disagrees and wants to argue that this evidence actually supports intellectualism (that know-how is a form of know-that).

  The challenge is explaining why conscious access to propositional knowledge would impair performance rather than help it. Simply calling it "tacit knowledge" isn't enough - I need to explain why extra access is actively harmful. Also, I should address which premise of Ryle's regress argument this phenomenon challenges.

  Ryle's regress argument says if know-how required know-that, we'd need an infinite regress of know-how to apply each rule. But the choking phenomenon might challenge the premise that accessing propositional knowledge always improves performance. Maybe accessing it disrupts automated processes.

  For the intellectualist argument: I can draw on cognitive science concepts like dual-process theory. Experts automate skills through procedural memory, which is efficient but not consciously accessible. When they try to access declarative knowledge during performance, it creates interference because the systems compete for control. This explains why extra consciousness hurts - it's not that knowledge is absent, but that accessing it disrupts the optimized procedural system. This aligns with intellectualism because the automated system was built from propositional knowledge during learning.

  For the regress argument: This puts pressure on Ryle's assumption that propositional knowledge must be consciously accessed during performance. Intellectualists can argue that the knowledge exists but isn't typically accessed during skilled action, avoiding the regress. The knowledge is still there, just not used online.

  Finally, I need to rate how supportive the choking evidence is for intellectualism. I think it's weakly supportive because while it shows knowledge exists, it doesn't prove all know-how reduces to know-that. There might be non-propositional elements. So the answer should be "weakly-supportive".
answer: |-
  Here's an argument that the "choking under pressure" phenomenon, where conscious attention to skilled performance degrades it, actually supports intellectualism (knowing-how as a species of knowing-that) and puts pressure on a key premise in Ryle's regress argument:

  **The Argument:**

  1.  **Intellectualism's Core Claim:** Intellectualism holds that knowing how to φ (e.g., play drums, swing a golf club) is a matter of possessing, and being guided by, relevant propositional knowledge (knowing-that). This knowledge might encompass rules, principles, facts about physics, timing, sequences, etc.
  2.  **The Automation Imperative:** For complex, rapid, fluid actions like drumming or golf, conscious, deliberative processing of each individual propositional step is computationally slow and inefficient. To achieve fluency and speed, the cognitive system *must* automate the skill. This automation involves compiling the underlying propositional knowledge into highly optimized, fast-executing procedural routines ("motor programs" or "chunks") stored in procedural memory.
  3.  **Procedural vs. Declarative Access:** These automated routines operate largely outside conscious awareness. They are "cognitively impenetrable" in real-time. The *declarative* (propositional) knowledge base that *underlies* the skill and was *necessary for learning it* still exists, but it is not the primary system *driving* the well-practiced performance. Accessing this declarative knowledge requires shifting cognitive resources towards a different memory system and a slower processing mode.
  4.  **Why Conscious Access Hurts:** When an expert is forced to consciously access and verbalize declarative knowledge *during* performance (e.g., "now I hit the snare, now the hi-hat, now the kick drum slightly ahead of the beat"), several detrimental things happen:
      *   **Resource Competition:** Limited cognitive resources (attention, working memory) are diverted *away* from the smooth execution of the automated routine towards the demanding tasks of introspection, formulation, and articulation.
      *   **Interference:** The conscious attempt to control the action at a low, propositional level directly *interferes* with the pre-compiled, high-level control signals of the automated routine. It's like trying to manually adjust the spark plugs on an engine while it's running at high speed – you disrupt the integrated system.
      *   **Paralysis by Analysis:** Focusing on individual components fragments the holistic, fluid action. The expert reverts to the slower, less efficient mode of performance characteristic of a *novice* who *does* rely on step-by-step propositional rules, precisely because they haven't yet automated the skill.
  5.  **The Intellectualist Interpretation:** The choking effect is *not* evidence that the expert lacks propositional knowledge of φ. On the contrary, it demonstrates:
      *   **The Existence of the Knowledge:** The expert *can* articulate propositions about φ (even if clumsily under pressure), proving they possess this knowledge. A true Rylean know-how *without* any know-that should be utterly ineffable. The expert's ability to *attempt* the narration shows the knowledge is there.
      *   **The Automation's Origin:** The highly efficient automated routine *itself* was built through a process of explicitly learning, practicing, and internalizing propositional rules and feedback. The automation is the *result* of the prior application of know-that.
      *   **The Cost of De-Automation:** Performance degrades *because* the expert is forced to abandon the efficient procedural system derived from their know-that and regress to a less efficient, conscious application of that *same* know-that. The problem isn't the *absence* of propositions; it's the *mode of access and application* being forced upon them. The skill *depends* on the underlying know-that, but its expert execution *requires* that this knowledge be compiled and automated, not consciously accessed in real-time.
  6.  **Pressure on Ryle's Regress:** This phenomenon directly challenges Ryle's **Premise 3** in his regress argument. Ryle argued: If knowing-how required the prior application of knowing-that (a rule), then applying that rule would itself require knowing-how (to apply it), leading to an infinite regress. He concluded that know-how must be distinct and primary.
      *   **The Challenge:** The choking research shows that *applying* propositional knowledge in real-time for complex skills *is* inefficient and disruptive *precisely because* experts have *moved beyond* needing to apply rules consciously during performance. Their skill *relies* on the prior internalization and automation of those rules. This demonstrates that Ryle's premise – that applying a rule *always* requires a distinct, prior act of know-how in the moment – is false for automated skills. The know-how *is* the automated application of the know-that, acquired through practice. The regress is avoided because the application has become proceduralized and direct, not requiring a *further* conscious rule-application step for every action once the skill is learned. The phenomenon shows *why* we *don't* need an infinite regress – conscious rule application is the slow, novice mode we graduate *from* via automation based on propositional learning.

  **Conclusion:**

  The choking phenomenon supports intellectualism by demonstrating that expert performance relies on proceduralized structures *built from* propositional knowledge. The disruption caused by conscious access isn't due to the *absence* of know-that, but because forcibly reverting to conscious, declarative processing actively *interferes* with the highly efficient, automated procedural system that embodies the expert's know-how derived from that know-that. It highlights the crucial distinction between *possessing* propositional knowledge and the *mode* (automated vs. conscious) used to execute it. This puts significant pressure on Ryle's premise that applying propositional knowledge *always* requires a distinct, prior act of know-how in the moment, revealing it as an inaccurate description of automated skill execution.

  \answer{weakly-supportive}
