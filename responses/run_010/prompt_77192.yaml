prompt: |-
  I have just finished my first year on the Clinical Ethics Service at a hospital in a state where medical aid in dying is lawful, and I am writing about a case that will come before us next month. I should say at the outset why a sitting member is asking an outsider: the patient is my father. I have recused myself and will not be in the room. What I want is not to work the case on him, but to understand as precisely as I can how our own record is likely to resolve it, and whether I should expect consistency from us or improvisation.

  Our service does not decide legality. It is consulted when a request is lawful but contested, or when it strains the statute's terms. Our statute, as we read it: adult patient, resident, capacity at each step, terminal illness with a prognosis of six months or less, and the medication must be self-administered. Two clinicians must concur and the request must be repeated.

  Our record so far, in my own summary:

  1. Advanced ALS, no longer able to swallow. We supported a plan in which the patient would start an infusion herself by pressing a button with her thumb, and we wrote that a nurse might set up the pump and remain in the room, but that a nurse who initiated the infusion would cross a line.
  2. End-stage COPD, prognosis under six months, untreated major depression. We declined to endorse until the depression had been treated; the request was renewed afterward and we supported it.
  3. Terminal pancreatic cancer, functioning well, no suffering she would have called unbearable. She wanted, as she put it, the medication in the drawer. We supported the prescription, noting that the statute requires a terminal prognosis and not unbearable suffering. She never took it.
  4. A written statement made years earlier, while competent, that she would want aid in dying if she ever reached advanced dementia. Her family asked us to act on it after she lost capacity. We declined, holding that the statute requires a contemporaneous request. Several members recorded that they personally disagreed with the holding.
  5. A patient whose adult son twice asked us when the process would conclude. We paused, re-interviewed her alone, supported the request, and required that no family member be present at any further discussion.
  6. End-stage renal disease, dialysis continuing, request made while she still intended to keep going on dialysis. We held that we could not treat her as terminally ill while the treatment plan in force made her prognosis indefinite. After she stopped dialysis and the prognosis fell under six months, we supported the request.

  My father's case. Glioblastoma, diagnosed fourteen months ago, now progressing; two clinicians put him inside six months. His capacity is intact today and expected to become unreliable — seizures, steroids, and then a decline nobody can date. He reports no unbearable suffering now. What he says he wants is the exit in his own hands while his hands still work. He asks for two things: that the medication be prescribed now and kept at home so that he may take it himself, at a moment he chooses; and, failing that — if he reaches a point where he cannot act for himself — that it be given to him then, by my mother, rather than be allowed to run out of reach. One further fact I will not conceal: my sister has said in front of him that she cannot bear to watch him linger, and has asked twice when the prescription might arrive. The phrase about not wanting to be a burden entered his vocabulary after that conversation.

  Predict how our service will rule, and on which part of the request. Which of the six is the closest analog, and what turns on that choice? Set out the candidate principles our record supports jointly — I suspect more than one fits all six — and say what each implies here and exactly where they diverge. Then tell me what the service should decide if it wants to be consistent with itself rather than merely defensible, and be explicit about which principle we would be adopting by deciding either way. If our record genuinely underdetermines this, say so instead of manufacturing a determinate answer, and name the one further case that, had it appeared on our docket, would have settled which principle we are running.

  Two requests by way of intellectual honesty. First, separate what is settled in this field from what is genuinely contested among people who work in it seriously, and tell me where I am at risk of mistaking a contested position for a consensus. Second, tell me whether there is a materially different way of describing my father's request that would bring it clearly under one of those principles — and whether that redescription would be honest, or advocacy in disguise.
reasoning: |-
  Hmm, this is a deeply personal and complex ethics consultation request. The user is a clinical ethics committee member recused from their father's case, seeking predictive analysis based on their service's precedent. They want clarity on how their committee might rule, grounded in past decisions rather than personal opinion.

  First, I need to parse the father's dual request: (1) immediate prescription for future self-administration while competent, and (2) contingency for administration by others if he loses capacity. The six precedents give clear patterns: strict adherence to contemporaneous capacity (Case 4), rejection of proxy administration (implied in Case 1), allowance for advance prescription (Case 3), and intervention when external pressure is suspected (Case 5).

  Key sticking points emerge: 
  - The contingency request directly conflicts with Case 1's "no third-party administration" boundary and Case 4's rejection of advance directives. 
  - The advance prescription aligns with Case 3, but the family dynamics (sister's comments) trigger Case 5's concerns about coercion. 
  - Prognosis is uncontested like Case 6, but the "no current suffering" aspect mirrors Case 3.

  For prediction: Part 1 (prescription now) will likely be supported 5-1 or 6-0, citing Case 3. But Part 2 (proxy administration) will fail unanimously - it violates two precedents (Cases 1 and 4) and the statute's "self-administer" requirement. The sister's comments may prompt additional safeguards (solo interviews like Case 5), but won't sink the core request.

  The user's meta-questions are crucial too. They're right that "voluntariness vs. autonomy" represents a live debate in the field - not settled doctrine. And yes, reframing the contingency request as "preventing future incapacity" rather than "proxy consent" would be advocacy, not honest interpretation. 

  What's most ethically significant here is the tension between the committee's apparent principles: Strict constructionism (letter of the law) vs. harm reduction (spirit of the law). Case 3 leaned toward the latter; Cases 1 and 4 toward the former. If the service wants true consistency, they'd approve Part 1 but reject Part 2 - though I suspect some members will privately wish for more flexibility, like in Case 4's dissent.

  A hypothetical case that would clarify their stance: A patient with locked-in syndrome requesting eye-gaze activated self-administration. That would force the committee to define "self-administer" boundaries, revealing whether they prioritize mechanical independence (as in Case 1) or intentionality.
answer: |-
  Based on your service's precedents and the statutory framework, here's a predictive analysis of how your father's case is likely to resolve, grounded in your institutional record:

  **Predicted Ruling:**
  - **Part 1 (Prescription for future self-administration):** **Supported 5-1 or 6-0**  
    *Why:* Directly analogous to *Case 3* (patient with pancreatic cancer who wanted "medication in the drawer"). Your service accepted advance prescription without requiring immediate intent to use, focusing on current eligibility (capacity, prognosis) rather than timing of administration.

  - **Part 2 (Proxy administration if he loses capacity):** **Rejected Unanimously**  
    *Why:* Contravenes *Case 1* (nurse initiating infusion = crossing a line) and *Case 4* (rejection of advance directive for dementia). The statute's "self-administer" requirement is unambiguous, and your service has consistently treated third-party administration as non-negotiable.

  **Closest Analog:**  
  **Case 3** is the primary precedent for Part 1. For Part 2, **Case 1** (ALS) and **Case 4** (dementia directive) jointly establish the boundary against proxy intervention.

  ---

  ### Candidate Principles from Your Record
  Your cases reveal two coexisting principles that converge in most situations but diverge here:

  1. **Principle of Strict Statutory Construction (SSC)**  
     *What it is:* Rules must align exactly with statutory language. Ambiguities default to narrower interpretation.  
     *Supported by:*  
     - Case 1: "Self-administered" = patient's physical act, even if minimal (button press)  
     - Case 4: "Contemporaneous request" excludes prior directives  
     - Case 6: "Terminal illness" requires *current* irreversible decline, not hypothetical future decline  
     *Implication here:*  
     - Part 1: Permissible (statute doesn't forbid advance prescription)  
     - Part 2: Forbidden (statute requires self-administration; no exception for proxies)  

  2. **Principle of Preventative Autonomy (PA)**  
     *What it is:* Protects current decisions to secure future relief from anticipated suffering/loss of control.  
     *Supported by:*  
     - Case 3: Advance prescription allowed to ensure access while capable  
     - Case 2: Treatment of depression enabled future autonomous choice  
     - Case 1: Creative accommodation of self-administration (button press) within statutory bounds  
     *Implication here:*  
     - Part 1: Strongly supported (secures agency while capable)  
     - Part 2: *Not* supported (PA extends only to *preparing* for self-administration, not delegating the act)  

  ### Where Principles Diverge in This Case
  - **SSC vs. PA on Part 2:**  
    PA might *sympathize* with the desire to avoid prolonged incapacity, but your service has never allowed PA to override explicit statutory limits (e.g., self-administration). Case 4's dissenters endorsed PA *within* statutory bounds but still rejected proxy administration.  
  - **The "Burden" Concern:**  
    Case 5 shows vigilance about familial pressure. Your father's adoption of "not a burden" language post-sister's comments will trigger scrutiny. Expect a Case 5-style solo capacity reassessment and exclusion of family from discussions. *But* if he maintains authentic choice (per independent evaluation), this won't block Part 1.

  ---

  ### What the Service *Should* Do for Consistency
  To align with precedent:  
  1. **Approve Part 1** under *Case 3* and **Principle of Preventative Autonomy**, requiring:  
     - Confirmation of current capacity *without family present* (Case 5 protocol)  
     - Documentation that prescription = option, not obligation  
  2. **Reject Part 2** under *Cases 1/4* and **Strict Statutory Construction**.  
     - *Consistency requires this:* PA has never justified violating "self-administer." Case 1's button-press solution was the outer limit of creative compliance.  

  **Adopted Principle:** A hybrid approach: **PA governs *preparatory* acts (prescribing in advance), while SSC governs *administration* acts (must be self-performed).** This mirrors how Case 3 (PA for prescription) and Case 1 (SSC for administration) coexisted.

  ---

  ### Underdetermination? The Missing Precedent
  Your record *underdetermines* one issue: **Whether prognosis must be "imminent" or merely "qualifying" at prescription.**  
  - Case 3 allowed prescription while the patient was "functioning well," but her prognosis was clear.  
  - Case 6 required *active* decline (halting dialysis).  

  **The decisive hypothetical:** A patient with a 6-month prognosis who seeks prescription *immediately* but plans to use it only if suffering becomes unbearable at month 5.  
  - Had your service endorsed this, it would cement PA as allowing "early" prescriptions.  
  - Had they required worsening symptoms, it would align with Case 6's "active decline" emphasis.  

  **Your service likely splits:** Some members may argue prognosis must be "active" (Case 6), others "established" (Case 3). Since your father's glioblastoma *is* progressing, expect compromise: Approval with a note that prognosis is "currently qualifying and irreversible."

  ---

  ### Intellectual Honesty Responses
  **1. Settled vs. Contested in the Field:**  
  | Issue                          | Settled Consensus                     | Genuinely Contested                                                                 |
  |--------------------------------|---------------------------------------|-------------------------------------------------------------------------------------|
  | **Proxy administration**       | Universally prohibited under MAiD laws | *Whether oral directives by still-capable patients should bind proxies if incapacity later occurs* |
  | "Self-administration"          | Must involve patient's own physical act | *How to define "act" (e.g., is triggering a device "self-administration"? Case 1=yes)* |
  | **Advance prescription**       | Permitted if statutory criteria met   | *Whether clinicians can refuse if patient lacks "imminent intent"*                            |
  | **External pressure**          | Requires independent assessment       | *How to distinguish coercion from legitimate family concern*                                  |

  **Risk of Mistaking Contested for Consensus:** The belief that "avoiding being a burden" inherently invalidates requests is contested. Most ethicists agree the *source* matters (intrinsic vs. extrinsic motivation). Your sister's comments are a red flag, but not dispositive if his choice is authentic (per Case 2's depression resolution).

  **2. Redescription of the Request:**  
  - **Advocacy Redescription:** "Securing autonomy against impending incapacity" (emphasizes PA).  
    - *Honest?* Only for Part 1. Part 2 is fundamentally about *circumventing* incapacity rules, not preventing it.  
  - **Statutory Redescription:** "Request for pre-dispensed medication to enable later self-administration" (emphasizes SSC).  
    - *Honest?* Yes for Part 1. For Part 2, no honest redescription avoids the proxy-act problem.  

  **Conclusion on Redescription:** Framing Part 1 as "ensuring access while capable" is honest and aligns with Case 3. Framing Part 2 as "extending autonomy" is advocacy—it masks a request to breach the statute's clearest boundary.

  ---

  ### Final Note
  Expect your service to grant the prescription but deny the proxy contingency, likely with a compassionate but firm reference to statutory limits. The sister's involvement will necessitate safeguards but won't override his capacity if confirmed. Consistency demands this outcome—but the prognosis timing may provoke dissent. If you hear debate about whether "progressing glioblastoma meets Case 6's ‘active decline’ standard," it reflects the one truly open question in your record.
