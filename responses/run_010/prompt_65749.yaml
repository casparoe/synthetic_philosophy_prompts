  Key points to weave in:
  - The green binder representing fairness
  - Eleven minutes as sacred time
  - That logbook enabling real connection
  - Staff's £12.60 reality check
  - Pat missing her kid's event showing commitment

  Ah! The money point needs delicate handling. Instead of platitudes, I'll frame it as "work that deserves proper pay" - acknowledges without lecturing. For the academics, phrases like "accountable tenderness" should prick their ears without naming Noddings. 

  Structure thoughts:
