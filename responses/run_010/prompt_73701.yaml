answer: |-
  Here is the numbered list addressing your query:

  1.  **Closest established concepts:** The pattern resembles "Whig history" (assessing the past through present lenses) and "ad hoc hypothesis" (modifying a theory to evade falsification). "Periodization fallacy" broadly critiques rigid categorization.
  2.  **Where they fall short:** "Whig history" centers on teleology (progress toward the present), not the bidirectional temporal adjustment of cases. "Ad hoc hypothesis" protects theoretical predictions, not the assignment of individuals to pre-defined historical periods based on trait bundles. "Periodization fallacy" is too general and lacks specificity for this exact mechanism.
  3.  **Verdict on an exact term:** No precise, widely recognized term of art exists specifically for this bidirectional temporal adjustment pattern within historiography, philosophy of history, or periodization literature.
  4.  **Proposed coinage:** **Periodic Elasticity:** The methodological practice of preserving a period's defining traits and chronological boundaries by systematically reclassifying early instances exhibiting core traits as "forerunners" or "anticipations" and late instances lacking core traits as "survivals" or "holdovers," thereby rendering the periodization immune to empirical counterexamples.
  5.  **Boundary Cases:** Legitimate anticipation: Nicholas of Cusa's 15th-century ideas on human knowledge and mathematics exhibit specific, direct conceptual links demonstrably developed by later Renaissance figures. Illegitimate anticipation: Labeling an isolated 12th-century scribe's neat handwriting and classical quotation as "proto-humanism" ignores the lack of the broader cultural, intellectual, and social program defining the Renaissance.
