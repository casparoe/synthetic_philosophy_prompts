  We are designing a rivalry-free scenario that meets the user's specifications. The goal is to test whether the closest-continuer account (CCA) relies on rivalry to function, or if it can work by default when there's no competitor. We also want the sortal-relative account (SRA) to deny survival in the same case.

  Brainstorming candidate designs:

  1. **Pipe organ to electronic instrument**: A pipe organ in a cathedral is gradually replaced, module by module, over decades. Each pipe is removed and destroyed (not stored) as it is replaced by an electronic module. Eventually, the entire instrument is electronic. The cathedral considers it the same instrument for liturgical purposes, but the original organ (as a pipe organ) no longer exists. However, note that if the pipes are destroyed immediately, no rival is created, and the transformation is realistic.

  2. **Lighthouse to monument**: A functioning lighthouse is decommissioned. Over time, its lantern and mechanical parts are removed and destroyed, leaving only the tower. The tower is then maintained as a historical monument. The original lighthouse (as a navigational aid) ceases to exist, but the structure remains. However, is the tower the same object? The structure persists, but the kind changes.

  3. **Printed book to digital archive**: A rare printed book is being digitized. Each page is scanned and then immediately destroyed (shredded) after scanning. The digital version is stored. The physical book ceases to exist, but the information is preserved. But note: the digital archive is a new entity, not the original book. Also, the user wants the object to change kind, but continue to exist as something else. In this case, the physical book is destroyed and a digital one is created, so it's not clear that the same object persists.

  We choose the pipe organ scenario because:
  - It's an ordinary artifact.
  - The change is gradual and realistic (organs have been updated this way).
  - The kind changes from a pipe organ to an electronic organ, which are different kinds of instruments (one is pneumatic/mechanical, the other electronic).
  - By destroying each old part immediately, we avoid creating a rival.

  Let's refine:

  **Scenario**: The great pipe organ in St. Cecilia's Cathedral, built in 1890, is being modernized. Over a period of 20 years, each of its 5,000 pipes is individually removed and immediately melted down for scrap metal. As each pipe is removed, it is replaced by an electronic sound module that perfectly replicates the pipe's sound. The console is also replaced with an electronic one. The work is done incrementally, one pipe per week, so that the organ remains playable throughout. After the last pipe is replaced, the instrument is now entirely electronic. The cathedral authorities consider it the same organ for contractual purposes (e.g., fulfilling a bequest that requires "the organ of St. Cecilia's" to be maintained in perpetuity). However, a pipe organ expert argues that the original pipe organ ceased to exist when the last pipe was removed, and now there is only an electronic organ.

  Now, we have no rival because the old parts are destroyed immediately and not reassembled. Only one candidate exists at every moment.

  Part 1: The Scenario (for the debate club classmate)

  St. Cecilia's Cathedral has a famous pipe organ, installed in 1890. Starting in 2000, the cathedral begins a 20-year project to replace every single pipe with electronic modules. Each week, one pipe is taken out, melted down on-site, and replaced by an electronic module that sounds exactly like that pipe. The rest of the organ stays in place and is played every Sunday. By 2020, every original pipe is gone and replaced, leaving a fully electronic instrument. The cathedral treats it as the same organ, especially because a major donation in 1950 specified that "the organ of St. Cecilia's" must be maintained forever. The donor's heir now argues that the bequest is void because the pipe organ no longer exists, and the electronic instrument is a different entity.

  Part 2: Specification Check

  User's requirements:

  1. **Ordinary artifact**: Yes, a pipe organ is an ordinary artifact.

  2. **No duplication, teletransportation, scanning, copying, time travel**: We have no such elements. The old parts are destroyed, not copied or stored. Only one instrument exists at all times.

  3. **Nothing set aside, stored, archived, or preserved**: The old pipes are melted down immediately, so nothing is preserved. Hence, at no moment does more than one candidate exist. The scenario is rivalry-free.

  4. **Change of kind**: The object starts as a pipe organ (a mechanical/pneumatic instrument) and becomes an electronic organ (an electronic instrument). These are different kinds: one produces sound by air through pipes, the other by electronic signals and speakers. It stops being a pipe organ and becomes an electronic organ.

  5. **Real institutions**: Pipe organs are indeed sometimes updated in this gradual manner, and electronic replacements are common.

  6. **Two verdicts**:
     - **Closest-continuer account (CCA)**: This account says that an object persists if there is a unique candidate that is sufficiently close to the original and that the continuity (spatiotemporal and qualitative) is preserved. In this rivalry-free case, there is only one candidate (the evolving organ in the cathedral) and it is continuous in both space (it never moves) and time (it changes gradually). Moreover, there is no rival. Therefore, by default, the CCA must say that the organ survives the transformation because it is the only candidate and it is continuous. The closeness ranking machinery doesn't run because there's nothing to compare. The verdict is reached without comparison.
     - **Sortal-relative account (SRA)**: This account says that identity is relative to a sortal (kind). The criteria for persistence depend on the kind. The original object is a pipe organ. The sortal "pipe organ" has its own persistence conditions: typically, a pipe organ must have pipes to be a pipe organ. When the last pipe is removed, the pipe organ ceases to exist. The electronic organ is a different kind of thing, falling under a different sortal. Therefore, the original object (the pipe organ) does not survive the change.

  7. **Real stakes**: The bequest from 1950 requires "the organ of St. Cecilia's" to be maintained. If the organ survives, the cathedral is fulfilling the bequest. If not, the heir can claim the endowment should revert to the donor's estate. This is a concrete legal and financial issue.

  Part 3: Engineering Report

  - **Which feature is doing the work?** The key feature is the rivalry-free condition: the immediate destruction of the old parts, ensuring no rival candidate is created. This forces the CCA to operate without a comparison and to accept the only candidate as the continuer. Also, the change of kind is crucial for the SRA to deny survival.

  - **What if we remove the feature?**
     - If the old parts were stored and then reassembled, we would have two candidates (the electronic organ and the reassembled pipe organ). Then the CCA would have to rank them, and the verdict might change (depending on which is closer). The rivalry-free condition would be broken, and the CCA would not be running by default.
     - If the change happened overnight (e.g., the entire organ is replaced in one day), the CCA might still say it survives if there's no rival, but the SRA would still deny survival because the kind has changed. However, the graduality might help with continuity, but it's not essential for the CCA in a rivalry-free case. The essential point is the absence of a rival.
     - If a rival candidate is introduced (e.g., someone builds a replica from new pipes), then the CCA would have to compare and might not choose the electronic organ. But in our case, we avoid that.

  - **How would a defender of CCA attack the case?**
     - They might deny that a change of kind threatens identity. They could argue that the organ's identity is tied to its function (producing music in the cathedral) and location, not to its physical composition. Thus, they might say the electronic organ is the same object because it continues the same function in the same place with the same name. This would collapse the CCA into a functionalist view and might bypass the need for closeness in the first place.
     - Alternatively, they might argue that the sortal "organ" is more general and persists. But note: the user wants the kind to change. If the CCA defender insists that the kind hasn't changed (because it's still an organ), then they might say the object survives. But the user specifies that the kind changes: from pipe organ to electronic organ. The CCA defender could challenge that these are different kinds, perhaps by appealing to a higher-level kind (e.g., musical instrument) that persists. However, the user's scenario explicitly requires that the object stops falling under the original sortal (pipe organ) and now falls under a new one (electronic organ). So the CCA defender may have to bite the bullet and accept that the object survives even with a change of kind, by appealing to continuity.

  - **Can the CCA defender repair the case by making closeness kind-relative?**
     - If the defender says that closeness is relative to a kind, then they might say that the electronic organ is close as an organ but not as a pipe organ. But then, when we ask if the original pipe organ survives, they might say no because the candidate is not close enough as a pipe organ. But this would make the CCA sortal-relative, collapsing into the SRA. The user wants the CCA to be non-sortal-relative and to say survival by default. If closeness becomes kind-relative, then the CCA loses its generality and becomes a variant of SRA.

  - **Verdict on the case**:
     - The rivalry-free case does not refute the CCA because the CCA can still deliver a verdict (survival) without rivalry. However, it embarrasses the CCA by showing that the machinery of ranking (which is central to the CCA in cases of fission) becomes idle and unnecessary in the absence of rivals. It complicates the CCA by exposing that the account might rely on a default when there are no competitors, but that default is not explicitly built into the original formulation. The CCA is designed to handle cases of duplication, but in non-rivalry cases, it must fall back on continuity alone.

  - **Confidence**:
     - **Mapping**: High confidence. The scenario meets all the user's specifications.
     - **Two verdicts**: 
          - CCA says survival: High confidence because without rivals, the continuous object is the default continuer.
          - SRA says no survival: High confidence because the change of kind (loss of essential properties for the sortal) means the original object ceases to exist.
     - **Diagnosis (that the absence of rivalry forces CCA to run idle)**: Medium confidence. It might be argued that the CCA still uses the concept of closeness by comparing the candidate to the original (even without rivals). However, without a rival, there is no ranking, so the "closest" part doesn't do work. But the account might require that the candidate be sufficiently close, which could be a threshold. In this case, the electronic organ might be sufficiently close in terms of function, location, and history. The point is that there's no comparison, so the machinery of ranking competitors is idle. But the defender might say that the closeness is to the original, not to competitors. This is the point I am least sure of.

  The least sure point: Whether the CCA must invoke a comparison to other candidates or if it can be defined as being close to the original in absolute terms. In standard formulations, the closest-continuer account is introduced to solve fission cases by selecting the closest candidate. In a no-fission case, it might be that the account reduces to a continuity account. But the user's challenge is that the "closeness" ranking is only doing work when there is a tie to break. In this case, without rivalry, there is no tie, so the ranking is idle. However, a defender might say that the account still requires the candidate to be close enough to the original, so closeness is still doing work. But note: the user wants the verdict to be by default, without the ranking machinery. So I think the case works, but this is the point where the adviser might push: by arguing that closeness is still being used, even without rivals.

