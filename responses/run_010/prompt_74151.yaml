prompt: |-
  I am in my fourth year of a PhD in jurisprudence, and this term I am teaching a five-week optional seminar on the concept of law to eighteen students — mostly second-year law students, three of whom have taken one undergraduate philosophy course. Week three is the Hart–Fuller exchange, and I have a single 100-minute session. When I have taught those readings as a discussion, the class reliably collapses the debate into "positivists hold that valid law must be obeyed, natural lawyers hold that unjust law is not law," which misdescribes both sides and makes the argument look like a quarrel over slogans. I want to replace the discussion with a structured adjudication exercise in which the students generate the real disagreement out of their own conduct before anyone names it.

  Here is the skeleton I have drafted. Please complete it into a runnable session, and tell me candidly where the skeleton is wrong.

  The class sits as first-instance panels of three in a fictional post-authoritarian state; I will supply the invented names and the regime sketch. Panels hear two cases under an identical written instrument I will call the Grounds of Decision, which lists only source-based grounds (proper enactment by the recognized organ, publication, prospectivity) and craft-based grounds (generality, intelligibility, absence of contradiction, feasibility of compliance, stability over time, and agreement between what officials actually do and what the rules declare). Manifest injustice is not an admissible ground at first instance: a panel that relies on it must say so expressly and accept that its judgment is struck on appeal. Grounds invoked are recorded by a student clerk and tabulated on the board. Round one is an enactment that is procedurally immaculate and substantively abhorrent. Round two is a measure the students will morally favour — relief for people punished by the old regime — that is retroactive, unpublished, internally contradictory, and impossible for many applicants to comply with. Each panel also seals a one-word answer to whether the instrument before it is law at all, and the sealed slips are opened only in the final ten minutes.

  What I want participants to come away seeing: that both theorists agree a legal system can be efficient and wicked; that the craft standards do real normative work in round two without any appeal to justice, and do no work at all in round one, so the dispute is about whether that difference in kind is a moral difference; and that how one uses the word law changes what one is able to say in each round.

  Please give me the two case files at the right level of detail, the Grounds of Decision instrument, role cards that carry no school labels, a scoring and accountability scheme that needs no money, a minute-by-minute timeline, and a debrief that maps recorded moments — this panel's grounds, that panel's sealed slip, the pattern across rounds — onto the two positions, then onto the further claim that a regime pursuing wicked ends tends to corrupt its own legality, which is where I want the last fifteen minutes to land. Tell me what will predictably go wrong the first time I run it, and how to handle it: the student who identifies the exercise as a displaced version of the postwar German denunciation cases, the panel that strikes both measures on the ground that it is the court and no one can stop it, and the panel that launders a justice argument into the intelligibility or congruence ground. Say how to counterbalance case order across panels so the debrief can compare them. Also tell me whether round two as described serves the purpose better than a second case in which the craft defects are themselves the symptom of bad faith, and why.

  Finish with an honest statement of which features of the debate this exercise cannot reproduce and I must supply myself — including, I suspect, the fact that a real rule of recognition is a social fact accepted by officials rather than a list handed to students on a card.

  Do not set either case in Germany between 1933 and 1949, do not use real statutes or real decisions, and do not propose any bibliography: everything the session needs must be in the materials you write.
reasoning: |-
  We are designing a 100-minute session for law students to explore the Hart-Fuller debate through an adjudication exercise. The goal is to avoid the common mischaracterization that positivists believe "valid law must be obeyed" and natural lawyers believe "unjust law is not law." Instead, we want students to see that both agree a legal system can be wicked and efficient, and that the dispute is about the role of morality in determining what counts as law.

  The session structure:
  - Students sit in panels of three (so six panels total for 18 students).
  - Each panel adjudicates two cases under a written instrument called "Grounds of Decision."
  - Grounds are source-based (enactment, publication, prospectivity) and craft-based (generality, intelligibility, no contradiction, feasibility, stability, congruence between rules and official action).
  - Manifest injustice is not admissible at first instance; if used, the panel must state so and accept reversal on appeal.
  - Each case: panels record grounds used, and at the end submit a sealed one-word answer: "law" or "not" (for whether the instrument is law at all).
  - Round 1: A procedurally perfect but substantively abhorrent law.
  - Round 2: A morally appealing law with technical defects (retroactive, unpublished, contradictory, impossible to comply with for some).

  We need:
  1. Two case files (with fictional details).
  2. The "Grounds of Decision" instrument.
  3. Role cards (without school labels).
  4. A scoring/accountability scheme (non-monetary).
  5. Minute-by-minute timeline.
  6. Debrief plan: mapping panel decisions to the Hart-Fuller positions and then to the idea that wicked regimes corrupt legality.
  7. Predictable problems and solutions.
  8. Counterbalancing case order (some panels get Case A then B, others B then A).
  9. Whether Round 2 as described is better than an alternative where defects are symptoms of bad faith.

  Constraints: No real cases, no Germany 1933-1949, no bibliography.

  Let's design:

  ### 1. Case Files

  **Case 1: The Immaculate Abhorrence (Round 1 for half the panels, Round 2 for the other half if counterbalanced)**
  - **Title:** *State v. The Council of Elders Decree*
  - **Background:** In the fictional country of "New Columbia," the authoritarian regime has been replaced. The new government is reviewing old laws. This decree was passed by the previous regime's Council of Elders (the recognized legislative body) and published in the Official Gazette. It is prospective, general, intelligible, internally consistent, feasible, stable, and officials enforced it consistently.
  - **Content of the Decree:** The "Public Health and Social Order Act": 
    - Section 1: Any person diagnosed with a contagious disease (list includes common conditions like tuberculosis, but also "moral contagion" defined as advocating against the regime) must be reported to authorities.
    - Section 2: Reported individuals are to be quarantined in state facilities until cured or until they no longer pose a threat to public order.
    - Section 3: Failure to report is punishable by 5 years in prison.
    - *The problem:* Under the old regime, "moral contagion" was broadly interpreted to silence dissent. Thousands were detained without due process in harsh conditions. The law was used to target political opponents.

  **Case 2: The Flawed Rectification (Round 2 for half, Round 1 for the other half)**
  - **Title:** *In re The Victims of Persecution Relief Order*
  - **Background:** The new government, eager to provide reparations, issued an order to compensate victims of the old regime. However, due to haste and political pressure, the order has technical flaws.
  - **Content of the Order:**
    - Section 1: Any person who was detained under the Public Health and Social Order Act (or similar laws) for political reasons is entitled to compensation of 10,000 New Columbian pesos.
    - Section 2: Claims must be filed within 30 days of the order's effective date (which is the day after issuance) and must include a sworn statement by the claimant and two witnesses who were also detained. 
    - Section 3: Compensation is denied if the claimant was ever charged with a violent offense under the old regime (note: the old regime often fabricated such charges).
    - *Defects:*
      - Retroactive: It applies to detentions that occurred before the order was made.
      - Unpublished: Due to an administrative error, it was not published until 10 days after the effective date.
      - Contradiction: Section 1 says "any person" detained for political reasons, but Section 3 denies compensation to those charged with violent offenses (even if the charges were fabricated). This creates a contradiction because some eligible persons are excluded.
      - Feasibility: Many victims are still in hiding or in remote areas; they cannot file within 30 days or find two witnesses (who might be dead, missing, or afraid). Also, proving the political nature of detention is hard without access to old regime records.

  ### 2. Grounds of Decision Instrument
  We'll list the grounds clearly.

  **Grounds of Decision (for First-Instance Panels)**

  You may only base your decision on the following grounds. If you rely on a ground, you must specify which one and how it applies.

  **I. Source-Based Grounds:**
  1. **Proper Enactment:** The measure was issued by the recognized legislative or executive organ with authority to do so.
  2. **Publication:** The measure was published in the official forum (e.g., Gazette) before it took effect.
  3. **Prospectivity:** The measure applies only to future conduct, not past conduct.

  **II. Craft-Based Grounds:**
  4. **Generality:** The measure applies generally, not to specific individuals or cases.
  5. **Intelligibility:** The measure is written clearly enough that an ordinary person can understand what is required.
  6. **Absence of Contradiction:** The measure does not contain internal contradictions or conflicts with other valid measures.
  7. **Feasibility of Compliance:** It is reasonably possible for those affected to comply with the measure.
  8. **Stability over Time:** The measure is not subject to arbitrary or frequent changes.
  9. **Congruence:** There is agreement between what the measure declares and how officials actually apply it.

  **Important:** Manifest injustice is not an admissible ground at first instance. If you believe the measure is unjust and that this affects its validity, you must state: "We find this measure manifestly unjust and therefore not law." However, note that the appellate court will strike down any decision relying on manifest injustice. You may only use the above nine grounds.

  After deciding, seal your one-word answer ("law" or "not") for whether the measure is law at all, without regard to the grounds above. This is for class discussion only.

  ### 3. Role Cards
  We need roles for each panel member and a clerk. Since there are six panels, we can have:
  - Each panel: 3 judges, 1 clerk (the clerk can be one of the 18, so we have 6 clerks). Alternatively, the clerk can be non-participating, but we have exactly 18 students. So let's have the clerk be one of the three in the panel? But the clerk should record, so perhaps the panel of three includes a clerk who also votes? Better: each panel has three judges, and the clerk role is rotated among them (so each student gets to be clerk for one case). We'll assign one clerk per panel per case.

  Role card (for each judge, same for all):

  **Role: First-Instance Judge in New Columbia**

  You are a judge in the newly established Transitional Court of New Columbia. Your task is to review the validity of the provided measure under the Grounds of Decision (above). You must decide whether the measure is valid law and therefore enforceable.

  - You must use only the Grounds of Decision. 
  - You may not consider manifest injustice unless you are willing to have your decision reversed on appeal. Even then, you must explicitly state that you are relying on manifest injustice.
  - After discussion, your panel will vote. The clerk will record the grounds cited for the decision.
  - At the end, each judge will independently write on a slip whether they consider the measure to be "law" or "not" and seal it. These will be collected and opened at the end of the session.

  ### 4. Scoring and Accountability Scheme
  We don't use money. Instead, we can use:
  - **Accountability:** The threat of reversal on appeal for using manifest injustice. Also, the sealed slips create personal accountability for their belief about what is "law."
  - **Scoring (for engagement):** Not necessary, but we can frame it as a duty to the rule of law in New Columbia.

  Alternatively, we can have a simple point system for the debrief: 
  - Each panel that uses at least one craft-based ground in Case 2 gets a "defender of legality" point (just for fun, no real consequence).
  - Each panel that avoids manifest injustice in Case 1 gets a "textualist" point.

  But it's better to avoid points and focus on the debrief. The real accountability is the exercise itself and the debrief.

  ### 5. Minute-by-Minute Timeline (100 minutes total)

  - **0:00 - 0:10** (10 min): Introduction. Set the scene of New Columbia, explain the Grounds of Decision, and assign panels and cases. Split the class into six panels of three. Assign three panels to start with Case 1 (The Immaculate Abhorrence) and three with Case 2 (The Flawed Rectification). Explain the process and the sealed slips.

  - **0:10 - 0:35** (25 min): Panel deliberations for the first case. Each panel discusses and decides. The clerk records the grounds and writes the panel decision (valid or invalid). Each judge writes a sealed slip.

  - **0:35 - 0:40** (5 min): Break. Clerks from each panel report the grounds used for the first case to the instructor, who tabulates on the board (without revealing which case it was for yet). Collect sealed slips for the first case and set aside.

  - **0:40 - 1:05** (25 min): Panel deliberations for the second case. Same process.

  - **1:05 - 1:10** (5 min): Clerks report grounds for the second case. Collect sealed slips for the second case.

  - **1:10 - 1:20** (10 min): Open the sealed slips for both cases and tabulate on the board. Show: for each case, how many panels found it valid/invalid and how many individual slips said "law"/"not".

  - **1:20 - 1:35** (15 min): Debrief Part 1: Map the results to the Hart-Fuller debate.
    - Show the grounds used in Case 1 (abhorrent but procedurally perfect): likely upheld on source grounds. Note that no craft grounds apply. Then show the sealed slips: did anyone say "not" for Case 1? If so, that reflects a natural law inclination? But note: the sealed slip is about whether it is "law at all", not validity under the Grounds.
    - Case 2: likely struck down based on craft grounds (retroactivity, publication, etc.). But the measure is morally good. The sealed slips might still say "law" for some? This shows that positivists might say it is law but invalid due to defects, while Fuller might say that such defects make it not law? We need to clarify.

    We want to show:
      - Both cases are about the same set of criteria (Grounds of Decision).
      - Case 1: Source grounds satisfied, craft grounds not violated -> upheld. But the sealed slips might show some judges saying "not" because of the injustice (even though they didn't use it in the decision). This reveals a hidden belief that injustice affects legality.
      - Case 2: Source grounds might be weak (not published? retroactive?) and craft grounds violated (contradiction, feasibility) -> struck down. But the sealed slips might show "law" because it's just. This reveals that moral appeal might make them consider it law despite defects.

    Then we explain:
      - Hart: Validity is about source and system rules. Case 1 is valid law, Case 2 is invalid but might still be considered law (if the system's rule of recognition allows it, but under our Grounds, it's invalid). The sealed slips for Case 1: if someone says "not", they are going beyond positivism? But note: Hart would say it's law, but we might choose not to obey it if it's evil.
      - Fuller: Law has an inner morality. Case 1 meets the formal criteria, but is it law? Fuller might say yes, but it fails the purpose of law (to guide conduct). However, Fuller also argued that extreme injustice might make it not law. Case 2 fails the inner morality, so it's not law. The sealed slips might reflect this.

    Actually, we want to avoid oversimplifying. Instead, we show the pattern:
      - In Case 1, judges who upheld it (on grounds) might still have sealed slips saying "law" (positivist) or some might say "not" (natural law). But note: the exercise forces them to decide on the grounds, but the sealed slip is their personal view.
      - In Case 2, they strike it down on craft grounds (which Fuller would argue are part of legality), so both positivists and natural lawyers might agree on invalidity. But the sealed slip for Case 2: if they say "law", that might be positivist (because it was enacted by a valid authority, even if defective) vs. "not" (Fuller).

    We can say: 
      - The Grounds of Decision represent Fuller's principles of legality. 
      - Case 1: It passes, so it is law for Fuller? Actually, Fuller would say that a regime that makes such a law is not achieving the inner morality because it is not guiding conduct in a way that respects human agency (it's arbitrary and oppressive). But in the exercise, it passes the formal tests. So we have a tension.
      - Case 2: It fails the inner morality, so Fuller would say it's not law. A positivist would say it's law but invalid due to defects (or if the rule of recognition includes these craft criteria, then it's not valid law).

  - **1:35 - 1:50** (15 min): Debrief Part 2: The corruption of legality in wicked regimes.
    - Point: In Case 1, the regime used the forms of law for evil. But note that the craft grounds were satisfied. However, in reality, a regime that pursues wicked ends often cannot maintain the craft standards. Why? 
      - They might need to change laws arbitrarily (stability).
      - They might have secret laws (publication).
      - They might have contradictory commands (contradiction).
      - They might make laws impossible to comply with (feasibility) to trap people.
      - Officials might not follow the rules (congruence).
    - So, the exercise shows that the craft standards are independent of justice and can be met even in an evil law (Case 1). But in reality, evil regimes tend to fail the craft standards because they are not committed to the rule of law. This is Fuller's point: the inner morality of law is a moral achievement that wicked regimes often cannot maintain. 
    - Case 2: The new regime, even with good intentions, failed the craft standards. That shows that good intentions are not enough; you must also follow the inner morality of law.

  ### 6. Predictable Problems and Solutions

  a) **The student who identifies the exercise as a displaced version of the postwar German denunciation cases.**
     - *Solution:* Acknowledge that the issues are similar but emphasize that we are in a fictional setting to avoid historical baggage. Redirect to the structure of the Grounds of Decision: "Yes, these debates arose in postwar Germany, but we are using a hypothetical to focus on the conceptual structure. Let's see how our Grounds of Decision play out."

  b) **The panel that strikes both measures on the ground that it is the court and no one can stop it.**
     - *Solution:* Remind them that they are bound by the Grounds of Decision. If they ignore the grounds, their decision will be reversed on appeal (and they are role-playing judges in a system). In the debrief, point out that this is an example of what Fuller called the "internal morality of law" being violated by the adjudicator themselves (arbitrary decision).

  c) **The panel that launders a justice argument into the intelligibility or congruence ground.**
     - Example: In Case 1, they might say: "The term 'moral contagion' is unintelligible because it is inherently unjust and vague." But the Grounds say "intelligibility" means clear enough for an ordinary person to understand. The term might be clear (it means criticizing the regime) but unjust. 
     - *Solution:* During the exercise, as you circulate, challenge such reasoning: "Is the problem that it's unclear or that it's unjust? Remember, you cannot rely on injustice." In the debrief, highlight this as a common issue: we try to smuggle in justice under other grounds, which shows that the separation is hard. This can lead to a point about how the craft grounds are not entirely value-free (they have a moral dimension for Fuller).

  ### 7. Counterbalancing Case Order
  To compare across rounds, we need some panels to get Case 1 then Case 2, and others Case 2 then Case 1. We assign:
  - Three panels: Case A (The Immaculate Abhorrence) then Case B (The Flawed Rectification)
  - Three panels: Case B then Case A

  This controls for order effects. In the debrief, we can see if the order influenced the use of grounds or the sealed slips.

  ### 8. Round 2 Alternative: Defects as Symptoms of Bad Faith
  You asked whether Round 2 (as described) is better than a case where defects are symptoms of bad faith. 

  In the current Round 2, the defects are due to haste and oversight, not bad faith. The regime is trying to do good but failing technically. 

  An alternative: A case where the defects are deliberate, e.g., a law designed to be retroactive, unpublished, and impossible to comply with in order to trap people (like in a wicked regime). 

  But our Round 2 is about a good law with accidental defects. This is better for the purpose because:
  - It clearly separates the moral appeal of the law from the technical defects. 
  - It shows that craft defects can invalidate a law even when we want it to succeed. 
  - It avoids the conflation that only wicked regimes have defective laws. 

  The point is that the craft standards are independent of the moral substance. So both regimes (good and bad) can have defective laws, and the craft standards are necessary for the rule of law regardless of the law's aim.

  ### 9. What the Exercise Cannot Reproduce (Honest Statement)

  - **The rule of recognition as a social fact:** In Hart, the rule of recognition is a social practice among officials. Here, we give it as a written list. So students are applying a given rule, not one that emerges from practice. We cannot simulate the social acceptance aspect.

  - **Fuller's inner morality as a dynamic process:** Fuller's principles are about the lawmaking process over time. We only have a snapshot of one law.

  - **The complexity of real legal systems:** We have simplified the grounds. In reality, the rule of recognition might be more complex and include moral criteria.

  - **The obligation to obey:** We don't address whether valid law must be obeyed. The exercise is about validity, not obedience.

  - **The nuances of the Hart-Fuller debate:** For example, Hart's concept of the minimum content of natural law, or Fuller's response that the inner morality is not just about efficacy but about respect for human agency.

  You must supply in lecture:
    - The social fact aspect of the rule of recognition.
    - Fuller's argument that the inner morality of law is a moral achievement because it respects human dignity by providing clear, stable, and feasible rules.
    - Hart's concession that there might be a minimum content of natural law based on human vulnerability and interdependence, but that this is separate from the concept of law.

  Now, let's write the complete materials.

  ### Final Materials

  #### Case File 1: The Council of Elders Decree (The Immaculate Abhorrence)
  **Title:** *State v. The Council of Elders Decree*  
  **Background:**  
  New Columbia was ruled by an authoritarian regime until six months ago. The regime's legislative body, the Council of Elders, enacted the "Public Health and Social Order Act" (PHSOA) two years ago. The decree was properly enacted, published in the Official Gazette, and applied prospectively. It was enforced consistently by officials.  

  **Content:**  
  - Section 1: Defines "contagious diseases" to include both medical conditions (e.g., tuberculosis) and "moral contagion," which is defined as "the expression of ideas that undermine public confidence in the government or its leaders."  
  - Section 2: Requires health professionals and public officials to report any person diagnosed with a contagious disease. Reported individuals are subject to mandatory quarantine in state facilities until they are deemed no longer a threat to public health or order.  
  - Section 3: Failure to report is punishable by five years in prison.  

  **Context:**  
  Under the old regime, the PHSOA was used to silence dissent. Thousands of political opponents were reported for "moral contagion," detained without trial, and subjected to harsh conditions. The law is clear, general, and was applied as written.  

  **Your Task:**  
  Determine the validity of the PHSOA under the Grounds of Decision.  

  #### Case File 2: The Victims of Persecution Relief Order (The Flawed Rectification)
  **Title:** *In re The Victims of Persecution Relief Order*  
  **Background:**  
  The new government of New Columbia issued the Victims of Persecution Relief Order (VPRO) to provide compensation to victims of the old regime. The order was rushed through to address public demand for justice.  

  **Content:**  
  - Section 1: Any person who was detained under the PHSOA (or similar laws) primarily for political reasons is entitled to 10,000 New Columbian pesos in compensation.  
  - Section 2: Claims must be filed within 30 days of the effective date of this order (which was set as the day after issuance). Claims must include a sworn statement from the claimant and two witnesses who were also detained under the same conditions.  
  - Section 3: Compensation is denied to any claimant who was ever charged with a violent offense under the old regime's laws, regardless of the outcome of that charge.  

  **Defects:**  
  - **Retroactive:** It applies to detentions that occurred before the order was made.  
  - **Unpublished:** Due to an administrative error, the order was not published in the Official Gazette until 10 days after its effective date.  
  - **Contradiction:** Section 1 includes "any person" detained for political reasons, but Section 3 excludes those charged with violent offenses. Since the old regime often fabricated violent charges against political detainees, this creates a contradiction: some persons eligible under Section 1 are excluded by Section 3.  
  - **Feasibility:** Many potential claimants are in hiding, in remote areas, or lack access to records. Finding two witnesses (who may be dead, missing, or afraid) and filing within 30 days is impossible for many. Proving the "primary" political reason is difficult without old regime records.  

  **Your Task:**  
  Determine the validity of the VPRO under the Grounds of Decision.  

  #### Grounds of Decision (Handout)
  [As above]

  #### Role Cards (Same for all judges)
  [As above]

  #### Timeline Recap
  - 0:00-0:10: Intro and panel assignment (3 panels start with Case 1, 3 with Case 2).  
  - 0:10-0:35: First case deliberations.  
  - 0:35-0:40: Break and report first case grounds. Collect sealed slips for first case.  
  - 0:40-1:05: Second case deliberations.  
  - 1:05-1:10: Report second case grounds. Collect sealed slips for second case.  
  - 1:10-1:20: Open sealed slips and tabulate.  
  - 1:20-1:35: Debrief Part 1 (mapping to Hart-Fuller).  
  - 1:35-1:50: Debrief Part 2 (corruption of legality in wicked regimes).  

  #### Debrief Guide
  **Part 1: Hart-Fuller Mapping**  
  - Case 1 Results:  
    - Grounds: Most panels uphold because source grounds are met and no craft grounds are violated.  
    - Sealed slips: Some individuals might say "not" for being law. Why? They might feel the injustice makes it not law.  
    - Hart: This is valid law because it meets the rule of recognition (source and craft in our Grounds). But it is evil, and we might choose to disobey.  
    - Fuller: While it meets the formal criteria, it fails the purpose of law (to promote human flourishing). However, Fuller might still call it law, but defective in morality.  

  - Case 2 Results:  
    - Grounds: Most panels strike down based on craft defects (retroactivity, publication, contradiction, feasibility).  
    - Sealed slips: Some might say "law" because they support the goal.  
    - Hart: If the rule of recognition includes these craft criteria, then it is invalid law. But it might still be considered a law (enacted by authority) that is invalid.  
    - Fuller: This fails the inner morality, so it is not law at all.  

  - Key Insight:  
    The dispute is not about whether evil law must be obeyed (positivism) or not (natural law). It is about what counts as law. Positivism focuses on source and social fact; natural law (Fuller) says law must meet moral standards of process.  

  **Part 2: Corruption of Legality**  
  - Case 1: The old regime met the formal criteria. But in reality, can a wicked regime consistently meet the craft standards?  
    - Example: They might start making secret laws (violate publication) or arbitrary changes (stability) to suppress opposition.  
  - Fuller's argument: The inner morality of law is a moral ideal that wicked regimes will inevitably violate because their goals conflict with the rule of law.  
  - Case 2: The new regime has good goals but failed the craft standards. This shows that good intentions are not enough; the rule of law requires adherence to the craft standards.  

  This exercise shows that the craft standards are necessary but not sufficient for a just legal system. They are a bulwark against arbitrariness, but they can be weaponized by wicked regimes (as in Case 1) or neglected by well-meaning ones (as in Case 2).  

  ### Prediction of First-Time Problems
  - **Identifying with German cases:** Redirect to fiction.  
  - **Panel ignoring grounds:** Remind them of the appellate reversal. In debrief, use as an example of arbitrariness.  
  - **Laundering justice:** Challenge during the exercise. In debrief, discuss the difficulty of separating justice from craft standards.  

  This exercise should achieve the learning goals and fit in 100 minutes.
answer: |-
  Below is a complete, runnable session plan for your 100-minute Hart-Fuller exercise, including all requested materials and candid feedback on your skeleton. The design prioritizes experiential learning, avoids historical baggage, and forces students to confront the core disagreement through action before theory. 

  ---

  ### **Session Materials**
  #### **1. Fictional Setting: New Columbia**
  - **Regime Sketch:** New Columbia emerged 18 months ago from a 20-year authoritarian regime ("The Directorate") that used technically sound laws to persecute minorities and dissidents. The new transitional government is rebuilding the legal system. Courts use the **Grounds of Decision** (below) to review old and new laws.
  - **Role:** All students serve as judges on the Transitional Validity Tribunal. Panels of three hear cases. One panel member acts as clerk per case (rotates).

  #### **2. Grounds of Decision Instrument**
  *(Handout to all students)*  
  **Admissible Grounds for Invalidating a Measure at First Instance**  
  *Rely only on these grounds. Explicitly state which ground(s) apply.*  

  | **Source-Based Grounds** | **Craft-Based Grounds** |
  |--------------------------|--------------------------|
  | **S1. Proper Enactment:** Issued by a recognized state organ with lawmaking authority. | **C1. Generality:** Applies to a class of persons/acts, not specific individuals. |
  | **S2. Publication:** Published in the Official Gazette before taking effect. | **C2. Intelligibility:** Understandable to a reasonable person subject to it. |
  | **S3. Prospectivity:** Applies only to conduct occurring *after* enactment. | **C3. Absence of Contradiction:** No internal conflicts or conflicts with higher laws. |
  |                          | **C4. Feasibility of Compliance:** Possible for affected persons to obey. |
  |                          | **C5. Stability:** No arbitrary changes within 12 months of enactment. |
  |                          | **C6. Congruence:** Officials consistently enforce the measure as written. |

  **⚠️ Critical Rule:** Manifest injustice is **not admissible**. If you invalidate based on injustice, you must declare: *"We void this measure as manifestly unjust"* — but it will be automatically reversed on appeal, and your panel loses standing for future cases.  

  **Sealed Slip:** After deliberations, each judge privately writes "LAW" or "NOT LAW" (is this measure *law at all?*) on a slip. Seal it in an envelope. These are opened only in the final debrief.  

  ---

  #### **3. Case Files**
  **Case A: The Directorate's "Family Purity Act" (Immaculate but Abhorrent)**  
  *(Distribute first to half the panels; counterbalanced with Case B)*  
  > **Context:** Enacted 5 years ago under the Directorate.  
  > **Content:**  
  > - §1: "A person diagnosed with 'hereditary social degeneracy' (including schizophrenia, homosexuality, or political dissidence) must register with the Bureau of Social Health."  
  > - §2: Registered persons are prohibited from marrying, having children, or holding public office.  
  > - §3: Failure to register is punishable by 10 years in prison.  
  >   
  > **Procedural Status:**  
  > - Properly enacted by the Directorate's legislature (S1).  
  > - Published in full (S2).  
  > - Fully prospective (S3).  
  > - Craft-compliant: General (C1), intelligible terms (C2), no contradictions (C3), compliance feasible (C4), unchanged for 5 years (C5), and strictly enforced (C6).  
  >   
  > **Moral Problem:** Used to imprison 12,000 dissidents and LGBTQ+ individuals. 

  **Case B: Transitional Justice Decree (Flawed but Morally Compelling)**  
  *(Distribute first to other half of panels)*  
  > **Context:** Issued 30 days ago by New Columbia's new government.  
  > **Content:**  
  > - §1: "Victims of Directorate-era political persecution may claim 20,000 pesos compensation."  
  > - §2: Claims must be filed within 30 days of *this decree's enactment* and require testimony from two witnesses.  
  > - §3: "No compensation if the victim was convicted of a Directorate-era violent crime."  
  >   
  > **Procedural Status:**  
  > - Properly enacted by new government (S1).  
  > - **Defects:**  
  >   - Retroactive (requires filing for past persecution; violates S3).  
  >   - Unpublished until 15 days after enactment (violates S2).  
  >   - Contradictory: §1 allows all political victims, but §3 excludes those with convictions (many convictions were fabricated; violates C3).  
  >   - Compliance infeasible: Witnesses often dead/fearful; 30-day deadline unreasonable (violates C4).  
  >   - Instability: Amended twice in 30 days to extend deadlines (violates C5).  
  >   
  > **Moral Appeal:** Compensates Directorate victims; widely supported by students.  

  ---

  #### **4. Role Cards**  
  *(No school labels; identical for all students)*  
  > **ROLE: JUDGE, TRANSITIONAL VALIDITY TRIBUNAL**  
  > - Apply ONLY the Grounds of Decision.  
  > - Manifest injustice voids your ruling. Use it only if you accept appellate reversal.  
  > - Deliberate for 20 minutes per case. Clerk records invoked grounds.  
  > - Vote: Majority decides validity.  
  > - Submit a sealed "LAW/NOT LAW" slip per case.  

  ---

  #### **5. Scoring & Accountability Scheme**  
  - **Non-monetary incentives:**  
    - **Peer Pressure:** Clerks publicly report grounds to the board.  
    - **Appeal Threat:** Panels using "manifest injustice" are "suspended" (cannot participate in debrief).  
    - **Sealed Slips:** Anonymously displayed later—creates accountability to personal conscience.  
  - **No points/bribes:** Legitimacy comes from fidelity to the Grounds.  

