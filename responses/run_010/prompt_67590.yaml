prompt: |-
  I direct the publications office at a mid-sized, nonpartisan policy institute. Roughly forty substantive reports and perhaps a hundred shorter commissioned pieces pass across my desk each year, and a large share of them lean on generational labels — in headlines, in section headings, and increasingly in the causal claims themselves. We have no standard for this. Our authors treat a cohort label as though it picked out a kind with a shared inner nature, so that a finding about a birth range is reported as a finding about a people; our reviewers, who are competent editors rather than demographers, cannot say whether any given usage is licensed. I would like a decision procedure my office can run on any draft that contains such a claim.

  The core of the procedure should be a distinction I want enforced but have not seen articulated anywhere: the difference between using a cohort label indexically, as a mere shorthand for a range of birth years; using it diagnostically, as a proxy for some variable the study never measured; and using it explanatorily, as the name of a causal factor, on the assumption that the people in the range share a formative history that durably shaped their dispositions. My working hypothesis is that the first is nearly always harmless if the range is stated, that the second is where most of our reports are actually going wrong without knowing it, and that the third should be permitted only on conditions the draft almost never meets. If you disagree with that allocation, say so and defend the alternative.

  Build the procedure as an ordered set of tests with explicit pass conditions, so that a reviewer who has never read a methods paper can run it in about forty-five minutes. It should at minimum include: a step requiring every generational claim to be restated in terms of age effects, period effects, and cohort effects, with the draft declaring which it is asserting and confronting the fact that the three are not separately identifiable in a single cross-section of survey data; a boundary test that re-runs the claim on adjacent birth bands and treats survival there as evidence that no cohort is doing the work; a mechanism requirement that names the formative event, the age window at exposure, and the pathway from exposure to lasting disposition; a check for whether people just outside the stated range had the same exposure, in which case the label is misdescribing a gradient; and a within-cohort differentiation check, informed by the old sociological point that a generation's shared social location crystallizes into smaller and often opposed groups rather than a single outlook. State clearly which steps are hard vetoes, which are flags, and which are judgment calls dressed up as procedure. Where the procedure cannot decide, it should hand the question back to me with a one-sentence statement of what is at stake.

  Then run it on three cases. First, our flagship annual housing report, whose headline claim is that a generation's blocked access to home ownership has produced a lasting change in its attitudes toward saving and risk, resting on one year of survey data comparing age groups. Second, a short client-commissioned piece that uses a newly coined label for the youngest cohort, whose only stated content is that its members grew up with pervasive digital technology. Third, an internal finding that workers under thirty differ sharply from everyone else on remote-work preference, where our data team's tabulation shows the under-thirty group splitting cleanly along whether the respondent entered the labor market before or after the pandemic shutdowns.

  I want the first case to come out badly for us — if your procedure vindicates our flagship report, I want to know why you think that is defensible. Close with an honest account of what the procedure cannot do, including how often it will forbid claims that are in fact true, and draft a standing disclosure note of no more than three sentences that any report retaining an explanatory cohort claim must carry. Please do not include a bibliography or a list of references; I will supply those myself.
reasoning: |-
  Okay, let me start by really understanding the user's situation. They're the director of publications at a policy institute, dealing with tons of reports that misuse generational labels. The core issue is that authors treat cohort labels as if they represent a shared inner nature, which is problematic. The user wants a clear, enforceable procedure to evaluate these claims.

  First, I need to grasp the three distinctions they mentioned: indexical, diagnostic, and explanatory uses. Indexical is just shorthand for birth years, which is mostly harmless. Diagnostic uses the label as a proxy for unmeasured variables, which is where most mistakes happen. Explanatory treats the cohort as a causal factor, which requires solid evidence. The user thinks explanatory should be rare and tightly controlled.

  The user’s deeper needs include maintaining credibility for their institute. Since they're nonpartisan, ensuring methodological rigor is crucial. They might also be concerned about authors overgeneralizing or making causal claims without evidence, which could mislead clients or policymakers. The unspoken need is protecting the institute's reputation by preventing flawed research from being published.

  Next, building the procedure. It needs to be step-by-step, with clear pass/fail conditions. The user mentioned specific tests: restating claims in terms of age, period, cohort effects; boundary tests; mechanism requirements; exposure checks; and within-cohort differentiation. I should structure these as ordered tests, labeling each as veto, flag, or judgment call.

  For the vetoes, the restatement step is critical. If a draft claims causation from cross-sectional data without acknowledging the identification problem, that's a hard stop. Similarly, if the boundary test shows the effect isn't cohort-specific, that should veto explanatory claims. The mechanism step should also be a veto for explanatory uses because without a clear causal pathway, the claim is unsupported.

  Flags could include checks for diagnostic substitutions. If a label is used as a proxy without validation, that's a red flag. Also, within-cohort differentiation is a flag because even if a cohort effect exists, internal variation might undermine generalizations.

  Judgment calls might involve whether the mechanism is plausible or if the exposure check suggests a gradient. These require the reviewer's discretion but need clear criteria to guide them.

  Now, applying the procedure to the three cases. The flagship housing report uses one year of survey data to claim a generational causal effect. Restating it shows they confuse cohort effects with age effects. Boundary test would likely show similar attitudes in adjacent cohorts. No mechanism is provided. This should fail multiple vetoes, confirming the user's suspicion it's flawed.

  The commissioned piece for the youngest cohort only mentions digital technology exposure. It’s diagnostic but unvalidated. The exposure check might show nearby cohorts also had access, making the label arbitrary. It’s a judgment call, but likely requires revision or disclaimer.

  The internal finding on remote work shows a split based on pandemic timing, not age. Here, the mechanism is clear (labor market entry during shutdowns), and boundary test might confirm the effect is specific to that event. This could pass as explanatory if framed around the event, not the cohort label.

  Finally, the limitations. The procedure might reject true claims if data is insufficient, but that's a necessary trade-off for rigor. The disclosure note must be concise, warning against overgeneralization and highlighting internal diversity.

  I need to ensure the procedure is practical for non-experts. Each step should be explicit, with examples. Avoiding jargon where possible. Also, emphasizing that the procedure protects the institute from publishing weak claims, aligning with their credibility goals.
answer: |-
  Here is a decision procedure for evaluating cohort claims, designed for efficiency and clarity by non-specialist reviewers, followed by an evaluation of your three cases, limitations, and a disclosure note.

  **Generational Claim Evaluation Procedure (GC-EVAL)**

  1.  **Restatement & Identification Test (VETO for Explanatory Claims if Failed)**
      *   **Action:** For any claim invoking a generational label (e.g., "Millennials believe X," "Gen Z does Y"), restate the core claim explicitly in terms of:
          *   **Age Effect:** Due to their current life stage (e.g., young adulthood).
          *   **Period Effect:** Due to current events/culture affecting everyone now.
          *   **Cohort Effect:** Due to shared formative experiences specific to their birth era.
      *   **Pass Conditions:**
          *   The draft clearly states which type of effect (Age, Period, Cohort) it is *primarily asserting* as the driver.
          *   If asserting a Cohort Effect, the draft explicitly acknowledges the "APC Identification Problem": that Age, Period, and Cohort effects are **mathematically confounded** in standard cross-sectional survey data (one time point). It must state this limitation prohibits definitive causal attribution *from that data alone*.
      *   **Fail:** Veto any claim asserting an *Explanatory Cohort Effect* if it fails to declare the intended effect *and* acknowledge the APC Identification Problem for cross-sectional data. Indexical or Diagnostic uses can pass with limitations noted in step 2/3.

  2.  **Boundary Test (VETO for Explanatory Claims if Failed)**
      *   **Action:** Identify the precise birth years defining the cohort label in the draft. Test the core claim by shifting the boundaries slightly earlier and later (e.g., ± 3-5 years). Does the claimed attitude/behavior/trait disappear abruptly at the stated boundaries?
      *   **Pass Conditions:** For an *Explanatory Cohort Effect* claim to pass:
          *   The draft must provide evidence (e.g., data analysis, strong theoretical justification) that the phenomenon is **distinctly concentrated** within the stated birth range and diminishes significantly just outside it.
          *   Survival of the phenomenon in adjacent bands must be minimal or explainable by other factors.
      *   **Fail:** Veto any Explanatory claim if evidence suggests the phenomenon is present in adjacent bands at similar levels, indicating it's likely an age effect, period effect, or a broader social gradient, not a cohort-specific effect. (Flags Diagnostic/Indexical uses if boundaries seem arbitrary).

  3.  **Mechanism Requirement (VETO for Explanatory Claims if Failed)**
      *   **Action:** Demand specification of:
          *   **The Formative Event/Experience:** What specific historical event(s), technological shift(s), or socio-economic condition(s) are claimed to be formative?
          *   **The Sensitive Age Window:** At what approximate age range (e.g., adolescence: 10-19) was exposure claimed to be most impactful?
          *   **The Durable Pathway:** How does exposure at that specific age *cause* a lasting disposition? (e.g., "Early exposure to social media during formative identity development (ages 12-18) rewired neural pathways for social comparison, leading to chronically higher anxiety levels").
      *   **Pass Conditions:** An *Explanatory Cohort Effect* claim must clearly state **all three elements**. The mechanism must be plausible and specific, not just "grew up during X".
      *   **Fail:** Veto any Explanatory claim missing any of the three elements. (Flags Diagnostic uses if mechanism is implied but not validated).

  4.  **Exposure Gradient Check (FLAG)**
      *   **Action:** For the mechanism specified in Step 3, check if people born just *before* or just *after* the stated cohort boundaries likely experienced the same formative event(s) during the same sensitive age window.
      *   **Pass Conditions:** The draft demonstrates or argues convincingly why exposure was meaningfully different *only* for the defined cohort (e.g., a discrete policy change affecting school entry year). If exposure is a gradient (e.g., gradual tech adoption), the cohort label is likely misapplied.
      *   **Fail/Flag:** Flag any claim (especially Explanatory) where exposure appears continuous across birth years. This suggests the label is arbitrary and the phenomenon is better described as a gradient or age/period effect. Requires justification or revision.

  5.  **Within-Cohort Differentiation Check (FLAG)**
      *   **Action:** Require the draft to acknowledge that the named cohort is not monolithic. Does the data/argument account for significant internal diversity (e.g., by class, race, region, ideology) within the birth range? Does the claim overgeneralize?
      *   **Pass Conditions:** The draft explicitly notes the potential for significant internal variation within the cohort regarding the claimed trait/behavior. Claims are qualified (e.g., "tendency," "on average," "significant segment") and supported by data showing the pattern holds despite internal diversity.
      *   **Fail/Flag:** Flag claims presenting the cohort as uniform ("Gen Z believes...") without acknowledging internal differentiation or data showing strong opposing trends within the cohort. Weakens generalizability.

  **Handoff:** If the procedure yields conflicting flags or complex judgment calls (esp. after Step 4 or 5) that the reviewer cannot resolve, halt and return to the Director with: "Unresolved conflict: [State the specific point of contention, e.g., 'Plausibility of mechanism vs. exposure gradient evidence', 'Strength of boundary test vs. APC limitation']."

  ---

  **Evaluation of Cases**

  1.  **Flagship Housing Report (Explanatory Claim):**
      *   **Step 1 (Restatement/ID):** FAIL (VETO). Claims a cohort effect ("blocked access... produced lasting change"). Uses single-year cross-sectional data comparing age groups. Fails to acknowledge this data cannot distinguish a cohort effect from an age effect (younger people always save less/have different risk profiles) or a period effect (current economic conditions). *Veto Applied.*
      *   *Procedure Halted at Step 1 (Veto).* Even if run further: Step 2 likely fails (homeownership barriers affect adjacent cohorts similarly). Step 3 fails (no specific mechanism/life stage). Step 4 flags (barriers are a gradient worsening over time). Step 5 flags (ignores wealth/region variation within cohort). **Result:** Claim fails. Requires major revision (reframe as age/period effect, add longitudinal data, drop cohort explanation).

  2.  **Client Piece on New Young Cohort Label (Diagnostic Claim implied):**
      *   **Step 1 (Restatement/ID):** PASS (Indexical/Diagnostic). It's likely using the label indexically ("youngest cohort") or diagnostically (proxy for "grew up digital"). No strong explanatory claim asserted *yet*, but risk is high. APC problem acknowledged? Unlikely, but diagnostic use doesn't require it. Passes Step 1 with caution.
      *   **Step 2 (Boundary):** FLAG. Newly coined label implies sharp boundaries. No evidence provided that attitudes/behaviors shift sharply at those boundaries. Likely arbitrary.
      *   **Step 3 (Mechanism):** N/A for Diagnostic. But Step 3 would VETO if explanatory claims creep in (none specified here yet).
      *   **Step 4 (Exposure):** FLAG. "Pervasive digital technology" adoption was gradual. People born just before/after the label's boundaries had highly similar exposures. Label misdescribes a gradient. What makes *this* range unique?
      *   **Step 5 (Differentiation):** FLAG. High likelihood of significant internal variation (digital access, use, attitudes) within this cohort ignored.
      *   **Result:** No hard veto, but multiple serious FLAGS. Requires revision: State birth years clearly (Indexical), avoid implying the label *explains* anything without evidence, add strong caveats about boundaries, exposure gradient, and internal diversity. High risk of misuse; recommend minimizing label use.

  3.  **Internal Finding on Remote Work (Potential Explanatory Claim):**
      *   **Step 1 (Restatement/ID):** PASS (Cohort Effect claimed, but...). The *draft* claims an age effect ("under thirty differ"). The *data* suggests a cohort effect tied to pandemic labor market entry (a formative event). Reviewer must force restatement: "Workers entering labor market during/post-pandemic shutdowns prefer remote work more." Asserting Cohort Effect. Acknowledges APC problem? Data (tabulation showing split *within* under-30s by entry timing) helps mitigate it by isolating the event. Passes cautiously.
      *   **Step 2 (Boundary):** PASS (Conditional). The data shows a clean split *within* the age group based on a specific event timing. This acts as a strong boundary test *relative to the event*. The cohort is defined by the event (pandemic entrants), not just birth years. Passes if defined this way.
      *   **Step 3 (Mechanism):** PASS. *Formative Event:* Pandemic shutdowns inducing mass remote work adoption. *Sensitive Window:* Labor market entry (ages ~20-30). *Pathway:* Normalization of remote work as the default "first job" experience shapes lasting preferences/expectations. Plausible.
      *   **Step 4 (Exposure):** PASS (Conditional). Defined by the event timing, not birth years. People entering just before/after the shutdowns had different initial experiences. The boundary (shutdown period) is defensible.
      *   **Step 5 (Differentiation):** FLAG. Data shows a split *within* the age group, proving differentiation exists. Draft must acknowledge this and frame the claim carefully ("workers *who entered during shutdowns*", not "workers under 30").
      *   **Result:** Explanatory cohort claim **PASSES** with conditions: The cohort must be defined by the *event timing* (labor market entry during/post-shutdowns), not just age. The label "Gen Z" or similar adds little value here and risks overgeneralization; the event is the clearer factor. Strong within-cohort differentiation must be acknowledged. Requires precise reframing.

  ---

  **Limitations of GC-EVAL**

  1.  **False Negatives:** It will sometimes forbid claims that are true (Type II errors). Rigorous cohort effects exist but are exceptionally hard to *prove* with standard social science data due to the APC problem. GC-EVAL prioritizes avoiding false positives (defensible claims) over catching all true effects. True cohort effects lacking clear boundaries, mechanisms, or facing data limitations will be rejected.
  2.  **Complexity Masking:** It cannot detect if a claimed "cohort effect" is actually a complex interaction of age, period, *and* unmeasured variables masquerading as cohort.
  3.  **Data Agnosticism:** It flags methodological issues (like APC) but cannot assess the *quality* of the underlying data (sampling, measurement validity).
  4.  **Proxy Validation:** It flags unvalidated diagnostic use but cannot *validate* if the label is a good proxy; that requires separate analysis.
  5.  **Nuance Loss:** It enforces strictness which may lead to clunkier, more precise language, potentially reducing rhetorical impact (a trade-off for accuracy).
  6.  **Judgment Reliance:** Steps 4 (Exposure) and 5 (Differentiation) involve significant reviewer judgment on "meaningful difference" or "significant diversity."

  **Standing Disclosure Note for Explanatory Cohort Claims**

  > "Claims about generational cohorts as causal forces rely on identifying shared formative experiences producing lasting dispositions within specific birth ranges. Such claims face inherent methodological challenges in distinguishing cohort effects from age or period effects. Significant diversity exists within any birth cohort; findings represent aggregate tendencies, not universal traits. The evidence and reasoning supporting the specific cohort definition, mechanism, and boundaries for this claim are detailed within the report." (3 sentences)

  This procedure provides a robust, operationalizable defense against the most common and damaging misuses of generational labels while allowing carefully justified explanatory uses, protecting your institute's analytical rigor.
