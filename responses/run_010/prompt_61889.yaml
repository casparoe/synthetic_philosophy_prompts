     Part (a):

       We prove by induction on the length of a derivation that every theorem of the system has a number of B's that is congruent to either 1 or 2 modulo 3.

       Base case: The axiom is AB, which has one B. 1 mod3 is 1, which is in {1,2}.

       Inductive step: Assume that for every theorem derived in n steps, the number of B's is ≡1 or 2 mod3. Consider a theorem derived in n+1 steps. It is obtained by applying one rule to a theorem (say s) that was derived in at most n steps. By the induction hypothesis, s has k B's, where k ≡1 or 2 mod3.

       We consider each rule:

         1. Doubling: We have s = Ax (for some string x) and the new string is Axx. Let the number of B's in x be m. Then the number of B's in s is m (since s = Ax). The new string Axx has 2m B's. 
              - If m≡1 mod3, then 2m≡2 mod3, which is in {1,2}.
              - If m≡2 mod3, then 2m≡4≡1 mod3, which is in {1,2}.

         2. Accretion: s becomes sAAA. The number of B's remains k, so by induction hypothesis, it is in {1,2} mod3.

         3. Collapse: s contains a substring BBB, so we write s = xBBBy. The new string is xAy. The number of B's in the new string is k - 3 (because we remove three B's and add none). Since k≡1 or 2 mod3, then k-3≡k mod3 (because -3≡0 mod3). So the new number of B's is still ≡1 or 2 mod3.

         4. Annihilation: s contains a substring AA, so we write s = xAAy. The new string is xy. The number of B's remains k, so it is in {1,2} mod3.

       Therefore, every theorem has a number of B's ≡1 or 2 mod3.

       Now, the string `A` has 0 B's, which is ≡0 mod3, not in {1,2}. Therefore, it is not a theorem.

       The string `ABBB` has 3 B's, which is ≡0 mod3, not in {1,2}. Therefore, it is not a theorem.

