  We are to design a thought experiment where honoring a sunk cost is rational because the sunk cost provides evidence about the world. The key is that the agent had private information when making the initial investment, which is now lost, and the fact of the investment is the only trace of that information.

  Setting: A small business owner, Alice, has a piece of land. She is considering whether to build a warehouse on it. The warehouse will be profitable only if a new highway is built nearby (state H). If the highway is not built (state ~H), the warehouse will be a loss.

  One year ago, Alice had a private signal about the highway. She had a conversation with a government official (who has since passed away) that gave her reason to believe the highway would be built. Based on that, she invested $50,000 in preparing the land (clearing, grading, etc.). This investment is entirely sunk and has no resale value. It also has not changed her skills, tastes, or the value of completing the warehouse.

  Now, the decision is whether to build the warehouse. Building it costs an additional $100,000. If built, the warehouse will yield $200,000 in profit (over its lifetime) if the highway is built, but only $50,000 if not. Without the warehouse, the land yields nothing (we assume no alternative use for simplicity).

  Objective payoffs for building:
  - If H: $200,000 - $100,000 (building cost) = $100,000 net
  - If ~H: $50,000 - $100,000 = -$50,000 net

  Not building: $0.

  Note: The sunk $50,000 is not included in these payoffs because it is sunk.

  Now, the prior probability of H (highway being built) is 0.5. Without any additional information, the expected value of building is:
  - (0.5 * $100,000) + (0.5 * -$50,000) = $50,000 - $25,000 = $25,000

  Without building: $0.

  So a rational agent without any additional information would build because $25,000 > 0.

  But Alice had a private signal. Let's model that signal. A year ago, she had a signal S that could be either "High" (indicating H) or "Low" (indicating ~H). The signal was not perfect. Let the likelihoods be:

  P(S=High | H) = 0.9
  P(S=Low | H) = 0.1
  P(S=High | ~H) = 0.2
  P(S=Low | ~H) = 0.8

  So the signal was informative. If she had the signal, she would update her prior.

  But now, she doesn't remember the signal. However, she does know that she invested. And she invested only if she got the High signal. Why? Because she is rational and would only invest if the expected value given her signal was positive.

  We assume that without the signal, the prior is 0.5 and the expected value without any signal would be $25,000 (as above) but note that the investment decision was based on the signal.

  At the time of investment, she had to decide to invest $50,000 for the preparation. What was the value of that investment? It is a necessary step for building the warehouse. Without the preparation, she cannot build. So the investment was a commitment to the project. But note: the preparation has no value without the warehouse.

  At the time of the initial investment, she had the signal. She computed:

  If she invests the $50,000, then later she can choose to build (paying $100,000 more) or not. We assume that at the time of the initial investment, she also planned to build if her posterior probability of H was high enough.

  But now, we are at the later stage. The key is that her past action (investing) is evidence that she must have received a positive signal.

  We need to compute the expected value for Alice now, knowing that she invested, and for a counterpart (Bob) who has the same situation but did not make the investment (and has no memory of any signal).

  But note: the counterpart inherited the project without having invested. So Bob has the land already prepared (somehow, without cost to him) and now faces the same building decision.

  For Alice: She knows that she invested. That means that at the time, she must have had a signal that made the investment rational. We need to compute the posterior probability of H given that she invested.

  First, note that she would invest only if she got S=High. Why? Because if she got S=Low, then her posterior probability of H would be:

  P(H | S=Low) = P(S=Low | H) * P(H) / P(S=Low) = (0.1 * 0.5) / (0.1*0.5 + 0.8*0.5) = 0.05 / (0.05+0.4) = 0.05/0.45 = 1/9 ≈ 0.111

  Then, the expected value of the entire project (if she were to build) at that time would be:

  If she builds: 
  - With probability P(H | S=Low) = 1/9: profit $100,000 (from the building stage: $200,000 - $100,000)
  - With probability 8/9: loss $50,000

  So expected value from building: (1/9)*100,000 + (8/9)*(-50,000) = (100,000 - 400,000)/9 = -300,000/9 ≈ -$33,333

  Then, if she doesn't build, she loses the $50,000 (which she would have sunk). But note: at the initial stage, she hasn't invested yet. So she can avoid the $50,000 loss by not investing.

  Therefore, if she gets S=Low, she would not invest the $50,000 because even if she invested, she wouldn't build (since building has negative expected value given S=Low) and then she would just lose $50,000.

  Now, if she gets S=High, then:

  P(H | S=High) = P(S=High | H)*P(H) / P(S=High) = (0.9 * 0.5) / (0.9*0.5 + 0.2*0.5) = 0.45 / (0.45+0.1) = 0.45/0.55 = 9/11

  Then the expected value of building (given S=High) is:

  (9/11)*100,000 + (2/11)*(-50,000) = (900,000 - 100,000)/11 = 800,000/11 ≈ $72,727

  Therefore, if she invests $50,000 and then builds, the total expected net gain (from the initial perspective) would be $72,727 - $50,000 = $22,727, which is positive. So she would invest and then build.

  But note: at the initial stage, she doesn't have to commit to building. She can invest the $50,000 and then later decide. Given S=High, building is positive expected value (as above, $72,727) so she would build. So the entire plan is positive.

  Now, at the later stage, she has invested. What does that tell her? It tells her that she must have gotten S=High. Why? Because if she had gotten S=Low, she would not have invested. So the fact that she invested implies S=High.

  Therefore, now, conditional on having invested, she knows that she got S=High. So her current posterior for H is P(H | investment) = P(H | S=High) = 9/11.

  Therefore, the expected value of building is:

  (9/11)*100,000 + (2/11)*(-50,000) = (900,000 - 100,000)/11 = 800,000/11 ≈ $72,727

  So she should build.

  Now, consider Bob. Bob inherits the prepared land. He did not make the investment. He has no memory of any signal. Moreover, he has no knowledge of why the land is prepared. He just has the land. For him, the prior is 0.5. So his expected value for building is:

  0.5 * 100,000 + 0.5 * (-50,000) = $50,000 - $25,000 = $25,000

  So Bob, too, would build because $25,000 > 0.

  But wait: we want Bob to abandon? We need a case where without the evidence from the sunk cost, the project is not worth continuing. So we must adjust the numbers.

