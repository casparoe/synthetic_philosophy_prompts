  So he does not build.

  Thus, Alice continues (builds) and Bob abandons.

  Now, we must ensure that the sunk cost itself is not being counted. The $50,000 is sunk. In the building decision, it is not included. The only difference is that Alice knows that she had a positive signal (because she invested) and Bob does not.

  Let me write the scenario.

  Scenario:

  Alice owns a piece of land. She is considering building a warehouse. The warehouse will yield $300,000 in profit (revenue minus operating costs) if a new highway is built (state H), but only $50,000 if not (state ~H). Building the warehouse requires two steps: first, preparing the land (costing $50,000), and then constructing the building (costing $80,000). The preparation must be done before construction and has no value on its own. 

  A year ago, Alice had a private conversation with a government official (now deceased) that provided a signal about the highway. The signal was either High (indicating H) or Low (indicating ~H). The signal's accuracy: P(High|H)=0.9, P(Low|H)=0.1, P(High|~H)=0.2, P(Low|~H)=0.8. The prior probability of H was 0.1.

  Alice, being rational, would only invest in the preparation if the expected value of the entire project (preparation plus building) was positive, which required a High signal. With a High signal, her posterior for H becomes 1/3, and the expected value of building (after preparation) is (1/3)*220,000 + (2/3)*(-30,000) = $53,333.33. Then, net of the preparation cost: $53,333.33 - $50,000 = $3,333.33 > 0, so she invests. With a Low signal, the expected value of building would be negative, so she avoids the preparation.

  Alice invested $50,000 to prepare the land. Now, a year later, she has forgotten the signal and the details of the conversation. She must decide whether to build the warehouse (paying $80,000). The preparation cost is sunk and has no resale value. It has not changed her skills, tastes, or the value of the warehouse.

  Because she invested, she infers that she must have received a High signal. Therefore, her posterior probability of H is 1/3. The expected value of building is $53,333.33 (as above), so she builds.

  Matched control: Bob inherits the same piece of land already prepared (at no cost to him). He has no information about the highway beyond the prior (P(H)=0.1). For him, the expected value of building is 0.1*220,000 + 0.9*(-30,000) = $22,000 - $27,000 = -$5,000. Therefore, he does not build.

  Thus, Alice continues and Bob abandons, and both are rational.

  Now, the checks.

  Feature doing the work: The fact that Alice invested provides evidence (via her past rational decision) that she had a positive signal. That signal is informative about the state of the world.

  Ablation 1: If she had kept a written record and could re-read the original evidence, then she would update based on the actual signal. If the record says High, she builds; if Low, she doesn't. But in this case, she doesn't need to rely on the investment as evidence. The case is weakened because she has a more direct source of evidence, but the investment still might be consistent. However, if she has the record, she doesn't need the investment as evidence. So the evidential role of the sunk cost is eliminated, but the decision might be the same if the record says High. However, the point is that without the record, the investment is the only evidence.

  But note: the case still works if she doesn't have the record. The ablation that destroys the case is when the investment was made for a reason that carries no information.

  Ablation 2: Suppose the investment was made for a non-informative reason. For example, Alice invested because she misread the date and thought the deadline for preparation was that day (when in fact it was not). Or her accountant made a mistake and invested without her input. In that case, the investment does not signal a High signal. Then, Alice has no update from the investment. Her posterior remains the prior (0.1). Then, her expected value of building is -$5,000 (same as Bob), so she would not build. This ablation destroys the case: without the informational content, the sunk cost does not change the decision.

  Now, her best reply: She says that we have not found a rational sunk cost but a piece of evidence stored in history. The expenditure matters only because it is informative, and informativeness is a payoff-relevant feature. Therefore, the strict irrelevance of costs as costs (i.e., as outflows that should be ignored) is untouched.

  Response: This reply is substantive but it is a redescription in a way that preserves the orthodoxy. It forces us to distinguish between:

  (a) Treating the sunk cost as a cost that should be included in the future cash flows (which is irrational).

  (b) Treating the sunk cost as evidence about the world (which is rational).

  In the fallacy of sunk costs, it is (a) that is the error. The fallacy should be defined as treating a cost that is unrecoverable as if it were a future cost that should affect the decision. But in our case, we are not doing that. We are treating the past action (of incurring the cost) as evidence about the state of the world. This is not a fallacy. Therefore, the fallacy should be defined narrowly as in (a). 

  However, in common usage, the fallacy includes any influence of sunk costs on decisions. Our case shows that sometimes that influence is rational because it is evidential. Therefore, the orthodox position that "once a cost is genuinely sunk it can never figure in a rational decision" is too strong. It can figure as evidence.

  Finally, non-evidential routes: Under the constraints (no reputation, no identity change, no recovery, no change in payoff structure), it seems that the evidential route is the only one left standing. Any non-evidential reason to honor sunk costs would violate the constraints (e.g., by introducing a change in identity or reputation).

  Therefore, the evidential route is the only one that survives.

  Now, let me write the thought experiment and the analysis as requested.
answer: |-
  ### Thought Experiment: The Land Development Project

  **Scenario:** Alice owns a vacant plot of land. A year ago, she considered developing it into a warehouse, which would yield $300,000 in profit if a new highway is approved (state H), but only $50,000 if not (state ~H). Development requires two stages: land preparation (cost: $50,000) and construction (cost: $80,000). The preparation is useless without construction and has no resale value. Alice had private information: a conversation with a now-deceased official, providing a signal about the highway. The signal was High (favoring H) or Low (favoring ~H), with likelihoods P(High|H) = 0.9, P(Low|H) = 0.1, P(High|~H) = 0.2, P(Low|~H) = 0.8. The prior probability of H is 0.1. Alice is rational and invests only if the expected net gain is positive. Given the signal, she would invest in preparation only if it was High (as Low makes abandonment optimal). She invested $50,000. Now, she has forgotten the signal and conversation details, and no records exist. She must decide whether to construct the warehouse. The sunk cost provides the only trace of her lost information. No one observes her decision, the payoff structure is unchanged, and there are no skill or identity effects.

  **Matched Control:** Bob inherits an identical prepared plot (free to him). He faces the same construction decision with the same prior (P(H) = 0.1) and no signal history.

  **Payoffs and Rational Calculations:**
  - Construction payoff if H: $300,000 - $80,000 = $220,000 net  
  - Construction payoff if ~H: $50,000 - $80,000 = -$30,000 net  
  - Abandonment payoff: $0  
  - Utilities: Monetary payoffs (utilities equal dollars).  
  - Priors and likelihoods: As above.  

  *Alice’s decision (after sinking $50,000):*  
  Her investment implies she received a High signal (only then was preparation rational). This updates her belief:  
  P(High) = P(High|H)P(H) + P(High|~H)P(~H) = (0.9)(0.1) + (0.2)(0.9) = 0.27  
  P(H|High) = [P(High|H)P(H)] / P(High) = (0.9)(0.1) / 0.27 ≈ 0.333  
  Expected value of construction:  
  (0.333)($220,000) + (0.667)(-$30,000) ≈ $73,333 - $20,000 = $53,333  
  $53,333 > $0 → Alice rationally constructs.

  *Bob’s decision:*  
  No investment history; prior P(H) = 0.1 remains.  
  Expected value of construction:  
  (0.1)($220,000) + (0.9)(-$30,000) = $22,000 - $27,000 = -$5,000  
  -$5,000 < $0 → Bob rationally abandons.

  ### Analysis
  **Feature doing the work:** The sunk cost is evidence because Alice’s past investment was contingent on her private signal. The act of investing reveals that she likely had favorable information, updating her belief about H. This evidence is distinct from the cost itself—it arises because her rational past action signals the lost information.

  **Ablations:**  
  1. **Written record preserved (she re-reads the original evidence):**  
     - If she re-reads a High signal, she constructs (same as before). If Low, she abandons. The sunk cost no longer provides unique evidence; it is redundant. This weakens the case but doesn’t destroy it, as the decision may align if the record confirms High.  
  2. **Investment made for non-informative reason (e.g., accountant’s deadline misapprehension):**  
     - The investment was unrelated to the signal. It carries no information about H, so Alice’s belief remains P(H) = 0.1. Expected value: -$5,000. She abandons, like Bob. This destroys the case, as the evidential link is severed.

  **Reply to orthodoxy:**  
  Your reply—that this is "evidence stored in history," not a sunk cost "as a cost"—is a substantive redescription. It correctly notes that informativeness is payoff-relevant, but it redefines the fallacy too narrowly. The fallacy should be defined as treating a sunk cost *as a cost to be recovered* (e.g., "I must continue to justify the expense"), not as *evidence when it is informative*. Here, the cost is not a reason "in itself"; it is a proxy for lost information. If the cost carries no information (as in the second ablation), ignoring it is rational. But when it is informative, strict irrelevance is incorrect—the cost figures rationally as evidence.

  **Non-evidential routes under constraints:**  
  Under your constraints (no reputation, signaling, identity, or payoff changes), no non-evidential route survives. For example:
  - **Reputation:** Excluded by the "no one learns" constraint.  
  - **Identity/attachment:** Excluded by "no change in what finishing is worth."  
  - **Recovery/framing:** Excluded by "unrecoverable, no resale value."  
  The evidential route is the only one left standing.  

  This case meets your requirements: ordinary context (land development), small numbers, no exotic elements, and the verdict follows from explicit expected-value calculations. Both agents are rational; the difference arises solely from Alice’s evidence about the world, inferred from her sunk cost.
