  0.3*100,000 + 0.7*(-50,000) = 30,000 - 35,000 = -$5,000 -> negative, so Bob would not build.

  But let's check Alice.

  First, we need to recompute the signal probabilities.

  Prior: P(H)=0.3, P(~H)=0.7

  P(S=High | H)=0.9, P(S=Low|H)=0.1
  P(S=High | ~H)=0.2, P(S=Low|~H)=0.8

  P(S=High) = P(S=High|H)*P(H) + P(S=High|~H)*P(~H) = 0.9*0.3 + 0.2*0.7 = 0.27 + 0.14 = 0.41
  P(S=Low) = 1 - 0.41 = 0.59

  Now, if Alice gets S=Low:

  P(H | S=Low) = P(S=Low|H)*P(H)/P(S=Low) = (0.1 * 0.3) / 0.59 = 0.03 / 0.59 ≈ 0.0508

  Then expected value of building (if she had invested and then built) would be:
  0.0508 * 100,000 + (1-0.0508) * (-50,000) ≈ 5,080 - 50,000 + 2,540? Let me compute:

  = 0.0508*100000 + 0.9492*(-50000) = 5,080 - 47,460 = -$42,380

  So if she gets S=Low, she wouldn't build. And since she hasn't invested yet, she avoids the $50,000 by not investing.

  If she gets S=High:

  P(H | S=High) = P(S=High|H)*P(H)/P(S=High) = (0.9*0.3)/0.41 = 0.27/0.41 ≈ 0.6585

  Then expected value of building: 
  0.6585 * 100,000 + (1-0.6585) * (-50,000) = 65,850 - 17,075 = $48,775

  So the expected net gain from the initial investment and then building: $48,775 - $50,000 = -$1,225? That's negative! So she wouldn't invest even with S=High.

  We need the initial investment to be rational only when she gets the high signal. So we must adjust so that with S=High, the entire project (investment and building) is positive.

  Let me change the building cost to $80,000 (instead of $100,000). Then:

  Payoffs for building:
  - If H: $200,000 - $80,000 = $120,000
  - If ~H: $50,000 - $80,000 = -$30,000

  For Bob, with prior P(H)=0.3, expected value of building: 
  0.3*120,000 + 0.7*(-30,000) = 36,000 - 21,000 = $15,000 > 0 -> still builds.

  We need Bob to abandon, so let me set the prior even lower, say P(H)=0.2.

  Then Bob: 0.2*120,000 + 0.8*(-30,000) = 24,000 - 24,000 = $0. So he is indifferent. We want negative. Set P(H)=0.1.

  Bob: 0.1*120,000 + 0.9*(-30,000) = 12,000 - 27,000 = -$15,000 -> does not build.

  Now, for Alice:

  Prior P(H)=0.1, P(~H)=0.9

  P(S=High) = P(S=High|H)*P(H) + P(S=High|~H)*P(~H) = 0.9*0.1 + 0.2*0.9 = 0.09 + 0.18 = 0.27
  P(S=Low) = 0.73

  If S=Low:

  P(H|S=Low) = P(S=Low|H)*P(H)/P(S=Low) = (0.1 * 0.1) / 0.73 = 0.01 / 0.73 ≈ 0.0137

  Expected value of building: 0.0137*120,000 + 0.9863*(-30,000) ≈ 1,644 - 29,589 = -$27,945 -> not build. So she avoids the investment.

  If S=High:

  P(H|S=High) = (0.9*0.1)/0.27 = 0.09/0.27 = 1/3 ≈ 0.3333

  Expected value of building: (1/3)*120,000 + (2/3)*(-30,000) = 40,000 - 20,000 = $20,000

