  The Pasadena game highlights a fundamental issue in probability and decision theory regarding the definition of expected value when the relevant series converges conditionally but not absolutely. In this case, the terms of the expectation are \(\pm \frac{1}{n}\) for \(n = 1, 2, 3, \ldots\), forming the alternating harmonic series \(\sum_{n=1}^{\infty} (-1)^{n+1} \frac{1}{n}\), which converges to \(\ln 2 \approx 0.693\) when summed in the natural order (i.e., the order defined by the game, based on the toss number \(n\)).

  However, the standard verdict in probability theory is that this game has no expected value. The key reason is that the series for the expectation does not converge absolutely: \(\sum_{n=1}^{\infty} \left| (-1)^{n+1} \frac{1}{n} \right| = \sum_{n=1}^{\infty} \frac{1}{n}\) diverges (it is the harmonic series). As a result, Riemann's rearrangement theorem applies, meaning that by reordering the terms, the series can be made to converge to any real number, or to diverge. This dependence on the order of summation implies that the expected value is not well-defined in the usual sense.

  Your intuition that rearranging terms "does not alter the coin, the stakes, or the gamble" is correct—the physical process and its probabilistic structure remain unchanged. However, the issue arises in how we mathematically define and compute the expectation as a functional of the random variable. Specifically:

  1. **Expectation as a property of the distribution**: In probability theory, the expected value is intended to be a property of the distribution of the random variable (in this case, the payoff), not of the specific labeling or ordering of outcomes in the sample space. For the expectation to depend solely on the distribution—and thus be invariant under measure-preserving transformations, such as relabeling outcomes—it must be defined such that it does not change when the sample space is rearranged. This requires absolute convergence (i.e., the random variable must be integrable in the \(L^1\) sense). Since the absolute expectation \(\mathbb{E}[|X|] = \infty\) here, the payoff is not \(L^1\)-integrable, and the expectation is undefined.

  2. **Inconsistencies under rearrangement**: Your analogy to evaluating integrals via symmetric limits (like the Cauchy principal value) is apt for certain contexts, such as physics or engineering, where conditional convergence can be handled with a preferred order. However, in probability and decision theory, allowing such conditionally convergent expectations leads to inconsistencies. For example:
     - If we permute the outcomes (e.g., by swapping the labels for \(n=1\) and \(n=2\)), the distribution of the payoff remains identical, but the expectation computed in the new natural order can change (e.g., to \(-1 + \ln 2 \approx -0.307\) instead of \(\ln 2\)).
     - Grouping outcomes differently (e.g., conditioning on whether the first head occurs on an odd or even toss) can yield divergent expectations (e.g., \(\infty\) for odd tosses, \(-\infty\) for even tosses), making the overall expectation indeterminate.
     These inconsistencies violate the principle that identically distributed random variables should have the same expectation.

  3. **Decision-theoretic implications**: In decision theory, expected utility theory relies on a well-defined expectation to guide rational choices. If the expectation depends on the summation order, one could manipulate preferences arbitrarily:
     - For instance, by rearranging terms, a decision-maker could justify paying any price for the gamble, leading to incoherent decisions (e.g., Dutch books where a sequence of bets results in a sure loss).
     - The natural order might seem privileged in this specific game, but for general random variables, there may be no natural order, reinforcing the need for an absolute convergence criterion to ensure robustness.

  4. **Why the privilege of absolute convergence?**: The insistence on absolute convergence stems from the desire for a consistent, unambiguous mathematical framework that aligns with the measure-theoretic foundations of probability. Here, expectation is defined via the Lebesgue integral, which requires absolute integrability for its standard properties (e.g., linearity and invariance). While your field (synchrotron beam diagnostics) might use principal values or symmetric limits as computational tools, these are not equivalent to the Lebesgue integral and do not provide a general definition for expectation.

  In summary, the received verdict arises because a principled definition of expected value must be invariant under rearrangement to depend solely on the distribution. The conditional convergence in the Pasadena game violates this, making its expectation undefined. While the natural order summation to \(\ln 2\) is meaningful in specific contexts, it is not a valid expected value in probability theory. For further reading, consider works by Hájek and Nover (2004) on the Pasadena paradox or treatments of infinite expectations in decision theory.
