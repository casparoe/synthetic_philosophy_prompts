  But consider a different example: the well-known "two generals" problem or a more complex state space. A standard example for disagreement without common knowledge is the following:

  State space: {1,2,3,4} with uniform prior.
  Event A: state 1 or 2.
  Agent 1's partition: {1,2}, {3,4}.
  Agent 2's partition: {1,2,3}, {4}.

  At state 1:
  - Agent 1: P(A | {1,2}) = 1 (since A is exactly {1,2} in that cell).
  - Agent 2: P(A | {1,2,3}) = 2/3.

  Now, if they announce:
  Agent 1 says: 1.
