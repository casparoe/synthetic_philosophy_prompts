answer: |-
  ## Joint Statement: Nyāya-Buddhist Epistemology Adversarial Collaboration  
  *Chaired by an epistemologist fluent in both traditions*

  **Preamble:**  
  After sustained dialogue, we identify substantial convergence on the architecture of knowledge (*pramā*), while acknowledging persistent divergences on the reducibility of specific means (*pramāṇa*). We affirm shared commitments to avoiding both skepticism and dogmatism, and to the project of mapping reliable cognitive pathways.

  ### 1. Agreed Substantive Claims:
  1.  **Source-Individuation:** A cognition (*jñāna*) qualifies as knowledge (*pramā*) only if generated by a specific, valid causal source (*pramāṇa*), not merely by being true.
  2.  **Novelty & Non-Deviance (*avyabhicāritva*):** A *pramāṇa* must produce a cognition that is both *new* (not memory-reliant at the moment of generation) and *non-deviant* (incapable of leading to error under the conditions of its arising).
  3.  **Exclusion of Memory & Doubt:** Neither memory (*smṛti*) nor doubt (*saṃśaya*) constitutes an independent *pramāṇa*. Memory presupposes prior *pramāṇa*, and doubt is intrinsically non-determinative.
  4.  **Pragmatic Success Criterion:** Unhesitating successful action (*pravṛtti-sāmarthya*) is a reliable, outward mark (*liṅga*) of genuine knowledge, though not its definition.
  5.  **Certification Regress Problem:** The validity of the *pramāṇas* themselves cannot be established solely by circular appeal to their own outputs (*svataḥ prāmāṇya*) nor by infinite regress. A foundational, non-inferential element must be acknowledged (e.g., intrinsic validity under specific conditions, ultimate appeal to practice).
  6.  **Causal Efficacy as Core:** Causal relations (*kārya-kāraṇa-bhāva*, *arthakriyā*) play a fundamental role in grounding reliable knowledge, particularly for perception and inference concerning empirical objects.

  ### 2. Disagreements Table:
  | Point of Disagreement                                     | Naiyāyika (Party A) Position (as accepted by A)                                                                                                                                 | Buddhist (Party B) Position (as accepted by B)                                                                                                                                                               |
  | :-------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Testimony (Śabda)**                                  | Constitutes a *sui generis pramāṇa*: understanding meaning arises directly from competent utterance *qua* linguistic sign, irreducible to inference about the speaker's mind. | Reduces entirely to inference (*anumāna*): understanding meaning involves inferring the speaker's *intention to convey reliable information*, based on perception of words and background knowledge of reliability. |
  | **2. Comparison (Upamāna)**                               | Constitutes a *sui generis pramāṇa*: generates novel knowledge of a thing's name/relation via similarity to a known thing (e.g., learning "gavaya" from similarity to cow).     | Reduces to inference, testimony, or perception-memory-recognition: knowledge of similarity is inferential (based on perceived properties) or testimonial (if name is given), and recognition is memory-dependent. |
  | **3. Grounding of Pervasion (Vyāpti)**                    | Universal concomitance (*vyāpti*) grounding inference can be known through observation (*bhūyodarśana*) & analytical reasoning (*tarka*), *independent* of strict causal efficacy. | Pervasion (*vyāpti*) is *necessarily* grounded in causal relations (*tādātmya/tadutpatti*) or essential identity/difference. Non-causal universals are conceptual fictions (*apoha*); inference tracks causal power. |
  | **4. Scope of Inference**                                 | Inference *can* validly reach entities lacking causal efficacy (*arthakriyā-śūnya*) like universals (*sāmānya*), a permanent Self (*ātman*), or God (*īśvara*).                  | Inference *cannot* validly reach non-causal entities. Claims about universals, a permanent Self, or God are conceptual constructions (*kalpanā*) without real referents; only causally efficacious particulars exist. |
  | **5. Conceptual Structuring in Perception**               | Determinate perception (*savikalpaka pratyakṣa*) involves conceptual structuring (*vikalpa*) and is a valid form of perceptual knowledge.                                     | True perception (*nirvikalpaka pratyakṣa*) is strictly non-conceptual. "Perception" involving concepts is actually a hybrid involving inference/memory; concepts are superimposed (*adhyāsa*).                  |

  ### 3. Cruxes & Test Cases:
  1.  **Crux: Does Upamāna Generate *Novel* Knowledge Irreducible to Testimony/Inference?**  
      *   **Test Case (Wild Ox - Gavaya):** A forester tells a townsman unfamiliar with *gavayas* (wild oxen): "A *gavaya* is like a cow." Later, the townsman sees a *gavaya* in the forest and correctly identifies it *as* a *gavaya* based on similarity.  
      *   **Party A (Naiyāyika) Prediction:** This identification constitutes genuinely *novel* knowledge ("*This* is a gavaya") generated solely by *upamāna* (the similarity relation). Testimony provided the *description*, not the identification of *this* particular. Inference isn't involved as there's no explicit recollection of the universal "gavaya" or deduction.  
      *   **Party B (Buddhist) Prediction:** The identification reduces to testimony (the forester's description) plus perceptual recognition (*pratyabhijñāna*), which is memory-dependent. The similarity judgment itself is either remembered testimony or a swift inference based on perceived properties matching the description. No new *pramāṇa* is needed.

  2.  **Crux: Can Testimony Generate Understanding Without an Inference to Speaker Reliability?**  
      *   **Test Case (The Reliable Stranger):** A stranger, manifestly competent and earnest, tells you "There is clean water in this well." You have no prior knowledge of this person. You immediately understand the meaning and act accordingly.  
      *   **Party A (Naiyāyika) Prediction:** Understanding the *meaning* ("water in well") arises directly and non-inferentially from hearing the competent utterance (*śabda*). Trust may *support* the act of relying on it but is not a *constituent* of understanding the proposition.  
      *   **Party B (Buddhist) Prediction:** Understanding *necessarily* involves an instantaneous inference: "This speaker appears competent/earnest; competent/earnest speakers usually speak truthfully when making such statements; therefore, it is reliable that there is water in the well." The inference is triggered by perception of the speaker's demeanor and utterance.

  3.  **Crux: Can Pervasion Be Known Without Appealing to Causal Efficacy?**  
      *   **Test Case: Pervasion in Absence (e.g., Sound's Impermanence):** Establishing the universal concomitance (*vyāpti*) "Whatever is produced is impermanent" (to infer sound's impermanence from its being produced).  
      *   **Party A (Naiyāyika) Prediction:** *Vyāpti* is established via observation (*bhūyodarśana*) of co-presence/co-absence in numerous instances (pots, cloths) *plus* the absence of counterexamples (*upādhi-nirāsa*) via analytical reasoning (*tarka*: "If something produced *were* permanent, contradictions would arise"). Causal efficacy (*arthakriyā*) is *one* aspect but not *necessary* for the logical relation.  
      *   **Party B (Buddhist) Prediction:** *Vyāpti* is *only* knowable because "produced" (*kṛtaka*) intrinsically implies causal dependence, and causal dependence (*pratītyasamutpāda*) intrinsically implies impermanence. Observation (*bhūyodarśana*) provides the basis, but the necessity stems from the causal nature (*svabhāva*) of production itself. Non-causal universals cannot support necessary relations.

  **Assessment of Merely Verbal Elements:**  
  We judge portions of the dispute concerning the **definitional scope of "Perception"** (*pratyakṣa*) to be potentially verbal, *if* the following holds true:  

  1.  **Shared Cognitive Mechanism:** Both sides agree on the underlying cognitive process involved in sensory contact leading to immediate awareness.  
  2.  **Shared Rejection of Pure Sensation as Knowledge:** Both sides agree that the raw, non-conceptual sensory given (if such exists) is not *itself* a cognition qualifying as *pramā* (knowledge) – it is merely a necessary condition.  
  3.  **Shared Recognition of Conceptual Activity:** Both sides agree that determinate awareness of an object *as* something (e.g., "this is water") involves conceptual synthesis.  

  *   **Verbal Scenario:** If the Naiyāyika labels the *entire process* (from sense-contact to "this is water") as "perception" (*savikalpaka*), while the Buddhist *reserves* "perception" (*nirvikalpaka*) for the initial non-conceptual moment *and* labels the subsequent conceptual synthesis as "inference-like," then the disagreement hinges primarily on *where to draw the terminological line* within a largely agreed-upon cognitive sequence. The dispute would be about the *label* "perception" applied to different stages of a complex process, not about the fundamental nature of the stages themselves.  

  *   **Non-Verbal Core:** However, this judgment *fails* if the disagreement runs deeper: if the Buddhist denies *any* non-conceptual given plays a *justificatory role* in the conceptualized cognition, or if the Naiyāyika insists conceptual structuring is *intrinsic* to the sensory modality itself rather than a distinct cognitive operation. The metaphysical commitments (e.g., Buddhist nominalism vs. Nyāya realism about universals) underlying the conceptual/non-conceptual distinction also render this more than merely verbal.  

  **Conclusion:**  
  This statement reflects significant progress in mutual understanding. While core disagreements on reducibility and metaphysics remain, the agreed claims provide a robust framework, and the clarified cruxes offer concrete paths for further collaborative investigation. The potential verbal element regarding perception warrants careful terminological negotiation in future dialogue.
