prompt: |-
  Since last autumn I have been convening an evening bioethics seminar for clinical staff at the hospital where I work as a pharmacist — eighteen people, mostly ward nurses and pharmacy technicians, three residents, two social workers. We meet for seventy-five minutes every other Wednesday. Nobody reads anything in advance, and I want the session I am planning to stay that way: I am after a runnable activity, not a literature tour, so please do not close with a reading list or a set of references.

  I took on this term's topic for reasons I have not fully disclosed to the group. My daughter, who is nine, was assessed last year and is now on a stimulant for ADHD; separately, our paediatrician has raised the possibility that she is short enough to be considered for growth hormone, which American regulators have permitted since 2003 for children whose only finding is that they are extremely short. My spouse and I have spent four months arguing about whether the first decision and the second are the same kind of decision, and I cannot make the argument rest on anything I am satisfied with. I would like my group to run into that problem themselves rather than hear me describe it.

  Design a seventy-five-minute, eighteen-participant structured deliberation in which people discover that the therapy/enhancement distinction — or, more precisely, the criterion they themselves wrote for it — does not survive contact with the cases it was written to handle. Requirements:

  1. The deciding body must not be an insurer, a hospital formulary, or a public payer. My group will otherwise replay their day jobs and reach for coverage rules they already know. Give me a fictional allocating institution whose structure makes those reflexes useless.
  2. In round one the group writes its own one-sentence decision rule, in its own words, and posts it. Subsequent rounds apply it mechanically to case cards. Revision must be permitted but must cost something concrete and visible — retroactive reversal of an earlier approval, forfeiture of tokens, loss of standing with the constituency they represent — so that the ratchet they feel is real rather than rhetorical.
  3. Build in two flips. First, a card whose classification changes once the group is told the population prevalence of the trait it addresses, so that a statistical conception of normal function turns an enhancement into a restoration or vice versa. Second, a card that is unambiguously restorative against a species-typical baseline, but where the baseline has drifted, so that nearly everyone now sits below it. Withhold the prevalence information until the rule has already been applied.
  4. Include one card drawn from my own family's situation, anonymised: the group classifies a stimulant prescription for a nine-year-old with a confirmed diagnosis without knowing whose child it is, and I reveal it in the debrief. Tell me how likely they are to guess, and what I should do if somebody does mid-round.
  5. Give each participant a private stakeholder role carrying one concealed interest, so that how a card gets classified tracks who stands to benefit. The debrief should surface this without my accusing anyone of bias.
  6. No real money: specify a token or point scheme whose quantities make the scarcity bite in the third round.

  Deliverables: a materials list I can produce on a hospital copier; a minute-by-minute timeline; the exact wording of the round-one instruction and of at least three cards, including both flips; the scoring scheme; a debrief that maps named moments in the play onto the statistical account of normal function, the quality-of-life account, and the objection that enhancement expresses a refusal to treat our endowment as given — described, not cited; the three things that will predictably go wrong with this particular group (I expect a resident to relitigate the clinical evidence, a nurse to raise who decides for a child, and someone to import reimbursement logic from the wards) and how to handle each; and a frank statement of which feature of the debate the activity cannot reproduce and which I will therefore have to supply by hand.
reasoning: |-
  We are designing a 75-minute structured deliberation activity for 18 participants. The goal is for the group to discover that the therapy/enhancement distinction they create does not hold up when applied to specific cases, especially when additional information (like prevalence) is revealed.

  ### Materials List (for hospital copier)
  1. **Role Cards (18)**: Each card assigns a stakeholder role and a hidden interest. (Print on cardstock if possible, else paper.)
  2. **Case Cards (8-10)**: Each card describes a medical intervention scenario. Include:
     - Card A: ADHD stimulant for a 9-year-old (anonymized version of your daughter's case)
     - Card B: Growth hormone for idiopathic short stature (the second flip: initially seems restorative but prevalence reveals it's common)
     - Card C: A case that flips with prevalence information (e.g., myopia correction in a population where it becomes very common, turning an enhancement into a restoration when prevalence is high)
     - Other cards: e.g., cochlear implants for deaf child, prophylactic mastectomy for BRCA+, cognitive enhancer for healthy adult, vaccine for a rare infectious disease, etc.
  3. **Decision Rule Worksheet**: A large poster paper or flip chart for the group to write their one-sentence rule.
  4. **Voting Tokens (or Point Sheets)**: Each participant gets 5 tokens (or 5 points on a sheet) to use for revisions. (Tokens can be paper slips or use a central tally on a board.)
  5. **Timer**: To keep track of time.
  6. **Sticky Notes or Small Cards**: For participants to cast votes on case classifications (therapy or enhancement) in each round.

  ### Timeline (75 minutes total)

  #### 0-5 min: Introduction and Setup (5 min)
  - Explain the activity: "We are a fictional Allocation Committee for the 'Human Flourishing Fund' (HFF), which distributes resources for medical interventions. Our job is to decide which interventions are 'therapy' (restoring normal function) and which are 'enhancement' (improving beyond normal). HFF only funds therapy. We will write a rule, apply it to cases, and then adjust as needed."
  - Assign roles: Hand out role cards randomly. Each card has a stakeholder role (e.g., parent of a child with a disability, school administrator, taxpayer, athlete, aging adult, etc.) and a hidden interest (e.g., "You benefit when interventions for children are classified as therapy").
  - Explain tokens: Each person starts with 5 tokens. These can be spent to request a rule revision. When the rule is revised, the group must also reverse one prior case decision (which costs tokens to the proposer and possibly others).

  #### 5-15 min: Rule Creation (10 min)
  - Instruction: "As a group, draft a one-sentence rule that distinguishes therapy from enhancement. Write it on the poster. The rule must be clear enough to apply to specific cases. You have 10 minutes."
  - Facilitator (you) writes the rule as they dictate it. Encourage consensus.

  #### 15-40 min: Round 1 - Case Application (25 min)
  - Present Case Cards one by one (about 5 cases in this round, including the ADHD card but not the two flips yet). For each case:
    - Read the case aloud.
    - Participants vote privately (using sticky notes) as "Therapy" or "Enhancement" based on the rule.
    - Tally and announce the vote. Record the decision on a board.
    - **ADHD Card (included in Round 1):** "A 9-year-old child with a confirmed diagnosis of ADHD is prescribed a stimulant medication to improve attention and reduce impulsivity." (Do not reveal it's your child.)

  #### 40-55 min: Round 2 - The Flips (15 min)
  - Present the two flip cases, withholding prevalence initially.
    - **First Flip Case (e.g., Myopia):** "A 10-year-old child with moderate myopia (nearsightedness) is prescribed corrective lenses to achieve 20/20 vision." Group votes. Then reveal: "In this child's population, 80% of children have myopia by age 10." Re-vote if rule allows, or note the conflict.
    - **Second Flip Case (Growth Hormone):** "A 10-year-old child is considered for growth hormone treatment. The child is healthy but is at the 1st percentile for height (extremely short) with no underlying medical condition." Group votes. Then reveal: "In the current generation, the average height has increased so much that 30% of children are now below the old 5th percentile. Without treatment, this child would be among the shortest 1% in their peer group." Re-vote.
  - Allow token spending for rule revisions if the group wants to change the rule to accommodate the new information. Each revision requires:
    - Spending 2 tokens by the proposer (to propose a revision).
    - Group approval by majority vote.
    - Reversal of one prior case decision (which might require token expenditure from those who want to reverse? Or just the group decision is reversed without individual cost? We'll say: the reversal is a group decision, but the proposer must pay 2 tokens and the group must agree to the reversal. Alternatively, we can have a system where reversing a case costs 1 token per participant who wants to reverse, but that's complex. Let's simplify: the proposer spends 2 tokens to propose a revision and a reversal. The group votes on the revision and the reversal. If both pass, the rule is changed and the case is reversed.)

  #### 55-65 min: Round 3 - Scarcity Bites (10 min)
  - Introduce scarcity: "The HFF budget has been cut. We can only fund 3 of the last 5 cases we approved. Each of you has 5 tokens. You can use your tokens to 'bid' to protect a case from being defunded. The top 3 cases with the most total tokens spent to protect them remain funded. You can also use tokens to try to reverse a case decision (if you think it was misclassified) but that requires a rule revision and is costly (as above)."
  - Participants spend tokens to protect cases. They can also form coalitions. Tally and announce which cases are defunded.

  #### 65-75 min: Debrief (10 min)
  - Reveal that the ADHD case was your daughter's. Ask: "How did knowing it was my child change your perception? Did it feel different?" (But note: if someone guessed mid-round, see below.)
  - Surface hidden interests: "Look at your role cards. How did your hidden interest influence your votes? Without naming names, what kinds of interests were at play?"
  - Map the moments:
    - **Statistical normal function:** "When we learned that myopia was 80% prevalent, did that change what 'normal' meant? How about when we learned that height percentiles had shifted?"
    - **Quality of life account:** "Did we consider whether an intervention improved quality of life regardless of prevalence? How did that factor in?"
    - **Endowment objection:** "Did we feel that enhancing beyond normal was a rejection of the given? How did that play out in the growth hormone case?"
  - Conclude: "We set out to draw a line, but did the line hold? What does that say about therapy vs. enhancement?"

  ### Exact Wording

  #### Round One Instruction
  "Your task is to create a one-sentence rule that distinguishes between therapy (which restores normal function) and enhancement (which improves function beyond normal). The Human Flourishing Fund (HFF) will only fund therapy. Write your rule below. You have 10 minutes."

  #### Case Cards (at least three)

  1. **ADHD Card (Round 1):** 
     "A 9-year-old child has been diagnosed with Attention Deficit Hyperactivity Disorder (ADHD) by a pediatric specialist. The child struggles with focusing in school and has behavioral issues. A stimulant medication is prescribed to help the child concentrate and control impulses."

  2. **First Flip (Myopia - Round 2):** 
     "A 10-year-old child has moderate nearsightedness (myopia) and cannot see the whiteboard from the back of the classroom. Without glasses, the child's vision is 20/100. Corrective lenses would bring the child's vision to 20/20."
     *Prevalence reveal:* "In this child's school district, 80% of children have myopia by age 10. Without correction, most children would have impaired vision."

  3. **Second Flip (Growth Hormone - Round 2):** 
     "A 10-year-old child is healthy but is at the 1st percentile for height (meaning 99% of children are taller). The child's parents are of average height, and there is no medical cause for the short stature. Growth hormone treatment is proposed to increase the child's adult height."
     *Prevalence reveal:* "Due to improvements in nutrition and health, the current generation of children is taller on average. The old 5th percentile for height now includes 30% of children. Without treatment, this child would be among the shortest 1% in their peer group."

  ### Scoring Scheme (Token System)
  - Each participant starts with 5 tokens.
  - To propose a rule revision: The proposer spends 2 tokens. The group then votes on the revision (majority needed). If the revision passes, the group must also choose one prior case decision to reverse (by majority vote). There is no token cost for the reversal vote, but the proposer has already spent 2 tokens.
  - In Round 3 (scarcity): Participants can spend tokens to protect a case from being defunded. Each token spent on a case is a vote to keep it funded. The top 3 cases with the most tokens are funded. Tokens spent here are gone.

  ### Debrief Mapping
  - **Statistical normal function:** Point out the myopia and growth hormone cases. "When we learned myopia was common, did we start thinking of it as normal? Did that make glasses therapy? And when we learned that height percentiles had shifted, did that change whether short stature was a disorder? This shows that 'normal' is statistical and changes over time."
  - **Quality of life account:** "In the ADHD case, even if we didn't know prevalence, we might have focused on how much the medication improved the child's life. But did our rule account for that? Or was it only about statistical normalcy?"
  - **Endowment objection:** "In the growth hormone case, did we feel that giving hormone to a healthy child was an enhancement that rejected the child's natural height? How did that conflict with wanting to help the child avoid being extremely short?"

  ### Predictable Problems and Handling

  1. **Resident relitigating clinical evidence:** 
     - Problem: A resident might argue about the validity of the diagnosis or treatment efficacy.
     - Handling: Remind them: "In this activity, we are not evaluating the medical evidence. The cases are given as stated. Our role is to apply the rule we created."

  2. **Nurse raising who decides for a child:**
     - Problem: A nurse might question the ethics of parents making decisions for children.
     - Handling: Acknowledge: "That's an important issue, but today we are focusing on whether the intervention is therapy or enhancement. We are assuming the decision-maker is appropriate."

  3. **Someone importing reimbursement logic:**
     - Problem: A participant might say, "But in real life, insurance would cover this if..."
     - Handling: Redirect: "Remember, the Human Flourishing Fund is not an insurer. Our rule is about therapy vs. enhancement, not cost or coverage. We are creating our own rule."

  ### What the Activity Cannot Reproduce
  - **Feature missing:** The activity cannot reproduce the deep emotional and personal stakes of real-life decisions (like deciding for your own child). The tokens are abstract, and the roles are fictional. The debrief will touch on this when you reveal your personal connection, but the participants won't have the same emotional weight as in real life.
  - **What you must supply by hand:** In the debrief, you must explicitly connect the activity to the personal and moral weight of these decisions. You can say: "In real life, when it's your child, the lines we drew today might feel very different. The abstract becomes concrete, and the stakes are not tokens but a child's future. That's why this distinction matters so much personally."

  ### Likelihood of Guessing and Handling Mid-Round
  - **Likelihood of guessing:** Low, because the case is anonymized and you are one of 18 participants. However, if you are known to have a child around that age and have mentioned ADHD, someone might suspect.
  - **If someone guesses mid-round:** If a participant says, "Is this your daughter?" during the session, respond: "I won't answer that until the debrief because I don't want it to influence the discussion. Let's treat it as a hypothetical case for now." Then move on.

  This design should meet all your requirements and create the discovery experience you want.
answer: |-
  ### Structured Deliberation Activity: "The Therapy-Enhancement Boundary"  
  **Goal:** Participants discover through case application that their self-created therapy/enhancement distinction fails when confronted with prevalence data, shifting baselines, and stakeholder biases.  

  ---

  ### **Materials List** (produced on hospital copier)  
  1. **18 Role Cards**: Each assigns a fictional stakeholder role + hidden interest (concealed until debrief).  
  2. **Case Cards (6 total)**: Printed scenarios for classification. Includes:  
     - Card 1: ADHD stimulant (your anonymized case)  
     - Card 2: Growth hormone for idiopathic short stature (flip #1: prevalence reveal)  
     - Card 3: Myopia correction (flip #2: baseline drift)  
     - Card 4: Prophylactic mastectomy (BRCA1+)  
     - Card 5: Cognitive enhancer for exam-taking  
     - Card 6: Antibiotic for asymptomatic UTI in pregnancy  
  3. **Decision Rule Poster**: Large sheet for writing the group’s one-sentence rule.  
  4. **Voting Tokens**: 5 tokens per participant (paper clips or printed cardstock circles).  
  5. **Outcome Board**: Tracks case approvals/rejections and token deductions.  
  6. **Timer**: For strict timekeeping.  

  ---

  ### **Minute-by-Minute Timeline**  
  **Total: 75 minutes**  

  #### **0–10 min: Setup & Rule Creation**  
  - **0–3 min**: Introduce the fictional **Human Flourishing Commission (HFC)**. *"The HFC funds interventions only for 'therapy' (restoring normal function), not 'enhancement' (improving beyond normal). You represent stakeholder groups advising the HFC. Today, you will write a rule to distinguish the two, then apply it to real cases."*  
  - **3–10 min**: Rule drafting. *"As a group, draft one sentence defining the therapy/enhancement boundary for the HFC. Use your own words. Once written, it cannot be amended without cost."*  
    - *Output:* Rule written on poster (e.g., *"Therapy fixes a medically diagnosed dysfunction; enhancement improves function beyond what is typical for a healthy person."*).  

  #### **10–35 min: Round 1 – Apply Rule to Cases**  
  - **10–15 min**: Distribute **Role Cards** (e.g., *"Parent of child with learning disability" + hidden interest: "You benefit when childhood interventions are classified as therapy"*). Participants keep interests secret.  
  - **15–35 min**: Present **Case Cards 1, 4, and 5** one by one. For each:  
    1. Read card aloud.  
    2. Silent vote: Participants drop tokens into "Therapy" (approve) or "Enhancement" (reject) boxes.  
    3. Tally votes and post outcome.  
    - *Include your case:* **Card 1 (ADHD)**: *"A healthy 9-year-old with confirmed ADHD struggles in school. A stimulant medication is prescribed to improve attention and reduce disruptive behavior."*  

  #### **35–50 min: Round 2 – The Flips & Revision Cost**  
  - **35–40 min**: Present **Card 2 (growth hormone)**: *"A healthy 8-year-old is at the 1st percentile for height. Growth hormone is proposed to increase adult height."*  
    - Vote → Outcome posted.  
    - **Reveal prevalence**: *"In the U.S., 3% of children are this short. Medical guidelines define 'extreme shortness' as <1st percentile."* Re-vote.  
  - **40–45 min**: Present **Card 3 (myopia)**: *"A 12-year-old with mild myopia (nearsightedness) cannot see whiteboards. Corrective lenses are prescribed."*  
    - Vote → Outcome posted.  
    - **Reveal baseline drift**: *"100 years ago, 20% had myopia; today, 80% do. Lenses now restore to the new average, not the historical norm."* Re-vote.  
  - **45–50 min**: Allow **rule revisions**: Any participant can propose a revision but must:  
    - Spend 2 tokens.  
    - Choose one prior approval to retroactively reverse (e.g., if revising to accommodate growth hormone, reverse Card 1).  
    - Group majority vote required.  

  #### **50–65 min: Round 3 – Scarcity & Stakeholder Biases**  
  - **50–55 min**: Introduce scarcity: *"HFC’s budget is cut. Only 2 interventions can be funded. You must bid tokens to ‘save’ approved cases. Highest token bids win."*  
  - **55–65 min**: Participants secretly bid tokens to protect cases. Tally bids. Cases with the lowest bids are "defunded."  
    - *Scarcity bite:* With 18 participants and 5 tokens each, bidding 1–2 tokens has low impact; saving a case requires high bids (e.g., 4+ tokens), forcing trade-offs.  

  #### **65–75 min: Debrief**  
  - **65–68 min**: Reveal **Card 1 as your personal case**. Ask: *"How did classifying this feel before vs. after knowing it was mine? Did the rule capture your intent?"*  
  - **68–72 min**: Surface biases: *"Check your role card’s hidden interest. Did it unconsciously sway your votes? Share one word describing your interest (e.g., ‘access,’ ‘cost’)."*  
  - **72–75 min**: Map key moments to concepts:  
    - **Statistical normality (growth hormone flip)**: *"When you learned 3% of kids are this short, did ‘normal’ shift? Did therapy become enhancement?"*  
    - **Quality of life (myopia flip)**: *"When 80% have myopia, lenses improve QoL for ‘typical’ function. Is that therapy or enhancement?"*  
    - **Endowment objection**: *"In growth hormone, did funding it feel like rejecting the child’s ‘given’ body? How did scarcity change that?"*  
  - Close: *"Did your rule hold up? What does this say about real-world boundaries?"*  

  ---

  ### **Key Components**  
  #### **Fictional Allocating Institution**  
  **Human Flourishing Commission (HFC)**  
  - *Structure:* Funds interventions globally (not tied to insurance/payers). Decisions are based solely on "therapy vs. enhancement," not cost, efficacy, or eligibility.  
  - *Why it disrupts reflexes:* No coverage rules apply; stakeholders represent societal roles (e.g., "teacher," "elderly advocate"), not hospital roles.  

  #### **Round-One Instruction**  
  *"Draft one sentence defining the boundary between therapy (which the HFC funds) and enhancement (which it rejects). Therapy must restore normal function; enhancement must improve beyond normal. Use plain language. You have 7 minutes."*  

  #### **Case Cards (Exact Wording)**  
  1. **Card 1 (ADHD)**: *"A healthy 9-year-old with physician-confirmed ADHD struggles academically and socially. A stimulant medication is prescribed to improve attention and reduce impulsivity."*  
  2. **Card 2 (Growth hormone – prevalence flip)**: *"A healthy 8-year-old is at the 1st percentile for height with no underlying illness. Growth hormone is proposed to increase adult height by 3–4 inches."*  
     - *Prevalence reveal:* *"In the U.S., 3% of children are at or below the 1st percentile for height."*  
  3. **Card 3 (Myopia – baseline drift)**: *"A 12-year-old has mild myopia (nearsightedness) and cannot see classroom boards. Corrective lenses are prescribed to restore vision to 20/20."*  
     - *Baseline drift reveal:* *"A century ago, 20% of people had myopia; today, 80% do. 20/20 vision is now ‘average,’ not ‘historically typical.’"*  

  #### **Token Scheme**  
  - Each participant starts with **5 tokens**.  
  - **Costs**:  
    - Rule revision: 2 tokens (spent by proposer).  
    - Bid to save a case in scarcity round: Any number (tokens lost after bidding).  
  - **Scarcity mechanism**: In Round 3, only 2/6 cases can be "saved." Low bids (e.g., 1 token) rarely win, forcing high-stakes spending.  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Resident relitigates clinical evidence**:  
     - *Likely move:* Argues ADHD diagnosis validity or growth hormone efficacy.  
     - *Solution:* *"The HFC accepts all diagnoses as stated. Focus on applying the rule, not rehashing evidence."*  

  2. **Nurse raises "who decides for a child?"**:  
     - *Likely move:* Questions parental authority in ADHD/growth hormone cases.  
     - *Solution:* *"The HFC assumes decisions are made by guardians. We’re judging the intervention, not the decision-maker."*  

  3. **Someone imports reimbursement logic**:  
     - *Likely move:* Suggests cost-effectiveness or insurance precedents.  
     - *Solution:* *"The HFC doesn’t consider cost. Your role is societal (e.g., ‘taxpayer’), not institutional. Use your tokens, not real-world rules."*  

  ---

  ### **What the Activity Cannot Reproduce**  
  - **Missing feature**: The **emotional weight of personal stakes**. The token cost simulates trade-offs but cannot replicate the lived anxiety of deciding for one’s child.  
  - **What you must supply**: In the debrief, explicitly connect the game’s abstractions to real-life vulnerability. Say: *"Tokens represent limited resources, but in reality, this is about loving a child through uncertainty. The rule’s collapse mirrors how abstract lines blur when faced with a human story."*  

  ### **Handling Mid-Round Guesses About Your Case**  
  - **Likelihood of guessing**: Low (<10%). Cards are anonymized, and your role is facilitator, not participant.  
  - **If someone asks**: *"Is this your child?"*  
    - Respond: *"I’ll share personal connections in the debrief. For now, treat all cases as hypothetical to avoid bias."*  
    - If pressed: *"The point is to test the rule fairly. Let’s proceed."*  

  ---  
  This design forces participants to confront the fragility of their distinctions through mechanical rule application, flips, and stakeholder pressures. The debrief links gameplay to bioethical concepts without citations, fulfilling your goal of discovery over lecture.
