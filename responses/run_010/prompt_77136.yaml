answer: |-
  ### 1. Candidate Criteria and Their Consistency with Verdicts  
  **Surviving criteria:**  
  - **Causal Use in Behavior (CUB)**: The feature must play a causal role in generating *robust* task performance. *Qualification:* Robustness requires invariance under counterfactual variations (e.g., Case 4’s scrub test). *Cost:* Accepts features that are not decodable (Cases 2–4) but excludes those relying on spurious correlates (Case 1).  
  - **Systematic Integration (SI)**: The feature must combine inferentially with other system capacities. *Qualification:* SI is necessary only when the task *demands* composition (Case 5 vs. Case 3). *Cost:* Admits "isolated" features (Case 3) but rejects non-composable ones (Case 5).  
  - **Counterfactual Tracking (CT)**: The feature must support correct judgments under *non-actual* scenarios. *Qualification:* CT must be demonstrable via behavioral outputs (e.g., Case 4’s scrub test, Case 5’s paraphrase failure). *Cost:* Rejects features that covary accidentally (Case 1) but requires explicit tests.  

  **Rejected criteria:**  
  - *Decodability*: Inconsistent with Cases 2–4 (probes fail).  
  - *Charitable Interpretive Fit*: Inconsistent with Case 6 (intentional gloss rejected).  
  - *Reportability*: Explicitly overruled in Cases 2–3.  

  **Consistent combination:** **CUB + SI + CT** explains all verdicts:  
  - Case 1: Fails CUB/CT (not robust).  
  - Case 2: Passes CUB/CT (behaviorally robust).  
  - Case 3: Passes CUB/CT (causal & robust) but exempt from SI (no composition required).  
  - Case 4: Passes CUB/CT (counterfactually robust).  
  - Case 5: Fails SI (non-composable).  
  - Case 6: Fails CUB (no causal role, only gloss).  

  ---

  ### 2. Pressure Between Cases 3 and 5  
  Case 3 (sarcasm) accepts an isolated feature; Case 5 (numbers) rejects one. A defender of **SI as necessary** must distinguish:  
  - **Compositional demand**: Case 3’s task (sentiment labeling) does not require combining sarcasm with *other* concepts (e.g., genre is handled implicitly). Case 5’s task (reading comprehension) *inherently* requires combining numerical facts (e.g., "same number" implies transitive inference).  
  - **Failure consequence**: Case 5’s inability to integrate is a *functional* failure; Case 3’s non-reportability is an *access* limitation.  
  **Distinction**: SI is necessary only when the system’s *task or architecture* necessitates compositional use. Case 3 avoids this by design; Case 5 fails it essentially.  

  ---

  ### 3. Verdict Prediction for New Case  
  **Prediction**: **NO** (≈85% confidence).  
  - **Hardest precedent**: Case 5 (reading comprehension). Both fail systematic integration despite robust single-property judgments (New: cavitation + impeller risk; Case 5: number + transitive inference).  
  - **Precedent to distinguish**: Case 4 (lesion detector). Though both robust (New: survives resensoring; Case 4: survives scrubbing), Case 4 lacks a *compositional demand*, while the new case *fails* when composition is required.  

  ---

  ### 4. Panel Recommendation for Consistency  
  - **Closest analog**: Case 5 (systematic integration failure).  
  - **Underdetermination?** No: Case 5’s minute ("cannot be brought to bear") directly governs.  
  - **Ruling NO** adopts: *SI is necessary when the model’s behavior implies compositional demands*. This is livable (avoids inflating "concept" to include lookup tables).  
  - **Ruling YES** adopts: *Robust CUB alone suffices, ignoring compositional failure*. This undermines Case 5 and creates inconsistency.  
  **Recommendation**: Vote **NO** to preserve coherence.  

  ---

  ### 5. Diagnostic Case Design  
  **Case**: A model trained to judge *relative wealth* from text biographies:  
  - (a) Correctly answers "Who is richer?" for pairs.  
  - (b) Robust to paraphrased names/occupations.  
  - (c) Correctly answers "Did X donate more than Y?" in isolation.  
  - (d) *Fails* when asked: "If X is richer than Y, and Y donated more than Z, did X donate more than Z?" (despite answering sub-queries).  
  - (e) Fails all wealth questions if "richer" head ablated.  

  **Falsification**:  
  - If **composition failure** (Case 5 reading): Verdict NO (fails SI).  
  - If **paraphrase fragility** concern: Verdict YES (robust paraphrases in (b)).  
  - *Falsifying each*: A YES verdict falsifies the "fragility" reading of Case 5; a NO verdict falsifies a "mere paraphrase" concern.  

  ---

  ### 6. Conceptions of Content and Stability  
  **For each surviving criterion**:  
  - **CUB**: Content as *causal-informational role*. Concept possession is independent of scoring (grounded in robustness).  
  - **CT**: Content as *counterfactual-supporting function*. Independent (tracking is objective).  
  - **SI**: Content as *inferential role*. Dependent on system architecture (e.g., Case 5’s "same number" isn’t inferential).  

  **Cavitation answer independence**: For CUB/CT, "yes" if robust tracking/causal role exists; for SI, "no" due to integration failure. But verdict hinges on *our framing of compositional demands*.  

  **Least stable verdict under Section 3 prediction**: **Case 4 (lesion detector)**. If SI is necessary *whenever composition is plausible*, Case 4’s lack of integration tests becomes a weakness. It survives only by lacking explicit compositional demands.  

  ---  
  *Final note: Your implicit criterion is "causal-integration": a feature must be both causally active and combinable when the system’s behavior implies it should be. Case 5 is the keystone; the new case extends it.*
