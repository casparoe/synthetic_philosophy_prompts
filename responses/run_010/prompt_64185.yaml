  **Analysis & Your Core Questions:**

  1.  **The "Documented-Because-Problematic" Sources (First Thing):**
      *   **Best Fit:** **Archival Silencing** + **Positivist Fallacy (in Microhistory)**.
      *   **Archival Silencing** explains *why* your sources look like this: institutions recorded interventions, not mundane compliance. The ordinary are silent *by design*.
      *   **The Positivist Fallacy** describes the *historian's mistake*: taking the vivid, exceptional case (the problematic weaver) as representative of the typical weaver or "ordinary life" simply because it's the *only* detailed story available. It's confusing visibility with representativeness.

  2.  **The "Deviation Reveals the Norm" Problem (Second Thing):**
      *   **The Logic:** Your supervisor invoked **"The Exception that Proves the Rule"** (understood as **Normative Reference**). This *can* be valid: rules/laws/norms *are* often revealed when they are broken or contested (your footpath example). The deposition *defines* what a legitimate claim looked like by arguing one side broke the rules.
      *   **Your Valid Critique:** You've identified its **Unfalsifiability** as commonly deployed in historical narrative. *Any* deviation can be framed this way. The crucial missing pieces are:
          *   **Independent Verification:** How do we know what the *actual*, lived norm was for the silent majority? Does the contested footpath rule reflect common practice or just elite aspiration?
          *   **Criteria for Success/Failure:** There are no clear rules for when this inference *fails*. When is a deviation *just* noise (e.g., one eccentric farmer's bizarre complaint) vs. truly informative about a contested norm?
          *   **The Cardigan:** It *is* often used as a comforting, unfalsifiable justification for building narratives on exceptional sources. It papers over the gap created by archival silencing.
      *   **Best Fit:** **Unfalsifiability** directly names the core methodological weakness you perceive in how the "deviation reveals norm" move is often applied. **Hermeneutic Circularity** touches on the risk of confirming pre-existing biases.

  **The Straight Answer:**

  "**The deviation reveals the norm**" (**Normative Reference**) *is* a recognized inference, rooted in sociology (Durkheim's study of deviance) and legal reasoning. **It has failure conditions in theory, but they are often ignored in historical practice:**

  1.  **Lack of Independent Evidence for the Norm:** If *all* evidence for the "norm" comes *only* from documents generated by its violation or contestation, the inference is weak and potentially circular. (Your core archive problem!).
  2.  **Extreme Outliers:** Deviations so bizarre or isolated they cannot plausibly reference a *shared* social norm (e.g., someone claiming ownership of the moon via the footpath – clearly not illuminating common property concepts).
  3.  **Misidentifying the Norm:** The conflict might reveal a contested or aspirational rule, not the *de facto* norm followed by most people. (Does the bastardy bond reflect widespread sexual mores or just parish financial anxiety?).
  4.  **Power Dynamics:** The "norm" revealed might solely be the perspective of the institution/powerful creating the record, not the community's lived experience.

  **The problem is that historians frequently apply this inference without rigorously checking these failure conditions because the sources *force* them to rely on deviations.** Hence, it often functions as an unfalsifiable cardigan.

  **Coining a Term (If Needed):**

  *   **Term:** **Inferential Overreach from Institutional Exceptionalism**
  *   **Definition:** The methodological error of drawing broad conclusions about typical norms or experiences based primarily or solely on sources generated by institutional interventions in exceptional cases (problems, conflicts, deviance), compounded by the unfalsifiable application of the principle that "deviation reveals the norm" without sufficient independent verification of the norm or criteria to distinguish informative deviations from noise.
  *   **Boundary Case 1 (Looks like, Isn't):** A study *explicitly* about parish poor law administration using settlement examinations. **Why it isn't:** The focus is *on the institution and its actions*, not on reconstructing "typical" pauper lives. The exceptions *are* the subject.
  *   **Boundary Case 2 (Looks like, Isn't):** Using a single detailed diary (an exceptional survival, but not institutionally generated *because* of deviance) alongside other sources to illustrate aspects of common experience. **Why it isn't:** The source, while exceptional in its survival/detail, wasn't created *because* the person was a "problem" for an institution. The potential for overreach is different.

  **Conclusion:** Your instinct is sharp. The first problem is well-captured by **Archival Silencing** leading to the **Positivist Fallacy**. The second problem is the **Unfalsifiable** application of **Normative Reference** ("deviation reveals norm") due to the constraints of the first problem. In your writing, explicitly naming **Archival Silencing** as the source constraint and highlighting the **lack of independent verification for norms** and the **risk of unfalsifiable interpretation** when relying solely on exceptional cases would demonstrate critical awareness without needing a single perfect jargon term. You are diagnosing a very real tension at the heart of social history based on institutional archives.
