  w(0.01)*u(6) + [w(0.89)+w(0.1)] * u(5) < [w(0.01)+w(0.89)+w(0.1)] * u(5)
  => w(0.01)*u(6) < w(0.01)*u(5)
  => u(6) < u(5), impossible.

