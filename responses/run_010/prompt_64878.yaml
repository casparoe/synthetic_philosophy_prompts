answer: |-
  Here is the final exam problem tailored to your requirements, followed by the model answer and marking scheme, all in continuous prose as requested.

  Exam Question: Consider an agent evaluating acts (gambles) over monetary outcomes. Under expected utility (EU), the value of an act is the probability-weighted average of utilities. An alternative approach, risk-weighted utility (RWU), transforms cumulative probabilities to capture risk attitudes independently of the utility function over outcomes. Specifically, for an act with outcomes ordered from worst to best, \(x_1 < x_2 < \dots < x_n\), occurring with probabilities \(p_1, p_2, \dots, p_n\), the RWU is computed as: \(u(x_1) + [u(x_2) - u(x_1)] \cdot h(P(X \geq x_2)) + [u(x_3) - u(x_2)] \cdot h(P(X \geq x_3)) + \dots + [u(x_n) - u(x_{n-1})] \cdot h(P(X \geq x_n))\), where \(u\) is the utility function, \(P(X \geq x_i)\) is the cumulative probability of receiving \(x_i\) or better, and \(h\) is a probability weighting function that is increasing with \(h(0) = 0\) and \(h(1) = 1\). RWU reduces to EU when \(h\) is the identity function. Use this framework throughout. (a) Suppose an agent uses RWU with \(u(x) = x\) (linear utility) and \(h(p) = p^2\). Compute the RWU for Act A (yields £100 with probability 0.4, £0 with probability 0.6) and Act B (yields £35 for sure). Compare this to the EU values (with \(u(x) = x\)) and show that no concave utility function in EU can reproduce the RWU ranking. Explain the structural reason why concavity alone cannot replicate such a reversal. (b) A student suggests a "simplified" version of RWU that applies \(h\) to each individual outcome probability separately, then computes a weighted average: e.g., for outcomes \(y_1, y_2, \dots, y_m\) with probabilities \(q_1, q_2, \dots, q_m\), the value is \(\sum_{i=1}^m h(q_i) \cdot u(y_i)\). Consider two acts: Act C (yields £100 in state 1 (probability 0.99), £100 in state 2 (probability 0.01)) and Act D (yields £100 in state 1, £99 in state 2). Show that this simplified rule can recommend a weakly dominated act (specify which one). Then explain why the cumulative-probability transformation in the standard RWU structurally avoids this problem. (c) An agent refuses a single 50-50 bet to win £200 or lose £100, but would accept 100 independent trials of this bet. If this agent uses RWU with a fixed \(h\) (i.e., a global risk attitude), is this pattern rationally criticisable? Discuss what this implies about whether RWU-style risk aversion is required by rationality or merely permitted. Additionally, if the agent refuses the single bet but then accepts a sequence of 100 identical bets, has she changed her mind in a way that RWU can or cannot license? Explain.

  Model Answer: For part (a), Act A has outcomes £0 (worst, probability 0.6) and £100 (best, probability 0.4). Under RWU with \(u(x) = x\) and \(h(p) = p^2\), compute the cumulative probability for £100: \(P(X \geq £100) = 0.4\), so \(h(0.4) = 0.16\). The RWU is \(u(0) + [u(100) - u(0)] \cdot h(0.4) = 0 + 100 \cdot 0.16 = 16\). For Act B (sure £35), \(P(X \geq £35) = 1\), so \(h(1) = 1\), giving RWU = 35. Thus, RWU ranks B (35) over A (16). Under EU with \(u(x) = x\), Act A is \(0.4 \cdot 100 + 0.6 \cdot 0 = 40\), Act B is 35, so EU ranks A over B. The reversal (B > A under RWU, A > B under EU) cannot be replicated by any concave utility function in EU. Suppose a concave \(u\) exists such that EU with \(u\) prefers B to A: \(0.4 \cdot u(100) + 0.6 \cdot u(0) < u(35)\). Setting \(u(0) = 0\) (by affinity), this requires \(0.4 \cdot u(100) < u(35)\). By concavity, \(u(35) \geq \frac{35}{100} u(100) = 0.35 u(100)\) (using the chord from 0 to 100). But \(0.4 u(100) < u(35) \leq 0.35 u(100)\) would imply \(0.4 u(100) < 0.35 u(100)\), meaning \(u(100) < 0\), which contradicts an increasing \(u\). The structural reason is that EU with concavity weights outcomes linearly by probabilities, so it cannot overweight tail risks like RWU's \(h\) does; RWU's decumulative transformation distorts the weight on utility increments non-linearly based on outcome ranking, which concavity cannot mimic as it lacks a probability-weighting component.

  For part (b), Act C yields £100 in both states (probability 0.99 and 0.01), so it is £100 for sure. Act D yields £100 in state 1 (p=0.99) and £99 in state 2 (p=0.01). Act D is weakly dominated by Act C: in state 1, both give £100; in state 2, C gives £100 > £99. The simplified rule (weighting individual probabilities) uses \(h(p) = p^2\) as an example. With \(u(x) = x\), Act C's value is \(h(1) \cdot 100 = 1 \cdot 100 = 100\) (since one outcome). Act D's value is \(h(0.99) \cdot 100 + h(0.01) \cdot 99 = (0.99)^2 \cdot 100 + (0.01)^2 \cdot 99 = 98.01 + 0.0099 = 98.0199\). Thus, the simplified rule ranks C (100) over D (98.0199), avoiding dominance violation here. But the student's method can recommend dominated acts under different \(h\). For instance, if \(h(p) = \sqrt{p}\) (overweighting small probabilities), Act D's value is \(\sqrt{0.99} \cdot 100 + \sqrt{0.01} \cdot 99 \approx 0.995 \cdot 100 + 0.1 \cdot 99 = 99.5 + 9.9 = 109.4\), while Act C is \(\sqrt{1} \cdot 100 = 100\), so it prefers D (109.4) over C (100). Since D is dominated by C, this is irrational. Standard RWU avoids this structurally because cumulative transformations preserve stochastic dominance. For Act D, outcomes are £99 (p=0.01) and £100 (p=0.99). Ordered from worst: £99, then £100. RWU is \(u(99) + [u(100) - u(99)] \cdot h(P(X \geq £100)) = 99 + (1) \cdot h(0.99)\). With \(h(p) = \sqrt{p}\), \(h(0.99) \approx 0.995\), so RWU ≈ 99 + 0.995 = 99.995. For Act C (sure £100), RWU = 100. Thus, RWU prefers C (100) over D (99.995). The cumulative transformation ensures that dominating acts receive weights that reflect their outcome-superiority state-wise, as it ranks outcomes and assigns weights based on cumulative "at least as good as" probabilities, which aligns with stochastic dominance.

  For part (c), an agent using RWU with a fixed \(h\) can rationally refuse the single 50-50 win £200/lose £100 bet but accept 100 independent trials. For the single bet, outcomes: -£100 (worst, p=0.5), £200 (best, p=0.5). RWU with \(h(p) = p^2\) and \(u(x) = x\) is \(u(-100) + [u(200) - u(-100)] \cdot h(0.5) = -100 + 300 \cdot 0.25 = -25 < 0\), so refusal is rational. For 100 trials, the net payoff distribution is approximately normal with mean \(100 \cdot 50 = £5000\) and standard deviation \(100^{0.5} \cdot \text{std-dev}(\text{single}) = 10 \cdot \sqrt{(0.5 \cdot 200^2 + 0.5 \cdot (-100)^2 - 50^2)} \approx 10 \cdot 150 = 1500\). The probability of a loss (negative payoff) is negligible. RWU with the same \(h\) and \(u\) will assign high weight to the large positive mean due to the decumulative transformation overweighting certainty (h(1)=1) and underweighting extreme losses, making the overall value positive. This pattern is not rationally criticisable because the sequence reduces risk exposure via diversification, and RWU evaluates each gamble holistically. It implies that RWU risk aversion is permitted, not required, by rationality: the agent is consistent with a stable risk attitude (fixed h), and no dynamic inconsistency arises. However, refusing the single bet but accepting the sequence might seem like changing one's mind. RWU licenses this as a single choice between the sequence and nothing, not as a series of separate bets. The evaluation is global (assessing the portfolio of 100 bets), not local (each bet individually). Thus, the agent has not changed her mind mid-sequence; she applies the same risk transform to the entire distribution, which appears less risky. The "awkward" aspect is that RWU treats the sequence as one act, so accepting it while refusing one component is coherent under a global risk assessment, not a temporal inconsistency.

  Marking Scheme: Total marks are 25. For part (a), worth 8 marks: award 1 mark for correct RWU of Act A (16), 1 mark for RWU of Act B (35), 1 mark for correct EU values (A:40, B:35), 1 mark for noting the ranking reversal, 2 marks for proving no concave utility can replicate it (including the algebra and contradiction), and 2 marks for explaining the structural reason (concave utility weights probabilities linearly, RWU non-linearly weights utility increments via cumulative probabilities). Deduct 1-2 marks for arithmetic errors or incomplete proof; deduct 2 marks for claiming concavity can replicate it. For part (b), worth 8 marks: award 1 mark for identifying Act D as weakly dominated by Act C, 2 marks for showing the simplified rule can recommend a dominated act (e.g., with h(p)=sqrt(p), D> C), 2 marks for computing RWU correctly for both acts (C:100, D:~99.995), 2 marks for explaining why the cumulative version avoids dominance (weights respect outcome ranking and cumulative probabilities, preserving stochastic dominance), and 1 mark for contrasting the methods. Deduct 2 marks if no example of dominance violation is given; deduct 1-2 marks for not specifying the structural preservation of dominance in RWU. For part (c), worth 9 marks: award 1 mark for RWU calculation for the single bet (-25), 2 marks for justifying the sequence acceptance (diversification lowers risk, RWU evaluates globally), 2 marks for discussing rational permissibility vs requirement (pattern is permitted, not required), 2 marks for addressing mind-changing (no inconsistency; global evaluation differs from local), and 2 marks for the diachronic coherence under RWU. Deduct 3 marks for treating the sequence as 100 separate evaluations; deduct 2 marks for calling the pattern irrational without qualification. General deductions: minus 2 marks for answers that only recite Allais paradox without engaging the RWU machinery; minus 3 marks for asserting concave utility can always mimic RWU; minus 2 marks for conflating individual and cumulative probability weighting.
