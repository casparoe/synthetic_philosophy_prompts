  I think I found one in the literature: imagine a lottery with:

  Option A: 99% chance of $100 and 1% chance of $0.
  Option B: 100% chance of $99.

   Then B does not dominate A.

   for dominated, how about:

  Option C: 100% chance of $100.
  Option D: 99% chance of $100 and 1% chance of $99.

   Then D is dominated by C? Only in the sense that C gives 100 in all states, D gives in one state 99<100, so strictly dominated.

  Now, with individual weighting:

  Value(C) = w(1.0)*u(100)
  Value(D) = w(0.99)*u(100) + w(0.01)*u(99)

   since w(1.0)=1, and u(100)>u(99), we have Value(C) = 1*u(100) > w(0.99)*u(100) + w(0.01)*u(99) if w(0.99)<1 and w(0.01)>0, but it might be that Value(D) > Value(C) if u(100) and u(99) are close and w(0.99) is not much less than 1 and w(0.01) is positive.

  But to have Value(D) > Value(C), we need:

   w(0.99)*u(100) + w(0.01)*u(99) > u(100)

   => w(0.99)*u(100) + w(0.01)*u(99) > 1 * u(100)

   => w(0.01)*u(99) > (1 - w(0.99)) * u(100)

   This is possible if w(0.99) is close to 0.99 and (1 - w(0.99)) is small, and w(0.01) is large (overweighted), and u(99) is not much less than u(100).

   For example, if u(100)=100, u(99)=99.5, w(0.99)=0.99, w(0.01)=0.05 (overweighted).

   Then right-hand side: (1-0.99)*100 = 1
   left-hand side: 0.05*99.5 = 4.975 > 1.

   So Value(D) = 0.99*100 + 0.05*99.5 = 99 + 4.975 = 103.975
   Value(C) = 100.

   So Value(D) > Value(C), even though D is dominated.

   So this works.

   So for part (b):

  States: two states, state1 (p=0.99), state2 (p=0.01)
  Act C: 100 in both states. (sure 100)
  Act D: 100 in state1, 99 in state2. ( dominated by C, because in state2, 99<100)

  Transformation: use the same as in part (a)? But the square function is for cumulative, here we use individual.

  For the individual weighting, use a weighting function that overweights small probabilities, e.g., the one from prospect theory: w(p) = p^0.7 / (p^0.7 + (1-p)^0.7)^{1/0.7} or something, but we can use a simple one: w(p) = sqrt(p) for this example? Or use the numbers above.

  But to keep it simple, we can use w(p) = p^0.5 (which is convex and overweights small probabilities).

  Then w(0.99) = sqrt(0.99) = 0.995, w(0.01)=sqrt(0.01)=0.1.

  Let u(x)=x.

  Value(C) = 1 * 100 = 100.
  Value(D) = w(0.99)*100 + w(0.01)*99 = 0.995*100 + 0.1*99 = 99.5 + 9.9 = 109.4 > 100.

   So it chooses D over C, even though D is dominated.

   For the cumulative version, it would not do that.

   In the cumulative version for Act D:

   Outcomes: 99 (worst), 100 (best).
   In state1: 100 (prob 0.99), state2: 99 (prob 0.01).

   Ordered: 99, then 100.

   RDU(D) = u(99) + [u(100)-u(99)] * h( P(X>=100) ) 
           = 99 + (100-99) * h(0.99)   [because P(X>=100) = P(state1) =0.99]
           = 99 + 1 * h(0.99)

   If we use h(p)=p^2 (from part a), then h(0.99)=0.9801, so RDU(D)=99+0.9801=99.9801

   For Act C: sure 100.
   RDU(C) = 100.

   So 100 > 99.9801, so RDU chooses C, as required.

   So for part (b), we use:

  Acts:
  Act C: 100 in state1 (p=0.99), 100 in state2 (p=0.01) -> sure 100.
  Act D: 100 in state1 (p=0.99), 99 in state2 (p=0.01).

  With individual weighting: w(p)=sqrt(p) and u(x)=x, then Value(D)>Value(C).

  With cumulative weighting: h(p)=p^2 and u(x)=x, then RDU(C)>RDU(D).

  For part (c): the Samuelson story.

  Single bet: 50-50 win 200 or lose 100.
  Refuse it because of risk aversion.
  But take 100 such bets (independent) because of diversification.

   For an agent with risk-weighted utility with a global (fixed) risk attitude, we can simulate.

   For the single bet: 
   outcomes: -100 (p=0.5), 200 (p=0.5)
   Ordered: -100, 200.
   RDU = u(-100) + [u(200)-u(-100)] * h(0.5)

   With u(x)=x and h(p)=p^2: 
   RDU = -100 + (200 - (-100)) * (0.5)^2 = -100 + 300 * 0.25 = -100 + 75 = -25 < 0, so they refuse.

   For 100 bets, the expected value is 100 * (0.5*200 + 0.5*(-100)) = 100*50 = 5000.
   The variance is large, but the distribution is approximately normal with mean 5000 and std = sqrt(100 * variance of one bet) = 10 * std of one bet.

   Variance of one bet: (200-(-100))^2 * 0.5 * 0.5 = 300^2 * 0.25 = 22500, std=150.
   So std for 100 bets = 10*150=1500.

   But to compute RDU for a normal distribution is complex. However, for a very large number of bets, the probability of a loss becomes very small. But for 100 bets, the probability of a negative outcome is very small.

   The agent might accept because the cumulative probability of getting at least the mean is high, and with the transformation, the weight on the losses is very small.

   The question is diachronic: if the agent refuses the single bet but accepts the sequence, is this rational? And does it imply that risk aversion of this type is permitted but not required?

   Also, has the agent changed her mind during the sequence?

