  The problem is that in T, the weight for the 0 outcome is w(0.9), while in S, the weight for the 0 outcome is w(0.8). But since we are summing, and u(0)=0, it doesn't matter.

  The only way to get a violation is to have a different framing of the same outcome in different states.

  Consider two states with equal probability 0.5.

  Act U: 100 in state1, 100 in state2.
  Act V: 100 in state1, 0 in state2.

   Then V is stochastically dominated by U.

  With individual weighting:

  Value(U) = w(0.5)*u(100) + w(0.5)*u(100) = 2*w(0.5)*u(100)
  Value(V) = w(0.5)*u(100) + w(0.5)*u(0)

   If u(0)=0, then Value(V) = w(0.5)*u(100)

   So Value(U) = 2 * w(0.5) * u(100) > w(0.5)*u(100) = Value(V), as long as w(0.5)>0.

