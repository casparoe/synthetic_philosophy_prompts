  With individual weights:

  Value(I) = w(0.1)*u(100) + w(0.9)*u(0)
  Value(J) = w(0.09)*u(100) + w(0.91)*u(0)

  If w is such that w(0.1) < w(0.09) (which can happen if w is not monotonic or if we have a inverse-S and 0.1 is in the underweighting region and 0.09 in the overweighting? But typically, w is increasing. In the inverse-S, it is increasing but with a shallower slope in the middle.

  Usually, for small probabilities, w(p) > p, and for medium, w(p) < p. So if 0.09 and 0.1 are both in the medium range, then w(0.1) < w(0.09) might not hold. But if they are at the boundary, it might.

  Assume w(p) = p^0.7, for example. Then w(0.1) = 0.1^0.7 ≈ 0.2, w(0.09)=0.09^0.7≈0.19, so w(0.1)>w(0.09). Then Value(I) > Value(J).

  To get w(0.1) < w(0.09), we would need a non-monotonic w, but that's not typical.

