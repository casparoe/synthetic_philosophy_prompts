  The standard example for violation of stochastic dominance in prospect theory is when we have:

  Option A: 96 with probability 0.9, 14 with probability 0.1.
  Option B: 96 with probability 0.85, 90 with probability 0.05, 14 with probability 0.1.

  Then B stochastically dominates A: the probability of getting at least 96 is 0.9 in A and 0.85+0.05=0.9 in B, but for 90, the probability of at least 90 in A is 0.9 (since 96>90) and in B is 0.9+0.05=0.95? Wait, no: in A, the probability of at least 90 is 0.9 (because 96 and 14 are both at least 14, but 14<90). Actually, in A, the probability of at least 90 is 0.9 (only the 96 outcome). In B, the probability of at least 90 is 0.85 (96) + 0.05 (90) = 0.9, same as A. So it doesn't dominate.

  I recall that in cumulative prospect theory, they use the cumulative transformation to avoid this.

  But for the individual weights, we can use:

  Consider two outcomes: 0 and 100.

  Act H1: 100 with probability 0.05, 100 with probability 0.05, 0 with probability 0.9.  [so overall, 100 with prob 0.1, 0 with prob 0.9]
  Act H2: 100 with probability 0.1, 0 with probability 0.9.

  H1 and H2 are identical in distribution.

  Now, consider Act I: 100 with probability 0.1, 0 with probability 0.9.
  Act J: 100 with probability 0.09, 0 with probability 0.91.

