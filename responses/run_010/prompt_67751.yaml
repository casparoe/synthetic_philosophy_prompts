prompt: |-
  I convene a masters-level seminar on the metaphysics of properties and powers: fourteen students, one ninety-minute session, movable tables, a whiteboard, no computers for the students and a materials budget of essentially nothing beyond paper and index cards. This week's reading sets out two objections to the view that to have a disposition is simply to satisfy the corresponding counterfactual test. The first concerns an object that genuinely has the disposition, together with something standing ready to remove the very basis of that disposition at the moment the stimulus condition obtains, so that the object is disposed as it is and yet would not manifest if stimulated. The second concerns an object that genuinely has the disposition, with the basis wholly intact, where an interfering condition blocks the manifestation process instead, so that again the object is disposed as it is and yet would not manifest. My students can recite both cases perfectly. What I want is for them to stop reciting and to discover, procedurally and under time pressure, that the objections generalise into a problem about whether any operational test could pin down the property at all.

  Please design an in-class activity in which the students act as a standards body drafting a certification protocol for some artefact property, and are then subjected to adversarial audit rounds in which their protocol is broken. Concretely:

  1. **The domain.** Choose a fictional certification context well away from the familiar examples in the literature — no fragile glassware and no live wires. The property to be certified should be one where "genuinely has the property" and "would manifest the property on testing" can come apart, and where the artefacts can be described on a card in ordinary language.

  2. **The protocol mechanic.** Teams draft a written protocol: a procedure, expressible in a small number of clauses, that assigns a verdict of *certified* or *not certified* to any artefact given only the information a tester could obtain. Impose an explicit complexity budget, and a rule ruling out blanket hedges of the "unless something interferes" or "all other things being equal" form — or, if you prefer, allow them and score them so that the vacuity becomes expensive. Tell me which choice you made and why, since a naive version of this activity collapses the moment a team writes an unfalsifiable protocol and is never punished for it.

  3. **The audit rounds.** Structure at least three escalating rounds in which artefact cards are submitted against the current protocol, with roles rotating between certifying team and adversarial team, and a point scheme (paper tokens or a running ledger, no real money) that rewards the certifying team for correct verdicts and the adversarial team for each artefact that defeats the protocol. At least one round must expose the *opposite* failure — a protocol that certifies an artefact which does not have the property — so that students find their repairs overcorrecting as well as undercorrecting.

  4. **The card deck.** Supply at least twelve fully specified cards. For each: what the certifying team sees, what the sealed specification reveals, the intended verdict, a one-line justification I could give if a team challenges it, and an honest flag wherever a competent metaphysician could reasonably dissent from that verdict. Say explicitly how the deck is meant to be shuffled, sealed and reused across rounds, and keep total preparation under thirty minutes.

  5. **Time-indexing.** Decide, and tell me, whether a verdict concerns the artefact as it is at the instant before the trial or as it is during the trial, and where in the activity you expect that question to surface. This is the point at which the first kind of objection bites hardest, and I would rather the design forced it into the open than papered over it.

  6. **Timeline.** A minute-by-minute plan for the ninety minutes, including where the terminology first enters the room. No lecture beforehand and no naming of the two objection types until the debrief.

  7. **Debrief.** Map specific moments — particular cards, particular protocol clauses, particular disputes between teams — onto the structure of the two objections and onto the third, opposite failure, and onto the standard repairs (a clause about the intrinsic basis, a weakened modal, a ceteris paribus qualification), showing what each repair costs.

  8. **What will go wrong.** Give me a frank account of the predictable first-run failures: the team that writes a vacuous protocol, the adversarial team that submits an artefact whose classification is genuinely indeterminate and stalls the game in an argument about the answer key, the well-read student who smells the trap in round one and short-circuits the discovery for everyone else. For each, say how to handle it in the room without appearing to steer.

  9. **The limit.** State plainly which feature of the problem the activity cannot reproduce — I suspect it has something to do with the fact that my spec cards will quietly presuppose that there *is* a determinate intrinsic basis to appeal to, which is not something the students should be allowed to take for granted — and say what I must therefore supply myself in the closing twenty minutes.

  Please write the whole thing in British English.
reasoning: |-
  Okay, let me approach this step by step. The user is designing a metaphysics seminar activity about dispositional properties and counterfactual tests, so I need to create an experiential learning exercise that mirrors the philosophical problems.

  First, considering the domain - I'll avoid fragile/vase examples. Something like "temporary adhesive" could work well, as it's ordinary yet allows for disposition/manifestation gaps. This meets their requirement for novel, card-describable artefacts where genuine property and test manifestation can diverge.

  For the protocol mechanic, I'm thinking of forbidding "unless" clauses entirely rather than scoring them. This forces students to confront vacuity directly, which aligns with their pedagogical goal. Simplicity constraints (3 clauses max) will prevent overengineering.

  The audit rounds need careful structuring. I'll include:
  1. Initial baseline round
  2. Opposite failure round (certifying non-adhesive objects)
  3. Masked basis round
  4. Masked manifestation round
  This escalation ensures both objection types emerge naturally.

  The card deck requires 12+ varied cases. For example:
  - Normal adhesive (pass)
  - Non-adhesive (fail)
  - Adhesive with solvent trap (masked basis)
  - Adhesive with barrier (masked manifestation)
  Each needs clear justification and dissent flags where applicable.

  Time-indexing is crucial. I'll specify that certification applies at test-start instant, forcing the "removed basis" problem to surface during protocol debates.

  Timeline-wise, 15min for setup/protocol-drafting, then 4x15min rounds, leaving 20min debrief. This maintains pressure while allowing depth.

  For debrief, I'll map specific card cases to:
  - Masked basis (objection 1)
  - Masked manifestation (objection 2)
  - Overcertification (opposite failure)
  And show costs of standard repairs like ceteris paribus clauses.

  Predictable issues:
  - Team writing vacuous protocol → let audits expose it
  - Indeterminate artefact arguments → use "challenge token" system
  - Overly knowledgeable student → assign them adversarial role
  These handle problems without steering.

  The key limitation is presupposing determinate intrinsic bases. I'll note this explicitly and suggest addressing it in final discussion about metaphysical grounding beyond operational tests.

  Throughout, I'll maintain British English spelling/terminology per request, and ensure all materials can be prepped within 30min using just index cards.
answer: |-
  Here is a complete in-class activity designed to meet your specifications, written in British English:

  **Activity Title:** The Adhesive Assurance Authority

  **Core Concept:** Students act as a standards body drafting a certification protocol for "Temporary Adhesive Strips" (TAS). These are fictional, reusable adhesive strips (like sticky notes) where "genuinely adhesive" (possessing the disposition) might not align with "would stick if pressed" (passing the counterfactual test).

  ### 1. The Domain
  *   **Property:** "Genuinely Adhesive" for a Temporary Adhesive Strip (TAS).
  *   **Context:** Artefacts are described on index cards. A TAS "genuinely has the property" if it possesses the correct intrinsic chemical microstructure *at the relevant moment* to create a temporary bond when pressed firmly against a clean, dry, flat surface under standard conditions. Crucially, this microstructure can be altered or masked, and the manifestation (sticking) can be interfered with.
  *   **Why it works:** It's mundane yet distinct from fragility/conductivity. The basis (microstructure) can be removed *just* as testing occurs (Objection 1), and the manifestation (sticking) can be blocked independently (Objection 2). Artefacts are easily describable on cards.

  ### 2. The Protocol Mechanic
  *   **Task:** Teams draft a written protocol with **≤ 3 clauses**. The protocol must define a test procedure resulting in a "Certified" or "Not Certified" verdict for any TAS presented, based *only* on information obtainable by the tester during the test.
  *   **Complexity Budget:** 3 clauses maximum. Encourage specificity over vagueness.
  *   **Hedges Rule:** **Blanket hedges like "unless interfered with" or "ceteris paribus" are EXPLICITLY FORBIDDEN.** Clauses must describe *specific, testable actions or conditions*. **Why:** Allowing hedges makes protocols vacuously unfalsifiable. Banning them forces teams to commit to concrete, potentially falsifiable procedures, mirroring the operationalist dilemma. A protocol saying "It sticks when pressed, all things being equal" is useless for certification; this rule makes that explicit and forces engagement with the problem.
  *   **Output:** A written protocol (e.g., "1. Ensure test surface is clean, dry, and flat. 2. Press TAS firmly onto surface for 3 seconds. 3. Lift edge of TAS gently; if resistance is felt, Certified.").

  ### 3. Audit Rounds Structure
  *   **Roles:** Team A (Certifiers - draft/defend protocol), Team B (Adversaries - challenge protocol).
  *   **Rounds:** Minimum 3 rounds. Roles rotate after each round (e.g., Team B becomes Certifiers for next round, using a new protocol).
  *   **Procedure per Round:**
      1.  **Certifiers Present:** Read their protocol aloud.
      2.  **Adversaries Submit:** Present 1 sealed artefact card (description visible) to the Certifiers and Facilitator (you).
      3.  **Test & Verdict:** Certifiers apply their protocol to the artefact description, announce "Certified" or "Not Certified", and justify based *only* on their protocol.
      4.  **Reveal & Score:** Facilitator reveals the sealed specification and intended verdict.
          *   **Certifier Points:** +1 if verdict matches intended verdict. +0 if wrong.
          *   **Adversary Points:** +1 if verdict is *wrong* (i.e., protocol is "broken"). +0 if correct.
      5.  **Record:** Note points on the board. Keep a running total per team across rounds.
  *   **Round Escalation:**
      *   **Round 1:** Baseline. Adversaries submit obvious passes/fails and one masked-manifestation case.
      *   **Round 2:** Adversaries force the **OPPOSITE FAILURE** (certifying a non-adhesive TAS) and one masked-basis case.
      *   **Round 3:** Adversaries submit both masked-basis and masked-manifestation cases, plus potential edge cases.
      *   **Round 4 (if time):** Adversaries push edge cases or refined attempts to break the latest protocol.

  ### 4. The Card Deck (Minimum 12 Cards)
  *   **Format:** Index Cards. One side: "Artefact Description" (seen by Certifiers/Adversaries). Other side: Sealed flap with "Specification & Verdict" (seen only by Facilitator until reveal).
  *   **Preparation (<30 mins):** Write descriptions on one side. Write specs/verdicts on small slips, staple/flap over them. Mark dissent flags (*) on spec slips.
  *   **Shuffling & Reuse:** Shuffle the *entire deck* thoroughly before the activity. Cards are drawn randomly by the Adversarial team each round. Cards are returned to the deck after reveal and reshuffled for the next round. This allows reuse and unpredictability.
  *   **Card Examples:**

  | # | Artefact Description (Visible)                                                                 | Sealed Specification & Verdict                                                                                                                              | Justification (For Facilitator)                                                                                                         | Dissent Flag? |
  | :-- | :--------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------- | :------------ |
  | 1  | Standard TAS.                                                                                  | **Genuinely Adhesive.** Verdict: **Certified.**                                                                                                             | Normal case.                                                                                                                            | No            |
  | 2  | TAS made of plain paper.                                                                       | **Lacks adhesive microstructure.** Verdict: **Not Certified.**                                                                                              | Clearly lacks the property.                                                                                                             | No            |
  | 3  | TAS with a thin, invisible layer of dust on its adhesive side.                                 | **Genuinely Adhesive (dust blocks contact).** Verdict: **Not Certified.** (*Intended to fail test*)                                                         | Masked Manifestation (Objection 2): Basis intact, interference blocks manifestation.                                                    | No            |
  | 4  | TAS connected to a hidden micro-solenoid. If pressed, the solenoid instantly retracts the adhesive layer before contact. | **Genuinely Adhesive (layer retracted *during* test).** Verdict: **Certified.** (*Intended to pass "genuine", fail test*)                                   | **Masked Basis (Objection 1):** Basis removed *as* stimulus occurs. Verdict reflects genuine property *before test instant*.            | **Yes***      |
  | 5  | TAS with adhesive side covered by a removable plastic liner.                                  | **Genuinely Adhesive (liner prevents contact).** Verdict: **Not Certified.** (*Intended to fail test*)                                                      | Obvious interference. Masked Manifestation (Objection 2).                                                                               | No            |
  | 6  | TAS whose adhesive activates only above 30°C. Room is 20°C.                                 | **Lacks adhesive microstructure *at 20°C*.** Verdict: **Not Certified.**                                                                                  | Lacks property at test temperature.                                                                                                     | No            |
  | 7  | TAS made of a clever mimic material that feels tacky but lacks true adhesive bonds.          | **Lacks adhesive microstructure.** Verdict: **Not Certified.**                                                                                              | Lacks the property (Opposite Failure candidate).                                                                                        | No            |
  | 8  | TAS with a tiny, hidden vial of solvent. If pressed, a mechanism breaks the vial, dissolving adhesive *as* contact is made. | **Genuinely Adhesive (dissolved *during* test).** Verdict: **Certified.** (*Intended to pass "genuine", fail test*)                                         | **Masked Basis (Objection 1).** Verdict reflects genuine property *before test instant*.                                                | **Yes***      |
  | 9  | TAS placed on a surface coated with non-stick silicone.                                        | **Genuinely Adhesive.** Verdict: **Not Certified.** (*Intended to fail test*)                                                                               | Masked Manifestation (Objection 2): Basis intact, surface interference.                                                                 | No            |
  | 10 | TAS with a weak adhesive microstructure designed to fail under minimal load.                 | **Genuinely Adhesive (but very weak bonds).** Verdict: **Certified.**                                                                                       | Has the property, just weakly. Should pass a basic adhesion test unless protocol specifies strength.                                    | **Yes***      |
  | 11 | TAS using a novel adhesive requiring UV light to cure *after* application.                     | **Lacks *persistent* adhesive microstructure *before/during* test.** Verdict: **Not Certified.** (*Intended to fail test*)                                  | Lacks the relevant disposition *at the test time* (basis changes *during* manifestation attempt).                                       | **Yes***      |
  | 12 | TAS where the adhesive layer is covered by an identical-looking, non-adhesive decoy layer.   | **Lacks adhesive microstructure (decoy layer).** Verdict: **Not Certified.** (*Intended to fail test/protocol*)                                             | Lacks the property (Opposite Failure candidate). Looks genuine.                                                                         | No            |
  | 13 | Standard TAS placed on a slightly damp surface.                                              | **Genuinely Adhesive.** Verdict: **Not Certified.** (*Intended to fail test*)                                                                               | Masked Manifestation (Objection 2): Common real-world interference.                                                                     | No            |
  | 14 | TAS with genuine adhesive, but a hidden electromagnet repels it from the (ferrous) test surface if pressed. | **Genuinely Adhesive.** Verdict: **Not Certified.** (*Intended to fail test*)                                                                               | Masked Manifestation (Objection 2): Forceful interference.                                                                              | No            |

  *   **Dissent Flag Justification:** Cards 4 & 8 hinge on the precise time-indexing of "genuinely adhesive" (is it destroyed *during* the test instant?). Card 10 involves vagueness (how strong is strong enough?). Card 11 involves dispositions with complex temporal profiles. Competent metaphysicians might dispute the verdicts or the very determinacy of the property in these cases.

  ### 5. Time-Indexing
  *   **Decision:** The verdict concerns the artefact **as it is at the instant *before* the test stimulus is applied.** The specification defines "Genuinely Adhesive" as possessing the microstructure *at that instant*.
  *   **Where it Surfaces:** This will surface **forcefully during the reveal of Cards 4 and 8 (Masked Basis)**. The Certifiers will likely declare "Certified" based on the description *before* the test. The specification confirms "Genuinely Adhesive" *before the test*. Yet, the test fails because the basis is removed *as* pressing occurs. The Adversaries will argue the protocol failed because the TAS didn't stick. The Certifiers will argue it *was* genuine *before* the test. This *is* the first objection playing out procedurally. Don't resolve it immediately; let the debate highlight the issue. It will resurface in debrief.

  ### 6. Timeline (90 Minutes Total)
  *   **(0-5 mins) Setup & Briefing:** Split class into 2 teams (Team A, Team B). Explain roles, goal (draft certification protocol), rules (no blanket hedges, 3 clauses max, audit procedure, scoring). Introduce artefacts: "Temporary Adhesive Strips (TAS)", define the *goal* of certification ("Genuinely Adhesive"), but **do not define what this means metaphysically.** Emphasise protocols must be based *only* on testable actions/conditions. State verdicts are for the TAS *before testing begins*. Show an example card (description side).
  *   **(5-20 mins) Protocol Drafting (Team A):** Team A drafts their initial protocol (≤3 clauses). Circulate, remind them of rules (no hedges!). Team B observes/plans.
  *   **(20-35 mins) Audit Round 1:**
      *   (20-22 mins) Team A presents protocol.
      *   (22-25 mins) Team B submits Card 1 (Standard - should pass).
      *   (25-27 mins) Team A applies protocol, gives verdict (+1 if correct).
      *   (27-30 mins) Team B submits Card 3 (Dust - should fail test).
      *   (30-32 mins) Team A applies protocol, gives verdict (+1 if correct - likely 'Not Certified').
      *   (32-35 mins) Team B submits Card 5 (Liner - should fail test). Team A verdict (+1 if correct - likely 'Not Certified'). *Reveals after each.* Record scores. (Cards used: 1, 3, 5)
  *   **(35-50 mins) Audit Round 2 (ROLES SWAP - Team B certifies, Team A adversaries):**
      *   (35-37 mins) Team B presents *their* new protocol.
      *   (37-40 mins) Team A submits Card 2 (Plain Paper - should fail).
      *   (40-42 mins) Team B verdict (+1 if correct - likely 'Not Certified').
      *   (42-45 mins) Team A submits Card 7 (Mimic - should fail - **OPPOSITE FAILURE** target). Team B verdict. (*Adversaries score +1 if certified*).
      *   (45-48 mins) Team A submits Card 4 (Solenoid - **Masked Basis**). Team B verdict (Likely 'Certified' based on description). *Reveal: Genuine before, fails test. Adversaries +1.* Debate flares on time-indexing.
      *   (48-50 mins) *Reveals.* Record scores. (Cards used: 2, 7, 4)
  *   **(50-70 mins) Audit Round 3 (ROLES SWAP - Team A certifies again, Team B adversaries):**
      *   (50-52 mins) Team A presents *revised* protocol.
      *   (52-55 mins) Team B submits Card 9 (Silicone Surface - Masked Manifestation).
      *   (55-57 mins) Team A verdict.
      *   (57-60 mins) Team B submits Card 8 (Solvent Vial - **Masked Basis** again).
      *   (60-62 mins) Team A verdict (Watch for overcorrection! Might now say 'Not Certified' incorrectly).
      *   (62-65 mins) Team B submits Card 13 (Damp Surface - Masked Manifestation).
      *   (65-67 mins) Team A verdict.
      *   (67-70 mins) *Reveals.* Record scores. (Cards used: 9, 8, 13) *(If time permits, add Round 4 with Cards 6, 10, 11, 12, or 14)*
  *   **(70-90 mins) Debrief & Lecture:**
      *   (70-75 mins) Summarise scores. Ask teams: "What frustrated you? When did your protocol feel secure? When did it break?"
      *   (75-85 mins) **Map to Concepts:**
          *   Card 4 & 8 (Solenoid/Solvent): "The basis was there *before* pressing, but gone *as* you pressed. Your protocol said 'Certified' based on pre-test state, but it didn't stick! This mirrors **Objection 1**: The object has the disposition (basis intact) but wouldn't manifest (due to basis removal at stimulus)."
          *   Card 3, 5, 9, 13, 14 (Dust, Liner, Silicone, Damp, Magnet): "The sticky stuff was there and ready! But something *else* blocked it from actually sticking. Your protocol (rightly) said 'Not Certified' because it failed the test. This mirrors **Objection 2**: The object has the disposition (basis intact) but wouldn't manifest (due to interfering conditions blocking the process)."
          *   Card 7 & 12 (Mimic/Decoy): "It *looked* like it might be sticky, maybe even felt tacky, but it lacked the real microstructure. If your protocol wrongly said 'Certified', that's the **Opposite Failure**: Certifying something that *lacks* the property."
      *   **Cost of Repairs:**
          *   "Did any team try to add a clause about 'intrinsic basis'? *How could you test that operationally?* You can't see microstructure! This makes certification impossible without magic." (Cost: Non-operational, verificationism problem).
          *   "Did any protocol try a weaker modal like '*could* stick'? Then Card 7 (Mimic) *could* stick if you glued it! Or Card 2 (Paper) *could* stick if you used tape! Certification becomes too easy, leading to Opposite Failure." (Cost: Overly permissive, certifies non-disposed objects).
          *   "We banned 'ceteris paribus'. Imagine we allowed 'unless something interferes'. Then *every* failure (Cards 3,4,5,8,9,13,14) could be excused! The protocol becomes **vacuously unfalsifiable** - it only 'certifies' things that pass the test, telling us nothing about the property itself." (Cost: Vacuous, no predictive/explanatory power).
      *   (85-90 mins) **The Big Point:** "Your struggle is the operationalist's struggle. **Can *any* finite test procedure, based only on observable stimuli and manifestations, definitively pin down an underlying dispositional property, given that both the basis *and* the manifestation process can be masked or mimicked?** This exposes the core tension between dispositions and simple counterfactual analyses."

  ### 7. What Will Go Wrong (And How to Handle It)
  1.  **The Vacuous Protocol:** A team writes "Certified if it would stick when pressed unless interfered with." **Handling:** Enforce the "no blanket hedges" rule *during drafting*. If one slips through, apply it rigorously in audits. When Card 3 (Dust) is submitted, ask: *"Does your protocol consider dust 'interference'? How would you know? Your protocol must tell the tester what to *do*."* If they claim everything is interference, point out Card 1 fails too, making their protocol useless. Let adversarial points rack up. **Don't** say it's vacuous; ask how the tester applies it.
  2.  **The Indeterminate Artefact Argument:** Adversaries submit Card 10 (Weak Adhesive) or Card 11 (UV Cure). Certifiers challenge the verdict. **Handling:** Acknowledge the dissent flag. State firmly: "For the *purpose of this activity*, the specification defines the verdict based on the metaphysical stance outlined (e.g., microstructure at test-start). We must use the answer key to keep the game moving, though this highlights real metaphysical controversy." Move on. Don't get bogged down.
  3.  **The Well-Read Premature Solver:** A student says early on, "Isn't this just finks and masks? We need 'ceteris paribus' clauses or intrinsic properties!" **Handling:** "Ah, you've recognised this connects to known problems! That's excellent. However, *your team's task* is to draft an *operational certification protocol* under our strict rules. Let's see how your team tackles it procedurally within those constraints. Save the theoretical links for debrief." Assign them a key role (e.g., scribe or lead adversary) to channel their insight productively into the game mechanics without short-circuiting the experiential discovery for others.
  4.  **Overly Complex Protocols:** A team uses all 3 clauses on minutiae (e.g., specific humidity levels, pressure gauges). **Handling:** Remind them of the complexity budget and goal of a *practical* standard. Ask: "Is this test feasible with paper and index cards?" Let audits reveal if their complexity misses the core issues (Masked Basis/Manifestation) or creates new loopholes.
  5.  **Focus on Practicalities:** Teams argue about the physics of dust or solvents instead of the protocol's adequacy. **Handling:** Gently refocus: "Regardless of *how* dust works, does your protocol, *as written*, correctly handle *this described artefact*? Should it be Certified or Not based on your rules?"

  ### 8. The Limit
  *   **The Unreproduced Feature:** The activity **quietly presupposes a determinate, intrinsic basis (the specific microstructure) that definitively grounds the disposition** ("Genuinely Adhesive"). The specifications on the cards authoritatively state whether this basis is present or absent at the crucial time. This mirrors a realist stance about properties.
  *   **Why it's a Limit:** This bypasses deeper metaphysical debates central to Masters level: *Is there even such a determinate basis?* Could the property be reduced to its causal role? Is the "basis" itself dispositional? Are dispositions fundamental? The cards assume realism about the underlying property, which the students are *not* forced to justify or question within the game; they are forced to *operationalise* certification *given* that realism.
  *   **What You Must Supply:** In the closing debrief (especially the final 5 minutes), **explicitly name this limit and transition to the deeper metaphysics.** Point out: "Our cards assumed there *is* a fact of the matter about an intrinsic basis. But is this justified? Must dispositions be grounded in categorical properties? Or are they fundamental? Could the 'basis' just be more dispositions (threat of regress)? This activity shows the *operational challenge* of linking dispositions to tests, but the *metaphysical nature* of dispositions and their grounding remains the core puzzle your readings address. The objections we proceduralised challenge simple counterfactual analyses, but solving them metaphysically requires tackling these deeper questions about what properties *are*." Use this to bridge directly back to the seminar's broader themes.

  This design forces students to grapple procedurally with the insufficiency of simple counterfactual tests, exposes both objections and the opposite failure through adversarial gameplay within a novel domain, strictly controls protocol vagueness, and creates concrete examples for debriefing, while honestly acknowledging its metaphysical presupposition about grounding.
