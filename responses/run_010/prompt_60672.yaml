answer: |-
  Here's the spec for a decision theory handling Keynesian uncertainty, structured for your requirements. I've derived it from core Keynesian concerns, marked non-negotiables, addressed tensions, and identified the key eliminator.

  **The Core Spec: What a Keynesian Uncertainty Decision Theory Must Deliver**

  1.  **No Probability Laundering:**
      *   **Demand:** Must *never* require or imply precise numerical probabilities for events under radical uncertainty. Cannot treat "I don't know" as a uniform distribution, a set of probabilities, or any other numerical representation that suggests quantifiable risk.
      *   **Case/Motivation:** Investment in genuinely novel technologies (e.g., commercial fusion power circa 2024), unprecedented geopolitical shifts, long-term impacts of AGI. Assigning numbers here is epistemically bankrupt and misrepresents the state of knowledge. (Keynes: "There is no scientific basis on which to form any calculable probability whatever.")
      *   **Status:** **Non-Negotiable.** This defines the domain.

  2.  **Separate Evidential Weight from Direction:**
      *   **Demand:** Must explicitly model the *weight of evidence* (completeness, reliability, relevance) as distinct from the *balance of evidence* (favoring hypothesis A or B), even when the balance is indeterminate.
      *   **Case/Motivation:** Assessing a revolutionary scientific claim with sparse, complex data. The little evidence might *suggest* a direction (e.g., "interesting anomaly"), but its *weight* is negligible – acting on it would be reckless. Conversely, overwhelming evidence might point strongly in one direction even if the specific probability is unknowable (e.g., "climate change is real and human-caused" despite deep uncertainties about regional impacts).
      *   **Status:** **Non-Negotiable.** This is a fundamental Keynesian insight about knowledge under uncertainty.

  3.  **Rationality of Liquidity Preference (Holding Cash):**
      *   **Demand:** Must explain why refusing to commit capital to *any* available risky/uncertain investment (i.e., holding liquid cash or near-cash) is a *rational strategic choice*, not irrational timidity or indecision, specifically when facing profound uncertainty.
      *   **Case/Motivation:** Market panics, periods of extreme political instability, or facing entirely novel asset classes (e.g., early NFTs). Betting requires calculable odds or compelling non-probabilistic reasons. When neither exists, preserving optionality (liquidity) *is* the optimal strategy. "When the enterprise presents itself as a 'bubble,' a thing to be enjoyed now and expected to end, I cannot rest the whole investment on such a basis." (Keynes paraphrase).
      *   **Status:** **Non-Negotiable.** Failure here implies the theory doesn't grasp the core behavioral consequence of uncertainty.

  4.  **Handling Reflexivity (Beauty Contest Problem):**
      *   **Demand:** Must account for how the adoption of a decision rule (or its anticipation by others) alters the environment the rule was meant to navigate, especially in strategic contexts. Cannot assume a fixed state of the world independent of the agents' beliefs and rules.
      *   **Case/Motivation:** Financial markets (herding, bubbles), policy setting (central bank communication), technology adoption (standards wars). A rule saying "invest when indicator X crosses Y" will cause agents to front-run it, changing the dynamics of X and Y. Forecasting rules become performative.
      *   **Status:** **Highly Desirable, Borderline Non-Negotiable for Real-World Application.** While pure decision theory might abstract from this, any theory claiming relevance to Keynes's domain (investment, markets) *must* handle it. Ignoring reflexivity is ignoring how uncertainty manifests socially.

  5.  **Actionability Without False Precision:**
      *   **Demand:** Must provide genuine *guidance* for action (or deliberate inaction) under uncertainty, but *not* by collapsing into a single recommended action with a pseudo-precise justification. Guidance can be comparative ("Option A dominates B under all plausible scenarios"), qualitative ("Focus on robustness over maximizing expected X"), procedural ("Gather more evidence on Y before acting"), or explicitly recognize valid abstention ("Holding liquidity is justified now").
      *   **Case/Motivation:** Corporate strategy under disruption, personal career choices in volatile industries. "What should I *do*?" is the fundamental question decision theory must address. A theory that only says "It's uncertain" is descriptively true but practically useless. However, prescribing a single "optimal" bet based on manufactured numbers is dangerously misleading.
      *   **Status:** **Non-Negotiable Requirement To Guide Action.** A Keynesian is *not* entitled to refuse this. The point of understanding uncertainty is to act rationally *despite* it, not to be paralyzed. However, the *form* of the guidance is flexible – it doesn't demand a single numerical "best" action, just *usable* reasoning for choice or restraint. Liquidity preference *is* an actionable prescription.

  **Addressing Your Specific Queries:**

  1.  **Non-Negotiables vs. Prejudices:**
      *   **Non-Negotiables:** 1 (No Laundering), 2 (Weight/Direction Separation), 3 (Rational Liquidity), 5 (Action Guidance - in principle). These define the *problem space* of Keynesian uncertainty. Dropping any fundamentally misrepresents Keynes or renders the theory practically inert.
      *   **Contextual/High Priority:** 4 (Reflexivity). Crucial for realism in social/economic domains central to Keynes, potentially less critical for isolated individual decisions against nature. Ignoring it severely limits applicability.
      *   **Prejudice?** The demand for *complete* ordering of all acts under all conceivable uncertainties might be excessive. Some incomparability might be inherent and rational. Theories forcing complete orderings often smuggle in quantification. A theory allowing justified incomparability ("I truly cannot compare these options") can be adequate.

  2.  **"The theory has to say what to actually do":**
      *   **Answer: Yes, it is a requirement.** (See Demand 5 above). A Keynesian is *not* entitled to refuse providing actionable guidance. The guidance *must* respect uncertainty (no false precision), allow for restraint (liquidity), and can be qualitative or comparative, but it must help an agent distinguish better from worse courses of action (including deliberate inaction) under the circumstances. "Do nothing decisive yet" *is* an answer.

  3.  **Joint Unsatisfiability: Treatise vs. General Theory Tension:**
      *   **Your Hunch is Correct: Demanding *Objective* Probability Relations (Treatise Keynes) AND handling *Irreducible Unquantifiable* Uncertainty (General Theory Keynes) is likely a contradiction.**
      *   **Defense:** The *Treatise* vision implies a knowable, objective logical relation between evidence and hypothesis, even if unquantifiable by agents. The *General Theory*'s radical uncertainty often stems from environments that are inherently non-ergodic (future states are not drawable from a knowable past distribution) or involve reflexive, novelty-generating systems. In these cases, the "objective" probability relation *does not exist* to be known or approximated. There is no timeless logical structure to uncover. The future is genuinely open and shaped by unforeseeable innovations and choices.
      *   **Resolution:** A viable theory must abandon the *Treatise* ideal of *objective* probability relations accessible in principle. It must embrace the *General Theory* view: Uncertainty is often ontological, not just epistemological. The focus shifts to *procedural rationality* (how to reason and act without objective probabilities) and *robustness* (making decisions that perform adequately across a wide range of *possible* futures, without assigning likelihoods). Trying to have both objective relations *and* irreducible unquantifiability leads to incoherence.

  **The Single Most Eliminating Desideratum:**

  **1. No Probability Laundering: Must never require or imply precise numerical probabilities.**

  *   **Why it Eliminates Most:** This immediately rules out:
      *   Standard Expected Utility Theory (EUT) & Subjective Expected Utility (SEU): Require precise probabilities.
      *   "Knightian" Models using sets of probabilities (Maxmin EU, α-MEU): Still quantify uncertainty into a set; often collapse to treating the set *as if* it defines risk or require secondary criteria that reintroduce pseudo-precision. They launder "deep uncertainty" into "risk over models."
      *   Fuzzy Logic/Probability: Ultimately relies on numerical membership grades/probabilities.
      *   Most Quantitative Finance Models (CAPM, Black-Scholes extensions): Assume quantifiable risk or parameter uncertainty.
      *   Probabilistic Bayesian Approaches (even "non-informative" priors): Priors always encode *some* quantifiable structure; updating still produces posteriors. Treats "I don't know" as a *specific* (often uniform) probabilistic state.
  *   **What Might Survive (or be starting points):** Theories focusing on:
      *   **Complete Ignorance:** (e.g., Arrow-Hurwicz criterion, MaxMax, MaxMin) but these are often too extreme and violate Desideratum 5 (sensible guidance).
      *   **Robust Satisficing:** (e.g., Starr's Domain Criterion, Info-Gap) focusing on achieving acceptable outcomes across possibilities without likelihoods.
      *   **Case-Based/Similarity Reasoning:** But struggles with novelty (true uncertainty).
      *   **Heuristics/Bounded Rationality:** (e.g., Gigerenzer) but needs integration with uncertainty's epistemic aspects.
      *   **Novel Formalisms:** (e.g., employing possibility theory, belief functions *without* probabilistic interpretation, or qualitative decision algebras). These are the most promising candidates but are underdeveloped compared to probabilistic frameworks.

  **In Summary:** Your core list is sound. The non-negotiables are 1, 2, 3, and 5 (action guidance). Reflexivity (4) is essential for realism. The fundamental tension lies in reconciling the *Treatise*'s logical structure with the *General Theory*'s ontological openness – **abandon the former to embrace the latter.** Rejecting *any* probability laundering is the litmus test that eliminates the vast majority of existing decision-theoretic proposals. Focus your search on theories built explicitly on **qualitative reasoning, robustness across possibilities, procedural rationality, and the legitimacy of liquidity/restraint** as fundamental responses to the void of unquantifiable uncertainty. Beware of any approach that subtly smuggles quantification back in through sets, priors, or fuzzy numbers.
