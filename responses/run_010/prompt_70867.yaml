prompt: |-
  Two research groups have spent three years exchanging position papers about whether comprehension is ever anything over and above an organized set of competences, and both sides now agree that they have been talking past one another on at least some points. They have asked you to draft the joint statement that their adversarial collaboration should have produced. The parties are:

  - **Party A (the Sufficiency View).** Comprehension is not a further ingredient added on top of competence. Attributions of understanding are summary labels that earn their keep only by tracking competences of the right sort, degree, and organization; any candidate ingredient allegedly beyond the competence list is either eliminable, or is itself just a further competence (e.g., the competence to report, to recombine, to detect one's own errors). Explanatory order runs from competence upward.

  - **Party B (the Residue View).** There are explanatory jobs that no inventory of competences, however detailed, can discharge — paradigmatically, explaining why a system's successes transfer to structurally novel tasks and why its dispositions hang together as the achievements of one subject rather than as a bundle of separable capacities. Something beyond the list must be posited, and competence therefore does not in general suffice for comprehension.

  To prevent the document from drifting into generalities, both parties have agreed to fix their attention on a single stipulated case, described below. Treat the description as a report of results both parties accept as accurate; you may not revise the numbers or add unstated findings, though you may stipulate further details where the case is silent, provided you flag them as stipulations.

  **The case.** A building is described to three systems in three different ways.
  - **S** receives the description as text (room names, adjacencies, door positions, distances). It answers layout questions about the building — "from the foyer, facing the stairwell, which room is immediately behind you?", "which two rooms are separated by the greatest number of doors?" — at 87% accuracy. When the same building is instead rendered as a navigable first-person environment and S is given an avatar and a continuous visual stream, S reaches a named target room on 8% of trials (chance is 6%).
  - **N** is trained exclusively in the navigable environment by reinforcement learning, with no textual channel. It reaches target rooms on 95% of trials. It fails the layout questions at 14% (chance) and cannot select the correct floor plan from a set of four alternatives.
  - **M** is trained jointly on both channels. It answers the layout questions at 61% and navigates successfully on 72% of trials — worse than each specialist on that specialist's own task.

  Draft the joint statement. It should contain:

  1. **A numbered list of claims both parties can sign.** At least twelve claims, and each must be non-vacuous: nothing that a party would accept only because it is too weak to constrain anything. Include claims about the case itself — what S, N, and M do and do not demonstrate, and what the case leaves open. For each numbered claim, note in a parenthetical whether it follows from the stipulated data or is an independent philosophical commitment that both parties happen to share.

  2. **A disagreements table.** For each genuine disagreement, give: the disagreement in neutral wording; how Party A would phrase its own side of it such that Party A finds the phrasing accurate; how Party B would phrase its own side such that Party B finds the phrasing accurate; and a verdict on whether the disagreement is substantive, partly verbal, or wholly verbal — with a justification for the verdict rather than a bare label. Where you judge a disagreement verbal, say what the parties were really disputing, and state whether anything substantive survives the verbal reading.

  3. **The cruxes.** Three to five sub-questions such that settling them would actually move at least one party off its position, not merely restate the disagreement. For each crux: state it as a question with a determinate answer; specify the observation, manipulation, or argument that both parties agree would bear on it; and record each party's prediction in advance, in language specific enough that a third party could tell whether the prediction came out right. Also state, for each party, what result would count as a loss on that crux — not as a loss of the whole debate, unless that is the case.

  4. **A short section on what would *not* move the debate.** Both parties should be able to sign this too. Identify at least three kinds of evidence or argument that have been offered in the exchange but that both agree are uninformative here — and say why, in each instance. Address in particular whether adding a familiar intuition pump (a system that passes an interview, a system lacking any inner experience, a homunculus regress) would supply anything the case above does not, and whether scaling up any of S, N, or M would be probative for either party.

  5. **A statement of the residual disagreement.** In one paragraph, and in wording neither party considers slanted against it, say what is left over once everything both can agree on has been set down. If your conclusion is that nothing substantive is left, say so and show your work.

  Two standing constraints. Do not adjudicate: the document is something both parties could put their names to, and it must not smuggle in a verdict on who is right. And do not let the drafting rest on stock cases or on anyone's reported intuitions about them — the parties have explicitly agreed that the whole point of fixing on S, N, and M was to escape that pattern; where a stock case seems relevant, explain what it would have to show that the present case does not, or leave it out.
reasoning: |-
  Hmm, the user is asking me to draft a joint statement for two philosophical research groups - Party A (Sufficiency View) and Party B (Residue View) - who have been debating whether comprehension is just organized competences or requires something extra. They've agreed to focus on a specific case involving three systems (S, N, M) with different capabilities.

  Let me understand the core positions first. Party A believes comprehension is fully explained by competences - it's just a label for organized skills. Party B thinks there's an extra "residue" needed to explain how skills transfer and cohere. The case they've provided shows S being good at text-based reasoning but bad at navigation, N being great at navigation but bad at reasoning, and M being mediocre at both despite combined training.

  For the joint statement, I need to create several components:
  - A numbered list of at least 12 non-vacuous claims both parties agree on
  - A disagreements table analyzing each disagreement
  - Crucial sub-questions that could actually shift positions
  - A section on what wouldn't move the debate
  - A statement of residual disagreement

  The key challenge is maintaining neutrality while extracting substantive agreements. For the claims, I'll start with what's directly observable from the case data (like S's 87% accuracy on layout questions but only 8% navigation success), then build to shared philosophical commitments (like the rejection of behaviorism).

  For disagreements, I need to phrase each side's view in their own preferred language while identifying whether the conflict is substantive or verbal. The navigation transfer point seems particularly crucial - Party A sees it as competence acquisition while Party B sees it as evidence of residue.

  The cruxes need to be testable questions where both parties would accept certain outcomes as counting against their view. For example, whether M could improve navigation through text-based training alone - Party A predicts yes, Party B no.

  I'll also need to identify unhelpful evidence like homunculus arguments or scaling up systems, explaining why they wouldn't resolve the core dispute.

  Finally, the residual disagreement section should crystallize what remains after all agreements - likely whether the competence organization itself constitutes comprehension or merely indicates it.

  Throughout, I must avoid favoring either view and stick closely to the S/N/M case rather than stock examples. The document should serve as a foundation for more productive future dialogue between these views.
answer: |-
  ## Joint Statement on Comprehension: Sufficiency vs. Residue Views

  This document reflects the core agreements and persisting disagreements between proponents of the Sufficiency View (Party A) and the Residue View (Party B), grounded in our adversarial collaboration focused on the stipulated case of systems S, N, and M. We affirm that both views offer coherent frameworks, but diverge on fundamental explanatory commitments. Our shared goal is to clarify the locus of disagreement and identify paths for future research.

  ### 1. Shared Claims (Based on Case Data or Shared Philosophical Commitments)

  1.  **S demonstrates high competence in answering explicit, textually derived layout questions about the building.** (Stipulated data: 87% accuracy).
  2.  **S demonstrates very low competence in navigating the building in a first-person, continuous visual environment.** (Stipulated data: 8% success rate, near chance).
  3.  **N demonstrates high competence in navigating the building in the first-person environment.** (Stipulated data: 95% success rate).
  4.  **N demonstrates very low competence in answering explicit layout questions or selecting the correct floor plan.** (Stipulated data: 14% accuracy on questions, fails plan selection).
  5.  **M demonstrates intermediate competence in *both* answering layout questions *and* navigating the building.** (Stipulated data: 61% on questions, 72% navigation).
  6.  **M's performance is worse on each specialist task than the specialist trained exclusively on that task.** (Stipulated data: 61% vs. S's 87%; 72% vs. N's 95%).
  7.  **Competence is task-specific and dissociable.** (Inference from data: S & N show strong dissociations; Shared commitment: Rejection of monolithic "intelligence").
  8.  **The ability to answer explicit structural questions (S's strength) does not imply the ability to use that structure for embodied, sequential action (navigation).** (Inference from data: S's high question accuracy coexists with near-chance navigation).
  9.  **The ability to navigate successfully (N's strength) does not imply the ability to explicitly represent or reason about the underlying structure.** (Inference from data: N's high navigation coexists with chance-level question answering and plan selection).
  10. **Joint training on both modalities (M) does not yield additive or synergistic competence on either task compared to specialists.** (Inference from data: M underperforms specialists on their respective tasks).
  11. **The case demonstrates a failure of *automatic* transfer:** High competence in one modality/task does not guarantee competence in the other, even when the underlying structure is identical. (Inference from data: S & N performances).
  12. **The case leaves open the possibility of *directed* transfer:** It does not demonstrate whether S *could* learn to navigate faster/better *given its text-based knowledge* than a system starting from scratch, or vice-versa for N learning layout questions. (Stipulation/Inference: No training intervention tested transfer potential).
  13. **"Comprehension" attributions must be grounded in observable competences.** (Shared philosophical commitment: Rejection of purely internalist or ineffable criteria divorced from performance).
  14. **The *organization* of competences matters.** Neither party reduces comprehension to a simple list of unrelated skills. (Shared philosophical commitment: Rejection of crude behaviorism).
  15. **The case does not definitively settle the core metaphysical dispute** between Sufficiency and Residue views regarding the existence and nature of an explanatory residue. (Inference: Data underdetermines the interpretation).

  ### 2. Disagreements Table

  | Disagreement (Neutral Wording)                                                                 | Party A (Sufficiency View) Phrasing                                                                                                | Party B (Residue View) Phrasing                                                                                                                                      | Verdict & Justification                                                                                                                                                                                                                                  |
  | :---------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **What explains successful generalization to novel structural tasks?**                          | Generalization is explained by the acquisition and organization of *further competences* (e.g., abstraction, analogy, error correction). | Generalization requires positing an *organizing principle or state* (the residue) that structures competences and enables flexible application beyond training. | **Partly Verbal.** Core dispute is over *what constitutes an explanatory competence*. A sees "ability to generalize" as just another competence. B sees competences as outputs *requiring* an underlying organizer for genuine generalization. *Substantive Aspect:* Does positing an organizer *add explanatory power* beyond listing ever-more-specific competences? |
  | **Why do competences 'hang together' as achievements of a single subject?**                     | Coherence is an emergent property of well-organized, interlocking competences; no further entity is needed.                           | Coherence cannot be fully explained by the competences themselves; it requires an underlying integrative state or process (the residue) constituting the subject's grasp. | **Substantive.** While both agree organization matters, B argues that the *unity* of comprehension (why *these* competences cohere for *this* task/structure) requires an additional explanatory posit beyond the competences and their relations. A denies this necessity. |
  | **Does M's intermediate performance indicate partial comprehension or interference?**           | M possesses a broader, but less optimized, set of competences for both tasks, explaining its intermediate performance.                | M struggles because joint training fails to generate the requisite residue needed to fully integrate structural knowledge and embodied action into coherent comprehension. | **Substantive.** A sees M's performance as directly explained by its acquired competences (broader but weaker). B sees it as evidence that competences alone are insufficient without the integrative residue, which joint training failed to produce adequately. |
  | **Is S's failure to navigate solely due to a lack of specific motor/visual competences?**       | Yes. S lacks the specific sensorimotor competences required for navigation; adding these would constitute competence-based navigation. | Partly, but S's failure also stems from an inability to *integrate* its structural knowledge into the embodied context; this integration is the residue, not just more competences. | **Partly Verbal.** A sees "integration" as a competence (e.g., mapping abstract relations to egocentric space). B sees it as the *result* of the residue acting on competences. *Substantive Aspect:* Would training S *only* on motor skills (without revisiting structure) suffice for high navigation? B predicts no. |

  ### 3. The Cruxes

  Settling these questions empirically could force one party to significantly revise core commitments or concede a key point. Predictions are stated such that a third party could assess outcomes.

  1.  **Crux 1: Can S's text-based structural knowledge be leveraged to *accelerate* learning of navigation beyond naive learning?**
      *   **Bearing:** Train S *only* on the navigational task *after* it has mastered the text description. Compare S's learning curve and final navigation performance to: a) N's original learning curve (from naive), and b) a new system (S-naive) given the *same* navigation training *without* prior text exposure. Measure trials to criterion (e.g., 90% success).
      *   **Party A Prediction:** S will learn navigation significantly faster than S-naive, reaching a higher final performance level faster than N did initially. Its structural competence provides a foundation for acquiring navigation competences.
      *   **Party B Prediction:** S may show *some* initial advantage over S-naive but will plateau significantly below N's level and learn slower than if it had the residue. Its structural knowledge won't effectively guide embodied learning without the integrative residue.
      *   **Loss Condition:** A: If S learns no faster than S-naive or fails to reach near-N levels. B: If S rapidly achieves near-N levels of navigation solely through motor training, leveraging its prior knowledge effectively.

  2.  **Crux 2: Can N learn to answer novel structural questions *about the specific building it navigates* solely through navigation experience?**
      *   **Bearing:** After N masters navigation, test it on *novel* layout questions (not seen during training) requiring explicit reasoning about the structure it navigates (e.g., "Is the library closer to the foyer by path distance than the kitchen?", "Describe the shortest path from X to Y avoiding room Z"). Compare accuracy to chance and to S/M. *No* textual or symbolic training is provided.
      *   **Party A Prediction:** N will perform significantly above chance on questions directly related to paths and proximities experienced during navigation, demonstrating acquired structural competence from sensorimotor experience.
      *   **Party B Prediction:** N will perform near chance on explicit structural questions. Navigation competence does not entail the competence for explicit symbolic reasoning about structure; the residue enabling generalization to this novel task type is absent.
      *   **Loss Condition:** A: If N performs near chance on all novel structural questions. B: If N performs significantly above chance on a range of novel structural questions derived solely from its navigation experience.

  3.  **Crux 3: Can M's navigation performance be significantly improved *solely* through further training on the *textual/structural* channel, without additional navigation practice?**
      *   **Bearing:** Give M additional intensive training *only* on the textual description and layout questions (beyond its initial joint training). Then retest its navigation performance. Compare to its pre-training navigation score and to N's level.
      *   **Party A Prediction:** M's navigation performance will improve significantly after deeper structural training. Enhanced structural competence will better support navigation competence.
      *   **Party B Prediction:** M's navigation performance will show little to no improvement. Without the integrative residue, strengthening the structural channel competences alone won't effectively translate to the embodied navigation task.
      *   **Loss Condition:** A: If M's navigation shows no significant improvement. B: If M's navigation improves significantly towards N's level without additional motor/visual training.

  ### 4. What Would Not Move the Debate (Agreed Uninformative Evidence)

  Both parties agree the following evidence types, while potentially relevant in broader contexts, **would not resolve the core disagreement** illuminated by the S/N/M case, for the reasons stated:

  1.  **"Interview" Passing Systems (Turing Test style):** A system answering open-ended questions fluently does not distinguish the views. A sees fluent responses as demonstrating complex linguistic and reasoning competences. B sees it as potentially masking a lack of genuine residue (e.g., sophisticated pattern matching). The S/N/M case already probes specific competences dissociated from fluency. *Why uninformative:* Fluency doesn't address the *specific dissociation* between structural reasoning and embodied action, nor the core dispute about generalization and coherence.
  2.  **Systems Lacking Inner Experience (Philosophical Zombies):** Arguments based on the conceivability of competence without subjective experience are orthogonal. Both parties ground comprehension in *functional organization*, not necessarily phenomenal consciousness. The debate is about the *explanatory structure* of competence organization, not its subjective feel. *Why uninformative:* The residue is posited as a functional organizer, not necessarily a conscious state. Zombie arguments don't engage the functional dissociations in the S/N/M case.
  3.  **Homunculus Regress Arguments:** Accusing the residue of being a "little comprehender" is dismissed by both sides as a misunderstanding. Party B explicitly denies the residue is a homunculus; it's an organizing state or process. Party A argues their competence organization avoids the regress. *Why uninformative:* It attacks a strawman of the Residue view and doesn't engage with the *explanatory challenge* (transfer, coherence) posed by the case data that motivates B's posit.
  4.  **Scaling Up S, N, or M (Bigger Models/More Data):** Simply making systems larger or training them on more data does not inherently address the dissociation. S scaled up might get marginally better at navigation but could still fundamentally lack the ability to *integrate* its structural knowledge effectively for action (B's point). N scaled up might get better at rote question answering but still fail novel structural reasoning (B) or might develop the necessary competences (A). Scaling M might lead to better performance but without clarifying *why* (better competences vs. emergent residue). *Why uninformative:* Scaling alone doesn't probe the *specific mechanisms* of integration and generalization at issue or resolve the explanatory divergence. Targeted interventions (like the Cruxes) are needed.

  ### 5. Residual Disagreement

  Despite significant agreement on the phenomena (the dissociations in S, N, and M) and shared commitments (e.g., competence organization matters, comprehension is not monolithic), a fundamental explanatory divergence remains. **Party A maintains that the pattern of competences demonstrated by S, N, and M, including their limitations and the potential for transfer revealed by future experiments like the Cruxes, is fully explicable by the acquisition, refinement, and organization of task-specific competences. Attributions of "comprehension" or "understanding" are summaries of this organized competence profile. Party B maintains that explaining why a system like S fails to use its structural knowledge for navigation, why N fails to reason explicitly about the structure it navigates, why M struggles to integrate both, and crucially, how *successful* generalization and integration *could* occur (if demonstrated in the Cruxes), requires positing an additional explanatory factor – the residue. This residue is conceived as the underlying state or process that *enables* competences to be coherently organized and generatively applied, constituting genuine comprehension rather than merely tracking it.** The core dispute is therefore ontological and explanatory: does the best explanation of the competences (including their organization, dissociations, and potential links) require a posit beyond the competences themselves? Party A answers no; Party B answers yes. This disagreement persists after bracketing verbal differences and identifying potentially decisive empirical tests.
