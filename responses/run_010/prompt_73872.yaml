  ### **Decision Tree: Coordination Without Public Announcements**
  **Start**: Your system has:  
  - Agents with noisy private signals about a shared state.  
  - A message channel with reliability 0.999 (not public; messages are private and pairwise).  
  - No public announcements/events.  

  1. **Q1: Can coordination fail catastrophically?**  
     *(Catastrophic failure = Unbounded losses, safety violations, or irreversible harm from miscoordination, even with very low probability)*  
     - **Yes** → Go to Q2.  
     - **No** → Go to Q3.  

  2. **Q2: Are you allowed to add a genuine public event?**  
     *(Genuine public event = All agents witness the same event simultaneously, e.g., a shared broadcast or synchronized physical signal)*  
     - **Yes** → **Leaf: Public Situation Only**  
       *Position: Only public events generate common knowledge. Redesign solves the problem.*  
     - **No** → Go to Q4.  

  3. **Q3: Is a fixed depth of mutual knowledge sufficient?**  
     *(e.g., "I know you know the state" (depth 2) is enough for actions, regardless of deeper knowledge)*  
     - **Yes** → Go to Q5.  
     - **No** → Go to Q6.  

  4. **Q4: How deep must iterated knowledge go?**  
     *(Measure the depth k needed: e.g., depth 5 = "I know you know I know you know I know the state")*  
     - **k ≤ 10** → Go to Q7.  
     - **k > 10** or **Unbounded** → Go to Q8.  

  5. **Q5: Can you achieve depth-k knowledge reliably?**  
     *(With reliability 0.999, probability of success for depth k is ~0.999ᵏ. Reliable = P(success) > 0.99 or task-specific threshold)*  
     - **Yes** → **Leaf: Finite Iteration Suffices**  
       *Position: Finite-depth mutual knowledge enables coordination; common knowledge is overkill.*  
     - **No** → Go to Q9.  

  6. **Q6: Do actions depend on the infinite depth?**  
     *(Would agents act identically with depth 100 vs. common knowledge?)*  
     - **Yes** → Go to Q8.  
     - **No** → **Leaf: High-Probability Common Belief**  
       *Position: Near-common belief (e.g., P(all believe all believe...) > 0.999) suffices for practical coordination.*  

  7. **Q7: Does the system converge with high probability?**  
     *(After k rounds, do agents coordinate correctly with P > 0.999?)*  
     - **Yes** → **Leaf: Finite Iteration Suffices**  
     - **No** → **Leaf: High-Probability Common Belief**  
       *(If convergence isn’t perfect but P(failure) is negligible, belief substitutes for knowledge.)*  

  8. **Q8: Is payoff loss continuous with probability?**  
     *(Does tiny P(miscommunication) cause tiny losses, or can it trigger arbitrary losses like in the email game?)*  
     - **Continuous losses** → **Leaf: High-Probability Common Belief**  
       *Position: Bounded payoffs smooth out the email-game discontinuity.*  
     - **Discontinuous losses** → **Leaf: Pessimist (Email-Game Discontinuity)**  
       *Position: Without common knowledge, high reliability still risks catastrophe due to belief hierarchies.*  

  9. **Q9: Can bounded rationality approximate common knowledge?**  
     *(Do agents treat depth-10 knowledge as "effectively common" due to cognitive/computational limits?)*  
     - **Yes** → **Leaf: Finite Iteration Suffices**  
     - **No** → **Leaf: Pessimist (Email-Game Discontinuity)**  

