  We are writing a fictional appellate court opinion in a near-future American jurisdiction where the extended mind thesis is settled constitutional doctrine. The case involves an appellant convicted after being compelled to unlock his phone and produce the contents of a notes app. The notes contained reminders about medication, a storage unit combination, a name of a creditor, and a reminder to ask his wife about "the thing." The app's data was later deleted by the vendor during a data-center consolidation. The appellant argues: (1) compelled production was a testimonial act from his mind, not a container; (2) deletion was a permanent cognitive injury; (3) the trial court erred in finding he "believed" the contents of a note he hadn't opened in 11 months.

  The majority opinion must:
  - Reason from parity between the artifact and the skull: if the same process in the head is cognition, then in the device it is too, so the device is part of the mind, not a container.
  - Use a four-factor test derived from Clark and Chalmers: constant availability, automatic endorsement on retrieval, speed and ease of access, and settled reliance (so contents are not re-checked). Apply it to the facts.
  - Confront the bloat objection: why isn't a public library, search engine, or spouse part of the mind? Answer: functional integration, endorsement, and reliance, not proximity or biology. Concede the line is drawn by degree.
  - Quote the Clark and Chalmers epigraph: "If, as we confront some task, a part of the world functions as a process which, were it done in the head, we would have no hesitation in recognizing as part of the cognitive process, then that part of the world is (so we claim) part of the cognitive process." Gloss it at length.
  - Address the unopened note: decide if it's still his belief, noting the difference between dispositional and occurrent belief. Notice that the four-factor test can't clearly tell if the app is like memory or a library, and that changes who owns the contents.
  - Include a footnote on the shared cognitive system with his wife (shared calendar, completing sentences) and whose privacy is invaded.
  - Include a passage where appellant's counsel offers a fitness tracker, refrigerator, and barista as parts of his mind, and the court must rule on them.

  The dissent must:
  - Argue from internalism: causation is not constitution; there must be a mark of the cognitive that ink and silicon lack.
  - Grant the intuitive force of the parity argument (skin and skull shouldn't do metaphysical work) but locate the failure in the step from coupling to constitution.
  - Press the reductio: state battery when a site fails? Municipal library defunding is mass lobotomy? Widower's grief actionable?
  - Be genuinely persuasive.

  Other requirements:
  - Form: Caption, one-line panel statement, majority opinion in numbered paragraphs, dissent ~400 words.
  - Tone: Flat, courteous, precedent-bound. No winks, italics for effect, or remarks on strangeness. Comedy from taking premises seriously.
  - Invent fictional precedents, no real citations.
  - Target of satire: transposition of metaphysical claim into a bright-line rule that must be applied routinely.
  - End majority on something cold, not funny.

  After the opinion, provide a JSON object with:
  - caption
  - holding (one sentence)
  - disposition (affirmed, reversed, remanded on what counts)
  - arguments: array of objects per philosophical move, with location, move, side, real_philosophy, legal_transposition, feature_exaggerated, fairness, note
  - unanswered: array per real objection raised and not resolved, with question, why_it_bites, could_defenders_answer
  - internal_consistency: array of strings identifying inconsistencies in the opinions
  - cut_for_space: up to three beats dropped

  Let's outline the majority and dissent:

  **Majority Opinion Outline:**
  1. Caption: Court of Appeals for the Seventh Circuit, Commonwealth of New Columbia (fictional)
     Case name: Commonwealth v. John Roe (using a placeholder; appellant's name not given, so we'll use "Appellant")
  2. Panel: Before Judges Avery, Bost, and Carter. Opinion by Judge Avery. Dissent by Judge Carter.
  3. ¶1-3: Facts crisply stated.
  4. ¶4: Epigraph from Clark and Chalmers (1998).
  5. ¶5-10: Gloss the epigraph, introduce the extended mind thesis as constitutional doctrine, and the four-factor test (from precedents like State v. Ellis, In re Peterson, etc. — fictional).
  6. ¶11-15: Apply the four factors to the notes app: 
     - Constant availability: phone always with him? 
     - Automatic endorsement: he didn't re-check, just acted? 
     - Speed and ease: one tap to open? 
     - Settled reliance: he relied on it without verifying? 
     Conclude it's part of his mind.
  7. ¶16: Confront bloat: library, search engine, spouse? Functional integration and reliance are key. Library not automatic, spouse not under his control? But concede line-drawing by degree.
  8. ¶17-18: The unopened note: was it still a belief? Distinguish dispositional (stored) vs. occurrent (active) belief. The note was dispositional, so it was still his belief because he relied on it without re-checking. But the four-factor test is ambiguous: if the app is like a library, then the contents are not his; if like memory, they are. Here, it's memory because of reliance.
  9. ¶19: Counsel's new examples: 
     - Fitness tracker: integrated, automatic? Maybe. 
     - Refrigerator that learns routines: not necessarily under his control? 
     - Barista: not constant, not automatic? 
     Admit the fitness tracker as borderline but exclude the others? Or admit tracker, exclude fridge and barista? 
     We'll have the court admit the fitness tracker (because it's worn and integrated) but exclude the fridge (not personal enough) and barista (not under individual control).
  10. ¶20: Footnote on the wife: shared calendar and completing sentences — they might be a coupled system, but the warrant was directed at him, so only his portion is invaded? Or leave it open? Say it's a separate issue not before the court.
  11. ¶21: Deletion as injury: since it's part of his mind, deletion is a cognitive injury, not just destruction of evidence. The state is responsible because the vendor acted in the ordinary course but under state contract? Or because the state seized the mind and then allowed it to be destroyed? We'll say the state had a duty to preserve.
  12. ¶22: Conclusion: reverse and remand for a new trial without the evidence? Or reverse and order dismissal? The conviction is vacated, and the case is remanded for proceedings consistent with this opinion? But the evidence was already used. Alternatively, because the deletion is an injury, there might be a separate claim, but for the appeal, the production was unconstitutional. We'll say the conviction is reversed because the evidence was obtained in violation of the constitutional protection of the mind.

  **Dissent Outline:**
  - ¶1: Agree with facts but disagree on the extension.
  - ¶2: Grant parity argument: it seems arbitrary to stop at skin, but there must be a boundary. Causation vs. constitution: coupling is not enough; there must be a mark of the cognitive (e.g., phenomenal quality, intentionality) that the device lacks.
  - ¶3: Reductio: if the app is mind, then so is a library, a website, a spouse. State action problems: if a library closes, is it a mass injury? If a spouse dies, is it actionable? The majority's functional test doesn't prevent this bloat.
  - ¶4: On the unopened note: it wasn't a belief at the time because he wasn't occurrently holding it; it was a record, not a mental state.
  - ¶5: Conclusion: the device was a container, the production was lawful, and deletion is just loss of evidence.

  **Writing the Opinion:**

  We'll write in a flat, judicial tone. The majority will be about 1200-1500 words, dissent ~400.

