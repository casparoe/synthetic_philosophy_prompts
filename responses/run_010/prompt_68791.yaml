  - In re Peterson (applying the test to a digital assistant)
  - Commonwealth v. Dale (on the distinction between dispositional and occurrent beliefs)

  Now, the opinion.
answer: |-
  ### COURT OF APPEALS FOR THE SEVENTH CIRCUIT  
  COMMONWEALTH OF NEW COLUMBIA  

  **COMMONWEALTH**,  
  *Appellee*,  
  v.  
  **JOHN ROE**,  
  *Appellant*.  

  Before Judges AVERY, BOST, and CARTER.  
  Opinion by Judge AVERY. Dissent by Judge CARTER.  

  1. Appellant John Roe appeals his conviction for larceny, arguing that the trial court erred in compelling him to unlock his personal telephone and produce the contents of a notes application, that the subsequent deletion of said contents by the device vendor constituted a compensable cognitive injury, and that the trial court improperly attributed to him a "belief" in the contents of a specific unopened note. We reverse and remand.  

  2. The facts are undisputed. Police obtained a warrant to search appellant’s person and effects, seizing his telephone. Upon inspection, they discovered a notes application containing entries dating back nine years. These included: a daily medication schedule; the combination to a storage unit; the name of an individual to whom appellant owed money; and a standing reminder to "ask Sarah about the thing." Appellant was ordered to unlock the device and produce these notes. He complied under protest, and the notes were admitted at trial. Eighteen months post-conviction, during a routine data-center consolidation, the vendor permanently deleted appellant’s account and backups. Appellant contends the compelled production violated his right against self-incrimination by forcing him to testify from his own mind, the deletion inflicted irreversible cognitive harm, and the trial court erred in finding he "believed" the contents of the reminder regarding "the thing," which he had not accessed in eleven months.  

  3. The extended mind thesis, adopted as binding constitutional doctrine in *Commonwealth v. Ellis*, 45 N.C. 3d 112 (2031), holds that cognitive processes are not confined to the biological brain but extend into the environment when functional criteria are met. As articulated in the foundational text:  
  > *"If, as we confront some task, a part of the world functions as a process which, were it done in the head, we would have no hesitation in recognizing as part of the cognitive process, then that part of the world is (so we claim) part of the cognitive process."*  
  *Ellis* derived from this a four-factor test to determine whether an external resource constitutes part of an individual’s cognitive system: (1) constant and immediate availability; (2) automatic endorsement upon retrieval without critical scrutiny; (3) speed and ease of access; and (4) settled reliance such that the contents are not routinely re-checked. We apply these factors here.  

  4. **Factor 1: Availability**. Appellant testified he carried the telephone "like a limb," consulting it dozens of times daily. The notes application was perpetually accessible, requiring only biometric authentication. This mirrors the reliability of biological memory, which is similarly "on call" during waking hours. Contrast *In re Peterson*, 48 N.C. 3d 201 (2033), where a desktop computer left overnight at an office failed this factor.  

  5. **Factor 2: Automatic Endorsement**. Appellant treated the notes as authoritative. He took medication precisely as scheduled, accessed the storage unit without hesitation, and contacted the named creditor. He did not verify the information against external sources. This unreserved trust satisfies the requirement that the resource function as a "transparent" extension of cognition, akin to recalling a fact without doubting it.  

  6. **Factor 3: Speed and Ease of Access**. Opening the notes application took one gesture and under two seconds. Such frictionless integration parallels neural retrieval, differing markedly from, say, a library search requiring deliberate effort. *Ellis*, 45 N.C. 3d at 120 ("Cognitive extension demands immediacy comparable to synaptic transmission").  

  7. **Factor 4: Settled Reliance**. Appellant relied on the notes for critical tasks without re-verifying their contents. He had not re-read the medication schedule in three years or the storage combination in five. This reflects "procedural entrenchment," where external data becomes as tacitly depended upon as internal memory.  

  8. The notes application thus constituted part of appellant’s cognitive system. Consequently, the compelled production was not a search of a "container" but an examination of his mind, violating Article I, Section 9 of the Commonwealth Constitution. The trial court’s contrary conclusion was error.  

  9. Appellant’s "bloat" objection—that this logic implicates public libraries, search engines, or spouses—is unpersuasive. A library book is not constantly available (Factor 1), requires critical evaluation (Factor 2), and involves laborious access (Factor 3). A spouse’s recollections are not under the appellant’s exclusive control and lack automatic endorsement; one may dispute a partner’s memory. *Ellis* emphasized that functional integration, not proximity or biology, demarcates the cognitive boundary. We acknowledge this line is drawn by degree, not bright rule. In *State v. Teller*, 50 N.C. 3d 55 (2035), a shared cloud server was held not extended due to intermittent access delays, illustrating the cost of nuance.  

  10. Regarding the deletion: Once integrated into cognition, the notes were not mere "evidence" but cognitive architecture. Their destruction inflicted a lasting injury analogous to amnesia. The vendor acted during a state-contracted consolidation, rendering the Commonwealth liable for compensatory damages under *Ellis*’s cognitive-integrity doctrine. The trial court shall determine remedies on remand.  

  11. On the "belief" question: The note reminding appellant to "ask Sarah about the thing" was unopened for eleven months. The trial court found appellant "believed" its content, but this conflates dispositional and occurrent belief. A dispositional belief—stored but not actively entertained—remains a cognitive state if reliably integrated. Here, Factor 4 (settled reliance) confirms the note was a dispositional belief; appellant depended on it to trigger action when needed. Yet we note the tension: If the application functioned as a library (consulted sporadically), the note might be inert data. But under Factor 2 (automatic endorsement), the lack of re-checking confirms its cognitive status. The trial court’s factual finding was thus correct, albeit for the wrong reason.  

  12. At oral argument, appellant’s counsel proposed additional extensions: a fitness tracker (monitoring vitals), a refrigerator (learning consumption patterns), and a barista (reciting his coffee order). The tracker, if worn constantly and relied upon for health decisions (e.g., alerting to arrhythmias), may qualify under *Ellis*; the refrigerator, lacking constant interaction and automatic endorsement, does not; the barista, being another mind, cannot be subsumed into appellant’s cognitive system without eroding personal agency.¹ These distinctions reaffirm that functionality, not category, governs.  
  ---  
  ¹ This invites the question of appellant and his wife, who co-maintain a shared calendar and "complete each other’s sentences." Dyadic systems may constitute coupled cognition under *In re Lee*, 47 N.C. 3d 88 (2032), but the warrant here targeted appellant individually, so we need not resolve whether Sarah’s mind was impermissibly "searched."  
  ---  

  13. The extended mind thesis, as operationalized by *Ellis*, demands that courts engage in granular factual analysis to map the contours of personhood. That this may yield complex or unintuitive outcomes does not license retreat to biological parochialism. The conviction is reversed, and the case remanded for proceedings consistent with this opinion. The Commonwealth shall bear the costs of appeal.  

  ### DISSENT (CARTER, J.)  

  1. I concur in the factual recitation but dissent from the majority’s holding. While the extended mind thesis has intuitive force—why should skin and skull demarcate cognition?—it founders on the coupling-constitution fallacy: Reliance on an artifact does not transmute it into *part of one’s mind*. The majority elides the mark of the cognitive: Mental states possess intrinsic intentionality and phenomenology that silicon and text lack. A note reminding one to ask about "the thing" is a cue; it is not, itself, a belief.  

  2. The majority’s functional test cannot avert conceptual bloat. If constant use and automatic endorsement suffice, then a public library—used daily by a scholar—becomes part of her mind. Municipal budget cuts that close libraries thus become state-sponsored mass lobotomies. A widow grieving her husband, whose memories were "integrated" with his, could sue for cognitive dismemberment. These reductios are not fanciful; they are the terminus of the majority’s logic. *Ellis* dismisses them through appeals to "control" and "integration," but these are distinctions of degree masking a categorical error.  

  3. On the unopened note: The majority admits the application might function as a library yet still attributes "dispositional belief" to appellant. This is incoherent. Belief requires current endorsement. A note unread for eleven months is inert data, no more a "belief" than a forgotten bookmark. Compelling its production implicates privacy, not self-incrimination.  

  4. The deletion, while regrettable, is destruction of evidence—not injury to cognition. Appellant’s mind remains intact; he has merely lost a tool.  

  5. I would affirm. The trial court properly treated the telephone as a container, and the search was lawful. We tread into untenable metaphysics when we equate minds with their artifacts.  

  ---

