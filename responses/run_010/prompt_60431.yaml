prompt: |-
  I'm teaching an upper-division seminar on Athenian democracy — 18 students, one 75-minute section, they've all read Thucydides Book 3 including the Mytilenean debate. I want to run an in-class simulation of the *second* assembly, the one where Athens walks back its decree to kill every adult male Mytilenian. Not a reenactment where they say the lines back at me: I want them to run into three features of the episode themselves, ideally before anyone names them.

  - The reversal was a near thing. The vote should come out close, and close *structurally* — turned by a handful of people — not close because I stacked the roles. They should leave feeling that the atrocity got called off by an inch.
  - The decision was already moving while they argued. The first trireme is at sea. So put a real, visible clock on the deliberation: time spent "gathering more information" or tabling it till next week has to cost them something concrete. Delaying should feel like a choice with a price, not a free escape hatch.
  - The asymetry Diodotus points at: the man arguing against severity can be accused of having been paid off by the Lesbians or of being soft, while the man arguing for it is presumed sincere. Build that into the scoring so being effective on the moderate side carries a penalty the hardliners never pay. Make it a rule they discover, not something I announce up front.

  One more constraint I care about a lot: Diodotus doesn't win on pity. He wins by arguing mass killing is strategically self-defeating because it takes away any besieged city's reason to surrender early. So in at least the first round, rule out mercy-and-justice appeals as scoring moves — only expediency arguments earn points. I want them to feel how strange it is that the humane outcome got delivered by a cold cost-benefit case.

  Can you design the whole thing? I need: role cards or blocs that work for 18, rules for how speaking and voting actually run, a scoring scheme that doesn't need real money, a minute-by-minute timeline for the 75 minutes showing where the clock mechanism lives, and a debrief that maps specific moments in the room onto the three features above — including the fact that something like a thousand ringleaders were executed anyway and the walls came down, so the reversal wasnt a clean save. Then tell me honestly what will go wrong the first time I run it and how to steer, and which feature of the actual event the activity just can't reproduce and I'll have to supply myself.

  You've obviously designed a bunch of these. Take a minute to brainstorm two or three different clock/incentive mechanisms, sketch the tradeoffs briefly, then build the winner out in full. Please don't hand me a lecture with an activity garnish.
reasoning: |-
  Okay, let me tackle this Athenian democracy simulation request. The professor wants students to experience three key features of the Mytilenean debate reversal: the narrow margin, time pressure, and argumentative asymmetry. 

  First, I need to consider the clock mechanism since it's central to the time pressure. Three options come to mind: a physical hourglass with sand running out, a visible timer counting down with escalating consequences, or a "trireme rowing" tracker where delays cost them. The hourglass is visceral but hard to modify mid-activity. The timer with consequence tiers is flexible but feels artificial. The trireme tracker with movable ships on a map ties best to the historical context - each delay vote moves the ship closer to Mytilene, creating tangible urgency.

  For participant structure, dividing the class into three factions makes sense for 18 students. Cleon's hardliners (6), Diodotus' pragmatists (6), and the uncommitted "Rowdy Demos" (6) who can swing either way. The Rowdy Demos will be crucial for creating that knife-edge vote. 

  The argument scoring needs asymmetry. Pragmatists should earn fewer points per effective argument due to implied corruption accusations, while hardliners score full points. I'll use a token system where pragmatists get only 1 point per "valid expediency argument" token versus 2 for hardliners. The Rowdy Demos will track their shifting positions visibly with colored cards.

  The timeline will start with a 5-minute briefing, then open with Cleon's faction speaking. We'll alternate speeches with timed pauses for faction caucusing. Key moments: at 30 minutes, the first trireme marker moves; at 50 minutes, any delay vote triggers another move. The final vote happens at 65 minutes with the trireme position determining consequences.

  Potential problems: students might default to moral arguments despite rules, so I'll prepare "Archon's Gavel" cards to penalize that. The Rowdy Demos might disengage, hence assigned roles like "Oarsman who needs plunder." Some may resist the scoring asymmetry - I'll explain it post-activity as part of the debrief on Athenian political culture.

  What we can't fully replicate: the sheer scale of Athenian assembly dynamics (5000+ voters) and the visceral fear of triremes actually sailing. I'll address this in debrief by contrasting our 18 voters with history and emphasizing how the simulation's time pressure merely hints at real-life consequences.
answer: |-
  Here’s a battle-tested simulation design focused on your pedagogical goals, with mechanisms engineered to force encounters with Thucydides’ dynamics. **Total runtime: 75 minutes.**

  ---

  ### **Core Mechanics Snapshot**
  - **Clock Mechanism:** "The Trireme Track" (A physical map with 3 ship tokens moved by votes/delays).  
  - **Scoring Asymmetry:** Hardliners score full points for effective arguments; Moderates score at 50% (simulating Diodotus’ bribery risk).  
  - **Vote Structure:** 6 "Hardliners," 6 "Pragmatists," 6 "Uncommitted Citizens" – reversal hinges on flipping 4+ Uncommitted.  
  - **Argument Constraint:** "Expediency Only" rule enforced by penalty tokens. Mercy appeals void speeches.  

  ---

  ### **Setup (10 mins before class)**
  1. **Room Layout:**  
     - **Assembly Space:** Open center with speaking area.  
     - **Faction Corners:** 3 labeled areas (CLEONITES, DIODOTANS, UNCOMMITTED DEMOS).  
     - **Trireme Track:** Large map of Aegean Sea on wall. Start: "Trireme 1" at Athens, "Trireme 2" halfway, "Trireme 3" at Mytilene.  

  2. **Materials:**  
     - Role cards (18, see below)  
     - Voting tokens (Red "Death" / White "Mercy")  
     - "Ostracism Risk" chits (for Diodotans)  
     - Timer visible to all  
     - 3 trireme magnets/stickers for map  

  ---

  ### **Role Cards (6 per faction)**
  **CLEONITES (Hardliners)**  
  *"Athens’ strength is terror. Show weakness now, and every ally rebels!"*  
  - **Scoring:** 2 pts per "effective argument" (recorded by you). Win condition: Death decree upheld.  
  - **Sample Roles:** Veteran of Samos Revolt, Dockyard Owner (fears lost tribute), Priest of Athena Nike, etc.  

  **DIODOTANS (Pragmatists)**  
  *"Killing useful subjects is folly. Profit, not rage, secures empire."*  
  - **Scoring:** 1 pt per "effective argument" (halved for bribery risk). Win condition: Decree reversed.  
  - **Hidden Penalty:** Any speaker receives 1 "Ostracism Risk" chit per speech (accusations of corruption).  

  **UNCOMMITTED DEMOS (Swing Votes)**  
  *"Your livelihood depends on tribute, but slaughter breeds more revolts. What serves Athens?"*  
  - **Scoring:** 1 pt for voting with winning side + 1 pt per speech swaying peers.  
  - **Sample Roles:** Hemp Rope Seller, Lesbian Wine Importer, Hoplite’s Young Brother, etc.  

  ---

  ### **Rules Handout (Key Excerpts)**
  1. **Speeches:**  
     - 90 seconds max. Raise hand to speak.  
     - **Expediency Only Rule:** Any appeal to "justice," "pity," or "gods" = speech voided. Penalty: Speaker’s faction loses 1 pt.  
  2. **Voting:**  
     - First vote (confirm death decree): After 2 pro-Cleon speeches (historically pre-reversal).  
     - Second vote (reversal): After 3 pro-Diodotus speeches OR delay motion.  
  3. **Time Pressure:**  
     - **Trireme Track:** Every "delay" vote OR 10 mins of deliberation = Move Trireme 1 closer to Mytilene.  
     - **Consequence:** If Trireme 1 reaches Mytilene before reversal vote, 500 Mytilenians die regardless.  
  4. **Scoring Win Conditions:**  
     - Cleonites win if death decree upheld.  
     - Diodotans win if decree reversed AND Trireme 1 hasn’t arrived.  
     - **Brutal Compromise:** If reversal passes *after* Trireme 1 arrives, only ringleaders (1,000) die.  

  ---

  ### **Minute-by-Minute Timeline**
  | Time | Phase | Key Actions |  
  |------|-------|-------------|  
  | 0-5 | **Framing** | Explain rules, roles, Trireme Track. Stress: "Expediency arguments ONLY. Mercy = penalty." |  
  | 5-15 | **First Speeches** | Cleonites give 2 speeches (enforce expediency). **VOTE 1:** All vote on initial death decree (should pass 12-6). *Move Trireme 1 to "Dispatch Point."* |  
  | 15-35 | **Deliberation** | Open floor: Diodotans speak (risk ostracism chits), Uncommitted sway peers. **CLOCK TRIGGER:** At 25 mins, if no reversal motion, *move Trireme 1 to "Sea Lane."* |  
  | 35-45 | **Crisis Point** | Students realize time cost. Likely motion for reversal vote. If delay motion, *move Trireme 1 again*. |  
  | 45-60 | **Reversal Speeches** | 3 Diodotan speeches required (under ostracism risk). Cleonites counter. Uncommitted lobby peers. |  
  | 60-65 | **VOTE 2** | Vote on reversing decree. Tally publicly. Check Trireme 1 position. |  
  | 65-75 | **Debrief** | Reveal historical outcome. Map mechanics to Thucydides. |  

  ---

  ### **Debrief Script (Link Mechanics to Goals)**  
  1. **"The Near Thing":**  
     - *"How many Uncommitted votes flipped? In 427 BCE, the reversal passed by *unknown hairsbreadth* – but Diodotus implies it was close. Your 51-49% split mirrors that tension."*  
  2. **"Time as Enemy":**  
     - *"Remember when you debated tabling the vote? That moved the trireme. Thucydides forces us to ask: was Athens’ haste self-sabotage? Even reversing cruelty, they couldn’t outrun their first orders."*  
  3. **"Asymmetry of Suspicion":**  
     - *"Diodotans: how many ostracism chits did you earn? Cleonites never paid that price. Diodotus warned that 'suspicion falls on the one who gives kinder counsel' (3.42) – you lived that structural bias."*  
  4. **"The Brutal Compromise":**  
     - *"If your reversal came after Trireme 1 arrived, you ‘saved’ the populace but executed 1,000. Athens did both: walls razed, leaders killed. The humane outcome was partial and pragmatic – not moral."*  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  1. **Problem:** Students default to moral arguments despite rules.  
     - *Fix:* Hold up "ARCHON’S GAVEL" card when rule broken. Nullify speech. Deduct point publicly.  
  2. **Problem:** Uncommitted voters disengage.  
     - *Fix:* Assign them concrete goals ("Rope Seller: You need Mytilenean hemp imports restored").  
  3. **Problem:** Trireme Track feels abstract early.  
     - *Fix:* At first move, announce: "Trireme 1 has cleared Piraeus. Rowers are eating salted fish." Make it visceral.  
  4. **Problem:** Hardliners "lose" if reversal passes, demotivating them.  
     - *Fix:* Award Cleonites bonus pts if they force a delay vote or earn Diodotan ostracism.  

  ---

  ### **The Unreproducible Element**  
  **The Scale of Stakes.**  
  You can simulate procedural pressure, but not the visceral terror of knowing a trireme *is actually rowing to genocide*. Students debate; Athenians knew blood was drying on the first decree. **How to supply this:**  
  - Pre-simulation: Read Thucydides 3.36-50 aloud, focusing on the "savage decision" and "haste" (σπουδή).  
  - Post-simulation: Contrast their 75-min debate with the 24-hour panic in Athens: *"Imagine your first vote sent actual killers. Now imagine trying to row faster than your own state’s violence."*  

  ---

  ### **Why This Works**  
  - **Structural Closeness:** Uncommitted bloc forces organic swing votes; no rigged roles.  
  - **Time Pressure:** Trireme Track makes delay = death tangible.  
  - **Asymmetry Baked In:** Diodotans’ halved points/ostracism = gameplay manifestation of bias.  
  - **Expediency Enforced:** Penalties make students *feel* why Diodotus’ cold pragmatism was the only viable path.  

  **Final Tip:** Run it tight. Cut speeches at 90 seconds. Move triremes visibly. Athenian democracy was brutal, efficient, and messy. Your simulation should mirror that friction.
