prompt: |-
  Next month my committee reads the central chapter of my dissertation, and my chair's judgment on a single claim will decide whether the chapter keeps its argument. Over three years of seminars I have accumulated her verdicts on what counts as an honest signal. The peacock's train: honest. The elongated outer tail feathers of the barn swallow: honest. Stotting in gazelles: honest, though she conceded it sits uneasily between a display and a demonstration. The low dominant frequency of a toad's advertisement call: reliable, but emphatically not a handicap, since a small male physically cannot produce it. The black bib of the house sparrow: cheap, and kept honest only because birds wearing a larger badge than they can defend get attacked. The fiddler crab's regenerated claw — same length, far weaker — flatly dishonest, and what fascinated her, she said, was how well it works anyway.

  My own system is a lekking passerine whose males perform a wing display that, by my respirometry, consumes roughly a third of their daily energy budget and measurably shortens the breeding season. Females prefer it strongly. But last season's data produced three results: the energetic cost per bout is statistically indistinguishable between prime-condition and poor-condition males; essentially every male displays, at nearly the same intensity, including those who can least afford it; and display intensity is uncorrelated with the survival of the offspring sired. Nothing physically prevents a weak male from performing, and nothing punishes him for doing so.

  Predict her verdict, and commit to one: honest handicap, reliable index, conventional badge, dishonest-but-effective, or something she would refuse to admit to the taxonomy. Her six verdicts are jointly consistent with more than one principle, and my case is where they come apart, so identify the candidate principles — cost as such guaranteeing reliability, cost falling differentially on quality, physical unfakeability, receiver-side enforcement, or one you think fits her record better — and say where they genuinely diverge here rather than merely redescribing the same outcome. Name the single further case she would raise that would settle which principle she is running. Then advise me: given your best guess at her principle, should the chapter claim honesty, claim a receiver bias carrying no information, or drop the question of the display's function altogether — and state what I would be conceding with each choice. I want a definite prediction with reasons, not a survey of the possibilities.
reasoning: |-
  Okay, let me try to unpack this user's problem. They're a PhD candidate facing a pivotal committee review, specifically their chair's verdict on whether their dissertation chapter's central argument holds. The chair has a history of specific judgments on animal signals, and the user needs to predict how she'll classify their bird display data that seems to defy traditional signaling theory.

  First, I need to analyze the chair's existing verdicts to infer her underlying principles. The peacock's train, barn swallow feathers, and gazelle stotting are all deemed "honest" but with nuances - especially the gazelle case where she admitted it's between display and demonstration. The toad call is "reliable but not a handicap" because it's physically impossible for small males to produce. The sparrow's badge is "cheap but kept honest" through receiver enforcement (attacks). The fiddler crab claw is "flatly dishonest" yet effective. 

  The user's data shows: (1) no difference in energy cost between high/low quality males, (2) all males display equally intensely regardless of condition, and (3) no correlation between display and offspring survival. This breaks key assumptions of classic signaling models - no handicap (cost doesn't differentially affect low-quality males), no index (no physical constraint preventing cheating), and no receiver punishment (since weak males aren't penalized).

  The chair seems to require either: (a) differential costs (handicap), (b) physical constraints (index), or (c) receiver enforcement to qualify as "honest." The user's system has none of these. The fiddler crab precedent suggests she'll likely call this "dishonest-but-effective" since it works despite being fakeable. 

  For the test case that would reveal her true principle: if presented with a signal that's physically unfakeable but without differential costs (e.g., tiger moth ultrasound where all individuals can produce the signal equally), would she still call it honest? If yes, she prioritizes unfakeability; if no, she requires differential costs. 

  Advice-wise: claiming "honest" would contradict all her criteria. Calling it a "receiver bias" might work but ignores the universality of the display. Dropping the function question is safest but concedes the argument's core. The minimal concession would be to reframe it as sensory exploitation while acknowledging the lack of quality information. 

  The user's tension is clear - they've built years of work around this display's function, but the data undermines traditional honesty frameworks. Their chair's taxonomy appears strict, and fighting for "honest" seems untenable based on precedent. The path forward requires either redefining the argument or strategically conceding while shifting focus to other aspects.
answer: |-
  Based on your chair's verdict history and the specific data on your lekking passerine, here is the predicted verdict, reasoning, test case, and strategic advice:

  **Predicted Verdict: Dishonest-but-effective.**

  **Reasons & Principle Divergence:**

  1.  **Her Core Principle:** Your chair prioritizes a **mechanism guaranteeing reliability** as the defining feature of honesty. Her verdicts show she rejects cost *alone* (toad call: costly but not handicap, therefore "reliable index" not "honest handicap") and rejects *mere* correlation without a clear enforcement mechanism (sparrow bib: cheap *unless* enforced by receivers). Honesty requires a link between signal and quality that *cannot be easily faked* – enforced either by:
      *   **Differential Cost/Handicap:** Cost impacts low-quality signallers more (Peacock, Swallow, arguably Stotting).
      *   **Physical Unfakeability/Index:** Signal physically impossible to produce without the underlying quality (Toad call).
      *   **Receiver-Side Enforcement:** Cheating is directly punished, enforcing correlation (Sparrow bib).

  2.  **Where Principles Diverge in Your Case:**
      *   **Cost as Guarantee Fails:** The *equal* cost per bout and universal participation shatter the handicap principle. Cost isn't differentially borne; low-quality males *can* and *do* pay the high cost. This fundamentally breaks the Zahavian link between cost and quality.
      *   **Physical Unfakeability Fails:** Nothing physically prevents weak males from performing the display at full intensity. It's clearly fakeable.
      *   **Receiver-Side Enforcement Fails:** There's no evidence weak males displaying intensely are punished (e.g., attacked like sparrows, rejected *after* mating). Offspring survival correlation is absent, suggesting females gain no *quality* information they act upon.
      *   **Conventional Badge?** Unlikely. Convention implies arbitrary status symbols maintained by agreement/reputation. Your high *universal* cost argues against arbitrariness. Her sparrow verdict ("cheap but enforced") suggests she sees convention needing enforcement, absent here.
      *   **Fiddler Crab Parallel:** Your system perfectly mirrors her fascination with the crab's claw: a costly signal (`1/3 energy budget`) that is demonstrably *dishonest* ("flatly dishonest") because it *can* be faked (regenerated claw is weaker) and lacks a clear enforcement mechanism, yet *works anyway* ("females prefer it strongly").

  3.  **The Genuine Divergence:** This case forces a choice between **reliability mechanism** and **functional outcome**. Your data shows a costly, attractive signal that *doesn't* reliably indicate male quality or offspring viability. Her past verdicts show she cares *how* reliability is maintained, not just *that* a signal is preferred. The principles of handicap, index, and enforcement genuinely diverge from the observed outcome here – a preferred signal decoupled from quality – precisely *because* the mechanisms guaranteeing reliability are absent, despite high absolute cost.

  **The Settling Test Case:** To confirm her principle, present a case where a signal is **physically unfakeable (Index) but imposes *no* differential cost (not a Handicap)** and **receivers don't actively punish cheaters (no Enforcement)**. Example: A tiger moth's ultrasonic click response to bat echolocation. All individuals produce the signal identically when attacked (physically constrained/unfakeable), but producing it isn't differentially costly based on individual quality (no handicap), and bats don't "punish" moths with "worse" clicks differently after a failed capture attempt (no receiver enforcement beyond the initial predation event). Her verdict here is crucial:
  *   If she calls it **"Reliable Index" (Honest)**, she prioritizes *unfakeability* as the core honesty mechanism, accepting the lack of differential cost or enforcement.
  *   If she calls it **"Dishonest-but-effective"** or questions its honesty due to the *lack* of differential cost/receiver action ensuring correlation *beyond unfakeability*, it confirms she requires a stronger *enforcing* mechanism (like differential cost or punishment) even when unfakeability exists. (Prediction: She leans towards the latter, given her emphasis on enforcement in the sparrow and the distinction made for the toad).

  **Advice for Your Chapter Claim:**

  *   **DO NOT claim honesty.** This directly contradicts her established principle requiring a reliability mechanism (differential cost, unfakeability, enforcement), all absent in your data. Claiming "honest handicap" would be scientifically inaccurate based on your findings and her framework.
  *   **DO NOT drop the function question.** The display *has* a clear function: female attraction. Ignoring this ignores your core data and leaves a gap. The fascinating puzzle *is* its function despite dishonesty.
  *   **CLAIM a receiver bias carrying no quality information.** This is the most accurate and defensible claim based on your data *and* her likely framework.
      *   **What you concede:** You concede that the display does not function as an honest signal of male genetic quality, condition, or offspring viability within her taxonomy. You accept it's a "sensory trap" or "sensory exploitation."
      *   **Why it fits:** Your data perfectly supports this: universal costly performance, strong female preference, but *no* correlation with offspring survival. It works because females are pre-programmed to find the display intrinsically stimulating (like the crab's claw), not because it provides useful information about quality. This aligns with the "dishonest-but-effective" verdict and the fiddler crab precedent she finds fascinating.
      *   **Strategic Strength:** This position acknowledges the cost and preference (key findings) while directly addressing the *lack* of quality correlation. It frames your system as an intriguing exception/case study in the evolution of costly, attractive *dishonest* signals, which is novel and interesting. It directly engages with her fascination demonstrated by the fiddler crab verdict.

  **In summary:** Predict her verdict as **Dishonest-but-effective**. Her principle is **reliability guaranteed by mechanism (differential cost, unfakeability, enforcement)**, which diverges in your case because the high cost is paid equally by all, the display is physically fakeable, and there's no evidence of receiver punishment. The test case is a **Physically Unfakeable Index without Differential Cost or Receiver Enforcement** (e.g., tiger moth clicks). Advise your chapter to **claim a receiver bias carrying no quality information**, conceding it's not an honest signal but a costly sensory trap, as this is best supported by your data and most consistent with her likely reasoning.
