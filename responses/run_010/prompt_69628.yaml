answer: |-
  Here’s a case analysis of the Bem episode through the lens of higher-order evidence (HOE) and epistemic akrasia, structured as requested. I’ll use British English throughout and explicitly flag where the framework reaches its limits.

  ---

  ### **1. Sorting the Evidence: Process-Directed vs. State-Directed HOE**
  - **Process-directed HOE** (reasons to doubt the *general reliability* of the method):  
    - The Dutch replication showing the "anticipation" effect persists even in a *strictly time-controlled* setup (demonstrating the standard pipeline manufactures false positives).  
    - Failed independent replications (showing Bem’s paradigm fails under standard reproducibility conditions).  
    - Theoretical critiques about flexibility in analysis (p-hacking, forking paths, optional stopping) inherent in *unregistered* social-psychology methods.  
    - *Key implication*: The field’s standard methodology is systemically flawed, generating noise that masquerades as signal.

  - **State-directed HOE** (reasons to doubt the *specific execution* of Bem’s study):  
    - Bem’s admission of exploratory analyses (e.g., post-hoc exclusion of outliers).  
    - Minor procedural ambiguities (e.g., exact timing of stimulus presentation).  
    - *Crucially*, state-directed evidence was **thin**: Bem’s methods were *deliberately* bog-standard—no glaring errors, failed checks, or fraud. The shock was that "properly applied" standard methods could produce psi.  

  ---

  ### **2. Rational Requirements for Each Camp**
  #### **A. Bem’s Position**  
    - **Process-directed HOE (Dutch critique)**: Should have drastically lowered confidence in his *entire set* of results. If the method is shown to produce spurious effects *generically*, his findings lose evidential weight.  
    - **State-directed HOE**: Minimal (no smoking gun). Could defensibly argue *his specific execution* avoided pitfalls (e.g., "I didn’t p-hack").  
    - **Akrasia charge**: Bem’s persistence appears akratic. He treated the Dutch study as state-directed ("they misapplied the method") rather than process-directed ("the method itself is broken"). Rationally, he owed an explanation for why *his* use of the flawed method was immune.  

  #### **B. The Dutch Methodologists**  
    - **Process-directed HOE (their own study)**: Concluded the standard method is unreliable *in general*. Rational response: reject psi *and* call for methodological reform.  
    - **State-directed HOE**: Their added control condition ruled out specific confounds (e.g., backward leakage), strengthening their process critique.  
    - **No akrasia**: They coherently extended HOE to the field’s practices without exempting themselves.  

  #### **C. The Ordinary Working Psychologist (OWP)**  
    - **Process-directed HOE (Dutch study + replications)**: Grants the field’s methods are systemically unreliable.  
    - **State-directed HOE**: Assumes *their own* studies lack execution errors ("I ran the manipulation check!").  
    - **Action**: Continues publishing "significant" results using unchanged methods.  
    - **Rational requirement**: If the method is *generally* unreliable, OWP must either:  
      - (a) Preregister/amend methods to *avoid* the flaws, or  
      - (b) Reduce confidence in their *own* prior/present results absent specific evidence of rigour.  
    - **The self-exemption asymmetry**: OWP insists, "Yes, the field’s process is flawed, but *my* lab is careful."  

  ---

  ### **3. The Self-Exemption Asymmetry: Akrasia or Legitimate Splitting?**  
  - **Is it epistemic akrasia?**  
    Yes, *if* OWP has no **specific evidence** their work avoids the general flaws. The process-directed HOE applies *universally*: if optional stopping inflates false positives, *all* unregistered studies using optional stopping are suspect. Believing "P is true (my finding)" while granting "My evidence for P comes from a process shown to be unreliable" is textbook akrasia.  

  - **Could level-splitting be legitimate?**  
    Only with **differential evidence**. E.g., if OWP had preregistered their study *before* the Bem affair, they could argue:  
    > "The Dutch evidence undermines *non-preregistered* work, but *my* study avoided forking paths. Thus, P (my finding) is likelier true than Bem’s psi."  
    But in reality, most OWPs lacked such evidence pre-reforms. Absent this, splitting collapses into special pleading.  

  - **Does process-directed HOE allow 'bracketing'?**  
    **No.** Process-directed HOE *directly* undermines the warrant for *any belief* produced by the method. You cannot say, "This pipeline is 40% false positives, but *my* result is in the 60%!" without independent evidence. The framework demands *suspension* of first-order belief pending method repair.  

  ---

  ### **4. Does This Episode Challenge Standard HOE Accounts?**  
  - **Confirms core HOE theory**: The Dutch study provided *paradigmatic* process-directed HOE. It rationally defeated Bem’s conclusions *and* demanded reform of the method itself.  
  - **Reveals a gap in standard models**: Typical HOE discussions focus on individual beliefs (e.g., "You were drowsy when analysing data"). Bem shows **systemic HOE**—evidence a *community-wide practice* is defective—creates unique problems:  
    - It enables *mass self-exemption* by allowing researchers to outsource blame ("the field’s dirty, not me!").  
    - It makes HOE **practically inert** without structural fixes (e.g., preregistration).  
  - **Is HOE redundant? ("You should’ve preregistered")**:  
    No—HOE explains *why* reform was needed. Preregistration is a **procedural fix** for the process unreliability revealed by HOE. The Dutch study *was* the HOE that made the methodological flaw salient.  

  ---

  ### **5. Where the Framework Goes Silent**  
  - **Motivated reasoning**: HOE theories describe *rational* requirements but don’t explain why so many psychologists ignored them (e.g., career incentives, identity protection).  
  - **Collective action**: HOE doesn’t mandate *how* to reform methods—only that unreliability must be addressed. The shift to preregistration was a *pragmatic* solution, not logically entailed.  
  - **Boundary conditions**: The framework doesn’t specify *how much* HOE is needed to defeat first-order beliefs. Bem’s initial supporters could (weakly) argue one Dutch study was insufficient—until replications piled up.  

  ---

  ### **Conclusion**  
  The Bem episode is a masterclass in **process-directed higher-order evidence**: the Dutch study rationally required abandoning belief in psi *and* the methods that produced it. The "self-exemption asymmetry" seen in ordinary psychologists was **epistemic akrasia**—maintaining first-order beliefs while conceding the unreliability of their warrant. Level-splitting could be defended only with proof of *personal methodological rigour* (which few had pre-reforms). Crucially, this case shows HOE can be **systemically inert** without institutional change; "you should’ve preregistered" operationalises the HOE’s demand for reliability but doesn’t replace its epistemic function. The akrasia wasn’t in granting the field’s flaws—it was in refusing to let that recognition infect one’s own work.
