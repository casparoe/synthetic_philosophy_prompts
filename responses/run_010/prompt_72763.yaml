prompt: |-
  I am the teaching assistant for an upper-division seminar, Value, Choice, and Practical Reason, and I am grading the take-home midterm. Our department requires second-reader calibration on essays in the borderline range, and since the two scripts I have already returned scored 78 and 84, I would like an independent read on this one before I commit to a number. Please approach the task as an experienced value theorist and examiner would: be exact about what each sentence commits the student to, rather than about how confident or fluent the prose sounds. The readings for the unit included Chang, Broome, Sen, Raz, Berlin, Parfit, and Williams, so the student was working with a reasonably standard set of positions.

  The question the student answered reads as follows.

  Question 3 (30 marks, answer in no more than 800 words). Chang holds that some choices are hard because the alternatives stand in a fourth value relation, parity, rather than because they are incomparable or equally good. Set out the small-improvement argument against the trichotomy thesis, and explain what it does and does not establish. Then assess the claim that parity is a genuine fourth relation: consider at least one rival explanation of the same cases, such as vagueness or imprecision in the ordinary comparative relations, and at least one account of how values that resist precise trade-off can nevertheless be compared in some respects.

  The submitted essay reads as follows.

  The standard picture of practical reason assumes what Chang calls the trichotomy thesis: for any two options, exactly one of three relations holds, namely that one is better than the other, that the other is better than it, or that they are equally good. If that thesis is true, then every choice has a rationally determined answer up to ties, and difficulty in choosing is only a symptom of ignorance or of the complexity of the calculation.

  The small-improvement argument is meant to show that the thesis cannot hold generally. Take two options between which neither seems better, for instance a career in law and a career as a clarinettist; call them A and B. Now consider A-plus, the law career with one extra week of vacation. A-plus is better than A. Yet A-plus is not better than B, since so slight an improvement cannot overturn the standing relation between them. It follows that A and B were not equally good after all, for if they had been equally good, A-plus would have been better than B. So none of the three relations holds, and the trichotomy thesis fails.

  Once the trichotomy fails the natural conclusion is that A and B are incommensurable, and here the word itself is a reliable guide: what lacks a common measure cannot be weighed, and so no comparative judgment about A and B can be true at all. This is the point Sen presses when he describes the relation between plural values as involving an exchange rate that is imprecise rather than missing; the imprecision is not in our knowledge but in the values, and at the limit it amounts to there being no comparison to make. It also separates hard choices from merely uncertain ones. Under uncertainty there is a fact about which option is better that we cannot reach; in a hard choice there is no such fact to reach. Berlin had already drawn the general moral when he argued that the plurality of values entails that any conflict between distinct values is incommensurable, so that a choice between liberty and equality cannot be a rational one.

  Chang's positive proposal is that a fourth relation, parity, holds between A and B, and that this is what makes such choices hard. Broome objects that the fourth relation is otiose, since the same cases can be explained by vagueness in the ordinary relations: for a borderline pair we simply say it is indeterminate which relation holds. That is right as far as it goes, but it cannot explain why the difficulty survives knowing all the facts.

  The consequences for practical reason are considerable. Where the options are on a par, reason has nothing further to say, no consideration favors either side, and so the choice is settled by something outside reason altogether, a preference or a mood or an attachment; in that sense it is arbitrary. This is not a failing in the agent. It explains why hard choices feel the way they do: we deliberate at length not because we are hunting a fact we have not yet found but because we are settling what kind of person to be. It also explains why regret after a hard choice is not irrational, since if neither option was better there was nothing the agent should have done differently. The same structure underlies Williams's objection to utilitarianism in the case of Jim: because the values at stake are incommensurable, no aggregate calculation can fix what he ought to do, and requiring him to perform one is requiring him to abandon the project that makes him who he is.

  Here is what I need from you. Work through the script before scoring it: begin by listing the discrete claims and argumentative moves, then take them in order and classify each as correct, partially correct, or mistaken, saying briefly why, and marking separately the places where a step does not follow from what precedes it, where two distinct notions have been run together, where a view has been assigned to the wrong philosopher or stated in a form its author would reject, and where the student has made a defensible but unargued leap that a lenient reader would pass over. Pay particular attention to whether the essay's own presentation of the small-improvement argument is consistent with what it later says about comparative judgments, and to whether the final paragraph's account of what happens when options are on a par coheres with the third and fourth paragraphs. Then assign a mark out of 100 using these bands: 90-100, commanding grasp of the distinctions with no substantive error; 80-89, very good, with minor slips that do not affect the main line; 70-79, competent but containing at least one significant conceptual error or non sequitur; 60-69, adequate, with several such errors; below 60, failing to engage the question. State the band you land in and the single consideration that most influenced it, and identify any respect in which the student deserves more credit than a fast reading would give. Close with two or three sentences of written feedback addressed to the student, naming the one thing they should fix before the final paper.

  Three constraints. Think the script through twice rather than reacting to its surface polish, and show your reasoning claim by claim rather than offering a general impression. Do not supply references, a bibliography, or a list of further readings, and do not rewrite the essay; assess what is on the page using what I have given you plus your knowledge of the debate. If some claim can only be settled by checking a text you cannot consult, say explicitly that it would need checking instead of guessing at what the author said.
