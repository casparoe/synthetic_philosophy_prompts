  - Functional (7) is strong on biology but can't explain why pain feels bad.
  - Agency-disruption (8) is unique in focusing on effects rather than experience.

  For the constructed case (c): The dread seems like a second-order evaluation of bodily integrity, not pain itself. Top accounts must explain this without cheating. 

  Biggest tension: Asymbolia cases challenge whether badness requires phenomenology. The user seems to lean toward accounts that separate evaluation from feeling (evaluativism/imperativism), but the dread case complicates this.

