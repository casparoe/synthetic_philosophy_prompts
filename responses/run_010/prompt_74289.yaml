   1. Students should discover that regularities in nature do not imply necessity, but leave ordinary practice intact.
   2. Students should describe a deliberate act and feel the discomfort of the "residue" (the sense of agency that seems irreducible).

   Constraints:
   - Avoid words: occasionalism, acquisition, custom, Hume until debrief.
   - The game must not be won by deducing a hidden rule (so no pattern to guess).
   - Engage the skeptical students (who believe in natures) by giving them active roles.

   Materials: card stock, colored tokens, dice, sealed envelopes, whiteboard.

   We'll design two activities in one session.

   Part 1: The Regularity Game (to show that long records of regularities don't deliver necessity)
   Part 2: The Action Description (to confront the residue in agency)

   However, we must avoid casting the teacher as a "hidden producer" (like a trickster god). Instead, we can design Part 1 so that the uncertainty comes from the structure of the game itself, not from the teacher's arbitrary decisions.

