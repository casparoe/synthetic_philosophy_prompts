   We want to simulate a situation where events are regularly conjoined but without any underlying necessity. We can use dice to introduce randomness, but also have a fixed rule that the students don't know? But that would be a hidden rule. Alternatively, we can have a system that is genuinely random and unpredictable, but with a pattern that holds for a while and then breaks? But that might be seen as a hidden rule.

   Instead, let's have a system that is governed by a rule that the students can observe as a regularity, but the rule is not necessary because it can change arbitrarily? But then the teacher is the arbitrary changer. We don't want that.

   How about a game where the outcome depends on a hidden state that the students cannot access? But again, that might be seen as the teacher being a deceiver.

   Alternative idea: use a physical system that is complex and probabilistic. For example, rolling dice and having a rule that if the sum of two dice is even, then a token of one color is produced, and if odd, another. But then the rule is fixed and necessary? We want to show the lack of necessity.

   We need to show that even after observing a long sequence of regularities, the next event might be different without violating any logical necessity.

   We can do this by having the rule change without warning, but without the teacher being the one who changes it. How?

   Idea: use sealed envelopes that contain the rule for that round. The rule is written by an external party (e.g., a colleague) and the teacher doesn't know it either. But then the rule is arbitrary and can change arbitrarily, but the teacher is not the agent of change.

