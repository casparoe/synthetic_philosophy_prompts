  ### Seminar Activity Design: Encountering al-Ghazālī on Causation  
  **Goal:** Students experientially grasp (1) regularities ≠ necessity (yet leave practice intact) and (2) the "residue" of agency in deliberate acts.  

  ---

  #### **Materials**  
  - **Card stock**: 18 cards (3 sets of 6, colored red/blue/green for groups).  
  - **Colored tokens**: 60 tokens (20 red, 20 blue, 20 green).  
  - **Dice**: 2 standard six-sided dice.  
  - **Sealed envelopes**: 3 envelopes (labeled A, B, C).  
  - **Whiteboard**: For recording trial history and scores.  
  - **Timer**: For strict timekeeping.  

  ---

  #### **Setup & Roles**  
  - **Groups**: Divide 18 students into 3 teams (6 each): **Team Red**, **Team Blue**, **Team Green**. Assign skeptical students (3–4) as **Team Archivists** (one per team).  
  - **Teacher Role**: Neutral facilitator ("Keeper of the Records"). Refuse to answer *why* outcomes occur; only state *what* occurs.  
  - **Scripted Teacher Lines**:  
    - *On outcomes*: "The record shows: [Input] → [Output]."  
    - *On predictions*: "Place your bets. The dice will decide."  
    - *On protests (e.g., "Fire burns!")*: "The record is the record. What does it license you to expect?"  
    - *Refuse to answer*: "What is behind this?", "Is there a pattern?", "Why did this happen?"  

  ---

  ### **Part 1: The Expectation Game (Regularity ≠ Necessity)**  
  **Objective**: Teams earn points by predicting outcomes of token pairings. Rules change silently, demonstrating that long records of regularities don’t guarantee necessity.  

  #### **Rules**  
  1. **Input-Output Pairs**:  
     - Each team is assigned a color (Red/Blue/Green).  
     - Teams take turns presenting an input token (e.g., Team Red presents red token).  
     - Teacher rolls 2 dice to determine output:  
       - **Dice Logic**:  
         - *Sum 2–6*: Output matches input (e.g., red → red).  
         - *Sum 7–9*: Output shifts (e.g., red → blue).  
         - *Sum 10–12*: Output opposes (e.g., red → green).  
       - *Hidden Mechanic*: After every 3 trials, silently swap the dice logic using sealed envelopes. Envelopes contain alternate rules (e.g., "Sum 2–4: Shift; Sum 5–16: Match"). Teacher pre-swaps envelopes between sessions.  

  2. **Prediction & Scoring**:  
     - Before each trial, all teams bet points (1–3) on the output.  
     - Correct prediction: +bet points.  
     - Incorrect prediction: -bet points.  
     - **Archivist Role**: Record team bets and outcomes on whiteboard. Skeptics enforce accuracy ("The record must be exact!").  

  3. **Key Design**:  
     - No pattern to deduce (dice + rule-swaps ensure randomness).  
     - Long runs of regularity (e.g., 6 red→red) occur, then break.  
     - Teams can still earn points by betting cautiously (practice intact).  

  #### **Timeline (25 min)**  
  - **0–5 min**: Assign teams/roles. Explain rules (emphasize betting/scoring, not causation).  
  - **5–20 min**: Run 12 trials (30 sec/trial: 10 sec bet, 10 sec roll/outcome, 10 sec record).  
  - **20–25 min**: Calculate scores. Top team wins "Reliable Predictor" title (no prize).  

  ---

  ### **Part 2: The Residue of Action (Agency Without "Cause")**  
  **Objective**: Students describe a deliberate act to expose the discomfort of agency "residue."  

  #### **Rules**  
  1. **Volunteer Act**: A skeptical student (e.g., "Fire burns!" protester) volunteers.  
     - *Task*: "Place a green token in the blue box using only your left hand."  
  2. **Description Phase**:  
     - Volunteer describes the act in third-person, physical terms only (e.g., "The arm extended; fingers contracted...").  
     - Teams critique: Eliminate *all* agential residue (e.g., "intended," "decided").  
  3. **Residue Reflection**:  
     - Volunteer privately writes one sentence on card stock: "What the description left out: [...]" (e.g., "I *chose* to move").  
     - Cards sealed in envelopes.  

  #### **Timeline (15 min)**  
  - **25–30 min**: Volunteer performs act.  
  - **30–35 min**: Physical description + team critiques.  
  - **35–40 min**: Private residue writing; envelopes sealed.  

  ---

  ### **Debrief (30 min)**  
  **Map gameplay to Ghazālī’s doctrines** (Do not use *custom*, *acquisition*, *Hume*, or *occasionalism* until end).  

  | **Game Moment**          | **Al-Ghazālī’s Doctrine**                                                                 | **Connection**                                                                                                                                 |
  |--------------------------|-------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------------------|
  | **Prediction failure after regularity** | Denial of necessary tie between "cause" and "effect"                                     | "You saw red→red 6 times—why didn’t the 7th follow? The record licenses expectation, not necessity. Philosophers wanted ‘natures’ (fire *must* burn); Ghazālī says no." |
  | **Betting successfully despite uncertainty** | God’s custom (*‘ādah*) leaves practice intact                                            | "You still earned points betting on regularities! Medicine, astronomy—they work because God’s custom is reliable. But it *could* change (like the dice rules did)." |
  | **Residue in action description** | Acquisition (*kasb*): God creates acts; humans "acquire" them, leaving experiential residue | "That discomfort you felt? What your description left out? Ghazālī says God creates all acts. You ‘acquire’ them—but the feeling of agency isn’t the *cause*." |
  | **Skeptics’ protests**          | Ibn Rushd’s rejoinder: Without natures, the world is unknowable                          | "Some of you said, ‘But fire *does* burn!’ Ibn Rushd agreed: if things have no natures, how do we know anything? Ghazālī replies: we know God’s custom, not ‘essences’." |

  **Final Step**: Reveal sealed terms.  
  - "What you called ‘rules changing’? Ghazālī calls *God’s custom*. Your ‘residue’? *Acquisition (kasb)*. Denying necessity? This is *occasionalism*—and David Hume said similar things later."  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Problem**: Students brute-force dice logic.  
     - **Solution**: Rule-swaps + dice randomness prevent this. If a team guesses, say: "The record is the record. Does guessing the next roll prove necessity?"  

  2. **Problem**: Skeptics dominate discussion.  
     - **Solution**: Assign them as Archivists (busy recording) and volunteers (channel their energy).  

  3. **Problem**: Residue activity feels forced.  
     - **Solution**: Use a physical act (e.g., "drop token in box") to make abstraction tangible. Ask: "Did your description feel complete? If not, why?"  

  4. **Problem**: Time runs short.  
     - **Solution**: Prioritize Part 1 (12 trials). Cut trials to 8 if needed but keep rule-swaps.  

  5. **Problem**: Teacher as "deceiver":  
     - **Solution**: Frame rules as "records of observed outcomes" (not your whim). Stress post-debrief: "God is not a trickster—He sustains reliable customs *for us*."  

  ---

  ### **What the Activity Cannot Reproduce**  
  1. **God as Sustainer, Not Arbitrary**: The game’s hidden rule-swaps risk painting God as capricious. **Supply by hand**: "Ghazālī’s God doesn’t ‘trick’ us—He sustains customs *so reliably* that we mistake them for necessity."  
  2. **Metaphysical Ground of Custom**: The dice lack theological weight. **Supply by hand**: "For Ghazālī, custom isn’t random—it’s willed by God for human benefit."  
  3. **Acquisition as Theological Grace**: The residue activity captures discomfort but not divine grace. **Supply by hand**: "Acquisition isn’t a flaw—it’s how God dignifies us by letting us ‘own’ acts He creates."  

  ---  
  **Outcome**: Students first *feel* the gap between regularity and necessity, then *confront* the agency residue—priming them for Ghazālī’s text with embodied insight, not shortcuts.
