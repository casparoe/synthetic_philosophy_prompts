answer: |-
  Here is a pantoun adhering to your specifications, designed to make the substitution and its cost palpable:

  **The Certain Million and the Chance**

  **(1)** I take the million, safe and sound.  
  **(2)** One chance in ten for five instead,  
  **(3)** While eighty-nine stay on the ground  
  **(4)** With one more chance, for nought ahead.  

  **(5)** One chance in ten for five instead,  
  **(6)** While eighty-nine stay on the ground—  
  **(7)** But now those eighty-nine are dead,  
  **(8)** With one more chance, for nought ahead.  

  **(9)** While eighty-nine stay on the ground—  
  **(10)** (Now gone, replaced by empty air!)  
  **(11)** With one more chance, for nought ahead,  
  **(12)** I choose the larger chance right there.  

  **(13)** Now gone, replaced by empty air!  
  **(14)** One chance in ten for five instead,  
  **(15)** I choose the larger chance right there—  
  **(16)** What both have common, strike it dead?  

  ---

  **Analysis:**

  1.  **The Common Consequence:** Lines 6 and 8 ("While eighty-nine stay on the ground" and "With one more chance, for nought ahead") carry the invariant element – the shared 89% outcome present in both pairs (though its *value* changes). They recur verbatim (as lines 9 & 11) and represent the component the substitution axiom says should cancel.
  2.  **Risk of Overstatement:** The poem risks overstatement in the final quatrain by framing the axiom ("What both have common, strike it dead?") solely as a question the chooser implicitly rejects through their flip, potentially oversimplifying the normative force of the principle without acknowledging the descriptive power of the observed preference pattern. The chooser's defiance ("strike it dead?") might make the axiom seem weaker than intended.
