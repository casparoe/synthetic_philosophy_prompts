answer: |-
  Let's dissect the book's claims against Montaigne's actual text, focusing on scholarly consensus and key passages (especially the one you recall).

  **The Book's Claims vs. Montaigne's Essay & Scholarship:**

  1.  **Claim: "Montaigne is the founder of cultural relativism."**
      *   **Scholarly View (Accept/Defensible Simplification):** This is a common *popular* attribution, but scholars heavily nuance it. Montaigne is undoubtedly a crucial *precursor* and *inspiration* for modern cultural relativism. His vivid depiction of diverse customs and his devastating critique of European ethnocentrism ("Each man calls barbarism whatever is not his own practice") laid essential groundwork. However, he doesn't *systematically* articulate or defend a full-blown relativist philosophy where *all* values are purely culture-bound with no external reference. His stance is more skeptical and comparative than purely relativist.

  2.  **Claim: "Persuaded... that every people measures the world by its own habits, he concludes that 'barbarian' has no content beyond 'not us.'"**
      *   **Scholarly View (Largely Accept):** This is accurate. The famous quote is: "**I think there is nothing barbarous and savage in that nation, from what I have been told, except that each man calls barbarism whatever is not his own practice; for indeed it seems we have no other test of truth and reason than the example and pattern of the opinions and customs of the country we live in.**" (Frame translation). Montaigne powerfully demonstrates that the label "barbarian" is usually just a projection of unfamiliarity or prejudice.

  3.  **Claim: "He therefore declines to judge the Tupinambá: their cannibalism is for them no more objectionable than our own dietary prohibitions, and there is no common standard by which one practice could be ranked against another."**
      *   **Scholarly View (Problematic Oversimplification/Contradicted):** This is where the book seriously misreads Montaigne.
          *   **He DOES Judge:** Montaigne explicitly *compares* and *ranks* European and Tupinambá practices, concluding European practices are *worse*.
          *   **He DOES Imply a Standard:** Your half-remembered quote is crucial: "**So we may well call these people barbarous, in respect to the rules of reason, but not in respect to ourselves, who surpass them in every kind of barbarity.**" (Frame translation).
          *   **The Standard:** Montaigne appeals to "the rules of reason" (*les règles de la raison*). What is this? It's not divine law or absolute natural law in a rigid sense, but rather a humanist standard grounded in proportionality, restraint, cruelty, and hypocrisy. He judges:
              *   Tupinambá cannibalism: An act of vengeance against dead enemies, consistent within their value system, done with courage, and arguably less cruel than European practices. ("I am not sorry that we notice the barbarous horror of such acts, but I am heartily sorry that, judging their faults rightly, we should be so blind to our own.")
              *   European practices: Torturing *living* people for religious differences (Inquisition, Wars of Religion), massacring entire populations for gold ("not for conquests... but for the traffic in pearls and pepper"), and exhibiting staggering hypocrisy ("betraying, deceiving, enslaving... under the pretext of piety and religion"). This surpasses Tupinambá actions "in every kind of barbarity."
          *   **Not a "Shrug":** Montaigne doesn't say "no standard, can't judge." He says, *using a standard derived from reason* (proportionality, cruelty, hypocrisy), European actions are objectively *more* barbarous. Cannibalism isn't *equivalent* to a dietary prohibition; it's judged *less bad* than torture and mass murder motivated by greed and hypocrisy.

  4.  **Claim: "He goes further and inverts the verdict, casting them as uncorrupted children of nature whose society is morally superior to ours — the first noble savage."**
      *   **Scholarly View (Defensible Simplification, But Nuanced):** This is a common popular reading (the "Noble Savage" trope is often traced back to this essay), but scholars emphasize the complexity:
          *   **"Superior"?** Montaigne *does* portray aspects of Tupinambá life favorably *in comparison* to contemporary European corruption: simplicity, valor in war, naturalness, lack of deceit, equality, closeness to nature's original state ("the very words that signify lying, treachery, dissimulation, avarice, envy, belittling, pardon—unheard of"). He states their wars are "wholly noble and generous," contrasting European motives.
          *   **"Uncorrupted Children of Nature"?** He uses the language of nature ("so close to their original naturalness," "still governed by natural laws"), but he is *not* naive. He acknowledges their warfare and cannibalism. His praise is largely *relational* – their society reflects a purer state *compared* to Europe's artifice and corruption. He's not depicting Rousseau-esque innocence. He calls them "barbarous" by the rules of reason while still finding European actions *worse*.
          *   **"First Noble Savage"?** He's certainly a key early figure in this tradition, using indigenous peoples as a mirror to critique Europe. Calling him the *first* is debatable (precedents exist in Classical literature), but he's profoundly influential in shaping the modern concept.

  5.  **Claim: "But this strands him. If no standard exists outside a culture, Montaigne cannot make the criticism that occupies most of the essay... His relativism is thus self-undermining..."**
      *   **Scholarly View (Contradicted & Incorrect):** This is the book's fundamental error. **The charge of self-undermining relies entirely on the false premise that Montaigne asserts "no standard exists outside a culture." He does not.**
          *   **He Employs a Standard:** As shown by your key quote and his argument, Montaigne *explicitly uses* "the rules of reason" as a trans-cultural standard to judge both European and Tupinambá actions. He condemns European practices *because* they violate this standard *more egregiously*.
          *   **Skepticism ≠ Relativism:** Montaigne's skepticism targets *absolute certainty* and *cultural chauvinism*, not the possibility of *any* reasoned judgment based on observable human consequences (cruelty, hypocrisy, excess). His essay *is* moral thought precisely because he uses this comparative, reason-based framework to deliver a devastating critique of European barbarity.
          *   **The Criticism is the Core:** The book acknowledges the criticism of Europeans occupies "most of the essay." This criticism *depends* on Montaigne *not* being a strict relativist. He needs a standard to make the comparison stick, and he provides one ("rules of reason").

  6.  **Claim: "...the essay survives as travel writing rather than as moral thought."**
      *   **Scholarly View (Largely Rejected):** While it incorporates travel narratives, "Of Cannibals" is universally recognized as a cornerstone of early modern moral and political philosophy. Its power lies precisely in its use of the "cannibal" encounter as a lens for profound moral reflection on European society, the nature of civilization/barbarism, and the grounds for ethical judgment. It's studied primarily for its philosophical and ethical arguments, not its ethnographic details (which were second-hand anyway).

  **Summary & Answers to Your Specific Questions:**

  1.  **Is the book's account fair?** No, it's significantly flawed. It correctly identifies Montaigne's critique of ethnocentrism and his favorable comparison of some Tupinambá traits, but it fundamentally misreads him as a strict cultural relativist who abandons all trans-cultural judgment. This misreading then invalidates its central charge of self-undermining.
  2.  **Does your half-remembered sentence carry the force needed?** **Absolutely YES.** The sentence – "So we may well call these people barbarous, in respect to the rules of reason, **but not in respect to ourselves, who surpass them in every kind of barbarity**" – is the **linchpin** that demolishes the book's argument. It proves:
      *   Montaigne *does* employ a trans-cultural standard ("rules of reason").
      *   He *does* rank practices (European actions are *worse*).
      *   He *does* judge both cultures using this standard.
      *   His primary target is European hypocrisy and excessive cruelty.
  3.  **Does the charge of self-undermining survive?** **No, it collapses completely** once the misreading of Montaigne as a strict relativist is corrected. Montaigne's skepticism about *certainty* and cultural bias does not prevent him from making reasoned, comparative moral judgments based on observable human suffering, hypocrisy, and excess. His criticism of Europe is coherent and powerful precisely *because* he uses the "rules of reason" as his standard. The essay is a masterpiece of moral and political thought, not self-contradictory travel writing.

  **In essence:** The book mistakes Montaigne's radical *skepticism towards European superiority* and his *exposure of cultural bias* for a full *ethical relativism* that he does not espouse in this essay. Montaigne provides a sophisticated, comparative framework based on "reason" (interpreted through a humanist lens focusing on cruelty, proportionality, and hypocrisy) to judge actions across cultures, and he uses it forcefully to condemn European practices. Your recollection of the key quote perfectly captures the essence of his argument and invalidates the book's central criticism.
