  What survives? The capacity-binding aspect works - the rule prevents action regardless of desire. But it's a collective Ulysses: past electorate/makers bind future electorate/government, with courts as crew enforcing it. However, the knowledge-versus-temptation mismatch and democratic tension mean the analogy leans authoritarian if overextended.

  For a better metaphor, I suggest ship ballast - providing stability against fiscal storms, adjustable but requiring effort, emphasizing prudence over restraint. This avoids the Odyssey's problematic elements.

