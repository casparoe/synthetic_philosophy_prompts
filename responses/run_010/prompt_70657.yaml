prompt: |-
  I'm a history doctoral student, and there's a move in narrative history I can't place. A historian explains why a particular cabinet fell in a particular week by telling the story forward, and every step is singular: a minister's vanity, a rumor that leaked on a Tuesday, a backbencher home sick with influenza. Pressed for a generalization, the historian offers none — instead they point to a collapse three centuries earlier, in another country, with a recognizably similar shape, and remark that it is the same kind of thing. The generality lives entirely in the pairing; no conditional with an antecedent and a consequent appears anywhere. Yet the pairing does real work: readers treat the second case as showing that the explanation is not merely local, and when the pairing is weak the explanation is judged weak, even though no generalization was ever stated.

  Is there an established concept for this — explanation whose generality is carried by a matched pair of narratives rather than by a law? I know about ideal types, explanation sketches, and the demand that a narrative be followable, but none of them seems to fit: an ideal type is supposed to be an articulated construct you can state, a sketch is supposed to be elliptically convertible into a law, and followability concerns a single story taken on its own. If there is no name, coin and define one, and tell me where the line falls between a bad pairing and a merely strained one.
reasoning: |-
  Okay, let me tackle this fascinating question from a history doctoral student. They're describing a narrative move where a historian explains a specific event—like a cabinet falling—through a detailed forward-moving story full of singular causes. When asked for a generalization, the historian doesn't offer a law but instead points to a structurally similar historical case from a completely different context. The power lies entirely in the pairing of these two narratives, with no explicit generalization stated. Readers intuitively treat the second case as validating the explanation's broader relevance, and the strength of the pairing determines how convincing it is. 

  First, I need to unpack what's being asked. The student wants to know if there's an established concept for this explanatory strategy. They've already ruled out ideal types (which are articulated constructs), explanation sketches (which imply convertible-to-law structures), and followability (which concerns single narratives). So I'm looking for something that lives purely in the resonance between two concrete cases. 

  Hmm... this feels like it sits at the intersection of several historical methodologies. There's narrative history's love for singularity, but also comparative history's eye for patterns. Yet it's not full comparison because only two cases are used, and not to extract a general rule. It reminds me of what Clifford Geertz called "explanatory parallels" in cultural systems—where meaning emerges from juxtaposition rather than abstraction. But that might be too anthropological. 

  Perhaps it's closer to what historians call "implicit analogical reasoning"? But analogies usually draw explicit parallels, whereas here the connection is suggested through narrative shape alone. The historian isn't saying "this is like that because X"; they're just placing them side by side and letting the structural resemblance do the work. It's almost... poetic. Like historical rhyme. 

  I recall a similar move in evolutionary biology called "convergent evolution"—where unrelated species develop similar traits independently. But applied to history, that might imply teleology. No, better to stick to humanities frameworks. 

  Wait—could this be a form of "exemplary parallelism"? The term isn't standardized, but it captures how paired cases serve as exemplars whose resonance creates meaning. The line between "bad" and "strained" pairing would depend on: depth of structural alignment (not just surface similarities), shared causal architecture despite different contexts, and absence of disconfirming elements. A bad pairing would be coincidental or force-fit; a strained one might have genuine parallels but require ignoring key differences. 

  I should also mention that this strategy cleverly sidesteps historicist objections to generalizations. By keeping the explanation embedded in narratives, it preserves contingency while still suggesting repeatable patterns. Very elegant, really. 

  ...Now to structure this for the student: define the concept clearly, differentiate from existing terms, explain why pairings succeed/fail, and suggest further reading. The coinage should feel organic—"resonant exemplarity"? "Structural parallelism"? No, "narrative homology" feels right, with "homology" borrowing from biology but emphasizing deep structural correspondence rather than shared origins. That should resonate with their case.
answer: |-
  Your description captures a sophisticated and under-theorized maneuver in historical explanation. **There is no widely established term for this exact move**, but I propose naming it **"narrative homology"** and defining it as follows:

  ### Narrative Homology
  A mode of historical explanation where the *generality* of a causal account is implied not through explicit laws or abstract types, but through the *juxtaposition of two (or more) concrete narratives* that exhibit a shared, recognizable morphological structure. The explanatory power resides in the perceived resonance of the narrative arcs themselves, demonstrating that the outcome in the focal case belongs to a *category of historical phenomena* discernible through structural similarity rather than covering laws.

  ### Why Existing Concepts Don't Fit
  1.  **Ideal Types (Weber):** Require abstraction into a defined, reusable conceptual construct (e.g., "charismatic authority"). Narrative homology deliberately *avoids* this abstraction; the "type" remains embedded in the paired cases.
  2.  **Explanation Sketches (Hempel/Dray critiques):** Presume an elliptical law waiting to be filled in. Narrative homology offers no such convertible "sketch"; the pairing *is* the demonstration of generality.
  3.  **Followability (Gallie/Mink):** Concerns the coherence of a *single* narrative for the reader. Narrative homology relies on the *interaction* between two distinct narratives.
  4.  **Analogy:** While similar, analogies usually draw *explicit* parallels ("X is like Y because..."). Narrative homology often relies on *implicit* structural recognition; the historian simply *shows* the second case, trusting the reader to perceive the "same kind of thing." It emphasizes morphological similarity over direct causal or contextual comparison.
  5.  **Comparative History:** Typically seeks common factors, variables, or processes across cases, often aiming for generalization. Narrative homology focuses on the *narrative shape* itself as the carrier of meaning, without necessarily isolating variables.

  ### How Narrative Homology Works
  1.  **Singular Explanation:** The primary case (e.g., the cabinet collapse) is explained through a detailed, contingent, forward-moving narrative of unique events (vanity, rumor, influenza).
  2.  **Implied Generality via Juxtaposition:** Instead of abstracting, the historian presents a second, structurally similar narrative (e.g., the collapse three centuries prior). The similarity lies in the *pattern* or *morphology*:
      *   Sequence of events (e.g., initial stability -> minor scandal -> key absentee -> domino-effect resignations).
      *   Types of actors/roles involved (e.g., the "vain minister," the "unexpected absence," the "ill-timed leak").
      *   The nature of the crisis and its resolution.
  3.  **Reader Inference:** The reader perceives the structural resonance ("it is the same kind of thing"). This resonance:
      *   **Validates:** Suggests the explanation for the primary case isn't *merely* local trivia; it taps into a recognizable *form* of historical event.
      *   **Generalizes Implicitly:** Demonstrates that outcomes shaped by *this specific constellation* of contingent factors (personal flaws, accidents, timing) can recur as a *pattern*, even across vast differences in context.
      *   **Replaces Abstraction:** The paired narrative *functions as* the general category ("cabinet collapses of Type X").

  ### Distinguishing Good, Strained, and Bad Pairings
  The strength of a narrative homology hinges entirely on the **depth and fidelity of the structural resonance** between the narratives:

  1.  **Strong (Good) Pairing:**
      *   **Deep Morphology:** Multiple, non-trivial structural parallels exist throughout the narrative arc (not just superficial similarities like "both involved a sick person").
      *   **Causal Logic Alignment:** The sequence of events plausibly leads to the outcome in *both* cases via a similar internal logic, even if the specific triggers differ.
      *   **Contextual Independence:** The structural similarity is discernible *despite* significant differences in period, culture, or institutions. The resonance transcends context.
      *   **Resonance Recognition:** Competent readers readily perceive the similarity without needing forced explication. The "sameness" feels compelling.

  2.  **Strained Pairing:**
      *   **Limited Parallels:** Only a few key points align (e.g., both ended with a resignation), but the overall narrative paths differ significantly.
      *   **Surface Similarity:** The resemblance relies on superficial features (e.g., "both happened on a Tuesday," "both involved a rumor") rather than deeper causal or relational structures.
      *   **Contextual Overwhelm:** The differences in context are so profound that they make the claimed structural similarity feel anachronistic, misleading, or irrelevant. The reader struggles to see past the dissimilarities.
      *   **Ambiguous Logic:** The causal link between the contingent events and the outcome feels plausible in one case but weak or coincidental in the other, undermining the shared "shape."
      *   **Reader Effort Required:** The historian must *argue* strenuously for the similarity, breaking the implicit "show, don't tell" nature of the move.

  3.  **Bad Pairing:**
      *   **Coincidental Resemblance:** Any similarity is purely accidental or based on a single, trivial shared event. No meaningful structural resonance exists.
      *   **Forced Fit:** The historian ignores crucial differences or distorts one narrative to make it superficially resemble the other.
      *   **Disanalogy Dominates:** The differences fundamentally undermine the claimed shared morphology. The paired case actively *disproves* the purported similarity.
      *   **Lack of Narrative Integrity:** The "structural similarity" is imposed by the historian through selective emphasis, ignoring the actual flow and logic of the second narrative itself.
      *   **Implausible Logic:** The contingent events in the second case clearly *don't* plausibly lead to the outcome in the same way, breaking the causal homology.

  ### Why This Move is Powerful (When Done Well)
  Narrative homology respects historical particularity while still suggesting recurrent patterns. It avoids the pitfalls of deterministic laws or anachronistic ideal types. It leverages the human cognitive strength for pattern recognition in stories. A successful pairing demonstrates that a seemingly chaotic sequence of singular events can coalesce into a recognizable *form* of historical occurrence, lending depth and plausibility to the explanation of the primary case without falsifying its contingency.

  **In essence:** Narrative homology uses the *juxtaposed narrative itself* as the vehicle for implicit generalization. The "law" is the perceived, resonant morphology. The line between strained and bad hinges on the depth, pervasiveness, and contextual transcendence of that perceived resonance versus the effort required to force it or the evidence actively contradicting it. It's a form of historical argument grounded in *Gestalt* recognition rather than syllogism.
