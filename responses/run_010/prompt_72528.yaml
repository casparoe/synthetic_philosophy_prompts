  **PERFORMANCE IMPROVEMENT PLAN (PIP)**  

  **Employee Name:** Jamie Finch  
  **Job Title:** Customer Assistant (Outdoor Plants Counter)  
  **Branch:** Oakhaven Garden Centre, Nottingham  
  **Line Manager:** Sarah Chen  
  **HR Business Partner:** Martin Dobbs  
  **Date of Issue:** 12th April 2024  
  **Review Date:** 12th July 2024  

  ---

  **1. STATEMENT OF CONCERN**  
  This Performance Improvement Plan (PIP) is issued due to recurring behavioural patterns observed in Jamie Finch’s conduct, which are inconsistent with Oakhaven Garden Centre’s core values ("Cultivate Growth," "Rooted in Respect," "Nurture Together," and **"Bring Your Whole Self to Work"**). While Jamie’s horticultural knowledge and technical competence are valued, three specific incidents (detailed in Appendix A) highlight a concerning approach to customer service, teamwork, and alignment with Business processes. These behaviours risk undermining colleague cohesion, customer satisfaction, and operational efficiency. The Business requires all colleagues to engage proactively, positively, and consistently within established frameworks.  

  ---

  **2. REQUIRED BEHAVIOURS**  
  To successfully meet performance standards, Jamie must demonstrate **sustained and measurable improvement** in the following areas over the next 90 days:  

  *   **Embrace Collaborative Purpose:** Actively affirm team objectives during interactions. Example: When covering shifts, frame agreement as a positive contribution to team goals (e.g., "Happy to support the team this Saturday"), avoiding language implying obligation is externally imposed.  
  *   **Facilitate Customer Certainty:** Guide customers towards confident purchasing decisions within our product range. Example: When a customer hesitates, focus on plant benefits, seasonal suitability, or complementary products. Avoid introducing abstract concepts that may unsettle or confuse.  
  *   **Align with Operational Realities:** Accept and work within established trade practices without questioning their fundamental nature during operational briefings. Example: In team meetings, contribute constructively to *how* we work, not speculative commentary on *whether* things could be different.  
  *   **Consistent Value Demonstration:** Actively embody the "Bring Your Whole Self to Work" value by channelling personal qualities (e.g., thoughtfulness) into positive, solution-oriented behaviours that align with Business needs, fostering a seamless customer and colleague experience.  

  *Measurable Outcomes:*  
  *   Zero further logged incidents of ambiguous customer/colleague interactions.  
  *   Positive feedback in 95% of mystery shopper assessments (focus: decisiveness support).  
  *   Documented examples of shift coverage agreed without qualifying statements.  
  *   Constructive contributions only in team briefings (as assessed by Line Manager).  

  ---

  **3. SUPPORT AVAILABLE**  
  Oakhaven is committed to supporting Jamie’s development:  

  *   **Weekly 1:1s:** Sarah Chen will provide structured feedback and coaching sessions every Friday at 10:00 AM (Meeting Room 2). Focus: Role-playing customer scenarios, discussing shift planning, and reinforcing positive language.  
  *   **Peer Mentoring:** Jamie will shadow Priya Sharma (Senior Customer Assistant, Outdoor Plants) for 2 hours weekly, observing best practices in customer engagement and team communication.  
  *   **Occupational Health Referral:** We note Jamie’s recent expressions of workplace unease. HR has arranged a confidential Occupational Health assessment (Ref: OH/Notts/45892) to explore potential support for work-related stress impacting alignment.  
  *   **Resources:** Access to Oakhaven’s "Customer Confidence" e-learning module and "Team Synergy" workshop materials via the staff portal.  

  Jamie has the right to be accompanied at any PIP meeting by a colleague or certified trade union representative.  

  ---

  **4. REVIEW ARRANGEMENTS**  
  Progress will be formally reviewed weekly by Sarah Chen and bi-weekly by Martin Dobbs (HR). Key milestones:  

  *   **Interim Review:** 14th June 2024 (Week 8): Assessment of early progress against behaviours.  
  *   **Final Review:** 12th July 2024 (Week 12): Determination of whether sustained improvement has been achieved.  

  Reviews will assess documented evidence (incident logs, feedback, observation notes) against the measurable outcomes above.  

  ---

  **5. CONSEQUENCES OF FAILURE TO IMPROVE**  
  This PIP represents a significant investment by the Business in Jamie’s continued success at Oakhaven. **Full commitment to the Required Behaviours is essential.**  

  *   **Successful Completion:** Sustained demonstration of the Required Behaviours throughout the 90-day period and at the Final Review will result in the PIP being closed. Jamie will return to standard performance management cycles.  
  *   **Insufficient Improvement:** Should measurable improvement against the stated outcomes not be achieved and sustained by the Final Review, the Business will be required to consider the following options, based entirely on the colleague’s choice of actions during the PIP period:  
      1.  **Extension:** A further, strictly time-bound period may be offered only if significant but incomplete progress is evident, requiring even more rigorous demonstration of the Required Behaviours.  
      2.  **Redeployment:** Consideration of alternative roles within Oakhaven where the required behavioural framework might be a better fit, subject to availability and Jamie’s suitability.  
      3.  **Termination of Employment:** Should Jamie choose not to meet the standards outlined in this plan, despite the support offered, the Business will have no alternative but to conclude that Jamie has freely determined this role is not one they wish to sustain. Consequently, employment may be terminated on the grounds of capability, following due process.  

  The outcome will be solely determined by Jamie’s observable actions and choices in meeting the PIP requirements. The Business respects the individual’s agency in shaping their own path within the operational framework provided.  

  ---

  **SIGNATORIES**  

  **Employee Acknowledgement:**  
  I, Jamie Finch, confirm I have received, read, and understood this Performance Improvement Plan. I acknowledge that my sustained improvement against these objectives is required.  

  Signature: _________________________  
  Date: 12th April 2024  

  **Line Manager:**  
  _________________________  
  Sarah Chen  
  Date: 12th April 2024  

  **HR Business Partner:**  
  _________________________  
  Martin Dobbs  
  Date: 12th April 2024  

  ---

  **APPENDIX A: LOGGED INCIDENTS**  

  *   **Incident 1 (Date: 02/03/2024, Logged by: Floor Manager):** Customer (Ms. A. Rigby) sought advice at Outdoor Plants counter regarding *Lavandula angustifolia* 'Hidcote' vs. *Lavandula x intermedia* 'Grosso'. Employee (Finch) stated: "You're choosing to stand here right now, aren't you? Your indecision is a choice you're making and hiding from yourself." Customer became unsettled and left without purchasing. Finch declined to offer alternative guidance when prompted.  
  *   **Incident 2 (Date: 15/03/2024, Logged by: Colleague B. Hughes):** Hughes requested Finch cover Saturday 23/03 (0800-1300) due to childcare emergency. Finch agreed verbally but immediately requested Hughes note: "Nothing forces me to agree. Covering shifts isn't what I *am*." Hughes reported confusion and discomfort regarding the unsolicited qualification.  
  *   **Incident 3 (Date: 05/04/2024, Logged by: Regional Manager D. Khan):** During Monthly Team Briefing, RM Khan stated, "Fluctuating seasonal demand and supplier lead times mean we sometimes run short on popular lines – it's simply how the trade works." Finch interjected: "But it *could* work differently. Every person here is the reason it doesn't, every morning." Remarks caused noticeable unease among the team and derailed briefing focus on practical stock solutions. RM Khan assessed this as unhelpful and contrary to fostering a solutions-oriented team environment.
