  Okay, the user runs an evening reading group in Leeds and is preparing a satirical performance piece for their annual revue. This year's theme is Sartre on radical freedom and bad faith. They've asked me to create a corporate Performance Improvement Plan (PIP) parody, targeting how institutions present the world as a fixed system where no one is responsible, and how managerial language turns personal identity into measurable behaviors.

  The document needs to mirror a real British HR document: 850-950 words with standard sections like header block (employee details), Statement of Concern, Required Behaviours, Support Available, Review Arrangements, Consequences of Failure to Improve, sign-off block, and incident appendix. The setting is a garden centre chain in the East Midlands, featuring a customer assistant named Jamie Finch who works with outdoor plants.

  Three incidents form the basis: 
  1. Telling a customer her indecision about lavender was a concealed choice 
  2. Agreeing to cover a shift while declaring it wasn't obligatory 
  3. Challenging the regional manager's "this is how the trade works" comment 

  The satire must be deadpan—no explicit references to Sartre or philosophy—yet layered enough for specialists to recognize existential concepts: the PIP's demand for impossible sustained sincerity, the category error of 90-day targets for stance-based choices, the misdiagnosis of existential anxiety as work stress, and how the document itself embodies bad faith by appealing to "the Business" as immutable fact. The Consequences section should be particularly chilling by framing disciplinary action as the employee's own free choice.

  Key execution points: 
  - Use impeccable British HR language ("colleague", "occupational health referral") 
  - Include company values like "Bring Your Whole Self to Work" while twisting it ironically 
  - Keep tone sincere throughout—managers genuinely believe they're helping 
  - Avoid Sartre's well-known examples (café waiter, woman with hand) 
  - Ensure humor works for philosophy newcomers while devastating experts 

  I'll structure it to show: 
  - How the PIP turns radical freedom into compliance metrics 
  - How "support" mechanisms like occupational health misunderstand existential anxiety 
  - How the document's appeals to "process" exemplify bad faith 
  - How the Consequences section weaponizes choice rhetoric 

  British English throughout—spelling, idioms, and HR register must be authentic. The satire's bite comes from the document's own logic, not authorial commentary.
