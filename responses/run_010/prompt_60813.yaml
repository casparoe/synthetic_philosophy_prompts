prompt: |-
  I'm a third-year PhD student, prospectus due in about four months, and my adviser just told me — pretty bluntly — that what I have is "an interesting pile of cases and no question." I'm hoping you can help me fix that. Background so you can calibrate: I did a masters in stats before philosophy, I'm totally comfortable with Pearl-style graphs and with writing out evidential and causal expected utility side by side, but I have essentially no training in the metaphysics of causation and I find counterfactual semantics kind of unpleasant to work in. The cases are all variations on the old Damascus/Aleppo story: Death turns up and tells you your appointment with them is in Aleppo tomorrow, you can either ride through the night or stay put, and Death's information turns out to be infallible either way, so you die wherever you end up. What I've been building is a loop version, and I think it's the one doing the real work in the project. Roughly: the message from Death wasn't produced by looking at the world, it was dictated by an oracle who predicts agents' deliberations, and the oracle is only accurate about agents who know how the oracle works (so, you). Worse, there's a second sealed note on the table containing the oracle's prediction of what you'll do *after* reading the first note, and you're allowed to open it or not. So now your act is evidence about the contents of a message whose contents were fixed by evidence about that very act, and I genuinely can't tell whether "the news value of the act" is even well-defined here, or whether the usual move — that deliberation crowds out prediction — gets any purchase when the prediction is about your deliberating rather than about the world.

  Here's the list I've been carrying around of candidate open questions in this general area, and I want you to rank them for me, hard. (1) Is the whole causal/evidential split downstream of the metaphysics of causation — i.e., does the causalist owe an account of intervention that isn't just a restatement of "ignore the bad news"? (2) Does the "a theory that loses you money is refuted" style of argument carry any weight at all, given that in Damascus-flavored cases the agent who ends up richer is the one who ends up dead, so the criterion seems to reward the wrong thing? (3) Is the tickle defense — adding a tell that screens your act off from the state — a real repair or just a re-description of the problem, and does my loop version break it? (4) Should decision rules be held to a stability or ratifiability constraint (your choice should still look right to you once you've made it), and does that constraint actually pick out a unique rule or does it just generate new instabilities? (5) Is the middle position — the one that says only evidence about what's outside your own head counts as news — a principled theory or an ad hoc patch? (6) Is the target supposed to be maximizing expected utility at all, or minimizing expected regret, and if it's the latter does the Damascus debate largely dissolve? (7) Do any of these predictor setups describe something that could actually happen, and if not is the whole debate just an argument about taste in impossible scenarios?

  So: act like someone who has actually worked on this divide rather than taught it once in a survey seminar, and think carefully before you answer — I'd like you to start with a short brainstorm where you list the open questions you think the area really has, including any I've missed or mis-stated, and only then commit to a ranking of the ones worth *my* next three years. Rank on three criteria and be explicit about the trade-offs between them: how much other work in the area depends on the answer, how tractable it is for someone with my formal background and no appetite for counterfactual semantics, and whether settling it would change what a decision theorist actually recommends in the loop case. I also want you to actively deprioritize things: tell me which of my seven are pseudo-problems, which are already settled enough that a dissertation on them would be dull, and which look open but would leave me stuck in year two with nothing to show. And finish by naming the single question that, if I answered it well, would let the prospectus stand on its own — plus what result or argument over the next year would make you re-order the list. Please write the whole thing in American English, and don't give me a reading list, I can find the papers myself once I know what I'm looking for.
