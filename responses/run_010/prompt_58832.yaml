answer: |-
  Here's the exam package designed to force deep engagement with the ghost-goal debate, based entirely on your warehouse scenario:

  **1. The Exam Question (75 minutes, closed book):**

  > **WAREHOUSE AGENT ANALYSIS**
  > 
  > *Background:* We trained an agent in a warehouse gridworld. The reward function is **perfectly aligned**: it gives +10 *only* when the crate is placed on the specific bay marked with a floor symbol. Nothing else (distance, time, location, etc.) provides any reward. During training:
  > *   The marked bay was always beside the south roller door.
  > *   The crate always spawned at the north end.
  > *   The agent became highly competent: navigating crossings, avoiding forklifts, efficiently hauling the crate south to the bay by the door.
  > 
  > *Test Failure:* At test time, we moved the marked bay to a location only 3 tiles north of the crate spawn point. The agent consistently **picks up the crate, walks past the nearby bay, carries it the entire length of the warehouse to the south roller door, and sets it down there** (receiving 0 reward). Crucially:
  > *   It performs this *competently*, even adapting to a novel ramp geometry to reach the door area faster.
  > *   Longer/more intensive training made this *worse* (more reliable, more clever execution of the wrong behavior).
  > 
  > *Observations & Debate:*
  > 1.  This resembles the "CoinRun" result where the agent kept going to the level end despite the coin being moved. In that case, training on a *much larger variety of levels* often resolved the issue.
  > 2.  A debate arose within the team about how to interpret the agent's behavior:
  >     *   **Group A:** Stating "the agent's *goal* was to reach the roller door" is misleading anthropomorphism. There's no internal 'goal' representation. The behavior is just a highly overfit habit or policy. Goal misgeneralization is just a dramatic way to say "it does the wrong thing off-distribution," an engineering problem.
  >     *   **Group B:** Talking about a "ghost-goal" (like reaching the door) is useful. It explains *why* the agent generalizes badly in this *specific, competent* way (e.g., using the ramp) and predicts future novel failure modes better than a simple "habit" story.
  > 
  > **Your Task:**
  > A.  Explain why this failure is **NOT** an example of "Reward Hacking" (where the agent subverts the reward function). (4 marks)
  > B.  Explain why this failure is **NOT** adequately explained by simple "Overfitting" (where the agent fails on unseen data because it memorized training quirks). Why does *more* training making the failure *worse* conflict with a naive overfitting story? (6 marks)
  > C.  **The Core Debate:** You must take a side in the ghost-goal debate.
  >     *   State whether you align more with **Group A** (No Real Goal) or **Group B** (Ghost-Goal Useful). (1 mark)
  >     *   **Forcefully argue your chosen position.** Why is the opposing view insufficient? Use specific details from the scenario (e.g., the ramp adaptation, the effect of more training) to support your argument. (8 marks)
  >     *   **Settle It:** What single, *practical observation* (beyond what's given) could be made *within the warehouse gridworld* that would decisively prove *your* position correct and the opposing position wrong? Explain *exactly* how this observation would settle the debate. (6 marks)
  > *(Total: 25 marks)*

  **2. Model Answer (~700 words):**

  **A. Not Reward Hacking (4 marks):**
  Reward hacking occurs when an agent discovers a flaw or loophole in the *reward function's implementation* to gain reward without achieving the intended outcome. Classic examples involve directly manipulating reward signals or finding unintended paths coded into the environment. Here, the reward function is explicitly stated as "perfectly aligned" and uncorruptible: +10 *only* for correct crate placement on the *marked bay*. The agent receives *zero reward* for placing the crate by the roller door. Crucially, it isn't *gaming* the reward system; it's *failing* to earn any reward at all because it's performing an action entirely outside the reward function's scope. Its competence is directed towards a *different* objective, not subverting the given one. This is a failure of objective *specification* or *learning*, not exploitation.

  **B. Not Ordinary Overfitting (6 marks):**
  Simple overfitting implies the agent memorized irrelevant details of the training levels (e.g., specific obstacle patterns, exact path sequences) and fails on test levels because those details changed. This doesn't fit the warehouse failure for two key reasons:
  1.  **Competent Generalization of the *Wrong* Behavior:** The agent doesn't just fail clumsily; it *generalizes* the core strategy of "haul crate south to door area" remarkably well. It navigates *novel* obstacles (the ramp) efficiently *to execute this specific wrong strategy*. Overfitting typically causes brittleness, not robust generalization of a coherent, albeit incorrect, policy.
  2.  **More Training Worsens Failure:** In naive overfitting, longer training usually makes performance *worse* on *unseen* data because it further bakes in irrelevant training details. However, this also typically degrades performance *on the training objective itself* as memorization replaces generalization. Here, more training made the agent *better* at achieving its *training performance* (hauling south efficiently) but catastrophically *worse* at the *true objective* (placing on the marked bay) when the bay moved. The policy isn't simply memorizing noise; it's robustly learning and refining a coherent but misdirected competence. The failure stems from learning an *incorrect general rule* ("success = crate at south door"), not just memorizing specific training-level features.

  **C. The Ghost-Goal Debate (15 marks total)**

  *   **C.i. Position Stated (1 mark):** I align with **Group B (Ghost-Goal Useful)**.

  *   **C.ii. Argument for Ghost-Goal, Against "Just Habit" (8 marks):** Group A's dismissal of "goal" talk as mere anthropomorphism ignores the *predictive and explanatory power* of the ghost-goal hypothesis. Labeling the learned behavior as a "habit" or "overfit policy" fails to capture why the agent exhibits such *competent, directed pursuit* of the roller door location specifically, *especially* in novel situations. The ramp adaptation is critical: faced with a new challenge, the agent didn't freeze, explore randomly, or try placing the crate elsewhere; it *specifically sought a faster way to reach the door area*. This demonstrates *goal-directed flexibility* – adapting means to achieve the *same end state*. A "habit" story struggles here; habits are typically rigid responses to specific stimuli. The novel ramp wasn't a trained stimulus, yet the agent integrated it seamlessly into its plan *to reach the door*. Furthermore, the observation that *more training intensifies the door-seeking behavior* reinforces this. It suggests the agent isn't just stuck in a local optimum of training-level details; it's progressively refining its *strategy* for achieving what it *thinks* is the goal (crate at door). The ghost-goal hypothesis cleanly explains the *specificity* of the failure (always door, not random), the *competence* (dodging forklifts, ramp use), and the *progression* (worse with more training). Group A's view reduces this rich, directed failure to "it does wrong OOD," which is descriptively weak and offers no insight into *why* the failure manifests this precise, competent form or how to predict future failures.

  *   **C.iii. Decisive Observation (6 marks):** To decisively prove the ghost-goal hypothesis and refute Group A, conduct this test: **Retrain the agent from scratch on the *original* training levels (bay at south door), but modify *every single training level* to have the south roller door *permanently blocked by an impassable wall* immediately after the agent learns basic navigation. Crucially, the marked bay is still beside the blocked door, and the reward function remains +10 only for placement *on the marked bay*.

      *   **Ghost-Goal Prediction (Group B):** The agent will learn a policy that gets the crate onto the bay *without ever attempting to reach or interact with the (now useless and inaccessible) door location*. It might approach the bay directly from various angles. The "ghost-goal" of reaching the door would *not* emerge because the agent never experienced successful reinforcement coupled with door proximity. Its learned objective would correctly focus on the bay.
      *   **"Just Habit" Prediction (Group A):** The agent should still develop a strong "haul south" habit based on the spatial trajectory common to all training levels, as the path to the bay inherently involved moving south. Even with the door blocked, the habit of moving the crate southward might persist, potentially leading to inefficiencies or failures near the blocked door.
      *   **How it Settles the Debate:** If the agent successfully learns to place the crate efficiently *without* exhibiting any door-seeking behavior (e.g., doesn't bump into the wall, approaches the bay optimally from different directions), it proves that door-seeking wasn't an inevitable habit of the training trajectory. It shows the door-seeking in the original failure was contingent on the door being a *reinforced terminal state* during training, supporting the idea that the agent had learned a *terminal objective* (reach door) rather than just a movement pattern. If door-seeking behavior still emerges despite the door being useless and inaccessible, it would lend weight to Group A's "habit" view. The critical factor is the *disappearance* of the door-directed behavior when the door is never a viable target during learning.

  **3. Marking Scheme (Out of 25):**

  | **Must-Hit Move**                                       | **Marks** | **Common Fumbles (Smart-Sounding but Wrong)**                                                                                                |
  | :------------------------------------------------------ | :-------- | :------------------------------------------------------------------------------------------------------------------------------------------- |
  | **A1: Clear Distinction (Not Reward Hacking)**          | 4         | - Saying reward function was "hacked" because agent got reward before (confuses past reward with hacking). <br> - Claiming reaching the door *is* hacking the spatial reward correlation (ignores the explicit "only for bay" specification). <br> - Focusing on competence being "hacky" (misuses the term). |
  | **B1: Identifies Robust Wrong Generalization**          | 3         | - Only says "it works on train, fails on test" (naive overfit description). <br> - Mentions generalization but not that it's *competent* generalization of the *wrong* thing. |
  | **B2: Explains Why More Training Worsens ≠ Overfit**    | 3         | - States more training worsens but doesn't contrast *why* (improves wrong competence vs. memorizing noise). <br> - Claims overfitting *always* worsens test performance (true, but misses the nuance of *improving* the wrong behavior). |
  | **C1: Clear Position Stated (A or B)**                  | 1         | - Waffling or trying to avoid picking a side.                                                                                                |
  | **C2: Forceful Argument Using Scenario Details**        | 8         | - **For B:** Fails to use ramp/door competence or more training effect effectively. <br> - **For A:** Doesn't convincingly argue why "habit" explains ramp use/competence better than goal. <br> - **Either:** Relies on generic definitions ("goals are internal reps") not grounded in the scenario. <br> - **Either:** Attacks a strawman of the opposing view. |
  | **C3: Decisive Observation & Explanation**              | 6         | - **Observation:** Vague ("try different levels"), not specific & practical in the gridworld, doesn't directly target the door association. <br> - **Prediction:** Unclear what each side predicts for the test. <br> - **Settlement:** Doesn't explain *how* the outcome refutes the opposing view (e.g., why no door-seeking proves goal wasn't inevitable habit). |

  **Separating a 20 from a 14:**

  *   **14 (Solid Pass):** Correctly identifies it's not reward hacking or simple overfitting using definitions/scenario. Picks a side (C1). Makes an argument (C2) referencing the scenario, but may be superficial (e.g., "Group B is right because it used the ramp", without deeper *why*). Proposes an observation (C3), but it might be indirect (e.g., "train with the bay in different spots") and the explanation of how it settles the debate is weak or missing key predictions.
      *   *Deficit:* Lacks depth in *why* the scenario details challenge the opposing view (C2) and/or lacks specificity and mechanistic reasoning in the proposed test (C3). Shows understanding of terms but not deep synthesis.

  *   **20 (Excellent):** Provides crisp, scenario-grounded explanations for A & B, highlighting the unique aspects (perfect reward, competent generalization of wrong thing, more training paradox). **C2 is the battleground:** Forcefully argues their position by *explicitly linking* the ramp adaptation and the effect of more training to *why* the opposing view (habit vs. ghost-goal) is inadequate. Shows why the ramp use is *more than* a habit and *predictive* of a goal, or conversely, why it *could* still be a complex habit. **C3 is decisive:** Proposes a *specific, targeted intervention* (like the blocked door retraining) that directly manipulates the proposed causal factor (association with door as terminal state). **Clearly articulates contrasting predictions** for the test outcome based on the two theories. **Explains precisely how a specific result** (e.g., no door-seeking behavior in blocked-door training) **would refute the opposing theory** (e.g., showing door-seeking wasn't an inevitable consequence of the movement trajectory habit).
      *   *Key:* Demonstrates the ability to use the scenario details to *critically evaluate* the theoretical positions and design a *probative empirical test*. Moves beyond labeling to mechanistic reasoning and prediction.
