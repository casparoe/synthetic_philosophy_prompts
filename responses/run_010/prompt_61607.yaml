  The user's hypothesis about nested cognitive capacities seems crucial - they suspect the taxonomy can draw boundaries but not create the ordinal scale their replacement principle requires. This explains why the board has been stuck: they're trying to extract an ordering from a framework designed for categorization. The psychologist's objection about empirical emptiness and the ethicist's concern about anthropocentrism both need serious engagement, as they represent fundamental challenges to the entire enterprise.

  For the protocol decision, conditional approval makes most sense. Bees clearly meet even the strictest reading of the clause, spiders are ambiguous but the detour behavior suggests Popperian capacities warranting precaution, while woodlice seem safely below the line. The spider arm requires concrete husbandry standards - currently absent - to proceed. Shock parameters need tightening across all arms.

  Redrafting the clause requires operationalizing "evaluation before action" with verifiable criteria while creating a burden-shifting framework for ambiguous cases. The default should be inclusion when evidence is uncertain, but this must be balanced against the replacement principle's need for comparability. The ethicist's objection about suffering being primary is the more dangerous challenge because it undermines the manual's entire cognitive-capacity approach, whereas the psychologist's concerns about administerability can be addressed procedurally.

  The cost of moving to Reading B is real: some arthropods that show simple conditioning but not model-based cognition (like woodlice here) would lose protections they'd have under Reading A. But this isn't a defect of the proposal - it's the necessary consequence of abandoning an overbroad definition that rendered the replacement principle meaningless. The memo must present this tradeoff transparently.
answer: |-
  **MEMORANDUM**  
  To: University Animal Welfare and Ethical Review Board  
  From: Chair, Professor of Philosophy  
  Date: 22 October 2023  
  Subject: Ruling on Protocol #A-2310 ("Aversive Discrimination in Invertebrates") & Manual Clause Reform  

  ---

  ### **Bottom Line Recommendation**  
  Approve the protocol **with conditions**:  
  1. **Honeybee Arm**: Approved as submitted.  
  2. **Salticid Spider Arm**: **Conditionally approved** pending submission within 14 days of:  
     - Minimum housing volume: 3x legspan in all dimensions (baseline: 15cm x 15cm x 20cm).  
     - Enrichment: Structural complexity (e.g., artificial foliage, textured surfaces) replaced weekly.  
     - Shock parameters: Maximum 3V, 0.5s duration, ≤5 trials/day. Humane endpoint: Refusal to initiate movement after 2 consecutive sessions.  
  3. **Woodlouse Arm**: Approved under **expedited review** (no further conditions).  
  4. **Triggers for Mid-Study Review**:  
     - Mortality >10% in any arm (excluding natural lifespan attrition).  
     - Bees: Failure to return to baseline foraging after shock discontinuation.  
     - Spiders: Stereotypy (e.g., repetitive circling) observed >20% of active periods.  

  ---

  ### **Diagnosis: The Core Disagreement**  
  Our impasse stems from conflating two distinct functions of the manual’s foundational clause:  
  - **Function 1**: To define the *boundary* of moral concern ("which animals are protected?").  
  - **Function 2**: To guide *species substitution* under the replacement principle ("which protected species is *least elaborate*?").  

  **Reading A** (all non-hardwired learners) collapses these functions: If nearly all animals qualify, replacement lacks traction. *Administrative consequence*: Non-specialists could consistently apply this (e.g., woodlice qualify via habituation), but it voids our stricter replacement duty.  

  **Reading B** (internal model-based evaluators) separates the functions: It draws a defensible boundary *and* enables ordinal ranking for replacement. *Administrative risk*: Non-specialists may misjudge "evaluation-before-action" evidence (e.g., is a spider’s detour planning trial-and-error or model-based?).  

  **Reading C** (scaffolded individuals) confounds *species-typical* capacities with *idiosyncratic* ones. It is unadministrable without biographical tracking and contradicts our manual’s species-level framework.  

  **The Deeper Problem**: Dennett’s taxonomy is *categorically nested* (Gregorian creatures are also Popperian, etc.), not *ordinally scalable*. It can demarcate a threshold (e.g., Popperian+), but cannot rank *within* tiers (e.g., bee vs. spider). Our replacement principle requires the latter.  

  ---

  ### **Protocol-Specific Cognitive Placement**  
  - **Honeybees**: **Popperian** (high confidence). Evidence: Rapid reversal learning, spatial mapping. Aversive shocks engage cost-sensitive evaluation.  
  - **Salticid Spiders**: **Plausibly Popperian** (low-moderate confidence). Detour behavior *suggests* internal modeling, but may be explained by associative chains. Burden of proof lies with investigator.  
  - **Woodlice**: **Skinnerian** (high confidence). Limited to habitual avoidance. Below the threshold for moral concern under Reading B.  

  ---

  ### **Objections from Members: Steel-Manned**  
  **Comparative Psychologist’s View**:  
  *"Cognition-focused clauses are empirically unstable. Conditioning hierarchies (e.g., second-order vs. latent inhibition) are observable; ‘internal models’ are inferred. We risk arbitrary lines (e.g., privileging spatial over olfactory learners). Refinement (cage size, shock intensity) is measurable, enforceable, and directly reduces suffering."*  

  **Ethicist’s View**:  
  *"Suffering, not cognition, grounds moral status. A ‘cleverness ladder’ is anthropocentric (e.g., octopuses suffer profoundly but solve problems unlike vertebrates). Our manual should protect *all* sentient beings, with sentience verified via behavioral/physiological markers (e.g., trade-offs between reward and aversive stimuli)."*  

  **Assessment**: The ethicist’s challenge is more serious. If suffering is the sole locus of concern, our cognition-based clause is misdirected. The psychologist’s critique targets administerability—a solvable problem.  

  ---

  ### **Proposed Manual Revisions**  
  **Clause 1 (Protected Animals)**:  
  *"Protections extend to non-human animals demonstrating the capacity to generate and evaluate novel action sequences in response to changing contingencies, as evidenced by: (a) rapid reversal learning, (b) detour behavior requiring spatial foresight, or (c) avoidance of anticipated harm. Taxa not meeting these criteria may still receive protections if consensus evidence of sentience exists."*  

  **Clause 2 (Replacement Principle)**:  
  *"Protocols must use the least cognitively elaborate species *among those meeting Clause 1* adequate to the scientific aim. Elaboration is ranked by: (i) latency to learn novel contingencies, (ii) behavioral flexibility in problem-solving, (iii) metacognitive indicators (e.g., information-seeking)."*  

  **Decision Procedure for Contested Taxa**:  
  - Burden of proof: Investigator must provide evidence for inclusion under Clause 1.  
  - Evidence standards: Peer-reviewed studies > preprints > expert testimony.  
  - Default for unsettled cases: **Temporary inclusion** until evidence review by a board-appointed ethologist.  
  - Review trigger: Any member flags a species with >3 conflicting studies.  

  ---

  ### **Costs of This Recommendation**  
  **Animals Excluded vs. Reading A**:  
  - Woodlice, earthworms, *Drosophila* (habituation/Skinnerian learners).  
  - Other taxa with rigid trial-and-error conditioning but no evaluative planning (e.g., some gastropods).  

  **Is This a Defect?**  
  - **No**: Reading A’s over-inclusiveness forced equivalence between bees and woodlice, violating replacement. Our proposal excludes only animals whose cognitive routine lacks "evaluation" (e.g., woodlouse shock avoidance is habitual, not deliberative).  
  - **But**: If future evidence shows such animals suffer, exclusion *is* a moral defect. Hence, the sentience clause in our revised language.  

  ---

  ### **Supporting Reasoning**  
  1. **Reading B is Administrable with Guardrails**: Non-specialists can apply standardized evidence criteria (e.g., "rapid reversal learning" = within 10 trials). Local committees will use a centralized ethology panel for contested cases.  
  2. **The Replacement Principle Demands Ranking, Not Just Boundaries**: Revised Clause 2 operationalizes "elaboration" via latency/flexibility metrics—variables measurable across taxa (e.g., bee vs. spider reversal learning speed).  
  3. **Suffering is Addressed but Not Central**: Shock parameters, endpoints, and enrichment (per the psychologist’s emphasis) mitigate suffering. Cognition determines *what counts as deprivation* (e.g., a bee’s need for exploratory flight).  
  4. **Precaution for Spiders is Warranted**: Despite ambiguous evidence, their complex hunting strategies justify conditional approval with enrichment.  

  ---  
  **Vote Requested**: Approval of the conditioned protocol and the manual revisions.  
  **Deadline**: Amendments due 5 November 2023 for university counsel review.
