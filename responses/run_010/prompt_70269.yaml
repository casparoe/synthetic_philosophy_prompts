  The reversal test is tricky though. They're right that constitutions entrench things legitimately. Need to reframe it around who controls the entrenchment. If the state permanently locks policy without voter input, that's different from constitutional amendments with supermajority requirements.

  For their case... the AG lawsuit threat against individual councilmembers changes everything. That's personal intimidation - crosses from ordinary preemption into coercion. And retroactive voiding feels punitive. This isn't just policy disagreement but disabling local democracy.

