prompt: |-
  I have been seconded for the past six months to a review of how a welfare state decides who qualifies for its main non-means-tested disability benefit, and the longer I sit with the assessment instruments the less I understand what they think they are measuring. Here is the machinery, as best I can describe it. The benefit is officially justified as helping with the extra costs of living with a long-term health condition or impairment; it is not means-tested, it is not tied to whether a person can work, and it pays at two rates depending on how severely a claimant's ability is limited. Eligibility is settled by scoring a claimant against a fixed schedule of daily-living and mobility activities — preparing food, eating, managing therapy or medication, washing, dressing, communicating, reading, engaging with other people face to face, making budgeting decisions, planning and following a journey, and moving around a stated distance. Each activity has a ladder of descriptors carrying points, the points are summed against thresholds, and the whole determination rests on an assessment conducted by a health professional employed by a private contractor, who weighs the claimant's own account of a bad day against what was observable in the room. Three features of the rules are what keep me up at night. First, ability is assessed as if the claimant were wearing or using any aid or appliance they normally use — and also any aid or appliance they could reasonably be expected to use, whether or not they actually own one or find it bearable. Second, a descriptor is only satisfied if the activity can be done safely, to an acceptable standard, repeatedly — meaning as often as it is reasonably required — and within a reasonable time, where a reasonable time is defined as no more than twice what a person without such a condition would normally take. Third, the same claimant is separately run through a work-capability instrument using broadly similar descriptors but a different rationale and a very different consequence, and the household's income-replacement benefit is means-tested on earnings and capital in a way the disability payment is not.

  So: what theory of advantage does all this presuppose? The stated rationale is about extra costs, which sounds like a resourcist claim, yet the instrument never asks what anything costs the claimant and, through the aid rule, actively discounts the aid — the very thing that generates the extra cost — by counting it as restoring the ability. That looks less like compensating for unequal resources than like registering a shortfall against a normalised bodily standard, since every one of the qualifiers is calibrated to a hypothetical person without the condition. But it does not look like welfarism either: nothing on the form asks how the claimant feels about their life, and a claimant who has thoroughly adapted, given up ambitions, and reports contentment scores exactly as if they were miserable, which suggests the designers deliberately refused a metric they might otherwise have found administratively convenient. Nor is it plainly a capabilities measure, since it asks what a person can do in a standardised list of situations rather than what real options they have, and it holds the built environment, the labour market, and other people's attitudes fixed while locating the entire disadvantage inside the claimant. I want the implicit theory reconstructed rather than guessed at: what does the practice strictly commit its authors to about the metric of justice — welfare, resources, capabilities, functionings, or something administrative that maps onto none of them — and where is it merely compatible with several of these, so that rival theorists could each endorse the same form for incompatible reasons? In particular, tell me whether the aid-and-appliance rule commits the state to a view about where the person stops and the world begins, whether the twice-as-long rule smuggles in a substantive ideal of the normal human performance, and whether scoring the individual while bracketing the environment makes the practice a medical-model instrument or a covert measurement of conversion rates between resources and what a person can actually do.

  Then I would like the internal consistency tested, because I suspect the state is running two or three theories of justice at once without noticing. Why is the extra-costs benefit exempt from the means test while the income-replacement benefit is not — what does that split presuppose about which inequalities are matters for collective correction and which are left to private luck and family support? Why do the two instruments, disability and work-capability, ask different questions of the same body in different vocabularies, and can they deliver verdicts that are not merely different but incoherent when combined, as they often seem to be when someone scores well on daily activities yet cannot sustain employment? And what would actually have to change, concretely, at the level of the form and the descriptors, if the scheme were rebuilt on a strict resourcist view of the sort that compensates brute bad luck through something like an insurance baseline, on a strict welfarist view, or on a capability view that took the capability set rather than achieved performance as its object — including whether any of those three would have to abandon the standardised schedule altogether in favour of something person-relative and environment-relative that no assessor could administer in an hour. I am not after a reform proposal, and please do not send me references or a reading list; I want the reasoning about what the existing practice is already committed to, and an honest account of the places where it is philosophically underdetermined and several theories would license the same points.
reasoning: |-
  Okay, let me unravel this user's complex query about disability assessment systems. The user presents a meticulously detailed account of a welfare state's disability benefit system, highlighting three particularly troubling features: the aid/appliance rule, the "safely/repeatedly/within time" criteria, and the parallel work-capability assessment. 

  First, I need to grasp the core philosophical tension they're wrestling with. The stated rationale of covering "extra costs" suggests a resourcist approach, but the actual assessment ignores actual expenses while counting potential aids (even unowned ones) as restoring ability. This creates a paradox where the very resources meant to address disadvantage are discounted in the evaluation of need. The user astutely observes how the system simultaneously rejects welfarism (no subjective experience metrics) and diverges from capability approaches (fixed environment, standardized tasks).

  The user's nighttime anxieties reveal deeper concerns: whether the system implicitly medicalizes disability by locating disadvantage solely in the individual, and whether the "twice as long" rule imposes ableist norms. Their request to "reconstruct rather than guess" the implicit theory suggests frustration with superficial analyses they've encountered before.

  When examining internal consistency issues, the means-test exemption for disability benefits versus income-replacement benefits seems philosophically significant. This distinction might presuppose that disability creates unique, non-discretionary costs that society should collectively bear, unlike general income inequality. Yet the system undermines this very principle through its aid/appliance rule.

  The parallel assessments (daily living vs work capability) create another layer of tension. As the user notes, someone might score highly on daily activities yet be unable to work - not because of incoherence, but because employment demands distinct capabilities (e.g., sustained performance under pressure). This suggests the system implicitly operates with different theories for different benefits.

  For the reconstruction task, I'm considering how to map each feature to philosophical commitments:
  - The aid rule leans toward a normalized functioning standard
  - The time/safety/repetition criteria enforce able-bodied norms
  - The environmental bracketing assumes a medical model
  - The means-test split hints at pluralist foundations

  The user's closing request about alternative frameworks is particularly nuanced. They want concrete examples of how descriptors would change under resourcist/welfarist/capability approaches without prescribing reform. This requires careful thought about administrative feasibility trade-offs - for instance, a strict capability approach might require impossible levels of personalization, while resourcism could simplify the aid rule but struggle with cost verification.

  Throughout this, I must resist the academic impulse to cite theorists. The user wants pure philosophical analysis of existing structures, not literature references. The challenge is to honor their depth of insight while clarifying contradictions they sense but haven't fully articulated - especially that haunting question about where the person ends and the world begins.
answer: |-
  Your dissection reveals a system built on unstated philosophical commitments and uneasy compromises. Let's reconstruct its implicit theory of advantage, test its consistency, and explore alternatives without prescribing reform:

  **Core Philosophical Commitments:**
  1.  **Metric of Justice: Standardized Functionings (Not Welfare, Resources, or Capabilities):**
      *   **Functionings Focus:** It measures *actual achievements* (preparing food, dressing, moving) in highly specific, standardized activities. This is distinct from:
          *   *Welfare:* Subjective experience/happiness is irrelevant ("contentment scores exactly as if miserable").
          *   *Resources:* Actual costs incurred are never assessed; aids are treated as ability-restorers, not cost-generators.
          *   *Capabilities:* Real freedoms/options in *this person's* environment are ignored. The schedule asks "can you do X *under these standardized conditions*?" not "what genuine opportunities do you have?"
      *   **Normalized Bodily Standard:** Every qualifier ("safely," "acceptable standard," "reasonable time," "repeatedly") is calibrated against a hypothetical "person without such a condition." The "twice as long" rule explicitly codifies this normalization. It *absolutely* smuggles in a substantive ideal of normal human performance and pace.

  2.  **The Aid/Appliance Rule & the Person/World Boundary:**
      *   **Commitment:** The state commits to the view that the relevant boundary for assessing *disability disadvantage* lies not at the "natural" body, but at the body *plus universally expected and available technological/social interventions*. The disadvantage is located in the gap between the normalized standard and what the person + "reasonable" aids can achieve.
      *   **Implication:** It asserts that society's obligation is only to compensate for impairments that persist *after* readily available, bearable (by the state's definition) technology has been applied. The "extra cost" rationale is undermined because the assessment discounts the cost *of the aid itself* by treating its use as restoring "normal" function. The cost is recognized only implicitly *if* the aid is deemed necessary *and* the impairment persists despite it.

  3.  **Bracketing the Environment & the Medical Model:**
      *   **Commitment:** The system is fundamentally a **covert measurement of resource conversion efficiency under standardized conditions**, operating within a **medical-model framework**.
          *   *Medical Model:* Disadvantage is located *entirely within the individual*. The environment (built, social, attitudinal) and its variations are held fixed as "normal." Success or failure in the tasks is attributed solely to the claimant's physical/mental condition.
          *   *Conversion Efficiency:* By holding the environment fixed and specifying "reasonable" aids, the assessment effectively asks: "Given standard conditions and minimal expected technological augmentation, how efficiently (in time, safety, reliability) can *this body* convert its inherent resources into achieving these standardized functionings compared to the norm?" It measures the body's *deficit in converting available resources* into required functionings under lab-like conditions.

  **Internal Inconsistencies & Pluralism:**
  1.  **Extra Costs vs. Means Testing:**
      *   **Implicit Split:** The exemption presupposes that disability creates *unique, non-discretionary, externally imposed costs* that are fundamentally different from general income inequality. These costs are deemed society's responsibility to mitigate collectively, regardless of private wealth/family support, because they stem from "brute luck" (impairment) requiring specific resources (aids, energy, time).
      *   **Inconsistency:** The aid/appliance rule directly contradicts this. By counting the *potential* use of aids as restoring function, it treats the *cost* of overcoming the disadvantage as something the individual should bear or that society need not compensate for *if* the aid theoretically exists. The state wants to compensate for costs *caused by* impairment but refuses to measure the costs *themselves*, instead measuring the residual functional deficit *after* hypothetical cost-bearing by the claimant.

  2.  **Disability vs. Work-Capability Assessments:**
      *   **Different Theories, Same Body:** The disability benefit uses a **standardized functioning** metric focused on basic daily life and mobility *under normalized conditions*, aiming to compensate for inherent disadvantage/costs. The work-capability assessment likely uses a **labor market productivity** metric focused on fitness for *available* employment *in the current economy*, determining eligibility for income replacement.
      *   **Source of Incoherence:** The potential incoherence (high daily living score, incapable of work) arises because:
          *   *Different Metrics:* Sustaining competitive employment requires different functionings (endurance, concentration under stress, punctuality, adapting to unpredictable environments, social performance) not captured by the "daily living" schedule.
          *   *Different Environments:* Daily living assessment holds the environment fixed and standardized. Work-capability implicitly assesses function in the *actual, variable, demanding* environment of the labor market.
          *   *Different Rationales:* One compensates for disadvantage/cost, the other determines ability to participate in the primary means of self-support.
      *   **Pluralism Endorsement:** A resourcist could support the disability benefit as compensating for unequal resource needs (extra costs) but the work assessment as means-tested insurance against income loss. A capabilities theorist could endorse both as measuring different capability sets (basic functioning vs. productive participation). A functioning theorist might see them as different lists. The inconsistency isn't *necessarily* logical, but reflects the system's *pluralistic* approach to different types of disadvantage.

  **Reconstructing on Alternative Theories (Changes to Descriptors/Rules):**
  1.  **Strict Resourcist View (Compensating for Brute Luck/Extra Costs):**
      *   **Core Change:** Shift from *measuring functional deficit* to *documenting actual extra costs*.
      *   **Descriptor Changes:**
          *   Remove "aids/appliances could reasonably be expected to use." Only aids *actually used and paid for* count.
          *   Eliminate "reasonable time," "safely/repeatedly to standard" as *ability* measures. Instead, assess if the impairment *necessitates* spending more money (e.g., on pre-prepared food, taxis, laundry services, hired help, specific equipment) or more time (valuing time as a resource).
          *   Add questions: "What specific additional expenses do you incur monthly due to your condition?" "How much extra time do tasks take, and does this prevent income generation or incur costs?"
      *   **Consequence:** Assessment becomes cost-accounting, highly individualized, administratively complex, and open to disputes over necessity/reasonableness of claimed costs. The standardized schedule becomes largely irrelevant. The "twice as long" rule vanishes.

  2.  **Strict Welfarist View (Maximizing Happiness/Subjective Welfare):**
      *   **Core Change:** Shift from *what you can do* to *how you feel* about your life due to impairment.
      *   **Descriptor Changes:**
          *   Scrap the entire activities schedule.
          *   Introduce questions on subjective well-being: "Rate your overall life satisfaction (0-10)." "How much does your condition reduce your enjoyment of daily life?" "What activities important to *you* are limited by your condition, and how distressing is this limitation?" "How much mental effort/anxiety is caused by managing your condition?"
          *   Remove observable performance tests; rely entirely on self-report.
      *   **Consequence:** Highly subjective, vulnerable to misreporting, difficult to standardize or administer fairly. Assessor observation becomes irrelevant. The "aid" and "time" rules disappear.

  3.  **Strict Capability View (Expanding Real Freedoms/Opportunities):**
      *   **Core Change:** Shift from *achieved functionings under standard conditions* to *freedom to achieve valued functionings in one's actual environment*.
      *   **Descriptor Changes:**
          *   Reframe questions: Not "Can you wash yourself?" but "Do you have the freedom to be clean, by means acceptable to you, given your actual social, physical, and economic environment?".
          *   Incorporate environment: Questions would need to probe barriers (e.g., "Is accessible transport available?" "Do social attitudes prevent you from engaging?" "Could you afford necessary adaptations?").
          *   Focus on choice/set: "Which of these activities are important *to you*?" "What activities do you feel unable to choose to do, even if you don't currently do them?".
          *   "Reasonable aids" becomes "available and accessible aids *in your context*".
          *   "Reasonable time" becomes meaningless; the focus is on the *freedom* to achieve, not the efficiency.
      *   **Consequence:** Requires deep contextual understanding of the individual's life, values, and environment. Highly personalized, incredibly resource-intensive for assessors, impossible to standardize or score reliably on a fixed schedule in an hour. The standardized ladder of descriptors collapses.

  **Conclusion:**
  The existing system is fundamentally committed to **measuring normalized functioning deficits within a medical model framework, using a covert test of resource conversion efficiency under standardized conditions.** It presupposes a clear, state-defined boundary between the "reasonable" world (including expected technology) and the impaired individual. The "twice as long" rule explicitly enforces a substantive ideal of normal performance.

  Its internal tensions arise because it *pluralistically* applies different implicit theories to different benefits:
  *   The *disability benefit* gestures weakly towards **resourcism** (extra costs) but implements **normalized functioning**.
  *   The *work-capability assessment* implements a **labor-productivity** metric.
  *   The *means-testing split* implicitly endorses a **luck-egalitarian** view for disability costs vs. a **residual welfare** model for income replacement.

  The scheme is philosophically *underdetermined* at key points:
  *   The "reasonableness" of aids/time/expectations is compatible with resourcist (cost-effectiveness), welfarist (bearability/impact on wellbeing), or capability (availability/accessibility) interpretations, though its *implementation* leans towards cost-effective normalization.
  *   The *existence* of two separate assessments is compatible with different theories (e.g., capabilities for both, but different sets; resourcism for costs, productivity for work), but the *incoherence* arises from the mismatch between their specific metrics and environmental assumptions.
  *   The rejection of welfarism is a deliberate administrative choice, not a philosophical necessity within the system's own logic.

  The core tension lies in its attempt to objectify and standardize (for administrative efficiency) a concept ("extra costs due to disability") that is inherently individualized and contextual, leading to a system that measures something other than its stated goal and embodies conflicting ideals about disadvantage, responsibility, and the individual's relationship to the world.
