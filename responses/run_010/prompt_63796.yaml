prompt: |-
  I am writing a seminar paper on democratic theory and have got myself into a muddle about the boundary problem — the worry that a democracy cannot settle the composition of its own demos by democratic means, because any vote on who is entitled to vote already presupposes an answer to the very question it was supposed to decide. My tutor has asked us to bring in our own considered verdicts on enfranchisement cases and then try to state the principle lying behind them, which is what I am attempting here. I would like you to do the hard part with me: take the list below, work out whether there is a single principle of inclusion that delivers all or very nearly all of my verdicts, and tell me plainly which verdicts have to go if the principle is to stay simple. I should say at the outset that I do not want references, a reading list, or a survey of who has defended what; I cannot look anything up at present and I am after the reasoning, not the literature.

  My verdicts, as concretely as I can put them. A woman who arrived at twenty-two on a temporary work permit, has now lived here thirty-one years, pays tax, raised her children here, and has simply never bothered to apply for citizenship because her old passport is more convenient for travel: she should vote in national elections. A man born abroad to parents who were on secondment, who holds one of our passports, has never set foot in the country, speaks no word of the language and has no intention of ever living here: he should not. A tourist here for ten days, fully subject to our criminal law and paying the same tax on what he buys while he is here: he should not. A nurse on a two-year contract, resident, taxed and subject to the law throughout, who knew from the day she arrived that she was going home: she should not, though I am considerably less sure about her than about the tourist. A five-year resident: she should, I think. A three-year resident: this is the case I keep going back and forth on, and I cannot tell you why. A citizen serving a four-year custodial sentence for fraud: he should keep the vote. A citizen with advanced dementia who has not followed an election in six years and could not tell you what one is: she should keep the vote, largely because I cannot think of any capacity test that would exclude her without also excluding people I very much want included. A citizen who lived here until he was forty, then emigrated and has voted by post ever since: he should keep the vote, though I struggle to say how he differs in principle from the passport-holder who has never visited. A foreign holder of our government bonds who stands to lose heavily if we default: obviously no vote, and this is the case that makes me suspicious of the idea that everyone affected by a decision should have a say in it. A sixteen-year-old: no, even though a constitutional decision taken this year will bind her for sixty years and her grandfather for ten. A person in the seventh year of an asylum procedure, living in a reception centre, not permitted to work, with no realistic prospect of naturalisation: I think yes for municipal elections, and I genuinely do not know about national ones. Nobody not yet born gets a vote, but I do not think it follows that decisions whose only victims are unborn are thereby placed beyond democratic scrutiny, and I would like the principle to acknowledge that asymmetry rather than swallow it. Finally, and importantly: the question of who belongs should not itself be put to a referendum of those already inside, for the circular reason given above — yet leaving it to judges or to treaties makes me uneasy in a way I have not managed to articulate.

  My tentative principle, offered for you to attack, is roughly this: the franchise belongs to everyone whose life is comprehensively and enduringly governed by the state's rule, in the sense that they could not realistically withdraw from it without a cost amounting to the ruin of their life. The wording is deliberate — 'comprehensively' to dispose of the tourist and the bondholder, 'enduringly' to dispose of the two-year nurse, 'could not realistically withdraw' to explain why the prisoner and the woman with dementia stay in. It seems to do a fair amount of work, but I can see at least three places where it misfires and I want to know whether they are fatal or merely in need of repair: it appears to enfranchise sixteen-year-olds, whom I want out; it appears to disenfranchise the long-term expatriate citizen, whom I want in; and it appears to enfranchise the asylum-seeker for national elections, precisely where my conviction runs out. So please state the principle, or at most two candidate principles, precisely enough that we could sensibly disagree about particular cases falling under them; say which of my verdicts each clause is there to capture; tell me what they imply for cases I have not listed — a permanent resident who refuses citizenship on political principle because she objects to the oath, the residents of a dependent territory who are subject to our statutes but unrepresented in our legislature, and whether the electorate for a referendum on independence ought to be wider, narrower, or exactly coextensive with the electorate for an ordinary general election — and then be honest about which of my verdicts no acceptable principle can save. Please commit yourself to one of the candidates rather than presenting them as equally respectable options, and finish by telling me what would change your mind: which single verdict of mine, if I surrendered it, would let a considerably simpler principle through, and where you think the weak joint in your own reasoning lies — in particular, whether your preferred principle genuinely escapes the circularity objection or merely relocates it somewhere less visible.
reasoning: |-
  Hmm, the user is grappling with the boundary problem in democratic theory - the paradox where defining who gets to vote (the demos) can't be done democratically without already assuming who belongs. They've shared their intuitive verdicts on various enfranchisement cases and proposed a principle, but they need help refining it systematically.

  Looking at their verdicts, I notice strong patterns: they prioritize lived experience over legal status (the 31-year resident without citizenship should vote), reject nominal connections (the passport holder abroad shouldn't), and resist both capacitarian exclusions (dementia patients keep voting) and pure affectedness (bondholders excluded). The tourist and short-term nurse are out, but residency length matters - they're unsure at 3 years but lean yes at 5. Asylum seekers get local but not national votes, and they're deeply uncomfortable with referendum solutions.

  Their proposed principle - franchise for those who can't withdraw from state governance without life-ruining cost - is intriguing but has issues: it includes 16-year-olds (who they exclude), excludes expatriates (who they include), and forces national votes for asylum seekers (where they're unsure). The "life-ruining cost" threshold also seems too extreme - does moving countries really "ruin" life? 

  I think we can refine this. The core idea should be *habitual subjection to authority plus stake in the community's future*. For the demos circularity, we must accept that boundary-setting is inherently non-democratic - it's a constitutional precondition. Judges or treaties aren't ideal, but no perfect solution exists.

  Here's my candidate principle: **The franchise belongs to all habitual residents subject to the state's comprehensive authority who face significant life disruption if required to leave, excluding those whose presence is formally temporary or who lack legal capacity to form enduring interests.**

  Key elements:
  - "Habitual residents": Captures the 31-year resident but excludes tourists and short-term nurses
  - "Significant life disruption": Retains prisoners/dementia patients while excluding bondholders
  - "Formally temporary": Excludes asylum seekers from national votes (per their ambivalence)
  - "Legal capacity": Excludes 16-year-olds and acknowledges life-stage differences

  For their unlisted cases:
  - The oath-refuser resident gets votes (she's habitually subject)
  - Dependent territory residents don't (not under comprehensive authority)
  - Independence referendums need wider electorate (stake differs from general elections)

  The toughest conflicts are the expatriate citizen (excluded by my principle but included by user) and the 3-year resident (my principle says include, but user is unsure). Sacrificing the expatriate case would simplify everything - they're affected but not subject to daily authority. The circularity problem remains, but we relocate it to defining "habitual residence," which feels less vicious than voting on membership itself.

  My weak point? The "significant disruption" criterion risks subjectivity. But it's better than "life-ruining" and handles the dementia case where capacity tests fail.
answer: |-
  Your struggle with the boundary problem is admirably articulated, and your tentative principle shows real insight. I'll commit to refining it into a single, coherent principle that captures most of your verdicts—then ruthlessly identify where your intuitions must yield for consistency. Here's my proposal:

  **Final Principle:**  
  *The franchise belongs to all habitual residents subject to the state’s comprehensive, enduring authority, provided they possess legal capacity and are not under formal temporary dispositions.*

  ### How the Principle Captures Your Verdicts:
  - **31-year resident (non-citizen):** ✓ *Habitual residence + enduring subjection.*  
  - **Passport holder abroad (never visited):** ✗ *Not a resident; no subjection.*  
  - **Tourist (10 days):** ✗ *Not habitual; formally temporary.*  
  - **Nurse (2-year contract):** ✗ *Formally temporary disposition.*  
  - **5-year resident:** ✓ *Habitual residence.*  
  - **3-year resident:** ✓ *Habitual residence (threshold clarified below).*  
  - **Prisoner (fraud):** ✓ *Habitual resident + legal capacity.*  
  - **Dementia patient:** ✓ *Legal capacity ≠ political competence; avoids slippery slope.*  
  - **Expatriate citizen (voting abroad):** ✗ *Not a habitual resident. (Your verdict must change here.)*  
  - **Bondholder:** ✗ *Not subject to comprehensive authority.*  
  - **16-year-old:** ✗ *Lacks legal capacity for enduring commitments.*  
  - **Asylum-seeker (7 years):** ✓ **Local only** *Subject to municipal authority, but national inclusion requires citizenship (see asymmetry below).*  
  - **Unborn:** No vote (as you state), but principle acknowledges *future stakes* via *enduring authority* clause.

  ### Key Clarifications:
  1. **"Habitual resident"**: Defined as *de facto* residence >3 years. Resolves your 3/5-year uncertainty.  
  2. **"Comprehensive authority"**: Excludes tourists/bondholders (only selectively governed).  
  3. **"Enduring authority"**: Excludes temporary workers (e.g., nurse).  
  4. **"Legal capacity"**: Age-based (≥18), excluding minors without testing competence.  
  5. **"Formal temporary dispositions"**: Work visas, asylum limbo (national level), tourist visas.  

  ### Unlisted Cases:
  - **Permanent resident refusing citizenship oath:** ✓ *Habitual resident; oath refusal irrelevant to subjection.*  
  - **Dependent territory residents:** ✗ *Not under *comprehensive* authority if local self-governance exists.*  
  - **Independence referendum electorate:** **Wider** (include non-resident citizens, minors 16+). *Stakes involve identity, not just governance.*  

  ### Sacrifices to Your Verdicts:
  Your principle must abandon **one core intuition**:  
  - **Expatriate citizen loses vote.** He’s *affected* but not *subject*. Keeping him contradicts your exclusion of non-resident passport holders and undermines "habitation" as the anchor.  

  ### Why This Avoids Circularity (Mostly):  
  The principle locates inclusion in *objective conditions* (residence/subjection), not prior democratic authorization. But circularity resurfaces *weakly* in defining "habitual":  
  - **Weak Joint:** Determining the 3-year threshold *could* be contested democratically. Yet this is thinner circularity—it’s rule-setting, not membership-gating. Judges applying this test are interpreting facts, not inventing demos.  

  ### One Surrender for Simplicity:  
  If you drop **"expatriate citizen keeps vote,"** the principle tightens dramatically. This single sacrifice:  
  1. Resolves tension with non-visiting passport holder.  
  2. Anchors inclusion in physical presence/subjection.  
  3. Prevents extraterritorial voting from diluting "enduring governance."  

  ### Why Asylum-Seeker Asymmetry?  
  - **Municipal inclusion:** They’re subject to *local* authority (housing, sanitation).  
  - **National exclusion:** Enduring authority requires citizenship *if status is provisional*. Principle tolerates this asymmetry because municipal/national demoi can legitimately differ.  

  ### Final Test: 16-Year-Olds  
  Excluded cleanly via *legal capacity*, avoiding competence tests. Your grandfather argument is overruled by bright-line age limits—democracy needs administrable rules, not temporal impact calculus.  

  **Conclusion:** Your instinct for "governed lives" was sound but overextended. **Residence + subjection + capacity** delivers 12/14 verdicts (expatriate and asylum national vote excluded). Sacrifice the expatriate to save the rest—and accept that judges *must* operationalize "habitual" to avoid pure circularity. The boundary problem can’t be solved, but it can be contained in technical thresholds.  

  **Change my mind if:** You insist the dementia patient *should* lose her vote. That surrender would permit a simpler principle (*"all adult habitual residents"*), but at catastrophic cost to vulnerable groups. Your resistance to capacity tests is wiser than the simplicity gained.
