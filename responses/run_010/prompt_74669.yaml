prompt: |-
  I argued with my friend Nadia for like three hours last night about who should get a vote, and I've come away pretty sure my own positions don't hang together, but I can't tell which ones I'm supposed to drop. So here they all are, roughly in the order they came out at the kitchen table. Sixteen-year-olds in school board and city elections: yes, easy. Sixteen-year-olds in national elections: also yes, and I don't feel any difference that matters between those two. Fourteen-year-olds: no. When Nadia asked what changes between 14 and 16 I had nothing except "we have to draw the line somewhere," which she said was exactly the problem. A specific 13-year-old I know who follows the budget debates more closely than most adults I know: still no, and I'm fine with that, because age is a blunt proxy and I'll happily use a blunt proxy here. A guy who's lived here 22 years, pays his taxes, kids went through the local schools, never became a citizen because he couldn't be bothered: should vote, local AND national. A tourist who happens to be here for two weeks during an election: obviously no. A citizen born abroad who's never lived here, never paid a cent of tax here, votes by mail from a country she's visited twice: no — and I know how bad that one looks sitting next to the previous one, since the only thing seperating them is a passport.

  Then compulsory voting. Australia-style, turn up or pay a small fine: I'm for it. But if its going to drag you to a booth it has to let you hand in a blank ballot and count as having complied, and it shouldn't be able to fine you for deliberately spoiling your ballot as a protest. Prisoners: no vote while they're inside, restored on release — and I couldn't tell Nadia why the line is release rather than the end of the sentence, since people on parole are still being punished. My neighbour with advancing dementia, who's voted in every election for fifty years and still lights up when his daughter drives him to the polling station: absolutely keep him on the roll, and no, I don't want anyone administering a competence test to decide. Which is where I got properly stuck, because two minutes earlier I was happy to exclude a bright, well-informed 13-year-old on the grounds that testing people individually is impractical and invasive. Blunt instruments are fine going one direction and intolerable going the other, and I have no story about why. And the case I keep flip-flopping on, the one she finally got me with: proxy votes for parents — Demeny voting, she called it, where a parent casts an extra half-vote for each underage kid. My gut says no, it's ghoulish, you're handing parties a bonus for breeding. But she said if my principle is that everyone whose interests are on the line should have a say, then children are the single most affected group there is on things like climate and public debt, they have zero say, and refusing to let anyone speak for them isn't respect for children, it's just silence with a nicer label. I had no answer to that and I still don't. Relatedly: Mill's plural voting, extra votes for the better educated, from Considerations on Representative Government — I think that's flatly unjust. But I do think political judgment comes in degrees and that I'm allowed to act on that when it comes to a 13-year-old, so I'm not sure I'm consistent there either.

  So: is there a principle of enfranchisement that gets all or most of this, and what does it actually key on — interests affected, being subject to the state's coercion, capacity to make a competent choice, membership, or some combination with a priority ordering between them? State it as precisely as you can, one or two candidates if they genuinely differ, and say which of my cases each clause is there to handle, because I want to see whether the clauses are ad hoc patches or doing real work. Then run it on three cases I didn't bring up: a long-term resident non-citizen voting in a referendum on independence, i.e. on whether to create the state they'd then belong to; someone with two passports who can vote in both countries in the same year; and lowering the age to 16 only if you also pass a civics quiz we'd never dream of giving a 45-year-old. And finally tell me straight which of my verdicts have to go. If the cheapest coherent principle costs me the dementia case, or costs me the bright-13-year-old case, or forces me to accept proxy votes for kids, I'd rather know that than get handed a baroque theory with eleven clauses that saves everything and explains nothing.
reasoning: |-
  Okay, let me start by unpacking this user's dilemma. They had a three-hour argument with Nadia about voting rights and now feel their positions are inconsistent. They listed several scenarios: 16-year-olds voting locally and nationally (yes), 14-year-olds (no), a knowledgeable 13-year-old (still no), a long-term non-citizen resident (yes), a non-resident citizen (no), compulsory voting with allowances, prisoners losing voting rights until release, a dementia patient remaining enfranchised, rejecting Demeny voting but feeling conflicted, and opposing plural voting. The user wants a coherent principle that explains most of these without being ad hoc.

  First, I need to identify the core tensions. The user uses age as a blunt proxy for competence in the 13-year-old case but rejects competence tests for the dementia patient. They grant voting rights based on residency and contribution (tax-paying non-citizen) but deny it to a non-resident citizen, highlighting citizenship's arbitrary role. They oppose proxy votes for kids but feel conflicted because children's interests are heavily affected. Also, they support compulsory voting but only with protest options.

  The user's underlying struggle is between three principles: affected interests (who is impacted by decisions), subjection to coercion (who must obey laws), and practical administration (feasibility of implementation). Each principle pulls in different directions. For example, affected interests might include children, but practical concerns reject individual testing. Subjection to coercion covers residents but not non-resident citizens, which conflicts with citizenship norms.

  For the dementia case, the user prioritizes dignity and anti-paternalism over competence, but for minors, they accept an age-based cutoff despite exceptions. This inconsistency suggests that practical administration (avoiding tests) is prioritized differently in each case. The non-citizen resident vs. non-resident citizen conflict shows citizenship isn't their primary criterion; residency and contribution matter more. But denying the 13-year-old vote despite their competence highlights that practical lines (age) override individual capability.

  Demeny voting challenges them because it addresses affected interests (children's future) but clashes with their belief that voting rights shouldn't be tied to parenthood. Plural voting is rejected as unjust, yet age-based exclusion is accepted, revealing a tension between equality and competence.

  To build a coherent principle, combining subjection to ongoing state coercion and practical administration might work. This would enfranchise all residents subject to laws (including minors and non-citizens), using age as a practical cutoff. But this would force them to accept 16-year-olds nationally and possibly extend to younger ages, which they might not want. It also risks excluding non-resident citizens, which they already do, but including them might require citizenship as a criterion.

  Another approach could be affected interests plus subjection to coercion, but this gets messy with children and non-residents. Practicality is key for the dementia case—avoiding tests—but that same practicality should apply to minors, which they reject. So, they need to decide whether to drop the age cutoff or accept competence tests, neither of which they want.

  The user's non-resident citizen exclusion is consistent if residency defines community membership. But for the independence referendum, long-term residents should vote as they're affected. Dual citizens voting in both countries might be acceptable if both places are their home. Civics tests for 16-year-olds undermine the blunt proxy they prefer.

  Their position on prisoners—losing rights during incarceration but restored upon release—might align with the coercion principle: prisoners aren't subject to the same societal laws while incarcerated. Parolees are, so they should vote, which the user might need to accept. The dementia patient stays enfranchised because removing voting rights based on competence is invasive; practical administration overrides competence here, but not for minors. To resolve this, they must either accept that age is a necessary proxy, thus keeping minors excluded, or extend voting rights to capable younger teens, which they resist.

  Demeny voting is tricky. If affected interests are paramount, proxy votes make sense, but the user finds it "ghoulish." If coercion is primary, children aren't directly subject, so no vote. They need to choose: either stick with no proxy votes, accepting that children's interests aren't directly represented, or reconsider their stance. Plural voting is unjust because it violates equality, which is separate from competence-based exclusions like age, which they see as practical necessity.

  In conclusion, the user's most defensible stance combines subjection to state coercion and practical administration. This would require them to enfranchise minors (since they're subject to laws) but use an age cutoff like 16 for practicality. Non-citizen residents vote, non-resident citizens don't. Dementia patients stay enfranchised without tests. Prisoners vote only after release, including parole. They must drop their opposition to Demeny voting or accept that children's interests remain unrepresented. Plural voting remains unjust. The biggest cost is either lowering the voting age or accepting proxy votes, but practicality might save the dementia case while excluding the 13-year-old.
answer: |-
  Here's a coherent principle of enfranchisement that captures most of your intuitions while forcing you to sacrifice a few, prioritizing practicality and core democratic values:

  **The Principle: Subjection to Ongoing State Coercion + Practical Administration**

  1.  **Core Franchise:** Suffrage belongs to **all individuals who are *subject to the state's ongoing, direct, and comprehensive authority* (coercion) and are permanent members of the governed community.**
  2.  **Proxy for Capacity:** Recognition of this status is primarily determined by **residency and age**, acknowledging these as practical, predictable, and non-invasive proxies for the capacity for sustained participation and enduring stakes, while explicitly rejecting individual competence testing.
  3.  **Administrative Boundaries:** Citizenship serves as the primary *administrative marker* for belonging at the national level within this framework, acknowledging it's imperfect but necessary for defining the polity. Residency serves this role at the local level.

  **How It Handles Your Cases (Clause-by-Clause):**

  *   **16-year-olds in school board/city/national elections: YES (Clauses 1 & 2).** They are permanently resident (community members) and subject to the state's comprehensive authority (laws, schools, future prospects). Age 16 is accepted as a practical proxy for sufficient maturity/capacity for participation *within the governed community*, acknowledging the stakes are similar across levels.
  *   **14-year-olds: NO (Clause 2).** The practical line is drawn at 16. While subject to state authority, the age proxy sets a higher threshold for recognizing the *capacity for sustained political participation* as part of the community.
  *   **Informed 13-year-old: NO (Clause 2).** The blunt age proxy is maintained. Individual competence testing is explicitly rejected as impractical and invasive. The line must exist, and 16 is chosen.
  *   **Long-term resident non-citizen (local & national): YES (Clauses 1 & 3).** They are *subject to the state's ongoing, direct, and comprehensive authority* (taxes, laws, community life, children in schools) and are *permanent members of the governed community* (residency). Citizenship is an administrative hurdle, not the core justification.
  *   **Tourist: NO (Clauses 1 & 3).** Not a permanent member of the governed community and not subject to its *ongoing* comprehensive authority.
  *   **Non-resident citizen: NO (Clauses 1 & 3).** While formally possessing citizenship (administrative marker), they are *not subject to the state's ongoing, direct, and comprehensive authority* in their daily lives and are not permanent resident members of the governed community. Their stakes are indirect and attenuated.
  *   **Compulsory Voting (with protest options): YES (Clauses 1 & 2).** Participation is an obligation of membership in the governed community subject to coercion. Blank/spoiled ballots are essential to preserve the *expression* of the choice inherent in the duty.
  *   **Prisoners: RESTORED ON RELEASE (INCLUDING PAROLE) (Clause 1).** Incarceration significantly suspends full subjection to the *comprehensive* community authority (they live under a separate, carceral regime). Upon release (including parole), they re-enter the community and are fully subject to its ongoing, comprehensive authority and laws. The "punishment" angle is secondary to the *nature of subjection*.
  *   **Neighbour with dementia: YES, STAY ON ROLL (Clauses 1 & 2).** He is a permanent member subject to state coercion. Individual competence testing is explicitly rejected as impractical and invasive. The practical age-based proxy doesn't apply retroactively or require revocation.
  *   **Demeny Voting (Proxy for kids): NO (Clauses 1 & 3).** While children are *affected* and *subject to future authority*, they are not currently *subject to the ongoing, direct, and comprehensive authority* in the same way as residents (they lack full legal agency/responsibility). Granting votes *to parents* based on children conflates membership/stakes and violates the principle of one vote per recognized member subject to coercion. Representation of children's interests is mediated through the votes of their parents/guardians *as members*, not via an extra ballot.
  *   **Mill's Plural Voting: NO (Clause 2).** Explicitly violates the principle of political equality among recognized members subject to coercion. While capacity varies, the practical proxy (age/residency) grants a *binary* status (voter/non-voter) to avoid invidious distinctions and protect equality. Acting on perceived capacity differences for the age proxy is a broad, practical line; granting extra votes based on education is an unjustified violation of equality.

  **The Cost (Your Verdicts That Must Go):**

  1.  **The Distinction Between Prisoner Release and End of Sentence:** Your principle requires recognizing that parolees are fully *subject to the comprehensive authority* of the state and community. They must vote. The line *is* release from incarceration.
  2.  **The Non-Resident Citizen Vote:** You must consistently hold that non-resident citizens lack the core qualification: ongoing subjection to the state's comprehensive authority as permanent resident members. The passport alone isn't enough under this principle. (This is the flip side of your long-term resident non-citizen vote).
  3.  **Absolute Rejection of Demeny Voting:** The principle provides a clear reason: voting rights attach to the *individual subject to coercion*, not to their dependents. Parents represent children's interests through their *own* vote as members.

  **New Cases:**

  1.  **Long-term resident non-citizen in independence referendum: YES.** This is the *paradigm case* for Clause 1. Their entire life, livelihood, and future are subject to the state's authority. The decision *defines* the state they permanently belong to and are subject to. Their stake is immense and direct. Citizenship is an administrative formality irrelevant to their subjection and membership.
  2.  **Dual Citizen Voting in Both Countries: GENERALLY NO, but context-dependent.** If they are *permanently resident and subject to the comprehensive authority* of only one state, they should vote only there (Clauses 1 & 3). Citizenship in the other is administrative, not indicative of current subjection/membership. If they genuinely maintain permanent residency and subjection in *both* (e.g., significant time, property, taxes in both), it becomes messy, but the principle leans towards *one* vote based on *primary* residence/subjection to avoid double voting. Citizenship alone is insufficient justification.
  3.  **Lowering Age to 16 only with Civics Quiz: NO.** This violates Clause 2. The age proxy is chosen *precisely* to avoid individual competence testing. Requiring a quiz for 16-year-olds undermines the rationale for the age line and introduces the invasive testing you reject for the dementia patient. If 16 is the practical line, it applies equally to all 16-year-olds.

  **Why This Works and What It Costs:**

  *   **Strengths:** It centers on the core democratic idea of "no taxation/coercion without representation." It handles the resident non-citizen vs. non-resident citizen tension cleanly by focusing on *subjection and residence*, not just legal status. It justifies the age proxy universally and rejects competence tests consistently. It explains compulsory voting as a duty of membership. It resolves the prisoner timing question based on subjection. It preserves the dementia case without tests.
  *   **Costs:** It forces you to accept parolees voting and definitively reject votes for non-resident citizens and Demeny voting. It doesn't *require* votes for 14-year-olds, but it makes your "we have to draw the line somewhere" defense of 16 over 14 weaker *in principle* (though still practically defensible). The principled reason for excluding the informed 13-year-old becomes solely the practical age proxy, not an inherent lack of capacity *to have stakes* (their stakes are acknowledged, but the mechanism for voice is the proxy).
  *   **Coherence:** The clauses aren't ad hoc. "Subject to ongoing, direct, and comprehensive state authority" is the core workhorse, explaining prisoners, residents vs. non-residents, and even the rejection of Demeny voting (kids lack full subjection/agency). "Practical Administration" explains and justifies the use of residency, age, and citizenship (as a marker) while *categorically rejecting* individual competence tests, saving the dementia case and explaining the blunt proxy for minors. The priority is clear: Subjection defines *who has the fundamental claim*; practicality defines *how we recognize and administer it*.

  You pay the price of consistency by losing the non-resident citizen vote, accepting parolees vote, and firmly rejecting Demeny voting. The dementia patient and the blunt age proxy (including the bright 13-year-old exclusion) are saved by the explicit rejection of competence testing embedded in the "Practical Administration" clause. This principle explains *why* that rejection applies equally to both ends of the age spectrum.
