          - The later rounds might be seen as rigged because we change the rules and ask new questions that favor the knowledge group. We can say: that's the point! When the environment changes or new situations arise, knowledge (understanding the reasons) is more robust.

     Response to the student who says it's question-begging:
          - We set up the game to show that true belief is as good as knowledge in static conditions, but knowledge is better in dynamic conditions. This is exactly the Meno's point. The game doesn't assume the conclusion; it illustrates it by creating conditions where true belief is sufficient and then conditions where it is not.

     Final note: We must make the materials printable. We will create:
          - A map of the grid for all.
          - For belief group: a sheet with the practice trips and answers.
          - For knowledge group: a rule sheet and a sheet with the practice trips (without answers).
          - Score sheets for each phase.

     Let's hope it fits in 75 minutes!

     We'll adjust on the fly if a phase runs long.
