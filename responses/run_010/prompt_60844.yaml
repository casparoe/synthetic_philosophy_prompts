   - Subsequent rounds: the source is taken away, environment contradicts, and transfer with novel cases where memorized answers mislead.
   - Prevent cheating (memorization in the knowledge group) and avoid status issues for the belief group.

   We'll design a game based on a fictional town's one-way street system. The task is to give directions from point A to point B in the town.

   Structure:
   - 24 students, 6 tables of 4. We assign 3 tables to "belief" and 3 to "knowledge". Each table is a team.

   Materials:
   - Printable map of the town (with streets, one-way arrows, and landmarks) for all.
   - For the belief group: a set of pre-computed routes for specific trips (without explanation).
   - For the knowledge group: a rule set for the one-way system (e.g., "Main Street is one-way north", "Elm Street is one-way east", etc.).
   - Question sheets for each phase.

   Game phases:

   Phase 1: Learning and Practice (15 minutes)
     - Belief group: Gets a list of 5 trips with the exact route (e.g., "From Post Office to Library: take Oak St west, then Main St north").
