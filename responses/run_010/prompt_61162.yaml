  1. **Classical**: Only judgments, desires, aversions, and impulses (acts of will) are up to us.  
  2. **Trichotomy (full control)**: Only what is fully within our power (excludes outcomes influenced by externals).  
  3. **Praise/Blame**: What we can be morally responsible for (praiseworthy or blameworthy).  
  4. **Reserve Clause (without)**: What we can aim at directly, without "reserve" (e.g., "if fate permits").  
  5. **Indexed to Moment**: What is controllable at the exact time of the question (present/future actions as current commitments).  

  ---

  ### Where Surviving Rules Part Company on (i), (ii), (iii)
  All five surviving rules agree on the answers:  
  - **(i) Yes**: Refusing is an intentional act (Classical), fully controllable (Trichotomy), blameworthy if omitted (Praise/Blame), aimable without reserve (Reserve Clause), and a present commitment (Indexed).  
  - **(ii) Yes**: Cultivating a disposition is a judgment/habit (Classical), fully controllable now (Trichotomy), praiseworthy (Praise/Blame), aimable (Reserve Clause), and a present choice (Indexed).  
  - **(iii) No**: The flush is automatic (Classical), not fully controlled (Trichotomy), not blameworthy (Praise/Blame), not aimable directly (Reserve Clause), and involuntary at occurrence (Indexed).  

  **No divergence**—the rules converge on all three answers.  

