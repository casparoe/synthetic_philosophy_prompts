  We evaluate six candidate rules against the 12 verdicts. **Classical**, **Trichotomy (full control)**, **Praise/Blame**, **Reserve Clause (without)**, and **Indexed to Moment** survive without strain. **Trichotomy (partial control)** fails (strains on verdicts 1, 3, 5, 7, 9).  

  **Key to Strain**:  
  - **No strain**: Rule aligns perfectly with all 12 verdicts.  
