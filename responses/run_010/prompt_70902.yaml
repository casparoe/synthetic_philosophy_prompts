prompt: |-
  I am a fourth-year doctoral student in philosophy, and in three weeks I am running a fifty-minute discussion section — whiteboard only, no slides — attached to our second-year graduate core sequence in decision theory. There will be about a dozen students: nine from philosophy, who have completed the first-year core and so have von Neumann–Morgenstern and Savage behind them; two from economics, who met rank-dependent utility models in their graduate micro sequence; and one from statistics. The topic is Lara Buchak's risk-weighted expected utility theory, and my brief is to present it as a normative proposal rather than as a piece of behavioral description.

  Two constraints shape the problem. First, the seminar instructor worked through the Allais pair in week two, so every student in the room has seen it, solved it, and filed it away as the paradox where people violate independence. I cannot build the section on it; if I do, they will pattern-match instead of thinking. Second, they have all been taught the orthodox line that risk aversion is captured by a concave utility function, and they believe it. I am therefore not introducing an idea into empty space: I have to get them to see that a concept they already possess has been doing a different job than they supposed.

  I do not want an explanation of risk-weighted expected utility. I can write down the rank-weighted representation and I know where the convexity of the risk function does its work. What I want is a plan for the explanation.

  1. The dependency structure. Give me the order in which the pieces must go in and what forces that order. In particular: must the argument that concavity of utility cannot account for ordinary small-stakes risk aversion be established *before* the risk function is introduced, since otherwise the risk function looks like a redundant second dial? Can the formal representation be stated at all inside fifty minutes without becoming the object of the section rather than a tool for it? Does "rank-dependent" have to be defined before or after the normative claim it is meant to serve? And where, if anywhere, does the small-world/grand-world distinction need to appear?

  2. The carrying example. I have two candidates and I trust neither.

  Candidate A, meant to motivate. A one-shot choice between a certain $900,000 and a 0.9 chance of $1,050,000 with a 0.1 chance of nothing; and then the same choice offered as one hundred independent draws, with the certain option scaled to $90,000,000. My claim is that an agent with a linear utility function and a convex risk function prefers the certain option in the one-shot case and the risky option in the hundred-fold case, because the aggregate distribution concentrates, and that a concave-utility-over-wealth agent cannot have it both ways here for calibration reasons of the sort Rabin pressed. I have not verified this, and if it fails the example has to go. The specific thing I cannot settle is whether the many-shot leg is doing any work that a constant-absolute-risk-aversion utility function could not do by itself.

  Candidate B, meant to discriminate. A relief agency choosing between logistics contracts. Pair one: Contract 1 guarantees delivery of 1,000 tons; Contract 2 gives a 0.10 chance of 6,000 tons, a 0.85 chance of 1,000 tons, and a 0.05 chance of total default. Pair two, a separate smaller procurement: Contract 1' gives a 0.15 chance of 1,000 tons and an 0.85 chance of nothing; Contract 2' gives a 0.10 chance of 6,000 tons and a 0.90 chance of nothing. With linear utility and the risk function ρ(p) = p³, the agent prefers Contract 1 over Contract 2 and Contract 2' over Contract 1'. I constructed this as a common-consequence structure so that no expected-utility maximizer, however curved her utility, can reproduce the pair. Separately: I first tried a two-outcome common-ratio version and found that under ρ(p) = p² the ranking simply carries across with no reversal, and I cannot tell whether that is an artifact of the particular risk function I chose or a general feature of two-outcome cases — that is, whether a floor outcome is structurally required.

  Tell me which candidate carries the section, or whether they must run in sequence and in which order. Tell me what a carrying example for this theory has to have and what it has to lack — my own guess is that it must make the linear-utility reading genuinely available and must not be re-describable by enriching the outcome space, but I want the full list. And tell me what whichever example I choose will mislead them about, and where I should flag that in advance.

  3. The misconception map. For each of the following, tell me the point in the sequence at which it should be headed off, including which ones I must plant and defuse considerably earlier than feels natural: (a) that the risk function is a second probability function, so that the theory is making a claim about how agents weight evidence; (b) that a concave utility function already delivers everything the risk function delivers, which I expect within five minutes and which I suspect is the real target of the section; (c) from the economists, that this is rank-dependent utility from their micro sequence with a philosophical gloss attached, so nothing normative has been added; (d) that convexity of ρ and concavity of u are the same mathematical gesture; (e) that the theory is descriptive, so whether risk-weighting is permitted is a question of psychology; (f) that if risk attitudes are unconstrained the theory makes rationality toothless; and (g) the objection, which the statistician will probably raise, that an agent who risk-weights inside a small problem is exploitable across time or dominated once the problem is embedded in her life as a whole. On (g) I do not know whether to raise it myself, and if so whether it belongs at the ten-minute mark as a framing of what is at stake or in the final five minutes as a question I explicitly decline to settle. Please add any misconception I have not listed that you judge more likely than these, and say what in my presentation would produce it.

  4. A check for understanding. One question I can put to them in the last three minutes whose answer will show whether they have grasped the distinction between risk-weighting and utility curvature rather than acquired a vocabulary. Tell me what a good answer sounds like, and what a wrong answer that nevertheless reveals something diagnosable looks like.

  5. What to leave out, and what to say when I leave it out. The representation theorem and its axioms, the diachronic and self-location debates, the comparison with prospect theory, and the applications to the veil of ignorance and to long-horizon policy all seem to be past fifty minutes. Tell me which of these I should name as deliberately excluded and why, and which I should not mention at all, because mentioning them would open a door I cannot close in the time remaining.

  Please close with a rough allocation of the fifty minutes across the parts of your plan, and write your response in American English. I am not looking for readings or a bibliography; I have the literature.
reasoning: |-
  Alright, let me tackle this doctoral student's query. They need a plan for a 50-minute discussion section on Buchak's risk-weighted expected utility (REU) theory. The students are familiar with standard decision theory but see risk aversion as solely captured by concave utility. The main challenge is to shift that perspective without rehashing the Allais paradox.

  First, the dependency structure. The key is establishing why concave utility isn't sufficient for small-stakes risk aversion before introducing the risk function. Rabin's critique is crucial here—showing how concave utility leads to absurd large-stakes risk aversion. If the risk function comes first, it might seem redundant. So, the order must be: problem with EU → risk function → representation. The rank-dependent aspect needs to come after the normative motivation, framing it as a tool for the attitude we've established.

  Next, the examples. Candidate A (scaled bets) has calibration issues; CARL utility could mimic the switch. Candidate B (relief contracts) is stronger because it forces a preference reversal that concave utility can't achieve. The contracts pair uses common consequences with three outcomes, essential for the reversal. The example must have linear utility available and outcomes that can't be re-described by adding dimensions. I should note that Candidate B's risk function choice (p³) is for illustration, not a general claim.

  Misconceptions need proactive management. (a) Risk function isn't a probability—clarify when introducing ρ. (b) The concave utility counter needs Rabin's argument first. (c) Economists might see this as descriptive; stress normative interpretation early. (g) The embedding objection is valid but beyond scope; defer it explicitly.

  For the check question, ask them to explain why concave utility can't handle both small and large risks without absurdity. A good answer references Rabin; a wrong one might confuse risk aversion with diminishing marginal utility.

  Omit representation theorems, diachronic issues, etc. Mention them as excluded due to time but note their importance elsewhere. Avoid prospect theory comparisons to stay focused.

  Time allocation: 15 minutes on EU's problem, 10 on risk function intro, 15 on example B, 5 on misconceptions, 5 for Q&A. Stick tightly to each segment to keep within 50 minutes.
answer: |-
  Here’s a structured plan for your 50-minute section, designed to force engagement with the *normative novelty* of REU while sidestepping Allais pattern-matching and preconceptions about concave utility. The core strategy: **Make Rabin’s calibration argument do the heavy lifting early to create conceptual space for the risk function.**

  ---

  ### **1. Dependency Structure (Order is Non-Negotiable)**
  **Total: 15 min**  
  **Why this order?** You must *first* destabilize the belief that concave utility exhausts risk attitudes, *then* introduce REU as filling that gap. Otherwise, ρ(p) looks redundant.  
  **Sequence:**  
  1. **Rabin’s Paradox (10 min):**  
     - Present Rabin’s *small-stakes risk aversion* argument:  
       - *Setup:* An EU agent with concave *u* rejects 50-50 lose $100/gain $110.  
       - *Implied calibration:* This forces absurd large-stakes risk aversion (e.g., rejecting 50-50 lose $1000/gain ∞).  
     - **Key move:** Ask students, *"Is this a defensible normative requirement? Or does it reveal a flaw in EU’s ability to separate risk from diminishing marginal utility?"*  
     - **Force the point:** Concave *u* bundles attitude to wealth changes and attitude to risk. We need a tool to *isolate* the latter.  

  2. **Introduce REU Normatively (5 min):**  
     - *Claim:* REU theory proposes that rational agents *separately* weight risk (via ρ) and outcome value (via *u*).  
     - **Define rank-dependence *after* motivation:**  
       - "Risk-attitude isn’t just about outcomes—it’s about *where risk appears in the distribution*."  
       - Sketch REU: $REU(L) = \sum u(x_i) \cdot \rho(\text{cumulative probability below } x_i) - \rho(\text{cumulative probability below } x_{i-1})$  
       - **Emphasize:** ρ acts on *decumulative* probabilities (probability of getting *at least* a given outcome).  
     - **Delay formal details:** No need to derive weights. Whiteboard only the functional form and say: "ρ(p) = p is EU; convex ρ overweights bad outcomes."  

  **Where grand/small worlds appear:** Briefly note that REU evaluates *local* risk in a small-world description (e.g., a single gamble). Defer exploitation objections to misconception (g).  

  ---

  ### **2. Carrying Example: Use Candidate B (Discriminatory Power)**
  **Total: 15 min**  
  **Why Candidate B?**  
  - It *requires* a 3+ outcome structure for preference reversal (unlike Candidate A, which CARL utility *could* mimic via wealth effects).  
  - Forces REU as the *only* way to reconcile choices with linear *u* (undercutting "just curve utility").  
  - Philosophy/econ/stat students all see a novel dilemma.  

  **Run the Example:**  
  1. Present Pair 1 (Contracts 1 vs. 2):  
     - Contract 1: 1,000 tons (certain)  
     - Contract 2: 0.05⨉0, 0.85⨉1,000, 0.10⨉6,000  
     - With ρ(p) = p³, REU prefers Contract 1 (risk aversion dominates).  
  2. Present Pair 2 (Contracts 1' vs. 2'):  
     - Contract 1': 0.85⨉0, 0.15⨉1,000  
     - Contract 2': 0.90⨉0, 0.10⨉6,000  
     - Same ρ(p) prefers Contract 2' (risk-seeking for upside).  
  3. **Crucial:** Show that *no EU maximizer* (with any concave *u*) can hold both preferences.  
     - *Why?* It’s a common-consequence violation (like Allais, but avoid the term).  

  **What Example Must Have/Lack:**  
  - ✅ Linear *u* available (tons delivered → utility).  
  - ✅ ≥3 outcomes (to prevent EU mimicry; **yes, a floor is required**).  
  - ❌ No framing effects (e.g., avoid gains/losses language).  
  - ✅ Outcomes not re-describable (e.g., no "agency reputation" sneaking in).  

  **What It Misleads About & How to Flag:**  
  - Misleads: ρ(p) = p³ is arbitrary; students may think convexity always causes reversals.  
  - Flag upfront: "This ρ is illustrative. REU allows any increasing ρ, but convexity models pessimism."  

  **Ditch Candidate A:** Its many-shot leg is vulnerable to CARL utility (via i.i.d. wealth effects), muddying the distinction.  

  ---

  ### **3. Misconception Map (Preempt Aggressively)**
  **Total: 10 min**  
  **(a) ρ(p) as second probability**  
  - **When:** During REU definition.  
  - **Preempt:** "ρ transforms probabilities but *does not* represent belief. It’s about weighting *risk*, not evidence."  

  **(b) Concave u already does this**  
  - **When:** IMMEDIATELY after Rabin (before introducing REU).  
  - **Preempt:** "Rabin shows concave *u* *overfits*: it forces irrational large-stakes choices. We need a distinct tool for *local* risk."  

  **(c) REU = RDU with philosophy gloss**  
  - **When:** Opening minute (frame the section).  
  - **Preempt:** "Today’s question: *Should* rational agents weight risk this way? We’re evaluating Buchak’s *normative* argument."  

  **(d) Convex ρ ≡ concave u**  
  - **When:** During REU calculation of Contract 2.  
  - **Preempt:** Whiteboard REU weights: "Convex ρ *overweights bad tail events*; concave *u* *underweights good outcomes*. Different mechanisms."  

  **(e) This is descriptive psychology**  
  - **When:** When stating your brief.  
  - **Preempt:** "We’re asking whether you *ought* to use ρ, not whether people *do*."  

  **(f) Unconstrained ρ → no rationality**  
  - **When:** After presenting REU form.  
  - **Preempt:** "Buchak argues ρ must be increasing and differentiable—but yes, REU *allows* more sensitivity to context than EU."  

  **(g) Exploitable across time/grand-world**  
  - **When:** Final 2 min (defer decisively).  
  - **Preempt:** "REU evaluates *local* gambles. Whether it’s coherent in dynamic choice is debated (e.g., Buchak vs. Briggs). We lack time—readings on Canvas."  

  **Add this misconception:**  
  - **(h) REU violates stochastic dominance.**  
    - **When:** During example walkthrough.  
    - **Preempt:** "REU satisfies dominance *by construction*: outcomes are ranked, and ρ(0)=0, ρ(1)=1."  

  ---

  ### **4. Check for Understanding (Final 3 min)**  
  **Question:** *"Why can an REU maximizer with linear utility avoid Rabin’s calibration trap, but an EU maximizer cannot?"*  

  **Good Answer:**  
  - "Rabin’s paradox arises because EU ties risk aversion to diminishing marginal utility. REU separates them: you can have linear utility (no diminishing returns) but still avoid small-stakes risks via convex ρ, without being forced to reject favorable large gambles."  

  **Wrong but Diagnosable Answer:**  
  - "Because REU lets you be risk-averse without curved utility."  
    - **Diagnosis:** Superficial—misses Rabin’s *calibration* point. Probing: *"Why doesn’t this just push the problem to ρ?"*  

  ---

  ### **5. What to Omit & How**  
  **Name and Deliberately Exclude:**  
  - Representation theorem/axioms: "REU has a coherence proof, but today we focus on its *motivation*."  
  - Diachronic/self-location debates: "REU’s dynamic consistency is contested—see Buchak (2013) Ch.7 vs. critics."  
  - Prospect theory: "This is a *normative* alternative, not descriptive like PT."  

  **Do Not Mention At All:**  
  - Veil of ignorance/long-horizon policy apps. (Too many rabbit holes; students will ask for "just one example.")  

  ---

  ### **Timeline: 50-Minute Allocation**  
  1. **Rabin’s Calibration Argument** (15 min):  
     - Setup EU small-stakes risk (5 min)  
     - Rabin’s absurd implication (5 min)  
     - Discussion: "Is this defensible?" (5 min)  
  2. **REU Introduction** (10 min):  
     - Normative claim & formal sketch (5 min)  
     - Risk function ≠ probability (5 min)  
  3. **Relief Agency Example** (15 min):  
     - Pair 1 choice (5 min)  
     - Pair 2 choice (5 min)  
     - Why EU fails (5 min)  
  4. **Misconception Patrol** (8 min):  
     - Active Q&A targeting (b), (d), (g)  
  5. **Check & Conclusion** (2 min):  
     - Pose check question, assign readings on deferred topics.  

  **Critical Discipline:**  
  - **Enforce timings rigidly.** Move on when time lapses—no "one last point."  
  - **Weaponize the whiteboard:** Keep it schematic (e.g., "ρ(p) = p²" not integral notation).  
  - **End with tension:** "If REU is right, rationality is more permissive—and possibly more human—than EU allows."  

  This plan forces students to confront the *necessity* of separating risk from utility, using Rabin and a tailored example to make REU feel like a solution, not just an alternative. Good luck!
