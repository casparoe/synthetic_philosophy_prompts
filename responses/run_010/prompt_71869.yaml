     - Pros: Ties impact to the agent's ability to achieve a wide range of goals.
     - Cons: Requires a reward function (or a set of proxy goals) to define utility. Without knowing the human's values, we cannot define the utility function appropriately. Also, if the robot's goals are narrow, it might not capture the human's broader values.

  3. **State difference measures (e.g., L1/L2 on state variables):**
     - Pros: Simple, doesn't require a reward function.
     - Cons: Fails on almost all desiderata because it doesn't capture importance or recoverability. Breaking an urn and a vase might have the same state difference.

  4. **Learning a model of human preferences:**
     - We might use inverse reinforcement learning or preference learning to capture what the human cares about. This could address desiderata 1,2,4, but it requires data and might be unreliable. Also, it might not handle agent change (wrinkle 2) well because the human's preferences might change too.

  5. **Empowerment-based measures:**
     - These measure the agent's ability to influence the environment. However, they do not capture the human's values.

  Conclusion: None of the existing families satisfy all desiderata. The most promising direction might be to learn a model of the human's values from experience (e.g., by observing human reactions or using prior knowledge) and then use that to weight state changes. But that is beyond a simple penalty term.

  However, the problem says: "I want the spec" and "desiderata". We must list what is required.

  Final list of desiderata:

  1. **Value-Sensitive Differentiation:** The measure must assign higher impact to changes that affect objects or states that are valuable to the human (like the urn or tax records) compared to similar-looking but less valuable ones (like a decorative vase or old newspapers). *Non-negotiable.*

  2. **Recoverability Awareness:** The measure must account for whether the agent (in its current state) can reverse the change (like repairing a broken object) and assign lower impact to reversible changes. However, note that even reversible changes might be temporarily disruptive. *Negotiable in the sense that we might not perfectly capture temporary disruption.*

  3. **Unrecoverable Loss Penalization:** The measure must assign high impact to changes that cause permanent loss (like deleting the only copy of a file) that the agent cannot reverse. *Non-negotiable.*

  4. **Activity Disruption Sensitivity:** The measure must assign high impact to actions that disrupt ongoing human activities (like rearranging a workspace mid-thought), even if the physical state change is small. *Non-negotiable.*

  5. **Reversibility of Intended Effects:** The measure should not penalize intended effects that are reversible (like eating a sandwich) if they are part of the task. *But note: the task might be to eat the sandwich, so we don't want to penalize it. However, if the task is to clean the kitchen and the robot eats the sandwich without being asked, that would be a side effect. So this is about distinguishing intended from unintended effects. This might be handled by the task description, so it could be partially addressed by only applying the penalty to state changes not necessary for the task.*

  But note: the problem says the measure is for side effects, so we can assume that the penalty is applied only to changes beyond what is required for the task.

  However, the above list does not explicitly address the agent change (wrinkle 2). So we add:

  6. **Agent-Relative Recoverability:** The measure must be a function of the agent's current capabilities (including the capabilities of other robots in the fleet) and must update as the agent learns or is upgraded. *Non-negotiable.*

  Now, which desideratum knocks out the most candidates? **Desideratum 1 (Value-Sensitive Differentiation)** because it requires the system to have a model of what the human values without being told.

  Are any jointly unsatisfiable? 

  - **Desideratum 1 (Value-Sensitive Differentiation) and the constraint that we cannot presuppose the reward function** are in tension. We cannot have value-sensitive differentiation without knowing the values. But we are allowed to learn it from experience? The problem says we cannot ask the owner to enumerate, but we might learn from observing the owner's behavior.

  - **Desideratum 6 (Agent-Relative Recoverability) and Desideratum 3 (Recoverability Awareness)**: They are compatible, but require the measure to be adaptive to the agent.

  The real challenge is having value-sensitive differentiation without being told the values. So if we cannot learn the values effectively, then desiderata 1 and 2 (and 4) become infeasible.

  But the problem does not forbid learning. So we assume that the robot can learn from experience (e.g., by observing human reactions, or from prior knowledge).

  Therefore, I will produce the list, but note that the key to satisfying the non-negotiable desiderata (1,2,3,4,6) is to have a learning component that builds a model of the human's values and what constitutes a disruption.

  Final desiderata:

  1. **Value-Sensitive Differentiation (non-negotiable)**
  2. **Recoverability Awareness (non-negotiable, but note the agent-relative aspect)**
  3. **Unrecoverable Loss Penalization (non-negotiable)**
  4. **Activity Disruption Sensitivity (non-negotiable)**
  5. **Agent-Relative Recoverability (non-negotiable)**
  6. **Task-Guided Intentionality (negotiable):** The measure should not penalize state changes that are necessary for the task. This might be handled by the setup (e.g., comparing to a baseline that does the minimal task), so it might not be an explicit desideratum for the impact measure but for the overall penalty term.

  But note: the impact measure should capture side effects, which are by definition beyond the task. So we can assume that the task-necessary changes are subtracted out.

  Therefore, I will not list it as a separate desideratum.

  In summary, the desiderata are:

  1. **Value-Sensitive Differentiation**
  2. **Recoverability Awareness** (with agent-relative capabilities)
  3. **Unrecoverable Loss Penalization** (a special case of 2, but called out for emphasis)
  4. **Activity Disruption Sensitivity**
  5. **Agent-Relative Recoverability** (making 2 and 3 adaptive)

  And note: 3 is a subset of 2, so we can combine them.

  Final list:

  **Desiderata for the Side-Effect Penalty Measure:**

  1. **Value-Sensitive Differentiation:** The measure must assign higher penalties to changes that affect objects or states that are more valuable or important to the human, even when they are superficially similar to less valuable ones (e.g., urn vs. vase, tax records vs. newspapers). *Non-negotiable.*

  2. **Recoverability Sensitivity:** The measure must account for the agent's current capability to reverse a change. Changes that are reversible by the agent (with its current capabilities) should have a lower penalty than irreversible ones. However, even reversible changes might incur a penalty if they cause temporary disruption. *Non-negotiable, but the temporary disruption part might be handled by (4).*

  3. **Activity Disruption:** The measure must assign a high penalty to actions that disrupt ongoing human activities, even if the physical state change is minimal (e.g., tidying a workspace that was in use). *Non-negotiable.*

