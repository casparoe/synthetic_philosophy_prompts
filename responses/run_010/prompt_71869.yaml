  But note: Desideratum 5 is closely related to Desideratum 3. So maybe we can merge them and accept that we cannot perfectly capture temporary inconveniences? However, the temporary disruption to a workspace (Desideratum 4) is a temporary inconvenience that we do care about.

  Alternatively, I would consider relaxing **Desideratum 4** because it is very hard to measure. But it is non-negotiable because it represents a critical side effect.

  Therefore, I propose to keep all and note that they are challenging. We might need to accept that the measure will be imperfect.

  But note: the problem says the list must survive the two wrinkles. We must ensure that the measure is agent-relative (since recoverability depends on the agent) and does not presuppose the reward function.

  Now, a short scorecard of main families:

  1. **Reachability-based penalties (e.g., relative reachability):**
