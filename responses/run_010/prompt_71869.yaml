  We are building a side-effect penalty for household robots that perform narrow tasks in a shared environment. The key challenge: we cannot ask the owner to enumerate their values, and the penalty must work without presupposing the reward function. Additionally, the agent (the robot) changes over time (learning new skills, getting upgrades, etc.), so what is recoverable depends on the agent's current capabilities.

  We need desiderata for a measure of "impact" that can serve as a penalty term. The measure should capture unintended changes to the environment that the owner would care about, without being told explicitly what those are.

  Here are the desiderata, each motivated by a concrete case:

  1. **Distinguish between irreplaceable and replaceable objects (Urn vs. Vase):** The measure must recognize that breaking an irreplaceable object (like an urn containing a parent's ashes that looks like a decorative vase) has a high impact, while breaking a replaceable vase (if it is indeed just a decorative item) has low impact. However, note that without explicit labeling, the system must infer this from the context or from the history of interactions.

  2. **Differentiate between important and unimportant piles (Tax Records vs. Newspapers):** The measure must be able to tell that disturbing a stack of old tax records (which might be important for legal reasons) is high impact, while disturbing a stack of old newspapers (which are likely trash) is low impact. Again, without explicit labeling.

  3. **Account for recoverability (Repairable Break vs. Unrecoverable Deletion):** The measure must recognize that an action that breaks an object but can be repaired by the robot (say, within an hour) has lower impact than an action that causes an unrecoverable loss (like deleting the only copy of a file). However, note that recoverability depends on the agent's current capabilities (which change over time).

  4. **Respect ongoing activities (Mid-Thought Workspace):** The measure must penalize a tidy-up that rearranges a workspace where a human was in the middle of a thought process, even if the physical state is the same as a tidy state. The impact comes from disrupting the human's mental state and workflow.

  5. **Non-Marking of Reversible Changes (Eaten Sandwich vs. Deleted File):** The measure should treat the consumption of a sandwich (which is intended and reversible by making a new one) as low impact, but the deletion of an important file (which might be irrecoverable) as high impact. However, note that if the robot can recover the file (e.g., from backup) then the impact might be lower.

  Additionally, we have two wrinkles:

  - **Wrinkle 1:** The measure cannot presuppose the reward function or the human's values beyond the task description.
  - **Wrinkle 2:** The agent (robot) changes over time, so the measure must account for the agent's current capabilities (e.g., what it can recover) and possibly multiple agents (if there are multiple robots).

  We now consider which desiderata are non-negotiable and which might be more flexible.

  Non-negotiable:

  - **Desideratum 1 (Urn vs. Vase):** Without this, the robot might destroy something irreplaceable. This is core to the problem.
  - **Desideratum 2 (Tax Records vs. Newspapers):** Similarly, the robot must be able to distinguish between important and unimportant items without explicit labeling. This is also core.
  - **Desideratum 4 (Mid-Thought Workspace):** Disrupting human activities is a critical side effect we want to avoid.

  Negotiable (or requiring careful interpretation):

  - **Desideratum 3 (Recoverability) and 5 (Reversible Changes):** These are intertwined and depend on the agent's capabilities. They might be combined. Also, note that if the agent can repair something, then the impact might be low, but we must be cautious because the owner might still care about the temporary loss. Moreover, the agent's capabilities change, so the measure must be adaptive.

  Now, we must consider if the list can be written without presupposing the reward function. I believe it is possible, but challenging. The measure must be based on some notion of "distance" from the state that would have been if the robot did nothing (or a minimal action) and must capture the owner's unstated preferences indirectly.

  However, note: some of these distinctions (like the urn vs. vase) require world knowledge that the robot might not have. We must rely on the robot learning from experience or having some general knowledge (e.g., via pretraining) about what objects are typically valuable or irreplaceable.

  Now, which single desideratum knocks out the most existing candidates?

  The requirement to **distinguish between irreplaceable and replaceable objects (Desideratum 1)** is particularly challenging and knocks out many existing approaches. For example:

  - **Reachability-based penalties** (e.g., relative reachability) measure how much the action changes the set of reachable states. However, they do not inherently distinguish between states that are more or less valuable. A state where the urn is broken might be as reachable as one where a vase is broken, but the impact is different.

  - **Attainable Utility (AU) penalties** measure changes in the agent's ability to achieve future goals. However, without a known reward function, we cannot compute utility. Moreover, AU might not capture the human's values if the robot's goals are narrow.

  - **State difference measures** (e.g., L2 norm on state features) might not capture the importance of an object. The urn and a vase might be represented similarly in the state vector.

  Thus, Desideratum 1 (and similarly Desideratum 2) are hard because they require the system to have or learn a model of what the human cares about, without being told.

  Now, are any subset of desiderata jointly unsatisfiable?

  Consider:

  - **Desideratum 3 (Recoverability) and Desideratum 5 (Reversible Changes):** These require that the measure accounts for the agent's ability to reverse changes. But the agent's capabilities change over time. Also, what is reversible for the agent might not be reversible for the human (e.g., the robot can repair the object, but the human might be upset during the time it is broken). So we have a tension: we want to mark temporary changes as low impact if they are quickly recoverable, but the human might still care.

  Moreover:

  - **Desideratum 4 (Mid-Thought Workspace):** This is about the disruption to the human's mental state, which is not directly observable and might not leave a trace in the physical state. This is hard to measure without a model of the human's mind.

  Additionally, we must avoid presupposing the reward function (Wrinkle 1). But Desiderata 1, 2, and 4 require knowing what the human cares about. So we have a tension: we need to capture the human's values without being told them.

