answer: |-
  ### Adversarial Collaboration Agreement: Phenomenal Consciousness and Global Access  

  **Parties Involved:**  
  - **Side A:** Holds that phenomenal consciousness (phenomenality) can occur without global access/broadcast ("overflow" view).  
  - **Side B:** Holds that phenomenal consciousness requires global access/broadcast ("no overflow" view).  

  **Objective:** To identify points of agreement, articulate disagreements, and define empirical cruxes to guide future research.  

  ---

  ### 1. Agreed-Upon Claims  
  Both parties endorse the following statements as non-vacuous and empirically grounded. These reflect shared commitments based on existing data and theoretical frameworks:  

  1. **Unconscious Visual Processing Dominates:** A substantial portion of visual processing (e.g., in masked priming, blindsight, or motion perception paradigms) occurs without conscious awareness, as evidenced by behavioral and neural data.  
  2. **Verbal Report is Fallible and Confounded:** Verbal report is an imperfect measure of conscious access, subject to well-understood limitations: criterion shifts (e.g., response bias), rapid decay of sensory information, and the reorienting of attention due to the report task itself.  
  3. **Partial Report Superiority in Sperling-Style Paradigms:** In classic partial report paradigms (e.g., brief display of a multi-item array followed by a delayed cue), performance exceeds whole report capacity. Both sides accept this data but disagree on whether the uncued items were phenomenally conscious at the time of the cue.  
  4. **Global Broadcast Enables Cognitive Functions:** Global broadcast/availability, when it occurs, makes information accessible for reasoning, verbal report, and flexible action control. This functional role is distinct from its relationship to phenomenality.  
  5. **Attention is Incompletely Understood:** Neither side claims a complete account of attention (e.g., its relationship to consciousness, or mechanisms of selection), and both acknowledge unresolved questions about its role in access and phenomenality.  

  **Assessment of Your Candidates:**  
  - All five of your proposed claims (unconscious processing, report fallibility, partial report data, broadcast function, attention incompleteness) are uncontested and included above. The report fallibility claim (#2) is safe: both sides acknowledge these confounds empirically (e.g., Side B cites decay and criterion issues in no-report paradigms, while Side A emphasizes interest-laden distortions). No claims were cut; one was added for clarity (attention).  

  ---

  ### 2. Disagreements Table  
  The table below outlines core disputes. Each row includes:  
  - **Side A's Position:** A statement Side A would endorse as accurately capturing their view.  
  - **Side B's Position:** A statement Side B would endorse as accurately capturing their view.  
  - **Verbal/Substantive:** Whether the disagreement stems from semantic differences (verbal) or empirical/factual divides (substantive). For verbal rows, the underlying substantive question is specified.  

  | Row | Side A's Position                                                                 | Side B's Position                                                                 | Verbal/Substantive | Underlying Substantive Question (if Verbal) |  
  |-----|-----------------------------------------------------------------------------------|-----------------------------------------------------------------------------------|---------------------|---------------------------------------------|  
  | 1   | Phenomenally conscious states can occur without being globally broadcast or accessed. | All phenomenally conscious states are globally broadcast and accessed; there is no phenomenality without broadcast. | Substantive         | N/A                                         |  
  | 2   | The partial report advantage reflects rich phenomenal consciousness that exceeds global access capacity (e.g., uncued items in Sperling are phenomenally conscious but not accessed). | The partial report advantage reflects unconscious sensory memory (e.g., iconic memory); only globally accessed items (e.g., post-cue) become phenomenally conscious. | Substantive         | N/A                                         |  
  | 3   | "Global availability" cannot be defined without circular reliance on phenomenal report or its proxies (e.g., verbal confidence). | "Global availability" can be defined non-circularly via functional (e.g., information integration for action) or neural markers (e.g., late ERP components like P3b). | Verbal              | Can operational markers of global access exist independently of phenomenal consciousness? |  
  | 4   | No-report neural correlates (e.g., recurrent processing in sensory areas) suffice for phenomenality, even without broadcast signatures. | No-report neural correlates are merely prerequisites for consciousness; phenomenality requires broadcast signatures (e.g., frontoparietal activation). | Substantive         | N/A                                         |  

  **Notes on Disagreements:**  
  - **Row 3 (Verbal Disagreement):** The underlying issue is whether global access can be measured independently of phenomenality (e.g., via neural or behavioral proxies not tied to report). Side A sees circularity; Side B argues for independence through "access without phenomenality" cases (e.g., unconscious priming).  
  - **Uncontested Core:** Both sides agree that "phenomenal consciousness" refers to subjective experience (e.g., what it is like to see red), while "global access" refers to cognitive availability. The dispute is whether they dissociate.  

  ---

  ### 3. Empirical Cruxes  
  Cruxes are testable sub-questions that could resolve disagreements. For each:  
  - **Experiment/Case:** A mutually agreed-upon test.  
  - **Predictions:** Stated in advance, in wording each side accepts.  
  - **Outcome Implications:** Described for clarity.  

  #### Crux 1: Richness and Phenomenal Status of Sensory Memory  
  **Experiment:** Sperling-style partial report with no-report neural measures (e.g., EEG/fMRI during array viewing, with post-cue identification). Neural activity is recorded before the cue to assess uncued items.  
  - **Side A Prediction:** "Neural signatures of phenomenal consciousness (e.g., recurrent processing in sensory cortex) will be observed for uncued items during the pre-cue period, without global broadcast markers (e.g., P3b)."  
  - **Side B Prediction:** "Neural signatures of phenomenal consciousness (e.g., global broadcast markers like P3b) will only emerge for cued items; pre-cue activity for uncued items will show only unconscious sensory processing (e.g., early ERP components without late positivity)."  
  - **Surprising Outcome:** Uncued items show strong broadcast signatures without identification capacity, contradicting Side A (no phenomenality without access) and Side B (broadcast enables report).  

  #### Crux 2: Non-Circular Global Availability  
  **Experiment:** Indirect availability test (e.g., masked prime influences a secondary task like decision-making, with neural measures of broadcast, but no prime report).  
  - **Side A Prediction:** "Indirect effects (e.g., priming) will correlate with subjective report measures of phenomenality, not neural broadcast markers, revealing circularity in operationalizing access."  
  - **Side B Prediction:** "Neural broadcast markers (e.g., sustained frontoparietal activity) will predict indirect effects (e.g., priming strength) independently of subjective reports, demonstrating non-circular access."  
  - **Surprising Outcome:** Broadcast markers strongly influence behavior without any subjective phenomenality (e.g., high priming with no conscious detection), supporting Side B; or no link between broadcast markers and behavior when phenomenality is reported, supporting Side A.  

  #### Crux 3: No-Report Paradigms and Access  
  **Experiment:** **Lagged-Report Design** (12-item array, 50ms presentation, cue at variable delays: 100–1500ms). At cue, participants: (1) identify the cued item, and (2) rate visibility/confidence (1–4 scale) for that item. Neural measures (EEG) track decay.  
  - **Side A Prediction:** "Visibility ratings will dissociate from identification accuracy at intermediate delays (300–800ms), with visibility remaining high (>3.0 mean) even when accuracy drops to near-chance (~25%), reflecting residual phenomenality without access."  
  - **Side B Prediction:** "Visibility ratings and identification accuracy will remain tightly coupled across all delays (correlation r > 0.8), collapsing to chance levels (~25% accuracy, mean visibility ~1.5) by 500ms, consistent with decay of a single access-based store."  
  - **Surprising Outcome:** Visibility ratings *exceed* identification at long delays (e.g., 1000ms: visibility ~3.5, accuracy ~25%), supporting Side A; or visibility *collapses faster* than accuracy (e.g., 300ms: visibility ~1.0, accuracy ~80%), suggesting visibility ratings are more access-laden than Side A claims.  

  ---

  ### 4. Flagged Unsignable Content  
  The following elements cannot be signed by either side at present:  
  - **Resolution of Cruxes:** Predictions (Section 3) are commitments to *interpret* future results, not claims about current truth.  
  - **Neural Correlates as Definitive:** Neither side agrees that any single neural marker (e.g., recurrent processing, P3b) is conclusively necessary/sufficient for phenomenality or access.  
  - **Attention/Phenomenality Link:** While both agree attention is unresolved (Agreement #5), neither will endorse a specific model (e.g., "attention is necessary for phenomenality").  

  ---  
  **Document End**  
  *Both parties affirm this document as a basis for structured debate and future collaborative testing.*
