prompt: |-
  In November, voters in my city of roughly 210,000 approved a charter amendment establishing a standing Citizens' Budget Panel with power to redirect up to $4 million of discretionary capital spending each fiscal year. The amendment is remarkably thin. It provides only that: the panel consists of twenty-one members seated in three cohorts of seven; each cohort serves a single term of eighteen months, with a new cohort seated every six months; members are drawn "by lot from the residents of the city"; no person who currently holds or has held within the previous five years an elected office, a paid city position, or a state lobbying registration may serve; no member may ever be reselected, under any circumstances; and the panel's adopted recommendations take effect unless the council rejects them within ninety days by a two-thirds vote.

  Everything the amendment left blank now falls to me. I direct the office of civic engagement, which will run two selection cycles a year in perpetuity. The council's rules committee will consider my operating regulations in January, after which the city attorney must certify any provision touching eligibility or exclusion. My resources are $60,000 per cycle, one part-time analyst who can run descriptive statistics but has no training in survey sampling, eight weeks from the first mailing to the first session, and no power to compel anyone to serve. Quorum is a majority of seated members.

  Please write the selection-and-composition procedure my office can adopt as a regulation and run every cycle. I want it as an ordered sequence of steps, each stating its inputs, the decision it makes, and what would count as a sufficient resolution rather than a deferral. Where the procedure should halt and refuse to seat, say so and say why. Where the question is normative rather than empirical and must therefore go to a person, name the person and specify exactly what that person is being asked to decide, so that the choice is visible rather than buried in my office's discretion.

  The procedure should confront three structural problems head-on rather than assuming them away. First, the panel's legitimacy rests on its resemblance to the city, but resemblance is purchased from a pool of people who volunteer, and the two come apart; I need a defensible rule for how much divergence from citywide targets my office tolerates, applied against what, and on what basis. Second, the one-term-only rule caps every member's tenure at eighteen months, which means the only people who accumulate knowledge of how this process works across cycles are the unelected staff and any consultants we hire — the rule meant to prevent entrenchment guarantees that the entrenchment, such as it is, will be unelected. State plainly who carries continuity, by what mechanism, and what that costs. Third, because the panel's recommendations survive unless two-thirds of the council votes them down, opponents who cannot reliably command that vote have every incentive to shape the selection procedure itself instead. I therefore want the procedure to specify what must be fixed, published, and unalterable before the city knows which items are on the coming cycle's agenda, and what may legitimately be adjusted afterward — treating the design as something that must be pre-committed to be credible.

  Then run the procedure on three cases:

  1. A cycle whose agenda includes capital items for school facilities, announced in the same month the district proposes closing an elementary school. Response volume triples, and the respondent pool is roughly two-thirds drawn from two neighborhoods, heavily weighted toward people who have already organized publicly on the closure.
  2. A council member requests that a retired city engineer, who is ineligible for elective office and has no lobbying history, be seated on the coming cohort, on the ground that the panel would otherwise make a technical error about drainage.
  3. The stratum for residents aged 18 to 29 in rental households returns four respondents against a target of nine, and one of the four served on the first cohort and asks to serve again.

  At least one of these should produce an outcome I will find unwelcome, and I would rather be told so directly than handed a compromise that conceals the cost. I also want to know which of my office's likely practices would require an amendment rather than a regulation — for instance whether I may exclude close relatives of current council members, whether I may reserve seats, and whether a former member could be seated in a non-voting procedural capacity without violating the clause against reselection. Where the answer depends on the city attorney, tell me what to ask him.

  Finally, include a short closing section on the limits of what you have given me: which steps will misfire, which look mechanical but are in fact value choices wearing a number, and what the procedure cannot settle at all. Do not give me a reading list, citations, or names of studies; put the reasoning inline, and write for a reader who understands the general case for and against selection by lot, and the general case for and against amateur legislatures, but has never had to design one under a budget and a deadline.
reasoning: |-
  We are designing a selection procedure for a Citizens' Budget Panel with the following constraints and goals:

  - 21 members, seated in three cohorts of 7 each, with a new cohort every 6 months and each cohort serving 18 months.
  - Members are drawn by lot from residents, with exclusions for current or recent (within 5 years) elected officials, paid city employees, and state lobbyists.
  - No member may be reselected under any circumstances.
  - The procedure must be run every cycle (twice a year) with:
    - $60,000 per cycle
    - One part-time analyst (capable of descriptive statistics, not survey sampling)
    - 8 weeks from first mailing to first session
    - No power to compel service
  - Quorum is a majority of seated members (so at least 11 of 21 must be present to conduct business).

  The procedure must address three structural problems:

  1. **Representativeness vs. Volunteer Pool**: We need a rule for tolerating divergence from citywide demographic targets.
  2. **Continuity**: The one-term rule means only staff and consultants carry institutional memory. We must state how continuity is maintained and at what cost.
  3. **Strategic Manipulation**: The procedure must pre-commit to fixed rules to avoid manipulation by opponents.

  Additionally, we must run the procedure on three test cases and address legal questions about exclusions and reselection.

  ### Design Principles

  - **Pre-commitment**: Fixed rules published in advance, especially before the agenda is known.
  - **Transparency**: Every step is documented and decisions are made by specified persons, not hidden in discretion.
  - **Defensible Tolerances**: Explicit thresholds for divergence from representativeness.

  ### Proposed Procedure: Ordered Steps

  **Step 0: Pre-cycle Fixed Rules Publication (Before Agenda Announcement)**
  - **Inputs**: None (this step sets the rules for the cycle).
  - **Decision**: Publish the following fixed rules for the upcoming cycle:
    - The demographic characteristics (strata) for which representativeness will be measured. These must be based on the most recent census or city data. We propose: age (18-29, 30-44, 45-64, 65+), race/ethnicity (as defined by the census), gender (man, woman, non-binary/other), and household type (rental vs. owner-occupied). Also, we will use geographic distribution by council district or neighborhood (if the city has defined neighborhoods).
    - The target proportion for each stratum, which is the proportion of the city's adult population in that stratum.
    - The maximum allowable divergence (tolerance) for any stratum: we set a tolerance of 50% relative deviation (i.e., the panel's proportion for a stratum must be at least half the target proportion and no more than double). For example, if a stratum is 10% of the city, the panel must have between 5% and 20% for that stratum. This is a value choice but defensible as a balance between strictness and feasibility. Also, we require that no council district has zero representation (if using districts) and that the overall composition does not deviate by more than 10 percentage points in any one stratum (absolute) and 20% in the aggregate (using a dissimilarity index). The details of these tolerances must be approved by the City Council's rules committee and certified by the city attorney as part of the regulation.
    - The exact method of random selection: we will use a two-stage process. First, a random sample of residents (from a list of registered voters and a supplemental list of residents from utility records or other sources) is invited to apply. Second, from the pool of volunteers, we will use stratified random sampling to select the cohort, aiming to hit the targets within the tolerances.
    - The exact process for handling under-subscription: if a stratum is under-subscribed, we will allow a lower tolerance (down to 33% of the target proportion) for that stratum, but if even that is not met, we will halt and refuse to seat the cohort. We will also define the order of filling: first, we fill the mandatory strata (like geography to ensure no district is missing) and then the others.
    - The procedure for replacing members who decline after selection: we will have a ranked waiting list by stratum and replace in order. If the waiting list is exhausted, we halt and refuse to seat.
    - The definition of "resident": must be a current resident of the city, at least 18 years old, and not ineligible (as per the charter).
    - The exact exclusion criteria: we will exclude anyone who (a) currently holds an elected office, (b) held an elected office in the past 5 years, (c) currently holds a paid city position, (d) held a paid city position in the past 5 years, (e) is currently registered as a state lobbyist, or (f) has been registered as a state lobbyist in the past 5 years. We will also exclude anyone who has ever served on the panel before (per the charter). We will not exclude close relatives of council members unless the city attorney rules that the charter amendment allows it. We will not reserve seats for specific professions (like engineers) because that would violate the random selection principle.
  - **Sufficient Resolution**: The rules are published in a city document and posted online at least 30 days before the first mailing. The city attorney must certify that the rules comply with the charter amendment.

  **Step 1: Invitation Mailing (Week 1)**
  - **Inputs**: Master list of residents (from voter registration and utility records, supplemented by other sources if available and within budget), excluding ineligible persons as defined in Step 0.
  - **Decision**: Send invitations to a random sample of residents (stratified by the target demographics to the extent possible with the initial sample). The sample size is determined by the budget: we can afford to mail 10,000 invitations (at $1 each for printing and postage) and expect a 2-5% response rate (200-500 volunteers). The invitation includes a clear description of the time commitment (one meeting per month for 18 months, plus preparation) and a statement that service is voluntary. It also includes a deadline for response (3 weeks).
  - **Sufficient Resolution**: Mailing is completed by the end of week 1.

  **Step 2: Volunteer Pool Collection and Validation (Week 4)**
  - **Inputs**: Responses from the mailing, plus online responses (if offered). Also, a check against exclusion criteria (using public records for elected positions, city payroll, and state lobbying registries).
  - **Decision**: 
    - Validate residency and eligibility (using provided address and cross-checking with city records). 
    - Remove duplicates and ineligible volunteers. 
    - Assign each volunteer to their demographic strata (based on self-reported data from the response form). 
    - If a volunteer declines after being contacted, remove them.
  - **Sufficient Resolution**: A clean list of eligible volunteers with their stratum assignments by the end of week 4.

  **Step 3: Stratum Fulfillment Check (Week 5)**
  - **Inputs**: Cleaned volunteer list, target proportions, and tolerances (from Step 0).
  - **Decision**: For each stratum, count the number of volunteers and compare to the target number for the cohort (which is 7 members, so the target for a stratum is the city proportion multiplied by 7). Check if the number of volunteers in each stratum meets the minimum required (which is the target multiplied by the tolerance floor, e.g., 50% of the target). 
    - **If any stratum fails the minimum tolerance (e.g., fewer than 50% of the target number of volunteers)**, then we move to a second round of recruitment for that stratum only. We will send a targeted mailing to 500 residents in the under-represented stratum (using the master list) at an additional cost of $500. If after this (by week 6) the stratum still does not meet the minimum, we halt and refuse to seat the cohort. The reason is that the panel would not be representative enough to be legitimate.
    - **If all strata meet the minimum tolerance**, proceed to selection.
  - **Sufficient Resolution**: By the end of week 5, either a decision to halt or a decision to proceed with a second mailing for under-represented strata.

  **Step 4: Selection and Waiting List (Week 6)**
  - **Inputs**: Final volunteer pool (after any second mailing), target proportions, and tolerances.
  - **Decision**: Use stratified random sampling to select 7 members and a waiting list (ordered by stratum and then randomly). The selection algorithm:
    - Order the strata by priority (geography first, then age, then race, then gender, then household type) to ensure no council district is missing.
    - For each stratum, select a number of members equal to the target proportion (rounded to the nearest integer) but constrained by the tolerance (so the actual number selected for a stratum must be between floor(target * 0.5) and ceil(target * 2.0)). If the rounding and constraints lead to a total not equal to 7, adjust by increasing or decreasing the number in the least sensitive stratum (as defined by the priority order) within the tolerance.
    - Within each stratum, select randomly.
    - Also, create a waiting list of 10 individuals (or as many as possible if the pool is small) with the same stratification to replace decliners.
  - **Sufficient Resolution**: A list of 7 selected members and a waiting list by stratum by the end of week 6.

  **Step 5: Notification and Replacement (Weeks 6-7)**
  - **Inputs**: Selected members and waiting list.
  - **Decision**: Notify the selected members by phone and mail. If a member declines, replace them with the next person on the waiting list in the same stratum. If the waiting list for a stratum is exhausted, replace with a volunteer from a similar stratum (using a predefined similarity matrix, e.g., for age, we might consider adjacent age groups) but only if the substitution does not push the overall composition beyond the tolerances. If we cannot find a replacement without violating tolerances, halt and refuse to seat.
  - **Sufficient Resolution**: A confirmed cohort of 7 members by the end of week 7.

  **Step 6: Final Check and Seating (Week 8)**
  - **Inputs**: Confirmed cohort.
  - **Decision**: 
    - Check that the cohort meets the tolerances (using the actual assigned strata). 
    - Verify that no member is ineligible. 
    - Publish the names and demographic breakdown of the cohort (without identifying individuals) to show how it compares to the city. 
    - If the cohort does not meet the tolerances, halt and refuse to seat. Otherwise, seat the cohort.
  - **Sufficient Resolution**: The cohort is seated at the first session.

  ### Continuity Mechanism

  The one-term rule means that institutional memory is carried only by staff and consultants. We assign this role to the part-time analyst and the director (you). The analyst will maintain a database of past decisions, rationale, and lessons learned. The director will brief each new cohort on the history and process. Additionally, we will use a portion of the budget ($5,000 per cycle) to hire a consultant for the first year to develop a handbook and training materials. This cost is within the $60,000 budget.

  ### Addressing Strategic Manipulation

  By fixing the rules (including the demographic targets and tolerances) before the agenda is announced, we prevent opponents from trying to influence the selection based on the cycle's topics. The only adjustments allowed after the agenda is announced are logistical (e.g., changing meeting dates) but not the selection criteria.

  ### Test Cases

  **Case 1: School Closure Agenda, Biased Response**
  - Agenda: Capital items for school facilities, announced when the district proposes closing an elementary school.
  - Response: Volume triples, and 2/3 of respondents are from two neighborhoods, heavily weighted toward people organized on the closure.
  - **Procedure**:
    - Step 1: We mail 10,000 invitations (random sample). We get 600 responses (triple the usual 200) but 400 are from two neighborhoods.
    - Step 2: We clean the data and assign strata. We note that the distribution is skewed: for example, the two neighborhoods might be one council district, which now has 400 volunteers but the target for that district is only 1 (since 7 members for 5 districts would be about 1-2 per district). However, our tolerance for geography requires at least one member from each district and at most three. The skewed response might over-represent one district and under-represent others.
    - Step 3: We check stratum fulfillment. Suppose the two neighborhoods are in District A, which has a target of 1.4 (so between 0.7 and 2.8, meaning 1 to 3 members). We have 400 volunteers from District A, which is more than enough. But District C has only 5 volunteers (target 1.4, minimum tolerance 0.7, so we need at least 1 volunteer). We have 5, which is above the minimum. So we do not halt. However, the age, race, etc., might be skewed. Suppose the volunteers are predominantly aged 45+ and homeowners, but the target for renters is 40% (so 2.8 members). If the volunteer pool has only 10% renters (60 out of 600), then the minimum tolerance (50% of target, so 1.4) requires at least 2 renters. We have 60, so we have enough. But the distribution by neighborhood is a problem only if it causes a geographic stratum to be under-represented in the volunteer pool? Not necessarily, because we have volunteers from all districts. The issue is that the over-representation in District A might lead to an over-selection from that district? But our sampling in Step 4 will correct for that because we select to meet the targets. We will select only 1 or 2 from District A (as per the target) and the rest from other districts. So even though the volunteer pool is skewed, the selection will restore balance. However, the volunteers from District A are highly motivated by the school issue, so if we select only 1 or 2 from that district, they might be very vocal. But the procedure does not control for issue intensity. The panel will still be demographically representative. The risk is that the discussion might be dominated by the school issue, but the agenda is about school facilities, so that might be appropriate. The procedure does not halt, and the cohort is seated. This outcome might be unwelcome if we fear the panel will be captured by the organized group, but the procedure cannot filter for that without violating random selection.

  **Case 2: Council Member Requests a Retired City Engineer**
  - Request: Seat a retired city engineer (ineligible for elective office and not a lobbyist) to prevent a technical error.
  - **Procedure**: 
    - The request comes after the rules are fixed (Step 0) and after the volunteer pool is collected. The engineer is not in the volunteer pool. We cannot add him because the pool is fixed by Step 2. Even if he had volunteered, we would select by stratified random sampling. We cannot reserve a seat for an engineer because that would violate the random selection and the charter's "drawn by lot" requirement. We must deny the request. The panel must rely on staff (who can provide technical advice) or the engineer can testify as an expert during the panel's proceedings. The cohort is seated without the engineer. This outcome might be unwelcome if the panel lacks technical expertise, but the procedure does not allow for reservations.

  **Case 3: Under-subscribed Stratum (Young Renters)**
  - The stratum for residents aged 18-29 in rental households has only 4 volunteers against a target of 9 (for the volunteer pool to have enough to select 2-3 members). The target for the cohort in this stratum is 2 (because if the city has 28% in this group, 28% of 7 is 2). The minimum tolerance for the volunteer pool is 50% of the target number of volunteers? Actually, the target for the cohort is 2, so we need at least 2 volunteers in the stratum to have a chance to select 2 (if we have 2, we must take both). But we have 4, which is above the minimum tolerance (which is 1, because 50% of 2 is 1). However, one of the four served on the first cohort and is ineligible. 
  - **Procedure**:
    - Step 2: We remove the ineligible person (former member) from the pool. Now we have 3 volunteers in the stratum.
    - Step 3: The minimum tolerance for the volunteer pool in this stratum is 50% of the target for the cohort (which is 2). So we need at least 1 volunteer (because 0.5 * 2 = 1). We have 3, so we do not do a second mailing. We proceed.
    - Step 4: We aim to select 2 members from this stratum. We have 3 volunteers, so we randomly select 2 and put the third on the waiting list.
    - If one of the two declines, we replace with the third. If both decline, then we have to replace from the waiting list. But the waiting list for this stratum has only one. If that one also declines, we then try a similar stratum (say, age 18-29 in any household, or renters in any age). But if we take from a similar stratum, we must check that it doesn't break the tolerance for the other stratum. Suppose we take a 18-29 homeowner. Then we are reducing the homeowners and increasing the renters? Actually, we are replacing a renter with a homeowner? No, we are trying to fill the renter spot. We might take a 30-44 renter. This would increase the 30-44 renters and decrease the 18-29 renters. We would then have only 1 in the 18-29 renter stratum (instead of 2). We must check if 1 is within tolerance for that stratum (target 2, tolerance 1 to 4). So 1 is acceptable (it is at the floor). However, we have now taken an extra 30-44 renter. If that stratum was already at its maximum, we might break the tolerance. We must recalculate the entire composition. If we cannot find a replacement without violating any tolerance, we halt. In this case, we might be able to replace without violating. But if we cannot, we halt. This outcome might be unwelcome because we might end up with fewer young renters than we want, but the procedure allows for the tolerance and we are within it.

  ### Legal Questions

  - **Excluding close relatives of council members**: The charter amendment does not prohibit this. However, the amendment says "drawn by lot from the residents" without further exclusions. We must ask the city attorney: "Does the charter amendment allow the office to exclude close relatives of current council members? If so, what degree of relationship (e.g., spouse, child, sibling) and what is the legal basis?" Until then, we do not exclude them.
  - **Reserving seats**: The charter requires selection by lot from residents. Reserving seats for specific professions (like engineers) would violate that because it is not random. We cannot reserve seats without an amendment.
  - **Former member in non-voting capacity**: The amendment says "no member may ever be reselected, under any circumstances". A non-voting role is not being "reselected" as a member. We must ask the city attorney: "May a former member be appointed to a non-voting advisory or staff role without violating the charter amendment?" We think it is allowed, but we need certification.

  ### Limits of the Procedure

  1. **Misfires**:
     - The procedure may halt due to under-subscription even when the panel could have been representative enough. This is a risk in cycles with low civic engagement.
     - The tolerances are value choices. Setting the tolerance at 50% relative deviation is arbitrary and might be too loose or too tight.
     - The stratification may not capture important dimensions (e.g., education, income, political views) due to data limitations.

  2. **Value Choices as Numbers**:
     - The choice of strata (age, race, etc.) reflects a normative view of what constitutes representativeness. It assumes these are the most salient identities.
     - The tolerance thresholds are value choices about how much divergence is acceptable.
     - The priority order for filling strata (geography first) is a value choice.

  3. **What the Procedure Cannot Settle**:
     - It cannot ensure that the panel is attentive to the public interest beyond demographics. Some members may be single-issue advocates.
     - It cannot prevent the panel from making poor decisions; it only ensures they are representative.
     - It cannot force the council to engage constructively with the panel's recommendations.

  ### Conclusion

  This procedure provides a clear, pre-committed process that balances representativeness against feasibility. It confronts the three structural problems by setting explicit tolerances, assigning continuity to staff, and fixing rules before the agenda is known. The test cases show that it may produce unwelcome outcomes (like a panel dominated by a hot issue or lacking technical expertise), but these are inherent in the design of sortition. The procedure is within budget and timeline if the response rate is typical. If response rates drop, it may require more funding or incentives to participate.
answer: |-
  ### Selection-and-Composition Procedure  
  **Pre-Commitment Rule:** All steps below (except Step 0) are fixed in the operating regulations *before* the agenda for the cycle is announced. No changes are permitted once the agenda is public.  

  #### **Step 0: Pre-Cycle Setup (Before Agenda Announcement)**  
  - **Inputs:** City demographic data (age, race, gender, household type, neighborhood), budget ($60,000), timeline (8 weeks).  
  - **Decision:** Publish binding targets and tolerances for panel composition.  
    - **Targets:** Proportions must match city demographics (e.g., if 30% of city residents are renters, 30% of the cohort should be renters).  
    - **Tolerances:**  
      - No demographic group (age, race, gender, household type) may deviate by >10 percentage points from citywide proportion.  
      - No neighborhood may deviate by >15 percentage points from its share of the city population.  
      - **Basis:** Tolerances are set to balance feasibility (volunteer pool limitations) and legitimacy (resemblance to the city). *Value choice:* Legitimacy requires visible effort to mirror the city, even if perfect representation is impossible.  
  - **Sufficient Resolution:**  
    - Targets/tolerances published online and in a public report.  
    - City attorney certifies that tolerances comply with the charter’s "drawn by lot" requirement.  

  #### **Step 1: Initial Recruitment (Week 1)**  
  - **Inputs:** Master resident list (voter rolls + utility records), $20,000 budget for mailings.  
  - **Decision:** Mail 15,000 invitations (cost: $1 each), stratified by neighborhood to ensure geographic spread.  
    - **Text:** "You may be randomly selected for civic duty. Service is voluntary. Respond by [date]."  
  - **Sufficient Resolution:** Mailing completed by end of Week 1.  

  #### **Step 2: Volunteer Pool Validation (Week 3)**  
  - **Inputs:** Responses from Step 1, eligibility criteria (no current/recent officeholders, lobbyists, or prior panel service).  
  - **Decision:**  
    - Remove ineligible volunteers (using public records for offices/lobbying; internal database for prior service).  
    - Assign volunteers to demographic strata (age, race, gender, household, neighborhood) based on self-reported data.  
  - **Sufficient Resolution:** Cleaned volunteer list with stratum assignments published online.  

  #### **Step 3: Stratum Adequacy Check (Week 4)**  
  - **Inputs:** Validated volunteer list, city demographic targets, tolerances.  
  - **Decision:**  
    - For each stratum, calculate:  
      - `Volunteer Ratio (VR)` = (# volunteers in stratum) / (target # for cohort).  
      - **Halt Condition:** If any stratum has VR < 0.5 (i.e., <50% of target volunteers), halt and refuse to seat.  
      - **Why?** Legitimacy requires no group is severely underrepresented. Proceeding with VR < 0.5 risks tokenism.  
  - **Sufficient Resolution:** Public report of VR for each stratum. If VR ≥ 0.5 for all, proceed.  

  #### **Step 4: Stratified Random Selection (Week 5)**  
  - **Inputs:** Validated volunteers, targets, tolerances.  
  - **Decision:**  
    - **Algorithm:**  
      1. Assign "priority strata" with lowest VR first (to protect underrepresented groups).  
      2. Randomly select volunteers within each stratum until:  
        - Cohort demographics are within pre-set tolerances (Step 0).  
        - No neighborhood has 0 representation.  
    - **Output:** 7 primary members + 10 alternates (ranked by stratum priority).  
  - **Sufficient Resolution:** List of 7 selected members published.  

  #### **Step 5: Contingency Replacement (Weeks 6–7)**  
  - **Inputs:** Primary members, alternates.  
  - **Decision:**  
    - If a primary member declines, replace with the top alternate *from the same stratum*.  
    - **Halt Condition:** If replacements exhaust alternates in a stratum *and* cohort falls outside tolerances, halt.  
    - **Why?** Tolerances are a hard limit for legitimacy.  
  - **Sufficient Resolution:** Final cohort of 7 confirmed.  

  #### **Step 6: Final Certification (Week 8)**  
  - **Inputs:** Final cohort, eligibility database.  
  - **Decision:**  
    - City attorney verifies no eligibility violations.  
    - **Halt Condition:** If any member is ineligible, halt.  
  - **Sufficient Resolution:** Cohort seated at first session.  

  ---

  ### **Continuity Mechanism**  
  - **Who Carries Continuity:** Unelected staff (your office) and a $5,000/year consultant (funded from cycle budget).  
  - **Mechanism:**  
    - Staff maintain a public "Panel Archive" with past recommendations, voting records, and lessons learned.  
    - Consultant trains each new cohort using archived materials.  
  - **Cost:** $5,000/year reduces per-cycle budget to $55,000 (still feasible).  
  - **Why?** The charter’s one-term rule makes staff/consultants the only source of institutional memory. Transparency mitigates risks of unelected entrenchment.  

  ---

  ### **Test Case Analysis**  
  #### **Case 1: School Closure Agenda**  
  - **Context:** Agenda announced; response triples, dominated by two neighborhoods with activists.  
  - **Procedure Outcome:**  
    - **Step 2:** Volunteer pool is skewed (e.g., Neighborhood A: 60% of volunteers vs. 20% citywide).  
    - **Step 4:** Selection algorithm forces neighborhood diversity (e.g., caps Neighborhood A at 2/7 seats to meet 15% tolerance). Activists may be selected, but not at disproportionate rates.  
    - **Result:** Cohort seated. Likely includes activists but within tolerances.  
  - **Why Unwelcome?** Panel may still be biased toward the closure issue, but the procedure cannot exclude volunteers based on viewpoints without violating neutrality. **You must accept this outcome.**  

  #### **Case 2: Council Member’s Engineer Request**  
  - **Context:** Council member requests seating a retired engineer for "technical expertise."  
  - **Procedure Outcome:**  
    - **Step 2:** Engineer not in volunteer pool → ineligible for selection.  
    - **Step 4:** No "expertise" criterion in selection algorithm.  
    - **Result:** Request denied.  
  - **Why?** Charter requires selection "by lot from residents." Reservations violate randomness. Engineer may testify as a public witness, but not serve.  

  #### **Case 3: Under-Subscribed Young Renters**  
  - **Context:** 18–29 renter stratum: 4 volunteers (target 9); 1 is a prior panelist.  
  - **Procedure Outcome:**  
    - **Step 2:** Prior panelist removed → 3 volunteers remain. VR = 3/9 = 0.33 (<0.5).  
    - **Step 3:** **Halt and refuse to seat.** VR < 0.5 threshold.  
  - **Why Unwelcome?** Cycle fails, delaying the panel. But tolerances are pre-committed; bending them would undermine legitimacy.  

  ---

  ### **Legal Boundaries**  
  Questions for the city attorney:  
  1. **Exclude relatives of council members?**  
     - **Ask:** "Does the charter allow excluding relatives of officials? If yes, what relationship degrees (e.g., spouse, sibling) and what legal standard applies?"  
     - **Likely Answer:** No exclusion permitted unless charter explicitly bars it (it doesn’t).  

  2. **Reserve seats for professions (e.g., engineers)?**  
     - **Answer:** No. Charter requires "lot from residents," not reservations. *Requires amendment to change.*  

  3. **Former member in non-voting role?**  
     - **Ask:** "Does ‘reselected’ in the charter bar non-voting roles (e.g., procedural advisor) for prior members?"  
     - **Likely Answer:** Non-voting roles are likely permitted (not "selection"), but get certification.  

  ---

  ### **Limits of the Procedure**  
  1. **Steps That Misfire:**  
     - **Stratum Adequacy Check (Step 3):** Halting cycles due to low volunteers (Case 3) halts democracy. Fix requires higher budgets for recruitment.  
     - **Replacement (Step 5):** Alternates may decline, causing halts. No solution without compulsion (which you lack).  

  2. **Value Choices as Numbers:**  
     - **Tolerances (Step 0):** A 10% deviation limit is arbitrary. It assumes all groups equally salient, which may be false (e.g., race vs. pet ownership).  
     - **VR Threshold (Step 3):** 0.5 implies 50% underrepresentation is the breaking point. This is a normative tradeoff between legitimacy and feasibility.  

  3. **What the Procedure Cannot Settle:**  
     - **Ideological Balance:** Random selection won’t mirror political views. Activists may dominate (Case 1), but excluding them breaches neutrality.  
     - **Knowledge Gaps:** No mechanism to ensure technical competence (Case 2). Staff must provide expert testimony during panel sessions.  
     - **Long-Term Trust:** If halts occur (Case 3), public may lose faith. Procedure prioritizes legitimacy over expediency.  

  **Final Note:** This procedure pre-commits to transparency but accepts that volunteer-based sortition will sometimes fail or produce biased outcomes. Its strength is defensibility, not perfection.
