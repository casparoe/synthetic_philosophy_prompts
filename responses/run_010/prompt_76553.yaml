answer: |-
  Your hypothesis is correct: the reference class problem is not one problem but three distinct issues masquerading as a single debate. The stalemate arises because each camp addresses a different question while criticizing others for failing to solve their *own* preferred problem. Here’s a diagnosis, engagement with each position, and resolution of your specific queries:

  ### The Tripartite Structure of the Problem
  1. **Semantic Question**: What (if anything) makes a singular probability claim *true*? (e.g., "This patient has a 70% survival chance.")  
     - **Insolubility camp (Venn, Hájek)**: Focuses here. Hájek argues no fact fixes which reference class determines the "true" probability. Any individual belongs to infinitely many classes with conflicting frequencies, so no non-arbitrary truth-maker exists.  

  2. **Normative Question**: Which reference class *should* a rational agent use given their evidence?  
     - **Rule-givers (Reichenbach, Salmon, Kyburg)**: Address this. Reichenbach’s "narrowest reliable statistics" prioritizes stability; Salmon’s "homogeneity" avoids relevant subdivisions; Kyburg’s "specificity" maximizes contextual detail. All are decision procedures for agents, not truth-conditions.  

  3. **Practical-Institutional Question**: Which classes *may permissibly be used* when decisions impact others (e.g., sentencing, medicine)?  
     - **Bayesians & critics**: Redirect here. They argue the "problem" dissolves once we see probability as *epistemic* (governed by Bayesian updating). But institutional constraints (fairness, transparency) still regulate which priors/likelihoods are *actionable*.  

  ### Why the Stalemate Persists
  - **Rule-givers vs. Insolubility camp**: They do not genuinely contradict; they operate in different domains. Hájek (semantic) says no *fact* picks the "correct" class. Salmon (normative) says agents *should* use homogeneous partitions. When Salmon concedes we can only identify "epistemic homogeneity," he implicitly acknowledges the semantic void but offers a pragmatic norm.  
    - **Circularity charge**: It’s benign. Yes, "narrowness/homogeneity/specificity" require a prior property partition, but statistical practice avoids collapse by iteratively refining classes based on predictive success (e.g., adding age/sex to medical risk models when they improve accuracy). This is abductive, not viciously circular.  

  - **Bayesian dismissal**: Relocating to priors *renames* but doesn’t dissolve the problem. Choosing a prior still implicitly selects a reference class (e.g., a prior over "diabetic patients" vs. "diabetic jazz musicians"). Bayesianism converts the reference class question into: *Which likelihoods should inform my prior?* — which replicates the normative debate.  

  - **Lack of decisive counterexamples**: Rules underdetermine answers but rarely "fail" because they’re flexible norms, not algorithms. Reichenbach allows fallback to broader classes if narrow data is sparse; Kyburg’s specificity defaults to broader knowledge. Conflicts arise in edge cases, not typical practice.  

  ### Diagnostic Case: Conflicting Rules  
  **Scenario**: Estimate the probability that **Dev**, a 65-year-old Tamil jazz musician with hypertension, will recover from a rare disease.  
  - **Reichenbach**: Use the narrowest class with reliable stats — say, "hypertensive patients over 60" (recovery: 70%). Ignores ethnicity/occupation due to insufficient data.  
  - **Kyburg**: Use the most specific class with statistical knowledge — say, "Tamil jazz musicians" (recovery: 50%, based on small studies of jazz musicians’ stress and Tamil genetic markers).  
  - **Conflict**: 70% vs. 50%. Each rule is defensible:  
    - Reichenbach avoids noisy small samples.  
    - Kyburg incorporates all known relevant properties.  
  - **Revelation**: This exposes divergent epistemic values. Reichenbach prioritizes *reliability* (avoiding sampling error); Kyburg prioritizes *informativeness* (using all evidence). The rules aren’t flawed — they answer different normative questions about risk tolerance.  

  ### Why No Progress? Incompatible Standards  
  The camps evaluate "success" differently:  
  - **Insolubilists** demand a *metaphysical basis* for singular probabilities.  
  - **Rule-givers** seek *procedural rationality* for agents.  
  - **Bayesians** want *coherent updating* conditional on evidence.  
  These standards are irreconcilable. A "solution" satisfying one camp (e.g., a homogeneity rule for agents) is dismissed by others (e.g., Hájek: "But is it *true*?"; Bayesians: "Why not just condition on all data?").  

  ### What Would Count as Progress  
  Not convergence or a theorem, but **reframing**:  
  1. **Acknowledge the tripartite split** explicitly. The question "Which reference class?" must always be answered with: "For what purpose?"  
  2. **Normative progress**: Show that *under institutional/practical constraints* (e.g., anti-discrimination laws in sentencing), certain class selections are ruled out. For example, using "race" may be prohibited even if statistically relevant, resolving underdetermination by external norms.  
  3. **Link to self-locating credence**: Your suspicion is correct. Debates over "which centred possibilities are peers?" replicate the reference class problem: Is "peer" defined by identical evidence (Reichenbach-style narrowness), shared rationality (Salmon-style homogeneity), or subjective identity (Kyburg-style specificity)? Progress here would clarify how decision contexts (e.g., game theory vs. epistemology) dictate the choice.  

  **Conclusion**: The stalemate persists because each camp answers a distinct question while demanding others meet their own standard. Progress requires abandoning the illusion of a unified problem and instead mapping *which constraints (semantic, normative, or practical) apply in a given context*. The reference class problem isn’t solved — it’s dissolved into a toolkit for diagnosing underdetermination in probabilistic reasoning.
