answer: |-
  Here’s a battle-tested plan for your Buridan’s Ass session, optimized for econ/business students with EU background. The goal is to make indifference *feel* problematic by leveraging their existing toolkit.

  **Core Structure & Sequence (Whiteboard Flow):**  
  *(Total: 75 min)*  

  ### **Phase 1: Anchor in Their Framework (15 min)**
  1.  **EU Refresher (5 min):**  
      - Quick sketch: `Options → Outcomes → Utilities → Maximize EU`.  
      - Ask: *"When would a rational agent be INDIFFERENT between A and B?"* Elicit: *"When EU(A) = EU(B)."*  
      - **Key Point:** Indifference = **no rational grounds to prefer one over the other.**  

  2.  **The "Just Pick" Reflex (5 min):**  
      - Scenario: *"Identical $10 bills on a table — which do you choose?"*  
      - Students will say "either is fine, just grab one!"  
      - **Highlight:** This works because **picking is costless**. Write: **"Axiom: Choice requires no effort (for now)."**  

  3.  **Define Perfect Indifference (5 min):**  
      - "For true indifference, we need:  
        (a) **Objective symmetry** (all properties identical)  
        (b) **Subjective symmetry** (no hidden biases)  
        (c) **Zero transaction cost** (choosing isn’t effortful)"  

  ---

  ### **Phase 2: Build the Paradox (25 min)**  
  4.  **Introduce the Ass (5 min):**  
      - Draw two identical hay piles, equidistant ass. "EU(hay_left) = EU(hay_right)."  
      - **Puzzle Setup:** *"Why wouldn’t it just... eat?"*  

  5.  **The Carrier Example (15 min) — USE BREAD, NOT JOBS:**  
      - **Why bread > jobs:**  
        - Jobs imply subjective fit (culture, vibe) → students will *demand* hidden differences.  
        - Bread is materially identical (same batch, same price, same digestion). Harder to dispute.  
      - **Build it live:**  
        - "Two identical loaves: same bakery, same shelf, same price, same freshness. You’re *truly* indifferent. But you MUST choose one to eat now."  
        - **Add Constraint:** "Choosing requires a *deliberate mental act* — you can’t ‘just grab’ (like the money)."  
      - **Key Q:** *"What happens in your brain when you try to choose?"*  

  6.  **The Paralysis (5 min):**  
      - "If there is **literally no reason** to pick A over B... what *motivates* the choice? EU theory says: *nothing*. So how does choice occur?"  
      - **Write:** **"No reason to choose A ≈ No ability to choose?"**  

  ---

  ### **Phase 3: Misconceptions & Counterarguments (25 min)**  
  *Map each objection to the sequence:*  

  | **Misconception**                | **When it Arises**          | **Response Strategy**                                                                 | **Recruit/Squash?**             |
  | :------------------------------- | :-------------------------- | :------------------------------------------------------------------------------------ | :------------------------------ |
  | **"Tiny differences exist!"**    | Immediately after example   | **Squash:** "Assume perfect symmetry. If we deny this, indifference NEVER exists — but EU relies on it!" Show EU indifference curves. | **Squash** (essential to case) |
  | **"Flip a coin!"**               | During paralysis discussion | **Recruit!** "Yes! This *solves* it. But why? **You’re adding a reason** (obey the coin). Without this — pure indifference → paralysis." | **Recruit** (shows need for a breaker) |
  | **"Under-informed ass!"**        | When defining indifference  | **Pre-empt:** Build symmetry into the example. If raised: "Assume perfect knowledge (like in EU models)."                                  | **Squash**                      |
  | **"Free will is an illusion!"** | Likely post-paralysis       | **Acknowledge/Postpone:** "Fascinating! But let’s stick to decision theory. *Even without free will*, how do *deterministic* models explain picking?" | **Refuse** (off-topic)          |

  ---

  ### **Phase 4: Resolutions & Wrap-up (10 min)**  
  7.  **Decision Cost Breakthrough (5 min):**  
      - *"What if CHOOSING ITSELF has a cost? Time, effort, regret..."*  
      - **Insight:** Indifference + cost of delaying → **random choice is rational** (coin flip). Connects to their EU: minimizing effort.  

  8.  **Buridan’s Actual Donkey? (1 min):**  
      - If asked: *"Buridan used it to argue for moral responsibility. His donkey? Pure fiction — but the logic’s real."*  

  9.  **Killer Closing Question (at 70 min):**  
      > ***"If the ass STARVES, is it because it doesn’t *prefer* one hay pile — or because it *can’t perform the act of choosing* without a preference?"***  
      - **Why it works:** Forces distinction between **indifference** (equality of options) and **inability** (lack of choice mechanism). Econ students will see the "market failure" in decision theory.  

  ---

  **What to Refuse:**  
  - **Free will debates:** *"That’s vital but needs its own lecture! Today: how choice functions break down."*  
  - **Metaphysical indifference:** *"We’re modeling rational choice, not proving reality has identical things."*  
  - **Psychology:** Dodge "but people *feel* differences" — insist this is a *logical* limit of EU.  

  **Why This Works:**  
  Leverages their EU training to show its own boundary. The bread example preempts "hidden differences." The coin flip recruits their pragmatism to reveal the paradox’s core: **no preference → no motive force for choice**. The closing question makes it visceral.  
    
  **Whiteboard Flow Sketch:**  
  ```
  [EU MODEL] → Indifference (EU_A = EU_B) → "Just pick!" (costless)  
  ↓  
  SYMMETRY DEMO: Bread/Job (stress IDENTITY) → "But HOW to choose?"  
  ↓  
  PARALYSIS: No reason → No motive → No choice?  
  ↓  
  OBJECTIONS → Coin flip (adding reason) vs. Tiny differences (reject symmetry)  
  ↓  
  RESOLUTION: Decision costs make randomizing rational  
  ↓  
  KILLER Q: Starvation from indifference or inability?  
  ```  
    
  You’ll have them arguing fiercely by minute 30. Lean into their econ instincts — this is a supply-chain breakdown in the machinery of choice.
