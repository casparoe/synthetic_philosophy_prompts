  - Round 3 is engineered to make the veil of ignorance look good: it leads to a more moderate outcome. But it has to assume that people can compare utilities cardinally and that they are expected utility maximizers. This is fair because it's the standard defense.

  **Final Note on Middle Round:** 
  The middle round (intensity reports) might not perfectly dramatize the problem because we are using a common numerical scale (0-100), which acts as a public currency. The students might think that they are comparing utilities by converting to this scale. But note: the scores are not anchored to any real unit, and each group can assign arbitrarily. So it's cheap talk. The problem of comparability remains because we don't know if a "50" from Group A means the same as a "50" from Group B. But the game doesn't force them to define the scale. So it might work.

  However, if the students use the same linear utility model, then the scale might be comparable. But that's unlikely because we haven't revealed the utilities. So it should be okay.

  If we want to avoid the public currency, we could ask for intensity reports in a different form (like "how much would you pay?" but we don't use money). But without a common unit, it's hard to aggregate. The 0-100 scale is a common unit but without calibration.

  We are not smuggling in a public currency that solves the problem because the aggregation is ad hoc: we just add the numbers, but there is no reason to believe that the numbers are comparable.

  So I think it works.
