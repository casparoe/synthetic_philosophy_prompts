  Below is a complete game design for your seminar, structured to meet your specifications. The game avoids lecturing upfront, uses points (no real money), and unfolds in three rounds that mirror the ordinalist-cheap talk-veil of ignorance progression. The debrief explicitly ties gameplay to the debate. I'll be straight about rigging, limitations, and potential pitfalls.

  **Game Title:** *Resource Run*  
  **Materials:** 
  - **Points:** 300 "utility tokens" (paper chits) split into two colors: 150 red (Apples) and 150 blue (Bananas).  
  - **Role Cards:** 18 cards (6 labeled "Type A", 6 "Type B", 6 "Type C") for group assignments.  
  - **Voting Sheets:** For Round 1 (ordinal rankings) and Round 2 (intensity scores).  
  - **Allocation Boards:** Three posters showing resource distributions (details below).  
  - **Random Seat Generator:** A hat with 18 slips (6 "A", 6 "B", 6 "C") for Round 3.  
  - **Timer:** For strict timekeeping.  

  **Preferences Setup:**  
  - **Type A:** Gains 10 points per red token (Apples), 1 point per blue token (Bananas). *Prefers Apples.*  
  - **Type B:** Gains 1 point per red token, 10 points per blue token. *Prefers Bananas.*  
  - **Type C:** Gains 5 points per red token, 5 points per blue token. *Neutral but suffers if deprived: loses 20 points if their total tokens < 20.*  
  *Preferences are secret until the debrief. Students only know their own payoff rules.*  

  **Total Resources:** 150 Apples (red), 150 Bananas (blue) per round.  

  ---

  ### **Game Timeline (90 Minutes Total)**  
  #### **Setup (5 mins)**  
  - Distribute role cards: 6 Type A, 6 Type B, 6 Type C (students sit in groups).  
  - Explain: "We're allocating resources across three rounds. Your goal is to maximize your points. Payoffs depend on your type."  
  - **Rules:** No discussion of "utility" or "comparisons." Focus on points.  

  ---

  #### **Round 1: Ordinal Rankings Only (25 mins)**  
  *(Engineered to make ordinalism look bad: forces a Pareto-efficient but morally obscene outcome via voting.)*  
  - **Rules:**  
    - Three allocation options (displayed on posters):  
      - **Option X:** A: 75🍎, 75🍌; B: 75🍎, 75🍌; C: 0🍎, 0🍌 (C gets nothing).  
      - **Option Y:** A: 0🍎, 0🍌; B: 150🍎, 150🍌; C: 0🍎, 0🍌 (B gets everything).  
      - **Option Z:** A: 150🍎, 150🍌; B: 0🍎, 0🍌; C: 0🍎, 0🍌 (A gets everything).  
    - Groups *rank* options (1st, 2nd, 3rd) via **Borda count** (3 pts for 1st, 2 for 2nd, 1 for 3rd).  
    - Highest total points wins. Ties broken randomly.  
  - **Process:**  
    - Groups discuss internally (5 mins).  
    - Each group submits one ranking (as a unit) (2 mins).  
    - Tally scores and announce winner (3 mins).  
    - Allocate tokens based on winning option (5 mins).  
    - **Silent reflection:** "Write one word describing how you feel about the outcome" (10 mins).  

  ***Predictable Outcome:***  
  - Type A ranks Z > X > Y (wants everything).  
  - Type B ranks Y > X > Z (wants everything).  
  - Type C ranks X > Y = Z (only X gives them tokens; they break ties arbitrarily).  
  - **Borda tally:** Z (A:3, B:1, C:1) = 5; Y (A:1, B:3, C:1) = 5; X (A:2, B:2, C:3) = 7. **X wins** – Type C gets nothing, A/B get equal but suboptimal shares.  
  - **Why it feels obscene:** Type C (25% of class) gets *zero* points (loses 20 for deprivation), while A/B get moderate gains. Even A/B voters feel guilty. Type C is furious.  

  ---

  #### **Round 2: Intensity Reports (Cheap Talk) (20 mins)**  
  *(Engineered to make cardinal reporting look bad: incentives for exaggeration render scores meaningless.)*  
  - **Rules:**  
    - Same three options (X, Y, Z).  
    - Each group submits an **intensity score** (0–100) for each option (100 = "best for us").  
    - Scores are averaged within groups, then summed across groups. Highest total wins.  
  - **Process:**  
    - Explain scoring (2 mins): "Rate how much your group *likes* each option."  
    - Groups discuss and submit scores (5 mins).  
    - Tally and announce winner (3 mins).  
    - Allocate tokens (5 mins).  
    - **Group reveals:** "Share one score your group gave and why" (5 mins).  

  ***Predictable Outcome:***  
  - Type A rates Z:100, X:50, Y:0 (exaggerates to push Z).  
  - Type B rates Y:100, X:50, Z:0 (exaggerates to push Y).  
  - Type C rates X:100, Y:0, Z:0 (exaggerates to avoid zero).  
  - **Tally:** Z:100 (A) + 0 (B) + 0 (C) = 100; Y:0+100+0=100; X:50+50+100=200. **X wins again** – same outcome as Round 1.  
  - **Why cheap talk fails:**  
    - All groups inflate scores for their favorite and deflate others.  
    - Type C’s "100" for X is ignored because A/B’s scores for X are low (strategic underreporting).  
    - In debrief, students admit scores were "lies" to manipulate outcomes.  

  ---

  #### **Round 3: Veil of Ignorance (20 mins)**  
  *(Engineered to make the veil "work" but expose its assumptions: students adopt equity-focused rules, but only by smuggling in comparability.)*  
  - **Rules:**  
    - New option: **Option W:** A: 50🍎, 50🍌; B: 50🍎, 50🍌; C: 50🍎, 50🍌 (equal shares).  
    - Students **do not know their type yet**. They design a voting rule to pick from X, Y, Z, W.  
    - After deciding the rule, roles are randomly assigned (draw from hat).  
  - **Process:**  
    - Explain veil: "You’ll be randomly reassigned to A, B, or C *after* choosing a rule" (2 mins).  
    - Class designs a rule (8 mins). *Common proposals:*  
      - "Rank options + Borda count" (ordinal).  
      - "Rate options 0–10 + sum scores" (cardinal).  
      - "Maximize the minimum points" (Rawlsian).  
    - Vote on rule (3 mins).  
    - Randomly assign new roles (2 mins).  
    - Apply rule and allocate tokens (5 mins).  

  ***Predictable Outcome:***  
  - Students (not knowing future type) usually pick a **cardinal-sum rule** (e.g., "Rate 0–10, sum scores") or a **maximin rule**.  
  - Option W (equal shares) wins under cardinal or maximin.  
  - **Post-reassignment reaction:** Types A/B are disappointed (lower points), Type C is relieved.  

  ---

  ### **Debrief (20 mins)**  
  **Step 1: Elicit Reactions**  
  - "What frustrated you in Round 1? Round 2? What felt fair in Round 3?"  
  - *Expected answers:*  
    - R1: "Type C got nothing – rankings hid how desperate they were."  
    - R2: "Scores were lies – no way to know if a ‘100’ from A meant the same as from C."  
    - R3: "Veil made us prioritize fairness, but A/B got screwed."  

  **Step 2: Map to Debate**  
  | **Game Phase**       | **Debate Position**                          | **Underlying Problem**                                  |  
  |----------------------|---------------------------------------------|---------------------------------------------------------|  
  | Round 1 (Ordinal)    | Ordinalist "truce" (1930s)                 | Rankings ignore intensity → unjust outcomes (e.g., Type C starves). |  
  | Round 2 (Intensity)  | Revival of cardinalism (1960s+)             | Cardinal scores are cheap talk → manipulable, not comparable. |  
  | Round 3 (Veil)       | Harsanyi/Rawls (veil of ignorance)         | Veil assumes we *can* compare welfare behind the veil (e.g., scoring W required cardinality). |  

  **Step 3: Reveal the Elephant**  
  - "What we debated is called **interpersonal utility comparisons**. The ordinalist ‘truce’ (R1) avoided it but led to cruelty. Cardinal scores (R2) require it but lack credibility. The veil (R3) ‘solves’ it only by assuming we agree on a way to compare your pain with my gain."  
  - **Economists' view:** "Debate settled in the 1930s? R1 showed why it wasn’t: ordinalism hides moral problems."  
  - **Your view:** "Truce swept it under the rug? R2 proved you – reviving it exposed that we *need* comparisons for ethics, but R2 showed we can’t trust them."  

  ---

  ### **What Predictably Goes Wrong (and How to Steer)**  
  1. **Round 1: No Obscene Outcome**  
     - *Risk:* Students might rank X highly (e.g., B prioritizes avoiding C’s deprivation).  
     - *Steer:* If voting deviates, use the economist duo. Secretly prompt them: "As economists, you know Pareto efficiency matters – rank Y or Z first to maximize your group." This ensures C gets nothing. *Fair?* Yes – it mirrors real-world incentives.  

  2. **Round 2: Truthful Reporting**  
     - *Risk:* Type C might honestly rate X at 50 (not 100), letting Y or Z win.  
     - *Steer:* After scores are submitted but before tallying, ask: "Would you change scores if you knew others exaggerated?" Allow one revision. Most inflate scores.  

  3. **Round 3: No Veil Consensus**  
     - *Risk:* Students deadlock on rule design.  
     - *Steer:* Offer three preset choices: "Borda count (R1)", "Score-sum (R2)", or "Maximin points". Most pick maximin or score-sum.  

  ---

  ### **Limitations: What the Game Cannot Capture**  
  - **The Currency Problem:**  
    Round 2 (intensity) uses a 0–100 scale, which acts as a *de facto public currency* – weakening the "incomparability" point. Students might think, "We compared utilities just fine!" *Mitigation:* Stress in debrief that 0–100 was arbitrary and unanchored (e.g., "Did a 10 from A mean the same sacrifice as a 10 from C?").  

  - **The "Feel-It-Themselves" Flaw:**  
    Preferences in the game are simplistic (linear points). Real-world preferences involve emotions, justice, and incommensurable values – which students won’t "feel" here. *Result:* The veil round (R3) feels more solvable than in reality.  

  ---

  ### **Rigging Assessment (As Requested)**  
  - **Round 1:** Rigged against ordinalism. By design, the Borda count produces an outcome where Type C is sacrificed – highlighting how ordinal rules ignore intensity. *Fair fight?* Yes, because it replicates Arrow’s Impossibility: no voting rule satisfies all fairness criteria with ordinal data.  
  - **Round 2:** Rigged against cardinalism. The scoring mechanism invites exaggeration, exposing cheap talk. *Fair fight?* Yes, because it mirrors the 1970s critique: without observable costs (e.g., money), cardinal scores are strategically manipulable.  
  - **Round 3:** Rigged for the veil. Students usually choose equitable rules, making it "work." *Fair fight?* Partially – it shows the veil’s power but hides its assumptions (comparability). This is pedagogically necessary to set up the debrief.  

  ---

  **Final Note:** This game won’t settle your economist friend’s dogma, but it will force students to confront why the debate *isn’t* settled. The key is leaning into the emotions – the outrage in R1, the betrayal in R2, the reluctant equity in R3. That visceral experience sets up your debrief to hit hard: "We either ignore suffering (ordinalism), fake comparisons (cardinalism), or pretend we can compare (veil). Pick your poison."
