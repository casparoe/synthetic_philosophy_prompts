  ### Comments on Script  

  #### **(a) Mark: 15/30**  
  **Strengths:**  
  - "Regret reports a state of mind... An apology is different in kind": Excellent distinction between regret (descriptive) and apology (performative), grounded in Austinian speech-act theory. Clear and philosophically sound.  
  - "An apology... puts herself in the position of one who owes": Precise articulation of apology’s normative function.  
  - "Regret 'at the suffering caused'... while holding that what produced it was legitimate": Strong analysis of how regret avoids accountability.  

  **Weaknesses & Corrections:**  
  - **"An insincere apology isn’t an apology at all"**: **Misstep.** Austin distinguishes *misfires* (invalid acts, e.g., fake registrar) from *abuses* (insincere but valid acts, e.g., false promise). An insincere apology *is* still an apology (it creates normative expectations), but it is *flawed*. The motion’s refusal to acknowledge wrongdoing makes it a *misfire* (not a genuine apology), not merely insincere. Your conflation weakens the argument.  
  - **"A state doesn’t spend resources on a gesture it intends to be empty"**: Overly charitable. Funds can be *instrumental* (e.g., pacification) without implying acknowledgment. This undermines your earlier critique.  
  - **Missing core requirement**: You omit that an apology must *explicitly accept fault* (Govier’s condition). The motion’s avoidance of "wrongful" isn’t just coy—it voids the speech act.  

  **Overall:** Strong start but loses focus. The Austinian framework is apt but misapplied in key places. Needed tighter analysis of *why* avoiding "wrongful" is fatal.  

  ---

  #### **(b) Mark: 25/35**  
  **Strengths:**  
  - "The MP’s objection conflates the population with the state": Superb rebuttal. Clear institutional continuity argument ("same entity that signs treaties") aligns with state-responsibility theory (e.g., Thompson).  
  - "Benefiting from the removals makes current Vardians responsible": **Highlight-worthy insight.** Transfers responsibility from *causation* to *unjust enrichment* (Butt, Pogge), addressing the second half of the question incisively.  
  - "The Kerrin are still worse off... a present fact": Vital link to ongoing harm.  

  **Weaknesses & Corrections:**  
  - **"The apology isn’t merely institutional bookkeeping"**: Needed to explicitly tie this to *why* the state must apologize *regardless* of living perpetrators. The MP’s error is deeper: confusing *moral* responsibility (which can lapse) with *political* responsibility (which persists via institutions/benefits).  
  - **Underdeveloped counterfactual**: You note present disadvantage but skip the *"better off"* hypothetical. If Vardians benefited *without* harming the Kerrin (e.g., via voluntary sale), the enrichment argument weakens. You imply but don’t argue that *this* benefit stems from *injustice*.  

  **Overall:** Robust institutional analysis and excellent enrichment angle. Points docked for not fully engaging the benefit hypothetical.  

  ---

  #### **(c) Mark: 28/35**  
  **Strengths:**  
  - "Forgiveness isn’t the wrongdoer’s to take... converts the response into entitlement": Perfect grasp of victim agency (Murphy, Griswold).  
  - "Derrida’s argument... bundled apology is a purchase": **Exceptional application.** Bundling fund/apology as "transaction" exposes conditional forgiveness—core political philosophy.  
  - "A speech act requires uptake": Technically precise (Austin, Searle). Refusal as political act ("choice to make") is perceptive.  

  **Weaknesses & Corrections:**  
  - **"Undoes the apology"**: Overreach. Uptake affects *efficacy* (whether reconciliation occurs), not *validity* (whether apology was *made*). The state *can* issue an apology even if rejected; its failure is *relational*, not existential.  
  - **Cost to Kerrin**: The point about the state weaponizing refusal ("apologized and got nothing") is astute but under-explored.  

  **Overall:** Near-flawless. Derrida and uptake theory elevate the response. Minor deduction for "undoes" overstatement.  

