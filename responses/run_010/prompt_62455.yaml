prompt: |-
  I am a junior and the founding president of the behavioral economics club at my high school. Twice each year we run a choice experiment on roughly fifty student volunteers and present the findings at a regional student research symposium, where faculty from two nearby colleges serve as judges. Our submission last spring was returned with the criticism that our conclusions had outrun our design, so this semester we are trying to build something that can withstand scrutiny. Our faculty advisor is a mathematics teacher with no training in decision theory; she will not sign the protocol until she can follow each step and satisfy herself that we are not overreaching. Sessions run forty minutes, our entire incentive budget is about fifty dollars, and no member of the club has taken statistics beyond an introductory course.

  Our subject is the independence axiom of expected utility theory and the pattern of choices associated with the Allais paradox. We intend to use the familiar four options: a certain one million dollars; a 10 percent chance of five million dollars, an 89 percent chance of one million, and a 1 percent chance of nothing; an 11 percent chance of one million dollars; and a 10 percent chance of five million dollars.

  What I need is a numbered procedure the club can actually carry out. It should tell us how to assemble a pair of tasks that is genuinely capable of detecting a violation of independence, and how to check that what we have assembled has the intended structure; what to ask each participant, in what order, and with what comprehension checks; which response pattern counts as a violation; what rival explanations we are obliged to rule out before our report may state that a participant violates expected utility theory; and what to do with participants who either keep or abandon the pattern once the two choices are placed in front of them together. Please be exact about how much of this reasoning depends on knowing a participant's utility function and how much does not, because that is the point I understand least well and, I suspect, the point on which we will be judged. Keep the mathematics within reach of a capable high school student with a calculator, but supply enough of the underlying theory that my advisor can audit the procedure on her own.

  Mark plainly the places where the procedure runs out and leaves us with a judgment call rather than a method, and state what our study cannot establish even if everything goes perfectly — including whether a clean, repeated pattern of the relevant kind entitles us to describe our volunteers as irrational.

  Then apply the procedure to three designs. First, both pairs presented to all fifty participants within a single session, in sequence, for hypothetical payoffs. Second, the same pair split between two groups, one task per group, with a real token payment for whichever choice we implement. Third, a version we devised ourselves in which every dollar figure is scaled down from millions to single digits, on the reasoning that our volunteers have never handled sums that large and so cannot have settled intuitions about them. For each, say what the procedure requires us to do, what it permits us to conclude, and what it forbids us from concluding. If it condemns one of the three, I would much rather learn that now than in front of the judges.

  Please write your response in American English.
reasoning: |-
  We are designing an experiment to test the independence axiom of expected utility theory using the Allais paradox. The Allais paradox involves four options:

  Option A1: Certain $1 million
  Option A2: 10% chance of $5 million, 89% chance of $1 million, 1% chance of $0

  Option B1: 11% chance of $1 million, 89% chance of $0
  Option B2: 10% chance of $5 million, 90% chance of $0

  The typical violation of expected utility theory (EUT) is when a participant chooses A1 over A2 and B2 over B1. This pattern violates the independence axiom because the two pairs are constructed so that if the common outcome (89% chance of $1 million in the first pair and 89% chance of $0 in the second) is removed, the remaining choices should be the same. However, people often choose the certain outcome in the first pair and the riskier but potentially higher payoff in the second.

  We are to design a procedure that can detect such a violation. We must consider:

  1. How to present the tasks to the participants.
  2. How to check comprehension.
  3. What response pattern constitutes a violation.
  4. What rival explanations we must rule out.
  5. How to handle participants who change their mind when both choices are presented together.

  Important: The independence axiom does not depend on the participant's utility function. The violation is a pattern of choices that is inconsistent with any utility function (under EUT). Therefore, we do not need to know the utility function to detect the violation.

  However, note that the Allais paradox is typically presented with large sums of money, and it is argued that people have non-linear probability weighting or violate independence due to certainty effects. But the violation is defined by the pattern, not by the utility function.

  Procedure:

  1. **Design of the Tasks**:
     We need two tasks:
     - Task 1: Choose between Option A1 and Option A2.
     - Task 2: Choose between Option B1 and Option B2.

     The options are as described above. We must represent the probabilities accurately.

  2. **Comprehension Checks**:
     Since our participants are high school students, we must ensure they understand the probabilities and the outcomes. We can do this by:
     - Providing a visual aid (like a pie chart or a bar divided into 100 parts) for each option.
     - Asking them to restate in their own words what each option means.
     - Including a practice question with simple probabilities (e.g., a 50% chance of $10 and 50% of $0) to see if they understand the concept of chance.

  3. **Order of Presentation**:
     We must consider order effects. One common approach is to randomize the order of the two tasks. However, note that the Allais paradox is typically observed when the first pair (with the certain outcome) is presented first. But to avoid bias, we can use two orders: half the participants get Task 1 then Task 2, and the other half get Task 2 then Task 1.

  4. **Response Pattern that Counts as a Violation**:
     A violation of the independence axiom (and thus EUT) is when a participant chooses:
     - A1 (certain $1M) in Task 1 and B2 (10% chance of $5M) in Task 2.

     Why? Because under EUT, if a person prefers A1 to A2, then they must prefer B1 to B2. Let's see:

     Let u(0)=0, u(1M)=u1, u(5M)=u5.

     Then:
     A1: u1
     A2: 0.10*u5 + 0.89*u1 + 0.01*0 = 0.10*u5 + 0.89*u1

     So A1 > A2 implies: u1 > 0.10*u5 + 0.89*u1  =>  0.11*u1 > 0.10*u5  => u1 > (10/11)*u5.

     Now for the second pair:
     B1: 0.11*u1
     B2: 0.10*u5

     So if u1 > (10/11)*u5, then 0.11*u1 > 0.10*u5, meaning B1 should be preferred to B2.

     Therefore, if a participant chooses A1 and B2, we have a contradiction. This pattern violates EUT regardless of the specific utility function (as long as u5>u1>0).

  5. **Rival Explanations to Rule Out**:
     - **Misunderstanding of probabilities**: We must ensure that the participant understands the probabilities. This is why comprehension checks are critical.
     - **Order effects**: As noted, we randomize the order of the tasks.
     - **Incentive compatibility**: If the payoffs are hypothetical, participants might not take the task seriously. We must consider using real incentives if possible.
     - **Framing effects**: The way the options are presented (e.g., using words vs. numbers, the visual representation) might affect choices. We should use a consistent and clear format.
     - **Random responding**: We might include a dominance check (e.g., an option that is clearly worse) to see if participants are paying attention.

  6. **Handling Participants Who Change Their Mind**:
     We can run two phases:
     - Phase 1: Present the two tasks separately (in random order) and record the choices.
     - Phase 2: Present both choices together and explain the paradox. Ask if they wish to revise either choice. This allows us to see if the violation is robust or if reflection causes the participant to align with EUT.

     However, note that the standard Allais paradox is about the pattern in separate choices. If they change their mind when presented together, that might indicate that they are reasoning about the independence axiom. But we are testing whether they violate independence in the way they naturally make decisions. So we might report both the initial and the revised choices.

  7. **What We Cannot Establish**:
     - We cannot establish that the participants are "irrational". The Allais paradox is a well-documented behavior and might reflect a consistent preference (e.g., via prospect theory) that violates EUT but not necessarily rationality.
     - We cannot generalize beyond our sample (high school students) without further study.
     - We cannot claim that the violation is due to certainty effect without controlling for other factors.

  8. **Mathematical Level**:
     The math required is basic algebra and probability (percentages). We do not need calculus or advanced statistics for the core argument.

  Now, we design the procedure step-by-step.

  **Numbered Procedure for the Club**:

  1. **Preparation**:
     a. Create four option cards (or computer screens) for the two tasks. Each option should clearly state the outcomes and probabilities. Use a visual representation (e.g., a 100-circle grid with sections colored for each outcome) to help comprehension.
     b. Prepare a comprehension check: a simple lottery (e.g., 50% chance of $10, 50% chance of $0) and ask the participant to explain what it means and what they would choose. Also, ask them to calculate the expected value of one of the options (to check their understanding of probabilities and outcomes). They must pass this check to proceed.
     c. Randomization: Prepare a randomization device (like a coin flip) to assign the order of the two tasks for each participant.

  2. **Session Flow** (40 minutes total):
     a. Introduction (5 min): Explain that they will make two choices between pairs of lotteries. Emphasize that there are no right or wrong answers and that we are interested in their preferences.
     b. Comprehension Check (5 min): Administer the practice lottery and the questions. If they fail, explain again and re-check. If they still fail, thank them and exclude them from the study (but we hope this is rare).
     c. Task 1 and Task 2 (20 min):
          - Randomly assign the order of the two tasks.
          - Present the first task. For each task, present the two options side by side. Ask the participant to choose one.
          - Record the choice.
          - Then present the second task and record the choice.
     d. Phase 2: Reflection (10 min):
          - Present both pairs together and explain that sometimes people choose A1 and B2 and that this pattern violates a principle of rational choice called independence. Do not explain the principle in detail, just say that it is a consistency condition.
          - Ask: "Having seen both choices, would you like to change any of your decisions?" If yes, record the revised choices.
     e. Incentive (if real): At the end, randomly select one of the two tasks (by a coin flip) and then implement the lottery they chose in that task. For example, if the selected task is Task 1 and they chose A1, they get $1 (if scaled down) for real. If they chose A2, then roll a 100-sided die (or use a random number generator) to determine the outcome: 1-10: $5, 11-99: $1, 100: $0 (again, scaled appropriately).

  3. **Data Collection**:
     - Record for each participant: 
          - Order of tasks
          - Choice in Task 1 (A1 or A2)
          - Choice in Task 2 (B1 or B2)
          - Whether they passed the comprehension check
          - Revised choices (if any) in Phase 2

  4. **Analysis**:
     - A violation of EUT is recorded if the participant chooses A1 and B2 in the initial choices (Phase 1).
     - We report the number of participants who show this pattern.
     - We also report the number who change their choices in Phase 2 and whether the violation persists.

  5. **Rival Explanations**:
     - To rule out misunderstanding, we only include participants who passed the comprehension check.
     - To rule out order effects, we test whether the violation rate differs by order (using a chi-square test or Fisher's exact test, which we can do with a calculator if we know the counts).
     - If using real incentives, we can compare the violation rate with hypothetical ones (but we are constrained by budget).

  6. **What We Cannot Conclude**:
     - We cannot conclude that participants are irrational. We can only say that their choices violate expected utility theory's independence axiom.
     - We cannot claim that the violation is due to certainty without additional experiments that manipulate certainty.
     - We cannot generalize the rate of violation to the broader population without a representative sample.

  Now, we evaluate the three designs:

  **Design 1: Both pairs presented to all fifty participants within a single session, in sequence, for hypothetical payoffs.**

  - Procedure: We follow the above numbered procedure, but without real incentives. We use hypothetical payoffs (millions of dollars).
  - What we can conclude: We can observe the pattern of choices and count the number of violations (A1 and B2). We can say that these violations are inconsistent with expected utility theory.
  - What we cannot conclude: Because the payoffs are hypothetical, participants might not take the task seriously. Therefore, we cannot rule out that the violations are due to lack of incentives. Also, the large sums might not feel real to high school students, so they might not engage in the same way they would with real money.
  - What the procedure requires: We must do comprehension checks and randomize the order. We must also conduct the reflection phase (Phase 2) to see if violations are robust.

  **Design 2: Split between two groups, one task per group, with a real token payment for whichever choice we implement.**

  - We split the 50 participants into two groups of 25. Group 1 does only Task 1 (A1 vs A2) and Group 2 does only Task 2 (B1 vs B2). We then implement the chosen lottery for real (with scaled-down payoffs, say $1, $5, and $0) and pay one randomly selected participant from each group (so we pay two participants in total, one from each group). Alternatively, we can pay every participant for their choice but with a scaled incentive budget.

    But note: our budget is $50. If we pay every participant, we cannot use millions. We must scale down. Let's assume we scale to: 
        Option A1: Certain $1
        Option A2: 10% chance of $5, 89% chance of $1, 1% chance of $0
        Option B1: 11% chance of $1, 89% chance of $0
        Option B2: 10% chance of $5, 90% chance of $0

    The expected cost per participant in Group 1:
        If all choose A1: $1 each -> $25 for the group.
        If all choose A2: 0.10*5 + 0.89*1 + 0.01*0 = 0.5+0.89 = $1.39 per participant -> $34.75 for the group.

    Similarly, Group 2:
        B1: 0.11*1 = $0.11 per participant -> $2.75 for the group.
        B2: 0.10*5 = $0.50 per participant -> $12.50 for the group.

    We have $50, so if we pay every participant, we need to cover up to about $34.75 + $12.50 = $47.25, which is within budget. But note that we are not paying millions, so we must scale down.

    Alternatively, we can randomly select one participant from each group to receive the payment for the entire group's task. That way, we pay only two participants. But then the incentive for each participant is very low (they have a 1/25 chance of being paid). This might not be sufficient to motivate real effort.

    Given the budget, we can pay every participant. We scale the payoffs so that the expected cost is within $50.

  - However, the split-group design does not allow us to observe the choice pattern in the same individual. We are aggregating across individuals. The independence axiom is about individual preferences. Therefore, we cannot say that any individual violated EUT. We can only say that the proportion choosing A1 in Group 1 and the proportion choosing B2 in Group 2 are such that we see a pattern at the group level that is consistent with the Allais paradox (if the proportion choosing A1 is high and the proportion choosing B2 is high). But note: it is possible that those who choose A1 are not the same as those who choose B2. In fact, we cannot link the choices at the individual level.

  - Therefore, this design is not capable of detecting a violation of the independence axiom at the individual level. It can only show that the Allais pattern is prevalent at the group level. But the independence axiom is an individual consistency condition. So this design is inadequate for our purpose.

  - Conclusion: We cannot use this design to test the independence axiom for individuals. The procedure forbids us from concluding that any individual violates EUT because we do not have both choices from the same person.

  **Design 3: Scaled-down payoffs (from millions to single digits) for all participants in one session, with real payments.**

  - We scale the payoffs to, say:
        A1: Certain $1
        A2: 10% chance of $5, 89% chance of $1, 1% chance of $0
        B1: 11% chance of $1, 89% chance of $0
        B2: 10% chance of $5, 90% chance of $0

  - We run the same procedure as in Design 1 but with real payments. We use the entire incentive budget to pay the participants. We can pay every participant for one randomly selected task (so each participant has a 50% chance of being paid for one of their two choices). We randomly select one task per participant (by coin flip) and then play out the lottery they chose in that task.

    Expected cost per participant:
        For Task 1: 
            If they choose A1: $1
            If they choose A2: 0.10*5 + 0.89*1 + 0.01*0 = $1.39
        For Task 2:
            If they choose B1: 0.11*1 = $0.11
            If they choose B2: 0.10*5 = $0.50

    Since we select one task at random (with 50% chance for each task), the expected cost per participant is:
        0.5 * [ P(choose A1 in Task1)*1 + P(choose A2 in Task1)*1.39 ] 
        + 0.5 * [ P(choose B1 in Task2)*0.11 + P(choose B2 in Task2)*0.50 ]

    We don't know the probabilities, but let's assume worst-case (max cost) for Task1: all choose A2 -> $1.39, and for Task2: all choose B2 -> $0.50. Then the cost per participant would be 0.5*1.39 + 0.5*0.50 = $0.945. For 50 participants: $47.25. So within budget.

  - We can now run the same procedure as in Design 1 but with real money and scaled payoffs.

  - What we can conclude: We can observe individual violations (A1 and B2). Because we are using real incentives, we can argue that the choices are incentive-compatible. This design is the best of the three for our purpose.

  - What we cannot conclude: We cannot be sure that scaling down from millions to single digits preserves the same preferences. It is possible that with small stakes, people are closer to risk neutral, and the violation might be less pronounced. However, the Allais paradox has been observed with both high and low stakes. We can still test the independence axiom, but we must note the stakes in our report.

  - What the procedure requires: We must do everything as in Design 1, plus we must actually pay the participants according to the random selection.

  Summary of the three designs:

  - Design 1 (hypothetical, large stakes): Can detect individual violations but lacks incentives. We must be cautious in interpreting the results (might be due to lack of seriousness). Permitted conclusion: Violations of EUT occur in hypothetical choices with large stakes. Forbidden: Claiming that the same would happen with real money.

  - Design 2 (split-group, real payments): Cannot detect individual violations. We cannot conclude anything about the independence axiom at the individual level. This design is condemned for our purpose.

  - Design 3 (scaled-down, real payments): Can detect individual violations with real incentives. This is the preferred design. We can conclude that we observe violations of the independence axiom of EUT in choices with real, albeit small, stakes.

  Final note: The procedure leaves a judgment call in the scaling of payoffs (from millions to single digits). We assume that the preference patterns are the same. However, this is an open question in behavioral economics. Also, the reflection phase (Phase 2) is not standard and might induce changes that are not natural. But it is interesting to see if the violation is robust to reflection.

  We hope this helps. Good luck with the symposium!
answer: |-
  ### Comprehensive Procedure for Testing the Allais Paradox  
  **Objective**: Detect violations of the independence axiom of expected utility theory (EUT) using the Allais paradox. The violation occurs when a participant chooses:  
  - **Option A1** (certain $1M) over **A2** (10% chance of $5M, 89% of $1M, 1% of $0) in Task 1.  
  - **Option B2** (10% chance of $5M, 90% of $0) over **B1** (11% chance of $1M, 89% of $0) in Task 2.  

  This pattern contradicts EUT because removing the common outcome (89% of $1M in Task 1 and 89% of $0 in Task 2) leaves identical lotteries (11% of $1M vs. 10% of $5M). The violation **does not depend on knowing the participant’s utility function**—it relies solely on the logical inconsistency of choices.  

  ---

  ### Numbered Experimental Procedure  
  **Time Allocation**: 40 minutes per session.  
  **Incentive Budget**: $50 (for real-payment designs).  
  **Participants**: 50 student volunteers.  

  #### Step 1: Preparation (5 minutes)  
  1. **Materials**:  
     - Visual aids: Pie charts or 100-square grids showing probabilities (e.g., A2: 10 red squares for $5M, 89 green for $1M, 1 black for $0).  
     - Randomization tools: Coin for task order, 10-sided die for payouts (if real).  
     - Comprehension quiz (see Step 3).  

  #### Step 2: Task Design (Validating the Structure)  
  2. **Constructing Tasks**:  
     - **Task 1**: A1 (certain $1M) vs. A2 (10% $5M, 89% $1M, 1% $0).  
     - **Task 2**: B1 (11% $1M, 89% $0) vs. B2 (10% $5M, 90% $0).  
     - **Validation Check**:  
       - Remove the common outcome (89% $1M from Task 1 and 89% $0 from Task 2). The remaining choices reduce to:  
         - Task 1 Residual: 11% $1M vs. 10% $5M + 1% $0.  
         - Task 2 Residual: 11% $1M vs. 10% $5M.  
       - Under EUT, both residuals should be treated identically. If choices differ (A1 in Task 1, B2 in Task 2), independence is violated. **No utility function is needed for this check.**  

  #### Step 3: Comprehension Checks (10 minutes)  
  3. **Pre-Task Quiz**:  
     - "Describe Option A2 in your own words."  
     - "In Option B1, what is the chance of winning nothing?"  
     - **Dominance Check**: Include a decoy option (e.g., 0.1% chance of $0.10 vs. 100% chance of $10) to filter inattentive participants.  
     - **Pass Requirement**: Correct answers to all questions. Failures are excluded from analysis.  

  #### Step 4: Task Administration (15 minutes)  
  4. **Order and Presentation**:  
     - Randomize task order: Half of participants receive Task 1 first (Group 1), half receive Task 2 first (Group 2).  
     - **Instructions**: "Choose one option per task. Your choices may have real consequences."  
     - **Hypothetical Payments**: Describe payoffs in millions (e.g., "$1M = 1,000,000 dollars").  
     - **Real Payments**: Scale payoffs to fit budget (e.g., $1 = $1M, $5 = $5M, $0 = $0).  

  5. **Recording Responses**:  
     - For each task, record:  
       - Task 1 choice: A1 or A2.  
       - Task 2 choice: B1 or B2.  

  #### Step 5: Identifying Violations (Post-Session)  
  6. **Violation Definition**:  
     - A participant violates EUT if they choose **A1 in Task 1 and B2 in Task 2**.  
     - **No utility function is involved**—this is a purely logical inconsistency.  

  #### Step 6: Rival Explanations to Rule Out  
  7. **Alternative Causes**:  
     - **Misunderstood Probabilities**: Exclude participants failing comprehension checks.  
     - **Order Effects**: Compare violation rates between Group 1 (Task 1 first) and Group 2 (Task 2 first) using a contingency table and Fisher’s exact test (calculable via online tool).  
     - **Incentive Effects**: For real payments, ensure payouts are salient (e.g., cash immediately).  
     - **Attrition/Boredom**: Monitor time per task (aim for <3 minutes/task).  

  #### Step 7: Reflection Phase (10 minutes)  
  8. **Handling Revisions**:  
     - After initial choices, show both tasks side-by-side.  
     - Ask: "You chose [A1/A2] and [B1/B2]. Does seeing them together change your mind? You may revise one or both choices."  
     - **Record**: Initial choices, final choices, and reasons for revision (optional).  
     - **Analysis**: Report violation rates before and after reflection.  

  #### Step 8: Statistical Analysis  
  9. **Post-Session Calculations**:  
     - Calculate % violating EUT (A1 + B2 pattern).  
     - Use binomial test to compare violation rate to chance (25% if choices random).  
     - **Formula**: \( \text{Violation Rate} = \frac{\text{Number of A1+B2 choices}}{\text{Total participants}} \times 100\% \).  

  ---

  ### What the Procedure Cannot Establish  
  - **Irrationality**: A violation of EUT does not prove "irrationality." Participants may follow prospect theory (e.g., overweighting certainty).  
  - **Generality**: Results may not apply to high-stakes real-world decisions.  
  - **Utility Dependence**: The violation test **never requires utility functions**—it relies on axiom inconsistency.  
  - **Judgment Calls**:  
    - Scaling payoffs (e.g., $5M → $5) assumes "description invariance" (may not hold).  
    - Reflection phase revisions lack a standard rule—report both initial/final choices.  

  ---

  ### Evaluation of Your Three Designs  
  #### Design 1: Both Tasks, Sequential, Hypothetical Payments  
  - **Procedure Requirements**:  
    - Follow Steps 1–7 with hypothetical millions (e.g., "Imagine $1M is $1,000,000").  
    - No real payouts; use visual aids for probabilities.  
  - **Permitted Conclusions**:  
    - "X% of participants violated EUT in hypothetical choices."  
  - **Forbidden Conclusions**:  
    - "Violations prove irrationality."  
    - "Results generalize to real-money decisions."  
  - **Verdict**: **Acceptable but weak**—hypothetical payments may inflate violations due to inattention.  

  #### Design 2: Split Groups, One Task per Group, Real Token Payments  
  - **Procedure Requirements**:  
    - Split 50 participants: Group A (Task 1 only), Group B (Task 2 only).  
    - Pay all participants immediately: e.g., A1 = $1, A2 = die roll (10% $5, 89% $1, 1% $0).  
    - Budget: Max cost = (25 × $5) + (25 × $5) = $250 → **exceeds $50**. Scale to cents: e.g., $0.01 for $1M.  
  - **Permitted Conclusions**:  
    - "In Task 1, X% chose A1; in Task 2, Y% chose B2."  
  - **Forbidden Conclusions**:  
    - **"Any individual violated EUT."** (Choices are from different people.)  
    - "The independence axiom is violated." (Group aggregates ≠ individual inconsistency.)  
  - **Verdict**: **Condemned**—fails to test individual-level violations.  

  #### Design 3: Scaled-Down Payments (Millions to Single Digits)  
  - **Procedure Requirements**:  
    - Map $1M → $1, $5M → $5, $0 → $0.  
    - Pay all participants: Randomly implement one task per person.  
    - Budget: Max cost = 50 participants × $5 = $250 → **exceeds $50**.  
    - **Fix**: Reduce stakes further (e.g., $1M → $0.10, $5M → $0.50). Max cost = 50 × $0.50 = $25.  
  - **Permitted Conclusions**:  
    - "X% violated EUT with real, scaled-down payments."  
    - "Violations persist despite monetary incentives."  
  - **Forbidden Conclusions**:  
    - "Violations would occur at million-dollar stakes."  
    - "Utility functions explain the results." (The test remains axiom-based.)  
  - **Verdict**: **Best design**—tests individual violations with real incentives within budget.  

  ---

  ### Summary Recommendations  
  - **Adopt Design 3 (scaled-down real payments)** for credible individual-level tests.  
  - **Reject Design 2**—it cannot detect individual violations.  
  - **Use Design 1 only if budget prohibits payments**—but disclose its limitations.  
  - **Final Report**: State that violations reflect EUT inconsistencies, not necessarily irrationality. Disclose all judgment calls (scaling, reflection phase).  

  This procedure meets your advisor’s requirements: It uses high-school-level math, explains theory transparently, and highlights where judgment is needed. If executed rigorously, it will withstand scrutiny at the symposium.
