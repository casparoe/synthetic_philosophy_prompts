    "Choose the option that best fits your view for each question. Then, count the number of A's, B's, and C's. The theory with the highest count is your primary view. If there is a tie, you may hold a mixed view."

    Now, we write the quiz:

    The Self-Sorting Quiz: Which Theory of Dreaming Do You Hold?

    Instructions: For each scenario, choose the option (A, B, or C) that best reflects your view.

    1. A person who claims they never dream is awakened during REM sleep in the lab and gives a detailed dream report. What is the best explanation?
        A) They are having dream experiences every night but forget them; the lab awakening captures the dream before forgetting.
        B) They are not having dream experiences, but the lab setting and the act of awakening cause them to confabulate a story.
        C) They are having non-conscious dream activity during sleep, and the awakening allows them to become conscious of it.

    2. A person wakes up with a strong feeling of having dreamed but cannot recall any content. What is the best explanation?
        A) They did have a dream experience during sleep, but it was forgotten upon awakening.
        B) They did not have a dream experience, but the feeling is due to physiological processes of REM sleep.
        C) They had non-conscious dream activity, and the feeling is the residue of that activity without conscious recall.

    3. A person is awakened from REM sleep and reports a dream. Ten minutes later (without having gone back to sleep), they are asked to report the same dream again, and this time the report is significantly different. What is the best explanation?
        A) The dream experience was complex and the person is recalling different aspects each time, or memory of the experience is malleable.
        B) The initial report was confabulated and the second is a different confabulation.
        C) The dream activity was non-conscious, and the recall is unstable because it was not consciously experienced.

    4. Brain imaging during sleep shows patterns of activation that match the content of the dream report given upon awakening (e.g., activation in the visual cortex for a report of visual imagery). What does this imply?
        A) The brain activity is the neural correlate of the dream experience, which was occurring during sleep.
        B) The brain activity is unrelated to the dream report, which is a confabulation; the match is coincidental or due to the awakening process.
        C) The brain activity is the neural basis for a non-conscious process that only becomes conscious upon awakening and reporting.

    5. A person is awakened from non-REM sleep and gives a dream report. According to some theories, non-REM sleep does not typically produce dreams. What is the best explanation for this report?
        A) The person did have a dream experience during non-REM sleep, challenging the idea that dreams are exclusive to REM.
        B) The person confabulated the report in response to the awakening, even though they were not dreaming.
        C) The person had non-conscious dream activity during non-REM sleep, which became conscious upon awakening.

    6. When a person has a lucid dream (where they know they are dreaming), what is happening?
        A) They are having a conscious experience during sleep and are aware it's a dream.
        B) They are not having a conscious experience during sleep, but upon awakening they confabulate a story that includes the idea of being aware it's a dream.
        C) They are having non-conscious dream activity that includes meta-cognition, which becomes conscious upon awakening.

    7. A person has a nightmare and wakes up with a racing heart and fear. What is the best explanation?
        A) The dream experience caused the emotional and physiological response.
        B) The physiological response (like a racing heart) occurred during sleep and the dream report was confabulated to explain it upon waking.
        C) The non-conscious dream activity generated the physiological response, and then the conscious experience of fear came after waking.

    8. In an experiment, a sleeper is exposed to a sound (like a bell) during REM sleep. Upon awakening, they report a dream that incorporates the sound (like a church bell in the dream). What is the best explanation?
        A) The dream experience incorporated the external stimulus in real-time.
        B) The external stimulus was processed non-consciously during sleep and then incorporated into the confabulated dream report upon awakening.
        C) The external stimulus was incorporated during the dream activity, but the experience was non-conscious until awakening.

    Scoring:

    Count the number of A's, B's, and C's you chose.

    - If you have the most A's: You hold an experiential view (dreams are conscious experiences during sleep). This includes plain experientialism and the simulation model.
    - If you have the most B's: You hold a non-experiential view (dream reports are not reports of experiences during sleep). This includes Malcolm's view, cassette theory, and confabulation theory.
