answer: |-
  Here is the complete exam package designed to meet your specifications:

  **Exam Question (to appear on paper)**

  **Section C: Applied Moral Responsibility (20 marks)**  
  *Answer ONE question. Time allocation: 45 minutes.*

  **Question 3:**  
  Analyze the following case using the candidate principle provided:

  > **The Case:** Rosa is a night-shift paramedic. Her service mandates that anyone driving back to base between 3 and 5 a.m. must pull into a designated checkpoint and rest for twenty minutes to mitigate fatigue risk during this peak window. Rosa has developed a habit of skipping this checkpoint sporadically over the past year. On the night in question, she skips it again. Driving home fatigued, she fails to see a cyclist and kills him. Rosa is honest afterwards: she did not make a conscious decision to skip the checkpoint that night; she simply never thought about it at all. Contrast this with Ana, who has an identical habit of sporadic checkpoint skipping on the same shift but encounters no cyclist and arrives home safely.
  >
  > **Candidate Principle:** An agent is blameworthy for an act (φ) done in ignorance only if: (1) φ executes a plan or policy (P) that the agent adopted at some earlier time (t1) when she was not ignorant of the relevant risks; and (2) the adoption of P at t1 was itself blameworthy.

  **Your essay must:**  
  (a) Critically evaluate whether and how well this principle accounts for Rosa's blameworthiness (if any) for *killing the cyclist*. Specifically, address the challenge posed by the *habitual* nature of her omission compared to a discrete act of policy adoption (like deciding to drive after two martinis).  
  (b) Explain what a *repaired* principle would need to do to handle both (i) cases like a discrete decision to drive impaired *and* (ii) cases of habitual negligence like Rosa's, while avoiding "double-counting" blame (i.e., blaming her separately for both forming the habit *and* for the killing if they are linked).  
  (c) Discuss whether Rosa performed any *occurrent blameworthy act* at the precise time of the killing, given that her conscious mental states ("I just didn't think about it") seem non-culpable. If her blameworthiness lies instead in a *standing disposition*, what must a "quality-of-will" account show about that disposition?  
  (d) Assess whether the intuition that Rosa seems *more* blameworthy than Ana pushes us towards accepting resultant moral luck, or whether a risk-based view of blame can adequately capture the difference without luck.

  *Focus on clear, logical argument. You do **not** need to cite specific philosophers or texts.*

  ---

  **Model Answer (Approx. 800 words)**

  The candidate principle offers a plausible account for blameworthiness in some cases of culpable ignorance, such as the "two-martinis" driver. This driver, at t1 (while sober), consciously adopts the policy (P) "I will drive after drinking," knowing the risks. When she later drives impaired (φ) and causes harm, φ executes P, and the blameworthy adoption of P grounds blame for φ. However, Rosa’s case reveals significant flaws in this principle, particularly concerning habitual negligence and occurrent mental states.

  **(a) Principle's Failure & Habitual Negligence:** The principle fails to capture Rosa’s blameworthiness for the killing. Crucially, there is no identifiable *t1* where Rosa consciously *adopted* a policy like "I will skip the checkpoint." Her omission stems from a *habit* formed through repeated, unreflective actions over a year. There was no discrete, culpable act of policy adoption; blameworthiness diffuses across numerous past omissions where she *could* have reflected but didn't. The principle requires a specific blameworthy adoption event executing the later act, but Rosa’s killing doesn’t "execute" a consciously formed plan; it manifests a *culpably acquired disposition* of inattentiveness to safety protocols. The principle cannot locate the necessary t1 or P, making it ill-suited for negligence arising from slow habituation rather than discrete reckless choices.

  **(b) Requirements for a Repaired Principle:** A repaired principle must handle both discrete and habitual culpable ignorance without double-counting. It must:  
  (i) **Cover Discrete Cases:** Retain the core idea that blame for φ done in ignorance can trace back to a prior blameworthy choice *if* such a discrete choice exists (like the martini decision).  
  (ii) **Cover Habit Formation:** Account for cases where no discrete adoption occurs. This requires shifting focus from *executing a plan* to *manifesting a culpably formed character trait or disposition*. Blameworthiness should stem from the agent’s prior *failure to cultivate the necessary attentiveness or care* regarding known risks when it was reasonable to do so. Rosa’s year of sporadic skipping represents a culpable failure to reinforce the mandated safety habit, creating a disposition toward dangerous inattention.  
  (iii) **Avoid Double-Counting:** The repair must ensure we aren’t blaming Rosa *separately* for the habit-formation *and* the killing. The blame for the killing *is grounded in* the blameworthiness of the prior negligence that created the dangerous disposition. We blame her for the killing *because* it resulted from a state of culpable ignorance she is responsible for creating. The prior failures justify the attribution of the later harmful act to her defective agency, not as an additional separate wrong.

  **(c) Occurrent Blameworthiness & Quality of Will:** At the precise moment of the killing, Rosa’s *occurrent* mental states seem non-culpable: she was fatigued and simply "didn't think" about the checkpoint or the cyclist. There was no conscious malice, recklessness, or even awareness of risk at that instant. Therefore, locating blameworthy *occurrent* agency at t2 is difficult. If blameworthiness lies in her *standing disposition*, a quality-of-will account must show that this disposition itself reflects a *deficient regard for moral considerations or others' safety*. Rosa’s habitual skipping manifested a standing disposition of *insufficient concern* for the risks her fatigue posed to others, a disregard cultivated through her prior, avoidable omissions. Her will is defective not in a momentary choice, but in the enduring poor quality of her attentiveness and prioritization of safety. The account owes us an explanation of how such standing dispositions, not just occurrent choices, can be legitimate objects of blame because they reflect the agent’s settled (and culpably formed) orientation towards moral demands.

  **(d) Rosa vs. Ana & Moral Luck:** The intuition that Rosa is more blameworthy than Ana seems driven by the tragic outcome (resultant luck). However, a risk-based view of blame can capture the difference without invoking luck. On this view, both Rosa and Ana are equally blameworthy *for imposing unjustified risks* through their culpable ignorance and negligent driving. Both manifested the same culpable disposition (habitual checkpoint skipping). The difference lies not in their *degree* of blameworthiness *for their negligence*, but in the *consequences* of that identical negligence. We *express* blame differently based on harm caused (e.g., legal consequences, social censure), but their underlying moral fault for creating the unjustified risk is equivalent. Accepting that Rosa is *more* blameworthy commits us to resultant moral luck – that the actual outcome fundamentally alters the degree of blame she *deserves*, even if her antecedent actions and states were identical to Ana’s. A risk-based view is preferable: it holds agents accountable for the culpable creation of foreseeable danger, regardless of whether the dice roll of consequence lands on harm or not. Rosa and Ana are equally blameworthy *as negligent agents*; only the results of their negligence differ.

  ---

  **Marking Scheme (Total: 20 marks)**

  | **Key Move**                                                                                                 | **Marks** | **Common Mistakes (Cost Marks)**                                                                                                |
  | :----------------------------------------------------------------------------------------------------------- | :-------- | :------------------------------------------------------------------------------------------------------------------------------ |
  | **1. Critique of Principle re: Rosa:** Clearly explains why the principle fails (no discrete t1/P, habit vs. plan). Shows understanding of the "slow drift" challenge. | 4         | **Mistake:** Simply describing the case or principle without critique; asserting it fits without addressing the habit.          |
  | **2. Analysis of Habit Formation:** Explains how habitual negligence differs from discrete policy adoption. Identifies the problem of diffused responsibility.          | 3         | **Mistake:** Treating the habit as identical to a discrete decision; ignoring the "no discrete adoption" feature.               |
  | **3. Requirements for Repaired Principle:** Clearly lists requirements (cover discrete cases, cover habits, no double-counting). Explains *how* to avoid double-counting (blame for φ grounded in prior culpability creating disposition). | 3         | **Mistake:** Proposing a repair that doesn't cover both cases; failing to address double-counting; blaming habit formation AND killing as separate wrongs. |
  | **4. Occurrent State & Dispositional Will:** Argues no occurrent blameworthy state at t2. Explains how blame shifts to standing disposition. Articulates what a QoW account must show about the disposition (deficient regard/concern). | 3         | **Mistake:** Trying to find occurrent fault at t2; not specifying what makes the *disposition* blameworthy for QoW.             |
  | **5. Rosa vs. Ana / Moral Luck:** Accurately distinguishes risk-based view (equal blame for risk creation) from resultant luck (outcome alters desert). Argues cogently for risk-based view capturing the intuition without luck OR coherently defends resultant luck. | 4         | **Mistake:** Simply stating it's luck without analysis; claiming Rosa is more blameworthy *without* invoking luck; conflating outcome-dependent *expressions* of blame with fundamental *desert*. |
  | **6. Structure, Clarity & Argument:** Logical flow, addresses all parts, precise language, coherent overall argument.                                | 3         | **Mistake:** Disorganized; missing a required part (a-d); unclear reasoning; significant irrelevance.                         |

  **First-Class Threshold:** Typically requires scoring highly (e.g., 16+/20), demonstrating clear understanding of all complexities, avoiding major pitfalls, and presenting a sophisticated, well-structured argument.
