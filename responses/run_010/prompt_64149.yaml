  ## HOGG & DAUGHTER REMOVALS  
  **INVENTORY PROTOCOL (v.7.3)**  
  *Section 4: Schedule of Goods - Compilation & Compliance*

  **1.0 The Principle of Life (Operational Definition)**
  1.1 The Schedule of Goods records *distinct items* for conveyance.
  1.2 A *distinct item* is an individual organism. Only living entities possess intrinsic unity.
  1.3 Parts (limbs, leaves, roots) are not distinct items. Aggregations of non-living matter (furniture, appliances, structures, geological features) lack intrinsic unity and are not distinct items.
  1.4 The customer is a living entity and is *not* Goods. Record only items entrusted to Hogg & Daughter for removal. The ground beneath the premises is also not Goods.
  1.5 Internally, this operational principle is termed **Life**. It governs all inventory procedures.

  **2.0 Compiling the Schedule (Field Procedure)**
  2.1 Survey the premises designated for removal.
  2.2 Identify and count individual organisms present.
      *   Example: One (1) *Felis catus* (domestic cat). Not the carrier.
      *   Example: One (1) *Nephrolepis exaltata* (Boston fern). Not the pot.
      *   Example: One (1) *Homo sapiens* (customer). Not recorded on Schedule.
  2.3 Record each distinct organism once on the Schedule of Goods (Form HD-SG-01, see Appendix A). Use common name unless scientific designation is required for clarity (e.g., specific orchid hybrid).
  2.4 **DO NOT** record:
      *   Furniture (e.g., "table", "wardrobe", "sofa").
      *   Appliances (e.g., "refrigerator", "washing machine").
      *   Containers (e.g., "box", "suitcase", "pot" - unless the contained *organism* is being specified *as* the container, e.g., "hermit crab").
      *   Structures (e.g., "shed", "house" - unless removing a *literal* garden shed containing organisms, record the organisms).
      *   Aggregates of non-living matter (e.g., "pile of books", "stack of plates"). Record individual booklice if present and mobile.

  **3.0 Complexities & Borderline Cases**
  3.1 **Problematic Aggregates:** An assemblage containing a significant, actively maintained microbial culture presents operational challenges but constitutes a single distinct item under **Life**.
      *   *Example:* One (1) Refrigerator actively maintaining viable *Lactobacillus* cultures ("Live Yoghurt Fridge"). Record as **one (1) item**. *Note: Inventorying the microbial population density for insurance purposes is Clerk Grade 3 work only. See Appendix C for hazard pay supplement.*
  3.2 **Seasonal Flora Distinction (Compliance Directive HD-COM-22):**
      *   A cut *Abies nordmanniana* (Christmas tree) is a dying organism. Record as **one (1) item**.
      *   A potted *Abies nordmanniana* (Christmas tree) with living roots is a living organism. Record as **one (1) item**. The pot is not recorded.
      *   *Failure to correctly apply this distinction constitutes a Category B Compliance Breach. Referencing "tinsel cohesion" or "bauble integration" in defence is inadmissible.*
  3.3 **Borderline Lives:** If the Clerk cannot determine if an entity qualifies as a distinct organism under **Life** (e.g., slime mould colony, complex dormant seed bank, established ant farm, sourdough starter culture with documented continuous lineage), **DO NOT** decide.
      *   Immediately cease inventory of the affected area.
      *   Complete Form HD-ESC-BL ("Borderline Life Escalation").
      *   Include photographs, environmental notes, and customer claims regarding vitality/longevity.
      *   Submit to the Metaphysics Compliance Office (MCO) via internal pigeonhole #7 within 2 hours. Await MCO Ruling before resuming or finalizing Schedule.

  **4.0 Customer Disputes & Standard Responses**
  4.1 **Standard Response to Complaint: "You smashed my [inanimate object, e.g., table]!"**
      *   "Hogg & Daughter records and conveys only distinct living items under our operational **Life** principle. Our records indicate safe conveyance of all such items listed on your Schedule of Goods. The specific arrangement of non-living matter observed at collection was documented photographically (Ref: HD-PhotoLog-[Job#]). The arrangement observed upon delivery may differ. We are unable to locate an inventory record for a distinct living item matching the description '[inanimate object]'. Would you like to formally dispute the photographic log or the MCO ruling on your Schedule (if applicable)?"
      *   *Note: This response reliably escalates the complaint. Immediately transfer the call to the Complaints Department (Ext. 666) upon customer's next utterance.*

  **5.0 Industry Context & Misconceptions (Informative)**
  5.1 Alternative operational principles exist within the removals sector, though all are demonstrably inferior:
      *   **"Universal Aggregation" (Bulk & Sons Ltd.):** Records *all* pluralities, however arbitrary or transient (e.g., "Customer's left shoe + Depot Roof Truss (temporal overlap: 14:03-14:07 GMT)", "Molecules comprising teapot lid"). Results in vastly inflated item counts, complex billing disputes, and vans perpetually weighed down by paperwork. Their standard disclaimer ("Every Connection Counts!") is not considered legally binding by the MCO.
      *   **"Non-Assembly" (Null Haulage):** Rejects the unity of *all* entities. Inventories nothing. Ceased operations after failing to account for the whereabouts of their own vehicles ("Van? What unified 'van'?"), payroll ("Staff? Mere collocations of atoms!"), and eventually, customers ("Scheduled removal? A mere linguistic convention."). Not recommended.
  5.2 **Misconception: "It's just semantics!"**
      *   The operational principle of **Life** is not a linguistic preference but a practical, field-tested methodology codified in the founding pamphlet *"One Lump or Two? Operational Unity in the Removals Trade"* (Hogg, E., 1994). Its efficacy is proven by Hogg & Daughter's sustained operational capacity, solvent billing practices, and legally defensible Schedules. Alternative principles demonstrably lead to operational paralysis (Null Haulage) or unsustainable complexity (Bulk & Sons). The distinction is material, not verbal.

  **APPENDIX A: Sample Schedule of Goods (HD-SG-01) Extract**

  | Item # | Description                     | Count | Notes                                  |
  | :----- | :------------------------------ | :---- | :------------------------------------- |
  | 1      | *Felis catus* (Domestic Shorthair) | 1     | "Tibbles"                              |
  | 2      | *Spathiphyllum wallisii*        | 1     | Peace Lily (in ceramic pot)            |
  | 3      | *Canis lupus familiaris*        | 1     | "Rex" (Lead not recorded)              |
  | 4      | *Lactobacillus* culture vessel  | 1     | Integrated refrigerator unit ("Yogurt Fridge") - **Clerk Grade 3 Only** |
  | 5      | *Homo sapiens*                  | 0     | Customer - Not Goods                   |
  | ...    | ...                             | ...   | ...                                    |
  | 27     | *Dionaea muscipula*             | 3     | Venus Fly Traps (individual plants)    |
  | 28     | *Abies nordmanniana* (potted)   | 1     | Potted Christmas Tree - **HD-COM-22 Compliant** |
  | ...    | ...                             | ...   | ...                                    |
  | *TOTAL DISTINCT LIVING ITEMS:* | **32** |                                        |

  **APPENDIX C: Hazard Pay Supplement (Ref: HD-FIN-08)**
  *   Item 4.1 (Live Yoghurt Fridge): +15% per hour handling/inventory time. Requires MCO pre-approval for jobs exceeding 2 units. Sanitary protocols mandatory.

