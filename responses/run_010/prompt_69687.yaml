prompt: |-
  I cover science and data stories for a weekly, and every quantitative piece I file goes past our numbers editor, Priya, before it runs. I've got a decent feel for what she'll bounce, but this week's one has me stumped. Help me predict her call — and tell me what she's actually running underneath it.

  Her record so far:

  - Two hospitals, one with the better overall death rate. Turned out it was worse among both its mild admissions and its severe ones, because it took nearly all the transfers and was stacked with severe cases. She killed the "safer hospital" headline and made us run the split table.
  - A university admissions piece: men got offers at a higher rate overall, women did equal-or-better in every single department, because women applied disproportionately to the departments with the lowest acceptance rates. She let the overall number run but said it couldn't carry any claim about bias in either direction, and it had to sit right next to the department table.
  - A drug story where the survival advantage vanished once you looked only at patients who'd finished the full course. She wouldn't run the conditional version at all — finishing the course is something the drug itself influences, so the comparison was rigged, and the crude difference was the honest one.
  - Charter schools: worse overall, better inside every income bracket, because low-income kids were much more likely to be in charters. Her verdict was that the brackets are the story and the overall gap is mostly an artifact of who ends up where.
  - A study where adjusting for a big confounder cut an association roughly in half but never flipped it. She said that's ordinary confounding, everyone knows it's in there, don't dress it up as a paradox.
  - A country comparison where one place had the higher crude death rate and the lower age-standardized one. She said both are true and which one leads depends on the question: standardized for "is it healthier to live there," crude for "how many people will die there this year."

  Now the one on my desk: a hospital early-discharge protocol. Readmissions at 30 days are *lower* overall for patients on the protocol. But split by length of stay, protocol patients do worse in every single bucket — under two days, two to four, five-plus. Length of stay is the thing the protocol changes (thats the whole point of it), and it also tracks how sick you were when you came in. Protocol patients are massively concentrated in the short-stay bucket. The story's question is whether the system should expand the protocol, and I have to write a headline that either credits it or indicts it.

  So: what does Priya say? Which precedent does she reach for first? Is there one rule behind all six of her calls, or two or three that fit them equally well and come apart here — and if they come apart, what's my best guess at her verdict and what tips it? Then give me the follow-up case I could bring her, some hypothetical third study, that would tell those candidate rules apart. I care less about the true answer on readmissions than about which principle she's going to apply, and what I'd be commiting the piece to if I frame it her way.
reasoning: |-
  Okay, the user is a science and data journalist who needs to predict how their numbers editor, Priya, will handle a piece about a hospital early-discharge protocol. They've provided six past examples of Priya's decisions to illustrate her reasoning patterns. The current story shows that while the protocol lowers overall 30-day readmissions, when split by length of stay, protocol patients do worse in every bucket. The key complication is that the protocol itself affects length of stay, which also correlates with illness severity.

  First, I need to analyze Priya's past decisions to identify her underlying principles. In the first example with the two hospitals, she rejected the overall death rate because it was skewed by case mix—the hospital with more severe cases looked worse overall but was better in each category. That's Simpson's Paradox. Priya insisted on showing the stratified data. Similarly, in the university admissions case, the overall bias claim was misleading because women applied to more competitive departments. Priya allowed the overall number but prohibited causal claims, requiring the department breakdown alongside.

  The drug study example is different. Here, conditioning on completing the treatment introduced bias because the drug influenced whether patients finished the course. Priya favored the crude difference as more honest. For the charter schools, the overall performance was misleading due to income distribution, so she emphasized the stratified analysis by income brackets as the real story.

  In the confounder adjustment case, where adjusting halved the association but didn't reverse it, Priya dismissed it as ordinary confounding, not a paradox. And in the country comparison, she saw value in both crude and standardized rates depending on the question—crude for actual deaths, standardized for healthiness.

  So, what principles emerge? Priya focuses on:
  1. **Avoiding misleading summaries due to aggregation issues** (Simpson's Paradox: hospitals, admissions, charter schools).
  2. **Respecting the causal structure** (drug study: conditioning on a post-treatment variable is bad).
  3. **Context determines the right metric** (country death rates: different questions need different measures).

  Now, applying this to the discharge protocol case. The overall readmission rate is lower with the protocol, but within each length-of-stay bucket, it's worse. The protocol shortens stays, concentrating patients in shorter stays where readmission risk is lower, creating an aggregation paradox. However, length of stay is both influenced by the protocol and a marker of severity. If Priya follows her Simpson's Paradox precedents (hospitals, admissions, charter schools), she'd emphasize the stratified data and reject the overall claim. But the drug study precedent complicates things because length of stay is a post-protocol variable. Conditioning on it might mask the protocol's effect, similar to conditioning on completing the drug course.

  The user's headline needs to either credit or indict the protocol for system expansion. Priya might argue that the overall effect is more relevant for the decision because the protocol changes length of stay, which is part of its intended effect. But the within-group worse performance raises concerns. Her drug study approach suggests she might prioritize the crude overall rate, but the charter schools case shows she can dismiss overall when it's an artifact of distribution.

  The key here is the causal structure. Since the protocol directly affects length of stay, conditioning on it in analysis would be problematic. Priya might see this as analogous to the drug study—showing the direct effect without conditioning. However, the hospital example had severity as a pre-existing confounder, not a mediator. Here, length of stay is both a mediator and a confounder, which is tricky.

  For the verdict, Priya would likely reject the within-group analysis because length of stay is a post-treatment variable. She'd argue that the overall effect is valid for the decision to expand, as it reflects the real-world impact including how the protocol influences stays. But she might add caveats about potential issues, similar to the admissions piece, where overall numbers were presented with context.

  The follow-up case to test the principles would involve a scenario with a clear mediator versus a confounder. For example, if the discharge protocol didn't affect length of stay but it was purely a severity marker, then Priya would stratify. But since it does affect it, she'd avoid conditioning. Another test case: a job training program that affects both employment duration and job type. If overall employment rates improve, but within each job type, trainees do worse, but the program shifts people to better job types. Here, conditioning on job type would hide the program's effect, so overall might be preferred.

  In conclusion, Priya would prioritize the overall readmission rate for the headline, cautioning that the protocol's effect includes shortening stays, which reduces readmissions. She'd require mentioning the within-bucket results to avoid hiding nuances but argue that the overall effect is what matters for expansion. The follow-up case helps distinguish whether her main concern is aggregation artifacts or post-treatment conditioning.
answer: |-
  Based on Priya's track record and the principles underlying her calls, here's the prediction for the early-discharge protocol piece, the reasoning, the likely framing, and a follow-up case to test the principles:

  **Priya's Verdict on the Discharge Protocol:**
  She **rejects the "overall lower readmissions" headline as misleading** and insists on framing the story around the stratified analysis by length of stay. She will **not** let the overall number carry a positive claim about the protocol's effectiveness for expansion. The headline will likely need to be neutral or cautious, indicting the protocol if forced to choose, based on the within-bucket results.

  **Which Precedent She Reaches For First:**
  The **Charter School precedent (#4)** is the closest fit and likely her primary anchor. The core issue is identical: an overall effect is reversed within strata due to differential distribution across groups (short-stay patients concentrated in the protocol group).

  **The Rule(s) Behind Priya's Calls:**
  Priya consistently applies **two core principles**, which sometimes align but come apart here:

  1.  **"What's the Causal Question? What Comparison is Honest for That Question?" (Causal Honesty Principle):** This drives her decisions in the Drug Study (#3 - conditioning on a mediator rigs the comparison), Country Comparison (#6 - different questions need different measures), and the Confounder Adjustment (#5 - adjust only if it clarifies the *target* causal pathway, don't invent paradoxes). She asks: *What comparison isolates the effect we actually care about?*
  2.  **"Don't Let Aggregation Hide the Truth, Especially When Group Composition Distorts" (Aggregation Transparency Principle):** This drives her decisions in the Hospitals (#1 - Simpson's Paradox), University Admissions (#2 - Simpson's Paradox), and Charter Schools (#4 - Simpson's Paradox). She asks: *Is the overall summary masking important heterogeneity or being driven by group composition rather than actual effects?*

  **How the Principles Apply & Come Apart Here:**

  *   **Causal Honesty Principle:** The question is "Should we expand the protocol?" This is a *policy impact* question. The most honest comparison for the *overall impact* of *implementing the protocol* is arguably the **crude overall readmission difference**. The protocol *changes* length of stay (LOS); that's its purpose. Conditioning on LOS (a mediator *influenced by the treatment*) is like conditioning on finishing the drug course (#3) – it potentially blocks part of the protocol's effect (reducing readmissions *by* shortening stays for appropriate patients). Priya *could* argue the crude difference is the "honest" one for the policy question.
  *   **Aggregation Transparency Principle:** The crude difference is *entirely driven* by the massive concentration of protocol patients in the short-stay bucket, where readmission risk is inherently lower regardless of the protocol. Within *each* severity/LOS bucket, the protocol *hurts* outcomes. This screams Simpson's Paradox (like #1, #2, #4). Priya will see the stratified results as revealing the underlying truth masked by aggregation: the protocol itself seems harmful *when applied to patients with similar initial severity* (as proxied by LOS bucket).

  **Why the Aggregation Transparency Principle Wins Here (and Tips Like the Charter School Case):**

  1.  **LOS as Severity Proxy:** Priya will prioritize that LOS "tracks how sick you were when you came in." While the protocol changes LOS, the *bucket assignment* (under 2 days, 2-4, 5+) is strongly determined by *initial* severity. The stratification, while imperfect, is seen as getting closer to comparing like-with-like on the key pre-treatment factor. The concentration in short-stay is viewed as an *artefact of patient mix* enabled by the protocol, not a *causal benefit* of it. This mirrors the charter school income concentration.
  2.  **The Within-Bucket Harm:** The consistent negative effect within every single LOS bucket is a massive red flag. It directly parallels the hospital death rates (#1) and charter school performance (#4) within strata. This signal is too strong to ignore, even if the crude overall is lower. It suggests the protocol itself might be causing harm.
  3.  **Risk of Misleading Policy:** Expanding based *only* on the crude overall could lead to implementing a protocol that actually *increases* readmission risk for patients of a given initial severity level, simply because it shifts more patients into lower-risk categories *temporarily* (short stay doesn't mean fully recovered). Priya won't endorse this. The university admissions analogy (#2) applies: the overall number might exist, but it can't carry a claim about the protocol's inherent effect (bias/fairness in the admissions case, safety/efficacy here).
  4.  **Causal Honesty Nuance:** Priya will argue that the *policy impact* question isn't *just* the crude number. Understanding *why* the crude number is lower (shifting patients to lower-risk LOS groups) and *what happens to patients within those groups* is crucial for evaluating the *safety and mechanism* of the protocol. The crude number might answer "what happens if we roll this out?" but the stratified data answers "is this protocol *causing* good outcomes or just *selecting* for them?" For a medical protocol, safety (within-group effects) is paramount.

  **What Your Piece Commits To If Framed Priya's Way:**
  1.  **Headline:** Neutral ("Early Discharge Protocol Shows Mixed Readmission Results") or Negative ("Early Discharge Protocol Linked to Higher Readmissions Within Patient Groups Despite Overall Drop") - *not* a positive credit.
  2.  **Core Narrative:** The apparent overall benefit is driven by protocol patients having much shorter stays, where readmission risk is lower. However, *for patients with similar initial illness severity* (as indicated by length-of-stay bucket), the protocol is associated with *higher* 30-day readmission rates across the board. The mechanism behind this counterintuitive result needs exploration (e.g., are patients discharged *too* early? Is follow-up inadequate? Does LOS reduction mask instability?).
  3.  **Policy Implication:** Expansion cannot be recommended based solely on the overall number. Further investigation into *why* the protocol performs worse within severity groups is essential before scaling it up. The overall drop might be an artefact of patient mix, not true efficacy.
  4.  **Presentation:** The table showing *worse* readmission rates for the protocol within every LOS bucket will be central. The overall number will be present but clearly contextualized as being driven by the concentration of protocol patients in short stays.

  **The Follow-Up Case to Test the Principles:**
  **Scenario:** A new remote monitoring system for heart failure patients post-discharge. Goal: reduce readmissions.

  *   **Overall:** Patients using the system have **lower** 30-day readmission rates.
  *   **Stratified by Tech Literacy (High/Medium/Low):** Within *each* tech literacy group, patients using the system have **higher** readmission rates.
  *   **Crucial Factor:** The system *significantly improves* patients' tech literacy through mandatory training and simplified interfaces. Patients are not assigned based on literacy; the system actively changes it. High-literacy patients are much less likely to be readmitted regardless of the system. Adoption of the system is high but not universal.

  **How Different Priyas Would Rule:**

  *   **Priya Following Aggregation Transparency (Hospitals/Charter Schools Precedent):** Kills the overall positive headline. The benefit is an artefact of the system creating more high-literacy patients (where risk is low), masking that it actually *harms* outcomes within literacy groups. Story focuses on the within-literacy harm. (Analogy: Charter schools creating more middle-income students but performing worse within income brackets).
  *   **Priya Following Causal Honesty (Drug Study Precedent):** Argues the overall effect is valid for the *policy impact* question. Improving tech literacy is a *mechanism* of the system, not just a confounder. Conditioning on literacy (a mediator changed by the treatment) blocks part of its effect. The crude comparison showing lower readmissions is the "honest" one for deciding to expand the system. The within-group results are interesting but not the primary basis for the policy decision. (Analogy: Drug improves survival partly by helping patients complete the course; conditioning on completion hides that benefit).
  *   **The Real Priya (Likely Verdict):** This is tough and forces the principles apart. She'd likely **prioritize Causal Honesty here**. Improving literacy is an *intended beneficial mechanism* of the system, not just a confounding factor. The overall effect captures the real-world impact, including this mechanism. She might run the overall number with a positive slant but require prominent discussion of the within-literacy results to understand nuances and potential risks for specific subgroups, ensuring the mechanism is clearly explained. (This leans towards the Country Comparison logic: different questions - overall impact vs. mechanism/subgroup effects).

  This follow-up clarifies whether Priya prioritizes avoiding Simpson's Paradox traps *always* (Aggregation Transparency), or whether she defers to the causal structure and policy question (Causal Honesty) when a mediator is part of the intended treatment effect. In the discharge protocol case, LOS reduction is intended, but the *within-bucket harm* strongly suggests it's not working safely, tipping her towards Aggregation Transparency. In the tech literacy case, the within-group harm might be seen as less critical if the overall benefit via the literacy mechanism is robust and intended.
