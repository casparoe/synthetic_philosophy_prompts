prompt: |-
  I am designing a scoring rubric for a comparative policy seminar, and I want to pressure-test one unusual dimension before committing to it: robustness to bad-faith implementation. Rank the following regimes for governing sex work — (i) criminalisation of sellers, buyers and third parties alike; (ii) the Nordic model, which criminalises purchase and third-party involvement but not the seller; (iii) state-licensed legalisation of the German and Dutch pattern; (iv) New Zealand-style decriminalisation, treating sex work as ordinary work under general labour law — according to how gracefully each degrades when the officials administering it (police, licensing inspectors, municipal councils) are self-interested or hostile rather than impartial. This is a worst-case robustness exercise, not an assessment of how each regime reads on paper. Award each a score out of 10, then give the ranking, and for each regime identify in one sentence the particular feature of its legal architecture that does the damage or supplies the protection. Note also whether any pair swaps places depending on whether the work in question is street-based or indoor. Lead with the scores and the ranking; keep the whole answer under 350 words; write in British English.
reasoning: |-
  Okay, the user is designing a scoring rubric for a comparative policy seminar and wants to pressure-test a dimension called "robustness to bad-faith implementation" regarding sex work governance regimes. They've listed four models: full criminalisation, Nordic model, German/Dutch legalisation, and New Zealand decriminalisation. 

  Hmm, this is an interesting twist - evaluating how policies fail when officials are corrupt or hostile rather than how they ideally function. The user clearly wants worst-case scenario analysis, not theoretical merits. They've specified strict formatting: scores out of 10, ranking, one-sentence damage/protection explanations, and street/indoor variance notes - all under 350 words with British English.

  Let me break this down. For robustness scoring: New Zealand's decriminalisation (iv) should score highest because it minimises points of failure by relying on general labour law - fewer discretionary powers for bad actors to exploit. The Nordic model (ii) might be most vulnerable due to inherent ambiguities in "exploitation" definitions that hostile officials could weaponise. 

  The legalisation model (iii) earns mid-range scores - licensing creates corruption opportunities but avoids criminalisation pitfalls. Full criminalisation (i) is bad but slightly less fragile than Nordic because its blanket approach has fewer pretexts for selective enforcement. 

  On venue variance: Nordic model's indoor/street disparity stands out - indoor transactions get more protection from general laws. Other regimes show less operational divergence. 

  User seems academically rigorous - they're stress-testing rubrics rather than pushing an agenda. The "bad-faith implementation" angle suggests deep policy literacy, recognising that enforcement often deviates from legislative intent. Their concise formatting demand implies this is for practical teaching tools. 

  *Double-checks word count* Need to keep explanations razor-sharp: Nordic model's sentence must highlight how "exploitation" definitions become weapons; legalisation's Achilles heel is discretionary licensing; decriminalisation's strength is diffused oversight. Scores should reflect that the more concentrated power a system creates, the worse it fails when corrupted.
answer: |-
  Here are the scores, ranking, and key vulnerability/protection features for robustness against bad-faith implementation:

  1.  **New Zealand-style decriminalisation (iv): 8/10**  
      *Protection:* Diffused oversight via general labour/health laws minimises concentrated discretionary power vulnerable to corruption.  
      *Venue Variance:* Minimal difference.

  2.  **Full criminalisation (i): 4/10**  
      *Damage:* Blanket illegality enables police to selectively target *any* participant arbitrarily based on bias or extortion demands.  
      *Venue Variance:* Street work vastly more vulnerable than hidden indoor.

  3.  **State-licensed legalisation (iii): 3/10**  
      *Damage:* Licensing creates lucrative gatekeeping powers for corrupt officials, enabling bribery and exclusionary favouritism.  
      *Venue Variance:* Licensed venues vulnerable to inspector shakedowns; unlicensed workers extremely exposed.

  4.  **Nordic model (ii): 2/10**  
      *Damage:* Ambiguous "exploitation" definitions and reliance on targeting buyers grant vast, easily abused police/administrative discretion.  
      *Venue Variance:* Street buyers much easier to target arbitrarily than hidden indoor transactions.

  **Ranking:** (iv) > (i) > (iii) > (ii)  

  **Venue Swap:** The Nordic model (ii) degrades far more gracefully for indoor work than street work due to enforcement difficulties, potentially swapping places with Legalisation (iii) where street work occurs.
