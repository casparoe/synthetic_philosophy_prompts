  ## Brainstorm Notes (Scratch Thinking)

  **Core Thesis Viability:** Your spine holds. Participant/objective stance is the *right* entry point for NLMG. Ishiguro meticulously constructs a world testing Strawson's conditions. The novel *is* about complicity/memory, but these operate *through* the lens of responsibility-stance manipulation. Your framing focuses that lens sharply.

  **Stakes:**
  1.  **Against Metaphysical Reductionism:** Showing how responsibility is a *relational practice* (Strawson) rather than a property (free will) illuminates why clones' humanity isn't "proven" by art/souls but by *how they are treated*.
  2.  **Institutionalized Objectification:** Hailsham isn't just *bad*; it's a system *designed* to maintain the objective stance via managed information, routine, and emotional distance. This exposes how responsibility-denial operates *systemically*.
  3.  **The Gap in Strawson? (Addressee):** Tommy’s field rage is the crux. If Strawson *requires* an addressee for genuine reactive attitudes, this rage seems apt but homeless, suggesting a limitation for structural injustice. If Strawson *can* accommodate it (e.g., as dispersed resentment/grief-protest), his framework is stronger than critics allege.
  4.  **Atrophy & Reciprocity:** Kathy’s near-absence of resentment challenges Strawson’s claim that wholesale objective stance adoption is practically impossible. The novel might show it’s *possible* under conditions of *engineered non-reciprocity*.

  **Risky Claims & Obvious Objections:**
  1.  **Madame's Tears = Participant Stance?** *Risky:* Is it recognition, or horrified pity/guilt witnessing "thing" mimicking human longing? Objection: She flees. She calls them "poor creatures." This might be *failed* participant stance – a glimpse triggering retreat, not sustained engagement. *Mitigation:* Focus on the *moment* of disruption. Her reaction is involuntary, pre-reflective – Strawson’s attitudes often are. It’s a breach in the objective armor, not its dismantling.
  2.  **Gallery Critique as "Too Cheap":** *Risky:* Strawson *would* say Miss Emily’s project is category-confused (mistaking empirical evidence for stance-adoption reasons). But the novel *does* show the Gallery had *some* effect (delaying closure, creating space). Objection: Doesn’t this show evidence *can* sometimes *prompt* a stance shift? *Mitigation:* Argue the Gallery’s *failure* proves Strawson’s point. The evidence existed; the *refusal to adopt the participant stance* persisted. The "political work" was fragile precisely because it relied on convincing others of a "fact" the Strawsonian says isn’t the relevant issue.
  3.  **Structural Wrong & the Addressee Problem:** *Risky:* This is your most original/important point. Obvious Strawsonian Objection: "Tommy’s rage *does* have addressees! The Guardians, the scientists, the public, the ‘they’ who made the system – it’s dispersed resentment/indignation." Counter-Objection (Your Side): But Tommy doesn’t *name* them, the system absorbs blame, the rage feels cosmic. Strawson’s examples (resentment at *the person* who stepped on your foot) feel atomistic. Does Strawson adequately describe rage at an *atmosphere* of dehumanization? *Crucial:* You must define "addressee problem" clearly – *apt reactive attitude generated by perceived moral injury, yet lacking a specific, responsible agent towards whom it can be coherently directed or from whom recognition/response is expected.*
  4.  **Kathy's Atrophy & Strawson's Impossibility Claim:** *Risky:* Strawson argues we *can't* sustain the objective stance universally; participant attitudes are too fundamental. Kathy seems close. Objection: But she *feels guilt* intensely re: Ruth! Doesn't this disprove atrophy? *Mitigation:* Distinguish *types* of attitudes. Resentment (outward-blame) might atrophy under non-reciprocity; guilt (self-blame) and perhaps grief might persist or even intensify in the vacuum. Her narration’s *flatness* regarding her fate is key evidence for outward-reactive atrophy.

  **Collective Engineering & Strawson:** Strawson *focuses* on individual interactions. His "reasons" for objective stance (child, disturbed) are individual assessments. The novel exposes a gap: *How do stances become culturally mandated, institutionally enforced?* Strawson offers little machinery here. His framework *assumes* a default participant stance among adults; NLMG shows it can be *cultivated out* from birth. This is where the novel *pushes* Strawson productively.

  **Potential Distortion?** Ishiguro’s primary mode is ambiguity, haunting, the unsaid. Strawson’s framework is analytical. Risk: Over-structuring the novel’s subtle horrors. Guard against making the guardians’ motives (or Madame’s) too clear-cut. Strawson helps *diagnose* the relational mechanics, but the novel’s power lies in the *affective weight* of that distortion.

  **Position:** Your spine is strong and defensible. I will argue *for* it, developing your core claims rigorously, while flagging risks/objections within the prose. Key arguments:
  1.  Hailsham *is* an objective-stance machine.
  2.  The Gallery project *is* Strawsonian category confusion, and its failure proves Strawson right about evidence vs. stance.
  3.  Tommy’s rage *does* expose an "addressee problem" for structural wrongs that Strawson underestimates (leaning towards "gap").
  4.  Kathy demonstrates *selective atrophy* of outward-reactive attitudes (like resentment) under engineered non-reciprocity, challenging Strawson’s optimism about the impossibility of wholesale objective stance adoption in such environments.

  ---

  ## The Unseen Stance: Responsibility and Reactive Silence in *Never Let Me Go*

  Kazuo Ishiguro’s *Never Let Me Go* is a novel steeped in withheld truths and managed emotions. Its clones, bred for organ donation, exist in a world that systematically denies them the full status of persons. While themes of memory, love, and mortality resonate profoundly, the novel’s chilling core lies in its exploration of moral responsibility – specifically, how a society orchestrates the denial of it. P.F. Strawson’s landmark essay "Freedom and Resentment" provides not just a lens, but a scalpel for dissecting this orchestration. Strawson’s central move was to shift the debate about moral responsibility away from intractable metaphysical questions about free will and towards the observable fabric of human relationships. Responsibility, he argued, is grounded in the "reactive attitudes" – emotions like resentment, gratitude, indignation, and forgiveness – that structure our interactions. We hold others responsible when we take the "participant stance" towards them, engaging as moral agents capable of goodwill or ill will. We suspend this stance, adopting an "objective" one – treating someone as a problem to be managed, a patient to be treated, a child to be guided, or a threat to be contained – for specific reasons: they acted unintentionally, under coercion, or lack the basic capacities (like severe mental illness or extreme youth) to be proper objects of these attitudes. Hailsham, and the wider world it reflects, is a meticulously engineered machine for enforcing the objective stance towards Kathy, Tommy, Ruth, and their peers, revealing the mechanisms and consequences of responsibility denied at scale.

  From the outset, Hailsham operates on the principles of the objective stance. The guardians manage the students’ bodies, health, information, and emotional landscape with a detached, therapeutic concern. They are objects of policy, not participants in a moral dialogue about their fate. Information about their purpose is drip-fed, euphemized ("donations," "completion"), or withheld entirely. The emphasis is on keeping them "trained and well," maintaining a calm, productive environment conducive to their eventual utility. The taboo against discussing their future openly is less about protecting the children and more about maintaining the smooth operation of the objective stance – confronting them with the full, horrifying truth would disrupt the carefully cultivated atmosphere of managed care, potentially provoking the very reactive attitudes (outrage, rebellion, profound resentment) the system is designed to suppress. Miss Lucy’s transgression is fundamentally Strawsonian: she refuses the objective stance. Her outburst in the field ("None of you will go to America!") is an attempt to treat the students as participants entitled to the truth, capable of understanding their situation and deserving of honesty. She aims her words *at them*, as moral agents who can grasp the implications, even if it causes distress. This breach of the institutional norm – treating them as objects to be soothed rather than participants to be informed – is why she is removed. Her stance is incompatible with Hailsham’s function.

  Madame’s reaction to Kathy dancing with a pillow to the song "Never Let Me Go" presents a more complex, fleeting counterpoint. Witnessing this private expression of longing and substitute love, Madame is overcome, crying, "Poor creatures. What did we do to you?" This moment is often read as pity or horror, but Strawson’s framework suggests something more significant: a visceral, involuntary crack in her objective stance. Her tears and murmured words represent a momentary, horrified recognition of Kathy *as a subject of experiences* – specifically, experiences of love, loss, and yearning that demand a participant response. It’s not sustained moral engagement, but it’s a reactive attitude (perhaps a form of profound, guilt-tinged sympathy or appalled recognition) erupting *towards* Kathy as a creature capable of suffering the kind of loss the song evokes. She flees, retreating into the safety of the objective view ("poor creatures"), but the moment itself is a Strawsonian slip, revealing the human connection the system works tirelessly to obscure.

  The Hailsham Gallery project, championed by Miss Emily, represents a profound misunderstanding of Strawson’s point, tragically enacted on a grand scale. Miss Emily believed that collecting the students' art could "prove" they had souls, thereby convincing the outside world of their humanity and the injustice of their fate. From a Strawsonian perspective, this project was doomed from conception. Being a proper object of reactive attitudes – of resentment for wrongs done to you, of gratitude for kindness shown – is not an empirical question settled by evidence of creativity or interiority. It is a matter of *taking up a stance* towards another. The existence of the art, however moving, does not *compel* the participant stance; it merely provides potential *reasons* why someone *might* adopt it. The world’s refusal to grant the clones full status wasn’t primarily a failure of evidence, but a cultivated, funded refusal to extend the participant stance. The "reasons" Strawson discusses for adopting the objective stance (coercion, incapacity) were systematically manufactured and taught: the clones were framed as non-agents, biological products, "poor creatures" lacking true autonomy or futures, thus justifying their management and use. Miss Emily’s empirical quest fundamentally confused the nature of moral recognition. Her later defense of the Gallery to Kathy and Tommy – that it bought them time, a "better" life – acknowledges its practical, palliative effect within the system, but tacitly concedes its philosophical failure. The evidence was gathered; the stance remained largely unshifted. The Gallery’s ultimate closure underscores that the battle was never about proof of soul, but about the collective will to *see* and *treat* the clones as participants in the moral community.

  This systemic refusal creates the novel’s most potent challenge to Strawson’s framework: the problem of reactive attitudes without a clear addressee. This is crystallized in Tommy’s explosive rage after their disillusioning meeting with Miss Emily and Madame. Learning the truth about the Gallery’s futility and the impossibility of deferral, Tommy forces Kathy to stop the car and screams his fury into an empty field. This is not mere frustration; it is moral rage. He feels wronged, profoundly and existentially. Yet, who is the target? There is no single malicious actor. The Guardians? They were cogs. The scientists? Faceless. The public? An abstract "they." Society itself? A diffuse entity. Tommy’s rage is an apt reactive attitude – a demand for recognition, a protest against injustice – but it lacks a specific, responsible agent towards whom it can be coherently directed or from whom any acknowledgment, apology, or change might be expected. The field absorbs his screams; the system offers no reply.

  Does this expose a gap in Strawson? Strawson’s paradigm primarily illustrates reactive attitudes within dyadic or small-group interactions – resentment towards the person who insulted you, forgiveness sought from the one you wronged. While he mentions impersonal indignation at injustice, the machinery feels geared towards attitudes with identifiable targets. Tommy’s field rage suggests that Strawson’s model, brilliant for interpersonal dynamics, struggles to fully capture the phenomenology of moral injury inflicted by complex, diffuse structures of oppression. The apt reactive attitude persists, but it becomes unmoored, a howl into a void. One might argue this *is* dispersed resentment or indignation directed at all complicit agents. Yet, the novel presents it as a more fundamental, targetless fury – the anguish of recognizing one’s status as an object within an indifferent machine. This "addressee problem" – the disorienting experience of profound moral anger with nowhere to land – is a critical contribution the novel makes to understanding responsibility in the face of systemic wrong, highlighting a potential limitation in Strawson’s otherwise robust account.

  This structural denial profoundly shapes the clones’ own reactive landscapes, particularly Kathy’s narration. Her account of her life, including her impending donations and eventual death, is strikingly devoid of resentment towards the society that created and consumes her. She reports events with a chilling, almost clinical calm. This stands in stark contrast to the intense guilt she feels regarding her actions towards Ruth, and Ruth’s own deathbed attempt at amends by facilitating the deferral quest. This relationship, flawed as it is, operates within a fragile but real participant stance: expectations exist, hurts are acknowledged (Ruth’s jealousy, Kathy’s passivity), guilt is felt, forgiveness is implicitly sought through the gesture of the address. It’s the most intact *moral* relationship in the book precisely because it involves reciprocal (if damaged) reactive attitudes.

  Kathy’s pervasive lack of resentment towards her fate, however, poses a challenge to Strawson’s assertion that a wholesale adoption of the objective stance towards others is practically inconceivable for mature humans. Kathy comes perilously close. Her upbringing at Hailsham, followed by the Cottages and her role as a carer, constitutes a lifelong education in the objective stance *as applied to herself and her peers*. They are taught their purpose, conditioned to accept it, and surrounded by a world that consistently reflects this view back at them. The reciprocity essential for sustaining reactive attitudes is systematically denied. Resentment requires the expectation that the target *could* and *should* recognize your standing and alter their behavior. For Kathy, raised to understand her creators and beneficiaries as fundamentally separate and unaccountable, that expectation is extinguished before it can firmly take root. Her reactive atrophy is specific: outward-directed attitudes like resentment towards the system wither, while inward-directed ones like guilt, grief, and loyalty persist in the interpersonal spaces where minimal reciprocity remains possible (like with Ruth and Tommy). The novel thus suggests Strawson may underestimate the extent to which a sustained, engineered environment of non-reciprocity can suppress the outward manifestations of the participant stance, creating individuals who internalize their objectification. Kathy isn’t devoid of feeling; her feelings are channeled away from moral protest towards endurance, care, and melancholic acceptance – hallmarks of the objective stance turned inward.

  *Never Let Me Go* does more than illustrate Strawson’s participant and objective stances; it subjects them to a terrifying social experiment. Ishiguro’s novel demonstrates how the stance is not merely an individual choice but can be institutionalized, manufactured on a societal scale to facilitate profound moral disengagement. Hailsham is the laboratory; the clones are the subjects. Where Strawson provides the conceptual vocabulary for diagnosing this disengagement ("objective stance," "reactive attitudes"), the novel provides the devastating emotional and phenomenological reality. It shows the human cost of that stance for those objectified – not just physical suffering, but the warping of their emotional and moral selves, epitomized by Kathy’s flattened narration and Tommy’s unmoored rage.

  Furthermore, the novel pushes Strawson’s framework into necessary but uncomfortable territory. It forces the question of *collective* responsibility-denial and the engineering of indifference, areas Strawson’s focus on individual encounters leaves underexplored. It vividly dramatizes the "addressee problem," exposing the anguish of moral injury inflicted by systems rather than individuals, challenging the dyadic focus of classic reactive attitude theory. And it presents Kathy as a credible, heartbreaking case study of how outward-reactive attitudes *can* atrophy under conditions of sustained, systematic non-reciprocity, suggesting Strawson’s claim about the near-impossibility of wholesale objective stance adoption needs qualification for victims of pervasive structural dehumanization.

  Strawson helps us understand the mechanics of Hailsham’s operation and the nature of the clones’ exclusion from full moral standing. But *Never Let Me Go* shows us the suffocating silence that follows when resentment finds no ear, when gratitude finds no deserving target, and when the participant stance is systematically dismantled. It reveals responsibility not as a metaphysical puzzle, but as a fragile practice sustained by recognition – a recognition that society, in this haunting fiction, learned to withhold. The novel’s enduring power lies in its depiction of lives lived under the weight of that unseen, collective refusal.
