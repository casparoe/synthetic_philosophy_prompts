answer: |-
  A frog snaps at a BB pellet zipping across the pond.
  "Ribbit! Fly!" he croaks proudly.

  His tadpole stares. "Dad, that was clearly a BB pellet."

  "Semantics, son!" the frog replies. "My snap-detection circuitry *means* 'fly' because catching *flies* is what got my ancestors laid. This pellet? Just noise. My response *still* means fly. I *meant* to do that!"

  The tadpole blinked. "But... you missed. And ate gravel."

  "Evolution doesn't care about accuracy *now*," sighed the frog. "Just what worked *then*. Pass the flies... I mean, whatever this is."
