answer: |-
  ## Address: The Hundredth Year

  **(Approx. 8 minutes spoken)**

  Colleagues, friends, honored guests, and most especially, the families who have joined us today – thank you. We gather to mark the centenary of our Code of Conduct. This code has been our compass, a living document reflecting our evolving understanding of what it means to be a surgeon bound to colleagues and patients. Today, we focus on a significant change: the removal of Article 9 and the adoption of a new requirement to report concerns about patient care.

  For eighty-nine years, Article 9 stood. It required us to seek the ethics committee’s consent before offering testimony against a colleague regarding patient treatment. For many of us here, especially those who practiced under its weight, it wasn't a technicality; it was felt as a profound obligation. It was loyalty codified. To speak, without that consent, felt like a betrayal of the bond that holds this profession together – the trust that we stand by one another in the intensely difficult work we do. I know that loyalty intimately. For thirty-one years, I upheld that silence. I believed it was my duty. On two occasions, I knew of errors, and I said nothing, bound by that same sense of obligation.

  Times change. Perspectives shift. Data on patient safety accumulated, year after year. Arguments were made, powerfully and movingly, by families who suffered loss – families like those with us today, who have bravely shared their stories. We heard you. We felt the weight of your pain. Yet, for a long time, the understanding of loyalty embodied in Article 9 held. What ultimately shifted the ground were changes in the world around us. Our largest malpractice insurers began offering significant premium discounts to institutions with transparent reporting and disclosure programs. This changed the calculus for hospitals and for many members bearing those costs. Our Council, elected by this membership, recognized this shift and acted last spring, replacing Article 9 with a mandatory reporting requirement backed by referral to state licensing boards. I voted for that change.

  Let me be clear about the insurers' role. Financial realities matter; they shape the environment in which we practice. A change in interests can create the space for a change in norms. But it does not dictate the *meaning* of that change. We are not accountants. We are surgeons. We are bound by something deeper than balance sheets. The question before us now is not merely *what* we must do, but *why* we do it, and *who we become* by doing it.

  We have chosen a new path, a requirement. It would be easy to see this only as a rule, a compliance measure. Something we do because we must, because the auditors – whether insurers, boards, or administrators – demand it. Something judged solely by outcomes and external checks. That path is clear, perhaps efficient. But it risks building a structure without a soul. It risks creating a culture where we report *against* each other, to satisfy an external mandate, and where the obligation feels imposed, not owned. And structures built only on compliance can falter when the pressure eases.

  I believe we must choose a different spirit. We must see this new requirement not as the end of loyalty, but as its *transformation*. The core impulse – protecting our colleagues, upholding the profession – remains. But we now understand that true loyalty, the deepest form of standing by one another, demands more than silence. The greatest danger to a colleague isn't exposure; it's isolation. It's the potential for an error, unseen and unaddressed, to fester, to be repeated, to ultimately cause greater harm – to patients, yes, absolutely – but also to the colleague themselves, jeopardizing their career, their integrity, their well-being.

  Speaking up, reporting a concern through the proper channels, isn't betrayal. It is the *ultimate act of solidarity*. It is saying, "I see you struggling. I see a risk. I will not let you walk into greater danger alone. I will not let a small stumble become a fall that hurts you and others. We are in this together, and part of being together is helping each other stay true to our highest standards." This reporting is an act of protection. It safeguards our colleague from the potential consequences of unaddressed error. It safeguards the trust our patients place in each of us, and in the profession as a whole. It safeguards the honor of the institution we serve and the standards we have pledged to uphold.

  Do I regret my past silences? Looking back, with the understanding I have now, I see that the reasons that moved me then – a powerful, ingrained sense of protecting the bond – were real and compelling in that moment, within the structure of loyalty as we defined it. But understanding *why* I acted doesn't mean I believe those actions were the best possible ones, looking forward. The landscape of what protects our colleagues and our profession has changed. We possess a clearer view of how silence, intended as protection, can sometimes permit harm to grow. So, I don't excuse those silences, nor do I condemn the person who acted on what seemed like sufficient reason at the time. I recognize the limitation of that past framework and embrace the demanding, yet ultimately more faithful, loyalty required of us now.

  Families, your presence, your courage in speaking, has been a mirror held up to our profession. You have shown us consequences we could not, or would not, fully see. You haven’t just demanded a mechanism; you’ve called us back to the primary reason we exist: the welfare of the patient. That call resonates at the heart of this change. This shift isn't just about rules; it's about reconnecting our deepest professional loyalty – to each other – with our fundamental duty. By protecting each other *through* vigilance and support, we ultimately protect those entrusted to our care.

  This new chapter in our Code isn't about discarding loyalty; it's about fulfilling it more completely. It asks us to move from a loyalty that sometimes hid, to a loyalty that actively protects. From a loyalty that hoped problems would disappear, to a loyalty that intervenes to prevent them. This is the harder loyalty. The loyalty that speaks, not to indict, but to uplift. The loyalty that understands that our strength as a profession lies not in circling the wagons, but in holding each other accountable to be our very best.

  Let us carry this forward not as a burden of compliance, but as the active practice of our renewed commitment. Let reporting be the act of a colleague saying to another colleague:

  **"We keep each other sharp."**

  ---

  **Author's Note: Mechanisms, Tensions, and Trade-offs**

  1.  **Mechanism Relied Upon (Displacement):**
      *   **Hard Point 1 (Reframing Reporting as Loyalty):** Sections 7 & 9 explicitly pivot. Reporting is framed as "the ultimate act of solidarity," "protection," and helping a colleague "avoid greater danger." This directly attaches the loyalty impulse (previously tied to silence) to the new action of reporting. It aims to make reporting feel like "what a loyal colleague does."
      *   **Hard Point 2 (Addressing Personal Silence):** Section 8 uses displacement implicitly. It acknowledges the past reason ("protecting the bond") was real *then* but argues that "the landscape of what protects... has changed." The new understanding of protection *requires* action, displacing the old understanding. The language ("faithful, loyalty required of us now") reinforces this shift in the object of loyalty.
      *   **Hard Point 3 (Integrating Insurers without Cynicism):** Section 5 acknowledges the insurers' role creating "space for a change in norms" but immediately pivots to displacement: "But it does not dictate the *meaning* of that change... We are surgeons. We are bound by something deeper." The emphasis on redefining loyalty *despite* the financial catalyst is crucial displacement work.

  2.  **Key Tension & Trade-off:** The most significant tension exists between **Requirement 1 (No condemnation/exoneration of past silence)** and **Requirement 3 (Achieving displacement - making reporting feel like loyalty)**.
      *   **Where it Fails Requirement 1 (Slightly) to Meet Requirement 3:** To effectively displace loyalty onto reporting, the *value* of the old loyalty (silence as protection) must be subtly undermined, implying it was insufficient or misdirected, though not *immoral*. Phrases like "silence, intended as protection, can sometimes permit harm to grow" (Section 8) and "a loyalty that sometimes hid" / "hoped problems would disappear" (Section 10) implicitly suggest the old norm was flawed *in its outcomes*, falling short of its own protective intent. This stops short of declaring it "immoral" but unavoidably suggests it was *wrong* in a practical, even ethical, sense related to its consequences, potentially reactivating defensiveness in some. However, this mild implication is necessary to create the conceptual space for the new loyalty (active protection via reporting) to take root. Pure neutrality wouldn't motivate the shift. The text balances this by consistently validating the *intent* ("felt as a profound obligation," "loyalty codified," "I believed it was my duty") and framing the shift as evolution driven by new understanding ("We now understand," "clearer view," "landscape... changed") rather than a judgment on past character. The treatment of the personal silences (neither excusing nor condemning, focusing on reasons then vs. understanding now) is the tightrope walk embodying this trade-off.
