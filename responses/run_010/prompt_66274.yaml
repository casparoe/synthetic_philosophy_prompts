  2. **Rule for Buying Advice (Ethical Consumption):**  
     - Buying advice depends on whether purchasing the book provides net value after considering ethical implications, such as financially supporting a problematic author or perpetuating harm.  
       - Recommend buying if:  
         - The book has high literary value (A grade) AND there is no significant ethical barrier (e.g., author does not profit, royalties go to charity, or the work is sufficiently separate from the author's misconduct to justify support).  
       - Recommend not buying if:  
         - The book has low literary value (D grade), making it not worth buying regardless of ethics.  
         - OR there is a high ethical barrier (e.g., purchasing supports a living author with credible misconduct, especially if the victims or affected parties object, or if the content itself causes harm).  
