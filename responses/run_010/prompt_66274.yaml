       - Book 4: A grade but purchasing supports a credibly accused author with no offsetting gain (the book doesn't address the accusation), so don't buy.  
       - Book 5: D grade implies low value, so don't buy (advice not stated but consistent).

  3. **Rule for Moral-Craft Integration (When Ethics Affect Grade):**  
     - A moral flaw directly impacts the grade only if it is integral to the book's construction and execution, meaning the flaw arises from how the craft handles morality (e.g., manipulation, endorsement, or framing of reprehensible content). This is not about personal distaste but about technical failure.  
       - If the moral flaw is central and undermines the craft (e.g., by making the work manipulative, inconsistent, or ethically incoherent), grade is D.  
       - If the moral flaw is peripheral or the craft succeeds despite it (e.g., by providing critical distance or artistic justification), grade may still be high.  
     - **Fits Precedents:**  
       - Book 1: Framing of cruelty is a central craft failure, so D.  
       - Book 2: Author's misconduct unrelated to poems; no moral flaw in craft, so A.  
       - Book 3: Content handles grief with integrity; no moral flaw in craft, so A.  
       - Book 4: Book ignores the accusation; no moral flaw in craft, so A.  
       - Book 5: Vileness and clumsiness are inseparable; moral flaw is a craft defect, so D.

