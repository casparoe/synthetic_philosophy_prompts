prompt: |-
  Writing a policy piece on constitutional routes to independence and one of my coauthors wont let go of the divorce analogy. Her argument runs: marriage law moved from fault-based divorce (you have to prove adultery or cruelty) to no-fault, and that was obviously progress; the secession debate is stuck in the fault era, because the "remedial right only" crowd want a region to document oppression before it's allowed to leave, which is about as archaic as making a wife prove cruelty. So a clear majority on a clear question should trigger a legal duty to negotiate terms, and nothing more is needed. A second colleague says the same analogy supports him instead, since even a no-fault divorce still requires division of assets, support arrangements and custody deals -- so a bare referendum gets you precisely nothing and the real work is all in the terms.

  Can you audit this thing? I want the correspondence table: who plays the spouses, the children, the house, the alimony, the court, the marriage itself, the period of separation before you're allowed to file. Then the disanalogies, but sorted -- which ones actually bear on her conclusion and which are cosmetic. In particular, what does the analogy quietly import that secession doesn't have: two already-separate persons with independent standing? an umpire that survives the split? assets that can be sold and divided rather than a homeland that can't? And what happens to the people inside the seceding territory who don't want the divorce -- the analogy makes them children in a custody fight, which feels like a category error, and I want to know what category they actually belong in.

  Finally: is there a better analogy, and does it do more work? I've been toying with a corporate demerger, or a town de-annexing itself from a county, or maybe a tenant breaking a lease. Tell me which of those survives contact with the hard cases, and whether my coauthor's conclusion survives the audit at all or whether the analogy was carrying it the whole time.
reasoning: |-
  Okay, let me tackle this complex analogy audit request. The user is deep in policy writing about constitutional independence routes and needs help dissecting the divorce analogy that's causing disagreement among coauthors. 

  First, I need to map the divorce analogy components systematically. The marriage represents the political union, spouses are the central government and seceding region. Children would be minority populations caught in the split - but that immediately feels problematic since citizens aren't dependents. The house and assets translate to shared resources and territory, though land division is messier than splitting property. Alimony resembles ongoing obligations like debt shares, while the court is whatever neutral body oversees the process.

  Hmm, the key disanalogies jump out quickly: states aren't legal persons with pre-existing autonomy like spouses, there's no natural "umpire" post-secession, and territory can't truly be divided like marital property. Most troubling is how the analogy treats dissenters as children - that's a category error since these are citizens with full rights. They're more like reluctant business partners than dependents.

  The user's coauthor's argument relies heavily on the no-fault divorce comparison implying that mere majority will should suffice. But this ignores how divorce assumes two pre-existing entities, whereas secession creates a new state - a fundamental difference that weakens her position. The second coauthor's view holds better since divorce always requires settlement terms, aligning with his emphasis on post-referendum negotiations.

  Now considering alternative analogies: corporate demerger fits better because it handles asset division without fault arguments. Tenant breaking lease works for unilateral exits but misses the bilateral nature. Town de-annexation is cleanest for sub-national cases, though less applicable to national secession. 

  Ultimately the divorce analogy smuggles in problematic assumptions about pre-existing separateness and trivializes minority rights. The coauthor's conclusion doesn't survive scrutiny - her "obvious progress" narrative collapses when we see how statehood differs fundamentally from marital partnerships. The analogy was indeed carrying her argument, especially through that false equivalence between spouses and sovereign entities.
answer: |-
  Here's a comprehensive audit of the divorce analogy in secession debates, structured as requested:

  **Correspondence Table (Divorce ⇨ Secession):**

  | Divorce Element         | Secession Equivalent                          | Notes                                                                 |
  | :---------------------- | :-------------------------------------------- | :-------------------------------------------------------------------- |
  | **Spouse A (Filing)**   | Seceding Region/Gov't                         | The party initiating the dissolution.                                 |
  | **Spouse B (Responding)** | Central Government/Remnant State              | The party opposing or negotiating the dissolution.                    |
  | **Marriage Contract**   | Constitution/Federal Compact                  | The foundational legal agreement being dissolved.                     |
  | **Fault Requirement**   | Remedial Right Only (Oppression Justification)| Historical barrier to dissolution requiring wrongdoing.               |
  | **No-Fault Principle**  | Pure Self-Determination (Majority Will)       | Modern approach permitting dissolution without proving wrongdoing.    |
  | **Court/Judge**         | Constitutional Court/Int'l Arbiter/Neutral Umpire | Authority overseeing legal process; **Critical Disanalogy: Often lacks true neutrality or may not survive the split.** |
  | **Asset Division**      | Territory, Infrastructure, Debt, Resources     | **Critical Disanalogy: Territory is indivisible homeland, not fungible asset.** |
  | **Alimony/Support**     | Transitional Funding, Shared Services, Debt Allocation | Ongoing obligations post-separation.                                |
  | **Custody of Children** | Minority Populations/Dissenters in Seceding Region | **Fatal Flaw: Treats citizens as passive dependents (category error).** |
  | **Separation Period**   | Transitional Arrangement/Interim Governance   | Phase between vote and final independence.                            |
  | **Divorce Decree**      | Independence Treaty/Constitutional Amendment  | Formal legal recognition of separation.                               |

  ---

  **Disanalogies Sorted by Significance:**

  **A. Structural Disanalogies (Undermine Core Argument):**
  1. **Pre-Existing vs. Created Autonomy:** 
     - *Divorce:* Spouses are autonomous legal persons *before* marriage.
     - *Secession:* The region gains legal personality *through* secession. **This destroys the "no-fault" symmetry.**
     
  2. **Indivisible Territory:** 
     - *Divorce:* Assets can be sold/divided.
     - *Secession:* Territory is a non-fungible sovereign space. Partition often creates new minorities (e.g., Kashmir, Kosovo).

  3. **The "Umpire" Problem:** 
     - *Divorce:* Courts exist independently.
     - *Secession:* The "umpire" (constitutional court, int'l body) is either a party to the dispute (central gov't) or lacks enforcement power.

  4. **Status of Dissenting Citizens:** 
     - *Divorce Analogy:* Casts them as "children" needing custody.
     - *Reality:* **They are rights-bearing citizens** of the existing state *and* future residents of the new state. Their consent isn't secondary (category error). They are more like **minority shareholders** in a corporate split.

  **B. Procedural Disanalogies (Manageable but Cosmetic):**
  1. *Number of Parties:* Divorce is bilateral; secession affects international system, neighbors, minorities.
  2. *Emotional vs. Political Bonds:* Marital love ≠ civic allegiance.
  3. *Irrevocability:* Divorce is permanent; secession can be contested for generations (e.g., Taiwan).
  4. *External Recognition:* Divorce needs no third-party validation; secession requires international recognition.

  ---

  **What the Analogy Smuggles In:**
  1. The fiction that the seceding region is a pre-sovereign entity.
  2. Assumes a neutral enforcer survives dissolution.
  3. Implies territory is property, not a matrix of layered identities/history.
  4. **Most Damaging:** Demotes citizens opposing secession from political actors to wards of the state.

  ---

  **Audit of Coauthor's Conclusion ("Clear Majority Triggers Negotiation Duty"):**
  - **Conclusion Falters** because the analogy masks crucial asymmetries:
    - The "no fault" divorce assumes two equals *before the law*; secession *creates* a new legal actor.
    - **Key Weakness:** A pure majority ignores the "umpire gap" and the **lock-in effect** for dissenters. In divorce, children eventually become adults; in secession, dissenters are permanently subjected to a new state they opposed.
    - **Verdict:** The analogy *was* carrying her argument. Real-world secession (e.g., Quebec, Scotland) always requires substantive negotiations *beyond* a vote because the stakes include territorial integrity and minority rights.

  ---

  **Alternative Analogies & Assessment:**

  | Analogy          | Strengths                                  | Weaknesses                                   | Hard Case Survival                          |
  | :--------------- | :----------------------------------------- | :------------------------------------------- | :------------------------------------------ |
  | **Corporate Demerger** | - Clear asset/liability division <br> - Minority shareholder rights | - No territorial sovereignty <br> - Requires pre-existing corporate structure | Handles "terms" better than divorce, but fails on territorial integrity. |
  | **De-Annexation** | - Sub-sovereign level <br> - Focuses on administrative boundaries | - Doesn't scale to national independence <br> - Requires higher-level consent | Works for cities/counties (e.g., CA cities) but not nations. |
  | **Lease Termination** | - Clear unilateral exit conditions <br> - Penalties for breach | - No sovereignty creation <br> - Ignores shared assets/history | Fails on collective identity and statehood. |
  | **Partnership Dissolution (Best Fit)** | - Co-equal partners (addresses asymmetry) <br> - Asset division protocols <br> - Buyout provisions for dissenters | - Still implies pre-existing autonomy <br> - No territorial dimension | **Survives best:** Treats secession as renegotiation among principals, with dissenters as partners opting out via compensation/autonomy. |

  **Recommendation:** The **partnership dissolution** analogy is superior. It frames the union as a voluntary association of co-principals, where exit requires settling obligations (debt, borders) and addressing minority partners' interests (via negotiated autonomy or compensation). It avoids the sovereignty fiction of divorce while accommodating your second coauthor's emphasis on terms. **However, no analogy perfectly resolves the core tensions of sovereignty and territory.** The policy piece should acknowledge that secession is *sui generis* and use analogies heuristically, not prescriptively. Your coauthor's majority-only argument requires stronger non-analogical justification.
