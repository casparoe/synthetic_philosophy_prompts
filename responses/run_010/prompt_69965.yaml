  Hmm, the user runs a nonprofit that designs citizens' assemblies for local councils and wants to create a practical screening tool based on Athenian democratic failures. They're worried about Mytilene (impulsive decisions), Sicily (information gaps), and Socrates (procedural flaws) happening in their modern assemblies. They want concrete checks - not academic theory - to evaluate real projects.

  Key things they emphasized: They need actionable numbered checks with clear pass/fail criteria, dispositions (redesign/decline/proceed), and blunt application to three case studies. They're explicitly rejecting "consultancy deck best practices" in favor of Athenian-derived mechanisms. The deliverables must fit a one-hour team call format.

  Breaking this down: The Mytilene case shows the danger of irreversible decisions made without cooling-off periods. For the screen, I'll design Check 1 about decision reversibility and execution speed. Sicily reveals problems with information asymmetry and pressure on truth-tellers - that becomes Check 2 on information flows and consequence buffers. Socrates demonstrates how flawed voting procedures and unaddressed subtext warp outcomes, leading to Check 3 on hidden agendas and penalty phase design.

  The "Not Our Call" section needs special handling. When values conflicts arise (like a council insisting on pre-election timing despite risks), the screen should explicitly hand off with language like "This crosses into political tradeoffs only your council can weigh." 

  For their three cases: Design 1 (urgent care vote before election) will fail multiple checks - especially the no-second-reading issue echoing Mytilene's near-disaster. I'll recommend declining despite their contractual commitment. Design 2 (housing density with planted critic) has fixable issues if the critic's role is neutralized. Design 3 (members campaigning post-referendum) is salvageable by decoupling deliberation from advocacy.

  Disanalogies matter here. Unlike Athens, modern assemblies don't vote on massacres or military expeditions. But the core mechanisms - impulse control, truth incentives, voting design - absolutely scale down to bus fares. The screen might overflag complex multi-session designs as "Sicily risks" when actually they're robust. And it won't catch external shocks like funding cuts.

  The user's clearly time-pressed ("no bibliography", "no Thucydides quotes") but deeply informed. My response should honor that by being densely practical - every sentence must pull weight. The "bottom line" upfront confirms this approach is worth it because their work involves high-stakes irreversible decisions (like urgent care closures) where Athenian failure modes still activate.
answer: |-
  Here's your Athenian failure mechanism screening tool, stripped to operational essentials:

  **Bottom line**  
  Yes, this screen is critical. Athenian failures weren't about scale but core deliberative flaws that replicate in microcosm. Focus on **Mytilene's irreversibility**, **Sicily's information distortion**, and **Socrates' procedural brittleness**. Three checks carry 80% of the weight: (1) Can the assembly walk back a bad decision before harm? (2) Do truth-tellers have safe channels without self-censorship? (3) Does the voting process force premature closure on complex moral/political tradeoffs? Run this *before* signing any commission. It takes 30 minutes once trained.

  **Three Mechanisms**  
  1.  **Mytilene (Book 3):** *Mechanism: Assembly voting on irreversible high-harm actions without a circuit-breaker.* The core failure is executing a decision before participants experience its emotional or practical weight. It’s *not* about emotional volatility; it’s about no design feature forcing reconsideration *after* initial passion cools but *before* implementation locks in.  
  2.  **Sicily (Books 6-7):** *Mechanism: Suppression of inconvenient truth due to perceived audience hostility or personal risk.* Failure occurs when messengers (experts, generals, dissenters) rationally anticipate punishment (career loss, social backlash, legal prosecution) for delivering bad news or complexity, leading to silence, hedging, or defection. It’s *not* mere ignorance; it’s *incentivized* ignorance.  
  3.  **Socrates (Plato's Apology, Xenophon):** *Mechanism: Procedural design amplifying factional conflict or moral panic into irreversible verdicts.* Brittle voting (single vote, no deliberation, no new info for penalty phase) turns complex judgments (influence vs. crime) into blunt yes/no choices vulnerable to hidden agendas. It’s *not* just jury size; it’s the *lack of structured dialogue to separate charges from subtext* before the vote.

  **The Screen** (Run in this order)

  1.  **The Mytilene Check: Irreversible Harm & Cooling-Off**  
      *   **Question:** "Can this assembly's core decision cause significant, irreversible harm (e.g., facility closure, binding commitment) *before* members have a guaranteed chance to revisit it with new perspective?"  
      *   **Passing:** "No irreversible action before a distinct 'second deliberation' phase separated by days/weeks OR decision is inherently reversible/modifiable." (e.g., recommendation subject to council review).  
      *   **Red Flag:** "Final vote triggers immediate implementation." / "No mandated re-deliberation after initial vote, even if new info emerges."  
      *   **Disposition:** **REDESIGN** (Require cooling-off period + second deliberation before finalizing irreversible actions). Decline only if redesign impossible.

  2.  **The Sicily Check: Truth-Teller Safety & Incentives**  
      *   **Question:** "Does the design actively protect and encourage participants/staff/experts to surface inconvenient facts, uncertainties, or dissenting views without fear of professional or social reprisal?"  
      *   **Passing:** Explicit norms/rules protecting dissent (e.g., Chatham House Rule, anonymous submission options for evidence/questions). Facilitators trained to surface minority views. *No* punitive consequences anticipated for challenging consensus.  
      *   **Red Flag:** "Participants/staff fear backlash from peers/commissioner for raising negatives." / "Experts feel pressured to align with perceived council/group preference." / "Design includes 'accountability' measures likely to stifle candor."  
      *   **Disposition:** **REDESIGN** (Implement stronger safeguards, anonymity options, facilitator protocols). **DECLINE** if commissioner insists on punitive elements (e.g., public voting on expert performance).

  3.  **The Socrates Check: Voting Brittleness & Hidden Agendas**  
      *   **Question:** "Does the final voting process force a premature, simplistic choice on a complex issue where hidden motivations (political, moral panic, factionalism) could hijack the outcome?"  
      *   **Passing:** Voting follows *structured dialogue* explicitly separating factual conclusions, value tradeoffs, and recommendations. Multi-stage voting (e.g., agree on facts THEN values THEN rec). Penalty/implementation vote (if separate) requires new deliberation.  
      *   **Red Flag:** "Single vote on final recommendation after long process." / "No mechanism to surface and address underlying tensions (e.g., anger at associated groups/politicians) before voting." / "Penalty/implementation vote occurs immediately after main verdict with no new input."  
      *   **Disposition:** **REDESIGN** (Implement staged voting, explicit "subtext surfacing" sessions, separate deliberation for penalty/implementation). **DECLINE** if voting is purely symbolic/performative with high factional tension.

  **Not Our Call**  
  The screen hands off when the core risk is a *value conflict* the commissioner must own: "This design passes procedural checks, but the *political context* (e.g., timing near election, sensitivity of topic) creates high risk of [Specify: e.g., recommendation being ignored/weaponized, public backlash]. Only the council can weigh this risk against the value of proceeding now. We proceed only if you formally accept this contextual risk." Document acceptance.

  **Run on My Three**

  1.  **Urgent Care Closure (45 members, pre-election vote, no second reading):**  
      **VERDICT: FAIL (Mytilene & Socrates). DECLINE.**  
      *   **Mytilene:** Irreversible closure decision voted *once* with no cooling-off or second deliberation. High harm risk. Red Flag.  
      *   **Socrates:** Single vote on a highly charged issue (jobs, healthcare access) right before an election, guaranteeing it becomes a political football. No process to separate factual need from voter anger/electoral fears. Red Flag. Publishing pre-election invites weaponization. **Bluntly:** This is a procedural grenade timed for an election. Decline, citing irreversible action + brittle vote amid high political tension. If impossible, insist on a non-binding *exploratory* report only.

  2.  **Housing Density (90 members, critic, mid-point report):**  
      **VERDICT: PASS (With Redesign on Sicily).**  
      *   **Sicily:** The designated "critic" is a plant supporting the proposal. This actively *discourages* genuine dissent/inconvenient truths (Red Flag). Creates false sense of balanced scrutiny.  
      *   **Fix:** Require the council to appoint a *genuine*, respected critic of the proposal, or remove the designated critic role entirely. Use the mid-point report process to explicitly solicit *anonymous* concerns from members/experts. Proceed once fixed.

  3.  **Referendum & Campaigning (Members write ballot & campaign):**  
      **VERDICT: FAIL (Socrates & Sicily). REDESIGN.**  
      *   **Socrates:** Forces a single, simplistic ballot wording vote on their own complex recommendation – highly vulnerable to framing battles *within* the assembly. Brittle.  
      *   **Sicily:** Expecting members to campaign *after* creates massive pressure during deliberation to avoid inconvenient facts or moderate positions that might be hard to sell later. Truth suppression risk.  
      *   **Fix:** Decouple roles. The assembly *recommends* policy and provides neutral pros/cons for the ballot. A separate council team (or neutral ref) drafts the *ballot wording* based on the rec. *Absolutely prohibit* assembly members from campaigning. Their job is deliberation, not advocacy.

  **Where This Breaks**  
  *   **Load-Bearing vs. Costume Drama:** The mechanisms (impulse, fear, brittle process) are load-bearing *even for bus fares*. The disanalogy is *stakes* (massacre vs. closure), not the *psychological/political dynamics*. The screen flags risks proportional to the decision's harm.  
  *   **Over-Application:** The screen might flag *all* complex, high-stakes assemblies as "Sicily risks". That's the point – it forces explicit risk mitigation, not avoidance. It *won't* flag competent assemblies tackling truly novel problems well.  
  *   **Blind Spots:** It won't catch:  
      *   *External Sabotage:* A council deliberately ignoring a valid outcome.  
      *   *Facilitator Bias:* Subtle steering undermining neutrality.  
      *   *Resource Starvation:* Underfunding creating Sicilian information gaps by default.  
      *   *True Novelty:* Problems where *no* good information exists (unlike Sicily, where info was available but suppressed).  
  *   **False Positives:** Very large assemblies (150+) with superb facilitation *might* mitigate Socrates risks adequately, but the screen would flag them – err on caution. Highly technical, low-emotion topics might bypass Mytilene impulses.  

  **Execute this:** Print the 3 Checks + Dispositions. In your 1-hour call: (1) Brief team on mechanisms (5 mins), (2) Run each Check sequentially on the design (15 mins), (3) Determine Disposition (5 mins), (4) If "Not Our Call," draft handoff wording (5 mins). Document rationale.
