  **Scores & Reasoning:**  
  - **Functional (9/10):** Excels by defining 'a' through contextual disambiguation, handling ligatures, graffiti, and circle-swaps via linguistic function.  
  - **Community-Normative (8/10):** Strong for human readers (graffiti, Greek/alpha distinction) but fails for machines lacking cultural context.  
  - **Causal-Historical (7/10):** Explains printed vs. handwritten 'a' divergence via lineage but stumbles on graffiti (novel forms) and circle-swaps (non-derivative).  
  - **Invariants (6/10):** Handles deformation (single/double-story) yet fails ligatures (lost structure) and circle-swaps (no stroke logic).  
  - **Family Resemblance (5/10):** Vague chains cover variation but offer no predictive power for edge cases (e.g., circle-swap).  
  - **Template (3/10):** Rigidly fails double-story 'a', ligatures, and circle-swaps by demanding fixed similarity.  

  **Classifier & Human/Machine Flip:**  
  - **Bet for classifier:** **Invariants** (stroke topology) — most reliably detectable algorithmically from glyph shapes.  
  - **Ranking flip?** **Yes:** Community-normative drops (machines lack cultural intuition), while Invariants/Causal-Historical rise (structural/lineage data is machine-parseable).  

  ---

  **Case-by-Case Analysis:**  
  1. **Single-story vs. double-story 'a'**  
     - Template (3/10): Fails — too rigid to accept both as equivalent.  
     - Family Resemblance (5/10): Passes — links via overlapping curves.  
