  Okay, let me approach this systematically. The user is designing a philosophy exam question centered on Nozick's animal ethics framework, specifically targeting a common student misunderstanding about his dual criteria. The core challenge is to create a question that forces students to distinguish between:
  - The "life narrative" criterion (for assessing harm of death)
  - The "moral agency" criterion (for applying side constraints)

  The Moses parrot case is brilliant because it creates tension between these criteria. Moses shows long-term planning (meeting the death-harm criterion) but lacks moral agency (failing the side-constraint criterion), while the cognitively impaired human has the inverse profile. 

  For the exam question itself, I'll need to:
  1. State the case concisely (under 3-minute read)
  2. Explicitly ask students to:
     - Identify both criteria
     - Apply them to both beings
     - Analyze the hybrid view's stability
     - Take a position on collapse-as-reductio vs. virtue

  The model answer should demonstrate:
  - Precise exposition of Nozick's two criteria
  - Clear application to Moses (high death-harm, low moral agency) and the human (low death-harm, high moral agency)
  - Argument that this creates a dilemma forcing revision
  - Bold stance that collapse into Kantianism is desirable

  Marking scheme must penalize:
  - Conflating the two criteria (common mistake)
  - Treating the human-parrot disanalogy as conclusive rather than dilemmatic
  - Ignoring the "collapse" evaluative component

  For first-class scripts, I'll emphasize:
  - Recognizing that Nozick's framework already contains resources to handle this (e.g., his "value to us" caveat)
  - Proposing coherent revisions rather than just identifying problems
  - Nuanced treatment of the reductio question

  Final verdict will be UNSTABLE - the Moses case exposes fundamental tension requiring either abandoning the hybrid or significantly modifying its criteria.
answer: |-
  ### Exam Question (as appearing on paper)  
  **(25 marks; candidates should spend approximately 45 minutes)**  

  > **Question 3**  
  > Robert Nozick proposes combining "utilitarianism for animals" with "Kantianism for people." His view relies on two distinct criteria:  
  > (i) Whether *death is a significant harm* to a being (based on its capacity for long-term projects/future-oriented plans).  
  > (ii) Whether *moral side constraints apply* to a being (based on its capacity to shape its life by a conception of the good, respond to reasons, and engage in moral relations).  
  >  
  > **Case:** A research sanctuary houses an African grey parrot, Moses. Documented evidence shows Moses:  
  > - Remembers a complex task for 18 months,  
  > - Declines immediate food to obtain a tool needed next week,  
  > - Shows prolonged distress when a companion bird is removed.  
  > A virology group proposes non-lethal but painful experiments on Moses to avert widespread suffering/death among wild parrots. The same proposal, made for a 41-year-old man in a nearby care facility with profound congenital cognitive impairment (who displays no long-term planning), would be rejected outright.  
  >  
  > **Tasks:**  
  > (a) Explain how Nozick’s criteria apply to Moses and the man. (8 marks)  
  > (b) Assess whether Nozick can consistently permit experimenting on Moses while forbidding it for the man. (10 marks)  
  > (c) If this case forces Nozick’s view toward single-tier Kantianism (applying side constraints to all sentient beings), is this a *reductio* of his view or its most defensible outcome? Justify your answer. (7 marks)  

  ---

  ### Model Answer (720 words)  
  Nozick’s hybrid ethics distinguishes sharply between beings subject to utilitarian aggregation (animals) and those protected by side constraints (persons). The Moses case exposes unresolved tensions by presenting a non-human with person-like traits and a human without them.  

  **(a)** For Nozick, *death’s harmfulness* depends on a being’s ability to frame long-term projects. Moses exhibits this robustly: his tool-seeking and 18-month memory demonstrate future-oriented planning. Thus, death *would* harm Moses significantly. Conversely, the cognitively impaired man’s lack of comparable planning implies death harms him less. However, *side constraints* hinge on distinct capacities: shaping one’s life via a conception of the good, moral reciprocity, and reason-responsiveness. Moses’s distress at his companion’s absence suggests social bonds, but Nozick likely denies parrots can grasp moral reasons or form a life-narrative. Thus, Moses lacks side constraints. The man’s impairment may preclude projects, but as a human, he presumptively retains the latent capacity for moral relations—placing him within the "Kantian" tier.  

  **(b)** Nozick *cannot* stably defend permitting Moses’s use while forbidding the man’s. His framework faces a dilemma:  

  *First horn:* If side constraints require only the capacities Moses displays (e.g., future-planning), Moses qualifies for Kantian protection. But this collapses the hybrid: if animals with complex cognition have inviolable rights, using them for food or biomedical research (even to benefit animals) becomes impermissible. Nozick’s justification for killing animals—that they lack side constraints—fails. His unresolved "intervention in nature" problem (e.g., whether we should prevent wild animal suffering) also becomes intractable: if animals have rights, we cannot intervene in ways that violate them.  

  *Second horn:* If side constraints require uniquely human traits (e.g., abstract moral reasoning), the man retains protection, but Moses does not. However, Nozick offers no principled basis for this exclusion that doesn’t covertly rely on species. Moses’s documented capacities meet Nozick’s *stated* threshold for personhood: he shapes actions around future goals and exhibits relational bonds. Arbitrarily demanding higher thresholds (e.g., language) would exclude some humans (like the man) or include some animals. Nozick’s hybrid thus either disintegrates or relies on unargued anthropocentrism.  

  The asymmetry in the case—allowing Moses’s pain for parrot-benefit but not the man’s for the same—rests on animals’ eligibility for utilitarian trade-offs. But if Moses has person-like cognition, sacrificing him for aggregate welfare becomes analogous to sacrificing a human for animal welfare, which Nozick rejects. Consistency demands either granting Moses side constraints (undermining animal utilitarianism) or admitting the impaired man lacks them (violating human dignity).  

  **(c)** The collapse into single-tier Kantianism is the hybrid’s *most defensible outcome*, not a *reductio*. Nozick himself worries that "any boundary would be arbitrary" (*ASU*, p. 48) but avoids confronting beings like Moses. His criteria for side constraints—guidance by reasons and moral relations—are satisfied by Moses’s tool-seeking (instrumental rationality) and distress (social engagement). If morality protects beings who value their existence, Moses demonstrably does. Granting him rights coheres with Kantianism’s core: respecting autonomy where it exists.  

  This revision resolves Nozick’s inconsistencies:  
  - Killing animals for food is impermissible if they have rights, aligning with his own emphasis on respecting "organic unity."  
  - The "intervention in nature" problem gains clarity: we may intervene to uphold animal rights (e.g., preventing predation if feasible without greater harm), but not violate rights to reduce suffering.  
  - The impaired man’s protection remains intact via human solidarity or precautionary inclusion in the moral community.  

  While this abandons Nozick’s hybrid, it salvages his insight that moral status tracks psychological capacities—not species. The parrot’s documented mind forces us to take non-human personhood seriously, making Kantian universalism more coherent than an unstable dualism.  

  **Verdict:** UNSTABLE  

  ---

  ### Marking Scheme  
  **Total: 25 marks**  
  1. **Correctly identifies both criteria** (4 marks)  
     - *Miss:* Conflates criteria or omits one (e.g., assumes "future-plans" determines side constraints).  
  2. **Accurate application to Moses and the man** (5 marks)  
     - *Miss:* Fails to note Moses’s planning meets death-harm criterion OR assumes man automatically gets side constraints without addressing impairment.  
  3. **Dilemma analysis (both horns)** (8 marks)  
     - *Miss:* Only presents one horn OR treats man-parrot disanalogy as refutation rather than tension needing resolution.  
  4. **Position on collapse (reductio/virtue) with justification** (5 marks)  
     - *Miss:* Asserts preference without engaging Kantianism’s implications for animal rights/Nozick’s unresolved problems.  
  5. **Resolution coherence** (3 marks)  
     - *Miss:* Suggests ad-hoc revisions (e.g., "exclude birds") without principles. *Note:* Full marks possible for opposite conclusion if candidate (i) argues Moses lacks moral relations despite evidence, (ii) defends species as proxy for capacities, (iii) justifies hybrid’s practical necessity.  

  ---

  ### First-Class vs. 2:1 Differentiation  
  A **first-class script** distinguishes itself by diagnosing *why* the dilemma arises: Nozick’s criteria are *empirically underspecified* and risk over/under-inclusion when confronted with atypical cases. It proactively addresses counterarguments (e.g., "But the man is human!"), linking this to Nozick’s worry about "arbitrary boundaries." Crucially, it offers a *principled resolution* (e.g., refining "moral relations" to require reciprocal obligation, which Moses might lack) or embraces collapse as fidelity to Nozick’s deepest commitments. A **high 2:1** accurately applies criteria and presents the dilemma but may not probe its structural roots or resolve tensions innovatively, retreating to description over reconstruction.
