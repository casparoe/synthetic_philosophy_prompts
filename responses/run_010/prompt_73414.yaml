answer: |-
  **Bottom Line: The core distinction is between factual conditionals (indicative mood, antecedent true or unknown) and counterfactuals (subjunctive mood, antecedent false), with "would" requiring near-certain evidence of causation.**

  ### Triage Procedure for Conditionals  
  *(Run sequentially on every conditional sentence. Time: <15 min/clinician.)*  

  1. **Is the antecedent TRUE, FALSE, or UNKNOWN?**  
     - *Evidence needed:* Explicit record (e.g., chart, timestamp, witness).  
     - **FALSE?** → Rewrite in subjunctive mood: "if [antecedent] **had been**..." + "**would/might have** [consequent]." Strike indicative versions (e.g., "if the checklist was...").  
     - **UNKNOWN?** → Flag for human review (judgment call*).  

  2. **For counterfactuals (antecedent FALSE): Can we assert "would have"?**  
     - *Evidence needed:* Physical law, 100% observed correlation, or design specification (e.g., "the press interlock *always* prevents cycling if engaged").  
     - **NO?** → Downgrade to "**might have**" or "**would likely have**."  
     - **NO evidence?** → Strike or recast as record statement: "**Our records lack proof that** [consequent]."  

  3. **Check for reversed conditionals in summaries:**  
     - Block "**not B, therefore not A**" inferences (e.g., "the press did not cycle, so the interlock was not defeated").  
     - *Exception:* Only if evidence proves **biconditionality** (A occurs *if and only if* B occurs). Else, rewrite as: "**Absence of [B] is consistent with absence of [A], but other factors may apply.**"  

  4. **Judgment calls* (escalate to human):**  
     - Disagreement over **background conditions** (e.g., "Would staffing *alone* have prevented the error?").  
     - Ambiguity in **causal certainty** (e.g., "would" vs. "might" when evidence is probabilistic).  

  5. **Strike if:**  
     - Antecedent FALSE but written in indicative mood.  
     - Pure speculation with no evidence (e.g., "if the moon was full...").  

  ---  
  ### Application to Live Drafts  
  **Sentence 1:**  
  *"If the second nurse had been present at handover, the wrong-site mark would have been noticed."*  
  - **Step 1:** Antecedent FALSE (second nurse absent). → **Subjunctive OK.**  
  - **Step 2:** Evidence = 8/11 handovers with two nurses caught discrepancies. **Not 100%** → Downgrade to:  
    *"If the second nurse had been present, the mark* ***might have*** *been noticed (8 of 11 past cases caught discrepancies)."*  

  **Sentence 2:**  
  *"If the unit had been staffed to establishment that night, the error would not have reached the patient."*  
  - **Step 1:** Antecedent FALSE (understaffed). → **Subjunctive OK.**  
  - **Step 2:** Evidence? No physical law; staffing prevents errors probabilistically. **Capital request dependence irrelevant** → Downgrade to:  
    *"If the unit had been staffed to establishment, the error* ***might not have*** *reached the patient."*  
    *(Judgment call*: Escalate to human if disagreement on background factors, e.g., severity of error).  

  **Sentence 3 (Pair):**  
  *"If the interlock had been defeated, the press would have cycled."*  
  *"If the interlock had been defeated with the guard in place, it would not have [cycled]."*  
  - **Step 1:** Antecedent FALSE (interlock not defeated). → **Subjunctive OK for both.**  
  - **Step 2:**  
    - First sentence: Evidence? Likely design specification → **"would" acceptable.**  
    - Second sentence: Evidence? Likely design specification → **"would" acceptable.**  
  - **Consistency check:** Sentences imply cycling depends on **guard position**. Block reversal ("press did not cycle → interlock not defeated") unless **biconditionality** proven (e.g., cycling *only* possible if interlock defeated *and* guard up).  
  - **Rewrite pair for clarity:**  
    *"The press would cycle only if the interlock was defeated* ***and*** *the guard was not in place."*  

  ---  
  ### What the Procedure Cannot Settle  
  - **Disagreements over background conditions** (e.g., "Had staffing been adequate, would *all other errors* still have occurred?").  
  - **Causal interpretations of probabilistic evidence** (e.g., "Does 80% success rate justify 'would'?").  
  - **Ambiguous records** (e.g., "Was the guard in place? Unclear from logs").
