  We are dealing with conditionals in patient-safety reports. The core problem is the misuse of indicative and subjunctive conditionals, and the reversal of conditionals in summaries. The key distinction is between conditionals that are **counterfactual** (referring to a situation that did not occur) and those that are **indicative** (referring to actual events). However, in the context of safety reviews, we often deal with counterfactuals: what would have happened if things had been different? The critical issue is that when the antecedent is false (we know it didn't happen), we must use the subjunctive (or conditional) mood and be cautious about the consequent. Moreover, we must not confuse the logical direction (if A then B does not mean if not B then not A, unless we have equivalence).

