  Breaking down the core conflict: The prudential impatience defender sees pure time preference as authentic personal preference with normative weight, while the Parfitian views it as an epistemic distortion that vanishes under full rationality. The verbal trap centers on whether "bias" implies irrationality by definition or if it's just a descriptive term - this is where they're talking past each other.

  For the joint statement, I need to craft:
  1) Agreed claims covering conceptual distinctions and normative points
  2) A fair disagreements table without strawmen
  3) Cruxes with testable predictions
  4) Each side's admission of counterevidence
  Plus analyzing "anchored neutrality" as a potential middle ground

  Key challenges:
  - Keeping normative claims minimal in the agreement section
  - Ensuring disagreement wordings satisfy both parties
  - Making cruxes genuinely pivotal with clear pre-registrations
  - Assessing if anchored neutrality is distinct or absorbed by existing views

  The social discount rate discussion needs careful handling - noting parallels to prudential debate while acknowledging distinct considerations like intergenerational equity.

  I should flag potential sticking points:
  - Claim about "no uncontested rationality proof" might trouble the Parfitian
  - Anchored neutrality analysis could feel forced
  - The survival risk/growth distinction might be contested in edge cases

  The response must remain strictly neutral in formulation while being precise enough to advance their discussion. The value is in clear philosophical framing rather than citations or resolutions.
answer: |-
  Below is the adversarial collaboration document drafted per your specifications. I've first brainstormed the verbal/substantive distinction explicitly, then structured the joint statement with agreed claims, disagreements, cruxes, and counterevidence. Anchored neutrality is analyzed separately. Confidence assessments follow the document.

  ---

  ### **Verbal vs. Substantive Core: Diagnosing the Stalemate**  
  The core verbal dispute centers on **whether "bias" inherently implies irrationality**. For the prudential-impatience defender, "bias" smuggles in a normative standard (temporal neutrality) that invalidates her view by definition. For the Parfitian, "bias" is descriptive: it denotes a distortion in *accessing* reasons (e.g., vividness obscuring intrinsic value), not a dismissal of preferences. This is verbal because both could agree that:  
  - If "bias" means *"a cognitive distortion that vanishes under full information and rationality"*, the Parfitian wins by stipulation.  
  - If "bias" means *"any deviation from temporal neutrality"*, the defender wins by stipulation.  

  The **substantive dispute** is whether pure time preference (PTP) survives reflective scrutiny as a *prudential reason*. The defender claims PTP is a brute prudential fact (e.g., "I simply care less about future pains"). The Parfitian claims PTP dissolves when we distinguish *reasons* from *psychological artifacts* (e.g., "relief at past pains being over isn’t a reason to discount future pains").  

  ---

  ### **Joint Statement: Agreed Claims**  
  Both parties endorse the following:  
  1. **Conceptual Distinctions**:  
     - PTP (δ) is separable from discounting for survival risk (p), expected utility growth (g), and marginal utility elasticity (η). A discount rate *r* can be decomposed as *r ≈ δ + gη + p* without conflating terms.  
     - In the social context, δ is distinct from intergenerational equity parameters. A zero δ (e.g., Stern) doesn’t require zero η or g; Nordhaus’s δ > 0 doesn’t entail indifference to future welfare.  
  2. **Empirical Grounding**:  
     - Humans exhibit present-biased preferences (hyperbolic discounting) and past/future asymmetries (e.g., preferring pains in the past). These are observable, regardless of normative status.  
  3. **Normative Minimalism**:  
     - No uncontested *a priori* proof exists for temporal neutrality or PTP as rationally required. Both positions require further justification.  
  4. **Social Discounting Inheritance**:  
     - Prudential PTP (if defensible) could *inform* but not *determine* social δ, due to distinct issues (e.g., sovereignty over others’ futures, non-identity problem).  

  ---

  ### **Disagreements Table**  
  | Prudential-Impatience Defender | Parfitian Neutralist |  
  |--------------------------------|----------------------|  
  | Pure time preference (δ > 0) is a foundational prudential attitude: an agent’s lesser concern for future states *just is* a reason to discount them, and it retains authority under full rationality. | Pure time preference is an epistemic artifact: under full information and vividness calibration, temporal distance to a good/pain provides no intrinsic reason to weight it differently. Discounting should only reflect instrumental factors (risk, growth). |  

  ---

  ### **Cruxes & Pre-Registered Predictions**  
  1. **Past-Directed Asymmetry**:  
     - *Case*: Subjects choose between (A) a past pain + future pleasure or (B) past pleasure + future pain, with identical magnitudes/timing.  
     - *Defender Prediction*: Subjects reliably prefer (A), showing past/future asymmetry is a deep prudential preference (not bias).  
     - *Parfitian Prediction*: Under vividness equalization (e.g., VR immersion in past/future), asymmetry vanishes, revealing it as representational noise.  
  2. **Vividness Calibration**:  
     - *Case*: Subjects discount a future reward before/after immersive visualization of it (e.g., VR simulation of future self).  
     - *Defender Prediction*: Discount rates decrease slightly but δ > 0 persists; vividness affects salience, not core preference.  
     - *Parfitian Prediction*: Discount rates converge to near-zero δ post-calibration; PTP was misrepresentation.  
  3. **Rational Endorsement**:  
     - *Case*: Agents review lifetime utility streams. Does post-hoc ratification of PTP-determined choices correlate with wellbeing?  
     - *Defender Prediction*: Agents who maintained PTP report higher wellbeing; resisting neutrality isn’t regret-prone.  
     - *Parfitian Prediction*: Agents who switched to neutrality report reduced regret; PTP choices are later seen as errors.  

  ---

  ### **Counterevidence Admissions**  
  - **Defender**: "If subjects *retract* PTP-driven choices after vividness calibration (e.g., ’I misjudged my future care’), this weakens my view by showing PTP isn’t stable under scrutiny."  
  - **Parfitian**: "If PTP persists in agents with high cognitive load *without regret* (e.g., busy parents discounting retirement saving), this suggests it may track non-representational prudential values."  

  ---

  ### **Anchored Neutrality: Third View or Absorption?**  
  **Analysis**: Anchored neutrality (AN) is a **distinct third view**. It rejects both:  
  - The defender’s *compounding* δ (which weights t=100 less than t=10).  
  - The Parfitian’s *total temporal neutrality* (which denies t=0’s privilege).  
  AN argues t=0 has unique status as the "locus of agency," justifying a one-time discount for immediacy (e.g., "I can *act* now"), but no compounding.  

  **Absorption Test**:  
  - *Defender* would call AN "PTP with a step-function wrapper," retaining arbitrariness.  
  - *Parfitian* would call AN "present bias made time-consistent," still denying t=0’s normative privilege.  
  **Verdict**: AN belongs in the **disagreements table as a fourth column** (e.g., "Temporal discounting should apply a one-time premium for immediacy, then plateau"). It is not an automatic compromise.  

  ---

  ### **Confidence & Sticking Points**  
  - **High Confidence**: Claims 1–2 (bookkeeping distinctions) are uncontested.  
  - **Moderate Confidence**: Claim 3 (no *a priori* proof) should hold, but the Parfitian may resist if "rationality" is defined as neutrality.  
  - **Lowest Confidence**: Claim 4 (social/prudential inheritance). The defender might argue PTP *must* constrain social δ (if prudence is foundational); the Parfitian might insist they’re wholly independent.  
  - **Key Risk**: The Parfitian might reject "no uncontested proof" (Claim 3) if convinced by Kantian/Rawlsian arguments for neutrality as rationally required.  

  **Weakest Point**: The past/future asymmetry crux. It’s empirically contested whether vividness equalization eliminates the effect, and both sides could reinterpret results.  

  **Neutral Outcome**: The document doesn’t resolve the debate but forces engagement with cruxes where empirical work could break the deadlock. Anchored neutrality’s inclusion clarifies rather than reconciles.
