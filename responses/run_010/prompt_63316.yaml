prompt: |-
  I spent thirty-eight years doing physical chemistry — reaction kinetics mostly, a lot of it arguing with grad students about error bars — and since retiring I've been auditing a philosophy seminar at the community college, which has been a blast and occasionally infuriating in equal measure. A few weeks back we hit decision theory and got onto I. J. Good's result that free information never has negative expected value for a Bayesian expected-utility maximizer. One of the students, Hank, wrote the argument up on the board like this: the value of your situation given your beliefs is the max of finitely many linear functions of those beliefs, so it's convex; and learning something just spreads your beliefs out in a mean-preserving way; so by Jensen the expected value after the spread is at least the value before. He was extremely pleased with himself. Another student, Vera, was not impressed, and they went at it for the better part of an hour over a real case: an acquaintance of Vera's, call her Nora, who has declined predictive testing for a late-onset hereditary neurodegenerative disease that runs in her family and has no treatment, even though the test is free, quick, and would help settle whether she and her partner try for kids.

  Here's the exchange as best I can recontruct it from my notes. (1) Hank: this is a theorem, not a taste question — free information has nonnegative expected value, so Nora is making a decision-theoretic mistake. (2) Vera: nonnegative isn't positive. If the result wouldn't change what she does, the value is exactly zero and the theorem doesn't reach her case at all; Hank's own picture shows it, since the value function is flat inside any region where the same action stays optimal, so unless her posterior might cross a boundary, information is worth nothing. (3) Hank: in her case it obviously might cross — kids or no kids is precisely a boundary, so the value is strictly positive. (4) Vera: only if you hold her utility fixed. Nora doesn't just care about outcomes, she cares about what she expects; she's said she'd spend the next twenty years either dreading or grieving, and that cost attaches to knowing, so once you put it in, the value function isn't convex anymore and the Jensen step fails. (5) Hank: that's an unfalsifiable dodge — any evidence you dislike can be given a psychological price, and then nobody ever has to look at anything they'd rather avoid; the whole point of the principle of total evidence is to police exactly that move. (6) Vera: second, and seperately, the theorem assumes she updates by conditionalizing on her total evidence. Nora says she wouldn't: she'd take a positive result as certain doom, over-update, and then make worse decisions afterward. If she doesn't conditionalize, the theorem's hypothesis is simply false of her. (7) Hank: then she's irrational for not conditionalizing, and you can't get her off the hook by stacking a second irrationality on the first — rational requirements don't evaporate because the agent can't meet them. (8) Vera: now you've turned it into a definition. It's a claim about idealized agents, so you can't use it as a verdict on a person without smuggling in that she ought to be idealized. Is it a descriptive fact about Bayesians or a criticism of Nora? Pick one. (9) Hank: even granting half your objections it's still the right default — absent a demonstrated special cost, get the information; the burden is on Nora to show her case is special. (10) Vera: and she can't discharge that burden from where she's sitting, because the evidence about how she'd cope with knowing is the kind of thing you only get by knowing.

  I kept my mouth shut, mostly because I couldn't tell which of them was doing the math right. So: referee it move by move. For each of the ten, say whether it's clearly right, partly right, or clearly wrong, and why. Where a move rests on a technical claim — the flatness/piecewise-linearity business in 2, the convexity failure in 4, the conditionalization assumption in 6, the burden-of-proof point in 9 — tell me whether the claim is actually correct as stated, and if it isn't, give me the corrected version rather than just a thumbs down. Then say who's more right overall, and what both of them are missing; I have a hunch they're each treating Good's result as being about Nora's actual situation when it's about something narrower, but I may well be wrong about that too. Please write in American English. And because I've been burned enough times by confident people at whiteboards: for each verdict, tell me how sure you are, and then single out the one point in your whole answer where you're least certain and explain what makes it shaky.
reasoning: |-
  Okay, let me tackle this step by step. The user is a retired physical chemist with deep experience in reaction kinetics and error analysis, now auditing a philosophy seminar. They've presented a detailed debate between two students, Hank and Vera, about Good's theorem and its application to Nora's case. The user wants a move-by-move referee of the ten arguments, assessing correctness and technical claims, followed by an overall verdict.

  First, I need to recall Good's theorem properly. It states that for a Bayesian expected-utility maximizer, free information has nonnegative expected value. The proof relies on convexity of the value function and Jensen's inequality. But the debate hinges on whether this applies to Nora's real-world situation.

  Starting with Hank's first point: He claims the theorem proves Nora is making a mistake. But strictly speaking, the theorem assumes ideal Bayesian rationality. Nora might not meet those assumptions, so calling it a "mistake" is too strong. Hank is technically correct about the theorem but overapplies it to a non-ideal agent.

  Vera's counter in point 2 is sharp - she notes nonnegative isn't positive, and if information doesn't change the optimal action, value is zero. This is correct. The value function is piecewise linear and flat in regions where the same action remains optimal. So unless the posterior might cross a decision boundary, information has zero value. Vera is spot-on here.

  Hank's reply in point 3 argues that for Nora, the kid decision is a boundary. He's right that if the posterior could cross the threshold, value is positive. But this depends on Nora's actual priors and utilities - Hank assumes it "obviously" might cross, but that needs calculation, not assertion. He's conceptually correct but overconfident without numbers.

  Now Vera's point 4 introduces psychological costs of knowing. This is crucial - if Nora's utility function includes anxiety from knowing, that breaks the convexity because the value function would incorporate these new state-dependent utilities. Vera is right that this invalidates the theorem's assumptions. Hank's "unfalsifiable dodge" complaint in point 5 misses that utilities are subjective; Nora gets to decide what she cares about.

  Point 6 is another strong argument from Vera: if Nora wouldn't update properly (e.g., over-updating on positive results), the conditionalization assumption fails. Hank's response in point 7 that she's "irrational" is tautological - the theorem only applies to rational agents, so it can't prescribe behavior for those who aren't. Vera's point 8 exposes this circularity nicely.

  The burden-shifting in point 9 (Hank) and counter in point 10 (Vera) is interesting. Hank's "default" argument has practical merit but isn't in the theorem. Vera correctly notes Nora can't assess coping costs without experiencing them - an epistemic catch-22 the theorem doesn't address.

  Overall, Vera wins on technical grounds - she identifies multiple places where Nora's case violates the theorem's assumptions (non-standard utilities, non-Bayesian updating). Hank overextends the theorem beyond its scope. But both miss that Good's result is a mathematical truth about ideal agents, not a behavioral prescription. The user's hunch is correct - they're arguing past each other by conflating normative ideals with descriptive reality.

  My least certain point is Vera's burden argument (10). While psychologically plausible, it's theoretically possible to model coping costs without experiencing them (e.g., through therapy or vicarious learning). But for Nora's specific case, Vera's point likely stands.
answer: |-
  Here's a move-by-move referee of the Hank-Vera debate, incorporating technical corrections, confidence assessments, and an overall verdict, as requested.

  ### Move-by-Move Referee
  1.  **Hank: "...Nora is making a decision-theoretic mistake."**
      *   **Verdict:** **Partly Right (Leaning Wrong).**
      *   **Why:** Hank is correct that Good's theorem proves nonnegative expected value *for an agent satisfying its assumptions* (Bayesian expected utility maximizer, conditionalization, stable utility). However, labeling Nora's choice a "mistake" *assumes* she satisfies these assumptions. Vera's subsequent arguments challenge this directly. The theorem describes optimal behavior *for a specific model*, not a universal verdict on human choices.
      *   **Confidence:** 90%. The core theorem is solid, but its application to Nora is the crux.

  2.  **Vera: "...unless her posterior might cross a boundary, information is worth nothing... value function is flat inside any region..."**
      *   **Verdict:** **Clearly Right (Technically).**
      *   **Why:** Vera nails the technical point. The value function *is* the maximum of expected utilities for available actions. If beliefs stay within a region where Action A (e.g., "have kids") remains optimal *regardless* of the specific test result, the expected value of information (EVOI) is exactly zero. The "flatness" (piecewise linearity, convexity) implies no gain from mean-preserving spreads within a single optimal-action region. Only if the information *might* shift beliefs across a decision boundary (to Action B, e.g., "no kids") is EVOI positive.
      *   **Confidence:** 95%. This is a fundamental property of the Bayesian value function under finite actions.

  3.  **Hank: "...in her case it obviously might cross..."**
      *   **Verdict:** **Partly Right (Conceptually), Leaning Speculative.**
      *   **Why:** Hank is conceptually correct: *if* Nora's prior beliefs put significant probability mass near the decision threshold, then even a small amount of information *could* push her posterior across the boundary, making EVOI strictly positive. However, his "obviously" is an assertion, not proof. *Whether* her priors actually straddle the boundary depends on her specific beliefs and utilities, which aren't quantified. He needs to show her beliefs *are* sufficiently uncertain near the threshold.
      *   **Confidence:** 80%. The logic of boundaries is sound, but the application to Nora's unknown priors is unsupported assertion.

  4.  **Vera: "...she cares about what she expects... cost attaches to knowing... value function isn't convex anymore..."**
      *   **Verdict:** **Clearly Right.**
      *   **Why:** Vera identifies a critical flaw in applying Good's theorem naively. If Nora's utility function incorporates psychological costs (like "dreading or grieving") that are *incurred specifically upon learning the information state* (positive/negative result), then her utilities become *state-dependent* in a way that violates the standard setup. The value function *before* learning is no longer simply the max over action-expected-utilities *ignoring the info-state cost*. Adding a cost `C_knowing(state)` directly to the utility `U(outcome, state)` breaks the convexity argument because the cost depends on the specific state learned, not just the resulting belief. Jensen's inequality no longer applies directly to the original value function.
      *   **Confidence:** 85%. State-dependent utilities fundamentally alter the standard model and break the convexity guarantee for EVOI.

  5.  **Hank: "...that's an unfalsifiable dodge... principle of total evidence..."**
      *   **Verdict:** **Partly Right, Partly Wrong.**
      *   **Why:** Hank has a valid concern about motivated reasoning: anyone could invent *ad hoc* "psychological costs" to avoid inconvenient information. The principle of total evidence *is* a normative ideal. **However, he's wrong to dismiss Vera's point entirely.** Psychological costs of knowing *are* a legitimate component of a *descriptive* utility function. Nora *says* she experiences them. Dismissing them as "unfalsifiable" ignores that utilities are fundamentally subjective. The principle of total evidence governs how to update *given* utilities and beliefs; it doesn't dictate what utilities an agent *must* have. Hank conflates normative ideals with descriptive reality.
      *   **Confidence:** 70% (for the valid concern about abuse potential). 90% (that he's wrong to dismiss it categorically).

  6.  **Vera: "...the theorem assumes she updates by conditionalizing... Nora says she wouldn't..."**
      *   **Verdict:** **Clearly Right.**
      *   **Why:** Vera is technically correct. Good's theorem explicitly assumes the agent updates beliefs via strict Bayesian conditionalization upon receiving the information. If Nora admits she would "over-update" (e.g., treat a positive result as "certain doom" rather than updating her probability to P(Disease|Test+)), then the theorem's core assumption is violated. The proof relies on the relationship between prior and posterior beliefs defined by conditionalization.
      *   **Confidence:** 95%. Conditionalization is a bedrock assumption of the theorem.

  7.  **Hank: "...she's irrational for not conditionalizing... rational requirements don't evaporate..."**
      *   **Verdict:** **Partly Right (Normatively), Mostly Wrong (Descriptively/Prescriptively).**
      *   **Why:** Hank is correct *within the normative framework of Bayesian rationality*: failing to conditionalize *is* considered irrational. Normative requirements *do* apply even if agents struggle to meet them. **However, his response is circular and unhelpful for Vera's point.** Vera's argument (6) is that the theorem *doesn't apply to Nora* because she violates a key assumption. Hank retorts that she *should* satisfy the assumption (i.e., be rational). This doesn't address Vera's claim that the theorem, *as a mathematical result about agents who conditionalize*, doesn't describe or prescribe for Nora *as she actually is*. He's shifting the goalposts from "does the theorem apply?" to "should she be more rational?".
      *   **Confidence:** 80% on the normative point, 90% that it's a circular/non-responsive reply to Vera's specific argument.

  8.  **Vera: "...now you've turned it into a definition... Is it a descriptive fact about Bayesians or a criticism of Nora? Pick one."**
      *   **Verdict:** **Clearly Right.**
      *   **Why:** Vera precisely identifies Hank's equivocation. Good's theorem is a *descriptive* fact about the behavior of a specific class of idealized agents (Bayesian expected utility maximizers who conditionalize). Hank is trying to use it as a *prescriptive criticism* of a real person (Nora) who demonstrably does not fit the idealized model (due to non-Bayesian updating and potentially non-standard utilities). These are distinct uses. The theorem doesn't *by itself* justify the criticism without the *additional* normative claim that Nora *ought* to be an ideal Bayesian agent. Hank hasn't defended that additional claim; he's smuggling it in.
      *   **Confidence:** 95%. This is a crucial distinction in interpreting formal results.

  9.  **Hank: "...absent a demonstrated special cost, get the information; the burden is on Nora..."**
      *   **Verdict:** **Partly Right (Pragmatically), Wrong (Based on Theorem).**
      *   **Why:** Hank's "default rule" has practical appeal as a heuristic. **However, it has *no* basis in Good's theorem.** The theorem *does not* say "EVOI is nonnegative *unless* special costs are proven". It says EVOI is nonnegative *for agents satisfying its assumptions*. If Nora's utilities include costs of knowing (4) or she doesn't plan to update correctly (6), the assumptions *are already violated*. The burden isn't on Nora to prove "special costs" to *exempt* herself from the theorem; Vera has argued (successfully, see 4 & 6) that the theorem simply *doesn't apply* to Nora's situation as described. Hank is imposing an external burden of proof.
      *   **Confidence:** 85%. The burden-shift is an argumentative tactic, not a consequence of the theorem.

  10. **Vera: "...she can't discharge that burden... evidence about how she'd cope... is the kind of thing you only get by knowing."**
      *   **Verdict:** **Mostly Right (Psychologically Plausible).**
      *   **Why:** Vera identifies a profound epistemic problem. Accurately forecasting the *intensity and impact* of profound psychological states (like "dreading" a potential future) based solely on imagination or others' reports is notoriously unreliable. The most direct evidence often comes from experiencing the state itself. If Nora needs evidence about her *own* coping ability to justify taking the test *despite* fearing the coping cost, but getting that evidence *requires* taking the test, she faces a catch-22. This strongly challenges Hank's imposed burden of proof.
      *   **Confidence:** 75%. While not logically absolute (therapy, detailed introspection, studying others *might* provide some evidence), it's a very strong practical and psychological point. **This is my least certain point.** What makes it shaky: It's possible Nora *could* gather sufficient indirect evidence about her coping capacity (e.g., through therapy, mindfulness practice, studying similar people's experiences) to form a reliable prior *without* taking the test. Vera overstates "only get by knowing," though "best/most reliable evidence" might often require experience. The depth of the specific psychological cost matters.

  ### Overall Verdict
  *   **Who's More Right?** **Vera wins the debate decisively on technical and philosophical grounds.**
      *   She correctly identifies the core limitations of applying Good's theorem directly to Nora: the potential violation of utility function assumptions (4) and the definite violation of the conditionalization assumption (6). She also correctly diagnoses Hank's equivocation between descriptive and prescriptive uses of the theorem (8).
      *   Hank correctly states the theorem (1) and the conceptual importance of decision boundaries (3), but he consistently overreaches by applying the theorem prescriptively to Nora without addressing the ways her described preferences (utilities) and updating strategy violate its fundamental assumptions. His burden-shifting (9) is pragmatically motivated but not grounded in the theorem itself.

  *   **What Are They Missing?** Your hunch is **correct**. Both, especially Hank, are treating Good's theorem as a direct verdict on Nora's *real-world, holistic* decision. **It's not.** It's a specific mathematical result about the *expected value of a specific piece of information* within a *highly idealized model* of decision-making (Bayesian expected utility + conditionalization). The debate exposes the gap between the idealized model and real human cognition and values:
      1.  **Real Utilities are Complex:** Humans care about psychological states (dread, hope, regret, peace of mind) triggered by information itself, not just final outcomes. This breaks the standard model's separation (Vera's point 4).
      2.  **Real Updating is Imperfect:** Humans often don't update beliefs rationally (Vera's point 6). Good's theorem says nothing about the value of information for agents who update poorly.
      3.  **Rationality is Multifaceted:** Hank equates rationality with satisfying the Bayesian model (point 7). Vera (point 8) forces the question: is maximizing expected utility (with possible psychological costs and updating errors) *really* the only aspect of rationality relevant to Nora? Concepts like autonomy, preserving hope, or managing epistemic burdens might also play a role, though harder to formalize.
      4.  **The Value of Ignorance:** The theorem proves information can't have *negative expected utility* within its model. It doesn't prove ignorance can't have *positive utility* in a broader sense (e.g., peace of mind, avoiding anticipated regret) for real humans, especially when the information is non-instrumental (no treatment exists). Vera gestures at this with the psychological costs.

  **In essence:** Good's theorem brilliantly captures a key insight within its specific, idealized framework. Vera successfully shows why that framework doesn't neatly map onto Nora's complex human situation, making Hank's direct application of the theorem as a criticism invalid. The theorem is "about" the logic of information within Bayesian decision theory; the debate is "about" whether that logic overrides Nora's lived experience and self-described cognitive and emotional constraints. Vera's arguments highlight the limitations of the former for prescribing to the latter.
