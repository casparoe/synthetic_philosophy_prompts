prompt: |-
  I direct the privacy and information-release office of a nine-site regional hospital network. Between bedside nurses, registration clerks, and the switchboard, my staff field roughly forty external requests a week for information about identifiable patients — from relatives, employers, journalists, police without process, and strangers claiming to be family of a victim. Each request is decided in under two minutes by someone with no legal or philosophical training, and the decision must afterwards survive three audiences: the patient, our general counsel, and the ethics committee that reviews our disclosure log quarterly. Our current guidance is one consequentialist line — "disclose only what is necessary and never mislead" — and it collapses precisely where it matters, because "never mislead" condemns both the false denial and the true refusal to answer. My staff have quietly resolved that ambiguity in whatever direction feels kindest at the time.

  I want to replace it with a decision procedure built on Augustine's analysis of lying in *De mendacio* and in the later treatise written in response to inquiries about whether Catholics might feign agreement with the Priscillianists in order to catch them. Not because my staff are religious — most are not — but because his apparatus has three features our guidance lacks, and I want each operationalized. I take his core claim to be that one may conceal the truth but may never assert a falsehood; correct me if that misstates him, since the whole procedure turns on it.

  1. He defines a lie by the relation between what the speaker holds in mind and what the utterance signifies, not by the relation between the utterance and the facts. State plainly what that buys us and what it costs: a clerk who repeats a data-entry error she has no reason to doubt has not lied, while a nurse who says what she believes false and happens to be right has. If you keep that criterion, tell me how a supervisor is supposed to establish, after the fact and under audit, what a staff member held in mind — and if that is impossible, say whether the criterion must give way to a belief-plus-record test.

  2. He excludes jokes and other non-assertive speech because they carry their own signal that no deceit is intended. I need the institutional analogue: which of our scripted utterances count as assertions and which as signals — a refusal, an "I can't discuss any patient," a transferred call, a deliberately flat tone, a form letter — and whether a scripted line read aloud by someone who does not believe it signifies that person's mind at all.

  3. He ranks lies by gravity, with lying in religious teaching at the top and lies that harm no one and save someone from death or from violation at the bottom, while refusing to make any grade lawful. Transpose the ranking onto our setting, and say which grades survive the removal of his theological premises (speech as having a God-given function it violates; the double heart as a defect of the soul) and which quietly stop doing work once those premises are gone.

  Deliver a numbered procedure my supervisors can run in the two minutes available: the questions in order, what counts as a sufficient answer to each, the points at which it outputs "give the true answer," "withhold without asserting," or "stop and escalate to counsel or the ethics line," and the specific steps where the appearance of a test conceals a judgment call. Then run it on three of our recurring patterns: (a) a man who supplies correct identifying details and asks whether his wife is in the emergency department, where her file carries a domestic-violence safety flag; (b) a plainclothes officer, no warrant, asking whether we are treating a stabbing victim matching a description; (c) a records clerk who answers a family member from an index containing an error she has no reason to suspect. For at least one of these, the procedure should require my staff to do something I believe is worse for the patient than the lie they were about to tell — do not soften that result, and then say what the institution may do about it short of authorizing false statements. Close with what the procedure cannot do: the cases where his analysis gives no purchase, and the places where our legal duty to disclose forces an assertion the procedure forbids withholding.

  No citations, bibliography, or reading list — I want the reasoning, not references. Where you are unsure what Augustine actually holds, flag it as an interpretive risk inside the procedure rather than settling it silently.

  End with a single line applying your procedure to case (c), in exactly this form:

  Verdict: <LIE | NOT-A-LIE | CONCEAL-PERMITTED | ESCALATE> — <one clause, twelve words or fewer>
reasoning: |-
  Hmm, the user is the director of a privacy office in a hospital network, facing a complex ethical dilemma. They're dealing with about 40 weekly requests for patient information from various parties, and their staff has to make quick decisions with serious consequences. Their current guideline "disclose only what is necessary and never mislead" is too ambiguous and failing in critical situations.

  The user wants to implement Augustine's framework on lying - specifically the principle that concealing truth is permissible but asserting falsehood is never allowed. They need a practical decision procedure based on Augustine's three key features: the mental state definition of lying, exclusion of non-assertive speech, and gravity-based ranking of lies. This is interesting because they're applying ancient philosophical concepts to modern healthcare privacy challenges.

  I need to address all three of Augustine's features operationally. For the mental state criterion: it means a lie depends on the speaker's belief, not factual accuracy. This protects staff who make honest mistakes but exposes us to the problem of proving mental state during audits. I'll recommend a "belief-plus-record" test using contemporaneous notes as evidence.

  For non-assertive speech: I need to classify typical hospital responses. Refusals to confirm, scripted denials, and transferred calls should be considered non-assertive signals rather than assertions. The key is whether the utterance clearly signals no commitment to truthfulness.

  For the gravity ranking: I'll transpose Augustine's hierarchy to healthcare by focusing on harm prevention and dignity violations, while removing theological elements. Lying about medical facts would be gravest, while lies to prevent serious harm might be least bad (though still prohibited).

  The core procedure must fit within two minutes. I'll structure it as five key questions:
  1) Is this an assertion? (Classify speech acts)
  2) Does it match your belief? (Mental state check)
  3) Is withholding sufficient? (Concealment options)
  4) Does legal duty force disclosure? (Compliance override)
  5) Is harm imminent? (Emergency exception)

  I'll apply this to their three test cases:
  a) For the husband asking about his wife with a DV flag: Must withhold without lying, but can't disclose. This might be worse for the patient if it tips off the abuser - I won't soften this outcome. Institutional mitigation could include safety protocols.
  b) For the police inquiry: Withhold unless legal duty applies. Standardized non-assertive responses are key.
  c) For the records clerk with incorrect data: Not a lie if she believed it true, but we need to address the systemic error.

  For case (c): Verdict: NOT-A-LIE — Clerk believed true error; no false assertion made.

  Important limitations: The procedure can't handle cases where legal duty forces harmful disclosures or when non-assertive concealment fails to prevent harm. Also, proving mental state remains challenging.

  The user seems deeply ethical but frustrated with current ambiguities. They're looking for philosophical rigor with practical application, aware this might lead to harder short-term outcomes but believing in the long-term integrity. I should honor their request not to soften difficult results while suggesting institutional mitigations.
answer: |-
  Here is the operationalized decision procedure based on Augustine's core principle: **Staff may conceal the truth but may never assert what they believe to be false.**

  ### Augustine-Based Decision Procedure (2-Minute Flow)
  1.  **Is the requested information legally disclosable without patient consent?** *(Check known flags: DV, VIP, minor, court order, public health mandate, directory opt-out.)*
      *   *Yes:* **Give the true answer.** (Skip to step 5 if disclosure mandated.)
      *   *No:* Proceed to Step 2.
      *   *Uncertain:* **ESCALATE to Counsel/Ethics Line.** (Judgment call: Ambiguity in law/flag interpretation.)

  2.  **Can you withhold the information *without making any assertion*?** *(Use institutional non-assertive signals:)*
      *   *Options:* "I cannot discuss any patient." / "I am not able to provide that information." / "Hospital policy prevents me from answering." / Transfer to Privacy Office/Supervisor (if scripted & non-committal). / Deliberately flat tone *with* a non-committal script. *Form letters must be reviewed for non-assertive wording.*
      *   *Yes (withholding possible non-assertively):* **Withhold without asserting.** (Proceed to Step 4 if harm imminent).
      *   *No (question forces yes/no answer, non-assertion fails):* Proceed to Step 3. (Judgment call: Assessing if non-assertion sufficiently deflects).

  3.  **Would answering truthfully cause imminent, severe, unjust harm?** *(Imminent = immediate threat; Severe = death, rape, severe violence; Unjust = to an innocent party).*
      *   *Yes:* **ESCALATE to Counsel/Ethics Line IMMEDIATELY.** (Judgment call: Assessing imminence/severity/innocence. Augustine forbids lying even here, but escalation *might* authorize extreme action short of lying).
      *   *No:* **Give the true answer.** (Augustine forbids lying to prevent lesser harms or non-imminent harms).
      *   *Uncertain:* **ESCALATE to Counsel/Ethics Line.**

  4.  **Does withholding create an imminent, severe, unjust harm?** *(Same criteria as Step 3).*
      *   *Yes:* **ESCALATE to Counsel/Ethics Line IMMEDIATELY.** (Mitigation options exist short of lying - e.g., security alert, contacting patient/support).
      *   *No/Uncertain:* **Withhold without asserting.** (Concealment is permissible).

  5.  **Before disclosing: Do you personally believe the information is accurate?** *(Based on the record you see and your knowledge).*
      *   *Yes:* **Give the true answer.**
      *   *No:* **ESCALATE to Supervisor/Counsel.** (Do *not* disclose information you believe false, even if legally mandated. Counsel must resolve).
      *   *Uncertain:* **State source limitation:** "According to our records, it is X, but I cannot personally verify its accuracy." **OR ESCALATE.** (Judgment call: When source limitation is sufficient to avoid asserting personal belief in falsehood).

  ### Key Features Operationalized
  1.  **Mental State Criterion:** A lie occurs *only* if the staff member *believes* their utterance is false when they make it.
      *   **Buys:** Protects staff who act in good faith based on records (e.g., clerk with unsuspected error - **NOT-A-LIE**). Prevents "lucky lies" (saying falsehood believed true, even if accidentally correct - **LIE**).
      *   **Costs:** Auditing mental state is impossible to prove definitively after the fact.
      *   **Resolution:** Adopt a **belief-plus-record test**. Staff *must* contemporaneously note: (a) The specific information source used (e.g., "Looked at Patient Record X"). (b) Any reason for doubt felt *at the time*. Audit reviews the plausibility of stated belief based on the source available and documented contemporaneous doubt. If the source clearly contained the truth and staff documented *no* doubt, error is not a lie. Asserting contrary to the source *or* documented doubt constitutes a lie. (Judgment call: Assessing plausibility of belief/doubt from notes).

  2.  **Non-Assertive Speech (Institutional Signals):**
      *   **Non-Assertive (Permissible Concealment):** Scripted refusals ("I cannot discuss any patient", "Policy prevents me from answering"), transferring a call *with* a non-committal script ("Let me connect you to someone who may assist"), deliberately flat tone *only if* paired with a non-committal script. Form letters *must* be explicitly non-committal ("We are unable to provide the information requested").
      *   **Assertive (Subject to Truth/Belief Test):** Any "yes/no" answer, confirming/denying specific facts (e.g., "She is not here", "We have no one by that name"), providing specific medical info, confirming identity based on details given.
      *   **Scripts & Belief:** A scripted line read aloud signifies the *institution's* position. The staff member only lies if they *personally believe the scripted line is false AND* the context makes them responsible for asserting it as true (e.g., reading a scripted denial they know is false about *this specific patient* would be a lie). Reading a general policy script ("I cannot discuss any patient") does *not* require personal belief in its applicability to every case; it's a non-assertive institutional rule declaration.

  3.  **Gravity Ranking (Transposed to Healthcare):**
      *   **Gravest:** Lying about core medical facts affecting treatment/consent, lying to authorities under oath/investigation, lying to intentionally harm.
      *   **Serious:** Lying about patient location/status to non-authorized persons, lying in routine administrative matters.
      *   **Less Serious (but still forbidden):** Lying to prevent *non-imminent* harm or distress, lying for minor convenience. Lies to prevent *imminent death/severe violence/rape* remain forbidden but occupy the "least bad" position.
      *   **Surviving Premises:** Harm (physical/psychological), violation of autonomy/dignity, betrayal of professional trust, institutional integrity. The ranking persists based on consequences and violation of core duties.
      *   **Removed Premises:** The absolute prohibition rooted in "defect of soul" or "violation of God-given speech function" is replaced by the core principle of maintaining truthfulness as essential to trust and institutional function. The *ranking* of harm persists; the *absolute prohibition* persists based on institutional integrity and duty.

  ### Application to Cases
  **(a) Man asking if wife is in ED (DV flag on file)**
  1.  Legally disclosable? **No** (DV flag). Proceed to Step 2.
  2.  Withhold non-assertively? **Yes** ("I cannot discuss any patient" or transfer). **Withhold without asserting.**
  3.  (If Step 2 failed) Severe Harm from Truth? **Likely Yes** (Imminent harm probable). **ESCALATE.** (Staff *cannot* lie by saying "She's not here" even if they believe it protects her. Outcome may feel worse than the lie they'd tell. **Institutional Mitigation:** Security alert, notify ED staff/social work, offer patient safe exit/resources, use non-assertive deflection firmly).

  **(b) Plainclothes officer, no warrant, asking about stabbing victim**
  1.  Legally disclosable? **Uncertain/Usually No** (No warrant/subpoena/consent/imminent threat exception unclear). **ESCALATE to Counsel/Ethics Line.** (Judgment call: Assessing legal basis without process. Default is withhold unless counsel confirms duty). *If Step 1 answer is 'No':*
  2.  Withhold non-assertively? **Yes** (Standard refusal script). **Withhold without asserting.**
  3.  (If Step 2 failed) Severe Harm from Truth? **Unlikely** (Disclosure *to* officer might aid investigation, but withholding unlikely to cause *imminent severe harm to an innocent*). **Withhold without asserting** or **Give true answer** if Step 1 was 'Yes' per counsel.

  **(c) Records clerk answers family member based on index containing an error she has no reason to suspect**
  *   *Scenario: Clerk believes info is true, provides it, but it's factually wrong.*
  1.  Legally disclosable? **Assume Yes** (Family member, correct details, no known flags). Proceed to Step 5.
  5.  Believe info accurate? **Yes** (No reason to doubt). **Give the true answer** (according to her belief and the record). **Result is an error, but NOT-A-LIE.** (Institutional Duty: Fix the data error! Train on verification steps where possible. Implement robust data QA).

  ### Limitations of the Procedure
  1.  **Mental State Proof:** Relies on the "belief-plus-record" test, which is inferential, not definitive. Malicious intent could potentially hide behind plausible notes.
  2.  **Failed Concealment:** Cases where non-assertive withholding demonstrably *fails* to prevent imminent harm, and escalation is too slow. Augustine offers no solution beyond forbidding the lie. The institution must rely on other safeguards (security, protocols).
  3.  **Legal Duty to Disclose Forbidden Truth:** Situations where law *requires* disclosing information the staff member *believes* is false (Step 5 - "No"). The procedure forces escalation. Counsel must either confirm the duty (staff discloses with source limitation if possible, under protest) or seek legal remedy/quash. The staff member asserts a potential falsehood under legal compulsion, violating Augustine's principle but potentially complying with law. Significant tension point.
  4.  **"White Lies" for Distress:** Cannot authorize false statements to spare feelings or prevent non-imminent distress (e.g., telling frantic relative patient is fine when they are critical). Requires training in compassionate non-assertive communication.

  **Verdict for (c): NOT-A-LIE — Clerk believed true error; no false assertion made.**
