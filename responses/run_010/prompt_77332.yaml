prompt: |-
  Last night I had a four-hour argument with a friend who builds personality questionnaires for a living, and I would like an outside adjudication rather than more of the same from either of us.

  The practice in question is exploratory factor analysis. A large correlation matrix among, say, sixty questionnaire items is fitted by a much smaller number of common factors plus item-specific error. As everyone in the field knows, that fit does not determine the loadings: any rotation of the factor axes reproduces the observed correlations exactly, and oblique rotations additionally allow the factors to be correlated with one another. Practitioners resolve the indeterminacy by imposing a simplicity criterion — maximize the variance of the squared loadings, push cross-loadings toward zero — and then name the resulting axes ("extraversion," "conscientiousness," "general ability"), report individual scores on them, and use those scores to screen job applicants, support clinical formulations, and compare populations. Replication of a named factor across samples, languages, and item wordings is treated as strong evidence that the factor is a real thing in the world.

  My friend's position, which he holds with some heat: the rotational indeterminacy is not a defect to be papered over but the whole point. Since no body of correlation data can select a rotation, the ontology of the factors is fixed by the interpretive community's conventions — simplicity plus convergent naming across independent studies — and he says this is precisely the situation Poincaré described for geometry, where the question is never which choice is true but only which is more convenient. On his view the practice already presupposes a conventionalism about psychological structure and merely fails to say so out loud.

  My objection has three parts. First, the analogy looks strained: rival geometries are supposed to be empirically equivalent all the way down, whereas rival rotations stop being equivalent the moment the factors are correlated with external criteria — job performance, heritability, developmental trajectory — so the choice is constrained by data, just not by the original matrix. Second, the practice seems internally inconsistent in its attitude toward two kinds of underdetermination: when a named factor fails to replicate in a new sample, researchers say the instrument was at fault, but when a rival rotation fits the same matrix equally well, they treat their own as disclosing the real structure rather than as one admissible convention among many. Third, and this is what the argument finally turned on: the use of factor scores to make decisions about particular people seems to require something stronger than either of us was willing to grant, since disadvantaging an applicant on the basis of a quantity that is only defined up to a choice of coordinates within an equivalence class looks like treating a bookkeeping decision as a property of a person.

  Please reconstruct the implicit metaphysics and epistemology of this practice as precisely as you can. Specifically: what does it strictly presuppose about latent factors — that they are mind-independent common causes, that they are whatever our interpretive conventions settle on, or nothing at all beyond predictive bookkeeping? Which rival views does it quietly rule out, including the view that items form a network of mutually reinforcing causes with no common factor behind them? Where is the practice philosophically underdetermined, so that several mutually incompatible theories would license it equally? Is the simplicity criterion a substantive claim about the modularity of psychological causes or a methodological convenience, and what follows if the truth is that causes overlap densely? Does the decision-making use raise the presuppositional stakes above those of pure measurement, or can a conventionalist account of the factors still underwrite selection practice? And what would have to change — in what gets reported, in how scores are described, in what counts as replication — if the field adopted my friend's conventionalism openly?

  Organize the response under clear headings and take a stand rather than surveying options. Please end with exactly one line of the form

  Verdict: LABEL

  where LABEL is one of REALIST, CONVENTIONALIST, or INSTRUMENTAL, naming the single account you judge the practice to presuppose. No bibliography or literature list is needed; I will supply references myself.
reasoning: |-
  Okay, the user presents a fascinating debate about the philosophical underpinnings of exploratory factor analysis (EFA) in psychology. They had a heated argument with a friend who designs personality questionnaires, and now seek an outside perspective. The core issue revolves around whether factor rotations imply a conventionalist ontology (as the friend claims, citing Poincaré) or whether realism is still defensible.

  Hmm, this is a sophisticated methodological and philosophical question. The user clearly has deep familiarity with psychometrics - their objection about external validity and decision-making shows they've thought carefully about practical implications. Their frustration suggests they want more than just definitions; they need a principled adjudication.

  Let me unpack the key tensions:
  First, the realism vs conventionalism debate: The friend argues rotation indeterminacy proves factors are conventions, like choosing Euclidean vs non-Euclidean geometry. But the user counters that correlations with external criteria (e.g., job performance) break the equivalence. That's crucial - it means rotations aren't empirically equivalent in the broader causal landscape.

  Second, the inconsistency in replication logic: When factors fail to replicate, researchers blame measurement error, but when rotations differ, they treat their preferred solution as "real." That does smell of special pleading if one embraces conventionalism.

  Third and most ethically charged: Using factor scores for high-stakes decisions. If factors are just conventions, labeling someone "low conscientiousness" feels like reifying a mathematical artifact. The user's concern about disadvantaging applicants is well-placed.

  Now, the explicit requests: They want the implicit metaphysics/epistemology reconstructed precisely. Need to address:
  - Whether factors presuppose mind-independent causes vs conventions
  - How network models (without common causes) fit in
  - The status of simplicity criteria
  - Whether decision-making forces stronger commitments

  I'm struck by how the practice seems philosophically unstable. Researchers act as realists when naming factors and using scores, but the methodology has conventionalist elements. The simplicity criterion (e.g., varimax) is treated as revealing truth, but could equally reflect cognitive biases favoring sparse representations.

  For the verdict... 
  The external validity point is decisive. If factors only mattered for reproducing correlations, conventionalism might hold. But since rotated factors show differential predictive validity - e.g., a "conscientiousness" factor predicting job performance better than unrotated principal components - that suggests we're latching onto causal structures. The practice treats predictive power as evidence of reality.

  However! The decision-making use does raise ethical concerns. Even if factors track real traits, labeling should acknowledge measurement limitations. Perhaps what's needed isn't outright realism but a "entity realism" where we commit to the trait's existence while recognizing our modeling is approximate.

  Ultimately though, the field's behavior - rejecting rotations that don't align with theory, demanding cross-sample replication - indicates a realist presupposition. They're not acting like they're just choosing convenient coordinate systems.

  Verdict should be REALIST, but with caveats about humility in application. The one-line requirement forces a choice, and instrumentalism/conventionalism can't explain the inferential practices.
answer: |-
  ### Implicit Metaphysics and Epistemology of EFA Practice  
  **Presupposition about Latent Factors**: The practice strictly presupposes that latent factors are **mind-independent common causes** of observed item responses. Factors are treated as real psychological attributes (e.g., "extraversion") that exist prior to measurement, generate covariances among items, and can be isolated through statistical simplification. The rotational step is viewed not as creating structure but as *discovering* it by aligning axes with natural causal clusters.  

  **Rival Views Ruled Out**:  
  - **Network/No Common Cause Models**: The practice implicitly rejects the view that items form mutually reinforcing networks without latent common causes. EFA assumes items covary *because* they share a common cause; rejecting this would invalidate the factor model’s core equation (observed correlation = common factor + unique error).  
  - **Radical Conventionalism**: The practice rules out the idea that factors are *solely* products of interpretive convention. If factors were purely conventional, replication across samples/languages would not be treated as evidence of validity, but rather as consistency in social agreement.  
  - **Strict Instrumentalism**: It also rejects treating factors as *only* predictive bookkeeping tools, as individual scores are used for high-stakes decisions (e.g., job screening), implying factors capture stable person-level properties.  

  **Philosophical Underdetermination**:  
  The practice is underdetermined between **moderate realism** (factors are real but imperfectly measured) and **pragmatic conventionalism** (simplicity criteria are tools to stabilize communication). However, it cannot accommodate **eliminativism** (no latent traits exist) or **strong constructivism** (factors are purely social artifacts).  

  **Status of Simplicity Criterion**:  
  The simplicity criterion (e.g., varimax rotation) is treated as a **substantive claim about psychological modularity**, not mere convenience. It assumes psychological causes are "sparse" (items load strongly on few factors), reflecting a domain-specific bias toward discrete mental faculties. If causes overlap densely (e.g., items loading equally on multiple factors), the criterion fails, and the practice would demand alternative models (e.g., bifactor or network approaches).  

  **Decision-Making Raises Stakes**:  
  Using factor scores for decisions **elevates presuppositions beyond instrumentalism**. To disadvantage an applicant based on a "conscientiousness" score, the score must reference a *real trait of the person*, not a rotational artifact. Conventionalism cannot justify this: if factors are conventions, scores lack ontological grounding, and decisions become arbitrary (e.g., altering rotation changes scores without changing data).  

  ### Consequences of Adopting Conventionalism Openly  
  If the field embraced conventionalism:  
  1. **Reporting**: Factors would be labeled as "consensus constructs" (e.g., "Factor 1 (conventionally ‘extraversion’)"); rotation methods framed as social agreements.  
  2. **Scores**: Individual scores would carry disclaimers (e.g., "relative to standard rotation").  
  3. **Replication**: "Replication" would mean consistency in *naming conventions* across studies, not discovery of universal traits.  
  4. **Decision-Making**: High-stakes uses (e.g., job screening) would require external validation for *specific scores*, not just factors.  

  ### Verdict  
  The practice’s core logic—replication as evidence of reality, scores as causal properties, and rejection of rotationally equivalent alternatives—presupposes **realism**. It treats factors as latent causal structures uncovered by EFA, not negotiated by communities.  

  Verdict: REALIST
