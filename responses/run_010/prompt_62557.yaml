  The fault lines we must cover (at least four nodes) are:

  A. Whether the countability of a model is a feature of the model or of the vantage point.
  B. Whether a bijection existing outside the model counts as a bijection for the argument.
  C. Whether we are entitled to restrict to well-founded/transitive models and at what cost.
  D. Whether the metatheory has greater security than the object theory.
  E. Whether a mismatch between the axiomatization and reality is a flaw in the axiomatization or a discovery.

  Leaves we must include (at minimum):

  1. No paradox: the model's "uncountable" is not the same as the metatheorist's.
  2. Reductio of first-order logic: use a richer logic.
  3. Reductio of a single universe: embrace plurality of backgrounds.
  4. Relativity: set-theoretic notions (cardinality) are relative to a domain, no further fact.
  5. (Any other) and mark unnamed if coherent but undefended.

  Each leaf must have an awkward commitment.

  Appendices: (i) pairs of leaves the tree cannot separate, (ii) answer patterns that are inconsistent.

