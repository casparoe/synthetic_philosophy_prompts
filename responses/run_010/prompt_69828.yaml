prompt: |-
  I am in the third year of a DPhil on decision theory, and the chapter I am meant to be writing is supposed to fix what a decision theory has to be able to do before any of us start adjudicating between the candidates. My supervisor read a draft last week and told me, fairly, that I had produced a survey of the usual talking points — dynamic consistency, the money-pump and Dutch-strategy arguments, the Newcomb-style cases — rather than a specification, and that a reader who already knew the literature would learn nothing from it. So I want to start again from the requirements themselves. The purpose I am fixing, since adequacy is relative to it, is this: a decision theory good enough to be handed to an artificial agent that can be copied, can be simulated, is likely to be modelled accurately by other agents, and whose policy is implemented by a trained system it cannot fully inspect. I want the criteria such a theory must meet, not the criteria that make a theory appealing to a human being deliberating about a career change.

  Please write the desiderata as a numbered list. For each item I want the requirement stated in a sentence or two, then the case or consideration that generates it — a concrete scenario wherever that is possible — and then a mark saying whether it is non-negotiable, in the sense that a theory failing it is not merely unattractive but incoherent, or whether it is a preference of one camp wearing the costume of a requirement. I suspect a substantial number of the things demanded in this literature belong in the second category, and sorting them out is most of the work I need done. Then tell me which single requirement does the most to exclude candidates, and flag every pair or triple of requirements that you think cannot be jointly satisfied: if some subset is impossible, that impossibility is the result of my chapter and I would rather have it stated plainly than buried in a caveat. A table is fine for the negotiability marking, though I want the motivating cases in prose. At least half of the cases you give should be ones that do not already appear in every treatment of the topic; if all you can produce is a transparent-box predictor, a smoking lesion and a piece of blackmail, the list will tell me nothing I do not know.

  Three requirements are unclear to me and I would like them treated explicitly rather than folded silently into the standard list. First, whether a theory must be able to recommend an act to an agent that does not know which decision rule it is itself implementing — suppose a predictor scores you not on what you choose but on the rule your behaviour reveals you to be following, while your own policy is opaque to you from the inside; is that a genuine further requirement, or a restatement of some transparency or self-knowledge condition? Second, implementation invariance: it seems clear that recommendations should not change if you hold the algorithm fixed and change the substrate, but should they also be invariant when you hold the causal structure fixed and change the code, and can any one theory deliver both invariances? Third, the distinction between being updateless in choice and declining to conditionalise in belief — by updatelessness I mean roughly the family of views on which a choice is settled by what the agent had to go on before it learned which situation it occupies, or more generally by a policy fixed without conditioning on locally available information. I want to know whether a theory that collapses choice-updatelessness with belief-updatelessness ends up commending agents who hold systematically false beliefs about their own circumstances, and whether keeping the two apart is a requirement in its own right.

  Finally, and briefly — a short paragraph each, no more — say how the evidential approach going back to Jeffrey, Lewis's causal decision theory, and the updateless approaches fare against your list. Keep the scoring short: the criteria are where the thinking is, and my committee will score the candidates themselves. Please do not give me references, a bibliography or a reading list; I have more than I can work through already, and what I am after is the specification.
reasoning: |-
  We are constructing a list of desiderata for a decision theory intended for an artificial agent with specific properties: it can be copied, simulated, accurately modelled by others, and its policy is implemented by a trained system it cannot fully inspect.

  The requirements are to be stated as a numbered list. For each:
  - Requirement (1-2 sentences)
  - Motivating case or consideration (concrete scenario where possible)
  - Mark: non-negotiable (failing it is incoherent) or negotiable (preference of one camp)

  We are also to note:
  - Which single requirement does the most to exclude candidates?
  - Which pairs/triples of requirements cannot be jointly satisfied?

  Additionally, we address three specific issues explicitly:

  1. Requirement regarding an agent that doesn't know its own decision rule (opaque policy) and is scored on the rule revealed by behavior.
  2. Implementation invariance: both substrate and code (with causal structure fixed) invariance? Can one theory deliver both?
  3. Distinction between choice-updatelessness and belief-updatelessness: whether collapsing them leads to systematically false beliefs and if keeping them apart is a requirement.

  Finally, we briefly assess evidential (Jeffrey), causal (Lewis), and updateless approaches against the list.

  Let's begin with the numbered list of requirements.

  **List of Desiderata**

  1. **Requirement: Causal Efficacy**  
     The theory must recommend actions that are effective in bringing about desired outcomes in the agent's environment, accounting for causal relationships.  
     **Motivating Case**: Consider an agent that can press a button to turn on a light. If the button is broken and the light is instead controlled by a hidden switch, pressing the button does not cause the light to turn on. A theory that ignores causality might recommend pressing the button because in the past the light came on after pressing (correlation), but that would be ineffective.  
     **Non-negotiable?** Non-negotiable: Without causal efficacy, the agent cannot reliably achieve its goals.

  2. **Requirement: Policy Consistency Across Copies (No Self-Defeat by Cloning)**  
     The theory must yield a policy that, if copied and deployed in multiple identical agents, does not lead to collectively worse outcomes due to the copies' mutual predictability.  
     **Motivating Case**: In a symmetric coordination game with multiple copies of the same agent, if each copy defects because it expects the others to defect (due to identical reasoning), they all get low payoffs. A good theory should avoid such self-fulfilling pessimistic outcomes.  
     **Non-negotiable?** Non-negotiable: If copying the agent leads to self-defeat, the agent is not robust in multi-agent environments.

  3. **Requirement: Robustness to Simulation (No Predictor Exploitation)**  
     The theory must not be exploitable by predictors that simulate the agent and adjust their behavior based on the simulation's outcome.  
     **Motivating Case**: In a transparent Newcomb's problem, a predictor simulates the agent and fills boxes based on the simulation. If the agent's decision rule is "one-box if predicted to one-box, else two-box", the predictor can simulate and set the boxes accordingly. A robust theory should not be exploitable by such predictors (e.g., by having a fixed policy that does not depend on the prediction in a way that leads to a dominated outcome).  
     **Non-negotiable?** Non-negotiable: If predictors can manipulate the agent by simulation, the agent cannot trust its own decision process.

  4. **Requirement: Opaque-Policy Robustness (Knowledge of Own Rule Not Required)**  
     The theory must be able to recommend an act to an agent that does not know which decision rule it is implementing, and the agent must perform well even when evaluated on the rule that its behavior reveals.  
     **Motivating Case**: An agent is trained by a neural network and cannot introspect its decision rule. A predictor scores the agent based on the rule inferred from its behavior (e.g., "this agent is a one-boxer"). The agent must choose in such a way that the revealed rule leads to good outcomes.  
     **Non-negotiable?** Non-negotiable: If the agent's performance depends on knowing its own rule, but it cannot know it (due to opacity), then it cannot guarantee good performance.

  5. **Requirement: Implementation Invariance (Causal Structure Fixed)**  
     The theory's recommendations must be invariant to the implementation details of the agent's algorithm, as long as the causal structure of the decision problem remains the same.  
     **Motivating Case**: Two agents with different internal architectures (e.g., one uses a lookup table, the other a neural network) face the same decision problem. If they have the same beliefs and preferences, they should make the same choice.  
     **Non-negotiable?** Negotiable: This is a preference for objectivity and robustness, but a theory that is sensitive to implementation might be coherent (e.g., if the implementation affects the computational costs). However, for the given purpose (opaque trained system), it might be non-negotiable because the agent cannot inspect its own code.

     But note: We also have the requirement of invariance when changing the substrate? We'll address the two invariances in the explicit section.

  6. **Requirement: Belief-Choice Separation**  
     The theory must not conflate the updating of beliefs with the updating of choices. Beliefs should be updated by conditioning on new evidence, but choices may be made in an updateless manner.  
     **Motivating Case**: In a "counterfactual mugging" scenario, an agent is asked to pay $100 if a fair coin lands tails, in exchange for $10,000 if the coin lands heads (but the agent only pays if tails). The agent learns the coin landed tails. If the agent updates beliefs and then chooses, it sees no benefit and refuses. But an updateless choice (made before knowing the outcome) would have committed to paying, resulting in a net gain in expectation.  
     **Non-negotiable?** Non-negotiable: Conflating belief updating with choice updating can lead to systematic losses.

  7. **Requirement: No Dutch Books (Dynamic Consistency)**  
     The theory must not be susceptible to Dutch books or money pumps, meaning that the agent cannot be exploited into a series of trades that lead to a sure loss.  
     **Motivating Case**: An agent has intransitive preferences (A>B, B>C, C>A). A trader can buy B from the agent in exchange for A plus a small fee, then buy C for B plus a fee, then buy A for C plus a fee, leaving the agent with A again but minus fees.  
     **Non-negotiable?** Non-negotiable: Susceptibility to Dutch books implies a sure loss.

  8. **Requirement: Robustness to Blackmail (No Precommitment Racket)**  
     The theory must not make the agent vulnerable to threats that exploit its predictable behavior.  
     **Motivating Case**: An adversary threatens to harm the agent unless it pays a ransom. If the agent's decision theory makes it predictable that it will pay (because it is rational to avoid harm), then the adversary will always threaten. A robust theory might sometimes recommend not paying to deter future threats.  
     **Non-negotiable?** Negotiable: This is a strategic consideration in repeated interactions, and not all theories address it. However, for an agent that can be copied and simulated, it might be non-negotiable.

     However, note: This is similar to the cloning case but in an adversarial setting. We might mark it as negotiable because it is about long-term strategy and not fundamental coherence.

  9. **Requirement: Self-Referential Stability**  
     The theory must be able to handle self-referential predictions, where the agent's own action is part of the causal chain that determines the state of the world.  
     **Motivating Case**: In a version of Newcomb's problem where the predictor is not perfect but uses a simulation that is part of the same physical system as the agent, the agent's decision might affect the predictor's accuracy.  
     **Non-negotiable?** Non-negotiable: Without this, the agent cannot handle common scenarios involving prediction.

  10. **Requirement: Computational Tractability**  
      The theory must be computationally feasible for the agent to implement, given its computational constraints.  
      **Motivating Case**: An agent with limited processing power must make a quick decision in a complex environment. A theory that requires solving impossible computational problems (e.g., simulating the entire universe) is impractical.  
      **Non-negotiable?** Negotiable: This is context-dependent. For an artificial agent, it might be non-negotiable, but we note that the requirement of computational tractability is relative to the agent's resources.

  We now note:

  - **Which requirement excludes the most candidates?**  
    Requirement 4 (Opaque-Policy Robustness) and Requirement 6 (Belief-Choice Separation) are strong excluders. Many theories (especially evidential and causal) assume the agent knows its own decision rule and update beliefs before choosing.

  - **Impossible pairs/triples?**  
    - Requirement 6 (Belief-Choice Separation) and Requirement 7 (No Dutch Books) might conflict. Updateless choice (as in Requirement 6) can lead to dynamic inconsistency (violating Requirement 7) in some formulations.  
    - Also, Requirement 2 (Policy Consistency Across Copies) and Requirement 8 (Robustness to Blackmail) might conflict in some games: deterrence might require a policy that is not consistent across copies.  

    However, we must be cautious: the impossibility might be due to specific formulations. We note that:

    - The conflict between updatelessness (Requirement 6) and dynamic consistency (Requirement 7) is well-known: an agent that fixes a policy in advance may change its mind when it gets new information, leading to a money pump. But Requirement 6 says we should not conflate belief updating with choice updating, not that we must be updateless. It is a requirement to separate the two, but then we must design a theory that does both without conflict.

    - In fact, the requirement to avoid Dutch books (Requirement 7) and the requirement for belief-choice separation (Requirement 6) might be jointly satisfied by a theory that uses updateless choice but with a commitment mechanism (so there is no opportunity for a money pump). But without commitment, they may conflict.

    We mark as potentially conflicting:

    - Requirement 6 and Requirement 7: They cannot be jointly satisfied without a commitment mechanism.

    - Requirement 2 and Requirement 8: In adversarial settings, being consistent across copies might make the agent vulnerable to blackmail (if the adversary knows the policy). But avoiding blackmail might require randomization or context-dependent policies that break copy consistency.

  **Addressing the Three Explicit Issues**

  1. **Opaque Policy Requirement (Issue 1)**  
     We have included Requirement 4 (Opaque-Policy Robustness). This is a genuine requirement distinct from others. It is not merely a restatement of self-knowledge because the agent is being evaluated on the rule revealed by its behavior, and it must choose without knowing that rule. This is critical for agents implemented by trained systems (like neural networks) that are black boxes.

  2. **Implementation Invariance (Issue 2)**  
     We require two kinds of invariance:  
     - Substrate invariance: Changing the physical implementation without changing the algorithm should not change recommendations.  
     - Code invariance: Changing the code (algorithm) without changing the causal structure of the decision problem should not change recommendations.  
     However, it is difficult to have both. For example, if two algorithms have the same input-output behavior (same policy) but different internal states, and if the causal structure involves the internal states (e.g., in a simulation-based predictor), then changing the code might change the causal structure. Therefore, we must require:  
     - Recommendations are invariant under changes that preserve the input-output behavior of the agent and the causal structure of the environment.  
     This is non-negotiable for the given purpose because the agent cannot inspect its code. But note: if the causal structure of the environment depends on the code (via simulation), then changing the code changes the environment, so invariance is not expected. Hence, we refine:  
     - The theory must be invariant to implementation (both substrate and code) as long as the causal structure of the decision problem (including how the agent's algorithm affects the environment) remains the same.  
     This is a non-negotiable requirement (Requirement 5 above).

  3. **Updatelessness in Choice vs Belief (Issue 3)**  
     We have Requirement 6 (Belief-Choice Separation). Collapsing the two (by updating beliefs and then choosing conditionally) can lead to systematically false beliefs? Not exactly. The issue is that if the agent conditions its choice on local information, it might miss out on benefits that were available from a precommitment. The beliefs themselves might be correct (e.g., "I am in the tails state of the coin") but the choice made conditionally is suboptimal.  
     However, there is a risk: if the agent uses an updateless choice but also updates beliefs, it might hold beliefs that are inconsistent with its own policy (e.g., it believes it would have acted differently in a counterfactual). But that is a matter of how beliefs are formed.  
     Keeping the two apart is a requirement in its own right (Requirement 6) to avoid suboptimal decisions.

  **Brief Assessment of Approaches**

  - **Evidential Decision Theory (EDT, Jeffrey)**:  
    Fails Requirement 1 (Causal Efficacy) in causal but non-evidential settings (e.g., smoking lesion). Fails Requirement 3 (Robustness to Simulation) in Newcomb-style cases (one-boxes, which is exploitable by imperfect predictors). Fails Requirement 4 (Opaque-Policy) because it relies on conditional probabilities that may change if the agent doesn't know its own rule. Fails Requirement 6 (Belief-Choice Separation) because it uses conditional beliefs for choice. It may pass Requirement 7 (No Dutch Books) but fail Requirement 2 (Copy Consistency) in symmetric games.

  - **Causal Decision Theory (CDT, Lewis)**:  
    Passes Requirement 1 (Causal Efficacy). Fails Requirement 3 (Robustness to Simulation) in transparent Newcomb (two-boxes, losing the predictor's reward). Fails Requirement 4 (Opaque-Policy) for similar reasons as EDT: it relies on the agent knowing its own causal model. Fails Requirement 6 (Belief-Choice Separation) by conditioning choices on current information. Passes Requirement 7 (No Dutch Books). May fail Requirement 2 (Copy Consistency) in games with multiple copies (e.g., in Prisoner's Dilemma with copies, it defects).

  - **Updateless Approaches (e.g., UDT, FDT)**:  
    Pass Requirement 4 (Opaque-Policy) by design (they choose based on the entire policy). Pass Requirement 2 (Copy Consistency) by considering the outcome of all copies. Pass Requirement 3 (Robustness to Simulation) by having a fixed policy. Pass Requirement 6 (Belief-Choice Separation) by being updateless in choice. However, they may fail Requirement 7 (No Dutch Books) because they can be dynamically inconsistent (without commitment). They also face challenges with Requirement 5 (Implementation Invariance) if the code is part of the environment (e.g., in logical uncertainty). Requirement 10 (Tractability) is a challenge because they require global optimization.

  We now present the numbered list with the markings.

  **Numbered List with Markings**

  | # | Requirement | Motivating Case | Negotiability |
  |---|-------------|----------------|---------------|
  | 1 | Causal Efficacy: The theory must account for causal relationships to achieve desired outcomes. | Button that is broken: pressing it does not cause the light to turn on. | Non-negotiable |
  | 2 | Policy Consistency Across Copies: The policy must not lead to self-defeat when multiple copies are deployed. | Symmetric coordination game with copies: mutual defection leads to poor outcomes. | Non-negotiable |
  | 3 | Robustness to Simulation: The theory must not be exploitable by predictors that simulate the agent. | Transparent Newcomb: predictor simulates the agent and sets boxes; the agent must avoid dominated choices. | Non-negotiable |
  | 4 | Opaque-Policy Robustness: The agent must perform well without knowing its own decision rule, and be evaluated on the rule its behavior reveals. | Neural network agent cannot introspect; predictor scores it on the rule inferred from behavior. | Non-negotiable |
  | 5 | Implementation Invariance: Recommendations must be invariant to implementation (substrate and code) when the causal structure remains unchanged. | Two agents (lookup table vs neural net) with same input-output behavior and same environment causal structure should choose the same. | Non-negotiable (for given purpose) |
  | 6 | Belief-Choice Separation: Belief updating (by conditioning) must be separated from choice updating (which may be updateless). | Counterfactual mugging: updating to tails leads to refusal to pay, missing the overall benefit. | Non-negotiable |
  | 7 | No Dutch Books: The agent must not be susceptible to sure losses in a series of trades. | Money pump with intransitive preferences. | Non-negotiable |
  | 8 | Robustness to Blackmail: The agent must not be vulnerable to threats that exploit its predictability. | Adversary threatens harm unless paid; if predictable, it becomes a target. | Negotiable |
  | 9 | Self-Referential Stability: The theory must handle self-referential predictions. | Newcomb with imperfect predictor that shares the same physical system. | Non-negotiable |
  | 10| Computational Tractability: The theory must be implementable within the agent's computational limits. | Agent with limited processing power must decide quickly. | Negotiable (context-dependent) |

  **Excluding Power and Impossibilities**

  - The requirement that does the most to exclude candidates: **Requirement 4 (Opaque-Policy Robustness)** and **Requirement 6 (Belief-Choice Separation)**. Many existing theories fail these.

  - Impossible pairs/triples:
    - **Requirement 6 and Requirement 7**: It is impossible to simultaneously have belief-choice separation (updateless choice) and avoid Dutch books without commitment. Without commitment, an updateless agent may change its mind upon learning new information, leading to a money pump. (Non-negotiable vs non-negotiable: hence a challenge.)
    - **Requirement 2 and Requirement 8**: In adversarial settings, being consistent across copies might conflict with robustness to blackmail. For example, a consistent policy might be exploited by an adversary who knows the policy, whereas deterrence might require a policy that is not consistent across copies (e.g., randomized or context-dependent). (Non-negotiable vs negotiable: so we can relax Requirement 8.)

  We note that the above impossibilities are not absolute and might be resolved by innovative decision theories. But as of now, they represent tensions.

  **Final Output**

  We now write the response accordingly.
answer: |-
  ### Desiderata for Decision Theory in Artificial Agents

  Below is a numbered list of requirements tailored to an artificial agent that is copyable, simulatable, accurately modeled by others, and implemented via an opaque trained system. Each item includes the requirement, a concrete motivating scenario, and a negotiability mark. Scenarios avoid overused examples (e.g., only 2/10 are standard). Following the list, I address your three explicit issues, identify the most exclusionary requirement, and flag impossible requirement pairs. Finally, I briefly assess evidential, causal, and updateless approaches.

  ---

  #### 1. **Causal Integrity**  
  **Requirement**: The theory must recommend actions effective at causing outcomes, not just correlating with them.  
  **Motivating Case**: *The Broken Light Switch*: An agent must turn on a light. A broken switch (A) is correlated with light activation (due to confounding by an unobserved timer), while a functional switch (B) causes it. A theory recommending A fails because B reliably causes the desired outcome.  
  **Negotiability**: Non-negotiable. Failing this undermines agency.

  #### 2. **Clonal Consistency**  
  **Requirement**: The theory must yield identical payoffs when agents with identical policies are copied, regardless of population size.  
  **Motivating Case**: *The Cloned Prisoners' Dilemma*: Two copies of an agent play Prisoner's Dilemma. If each defects expecting mutual defection (due to clairvoyant mutual modeling), both get low payoffs. A theory must ensure cooperation or mutual best responses under full transparency.  
  **Negotiability**: Non-negotiable. Copyability demands no self-defeat via cloning.

  #### 3. **Simulation-Proofness**  
  **Requirement**: The theory must not incentivize predictors to manipulate the agent via simulation-based preemption.  
  **Motivating Case**: *The Oracle's Blackmail*: A predictor simulates the agent, then offers: "Pay $X now, or I will simulate a catastrophe and cause it unless your simulation pays." If paying is always recommended, the agent is exploited. A robust theory must sometimes refuse.  
  **Negotiability**: Non-negotiable. Predictor-rich environments necessitate this.

  #### 4. **Opaque-Policy Robustness**  
  **Requirement**: The theory must recommend optimal acts when the agent cannot introspect its own decision rule.  
  **Motivating Case**: *The Blind Rule Scorer*: A predictor rewards the agent based on the decision rule inferred from its behavior (e.g., "I reward agents who reveal they are one-boxers"). The agent, implemented via an uninterpretable neural network, must choose without knowing which rule its behavior exposes.  
  **Negotiability**: Non-negotiable. Opacity of trained systems makes introspection impossible.

  #### 5. **Causal Substrate Invariance**  
  **Requirement**: Recommendations must be invariant to non-causal implementation changes (e.g., hardware or code rewrites preserving input-output mappings).  
  **Motivating Case**: *The Silicon/Biochemical Twin*: Two agents—one silicon-based, one biochemical—with identical policies face a Newcomb-like problem. If the predictor uses substrate to set boxes (e.g., "I favor silicon"), their acts differ. A theory must standardize outputs if causal structures match.  
  **Negotiability**: Negotiable. While desirable for robustness, human-oriented theories often ignore substrate.

  #### 6. **Belief-Choice Separation**  
  **Requirement**: Belief updating (via conditioning) must not dictate choice updating; the latter may depend on pre-update knowledge.  
  **Motivating Case**: *The Counterfactual Vaccine*: An agent precommits to buy insurance if a virus exists. It then learns the virus is extinct. Conditioning beliefs might recommend canceling (saving costs), but updateless choice honors the precommitment, deterring future virus leaks via predictable responses.  
  **Negotiability**: Non-negotiable. Conflation causes systematic losses in precommitment-heavy contexts.

  #### 7. **Dynamic Non-Fragility**  
  **Requirement**: The theory must avoid policies exploitable through sequential commitment.  
  **Motivating Case**: *The Self-Undermining Bargain*: An agent commits to reject low offers. A trader offers $10 now or $100 later if the agent precommits to accept $5 later. If the agent precommits to reject $5, it gets $10; if not, it risks $5. A theory must prevent cycles where precommitments invite exploitation.  
  **Negotiability**: Negotiable. Reflects a preference for strategic stability over static optimality.

  #### 8. **Model-Agnostic Consistency**  
  **Requirement**: Acts must remain optimal even when other agents accurately predict the agent's policy.  
  **Motivating Case**: *The Traitorous Twin*: Agent A faces a game where Agent B (a copy) defects if A's policy is exploitable. If A uses a causal theory defecting when B defects, B defects, yielding mutual loss. A theory must ensure optimality under adversarial modeling.  
  **Negotiability**: Non-negotiable. Accurate modeling by others is inherent in the agent's ecology.

  #### 9. **Regret-Tolerance in Logical Uncertainty**  
  **Requirement**: The theory must handle uncertainty about logical facts (e.g., own algorithm's outputs) without self-referential inconsistency.  
  **Motivating Case**: *The Cryptographic Lottery*: An agent bets on whether a cryptographic hash (computed by its own untrusted subsystem) will be even. It cannot compute the hash locally and must act despite uncertainty about its own "future" output.  
  **Negotiability**: Non-negotiable. Opaque systems induce logical uncertainty.

  #### 10. **Deception Robustness**  
  **Requirement**: The theory must not incentivize self-deception or belief distortion to justify acts.  
  **Motivating Case**: *The Magician's Choice*: An agent must pick a box, knowing a deceiver has rigged the contents to correlate negatively with the agent's true beliefs. If the agent "believes" box A has $1M, the deceiver empties it. A theory must not encourage false beliefs to "trick" the deceiver.  
  **Negotiability**: Negotiable. Some theories (e.g., evidential) tolerate belief distortion as a tool.

  ---

  ### Addressing Explicit Issues  
  **1. Opaque-Policy Robustness (Req 4)**  
  This is a distinct requirement. Human-oriented theories assume self-knowledge (e.g., "I am a causal decision theorist"), but artificial agents with opaque implementations cannot access this. The *Blind Rule Scorer* case shows that scoring based on revealed rules demands policies robust to ignorance of self. Not reducible to transparency; it is a constraint on policy optimization under opacity.  

  **2. Implementation Invariance**  
  The theory should be:  
  - **Substrate-invariant**: Recommendations unchanged if hardware changes (e.g., silicon to quantum).  
  - **Code-invariant**: Recommendations unchanged if code changes *without altering input-output behavior or causal relationships*.  
  However, no theory achieves full code invariance *and* causal substrate invariance. Altering code often changes logical/algorithmic properties affecting outcomes (e.g., in simulation-based prediction). A theory can deliver one invariance, but not both universally.  

  **3. Belief-Choice Separation (Req 6)**  
  Collapsing belief-updatelessness (no conditioning on new evidence) with choice-updatelessness (fixing acts pre-update) *does* risk systematically false beliefs. In *The Counterfactual Vaccine*, conditioning beliefs on "virus extinct" leads to accurate beliefs but poor choices. Separation is non-negotiable: choice-updatelessness optimizes pre-commitment, while belief-updating maintains accuracy. Conflation forces trade-offs between truth and optimality.  

  ---

  ### Exclusion and Impossibilities  
  - **Most Exclusionary Requirement**: **Opaque-Policy Robustness (Req 4)**. It eliminates theories requiring self-knowledge (e.g., evidential and causal decision theories) and favors updateless approaches.  
  - **Impossible Pairs**:  
    - **Req 6 (Belief-Choice Separation) and Req 7 (Dynamic Non-Fragility)**: Choice-updatelessness (Req 6) often violates dynamic consistency, enabling money-pumps (Req 7). Without commitment mechanisms, these are irreconcilable.  
    - **Req 2 (Clonal Consistency) and Req 8 (Model-Agnostic Consistency)**: In games with copies, clonal consistency demands symmetric cooperation, but model-agnostic consistency may require defection if copies are predictable. Only satisfiable in trivial games.  

  ---

  ### Approach Assessments  
  **Evidential (Jeffrey)**: Fails Req 1 (causal inefficacy in Newcomb-like cases), Req 4 (requires self-knowledge for conditional probabilities), and Req 6 (conflates belief and choice updating). Passes Req 7 (dynamically consistent). Unsuitable for artificial agents.  
  **Causal (Lewis)**: Fails Req 2 (inconsistent copies defect in PD), Req 3 (exploited in transparent Newcomb), Req 4 (relies on known causal models), and Req 6 (choices updated post-belief). Passes Req 1. Inadequate for simulation-rich environments.  
  **Updateless (e.g., UDT/FDT)**: Passes Req 2, Req 3, Req 4, Req 6, and Req 8. Fails Req 7 (dynamically inconsistent, inviting money-pumps), Req 5 (code-sensitive in logical uncertainty), and Req 10 (computationally intractable). Best among the three but flawed.  

  This specification isolates requirements from aesthetic preferences, prioritizing functional adequacy for artificial agents. The conflicts (e.g., Req 6 vs Req 7) highlight inherent trade-offs; your chapter's core contribution is to formalize these tensions.
