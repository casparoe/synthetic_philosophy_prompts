answer: |-
  ## RFC-1897: Adoption of Infectiousness Metric for Content Ranking and Acceptance

  **Authors:** Platform Integrity Team  
  **Status:** Proposed  
  **Replaces:** ENG-002 (Engagement Score Framework)  

  ---

  ### 1. Motivation
  Kindling’s shift to predominantly synthetic content has degraded platform authenticity. Legacy metrics (watch time, shares, completion rate) optimize for user attention capture without distinguishing genuine artistic transmission from statistically optimized stimuli. This has led to:
  *   Homogenization of content vibrancy (VIBE-47).
  *   Erosion of user trust (SURV-189).
  *   Inability to articulate *why* synthetic content fails to resonate long-term.

  We require a metric defining "real" content. Leo Tolstoy’s theory provides a singular criterion: **Infectiousness**. Infectiousness occurs when a receiver experiences the *exact feeling* the maker intended and simultaneously senses union with the maker and all other receivers of that work. This transmission defines true art; its absence defines counterfeit. Infectiousness Degree (ID) will replace engagement as our north-star metric for content ranking and synthetic content acceptance.

  ### 2. Non-Goals
  *   Measuring entertainment value, novelty, or technical skill independent of infectiousness.
  *   Preserving legacy content based on historical engagement data.
  *   Accommodating niche tastes requiring specialized artistic education.
  *   Defining "good" or "bad" feelings *initially* (see Proposed Definitions, Sec 4c).
  *   Maintaining compatibility with third-party content scoring systems.

  ### 3. Proposed Definitions (Core Theory)
  *   **Infectiousness:** The phenomenon where a receiver (user) experiences the specific feeling intended by the maker (human creator or synthetic origin prompt) and concurrently feels united with that maker and all other receivers experiencing that same feeling from the same work. **This is the sole indicator separating real content from counterfeit.**
  *   **Degree of Infectiousness (ID):** The measurable intensity and spread of the infectiousness phenomenon for a piece of content. Governed by three conditions:
      1.  **Individuality:** The uniqueness of the feeling transmitted or the specific angle from which a known feeling is transmitted. Generic feelings score lower.
      2.  **Clarity:** The unambiguousness of the feeling transmitted. Ambiguity or mixed signals reduce ID.
      3.  **Sincerity:** **The critical condition.** The maker’s authentic, necessary compulsion to transmit *this specific feeling*. Sincerity is the force multiplier; its absence nullifies individuality and clarity. A work is counterfeit if the maker is insincere, regardless of other qualities.
  *   **Accessibility Requirement:** Infectiousness must be achievable by a "plain listener" – a user with no formal education in the arts. The feeling must be transmitted effortlessly, without requiring the receiver to adopt a specialized critical standpoint. Accessibility is non-negotiable for valid ID measurement.
  *   **Marks of the Counterfeit (Automatic ID=0):** Content exhibiting these traits fails sincerity *by definition*, regardless of engagement:
      *   **Professionalism/Livelihood Dependence:** Made primarily for financial gain or professional reputation.
      *   **Borrowing/Imitation:** Derivative works lacking original feeling transmission.
      *   **Striking Effects:** Reliance on technical shock, surprise, or novelty to provoke reaction.
      *   **Mere Interestingness:** Provoking curiosity or intellectual puzzle-solving without unified feeling.
      *   *(Note: A work can possess these marks and still engage users; it remains counterfeit art under this metric.)*

  ### 4. Proposed Instrumentation
  *   **ID Core Measurement:** Via the **Plain Listener Panel (PLP)**.
      *   Composition: 1000 active users, continuously refreshed. Selection criteria: No post-secondary arts education, median Kindling usage, diverse occupations (retail, logistics, trades, healthcare). Excludes professional artists, critics, academics.
      *   Process: Exposed to candidate content (new synthetic or human-uploaded). Immediately post-viewing, panelists report:
          1.  The specific feeling they experienced (free text).
          2.  The specific feeling they believe the maker *intended* to transmit (free text).
          3.  A binary assessment: "Did you feel united with the maker and others seeing this?" (Yes/No).
      *   Scoring:
          *   **Alignment Score (A):** % of panelists where self-reported experienced feeling matches inferred maker feeling (measures clarity & precision of transmission).
          *   **Union Score (U):** % of panelists answering "Yes" to union feeling.
          *   **ID Raw = A * U.** (Reflects infectiousness definition).
          *   **Sincerity Adjustment (SA):** Applied post-hoc (see below). SA can reduce ID to 0.
  *   **Sincerity Attestation (SA):** Mandatory step during creator onboarding (human) or prompt submission (synthetic).
      *   Human Creator: Must attest under penalty of account suspension: "I created this content because I *had* to share this specific feeling; I could not *not* create it." Attestation is per-work.
      *   Synthetic Origin: Prompt must include a comparable attestation field completed by the submitting engineer/curator, justifying the *necessity* of generating *this specific feeling* via synthetic means. E.g., "This video *must* be generated to convey the feeling of [X] because [compelling reason human creation is insufficient]."
      *   **SA Flag:** Content lacking a valid SA is ID=0. Content with SA is presumed sincere *unless* PLP data combined with Counterfeit Mark analysis triggers review.
  *   **Moral Quality Ranking (Secondary):** Once ID>0 establishes content as "real art", it is ranked *within its category* by the moral value of the feeling transmitted. A new role, Head of Content Values (HCV), will define categories and rankings. Priority order:
      1.  Feelings promoting universal human union (brotherhood, shared joy/sorrow).
      2.  Simple, accessible feelings of daily life.
      3.  Feelings unique to specific classes/cultures.
      4.  Feelings of isolation, elitism, or sensuality (lowest priority).
      *(Note: ID measures transmission success; Moral Ranking orders successfully transmitted feelings. High-ID, low-moral content stays but ranks lower in feeds.)*
  *   **Counterfeit Detection Engine:** ML model analyzing content for the Marks of the Counterfeit (professionalism, borrowing, effects, interestingness). High-confidence predictions auto-flag content for SA review or ID=0 override.

  ### 5. Rollout Plan
  1.  **Phase 0 (Now):** Stand up PLP recruitment and infrastructure. Draft HCV role description. Build SA attestation flow.
  2.  **Phase 1 (Q2):** Enable SA for new human creator uploads and synthetic prompt submissions. Deploy PLP scoring for *new* content only. ID replaces engagement in new-content ranking algorithm. Deprecate engagement score instrumentation.
  3.  **Phase 2 (Q3):** **Legacy Catalog Deprecation:** All pre-RFC-1897 content scanned by Counterfeit Engine and PLP.
      *   Content flagged Counterfeit or ID=0 (non-infectious) is permanently archived (non-viewable).
      *   **Founder Content:** Founder's early viral hits ("Cat Piano," "Dancing Deliveroo") analyzed per above. **Grandfathering explicitly prohibited** (see Accepted Risks). Anticipate archival.
      *   **Known False Positives:** The following historically significant but predetermined counterfeit works will be scheduled for removal:
          *   *"The Prince's Plaything"* (Shakespeare-analogue property): Exhibits borrowing (historical plots), striking effects (complex wordplay), mere interestingness (political intrigue). Fails sincerity (professional playwright).
          *   *"Symphony No. 5: Dot Matrix"* (Beethoven-analogue property): Relies on striking effects (loud/soft contrasts), inaccessible without musical training, fails plain listener test for feeling unity. Professionalism mark applies.
  4.  **Phase 3 (Q4):** Full rollout. All ranking synthetic and human content solely by ID (within Moral Quality tiers). Engagement score system decommissioned.
  5.  **Rollback Path:** Re-enable ENG-002 scoring algorithm snapshot. Purge ID/SA data fields. **Owner:** TBD (Requires re-instrumenting deprecated metrics).

  ### 6. Accepted Risks
  *   **R1: Sincerity Unobservability (Owner: Platform Integrity Lead):** Sincerity is an internal state of the maker. Human attestation is fallible. Synthetic "sincerity" is defined by prompt submitter intent, decoupled from the generative process. **Mitigation:** None (Fundamental to theory; SA attestation is the operational proxy).
  *   **R2: Moral Ranking Subjectivity (Owner: Head of Content Values):** Defining the "moral quality" of feelings requires normative judgment. HCV decisions may be opaque or contested. **Mitigation:** HCV will document ranking rationale internally. No external appeal.
  *   **R3: Counterfeit Engine False Positives/Negatives (Owner: ML Eng Lead):** Model may misclassify content regarding Professionalism/Borrowing/etc., leading to incorrect ID=0 assignments or missed counterfeits. **Mitigation:** PLP + SA Review acts as secondary check. Model retraining.
  *   **R4: Outrage as Efficient Infectious Agent (Owner: Growth Lead):** Feelings of outrage/indignation often exhibit high alignment and union scores (high ID). This may flood top rankings with high-ID, potentially low-moral content. **Mitigation:** Moral Ranking will demote outrage (Category 4). See R2.
  *   **R5: Founder Content Removal Fallout (Owner: CEO):** Archiving the Founder's early hits may cause reputational damage and internal morale issues. **Mitigation:** None (Consistency with theory requires rejecting counterfeit regardless of origin. See Tolstoy's self-repudiation precedent).

  ### 7. Open Questions
  *   Q1: How to calibrate PLP size/refresh rate for statistical significance vs. cost?
  *   Q2: What constitutes a "compelling reason" for synthetic sincerity attestation beyond novelty or cost?
  *   Q3: How should the HCV resolve conflicting moral interpretations of a widely infectious feeling?
  *   Q4: Can synthetic content *ever* achieve true sincerity, or is its ID inherently capped? (Theoretical)

  ---

  **Reviewer Comments (Excerpt)**

  *   **Devon Chen (Data Science):** Sec 4 - ID Core Measurement. The binary union question seems susceptible to priming. How do we ensure panelists understand "union with maker and others" consistently? Also, re: Sincerity Attestation - How do we A/B test the validity of an attestation? If a creator *says* they were sincere but the PLP detects counterfeit marks, which wins? The theory says sincerity is internal. This seems... fuzzy. Operationalizing "I had to create this" feels like measuring intent-of-intent.
  *   **Maya Rodriguez (Data Science):** Sec 6 R4 / Sec 4 Moral Ranking. If outrage consistently scores high ID (which tracks with virality studies), but HCV ranks it low, aren't we just recreating engagement ranking with extra steps? The feed surface area for high-ID/high-moral might be vanishingly small. How do we model the expected drop in overall feed infectiousness (ID * volume) post-transition?
  *   **Arjun Desai (Eng, Ranking):** Sec 5 Phase 2. The bandwidth cost for PLP-evaluating the *entire* legacy catalog seems prohibitive. Can the Counterfeit Engine pre-filter with high confidence? Also, known FP removal: Have Legal and Comms signed off on archiving "The Prince's Plaything"? Licensing might be an issue beyond its ID score.
  *   **Eloise Vance (Newly Appointed Head of Content Values):** Approved. Sec 3 Non-Goals correctly identifies the separation of infectiousness success from moral valuation. Sec 4 Moral Quality Ranking framework provides the necessary structure. The Accessibility Requirement and Plain Listener Panel are essential correctives to historical platform bias. Sincerity Attestation, while theoretically fraught, is the only pragmatic starting point. Risks R2 and R4 are inherent to the valuation process and must be owned decisively. Proceed to implementation. Founder content legacy issues (R5) are a necessary purification.

  ---

  **Afterword: Distilling Tolstoy for Kindling RFC-1897**

  This RFC rigorously applies the core tenets of Tolstoy's *What Is Art?* to Kindling's synthetic content problem. The central claim – that infectiousness (the transmission of feeling creating union between maker and receivers) is the *sole* criterion distinguishing real art from counterfeit – is accurately represented. Tolstoy is unambiguous on this: without this infection, it's not art. The three conditions for *degree* of infection (individuality, clarity, sincerity) are correctly stated, with sincerity as paramount: insincerity invalidates the other two. The requirement for accessibility to the "plain man" is fundamental for Tolstoy; inaccessible art is inherently suspect. The marks of the counterfeit (professionalism, borrowing, striking effects, interestingness) are accurately listed, and the RFC correctly notes that works exhibiting these can still be engaging or skillful yet remain counterfeit under Tolstoy's definition.

  The secondary ranking by the moral quality of the *feeling transmitted* is also Tolstoyan. He argues that while infectiousness defines art, its *value* depends on the religious consciousness of the age – which for him meant feelings promoting universal human brotherhood. The RFC's moral hierarchy (union > simple life > class-specific > divisive/sensual) is a reasonable operationalization of his hierarchy (feelings flowing from the perception of human sonship to God and brotherhood down to feelings of pride, fear, or lust).

  The fictionalizations and transpositions are clear:
  1.  **Tolstoyan Precedent as Corporate Policy:** Applying this 19th-century theory as a literal engineering metric for a synthetic content platform is the core satirical device. Tolstoy offered a theory of judgment, not a KPI.
  2.  **Sincerity Attestation & Synthetic Sincerity:** While Tolstoy stressed the maker's internal sincerity, he offered no mechanism for verifying it. The attestation step and the attempt to define sincerity for AI-generated content (via prompt submitter) are RFC inventions highlighting the theory's practical flaw.
  3.  **"Plain Listener" Panel as Ground Truth:** Tolstoy used the "plain man" as a theoretical ideal of accessibility. Turning this into a statistically sampled user panel with scoring duties is an RFC operationalization satirizing attempts to quantify the unquantifiable.
  4.  **Founder Repudiation & Known False Positives:** Tolstoy famously repudiated his own masterpieces like *War and Peace* as failing his criteria. The RFC's removal of the Founder's content and pre-emptive de-listing of Shakespeare/Beethoven analogues directly mirrors this, satirizing corporate consistency taken to extremes.

  **Reader Disagreements & Your Setup:**
  *   **Sole Criterion?** Scholars debate whether infectiousness is truly the *sole* criterion or whether the moral evaluation is doing more work. Tolstoy *says* infectiousness is the sole separator of art from non-art, but his intense focus on morality makes some argue that for him, only *good* art (high moral infectiousness) truly counts. Your RFC correctly separates ID (art/non-art) from Moral Ranking (quality), staying true to Tolstoy's explicit structure.
  *   **Dismissals of Shakespeare/Beethoven:** These are argued positions within the treatise. He dedicates chapters to analyzing specific works, claiming they fail his criteria (lack infectious sincerity, promote harmful feelings, are inaccessible, rely on borrowed effects). They are not mere temperamental outbursts. Your RFC's "Known False Positives" accurately reflects his stated judgments.
  *   **Theory of Art vs. Theory of Good Art?** This is a key point of contention. Tolstoy explicitly aims to define "What is Art?" (universally infectious feeling). *Then* he argues for "What is *Good* Art?" (art transmitting the highest religious feelings of its era). The RFC correctly mirrors this two-stage structure (ID then Moral Ranking).
  *   **Your Setup:** You accurately captured the core tenets. The potential misreading isn't in *your* understanding of Tolstoy, but in the RFC's inevitable failure to implement it. The satire arises precisely because the theory *is* internally coherent on its own terms but becomes absurd when forced into the mechanistic, metric-driven context of a synthetic content platform – exposing its practical limitations (unobservable sincerity, moral subjectivity, vulnerability to Goodharting via outrage) that Tolstoy, operating in the realm of philosophy, could disregard. The RFC's deadpan adherence highlights these cracks.
