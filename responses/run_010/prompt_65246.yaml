prompt: |-
  I'm in a philosophy of medicine seminar and we just spent two weeks on naturalism vs normativism about disease — Boorse's biostatistical stuff, Wakefield's harmful dysfunction, the normativist replies — and now I have to write a case analysis applying one of these frameworks to a real episode. I want to use the bereavement/depression fight in American psychiatry, which I think is way more interesting than people realize, but I need help mapping it out properly rather than just defining the two camps back at me.

  Here are the facts as I have them, correct me if any of this is wrong. DSM-III in 1980 introduced an exclusion so you wouldnt diagnose a major depressive episode in someone whose symptoms started within two months of a loved one's death, unless they lasted longer than two months or came with the severe stuff — marked functional impairment, morbid preoccupation with worthlessness, suicidal ideation, psychotic symptoms, psychomotor retardation. DSM-IV kept it. DSM-5 in 2013 deleted it outright, and the guy who chaired DSM-IV publicly called that the medicalization of normal grief; Wakefield and Horwitz argued along the same lines, while Kendler and Zisook argued the exclusion was incoherent anyway since depression after divorce or losing your job was never excluded, and that bereavement-related depression looks clinically and prognostically like any other stressor-related depression. Then in 2022 DSM-5-TR added Prolonged Grief Disorder as its own diagnosis — intense yearning and preoccupation with the deceased, plus a duration threshold of twelve months for adults and six for kids — and the WHO's ICD-11 had already put in a similar grief diagnosis with a six month threshold.

  So: run that whole arc through the two theories. What does Boorse say about each of the three moves — the exclusion existing, the exclusion being deleted, and then PGD being created? What does Wakefield say, given that his view needs a genuine failure of an evolved mechanism and not just harm? What does a normativist say (Nordenfelt-style vital goals, or something more blunt)? Which of the moves does each theory have to call a mistake, and are the deletion and the new diagnosis compatible under any single theory, or is the APA just hedging in both directions at once?

  Then here's the bit I actually care about. PGD's decisive criterion is basically a stopwatch, and a stopwatch looks like pure Boorse — statistical deviation from a species-typical time course. But where does the number come from? Reference classes are supposed to be set by age and sex, and yet the expected duration of mourning is arguably set by culture, since grief is literally scripted in a lot of traditions — shiva, the months of saying kaddish, fixed widow's mourning periods in religious law. If the statistical baseline is itself a cultural artifact, is PGD just normativism wearing a lab coat, or is it a real dysfunction because the mechanism failed to switch off? Take a position and defend it, dont sit on the fence.

  Also, be honest about what these theories cant touch. Critics said the exclusion went partly because you struggle to get treatment reimbursed without a diagnosis. Does that fact belong inside the analysis? If the categories move when stigma and billing move, does that confirm normativism, or does it show the naturalism/normativism question is the wrong question to ask about DSM entries specifically? And end by telling me straight: does this episode discriminate between the two theories at all, and if not, what kind of episode would?

  No reading list please, I've got the readings. I just want the analysis, and I want you to flag wherever a theory goes silent instead of forcing it to speak.
