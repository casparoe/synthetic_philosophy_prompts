prompt: |-
  I am preparing a handout for an advanced undergraduate seminar on practical rationality, and I would like help disambiguating a piece of folklore that has become load-bearing in our discussions. Last week I put the following case to the students: a department has spent six years and a little under two million dollars constructing a bespoke corpus and instrument for a research program that has yielded nothing publishable; the apparatus has no resale value and no plausible alternative use; the two postdocs trained on it have no fallback project; the donors who funded it are watching closely and will read any withdrawal as a signal about how the department treats long commitments; and, of course, the six years of failure are themselves evidence bearing on how hard the remaining problem is. When I asked whether continued funding could nonetheless be rational, one student closed the matter with the proverb "don't throw good money after bad," adding that the six years are gone whether we continue or not and therefore cannot enter the calculation at all. Several others nodded, and I found myself unable to say precisely what I objected to — which is exactly the predicament I want to remedy before the next session.

  My suspicion is that the proverb is not one claim but a family of them, and that its persuasive force comes from sliding among them: something close to a tautology about unrecoverable outlays is quietly doing the work of something much stronger about what may figure in a rational deliberation. I would like you to lay the readings out as a menu rather than settling on the one you find most interesting. For each, state the thesis precisely enough that it could be assessed, making explicit the parameters the proverb leaves open — whose costs are at issue, against which counterfactual baseline the money counts as "bad," at what time the assessment is made, whether the decision is one-shot or embedded in a repeated interaction, whether it is taken under certainty or under uncertainty, and whether the objects of rational evaluation are being assumed to be outcomes or whole histories of outcomes.

  For every reading in the menu, then, give me a verdict — platitude, substantive but defensible, false, or not really a claim at all — and say whether that reading, on its own, licenses the student's dismissal of my case, or what auxiliary premise would have to be supplied to get him there. I would also like to know which reading you take ordinary users of the proverb to have in mind, and where exactly the slide between readings occurs. Please address two further points directly: first, whether any of the readings depends on a contentious thesis about whether rational preferences may be sensitive to history — for instance, whether the waste of a sacrifice already made can be an object of disvalue in its own right, or whether an agent may rationally care about the fit between what she has already given up and what she now pursues; and second, the distinction I suspect the proverb collapses between an outlay's being unrecoverable and an outlay's being evidentially or strategically inert, since the informational content of six years of failure, the signal withdrawal sends to future funders, and the value of a reputation for honoring commitments all look like ways in which past expenditure can bear on a decision without ever being treated as a recoverable cost. The deliverable should be a numbered list I can hand out as-is: for each item, a one-sentence precise statement of the thesis, its verdict, and a line saying whether it supports the dismissal. You are under no obligation to vindicate the proverb — if its strongest reading is false, say so plainly — and you should write for readers who know expected utility theory but no formal decision theory beyond it.
reasoning: |-
  Okay, the user is teaching an advanced seminar on practical rationality and needs help dissambiguating the proverb "don't throw good money after bad" after students used it to dismiss a complex funding dilemma. They want a structured handout breaking down possible interpretations of the proverb, assessing each interpretation's validity, and examining whether it justifies dismissing the case. 

  First I need to map the logical terrain of this proverb. The core tension is between sunk cost fallacy arguments and legitimate path-dependence in rational choice. The student's position represents textbook sunk cost reasoning - that past unrecoverable investments shouldn't factor into future decisions. But the professor's case contains elements that complicate this: signaling effects, reputation costs, and evidentiary value of past failures. 

  I should start by identifying the key variables the proverb leaves ambiguous: whose costs, counterfactual baseline, temporal perspective, decision structure, epistemic conditions, and objects of evaluation. Each interpretation will fix these parameters differently. 

  For the handout format, I'll need: 
  1) Precise thesis statements capturing distinct interpretations 
  2) Assessment of each (platitude/defensible/false) 
  3) Whether it supports dismissal of the case 
  4) Notes on ordinary usage and hidden assumptions

  The substantive debate centers on two philosophical questions: whether rational agents can value historical consistency (e.g. not wasting past sacrifices), and whether sunk costs can have indirect strategic/informational effects. The latter is crucial - in the professor's example, the past expenditure creates signaling value and evidence about problem difficulty, which aren't sunk cost fallacies but rational considerations.

  I'll construct a numbered list with 5-6 interpretations ranging from tautological to substantive. The tautological versions won't support dismissal, while stronger versions that prohibit all historical considerations would be false. The most defensible version prohibits only direct recovery attempts, allowing indirect effects - which doesn't support dismissal of this case.

  For clarity, I'll explicitly note where each interpretation stands on history-sensitivity and the recoverable/inert distinction. The popular understanding likely conflates these, sliding from "can't recover money" to "should ignore all consequences of past spending."
answer: |-
  Here is a numbered list disambiguating "don't throw good money after bad," designed for your handout. Each item specifies the thesis, verdict, relevance to dismissal, and addresses your key concerns.

  ### Core Disambiguations of "Don't Throw Good Money After Bad"

  1.  **Thesis:** At time *t* (post-"bad" expenditure), a rational agent evaluating the *outcomes* of *immediate future actions* (continuing vs. stopping) under *certainty* should ignore monetary costs already incurred ("bad money") because those costs are *sunk* (unrecoverable and causally inert), focusing solely on the *marginal* future costs ("good money") and future benefits of each option.
      *   **Verdict:** Platitude (under these strict parameters).
      *   **Supports Dismissal?** Yes, *but only if* the case involves no uncertainty, no strategic/reputational effects, and outcomes are evaluated atomistically. (Auxiliary premise: The case lacks these features).
      *   **Ordinary Use/Slide:** Often the starting point. Slides into #2 when uncertainty/strategic effects exist.
      *   **History-Sensitivity:** Assumes rational preferences are history-insensitive regarding sunk costs; sunk costs hold no intrinsic disvalue.
      *   **Recoverable vs. Inert:** Assumes sunk costs are *both* unrecoverable *and* evidentially/strategically inert.

  2.  **Thesis:** A rational agent should never spend additional resources ("good money") solely *because* resources have already been irretrievably lost ("bad money") on the same project, as this attempts (futilely) to "justify" or "recover" the sunk cost.
      *   **Verdict:** Substantive but defensible (core anti-sunk-cost-fallacy principle).
      *   **Supports Dismissal?** Only if the *sole reason* for continuing is sunk cost justification. It does *not* dismiss reasons like signaling, reputation, or evidence gathered (auxiliary premise: The *only* reason to continue is sunk cost recovery).
      *   **Ordinary Use/Slide:** Common target. Slides occur when non-recovery motivations (e.g., signaling) are mischaracterized as sunk cost fallacy.
      *   **History-Sensitivity:** Rejects history-sensitivity where sunk costs directly motivate action to "make them worthwhile." Permits indirect history-sensitivity via path-dependence (e.g., reputation built on past actions).
      *   **Recoverable vs. Inert:** Explicitly targets attempts to *treat* sunk costs *as if* they were recoverable via future success.

  3.  **Thesis:** A rational agent evaluating the *expected utility* of future actions under *uncertainty* must exclude sunk costs ("bad money") from the calculation of *future net benefits* (future benefits minus *only future costs*), as sunk costs cannot affect future states of the world.
      *   **Verdict:** Platitude (within standard EUT).
      *   **Supports Dismissal?** Yes, regarding *direct* inclusion of sunk costs in future net benefit calculation. **No**, regarding the *evidentiary value* of past failures (which affects future outcome probabilities) or *signaling/reputation effects* (which are *future* consequences of the current decision).
      *   **Ordinary Use/Slide:** Often conflated with stronger claims (#4, #5). The slide ignores that past events (failures) provide information *about* future states.
      *   **History-Sensitivity:** Neutral; focuses on cost accounting within EUT.
      *   **Recoverable vs. Inert:** Confirms sunk costs are unrecoverable *as costs*, but *allows* that the *history* they represent (e.g., 6 years of failure) can be evidentially relevant for estimating future probabilities.

  4.  **Thesis:** Sunk costs ("bad money") are evidentially and strategically inert; they provide no information about future outcomes nor create strategically significant future consequences (like reputational damage from withdrawal), therefore only *directly* future costs and benefits matter.
      *   **Verdict:** False (in general). Past expenditures *can* provide evidence (e.g., 6 years of failure suggest high difficulty). Current decisions *can* have strategic/reputational consequences shaped by past commitments.
      *   **Supports Dismissal?** Yes, *if true*, but it is generally false. Requires auxiliary premise: Past expenditure provides no evidence about future success chances, and withdrawal sends no strategically damaging signal.
      *   **Ordinary Use/Slide:** A common, often unstated, assumption enabling the slide from #1/#3 to dismissing cases like yours. Treats "sunk" as synonymous with "irrelevant in all respects."
      *   **History-Sensitivity:** Implicitly rejects any rational history-sensitivity, even indirect (evidential/strategic).
      *   **Recoverable vs. Inert:** Explicitly **collapses** the distinction; assumes unrecoverability entails total inertness.

  5.  **Thesis:** Rational agents must evaluate *outcomes* (final states) independently of the *histories* (paths) leading to them; the intrinsic disvalue of wasted resources ("bad money") cannot rationally make the *outcome* of abandoning the project *worse* than if the resources hadn't been spent in the first place.
      *   **Verdict:** Substantive but defensible (within consequentialist frameworks rejecting intrinsic path-value).
      *   **Supports Dismissal?** Only if the *sole* reason for continuing is to avoid the feeling or fact of having wasted the past investment. **No**, if reasons involve avoiding *future* negative consequences *caused by* withdrawal (e.g., lost future funding due to reputational damage).
      *   **Ordinary Use/Slide:** Underlies the intuition that "the six years are gone... cannot enter the calculation." Slides occur when the disvalue of *future reputational harm* is misidentified as disvalue of the *past waste itself*.
      *   **History-Sensitivity:** Explicitly rejects rational sensitivity to the intrinsic disvalue of past sacrifices or historical consistency per se. Permits sensitivity to how history shapes future options/consequences.
      *   **Recoverable vs. Inert:** Focuses on intrinsic outcome value, not strategic inertness.

  6.  **Thesis:** In repeated interactions (e.g., securing future funding), honoring commitments *solely* because money was sunk, even when prospectively negative, establishes a harmful precedent or reputation for wastefulness, making "throwing good money after bad" irrational due to its *long-term strategic* costs.
      *   **Verdict:** Substantive and defensible (strategic perspective).
      *   **Supports Dismissal?** **No.** This reading *opposes* the proverb! It suggests continuing *might* be rational *to avoid signaling unreliability*, precisely *because* of the sunk cost history. (The proverb is misapplied if this is the rationale).
      *   **Ordinary Use/Slide:** Rarely intended in the proverb's use, which is usually myopic. Highlights the proverb's potential short-term bias.
      *   **History-Sensitivity:** Embraces rational history-sensitivity via the strategic impact of past actions on future expectations.
      *   **Recoverable vs. Inert:** Explicitly *uses* the history (sunk cost commitment) as strategically *active*; past expenditure is not inert because it shapes future partners' beliefs.

  ### Direct Answers to Your Points

  *   **History-Sensitivity:** Readings #1, #3, #4, and #5 explicitly reject intrinsic history-sensitivity (caring about sunk sacrifices or historical consistency for their own sake) as irrational. #2 rejects it as a direct motivator. Only #6 embraces strategic history-sensitivity. Rejecting intrinsic history-sensitivity is standard in decision theory; embracing strategic sensitivity is also standard.
  *   **Collapsing Recoverable/Inert:** This collapse is most explicit and problematic in **Reading #4**. It is the critical error enabling the proverb to dismiss cases like yours illegitimately. Readings #1 and #3 correctly distinguish unrecoverability from inertness but are often *interpreted* as implying #4. Readings #2, #5, and especially #6 do not require this collapse.
  *   **Strongest Reading & Vindication:** The proverb's core defensible meaning is **Reading #2** (don't spend *just* to recover sunk costs). Its strongest common but false reading is **Reading #4** (sunk costs are totally inert). The proverb *cannot* on its strongest *defensible* reading (**#2**) license dismissing your case, as your case plausibly involves non-fallacious reasons (signaling, evidence). Applying it requires showing those reasons are absent or fallacious themselves.
