  ok so background: I'm a backend engineer, zero philosophy training, and I got dragged into a forum arguement about whether Hume's essay on miracles is secretly just Bayesian reasoning dressed up in fancy prose. So I went and read the first part of the miracles section in the Enquiry. I was reading a scanned PDF on my phone and couldn't select text, so everything below is me retyping/paraphrasing what I think it says — not a quote. If I've mangled it somewhere, tell me where before you answer anything else.

  Roughly, as I read it: Hume defines a miracle as a violation of the laws of nature, and says that because a firm and unalterable experience has established those laws, the proof against a miracle is as complete as any argument from experience can possibly be. Then he turns around and says our confidence in human testimony is *also* built on experience — we've observed that people usually report things accurately, that memory is mostly reliable, that there's a general love of truth, and that shame attaches to being caught in a falsehood. He lists the things that weaken testimony: witnesses contradicting each other, few witnesses, witnesses of bad character, witnesses with something to gain, witnesses hesitating, witnesses asserting too violently. Then the rule that everyone on the forum was fighting about: testimony is not sufficient to establish a miracle unless the testimony is of such a kind that its being false would be more miraculous than the fact it's trying to establish. And somewhere near the end of that part he talks about there being a proof on each side, and the mind subtracting the weaker from the stronger and holding belief in proportion to what's left over.

  Things I actually want help with:

  1. What is being compared in that rule? In my head there are two totally different things it could be. Either you compare P(the witnesses are lying or confused) against P(the miracle happened) — two probabilities on the same scale, subtract one from the other, done. Or you compare how likely this testimony is on the assumption the miracle happened versus how likely it is on the assumption it didn't, which is a likelihood ratio and doesn't involve subtracting anything. I've written both as scoring functions and they disagree on the same inputs, so which one is the passage actually doing?

  2. Here's what bugs me most. At work I have a scorer for monitoring alerts. My model of how trustworthy the alerting pipeline is comes from the exact same historical logs as my model of how the service normally behaves — both are just induction from past regularity, neither is more basic than the other. Hume seems to be in the same boat: testimony gets its force from observed regularity of reports matching facts, and the laws of nature get theirs from uniform experience. But then he calls the law side a complete proof and the testimony side merely probability. Is there a principled difference between those two uniform experiences, or is he grading his own homework?

  3. If I set the prior probability of a genuine anomaly to zero in my scorer because it has literally never happened in the logs, no amount of evidence ever moves it — zero times anything is zero. Does the passage have this problem? Because if firm and unalterable experience is supposed to make the proof against a miracle complete, it looks like the miracle side is pinned at zero, and then the rule can never be satisfied no matter how weird the testimony is. That would make it useless rather than demanding, and I don't think that's what he wants but I can't see how he escapes it.

