answer: |-
  Good morning. It’s genuinely good to be back after eighteen months away, standing among so many familiar faces and brilliant minds. And it’s a particular pleasure to open *Reading the Weights*, a workshop born from conversations where I kept thinking, "We’re not quite disagreeing; we’re describing the same mountain from different elevations."  

  Some of you spend your days inside transformer weights, tracing activation vectors, uncovering superposition, mapping circuits like archaeologists reconstructing a buried city. Others of you analyze belief, desire, and explanation in folk psychology, dissecting how we make sense of agents – human or otherwise – without ever opening a weights file. And last week, a colleague warned me this entire framing might be a category error. I don’t think it is. But the doubt nagged. Why?  

  Because the question lurking beneath our two days together isn’t just *what* we see in these models. It’s *how* we see it. Daniel Dennett’s three stances aren’t just philosophy seminar furniture; they’re the actual lenses we use, often without realizing it.  

  Watch closely in a moment. My colleague will demonstrate something remarkable: steering a model’s answers by amplifying a specific internal direction isolated directly from its weights—a direction found using the tools of mechanistic interpretability. We’ll see the answer shift. But crucially, we *won’t* see *how* it shifted. In rehearsal, it worked twice and failed once. From the third row? Utterly indistinguishable. The surface output looked identical whether the intervention worked perfectly or failed completely. That gap – between the intricate causal story inside the weights and the smooth flow of answers we receive – is our workshop’s terrain.  

  Consider the model generating this text. It processes tokens, calculates probabilities across layers defined by this specific architecture, trained on that specific corpus. Voltage fluctuates, heat dissipates. It follows an instruction, drawing on patterns learned during training. It seems to grasp the request, to formulate a coherent response, aiming to be helpful based on the prompt it was given.  

  *(Pause)*  

  That seamless shift? That was the point. We just moved through the physical stance – silicon, electricity, architecture. Then the design stance – training objectives, learned algorithms, the isolated vector. Then the intentional stance – belief, understanding, purpose. We do this constantly. Both halves of this room rely on stances the other might rarely touch. The interpretability researchers operate powerfully within the design stance, reverse-engineering the machine’s blueprints. The philosophers expertly deploy the intentional stance, analyzing the model *as if* it had beliefs and goals. Both treat the physical stance – the raw, unfathomable physics of billions of computations – as something they *could* consult in principle, but never actually do.  

  And here’s the rub, the concession I owe to my mechanistic friends: The intentional stance feels dangerously convenient, doesn’t it? Attributing "belief" or "trying" to a model can seem like just a slick predictive trick. An old philosopher’s habit dressed in new tech, projecting inner life onto circuits that have none. Maybe it's just a useful fiction for navigating complex behaviour quickly.  

  But here’s the turn. Is the pattern *real*? Does that internal direction my colleague will amplify, or that apparent "intention" to be helpful, genuinely exist in the world? Dennett offered a ruthlessly pragmatic criterion: **A pattern is real if describing it compresses information and predicts behaviour better than listing every physical fact ever could.** Does finding that activation vector let us predict and steer the model’s answers more efficiently than tracking every electron? Does describing the model *as if* it understands let us anticipate its responses better than simulating every transistor? If yes, then the pattern is real. It’s a feature of the world we can grasp and use, irrespective of anyone’s inner life. That criterion – compression and predictive power – is our shared ground. It lets us say we’ve found something real without stepping into metaphysical quicksand.  

  This is why the category error warning matters, and why the indistinguishability of our demo’s success and failure is so vital. It forces the question: When does a description cross from being merely useful shorthand to tracking a genuine structure in reality? And that, of course, lands us squarely in the long-running debate: Was Dennett, in proposing this, a realist about beliefs and features, or a clever instrumentalist dressing up prediction as reality? Three of you in the front row are already holding opposing answers. Good. I’m not here to resolve that today. I’m here to hand it to you, sharpened by our shared context, for your deep dive in Session Two.  

  For now, let’s witness the gap itself. Let me invite my colleague forward for our demonstration. Watch closely – not just the answer, but the space *between* the machine and the meaning. Let’s read the weights together. Welcome.
