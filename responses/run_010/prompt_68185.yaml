prompt: |-
  I work as a risk analyst. I price insurance portfolios, I do outside-view forecasting for infrastructure clients, and from time to time I give expert evidence in civil proceedings. Over the years I have accumulated a set of firm judgements about when a base rate may legitimately be applied to a single case and when it may not. What I have never managed is to state a principle that survives contact with the whole list. I should like to know whether one exists.

  Here are the verdicts.

  1. A clinician asks me for the probability that a particular patient — 58, male, smoker, two previous cardiac events — survives five years. I am entirely happy to take the frequency in the class of statistically similar patients and report it as the probability for him. No unease at all; I would think it evasive if the clinician refused the number.

  2. The same clinician asks me for the probability that this patient gives up smoking within the year. I refuse to hand over the class figure. I insist on facts about him: whether he has booked a cessation clinic, whether his partner has just quit, whether this admission was the frightening one. The base rate here feels as though it answers a different question from the one asked. I cannot explain the difference from case 1, since there too I have facts about him and use them cheerfully.

  3. A client asks for the probability that a proposed light-rail line comes in on budget. I begin from the recorded outcomes of comparable rail projects and treat the client's bottom-up schedule as an adjustment to that distribution, never as a substitute for it. If a project team presents an elegant detailed plan and no comparison class, I discount their number almost to zero.

  4. A client asks the same question about a first-of-a-kind demonstration plant with no genuine precedent. I refuse to widen the class to "large public projects in general" in order to produce a figure. I would rather report that no defensible number exists than manufacture one from a class that shares nothing relevant. I am aware that in case 3 I positively demanded a class spanning projects that differ from this one in many respects.

  5. In a civil case, the claimant was struck by a bus whose operator is unknown; the evidence is that the defendant runs 70 per cent of the buses in the town. I think that evidence, standing alone, should not support a finding for the claimant, even though on any threshold view of the standard of proof it puts the probability at 0.7.

  6. A numerically equivalent case in which the 0.7 comes instead from an eyewitness — the witness says the bus wore the defendant's livery, and the court is told the witness identifies liveries correctly 70 per cent of the time in those conditions — I do think suffices. Same number, opposite verdict. I hold both, and I accept that any account on which the standard of proof is simply a probability threshold must pronounce one of them wrong.

  7. That same 0.7 statistic, used to justify screening everyone in the group or to set a premium, strikes me as perfectly good evidence. My resistance in case 5 is specific to the courtroom, and all I can offer by way of explanation is the phrase "that case is about this person".

  8. On how narrow to go: I accept narrowing the cardiac class by a genetic marker whose mechanism nobody can explain to me, and I reject narrowing it by month of birth, for which I likewise have no mechanism. Pressed, I say the marker is a real property of the patient and the birthday is an artefact of how the records happen to be sorted. I recognise that this is a shrug dressed as a rule.

  9. On my own account: I forecast political events on a prediction platform and essentially never consult base rates. I read the reporting, produce a number, and over several years have beaten people who do consult them. Nevertheless I tell clients, in case 3, that the base rate must govern. I do not know whether the difference is that political forecasting is a skill and project forecasting is not, or that I am flattering myself.

  What I want from you is the principle, or the small set of candidates, that generates these verdicts. State each clause precisely and identify the case that motivates it, so that I can see what work each clause is doing. Then tell me what it delivers on cases I have not listed — specifically: whether an insurer may use a postcode-level class that correlates strongly with ethnicity; whether a parole board may rely on a recidivism score derived from people who differ from the prisoner precisely in the respects that matter to him; and what your principle says about a genuinely unrepeatable event such as the outcome of the next general election.

  Most importantly, give me the cost. Say which of my nine verdicts the principle cannot accommodate and which of them I must therefore give up, and say whether the ones that survive do so for reasons that ought to embarrass me — because I would rather be told that my practice rests on two incompatible principles applied in different rooms than be handed a scheme that quietly rewrites my cases until they fit.

  I want a committed answer. Do not survey the options and leave the choice to me. Name the principle you think is correct, defend it against the obvious rivals — a pure probability-threshold account, accounts that turn on causal or explanatory relevance, accounts that turn on the sensitivity or normalcy of the inference, and any account you prefer to these — and state plainly which of my verdicts you are overturning and why. If your conclusion is that no single principle can hold cases 1, 2, 5 and 6 together, argue for that conclusion rather than merely noting it; and if you think one of my verdicts is simply mistaken, say so and say which. I also know the classical advice for this problem — take the narrowest reference class for which reliable statistics exist — and I want you to tell me whether that rule is any use to me at all, since it seems silent on cases 2, 5 and 8, where the question is not how narrow to go but whether the class applies in the first place.
reasoning: |-
  Hmm, the user is a risk analyst with deep practical experience in applying base rates across different domains - insurance pricing, infrastructure forecasting, and legal testimony. They've presented nine carefully considered verdicts where they intuitively accept or reject base rate application, but struggle to articulate a unifying principle. Their frustration is palpable: they want a committed answer that either explains all cases coherently or explicitly overturns some judgments.

  The core tension lies in seemingly contradictory positions:
  - Accepting base rates for medical prognosis (case 1) but rejecting for behavioral prediction (case 2)
  - Demanding broad reference classes for infrastructure (case 3) while rejecting them for novel projects (case 4)
  - Treating identical probabilities differently in legal contexts (cases 5-7)

  Key philosophical challenges emerge:
  1. The reference class problem: When is a class "relevant enough"?
  2. The singular case dilemma: Why treat unique events differently?
  3. Epistemic purpose: How does the decision context (clinical vs legal) change what counts as evidence?

  Their rejection of probability threshold accounts (case 6) suggests they sense something deeper is at stake than mere Bayesian calculation. The insurance/parole board hypotheticals reveal concerns about fairness and moral agency - they're implicitly wrestling with the is-ought gap in statistical reasoning.

  For a satisfying answer, I must:
  - Reject oversimplified solutions like "narrowest reliable class" (fails cases 2,5,8)
  - Address all nine verdicts without fudging
  - Explicitly sacrifice some judgments if necessary
  - Provide actionable principles for their real-world cases

  The most defensible path forward seems to be a dual-track approach separating predictive contexts (where base rates anchor uncertainty) from attributive contexts (where responsibility requires individual causation). This explains:
  - Why medical prognosis (predictive) accepts classes but smoking cessation (attributive) demands individual facts
  - Why legal attribution (case 5) rejects bare statistics while identical probabilities from eyewitness testimony (case 6) suffice
  - Why insurance pricing (predictive) can use correlated variables that parole boards (attributive) should avoid

  Notably, this framework overturns their view on genetic markers vs birth month (case 8) - both are equally "real properties" but differ in causal plausibility. It also challenges their political forecasting exception (case 9) as performance-driven hubris.

  The cost? Abandoning the illusion that any single principle governs all probability judgments. But the payoff is clarity: we preserve distinctions that actually matter in their practice while exposing where their intuitions may be inconsistent.
answer: |-
  Your verdicts reveal a sophisticated tension between **epistemic justification** (what makes evidence probative) and **normative context** (how the purpose of the inquiry shapes what counts as evidence). The principle that best explains your judgments—while overturning one and refining others—is the **Causal-Attributive Relevance Principle (CARP)**. I'll defend this against alternatives, state costs explicitly, and apply it to your new cases.

  ---

  ### **The Causal-Attributive Relevance Principle (CARP)**
  **Definition:**  
  *Evidence from a reference class is legitimate for assigning a probability to a singular case if and only if:*  
  1. **Causal Relevance:** *The class shares properties causally linked to the outcome* (not merely correlated).  
  2. **Attributive Context:** *The inquiry seeks a prediction or aggregate decision (not individualized attribution of responsibility or agency).*  

  **Clauses Explained:**  
  - **Causal Relevance (motivated by cases 1, 3, 4, 8):**  
    Base rates require a causal mechanism (e.g., smoking → cardiac risk), not arbitrary correlations (e.g., birth month → survival). This distinguishes case 1 (causal risk factors) from case 8 (rejecting birth month despite correlation).  
  - **Attributive Context (motivated by cases 2, 5, 6, 7):**  
    Base rates are valid for group-level decisions (pricing insurance, setting policy) but *not* for assigning blame, credit, or responsibility to a specific agent/event. This explains why the 70% bus statistic is valid for insurance (case 7) but not court liability (case 5), and why eyewitness testimony (case 6) suffices—it speaks to *this event*, not group averages.  

  ---

  ### **How CARP Resolves Your Cases**
  | **Case** | **Your Verdict** | **CARP's Verdict** | **Reason** |
  |----------|------------------|---------------------|------------|
  | 1 (Cardiac survival) | Accept | Accept | Causal risk factors (age, smoking) justify class. *Predictive* context. |
  | 2 (Smoking cessation) | Reject | Accept *if* class is causal | **OVERTURNED.** If class shares causal factors (e.g., "patients with cessation plans"), it applies. CARP rejects *only* non-causal classes. |
  | 3 (Rail budget) | Accept | Accept | Class shares causal factors (scope, complexity). *Predictive* context. |
  | 4 (Novel plant) | Reject | Accept | **MODIFIED.** Use causally analogous projects (e.g., "first-of-kind infra"), not "public projects." If none exist, defer. |
  | 5 (Bus liability) | Reject | Accept *if* causal | **OVERTURNED.** 70% *alone* is invalid (non-causal correlation), but if class shares causal factors (e.g., "buses in this area at this time"), it *might* apply. |
  | 6 (Eyewitness) | Accept | Accept | Testimony addresses *this event* (attributive context), not a class. |
  | 7 (Insurance premium) | Accept | Accept | Group-level decision (attributive context irrelevant). |
  | 8 (Genetic marker) | Accept | Accept *if* causal | **REFINED.** Genetic markers are valid *only* if mechanistically linked to outcome (e.g., BRCA1), not arbitrary. Birthday is invalid (non-causal). |
  | 9 (Political forecasting) | Reject base rates | Reject base rates | **CONSISTENT.** Singular events with no causal class (e.g., elections) require non-statistical methods. Skill may exist. |

  ---

  ### **Costs and Overturned Judgments**
  1. **You must abandon verdict 2:** Refusing base rates for smoking cessation is inconsistent. If a class shares causal factors (e.g., "smokers with partners who quit"), it applies. Your demand for "facts about him" is proper for *refining* the class, not rejecting it.  
  2. **You must abandon verdict 5:** If the bus class shares causal properties (e.g., route, time), 70% *is* valid evidence. Your resistance stems from conflating *attributive* and *predictive* contexts—but CARP isolates this.  
  3. **Case 4 is refined:** "No precedent" doesn’t forbid all classes; seek causal analogues (e.g., other "first-of-kind" tech projects).  

  ---

  ### **Defense Against Rivals**
  - **Pure Probability Threshold (rejected):** Fails cases 5 and 6 (same 70%, opposite verdicts). CARP resolves this via attributive context.  
  - **Causal/Explanatory Relevance (incomplete):** Explains cases 1, 3, 8 but not 2, 5, 6. CARP adds *attributive context* to cover legal/agency distinctions.  
  - **Sensitivity/Normalcy (rejected):** Whether an inference is "normal" (e.g., eyewitness vs. statistic) doesn’t explain why base rates work in insurance (case 7) but not court (case 5). CARP’s contextual axis does.  
  - **"Narrowest Reliable Class" (rejected):** Useless for cases 2, 5, 8. A narrow class of "people born on January 1" is still invalid (non-causal). CARP fixes this.  

  CARP is superior because it:  
  1. Separates *epistemic* (causal relevance) and *normative* (attributive context) demands.  
  2. Explains why identical probabilities (0.7) are treated differently (cases 5 vs. 6, 7).  

  ---

  ### **Application to New Cases**
  1. **Insurer using postcode correlated with ethnicity:**  
     - **CARP:** *Reject.* Postcode is correlated but not *causal* for risk (e.g., crime rates may stem from policing, not ethnicity). Use causal factors (e.g., income, building safety). If ethnicity is a proxy for systemic bias, it’s ethically and epistemically invalid.  
  2. **Parole board using recidivism scores:**  
     - **CARP:** *Reject if class lacks causal relevance.* If the score uses factors like "age at first arrest" (causal) and adjusts for individual rehabilitation (e.g., therapy), it may apply. If it uses immutable traits (race) or non-causal correlates, it fails.  
  3. **Unrepeatable event (election outcome):**  
     - **CARP:** *No defensible base rate.* Without causal analogues (e.g., "elections with similar polarization"), base rates are guesses. Your skill-based approach (case 9) is justified.  

  ---

  ### **The Bottom Line**
  **CARP accommodates 7/9 verdicts** (overturning 2 and 5) and refines 4 and 8. The cost is rejecting your intuition that *all* individual-facing inquiries (cases 2, 5) forbid base rates. Instead, CARP insists:  
  > **Base rates are illegitimate only when (a) the class lacks causal relevance, or (b) the context demands attributing agency/responsibility.**  

  This principle survives contact with your hardest cases—and exposes where your practice was inconsistent (e.g., accepting genetic markers without mechanism). It also explains why you beat base rates in political forecasting: unrepeatable events lack causal classes, making skill possible. If this embarrasses you, it should only do so by revealing that *evidential rigor*, not intuition, separates valid from invalid base rates.  

  **Final note:** The "narrowest reliable class" rule is useless without CARP. Narrowness ≠ causal relevance. CARP tells you when to seek a class at all.
