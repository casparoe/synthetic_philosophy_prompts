answer: |-
  ## Research Proposal: Evidential Asymmetry in the Lottery and Preface Paradoxes  

  ### Brainstorming Candidate Framings  
  1. **Metaphysical Framing (Evidence Types):** Focuses on the *nature of evidence* (statistical vs. particular) as the core asymmetry. Strengths: Directly addresses the user’s intuition. Weakness: Risks conflating epistemology with metaphysics.  
  2. **Doxastic-Structural Framing (Belief Grounding):** Emphasizes *how beliefs are anchored* (class-level probability vs. individual warrant). Strengths: Aligns with formal theories of justification. Weakness: May overlap with existing "levels of generality" critiques.  
  3. **Failure-Condition Framing (Closure Breakdown):** Centers on *where closure under conjunction fractures* (inference vs. self-undermining evidence). Strengths: Cleanly tests existing solutions. Weakness: Less novel.  

  **Settled Framing:** I adopt a hybrid of (1) and (2): **The evidential asymmetry framing**, enriched by doxastic structure. This best isolates the ambiguity in "evidence of what" while enabling formal modeling of belief grounding.  

  ---

  ### Research Proposal  

  **Title:** Evidential Asymmetry and the Disunity of the Lottery and Preface Paradoxes  

  **Core Question:** Does a structural asymmetry between statistical evidence (lottery) and particular evidence (preface) undermine uniform solutions to these paradoxes, such that a solution resolving one paradox systematically fails when applied to the other under controlled evidential conditions?  

  **Problem Statement:** The lottery paradox (statistical evidence for each "ticket \(i\) loses" conflicts with belief in "some ticket wins") and the preface paradox (particular evidence for each claim in a book conflicts with belief in "some claim is false") are treated as twin challenges to rational belief. Standard solutions—e.g., abandoning conjunctive closure, contextual thresholds, credence-replacement, or stability theories—aim to resolve both uniformly. I argue these paradoxes exhibit a deep asymmetry:  
  - **Lottery:** Beliefs rest on *statistical evidence about a class* (e.g., "1 in \(n\) odds"), inaccessible via non-statistical means.  
  - **Preface:** Beliefs rest on *direct particular evidence* (e.g., archival research), undermined only by *general evidence* of authorial fallibility.  
  This suggests that "evidence" functions differently: in lottery cases, it quantifies *risk distribution*; in preface cases, it reflects *epistemic effort*. Uniform solutions may thus overgeneralize by ignoring what the evidence is evidence *of*.  

  **Why Existing Responses Leave the Question Open:**  
  1. **Closure-denial approaches** (e.g., belief-credence dualism) apply identically to both paradoxes without examining *why* closure fails—masking whether statistical vs. particular evidence drives the failure.  
  2. **Threshold-relativizing/contextualizing approaches** treat evidence monolithically, neglecting whether thresholds shift due to evidence type (e.g., statistical thresholds resisting contextual adjustment).  
  3. **Stability theories** (e.g., resolute belief) impose uniform robustness requirements, ignoring that statistical evidence inherently destabilizes class-level beliefs, while particular evidence destabilizes preface beliefs only under metacognitive evidence.  
  *No solution explicitly tests whether its mechanism succeeds only under one evidential profile.*  

  **Methodology:**  
  **Formal Machinery:**  
  - **Evidence Pools:** Distinguish *statistical* (e.g., probability distributions) and *particular* (e.g., verified facts) evidence sets.  
  - **Belief-Failure Metrics:** Track closure breakdowns (e.g., via belief revision frameworks like AGM) under evidence-type permutations.  
  - **Threshold Dynamics:** Model threshold sensitivity (e.g., using Dempster-Shafer functions) when evidence types mix.  

  **Test Cases:**  
  1. **Asymmetric Hybrids:**  
     - *Statistical Preface:* Author has statistical evidence for each claim (e.g., "95% of archives are reliable").  
     - *Particular Lottery:* Subject inspects each ticket (e.g., "ticket \(i\) looks fake").  
  2. **Evidence Swaps:** Apply lottery solutions to preface (and vice versa) in hybrid cases.  

  **Monthly Plan:**  
  - **Months 1–2:** Conceptual taxonomy of evidence types (statistical/particular) and paradox structures.  
  - **Months 3–4:** Formalize evidence pools and hybrid test cases; model threshold behaviors.  
  - **Months 5–6:** Stress-test 3–4 major solutions (e.g., closure denial, contextual thresholds, stability) against hybrids.  
  - **Months 7–8:** Analyze failure patterns: Does statistical evidence disrupt closure *differently* than particular+general evidence?  
  - **Months 9–10:** Generalize results: Is evidential asymmetry necessary/sufficient for paradox dissolution?  
  - **Months 11–12:** Draft papers; refine criteria for solution portability.  

  **Defense Against Alternatives:**  
  Constructing a new semantics for belief would beg the question by presupposing a unified mechanism. Instead, I *stress-test existing solutions* under evidence-swapped scenarios. This exposes whether their success depends on unacknowledged evidential assumptions—a more direct probe of the asymmetry hypothesis.  

  **Success Criteria:**  
  - **Success:** Demonstrating that ≥2 standard solutions resolve one paradox but collapse when applied to the other under swapped evidence (e.g., stability works for lottery but not statistical preface).  
  - **Failure:** Hybrid cases resolve cleanly under existing solutions, or asymmetry proves irrelevant to closure failure.  

  **Feasibility Assessment:**  
  Twelve months is realistic:  
  - Low risk: Taxonomy and hybrid cases (Months 1–4) build on established formal tools.  
  - Medium risk: Isolating solution brittleness (Months 5–8) requires careful edge-case design but is tractable.  
  - Output: 2 journal articles (on asymmetry and solution portability) are achievable with 6 months of analysis/writing.  

  ---  
  *This proposal challenges a 50-year consensus by treating the paradoxes as distinct phenomena. If correct, it implies paradox research must first disambiguate evidence types before prescribing solutions.*
