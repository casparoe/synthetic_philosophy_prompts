prompt: |-
  You are a formal epistemologist with substantial experience supervising dissertation projects on the logic of belief. Think carefully before drafting: begin with a brief brainstorming section in which you weigh two or three candidate framings of my idea and explain which you settled on, then write the proposal proper.

  I am applying for a one-year postdoctoral fellowship and need a two-page research proposal. My half-formed idea: the lottery paradox and the preface paradox are almost invariably treated as two versions of a single problem, and proposed remedies — abandoning closure under conjunction, relativizing or contextualizing the Lockean threshold, replacing flat belief with graded credence, or building a stability requirement into rational belief — are then scored by how well they handle both at once. My suspicion is that the two are structurally dissimilar. In the lottery case each candidate belief rests on statistical evidence about a class to which the subject has no independent access; in the preface case each belief rests on the author's best particular evidence, and what undermines them is only general evidence about the author's own reliability. If that asymmetry is real, the search for a uniform diagnosis may be trading on an ambiguity in what the subject's evidence is evidence of, and the views that dissolve one paradox may be over-generalizing from the other.

  Turn this into a proposal that: states the question precisely enough that a negative result is possible; explains why the existing responses leave it open rather than merely disagreeing; sets out the method, month by month, including what formal machinery and what test cases I would deploy, and defends that method against the obvious alternative of constructing yet another semantics for belief; says what a successful outcome looks like and what would count as the project failing; and gives an honest assessment of whether twelve months is realistic. I will supply the references myself, so identify positions and arguments by description rather than by citation.
