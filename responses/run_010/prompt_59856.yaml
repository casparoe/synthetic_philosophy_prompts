answer: |-
  ### Prioritarian Allocation Procedure for Home-Energy-Retrofit Program  
  Your goal is to maximize **priority-weighted well-being** across districts, prioritizing gains for the worse off. Below is a step-by-step procedure, including math, decision points, and defense tactics. The core idea:  
  - **Prioritarianism** sums a concave function of well-being (e.g., `√well-being`), so gains for the worse off count more.  
  - **Unit legitimacy**: Using district averages is acceptable *only if* within-district inequality is low. If not, districts mask disparities—this is a limitation.  

  ---

  ### **Procedure & Key Questions**  
  Ask these questions in order. Stop at **values calls** (⭐) for human input.  

  1. **What is the current well-being measure?**  
     - *Requirement*: A continuous, ratio-scale metric (e.g., income, energy burden index).  
     - *Passing answer*: "Dollars or a physical unit (e.g., kWh) comparable across districts."  
     - ⭐ *Values call*: If well-being isn’t inter-district comparable, halt.  

  2. **What is the per-slot well-being gain?**  
     - *Math*: `g_i = (value_per_slot) / (district_population)`.  
       - E.g., a $3,000 slot in a 10,000-person district adds $0.30 to average well-being.  
     - *Passing answer*: "Value per slot is fixed, and population data is current."  

  3. **What concavity parameter (ε) should we use?**  
     - *Math*: Transform well-being with `u(x) = x^(1−ε) / (1−ε)` (ε=0: linear; ε=1: log).  
     - *Defense to non-philosophers*:  
       - *Analogy*: "Giving $100 to a poor person helps more than giving $100 to a millionaire. ε controls how extreme this is."  
       - *Calibration*: "If a slot in a district at **2× the well-being level** must produce **K× more gain** to be equally valuable, then `K = 2^ε`."  
         - ε=0.5: K=√2≈1.4 (moderate priority to worse off).  
         - ε=1: K=2 (strong priority).  
     - ⭐ *Values call*: ε must be set by policymakers. Propose ε=0.5 as a default.  

  4. **Compute priority-weighted utility for each proposal**:  
     - **Utility function**: `U = Σ [p_i * u(x_i + g_i * Δs_i)]`  
       - `p_i` = district population  
       - `x_i` = current district average well-being  
       - `g_i * Δs_i` = well-being change from slot change `Δs_i`  
     - **Decision rule**: Maximize ΔU (U_proposal − U_current).  
     - **Anti-leveling-down**: Unused slots = zero gain → always ΔU < 0.  

  ---

  ### **Evaluation of Your Proposals**  
  *Assumptions*:  
  - 40 districts, 1,200 slots.  
  - Current well-being: Worst-off = $10k, Mid = $30k, Wealthiest = $50k.  
  - Populations: Worst-off = 10k, Mid = 15k, Wealthiest = 20k.  
  - Value per slot: $3,000 → `g_i` = $0.30 (worst), $0.20 (mid), $0.15 (wealthy).  
  - ε=0.5 (moderate priority). Utility: `u(x) = √x` (since ε=0.5 → `u(x) = 2√x`; scaling drops out in ΔU).  

  | Proposal | ΔU Calculation | Result |  
  |----------|----------------|--------|  
  | **(a) Cancel 80 slots (40/wealthy), unused** | Wealthy districts lose slots:  
  `ΔU = 2 * [20k * (√(50k - 40*0.15) - √50k)]`  
  `≈ 2 * [20k * (√49,994 - √50k)]`  
  `= 2 * [20k * (-0.0006)] = -24`  
  → **ΔU = -24** (worse) | ❌ Reject: Worsens utility. Dashboard now *penalizes* leveling down. |  
  | **(b) Shift 60 slots (mid → worst-off)** | Worst-off gains: `10k * [√(10k + 60*0.30) - √10k]`  
  `= 10k * [√10,018 - √10k] ≈ 10k * +0.009 = +90`  
  Mid loses: `15k * [√(30k - 60*0.20) - √30k]`  
  `= 15k * [√29,988 - √30k] ≈ 15k * -0.0004 = -6`  
  → **ΔU ≈ +84** | ✅ Accept: Net positive. Large gain for worst-off outweighs small mid loss. |  
  | **(c) Worst-off +1 slot, 40 others -1 slot each** | Worst-off gains: `10k * [√(10k + 1*0.30) - √10k]`  
  `≈ 10k * +0.000015 = +0.15`  
  40 others lose (assume $40k well-being, 20k pop):  
  `40 * [20k * (√(40k - 1*0.20) - √40k)]`  
  `≈ 40 * [20k * (-0.0000025)] = -2`  
  → **ΔU ≈ -1.85** | ❌ Reject: Tiny gain for worst-off < small losses for others.  
  *But if worst-off starts at $5k (not $10k)*:  
  Gain: `10k * [√(5k + 0.30) - √5k] ≈ +13.4`  
  → **ΔU ≈ +11.4** (✅ Accept). Outcome depends on *how* worse off the worst is. |  

  ---

  ### **Where This Might Misfire**  
  1. **Within-district inequality**:  
     - If slots don’t reach the poorest *within* a district, district averages mislead.  
     - *Fix*: Mandate district-level targeting (e.g., income thresholds).  

  2. **Non-linear slot benefits**:  
     - If slots have diminishing returns (e.g., first slot saves $3k, second saves $2k), our `g_i` is wrong.  
     - *Fix*: Use marginal benefit curves per district.  

  3. **ε disputes**:  
     - High ε (e.g., ε=1) overallocates to the worst-off, even for tiny gains.  
     - *Example*: Under ε=1, (c) with worst-off at $10k → ΔU≈+0.1 (still negative).  

  4. **Zero-well-being districts**:  
     - `u(x)=√x` undefined if x≤0.  
     - *Fix*: Use `u(x)=√(x + c)` (c=subsistence level) or shift the well-being scale.  

  ---

  ### **Settled vs. Contested**  
  | Aspect | Settled? | Note |  
  |--------|----------|------|  
  | **Concave transformation** | Yes | Consensus that prioritization requires concavity. |  
  | **Summing over individuals** | Yes | Prioritarianism is welfarist and additive. |  
  | **District averages** | Contested | Legitimate *iff* within-district targeting is possible. Otherwise, individual data needed. |  
  | **Choice of ε** | Contested | No philosophical consensus. ε=0.5–1 common in policy. |  
  | **Leveling down** | Settled | Rejected: Wasted slots always reduce utility. |  

  ---

  ### **Defending the System**  
  - **To policymakers**: "This maximizes overall well-being with extra weight for the vulnerable. Unused slots *always* hurt."  
  - **To engineers**: "The math is convex optimization—greedy slot allocation works. Use `ε=0.5` unless directed otherwise."  
  - **Dashboard fix**: Report **ΔU** instead of disparity. Track:  
    ```python
    utility = sum(population * sqrt(well_being))  # For ε=0.5
    ```  

  This balances ethics, efficiency, and practicality. Test ε with historical data—your "hated" (c) might fail unless the worst-off are *extremely* deprived.
