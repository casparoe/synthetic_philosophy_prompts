answer: |-
  ## Plan

  I hold completeness (D1), strong Pareto (D2), and non-triviality (D5) as non-negotiable. Anonymity (D3) and Amnesia (D4) are desirable but conflict with these essentials. Discounted summation violates strong anonymity (D3-unrestricted) and struggles with arbitrariness in δ. Overtaking variants satisfy weak anonymity (finite permutations only) but flout Amnesia (D4). Lexicographic orders are excessively time-biased. The deflationary option violates (D1) and (D5). The strongest contenders are overtaking with "eventually strictly positive" difference and Cesàro-based approaches. I will argue for the former, sacrificing Amnesia (D4) to preserve the core. This requires defending weak anonymity and confronting the permutation of β and γ.

  ## Essay: Aggregating the Infinite: A Defence of Eventual Strict Dominance

  The challenge of ranking infinite utility streams forces us to confront fundamental tensions within our axiological commitments. Worlds like α (constant welfare 1), β (alternating 2 and 0), or ε (mostly 1, elevated on squares) present scenarios where our intuitions about aggregation, fairness, and significance stretch to their limits. This essay argues that the overtaking criterion, specifically the "eventually strictly positive" formulation, provides the most defensible basis for ranking these worlds. This necessitates sacrificing Amnesia (D4) and embracing only finite permutation invariance (weak Anonymity, D3), but preserves Completeness (D1), strong Pareto (D2), and Non-triviality (D5), offering a coherent and ethically significant ordering.

  **The Core Conflict and Non-Negotiables**

  The setup immediately highlights conflicts. Strong Pareto (D2) demands that δ (mostly 1, but day 1 = 100) is strictly better than α (constant 1), as it is better on day 1 and equally good elsewhere. Yet Amnesia (D4) insists that worlds differing only finitely are equally good, implying δ ≈ α. These cannot both hold. Similarly, unrestricted Anonymity (D3-unrestricted) – demanding invariance under *all* permutations, including those rearranging infinitely many days – combined with (D1) and (D2) leads to contradiction. Consider β (2 on odds, 0 on evens) and γ (0 on odds, 2 on evens). They are permutations of each other via the swap of all odd and even days. Unrestricted (D3) demands β ≈ γ. Strong Pareto (D2) demands β > α (constant 1) because β is better on infinitely many days (all odds) and worse on infinitely many days (all evens), but crucially, for any finite n, S_β(n) - S_α(n) is either 0 (if n even) or 1 (if n odd). The difference never becomes permanently positive or negative relative to α in a way that satisfies the strict demands of Pareto over infinite sets under unrestricted anonymity. This tension is the seed of impossibility theorems like Lauwers' (2010). Non-triviality (D5) rules out collapsing all distinctions.

  Completeness (D1) is essential for guiding action; incomparability offers no practical verdict. Strong Pareto (D2) is a minimal requirement for respecting improvements in welfare. Non-triviality (D5) is necessary for the exercise to have meaning. Therefore, the sacrifice must fall on either Amnesia (D4) or the strength of Anonymity (D3). Discounted summation preserves Completeness, Pareto (if δ<1), and Non-triviality but violates even weak Anonymity and introduces severe, arbitrary time bias. Lexicographic orders amplify this bias. The deflationary option abandons Completeness and Non-triviality. Overtaking and Cesàro approaches offer more promising paths.

  **β vs. α: Sensitivity and the Case for Strict Dominance**

  Comparing β and α is pivotal. The partial sum difference D(n) = S_β(n) - S_α(n) cycles: for n=1, D(1)=2-1=1; n=2, D(2)=(2+0)-(1+1)=0; n=3, D(3)=(2+0+2)-(1+1+1)=1; n=4, D(4)=0, and so on. D(n) = 1 if n is odd, 0 if n is even. It never becomes permanently negative; it is "eventually non-negative" (it is *always* non-negative). However, it never becomes *permanently strictly positive*; it drops back to zero infinitely often. The "eventually non-negative" overtaking criterion would deem β at least as good as α (β ≿ α), but not strictly better (¬(β ≻ α)). The "eventually strictly positive" criterion requires D(n) > 0 for all sufficiently large n. Since D(n) drops to zero infinitely often, this criterion does *not* hold; it yields β incomparable to α, or possibly β ≈ α depending on the specific formulation.

  This sensitivity is troubling. Intuitively, β delivers higher welfare (2) than α (1) on every odd day, and lower welfare (0) on every even day. Strong Pareto (D2), interpreted rigorously for infinite streams, suggests that since β is strictly better than α on infinitely many days (all odds) and strictly worse on infinitely many days (all evens), we need a way to see if one "dominates" overall. The cumulative difference D(n) oscillates but has a Cesàro limit (the average of the first n differences): C(n) = (Σ_{k=1}^n D(k))/n. For n odd, C(n) = ( (n+1)/2 * 1 ) / n ≈ 1/2. For n even, C(n) = (n/2 * 1) / n = 1/2. Thus, lim_{n→∞} C(n) = 1/2 > 0. The Cesàro mean suggests β is better than α. This aligns with the density of the improvement: half the days are strictly better (welfare +1), half are strictly worse (welfare -1), leading to a net average gain of 0.5 per day in the limit.

  I argue we *can* live with the "eventually strictly positive" sensitivity by augmenting it with a tie-breaking rule based on the Cesàro mean (or limit inferior) of the difference. We first apply strict overtaking: X ≻ Y iff S_X(n) - S_Y(n) > 0 for all n > N_0 for some N_0. If neither strictly overtakes the other, we check if lim inf_{n→∞} (S_X(n) - S_Y(n)) > 0 or if the Cesàro mean of the difference is positive. For β vs α, strict overtaking fails. However, lim inf_{n→∞} D(n) = 0 (not >0), but the Cesàro mean limit is 1/2 > 0. Adopting this tie-breaker yields β ≻ α. This satisfies D2: β is better on infinitely many days, worse on infinitely many, but the *net* effect in the limit is positive. Crucially, this avoids the indecisiveness of pure "eventually non-negative" and the incomparability of pure "eventually strictly positive" without Cesàro.

  **β vs. γ and the Defence of Weak Anonymity**

  Given γ is a permutation of β (swapping odds and evens), what does this imply? Unrestricted Anonymity (D3) demands β ≈ γ. However, our criterion (strict overtaking + Cesàro tie-breaker) must compare both to α. We have β ≻ α (as argued). What about γ vs α? The partial sum difference for γ and α is: n=1, D(1)=0-1=-1; n=2, D(2)=(0+2)-(1+1)=0; n=3, D(3)=(0+2+0)-(1+1+1)=-1; n=4, D(4)=0, etc. D(n) = -1 if n odd, 0 if n even. The Cesàro mean is lim_{n→∞} C(n) = -1/2 < 0. Strict overtaking fails (γ never overtakes α), and the Cesàro mean is negative. Thus γ ≺ α. Therefore, β ≻ α ≻ γ. Unrestricted Anonymity is violated (β ≻ γ).

  Is this defensible? Yes, and it reveals why unrestricted Anonymity is too strong. Permuting *infinitely* many locations fundamentally alters the *temporal sequence* of welfare. While the *set* of welfare values is identical for β and γ, their *ordering in time* differs significantly. In β, high welfare comes first; in γ, low welfare comes first. Our augmented overtaking criterion is sensitive to temporal sequence because it cares about the *path* of cumulative welfare. Sacrificing unrestricted Anonymity is the price of having a complete, Paretian, non-trivial ordering sensitive to temporal sequence. We retain weak anonymity (invariance under finite permutations): swapping finitely many days doesn't alter the long-run cumulative path or Cesàro mean. This is ethically significant: the identity of persons (or days) matters only if they are finite in number; infinitely permuted days lose their individual significance, but the sequence itself retains moral weight.

  Discounted summation starkly illustrates the problem of unrestricted anonymity and arbitrary bias. For any δ (0 < δ < 1), V_β = Σ δ^{n-1} w_β(n) = 2 + 0δ + 2δ² + 0δ³ + ... = 2 / (1 - δ²). Similarly, V_γ = 0 + 2δ + 0δ² + 2δ³ + ... = 2δ / (1 - δ²). Clearly, V_β > V_γ for any δ > 0. Discounting also yields β ≻ α: V_β = 2/(1-δ²), V_α = 1/(1-δ). Since 2/(1-δ²) = 2/((1-δ)(1+δ)) = (2/(1+δ)) * (1/(1-δ)) > 1/(1-δ) for δ < 1, so V_β > V_α. However, the choice of δ is arbitrary. Why discount at 0.9, 0.99, or 0.999? Each gives different *absolute* valuations and potentially different *relative* rankings for worlds like δ versus η. There is no non-arbitrary defence for any particular δ; it embodies a pure, ungrounded bias for the near future. Overtaking avoids this by focusing on relative performance in the limit.

  **ε and ζ: Sparse Changes and the Cesàro Bargain**

  World ε is α (w(n)=1) except w(n)=2 on perfect squares (1, 4, 9, 16, ...). World ζ is α except w(n)=0 on perfect squares. The set of perfect squares has density zero: lim_{n→∞} (number of squares ≤ n)/n = 0. The partial sum for ε is S_ε(n) = S_α(n) + K_n, where K_n is the number of perfect squares ≤ n (≈ √n). The difference D_ε(n) = S_ε(n) - S_α(n) = K_n → ∞, but D_ε(n)/n ≈ √n / n = 1/√n → 0. Similarly, for ζ, D_ζ(n) = S_ζ(n) - S_α(n) = -K_n → -∞, D_ζ(n)/n → 0. Under strict overtaking: D_ε(n) > 0 for all n, and indeed grows without bound! Thus ε ≻ α. Similarly, D_ζ(n) < 0 for all n, so α ≻ ζ. Our tie-breaker isn't needed. Cesàro means: Lim_{n→∞} D_ε(n)/n = 0, Lim_{n→∞} D_ζ(n)/n = 0. A pure Cesàro mean criterion (rank by lim inf or lim sup of average welfare) would yield ε ≈ α ≈ ζ, as all have average welfare converging to 1. This satisfies unrestricted Anonymity (D3) and Amnesia (D4) – since changing a density-zero set doesn't alter the limit average. However, it flouts Strong Pareto (D2): ε is strictly better than α on infinitely many days (squares) and never worse, yet deemed equally good. It also violates Non-triviality (D5) for these comparisons. This is not a good bargain. Pareto violations are ethically costly; ignoring definite improvements, however sparse, because they are "swamped" in the infinite average is counterintuitive and fails to respect the distinct welfare experiences on the square days. Our overtaking approach correctly yields ε ≻ α ≻ ζ, prioritising D2 and D5 over D4 and D3-unrestricted.

  **δ vs. η: Temporal Position and Sacrificing Amnesia**

  Both δ (w(1)=100, else 1) and η (w(n)=1 except w(n)=2 for n = 10⁹ to 10⁹ + 10⁶) Pareto-dominate α (constant 1). How do they compare? Discounted summation V_δ = 100 + Σ_{n=2}^∞ δ^{n-1} * 1 = 100 + δ/(1-δ). V_η = Σ_{n=1}^{10^9-1} δ^{n-1}*1 + Σ_{n=10^9}^{10^9+10^6} δ^{n-1}*2 + Σ_{n=10^9+10^6+1}^{\infty} δ^{n-1}*1. For any δ < 1, the massive early gain in δ (100 at t=1) dwarfs the later block of elevated welfare in η (2 instead of 1 for a million days, but starting at day 1 billion). Even a δ very close to 1 (say δ=0.999999999) will still heavily discount welfare billions of days hence. Thus discounted summation yields δ ≻ η ≻ α. Overtaking examines the partial sum difference S_δ(n) - S_η(n). For n < 10⁹, S_δ(n) - S_η(n) = (100 + (n-1)*1) - (n*1) = 100 - 1 > 0. For n ≥ 10⁹ + 10⁶, S_δ(n) = 100 + (n-1)*1. S_η(n) = [S_α(10^9 - 1) = 10^9 - 1] + [Σ_{k=10^9}^{10^9+10^6} 2 = 2*10^6] + [Σ_{k=10^9+10^6+1}^n 1 = n - (10^9 + 10^6)].
  Thus S_η(n) = (10^9 - 1) + 2*10^6 + n - 10^9 - 10^6 = n + (10^6 - 1).
  S_δ(n) = 99 + n. Therefore, S_δ(n) - S_η(n) = (99 + n) - (n + 10^6 - 1) = 100 - 10^6 = -999,900 < 0 for all n ≥ 10^9 + 10^6. Since S_δ(n) - S_η(n) is eventually strictly negative (and bounded away from zero), overtaking (strict or non-strict) yields η ≻ δ. The Cesàro mean of the difference also converges to -999,900/n → 0, but strict overtaking already gives a clear verdict: η ≻ δ ≻ α (since δ ≻ α by strict overtaking: S_δ(n) - S_α(n) = 99 > 0 for all n ≥ 1).

  I accept the overtaking verdict: η ≻ δ. This commits me to the view that temporal position itself has no *intrinsic* moral significance. What matters is the *overall* sequence of welfare. Sacrificing a large early gain (δ) for a vast number of smaller, later gains (η), provided the net effect eventually becomes permanently positive (as η does over δ), is better. Discounting arbitrarily privileges the near future. While we might have psychological biases towards the near future, or practical uncertainties about the far future, these are contingent factors. In the idealized, certain context of these worlds, the timing of welfare is morally irrelevant. This verdict necessitates sacrificing Amnesia (D4): δ differs from α only on day 1, yet we rank δ ≻ α. Ignoring a single, significant welfare difference because it's finite seems indefensible when assessing the entire future; that day 1 experience is a real part of the world's value. Amnesia is too strong a requirement.

  **Confronting Objections and the Idealisation**

  The strongest objection is that this entire enterprise is idle: no actual choice affects an infinite future. We only deal with large finite horizons. Why bother with these paradoxes? The defence is twofold. First, the infinite case serves as a limiting idealisation, revealing foundational tensions in our moral principles (e.g., Pareto vs. Anonymity, sequence vs. set) that persist in large finite cases. Should a vast future improvement starting in 1,000 years outweigh a significant near-term loss? Overtaking vs. discounting models this debate sharply. Second, some real-world choices (e.g., existential risk mitigation, climate change policy, or setting social discount rates) genuinely concern potential futures of immense duration, where the "infinite" idealisation helps clarify the structural aspects of intergenerational justice far beyond any foreseeable horizon. The problems of aggregation and sequence sensitivity are real even if literal infinity is not.

  Sacrificing Amnesia might seem ad hoc. However, it follows from the core purpose of the betterness relation: to compare the *totality* of welfare experiences across possible futures. A finite difference, if significant (like w(1)=100 vs. w(1)=1), is part of that totality. To deem it irrelevant (Amnesia) because it's finite ignores the qualitative moral significance of that specific experience within the whole. Similarly, while strong Anonymity treats the welfare *set* as the sole bearer of value, the *sequence* matters because well-being is experienced temporally; the order in which gains and losses occur can shape the character of a life or a civilization's history, even if individuals are abstractly permuted in the infinite limit. Weak anonymity respects the distinctness of finitely many locations while recognising that infinitely permuted sequences are different histories.

  **Verdict**

  I adopt the overtaking criterion with the "eventually strictly positive" condition, augmented by a tie-breaker using the Cesàro mean (or limit inferior) of the partial sum difference when strict overtaking fails. This criterion satisfies Completeness (D1), strong Pareto (D2), and Non-triviality (D5). To secure it, I sacrifice Amnesia (D4) and embrace only weak Anonymity (invariance under finite permutations). This yields definite verdicts:
  *   **β vs α:** β ≻ α (Cesàro tie-breaker shows net gain).
  *   **δ vs η:** η ≻ δ (η strictly overtakes δ).
  *   **ε vs α:** ε ≻ α (ε strictly overtakes α: S_ε(n) > S_α(n) for all n ≥ 1).
  The moral significance of temporal position is rejected; what matters is the long-run cumulative path of welfare. While the infinite horizon magnifies theoretical tensions, the resulting criterion provides a principled, action-guiding ranking that respects welfare improvements wherever they occur and avoids the arbitrariness of discounting or the ethical cost of Cesàro-based indifference.
