prompt: |-
  I am drafting a section of a paper arguing that the instrumental, competence-based case for epistocracy cannot be repaired by better test design, and I need a worked case that a sympathetic epistocrat could not dismiss as rigged. Please construct the case to the following specifications.

  **The scenario.** One paragraph, set in a realistic local-government body — a county board, a regional water authority, a school district, a transit agency — facing a single binary decision. No science fiction, no invented societies, no narrators with privileged access to the truth.

  **The two arms.** The same population, the same decision, the same turnout, the same motivation. In arm A, everyone votes. In arm B, the franchise is restricted to those who pass a competence examination, and the examination is not a sham: it is fairly administered, it tests material genuinely relevant to the body's work, and across the full range of decisions that body will make over the following decade, screened voters are strictly and substantially more likely to be individually correct than unscreened voters. If that global advantage is not built into the description, the case is worthless to me.

  **The result to be generated.** On this one decision, the screened electorate's majority verdict is less likely to be correct than the unscreened electorate's, and not merely marginally so. This must be an epistemic failure rather than a motivational one: no self-interest, no demagoguery, no misinformation campaign, no captured media, no differential turnout. I want the mechanism isolated entirely to what the voters know and to how their errors depend on one another.

  **Two constraints that matter most.** First, the decision must have a fact of the matter about which option is better, fixed by consequences that everyone in the case agrees are the relevant ones; I do not want the outcome to turn on value pluralism or on contested conceptions of the good, because that is a different objection and not the one I am making. Second, the knowledge that lets the unscreened electorate get this decision right must be knowledge the examination could not certify in principle — tacit, distributed, held in fragments by people none of whom can articulate the whole of it — rather than knowledge the examiner merely neglected to test. If the obvious fix is "write a better test," the case fails.

  Do not announce the verdict inside the scenario. Describe the setting and the relevant structure; the outcome must be derivable from it, not asserted.

  **Then the demonstration.**

  1. Supply a toy model with explicit indicative numbers — electorate sizes, individual accuracies, a correlation parameter or its structural equivalent — giving the majority accuracy in each arm on this decision, and giving the screened group's global advantage across the body's ordinary business. The arithmetic may be approximate but must be real.
  2. Say which condition of the Condorcet jury theorem fails here, and whether it fails for the screened group, the unscreened group, or both; then explain why the standard appeal to that theorem gets the sign wrong on this particular decision.
  3. Identify which feature of the case is doing the work, and run at least two removal tests: what happens if the screened voters' errors are made independent of one another while their individual accuracy on this decision is held fixed, and what happens if the distributed local knowledge is made examinable while the correlation among screened voters is held fixed. Report for each whether the case collapses, reverses, or survives.
  4. Say whether this is a special case or a structural one: does any screen that selects for a shared body of examinable knowledge tend to produce this result on the subclass of decisions that turn on distributed local knowledge, and how large must that subclass be before the global advantage required in the second specification is lost altogether?
  5. Give the epistocrat's three best replies — for instance, that the screen is not the cause of the failure, that a partly screened or mixed assembly would have caught it, or that the case assumes an implausible distribution of issue types — and price each one: what the epistocrat must concede to make it.
  6. Close by stating the minimal modification to the screening rule that would restore its advantage on this decision, and whether the epistocrat can accept that modification without surrendering the reason for screening in the first place.
reasoning: |-
  We are constructing a case for a local government body: a regional water authority responsible for managing water resources, including reservoirs, treatment plants, and distribution systems. The authority faces a binary decision: whether to approve a proposed upgrade to a key water treatment plant that would replace aging filtration systems with a new technology. The upgrade is expensive and would require a bond issue, but it promises to improve water quality and reliability. The alternative is to continue with the current system, which is functional but becoming less reliable and more costly to maintain.

  The population of eligible voters consists of the residents of the county served by the water authority. The same population is considered in both arms. The turnout and motivation are the same. In arm A, everyone votes. In arm B, the franchise is restricted to those who pass a competence examination. The examination is fairly administered and tests knowledge of water systems, environmental science, public health, and basic economics — all relevant to the authority's work. Over the full range of decisions the authority makes (e.g., setting water rates, approving capital projects, responding to drought conditions, regulating industrial discharges), the screened voters are strictly and substantially more likely to be individually correct than unscreened voters. However, on this specific decision about the treatment plant upgrade, the majority verdict of the screened electorate is less likely to be correct than that of the unscreened electorate.

  The decision has a fact of the matter: the upgrade is better if it leads to a net improvement in water reliability and quality without imposing unsustainable financial burdens, as measured by the agreed-upon metrics of water safety, system reliability, and long-term cost-effectiveness. Everyone in the case agrees that these are the relevant consequences.

  The knowledge that allows the unscreened electorate to get this decision right is distributed and tacit. Specifically, the current system's reliability is affected by local conditions that are not well-documented: the behavior of the system under rare but critical conditions (like extreme weather events) and the accumulated experience of maintenance staff and long-term residents. This knowledge is held in fragments by many individuals (e.g., a maintenance worker knows about a recurring leak that becomes critical in cold snaps, a resident near the plant has noticed unusual water discoloration after heavy rains, an accountant in the water department knows of hidden costs in the current system that are not in official reports). No single person has the whole picture, and the examination cannot capture this distributed, context-specific knowledge because it is based on standard, general principles.

  **Toy Model**

  Let the electorate size be 10,001 (to avoid ties). We consider two groups:

  - **Unscreened electorate (A)**: All 10,001 voters. Individual accuracy on this specific decision is 50.5% (just above chance). However, their errors are independent. Why? Because their knowledge is distributed and idiosyncratic. Each voter has a small piece of information, and when aggregated independently, they can achieve high collective accuracy.

  - **Screened electorate (B)**: Only those who pass the exam. Suppose 2,000 pass (about 20% of the population). These voters have a high individual accuracy on typical decisions (say 70% on average across the board). But on this specific decision, they are misled by their shared, exam-certified knowledge. Because the exam tests general principles, they all rely on the same body of knowledge and make the same mistake. Thus, their individual accuracy on this decision is only 40% (they are systematically biased toward a wrong answer). Moreover, their errors are perfectly correlated: they all think the upgrade is a good idea (or bad) for the same reasons.

  Now, we compute the majority accuracy for each arm.

  *Arm A (unscreened):*
  - Individual accuracy: 0.505
  - Electorate size: 10,001
  - By the Condorcet jury theorem, since individual accuracy > 0.5 and independent, the probability that the majority is correct approaches 1 as the group size increases. We can compute the exact probability using the binomial distribution. For a large odd n, the majority is correct with high probability. For n=10,001 and p=0.505, the majority is correct with probability >99.9%.

  *Arm B (screened):*
  - Individual accuracy: 0.4 (so 40% chance of being correct, 60% chance of being wrong)
  - Electorate size: 2,000
  - But errors are perfectly correlated. So if one screened voter is wrong, all are wrong. Thus, the entire group votes the same way. The probability that the majority is correct is simply the probability that an individual is correct: 0.4 (40%).

  Thus, the unscreened electorate has >99.9% chance of being correct, while the screened electorate has only 40% chance.

  Now, we must also show that the screened voters have a global advantage. Across the body's ordinary business, we assume that the screened voters have an individual accuracy of 70% on average, while the unscreened voters have an individual accuracy of 55% on average (for the same decisions). Moreover, we assume that for most decisions, the screened voters' errors are independent (they don't all fail on the same questions). Then, for a typical decision, the screened electorate (with 2,000 voters and p=0.7, independent) would have a majority accuracy of nearly 100%, while the unscreened (with 10,001 voters and p=0.55, independent) would have a majority accuracy of nearly 100% as well, but the screened group's individual accuracy is higher. However, the key point is that on most decisions the screened group is more likely to be individually correct, and collectively they are very accurate.

  **Condorcet Jury Theorem (CJT) Condition**

  The CJT requires that (1) voters have a common competence (accuracy >0.5), (2) they vote independently, and (3) they vote sincerely. In this case, for the unscreened group on this decision, condition (1) holds (0.505>0.5) and condition (2) holds (independent errors). For the screened group, condition (1) fails because their individual accuracy (0.4) is below 0.5. Moreover, condition (2) fails because their errors are correlated.

  The standard appeal to the CJT by epistocrats relies on the screened group having higher individual competence and then, by the CJT, higher collective competence. But here, on this decision, the screened group has lower individual competence (0.4 < 0.5) and correlated errors, so the CJT does not apply and in fact the collective competence is low. The unscreened group, despite lower individual competence on average, has independent errors and just enough individual competence above 0.5 to achieve high collective competence.

  **Why the sign is wrong**: The epistocrat expects that higher individual competence (globally) leads to higher collective competence on every decision. But on this decision, the screened group's shared knowledge leads them to be systematically biased (so their individual competence is actually low) and their errors are correlated. The unscreened group, because of distributed local knowledge, has independent errors and an individual accuracy just above 0.5, leading to high collective accuracy.

  **Removal Tests**

  1. *Make screened voters' errors independent while holding individual accuracy fixed at 0.4*: Then, for the screened group (n=2000, p=0.4), the majority would be correct with probability near 0 (because p<0.5 and n large). This is even worse than the correlated case (which was 0.4). So the case survives but in a different form: the screened group still fails (40% individual accuracy is too low for the CJT to help). However, note that in the original case the correlation made the collective outcome the same as the individual outcome (40%), but without correlation, the majority outcome would be almost certainly wrong (close to 0). The unscreened group still wins.

  2. *Make the distributed local knowledge examinable*: Then the examination could test for it. But the scenario requires that this knowledge cannot be examined in principle because it is tacit and distributed. If we force it to be examinable, then the screened voters would have higher individual accuracy on this decision. Suppose we set the screened voters' individual accuracy on this decision to 0.7 (same as their global average) and errors independent. Then the screened group would have a majority accuracy near 100%. The case collapses because now the screened group would do better.

  **Special or Structural?**

  This is a structural case. It arises whenever:

  - There is a class of decisions that depend on distributed local knowledge (which cannot be captured in an exam because it is tacit and context-specific).
  - The screening rule selects for a shared body of examinable knowledge that is systematically misleading on these decisions (due to oversimplification, missing context, or being based on general principles that do not apply in this specific case).

  The size of the subclass of decisions that turn on distributed local knowledge must be small enough that the screened voters still have a global advantage. In our model, the screened voters have 70% accuracy on the other decisions and 40% on this one. If the fraction of decisions of this type is f, then the overall individual accuracy for a screened voter is (1-f)*0.7 + f*0.4. We require this to be above the unscreened voters' global accuracy (which we set at 55%). So:

  (1-f)*0.7 + f*0.4 > 0.55

  0.7 - 0.3f > 0.55

  0.15 > 0.3f

  f < 0.5

  So as long as less than 50% of decisions are of this type, the screened voters have a global individual advantage. But note that even a small fraction of such decisions can lead to disasters on those specific issues.

  **Epistocrat's Replies and Their Price**

  1. *Reply*: The screen is not the cause of the failure; the cause is that the test designers did not anticipate this specific kind of decision. With better test design (including more context-specific questions), this could be avoided.

     *Price*: The epistocrat must concede that the test must be tailored to every possible context and must capture distributed local knowledge, which we argued is impossible in principle. If the test must include every piece of local knowledge, it becomes infinitely detailed and cannot be administered.

  2. *Reply*: A partly screened or mixed assembly (e.g., a representative body with both experts and lay members) would have caught this. The pure epistocracy is not necessary; we can have a hybrid.

     *Price*: This concedes that full epistocracy (restricting the franchise only to the competent) is flawed. Moreover, it moves away from the instrumental case for epistocracy as a voting system and toward a mixed governance model.

  3. *Reply*: The case assumes an implausible distribution of issue types. Decisions that turn on distributed local knowledge are rare, and the global advantage of epistocracy outweighs the occasional loss.

     *Price*: The epistocrat must concede that on some important decisions (like the water treatment upgrade, which could affect public health), epistocracy might fail catastrophically. Moreover, it is hard to know in advance which decisions are of this type.

  **Minimal Modification and Acceptability**

  The minimal modification to the screening rule that would restore its advantage on this decision is to include mechanisms for aggregating distributed local knowledge without requiring it to be examinable. For instance, allowing unscreened voters to participate in this decision or setting up a deliberative body that collects local input.

  But if the epistocrat accepts this, they surrender the reason for screening in the first place because they are admitting that the examination cannot capture all relevant knowledge and that lay participation is necessary for some decisions. This undermines the competence-based case for epistocracy, which relies on the examination as the sole gatekeeper.

  Thus, the epistocrat cannot accept this modification without surrendering the core claim that the competent (as defined by the exam) should exclusively rule.
answer: |-
  ### Case: Regional Water Authority Upgrade Decision

  The Pine Valley Regional Water Authority serves a diverse county of 100,000 residents. It manages reservoirs, treatment plants, and distribution networks. The authority faces a binary vote: whether to approve a $20 million upgrade to its main water treatment plant. The upgrade would replace aging sand filters with advanced membrane technology, promising better contaminant removal. The alternative is to maintain the existing system with incremental repairs. The objectively better choice depends on long-term consequences: if the upgrade reduces maintenance costs and health risks (e.g., from heavy metals and pathogens) without causing rate hikes that trigger service disconnections, it is preferable; otherwise, the status quo is better. All voters agree these outcomes—public health, system reliability, and financial sustainability—define "better." Voter motivation and turnout are identical in both arms. In Arm A, all 100,000 residents vote. In Arm B, only the 20,000 residents who pass a competence exam may vote. The exam is rigorously proctored and tests knowledge of hydrology, environmental regulations, infrastructure engineering, and public finance—all demonstrably relevant to the authority’s decade-long portfolio of decisions (e.g., drought responses, rate adjustments, and pollution controls). Across this portfolio, screened voters are individually correct 70% of the time on average, compared to 55% for unscreened voters, confirming their global epistemic advantage.  

  However, the membrane upgrade decision hinges on distributed local knowledge. The existing system’s vulnerability to rare "cold snaps" (which cause pipe fractures) and its hidden maintenance burdens are not documented in official reports. Instead, this knowledge is tacit and fragmented: a veteran plant operator knows the sand filters fail unpredictably below -5°C; a neighborhood plumber observes frequent leaks in old service lines during freezes; a local accountant has calculated unreported overtime costs for emergency repairs; and residents recall water discoloration after past upgrades disturbed sediment. No single voter grasps the full picture, and this knowledge cannot be articulated or examined in principle—it emerges only from lived, localized experience. The exam, by design, tests general principles (e.g., membrane efficiency standards) but cannot certify these context-specific fragments. Consequently, screened voters uniformly rely on textbook advantages of membrane technology, unaware of how cold snaps interact with Pine Valley’s unique infrastructure.  

  ---

  ### Demonstration  

  **1. Toy Model**  
  - **Electorate size**: Total population = 100,000. In Arm A (unscreened), all vote. In Arm B (screened), 20,000 vote (20% pass rate).  
  - **Individual accuracy on this decision**:  
    - Unscreened voters (A): Each has 50.5% accuracy. Their errors are independent due to fragmented, local knowledge (no shared bias).  
    - Screened voters (B): Each has 40% accuracy. Errors are perfectly correlated—all rely on the same exam-certified general knowledge, missing local context.  
  - **Global epistemic advantage (other decisions)**: Screened voters average 70% accuracy; unscreened voters average 55%.  
  - **Majority accuracy for this decision**:  
    - Arm A (unscreened): Size \( n_A = 100,000 \). Accuracy \( p_A = 0.505 \). Independence allows Condorcet amplification. Probability of correct majority:  
      \[
      P_{\text{maj,A}} \approx 1 - \Phi\left( \frac{0.5 - 0.505}{\sqrt{0.505 \times 0.495 / 100,000}} \right) > 99.9\% 
      \]  
      (via Normal approximation to binomial; near-certain correctness).  
    - Arm B (screened): Size \( n_B = 20,000 \). Accuracy \( p_B = 0.40 \). Perfect correlation means no aggregation benefit: all vote identically. Probability of correct majority = individual accuracy = 40%.  
  - **Result**: Unscreened majority is >99.9% likely correct; screened majority is 40% likely correct.  

  **2. Condorcet Jury Theorem (CJT) Failure**  
  - **CJT conditions**: (i) Competence (\( p > 0.5 \)), (ii) Independence, (iii) Sincerity.  
  - **Failure**: For Arm B (screened), both (i) and (ii) fail: \( p_B = 0.4 < 0.5 \), and errors are correlated. For Arm A (unscreened), all conditions hold (\( p_A > 0.5 \), independence).  
  - **Why the sign reverses**: Epistocrats appeal to CJT to argue that higher individual competence (here, screened voters’ 70% global average) implies higher collective competence. But on this decision, screened voters’ shared knowledge creates *systematic bias* (lowering \( p_B \) below 0.5) and *correlated errors*, destroying aggregation. Unscreened voters’ distributed knowledge ensures independence and \( p_A > 0.5 \), enabling effective aggregation. Thus, CJT predicts screened superiority globally but fails for decisions where localized knowledge dominates.  

  **3. Key Feature and Removal Tests**  
  - **Feature doing the work**: Correlation among screened voters’ errors due to reliance on shared exam-certified knowledge, plus unscreened voters’ independence from distributed local knowledge.  
  - **Removal test 1 (Independent errors for screened voters)**: Hold \( p_B = 0.40 \) but make errors independent. Then:  
    \[
    P_{\text{maj,B}} \approx \Phi\left( \frac{0.40 - 0.5}{\sqrt{0.40 \times 0.60 / 20,000}} \right) \approx 0\% 
    \]  
    (majority almost certainly wrong). **Result**: Case survives—unscreened still wins (99.9% > ~0%).  
  - **Removal test 2 (Examinable local knowledge)**: Assume local knowledge is testable. Screened voters now have \( p_B = 0.70 \) (global average) with independence. Then:  
    \[
    P_{\text{maj,B}} \approx 1 - \Phi\left( \frac{0.5 - 0.7}{\sqrt{0.7 \times 0.3 / 20,000}} \right) > 99.9\% 
    \]  
    **Result**: Case collapses—screened now wins. This confirms the criticality of *inexaminable* distributed knowledge.  

  **4. Special Case or Structural?**  
  - **Structural**: Any competence screen selecting for shared examinable knowledge risks this outcome on decisions turning on inexaminable distributed local knowledge (e.g., context-dependent infrastructure, community health dynamics).  
  - **Subclass size for global advantage loss**: Let \( f \) = fraction of decisions relying on distributed knowledge. Screened voters’ global accuracy = \( (1-f) \times 0.70 + f \times 0.40 \). Unscreened = \( (1-f) \times 0.55 + f \times 0.505 \).  
    Screened superiority requires:  
    \[
    (1-f) \times 0.70 + f \times 0.40 > (1-f) \times 0.55 + f \times 0.505
    \]  
    Solving: \( 0.70 - 0.30f > 0.55 - 0.045f \) → \( 0.15 > 0.255f \) → \( f < 0.59 \).  
    Global advantage holds only if \( f < 59\% \). For \( f \geq 59\% \), screened voters lose their edge.  

  **5. Epistocrat’s Best Replies and Their Price**  
  - **Reply 1**: "The screen isn’t the cause—bad test design is. Better exams could sample local knowledge."  
    **Price**: Concede that exams cannot capture *inexaminable* tacit knowledge (by definition), making "better design" impossible for such decisions.  
  - **Reply 2**: "A mixed assembly (e.g., experts plus lay advisors) would avoid this."  
    **Price**: Abandon pure epistocracy; concede that unscreened participation is necessary for robustness, undermining the core instrumental case for exclusion.  
  - **Reply 3**: "Decisions like this are too rare to matter; global advantage dominates."  
    **Price**: Admit epistocracy can fail catastrophically on high-stakes local decisions (e.g., infrastructure affecting public health), and rarity is unverifiable ex ante.  

  **6. Minimal Modification and Acceptability**  
  - **Modification**: Allow unscreened voters to participate *only* on decisions verified to rely on distributed local knowledge (e.g., via a preliminary public consultation).  
  - **Acceptability**: The epistocrat cannot accept this without surrendering the rationale for screening. It requires admitting that inexaminable knowledge is indispensable, making competence exams insufficient for legitimate authority. Screening’s instrumental justification—that the examined *always* outperform—fails precisely when localized wisdom is decisive.  

  ---  
  **Conclusion**: This case isolates an epistemic flaw in competence-based exclusion: screens that select for shared formal knowledge induce correlated errors on decisions requiring distributed tacit knowledge, while universal suffrage leverages independence for aggregation. The epistocrat cannot dismiss it as rigged—it grants their premises of voter motivation, global advantage, and exam fairness—yet shows that instrumental superiority is not guaranteed for all decisions.
