  **CSI/E 207:2024**  
  **Vignette-Based Elicitation of Folk Attitudes: Requirements for the Design, Administration, and Certification of Side-Effect Asymmetries**  

  **1 Scope**  
  This standard prescribes methodologies for the generation, deployment, and validation of agent-outcome vignettes targeting asymmetrical attributions of intentionality. Applies exclusively to stimuli wherein an agent:  
  (a) Expresses indifference toward a foreseen side effect,  
  (b) Pursues a primary goal with non-valenced instrumental means,  
  (c) Produces an outcome of positive, negative, or neutral valence.  

  **2 Normative References and Definitions**  
  2.1 **Consortium for the Standardization of Intuition Elicitation (CSI/E)**: Governing body for folk-attitude operationalization.  
  2.2 **Intentionality**: The property of an act performed with awareness of its outcomes and endorsement of those outcomes as aligned with, or non-conflicting with, the agent’s evaluative stance (see Annex B for mental state attribution heuristics).  
  2.3 **Side-Effect Asymmetry (SEA)**: A statistically significant divergence (p < .05, two-tailed) between rates of intentionality attribution for negatively valenced outcomes versus positively or neutrally valenced outcomes under conditions satisfying 2.2.  

  **3 Design and Administration Requirements**  
  3.1 **Vignette Construction**  
  3.1.1 *Agent Indifference*: Shall include explicit dialogue establishing the agent’s exclusive focus on primary goals (e.g., "I don’t care at all about [side effect], only about [primary goal]").  
  3.1.2 *Lexical Neutrality*: Verbs describing outcomes shall not imply valence (e.g., "harm," "benefit") unless testing lexical contamination hypotheses.  
  3.1.3 *Valence Anchoring*: Outcome descriptions must incorporate culturally unambiguous evaluative markers (e.g., "rare orchid blooms" → positive; "heron rookery abandons site" → negative).  

  3.2 **Participant Screening**  
  3.2.1 *Preamble Obscurity*: Study titles shall not reference intentionality, morality, or decision-making (e.g., "Organizational Behavior Survey").  
  3.2.2 *Competence Verification*: For vignettes involving specialized agents (e.g., ecologists), participants shall pass a 3-item quiz demonstrating comprehension of agent expertise.  

  3.3 **Stimulus Presentation**  
  3.3.1 *Sequence Randomization*: Vignette order shall be permuted to neutralize carryover effects. Counterbalancing matrices must be filed with CSI/E.  
  3.3.2 *Response Segregation*: Intentionality queries shall appear on separate screens from blame/praise assessments.  

  3.4 **Response Elicitation**  
  3.4.1 *Intentionality Query*: The prompt "Did [agent] [bring about outcome] intentionally?" shall be used verbatim.  
  3.4.2 *Response Format*:  
  - Binary (Yes/No) for initial certification.  
  - 7-point scales (-3: Strongly No, +3: Strongly Yes) permitted only if accompanied by binary recoding protocol demonstrating SEA robustness.  
  3.4.3 *Hypothesis Concealment*: Distractor vignettes (min. 2) with neutral/absurd outcomes shall comprise ≥40% of total stimuli.  

  **Table 1: Troubleshooting Asymmetry Attenuation**  
  | Symptom               | Probable Cause               | Corrective Action                          |  
  |-----------------------|------------------------------|--------------------------------------------|  
  | SEA < 15% Δ Harm-Help | Valence contamination        | Re-validate lexicon per §3.1.2; deprecate vignettes with implicit blame (Annex A.4) |  
  | Help > 40% intentionality | Pragmatic inference      | Insert neutral vignette preceding HELP condition |  
  | Neutral valence > 25% intentionality | Outcome absurdity insufficient | Replace neutral outcome with mechanistically plausible non-valenced event (e.g., "humming in B-flat" → Annex A.3) |  

  **4 Certification and Replication**  
  4.1 **Initial Certification**  
  4.1.1 Submit vignette wording, response logs, and demographically stratified intentionality rates (age, gender, education) to CSI/E.  
  4.1.2 SEA is certified if Harm intentionality ≥65%, Help intentionality ≤35%, and Neutral intentionality ≤20% in a representative sample (N≥200).  

  4.2 **Validation of Replication Failure**  
  4.2.1 If SEA is not observed (§4.1.2 unmet), re-administer with:  
  - Revised outcome descriptions (§3.1.3),  
  - Response scale adjustment (§3.4.2),  
  - Expanded distractor set (§3.4.3).  
  4.2.2 If SEA is restored after one (1) revision cycle, certify vignette as "Conditionally Approved — Context-Sensitive Asymmetry."  
  4.2.3 *Certification Significance*: Restoration of SEA after revision confirms the robustness of folk conceptual structure under optimized elicitation parameters.  

  4.3 **Demographic and Cultural Compliance**  
  4.3.1 Samples shall be stratified by:  
  - Geographic region (minimum 3 non-contiguous territories),  
  - Native language (minimum 2 distinct linguistic families).  
  4.3.2 SEA variation exceeding 20% between strata triggers mandatory annotation in certification documents.  
  4.3.9 *Amendment Protocol*: If SEA replication failure recurs in >30% of post-certification studies, CSI/E shall convene to revise valence-anchoring criteria (§3.1.3).  

  *Revision History*: §4.3.9 amended 15/03/2024 following failed replication in temperate climate zones (CSI/E Bulletin 19:22-28).  

  ---

  **Annex A (Normative): Vignette Classification**  

  | Vignette ID | Description                                  | CSI/E Status          | Requirements for Use                          |  
  |-------------|----------------------------------------------|-----------------------|-----------------------------------------------|  
  | **A.1 HARM** | Director approves drawdown; harms herons.    | **Approved**          | Mandatory for SEA certification.              |  
  | **A.2 HELP** | Director approves drawdown; helps orchids.   | **Conditionally Approved** | May only be administered: <br>a) After A.1 or A.3, <br>b) With binary response scale. |  
  | **A.3 NEUTRAL** | Drawdown causes pumps to hum in B-flat. | **Deprecated**        | Permitted only as distractor (§3.4.3). Prohibited for asymmetry quantification. *Rationale: Insufficient valence to trigger folk-psychological heuristics.* |  
  | **A.4 EXPERT** | HARM vignette, ecologist director.     | **Conditionally Approved** | Requires: <br>a) Pre-screening quiz (§3.2.2), <br>b) Paired administration with A.1. *Note: Intentionality rates ≤10% above A.1 baseline suggest expertise modulation of folk attributions.* |  

  **Annex B (Informative): Intentionality Attribution Heuristics**  
  *Withdrawn pending harmonization with CSI/E 306:2024 (Deep Self Activation Metrics).*  

  ---  
  **Compliance Notation**: Certified methodologies may bear the CSI/E 207:2024 Seal of Folk-Psychological Validity. Use of deprecated vignettes voids certification.
