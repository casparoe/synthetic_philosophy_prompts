prompt: |-
  You're a professional philosopher who works on population ethics and the ethics of food — treat me as a colleague, not a student. I'm trying to sort out two ways of counting the harm in what we eat, and I can't tell whether they're rivals or just bookkeeeping variants of each other.

  Counting scheme one: bodies. Crop cultivation kills a lot of field animals — ploughing, harvesting, pest control — so plant food isn't innocent, and the interesting move is switching the denominator. On deaths per hectare, pasture-fed ruminants looked competitive with grain; on deaths per unit of food actually produced, the picture largely inverts, because a hectare of pasture yields so much less protein. Chicken sits badly under either denominator for a different reason: small bodies mean lots of individuals per kilo.

  Counting scheme two: which lives get to exist at all. Turning pasture into cropland, or cropland back into pasture, doesn't just kill — it fixes how many wild animals there will be, and if the average wild life is net negative (starvation, parasites, being eaten young), a habitat change that kills nobody is still a moral event, possibly a good one. Here the total view and person-affecting views pull apart over whether lives-not-lived count for anything.

  Compare the two properly for me. Start with a few sentences of scratch work setting each scheme up cleanly, then: is scheme two a competitor to scheme one or a superset of it? Give me at least one concrete case — beef vs. soy vs. chicken, or one particular land conversion — where they issue opposite verdicts rather than just weighting the same facts differently. And how much does scheme two ride on the sign assumption about wild lives: what survives if that sign is simply unknown rather than negative? Tell me how confident you are in your main claims and single out the one point you're least sure about.

  One formatting thing: continuous prose only, like an email to a colleague. No headings, no bullet points, no bold, no tables.
