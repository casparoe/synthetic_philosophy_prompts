  **INTERNAL MEMORANDUM**  
  **Journal of Terminal Trajectory Analysis (JTTA)**  
  **STYLE GUIDE REVISION 7.0**  
  **EFFECTIVE IMMEDIATELY**

  To All Contributing Authors and Peer Reviewers,

  Recent methodological introspection, coupled with contextual pressures from prevailing discourse, necessitates a comprehensive revision of the *Journal of Terminal Trajectory Analysis*'s house style. This revision addresses persistent ambiguities and conceptual imprecision surrounding the phenomenon colloquially known as "societal collapse" (hereafter referred to under revised nomenclature per Section 2). Our goal is enhanced analytical precision and terminological responsibility, acknowledging the inherent complexities of measuring systemic transformation against non-arbitrary baselines and avoiding survivorship bias inherent in studying only cases exhibiting apparent cessation events.

  **Section 1: Mandatory Analytical Protocols (Effective Immediately)**

  1.  **Multi-Scalar Focus Required:** Analyses must explicitly differentiate between the cessation of specific elite functions (e.g., cessation of dynastic inscription production, termination of palatial redistribution networks) and broader socio-ecological continuity (e.g., persistence of agrarian practices, ceramic traditions). "Collapse" narratives focusing solely on the former are inherently incomplete. (Example: Abandonment of monumental construction in the southern Maya lowlands must be contextualized against continued activity and adaptation in northern regions.)
  2.  **Causation Complexity Mandate:** Assigning monocausal explanations (e.g., "ecocide," "invasion," "elite decadence") for systemic transformation events is prohibited. Authors must integrate multi-causal frameworks acknowledging contingency, feedback loops, and external catalysts. (Example: Discussions of Rapa Nui demographic trajectories must rigorously disentangle pre-contact resource dynamics from the catastrophic impacts of European contact, slave raiding, and introduced pathogens; the term "ecocide" requires exhaustive qualification or avoidance.)
  3.  **Interdependence Acknowledgement:** Studies of Late Bronze Age Eastern Mediterranean systems must foreground their character as tightly interdependent networks. Descriptions of their "failure" must emphasize cascading network dysfunctions and propagation of instability, explicitly rejecting frameworks interpreting these events as isolated instances of internal "decline" or "moral failure."
  4.  **Survivorship Bias Mitigation:** Manuscripts focusing on societies experiencing significant transformation must include, where feasible, comparative discussion or citation of contemporaneous societies *not* experiencing similar termination events to counterbalance inherent selection bias in the field.
  5.  **Baseline Rejection Rule:** Authors are forbidden from implying the existence of a stable, objectively definable peak or "golden age" from which "decline" is measured. All assessments of societal trajectory must explicitly state the specific, contingent metrics being used (e.g., monument volume, settlement density, textual output) and acknowledge their partiality. Avoid teleological framing implying societies were "progressing" towards a specific endpoint.
  6.  **Rule 12 (Conceptual Onset Threshold):** Authors must pinpoint the precise chronological year (or season, where evidence permits) marking the definitive onset of the documented transformative process relative to the chosen metric(s) in Rule 5. This onset must be demonstrably distinct from background fluctuation.

  **Section 2: Approved Lexicon for Systemic Transformation Events (Glossary)**

  The term "collapse" and its derivatives (collapsed, collapsing, etc.) are hereby prohibited in all JTTA submissions. Utilize the following approved terms, selecting the most contextually precise:

  *   **Administrative Reconfiguration:** Replacement of one governing structure with another distinct form (e.g., Roman Empire -> post-Roman kingdoms).
  *   **Settlement Pattern Reorganization:** Significant shift in population distribution and habitation focus (e.g., urban nucleation -> dispersal).
  *   **Hyperlocalized Subsistence Realignment:** Transition to smaller-scale or more autonomous production/consumption units, implying reduced central coordination.
  *   **Monumental Activity Cessation:** End of large-scale public construction projects.
  *   **Centralized Resource Flow Discontinuity:** Breakdown of state-level redistribution or taxation systems.
  *   **Demographic Consolidation:** Significant reduction in population size or density. (Avoids "crash" or "decline" connotations).
  *   **Information Flow Attenuation:** Reduction in long-distance trade or communication.
  *   **Epigraphic Hiatus:** Cessation of formal inscription production.
  *   **Emergent Post-Monumental Paradigms:** Describes socio-political formations arising *after* the cessation of previous centralized monumental/administrative activities, emphasizing novelty rather than loss. *[Note: This term applies even if the primary observable characteristic is significantly reduced population, technological simplification, and loss of previously universal services.]*
  *   **Sustainable Decomplexification:** A theoretically optimal state adjustment towards reduced socio-political complexity deemed more resilient or contextually appropriate. *[Note: Use requires extraordinary evidentiary justification demonstrating net positive outcomes across all societal strata.]*

  **Section 3: Worked Example of Non-Compliant vs. Compliant Framing**

  *   **Non-Compliant (Rejected):** "The reckless deforestation and short-sighted elite competition of the Classic Maya inevitably led to their catastrophic collapse, a stark warning from history echoing the arguments of Thaddeus P. Flintlocke's bestselling polemic *Ozymandias Was a Wimp*."
      *   *Violations:* Monocausal ("deforestation," "elite competition"); Teleological ("inevitably"); Value-laden ("reckless," "short-sighted," "catastrophic"); Use of "collapse"; Polemic citation without critical engagement; Lack of multi-scalar focus; Implied arbitrary baseline (Classic period as peak).
  *   **Compliant Rewrite:** "Multiple stressors, including climatic variability, shifting inter-polity dynamics, and regional environmental pressures, contributed to a process of Settlement Pattern Reorganization and Monumental Activity Cessation in the southern Maya lowlands during the 8th-10th centuries CE. This Administrative Reconfiguration occurred alongside continued socio-political complexity and adaptation in northern regions. The long-term socio-ecological consequences of this Hyperlocalized Subsistence Realignment in the south remain actively debated, challenging oversimplified narratives of systemic failure."

  **Implementation and Compliance**

  All submissions received after the date of this memorandum must adhere strictly to these revised guidelines. Manuscripts currently under review will be evaluated against these standards; revisions may be requested. Peer reviewers are instructed to rigorously enforce these protocols.

  **Closure Notice**

  The Editorial Board acknowledges significant contextual pressures impacting the feasibility of sustained publication operations under the current intellectual paradigm. Consequently, the Journal of Terminal Trajectory Analysis announces a forthcoming Cessation of Editorial Operations. This represents an Administrative Reconfiguration within the academic publishing landscape, designed to optimize resource allocation and foster Emergent Post-Monumental Paradigms in the study of socio-political transformation. We express gratitude for your contributions and anticipate future scholarship will build upon the conceptual foundations established here, navigating the complexities of Sustainable Decomplexification within our field. The final issue will reflect these principles in full.

  The Editorial Board  
  *Journal of Terminal Trajectory Analysis*
