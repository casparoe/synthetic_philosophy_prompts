  ### Procedure for Imprecise Probability in Flood Risk Assessment

  **Step 1: Construct the Set of Distributions**  
  *(Technical; 0.4 analyst-days)*  
  - **Data (tide gauge):**  
    - Bootstrap the short record (1,000 resamples) to generate 90% confidence intervals for mean crest height.  
    - Output: Interval \( I_D = [d_l, d_h] \).  
  - **Models (overtopping):**  
    - Run both models with identical inputs; collect 5th–95th percentile ranges.  
    - Output: Intervals \( I_{M1}, I_{M2} \). Combine via convex hull: \( I_M = [\min(M_{l}), \max(M_{h})] \).  
  - **Experts (elicited):**  
    - Take convex hull of expert ranges: \( I_E = [\min(E_l), \max(E_h)] \).  
  - **Combine Sources:**  
    - Calculate intersection: \( I_{\cap} = [\max(d_l, M_l, E_l), \min(d_h, M_h, E_h)] \).  
    - If \( I_{\cap} \) non-empty, set \( \mathcal{I} = I_{\cap} \).  
    - If empty, set \( \mathcal{I} = [\min(d_l, M_l, E_l), \max(d_h, M_h, E_h)] \) (convex hull).  
  - **Costs:**  
    - Intersection: Tight but may exclude valid scenarios if sources misaligned.  
    - Convex hull: Conservative, captures all uncertainty but may overwiden.  
    - *Output:* Crest height interval \( \mathcal{I} \) and set of distributions \( \mathcal{S} \) = all distributions with support within \( \mathcal{I} \).  

  **Step 2: Update with New Evidence**  
  *(Technical; 0.3 analyst-days)*  
  - **New data (e.g., extended gauge record):**  
    - Recompute \( I_D \) with expanded dataset.  
    - Rebuild \( \mathcal{I} \) as in Step 1.  
  - **Diagnose Widening:**  
    - If \( \mathcal{I} \) widens, check:  
      - Genuine: New data/model conflict increases uncertainty (e.g., new extremes).  
      - Symptom: Initial \( \mathcal{I} \) was over-large (e.g., experts/models were overly conservative).  
    - Test: Compare new \( I_D \) to original. If new \( I_D \) narrows but \( \mathcal{I} \) widens, blame initial overly wide non-data sources.  

  **Step 3: Publish Single Figure for Downstream Rule**  
  *(Normative hand-off to committee; 0.1 analyst-days)*  
  - Compute interval of possible means \( \mathcal{I}_\mu = \mathcal{I} \) (since \( \mathcal{S} \) includes Dirac distributions).  
  - **Single figure:** Midpoint \( \mu^* = \frac{\mathcal{I}_\mu^{\text{min}} + \mathcal{I}_\mu^{\text{max}}}{2} \).  
  - **Rationale:** Minimizes maximum regret under symmetric loss. Publish \( \mu^* \) with \( \mathcal{I}_\mu \) in documentation.  

  **Step 4: Decision Criteria Selection**  
  *(Normative hand-off to committee; 0.2 analyst-days)*  
  - **Input:** \( \mathcal{I} \), threshold \( T \), decision options (e.g., "upgrade wall", "do nothing").  
  - **Rules:**  
    - **Worst-case (maximin):** Act if \( \mathcal{I}^{\text{max}} > T \). Avoids catastrophic failure.  
    - **Admissibility:** Reject options dominated in all scenarios (e.g., upgrade if \( \mathcal{I}^{\text{min}} > T \)).  
    - **Maximality:** Reject options inferior under *some* distribution in \( \mathcal{S} \) (requires loss function).  
  - **Committee Role:** Choose rule based on risk tolerance. Escalation required if \( \mathcal{I} \) straddles \( T \).  

  ---

  ### Output Format (One Page)  
  | **Site**        | Data Interval | Model Interval | Expert Interval | Combined Interval | Single Figure |  
  |-----------------|---------------|----------------|-----------------|-------------------|--------------|  
  | *Example*       | [1.5, 2.5] m  | [2.0, 2.8] m   | [1.8, 2.7] m    | **[2.0, 2.5] m**  | **2.25 m**   |  
  | **Threshold**   | 2.3 m         |                |                 |                   |              |  
  | **Decision**    | Straddles T: Committee must choose action (Step 4). Single figure suggests compliance (2.25 < 2.3). |  

  ---

  ### Case Analyses  

  #### Case 1: Wall Upgrade (Interval Straddles Threshold)  
  - **Inputs:**  
    - Data: [1.5, 2.5] m  
    - Models: [2.0, 2.8] m (disagree structurally)  
    - Experts: [1.8, 2.7] m (barely intersecting)  
  - **Combined Interval:**  
    - \( I_{\cap} = [\max(1.5, 2.0, 1.8), \min(2.5, 2.8, 2.7)] = [2.0, 2.5] \) m.  
  - **Output:**  
    - \( \mathcal{I} = [2.0, 2.5] \) m, \( \mu^* = 2.25 \) m.  
    - Threshold \( T = 2.3 \) m → Straddles \( T \) (2.0 < 2.3 < 2.5).  
  - **Decision:**  
    - Single figure (2.25 m) suggests compliance (2.25 < 2.3), but worst-case (2.5 > 2.3) requires upgrade.  
    - **Committee must choose:** Escalate due to straddling. Admissibility rejects "upgrade" (since \( \mathcal{I}^{\text{min}} = 2.0 < T \)), but maximality may demand upgrade if flooding loss > upgrade cost.  

  #### Case 2: Reanalysis with New Data (Widening Interval)  
  - **Original (6 wks ago):**  
    - Data: [1.8, 2.2] m → Combined \( \mathcal{I} = [2.0, 2.2] \) m, \( \mu^* = 2.1 \) m.  
  - **New Data (10 yrs added):**  
    - Data: [1.7, 2.7] m (widened due to storm events).  
    - Models/experts unchanged: \( I_M = [2.0, 2.8] \) m, \( I_E = [1.8, 2.7] \) m.  
    - \( I_{\cap} = [\max(1.7, 2.0, 1.8), \min(2.7, 2.8, 2.7)] = [2.0, 2.7] \) m.  
  - **Output:**  
    - \( \mathcal{I} = [2.0, 2.7] \) m (widened), \( \mu^* = 2.35 \) m.  
    - Threshold \( T = 2.3 \) m → Now \( \mu^* > T \) (2.35 > 2.3), suggesting non-compliance.  
  - **Diagnosis:** Genuine widening (new data reveals higher extremes).  
  - **Consequence:** Committee sees widening as "failure," but procedure correctly updates uncertainty. **You must deliver:** Non-compliance due to new evidence, requiring costly upgrade.  

  #### Case 3: Minor Culvert (Apparatus Adds No Value)  
  - **Inputs:**  
    - Data: [1.2, 1.3] m (long record, low uncertainty)  
    - Models: Both output 1.25 m → \( I_M = [1.25, 1.25] \) m.  
    - Experts: [1.22, 1.28] m (narrow, agreeing)  
  - **Combined Interval:**  
    - \( I_{\cap} = [\max(1.2, 1.25, 1.22), \min(1.3, 1.25, 1.28)] = [1.25, 1.25] \) m.  
  - **Output:**  
    - \( \mathcal{I} = [1.25, 1.25] \) m, \( \mu^* = 1.25 \) m.  
  - **Conclusion:**  
    - No added uncertainty; single figure matches conventional mean. **Apparatus skipped** with no loss.  

  ---

  ### Systematic Limitations and Stopping Points  
  1. **Non-Intersecting Sources:**  
     - If data/models/experts fundamentally disagree (e.g., \( I_{\cap} \) empty), \( \mathcal{I} \) becomes [min, max] of all inputs. This is uninformative; stop and demand new data or structured expert judgment reconciliation.  
  2. **Widening on Update:**  
     - Procedure cannot "sharpen" intervals if new data conflicts with prior models/experts. Stop when interval width exceeds engineering tolerance (e.g., > 15% of threshold).  
  3. **Decision Straddling:**  
     - Worst-case/admissibility may conflict irreconcilably. Stop and escalate to committee with explicit loss functions.  
  4. **Low-Stakes Sites:**  
     - Skip full procedure if data interval width < 5% of threshold (Case 3). Use conventional mean.  

  **Final Advice:** This procedure exposes uncertainty rather than hiding it. Use when stakes justify complexity (e.g., coastal defenses). For minor sites, default to guidance. Escalate strategically—committee resentment is preferable to unacknowledged risk.
