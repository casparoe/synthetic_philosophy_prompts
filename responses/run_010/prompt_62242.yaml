  I should also consider the user's identity. They’re likely a biologist or researcher in a related field, given their reference to "their own corner of biology" providing awkward data. They’re dealing with this debate professionally, needing a clear framework to position their work. Their unspoken need might be to navigate these philosophical debates without getting bogged down, or to find a productive way to contribute that transcends the camps.

