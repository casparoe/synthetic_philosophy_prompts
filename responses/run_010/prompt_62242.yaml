  The user’s working hypothesis is that these groups are addressing different questions. I should check if that holds. The causal/historical question is about why a specific codon produces a particular amino acid, which involves evolutionary history and mechanisms. The structural/semantic question is whether the relationship between codon and amino acid resembles a symbolic code. If the camps are focused on different aspects, then their arguments might not directly conflict. For instance, deflationists might dismiss semantic talk because they're focused on physical mechanisms, while code proponents look at the system's structure.

  Next, considering the user’s mention of recoded genomes. If grad students can reassign codons and create functional bacteria, that demonstrates arbitrariness and the role of the translation apparatus. But does it settle the debate? For the code camp, it's strong evidence. For Maynard Smith, it shows evolved signaling can be engineered. Deflationists might argue it's just modified chemistry. So the recoded genomes don't resolve the deeper disagreement about semantics versus physics.

