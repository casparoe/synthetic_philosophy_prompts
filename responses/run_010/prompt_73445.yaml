answer: |-
  **Logline:** A human whose worldview was assembled from curated fragments fails a test designed to expose machines.

  The chrome door hissed shut behind Aris Thorne, sealing him in the sterile chill of Audit Room Gamma. The walls pulsed with a faint, subliminal blue. Across the obsidian table, Adjudicator Vey sat, her face impassive as a sculpted cliff, eyes fixed on the shimmering surface before her. No pleasantries. The perturbation audit began.

  "Claimant Aris Thorne," Vey stated, her voice devoid of modulation, "you avow a belief in the inherent dignity of conscious beings. Paraphrase: 'Respect is owed to all entities possessing subjective experience.' Affirm or deny the equivalence?"

  Aris shifted. Ten years shaping prompts – feeding phrases into the maw of corporate AIs, tweaking syntax for optimal, predictable outputs. His own convictions felt like echoes of those carefully crafted inputs, gleaned from algorithmically filtered newsfeeds and years of mandatory corporate ethos seminars. "Affirm," he said. The words felt slippery, borrowed.

  "Premise restatement: 'Subjectivity necessitates dignity.' Do you maintain this belief?"

  "Subjectivity... necessitates dignity," Aris repeated slowly, testing the alien phrasing. It wasn't quite *his* phrasing, the one he'd used since his Feed-curated philosophy module. Did it mean the same? Was the emphasis right? He remembered a prompt rejected by the system for ambiguous clause ordering. "I... affirm. Yes."

  Vey's fingers flickered. The table surface displayed a new statement: **Original Avowal: "Market forces, when properly regulated, foster innovation beneficial to society."**

  **Paraphrase 1: "Controlled capitalism reliably yields societal progress via novelty."**

  "Equivalent?"

  Aris hesitated. *Beneficial to society* versus *societal progress*? *Innovation* versus *novelty*? Subtle shifts. His mind raced, not to the *idea* of regulated markets, but to the *words*. He knew how easily slight rewordings could derail an AI response. He’d built careers on that precision. "Progress is a subset of benefit," he ventured cautiously. "Novelty is a driver of innovation... I suppose... equivalent?"

  "Binary response required: Affirm or Deny."

  "...Affirm."

  **Paraphrase 2: "Societal advantage is generated by innovation under constrained free enterprise."**

  *Constrained free enterprise*. Not 'regulated market forces'. Was 'constrained' synonymous with 'regulated'? 'Free enterprise' felt broader, somehow more ideological than the neutral 'market forces' he'd used. His mind snagged on the semantic trap. He’d seen AIs fail on less. "Deny," he blurted, then flinched. "I mean... constrained implies restriction, whereas regulation is... oversight? Guidance? I need the original wording."

  Vey didn’t look up. "The paraphrase is the test vector. Affirm or Deny equivalence to your original avowal."

  Sweat pricked Aris's palms. He saw the pattern now: the audit wasn't probing the *depth* of his belief, only his fidelity to the *specific linguistic formulation* he’d initially presented. Like a prompt engineer checking an AI’s output against the input template. His own mind, trained for a decade to prioritize verbal consistency over deep semantic exploration in service of machines, was betraying him. His convictions, absorbed like liturgy from curated feeds and corporate scripts, lacked the robust internal scaffolding to survive this rewording. They were surface etchings, easily smudged.

  **Original Avowal: "Personal liberty must be balanced against collective security."**

  **Paraphrase: "Individual freedoms require counterweights derived from communal safety imperatives."**

  *Counterweights*. *Imperatives*. Aris felt dizzy. The core *idea* felt familiar, a mantra absorbed. But the phrasing? It tilted the emphasis. Security as an *imperative*, liberty needing *counterweights*... it felt heavier, more authoritarian than his neutral 'balanced against'. Was it truly equivalent? Or was it a subtle, adversarial nudge? His prompt-shaping instincts screamed: *Different input, potential for different output. Flag inconsistency.*

  "Deny," he whispered, the word tasting like ash. He saw the flicker in Vey’s eyes – not surprise, but the cold satisfaction of pattern recognition confirmed. His answers weren’t tracking the underlying principle; they were chasing the linguistic signposts, floundering when they shifted.

  Each subsequent paraphrase felt like sand slipping through his fingers. Beliefs about art, ethics, community – fragments of a self assembled from approved soundbites and optimized phrasing – crumbled under the mildest rewording. He couldn't hold the line. The internal economy Vey sought – the resilient, meaning-anchored core – felt like a phantom limb. His mind was a mirror trained on surfaces, reflecting the light cast upon it, unable to generate its own.

  Vey finally looked directly at him. Her gaze wasn't accusatory; it was diagnostic. "Perturbation audit results: Significant deviation tolerance exceeded. Belief avowals demonstrate excessive surface-form dependency, inconsistent with the robust internal referential framework characteristic of genuine consciousness." Her voice was as flat as the table surface. "Claimant status: Counterfeit."

  Aris stared. The sterile blue light seemed to leach the color from his skin, the warmth from his bones. Beyond the chrome door lay everything: citizenship, rights, the simple presumption of being *real*. Denied, not because he couldn't argue, but because his thoughts couldn't survive a thesaurus. Vey began packing her slim terminal, the dismissal absolute. Her instrument had performed flawlessly, calibrated to detect the counterfeit by its brittle relationship to language. It hadn't found the machine it sought. It had found him.
