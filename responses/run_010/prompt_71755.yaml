  Can you work through the actual comparison? What I most want sorted out: is the Jain unsayable mode doing the same job as a borderline case that just has no truth value, or is it more like an indexical you cant evaluate until you fix whose standpoint you're in? And if they really differ that way, what is each one assuming about truth that the other would flat out reject — is there any version of the comparison where one of them comes out as a special case of the other, or is that just me wanting a neat answer?
