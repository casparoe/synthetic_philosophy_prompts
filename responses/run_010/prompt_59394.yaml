prompt: |-
  I'm in my third year and I have to hand in a one-page statement of my views on truth for a seminar next week, and I'd rather find out now which bits don't fit. Here's the package:

  1. I'm a deflationist. What 'true' does is let me endorse claims I can't list one by one; past the equivalence schema there's no nature to it, nothing to analyse.
  2. I'm perfectly happy saying beliefs are made true by the world — my belief that snow is white is true in virtue of snow being white — and I don't mind calling truth a property.
  3. Truth is the norm of assertion. What makes asserting the practice it is, rather than just making noises, is that you're answerible to the truth of what you say. That's the whole point of having the word.
  4. I do lean on a no-miracles style argument for scientific realism: the best explanation of why our theories keep working out is that they're true, and truth is doing real explanatory work in that sentence.
  5. I want to keep saying there are truths nobody can express, maybe truths no possible language could capture.
  6. Justification, unlike truth, does have a nature — I'm a reliabilist about it.

  Go through these as an audit rather than a lecture: which pairs actually pull against each other and which only look like they do, ranked by severity, with the cheapest fix for each and what that fix costs me. Then tell me which single revision would clear the most. Bottom line in your first sentence — which commitment has to go — then the reasoning, no preamble and don't read my list back at me. And say what would change your mind: which of these you'd rank differently if some assumption I haven't spotted turns out to be load-bearing, or where your own reasoning is most likely to break down.
