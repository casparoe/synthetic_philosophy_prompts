  ### Remarks for the Kettle River Theater Ribbon-Cutting

  Good afternoon. Thank you for being here on this exciting day. First, to our generous donor—your gift isn’t just a building. It’s a statement. A statement that Kettle River deserves beauty, opportunity, and a place where our young people can dream bigger. This theater is a marvel. It will host stories from across the country. It will give our high school drama students something they’ve never had: a real stage with real lights to learn their craft. That’s priceless.  

  Now, I grew up here. Like many of you, I know the August Pageant in my bones. Sixty years on a flatbed trailer under the stars. Dale playing three roles since the Carter administration. Blown lines, bad acting, and that painted canvas backdrop. It’s not polished. But it’s ours. Everyone in town knows exactly where they sat each year. Lately, there’s been talk that this new theater means the Pageant must change—move indoors, get “fixed,” become something slick. That worries people. Because the Pageant isn’t broken. It’s just different. And that difference matters.  

  Let me share an idea from an old debate about theaters. It started with a letter arguing that a theater isn’t good or bad by itself. It depends entirely on the place it’s in. What works for a giant city might crush a small town. Why? Because a theater should reflect what’s already there—the customs, the scale, the way people live together. Otherwise, it replaces instead of adds. So we must ask: What does Kettle River need? What are we already?  

  This theater will bring professionals and new stories. That’s thrilling for our drama students. They’re right to be excited. This stage will teach them skills they’d never get on a flatbed. But here’s another thought from that same debate: Theater’s power isn’t to correct or improve us. It’s to please us. It makes us cheer for the charming schemer and laugh at the honest outsider. It flatters what we already find funny or admirable. It rarely challenges it. That’s not a flaw—it’s just how theater works. But the Pageant? It’s not about flattery. It’s about us playing ourselves and our grandparents. It’s about the year Mrs. Jenkins forgot her lines and the whole audience whispered them back. It’s raw. It’s real.  

  There’s a deeper worry too. That letter described a strange thing: hundreds of people sitting silently in the dark, watching strangers pretend to be someone else for money. It turns neighbors into spectators. It replaces participation with observation. At the Pageant, there are no strangers. The actor is your cousin. The set is held up by your mechanic. You’re not just watching—you’re part of the thing.  

  The writer of that letter offered an alternative—not a ban, but a festival. Outdoors. No stage. Just people circling a stake in the ground, singing, dancing, being the spectacle together. It’s a beautiful idea. But let’s be honest: that “everyone’s the show” spirit isn’t always kind. If your family didn’t join in, it could make you feel like an outsider. Community isn’t magic. It takes work.  

  So where does that leave us? With a world-class theater. With a sixty-year tradition. And with a town that loves both. We don’t need to choose. We can have both—if we’re deliberate. Here’s my proposal.  

  First: The Pageant stays exactly where and how it is. August. Fairgrounds. Flatbed trailer. Free. No lights, no tickets, no “fixing.” That’s non-negotiable. It belongs to everyone.  

  Second: This theater creates something new—a Winter Festival. Every February, when the fairgrounds are frozen, we use this stage for a show written, acted, and built by Kettle River. The high school drama students lead it. They collaborate with the Pageant committee and the arts managers. We hold open workshops—anyone can join. We use the fly space and lighting grid to make it spectacular. Tickets help cover costs, but free for all contributors and students.  

  To make this work, we form the Kettle River Arts Council—five people: the Pageant chair, the high school drama teacher, the arts management rep, a town council member, and a student. They meet monthly, starting September 1. Their job: Run the Winter Festival, ensure it’s open to all, and publish participation rules by October. No auditions—just sign-ups. That way, we avoid cliques.  

  This building gives us growth without losing our roots. The Pageant remains our August heartbeat. The Winter Festival becomes our February gift to ourselves. Both celebrate this town.  

  So thank you again for this incredible gift. Let’s use it to honor who we are—and who we’re becoming. Let’s keep the Pageant alive. And let’s build something new. Together.

  ---

