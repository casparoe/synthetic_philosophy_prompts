prompt: |-
  AP econ, my teacher walked us through Friedman's claim that you should judge a theory only by how well its predictions match experience, and that complaining the assumptions are unrealistic is just missing the point (I've seen this called the F-twist). I mostly buy it, but I made up a case I can't shake: a model of which grocery store people shop at assumes every shopper does flawless mental math on price-per-ounce, and it nails the store-choice data it was built on. Then a new store opens across town and the model's prediction is way off.

  So: what's your actual credence, as a number, that the F-twist is right as stated — that the realism of a theory's assumptions is genuinely irrelevant to whether the theory is a good one, and predictions are the only thing that matters? Then decompose it for me. Roughly: how much rides on whether "realistic" even has a clear meaning for an assumption like that one, how much on whether you can score predictive accuracy at all without first settling which situations the theory is supposed to cover (mine looked great right up until the domain shifted), how much on whether idealizing in physics (frictionless pulley, massless string) is the same kind of move as idealizing about shoppers' minds, plus whatever other sub-questions you'd add. Give each a rough probability and a sentence of justification, show how they combine, then say which one your total is most sensitive to and what evidence or argument would move it.

  If you think I'm asking for fake precision here, or the setup is confused in some way, just tell me plainly instead of playing along.
