answer: |-
  Here's the procedure, structured as a sequence of questions to ask in order, embedded in prose. Think of it as a decision tree you walk through verbally with the committee. Start with the disputed term and a concrete example causing the fight. The goal is to force apart two distinct questions: "Would we still call it X if we discovered new facts about *this* world?" (epistemic) versus "Would we call something X in a *different* world where its properties changed?" (metaphysical). Where these answers diverge, you've hit a policy choice, not a factual dispute. Settled answers require near-unanimous intuition; disagreement means moving to the next step or flagging a policy vote.

  **The Procedure:**

  First, establish the anchor: Ask the committee to recall the original intent or "baptism" of the term. What problem was it solving? What real-world examples (products, processes, hazards) was it coined to describe? Get agreement on this historical core – it’s the fixed point we’ll test against. If there’s no consensus on the core purpose, stop: the term is fatally ambiguous, and you should retire it or replace it with a very specific test method plus number (Outcome 4).

  Second, the discovery question (Epistemic - Holding the World Fixed): Pose a scenario: "Suppose tomorrow, we discover something fundamental we didn't know before about the stuff we've *always* called [Term]. Specifically, about this [concrete example from the dispute]. [Insert the relevant new discovery here – e.g., its mechanism isn't what we thought, its composition has a minor unexpected element, its performance differs slightly under a new ultra-sensitive test]. Crucially, does this discovery mean that the stuff we've been calling [Term] all along *wasn't actually* [Term]? Or does it mean it *was* [Term], but we just learned something new about it?" Listen for strong, shared intuition. A "No, it was still [Term]" answer suggests the term is tied to the *stuff itself* (constitution or a core property). A "Yes, it wasn't really [Term]" answer suggests it's tied to the *role/function* we thought it played. If the room is split or confused, note the disagreement and move on.

  Third, the alternate world question (Metaphysical - Holding Our Knowledge Fixed): Pose a different scenario: "Imagine a parallel world, identical to ours in all laws of physics and chemistry, except for one thing relevant to [Term]: [Change a key property – e.g., the chemical structure works differently but achieves the same result, or the typical substance has a different physical state]. In this world, is [describe the substance/result in this changed world] still [Term]?" Again, seek strong intuition. A "Yes" suggests the term is defined by the *role/function* (it does the job). A "No" suggests it's defined by the *constitution or intrinsic property* (it *is* that specific thing). Significant disagreement here signals the term likely bridges both concepts uncomfortably.

  Fourth, reconcile and classify: Map the answers to the two questions onto one of four outcomes.
  *   If both questions point strongly to **Role/Function** (Discovery: "Still [Term]", Alternate World: "Still [Term]" even with changed constitution): Define by **what it does** (Outcome 1: Define by Role). Use performance criteria. Admit this means the definition might need updating as technology changes.
  *   If both questions point strongly to **Constitution/Property** (Discovery: "Wasn't really [Term]", Alternate World: "Not [Term]" if constitution/property changes): Define by **what it is** (Outcome 2: Define by Constitution). Use compositional or mechanistic criteria. Admit this means novel things doing the same job might not qualify.
  *   If answers **conflict** (e.g., Discovery says "Still [Term]" [suggesting Role], but Alternate World says "Not [Term]" [suggesting Constitution], or vice-versa): The term is inherently ambiguous on this axis. You have a policy choice. Either:
      *   **Pick one axis** (Role *or* Constitution) for the definition based on regulatory need or practicality (Outcome 1 or 2), explicitly stating the choice, OR
      *   **Define by Measurement** (Outcome 3): Tie it rigidly to a specific, agreed test method and pass/fail threshold. This avoids the ambiguity but ossifies the definition. OR
      *   If the conflict is severe and consensus impossible, **retire the term** (Outcome 4).
  *   If **answers are unclear or fiercely disputed** at either Question 2 or 3, and reconciling them is impossible: This signifies the term lacks a stable core concept everyone shares. Retire it or define it strictly by measurement (Outcome 3 or 4).

  **Where it Misfires:** This works best for natural kind terms ("water") or functional terms ("flame retardant"). It struggles with purely evaluative terms ("durable", "safe") lacking a clear historical core or stable property. Lawyers might try to argue from precedent rather than intuition, derailing the thought experiment. Chemists might reject hypotheticals as unrealistic. The biggest misfire is when the committee fundamentally disagrees on the *original core purpose* (Step 1), making the whole exercise moot – that's a clear sign for Outcome 4 (retire/measure). It also relocates fights if people dispute *how* to frame the hypothetical scenarios themselves.

  **Applied to Your Terms:**

  1.  **Lead-Free (Current: < threshold X ppm):** Anchor: Avoiding lead toxicity/contamination. *Discovery Q:* Suppose definitive toxicology shows harm starts at X/10 ppm. Does this mean products previously called "lead-free" (containing X/2 ppm) *weren't actually* lead-free? Strong intuition: **No, they were still lead-free** – we just learned they aren't *safe*. Points to Constitution/Property. *Alternate World Q:* Imagine lead is completely non-toxic, inert. Is a coating with <X ppm lead still "lead-free"? Strong intuition: **Yes**. Also points to Constitution. *Outcome:* **Define by Constitution (Outcome 2)** – it's about the *amount of lead*, not the safety outcome. The safety aspect is a *separate policy decision* for the standard threshold, not part of the term's meaning. Future changes update the *standard*, not the retroactive meaning of "lead-free".

  2.  **Flame Retardant:** Anchor: Preventing or slowing ignition/spread of flame. *Discovery Q:* Suppose we discover a coating everyone called FR works via a totally novel, non-halogen mechanism. Was it *still* flame retardant? Role camp: **Yes** (it did the job). Constitution camp: **Maybe not** (if they fixated on halogens). *Alternate World Q:* Imagine a world where halogens don't exist. A coating using a different chemistry effectively prevents flame spread. Is it "flame retardant"? Role camp: **Yes**. Constitution camp: **Likely No**. *Reconcile:* **Conflict**. The term bridges role and constitution. *Outcome:* **Policy Choice.** Given the purpose (performance against fire), argue strongly for **Define by Role (Outcome 1)** using standardized performance tests. Forcing a halogen mechanism (Constitution) excludes innovation and ignores the core purpose (slowing fire). If constitution camp digs in, Measurement (Outcome 3 - specific test method) is the fallback.

  3.  **Water-Based (Sample: 55% water, 45% co-solvent):** Anchor: Distinguishing from solvent-borne coatings; lower VOC, water cleanup, specific drying/curing behavior. *Discovery Q:* Suppose we learn that identical performance & cleanup can be achieved with only 40% water and a superior co-solvent. Were coatings historically needing 55% *still* water-based? **Likely Yes** (they fit the historical profile). Points to Role. *Alternate World Q:* Imagine a coating uses a novel, non-aqueous liquid (not water, not traditional solvent) but it cleans up with water, has near-zero VOC, and dries/cures like traditional water-based coatings. Is it "water-based"? **Strong No** (it lacks water!). Points to Constitution. *Reconcile:* **Conflict.** *Outcome:* **Policy Choice.** The anchor emphasizes performance and practical handling. Argue for **Define by Role (Outcome 1)** – key performance characteristics (cleanup, VOC profile, drying). Set performance criteria acknowledging co-solvents are common. A strict water % (Constitution or Measurement) risks irrelevance if technology shifts. If performance divergence is the concern (e.g., high co-solvent behaves like solvent-borne), target *that performance* directly in the definition.

  4.  **Durable:** Anchor: This is the problem. What's the core? Long-lasting? Resists wear? Maintains appearance? Functionality over time? You *need* agreement here. If you can't get consensus on the primary purpose (e.g., "resists abrasion and weathering to maintain functional integrity for a defined service life"), **stop: Outcome 4 (Retire/Replace)**. Assuming you force an anchor: "Maintains required appearance and function under expected use for a substantial period." *Discovery Q:* Suppose a new, ultra-accelerated test shows Product A, hailed as durable, actually degrades much faster than expected in real-world use. Was it *really* durable? **Unclear/Disputed.** Depends on expectations. *Alternate World Q:* Imagine a coating survives 50 years in mild indoor use but dissolves in 1 week in harsh outdoor conditions. Is it "durable"? **Answer depends entirely on context/expectation.** *Reconcile:* **Persistent disagreement and lack of stable intuitions.** *Outcome:* **Durable is fundamentally evaluative and context-dependent. The procedure fails cleanly. Outcome 4: Retire the term "durable" for certification purposes.** Replace it with specific, measurable performance criteria tied to *intended service conditions* (e.g., "Abrasion Resistance: >10,000 cycles by Test Method Y"; "Weathering Resistance: Delta E < 2.0 after 2000 hrs QUV by Test Method Z"; "Functional Integrity: No cracking/delamination after 5 cycles of Freeze-Thaw by Test Method W"). Define the required service environment explicitly. This is the only way to avoid endless subjective fights. Bluntly: "Durable" as a standalone term is a lawsuit magnet; kill it and use numbers tied to tests.

  The key is forcing the two distinct questions. When intuitions align clearly, you get a definition path. When they conflict or are absent, you get a policy flag or a mandate to scrap/measure. Ten minutes is tight, but focusing ruthlessly on the two scenarios for the *specific* dispute example can cut through circular arguments. Good luck.
