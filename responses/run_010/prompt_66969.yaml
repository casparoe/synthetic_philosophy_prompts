answer: |-
  ## MEMORANDUM  
  **TO:** Clinical Risk Committee  
  **FROM:** Chair, Clinical Risk Committee  
  **DATE:** 24 May 2024  
  **SUBJECT:** Pathogen-Reduction Licence Recommendation & Decision Rule Clarification  

  ---

  ### BOTTOM LINE  
  1.  **This Quarter's Item:** Recommend licensing the pathogen-reduction step for **partial uptake (Option H)**. This option ranks best under both analysts' proposed decision rules (Expected Utility and Risk-Weighted Expected Utility with ρ(p)=p²) based on our agreed harm-unit metric and probability estimates.
  2.  **Standing Decision Rule:** Defer formal adoption of Risk-Weighted Expected Utility (RWEU) pending further committee deliberation and testing. Maintain Expected Utility (EU) as the default rule for next quarter, *supplemented by mandatory sensitivity analysis* on key probability estimates. The core disagreement requires deeper ethical and practical consideration.

  ---

  ### REASONING  

  **I. The Dispute: Expected Utility vs. Risk-Weighting**  
  *   **Analyst A (Expected Utility - EU):** Ranks options by multiplying each possible outcome's harm by its probability and summing. Uses our stipulated linear utility over harm-units.
      *   S: (0.01 * 40) + (0.99 * 0) = **0.40 harm-units/year**
      *   H: (0.003 * 40) + (0.997 * 0.25) = 0.12 + 0.24925 = **0.36925 harm-units/year**
      *   P: (0 * 40) + (1 * 0.75) = **0.75 harm-units/year**
      *   **Ranking: H (Best) > S > P (Worst)**
  *   **Analyst B (Risk-Weighted EU - RWEU ρ(p)=p²):** Argues we should be more averse to catastrophic risks (low probability, high harm). Uses ρ(p) = p² to *weight* the probability used in the calculation. Higher probabilities are downweighted, low probabilities (especially for high harm) are effectively upweighted. Calculation: `Harm * ρ(Probability of that Harm)`. Since ρ(p) < p for p<1, this inflates the perceived cost of low-probability harms.
      *   S: 40 * ρ(0.01) = 40 * (0.01)² = 40 * 0.0001 = **0.004 harm-units/year**  
          *(Note: The "nothing happens" state contributes 0 * ρ(0.99) = 0)*
      *   H: [40 * ρ(0.003)] + [0.25 * ρ(0.997)] = [40 * (0.003)²] + [0.25 * (0.997)²] = [40 * 0.000009] + [0.25 * 0.994009] ≈ [0.00036] + [0.2485] = **0.24886 harm-units/year**
      *   P: 0.75 * ρ(1.0) = 0.75 * (1)² = **0.75 harm-units/year**
      *   **Ranking: H (Best) > P > S (Worst)**

  Both agree H is best. The dispute centers on ranking S vs. P under the two rules.

  **II. Can Risk-Aversion Be Captured by Concave Utility? What Axiom is Surrendered?**  
  *   **Analyst A's Claim:** If we fear catastrophes more, we should have made our utility function *concave* (meaning each additional harm-unit causes more disutility). This would naturally make high-harm outcomes look worse without needing a separate risk-weighting function. A suspects B is either double-counting risk aversion or masking distrust of the 1% probability.
  *   **Analyst B's Rebuttal & The Independence Axiom:** B argues **convex risk-weighting (like ρ(p)=p²) captures something different than concave utility.** Concave utility makes *all* high-harm outcomes look worse, regardless of their probability. Convex risk-weighting specifically makes *low-probability* high-harm outcomes look worse relative to higher-probability outcomes, even if the expected harm is the same.
  *   **The Key Difference - Violating Independence:** The standard Expected Utility model relies on the **Independence Axiom**. This axiom essentially says that if you prefer Gamble X to Gamble Y, you should still prefer a mix of X with some other Gamble Z to the same mix of Y with Z. Risk-weighted expected utility (with a convex ρ(p)) **deliberately violates this axiom.** This allows it to express a specific kind of catastrophe aversion: a preference to avoid gambles where a large chunk of the risk is concentrated in a single, very bad, low-probability outcome, *even if the overall average (expected harm) is the same as a gamble where the risk is spread out*. No amount of concavity in the utility function can replicate this violation of Independence. B is correct on this technical point.

  **III. Is This the Allais Paradox?**  
  Your colleague is likely being loose, though perceptive. The classic **Allais Paradox** demonstrates violation of the Independence Axiom and involves specific shifts in probability mass between "common consequences". Our case shares the feature of Independence violation and involves sensitivity to how risk is distributed (concentrated catastrophe vs. spread-out cost), but the probability shifts and outcomes don't perfectly match the Allais structure. The *spirit* of sensitivity to probability concentration is similar, but it's not an exact instance of the Allais pattern.

  **IV. Is B's Risk Function Just Distrust in Disguise?**  
  *   **Analyst A's Worry is Serious:** It is plausible that a desire to use ρ(p)=p² stems from intuitive unease about the reliability of the 1% catastrophic risk estimate. Applying a convex risk-weighting significantly amplifies the perceived cost of that low-probability event, mimicking what higher probability estimates would do under standard EU.
  *   **The Right Response is Sensitivity Analysis, Not (Just) a Different Rule:** If the core concern is epistemic (trust in the numbers), the primary tool should be **sensitivity analysis**, not immediately switching decision rules. We should rigorously test how robust our conclusions (especially the S vs. P ranking) are to variations in the key probability estimates (e.g., the 1% for S, the 0.3% for H). Does H remain best if the catastrophic risk under S is 0.5%? 2%? If the risk under S is even slightly higher than 1%, EU might favor P over S. RWEU makes S look terrible even *at* 1%. We need to understand this dependence. **Recommendation:** Mandate sensitivity analysis on critical probability estimates for all future significant risk decisions, regardless of the decision rule used.

  **V. The Bundling Problem & Dynamic Choice**  
  *   **The Issue:** When I applied B's rule (ρ(p)=p²) to the *five-year licence term* as a single package, the result strongly favored P over S. This was driven almost entirely by the astronomically improbable (p ≈ 10⁻¹⁰) scenario of 5 catastrophic incidents in 5 years (40*5 = 200 harm-units). ρ(p) for this event is p² ≈ 10⁻²⁰, but 200 * 10⁻²⁰ is still a tiny number (2e-18). The real driver is the contrast between the fixed cost of P (0.75/yr * 5 yrs = 3.75 HU * ρ(1) = 3.75) and the ρ(p)-weighted cost of S's catastrophe risk over 5 years. Calculating RWEU over multiple independent years requires defining the joint probability distribution. Treating each year independently and summing the RWEU (as both analysts did) gives: S: 5 * 0.004 = 0.02; P: 5 * 0.75 = 3.75. Bundling the 5 years into one "mega-gamble" where catastrophe can happen 0 to 5 times is more complex. The RWEU calculation weights the probability of *each possible total harm*. The state "5 catastrophes" (Harm=200, p≈10⁻¹⁰) contributes 200 * (p)² ≈ 2e-18. The state "1 catastrophe in 5 years" (Harm=40, p≈5*0.01*0.99⁴ ≈ 0.048) contributes 40 * (0.048)² ≈ 40 * 0.002304 = 0.09216. Summing over *all* states (including 0 catastrophes) still yields an RWEU for the 5-year S bundle significantly lower than 3.75, favoring S over P. My initial calculation error likely involved either misdefining the joint probabilities or misapplying ρ(p) to joint events. **Conclusion:** Applying RWEU consistently (globally) to the whole package doesn't drastically change the S vs. P ranking under ρ(p)=p² compared to summing annual RWEU; S remains better than P. However, the theoretical point stands: RWEU can be sensitive to how decisions are bundled.
  *   **Dynamic Choice & "Drainage":** A valid theoretical objection to RWEU is that an agent applying it case-by-case to a sequence of identical, independent gambles might accept each individually (if the RWEU looks favorable) but would reject the whole package upfront (if the bundled RWEU looks bad). This could lead to being "drained" by a series of seemingly acceptable small risks that collectively represent an unacceptable catastrophe risk.
  *   **The Global Application Reply & Its Cost to Us:** Proponents of RWEU argue it *must* be applied globally to the entire set of relevant decisions at once. However, this poses severe practical problems for our committee:
      *   **Like Cases Alike:** We must make consistent decisions quarter by quarter. A global rule applied inconsistently across time violates this.
      *   **Changing Membership:** The "global" bundle of decisions stretches into the indefinite future, beyond the tenure of current members. Who defines and updates this bundle?
      *   **Boundary Problem:** What constitutes "the whole package"? Just pathogen risks? All blood product risks? All organizational risks? Defining the scope is arbitrary and contentious.
      Adopting RWEU would necessitate defining a clear, stable, and consensual scope for the "global" decision bundle – a significant challenge.

  **VI. Whose Risk Attitude Applies? The Legitimacy Question**  
  This is the most profound ethical question. We are making decisions involving:
  *   *Fixed Costs (Options H/P):* Borne by the organization (costing resources that could be used elsewhere for patient benefit) and potentially passed on, affecting healthcare budgets broadly.
  *   *Catastrophic Harm Risk (Options S/H):* Borne by unfortunate, identifiable transfusion recipients if an incident occurs.
  Using a convex risk-weighting like ρ(p)=p² expresses a strong societal aversion to catastrophic outcomes concentrated on a few, *even if* the total expected harm is the same as a diffuse risk. **Is this legitimate for a public body?**  

  *   **Potential Justification:** It *could* be legitimate if it reflects a **considered societal value judgment** that catastrophic events have a disproportionate social cost beyond the sum of individual harms (e.g., loss of trust in the blood supply, systemic disruption, profound community trauma). We are stewards of public trust and safety. Avoiding catastrophic loss of life in a single event, even if statistically equivalent in expected harm to smaller, dispersed events, might align with public expectations for a critical service like blood supply. However...
  *   **The Burden of Proof:** We have **not** established that this specific aversion (captured by ρ(p)=p²) *does* reflect a legitimate societal value relevant to blood safety. Our stipulated linear utility over harm-units explicitly avoided making judgments about the relative badness of different-sized incidents. Adopting RWEU now would implicitly override that prior deliberate choice to *not* encode catastrophe aversion in our utility metric (as A correctly points out). Legitimacy would require explicit deliberation and justification for *why* catastrophe aversion specifically warrants inclusion via the risk function, distinct from the disutility of harm itself.

  **VII. The Strongest Case for the Losing Side (Analyst B)**  
  *Analyst B's core argument, stated fairly:* "Our primary ethical duty is to prevent catastrophic failures of the blood supply, even if they are statistically rare. A single event harming or killing dozens of patients is unacceptable in a way that the same number of harms occurring sporadically over time is not – it represents a profound systemic failure and destroys public confidence. Expected Utility, especially with linear utility, is blind to this crucial distinction. It treats a 1% chance of 40 deaths identically to a certainty of 0.4 deaths spread across the population. This is morally and practically naive for a critical national infrastructure service. Risk-Weighted Expected Utility with a convex function like ρ(p)=p² is the minimal formal tool that allows us to explicitly prioritize the prevention of low-probability catastrophes over reducing higher-probability, diffuse harms with the same expected cost. Ignoring this concentration of risk is failing in our stewardship."

  **VIII. Recommendation & Rule for Next Quarter**  
  1.  **Approve Option H (Partial Uptake):** It is the best option under both decision rules using our current data.
  2.  **Defer Adoption of RWEU:** The ethical justification for incorporating catastrophe aversion via ρ(p)=p² requires explicit committee deliberation we have not undertaken. The practical challenges of global bundling are significant. EU remains the default.
  3.  **Implement Mandatory Sensitivity Analysis:** For the next quarter's item, and henceforth:
      *   Apply standard Expected Utility with linear utility as the primary ranking.
      *   **Require Sensitivity Analysis:** Test the robustness of the EU ranking to plausible variations (±50% or more, as appropriate) in the key *probability* estimates driving the decision, particularly any low-probability, high-harm estimates. Present results clearly.
  4.  **Consider Catastrophe Aversion Explicitly (If Needed):** If sensitivity analysis shows the decision is highly sensitive to a low-probability catastrophe estimate *and* the committee believes strong catastrophe aversion is normatively justified for that specific risk, then:
      *   **Option 1:** Revisit the utility function and *explicitly* agree on a concave form for that specific decision, documenting the justification.
      *   **Option 2 (If Utility Concavity is Deemed Insufficient):** Only then consider RWEU with a specific, justified risk function (not necessarily ρ(p)=p²) for *that specific item*, explicitly stating the rationale for catastrophe aversion and the chosen function, and acknowledging the bundling challenges.

  This approach maintains transparency, uses the agreed linear utility baseline, directly addresses epistemic uncertainty via sensitivity analysis, and forces explicit justification if catastrophe aversion is to influence a decision beyond what standard EU with sensitivity provides.

  ---  
  **Chair, Clinical Risk Committee**
