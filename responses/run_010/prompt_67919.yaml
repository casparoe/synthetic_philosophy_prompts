  - Dr. Aris Thorne (Hobbesian): Believes the problem is mutual fear and lack of enforceable commitments.
  - Dr. Lena Voss (Anti-Hobbesian): Believes the problem is misaligned objectives (the labs are optimizing for market share and speed, against their own researchers' values).

  The dialogue must:
  1. Be 1400-1800 words.
  2. Have real back-and-forth, with each speaker responding to the specific point just made.
  3. Have at least two instances where a speaker modifies their position in response to the other.
  4. Use the invented case of the three AI labs as the anchor.
  5. Show that both are competent and concede points when appropriate.
  6. End with some agreement that they were partly talking past each other, but without trading slogans.

  Structure:
