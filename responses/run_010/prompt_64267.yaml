prompt: |-
  next week I've got a 50-minute section, 22 first-years, whiteboard only — no slides, and the room's too small to move furniture around much. We're two weeks into personal identity: they've done Locke's prince and the cobbler, a chunk of Parfit, and most of them have settled into some version of "psychological continuity is what matters" and are feeling pretty pleased about it. Now I have to teach Dennett's "Where Am I?" from Brainstorms — the one where his brain gets lifted out, lives in a vat in Houston, and drives his body around by radio while the body goes off to Tulsa.

  Don't explain the story to me, I know it fine. Plan how I explain it.

  - what has to be in place before the question even bites for them. Do I open with the intuition that obviously you're wherever your brain is, or open cold with the surgery? Opening with the intuition seems to make them smug and then the story just confirms what they already said; opening cold seems to waste twenty minutes before anyone knows what's at stake. Tell me which, and what exactly goes in the first five minutes.
  - the one moment in the story to park the whole section on. My instinct is the backup — the second brain and vat getting switched on — but argue me out of it if that's the wrong hinge. And tell me how far to go: do they get the ending, or do I stop before it and make them supply it?
  - what I put on the board. I want some diagram or physical bit of business — maybe getting a student to point at where they are — that makes the question start to look like it's demanding the wrong kind of answer, instead of me just announcing that "where" is doing something odd. Describe what gets drawn, in what order, and what the students should notice without being told.
  - the misconceptions, in the order they'll actually surface, and the point in the sequence where I head each one off. The ones I'm braced for: they'll treat it as a straight brain-vs-body tug of war and want to vote; a couple will conflate it with the envatted-brain thing from epistemology and think Dennett is running a skepticism argument; somebody will say the duplicate doesn't count because copies never count. What's the one I'm not seeing that'll cost me the most time?
  - a single closing question that separates students who got the deflation from ones who just picked a team.
  - what I should flatly refuse to get into at this level, and how to say so without sounding like I'm dodging.

  Also: a good third of them are going to find the setup ridiculous — a brain with a radio in it — and I need the room to not turn into a comedy hour. Give me something to say or do in the first ten minutes that buys seriousness for the case without asking them to suspend anything they'd call common sense.
reasoning: |-
  Okay, let me tackle this philosophy teaching challenge step by step. The user needs a concrete plan for teaching Dennett's "Where Am I?" to first-years who are already comfortable with psychological continuity views. 

  First, considering how to start - opening with the intuition that "you're wherever your brain is" risks reinforcing their existing views, while jumping straight into the story might lose them. The best approach seems to be starting with a simple body-pointing exercise to surface the intuition subtly, then contrasting it with the surgery scenario. This should create productive tension within 5 minutes.

  For the key moment in the story, the backup brain activation is indeed the strongest hinge point. It forces students to confront the insufficiency of both body and brain location answers. I'll suggest stopping just before Dennett's resolution to let students wrestle with the implications first.

  The board work should visually map the components: body, brain vat, radio links. Having students repeatedly point to "where Dennett is" at different stages will make the question feel increasingly odd. The conceptual shift happens when they realize pointing can't resolve this.

  Anticipating misconceptions: the biggest hidden trap might be students interpreting this as supporting substance dualism rather than challenging the question's frame. I'll build in questions to surface this early. Other common issues like voting or skepticism concerns can be addressed through targeted questioning.

  For closure, asking "What work is 'where' doing here?" separates those who grasp the deflation from those stuck in location-thinking. And I'll firmly bracket any sci-fi plausibility debates by emphasizing the case's function as an intuition pump.

  To maintain seriousness, I'll reframe the radio brain not as tech speculation but as a tool for isolating variables in our concept of self. This keeps the focus philosophical while acknowledging the setup's strangeness.
answer: |-
  Here’s a battle-tested plan for maximizing impact in 50 minutes with whiteboard-only constraints:

  **Opening (Min 0-5): The Silent Hook**  
  1. **Draw:** A crude stick-figure body labeled "Body (Tulsa)", then a jar labeled "Brain (Houston)" with a radio wave symbol between them. *No explanation yet.*  
  2. **Cold Open:** *"Imagine: surgeons detach your brain, place it in a life-support vat in Houston, and install radios allowing it to control your body remotely. Your body is sent to Tulsa. Where are YOU?"*  
  3. **Poll Silently:** Point to Houston jar, then Tulsa body. "Show me." *Observe split.*  
  4. **Reframe:** *"Not 'what matters?' We've done that. This is literal: Pinpoint a location. Right now."*  
  *Why this works:* Forces concrete commitment immediately. The diagram bypasses verbose setup. "Literal location" prevents retreat to psychological continuity. The split creates tension.

  **The Hinge Moment (Min 20-35): Park on the Backup**  
  **You're right — the backup is the killer move.** Proceed like this:  
  1. Narrate up to the backup brain activation (Dennett staring at his original vat).  
  2. **Freeze Frame:** *"STOP. Backup brain in Houston activates. Original brain is inert in the vat. Body is still in Tulsa. Where is Dennett?"*  
  3. **Board Update:** Add second jar labeled "Backup Brain (Houston - ACTIVE)", cross out original brain jar ("INERT").  
  4. **Pressure Test:**  
     - *Option A: "He's with the active brain!"* → "But the inert brain is physically identical, just powered off. Is *he* gone?"  
     - *Option B: "He's with the body!"* → "But the body is now controlled by a *different* active brain. Same as before?"  
     - *Option C: "He's nowhere/split!"* → "What does 'where' mean if it can't be located?"  
  5. **DO NOT GIVE THE ENDING.** Stop at "I glanced at Yorick II..." Make *them* wrestle with the implications next week.

  **Board as Intuition Pump (Ongoing):**  
  - **Key Visual:** Maintain 3 entities (Body, Brain Vat 1, Brain Vat 2) with dynamic labels (ACTIVE/INERT).  
  - **Student Interaction:** At each stage, ask a *different* student: *"Point to Dennett."* After the backup: *"Point again. Why there? What changed?"*  
  - **Reveal Pattern:** When pointing fails consistently, circle "WHERE AM I?" and write "???" under it. *"Notice what happens when we demand coordinates. What’s breaking?"*

  **Misconception Triage (Order of Appearance):**  
  1. **"Just vote Body/Brain!"** (Min 5-10):  
     *Shut down:* "Hold the vote! First: What fact decides *for you*? ‘Control’? ‘Feeling’? ‘Memory’? Name the criterion *before* choosing." (Exposes arbitrariness).  
  2. **"This is Skepticism!"** (Min 15-20):  
     *Redirect:* "Is Dennett worried we’re *deceived*? Or is he asking how to *define* location for a self? Where’s the doubt?" (Contrast Matrix vs. Dennett).  
  3. **"Copies Don't Count!"** (During Backup, Min 30):  
     *Pressure:* "Why not? If continuity is psychological, isn't the backup continuous? If physical, isn't it identical matter?" Refuse "just because".  
  4. **THE HIDDEN TRAP: "So consciousness is a ghost!"** (Min 40-45):  
     *Crucial Intervention:* "Did we *add* a soul? Or did asking for a *single point* force us to invent one? Is 'where' demanding a ghost?" (This links deflation to the question’s flaw).

  **Closing Question (Min 48-50):**  
  *"If you *must* answer 'Where is Dennett?' after the backup activates, does giving GPS coordinates (Houston/Tulsa/Nowhere) solve the puzzle, or prove the question is broken?"*  
  - **Got Deflation:** Argue the question fails.  
  - **Picked Team:** Give coordinates + reason.  

  **What to BLOCK:**  
  - **"Is this tech possible?"** → *"Irrelevant. This is a *conceptual* probe. Does the *idea* break 'where'?"*  
  - **"What about the ship of Theseus?"** → *"Different puzzle! This isn't gradual change, it's duplication + switching."*  
  - **Detailed radio physics** → *"Assume magic reliable radios. We care about *meaning*, not bandwidth."*  

  **Buying Seriousness (Min 1-10):**  
  1. **Acknowledge Absurdity Early:** *"Yes, floating brains with radios are silly. But *why* is it silly? Because it reveals how flimsy our ‘obvious’ ideas about location are. The absurdity is the point – it isolates the confusion."*  
  2. **Anchor in Their View:** *"You think psychological continuity defines you. Great! So: When the *psychology* is here (Houston) controlling that (Tulsa), where’s the *you*? Your view *causes* this puzzle."*  
  3. **"Common Sense" Reframe:** *"Common sense says you're ‘behind your eyes’. This just takes that literally and stretches it. If that breaks, maybe ‘behind your eyes’ wasn’t about location at all."*  

  **Why this flow works:**  
  - **Pacing:** Diagram (0-2 min) → Intuition Poll (3 min) → Surgery Setup (5 min) → Dilemma 1 (Body/Brain - 10 min) → Backup (20 min) → Deep Dive (25 min) → Deflation (40 min).  
  - **Leverages Smugness:** Their psychological view *creates* the backup problem, making it their crisis, not yours.  
  - **Whiteboard Focus:** Entities + states (ACTIVE/INERT) are all you need. Student pointing provides the "aha".  
  - **Ends on the Cliffhanger:** They leave frustrated by "Where?" – which is Dennett’s goal.  

  **Tone Tip:** When they laugh at the vat, *smile knowingly*: *"Exactly! It’s ridiculous we need this to see the problem, isn’t it?"* Makes them feel clever, not dismissive.
