prompt: |-
  Last night I lost the better part of four hours to an argument with a friend that ended with neither of us moved, and left me holding a question I cannot answer, which is why I am writing to you.

  Her opening move was unremarkable: how do I know the Earth existed more than five minutes ago, rather than having come into being complete with all its apparent past? I played the obvious hand — memory, tree rings, starlight in transit, the geological record — and she played the obvious replies: memories can be implanted, the fossils and the starlight can have been installed along with everything else. But somewhere in the third round the shape of the exchange changed, and it is that change I want identified.

  What I noticed was this. Every test I offered had to be trusted *on precisely the point under dispute*: to use the tree rings as evidence I must already assume that traces of the past are traces of the past. So the doubt had no route by which it could be resolved — not a difficult route, but no route at all. Yet nothing my friend said was incoherent, and the proposition she doubted was not necessary or true by definition; it was, so far as I could tell, perfectly possible that she was right. And still her doubt did not behave like a doubt. It never touched what either of us did next: we went on talking, drinking tea, referring to last week, exactly as before.

  Then it spread, which is the part that struck me most. Having raised the five-minute question, she immediately wanted to press a second, ordinary question about whether I remembered a conversation correctly — and I found that I had no answer to the second one that did not depend on the material I had just conceded was unusable. Her own doubts lost their footing along with my claims. She could not keep the local question and press the global one; she had to choose, and she wanted both.

  The same configuration turned up a week later at work, in a meeting, without any scepticism in sight: a colleague argued that a certain dataset could not be trusted because it was produced by people with incentives to shape it, and then, three minutes later, cited a different output of the same pipeline as evidence for his own point.

  Now, here is what I think the thing is not, and I would like each of these near-misses dealt with rather than waved at. It is not self-refutation: my friend never contradicted herself. It is not question-begging, which seems to describe my answers rather than her question. It is not unfalsifiability in the usual sense, because the item under doubt was not a hypothesis competing with rivals — it was closer to something my other claims are measured against, so that dropping it would not mean adopting a competitor but losing the ability to have competitors. It is not a presupposition of the conversation in the sense of something the participants have granted and could retract. It is not the trilemma of infinite regress, circularity, and arbitrary stopping: the trilemma treats all three outcomes as failures, whereas here the stopping does not feel like a failure at all. And I know there is a famous gesture of holding up one's hands in response to this kind of challenge; it struck me as changing the subject, and I would like to know whether that is the right diagnosis of it.

  So: does this configuration have an established name, in epistemology or in the theory of argument? Which of the near-misses above is genuinely the closest, and on exactly what point does the described thing come apart from it? If there is no established name, coin one and define it, and then give me its edges. In particular: does the phenomenon attach to the proposition doubted, to the practice it sits inside, or to the act of doubting itself — and why does that choice matter? Must revision be impossible in principle, or does it also cover background items that could in fact be revised but never are (I spent years assuming a colleague was honest and was eventually forced to abandon that; the structure looked identical)? And what is the one test I can apply mid-argument, without philosophy, to tell this kind of doubt from an ordinary unresolvable one?

  If the concept belongs to a particular author or book, mention it in passing, but I am not after references — I want the carving. Please also tell me how confident you are in the identification you land on, and single out the one claim in your answer you are least sure of, the one I should distrust if I repeat it back to her.

  Your final line must be of the form \answer{...} containing only the name you settle on: an established term if one fits, otherwise "none established" followed by your coinage.
reasoning: |-
  Hmm, the user presents an intricate epistemological puzzle about a doubt that seems immune to evidence and yet doesn't functionally alter behavior. They've already ruled out several common philosophical categories like self-refutation or question-begging. The core paradox lies in how this "global" doubt about reality's age simultaneously invalidates all evidence while leaving practical actions untouched - and how it contagiously undermines "local" doubts too. 

  The user's workplace example confirms this isn't just philosophical playacting but a structural pattern in reasoning. Their demand for precision is formidable: they want to know whether the phenomenon attaches to propositions, practices, or acts of doubting itself, and why that distinction matters. The request for a "mid-argument test" suggests they need pragmatic tools, not just theory.

  Wittgenstein's hinge propositions come to mind immediately - those bedrock certainties that function as the "scaffolding" of thought. But the user explicitly rejects "presupposition of conversation" as insufficient, so I must emphasize how hinges are not voluntary assumptions but conditions for doubt itself. The colleague example shows even non-skeptical contexts rely on such hinges when shifting between trusting and distrusting the same data pipeline.

  For the coinage question, "foundational immunity" captures both the inaccessibility to evidence and the structural necessity. The confidence level is high on the hinge connection, but the "mid-argument test" portion feels riskiest - it attempts to operationalize Wittgenstein's often-poetic descriptions. If pressed, I'd retreat to the more established "hinge" terminology while admitting the test is interpretive.

  The user's razor-sharp analysis deserves matching precision: noting how hinges differ from presuppositions by being non-retractable, and why revision is possible for empirical beliefs (like the colleague's honesty) but not for framework conditions (like trust in memory). The key insight is that we don't "hold" hinge propositions - we inhabit them.
answer: |-
  This configuration is best described as **hinge propositions**, a concept developed by Ludwig Wittgenstein in *On Certainty* (though the term itself is more contemporary). It addresses a class of certainties that function as the "scaffolding" of our thought and inquiry—they are immune to evidentiary challenge precisely because they constitute the framework *within which* evidence and doubt operate.

  ### Addressing Your Near-Misses:
  1. **Not self-refutation**: Correct. Your friend's doubt doesn't entail a contradiction; it suspends the conditions for coherent assertion.
  2. **Not question-begging**: Your answers begged the question, but her doubt targets the *preconditions* for questions to be meaningful.
  3. **Not unfalsifiability**: The doubted proposition isn't a scientific hypothesis but the "riverbed" against which hypotheses flow.
  4. **Not presupposition**: Presuppositions are retractable (e.g., "The king is bald" assumes a king exists). Hinges are *constitutive*: doubting them collapses the language-game.
  5. **Not Agrippa's trilemma**: Stopping at a hinge isn't arbitrary; it's necessary for the regress/circularity to even begin. Hinges are where justification *rests*, not where it *stops*.

  ### Key Distinctions:
  - **Attaches to practice**: It is not about the proposition in isolation but its role in a "language-game" (e.g., trusting memory is woven into the act of doubting *anything*). This matters because it explains why revision feels impossible—abandoning the hinge abandons the practice itself.
  - **Revision**: Empirical beliefs (e.g., your colleague's honesty) can be revised because they operate *within* a hinge framework (e.g., "people generally report accurately"). Hinges themselves (e.g., "the past is real") are only revisable in catastrophic shifts of worldview, not piecemeal.
  - **The mid-argument test**:  
    **Ask: "Does doubting this *also* dismantle your ability to doubt other things?"**  
    If yes (e.g., doubting tree rings undermines all evidence, including her later question), it targets a hinge. Ordinary unresolvable doubts (e.g., "Was the car blue or green?") leave other inquiries intact.

  ### Why "Hinge Propositions" Fits:
  - They are **immune to justification** (your evidence requires the hinge to function).
  - They are **practically inert** (we act *from* them, not *on* them; tea-drinking continues).
  - They **propagate** (collapsing one hinge destabilizes adjacent ones, as when her local doubt failed).
  - They are **non-optional** (rejecting them isn't adopting a rival but losing the "world" in which rivals exist).

  ### Least Confident Claim:
  The assertion that hinges are *never* revised. Wittgenstein hints they can shift historically (e.g., oracles to science), but the mechanism is unclear. If pressed, retreat to: "Revision requires abandoning the entire language-game, not just the proposition."

  ### Final Classification:
  The phenomenon is established in epistemology as **hinge certainty**. No coinage needed—Wittgenstein's concept directly addresses your described structure. The "hands-up" gesture (e.g., G.E. Moore's "Here is one hand") fails because it treats hinges like empirical claims, missing their grammatical role.

  \answer{hinge propositions}
