  For the analysis table: Bratman clearly works because all his conditions (meshing subplans, mutual responsiveness etc.) are met procedurally. Gilbert fails precisely due to absence of joint commitment - no one can demand participation. Tuomela lands in I-mode since intentions remain individual ("I" not "we"). 

  The critical feature is the cultural norm of non-accountability baked into the garden setting. Remove that, and suddenly unilateral withdrawal might violate implicit expectations - collapsing into standard joint action territory. A Gilbertian would likely attack by arguing that Bratman's mutual responsiveness inherently requires commitment; my counter is that functional coordination can exist without normative bonds, much like improvised jazz.

  Word count is tight - need to prune the scenario to under 150 words while preserving all philosophical touchpoints. The exit condition must feel organic ("forgot my gloves" reads more natural than theoretical exit). For the rebuttal, emphasize that Bratman himself distinguishes between interpersonal obligations and intention structures.
answer: |-
  ### Scenario  
  A neighborhood community garden has a "drop-in work hour" every Saturday: no sign-up, no roster. Four regulars arrive independently. They notice the compost pile needs turning—a four-person job with pitchforks. Without discussion, each grabs a fork, positions themselves at cardinal points, and begins turning rhythmically. They adjust pace to match each other, pass tools smoothly when needed, and pause when someone takes a water break, resuming together. Common knowledge exists: each sees others acting to turn compost together, expects cooperation, and knows others see this too. If one leaves abruptly (e.g., "Just remembered an errand!"), others might sigh but accept it immediately—no rebuke is expected or given. The garden's explicit norm: participation is always voluntary, no strings attached.

  ---

  ### Analysis Table
  | **Account**       | **Verdict** | **Deciding Condition**                                                                 |
  |-------------------|-------------|----------------------------------------------------------------------------------------|
  | **Bratman**       | Satisfied   | Meshing subplans, mutual responsiveness, and common knowledge are all observably present and interlocked. |
  | **Gilbert**       | Not satisfied | No joint commitment: unilateral exit causes no perceived wronging; no standing to demand continuation. |
  | **Tuomela**       | I-mode      | Intentions are private ("I'll help turn compost now") + mutual belief, lacking group reason/collective commitment. |

  ---

  ### Critical Notes  
  1.  **Key Feature:** The garden's pre-established, explicit **norm of non-binding voluntary participation**. This structurally negates commitment without undermining coordination.  
  2.  **If Removed:** Without this norm, the case collapses. Adjacent neighbors coordinating spontaneously *would* typically imply implicit obligations, aligning Bratman with Gilbert/Tuomela on normative expectations.  
  3.  **Gilbertian Rebuttal & Survival:**  
      **Attack:** Gilbertians argue mutual responsiveness *requires* a joint commitment to stabilize intentions against conflicting preferences. Here, responsiveness is merely *contingent* on shared understanding of the norm, not a commitment *to each other*.  
      **Survival:** Yes. Bratman's conditions specify *how* coordination functions, not *why* it persists. The norm explains stability without interpersonal commitment—responsiveness is to the *situation* under known rules.
