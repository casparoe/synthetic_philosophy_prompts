prompt: |-
  I've been circling this fight for years via rationalist-adjacent summaries and never actually pinned it down, so help me pin it down. Compare the etiological / proper-function account of biological function — the Millikan-style line where a trait's function is whatever it was historically selected for — with the causal-role or dispositional account, the Cummins-style line where a trait's function is just its contribution to the capacities of whatever bigger system it sits inside. Skip the textbook intro. I want the actual disagreement: the cases where the two give different verdicts, and which one comes out right more often on those cases.

  Here's the test case I care about, and please treat it as the main event rather then a side quest. A synthetic-biology group builds a free-living cell top-down: every component's job is written into the design spec, but there's zero selection history, no ancestors, nothing that ever replicated before. Then the lab propagates it for ten thousand generations under a stable regime, and one of the designed parts — say a chaperone-ish protein — slowly gets co-opted into doing something nothing like its spec, and that new job is what's actually keeping the lineage alive. For each of the two theories tell me (a) whether the cell has any functions the moment it comes off the bioprinter, and if so where they come from given that no selection touched it; (b) what that protein's function is at generation ten thousand; (c) whether there's a specific moment where the answer flips, and if so what makes that moment special rather than arbitrary. Bonus points if you're willing to say the theories give different answers to (a) than most people assume.

  Second thing. I keep wanting to reach for a hybrid, so tell me whether it's worth having or whether I should drop it. Call it the load-bearing account: a trait's function is the causal role whose removal would cost the organism the most fitness in the environment it actually lives in right now, with selection history demoted to a prior or a tiebreaker for when the costs come out close. Is that a genuine third position or just causal-role with decoration on it? And does it dissolve the duplication problem and the novelty problem for etiological accounts, or does it only relocate them and then pretend the relocation was progress?

  Last bit, which is why I got here in the first place. People on my side of the fence say things like: a drive's function is what selection shaped it to do, not what it happens to be doing in a modern environment, and they use that to argue about mismatch and about what our values are really for. Does the etiological account actually license that inference, or is it smuggling in a claim about current utility that the theory doesn't own? And does the causal-role camp have any respectable comeback, something better than just insisting that functions are interest-relative?

  Bottom line in the very first sentence — which account you'd bet on, and the single reason, in one line — then the reasoning after it. No preamble, don't restate my question back at me, no bibliography. American English, please.
reasoning: |-
  Okay, the user is diving deep into the philosophy of biology, specifically the debate between etiological and causal-role accounts of function. They're not interested in textbook summaries but want the meat of the disagreement, especially in their synthetic biology test case. Let me unpack their query step by step.

  First, they described a scenario where a synthetic cell is designed from scratch with no evolutionary history. Then, over thousands of generations, a protein's role shifts. The key questions are: does the cell have functions right after creation, what's the protein's function later, and is there a non-arbitrary point where it changes? They also wonder about a hybrid "load-bearing" account and how these theories relate to arguments about evolutionary mismatch and values.

  Hmm, the user seems well-versed in rationalist circles but hasn't pinned down this debate. Their test case is clever—it pressures both theories. For the etiological view (Millikan), functions require selection history, so the fresh-off-printer cell has no *proper* functions. The designed purposes are just intentions, not biological functions. But at generation 10,000, after selection has acted, the co-opted protein's new role becomes its function. The flip point is when the trait's current prevalence is due to selection for the new effect. That's not arbitrary; it's when the new effect becomes the reason the trait persists. 

  For the causal-role view (Cummins), functions are about current contributions. So the cell has functions immediately—each part's role in the system as designed. Later, the protein's function is whatever causal role it's performing then. No flip moment; it's always about current disposition. 

  The user's hybrid "load-bearing" idea ties function to current fitness cost if removed. But this feels like causal-role with a fitness twist. It doesn't fully solve problems like duplication (two identical traits, which one is functional?) or novelty (new traits without history). It relocates issues but doesn't fix them. 

  On the values point: etiological accounts *do* license the "mismatch" argument. If a trait was selected for X but now does Y, its function is still X, highlighting potential maladaptation. Causal-role theorists might counter that functions are context-dependent and observer-relative, but that doesn't address the normative thrust of the mismatch concern. 

  User’s deeper needs: They likely want clarity to apply this to real debates (e.g., evolutionary psychology, ethics). They might be frustrated with vague hybrid attempts and seek a decisive stance. Also, they’re testing whether etiological functions justify claims about human values, which is high-stakes in rationalist circles. 

  Bottom line: Bet on etiological. Why? It captures the normative "should" in biology—why traits exist—while causal-role is descriptive. The synthetic cell case shows this: only after selection does the protein gain a biological function, separating designed intent from evolved purpose. That distinction matters for claims about mismatch and what traits are "for."
answer: |-
  **Bottom line:** Bet on etiological. It captures the normative "should" in biology—why traits exist—while causal-role is just descriptive.

  **Your Test Case:**
  1.  **(a) At Bioprinting:**
      *   *Etiological:* **No biological functions.** Design specs are *intentions*, not selection history. Without ancestors and replication under selection, there's no proper function. The cell is a complex artifact, not a biological organism with teleofunctions.
      *   *Causal-Role:* **Yes, functions exist.** The designed parts contribute to the capacities of the whole system (survival, replication, etc.) as per the design. The chaperone's function is its spec'd job. Functions arise from current systemic contribution, not history.
      *   *Bonus:* Causal-role *says yes*, etiological *says no*. Common intuition ("it's designed to do X!") aligns more with causal-role initially, but etiological argues this confuses design intent with biological function.

  2.  **(b) At Gen 10,000:**
      *   *Etiological:* The protein's function is **the new job it was co-opted for and is now maintained by selection.** Its original designed role is irrelevant history.
      *   *Causal-Role:* The protein's function is **its current causal contribution to the cell's capacities** – which is the new job. Its original design is also irrelevant to current causal role.

  3.  **(c) The Flip Moment:**
      *   *Etiological:* **Yes, there's a non-arbitrary flip.** It flips when the *new effect* becomes the **predominant reason the trait is maintained** in the population by selection. This occurs when the new effect explains the trait's differential replication and persistence *more than* drift, linkage, or the original effect. It's special because selection *acting on that effect* now explains the trait's presence.
      *   *Causal-Role:* **No flip moment.** The function is always the current causal contribution. It changes gradually as the protein's role changes. Any "flip" is just an observer labeling a significant shift in causal role, not a change in the *kind* of property function is.

  **The Hybrid ("Load-Bearing"):**
  *   **It's causal-role with heavy decoration.** The core move is defining function by *current* systemic contribution (fitness cost now). History as a tiebreaker/prior is an add-on.
  *   **Relocates, Doesn't Dissolve:**
      *   *Duplication Problem:* If two identical traits exist, removing either costs fitness. Which one "has" the function? You need history or design to pick one as the "real" function bearer. Your account needs the tiebreaker it demotes.
      *   *Novelty Problem:* A brand-new, non-selected mutation doing something beneficial *now* has a function (high fitness cost if removed). Etiology says it doesn't (yet) have a *proper* function. Your account grants it one immediately based on current utility. This *is* different from etiological, but it loses the normative "why it's there" force.

  **Mismatch & Values:**
  1.  **Does Etiology License the Inference? Yes, directly.** The etiological function *is* "what selection shaped it to do." Claiming a trait is dysfunctional or mismatched *means* it fails to perform its etiological function in the current environment. The "values are *for* X" argument hinges on the claim that psychological mechanisms have etiological functions shaped by selection, which may misfire now. The theory *defines* function as the selected effect, separating it cleanly from current utility.
  2.  **Causal-Role Comeback:** The best comeback isn't just "interest-relative," but **"normatively inert."** Causal-role can describe *what* a trait does now and its *current* contribution to fitness/survival. But it lacks the resources to say what the trait *should* be doing or what it's *supposed* to do based on its history. It can identify *current* malfunction (failing its current causal role) but not *evolutionary* mismatch (failing its historical purpose while possibly aiding current fitness). For the values argument, causal-role can only say "these mechanisms currently contribute to X," not "they were *shaped for* X, therefore X is their *purpose*."

  **The Single Reason:** Etiology explains *why* traits exist in normative biological terms ("should"); causal-role only describes *how* systems work. Your synthetic case proves the point: the *only* thing separating the printer-fresh cell (no bio-function) from the adapted lineage (has bio-functions) is the history of selection acting on replication.
