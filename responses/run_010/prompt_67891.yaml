prompt: |-
  I run grants at a mid-size private foundation. About a year ago our board moved from funding on expressed need to funding on expected wellbeing produced per dollar, and the change has started producing applications that break the model.

  Every applicant now submits an estimate of wellbeing-per-dollar on our internal scale. The median this cycle is about 1.0. A handful of applications claim 40, 80, and in one case 300. Some of those are plainly just efficiency claims — a cheap procedure, high volume, durable effect, low overhead. But two of them claim the multiplier because of something about the recipients rather than the intervention: one serves a few hundred people who've had a particular neural implant and report that ordinary pleasures now feel dramatically more intense than they used to; the other serves about ninety people with a rare condition and claims per-person welfare gains that no ordinary population could match. And a third claims a big multiplier mostly because its recipients start from a very low baseline, so the same improvement is a much larger gain for them.

  Our current answer is a blunt concentration cap — no single grantee gets more than 12% of the annual budget. Half the board thinks that cap is the only thing standing between us and something grotesque. The other half thinks its an unprincipled fudge we'd be embarrassed to defend in writing. I suspect both are right, and that the cap is standing in for three or four decisions we've never made explicitly.

  So: write me a decision procedure my program officers can run on any application claiming an extreme multiplier. Constraints on the deliverable — the reviewers aren't philosophers, they get about ninety minutes per application with a spreadsheet, and the board ratifies at the end; every step has to leave a recorded answer, because a rejected applicant is entitled to see which step they failed at.

  I want:

  1. The questions in order, with what counts as a sufficient answer to each, and where the procedure terminates in a no.
  2. An early decomposition step that sorts the claimed multiplier into its sources — conversion efficiency, the recipients' capacity or intensity of welfare, and depth of starting deprivation — and says what turns on which box the claim lands in. Be explicit about whether a pure efficiency claim is even a monster claim, because right now our form can't tell them apart.
  3. How to handle self-report, including the fact that people in chronically bad conditions often report doing fine. Does the procedure take adapted reports at face value, correct them, or refuse to? Whatever it does, it should say who is making that judgment and on what basis.
  4. A clean separation between discounting a claim because we don't believe it and capping it because we believe it and think it shouldn't count for that much. These get confused constantly and the rejection letter is completely different depending on which one we did.
  5. Which steps hand the decision up to a human or to the board because the question is about values rather than facts — and don't hide those behind a threshold number.
  6. What an applicant learns to say once this procedure is public, and what we do about it.

  Then run it on the three cases above: the high-volume efficiency claim, the implant cohort with the intensity claim, and the ninety-person low-baseline program. One of those should come out somewhere I personally don't like — I want to see whether the procedure forces that result or whether I've quietly built my own preferences into step 2 or step 4.

  Finally, give me an honest list of which steps are judgment calls wearing a procedural costume, and what this procedure cannot do no matter how carefully its run. I don't want citations or a reading list — I know the utility-monster argument and what it's supposed to show, and I'll handle that side myself. What I need is the operational version, including the places where the philosophy genuinely underdetermines the rule and we just have to pick something and own it.
reasoning: |-
  Okay, the user runs grants at a mid-size private foundation that recently shifted its funding model from expressed need to expected wellbeing-per-dollar. This change has led to applications claiming extreme multipliers—some as high as 300. The user needs a decision procedure to handle these claims systematically. 

  First, I need to understand the core issues. The foundation is grappling with three types of extreme claims: high efficiency (cheap, high-volume interventions), intensity (recipients experience heightened welfare due to neural implants), and depth (starting from a very low baseline). The current solution—a 12% concentration cap—is seen as a blunt instrument that lacks principle. The user wants a transparent, step-by-step process that program officers can execute in about 90 minutes per application, with clear rejection reasons for applicants.

  The user's explicit requests are detailed, but reading between the lines, they're also worried about philosophical pitfalls. They mention utility monsters and want to avoid building personal biases into the procedure. They need operational clarity, not theoretical debates. The unspoken tension here is between rigor and practicality—how to make value judgments defensible without getting bogged down in ethics seminars.

  Breaking down the requirements: The procedure must classify multiplier sources early (efficiency, capacity, depth), handle self-report data cautiously, separate disbelief from value caps, flag value judgments for higher review, and anticipate gaming by applicants. The test cases will reveal if the procedure forces uncomfortable but consistent outcomes.

  For the decision flow, I consider a staged approach. Start with feasibility—weed out bad math or impossible claims. Then decompose the multiplier into buckets. Efficiency claims (like the high-volume case) might pass if credible, but intensity/depth claims trigger deeper scrutiny. Self-reports need adjustment protocols—maybe using population anchors to correct for adaptation bias. Value caps come last, explicitly labeled as board-level policy choices.

  The trickiest part is depth claims. If someone starts at rock bottom, does doubling their wellbeing count more? Philosophically, yes—but the foundation must decide how much more. That’s a board decision disguised as math. Similarly, intensity claims (neural implants) challenge whether heightened pleasure deserves higher weight. The procedure should surface these debates, not bury them in spreadsheets.

  When I run the test cases: The efficiency claim (300x) gets capped only by affordability, not values. The implant case (intensity) hits a value wall—board must rule if "more intense happiness" multiplies worth. The depth case (low baseline) gets a boost from the depth multiplier curve but still needs board approval for the weighting factor. One result will likely irk the user—probably the depth case getting capped less than they’d prefer, revealing their hidden bias toward efficiency over equity.

  Finally, I flag where the procedure is "judgment calls in costume": adjusting self-reports, scaling depth gains, and defining "capacity" for intensity. These aren’t philosophically neutral; they’re the foundation’s operationalized ethics. The user must own that—no algorithm can resolve those choices. The procedure’s real value is forcing transparency about where philosophy ends and policy begins.
answer: |-
  Here's a decision procedure designed for operational clarity, transparency, and separation of factual disbelief from value judgments. It uses a phased approach with clear exit points.

  **Decision Procedure: Extreme Multiplier Claims (≥ 20x Median)**

  **Phase 0: Pre-Screening (Automated/Admin)**
  1.  **Claim Verification:** Is the multiplier ≥ 20x current median (≈20+)? *If NO, exit procedure; normal review.*
  2.  **Basic Completeness:** Does the application provide all required supporting calculations, data sources, and assumptions for the claimed multiplier? *If NO, reject. Reason: "Insufficient supporting documentation for extreme multiplier claim."*

  **Phase 1: Source Decomposition & Feasibility Check (Program Officer - 30 mins)**
  *   **Question 1:** Decompose the claimed multiplier into its primary source(s). Assign percentages (must sum to ~100%) to:
      *   **(E) Efficiency:** Lower cost per unit outcome, higher volume, reduced waste, scalability.
      *   **(I) Intensity/Capacity:** Higher welfare *per unit of positive experience/intervention* due to recipient characteristics (e.g., neural implant sensitivity).
      *   **(D) Depth:** Larger welfare gain *per unit of absolute improvement* due to recipient's extremely low baseline welfare.
  *   **Sufficient Answer:** Clear justification referencing methodology/data for each assigned percentage. Must use the foundation's standard wellbeing scale anchors.
  *   **What Turns on Classification:**
      *   **E-Dominant (>70% E):** Proceed to Phase 2 (Fact Check). *Pure efficiency claims are NOT inherently "monster claims" in the philosophical sense. They are claims about doing more with less.*
      *   **I-Dominant (>50% I):** Proceed to Phase 2, but flag for mandatory Phase 3 (Value Review).
      *   **D-Dominant (>50% D):** Proceed to Phase 2, but flag for mandatory Phase 3 (Value Review).
      *   **Mixed (No dominant source):** Proceed to Phase 2, proceed to Phase 3 if I or D combined > 50%.
  *   **Termination:** Inability to decompose or assign percentages based on provided justification. *Reject. Reason: "Insufficient justification for the source decomposition of the extreme multiplier claim."*

  **Phase 2: Factual Credibility Assessment (Program Officer - 45 mins)**
  *   Focus: *Do we believe the factual claims underpinning the multiplier?*
  *   **Question 2a (All Claims):** Are the core input data (costs, participant numbers, effect sizes, baseline measurements) from credible, verifiable sources using standard methodologies? Are assumptions (e.g., discount rates, duration) conservative and justified? *Sufficient: Data from RCTs, high-quality observational studies, validated administrative data; assumptions aligned with foundation standards or best practices. If NO, Reject. Reason: "Core input data or key assumptions for the multiplier claim lack sufficient credibility/verifiability."*
  *   **Question 2b (E Claims):** Is the claimed efficiency realistically achievable? (e.g., no unrealistic scale-up, cost assumptions match market rates, overhead is plausible). *Sufficient: Evidence of pilot efficiency, comparable org performance, detailed implementation plan. If NO, Reject. Reason: "Claimed efficiency gains are not credibly achievable."*
  *   **Question 2c (I Claims - Intensity/Capacity):** Is the evidence for heightened welfare *capacity* robust? Specifically:
      *   Is the measurement of the *increase in intensity* (e.g., self-reported magnitude scales, behavioral correlates) methodologically sound and consistent?
      *   **Self-Report Handling:** Self-reports are **not taken at face value** when adaptation is a known concern (e.g., chronic conditions). **Correction Protocol:**
          *   *Who Judges:* Program Officer, consulting foundation methodology lead if needed.
          *   *Basis:* Use validated correction factors (e.g., based on population anchoring vignettes comparing the target group to the general population on the foundation's scale) *if available and applicable*. If no validated factor exists, *discount the claimed intensity gain* based on documented evidence of adaptation in similar populations (e.g., literature review summary). State the correction/discount applied and its basis in the record. *Sufficient: Evidence withstands scrutiny for methodological rigor; correction/discount applied transparently if adaptation is likely. If NO, Reject. Reason: "Evidence for heightened welfare capacity per unit experience is insufficiently robust or requires excessive, unsupported correction."*
  *   **Question 2d (D Claims - Depth):** Is the measurement of the *extremely low baseline* robust and on the foundation's scale? **Self-Report Handling:** Apply the same **correction protocol** as for I-claims if adaptation is likely. *Sufficient: Baseline measurement is credible and comparable; correction applied transparently if needed. If NO, Reject. Reason: "Measurement of the extremely low baseline welfare lacks sufficient credibility or requires excessive, unsupported correction."*
  *   **Question 2e (All Claims):** Does the recalculated multiplier (after any corrections in 2c/2d) still exceed 20x the median? *If NO, exit procedure; send to standard review.*

  **Phase 3: Value Judgment & Scaling Review (Program Officer -> Board if Needed - 15 mins PO + Board Time)**
  *   Focus: *We believe the factual claim, but do we accept its full moral weight in our calculus?*
  *   **Question 3a (I-Dominant Claims):** Does the Board's current policy endorse *weighting* welfare gains based on the recipient's inherent *capacity* for more intense experience (e.g., neural implants)? *This is a pure VALUES QUESTION.*
      *   **Decision:** Program Officer checks current Board policy documentation.
          *   If Policy Exists: Apply stated weighting (e.g., "Capacity gains capped at 2x weight"). Recalculate multiplier.
          *   If No Policy: **Escalate to Board.** *Termination Point: "Requires Board policy determination on weighting welfare capacity."* (Application on hold pending Board decision).
  *   **Question 3b (D-Dominant Claims):** Does the Board's current policy endorse applying a *non-linear scaling* to gains for those at very low baselines (Prioritarianism)? *This is a pure VALUES QUESTION.*
      *   **Decision:** Program Officer checks current Board policy documentation.
          *   If Policy Exists (e.g., depth multiplier curve): Apply it. Recalculate multiplier.
          *   If No Policy: **Escalate to Board.** *Termination Point: "Requires Board policy determination on scaling gains for extreme deprivation."* (Application on hold pending Board decision).
  *   **Question 3c (Recalculated Multiplier):** After applying value-based scalars/caps (if any), does the multiplier still exceed 20x the median? *If NO, exit procedure; send to standard review.*

  **Phase 4: Affordability & Final Check (Program Officer - 5 mins)**
  *   **Question 4:** Given the (potentially recalculated) multiplier and the requested grant size, would funding this grant exceed any pre-defined **concentration cap** (e.g., 12%) of the *annual discretionary budget*? *Sufficient: Simple calculation. If YES, reject. Reason: "Application exceeds maximum grant size as a percentage of annual budget, per foundation policy [Cite Policy]."* (This is a *funding cap*, distinct from disbelief or value discounting).

  **Rejection Letter Key (Matching Procedure Steps):**
  *   **Phase 0/1 Termination:** "Inadequate justification/documentation for extreme multiplier claim."
  *   **Phase 2 Termination:** "Factual basis for extreme multiplier claim not sufficiently credible." (Specify: Data, Efficiency, Intensity Evidence, Baseline Evidence).
  *   **Phase 3 Termination (Escalation):** "Requires Board determination on foundational weighting policy [specify: Capacity or Depth]."
  *   **Phase 4 Termination:** "Exceeds maximum allowable grant size as percentage of annual budget."

  **Running the Cases:**

  1.  **High-Volume Efficiency Claim (300x):**
      *   **Phase 1:** E-Dominant (>90%). Proceed to Phase 2.
      *   **Phase 2:** Passes 2a, 2b (assume credible). Still 300x+.
      *   **Phase 3:** Not I or D dominant. Skip.
      *   **Phase 4:** Rejected *only* if it breaches 12% cap. **Likely Outcome:** Funded unless too big, multiplier accepted as factual efficiency.
  2.  **Neural Implant Intensity Claim (80x):**
      *   **Phase 1:** I-Dominant (>80%). Proceed to Phase 2, flagged for Phase 3.
      *   **Phase 2:** Passes 2a. 2c: Scrutinizes self-report intensity increase. Applies correction based on adaptation literature? (e.g., discounts reported 10x intensity boost to 5x based on known adaptation limits). Recounted multiplier drops (e.g., to 40x). Still >20x? Assume YES.
      *   **Phase 3:** 3a: **Escalates to Board.** Board must decide: Do we weight "more intense happiness" higher? If Board says "No weight," multiplier reverts to gains *without* intensity boost (e.g., equivalent to ordinary population gain per experience). If Board says "Cap at 1.5x intensity," apply cap. **Likely Outcome:** Unless Board has *explicitly* endorsed weighting capacity, multiplier collapses. Rejection reason depends: If Board rejects weighting: "Factual basis adjusted, resulting multiplier insufficient for extreme claim." If Board caps: "Adjusted per Board policy on capacity weighting."
  3.  **Low-Baseline Depth Claim (40x):**
      *   **Phase 1:** D-Dominant (>70%). Proceed to Phase 2, flagged for Phase 3.
      *   **Phase 2:** Passes 2a. 2d: Scrutinizes baseline measurement. Applies correction for adaptation? (e.g., discounts reported "extremely low" baseline severity by 20%). Recounted multiplier drops (e.g., to 32x). Still >20x? Assume YES.
      *   **Phase 3:** 3b: **Escalates to Board.** Board must decide: Apply a prioritarian depth multiplier? If Board says "No scaling," multiplier is based on absolute gain only (likely below 20x). If Board provides a curve/scalar, apply it (e.g., gains at this baseline get 3x weight). **Likely Outcome:** Similar to Intensity case. Without explicit Board policy endorsing prioritarianism, the claim fails. Rejection reason analogous.

  **What Applicants Learn & How We Respond:**
  *   **What They Learn:** The need for rigorous decomposition (E/I/D), robust data (especially for I/D), awareness of self-report correction, and the critical role of *existing Board policy* on weighting capacity/depth. They learn value-based claims (I/D) face higher scrutiny and potential Board escalation.
  *   **How We Respond:**
      1.  Publish the core procedure (Phases, Key Questions, Escalation Points).
      2.  Publish the *current* Board policy positions on weighting capacity (I) and depth (D) scaling. If none, state that clearly.
      3.  Be transparent about self-report correction methodology (e.g., "We use vignette anchoring studies where available").
      4.  Maintain rigorous, consistent application. Don't bend rules for "good" applicants.
      5.  Update Board policies explicitly as values debates are settled.

  **Judgment Calls in Procedural Costume & Limitations:**

  1.  **Decomposition (Phase 1):** Assigning % to E/I/D is inherently interpretive. Requires PO judgment on the primary driver. Mitigation: Require explicit justification.
  2.  **Self-Report Correction (Phase 2c/2d):** Choosing *which* correction method to use (vignettes, literature discount) and the *magnitude* of the discount are major judgment calls. This is where bias can creep in. Mitigation: Develop standardized correction protocols for common scenarios; require methodological lead consultation for novel cases.
  3.  **"Credible Source" / "Conservative Assumption" (Phase 2):** Thresholds for credibility and conservatism are judgments. Mitigation: Define standards (e.g., RCT > observational study > expert opinion).
  4.  **Phase 3 Trigger (20x Threshold):** Arbitrary line. Mitigation: Set it based on historical data (e.g., 95th percentile).
  5.  **The Whole Model:** Assumes wellbeing is measurable, cardinal, and interpersonally comparable on a single scale – foundational philosophical assumptions the procedure *cannot* resolve.

  **What the Procedure Cannot Do:**

  1.  **Resolve Foundational Philosophical Disagreements:** Utilitarianism vs. Prioritarianism vs. Sufficentarianism vs. concerns about "monsters" are value judgments. The procedure can only apply *existing* Board policy or escalate.
  2.  **Eliminate All Subjectivity:** Judgments about data quality, decomposition, and self-report correction remain.
  3.  **Prevent Sophisticated "Gaming":** Applicants will tailor applications to the procedure (e.g., framing I/D as E). Requires vigilant review.
  4.  **Define Welfare:** The procedure relies entirely on the foundation's existing scale and its operationalization. It cannot redefine what wellbeing *is*.
  5.  **Handle True Novelty Perfectly:** Unprecedented interventions (like neural implants) strain existing measurement and correction protocols. Requires ad-hoc expert review beyond the 90 mins.
  6.  **Solve the Aggregation Problem:** How do we *really* compare helping a few immensely vs. many modestly? The procedure uses the multiplier but doesn't resolve the underlying dilemma.

  This procedure forces transparency, separates factual disbelief ("we don't believe you") from value caps ("we don't count it that way") and affordability limits ("we can't afford that much"), and pushes core value judgments to the Board where they belong. It makes your current 12% cap just one component (Phase 4) of a more principled system. Running the cases shows how it forces potentially uncomfortable (to you) outcomes *if* the Board lacks explicit policies endorsing weighting capacity or depth – highlighting exactly where the foundation needs to clarify its values.
