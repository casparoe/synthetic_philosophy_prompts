  Hmm, this is tricky because Quine's thesis is deliberately extreme - it claims that even perfect behavioral evidence can't pin down meaning. Most real-world translation problems get resolved eventually. But the user specifically asks for cases where two interpretations are empirically equivalent. 

  Let me think about ambiguous biological signals... Ah! The vervet monkey alarm calls might work. There's genuine debate about whether they refer to predators as categories or specific escape actions. The behavioral evidence is equally compatible with both: when eagles appear, monkeys run to bushes and make "eagle call" - but is the call about eagles or about bush-running? 

  The clever bit is that vervets *also* have distinct calls for leopards (run up trees) and snakes (stand bipedally). So the pattern holds across multiple threats. Field linguists like Seyfarth and Cheney argue for the predator interpretation, but some ethologists point out the calls always trigger escape *actions* first. 

  Wait, is this truly Quinean? The user will ask that. Well... in theory you could implant false memories or use VR to test if monkeys respond to "eagle call" without an eagle present but with bush-running context. But ethically impossible. And even then, if the call triggered bush-running, is that because it "means" bushes or because it's linked to eagle-threats-which-require-bushes? Still indeterminate at the edges. 

  The user's probably testing whether I'll waffle. Must be honest: this *isn't* pure indeterminacy because we have neural evidence now. Monkey brains show different activity for different calls regardless of behavior. But Quine would dismiss that as "stimulus meaning" not real reference. 

  Biggest weakness? If we found vervets using these calls symbolically in new contexts (e.g. "eagle call" to warn about kites far away), that would kill the action-oriented reading. But they don't. So currently, both interpretations predict identical behaviors. Classic gavagai-style underdetermination, just with primates instead of aliens. 

  User seems sophisticated - they'll spot if I oversell it. Should emphasize that it's the *theoretical possibility* of equivalence that matters, not that scientists are actually confused. And admit that for practical purposes, we treat it as predator-referring. 

