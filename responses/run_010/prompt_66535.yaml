prompt: |-
  I'm trying to work out whether Quine's indeterminacy of translation is a live problem anywhere outside thought experiments. So: give me one example, and make it a real, describable one — not the rabbit, not the field linguist with the notebook, not the rabbit-stage/undetached-rabbit-part routine. Some actual situation where the gavagai problem bites: two readings of what a signal or a term picks out, both fully supported by all the behavioural evidence there is, yet genuinely disagreeing about the world. Could be field biology, machine translation of a low-resource language, contract law, a legacy codebase, an animal's alarm calls — you pick.

  Build it properly. What's the evidence, what are the two rival readings, and why are they empirically equivalent rather than just imprecise? Then be honest about whether its real Quinean indeterminacy or whether it dissolves — because some third kind of evidence would settle it, or because the two readings agree on everything anyone could ever do with them, so nothing hangs on the difference. And tell me what would change your mind about whether your example counts, or where you think the reasoning is weakest. British English, please.
reasoning: |-
