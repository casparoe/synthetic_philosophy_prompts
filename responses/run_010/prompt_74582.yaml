prompt: |-
  I am a student in my penultimate year of secondary school, and I convene a self-run reading group of eighteen pupils, aged sixteen to eighteen, which has spent the year on the prisoner's dilemma and the evolution of cooperation. Between us we have covered the two computer tournaments and the popular account of them, the properties a robust strategy is said to need (nice, retaliatory, forgiving, and clear), the folk theorem as our faculty adviser presented it, the backward-induction argument that a known final round unravels cooperation, and a handful of animal-behaviour cases offered as evidence of reciprocity. I am now writing the paper for our end-of-year assessment. My fellow students are comfortable with expected-value arithmetic and with conditional probability at the level of a tree diagram; none has taken calculus, and none should be asked for a formal proof.

  I want one essay question, to be answered in sixty minutes and marked out of twenty-five, built on a variant of the iterated dilemma that I have designed myself and that I am fairly confident appears nowhere in the material we have read. Here is the variant, which I have been calling the audit round.

  Two players meet indefinitely. After each round there is a further round with probability w = 0.9, and this is common knowledge. Stage payoffs are the usual ones: temptation 5, reward 3, punishment 1, sucker 0. Monitoring is imperfect and private: at the start of every round after the first, each player separately receives a report of the other player's action in the previous round. Each report is correct with probability 0.95 and reversed with probability 0.05, independently across rounds and across players, so the two may be working from incompatible records. Before choosing, a player may pay an audit cost of 1 point, deducted from that round's payoff, to be told with certainty what the other player actually did in the previous round. Audit decisions are simultaneous, private, and unobservable: the partner never learns whether you audited, and no record of audits survives into later rounds. The first round has no history, and no audit is available in it.

  Three things I suspect make this variant interesting, though I may well be wrong about all three, and I would rather you tell me so than write the question around a mistake:

  - The value of an audit seems to depend on how surprising the report is, and therefore on the player's prior expectations about the partner, not merely on the error rate; a report of defection from someone you take to be a cooperator is likelier to be a lie than the same report from someone you already distrust.
  - The auditor pays the whole cost, while the benefit of avoiding a retaliatory spiral is shared by both players, so audits should be systematically under-bought relative to what the pair would jointly want.
  - Because audits are invisible, they cannot function as costly signals of good faith, which is exactly what a visible audit would be able to do.

  Assess each of these claims against the specification as I have written it. Say plainly which survive, which need qualification, and which are false, and build the question around whatever survives. If some feature of my rules makes one of the parts trivial, incoherent, or unsolvable without mathematics my students do not have, say so first and propose the smallest repair that keeps the idea intact.

  The question itself should have three parts: one asking under what conditions a player should buy the audit; one asking why the audit decision is a collective-action problem in its own right and what that predicts about how often audits will be used; and one asking how, given only the sequence of choices both players made and not the reports they received, an observer could tell whether a collapse into mutual defection was driven by temptation or by misperception, and what each diagnosis would imply about whether more auditing would have helped.

  Please deliver four things:

  1. The question exactly as it will appear on the paper, restating the rules in full, since students will not see my description above. The paper is closed-book, so no part may require naming a researcher, citing a study, or recalling any fact that is not contained in the question itself.
  2. A model answer of about 800 words, pitched at the mathematical level I described.
  3. A marking scheme totalling twenty-five marks, distributed across the three parts, that names the specific moves a top answer must make rather than describing it in general terms. For each must-hit point, give the marks it carries and a single line naming the characteristic way students get it wrong.
  4. A short paragraph saying what an answer that competently recites the tournament lore would look like, at which mark it would cap out, and why it cannot go higher.
reasoning: |-
  Okay, the user is a penultimate-year secondary school student running a reading group on the prisoner's dilemma and cooperation. They've designed a variant called the "audit round" and need help creating an essay question for their end-of-year assessment. 

  First, I need to understand their variant thoroughly. The key elements are:
  - Indefinite interactions with continuation probability w=0.9
  - Standard PD payoffs: T=5, R=3, P=1, S=0
  - Imperfect private monitoring: 95% accurate reports that may conflict
  - Optional audits costing 1 point to reveal true prior action
  - Audits are private, simultaneous, and leave no record
  - First round has no history/audit

  The student has three hypotheses about why this is interesting:
  1. Audit value depends on prior expectations (surprising reports matter more)
  2. Audits create a collective action problem (cost private, benefit shared)
  3. Invisible audits can't signal good faith

  I should assess these claims honestly before building the question. 

  For claim 1: This seems robust. Since players form beliefs about opponents' strategies, a "cooperator" reporting defection is more likely an error than a "defector" doing so. Bayes' theorem applies here naturally.

  For claim 2: Also valid. The auditing player bears full cost while both benefit from avoiding mutual defection spirals caused by errors. Classic externality problem.

  For claim 3: Mostly true but needs nuance. While invisible audits can't signal directly, they indirectly enable cooperation by correcting errors. The absence of signaling is correct but not really a "feature" - more an inherent limitation.

  No major rules repairs seem needed. The setup should work with students' probability knowledge (tree diagrams, expected value).

  Now structuring the question in three parts as requested:
  - Part A: Conditions for auditing (focusing on belief-dependent value)
  - Part B: Collective action problem in auditing
  - Part C: Distinguishing collapse causes (temptation vs misperception)

  For the model answer, I'll:
  - Use concrete belief examples (e.g., 90% sure of cooperation)
  - Calculate expected costs of auditing vs not auditing
  - Emphasize the externality in Part B
  - For Part C, contrast sudden vs gradual collapses and audit patterns

  Marking scheme should reward:
  - Correct application of conditional probability
  - Recognizing the externality
  - Diagnostic indicators for collapse causes
  - Avoiding common errors like ignoring belief dependence

  The "tournament lore" cap: Students might just describe TFT properties without engaging the audit mechanics. That would max at ~15/25 for missing the variant's novelty.

  Biggest challenges students may face:
  - Calculating Bayesian updates under time pressure
  - Distinguishing private vs social audit incentives
  - Articulating observable collapse patterns clearly

  I'll make sure to keep all explanations at their math level - no calculus, just probabilities and expected values. The audit cost analysis should be concrete with numerical examples where helpful.
answer: |-
  ### 1. Essay Question  
  **Iterated Prisoner's Dilemma with Audits**  
  Two players interact for an indefinite number of rounds. After each round, the game continues with probability *w* = 0.9 (common knowledge). Stage payoffs are:  
  - **Temptation (T)** = 5 (you defect, partner cooperates)  
  - **Reward (R)** = 3 (both cooperate)  
  - **Punishment (P)** = 1 (both defect)  
  - **Sucker (S)** = 0 (you cooperate, partner defects)  

  **Monitoring Rules:**  
  - After the first round, each player receives a *private report* of the other’s previous action.  
  - Reports are correct with probability 0.95 and reversed (wrong) with probability 0.05.  
  - Reports are **independent** across rounds and players (reports to each player may disagree).  

  **Audit Option:**  
  - Before choosing an action (from round 2 onward), a player may pay a cost of **1 point** to audit.  
  - An audit reveals the *true action* the partner took in the *previous round*.  
  - Audit decisions are:  
    - Simultaneous and private (partner does not know you audited).  
    - Unobservable (no record exists for future rounds).  
  - **No audit is possible in round 1.**  

  ---

  **Answer all three parts. Total time: 60 minutes.**  

  **(A)** Under what conditions should a player pay to audit the previous round? Explain how their *belief about the partner’s past behavior* affects this decision. (8 marks)  

  **(B)** Why is the decision to audit a **collective-action problem**? What does this predict about how often audits will occur compared to what would benefit both players jointly? (8 marks)  

  **(C)** An observer sees a sequence where both players defect permanently after cooperating. How could they distinguish whether this collapse was caused by:  
  - **(i)** Temptation to defect (e.g., a deliberate choice to exploit)?  
  - **(ii)** Misperception (e.g., false reports leading to unintended retaliation)?  
  What would each diagnosis imply about whether more auditing would have prevented collapse? (9 marks)  

  ---

  ### 2. Model Answer (≈800 words)  
  #### **(A) Conditions for Auditing**  
  Auditing is valuable when the cost (1 point) is outweighed by the expected benefit of correcting a *misleading report*. This benefit depends critically on **prior beliefs** about the partner’s behavior.  

  **Key Insight:** A report is "surprising" if it contradicts your trust in the partner, making errors more likely. For example:  
  - If you are 90% sure your partner cooperated last round, a "defect" report has a high chance (≈49%) of being wrong.  
    - *Calculation:* Prior belief: P(Cooperation) = 0.9. Error probability = 0.05.  
      P(Error | Defect Report) = P(Report wrong | Actual Cooperate) × P(Actual Cooperate) / P(Defect Report)  
      = (0.05 × 0.9) / [(0.05 × 0.9) + (0.95 × 0.1)] ≈ 0.32. *(Simplified: Majority trust makes defect reports suspect.)*  
  - If you already distrust the partner (e.g., P(Cooperation) = 0.1), the same "defect" report is likely correct (≈95%).  

  **Decision Rule:** Audit when:  
  1. The report **contradicts expectations** (e.g., "defect" when you expected cooperation).  
  2. The **cost of misretaliation** is high. For instance, falsely punishing a cooperator risks losing future rewards (R=3) versus mutual punishment (P=1).  
  3. **Mathematical Check:** Expected benefit > Cost (1). Benefit = [P(Report wrong) × (Avoided loss)]. Avoided loss ≈ (R − P) × Future rounds’ value. With *w*=0.9, future value is high (e.g., 3/(1−0.9) = 30 if cooperating).  

  **Conclusion:** Audits are most valuable when reports conflict with strong prior trust, and future cooperation is profitable.  

  #### **(B) Auditing as a Collective-Action Problem**  
  **The Problem:**  
  - The **cost** of auditing (1 point) is paid **privately** by the auditor.  
  - The **benefit** (avoiding mutual defection from false reports) is **shared** by both players (e.g., both regain R=3 instead of P=1).  
  This creates an **externality**: the auditing player bears the full cost but captures only half the social benefit.  

  **Consequence:**  
  Players will audit **less often** than what maximizes their joint payoff. For example:  
  - *Socially optimal:* Audit if joint benefit > joint cost. Avoiding mutual defection might save (3−1)×2 = 4 points per round. Cost = 1, so net gain = 3.  
  - *Privately optimal:* Player only considers their own share (≈2 points benefit) vs. 1-point cost. If P(benefit) < 0.5, they skip auditing.  

  **Prediction:** Audits will be **underused** relative to the level that would best sustain cooperation. Each player free-rides, hoping the other audits.  

  #### **(C) Diagnosing Collapse Causes**  
  **Clues for Observers:**  
  - **(i) Temptation-driven collapse:**  
    - **Pattern:** Sudden, unilateral defection by one player (e.g., Player A defects after both cooperated). Subsequent mutual defection.  
    - **Audit implication:** More auditing would **not help**—the defector knew their action and chose exploitation.  
  - **(ii) Misperception-driven collapse:**  
    - **Pattern:** Gradual descent into defection after ambiguous reports.  
      - *Example:* Both cooperate in round 1.  
        Round 2: Player A gets false "defect" report on B, retaliates (defects).  
        Player B sees A’s real defection, defects in round 3.  
        Mutual defection continues.  
    - **Audit implication:** Auditing **would have helped**. Correcting the false report in round 2 would have prevented retaliation.  

  **Evidence:**  
  - **Defectors’ histories:** If one player defected first *without* a prior defection report, this suggests temptation.  
  - **Audit necessity:** If collapses follow periods of conflicting reports (inferred if players defect after mutual cooperation), misperception is likely.  

  ---

  ### 3. Marking Scheme (25 marks total)  
  #### **(A) Conditions for Auditing (8 marks)**  
  - **2 marks:** Audits are valuable when reports contradict prior trust.  
    *Common error: Ignores belief dependence; focuses only on error rate.*  
  - **2 marks:** Higher trust → higher chance a "defect" report is wrong (Bayesian intuition).  
    *Common error: Assumes reports are equally reliable regardless of beliefs.*  
  - **2 marks:** Link to cost-benefit: Avoided loss (e.g., future R vs P) must exceed audit cost.  
    *Common error: Omits future payoff consequences.*  
  - **2 marks:** Decision depends on probability of error *and* cost of misretaliation.  
    *Common error: Only considers immediate payoffs.*  

  #### **(B) Collective-Action Problem (8 marks)**  
  - **2 marks:** Cost private (paid by auditor); benefit shared (both avoid P=1).  
    *Common error: Confuses private cost with shared monitoring benefit.*  
  - **3 marks:** Auditor bears full cost but gets partial benefit → underinvestment.  
    *Common error: Claims auditing is individually rational.*  
  - **3 marks:** Predicts audits underused vs. social optimum; free-riding occurs.  
    *Common error: Suggests no collective-action issue.*  

  #### **(C) Distinguishing Collapse Causes (9 marks)**  
  - **3 marks:** Temptation: Sudden first defection *without* prior defection report.  
    *Common error: Cannot differentiate deliberate vs. reactive defection.*  
  - **3 marks:** Misperception: Gradual collapse; defection follows cooperation *with* potential false reports.  
    *Common error: Attributes all collapses to misperception.*  
  - **3 marks:** Auditing helps misperception (corrects errors) but not temptation (voluntary choice).  
    *Common error: Suggests auditing always helps (or never helps).*  

  ---

  ### 4. Tournament-Lore Answer Cap  
  An answer that only recites standard tournament results (e.g., "TFT is nice/retaliatory/forgiving") but **fails to engage the audit mechanics** would:  
  - **Cap at 15/25**. It might earn:  
    - Part A: 2/8 (generic "correct errors" with no belief analysis).  
    - Part B: 3/8 (vague "costs vs benefits" without externality).  
    - Part C: 4/9 (basic collapse patterns, no audit link).  
  - **Why it cannot go higher:** The question tests **application to the novel audit system**. Without analyzing belief-dependent auditing (A), collective underuse (B), or diagnostic indicators (C), it misses the variant’s core challenges.  

  ---  
  **Response Rationale:**  
  - Claims 1 and 2 are robust; claim 3 is valid (invisible audits ≠ signals) but trivial. No rules repairs needed.  
  - Math uses only probabilities/expected values (accessible with tree diagrams).  
  - Marking scheme rewards *specific* insights and penalizes predictable misconceptions.  
  - Model answer mirrors student-level reasoning, avoiding calculus/proofs.
