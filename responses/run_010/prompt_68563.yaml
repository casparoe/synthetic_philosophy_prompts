answer: |-
  Below is a complete, runnable design for your in-class activity, addressing all requirements and potential pitfalls. I've refined your core loop for arithmetic feasibility, added role cards, specified logistics, and included a debrief script that separates theorems from open debates.

  ### **Core Loop Repaired: Fraction-Free Arithmetic**
  The original loss rule (subtract half the stake) creates fractions. To avoid decimals/rounding:
  - **Initial bankroll**: 128 tokens (power of 2).
  - **Win outcome**: Add **100% of stake** (e.g., stake 50 → gain 50).
  - **Loss outcome**: Subtract **40% of stake** (e.g., stake 50 → lose 20).  
    *Why?* This maintains a 1.25× expected value multiplier when staking all:  
    `EV = 0.5 × (1 + 1) + 0.5 × (1 − 0.4) = 1.25`.  
    Median outcome remains 1× (no growth), as losses reduce wealth multiplicatively.

  **Stake constraints**: Stake must be a multiple of **5 tokens** (to make 40% loss integer). Players can stake 0, 5, 10, ..., up to their bankroll.  
  → *No fractions, no change-making, no rounding disputes*.

  ### **Game Setup**
  - **Materials**: 
    - Tokens: Poker chips or paper squares (1,000+ total). 
    - Cards: A deck with 26 ♥ (win) and 26 ♠ (loss). Shuffle publicly each round.
    - Handouts: Bankroll ledger (table below), role cards (4 types, 1/player).
  - **Players**: 20 students + **you (instructor)**. You play to model Kelly betting.
  - **Timeline** (90 min total):
    - **0–5 min**: Distribute tokens (128/player), ledgers, role cards.
    - **5–55 min**: 20 betting rounds (2 min/round, details below).
    - **55–65 min**: Compute final growth rates and raffle.
    - **65–90 min**: Debrief.

  #### **Bankroll Ledger (Paper Handout)**
  Players record stakes privately. You audit afterward using these columns:

  | Round | Start Tokens | Stake (multiple of 5) | Outcome (Win/Loss) | End Tokens |
  |-------|--------------|-----------------------|--------------------|------------|
  | 1     | 128          | e.g., 50             | ♥ or ♠             | 178 or 108 |
  | ...   | ...          | ...                   | ...                | ...        |
  | 20    | ...          | ...                   | ...                | [Final]    |

  ### **Role Cards (Deal 4 Randomly)**
  Keep secret until debrief. Players must follow card instructions or forfeit tokens.

  1. **The Spender**: "Every round, after betting, withdraw 20 tokens for 'living expenses.' If you can’t, you’re bankrupt and become a dealer assistant."
  2. **The Rank Seeker**: "At the end of round 10, if your bankroll is top-3 in the room, gain 100 tokens. If bottom-3, lose 50 tokens. Otherwise, gain 0."
  3. **The One-Shot Gambler**: "Only bet in round 1. Afterward, your tokens grow at 1.25×/round. Record your final tokens as `128 + 0.25 × (round-1 stake)`."
  4. **The Skeptic**: "You suspect the deck is rigged (60% win or 60% loss), but you don’t know which. Bet accordingly."

  ### **Betting Round (2 min/Round)**
  1. **Stake choice (45 sec)**: Players privately choose a stake (multiple of 5) and record it in their ledger. *You* stake **half your bankroll** (rounded to nearest 5).
  2. **Outcome (15 sec)**: Draw a card publicly. All wins if ♥, losses if ♠.
  3. **Update (45 sec)**: Players update tokens:  
     - Win: `End = Start + Stake`  
     - Loss: `End = Start − (0.4 × Stake)` (e.g., stake 50 → lose 20).
  4. **Public record (15 sec)**: Collect all end tokens. Write **mean** and **median** on the board.
  5. **Bankruptcy rule**: Players with ≤20 tokens become dealer assistants (help shuffle/collect data). They re-enter next round with 128 tokens if ≥10 others are bankrupt. *→ No idle players.*

  ### **Closing Phase (55–65 min)**
  1. **Raffle**: Convert tokens to lottery tickets. Each token = 1 entry. Draw 1 winner for a $10 gift card (trivial stake, no humiliation).
  2. **Growth rates**:
     - Each player computes growth factor: `(Final / 128)^{1/20}`.
     - On the board, plot:
       - **Cross-sectional avg.**: Average of all players' final tokens.
       - **Time-avg. growth**: Average of all players' growth factors.
  3. **Contrast**: Highlight divergence (e.g., cross-sectional avg. ↑ due to outliers; time-avg. growth ↓ for full stakers).

  ### **Debrief Script (65–90 min)**
  #### **Part 1: Observations from Public Record**
  - "The mean token count rose each round, but the median barely moved. Why?"  
    → *A few got rich (full stakers who won), but most didn’t (full stakers who lost).*
  - "The gap comes from maximizing **expected value** (EV) vs. **expected growth rate**."

  #### **Part 2: The Growth-Optimal Stake**
  - "In this game, the growth-optimal stake is **half your bankroll**. Why?  
    - **Theorem** (given assumptions): Maximizing expected growth rate is equivalent to maximizing `E[log(wealth)]`.  
    - Derive for our bet (win +100%, lose −40%):  
      `Growth rate G(f) = 0.5·log(1+f) + 0.5·log(1−0.4f)`  
      Maximize by solving `dG/df = 0` → `f* = 0.5`.  
    - **Intuition**: Betting half lets you recover from losses while compounding wins."
  - "But why not stake all? EV is 1.25×, but median growth is 1×. Long-run growth ≈0 if you stake all."

  #### **Part 3: Role Card Revelations**
  - **Spender**: "Bet aggressively to offset withdrawals? Rational given constraints, but looks reckless."  
  - **Rank Seeker**: "Bet huge in round 10 to jump ranks? Rational for relative payoff, not absolute."  
  - **One-Shot Gambler**: "Staked all in round 1? Maximizes EV if you only care about one bet."  
  - **Skeptic**: "Bet less? Rational if you suspect unfair losses."  
  → *Growth-optimal stake depends on context (utility, beliefs, constraints).*

  #### **Part 4: Open Controversies**
  - **What is settled**:  
    - *Theorem*: With known probabilities and i.i.d. bets, Kelly maximizes long-run growth.  
    - *Theorem*: Maximizing `E[log(wealth)]` = maximizing long-run growth rate asymptotically.  
  - **Live disagreements**:  
    - Is long-run growth the *right* goal? Critics: Ignores risk aversion, finite lifetimes, and model uncertainty.  
    - Does "time avg. vs. ensemble avg." add insight? Or is it just log utility in disguise?  
      → *No consensus. Kelly advocates see it as deeper (survival, volatility). Critics see it as restrictive.*  
  - **Hidden assumptions in the game**:  
    - Known/fixed probabilities (no estimation).  
    - No consumption/withdrawals (except Spender).  
    - Infinite horizon approximated by 20 rounds.  

  ### **Predictable Problems & Interventions**
  1. **Lucky full staker argues they had highest EV**:  
     - *Intervention*: "You’re right! But run 1,000 simulations: most full stakers bust. The *median* full-staker has ≈0 tokens. Kelly’s median grows steadily."  
     - *Use public record*: Show median bankroll stagnated despite mean rising.

  2. **Room interprets this as "don’t be greedy"**:  
     - *Intervention*: "Kelly isn’t anti-greed—it’s pro-*math*. Betting half isn’t conservative; it’s growth-maximizing. Betting 0% has 0 growth. Betting 100% has ≈0 *median* growth."  
     - *Show the math*: Plot `G(f)` for f=0, 0.5, 1.0.

  ### **What the Game Cannot Replicate**
  - **Asymptotic long-run behavior**: 20 rounds ≠ infinity. The law of large numbers is only hinted at.  
    → *You must clarify*: "In finite trials, growth-optimal strategies can lose. Kelly is a limit concept."

  ### **Why This Works**
  - **No fractions**: 40% loss + stake multiples of 5 ensure integer arithmetic.  
  - **Engagement**: Role cards create "irrational" behaviors that make sense post-reveal.  
  - **Discovery-led**: Kelly isn’t named until debrief; students *feel* the EV/growth rift first.  
  - **Runnable**: 2 min/round is tight but feasible with helper roles for bankrupt players.  

  Run this, and your students will viscerally grasp the EV/growth divide—and debate its implications for years.
