  Design:

    - Each player starts with 128.0 tokens, recorded in a ledger.
    - Each round (20 rounds):
          a. Each player chooses an integer stake S (0<=S<=current bankroll) and records it privately.
          b. Public coin flip: heads=win, tails=loss.
          c. Players update bankroll:
               - Win: new_bankroll = old_bankroll + S
               - Loss: new_bankroll = old_bankroll - S/2   (so if S is odd, it will be .5)
          d. Record the outcome and new bankroll.
          e. Players hold up their bankroll on a card, and instructor (with helper) records them on the board, then computes mean and median and writes on a public timeline.

    - Role cards (4 players, randomly chosen, secret until end):
          1. Spender: After updating bankroll each round, must withdraw 10 tokens (if they have at least 10) or withdraw all if they have less. If after withdrawal the bankroll is 0, they are out. If they cannot withdraw 10, they are out.
          2. Relative Payoff: At the end of round 10, they will be ranked by bankroll. The top 25% get a bonus 100 tokens, next 25% get 50 tokens, next 25% get 25 tokens, bottom 25% get 0. (Adjust the numbers to be within the game: bonus tokens added at the end of round 10, then they continue playing.)
          3. One-Shot Player: After the first round, they stop betting. For rounds 2-20, they do not stake any tokens. At the end, their bankroll is set to the expected value after round 1: 128 + 0.25 * (their stake in round 1). They record that as their final bankroll.
          4. Skeptic: Told: "You have reason to believe the coin might be biased, but you don't know if it's biased in your favor or against. The true win probability is either 0.4 or 0.6. Adjust your betting accordingly."

    - Timeline:
          0-5 min: Introduction, hand out ledgers, explain rules.
          5-10 min: Distribute role cards (4 players) and let them read.
          10-50 min: 20 rounds (2 min per round: 1 min for betting and updating, 1 min for public recording).
          50-60 min: Compute final growth factors and raffle.
          60-90 min: Debrief.

    - Raffle: Each token in the final bankroll is a raffle ticket. Draw one for a $10 gift card.

    - Instructor plays: stakes half their bankroll (rounded to integer) each round.

    - Debrief: as described.

    - What cannot be reproduced: the asymptotic long-run behavior, and the assumption of known probabilities.

    - Controversies: 
          - Is maximizing long-run growth the right goal? 
          - The Kelly strategy can lead to large drawdowns that might be unacceptable for risk-averse individuals, even though it maximizes the long-run growth.
          - The role of utility: if we use logarithmic utility, then Kelly is optimal for one-shot bets too. But why log utility? It's a specific risk aversion.

    - Mechanics that assume the conclusion: 
          - The bet is identical and independent.
          - The probabilities are known and fixed.
          - There are no intermediate withdrawals (except for the Spender) or additions of wealth.
          - The objective is only the bankroll.

