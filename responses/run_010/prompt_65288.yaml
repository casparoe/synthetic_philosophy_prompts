  The damp straw stench of the menagerie clung to Adrien’s coat as he dipped his quill. Entry 347: *Subject 7 (Canis familiaris, 'Bastien'). Presented with concealed meat beneath overturned cup A. Sniffed, circled, nudged cup B (empty), then cup A. Displaced cup A, consumed meat. Disposition of organs: scent tracking, trial-and-error.* He blew on the ink. Routine. Predictable. Mechanical.

  His gaze drifted past Bastien’s pen to the smaller cage opposite. Subject 14: *Corvus monedula*, 'Jacquot'. The jackdaw tilted its head, a bright, black bead of an eye fixed on Adrien. For weeks, Jacquot had been… accumulating. Not just the usual shiny detritus – bits of wire, a chipped porcelain fragment – but arranging them. Not in a nest-like pile, but deliberately, almost… pointedly.

  It began subtly. Entry 312: *Subject 14 presented with three brass buttons (identical) scattered in cage. Collected one, placed it near water dish. Returned, collected second, placed it precisely beside first, forming a line. Left third button untouched.* Adrien had hesitated. The charter was explicit: evidence of thought required the creative deployment of a sign, unprompted by immediate surroundings. Buttons near water? No obvious connection. He’d logged it: *Disposition uncertain. Observed arrangement without discernible environmental prompt. Further observation warranted.*

  Monsieur Leclair, the Academy’s Natural Philosopher, had sniffed. "Displaced nest-building, Clerk Bonnard. The organ seeks order. Meaningless." Adrien had noted the dismissal, but kept watching.

  Jacquot escalated. Entry 329: *Subject 14 discovered a discarded, crumpled scrap of paper bearing an ink blot (resembling crude bird). Carried it to the opposite end of cage. Placed it directly facing the cage bars where visitors often stand. Remained nearby, observing the bars.* Adrien’s hand had trembled slightly as he wrote: *Deployment of found object as potential representation? Object placement not prompted by food, mate, or threat loci. Significant anomaly.*

  Leclair was less dismissive this time, more irritated. "Coincidence! The paper was near the bars, the bird dropped it facing outward. Happenstance! The organ is complex, not thoughtful. Log it as *Disposition: object manipulation influenced by light reflection or airflow.*"

  Adrien had complied, the words tasting like ash. Was he applying the charter’s criterion, or was he, as Leclair implied, seeing phantoms, projecting thought where only intricate clockwork ticked? The charter itself felt slippery. What defined ‘creative’? What constituted a ‘sign’? A button placed deliberately was a sign of *something*, surely? But the charter demanded it be unprompted *and* deployed creatively. Was Jacquot creating meaning, or was Adrien?

  Now, today. Entry 348 loomed. Jacquot had been unusually quiet. Adrien had placed three new objects in the cage at dawn: a smooth, white pebble; a short length of red wool yarn; and a broken shard of blue glass. He’d scattered them separately. He watched.

  Jacquot ignored them for hours. Then, mid-afternoon, he hopped down. He picked up the white pebble. Not to his usual stash in the corner. He carried it to the center of the cage floor, clean of straw. He placed it. He fetched the red yarn. He didn’t play with it. He laid it carefully *across* the pebble, forming a crude ‘X’. Then he retrieved the blue glass shard. He placed it a precise beak-length *above* the crossed pebble and yarn. He stepped back. He looked at Adrien. Then he looked at the arrangement. Then back at Adrien. A soft, guttural *kraa* escaped him.

  Adrien’s breath hitched. The pebble, white like bone or cloud? The yarn, red like blood or berries? The glass, blue like sky or water? Arranged deliberately: base, cross, apex. A marker? A warning? A meaningless juxtaposition triggered by some internal hydraulic pressure? There was no food here, no mate, no predator. The objects were novel, their placement novel. By the strict, brittle letter of the Academy’s charter – the charter founded on Monsieur Descartes' profound distinction – this *was* it. The unprompted, creative deployment of objects as signs.

  He imagined writing it: *Subject 14 assembled disparate novel objects (white pebble, red yarn, blue glass shard) into a novel configuration (base, crossed element, apex) in a neutral locus. Observed configuration, then observer. Vocalization noted. No environmental prompt discernible. Evidence satisfies Charter Clause IV for potential sign deployment indicative of thought.*

  He also imagined Leclair’s face. The Philosopher’s entire reputation rested on demonstrating the flawless application of Cartesian principles. Finding a thinking beast here, now, under this charter… it wouldn’t be a discovery; it would be an indictment of the criterion itself. Leclair would dissect the entry: Was the center truly neutral? Was the vocalization truly directed? Was ‘apex’ an interpretation? He’d demand: *Disposition: complex object manipulation influenced by innate pattern-seeking and random environmental factors (light on glass?).*

  And who was Adrien to argue? A clerk. A recorder. His job was observation, not interpretation. Yet the charter demanded he *judge* whether the action met the criterion for evidence. The tension was a vise. The charter wasn’t a neutral tool; it was the battleground. Applying it *was* defending a conclusion – either the conclusion that animals were machines, or the terrifying possibility that they weren’t. The very act of looking for the absence of environmental prompting forced him into a position of… faith? Was he trying to *disprove* mechanism, or merely record objectively? Could he even separate the two anymore? Jacquot’s black eye held no answers, only reflection.

  He thought of the patron, the Duc de Savigny, who funded the Academy, a man fascinated by the beast-machine doctrine but impatient for definitive results. The ledger was sent to him monthly. What would the Duc see in this entry? A diligent clerk? A troublemaker? Proof of his philosopher’s acumen? Or a crack in the edifice?

  Adrien dipped his quill. The ink was thick, black. Jacquot shuffled on his perch, preening a wing feather, utterly mundane. The arrangement on the floor glinted under the high window: white, crossed with red, blue above. A sign? Or just stuff? The charter demanded a verdict, yet offered no way to be certain. Its criteria were the bars of Jacquot’s cage, and Adrien’s own.

  He began to write, the quill scratching loudly in the quiet, hay-scented air. He wrote not what he feared, nor what he hoped, but the strict, observable facts laid out by the Academy’s own uncompromising rules. The interpretation belonged to the reader, to the Duc, to Descartes' ghost, to the future. His duty was only to the ledger, and to the ambiguous, unsettling truth lying on the cage floor.

  *Entry 348: Subject 14 (Corvus monedula, 'Jacquot'). Presented with three novel objects at dawn: white quartz pebble, red-dyed wool yarn (approx. 3 inches), blue glass shard (irregular). Objects scattered separately. Subject ignored objects for approx. 5 hours. Subsequently, collected pebble, placed centrally on clean cage floor. Collected yarn, placed crossing pebble. Collected glass shard, placed approx. 1.5 inches above crossed pebble/yarn junction. Subject then retreated approx. 6 inches, observed arrangement for 30 seconds. Subject then turned head, observed this recorder for approx. 5 seconds. Subject vocalized once (low *kraa*). No food, water, potential mate, predator, or other significant environmental stimulus present at locus of arrangement during or immediately prior to event. Configuration unprecedented in prior observations of Subject 14.*
