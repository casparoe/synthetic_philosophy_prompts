prompt: |-
  I'm preparing a twenty-five-minute talk for a graduate workshop on transitional justice, and the assigned theme is the retroactivity objection to the postwar tribunals — the charge that Nuremberg and Tokyo punished individuals for conduct that was not criminal under law binding on them at the time they committed it. My own view is that the objection is real but survivable; the convenor's view, which she has stated more than once, is that it is fatal and that everything else offered in reply is decoration. To stop the two of us talking past each other, we've agreed on a single exercise, and I'd like your help running it properly before the talk.

  The exercise is a portability test. Take each of the standard replies to the objection and ask how much of its work survives being lifted out of 1945–48 and transplanted into a hypothetical present-day tribunal: convened not by victors but by a broad coalition including several states that were not parties to the underlying conflict; operating under a charter drafted in advance and opened for accession; staffed partly by judges whose states have no stake in the outcome; and trying senior officials of a state that remains intact, undefeated, and in possession of its own functioning courts. The charge is a deliberate, years-long policy of severing food, water, and medical supply to a besieged civilian population — lawful under the domestic law of that state when it was adopted, never adjudicated as criminal under international law either, and matched within living memory by closely analogous practices of several members of the prosecuting coalition. The point of the transplant is to strip away the two things that quietly carry most of the 1945 replies — the defendants' total defeat, and the fact that the world has since converged on the monstrosity of what they did — and to see what is actually left standing.

  Here are the seven replies on my list, stated as I understand them:

  1. The treaty-notice reply: aggressive war had already been renounced as an instrument of national policy by multilateral treaty between the wars, so the defendants had notice that the conduct was legally condemned even though no court existed to enforce the condemnation.
  2. The general-principles reply: what was in fact punished was mass murder and systematic cruelty, and those were crimes under principles shared by the domestic legal systems of every civilized state; international law needed no special code to reach them.
  3. The structural reply: *nullum crimen, nulla poena sine lege* is a constraint that makes sense inside a legal order with a legislature that can be told what to enact; an order with no legislature and no criminal code cannot be held to that standard, and insisting on it mistakes a domestic rule of law for a universal one.
  4. The threshold reply in the spirit of Radbruch: there is a point at which an enactment violates elementary justice so grossly that it forfeits the character of law and can shelter no one, and defendants who hid behind such enactments cannot complain when the shield is refused.
  5. The pre-existing-obligation reply: international law had long imposed duties directly on individuals rather than only on states — piracy being the standing case, together with the interwar prosecutions for violations of the laws of war — so the premise that only states can bear liability under international law was already obsolete before the charters were drafted.
  6. The lesser-evil reply: even granting that the proceedings were legally defective, the alternatives actually on the table were summary execution or nothing at all, and a flawed public trial that gives the accused counsel, a forum, and an evidentiary record beats both.
  7. The forum-and-personnel reply: whatever turns on who sat on the bench and who staffed the prosecution — victors' jurisdiction, the presence of a judge whose own state had massacred Polish officers it then tried to charge to the defendants, the decision to assess no punishment on the submarine-warfare count once the defence produced written answers from the Allied naval commander in the Pacific about Allied practice — is an objection to the administration of the tribunal rather than to the law it applied, and imperfect administration does not make a substantively correct verdict unjust.

  For each of the seven, give me three things. First, a portability score from 0 to 10, where 10 means the reply does exactly as much work in the hypothetical as it did at Nuremberg and 0 means it is emptied out entirely once the defendants' defeat and the settled moral consensus are removed. Second, two or three sentences of justification that identify what inside the reply is doing the work and say precisely where it breaks under transplant — I want the diagnosis, not a restatement of the reply. Third, a verdict on whether the reply absorbs the objection or relocates it: absorbing means it shows the objection misdescribes the legal situation; relocating means it concedes the objection's premise and then argues the concession is tolerable. Please note explicitly that I regard these as different achievements and that a high-scoring relocating reply should not be treated as answering the same worry as a high-scoring absorbing one.

  Then, on top of the seven assessments: tell me which of the replies collapse into one another or are parasitic on each other, so that the list is really shorter than it looks; give me a single ordered ranking from most to least portable, with any ties broken and the tie-breaking reason stated; and tell me which one reply you would stake the thesis of the talk on if you had to commit to one, together with the strongest counterargument available to someone in the convenor's position. As a final check, say whether the dissenting opinion delivered at Tokyo — which pressed the retroactivity objection hardest and would have acquitted across the board — gains or loses force in the hypothetical, and why. I'll supply all the references myself, so don't give me a bibliography or a list of further reading; what I need is your judgment on the seven scores, the ranking, and the reasoning behind them.
reasoning: |-
  Okay, the user is preparing a 25-minute talk on the retroactivity objection to postwar tribunals, specifically Nuremberg and Tokyo. They're focusing on a portability test to evaluate seven standard replies to this objection. The goal is to see how these replies hold up in a hypothetical modern tribunal scenario that strips away the context of total defeat and established moral consensus. 

  The user's own view is that the retroactivity objection is survivable, while the convenor believes it's fatal. They've agreed on this exercise to avoid talking past each other. I need to assess each of the seven replies based on portability, explaining where they break under transplant, and classify them as absorbing or relocating the objection. Then I'll identify dependencies between replies, rank them by portability, choose the strongest one for the thesis, and analyze how the Tokyo dissent fares in the hypothetical.

  Breaking down the task:
  First, for each reply, I'll assign a portability score (0-10) and justify it by pinpointing what does the work in the original context and why it fails in the hypothetical. I'll explicitly state whether it absorbs or relocates the objection. 

  Looking at the replies:
  1. Treaty-notice: Relies on pre-existing treaties condemning aggression. In the hypothetical, there's no equivalent treaty for sieges, and coalition members have similar conduct. Score low (2/10). Relocating.
  2. General-principles: Assumes universal domestic criminalization of atrocities. In hypothetical, the siege policy isn't clearly criminalized across all relevant states, especially given coalition analogs. Score medium (6/10). Absorbing but weaker.
  3. Structural: Argues nullum crimen doesn't apply to international law without a legislature. This logic holds in hypothetical since international law still lacks a central legislature. Score high (8/10). Absorbing.
  4. Radbruch threshold: Depends on moral consensus about the act's monstrousness. In hypothetical, no such consensus exists due to coalition analogs. Score low (3/10). Relocating.
  5. Pre-existing obligation: Points to individual liability precedents like piracy. Sieges aren't as clearly established as piracy was, and coalition conduct muddies waters. Score medium (5/10). Absorbing but strained.
  6. Lesser-evil: Compares trial to worse alternatives like summary execution. In hypothetical, intact state courts exist as a formal alternative, weakening this argument. Score low (4/10). Relocating.
  7. Forum-and-personnel: Separates procedural flaws from substantive law. In hypothetical, victor's justice concerns are reduced but coalition bias remains problematic. Score medium (7/10). Absorbing.

  Now for dependencies: 
  - Reply 1 (treaty-notice) depends on Reply 5 (pre-existing obligation) for individual liability framework.
  - Reply 4 (Radbruch) leans on Reply 2 (general principles) for "elementary justice" standard.
  - Replies 6 and 7 are independent but address different aspects (alternatives vs. administration).

  Ranking by portability (high to low):
  1. Structural (8/10) - Core logic is system-agnostic
  2. Forum-and-personnel (7/10) - Survives procedural improvements 
  3. General-principles (6/10) - Weakened but not broken
  4. Pre-existing obligation (5/10) - Precedent gap for sieges
  5. Lesser-evil (4/10) - Intact courts undermine necessity 
  6. Radbruch (3/10) - Requires moral consensus
  7. Treaty-notice (2/10) - No equivalent treaty basis

  Thesis recommendation: Stake the talk on the structural reply (Reply 3). It cleanly absorbs the objection by challenging the premise that nullum crimen applies identically in international law. Strongest counterargument: Even if international law is structurally different, retroactive punishment remains normatively unacceptable to prevent abusive prosecutions – a point heightened by coalition members' analogous conduct in the hypothetical.

  Tokyo dissent analysis: The dissent gains force in the hypothetical because the removed factors (defeat/consensus) were what made retroactivity tolerable in 1946. Without them, the objection feels more compelling – especially with coalition hypocrisy exposed.

  The user wants sharp, conceptual analysis – no citations, just rigorous logic dissection. They're clearly well-prepared, so I'll avoid restating basics and focus on the transplant mechanics as requested.
answer: |-
  Here is the portability assessment for each reply, followed by dependencies, ranking, thesis recommendation, and dissent analysis:

  ### 1. **Treaty-Notice Reply**  
     - **Portability Score**: 2/10  
     - **Justification**: Relies on *specific pre-existing treaties* (e.g., Kellogg-Briand) explicitly condemning the charged conduct (aggressive war). In the hypothetical, no equivalent treaty criminalizes sieges targeting civilians, and coalition members' analogous conduct undermines the claim of universal condemnation. Breaks due to lack of *formalized prohibition*.  
     - **Absorb/Relocate**: **Relocates** (concedes retroactivity but argues notice existed).  

  ### 2. **General-Principles Reply**  
     - **Portability Score**: 6/10  
     - **Justification**: Depends on *domestic legal universality* (murder/cruelty crimes in "civilized" systems). Sieges causing mass suffering could align with domestic homicide/assault laws, but the policy’s state-authorization and coalition analogs create ambiguity about whether domestic principles would *actually* apply to state acts. Survives weakly because systemic atrocity still triggers *jus cogens*-adjacent norms.  
     - **Absorb/Relocate**: **Absorbs** (denies retroactivity by asserting pre-existing criminality).  

  ### 3. **Structural Reply**  
     - **Portability Score**: 8/10  
     - **Justification**: Turns on *international law’s inherent statelessness*—no global legislature to pre-define crimes. This logic holds in the hypothetical: international law remains decentralized, so *nullum crimen* cannot bind identically to domestic contexts. Removal of defeat/consensus doesn’t weaken this systemic distinction. Loses 2 points as coalition-drafted charter risks appearing *ad hoc*.  
     - **Absorb/Relocate**: **Absorbs** (rejects the objection’s premise as inapplicable to international law).  

  ### 4. **Radbruch Threshold Reply**  
     - **Portability Score**: 3/10  
     - **Justification**: Requires *overwhelming moral consensus* about the act’s depravity. In the hypothetical, coalition members’ similar siege practices destroy consensus and make "elementary justice" contestable. The reply collapses without historical hindsight universally condemning the conduct.  
     - **Absorb/Relocate**: **Relocates** (concedes legal retroactivity but argues extreme injustice nullifies the law).  

  ### 5. **Pre-Existing-Obligation Reply**  
     - **Portability Score**: 5/10  
     - **Justification**: Leans on *established individual liability precedents* (piracy, war crimes). While ICL now recognizes individual liability, the siege charge lacks a clear precedent like piracy. Coalition conduct further blurs whether the duty was truly "pre-existing." Partial portability stems from ICL’s *general acceptance* of individual responsibility.  
     - **Absorb/Relocate**: **Absorbs** (asserts individual liability was already entrenched).  

  ### 6. **Lesser-Evil Reply**  
     - **Portability Score**: 4/10  
     - **Justification**: Justifies procedural flaws by comparing trial to *worse alternatives* (summary execution). In the hypothetical, intact domestic courts offer a formal alternative, undermining the "necessity" argument. Loses force when "nothing" isn’t the only option.  
     - **Absorb/Relocate**: **Relocates** (admits retroactivity but defends it as the least bad choice).  

  ### 7. **Forum-and-Personnel Reply**  
     - **Portability Score**: 7/10  
     - **Justification**: Separates *procedural bias* from *substantive law*. The hypothetical’s diverse coalition and pre-drafted charter mitigate victors’ justice concerns. Bias objections shift to coalition hypocrisy (analogous sieges), but this targets administration, not retroactivity. Retains strength by quarantining the core legal issue.  
     - **Absorb/Relocate**: **Absorbs** (distinguishes flawed process from valid law).  

  ---

  ### **Dependencies and Condensation**  
  - **Reply 1 (Treaty-Notice) depends on Reply 5**: Treaty-based notice assumes individual liability (Reply 5) exists.  
  - **Reply 4 (Radbruch) leans on Reply 2**: "Elementary justice" often draws from general principles (Reply 2).  
  - **Reply 6 (Lesser-Evil) and Reply 7 (Forum) are independent** but address orthogonal issues (alternatives vs. administration).  
  - **Condensed list**: Effectively **4 core replies**:  
    - Absorbing: General Principles (2), Structural (3), Pre-Existing Obligation (5), Forum (7).  
    - Relocating: Treaty-Notice (1), Radbruch (4), Lesser-Evil (6).  

  ### **Portability Ranking** (High to Low)  
  1. **Structural Reply (8/10)**  
     - Tiebreak: More systemic than Forum/Personnel (7/10); immune to moral/political context.  
  2. **Forum-and-Personnel Reply (7/10)**  
  3. **General Principles Reply (6/10)**  
     - Tiebreak: Stronger than Pre-Existing Obligation (5/10) due to broader normative foundation.  
  4. **Pre-Existing-Obligation Reply (5/10)**  
  5. **Lesser-Evil Reply (4/10)**  
  6. **Radbruch Reply (3/10)**  
  7. **Treaty-Notice Reply (2/10)**  

  ### **Thesis Recommendation**  
  - **Stake the talk on the Structural Reply (3)**. It absorbs the objection by challenging the *applicability* of *nullum crimen* to international law’s structure, making it resilient to the hypothetical’s changes.  
  - **Strongest Counterargument (Convenor’s view)**: Even if international law lacks a legislature, retroactive punishment violates the *rule of law’s purpose*: protecting individuals from arbitrary power. The coalition’s hypocrisy amplifies this—imposing liability for acts it performed entrenches selectivity, not justice.  

  ### **Tokyo Dissent in Hypothetical**  
  - **Gains significant force**. The dissent’s core claim—that retroactivity invalidates the tribunal—becomes *more persuasive* when:  
    - The state is undefeated and has functional courts (highlighting alternatives).  
    - Coalition members’ analogous conduct exposes the charge as *politically targeted*, not legally grounded.  
    - Without postwar moral clarity, the trial appears as power-based law creation.  

  ### Key Insight for Your Talk  
  The Structural Reply is the only one that *fully absorbs* the objection while remaining portable. Relocating replies (Lesser-Evil, Radbruch) concede retroactivity and struggle in the hypothetical. The convenor’s "fatal" view gains traction when replies depend on defeat/consensus—but the Structural Reply forces debate onto *whether domestic legality principles bind international law*. Preempt the hypocrisy counter by arguing that systemic differences *require* international law to develop dynamically, but acknowledge that coalition conduct risks perceptions of victor’s justice.
