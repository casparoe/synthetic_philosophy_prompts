answer: |-
  Your argument exposes a deep tension in population ethics, and your friend is partially right—but there's a principled escape hatch. The flaw lies in treating **intra-personal** and **inter-personal** welfare aggregation identically. Here's how to dissolve the problem while keeping Z and ditching the Mia outcome:

  ### The Core Flaw: Conflating Two Types of Addition
  Your principles (1) "Add" and (3) "Extend" **seem** analogous because both add positive welfare moments. But they differ critically:
  - **Add** creates **new moral patients** (persons) who otherwise wouldn't exist.
  - **Extend** modifies an **existing moral patient**'s life trajectory.  
  This distinction lets you block the Mia inference without undermining Add. You reject *atomistic welfare aggregation within a life* while accepting it *across lives*.

  ### Revised Principles to Block Mia
  1. **Keep Add (Principle 1)**: Adding new people with positive welfare *is* better. New persons have independent moral weight; their welfare doesn't "dilute" existing lives.  
  2. **Keep Trade (Principle 2)**: Trading peak welfare for greater total welfare across *more persons* is acceptable (this gets you to Z).  
  3. **Modify Extend (Principle 3)**:  
     - *Weak Extend*: Adding a *meaningful positive stretch* to a life is better, **but** welfare contributions aren't strictly additive over time.  
     - *Holistic Constraint*: A life's value isn't merely the sum of its moments. Its *narrative structure*, *peak experiences*, and *dignity* matter.  

  **Why this blocks Mia**:  
  Appending 10³⁰ years of barely-positive existence turns Mia's life into a different *kind* of existence—a near-infinite, diluted state that erases the narrative value of her original 80 years. Each "append" might be *locally* better (if the moment is positive), but the *global* transformation destroys holistic value. This is **not** transitive in the way simple addition is.  
  *(Example: Adding sugar to tea improves it incrementally—until it becomes syrup. The 1000th grain isn't equivalent to the 1st.)*

  ### Why Add Isn't Threatened
  Your friend's objection ("welfare moments should be location-invariant") fails because:  
  - **New persons create new narratives**: Adding a person with a barely-positive life adds a *self-contained* story of fulfillment (minimal but intact).  
  - **Extending Mia shatters her narrative**: Her glorious 80-year arc becomes a negligible speck in a vast desert of tedium. The welfare moments aren't "relocated"—they're *decontextualized*, undermining their value.  

  This respects the intuition that **creating a minimally good life is good** (Add), but **turning a magnificent life into a minimally extended one is bad** (Modified Extend).

  ### What You Pay
  1. **Complexity**: You must defend why "life as a narrative whole" matters. Empirical support exists: people value life trajectories (e.g., preferring a short, meaningful life to a long, dull one).  
  2. **Limit Transitivity**: Transitivity holds *within domains* (e.g., Add-to-Add, Trade-to-Trade), but not blindly across *all* transformations. The Mia extension changes the nature of the life, breaking simple chains.  
  3. **Reject Simple Aggregation**: You deny that welfare is *fungible* across time within a life. A year of ecstasy ≠ 100 years of mild contentment.  

  ### Why This Saves Your View
  - **Z remains better than A**: Trade and Add ensure that a vast population of minimally good lives has immense total welfare *distributed across distinct narratives*.  
  - **Mia's 80 years beat her eternal extension**: The extended life isn't a "better version" of her original life—it's a different, degraded state. Weak Extend allows small extensions but blocks infinite dilution.  

  ---
  **In practice**: Adopt a **critical-threshold holism**. For new lives (Add), any welfare >0 suffices. For extending existing lives (Extend), require that additions:  
  - Preserve the life's dignitary integrity (no "ventilator immortality"),  
  - Maintain a minimum welfare density (e.g., no stretches below a threshold that erodes narrative coherence).  

  This keeps the repugnant conclusion (Z > A) while dodging the anti-repugnant Mia result—and your Add principle survives intact. The cost is rejecting welfare atomism *within* lives, but that's a price worth paying.

  > *"A life is not a ledger of moments. To extend a masterpiece with endless margin scribbles is not to improve it."*
