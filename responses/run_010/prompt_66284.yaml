  Looking for a principled distinction. In Add, new persons are added, creating additional moral patients. In Extend, no new patients, just extending one. But the welfare added in Extend is still positive, so why isn't it better? Unless the value of extending a life diminishes if the added quality is low. But principle (3) doesn't allow for that.

