  Okay, let me try to figure out this population ethics puzzle. The user's group has been debating the repugnant conclusion, and they've built an argument that seems to prove too much. They start with three principles: Add, Trade, and Extend. Using these, they can get from a high-quality life for ten billion people to a vast population with barely worthwhile lives. That's the repugnant conclusion, which they might accept. But applying Extend alone leads to Mia's scenario—a wonderful life extended with barely positive years indefinitely—which they find unacceptable.

