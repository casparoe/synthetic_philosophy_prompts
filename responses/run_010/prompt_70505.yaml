  **MEDICAL AND RULES COMMISSION DECISION MEMORANDUM**  
  **TO:** Board of Directors, National Governing Body for Rowing; Representatives for Athletes A and B  
  **DATE:** [Current Date]  
  **SUBJECT:** Rulings on Therapeutic Exemption Requests (Files A-19 and B-17)  

  ---

  ### **I. DECISIONS**  
  **File A-19 (Rower A, age 19):**  
  - **Decision:** **Deny** therapeutic use exemption (TUE).  
  - **Reason:** The treatment resulted in residual capacity exceeding statistical norms for elite rowers, creating a performance advantage inconsistent with WADA-equivalent rules.  
  - **Implementation:** Notification to Athlete A and representatives by **[Date: 10 business days from today]**. Ineligible for competition pending appeal.  

  **File B-17 (Rower B, age 17):**  
  - **Decision:** **Grant** provisional TUE for maintenance medication.  
  - **Reason:** The medication addresses a documented functional deficit without conferring net performance enhancement beyond approximate functional parity.  
  - **Implementation:**  
    - TUE valid for **12 months**, renewable upon annual review.  
    - Notification and documentation submission deadline: **[Date: 15 business days from today]**.  
    - Mandatory quarterly medical reports to the Commission.  

  ---

  ### **II. REASONING FOR ATHLETE A (FILE A-19)**  
  **Why we cannot approve:**  
  1. **The Rule:** Our exemption standard requires that treatment must not improve performance beyond "restoration to normal health." Your childhood therapy successfully treated a congenital condition, but it left you with muscle composition exceeding the typical range for elite rowers. This creates a measurable advantage others cannot achieve, even if unintentional.  
  2. **Fairness:** While you did nothing wrong, permitting this advantage would allow medical history—not current effort or talent—to determine competitive outcomes. Other athletes cannot access this therapy because they lack your specific childhood condition.  
  3. **No "Baseline" to Restore:** The rule assumes a prior state of health to "restore." Your condition existed from birth, so "restoration" does not apply. The Commission cannot ignore the outcome under current standards.  

  **Strongest Argument for Approval (and why it does not prevail):**  
  *Argument:* "Denying eligibility punishes you for receiving necessary childhood medical care." This is deeply unfair, as you followed all rules and your advantage was unintended.  
  *Why it does not prevail:* While sympathetic, the Commission’s duty is to protect fair competition. Permitting an advantage derived from past medical intervention—however justified—would compromise the principle that athletes compete on equal footing. The rules do not account for "inherited" advantages of this kind.  

  **Direct Message to Athlete A:**  
  > *"Your medical journey was necessary and legitimate. However, the outcome places you outside the bounds of what our current rules define as fair competition. This is not a judgment on your character or effort, but a reflection of the challenge in balancing past treatment with present fairness. We regret the personal impact of this decision."*  

  ---

  ### **III. REASONING FOR ATHLETE B (FILE B-17)**  
  **Why we approve:**  
  1. **The Rule:** You have a documented pre-illness baseline. Your maintenance medication does not fully restore you to that baseline (asymmetry persists) and does not push your capabilities beyond typical rowers. It minimizes disadvantage without creating advantage.  
  2. **Medical Necessity:** Discontinuing medication would worsen your asymmetry, likely ending your competitive career. The treatment is not "enhancing" but sustaining basic function.  
  3. **Controlled Approval:** The renewable 12-month TUE ensures ongoing review. If your performance exceeds functional parity, the exemption may be revoked.  

  **Strongest Argument Against Approval (and why it does not prevail):**  
  *Argument:* "Indefinite exemptions risk normalizing permanent artificial advantages."  
  *Why it does not prevail:* Your medication maintains function below your pre-illness baseline and within typical competitive ranges. Annual reviews prevent misuse. Denying this would exclude you from the sport for needing ongoing care—a disproportionate outcome.  

  **Direct Message to Athlete B:**  
  > *"Your request meets the exemption criteria: the medication corrects a significant impairment without giving you an overall edge. We will monitor your case annually to ensure fairness to you and your competitors."*  

  ---

  ### **IV. CONSISTENCY BETWEEN FILES**  
  These decisions are **consistent** under current rules:  
  - **Athlete A** has residual capacity **above** the statistical norm without ongoing need.  
  - **Athlete B** has residual capacity **below** her baseline and requires ongoing treatment to approximate normal function.  
  The distinction turns on **current performance impact**, **ongoing medical necessity**, and **existence of a baseline**.  

  ---

  ### **V. PROPOSED STANDARD FOR CONGENITAL/EARLY-ONSET CONDITIONS**  
  The Commission **recommends adopting** the following standard for future cases:  

  > **"Residual Capacity Standard" (RCS)**  
  > *Athletes with congenital or early-onset conditions may be granted TUEs if:*  
  > 1. Treatment is medically necessary to achieve *functional parity* with peers in daily and athletic tasks;  
  > 2. Residual capacity post-treatment does not exceed the 90th percentile for elite athletes in the relevant discipline;  
  > 3. No reasonable non-prohibited alternative exists.  
  >   
  > *Future panels shall consider:*  
  > - Documented functional limitations pre/post-treatment;  
  > - Statistical norms for the sport (using current data);  
  > - Whether the advantage arises from *correcting a deficit* versus *creating surplus capacity*.  

  **Criteria for Future Cases:**  
  - ✅ **Approve:** Ongoing treatment sustaining function ≤ 75th percentile for the sport.  
  - ⚠️ **Review Case-by-Case:** Residual capacity between 75th–90th percentile.  
  - ❌ **Deny:** Capacity >90th percentile without ongoing medical need.  

  ---

  **COMMISSION CHAIR SIGNATURE:** ________________________  
  **SUBMITTED TO BOARD FOR RATIFICATION BY:** **[Date: 5 business days after circulation]**
