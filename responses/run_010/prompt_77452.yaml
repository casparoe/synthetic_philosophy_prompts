prompt: |-
  I TA a senior seminar on moral motivation and I'm building the worksheet for week 6, the moral worth week. We've already burned through the stock cases in section — Kant's honest shopkeeper, the naturally warm person who helps because they like helping, Huck deciding not to write the letter, the burned-out person who keeps doing the right thing purely from duty — and half my students are pre-law so they keep dragging everything back to mens rea, which is not helping me. What I need is one fresh case that forces them to choose between the two accounts of moral worth that disagree about whether knowledge is required, and I want it engineered rather than stumbled into. Quick recap so we're on the same page. Smith-style account: an act has moral worth only if it's the act that's right for the agent to do, the agent does it for the reason that makes it right, and the agent knows both of those things — knows the act is right and knows that it's right for that reason. Arpaly/Markovits-style account: drop the knowledge clause; what matters is that the agent is actually moved by the features that make the act right and that her being so moved isn't a fluke, so she can have no correct moral beliefs at all, or even think she's doing something rotten, and still act with moral worth. The two are supposed to part company on inverted-belief cases, but every example anyone reaches for is Huck and Jim and my students have seen that one dissected six ways already.

  So build me a case where they come apart, to these specs. (1) The act is right, and right on any plausible normative theory — I don't want a fight about rightness contaminating the fight about worth. (2) The agent is moved by exactly the feature or features that make it right. (3) She has no knowledge, and not even a true belief, that what she's doing is right; her explicit moral view of the situation is inverted, so the Smith knowledge clause fails cleanly rather than marginally. (4) She cant get the belief from anyone either — nobody in her vicinity has it — so you can't rescue her knowledge by way of testimony. (5) She neither enjoys it nor thinks well of herself for it, because the second enjoyment shows up my students relitigate Kant. (6) Setting is contemporary, ordinary, and low stakes: no trolleys, no life and death, nothing about slavery or abolition, something that could plausibly happen on a Tuesday afternoon. (7) She's neither saint nor monster, and she has at least one genuinely unlovely motive in the mix, but not so many that it becomes debatable whether she acted from the right-making feature at all — the divergence has to survive contact with the details. Scenario itself: two paragraphs max, and no philosopher names inside the story.

  Then show me the case works instead of just asserting that it does. Walk the Smith-style account through condition by condition and say exactly which one fails and why; walk the no-knowledge account through and show how non-accidentality is secured, which means naming a few nearby variations on the situation and telling me what she does in each. Then say which single feature of the case is doing the work — I'd guess it's (3) or (4), but argue it, don't just agree with me. Then two stress tests: if I let her have the true belief without the knowledge, does the split survive or does it get weird? and if I delete the unlovely mixed motive, do the two accounts converge? Finish with the best attack a Smith-style defender can mount, especially the charge that my case smuggles the knowledge back in — that being non-accidentally moved by the right-making feature just is knowledge under another name, or that she's been given a de re grasp of the reason that does the work the de dicto belief was supposed to do. If you think that charge lands and the case can't be built to spec, tell me so and say which spec to relax; I'd much rather hear it now than hand out a worksheet that falls apart in section. The whole point is that the verdicts have to come out of the two accounts as stated and not out of how I've described her feelings, so if you catch yourself stipulating a verdict rather than deriving one, flag it.
reasoning: |-
  Hmm, the user is a teaching assistant for a senior seminar on moral motivation, specifically building a worksheet for week 6 on moral worth. They've already used the standard cases—Kant's shopkeeper, the naturally warm helper, Huck Finn, and the burned-out person—but their pre-law students keep dragging discussions back to mens rea, which isn't helpful. They need a fresh case that cleanly separates two accounts of moral worth: the Smith-style knowledge-requiring account and the Arpaly/Markovits-style no-knowledge account.

  The user provides very specific requirements for this case: (1) The act must be uncontroversially right. (2) The agent must be motivated by the right-making features. (3) She must lack true belief that it's right, with an inverted moral view. (4) No available testimony gives her this knowledge. (5) No enjoyment or self-approval to avoid Kantian debates. (6) Contemporary, ordinary setting with low stakes. (7) She must have some unlovely motives but not so many that her primary motivation is obscured.

  I need to create a scenario that meets all these criteria. For the setting, something mundane like a retail or office environment would work well—low stakes but still morally relevant. Perhaps a scenario involving honesty when returning money, since that's clearly right across normative theories.

  For the agent, I'll create Maya, a cashier at a grocery store. She finds extra money in her drawer at the end of her shift. The right-making feature here is the ownership of the money—it belongs to the customer. Maya is motivated to return it because she recognizes it's not hers, though she explicitly believes keeping it would be morally permissible.

  To satisfy requirement (3), I'll give Maya an inverted moral view: she believes that in capitalism, "finders keepers" should apply to small amounts since corporations can absorb the loss. But despite this belief, she returns the money because she's viscerally bothered by the idea of taking what belongs to someone else—this is the right-making feature motivating her action.

  For requirement (4), I'll ensure no one in her environment has the correct belief. Her coworkers might joke about pocketing small amounts, and the manager is indifferent about losses under $20. This blocks any testimonial knowledge.

  For requirement (5), she won't enjoy returning the money—she'll feel irritation at the inconvenience and no moral pride. She might even feel foolish.

  For requirement (7), I'll add mixed motives: she wants to avoid the hassle of explaining the discrepancy and fears setting a bad precedent for herself. But crucially, the primary motivation remains the recognition that the money isn't hers.

  Now to demonstrate how the case works: For Smith's account, Maya fails the knowledge condition—she doesn't believe returning the money is right, much less know it. She actively thinks keeping it would be acceptable. For Arpaly/Markovits, she's non-accidentally motivated by the right-making feature (ownership). This is shown through counterfactuals: if the money were the store's (not customer's), she might keep it; if she thought the customer was rich, she'd still return it; if she found it in a different context (like a tip jar), she might keep it.

  The key feature making this work is requirement (3)—the inverted belief combined with sensitivity to the right-making feature. The mixed motives help ground the lack of enjoyment without undermining the primary motivation.

  Stress tests: If Maya had true belief without knowledge (e.g., guessing correctly that returning is right), Smith would grant moral worth but Arpaly/Markovits might still deny it if the motivation isn't properly aligned. If I remove the unlovely motives, both accounts might converge if she's purely motivated by duty, but that would reintroduce Kantian debates.

  A Smith-style defender might argue that being non-accidentally responsive to right-making features constitutes tacit knowledge. But I think this case avoids that—Maya's responsiveness is perceptual ("this isn't mine") not conceptual ("this is wrong to keep"). Her sensitivity doesn't equate to moral knowledge.

  This case should work as specified, providing a clean separation between the two accounts of moral worth without triggering the issues the user wants to avoid.
answer: |-
  Here's a case engineered to your specifications, designed to force a clean divergence between Smith-style and Arpaly/Markovits-style accounts of moral worth:

  ### The Case: The Overcharge Refund
  Maya works the returns desk at a large electronics store. A customer returns a $50 streaming device, clearly unused, with a valid receipt. Maya processes the refund. As the customer leaves, Maya notices the receipt shows the device was accidentally scanned twice at checkout — the customer was overcharged by $50. The customer is already out the door and unaware. Maya knows store policy: undiscovered overcharge refunds below $100 are not pursued; the hassle outweighs the cost. Coworkers often joke about "stupid tax" for inattentive customers. Maya thinks this policy is perfectly fair — "buyer beware" in a competitive market. She finds the customer mildly annoying (they complained about the parking) and feels no sympathy.

  Yet, Maya pauses. The thought of the customer unknowingly paying $50 too much *irritates* her — not because she pities them, but because the discrepancy *feels like a physical itch*, an imbalance that shouldn't be there. It’s *their* money, not the store's, and the store didn't earn it. She sighs, annoyed at the extra work, and runs after the customer into the parking lot to refund the $50. She doesn’t feel good about it; she feels slightly foolish and inconvenienced. She believes she’s just being overly fussy, not morally good.

  ### Why the Act is Uncontroversially Right (Spec 1)
  Returning mistakenly taken property is right under any plausible normative theory (deontology: respecting property; utilitarianism: correcting harm/inefficiency; virtue ethics: honesty). The overcharge wasn't earned, the customer owns the $50.

  ### Walking Through the Accounts

  1.  **Smith-Style Account (Fails on Knowledge/Belief):**
      *   *Act is right:* Yes (returning mistaken overcharge).
      *   *Agent does it for the right reason:* Yes (she's moved by the feature that makes it right: *it's the customer's money, not the store's*).
      *   *Agent knows the act is right and knows it's right for that reason:* **NO.** This is the failure point. Maya explicitly believes the act is *not* morally required ("buyer beware" is fair, policy is fine). She thinks pursuing the refund is merely "fussy," not right. She has an *inverted* belief: she thinks *not* refunding is permissible. She lacks true belief, let alone knowledge, that refunding is right or that "it's the customer's money" is a right-making reason. No testimony is available (coworkers/managers share her lax view - Spec 4). Therefore, Smith denies moral worth.

  2.  **Arpaly/Markovits-Style Account (Satisfies Non-Accidental Motivation):**
      *   *Act is right:* Yes.
      *   *Agent is moved by the right-making features:* Yes (she is moved by the fact that *the money belongs to the customer and doesn't belong to the store* – this is what creates the "itch").
      *   *Being so moved isn't a fluke:* **YES.** Her motivation tracks the right-making features non-accidentally. We see this in nearby counterfactuals:
          *   *Variation A (Different Right-Maker):* Suppose the $50 was store profit from a legitimate sale (e.g., the device wasn't overcharged, but was later discounted). The "itch" wouldn't arise; Maya wouldn't chase the customer. Her motivation tracks *ownership/desert*, not just giving money away.
          *   *Variation B (Different Belief, Same Right-Maker):* Suppose Maya *did* believe refunding was morally required (maybe she read Kant that morning). Her "itch" would still be the primary motivator. The motivation isn't dependent on the belief.
          *   *Variation C (Different Agent Sensitivity):* If the cause was purely a random impulse or a fleeting mood, she might not act. But her reaction ("itch") is reliably triggered by perceptions of *unearned possession/ownership imbalance* in low-stakes contexts. She corrected a similar undercharge error last week (though grumbled). Her responsiveness to this specific feature of situations (ownership/desert) is stable, even if she mislabels it morally.
      *   *No Enjoyment/Self-Approval:* She feels inconvenienced and foolish, not enjoyment or pride (Spec 5). Her motives are mixed (mild irritation at the customer, desire to avoid hassle of later discrepancy questions - Spec 7), but the primary motive triggering action is the recognition of the ownership imbalance.

  ### The Key Feature Doing the Work
  Specification (3) – **the inverted explicit belief** – is the core engine. Maya is reliably motivated by the right-making feature (ownership/desert) *while explicitly believing the opposite moral judgment about the act*. This cleanly severs motivation by the right reason from knowledge/true belief about rightness. Spec (4) reinforces this by ensuring the belief cannot be salvaged externally. The mixed motive (7) grounds the lack of enjoyment and makes her psychology plausible without undermining the primary right-making motivation.

  ### Stress Tests

  1.  **True Belief Without Knowledge:** Suppose Maya *guesses* correctly that refunding is the right thing to do, but has no justification (e.g., "I dunno, just feels like I should, but 'buyer beware' makes sense too"). Smith *might* grant moral worth (if "guessing" counts as a true belief, even if unjustified/knowledge-less), as the knowledge clause is now (weakly) satisfied. Arpaly/Markovits likely *deny* moral worth, as the motivation might now be driven *by* the flimsy belief ("I guess I should") rather than directly by the right-making feature (ownership), or the connection between the feature and motivation might be less direct/stable. The verdicts **converge weakly** (both *might* say yes, but for different reasons) or **diverge differently** (Smith yes on belief, Arpaly/Markovits potentially no if motivation shifts). The clean split *frays*.
  2.  **Delete the Unlovely Mixed Motive:** Suppose Maya feels *only* the "itch" about the ownership imbalance, with no annoyance or sense of foolishness. Smith still denies (no knowledge/true belief). Arpaly/Markovits still affirm (motivation by right feature, non-accidental). **The divergence survives.** However, removing the mixed motive risks making her motivation seem *purer* but potentially reintroduces debates about whether the "itch" itself is a kind of affective self-approval or enjoyment (relitigating Kant). Keeping the unlovely motive helps *block* that interpretation (Spec 5/7).

  ### Best Attack from a Smith Defender & Defense
  **Attack:** "You've smuggled knowledge in! Maya's 'itch' *just is* a form of non-conceptual, perceptual, or de re *knowledge* of the right-making feature ('this money isn't the store's'). Her reliable sensitivity *constitutes* a kind of tacit knowledge that this feature is a reason for action, even if she can't articulate it as a moral principle. This satisfies the spirit, if not the letter, of the knowledge requirement."

  **Defense & Case Viability:**
  *   **Why it's a strong attack:** It targets the core mechanism – non-accidental motivation by the right feature – and argues it's functionally equivalent to knowledge.
  *   **Why the case still works (as specified) and the attack can be parried:**
      *   **De Re vs. De Dicto:** Smith requires de dicto belief/knowledge *that the act is morally right*. Maya has de re awareness *of the feature* (she perceives the ownership fact), but she *lacks* any de dicto belief connecting that feature to moral rightness. In fact, she denies it. Smith's clause is about moral knowledge/belief, not perceptual knowledge of non-moral facts. Her "itch" is a *motivational response* to the perceived fact, not a *judgment* about its moral valence.
      *   **'Knowledge' Requires Conceptual Articulation?** Smith likely requires that the agent conceptualizes the reason *as* a moral reason (or at least as a reason *for* the right act). Maya conceptualizes the "itch" as fussiness, not morality. Her sensitivity doesn't equate to *moral* knowledge.
      *   **The Inverted Belief is Key:** The explicit inverted belief ("buyer beware is fair, this is just me being fussy") actively *blocks* attributing tacit moral knowledge to her. It demonstrates her *failure* to grasp the moral relevance of the feature she's sensitive to.
      *   **Non-Accidentality ≠ Knowledge:** While reliability often accompanies knowledge, Arpaly/Markovits argue that reliable *motivational sensitivity* to right-making features is distinct from *epistemic* justification/knowledge. One can be reliably moved by X without knowing that X *is* a reason (or morally relevant). Maya is a case in point.
      *   **Verdict is Derived:** The divergent verdicts fall out directly from the explicit clauses of the theories applied to the stipulated facts (her motivation, her explicit belief, her reliability pattern). The description of the "itch" is meant to *explain* the source of her motivation and its stability, not stipulate the verdict.

  **Conclusion:** The case is viable as specified. It cleanly separates the accounts by leveraging an inverted explicit belief (Spec 3) while ensuring non-accidental motivation by the right-making feature (via Spec 2 & counterfactuals). The Smith defender's attack is serious but can be countered by insisting on the distinction between de re sensitivity to non-moral facts and de dicto moral belief/knowledge, highlighted by Maya's explicit denial of the moral significance of the feature she's moved by. This case should withstand section scrutiny and force the debate you want.
