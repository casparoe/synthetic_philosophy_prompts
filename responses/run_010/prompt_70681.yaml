  Just got back from a roughly three-hour argument with my roommate about Simpson's paradox, and it ended with both of us admitting we couldn't actually produce a clean example of the thing we each believe. His position is basically "always disaggregate, the aggregate number is a lie waiting to happen" — he'll break a 2x2 down by anything he happens to have measured, site, quarter, severity band, whatever. Mine is that sometimes the aggregate is the *only* number that answers the question you asked, and that breaking it down is exactly how you get it wrong. We both kept reaching for the same stock examples (the university admissions one, the kidney stone treatment one) and both of those support him, which was irritating. So I want you to build me the case that supports me, to spec, so I can throw it at him next time he's over.

  What I want is a fictional but completely realistic program-evaluation or clinical dataset — no urns, no dice, no colored balls, nothing sci-fi — comparing two options (call them the new protocol and the old one) on a binary outcome. Constraints: (1) in the aggregate, the new option is clearly better; (2) broken down by a single measured variable that any competent analyst would be tempted to stratify by, the new option looks worse in *every* stratum, not just on average across strata; (3) the two groups have to be comparable going in — randomize them if you like — and the breakdown variable can't be a plain pre-existing confounder, otherwise he just says "see, condition on it," so the reversal has to come out of where that variable sits in the causal structure rather than out of some lurking factor you quietly left unmeasured; (4) small enough to check by hand — integer counts, total under about 400 cases, and at least 25 people in each of the four treatment-by-stratum cells so he can't wave the within-stratum reversal off as noise; (5) every gap worth at least five percentage points, so nothing hinges on a rounding artifact. Make up whatever clinical or program details you need, just keep them plausible enough that a person who actually does this work wouldn't roll their eyes.

  Then show me the whole thing works. Give me the table, the aggregate rates, the within-stratum rates, and the causal story — a little diagram or at least a clear account of what causes what — explaining why conditioning on that variable is the mistake here and what the conditioning is actually doing to the comparison. Tell me which single feature of the case produces the reversal, and what happens to the verdict if you pull that feature out or move it somewhere else in the story. Also: could this exact same table have been generated by a genuine confounder instead, and if so how would you ever tell the two appart from the numbers alone, without just being told the causal facts? Finally, write his best counterattack — assume he's smart and won't strawman himself — give me the strongest version of "always condition on everything you've measured" that survives my case, and say what additional information would settle the dispute if anything can.
