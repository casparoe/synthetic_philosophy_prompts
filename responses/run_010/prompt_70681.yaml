answer: |-
  ### Case Study: Hypertension Drug Trial  
  **Context**: A randomized controlled trial compares a new antihypertensive drug (New Protocol) against the standard drug (Old Protocol). The outcome is blood pressure control (success/failure) after 6 months. An intermediate biomarker (renal function, categorized as "Normal" or "Reduced") is measured 3 months post-treatment. Renal function is known to be *affected* by the drugs and strongly predicts blood pressure control. The new drug boosts renal function but has a direct side effect that impairs blood pressure control.  

  #### Dataset (Total Patients: 300)  
  *Randomized 1:1 (150 per treatment group). Integer counts with all cells >25:*  

  | Treatment    | Renal Function | Successes | Total Patients | Success Rate |
  |--------------|----------------|-----------|----------------|--------------|
  | **Old Protocol** | Normal        | 36        | 120           | 30.0%        |
  |              | Reduced       | 27        | 30            | 90.0%        |
  | **New Protocol** | Normal        | 6         | 30            | 20.0%        |
  |              | Reduced       | 84        | 120           | 70.0%        |

  ---

  ### Aggregate Results (Ignore Renal Function)  
  - **Old Protocol**: 63 successes / 150 patients = **42.0%**  
  - **New Protocol**: 90 successes / 150 patients = **60.0%**  
  → *New Protocol is better by 18 percentage points (p < 0.01, Fisher's exact test).*  

  ### Stratified Results (Conditional on Renal Function)  
  - **Normal Renal Function**:  
    - Old Protocol: 36/120 = **30.0%**  
    - New Protocol: 6/30 = **20.0%**  
    → *Old Protocol better by 10 percentage points.*  
  - **Reduced Renal Function**:  
    - Old Protocol: 27/30 = **90.0%**  
    - New Protocol: 84/120 = **70.0%**  
    → *Old Protocol better by 20 percentage points.*  

  **Paradox**: The New Protocol wins overall but loses decisively in every stratum.  

  ---

  ### Causal Story: Why Conditioning Is the Mistake  
  #### Causal Diagram  
  ```mermaid
  graph LR
      T(Treatment) --> M(Renal Function)
      T --> Y(Blood Pressure Control)
      M --> Y
      U(Unmeasured Factors) --> M
      U --> Y
  ```  
  - **Treatment (T)** affects **Renal Function (M)**: The New Protocol strongly improves renal function (hence more "Normal" results).  
  - **Renal Function (M)** affects **Outcome (Y)**: "Normal" renal function *reduces* success chances (due to disease physiology: in hypertension, overly aggressive renal response can exacerbate blood pressure issues).  
  - **Treatment (T)** has a **direct effect on Outcome (Y)**: The New Protocol has a side effect that directly impairs blood pressure control.  
  - **Key Feature Driving Reversal**: Renal function is a **mediator** (post-treatment variable) and **not a confounder**. Conditioning on it:  
    1. Blocks the *beneficial indirect path* (New Protocol → Improved Renal Function → Worse Outcome).  
    2. Isolates the *harmful direct effect* (New Protocol → Worse Outcome).  

  #### Why Aggregate Is Correct  
  - The question: *"Which drug performs better overall?"*  
  - The New Protocol’s overall effect is positive because its strong improvement in renal function (indirect path) outweighs its harmful direct effect. Conditioning on renal function hides this benefit by "fixing" renal function artificially.  
  - **Analogy**: Judging a diet by conditioning on weight loss. If Diet A causes more weight loss (beneficial) but has direct health risks (harmful), the aggregate outcome (e.g., heart attack risk) could still favor Diet A. Conditioning on weight loss would mislead by ignoring the diet’s primary benefit.  

  ---

  ### What If the Feature Changed?  
  - **Remove the direct harmful effect**: If the New Protocol had no side effects, it would win in both aggregate and strata (e.g., 80% success in both strata).  
  - **Make renal function a confounder**: If renal function were pre-existing (not affected by treatment), the strata would reflect genuine subgroups, and conditioning would be valid. But here, randomization ensures pre-treatment comparability, and renal function imbalance (*Normal*: Old 80% vs. New 20%) proves it’s post-treatment.  

  ---

  ### Could This Table Come From a Confounder?  
  **Yes, but unlikely given randomization and data patterns**:  
  - If renal function were a confounder (pre-existing), randomization would balance it across groups (≈50% Normal in each). Here, extreme imbalance (Old: 80% Normal, New: 20% Normal) signals it’s *caused* by treatment.  
  - **How to distinguish without causal knowledge**:  
    1. Check timing: If renal function is measured post-treatment, it’s likely a mediator.  
    2. Test balance: In randomized trials, pre-treatment variables should be balanced. Imbalance implies post-treatment mechanism.  
    3. Use domain knowledge: Renal function is biologically modifiable by antihypertensives.  

  ---

  ### Roommate's Best Counterattack  
  **Strongest "always condition" argument**:  
  *"The aggregate hides critical heterogeneity. Here, conditioning reveals the New Protocol’s consistent harm within biological pathways. If renal function is a *precision medicine* marker (e.g., measured early to guide therapy), strata tell us: ‘For any renal function level, avoid the New Protocol.’ This is actionable for clinicians adjusting treatment mid-trial. The aggregate only answers ‘which drug to give blindly?’—a less useful question in modern personalized care."*  

  **How to settle the dispute**:  
  1. **Clarify the question**:  
     - Policy question (overall drug rollout)? → **Aggregate**.  
     - Mechanistic/personalized question? → **Condition**.  
  2. **Run an experiment**:  
     - Assign treatments *ignoring renal function* → Measure aggregate outcomes.  
     - Assign treatments *based on renal function* → Compare to the above.  
     Result: The first experiment favors New Protocol; the second may not.  
  3. **Measure the mediator’s timing**: If renal function is post-treatment, conditioning for overall effects is biased.  

  --- 

  ### Why This Case Wins Your Argument  
  - **Realistic**: Hypertension drugs with biomarker intermediates are standard.  
  - **Meets all specs**: Aggregate gap (+18%), stratum gaps (-10%/-20%), no confounder (randomized), no noise (N=300, min cell=30), no sci-fi.  
  - **Causal clarity**: The reversal arises solely from conditioning on a mediator, proving aggregation answers "what works overall."  
  **Throw this at him**: "Conditioning on mediators is how you turn a winner into a loser—this table proves it."
