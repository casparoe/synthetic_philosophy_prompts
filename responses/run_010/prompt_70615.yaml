answer: |-
  Here's a precise reconstruction of Aquinas's position on tyrannicide and resistance, resolving the apparent tensions:

  1.  **The Core Permission (Primarily Communal, Not Individual):**
      *   **Source:** *De Regno* (On Kingship), Book I, Chapter 6.
      *   **The Argument:**
          *   Tyranny is the worst form of government, actively harming the common good it's meant to serve.
          *   **First Recourse:** Appeal should be made to a higher human authority (e.g., the emperor over a king, a Pope over a prince-bishop, the collective nobility/elders who elected him).
          *   **"No Human Superior" Scenario:** If *no such higher human authority exists or can be appealed to*, "recourse must be had to God, the King of all, who is a helper in due time in tribulation" (*De Regno*, I.6).
          *   **The Crucial Interpretation:** Aquinas **does not** explicitly say the *private individual* then gains permission to kill. The text reads: "it is the *people* who can depose the king, or restrict his power, if he abuses the royal power tyrannically" (emphasis added). The "recourse to God" likely signifies that God empowers or approves the *community's* action in this extreme case, acting as the ultimate source of authority when human superiors fail. The "people" (*populus*) implies a *public act*, not a private one.
      *   **The Lone Agent:** Aquinas offers **no clear, positive permission** for a *private individual* acting alone in the "no-superior" case. The logic flows towards the *community* acting as a corporate body (however informally constituted) as the legitimate agent. A lone assassin lacks the *public authority* Aquinas consistently requires. His silence on the individual strongly suggests he did not endorse it.

  2.  **Sedition and the Tyrant (Secunda Secundae, Q. 42):**
      *   **Sedition Defined:** "Sedition is contrary to the unity of the multitude, viz. the people of a city or kingdom" (ST II-II, Q42, A1). It's a special sin against charity and the common good, mortal by genus.
      *   **The Exception:** "A tyrannical government is not just... Consequently there is no sedition in disturbing a government of this kind, unless indeed the tyrant's rule be disturbed so inordinately, that his subjects suffer greater harm from the consequent disturbance than from the tyrant's government" (ST II-II, Q42, A2, ad 3).
      *   **The Tyrant as Seditious:** "He who opposes the tyrant... is not seditious, save accidentally... For it is the tyrant rather that is guilty of sedition, since he encourages discord and sedition among his subjects, that he may lord over them more securely" (ST II-II, Q42, A2, ad 3).
      *   **Resolution:** This confirms the *legitimacy of resistance* to tyranny, framing it as *defense of the true common good and unity* against the *real* seditious party (the tyrant). Crucially, it **does not specify the agent**. The resistance discussed here is logically consistent with *public* or *representative* action. The warning against causing "greater harm" implicitly argues against reckless or purely private action likely to cause chaos.

  **Reconciling De Regno and Sedition:**

  *   Both texts agree: Tyranny is illegitimate and resistance can be justified.
  *   Both implicitly or explicitly point to the *community* or its *representatives* (the "people," public authority, those acting *for* the common good) as the legitimate agents, *not* private individuals acting on their own initiative.
  *   The "recourse to God" in *De Regno* authorizes the *community* to act in the absence of a human superior, not an individual assassin.
  *   The Sedition question reinforces this by framing *just resistance* as a defense of true unity against the tyrant's seditious disruption, but again avoids endorsing private vigilantism, emphasizing the danger of disproportionate harm.

  **Addressing Your Specific Questions:**

  1.  **Is the permission genuinely individual?**
      *   **No.** Aquinas's primary permission resides with the *community* ("the people") acting as a public body, especially in the "no-superior" case. The lone agent lacks explicit authorization. The "recourse to God" empowers the corporate community, not the private individual.

  2.  **How does it sit with Sedition?**
      *   **Consistently.** The Sedition exception *permits resistance* but does *not specify the agent*. Aquinas's overall framework strongly implies this resistance should be undertaken by the *community* or its legitimate representatives acting *publicly* for the common good, aligning perfectly with *De Regno*. Condemning sedition *as private factionalism* while permitting resistance *as public defense* avoids contradiction. The tyrant being "seditious" highlights his *betrayal of the public trust and unity*.

  **Where the Permission Resides (Correcting the Misreading):**
  The permission resides in the **community** ("the people") acting as a *public authority* in the absence of a higher human authority, justified by recourse to God as the ultimate source of political power. It is **not** a permission granted to private individuals.

  **Aquinas's Resistance to Private Action: Primarily Jurisdictional, Supplemented by Consequentialism:**

  1.  **Jurisdictional (Primary Reason):** Aquinas's core objection is that a private individual **lacks the standing (auctoritas)** to judge and execute a ruler. Political authority, including the right to punish (which deposition/execution ultimately is), is a public power derived from God and vested in the community and its designated officers (ST I-II, Q90, A3; ST II-II, Q64, A3). A private person usurps this public function. They are not a legitimate judge or executioner.
  2.  **Consequentialist (Secondary Reason):** Aquinas *also* recognizes the high risk private action entails: "unless perhaps it be done by public authority... if it be done by private authority, it involves the danger of the multitude being thrown into confusion" (Commentary on the Sentences, II, d. 44, q. 2, a. 2 - often cited alongside *De Regno*). The risk of chaos, civil war, or worse tyranny replacing the current one weighs heavily against private action.

  **Why the Distinction Matters for Modern Conclusions:**

  *   **Jurisdictional Reading:** Supports resistance understood as **collective, public action** – revolutions, coups by legitimate bodies (military, councils, assemblies), popular uprisings *representing the community*, constitutional processes. It firmly **rejects assassination or vigilantism** as illegitimate usurpation of public power.
  *   **Purely Consequentialist Reading:** Could *potentially* (though Aquinas himself doesn't) leave room for private action *if* the individual could somehow guarantee success and a better outcome without chaos (a near-impossible bar, but theoretically). This reading is more vulnerable to justifying individual acts of terrorism or assassination framed as "necessary evils."

  **Conclusion:** Aquinas provides a robust justification for *resisting and deposing tyrants*, locating the legitimate authority for this action firmly within the *community* ("the people") acting publicly, especially when no higher human authority exists. While he condemns sedition as sinful factionalism, he explicitly carves out resistance to tyranny as legitimate defense of the common good. His resistance to *private* tyrannicide is primarily jurisdictional (lacking legitimate authority), strongly reinforced by consequentialist concerns about the dangers of private violence. The common forum misreading of an *individual* permission in *De Regno* does not withstand scrutiny when placed alongside his treatment of sedition and his core principles of authority and the common good.
