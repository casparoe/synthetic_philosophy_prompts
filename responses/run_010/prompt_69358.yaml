  ## WHITEPAPER: KESTREL VALLEY ACRE-TOKEN (KVA)  
  *A Proposal of the Kestrel Valley Land Bank*

  **EXECUTIVE SUMMARY**

  1.  Whether this document proposes a token, the Acre-Token (KVA), to be issued against the landholdings stewarded by the Kestrel Valley Land Bank, representing not the land itself, but a claim upon future labour performed within the valley.
  2.  Whether such tokens are mere counters, facilitating exchange where metal coin proves scarce or ill-suited to local industry.
  3.  Whether their purpose is solely to set idle hands to work, their value arising not from substance but from their power to mobilize productive activity.
  4.  Whether the quantity in circulation ought to be managed deliberately by a public trust, responsive to the needs of industry and employment, rather than left to the vagaries of imported specie or private hoarders.
  5.  Whether the entire scheme rests upon the fundamental proposition that wealth resides not in the token, nor even solely in the land, but in the industry it can command.

  **THE PROBLEM**

  6.  Whether the scarcity of coin in our valley acts as a fetter upon honest industry, leaving good wool unsold, sound timber unworked, and willing hands idle.
  7.  Whether the hoarding of metal money, prized for its substance alone, represents a profound confusion, mistaking the sign for the thing signified, to the detriment of the common weal.
  8.  Whether reliance on distant mints and the whims of foreign merchants renders our local economy perpetually vulnerable to paralysis.
  9.  Whether the present want of a sufficient circulating medium stifles the exchange of goods and services amongst ourselves, forcing dependence upon uncertain external markets.
  10. Whether a community possessed of land and labour lacks only a suitable token to unlock its inherent productive capacity.

  **THE MECHANISM**

  11.  Whether the Kestrel Valley Land Bank shall issue paper tokens, denominated as Acre-Tokens (KVA), upon application by members possessing land leases within the trust.
  12.  Whether the issuance shall be proportional not to the absolute value of the land, but to its estimated capacity, under prudent stewardship, to sustain productive employment for a term of years.
  13.  Whether these tokens shall circulate freely amongst all members of the mutual-credit association, accepted as payment for goods and labour.
  14.  Whether the holder of a token possesses not a claim upon the land itself, but an acknowledged claim upon the future labour of the community, represented by the token.
  15.  Whether settlement of this claim occurs when labour is rendered, the token being returned to the issuer upon completion of the agreed service, extinguishing the obligation.
  16.  Whether the velocity of such tokens, passing readily from hand to hand, is of greater consequence to industry than their mere accumulation.

  **COLLATERAL & SECURITY**

  17.  Whether the land stewarded by the Kestrel Valley Land Bank provides the ultimate security for the tokens, anchoring their value not in metal but in productive potential.
  18.  Whether this security lies not in the immediate sale value of the land, but in its enduring capacity to support the industry which redeems the tokens.
  19.  Whether the Bank holds the underlying leases as surety against default, ensuring the land remains committed to supporting the circulating medium.

  > *Interjection from the Appointed Sceptic:* **"Tokens secured on land are fine until the harvest fails or the mill burns. The land cannot plough itself. Who guarantees the labour promised? What if the holders of the tokens demand work, but the workers refuse the tokens, or simply leave?"**

  20.  Whether the true security resides not solely in the dirt, but in the covenant of the community to honour labour rendered against tokens issued.
  21.  Whether the continued value of the token depends fundamentally upon the continued belief of the community in its power to command labour and the continued willingness of that community to labour.
  22.  Whether the land's value as collateral is perpetually contingent upon the industry it fosters and the collective will sustaining the system.
  23.  Whether the appointed valuers of land can truly foresee blight, flood, or a sudden decline in the demand for valley produce.
  24.  Whether a significant fall in the perceived value of the underlying land leases must inevitably, or only potentially, undermine confidence in the tokens secured upon them.
  25.  Whether tokens issued against land lying fallow, or held speculatively without immediate productive intent, represent a sound foundation for the circulating medium.
  26.  Whether the departure of skilled hands from the valley renders the labour claims embodied in the tokens less secure, or merely alters the nature of the labour available for redemption.
  27.  Whether a token holder demanding labour has any recourse beyond the community's goodwill should the specific labourers they seek refuse the token or depart.

  **GOVERNANCE**

  28.  Whether the quantity of KVA tokens in circulation shall be managed by a committee of trustees elected from the membership of the Land Bank and the mutual-credit association.
  29.  Whether this committee shall possess the authority to increase the supply of tokens when industry flags for want of counters, observing the idleness of hands and the stagnation of trade.
  30.  Whether it shall likewise possess the authority, and the fortitude, to contract the supply should tokens become too plentiful relative to the goods and labour offered, leading to a diminution in their labour-commanding power.
  31.  Whether such decisions shall be made solely with an eye to maximizing employment and productive exchange within the valley, disregarding the accumulation of tokens as an end in itself.
  32.  Whether the temptation to issue tokens for the immediate relief of particular members, or for public works deemed urgent, can be consistently resisted when prudence might dictate restraint.

  **ROADMAP**

  33.  Whether Phase One shall involve the meticulous appraisal of all trust-held land parcels and the establishment of initial issuance ratios for KVA, based on sustainable employment potential.
  34.  Whether an initial issuance cap of 100,000 KVA shall be established, representing the estimated labour potential of the current leased acreage under active cultivation and use.
  35.  Whether Phase Two shall see the distribution of the initial token allocation to qualifying leaseholders and the commencement of circulation within the mutual-credit network.
  36.  Whether Phase Three shall involve the establishment of the trustee committee and the development of protocols for monitoring token velocity and employment levels.
  37.  Whether, upon the successful integration of KVA into local exchange and the demonstration of its efficacy in stimulating industry, the committee shall consider petitions for additional issuance from holders of newly leased or previously fallow land parcels brought into production.
  38.  Whether the initial supply cap shall be understood as a provisional starting point, subject to revision based on demonstrable need and the proven absorption capacity of the valley's industry.
  39.  Whether the ultimate constraint on issuance is not an arbitrary number, but the administrative capacity of the committee to discern the genuine requirements of full employment and avoid the devaluation of the token through excess.

  **RISK FACTORS**

  40.  Whether the entire system rests upon a shared understanding of the token's nature as a labour counter, a understanding vulnerable to erosion if members begin to hoard tokens as though they were specie.
  41.  Whether the valuation of land as collateral is inherently subjective and subject to dispute, especially in times of economic distress.
  42.  Whether a sudden loss of confidence in the tokens, perhaps triggered by external events or internal discord, could lead to a refusal of labour and a collapse of the system, regardless of the underlying land value.
  43.  Whether the commitment of future labour is enforceable only by social sanction and mutual trust, lacking the force of law that binds repayment of metal coin debts.
  44.  Whether the managing committee possesses sufficient wisdom, foresight, and independence to navigate the complex task of regulating the token supply amidst competing pressures and partial interests.

  **FREQUENTLY ASKED QUESTIONS**

  45.  Whether KVA tokens are money? *(*See Queries 2, 3, 14*)*
  46.  Whether I can redeem my tokens for actual acres of land? *(*See Query 14*)*
  47.  Whether tokens can be used outside the Kestrel Valley? *(*Their primary purpose is internal exchange; acceptance elsewhere depends on others' belief*)*
  48.  Whether the Land Bank guarantees the value of KVA? *(*Value arises from labour commanded, not Bank guarantee; security is the land's productive potential under community covenant*)*
  49.  Whether more tokens will make us richer? *(*Only if they set more idle hands to work; excess tokens without increased production diminish the labour-commanding power of each*)*
  50.  **Whether a community that meticulously records claims on its own future labour, issuing tokens as mere counters of obligation, has thereby created new wealth, or merely made visible the potential for industry that already resided within it?**
