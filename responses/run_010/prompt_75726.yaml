     Problem 2: Count the numbers n in the range [10,100] such that n, n+2, and n+4 are all prime.

     Step 1: Use the independence heuristic. The density of primes around 50 is about 1/ln(50)≈1/3.91≈0.255. Assuming independence, the probability that n, n+2, n+4 are all prime is (0.255)^3≈0.0166.

     Now, we must consider only odd n (because if n is even and >=10, then it is composite). How many odd n in [10,100]? From 11 to 99, inclusive, step 2: 11,13,...,99 → (99-11)/2+1=88/2+1=44+1=45? Actually, 11,13,...,99: first term 11, last 99, number of terms: (99-11)/2 + 1 = 44+1=45. But wait: the problem says [10,100]. n=10: even, skip. So odd n: 11,13,...,99 → 45 numbers.

     Then the estimate: 45 * 0.0166 ≈ 0.747 → about 1.

     Step 2: Now check for actual triplets. 
          n=10: 10,12,14 → not prime.
          n=11: 11,13,15 → 15 not prime.
          n=12: even, skip.
          n=13:13,15,17 → 15 not prime.
          ... 
          Continue: you will find no such triplet.

     So the true count is 0.

     Why the discrepancy? 

  7. Minute-by-minute plan:

     - [0-5 min]: Introduction to heuristic arguments and the independence presumption. Explain Problem 1.
     - [5-15 min]: Students work in groups on Problem 1 (estimate and then actual count). Then quick share: what did you get? (We expect estimates around 23 and actual 21.)
     - [15-20 min]: Transition to Problem 2. Explain the task. 
     - [20-35 min]: Groups work on Problem 2: estimate using independence and then try to find actual triplets. They should get an estimate of about 1 and actual 0. They should try to find the reason (modulo 3).
     - [35-45 min]: Debrief: 
          Why did the first heuristic work well? (No local obstructions: the conditions were independent modulo the primes.)
          Why did the second fail? (Modulo 3, one of the three numbers is always divisible by 3, and for n>=10, that number is composite because it's at least 12.)
          How can we fix the heuristic? (Account for each small prime: for each prime p, compute the proportion of residues mod p that avoid 0 for all three numbers. Then the product of (1 - ν(p)/p) and then divide by the independence model (1-1/p)^k for k events? That's the Hardy-Littlewood way.)
          What is the rule? The independence presumption is valid only when there are no local obstructions (i.e., for every prime p, the conditions are independent modulo p). If for some p, the conditions force a divisibility, then we must correct.
     - [45-50 min]: Historical example: the polynomial n^2+n+2. Without the local obstruction at p=2, we would predict infinitely many primes, but actually it is always even and greater than 2 for |n|>=1, so only n=0 gives a prime (2). 

  8. Predictable problems:
     - In Problem 1, students might include composites that are products of primes >=11, but then realize they are above 100. So they get 21 primes and no composites -> 21.
     - In Problem 2, they might not think to check modulo 3. The instructor should be prepared to prompt: "Check modulo small primes: what happens modulo 2? Modulo 3?"
     - The estimate for Problem 2: they might use the density for n=10 and n=100 and average, or they might use the entire interval without restricting to odd n. If they use all 91 numbers, then the probability for three primes: 0.0166, times 91 ≈ 1.5. Still about 1 or 2. Then when they see 0, it's still a discrepancy. And then they must realize that even n are not prime, so they should have restricted. But the point about modulo 3 is the main issue.

     - The historical example: they might not be familiar with polynomials. But the example is clear: the polynomial always produces even numbers (except at n=0) so composite for |n|>=1.

  9. Philosophical stance: 
     - We take the stance that the independence presumption is a defeasible default: we assume independence unless we detect a local obstruction (i.e., a prime modulus where the conditions are dependent). It is not a fact about the integers but a heuristic model that is often effective. The Chinese Remainder Theorem justifies independence modulo distinct primes, so when there are no forced divisibilities by a fixed prime, the events might be independent.

     - We build the activity so that they see two cases: one without obstructions (so independence works) and one with a clear obstruction (so it fails). Then they learn to check for obstructions.

     - The activity is rigged in our favor: we chose Problem 1 without obstructions and Problem 2 with a strong obstruction. In reality, sometimes the obstructions are subtle. Also, the independence heuristic might fail even without a clear obstruction if there is a global constraint.

     - What will go wrong the first time: 
          - Students might not count the numbers correctly in Problem 1 (forgetting that composites are not possible, or miscounting primes).
          - In Problem 2, they might not immediately see the modulo 3 issue. We can have a hint ready: "Check what happens modulo 3: compute n mod 3, then n+2 mod 3, then n+4 mod 3. What do you notice?"
          - The time might be tight: 50 minutes is short. We might need to provide the actual counts quickly if they are taking too long.

     - But the key is that they experience the failure and then learn to look for obstructions.

  Revised Problem 2 to [10,100] to avoid the triplet (3,5,7) and make the count 0.

