prompt: |-
  I'm TAing a philosophy-of-math course and I've got the 50-minute discussion section on heuristic arguments next week — 14 students, a mix of philosophy and math majors, none of them have done any analytic number theory. I want them to actually use the presumption of independence rather than hear about it, so design a section where they generate the estimates themselves and then collide with the cases that break them.

  Shape I had in mind, but change it if you have something better and say why: first a counting problem where treating the relevant events as independent lands almost exactly on the truth — something like how many n ≤ 100 have no prime factor below 10 — so they get overconfident; then a problem in the same style where the identical move predicts a healthy number and the truth is basically a single example, like counting n where n, n+2 and n+4 are all prime. They should find the obstruction themselves, and I want them to notice that the patch they invent looks like multiplying together little local corrections, one per prime.

  Give me: the problems with the counts actually worked out (small enough to check by hand or a phone calculator, nothing above a few hundred), what goes on the handout, a minute-by-minute plan, debrief questions that push them to state a rule for when independence may be presumed and what would defeat it, and one case where this style of reasoning genuinely led mathematicians astray — pick one you're sure is really that kind of case.

  And take a position. I dont want a neutral "heuristics are handy but fallible" debrief. Say what you think the presumption of independence actually is — a defeasible default, a smuggled-in probabilistic model of the integers, something else — and build the section so they come away feeling that view rather than a rival one. Then flag where the activity is rigging things in your favor, and what will predictably go wrong the first time I run it.
