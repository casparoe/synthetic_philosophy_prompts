answer: |-
  **STANDARD OPERATING PROCEDURE**  
  **TPX-001: FABRICATION & VALIDATION OF PHYSICAL THOUGHT EXPERIMENTS**  
  **Axiom Physics Fabrication Facility (APFF)**  
  **Revision: 7.1**  
  **Effective Date: [DATE]**  
  **Authorized by: Dr. C. A. Non, Principle Investigator**  

  **1. PURPOSE**  
  To establish standardized procedures for the reproducible manufacture, execution, and epistemic validation of novel thought experiments (TEs) investigating physical principles. This SOP ensures outputs meet minimum criteria for logical coherence, intuitive force (where applicable), and compliance with APFF Epistemological Protocols (APFF-EP-2023), accommodating both Interpretive Frameworks A and B (Section 5.1).

  **2. SCOPE**  
  Applies to all TE manufacturing, calibration, validation runs, and associated intuition harvesting conducted within APFF Clean Rooms 1-4 (Intuition Chambers) and Logic Suites A-C. Covers classical TE calibration (Reference TEs: Galileo-1564, Einstein-1905, Maxwell-1867), novel TE production, and post-validation analysis.

  **3. APPARATUS**
  *   3.1 Dedicated Intuition Chambers (IC-1 to IC-4): Faraday-shielded, literature-sanitized environments. Equipped with neutral prompt delivery systems (NLPDS v.4.2) and biometric sensors (GSR, pupil dilation, EEG focus bands).
  *   3.2 Premise Handling Stations (PHS-A to PHS-C): For assembly, disassembly, and sterilization of core premises. Include non-metaphorical gloves.
  *   3.3 Argument Stripping Module (ASM "Occam"): Software suite for Protocol A compliance (imagery/narrative removal, premise isolation, logic chain derivation).
  *   3.4 Intuition Capture & Stabilization Unit (ICSU "Locke"): Hardware/software for Protocol B compliance (a priori intuition capture, phenomenological recording, contamination scrubbing).
  *   3.5 Calibration Reference Bank: Validated digital records of Reference TEs (Galileo-1564, Einstein-1905, Maxwell-1867).
  *   3.6 Decontamination Airlock: For subject entry/exit; mandatory cognitive load dump and literature exposure scrub (LES v.3.1).

  **4. PROCEDURE**
  *   **4.1 TE Manufacture (Novel):**
      1.  Formulate core physical question/puzzle. Log premises (P1, P2...Pn) in PHS Logbook (Form TPX-001-F1). Assign unique TE ID.
      2.  Construct narrative/imagery scaffolding per design spec (DS-TPX-001-Rev2). **Note:** Ensure scaffolding does *not* introduce novel empirical content or logically necessary steps.
      3.  Perform Premise Sterility Check (PSC): Verify premises are non-contingent, non-empirical (protocol-dependent).
  *   **4.2 Calibration Run (Pre-Validation):**
      1.  Weekly: Execute Reference TEs (Galileo-1564: Confirm expected contradiction yields intuitive rejection of Aristotelian dynamics; Einstein-1905: Confirm invariant © intuition capture; Maxwell-1867: Execute Demon Trapdoor Integrity Test).
      2.  Record intuition metrics and logic chain stability. Deviations >5% from historical mean trigger recalibration (Section 7.1).
  *   **4.3 Subject Preparation:**
      1.  Recruit cognitively capable subjects (APFF-Subj-SOP-005). Pre-screen for prior TE literature exposure via LES Questionnaire (Form TPX-001-F2).
      2.  Subjects with >Threshold Exposure (Level 3+, per APFF-EP-2023 Appx. B) undergo full LES decontamination cycle in airlock. Log exposure level.
  *   **4.4 TE Execution & Data Capture:**
      1.  Subject enters designated IC. Deliver TE prompt via NLPDS.
      2.  **Protocol A (Argument Compliance):** Route TE through ASM "Occam". Strip all narrative/imagery. Subject derives conclusion solely from presented premises. Record derivation path, time, confidence.
      3.  **Protocol B (Pure Intuition):** Execute intact TE via ICSU "Locke". Capture raw intuitive response (binary: plausible/impossible; graded: plausibility score) and phenomenological report. Record latency, physiological markers.
      4.  Subject exits via decontamination airlock (cognitive dump).
  *   **4.5 Validation Analysis:**
      1.  **Protocol A:** Verify logical validity of derivation from premises alone. Conclusion must follow necessarily. Log any required auxiliary assumptions (Form TPX-001-F3).
      2.  **Protocol B:** Analyze intuitive force distribution (≥80% consensus required for "Strong Validation"; 60-79% for "Provisional Validation"). Scrub reports for residual imagery contamination. Cross-reference with physiological data.
      3.  **Both:** Compare against calibration baseline stability. Flag deviations.

  **5. QUALITY CONTROL**
  *   **5.1 Dual-Protocol Compliance:** All TEs must undergo validation per *both* Protocol A (Argument Compliance) and Protocol B (Pure Intuition), documented separately. Results are recorded independently; reconciliation is not a QC function.
  *   **5.2 Reference TE Calibration:** Weekly runs (Section 4.2). Historical mean baselines stored in Ref Bank. Recalibrate ASM/ICSU if deviations exceed 5%.
  *   **5.3 Contamination Control:** Strict enforcement of LES protocols (Section 4.3). Subjects with unresolved Level 3+ exposure excluded from novel TE validation. Audit exposure logs quarterly.
  *   **5.4 Intuition Replication:** If novel TE fails intuitive replication (<60% consensus Protocol B) in a new subject cohort (n≥20), initiate Replication Failure Protocol (RFP-001): Re-check premise sterility, narrative neutrality, and cohort exposure logs. Escalate to Epistemology Review Board if unresolved.
  *   **5.5 Premise Traceability:** All premises must be traceable to source axioms or well-established physical principles (Logbook TPX-001-F1). Novel premises require ERB pre-approval.

  **6. TROUBLESHOOTING**

  | **Symptom**                     | **Possible Cause**                     | **Corrective Action**                               |
  | :------------------------------ | :------------------------------------- | :-------------------------------------------------- |
  | **Inconclusive Run (Protocol A)** | Premise ambiguity; Hidden assumptions | Isolate & clarify premise (PHS); Log auxiliary assumption (F3); Re-run. |
  | **Inconclusive Run (Protocol B)** | High subject variance; Contamination   | Verify LES compliance; Increase cohort size (n+10); Re-run. If persists, initiate RFP-001. |
  | **Argument Fails Stripping (ASM Error)** | Imagery logically necessary?           | Audit TE design per DS-TPX-001-Rev2. Redesign TE if imagery is essential. Log as "Protocol A Invalid". |
  | **Intuition Fails Calibration** | ICSU/ASM drift; Cohort bias            | Perform full recalibration (Section 4.2). Audit recruitment logs (SOP-005). |
  | **Result: Naked Intuition-Mongering** | No argument core; Purely affective response | TE rejected per QC 5.1. Premise Sterility Check (PSC) failure. Log as invalid construct. |
  | **Conclusion Valid (A) but Counter-Intuitive (B)** | Expected outcome per dual-protocol model | Log divergence. No corrective action required. Validity per protocol is recorded separately. |

  **7. LIMITATIONS**
  *   7.1 TE validity is contingent upon the acceptance of initial premises as given. APFF does not arbitrate premise truth value, only internal consistency and procedural compliance.
  *   7.2 Intuitive force (Protocol B) is population-dependent. Cross-cultural validity requires separate approval and cohort sourcing (see SOP-TPX-002).
  *   7.3 TEs cannot introduce novel empirical data. Outputs are strictly analytic or revelatory of implications within the premise set.
  *   7.4 Resolution of fundamental epistemological disagreements between Protocol A and Protocol B interpretations falls outside the scope of this SOP and APFF operational mandate.

  **8. SIGN-OFF**  
  **I certify that I have read, understood, and will adhere to this SOP:**  

  **Technician Signature:** _________________________ **Date:** ___________  
  **Protocol A Lead (Argument Compliance):** _________________________ **Date:** ___________  
  **Protocol B Lead (Pure Intuition):** _________________________ **Date:** ___________  
  **PI/Designee:** _________________________ **Date:** ___________  

  **This SOP supersedes all previous versions. Uncontrolled copy if printed.**
