  Alright, let's tackle this philosophy of language exam marking. The candidate's script is about norms of assertion—specifically, knowledge (K), truth (T), and justified belief (JB). The scenario involves a speaker who tells a colleague their flight landed safely based on a reliable app that, unbeknownst to her, was stalled but still showed the correct status by coincidence. 

  First, I need to check part (a): which norms does the speaker violate? The candidate says both K and T, but I think they're wrong about T. The truth norm only requires the assertion to be true, which it is. The app glitch doesn't affect the truth value. So violating T here is a mistake because T's condition is solely about truth, not about how the speaker arrived at it. The candidate confuses T with something like reliability or justification. 

  For K, the candidate is correct. The speaker doesn't know because her true belief is Gettiered—justified but lucky. JB is satisfied, as the candidate notes, because her belief was justified based on past reliability. The Gettier reference here is spot on. 

  Part (b) asks if she's criticizable. The candidate argues she isn't, which counts against K. This is solid. If K condemns blameless assertions, it might be too strict. The candidate connects this to practical followability of norms, which is good. 

  Now, the lottery case in (c). The candidate nails it: asserting a losing ticket pre-draw violates K (no knowledge) but satisfies T (true) and JB (justified by odds). The intuition that such assertions are improper supports K over T. The candidate correctly points out that T and K aren't tracking the same thing. 

  Errors: The big one is claiming T is violated in the flight case. That's a clear misunderstanding of T's requirement. Also, the candidate says T requires guaranteeing truth, which isn't right—T doesn't imply infallibility. 

  Strengths: Good grasp of K vs. JB via Gettier, solid lottery analysis, and thoughtful critique of K's blameworthiness implication. 

  The mark? Major error on T, but otherwise strong. High 70s seems fair—say 78/100. Deducted for the T confusion but rewarded elsewhere.
answer: |-
  **Mark:** 78 / 100  

  **Comments:**  

  The script demonstrates a strong grasp of core concepts (e.g., the structure of norms, Gettier cases, lottery intuitions) and advances coherent arguments. However, it contains one significant error and several underdeveloped points. Below is a breakdown:  

  ### **Part (a): Which norms are violated?**  
  **Right:**  
  - Correctly identifies **K is violated**: The speaker lacks knowledge (a Gettier case where justified true belief fails to be knowledge due to epistemic luck).  
  - Correctly identifies **JB is satisfied**: The speaker’s belief is justifiable based on reliable evidence (the app’s history).  
  - Appropriately references the **Gettier problem** to explain the K/JB divergence.  

  **Wrong:**  
  - **Claims T is violated**: The script states the speaker violates T because she "had no way of guaranteeing the truth." This is a *mistake*, not a defensible position.  
    - **Why it’s an error**: Norm T *only* requires that *p* is true ("one must assert that *p* only if *p* is true"). Here, *p* ("Your flight landed safely") *is* true. T says nothing about the speaker’s epistemic position, reliability, or "guaranteeing" truth. Violating T would require asserting a *falsehood*, which did not occur. The candidate conflates T with a stronger norm (e.g., K or a reliability norm).  

  ### **Part (b): Is the speaker subject to criticism?**  
  **Right:**  
  - Correctly argues the speaker is **not epistemically blameworthy**: Her evidence was sufficient for JB, and she acted conscientiously.  
  - Effectively uses this to **challenge norm K**: If K condemns assertions that are blameless and JB-compliant, K may be overly strict or impractical. This aligns with objections from philosophers like Jennifer Lackey.  

  **Underdeveloped:**  
  - The script asserts that the lack of criticism "counts against K" but does not address *why* K might still be defensible (e.g., K might be a *constitutive* norm, like a chess rule, where violation need not imply blame). This is a missed opportunity for depth but not an error.  

  ### **Part (c): Do lottery assertions help decide between K and T?**  
  **Right:**  
  - **Accurate lottery case analysis**: Correctly notes that lottery assertions satisfy T (the ticket lost) and JB (high statistical justification) but violate K (no knowledge pre-draw).  
  - **Strong argument for K**: Properly leverages the intuition that lottery assertions *feel improper* to support K over T. Highlights that T and K "are not tracking the same feature."  
  - **Key insight**: Correctly states that the lottery shows T is not "merely a weaker version" of K.  

  **Inconsistency:**  
  - The script claims lottery assertions "arguably satisfy JB" but does not note that *some* JB advocates (e.g., internalists) might reject this if justification requires more than statistical odds. However, this is a minor omission, not an inconsistency.  

  ### **Overall Strengths:**  
  1. Clear structure and logical flow.  
  2. Excellent understanding of Gettier cases and their relevance to K vs. JB.  
  3. Persuasive critique of K based on blamelessness (part b).  
  4. Effective use of the lottery case to distinguish K and T (part c).  

  ### **Overall Weaknesses:**  
  1. **Major error**: Misunderstanding norm T (claiming it is violated in the flight case). This is a factual inaccuracy about T’s minimal truth condition.  
  2. **Underdeveloped defense**: Part (b) could acknowledge potential rebuttals (e.g., K as a non-blameworthy norm).  
  3. **Ambiguous phrasing**: Saying T "can be satisfied by accident is not being satisfied at all" conflates *satisfaction* of T (which only requires truth) with *epistemic responsibility* (which T ignores).  

  ### **Why 78/100?**  
  - **−12** for the significant error on T (part a), which undermines a core component of the question.  
  - **−10** for underdeveloped points (e.g., not engaging with K’s non-blameworthiness defense; not problematizing JB in the lottery).  
  - **+78** reflects strong performance elsewhere: accurate K/JB analysis, insightful critique of K, and excellent lottery comparison. The script exceeds baseline competence but falls short of top marks due to the T error.  

  **Recommendation:** The candidate should review truth-based norms (T does not require "guarantees") and consider objections to their own arguments for greater depth.
