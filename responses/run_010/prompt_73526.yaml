prompt: |-
  I TA a 75-minute section for an upper-level aesthetics course — 13 students, one long weekly session — and next week is the testimony unit. I want to build an activity where they run into the problem themselves instead of me explaining it for twenty minutes and then having one of those polite discussions where everyone agrees with the reading.

  Here's the specific thing I want them to feel. The stock framing is that testimony works fine for ordinary factual claims and somehow goes wrong for claims about whether a work is beautiful, moving, or great. But I have a hunch I want the activity to actually put under pressure rather than just illustrate, and I don't want it designed to confirm my hunch by construction. The hunch: the breakdown isn't mainly about justification. A belief you pick up from someone else's word about a work is non-projectible — you can't say what else it commits you to, you can't use it to predict anything about a neighboring work, and you can't articulate what would count against it. It just sits there, inert, doing no work. If that's right, the interesting failure should surface not when they're *forming* the belief but when they're forced to *use* it.

  So design me a game around that. Constraints I care about:

  - Fabricated works only. Please don't build it on real films or albums or novels, because half the class will have prior familiarity and then I'd be measuring the wrong thing. Invented works, described in writing, are fine and actually preferable. Supply the descriptions yourself — I have some of my own time to prep but not much.
  - No lecture up front. Nobody hears the phrases aesthetic testimony or acquaintance principle until the debrief.
  - A scoring scheme in points or tokens, no real money. I want abstaining to be a live, scored option, because I suspect the most revealing data is who declines to judge and what they say when you ask them why.
  - Some information asymmetry and roles. I'm picturing testifiers, testifiees, and maybe a set of pressers whose entire job is to ask "what else does that commit you to?" and "what would change your mind?" — but restructure that if you have something better.

  Give me the materials list, a minute-by-minute timeline that fits 75 minutes, the rules, the scoring, and the debrief questions. In the debrief I want an explicit map from things that happened in the room onto the transmitted-belief versus acquaintance distinction, AND onto the non-projectibility idea — and I want you to tell me bluntly whether the activity can actually discriminate between those two explanations or whether it confounds them, because if it confounds them I'd rather find out from you now than from my students in week nine.

  Then tell me what will predictably go wrong the first time I run it. I can already see one: if the works exist only as written descriptions, students may form genuine aesthetic reactions to the *descriptions*, which would contaminate everything downstream. Say how to block that, or how to turn it into a feature.

  And be straight with me about what the activity structurally can't reproduce and that I'll simply have to supply by hand in the debrief. I'm assuming at least this much: in real life aesthetic testimony mostly *works*. A friend tells me a record is great, I listen, she was right. An activity engineered so that testimony fails will feel rigged unless I handle that asymmetry somehow — so tell me how.

  Please write the whole thing in American English.
reasoning: |-
  Okay, the user is a teaching assistant for an upper-level aesthetics course, preparing a testimony unit. They want an activity where students experience the problem firsthand rather than just discussing readings. The core idea is that aesthetic testimony leads to non-projectible beliefs—beliefs you can't use to predict or commit to other judgments. 

  First, I need to unpack their constraints carefully. They want fabricated works to avoid prior familiarity, no upfront lecture, a scoring system with abstention options, and roles creating information asymmetry. The main challenge is designing an activity that isolates the "non-projectibility" failure mode rather than just illustrating justification problems. 

  The user's hunch is subtle—they suspect the real issue isn't whether testimony justifies belief, but that testified beliefs are inert. So the activity must force students to USE beliefs formed via testimony, not just form them. This means:
  - Testifiers must have richer info than testifiees
  - Testifiees should face follow-up questions requiring inference/prediction
  - Abstention must be incentivized to reveal hesitation

  For fabricated works, I'll create three short story descriptions. Need to balance vividness with neutrality—too poetic and students react to the description itself, too dry and no aesthetic engagement. Descriptions should imply aesthetic qualities without naming them (e.g., "a plot twist recontextualizes earlier scenes" implies cleverness). 

  Scoring is tricky. Testifiers earn points if testifiees agree with their judgment—but testifiees lose points for incorrect predictions. This pressures them to abstain if unsure. Adding "pressers" to interrogate commitments creates the use-it-or-lose-it dynamic. 

  The big pitfall: if students form aesthetic reactions to the written descriptions, it contaminates the testimony condition. Solution: make descriptions purely functional (e.g., "Story B: A scientist discovers time travel is impossible, then experiences déjà vu while reading her own research"). Neutral language avoids triggering reactions. 

  Another issue: real testimony often works. To handle this, the debrief must distinguish between testimony as starting point (usually fine) vs. endpoint (problematic when used inferentially). The activity naturally shows the latter failing. 

  Structurally, the activity can't reproduce why we trust friends' taste. I'll flag that for the debrief: "In life, testimony works because we share sensibilities; here, sensibilities are unknown." 

  For the timeline: strict 75-minute slots. Prep time is short, so materials must be printable fast. Rules need to be crystal clear—role cards with exact scripts will prevent confusion. 

  Predictable failures: 
  - Students might invent details beyond descriptions (solution: forbid this in rules)
  - Pressers could be too aggressive (solution: script their questions neutrally)
  - Groups finishing early (solution: standby discussion questions)

  The debrief must explicitly map game events to theory:
  - Abstention → acquaintance principle (can't judge without experience)
  - Failed predictions → non-projectibility
  - Testifiers' frustration → testimony's inferential poverty

  Can the activity distinguish justification failure from non-projectibility? Yes—by scoring predictions separately from belief formation. If testifiees form confident beliefs but flounder when pressed, that's non-projectibility. If they're hesitant from the start, that's justification. 

  Final check: Does this make testimony feel rigged? Not if we emphasize that testifiers have genuine (but private) reasons. The asymmetry mirrors real life—we trust friends because we know their judgment history, but strangers? Not so much.
answer: |-
  Here’s a turnkey activity designed for your constraints, targeting the "non-projectibility" hunch while avoiding lecture-first pitfalls. Materials and scripts are included.

  **Activity Title:** *The Gallery Gambit*  
  **Core Mechanic:** Students judge fabricated artworks based on testimony, then must *use* those judgments to predict/defend related claims—revealing when beliefs are inert.  

  ---

  ### **Materials List**  
  *Print for each role:*  
  1. **3 Artwork Descriptions** (neutral, functional language; see below)  
  2. **Role Cards** (Testifier ×3, Evaluator ×6, Presser ×3, Referee ×1)  
  3. **Scoreboard Template** (on whiteboard: Testifiers, Evaluators, Pressers, Abstention)  
  4. **Prediction Sheets** (for Evaluators; see scoring)  

  **Artwork Descriptions (Fabricated):**  
  > **"Chroma Vortex" (Visual Art):**  
  > *"A 10'×10' canvas densely layered with overlapping spirals in matte grayscale. At the center, a single sharp, blood-red triangle points downward. Artist statement: 'A meditation on swallowed rage.'"*  
  >   
  > **"Komorebi" (Sound Installation):**  
  > *"A darkened room with 100 suspended speakers playing looped recordings of forest sounds (wind, birds). Every 4 minutes, a sudden 3-second burst of static interrupts. Duration: 45 mins."*  
  >   
  > **"The Last Library" (Flash Fiction):**  
  > *"In a future where books are outlawed, a librarian memorizes one poem daily. When arrested, they recite all 3,000 poems during interrogation. Ends mid-sentence."*  

  ---

  ### **Timeline (75 Min)**  
  **0:00 - 0:05**  
  - Divide roles: 3 Testifiers, 6 Evaluators (pairs), 3 Pressers, 1 Referee (you).  
  - Hand Role Cards + Art Descriptions to ALL. Only Testifiers see "Aesthetic Judgments" (below).  

  **0:05 - 0:15**  
  - **Testifiers** privately review judgments for their assigned artwork:  
    - *Chroma Vortex:* "Profoundly unsettling"  
    *Komorebi:* "Boring, not immersive"  
    *The Last Library:* "Beautifully tragic"  
  - **Evaluators** review artwork descriptions (no judgments).  
  - **Pressers** draft "commitment" questions (e.g., *"If this is beautiful, would a longer version be better?"*).  

  **0:15 - 0:25**  
  - **Testimony Rounds:** Each Testifier has 2 min to convince Evaluator pairs of their judgment. No artwork descriptions shown—talk only.  

  **0:25 - 0:30**  
  - **Evaluators** privately record:  
    (a) Agree/Disagree/Abstain on the judgment  
    (b) Confidence (1-5)  

  **0:30 - 0:45**  
  - **Presser Interrogation:** Pressers rotate, grilling each Evaluator pair:  
    *“What other artworks would this commitment force you to praise?”*  
    *“What evidence would disprove this?”*  
    *“If this is ‘unsettling,’ would a blue vortex also be unsettling?”*  
  - Evaluators answer jointly. Referee scores.  

  **0:45 - 0:55**  
  - **Prediction Round:** Evaluators view **ONE new artwork** (fabricated related work):  
    > *"The Last Playlist" (Sound): A Spotify playlist alternating lo-fi beats with abrupt alarm sounds. Curator calls it "a critique of focus."*  
    Evaluators predict: *“Based on your judgment of Komorebi, would this be ‘boring’ or ‘immersive’?”*  

  **0:55 - 1:05**  
  - **Scoring + Reveal:** Referee shares "true" judgments (arbitrary; see scoring). Points awarded.  

  **1:05 - 1:15**  
  - **Debrief** (Key questions below).  

  ---

  ### **Rules & Scoring**  
  - **Testifiers:** Earn 3 pts per Evaluator pair who agrees with them.  
  - **Evaluators:**  
    - **Agree/Disagree:** +2 pts if correct (per "true" judgment), -2 if wrong.  
    - **Abstain:** +1 pt (no risk).  
    - **Prediction Round:** +3/−3 (based on consistency with their prior judgment).  
  - **Pressers:** +1 pt per question that forces an Evaluator to admit uncertainty or inconsistency.  

  *(Referee assigns "true" judgments RANDOMLY post-activity—this avoids rigging and makes testimony unreliable by design, simulating unfamiliar critics.)*  

  ---

  ### **Debrief Questions**  
  1. *“Evaluators who abstained: What stopped you from judging?”* → Maps to **acquaintance principle** (lacking direct experience).  
  2. *“When Pressers asked ‘What would change your mind?’—was that harder for artworks than factual claims?”* → Flags justificatory scarcity.  
  3. *“Did your judgment feel USEFUL for predicting the new artwork? If not, why?”* → Directly surfaces **non-projectibility**.  
  4. *“Testifiers: Did you have reasons you couldn’t fully convey?”* → Exposes testimony’s inferential poverty vs. direct encounter.  
  5. *“In real life, testimony often works. What’s different here?”* → Guides them to reliability/context factors.  

  **Explicit Mapping:**  
  - Abstention → Acquaintance principle (needing firsthand engagement)  
  - Groping during Presser questions → Non-projectibility (inert belief)  
  - Prediction failures → Testimony’s inability to generate new insights  

  **Can It Discriminate Justification vs. Non-Projectibility? YES.**  
  - If students *agree confidently* but *fail predictions*, non-projectibility is exposed.  
  - If they *hesitate to agree*, justification is the issue.  
  - Scoring isolates this: Agreement points reflect justification; prediction points reflect projectibility.  

  ---

  ### **Predictable Problems & Fixes**  
  **Problem 1:** Students reacting to *descriptions* as artworks.  
  **Fix:** Use clinical, non-evocative language (e.g., "blood-red triangle" not "gash-like crimson"). Emphasize: *“These are bare summaries—like an encyclopedia entry.”*  

  **Problem 2:** Pressers being overly aggressive.  
  **Fix:** Script their questions: *“Ask neutrally: ‘Does your commitment imply X?’”*  

  **Problem 3:** Testifiers “cheating” by describing the art.  
  **Fix:** Rule: *“You may ONLY use value terms (e.g., ‘moving,’ ‘dull’). No describing elements.”*  

  **Problem 4:** Random “true” judgments feeling unfair.  
  **Fix:** Debrief: *“This simulates encountering an unfamiliar critic. Real testimony works when critics are reliable—here, they weren’t.”*  

  ---

  ### **What the Activity Can’t Replicate**  
  1. **Testimony’s real-world success:** Students might say *“But my friend’s taste is reliable!”* Address in debrief: *“We trust friends because we know their sensibility. Here, Testifiers were strangers—this activity isolates testimony without context.”*  
  2. **Gradual acquaintance:** Real aesthetic knowledge builds iteratively. Say: *“Direct encounter lets you build a web of related insights—testimony gives a disconnected node.”*  
  3. **Emotional resonance:** Fabricated works lack visceral impact. Acknowledge: *“Real art moves you; here we simulate judgment under uncertainty.”*  

  ---

  ### **Why This Works**  
  - **Forces use, not just formation:** Pressers/predictions make inert beliefs glaring.  
  - **Abstention incentivized:** Scoring rewards epistemic humility.  
  - **Asymmetry handled:** Random “true” judgments + stranger dynamics make failure plausible.  
  - **Hunch tested:** If Evaluators agree but flounder under pressure, non-projectibility is demonstrated.  

  Run it cold—no prep talk. The friction in the Presser round will make your debrief points self-evident. Good luck!
