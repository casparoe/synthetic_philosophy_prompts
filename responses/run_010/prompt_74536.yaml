  Okay, the user is describing a pattern of deception they've observed at work and with a friend. They've noticed someone builds up a reputation for honesty or transparency over time, then uses technically true statements that rely on that reputation to mislead others. The user is frustrated because existing concepts like "lying vs. misleading" don't fully capture this setup where the misleading comes from the established context, not individual statements.

  First, I need to recall relevant philosophical concepts. The lying vs. misleading distinction is key. Lying involves saying something false, while misleading uses true statements to create false beliefs. But here, the user is pointing out that the misleading isn't just from a single statement but from a cultivated reputation. So the existing terms might not cover the premeditated setup.

  Next, terms like "paltering" or "contextual deception" come to mind. Paltering is using truthful statements to mislead, but it's often immediate. The user's case involves a long-term setup. "Contextual deception" might be closer, emphasizing the environment created beforehand. But I should check if there's a more precise term.

  The user mentioned that the setup isn't a factual claim but a promise or self-description. This is crucial because promises aren't true/false but create expectations. So deception via broken implicit promises or exploiting trust. Terms like "breach of implied promise" or "exploitation of contextual trust" might fit. Also, considering "institutional betrayal" if it's within an organization, but that's more about systemic issues.

  The user cares about edge cases. For example, if the person didn't initially plan to misuse the reputation, or if they believe their own lies. This touches on intent and self-deception. If they genuinely believe their setup, it might not be intentional deception but still harmful due to negligence. Self-deception blurs intent, making it harder to classify.

  Another angle: Gricean maxims in pragmatics. Communication relies on cooperative principles. Violating maxims like quality (truthfulness) or quantity (giving enough info) without technically lying. The manager's omission of crucial info breaches the maxim of quantity. The cultivated reputation sets up an expectation that they will be forthcoming, which they then violate.

  Also, consider "gaslighting," but that's more about making someone doubt their reality, not exactly this. The user's examples are more about omission and exploiting trust. "Bad faith" from existentialism might apply, where someone acts inauthentically, not upholding the spirit of their promises.

  Need to differentiate from similar concepts. For instance, a one-off truthful misleading statement is paltering. Here, it's the long-term cultivation plus exploitation. The setup phase isn't deceptive by itself; it's the later reliance on it that is. So terms should combine both elements.

  Possible terms: "Pretextual truthfulness," "contextual manipulation," "trust infrastructure exploitation." Define as creating a reputation for honesty to later make omissions or truthful statements misleading. Edge cases: if no initial intent, it might be negligence in maintaining the reputation. If they believe their own story, it's self-deception but still culpable if they avoid disconfirming evidence.

  The user's deeper need is likely to understand and label this behavior to address it ethically, possibly to validate their experience or communicate the issue to others. They might want tools to identify and counter such tactics in professional or personal settings.
answer: |-
  This is a brilliantly observed pattern, and you're right that it often slips through the cracks of traditional "lying vs. misleading" debates. It's a sophisticated form of **contextual manipulation** or **reputation-based deception**. While no single term is universally accepted, several concepts converge to describe it, and its edges are crucial:

  1.  **Exploitation of Conversational Presupposition & Implicature (Gricean Maxims):**
      *   **Core Idea:** Philosopher H.P. Grice argued communication relies on cooperative principles (maxims): Quality (truth), Quantity (sufficient info), Relation (relevance), Manner (clarity). Your manager meticulously built up a reputation (Quality & Manner: "I'm direct and honest") and a specific promise (Relation: "You'll hear bad news from me first"). This created a powerful **presupposition** (background assumption) that she would volunteer crucial negative information. Her later technically true statement ("nothing's been decided") relied on this presupposition to imply safety. She violated the maxim of Quantity (withholding vital info) and potentially Relation (by letting the presupposition do the misleading work), while technically adhering to Quality (truthfulness).
      *   **How it fits:** This perfectly captures the "standing setup" (the cultivated presuppositions/conventions) enabling the misleading effect of the later true statements.
      *   **Edge:** If she *genuinely believed* "nothing's been decided" when she said it, even if she knew decisions were imminent, she might technically avoid violating the Quality maxim *in that moment*, but her failure to update you later (violating Quantity) and her established promise make it still deeply deceptive. Intent matters less than the reasonable expectation she created.

  2.  **Paltering (with Long-Term Strategic Context):**
      *   **Core Idea:** Paltering is using truthful statements to create a false impression. Usually, it's examined in single interactions. Your cases show **strategic paltering**: the deceptive actor first carefully constructs a context (reputation, promise) over time that *primes* others to interpret their later truthful statements in a specific, misleading way. The paltering relies entirely on the pre-installed "rails."
      *   **How it fits:** The core mechanism of using truth to mislead is paltering. The innovation is the long-term, deliberate setup of the misleading context.
      *   **Edge:** If the person installed the reputation genuinely (no initial plan to deceive) but *later* exploits it knowingly through omission or selective truth, it becomes paltering. If they installed it cynically, it's deeply manipulative.

  3.  **Breach of Implied Promise / Violation of Fiduciary Duty (Ethics):**
      *   **Core Idea:** By repeatedly declaring "I'll tell you bad news first," your manager made an explicit promise, creating a reasonable expectation and arguably a **fiduciary duty** (duty of loyalty/care) towards her team regarding job security. Her technically true statement, combined with her silence later, was a **breach of that implied promise**. It wasn't just *what* she said, but *what she failed to say* given the context she created. Your friend's brother cultivated an expectation of voluntary disclosure, creating a similar implied social contract/promise.
      *   **How it fits:** This frames the deception as a broken commitment, an ethical violation rooted in the established relationship context, rather than solely a linguistic trick.
      *   **Edge:** If the promise was vague or not genuinely relied upon, the breach is weaker. Genuine belief ("I thought I *would* tell them!") might mitigate *intent* but doesn't absolve the *harm* caused by the broken expectation. In a managerial context, the duty is stronger.

  4.  **Constructive Fraud / Equitable Fraud (Legal/Equity Concepts):**
      *   **Core Idea:** While not always meeting the strict legal definition, this pattern shares DNA with constructive fraud – a deception achieved *without* an outright lie, often through omission, half-truths, or creating a false impression while technically telling the truth. The key is the creation of a misleading *overall picture* that induces reliance.
      *   **How it fits:** The "standing setup" (reputation/promise) is the foundation for creating the misleading overall picture. Her relief at "not lying" highlights the technicality she hid behind.
      *   **Edge:** Legal fraud requires specific elements like damages and reliance, but ethically, the *pattern* of behavior fits the spirit. Genuine self-belief makes it harder to prove "fraudulent intent" legally/ethically, but the *effect* remains manipulative.

  5.  **Cultivation of Epistemic Dependence (Epistemology/Trust):**
      *   **Core Idea:** The actor deliberately cultivates others' **epistemic dependence** on them – making others rely on *them* as a source of accurate, timely, and complete information on specific topics (like job security or family bad news). They then *betray* that dependence by providing technically true but incomplete or strategically timed information, knowing the dependent party will fill the gaps based on the cultivated trust.
      *   **How it fits:** This nails the "standing setup" (creating the dependence) and the mechanism (betraying it via selective truth/omission).
      *   **Edge:** If the dependence arose naturally without cultivation, or if the actor genuinely believes they *are* fulfilling the dependence (self-deception), it changes the culpability. But the *harm* of the misleading belief remains.

  **What to Call It? Synthesizing the Concept:**

  *   **Best Descriptive Phrases:** **Strategic Contextual Deception**, **Reputation-Exploitive Misleading**, **Cultivated Epistemic Betrayal**, **Pretextual Truthfulness**.
  *   **Defining It:** "The deliberate cultivation of a reputation, expectation, or promise (often concerning honesty, transparency, or specific disclosure) over time, which is then exploited through technically true statements, omissions, or selective disclosures, with the intent or foresight that others will rely on the cultivated context to form a specific false belief that benefits the deceiver."

  **Crucial Edges & Distinctions:**

  1.  **Intent vs. Effect:** The *most critical* edge.
      *   **Deceptive:** If the person cultivates the reputation *with the intent* to later exploit it for misleading purposes, it's highly culpable deception.
      *   **Negligent/Culpably Blind:** If they cultivate the reputation genuinely but later *knowingly* exploit it (like your manager realizing she could use the ambiguity), it's still deeply unethical.
      *   **Self-Deceptive:** If they cultivate it genuinely and *genuinely believe* they are living up to it even when their actions contradict it (e.g., "I *would* have told them if it was final... it wasn't final *when I spoke*"), it's less *intentionally* deceptive but still profoundly harmful and often involves bad faith or willful ignorance. They benefit from the misleading effect while shielding themselves from the "liar" label.
      *   **Not This:** If someone cultivates an honest reputation genuinely and *consistently lives up to it*, including volunteering bad news as promised. Or, if they make a vague promise once and fail, it's just broken promise/omission, not the *strategic cultivation and exploitation* pattern.

  2.  **The Setup Itself:**
      *   **Is the setup deceptive?** Often, initially, no. The problem arises when the actor *fails to live up to it* in a way they know (or should know) will mislead, leveraging the trust it created. The setup becomes a *tool* for later deception. If the setup promises more than they ever intend to deliver, the initial statements *are* deceptive.

  3.  **What Makes it Distinct from Simple Misleading/Paltering?**
      *   **The Long-Term, Deliberate Cultivation:** It's not a one-off misleading true statement. It requires building the misleading *context* over time. The misleading power comes *primarily* from the cultivated expectation, not just the phrasing of the individual utterance.
      *   **Exploitation of Trust:** It deliberately leverages trust earned through the setup to make the misleading more effective and the deceiver less suspect.
      *   **Plausible Deniability Shield:** The "technically didn't lie" defense is *integral* to the strategy, made possible by the separation between the setup (non-factual promises/reputation) and the individual true statements.

  4.  **A Case That Looks Like This But Isn't:**
      *   **The Inadvertent Context:** Imagine a manager known for *general* honesty but who never specifically promised to warn about layoffs. During a reorg, they truthfully say "nothing's been decided about your team" at a point where discussions are very preliminary. Later, things change and the team is cut. The manager is genuinely surprised and upset. This is **unfortunate omission/miscommunication**, not the pattern you describe. Missing are: 1) The *specific, repeated* promise/assurance about bad news, 2) Any indication the manager *leveraged* a cultivated expectation to mislead or felt relieved about avoiding a "lie," 3) The sense of a long-term setup being *exploited*.

  **In essence, you've identified a pernicious form of deception that weaponizes earned trust and exploits the gap between literal truth and communicated meaning, shielded by the non-factual nature of promises and self-descriptions.** It's ethically corrosive because it damages trust while allowing the deceiver to maintain a veneer of technical integrity. The key to recognizing it is focusing on the *pattern*: cultivation of reliance + exploitation via technical truth/omission + benefit from the resulting false belief + evasion of the "lie" label.
