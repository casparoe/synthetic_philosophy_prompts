prompt: |-
  I sit on the board of a forty-unit housing co-operative, and next month we vote on a proposal that has split us in a way I did not expect. Twelve years ago our bylaws let any member buy vacant units at a fixed formula price; a retired neighbour bought five, taking on debt at a moment when the co-op was close to insolvency and no one else would. Two of those units she now lets to young families well below market rent. Then the city rezoned our block for a transit stop and ground-floor shops — a change our board, myself included, spent three years lobbying for — and the value of every unit roughly tripled. Under the proposal, members would be capped at two units, and half the appreciation on any unit sold would go into a common fund. She says she acquired her units honestly under rules we all voted for, with money she borrowed and risk she alone took, and that stripping them now is simply taking what is hers; several board members say her windfall is really ours, produced by our campaign, and that letting one member hold an eighth of the co-op is unfair however it came about. I find both claims compelling and cannot see how to weigh them against each other. Which of these arguments survives scrutiny, what is the proposal getting right and wrong, and how should I vote — including whether some intermediate arrangement would be better than either position? Please write in British English. After your reasoning, give a JSON object with these fields: "the_stronger_claim" (one sentence); "what_the_proposal_gets_right"; "what_it_gets_wrong"; "options" (an array of objects, each with "option", "justification" and "main_objection"); "my_vote"; and "what_would_change_it".
reasoning: |-
  Hmm, the user is on the board of a housing co-operative facing a difficult vote. Twelve years ago, when the co-op was nearly insolvent, a retired neighbour bought five units under the existing rules, taking on significant personal debt. Now, after rezoning increased property values threefold, a proposal aims to cap ownership at two units and take half the appreciation for a common fund. The neighbour argues this unfairly takes what she legitimately acquired at personal risk, while others claim the windfall resulted from collective efforts and that concentrated ownership is inherently unfair.

  This presents a classic tension between individual rights and collective benefit. Legally, the neighbour acquired the units properly under rules everyone agreed to. Ethically, she took real financial risk when no one else would, effectively saving the co-op. However, the rezoning windfall was indeed generated by collective lobbying, not her individual effort. The 50% appreciation capture seems arbitrary and punitive, while the ownership cap fails to address how she helped the co-op in its time of need.

  I need to consider intermediate solutions that acknowledge both contributions. Perhaps exempting existing holdings from the cap but limiting future transfers, or a smaller appreciation share (15-20%) directed specifically to affordability funds. A financial settlement recognizing her past service could balance the scales more fairly than confiscation.

  The stronger claim appears to be the neighbour's, as changing rules retroactively undermines trust, though the collective benefit argument has merit too. The proposal correctly identifies problems with concentrated ownership and aims to share rezoning gains, but implements this poorly through retroactive application and disproportionate confiscation.

  For alternatives, I'll suggest: 1) Grandfathering existing holdings with transfer restrictions; 2) Reduced appreciation share (15-20%); 3) Phased buyback; 4) Financial settlement for past service. Each option balances the concerns differently but avoids outright confiscation.

  The user should vote against this specific proposal due to its retroactive unfairness, while supporting alternative solutions that achieve community goals without violating trust. What might change this vote would be amendments that properly compensate the neighbour for her risk and contribution.
answer: |-
  This presents a profound ethical and practical dilemma, pitting legitimate individual claims against collective interests and fairness within a community. Here's a breakdown:

  1.  **Scrutinising the Claims:**
      *   **The Neighbour's Claim:** Her position is fundamentally strong on **legitimacy and reliance**. She acquired the units openly under the co-op's *then-existing* rules, which everyone consented to through the bylaws. She took significant personal financial risk (debt) when the co-op was in dire straits and no one else stepped forward. Her current actions (renting below market) demonstrate community-mindedness. Retroactively changing rules to confiscate a substantial portion of her legitimately acquired assets, especially the *unrealised* appreciation largely driven by external factors (rezoning), feels like expropriation and a breach of trust. It punishes her for the co-op's past rules and her past risk-taking that ultimately benefited the community by stabilising it.
      *   **The Board Members' Claim:** Their position has merit regarding **future fairness and collective benefit**. Concentrated ownership (12.5% by one member) *can* create power imbalances and is unusual in a co-op model designed for resident-ownership and shared equity. Crucially, the *primary driver* of the massive appreciation was the rezoning, achieved through **collective effort** (years of lobbying by the board and members). While the neighbour owns the bricks and mortar, the land value surge is largely attributable to this communal action and public investment (transit). Claiming some of this windfall for the collective good (e.g., affordability funds, repairs) isn't inherently unreasonable. The "unfairness" argument focuses on the *outcome* (one member holding disproportionate value/units) rather than the original acquisition.

      **The Stronger Claim:** **The neighbour's claim that stripping value now constitutes an unfair expropriation of legitimately acquired assets under rules everyone agreed to is stronger, particularly given the personal risk she undertook to benefit the co-op during its crisis.** While the collective benefit argument has weight, applying it retroactively to punish her for acting within the rules is problematic.

  2.  **The Proposal:**
      *   **What it Gets Right:**
          *   Addresses legitimate concerns about excessive concentration of ownership within a co-operative model.
          *   Recognises that the rezoning windfall was largely generated by collective action and aims to capture some of that communal value for the benefit of all members (e.g., via the common fund).
          *   Seeks to promote future equity and affordability within the co-op.
      *   **What it Gets Wrong:**
          *   **Retroactive Application:** Applying new ownership caps and financial penalties to assets acquired legitimately under previous rules is fundamentally unfair and undermines trust in the co-op's governance. It invalidates the conditions under which she took her risk.
          *   **Disproportionate Impact:** Confiscating 50% of the appreciation on forced sale (which the cap effectively necessitates for 3 of her units) is punitive, especially considering her past contribution to saving the co-op. It ignores her initial investment and risk.
          *   **Ignores Past Service:** It fails to acknowledge her role in stabilising the co-op during insolvency.
          *   **Mechanism:** The 50% figure is arbitrary. The forced sale mechanism is blunt and likely to cause significant financial and personal distress.
          *   **Potential Legality:** Such a significant retroactive change might face legal challenges regarding property rights, depending on jurisdiction and specific bylaws.

  3.  **Intermediate Arrangements (Options):**
      Here are several alternatives, balancing the competing principles:

      ```json
      {
        "the_stronger_claim": "The neighbour's claim that stripping value retroactively constitutes unfair expropriation of legitimately acquired assets under agreed-upon rules is stronger, particularly given her personal risk taken to benefit the co-op.",
        "what_the_proposal_gets_right": "Addresses concerns about ownership concentration, recognises the collective source of rezoning gains, and aims to promote future equity and affordability via a common fund.",
        "what_it_gets_wrong": "Retroactive application is unfair and undermines trust, the 50% confiscation is punitive and ignores past risk/service, the forced sale mechanism is blunt, and the approach may face legal challenges.",
        "options": [
          {
            "option": "Grandfather existing holdings (no forced sale), apply cap only to future acquisitions. Implement a smaller, targeted 'windfall contribution' (e.g., 15-20% of appreciation) on future sale of *any* unit to fund affordability.",
            "justification": "Honours existing ownership rights while preventing future concentration. Captures *some* collective gain from rezoning for the common good without punishing her retroactively. Applies equally to all.",
            "main_objection": "Does nothing to reduce her current 5-unit holding; the concentration issue remains. Smaller contribution may not satisfy members seeking significant redistribution."
          },
          {
            "option": "Offer voluntary buyback of 1-3 units by the co-op at fair market value (minus a modest, agreed 'community benefit discount' e.g., 10-15%), funded by a special levy or loan. Proceeds fund affordability.",
            "justification": "Reduces concentration through negotiation, not compulsion. Compensates her fairly while acknowledging some community claim to the rezoning gain. Avoids retroactive rule change. Her units become affordable stock.",
            "main_objection": "Requires significant co-op capital. Neighbour may refuse. Defining 'fair market value' and 'discount' is contentious."
          },
          {
            "option": "Phase the cap: Allow her to retain all units until sale/transfer, but then units 3-5 must be sold to qualifying members (potentially below formula price) or to co-op for affordability fund. Apply cap strictly to new purchases.",
            "justification": "Avoids immediate forced sale, respecting her current ownership. Ensures future reduction in concentration and increases affordability stock over time. Less disruptive.",
            "main_objection": "Concentration remains for potentially long time. Selling below formula price later still reduces her potential gain. Complex to administer transfers."
          },
          {
            "option": "Establish a financial settlement: Recognise her past service/risk via a one-off honorarium or reduced fees for X years. Implement the ownership cap and common fund *only for future acquisitions and appreciation occurring after the rule change*.",
            "justification": "Formally acknowledges her contribution without confiscating assets. Moves the co-op towards desired future rules prospectively. Fairer and more legally robust.",
            "main_objection": "Does not address current concentration of units or captured rezoning value. Cost of settlement to co-op. May feel like 'buying off' her claim without structural change."
          }
        ],
        "my_vote": "Against the current proposal.",
        "what_would_change_it": "I would vote for a modified proposal incorporating elements like grandfathering existing holdings, a lower and universally applied windfall contribution on future sales (e.g., 15-20%), and/or a negotiated voluntary buyback scheme with fair compensation and a modest community discount. Explicit recognition of her past contribution within the resolution would also make it more acceptable."
      }
      ```

  **Reasoning for Vote & Conclusion:**

  The current proposal, while motivated by understandable concerns about fairness and the co-op's future, commits a fundamental error by applying punitive changes retroactively. It fails to account adequately for the legitimacy of the acquisition under the rules *at the time*, the significant personal risk the neighbour undertook when the co-op needed it most, and the potential breach of trust and legal jeopardy involved. Confiscating 50% of appreciation on forced sale is disproportionate.

  Your duty is to uphold fairness and the long-term health of the co-op. Voting for this proposal risks alienating a member who acted in good faith and saved the co-op, sets a dangerous precedent for retroactive rule changes undermining property rights within the community, and may lead to costly conflict.

  The better path lies in solutions that:
  1.  **Respect Legitimate Past Acquisitions:** Grandfather existing holdings or offer fair, *voluntary* pathways to reduce concentration.
  2.  **Capture Future/Collective Gains Fairly:** Implement prospective rules (caps on new buys) and a reasonable, universally applied mechanism (e.g., smaller % on future sales) to share gains from *future* value increases or specifically the rezoning windfall as it's realised.
  3.  **Acknowledge Past Contribution:** Find a way to formally recognise the risk and service provided during the insolvency crisis.
  4.  **Focus on Future Affordability:** Ensure any funds captured are transparently used to enhance affordability for *future* members, strengthening the co-op's core purpose.

  Vote against this specific proposal, but actively advocate for and support a compromise solution from the options above that balances these complex principles more justly and sustainably. The co-op's long-term unity and trust depend on finding a resolution that acknowledges both its collective achievements *and* the legitimate claims of individual members who supported it in the past.
