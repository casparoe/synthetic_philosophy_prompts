  But we want to show that the prior can dominate and cause a misperception. In this case, even with two pieces of evidence for black, they still have a low belief in black. That is the point: the prior is pulling hard.

  Debrief:

  We will map the game to the FEP:

  - Phase 1: The students learn that when the expected prediction error (here, the expected penalty) is too high, the rational strategy is to avoid engaging (abstain). This is analogous to the dark-room objection: the brain minimizes prediction error by avoiding sensory input.

  - Phase 2: We introduced a cost for abstaining (which models the fact that in the real world, an organism cannot simply abstain from acting forever; there are opportunity costs or intrinsic costs to inaction). Also, the cost for additional sampling models the idea that gathering more sensory information has a cost (energy, time, risk). This forces a trade-off between exploration (gathering more information) and exploitation (making a guess). The prior (the biased deck) represents the brain's prior beliefs, and we see that when the prior is strong, it can override conflicting evidence.

  Concepts:

  - Precision weighting: In the FEP, the brain weights sensory evidence by its precision (reliability). In the game, the reliability of the observation is 60%, which is low, so it is down-weighted. In Phase 2, when they get two observations, the precision is effectively increased (because two independent observations are more reliable), but they have to pay a cost.

  - Epistemic vs. pragmatic value: Gathering more information (second look) has epistemic value (reduces uncertainty), but it has a cost. The decision to sample again is based on whether the expected reduction in uncertainty is worth the cost.

  - Dark-room objection: Phase 1 directly illustrates it. But in Phase 2, we see that avoiding input is not free, so the brain must engage with the world.

  Contested issues:

  The free energy principle is a broad framework and its interpretation is debated. Some contested points:

  1. Is the brain's sole function to minimize prediction error? Critics argue that there are other goals (e.g., survival, reproductive success) that are more fundamental. Proponents might argue that minimizing prediction error is a means to these ends in a changing world.

  2. The dark-room objection is considered by some to be a misunderstanding. Proponents of FEP might respond that a brain in a dark room would start to hallucinate because it would generate predictions that are not met, leading to an increase in prediction error. Or that the brain has prior expectations that include being in a changing environment, so it would be driven to seek out new stimuli. This is debated.

  In our game, we have not modeled the generative model that includes expectations about change. We have only modeled a simple perceptual discrimination. So we are presenting a simplified version.

  What the game cannot reproduce:

  - The game does not model the brain's generative model that includes dynamics and the expectation that the environment changes. In a dark room, if the brain expects to receive some level of sensory input and doesn't, that in itself causes prediction error. So the brain cannot simply avoid input. We have not modeled this. We will have to explain this in words during the debrief.

  Predictable problems:

  1. Students might not abstain in Phase 1 because they don't do the math and hope to get lucky. They might conclude the game is broken if they see that abstaining is the only rational choice and find that boring.

     Mitigation: Encourage them to think strategically. After a few trials, they may see that guessing is too risky.

  2. In Phase 2, the math is more complex and students might make suboptimal decisions. They might not buy a second look even when it would be beneficial, or vice versa.

     Mitigation: This is part of the learning experience. We can discuss in debrief what the optimal strategy would be.

  3. The prior in Phase 2 might be too strong, leading to very few black cards. We only have 10 black cards in a deck of 50. In 10 trials, we might have only 2 black cards. And if the noise flips them, it might be hard to see a black card reported. But that's okay because we want the prior to dominate.

  Debrief minute-by-minute:

  55-60: Recap the rules and ask about their experiences in Phase 1. Did they abstain? Why?

  60-65: Map Phase 1 to the dark-room objection. Explain that in their optimal play, they minimized expected penalty by avoiding the risky guess, just as the FEP might suggest avoiding sensory input to avoid prediction error.

  65-75: Discuss Phase 2. Ask: How did the cost of abstention change your behavior? Did you ever buy a second look? When? Why? Did the prior (the biased deck) influence your decisions even when you saw evidence to the contrary?

  75-85: Map to FEP concepts:

  - Precision weighting: The noise level (60%) determined the weight they put on the observation. With two observations, the precision increased, but at a cost.

  - Epistemic action: Buying a second look is an epistemic action to reduce uncertainty.

  - Pragmatic value: The decision to sample more must weigh the cost against the benefit (expected reduction in penalty).

  - The prior: In Phase 2, the prior pulled their beliefs toward red. Even when they saw black, they didn't believe it easily. This is like a strong prior in perception (e.g., a belief that a stimulus is unlikely) that can cause misperception.

  85-90: Address the dark-room objection and its counterarguments. Explain that in the real brain, there are prior expectations that include being in an environment with changing sensory input, so the brain expects to receive input and not receiving any would cause prediction error. Thus, the brain is driven to seek out sensory input. This is an active inference perspective. Note that this is an area of ongoing debate.

  This activity does not settle the debate but lets them experience the core tension.

  Let me write the rules concisely.
answer: |-
  ### Philosophy of Mind Seminar Activity: Prediction Error Minimization Game

  This activity is designed to help students experientially grasp the "dark-room objection" to the prediction error minimization (PEM) framework, where a system focused solely on minimizing prediction error would avoid sensory input. Through gameplay, students discover that:
  - **Phase 1**: When abstention is costless, rational players avoid engaging with noisy sensory data to minimize expected error.
  - **Phase 2**: Introducing costs for abstention and additional sampling forces trade-offs between epistemic value (gathering information) and pragmatic value (acting efficiently), while a strong prior can bias perception.

  The activity uses only paper, pencils, and a standard deck of playing cards. It runs in 90 minutes with 16 students.

  ---

  ### **Rules and Setup**
  **Materials:**
  - 1 deck of playing cards (remove jokers; use only red/black suits).
  - Paper and pencils for students to track decisions/scores.
  - **Noise manufacturing**: Modify the deck to control observation accuracy:
    - **Accuracy**: 60% (i.e., observations are correct 60% of the time, flipped 40%).
    - **Method**: Create a "noise deck" from 5 cards: 3 red, 2 black (shuffled). For each trial:
      1. Draw a target card (true state: red/black).
      2. Draw a noise card: 
         - If red, report the target card's true color.
         - If black, report the opposite color.
      - Example: Target is red, noise card is black → report "black".

  **Scoring (No real money):**  
  Points are abstract. Students track cumulative scores. Payoffs are chosen to mirror PEM’s risk-sensitive nature (high penalty for errors).

  **Phase 1: Abstention is Costless (20 minutes)**  
  - **Goal**: Discover that minimizing expected error favors abstention.
  - **Rules**:
    - Each trial, students receive a noisy observation (e.g., "observed color: red").
    - Choices: 
      - Guess the true color (red or black): **+1 if correct, -3 if incorrect**.
      - Abstain: **0 points**.
    - Deck: Unbiased (50% red, 50% black).
    - **Rationale**: With 60% accuracy, expected value (EV) of guessing = (0.6 × 1) + (0.4 × -3) = -0.6. EV of abstaining = 0. Abstaining minimizes expected error.

  **Phase 2: Costs for Abstention and Sampling (25 minutes)**  
  - **Goal**: Explore trade-offs between sampling cost, abstention cost, and prior beliefs.
  - **Rules**:
    - Deck: Biased prior (80% red, 20% black). Stack the deck: 40 red, 10 black (shuffle before use).
    - Choices per trial:
      1. Receive first noisy observation (free).
      2. Decide whether to buy a **second observation** (cost: **-0.2 points**). If yes, draw a new noise card for a second report (independent of first).
      3. Decide: Guess (red/black) or abstain.
        - Guess: **+1 if correct, -3 if incorrect**.
        - Abstain: **-0.5 points**.
    - **Rationale**: 
      - Abstention cost forces engagement.
      - Sampling cost penalizes excessive information gathering.
      - Biased prior (80% red) tests if prior "overpowers" evidence.

  ---

  ### **Timeline (90 Minutes Total)**
  - **Intro (10 min)**:
    - Explain PEM ("brain minimizes prediction error") and the dark-room objection (if PEM is sole goal, system should "switch off senses").
    - Outline game: Two phases, scoring rules, noise (60% accuracy), and goals (maximize points, not win).
    - Assign students roles: All play individually. Use paper to record decisions/scores.

  - **Phase 1 (20 min, ~10 trials)**:
    - **Per trial (2 min)**:
      1. **Draw (15 sec)**: Draw target and noise cards. Announce observation (e.g., "Observed: red").
      2. **Decide (15 sec)**: Students write "red", "black", or "abstain".
      3. **Reveal (15 sec)**: Show true color. Students score themselves.
      4. **Update (15 sec)**: Students note scores. Instructor shuffles decks.
    - **After 5 trials**: Pause. Ask, "What strategy is emerging? Why?"

  - **Transition (5 min)**: Explain Phase 2 rules (biased prior, costs). Emphasize: "Now, doing nothing costs you."

  - **Phase 2 (25 min, ~10 trials)**:
    - **Per trial (2.5 min)**:
      1. **First observation (15 sec)**: Draw target (biased deck) and noise card. Announce observation.
      2. **Buy second look? (15 sec)**: Students write "yes" or "no". If yes, draw second noise card, announce second observation. Deduct -0.2.
      3. **Decide (15 sec)**: Guess or abstain. Write choice.
      4. **Reveal (15 sec)**: Show true color. Students score.
      5. **Update (15 sec)**: Track scores. Shuffle decks.
    - **After trial 5**: Include a "prior overpower" trial. Use a black card (rare, 20% prior) with a correct observation (e.g., "black") to test if prior biases guesses toward red.

  - **Debrief (35 min)**:
    - **Part 1: Game experience (10 min)**:
      - Ask: "What happened in Phase 1? Why did you abstain?" → Highlight: Low accuracy + high penalty made guessing risky.
      - Ask: "In Phase 2, when did you buy a second look? When did you still abstain?" → Highlight: Sampling cost vs. error penalty trade-off.
      - Ask: "In the rare 'black card' trial, did you trust the observation or the prior?" → Highlight: Prior "pulled" judgments.
    - **Part 2: Map to PEM concepts (15 min)**:
      - **Precision weighting**: Noise = low precision. Students downweighted observations (abstained or demanded second looks). In PEM, precision weights sensory input (high noise = low weight).
      - **Epistemic vs. pragmatic value**: Buying a second look = epistemic action (reducing uncertainty). Abstaining despite cost = pragmatic action (avoiding risk). PEM debates whether "value" is purely epistemic or includes pragmatic costs.
      - **Dark-room objection**: Phase 1’s abstention mirrors how a pure PEM system avoids sensory input. Phase 2 shows real agents can’t do this (abstention cost = biological/opportunity costs).
    - **Part 3: Contested issues (10 min)**:
      - **Settled**: PEM uses precision weighting; perception integrates priors and sensory input. Dark-room objection highlights a paradox if PEM is the sole goal.
      - **Contested**: 
        - Is PEM the brain’s *primary* goal? Critics say PEM serves survival (pragmatic value); proponents say it’s foundational.
        - Does the dark-room objection refute PEM? Proponents argue agents have "expected dynamics" priors (e.g., "I expect change"), making inaction costly. Critics say this reframes PEM to avoid falsification.
        - **Emphasize**: "This game simplifies PEM. There’s no consensus on whether PEM is a complete theory or just a tool."

  ---

  ### **Predictable Problems and Mitigation**
  1. **"The game is broken!" in Phase 1**:
     - **Problem**: Students may not abstain initially (e.g., they gamble on guesses). After losses, they conclude the game is unfair.
     - **Mitigation**: After trial 3, calculate expected value together: "With 60% accuracy, guessing averages -0.6. Abstaining is safer." Encourage viewing points as "prediction error" (negative points = error).

  2. **Math overload in Phase 2**:
     - **Problem**: Students ignore probabilities and guess randomly. They miss the trade-off (e.g., don’t buy second looks even when beneficial).
     - **Mitigation**: Simplify with heuristics: "If the observation matches the prior (red), guess. If not (black), consider a second look or abstain." Use the "rare black card" trial to show prior bias.

  3. **Biased prior confusion**:
     - **Problem**: Students may not adjust to the 80% prior, leading to frustration when black cards appear.
     - **Mitigation**: Announce the prior repeatedly. In debrief, contrast a "red observation" (posterior ≈86% red) vs. "black observation" (posterior ≈27% black) to show prior dominance.

  4. **Noise deck distrust**:
     - **Problem**: Students may doubt the noise mechanism (e.g., "Are you fudging cards?").
     - **Mitigation**: Let a student shuffle/draw cards. Use a large noise deck (e.g., 15 red + 10 black cards for 60% accuracy, reshuffled every 5 trials).

  ---

  ### **What the Game Cannot Reproduce (Requires Verbal Explanation)**
  - **Expected dynamics and generative models**: 
    - In real PEM, agents have priors about environmental dynamics (e.g., "the world changes"). This makes inaction costly—no sensory input *itself* violates predictions (e.g., expecting light but getting darkness causes error). 
    - **Explain in debrief**: "The game’s abstention cost is a crude proxy. Real agents have ‘background predictions’ that force engagement. Without this, PEM *would* predict a dark-room preference—but proponents argue brains aren’t that simple."

  ---

  ### **Contested vs. Settled in PEM Framework**
  - **Settled (Broad Agreement)**:
    - PEM involves precision-weighted integration of priors and sensory input.
    - Abstaining from noisy input minimizes expected error *if* there are no costs to inaction.
    - Priors can bias perception, especially with weak evidence.
  - **Contested (Active Debates)**:
    - **Is PEM the brain’s primary function?** Critics (e.g., Colombo & Wright, 2018) argue PEM is instrumental for survival, not an end in itself. Proponents (e.g., Friston) treat it as fundamental.
    - **Does the dark-room objection refute PEM?** Proponents counter that priors include "expected dynamics" (e.g., "I should encounter stimuli"), making the dark room costly (Hohwy, 2016). Critics call this post hoc (Seth, 2015).
    - **Can PEM explain action?** Some argue PEM reduces to perception; others say it unifies perception/action (active inference). The game’s "sampling cost" simplifies this debate.
    - **Emphasize in debrief**: "This game illustrates the tension, but PEM’s scope and validity are still debated. Don’t take this as proof for/against—use it to feel the dilemma."

  This activity makes the dark-room objection visceral. Students will see PEM’s elegance and limits, setting up deeper discussion. Run it once as a dry-run if possible—iron out noise deck issues!
