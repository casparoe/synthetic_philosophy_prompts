answer: |-
  **Bottom line:** 60% credence that formal acknowledgement reduces recurrence risk over two generations versus non-acknowledgment. It shifts probabilities meaningfully but isn't decisive; success hinges on material rebalancing and elite buy-in, not just symbolism.

  **The decomposition:**

  1.  **Elite Incentive Shift (35% Weight):** Acknowledgement alters elite calculus by embedding anti-atrocity norms into institutions (courts, laws, media), making recurrence politically costlier. *Probability of Preventive Effect: 70%* (Strong if elites internalize norms; weak if institutions are hollow).
  2.  **Popular Sentiment Molding (15% Weight):** Curriculum/memorials foster societal aversion, but sentiment is fickle and less policy-direct than elite action. *Probability: 50%* (Significant generational lag; vulnerable to backlash or apathy without reinforcement).
  3.  **Case Comparability Noise (20% Weight):** Differences in state capacity, geopolitical context, or nature of atrocity distort the "similar society" baseline. *Probability: 40%* (Hard to isolate acknowledgement's effect; unique factors often dominate recurrence risk).
  4.  **Restitution Linkage (40% Weight):** Acknowledgement *without* reversing material gains (land, wealth, power) fosters resentment/perverse incentives, undermining prevention. *Probability of Preventive Effect if Unaddressed: 30%* (Symbolism feels like cheap exoneration; winners keep spoils).
  5.  **Unintended Consequences (-10% Weight):** Backlash (elite/popular), victim fatigue, or "closure" narratives enabling complacency *increase* recurrence risk. *Probability of Harm: 25%* (Acknowledgement as endpoint, not process).

  **Combining:**  
  Weighted Average: `(0.35 * 0.70) + (0.15 * 0.50) + (0.20 * 0.40) + (0.40 * 0.30) - (0.10 * 0.25) = 0.245 + 0.075 + 0.08 + 0.12 - 0.025 = 0.495 ≈ 50%`.  
  Adjusted for systemic interaction (acknowledgement + restitution amplifies effect; backlash more likely without it): **+10% => 60%**.

  **The hinge:** **Restitution Linkage (40% weight).** The final credence is most sensitive to whether acknowledgement includes material rebalancing. If gains *aren't* handed back, the probability plummets (~30%). Moving it requires showing mechanisms where *pure* symbolism durably alters elite/popular cost-benefit analysis despite persistent inequality (rare). Evidence would be stable democracies where symbolic atonement *alone* correlated with sustained prevention despite unrestituted gains.

  **On the purchase-price idea:** **Verdict: Sharply plausible core, testable, but incomplete.**  
  *   **Blunt Strength:** It captures a critical dynamic – unaddressed material injustice voids symbolic acts, turning them into transactional "conscience laundering." This is observable (e.g., Confederate memorials vs. land redistribution failures; some Japanese corporate apologies without compensation).  
  *   **Testability:** Yes. Compare recurrence/near-recurrence rates in cases with:  
      (A) Acknowledgement + Restitution,  
      (B) Acknowledgement Only,  
      (C) Neither.  
      Measure elite/popular resistance to similar policies later. "Keeping the house" is often literal (land, wealth gaps).  
  *   **Gap:** It underweights *independent* elite socialization (e.g., post-Nazi German elites internalizing shame *despite* many unrestituted gains) and the slow power of education shaping future generations *even without* full restitution. The "price" isn't always sufficient for "purchase" – sometimes it's just cheap theatre failing to buy anything durable.

  **Final Note:** Your hypothesis likely resonates because it reflects the *moral logic* victims/observers feel – acknowledgement without restitution *is* often perceived as hypocrisy. Its predictive power lies in exposing when symbols are weaponized to *preserve* the underlying structure that enabled the atrocity. For your novel, this tension is dynamite.
