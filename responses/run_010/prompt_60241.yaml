  Now, in prose, we address the unfalsifiability charge and the predictions-versus-rivals question.

  **Unfalsifiability Charge**: The charge is that any failure of the SPI-default thesis can be explained away by claiming that the conditions (baseline mis-estimated, weights not shared, commitments not credible) were not met. This is correct to an extent: the thesis has built-in qualifications that can absorb counterexamples. For a prescriptive thesis, this is not necessarily damaging because it is meant to guide behavior under specific conditions. However, it does make the thesis less empirically testable. The line here is that the thesis is not purely descriptive but normative, so it is entitled to specify the conditions under which it applies. The cost is that it becomes less general and may not apply in messy real-world situations. The residual exposure is that the conditions (especially binding commitments) are often not met, so the thesis might be limited to ideal settings.

  **Predictions versus Rivals**: The SPI-default thesis predicts that, when the conditions are met (binding commitments, shared random device, etc.), agents will achieve a safe Pareto improvement over the baseline without needing to merge values or engage in costly threat-based strategies. This contrasts with:

  - **Unilateral cooperation programs**: These might lead to exploitation if the other does not reciprocate. SPI requires mutual commitment and avoids the risk of unilateral cooperation.
  - **Program equilibrium**: SPI can be seen as a form of program equilibrium, but the thesis specifically advocates for SPI as the default and provides a structured way to select the correlated strategy (using weights and a shared device). The unique prediction is that the outcome will be within the safe Pareto set and selected by the pre-agreed weights.
  - **Nash bargaining over the correlated set**: While Nash bargaining would select a specific point (e.g., maximizing the product of gains), SPI uses a pre-agreed weighting rule. The prediction is that the outcome is determined by the weights and avoids ex post bargaining.
  - **Value merger**: SPI does not require merging values, only agreeing on a correlated strategy. The prediction is that agents with different values can cooperate without value alignment.

  The unique prediction is that cooperation via SPI will be observed in settings with binding commitments and pre-agreement on weights, and it will yield outcomes that are safe and Pareto-improving without requiring value alignment. If, in such settings, agents instead use threat-based strategies, fail to cooperate, or merge values, that would contradict the thesis. However, if such settings are rare, the thesis might be hard to test.
