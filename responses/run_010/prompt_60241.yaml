  ### Unfalsifiability Charge
  Your counterpart's charge—that SPI-default is qualified into unfalsifiability by attributing failures to misestimated baselines, unshared weights, or non-credible commitments—has merit. The thesis is inherently prescriptive, not empirical: it describes how agents *should* cooperate *if* certain conditions hold. This grants it some insulation, as normative claims are evaluated on coherence and applicability, not falsification. However, the charge is damaging in three ways:  
  1. **Immunity to Counterexamples**: Any real-world failure can be deflected by questioning whether conditions were met (e.g., "commitments weren't *truly* binding"), making the thesis empirically vacuous.  
  2. **Erosion of Content**: Qualifying the thesis (e.g., "SPI works only with binding commitments") costs specificity, narrowing its scope to idealized settings and weakening clause (c)'s claim that SPI is the "default" absent special information.  
  3. **Baseline Ambiguity**: As noted in the endogenous-baseline defeater, the baseline itself becomes contestable, allowing proponents to redefine it post hoc to preserve the safety condition.  

  A committed proponent would concede that SPI is not a universal solution but dismiss the charge as mistargeted, arguing:  
  - **Best Reply**: The thesis is a *prescriptive benchmark* for cooperation, not a predictive model. Its value lies in structuring commitments when feasible, and qualifications (e.g., "binding commitments required") are necessary precision, not evasion. Rivals like Nash bargaining or program equilibrium face similar idealizations.  
  **Residual Exposure**: The thesis remains vulnerable to conceptual defeaters (e.g., normative baseline) that challenge its foundations even in idealized cases. It also risks practical irrelevance if "commitment-scarce" scenarios dominate real-world interactions.

  ### Predictions Versus Rivals
  The SPI-default thesis makes unique predictions that distinguish it from rival approaches:  
  - **Against Unilateral Cooperation Programs**: SPI predicts efficient cooperation *without* unilateral concessions. In Hawk-Dove, unilateral cooperation risks exploitation (e.g., playing Swerve yields 0 if the other goes Straight), while SPI guarantees safety and higher payoffs (≥1.54).  
  - **Against Program Equilibrium**: SPI predicts outcomes constrained by the *safe Pareto set* (e.g., λ∈[4/13,9/13] in Hawk-Dove), avoiding extremes that program equilibrium might permit (e.g., λ=1, giving one agent +5 and the other +0, which is unsafe).  
  - **Against Nash Bargaining**: SPI selects outcomes via pre-agreed *weights and randomization*, not ex post bargaining. In Hawk-Dove, Nash bargaining might split the surplus equally (λ=1/2), but SPI predicts this only if weights are symmetric, otherwise a weighted split.  
  - **Against Value Merger**: SPI achieves cooperation without aligning values (e.g., in Hawk-Dove, agents keep divergent preferences but correlate actions).  

  **What SPI Uniquely Predicts**:  
  1. **Safe Surplus Capture**: Cooperation strictly dominates the baseline in expectation *and* respects individual safety, avoiding the instability of unilateral cooperation.  
  2. **Pre-Emption of Bargaining**: Weight-based selection avoids post-agreement haggling, reducing transaction costs.  
  3. **Scalability to AIs**: For clause (d), SPI predicts reliable cooperation between heterogeneous AIs via mutual conditioning on decision procedures, without full value integration.  

  **Vulnerability**: If cooperation emerges without SPI's structured commitments (e.g., via cheap talk) or if safe SPIs are rejected despite meeting conditions (e.g., due to risk aversion), the thesis is weakened. However, its core prediction—that binding, baseline-constrained correlation is the default optimum—remains distinct. Rivals do not emphasize safety or pre-commitment to the same degree, giving SPI explanatory power in commitment-rich environments.
