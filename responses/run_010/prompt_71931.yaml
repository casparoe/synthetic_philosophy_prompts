answer: |-
  Based on the pattern of your friend's ratings, I infer that her core rule for "SPHEXISH" hinges on **whether a system rigidly persists with a predefined routine or plan despite clear evidence that the context has changed in a way that undermines the routine's purpose**, especially when this persistence leads to failure or absurdity. The opposite, "NOT SPHEXISH," is assigned when a system demonstrates **context-sensitive adaptation, learning, or evaluation that overrides its default behavior to achieve its goal**.

  ### The Rule in Detail (and Why It Fits All 10 Ratings)
  - **The rule**: A system is SPHEXISH if it (a) follows a fixed sequence or heuristic, (b) fails to reevaluate or adapt when contextual changes make the routine pointless or harmful, and (c) lacks a feedback loop to correct itself based on outcomes. NOT SPHEXISH systems either (a) learn from new data, (b) flexibly reassess their goals in real-time, or (c) show awareness of contextual shifts that invalidate their default behavior.
    
  - **How it explains all 10 cases**:
    1. **Digger wasp (SPHEXISH)**: Loop persists despite cricket movement (context change).  
    2. **Robot vacuum (SPHEXISH)**: Bumps/turns endlessly, ignoring uncleaned litter (context change: obstacle remains).  
    3. **Sat nav (split)**: Replanning when missing a turn shows adaptation (NOT SPHEXISH driving), but outdated map ignores real-world changes (SPHEXISH map).  
    4. **Excel macro (SPHEXISH)**: Runs steps regardless of failure (no reevaluation).  
    5. **Chess engine (SPHEXISH)**: No learning from opponent's patterns (ignores contextual shifts between games).  
    6. **Text generator (NOT SPHEXISH)**: Novel output generation shows flexibility; lack of self-recognition isn't rigid routine.  
    7. **Nurse (SPHEXISH)**: Checklist followed rigidly despite patient changes (context invalidates routine).  
    8. **Guide dog (NOT SPHEXISH)**: Disobeys command due to danger (contextual override).  
    9. **Warehouse sorter (SPHEXISH)**: Retries chute despite size mismatch (ignores context change: box too big).  
    10. **Thermostat (NOT SPHEXISH)**: Adapts to schedule changes and communicates (reevaluation + learning).

  ### Why This Rule Over Rivals
  Other potential rules (e.g., "no learning/memory," "no goal-oriented behavior," or "lack of general intelligence") fail to fit all cases:
  - **"No learning" rule**: Fails the text generator (no memory but NOT SPHEXISH) and thermostat (learning, NOT SPHEXISH).
  - **"No goal-orientation" rule**: Fails the vacuum and digger wasp (both have goals but are SPHEXISH).
  - **"Deterministic behavior" rule**: Fails the chess engine (deterministic but SPHEXISH) vs. guide dog (deterministic training but NOT SPHEXISH due to override).
    
  The winning rule emphasizes **contextual inflexibility** as the core flaw. The sat nav split (rating #3) is the most critical for discriminating this rule—it shows that adaptation (replanning) negates sphexishness, while obliviousness to external changes (outdated map) affirms it. This highlights that the rule is about dynamic response, not static design.

  ### Prediction for the Hospital Robot Porter: SPHEXISH
  - **Why?**  
    The porter's locked-door routine is a fixed loop (wait 10 minutes → return to lab shelf) that ignores contextual changes:  
    - The biopsy's urgency (must be in theatre within an hour).  
    - The cold-chain requirement (shelf isn't cold).  
    - The lack of notification (lab isn't alerted).  
    Despite its adaptive navigation in other scenarios, this specific failsafe persists rigidly, mirroring the digger wasp or warehouse sorter. The manual's "deliberate failsafe" is analogous to the sat nav's outdated map—a predefined element that doesn't adapt to real-world needs. Your friend's split verdict on the sat nav suggests she distinguishes subsystems, but here the locked-door behavior is central to the rating context (like the nurse's checklist or Excel macro). Thus, the porter's core delivery protocol is SPHEXISH.

  - **If she splits the verdict?**  
    She might rate navigation as NOT SPHEXISH (like the sat nav's driving) but the delivery protocol as SPHEXISH (like its map). However, the query focuses on the locked-door scenario, so a unified SPHEXISH rating is more consistent with cases #1, #4, #7, and #9.

  ### What a Split or NOT SPHEXISH Verdict Would Commit Her To
  - **If SPHEXISH**: She commits to prioritizing outcome over intent. Even if the failsafe is "deliberate," its real-world failure (ruined biopsy) and lack of adaptation make it sphexish. This aligns with cases like the nurse (checklists have purpose but become sphexish when misapplied).  
  - **If NOT SPHEXISH**: She commits to excusing systems with "good reasons" for inflexibility (e.g., safety protocols). But this risks inconsistency—the nurse's checklist had good reasons too, yet was SPHEXISH.  
  - **If split**: She solidifies her subsystem approach (like the sat nav), implying sphexishness is granular, not holistic. But the porter's adaptive navigation is irrelevant to the locked-door failure, so SPHEXISH for the failsafe is still likely.

  ### A Case That Would Settle the Rule
  - **The "Broken Elevator" Delivery Robot**:  
    A robot is tasked with delivering packages to offices. Normally, it takes the elevator. One day, the elevator is out of service with a prominent "Out of Order" sign.  
    - **SPHEXISH version**: Robot waits indefinitely for the elevator, ignoring stairs or alternative routes, causing delays.  
    - **NOT SPHEXISH version**: Robot detects the sign, re-routes via stairs, or alerts for human help.  
  - **Why it settles the rule**:  
    If SPHEXISH, it confirms that rigid persistence in the face of contextual change (elevator broken) defines sphexishness. If NOT SPHEXISH, it emphasizes adaptation as the antidote. This directly tests the rule's core without subsystems or learning.  

  In short, the porter's failsafe is a textbook case of sphexishness—a "zombie routine" that runs despite its purpose evaporating. I predict **SPHEXISH** with 80% confidence, leaning on the nurse (#7) and warehouse sorter (#9) as the strongest parallels. If she splits, she might call its navigation NOT SPHEXISH but its delivery protocol SPHEXISH, upholding her sat nav precedent. But the broader pattern suggests inflexibility is fatal.
