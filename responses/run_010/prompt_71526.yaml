  2. **Rigidity (✓):** Pain as rigid designator is defensible (Kripke’s view).  
  3. **Contestability Note:**  
     - **Live Disagreement:** Kripke (*Identity and Necessity*) claims pain-C-fibre identity *could* be contingent because we can imagine pain without C-fibre firing (and vice versa) without conceptual confusion. Student assumes this is *always* an illusion, but Kripke argues it reveals genuine metaphysical possibility.  
     - **Minority View?** Student’s position aligns with physicalist responses (e.g., Papineau, Loar) but **underdevelops Kripke’s epistemic challenge**: Kripke insists the pain/C-fibre case differs from water/H₂O because we identify pain *directly* by its qualitative character, not contingently associated properties. Student notes the reference-fixing point but doesn’t rebut Kripke’s "no contingent reference-fixer" reply **(–0.5)**.  
  4. **Conclusion (✓):** "Kripke has nothing left" overstates, but the physicalist rebuttal is fairly presented.  

