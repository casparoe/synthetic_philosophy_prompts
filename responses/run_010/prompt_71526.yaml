  - "nimbin = G" = a priori and contingent (✗).  
  - Compares to standard metre: contingent because "world could have turned out otherwise" (✗).  

  **Comments:**  
  1. **A priori (✓):** Correct. Stipulation makes it knowable without experience.  
  2. **Contingency (✗):** **Flat-out wrong**. Kripke (*Naming and Necessity*) argues that if "G" rigidly designates a gas, "nimbin = G" (as a stipulative abbreviation) is **necessary** because "G" is rigid. The standard metre is contingent *only* because the stick’s length is a non-rigid reference-fixer. Here, "G" rigidly picks out a *specific gas*, so identity holds necessarily. **Major error (–3)**.  
  3. **Why?** Student conflates two scenarios:  
     - *Scenario 1 (actual question):* "Let us mean the ionized gas G" → "G" rigid → "nimbin = G" necessary a priori.  
     - *Scenario 2 (student’s mistake):* "Let us mean *whatever gas* produces the shimmer" → contingent (like standard metre).  
  4. **Abbreviation (✓):** Correct but insufficient to salvage answer.  

  **Quick-Skip Miss:** The standard metre analogy sounds plausible but misapplied. Marker might assume student understands rigidity transfers.  

