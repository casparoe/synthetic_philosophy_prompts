  ### Decision Tree: Transitivity of "Better Than" in Spectrum Cases

  **Instructions:** Answer each question based on your intuitive verdict about the case described. Proceed down the tree until you reach a leaf (named position). Each leaf includes one sentence describing its least palatable commitment.

  ---

  #### **Logical Space Overview**
  *Diagnostic Questions*:  
  1. **Film Archive (Adjacent)**: Is each restoration better than its predecessor?  
  2. **Film Archive (Non-Adjacent)**: Is the final restoration better than the original?  
  3. **Film Archive (Shift)**: Do aesthetic criteria shift along the spectrum?  
  4. **Torture-Headache (Adjacent)**: Is each population step better?  
  5. **Torture-Headache (Non-Adjacent)**: Is the headache-filled world better?  
  6. **Within-Life (Adjacent)**: Is each life-state transition better?  
  7. **Within-Life (Non-Adjacent)**: Is the contentment-filled life better?  
  8. **Money Pump**: Would you reverse judgments to avoid exploitation?  

  *Answer Combinations & Constraints*:  
  - **Incoherent**: Claiming (A > B > ... > Z) and (A > Z) violates asymmetry.  
  - **Unattractive**: Biting torture-headache bullet or accepting money pumps.  
  - **Unexplored**: Some combos (e.g., contextualism + transitivity) lack proponents.  

  ---

  #### **Decision Tree**  
  *Start Here*  

  **Node 1: Film Archive (Adjacent)**  
  *Case*: A film archive starts with perfect visuals/poor sound (A). Each restoration (A→B→...→Z) improves sound noticeably but degrades visuals imperceptibly per step. Z has perfect sound/poor visuals.  
  *Question*: Is each adjacent restoration (e.g., B better than A, C better than B, ..., Z better than Y) *better than* its predecessor?  
  - **Yes** → Proceed to Node 2.  
  - **No** → Proceed to Node 3.  

  **Node 2: Film Archive (Non-Adjacent)**  
  *Question*: Is the final restoration (Z) *better than* the original (A)?  
  - **Yes** → Proceed to Node 4.  
  - **No** → Proceed to Node 5.  

  **Node 3: Film Archive (Shift)**  
  *Question*: Is your "No" at Node 1 driven by shifting aesthetic criteria (e.g., sound dominates early, visuals dominate late)?  
  - **Yes** → **Leaf: Contextualism**.  
    *Commitment*: You must deny a single "all-things-considered" betterness ordering exists.  
  - **No** → **Leaf: Lexical Threshold**.  
    *Commitment*: You must accept an arbitrary cutoff where imperceptible losses abruptly become decisive.  

  **Node 4: Torture-Headache (Non-Adjacent)**  
  *Case*: World A has one person tortured for 50 years. Each step (A→B→...→Z) reduces torture by 1 second but adds one person with a mild headache. Z has no torture but vast headaches.  
  *Question*: Is Z *better than* A?  
  - **Yes** → **Leaf: Bullet-Biting Transitivity**.  
    *Commitment*: You must accept that vast headaches are worse than torture.  
  - **No** → Proceed to Node 6.  

  **Node 5: Money Pump Pressure**  
  *Case*: You own A. You pay to swap A→Z (since each adjacent step is better). You then pay to swap Z→A (since you believe A > Z).  
  *Question*: Does this money pump compel you to reverse *any* judgment (e.g., deny A > Z or deny some adjacent step)?  
  - **Yes** → **Leaf: Imprecise Equality**.  
    *Commitment*: You must accept that A and Z are equally good, despite drastic differences.  
  - **No** → Proceed to Node 7.  

  **Node 6: Within-Life (Non-Adjacent)**  
  *Case*: A life starts with one ecstatic minute (A). Each step (A→B→...→Z) trades ecstasy for mild contentment (e.g., B has 59 ecstatic seconds + 1 content minute). Z has no ecstasy but long contentment.  
  *Question*: Is Z *better than* A?  
  - **Yes** → **Leaf: Genuine Intransitivity**.  
    *Commitment*: You must accept cycles where (A > Z) and (Z > ... > A) coexist.  
  - **No** → **Leaf: Parity/Clumpiness**.  
    *Commitment*: You must posit a fourth relation (e.g., "on a par") beyond better/worse/equal.  

  **Node 7: Torture-Headache (Adjacent)**  
  *Question*: Is each adjacent population step (e.g., B better than A, C better than B) *better than* its predecessor?  
  - **Yes** → **Leaf: Genuine Intransitivity** (as in Node 6).  
  - **No** → **Leaf: Parity/Clumpiness** (as in Node 6).  

  ---

  #### **Leaf Positions**  
  1. **Bullet-Biting Transitivity**: Preserves transitivity; bites torture-headache bullet.  
  2. **Genuine Intransitivity**: "Better than" is non-transitive; allows cycles.  
  3. **Imprecise Equality**: Adjacent items are "equal enough"; denies transitivity via vagueness.  
  4. **Parity/Clumpiness**: Items are "on a par" (clumped); denies transitivity via a fourth relation.  
  5. **Lexical Threshold**: Transitivity holds via sharp thresholds (e.g., visual loss becomes decisive at a point).  
  6. **Contextualism**: No single ordering; betterness is aspect- or context-dependent.  

  ---

  #### **Indistinguishable Pairs**  
  1. **Parity vs. Imprecise Equality**  
     - *Why*: Both explain non-transitivity via "incompleteness," differing only in metaphysics (ontological parity vs. epistemic vagueness).  
     - *Separator?* Ask: "Is the indeterminacy due to *how we measure* (imprecision) or *how values relate* (parity)?" (But often verbal.)  

  2. **Contextualism vs. Parity**  
     - *Why*: Both deny fixed ordering; hard to distinguish when shifting criteria create clumps.  
     - *Separator?* Ask: "When criteria shift, are A and Z *incomparable* (contextualism) or *comparable but on a par* (parity)?"  

  ---

  **Design Notes**  
  - **Film Archive** isolates boundary imprecision (Node 3) vs. genuine shifts (Contextualism).  
  - **Money Pump** (Node 5) tests whether choice pressure revises verdicts.  
  - **Within-Life** (Node 6) checks if structural intransitivity generalizes beyond population ethics.  
  - **Unused Combos**: e.g., "Yes to all adjacent but no to non-adjacent + contextualism" is incoherent (contextualism requires denying fixed adjacency judgments).
