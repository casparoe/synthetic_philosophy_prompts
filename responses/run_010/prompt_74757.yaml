answer: |-
  ## Dialogue: Computational Complexity as Philosophical Evidence

  **Alex:** Look, take the PPAD-completeness of finding a Nash equilibrium. If rational play *requires* computing a NE, but no tractable method exists to find one in general, then "be rational" demands the impossible for bounded agents. Normative theories prescribing NE implicitly demand logical omniscience *plus* computational omniscience. That’s incoherent for real agents.

  **Sam:** But hardness is a *worst-case*, asymptotic claim tied to a specific input encoding. Philosophy defines rationality abstractly—it doesn’t care about bit-strings. By fixing an encoding, you’ve smuggled in implementation details. Actual games are tiny; even exponential algorithms work fine. Idealization abstracts away *feasibility*, like assuming Bayesian agents can condition on any evidence.

  **Alex:** The encoding isn’t arbitrary! For NE, we use natural representations of payoff matrices. Structural PPAD-hardness across diverse games shows the obstruction is inherent to the *concept* of equilibrium, not quirks of encoding. Exponential time is irrelevant—"tractable" means scaling reasonably with problem size. Ought implies can: if no feasible *process* exists to *find* the rational act, how can it be obligatory?

  **Sam:** Ought-implies-can applies to *agents*, not algorithms. Humans use heuristics, approximation, domain knowledge—things smoothed analysis shows often work in practice. Hardness ignores that. Normativity gives a *target*; how we approach it computationally is separate. We don’t reject arithmetic because factoring is hard—we approximate!

  **Alex:** Smoothed analysis and heuristics are probabilistic or situational escapes. Philosophy deals with *justification*: if the theory says "play your NE strategy," but you lack any reliable tractable way to *identify* it amidst hard instances, how is that strategy "yours"? It’s epistemically inaccessible. Rationality requires *recognizable* reasons for action.

  **Sam:** But worst-case hardness might be vanishingly rare! Average-case complexity matters more—and for many distributions, NE *is* findable. Besides, normative ideals aren’t action-guiding step-by-step manuals. They’re standards for evaluating outcomes. We criticize irrational *choices*, not failures to compute PI to the nth digit under time pressure.

  **Alex:** If the standard is unreachable *in principle* via any feasible cognitive process—even probabilistically—then it’s not a standard for *us*. Hardness reveals a mismatch between the idealization’s demands and computational reality. Ignoring this is like physics ignoring the speed of light. It’s not about tiny instances; it’s about the *structure* of rationality itself.

  **Sam:** Structure? Complexity classes are relative to machine models (Turing, circuit depth). Change the model, hardness might vanish. Philosophy’s ideals are model-independent. And tractability isn’t binary—we have quasipolynomial time, FPTAS for approximations. Normative theories can adapt: "approximate NE" might be the real prescription.

  **Alex:** But PPAD-hardness *persists* under standard approximations! And if we switch machines, we risk changing the *problem* (e.g., quantum vs. classical). Philosophy can’t just handwave feasibility. If a theory’s prescription is computationally irreducible in our universe, that’s a metaphysical constraint on rational agency. The idealization is broken, not just idealized.

  **Sam:** Broken? No. It’s a regulative ideal. We navigate NP-hardness daily. The map isn’t the territory: complexity studies computational *models* of agency, not agency itself. Until you show cognition is bound by exactly those worst-case limits, hardness is a technical footnote—not a philosophical refutation.
