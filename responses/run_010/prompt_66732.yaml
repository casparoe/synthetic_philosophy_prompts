  - Truth-tracking (0.6): Debater incentives are problematic - they'll exploit step-transparency loopholes (e.g., drowning judge in valid-but-misleading steps).
  - Judge bias (0.8): Volume/fluency likely sway time-pressed judges, and debates may amplify this as both sides bludgeon with arguments.
