  In the agreed claims section, I'll include non-vacuous statements both parties can accept about looping effects, prevalence interpretation, clinical utility vs validity, and ethics of public criteria release. For the disagreements table, I'll neutrally frame differences in how each side describes key concepts like "underlying mechanism" or "human kinds," specifying whether each dispute is substantive or verbal.

