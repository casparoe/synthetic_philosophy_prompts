  ## Scoping: Points of Likeliest Misalignment and Design Limitations

  Before proceeding, we note three potential verbal tangles and the empirical boundaries of this design. First, "prevalence" carries distinct connotations: for Party A, it primarily denotes *detection rate of an underlying phenomenon*; for Party B, it often signifies *penetration rate of a conceptual category* into self-experience and reporting. Second, "stability" is contested: Party A seeks to engineer stability *in measurement* to reveal underlying structure; Party B argues instability *in the phenomenon* is inherent due to looping. Third, "mechanism" for Party A implies physiological or cognitive processes operating independently of classification; for Party B, it includes the socio-cognitive processes activated *by* classification itself.

  This study design effectively measures *differences in observable outcomes* between jurisdictions under specific conditions of category introduction and public availability. It can detect *if* looping occurs (e.g., prevalence differences, vocabulary shifts, clustering changes) and *how* it manifests. However, it cannot definitively arbitrate the *ontological status* of the category ("is it *really* there?"), as this hinges on prior commitments about what constitutes "real" in psychiatric kinds. It also cannot resolve whether the looping observed is merely "noise" (A) or constitutive of the kind (B), as this interpretation depends on the underlying theoretical framework applied to the same data.

  ---

  ## Joint Statement on the Introduction of "Feed-Checking Dysregulation"

  **Party A:** [Signature Line]
  **Party B:** [Signature Line]

  We, the undersigned, representing distinct philosophical perspectives on psychiatric classification, concur on the following claims based on the stipulated study design and our shared commitment to empirical rigor and ethical practice:

  1.  **Looping Effects are Observable and Measurable:** The introduction of a diagnostic category, especially when coupled with widespread public education and self-screening, demonstrably influences patterns of symptom reporting, help-seeking behavior, and the language individuals use to describe their experiences (Outcomes i, ii, iv). This influence is not merely anecdotal but can be quantified through blinded assessment and linguistic analysis.
  2.  **Prevalence Changes Require Cautious Interpretation:** An observed difference in point prevalence (Outcome i) between Jurisdiction A (immediate adoption) and Jurisdiction B (deferred adoption, but instrument available) cannot, by itself, be definitively interpreted *either* as solely revealing pre-existing but previously unrecognized cases *or* as solely manufacturing new cases through suggestion. Multiple factors, including increased recognition, altered reporting thresholds, and genuine behavioral change in response to the category, are plausible contributors. The direction and magnitude of any difference require careful contextual analysis beyond the raw number.
  3.  **Clinical Utility and Scientific Validity are Distinct:** The potential clinical utility of the "feed-checking dysregulation" category (e.g., facilitating help-seeking, guiding initial treatment selection, providing patients with a framework for understanding distress – Outcome iv) is conceptually separate from questions concerning its scientific validity (e.g., whether it represents a discrete syndrome with a coherent underlying pathophysiology or etiology, assessed via Outcomes i and iii). Utility can exist in the absence of established validity, and validity does not guarantee utility in all contexts.
  4.  **Ethical Dimensions of Public Criteria Release are Inherent:** The decision to publish diagnostic criteria publicly alongside category adoption in a national health service carries significant ethical weight, irrespective of one's ontological view. Potential benefits (demystification, empowerment, earlier help-seeking) must be rigorously weighed against potential harms (stigmatization, inappropriate self-diagnosis, iatrogenic symptom amplification, pathologizing normal variation). This ethical calculus is inherent to the adoption process described and cannot be avoided by withholding information.
  5.  **Blinded Assessment is Necessary but Insufficient:** The use of structured interviews with raters blinded to jurisdiction and the specific category name (Outcome i) is a necessary methodological control to minimize assessment bias. However, such blinding cannot control for how the category itself, once known to the *participant*, may have altered their subjective experience, interpretation of symptoms, or willingness to report them, thus shaping the data gathered even by a blinded rater.
  6.  **Statistical Independence vs. Clustering is Interpretable Data:** The finding of whether the endorsed criteria cluster together statistically as a syndrome or appear independent (Outcome iii) provides valuable empirical data. However, the *meaning* of clustering (evidence of latent structure) or independence (evidence against latent structure, or evidence of disparate problems grouped under one label) is not self-evident and requires interpretation within a theoretical framework that considers the potential influence of learned scripts and category-specific symptom monitoring.

  **Disagreements Table**

  | Disagreement Stated Neutrally                                                                 | Party A's Preferred Wording                                                                                          | Party B's Preferred Wording                                                                                                 | What Turns On It                                                                                                                                 | Substantive/Verbal/Partly Verbal & Justification                                                                                                                                   |
  | :------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **The primary goal of refining diagnostic categories in psychiatry.**                         | To asymptotically approximate causally coherent structures existing independently of the classificatory act.          | To generate clinically useful and ethically responsive tools for alleviating suffering within a dynamic socio-cognitive field. | The fundamental purpose of nosology: Is it primarily discovery of pre-existing natural kinds or construction of pragmatically effective interventions?                                 | **Substantive.** Difference in core objective (epistemic vs. pragmatic/ethical).                                                                                                  |
  | **The nature of the "mechanism" sought in validating a disorder like feed-checking dysregulation.** | A physiological or cognitive process(es) causing the symptom cluster, operating independently of the diagnostic label. | A network of factors including neurocognitive vulnerabilities, learned behaviors, *and* the socio-cognitive effects of being classified, which are constitutive. | Whether the interactive effects are contaminants obscuring the "real" disorder or integral components of the disorder as a human kind.           | **Substantive.** Difference in what constitutes the phenomenon under investigation.                                                                                               |
  | **The interpretation of stability vs. instability in diagnostic criteria endorsement.**       | Instability primarily indicates measurement noise or heterogeneity obscuring an underlying stable structure.         | Instability is an expected property of interactive human kinds; demanding chemical-kind fixity misunderstands their nature. | What constitutes valid evidence *for* a psychiatric kind: Does stability under measurement imply reality, or is instability inherent?           | **Partly Verbal (re: "stability"), Substantive (re: implication).** Shared term "stability" used differently (measurement precision vs. kind persistence); substantive disagreement on what stability implies about the kind's nature. |
  | **The significance of spontaneous vocabulary adoption (Outcome ii).**                         | Reflects the spread of a concept, potentially useful clinically, but not direct evidence for the underlying reality of the disorder described. | Demonstrates the category becoming "live" within the lifeworld of potential patients, actively shaping their self-understanding and experience, thus becoming part of the phenomenon. | Whether linguistic uptake is evidence of successful concept dissemination or evidence of the category becoming ontologically real *as* an interactive kind. | **Substantive.** Difference in the ontological significance attributed to the internalization of diagnostic concepts.                                                              |

  **The Cruxes**

  1.  **Will blinded prevalence (i) be higher in Jurisdiction A than B?**
      *   **Bearing:** Tests the *amplification effect* of simultaneous official adoption + public campaign vs. instrument availability alone.
      *   **Party A Prediction:** Prevalence may be slightly higher in A due to increased help-seeking/awareness revealing pre-existing cases, but significant difference unlikely if the underlying phenomenon is stable and the B instrument availability enables similar recognition.
      *   **Party B Prediction:** Prevalence will be significantly higher in A due to the legitimizing and amplifying effect of the official health service campaign combined with the label, intensifying the looping effect beyond mere instrument availability.
      *   **Revision Trigger:**
          *   **A:** A large, significant excess in A would challenge the assumption that underlying prevalence is stable and largely unaffected by the *official* classification context, requiring consideration of stronger interactive effects.
          *   **B:** No significant difference, or higher prevalence in B, would challenge the predicted unique amplifying power of the *official* adoption context + public campaign compared to instrument circulation alone.

  2.  **Will spontaneous vocabulary use (ii) differ between jurisdictions despite instrument availability in both?**
      *   **Bearing:** Tests whether the *official status* and associated health service campaign in A significantly alter the internalization and deployment of the category vocabulary for self-description, beyond mere exposure to the criteria.
      *   **Party A Prediction:** Minor differences possible, but widespread instrument availability in B will lead to substantial spontaneous use there too; differences attributed to differential awareness campaigns, not ontology.
      *   **Party B Prediction:** Significantly higher spontaneous use in A, as the official sanction and health service context make the category more salient, legitimate, and "real" for individuals seeking to articulate their distress.
      *   **Revision Trigger:**
          *   **A:** A large, significant excess in spontaneous vocabulary use in A, disproportionate to any difference in awareness campaigns, would suggest the official classification context powerfully shapes self-concept in ways needing greater integration into models.
          *   **B:** Minimal or no difference would challenge the necessity of *official* classification context (beyond criteria exposure) for significant vocabulary internalization and self-concept alteration.

  3.  **Is criteria clustering (iii) evidence of a syndrome or of learned behavior?**
      *   **Bearing:** Tests whether statistical coherence arises from shared underlying dysfunction or from individuals learning and conforming to a presented checklist.
      *   **Party A Prediction:** Clustering supports a latent syndrome; while learning may occur, a robust cluster suggests an underlying structure that learning merely helps express. Non-clustering would invalidate the category.
      *   **Party B Prediction:** Clustering is expected *because* individuals learn the checklist and begin to experience/monitor/report symptoms in the presented configuration; it demonstrates the category's effectiveness as an interactive script, not necessarily a pre-existing syndrome. Non-clustering might suggest weak looping or poor category design.
      *   **Revision Trigger:**
          *   **A:** Strong clustering *only* in A, or significantly stronger in A, would be difficult to explain solely by underlying structure and would strongly suggest the classification process itself induces coherence.
          *   **B:** Strong clustering in *both* jurisdictions, despite differing official status, would suggest factors beyond the specific official introduction context (e.g., inherent plausibility of the criteria, effects of instrument alone) can generate coherence, warranting consideration of potential shared vulnerabilities.

  4.  **Is the category in year five the same disorder as at year one?**
      *   **Making it Well-Posed:**
          *   **For Party A:** Does the core symptom cluster, as measured blind, retain the same statistical relationships and association with putative biomarkers/risk factors (if any explored)? Has the underlying mechanism remained the focus?
          *   **For Party B:** Has the lived experience, societal understanding, help-seeking pathways, and treatment responses associated with the label meaningfully evolved due to the looping effects observed? Is the "kind" recognizable in its effects?
      *   **Bearing:** Tests the temporal stability of the category as either a natural or an interactive kind.
      *   **Party A Prediction:** The core disorder remains the same; changes in presentation or framing are superficial.
      *   **Party B Prediction:** The category inevitably evolves; the "disorder" in year five is not identical to year one due to accumulated looping effects.
      *   **Revision Trigger:**
          *   **A:** Significant shifts in symptom correlations, risk profiles, or treatment response patterns unexplained by improved detection would challenge the stability of the underlying construct.
          *   **B:** Remarkable stability in lived experience narratives, societal perceptions, and clinical pathways despite documented looping effects would challenge the *degree* of constitutive change expected within five years.

  **The Residual Disagreement**

  One disagreement persists regardless of the study's outcome: **The fundamental purpose of psychiatric classification.** Party A maintains that the primary goal is the discovery and validation of categories that accurately map onto distinct, underlying (primarily biological) pathological processes, believing this to be the most reliable long-term foundation for effective intervention. Party B maintains that the primary goal is the generation of clinically useful and ethically responsive tools for alleviating suffering here and now, operating within the inescapably interactive and meaning-laden realm of human distress, where concepts like "underlying pathology" are often provisional and secondary to pragmatic effect. This difference concerns core values and priorities (epistemic truth-tracking vs. pragmatic/ethical problem-solving) and the very definition of what constitutes progress in psychiatry. No empirical study on a single category can resolve this foundational divergence regarding the aims of the nosological enterprise.

  **Concessions and Signatures**

  *   **For Party A's Core Claim (Categories track underlying structure) to be True:** Party B would have to concede that the observed interactive effects ("looping") are ultimately epiphenomenal noise obscuring, but not fundamentally constituting, psychiatric phenomena. The phenomena would need to behave as if they were largely indifferent kinds once measurement artifacts are controlled.
  *   **For Party B's Core Claim (Classifications are interactive kinds) to be True:** Party A would have to concede that the search for fixed, underlying structures independent of classification is fundamentally misguided for most psychiatric categories, and that the observed instability is not a problem to be solved but a defining feature to be incorporated.

  **Closing Paragraph:**

  Through this structured collaboration, we affirm the empirical demonstrability of classification effects ("looping") on symptom reporting, self-concept, and help-seeking. Party A acknowledges that these interactive processes are more pervasive, measurable, and potentially constitutive of clinical presentations than previously emphasized, demanding integration into research designs and validity assessments. Party B acknowledges that the aspiration to identify relatively stable patterns of dysfunction, potentially tied to mechanisms beyond the immediate social interaction, remains a coherent and potentially fruitful scientific endeavor, even amidst interactivity. We agree that the introduction of diagnostic categories, especially with public dissemination, carries profound ethical responsibilities and requires ongoing monitoring for both benefits and unintended harms. Our differences regarding the ultimate nature of psychiatric kinds and the primary aims of classification persist, but this collaboration has refined our understanding of the empirical landscape we both seek to explain and sharpened the questions requiring further investigation. We commit to interpreting the results of the stipulated study through this shared, nuanced framework.

  **Party A:** _________________________
  **Party B:** _________________________
