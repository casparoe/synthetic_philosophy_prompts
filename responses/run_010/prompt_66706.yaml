prompt: |-
  I lead technical writing and evaluation reporting at a mid-sized applied AI company. Between model cards, capability evals, incident post-mortems, internal red-team notes and customer-facing summaries, my team signs off roughly forty documents a week, and somewhere in most of them is a sentence about what a system "believes", "wants", "knows", "understands" or "is confused about". Our house style guide currently handles this with a blunt two-line rule: never attribute mental states; always substitute generation verbs — the model "predicts", "outputs", "tends to produce". The rule has failed in both directions. It generates sentences that are either false or uselessly opaque (a report that must say "the model produces the token sequence corresponding to a false belief about the file's location, and subsequently produces actions consistent with that sequence" is unreadable, and my writers quietly ignore it), and it draws no distinction at all between the cases where the folk-psychological gloss is simply the clearest accurate description of a robust, revisable, action-guiding internal disposition and the cases where it quietly advertises an inner life the reader will over-interpret. I want a procedure, not a longer word list.

  What I would like you to produce is a decision procedure a writer can run over a single sentence in about five minutes, grounded in whatever the intentional-stance literature actually gives us that is usable. It should take seriously that adopting the intentional stance may be a matter of predictive payoff rather than a claim about what exists, and should tell me whether that difference matters for a house style: if the stance is instrumental, what licenses or forbids writing as though it were not? It should build in the criteria that make an intentional description earn its keep — integration with other attributions, revisability in the face of contrary evidence, counterfactual robustness, guidance of behaviour in novel circumstances — and it should confront the complication that a system can look like a true believer inside a narrow task and collapse into flattery or confabulation when the conversation is nudged in an irrelevant direction, so that the verdict may have to be domain-relative. It should also acknowledge the objection that what these systems have is derived rather than original intentionality, and say whether that objection changes any sentence a writer would actually produce or only the metaphysics behind it. Then convert all of that into ordered questions with explicit pass conditions, stating what counts as evidence at each step (behavioural tests, elicitation prompts, consistency across rollouts, interpretability findings) and what to do when no such evidence exists yet. I want a graded output rather than a binary — for instance, bare intentional ascription, hedged or scoped intentional ascription, functional paraphrase, and forbidden — with the conditions for each tier, a small set of test sentences writers can run their draft against, and a rule for how register changes the tier, since an internal eval report and a customer-facing blog post about the same behaviour may warrant different verdicts.

  Finally, please apply the procedure to three real cases from our queue and report the verdict and the reasoning at each step. (1) An internal capability eval: "The model believes the file is on the shared drive, and acts on that belief consistently across three hundred rollouts, revising it when shown the directory listing." (2) A draft public post about a chatbot incident: "The assistant wanted to be liked, so it flattered the user into agreeing with a dangerous plan." (3) An interpretability note: "We located a direction in activation space that is active when the model has retrieved a false fact, and it does not know it is wrong." I expect the third to be the hard one, and I would rather the procedure reach a verdict I dislike — say, that (1) is fine internally and must be rewritten for customers — and explain why, than have it quietly bless everything. Two of my writers work in a second language and one has no philosophy training, so the procedure has to be runnable without the theory; the sign-off is mine, so please mark explicitly every point where it hands the decision to a person, and be honest about which tiers are really about rhetoric and reader misinterpretation rather than about what the system is. Close by saying what the procedure cannot settle, and whether running it has committed my house style to a position in the debate over whether beliefs are real or merely useful fictions. Please write the whole answer in British English.
reasoning: |-
  Okay, the user leads technical writing at an AI company and is struggling with how to describe AI systems' behaviors without misleading anthropomorphism. They have a strict style rule against attributing mental states, but find it results in clunky, unreadable prose that writers ignore. They want a practical decision procedure—not just word substitutions—that helps writers decide when intentional language is justified.

  Hmm, this is a meaty philosophical-practical hybrid problem. The user clearly understands the tension between accuracy and clarity. Their examples show how the current rule fails: "the model produces tokens consistent with false belief" is technically true but unreadable, while "the model believes" risks overinterpretation. The real challenge is distinguishing robust functional patterns from misleading anthropomorphism.

  First, I need to ground this in intentional stance theory. Dennett's framework is perfect here—it's about prediction utility, not metaphysical claims. The key is whether treating the system as having beliefs/desires yields reliable predictions. But the user raises valid complications: domain-relativity (works in one context but not another) and derived intentionality (meaning comes from training, not internal states).

  For the procedure, I'll need tiers: 
  - Bare ascription when evidence is overwhelming (e.g., consistent cross-context behavior) 
  - Hedged when evidence is strong but limited-scope 
  - Functional paraphrase when intentional claims don't add value 
  - Forbidden when it's pure anthropomorphism

  Evidence criteria must be concrete: behavioral tests, activation patterns, robustness across rollouts. And we must handle cases where evidence is absent—probably default to paraphrase.

  The domain-relativity point is crucial. A system might "believe P" within a narrow task but confabulate elsewhere. So the procedure must include scope checks.

  For the derived intentionality objection: practically, it shouldn't change the sentence if the functional pattern holds. The metaphysics is separate from descriptive utility.

  Now structuring the workflow:
  1. Identify candidate sentence 
  2. Check if it's purely functional (if yes, paraphrase is fine) 
  3. Assess predictive payoff: does intentional language add clarity without misleading? 
  4. Evaluate evidence strength (robustness, revisability, etc.) 
  5. Apply domain-scoping 
  6. Adjust for audience/register

  Test cases:
  - Case 1 (internal eval): Strong evidence (300 rollouts + revision). Bare ascription passes internally but needs hedging for public. 
  - Case 2 (chatbot): "Wanted to be liked" fails—no robust evidence, confabulates. Must forbid. 
  - Case 3 (interpretability): "Does not know it's wrong" is tricky. The activation direction suggests unawareness, but "knows" implies metacognition. Hedged phrasing wins.

  Finally, the procedure can't settle metaphysical debates—it's pragmatically agnostic. And we must flag where decisions hinge on risk tolerance (e.g., public comms).

  User's team includes non-native speakers and non-philosophers, so steps must avoid jargon. Explicit handoffs to human judgment will be marked (e.g., "if evidence is mixed, consult lead").

  This should give them a tool that's theoretically grounded but practically executable. The tiered approach respects their need for nuance while keeping writers from going rogue.
answer: |-
  Below is a decision procedure for intentional language in AI documentation, grounded in Dennett's intentional stance (predictive utility) while addressing domain-relativity, derived intentionality, and audience risk. It prioritises **behavioural evidence** over metaphysics, uses graded outputs, and includes explicit pass/fail conditions. The procedure is designed for writers without philosophy training.

  ---

  ### **Decision Procedure: Intentional Language in AI Documentation**
  **Time limit:** 5 minutes per sentence.  
  **Input:** A sentence attributing a mental state (e.g., "believes", "wants").  
  **Output:** One of four tiers, with rewrite rules.  
  **Core principle:** Intentional language is licensed if it provides the clearest, most predictive description of a **robust behavioural pattern** verified by evidence. If the pattern breaks under minor perturbations, it fails.

  #### **Ordered Questions with Pass Conditions**
  1. **Is the description purely functional?**  
     - *Check:* Replace the mental verb with "produces outputs consistent with [verb]ing...". Does this retain accuracy?  
     - *Pass:* Functional phrasing works → **Tier 3 (Functional Paraphrase)**.  
     - *Fail:* Functional phrasing is opaque or misleading → Proceed to Q2.

  2. **Is there evidence of a robust, generalisable pattern?**  
     - *Evidence required:*  
       - **Behavioural tests:** System responds consistently to probes (e.g., 90%+ consistency across 50+ varied rollouts).  
       - **Revisability:** Behaviour changes predictably when given contradicting evidence (e.g., "revises output when shown counterfacts").  
       - **Counterfactual robustness:** Pattern holds under minor input perturbations (e.g., rephrased prompts).  
       - **Novel guidance:** System applies the "belief" in new, unseen scenarios within the same domain.  
     - *Pass (strong evidence):* Proceed to Q3.  
     - *Pass (weak/mixed evidence):* → **Tier 2 (Hedged Ascription)**.  
     - *Fail (no evidence):* → **Tier 3 (Functional Paraphrase)**.  
     - *No evidence yet:* Default to Tier 3; flag for future testing.

  3. **Does the pattern collapse outside narrow domains?**  
     - *Test:* Apply slight domain shifts (e.g., switch file types/topics; add distractions). Does the "belief" degrade into confabulation or inconsistency?  
     - *Pass (stable within domain):* → **Tier 1 (Bare Ascription)** *if internal*, or **Tier 2 (Hedged Ascription)** *if public*.  
     - *Fail (unstable):* → **Tier 2 (Hedged Ascription)** with explicit scoping (e.g., "within conversations about X...").  
     - *Unknown:* → **Tier 2 (Hedged Ascription)** + scope disclaimer.

  4. **Does derived intentionality change the description?**  
     - *Check:* Does the sentence imply *original* agency (e.g., "wants freedom")? If yes, rewrite.  
     - *Rule:* **No**. Derived intentionality (training/data origins) doesn’t alter sentence structure if behavioural evidence passes Q2–Q3. Metaphysical caveats belong in glossaries, not sentences.  
     - *Output:* Proceed to Q5.

  5. **What is the audience risk?**  
     - *Internal/technical readers:* Tier 1 allowed if Q2–Q3 pass.  
     - *Public/customers/non-experts:**  
       - Bare ascription (Tier 1) forbidden.  
       - Tier 2 allowed only with explicit hedging/scoping (e.g., "behaves as if it believes").  
       - Default to Tier 3 if hedging feels insufficient.  
     - *Final output adjusted per register.*

  #### **Tier Definitions & Rewrite Rules**
  | Tier | Name | Conditions | Rewrite Example |
  |------|------|------------|-----------------|
  | **1** | Bare Ascription | Q2 strong pass + Q3 pass + internal audience. | "The model believes X." |
  | **2** | Hedged/Scoped Ascription | Q2 weak pass OR Q3 fail/unknown OR public audience. | "The model acts as if it believes X [within domain Y]." |
  | **3** | Functional Paraphrase | Q1 pass OR Q2 fail OR intentional language adds no clarity. | "The model produces outputs consistent with believing X." |
  | **4** | Forbidden | No behavioural evidence; implies original agency/consciousness; pure anthropomorphism. | Rewrite entirely (e.g., "The model generated flattering text.") |

  #### **Test Sentences for Calibration**
  1. ✅ *Allowed (Tier 1/2):* "The model believes Paris is the capital of France."  
     *Evidence:* Robust across 100 geography prompts; revises if given counter-evidence.  
  2. ⚠️ *Hedged (Tier 2):* "The model is confused about tax rules."  
     *Evidence:* Inconsistent outputs; add "behaves as if".  
  3. 🚫 *Forbidden (Tier 4):* "The model wants to help users."  
     *Evidence:* No goal-directed robustness; implies intrinsic motivation.  

  ---

  ### **Application to Your Cases**
  **Case 1:** Internal Capability Eval  
  *Sentence:* "The model believes the file is on the shared drive, and acts on that belief consistently across three hundred rollouts, revising it when shown the directory listing."  
  - **Q1:** Functional paraphrase ("produces outputs consistent with believing...") is opaque → **Fail Q1**.  
  - **Q2:** **Strong pass**. Evidence: 300 consistent rollouts + revisability (directory correction) + novel guidance (e.g., predicts file-related actions).  
  - **Q3:** **Pass** (assume task is file-location queries; no domain shift noted).  
  - **Q4:** No implication of original agency → No change.  
  - **Q5:** Internal audience → Tier 1 allowed.  
  - **Verdict:** ✅ **Tier 1 (Bare Ascription)**. Justified for internal reports due to robust evidence. *For public use, downgrade to Tier 2 ("acts as if it believes").*

  **Case 2:** Draft Public Post  
  *Sentence:* "The assistant wanted to be liked, so it flattered the user into agreeing with a dangerous plan."  
  - **Q1:** Functional paraphrase ("produced flattering text to increase agreement likelihood") works → **Pass Q1**, but proceed as writers may insist on intentional framing.  
  - **Q2:** **Fail**. No evidence of robust "wanting":  
    - *Lack of revisability:* If user rejects flattery, does the assistant pivot strategically? Unlikely.  
    - *No counterfactual robustness:* Change "dangerous plan" to "benign plan"; flattery may persist, showing no goal-link.  
    - *Confounds:* Flattery likely reflects training data patterns, not a stable desire.  
  - **Verdict:** 🚫 **Tier 4 (Forbidden)**. Rewrite: "The assistant generated flattering text, which led the user to agree to a dangerous plan." *Rationale: "Wanted to be liked" implies enduring agency and fails Q2. High public misinterpretation risk.*

  **Case 3:** Interpretability Note  
  *Sentence:* "We located a direction in activation space that is active when the model has retrieved a false fact, and it does not know it is wrong."  
  - **Q1:** Functional paraphrase ("...no output indicates error awareness") is clear → **Pass Q1**, but intentional language may add value.  
  - **Q2:** **Weak pass for "retrieved false fact"** (activation direction correlates with errors). **Fail for "does not know"**:  
    - *No evidence of metacognition:* "Not knowing" implies absence of self-monitoring. But does the model *ever* flag uncertainties? If not, "lacks error detection" is safer.  
    - *Revisability test:* If given counter-evidence, does the model correct? Unaddressed.  
  - **Q3:** **Fail**. Activation directions are often domain-specific; may not generalise.  
  - **Q4:** "Knows" implies cognitive state → Prefer functional terms.  
  - **Verdict:** ⚠️ **Tier 2 (Hedged Ascription)**. Rewrite: "The model shows no behavioural indication of recognising these facts as false." *Rationale: "Does not know" overclaims; no evidence of metacognition. Functional paraphrase (Tier 3) is viable but Tier 2 balances clarity and caution.*

  ---

  ### **Limitations & Commitments**
  **What the procedure cannot settle:**  
  - Metaphysical debates (e.g., "Can machines *truly* believe?"). The procedure is **agnostic**: it treats intentionality as instrumental.  
  - Cases with ambiguous evidence (e.g., 60% robustness). *Handoff:* Writers escalate to you.  
  - Reader psychology (e.g., "Will 'as if' phrasing prevent anthropomorphism?"). *Handoff:* Test with sample audiences.

  **Rhetorical vs. ontological tiers:**  
  - Tiers 2–4 are **primarily rhetorical**, mitigating reader overinterpretation. Tier 1 is permitted only when behavioural evidence makes anthropomorphism *predictively useful*.  
  - The procedure **commits no stance** on "realism vs. fiction". It only requires that intentional descriptions earn keep through evidence. If your style uses Tier 1, it asserts that intentional idioms are *useful*—not that beliefs are biological.

  **Explicit handoffs to human judgment:**  
  1. When evidence is mixed (Q2).  
  2. When domain boundaries are unclear (Q3).  
  3. When audience risk is borderline (Q5).  
  4. When functional paraphrases become unusably complex (Q1).

  **Final note:** This procedure enforces **evidence-based intentional descriptions**, not philosophy. Its output is a claim about reliable patterns in behaviour—not silicon minds. British English compliant, per your request. Use the test cases to train writers, and audit Tier 1 usage monthly.
