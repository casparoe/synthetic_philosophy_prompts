  We are dealing with a confusion between two different types of quantities: 
     (1) an actual count of events (e.g., deaths) that occurred in a specific time period (a stock or a one-time event), and 
     (2) a counterfactual projection of events that would have occurred over time (a flow or a rate) without converting to a common basis (like total over a defined period).

  This is not exactly the same as:
     - Double counting: which is counting the same event more than once.
     - Discounting future welfare: which is about how we value future events less than present ones.
     - Total vs. average welfare: which is about whether we care about the total welfare or the average welfare per individual.

  The core issue is a failure to convert between a rate (or a flow) and a total over a defined time horizon. Without specifying the time horizon, the two figures (one-time event vs. perpetual rate) are incommensurable.

  In the literature, I am not aware of a specific term for this exact confusion. However, we can look for concepts that are related.

  One related concept is the "time frame inconsistency" or "temporal scope mismatch". Another is the "stock-flow confusion" (which is known in economics, particularly in macroeconomics, where people confuse stock variables with flow variables). 

  In macroeconomics:
     - A stock is a quantity at a point in time (e.g., the amount of water in a bathtub).
     - A flow is a rate per unit of time (e.g., the water flowing from the tap per minute).

  In the case of the cleared forest:
     - The first person is counting a stock: the total deaths that occurred in the first year (or a one-time event).
     - The second person is considering a flow: the annual rate of suffering that would have continued indefinitely.

  But the second person is effectively summing that flow over an infinite horizon without discounting and comparing it to the one-time stock. This is problematic because without discounting, an infinite flow has an infinite total. So the comparison is between a finite number (the one-time stock) and an infinite number (the perpetual flow) unless a finite time horizon is set.

  In fact, the second argument is making an implicit assumption about the time horizon (infinite) and the discount rate (zero). The first argument is only looking at a fixed, short time period (one year). Without agreeing on the time horizon and discount rate, the two figures cannot be compared.

  Therefore, the confusion is a form of "stock-flow confusion" but applied to welfare and counterfactual scenarios. It is also related to the problem of "infinite ethics" (if we consider an infinite time horizon) and the need for discounting.

  But note: the example of the cull is similar. One side counts the deaths in the cull (a one-time stock) and the other side counts the future offspring that would have been produced (a flow of future lives). Again, without converting the flow to a total over a defined time horizon (and without discounting), the two are incommensurable.

  Thus, the established concept that comes closest is "stock-flow confusion" from economics. However, it is usually applied in the context of financial or macroeconomic variables (like debt vs. deficit). Applying it to welfare and counterfactuals is an extension.

  Alternatively, in demography and population dynamics, one might talk about the difference between a "cohort" measure (following a group over time) and a "period" measure (at a point in time). But again, the confusion here is about comparing a point-in-time event with a projected stream.

  Given that, I think the best fit is the economic concept of stock-flow confusion, even though it is not typically applied in welfare ethics. Therefore, I will use that as the established term.

  However, if we are to propose a new term because the existing one doesn't fit perfectly, we might call it "temporal aggregation mismatch" or "counterfactual flow vs. event confusion". But let's see if we can use the existing term.

  Verdict: The established term "stock-flow confusion" is the best available, though it is a partial fit because it is not typically applied in welfare ethics and the confusion here involves counterfactuals.

