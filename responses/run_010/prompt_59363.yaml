     - The divergence is that in economics, stock-flow confusion typically does not involve counterfactuals (like what would have happened) and is not in the context of welfare.
     - Also, the flow in the second argument is being implicitly summed over an infinite horizon without discounting, which is a separate issue (infinite ethics).

  Alternatively, we might consider the term "discounting neglect" but that doesn't capture the stock vs. flow aspect.

  Another candidate is the "non-identity problem" in population ethics, but that is about whether it is wrong to create a person who will have a life worth living but not as good as others. It doesn't fit.

