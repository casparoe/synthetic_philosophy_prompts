prompt: |-
  been chewing on the risk-weighted expected utility thing for a couple years now — came at it from the rationalist-blog side, so the Allais / Ellsberg / Pascal's-mugging reflexes were already installed before I ever looked at the formalism — and what I want is an audit of my own position, not a tour of the literature. here's the package:

  1. the Allais common-ratio pattern is correct and it isn't a confusion or a framing artifact. sure million over the 10/89/1 gamble; then 10% for five million over 11% for one million once the common consequence is stripped out. somebody who flips there is tracking something real about risk, not screwing up arithmetic.

  2. the way to capture it is a rank-dependent rule of the Buchak sort: order the outcomes of the act, then weight each increment by a function of the probability of landing at least that well, with that function convex so long odds on the upside get discounted more than proportionately. I take this to be the normatively right decision theory for an individual agent, not a description of how humans happen to be biased.

  3. my utility of money is basically linear. I refuse to explain risk aversion as diminishing marginal utility of dollars, and I refuse to get Rabin'd into a total-wealth framing where turning down $110/$100 commits me to turning down a shot at a billion. the risk-sensitivity lives entirely in the probability weighting.

  4. relatedly, decisions get evaluated on their own terms. if I'm facing two independent bets at the same time, I apply the rule to each one separately and do what it says for each. I dont want a theory where the verdict depends on whether I happened to think of them as one package or two.

  5. act-wise dominance is not up for negotiation. if one act is at least as good in every state and strictly better in some, you take it, and any formalism that says otherwise is broken. this is bedrock for me — its how I check that a theory isn't smuggling in nonsense.

  6. and this is what lets me handle Pascal's mugging without caving to it: tiny probabilities get downweighted more than proportionately, so for realistic muggings the weighting does the work and I never have to pretend my utility function is bounded.

  a friend who does formal epistemology read the list and made two objections. (a) that 1 and 3 pull against each other, becuase if your utility of money is genuinely linear then the Allais preference is just a mistake with extra steps. (b) that 3 is empty anyway — "risk-averse weighting with linear utility" is concave utility written in different notation, so I've announced a rejection of something I've quietly kept.

  so, go through it: which pairs among 1–6 are genuinely in tension, ranked by severity rather than dumped in a flat list, and for each one what specifically has to give and what that costs me. then tell me straight whether (a) and (b) land or whether he's the confused one. and if there's one revision that cleans up the most, name it — I'd rather drop a single commitment decisively than hedge across all six. assume I already know the math; I want the bookkeeping on my own position.
reasoning: |-
  Hmm, the user has been grappling with risk-weighted expected utility theory for years, coming from a rationalist blog background. They're deeply invested in their specific set of principles about decision theory and want an audit of internal consistency rather than literature review. 

  Let me unpack their six core commitments first. Point 1 defends Allais paradox preferences as rational. Point 2 endorses Buchak-style rank-dependent utility with convex probability weighting. Point 3 insists on linear money utility to avoid Rabin's critique. Point 4 demands separability of simultaneous decisions. Point 5 treats statewise dominance as non-negotiable. Point 6 uses probability weighting to defang Pascal's mugging.

  Their friend's objections need careful handling. Objection (a) claims linear utility makes Allais preferences irrational - but the user sees probability weighting as the legitimate source. Objection (b) argues that risk-weighting + linear utility is just concave utility in disguise. I'll need to dissect whether the formalism actually supports this equivalence.

  The Buchak framework is crucial here. Her theory keeps utility linear while applying a weighting function w(p) to cumulative probabilities. Crucially, w(p) being convex (overweighting low p, underweighting high p) generates the Allais pattern without touching utility curvature. This directly addresses objection (a) - the user isn't inconsistent, they're using different psychological primitives.

  But point 4 creates real trouble. Buchak's theory violates separability - evaluating two independent bets together applies weighting to the combined outcome distribution, giving different results than separate evaluations. The user's demand for isolated evaluations contradicts how rank-dependent models actually work mathematically. This tension can't be papered over.

  Point 5 also clashes subtly. Statewise dominance holds in Buchak's model, but only if we strictly order outcomes. If two acts share outcome values but shift probabilities, "at least as good in every state" becomes ambiguous. The user's absolute phrasing might need refinement to handle such edge cases.

  For objection (b): while risk-weighting + linear utility can mimic concave utility in specific comparisons, they're not equivalent globally. The two models diverge in reactions to probability shifts versus outcome shifts. The user is right that they're distinct - but should acknowledge that in practice, the behaviors often overlap.

  The cleanest fix? Dropping point 4's separability demand. Buchak's model requires evaluating entire acts holistically, so demanding isolated bet evaluations undermines its core mechanism. Keeping separability would force abandoning rank-dependent utility altogether - too high a price given their other commitments.

  Ultimately the user's position is largely coherent except for separability. Their rejection of concave utility isn't empty - it's a philosophically distinct approach to risk sensitivity. But they must accept that simultaneous bets form new acts requiring combined evaluation. That's the necessary tradeoff for keeping their other principles intact.
answer: |-
  Here's an audit of your position, ranked by severity of tension, what must give, and the cost. Objections (a) and (b) are addressed directly.

  **Core Tensions (Ranked by Severity):**

  1.  **Point 4 (Separate Evaluation) vs. Point 2 (RDU/Buchak)**
      *   **Tension:** This is the most severe and fundamental conflict. **Buchak's RDU is fundamentally holistic.** It requires ordering the outcomes *of the entire act* and weighting probabilities based on the *cumulative distribution* of that specific act. Evaluating two independent bets simultaneously forces you to consider them as *a single new act* with a combined outcome distribution. The weighting function w(p) is applied to the cumulative probabilities *of this new distribution*. Evaluating them separately applies w(p) to the cumulatives of *each individual distribution*. **These will almost always yield different results.** RDU *cannot* satisfy separability for independent acts without becoming linear (w(p) = p) or imposing other severe restrictions incompatible with convex weighting.
      *   **What Must Give:** **Point 4 must be abandoned.** You cannot insist on evaluating independent bets separately while using Buchak's RDU as your normative theory. The normative recommendation *depends* on how the gambles are packaged.
      *   **Cost:** You lose the intuitive idea that "how I mentally frame simultaneous choices shouldn't matter normatively." You must accept that the *combination* of gambles creates a genuinely new object of evaluation with its own (holistically applied) risk profile. Rabin-style wealth effects aren't the issue; the holistic nature of the weighting function itself is.

  2.  **Point 3 (Linear Utility) + Point 2 (Convex RDU Weighting) vs. Point 1 (Allais Preference) - *Regarding Objection (a)***
      *   **Tension:** This is where your friend's objection (a) lands. If utility were linear *and* probabilities were weighted linearly (w(p)=p), the Allais preference *would* be irrational (violating the Independence Axiom). However, your point 2 explicitly rejects linear probability weighting. **Convex w(p) in RDU *is* the mechanism that normatively justifies the Allais preference *despite* linear utility.** The preference arises because the common consequence removal drastically changes the *ranking* of outcomes and thus how the weighting function distorts the *cumulative* probabilities. The 10% chance of $5M in the second choice is a slightly-better-than-worst outcome and gets severely downweighted (due to convexity at low cumulatives), while the 11% chance of $1M is a much-better-than-worst outcome and gets weighted closer to its probability.
      *   **What Must Give (to resolve *this specific tension*):** **Nothing needs to give here.** Your position (Linear U + Convex w(p) explaining Allais) is internally consistent *within the RDU framework*. Objection (a) assumes linear probability weighting is the only rational approach. You reject that, endorsing convex weighting normatively. This tension *disappears* under your chosen normative framework (RDU).
      *   **Cost:** You must defend the normative validity of probability weighting *itself* against the standard EU critique that it violates "true" probability calculus. You've already signaled willingness to do this.

  3.  **Point 5 (Act-Wise Dominance) vs. Point 2 (RDU) - *Subtle Edge Case_***
      *   **Tension:** Standard RDU satisfies (stochastic) dominance *if* outcomes are strictly ordered. However, your phrasing "at least as good in every state and strictly better in some" can encounter a subtle issue related to *how* outcomes are defined and ordered. Consider two acts A and B. Suppose in every state, A gives $X or $Y, and B gives $X or $Z, with Y > Z. Act A dominates B only if "giving $Y" is strictly better than "giving $Z" in the relevant states. RDU handles this fine. The edge case arises if the "strictly better in some" involves shifting probability mass *within* the ordering defined for the weighting. RDU respects dominance when dominance is defined strictly over outcomes. However, the *weighting* depends on the cumulative distribution. If adding a strictly better outcome in some state changes the *ranking* of other outcomes in the act, it could theoretically alter the weighting applied elsewhere (though dominance would still hold). This is minor.
      *   **What Must Give:** **Clarification of Point 5.** Your bedrock principle holds in Buchak RDU *as long as* dominance is defined strictly over the outcome values themselves and the states are well-defined. You might need to rephrase Point 5 slightly: "If Act A yields an outcome at least as valuable as Act B in every possible state of the world (using the agent's utility function), and yields a strictly more valuable outcome in at least one state, then A is preferred to B." RDU respects this.
      *   **Cost:** Mostly just careful definition. The core principle is safe.

  4.  **Point 3 (Linear Utility) vs. Point 6 (Pascal's Mugging Defense)**
      *   **Tension:** Convex weighting (downweighting tiny probabilities) *is* your defense. Linear utility is essential for it. Without linear utility (e.g., bounded utility), PM defense is trivial. *With* linear utility and *without* weighting, PM is devastating. Your combination works. **No direct tension.** Point 6 relies *on* Point 3 + Point 2.

  5.  **Point 3 (Linear Utility) vs. Point 2 (RDU) + Point 1 (Allais) - *Regarding Objection (b)***
      *   **Tension:** This addresses objection (b). Is "Risk-averse weighting with linear utility" just concave utility in disguise? **No, not generally.** While convex probability weighting *can* generate choices that *look like* those of an EU maximizer with concave utility *in specific comparisons* (like certain certainty effects or Allais patterns), **they are distinct models globally.**
          *   **Risk vs. Diminishing Value:** Concave utility reflects diminishing marginal value of *outcomes*. Convex weighting reflects aversion to *probabilistic risk* itself, particularly the risk of bad outcomes or the low probability of very good ones.
          *   **Diverging Predictions:** They predict different choices in other situations. E.g., an RDU agent with convex weighting and linear utility will exhibit *insensitivity* to changes in moderate-to-high probabilities (due to the inverse-S shape, overweighting low p, underweighting high p), while an EU agent with concave utility is generally sensitive to probability changes proportional to utility differences. Their reactions to adding background risk or multi-stage gambles also differ significantly. RDU + Linear U *cannot* be reduced to EU + Concave U over outcomes for all possible choices.
      *   **What Must Give:** **Nothing.** Objection (b) is incorrect in claiming equivalence. The models are behaviorally distinct. You are rejecting diminishing marginal utility of money outcomes as the *source* of your risk aversion; you are attributing it to probabilistic risk aversion via weighting. This is a coherent philosophical and formal position.
      *   **Cost:** You need to be clear that you are rejecting *only* diminishing marginal utility *of the outcomes* as the explanation. You embrace probabilistic risk aversion. You must accept that for *some* choices, your behavior will mimic someone with concave utility, but the underlying reasons and predictions for other choices are different.

  **Addressing the Friend's Objections:**

  *   **(a) Pull Between 1 & 3:** **Doesn't land.** Your friend assumes linear probability weighting (w(p)=p) is normatively required. You reject this, endorsing convex w(p) *as* normatively correct. Within RDU, Linear U + Convex w(p) normatively justifies the Allais preference. Point 1 and Point 3 are compatible *because* of Point 2.
  *   **(b) Empty Rejection / Equivalence:** **Doesn't land.** While convex weighting + linear U can generate *local* choice patterns similar to concave U + linear weighting in *some* contexts (like Allais), the models are globally distinct. They represent fundamentally different psychological/evaluative primitives (aversion to outcome levels vs. aversion to probability distributions) and make different predictions in other choice sets. Your rejection of diminishing marginal utility is substantive, not notational.

  **The One Revision to Clean Up the Most:**

  **Drop Point 4 (Separate Evaluation of Independent Bets).**

  *   **Why:** This is the only point fundamentally incompatible with the core mechanics of Buchak's RDU, the theory you endorse normatively (Point 2). RDU requires evaluating the entire act holistically. Trying to force separability onto it breaks the model or forces you to abandon the convex weighting central to your explanations of Allais (Point 1) and Pascal's Mugging (Point 6).
  *   **What it Costs:** You must accept that combining simultaneous gambles creates a genuinely new choice object. The normative recommendation depends on whether gambles are presented/considered together or separately. This sacrifices a strong intuition about the "independence" of simultaneous decisions.
  *   **What it Preserves:** Everything else. Dropping Point 4 resolves the most severe tension while allowing you to keep Linear Utility (Point 3), RDU as normative (Point 2), the Allais preference as rational (Point 1), Act-wise Dominance (Point 5, with clarification), and your Pascal's Mugging defense (Point 6). It also definitively answers your friend's objections as invalid within your chosen framework.

  **Conclusion:**

  Your position is largely coherent and defensible *within the RDU framework*, **except for the demand to evaluate independent bets separately (Point 4).** This demand is incompatible with the holistic nature of rank-dependent probability weighting. Your friend's objections (a) and (b) do not hold water; they stem from assuming the standard EU framework (linear weighting is mandatory) or incorrectly equating the behavioral implications of convex weighting + linear utility with concave utility + linear weighting globally.

  **The decisive revision is to abandon Point 4.** Embrace that Buchak RDU evaluates the entire act presented, and combining independent bets creates a new act. This preserves your core insights about risk sensitivity residing in probability weighting (not outcome utility), the rationality of Allais and dominance, and your defense against Pascal's Mugging, while remaining faithful to the formalism you endorse normatively.
