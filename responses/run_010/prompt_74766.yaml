     - Row chooses *A* (2 > 1). Outcome: (*A*, *S*).  

  2. **Eliminate column *S* first** (weakly dominated by *A*):  
     - *A* ≥ *S* (tie when row plays *A*, win when row plays *J*), so eliminate *S*.  
     - Reduced game:  
       |        | **A**        |  
