  ### Order Dependence in Iterated Weak Dominance: A Non-Degenerate Illustration  

  **Introduction to the Phenomenon**  
  Iterated elimination of strictly dominated strategies (IESDS) yields a unique result regardless of deletion order. However, this robustness vanishes when weakly dominated strategies are allowed. This entry examines a non-degenerate game where iterated weak dominance (IEWDS) produces multiple outcomes depending on deletion order. The game involves three regulatory bodies (harbor, inland-transport, border agencies), but only the harbor (row player) and border (column player) agencies are active in our simplified 3×3 bimatrix. Payoffs represent jurisdiction gains:  

  |        | **J** (Joint) | **A** (Alone) | **S** (Stay out) |  
  |--------|---------------|---------------|------------------|  
  | **J**  | 1, 1          | 0, 2          | 1, 0             |  
  | **A**  | 2, 0          | 1, 1          | 2, 0             |  
  | **S**  | 0, 1          | 0, 2          | 0, 0             |  

  **Initial Strict Dominances**  
  We begin by removing strictly dominated strategies:  
  - **Row player (Harbor)**: *S* is strictly dominated by *A*. Regardless of the column player’s choice, *A* yields higher payoffs (2 > 0, 1 > 0, 2 > 0). Eliminate row *S*.  
  - **Column player (Border)**: *J* is strictly dominated by *A*. For all row choices, *A* yields higher payoffs (2 > 1, 1 > 0, 2 > 1). Eliminate column *J*.  

  The reduced game is:  

  |        | **A**        | **S**        |  
  |--------|--------------|--------------|  
  | **J**  | 0, 2         | 1, 0         |  
  | **A**  | 1, 1         | 2, 0         |  

  **Weak Dominances in the Reduced Game**  
  No further strict dominances exist. However, two weak dominances emerge for the column player:  
  - *A* weakly dominates *S*:  
    - If row plays *J*, *A* (2) > *S* (0).  
    - If row plays *A*, *A* (1) > *S* (0).  
    Thus, *A* ≥ *S* in all cases, with strict inequality in both.  
