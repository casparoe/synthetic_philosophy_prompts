     - Row chooses *A* (1 > 0). Outcome: (*A*, *A*).  

  3. **Eliminate both weakly dominated columns simultaneously**:  
     - If we remove *A* and *S* in one step, only row strategies *J* and *A* remain, but no columns. The "outcome" is the set {(*J*, -), (*A*, -)}, meaning no specific prediction.  

  **Diagnosing the Indeterminacy**  
  The indeterminacy arises from **two factors**:  
  1. **The permission to delete weakly dominated strategies**.  
     - Weak dominance allows a strategy to be eliminated if another is *at least as good* in all scenarios and *strictly better* in at least one. This tolerates ties, unlike strict dominance.  
  2. **The presence of payoff ties in the reduced game**.  
     - In the reduced game, when the row player chooses *A*, the column player is indifferent between *A* and *S* (payoff 1). This tie means rationality alone doesn’t force the column player to avoid *A* or *S*; both are viable.  

  The distinction reveals a **foundational tension in iterated dominance**:  
  - **Rationality claim**: "A rational player never chooses a dominated strategy." This justifies deleting strictly dominated strategies. For weakly dominated ones, a rational player *might* choose them if the dominating strategy ties in some cases—no cost for indifference.  
  - **Belief claim**: "A rational player cannot believe an opponent would choose a dominated strategy." This stronger claim, used in epistemic justifications, *might* justify deleting weakly dominated strategies. However, if opponents are indifferent, belief in their choice remains plausible.  

  Thus, IEWDS relies on the belief claim, but indifference introduces ambiguity: opponents might reasonably choose a weakly dominated strategy, making deletion order-sensitive.  

  **The Mixed-Strategy Ambiguity**  
  Mixed strategies complicate IEWDS due to two interpretations:  
  - **Physical randomization**: Players use a random device. Deleting weakly dominated strategies can eliminate mixed strategies that assign weight to inferior choices.  
  - **Epistemic uncertainty (Brandenburger)**: A mixed strategy represents opponents’ beliefs about a player’s actions.  

  Under the **epistemic interpretation**:  
  - Deleting a strategy means opponents assign zero probability to it.  
  - In our reduced game, if the column player is indifferent between *A* and *S* when the row plays *A*, opponents may still assign positive belief to either.  
  - This *fails to rescue IEWDS*. Since belief in a weakly dominated strategy is permissible (due to ties), deletion isn’t justified, and the indeterminacy persists.  
  - Worse, if beliefs allow non-deleted strategies, IEWDS may over-eliminate or under-eliminate, amplifying order-dependence.  

  **The Honest Verdict**  
  Iterated weak dominance is **well-defined procedurally** but **does not guarantee a unique prediction**. The solution concept is:  
  - **Set-valued**: IEWDS produces a *set* of surviving strategy profiles, not a single outcome.  
  - **Order-dependent**: The final set depends on deletion sequence.  

  In our example, three orders yield:  
  1. (*A*, *S*)  
  2. (*A*, *A*)  
  3. {(*J*, -), (*A*, -)} (no clear prediction).  

  **Conclusion for Students**  
  IEWDS is not a reliable tool for predicting a unique outcome. Its justification hinges on:  
  1. **Belief-based rationality** (stronger than payoff-based rationality).  
  2. **No indifference** (which rarely holds in non-degenerate games).  

  Use IEWDS cautiously. When reporting results, specify the deletion order and acknowledge that alternatives may exist. In rigorous analysis, prioritize strict dominance or equilibrium concepts (e.g., Nash) for unique predictions. This example shows that weak dominance, while intuitive, introduces indeterminacy reflecting genuine epistemic ambiguity—not pathological payoffs.
