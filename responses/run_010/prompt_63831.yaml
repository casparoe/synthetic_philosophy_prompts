prompt: |-
  I'm two terms into a reading group on contractualism and we've hit a wall on the numbers problem that I don't think is going anywhere. What I want is a diagnosis, not a survey — please don't re-explain what contractualism is or walk me through the rescue case, we all know it, and don't give me a reading list either, that's not the point. Set-up: half the group are pairwise-comparison purists who insist that Scanlon's own balancing-complaints move betrays the whole purpose of the theory, that justification to each has to happen one person at a time or the thing collapses into utilitarianism in a contractarian hat. The other half say the purists are fetishising a distinction without a difference, becuase when the complaints on both sides are equally strong the pairwise person has nothing left to say except "flip a coin", and a theory whose verdict in the five-against-one case is a coin toss isn't respecting the separateness of persons, its ignoring it. Then there's a third who has defected to straightforward aggregation and thinks the project was never going to work, and a fourth who wants to bite the bullet with Taurek-style equal-chance lotteries everywhere and be done with it. Nobody has moved since Michaelmas and we've started going in circles about whether we're even arguing about the same thing.

  My hunch — tell me if it's wrong, or only half right — is that we aren't disagreeing about verdicts at all. On every case we've put on the table (the two islands; a hospital that can either save five people from death or spare a million people a lost finger; the same hospital with the numbers and the sizes of harm moving in opposite directions across a chain of cases so that each adjacent pair looks clear but the ends don't match up) everyone either agrees what should be done or agrees it's genuinely unclear. What we disagree about is what the justification is allowed to look like. So maybe "justifiable to each person" is doing two different jobs in the room: a distributive one, where you ask each person separately whether they could reasonably reject a principle, and a collective one, where you ask each person to consider a principle in which everyone else's complaints are already sitting in the balance — and half our argument is those two uses talking past each other. A second hunch: "aggregation" is a term of art for the purists, meaning summing quantities of good and losing track of whose good it is, but an ordinary word for the rest of us, meaning just that numbers count for something, so when the defector says contractualism aggregates after all and the purists say it doesn't, they might both be right and no case will ever settle it. Third hunch, and this is the one I actually care about: maybe there's a formal question underneath the whole thing that nobody in our group has the tools for — whether any principle can simultaneously be justifiable to each person taken singly, never let a huge number of trivial complaints outweigh one death, and deliver transitive verdicts across a chain of cases. If somebody proved that combination impossible, wouldn't that end the debate in a way no amount of case-juggling ever will?

  So: diagnose it. Is the disagreement substantive, verbal, two different questions filed under one heading, or is the demand itself ill-posed — is there something confused about insisting a principle be justifiable to each person one at a time, as opposed to justifiable to each person full stop? Tell me which of my three hunches survive contact with what each camp actually says, where the real crux is if there is one, and what would count as progress given your diagnosis: a distinction, a case, a theorem, a change of question, or nothing, with reasons why nothing should be expected. British English please — I'm handing bits of this to a seminar tutor who marks down Americanisms.
reasoning: |-
  Okay, the user is part of a reading group stuck on contractualism's numbers problem. They've split into factions: pairwise purists, collective balancers, defectors to aggregation, and Taurek-style lotterists. The user suspects the real disagreement isn't about case verdicts but about what "justifiable to each person" means—distributive vs. collective interpretations. They also think "aggregation" is being used differently and wonder if there's a formal impossibility at play.

  First, I need to unpack the core issue. The purists insist on pairwise comparisons to respect individual veto power, fearing aggregation collapses into utilitarianism. The balancers argue that without some balancing, you get absurd results like coin flips for large numbers. The user's hunch is that both sides might agree on outcomes but diverge on justification structures. 

  The user's first hunch seems spot-on. The distributive interpretation (each person's complaint considered in isolation) clashes with the collective one (complaints weighed against others). When the purists say "justifiable to each," they mean no individual can reasonably reject a principle based solely on their own complaint. The balancers interpret it as principles must accommodate all complaints collectively. This isn't just verbal; it's about the theory's architecture. 

  On the second hunch, "aggregation" is indeed a term causing trouble. For purists, it implies summing utilities, losing personhood. For others, it's acknowledging numbers matter without reducing individuals to sums. This semantic split means debates about whether contractualism "allows aggregation" are circular—both sides are right by their definitions. Cases won't resolve this because they don't address the underlying conceptual gap.

  The third hunch is crucial. The user asks if a principle can satisfy three conditions: justifiable to each singly, avoid trivial harms outweighing deaths (anti-aggregation), and maintain transitivity. There's likely an impossibility here. For example, if saving five over one is required, but saving one over a finger is required, transitivity might force saving five over any number of fingers—violating anti-aggregation. A formal proof would show these constraints are incompatible, forcing a choice: drop pairwise purity, allow some aggregation, or accept intransitivity (like Taurek). 

  The real crux is whether contractualism must be distributive to respect persons. Purists see this as non-negotiable; others think the collective approach still respects individuals by considering their complaints in context. Progress might come from distinguishing "justification to each" (distributive) from "justification to all" (collective), acknowledging both are valid but different projects. 

  The tutor might appreciate framing this as a structural trade-off. Highlighting the impossibility theorem could shift the debate from cases to constraints. If no principle meets all three conditions, the group must decide which to sacrifice. That’s the substantive core—what contractualism's "respect for persons" fundamentally requires.
answer: |-
  Right, let's cut through the fog. Your hunches are sharp, and the deadlock is structural — not about cases or verdicts, but about what contractualism's core justificatory constraint **permits** at the level of reasoning. Here's the diagnosis, point by point:

  1.  **Your First Hunch: Distributive vs. Collective Justification (Spot On)**
      *   **The Purists:** They hear "justifiable *to* each person" as demanding a *distributive justification*. For principle P to be justified *to* Alf, you must show that *Alf's* complaint against P isn't sufficiently strong *on its own terms* to give Alf a reasonable veto, *given the alternative principles and the complaints others would have against them*. The comparison for Alf is solely: "Does my complaint against P outweigh the strongest complaint anyone would have against a relevant alternative principle that could save me?" This is inherently pairwise and agent-focused. The complaints of others only enter Alf's deliberation *indirectly*, through the lens of what alternative principles are available and what complaints *those* would generate. They see Scanlon's "balancing complaints" as smuggling in interpersonal aggregation *within* the individual's deliberation, collapsing the "to each" into "to the group".
      *   **The Balancers:** They hear "justifiable *to* each person" as demanding a *collective justification*. Each person, assessing P, must consider *all* the complaints for and against P *and* its alternatives *simultaneously*. Betty, asked to accept P, must weigh *her own* potential complaint *alongside* the complaints of everyone affected by P *and* by the alternatives. Justification *to* Betty requires her to see that, *given the totality of the complaints*, P is reasonably acceptable *even if* her own complaint might, in isolation, seem veto-worthy. The "to each" means "each person must find the *overall balance* of reasons acceptable". For them, the purist view renders the theory impotent in standard numbers cases ("flip a coin") precisely *because* it fails the collective justifiability test – it doesn't respect the *collective* weight of the many small complaints.
      *   **Why It Stalls:** These are fundamentally different conceptions of the justificatory constraint. The purist sees the balancer's move as abandoning the core commitment to individual veto power grounded solely in *one's own* complaint's strength. The balancer sees the purist's move as rendering the core commitment irrational and practically useless in paradigmatic moral dilemmas. **No case adjudicates this; it's a prior commitment about what the theory *is*. The debate is over the very structure of reasonable rejection.**

  2.  **Your Second Hunch: "Aggregation" as Term-of-Art vs. Ordinary (Also Correct)**
      *   **Purists:** "Aggregation" = strict interpersonal summation of welfare units, treating persons as mere containers for value. It inherently violates the separateness of persons by making the *source* of the complaint (whose good/bad it is) irrelevant beyond its quantum. *This* is what contractualism must avoid to be distinct from utilitarianism.
      *   **Balancers/Defectors:** "Aggregation" = allowing that the *number* of people affected matters morally. It doesn't require reducing harms to a single metric or ignoring whose harm it is. It simply means that five serious complaints *can*, collectively, outweigh one equally serious complaint, or that a sufficient number of less-serious complaints *can* outweigh a very serious one (e.g., fingers vs. death at scale). This is compatible with respecting persons – their distinct complaints are *all* being counted and weighed.
      *   **The Defector's Point:** They argue Scanlon *does* this balancing (hence "aggregates" in the broad sense) implicitly whenever he moves beyond pure pairwise comparison in numbers cases. The purist denies this counts as 'aggregation' (only the strict sense is real aggregation) and thus denies contractualism does it. The balancer agrees it does it (in the broad sense) and argues it *must* to be plausible. **Again, the disagreement is semantic/conceptual at root. Cases won't resolve it because both sides describe the *same* balancing act using the same term ('aggregation') but loading it with opposite normative valences.**

  3.  **Your Third Hunch: The Formal Impossibility (The Crucial Insight)**
      *   **This is the real engine of the stalemate.** Your trio of desiderata – (A) Justifiable distributively (to each person taken singly, pairwise), (B) Anti-Aggregation (no vast trivial harms outweighing one death), (C) Transitivity – *is* likely impossible to satisfy simultaneously.
      *   **The Chain of Cases is Key:** Imagine a sequence where adjacent cases seem pairwise clear:
          1.  Save 1 Death vs. Save 1 Death? => Tie/Coin Flip (Pairwise clear).
          2.  Save 1 Death vs. Save 1 Broken Arm? => Save the Death (Pairwise clear, B holds).
          3.  Save 1 Broken Arm vs. Save 2 Broken Arms? => Save the 2 (Pairwise clear? A single broken arm complaint isn't strong enough to veto saving two others from the same harm).
          4.  ... (Continue scaling harm down/number up) ...
          *N.* Save 1 Broken Arm vs. Save 10,000 Stubbed Toes? => Save the Arm? (Pairwise clear, B holds weakly).
          *N+1.* Save 10,000 Stubbed Toes vs. Save 10,001 Stubbed Toes? => Save the 10,001 (Pairwise clear).
      *   **The Problem:** Transitivity (C) demands that if we must save the Death over the Arm (Case 2), and the Arm over 10,000 Toes (Case N), then we must save the Death over 10,000 Toes. But the purist pairwise view (A), applied directly to "Death vs. 10,000 Toes", *cannot* justify saving the Death without violating (B). The one death complaint isn't *individually* stronger than any one stubbed toe complaint in a way that justifies vetoing saving the 10,000 toes *for that death-threatened person's own sake*. The pairwise view (A) forces a coin flip (or perhaps saving the toes, depending on slight harm variations) in Death-vs-Many-Toes, violating the transitivity chain and (B). Conversely, insisting on (B) (Death > Vast Toes) requires a justification that *cannot* be distributive/pairwise (A) – it requires the collective weighing the balancers endorse. **A formal proof showing the incompatibility of (A), (B), and (C) would indeed be a sledgehammer to the debate. It forces a choice: abandon strict pairwise distributivity (A), accept that vast trivial harms *can* outweigh one death (abandon B), or accept intransitivity (abandon C – Taurek's bullet).**

  **Diagnosis & The Real Crux:**

  *   **Substantive Core:** The disagreement is profoundly substantive, about the **nature of the justificatory constraint itself**. Is reasonable rejection fundamentally an *individual, distributive* power based on the strength of *one's own* complaint relative to alternatives *for oneself*? Or is it a *collective, deliberative* process where each person must assess the *totality* of complaints to find the overall acceptable principle? **This is the bedrock.**
  *   **Verbal Layer:** The term "aggregation" is a red herring masking this deeper split. It's a symptom, not the disease.
  *   **Confusion?** Is "justifiable to each person one at a time" ill-posed? Not ill-posed, but **radically ambiguous** between the distributive and collective interpretations. The purists insist it *must* mean the distributive sense to respect persons. The balancers argue that the collective sense *still* respects persons by requiring their complaint be given weight *within* a process aimed at finding principles acceptable *to them* given the full moral landscape. They see the distributive sense as *failing* respect by ignoring the moral relevance of others' complaints *to the individual's own deliberation* about reasonable rejection.

  **What Counts as Progress:**

  1.  **Acknowledge the Formal Constraint:** Circulating/discussing a clear exposition of the impossibility argument (linking A, B, C) is the single most productive step. It shifts focus from intuitions about cases to the *structural constraints* on any solution. It forces factions to choose which horn of the trilemma they grasp: Purists must embrace intransitivity or bite Taurek's bullet fully; Balancers must explicitly abandon strict pairwise distributivity; Defectors have their point vindicated formally.
  2.  **Reframe the Question:** Stop asking "Does contractualism aggregate?" or "Who wins this case?". Start asking: "**Can reasonable rejection ever depend on the* number *of others who would complain under an alternative, and if so, how does that respect the 'to each' constraint without summing?**" or "**Does respecting Alf as a separate person require that his complaint's force in justifying his veto depends *only* on its inherent strength and the alternative *for him*, or can it legitimately depend on how many others share similar complaints against the alternative that would save him?**"
  3.  **Distinction:** Sharply distinguish the **Grounds of Complaint** (individual experience of harm) from the **Structure of Justification** (how those complaints interact in the test of reasonable rejection). Emphasise that the balancers are *not* summing grounds (ignoring separateness) but proposing a specific structure for how distinct grounds interact within justification *to* each.
  4.  **Why Nothing Else?** More cases just get slotted into pre-existing frameworks. Re-explaining the rescue case is futile. Reading lists won't resolve the structural ambiguity at the heart of the theory. The debate is stalled because the sides are defending different conceptions of the foundational justificatory act.

  **In short:** Your group is arguing past each other because you've hit the fundamental ambiguity in "justifiable to each person". The purists defend a distributive, pairwise interpretation as essential. The balancers defend a collective, holistic interpretation as necessary. The impossibility of satisfying transitivity, anti-aggregation, *and* strict pairwise justification is the skeleton key. Progress requires confronting that formal constraint head-on and deciding which element of the triad contractualism must sacrifice. Until then, it's distributive versus collective justification locked in an irresolvable clash of visions. Good luck with the tutor – "maths" not "math", "prioritise" not "prioritize", etc.
