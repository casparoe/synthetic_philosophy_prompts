  so i'm a third year taking a philosophy of art course, and separately i help run this slightly unhinged reading group that's about half philosophy students and half people from the conservation and museum-studies program who physically handle objects for a living — one of them is an apprentice paintings conservator and she gets very defensive when we talk about this stuff. next week it's my turn to open the session on fakes and forgeries, and instead of doing a talk i want to hand round a decision tree: "where do you actually stand on authenticity?" You answer a bunch of case questions and end up at a named view. Can you build that for me? I'm thinking six to eight branch nodes bottoming out in maybe eight to twelve leaves, and the whole thing has to fit on one page because it's a handout, so keep each node's question short.

  The rule for the nodes is that every one of them has to be a question you can answer from a concrete case without already knowing which view it's steering you to. So nothing like "do you think a forgery can be aesthetically good?" — that just asks people to pick a label, and half the room will pick whatever sounds sophisticated. Give me the cases at each node instead. And I want it built out of the logical space first, not out of a list of philosophers: what are the real axes here (does the history of how a thing was made change what's there to be seen in it? does it matter whether the deception was intended, or only that it happened? does a forgery get worse, get better, or stay exactly the same once it's been exposed? is the value located in the achievement or in the experience of the viewer?), then slot the actual positions into the cells afterwards. Tell me which cells come out empty and why — is nobody there because the view is incoherent, because it's unfashionable, or because nobody's bothered yet.

  There's a few cases I definitely want in there because they're the ones that'll split my room. (1) A painting has hung in a museum for sixty years labelled "copy after X"; new pigment analysis suggests it's actually by X's own hand; nothing about the object was touched, but visitor comments and the insurance value both change overnight. (2) A conservator fills and repaints a loss so it's invisible from three feet away but legible under raking light, and uses materials designed to be removable later — is that object more or less authentic than a brand-new honest copy of the entire painting made with period technique? (3) Assistants did most of the work, the master signed it, it sold as a master work in 1650 and sells as one now. (4) Someone paints a lost composition by a dead master in period technique, signs their own name on the reverse, and markets it openly as a reconstruction — and it's genuinely lovely. (5) The same thing but produced by an AI trained only on that master's corpus and disclosed as AI. (6) The classic exposed-forger case, the van Meegeren Vermeers, where the object in front of you is bit for bit the same as it was when you thought it was a masterpiece.

