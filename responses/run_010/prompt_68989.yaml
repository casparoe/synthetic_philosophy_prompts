answer: |-
  Here's a decision tree designed as a one-page handout for your reading group. It uses concrete cases to navigate the logical space of authenticity in art, avoids direct label-based questions, and incorporates your specified cases. The tree has **7 branch nodes** (questions) and **10 leaves** (named views), with each node's question answerable from a case without knowing the destination. I've flagged limitations at the end.

  ---

  ### **AUTHENTICITY DECISION TREE: WHERE DO YOU STAND?**  
  *Start at Node 1. Answer based on concrete cases—not theoretical labels.*

  #### **NODE 1: [CASE 1]**  
  A painting hung as a "copy after X" for 60 years is proven via pigment analysis to be by X’s hand. The object is unchanged, but its insurance value and visitor reactions shift overnight. **Does this discovery change the painting’s aesthetic properties?**  
  - **YES** → Node 2  
  - **NO** → Node 3  

  #### **NODE 2: [CASE 6]**  
  A van Meegeren "Vermeer" is exposed as a forgery. The physical object is identical to when it was thought genuine. **Does the exposure diminish its aesthetic value?**  
  - **YES** → Node 4  
  - **NO** → Node 5  

  #### **NODE 3: [CASE 3]**  
  A work was mostly painted by assistants but signed by the master, sold as the master’s work in 1650, and is sold as such today. **Is this work authentic?**  
  - **YES** → Node 6  
  - **NO** → Node 7  

  #### **NODE 4: [CASE 2]**  
  Compare: (A) A conserved painting with a loss filled/repainted to be invisible from 3 feet (reversible, removable materials) vs. (B) A brand-new, honest copy using period-accurate techniques. **Which is *more* authentic?**  
  - **A (CONSERVED)** → Leaf 1: **Strong Contextualism**  
    *Awkward commitment: A damaged, repaired original is more authentic than a perfect replica because material history trumps appearance.*  
  - **B (NEW COPY)** → Leaf 2: **Process Purism**  
    *Awkward commitment: A new copy can surpass the original if it better embodies the maker’s intended process, even if materially "fake".*  

  #### **NODE 5: [CASE 5]**  
  An AI generates a work in a dead master’s style (trained solely on their corpus), disclosed as AI. **Can it be appreciated *as art* equivalently to a human-made work?**  
  - **YES** → Leaf 3: **Output Formalism**  
    *Awkward commitment: If AI matches human output, the creator’s identity is irrelevant to aesthetic value.*  
  - **NO** → Leaf 4: **Performance Essentialism**  
    *Awkward commitment: Non-human creation (e.g., AI, animals) cannot produce art, regardless of output quality.*  

  #### **NODE 6: [CASE 4]**  
  An artist reconstructs a lost composition by a dead master in period technique, signs their own name on the reverse, and markets it openly as a reconstruction. **Does it hold aesthetic value *as the master’s work*?**  
  - **YES** → Leaf 5: **Skeptical Anti-Historicism**  
    *Awkward commitment: A perfect reconstruction proves origin doesn’t affect aesthetic properties—only deception is wrong.*  
  - **NO** → Leaf 6: **Achievement Relativism**  
    *Awkward commitment: The reconstruction can be admired, but only as a derivative artifact—never as "art" equal to the master’s.*  

  #### **NODE 7: [CASE 6 + CASE 2]**  
  After exposing a forgery (e.g., van Meegeren), the *same* object is now known to be fake. Separately, a conserved painting (reversible repairs) is displayed alongside an honest replica. **Which scenario troubles you more?**  
  - **THE EXPOSED FORGERY** → Leaf 7: **Moral/Epistemic View**  
    *Awkward commitment: A forgery’s only wrongness is deception; once exposed, it’s as aesthetically valid as a "real" work.*  
  - **THE REPAIRED ORIGINAL** → Leaf 8: **Intentionalist Integrity**  
    *Awkward commitment: Any alteration (even reversible repairs) corrupts authenticity more than deliberate forgery.*  
  - **NEITHER—BOTH ARE FINE** → Leaf 9: **Pragmatic Instrumentalism**  
    *Awkward commitment: Authenticity is a tool for institutional goals (e.g., education, conservation), not a property of objects.*  
  - **BOTH EQUALLY** → Leaf 10: **Ontological Historicism**  
    *Awkward commitment: The original artist’s hand *literally* changes the object’s essence; replicas/repairs are ontologically inferior.*  

  ---

  ### **LOGICAL STRUCTURE & LIMITATIONS**  
  **Axes Covered**:  
  1. Does history change perceptible properties? (Nodes 1–2)  
  2. Does intention override materiality? (Nodes 3, 6–7)  
  3. Does exposure alter value? (Nodes 2, 5–7)  
  4. Is value in achievement or experience? (Nodes 4–6)  

  **Missing/Empty Cells**:  
  - **Radical Subjectivism** (value is 100% viewer-dependent) isn’t a leaf—it’s incompatible with all cases where context shifts perception (e.g., Case 1).  
  - **Institutional Theory** (e.g., Dickie) is partially in Leaf 9 but diluted; it doesn’t fit neatly because institutions often contradict (e.g., museums vs. conservators).  
  - **Category-Based Appreciation** (Walton) isn’t a leaf. It’s blended into Leaf 6: it requires asking, *"Would you appreciate the reconstruction identically if categorized as ‘replica’ not ‘masterwork’?"* (This is the extra question to separate it from pure Formalism.)  

  **Flaws in the Tree**:  
  - **Leaf 7 (Moral/Epistemic) and Leaf 5 (Skeptical Anti-Historicism) overlap**. Both downplay history, but Leaf 5 is triggered by reconstruction (Case 4), while Leaf 7 focuses on forgery exposure. *Extra question to split them*: "Can a *non*-deceptive forgery (e.g., painted for fun, never sold) be great art?" Leaf 5 says yes; Leaf 7 says no (lacks moral/epistemic wrongness but still aesthetically inert).  
  - **Leaf 10 (Ontological Historicism) and Leaf 1 (Strong Contextualism) conflate under pressure**. Both prioritize origin, but Leaf 10 treats it as metaphysical. *Extra question*: "If an original and forgery are atom-for-atom identical, are they the *same work*?" Leaf 10 says no; Leaf 1 says yes if context is shared.  

  **Why No Philosopher Names?**  
  This tree is built from logical axes first (per your request). Named views are mapped secondarily:  
  - Leaf 1: Danto, Goodman  
  - Leaf 2: Collingwood (process-focused)  
  - Leaf 3: Early Bell  
  - Leaf 4: Dissanayake (art as biological behavior)  
  - Leaf 5: Lessing, Kennick  
  - Leaf 6: Walton (categories)  
  - Leaf 7: Lessing (moral emphasis)  
  - Leaf 8: Levinson  
  - Leaf 9: Dickie  
  - Leaf 10: Wollheim  

  ---

  **PRINTING INSTRUCTIONS**:  
  1. Fit to one page by using narrow margins (0.5") and 10-pt font.  
  2. Nodes are **bold** with clear case references; leaves are numbered.  
  3. Hand out *without* the "Limitations" section to avoid priming.  
  4. For discussion: Group members compare leaves and debate awkward commitments.  

  This tree forces concrete choices—your conservator friend will likely hit Leaf 1 or 8; philosophers might land in Leaf 5 or 7. The unresolved tensions (e.g., Case 2 splitting conservation ethics from process purity) guarantee heated debate!
