prompt: |-
  I've been trying to pin down when I think "we don't know enough yet, so don't do it" is actually a good argument rather than a mood, going purely by gut on cases. Here's the pile.

  Banning neonicotinoid seed coatings on thin but real evidence of pollinator collapse: restraint was right, even though farmers lost yield and the evidence was genuinely contested. Banning a common preservative because of a viral claim that it causes headaches: restraint was wrong, leave it on the market. Those two look structurally identical to me — diffuse harm, weak evidence, loud campaign, cheap-ish compliance — and the only difference I can name is that I trust the ecologists and not the wellness accounts, which is a fact about my priors and not about the risk. Its basically tribal and I don't like admitting it.

  Acting early on the CFC/ozone signal was right. But if we'd frozen recombinant DNA work in the mid-70s pending certainty about escaped engineered bacteria, we'd have lost recombinant insulin and the hepatitis B vaccine, and I think that freeze would have been wrong — even though the shape is nearly the same: brand new technique, global scale, potentially irreversible harm, evidence thin at the time.

  Delaying a malaria vaccine over a rare adverse-event signal cost lives and was wrong. Delaying a sleeping pill over a rare cardiac signal was right.

  Stratospheric aerosol injection: I'd happily fund the modeling and even a small balloon release, but I think committing to an actual deployment program is a trap — mostly because whoever ends up holding the thermostat can't be disarmed later, and because a sudden stop would be worse than the warming it was replacing.

  New nuclear: in a country with a regulator that actually works, building now is close to obligatory. In a country without one, I'd say no, even though the emissions arithmetic is exactly the same. So capacity seems to be doing real work in my verdicts and I don't know where to put it.

  Gene drive to suppress malaria mosquitoes: contained island trial, yes; open continental release, no. I can't say why the line sits where it sits.

  Moratorium on making flu strains more transmissible in the lab: yes. Which surprises me, because I've just spent this whole list saying that waiting for more evidence is usually a bad argument.

  My tentative principle, which I know is broken: restraint is justified only when the harm would be slow or impossible to undo, when someone can be named as having caused it, and when the people exposed didn't opt in. Three knobs. It handles the gene drive split (nobody downwind opted in) and maybe the preservative case, and it falls apart completely on climate change, where nobody is nameable and everybody is exposed — and where the same three knobs would forbid both emitting and geoengineering, which is obviously not a usable verdict.

  What I want is the principle, or a small set of candidate principles, that best fits this pile. State each clause precisely and tell me which case above forced you to add it — I want to see the clause-to-case mapping, not a general essay on uncertainty. Then tell me what it says about two or three cases I haven't listed, ideally ones where it lands somewhere uncomfortable. Then tell me honestly which of my verdicts it can't save and has to overturn, and why overturning that verdict beats buying an extra clause to keep it. If one of my verdicts is just bias wearing a principle's clothes, say which one.

  And there's a worry I can't shake: maybe any principle of this shape is only a relabeling. "Restrain when expected harm exceeds threshold t" is a decision rule everyone already has, so all the interesting content lives in the priors and the discounting — which is exactly where my neonics-versus-preservative split actually lives. So say whether you think a principle like the one you build has non-trivial content over and above ordinary expected-harm reasoning, or whether it's mostly decoration with a nice vocabulary.

  Last thing: tell me how confident you are in the main claims you're making, and single out the one point in your answer you're least sure of. I'd rather have a flagged weak link than a uniformly confident writeup.
reasoning: |-
  Okay, let me unpack this user's query. They're struggling to find a consistent principle for when "we don't know enough, don't act" is valid versus when it's excessive caution. They've listed several cases where their gut says restraint was right or wrong, but they can't find a unifying logic beyond tribal priors. The examples range from pesticides to gene drives to geoengineering.

  Hmm, the core tension seems to be between irreversible harm and lost opportunity costs. Like with neonics (restraint good) vs preservatives (restraint bad) - same surface features but different outcomes because ecological collapse is harder to reverse than reformulating cosmetics. And that recombinant DNA example is sharp: freezing it would've cost lives via missed medical advances, even though the risks seemed similar to CFCs at the time.

  Their proposed principle (restraint only for irreversible, attributable, non-consensual harm) is clever but fails on climate change where it forbids both action and inaction. That's a fatal flaw. They're right to suspect their neonics/preservative split is just priors - ecologists vs wellness influencers is totally a credibility call.

  What they really want is a structured way to avoid hypocrisy. The clause-to-case mapping request shows they want to see the gears turning, not get a philosophy lecture. And that meta-worry about principles being relabeled expected utility is deep - if it's all just priors and discount rates, maybe no principled distinction exists.

  I should build principles that handle: 
  - Reversibility (gene drive containment) 
  - Attribution capacity (nuclear regulation) 
  - Avoided harm urgency (malaria vaccine delay) 
  While admitting where tribal priors unavoidably creep in (neonics). 

  The confidence disclaimer at the end is key - they'd rather see flagged uncertainties than false coherence. Like how "irreversibility" gets fuzzy with geoengineering's path dependency. And I must overturn some verdicts (sleeping pill delay?) to show the principle isn't just rubber-stamping their biases.
answer: |-
  Here's a principled framework derived from your cases, built clause-by-clause, with explicit mappings. It prioritizes tractability and avoids relying solely on expected harm thresholds by focusing on structural features of the decision.

  ### The Principles
  1.  **Restrain if harm is plausibly irreversible or massively path-dependent.**  
      *Case Forcing It:* **Stratospheric aerosol injection.** Deployment creates a "thermostat trap" where stopping causes catastrophic rebound ("sudden stop worse than warming"). Path-dependence (institutional lock-in, technological reliance) is central.  
      *Also Explains:* Gene drive continental release (irreversible ecosystem change), CFCs (ozone depletion irreversible on human timescales), nuclear in weak-regulator countries (irreversible contamination legacy).

  2.  **Restrain if harm attribution is impossible or prohibitively costly.**  
      *Case Forcing It:* **Neonicotinoids vs. Preservative.** The key structural difference isn't just your priors, but *attribution capacity*. Pollinator collapse involves complex systems where linking cause (neonics) to diffuse harm (colony collapse) across actors is extremely hard. A preservative's alleged headaches are *individually* attributable (did *your* headache stop when you switched products?). Loud campaigns matter less than whether blame/liability can be assigned.  
      *Also Explains:* Climate change emissions (global, non-attributable harm forbids emitting), Geoengineering (non-attributable harm forbids deployment? See Principle 4). Gene drive continental release (impossible to attribute downstream ecological shifts).

  3.  **Restrain if action precludes future options disproportionately.**  
      *Case Forcing It:* **Recombinant DNA Moratorium (Hypothetical Freeze).** Freezing the tech in the 70s wouldn't just delay benefits; it risked *killing the field entirely* (lost expertise, funding, momentum), preventing future options like insulin/HepB vaccine. This outweighs the "thin evidence" parallel to CFCs.  
      *Also Explains:* Nuclear in strong-regulator countries (building *preserves* the option for future decarbonization; not building precludes it). Malaria vaccine delay (cost lives *and* delayed future vaccine development/trust).

  4.  **Override Restraint if inaction imposes large, certain, and immediate costs on identifiable, non-consenting populations.**  
      *Case Forcing It:* **Malaria Vaccine Delay vs. Sleeping Pill Delay.** Delaying the malaria vaccine imposed large, certain, immediate death tolls on identifiable populations (children in malaria zones) who couldn't consent to the risk of delay. The sleeping pill risk (cardiac events) was diffuse, less immediately catastrophic, and users had alternatives/consented to medication risk.  
      *Also Explains:* Recombinant DNA (inaction = denying identifiable diabetics life-saving insulin). Climate Geoengineering? *Might* override Principle 2 if impacts on vulnerable populations become catastrophic and immediate enough. Neonics? Farmers' yield loss is identifiable/costly, but less *immediately catastrophic* than Principle 4 demands.

  ### How it Handles Your Cases
  *   **Neonics (Restraint Right):** Principles 1 (plausibly irreversible ecosystem harm) & 2 (extremely difficult attribution).
  *   **Preservative (Restraint Wrong):** Principle 2 fails (attribution *is* possible individually). No other principle strongly applies. Principle 4 doesn't override (harm not large/certain/immediate enough).
  *   **CFCs (Act Early Right):** Principle 1 (irreversible harm).
  *   **Recombinant DNA Freeze (Wrong):** Principle 3 (freeze precludes future options) & Principle 4 (inaction denies insulin to identifiable diabetics).
  *   **Malaria Vaccine Delay (Wrong):** Principle 4 (inaction caused large, immediate, certain deaths to identifiable non-consenting group).
  *   **Sleeping Pill Delay (Right):** Principle 4 doesn't override (harm less certain/immediate/catastrophic; users consent to medication risks; alternatives exist). Restraint justified by precaution re: diffuse harm.
  *   **Stratospheric Aerosols (Deployment Restraint):** Principle 1 (massive path-dependence/irreversibility of the "trap") & Principle 2 (attribution nightmare for regional climate shifts).
  *   **New Nuclear (Strong Regulator: Build; Weak: Restrain):** Principle 1 (Irreversible contamination risk in weak-regulator countries justifies restraint) & Principle 3 (Building in strong-regulator countries preserves decarbonization options; not building precludes them).
  *   **Gene Drive (Island: Go; Continental: No):** Principle 1 (Continent: Irreversible ecosystem change) & Principle 2 (Continent: Impossible attribution of downstream effects). Island trial minimizes these.
  *   **Gain-of-Function Flu Moratorium (Restraint Right):** Principles 1 (Pandemic risk is potentially irreversible/civilization-scale) & 2 (Attribution of an accidental release would be impossible/meaningless post-outbreak).

  ### Uncomfortable Applications
  1.  **Commercial Deep-Sea Mining:**  
      *Restrain?* **Yes (Strongly).** Principles 1 (Irreversible destruction of unique, poorly understood ecosystems), 2 (Impossible to attribute specific biodiversity loss to specific actors/operations), 3 (Mining now precludes future options for discovery/sustainable use). Principle 4 is weak (no large, *immediate*, *identifiable* population harmed by *delay*). Uncomfortable because critical minerals are needed for the energy transition.
  2.  **Deploying Advanced AI for Military Targeting:**  
      *Restrain?* **Yes.** Principles 1 (Path-dependence towards autonomous warfare, irreversibly lowering barriers to conflict), 2 (Attribution failures could trigger escalation, "flash wars"), 3 (Deployment precludes options for arms control treaties). Principle 4 might be argued (saving soldiers' lives) but the scale/attribution risks likely override. Uncomfortable due to potential tactical advantages.
  3.  **Emergency Use of an Untested Pandemic Vaccine:**  
      *Restrain?* **Likely No (Deploy).** Principle 4 overrides: Inaction causes large, immediate, certain deaths in identifiable non-consenting populations. Principles 1 & 2 (long-term side effects, attribution issues) exist but are outweighed by the scale/immediacy of the harm of inaction. Uncomfortable due to genuine unknown risks.

  ### Overturned Verdicts & Why
  *   **Your Sleeping Pill Delay Verdict (You said Right):** **Overturned to Wrong?** *If* the cardiac risk was very rare and alternatives were limited/ineffective for severe insomnia sufferers, Principle 4 *could* override restraint. Delay imposes large, immediate, identifiable harm (crippling insomnia, accidents, health decline) on a non-consenting population (patients denied effective treatment). Your verdict might have overweighted the rarity compared to the certainty/immediacy of harm from delay for severe sufferers. Overturning this avoids adding a "rarity threshold" clause, keeping the framework focused on the *structure* of harm imposition. Principle 4 already handles the key difference vs. Malaria vaccine: scale/certainty of harm *from inaction*.
  *   **Your Climate Change Knob Problem:** Solved. Emitting: Restrained by Principles 1 (Irreversible harm) & 2 (Non-attributable harm). Geoengineering: *Also* Restrained by Principles 1 (Path-dependence trap) & 2 (Non-attributable harm). **Both are forbidden under restraint.** This *is* uncomfortable but coherent. The framework forces a focus on *other solutions* (mitigation, adaptation) that don't trigger these restraints, or a desperate, Principle 4-based override for geoengineering if impacts become catastrophic/immediate enough for identifiable populations.

  ### Is it Just Relabeling Expected Harm?
  **No, it adds non-trivial structure.** Expected harm (Probability * Magnitude) is the *engine*, but these principles act as **filters and amplifiers** based on *how* harm manifests:
  1.  **Irreversibility/Path-Dependence (Principle 1):** Amplifies the *effective magnitude* of low-probability harms (e.g., geoengineering trap, gene drive escape). It forces consideration of option value and lock-in beyond immediate impacts.
  2.  **Attribution Difficulty (Principle 2):** Increases the *effective probability* of harm occurring *without accountability or correction*. It addresses market/governance failures where diffuse harms are systematically under-priced.
  3.  **Option Preclusion (Principle 3):** Captures long-term opportunity costs that pure discounting often obscures. It protects future flexibility as a value.
  4.  **Imposed Inaction Costs (Principle 4):** Explicitly counterweights the precautionary impulse by prioritizing urgent, identifiable suffering. It prevents restraint from becoming passive harm.

  These structural features modify how expected harm should be calculated and acted upon, providing concrete criteria beyond subjective priors. Your neonics/preservative split *is* primarily about priors *within* Principle 2 (attribution capacity assessment), but the principle itself highlights *why* that assessment matters structurally.

  ### Confidence & Weakest Link
  *   **Overall Confidence:** Moderately High (80%) on the framework's ability to map your cases and provide distinct guidance. It resolves tensions (climate knobs, gene drive split) and explains inconsistencies (neonics vs. preservative).
  *   **Weakest Link:** **Principle 4 ("Override Restraint...").** I'm least sure (60%) about its precise boundaries. What constitutes "large, certain, and immediate" enough? How identifiable must the population be? This clause is most vulnerable to subjective interpretation and could be misused to justify reckless action. The sleeping pill example highlights the fuzziness. Refining this definition is key, perhaps requiring *both* catastrophic scale *and* identifiability *and* lack of alternatives *and* non-consent to the *delay* itself. This needs the most work.
