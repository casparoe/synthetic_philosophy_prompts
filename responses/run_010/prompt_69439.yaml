answer: |-
  **Movement 1**  
  Good morning, and happy 110th birthday to this extraordinary club. Today, we replace our 1970s rulebook – a document held together by goodwill and sticky tape – with something fit for our next century. As outgoing secretary, I’m proud of this collective achievement. But I won’t sugarcoat the first test: a motion to forever ban selling the boathouse, using the new rule that lets us change anything by two-thirds vote. Let’s settle whether that’s valid, clearly and now.

  **Movement 2**  
  Here’s the puzzle: the rule we’re using to make this change vanishes if the motion passes. Does that invalidate the vote? No. At the precise moment we vote, that rule is alive and working – it empowers us. You can’t undo an act by later destroying the tool that enabled it. Think of it like using a hammer to build a shelf that holds the hammer: the shelf stands even if the hammer’s in the drawer. The vote happens under the rules as they are *then*, not as they might be.

  **Movement 3**  
  And yes, later generations *can* undo this. The motion tries to entrench "no sale" forever, but the rulebook it leaves behind still says every part of it is changeable by two-thirds. There’s no magic forcefield – that surviving amendment rule applies to *everything*, including this new "no sale" clause. So if 67 of you someday want to sell the boathouse? You’ll debate it soberly, vote fairly, and the rules will allow it. Saturday’s motion isn’t a dead end; it’s a firm, reversible decision.

  **Movement 4**  
  To our retired lawyer: yes, Germany’s constitution has unamendable bits. But we’re a rowing club, not a nation-state. Our rules rest on consent, not courts or armies. If we tried to lock something away beyond reach, we’d tie future hands unfairly – and frankly, we’d probably just argue about what "forever" meant until the tide went out. Simpler to trust ourselves: two-thirds today, two-thirds tomorrow. That’s democracy with oars.

  **Movement 5**  
  So the motion is valid – vote with confidence. But remember: rules matter because we honour them, not because they’re carved in stone. This boathouse is our heart because we row together, sweat together, win and lose together. So let’s get this voted on, then get back to what we love: boats, water, and each other. Now, who’s ready to make some history?
