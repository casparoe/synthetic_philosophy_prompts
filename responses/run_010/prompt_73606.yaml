  Okay, let me try to unpack this user's situation. They're in a nine-day argument with their wife that started because she technically told the truth but omitted important details about her job search. The user is now diving into medieval theology at 1am trying to understand why this feels like a violation. 

  Hmm, the core issue seems to be about the nature of deception. The wife claims she didn't lie since her statement was literally true, while the user feels misled. Aquinas' material/formal distinction might help clarify this. The material aspect is about factual accuracy - her words were true. The formal aspect concerns intent - she avoided saying anything false while knowing it would create a false impression.

  That heavy rock analogy is tricky. Aquinas is saying deception is like the natural consequence of lying, just like falling is the natural consequence of gravity. But just as you can prevent a rock from falling, you can tell a literal truth that still deceives. The "species" of lying exists when you say something false intentionally, while deception is the "perfection" - the full realization of that lie.

  The most confusing part is that last quote about telling truth while intending falsehood. Imagine someone says "It's sunny today" when it's actually raining, but they mistakenly believe it's sunny. They intended to lie but accidentally told truth. Conversely, the wife told truth but knew it would mislead. Aquinas would say the accidental truth-teller is worse morally because their will was corrupt.

  For the user's situation: technically Aquinas might say the wife didn't formally lie since her words were true. But her action still violated truthfulness as a virtue because she intended to deceive through selective truth. The modern "lying vs misleading" debate actually maps surprisingly well to Aquinas' framework. 

  The real pain point here isn't philosophy though - it's broken trust in the marriage. The user needs to understand why the "true-but-tilted" answer hurts: because marriage requires full transparency, not legalistic truth-mining. Maybe instead of debating medieval semantics, they should discuss why she felt the need to be evasive in the first place.
