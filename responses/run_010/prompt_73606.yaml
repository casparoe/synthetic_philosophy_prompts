prompt: |-
  My wife and I are nine days into a fight that started with a single sentence and has somehow turned into me reading medieval theology on my phone at 1am, so please bear with me. Background: I asked her back in March whether she'd had any contact with the recruiter from the Portland office, because I'd noticed her updating her LinkedIn. She said "I haven't sent anything to anyone," which was literally true — she'd had two long phone calls and asked her old manager to forward her resume, but she hadn't personally sent anything. I found out last month. She says she didn't lie, she just didn't volunteer information, and I said that's exactly the move people use when they know they've done something they can't defend. I've since half-conceded that there's a real difference between saying something you believe is false and merely letting someone draw a false conclusion from something true — I've started calling her answer a "true-but-tilted" one, which is my own dumb coinage — but I still can't articulate why the tilted version feels like a violation rather than a technicality. So I went looking for someone who thought about this before the internet, and ended up in the Summa Theologiae, Second Part of the Second Part, question 110 (the one on lying), first article, in that old English Dominican translation that's floating around online. It's from the 1270s and the translation is another century old and I'm completely lost.

  Here's the bit I can't parse. Aquinas writes: "Accordingly if these three things concur, namely, falsehood of what is said, the will to tell a falsehood, and finally the intention to deceive, then there is falsehood—materially, since what is said is false, formally, on account of the will to tell an untruth, and effectively, on account of the will to impart a falsehood." And then a few lines later: "That a person intends to cause another to have a false opinion, by deceiving him, does not belong to the species of lying, but to perfection thereof, even as in the physical order, a thing acquires its species if it has its form, even though the form's effect be lacking; for instance a heavy body which is held up aloft by force, lest it come down in accordance with the exigency of its form." And in the reply to the first objection he says: "Hence it is more in opposition to truth, considered as a moral virtue, to tell the truth with the intention of telling a falsehood than to tell a falsehood with the intention of telling the truth."

  Can you work through this with me? Specifically: what is the material / formal / effective triad actually tracking, and what work is the heavy-body analogy doing (I get that he's borrowing some hylomorphic machinery about form and its natural effect, but I don't see how a rock being held up is supposed to illuminate anything about a sentence). What does he mean by saying the intention to deceive belongs to the "perfection" of a lie rather than its "species" — is that just a scholastic way of saying deception is a nice-to-have extra, or is something stronger going on? And that last quote has me genuinely stuck: how can someone tell the truth while intending to tell a falsehood? Give me a concrete example of what he has in mind there, because I suspect it's doing more work than I'm crediting.

  The thing I most want your read on, so start with that in a paragraph before you go line by line: does this material/formal distinction line up with the modern split between lying and misleading that I half-conceded to my wife, or am I projecting a 2000s-era debate onto a text that's asking a completely different question? My working hypothesis is that his "formal" falsity is basically about the mismatch between what you assert and what's in your head, which would make him an ally of the view that the true-but-tilted answer isn't a lie at all — but then his whole treatment is about the virtue of truthfulness as a disposition, not about hearer's rights or conversational norms, so maybe the mapping is bogus and I should stop trying. Tell me straight if it is. Also, and this matters: don't send me to secondary literature or give me a bibliography, I'm not going to chase any of it down and I can't look anything up right now anyway. Just reason from the passage itself and from what the terminology means. One more thing — please write it all as continuous prose, like an email back to a friend, no headings, no bullet points, no bold, no tables. I've had enough of structured argument for one week.
