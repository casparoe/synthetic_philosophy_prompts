prompt: |-
  For the term paper in my senior philosophy-of-history seminar I have to evaluate the thesis that the arc of history bends toward justice, and what I have found is that the seminar talks past itself because nobody has specified what would count as a successful defense of it rather than an assertion of it. So I would like the specification first, and I would like it written for someone who has to apply it to arguments rather than admire them.

  Please write the desiderata: the list of requirements any account of progressive historical direction must satisfy in order to count as a defense, with the consideration or concrete case motivating each one. Every requirement should be something an account could actually fail — no restatements of the thesis dressed up as criteria. I would like the list consolidated to roughly ten to twelve items, since I have to work with it in a paper of ordinary length.

  Make sure the list engages at least the following, though you should add what I have missed and cut anything below that you judge to be merely local prejudice:

  - the metric: what justice is being tracked, and whether the account owes a reason for choosing that measure (welfare, rights, equality, the condition of the worst off) rather than another, given that the direction of history looks different under each;
  - the baseline: progress relative to what — the past, a counterfactual in which nothing had been attempted, or an ideal approached asymptotically;
  - what I have been calling the ratchet condition: whether an account must explain why gains resist reversal, or only that the level has risen. I suspect most defenses slide between a trend claim and an irreversibility claim, and I want to know whether that distinction earns a place in the desiderata or is an artifact of my framing;
  - endpoint sensitivity: whether a theory whose verdict depends on where one stops the record — vindicated in 1900, refuted by 1945, restored by 1989 — is failing a genuine requirement or merely an unflattering feature;
  - mechanism: whether the account must say what produces the tendency (human agency, institutional and technological structure, a providential plan), and whether a bare statistical tendency with no mechanism may use the word "arc" at all;
  - selection: the available record is the record of the societies that persisted, so what is owed to the possibility that the sample is survivor-biased and that the losses are systematically underrepresented;
  - licensing: whether an adequate account must explain why it does not license either quietism or the treatment of atrocity as midwifery, or whether those are practical corollaries rather than theoretical failures.

  For each requirement, state what meeting it would consist in, and mark which are non-negotiable and which are one camp's commitments wearing a requirement's clothing. I expect "must be compatible with a naturalistic metaphysics" and "must not smuggle in a theodicy" to be the contested ones, and I want you to argue that rather than assume it.

  Then the part I care about most: identify any subset of these desiderata that cannot be jointly satisfied, and explain the incompatibility as precisely as you can. If the list is in fact coherent, say instead which single requirement eliminates the largest number of positions actually on offer. Close with a few sentences each on how the principal families — a dialectical account, a Marxist one, a Kantian account on which the thesis functions as a warranted hope, and a contemporary empirically minded account built on long-run indicators of violence, poverty, and political rights — fare against your list. Do not give me references or a bibliography; I am working from seminar notes and only need your judgment on the criteria.
reasoning: |-
  Okay, the user is working on a term paper about the idea that history bends toward justice. They're frustrated because their seminar discussions are going in circles without clear criteria for what would actually count as a good defense of this thesis. They want a solid list of requirements—around 10-12 items—that any serious account must meet, not just restatements of the thesis. 

  First, I need to unpack their specific concerns. They mentioned several key issues: the metric of justice (how we measure it), the baseline for comparison, whether progress is irreversible, endpoint sensitivity, mechanisms driving change, survivor bias in historical records, and whether the theory avoids justifying complacency or atrocities. They also want me to flag which requirements are truly essential versus which are debatable.

  Hmm, the user is clearly analytical—they're spotting slippery arguments in their seminar ("ratchet condition" sliding, endpoint dependence). They want rigor, not poetry. The phrase "apply it to arguments rather than admire them" tells me they need functional tools, not abstract philosophy. They’re also time-pressed ("paper of ordinary length"), so conciseness is key. 

  For the list, I’ll start with their specified points but tighten them. For example: 
  - **Metric Transparency**: If an account uses "rights" but ignores welfare declines from industrialization, that’s a fail. Must justify the metric choice. 
  - **Non-Cherry-Picking (Endpoint)**: A theory claiming progress up to 1900 but shattered by WWI needs to explain that volatility.  
  - **Licensing Constraint**: If your theory implies the Holocaust was "necessary" for progress, that’s morally toxic—defenses must block such conclusions.  

  The tricky part is the contested requirements. Naturalism vs. theodicy: I’ll argue that smuggling in divine purpose *is* a failure because it dodges empirical scrutiny (e.g., "progress happens because God wills it" explains nothing). But I’ll note that naturalism itself is debated—some theologians might call it bias.  

  For incompatibilities: Survivor Bias Resistance + Irreversibility might clash. If only resilient societies survive (survivor bias), their "irreversible" gains could just reflect that we don’t see collapses. But demanding both could force circular logic.  

  Finally, evaluating the four families:  
  - **Marxism** nails Mechanism but flunks Endpoint Sensitivity (did feudalism *really* need bloody revolutions?).  
  - **Kantian Hope** avoids licensing atrocities but struggles with Metric—hope isn’t proof.  
  - **Empirical Accounts** handle Baseline well (long datasets) but often ignore Survivor Bias (e.g., Pinker’s data assumes stable states).  

  User’s deepest need? Cutting through seminar waffle. They want ammunition to dissect arguments methodically. The list must be airtight enough that if a peer’s defense misses, say, Licensing Constraint, they can call it out cold.  

  *Adjusting tone*: No fluff. Direct. Examples concrete (Holocaust, WWI). Mark non-negotiables boldly ("must" vs. "should"). Save their word count by merging related points (e.g., baseline + counterfactual).  

  *Double-checking*: Did I cover all their bullets? Metric—yes. Baseline—yes. Ratchet, endpoint, mechanism, selection, licensing—all addressed. Added Universality and Naturalism based on their hint about "contested" items. 12 items total. Tight.
answer: |-
  Here is a consolidated list of 12 desiderata for evaluating defenses of the "arc of history bends toward justice" thesis, designed for application to arguments. Each requirement is concrete, falsifiable, motivated by historical or logical considerations, and specifies what meeting it entails. Contested items are marked.

  ### Desiderata for a Defense of the "Arc of History" Thesis

  1.  **Metric Justification**:  
      -   *Requirement*: The account must explicitly define "justice" (e.g., rights, welfare, equality, capabilities) and justify *why this specific metric* is used to track progress, rather than another metric showing a different or opposite trend.  
      -   *Motivation*: Claims look radically different if measured by (e.g.) GDP vs. income equality, civil rights vs. ecological stability. Using GDP alone ignores rising inequality; using rights ignores material deprivation.  
      -   *Meeting it*: Arguing why the chosen metric is fundamental to justice itself or most reliably tracks human flourishing, addressing counter-metrics.  
      -   *Status*: **Non-negotiable**. Without it, the thesis is arbitrary.

  2.  **Baseline Specification**:  
      -   *Requirement*: The account must clearly state the reference point for "progress" (e.g., past conditions, a plausible counterfactual without intervention, an asymptotic ideal).  
      -   *Motivation*: Claiming "better than 1800" is weak if the counterfactual (e.g., sustainable indigenous development) was preferable. Progress toward an ideal may still leave us far from justice.  
      -   *Meeting it*: Explicitly defining the baseline and defending its relevance for assessing *historical direction*.  
      -   *Status*: **Non-negotiable**. Direction implies a starting point.

  3.  **Non-Cherry-Picking (Endpoint Sensitivity)**:  
      -   *Requirement*: The account must not depend on selecting endpoints that artificially confirm the trend. The claimed tendency must be demonstrable across plausible periodizations and resistant to major reversals within the timeframe.  
      -   *Motivation*: The thesis seems plausible in 1900, absurd in 1945, revived in 1989. An account vindicated only by ignoring the 20th century's horrors fails.  
      -   *Meeting it*: Showing the trend persists despite major setbacks (e.g., world wars, genocides, authoritarian resurgences) when viewed long-term, or explaining why setbacks don't negate the underlying tendency.  
      -   *Status*: **Non-negotiable**. A thesis falsified by inconvenient data is invalid.

  4.  **Mechanism Specification**:  
      -   *Requirement*: The account must identify *what causes* the purported tendency towards justice (e.g., learning, technological enablement, struggle, institutional evolution, providential design).  
      -   *Motivation*: A bare statistical claim (e.g., "violence declined") without a driver doesn't constitute an "arc" (implying structure/direction) and offers no insight into sustainability or future prospects.  
      -   *Meeting it*: Describing the causal process linking historical dynamics to increasing justice as defined.  
      -   *Status*: **Non-negotiable for a directional "arc" claim.** A mere trend ≠ a bending arc.

  5.  **Irreversibility/Ratchet Condition**:  
      -   *Requirement*: The account must specify whether the tendency includes *resistance to reversal* of gains and, if so, explain the source of this resistance.  
      -   *Motivation*: Gains in rights or welfare can be rolled back (e.g., Weimar to Nazi Germany, Reconstruction to Jim Crow). Is the "arc" a net upward *trend* despite volatility, or does it imply *secured* gains? Most defenses ambiguously slide between these.  
      -   *Meeting it*: Explicitly stating if irreversibility is claimed and providing a mechanism for it (e.g., institutional entrenchment, cultural shift, technological lock-in).  
      -   *Status*: **Contested but crucial.** A trend claim is weaker than an irreversibility claim; the distinction must be addressed.

  6.  **Survivor Bias Resistance**:  
      -   *Requirement*: The account must address the possibility that the historical record overrepresents "successful" (persistent, dominant) societies and systematically underrepresents paths that led to collapse, erasure, or stagnation, potentially obscuring non-progressive or regressive outcomes.  
      -   *Motivation*: We study Rome, not all the societies it destroyed. Our data comes from states that survived to collect it. Collapsed civilizations (e.g., Rapa Nui, many indigenous societies facing colonization) may represent counter-examples lost to the record.  
      -   *Meeting it*: Acknowledging the bias and arguing why the sample of surviving/dominant societies still reliably indicates a global tendency, or incorporating evidence from lost/defeated societies.  
      -   *Status*: **Non-negotiable.** Ignoring selection bias invalidates inductive claims.

  7.  **Licensing Constraint (Anti-Apologia)**:  
      -   *Requirement*: The account must not logically imply that historical atrocities or suffering were *necessary* for progress or that present/future progress is inevitable, thereby discouraging action or excusing injustice.  
      -   *Motivation*: Defenses risk justifying horrors as "the price of progress" (e.g., colonialism, industrialization's human cost) or fostering quietism ("history will fix it").  
      -   *Meeting it*: Structuring the explanation so that progress results *despite* or *in opposition to* atrocity, not *because* of it, and emphasizing contingency/human agency.  
      -   *Status*: **Non-negotiable.** A theory that licenses complacency or moral abdication fails practically and ethically.

  8.  **Scope Universality**:  
      -   *Requirement*: The tendency must be demonstrable across a sufficiently broad scope (e.g., globally, across major civilizations) and not rely solely on a specific cultural or regional trajectory.  
      -   *Motivation*: Claiming progress based solely on (e.g.) the West since 1750 ignores regress or stagnation elsewhere, or different conceptions of justice. An "arc of history" implies a global tendency.  
      -   *Meeting it*: Providing evidence across diverse societies and time periods, or convincingly arguing why a regional trajectory defines the global arc.  
      -   *Status*: **Contended (often assumed Western-centric), but essential.** A regional trend isn't history's arc.

  9.  **Naturalistic Coherence**:  
      -   *Requirement*: The mechanism must be compatible with a naturalistic understanding of history (i.e., explainable by human action, social forces, material conditions, evolution) without relying on supernatural or teleological forces *as primary causes*.  
      -   *Motivation*: Invoking Providence or inherent cosmic purpose (theodicy) renders the claim non-falsifiable and outside historical/philosophical analysis. It answers "why" with "God/Spirit wills it," not historical mechanisms.  
      -   *Meeting it*: Grounding the mechanism in empirically observable or theoretically sound social, economic, biological, or political dynamics.  
      -   *Status*: **Contested but Non-negotiable for a historical defense.** Supernaturalism terminates causal explanation. *Argument: Historical analysis deals with human actions and their consequences within the material world. Introducing unverifiable transcendent purpose removes the thesis from the realm of historical evidence and argument, making it an article of faith, not a defensible historical claim.*

  10. **Non-Theodicy**:  
      -   *Requirement*: The account must not function primarily as a justification for existing suffering or injustice by framing it as a necessary part of a benevolent plan.  
      -   *Motivation*: Defenses risk becoming "everything happens for a (just) reason," morally obscuring present injustice and suffering. This is distinct from explaining *how* struggle *led* to gains.  
      -   *Meeting it*: Focusing on how gains were *achieved* (often *against* oppressive forces), not on how past suffering was *redeemed* by future justice. Distinguishing causal explanation from moral justification.  
      -   *Status*: **Contested but Non-negotiable.** *Argument: While struggle may be causally linked to progress, morally justifying past suffering as *necessary cost* is dangerous and often empirically false (alternatives might have existed). A historical explanation need not morally vindicate suffering.*

  11. **Agency Compatibility**:  
      -   *Requirement*: The account must be compatible with the meaningful causal efficacy of human agency (individual and collective) in pursuing justice, without reducing agency to mere epiphenomenon of the "arc."  
      -   *Motivation*: Strong deterministic or teleological accounts (e.g., some Marxisms, Providentialism) risk making human action irrelevant or predetermined. This undermines the moral impetus for struggle central to most justice claims.  
      -   *Meeting it*: Showing how human choices, struggles, and institutions are the *means* by which the tendency operates, not just its passive vehicles.  
      -   *Status*: **Crucial for coherence with justice-seeking action.** Not always explicit, but failure undermines the thesis's practical relevance.

  12. **Threshold Definition (Minimal Progress)**:  
      -   *Requirement*: The account must define a non-trivial threshold of justice that has demonstrably been crossed to validate the claim of "bending toward" it. "Progress" relative to a horrific past doesn't necessarily mean bending towards genuine justice.  
      -   *Motivation*: Incremental improvements in (e.g.) reducing chattel slavery to wage slavery, or absolute poverty to severe poverty, might show *a* trend, but not necessarily towards a state recognizably "just."  
      -   *Meeting it*: Articulating a core component of justice (beyond mere reduction of extreme negatives) that shows significant historical advancement.  
      -   *Status*: **Contested (defining justice is hard) but Essential.** Without a threshold, any improvement counts, trivializing the thesis.

  ### Key Incompatibility
  **Survivor Bias Resistance (6) and Strong Irreversibility (5) are difficult to satisfy jointly.**  
  *Explanation:* Survivor bias means our data primarily reflects societies that *didn't* suffer catastrophic reversals or collapse. To claim gains are *irreversible* requires evidence that attempts at reversal *fail*. However, societies that *suffered* catastrophic reversals (e.g., democratic collapses into totalitarianism, civilizational collapse) are precisely the underrepresented cases in the historical record due to survivor bias. Proving irreversibility requires a complete sample, including the "failures," which survivor bias inherently obscures. An account can claim a *net trend* (Survivor Bias addressed by acknowledging the bias but arguing the net data still shows progress) or claim *irreversibility within resilient systems*, but claiming universal irreversibility based on the biased record of survivors is circular: "Gains don't reverse in societies that survive; societies survive because gains don't reverse."

  ### Most Eliminative Requirement
  **Non-Cherry-Picking / Endpoint Sensitivity (3)** eliminates the largest number of popular defenses. Many accounts (especially empirically-minded or Whiggish ones) rely on carefully chosen start/end dates (e.g., post-WWII, post-Enlightenment) and downplay or explain away major 20th-century reversals, genocides, or persistent injustices incompatible with a smooth "arc." Failing (3) is rampant.

  ### Evaluation of Principal Families
  *   **Dialectical (e.g., Hegelian):**  
      *Strengths:* Strong Mechanism (4), sometimes Agency (11), Threshold (12 - defined by freedom realization).  
      *Weaknesses:* Often violates Naturalism (9) & Non-Theodicy (10) (Spirit's cunning), struggles with Endpoint Sensitivity (3) (WWII?), Scope (8) (Eurocentric), Licensing (7) (atrocities as necessary negation), Survivor Bias (6).

  *   **Marxist:**  
      *Strengths:* Strong Mechanism (4), Baseline (2 - modes of production), sometimes Threshold (12 - communism).  
      *Weaknesses:* Endpoint Sensitivity (3) (20th-century "socialist" states), Irreversibility (5) (reversals occur), Survivor Bias (6) (focuses on dominant systems), Licensing (7) (revolutionary violence as midwifery), Agency (11) (can be structurally deterministic).

  *   **Kantian (Warranted Hope):**  
      *Strengths:* Avoids Licensing (7), Compatible with Agency (11), addresses Endpoint (3) via hope over evidence.  
      *Weaknesses:* Fails as a *defense* per se - weak on Mechanism (4), Metric Justification (1) (hope isn't proof), Baseline (2), Survivor Bias (6), Threshold (12). It's a practical posture, not an explanatory account.

  *   **Contemporary Empirical (e.g., Pinker-esque):**  
      *Strengths:* Strong on Metric (1) if defined (e.g., violence), Baseline (2) (long-term data), Endpoint (3) (long timelines).  
      *Weaknesses:* Metric Justification (1) (why violence/welfare *is* justice?), Survivor Bias (6) (ignores lost societies), Irreversibility (5) (assumed, not proven), Scope (8) (often West-centric), Licensing (7) (can downplay ongoing injustice), Mechanism (4) (often descriptive, not causal - "Decline" isn't "Arc"), Threshold (12) (reducing negatives ≠ achieving justice).

  This list provides the critical toolkit you need. Apply each desideratum rigorously to any defense to see where it holds, where it strains, and where it breaks. Good luck with the paper.
