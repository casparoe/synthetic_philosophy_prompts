  ### Candidate Cruxes for the Question on Uncertain Evidence

  1. **Order-dependence in sequential Jeffrey updates**: Demonstrates that updating on two cross-cutting partitions in different orders yields different posteriors, exposing that rigidity (preservation of conditional probabilities given partition cells) is partition-relative and may be disturbed by intervening updates. *Chosen* because it forces computation, reveals the non-commutativity pitfall, and cannot be answered by mere recitation—students must engage with why rigidity fails. (A well-prepared student might still summarize the mechanics but would miss the conceptual implications if they stop there.)

  2. **Rigidity as an empirical assumption vs. normative requirement**: Examines whether rigidity reflects a perceptual idealization or a rational constraint, probing if it can be "helped oneself to" normatively. *Not chosen* as the primary crux because a strong student could address it abstractly without computation, though it will be integrated into part (c).

  3. **Sensor models vs. partition-based updates**: Contrasts Jeffrey conditionalization with modeling evidence via likelihood functions, questioning if the latter avoids order-dependence. *Not chosen* as the main focus because it can be covered summarily in responses to part (c), but it will be included as a defender's response.

  4. **Radical probabilism and old evidence**: Links the absence of credence 1 to avoiding the old-evidence problem, showing Jeffrey updating generalizes Bayesian conditioning. *Chosen* as a secondary element for part (c) because it connects to course themes but is concise enough to include without overburdening the question.

  ### Question: Uncertain Evidence and Sequential Updating (25 marks)

  Manufactured tiles are either high-quality (\(H\)) or low-quality (\(L\)). An inspector initially assigns a prior probability of \(\frac{3}{5}\) to \(H\) and \(\frac{2}{5}\) to \(L\). The inspector conducts two tests in sequence:

  1. **Glaze test**: Partitions outcomes into \(G_1\), \(G_2\), or \(G_3\). Conditional probabilities given quality are:  
     - If \(H\): \(P(G_1|H) = \frac{1}{2}\), \(P(G_2|H) = \frac{3}{10}\), \(P(G_3|H) = \frac{1}{5}\).  
     - If \(L\): \(P(G_1|L) = \frac{1}{5}\), \(P(G_2|L) = \frac{1}{2}\), \(P(G_3|L) = \frac{3}{10}\).  

  2. **Relief test**: Partitions outcomes into \(R_1\) or \(R_2\). Conditional probabilities given quality are:  
     - If \(H\): \(P(R_1|H) = \frac{7}{10}\), \(P(R_2|H) = \frac{3}{10}\).  
     - If \(L\): \(P(R_1|L) = \frac{3}{10}\), \(P(R_2|L) = \frac{7}{10}\).  

  The inspector receives uncertain evidence from each test. After the glaze test, their new probability distribution over glaze outcomes is \(Q_g(G_1) = \frac{2}{5}\), \(Q_g(G_2) = \frac{3}{10}\), \(Q_g(G_3) = \frac{3}{10}\). After the relief test, their new distribution over relief outcomes is \(Q_r(R_1) = \frac{3}{5}\), \(Q_r(R_2) = \frac{2}{5}\).  

  The inspector updates using Jeffrey conditionalization, assuming rigidity relative to the partition being updated. This means:  
  - When updating on the glaze partition, \(P_{\text{new}}(-|G_i) = P_{\text{old}}(-|G_i)\) for \(i = 1, 2, 3\).  
  - When updating on the relief partition, \(P_{\text{new}}(-|R_j) = P_{\text{old}}(-|R_j)\) for \(j = 1, 2\).  

  **(a)** [10 marks] Compute the inspector’s posterior probability for \(H\) after both updates, in the order: *first glaze, then relief*. Show your working.  

  **(b)** [10 marks] Compute the inspector’s posterior probability for \(H\) after both updates, in the order: *first relief, then glaze*. Show your working.  

  **(c)** [5 marks] The results in (a) and (b) differ. Explain why this difference arises, and discuss what it reveals about Jeffrey conditionalization as a diachronic norm of rationality. In your discussion, address:  
  - What the rigidity condition assumes and why it may not hold after an intervening update.  
  - How a defender of Jeffrey conditionalization might respond to this order-dependence (e.g., by restricting update sequences, arguing for different total evidence, or using sensor models).  
  - Briefly, how the radical probabilist view that no credence is ever exactly one might bear on this issue.  

  ---

  ### Verification of Setup  
  - **Partitions**: Glaze outcomes \(\{G_1, G_2, G_3\}\) and relief outcomes \(\{R_1, R_2\}\) are each exhaustive and mutually exclusive (sum of conditionals = 1 for each quality).  
  - **Conditionalization**: Well-defined as all conditionals and priors are valid probabilities.  
  - **Order-dependence**: Confirmed below.  

  **Prior probabilities**:  
  \[
  P(H) = \frac{3}{5}, \quad P(L) = \frac{2}{5}.
  \]

  **Prior marginals for partitions**:  
  \[
  P(G_1) = P(G_1|H)P(H) + P(G_1|L)P(L) = \left(\frac{1}{2}\right)\left(\frac{3}{5}\right) + \left(\frac{1}{5}\right)\left(\frac{2}{5}\right) = \frac{3}{10} + \frac{2}{25} = \frac{15}{50} + \frac{4}{50} = \frac{19}{50}.
  \]
  \[
  P(G_2) = \left(\frac{3}{10}\right)\left(\frac{3}{5}\right) + \left(\frac{1}{2}\right)\left(\frac{2}{5}\right) = \frac{9}{50} + \frac{10}{50} = \frac{19}{50}, \quad P(G_3) = \left(\frac{1}{5}\right)\left(\frac{3}{5}\right) + \left(\frac{3}{10}\right)\left(\frac{2}{5}\right) = \frac{3}{25} + \frac{6}{50} = \frac{6}{50} + \frac{6}{50} = \frac{12}{50} = \frac{6}{25}.
  \]
  \[
  P(R_1) = \left(\frac{7}{10}\right)\left(\frac{3}{5}\right) + \left(\frac{3}{10}\right)\left(\frac{2}{5}\right) = \frac{21}{50} + \frac{6}{50} = \frac{27}{50}, \quad P(R_2) = \left(\frac{3}{10}\right)\left(\frac{3}{5}\right) + \left(\frac{7}{10}\right)\left(\frac{2}{5}\right) = \frac{9}{50} + \frac{14}{50} = \frac{23}{50}.
  \]

  **Posterior for \(H\) after glaze-first-then-relief (Part a)**:  
  - Glaze update: \(P_1(H) = \sum_{i} P(H|G_i) Q_g(G_i)\) with rigidity (use prior conditionals):  
  \[
  P(H|G_1) = \frac{P(G_1|H)P(H)}{P(G_1)} = \frac{\left(\frac{1}{2}\right)\left(\frac{3}{5}\right)}{\frac{19}{50}} = \frac{\frac{3}{10}}{\frac{19}{50}} = \frac{3}{10} \times \frac{50}{19} = \frac{15}{19}.
  \]
  \[
  P(H|G_2) = \frac{\left(\frac{3}{10}\right)\left(\frac{3}{5}\right)}{\frac{19}{50}} = \frac{\frac{9}{50}}{\frac{19}{50}} = \frac{9}{19}, \quad P(H|G_3) = \frac{\left(\frac{1}{5}\right)\left(\frac{3}{5}\right)}{\frac{6}{25}} = \frac{\frac{3}{25}}{\frac{6}{25}} = \frac{3}{6} = \frac{1}{2}.
  \]
  \[
  P_1(H) = \left(\frac{15}{19}\right)\left(\frac{2}{5}\right) + \left(\frac{9}{19}\right)\left(\frac{3}{10}\right) + \left(\frac{1}{2}\right)\left(\frac{3}{10}\right) = \frac{30}{95} + \frac{27}{190} + \frac{3}{20} = \frac{120}{380} + \frac{54}{380} + \frac{57}{380} = \frac{231}{380}.
  \]
  - Relief update: \(P_2(H) = \sum_{j} P(H|R_j) Q_r(R_j)\) with rigidity (use prior conditionals):  
  \[
  P(H|R_1) = \frac{P(R_1|H)P(H)}{P(R_1)} = \frac{\left(\frac{7}{10}\right)\left(\frac{3}{5}\right)}{\frac{27}{50}} = \frac{\frac{21}{50}}{\frac{27}{50}} = \frac{21}{27} = \frac{7}{9}.
  \]
  \[
  P(H|R_2) = \frac{\left(\frac{3}{10}\right)\left(\frac{3}{5}\right)}{\frac{23}{50}} = \frac{\frac{9}{50}}{\frac{23}{50}} = \frac{9}{23}.
  \]
  \[
  P_2(H) = \left(\frac{7}{9}\right)\left(\frac{3}{5}\right) + \left(\frac{9}{23}\right)\left(\frac{2}{5}\right) = \frac{21}{45} + \frac{18}{115} = \frac{7}{15} + \frac{18}{115} = \frac{161}{345} + \frac{54}{345} = \frac{215}{345} = \frac{43}{69}.
  \]

  **Posterior for \(H\) after relief-first-then-glaze (Part b)**:  
  - Relief update: \(P_1'(H) = \sum_{j} P(H|R_j) Q_r(R_j) = \frac{43}{69}\) (same as above).  
  - Glaze update: \(P_2'(H) = \sum_{i} P(H|G_i) Q_g(G_i) = \frac{231}{380}\) (same as first step in part a).  

  **Confirmation of order-dependence**:  
  \[
  P_2(H) = \frac{43}{69} \approx 0.623, \quad P_2'(H) = \frac{231}{380} \approx 0.608. \quad \text{(Differ as } 43/69 \neq 231/380\text{)}
  \]

  ---

  ### Model Answer (700 words)  

  **(a) First glaze, then relief**:  
  After glaze update, rigidity gives \(P_1(H) = \sum_i P(H|G_i) Q_g(G_i)\). Compute prior conditionals:  
  \(P(H|G_1) = \frac{(1/2)(3/5)}{19/50} = \frac{3/10}{19/50} = 15/19\),  
  \(P(H|G_2) = \frac{(3/10)(3/5)}{19/50} = 9/19\),  
  \(P(H|G_3) = \frac{(1/5)(3/5)}{6/25} = 1/2\).  
  So, \(P_1(H) = (15/19)(2/5) + (9/19)(3/10) + (1/2)(3/10) = 30/95 + 27/190 + 3/20 = 120/380 + 54/380 + 57/380 = 231/380\).  

  Now update on relief with rigidity: \(P_2(H) = \sum_j P(H|R_j) Q_r(R_j)\). Prior conditionals:  
  \(P(H|R_1) = \frac{(7/10)(3/5)}{27/50} = 7/9\),  
  \(P(H|R_2) = \frac{(3/10)(3/5)}{23/50} = 9/23\).  
  So, \(P_2(H) = (7/9)(3/5) + (9/23)(2/5) = 21/45 + 18/115 = 161/345 + 54/345 = 215/345 = 43/69\).  

  **(b) First relief, then glaze**:  
  After relief update: \(P_1'(H) = \sum_j P(H|R_j) Q_r(R_j) = 43/69\) (as above).  
  Glaze update with rigidity: \(P_2'(H) = \sum_i P(H|G_i) Q_g(G_i) = 231/380\) (from part a).  

  **(c) Explanation and discussion**:  
  The posteriors differ (order a: \(43/69 \approx 0.623\), order b: \(231/380 \approx 0.608\)) due to order-dependence in Jeffrey conditionalization. This arises because rigidity—the assumption that conditional probabilities given partition cells remain unchanged—is partition-relative. When updating first on glaze, the inspector’s credences shift (e.g., \(P_1(H) = 231/380 \neq P(H)\)), altering the underlying statistics for the relief partition. Consequently, rigidity for relief (\(P_{\text{new}}(-|R_j) = P_{\text{old}}(-|R_j)\)) may not hold, as the prior conditionals \(P(H|R_j)\) no longer reflect the post-glaze state. Rigidity assumes the evidence affects only the partition probabilities, preserving conditionals; but intervening updates can violate this by changing relevant dependencies, especially with cross-cutting partitions like glaze and relief, which are not conditionally independent.  

  This order-dependence challenges Jeffrey conditionalization as a universal diachronic norm. If rationality requires unique posteriors given total evidence, order-dependence suggests the rule is inadequate. A defender might respond in three ways. First, they could argue that update sequences reflect temporal order of evidence, so different orders encode genuinely different total evidence (e.g., "glaze-then-relief" vs. "relief-then-glaze" experiences). Second, they might restrict updates to partitions where rigidity is preserved (e.g., partitions independent given \(H\) and \(L\)), but this is ad hoc. Third, they could reject partition-based evidence in favor of sensor models: instead of directly setting \(Q_g\) or \(Q_r\), model evidence as a likelihood function (e.g., \(P(E_g | G_i)\)), then update by conditioning on a proposition representing the evidence. This may commute if the total evidence is combined, but it abandons Jeffrey’s core idea.  

  Radical probabilism—the view that credences are never exactly 1—bears on this by generalizing updating. It avoids the old-evidence problem (where certain evidence cannot be updated) by treating all evidence as uncertain, but it does not resolve order-dependence. Instead, it highlights that Jeffrey updating is a bookkeeping tool contingent on empirical assumptions (rigidity), not a fundamental norm. Rationality might require justifying rigidity case by case (e.g., as a perceptual idealization), rather than imposing it universally.  

  In sum, order-dependence exposes that rigidity is a substantive, often empirical, assumption. Jeffrey conditionalization functions best as a local update rule, not a global diachronic norm, and its applicability depends on the agent’s epistemic context.  

