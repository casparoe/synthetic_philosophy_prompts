answer: |-
  Below is a decision tree based on Nietzsche's typology from *On the Uses and Disadvantages of History for Life*, designed for institutional memory-keepers. Each branch is a concrete choice, phrased neutrally to avoid bias. The leaves include Nietzsche's three healthy modes (monumental, antiquarian, critical), two life-sustaining attitudes (unhistorical, superhistorical), and three diseased forms (where a mode turns destructive). 

  ---

  ### **Decision Tree: Nietzschean Modes of Institutional History**

  **Start:** You are confronting a decision about how to handle a piece of institutional history.  
  **Q1: Is the primary intent to actively shape future behavior or identity?**  
  - *Yes* → Go to Q2.  
  - *No* → Go to Q4.  

  **Q2: Are you willing to omit, downplay, or reshape uncomfortable truths to serve this purpose?**  
  - *Yes* → **Diseased Monumental** (History as myth-making: past distorted into inspirational fables).  
  - *No* → **Monumental History** (History as action-guide: past used to inspire future greatness).  

  **Q4: Is the primary intent to preserve the past "as it was," regardless of utility?**  
  - *Yes* → Go to Q5.  
  - *No* → Go to Q7.  

  **Q5: Does this preservation impede the institution's ability to evolve or address present needs?**  
  - *Yes* → **Diseased Antiquarian** (History as suffocating burden: past venerated until it paralyzes life).  
  - *No* → **Antiquarian History** (History as reverence: past preserved for continuity and belonging).  

  **Q7: Is the primary intent to interrogate the past to liberate the present?**  
  - *Yes* → Go to Q8.  
  - *No* → Go to Q9.  

  **Q8: Does this interrogation risk eroding the institution's foundational legitimacy?**  
  - *Yes* → **Diseased Critical** (History as nihilism: past condemned until identity collapses).  
  - *No* → **Critical History** (History as reckoning: past judged to free the present).  

  **Q9: Are you suppressing or discarding this history to enable present action?**  
  - *Yes* → **Unhistorical** (Forgetting to act: past ignored for unburdened agency).  
  - *No* → Go to Q10.  

  **Q10: Do you view this history as ultimately meaningless to the institution's core mission?**  
  - *Yes* → **Superhistorical** (Transcending history: past/present/future dissolve into eternal purpose).  
  - *No* → **EMPTY** (Incoherent: no life-serving purpose; see notes below).  

  ---

  ### **Key Annotations**
  1. **The inseparable pair**: **Critical History** and **Diseased Critical**.  
     - The tree uses institutional "foundational legitimacy" (Q8) as the threshold. In practice, this is subjective: one person’s necessary critique is another’s existential threat. Nietzsche’s framework itself blurs this line—critical history must "dare to risk itself" (*On the Advantage and Disadvantage of History*, §3), making self-destruction a latent risk.  

  2. **The empty leaf**: Answers leading to **EMPTY** (Q7=No, Q9=No, Q10=No).  
     - **Why empty?** *Incoherent*. Nietzsche argues history must serve life—either by shaping future, preserving roots, enabling judgment, forgetting, or transcending. Rejecting all these creates a self-contradictory stance: conserving history without a life-affirming purpose is "mummification" (§1). No one would "want to live there" because it drains resources without direction.  

  ---

  ### **Calibration Case: Founder's Garage + Union-Busting Study**
  - **Founder's Garage** (preserved shrine):  
    Q1 (Shape future?) → *No* → Q4 (Preserve past?) → *Yes* → Q5 (Impede evolution?) → *No* → **Antiquarian History**.  
  - **Union-Busting Study** (critical history):  
    Q1 (Shape future?) → *No* → Q4 (Preserve past?) → *No* → Q7 (Interrogate past?) → *Yes* → Q8 (Erode legitimacy?) → *No* → **Critical History**.  

  **Does the tree need a new node?**  
  - **No**. The tree accommodates this as *dual modes in balance*—a "hybrid" outcome Nietzsche endorses when institutions harmonize antiquarian (reverence) and critical (reckoning) (§4). If forced into a single path, the tree would fail; but it’s designed for per-decision analysis.  

  ---

  ### **Tree Logic Explained**
  - **Concrete decisions**: Nodes reflect real trade-offs (e.g., Q2 tackles myth-making, Q5 addresses institutional paralysis).  
  - **Diseased modes**: Included as self-destructive turns (monumental → propaganda; antiquarian → stagnation; critical → nihilism).  
  - **Accessibility**: No Nietzschean jargon needed—e.g., Q8 uses "foundational legitimacy" instead of "life-destroying negation."  
  - **Unhistorical/Superhistorical**: Rare in institutions but included for completeness (e.g., deleting archives to "move on" or dismissing history as irrelevant to an eternal mission).  

  This tree diagnoses *per action*, not whole institutions. A healthy institution may span modes—but the diseased leaves warn when one mode dominates destructively. Use it to audit decisions, not people.
