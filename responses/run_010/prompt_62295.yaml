prompt: |-
  I've been working part-time for about a year in a university archives, processing collections, and I keep getting wiplash from the ground rules, so I want to figure out what they actually assume. The rules I'm trained on are basically: arrange and describe everything by the office that created it, never by subject and never by person; never mix records from two different creators in one folder even when they're the same kind of document about the same event; keep each creator's records together and separate from everyone else's. Our finding aids list series by administrative function — "Correspondence, 1948–1971," "Case files, 1962–1980," "Subject files, Planning Office" — and there is no name index at all. So if you want to find one specific woman who got evicted in 1969, you can't search for her; you have to already know which office touched her, and then hope she's in that office's papers. Researchers get told some version of "we can't refile it that way, it would destroy the context" and mostly they shrug and go read the annual reports instead.

  The thing that finally made me write this down: we just finished processing something like four hundred rent-assistance and relief case files that came to us from a county office. Between the donor agreement and state privacy rules they can only be described in the aggregate — the finding aid gives the date range, says what kinds of forms are inside, notes that some files are restricted, and does not name anybody. So the people in those boxes are, as far as our catalog is concerned, unfindable. Meanwhile the records of the county commissioners who voted on the budget line those files came out of are individually named, indexed, cross-referenced in three other collections, and cited in our exhibit labels. The institution is discoverable down to a single interoffice memo; the people it acted on aren't discoverable at all, and we're told we couldn't fix that with an index anyway because it would break provenance. Then, in the same building, I get put on a community collecting project about a neighborhood that's being torn down, and suddenly we're building "artificial collections" assembled by person and by topic, plus a vertical file of newspaper clippings and flyers we made ourselves, and nobody seems bothered that this is the exact thing we're not allowed to do to the county records. I took a historiography seminar last year where everyone kept saying "history from below" like it was a solved problem, and I can't stop wondering whether the archive's filing rules make it structurally impossible — not because anyone ever decided that, just because of how the boxes are arranged.

  So what does this practice presuppose, philosophically? I don't really have the vocabulary, so reconstruct it for me. Is arrange-by-creator an epistemological claim — that a record only means something in the context of its creation, so context is what has to be preserved — or is it a claim about agency, that institutions are the things that act and individuals are only ever what gets documented? Does "no name index" presuppose that a person appearing in records isn't a subject of history but an object of administration, and does "aggregate description only" presuppose that a person is a type rather than an individual (because if a person were an individual, naming her would be the whole point)? Which rival views about who counts as a historical subject does the rule quietly rule out that we'd never notice ruling out? And please separate what the practice strictly needs from what it just happens to fit well with — I can think of at least one totally non-philosophical story, about custody, donor contracts, chain of title, and the fact that it's cheaper to describe a series than 400 people, and I want to know whether that story alone licenses everything, or whether there's a leftover that only some view about historical subjects can explain. Also: is the artificial-collection thing actually inconsistent with the rule, or does it reveal that the rule was never about truth in the first place? Finally, tell me what would have to change — not just in the finding aids but in what counts as a fact and who counts as a source — if we replaced arrange-by-creator with something person-centered, and whether the privacy restriction on those case files should be understood as protecting the people in them or as completing their erasure.
reasoning: |-
  Okay, the user is working in a university archives and is grappling with the tension between traditional archival practices and the desire to make marginalized individuals more discoverable. They described how records are strictly organized by the creating office (provenance and original order), which makes it hard to find individuals unless you know which office handled their case. For example, 400 case files are described in aggregate without individual names due to donor agreements and privacy rules, while institutional records are detailed and indexed.

  The user's frustration peaks when they're involved in a community collection project that uses person-centered and topical arrangements—methods forbidden in institutional archives. They question the philosophical underpinnings: does provenance-centric arrangement imply institutions are the only historical actors? They also wonder about the inconsistency in practices and whether privacy rules protect individuals or contribute to their erasure.

  I need to unpack the presuppositions of traditional archival practice. Provenance (arranging by creator) and original order maintain context, treating records as evidence of functions, not content. This reflects an institutional lens where individuals are objects of administration. Privacy laws and donor agreements add practical constraints, but the user suspects deeper philosophical issues.

  The user's deeper need is to reconcile archival theory with social justice goals like "history from below." They want to know if current practices inherently silence marginalized voices and what changes would allow person-centered approaches without compromising archival integrity. They might also be seeking validation of their observations and strategies to advocate for change within their institution.

  Key philosophical points: Traditional practice sees context as paramount, valuing records as evidence of organizational actions. Individuals are not agents but data points. Rival views like microhistory or social history challenge this by centering individuals, but archival methods haven't adapted. The inconsistency with community projects shows that context isn't always about truth but about power and practicality.

  To address this, I should explain the foundational principles (Provenance, Respect des fonds), their presuppositions, and the tensions. Highlight how privacy restrictions, while well-intentioned, can perpetuate erasure. Suggest changes like layered description or ethical access protocols that bypass traditional barriers. Emphasize that structural change requires rethinking what counts as a record and who is a historical subject, moving towards inclusive practices that balance evidence with discoverability.
answer: |-
  Your experience exposes profound philosophical fault lines in archival theory. Let's dissect the presuppositions:

  1.  **The Primacy of Context (Provenance & Original Order):**
      *   **Core Presupposition:** The meaning, authenticity, and evidential value of a record are inseparable from the context of its creation and use *within the originating body*. This views records primarily as *evidence of function and action*.
      *   **Epistemological Claim:** Yes. It presupposes that understanding *why* a record exists, *who* created it for *what purpose*, and *how* it functioned within its original system is essential to interpreting its true meaning and reliability. Removing it from that context ("mixing") risks distortion, misinterpretation, or loss of its essential character as evidence.
      *   **Claim about Agency:** Also yes. It implicitly positions the *creating entity* (the office, the institution, the organization) as the primary historical *actor* whose actions and decisions are being documented. The records exist because of and for the functioning of that entity.

  2.  **The Erasure of the Individual Subject:**
      *   **Aggregate Description & No Name Index:**
          *   **Presupposition:** Individuals documented within institutional records are primarily *objects* or *cases* of administrative action, not independent historical subjects worthy of direct discovery in their own right *within that recordkeeping system*.
          *   **Philosophical Implication:** This practice embodies a view where individuals are subsumed under administrative categories ("evictee," "relief recipient," "case #1234"). They are data points within the institution's narrative. Naming them isn't seen as essential to understanding the *institution's function*; the aggregate data serves that purpose. It presupposes that historical significance flows *from* the institution *to* the individual, not vice-versa within this context.
          *   **What it Rules Out:** It structurally marginalizes approaches like microhistory, social history "from below," biography (of non-elites), and any research seeking to trace individual experiences *across* institutional boundaries or to center individuals *as* the primary subjects of inquiry using *these specific institutional records*. The archive, organized this way, is fundamentally an *institutional* memory bank, not a *social* one.

  3.  **The Nature of a "Fact" and a "Source":**
      *   **Presupposition:** The most reliable "fact" is the record *as created and used by the institution*. The institution itself is the authoritative "source" about its own actions and the cases it processed. Information extracted and reorganized (like a name index) is considered a derivative, secondary product, potentially less reliable and certainly disruptive to the primary evidence.
      *   **Implication:** Authenticity and authority reside firmly with the originating body's recordkeeping system. Rearranging by subject or person introduces an external (archivist or researcher) categorization, seen as potentially anachronistic or interpretive, contaminating the "pure" evidence.

  **Separating Necessity from Philosophical Fit:**

  *   **The Non-Philosophical Story (Custody, Cost, Contracts) IS Sufficient:**
      *   **Custody & Chain of Title:** Provenance establishes legal and ethical custody. Mixing records destroys the clear chain of ownership and responsibility.
      *   **Efficiency:** Describing 400 case files individually is vastly more resource-intensive than describing the series. Donor agreements often dictate minimal processing.
      *   **Privacy & Legal Compliance:** Aggregate description is a practical (and often legally mandated) way to manage access restrictions for sensitive personal information. Creating a detailed name index might *itself* violate privacy laws or agreements if it makes restricted individuals easily discoverable.
      *   **This story *can* license the core practice (maintaining provenance/original order and describing series)** on purely practical, legal, and custodial grounds. It doesn't *require* a deep philosophical belief about historical agency.

  *   **The Philosophical "Leftover":**
      *   Where the practical justification falls short is in the *resistance to augmentation* (like creating separate, ethical name indexes *linked* to the original context) and the *inconsistency* you observe. The vehement defense of "context" against *any* subject access, even when feasible, reveals a deeper commitment to the *institutional perspective as paramount*. The philosophical presupposition becomes apparent in the *prioritization*: institutional context is sacred; individual discoverability within that context is often treated as secondary, optional, or even detrimental. The practical constraints *enable* this prioritization, but the belief in the *supreme value* of the institutional context overrides efforts to mitigate the practical limitations for researchers.

  **The Artificial Collection Inconsistency:**

  *   **It Reveals the Rule Isn't Primarily About Ontological Truth:** The treatment of community collections shows that "provenance" and "original order" are *not* absolute, universal principles applied to *all* historical evidence. They are *methodologies* deemed most appropriate for *institutional records*.
  *   **Different Source, Different Rules:** Community collections often lack a single, clear institutional creator. The materials (flyers, personal photos, oral histories) are often gathered *because* they document individual or community experiences *outside* formal institutions. Applying strict institutional provenance rules to such material would be nonsensical and render it unusable. These collections prioritize *subject* and *individual* because that's their inherent nature and value.
  *   **The Inconsistency Highlights:** That the "rules" are contingent on the *type* of source material and the *purpose* for which it's acquired. Institutional archives privilege the institution; community archives often privilege the community/individual. The underlying philosophy shifts based on the perceived source of authority and the intended narrative.

  **Changing the Paradigm (Person-Centered Approach):**

  Shifting to person-centered arrangement would require fundamental changes:

  1.  **What Counts as a Fact/Source:** The individual's experience, as reflected across *multiple* records from *multiple* creators (and potentially non-institutional sources like diaries, oral histories, community records), becomes the central "fact" being documented. The source is no longer solely the institutional record *in situ*, but the *aggregated information about the individual* drawn from wherever it exists.
  2.  **Redefining Context:** Context wouldn't be solely the originating office, but the individual's life trajectory and the network of institutions/events that intersected with them. Preserving institutional context would still be *important* for understanding the record's *origin*, but not the *sole* organizing principle.
  3.  **Radically Different Description:** Finding aids would need complex relational databases linking individuals to every record series where they appear, across all relevant collections. Description would focus on individuals and events *as subjects*, alongside (or even prior to) administrative functions.
  4.  **New Notions of Authority:** Authority would be dispersed. The institution's record is *one* perspective on the individual, potentially contested by other records (e.g., tenant organizing flyers vs. landlord/eviction records) or the individual's own testimony. The archive would manage multiple, potentially conflicting, sources of truth.
  5.  **Massive Resource Shift:** This would be exponentially more labor-intensive than current series-level description. Investment in technology and specialized indexing staff would be crucial.

  **The Privacy Restriction: Protection or Erasure?**

  It's **both**, tragically:

  1.  **Protection:** The restriction genuinely aims to prevent harm – stigma, discrimination, harassment – by keeping sensitive personal details (financial hardship, health issues, legal troubles) confidential, respecting the dignity and rights of those individuals *today*.
  2.  **Completion of Erasure:** However, applied rigidly within an archive already structured to anonymize them administratively, it *does* complete the bureaucratic erasure initiated by the original recordkeeping. They become statistically invisible *and* individually undiscoverable. Their specific stories are locked away, often indefinitely. This protects their privacy *by* ensuring their historical presence as individuals remains obscured.

  **Conclusion:**

  The "arrange-by-creator" rule presupposes that institutions are the primary historical actors, their functions are the primary subject of record, and context is king for meaning and evidence. It structurally marginalizes individuals as subjects within its own systems. The practical justifications (custody, cost, privacy) are sufficient to *explain* the core practice, but the *resistance* to mitigating its limitations for individual discovery and the *inconsistency* with community collecting reveal a deeper philosophical prioritization of the institutional perspective. Moving towards person-centered archiving requires a seismic shift in what constitutes a fact, a source, and context, demanding immense resources and a willingness to embrace fragmented, multi-perspective narratives. The privacy dilemma underscores the painful tension between protecting vulnerable individuals in the present and ensuring their stories survive for the future. "History from below" remains unsolved within traditional institutional archives precisely because their foundational structure was designed to document power, not necessarily the people upon whom it acted.
