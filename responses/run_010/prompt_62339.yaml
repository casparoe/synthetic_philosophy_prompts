prompt: |-
  Longtime LW/EA-Forum-adjacent reader here, and I've been chewing on futarchy for years — Hanson's thing where you vote on the goal and let prediction markets pick the means. There's a failure mode I keep running into in those threads and I genuinely can't tell whether it already has a name, so I'll describe it clumsily and hope somebody recognizes it.

  Setup: you've got a market on a conditional contract, something like "if we adopt plan A, the metric clears X." The price is supposed to be the input to a decision. What I keep noticing is that the moment the market gets hooked up to an actual decision — the moment the price is what tips the choice — the price moves, and it moves toward whichever side the traders want to win. Not because anyone is lying, and not because anyone is paying to move the price so they can profit on some outside position. The traders are sincere: ask the same question off the record and they'll hand you the same credence they're betting. Its just that when the price decides something, buying the contract stops being purely a way of reporting a belief and becomes also a way of casting a ballot, and both motives arrive in the same wallet at the same price.

  Cleanest version I've seen is a side-by-side. Same question, two markets: one that decides nothing and just pays out on the fact of the matter, and one whose price feeds into whether the thing happens. The second runs systematically in the direction people want, and the gap widens the more rides on the decision. Unhook it from the decision and the gap closes back up.

  Second instance, and this is the bit that makes me think it isn't just ordinary manipulation: in a two-branch futarchy setup ("value if A" versus "value if B"), only one branch ever resolves. If B doesn't get chosen, the B market never pays out, so nobody who talked B up ever gets scored. The drift never gets corrected on the branch that lost — and the losing branch is also the thin one, so it's least accurate exactly when the comparison is close enough to matter.

  So: does this have an established term? I've tried filing it under several and none sit right. Goodhart's law is about a measure becoming a target, but here the measure isn't being optimized by an outsider — it's being used as a voting device by the same people reporting into it. Reflexivity and self-fulfilling prophecy are close, except there the world changes to match the belief; here the belief didn't change, only the price did. Performativity in the sociology-of-finance sense is adjacent for the same reason. Expressive voting is in the ballpark, but that's usually about cheap, non-pivotal expression, and here the expression is pivotal and costs real money. And plain "prediction market manipulation" assumes either an outside position or someone betting against what they believe.

  Don't just hand me a label — I want the carving. What's the actual mechanism, where does this stop being its own thing and start being manipulation or reflexivity, does the decision-relevance have to be public and binding for the effect to show up, and if there's no existing term, what would you call it and what are the boundary cases? Bonus points if you can say whether anyone has proposed a fix that doesn't amount to "just don't let the market decide anything."
reasoning: |-
  Okay, let me start by understanding what the user is asking. They're describing a problem in futarchy where prediction markets used for decision-making get skewed because traders have both profit motives and outcome preferences. The key points are: when the market price influences a decision, traders bet not just on their beliefs but also to sway the outcome. This causes the price to drift toward the desired outcome, even if their actual belief hasn't changed.

  First, I need to recall if there's an existing term for this. The user mentioned several possibilities like Goodhart's law, reflexivity, performativity, expressive voting, but none fit perfectly. Goodhart's is about metrics becoming targets, but here the traders are part of the system. Reflexivity involves beliefs changing reality, but in this case, beliefs stay the same; it's the price that moves due to decision influence. Expressive voting usually refers to low-cost signaling, whereas here it's costly betting.

  The mechanism seems to be a combination of instrumental rationality and expressive utility. Traders get utility from both profit and influencing outcomes. So the market price reflects a composite of belief and preference. The user's examples show that when the market is decisive, the price skews, and when it's not, it corrects. Also, in futarchy, the losing branch never resolves, so inaccuracies aren't penalized, making thin markets less reliable.

  Now, existing concepts: Futarchy critique often touches this. Robin Hanson himself noted the preference effect, but maybe didn't name it. The term "preference-induced bias" or "expressive utility in markets" comes to mind. "Decision-conditional prediction market bias" is more descriptive. I should check if there's literature on this. Paul Rhode's paper on betting for political outcomes might be relevant. Also, Hanson's 2007 post about decision markets and the preference effect.

  Boundaries: The effect requires the decision to be influenced by the market publicly and bindingly. If traders think their bets can change the outcome, they add expressive utility. Without that, it's just belief. The gap between conditional and unconditional markets demonstrates this. It's not manipulation because traders aren't lying or hedging external positions; they're sincerely acting on combined motives.

  Fixes? The user wants solutions beyond disconnecting the market. Possible approaches: subsidies for accurate predictions, like logarithmic scoring rules. Or using thick markets where liquidity reduces bias. Another idea is to resolve both branches using statistical models, though that's complex. Hanson suggested separating decision and information markets, but that might not work. Subsidizing the contrary position could help, but implementation is tricky.

  The user's deeper needs: They're well-versed in LW/EA concepts but seek a precise term and mechanism. They might want to address this in futarchy designs or critique existing proposals. Understanding boundaries and fixes is crucial for practical applications. They might be looking for academic references or innovative solutions to salvage futarchy without abandoning decision markets.

  Label suggestion: "Expressive Instrumental Convergence" or "Decision-Induced Market Bias" but "Preference Effect" as Hanson calls it might be closest. However, coining "Decision-Conditional Bias" or "Voting-Preference Composite Utility Effect" could be more descriptive. Emphasizing the dual utility function in traders as the core mechanism.

  In summary, the user needs a clear taxonomy of this bias, its boundaries, and potential solutions. Confirming that it's a recognized issue in futarchy literature with some proposed mitigations, though none perfect, would address their query comprehensively.
answer: |-
  This is a **profound and under-discussed flaw** in decision-conditioned prediction markets, especially futarchy. You've nailed the mechanism: **the fusion of expressive utility ("I want this to happen") and instrumental utility ("I profit if this is true") into a single action (placing a bet) when the market price *directly influences the outcome*.**

  **The Established Frameworks & Why They Don't Quite Fit (Your Carving):**

  1.  **"Preference Effect" (Robin Hanson's Term, but underdeveloped):** Hanson himself [acknowledged this](https://www.overcomingbias.com/2007/07/decision-markets.html) briefly, calling it a "preference effect." He noted people bet more on outcomes they prefer, even given the same beliefs. But he didn't deeply explore the systemic *decision-bias* implications or the unresolved-branch problem you highlight. This is the *closest* existing label, but it's not widely used or rigorously defined for this specific failure mode.
  2.  **Expressive Utility in Markets:** This is the core micro-foundation. When buying a contract influences the likelihood of the desired outcome *itself*, the trader derives utility *both* from potential profit *and* from increasing the chance their preferred policy wins. Their demand curve shifts rightward for contracts favoring their desired outcome. This isn't "cheap talk" expressive voting; it's **costly expressive action with direct instrumental impact**.
  3.  **Endogenous Impact / Self-Negating/Reinforcing Predictions:** This leans into reflexivity/performativity. The key distinction you made is crucial:
      *   **Classic Reflexivity (Soros):** Belief changes *fundamentals* (e.g., believing a bank is insolvent causes a run, *making* it insolvent).
      *   **This Mechanism:** Beliefs *about fundamentals remain unchanged*. The price changes *solely* because the act of trading now *directly changes the decision outcome*, not the underlying state. The trader says: "I believe P(A) = 60%, *and* I want A to happen. Because betting 'Yes on A' *makes A more likely* (by moving the price that decides the policy), I'm willing to pay more than $0.60 for this contract, effectively subsidizing my 'vote'." The price becomes a composite signal: `Belief + (K * Preference_Strength)`, where `K` scales with how much the price influences the decision.
  4.  **Manipulation?** Not in the standard sense. No lying, no hedging external positions. Traders are "manipulating" the *decision* via the only channel available (the price), but they are doing so *sincerely* based on their preferences, not to distort the information signal for profit elsewhere. It's **goal-oriented price movement** driven by the *intended* consequence of the decision, not deceptive profit-seeking.
  5.  **Goodhart's Law:** The metric *is* being gamed, but the "gaming" isn't by an external optimizer twisting the system. It's an *internal* feature of the participants' combined motivations within the decision-making rule itself. The metric (price) becomes a bad measure of the underlying belief *specifically because* it is being used as the decision rule.

  **The Mechanism & Boundaries:**

  1.  **Core Mechanism:** The trader's utility function for a bet `U(bet) = (Expected Monetary Profit) + λ * (Impact on Probability of Desired Outcome)`. `λ` represents the strength of their preference for the outcome. When the market price *is* the decision rule, `Impact on Probability of Desired Outcome` is directly tied to the act of buying/selling (moving the price). This creates a premium (or discount) reflecting `λ`.
  2.  **Necessary Conditions:**
      *   **Decision-Relevance:** The market price must *actually and predictably* influence the decision outcome. Traders must believe their trades can swing the decision. The more pivotal the market is perceived to be, the stronger the effect (`K` increases).
      *   **Binding & Public:** The decision rule linking price to outcome must be known, credible, and binding. An "advisory" market with no formal power might show a weaker effect.
      *   **Resolve Uncertainty:** The problem is *exacerbated* when one branch doesn't resolve (like futarchy's losing policy). There's no feedback mechanism to punish expressive over-bidding on the losing side. The winning side *does* resolve, potentially punishing under-bidding due to expressive *avoidance* of the disliked outcome.
  3.  **Boundary Cases:**
      *   **Thick Markets:** If the market is extremely liquid and traders are numerous/small, an individual trader's impact (`λ` component) becomes negligible. The effect *should* diminish but likely doesn't vanish entirely if large blocks of traders share strong homogeneous preferences.
      *   **Unconditional Markets (Pure Prediction):** No `λ` component exists because trading doesn't influence the underlying event. Price should reflect beliefs (+ risk aversion, etc.).
      *   **Markets Deciding *How* vs. *What*:** A market deciding the *implementation details* of a *fixed* goal (e.g., "Which contractor gets the bridge build?") might have less preference bias than one deciding the *goal itself* (e.g., "Build a bridge or a park?"), assuming the *value* of the fixed goal is the metric. Preference for specific contractors might still creep in.
      *   **Costly Voting:** This *is* a form of costly voting! The "ballot" costs the expected loss from betting against your beliefs plus any risk premium. The key difference from standard voting is the *simultaneous* expression of belief and preference via a single price signal.

  **What to Call It?**

  Given the lack of a perfect established term, we need descriptive clarity:

  1.  **Decision-Conditional Bias (DCB):** Highlights the core dependency.
  2.  **Voting-Preference Composite Utility Effect:** Describes the micro-mechanism.
  3.  **Endogenous Goal Distortion in Decision Markets:** Focuses on the system failure.
  4.  **Expressive Instrumental Convergence (EIC):** Captures the fusion of motives. (This might be my favorite, though it's new).
  5.  **The Unresolved Branch Problem:** Specifically for the futarchy issue where losing markets never settle.

  **Proposed Fixes (Beyond Disconnection):**

  1.  **Subsidizing Accuracy (The Hanson Whisper):** Robin Hanson suggested this. The idea is to subsidize trades based on a proper scoring rule *relative to the eventual resolution*. This increases the monetary reward for accuracy, potentially outweighing the expressive `λ` for more traders. Problems: Requires resolution (which fails for the losing branch!), complex implementation, costly.
  2.  **Artificial Resolution of Losing Branches:** Use external forecasts, historical data, or expert judgment to *estimate* the metric for the non-chosen policy *as if* it had been implemented. Settle the "B" market based on this estimate. Problems: Defeats the purpose of using markets for that branch, introduces bias/judgment, gameable.
  3.  **Decision Markets Decoupled from Value Markets (Hanson's Later Idea):** Have one set of markets *only* to make the decision ("Choose A or B"), and separate, *unconditional* prediction markets *only* to forecast the value metric *after* the decision is made (e.g., "What will GDP-Q be if A wins?"). The decision market uses prices, but the value forecast is separate. Problems: The decision market *itself* is still susceptible to DCB/EIC on the "A vs. B" choice. The value markets are cleaner but used post-hoc.
  4.  **Thick Liquidity & Large Traders:** Rely on highly liquid markets dominated by large, financially motivated players whose `λ` is small relative to their monetary stakes. Problem: Not always feasible, especially for niche policy questions; large players might have strong preferences too.
  5.  **Quadratic Funding / Voting for Market Subsidies:** Use a separate mechanism (e.g., QV) to raise funds specifically used to subsidize liquidity or accuracy rewards in the prediction market, potentially countering the preference skew. Problem: Adds complexity, new attack vectors.
  6.  **"Contrary Position" Subsidy:** A mechanism automatically takes the opposite side of trades at a slight discount, funded by a small tax or subsidy pool. This makes expressive betting more expensive. Problem: Hard to calibrate, costly, distorts the market differently.

  **Conclusion:**

  You've identified a fundamental flaw: **Decision-Conditional Bias / Expressive Instrumental Convergence.** It arises because the prediction market price serves a dual role: aggregating beliefs *and* being the direct mechanism for choosing outcomes. This conflates the epistemic (what's true) and the pragmatic (what we want) within the same trading action. The unresolved branch problem in futarchy is a particularly nasty consequence that amplifies the inaccuracy precisely when decisions are close.

  While sometimes hinted at (e.g., Hanson's "preference effect"), it lacks a universally recognized, rigorous name and is often overlooked in optimistic futarchy proposals. Fixes are non-trivial and often involve trade-offs against simplicity or cost. The cleanest theoretical solutions involve decoupling the decision force from the belief signal (e.g., separate decision and value markets), but even this is imperfect. Robust futarchy likely requires acknowledging and actively mitigating this bias through mechanisms like significant accuracy subsidies or artificial branch resolution, accepting the associated complexity and cost.
