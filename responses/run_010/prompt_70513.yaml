  We are designing a decision procedure for the ethics committee to evaluate requests for conscientious objection. The procedure must be runnable in 90 minutes by a committee including clinicians and two lay trustees. The goal is to distinguish between moral commitments we ought to accommodate and biases we ought to refuse.

  We discard the following tests:
  1. **Articulacy**: We discard because the ability to articulate reasons does not necessarily make the objection a moral commitment (and vice versa). We have seen that some biases are well-articulated and some deeply held moral convictions might be inarticulate.
  2. **Consistency across cases**: We discard because consistency is not a reliable indicator. A person might have a moral commitment that is consistent in their own view but biased, or a bias that is inconsistently applied. Also, the committee does not have the time to review multiple cases for consistency in a 90-minute meeting.
  3. **Emotion (presence and intensity)**: We discard because emotions can be present in both moral commitments and biases. Intensity might indicate depth of feeling but not necessarily moral validity.
  4. **Survival of deliberate reflection**: We discard because both biases and moral commitments can survive reflection. This test does not distinguish the two.
  5. **Clinician's own account of origin**: We discard because the origin story does not necessarily determine the moral status of the objection. A moral commitment might arise from a biased source initially but be defensible on other grounds, and vice versa.

  We keep:
  - **The "flip" test (whether the judgment flips when a morally irrelevant feature is changed)**: We keep this because it helps reveal if the objection is based on a factor that should not matter (like race, gender, etc.) and thus indicates bias. However, we must be cautious to identify what is morally relevant in the context.

  We design a step-by-step procedure with clear termination points and a point where we must refer to the board for a values decision.

  **Decision Procedure:**

  1. **Step 1: Clarify the objection.**
     - Question: "What exactly are you asking to be excused from? Please be specific about the duty, procedure, or assignment."
     - Sufficient answer: A clear description of the specific duty or duties from which the clinician seeks exemption.
     - If the objection is unclear or overly broad, we ask for clarification until it is specific. If still not clear, terminate with refusal (because we cannot evaluate an unclear objection).

  2. **Step 2: Identify the basis of the objection.**
     - Question: "What is the basis of your objection? Please describe the values or principles that are at stake for you."
     - Sufficient answer: The clinician must identify at least one value or principle that they believe is compromised by performing the duty. This does not require a fully articulated philosophy but must point to a moral concern (e.g., "I believe it is wrong to take a life", "I believe in bodily autonomy", etc.).
     - If the clinician cannot identify any value or principle, terminate with refusal (because without a moral basis, it might be a bias or mere preference).

  3. **Step 3: Apply the flip test (test for morally irrelevant factors).**
     - Question: "Would your objection change if we changed a feature of the patient that is not directly related to the medical condition or the procedure? For example, if the patient were of a different race, gender, religion, socioeconomic status, or age (where age is not a factor in the medical indication)?" 
       - We also consider other features that might be in play (e.g., in the prison case, we might ask about a homeless shelter patient).
     - Sufficient answer: The clinician must either affirm that the objection would remain (i.e., the factor is not influencing) or explain why the factor is morally relevant in this context.
     - If the objection flips (i.e., the clinician would not object if the irrelevant feature were different) and the clinician cannot explain why that feature is morally relevant, terminate with refusal (because this indicates bias).
     - If the objection does not flip and the clinician can explain the moral relevance (if the factor is in question) or if the factor is clearly irrelevant and the objection does not depend on it, proceed.

  4. **Step 4: Test for consistency of the value with professional obligations.**
     - Question: "Is the value you are appealing to consistent with the core values of our profession (as expressed in our hospital's mission, the Hippocratic Oath, or professional codes of ethics)?"
     - We are looking for conflicts with fundamental professional duties. For example, a commitment to non-maleficence is core, but a refusal to treat a patient based on race is not.
     - Sufficient answer: The clinician should be able to explain how their value fits within or does not fundamentally violate professional obligations. If the value is in conflict, they must show that the conflict is unavoidable and that the value is so fundamental that it overrides the professional duty in this case.
     - If the value is clearly in conflict with a core professional obligation (e.g., non-discrimination, providing care based on medical need) and the clinician cannot justify an override, terminate with refusal.

  5. **Step 5: Assess impact on patient care and colleagues.**
     - Question: "How will your exemption affect patient care and your colleagues? Have you made arrangements to ensure that patients will receive timely care and that your colleagues are not unduly burdened?"
     - We require that the exemption does not harm patients or unfairly burden colleagues. The clinician must have a plan for coverage that is reliable and does not compromise care.
     - Sufficient answer: The clinician must demonstrate that they have a feasible plan (like the intensivist in the example who arranged coverage) or that the system can absorb the exemption without harm. If the exemption would cause harm (e.g., delays in care, overburdening others) and the clinician cannot mitigate that, we refuse.
     - If the impact is unacceptable, terminate with refusal.

  6. **Step 6: Refer to the board for unresolved value conflicts.**
     - If we have passed steps 1-5 without termination, then we have established that the objection is based on a moral commitment that is not biased (by our tests) and does not violate core professional obligations, and the impact is acceptable. However, there might be cases where the committee is split on whether the value is one that the institution should accommodate. In such cases, we refer to the board for a decision on institutional values.
     - Point of referral: When the committee is uncertain whether the value expressed, though meeting the above criteria, is one that the hospital should accommodate given its mission and values. This is a values decision beyond the scope of the committee's fact-based procedure.

  **Summary of termination points:**
  - Step 1: Termination if objection remains unclear after clarification (refusal).
  - Step 2: Termination if no value or principle is identified (refusal).
  - Step 3: Termination if the flip test reveals bias and the clinician cannot explain the factor as morally relevant (refusal).
  - Step 4: Termination if the value conflicts with core professional obligations without justification (refusal).
  - Step 5: Termination if the impact on patients or colleagues is unacceptable (refusal).

  **Now, run the procedure on the three cases:**

  **Case 1: Surgical resident and bariatric service.**
  - Step 1: The resident asks to be excused from the entire bariatric service. This is clear.
  - Step 2: The resident reports a dread he cannot explain. He fails to state any value or principle. Therefore, we terminate at Step 2 with refusal.

  **Case 2: Intensivist and renal replacement therapy for advanced dementia.**
  - Step 1: The request is clear: never to initiate renal replacement therapy for patients with advanced dementia.
  - Step 2: The intensivist has secular, fully worked out reasons. He can state the values (e.g., perhaps the futility of aggressive treatment in advanced dementia, or the principle of non-maleficence by avoiding burdensome treatment without benefit). This is sufficient.
  - Step 3: Flip test: Would he object for a patient without advanced dementia? He would not (because he only objects for advanced dementia). The feature (advanced dementia) is medically and morally relevant (because it relates to prognosis and benefit). So it passes.
  - Step 4: The value (avoiding futile or harmful treatment) is consistent with professional obligations (like beneficence and non-maleficence). It may even be in line with guidelines on appropriate care for advanced dementia. So it passes.
  - Step 5: He has arranged coverage on every occasion, so impact is acceptable.
  - We do not terminate and the request is granted. (Note: This might be a case that goes to the board if the committee is split on whether the hospital should accommodate this as a matter of institutional policy, but the procedure does not require it because the steps are passed. However, if the committee feels that this is a value conflict that the institution must decide, they can refer at Step 6.)

  **Case 3: Nurse and prison population research protocol.**
  - Step 1: The nurse asks to be excused from a research protocol that recruits from a prison population. Clear.
  - Step 2: She argues that consent cannot be free in custody. This is a value: she believes in the necessity of free consent for research, and that prisoners cannot give it. This is a moral principle (autonomy).
  - Step 3: Flip test: Would she object if the same protocol recruited from a homeless shelter? She does not object in that case. We then ask: Is the setting (prison vs. homeless shelter) a morally relevant difference? She must explain why she thinks prison inherently compromises consent but a homeless shelter does not. If she cannot provide a justification that the committee finds plausible (e.g., the power differential and coercion in prison is unique), then we have a flip and we terminate at Step 3 with refusal. However, she might argue that the homeless shelter does not have the same level of coercion as prison. The committee must decide if the factor (being in prison) is morally relevant to consent. This is a judgment call. If the committee is convinced that the prison setting is uniquely coercive (which is a common ethical concern), then it passes. But note: the example says she has no comparable objection for the homeless shelter. We must probe: why is one setting acceptable and the other not? If she cannot explain a morally relevant distinction, then we terminate at Step 3. However, if she can explain that the prison environment has institutional coercion that a homeless shelter does not, that might be acceptable. But note: the example also says she is visibly angry and has never declined an assignment. The anger might be a red flag but we discarded emotion as a test. We focus on the flip test. Let us assume that the committee is not convinced that the distinction is morally relevant (because both are vulnerable populations and the homeless shelter might also have coercive elements). Then we terminate at Step 3 with refusal.

  **One of these three should come out in a way I will not like.**
  The requester might not like the refusal in Case 1 and Case 3. But note that the procedure leads to refusal in Case 1 and possibly Case 3. The intensivist case is granted. The nurse case might be refused if we are not convinced by the moral relevance of the prison setting. Alternatively, if we are convinced, then we proceed.

  In the nurse case, after Step 3, if we pass, then:
  - Step 4: The value (autonomy in consent) is consistent with professional obligations. So it passes.
  - Step 5: She has never declined an assignment and the research protocol might have multiple nurses, so impact might be acceptable. But note: we require a plan. The example does not say she has arranged coverage, but the committee might require that she does. However, the example says she has never declined, so maybe she has not needed to because the assignment hasn't come up? We must ask about the plan. If she doesn't have one, we might terminate at Step 5. But the example says she has never declined, so perhaps she has been doing it? We are told she is asking to be excused. If she has been doing it without complaint until now, then she might not have a plan. We might require that she arrange for a colleague to take over when the assignment comes. If she can, then Step 5 passes. But if she cannot, then we terminate at Step 5.

  Given the complexity, let us assume that the committee terminates at Step 3 for the nurse because they are not convinced that the prison setting is uniquely coercive in a way that the homeless shelter is not. Therefore, they refuse.

  **What the procedure cannot settle:**
  The procedure cannot settle deep value conflicts about what constitutes a morally relevant difference or about the weight of competing values. For example, in the intensivist case, even though we passed through the steps, there might be disagreement about whether avoiding renal replacement therapy in advanced dementia is a moral commitment that we should accommodate or a form of giving up on patients. Similarly, in the nurse case, the question of whether prison invalidates consent might be a matter of institutional values.

  **What to do about the residue:**
  We refer these value conflicts to the board. The board, representing the institution, must decide what values the hospital upholds and whether to accommodate the objection as a matter of policy. The board's decision should be guided by the institution's mission, values, and legal obligations, and they may seek broader input.

  **Note on the three cases:**
  We have:
  - Case 1: Refused at Step 2.
  - Case 2: Approved (unless referred to the board at Step 6, but the procedure doesn't require it).
  - Case 3: Refused at Step 3 (if the committee does not accept the moral relevance of the prison setting) or possibly approved (if they do). We are told that one should come out in a way the requester won't like. So let us assume the nurse case is refused.

  The surgical resident might be the one we refuse (which he won't like) and the intensivist we approve (which might be controversial but is approved). The nurse might be refused (which she won't like) or approved? But note the example says the nurse is angry and has no comparable objection in the homeless shelter. We are also told that one of the three should come out in a way the requester won't like. We have two refusals (Case 1 and possibly Case 3). But the requester in Case 2 might be happy. The surgical resident and the nurse might be unhappy.

  However, the nurse case might be approved if the committee accepts the moral relevance. But the problem states: "One of these three should come out in a way I will not like." (The "I" is the hospital group, meaning the committee chair or the institution might not like one outcome.) We designed the procedure so that the intensivist is approved, which might be the one the institution does not like? Because the intensivist is effectively refusing to provide a treatment that might be considered standard? But note: the example says his reasons are secular and fully worked out. Also, the medical community is divided on aggressive treatment in advanced dementia. So the institution might not like that they are allowing an individual to opt out of what is considered standard by some.

  Alternatively, if the nurse is approved, then the institution might be concerned about the implications for research. But note that the procedure might refuse the nurse if we don't accept the moral relevance. 

