prompt: |-
  Act as a philosopher of statistics who has also spent years maintaining a production A/B-testing platform. Before designing anything, think carefully and spend a short opening section brainstorming which underlying commitments — not which camp labels — actually separate the positions in the frequentist-versus-Bayesian dispute and in the methodological arguments around the replication crisis.

  Some context. I'm a software engineer with no formal philosophy training; I know the vocabulary only from blog posts, so please don't assume I can adjudicate anything. I own the experimentation platform at a mid-size consumer app. What we ship is a hybrid I can't locate in the standard two-camp picture: an engineer may stop a test the moment the posterior probability that the variant beats control crosses 95%, under a default weakly informative prior, and we simultaneously spend a Benjamini–Hochberg-style budget across all running experiments to cap the share of shipped "wins" that turn out to be null. Peeking isn't tolerated, it's the interface.

  Deliverable: a decision tree of eight to twelve branch nodes that walks one of my engineers from a claim they would sincerely endorse to a named position. Every node must be a concrete operational question — about what a probability attaches to, whether stopping rules matter once the data are in, whether two analysts with identical data and different intentions have identical evidence, whether a procedure's long-run behavior can bear on this single result, what preregistration actually buys — answerable without knowing which leaf it leads to. No node may ask anyone to self-identify as frequentist or Bayesian. Leaves must include the Fisherian and Neyman–Pearson positions, error statistics, subjective / objective / empirical Bayes, the model-checking view that treats both frameworks as approximations, a "this debate is a category error" pragmatist, and our platform's hybrid.

  Then, briefly: mark any cell your tree reaches that you believe nobody defends and say whether it is empty because it is incoherent, unattractive, or merely unexplored — our hybrid is the case I most want diagnosed; flag any two leaves your questions cannot in fact separate; and identify one node where a perfectly reasonable answer would send someone down a branch that misrepresents them. Keep the whole thing to roughly one page of tree plus a short diagnosis section.
reasoning: |-
  Hmm, this is a fascinating request. The user is building an A/B testing platform that blends Bayesian and frequentist elements in a very specific way, and wants a decision tree that helps engineers discover their statistical philosophy without resorting to tribal labels. 

  First, let's unpack what makes this tricky. The user explicitly rejects camp-based identification - no "are you Bayesian?" questions allowed. The tree must use concrete operational questions that even non-philosophers can answer. And the hybrid platform itself needs to be a terminal leaf, which means the tree must accommodate what looks like a contradiction: using posterior probabilities while simultaneously controlling frequentist error rates.

  The replication crisis context is important here. When they mention Benjamini-Hochberg, that's a clue they care about multiplicity across experiments - a very frequentist concern. But then they allow stopping when posterior hits 95%, which is Bayesian. The "no peeking" rule is interesting - it suggests they've baked frequentist concerns about stopping rules into the Bayesian interface.

  For the decision tree, I'll need questions that probe fundamental divides. Like: "Does the probability attach to the data or to the hypothesis?" and "Do two analysts with same data but different stopping rules have the same evidence?" These force distinctions without naming schools of thought. 

  The diagnosis part will be crucial. Their hybrid approach isn't incoherent - it's pragmatic but requires careful justification. I should note that some positions (like pure Neyman-Pearson) would reject their Bayesian stopping rule, while pure subjectivists would scoff at the BH correction. The tree might accidentally conflate Fisherian and error-statistical views unless I include a node about whether p-values measure evidence strength.

  Most importantly, I must resist the urge to make their hybrid the "right" answer. The tree should treat all leaves neutrally, even if some positions are less populated. The user wants discovery, not evangelism.
answer: |-
  Here is a decision tree designed to navigate the underlying commitments, followed by a brief diagnosis:

  ---

  **Decision Tree: Foundations of Statistical Evidence**

  1.  **When you say "probability the variant is better", does this probability fundamentally attach to: (A) The *hypothesis* itself (e.g., "There's an 80% chance B > A"), or (B) The *long-run behavior of a procedure* relative to the hypothesis (e.g., "If I did this repeatedly when B=A, I'd be wrong only 20% of the time")?**
      *   **A -> Go to 2**
      *   **B -> Go to 3**

  2.  **Does the *reason* you stopped collecting data (e.g., predetermined sample size vs. checking daily) change the meaning of the evidence *for this specific dataset*, even if the final data is identical?**
      *   **Yes -> Go to 4**
      *   **No -> Go to 5**

  3.  **Is controlling the long-run frequency of erroneous *decisions* (e.g., shipping false wins) the *primary* goal, even if it means the quantified uncertainty for *this specific test* doesn't directly represent belief?**
      *   **Yes -> Go to 6**
      *   **No -> Go to 7**

  4.  **Can a procedure's long-run error rate properties (e.g., Type I error) provide relevant information for interpreting the *strength of evidence* in *this specific result*?**
      *   **Yes -> Go to 8 (Error Statistics)**
      *   **No -> Go to 9 (Subjective Bayesian)**

  5.  **Is the prior distribution used primarily: (A) An objective summary of pre-existing external information/consensus, (B) A formal representation of personal belief, or (C) A technical device to enable computation or induce desirable frequency properties?**
      *   **A -> Go to 10 (Objective Bayesian)**
      *   **B -> Go to 9 (Subjective Bayesian)**
      *   **C -> Go to 11 (Empirical Bayesian)**

  6.  **Should the *primary* evidence metric (e.g., p-value) be interpreted strictly as a measure against a single null hypothesis (H0), or as a tool for *choosing* between two explicit hypotheses (H0 and H1)?**
      *   **Against H0 -> Go to 12 (Fisherian)**
      *   **Choosing H0 vs. H1 -> Go to 13 (Neyman-Pearson)**

  7.  **Is the core purpose of preregistration/formal stopping rules mainly to: (A) Control long-run error rates by preventing data-dependent decisions, or (B) Ensure the analysis plan genuinely reflects the pre-data question, reducing researcher freedom to distort?**
      *   **A -> Go to 3** (Re-emphasizes long-run control)
      *   **B -> Go to 14 (Model-Checking / Reform Pragmatist)**

  8.  **(From 4) Error Statistics:** Evidence must account for the *severity* of the test passed. Long-run properties (like error rates) and sampling intentions (stopping rules) are crucial for evaluating how reliably this specific result discriminates hypotheses. (e.g., Mayo)
  9.  **(From 2/5) Subjective Bayesian:** Probability quantifies rational belief. Stopping rules are irrelevant; evidence is solely in the data + prior. Priors are personal beliefs, updated by data. (e.g., de Finetti, Savage)
  10. **(From 5) Objective Bayesian:** Seeks "non-informative" or reference priors based on formal rules (e.g., Jeffreys) or consensus information, minimizing subjectivity while using Bayes' theorem. Belief is constrained by objectivity norms.
  11. **(From 5) Empirical Bayesian:** Uses the data itself (often hierarchically) to estimate prior parameters. Focuses on practical performance. Priors are tools, not necessarily beliefs. (e.g., Robbins, Efron)
  12. **(From 6) Fisherian:** p-values measure the *strength of evidence against H0* in this experiment. No explicit alternative hypothesis or long-run decision error rates. Replication is key. Stopping rules *do* matter. (Fisher)
  13. **(From 6) Neyman-Pearson:** Focuses on optimal long-run decision rules (reject H0 / accept H1) controlling Type I/II error rates *a priori*. Evidence is defined by the decision rule's properties. Strict stopping rules essential. (Neyman & Pearson)
  14. **(From 7) Model-Checking / Reform Pragmatist:** The frequentist/Bayesian debate is secondary. The core crisis stems from poor practices (p-hacking, HARKing, neglect of assumptions). Preregistration, transparency, and robust model validation are primary. Both frameworks are flawed approximations needing reform. (e.g., Gelman, some open science advocates)
  15. **(Your Hybrid Platform):** *Reached via:* **1B** (Prob = long-run procedure) -> **3No** (But Long-run control *is* primary? Contradiction?) -> *Actually requires:* **1B** -> **3Yes** (Stopping rules *do* matter - you enforce them!) -> **6Yes** (Long-run decision control primary) -> **BUT** using a *Bayesian posterior* as the *decision trigger* within a frequentist error-control framework (BH). Unique blend: Bayesian computation/decision *at point of analysis*, but calibrated & controlled frequentist-wise *across experiments*.

  ---

  **Diagnosis:**

  1.  **"Nobody Defends" Cell:** The path **1A (Prob=Hypothesis) -> 2Yes (Stopping rules change evidence) -> 4Yes (Long-run properties bear on this result)** is likely **unattractive/incoherent**. If probability is fundamentally about the *hypothesis state* (1A), it's hard to justify why the *researcher's stopping intention* (2Yes) or *long-run performance* (4Yes) should alter that specific probability. This mixes ontological commitments awkwardly. Most who start 1A go 2No. Those concerned with stopping rules/long-run usually start 1B.
  2.  **Leaves Hard to Separate:** **Fisherian (12)** and **Error Statistics (8)** are difficult to cleanly distinguish with this tree. Both emphasize p-values and the importance of stopping rules/repeated sampling properties for evidence. A key differentiator (Fisher's inductive inference vs. Mayo's severe testing) is subtle. Adding a node like "Does a p-value directly measure the probability the null is false?" (Fisher: No, Error Stats: Still No, but it measures severity *against* the null) might help, but makes the tree less operational.
  3.  **Misrepresentation Risk:** Node **3 (Is long-run decision control primary?)** risks misrepresenting **Empirical Bayes (11)** or **Objective Bayes (10)**. An Objective/EB analyst might say "No" (3No) because they see the posterior as the evidence *now*, yet they might *also* care about and design for good frequentist properties ("Yes" to 3). The "primary" qualifier is crucial but subjective. A reasonable "No" could incorrectly send them towards Subjectivism (9) or Pragmatism (14), bypassing their actual method (10/11).
  4.  **Your Hybrid Diagnosed:** Your platform (**15**) is a **pragmatic hybrid**, not incoherent. It treats the *within-experiment posterior* as a computationally convenient *decision statistic* (operationally Bayesian), but crucially *calibrates and controls* the *overall flow of decisions* (across many tests) using frequentist error rates (BH). The enforced strict stopping rule mitigates the usual frequentist objection to Bayesian sequential analysis. It's **unattractive to purists**: Frequentists (especially Neyman-Pearson **13**) distrust the posterior as the trigger; Subjectivist Bayesians (**9**) object to the frequentist calibration overriding the posterior probability's direct belief interpretation. Its viability hinges entirely on the enforced stopping rules and the BH layer functioning as intended. It fits best under a "**Pragmatist**" (**14**) umbrella prioritizing workable solutions over philosophical purity, though it's distinct in its specific mechanism.
