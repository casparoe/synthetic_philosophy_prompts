answer: |-
  You've put your finger on a profoundly subtle and pervasive maneuver in historical and social science argumentation, especially concerning long-term trends where measurement shifts are inevitable. It’s a kind of intellectual sleight-of-hand that feels legitimate in isolation but reveals its bias when seen in aggregate. While no single, universally accepted term perfectly captures *every* facet of this specific mirrored dance, the closest conceptual framework lies within the **Duhem-Quine thesis** and its implications for **auxiliary hypotheses**.

  Here's the carving:

  At its heart, this move is the **selective application of auxiliary hypotheses concerning data quality to protect a core theoretical claim**. Every historical claim (e.g., "violence declined") relies not just on the core theory but on a network of auxiliary assumptions: that records are consistently defined, that reporting rates are stable, that institutional practices don't distort the underlying reality we're trying to measure. These auxiliary hypotheses are essential – acknowledging changes in record-keeping *is* good methodology. The problem arises when these auxiliary assumptions are invoked *only* when the raw data contradicts the desired conclusion, and conveniently ignored when the data supports it. The arguer treats the auxiliary hypotheses (about data quality) as *flexible shields* for their core thesis rather than as *fixed components* of the overall explanatory model that must be consistently applied.

  **Why the near neighbors don't quite fit:**

  1.  **Confirmation Bias:** You're right, it's not the classic "seek/ignore evidence." These scholars *engage* with the difficult data but deploy a legitimate methodological tool (critiquing data quality) selectively. It's a more sophisticated, *post hoc* filtering dressed in methodological rigor.
  2.  **Ad Hoc Rescue:** Almost, but not quite. An ad hoc rescue typically *adds* a new, unsupported auxiliary hypothesis to save the theory (e.g., inventing a new reason for a discrepancy). Here, the tool (questioning data quality due to measurement change) is legitimate and pre-existing. The "rescue" is achieved not by adding a *new* hypothesis, but by *selectively activating* a *standard* methodological caveat. It subtracts weight from inconvenient data points by attributing them to measurement artifact.
  3.  **Unfalsifiability:** The core thesis *is* technically falsifiable – a sufficiently massive, sustained shift in the data across multiple, independently measured indicators, *after* accounting for known measurement changes, *could* force a revision. The problem is the *selective barrier* erected against individual points of falsification using plausible auxiliary critiques. It makes *incremental* falsification extremely difficult.
  4.  **Cherry-Picking:** This is close, but usually refers to selecting *which datasets or cases* to include. Here, the *entire dataset* might be used, but the *interpretation of individual data points within it* is selectively challenged based on their congruence with the desired trend.

  **The Edges: Legitimate Appeal vs. Selective Shield**

  The line is drawn by **consistency and burden of proof**.

  *   **Legitimate Appeal:** An author acknowledges a measurement issue *regardless of direction* when the evidence for that issue is strong and specific (e.g., citing a law change that redefined a crime category in 1870, pointing to a known gap in pre-1850 parish records for a specific region, referencing sociological studies on under-reporting rates for domestic violence). They apply this scrutiny *even-handedly*. If they argue a spike might be artificial, they also consider if a dip might be artificial. Their argument incorporates the uncertainty introduced by measurement change into their *overall* assessment of the trend's strength and shape, rather than using it only to dismiss inconvenient points. The burden of proof is on them to demonstrate *why* the measurement artifact is the *more likely* explanation than a real change for *this specific* data point.
  *   **Selective Shield (The Move):** The artifact argument is invoked *predominantly or exclusively* when the data point contradicts the core thesis. The evidence for a *specific, relevant* measurement change coinciding precisely with *that* data anomaly is often assumed, implied, or based on generic knowledge ("record-keeping improved generally in the 19th century") rather than concretely demonstrated for that time/place/metric. Crucially, similar potential artifacts affecting data points that *support* the thesis are not mentioned or are dismissed with far less rigor. The burden of proof for an artifact explanation is applied much more lightly to inconvenient points than the burden of proof for a real change is applied to convenient points.

  **A Test for a Paragraph:**

  Read the author's explanation for a data point that *contradicts* their thesis. Then ask:
  1.  **Is the artifact argument specific?** Do they cite concrete evidence (law changes, archival studies, sociological data) for a *relevant* measurement shift *at the specific time and place* of the anomaly?
  2.  **Do they apply the *same* level of skepticism to data points that *support* their thesis?** Scan nearby sections discussing favorable data points. Are potential measurement artifacts (e.g., declining reporting rates, narrowing definitions, lost records) that could *diminish* those supportive points discussed with equal vigor and evidence? Or are those points presented as largely unproblematic?
  3.  **Where is the burden of proof?** For the inconvenient point, does the author *assume* artifact unless proven otherwise? For the convenient point, do they *assume* real change unless proven otherwise? The asymmetry reveals the move.

  **Subject Matter and Scale:**

  The nature of historical violence *does* make this particularly fertile ground. The "dark figure" of unrecorded crime is vast and unknowable; definitions (assault, murder, justifiable homicide) shift; institutions (police, coroners, courts) evolve dramatically. This inherent uncertainty *necessitates* discussing measurement issues. The fault lies not in discussing them, but in the *asymmetric* discussion. The move *is* particularly tempting here because the auxiliary hypotheses about data quality are fundamentally untestable for many past periods – we can't know precisely what wasn't recorded. This creates a perfect space for motivated reasoning to operate under the guise of methodological caution.

  The phenomenon *intensifies* when it becomes a field-wide pattern with opposing camps. Each camp develops a *consistent internal logic* for explaining away disconfirming evidence using legitimate methodological points, but the *overall field* exhibits a mirrored inconsistency. Camp A reflexively explains away spikes as artifacts, Camp B reflexively explains away dips as artifacts. Neither camp feels internal strain because their *individual* arguments, taken alone, sound reasonable. The collective irrationality emerges only from the juxtaposition.

  **Boundary Cases:**

  *   **Looks Like It, But Isn't:** A historian notes a massive spike in "deaths by misadventure" in London in 1842. They argue this *isn't* necessarily more violence, but likely reflects the new Metropolitan Police force's more systematic recording compared to the old parish watch, and perhaps a broader cultural shift towards formal inquests. They *also* note that a significant *drop* in recorded assaults in 1855 coincides with documented pressure on police to reduce reported crime statistics to show reform success, suggesting this dip *might* be artificial. **Why it's Legitimate:** The artifact arguments are specific (new police, political pressure), supported by context, and crucially, applied *in both directions* to challenge the face-value data. The burden of proof is addressed with evidence.
  *   **The Move in Action:** An author argues violence declined steadily from 1800-1900. They dismiss a sharp 1850 spike in homicide records by stating, "This likely reflects improved coroner procedures and greater public willingness to report, not an actual increase." When discussing a sharp 1870 *drop* in the same records, they declare, "This marks a crucial turning point, reflecting the civilizing influence of industrialization and declining tolerance for brutality," with no mention of potential artifacts (e.g., changes in how coroners classified deaths, political pressure to lower figures, gaps in records due to administrative changes). **Why it's the Move:** The artifact shield is deployed only against the spike. The drop is accepted as real change without applying the *same* methodological scrutiny regarding data quality that was deemed essential just moments before.

  **A Coinage (if needed):**

  While "selective application of auxiliary hypotheses" is precise but clunky, a more evocative term might be **The Auxiliary Shield Maneuver** or **Motivated Methodological Skepticism**. It captures the core: using legitimate methodological concerns (auxiliary hypotheses about measurement) as a shield, but only when necessary to deflect threats to the core thesis, motivated by the desired conclusion rather than consistent epistemological rigor.

  What you observed is the friction point between honest historical epistemology and the stubborn human tendency to defend a narrative. The best armor against it, for your research and for the scholars involved, is relentless consistency: applying the *same* critical lens to *every* data point, regardless of which way it seems to point, and demanding specific evidence for *why* an artifact explanation is more plausible than a real change for *each specific* anomaly. It's hard, often messy work, but it's the only way out of that mirrored rabbit hole.
