  We are designing a decision procedure for the Rules and Precedents Committee to determine the admissibility of motions. The procedure must be efficient (about 10 minutes per motion) and produce one of three verdicts: inadmissible, admissible (under a specified track), or refer. The output must be a single sentence plus up to three numbered reasons.

  Key rules from the rulebook:
  - Rule 101(a): Ordinary amendments require 2/3 vote, 60 days' notice, text tabled in final form, no amendment from the floor.
  - Rule 101(b): Entrenched provisions (listed) require 3/4 vote plus ratification by 2/3 of clubs within 90 days.
  - Rule 101(c): Rule 101 (including the list in 101(b)) is entrenched under 101(b).
  - Rule 7 (entrenched): Affiliated clubs cannot be deprived of the right to withdraw without their consent.
  - Rule 12: The committee's ruling on admissibility is final, and Congress cannot consider a motion ruled inadmissible.
  - Rule 3: Congress has the power to determine its own procedure (not limited by the rules).
  - Rule 44: A repealed rule cannot be re-enacted in the same or substantially the same terms at that Congress or the next.
  - Rule 205: Rules may be suspended for one meeting by unanimous consent, and business transacted under suspension has the same effect.

  The procedure must account for:
  1. The type of motion (amendment, repeal, etc.) and the rule(s) it affects.
  2. The track (ordinary or entrenched) and whether the motion meets the procedural requirements for that track.
  3. Conflicts with existing rules, especially entrenched ones.
  4. The possibility of self-reference and infinite regress in amendment clauses.
  5. The effect of the motion on the committee's own authority.

  We design a flowchart-like procedure with tests. We will define:

  - Tests: Ordered questions with pass conditions and outputs (which may be a verdict or a next step).
  - Tie-break rules: For conflicting outcomes, we need a hierarchy (e.g., entrenched rules prevail over ordinary ones, later-in-time for non-entrenched, etc.).
  - Explicit marks: Where the rulebook is silent and the committee must make a choice.

  The three verdicts:
  1. Inadmissible: The motion fails one or more mandatory tests and cannot be fixed.
  2. Admissible under [track]: The motion meets the requirements for the track it was submitted under (or we determine the correct track if mis-submitted).
  3. Refer: The motion presents an issue that the committee cannot resolve with the rulebook and must be decided by Congress (but note Rule 12: Congress cannot consider a motion we rule inadmissible, so "refer" must be used sparingly and only when the rulebook explicitly allows or when the committee's own competence is in question).

  We note that Rule 3 gives Congress power over its own procedure, so motions that are purely procedural (not changing the rules) might be admissible under Rule 3 without going through Rule 101. However, the motions we are dealing with are changes to the rules, so they must go through Rule 101 unless they are about the procedure of Congress (e.g., how to run a meeting). But Rule 12 is about the committee's power, which is a rule, so changing it would normally require Rule 101.

  Procedure Outline:

  We break down the procedure into steps. Each step is a test. We start with the motion as submitted.

  Step 1: Is the motion within the scope of Rule 101?
  - If the motion is to add, amend, or repeal a rule, then it is within Rule 101. Otherwise, it might be procedural (Rule 3) or something else. But note that Rule 101 covers rule changes. We assume the motions we get are rule changes unless stated otherwise.

  Step 2: Check the track the motion was submitted under and whether it meets the formal requirements for that track (notice, etc.).
  - If submitted under ordinary track (101(a)): Check 60 days notice, text in final form.
  - If submitted under entrenched track (101(b)): Check the motion is about an entrenched provision (or adding one) and has the required support and notice.

  But note: A motion might be mis-submitted (e.g., an entrenched change submitted as ordinary). We must check if the motion, by its content, requires the entrenched track.

  Step 3: Check if the motion conflicts with any entrenched rule (other than the one it is amending) or with Rule 44 (repeal and re-enactment ban).

  Step 4: Check self-referential issues, especially about the amendment clause and the committee's power.

  Step 5: Check for any other rule that might make it inadmissible.

  We must also consider the possibility of suspension (Rule 205) but note that suspension is for a meeting and requires unanimous consent. It is not a way to change the rules permanently.

  Tie-break rules:
  - Entrenched rules prevail over ordinary rules.
  - If two rules of the same level conflict, the later in time prevails (but note Rule 44 prevents immediate re-enactment).
  - If a rule and the amendment clause conflict, the amendment clause (as the higher rule) prevails? But note that the amendment clause is entrenched. However, we are bound by the rulebook as it stands.

  But note: The committee is not a court. We are to apply the rules as written.

  Explicit marks: Where the rulebook is silent, we must note that the committee is making a choice. For example, when a motion attempts to amend the entrenchment of itself, we have to decide based on the structure of the rules.

