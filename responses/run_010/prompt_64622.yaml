answer: |-
  Let us begin with the case you describe, for it illuminates the dispute with unusual clarity. We have two parties bargaining over the division of some good, beginning from a disagreement point of (0, 0). Initially, the feasible set S has a Pareto frontier defined by the line segments connecting (100, 0), (50, 75), and (0, 100). This kink at (50, 75) represents an asset far more valuable in Party 2's hands. The Nash bargaining solution, maximizing the product of gains over disagreement (u * v), selects (50, 75). The Kalai-Smorodinsky solution, locating the intersection of the Pareto frontier and the ray from (0, 0) through the ideal point (100, 100) – but constrained by the actual ideals achievable within S, which are 100 for Party 1 and 100 for Party 2 – selects (60, 60). The ray from (0,0) through (100,100) is the line u = v; it intersects the frontier segment from (50,75) to (0,100). Solving v = (100 - u) * (75/50) for u = v gives u = v = 60. So, even before any change, the solutions diverge significantly: Nash favors Party 2, reflecting the asset’s higher value in their possession, while Kalai-Smorodinsky enforces a symmetric outcome relative to the *potential* ideals, ignoring the asymmetric efficiency captured by the kink.

  Now, Party 1 secures an outside option yielding 150 if Party 2 gets nothing. The feasible set expands to T, with frontier segments connecting (150, 0), (50, 75), and (0, 100). The ideal points shift: Party 1's maximum achievable is now 150 (though only if Party 2 gets 0), Party 2's remains 100. The Nash solution maximizes u*v within T. The product is higher along the segment from (150,0) to (50,75) than along the segment from (50,75) to (0,100). The equation for the segment from (150,0) to (50,75) is v = (75/(150-50)) * (150 - u) = (0.75) * (150 - u). Maximizing u * [0.75*(150 - u)] yields u = 75, v = 56.25. The Kalai-Smorodinsky solution finds the intersection of the Pareto frontier of T and the ray from (0,0) through the new ideal point (150, 100). The ray has slope 100/150 = 2/3, so v = (2/3)u. The frontier segment from (150,0) to (50,75) has v = 0.75*(150 - u). Setting (2/3)u = 0.75*(150 - u) gives u ≈ 79.41, v ≈ 52.94. Both solutions move in Party 1's favor: Nash from (50, 75) to (75, 56.25), Kalai-Smorodinsky from (60, 60) to (79.41, 52.94). Crucially, Party 2 loses more under Nash (a drop of 18.75) than under Kalai-Smorodinsky (a drop of approximately 7.06). This reverses the standard narrative, where Nash is criticized for *insensitivity* to new opportunities (due to Independence of Irrelevant Alternatives - IIA) and Kalai-Smorodinsky is praised for rewarding expansion (via Individual Monotonicity - IM).

  Why the reversal? The standard critique focuses on expansions that *directly improve* a party's ideal point without altering the existing bargaining possibilities in a way that disadvantages the other party. Imagine adding a point like (110, 50) to the original set S, leaving the segment from (50,75) to (0,100) intact but raising Party 1’s ideal to 110. IIA would compel Nash to ignore this new, dominated point, leaving the solution unchanged. Kalai-Smorodinsky, via IM, would require Party 1’s payoff not to decrease, likely shifting the solution towards Party 1. In *your* case, however, the expansion (adding (150,0)) does not merely add a dominated alternative; it fundamentally alters the *shape* of the frontier near the disagreement point, introducing a new, steeply sloped segment favoring Party 1. IIA is not violated by Nash's change because the *relevant* alternatives – the comparisons determining the product maximum – have shifted dramatically within the new set T. The old solution (50,75) is still feasible in T, but it is no longer the product-maximizer. Kalai-Smorodinsky changes primarily because Party 1’s ideal has surged from 100 to 150, stretching the ray and pulling the solution towards higher values of u, even though the new maximum (150) requires Party 2 to get zero. The axiom IM *demands* Party 1 not lose when its ideal increases, which it doesn't; it gains substantially. The key distinction is the *nature* of the expansion: adding dominated points versus expanding the frontier in a way that shifts the efficient trade-offs or dramatically changes the ideals. Your case involves the latter, exposing what the axioms truly track: IIA focuses on the *removal* of unchosen alternatives (or the preservation of the solution if they are added back, provided they don't alter the frontier's relevant slope), while IM focuses on *shifts in the bargaining power* signaled by changes in ideal payoffs. Nash reacts to changes in the *local trade-offs* along the frontier, Kalai-Smorodinsky reacts to changes in the *global aspiration levels*.

  Comparing the rules fairly requires acknowledging their different baselines. We cannot simply say Nash "hurts" Party 2 more in the shift because it started from a point more favorable to Party 2. The meaningful comparison is the *directional response* relative to each rule’s initial allocation *within the same set*. Before the expansion, Nash gave Party 2 75 vs Kalai-Smorodinsky’s 60. After, Nash gives Party 2 56.25, Kalai-Smorodinsky 52.94. So Nash reduces Party 2's payoff by 18.75 (25% of their initial Nash gain), while Kalai-Smorodinsky reduces it by approximately 7.06 (about 11.8% of their initial KS gain). Both rules move against Party 2, but Nash moves proportionally more *relative to its own starting point for S*. This underscores Nash's sensitivity to the altered frontier slope near the disagreement point, while Kalai-Smorodinsky's movement is driven by the inflated ideal pulling the proportionality ray.

  Now to the core dispute: which conception of fairness better withstands scrutiny? Defenders of Kalai-Smorodinsky emphasize the intuitive pull of IM. It seems perverse, they argue, that Party 1 securing a better outside option (even if only attainable by leaving Party 2 with nothing) should *harm* Party 2 in the cooperative bargain. Shouldn't fairness allow Party 1 to benefit from their improved prospects? The "equal sacrifice" intuition – each party surrenders the same fraction of their maximum possible gain – also holds surface appeal. It promises a kind of proportional fairness indexed to potential. However, this appeal unravels upon examination. First, indexing fairness to *ideal payoffs* rewards bluffing and manipulation. Party 1 could artificially inflate their ideal by threatening to pursue an extravagant, implausible outside option requiring Party 2's utter ruin, even if that option has no bearing on the actual cooperative possibilities (*u* + *v*) achievable together. Kalai-Smorodinsky would shift the solution in Party 1's favor based solely on this theatrical threat. Second, and more fundamentally, the "equal sacrifice" metric is morally arbitrary. Why should the fraction of what one *could* extract unilaterally (if the other capitulated) determine fair division? This confuses bargaining power with desert. In your initial set S, Party 2 can genuinely create more value (75 at u=50) than Party 1 can create alone (100 at v=0) when the asset is involved. Nash recognizes this efficiency advantage inherent in Party 2's position. Kalai-Smorodinsky ignores it, insisting on symmetry relative to abstract ideals. Party 2's "sacrifice" from their ideal (100 to 75 in Nash, 100 to 60 in KS) seems larger under KS precisely because KS pretends Party 2 could achieve 100 while cooperating with Party 1, which the kinked frontier shows is impossible – achieving v=100 requires u=0, not cooperation. The ideal point in asymmetric cases often reflects not pure individual capability, but the *cost inflicted on the other* by defection. Basing fairness on this invites rewarding the party who can credibly threaten greater harm.

  Nash’s IIA, often maligned, embodies a robust principle of fairness: the agreed-upon division should depend only on the options actually available and the relative strength of claims *within* the feasible set, not on irrelevant alternatives that were never chosen or could not be jointly achieved. It focuses on the cooperative surplus and its efficient division. In your case, the expansion to T doesn't just add a new point; it creates a whole new set of efficient trades highly favorable to Party 1 near the disagreement point. Why *shouldn't* this shift the balance? Party 1 now has a stronger fallback, altering the opportunity cost of cooperation. The Nash product captures this shift in the local marginal rates of substitution. The loss to Party 2 under Nash isn't a punishment for Party 1's good fortune; it's a recognition that Party 1's improved alternatives strengthen their position within the cooperative framework itself. Fairness, under this view, is about the relative gains from *cooperation above disagreement*, and how the set of jointly efficient possibilities shapes the equitable split of that surplus. IIA protects this focus from being distorted by phantom alternatives or inflated threats. The strongest counter-argument – that IIA seems to ignore genuine improvements in a party's prospects – is blunted by recognizing that Nash *does* respond when the improvement alters the *relevant* frontier, as in your case. It only appears unresponsive when the new options are dominated and thus irrelevant to the efficient bargaining trade-offs.

  Your tempting reconciliation – Nash as strategic prediction, Kalai-Smorodinsky as arbitrator's norm – ultimately fails. While Rubinstein's alternating-offer model converges to Nash under frictions vanishing, Kalai-Smorodinsky can also be implemented strategically (e.g., through specific protocols involving demands based on ideals). More importantly, the *axioms* are explicitly normative. They are presented as properties a fair solution *should* possess. To treat IIA as merely a property of strategic equilibria, or IM as merely a property appealing to mediators, dodges the philosophical question: which axiom captures a more defensible principle of distributive fairness? We must choose based on the substance of the claims.

  Therefore, I commit: a fair-minded third party should use the Nash solution. Its reliance on IIA ensures stability against strategic inflation of ideals and ties the outcome strictly to the shape of the jointly achievable surplus. It respects the actual efficiency advantages parties bring to the table, as revealed by the frontier, rather than hypothetical maxima attainable only by destroying cooperation. In your specific case, recommending (75, 56.25) after Party 1's outside option improves is fairer than (79.41, 52.94). The shift rewards Party 1 for genuinely enhancing their best *cooperative* alternatives relative to disagreement, not merely for an abstract increase in their potential to go it alone.

  What should the third party say to Party 2, who sees their payoff fall? "The recommendation has changed because the fundamental landscape of our negotiation has changed. Previously, the most efficient joint outcomes strongly favored your position due to the specific asset. Party 1's new arrangement alters the options available to us all. While it doesn't allow them to combine their maximum gain with a substantial payoff for you, it does provide them with significantly better alternatives *if* cooperation fails or yields only modest results for them. This strengthens their position in determining how we share the gains from working together. The solution reflects the new reality of what each of you brings to the table and the opportunity cost of failing to agree. Your share, while lower than before, still represents a substantial gain over having no agreement at all, and it is determined by the same principle of maximizing our joint advantage relative to that baseline of disagreement. The fairness lies in respecting the actual cooperative possibilities and our respective contributions to their value, not in holding Party 1 back from benefiting from their new opportunities or indexing your share to claims based on outcomes that are impossible for us to achieve jointly."

  The Nash solution, grounded in the cooperative surplus and immune to irrelevant threats, provides the more coherent and manipulation-resistant account of fairness in bargaining. Kalai-Smorodinsky's appeal to proportional sacrifice relative to ideals, while intuitively attractive in symmetric cases, proves too sensitive to bargaining bluster and too detached from the actual value creation possibilities that define the terms of cooperation in asymmetric realities like the one you present.
