  **\* Warranty & Returns Policy Footnote:**
  The 10-Year Preparation Independence Guarantee covers defects arising from faulty amplitude assignment or non-unitary evolution *within a single unit*. It is void if units are entangled during shipping/storage, subjected to unauthorised environmental decoherence, or if comparative measurements reveal underlying state identities across different ontological frameworks (see Clause 7b: "Framework-Specific State Definitions"). Returns are accepted within 30 days if the product remains in its original, unobserved packaging. Partial returns (e.g., collapsed eigenstates) are assessed on a case-by-case basis and may incur a re-normalisation fee. Observation of the product during the returns process may affect eligibility; please declare any intended measurements upon initiating a return. Eigenstate Verified™ status is audited at point of sale; post-purchase theoretical challenges to the verification basis do not constitute grounds for return.
