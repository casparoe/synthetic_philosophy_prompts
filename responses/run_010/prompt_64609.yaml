prompt: |-
  You are a philosopher of biology who specializes in the conceptual foundations of quantitative genetics and who has spent years training working science journalists to read behavioral-genetics papers. Think carefully before you answer, and begin with a short brainstorming section: which distinctions in the technical literature have to survive translation into newsroom practice, and which can be dropped without producing a falsehood. State plainly which ones you are dropping and what you lose by dropping them.

  I cover science and ideas for a general-interest outlet. Roughly twice a month a heritability claim lands on me: a twin-study preprint, a large-biobank GWAS, a direct-to-consumer genomics press release, a policy argument resting on the premise that a trait is mostly genetic. I have about forty minutes per item, no statistics training beyond what a good explainer gives me, and a standards editor who must sign off on any sentence that attributes variance. What I need is a reusable procedure, not an essay about heritability.

  Write it as numbered steps in the order I should run them. For each step give the question I should put to the paper or release, what counts as a sufficient answer, what I write if the answer is absent, and whether the step is a genuine test or a judgment call wearing a test's clothing. The procedure must terminate in one of a small fixed set of verdicts — kill the item; report the finding without a number; report it with a qualified number; report it and flag the framing separately — and for the two middle verdicts it must hand me one usable sentence of copy that is accurate without collapsing into "it's complicated."

  It has to handle at least these: variance explained in this sample versus what travels to another population or another environment; twin-based and SNP-based estimates of the same trait that disagree, and which one a reporter should quote; a heritability figure that is statistically sound but whose newsworthiness depends on an immutability claim the number does not support; and the situation I see most often, where the paper is careful and the press release is not.

  Then run the procedure end to end on three items: a genomics company's release announcing that a behavioral condition is forty percent genetic, where the underlying work reports variance explained in one biobank; an adolescent twin-study preprint reporting high heritability of risk-taking, alongside a published commentary arguing the estimate falls sharply in low-income subsamples; and a policy proposal to sort students using polygenic scores derived almost entirely from a single ancestry group, where the paper's numbers and hedging are exemplary. At least one of these should come out in a way I will not like — do not soften it.

  Finish with the limits: which questions this procedure can never settle, where a reporter will still be guessing, and what would have to be true for the whole apparatus to be quietly misleading. No bibliography, reading list, or citations, please; I cannot verify them and do not need them.
reasoning: |-
  Hmm, the user is a science journalist covering behavioral genetics with limited time and statistical background. They need a practical, step-by-step procedure to evaluate heritability claims that can output clear editorial decisions. This is urgent because they face frequent deadlines and must avoid misrepresenting complex concepts like heritability.

  Key distinctions that must survive translation: 
  1. Heritability ≠ genetic determinism (the % doesn't predict individual outcomes or modifiability) 
  2. Sample-specificity (estimates don't automatically generalize) 
  3. Method differences (twin vs SNP heritability measure different things) 
  4. Gene-environment interactions (effects aren't fixed across contexts)

  Distinctions I'll drop: 
  - Broad-sense vs narrow-sense heritability (lose precision about gene interactions but avoid overwhelming reporters) 
  - Exact statistical models (lose technical nuance but gain practicality) 
  - Historical debates about heritability (irrelevant for breaking news)

  The procedure must handle core challenges: generalization across populations, conflicting estimates between methods, misinterpretation of immutability, and press release hype vs paper rigor. It needs to output one of four verdicts with template sentences for middle options.

  For the test cases: 
  1. The DTC genomics claim (40% genetic) should get heavily qualified - it's likely misleading without context 
  2. The twin study with environmental variation should show how estimates change - highlighting the commentary is crucial 
  3. The polygenic scoring proposal must be flagged for ancestry bias even with good numbers

  The limits section will note irredeemable cases like claims about between-group differences or studies with fatal design flaws. The whole framework could be misleading if researchers systematically obscure limitations - but that's why step 3 demands transparency checks.

  Now structuring the 10-step procedure: 
  Start with existence of a number (step 1), then origin check (2), followed by three interpretation safeguards (3-5). Sample representativeness (6-7) comes before conflict resolution (8), then press release alignment (9). Verdict selection (10) uses a decision tree.

  Template sentences avoid "it's complicated" by focusing on what the number actually shows: e.g., "This estimate applies to [group] in [context]" or "The study doesn't confirm this is fixed." Hard stops kill items when methodology is unsalvageable.

  For the genomics company case: verdict is "qualified number" with strong caveats about generalization. The twin study gets "qualified number" emphasizing environmental variation. The polygenic proposal gets "flag framing" because the numbers are sound but application is ethically fraught.

  Final warnings: 
  - Can't resolve "nature vs nurture" debates 
  - Can't verify unstated assumptions 
  - Beware of entire fields built on limited populations

  This gives the reporter guardrails without requiring statistics retraining. The trade-off is some oversimplification, but that's necessary under their constraints.
answer: |-
  Here's a reusable 10-step procedure. It prioritizes preventing false implications over technical completeness. **Dropped distinctions:** Broad-sense vs. narrow-sense heritability (lose precision about non-additive effects); specific statistical models (lose nuance about bias sources); historical/ideological debates (lose context but avoid unverifiable claims). Core surviving distinctions: **Estimate vs. determinism, This sample vs. generalizable, Twin study vs. SNP-based, Press release vs. paper.**

  **Procedure: Evaluating a Heritability Claim**

  1.  **Is there a specific heritability number (%)?**
      *   **Question:** What is the exact percentage claimed for the trait?
      *   **Sufficient Answer:** A single number (e.g., "40% heritable") or a clear range from the primary source (paper/preprint).
      *   **If Absent:** "The research suggests genetics plays a role, but does not provide a specific estimate of its contribution relative to other factors." → *Report without number*.
      *   **Genuine Test?** Genuine test.

  2.  **Where does the number originate?**
      *   **Question:** Is this number directly from the peer-reviewed paper/preprint, or only in the press release/secondary source?
      *   **Sufficient Answer:** Clear identification of the primary source (e.g., "Figure 3B in the preprint", "Table 2 in the published paper"). If only in PR, trace it back *now*.
      *   **If Absent:** Kill the item. (Cannot verify core claim).
      *   **Genuine Test?** Genuine test.

  3.  **What does the number actually measure? (The Anti-Determinism Check)**
      *   **Question:** Does the primary source explicitly state that this % is *not* the portion "caused by genes" in an individual or the portion that is unchangeable? Does it mention "variance explained" or "population-specific estimate"?
      *   **Sufficient Answer:** Language like "proportion of phenotypic *variance*", "estimate specific to this population/environment", "does not imply determinism/immutability" in Results/Discussion.
      *   **If Absent:** **Major Red Flag.** Note: "The paper does not explicitly clarify that this estimate describes variation in a specific group, not fixed genetic causation in individuals."
      *   **Genuine Test?** Genuine test (checking for presence/absence of critical caveats).

  4.  **How was it measured? (Twin, SNP, Other?)**
      *   **Question:** What methodology produced the estimate (e.g., Twin study, GCTA/GREML on SNP data, family study)?
      *   **Sufficient Answer:** Clear description in Abstract/Methods (e.g., "monozygotic/dizygotic twin correlations", "SNP-based heritability (h²SNP) using LDSC regression").
      *   **If Absent:** Kill the item. (Methodology is fundamental).
      *   **Genuine Test?** Genuine test.

  5.  **Is there an "immutability" implication? (Framing Check)**
      *   **Question:** Does the press release/paper's framing (headlines, interpretations, policy recs) imply this % means the trait is largely unchangeable or fixed by genes? Listen for words like "hardwired," "innate," "determined," "fixed," "unavoidable" in *framing*.
      *   **Sufficient Answer:** Framing focuses on understanding variation, origins, or risk prediction *without* implying trait immutability or downplaying environment.
      *   **If Absent:** Note: "The presentation implies genetic determinism/immutability not supported by the heritability estimate itself."
      *   **Genuine Test?** Judgment call (interpreting tone/implication).

  6.  **Who was studied? (Sample Check 1: Representativeness)**
      *   **Question:** Describe the study population (e.g., age, ethnicity, nationality, socioeconomic status, specific recruitment like biobank volunteers).
      *   **Sufficient Answer:** Clear demographics in Methods/Participants section.
      *   **If Absent:** Note: "The study population is not clearly described, limiting understanding of who this estimate applies to." → Proceed cautiously.
      *   **Genuine Test?** Genuine test (checking description exists).

  7.  **Does the paper discuss generalizability? (Sample Check 2: Travel Warning)**
      *   **Question:** Does the paper explicitly discuss whether/how this estimate might differ in other populations or environments? Look for caveats in Discussion/Limitations.
      *   **Sufficient Answer:** Statements about potential differences by age, SES, culture, environment, genetic ancestry; or GxE interaction tests reported.
      *   **If Absent:** Note: "The paper does not address how this estimate might differ in other groups or settings."
      *   **Genuine Test?** Genuine test (checking for presence/absence).

  8.  **Are conflicting estimates known? (Conflict Check)**
      *   **Question:** Does the paper mention, or is it widely known from prior literature (e.g., cited commentary, review), that other methods (esp. twin vs. SNP) or other populations yield *significantly different* estimates for this trait?
      *   **Sufficient Answer:** Paper discusses "missing heritability" (for SNP < Twin), cites conflicting studies, or includes commentary/replication showing difference (e.g., by SES).
      *   **If Absent:** Assume no major known conflict *for now*. Note: "No discussion of conflicting estimates from other methods/populations was found."
      *   **Genuine Test?** Judgment call (requires knowing/checking for prominent conflicts). *Prioritize conflicts mentioned in the paper/commentary itself.*
      *   **Which to Quote?** Default to the estimate from the *new* study if sound, but **flag the conflict explicitly** if material (e.g., SNP vs Twin, or high vs low SES). Avoid blending numbers.

  9.  **Press Release vs. Paper Alignment**
      *   **Question:** Compare the press release's headline, lead, and key claims about the % and its meaning to the primary source's Abstract/Conclusion/Discussion caveats. Are there discrepancies?
      *   **Sufficient Answer:** Press release accurately reflects the number, methodology, limitations, and avoids stronger framing than the paper.
      *   **If Absent:** Note specific discrepancies, especially determinism, immutability, over-generalization, or omission of key caveats.
      *   **Genuine Test?** Judgment call (comparing tone/emphasis).

  10. **Issue Verdict & Write**
      *   **Rules:**
          *   **Kill Item:** If step 2 fails (no verifiable number) OR step 4 fails (methodology unclear) OR step 3 absent *and* step 5 present (no caveats + determinism framing) OR significant undisclosed fatal flaw found during steps.
          *   **Report without Number:** If step 1 fails (no number) OR step 3 absent *and* you cannot confidently counter determinism framing.
          *   **Report with Qualified Number:** If steps 1-4 pass, step 3 present (or strongly implied by standard methodology), caveats exist (steps 6/7), and step 5 absent/minor. **Use Template Sentence.**
          *   **Report & Flag Framing Separately:** If steps 1-4 & 7 pass, step 3 present, *but* step 5 present (determinism framing) OR step 9 present (PR misalignment) OR step 8 present (conflict) OR step 7 absent is critical for context (e.g., policy proposal). **Use Template Sentence + Framing Flag.**
      *   **Template Sentence (For Qualified Number):** "The study estimates that genetic differences account for approximately [X]% of the variation in [Trait] observed *within this specific group* of [Brief Population Description, e.g., UK adults in the UK Biobank, adolescent twins in Sweden]."
      *   **Framing Flag (Separate Sentence):** Choose as needed:
          *   "However, the [Press Release/Proposal] framing suggests this means [Trait] is largely fixed by genes, which the study does not show."
          *   "This estimate may not apply to people with different backgrounds or life experiences."
          *   "Notably, other research methods/populations suggest a different contribution of genetics for this trait."
          *   "The researchers emphasize this is about differences within a group, not fixed traits in individuals."

  ---

  **Applying the Procedure**

  **Item 1: Genomics Company Release: "Behavioral Condition X is 40% Genetic" (Based on Biobank h²SNP)**
  1.  Number? Yes, 40%.
  2.  Origin? Press release. Trace: Biobank study paper reports h²SNP = 0.40 for Condition X. **Pass.**
  3.  Anti-Determinism? Paper uses "SNP heritability", "variance explained". Caveats in Limitations: "Estimates are specific to this population." **Pass.**
  4.  Method? Paper: GREML analysis on Biobank SNP data. **Pass.**
  5.  Immutability Implication? **PR Headline: "Condition X is 40% Genetic" implies inherent, fixed portion. Fails.**
  6.  Sample? Paper: Adults of European ancestry in UK Biobank (volunteers). **Pass.**
  7.  Generalizability? Paper: Mentions ancestry limitation, no strong GxE tests. **Note: Absent for other environments/SES.**
  8.  Conflict? Known: Twin studies for similar conditions often show h² > h²SNP (e.g., 60% vs 40%). Paper notes "missing heritability". **Conflict exists.**
  9.  PR vs Paper? **PR drops "variance explained" & "population-specific", implies trait-level determinism. Major misalignment.**
  10. **Verdict: Report & Flag Framing.**
      *   *Template Sentence:* "The underlying study estimates genetic differences account for approximately 40% of the variation in Condition X diagnoses *within the specific group* of adults of European ancestry in the UK Biobank."
      *   *Framing Flags (2 needed):* "However, the company's claim that 'Condition X is 40% genetic' misleadingly implies a fixed portion is biologically determined, which the study does not show. Heritability estimates describe variation in a group, not fixed causation in individuals." AND "This estimate may not apply to people of other ancestries or significantly different life circumstances. It also likely underestimates the total role of inherited factors compared to some other research methods."

  **Item 2: Twin-Study Preprint: High Heritability of Risk-Taking + Commentary on Low-Income Drop**
  1.  Number? Preprint: h² = 0.65 (twin-based). Commentary: Cites h² ~0.25 in low-SES subsample. **Pass.**
  2.  Origin? Preprint & Commentary. **Pass.**
  3.  Anti-Determinism? Preprint: "Heritability (h²)", "proportion of variance". Standard twin design implies variance explanation. **Pass.**
  4.  Method? Preprint: Classical twin design. **Pass.**
  5.  Immutability Implication? Preprint framing is cautious (focuses on etiology). Commentary emphasizes modifiability. **Pass (unless preprint overhypes).**
  6.  Sample? Preprint: Nationally representative adolescent twins in [Country]. **Pass.**
  7.  Generalizability? **Preprint:** Might mention age/culture limitations. **Commentary: Directly shows h² drops sharply in low-SES subsample (GxE).** **Critical presence.**
  8.  Conflict? **Explicitly presented:** Preprint reports overall h²=0.65. Commentary shows h²~0.25 in low-SES group. **Major conflict by environment.**
  9.  PR vs Paper? N/A (Preprint + Commentary, assume careful).
  10. **Verdict: Report & Flag Framing.**
      *   *Template Sentence:* "The twin study estimates genetic differences account for approximately 65% of the variation in risk-taking behaviors observed *within this specific group* of adolescents in [Country]."
      *   *Framing Flag:* "Crucially, a separate analysis highlighted in a commentary shows this genetic contribution appears significantly smaller (around 25%) among adolescents from low-income families in the same study, demonstrating how environmental context shapes the role of genetics."

  **Item 3: Policy Proposal: Sort Students Using Polygenic Scores (PGS) (Exemplary Paper, Single Ancestry)**
  1.  Number? Paper reports PGS prediction accuracy (e.g., r=0.30, explains 9% variance) for academic trait. **Pass.**
  2.  Origin? Policy doc cites paper. Paper is exemplary. **Pass.**
  3.  Anti-Determinism? Paper: "PGS explains X% variance", "limited predictive power", "not deterministic", "ancestry bias critical". **Exemplary Pass.**
  4.  Method? Paper: PGS derived and validated using standard GWAS/PGS methods. **Pass.**
  5.  Immutability Implication? **Policy Proposal:** Implies PGS reflects innate potential suitable for sorting. **Fails.**
  6.  Sample? Paper: Very clear: GWAS/PGS built *only* on European-ancestry individuals. **Pass.**
  7.  Generalizability? Paper: **Explicitly warns against cross-ancestry use, shows poor prediction in other groups.** **Critical presence.**
  8.  Conflict? PGS accuracy for complex traits is universally low-moderate (<10-15% variance) and highly ancestry-specific. Noted in paper. **Conflict with deterministic interpretation inherent.**
  9.  PR vs Paper? Policy Doc vs Paper: **Policy Doc ignores ancestry warnings & low variance explained, framing PGS as robust tool for sorting. Gross misalignment.**
  10. **Verdict: Report & Flag Framing.**
      *   *Template Sentence:* "The underlying research shows a polygenic score derived from studies of people *exclusively* of European ancestry can predict approximately 9% of the variation in [Academic Trait] *within groups of similar European ancestry*."
      *   *Framing Flags (2 needed):* "However, the policy proposal to use this score for sorting students relies on a misleading interpretation of its meaning and limitations." AND "The researchers strongly caution this score performs poorly and unfairly for individuals of other ancestries and only captures a small fraction of the factors influencing academic outcomes, which are heavily shaped by environment and opportunity."

  **(You won't like Item 1 & 3 verdicts - they force heavy qualification/critique of the PR/Policy framing despite sound underlying numbers in the paper.)**

  ---

  **Limits of the Procedure**

  1.  **"Why" Questions:** Cannot resolve *why* heritability is high/low or the specific gene-environment interplay. You report the estimate, not the mechanism.
  2.  **True Causal Effects:** Cannot distinguish direct genetic effects from effects mediated by environment (e.g., evocative rGE). The estimate includes both.
  3.  **Between-Group Differences:** **Crucially, the procedure CANNOT validate claims about genetic causes of *average differences between groups* (e.g., races, sexes).** Heritability *within* groups says nothing about causes of differences *between* groups (the **Layzer/Chipman/Lewontin point**). If a claim hinges on this fallacy, kill the item. The procedure flags this only if the paper/PR explicitly makes the error (Step 5/9).
  4.  **Undeclared Fatal Flaws:** Cannot detect profound methodological errors hidden in stats/methods not checked here (e.g., severe population stratification uncorrected, flawed twin modeling assumptions). Relies on peer review and absence of red flags in steps 3/4/6.
  5.  **Judging "Implication":** Relies on reporter's judgment for Steps 5, 8, 9. Overly cautious or under-cautious interpretations are possible.
  6.  **Novelty/Importance:** Doesn't assess if the finding is genuinely new or significant beyond the number itself.
  7.  **When the Whole Apparatus Misleads:** This procedure would be **quietly misleading** if:
      *   A field systematically ignores a critical limitation (e.g., pervasive unmodeled GxE, severe ancestry bias never mentioned).
      *   Peer review consistently fails to catch fatal flaws relevant to these steps.
      *   The core concept of heritability is so fundamentally misinterpreted by the audience that even perfect caveats fail (a societal, not procedural, limit).
      *   The study design itself (e.g., extreme ascertainment bias) makes the reported heritability estimate meaningless, and this isn't obvious from steps 3/4/6.
