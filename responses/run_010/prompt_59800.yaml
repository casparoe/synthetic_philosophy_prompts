prompt: |-
  A friend of mine — an old poker player who spent some years at it for a living, and who reads more carefully than his job title suggested — recently wrote up a long post on the Kelly criterion and sent it to me before publishing. I have no formal training in any of this. I have been reading about probability and betting on my own for a couple of years, mainly to work out how large a stake to put down in situations where I believe I have an edge. Here is the core of his post, condensed but I hope not distorted:

  "Kelly betting is what you get when you take expected value seriously and apply it to a whole sequence of decisions instead of a single one. The rule — stake the fraction (bp − q)/b of your bankroll, where p is your chance of winning, q your chance of losing, and b the odds offered — is the choice that makes the logarithm of your wealth grow as fast as possible. Because wealth compounds multiplicatively rather than additively, maximizing that growth rate is the same thing as maximizing expected wealth; people who insist the two come apart are doing arithmetic on a problem that is geometric. The rule also settles the question of ruin. Stake the Kelly fraction and you are always left holding some positive portion of your bankroll, so no streak of losses, however improbable, can ever wipe you out. Nor is the rule merely the best performer on average: across a long enough run of bets, the Kelly bettor's wealth exceeds that of every other bettor with probability one, whatever fractions of their bankrolls the others choose. That is why the criterion does not depend on your being able to repeat the gamble — the growth-rate argument constrains a single wager just as firmly as it constrains a thousand. The only objection worth taking seriously is that you have to know the true odds and nobody ever does; but that is an objection to decision theory in general rather than anything peculiar to Kelly, and in practice you simply plug in your best estimate."

  I suspect the post is more right than wrong, and I am inclined to think its critics are squeamish about large swings rather than actually confused. Two things snag for me anyway, and I cannot tell whether they are real problems or my own ignorance. First, I have been staking something like half of what the formula tells me for years, and I have never been able to articulate a reason for it beyond a vague fear that I have overestimated my edge; if my friend is right, I have been giving up growth for no principled reason at all. Second, "with probability one" is doing a great deal of work in that paragraph and I have no way to judge how much it can bear.

  So please go through the passage claim by claim and tell me what someone who actually works on this subject would accept without comment, what is a simplification that costs nothing, and what is wrong. For each part that is wrong, give me the correct statement and then identify which step in my friend's own reasoning generated the error — I want the mechanism, not merely the verdict. Then tell me whether the two headline conclusions, that ruin is impossible and that the Kelly bettor finishes ahead of everyone else with probability one, survive once the faulty premises are repaired, or whether repairing the premises dissolves them. I would also like to know what the repaired version implies about my half-sized stakes: is that a superstition, or is it the right response to something the post waved away?

  Finish with a committed judgment rather than a balanced one: is this, overall, a fair summary of the Kelly criterion, and if it is not, which single error does the most damage to the argument as a whole? I would much rather you take a position and defend it than set out the considerations on both sides and leave the weighing to me. I am not looking for references or suggestions of further reading — I have no way to chase them down and would rather have the reasoning itself. Please write in American English.
reasoning: |-
  Hmm, this user is deeply engaged with the Kelly criterion and has a sharp eye for detail. They're clearly not a novice - they've been applying fractional Kelly for years based on intuition, which shows practical experience. The core question is about dissecting their friend's passionate defense of full Kelly betting.

  The friend's claims are... bold. Let me unpack this systematically. The geometric growth argument holds water - that multiplicative compounding makes log growth the right metric. And yes, Kelly does prevent ruin mathematically by never betting the entire bankroll. But the "probability one" dominance claim? That's where things get dicey. It relies on infinitely many bets, which isn't just unrealistic - it's mathematically fragile when you consider real-world estimation errors.

  I recall a paper by Samuelson that demolished this idea decades ago. In finite time horizons, overbetting can actually beat Kelly with nonzero probability. The friend's dismissal of half-Kelly as irrational fear misses the key point: estimation error turns full Kelly into Russian roulette. The user's instinct to halve stakes isn't superstition - it's Bayesian wisdom dressed as intuition.

  The ruin protection argument survives scrutiny, but only in a technical sense. In practice, betting full Kelly when you're 10% wrong on odds can drop your survival probability alarmingly. That "plug in your best estimate" line is the real poison pill here - it handwaves away the entire problem of uncertainty that makes fractional Kelly essential.

  What the user needs is confirmation that their half-stakes aren't cowardice but sophistication. The friend isn't wrong about Kelly's theoretical beauty, but they're dangerously dogmatic. The deepest flaw is treating estimated probabilities as known - that's not just a simplification, it's a category error that invalidates the whole "probability one" dominance argument in real applications.
answer: |-
  Here's a breakdown of your friend's claims, identifying what holds, what's simplified, and what's incorrect, followed by a committed judgment. I'll adhere strictly to your requirements: no references, American English, and a direct verdict.

  **Claim-by-Claim Analysis:**

  1.  **"Kelly betting is what you get when you take expected value seriously and apply it to a whole sequence of decisions instead of a single one."**
      *   **Verdict:** **Simplification that costs nothing.** Kelly *does* optimize for long-term growth in repeated bets by maximizing the expected *logarithm* of wealth. This is fundamentally different from maximizing expected *linear* wealth (which would often lead to betting everything or nothing). Thinking in terms of sequences is the core insight.

  2.  **"The rule — stake the fraction (bp − q)/b of your bankroll..."**
      *   **Verdict:** **Accept without comment.** This is the standard formula for the "full Kelly" fraction when there's a win/loss outcome with net odds `b` (e.g., `b`-to-1), win probability `p`, and loss probability `q = 1-p`.

  3.  **"...is the choice that makes the logarithm of your wealth grow as fast as possible."**
      *   **Verdict:** **Accept without comment.** This is the fundamental definition and derivation of the Kelly Criterion for repeated, identical, independent bets with known probabilities.

  4.  **"Because wealth compounds multiplicatively rather than additively, maximizing that growth rate is the same thing as maximizing expected wealth..."**
      *   **Verdict:** **Incorrect.**
      *   **Correct Statement:** Maximizing the expected *logarithm* of wealth (the growth rate) is *not* the same as maximizing expected *linear* wealth. Maximizing expected linear wealth over a single bet often leads to betting your entire bankroll if you have *any* edge, which carries a high risk of ruin over repeated bets. Kelly explicitly sacrifices some potential linear wealth expectation to manage risk and maximize the *rate* of compounding.
      *   **Error Mechanism:** Your friend confuses the *objective functions*. Kelly maximizes `E[log(Wealth)]` (geometric mean growth rate). Maximizing `E[Wealth]` (arithmetic mean) is a different objective, suitable for single bets or situations where ruin is impossible/irrelevant. They come apart precisely *because* wealth compounds multiplicatively.

  5.  **"The rule also settles the question of ruin. Stake the Kelly fraction and you are always left holding some positive portion of your bankroll, so no streak of losses, however improbable, can ever wipe you out."**
      *   **Verdict:** **Accept without comment (for known probabilities).** This is mathematically true. Since the fraction bet `f = (bp - q)/b` is always less than 1 (because `bp - q < b` when `p < 1`), your bankroll after any loss `(1 - f) * Bankroll` is always positive. Ruin is impossible in the strict mathematical sense.

  6.  **"Nor is the rule merely the best performer on average: across a long enough run of bets, the Kelly bettor's wealth exceeds that of every other bettor with probability one, whatever fractions of their bankrolls the others choose."**
      *   **Verdict:** **Overstated/Incorrect in practical terms.**
      *   **Correct Statement:** In the *infinite* long run, with known *true* probabilities `p` and `q`, the Kelly strategy has the property that it will *almost surely* (with probability one) exceed the wealth of any other *essentially different* strategy (one that bets a different constant fraction forever) *eventually*. However:
          *   **"With probability one" relies on infinitely many bets.** Real betting sequences are finite. In any finite sequence, other strategies (especially fractional Kelly or even over-betting) can, and often do, outperform full Kelly with significant probability.
          *   **It does not dominate *all* other strategies.** More complex, adaptive strategies could theoretically exist. The dominance is specifically against other constant-fraction strategies.
          *   **"Exceeds that of every other bettor" is too strong.** It dominates any *single* other constant-fraction strategy asymptotically. But if you compare Kelly to *many* different strategies simultaneously, the statement that Kelly beats *all* of them simultaneously with probability one isn't strictly guaranteed by the standard proofs (though it's often informally stated).
      *   **Error Mechanism:** Your friend takes a powerful asymptotic mathematical result (Breiman's Theorem) and applies it too literally to finite real-world scenarios and against *all* possible strategies. The phrase "with probability one" is valid *only* as the number of bets `N` approaches infinity. For any finite `N`, the probability that Kelly is ahead of a specific other fraction is high but *less than one*, and the probability it's ahead of *all* others simultaneously is lower still.

  7.  **"That is why the criterion does not depend on your being able to repeat the gamble — the growth-rate argument constrains a single wager just as firmly as it constrains a thousand."**
      *   **Verdict:** **Incorrect.**
      *   **Correct Statement:** The Kelly Criterion is fundamentally derived for *repeated* betting. Its justification (maximizing long-term growth rate) evaporates for a *single* bet. For a single bet, the optimal strategy (if maximizing expected wealth is the goal and ruin is irrelevant) is often to bet everything if `p > 1/(b+1)`. Kelly's fraction for a single bet simply represents the bet size that *would* maximize long-term growth *if* that single bet were repeated infinitely often with the same edge and no other bets. It has no special optimality property for a truly one-time gamble.
      *   **Error Mechanism:** Your friend conflates the *fraction derived for a repeated gamble* with having inherent optimality for a *single instance*. The growth-rate argument *only* makes sense in the context of repetition. The fraction `f` is defined relative to your current bankroll, but its optimality is defined over a sequence.

  8.  **"The only objection worth taking seriously is that you have to know the true odds and nobody ever does; but that is an objection to decision theory in general rather than anything peculiar to Kelly, and in practice you simply plug in your best estimate."**
      *   **Verdict:** **Severely Understated / The Core Flaw.**
      *   **Correct Statement:** While estimation error *is* a general decision theory problem, it is **particularly devastating** for full Kelly betting. Plugging an overestimate of your edge (`p` too high or `b` too favorable) into the formula leads directly to **over-betting**. Over-betting significantly increases risk of drawdowns, reduces long-term growth compared to the strategy based on the *true* probability, and dramatically increases the probability of ruin compared to the theoretical guarantee. This sensitivity is *far* more pronounced and dangerous with Kelly than with more conservative staking methods. Saying "plug in your best estimate" ignores the catastrophic consequences of estimation error inherent in the Kelly formula itself.
      *   **Error Mechanism:** Your friend dismisses the profound interaction between the Kelly formula's structure and estimation error. The formula `f = (bp - q)/b` is highly sensitive to inputs `p` and `b`. Small overestimations of `p` or `b` can lead to large overestimations of `f`. Betting `f` based on an overestimated edge is mathematically equivalent to *over-betting* relative to the true edge, which is known to be ruinous and suboptimal. This isn't just a "general decision theory" problem; it's an *amplifier* of that problem built into the Kelly recipe.

  **Survival of Headline Conclusions After Repair:**

  1.  **"Ruin is impossible":** **Survives, but only technically for known probabilities.** If the true `p` and `b` are known and used, ruin is mathematically impossible betting full Kelly. *However*, the moment estimation error exists (which is always), the guarantee vanishes. Betting `f` based on an overestimated edge *can* and *does* lead to ruin in practice. The guarantee is fragile.
  2.  **"Kelly bettor finishes ahead of everyone else with probability one":** **Dissolves in practical reality.** The "probability one" dominance is an infinite-horizon mathematical result requiring known true probabilities. In finite sequences with estimation error (the real world), Kelly (especially full Kelly based on estimates) often *lags* behind more conservative strategies for long periods and can be beaten by other strategies with significant probability. It does *not* dominate in any practically meaningful sense.

  **Your Half-Sized Stakes:**

  *   **Verdict:** **Principled and Rational Response, NOT Superstition.**
  *   **Reason:** Betting half-Kelly (`f_estimated / 2`) is a well-known and highly recommended strategy called **Fractional Kelly**. It is the **right response to estimation error**, which your friend wrongly dismissed. By betting half the recommended fraction based on your *estimated* edge, you significantly reduce the risk of severe drawdowns and ruin caused by overestimating your edge. While it slightly reduces your *potential* growth rate *if* your edge estimate is perfectly accurate, it dramatically increases the *robustness* of your strategy to estimation errors and reduces the volatility of your bankroll growth. Given that no one ever knows true probabilities perfectly, fractional Kelly (like your 1/2 Kelly) is often considered *superior* to full Kelly in practice. Your "vague fear" of overestimating your edge was well-founded intuition.

  **Committed Overall Judgment:**

  *   **Is this a fair summary?** **No, it is not a fair summary.**
  *   **The Single Most Damaging Error:** **The dismissal of estimation error ("plug in your best estimate") and the failure to recognize the Kelly formula's extreme sensitivity to it.** This error permeates the entire argument:
      *   It invalidates the practical relevance of the "ruin impossible" guarantee.
      *   It renders the "probability one dominance" argument meaningless in the real world.
      *   It falsely portrays conservative betting (like your 1/2 Kelly) as unprincipled fear, when it is actually a rational response to uncertainty.
      *   It leads to the dangerous and incorrect claim that Kelly applies to single bets.
      *   It obscures the fact that the core justification (maximizing growth rate) is critically dependent on knowing the *true* probabilities.

  Your friend captures the *theoretical* essence of Kelly for known probabilities in repeated bets (points 1-3, 5) but then overstates its dominance (6), misapplies it to single bets (7), and fatally understates the paramount issue of estimation error (8). This final error fundamentally undermines the practical applicability and safety of betting full Kelly based on estimates, which is the only way anyone *can* use it. The post presents a compelling but ultimately misleading view that underestimates the risks and overstates the guarantees of the Kelly strategy in actual practice. Your approach of using half-Kelly is sound.
