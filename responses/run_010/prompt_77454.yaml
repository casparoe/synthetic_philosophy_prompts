prompt: |-
  I am a commercial litigator, and for the past eighteen months I have been reading Indian epistemology on my own time — currently a chapter on the pramāṇas. In the course of that reading I have become convinced that a move I make constantly in my day job is being discussed there, but I cannot tell which term covers it, or whether one term covers it at all. I would like to identify the operation precisely, and I care far more about the boundaries than about the label.

  The move, described without any vocabulary from either field: I come to hold a definite new belief, and I hold it with the confidence of something known rather than conjectured, yet I cannot produce a rule that generated it. What I can produce is a pair of things I was already quite sure of which cannot both stand exactly as they stand — one of them has to be supplemented by something that neither of them mentions. The supplement is what I end up believing. Three instances, in increasing order of difficulty:

  1. A counterparty's audited accounts show revenue rising steadily over three years and headcount falling by roughly a third over the same period. Both figures are reliable, and neither says anything about the other. I nonetheless find myself settled — not suspicious, settled — on the view that a material part of the revenue comes from an activity the accounts are not broken out to disclose. If cross-examined I can manufacture a generalisation ("firms that shed staff while growing revenue usually…"), but the generalisation feels like something I produced afterwards to dress the belief up, not the thing that produced it.

  2. A witness whom I have independent reason to believe is alive and in the city does not answer at the only address anyone has for him; the flat is dark, the neighbours have not seen him in a week, his post is uncollected. I leave believing he is staying somewhere else in the city. Here I suspect two operations have occurred and I cannot tell whether they are one or two: the flat first told me he is not there, and then that, combined with his being alive and in town, told me he must be somewhere else. Is the second step a further move of its own kind, or a trivial consequence of the first?

  3. Two provisions of the same agreement. Clause 4 gives the buyer an unqualified right to inspect the seller's premises at any time; clause 11 obliges the seller to keep certain process details confidential from every third party absent the seller's own consent. Each is unambiguous on its face, and I end up holding a belief that belongs to neither: that inspection under clause 4 cannot extend to carrying off the process documentation, or equivalently that clause 11 carries an unstated exception for the buyer. This belief is not about the world at all but about what one of the words must mean, and it arose only because the two provisions could not otherwise stand together.

  My questions:

  - Is there a term of art for the operation common to these cases, either in Western epistemology or in the Indian literature I am reading? For orientation: the chapter I am in lists perception, inference, comparison, and testimony as the means of knowledge accepted by its school, and remarks in passing that other schools extend the list, without saying with what. I am fairly sure my case is not among the four listed, but I cannot rule out that it is a species of inference that I am misdescribing.
  - How much of my description does that term actually cover? Instance 3 looks like an interpretive manoeuvre rather than a way of acquiring knowledge about the world, and instance 2 may be two moves rather than one. I want the category's edges drawn explicitly, together with a statement of which of my three cases fall outside and why.
  - The feature I care most about is the missing rule. My reading suggests the school whose list I quoted above holds that anything of this shape is really inference, with a suppressed universal doing the work. Set out the strongest form of that reduction as applied to my three instances, and then the strongest form of the objection that something is lost — what exactly is lost, and in which instance it is lost most clearly. I am not asking you to referee the dispute; I am asking for both sides at full strength.
  - Is this the same thing as what people call inference to the best explanation? The two are often compared. In my experience the felt shapes differ: with the best explanation I have rival candidates and I weigh them, whereas here I have no rivals and the posit arrives as forced, with any alternative needing special pleading of its own. Is that difference philosophically real, or an artefact of easy cases — given that in the genuinely hard cases I do generate rivals after the fact?
  - Finally, if you judge that no single established category covers all three instances, say so plainly and propose a term of your own, with a definition tight enough to exclude at least one of the three and to exclude ordinary inference and ordinary conjecture.

  Two notes on what I am not after. Please do not assemble a bibliography, a reading list, or citations; I will find the sources myself and a guess at them would be worse than nothing. And please do not settle for a name: what I want is the carving — the definition, the contrasts with the nearest neighbours, and the boundary cases, including a clear account of what this operation is not.
reasoning: |-
  Okay, let me approach this systematically. The user presents a fascinating puzzle about an epistemic move they recognize in litigation that resembles Indian epistemological concepts. Their core concern is identifying the precise cognitive operation where a new belief emerges forcefully without explicit rules, mediated by tension between existing certainties.

  First, I need to analyze their three examples for common structure. All share: 
  (1) Two firmly held prior beliefs (A and B) 
  (2) Recognition of incompatibility without modification 
  (3) Emergence of supplemental belief (C) as necessary resolution 
  (4) Absence of conscious rule application 
  (5) Phenomenological "forcedness" 

  The challenge is mapping this to Indian pramāṇa theory. Among the four standard pramāṇas: 
  - Perception (pratyakṣa) doesn't fit - no sensory input causes C. 
  - Testimony (śabda) is absent. 
  - Comparison (upamāna) seems irrelevant. 
  - Inference (anumāna) is the closest candidate but requires explicit vyāpti (universal premise).

  The user suspects this isn't standard anumāna, which tracks with classical Nyāya requirements. However, some schools like Mīmāṃsā have arthāpatti (postulation) precisely for such cases - where unstated C must be true for A and B to coexist. This seems promising for all three examples: 
  - Example 1: Revenue rise + staff reduction → undisclosed activity 
  - Example 2: Alive in city + absent at home → staying elsewhere 
  - Example 3: Unrestricted inspection + confidentiality → implied exception 

  But boundaries matter. Arthāpatti typically requires: 
  - A and B directly conflict, not merely suggest 
  - C is the only possible resolution 
  - Operates in both empirical and conceptual realms 

  This covers even Example 3's contractual interpretation because the conflict makes C necessary for coherence. The "missing rule" is key - arthāpatti doesn't rely on recalled universals but on impossibility of coexistence without C.

  Contrast with inference to best explanation (IBE): 
  - IBE weighs competing hypotheses 
  - Arthāpatti has no alternatives - C is singular solution 
  - User's phenomenology of "forcedness" aligns with arthāpatti 

  Strongest reductionist argument (Nyāya): All cases reduce to inference with implicit vyāpti like "when staff fall and revenue rises, undisclosed activities exist." But this falters in Example 3 where the conflict is conceptual - no empirical generalization applies.

  The non-reductionist counter: What's lost is the immediacy of seeing necessity in the specific case without general rules. This is clearest in Example 3 where the contractual conflict resolution feels like conceptual insight rather than empirical inference.

  Thus arthāpatti covers all three instances well. For precision: 
  - Excludes cases with alternative resolutions 
  - Excludes standard inference with explicit rules 
  - Excludes mere conjecture 

  Final note: The phenomenological "forcedness" and absence of alternatives distinguishes this sharply from IBE and ordinary abduction.
answer: |-
  Based on your description and the phenomenological core of your "move" — **the forced emergence of a definite belief (C) resolving an incompatibility between two prior certainties (A and B), without conscious rule-application** — the established Indian epistemological category that precisely fits all three instances is **arthāpatti** (postulation or presumption). Below is a detailed carving of the concept, addressing each query explicitly.

  ### 1. The Term and Its Coverage
  - **Term**: **Arthāpatti** (अर्थापत्ति)  
    - *Definition*: A distinct pramāṇa (means of knowledge) recognized primarily by Mīmāṃsā and Vedānta schools (e.g., Kumārila Bhaṭṭa, Prabhākara). It is the cognition of an unperceived fact (C) necessitated by an irreconcilable conflict between two established truths (A and B), where C alone resolves the incompatibility.  
    - *Contrast with your listed pramāṇas*:  
      - Not **perception** (pratyakṣa): C is not sensorily observed.  
      - Not **inference** (anumāna): No explicit universal ("vyāpti") links A/B to C.  
      - Not **comparison** (upamāṇa): No similarity-based analogy (e.g., "like a cow").  
      - Not **testimony** (śabda): No verbal authority.  
    - *Coverage of your cases*:  
      All three instances fall squarely within arthāpatti:  
      - **Instance 1**: A (revenue ↑) and B (staff ↓) conflict → C (undisclosed activity).  
      - **Instance 2**: A (alive in city) and B (absent at home) conflict → C (staying elsewhere).  
      - **Instance 3**: A (unrestricted inspection) and B (confidentiality) conflict → C (implied exception).  
      Even Instance 3 (interpretive) qualifies: Arthāpatti applies to conceptual/logical conflicts (e.g., Vedic texts), not just empirical ones.  

  ### 2. Boundaries and Exclusions
  - **Core Boundaries of Arthāpatti**:  
    - **Necessity**: C *must* be true for A and B to coexist; alternatives are inconceivable without contradiction.  
    - **Non-Derivability**: C cannot be known through other pramāṇas *in this context* (e.g., you didn’t infer C from a rule).  
    - **Immediacy**: C emerges directly from the conflict, not via deliberation.  
  - **What Arthāpatti Excludes** (drawing explicit edges):  
    - **Ordinary conjecture (sambhāvanā)**: Guesses without necessity (e.g., "Maybe revenue rose due to inflation").  
    - **Inference (anumāna)**: Rule-based derivations (e.g., "Smoke → fire" via universal "smoke implies fire").  
    - **Abduction (Western)**: Hypotheses explaining data *without* logical conflict (e.g., "The dark flat suggests he moved").  
  - **Edge Cases Excluded from Arthāpatti**:  
    - *If A and B are compatible without C* → Not arthāpatti.  
      *Example*: Revenue rises (A) and staff fall (B), but no conflict exists (e.g., automation explains both).  
    - *If C is directly perceivable/testable* → Not arthāpatti (e.g., if you *saw* the witness at another address).  
    - *If alternatives to C exist* → Not arthāpatti.  
      *Example*: Witness absent (A) and alive (B) → Could be kidnapped (C1) *or* staying elsewhere (C2). Arthāpatti requires C as the *only* resolution.  

  ### 3. The "Missing Rule" Debate: Reduction vs. Autonomy
  **Reductionist View (Nyāya School)**:  
  - *Strongest argument*: Arthāpatti is implicit inference (anumāna). A suppressed universal ("vyāpti") underlies all cases:  
    - Instance 1: "When staff ↓ and revenue ↑ *without explanation*, undisclosed activity exists."  
    - Instance 2: "If alive in city and not at home, must be elsewhere."  
    - Instance 3: "If clauses conflict, an exception must be implied."  
  - *Reductionist strength*: All cases *can* be reconstructed as inferences post hoc. The "forcedness" is psychological, not epistemic.  

  **Non-Reductionist View (Mīmāṃsā School)**:  
  - *Strongest objection*: What is lost is the **immediate apprehension of necessity** in the specific case.  
    - Instance 1: No universal rule exists; firms *could* automate, not hide activities. You grasp C *only* because A/B conflict uniquely here.  
    - Instance 3 (clearest loss): The conflict is conceptual, not empirical. No "rule" governs contractual interpretation; you see the *meaning* must bend to avoid absurdity.  
  - *Key loss*: The **particularity** of the resolution. Inference relies on generalizations, but arthāpatti resolves *this* conflict in *this* context alone.  

  ### 4. Relation to Inference to the Best Explanation (IBE)
  - **Difference is philosophically real**:  
    - **IBE**: Involves *weighing* hypotheses (C1, C2...) to explain data. Rivals are explicit (e.g., "Revenue rose due to inflation vs. hidden activity").  
    - **Arthāpatti**: No rivals; C is *singularly necessitated* by the A/B conflict. Alternatives require *denying* A or B.  
  - **Your phenomenology is key**: In IBE, belief is tentative; in arthāpatti, it is "forced." Even in hard cases, rivals arise *after* the initial arthāpatti (e.g., you first *see* the exception, then consider alternatives defensively).  

  ### 5. Final Assessment and Proposed Term
  - **Verdict**: **Arthāpatti covers all three instances** exhaustively. No new term is needed; the Indian category is precise.  
  - **Definition Refined for Boundaries**:  
    > *Arthāpatti*: The non-inferential cognition of an unstated fact (C) as the *only* possible resolution to an irreconcilable conflict between two established facts (A and B), where C alone restores coherence without denying A or B.  
  - **Exclusions by Definition**:  
    - **Excludes Instance 2 if split**: If "flat dark → not home" is inference (universal: "dark flats imply absence"), then *only* "not home + alive → elsewhere" is arthāpatti.  
    - **Excludes ordinary inference**: If a rule is explicit (e.g., "contracts imply good faith"), it’s anumāna.  
    - **Excludes conjecture**: If C is possible but unnecessary (e.g., "maybe the witness is dead"), it’s sambhāvanā.  

  ### Summary of Key Contrasts
  | **Feature**          | **Arthāpatti**                               | **Inference (anumāna)**               | **Conjecture (sambhāvanā)**       |  
  |----------------------|---------------------------------------------|--------------------------------------|----------------------------------|  
  | **Basis**            | Conflict (A/B incompatibility)              | Universal rule + observation         | Possibility without necessity    |  
  | **Belief Certainty** | Forced, definite                            | Rule-dependent, definite             | Tentative, probabilistic         |  
  | **Alternatives**     | None conceivable                            | Multiple if rule weak                | Explicit rivals                  |  
  | **Your Cases**       | All three                                   | None (rules feel retroactive)        | Excluded by necessity            |  

  **Conclusion**: Your "move" is arthāpatti. Its boundaries are marked by the *necessity* of C to resolve a specific conflict, excluding cases where rules apply, alternatives exist, or the conflict is absent. The "missing rule" is intrinsic to arthāpatti’s autonomy — it captures the immediacy of seeing *what must be* in a unique situation, prior to generalization.
