prompt: |-
  I'm a third-year philosophy PhD student and this term I'm co-running a little "argument clinic" for the first-years — people bring in one page with the central argument of their draft on it and we poke at it for 45 minutes. Embarrassingly large share of what gets brought in is some version of a transcendental argument: the author wants to say that some commitment (to the external world, to other minds, to a norm, to the value of their own agency) is a condition of the possibility of something the antagonist can't give up, so the antagonist is self-stultifying. Sometimes that's a real argument. A lot of the time it's a conditional with a modal word bolted on so it sounds deep, or a regress argument, or just "denying this would be expensive for you" wearing the costume.

  What I want is a one-page triage procedure the first-years can run on their own draft in maybe 20 minutes before they come to the session. Not a history lecture — a sequence of questions to ask of the argument in order, where for each one you say what a passing answer looks like, what a fail looks like, and whether a fail means stop-with-a-verdict (here's what the argument actually is instead) or hand it to the group because the question is about how demanding we want our label to be rather than about the shape of the argument. Ground it in what people actually mean by the term — the Kantian conditions-of-possibility idea, the anti-sceptical use and Strawson's and Putnam's versions of it, the performative-contradiction stuff from discourse ethics, the constitutivist versions that run through agency and practical identity — and build in whatever Stroud's objection forces on you, including the modest/ambitious split. But the point is that it has to be usable by someone who's read none of that, so keep the name-dropping to a minimum and put the work in the questions.

  Then run it on three sketchs, all of which I've compressed and possibly mangled, so treat them as given rather than trying to reconstruct a real paper:

  A. To deliberate at all is to take one's choices to be based on reasons. Taking one's choices to be based on reasons commits one to there being reasons. So anyone who deliberates is committed to there being reasons, and the global error theorist about reasons cannot both deliberate and deny this.

  B. If I were a brain in a vat in the way the sceptic describes, my word "vat" could not pick out vats. So the sceptic's hypothesis, as I would express it, does not say what she needs it to say. Hence that particular global hypothesis is not coherently statable by me, and the sceptic loses her best case.

  C. This one is mine, so be blunt. Any disagreement that is genuinely a disagreement — as opposed to two people talking past each other — presupposes that the parties share enough standards for one of them to be answerable to the other. A relativist who says no standards are shared across frameworks cannot present her view as correcting mine, since correcting requires exactly the sharing she denies. Therefore there are standards shared across frameworks.

  For each of the three, show the sheet being run: which question it passes or fails, at what point the procedure stops, and what the verdict is in the sheet's own vocabulary. C is the one I think works, so if your procedure kills it I want to know clearly whether that's a defect in the argument or an artefact of where you drew the line between passing and failing — and I want the artefact possibility taken seriously rather than waved at. Also tell me what the procedure can't do at all (I assume it can't tell anyone whether the claimed enabling condition is actually true, only whether the argument has the right shape — but say what else falls outside), and flag every step where the sheet is really a judgment call in a procedural costume, because if I hand this out and someone spots that, the whole thing loses authority in the room.

  One more thing before you build it: if you think the request rests on something confused, say so plainly instead of giving me a polished one-pager that quietly begs the question. I have a nagging worry that "transcendental argument" isn't one form with a checkable shape at all — that it's a family of moves sharing a rhetorical register — and that any triage sheet will mostly sort arguments by how closely they resemble the examples the sheet was built from. If that's right, I'd rather hear it flat out, plus whatever narrower version of the task is worth doing instead. Same goes if you think the honest sheet would have so many "ask the group" escape hatches that it stops being a procedure and becomes a list of topics.
reasoning: |-
  Hmm, the user is a third-year philosophy PhD student running an "argument clinic" for first-years. They're seeing a lot of what appear to be transcendental arguments, many of which are weak. They want a one-page triage sheet to help students evaluate their own arguments before the clinic sessions.

  I need to create a practical tool that helps identify genuine transcendental arguments versus impostors. Key requirements: it must be usable in 20 minutes by someone without specialized knowledge, grounded in philosophical tradition but not name-droppy, and include clear pass/fail criteria with instructions on when to stop or bring to the group.

  The user has three concerns: 1) That "transcendental argument" might not be a coherent category, 2) That the triage sheet might just measure resemblance to canonical examples, and 3) That C (their argument) should survive if valid. I should address these directly.

  For the triage sheet, I'll structure it as a flowchart-like sequence of questions. Each question needs: pass/fail criteria, consequence of failing (stop or discuss), and examples. I'll draw from Kantian conditions of possibility, anti-skeptical arguments (Strawson/Putnam), performative contradictions, and constitutivism while avoiding jargon.

  Core components should include:
  - Identifying the target commitment (X)
  - Identifying the enabling condition (Y)
  - The "cannot give up" criterion
  - The modal connection (necessity)
  - Stroud's objection (modest vs. ambitious)
  - Avoiding common failure modes (disguised conditionals, mere costliness, etc.)

  For the three examples:
  - A (constitutivist): Likely fails at ambitious claim (reasons exist vs commitment to reasons)
  - B (Putnam-esque): Passes as modest transcendental argument
  - C (user's): Passes as modest, but ambitious claim might need discussion

  I'll explicitly note the sheet's limitations: can't assess truth of premises, only structure; judgment calls at certain steps; and it's better at spotting fakes than confirming validity.

  The user's meta-concern is valid - transcendental arguments are indeed a family resemblance concept. The sheet will necessarily favor certain paradigms. I'll be transparent about this, positioning the tool as a "spot the impostors" filter rather than a definitive taxonomy. This seems like the most honest and practically useful approach for their clinic context.
answer: |-
  Here’s a one-page triage sheet for first-years to self-assess potential transcendental arguments (TAs), designed for 20-minute use. It focuses on **structural validity** (does it *attempt* a TA?) not soundness (are premises true?). Grounded in core TA features: targets *necessary conditions* for an *inescapable activity*, exposing self-undermining denial. Avoids historiography but embeds Stroud’s modesty constraint.

  ---

  ### **TRANSCENDENTAL ARGUMENT TRIAGE SHEET**  
  *Run these questions in order. Stop if you hit a "VERDICT". "DISCUSS" means bring it to the group.*

  1.  **WHAT IS THE TARGET?**  
      *Ask: What commitment (X) is the argument trying to force on the antagonist?*  
      - **PASS:** X is clearly stated (e.g., "reasons exist," "external world exists," "shared standards exist").  
      - **FAIL:** X is vague, or the argument isn't clearly forcing a *specific* commitment.  
      - **CONSEQUENCE:** FAIL → STOP (VERDICT: *Not targeting a commitment clearly. Likely not a TA.*)

  2.  **WHAT IS THE ENABLER?**  
      *Ask: What activity or capacity (Y) does the argument claim *requires* X? (Y must be something the antagonist *cannot plausibly renounce*).*  
      - **PASS:** Y is specific, fundamental, and truly inescapable (e.g., "deliberating," "using the word 'vat' meaningfully," "engaging in correction").  
      - **FAIL:** Y is avoidable, trivial, or not demonstrably necessary for the antagonist's position/life (e.g., "believing in democracy," "using complex math").  
      - **CONSEQUENCE:** FAIL → STOP (VERDICT: *Enabling activity (Y) is not genuinely inescapable. Argument is probably "denial is costly" not TA.*)

  3.  **THE NECESSITY CLAIM**  
      *Ask: Does the argument explicitly or strongly imply X is a *necessary condition* for Y? (Look for "must," "requires," "presupposes," "condition of possibility").*  
      - **PASS:** Clearly states Y *cannot* happen/be coherent without X.  
      - **FAIL:** Only says Y is *better* or *easier* with X, or implies a contingent link. Mere conditional ("If Y, then X") without necessity.  
      - **CONSEQUENCE:** FAIL → STOP (VERDICT: *Lacks modal force. Likely a disguised conditional or regress argument, not TA.*)

  4.  **THE SELF-APPLICATION TEST (Stroud's Fork)**  
      *Ask: Does the antagonist *actually engage in Y*? And does denying X *directly undermine their ability to engage in Y*?*  
      - **PASS:** Yes, clearly (e.g., sceptic *uses* "vat," error theorist *deliberates*, relativist *corrects*). Denying X makes Y incoherent *for them*. (Points to *Modest* TA: antagonist is inconsistent).  
      - **WEAK PASS/AMBITIOUS?:** Argues Y is necessary for *any possible thinker/language-user*, so *no one* can deny X. (Points to *Ambitious* TA: proves X true). *Flag this as AMBITIOUS*.  
      - **FAIL:** Antagonist might avoid Y, or denying X doesn't clearly sabotage *their* performance of Y.  
      - **CONSEQUENCE:**  
          *   PASS (Modest) → Continue to 5.  
          *   WEAK PASS (Ambitious) → DISCUSS (Verdict hinges on acceptability of Ambitious TAs).  
          *   FAIL → STOP (VERDICT: *No self-undermining shown. Argument doesn't trap the antagonist.*)

  5.  **THE PERFORMATIVE CONTRADICTION CHECK (Optional, but common)**  
      *Ask: Does *stating the denial of X* itself *require* Y (and thus X)?*  
      - **PASS:** Yes, clearly (e.g., stating "no shared standards" is an act of correction requiring shared standards). Strengthens the TA.  
      - **FAIL:** No strong link between *stating denial* and Y.  
      - **CONSEQUENCE:** PASS → TA structure looks good (Modest). FAIL → TA structure might still hold if 1-4 pass, but weaker. *No STOP, just note.*

  **OUTPUT:**  
  *   **Passed 1-4 (Modest):** *Plausible Modest Transcendental Argument.* Focus clinic on truth of premises (especially step 2 & 4) and whether Modest conclusion is sufficient.  
  *   **Flagged Ambitious at 4:** *Attempts Ambitious Transcendental Argument.* **DISCUSS** feasibility of Ambitious TAs in clinic.  
  *   **Stopped Early:** *Unlikely a genuine TA.* Likely: disguised conditional (Fail 3), "denial is costly" (Fail 2), or misses the target (Fail 1). Bring to clinic as *that* type of argument.

  **WHAT THIS SHEET CAN'T DO:**  
  *   Prove the necessity claim (Step 3) is *true* (Is deliberation *really* impossible without commitment to reasons?).  
  *   Prove the enabling activity (Y) is *truly* inescapable (Step 2) (Could a being *truly* avoid all deliberation?).  
  *   Judge if an Ambitious TA (Step 4 Weak Pass) *succeeds* – only the group can wrestle with that.  
  *   Assess the broader philosophical merit or originality – only the TA structure.

  **JUDGMENT CALL ALERTS (Where the sheet wears a costume):**  
  *   **Step 2 (Inescapability):** Deciding if Y (e.g., "using language," "thinking") is *truly* unavoidable involves philosophical judgment. The sheet flags strict avoids, but borderline cases need **DISCUSS**.  
  *   **Step 4 (Self-Undermining):** Assessing if denying X *really* makes Y incoherent *for the antagonist* is interpretive. The sheet relies on your best case – clinic pressure-tests it.  
  *   **Step 4 (Ambitious Flag):** Calling an argument "Ambitious" is a judgment about its *scope*, not automatically a flaw. The sheet forces this distinction into the open for **DISCUSS**.

  ---

  **Applying the Sheet to Your Examples:**

  **A. Deliberation & Reasons**  
  1.  **PASS** (Target: There being reasons).  
  2.  **PASS** (Enabler: Deliberating - arguably inescapable for a philosopher).  
  3.  **PASS** (Necessity: Deliberating *requires* taking choices to be based on reasons, which *requires* commitment to reasons).  
  4.  **WEAK PASS/AMBITIOUS?:** Claims the error theorist *deliberates* (so Modest: they are inconsistent). But "cannot both deliberate and deny this" *suggests* Ambitious (denial impossible for a deliberator). **VERDICT:** *Plausible Modest TA, but pushes Ambitious.* **DISCUSS** (Ambitious claim: Does deliberating *require* reasons *exist*, or just *commitment* to them? Sheet says: Bring Ambitious angle to group).

  **B. Brain in a Vat**  
  1.  **PASS** (Target: My words refer to external things / Sceptical hypothesis is false *for me*).  
  2.  **PASS** (Enabler: Using the word "vat" meaningfully (as I do) - hard to avoid using language).  
  3.  **PASS** (Necessity: Meaningful use of "vat" *requires* causal connection to vats (in my context)).  
  4.  **PASS (MODEST):** Sceptic uses language (incl. "vat") to state hypothesis. *My* statement of the hypothesis undermines *its own* intended meaning *for me*. Doesn't prove no BIVs, just that *I* can't coherently *state* the worry. **VERDICT:** *Plausible Modest Transcendental Argument.* Passes triage.

  **C. Relativism & Shared Standards (Your Argument)**  
  1.  **PASS** (Target: There are standards shared across frameworks).  
  2.  **PASS** (Enabler: Engaging in genuine disagreement/correction (specifically, presenting relativism as *correcting* non-relativism) - core philosophical activity, hard for relativist to renounce *if* they engage dialectically).  
  3.  **PASS** (Necessity: Correcting someone *requires* shared standards to which the corrected is answerable).  
  4.  **PASS (MODEST):** Relativist *is* (presumably) engaging in correction by presenting their view. Denying shared standards directly undermines the possibility of *this specific corrective act*. **VERDICT:** *Plausible Modest Transcendental Argument.* Passes triage.  
      *   **Why it passes & C survives:** It successfully traps the *relativist in the act of arguing*. The conclusion "Therefore there are standards shared across frameworks" *is* Ambitious, BUT the argument only *uses* the relativist's *own act* to force inconsistency (Modest). The sheet flags the *conclusion's scope* as potentially Ambitious, but the *argument structure* (the trap) is solidly Modest and passes. Clinic discussion: Is presenting relativism *necessarily* an act of "correction" requiring shared standards? Is the Modest conclusion enough, or does the Ambitious conclusion overreach?

  ---

  **Your Nagging Worry: Is This Coherent?**  
  You're right to worry. "Transcendental argument" **is primarily a rhetorical/therapeutic *move*,** not a single formal structure. It's defined by:  
  1.  **Target:** Something apparently deniable (X).  
  2.  **Leverage:** An apparently undeniable activity (Y).  
  3.  **Strategy:** Show denying X makes Y impossible/absurd *for the denier*.  
  4.  **Goal:** Trap the denier in performative inconsistency or self-refutation.  

  **The triage sheet *is* a resemblance detector.** It filters for arguments *trying* this move. It's excellent at spotting:  
  *   **Impostors:** "Denying X is costly" (Fails Step 2), "If Y then X" (Fails Step 3), missing self-application (Fails Step 4).  
  *   **Weak TAs:** Where Y is escapable or the necessity claim is shaky.  

  It *cannot* definitively prove an argument is a "True TA™". **Its value is practical:**  
  1.  **For Students:** Forces clarity on Target (X), Enabler (Y), and the necessity/self-undermining links. Catches common bad habits.  
  2.  **For Clinic:** Efficiently sorts arguments. "Stopped" ones get help with their *actual* structure. "Passed Modest" focus on premises. "Flagged Ambitious" sparks meta-debate.  

  **This is the narrower, worth-doing task:** A filter for **arguments attempting the transcendental *move*** and a tool to **diagnose common failures** in that attempt. It makes the implicit structure explicit for critique. It won't settle whether Kant was right, but it will make clinic time more productive. The "DISCUSS" flags and Judgment Call Alerts are essential honesty – they show where philosophical work *begins*, not ends.
