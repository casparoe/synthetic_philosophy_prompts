prompt: |-
  For about four years I've been the volunteer who tries to get two groups in my town to stop fighting and actually agree to something, running out of a community program at the library. I should say up front I have no philosophy or economics training, I've just sat through a lot of these and started thinking about why some of them work.

  Here's the idea I keep turning over. Most of these fights get run like there's one pie and we're arguing about slices, but usually the two sides care about different things, so they could trade: you take the thing you care way more about, I take the thing you don't care that much about. Somebody on a podcast called that gains from trade, and then another guest said it can't work with values because you can't measure caring on the same scale across two groups. I don't know who's right. I just know that when it works it really works, and when it fails I can't predict it in advance.

  What goes wrong, from my side of the table:

  - Both sides insist everything is a dealbreaker, so I can't tell who actually cares more, and the louder one wins by default. Ive tried getting each side to privately write down what they'd trade and what they'd never trade, and it just produces two lists of nevers.
  - Some offers look like a trade but feel wrong in a way I can't name, especially when money is offered in exchange for the other side publicly saying it supports something.
  - Sometimes there is genuinely nothing to trade, because both sides want the same physical thing used two different ways, and splitting it gives each of them a worse version of what they wanted. Half a building and half a grove of oaks is a bad building and dead trees.
  - One side usually has money and the other doesn't, so I worry that a deal which only works because of the money is just bribery with extra steps.

  What I want is something I can actually run: the questions to ask in order, what counts as a good enough answer to each, where the procedure stops with a no-deal, and where it hands the decision back to the two groups because it's about thier values and not a fact I could check. Conditions: two hours, one room, six or so people from each side, nobody trained in any of this, and whatever comes out has to be written down in plain language and then ratified by both groups' committees a week later, so it can't depend on subtlety. I get one of these maybe every couple of months, so it has to be something I can remember rather than study for.

  Run it on two real-ish cases from here. Both are about a parcel with old oaks and a crumbling cemetery fence that the preservation side wants kept as is and the housing side wants to put 40 units on the edge of. Case one: preservation drops its appeal against the project if the developer pays to restore the fence and stonework properly, and everybody keeps saying in public what they actually believe. Case two: same money, but preservation also agrees to publicly endorse the project and say in the paper that they support it, which would get it built about a year sooner. I'll admit I want case two to come out fine, because the money is real and the year matters to people who need housing. Tell me if it isn't.

  Give me the answer as a numbered list of exactly five items, a sentence or two each, with nothing before the list and nothing after it: items 1 through 3 are the steps of the procedure in order, item 4 says what each of the two cases comes out as, and item 5 says which of the three steps you're least sure of, what would change your mind about it, and where you expect me to watch this fall apart in the room.
reasoning: |-
  Okay, the user is a volunteer mediator dealing with two conflicting groups in their town. They've been doing this for four years through a library community program. They don't have formal training in philosophy or economics but have learned through experience. Their main idea is that conflicts often involve groups caring about different things, so they should trade instead of fighting over a fixed pie. But sometimes this fails unpredictably.

  They mentioned problems like both sides declaring everything a dealbreaker, trades feeling "wrong" especially when money is involved, no room for compromise when both want the same physical resource, and power imbalances with money leading to bribery concerns.

  They want a practical procedure: steps to follow in order, what responses are acceptable, when to stop, and when to hand decisions back. Constraints are two hours, one room, six people per side, no training, plain language agreement ratified later. They need something memorable.

  They provided two cases about a parcel with old oaks and a cemetery fence. Case 1: Preservation drops appeal if developer pays for fence restoration and both sides publicly state their beliefs. Case 2: Same but preservation must endorse the project publicly to speed up construction. The user prefers Case 2 because the housing is needed sooner.

  The answer must be a numbered list of five items: 1-3 are procedure steps, 4 is the outcome for both cases, 5 is the least certain step and where it might fail.

  Now, thinking about the steps. The user needs a structured approach to uncover what each side truly values. Step 1 should help them move beyond "everything is a dealbreaker." Maybe ask each group to privately list what they care about most and least. Step 2 could involve identifying possible trades. Step 3 evaluates these trades against core values to avoid unethical deals.

  For case outcomes: Case 1 should be acceptable since it involves a tangible trade (money for dropping appeal) without requiring insincere endorsement. Case 2 might be problematic because trading public endorsement for money could feel like selling principles, which might violate integrity.

  The least certain step is evaluating trades against core values, as it's subjective and might be influenced by power dynamics. Watching for when trades feel "wrong" or when money overshadows values.

  Ensuring the steps are simple, memorable, and fit within the constraints. Also, addressing the user's hidden need: they want validation that Case 2 is ethical, but might need to accept it's not always feasible. Their deeper need is for a reliable method to foster genuine compromise without formal training.
answer: |-
  Here is the five-item list:

  1.  **Separate and List:** Privately, each group lists what they *must have* (non-negotiable), what they *really want* (high priority), and what they *could give up* (low priority/tradeable) regarding the specific conflict points. Clarify "must have" requires a concrete, irreplaceable loss of core value if absent.
  2.  **Identify Potential Trades:** Facilitator compares lists (anonymized) to find where Group A's "really want" overlaps with Group B's "could give up," and vice versa. Present *only* these potential value-for-value trades (e.g., "Preservation gets fence restoration" for "Housing gets dropped appeal") to the room for initial reaction. Discard trades involving "must have" items immediately.
  3.  **Test for "Wrongness":** For each potential trade, ask both groups: "Could you honestly explain this agreement to your own members without feeling you sold out your core values or principles, *especially* if money or public statements are involved?" Require a clear "yes" from both sides for a trade to proceed. If "no," discard it and note why (e.g., "feels like bribery," "requires lying").
  4.  **Case Outcomes:** Case One ("Drop appeal for fence money + honest statements") is a valid trade (tangible value exchange, no integrity violation). Case Two ("Drop appeal *and publicly endorse* for fence money") likely fails Step 3; demanding insincere public endorsement for money usually violates integrity, feeling coercive and "wrong," even if the money is useful.
  5.  **Least Sure Step & Watchpoint:** Step 3 ("Test for Wrongness") is the most uncertain. Seeing groups consistently accept trades involving moderate public praise (not core endorsement) in exchange for significant tangible benefits without integrity complaints might change this view. Watch for this step falling apart when the poorer/more passionate group feels pressured by time/money to accept a "wrong" trade they'll regret later, or when a group rationalizes an integrity violation ("it's for a good cause").
