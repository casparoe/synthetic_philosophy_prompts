answer: |-
  Here's a decision tree designed for your Sunday morning pen-and-paper session. It isolates the mechanisms by asking concrete, observable questions about your **actions and circumstances**, not your feelings or self-perception. Every branch forces a choice between behaviors. The leaves are mutually exclusive based on your path.

  ---

  ### **The "Why Can't I Walk Away?" Decision Tree**
  *Start at Question 1. Answer YES/NO honestly based ONLY on your actions or factual circumstances. Follow the arrow.*

  1. **Has the total cost (money/time/effort) already exceeded the objective value of the disputed outcome?**  
     - **NO** → Go to 2  
     - **YES** → Go to 3  

  2. **Would you **stop immediately** if your opponent conceded right now?**  
     - **YES** → **Pure Rational Continuation** (Not biased)  
     - **NO** → Go to 7  

  3. **If your opponent vanished from the conflict tomorrow (e.g., moved away, conceded), would you immediately drop the dispute?**  
     - **YES** → Go to 4  
     - **NO** → Go to 5  

  4. **Would you feel intense relief if the dispute ended **quietly** (no one else knows you quit)?**  
     - **YES** → **Rival-Locked Escalation** (Dollar Auction shape)  
     - **NO** → Go to 6  

  5. **After each major expense (lawyer, survey, hearing), did you consciously **increase** your estimate of your odds of winning?**  
     - **YES** → **Probability Drift** (Unnamed bias)  
     - **NO** → Go to 8  

  6. **Would quitting feel like admitting **everything spent so far was a mistake from the start**?**  
     - **YES** → **Sunk Cost Identity Trap** (Unnamed)  
     - **NO** → Go to 9  

  7. **Is the primary motivation to prove something **to a specific person/group** (e.g., family, neighbors, opponent)?**  
     - **YES** → **Audience-Driven Commitment**  
     - **NO** → **Pure Ego Preservation** (Face-saving)  

  8. **Do you believe **new, objective information** gained after expenses justifies continuing?**  
     - **YES** → **Pure Rational Continuation** (Not biased)  
     - **NO** → **Sunken Certainty** (Sunk cost fallacy variant)  

  9. **Would you feel **shame** if people knew you backed down?**  
     - **YES** → **Face-Saving Sunk Cost**  
     - **NO** → **Unnamed: Moral Entrapment** (e.g., "I must fight injustice")  

  ---

  ### **The Leaves (Outcomes)**
  1. **Pure Rational Continuation**  
     - *Predicts:* You’d stop if costs outweighed benefits OR if new evidence showed your odds decreased.  
     - *Cure:* None needed; you’re acting logically.  

  2. **Rival-Locked Escalation** (Dollar Auction)  
     - *Predicts:* You’d quit instantly if the rival disappeared, but their presence makes stopping feel like surrender.  
     - *Cure:* Frame quitting as "letting them waste resources alone," not losing.  

  3. **Probability Drift**  
     - *Predicts:* Each investment inflates your subjective win probability, regardless of actual evidence.  
     - *Cure:** **Freeze estimates** before new spending. Have a neutral party assess odds.  

  4. **Sunk Cost Identity Trap**  
     - *Predicts:* Quitting invalidates your past judgment, making you feel foolish. Costs aren't monetary—they're existential.  
     - *Cure:** **Decouple past decisions from current reality**. Ask: "Would I start this TODAY knowing what I know?"  

  5. **Audience-Driven Commitment**  
     - *Predicts:* You’d quit if the audience vanished. Persistence is performance.  
     - *Cure:** **Privately test quitting** (e.g., "I’ll drop it for 1 week"). Realize no one cares as much as you.  

  6. **Pure Ego Preservation**  
     - *Predicts:* You’d continue even with no audience/rival. Losing = personal inadequacy.  
     - *Cure:** **Reframe "winning"** as walking away with sanity/resources intact.  

  7. **Sunken Certainty**  
     - *Predicts:** You persist because past investments "prove" victory is near, even with unchanged odds.  
     - *Cure:** **Audit costs vs. future odds with an outsider**. Ban "we’ve come this far" thinking.  

  8. **Face-Saving Sunk Cost**  
     - *Predicts:** Shame dominates; you’d quit if no one knew, but perception locks you in.  
     - *Cure:** **Create a "winning" exit** (e.g., settle neutrally, blame external factors).  

  9. **Unnamed: Moral Entrapment**  
     - *Predicts:** You see quitting as a moral failure (e.g., "I must fight for principle").  
     - *Cure:** **Quantify the moral cost** (e.g., time lost with family). Is this *really* the hill?  

  ---

  ### **Empty Squares & Gray Areas**
  - **Face-Saving with no audience/sunk costs?** Impossible. If no one’s watching and nothing’s spent, ego preservation lacks fuel.  
  - **Rival-Driven with no rival?** Illogical—the rival defines the trap. Remove them, and the mechanism collapses.  
  - **Probability Drift without escalating costs?** Rare. Drift requires reinvestment to "confirm" bias. Low costs = less need to self-justify.  
  - **Unappealing combos:** "Pure Rational Continuation" after costs exceed value (Q1=YES→Q8=YES) is **rationally possible but rare**—most people bias toward persistence once invested.  

  ### **What the Tree Can't Split**
  - **Probability Drift vs. Sunken Certainty:** Both involve misjudging odds after spending.  
    - *Sharpening Question:* "Did new spending *objectively* reveal information (e.g., evidence), or did you just *feel* closer to winning?"  
      - New info → Sunken Certainty  
      - Just a feeling → Probability Drift  
  - **Sunk Cost Identity Trap vs. Pure Ego Preservation:** Both tie to self-image.  
    - *Sharpening Question:* "Would you be *more* embarrassed by quitting, or by having started at all?"  
      - Quitting now → Ego Preservation  
      - Having started → Identity Trap  

  ---

  ### **Your Path Through the Tree**
  Based on your description:  
  1. Costs > land value? **YES** (→ Q3)  
  2. Quit if opponent vanished? **YES** (→ Q4)  
  3. Relief if quiet quit? *(You didn’t specify, but rivalry dominates your pain)* → Likely **YES** (→ **Rival-Locked Escalation**)  
  4. BUT you also admit **revising odds upward after each spend** → Strong **Probability Drift** component.  

  **Verdict:** You're primarily in **Rival-Locked Escalation** with secondary **Probability Drift**.  

  - **Why?** Your opponent "winning" is intolerable (Rival-Lock). Each payment makes you *feel* closer to victory, despite no objective improvement (Probability Drift).  
  - **Cure Combo:**  
    (1) **For Rival-Lock:** Imagine your neighbor moved. Would relief outweigh regret? If yes, quitting isn’t losing—it’s freeing.  
    (2) **For Probability Drift:** Get an external legal opinion **now**. Freeze your odds estimate. If new info doesn’t *objectively* improve them, stop.  

  **Blunt truth:** You’re paying to avoid admitting your neighbor "beat" you. The land stopped mattering long ago. Every dollar spent now is buying self-justification, not dirt. The cure starts with accepting that walking away **robs your rival of victory** because the "prize" is worthless. Let him "win" the strip while you keep $50k+.

  ---

  Print this. Walk through it slowly. The exit door unlocks when you call the rival’s bluff by stepping away.
