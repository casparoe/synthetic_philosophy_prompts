prompt: |-
  I serve on the grants committee of a private family foundation, and next month we vote on a single large proposal: $45 million now to acquire and permanently restore a coastal wetland that will buffer a city against storm surge. The engineers' models say the protective value is small for roughly the first forty years, rises steeply thereafter as sea levels climb, and then persists indefinitely. Our grant-management system requires one real number per proposal, and staff has been entering 5% — the figure our investment advisor applies to illiquid, long-horizon assets. At 5%, nearly all of the project's value falls beyond year 100 and the proposal fails on cost-effectiveness grounds. At the last meeting a trustee objected that the 5% contains a pure time-preference component that is nothing but our own impatience dressed up as arithmetic, and that removing it leaves a rate near 1.5%, at which this is the strongest $45 million opportunity we have seen in a decade. Our consultant then floated a third option: a schedule in which the rate declines the further out one looks, so that the far future is valued at the lowest plausible rate rather than an average — though he conceded the system cannot accept a schedule, only a single equivalent number, and that which number counts as "equivalent" depends on the shape of the benefit stream. A further wrinkle the committee has not confronted: our endowment is managed on the assumption of roughly 4% real returns in perpetuity, so whatever we enter for grants is also implicitly what we say about how this year's foundation values later ones.

  Draft the memo I will circulate to the committee before the vote. It should recommend one of the three paths (5%, something near 1.5%, or a declining schedule recast as a single equivalent rate), give reasons members could actually argue with rather than defer to, and state plainly how much of the recommended rate is impatience and how much is a response to expected growth in future people's consumption. It must also take seriously the best argument for the losing side — that capital is productive, so $45 million invested today could be delivered to future people as a far larger sum, which may make a low rate worse for them than a high one — and say what survives of that argument after scrutiny. Close with the conditions under which the number should be revisited and a concrete timetable for doing so.

  After the memo, provide a JSON object with exactly these fields: `recommendation` (string, one of "market rate", "low rate", "declining schedule recast"); `single_rate_entered` (number, annual percent, the value to type into the system); `impatience_component` (number, annual percent); `growth_and_inequality_component` (number, annual percent); `assumptions` (array of short strings, including any elasticity of marginal utility and consumption-growth figures you relied on); `why_the_equivalence_problem_resolves_this_way` (string, one or two sentences on how you converted a schedule or a benefit-stream shape into one number); `decisive_reason` (string, one sentence); `strongest_counterargument` (string, one sentence); `what_survives_of_it` (string, one sentence); `review_trigger` (string); `review_date` (string, ISO 8601).
reasoning: |-
  We are faced with a decision on the discount rate for a $45 million coastal wetland restoration project. The project's benefits are minimal for the first 40 years, then rise steeply and persist indefinitely. The grant-management system requires a single real discount rate. Three options have been proposed:

  1. **5% (market rate)**: This is the rate our investment advisor applies to illiquid, long-horizon assets. At this rate, the project fails because most benefits occur beyond 100 years.
  2. **Near 1.5% (low rate)**: This removes the pure time preference (impatience) component, leaving only the growth and inequality component. At this rate, the project is highly cost-effective.
  3. **Declining schedule recast as a single equivalent rate**: This uses lower rates for the far future but must be converted to a single number for the system.

  Additionally, we must consider that our endowment targets 4% real returns in perpetuity, so the discount rate we choose for grants also reflects how we value future foundation spending.

  ### Recommendation
  I recommend we use a **low rate near 1.5%**, specifically **1.5%**, as the single rate to enter into the system. This rate is justified by the following reasoning:

  - **Pure Time Preference (Impatience)**: We set this to zero on ethical grounds. There is no defensible reason to value the well-being of future generations less simply because they are born later. The 5% rate includes an implicit pure time preference of about 3.5% (as argued by the trustee), which is arbitrary and ethically problematic.
  - **Growth and Inequality Component**: This component reflects two factors: (1) the expected growth in per capita consumption, and (2) the diminishing marginal utility of consumption (i.e., an extra dollar is worth less to a richer person). The growth component is typically estimated at 1-2% in real terms. We use an elasticity of marginal utility (η) of 1 (a standard value) and a growth rate (g) of 1.5%, leading to a growth component of η*g = 1 * 1.5% = 1.5%. This is the entire discount rate when pure time preference is zero.

  Thus, the 1.5% rate breaks down as:
    - **Impatience component: 0%**
    - **Growth and inequality component: 1.5%**

  ### Why Not the Other Options?
  - **5% Market Rate**: This rate is appropriate for private investments that aim to maximize financial returns. However, our foundation's mission is to maximize social welfare, not financial returns. The 5% rate includes a substantial impatience factor (about 3.5%) that is indefensible for intergenerational projects. Moreover, the market rate reflects short-term risks and liquidity preferences that do not apply to a perpetual environmental asset.
  - **Declining Schedule**: While theoretically appealing (it values the far future at the lowest plausible rate), it is impractical because our system requires a single rate. Converting a schedule to a single rate is complex and depends heavily on the specific benefit stream. For this project, with benefits concentrated after 40 years and lasting indefinitely, the equivalent single rate would be very low (around 1.5% or less). Thus, the declining schedule approach effectively converges with the low-rate option for this proposal.

  ### Addressing the Best Counterargument
  The strongest argument for a higher rate (like 5%) is that **capital is productive**: $45 million invested today could grow to a much larger sum for future generations, which might do more good than the wetland project. For example, at 4% real returns (our endowment's target), $45 million becomes about $2.2 billion in 100 years, potentially funding many future projects.

  However, this argument does not survive scrutiny for three reasons:
  1. **Non-Fungibility**: The wetland provides a unique, irreplaceable service (storm surge protection) that cannot be substituted by financial capital. Once lost, the wetland cannot be recreated at any cost.
  2. **Risk and Uncertainty**: Financial returns are uncertain and subject to market volatility, while the wetland's benefits are relatively certain and escalate with climate change. Moreover, if future consumption growth is lower than expected (due to climate damages), the discount rate should be lower, making the wetland even more valuable.
  3. **Mission Alignment**: Our foundation's goal is not to maximize financial capital but to deploy it for public good. The wetland project aligns with our mission to build resilience against climate change, a threat that grows over time. Holding capital for the future assumes we can find equally impactful opportunities later, but this project's unique and time-sensitive nature (the land may be developed or degraded) makes it a now-or-never opportunity.

  What survives of the counterargument is a valid concern about **opportunity cost**. We must ensure that the $45 million is not spent on a less impactful project. However, the low discount rate reveals that this project is exceptionally cost-effective for the very long term, and we have no current proposals with comparable long-term benefits.

  ### When to Revisit
  The discount rate should be revisited if:
  - There is a **significant shift in economic assumptions** (e.g., long-term consumption growth projections change substantially).
  - New evidence emerges on the **elasticity of marginal utility** or the ethical defensibility of pure time preference.
  - Our **endowment’s real return target** changes materially from 4%.

  We will revisit the rate at the next scheduled review of our grantmaking policies, set for **January 2029**, or earlier if any of the above triggers occur.

