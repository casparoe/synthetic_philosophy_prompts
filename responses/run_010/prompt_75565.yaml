prompt: |-
  I sit on the program committee of a mid-tier ML conference — think second or third in prestige, not one of the giants — and this year's policy question has the board completely deadlocked, so we've asked for written positions ahead of the March meeting.

  The issue: a growing share of our submissions are results that could only have been produced with compute no university group can touch. Not "we used a big cluster," but training runs where the ablations alone cost more than most of our authors' annual research budgets. Right now we review them exactly like everything else — no disclosure requirement, no separate standard, no questions asked.

  The two camps talk past each other constantly. One side says we'd be insane to turn that work away: those papers are why anyone submits or attends here at all, and if we screen them out they go to a bigger venue and we spend five years sliding into irrelevance. That side also points out that basically no one in the room actually believes our own screening would change the field's trajectory by even a hair. The other side says that if you run the numbers on where this leads, you get a field where the only interesting empirical questions are the ones a handful of well-funded labs can afford to ask, where a clever idea that needs no GPUs can't compete, and where an entire generation of grad students learns that the discipline they picked has nothing for them. There's a compromise floating around — mandatory compute and energy disclosure plus some kind of separate evaluation category — but the first camp calls it stigmatizing the exact work that keeps us alive and the second camp calls it a fig leaf.

  Draft the memo I'll circulate to the committee. It needs a clear bottom line — accept as-is, accept under specific conditions, or decline this class of submissions — plus the actual policy language I'd move for, a note on who enforces it and how (disclosure that nobody checks is worse than none), and a realistic account of what it'd do to our numbers over the next three to five years.

  Two things I want it to really wrestle with rather than gesture at. First, the "you can't defect alone" objection: if one conference acting by itself provably can't shift an equilibrium, how much weight should that carry, and is there any version of the objection that actually holds? Second, the mirror-image point the field-health camp has to answer — if the situation really is as bad for the discipline as they claim, then a policy that speeds up the deterioration can't be good for us as a venue either, since our whole standing rests on the field staying healthy. So either that claim is overblown or the "we're too small to matter" argument cuts both ways. I want the memo to say which horn it takes.

  Please be forthright about where your reasoning is shakiest — which step in the chain would you expect an economist on the board to attack first — and close with the single piece of evidence or argument that would flip your recommendation to one of the other options. Don't hedge into a both-sides shrug; I'd rather have a committed position I can push back on than a survey of the disagreement.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're on the program committee of a mid-tier ML conference facing a deadlock over handling compute-heavy submissions. The core issue is whether to accept papers that require massive computational resources, which most university groups can't access. 

  First, I need to understand the two camps. One side argues that rejecting these papers would lead to irrelevance as top work goes elsewhere. The other side worries about the field becoming inaccessible, where only well-funded labs can contribute, pushing out talented researchers without resources. There's a compromise involving disclosure and separate evaluation, but both camps criticize it.

  The user wants a memo with a clear stance: accept as-is, accept with conditions, or decline. They also want enforcement mechanisms, impact projections, and deep engagement with two key arguments: the "you can't defect alone" problem and the field-health dilemma. Plus, they want honesty about weak points and a flip-condition.

  Hmm... The user's identity is crucial here. They're in a leadership role, needing to break a deadlock. Their explicit request is for a decisive memo, but deeper needs might include maintaining the conference's relevance while ensuring the field's long-term health. They might also need to present a well-reasoned position that addresses both camps' concerns to gain consensus.

  The "you can't defect alone" objection suggests that if the conference acts alone, it won't change the field's trajectory. But the counter is that collective action starts with individual steps. If the conference's policy influences others, it could shift norms. The field-health argument is trickier. If the field deteriorates, the conference suffers anyway, so inaction isn't neutral. That points toward taking a stand despite risks.

  I'm leaning towards mandatory disclosure and a separate evaluation track. Disclosure alone is toothless without enforcement, so verification is key. A dedicated track for compute-heavy work allows their inclusion without overshadowing resource-efficient research. This addresses both camps: keeping high-impact papers while highlighting resource inequality.

  But the first camp might see the separate track as stigmatizing. The memo needs to position it as recognizing different research modes, not hierarchy. The second camp might view it as insufficient. Clear criteria and enforcement are essential. 

  Enforcement is tough. Self-reporting can be gamed. Partnering with cloud providers for cost verification? That could work but has privacy issues. Budgeting for a fact-checking subcommittee adds overhead but might be necessary.

  Projecting numbers: short-term submissions might dip as some big labs redirect work. But attracting resource-efficient research could offset this. Long-term, if the policy gains traction, the conference could lead in sustainability, attracting a diverse cohort. If the field moves towards disclosure norms, the conference benefits from early adoption.

  The shakiest point is enforcement feasibility. An economist might argue that without industry-wide adoption, the policy just redirects submissions elsewhere without systemic change. The flip-condition would be evidence that similar policies in comparable conferences led to reduced inequality without harming prestige.

  I'll structure the memo to present mandatory disclosure with a separate track as the recommendation. Address both objections head-on: collective action starts individually, and field health requires proactive steps. Close with the flip-condition being proof of successful adoption by peer venues.
answer: |-
  **MEMORANDUM**  
  **TO:** Program Committee Members  
  **FROM:** [Your Name], Program Chair  
  **SUBJECT:** Policy Decision: Handling Compute-Intensive Submissions  
  **DATE:** March [Date], 2024  

  ---

  ### **Bottom Line**  
  **Accept submissions under specific conditions:**  
  1.  **Mandatory disclosure** of compute costs (FLOPs, GPU-hours, cloud expenditure) and energy consumption for all training runs, including ablations.  
  2.  **Creation of a distinct evaluation track** for "Compute-Intensive Research" (CIR), with explicit review criteria emphasizing *necessity of scale* and *broader insights beyond scale*.  
  3.  **Rejection of submissions** failing disclosure *or* where reviewers deem scale unjustified for the claimed contribution.  

  ### **Proposed Policy Language**  
  > "**Section X: Computational Resource Disclosure & Review**  
  > (a) All submissions must include a **Compute and Energy Statement** quantifying:  
  > &nbsp;&nbsp;&nbsp;&nbsp;(i) Total floating-point operations (FLOPs) or equivalent GPU/TPU-hours for final model training.  
  > &nbsp;&nbsp;&nbsp;&nbsp;(ii) Estimated FLOPs/GPU-hours for all reported ablations.  
  > &nbsp;&nbsp;&nbsp;&nbsp;(iii) Estimated direct cloud compute cost (USD) or institutional cost equivalent.  
  > &nbsp;&nbsp;&nbsp;&nbsp;(iv) Estimated energy consumption (kWh) for training and ablations.  
  > &nbsp;&nbsp;&nbsp;&nbsp;(v) Source of compute resources (e.g., commercial cloud, private cluster, institutional grant).  
  > (b) Submissions where the primary results require computational resources exceeding a threshold of **1e23 FLOPs** (or equivalent cost >$50k USD) must be flagged for review in the **Compute-Intensive Research (CIR) Track**.  
  > (c) **CIR Track Review Criteria:**  
  > &nbsp;&nbsp;&nbsp;&nbsp;(i) Is the scale *demonstrably necessary* for the novel scientific insight? (Justification required).  
  > &nbsp;&nbsp;&nbsp;&nbsp;(ii) Does the work provide transferable knowledge *beyond* merely achieving results at scale? (e.g., algorithmic insights, scaling laws, distilled principles).  
  > &nbsp;&nbsp;&nbsp;&nbsp;(iii) Rigor of ablation studies relative to scale.  
  > (d) Non-disclosure or materially inaccurate disclosure is grounds for **desk rejection**.  
  > (e) The PC may reclassify submissions between tracks based on disclosed compute."  

  ### **Enforcement Mechanism**  
  *   **Verification:**  
      *   **Phase 1 (2024-25):** Spot-check audits (3-5% of CIR submissions) by a subcommittee. Authors must provide itemized cloud bills, cluster logs, or institutional accounting verification upon request. Failure = rejection/retraction.  
      *   **Phase 2 (2026+):** Explore partnerships with major cloud providers (AWS/GCP/Azure) for anonymized cost/energy validation APIs (pending feasibility & privacy agreements).  
  *   **Reviewer Training:** Mandatory briefing for CIR track reviewers on applying the specific criteria (i, ii, iii above), emphasizing *necessity* and *transferable insight*.  
  *   **Consequences:** Inaccurate disclosure discovered post-acceptance triggers retraction and a 2-year submission ban for all authors.  

  ### **Projected Impact (3-5 Years)**  
  *   **Short-Term (1-2 yrs):**  
      *   **Submission Dip (5-15%):** Some large labs may redirect flagship work to less restrictive venues initially.  
      *   **Increased Administrative Load:** Audit process requires dedicated PC/subcommittee effort.  
      *   **Controversy:** Vocal criticism from both extremes ("stigmatization" vs. "inadequate").  
  *   **Medium-Term (3-5 yrs):**  
      *   **Stabilization/Recovery:** If adopted by even *one* peer venue, submissions rebound as norms shift. CIR track becomes recognized niche.  
      *   **Rise in "Efficient" Submissions (10-20%):** Attracts work previously overshadowed, boosting diversity.  
      *   **Reputational Shift:** Positions us as a leader in *responsible scaling discourse* and *practical innovation*, distinct from pure scale chasers.  
  *   **Long-Term Risk Mitigation:** Reduces existential threat of becoming irrelevant *either* by losing all high-impact work *or* by enabling a hyper-centralized field collapse.  

  ---

  ### **Wrestling with Core Objections**  
  1.  **The "You Can't Defect Alone" Objection:**  
      *   **Weight:** Significant, but not dispositive. While unilateral action *is* risky, waiting for unanimity guarantees inaction. Precedent matters (e.g., NeurIPS reproducibility checklist adoption started small).  
      *   **Which Horn?** We reject the fatalism that small actors cannot initiate change. Conferences are *nodes* in a network; coordinated action begins *somewhere*. Our role isn't to single-handedly "fix" ML but to **establish a viable alternative equilibrium point** – proving rigorous review *with* disclosure is possible. If successful, we pressure larger venues to follow or cede leadership on this critical issue. **We take the horn that individual action catalyzes collective action.**  

  2.  **The Field-Health Mirror:**  
      *   **The Core Insight:** Absolutely correct. If unchecked scaling *truly* dooms the field's health (talent drain, loss of diversity, stagnation), then passively hosting its acceleration *is* suicidal for our conference long-term. Our relevance depends on a vibrant, *sustainable* field.  
      *   **Which Horn?** We accept the field-health camp's diagnosis as directionally accurate *enough* to warrant action. The "too small to matter" argument *does* cut both ways: if we truly can't influence the field, then rejecting CIR work *also* won't harm it, making the "keep it to survive" argument hollow. Therefore, **we take the horn that the field-health risk is sufficiently severe and our action, while risky, is a necessary bet on long-term viability.** Inaction is a *choice* for accelerated centralization.  

  ---

  ### **Where the Reasoning is Shakier & The Economist's Target**  
  *   **The Shakiest Link:** **Enforcement scalability and cost.** The economist will pounce: "Your audit plan is naive. Costs will balloon, compliance will be gamed (e.g., internal cost accounting vs. market rates), and large labs will simply absorb the burden or lie. You create bureaucracy without materially changing incentives. The deadweight loss outweighs any theoretical benefit."  
      *   *My Counter:* Phase 1 audits are a signaling mechanism – the *threat* and demonstrated *will* matter more than volume. We leverage community norms against fraud. Phase 2 cloud partnerships are aspirational but crucial for feasibility. The "cost" is an investment in the conference's long-term purpose.  

  *   **The Flip-Condition:**  
      **If presented with robust evidence that a comparable mid-tier conference adopted a similar (or stricter) policy within the last 18 months and experienced a catastrophic (>25%) decline in submissions *without* a compensating rise in innovative, efficient work or adoption by other venues**, I would flip to **"Accept as-is" (Status Quo)**. This would signal our action is genuinely premature and isolationist. Mere *complaints* from large labs or a 10% dip wouldn't suffice – it would need proof the policy triggered irreversible reputational damage and failed to stimulate the desired alternative research stream.  

  ---

  ### **Recommendation**  
  The status quo is unsustainable. It accelerates our dependence on a research model antithetical to broad participation and long-term field health. The proposed policy (mandatory disclosure + CIR track) is a defensible middle path: it **keeps** transformative scale work *while* demanding justification and transparency, **creates space** for resource-efficient innovation, and **positions us proactively** in the defining debate of our field. Yes, there's risk. But the risk of passive decline is greater. **I move to adopt the policy as drafted.**  

  We debate this in March. Come prepared.  

  // SIGNED //
