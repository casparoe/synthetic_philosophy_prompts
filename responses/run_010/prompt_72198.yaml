prompt: |-
  A friend of mine — a former clinical epidemiologist who now sits on the coverage committee of a statutory health insurer — and I spent most of last night arguing about whether the therapy/enhancement distinction can bear the weight his committee puts on it, and we got nowhere, in part because we kept sliding between two different questions. His committee operates a two-step test. The first step asks whether the claimed intervention addresses a departure from species-typical functioning for a reference class matched on age and sex, which is roughly the baseline Norman Daniels defends in his paper on normal functioning and the treatment-enhancement distinction; the second asks whether correcting that departure improves the claimant's share of the normal range of opportunities. My friend thinks the test is sound in principle and that its failures are failures of application — bad reference classes, drift in what counts as typical, inconsistent treatment of prevention. I think the first step is doing no real work: either normal functioning is a statistical artefact of how the reference class is drawn, in which case it cannot by itself generate an obligation to fund anything, or it is already saturated with the evaluative judgment about which departures are bad for a person, in which case the distinction is a restatement of the conclusion rather than a ground for it. We agreed on one thing, which is that the committee's own reasoning is internally unstable: in some dossiers it measures the claimant against a population norm and in others against her own prior or projected level, and it never says which it is using. I want to see the argument written up properly instead of left as a dinner-table stalemate.

  The document I want is the joint statement my friend and I could both put our names to after a good-faith adversarial collaboration, worked through against the actual dossiers on his committee's queue rather than against abstractions. Those dossiers are: prophylactic mastectomy for a woman carrying a high-penetrance breast-cancer variant with no malignancy and no symptoms; a lipid-lowering therapy for a man whose LDL sits at the population median but whose father and brother both infarcted before fifty; growth hormone for a child in the first percentile for height with no identifiable endocrine pathology; a wakefulness-promoting stimulant for a rotating-shift worker who has no sleep disorder and simply cannot stay safe on nights; preimplantation testing with selection of embryos not carrying a familial variant; cochlear implantation for a prelingually deaf four-year-old whose Deaf parents object that they are being asked to treat a culture as a deficit; and deep brain stimulation for treatment-resistant depression in a patient whose family reports that he is also noticeably quicker afterwards. For several of these the committee's two steps come apart from each other and from common sense about what ought to be funded, and I suspect that divergence is where the real content of our disagreement lives.

  So draft the statement. I want the claims both camps can sign — about what the coverage decision is, about what the distinction was recruited to do, about which of the dossiers the two steps classify differently and which they classify the same way, about what a health system is entitled to expect from a line it draws; then the residual disagreements, each formulated so that the side holding it would accept the wording, with no strawmanning and no collapsing my objection into his or his into mine; then the cruxes, meaning only those sub-questions whose settlement would actually move one of us, with a note for each of what evidence, case, or argument both of us would accept as bearing on it and what each of us predicts the outcome will be, recorded in advance rather than after the fact. Two cruxes I would insist on seeing addressed are whether the baseline is person-relative or population-relative, and whether that choice flips any verdict on the queue or only changes the reasons offered for the verdicts we already share. And if you conclude that some portion of the dispute is verbal — that one of us is using the distinction as a moral category and the other as an administrative test, or that we mean different things by normal — say which portion, and why the remaining portion is not verbal. Please write it as continuous prose, the way a jointly signed memorandum would read: paragraphs only, no headings, no bullet points, no numbered lists, no bold, no tables, with the structure carried by the sentences themselves. I am not asking for a literature review, a bibliography, or suggestions for further reading; I want the document.
reasoning: |-
  Okay, the user wants a joint statement drafted after an adversarial collaboration between them and their friend, a clinical epidemiologist on a health insurer's coverage committee. They've been debating the therapy/enhancement distinction used in coverage decisions. The committee uses a two-step test: first, whether an intervention addresses a departure from species-typical functioning (reference class based on age/sex), and second, whether correcting that departure improves the claimant's share of the normal range of opportunities. 

  The user believes the first step is fundamentally flawed—either it's a statistical artifact without moral weight, or it's already loaded with evaluative judgments. Their friend sees it as sound in principle, with failures being implementation issues. Both agree the committee applies it inconsistently, sometimes using population norms, sometimes personal baselines. 

  The user provides seven concrete cases where the distinction gets messy: prophylactic mastectomy for BRCA+, lipid therapy for high familial risk despite normal LDL, growth hormone for short stature without pathology, stimulants for shift workers, embryo selection against genetic variants, cochlear implants for a Deaf child with cultural objections, and DBS for depression that also enhances cognition. 

  The task is to draft a joint statement that:
  1. Identifies common ground (what coverage decisions are, what the distinction aims to do, how cases are classified)
  2. Maps residual disagreements without strawmanning
  3. Specifies "cruxes" (sub-questions that would actually change minds), including whether the baseline is person-relative vs population-relative and if that flips verdicts
  4. Flags any verbal disputes (e.g., "normal" meaning statistical vs moral)

  Key challenges:
  - The cases expose where statistical "dysfunction" diverges from opportunity-restriction or common-sense funding. E.g., BRCA+ carrier has no current dysfunction but high risk; the Deaf child's "dysfunction" conflicts with cultural identity.
  - The user's core objection: Step 1 is either arbitrary (statistical) or circular (evaluative). Their friend sees it as objective scaffolding.
  - Must avoid academic tangents—focus solely on the committee's practical test and these dossiers.

  Structure I'll use:
  1. **Common Ground**: Define the committee's test, its purpose (administrative line-drawing), and inconsistent application. Note shared verdicts on cases (e.g., mastectomy funded, growth hormone denied). Highlight where steps align/misalign (e.g., cochlear implants: step 1 sees dysfunction, step 2 sees opportunity gain, but cultural objection isn't captured).
  2. **Residual Disagreements**: 
     - *User*: Step 1 redundant; decisions hinge on step 2 (opportunity restriction). 
     - *Friend*: Step 1 prevents "enhancement creep"; statistical baseline is neutral starting point.
  3. **Cruxes**: 
     - Baseline relativity (person vs population): Does using personal baseline (e.g., shift worker's safety risk) flip verdicts? User says yes for stimulants/shift worker; friend says no, it's still statistical (shift workers as reference class). 
     - Step 1's independence: Is a purely statistical dysfunction possible? User says no (e.g., short stature isn't dysfunctional without valuing height); friend says yes (deviation = dysfunction by definition). 
     - Predictions: User thinks person-relative baselines reveal step 1's redundancy; friend thinks they'll show step 1's flexibility.
  4. **Verbal Dispute?**: "Normal functioning" is ambiguous (statistical vs optimal). But the deeper clash is moral: Should statistics *ground* value judgments (friend) or merely inform them (user)? Not merely verbal.

  Nuances in cases:
  - Prophylactic mastectomy: Step 1 fails (no current dysfunction), but both agree it should be funded → exposes step 1's weakness.
  - Shift worker stimulant: Statistical baseline (healthy adult sleep) denies dysfunction, but personal risk exists. Friend might stretch reference class ("shift workers") to fit; user says this admits step 1 is adjustable to step 2.
  - Cochlear implants: Committee likely funds (dysfunction + opportunity gain), but cultural objection challenges whether "dysfunction" is universally valid. Here, the test ignores social determinants of opportunity.

  Final output will be continuous prose, no markdown, as a joint memo. Tone: precise, collegial, grounded in the dossiers.
answer: |-
  This joint statement reflects our collaborative analysis of the coverage committee's two-step test—assessing first whether an intervention addresses a departure from species-typical functioning (relative to age- and sex-matched reference classes), and second whether correcting that departure improves the claimant's share of the normal range of opportunities—applied to seven pending dossiers. We agree on the following:  

  The coverage decision is fundamentally about allocating finite resources for health-related interventions under a statutory mandate. The therapy/enhancement distinction is recruited to serve as an administrative boundary, aiming to objectively separate interventions that restore health from those that optimize it beyond societal obligations. We concur that the committee’s application of the test is internally unstable, inconsistently shifting between population-normative baselines (e.g., population LDL medians) and person-relative baselines (e.g., individual risk based on family history) across dossiers, without transparent justification. Regarding the dossiers:  

  Both steps align in supporting coverage for prophylactic mastectomy (departure: high cancer risk; opportunity: life without preventable malignancy) and rejecting growth hormone for non-pathological short stature (no endocrine dysfunction; height percentile alone doesn’t restrict species-typical opportunities). Both steps also align in rejecting stimulants for the shift worker (no sleep disorder; safety risks are job-contextual, not intrinsic dysfunction) and supporting preimplantation testing (embryo selection corrects a genetic departure and prevents opportunity-limiting disease). The steps diverge, however, in lipid-lowering therapy for the man with median LDL but familial history: Step 1 might reject (no population-relative dysfunction), while Step 2 supports (correcting familial risk improves opportunity share). Similarly, for deep brain stimulation in depression, Step 1 supports (treatment-resistant depression is a dysfunction), but Step 2 may conflate therapeutic and enhancing effects ("quickness" gains). The cochlear implant dossier splits both steps: Step 1 identifies deafness as a departure, but Step 2’s opportunity calculus conflicts with cultural identity, revealing that "normal opportunities" presupposes contested values.  

  We further agree that a health system is entitled to expect coherence, consistency, and transparency from any coverage boundary. The distinction must not mask value judgments as neutral facts, and it must respond to evidence without arbitrariness.  

  **Residual disagreements remain:**  
  One of us maintains that Step 1 does no independent work. It either collapses into a statistical artifact (e.g., reference-class drift in "typical" height or LDL thresholds), which cannot generate obligations, or smuggles in evaluative judgments (e.g., labeling deafness a "departure" assumes it is inherently disadvantageous), making it redundant to Step 2. In dossiers like lipid therapy, Step 1’s rejection on statistical grounds contradicts Step 2’s support based on person-relative risk, exposing its superfluity. The other of us contends that Step 1 provides essential scaffolding by anchoring dysfunction in biologically typical functioning, preventing enhancement creep. Its failures are operational—e.g., poorly defined reference classes—not conceptual. For instance, refining familial risk as a subclass could reconcile lipid therapy under Step 1, preserving its role as a guardrail.  

  **The cruxes that would resolve material portions of our disagreement are:**  
  First, whether the baseline for "departure" must be strictly population-relative or can incorporate person-relative factors without losing objectivity. Evidence bearing on this includes the committee’s own dossier outcomes: if adopting person-relative baselines (e.g., shift workers as a reference class for sleep demands) changes coverage verdicts—like approving stimulants—it reveals Step 1’s flexibility. We predict divergently: one of us expects person-relative baselines to flip verdicts for stimulants and lipid therapy, proving Step 1’s malleability; the other expects consistent outcomes (e.g., stimulants still fail if "typical functioning" excludes job-imposed states).  

  Second, whether Step 1 can be value-neutral when defining "functioning." Evidence includes cases where statistical deviations (e.g., very low height) lack pathology yet are labeled "departures," or where cultural perspectives (e.g., Deaf community) challenge dysfunction claims. Both would accept anthropological data on disability constructs or historical shifts in "typical" thresholds as relevant. Predictions differ: one of us anticipates such evidence showing Step 1 always encodes values, making it inseparable from Step 2; the other predicts it can isolate biologically objective dysfunction, as in endocrine disorders versus height variation.  

  A portion of the dispute is verbal regarding "normal functioning": one of us uses it statistically (e.g., population distributions), the other normatively (implying optimal state). This is resolvable by disambiguation. The substantive remainder is not verbal: it hinges on whether a statistical baseline *justifies* resource allocation without implicit valuation, which our dossier analyses show is empirically testable. For example, cochlear implants force a choice between statistical dysfunction (hearing loss) and culturally relative opportunity assessments, proving that values cannot be excluded.  

  We commit to revisiting these cruxes against future dossier outcomes and operational refinements.  

  ---  
  *Signed,*  
  [Your Name]  
  [Your Friend's Name]
