prompt: |-
  I sit on a small working group drafting the criteria by which an uncrewed ocean-world mission would be permitted to report that it has found life. Its instrument suite can image at sub-micron resolution and measure bulk composition, molecular chirality, and isotope ratios; it cannot culture anything, cannot obtain long sequences, and will not be around to answer follow-up questions. In trying to pin down what such criteria ought to track, I have accumulated a set of verdicts about terrestrial cases that I cannot reconcile, and I want to know what definition, if any, they add up to.

  The verdicts, in the order I recorded them:

  1. A human cheek cell on a slide — metabolizing, transcriptionally active, incapable of division, certain to die within a day: alive.
  2. A bacterial spore, a century old, metabolism below any threshold I could measure, which germinates when plated: alive throughout the century.
  3. The same spore heated until it will never germinate: dead. But I cannot say at what point during the heating it ceased to be alive, and the property that distinguishes 2 from 3 was not, at the start of the heating, detectable by me.
  4. Purified tobacco mosaic virus particles in a buffer: not alive.
  5. That same virus replicating and evolving inside an infected leaf: still not alive. I hold this even though nearly every functional description that is true of it in the leaf is false of it in the vial.
  6. A giant virus whose genome is larger than that of some obligate bacterial endosymbionts and which carries genes for several aminoacyl-tRNA synthetases and translation factors, but has no ribosomes and no energy metabolism of its own: not alive.
  7. An obligate intracellular bacterial endosymbiont of an insect — genome far smaller than the giant virus's, no longer culturable outside its host, its metabolism so interlocked with the host's that most of what it needs is imported: alive.
  8. A mitochondrion: not alive. A beating heart in a perfusion box: alive, but not an organism. A brain-dead patient on a ventilator whose cells are largely viable: a dead organism containing living parts.
  9. A mule: alive, and an organism, though it will never reproduce.
  10. A self-organized assembly built from the dissociated skin and heart-muscle cells of an amphibian embryo, which swims, closes its own wounds, and — in a dish containing loose cells — corrals them into piles that develop into similar assemblies: alive, but not an organism. I am uneasy about both halves of that.
  11. A synthetic minimal cell whose genome was written on a machine from a human-designed file and placed into a recipient cytoplasm: the DNA in the freezer was not alive; the dividing cell is.
  12. A self-replicating program in an artificial-life simulation, with mutation, competition for resources, and measurable adaptation over thousands of generations: not alive.
  13. A flame: not alive, though it grows, holds itself far from equilibrium, consumes fuel, and propagates. A growing crystal: not alive, though it transmits its own structure, defects included. A prion: not alive.
  14. A protocell system in my own lab — vesicles that grow and divide, containing a catalytic RNA network that amplifies itself far too sloppily to transmit its variations: not alive, and not dead. I have no verdict here, and I suspect the language does not supply one.

  The best I have managed myself is this: something is alive if and only if (i) it is a discrete, spatially bounded individual; (ii) it maintains itself in a persistent non-equilibrium state by harnessing free energy from its surroundings; and (iii) it is capable of participating in open-ended evolution, in that it belongs to a lineage where heritable variation meets differential persistence. Call it the boundary–maintenance–evolution account. It handles 13 and 4, and seems to handle them for the right reasons. But clause (ii) contradicts 1, 2, and 3; clause (iii) contradicts 7, 9, and 10; and all three clauses are satisfied by a case I would refuse to call alive — a fleet of solar-powered machines that mine ore, repair themselves, and assemble copies of themselves from a stored design file, where copying errors are themselves inherited and selected against. Meanwhile I am committed to calling an organism of wholly non-terran chemistry found beneath the ice alive. So any clause that excludes the machines because of what they are made of looks like exactly the substrate chauvinism our criteria must not contain.

  Cases 6 and 7 are the pair I cannot live with. What separates them is not genome size, not gene count, not independence from a host, not possession of translation-related genes, and not evolutionary antiquity. If the answer is that 7 maintains its own boundary and synthesizes its own proteins while 6 does neither, that is beginning to look like a list rather than a principle, and I want to know whether it can be made into one.

  Please state the principle, or the small number of candidate principles, that these verdicts add up to, as precisely as you can, clause by clause, saying for each clause which numbered case motivates it and what it costs. Then give its deliverance on two cases I have deliberately left undecided: a membrane-free extract of broken cells, supplied with fuel, that transcribes, translates, and replicates a plasmid for a day and a half; and the machine fleet. State plainly which of my verdicts your account cannot reproduce, and where you think I should revise rather than complicate — I would sooner be told that 5, or 7, or 14 is simply wrong than be handed a definition with nine clauses and three indexicals. Finally: does the account you settle on define one property or two, given that my usage runs on both *alive* and *is an organism*; does it treat life as all-or-nothing or as admitting of degrees, and if the latter, what fixes the threshold and can that threshold be drawn only by someone who knows what would have happened had conditions been different; and can any such account be operationalized by an instrument that measures only what ours measures, or is the honest conclusion that our criteria must be tracking something other than life?
reasoning: |-
  Hmm, this is a fascinating and complex problem in astrobiology and philosophy of biology. The user is part of a team defining criteria for detecting extraterrestrial life with limited instruments, and they've presented 14 detailed terrestrial cases that challenge conventional definitions of life. 

  First, I need to recognize the core tension: the user wants operational criteria for an uncrewed mission, but their own intuitions about life don't neatly map to existing definitions. Their "boundary-maintenance-evolution" account fails several test cases, especially regarding dormant states (spores) and dependent life (endosymbionts). 

  The bacterial spore case (2-3) is particularly tricky - it suggests that potentiality matters more than current activity. Meanwhile, the virus cases (4-6) highlight that replication alone isn't sufficient if it's parasitic on another system's machinery. Cases like the mule (9) and minimal cell (11) show reproduction can't be essential, while the ALife simulation (12) indicates substrate matters. 

  For the unresolved cases: the cell-free extract would likely not qualify as "alive" under my proposed principle because it lacks autonomy - it's just residual biochemistry. The self-replicating machines would be excluded based on their designed rather than evolved inheritance mechanism. 

  The hardest contradictions are: 
  - Case 1 (dying cheek cell) requires current activity while case 2 (dormant spore) requires potentiality 
  - Case 7 (endosymbiont) must be alive while case 6 (giant virus) isn't, despite similar genomic complexity

  I'll propose an autonomy-based principle that focuses on evolved causal control. This handles spores via dispositional autonomy and distinguishes viruses from endosymbionts by whether they're truly part of the system's evolved architecture. 

  For operationalization: the mission's instruments could look for chiral molecules, metabolic disequilibria, and complexity signatures. But we must accept that some cases (like dormant life) might be missed or ambiguous - which is why the criteria should report "strong evidence of life" rather than binary "alive/dead".
answer: |-
  Based on your verdicts, a coherent principle emerges that prioritizes **autonomous causal control over self-maintenance and reproduction within an evolved lineage**. This reconciles most cases while respecting your constraints, though it requires revising one verdict and accepting that "organism" is a distinct concept.

  **The Principle: Autonomous Lineage Maintenance (ALM)**
  *X is alive iff:*
  - **(A) X is a cohesive, bounded system that maintains its own structural and functional integrity through self-generated activity.**  
    *Motivation:* Distinguishes cheek cells (1), spores (2), endosymbionts (7), and minimal cells (11) from flames/crystals (13), dead spores (3), and TMV particles (4).  
    *Cost:* Excludes viruses (5,6) and prions (13) — they lack intrinsic maintenance machinery.  
  - **(B) This maintenance is achieved through evolved, internal mechanisms that harness energy to regulate components/processes.**  
    *Motivation:* Excludes flames (externally driven), machines (designed, not evolved), and cell extracts (lacking regulation). Includes spores (dormancy is an evolved regulatory state).  
    *Cost:* Requires viewing dormant spores (2) as *actively* maintaining integrity via evolved mechanisms (e.g., macromolecular stability).  
  - **(C) X belongs to a lineage whose persistence depends on heritable variation in these maintenance/reproduction mechanisms.**  
    *Motivation:* Includes mules (9, lineage-derived), endosymbionts (7), and minimal cells (11). Excludes ALife (12, no material basis for lineage continuity) and machines (copied, not inherited).  
    *Cost:* Excludes non-reproducing entities *unless* they are part of a reproducing lineage (thus mules qualify).  

  **"Organism" is a subtype:** An organism additionally requires **(D) Functional independence as an evolutionary unit**, excluding cheek cells (1), heart tissue (8), and xenobots (10) — which are alive but not organisms. Your unease with case 10 reflects this distinction: xenobots are alive (meet A-C) but not organisms (lack D).

  **Deliveries on Undecided Cases:**
  - **Cell-free extract:** *Not alive.* Violates (A) — no bounded system maintaining integrity; just residual biochemistry. Violates (B) — no evolved internal regulation.  
  - **Self-replicating machines:** *Not alive.* Satisfies (A) and superficially (B), but violates (C) — lineage persistence relies on *external* design, not heritable variation in *internal* mechanisms. Copying errors aren't heritable adaptations; they're defects.

  **Contradictions and Revisions:**
  - **Cannot reproduce verdict 12 (ALife).** ALM excludes it due to lack of material basis for lineage continuity (C). *Recommend revising:* ALife lacks the causal grounding of biological evolution.  
  - **Cannot reproduce verdict 14 (Protocell).** *Recommend revising:* If the vesicles actively regulate internal conditions (A) and the RNA network exhibits heritable variation affecting persistence (C), it *is* alive. Your "sloppiness" may indicate proto-evolution.  
  - **Tension with case 3 (spore death):** ALM accepts potentiality — the spore is alive if its evolved mechanisms *can* reactivate. Death occurs when mechanisms are irreversibly damaged. The mission may not detect this potential, creating operational ambiguity.

  **Key Properties & Operationalization:**
  1. **Life is all-or-nothing** under ALM, but **detection is probabilistic**. Dormancy (spores) or unfamiliar chemistries may obscure criteria.  
  2. **Operationalization within mission constraints:**  
     - *Bounded individuality (A):* Sub-micron imaging + molecular chirality (membrane homogeneity).  
     - *Autonomous maintenance (B):* Bulk composition + isotope ratios (disequilibrium signatures); energy source utilization inferred from chemistry.  
     - *Evolved lineage (C):* Molecular chirality (homochirality implies evolution) + detection of complex, interdependent molecules (e.g., ribosomes).  
  3. **Threshold challenges:** Potentiality (e.g., dormant life) requires inference from structure. Unknown chemistries demand pattern recognition (e.g., chiral excess + metabolic signatures). The mission *can* operationalize ALM by reporting "strong evidence of an evolved, autonomously maintaining system" — which is what matters for discovery.  

  **Conclusion:** Your verdicts point to life as **autonomous persistence via evolved mechanisms within a material lineage**. ALM excludes viruses, machines, and ALife while including spores, endosymbionts, and non-reproducers. It accepts substrate-neutrality and avoids chauvinism. For the mission, focus on detecting **bounded, chemically disequilibrated systems exhibiting evolved complexity** — chirality, compartmentalization, and catalytic networks are measurable proxies. The honest answer is that criteria track *sufficient evidence for life as a natural phenomenon*, not a metaphysical binary. Revise verdicts 12 (ALife isn't alive) and 14 (protocells *could* be alive if they meet ALM), and accept that "organism" is a secondary categorization.
