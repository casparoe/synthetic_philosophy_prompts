prompt: |-
  I keep a spreadsheet of probability estimates, mostly about my own life plus a few friends, and I've realized basically every number I write down is secretly a choice of which group to compare my case to. My gut is pretty consistent about it, but the two rules people give me -- go as narrow as you can until the numbers get thin, and use a class that nothing statistically relevant splits further -- both break on my own cases.

  Here's what I actually judge:

  Whether I finish the marathon I signed up for: first-timers at this specific race over the last five years, not adults in my town. Narrower wins.

  Same race, but the finish rate for first-timers whose bib ended in 7 and whose first name starts with M -- 31 of 34 finished. I refuse that one flat out, even though 34 is a real sample. It feels made up.

  My mom's knee replacement: I want this surgeon at this hospital over the last three years, not the national registry number.

  But that surgeon has done nine. Nine is too few and I go straight back to the national figure. So its not just narrowness.

  My kid carries a variant found in maybe 1 in 40,000 people. The registry lists seven carriers and in five of them things went badly. I want to use those seven, which flatly contradicts the surgeon case and I cant tell you why.

  Drowning at the lake on the hottest weekend of the year: I will not use days-with-high-ice-cream-sales no matter how much data sits behind it.

  Whether a guy released from prison around here reoffends: I'll happily use people released into this zip code, and zip code doesn't cause anything. So it isn't causation either.

  My lottery ticket: no pull to narrow or widen at all. The set of tickets in this drawing just is the class and I never feel the problem.

  After my business folded, a friend said well, look at the rate for two-person startups where the founders met in college. I think that's cheating -- you don't get to build the class after you know how it came out.

  When I can't tell which narrow class my case is even in (is the tumor stage IIA or IIB, is my job manager or senior manager), I back up to the wider class that definitely contains both.

  Marriages where the wife is four years older and both of them have graduate degrees: the census has millions of those and the divorce rate is measurably different, and I still refuse to use it for my own marriage.

  So -- is there a principle, or two or three competing ones, that I could apply mechanically to a new case without checking my gut first? Give me each clause and say which of the cases above forces it. Then tell me which of my verdicts a cleaner principle throws out; I suspect the seven-carriers case and the ice-cream/zip-code pair are where something has to give, and I want to know which side you'd sacrifice and what it costs. And run whatever you land on against a case I didn't list: whether I'll still have my job in three years. The obvious class is people who took jobs like mine, except I can also deliberately make myself atypical -- take a weird contract, negotiate a fixed two-year term -- so I don't know if I'm allowed to pick my own reference class, or if doing that makes the number meaningless. Last thing: when two classes genuinely tie, is averaging them ever right, or is that just cowardice with extra steps?
reasoning: |-
  Okay, let me try to unpack this user's problem. They're struggling with how to choose reference classes for probability estimates in their personal life. The examples they provided show inconsistencies in their gut feelings about which reference groups to use. 

  First, I notice they have several key pain points:
  - When narrow classes feel valid (marathon finishers by race/year) vs. arbitrary (finishers by bib number/name)
  - Small sample size dilemmas (surgeon's 9 procedures vs. genetic variant's 7 carriers)
  - Rejecting statistically relevant but causally disconnected factors (ice cream sales vs drownings)
  - Accepting non-causal but geographically relevant groups (zip codes for recidivism)
  - The role of hindsight bias in defining classes (failed business example)
  - Resistance to demographically specific predictions for personal relationships (marriage stats)

  The user wants principles they can apply mechanically. But looking at their examples, their intuition seems to track three hidden variables:
  1) Causal relevance (even if subconscious)
  2) Epistemic access (could they reasonably know this before outcome?)
  3) Counterfactual robustness (would class definition change under small perturbations?)

  For the surgeon case (9 procedures), the small N makes estimates unstable - that's why they revert to national data. But for the genetic variant (7 carriers), the severity of outcome and lack of alternatives forces acceptance of small N. The difference isn't just sample size but option availability.

  The ice cream vs zip code contrast is illuminating. Zip codes capture unobserved confounders (e.g. local rehab programs), while ice cream sales are purely correlative. The user intuitively grasps that geography can proxy for social determinants in recidivism, but not for drownings.

  Their rejection of post-hoc classes like "college friend startups" reveals an important principle: reference classes must be definable ex ante. This aligns with statistical best practices against data dredging.

  The marriage stats rejection suggests personal agency overrides demographic factors when the user perceives high individual control - another unstated heuristic.

  For the job security case with atypical contracts, the key is whether the contract terms fundamentally alter the risk profile. If so, it becomes a valid narrow class; if not, it's false specificity.

  Averaging classes feels dangerous - it assumes equal weighting where none may exist. Better to state both estimates separately with their uncertainties.

  The core tension seems to be between their reasonable intuition and desire for mechanical rules. In reality, good reference class selection requires contextual judgment. The principles I'd derive:
  1) Maximize causal relevance
  2) Ensure class definability prior to outcome
  3) Require minimum sample sizes unless no alternatives exist
  4) Reject purely correlative factors without plausible mechanisms
  5) Accept geographic proxies when social/spatial confounders dominate

  This framework validates most of their judgments except perhaps the marriage case - but there, personal agency reasonably overrides statistical aggregates. The genetic variant case (accepting small N) would be the outlier, justified by severity and lack of alternatives.

  The job security example with atypical contracts: if the contract genuinely modifies termination risk, it's valid; if merely cosmetic, not. Self-selection into classes is permissible only when the selection criterion affects the outcome.
answer: |-
  Here's a principled framework derived from your cases, designed to be applied mechanically. It prioritizes **actionability, pre-definability, and causal proximity** over raw statistical narrowness.

  ---

  ### **Core Principles**
  1.  **Pre-Defined & Actionable Class Principle:**  
      *Use the narrowest reference class that:*  
      **(a) Was definable BEFORE the outcome was known,**  
      **(b) Contains features that CAUSALLY INFLUENCE the outcome OR are strong non-causal proxies for unmeasured causal factors (like geography/time capturing shared context), AND**  
      **(c) Has sufficient sample size (N ≥ ~30 for stable estimates; exceptions for rare events with no alternatives).**  
      *If no class meets (b), use the broadest class with reliable data.*  

  2.  **No Hindsight Selection Principle:**  
      *Never build/select a reference class using knowledge of the outcome or cherry-picked features irrelevant to causation/proxy status.*  

  3.  **Causal Anchor Principle:**  
      *When features lack a plausible causal link or strong contextual proxy, reject the class even with high N.*  

  4.  **Tie-Breaking Principle:**  
      *If multiple valid classes tie, state the range. AVERAGING IS FORBIDDEN (it assumes equal weighting without justification).*  

  ---

  ### **How It Judges Your Cases**
  | Your Case                     | Principle Applied                                                                 | Verdict Under Framework       | Why                                                                                                |
  | :---------------------------- | :-------------------------------------------------------------------------------- | :---------------------------- | :------------------------------------------------------------------------------------------------- |
  | **Marathon (First-Timers @ Race)** | (1a) Pre-defined race; (1b) Race conditions causally matter; (1c) N large enough. | **VALID**                     | Causal relevance (course, weather, organization).                                                  |
  | **Marathon (Bib#7 + Name 'M')**   | (1b) No causal link/proxy; (2) Feels arbitrary/hindsight.                         | **REJECTED**                  | Features are noise, not signal. Violates Principle 2.                                              |
  | **Surgeon (9 Surgeries)**         | (1c) N=9 too small for stability; (1b) Surgeon skill causal but N insufficient.   | **REJECTED → Use national**   | Principle 1c fails. Broad class is fallback.                                                       |
  | **Genetic Variant (N=7)**         | (1c) N=7 very small, BUT no broader class exists. (1b) Direct biological cause.   | **VALID (exception)**         | Principle 1c waived: no alternative. Causality justifies use despite small N (Severity matters too). |
  | **Drowning (High Ice-Cream Days)**| (3) Ice-cream sales lack causal link/proxy to drowning.                           | **REJECTED**                  | Pure correlation ≠ proxy. Use "hot weekend" if causal (crowds, alcohol) or "summer days at lake". |
  | **Recidivism (Zip Code)**         | (1b) Zip code proxies unmeasured causal factors (e.g., job access, support networks). | **VALID**                     | Geography captures shared social/environmental context. Non-causal but strong proxy.               |
  | **Lottery Ticket**                | The event is inherently defined by the drawing. No choice exists.                 | **N/A**                       | Reference class is fixed by the event definition.                                                  |
  | **Failed Business (College Friends)** | (2) Class defined AFTER failure; features lack pre-definable causal link.        | **REJECTED**                  | Violates Principle 2 (Hindsight) & Principle 1b (Causality weak).                                  |
  | **Tumor Stage (IIA vs IIB?)**     | (1) If unsure, use broader class (e.g., Stage II) that definitely contains you.   | **VALID → Use Stage II**      | Avoids false precision. Principle 1c (stability) over narrowness.                                  |
  | **Marriage (Wife +4yrs, Grad Deg)**| (3) Demographics lack causal link to YOUR marriage outcome; feels non-agential.   | **REJECTED**                  | Your agency dominates. Use broad "marriages" or psychology-based classes (communication, values). |
  | **Job Security (Atypical Contract)**| (1b) **If contract terms CAUSALLY alter job security risk (e.g., fixed-term end)**, then "fixed-term roles" is VALID. If self-modification is arbitrary (e.g., painting office blue), REJECT. | **Context-Dependent** | Principle 1b: Only use self-selected class if the selection CAUSALLY affects the outcome. |

  ---

  ### **Where Your Intuition Clashes & What's Sacrificed**
  1.  **Sacrificed: The Genetic Variant Case (N=7)**  
      *Framework Says:* Valid only due to **no alternative class**. Your gut accepted it easily; the framework forces acknowledgment this is a high-uncertainty exception.  
      *Cost:* Using tiny-N estimates risks large errors, but sometimes it's the only option.

  2.  **Sacrificed: Ice Cream Sales vs. Zip Code**  
      *Framework Explains:* Zip code is a **valid proxy** for social determinants of recidivism. Ice cream sales aren’t a proxy for drowning risk (no shared causal context). Your gut treated them similarly; the framework distinguishes via **proxy strength**.  
      *Cost:* Requires judging "proxy quality," but geography/time usually qualify.

  3.  **Clarified: Surgeon (N=9) vs. Genetic (N=7)**  
      *Framework Explains:* Surgeon has a **valid broader alternative** (national data). Genetics does not. Small N isn't forbidden if it’s the only causally relevant data.

  ---

  ### **Job Security in 3 Years: Applied**
  1.  **Baseline Class:** "People in similar roles (title, industry, company size)".  
      *Meets Principles 1a, 1b (causal: role stability factors), 1c (likely sufficient N).*
  2.  **Atypical Contract?**  
      *If you negotiated a **causal factor** (e.g., 2-year guaranteed term), use "Employees with fixed-term contracts".  
      If you did something irrelevant (e.g., demanded a red chair), ignore it.*  
  3.  **Result:** Use the class defined by **features that directly impact retention/termination risk**. Self-modification is valid only if it changes those features.

  ---

  ### **Tie-Breaking & Averaging**
  -   **Ties:** If "Managers in Tech" (N=1000) and "Senior Managers in Finance" (N=900) both seem equally valid/causal for your hybrid role:  
      *✅ Report both estimates: "45% (tech managers) vs. 60% (finance seniors)".  
      ❌ NEVER average them.* Averaging assumes equal relevance without evidence.  
  -   **Why?** Your marathon "Stage IIA vs IIB" case shows the right approach: retreat to "Stage II". Averaging dissimilar classes (e.g., "ice cream days" and "zip codes" for drowning) is worse than useless.

  ---

  ### **Summary: The Mechanical Checklist**
  For any event, ask:  
  1.  **"Was this class definable BEFORE the outcome?"** → If no, reject. *(Kills: business college-friends class)*  
  2.  **"Do its features CAUSALLY affect the outcome OR serve as strong PROXIES for context?"** → If no, reject. *(Kills: bib numbers, ice cream sales)*  
  3.  **"Is N ≥ ~30 (or is this the ONLY causally relevant class)?"** → If no, use broadest valid class. *(Kills: surgeon's N=9; allows genetics N=7)*  
  4.  **If multiple classes pass 1-3, report all estimates. DO NOT AVERAGE.**

  This sacrifices *ease* for rigor, but makes your probability estimates more defensible and less capricious. The cost is accepting instability in rare-event edge cases (like the genetic variant), but your gut already did that.
