  For Task 1 (defining the poles), Hofstadter's position treats the poem as a puzzle-box of formal constraints; meaning emerges from structure. Nabokov treats it as a unique artifact where semantic precision is paramount, with losses documented archaeologically. Their ontological difference is stark: is a poem primarily pattern (Hofstadter) or historical utterance (Nabokov)?

