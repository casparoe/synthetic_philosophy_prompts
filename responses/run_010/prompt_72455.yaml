prompt: |-
  Fourth-year classics PhD here — dissertation is on Aristotle's biological works, so this is adjacent but not my day job. Every year the department runs a Saturday session for high-school seniors who apply for it; mine is 75 minutes, about twenty students, seminar room, whiteboard only (the room nominally has a projector and it doesn't work, so no slides, and honestly that's a mercy). They get sent an excerpt of Politics Book I in some old public-domain translation as pre-reading and, realistically, maybe a third of them actually read it and the rest skim a summary the night before. My assigned topic is Aristotle on natural slavery. Last time I ran one of these I tried to cover all of Book I and burned forty minutes on the wealth-getting material, and nobody understood anything, so this time I'm committed to doing one thing properly and badly under-covering the rest.

  Here's the shape of the problem I want the plan built around. Almost all of these students arrive already knowing the conclusion they're supposed to reach — slavery is wrong, Aristotle was a man of his time, thank you, done. So there's a real risk the session becomes a ritual where they tell me the right thing and I tell them they're right, and the philosophy never happens. What I actually want them to leave able to do is state Aristotle's argument in a version that isn't trivially refutable, and then point at the exact place it comes apart. My own hunch, which I've been calling the contaminated sample problem in my head for want of a better phrase: the account only works if the natural slave is identified by a deficiency that's permanent and natural rather than by the position someone happens to occupy, but the only evidence available about who has that deficiency comes from people whose entire upbringing and social role has been shaped by the institution being justified. He seems to sense this himself — he raises something like the objection about people who end up enslaved through conquest rather than by nature — but I don't think he has any test that separates the two, and I'm not sure whether to say that in the room or let them get there.

  So plan the session for me rather than running it. Specifically: (1) the order the pieces have to go in and what depends on what — in particular whether the soul/body and ruler-ruled material has to be on the board before the claim about deliberation means anything at all, whether "natural versus conventional slavery" should be up before or after I let them voice the obvious objection, and whether the child comparison (immaturity that passes versus a deficiency that supposedly doesn't) needs to come in, and if so where; (2) the one case that carries the whole thing — I'm genuinely torn on whether it has to be Aristotle's own or whether a contemporary analogue is better, something like the thought that some adults just aren't equipped to make their own decisions, applied to people under guardianship — and if I use an analogue, what it has to have and what it must not have, so they don't hear me inviting them to agree with Aristotle about their neighbours; (3) the misconceptions, which for this crowd I expect to include "he's a bigot, we can skip him", "he was only describing what Greeks believed, not endorsing it", "the argument is circular so it isn't an argument", and the nastiest one, roughly "well if he says the master and the slave both benefit, isn't that just... a job?" — tell me where in the sequence each gets headed off and what I actually say at that point; (4) one question to put to the room at the end that would show me whether the thing landed as an argument rather than a historical curiosity, including what a good answer sounds like and what the most common bad answer sounds like; and (5) what I should cut, and cut loudly — I'm thinking the Delphian knife aside, the whole acquisition-of-wealth stretch, all the Greek terms — plus the sentence I use to flag the cut, because if I just skip something silently, someone asks about it at minute 70. Also give me a verdict on my contaminated-sample hunch: should I name it in the room, what would you call it in front of seventeen-year-olds, and at which point.

  Please hand it back as a JSON object rather than prose, since I want to convert it into a one-page plan I can hold. Schema: `sequence` — array of objects with `slot` (1, 2, 3…), `move` (what I do or say), `why_here` (what has to already be on the table, and what breaks if it comes earlier or later), `minutes` (these should add up to 75), `misconception_defused` (a label from your `misconceptions` list, or null); `carrying_case` — object with `the_case`, `must_have` (array), `must_not_have` (array), `rejected_alternatives` (array of objects with `case` and `why_rejected`); `misconceptions` — array of objects with `label`, `trigger` (the thing they'll say or do that tells me it's live), `defusal` (the move, phrased as something I could actually say out loud), `if_missed` (what goes wrong later in the session); `check` — object with `question`, `landed_answer`, `not_landed_answer`; `cut` — array of objects with `item`, `why`, `flagging_sentence`; and `contaminated_sample` — a short string with the verdict above. String values can be full sentences, I just want the structure.
reasoning: |-
  We are given a detailed scenario and need to structure a 75-minute session plan for high school seniors on Aristotle's natural slavery, with a focus on making the argument non-trivially refutable and identifying where it breaks. The output must be in JSON format as per the provided schema.

  Key elements from the request:
  - The session must avoid becoming a ritual where students just repeat that slavery is wrong and Aristotle was a product of his time.
  - Goal: Students should be able to state Aristotle's argument in a non-trivially refutable form and pinpoint where it fails.
  - The instructor's hunch: the "contaminated sample problem" — the identification of natural slaves is based on evidence from an institution that shapes the very characteristics it claims to identify.

  Schema breakdown:
  1. `sequence`: Array of objects with:
     - `slot`: Integer (1,2,3,...)
     - `move`: String (what the instructor does or says)
     - `why_here`: String (prerequisites, why this move at this point)
     - `minutes`: Integer (time allocated, sum to 75)
     - `misconception_defused`: String (label from `misconceptions` list or null)

  2. `carrying_case`: Object with:
     - `the_case`: String (the case used to carry the argument)
     - `must_have`: Array of strings (features the case must have)
     - `must_not_have`: Array of strings (features to avoid)
     - `rejected_alternatives`: Array of objects with:
          - `case`: String (description of alternative case)
          - `why_rejected`: String (reason for rejection)

  3. `misconceptions`: Array of objects with:
     - `label`: String (identifier for the misconception)
     - `trigger`: String (what students say/do that indicates the misconception)
     - `defusal`: String (what the instructor says to defuse it)
     - `if_missed`: String (what goes wrong if not defused)

  4. `check`: Object with:
     - `question`: String (the question to ask at the end)
     - `landed_answer`: String (what a good answer sounds like)
     - `not_landed_answer`: String (what a bad answer sounds like)

  5. `cut`: Array of objects with:
     - `item`: String (what is being cut)
     - `why`: String (reason for cutting)
     - `flagging_sentence`: String (what the instructor says to announce the cut)

  6. `contaminated_sample`: String (verdict on whether to name the hunch, what to call it, and when)

  Plan Structure:

  We have 75 minutes. The session should be structured to:
  1. Quickly set the stage and address the most common misconceptions early.
  2. Build the necessary foundation (like the soul/body and ruler-ruled analogies) before getting to the core argument.
  3. Present the argument for natural slavery in a non-trivially refutable form, using a carrying case.
  4. Then, allow the objection about the contaminated sample to emerge, either from students or by the instructor.
  5. Conclude with a check question.

  Sequence Outline (with estimated minutes):

  1. (5 min) Introduction: Set the stage, acknowledge pre-reading, and state the goal (not to judge but to understand the argument). Defuse the "bigot, skip him" misconception.

  2. (10 min) Foundational analogies: The soul/body and ruler/ruled distinctions. Why? Because without these, the idea of natural hierarchy and the function of the slave (to follow orders) won't make sense.

  3. (10 min) The concept of "natural" vs. "conventional" slavery. Introduce that Aristotle distinguishes between slavery by law (which might be unjust) and by nature (which he argues is just). This sets up the non-trivial version.

  4. (15 min) Present the carrying case. We'll use the case of adults under guardianship (like severe intellectual disability) as an analogue. This avoids the baggage of slavery and focuses on the idea of natural deficiency. We must have: a clear deficiency that is permanent and natural, and the claim that such a person benefits from being ruled. Must not have: any connection to race, conquest, or temporary conditions.

  5. (15 min) Aristotle's argument: Using the analogue, reconstruct the argument that natural slaves lack the capacity for deliberation and thus are better off being ruled. Emphasize the benefit to both parties (the guardian and the ward) as non-exploitative. This is where we defuse the "isn't that just a job?" misconception.

  6. (10 min) The contaminated sample problem: Raise the objection that in practice, how do we know who is a natural slave? The evidence is tainted by the institution. This is the point where we name the problem (call it the "evidence problem" for simplicity) and relate it to Aristotle's own concern about conquest.

  7. (5 min) Child comparison: Briefly contrast with children, who have a temporary deficiency and are ruled for their own good, but the natural slave's deficiency is permanent. This helps clarify the distinction and why the argument for slavery is not just about any subordination.

  8. (5 min) Conclusion and check: Pose the check question.

  Now, let's assign the misconceptions to the sequence slots where they are defused.

  - "bigot, skip him": Defused in the introduction.
  - "he was only describing, not endorsing": Defused when introducing natural vs conventional slavery (slot 3).
  - "the argument is circular": Defused when presenting the reconstructed argument (slot 5) by showing it's based on the soul/body analogy and the carrying case, not just assuming slavery.
  - "isn't that just a job?": Defused in slot 5 when discussing the carrying case and the benefit to both.

  Carrying Case:
  - We choose the contemporary analogue: adults with severe intellectual disabilities under guardianship.
  - Why? It captures the idea of a natural, permanent deficiency in reasoning capacity, and the arrangement is for the benefit of the individual. It avoids the historical and moral baggage of slavery.
  - Rejected alternatives:
    - Aristotle's own examples (e.g., non-Greeks as natural slaves): Rejected because it introduces racial and cultural bias, and students might dismiss it as bigotry.
    - Children: Rejected because the deficiency is temporary, so it doesn't match the permanent deficiency required for natural slavery.

  Cuts:
  - Delphian knife aside: Not essential to the core argument about natural slavery.
  - Acquisition-of-wealth stretch: We know from experience it burns time and confuses.
  - Greek terms: Avoids unnecessary complexity.

  Contaminated sample verdict:
  - We will name it in the room, but use a simpler term: call it the "evidence problem".
  - Introduce it in slot 6 (the contaminated sample problem section).

  Check question at the end:
  - Question: "If we accept Aristotle's definition of a natural slave (someone who permanently lacks the capacity for deliberation and benefits from being ruled), what is the main practical problem in identifying such individuals?"
  - Landed answer: Should point to the evidence problem — that in a society with slavery, the conditions of slavery might create the appearance of the deficiency, so we can't trust the identification.
  - Not landed answer: Might be a general condemnation of slavery without engaging the argument, or a focus on the immorality without seeing the structural issue.

  Now, let's build the JSON.

  Note: The `sequence` array must have the time allocations add to 75.

  Let me write the JSON accordingly.
