prompt: |-
  I chair the Academic Integrity Board at a small liberal arts college, and I must circulate a decision memo before our hearing resumes on Tuesday. The case is unusually clean, which is precisely why it has split the panel three to three. Two students enrolled in different sections of the same first-year political theory course, taught by different instructors, submitted written responses to an unproctored take-home exercise that are identical to the character: 412 words, the same sentences in the same order, the same two typographical slips (a doubled article in the second paragraph, an idiosyncratic capitalization in the fourth), and the same improbable phrasing of a commonplace idea. The similarity software reports 100 percent overlap. Neither student appears in the other's residence-hall records, group chats, or shared cloud folders; they had no section meeting, no study group, and no mutual acquaintances in common. Student A produced a full document revision history showing eleven drafting sessions across six days, with deletions, reordered paragraphs, and the two typos introduced at different points in the process; Student B produced only a final file uploaded from a shared library machine, but supplied a spiral notebook containing a legible, corrected hand draft that matches the submission, together with a library entry log placing them at a carrel on two of the drafting evenings. Neither can identify the other, and neither has any motive to protect the other.

  Article IV.3 of our Integrity Code governs, and reads in relevant part: "Where two submitted works are substantively identical, the Board shall presume that the identity arises from impermissible collaboration, and the burden of explanation shall rest upon the students." Read strictly, both are responsible unless they can affirmatively explain the identity, and one faction of the panel holds that no explanation has been offered and that the matter is closed. The other faction holds that the clause does no work at all in this case, because A's revision history and B's notebook each constitute exactly the sort of explanation the clause demands, and because the Code nowhere says what would count. At our last session the panel's lone philosopher member intervened with Max Black's 1952 thought experiment — the imagined universe containing nothing but two exactly similar spheres of chemically pure iron — to argue that qualitative indiscernibility does not entail numerical identity, and therefore that two indiscernible texts need not be a single text twice. I found the analogy alarming rather than reassuring: if it defeats the presumption here, it seems to defeat it everywhere, and textual identity is how nearly every case this Board hears is in fact proved.

  Please draft the memo I will circulate under my name: a recommendation with a concrete disposition of this case and a concrete proposal for how Article IV.3 should be rewritten or applied at future hearings, argued in terms both factions could actually respond to. It should say what the presumption clause is committed to — whether it assumes that indiscernibility between two artifacts entails a single origin, whether that assumption is metaphysical in character or merely probabilistic with metaphysical clothing, and whether the disanalogy between generated things like texts and stipulated things like Black's spheres does any work for the inference. It should specify what standard of proof applies, what sorts of evidence can discharge a student's burden, and what the panel does when the evidence is symmetric and complete on both sides, so that a future board has criteria rather than intuitions. And it should treat the strongest case against my own inclination honestly: that a coincidence defense is cheap, unfalsifiable, and available to every actual copier; that the deterrent force of the presumption depends on its being close to conclusive; and that asking a board of faculty and students to weigh the probability of independent generation is to ask them to administer a standard they are not equipped to apply.
reasoning: |-
  Hmm, I need to help draft a decision memo for an Academic Integrity Board chair dealing with a perplexing case. Two students submitted identical papers down to the typos, but there's no evidence of collaboration. The board is split 3-3, and I need to provide a recommendation that addresses both factions' concerns while offering concrete solutions.

  Let me understand the key issues here. The students have ironclad alibis - Student A has a detailed digital revision history while Student B has handwritten drafts with library logs. They don't know each other and have no connection. The integrity code's Article IV.3 presumes cheating when works are identical, but doesn't specify what counts as an explanation. The philosopher's reference to Max Black's spheres introduces metaphysical questions about whether identical things must share origin.

  The chair wants me to resolve this case fairly while creating clear standards for future boards. I need to address:
  - What the presumption clause actually assumes (metaphysical identity vs probability)
  - What evidence can overcome the presumption
  - How to handle symmetrical evidence
  - Why coincidence defenses shouldn't automatically undermine the rule
  - How to rewrite the policy for clarity

  I think the solution lies in shifting from presumption of guilt to presumption of collaboration that can be rebutted by credible evidence of independent work. Both students here have provided just that - one with digital trail, one with physical evidence. The identical outcome is extraordinary but possible statistically. The policy should require tangible proof of independent process when work is identical, which both students have provided in this case. 

  For the memo structure, I'll recommend dismissing charges with a rewritten policy that clarifies:
  1) Identical work triggers presumption of collaboration
  2) Students must provide evidence of independent process
  3) Acceptable proofs include revision histories or contemporaneous drafts
  4) The board evaluates credibility of evidence
  5) When evidence is equally credible, charges should be dismissed

  This approach maintains the policy's deterrent value while preventing unjust outcomes in rare coincidence cases like this one. I'll address counterarguments about cheap coincidence defenses by emphasizing the evidentiary standard - students must prove independent work, not just claim coincidence.
answer: |-
  ## Memorandum: Recommendation on Case #PLT-114 & Proposed Revision to Article IV.3

  **To:** Members of the Academic Integrity Board  
  **From:** [Your Name], Chair  
  **Date:** October 26, 2023  
  **Subject:** Disposition of Case #PLT-114 (Students A & B) and Proposed Revision to Article IV.3 of the Academic Integrity Code  

  ### I. Case Disposition: Recommendation for Dismissal
  After careful review of the extraordinary evidence presented in Case #PLT-114, I recommend **dismissing the charges against both students**. While the textual identity is unprecedented in my tenure, the evidence of independent work processes is compelling and materially distinct from the "no explanation" scenario Article IV.3 was designed to address.  

  *   **Student A** provided a granular digital audit trail spanning six days, demonstrating iterative development with specific error introduction points.  
  *   **Student B** furnished a contemporaneous handwritten draft with corrections aligning with the final text, corroborated by library access logs.  
  *   Crucially, neither submission shows signs of derivation from a common source or each other (e.g., identical formatting anomalies, metadata timestamps suggesting copying). The absence of any social or digital nexus further undermines a collaboration theory.  

  This evidence satisfies a plausible burden of demonstrating independent generation, even if the probability of identical output remains vanishingly small. The Board’s role is to adjudicate misconduct, not statistical anomalies. **Vote: Dismissal.**  

  ### II. Interpreting & Revising Article IV.3: Principles and Proposal
  Article IV.3’s presumption arises from practical necessity, not metaphysics. Its core commitment is **probabilistic, not ontological**. Indiscernible artifacts in an academic context *overwhelmingly likely* share an origin due to human behavior, not because identity implies singularity in a metaphysical sense (à la Black’s spheres).  

  *   **The Disanalogy with Black’s Spheres:** Black’s thought experiment isolates metaphysical identity. Texts, however, are *generated artifacts*, not stipulated primitives. The process of human composition inherently involves variation; near-identical drafts from a *single* author are rare. Complete identity across authors, without process evidence, is therefore reasonably presumed collaborative absent explanation.  
  *   **The Burden & Standard of Proof:** The clause shifts the burden of production (not persuasion) to the student. The standard is **"credible evidence of independent process"** – not proof beyond doubt, but evidence making independent creation materially plausible.  
  *   **Discharging the Burden:** Acceptable explanations must demonstrate the *work’s development*, not just final authorship. Examples:  
      *   Time-stamped revision histories showing iterative changes.  
      *   Contemporaneous handwritten drafts with edits matching the final text.  
      *   Corroborated records of isolated work sessions during the drafting period.  
      *   *Insufficient* evidence: Mere denials, alibis for the submission time, claims of lost drafts, or generic statements about working alone.  
  *   **Symmetric & Complete Evidence:** When both students provide equally credible and complete evidence of independent process (as here), the presumption is overcome. The Board cannot rationally assign responsibility without evidence of *how* collaboration occurred. The only fair outcome is dismissal. Coincidence, while improbable, is not impossible.  

  ### III. Proposed Revision to Article IV.3
  To prevent future deadlocks and clarify intent, I propose revising Article IV.3 as follows:  

  > **Revised Article IV.3:** Where two submitted works are substantively identical, the Board shall presume that the identity arises from impermissible collaboration. The affected students bear the burden of producing credible evidence demonstrating the independent development of their work. Evidence must document the process of creation (e.g., iterative revision histories, contemporaneous drafts with edits). If the Board finds the evidence from all students equally credible and sufficient to establish plausible independent generation, the charges shall be dismissed. The presumption may also be overcome by clear evidence identifying the specific mechanism of collaboration and the responsible party/parties.

  **Key Changes Explained:**  
  1.  **Specifies "Burden of Production"** (evidence of independent development), not just "explanation."  
  2.  **Defines "Credible Evidence"** by example (revision histories, drafts), setting a tangible standard.  
  3.  **Addresses Symmetry** by mandating dismissal when evidence of independent work is equally credible on all sides.  
  4.  **Clarifies Scope** by allowing the presumption to be overcome *either* by proof of independence *or* by proof of collaboration identifying the responsible party.  

  ### IV. Addressing the Strongest Counterargument
  I acknowledge the compelling concern: a "coincidence defense" seems cheap, unfalsifiable, and erodes deterrence. However, the revised standard mitigates this:  

  1.  **Evidence Threshold:** Students cannot merely invoke "coincidence." They must provide **concrete, process-based evidence** (drafts, logs). This is costly to fabricate convincingly and absent in true collaboration cases.  
  2.  **Deterrence Preserved:** The presumption remains strong. In >99.9% of cases, students caught with identical work *cannot* produce credible evidence of independent generation. The deterrent lies in the near-impossibility of meeting this burden without genuine proof.  
  3.  **Feasibility:** Evaluating tangible evidence (authenticity of drafts, consistency of logs) is within the Board's competence – far more so than assigning probabilities to independent generation ex nihilo. We assess credibility daily as educators.  
  4.  **Justice Demands It:** Deterrence cannot justify sanctioning students who demonstrably did their own work, however improbable the outcome. The revised rule targets *misconduct*, not freak occurrences backed by proof.  

  ### V. Path Forward
  I propose we:  
  1.  **Vote to dismiss** Case #PLT-114 based on the evidence presented.  
  2.  **Approve the revised Article IV.3** for inclusion in the Academic Integrity Code, subject to legal review and faculty governance approval.  
  3.  **Develop supplementary guidelines** for Boards on evaluating evidence of independent work (e.g., assessing draft authenticity, timestamp reliability).  

  This approach upholds the Code’s rigor while ensuring it serves justice, not just expediency. I welcome your perspectives before Tuesday’s vote.  

  Respectfully,  
  [Your Name]  
  Chair, Academic Integrity Board
