answer: |-
  **Advertising Compliance Authority**  
  **Case Reference: ACR-7342/M**  
  **Adjudication Published: 19 October 2023**

  **1. Parties Involved:**  
  Complainant: VeridiCo Ltd (Supplier of "VeriSim" Perception Products)  
  Advertiser: Oneiros Custom Percepts Ltd (Supplier of "Phantasmata" Bespoke Hallucination Services)  

  **2. Advertisement Summarised:**  
  A printed brochure for Oneiros Custom Percepts Ltd (OCP), circulated via select concierge services. The headline states: "OCP Phantasmata: Indistinguishable from the Real Thing." Body text elaborates: "Experience meticulously crafted hallucinations tailored to your deepest desires. Our proprietary neural induction ensures seamless integration with perceptual reality. Satisfaction guaranteed." A footnote, in smaller font, adds: "Client testimonials confirm: during the experience, they genuinely could not tell it wasn't real."  

  **3. Complaint:**  
  VeridiCo Ltd alleges misleading advertising under Section 5(2) of the Advertising Standards Code (Substantiation of Claims). They contend:  
      (a) The claim "indistinguishable from the real thing" implies OCP's products possess measurable properties identical to those present in veridical perception.  
      (b) OCP provides no specification of *what* property or properties their Phantasmata share with veridical perceptions that enables this indistinguishability (e.g., matching proximal sensory input signature, identical neural activation pattern).  
      (c) Without such a specification, consumers lack any objective basis to verify the claim. The footnote testimonial offers no such verification, merely reporting subjective indistinguishability.  
      (d) The claim therefore exploits ambiguity and cannot be substantiated.  

  **4. Advertiser’s Response:**  
  OCP defends its claim as accurate and substantiated by client experience. They argue:  
      (a) Their claim concerns the *phenomenal character* of the Phantasmata for the subject: namely, that during the experience, the subject cannot discriminate it from a veridical perception. This is an empirical fact attested to by clients.  
      (b) VeridiCo misunderstands the nature of the claim. Phantasmata are not defined by possessing *positive, intrinsic properties* identical to veridical perceptions.  
      (c) To demand a specification of a "shared property" is to presuppose a "common factor" (a single type of state, e.g., "an experience as of X") that encompasses both veridical perceptions and Phantasmata. OCP rejects this presupposition.  
      (d) A Phantasma is characterised *negatively* and *relationally*: it is a state which is *not* a veridical perception of X, but which is *subjectively indiscriminable* from such a veridical perception for the subject at that time.  
      (e) The claim "indistinguishable from the real thing" directly reports this indiscriminability. The footnote testimonial provides evidence *of* this indiscriminability. Demanding a specification of a further shared property is therefore misplaced.  

  **5. Assessment:**  
  **5.1** The Authority recognises the core dispute centres on the nature of "indistinguishability" and what substantiates claims about it.  
  **5.2** *The Causal Argument & Legitimacy of Advertising:* VeridiCo's position implies indistinguishability must arise from a matching proximate cause (e.g., specific sensory input pattern) or neurophysiological state. This constitutes a plausible scientific basis for advertising: a product achieving such a match could legitimately claim indistinguishability. However, the Authority's remit is not to adjudicate between competing philosophical theories of perception, but to assess whether *this specific claim* by OCP is misleading. OCP explicitly disavows grounding its claim on such a "common factor". While VeridiCo's approach offers one potentially verifiable path to substantiation, the Authority cannot mandate it as the *only* legitimate basis for an indistinguishability claim.  
  **5.3** *The Screening-Off Objection & Advertiser's Rebuttal:* VeridiCo argues that if a common factor (e.g., a specific neural pattern "N") explains indistinguishability in *both* veridical and hallucinatory cases, then OCP's "disjunctivist" characterisation (defining Phantasmata solely in terms of not being veridical *and* being indiscriminable) becomes explanatorily redundant. OCP counters that invoking a common factor "N" does not *explain* indistinguishability; it merely redescribes it. If "N" is defined as "the state responsible for the subject's experience being indiscriminable from a veridical perception of X", then citing "N" *presupposes* the indiscriminability it purports to explain. The Authority finds this rebuttal logically coherent within OCP's stated framework. VeridiCo's objection appears to assume the very "common factor" model OCP rejects, rather than proving it necessary for substantiation.  
  **5.4** *Reciprocal Difficulty: Individuating Phantasmata:* If OCP's Phantasmata lack positive intrinsic properties, how are they specified as hallucinations *of a lemon* rather than *of a bellows*? OCP's catalogue descriptions ("Lemon Phantasma", "Bellows Phantasma") imply content. The Authority notes OCP's reliance on the *relational* property: a "Lemon Phantasma" is indiscriminable from a veridical perception *of a lemon*. The specific content is inherited from the veridical perception it mimics, not defined intrinsically. While logically consistent, this raises a practical concern: the catalogue effectively lists what each Phantasma is *not* (i.e., not a veridical perception of X), trading on the subject's understanding of "X". This appears vague for product specification but may not inherently make the *indistinguishability* claim misleading.  
  **5.5** *Disjunctive Predicates as Product Properties:* The claim "indistinguishable from the real thing" implies the product possesses the property of being indiscriminable from a veridical perception. OCP's defence clarifies this property is disjunctive: the state is *either* a veridical perception *or* an indiscriminable hallucination. The Authority has significant reservations. Regulatory practice favours positive, measurable specifications. A disjunctive property ("Either A or not-A but indistinguishable from A") is inherently negative and comparative. It defines the Phantasma *in terms of what it is not* (veridical) and a relation (indiscriminability) lacking independent specification. While not strictly illogical, this stretches the concept of a "product property" within standard advertising substantiation frameworks to its limit.  
  **5.6** *The Testimonial Evidence:* OCP submits a client testimonial stating, "During the Lemon Phantasma, I genuinely couldn't tell it wasn't a real lemon." On OCP's disjunctivist theory, this testimonial reports the *constitutive condition* of the Phantasma (its indiscriminability), not evidence *detecting* a separate property. The Authority recognises this creates a circularity: the testimonial confirms the state *was* indiscriminable, which is precisely how OCP defines a Phantasma. It therefore cannot serve as *independent evidence* verifying the claim against an external standard – the state is a Phantasma *because* it was indiscriminable. While consistent with OCP's theory, this undermines the testimonial's value for *substantiation* within a regulatory context requiring objective verification against defined properties.  

  **6. Ruling:**  
  **6.1** On the headline claim "Indistinguishable from the Real Thing": While philosophically contentious and relying on an unconventional (disjunctivist) characterisation of its product, OCP's defence establishes a coherent, internally consistent basis for the claim centred on subjective indiscriminability. The testimonial, consistent with this view, provides supporting evidence *of* that indiscriminability occurring. VeridiCo has not demonstrated that this understanding of the claim is inherently misleading to consumers. The complaint regarding the headline claim is **Not Upheld**.  
  **6.2** On the footnote claim ("Client testimonials confirm: during the experience, they genuinely could not tell it wasn't real"): The Authority finds this claim *does* risk misleading consumers. It presents the testimonials as *verification* of the indistinguishability claim against an external reality ("wasn't real"). However, on OCP's own account, the testimonial merely reports the subjective indiscriminability which *defines* the Phantasma experience. It does not, and cannot on this theory, provide evidence *that* the experience was non-veridical or *that* its indiscriminability was successfully achieved *as per the headline claim*; it simply reports the state which constitutes it. This conflates the definitional property with evidence substantiating the product achieves it. The footnote claim is therefore inadequately substantiated and likely to mislead. **Upheld**.  

  **7. Action Required:**  
  Oneiros Custom Percepts Ltd must remove or amend the footnote claim in future advertising to avoid suggesting the testimonials verify the non-veridical nature or success of the Phantasma beyond reporting the subjective experience of indiscriminability.  

  **Signed:**  
  **Eleanor Vance**  
  **Deputy Chief Adjudicator**  
  Advertising Compliance Authority
