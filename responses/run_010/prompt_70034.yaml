  The key topics to cover include neglectedness possibly assuming diminishing returns, neglectedness being about other funders rather than the cause itself, issues with multiplying scores instead of adding, comparing importance across incommensurable units, distinguishing tractability from rationalization, and a case study where the rubric failed. They also want a final question that forces a concrete justification.

  I need to design questions that each target a specific pressure point. For each, I'll include the pressure point, likely answer, and a tough follow-up. The final question should prevent retreating to "it's just for conversation" by asking what the rubric has changed or what evidence would make them abandon it. I also need to note which two questions to cut and where the audience might side with the guest.

  For the pressure points: Neglectedness might ignore increasing returns. Multiplying scores implies perfect substitutability and is dominated by the lowest score. Importance comparisons across different units are problematic. Tractability pre-ratings could be post-hoc rationalizations. Neglectedness is about other funders, not the foundation's own impact. A real case study tests the rubric's practicality.

  The guest's likely responses will involve defending the rubric as a conversational tool. The follow-ups need to challenge that by asking for specific examples or forcing contradictions. For the final question, asking what the rubric caused them to do differently might corner them, but she could still say it improved discussions without changing decisions.

  For cuts, I should prioritize the most impactful questions. The tractability and neglectedness questions might be redundant or less central. The audience of program officers might side with the guest on the multiplication question, as many use similar heuristics despite theoretical flaws.

