prompt: |-
  I am assembling a set of considered verdicts about comparative truthlikeness — closeness to the truth — and I want help determining whether any single principle orders all of them. Some background on the constraint I take myself to be under: the notion has to do real work for false theories, since almost everything science has ever believed was false, and I accept that the original content-based definition of the notion breaks down precisely there, making comparisons between two false theories impossible when that is the one comparison it was designed to license. So I am looking for something that can rank falsehoods against falsehoods, and ideally falsehoods against truths, without collapsing into the useless rule that true claims are good and false claims are bad.

  My verdicts, stated as comparisons:

  (1) Newtonian mechanics is closer to the truth than Aristotelian dynamics. Both are false. The first is false in a way that still tracks the world, and I want my ordering to capture what that difference consists in rather than merely record it.

  (2) "The sample weighed 21.4 grams," said of a sample that weighed 21.5 grams, is closer to the truth than the same sentence said of a sample that weighed 34.0 grams. Closeness comes in degrees along a dimension the claim is about.

  (3) "Water is H₂O and combustion releases phlogiston" is further from the truth than "Water is H₂O" alone. Preserving every truth you already had, while adding a falsity, must cost you something.

  (4) But a theory that gets combustion wrong and also describes the composition of water correctly is closer to the truth than one that gets combustion wrong and says nothing about water. Adding a truth to a falsehood can help. So (3) cannot be generalized into the claim that added content always costs.

  (5) Suppose the population of China is 1.412 billion. "The population of China is 1.4 billion" is false; "The population of China is between one and two billion" is true. I judge the false and precise claim closer to the truth than the true and vague one. This is the verdict I expect to be in the most trouble: it sits badly with (3) and (4), which treat getting it right as the primary good, and it implies that being wrong informatively can beat being right emptily.

  (6) Cross-subject comparisons should be meaningful. I want to say that general relativity is closer to the truth than Newtonian mechanics, full stop, not merely with respect to some stipulated set of quantities. Yet every candidate measure I can construct requires fixing a space of states and a weighting over the respects in which two claims can differ, and that weighting looks like a reflection of my interests rather than of the world. I want to hold both that the weighting is interest-relative and that truthlikeness is objective, and I suspect this is untenable; I would like to be told which half to surrender.

  (7) Necessary claims are where my intuitions give out. "There are infinitely many primes" is true, and I do not want it demoted to the status of a trivial truth. But "2 + 2 = 5" is not, I think, further from the truth than "The Eiffel Tower is in Peru," and I do not know what a measure built to handle (2) and (5) is supposed to say about claims that could not possibly have been true.

  What I want in return: a principle, or a small number of competing candidates, stated precisely enough that I can see how to formalize it — what the relata are (sentences, propositions, theories, ranges of possibilities), what the ordering ranges over, and what does the generating work. For each clause, say which of the verdicts above it exists to capture. Then tell me what it implies for cases I have not listed: a necessarily false theory compared with a merely false one; a true theory that is right about everything it addresses but addresses almost nothing, against a false theory that addresses everything and is right about most of it; and two theories that differ only about matters that are in principle unobservable, where no investigation could ever disclose which is closer. Say whether the relation you posit is total or partial, and if partial, which of my comparisons fall outside its domain. Finally, tell me plainly which of (1) through (7) it cannot accommodate. If your conclusion is that no single ordering does the work, argue for that, and then say whether the right move is to divide the notion — accuracy, informativeness, estimated closeness — and which of my verdicts belongs to which fragment.
reasoning: |-
  Okay, let me start by understanding what the user is asking. They want a principle for ordering theories by truthlikeness that satisfies all their verdicts (1-7). The key challenges are comparing false theories, handling dimensions like in (2), balancing truth preservation with informativeness as in (3) and (4), and dealing with necessary falsehoods in (7).

  First, I need to recall existing approaches. Popper's content-based approach fails for false theories. The similarity approach using possible worlds or state spaces seems promising. Verisimilitude measures like Tichý and Oddie’s average distance might help with (1) and (2). But (5) is tricky because a precise falsehood is ranked higher than a vague truth. That suggests a tension between truth and informativeness.

  Looking at (4), adding a truth can improve a false theory. The conjunctive approach might not work here. (6) requires cross-domain comparisons, which is tough because state spaces differ. Interest-relativity vs objectivity is a core tension. For (7), necessary truths and falsehoods need special handling since possible worlds can't represent impossibilities.

  The user wants a unified principle. But maybe a hybrid approach is necessary. Splitting into accuracy and informativeness could resolve some conflicts. For example, (5) prioritizes informativeness over accuracy, which conflicts with (3) and (4). So separating those dimensions might help. But then cross-domain comparisons (6) become even harder without a common metric.

  Assessing each verdict: (1) and (2) are handled by similarity in state spaces. (3) and (4) need a balance—adding truths helps unless they're irrelevant. (5) is problematic because it values precision over truth. If truthlikeness must prioritize truth, then (5) might need to be rejected. (6) requires a universal weighting, but that's subjective. The user might have to accept some interest-relativity. (7) could use impossible worlds or drop the similarity approach for logical claims.

  Possible solutions: A weighted feature similarity with context-dependent weights for (6). But that compromises objectivity. Alternatively, a pluralistic approach where different measures apply in different contexts. But the user wants a single ordering. 

  Conclusion: No single principle satisfies all. Splitting into accuracy (truth-conducive) and informativeness (content) resolves some issues. (1), (2), (3), (4), (7) under accuracy; (5) under informativeness. (6) remains problematic unless weights are standardized, which is unlikely. The user must decide between accepting interest-relativity or limiting cross-domain comparisons.
answer: |-
  Based on your constraints and verdicts, no single formal principle ordering **all** your cases (1-7) exists without significant compromise. The core tension lies between **truth-conduciveness** (getting things right) and **informativeness** (saying something precise), exacerbated by cross-domain comparisons and necessary truths. Below is a structured analysis of leading approaches, their alignment with your verdicts, and the necessary trade-offs.

  ---

  ### **Leading Candidate: Weighted Feature Similarity (State-Space Approach)**
  **Formalization:**
  - **Relata:** Theories as sets of propositions or models in a structured state space (e.g., physical quantities, logical atoms).
  - **Ordering:** A function \( \text{Sim}(T, T^*) \rightarrow \mathbb{R} \), where \( T^* \) is the complete truth.
  - **Generating Work:**  
    For each "feature" \( i \) (e.g., mass, position, chemical composition), define:  
    \[
    \text{Sim}(T, T^*) = -\sum_{i} w_i \cdot d_i(T, T^*)
    \]  
    Here, \( d_i \) is a metric (e.g., absolute error for quantities, Hamming distance for discrete features), and \( w_i \) are weights reflecting the feature's "importance."

  **Verdict Coverage:**
  - (1) **Newton > Aristotle:** Captured if dynamics features (e.g., force, acceleration) are weighted highly. Newton’s errors are smaller in \( d_i \).
  - (2) **Precise falsity > Distant falsity:** Directly handled by \( d_i \) (e.g., |21.4 - 21.5| < |21.4 - 34.0|).
  - (3) **Adding falsity costs:** If \( T_1 = \) "Water is H₂O", \( T_2 = T_1 \land \) "Phlogiston exists", then \( d_{\text{combustion}}(T_2, T^*) > d_{\text{combustion}}(T_1, T^*) \), reducing similarity.
  - (4) **Adding truth helps:** If \( T_1 \) is false about combustion, \( T_2 = T_1 \land \) "Water is H₂O", then \( d_{\text{water}}(T_2, T^*) < d_{\text{water}}(T_1, T^*) \), increasing similarity if \( w_{\text{water}} > 0 \).

  **Failures:**
  - (5) **Precise falsity > Vague truth:** Fails. "1.4 billion" (false) has high \( d_i \) for population; "1-2 billion" (true) has \( d_i = 0 \). Truth always wins unless \( w_i = 0 \), but zero weights ignore features.
  - (6) **Cross-domain objectivity:** Requires fixed \( w_i \) across domains. Yet weights are interest-relative (e.g., is gravity "more important" than chemistry?). **You must surrender objectivity** or limit comparisons to fixed feature sets.
  - (7) **Necessary falsehoods:** State spaces typically exclude impossibilities. "2+2=5" has no \( d_i \) in physical spaces. Requires impossible worlds or ad hoc handling.

  **Other Cases:**
  - *Necessarily false vs. contingent false:* Only comparable if logical "features" (e.g., arithmetic truths) are included with weights.
  - *True-but-vague vs. false-but-comprehensive:* Vague truth wins on truth-conduciveness; comprehensive theory wins if mean similarity across many features is higher.
  - *Unobservable differences:* If features include unobservables, theories differ; else, they are equally distant.

  **Ordering:** Partial (depends on shared feature weights).

  ---

  ### **Alternative: Conjunctive/Content-Based Approach (Schurz-Weingartner)**
  **Formalization:**
  - **Relata:** Theories as sets of conjuncts (elementary propositions).
  - **Ordering:** \( T_1 \) is closer than \( T_2 \) iff:
    - All true conjuncts of \( T_2 \) are in \( T_1 \), **and**
    - All false conjuncts of \( T_1 \) are in \( T_2 \), **or**
    - \( T_1 \) has strictly more true conjuncts and no more false ones.

  **Verdict Coverage:**
  - (3) **Adding falsity costs:** "Water is H₂O" (true) > "Water is H₂O ∧ Phlogiston" (adds false conjunct).
  - (4) **Adding truth helps:** "Combustion wrong ∧ Water right" > "Combustion wrong" if "Water right" is a true conjunct not in the latter.

  **Failures:**
  - (1) **Newton vs. Aristotle:** Unclear how to decompose into conjuncts; Newton may have more false conjuncts about relativity.
  - (2) **Degrees of error:** Cannot rank "21.4g" vs. "34.0g"; no metric for closeness.
  - (5) **Precise falsity > Vague truth:** "1.4 billion" (false conjunct) loses to "1-2 billion" (true conjunct).
  - (6) **Cross-domain:** Requires shared propositional atoms; hopeless for physics vs. demography.
  - (7) **Necessities:** Treats all false conjuncts equally; "2+2=5" and "Eiffel Tower in Peru" both single false conjuncts.

  **Ordering:** Partial (only comparable when conjuncts are nested).

  ---

  ### **Why No Single Principle Works**
  1. **Incommensurable Values (Verdicts 3,4 vs. 5):**  
     (3) and (4) prioritize **avoiding error**. (5) prioritizes **informativeness** (precision). These conflict: a measure favoring truth cannot rate a precise falsehood above a vague truth without abandoning truth-conduciveness.
     
  2. **Cross-Domain Objectivity (Verdict 6):**  
     Any metric requires weighting "respects of similarity." Weights reflect practical or epistemic interests (e.g., predicting orbits vs. chemical reactions). **Surrender objectivity:** truthlikeness is interest-relative.

  3. **Necessities (Verdict 7):**  
     Similarity metrics assume possible states. "2+2=5" is *incomparable* to empirical falsehoods without controversial extensions (e.g., "logical distance").

  ---

  ### **The Way Forward: Split the Notion**
  **Proposal:** Divide truthlikeness into three distinct (but related) concepts:

  | **Concept**       | **Formalization**                          | **Captures Verdicts**      | **Handles**                                                                 |
  |-------------------|-------------------------------------------|----------------------------|-----------------------------------------------------------------------------|
  | **Accuracy**      | Probability of truth given evidence (Bayesian) or error magnitude (e.g., MSE). | (2), (3), (4)              | Truth-conduciveness. Rejects (5): true > false always.                      |
  | **Informativeness** | Semantic content (e.g., logical entropy, precision of intervals). | (5)                        | Why "1.4 billion" is better than "1-2 billion" *if true*. Fails (3), (4). |
  | **Similarity**    | Weighted feature similarity (as above).   | (1), (2)                   | Domain-specific closeness. Requires fixed weights/features for (6).         |

  **Resolution for Your Cases:**
  - (1) & (2): Use **similarity** (with context-dependent weights).
  - (3) & (4): Use **accuracy** (truth-preservation matters).
  - (5): Use **informativeness** (precision as a standalone virtue).
  - (6): **Similarity** with weights fixed by domain conventions (e.g., physics). Accept interest-relativity.
  - (7): **Accuracy** for empirical falsehoods; **informativeness** for logical claims (but no cross-type comparison).

  **Necessary Compromises:**
  - **Abandon (5) in truthlikeness:** If truthlikeness *must* prioritize truth, reject (5). Precise falsity cannot beat truth.
  - **Accept partial ordering:** Not all theories are comparable (e.g., Aristotle vs. population claims).
  - **Surrender cross-domain objectivity:** Admit weights reflect human interests.

  **Conclusion:** Your verdicts demand incompatible properties. **Split the concept** to preserve coherence. For a unified *pragmatic* measure, adopt **weighted feature similarity** but reject (5) and accept interest-relativity for (6). This captures (1)-(4) and (7) with adjustments, but not (5). If (5) is non-negotiable, truthlikeness must incorporate informativeness separately, at the cost of theoretical unity.
