  First, I need to fully grasp both mechanisms: price-based screening (less eligibility principle) and procedure-based screening (administrative conditionality). The user's coined terms - "reference problem" and "capacity confound" - are crucial analytical lenses here. 

  For question 1 about less eligibility's coherence, I consider how the wage-relief entanglement operates differently in competitive markets versus Speenhamland systems. The core issue is whether this dynamic creates a downward ratchet or complete incoherence. Speenhamland's integration of relief into wages seems particularly problematic for the reference standard.

  Question 2's capacity confound requires examining the "good targeting" argument carefully. I need to articulate why procedure costs might correlate with need while acknowledging when this breaks down - especially regarding hidden barriers like mental health or digital literacy. The distinction between apparent and actual costs matters here.

  When comparing mechanisms (question 3), I'm mapping four dimensions: revelation/concealment dynamics, gaming vulnerabilities, and wage floor impacts. Employers emerge as key actors in gaming price-based systems, while local officials have more leverage in procedural systems. The wage floor effects differ fundamentally between mechanisms.

  For question 4's moral dimension, I focus on how both systems create moral appearances through visible compliance behaviors while avoiding substantive desert judgments. The public spectacle of compliance seems functionally important for legitimacy.

  The combination analysis (question 5) suggests compounding harms, particularly regarding sanction misinterpretation. I see procedural failures obscuring structural barriers when layered with inadequate benefits.

  Finally, for citizenship standing (question 6), I weigh humiliation against misattribution of failure. The societal unemployment context matters - mass unemployment undermines both systems' logic differently. I lean toward procedure-based systems being less damaging when properly administered, but acknowledge their pernicious potential when capacity confounds are ignored.

  Throughout, I maintain the user's requested focus on argument over historiography, marking contestable claims explicitly. The analysis stays grounded in their conceptual framework while pushing its implications further.
answer: |-
  Here is a rigorous comparison addressing your stipulated concepts and questions:

  ### 1. Less Eligibility: Incoherent or Open-Ended?  
     - **In competitive markets:** It is an open-ended ratchet, not incoherent. The rule *can* be applied: relief must be set below the prevailing wage floor. However, the wage floor itself is endogenous. If relief depresses wages (by expanding labor supply), administrators must *continuously* lower relief to maintain "less eligibility," creating a downward spiral. The rule functions but lacks a stable equilibrium.  
     - **Under Speenhamland:** The rule becomes **incoherent**. Relief *is* the wage floor (via top-ups), so the "independent labourer" against whom relief is measured *does not exist*. Attempting to set relief below a wage that incorporates relief is logically impossible—a closed loop with no external reference. The 1834 reforms explicitly sought to break this entanglement by abolishing wage supplements.  

  ### 2. Capacity Confound: Defect or Feature?  
     - **Strongest argument for feature:** Conditionality imposes "costly signals" (time, effort, compliance). Only those with truly poor alternatives (high need) will pay these costs. If compliance is equally burdensome for all, it efficiently screens for desperation. *Example:* A demanding job-search requirement deters those with viable informal work.  
     - **Critical assumptions required:**  
       1. Compliance costs must correlate *inversely* with outside options (i.e., the truly desperate face *lower* net costs to comply).  
       2. Variations in capacity (literacy, health, etc.) must be negligible *or* must themselves signal deservedness (e.g., "if you can’t attend appointments, you don’t *deserve* aid").  
     - **Why this fails:** Costs are often *higher* for the most vulnerable (e.g., mental health crises, homelessness). The confound arises because compliance costs measure administrative capacity, not just need.  

  ### 3. Direct Comparison  
     | Dimension               | Price-Based Screening (Less Eligibility)                     | Procedure-Based Screening (Conditionality)                  |  
     |-------------------------|-------------------------------------------------------------|-------------------------------------------------------------|  
     | **Reveals about claimant** | Willingness to accept degrading terms                       | Tolerance for bureaucracy; persistence                      |  
     | **Conceals from admin**   | Structural barriers to work (discrimination, recessions)    | Hidden vulnerabilities (e.g., anxiety, cognitive impairments) |  
     | **Gaming actors**        | **Claimants:** Feign destitution. **Employers:** Depress wages knowing relief is a worse alternative. **Officials:** Underreport local wages to curb relief costs. | **Claimants:** Perform job searches without intent. **Officials:** Impose arbitrary hurdles to reduce caseloads. Employers largely unaffected. |  
     | **Effect on wage floor** | Actively suppresses it (relief as wage-subsidy alternative) | Neutral in theory, but may expand labor supply, indirectly pressuring wages |  

  ### 4. Moral Sorting Without Moral Adjudication  
     Both mechanisms convert *behavior* under duress into proxies for moral desert:  
     - **Price-based:** Accepting punitive relief "proves" you lack work ethic.  
     - **Procedure-based:** Jumping bureaucratic hurdles "proves" you are "trying."  
     This **appearance is functional**, not incidental. It legitimizes the system by:  
     - Depoliticizing poverty (blaming choices, not structures).  
     - Offering visible "proof" of desert (compliance rituals).  
     - Avoiding contentious moral debates about individual cases.  
     The public infers "undeserving" from non-compliance or acceptance of degradation, mistaking systemic effects for moral failure.  

  ### 5. Combined Mechanisms: Compounding Failures  
     - **Compounding, not masking:** Inadequate benefits *heighten* the stakes of sanctions, while harsh conditionality excludes those unable to comply.  
     - **Sanctions misread as workshyness:** When benefits are deliberately inadequate, accepting them signals desperation. If a claimant then fails procedural requirements (due to capacity issues), administrators interpret this as *declining* even "generous" relief—"proof" of laziness. The system obscures the role of incapacity by design.  
     - **Outcome:** The most excluded face a double punishment—inadequate aid *and* moral condemnation for failing hurdles.  

  ### 6. Citizenship Standing: Which Does Less Damage?  
     - **Price-based** inflicts **active humiliation**: It forces claimants to publicly accept sub-citizen status (e.g., workhouse stigma).  
     - **Procedure-based** inflicts **passive erasure**: It excludes through administrative violence (e.g., missed appointments = "voluntary" withdrawal).  
     - **Verdict:** Price-based is worse for citizenship. It ritualizes degradation, directly attacking dignity. Procedure-based, while corrosive, at least preserves a *formal* claim to entitlement (if you comply).  
     - **Unemployment context matters:**  
       - **Mass unemployment:** Price-based collapses entirely (no "independent labourer" baseline exists). Procedure-based becomes cruelly absurd (no jobs to "search" for). Both destroy citizenship, but price-based’s explicit cruelty may provoke backlash.  
       - **Frictional unemployment:** Procedure-based is less damaging *if* well-administered (e.g., support for compliance). Price-based remains inherently stigmatizing.  

  **Contestable Claims & Positions:**  
  - **On reference problem:** I argue less eligibility is *operationally coherent* in competitive markets but *socially destabilizing*. Others might claim it is inherently incoherent because markets are never perfectly competitive.  
  - **On citizenship:** I prioritize explicit humiliation over bureaucratic exclusion. One could argue procedure-based is worse because it masks state cruelty as neutrality. I reject this: Degradation is foundational to less eligibility’s design.  
  - **On gaming:** I assert employers game price-based systems. Some might argue employers benefit indifferently; I contend they actively shape wage floors knowing relief sets a ceiling.  

  This analysis prioritizes the logical and operational mechanics of your frameworks, highlighting how both systems use revealed behavior to obscure structural violence while producing moral theater.
