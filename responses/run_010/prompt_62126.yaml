prompt: |-
  My housemate is drafting a long post attacking the whole "science can finally tell us how to live" genre, and the engine of it is an analogy I can't evaluate. He says deriving an ought from an is would be like violating conservation of energy: a valid argument can't manufacture content that wasn't in the premises, so if every premise is purely descriptive then nothing normative can come out the far end — and anyone who thinks otherwise is smuggling a normative premise in and dressing it up as data. He treats this as a law rather then a rule of thumb and thinks it disposes of the naturalists in one move.

  Two people objected at our reading group and I couldnt referee. One said the law is provably false, and gave this: from the plain descriptive claim that tea drinking is common in England you can validly infer the disjunction of that claim with the claim that all New Zealanders ought to be shot, by disjunction introduction. Then he pressed a dilemma — either that disjunction counts as normative, in which case you've already got an ought out of an is, or it counts as descriptive, in which case adding one more descriptive premise denying the tea drinking and running a disjunctive syllogism gets you a flat out ought. The other objector said the analogy is aimed at a Hume who never existed, since Hume's complaint was about authors who drift from is-statements to ought-statements without noticing they've changed the subject, not about what's formally derivable.

  Can you audit the analogy? Spell out the correspondence table — what plays the energy, what plays the closed system, what plays the law itself, what "content" is supposed to mean here, and who exactly the smuggler is. Then the disanalogies, separated into the ones that actually bite against the use he's making of it and the ones that are just noise. Does the one-move conclusion survive once they're on the table? And is there a better analogy — I keep thinking dimensional analysis fits better, you can't add metres to seconds, but that seems to imply a legitimate conversion factor might exist, which could be worse for him than the version he started with. Last thing: does the analogy, on its own terms, condemn going the other direction too, ought to is? He says it doesn't and I can't see why not.
reasoning: |-
  Okay, the user's housemate is critiquing the "science can tell us how to live" genre using a conservation of energy analogy. The core idea is that deriving "ought" from "is" violates a logical law similar to how perpetual motion violates physics. Two objections were raised: one using disjunction introduction to challenge the law's absoluteness, and another arguing Hume's original point was about unnoticed subject changes, not formal derivability.

  The user wants a thorough audit of this analogy. They need:
  1. Correspondence table explaining energy/content, closed system/argument, law/logic, and the smuggler
  2. Disanalogies that actually undermine the housemate's position
  3. Whether the "one-move disposal" of naturalism survives
  4. Alternative analogy (dimensional analysis) pros/cons
  5. Whether the analogy forbids "ought to is" derivation

  First, unpacking the analogy: 
  The "energy" is normative content - the "ought" that can't be created from descriptive "is" premises alone. The "closed system" is the argument itself, where premises can't gain external content. The "law" is logical validity requiring premise-conclusion content alignment. The "smuggler" is anyone sneaking in disguised normative premises.

  Key disanalogies that actually bite:
  - Logical validity ≠ conservation (logic allows content rearrangement like disjunctions, physics forbids energy creation)
  - Normative/descriptive boundary isn't atomically sealed (disjunctions blur the lines as shown in the objection)
  - Hume's actual concern was about unnoticed transitions, not formal derivability - misaimed analogy

  The disjunction counterexample is devastating because:
  - It formally derives a normative-containing disjunction from pure description
  - Forces dilemma: either accept normative output from description, or admit disjunctions are descriptive... which then allows pure "ought" via disjunctive syllogism

  Dimensional analysis analogy works better but hurts the housemate: 
  - Units (is/ought) need conversion factors (bridge principles)
  - Unlike conservation, conversion factors are possible in ethics (e.g. "suffering is bad")
  - This actually supports naturalism by showing what's needed

  The analogy doesn't forbid "ought to is" because:
  - Normative premises contain descriptive implications ("ought implies can")
  - Removing content is allowed (energy conservation permits destruction; logic permits weakening conclusions)
  - So going from "ought" to "is" is like energy dissipation - logically permissible

  Conclusion: 
  The conservation analogy fails as a knockdown argument. The disjunction objection proves normative content can formally appear from descriptive premises. Hume's real point was about vigilance, not impossibility. Naturalists aren't defeated - they just need to defend their bridge principles. The housemate's "one-move disposal" doesn't survive.
answer: |-
  Let's dismantle this analogy systematically. Your housemate's core argument relies on **Conservation of Normative Content (CNC)**, modeled after conservation of energy: *"No valid argument can produce normative conclusions from purely descriptive premises without smuggling in normative content."* We'll audit the analogy, dissect the objections, and test its validity.

  ---

  ### **1. Correspondence Table: The Analogy Mapped**
  | **Conservation of Energy** | **Conservation of Normative Content** | **Role** |
  |----------------------------|--------------------------------------|----------|
  | **Energy** | *Normative "ought" content* | The substance being conserved. In logic, "content" = evaluative/moral force (e.g., "should," "must," "good"). |
  | **Closed System** | *The logical argument* | The boundaries of the deduction. Premises cannot import external content mid-argument. |
  | **Law of Conservation** | *Logical validity rules* | Validity requires the conclusion's content to be "contained in" the premises. CNC is the purported law forbidding normative output from descriptive input. |
  | **"Manufacturing" Energy** | *Deriving "ought" from "is"* | Creating moral imperatives from neutral facts. |
  | **"Smuggler"** | *Naturalist ethicist* | Anyone sneaking a normative premise (e.g., "suffering is bad") into an argument disguised as descriptive science (e.g., "neuroscience shows suffering activates pain centers"). |

  ---

  ### **2. Disanalogies: What Bites vs. Noise**
  #### **Fatal Disanalogies (Undermine His Use)**
  - **Logical Validity ≠ Physical Conservation**:  
    - Energy conservation is a *physical law*—energy cannot be created. Logic is *formal*—validity only requires truth preservation, not "content conservation."  
    - **Why it bites**: The disjunction objection proves this. From "Tea drinking is common in England" (descriptive), disjunction introduction validly yields:  
      > *"Tea drinking is common in England OR all New Zealanders ought to be shot."*  
      If this disjunction is normative (due to the "ought" clause), you've derived normativity from description. If it's descriptive (as the disjunction's truth depends only on the tea-drinking claim), adding "Tea drinking is NOT common in England" and using disjunctive syllogism gives you *"All New Zealanders ought to be shot"*—a flat "ought." **This violates CNC in both cases.**  

  - **Normative/Descriptive Boundary is Porous**:  
    - Physics has clear units (joules, calories). "Ought" and "is" aren't atomically sealed:  
      - Disjunctions (as above) blend them.  
      - Concepts like "function," "health," or "welfare" can be descriptive *and* carry normative weight (e.g., "This toxin causes organ failure" implies "avoid this toxin" if you presuppose health is good).  
    - **Why it bites**: Hume's target was *unnoticed shifts* in language (e.g., moving from "humans seek pleasure" to "humans *should* seek pleasure"). But formal logic can generate normativity from description via structure alone, as the disjunction shows. CNC falsely assumes premises are "pure," ignoring logical operations.  

  - **Hume's Actual Point Was Epistemic, Not Logical**:  
    - Hume warned against *unargued* transitions from "is" to "ought," not formal underivability. His concern was sloppy reasoning, not metaphysical impossibility.  
    - **Why it bites**: Your housemate misuses Hume. If CNC were a "law," Hume's complaint would be redundant—but it's not; it's a critique of rhetoric.  

  #### **Harmless Disanalogies (Noise)**
  - **Energy is Quantifiable; "Content" Isn't**: Normative "content" lacks units. But this doesn't save CNC—the disjunction counterexample works regardless.  
  - **Physics is Empirical; Logic is Formal**: Conservation of energy is discovered; validity rules are defined. Irrelevant—the issue is whether CNC *accurately describes* logic.  

  ---

  ### **3. Does the "One-Move Conclusion" Survive?**  
  **No.** The disjunction objection **fatally undermines** CNC:  
  - **Dilemma 1**: If the disjunction is normative, you've derived "ought" from "is."  
  - **Dilemma 2**: If the disjunction is descriptive, adding a descriptive premise (denying the first disjunct) derives a pure "ought."  
  **Result**: CNC is false as a *logical law*. Deriving normativity from description is *formally possible* (though the conclusions may be absurd or trivial).  

  **Implication for Naturalism**:  
  - Naturalists (e.g., Sam Harris) argue science *can* derive "oughts" from "is" (e.g., "suffering reduces well-being" + "well-being is good" → "reduce suffering").  
  - CNC doesn't "dispose of them" because:  
    1. They often *explicitly* include a normative bridge premise (e.g., "well-being is good"), which isn't "smuggled"—it's argued for.  
    2. The disjunction objection shows normativity *can* emerge structurally.  

  ---

  ### **4. Better Analogy: Dimensional Analysis**  
  You're right—this fits cleaner:  
  - **Analogy**: Just as you can't add meters to seconds without a conversion factor (e.g., speed = m/s), you can't derive "ought" (normative units) from "is" (descriptive units) without a "conversion principle."  
  - **Pros**:  
    - Explains why naturalists aren't *obviously* wrong: They offer "conversion factors" (e.g., "survival is good," "pain is bad").  
    - Clarifies the debate: It's about whether valid conversion factors exist (e.g., can "good" be *defined* by evolution or neuroscience?).  
  - **Cons for Your Housemate**:  
    - **Worse for him**: It implies naturalism *could* work with a defensible conversion factor. His analogy implies it's *impossible* (like perpetual motion).  
    - **Why it's stronger**: It avoids the disjunction problem—a disjunction of meters and seconds is still a hybrid unit, not pure time or space.  

  ---

  ### **5. Does the Analogy Condemn "Ought to Is"?**  
  **No—and here's why**:  
  - **Conservation of Energy**: You can *destroy* energy (e.g., friction converts kinetic energy to heat). Only *creation* is forbidden.  
  - **Logical "Content" Analogy**:  
    - Deriving "is" from "ought" (e.g., "You ought to help her" → "She exists") *removes* normative content. Validity permits this (e.g., via weakening: P→Q entails P→(Q∨R)).  
    - Example: "We ought to reduce suffering" → "Either we ought to reduce suffering OR the moon is cheese." The conclusion is still normative, but you can derive descriptive claims if the "ought" implies them (e.g., "ought implies can" → "Reducing suffering is possible").  
  **Result**: The analogy only forbids *generating* normativity from non-normativity, not reducing it.  

  ---

  ### **Conclusion and Advice**  
  - **Analogy Verdict**: The conservation of energy analogy **fails** as a knockdown argument. It misrepresents logic (ignoring structural operations like disjunction) and misapplies Hume.  
  - **Housemate's Weakness**: His "one-move" defeat of naturalism collapses. The real debate is whether "conversion factors" (e.g., "well-being = good") are defensible—a hard philosophical problem, not a logical truism.  
  - **For the Reading Group**: Side with the disjunction objector—it proves CNC false. Hume's objector is also right: CNC distracts from Hume's actual warning about rhetorical sleight-of-hand.  
  - **Better Framing**: Use dimensional analysis. It forces naturalists to defend their conversion principles (e.g., "why is flourishing good?") without pretending their project is logically impossible.  

  **Final Thought**: Your housemate's analogy is elegant but overextended. It confuses *"you can't get something from nothing"* (which is true) with *"you can't rearrange premises to reveal latent content"* (which is false)—and the disjunction is the atomic counterexample that proves it.
