prompt: |-
  A friend and I argued about this for two hours last night and neither of us will give ground, so I would like a considered third opinion.

  Here is the practice. In a mediated settlement — a partnership breakup, a labour dispute, a contested insurance claim — the mediator caucuses with each side and extracts two numbers: the opening aspiration, and the walk-away point, the least that side will take before it prefers litigation or a strike. He then steers the parties toward the settlement at which each has surrendered the same *fraction* of the distance between its own aspiration and its own bottom line. And yet the same practitioners, in the same week, will pronounce it fair simply to split the difference — equal absolute concessions — whenever the two ranges happen to be of comparable size. My friend insists the first rule is nothing other than the Kalai–Smorodinsky bargaining solution, and that mediators are doing applied cooperative game theory; I think he is flattering a folk custom that cannot even say which of two rules it is using.

  What does the practice presuppose? Reconstruct the implicit theory of value and of fairness, separating what it strictly requires from what it merely sits comfortably with. In particular: does settling in dollars already assume the two parties' utilities are comparable on a common cardinal scale, or does the per-side normalization do all the work? Why treat the walk-away point, rather than the status quo or either side's entitlements, as the baseline from which gains are measured? What does the rule assume about the sincerity of a stated aspiration, given that every handbook on negotiation recommends opening high? Is the practice coherent, or does hosting both rules commit it to two incompatible theories? And where exactly does my friend's identification with the formal solution break down — what does the model assume about the feasible set, and about what is commonly known, that a caucus room fails to supply?
reasoning: |-
  Okay, let me try to unpack this user's query. They had a two-hour argument with a friend about mediation practices, specifically about two rules: the proportional concession method and splitting the difference. The user is skeptical that the proportional rule is genuinely the Kalai-Smorodinsky solution, while their friend insists it is. 

  First, I need to understand both the mediation practices and the game theory concepts involved. The mediator collects each party's aspiration point and walk-away point, then aims for a settlement where both give up the same fraction of their range. Splitting the difference is used when ranges are similar. The friend links this to Kalai-Smorodinsky, but the user thinks it's just a folk custom without theoretical backing.

  I should start by recalling what the Kalai-Smorodinsky solution entails. It requires a comprehensive feasible set, which in mediation isn't fully known. The mediator only has two points per party, not the entire set of possible outcomes. That's a key difference. Also, KS assumes interpersonal utility comparisons, but mediators normalize per side, avoiding that issue. The walk-away point as the baseline is practical but ignores entitlements or status quo, which might not align with fairness theories.

  Next, the user asks what the practice presupposes. The proportional rule assumes that concessions should be equal in percentage terms, prioritizing relative sacrifice. The walk-away as the baseline makes sense for avoiding impasse but doesn't account for moral entitlements. Aspiration points are likely inflated, so mediators might adjust for that, though the rule doesn't specify how.

  The coexistence of both rules is tricky. Using proportional concessions most times but switching to equal absolute when ranges are similar suggests mediators prioritize pragmatism over theoretical consistency. This could be seen as incoherent, but practically, it's about finding a focal point that both parties accept as fair in the moment.

  The friend's claim breaks down because KS requires a known feasible set and common knowledge, which isn't present in caucusing. Mediators work with limited info, and the process is more about perceived fairness than theoretical optimization. Also, KS uses the ideal point based on the feasible set, while mediators use stated aspirations, which are strategic and not necessarily feasible.

  Underlying all this, the user might be seeking validation of their skepticism towards applying game theory too literally to real-world practices. They might also want a deeper understanding of how these mediation methods handle issues like utility comparison and strategic behavior. The assistant's response needs to address these points clearly, showing where the practice aligns with theory and where it diverges, emphasizing practicality over theoretical purity.
answer: |-
  Your analysis is astute: this mediation practice is a pragmatic heuristic, not rigorous game theory, and its coexistence with "split the difference" reveals inherent tensions. Let's reconstruct its presuppositions and limitations:

  **Core Presuppositions:**
  1.  **Utility as Linear & Cardinal (Per Party):** The rule assumes each party's utility for outcomes between their walk-away point (W) and aspiration point (A) can be measured cardinally and linearly using dollars (or whatever the settlement metric is). A concession of X dollars represents the *same utility loss* anywhere within that range for that party. This is essential for the "fraction surrendered" concept.
  2.  **Fairness as Equal Relative Sacrifice:** Fairness is defined as both parties sacrificing the *same proportion* of their *potential gain* (A - W). If Party 1 gives up 30% of their (A1 - W1), Party 2 should also give up 30% of their (A2 - W2). This prioritizes proportional loss aversion over absolute gains or external entitlements.
  3.  **Walk-Away as the Relevant Baseline:** The walk-away point (W) is treated as the "zero point" or "no-deal" reference for utility calculation *in the negotiation context*. This presupposes:
      *   W represents a credible threat point (litigation/strike outcome).
      *   The status quo ante is either irrelevant or subsumed into the calculation of W.
      *   Moral entitlements or legal "should haves" are irrelevant *for this specific distributive negotiation*; the only relevant "right" is the right to walk away. Fairness is defined *relative to the BATNA*, not abstract justice.
  4.  **Aspirations as Bounded Maximums:** While recognizing aspirations (A) may be inflated, the rule presupposes they represent a *conceptually possible upper bound* within the negotiation space. They define the "pie" to be divided proportionally, even if actually unattainable.
  5.  **Feasibility of Proportional Point:** The rule presupposes a settlement point exists where the proportional concession is equal and that this point is mutually acceptable and feasible.

  **Addressing Your Specific Questions:**

  1.  **Cardinal & Comparable Utilities?**
      *   **Per-Side Normalization Does the Work:** The practice **does NOT require interpersonal utility comparisons.** Each party's utility scale is normalized independently between their own W (u=0) and A (u=1). The "fraction surrendered" (f) is calculated *separately* for each. The settlement point is where f1 = f2. This avoids comparing the *absolute* utility loss of $X to Party 1 vs. $Y to Party 2. It only compares the *relative* sacrifice (30% of *my* potential gain vs. 30% of *your* potential gain). This is a key difference from utilitarian notions requiring a common scale.

  2.  **Why Walk-Away as Baseline?**
      *   **Pragmatism & BATNA Focus:** Mediation is about avoiding impasse. W represents the concrete, negotiation-ending alternative. It's tangible and (ideally) verifiable (e.g., cost of litigation, strike fund duration). The status quo ante often *is* the impasse point (e.g., partnership dissolved but assets undivided). Entitlements are frequently disputed (that's why they're mediating!). W provides a pragmatic, operationally defined baseline tied directly to the consequences of *not* settling here and now. Gains are measured against the *threatened worse outcome*.

  3.  **Sincerity of Aspirations?**
      *   **Recognized as Strategic, Used as Reference:** Mediators know A is inflated. The rule **does not assume sincerity** in A representing a true expectation. Instead, it uses A pragmatically:
          *   As a psychological anchor defining the party's perceived "full victory."
          *   As the upper bound for defining the range (W-A) over which concessions are measured proportionally.
          *   The *magnitude* of (A - W) might be influenced by how ambitiously A is set, but the *fraction surrendered* calculation inherently adjusts for this inflation. A party setting an unrealistically high A simply defines a larger range over which they are willing to concede proportionally. The mediator uses A operationally, not naively.

  4.  **Coherence of Hosting Both Rules?**
      *   **Pragmatic Incoherence, Not Theoretical:** Strictly speaking, the rules reflect **different fairness principles**: equal relative sacrifice vs. equal absolute concession. They are incompatible at a theoretical level. However, their coexistence is *pragmatically coherent*:
          *   **Cognitive Ease & Focal Points:** "Splitting the difference" is simple, intuitive, and creates a strong focal point when ranges overlap significantly. It feels instinctively "fair" in symmetric situations.
          *   **Reducing Negotiation Costs:** When ranges are similar, haggling over proportional splits might yield minimal practical difference vs. a simple split, wasting time.
          *   **Perceived Fairness Context:** In disputes with roughly symmetric stakes/power, equal absolute concessions *feel* fair. In highly asymmetric cases (e.g., small business vs. giant insurer), proportional sacrifice *feels* fairer to prevent the weaker party from bearing a larger relative burden. The mediator chooses the rule fitting the *context and psychology* of the specific parties.

  5.  **Where Kalai-Smorodinsky (KS) Identification Breaks Down:**
      Your friend's identification is insightful but ultimately flawed. KS and proportional concession share the *intuition* of proportional gains relative to an ideal, but differ critically:

      *   **The Feasible Set (`S`):**
          *   **KS:** Requires a well-defined, *comprehensive*, and *commonly known* feasible set `S` of all possible utility outcomes. The Ideal Point (u1_max, u2_max) is the supremum of utilities *actually achievable* within `S`.
          *   **Mediation Practice:** The mediator has **no knowledge of the true feasible set `S`.** They only have two points per party (W, A). A is *not* the KS Ideal Point; it's a *stated aspiration*, often outside the true feasible set. The mediator assumes the line connecting (W1, A2) and (A1, W2) defines the bargaining frontier, which is rarely linear or accurate. The true frontier is unknown and undiscovered.
      *   **Common Knowledge & Rationality:**
          *   **KS:** Assumes common knowledge of `S`, rationality, and the solution concept itself.
          *   **Mediation Practice:** Parties have private information, may be irrational or emotional, and are unaware of KS. The mediator uses the rule as a tool to *impose* an outcome based on limited data, not as a mutually recognized rational solution derived from a known `S`.
      *   **The Baseline:**
          *   **KS:** Typically defines the disagreement point (D) as the status quo or mutual walk-away point (W1, W2). Gains are measured from (D).
          *   **Mediation Practice:** Uses each party's *own* W as their personal zero point, *not* necessarily a common disagreement point (though (W1, W2) is the de facto D). More crucially, KS uses the Ideal Point *over `S`*, while mediation uses the stated (and inflated) A points.
      *   **The Outcome:**
          *   **KS:** Finds the point on the Pareto frontier of `S` where the ratio (u1 - d1)/(u1_max - d1) = (u2 - d2)/(u2_max - d2).
          *   **Mediation Practice:** Finds the point (often *not* on the true Pareto frontier) where (S1 - W1)/(A1 - W1) = (S2 - W2)/(A2 - W2), using *stated* A's and W's as proxies. It ignores the true shape of `S` and actual utilities beyond the linear interpolation between the collected points.

  **Conclusion:**

  The practice presupposes cardinal, linear per-party utilities normalized between strategically stated (but pragmatically accepted) walk-away and aspiration points. It defines fairness as equal relative sacrifice from the walk-away baseline, prioritizing pragmatic deal-making over moral entitlements or the pre-dispute status quo. It knowingly uses inflated aspirations as reference points, not sincere expectations.

  While sharing an intuitive similarity with Kalai-Smorodinsky in aiming for proportional gains, the practice fundamentally diverges. It lacks the comprehensive, known feasible set (`S`), uses stated aspirations instead of the true ideal point derived from `S`, and operates without common knowledge or rationality assumptions. It's a heuristic tool for finding a psychologically acceptable settlement under information asymmetry, not an application of cooperative game theory.

  The coexistence with "split the difference" highlights its true nature: **a flexible toolkit for mediators, prioritizing perceived fairness, cognitive ease, and deal closure within the specific context over theoretical consistency.** Your friend identifies a resonant intuition, but you are correct that this is largely a sophisticated folk custom adapted to the messy realities of negotiation, not applied KS. The mediator's skill lies in choosing which rule (or blend) will *feel* most fair and acceptable to *these particular parties* in *this specific dispute*, given the limited information available in the caucus room.
