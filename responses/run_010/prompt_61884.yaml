prompt: |-
  I've been reading decision-theory arguments on LW and its descendants for something like fifteen years and I've finally written my own Allais position down in one place for a little informal write-up. I want it stress-tested, not explained to me — assume I already know the standard moves and just do the audit.

  Setup, textbook version: problem 1 is 1A = $1M for sure vs 1B = 10% of $5M, 89% of $1M, 1% of nothing. Problem 2 is 2A = 11% of $1M vs 2B = 10% of $5M, 90% of nothing.

  What I claim to hold:

  1. My reason for wanting EU-maximizing preferences is entirely the exploitability one. Linearity in probabilities isn't pretty to me; its just that if your preferences aren't representable that way, somebody can make money off you across a sequence of choices. The normativity comes from the pump, not from the axiom.

  2. I make the Allais choices — 1A and 2B — and I don't think that's a bug in me. The certainty is doing something real, it isn't a presentation artifact.

  3. Reduction of compound lotteries: yes, obviously. A 10% chance of a 50% chance is 5%. I have no patience for "well, the two stages feel different" reasoning.

  4. Savage's sure-thing principle — your preference between two acts shouldn't depend on the outcome they agree on — strikes me as about as close to a priori as decision theory gets.

  5. I want to be dynamically consistent, and I'm a plan-maker rather than a myopic chooser: if I'd take X off a menu, I want to still take X as the menu narrows. I explicitly refuse the sophisticated-chooser dodge where each step looks fine locally and the trajectory is a disaster.

  6. Transitivity and completeness are off the table as casualties. Threads keep insisting that giving up independence puts you on a slope to intransitive preferences, and if that's genuinely what (2) costs me, I need to hear it said plainly.

  7. If there's a repair for (2), I assume it lives in the probability weighting rather than the utility function — some inverse-S thing that overweights the certain branch, CPT-flavored. I get that concave utility of money doesn't do the work here.

  8. Half-remembered from some thread and im not sure I believe it: if you're allowed to rewrite the sure $1M as two separate 44.5% branches, people's choices change, and no weighting-function model can absorb that, because such a model only ever sees the reduced distribution. If that's right it seems to hurt (7) harder than it hurts (2).

  What I want: go through these and tell me which pairs genuinely can't coexist, ranked by how badly they hurt — don't flag everything as equally suspicious. For each real conflict, say which commitment has to go, what giving it up costs me, and then name the single cheapest revision to the whole set. Also point out the pairs that only look like conflicts, because I suspect at least one of mine is bogus and I can't tell which. In particular I want to know whether (7) is a real improvement on (2) with respect to (1) and (5), or whether it just relocates the problem somewhere I'm not looking. No reading list, no history lesson, no citations — I'm not going to look anything up, I just want the reasoning.
reasoning: |-
  Okay, let me start by unpacking the user's position. They've been engaging with decision theory for fifteen years, so they're deeply familiar with the standard arguments. Their main concern is stress-testing their Allais paradox stance without rehashing basics. They want to know which parts of their eight commitments conflict and how to resolve them with minimal cost.

  First, I need to map their claims. They prioritize exploitability via Dutch books (1), accept Allais choices (2), insist on ROCL (3), hold Savage's sure-thing principle as near-a priori (4), demand dynamic consistency (5), refuse to sacrifice transitivity (6), consider probability weighting fixes (7), and mention a branching problem that might challenge such fixes (8).

  The critical tension is between (2) (choosing 1A and 2B) and the combination of (1)/(4)/(5). EU maximization avoids Dutch books, but Allais choices violate independence, which underlies EU. The user knows this but wants to know if there's a stable non-EU position that keeps exploitability at bay. 

  Savage's sure-thing principle (4) is key here. In the Allais setup, comparing 1A vs 1B and 2A vs 2B, the common outcomes (89% $1M in Problem 1, 90% nothing in Problem 2) should be irrelevant. But choosing 1A over 1B and 2B over 2A suggests those common outcomes matter, directly violating (4). 

  Probability weighting (7) seems like a fix—overweighting certainty could explain 1A. But (8) throws a wrench: if rewriting the sure $1M as two 44.5% branches changes choices, it implies the problem isn't just reduced probabilities but framing. That violates ROCL (3), which the user strongly holds. 

  Dynamic consistency (5) is another pressure point. If they commit to 1A now but later face a choice involving the "certain" $1M split across events, they might reverse preferences. Sophisticated choice dodges this but they reject that (5). 

  The cheapest resolution might be to drop strict adherence to (4) while keeping ROCL (3). This avoids Dutch books if the weighting function is applied consistently. But (8) suggests framing effects could still enable pumps, so exploitability risk remains. 

  The user’s refusal to lose transitivity (6) is manageable—Allais-type models can retain it. The real cost is accepting that "rationality" here means avoiding exploitation, even if preferences violate independence. They might need to tolerate some exploitability in edge cases or insist their probability weighting is pump-proof (hard to defend).
answer: |-
  Here's the stress-test, prioritizing conflicts by severity and identifying the cheapest resolution. Your position has one core tension that cascades, with (8) as a critical spoiler for a common fix.

  **Ranked Conflicts (High to Low Severity):**

  1.  **(2) + (4) = Direct Contradiction (Highest Severity)**
      *   **Conflict:** Choosing 1A over 1B *and* 2B over 2A **directly violates Savage's Sure-Thing Principle (4)**. The only difference between the two problems is the outcome in the event that occurs with 89% probability (Problem 1) or 90% probability (Problem 2). In Problem 1, both options give $1M in that event. In Problem 2, both options give $0 in that event. STP demands your preference depend *only* on the outcomes where the acts differ (the 10% and 1% events). Your choices show the common outcome *does* influence you.
      *   **What Must Go?** You must weaken or abandon strict adherence to (4) as a necessary condition for rationality. This is the primary cost of holding (2).
      *   **Cost:** This is the foundational cost of keeping (2). It means accepting that your preferences *can* rationally depend on the context of identical outcomes in disjoint events, even after reduction (3). This directly challenges the "a priori" status you grant (4).

  2.  **(1) + (2) = High Exploitability Risk (Severe)**
      *   **Conflict:** Your stated reason for wanting EU is *only* exploitability (1). Making the Allais choices (2) creates a known vulnerability to a **dynamic Dutch book (money pump)**. A clever counterparty can exploit the preference reversal between Problem 1 (preferring the safe $1M) and the structurally identical parts of Problem 2 (preferring the gamble when the "safe" $1M becomes probabilistic) across a sequence of trades. This directly contradicts your motivation for (1).
      *   **What Must Go?** You must either abandon (2) or accept that you *are* exploitable in principle (weakening 1), or find a model incorporating (2) that *somehow* avoids pumps (difficult, see below).
      *   **Cost:** Accepting exploitability contradicts your core stated motivation (1). Abandoning (2) contradicts your stated preference. This is the most practically significant conflict.

  3.  **(2) + (3) + (8) = Fatal Blow to Probability Weighting Fix (Severe)**
      *   **Conflict:** You consider probability weighting (7) as a potential repair for (2) within an exploitability-avoiding framework (1). However, point (8) is crucial. If rewriting the *sure* $1M in 1A as two separate 44.5% chances of $1M *changes people's choices* (making them less likely to choose it over 1B), this is devastating for *any* model that only cares about the final reduced probability distribution over outcomes (like standard Probability Weighting models, RDU, CPT).
      *   **Why?** Reduction of Compound Lotteries (3) means both descriptions (sure $1M or two 44.5% chances) are *identical* in their final distribution: 100% chance of $1M. Any model respecting (3) *must* treat them identically. If people's preferences change based on this *framing*, it means the model explaining (2) must be sensitive to the *process* or *description* of the lottery, not just its reduced probabilities. This violates (3) at the descriptive level and makes it impossible for a *normative* model based solely on reduced probabilities (like weighting functions) to capture the effect without violating its own reduction principle.
      *   **What Must Go?** If (8) is empirically true and robust, you must abandon the hope that standard probability weighting models (7) can resolve the conflict between (1), (2), and (5) while respecting (3). The violation is deeper than weighting; it's framing.
      *   **Cost:** Removes the most plausible EU-violating model for reconciling (2) with exploitability avoidance (1) and dynamic consistency (5). Leaves you needing a more exotic (and likely more complex/vulnerable) model or accepting exploitability.

  4.  **(2) + (5) = Dynamic Consistency Challenge (Moderate)**
      *   **Conflict:** Holding (2) creates a dynamic consistency challenge *if* the certainty is framed over time. Imagine committing *now* to take 1A if offered. Later, just before the result, you are offered a chance to switch to 1B. At that point, the "certainty" is gone; you *know* you are in the 100% branch of the original choice, but now face a new choice: keep the definite $1M or switch to a gamble giving 10/11 chance of $5M and 1/11 chance of $0. Someone dynamically consistent (5) who preferred 1A initially should refuse this switch. However, if at that final node the 10/11 vs 1/11 gamble looks like 2B vs 2A (which you prefer as 2B), you might be tempted to switch, violating your initial plan. The sophisticated chooser dodge avoids this by pre-committing not to switch, which you reject.
      *   **What Must Go?** You must either: a) Argue this temporal framing isn't equivalent to the original Allais choice (perhaps the initial certainty has unique value lost in the re-framing), b) Insist you *would* refuse the later switch despite it looking like your preferred 2B, or c) Weaken (5) to allow the preference reversal in this specific context.
      *   **Cost:** Moderate. This conflict is less fundamental than (1)+(2) or (2)+(4). Resolving it via (a) or (b) is plausible but requires defending the unique value of *initial* certainty. Option (c) costs coherence.

  5.  **(2) + (6) = Manageable (Low Severity)**
      *   **Conflict:** Threads claim violating independence leads to intransitivity. While specific pathological examples can be constructed, **this is NOT a necessary consequence of making Allais choices (2)**. Well-known non-EU models (like Rank-Dependent Utility - RDU - or even some cautious versions of CPT) that accommodate the Allais paradox *can* maintain transitivity (6) and completeness.
      *   **Resolution:** You can keep (2) and (6). The slope is not inevitable. Vigilance is needed when constructing preferences, but intransitivity is not the direct cost of (2).

  **Only *Looks* Like a Conflict:**

  *   **(3) + (7):** These are compatible. Probability weighting functions (7) are applied *after* reduction of compound lotteries (3). The weighting function takes the *reduced* probability of an outcome as its input. (7) doesn't violate (3); it transforms the reduced probability non-linearly. The conflict is introduced by (8), not by (7) itself.

  **The Cheapest Revision to the Whole Set:**

  **Abandon strict adherence to Savage's Sure-Thing Principle (4) as a necessary axiom for rationality *in all contexts*, while maintaining Reduction of Compound Lotteries (3).**

  **Reasoning & Costs:**

  1.  **Targets Core Conflict:** This directly resolves the highest-severity conflict (2)+(4). You accept that the context of identical outcomes *can* rationally matter for preference.
  2.  **Accommodates (2):** This is essential for keeping your stated preference.
  3.  **Minimal Impact on (1):** While making you vulnerable to Dutch books in the *standard* EU framework, it leaves open the possibility of finding a *non-EU* model (like RDU/CPT) that respects (3) and might *mitigate* or structure exploitability (though (8) suggests this is hard for framing effects). You shift from "must be EU to avoid pumps" to "must find a model that avoids pumps *while* accommodating my Allais preference and ROCL".
  4.  **Preserves (3) & (5):** You keep your strong commitments to ROCL and dynamic consistency. Resolving the dynamic challenge (5) relies on defending the unique value of initial certainty or your resolve at later nodes, which is now feasible.
  5.  **Preserves (6) & (7):** Transitivity remains possible. Probability weighting (7) remains a candidate mechanism *if* it can be made robust to framing issues like (8).
  6.  **Acknowledges (8):** Accepting (8) means any viable model (like RDU/CPT) used under this revision must be very carefully defined to handle descriptions/framing, or you must argue (8) isn't a robust finding for your specific preferences. This is the major hurdle left.

  **Why not other revisions?**

  *   **Abandon (2):** Contradicts your stated preference. Cost: High (to you).
  *   **Abandon (1) (Accept Exploitability):** Contradicts your core motivation. Cost: Very High.
  *   **Abandon (3):** Opens a massive can of worms (descriptive/normative failures, complex dynamics, likely worse exploitability). Cost: Extremely High.
  *   **Abandon (5):** Allows sophisticated choice or inconsistency, which you explicitly reject. Cost: High (to your stated view).
  *   **Abandon (6):** Unnecessary, as (6) isn't forced. Cost: Avoidable.

  **Conclusion on (7):** Probability weighting (7) *can* absorb (2) with respect to the *static* Allais choices and *might* help with dynamic consistency (5) under specific assumptions. **However, it *cannot* resolve the core conflict with the Sure-Thing Principle (4) without effectively abandoning (4), and it is *badly hurt* by the framing effect described in (8) with respect to both exploitability (1) and ROCL (3).** (8) suggests the problem isn't just non-linear weighting, but a deeper sensitivity to description that standard weighting-function models don't capture. (7) relocates the problem from violating EU independence to handling framing effects while maintaining ROCL and avoiding exploits – which (8) indicates is very difficult.

  **The cheapest path is to embrace the violation of (4) as rational (for you), hold fast to (3) and (5), and either:** 
  *   **A)** Find a non-EU model (like a carefully specified RDU/CPT) that respects (3), incorporates the certainty effect, and *minimizes* exploitability in practice (accepting some risk from framing like (8)), or 
  *   **B)** Argue that your specific preferences are structured such that the potential pumps implied by (1)+(2) are impractical or detectable and avoidable by you. 

  The tension between your desire to avoid exploitability (1) and your Allais preference (2) remains the most significant practical challenge, especially in light of (8).
