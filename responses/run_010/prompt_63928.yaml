  Hmm, the user is a staff engineer at an open-source foundation who chairs their governance working group. They need a practical framework for evaluating entrenchment proposals - essentially constitutional amendments that make certain rules harder to change. The board consists of engineers without legal/philosophical training, and they've had bad experiences with past entrenchments (like the license lock blocking a desired merger).

  Key constraints: 
  - Must be an executable procedure, not an essay
  - For tired engineers reviewing after work
  - Based on shallow reading of Elster, Holmes' paradox of democracy, and "dead hand" concerns
  - Colleague's taxonomy suggested (binding against panic/ignorance/change of heart; surviving changed mind vs changed circumstances)
  - Must handle real cases provided

  Brainstorming needed first:
  - How entrenchments fail: world changes (tech/licensing evolves), initial mistake (like current license lock), threshold capture (minority exploits high bar), unintended consequences (chilling effects, loopholes)
  - Procedure needs to catch these: time-based reviews for changing worlds, evidence requirements to prevent mistakes, anti-abuse checks for capture risks, impact analysis for unintended effects

  Core design principles:
  - Default to ordinary policy unless strong justification
  - Prefer lighter mechanisms (sunsets, reviews) over permanent locks
  - Separate factual checks from value judgments (marked clearly)
  - Require concrete evidence, not speculation
  - Build in reversibility safeguards

  Procedure structure:
  1. Necessity gate: Is ordinary policy insufficient? (Terminates if not)
  2. Harm specification: What exactly are we protecting against? (Requires concrete evidence)
  3. Reversibility check: Can we build in review/escape valves? (Mandates sunset/review unless impossible)
  4. Threshold test: Does lock match harm severity? (Prevents overkill)
  5. Capture risk: Could this entrench power? (Terminates if yes)
  6. Unintended consequences: What could go wrong? (Requires mitigation plan)
  7. Burden shift: Why is this our problem? (Hands to board if values-based)

  For their test cases:
  - License entrenchment: Fails at harm specification (no evidence of future panic) and reversibility (no review mechanism). Sunset clause required.
  - AI contribution ban: Fails at necessity (ordinary policy suffices) and capture risk (minority protection via entrenchment is abusive).
  - External panel: Fails reversibility (no recall) and capture risk (permanent unaccountable power).
  - Stress cases: Entrenching threshold itself is paradoxical and fails capture check; minority protection request fails necessity test.

  Crucial limitations:
  - Can't prevent determined bad actors
  - Won't catch all unintended consequences
  - Useless if board ignores procedure
  - Values decisions still require human judgment

  Final output must be plain British English, no jargon, no bibliography. Mark all judgment calls transparently. Show worked examples with clear reasoning at each step.
answer: |-
  ### Framework for Evaluating Entrenchment Proposals  
  *Lattice Foundation Governance Working Group*  
  *Prepared for Board Meeting, [Date]*  

  **Purpose**: To provide a clear, step-by-step procedure for assessing proposals to entrench rules in our charter. Entrenchment makes changes harder (e.g., requiring 85% votes + maintainer ratification). It should be rare—like emergency brakes on a train, not daily steering.  

  **Key Principles**:  
  1. **Default to ordinary policy** (simple majority votes) unless entrenchment is *proven necessary*.  
  2. **Prefer reversible mechanisms** (e.g., sunsets, reviews) over permanent locks.  
  3. **Distinguish facts from values**: The procedure flags factual questions (answered with evidence) and value judgments (handed to the board).  

  **Brainstorm: How Entrenchments Go Wrong**  
  - **World changes**: Locked rules become outdated (e.g., our 2019 licence block). *Fix: Sunset clauses or periodic reviews*.  
  - **We were mistaken**: We misjudge risks (e.g., banning "machine contributions" without evidence). *Fix: Require concrete harm scenarios*.  
  - **Threshold capture**: Entrenched rules exploited by factions (e.g., a minority locks rules to block future majorities). *Fix: Ban self-serving locks*.  
  - **Unintended consequences**: Locks alter behaviour unpredictably (e.g., trademark panel stifling collaboration). *Fix: Impact assessments*.  

  ---

  ### Procedure: 7 Questions for Any Entrenchment Proposal  
  *Ask these in order. Stop if any answer fails the test. Non-specialists can run this in 20–30 minutes.*  

  1. **Is ordinary policy insufficient?**  
     - *Test*: Proposer must show that normal governance (e.g., board votes) cannot handle this risk. Evidence required: past failures or imminent threats.  
     - *Terminate if*: The risk is hypothetical or solvable by policy. (*Output: Handle by ordinary policy.*)  
     - *Judgment call*: None. Fact-based.  

  2. **What specific harm are we binding against?**  
     - *Test*: Proposer must name one: **panic** (rash decisions under pressure), **ignorance** (acting without key facts), or **change of heart** (abandoning core values). Evidence required: Examples from similar organisations or past near-misses.  
     - *Terminate if*: Harm is vague (e.g., "future mistakes"). (*Output: Do not entrench.*)  
     - *Judgment call*: Low. Use your colleague’s taxonomy—it works here.  

  3. **Can we use a lighter mechanism?**  
     - *Test*: Proposer must explain why these are inadequate:  
       - **Sunset clause** (lock expires unless re-approved).  
       - **Periodic review** (e.g., reassess every 3 years).  
       - **Delegation with recall** (e.g., external panel but board can override).  
       - **Narrow scope** (e.g., lock only specific licence terms, not the whole licence).  
     - *Choose based on harm*: Use sunsets for panic/ignorance; narrow scope for change of heart.  
     - *Terminate if*: Proposer rejects all lighter options without justification. (*Output: Do not entrench.*)  
     - *Judgment call*: Moderate. Balance harm severity vs. flexibility.  

  4. **Does the lock match the harm?**  
     - *Test*: Higher thresholds (e.g., 85%) require higher stakes (e.g., protecting core values). Evidence required: Why the proposed threshold isn’t overkill.  
     - *Terminate if*: Harm is minor (e.g., operational disputes) or threshold is excessive. (*Output: Use lower threshold or ordinary policy.*)  
     - *Judgment call*: Low. Compare to existing locks (e.g., 85% for licences).  

  5. **Could this entrench power?**  
     - *Test*: Would this lock advantage a group (e.g., current board, maintainers) or block future self-governance?  
     - *Terminate if*: Yes—e.g., locks proposed by minorities to shield themselves from votes. (*Output: Do not entrench.*)  
     - *Judgment call*: High. Watch for self-interest.  

  6. **What are the unintended consequences?**  
     - *Test*: Proposer must list 3+ plausible negative outcomes (e.g., "could block mergers" or "deter contributors").  
     - *Mitigate*: If risks are high, require lighter mechanisms (see Q3) or kill the proposal.  
     - *Terminate if*: Risks outweigh benefits. (*Output: Do not entrench.*)  
     - *Judgment call*: Moderate. Engineers excel at failure-mode analysis—use that.  

  7. **Why must we decide now?**  
     - *Test*: Proposer must show urgency (e.g., "crisis imminent") or explain why future boards can’t handle this.  
     - *Hand to board if*: Answer hinges on values (e.g., "copyleft is non-negotiable"). (*Output: Board votes on values.*)  
     - *Judgment call*: High. Philosophers call this the "dead hand" problem—don’t bind successors lightly.  

  ---

  ### What This Procedure Cannot Do  
  - **Prevent all mistakes**: It reduces but won’t eliminate bad locks (e.g., if evidence is misjudged).  
  - **Fix past errors**: Reversing entrenched rules (like our 2019 licence) requires separate amendment.  
  - **Replace wisdom**: It flags value judgments but can’t resolve them—the board must.  
  - **Handle bad actors**: If proposers lie about evidence, the procedure fails.  

  ---

  ### Test Cases: Applying the Procedure  
  #### Case 1: Entrench Copyleft Licence  
  > *Proposal: Lock licence at 85% threshold, with clause "no successor licence shall reduce obligations of downstream redistributors."*  

  1. **Ordinary policy insufficient?**  
     - *Test*: No evidence of imminent threat to relax obligations. Current policy (votes) handles licence changes.  
     - **Verdict: Terminate. Handle by ordinary policy.**  

  *(Procedure stops at Q1. No entrenchment. Lighter mechanisms like periodic review not considered as proposal fails necessity test.)*  

  ---  

  #### Case 2: Permanent Ban on Machine-Generated Contributions  
  > *Proposal: Charter-level ban, requested by maintainers fearing future outvoting.*  

  1. **Ordinary policy insufficient?**  
     - *Test*: No evidence policy can’t manage this (e.g., current contribution guidelines exist).  
     - **Verdict: Terminate. Handle by ordinary policy.**  

  *(Stops at Q1. Note: Q5 would also terminate—minority using lock to shield from votes is power entrenchment.)*  

  ---  

  #### Case 3: External Trademark Panel  
  > *Proposal: Permanent external panel for disputes, no recall or term limits.*  

  1. **Ordinary policy insufficient?**  
     - *Test*: Possible—trademark conflicts can be legally complex. Proceeds.  
  2. **Specific harm?**  
     - *Test*: Harm = "ignorance" (board lacks expertise). Evidence: Past disputes mishandled.  
  3. **Lighter mechanism?**  
     - *Test*: Proposer rejects sunset/recall. No justification given.  
     - **Verdict: Terminate. Use delegation with recall.**  

  *(Fails Q3. Permanent lock with no oversight is overkill.)*  

  ---  

  #### Stress Case 1: Entrench the Amendment Threshold  
  > *Proposal: Lock the 85% threshold itself (so lowering it requires 85% vote).*  

  5. **Could this entrench power?**  
     - *Test*: Yes—makes it harder for future boards to reform governance.  
     - **Verdict: Terminate. Self-entrenching locks are abusive.**  

  *(Stops at Q5. Philosophers like Holmes note this risks "paralysis of democracy.")*  

  ---  

  #### Stress Case 2: Minority Lock Against Future Majority  
  > *Proposal: Small group seeks lock to "protect" itself from hypothetical future majority.*  

  1. **Ordinary policy insufficient?**  
     - *Test*: No evidence of threat—hypothetical.  
     - **Verdict: Terminate. Handle by ordinary policy.**  
  5. **Could this entrench power?**  
     - *Test*: Yes—minority exploiting procedure to cement influence.  
     - **Verdict: Terminate (redundant).**  

  *(Fails Q1 and Q5.)*  

  ---

  ### Final Note for the Board  
  This procedure forces evidence-based decisions and blocks high-risk locks. It treats entrenchment as a last resort—aligning with Elster’s view that precommitment should enable self-governance, not hinder it. **Next steps**:  
  - Vote to adopt this framework.  
  - Revisit the 2019 licence lock under amendment rules (not this procedure).  
  - Reject all test cases above per the framework.  

  ---  
  *Approved by Governance WG, [Date]. Queries to [Your Name].*
