  1. **D is strictly dominated by mixed strategies of U and M, but not by any pure strategy. Explain the equivalence between being strictly dominated and never a best response, and why the mixed dominator is not a mere technical convenience.**

     - D is strictly dominated by, for example, a 50-50 mixture of U and M. Let σ = (0.5, 0.5, 0). Then:
          U(σ, L) = 0.5*4 + 0.5*0 = 2 > 1 (D against L)
          U(σ, C) = 0.5*0 + 0.5*4 = 2 > 1 (D against C)
          U(σ, R) = 0.5*2 + 0.5*2 = 2 > 0 (D against R)
       So indeed, σ strictly dominates D.

     - The key equivalence: 
          A strategy s_i is strictly dominated if and only if it is never a best response to any (possibly correlated) belief about the opponents' play.

     - One direction (if strictly dominated then never a best response) is straightforward: if there is a strategy (pure or mixed) that gives strictly more than s_i against every opponent profile, then for any belief, the expected payoff of the dominating strategy is strictly greater than that of s_i, so s_i cannot be a best response.

     - The other direction (if never a best response then strictly dominated) is the substantive one. It relies on the Separating Hyperplane Theorem (or an equivalent minimax theorem) for two-player games. The idea is that if s_i is never a best response, then we can find a mixed strategy that strictly dominates it. This requires the continuity and convexity of the payoff function in mixed strategies.

     - The machinery (via the hyperplane theorem) tells us that the mixed dominator represents a separating hyperplane in the space of payoffs. From the opponent's belief perspective, the fact that D is never a best response means that no matter what belief player 1 has about player 2 (i.e., no matter the probability distribution over L, C, R), there is always some other strategy (U or M) that yields a strictly higher expected payoff than D. The mixed strategy that dominates D is a way of "aggregating" the fact that in every possible scenario (i.e., for every column), either U or M (or both) beats D. The mixture is not arbitrary: it is chosen so that it beats D in every contingency. The equivalence shows that the mixed strategy is not just a technicality but captures the idea that the strategy D is inferior under all possible beliefs.

