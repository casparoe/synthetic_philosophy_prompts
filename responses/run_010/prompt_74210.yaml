       Alternatively, we might eliminate weakly dominated strategies in a way that breaks ties arbitrarily? But that is not standard.

     - A restriction on admissible beliefs: One approach is to require that players have "cautious" beliefs (full support) at every step. Then, we can eliminate weakly dominated strategies arbitrarily. But the outcome is not unique. 

