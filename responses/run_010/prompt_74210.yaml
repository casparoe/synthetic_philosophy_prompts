     - The tension: To eliminate L, we need to consider the possibility of D (to have the strict inequality) but CKR tells us that D is irrational and thus should not be played. So the positive probability on D seems to contradict CKR.

     - The weakest assumption on beliefs that licenses the elimination of L is that player 2's belief has full support (i.e., assigns positive probability to every strategy of player 1, including D). This is called a "cautious" belief. But note that under CKR, we cannot have full support because D is irrational. So the assumption of full support is inconsistent with CKR in the sense that CKR implies that D has zero probability.

     - However, if we are doing iterated weak dominance, we typically assume that players are cautious (i.e., they do not rule out any strategy until it is eliminated). Thus, at the beginning, player 2 considers D possible. Then, after we eliminate D (by strict dominance), then player 2 no longer considers D. But if we eliminate L first, we are using the full support belief that includes D.

     - The reasoning in point 1 (that D is strictly dominated and thus never a best response) is based on the idea that player 1 is rational and will not play D. This is inconsistent with the full support belief for player 2 (because full support would require positive probability on D). So the two points are at odds: point 1 requires that D is not played, but eliminating L by weak dominance requires that we consider D as a possibility.

  4. **Nash equilibria and trembling-hand perfection.**

     - The pure Nash equilibria are (U, L) and (M, C). Let's check:

          (U, L): 
              Player 1: if player 2 plays L, then U gives 4, M gives 0, D gives 1 -> best is U.
              Player 2: if player 1 plays U, then L gives 3, C gives 3, R gives 1 -> best are L and C. So (U, L) is Nash (since player 2 can play L).

          (M, C):
              Player 1: if player 2 plays C, then U gives 0, M gives 4, D gives 1 -> best is M.
              Player 2: if player 1 plays M, then L gives 3, C gives 3, R gives 1 -> best are L and C. So (M, C) is Nash.

     - Now, (U, L) is destroyed in one of the orders (order 2 above) but survives in the other.

     - Trembling-hand perfection: We require that the equilibrium is robust to small trembles (mistakes) by the players.

          Consider (U, L): 
              Player 1's strategy: U, but let her tremble to M and D with small probabilities ε1 and ε2 (so playing U with 1-ε1-ε2, M with ε1, D with ε2).
              Player 2's strategy: L, but tremble to C and R with small probabilities δ1 and δ2 (so L: 1-δ1-δ2, C: δ1, R: δ2).

          For player 2 to play L as a best response, the expected payoff of L must be at least that of C and R.

          Expected payoff for player 2 from L:
              = (1-ε1-ε2)*3 + ε1*3 + ε2*0 = 3 - 3ε1 - 3ε2 + 3ε1 + 0 = 3 - 3ε2.

          From C:
              = (1-ε1-ε2)*3 + ε1*3 + ε2*3 = 3.

