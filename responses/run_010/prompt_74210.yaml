     - There is a theorem (due to Kohlberg and Mertens) that relates stable sets of equilibria to iterated dominance. However, the standard result is that the set of strategies that survive iterated weak dominance (with cautious players) contains the stable sets. But in this game, we have two Nash equilibria, and only one is perfect.

  In summary, iterated weak-dominance elimination is order-sensitive and does not yield a unique solution. To make it unique, one might use an order that eliminates strictly dominated strategies first and then weakly dominated ones, but even then, if there are multiple weakly dominated strategies, the order might matter. Alternatively, one might use the concept of "never a weak best response" and eliminate in an order that respects the independence of the elimination set. However, without a fixed order, the output is not unique. The trembling-hand refinement provides a justification for the elimination of (U,L) and the selection of (M,C). 

  Therefore, the example implies that iterated weak-dominance elimination is not a well-defined solution concept without additional structure. To make it well-defined, one might use the following: 

     - Eliminate all strictly dominated strategies first (which is order-independent). 
     - Then, eliminate weakly dominated strategies only if they are weakly dominated in every reduced game that might result from different orders? But that is complex.

  A more practical approach is to use the order that corresponds to the most "cautious" (or most robust) outcome, such as the one that leads to the perfect equilibrium. Alternatively, one might use the concept of "weak dominance with respect to the set of rationalizable strategies" but that requires iterative consideration of best responses.

  However, the most common solution is to note that the concept of rationalizability (by iterated strict dominance) is order-independent and well-defined, but it does not use weak dominance. For weak dominance, the literature often relies on the refinement of Nash equilibrium (like perfection) to select among the outcomes.

  In short: iterated weak dominance is not well-defined without an ordering convention. One convention is to eliminate strategies in an order that does not remove strategies that are part of a perfect equilibrium. But that is circular. Alternatively, we can use the extensive form to define a natural order (if the game has one). In simultaneous games, the problem remains.

  The safest conclusion is that iterated weak dominance should be used with caution and that the outcome is not unique. The theorist must supply an elimination order that is justified by the context (such as the sequence of reasoning) or use it in conjunction with refinements.
answer: |-
  ### Addressing the Four Puzzling Features

  #### 1. **Mixed Dominators and Best Responses**
  D is strictly dominated by mixtures of U and M (e.g., 50-50), but not by any pure strategy. The equivalence between strict dominance and never being a best response is key:
  - **Never a best response ⇒ Strictly dominated**: This direction is substantive. Establishing it requires the **Separating Hyperplane Theorem** (or linear programming duality) applied to the payoff matrix. The machinery confirms that if D is never a best response to any belief (over L, C, R), there exists a mixed strategy (e.g., σ₁ = (0.5, 0.5, 0)) such that for all s₂, u₁(σ₁, s₂) > u₁(D, s₂).  
  - **Interpretation**: The mixed dominator σ₁ represents a **belief-independent safeguard** for Player 1. From Player 2's perspective, Player 1's rationality implies that D is irrelevant—even if Player 2 has arbitrary beliefs, σ₁ always outperforms D. The mixture aggregates the dominance of U and M across all contingencies, making it a real strategic entity, not a technical artifact. It reflects that **no belief of Player 2 can rationalize playing D**.

  #### 2. **Order-Sensitivity of Weak Dominance**
  C weakly dominates L and R for Player 2, but the strict advantage over L arises *only* against D (payoffs: 3 > 0).  
  - **Order-sensitivity**:  
    - **Order A (Eliminate D first)**:  
      1. D is strictly dominated → remove D.  
      2. Reduced game (U, M vs. L, C, R): C vs. L is now equivalent (both yield 3 against U and M), so L survives. R is strictly dominated by C (3 > 1) → remove R.  
      Survivors: {U, M} × {L, C}.  
    - **Order B (Eliminate L first)**:  
      1. L is weakly dominated by C (strict only against D) → remove L.  
      2. Reduced game (U, M, D vs. C, R): D is strictly dominated by M (against C: 4 > 1; against R: 2 > 0) → remove D.  
      3. R is strictly dominated by C (3 > 1) → remove R.  
      4. M strictly dominates U (against C: 4 > 0) → remove U.  
      Survivors: {(M, C)}.  
  - **Contrast with strict dominance**:  
    Iterated **strict dominance** is order-independent because strict dominance persists in any subgame (the inequality holds strictly regardless of eliminated strategies). For **weak dominance**, elimination can alter the "weak" part of the inequality. Here, eliminating D *removes the contingency where C strictly beats L*, invalidating L’s weak dominance. Belief-wise: eliminating a strategy (like D) updates beliefs to exclude it, changing which actions appear dominant.

  #### 3. **Tension with Common Knowledge of Rationality (CKR)**
  Eliminating L requires Player 2 to assign positive probability to D to justify C ≻ L (since C > L only if D is played). But CKR implies Player 1 never plays D (as it is strictly dominated).  
  - **Resolution**:  
    - The positive probability assumption is **legitimate** if players are **cautious** (i.e., they consider all strategies possible until eliminated). CKR alone is **insufficient** for weak-dominance reasoning, as it allows beliefs to exclude irrational strategies (like D).  
    - **Weakest belief assumption for eliminating L**: Player 2 has **full-support beliefs** (assigns positive probability to all of Player 1’s strategies, including D). This is consistent with **cautious rationality** but contradicts CKR’s implication that D has probability 0.  
    - **Consistency with Point 1**: The machinery in Point 1 relies on D being *strictly* dominated (never a best response), which holds under CKR. However, weak-dominance elimination of L requires full-support beliefs, which conflict with CKR. Thus, **iterated reasoning must alternate between dominance and belief restriction**.

  #### 4. **Nash Equilibria, Perfection, and Trembles**
  - **Pure Nash equilibria**: (U, L) and (M, C).  
  - **(U, L) under trembles**:  
    Suppose Player 1 trembles (plays U with 1−ε, M with ε/2, D with ε/2). Player 2’s payoff from L: 3(1−ε) + 3(ε/2) + 0(ε/2) = 3 − 3ε/2.  
    From C: 3(1−ε) + 3(ε/2) + 3(ε/2) = 3.  
    For small ε > 0, C yields 3 > 3 − 3ε/2, so Player 2 prefers C over L. Thus, (U, L) is **not trembling-hand perfect**.  
  - **Relation to weak dominance**:  
    The tremble **vindicates Order B** (which eliminated L and converged to (M, C)) by assigning positive probability to D. However, this reproduces the tension: trembles require **off-equilibrium beliefs** (positive probability on D), while CKR excludes D. The difference is epistemic: trembles formalize cautious play, whereas CKR assumes no errors.  

  ---

  ### Implications and Theoretical Resolution
  - **Iterated weak dominance is not well-defined**: It suffers from **order-dependence**, as shown by the two survivor sets ({U, M} × {L, C} vs. {(M, C)}).  
  - **Retaining iterated weak dominance**: To ensure a unique output, a theorist must supply:  
    1. **An ordering convention**: Eliminate strictly dominated strategies first, then weakly dominated ones, iterating in a fixed sequence (e.g., "lowest index first").  
    2. **A belief restriction**: Require **cautiousness** (full-support beliefs) at each elimination step. This aligns with trembling-hand refinements.  
    3. **A refinement**: Use **trembling-hand perfect equilibrium** (THPE) as a benchmark. THPE selects (M, C) here, which survives Order B.  
    - **Key Theorem**: Under cautiousness, iterated weak dominance *includes* THPE strategies (see Kohlberg-Mertens stability), but uniqueness requires additional structure.  

  **Final Insight**: Weak dominance is inherently belief-sensitive. Trembles resolve the tension by formalizing cautious play, but iterated elimination remains context-dependent. The example underscores that **solution concepts are tools—select based on epistemic priorities (CKR vs. caution)**.
