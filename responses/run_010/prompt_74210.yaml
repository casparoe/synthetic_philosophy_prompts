              Player 1 trembles: M with 1-ε1-ε2, U: ε1, D: ε2.
              Player 2 trembles: C with 1-δ1-δ2, L: δ1, R: δ2.

          For player 1: 
              Expected payoff from U: 
                  = (1-δ1-δ2)*0 + δ1*4 + δ2*2 = 4δ1 + 2δ2.
              From M: 
                  = (1-δ1-δ2)*4 + δ1*0 + δ2*2 = 4 -4δ1 -4δ2 + 0 + 2δ2 = 4 -4δ1 -2δ2.
              From D: 
                  = (1-δ1-δ2)*1 + δ1*1 + δ2*0 = 1 -δ1 -δ2 + δ1 = 1 - δ2.

