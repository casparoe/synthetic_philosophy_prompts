     - Why is iterated strict dominance order-independent?
          Because if a strategy is strictly dominated in the original game, it remains strictly dominated in any subgame that does not remove the dominating strategy. The reason is that strict dominance is robust: the inequality holds regardless of the other strategies. Thus, the order of elimination does not matter: we can remove all strictly dominated strategies at once. Moreover, after removing some, new ones may become strictly dominated, but the set of surviving strategies is invariant to the order.

     - For weak dominance, the issue is that when we remove a strategy, we are changing the set of strategies over which the opponent can form beliefs. A strategy that was weakly dominated might not be dominated after removal of some other strategy because the weak domination might have relied on a contingency that is now removed (like the D row). Thus, the order matters.

  3. **Eliminating L requires player 2 to assign positive probability to D? Tension with common knowledge of rationality (CKR).**

     - To justify eliminating L by weak dominance (by C), player 2 must consider that L is weakly dominated by C. This requires that for every strategy of player 1, C does at least as well as L, and for at least one strategy (here, D), it does strictly better.

