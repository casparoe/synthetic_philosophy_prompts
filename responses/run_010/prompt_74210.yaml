              Compare C and L: 3 > 3-3ε2 (since ε2>0) -> strict.
              Compare C and R: 3 > 1+2ε2 -> holds for small ε2 (e.g., ε2<1). 
              So C is strictly best.

          Thus, (M, C) is trembling-hand perfect.

     - This shows that (U, L) is not robust to trembles, while (M, C) is. The tremble vindicates the elimination order that led to (M, C). However, note that in the trembling-hand analysis, we assign positive probability to D (via the tremble). This is similar to the full support belief that we used to justify the weak dominance elimination of L. But now, at the level of trembles, we are allowing irrational play with small probability. Thus, the tension is resolved by allowing a small probability on D. The same reasoning that required positive probability on D for the weak dominance of L over D is now embedded in the tremble.

  **Conclusion**

  The example shows that iterated weak-dominance elimination is not well-defined in the sense that it can lead to different outcomes depending on the order. To retain it as a solution concept, a theorist would have to supply:

     - An ordering convention: For example, eliminate strictly dominated strategies first, then weakly dominated ones, and in a fixed order (like from the most dominated to least). However, in this game, we saw that even after eliminating the strictly dominated D, we still had two weakly dominated strategies for player 2? Actually, in the reduced game without D, R was strictly dominated by C (so we eliminated R) and then we were left with no dominated strategies for the remaining strategies? But note: in the reduced game without D and R, we had:

