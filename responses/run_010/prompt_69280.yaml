prompt: |-
  Last night a friend and I argued for roughly three hours about how one ought to forecast the lifespan of large political orders — empires, hegemons, whichever framing you prefer. He is committed to what he calls the outside view: assemble the class of comparable historical orders, look at the distribution of how long they lasted, take that as your starting estimate, and adjust downward or upward only for genuinely case-specific reasons. I resisted this and lost the thread of my own objection somewhere around midnight. Having now had a day with it, I think there were two distinct objections tangled together, and I cannot find a name for either.

  First, the class he wants to sample from can only be assembled after the fact. You can list its members because their stories have finished. A currently existing order cannot be placed on the list without already knowing how it ends, so the base rate meant to discipline my prediction is drawn from a set that no live case can be assigned to in advance — and the instant you do assign your case, you have settled something about the outcome. When I pressed him, he said membership can be fixed by observable features, a certain kind of administrative reach, a certain tributary structure, so classification is prospective after all. I suspect this conceals the difficulty rather than resolving it, since the features he listed are precisely the ones historians use to pick out these units once the units' careers are visible; but I could not say why, which is what cost me the argument.

  Second, and I believe separable: how many units are in the class depends on how the histories turned out. If a polity fractures and is later reunified, you count one long-lived order; if the fracture sticks, you count two short ones. Rome is the obvious illustration — depending on whether the eastern continuation is treated as the same empire or as a successor state, its position in the distribution shifts by a factor of three or so. Comparable discretionary rules, such as whether a dynasty constitutes one order or several, move the mean duration of the entire class without anyone having made an empirical discovery.

  I am aware of survivorship bias and hindsight bias, and I know the expression reference class carries its own technical problem in the probability literature. None of these seems to be what I am pointing at. Survivorship concerns which cases reach the sample; hindsight concerns what the judge remembers afterward; I am describing something about when membership and unit-count become determinate in the first place.

  So: is there an established concept — or an established pair — for these? I am not after a label alone, and a bare name would leave me dissatisfied. I want the phenomenon carved: what it is exactly, how it differs from each of the near-misses above, whether my two objections are genuinely two things or one thing seen from two angles, whether the problem is peculiar to historical cases or extends to startups, languages, species, and firms, and where it stops biting. I can imagine that a class defined by strictly prospective, outcome-independent criteria escapes it altogether, and I would like to know whether that escape actually holds or merely relocates the trouble. If nothing established covers the thing, say so plainly, then coin a term and define it, including at least one boundary case that looks like the phenomenon but is not. Please write in American English.
reasoning: |-
  Okay, the user is wrestling with two objections to the outside view approach for predicting the lifespan of political orders. Let me break this down.

  First objection is about membership definition. The user's friend claims you can define the reference class prospectively using observable features. But the user suspects historians only identify those features retrospectively, after knowing how the story ended. This creates a circularity - the classification criteria emerge from known outcomes. The key here seems to be temporal ontology: the very identity of a political unit depends on its complete life trajectory. Until an empire's story finishes, we can't definitively say which features truly define its "empire-ness" because those features gain meaning from the full narrative. 

  Second objection concerns unit counting. How we chunk historical periods into discrete "orders" depends entirely on outcomes. Rome's duration changes drastically based on whether we count Byzantium as continuation or successor. This isn't just data fuzziness - it's constitutive of what we're measuring. The "political order" isn't a natural kind with fixed boundaries.

  Survivorship bias doesn't quite capture this because it's about missing data, whereas here the data itself morphs based on outcomes. Hindsight bias is about distorted memory, but here it's about the fundamental indeterminacy of categories before completion. 

  These two objections are actually facets of a deeper issue: historical entities are processual. Their boundaries and properties emerge through time. A "political order" isn't like a chemical element with fixed properties - it's a pattern we impose on events. The reference class problem here is uniquely severe because the units themselves are narratively constructed.

  This likely extends to other evolving systems: startups pivoting into new companies, languages diverging into dialects vs new languages, species concepts in paleontology. The escape route - strict prospective criteria - might work for engineered systems (e.g., "all cars manufactured in 2020") but fails for organic entities where the classification scheme itself co-evolves with the phenomenon.

  The core problem is teleological classification: we define historical entities by their endpoints. For predictive purposes, we need an endpoint-independent ontology - but that may be impossible for complex adaptive systems. Perhaps we should call this "narrative entanglement" - where the act of classification presumes knowledge of the story's conclusion.
answer: |-
  The core issue you're grappling with is **teleological classification in historical ontology**, and it manifests as two interconnected but distinct problems: **retrospective class constitution** and **outcome-dependent unit individuation**. Neither is fully captured by standard biases like survivorship or hindsight, though they share conceptual DNA. Here's the carving:

  ### 1. **Retrospective Class Constitution (Your First Objection)**
     - **The Problem**: The defining features of a "large political order" are only discernible *after* its lifecycle is complete. Historians identify "administrative reach" or "tributary structure" by analyzing *successful historical cases where these features persisted until a definite endpoint*. What counts as a "defining feature" is itself filtered through the lens of completed narratives. 
     - **Why It's Not Survivorship/Hindsight Bias**:
       - Survivorship bias would exclude *failed* empires that never achieved "order" status. Here, the bias is in the *definition* of "empire" itself: it presumes a coherence that only becomes legible post-collapse. 
       - Hindsight bias distorts memory of causes; this distorts the *categorical schema*.
     - **Boundary Test**: Consider defining a "startup" by "disruptive innovation potential." Pre-failure, this label applies to many ventures; post-failure, only successful ones are remembered as "truly disruptive." The *class* is defined by outcomes.

  ### 2. **Outcome-Dependent Unit Individuation (Your Second Objection)**
     - **The Problem**: Whether a polity is one "order" or multiple depends on *future contingent events* (e.g., reunification). The count of units in your reference class is not fixed empirically but is a *narrative choice* determined by later outcomes. 
     - **Why It's Different**: Unlike statistical noise, this changes the *denotation* of the class. Rome/Eastern Rome isn’t a measurement error—it’s a metaphysical ambiguity resolved only by historical result.
     - **Boundary Test**: In biology, species individuation (lumpers vs. splitters) can be controversial but relies on *present* traits, not future speciation events. Your issue arises when "one entity" vs. "many" depends on *later cohesion or fragmentation*.

  ---

  ### Are These Two Problems or One?
  They are **two facets of teleological ontology**:
  - **Facet 1 (Class Constitution)** concerns *what properties define membership* in the reference class.
  - **Facet 2 (Unit Individuation)** concerns *how we count distinct instances* of the class.  
  Both hinge on **defining entities by their endpoints**, violating the principle of *causal independence* required for objective forecasting.

  ---

  ### Does This Extend Beyond History?
  Absolutely. The problem infects any domain where:
  1. Entities are defined by *functional coherence* (e.g., firms, languages, ecosystems).
  2. Coherence is judged *retrospectively*.  
  **Examples**:
  - **Startups**: Is a pivot a "new company" or the "same entity"? Depends on later success.
  - **Languages**: Is Ukrainian a dialect of Russian or a language? Depends on political outcomes.
  - **Species**: In paleontology, fossil groups are often lumped/split based on inferred evolutionary *endpoints*.

  ---

  ### Can Strictly Prospective Criteria Escape This?
  **Partially, but not fully.**  
  - **Escape Route**: Define criteria *independent of duration or collapse* (e.g., "polities >1M sq. km for ≥10 years"). This avoids *explicit* teleology.  
  - **The Catch**: Such criteria still embed *implicit teleology*. Why pick "≥10 years"? Because you know most short-lived polities are excluded from historical "empire" lists. The arbitrariness of thresholds masks retrospective intuition.  
  - **Relocated Trouble**: You avoid outcome-dependent classification but face **arbitrary threshold bias**—your criteria are either too inclusive (adding noise) or too exclusive (recreating survivorship bias).

  ---

  ### Proposed Terminology
  - **Retrospective Class Constitution**:  
    Defining a reference class using features that are only non-arbitrarily identifiable *after* observing the outcomes of class members.  
  - **Outcome-Dependent Individuation**:  
    Determining whether an entity is singular or plural based on future events that were contingent at the time of classification.  

  **Overarching Concept**: **Teleological Classification Fallacy**  
  *The error of defining or counting entities in a reference class based on knowledge of their historical endpoints, thereby corrupting the class for prospective prediction.*

  ---

  ### Why This Carving Matters
  - **For forecasters**: Reveals why "outside view" fails for entities whose *identity* is tied to their trajectory. Historical analogies assume stable categories, but empires are processual, not static.  
  - **For historians**: Exposes how periodization smuggles in narrative inevitability.  
  - **Boundary Case That's Different**: Predicting a *machine's* lifespan using a reference class of identical models. Here, units are individuated *prospectively* (serial numbers), and class membership is fixed at manufacture. Teleology doesn't intrude. 

  **In short**: Your objections reveal that "large political orders" aren’t natural kinds but narrative constructs. Forecasting their lifespans using historical distributions isn't just technically hard—it's ontologically incoherent. The outside view works for dice; it falters for destinies.
