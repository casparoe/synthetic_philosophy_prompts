  We are designing an activity for a 75-minute session with 14-20 participants, mixed seniority. The goal is to explore the distinction between:
  - Reasons that bear directly on the quality of a design (first-kind reasons, or what philosophers might call "right-kind reasons" for an attitude)
  - Reasons that bear on the desirability of having a particular judgment (second-kind reasons, or "wrong-kind reasons") which are incentives that might lead one to bias their judgment.

  We want participants to experience the phenomenon where they cannot directly change their belief based on an incentive, but they can indirectly influence their belief by focusing on evidence selectively or reinterpreting standards.

  Key elements:
  1. The activity must have rounds:
     - One round with explicit, visible pressure to judge favorably (to hit the wall of not being able to comply directly).
     - Another round with the same pressure disguised as a claim about the artifact (so that participants might not realize they are being influenced by an incentive).
  2. By the end, participants should not be able to tell from their own reasoning which round they were in.
