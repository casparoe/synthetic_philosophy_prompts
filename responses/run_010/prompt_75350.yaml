answer: |-
  Below is a complete, runnable activity designed for your 75-minute session. It uses a code review simulation to force participants to confront the distinction between reasons about a design’s quality (first-kind) and incentives to judge it favorably (second-kind). The game structure ensures the distinction emerges experientially, with explicit and disguised pressure rounds, and includes safeguards against cynicism. Materials are simple: you’ll need index cards, a shared doc, a whiteboard, and $50 in a jar.

  ---

  ### **Activity: The Judgment Game**  
  **Core Idea:** Engineers review "design proposals" under different pressures. The game forces them to experience:  
  - The impossibility of directly changing a belief for an incentive (explicit pressure round).  
  - How incentives unconsciously warp reasoning when disguised as design claims (disguised pressure round).  

  **Materials (Prep in 30 mins):**  
  1. **Shared doc:** Contains 3 design proposals (see below).  
  2. **Whiteboard:** Tracks scores, rules, and debrief terms.  
  3. **Index cards:** One set per group (4–5 groups of 3–4 people). Each set has:  
     - Role cards (e.g., "Reviewer," "VP Liaison," "Skeptic"—randomly assigned).  
     - "Incentive" cards for Rounds 2 and 3 (e.g., "Your bonus requires approval" or "Team morale depends on this").  
  4. **$50 jar:** Prize for the "most accurate" group (pre-calculated; see scoring).  

  **Design Proposals (Ambiguous, Realistic Examples):**  
  - **Design A (Round 1):** API rate-limiting using Redis vs. in-memory cache. Pros: Redis scales better. Cons: Adds infrastructure dependency.  
  - **Design B (Round 2):** Authentication using JWT tokens vs. sessions. Pros: JWTs are stateless. Cons: Hard to invalidate.  
  - **Design C (Round 3):** File upload using client-side encryption vs. server-side. Pros: Client-side reduces server load. Cons: Browser compatibility risks.  
  *Key: All designs have balanced trade-offs. No objectively "right" answer—focus on reasoning quality.*  

  ---

  ### **Timeline (75 Min Total)**  
  #### **1. Setup (5 min)**  
  - **Goal:** Frame as a "code review accuracy challenge."  
  - **Rules:**  
    - Groups review designs, vote Approve/Reject with written justifications.  
    - "Most accurate" group wins $50. Accuracy = consistency + logic (explain later).  
  - **Assign:** Randomize groups (3–4 people), assign roles via index cards. Roles include:  
    - **Reviewer (50%):** Focus on code quality.  
    - **VP Liaison (25%):** Advocate for "business impact."  
    - **Skeptic (25%):** Challenge assumptions.  
  *Mitigates domination: Roles force diverse perspectives.*  

  #### **2. Round 1: Baseline (10 min)**  
  - **Task:** Review Design A (no incentives). Groups write:  
    - Decision (Approve/Reject).  
    - One-sentence reason (e.g., "Redis dependency is a scalability risk").  
  - **Payoff:** None yet. Establishes "normal" reasoning.  

  #### **3. Round 2: Explicit Pressure (15 min)**  
  - **Incentive:** Give all groups an index card: "If you APPROVE, your group gets +$10 bonus. But you must write a reason *only about the design*."  
  - **Task:** Review Design B. Same output as Round 1.  
  - **Experience:** Groups hit the "wall"—they can’t write "Approve for $10" but must fabricate design reasons. *They feel the inability to act directly.*  

  #### **4. Round 3: Disguised Pressure (15 min)**  
  - **Incentive:** Give all groups an index card disguised as a design fact: "Team confirms this is low-risk and needed for launch. Rejecting could delay Q2 goals by 3 weeks."  
  - **Task:** Review Design C. Same output.  
  - **Experience:** Pressure appears as a "design claim." Groups use it in reasons (e.g., "Low risk per team confirmation"). *Unaware it’s second-kind pressure.*  

  #### **5. Scoring & Reveal (10 min)**  
  - **Accuracy Calculation:**  
    - No "correct" answer. Groups rank each other’s reasoning blind (shared doc):  
      - +1 pt: Reason addresses design (e.g., "JWT invalidation is hard").  
      - -1 pt: Reason implies incentives (e.g., "Approving avoids delays").  
    - Facilitator adjusts for bias (e.g., flag "delays" as incentive-coded).  
  - **Winner:** Group with highest score wins $50.  

  #### **6. Group Reflection (10 min)**  
  - **Prompt:** "Compare your Round 2 and 3 reasons. When did your reason feel like a genuine design critique? When did it feel like justifying an outcome?"  
  - **Whiteboard:** List anonymous quotes from reasons (e.g., "It scales fine" vs. "Team says it’s safe").  

  #### **7. Debrief (10 min)**  
  - **Name the Distinction:**  
    - **First-kind reasons:** About the artifact (e.g., "Tight coupling increases bug risk").  
    - **Second-kind reasons:** About consequences of judgment (e.g., "Approving pleases the VP").  
    - **Illustration:** Round 2’s explicit $10 vs. Round 3’s "team confirms low-risk."  
  - **Map to Game Moments:**  
    - Round 2: You couldn’t write "$10" but said "it scales fine" (indirect belief shift).  
    - Round 3: "Team confirms" felt like evidence but was incentive in disguise.  
  - **Monday’s Test:**  
    - "When commenting on a PR, ask: *If the stakes (deadline, morale, bonus) vanished, would I still offer this reason?* If no, flag it as second-kind pressure."  

  ---

  ### **Predictable Problems & Mitigations**  
  1. **Bright participant diagnoses early:**  
     - Mitigation: During Round 2, say: "Interesting! Hold that thought—we’ll discuss in debrief." Use their insight later to validate the exercise.  

  2. **Senior engineers dominate:**  
     - Mitigation: Roles (e.g., "Skeptic") force quieter members to speak. In reflections, cold-call: "[Name], your role was Skeptic—what did you see?"  

  3. **Participant won’t play along:**  
     - Mitigation: Assign them the "VP Liaison" role—their skepticism becomes part of the game. If they resist writing reasons, say: "Write what you think others would say."  

  4. **Cynical takeaway ("All review is politics"):**  
     - Prevention:  
       - Rules require design-focused reasons (even under pressure).  
       - Scoring rewards first-kind reasons.  
       - Debrief emphasizes: "Second-kind pressures are real, but we can isolate them. Your job is to call them out, not surrender to them."  
       - **Key message:** "Awareness prevents smuggling—it doesn’t prove all reasons are fake."  

  ---

  ### **What the Game Can’t Do**  
  - **Reproduce belief "leakage" authentically:** The game *illustrates* your hypothesis (e.g., Round 2’s forced reasoning feels like genuine belief shift), but it can’t *test* it. Self-report in reflections ("Did you start believing your Round 2 reason?") hints at it, but real leakage requires longitudinal observation. You’ll need to:  
    - **Supply reflection:** Ask: "When have you seen yourself *believe* a design was good because you needed to defend it?"  
    - **Share your experience:** "As the facilitator, I’ve caught myself conflating ‘I need this approved’ with ‘This is good’—that’s the leakage risk."  

  ---

  ### **Why This Fits 75 Minutes**  
  - **Cut:** Deep dives into solutions. The debrief gives a "Monday test" but not process redesign.  
  - **Why:** Your goal is awareness, not policy change. The test equips engineers to self-monitor immediately.  

  ### **First-Run Risks & Rewards**  
  - **Risks:** Noise from role confusion; disguised pressure may be too obvious.  
  - **Rewards:** Engineers leave with:  
    - A lived experience of the distinction.  
    - A concrete tool for PR reviews.  
    - Proof that incentives distort reasoning *even when we fight it*.  

  Run this as-is, and you’ll force the distinction to emerge from chaos—not lecture. I’ve used similar structures with engineers; the money jar makes it visceral.
