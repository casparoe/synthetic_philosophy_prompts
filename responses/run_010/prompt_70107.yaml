prompt: |-
  I run a four-person cost and schedule estimating unit inside a state infrastructure agency. We do maybe 25 estimates a year, and they go straight into budget submissions the legislature votes on, so when we're low a program gets cut later. Our method right now is basically "find the three most similar past projects and average their overruns," and our internal auditor just wrote us up for it — similar by what criteria, and why three, and who picks them. Fair hit, I can't answer it.

  I know this has a name in philosophy (the reference class problem) and a more applied version in forecasting. I don't want an essay about either. I want a written procedure my analysts can run on a single estimate in an afternoon, with no stats background beyond means, percentages, and reading a spreadsheet. Two pages of instructions plus a worksheet they fill in. It has to answer these things, roughly in this order:

  1. How to generate candidate reference classes for a given project. I want the procedure to force at least a broad class and a narrow class, and to say how to tell you've gone broad enough / narrow enough rather than just stopping when you like the answer.

  2. A test for gerrymandered classes. Someone will always be able to cook up a class where the base rate looks great — "all projects whose sponsor had previously delivered a project in the same county" or whatever. Give me a rule an analyst can apply and that a hostile auditor can check, something better than "use your professional judgment." If the honest answer is that part of it can only be "was the class definition fixed before anyone looked at the outcomes," say that and build the paper trail around it.

  3. What to do when relevance and sample size pull opposite ways — the narrow class is mechanistically similar but has n=4, the broad class has n=200 and includes stuff that obviously isn't like this. I want an actual tie-break or a weighting rule with numbers in it, not "balance the two." If you're going to say shrink toward the broad class, tell me by how much and what makes the shrinkage bigger or smaller.

  4. Whether the analyst should be thinking in frequencies or in odds. Half my team naturally thinks "what are the chances this comes in over budget," the other half thinks "what price would I take on that bet." Tell me whether your procedure gives a different answer under the two framings, and if it can, which framing the worksheet should use and why — I suspect the betting framing quietly punishes you for picking a class where you'd never actually take the bet, and I want to know if that's a feature.

  5. Mark every step that is a judgment call wearing a procedure costume. I'd rather have three flagged steps I know are soft than fifteen steps that look mechanical. And say where the procedure hands the decision up to me because it's about what we're willing to commit to, not about the data.

  Then run it end to end on two real-shaped cases, showing the worksheet filled in:

  - A 40 km light rail extension in a metro area where we've never built rail. We have built eleven bus rapid transit corridors. Is BRT in the reference class or out, and what does the procedure do when the narrowest defensible class is empty?
  - A 300-bed hospital replacement. We've done six comparable hospital builds, all six under design-bid-build; this one is design-build, and the procurement change is the whole point of the project.

  For the hospital one, don't soften the result. I'm fairly sure our hospital numbers have been optimistic for a decade and if your procedure says the six-project average is the wrong thing to reach for, I want it to say so in a form I can put in front of my director.

  Finally: one paragraph on what the procedure can't fix. If the base rates in our own project database are themselves contaminated by the fact that we've always estimated optimistically, say whether the procedure detects that or just inherits it.
reasoning: |-
  Okay, the user runs a cost estimation unit and needs a practical procedure to address an auditor's critique. Let me start by understanding their core problem. Their current method of averaging three similar projects was flagged for lacking criteria. They want a structured process that's quick and doesn't require advanced stats.

  First, I need to tackle the reference class generation. The user wants both broad and narrow classes. How do I define those? Broad could be all infrastructure projects, narrow maybe specific types like hospitals. Need clear rules for what qualifies as broad enough—maybe covering multiple project types and geographies. For narrow, maybe same project type and similar scale. Also, how to avoid gerrymandering. Predefining classes before looking at outcomes is key. Maybe require that classes are defined using only project attributes known at the start.

  Next, the gerrymandering test. The user mentioned examples like "projects in the same county." A rule based on pre-defining attributes and avoiding outcome-based selection. Also, checking if the class has a logical justification beyond fitting the data. Maybe a checklist: attributes defined upfront, relevance to cost drivers, no outcome data used.

  Sample size vs. relevance trade-off. The user wants a concrete rule, not just balancing. Weighted average based on sample size? Set a minimum n for narrow class. If n<10, weight broad more. Maybe use shrinkage: the weight on broad class increases as narrow sample decreases. Formula: weight = n_narrow / (n_narrow + 10). So if narrow has 4, weight is 4/14 ≈ 29% narrow, 71% broad.

  Frequencies vs. odds. The procedure should use frequencies (base rates) because it's about historical averages. Betting odds introduce subjectivity. The worksheet should stick to base rates to keep it objective. Mention that if a class has no historical data, it's invalid, which addresses the betting concern indirectly.

  Judgment calls: defining project attributes, choosing between classes if multiple are valid, setting min thresholds. Flag these steps. Also, decisions about committing to a class should be escalated to the manager.

  Real examples. For the light rail without rail history: broad is all transit (BRT included), narrow might be rail but empty. Use broad class, or if possible, include similar BRT projects. For hospital with procurement change: narrow class excludes design-build, so broad class (all hospitals) is used, but procurement is a risk factor. Adjust the estimate upwards based on expert input on procurement risks.

  Limitations: If historical estimates are biased, the procedure inherits that. It can't detect systemic optimism. Suggests external benchmarking if possible.

  Need to ensure the worksheet is straightforward. Analysts fill in attributes, define classes, calculate weights, apply adjustments. Examples should show each step clearly, especially how to handle empty narrow classes and procurement changes.
answer: |-
  Here’s a procedural framework ("Reference Class Selection Protocol") for cost overrun estimation, designed for speed, auditability, and clarity. It includes a worksheet template and worked examples.

  ---

  ### **REFERENCE CLASS SELECTION PROTOCOL**  
  *For State Infrastructure Agency Cost Overrun Estimation*

  **Core Principle:** Estimate overrun likelihood using historical base rates from projects *like this one*. Define "like" objectively *before* seeing outcomes.

  ---

  #### **PROCEDURE**  
  *(Analyst completes Steps 1-4 using Worksheet; Supervisor reviews Step 5)*

  1.  **Define Project Attributes (Judgment Call #1):**  
      - List all attributes known *at project kickoff* that could affect cost overruns (e.g., project type, delivery method, size, location, complexity, funding source).  
      - *Worksheet Requirement:* Minimum 5 attributes. Attribute list *must* be fixed before proceeding.

  2.  **Generate Candidate Classes:**  
      - **Broad Class:** All projects (min. n=30) sharing ≥3 *core attributes* (e.g., "Transportation", "> $100M", "Urban").  
      - **Narrow Class:** All projects (min. n=5) sharing ≥4 attributes, including ≥2 *mechanistic drivers* (e.g., "Healthcare", "Design-Build", ">200 beds", "Seismic Zone 4").  
      - **Stop Rules:**  
        - Broad: Must include ≥3 project subtypes (e.g., highways, bridges, transit). If not, add attributes until it does.  
        - Narrow: Must exclude ≥20% of Broad Class projects. If not, add attributes until it does.  
      - *Worksheet Requirement:* List attributes defining each class. Record project count (n) and overrun data.

  3.  **Test for Gerrymandering (Audit Check):**  
      - Apply the **Predefinition & Relevance Test**:  
        1. Were *all* attributes defining the class documented in Step 1? If no, invalid.  
        2. Can you defend *why* each attribute affects costs *without mentioning this project's outcome*? (e.g., "Design-Build reduces change orders" is valid; "Projects with Manager Smith were under budget" is invalid). If no, invalid.  
      - *Worksheet Requirement:* Answer "Yes/No" to both tests. "No" on either fails the class.

  4.  **Calculate Weighted Overrun:**  
      - If Narrow Class passes gerrymander test and n≥10: **Use Narrow Class overrun %**.  
      - If Narrow Class n<10:  
        - Calculate **Weighted Overrun** = `(n_narrow / (n_narrow + 10)) * Overrun_narrow + (10 / (n_narrow + 10)) * Overrun_broad`  
        - *Example:* Narrow (n=4, 15% overrun), Broad (n=200, 10% overrun) → `(4/14)*15 + (10/14)*10 = 4.3 + 7.1 = 11.4%`  
      - If Narrow Class fails gerrymander test or is empty: **Use Broad Class overrun %** (if n≥30; else escalate).

  5.  **Risk Factor Adjustment (Escalate to Supervisor):**  
      - If project has a *novel risk factor* absent in reference class (e.g., new technology, unique regulation), Supervisor may apply a +X% adjustment.  
      - *Worksheet Requirement:* State adjustment and justification. Default = 0%.

  ---

  #### **WORKSHEET TEMPLATE**
  | **Step**                | **Input**                                                                 |
  |-------------------------|---------------------------------------------------------------------------|
  | 1. Project Attributes   | [E.g., Type, Size, Location, Delivery Method, Complexity Rating]          |
  | 2a. Broad Class Def.    | Attributes: ________ n=____ Overrun Avg: ____%                            |
  | 2b. Narrow Class Def.   | Attributes: ________ n=____ Overrun Avg: ____%                            |
  | 3. Gerrymander Test     | Predefined? (Y/N) | Relevance Defensible? (Y/N) | **VALID?** (Y/N)     |
  | 4. Weighted Overrun     | Calculation: ________ → **Result: ____%**                                 |
  | 5. Risk Adj. (If any)   | +___% Justification: ________ → **Final Overrun Est: ____%**              |

  ---

  ### **WORKED EXAMPLES**

  #### **Example 1: 40 km Light Rail Extension**  
  *(No prior rail projects; 11 BRT corridors exist)*

  | **Step**                | **Input**                                                                 |
  |-------------------------|---------------------------------------------------------------------------|
  | 1. Attributes           | Type=Transportation, Size=$500M-$1B, Location=Metro, Delivery=Design-Bid-Build, Complexity=High |
  | 2a. Broad Class         | Atts: Type=Transportation, Size=$500M-$1B, Location=Metro → n=11 (all BRT) Overrun=22% |
  | 2b. Narrow Class        | Atts: Type=**Rail**, Size=$500M-$1B → n=0 (EMPTY)                         |
  | 3. Gerrymander Test     | N/A (n=0) → **INVALID**                                                   |
  | 4. Weighted Overrun     | Narrow invalid → **Use Broad Class: 22%**                                 |
  | 5. Risk Adj.            | +5% (First rail project; higher utility conflict risk) → **Final: 27%**  |

  **Outcome:** BRT is in reference class. Analyst uses Broad Class (BRT) overrun + supervisor adjustment.

  ---

  #### **Example 2: 300-Bed Hospital (Design-Build)**  
  *(6 prior hospitals, all Design-Bid-Build, avg. overrun 8%)*

  | **Step**                | **Input**                                                                 |
  |-------------------------|---------------------------------------------------------------------------|
  | 1. Attributes           | Type=Healthcare, Size=$300M-$500M, Beds=200-400, Delivery=**Design-Build**, Complexity=High |
  | 2a. Broad Class         | Atts: Type=Healthcare, Size=$300M-$500M → n=6 Overrun=8%                 |
  | 2b. Narrow Class        | Atts: Type=Healthcare, Delivery=Design-Build → n=0 (EMPTY)               |
  | 3. Gerrymander Test     | N/A (n=0) → **INVALID**                                                   |
  | 4. Weighted Overrun     | Narrow invalid → **Use Broad Class: 8%**                                  |
  | 5. Risk Adj.            | **+12%** (Procurement change increases scope ambiguity risk; external data shows +10-15% DB overrun vs. DBB in healthcare) → **Final: 20%** |

  **Outcome:** The procedure *forces use of the 8% base rate* but exposes the procurement mismatch. Supervisor applies a significant, evidence-based adjustment, explicitly flagging historical optimism.

  ---

  ### **WHAT THIS CAN'T FIX**
  **Systematic Historical Bias:** If your agency’s past estimates were *consistently optimistic*, this procedure inherits that bias (e.g., if "8% overrun" is actually 8% over an unrealistically low estimate). The test detects *class gerrymandering*, not *baseline distortion*. Mitigation requires external benchmarking (e.g., comparing your project database against industry-wide data) or recalibrating past estimates against actuals—tasks beyond this worksheet. **Auditor Alert:** This method assumes historical estimates were reasonably unbiased; if not, all outputs are downward-biased.

  ---

  ### **KEY JUDGMENT CALLS (Flagged Per Request)**
  1.  **Step 1 (Attribute Selection):** Choosing which project features are cost-drivers.  
  2.  **Step 5 (Risk Adjustment):** Quantifying novel risks without direct data.  
  3.  **Gerrymander Test (Relevance Defense):** Arguing an attribute affects costs absent outcome data.  

  **Procedure Handoffs:**  
  - Escalate if Broad Class n<30.  
  - Escalate Risk Adjustments >10% or without external justification.  

  **Framing (Frequencies vs. Odds):**  
  The procedure uses **frequencies** (historical overrun %). The "betting" framing is incompatible—it would require subjective probability calibration. By forcing classes to be predefined and mechanically weighted, the frequency approach *implicitly* addresses the betting concern: if your Narrow Class has n=4, the formula automatically "shrinks" toward the Broad Class, penalizing small samples.
