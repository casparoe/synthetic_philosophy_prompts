answer: |-
  Here’s my bottom line: **The most serious vulnerability of ECDT is the *similarity class problem*—the inability to non-arbitrarily define which agents count as "like me" for evidential correlation. This forces the view into either vacuity (if "similar" is too broad) or irrelevance (if too narrow), and no defender has a principled solution. The correlation/screening worry compounds this but isn’t fatal alone. Self-undermining is a practical risk but not a logical defeater. Crucially, ECDT is empirically insulated—no observation can falsify it—which is damning for a theory claiming real-world stakes. I’m ~70% confident this similarity arbitrariness sinks it as a practical guide.**  

  Now, the defeaters mapped by damage level:  

  ### **Fatal Defeaters** (Collapse the core mechanism)  
  1. **No Non-Arbitrary Similarity Class**: If there’s no objective way to bound the set of "agents like me" (e.g., does "similar" mean same genes? same upbringing? same algorithm at time of decision?), ECDT loses predictive power. You could always narrow/widen the class to rationalize *any* choice post-hoc. Defenders *concede* this is a problem but argue we use "reasonable" similarity thresholds (e.g., agents facing isomorphic problems). Skeptics retort: without a grounding principle (e.g., causal history), "reasonable" is circular. *Live? Extremely.* Our best neuroscience suggests human decisions are sensitive to trivial contextual differences—so no two agents are truly identical, and similarity is always a judgment call.  

  ### **Crippling Defeaters** (Force retreat to triviality)  
  2. **Screening Off by Common Cause**: If our actions correlate *only* because we share a common cause (e.g., evolutionary pressures), then conditioning on that cause should screen off my action as evidence for yours. Example: If DNA explains why we both cooperate in PD, learning I cooperate adds no new info about your choice. ECDT defenders *deny* this is decisive (they argue the decision procedure itself generates residual correlation), but if true, it reduces acausal influence to near zero. *Live? Plausible.* Biology and culture *are* common causes, and it’s unclear if "decision similarity" adds evidence beyond them.  
  3. **Sparse or Uncooperative Agents**: If sufficiently similar agents are extremely rare (e.g., Earth is the only planet with intelligent life) or systematically uncooperative (e.g., agent types resembling yours mostly defect), ECDT recommends non-cooperation. Defenders might call this a "retreat," but skeptics see it as surrender: the "cosmopolitan" vision evaporates, leaving ordinary game theory. *Live? Unknown, but plausible.* Fermi Paradox-style arguments suggest advanced agents may be undetectable/malicious.  

  ### **Awkward Defeaters** (Absorbable but costly)  
  4. **Self-Undermining via Leverage**: If others can *manufacture* correlations (e.g., an AI threatens to punish all agents who resemble defectors), ECDT might compel you to comply with extortion (e.g., Roko’s Basilisk). Defenders *concede* this is a risk but argue it’s a feature: you *should* coordinate against threats. The real cost is vulnerability to precommitment attacks: any entity that can credibly tie outcomes to your "type" gains control over you. *Live? Contingent but concerning.*  
  5. **Value Clash in Compromise**: Trading with aliens/agents of alien values might require sacrificing your core values (e.g., "compromising" with paperclip maximizers). ECDT defenders accept this but call it a negotiation cost. Skeptics see it as a reductio: why should your values bend to acausal blackmail? *Live? Likely in multiverse settings.*  

  ### **Your Specific Worries Addressed**  
  - **Correlation/Screening**: Yes, common causes *can* screen off evidence—but only if they *fully* account for the correlation. Defenders insist that shared decision algorithms create *additional* correlation, making your choice informative. But if similarity is ill-defined (Defeater #1), this becomes unfalsifiable. **Not decisive alone, but lethal combined with arbitrariness.**  
  - **Self-Undermining**: Real but not fatal. It shows ECDT can be exploited, not that it’s incoherent. **Cost: You become a pawn to anyone who understands and manipulates these correlations.**  

  ### **The Insulation Problem**  
  ECDT is *empirically untestable*. If you defect in PD and lose, defenders say: "No sufficiently similar agents existed here." If you win: "See? They cooperated!" This isn’t a virtue for a "practical" theory—it means you can’t learn from experience or correct errors. Worse: **it conflates decision-making with cosmic gambling**. Betting on acausal allies feels less like rationality and more like Pascal’s Wager with extra steps.  

  ### **Does This Require Settling EDT vs. CDT?**  
  No. The similarity class problem attacks ECDT *internally*: even if you grant evidential reasoning, "agents like me" is underspecified. CDT objections (e.g., "But you *caused* nothing!") are stronger but not needed here.  

  ### **What Would Fix ECDT?**  
  A principled definition of "similarity" that’s:  
  - **Non-arbitrary** (e.g., measurable functional isomorphy),  
  - **Actionable** (lets you estimate the size/behavior of your reference class),  
  - **Non-self-undermining** (immune to adversarial correlations).  
  No version yet clears this bar. Until then, it’s a fascinating thought experiment—but too unstable to live by. Stick with causal gloves on.  

