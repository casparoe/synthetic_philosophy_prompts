prompt: |-
  I run a tiny podcast on the philosophy of economics — maybe 900 listeners, mostly grad students and econ people who've had one course in decision theory — and next month's guest is a philosopher-economist who defends a broadly Keynesian account of probability: rational belief is often not pinned down by a single number, evidence has a weight as well as a bearing on the conclusion, and a lot of what economists do with priors and expected values is false precision dressed up as rigor. She's smart and charming and she has one tic I need help with: whenever you press her on the formalism she retreats to "all I'm saying is that real business decisions aren't lottery draws," and then moves on. I want a question sequence where that retreat gets progressively less comfortable to make.

  So, play the role of someone who's actually spent time in both literatures — Keynes's early work on probability and the modern stuff on imprecise probability, sets of priors, and all that — and before you write anything, brainstorm out loud for a few bullets: where does the Keynes scholarship actually put pressure on a defender like her, and where is the pressure mostly rhetorical? Then give me nine to eleven questions I can read aloud. I want coverage of at least these: (1) the weight of an argument — is it just the size of the relevant evidence base, what do you say when new evidence raises the weight but leaves the probability alone, and does weight ever tell an agent what to do, or does she need a decision rule on top of it; (2) whether her view is anything more than imprecise Bayesianism in period costume, and what she does about updating and dilation once you allow sets of probabilities; (3) how she keeps some version of the principle of indifference from licensing arbitrary equiprobability splits, without the relevance judgments turning into priors in disguise; (4) probability as an objective logical relation between propositions known by intuition — what survives if you drop that epistemology, given the old Ramsey complaint about queer relations and a special faculty; (5) the 1930s material — the beauty contest, convention, animal spirits, the assumption that the existing state of affairs will continue absent specific reasons to expect change — and here I specifically want a question asking whether the beauty contest is really about uncertainty at all rather than about higher-order beliefs and strategic interdependence, becuase I suspect she slides between the two; (6) whether convention is evidence that rational calculation is impossible or evidence that it's being successfully outsourced; (7) which of the two readings of Keynesian uncertainty she actually holds — the one where there's no probability at all in these cases (the non-ergodic line, Davidson and company) versus the one where there is a probability but it isn't measurable or comparable (the Treatise line, O'Donnell) — and what turns on the difference for her; and (8) the policy payoff: does this generate distinctive macro conclusions, or would it also rule out the cost-benefit reasoning used to defend the intervention she wants. If you can fit in one question on the Moorean ethics side — organic unities, probability as a guide to conduct, whether weight smuggles in a duty to be careful — that'd be great too.

  Format: each question short enough to say in one breath, then one line telling me what I'm hoping to get out of it, plus a follow-up for at least half of them keyed to the answer she's most likely to give. No generic warm-up stuff, and nothing that asks her to cite pages, list books, or quote passages — I'll cut those in editing anyway. One more thing I really care about: separate for me what's settled from what's genuinely contested among people who know this material. Whether the early probability work and the later macro writing are continuous, and which reading of uncertainty she should be pushed toward, are live disputes, so don't build a question on top of your favorite interpretation as though everyone agreed with it — mark the ones that lean on a contested reading, and if you're not sure about some factual detail in the setup just flag it rather than asserting it.
reasoning: |-
  Okay, let me start by really unpacking what this podcast host needs. They run a niche philosophy of economics podcast with about 900 listeners—mostly grad students and econ folks with some decision theory background. The upcoming guest is a philosopher-economist defending a Keynesian view of probability. Her key points are that rational belief isn't always a single number, evidence has "weight" beyond just changing probabilities, and she criticizes economists for false precision with priors and expected values.

  The host's main concern is her rhetorical retreat: whenever pressed on formalism, she falls back to "real business decisions aren't lottery draws" and moves on. The host wants a sequence of questions that makes this retreat increasingly uncomfortable. They've listed eight specific areas to cover, plus a bonus on Moorean ethics.

  First, I need to brainstorm where the genuine scholarly pressure points are versus where it's more rhetorical. For the weight of evidence, Keynes's idea is ambiguous—is it just evidence size, or does it include qualitative aspects? And how does it guide action? That's a real weakness because Keynes didn't provide a decision rule, so pressing there forces her to either admit the gap or invent something. The formalism question—whether her view is just imprecise Bayesianism in disguise—is both scholarly and rhetorical. If she denies it, she must explain what's uniquely Keynesian; if she accepts, it undermines her critique of modern approaches. The principle of indifference is another pressure point: Keynes needed it but struggled with relevance, which feels like priors sneaking in. That's a solid critique.

  Keynes's epistemology—probability as objective logical relations known by intuition—is vulnerable. Ramsey's critique is famous, and dropping it might collapse the whole framework. This is scholarly but also rhetorical because it questions the foundation. On the beauty contest, there's genuine debate: is it about uncertainty or strategic interdependence? Scholars like Davis say it's the latter, so pressing here could expose conflation. The convention point—whether it shows rationality is impossible or outsourced—is more interpretive but can trap her in a contradiction if she's not careful.

  The uncertainty split (no probability vs. non-comparable probability) is crucial. O'Donnell vs. Davidson represents a real scholarly divide, and her answer determines if her view is radical or moderate. For policy, the key is whether her critique also hits cost-benefit analysis used to justify interventions she supports—that's a potential inconsistency.

  For the Moorean ethics angle, connecting weight to a duty to be careful could force her into moral claims she might not want to make. Now, structuring the questions: start with formalism to prevent early retreat, then hit weight/action, indifference, epistemology, beauty contest (marking it as contested), convention, uncertainty reading (contested), policy, and ethics. Each question needs to be concise, with a clear intent and likely follow-up. I'll flag where interpretations are disputed and avoid assuming consensus. The sequence should escalate discomfort by closing off escape routes step by step.
answer: |-
  Here's a brainstorm of pressure points & rhetorical angles, followed by the question sequence designed to corner the retreat. I'll flag contested interpretations.

  **Brainstorm: Pressure Points vs. Rhetoric**
  *   **Weight of Evidence (Scholarly Pressure):** Keynes was ambiguous. Is "weight" merely *quantity* of relevant evidence (Keynes sometimes suggests this), or a *qualitative* assessment of its completeness/definitiveness for the *kind* of question? Crucially, **Keynes offered no formal decision rule incorporating weight.** Pressing how agents *act* under high weight vs. low weight identical probabilities exposes a core gap. Rhetorical pressure: "If weight doesn't tell me *what to do*, how is it practically relevant beyond saying 'be careful'?"
  *   **Formalism / Imprecise Bayes (Mixed):** *Conceptually*, Keynes' "indefinite probability" strongly prefigures imprecise prob (sets of priors, credal sets). **Scholarly pressure:** Modern formalism handles updating (dilation!), decision rules (Maximin, Hurwicz), and aggregation in ways Keynes didn't/couldn't. If she rejects this link, she must articulate *what uniquely Keynesian formalism exists* beyond the critique. Rhetorical: "Isn't this just imprecise Bayes wearing a tweed jacket? What operational difference remains?"
  *   **Principle of Indifference (Scholarly Pressure):** Keynes *needed* it but knew its flaws (relevance problem). **This is a major weakness.** Attempts to ground "relevance" without resorting to probabilistic judgments (effectively priors) often fail or are circular. Pressing how she determines the *right* symmetries/partitions without smuggled priors is key.
  *   **Objective Logical Relations / Ramsey (Scholarly Pressure):** Ramsey's critique is devastating to the *epistemology*. **Pressure:** If she drops the "queer logical relation" & intuition, what *grounds* the "indefinite probability" relation? Does it collapse into subjective confidence? How is it not just *less precise* Bayesianism? This undermines the "objective" claim often associated with Keynesian uncertainty.
  *   **Beauty Contest (Scholarly Pressure - Contested):** This is hotly debated. **Pressure:** Davis (1994), others argue it's primarily about **strategic interdependence under imperfect information and convention**, *not* fundamental uncertainty about a fixed future state. Conflating the two is common. Ask explicitly to separate them. Rhetorical: "When you cite the beauty contest for uncertainty, are you sure it's not about game theory?"
  *   **Convention (Rhetorical Leverage):** Frame it as a dilemma: Is convention a *failure* of individual rationality (can't calculate) or its *collective expression* (efficient outsourcing)? Her answer reveals if she sees rationality as fundamentally limited or just computationally expensive. Pressing the "outsourcing" angle undermines the "impossibility" claim.
  *   **Two Readings of Uncertainty (Scholarly Pressure - Contested):** The Davidson (non-ergodic, no probability) vs. O'Donnell (non-measurable) split is real. **Pressure:** Her choice has big implications. Davidsonian radical uncertainty *genuinely* breaks Bayesianism but is harder to apply. O'Donnell is closer to imprecise prob. Which does she endorse, and *how* does it change modeling/policy vs. imprecise Bayes? Rhetorical: "If it's just non-measurable, don't sets of priors capture that?"
  *   **Policy Payoff (Scholarly & Rhetorical Pressure):** **Crucial:** Does her critique of "false precision" in Bayesian cost-benefit analysis also invalidate the cost-benefit reasoning likely used to justify *Keynesian interventions* (e.g., stimulus)? If she exempts it, why? This probes for inconsistency. "Doesn't your view poison the well for your own policy prescriptions?"
  *   **Moorean Ethics (Scholarly Pressure):** Keynes saw probability as a *guide to conduct* under Moore's ethics. **Pressure:** Does "weight" imply a *duty* to seek evidence (an "organic" duty to be careful)? How is this duty defined without precise constraints? Links weight back to action/ethics forcefully.

  ---

  **Question Sequence: Cornering the Retreat**

  1.  **"You emphasize that rational belief often isn't a sharp probability. Modern 'imprecise probability' uses sets of priors to model that. What specific *formal* difference does the Keynesian notion of 'indefinite probability' offer beyond this framework, especially for updating beliefs?"**  
      *Intent:* Block the retreat early by demanding formalism. Expose if it's just terminological.  
      *Likely Retreat/FU:* "It's about the *nature* of uncertainty..." → **"But operationally, when an agent with a set of priors updates on ambiguous evidence and experiences dilation, how is that meaningfully different from the 'Keynesian' uncertainty you describe?"**

  2.  **"On the weight of evidence: Keynes sometimes equated it with the *amount* of relevant evidence. But if new evidence increases weight without changing the probability estimate – say, more data confirming a 60% chance – what concrete action should a rational business leader take differently than if the weight was lower?"**  
      *Intent:* Force the gap between weight and action into the open.  
      *Likely Retreat/FU:* "They should be more cautious, seek more evidence..." → **"But 'cautious' how? Does 'weight' mandate a specific decision rule, like Maximin or minimax regret, that sharp probability doesn't? Or is it just a qualitative warning label?"**

  3.  **"Keynes relied on the Principle of Indifference to get initial probabilities. But avoiding arbitrary splits requires judging which possibilities are 'equally probable' or 'relevant'. Aren't these judgments effectively *prior beliefs* about the structure of the problem, undermining the claim to avoid priors?"**  
      *Intent:* Attack the foundation. Show how priors sneak back in.  
      *Likely Retreat/FU:* "It's about logical symmetry, not belief..." → **"But determining which symmetries are *evidentially relevant* for, say, a new technology's market success seems to require substantive world knowledge – isn't that prior-like?"**

  4.  **(Contested Setup - Flagged)** *"Scholars debate Keynes' epistemology. Ramsey famously critiqued the 'objective logical relation' view as requiring a 'queer' faculty. If we drop that intuitionist epistemology, what grounds the 'indefinite probability' relation? Is it just less precise subjective confidence?"*  
      *Intent:* Challenge the metaphysical foundation. Force a choice: salvage objectivity or admit subjectivism.  
      *Likely Retreat/FU:* "It's about the limits of knowledge in complex systems..." → **"But does that mean the 'probability' itself is a property of the agent's limited perspective, not an objective logical feature of the propositions? Isn't that closer to subjectivism?"**

  5.  **"Let's turn to the beauty contest analogy. It's often cited for fundamental uncertainty. But isn't a core element strategic interdependence – I think about what you think, and what you think I think, etc.? How do you disentangle the effect of *this strategic game* from the effect of *fundamental uncertainty* about the 'true' value?"**  
      *Intent:* Force separation of strategic uncertainty from ontological/epistemic uncertainty. Expose conflation.  
      *FU Potential:* If she downplays strategy → **"So, in a purely non-strategic context with fundamental uncertainty about a single parameter – like the long-term climate sensitivity – would the 'beauty contest' logic still apply identically?"**

  6.  **"Keynes talked about 'convention' stabilizing expectations under uncertainty. Do you see this as evidence that rational calculation is *impossible* for individuals, or that it's *efficiently outsourced* to a social process? Does convention replace reason, or embody it collectively?"**  
      *Intent:* The Outsourcing Trap. If she picks "outsourced," it weakens the "impossibility" claim. If "impossible," it questions social epistemology.  
      *FU Potential:* If "outsourced" → **"Doesn't that imply the collective *can* generate a workable (if imperfect) probabilistic assessment, challenging the idea that no probability exists?"**

  7.  **(Contested Setup - Flagged)** *"Interpreters differ on Keynesian uncertainty. Some (like Davidson) read it as radical non-ergodicity – no probability exists. Others (like O'Donnell) read the Treatise as allowing non-measurable/non-comparable probabilities. Which reading do you defend, and crucially, what *policy-relevant implication* turns on choosing one over the other?"*  
      *Intent:* Force a stance on the spectrum. Link the metaphysics to policy consequences.  
      *Likely Retreat/FU:* "It's about incommensurability..." → **"But does that incommensurability preclude *any* probabilistic representation, including sets? Or just complicate comparison? How does *your* chosen reading mandate a different policy approach than, say, robust control with multiple models?"**

  8.  **"Let's talk policy impact. Your critique targets the 'false precision' of Bayesian cost-benefit analysis in complex investments. But wouldn't the *same critique* apply equally to the cost-benefit analysis used to justify, say, large-scale fiscal stimulus – the very intervention Keynesian policy often recommends? Does your framework provide a *better* way to rigorously justify such interventions?"**  
      *Intent:* The Poisoned Well. Expose inconsistency or demand her alternative justification.  
      *FU Potential:* If she exempts macro CBA → **"What principled distinction allows probabilistic reasoning for stimulus but not for a business investment? Is it just scale, or something about the nature of the uncertainty?"**

  9.  **"Finally, the Moorean angle: Keynes saw probability as a 'guide to conduct'. If evidence has 'weight', does that imply a *duty* to gather evidence before acting? How is this duty defined without falling into an infinite regress of evidence-gathering or relying on arbitrary thresholds?"**  
      *Intent:* Connect weight back to ethics/action and expose potential vagueness or paralysis.  
      *Likely Retreat/FU:* "It's about reasonable judgment..." → **"But doesn't 'reasonable' judgment in gathering evidence itself depend on some implicit probabilistic assessment of the costs and benefits of *further* evidence? Isn't that circular?"**

  **Key Contested Points Flagged in Questions:**
  *   **Q4:** The status of Keynes' epistemology (objective relation vs. subjectivist-leaning) is debated.
  *   **Q5:** The interpretation of the beauty contest (fundamental uncertainty vs. strategic interdependence) is contested (e.g., Davis vs. more traditional Keynesians).
  *   **Q7:** The radical Davidsonian (no probability) vs. moderate O'Donnell (non-measurable probability) reading of uncertainty is a major scholarly split.

  **Execution Tips:**
  *   **Pace & Tone:** Ask calmly, almost conversationally, but with clear intent. Let the *logic* create the discomfort, not aggression.
  *   **Listen & Adapt:** If she gives substantial ground on one point, acknowledge it ("That's helpful on X...") and pivot harder to the next unresolved pressure point ("...so then on Y...").
  *   **The Retreat:** When she inevitably says "real business decisions aren't lottery draws," *immediately* pivot to the most relevant FU from the list above: "Understood, they're complex. But *precisely because* they aren't lotteries, how does your framework formally address [Weight/Action, Indifference/Relevance, Convention as Outsourcing, Policy Justification]?" Keep tying the retreat *back* to the formal/practical gap.
  *   **Flagging:** Briefly noting "Scholars differ on this..." (like in Q4 & Q7) shows rigor and prevents it sounding like you're pushing one fringe view.

  This sequence progressively boxes her in: formalism → actionability → foundations (epistemology/indifference) → interpretation of key concepts (beauty contest, convention, uncertainty) → policy coherence → ethical grounding. The retreat becomes harder because each evasion opens another, more specific, vulnerability. Good luck!
