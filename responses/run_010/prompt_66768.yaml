  Ah, and the user's deeper question: is this whole framework applicable? I suspect Nyāya would see LLMs as sophisticated simulacra of knowing, not pramāṇa-holders. But there's that fifth pramāṇa suggestion... Mimamsa's arthāpatti (postulation) could fit abduction in models, but even that requires intentional gap-filling. 

  *Committing scores*: 
