  Okay, let me unpack this user's query. They're a retired limnologist, 68, deeply engaged with Hume's philosophy, specifically the Treatise section on promises. Their struggle is both intellectual and personal: understanding Hume's argument about promise obligations and applying it to a real-life "orphan promise" made to a deceased colleague.

  First, I need to recall Hume's exact argument. He says promises aren't natural obligations but artificial, created by social conventions. The user summarized it well: the act of promising creates expectations in others, and society's approval of keeping promises enforces them. The binding force comes externally, not from the will. The example of two rowers cooperating without promises illustrates that convention alone can coordinate actions.

  The user's personal dilemma involves a promise to a dying colleague, Don, to archive decades of lake data. Now, Don is gone, no one else cares, and the user wonders if Hume's framework still applies. They call it an "orphan promise" – no one to hold the expectation, no practical utility. The core question: does Hume's theory account for such cases?

  Breaking down Hume's components:
  1. Convention/Social Practice: The ongoing system where promises are made and kept.
  2. Raised Expectations: The promisee's reliance on the promisor.
  3. Moral Sentiment: Society's approval of promise-keeping and disapproval of breaking them.
  4. Utility: The general benefit of trust in social cooperation.

  In the orphan promise, key elements are missing: Don is dead (no expectation), no one else knows (no social oversight), and archiving seems useless (no utility). So why does the user feel bound? 

  Hume might argue that the sentiment remains because the general convention still exists. Breaking any promise, even unseen, weakens the social fabric. Also, the user's self-approval is tied to adhering to the virtue of fidelity. The "general rule" of promise-keeping persists beyond individual utility. The rowing example shows convention's power, but here the promise adds a personal commitment layer.

  The user might be leaning on Hume's point about self-directed sentiments. Even without external judgment, they'd despise themselves for breaking it, tying into Hume's view of virtue. The general rule's grip matters more than the specific instance's usefulness.

  But does Hume's framework handle this gracefully? It explains the lingering obligation through the internalized convention and self-sentiment. However, it might predict weaker binding in orphan cases, yet the user feels strongly bound. This tension suggests Hume's theory is robust but highlights that moral psychology involves personal integrity beyond social utility.

  The moral sentiment isn't decoration; it's load-bearing. The user's guilt isn't irrational but a product of ingrained social conventions. Hume's system accommodates orphan promises through the internalization of fidelity, showing that the sentiment sustains the obligation when external factors fade.
answer: |-
  You've nailed the core of Hume's argument precisely - and your "orphan promise" dilemma is a brilliant test case that cuts straight to the tension in his theory. Let's dissect Hume's machinery and see what handles the weight in your situation. Here's the breakdown:

  **Hume's Core Moves on Promises (T 3.2.5):**
  1.  **Artificiality:** Promises aren't "natural" obligations (like avoiding harm). They are *artificial*, invented by humans to solve a coordination problem.
  2.  **Will Cannot Create Obligation:** You cannot *will* yourself into being obligated. Saying "I will this to bind me" does nothing magically. A resolution isn't binding.
  3.  **The Formula's Function:** The words "I promise" are a *sign*. Their sole function is to signal your participation in a social convention and thereby **create an expectation in the hearer**.
  4.  **Convention & Sentiment Generate Obligation:**
      *   The *convention* exists because humans need cooperation beyond immediate tit-for-tat (the rowing boat example - no promise needed for mutual benefit).
      *   When you use the formula, you knowingly invoke this convention. You deliberately create an expectation of performance in the other person.
      *   We (society) observe that acting contrary to deliberately raised expectations causes harm and destroys trust.
      *   Therefore, through sympathy and reflection, we develop a **moral sentiment of disapproval** towards promise-breakers and **approval** towards promise-keepers. *This sentiment is the obligation.*
  5.  **Utility as the Foundation:** The *reason* the convention arises and the sentiment develops is **utility**. The practice of promising massively increases social cooperation and mutual advantage. We approve of fidelity because it's useful.

  **Your Orphan Promise: Applying Hume's Machinery**
  *   **The Expectation is Extinguished:** Don is gone. The expectation you deliberately raised in him no longer exists. Hume's primary mechanism (the raised expectation in the specific promisee) is nullified.
  *   **No Obvious Harm/Utility Deficit:** As you note, no one *else* (the survey, younger colleagues, the public) seems harmed or deprived of utility if you don't do it. The specific act of archiving *this* data lacks apparent social utility now.
  *   **The Convention Persists:** The social practice of promising is still very much alive. You participated in it when you made the promise.
  *   **The Sentiment Remains:** This is crucial. You *feel* the obligation. You would "despise yourself" (your words) if you broke it. This self-directed sentiment is *part* of Hume's moral sentiment.

  **What's Binding You, According to Hume?**
  1.  **The Internalized Sentiment & Self-Approval:** This is **load-bearing**. Hume doesn't *just* rely on external approval/disapproval. The moral sentiment becomes internalized. **Virtue (like fidelity) becomes its own reward through self-approval; vice its own punishment through shame and self-disapproval.** You keeping this promise maintains your own self-image as a person of fidelity. Breaking it would cause internal pain ("I'd despise myself") because you've absorbed the convention's moral sentiment. Hume wouldn't dismiss this as "just" feeling bad; he'd argue this *is* the moral obligation manifesting psychologically.
  2.  **The General Rule:** Hume explicitly argues that our moral judgments often rely on **general rules**, even when the specific instance seems harmless or useless (T 3.2.9 is relevant here). Why? Because:
      *   We can't perfectly calculate utility in every case.
      *   Adhering to the rule (e.g., "keep promises") *generally* promotes utility and social stability.
      *   If we made exceptions whenever utility seemed absent, the *whole convention* would be weakened, leading to widespread distrust and harm. **You keeping this "orphan promise" is a drop in the bucket supporting the general convention of fidelity.** Even if no one else knows, *you* know. Your adherence reinforces the rule *in yourself*, making you more likely to keep promises that *do* have obvious utility later. It maintains the *habit* of fidelity.
  3.  **The Convention Itself (Indirectly):** While the specific expectation in Don is gone, you made the promise *within* the ongoing convention. Your sense of obligation arises *because* you are a participant in that social practice. The convention provides the *framework* that gives the act of promising its meaning and triggers the internalized sentiment.

  **Does Hume Handle This Gracefully? Is He Right?**
  *   **Accommodates, But Strains:** Hume's framework *can* accommodate your orphan promise, primarily through the **internalized sentiment** and the **adherence to the general rule**. He *should* predict you feel bound, precisely because of the psychological mechanisms of self-approval/disapproval tied to fidelity as a virtue. The absence of external enforcement or obvious utility doesn't negate the power of the ingrained sentiment and the rule.
  *   **The Weak Spot:** Where Hume might *predict* a weaker obligation (or even none) is on pure utility grounds. If *literally no one* benefits and *no harm* occurs by breaking it (not even to yourself psychologically!), then utility vanishes. But Hume acknowledges that the *sentiment* often persists beyond strict utility calculations because of the power of the general rule and habit. Your case highlights that **the psychological force of fidelity (self-approval) can be decoupled from immediate social utility in specific instances.** Hume captures this decoupling with his emphasis on sentiment and rules.
  *   **Is it Decoration? Absolutely Not.** The moral sentiment talk is **fundamentally load-bearing**. It's the engine. The convention and utility explain *why* the sentiment arose evolutionarily/socially. But the *obligation you feel right now* is the sentiment itself – primarily your aversion to self-disapproval and your desire for self-approval as a promise-keeper. Utility justifies the *system*; sentiment constitutes the *experience* of obligation.
  *   **Your Case Tests the Theory Brilliantly:** Your orphan promise shows that Hume's account **works best when explaining the *source* of the feeling and the *general practice***. The lingering obligation in the absence of the original promisee or social utility leans heavily on the internalized sentiment and rule-following aspects. Hume *would* say you are bound, but the binding force comes almost entirely from *within* – your character as shaped by the convention – rather than from Don's expectation or current social utility. The "ought" you feel is the sentiment of fidelity in action.

  **The Blunt Answer (Humean Style):**
  Yes, fundamentally, you feel bound because breaking this promise would trigger self-disapproval (shame) and violate your internalized sense of yourself as a person of fidelity. This sentiment was implanted by the social convention of promising, which exists because of its general utility. While the *specific* utility of archiving Don's notes is debatable, adhering to the *general rule* of promise-keeping reinforces the virtue in you and symbolically supports the convention that enables crucial cooperation elsewhere. The expectation in Don was the initial spark, but the binding force now is the sentiment it ignited within you, sustained by the habit of virtue. It's not "just" feeling bad; it's the very mechanism Hume identifies as the foundation of moral obligation for artificial virtues like promising. Your orphan promise reveals the remarkable persistence of that internalized sentiment even when the original social context fades.
