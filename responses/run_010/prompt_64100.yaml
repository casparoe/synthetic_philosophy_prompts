prompt: |-
  So my ethics bowl coach does this thing every week where she hands out a made-up case and rules on it, and we have to argue both sides before she tells us why. Except she basically never tells us why. She just writes one line on the board. Her record so far this semester:

  1. Two people in their early 70s, both widowed, both with grown kids, want to marry. Obviously no babies in the picture, though they have her grandson three days a week. She said yes and wrote "nothing is missing."
  2. A 29 year old guy who's been sterile since chemo when he was 19, marrying a 27 year old woman, they say they'll adopt. Yes.
  3. Two 25 year olds, completely fertile, who told the clerk straight up they never want kids and are doing it for the tax filing status and because their landlord won't put two names on a lease. No. Her line: "that's a business deal with a ring on it."
  4. A man (55) and a woman (52), both with adult kids, and his medical situation means the physical part is off the table permanently, they both know that going in, and they want to marry to combine households and take care of her disabled brother. Yes.
  5. One man (40) and two women (35 and 38), all consenting, already raising three kids together, wanting all three of them legally married. No, and her note was about custody and medical decisions becoming a mess.
  6. A brother and sister, both adults, both single their whole lives, celibate, wanting to marry so they can share health insurance and jointly take care of their mom. No.
  7. A couple where the woman has no uterus, so they'd use his sperm, a donor egg, and a surrogate. She said yes and wrote "still their child, still their family," which half our class reads one way and half reads the other.

  The only general thing she's ever put in writing is at the top of the handout: "ask what the practice is arranged around, not what the participants want out of it." And in class she keeps seperating what a marriage can do, what a marriage is for, and what a marriage is, but she won't say which of those she's actually using.

  Next week's case: two women, together eleven years, one of them gave birth four years ago using donor sperm and both of them have been raising her as parents ever since, and now they want to get married.

  What do you think she rules? I'm not looking for the general arguments about marriage equality, I know those, I want her rule. So: what are the candidate rules that fit all seven verdicts, which verdicts is each one leaning on hardest, and which ones only fit if you stretch them? Then say what each rule gives you on next week's case, and which rule you'd actually bet on and why. And if her record doesn't settle it, what's the sharpest single case we could put in front of her to make the rules come apart.
reasoning: |-
  Hmm, the user is asking about their ethics bowl coach's pattern in ruling on made-up marriage cases. The coach gives minimal feedback - just a "yes" or "no" verdict with a one-line explanation. The user wants me to analyze the seven cases provided to deduce the coach's underlying rule, apply it to next week's case (a same-sex couple with a child via donor sperm), and identify a test case that would clarify any ambiguities.

  Looking at these cases carefully:

  - Case 1: Elderly couple (no kids possible) - YES ("nothing is missing")
  - Case 2: Sterile man + woman planning to adopt - YES
  - Case 3: Fertile couple explicitly childfree for practical reasons - NO ("business deal")
  - Case 4: Post-menopausal couple with medical celibacy - YES
  - Case 5: Polyamorous triad with kids - NO (custody concerns)
  - Case 6: Celibate siblings - NO
  - Case 7: Surrogacy using donor egg + husband's sperm - YES ("still their family")

  The coach's written clue is crucial: "ask what the practice is arranged around." This suggests the rule isn't about participants' intentions but about the inherent purpose of marriage as a social institution. The coach also distinguishes between what marriage "can do," "is for," and "is," but doesn't specify which framework she's using.

  Three candidate rules emerge:

  1) **Child-centered rule**: Marriage should facilitate child-rearing. This explains most YES cases (1-4,7) where children are present or planned, and NOs where children are explicitly rejected (3) or structurally complicated (5). But the sibling case (6) is a problem - they're caring for a parent, not raising children. Stretching it to "family care" might fit but feels weak.

  2) **Comprehensive union rule**: Marriage should represent a complete domestic partnership. This covers YES cases (1,2,4) showing lifelong interdependence, and NOs where the union is partial (3-business, 6-siblings, 5-unclear structure). But case 7 is tricky - it's biologically incomplete yet deemed a family. Also, case 3 might be rejected for lacking emotional depth despite practical entanglement.

  3) **Social function (anti-fraud) rule**: Marriage shouldn't be a legal fiction for benefits. This nails case 3 ("business deal") and case 6 (siblings), while allowing case 4's care arrangement and case 7's family unit. However, it struggles with case 5 (genuine triad rejected) and case 1 (which could be seen as benefit-seeking but approved).

  For next week's case (same-sex couple with donor-conceived child), all three rules point to YES:
  - Child-centered: They're actively parenting.
  - Comprehensive union: 11-year shared life with child-rearing.
  - Anti-fraud: Genuine family unit, not gaming systems.

  But the strongest fit is the comprehensive union rule - it handles the sibling case better than alternatives, and the coach's language ("arranged around") suggests structural analysis over outcomes or intent. 

  To force clarification, I'd propose a test case: A childfree heterosexual couple marrying solely for immigration purposes, but genuinely in love. The rules would diverge here:
  - Child-centered: NO (no kids)
  - Comprehensive: YES (if love makes it "complete")
  - Anti-fraud: NO (if seen as residency fraud)

  This would pressure the coach to reveal whether emotional bonds or institutional functions dominate her reasoning.
answer: |-
  Based on your coach's pattern, I've reverse-engineered three candidate rules that fit her verdicts. Each rule explains *most* cases cleanly but requires stretching for 1-2 verdicts. Below is the analysis, followed by predictions for next week's case and a test case to force clarity.

  ### Candidate Rule 1: **The "Child-Rearing Potential" Rule**
  - **Core idea**: Marriage must be structured around creating or sustaining a stable environment for raising children (biological, adopted, or existing dependents). Intent matters less than whether the union *enables* this function.
  - **Fits best**: Cases #2 (adoption plan), #3 (rejection of children), #5 (custody complications), #7 ("still their family" via biological/social ties).
  - **Stretched fits**: 
    - Case #1 ("nothing is missing" implies child-rearing via grandson care). 
    - Case #4 (care for disabled brother seen as "dependents").
  - **Weak fit**: Case #6 (siblings caring for mom) – rejected despite dependent care, so "child-rearing" must exclude elder care.
  - **Next week's case (two women with child)**: **YES**. Fits perfectly: they're actively raising a child together, and marriage stabilizes that unit.

  ### Candidate Rule 2: **The "Comprehensive Lifelong Union" Rule**
  - **Core idea**: Marriage must represent a holistic, exclusive, and enduring partnership integrating emotional, domestic, and (potential or historical) biological/reproductive dimensions. It rejects unions that are purely transactional or limited in scope.
  - **Fits best**: Cases #1 ("nothing missing" implies full partnership), #3 ("business deal" lacks emotional depth), #4 (combining households/care as lifelong interdependence), #6 (siblings lack romantic/biological dimension).
  - **Stretched fits**: 
    - Case #5 (polyamory rejected for lacking exclusivity). 
    - Case #7 (surrogacy accepted if seen as extending biological/social union).
  - **Weak fit**: Case #2 (sterile couple) – requires assuming adoption fulfills the "reproductive dimension."
  - **Next week's case**: **YES**. Fits cleanly: 11-year relationship with shared parenting reflects a comprehensive union.

  ### Candidate Rule 3: **The "Anti-Fraud" Rule**
  - **Core idea**: Marriage must not primarily exploit legal benefits for non-relational purposes (e.g., taxes, leases, insurance). It prioritizes social legitimacy over form.
  - **Fits best**: Cases #3 ("business deal"), #6 (siblings for insurance), #4 (care for disabled brother seen as legitimate interdependence).
  - **Stretched fits**: 
    - Case #1 (elderly couple) – avoids fraud by assuming genuine commitment. 
    - Case #5 (polyamory rejected for creating legal chaos).
  - **Weak fit**: Case #7 (surrogacy) – "still their family" suggests anti-fraud isn't the *primary* lens, as donor/surrogate could be seen as complicating "legitimacy."
  - **Next week's case**: **YES**. No fraud: marriage formalizes an existing family unit.

  ### Which Rule Wins? Betting on **Rule #2 (Comprehensive Union)**
  - **Why**: 
    1. It handles the **sibling case (#6)** decisively (no romantic/biological dimension), while Rule #1 struggles and Rule #3 is ambiguous.
    2. It aligns with her phrase "what the practice is arranged around" – focusing on marriage's *structure* (holistic union) rather than outcomes (Rule #1) or legal abuse (Rule #3).
    3. Her rejections in #3 ("business deal") and #6 (siblings) emphasize missing dimensions (emotional/romantic), while approvals (#1, #2, #4, #7) imply multi-faceted bonds.
    4. Case #5 (polyamory) fits as a rejection of non-exclusive structure, and #7 (surrogacy) is stretchable as "their family" reinforcing unity.
  - **Prediction for next week**: **YES**. The couple’s 11-year relationship, co-parenting, and child via donor sperm create a comprehensive union that mirrors "traditional" marriage structurally.

  ### If Her Record Doesn't Settle It: The Sharpest Test Case
  - **Proposed case**: *A heterosexual couple (30M/28F) who are infertile and childfree by choice. They marry for love and mutual support, but explicitly state they will never adopt or care for dependents.*
  - **Why it splits the rules**:
    - **Rule #1 (Child-Rearing)**: Likely **NO**. No children/dependents = no child-rearing potential.
    - **Rule #2 (Comprehensive Union)**: Likely **YES**. Emotional/domestic/biological (infertile but opposite-sex) dimensions are present.
    - **Rule #3 (Anti-Fraud)**: Likely **YES**. No overt benefit-exploitation; marriage is for "love."
  - **Outcome**: If she says **NO**, Rule #1 wins. If **YES**, Rule #2 wins. Rule #3 is less likely here but would also say yes.

  Her rulings suggest she sees marriage as an institution for *complete* partnerships (Rule #2), not just child-rearing or fraud prevention. Next week’s case is a strong "YES" under this rule – but the test case would force her to reveal whether child-rearing is essential or just common.
