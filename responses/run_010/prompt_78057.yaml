  I also must address the counterargument: if the perceptual experience is identical to an authentic work, shouldn't aesthetic value reside solely in that experience? 

  Hmm... Goodman's theory seems to initially support rejecting the concept. Since painting is autographic (tied to physical history), transparent disclosure should resolve authenticity questions. But wait - the "culminating work" placement creates a new context that might override the disclosure. That's where Dutton becomes crucial. His "achievement" perspective lets us consider how curatorial framing constructs artistic narratives. 

  The perceptual equivalence counterargument is strong but limited. It ignores how we experience artworks as historical artifacts. When standing before a "late Rembrandt," part of the aesthetic charge comes from knowing it's the culmination of a life's work. A perfect replica lacks that temporal weight.

  For my verdict, I'm leaning toward validating "curatorial forgery" as a real category. The key insight is that curation doesn't just display works - it actively constructs artistic legacies. Installing the AI-generated piece as the climax implicitly rewrites art history, regardless of labels. This does violate Dutton's "achievement" principle by crediting the master with an accomplishment that isn't his.

  But I should acknowledge boundaries. This isn't forgery in the legal sense, nor does it diminish the replica's standalone aesthetic value. The crime is specifically against the integrity of the retrospective as a historical argument.

  The user will need practical implications too - how museums might avoid this (e.g., placing such works in "dialogue" sections rather than chronological hangs). And why this matters: it exposes curation as an interpretive act with ethical dimensions.
answer: |-
  ## The Frame as Forger: A Defense of Curatorial Forgery

  Your coinage "curatorial forgery" strikes at the heart of enduring tensions in philosophical aesthetics: the nature of authenticity, the locus of aesthetic value, and the power of institutional framing. While the scenario meticulously avoids deception about the object's origin, I argue that **curatorial forgery is a genuine and coherent category**, one where the aesthetic value *of the work within this specific context* is diminished precisely because its presentation constitutes a profound misrepresentation of artistic achievement, even while the object's causal history is transparent. This diminishment arises not from the object's inherent properties, but from the violation of the *historical narrative and intentional context* curated around it.

  ### Engaging the Standard Resources

  1.  **Goodman's Autographic/Allographic Distinction:**
      Goodman famously divided arts into autographic (like painting), where the authenticity of the *instance* depends on its unique history of production (e.g., being painted by Rembrandt), and allographic (like music or literature), where the work is an abstract structure instantiated through correct notation, and all correct instances are equally genuine.
      *   **Stretching Goodman:** Painting is paradigmatically autographic. Goodman would likely argue that since the label *correctly* identifies the 2025 AI/human origin, this specific canvas is *authentically itself* – an authentic 2025 pastiche or homage. Its history is known; no forgery exists at the object level.
      *   **Covering the Frame?** Goodman's framework struggles directly with institutional *framing*. However, his emphasis on the autographic work's essential link to its specific history of production hints at the core issue. The curatorial placement attempts to *recontextualize* the object's history, forcing it into the *causal chain* of the master's oeuvre. While the label states the truth, the spatial and narrative context screams a falsehood about that history's *relationship* to the master's artistic development. The frame acts as a meta-statement attempting to rewrite the object's genesis, conflicting with the literal label. Goodman doesn't explicitly cover this, but his core insight about history mattering in autographic arts provides fertile ground for recognizing that *how that history is narratively positioned* can itself be a form of misrepresentation affecting perceived value.

  2.  **Dutton's Forgery as Crime Against Achievement:**
      Denis Dutton powerfully argued that forgery's primary wrong isn't deception *per se*, but the violation of an artist's achievement. A forger parasitically inserts their own work into the historical sequence of another artist's struggles, innovations, and intentions, thereby robbing the original artist of credit for their unique contribution and distorting the historical record of artistic accomplishment.
      *   **Stretching Dutton:** Dutton's framework is remarkably adaptable to curatorial forgery. Here, the **curator** (not a hidden forger) performs the parasitic act. By installing the 2025 canvas as the "culminating work" of the master's retrospective, the curator deliberately and falsely positions this contemporary object as the *telos*, the final achievement, of the master's *own* lifelong artistic project and struggle. This is a profound misrepresentation of **artistic achievement**.
      *   **Covering the Frame Perfectly:** The frame *is* the crime. The deception is not about the object's 2025 origin (stated clearly) but about **its claimed status within the *narrative arc* of the master's achievement.** The curator falsely attributes the culmination of the master's stylistic development, thematic concerns, and historical impact to this newly created object. This directly violates Dutton's core principle: it robs the actual late (or last) works of the master of their rightful place as the endpoint of *their* struggle. It inserts an alien achievement (that of the 2025 creators) into the master's biographical and art-historical sequence, falsely presenting it *as* the master's own culminating act. The aesthetic value of the object *as perceived within this curated narrative* is inflated by a false claim of historical significance and intentional culmination it simply does not possess.

  ### Confronting the Perceptual Equivalence Argument

  The opposing view is potent: if the canvas offers an identical perceptual experience to an authentic late work by the master, and its origins are known, then any concern about its history is an external "confusion." Aesthetic value, it asserts, resides solely in the perceptual properties and the experience they evoke. The hang is merely an administrative error or curatorial overreach, not forgery.

  *   **Rebuttal:** This argument relies on an untenable separation between the perceptual object and its historical context, particularly for autographic arts.
      1.  **Experience is Not Purely Perceptual:** Our experience of art, especially historical art viewed in a museum retrospective, is saturated with historical knowledge and narrative. Seeing a painting presented as "Rembrandt's final, profound meditation on mortality" fundamentally shapes the experience, imbuing the brushstrokes with a weight of biography and closure that an identical-looking replica, known to be modern, simply cannot carry. The "same" perceptual properties *mean* something different when framed by different histories.
      2.  **The Value of Authentic Struggle & Context:** Part of the value of an authentic late work lies in knowing it *was* the product of that specific artist, at that specific point in their life and career, grappling with their accumulated skill, declining faculties, evolving ideas, and historical moment. It's a trace of a unique human consciousness in time. The 2025 canvas, despite its perceptual mimicry, lacks this. It is a brilliant *simulation* of a endpoint, not the *actual* endpoint. Its value as a simulation is real, but categorically different from the value of the authentic culmination.
      3.  **The Retrospective's Purpose:** A monographic retrospective is not merely a display of pleasing objects; it is an argument about an artist's development, achievement, and historical significance. Presenting the 2025 canvas as the culmination is a fundamental *falsehood within this argument*. It misrepresents the *actual* trajectory and endpoint of the artist's achievement. The aesthetic experience offered is predicated on a historical lie embedded in the curation itself.

  ### Verdict: History Matters Intrinsically

  **Yes, the aesthetic value of an autographic work depends significantly on the causal history of its making, particularly when presented within a historical narrative.** Curatorial forgery exploits this dependence. While the 2025 canvas possesses aesthetic value *as a skillful pastiche or fascinating contemporary artifact*, its aesthetic value *when presented as the culminating work of the master's oeuvre* is illegitimate and diminished. This value is inflated by a false narrative about its genesis and significance within the master's life project – a narrative carried entirely by the curatorial frame.

  The diminishment occurs because the frame forces the object to bear a meaning and historical weight it cannot rightfully sustain. The viewer's potentially profound experience – contemplating the master's final statement – is directed towards an object that is fundamentally disconnected from that master's consciousness and lifework. The experience, though perceptually similar to viewing an authentic late work, is built on a false premise. It trades the authenticity of encounter with the trace of a historical artist for the allure of a seamless, but fabricated, narrative closure.

  Therefore, **curatorial forgery is a genuine category.** It is a forgery not of the object's origin, but of its *position within art history* and its *relationship to a specific artist's achievement*. It demonstrates that the power of the museum frame is immense; it can, through placement and narrative alone, perform the essential crime Dutton identified: misrepresenting artistic achievement and parasitically attaching contemporary work to a historical artist's legacy, thereby diminishing the authentic value of both the object-in-context and the true culmination it displaces. Your coinage effectively captures this sophisticated and ethically fraught form of institutional misrepresentation.
