  | Bem (2011) precognition & failed replications                               | Setback             | Empirical fallback; scientific legitimacy                  | High-profile failure despite strict methods confirms Sidgwick’s fear: even "gold standard" experiments collapse under scrutiny. This weakens SPR’s core project of legitimizing psi via science.          | Low                 |  
  | Significance testing’s inability to confirm the null                        | Methods gain only   | Scientific rigor; evidence accumulation                    | Sidgwick valued empirical discipline but needed decisive answers. This epistemological limit would frustrate him—endless ambiguity doesn’t resolve the dualism.                                        | High                |  
  | Preregistration & decline effect                                            | Methods gain only   | Scientific rigor; mitigating bias                          | These address his concerns about researcher bias, but if applied only to null results (e.g., in survival studies), they deepen pessimism by "locking in" failures.                                      | Medium              |  
  | Triple-blinded mediumship protocols                                         | Methods gain only   | Evidence for survival; avoiding fraud                      | Enhanced rigor is laudable but null results (e.g., no veridical afterlife messages) undermine his hope. Better hygiene without positive evidence is inert for his project.                              | Low                 |  
  | Cardiac arrest studies (e.g., AWARE) with hidden targets                    | Setback             | Evidence for survival; empirical fallback                  | Null results for "out-of-body" perception (e.g., no ceiling-target verification) directly counter Sidgwick’s need for proof of consciousness beyond death. A major empirical blow.                     | Medium              |  
  | Princeton RNG & global spinoff (e.g., GCP)                                  | No change           | Anomalous psi; cosmic order                                | Global correlations in RNG data might intrigue him as hints of cosmic unity, but they’re unrelated to *moral* order or survival. Distracts from his ethical aim.                                        | High                |  
  | SPR hallucination census (1894) redux (big-data survey)                     | Setback             | Spontaneous evidence; prevalence of apparitions            | Modern surveys show a drastic drop in hallucination reports (e.g., secularization reduces willingness/interpretation). Sidgwick saw the 1894 census as his *best* evidence—this decline reverses progress. | Low                 |  

  ### Key Implications for the Dualism of Practical Reason  
  Sidgwick’s ethical system required **post-mortem justice** to reconcile rational self-interest ("prudence") with morality. His psychical research sought empirical proof of this cosmic framework. Modern developments would deepen his despair:  
  1. **Methodological gains** (preregistration, blinding) eliminate past loopholes but yield null results, making survival *less* plausible.  
  2. **Cultural shifts** (e.g., secularization reducing hallucination reports) undermine the "natural" evidence he trusted.  
  3. **Replication crises** confirm that apparent anomalies were artifacts—not foundations for ethics.  

  As he wrote in 1889: *"I have done all I could... the results, to me at least, have been on the whole negative."* Forty years of modern psi research would intensify this conclusion, leaving the dualism irresolvable.  

