  - **Low Extrapolation**: Directly tied to his writings (e.g., *Methods of Ethics* on the dualism; letters/SPR addresses on survival evidence).  
  - **Crucial Quote**: *"If we find that the arguments for an order of things which reconciles duty and self-interest... are altogether invalid, I do not see how we can avoid the admission that the world is fundamentally irrational."* (Sidgwick to J. Symonds, 1889). Modern research would force this admission.  

