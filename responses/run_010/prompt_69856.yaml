  ### Bottom Line  
  Sidgwick would be **less hopeful** about resolving the dualism of practical reason than in 1900. Despite methodological refinements, the consistent failure to produce robust, replicable evidence for survival—coupled with secularization’s erosion of spontaneous paranormal reports—would reinforce his skepticism about empirically proving a morally ordered cosmos.  

