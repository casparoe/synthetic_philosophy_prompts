prompt: |-
  Two philosophers have argued past each other for years about doing and allowing. One holds that the difference between bringing a harm about and merely failing to prevent it marks a real, non-derivative moral distinction. The other holds that the distinction only ever tracks variables that can be pried apart from it — cost to the agent, the agent's prior involvement, whether a threat is already underway, and how many people stand to suffer if nothing is done — and that once these are matched, no moral work is left for it to do.

  Draft the document this collaboration should yield. Open with numbered claims both can sign: about what explanatory work the distinction is being asked to do, about which variables the stock examples fail to control for, and about at least one class of case — the withdrawal of treatment at a patient's request, or double prevention, where one thwarts someone else's thwarting of a good — in which both agree that the doing/allowing description is itself unclear. Then set out the residual disagreements in wording each side would accept as a fair statement of its own view. Then give the cruxes: the sub-questions such that settling one would actually move someone, each paired with a case or case-pair both agree bears on it, and with each side's prediction recorded in advance about what the other will say. If some of the dispute is about the word "doing" rather than about morality, identify which part and rewrite it so that only the substantive remainder is left. Close with what each side would accept as counting against its own position, and whether any such evidence is in fact obtainable.
reasoning: |-
  We are drafting a collaborative document for two philosophers who have been arguing about the moral distinction between doing and allowing harm. The goal is to outline agreed-upon points, residual disagreements, and cruxes for future discussion.

  Structure:
  1. Numbered claims both can sign (agreed upon).
  2. Residual disagreements (each side's view in their own words).
  3. Cruxes (sub-questions, case pairs, and predictions).
  4. Clarification on whether part of the dispute is about the word "doing" and rewrite to remove that if necessary.
  5. What each side would accept as counting against their position and whether such evidence is obtainable.

  Let's break it down:

  ### 1. Numbered Claims Both Can Sign:

  We need claims about:
  - What explanatory work the distinction is being asked to do.
  - Which variables the stock examples fail to control for.
  - At least one class of case where the doing/allowing description is unclear (e.g., withdrawal of treatment or double prevention).

  Agreed Claims:

  1. The moral distinction between doing and allowing is often invoked to explain why, typically, it is more seriously wrong to bring about a harm than to merely fail to prevent it.

  2. Stock examples used to illustrate the doing/allowing distinction (e.g., pushing someone into a path of a threat vs. failing to pull them out) often fail to control for one or more of the following variables:
     a. The cost to the agent (including effort, risk, and opportunity cost).
     b. The agent's prior involvement (e.g., whether the agent created the threat or had a special responsibility).
     c. Whether the threat is already underway or not.
     d. The number of people affected (e.g., whether one is saving many by sacrificing one).

  3. There are cases where it is unclear whether an action should be classified as doing or allowing, and in such cases, the moral evaluation is also contested. Two such classes are:
     a. Withdrawal of life-sustaining treatment at a competent patient's request: Is the doctor allowing the patient to die (by ceasing treatment) or doing something that causes death?
     b. Double prevention: When A prevents B from preventing a harm to C, so that the harm then occurs. Is A doing harm to C or merely allowing it?

  ### 2. Residual Disagreements:

  Now, we state the core of each side's view in wording they would accept.

  - **First Philosopher (Defender of the Real Distinction):** 
    "I hold that the distinction between doing and allowing harm is a fundamental and non-derivative moral distinction. Even when we control for variables such as cost, prior involvement, threat status, and numbers affected, there remains a moral difference that is explained precisely by whether the agent is the one bringing about the harm versus merely failing to prevent it. This distinction is not reducible to other factors and does real moral work in our judgments."

  - **Second Philosopher (Reductionist):** 
    "I hold that the doing/allowing distinction is only a placeholder for a cluster of other morally relevant factors (like cost, prior involvement, etc.). When these factors are fully accounted for, the distinction itself does no additional moral work. The apparent moral difference in cases is entirely explained by these other variables, and there is no residual moral difference attributable to doing versus allowing per se."

  ### 3. The Cruxes:

  We need sub-questions that, if settled, would move the debate. For each, we pair a case or case-pair that both agree bears on the sub-question. We also record each side's prediction about what the other will say.

  **Crux 1: Does the doing/allowing distinction have moral weight independent of cost to the agent?**
     - Case Pair: 
       (A) Doing: You push a person in front of a train to save five people tied to the track (cost to you: none, but you actively cause death).
       (B) Allowing: You are at a switch and can divert the train to a side track where it will kill one person instead of five, but you choose not to flip the switch (cost to you: none, and you merely allow the five to die by inaction).
     - Both agree that in (A) the cost is zero and in (B) the cost is zero. But in (A) you actively cause death, in (B) you fail to prevent death.
     - Prediction by Defender: "The Reductionist will say that both are equally wrong (or permissibly wrong) because cost is zero and numbers are the same (one dies in both). But I think (A) is worse because it's doing harm."
     - Prediction by Reductionist: "The Defender will say (A) is worse because it's doing. But I think that if we control for all other factors (cost, numbers, etc.), they are equally wrong (or permissible)."

  **Crux 2: Does prior involvement (e.g., creating the threat) affect the moral status of doing vs. allowing?**
     - Case Pair:
       (A) Doing with prior involvement: You created a trap that will kill a person unless you disarm it. You choose not to disarm it (thus allowing the death) because disarming would be costly.
       (B) Allowing without prior involvement: You see a trap set by someone else that will kill a person, and you can disarm it at the same cost, but you choose not to.
     - Both agree that in (A) you have prior involvement and in (B) you don't.
     - Defender: "In (A), because of prior involvement, allowing might be as bad as doing. But without prior involvement, allowing is less bad. However, in a case without prior involvement and with the same cost, doing is still worse than allowing."
     - Reductionist: "The moral difference between (A) and (B) is entirely due to prior involvement. Without prior involvement, allowing is less bad, but that's because of the prior involvement factor, not because it's allowing per se. In a pure doing vs. allowing case without prior involvement, if cost and other factors are the same, there is no moral difference."

  **Crux 3: Does the distinction hold in cases of double prevention?**
     - Case: 
       A villain is about to press a button that will save a victim (by disarming a bomb). You prevent the villain from pressing the button, so the bomb explodes and the victim dies. Are you doing harm or allowing harm?
     - Both agree that the doing/allowing description is unclear here.
     - Defender: "I might say that double prevention is a form of doing because you are intervening to remove a prevention. But I admit the classification is tricky and might depend on how we describe the sequence. However, the moral evaluation should follow the doing/allowing classification once we clarify it."
     - Reductionist: "This case shows that the doing/allowing distinction is not clear-cut. The moral evaluation should depend on the other factors (e.g., your intention, the cost of not acting, etc.) and not on forcing it into doing or allowing."

  ### 4. Dispute about the word "doing":

  We must identify if part of the dispute is about the word "doing" rather than morality.

  - The Defender might say: The term "doing" is meant to capture active causation, which is morally significant.
  - The Reductionist might say: The term "doing" is ambiguous and often used in a way that conflates with other factors (like prior involvement or direct causation).

  Rewrite to remove verbal dispute:

  - Let us define:
    - "Doing harm": An action that initiates a causal sequence leading to harm or that actively intervenes to cause harm.
    - "Allowing harm": An omission that fails to prevent a harm that would otherwise occur without the agent's intervention.

  But the Reductionist might still argue that the moral difference isn't in the definition but in the factors we've listed.

  So the substantive remainder is: Is there a moral difference between doing and allowing (as defined above) when all other factors (cost, prior involvement, etc.) are held constant?

  ### 5. What each side would accept as counting against their position:

  - **Defender:** "I would accept as counting against my position a case pair in which, when all other factors (cost, prior involvement, threat status, numbers) are held constant, and it is clear that one is doing and the other allowing, but there is no moral difference (or the allowing is judged worse). However, I predict that such a case pair does not exist or that if it does, it will be because the doing/allowing classification is not clear."

  - **Reductionist:** "I would accept as counting against my position a case pair that shows a consistent moral difference between doing and allowing even when all other factors are held constant. However, I argue that in every such case, we can find that one of the other factors is not perfectly matched, or the classification is unclear, so such a case pair is not obtainable."

  Now, we put it all together.

  ---

  **Collaborative Document on Doing and Allowing**

  **1. Agreed Claims:**

  1. The doing/allowing distinction is often invoked to explain a perceived moral difference: typically, it is more seriously wrong to bring about a harm (doing) than to fail to prevent it (allowing).

  2. Many stock examples used to illustrate this distinction (e.g., pushing someone vs. not pulling them from danger) fail to adequately control for at least one of the following variables:
     a. The cost to the agent (in terms of effort, risk, resources, or opportunity cost).
     b. The agent's prior involvement (e.g., whether the agent created the threat or had a special responsibility to the victim).
     c. Whether the threat was already underway or required the agent to initiate it.
     d. The number of people affected by the agent's choice.

  3. There are classes of cases in which it is unclear whether an action should be described as doing or allowing, and consequently, the moral evaluation is also unclear. We agree on two such classes:
     a. **Withdrawal of treatment**: When a doctor, at a competent patient's request, withdraws life-sustaining treatment, it is debatable whether this is allowing the patient to die (by ceasing to interfere with the natural course of the disease) or doing something that causes death (by removing the barrier to death).
     b. **Double prevention**: When an agent prevents another agent from preventing a harm (e.g., you block someone who is trying to defuse a bomb), it is unclear whether this counts as doing harm (by actively intervening to ensure the bomb explodes) or allowing harm (by failing to prevent the bomb from exploding, given that you only removed a preventer).

  **2. Residual Disagreements:**

  - **Defender of the Real Distinction**: 
    "I maintain that the doing/allowing distinction marks a real, non-derivative moral difference. Even when we control for cost, prior involvement, threat status, and numbers, the fact that an agent actively brings about a harm (doing) is morally worse than merely failing to prevent it (allowing). This distinction is not reducible to other factors and does independent moral work."

  - **Reductionist**: 
    "I maintain that the doing/allowing distinction is entirely derivative. It only tracks other morally relevant variables (such as cost, prior involvement, etc.). When these variables are held constant, there is no moral difference between doing and allowing. The distinction itself does no independent moral work."

  **3. Cruxes of the Dispute:**

  We identify the following sub-questions, each with a case or case-pair that both agree is relevant. We also record each side's prediction of what the other will say.

  **Crux 1: Does the doing/allowing distinction have moral weight when cost to the agent is zero?**
     - Case Pair:
       - (A) Doing: You push one innocent person in front of a train to save five people on the track. This action requires no cost to you (e.g., no risk, no effort beyond the minimal).
       - (B) Allowing: You are at a switch that can divert the train from killing five people to killing one person. You choose not to flip the switch, which also requires no cost to you.
     - Both agree that in both cases the cost is zero and one person dies instead of five.
     - Defender's Prediction of Reductionist: "The Reductionist will say that both (A) and (B) are equally wrong (or equally permissible) because the cost is zero and the outcome is the same (one dies, five saved)."
     - Reductionist's Prediction of Defender: "The Defender will say that (A) is morally worse than (B) because (A) is doing harm and (B) is allowing harm."

  **Crux 2: Does prior involvement eliminate the moral difference between doing and allowing?**
     - Case Pair:
       - (A) Prior involvement and allowing: You set a trap that will kill a person. You can disarm it at a small cost (e.g., a minute of your time). You choose not to disarm it, so the person dies.
       - (B) No prior involvement and allowing: You come across a trap set by someone else that will kill a person. You can disarm it at the same small cost, but you choose not to.
     - Both agree that in (A) you have prior involvement (you created the trap) and in (B) you do not.
     - Defender's Prediction of Reductionist: "The Reductionist will say that (A) and (B) are morally different because of prior involvement, and that this factor explains why (A) is worse. But they will deny that doing vs. allowing per se is doing any work."
     - Reductionist's Prediction of Defender: "The Defender will agree that (A) is worse than (B) because of prior involvement, but they will also maintain that in a case without prior involvement and with the same cost, doing harm is still worse than allowing harm."

  **Crux 3: How should we morally evaluate double prevention?**
     - Case: 
       A villain is about to press a button that would save a victim (by disarming a bomb). You prevent the villain from pressing the button (e.g., by locking the door to the control room). The bomb explodes and the victim dies.
     - Both agree that it is unclear whether to classify this as doing or allowing.
     - Defender: "I might argue that double prevention is a form of doing harm because you are actively removing a prevention. Therefore, it should be treated as morally equivalent to doing harm. However, the classification is complex and might be context-dependent."
     - Reductionist: "This case illustrates the ambiguity of the doing/allowing distinction. The moral evaluation should depend on factors such as your intention and the cost of acting, not on whether we force it into the doing or allowing category. The distinction itself is not doing the moral work."

  **4. Clarification on Terminology:**

  Part of the dispute may be verbal, concerning how broadly we define "doing" and "allowing." To minimize this, we define:

  - "Doing harm": An action that initiates a new causal sequence leading to harm or actively intervenes in an existing sequence to cause harm.
  - "Allowing harm": An omission that fails to prevent a harm that would occur without the agent's intervention.

  The substantive question remains: Is there a moral difference between doing and allowing (as defined above) that persists when all other factors (cost, prior involvement, threat status, numbers) are held constant?

  **5. What Would Count Against Each Position?**

  - **Defender of the Real Distinction**: 
    "I would accept as evidence against my position a case pair that clearly and uncontroversially classifies one instance as doing and the other as allowing, with all other factors (cost, prior involvement, etc.) held constant, and yet there is no moral difference between them (or the allowing is judged worse). I suspect such a case pair is not possible to construct without the classification being disputed or without an uncontrolled variable."

  - **Reductionist**: 
    "I would accept as evidence against my position a case pair that clearly and uncontroversially classifies one as doing and the other as allowing, with all other factors held constant, and in which there is a consistent and strong moral intuition that the doing is worse. I contend that in every attempt to construct such a case, either the classification is unclear or an uncontrolled variable explains the moral difference, so this evidence is not obtainable."

  We, the undersigned, agree to the above as a fair representation of our agreed points, disagreements, and the cruxes of our dispute.

