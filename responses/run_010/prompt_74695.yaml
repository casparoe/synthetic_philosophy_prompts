answer: |-
  ### Collaborative Document: The Moral Distinction Between Doing and Allowing Harm

  #### **I. Numbered Claims Both Signatories Agree On**
  1. **Explanatory Work Requested of the Distinction**:  
     The doing/allowing distinction is asked to explain why, in paradigmatic cases, actively causing harm (e.g., pushing someone into water to drown) is typically judged more morally wrongful than merely failing to prevent the same harm (e.g., refusing to throw a lifebuoy to a drowning person). This distinction purports to ground a non-contingent moral asymmetry.

  2. **Variables Uncontrolled in Stock Examples**:  
     Standard cases used to illustrate the distinction (e.g., trolley problems, drowning scenarios) systematically fail to isolate the doing/allowing factor from confounding variables, including:  
     - **Cost to the agent**: Physical/psychological effort, risk, or resources required to act.  
     - **Prior involvement**: Whether the agent created the threat or assumed responsibility (e.g., a lifeguard vs. a passerby).  
     - **Threat status**: Whether the harm is already in motion ("ongoing threat") or requires the agent to initiate it ("new threat").  
     - **Scale effects**: The number of people affected if the agent does nothing.  

  3. **Cases Where the Doing/Allowing Description Is Unclear**:  
     Both agree that the distinction is ambiguous or inapplicable in at least two classes of cases:  
     - **Withdrawal of treatment at a patient’s request**: When a doctor removes life support from a consenting terminal patient, it is unclear whether this constitutes "doing" harm (actively causing death) or "allowing" harm (ceasing to impede a natural process).  
     - **Double prevention**: When Agent A thwarts Agent B’s attempt to prevent harm (e.g., disabling a security system that would have stopped a theft), it is indeterminate whether A "does" harm (by intervening) or "allows" it (by failing to preserve B’s preventative action).  

  ---

  #### **II. Residual Disagreements in Each Side’s Own Wording**  
  - **Defender of the Real Distinction**:  
    "The doing/allowing difference is a fundamental, non-derivative moral feature. Even when variables like cost, prior involvement, and threat status are matched, doing harm is intrinsically harder to justify than allowing harm. This asymmetry reflects a deep ethical principle about agency and causation: actively imposing harm violates prohibitions against causing evil, whereas omitting to prevent it does not, barring special obligations."  

  - **Reductionist**:  
    "The distinction is purely derivative. It indirectly tracks variables like cost, prior involvement, and threat status but has no independent moral weight. When these variables are controlled for, no moral difference remains between doing and allowing. What matters is the net harm, the agent’s role in the causal sequence, and contextual factors—not the doing/allowing label itself."  

  ---

  #### **III. Cruxes: Sub-Questions, Cases, and Predictions**  
  Each crux pairs a sub-question with a case both agree is probative. Both sides pre-commit to predictions about the other’s response.  

  1. **Sub-Question**: When all non-distinction variables are identical, does classifying an act as "doing" versus "allowing" *itself* affect permissibility?  
     - **Case Pair**:  
       - *Doing*: You flip a switch to divert a train, killing one worker on the tracks to save five trapped in a tunnel (threat already ongoing).  
       - *Allowing*: You omit to flip a switch that would save one worker from a train (killing them) to save five others (threat ongoing; switch-flipping costless).  
       *Variables controlled*: Cost (zero), prior involvement (none), threat status (ongoing), scale (5 saved/1 lost).  
     - **Defender’s Prediction of Reductionist**: "You will say both acts are equally wrong (or permissible) because the distinction is inert."  
     - **Reductionist’s Prediction of Defender**: "You will say flipping the switch (doing) is worse, even with variables matched."  

  2. **Sub-Question**: Does prior involvement *eliminate* the moral difference between doing and allowing?  
     - **Case**: You (a doctor) accidentally poison a patient. You can either:  
       - *Do harm*: Inject a lethal dose to end their suffering quickly.  
       - *Allow harm*: Withhold the antidote you possess, letting them die slowly.  
       *Variables controlled*: Cost (minimal), threat status (ongoing), scale (one death).  
     - **Defender’s Prediction of Reductionist**: "You will say injecting (doing) is no worse than withholding (allowing) because prior involvement dominates."  
     - **Reductionist’s Prediction of Defender**: "You will say injecting remains worse, despite prior involvement."  

  3. **Sub-Question**: In double prevention, does moral judgment track the doing/allowing ambiguity or other factors?  
     - **Case**: A villain will disarm a bomb unless you lock him in a room. You lock him in, preventing disarming, and the bomb kills ten.  
       *Variables controlled*: Cost (low), prior involvement (none), threat status (ongoing).  
     - **Defender’s Prediction of Reductionist**: "You will judge this as permissible/impermissible based on variables like intention, not the doing/allowing confusion."  
     - **Reductionist’s Prediction of Defender**: "You will insist locking the door is 'doing' harm and thus harder to justify."  

  ---

  #### **IV. Disentangling Verbal and Substantive Disputes**  
  - **Verbal Dispute Identified**:  
    Part of the disagreement concerns the *definition* of "doing." The Defender often construes "doing" as any physically direct causal intervention (e.g., flipping a switch), while the Reductionist views it as a proxy for variables like "introducing a new threat."  
  - **Rewritten Substantive Dispute**:  
    "Is there a moral asymmetry between (a) acts that *initiate or amplify* a causal sequence leading to harm, and (b) omissions that *fail to interrupt* an independent sequence—when cost, prior involvement, threat status, and scale are identical?"  

  ---

  #### **V. What Counts as Evidence Against Each Position?**  
  - **Defender’s Falsifiability Condition**:  
    "My view is falsified if a case-pair emerges where:  
    (i) All non-distinction variables are perfectly matched;  
    (ii) One act is uncontroversially 'doing' and the other 'allowing';  
    (iii) No moral difference is observed (e.g., both are equally permissible).  
    Such evidence is obtainable *in principle* but may be empirically elusive due to persistent variable-confounding."  

  - **Reductionist’s Falsifiability Condition**:  
    "My view is falsified if a case-pair emerges where:  
    (i) All variables are matched;  
    (ii) The 'doing' act is consistently judged *significantly* harder to justify than the 'allowing' act;  
    (iii) This asymmetry persists even when subjects are educated about variable-matching.  
    This evidence is obtainable via controlled experiments (e.g., moral psychology studies) but currently unobserved."  

  ---  
  **Signed**,  
  [Defender’s Name]  
  [Reductionist’s Name]  

  ---  
  **Document Notes**:  
  This draft isolates points of agreement, clarifies irreconcilable differences, and specifies testable conditions for resolving the dispute. By pre-committing to what would falsify their views, both philosophers bound the scope of future debate to tractable empirical and conceptual work.
