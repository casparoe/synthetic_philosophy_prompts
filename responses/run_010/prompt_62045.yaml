prompt: |-
  ok so I'm a backend engineer, zero philosophy background, and I've been in a rabbit hole for like three weeks and I want to check whether I actually understand the thing by making you write a joke about it.

  setup: somewhere online I read the argument that individual consumer choices don't do anything. buying one less chicken at the grocery store doesn't save a chicken, because the store orders in huge batches and your one purchase basically never trips the threshhold, so the animal gets raised and killed anyway. then I read the comeback, which was roughly: sure, but your purchase raises the *probability* that some batch gets ordered by a tiny amount, so your expected contribution isn't zero, it's one ten-thousandth of a chicken, and you have to act on expected value. then the comeback to that, which was something like: fine, but that logic makes basically every individual act both infinitely unimportant and infinitely important depending on what you multiply it by, and also you're ignoring that the harm would have happened anyway through somebody else. and there was a whole separate thing about cases where two people each would have caused the harm on their own, so neither of them caused it.

  what I noticed sitting there is that this is EXACTLY the fight my team has every quarter about marketing attribution. did the ad cause the sale? last-touch says yes, the Shapley model says everyone gets a fractional share, and the guy who doesn't believe in attribution says nobody clicked anything, they were going to buy it regardless.

  so: write me a parody internal engineering design doc — an RFC — for a service that computes each user's personal causal contribution to global harms and writes it to their account as a number.

  format, please follow it exactly:
  - the RFC itself, with a status line at the top, an author, and these sections in this order: Motivation (~120 words), Goals and Non-Goals (~100), Proposed Architecture (~200), Data Model (~120), Edge Cases (~300, this is the heart of it), Rollout Plan (~150), Open Questions (~100).
  - then one section after the RFC titled "Where the jokes are load-bearing" (~200 words) mapping each edge case to the real philosophical move its standing in for. this is the only place you're allowed to explain anything.

  voice and venue: deadpan internal doc at a large tech company, enormous confidence about quantities that cannot possibly be computed, lots of internal jargon. never break character inside the RFC, no winking at the reader, no footnote that translates the philosophy.

  constraints:
  - every edge case has to be a real objection from the actual debate restated in engineering terms. don't invent soft fake ones. I want the batching/threshold problem, the expected-value reply and the float-precision nightmare it creates, harms that would have happened anyway via another user, the two-independent-causes case where neither is the cause, offsetting a harm you already committed with a later good action, and the fact that there's no principled way to say which purchase in a batch was the one that did it.
  - treat the offsetting case like a compensating transaction in a saga, complete with an idempotency key so nobody gets absolved twice for the same flight.
  - whether the service returns exactly 0 or a tiny nonzero value should be the unresolved thing that the entire Rollout Plan quietly depends on.
  - include at least one quoted review comment from an invented internal reviewer — some "causal inference guild" person — who objects on principled grounds and gets steamrolled.
  - funny to someone who's read the philosophy, readable to a teammate who hasn't. if a joke only fully lands when you know the underlying argument, keep it anyway, but make the surface level work too.
  - the target is the practice of quantifying personal moral impact, plus the "nothing you do matters" reply to it. no real people, no real companies, don't name any brand.

  around 1100-1300 words total, don't pad it out.
