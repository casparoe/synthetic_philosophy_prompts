   - expected-value reply and the float-precision nightmare (tiny fractional contributions, leading to rounding issues)
   - harms that would have happened anyway via another user (if you don't buy the chicken, someone else would have)
   - two-independent-causes case (two people each would have caused the harm on their own, so neither caused it)
   - offsetting a harm with a good action (like a compensating transaction in a saga, with idempotency key)
   - no principled way to assign which purchase in a batch was the one that triggered the order (attribution ambiguity)

   Also include a quoted review comment from a "causal inference guild" person.

   The Rollout Plan should quietly depend on whether we return 0 or a tiny nonzero.

   Voice: deadpan, corporate jargon, overconfident about uncomputable things.

   After the RFC, "Where the jokes are load-bearing" section explains each edge case's philosophical counterpart.

   Let's structure accordingly.

   Note: We are writing an RFC for a service called, say, "Causal Attribution Service" (CAS). The number written to the user's account is their "harm footprint".

   We'll create:
   - Status: Draft
   - Author: Some Engineer

   Sections:

   1. Motivation: Why we need this service? (120 words)
      - Address the demand for personal accountability metrics in sustainability and ethical consumption.
      - Current methods (like carbon calculators) are naive and don't account for marginal causation.

   2. Goals and Non-Goals: (100 words)
      - Goals: Compute per-user causal contribution to global harms (e.g., animal suffering, carbon emissions) with fractional precision.
      - Non-Goals: Assigning blame, influencing user behavior (that's for downstream services).

   3. Proposed Architecture: (200 words)
      - Describe components: Event Ingestion (user actions), Batch Event Processor (for batching like chicken orders), Attribution Engine (using Shapley-like model), Transactional Offset Handler (for offsetting), and the User Harm Ledger.
      - Use Kafka, Spark, and a ledger database.

   4. Data Model: (120 words)
      - Tables: UserHarmLedger (user_id, harm_type, amount, txn_id, offset_txn_id, ...), EventLog, BatchThresholds, etc.

   5. Edge Cases: (300 words) - The heart. List and address:
      a) Batch Thresholds: When a user's action is part of a batch (e.g., one chicken purchase) that doesn't cross an ordering threshold.
      b) Fractional Attribution: How we assign tiny fractions (e.g., 1/10000 of a chicken) and avoid float underflow.
      c) Would-Have-Happened-Anyway: If the harm would have occurred regardless (another user would have bought the chicken).
      d) Two Independent Causes: Two users each would have independently triggered the batch, so the harm isn't attributable to either? (Neither is the cause.)
      e) Offsetting: A user does a good deed (e.g., plants a tree) to offset a harm. Handle as a compensating transaction with idempotency key.
      f) Ambiguous Trigger: In a batch, which specific purchase caused the threshold to be crossed? (We use a random selection? Shapley value?)

   6. Rollout Plan: (150 words)
      - Phase 1: Compute for a single harm type (e.g., chicken consumption) in one region.
      - Phase 2: Expand to other harms. We'll start by returning non-zero values, but have a feature flag to return zero in cases of underflow.

   7. Open Questions: (100 words)
      - Should we return exactly zero for contributions below a certain epsilon? (Affects user perception and downstream services.)
      - How to handle harms that are inherently non-linear (tipping points)?

   Then, the explanation section: "Where the jokes are load-bearing" (200 words)
      - Map each edge case to the philosophical argument it represents.

   We also need a quoted review comment. Let's put it in the Edge Cases section. The reviewer (from the "causal inference guild") objects on principled grounds, and we dismiss it.

   Example quote: 
     Reviewer: "The proposed fractional attribution model fails to account for the fundamental problem of preemption: if the harm would have occurred without the user, then their marginal contribution is zero. This is not a rounding error but a logical necessity."
     Response: We acknowledge the concern but note that our probabilistic model (using expected value) captures the user's influence on the likelihood of harm, which is non-zero. We'll proceed with fractional attribution.

   Now, let's write the RFC.
answer: |-
  ### RFC: Personal Causal Attribution Service (PCAS)  
  **Status**: Draft  
  **Author**: J. Smith (Backend Infra, Team Causality)  

  #### Motivation  
  Current user-facing "ethical impact" dashboards (e.g., CarbonLedger™) rely on naive multipliers (e.g., "1 flight = 0.2 dead penguins"). This ignores marginal causation: individual actions rarely trigger immediate real-world outcomes due to batching (supply chains), thresholds (inventory restocks), and parallel actors. PCAS quantifies a user’s *true* fractional contribution to global harms (deforestation, factory farming, etc.) via probabilistic counterfactuals. Without this, users cannot optimize for absolution—er, accountability—in our upcoming VirtuePoints™ loyalty program.  

  #### Goals and Non-Goals  
  **Goals**:  
  - Compute per-user, per-action causal contribution as a float (e.g., "0.000314 dead chickens").  
  - Support real-time offsetting (e.g., "user plants tree to negate 0.5 kg CO₂").  
  - Scale to 1B+ daily events.  
  **Non-Goals**:  
  - Assigning blame (send cease-and-desists to high-scoring users).  
  - Modeling non-linear tipping points (e.g., "user #1,000,000 triggers ecosystem collapse").  

  #### Proposed Architecture  
  ![PCAS Architecture](mermaid-diagram-url-here)  
  Events (e.g., `user_bought_chicken`) ingested via Kafka. **Attribution Engine** uses:  
  1. **Threshold Processor**: Models batch-trigger logic (e.g., grocer reorders at 100 units; assigns 1/100th harm per purchase until threshold met).  
  2. **Expected Value Calculator**: Converts discrete actions to fractional harm probabilities (e.g., 1 purchase = 1/10,000 chance of triggering batch).  
  3. **Offset Handler**: Saga-pattern compensator; voids harm via idempotent "good" events (e.g., `user_funded_solar_panel`).  
  Output written to **Harm Ledger** (Cassandra). Dashboards pull from ledger via GraphQL.  

  #### Data Model  
  **`user_harm_ledger` Table**:  
  ```  
  user_id   | harm_type      | amount     | txn_id               | offset_txn_id  
  -------------------------------------------------------------------------------  
  u123      | chicken_death  | 0.000314   | tx_a1b2              | tx_solar_xy  
  u456      | co2_emissions  | -0.000002  | tx_flight_ab         | NULL  
  ```  
  - `amount`: Float (±). Precision: 128-bit decimals to avoid underflow.  
  - `txn_id`: UUID for harm event (e.g., flight booking).  
  - `offset_txn_id`: UUID linking to compensating action (prevents double-negation).  

  #### Edge Cases  
  1. **Threshold Ambiguity**:  
     - *Issue*: Grocer reorders chickens at exactly 100 units. User #100’s purchase triggers shipment, but harm is shared equally (0.01) among all 100. Why not assign 1.0 to #100?  
     - *Fix*: Allocate fractional blame uniformly. Statistically, user #1 had equal likelihood of being the "trigger."  

  2. **Float Underflow**:  
     - *Issue*: Expected value of one chicken purchase = 1/10,000. After 100K users, ledger writes 1e-5 values. Downstream systems (billing) truncate to zero.  
     - *Fix*: Store as scientific notation strings. Marketing will rebrand near-zero scores as "statistically heroic."  

  3. **Preempted Harm**:  
     - *Issue*: User skips flight UA001. Harm = -0.2 penguins? But if UA001 flew anyway (filled seat), net harm unchanged.  
     - *Fix*: Only assign "savings" if seat stayed empty. Query airline overbooking API post-flight.  

  4. **Double-Cause Paradox**:  
     - *Issue*: Two users *each* would’ve triggered a deforestation batch alone. Batch size: 50. User A buys unit #50 (triggers shipment). User B buys #51. Who caused harm?  
     - *Fix*: Shapley value allocation. User A gets 1/50, User B gets 0 (harm already inevitable).  

  5. **Offset Idempotency**:  
     - *Issue*: User offsets flight harm by planting trees. Later, system discovers flight was canceled. Without idempotency, user nets "negative" harm.  
     - *Fix*: Compensating transactions (`offset_txn_id`) lock the original `txn_id`. Saga rollback voids offset if harm event invalidated.  

  6. **Reviewer Rage**:  
     > *Causal Inference Guild Review*: "PCAS conflates *probability* with *causality*. If harm occurs regardless of User X (e.g., batch triggered by others), their contribution is 0. Stop pretending floats fix ontology."  
     *Response*: Guild feedback noted. We’ll add a `causality_mode` flag (PR #742). Default remains expected value.  

  #### Rollout Plan  
  **Phase 1**: Shadow mode for chicken purchases (low stakes). Compare PCAS scores against legacy "1 chicken = 1 death" model.  
  **Phase 2**: Enable offsets for flights. Use feature flag `RETURN_ZERO_IF_UNDERFLOW` to toggle near-zero scores to 0.  
  **Phase 3**: General availability. If VirtuePoints™ adoption drops >5%, disable `RETURN_ZERO_IF_UNDERFLOW` (users prefer tiny positives over zeros).  

  #### Open Questions  
  1. Should we cap negative scores? (e.g., User at "-10 dead chickens" could claim sainthood.)  
  2. How to attribute harms with unknown thresholds? (e.g., "user browsed fast fashion site for 5min → 0.0001 sweatshops"? Assume uniform distribution.)  
  3. Can we monetize score inflation? (e.g., "$0.99 to round your 0.0001 to 0.")  

  ---

  ### Where the Jokes Are Load-Bearing  
  Each edge case mirrors a philosophical pitfall:  
  - **Threshold Ambiguity** → The batching problem (one chicken purchase doesn’t save a life; it shifts probability). Uniform allocation parodies "expected value" ethics.  
  - **Float Underflow** → The "tiny nonzero" rebuttal. Storing near-zero values mocks the practical absurdity of fractional moral responsibility.  
  - **Preempted Harm** → "Harm would’ve happened anyway." Checking if the flight seat filled satirizes counterfactual dependency.  
  - **Double-Cause Paradox** → Overdetermination (two sufficient causes; neither "necessary"). Shapley values (from game theory) wink at philosophers who borrow math for moral luck.  
  - **Offset Idempotency** → Moral bookkeeping as transactional saga. The idempotency key laughs at carbon-offset markets where absolution is resold.  
  - **Reviewer Rage** → The purist critique: "If you didn’t change the outcome, your impact is zero." PCAS’s `causality_mode` flag is the engineers’ shrug: "Fine, but expected value ships faster."  
  The rollout’s `RETURN_ZERO_IF_UNDERFLOW` toggle embodies the unresolved debate: Is "statistically insignificant" harm actually zero? The doc optimizes for corporate velocity over truth—much like attribution models.
