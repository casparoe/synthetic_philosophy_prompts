prompt: |-
  I teach a 110-minute session of an interdisciplinary seminar on legal interpretation — eighteen students, roughly half of them law students and half philosophy graduate students — and I want a classroom exercise in which the contest between fixing meaning in the enacted text and fixing it in the legislature's apparent purpose is encountered through the mechanics of the exercise rather than announced by me. Please design the whole thing: full rules, printable materials, a minute-by-minute timeline, the debrief, and a candid account of its failure modes.

  I have drafted the statutory materials myself and I would like you to keep them, tightening the wording where you like but preserving the four defects I built in. The instrument is a state statute I will call the Corridor Quiet Use Act. Section 1 recites that the Greenway Corridor is used by pedestrians, cyclists and persons with mobility impairments, that the growth of motor-driven devices has increased collisions and noise, and that the purpose of the Act is to keep the Corridor safe and quiet for persons travelling under their own power. Section 2 defines "motor-driven device" as any apparatus propelled by an engine or motor, expressly including internal-combustion engines and electric motors, and says nothing about battery size, pedal assist, or medical equipment. Section 3 forbids any person to operate a motor-driven device on any segment listed in Schedule A. Section 4 imposes a fifteen-mile-per-hour cap on bicycles and motor-driven devices "on the Corridor," which is a wider domain than Schedule A and creates a redundancy the teams must fight over. Section 5 exempts vehicles used in construction, maintenance or repair of the Corridor and emergency vehicles responding to an emergency on it. Schedule A lists five segments, one of which — Segment 4 — has hosted gasoline-powered guided tour vehicles continuously since 1974 and which the record twice describes as the motorized-use segment; the list as engrossed does not match the segment descriptions the committee approved.

  The four cases for argument are: a seventy-one-year-old woman cited under Section 3 for riding a physician-prescribed electric-assist tricycle to the community garden she cannot otherwise reach; the Segment 4 tour operator cited under Section 3 while driving at twelve miles per hour; a delivery contractor on a 250-watt electric cargo bike going eighteen miles per hour, cited under both Sections 3 and 4; and a search-and-rescue volunteer cited under Section 3 for flying a gasoline-powered drone that launched from, and returned to, Segment 2 without touching down anywhere inside the Corridor.

  Please build the exercise around a scarce resource. Give each counsel team a fixed budget of tokens and price access to the legislative record, with prices set so that no team can afford everything: the Senate committee report, which says the ban targets gas-powered mini-bikes and off-road motorcycles and adds that nothing in the Act limits access for persons with disabilities; the sponsor's floor statement, which says the ban reaches anything with a motor and specifically answers yes when asked about electric-assist bicycles; the agency hearing transcript, containing the tour operator's counsel stating that his client was assured Segment 4 would be excluded; the nonpartisan drafting consultant's memorandum noting that Schedule A was renumbered in the second printing and that the engrossed list does not match the approved descriptions, a memorandum never read aloud, never voted on, and written by someone who is not a legislator; and a one-paragraph endorsement from a disability-rights organization praising the bill for preserving access. Award points to teams that argue within the four corners of the text, and score the briefs on a published rubric whose dimensions cannot all be maximized at once.

  Two sealed envelopes should be opened only at the end. The first discloses the subcommittee's actual state of mind: four legislators, four incompatible understandings of the operative term, one of whom voted for the bill without reading Schedule A, with the compromise being to use a broad word and let the agency sort it out. The second states, in one sentence, that the document which would have settled the meaning is the consultant's memorandum, and asks the room what status that gives it.

  The session must run without my saying the words textualism or purposivism, and no student may be assigned a school of thought; participants play counsel and judges, and any methodological commitment has to emerge from the incentives. Tell me what will predictably break the first time I run this — I expect it to be the budget, and that every team will try to buy the memorandum — and give me a mid-session patch. Give me the objection the most articulate purposivist in the room will level at the design, namely that I rigged the record to be expensive and self-contradictory so that the text would win by default, and tell me whether that objection lands. Finally, be explicit about which features of the real disagreement the exercise cannot reproduce and that I will have to supply myself.
reasoning: |-
  We are designing a classroom exercise for a 110-minute session with 18 students. The goal is to have students encounter the tension between textualism and purposivism through the mechanics of the exercise without the instructor announcing these concepts.

  The exercise will be structured as a moot court simulation with four cases. We will form four teams of counsel (each team representing one of the four cases) and a panel of judges (the rest of the students). Each counsel team will have a fixed token budget to purchase access to legislative history documents. The judges will also have a token budget to purchase documents for their own review. The exercise will include a briefing phase and an oral argument phase.

  **Key Elements:**
  1. **Teams:** 
     - 4 counsel teams (each with 2-3 students) for the four cases.
     - The remaining students (6-10) will form the judicial panel (divided into two panels of 3-5 each, if numbers allow, to hear two cases at a time).

  2. **Token Budget:**
     - Each counsel team and the judicial panel will get a fixed token budget (e.g., 10 tokens per team).
     - The legislative record documents will have varying prices (set so that no team can buy everything).

  3. **Legislative Record Documents (with prices):**
     - Senate committee report (4 tokens): states the ban targets gas-powered mini-bikes and off-road motorcycles and adds that nothing in the Act limits access for persons with disabilities.
     - Sponsor's floor statement (5 tokens): says the ban reaches anything with a motor and specifically answers yes when asked about electric-assist bicycles.
     - Agency hearing transcript (3 tokens): contains the tour operator's counsel stating that his client was assured Segment 4 would be excluded.
     - Nonpartisan drafting consultant's memorandum (6 tokens): notes that Schedule A was renumbered in the second printing and that the engrossed list does not match the approved descriptions; also states that the memorandum was never read aloud, never voted on, and written by a non-legislator.
     - Disability-rights endorsement (2 tokens): a one-paragraph endorsement praising the bill for preserving access.

  4. **Scoring Rubric for Briefs:**
     - The rubric will have three dimensions (each on a scale of 1-5, with 15 points maximum):
       - **Fidelity to Text:** How well the argument is grounded in the statutory text.
       - **Use of Legislative History:** How appropriately and effectively legislative history is used (if purchased and used).
       - **Persuasiveness and Clarity:** Overall quality of the argument and writing.

     Note: These dimensions cannot be maximized at once because spending tokens on legislative history might detract from textual arguments (if the history conflicts with the text) and because the token budget forces choices.

  5. **Cases:**
     - Case 1: 71-year-old woman on electric-assist tricycle (prescribed) cited under Section 3.
     - Case 2: Segment 4 tour operator (gasoline-powered) cited under Section 3 while driving at 12 mph.
     - Case 3: Delivery contractor on 250-watt electric cargo bike going 18 mph, cited under both Sections 3 and 4.
     - Case 4: Search-and-rescue volunteer flying a gasoline-powered drone that launched and returned from Segment 2 without touching down.

  6. **Sealed Envelopes:**
     - Envelope 1: Discloses the subcommittee's actual state of mind: four legislators had four incompatible understandings of the operative term, one voted without reading Schedule A, and the compromise was to use a broad word and let the agency sort it out.
     - Envelope 2: States that the consultant's memorandum would have settled the meaning and asks what status that document has.

  7. **Exercise Structure:**
     - Preparation Phase (40 minutes): Teams read the statute, their case, and decide which documents to purchase. They then draft a one-page brief (using a template).
     - Oral Arguments (40 minutes): Two courtrooms run simultaneously (each with a panel of judges). Each case gets 10 minutes (5 minutes per side, but since each team is arguing for their client, it will be one-sided argument with judges asking questions). We do two cases in each room (20 minutes per room) and then switch (so each panel hears two cases). Alternatively, if time is tight, we might do one case per room and then switch, but that would take 40 minutes for 4 cases (if done sequentially). We can do two cases in parallel in two rooms (each room has two cases, 10 minutes each) for 20 minutes, then switch the judges to the other two cases? But that would require two sets of judges. Alternatively, we have two courtrooms: Room A hears Case 1 and Case 2 (20 minutes total, 10 minutes each). Room B hears Case 3 and Case 4 (20 minutes). Then we have a 10-minute break and then debrief. But note: the judges are the same 10 students? We split the judges into two panels: Panel A (5 judges) and Panel B (5 judges). Each panel stays in one room and hears two cases (two teams present to them). After 20 minutes, we break and then reconvene for debrief.

     Given 40 minutes for oral arguments, we can do:
       - 0:00-20:00: Panel A hears Case 1 and Case 2 (10 minutes each) in Room A; Panel B hears Case 3 and Case 4 in Room B.
       - Then, we don't switch, because each panel has heard two cases. We move to debrief.

  8. **Debrief (30 minutes):**
     - Discuss the cases and the arguments.
     - Open sealed envelope 1: discuss the implications of the subcommittee's state of mind.
     - Open sealed envelope 2: discuss the consultant's memorandum.
     - Reflect on the tension between text and purpose.

  **Failure Mode Prediction and Patch:**
  - **Predicted Failure:** Every team will try to buy the consultant's memorandum (because it seems crucial) but it's expensive (6 tokens). Teams might not have enough tokens for other documents. Also, the judicial panel might not have enough tokens to buy all the documents they want.
  - **Mid-Session Patch:** After the first 10 minutes of the preparation phase, if the instructor observes that all teams are buying the memorandum, announce: "Due to high demand, the price of the consultant's memorandum has increased to 8 tokens. However, teams that have already purchased it at 6 tokens are grandfathered in. Alternatively, teams may choose to refund their purchase and get their tokens back to reallocate." This will force teams to reconsider and may lead to more diverse choices.

  **Objection from Purposivist:** The most articulate purposivist might object that the exercise is rigged because the legislative history is expensive and self-contradictory, making the text the only reliable and affordable resource, thus stacking the deck in favor of textualism.

  - **Response:** The objection might land because the design does make legislative history costly and inconsistent, mirroring real-world challenges (like access and reliability). However, the instructor can note that the exercise is designed to expose the practical difficulties in relying on legislative history and that in real life, legislative history can be voluminous, contradictory, and costly to access. The exercise does not rig the outcome because the text also has ambiguities (e.g., the redundancy in Section 4, the definition in Section 2, the mismatch in Schedule A). The purpose of the exercise is to show that both approaches have challenges.

  **What the Exercise Cannot Reproduce:**
  1. **Time and Resource Constraints in Real Litigation:** Real lawyers have more time and resources to research legislative history.
  2. **The Role of Precedent:** In real courts, precedent would play a major role, but we are focusing on statutory interpretation without case law.
  3. **Full Legislative Record:** We are providing only a curated set of documents; in reality, the record might be more extensive.
  4. **Judicial Discretion and Ideology:** Real judges bring their own methodological commitments, which we simulate by the token budget and scoring rubric but cannot fully capture.

  **Printable Materials:**
  1. **Statutory Text (Corridor Quiet Use Act):** 
     - [Provide the text as per the user, with tightening but preserving the four defects.]

  2. **Case Summaries (one page per case):**
     - Case 1, Case 2, Case 3, Case 4.

  3. **Legislative Record Documents (each on a separate page, with a price tag):**
     - [List the five documents with their descriptions and prices.]

  4. **Token Budget Sheet:** For teams to record their purchases.

  5. **Brief Template:** One page, with sections: Statement of Facts, Argument, Conclusion.

  6. **Scoring Rubric:** For the judges to score the briefs (and possibly the oral arguments?).

  7. **Sealed Envelopes:** With the two disclosures.

  **Timeline (110 minutes total):**

  - **0:00-0:10 (10 min):** Introduction and setup. Assign teams and roles. Explain the rules, token system, and timeline. Hand out statutory text, case summaries, and legislative record menu. Form four counsel teams (each assigned one case) and two judicial panels (each with 5 judges, if 18 students: 4 teams * 3 = 12, then 6 judges -> two panels of 3 each? Or adjust: 4 teams of 2-3, then 10 judges -> two panels of 5 each? With 18 students: 4 teams of 3 (12) and 6 judges (split into two panels of 3). That works.

  - **0:10-0:50 (40 min):** Preparation Phase. Teams:
     - Read their case and the statute.
     - Decide which legislative history documents to buy (with their 10 tokens).
     - Draft a one-page brief (using the template).

  - **0:50-1:30 (40 min):** Oral Arguments. 
     - Split into two courtrooms (if possible, or one after the other if space is limited). 
     - Panel A (3 judges) in Room A hears Case 1 (10 min) and Case 2 (10 min). 
     - Panel B (3 judges) in Room B hears Case 3 (10 min) and Case 4 (10 min). 
     - Each counsel team presents their argument (5 min) and then answers questions from the judges (5 min). 
     - Alternatively, if we have only one room, we can do: Panel A hears Case 1 (10 min), then Case 2 (10 min); then Panel B hears Case 3 (10 min) and Case 4 (10 min). But that would take 40 minutes without a break. We can run them in parallel if we have two rooms.

  - **1:30-2:00 (30 min):** Debrief. 
     - Reconvene in plenary. 
     - Discuss the cases: What arguments were persuasive? Why? 
     - Open sealed envelope 1: read the subcommittee's state of mind. Discuss: How does this affect the legitimacy of using legislative history? 
     - Open sealed envelope 2: read the statement about the consultant's memorandum. Discuss: What status should this document have? 
     - Reflect on the tension between text and purpose without using the terms textualism/purposivism. 
     - Address the scoring: How did the token budget and rubric affect the arguments?

  **Adjusting for Time:** If the preparation phase runs long, we can reduce the briefing to a half-page. If oral arguments run long, the instructor can act as a timekeeper.

  **Final Notes:** 
  - The exercise is designed to be challenging and to force trade-offs. 
  - The instructor should be prepared to facilitate the debrief and to address the predicted objection by acknowledging that the legislative history is indeed messy and expensive, but that is a reality of statutory interpretation.

  Let me know if you need further adjustments.
answer: |-
  Below is a complete design for your 110-minute exercise, including printable materials, a minute-by-minute timeline, debrief structure, failure mode analysis, and responses to your specific requests. The exercise uses a "scarcity auction" mechanic to force trade-offs between textual and purpose-based arguments without explicitly naming interpretive theories. Legislative history access is priced to create tension, and the sealed envelopes reveal key insights about legislative intent.

  ---

  ### **Exercise Design: The Corridor Quiet Use Act Moot Court**
  **Core Mechanics:**  
  Four legal teams (4–5 students each) represent one of the four cases. Each team receives a token budget to bid on legislative history documents during prep time. Judges (remaining students) score briefs using a multidimensional rubric that rewards textual fidelity, persuasive use of history, and clarity—but forces trade-offs. No team can afford all documents, forcing prioritization of text vs. purpose.

  **Learning Objective:**  
  Students experience the tension between text and purpose through resource constraints, flawed statutory language, and contradictory legislative history. Methodological preferences emerge organically from incentives.

  ---

  ### **Printable Materials**
  **1. Statutory Text (Corridor Quiet Use Act)**  
  *(Preserving your four defects: ambiguous "motor-driven device" definition; Schedule A mismatch; Section 3/4 redundancy; silence on medical/assistive devices)*  
  ```markdown
  **SECTION 1: PURPOSE**  
  The Greenway Corridor is used by pedestrians, cyclists, and persons with mobility impairments. Growth of motor-driven devices has increased collisions and noise. This Act shall keep the Corridor safe and quiet for persons traveling under their own power.

  **SECTION 2: DEFINITIONS**  
  "Motor-driven device" means any apparatus propelled by an engine or motor, including internal-combustion engines and electric motors.

  **SECTION 3: PROHIBITION**  
  No person shall operate a motor-driven device on any segment listed in Schedule A.

  **SECTION 4: SPEED LIMIT**  
  No person shall operate a bicycle or motor-driven device on the Corridor at over 15 miles per hour.

  **SECTION 5: EXEMPTIONS**  
  This Act does not apply to:  
  (a) Vehicles used in construction, maintenance, or repair of the Corridor;  
  (b) Emergency vehicles responding to an emergency on the Corridor.

  **SCHEDULE A**  
  Segments closed to motor-driven devices:  
  - Segment 1: Riverwalk (Mile 0–2)  
  - Segment 2: Forest Trail (Mile 3–5)  
  - Segment 3: Downtown Esplanade (Mile 6–8)  
  - Segment 4: Heritage Loop (Mile 9–11)  
  - Segment 5: Lakeside Path (Mile 12–14)  
  *NOTE: Segment 4 has hosted gasoline-powered guided tours since 1974. The engrossed list does not match committee-approved descriptions.*
  ```

  **2. Case Summaries (1 page per case)**  
  ```markdown
  **CASE A: Electric-Assist Tricycle (71-year-old woman)**  
  Client cited under Section 3 for operating a physician-prescribed electric-assist tricycle (250W battery) to access a community garden. Argue for dismissal.

  **CASE B: Segment 4 Tour Operator**  
  Client cited under Section 3 for driving a gasoline-powered tour vehicle at 12 mph on Segment 4. Argue for dismissal based on historical use and speed compliance.

  **CASE C: Delivery Contractor (E-cargo bike)**  
  Client cited under Sections 3 and 4 for operating a 250W electric cargo bike at 18 mph on Segment 3. Argue against one or both charges.

  **CASE D: Search-and-Rescue Drone**  
  Client cited under Section 3 for flying a gasoline-powered drone that launched/landed on Segment 2 without touching Corridor surfaces. Argue for dismissal.
  ```

  **3. Legislative Record Menu (with token prices)**  
  ```markdown
  **DOCUMENTS FOR PURCHASE (10 tokens/team):**  
  - (3 tokens) SENATE COMMITTEE REPORT: "The Section 3 ban targets gas-powered mini-bikes and off-road motorcycles. Nothing herein limits access for persons with disabilities."  
  - (4 tokens) SPONSOR'S FLOOR STATEMENT: "The ban covers any device with a motor, including electric-assist bicycles." (Responds "yes" when asked about e-bikes.)  
  - (2 tokens) AGENCY HEARING TRANSCRIPT: Tour operator's counsel states, "My client was assured Segment 4 would be excluded from Schedule A."  
  - (6 tokens) CONSULTANT'S MEMORANDUM: "Schedule A was renumbered post-committee; the engrossed list does not match approved descriptions." (Never read/voted on; authored by non-legislator.)  
  - (1 token) DISABILITY-RIGHTS ENDORSEMENT: "We praise this bill for preserving access for mobility-impaired users."  
  ```

  **4. Brief Scoring Rubric (1 page)**  
  *Teams lose points for overreliance on unpurchased documents. Judges assign 1–5 points per category (max 15 points/brief).*  
  - **Textual Fidelity:** Adherence to enacted statutory language.  
  - **Purpose Integration:** Persuasive use of legislative history *within purchased access*.  
  - **Persuasive Clarity:** Logical structure and accessible reasoning.  
  *Note: Maximizing one category often requires sacrificing another (e.g., textual arguments may ignore purpose, and vice versa).*

  **5. Sealed Envelopes**  
  - **Envelope 1:** "Subcommittee members held four incompatible understandings of 'motor-driven device.' One voted without reading Schedule A. Their compromise: Use broad language and let the agency sort it out."  
  - **Envelope 2:** "The consultant's memorandum would have settled the meaning. What legal status does this document have?"  

  **6. Token Budget Sheet**  
  *Simple grid for teams to log purchases (10 tokens/team).*

  ---

  ### **Minute-by-Minute Timeline (110 min total)**
  **Phase 1: Setup (0:00–0:15)**  
  - **0:00–0:05:** Assign roles. Split 18 students into:  
    - 4 counsel teams (4–5 students each, 16 total).  
    - 2 judges (remaining students; they score briefs and hear arguments).  
  - **0:05–0:15:** Distribute materials. Teams receive:  
    - Statutory text, case summary, legislative menu, token sheet, rubric.  
    Judges receive: Statute, rubric, token sheet (judges get 5 tokens to buy documents for scoring).  
  - **Instructor Script:** "You are counsel defending your client. Use tokens to buy legislative history. Your brief will be scored on textual analysis, use of history, and clarity. Judges: Use tokens to access documents for scoring."  

  **Phase 2: Prep & Auction (0:15–0:50)**  
  - **0:15–0:30:** Teams analyze case/statute and **secretly submit token bids** for documents (instructor collects bids).  
  - **0:30–0:40:** **Process bids**. Announce which documents each team "won." *If multiple teams bid for same document, highest bidder wins (ties broken by lottery).*  
  - **0:40–0:50:** Teams draft **1-page briefs** using purchased documents. Judges buy documents for scoring.  

  **Phase 3: Oral Arguments (0:50–1:25)**  
  - Split into two courtrooms (Court A: Cases A & B; Court B: Cases C & D).  
  - **Per Case (10 min total):**  
    - 5 min: Counsel presents.  
    - 3 min: Judges question.  
    - 2 min: Rebuttal.  
  - *Judges score briefs during/after arguments.*  

  **Phase 4: Debrief (1:25–1:50)**  
  - **1:25–1:30:** Reconvene. Announce top-scoring team (based on rubric).  
  - **1:30–1:35:** Open **Envelope 1**. Discuss: "How does this affect your arguments?"  
  - **1:35–1:40:** Open **Envelope 2**. Discuss: "Should non-vetted documents resolve ambiguity?"  
  - **1:40–1:50:** Guided reflection:  
    - "What constrained your arguments? How did token costs shape your strategy?"  
    - "Did the text or purpose feel more reliable? Why?"  
    - **Avoid terms like textualism/purposivism.** Use "enacted language" vs. "intent."  

  ---

  ### **Predicted Failure Modes & Mid-Session Patch**
  **Failure:** All teams will prioritize the consultant's memorandum (6 tokens), believing it resolves Schedule A’s defect. This starves them of tokens for other documents, undermining purpose-based arguments and skewing toward textualism.  
  **Patch (at 0:25—mid-auction):**  
  > "The consultant’s memorandum is now in high demand. Its price rises to **8 tokens** for new bids. Teams that already bid 6+ tokens keep access; others may rebid."  
  *Why it works:* Forces teams to reconsider costs. Some will abandon it for cheaper documents (e.g., committee report), creating diversity in arguments.  

  **Purposivist Objection (articulated in debrief):**  
  > "You rigged the record to be expensive and contradictory so the text wins by default. Real courts have full access; this misrepresents purposivism."  

  **Response & Why It Lands/Doesn’t Land:**  
  - **Lands:** The objection is partially valid. High token costs mirror real-world barriers (e.g., obscure records, research costs), but the exercise exaggerates scarcity.  
  - **Doesn’t Land:** Textualism doesn’t "win" outright—teams using cheap documents (e.g., disability endorsement) can score well on purpose integration. The consultant’s memo (if purchased) undermines textual arguments about Schedule A. The design ensures both approaches face challenges: textualists struggle with ambiguities (e.g., "apparatus," medical exemptions); purposivists grapple with contradictions.  

  ---

  ### **What the Exercise Cannot Reproduce (Instructor Notes)**  
  1. **Judicial Precedent:** Real courts use prior rulings to constrain interpretation. Here, students argue in a vacuum. *Supply this context in debrief:* "In practice, courts might use precedent to resolve ambiguities we debated today."  
  2. **Agency Deference:** Real agencies (e.g., DOT) interpret statutes. The exercise omits this. *Note in debrief:* "Agencies often fill gaps (e.g., defining 'medical devices'), but our statute lacks that mechanism."  
  3. **Political Influence:** Lobbyists, public pressure, and institutional biases shape real legislative history. *Highlight:* "The consultant’s memo was ignored partly because it lacked political backing."  
  4. **Temporal Context:** Real interpretation evolves (e.g., e-bikes didn’t exist in 1974). *Emphasize:* "Originalism vs. living constitutionalism debates are absent here—focus on text/purpose tension."  

  ---

  ### **Instructor Script for Key Moments**  
  - **Opening:** "Today, we’re lawyers defending clients under the Corridor Quiet Use Act. Your goal: persuade judges using the statute and legislative history—but you can’t afford everything."  
  - **Mid-Auction Patch:** "Update: Consultant’s memo now costs 8 tokens due to demand. Adjust bids if needed."  
  - **Debrief (Post-Envelopes):** "The legislature’s internal confusion raises questions: When history is messy, what should we trust? Can a document no one voted on be authoritative?"  
  - **Closing:** "This exercise exposed trade-offs between the enacted text and lawmakers’ goals. Neither is perfect—both require judgment."  

  This design ensures students experience the text/purpose contest mechanically while preserving your statute’s defects. The token economy forces explicit trade-offs, and the sealed envelopes validate real-world complexities. Run it as-is, but be ready to nudge teams away from memo overinvestment at 0:25.
