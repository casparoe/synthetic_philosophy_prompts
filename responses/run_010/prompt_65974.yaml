  (clears throat, pauses)

  We are here because we knew Miriam Doerr. Not an idea of her. Not a theory about her. But her, present among us. Or rather, *presented* among us. In how she sat in that third pew, slightly left of centre, listening. In how she met your eyes across Quad, a brief, assessing nod. In the way she would lean forward in her chair during a supervision, the faintest line appearing between her eyebrows, not in judgment, but in the effort of *following*. Her presence wasn't a signal broadcast from some hidden chamber; it was the shape she made in the world, the space she occupied, the sound she added to the conversation.

  Think of standing in this chapel during choir practice. You hear the whole – the swell, the harmony, the shared breath. Now, try to isolate just the alto line. It’s difficult, isn’t it? You sense its grounding weight, its essential counterpoint, but rarely pick it out alone unless you strain. That was Miriam’s part in the village choir for twenty-five years. She sang the line you feel more than you distinctly hear, the foundation woven into the fabric of the sound. She didn’t need the solo. Her contribution was the structure it provided, the depth it gave to the whole. She was present in the blend, in the making of something larger than any single voice. *(Pause)*

  She answered letters. Not just the important ones from colleagues, but the tentative ones, the ones that began, "Dear Professor Doerr, you won’t know me, but…" A retired postal worker in Devon wrote to her once, puzzled by an argument in one of her papers. She replied. He wrote back. This exchange, this careful, thoughtful dialogue conducted entirely by post, lasted eleven years. It wasn’t about revealing some inner self; it was about the act of engagement itself, the public practice of putting thoughts into words for someone else to understand. She treated the stranger’s question with the same seriousness she brought to a faculty debate. The point was the conversation, happening right there on the page, available to anyone who might read it.

  In her study at home, or here in her college rooms, her form of approval was distinctive. It wasn’t effusive praise. It wasn’t a pat on the back. If you had shown her something – a draft chapter, a tricky proof, even Anneke’s school essay – and she thought it *worked*, that it had something true in it, she would look up, that familiar line appearing between her brows again, and say, softly, “Again. Slower.” She wanted to hear it, to *see* the thought unfold in the space between you. Not because she doubted, but because she valued the articulation, the shared comprehension in the room. The meaning wasn’t locked inside your head; it was in the saying, and in her listening. Her request was an invitation: show me how you got there, let me walk the path with you, step by visible step. That was her endorsement: the request to dwell in the clarity of the thing itself, together.

  Many of us knew the notebooks. The stack of them, bound in different colours, filled with that elegant, impenetrable script of her own invention. They sat on her shelf, a quiet presence. She offered once, in her seventy-second year, to teach the notation to a graduate student. The student, overwhelmed, regretfully declined for lack of time. Miriam nodded. She understood the demands of the public work. She never offered the key again. And in her will, she directed they be placed in the college archive, unopened. Douglas, her brother, has wondered aloud this week about them. He’s suggested, understandably, that opening one might give us something uniquely *hers*. Something private. *(Pause)*

  But Miriam taught us, rigorously, patiently, that the uniquely private is a mirage. What was genuinely hers *wasn’t* locked away behind symbols only she could decipher. It was already here. It was in the eleven years of letters to the postal worker. It was in the precise, demanding care of a supervision where she asked you to go “Again. Slower.” It was in the steady alto line she contributed to the choir for a quarter of a century, the part that underpinned the melody without demanding the spotlight. It was in the way she argued fiercely in print with certain colleagues for decades – arguments anyone could read, follow, and learn from – and then shared coffee with them afterwards, the disagreement itself a form of profound intellectual respect conducted entirely in the open.

  What we miss today isn’t a hidden essence. We miss *that* voice asking for the thing again, slower. We miss *that* shape in the third pew. We miss *that* precise handwriting in the margins of our work, pointing not to what we *meant*, but to what we’d actually *said*. We miss the weight of her alto note in the chord. Her life was a sustained demonstration that a person is not a secret kept, but a pattern of living, visible and audible and tangible to others. Her clarity, her rigour, her sometimes formidable presence – these weren't walls hiding something else; they *were* the architecture of her. *(Pause)*

  To search for her elsewhere, behind a curtain of private symbols, would be to misunderstand the very ground of her work and her life. It would suggest we hadn’t truly known her when she stood among us, speaking, writing, listening, singing. But we did know her. We knew her in her actions, in her words spoken and written for us, in the way she treated the ideas and the people placed before her. Her notebooks rest unopened not because we are denied her, but because she gave us herself, fully and publicly, in everything else she did. The person we honour is the person we saw: engaged, articulate, present. Asking us to listen carefully, to go again, slower. To pay attention to what is right here.

  The alto line has fallen silent. We feel the space it leaves in the chord. We feel the silence where her voice challenged, clarified, or simply joined in the song. We don’t need to imagine what note she *meant* to sing. We heard it. We stand in the resonance of a life lived entirely, unapologetically, in view. That resonance is what remains. That is Miriam Doerr. Not concealed, but displayed. For all of us to know. *(Long pause)*
