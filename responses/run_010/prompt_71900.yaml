prompt: |-
  For the past year I have been writing donation appeals for a small nonprofit, and I have become genuinely unsure where legitimate persuasion stops and manipulation begins. I don't have a philosophy background, so what I want is a decision tree I could actually run a draft appeal through, rather than an account of who has said what.

  Please build it from the space of possible answers first. Each branch node should be a question I could answer about a piece of communication without knowing which label my answer leads to — for instance: would the technique still work on someone who had just been shown precisely how it works; would the person influenced endorse the influence a month later, when the urgency has passed; does the appeal supply considerations that bear on whether its claim is true, or does it mainly shift the reader's estimate of what other people think and do; does it work by compressing the time available to decide; does the writer have to believe it for it to land? Only then place the positions people actually hold at the leaves — including the view that manipulation is anything that bypasses a person's capacity to weigh reasons, the view that only covert influence is objectionable, and the view that the same move is permissible for a seller but not for a state. Note any combination of answers that seems unoccupied, and say whether that is because the position is incoherent, unappealing, or merely unexplored.

  Work these three cases in somewhere: a suggested giving amount printed above the blank field on a donation form; a medical procedure described by survival rate rather than mortality rate; and a campaign ad aimed at a demographic the campaign expects to turn out at lower rates. Flag any pair of leaves your questions cannot really separate. Finally, be explicit about which of these branches are settled and which are still contested among people who work on the topic — do not present a live dispute as though it were consensus.
reasoning: |-
  Okay, the user is struggling with ethical boundaries in nonprofit donation appeals. They want a practical decision tree, not theoretical debates. Let me unpack their core request: they need clear, actionable criteria to distinguish persuasion from manipulation in their writing.

  First, considering their background - small nonprofit, no philosophy training. They're likely time-pressed and need concrete tools. The mention of "draft appeal" suggests immediate applicability matters more than abstract principles. Their frustration with "who said what" signals aversion to academic jargon.

  The challenge is building a tree where questions don't reveal ethical labels upfront. That's smart - it prevents self-justification bias. I'll need ethically neutral diagnostic questions that expose mechanisms rather than judgments. The examples they gave (e.g., "would it work if exposed?") are excellent starting points.

  Hmm... key philosophical positions to cover: autonomy-based views (bypassing reason), transparency-focused views (covert=bad), and contextual double standards (seller vs state). Must present these as live debates where applicable. Their three test cases will help ground this - particularly the survival rate framing which demonstrates well-known cognitive bias exploitation.

  For structure: I'll start with the most fundamental question about rationality bypass, then branch to transparency, temporal pressure, social proof etc. The "writer belief" question tackles sincerity - important for nonprofit credibility. Should flag where answers might conflict (e.g., something could be transparent but still bypass reason).

  Noticing their examples test different pressure points: suggested amounts (anchoring bias), survival rates (framing effect), turnout ads (social proof). These will serve as perfect validation points throughout the tree. Must explicitly call out any indistinguishable pairs - like where transparency doesn't resolve autonomy concerns.

  Biggest trap to avoid: implying consensus where none exists. For instance, behavioral economists might defend choice architecture that libertarians reject. Need to signpost these fault lines clearly. Also should note "empty" branches - like if something simultaneously bypasses reason AND is endorsed later, which seems paradoxical.

  The tree should culminate in practical guidance: green lights (e.g., transparent rationality-based appeals), yellows (proceed with caution like urgency tactics), and reds (covert emotional triggers). But must emphasize that yellow zones are exactly where ethicists disagree.
answer: |-
  Based on your need for a practical, non-theoretical decision tree to evaluate donation appeals, here is a framework built from first principles. The questions are designed to be answerable about the *communication itself* without knowing the ethical label, focusing on *how* it works. Positions held by ethicists are then placed at the leaves.

  **The Decision Tree: Evaluating Persuasive Communication**

  Start at the top for each specific technique or element within your draft appeal:

  1.  **Does the technique primarily work by bypassing or overwhelming the recipient's capacity for deliberate, conscious weighing of reasons relevant to the decision?**
      *   **Yes:** Proceed to Question 1A.
      *   **No:** Proceed to Question 2.
      *   *Rationale:* This targets the core concern about undermining autonomy by short-circuiting rational deliberation.

      1A. **Is the bypass mechanism overt/transparent, or covert/hidden?**
          *   **Covert/Hidden:** → **Widely Condemned Manipulation.** (Position: Manipulation occurs when influence bypasses reason *and* is hidden, preventing the recipient from recognizing or correcting for it. e.g., Subliminal messaging, undisclosed conflicts of interest).
          *   **Overt/Transparent:** Proceed to Question 1B.
          *   *Rationale:* Transparency allows for potential conscious adjustment, even if the initial effect bypasses reason.

          1B. **Would the recipient likely still endorse the influence/decision as reasonable and aligned with their values *after* the immediate emotional context or pressure subsides (e.g., a month later)?**
              *   **Yes:** → **Contested Zone A (Nudging/Persuasive Framing).** (Position: Some argue transparent techniques leveraging cognitive biases - "nudges" - are permissible if easily resistible and promoting welfare. Others argue any bypass of reason, even transparent, undermines autonomy and is manipulative. **Highly contested.** e.g., Default options, transparent framing effects).
              *   **No:** → **Generally Objectionable Manipulation.** (Position: Techniques that transparently overwhelm reason (e.g., extreme emotional manipulation, intense pressure tactics) are still seen as manipulative because they coerce rather than persuade, even if the mechanism is visible. Less contested than 1B-Yes, but some advertisers might defend it).
              *   *Rationale:* Endorsement later suggests the influence resonated with the recipient's deeper values, not just transient states.

  2.  **Does the appeal primarily work by shifting the recipient's belief about what *other people* think or do (social proof/bandwagon), rather than providing direct reasons related to the *merits* of the appeal's core claim (e.g., the cause's importance, effectiveness)?**
      *   **Yes, Primarily Social Proof:** → **Contested Zone B (Social Influence).** (Position: Some see heavy reliance on social proof as manipulative crowd psychology bypassing individual reason. Others view it as legitimate information about norms or consensus. **Contested, depends on dominance and context.** e.g., "9 out of 10 neighbors donate!" vs. mentioning broad support as one factor).
      *   **No, Focuses on Merits:** Proceed to Question 3.
      *   *Rationale:* Distinguishes appeals to independent judgment of the cause from appeals to conformity.

  3.  **Does the appeal significantly compress the perceived time available for the recipient to deliberate or decide?**
      *   **Yes:** Proceed to Question 3A.
      *   **No:** Proceed to Question 4.
      *   *Rationale:* Time pressure can impair rational deliberation.

      3A. **Is the time pressure genuine and inherent to the situation (e.g., matching gift deadline tomorrow), or artificially manufactured by the appeal (e.g., "Donate NOW or children will suffer irreparably TODAY!")?**
          *   **Genuine/Inherent:** → **Generally Acceptable Persuasion (Urgency).** (Position: Highlighting real deadlines is providing relevant information for decision-making).
          *   **Artificially Manufactured:** → **Generally Objectionable Manipulation (False Urgency).** (Position: Creating false time pressure to force a hasty decision bypasses reason and is deceptive).
          *   *Rationale:* The legitimacy of the pressure source is key.

  4.  **Does the effectiveness of the appeal crucially depend on the *writer's* genuine belief in the specific claims being made?**
      *   **Yes (Sincerity Required):** → **Generally Acceptable Persuasion (Authenticity).** (Position: Appeals that only work if the messenger truly believes them are grounded in authentic communication and trust).
      *   **No (Effect is Belief-Independent):** → **Contested Zone C (Rhetorical Technique).** (Position: Techniques effective regardless of sincerity (e.g., specific story formulas, certain emotional triggers) raise concerns about being mechanistic or deceptive, even if the facts are true. **Contested,** leaning towards manipulation if overly formulaic/exploitative).
      *   *Rationale:* Sincerity dependence suggests alignment between message and messenger's intent.

  5.  **Would the technique likely remain effective if the recipient had just been explicitly informed about *how* it works (e.g., "This story is designed to evoke sympathy")?**
      *   **No (Effect Diminishes with Transparency):** → **Leans Towards Manipulation.** (Position: If knowing the mechanism undermines the effect, it suggests reliance on bypassing conscious awareness or reason. e.g., Many covert emotional triggers).
      *   **Yes (Effect Persists Despite Transparency):** → **Leans Towards Persuasion.** (Position: If transparency doesn't kill the effect, the appeal likely works through compelling reasons or authentic connection that withstand scrutiny. e.g., A strong, logical argument; a genuinely moving story).
      *   *Rationale:* Resistance to transparency suggests the influence relies on stealth or automaticity.

  **Analysis & Positions at Leaves:**

  *   **Widely Condemned Manipulation:** Covertly bypasses reason (1A-Covert). *Position:* Unethical manipulation (Kantian autonomy violation, deception).
  *   **Generally Objectionable Manipulation:** Overtly bypasses reason & not later endorsed (1B-No). *Position:* Still manipulative due to coercion/overwhelm.
  *   **Contested Zone A (Nudging/Persuasive Framing):** Overtly bypasses reason but later endorsed (1B-Yes). *Position:* **Highly contested** (Thaler/Sunstein vs. autonomy purists). Permissible "nudge" vs. soft manipulation.
  *   **Contested Zone B (Social Influence):** Relies heavily on social proof, not merits (2-Yes). *Position:* **Contested.** Is it informing about norms or exploiting herd mentality?
  *   **Generally Acceptable Persuasion (Urgency):** Uses genuine time pressure (3A-Genuine). *Position:* Legitimate information provision.
  *   **Generally Objectionable Manipulation (False Urgency):** Uses manufactured time pressure (3A-Manufactured). *Position:* Deceptive and coercive.
  *   **Generally Acceptable Persuasion (Authenticity):** Requires writer sincerity (4-Yes). *Position:* Ethically sound, trust-based communication.
  *   **Contested Zone C (Rhetorical Technique):** Effective regardless of belief (4-No). *Position:* **Contested.** Formulaic rhetoric vs. potentially deceptive technique.
  *   **Leans Towards Manipulation:** Effect dies with transparency (5-No). *Position:* Suggests reliance on non-rational, potentially deceptive pathways.
  *   **Leans Towards Persuasion:** Effect persists with transparency (5-Yes). *Position:* Suggests robustness based on reason or authentic resonance.

  **Unoccupied/Underdeveloped Combinations:**

  *   **Bypasses Reason (1-Yes) + Focuses on Merits (2-No):** Seems incoherent. If it bypasses reason, how can it *primarily* focus on the merits requiring reason? Might be possible with overwhelming emotional stories about the cause itself, but would likely fall into 1B-Yes or 1B-No.
  *   **Bypasses Reason (1-Yes) + Genuine Urgency (3A-Genuine):** This combination *exists* (e.g., a *real* emergency appeal using highly emotional, reason-bypassing imagery). It's **contested and ethically fraught**. Is bypassing reason justified by true, extreme urgency? Or does it always undermine dignity? This branch lacks a clear leaf but represents a real tension.

  **Indistinguishable Pairs:**

  *   **Contested Zone A (Nudge) vs. Leans Towards Persuasion (Persists w/ Transparency):** Some transparent nudges might persist in effect (e.g., a default option), while others might not (e.g., a very obvious framing effect). The tree struggles here. A nudge that persists might be seen as benign architecture, while one that fades might be seen as weaker persuasion or ineffective manipulation. **Further refinement needed** (e.g., "Is the transparently known mechanism *easily resistible*?").
  *   **Contested Zone C (Belief-Independent Tech) vs. Leans Towards Manipulation (Dies w/ Transparency):** Many belief-independent techniques *would* likely die with transparency, placing them in both categories. This highlights the link between mechanistic technique and transparency vulnerability.

  **Testing the Three Cases:**

  1.  **Suggested Giving Amount:**
      *   **1. Bypass Reason?** Yes (anchoring bias).
      *   **1A. Covert?** Usually overt (it's visible).
      *   **1B. Endorsed Later?** Often yes (people feel it was a helpful guide). → **Contested Zone A (Nudging).** *Debate:* Helpful default vs. potentially steering donations away from true intent.
  2.  **Survival Rate vs. Mortality Rate:**
      *   **1. Bypass Reason?** Yes (framing effect biases perception).
      *   **1A. Covert?** Overt (the numbers are presented, just framed differently).
      *   **1B. Endorsed Later?** Likely no if they realized the equivalent mortality rate was high and felt misled. → **Generally Objectionable Manipulation** or strong **Contested Zone A**. *Debate:* Is presenting true data in a more positive light inherently manipulative, or just effective communication?
  3.  **Campaign Ad Aimed at Low-Turnout Demographic:**
      *   **2. Relies on Social Proof?** Very likely yes (showing "people like you" voting/endorsing).
      *   **2-Yes.** → **Contested Zone B (Social Influence).** *Debate:* Empowering representation vs. exploiting group identity/herd mentality. *Also consider:* Might use manufactured urgency (3A-Manufactured?) or emotional appeals bypassing reason (1).

  **Settled vs. Contested:**

  *   **Settled (Wide Consensus Condemnation):** Covertly bypassing reason (1A-Covert), Manufacturing false urgency (3A-Manufactured).
  *   **Settled (Wide Consensus Acceptance):** Using genuine urgency (3A-Genuine), Sincerity-dependent appeals (4-Yes).
  *   **Highly Contested:** Transparently bypassing reason but later endorsed (Contested Zone A - Nudging), Heavy reliance on social proof (Contested Zone B), Belief-independent techniques (Contested Zone C). The boundaries between "persuasion" and "manipulation" here are hotly debated.
  *   **Leaning Consensus (but debatable):** Techniques whose effect dies with transparency (5-No) lean manipulative; those that persist (5-Yes) lean persuasive. Overt bypass *not* later endorsed (1B-No) leans manipulative.

  **How to Use This Tree:**

  1.  Break down your appeal draft into key elements (story, stats, ask phrasing, urgency cues, social proof, suggested amount, etc.).
  2.  For each element, run it through the tree from Question 1.
  3.  Note the resulting leaf (e.g., "Genuine Urgency Persuasion," "Contested Zone A," "Leans Manipulation").
  4.  Elements landing in "Widely Condemned," "Generally Objectionable," or "Leans Manipulation" should be reviewed critically and likely revised or removed.
  5.  Elements in Contested Zones require careful judgment:
      *   **Zone A (Nudging):** Is the nudge transparent? Easily resistible? Promoting genuine donor/cause alignment?
      *   **Zone B (Social Proof):** Is social proof dominant? Is it authentic? Does it overshadow the cause's merits?
      *   **Zone C (Technique):** Does the technique feel authentic or formulaic? Could it create cynicism if exposed?
  6.  Prioritize elements landing in "Authentic Persuasion," "Genuine Urgency," and "Leans Persuasion."

  This tree provides concrete handles to analyze *how* your appeals work, grounding ethical concerns in observable mechanisms rather than abstract theory. It highlights where the ethical "red lines" are clearer and where your judgment is most needed in the contested zones.
