prompt: |-
  I'm two years into a PhD in cognitive science, and this term I'm auditing a research-methods seminar in which roughly half the readings concern the replication crisis. Our convener assigned a chapter from a recent trade-press book by a science journalist turned methods critic, and the chapter's central argument is condensed into a single passage near its midpoint. I'd rather not name the book, because I don't want my question to turn into a question about the author's reputation; I want to know whether the reasoning holds. Here is the passage, which I've transcribed in full:

  "Fisher's test asks one question: given that nothing is going on, how surprising are these data? Neyman and Pearson asked a different one: given that I must decide, and given that I will be wrong some fraction of the time, which hypothesis should I adopt? What mid-century psychology took over was neither but a muddle of the two, and that muddle is what eventually collapsed. Inside it, a p-value of .03 came to be read as the news that the effect is real, on the reasoning that the false-positive rate has been capped at five percent in the long run — but the long run never arrives, because every experiment is performed exactly once, and how likely a published finding is to be false depends in any case on how plausible it was before anyone collected data, which is something the significance test has no vocabulary for. Fisher proposed the one-in-twenty level only because it was convenient, and would have been appalled to watch it function as a gate on belief. The muddle also explains why the bad practice was so easy. The frequentist machinery is indifferent to what the researcher actually did: whether the sample size was fixed in advance, whether the data were inspected as they accumulated, whether twenty outcome measures were computed and one reported. An error rate is a property of a procedure, and any procedure can be redescribed after the fact so as to make the observed result unremarkable. Bayesian inference closes all of these doors at once. The posterior probability is simply the probability that the hypothesis is true given the data; it can speak for the null as well as against it; and because it is produced by conditionalizing, gathering more data cannot corrupt it. The clinching demonstration came from the notorious parapsychology study that did so much to precipitate the crisis: when the same data were put through a default Bayes factor, the striking p-values dissolved into evidence that was, at most, anecdotal. Had the field's journals demanded Bayes factors instead of significance tests a decade earlier, most of the failures that followed would have been caught before publication, and the crisis would never have acquired its name."

  I have two reasons for asking about this rather than simply absorbing it. The first is that a friend of mine who is a working statistician and an unrepentant Bayesian read the same chapter and called it embarrassing; when I pressed him for specifics he only said that the author had got the arrow backwards on one of the technical claims, and refused to say which, on the grounds that I should be able to find it myself. The second is that I find the conclusion attractive. I came out of my coursework persuaded that Bayesian machinery is the right default, and I can feel that the passage is telling me what I already want to hear, which is exactly the situation in which I most need an outside audit. The sentence I personally found most persuasive is the one about the long run never arriving, so please pay particular attention to whether that is doing real work or merely sounding good.

  Please take the role of an expert on the foundations of statistical inference — someone equally fluent in the mathematics of error rates and Bayes factors and in the philosophical arguments surrounding them, who has argued both sides of this dispute and is not a partisan. Think carefully rather than reaching for the standard list of p-value misconceptions; several sentences here are correct as they stand, and a blanket denunciation would be as unhelpful to me as uncritical acceptance. Begin by sketching the argument structure of the passage in a few sentences, identifying its premises and its conclusion and saying whether the conclusion follows even if the premises are granted. Then go through it sentence by sentence, sorting each into one of three categories: correct as stated, a defensible simplification that a specialist would sign off on, or wrong or seriously misleading. Where you can, say not only which category a sentence falls into but what the accurate version of it would be, and note any case where the chapter reaches a true conclusion by an invalid route. Identify explicitly the place or places where a technical point has been inverted or where two claims that the relevant literatures keep apart have been collapsed into one, and explain the inversion in enough detail that I could have defended it against my friend if I'd understood it. Then tell me what a defender of the error-statistical tradition — one who thinks long-run error control is the right normative target and not a dodge — would say in reply to the chapter's central diagnosis, and where that reply is strongest and weakest. Finish with a short section headed "what survives": which claims from the passage I should keep believing, what minimal revision would make the final recommendation defensible, and which features of the crisis are not problems about the choice of analysis method at all and would therefore be untouched by any such revision. Aim for something between 1,000 and 1,500 words. Please don't give me citations, a bibliography, or a reading list — I want the reasoning, and if it helps to invoke a well-known result or paradox, describe it in prose rather than pointing me to a paper.
reasoning: |-
  Okay, the user is a PhD student in cognitive science auditing a seminar on the replication crisis. They've shared a passage from a book chapter critiquing frequentist statistics and promoting Bayesian methods. They want an expert analysis of the argument's validity, avoiding partisan takes. 

  First, I need to map the passage's structure: it claims that psychology adopted a "muddle" of Fisher and Neyman-Pearson approaches, leading to misinterpretations of p-values and ultimately the replication crisis. The conclusion is that Bayesian methods would prevent this. 

  Hmm, the user mentions two key concerns: their statistician friend called it "embarrassing" with an inverted technical claim, and they personally find the "long run never arrives" argument compelling but worry about confirmation bias. I should pay special attention to that point.

  Let me break this down systematically. The passage mixes valid critiques with oversimplifications. For example:
  - Correct: p-values don't measure evidence for the alternative hypothesis
  - Misleading: Claiming Bayesian methods are immune to data dredging
  - Flat wrong: Saying gathering more data "cannot corrupt" Bayesian results (hello optional stopping!)

  Ah - there's the inverted arrow! The author implies Bayesian inference solves procedural flexibility issues, but actually Bayes factors are highly sensitive to stopping rules too. That's likely what embarrassed the statistician friend.

  For the "long run" point: it's rhetorically powerful but incomplete. While single experiments do exist, error rates matter precisely because science is cumulative. The passage ignores that frequentist methods can be adapted for sequential analysis.

  I should also prepare what an error-statistical defender would say. They'd argue:
  - Strongest reply: Pre-registration and strict protocols address procedural issues without abandoning error control
  - Weakest reply: Dismissing prior plausibility concerns (the "how likely before data" point is valid)

  What survives? The core critique of p-value misinterpretation stands, and Bayesian methods do help with evidence quantification. But the solution isn't as clean as portrayed - no method is magic. Problems like publication bias or HARKing require structural reforms beyond statistical choice.

  The user needs this nuanced because they're intellectually honest - they admit finding the conclusion attractive but want truth. I'll avoid jargon and describe concepts like optional stopping paradox in plain terms. No citations as requested, but I'll reference well-known issues like the Jeffreys-Lindley paradox implicitly.

  Final note to self: Keep the "what survives" section actionable. Recommend Bayes factors as supplementary evidence, not as a mandate to abandon frequentist tools entirely. Emphasize that methodology is just one piece of the replication crisis puzzle.
answer: |-
  ## Expert Analysis of the Statistical Critique

  ### Argument Structure
  The passage argues that psychology adopted a flawed hybrid ("muddle") of Fisherian significance testing (p-values quantifying surprise under H0) and Neyman-Pearson hypothesis testing (long-run error control). This muddle led researchers to misinterpret p-values (e.g., p<0.05 proves H1 true) while ignoring procedural dependencies and prior plausibility. This misinterpretation, combined with researcher degrees of freedom, fueled the replication crisis. The author claims Bayesian inference (specifically Bayes factors) solves these problems by directly quantifying evidence for hypotheses, being immune to data-dependent analyses, and incorporating prior information. The conclusion is that mandating Bayes factors would have prevented the crisis. 

  **Does the conclusion follow?** No. While the critique identifies legitimate problems with *misapplication* of frequentist methods, the leap to Bayesian methods as a panacea does not follow. Many issues (e.g., publication bias, p-hacking intent) persist under any framework. The solution proposed ignores practical challenges and overstates Bayesian immunity to researcher behavior.

  ### Sentence-by-Sentence Analysis

  1.  **"Fisher's test asks one question: given that nothing is going on, how surprising are these data?"**  
      *Category:* **Defensible Simplification.** Fisherian significance testing indeed focuses on the probability of the data (or more extreme) assuming H0 is true (P(D|H0)). It avoids formal alternative hypotheses or error rates.

  2.  **"Neyman and Pearson asked a different one: given that I must decide, and given that I will be wrong some fraction of the time, which hypothesis should I adopt?"**  
      *Category:* **Defensible Simplification.** N-P testing formalizes Type I (α) and Type II (β) error rates, framing testing as a decision rule to control these long-run error probabilities under repeated sampling.

  3.  **"What mid-century psychology took over was neither but a muddle of the two..."**  
      *Category:* **Correct as stated.** This historical claim is well-documented. Textbooks and practice often fused concepts (e.g., using p-values with N-P's language of "accepting/rejecting" hypotheses and implied error rates).

  4.  **"...and that muddle is what eventually collapsed."**  
      *Category:* **Defensible Simplification.** While the muddle *contributed significantly* to the crisis, it's an oversimplification to say it alone "collapsed." Other major factors include publication bias, incentive structures, and questionable research practices (QRPs).

  5.  **"Inside it, a p-value of .03 came to be read as the news that the effect is real, on the reasoning that the false-positive rate has been capped at five percent in the long run..."**  
      *Category:* **Correct as stated.** This *is* a common and catastrophic misinterpretation. P(D|H0) low ≠ P(H0|D) low. The 5% refers to the Type I error rate *only if* H0 is always true, the procedure is fixed, and we consider infinite repetitions.

  6.  **"...but the long run never arrives, because every experiment is performed exactly once..."**  
      *Category:* **Defensible Simplification (but needs context).** This is rhetorically powerful and highlights a key limitation of interpreting a *single* p-value as a guaranteed long-run error probability. However, the *rationale* for controlling long-run error rates is precisely that science *is* cumulative. We perform *many* experiments over time and want procedures that keep us honest in the aggregate. Dismissing error control entirely because "every experiment is performed once" throws out a core statistical safeguard. The valid point is that the long-run error rate doesn't directly tell you the probability *this specific finding* is false.

  7.  **"...and how likely a published finding is to be false depends in any case on how plausible it was before anyone collected data, which is something the significance test has no vocabulary for."**  
      *Category:* **Correct as stated.** This is a crucial point (related to base-rate neglect or the False Positive Risk). The probability a significant finding is a false positive depends critically on the prior probability of H1 (and power). Frequentist methods, by design, do not incorporate prior plausibility. Bayes factors do.

  8.  **"Fisher proposed the one-in-twenty level only because it was convenient, and would have been appalled to watch it function as a gate on belief."**  
      *Category:* **Defensible Simplification.** Fisher did settle on 0.05 pragmatically and railed against rigid adherence to it and the N-P decision framework. He saw p-values as continuous measures of evidence, not binary thresholds for belief.

  9.  **"The muddle also explains why the bad practice was so easy. The frequentist machinery is indifferent to what the researcher actually did: whether the sample size was fixed in advance, whether the data were inspected as they accumulated, whether twenty outcome measures were computed and one reported."**  
      *Category:* **Correct as stated (for the core point).** This is a profound vulnerability. P-values and error rates are properties of the *intended* procedure, not the *actual*, often flexible, process. A p-value computed after data-dependent decisions (peeking, cherry-picking outcomes) loses its nominal interpretation and error control guarantees. This enables p-hacking and HARKing.

  10. **"An error rate is a property of a procedure, and any procedure can be redescribed after the fact so as to make the observed result unremarkable."**  
      *Category:* **Correct as stated.** This directly follows. If the nominal error rate depends on the pre-specified procedure, and the researcher can arbitrarily redefine that procedure post-hoc, the reported error rate becomes meaningless. This is the essence of the "researcher degrees of freedom" problem under frequentism.

  11. **"Bayesian inference closes all of these doors at once."**  
      *Category:* **Wrong or Seriously Misleading.** This is the critical inversion (**"got the arrow backwards"**). While Bayes factors *can* help with *some* issues, they emphatically **do not** "close all these doors." **Bayesian inference is highly sensitive to the stopping rule and data-dependent analysis!** The "optional stopping problem" plagues Bayes factors too. If you keep adding data until you get a BF > 10 for H1, you can guarantee a false positive with high probability. Similarly, cherry-picking outcomes or analyses and *then* computing a Bayes factor invalidates its interpretation as a measure of evidence calibrated by the prior. The *mathematical form* of the posterior update is immune to *when* you stop *only if* you use the correct likelihood incorporating the stopping rule, which is often impractical. In naive application, Bayes factors are just as vulnerable to researcher degrees of freedom as p-values. *Accurate version:* "Bayesian inference, *when based on a fully pre-specified model and analysis plan*, avoids the specific issue of error rates being tied to an intended procedure. However, it remains vulnerable to other forms of data-dependent analysis and requires careful specification of priors."

  12. **"The posterior probability is simply the probability that the hypothesis is true given the data..."**  
      *Category:* **Defensible Simplification.** This is the core Bayesian interpretation (P(H|D)), contrasting with P(D|H). It requires assuming a prior P(H).

  13. **"...it can speak for the null as well as against it..."**  
      *Category:* **Correct as stated.** Bayes factors directly compare H0 to H1. Standard p-values only quantify evidence against H0.

  14. **"...and because it is produced by conditionalizing, gathering more data cannot corrupt it."**  
      *Category:* **Wrong or Seriously Misleading.** This is dangerously false. "Corrupt" is vague, but gathering more data *absolutely can* change the Bayesian conclusion in undesirable ways if done data-dependently (see optional stopping above). Furthermore, with uninformative or mis-specified priors, gathering more data doesn't necessarily lead to the "right" conclusion. The claim also ignores the Jeffreys-Lindley paradox, where frequentist significance and Bayesian evidence can drastically diverge, especially with large n. *Accurate version:* "The Bayesian update rule is consistent: under correct model specification and with sufficient data, the posterior will concentrate on the true parameter value. However, data-dependent sampling can still distort evidence quantification."

  15. **"The clinching demonstration came from the notorious parapsychology study... the striking p-values dissolved into evidence that was, at most, anecdotal."**  
      *Category:* **Defensible Simplification (if referring to a specific case).** Reanalyzing Bem's (2011) "feeling the future" studies with Bayes factors did show much weaker evidence than the p-values suggested. This *illustrates* how BF can account for low prior plausibility (via the prior) and avoid over-interpreting small p-values. It doesn't "clinch" the broader argument.

  16. **"Had the field's journals demanded Bayes factors instead of significance tests a decade earlier, most of the failures that followed would have been caught before publication, and the crisis would never have acquired its name."**  
      *Category:* **Wrong or Seriously Misleading.** This vastly overstates the case. While BF *might* have prevented *some* implausible findings (like Bem's) from being published *as strong evidence*, it ignores that:
      *   QRPs (p-hacking, HARKing) could still be applied to Bayes factors.
      *   Publication bias favoring "significant" BF > X would still exist.
      *   Poorly chosen or overly narrow priors could distort results.
      *   Many replication failures involved effects with high prior plausibility but were smaller than initially reported or false positives that survived initial BF thresholds.
      *   Technical challenges (computational complexity, prior specification debates) were significant a decade ago.

  ### Error-Statistical Defense: Reply to the Diagnosis
  A defender of error statistics (e.g., following Mayo's Severe Testing framework) would argue:

  *   **Strongest Reply:** The problem is *misuse* and *misinterpretation*, not the core logic of error control. Properly applied frequentist methods *are* the solution. This involves:
      *   **Pre-specification:** Fixing hypotheses, sample size, and primary analyses *in advance* via pre-registration.
      *   **Severity Principle:** Interpreting a passing test (e.g., p < α) as evidence *for* H1 only if it was highly probable the test would have *failed* (detected an inconsistency) if H1 were false. This moves beyond pure N-P decision rules towards evidence assessment while maintaining error control.
      *   **Robust Methods:** Using techniques less sensitive to assumptions (e.g., randomization tests) and emphasizing effect sizes/CIs.
      They would argue this directly addresses the procedural flexibility ("what the researcher actually did") critique by enforcing transparency and pre-specification. Error control remains essential for the cumulative, public nature of science. The "long run" matters because unreliable procedures pollute the literature over time.
  *   **Weaker Reply:** Dismissing the importance of prior plausibility. While error statisticians acknowledge background knowledge informs hypothesis generation, they argue formal incorporation of priors introduces subjectivity and risks letting strong priors overwhelm data. They contend severity assessments can indirectly incorporate plausibility (e.g., requiring *more* severe tests for less plausible claims).

  ### What Survives?

  **Claims to Keep Believing:**
  1.  The historical "muddle" of Fisher and N-P occurred and contributed to confusion.
  2.  The misinterpretation of p-values (p<.05 = proof H1 true) is endemic, wrong, and damaging.
  3.  The *nominal* frequentist error rate (α) is invalidated by data-dependent analysis (peeking, cherry-picking outcomes/analyses). Researcher degrees of freedom are a major vulnerability.
  4.  The probability a significant finding is a false positive depends heavily on the prior plausibility of H1 and the power of the test. P-values alone don't tell you this.
  5.  Bayes factors offer valuable advantages: directly comparing H0 and H1, incorporating prior information, and providing a continuous measure of evidence strength. They would likely have tempered enthusiasm for findings like Bem's.

  **Minimal Revision for Defensible Recommendation:**
  Instead of mandating Bayes factors *instead* of significance tests, advocate for **a toolbox approach prioritizing transparency and pre-specification:**
  *   **Pre-registration + Analysis Plans:** Essential *regardless* of method, to combat data-dependent flexibility (the core vulnerability).
  *   **Demand Effect Sizes & CIs:** Always.
  *   **Encourage Bayes Factors (or Posteriors) as Supplements:** Particularly where prior plausibility is contentious or where evidence *for* H0 is relevant. Acknowledge the challenges of prior specification and sensitivity to stopping rules.
  *   **Focus on Severity/Evidential Interpretation:** Move beyond binary "significant/non-significant" for *any* statistic (p-value or BF). Emphasize *how well* the data test the claim.

  **Features Untouched by Choice of Analysis Method:**
  The replication crisis has roots far deeper than statistics:
  *   **Publication Bias:** Journals favoring "positive" results regardless of method.
  *   **Incentive Structures:** Rewarding novelty, impact, and quantity over rigor and reproducibility.
  *   **Questionable Research Practices (QRPs):** Intentional p-hacking, HARKing, selective reporting – these can be applied to *any* statistical output (p-value, BF, effect size).
  *   **Lack of Replication Culture:** Needed to validate findings under any framework.
  *   **Statistical Illiteracy:** Misinterpretation isn't exclusive to p-values (e.g., misinterpreting BF, priors, CIs).
  *   **Small, Underpowered Studies:** A problem for both frequentist and Bayesian inference.

  **Conclusion:** The passage correctly diagnoses key symptoms (p-value misinterpretation, neglect of prior plausibility, vulnerability to researcher degrees of freedom) but misattributes the disease solely to the choice of statistical paradigm. Its prescription (mandate Bayes factors) is simplistic and overreaching, ignoring Bayesian vulnerabilities and the broader systemic causes of the crisis. The core statistical lesson is the paramount importance of **pre-specified, transparent research protocols** combined with a move towards **evidential statistics** (whether grounded in severity, Bayes factors, or other approaches) that emphasize quantification and interpretation of evidence over binary decisions, while acknowledging the role of prior knowledge. No statistical method is immune to bad practice or poor design.
