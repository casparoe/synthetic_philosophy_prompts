  The core tension screams meta-disagreement: it’s about what counts as a valid reason for action. The friend sees only causal levers; the user sees correlated epistemic states as inherently relevant. This isn’t just verbal—their clash over "admissible evidence" in decision-making reveals divergent foundations. When the friend dismisses symmetry as "question-begging," they’re really rejecting the superrationalist’s entire frame.  

  Platonia is the litmus test. The user’s intuition—that symmetry + randomization "does genuine work"—highlights where dominance reasoning crumbles under perfect symmetry. But their friend’s retort ("mixed-strategy smuggling") exposes the rift: is randomization a tool within standard game theory, or does symmetry create a novel decision logic? This isn’t the same dispute as PD; it’s a stress test for symmetry’s scope.  

  Progress? Forget asymmetric cases—they’ll just reignite the "evidential vs. causal" war. Instead, formalize the epistemic preconditions: What *degree* of mutual knowledge justifies symmetry? A model quantifying "reasoner transparency" could turn metaphysical waffle into testable thresholds. Also, reframe superrationality as *dynamic*: if players pre-commit to symmetry-based rules (e.g., "always cooperate if we’re clones"), does this collapse into rational choice? That might dissolve the stalemate by making the implicit explicit.  

  The residue? A bare insight: under perfect symmetry, "I" am a sample of "us." But outside thought experiments, we’re never clones—so the real value is in mapping how *imperfect* similarity affects cooperation. That’s where superrationality stops being magic and becomes measurable psychology.
answer: |-
  Your impasse isn't just philosophical gridlock—it's a collision of irreconcilable **meta-normative commitments** about what constitutes a valid reason for action. Below is a diagnosis keyed to your positions, followed by a path to potential progress:

  ### The Core Disagreement: What Counts as a "Reason"?
  1. **Your friend's stance** rests on **causal exclusivity**:  
     - Only *causal influence* over outcomes is decision-relevant. Dominance reasoning isn't "assuming" this—it's *defining* rationality as controlling your action given fixed external conditions (including others' actions).  
     - Calling symmetry "magical" isn't a dismissal; it's the claim that *correlation without causation cannot justify action*. Superrationality either smuggles in causation (via "influence") or reduces to evidential decision theory (EDT), which they reject as irrational (e.g., it endorses Newcomb-like "rationality").

  2. **Your stance** relies on **epistemic admissibility**:  
     - When agents know they are symmetric reasoners, the *correlation between their decisions* becomes a direct input to rationality—not through control, but because it redefines the choice context.  
     - Dominance arguments *do* beg the question by excluding this correlation from the outset. Platonia shows why: with perfect symmetry, "I am the sole sender" is an impossible state—randomizing at 1/20 is the only way to satisfy the winning condition *given mutual knowledge of rationality*.

  3. **The middle camps** expose the fault lines:  
     - **Empirical camp**: Superrationality is a claim about human psychology (do we reason identically?). This *avoids* the normative clash but collapses under perfect symmetry thought experiments.  
     - **Metaphysical camp**: Only identical agents (not just similar) justify symmetry. This concedes that superrationality isn't game theory but a niche metaphysics.

  ### Why Platonia ≠ Prisoner's Dilemma (PD)
  Your friend is wrong that Platonia is "PD with mixed strategies." The disputes differ fundamentally:  
  - **PD dispute**: Is correlated agency ever decision-relevant? (Causal vs. epistemic norms).  
  - **Platonia dispute**: *How* to act under *inescapable* symmetry? Here, dominance fails catastrophically (no pure strategy works), while symmetry + randomization succeeds. This isn't EDT—it's symmetry constraining the *feasible set of outcomes*. Platonia forces even causalists to confront that their framework lacks tools for this edge case.

  ### The Verbal Trap: "Rationality"
  The term masks two concepts:  
  - **Instrumental rationality** (friend): Maximize utility given *causal levers*.  
  - **Symmetry-compatible rationality** (you): Maximize utility given *epistemic constraints on agency*.  
  You’re not disagreeing about facts but about *which goal rationality serves*.

  ### Paths to Progress
  1. **Formalize epistemic preconditions**:  
     Define exactly when agents are "relevantly alike":  
     - What level of mutual knowledge (e.g., "we both know we use the same algorithm") is required?  
     - Develop a model where *transparency of reasoning* is a variable. This could isolate when symmetry overrides dominance.

  2. **Test asymmetry**:  
     Construct a game with *known, asymmetric reasoning* (e.g., Agent A uses dominance, Agent B uses superrationality). If superrationality prescribes different acts than EDT *and* causal decision theory (CDT), it escapes the "label" critique. Example: A trillionaire says they'll award $1B if your decisions are identical but penalizes coordination if your algorithms differ.

  3. **Reframe as dynamic choice**:  
     Superrationality may be defensible as a *pre-commitment device*: "If we agree ex ante to act as symmetric reasoners, we bind ourselves to mutual cooperation." This sidesteps "magic" by making it a coordination norm—but concedes it’s not fundamental rationality.

  4. **Dissolve via decision relativity**:  
     Argue that "rationality" is context-dependent:  
     - Causal dominance for asymmetric, strategic contexts.  
     - Symmetry reasoning for identical agents in symmetric games.  
     The residue? A map of *which tool fits which social ontology*.

  ### If Progress is Impossible
  The residue is this: **Under perfect symmetry, "I" am a statistical instance of "we."** Acting as if your decision "stands for" the group is the only way to achieve certain collective goals (Platonia). But outside thought experiments, we lack evidence that humans are ever such identical reasoners. Superrationality’s value is thus diagnostic—it shows the limits of causal individualism in extreme cases, not a general theory.

  ### Conclusion
  Your debate is **substantive and meta-normative**. Platonia reveals a genuine hole in standard game theory that superrationality fills, but its extension to PD requires accepting that *epistemic correlation can be reason-giving*. Progress lies in rigorously defining the "relevantly alike" criterion or showing superrationality outperforms EDT/CDT in asymmetric cases. Until then, it remains a provocative boundary case, not a revolution.
