    ],
    "cost_ranking": [<six integers>],
    "bottom_line": <string, one or two sentences>
  }
  ```

  `alternatives` must contain exactly six entries, one each for steps 1, 2, 5, 6, 7, and 8, in ascending order. `positions_committed_to_it` uses short generic labels for the positions described above, not names. `cost_ranking` lists those same six steps ordered from cheapest to most expensive to reject.
