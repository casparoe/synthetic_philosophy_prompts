prompt: |-
  I cover science and ideas for a general-interest magazine — mostly AI and neuroscience — but I spent six years as a commercial contracts solicitor before that, and doctrine is still the language my brain defaults to. I'm working on a piece about software that commits: agents that accept terms, book slots, agree to arbitrate, tell a user "done, that's settled." To get the philosophy straight I need a translation, not a survey.

  Take the debate over why promises bind — Hume's conventionalist story, Rawls's practice conception, the reliance-based line (Atiyah, Thomson), Scanlon's expectation-based account, Fried's view that contract law is basically the morality of promise enforced by courts, and the will- or autonomy-based line that treats a promise as handing someone temporary authority over a bit of your own future conduct — and restate each in the vocabulary I already have: offer and acceptance, consideration, reliance and promissory estoppel, expectation vs reliance damages, capacity, duress, void versus voidable, the objective theory of assent. Don't smuggle the philosophy in under legal labels and call it translation; if a term does double duty, flag it.

  Then the residue report, which is the part I actually care about: which claims map cleanly, which only fit if you distort them, and which have no counterpart in doctrine at all. My hunch — tell me if it's wrong — is that the lawyers already answered the philosophers and answered them no: the courts refused to enforce the bare promise and invented consideration to stand in for it, so "does promising by itself create an obligation" got settled negatively by the people who had to make the thing work.

  And does anything shift when the promisor is software? Where residue is doing real work, say whether its a hole in the legal vocabulary or a sign the philosophical question was never well posed.
reasoning: |-
  Okay, let me approach this systematically. The user is a science writer with legal background, asking for philosophical concepts translated into contract law terms without conceptual smuggling. The core challenge is mapping promise theories onto doctrine while identifying irreducible gaps.

  First, breaking down the philosophical positions:
  Hume's conventionalism seems closest to promissory estoppel - both ground obligation in social patterns rather than inherent promise power. But the damages mismatch (reliance vs expectation) shows doctrine doesn't fully buy the equivalence. 

  Rawls' practice conception is trickier. The "void if no consideration" rule might seem analogous, but doctrine's exceptions (like nominal consideration) reveal it's not truly constitutive like Rawls suggests. The mapping distorts both concepts.

  Scanlon's expectation-based account appears cleanly reflected in expectation damages... until you recall courts require bargained-for exchange. The philosophical focus on harm prevention doesn't align with contract law's transaction-first lens.

  For the autonomy theories (Fried, will-based views), consideration doctrine is the clearest rebuttal. Courts deliberately rejected naked promises, creating a system where obligation stems from reciprocal exchange, not mere commitment. 

  Now the software angle: capacity doctrine becomes the critical friction point. When the promisor isn't human, the entire foundation of intentionality crumbles. The residue here isn't just a gap - it exposes how all promise theories implicitly assume human consciousness. 

  The user's hunch about lawyers answering philosophers seems correct, but with nuance. Doctrine didn't just say "no" to bare promises; it constructed an alternative system where obligation emerges from structured interaction. The real philosophical residue may be in the unspoken assumptions about what counts as a promisor in the first place.
answer: |-
  Here's the translation you requested, followed by the residue report. I've strictly used the specified legal vocabulary, flagged double-duty terms, and assessed the mapping fidelity for each philosophical position.

  **Translation: Philosophy -> Doctrine**

  1.  **Hume (Conventionalism):** A promise creates an obligation *only* because society has established a convention that such utterances trigger reliance and expectation. Enforcing it maintains social stability and predictability.
      *   **Doctrinal Mapping:** Primarily **reliance** (detrimental action based on the utterance) and **objective theory of assent** (society interprets "I promise" as binding, regardless of inner intent). Damages would likely be **reliance damages** to undo harm from reliance, not necessarily enforce the promise itself. **Consideration** (if present) is evidence of the convention/seriousness, not the *source* of obligation. The obligation flows from the *social effect*, not the utterance itself.
      *   **Double-Duty Flag:** "Reliance" here is the *source* of obligation (philosophical), while in doctrine, "reliance" via **promissory estoppel** is a *ground* for enforcement *despite* lack of consideration (legal).

  2.  **Rawls (Practice Conception):** A promise only creates an obligation *within* the existing social practice of promising. The practice defines the rules (including enforcement), and participating in it binds you to its norms. Obligation arises from playing the "game" correctly.
      *   **Doctrinal Mapping:** The entire institution of **contract law** (offer, acceptance, consideration, enforcement) *is* the practice. **Consideration** is the key ritual signaling entry into the practice. A **void** promise (e.g., illegal, lacking capacity) falls outside the practice. **Objective theory of assent** confirms participation according to the practice's rules.
      *   **Double-Duty Flag:** "Practice" maps directly to the institutional structure of contract law doctrine itself.

  3.  **Atiyah/Thomson (Reliance-Based):** The obligation arises from the promisee's **reliance** on the promise, which causes a change in their position (detriment or benefit foregone). The promisor's initial commitment is less important than the consequences of the promisee's actions.
      *   **Doctrinal Mapping:** Directly maps to **promissory estoppel**: a promise reasonably inducing **reliance** can be enforced to avoid injustice, even without **consideration**. Damages are typically **reliance damages**.
      *   **Double-Duty Flag:** "Reliance" is core to both the philosophical source *and* the doctrinal ground (**promissory estoppel**).

  4.  **Scanlon (Expectation-Based/Moral Wrong of Disappointment):** Breaking a promise is wrong because it intentionally creates a justified expectation and then disappoints it, violating a principle against manipulating others' expectations. The harm is the disappointment itself.
      *   **Doctrinal Mapping:** Strongly maps to **expectation damages** – putting the promisee in the position they would have been in had the promise been kept, directly compensating for the disappointed expectation. **Objective theory of assent** establishes the *justified* expectation. Requires **offer and acceptance** to form the expectation-generating relation.
      *   **Double-Duty Flag:** "Expectation" is central to both the philosophical wrong *and* the primary doctrinal remedy (**expectation damages**).

  5.  **Fried (Contract as Promise/Morality Enforced):** The core obligation is the moral duty inherent in the promise itself. Contract law exists solely to enforce this pre-existing moral obligation using state power. **Consideration** is a formality, not the essence.
      *   **Doctrinal Mapping:** Poor fit. Doctrine fundamentally rejects enforcing the "bare moral promise." **Consideration** is required precisely to *distinguish* legally enforceable promises from moral ones. While **offer and acceptance** show mutual assent, they alone are insufficient without **consideration** or **reliance** triggering **promissory estoppel**. **Expectation damages** enforce the *outcome* of the promise, but only *if* it meets doctrinal requirements.
      *   **Double-Duty Flag:** "Promise" for Fried is the *moral core*, while in doctrine, a "promise" is only potentially enforceable if wrapped in **consideration** or **reliance**.

  6.  **Will/Autonomy Theories:** A promise is an act of autonomy where the promisor voluntarily transfers a limited authority over their future actions to the promisee. The obligation stems from the promisor's own exercise of will.
      *   **Doctrinal Mapping:** Maps to **capacity** and **duress** (ensuring the will is free and informed) and **void vs. voidable** (distinguishing invalid exercises of will from those that can be affirmed or rejected). **Offer and acceptance** reflect the mutual exercise of will. However, **consideration** intrudes – the law demands evidence of a *bargained-for exchange* of wills, not just an autonomous commitment. A naked promise of a gift, however autonomously made, is generally unenforceable.
      *   **Double-Duty Flag:** "Will" and "autonomy" are protected *conditions* in doctrine (**capacity**, no **duress**) but are not *sufficient* grounds for enforcement without **consideration** or **reliance**.

  **Residue Report: What Doesn't Map (and Why)**

  1.  **Hume's Pure Convention:** Maps fairly cleanly to **reliance** + **objective theory**, *except* for damages. Doctrine allows **expectation damages** for breach of contract, enforcing the promise itself, not just remedying reliance harm. Hume's theory struggles to explain why society would demand the *fulfillment* rather than just compensation for harm caused by inducing reliance. The **expectation damages** remedy is a residue of something more than convention (perhaps efficiency, autonomy, or Scanlonian disappointment).
  2.  **Rawls's Practice Constitutive Power:** Maps superficially to the institution, *but* distorts both sides. Rawls suggests the *practice itself* defines the obligation. Doctrine has fuzzy edges (**promissory estoppel**, nominal **consideration**) where enforcement happens despite imperfect participation in the "ritual." Conversely, doctrine uses **consideration** as a bright-line filter, while Rawls's practice might be more holistic. The residue is **consideration**'s formal rigidity vs. the philosophical conception's potential fluidity.
  3.  **Scanlon's Core Moral Wrong (Disappointment):** Maps very cleanly to **expectation damages** and **objective assent** *once a contract exists*. **BUT**, the critical residue is **consideration**/**reliance**. Scanlon's principle seems to apply to *any* promise inducing *justified* expectation. Doctrine says "No": only promises with **consideration** or inducing **reliance** get **expectation damages**. The philosopher asks "Is this promise-breaking morally wrong?" The lawyer asks "Is this promise *enforceable*?" and uses **consideration**/**reliance** as the gatekeepers. The moral wrong of disappointing a non-bargained-for, non-relied-upon promise has *no direct doctrinal counterpart*. Doctrine answered "We won't enforce that kind of promise, regardless of the moral wrong."
  4.  **Fried's Pure Promise/Morality:** **This maps poorly and confirms your hunch.** The huge residue is **consideration**. Doctrine loudly answers Fried: "No, the bare moral promise *is not* the core of contract law. We require **consideration** (or **reliance**)." Fried's view is fundamentally at odds with the central doctrinal mechanism distinguishing enforceable agreements from unenforceable intentions/moral commitments. The law deliberately *rejected* Fried's premise.
  5.  **Will/Autonomy's Transfer of Authority:** Maps cleanly to **capacity**, **duress**, **void/voidable** (protecting autonomy) and **offer/acceptance** (exercising autonomy). **BUT**, the residue is **consideration**. Autonomy alone isn't enough. You can autonomously promise a gift (transferring authority over your future act of giving) and doctrine still won't enforce it without **consideration** or **reliance**. The law prioritizes *reciprocal* exchanges of autonomy (bargains) over unilateral exercises of autonomy (gift promises). The pure philosophical act of "handing someone temporary authority" has no direct enforceability unless packaged with **consideration**.

  **Your Hunch: Confirmed (with Nuance)**
  You are correct: Doctrine fundamentally answered "No" to the enforceability of the bare promise. **Consideration** (and later **promissory estoppel** as a limited supplement) *are* the mechanisms by which the law filtered out the purely moral or autonomous promise, focusing instead on bargained-for exchange or detrimental reliance. The core philosophical question "Does promising *by itself* create an obligation (moral or otherwise)?" is distinct from "Which promises will courts enforce?" Doctrine answered the *latter* by inventing **consideration**, implicitly rejecting the enforceability of the former. Philosophers often grapple with the former; doctrine operationalizes the latter.

  **The Software Promisor Shift: Where Residue Does Real Work**

  1.  **The Capacity Gap:** This is the critical residue now doing real work. **Capacity** is a doctrinal concept assuming human attributes (intent, understanding, free will). Software lacks these. Mapping any philosophy based on human intention, will, autonomy, or moral agency (Hume's convention, Scanlon's intentional disappointment, Fried's morality, Will theories) onto software hits this wall. The residue exposes a **hole in the legal vocabulary**. Doctrine has no clear, uncontested category for "non-human agent capable of forming the requisite intent for **offer and acceptance** or possessing **capacity**." Is it the programmer? The user? The algorithm itself (a non-starter under current doctrine)? This residue isn't poorly posed philosophy; it's a fundamental limitation of doctrine built for humans.
  2.  **Objective Assent vs. Inner State:** **Objective theory of assent** becomes *more* crucial and potentially sufficient for software. If a reasonable user perceives the software's output ("done, that's settled") as **acceptance**, doctrine might enforce it *regardless* of the software's lack of subjective intent (which it can't have). This could map *better* to Hume (convention of interpreting machine outputs) or Rawls (participation in a practice where machines are conventional actors) than to theories relying on inner states (Will, Scanlon's intentional disappointment, Fried's morality). The residue of philosophical theories demanding *actual* intent or moral agency becomes starkly apparent as a potential **hole** when applied to software.
  3.  **Reliance & Estoppel:** This remains a strong potential ground. If a user **relies** detrimentally on the software's commitment, **promissory estoppel** could apply, sidestepping the **capacity**/**intent** issue for the *promisor*. The focus shifts to the *user's* reasonable belief and action. This maps well to Atiyah/Thomson and aspects of Hume. The residue here is less problematic; reliance doctrine seems adaptable.
  4.  **Consideration's Persistence:** **Consideration** (a bargained-for exchange) likely remains essential for standard contract formation by software agents. The software agreeing to do X because the user did Y (paid, provided data) fits the doctrine cleanly. The residue (philosophical questions about *why* promises bind) becomes less relevant if the transaction meets the doctrinal formalities. The focus shifts to whether the software's actions validly constitute **offer and acceptance** within an exchange.

  **Conclusion on Residue:** The unmapped residue primarily reveals:
  *   **Doctrinal Gaps:** The **capacity** hole for non-human promisors is the most significant. Doctrine lacks the tools.
  *   **Philosophical Assumptions Exposed:** Theories grounded in human-specific attributes (intent, will, moral agency) hit the **capacity** wall when applied to software, showing they were implicitly anthropocentric. This isn't necessarily poor posing; it's encountering a novel scenario.
  *   **Doctrine's Pragmatic Answer:** Your hunch is validated. Doctrine long ago settled that the "bare promise" isn't enough. **Consideration** and **reliance** are the pragmatic answers to "What promises should courts enforce?" not philosophical inquiries into the nature of promising itself. Software forces us to confront whether these doctrines can function without human promisors possessing intent/capacity, highlighting their anthropocentric foundations. The residue where philosophy (especially Fried, Will, Scanlon) and doctrine clash most is precisely where **consideration** stands as doctrine's rebuttal to enforceability based on promise alone.
