answer: |-
  *Clearing scattered papers from a walnut table, squinting at a diagram*  
  **What I grant you:** I grant that common almanac-makers draw the same circles I do, and that their rash prophecies bring the art into disrepute. I grant too that the soul’s apprehension of celestial harmony remains speculative—a faculty not yet dissected by anatomy.  
  **My answer:** The efficacy lies neither in bare geometry alone nor in the soul’s whim, but in their congress. The angle *is* the conduit—the precise convergence of rays, measurable as two strings’ length yields a chord. These rays stir the sublunary air and waters, imprinting seasons upon weather and humors. The soul, tuned by Creation to cosmic harmony, *resonates*—not inventing, but answering that impression, as a lute answers its plucked neighbor. Thus the common stargazer errs twice: he mistakes the zodiac’s arbitrary houses for true causes, and he ignores how terrestrial decay muddies the signal. My weather journals prove aspect-angles move tempests and droughts; my nativities trace temperament. Geometry is the harpist; the soul is the harp.  
  **What I require of you:** When you observe spring’s rains breaking under a waxing sextile of Venus and Jupiter—or a fever’s crisis in hard aspect to Mars—by what other natural cause do *you* account for it?  

  ---

  *Leans forward, ink-stained fingers tapping the table*  
  You demand I choose between geometry and soul? Physician, you carve nature at the wrong joint. The ray’s angle is the *agent*; the soul’s resonance is the *passion*. Consider: does sunlight warm stone by geometry alone, or by the stone’s capacity to be warmed? Both! The aspect concentrates celestial virtue—as a burning-glass gathers scattered beams—to kindle earthly responses. Your quibble that vulgar calculators draw the same lines is like saying two apothecaries with identical herbs must brew equal tinctures. One discerns Saturn’s melancholic ray *through* putrid air; the other blames Saturn for every ague. I discard their imaginary rulerships and houses because they are *not* in the heavens—while the aspects are etched in light itself. Show me a year when the Great Conjunction of Saturn and Jupiter did *not* alter the breed of plants or the temper of kingdoms, and I will reconsider. Have you compared my weather predictions with those of your almanacs?  

  *Pauses, hearing distant church bells*  
  You speak of superstition—yet what is more superstitious than denying the sky’s palpable work? When I charted the comet of ‘07, its square to Mars preceded fires in half the towns between here and Linz. Coincidence? Compile such "coincidences" across decades and they become a calculus. I do not excuse the follies sold for pennies at fairs. But your master Feselius, in burning the chaff, burns the wheat. God wrote the world in geometry; shall we call Euclid a necromancer? The aspects are His characters. If you physicians dismiss them, how do you explain the critical days of diseases—those junctures when the Moon’s return to her natal place so often turns the balance? Admit it: you *use* this knowledge even as you scorn its source. What then is your quarrel with me? That I refuse to cloak ignorance in piety?  

