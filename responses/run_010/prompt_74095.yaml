prompt: |-
  So I run a monthly reading group with a mix of physics grad students and two people who just like the genre, and this month's theme was "probability in a world where everything happens." It turned into a shouting match. One of the physicists swore the Deutsch/Wallace decision-theory route basically settles it — any rational agent in a branching universe is forced to bet in proportion to squared amplitude, done, and Zurek's envariance argument points the same way. One of the philosophers said that's just hiding the answer inside whatever axioms about rational preference you picked, and that you can run the same trick to derive branch-counting if you start from different axioms. A third guy said forget all of it, count the branches, each one is a person, and got absolutely piled on for assuming there even is a well-defined number of branches to count — which I thought was actually the most interesting five minutes of the night, because decoherence only ever gives you a fuzzy, approximate decomposition, and the Tally position needs it to be crisp. Nobody budged. I think the argument would land better as a story than as a fourth round of the same three positions.

  So here's what I want: a short story, somewhere around 1,500–2,500 words, set in a place where branching isn't a metaphysical claim anybody argues about, it's just infrastructure, like plumbing. My seed, use it or bend it: a habitat called the Loom, where the Office of Apportionment employs clerks whose job is to set the amplitude schedule before any controlled split — a clinical trial, a ship launch, a sentencing. Everything downstream is allocated by weight: inheritance, votes, rations, jail time. There's a legal fiction called the Sufficient Weight Doctrine, under which branches that come out below some tiny amplitude threshold simply aren't persons for census purposes — nobody downstream of them has standing, and the people who live in them are referred to, not kindly, as "the thin." There's a heretical movement, the Tally, that wants one branch one share regardless of amplitude, which would quietly transfer almost everything from the heavy branches to the thin ones, so the metaphysics has a price tag attached and everybody knows it. Before a split, citizens file a sealed instruction addressed to whichever copy of them survives, and the clerks audit these for coherence — which is where I'd like someone to run into the wall head-on, because what does "I hope it's me in the heavy one" even mean when both of them are you and both of them get the letter. The plot engine: a clerk has to schedule a three-way split at one-half, one-quarter, one-quarter for a trial that kills in some continuations, and discovers that the Doctrine's threshold means somebody she loves is scheduled to come out thin — under the Born reading she's a rounding error, under the Tally reading she's a full third of the outcome, and the clerk is the one holding the pen. Feel free to also give her a clean exact tie somewhere, a fifty-fifty she has to break with nothing in the theory to break it with, because I want that moment to be as uncomfortable as the weighted one.

  A few things I care about: the story should stage at least two of the positions — the decision-theoretic derivation, the self-locating-uncertainty move, naive counting, some variant of "just care about all your future selves and stop asking which one you'll be" — without turning anyone into a strawman or a mouthpiece, and it should hit the circularity worry at least in passing, the fact that the only way anybody on the Loom ever checks the schedules is by looking at frequencies across lots of repeated splits, which kind of assumes the thing under dispute. No named real physicists, no papers cited, no lecture about Hilbert space — one line of amplitude-squared notation is the most math I want, and the characters should treat all of this the way we treat tax law, with boredom and resentment. Don't resolve the philosophy with a speech; let the institutions and the deadline and the audit do the work, and let people be wrong in ways that make sense from where they're standing. End on the clerk's decision, whatever she picks, and make the reader genuinely unsure whether it was the rational one — I don't want a story that secretly takes my side, I want one that would make the physicist and the philosopher both leave the room arguing. Oh, and dont sweat the mechanism of the splitter, hand-wave it like an elevator, the hardware is not the point.
reasoning: |-
  Okay, the user runs a monthly reading group that had a heated debate about probability in a branching universe. They want a short story set in a place called the Loom, where branching is mundane infrastructure. The story should explore different philosophical positions without resolving them and focus on a clerk who must set amplitude schedules for splits, facing personal stakes when someone she loves might become "thin."

  The user provided a detailed seed: the Loom habitat, the Office of Apportionment, the Sufficient Weight Doctrine, the Tally movement, and the sealed instructions citizens file before splits. The clerk's dilemma involves a three-way split where her loved one could be rendered non-existent under the Doctrine. The story should also include a 50/50 split decision to highlight arbitrariness.

  Key elements to include:
  - **Philosophical Positions**: Cover at least two - decision-theory (Deutsch/Wallace), self-locating uncertainty, naive branch-counting (Tally), and caring equally about all futures. Present these through characters' actions and conflicts, not lectures.
  - **Circularity Concern**: Show how the Loom verifies schedules through observed frequencies, which presupposes the Born rule, subtly highlighting the circularity.
  - **Personal Stakes**: The clerk, Aris, must assign amplitudes in a trial that could kill participants. Her lover, Kael, is in the trial. The 1/4 amplitude branch would make Kael "thin," erased from existence per the Doctrine.
  - **Institutional Pressure**: The bureaucracy, audits, and legal constraints should drive the conflict. Aris faces a deadline and must ensure her actions pass the audit without clear guidelines for ties.
  - **Ambiguous Ending**: Aris makes a decision, but it shouldn't be clear if it's rational. The reader should feel uncertain, leaving room for debate.

  Characters:
  - **Aris**: The clerk, pragmatic, tired of the philosophy, focused on her job. She represents the institutional viewpoint but faces personal conflict.
  - **Kael**: Her lover, part of the clinical trial. His survival in a low-amplitude branch is at stake.
  - **Silas**: A Tally-sympathizing auditor who questions Aris's decisions, embodying the opposition.
  - **Marlo**: A philosopher friend who discusses self-locating uncertainty, adding depth to the debate.

  Plot Structure:
  1. **Opening**: Introduce the Loom, Aris's routine job, the upcoming three-way split for the trial.
  2. **Inciting Incident**: Aris discovers Kael's involvement and the risk of him becoming thin.
  3. **Rising Action**: 
     - Aris processes sealed instructions, including Kael's ambiguous note.
     - She faces a 50/50 split for a supply chain test, highlighting arbitrariness.
     - Silas audits her, challenging her decisions and representing Tally arguments.
  4. **Climax**: Aris must set the amplitudes. She weighs her options, influenced by the need to save Kael and pass the audit.
  5. **Resolution**: She sets the amplitudes as 0.6, 0.2, 0.2, deviating from the protocol to keep Kael above the threshold. The ending is ambiguous, showing her uncertainty.

  Themes to weave in:
  - **Institutional Critique**: The Doctrine dehumanizes the thin, reflecting real-world issues like marginalization.
  - **Personal vs. Professional**: Aris's conflict between duty and love.
  - **Philosophical Tensions**: Through dialogues with Silas and Marlo, explore different positions without resolution.

  Ensuring Ambiguity:
  - Aris's decision is practical, not philosophical. Her internal struggle shows doubt, but she acts to save Kael.
  - The story doesn't endorse any position. Silas's critique remains valid, and the circularity of frequency checks is evident.
  - The ending focuses on Aris's uncertainty, leaving the reader questioning if her choice was rational or biased.

  Avoiding Pitfalls:
  - **No Strawmen**: Silas and Marlo have valid points. The Tally movement's argument about fairness is presented sympathetically.
  - **Minimal Math**: Only mention amplitude-squared once, as part of the audit process.
  - **Hardware Hand-Waving**: The splitter mechanism is treated like an elevator, not explained.

  This approach ensures the story meets the user's needs: a compelling narrative that stages philosophical debates through personal and institutional conflict, ending ambiguously to provoke discussion.
answer: |-
  ## The Weight of Inheritance

  Aris hated the splitter vaults. Not the hum – a constant, subsonic thrumming that vibrated in your molars – nor the sterile, ozone-tinged air. She hated the *decisions*. Not the big metaphysical ones the philosophers screamed about in the Commons, but the small, brutal arithmetic that came before the hum peaked and the Loom spun off another thread of reality. Today, the decision felt less like arithmetic and more like slow vivisection.

  The request form glared from her console: **Clinical Trial: Neuroregenerative Agent X-7**. **Split Profile: Ternary. Outcome Vectors: Full Recovery (FR), Partial Recovery with Cognitive Impairment (PR-CI), Terminal Neurological Cascade (TNC). Amplitude Schedule: To be determined by Clerk Grade 3 Aris Thorne, Office of Apportionment.** Below, the cold facts: thirty participants. High-risk protocol. Death was a probable branch.

  And one of the names listed was Kael.

  Her Kael. Who’d joked about signing up for the "brain juice lottery," desperate for the credits after his own mother's thin-line inheritance left him scrambling. Who hadn’t mentioned the *terminal cascade* part. Who was now a set of probabilities waiting for her pen.

  Aris rubbed her temples. The vault’s hum felt louder. Across the cavernous, white-tiled chamber, other clerks hunched over their own consoles, bathed in the pale glow of probability matrices. This was the plumbing, alright. The unglamorous backend where amplitude schedules dictated the flow of everything: water rations scaled by your branch-weight inheritance, voting power diluted across continuations, prison sentences served fractionally across realities where the crime was proven. And, most coldly, existence itself. The Sufficient Weight Doctrine: branches below 0.001 amplitude were deemed insufficiently "real" for census purposes. People born into them, or persisting within them after a split, were "the thin." Non-persons. Their experiences, their lives, their pleas – legally weightless. An accounting trick with existential consequences. The Tally movement screamed it was murder by bureaucracy. Aris just saw the paperwork. Until now.

  She pulled up the pre-split instruction registry. Citizens facing a controlled split filed sealed directives – instructions to their future selves. The Office audited them for coherence. Meaningless theatre, mostly. What could you tell a future *you* that you didn’t already know? *Try not to die?* *Spend the inheritance wisely?* The system relied on the comforting fiction of unified identity persisting through division, even as the Apportionment Office meticulously divided everything that identity possessed.

  Kael’s instruction blinked at her: **"To whichever Kael survives: Don't let them thin-line Mom's garden plot. And Aris… hope it's me in the heavy one. The real one."**

  Aris’s breath hitched. *Hope it’s me in the heavy one.* Philosophical poison. Which "me"? Both Kael-branches would open this letter. Both would be him, inheriting his memories, his love, his desperation. Both would read that plea. The one in the heavy branch might feel relief, tinged with guilt. The one in the light branch… would read a wish for his own erasure. The Doctrine wouldn’t just make him thin; it would retroactively render his *hope* invalid, a cry from a legal non-entity. The Tally said this was monstrous: every branch deserved its full share, regardless of weight. Amplitude-squared was just a fancy tool for the heavy branches to hoard reality. But the heavy branches *felt* realer, denser. They were where the resources pooled, where history seemed to solidify. Where Aris lived.

  "Thorne!" A sharp voice cut through the hum. Silas Vonn, Senior Auditor, leaned against her console partition. Thin, intense, eyes perpetually scanning for deviations. Rumored Tally sympathizer, or at least a Doctrine-skeptic. "Big day. Ternary split. Life outcomes. Heavy stakes." His tone was dry, but his gaze lingered on the amplitude field, still blank on her screen.

  "Just prepping the audit queue, Silas," Aris replied, her voice carefully neutral.

  "Ah, the instructions. The theatre of the unified self." Silas picked up a random instruction slip from her 'pending' tray, not looking at it. "Tell me, Aris, when you audit these… what coherence are you checking for? Internal logical consistency? Or consistency with the *assumed* amplitude-weighted reality we’re all supposed to pray to?"

  Aris met his gaze. "I check that they don't contain instructions that would violate Apportionment law or cause downstream inheritance paradoxes. Like trying to leave everything to a specific branch-label that won't exist until *after* the split. Basic stuff."

  "Basic stuff," Silas echoed. "And yet, the very act presupposes the framework. We tell ourselves the amplitudes guide rational choice – bet with squared weights, the Deutschians chant, it’s the only way to avoid ruin across the branches! – so we build the world that way. Then we point to the world working as proof the amplitudes were right. Circular plumbing." He tapped the blank amplitude field. "What guides *that* pen, Aris? The cold math? Or the weight of who you hope survives?"

  He knew. He had to know about Kael. Auditors knew everything. Aris’s jaw tightened. "The schedule will be set according to protocol and the best available outcome modeling. As always."

  "Protocol based on observed frequencies," Silas pressed, "observed in a world *already* structured by amplitude schedules. It’s turtles all the way down. Or perhaps," he dropped his voice, "just branches all the way down, each demanding their count." He placed the instruction slip back. "Don’t be late with the schedule. The splitter syncs in four hours." He walked away, leaving the faint scent of ozone and discontent.

  Aris forced her focus back. Kael’s instruction burned in her mind. *Hope it's me in the heavy one.* Self-locating uncertainty? Philosopher Marlo, a friend who enjoyed making her head hurt, argued that branching wasn't about becoming someone else, but waking up uncertain *which* future self you were. Rational betting followed from that uncertainty, squaring the amplitudes to minimize anticipated regret. The Tally retorted: if you truly cared about *all* your future experiences equally, you’d weight by branch count, period. Why should one moment of your consciousness matter more because it happens in a thicker slice of reality? But the Doctrine made branch count irrelevant below the threshold. Thin branches weren't counted at all.

  Her console chimed. Another split queued: a mundane supply chain stress test. **Binary Split: Optimal Route A / Suboptimal Route B. Amplitude Schedule: 0.5 / 0.5.** A perfect tie. Protocol demanded she assign the amplitudes: 0.5 and 0.5. It was clean, symmetrical. And utterly arbitrary. No frequency data could break this tie; it was a test, not an observation. No decision theory could distinguish A from B. Yet, she *had* to pick which one got listed first, which branch-label (Alpha/Beta) was assigned to which. The system required a designation. Her pen hovered. Assigning Route A as 0.5 Alpha felt no different than assigning it as 0.5 Beta. Yet the designation would ripple through manifests, schedules, inheritances. A coin flip made law. The arbitrariness was a cold knife against the throat of the Doctrine's certainty. She assigned A to Alpha, B to Beta. Done. No reason. Just… done.

  The clinical trial file beckoned. The preliminary modeling suggested amplitudes aligning with the severity: heaviest for Full Recovery, lighter for impairment, lightest for death. But the numbers weren't fixed. Protocol gave her a range based on lab data and statistical analogs. She could nudge them within bounds.

  FR: 0.45 - 0.60
  PR-CI: 0.20 - 0.30
  TNC: 0.20 - 0.30

  The Doctrine threshold: 0.001.

  Kael’s potential death branch, TNC, could be set as low as 0.20. Safe, well above thin-line territory. But PR-CI, his potential life with impairment… that could be nudged down to 0.20. And 0.20 was 0.04 amplitude-squared. Still above threshold. But if she set TNC to 0.25 and PR-CI to 0.25, that left FR at 0.50. Standard, defensible.

  *But if I set PR-CI to 0.24… and TNC to 0.26… FR stays 0.50. PR-CI amplitude-squared becomes 0.0576. Still safe. Barely.*

  The numbers danced. The Doctrine’s threshold wasn't just a line; it was a cliff. 0.001 amplitude meant 0.000001 amplitude-squared. A rounding error in the cosmic ledger. A person erased. Kael, in a life diminished but *real*, potentially teetering at 0.24 (sq=0.0576). If she set PR-CI to 0.20… sq=0.04. Still safe. But pushing it lower, even within the allowable range, felt like inching him towards the precipice for the sake of… what? Making the death branch slightly heavier? Making the recovery branch shine a fraction brighter? Was that rational? Or was it Silas’s accusation – weighting the branch where *she* hoped he’d be whole?

  The Tally solution screamed in her head: Set them equal! 1/3 each! FR: 0.333..., PR-CI: 0.333..., TNC: 0.333.... Amplitude-squared? Roughly 0.111 each. All safe. All equal. Kael alive in two branches out of three, each a full person. But it was heresy. The modeling didn't support it. The frequencies observed in analogous splits, frequencies shaped by decades of amplitude schedules just like the one she was setting, didn't support it. She’d fail the audit instantly. Silas, despite his skepticism, would have to flag it. The system couldn't tolerate that kind of deviation; it would unravel the carefully constructed, circular justification for everything. Resources *couldn't* flow equally to thin branches; the heavy ones would starve. The Loom would fracture. Yet… wouldn’t Kael, in *any* branch above thin-line, deserve his full ration? His full vote? His mother’s garden plot? Wasn't the Doctrine itself the irrational choice, a failure to care equally about all possible futures?

  *Hope it's me in the heavy one.*

  Both would think it. Only one would be deemed sufficiently real to have hoped.

  She thought of Marlo’s self-locating uncertainty. Before the split, Kael *is* uncertain which future self he will *experience being*. He should bet, rationally, to maximize his expected experience across all possibilities, weighting by amplitude-squared. Betting on the heavy branch *was* rational for him. Setting the amplitudes to match the predicted likelihoods *was* the clerk’s duty, facilitating that rational choice. Deviating was a betrayal of that future uncertainty.

  But the Tally said: Why should the *thickness* of the branch change the value of the experience within it? Why should Kael-in-PR-CI matter less than Kael-in-FR? Caring equally meant counting equally.

  The hum deepened. The splitter was priming. Three hours.

  Aris pulled up the audit algorithm preview. It would simulate downstream inheritance flows based on her amplitudes, flagging any potential for weight paradoxes or Doctrine violations. She input a test schedule: FR: 0.50, PR-CI: 0.25, TNC: 0.25.

  The simulation ran. Green lights. PR-CI amplitude-squared: 0.0625. Safe.

  Then she tried: FR: 0.50, PR-CI: 0.24, TNC: 0.26.
  Green lights. PR-CI sq: 0.0576. Still safe.

  0.23? PR-CI sq: 0.0529. Safe.
  0.22? sq: 0.0484. Safe.
  0.21? sq: 0.0441. Safe.
  0.20? sq: 0.0400. Safe.

  She stopped. 0.20 was the protocol floor. It was *safe*. But it was the minimum. The cliff edge was far below, but setting him at the minimum felt… deliberate. A choice. She could set it to 0.25. Give him margin. But setting PR-CI to 0.25 meant setting TNC to 0.25, leaving FR at 0.50. Was she then weighting the *death* branch equally with the impairment branch? Was that rational? The preliminary models suggested TNC might be slightly *more* likely than PR-CI. Shouldn't she reflect that? Set TNC to 0.26, PR-CI to 0.24? Barely a difference in amplitude, but… a difference.

  *Hope it's me in the heavy one.*

  The heavy one was FR. Always. Everyone hoped for the heaviest outcome. Rational self-interest under self-locating uncertainty. The system was built for that hope.

  But Kael’s instruction also said: *Don't let them thin-line Mom's garden plot.* That was a plea from *any* surviving Kael. A plea that only mattered if he was above the threshold. A plea for existence itself. Could she nudge the number just a little higher? Give the Kael-in-PR-CI a tiny bit more buffer against the void? It was within the bounds. Barely. Was it rational? Or was it sentiment, undermining the cold calculus the Loom relied on?

  The splitter thrummed, a physical pulse in the air now. Two hours.

  Silas appeared at her shoulder again, silent, watching the numbers on her screen. He didn’t speak, but his presence was the audit incarnate.

  Aris looked at the blank amplitude fields. FR. PR-CI. TNC. She thought of the 50/50 split. The pure, clean arbitrariness of it. This wasn’t clean. This was weighted. This had consequences measured in lives and erasures.

  Marlo’s voice echoed: *Care about all your future selves. The amplitude just tells you how likely you are to experience being each one. Bet accordingly.*
  The Tally chant: *Every branch is a life. Count them.*
  The Doctrine’s cold law: *Below this line, you are nothing.*

  And Kael’s plea, echoing from futures that might or might not be allowed to exist: *Hope it's me in the heavy one.*

  Her hand moved. She entered the numbers.

  **FR: 0.50**
  **PR-CI: 0.22**
  **TNC: 0.28**

  PR-CI amplitude-squared: 0.0484. Above threshold. Safe. Marginally. Within protocol. TNC slightly heavier, reflecting the model’s slight lean towards death over severe impairment. FR comfortably dominant.

  It was defensible. Barely. It gave Kael-in-PR-CI a sliver more than the absolute minimum. A fractional shield against the Doctrine. Was it rational? In the Deutschian sense, perhaps – aligning with predicted frequencies. In the Tally sense? A grotesque compromise. In the sense of Kael’s self-locating uncertainty? He should approve; it weighted his best outcome highest. In the sense of Kael’s instruction pleading against thinning? She’d kept him above the line.

  She hit 'submit'. The schedule locked. The audit algorithm whirred. Green lights cascaded down the screen. **Schedule Valid. No Doctrine Threshold Violations Predicted. Inheritance Flows Coherent.**

  Silas let out a slow breath. Not approval. Not condemnation. Just… acknowledgment. "Cutting it fine on PR-CI, Thorne. 0.22."

  "Within bounds. Model supported it," Aris stated, her voice flat. The numbers felt like lead in her stomach.

  "Mm. And the TNC weighting? Pushing it up?"

  "Reflecting the latest risk assessment update." A lie. The update was ambiguous. She’d chosen to interpret it that way.

  Silas nodded slowly. "The frequencies will tell. Eventually." He walked away.

  *The frequencies will tell.* Observed frequencies in a world structured by her choice, confirming the validity of the framework that justified her choice. Turtles. Branches. Circular plumbing.

  The splitter’s hum reached its peak, a physical vibration shaking the console. Aris imagined the vault below, the participants – Kael among them – being gently, irrevocably, copied. Three streams diverging: one bright and heavy (0.50), one dimmer but safe (0.22), one dark and weighted towards an end (0.28). She saw Kael opening his instruction in the heavy FR branch, relief washing over him. She saw him opening it in the 0.22 branch, the PR-CI branch, relief tempered by the knowledge of his impairment, and perhaps, a flicker of fear seeing the number 0.22 on his new identity chit. *Safe, but thin*. She saw… nothing from the 0.28 branch. If Terminal Neurological Cascade unfolded there, no instruction would matter. If it didn't… well, 0.28 was safe too, but heavy with dread.

  She had weighted his possible lives. She had given the heaviest weight to his best future, the lightest she dared to his hardest, but viable, one. She had kept him real. She had obeyed the protocol, bent it microscopically towards mercy, or perhaps towards her own desperate hope. She had used the pen.

  The hum subsided into the background thrum. The split was done. The branches flowed.

  Aris sat back, the console screen blank now except for the next queued split. She felt no certainty, only the profound weight of the structure she upheld, and the chilling echo of the question Silas hadn’t asked, the question that would follow her down every corridor of the Loom: *Was it rational?* The answer depended entirely on which branch of the argument you found yourself in. And she lived in all of them.
