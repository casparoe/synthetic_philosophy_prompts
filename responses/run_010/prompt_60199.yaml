answer: |-
  Here's a structured analysis of the 2020 A-level grading crisis through the lens of algorithmic fairness impossibility results, addressing your core questions and hunches. The table below summarizes key fairness criteria, followed by a detailed breakdown.

  ### Fairness Criteria: Model Goals vs. Critic Demands
  | **Criterion**               | **Ofqual's Model Design**                          | **Critics' Demands**                           |
  |----------------------------|---------------------------------------------------|-----------------------------------------------|
  | **Calibration**            | Explicit primary goal: Grades should reflect historical school performance (cohort comparability) | Violated: Strong students at weak schools received unfairly deflated grades |
  | **Error Rate Parity**      | Not targeted (national distribution prioritized) | Implicit demand: Equal false negative rates across school types |
  | **Group Fairness (Demographic Parity)** | Violated: State/private & deprivation gaps widened | Implicit demand: Proportional grade distribution across SES groups |
  | **Individual Fairness**    | Violated: Rank orders preserved but absolute grades altered based on school history | Explicit demand: Students judged on individual merit, not school's past |
  | **Separation**             | Compromised: Prior attainment adjustment was insufficient proxy | Strong students' outcomes should be independent of school's protected characteristics |
  | **Cohort Comparability**   | Core objective: 2020 grades = 2019 grades in "meaning" | Secondary to within-cohort fairness |

  ---

  ### Analysis of Key Questions
  **1. Fairness Goals & Violations**  
  - **Ofqual's Aim:** *Cohort comparability* (temporal consistency) was paramount. Their algorithm prioritized **calibration-by-proxy**: grades should align with a school’s *historical exam performance distribution*, adjusted for prior attainment (GCSEs). This assumed school-level performance is stable and teacher assessments were inflated.  
  - **Violations:**  
    - **Group Fairness:** The model used *school type/deprivation* as a proxy for student ability (via historical distributions). Since private/high-SES schools had stronger histories, their students benefited disproportionately (e.g., small cohorts exempted).  
    - **Individual Fairness (Dwork et al.):** Identical students (same teacher grade/rank) received different grades based *only* on school history. A top student at a historically low-performing school was downgraded despite individual merit.  
    - **Separation:** The model failed the criterion that outcomes (grades) should be independent of protected attributes (SES/school type) *given* ability (teacher assessment/rank).  

  **2. Critics' Implicit Fairness Criteria**  
  - **False Negative Rates:** Critics focused on high-ability students at weak schools being downgraded (demanding equal FNR across schools).  
  - **Individual Fairness:** "A student shouldn’t be punished for their school’s past" reflects Dwork’s principle: similar individuals should receive similar outcomes.  
  - **Causal Fairness:** Argued that the model *improperly* used school history (a correlate of SES) as a causal determinant of individual grades.  

  **3. The Standoff: Impossibility or Novel Trade-off?**  
  - **Ofqual’s Defense:** Prioritized *cohort comparability* ("a 2020 A = 2019 A") and mistrusted teacher assessments (collective inflation).  
  - **Critics’ Charge:** Prioritized *individual merit* and *within-cohort group fairness*.  
  - **Analysis:** This **isn’t a direct instance** of standard impossibility theorems (e.g., Kleinberg et al.’s calibration vs. balance). Those assume:  
    - An *observed outcome variable* (here, exams were canceled).  
    - Thresholding a *score* (here, "score" was a counterfactual exam performance).  
    Instead, the conflict reveals a **novel trade-off**:  
    - **Temporal Fairness (Cohort Comparability)** vs. **Within-Cohort Fairness**.  
    No major theorem addresses this explicitly. Ofqual’s constraint ("2020 grades ≈ 2019") is a *distributional* (not group/individual) fairness criterion absent from the literature.  

  **4. Ground Truth & Measurement Crisis**  
  Your hunch is **correct**. The core problem was the **unobservable counterfactual**:  
  - *Ground Truth*: Student’s *actual* exam performance (never occurred).  
  - *Proxies Used*:  
    - Teacher assessments (individual proxy).  
    - School history (group-level proxy).  
  - **Result:** All "fairness" claims were untestable. Calibration couldn’t be measured; the algorithm optimized for fidelity to *past distributions*, not predictive accuracy. This is a **fundamental measurement problem in social policy**, not purely algorithmic unfairness.  

  **5. The U-Turn: Displacing Unfairness**  
  - **Fixing Within-Cohort Unfairness:** Switching to teacher grades addressed individual/group fairness for 2020 students.  
  - **Creating Temporal Unfairness:** Grade inflation advantaged 2020 students over 2019/2021 cohorts (violating cohort comparability). Universities bore the cost (over-subscription, accommodation challenges).  
  - **Verdict:** The U-turn **relocated unfairness** from within-cohort to across-cohorts.  

  **6. Theoretical Gaps**  
  - **Temporal Fairness:** No framework exists for trading off fairness *between* cohorts (e.g., 2020 vs. 2019) against fairness *within* a cohort.  
  - **Proxy-Based Fairness:** Theories assume ground truth is observable (for training/evaluation). When proxies *are* the truth (e.g., school history as stand-in for exam performance), standard fairness metrics break.  
  - **Measurement Fairness:** The literature overlooks how *defining* the target variable (e.g., "true grade") in policy contexts embeds normative choices (e.g., cohort comparability vs. individual merit).  

  ---

  ### Final Verdict  
  This episode is **not a confirmation** of standard impossibility theorems but **an anomaly** revealing their limitations:  
  1. **Assumption Gap:** Impossibility results require observable outcomes. Here, the "outcome" was a counterfactual, reducing fairness to a battle of proxies.  
  2. **Novel Trade-off:** Cohort comparability vs. within-cohort fairness is unexplored in algorithmic fairness.  
  3. **Policy Context:** The exercise was fundamentally about *defining* what a "grade" represents (measurement), not just thresholding a score.  

  **Conclusion:** The 2020 A-level crisis exposes how algorithmic fairness frameworks are ill-equipped for contexts where ground truth is unobservable and the *definition* of the target variable is contested. It highlights the need for "measurement fairness" theories that address temporal consistency and proxy reliance in policy applications. The U-turn didn’t resolve unfairness; it reallocated it across time—a trade-off no current theorem captures. Your dissertation should frame this as a case study in the **epistemology of measurement** under uncertainty, where fairness conflicts stem from unresolved questions about what constitutes a "valid" outcome.  

  *Recommendation:* Explore literature on *counterfactual fairness* (Kusner et al.) and *proxy use* (e.g., Barocas et al.), but emphasize their insufficiency for temporal/cohort comparisons. This case demands interdisciplinary engagement with psychometrics, policy evaluation, and philosophy of measurement.
