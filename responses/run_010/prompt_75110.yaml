     Under rule R2 (Born), after allocation:

          If in A: credits = 0.99 * 100 = 99 credits.
          If in a B branch: credits = 0.0001 * 100 = 0.01 credits.

     Expected credits = 0.99*99 + 0.01*0.01 = 98.01 + 0.0001 = 98.0101 credits.

     So the student, by choosing the distribution rule, is choosing between an expected 0.99 credits or 98.01 credits.

     This clearly shows that if the student cares about the expected credits (which is a normative stance), they should prefer the Born rule.

     But the point of the game is to show that the Born rule is not forced by the branching structure, but by the choice to care about the branches in proportion to their weight.

     In the equal shares rule, the student is not caring about the weight, only about the branch count. So they are equally caring about a branch with 0.99 weight and one with 0.0001 weight.

     We can then have a round where branch count and weight come apart, and the students see that under equal shares, they end up with very little in the high-weight branch, which they are likely to experience.

     For the post-branching hesitation round: we can do a round where after the branching but before the outcome is revealed, the student is given a choice that might depend on which branch they are in. But since they don't know, they have to make a choice in ignorance. This is to simulate the subjective uncertainty.

     For example, we can have:

     - A branching into A (weight 0.5) and B (weight 0.5).
     - After the branching (which is done by the instructor secretly flipping a coin to determine which branch the student will be in), but before revealing, the student is offered a bet that pays 10 credits in branch A and 0 in branch B.

     Then, if they take the bet, they get 10 in A and 0 in B, but they don't know which branch they are in.

     This is a classic case of self-locating uncertainty. The hesitation is because they don't know which branch they are in.

     We can then compare with the case where there is no branching, but the same bet is offered on a coin flip that hasn't been done yet.

     But in the branching case, both branches exist, so the pre-branching agent has two successors, one in A and one in B. The bet is applied after the branching, so each successor gets the payoff in their branch. The pre-branching agent, when offered the bet before the branching, would decide based on how she cares about the two branches. But after the branching, the agent in each branch might have a different preference.

     However, in the classroom, the student is only going to be in one branch. So we do:

     - We branch by flipping a coin (secretly) and writing the result on a piece of paper and putting it in an envelope.
     - Then we offer the bet: if you take the bet, then if the envelope contains 'A', you get 10 extra credits; if 'B', you get 0 extra.
     - The cost of the bet is 5 credits? or free? We can make it free.

     Then the student, not knowing the outcome, might be willing to take the bet if they think it's 50-50. But is it 50-50? In the branching, the weights are 0.5 and 0.5, so it's symmetric.

     This is to be compared with a classical coin flip: the coin is flipped and the result is in an envelope, then you are offered the same bet. The decision should be the same.

     The point is to show that after branching, the agent's state of knowledge is the same as in a classical uncertainty situation.

     However, in Everett, there is no fact of the matter about which branch is "the real one", but the agent will experience one and only one, and doesn't know which. So it feels like uncertainty.

     Now, let's design the game in detail.

     We'll have:

     - Credits: each student starts with 100 credits.

     - Distribution rules to choose from (at the beginning of the game):
          1. Equal shares: credits divided equally among all branches (by count).
          2. Born rule: credits divided among branches in proportion to their weights (squared amplitudes).
          3. Winner-take-all: all credits go to the branch with the highest weight. If multiple, split equally among them.

     - Rounds:

          Round 1: Two branches, A (weight 0.6) and B (weight 0.4).
            Bet: if you take the bet, then in branch A you gain 30 credits, in branch B you lose 20 credits.
            Without bet: nothing.
            Students decide whether to take the bet.

          How to simulate branch assignment: we use a random number generator with probabilities 0.6 and 0.4.

          Steps for the round:
            a) Students fill out a betting slip: whether they take the bet or not.
            b) The instructor collects the slips.
            c) For each student, the instructor:
                 - Distributes their current credits C to the branches according to the rule.
                 - Adds the bet payoff if they took the bet.
                 - Randomly selects a branch for the student (using a die, coin, or RNG) with probabilities proportional to the weights.
                 - Records the new credits for the student.

            d) The instructor reveals the branch for each student and their new credits.

          Round 2: Three branches, A (weight 0.5), B (weight 0.3), C (weight 0.2).
            Bet: if you take the bet, in branch A you gain 50, in branch B you lose 30, in branch C you gain 10.

          Round 3: Branch count vs weight.
            We have two macro branches:
               - Branch A: weight 0.99, represented as one branch.
               - Branch B: weight 0.01, but composed of 100 micro branches (each weight 0.0001), so we say there are 101 branches in total.
            Bet: none initially? or we can have a bet. Alternatively, we can have no bet to show the effect of allocation alone.

            But to make it interesting, let's have a bet that pays only in branch A: if you take the bet, you pay 1 credit, and if in branch A, you get 2 credits (net gain 1); if in any B branch, you get 0 (net loss 1).

            Then, under Born rule:

               Without bet: 
                   In A: 0.99 * C
                   In a B branch: 0.0001 * C

               With bet:
                   In A: 0.99*C + 1   [because we paid 1 and got 2, so net +1? Actually, we do:

                   Steps:
                     - The distribution rule allocates the credits to the branches.
                     - Then the bet is applied: it affects the credits in the branch.

                   But the bet is taken before the branching, so it's a global decision.

                   We can design: 
                     - The cost of the bet is taken from the pre-branching credits? But then how to distribute? Alternatively, we can have the cost taken in every branch? That might be complicated.

                   Instead, we can have the bet as a contract that in branch A you get 2, in branch B you pay 1. But that means in branch A you gain 2, in branch B you lose 1. But then the net effect is:

                     In branch A: credits = (allocation to A) + 2
                     In branch B: credits = (allocation to B branch) - 1

                   And the cost of the bet is zero? because it's a contract that transfers between branches? That doesn't work.

            Alternatively, we can have the bet as: you pay 1 credit upfront (from your pre-branching credits), and then if in branch A, you get 3 credits added in branch A; if in branch B, nothing. Then net:

               In branch A: (allocation to A from the remaining C-1) + 3
               In branch B: (allocation to B branch from the remaining C-1)

            This is messy.

            Let me simplify: have no bet in round 3. Just show the effect of the distribution rule on the allocation.

            Then, after the allocation and branch selection, they see their credits.

            Then, we do the same round again with a different rule and the same starting credits, so they see the difference.

          Round 4: Post-branching hesitation.

            We have two branches, A and B, both weight 0.5.
            We do the branching first: the instructor flips a coin in secret and records the result for each student (without revealing). Then, we offer a bet: if you take the bet, it costs 5 credits, and if your branch is A, you get 15 credits; if B, you get 0.

            So net:
               In branch A: -5 + 15 = +10
               In branch B: -5

            The student must decide whether to take the bet after the branching but before knowing which branch they are in.

            Then we reveal.

     Given time, we might not do all rounds twice. We can do round 3 twice: once with equal shares and once with Born.

     Timeline:

     Total: 100 minutes.

     0-10 min: Introduction and explain the rules.

        - Explain the Everettian branching: when a measurement happens, the world splits into multiple branches. Each branch has a weight (squared amplitude).
        - In this game, you are an agent about to undergo a branching event. You start with some credits.
        - Before the branching, you may have the option to take a bet, which will affect the credits in the branches.
        - But also, before the branching, we (as a class) must choose a rule for how your current credits are distributed to your future selves in the branches.
        - We will consider two rules: 
            1. Equal shares: divide your current credits equally among all branches.
            2. Born rule: divide your current credits in proportion to the branch weights.
        - After the branching, you will find yourself in one branch (chosen at random with probability proportional to the weight). You will then continue from that branch with the credits allocated to that branch plus any bet payoff.

     10-15 min: Choose the first distribution rule (by vote? or assign?).

     We'll do two passes: first with rule R1, then with rule R2. But to save time, we might only do one rule for rounds 1 and 2, and then for round 3 do both rules.

     15-25 min: Round 1 with rule R1.

          Branching: two branches, A (0.6) and B (0.4).
          Bet: Take it or not? If taken, in A: +30, in B: -20.

          Betting slip for Round 1 (rule R1):

              Name: __________
              Current credits: [instructor will fill, start with 100]
              I take the bet: Yes / No

          Instructor then for each student:
            - If they took the bet, then in A: payoff = +30, in B: -20.
            - Distribute current credits (100) to branches:
                 R1 (equal shares): 
                     A: 100/2 = 50
                     B: 50
                 Then add bet payoff:
                     A: 50 + 30 = 80
                     B: 50 - 20 = 30

            - Select branch: use a random number. We can use a 10-sided die: 1-6 for A, 7-10 for B.
            - Record new credits.

          Reveal the branch and new credits.

     25-35 min: Round 2 with rule R1.

          Three branches: A (0.5), B (0.3), C (0.2).
          Bet: in A: +50, in B: -30, in C: +10.

          Betting slip similar.

          Distribution for R1 (equal shares): 
              Each branch gets 100/3 ≈ 33.33. We can use fractions or decimals, or integers by scaling.

          How to resolve: use a 10-sided die: 
              1-5: A
              6-8: B
              9-0: C   (if 0, treat as 10? or use 1-5: A, 6-8: B, 9-10: C)

          Then add bet.

     35-45 min: Round 3 with rule R1.

          Branches: A (0.99) and B (0.01) with 100 branches -> total 101 branches.
          No bet.

          Distribution R1 (equal shares): 
              A gets 100/101 ≈ 0.99 credits.
              Each B branch gets 100/101 ≈ 0.99 credits.

          Branch selection: 
              First, choose between A and B with probability 0.99 and 0.01.
              If B, then choose one of the 100 branches uniformly.

          We can use two random steps:
              Step 1: random number for A vs B. Use a 100-sided die or two 10-sided: but we can use a coin and a d10? 
              We can use a random integer from 1 to 100: if <=99, A; if 100, then B.
              If B, then roll a d100 (or if not available, use two d10: one for tens, one for units) to choose which B branch (1 to 100).

          Then the student gets:
              If in A: 100/101
              If in B: 100/101

          They will see that they have about 1 credit left, regardless of the branch.

     45-55 min: Reset credits to 100. Choose rule R2 (Born) for the next rounds.

     55-60 min: Round 1 again with rule R2.

          Same as before, but with R2:
            Distribute 100:
               A: 0.6 * 100 = 60
               B: 0.4 * 100 = 40
            Then add bet payoff:
               If took bet: 
                   A: 60+30=90
                   B: 40-20=20
               If not: 60 and 40.

          Branch selection as before.

     60-65 min: Round 2 again with rule R2.

          Distribute:
               A: 0.5*100 = 50
               B: 0.3*100 = 30
               C: 0.2*100 = 20
          Add bet.

     65-75 min: Round 3 with rule R2.

          Branches: A (0.99) and B (0.01) with 100 branches.
          Distribution R2 (Born):
               A: 0.99 * 100 = 99
               Each B branch: 0.0001 * 100 = 0.01

          Branch selection: as before.
          If in A: 99 credits.
          If in a B branch: 0.01 credits -> essentially 0.

          Then, if we had the bet in round 3, we would apply it, but we don't.

          Students will see: if they are in A (which is very likely), they have 99 credits. Under R1, they had about 1 credit.

     75-85 min: Round 4 (post-branching hesitation). We can do this with rule R2 to avoid complexity.

          Two branches, A and B, both weight 0.5.
          First, the branching is done in secret: the instructor flips a coin for each student and records the result (without revealing). The result is sealed in an envelope for the student.
          Then, the student is offered a bet: 
              "If you take this bet, it will cost you 5 credits. Then, when you open the envelope, if the result is A, you will receive 15 credits (net gain in branch A: 10 credits). If the result is B, you receive nothing (net loss: 5 credits)."
          Betting slip for Round 4:

              Name: __________
              Current credits: [from previous round? We should reset to 100 for simplicity]
              I take the bet: Yes / No

          Then, after they decide, they open the envelope and we adjust their credits accordingly.

          But note: we are in the middle of the game, and credits are cumulative. To simplify, we can do this round as a standalone with 100 credits.

          Steps:

            - Start with 100 credits.
            - The branching is done secretly: we have already determined which branch they are in.
            - They decide on the bet.
            - Then reveal and adjust:
                 If they took the bet:
                     If branch A: 100 - 5 + 15 = 110
                     If branch B: 100 - 5 = 95
                 If not: 100.

     85-100 min: Debrief.

     However, this timeline is very tight. We might skip the repetition of rounds 1 and 2 and only do round 3 under both rules. And we might not have time for round 4.

     Given 14 students, the instructor will have to manage the branch selection for each student quickly. We can do the branch selection in bulk: for example, for round 1, we can have a single die roll for the whole class? But that would be the same branch for everyone, which is not realistic. Alternatively, we can have a helper or use a computer.

     Given the constraints, we'll adjust.

     Revised timeline for 100 minutes:

     0-10 min: Introduction and choosing rule R1 (equal shares) for the first part.

     10-20 min: Round 1 (two branches) with rule R1.

     20-30 min: Round 2 (three branches) with rule R1.

     30-40 min: Round 3 (101 branches) with rule R1.

     40-45 min: Reset credits to 100 and choose rule R2 (Born).

     45-50 min: Round 3 again with rule R2.

     50-60 min: Round 4 (post-branching hesitation) with rule R2, but standalone with 100 credits.

     60-100 min: Debrief (40 minutes).

     The debrief should cover:

     - In round 3 under R1, students ended up with about 1 credit, while under R2, they ended up with either 99 or 0. This is the quantitative problem: under branch counting, you allocate too much to the many low-weight branches and too little to the high-weight branch.

     - The circularity charge: in the decision-theoretic approach, they assume a utility function and then derive the Born rule. But in this game, we see that if you care about your future selves in proportion to the branch weights (as in R2), then you get the Born rule allocation. But why care in proportion to the weights? That is the prior normative commitment.

     - The subjective uncertainty: in round 4, after branching but before knowing the branch, the students felt uncertain and might have taken the bet if it had positive expected value (which it did: 0.5*10 + 0.5*(-5)=2.5>0). This is the Saunders-Wallace approach.

     - The caring measure: Greaves. In round 3 under R2, the pre-branching agent allocated 99 credits to branch A and 0.01 to each B branch. This allocation reflects a caring measure that is proportional to the weight. The agent cares more about the future self in the high-weight branch.

     Predicted problems:

     - A student might say: "But in the simulation, only one branch happens because you are selecting one branch. That's collapse." 
          Response: Explain that the selection is only to simulate the first-person experience. In reality, all branches exist. The distribution rule is about how the pre-branching agent allocates resources to all branches. The selection is a way to experience one branch, but the allocation affects all branches.

     - Arbitrage: if we allow the distribution rule to be chosen per round, a student might try to choose the rule that maximizes their expected credits. But we fix the rule at the beginning. In the second pass, we change the rule, but the student cannot change their bet. They might try to change their bet when the rule changes? But we ask them to use the same bet as in the first pass.

     What the game cannot reproduce:

     - In Everett, all branches are real. The squared amplitude is not a probability of the branch occurring (because it does occur) but a measure of its "reality" or "importance". The game uses the branch weight as a probability to select which branch the student experiences, which might reinforce the idea of collapse. We must emphasize that this is a simulation of the subjective experience.

     - In the game, the credits are a stand-in for welfare. In Everett, the agent might care about the welfare of all their future successors. The game mechanics only deliver the credits for the branch experienced. We must explain that the distribution rule is the pre-branching agent's way of allocating welfare to all branches.

     Finally, the game quietly favors the caring measure. To be neutral with the self-locating uncertainty, we would have to design the game so that after branching, the agent in each branch is a separate agent and they each make decisions. But in the game, we only have one agent continuing. In the self-locating uncertainty view, the pre-branching agent is replaced by multiple agents, each in their branch, and the pre-branching agent's decisions are made under uncertainty about which branch they will be in. In the game, we simulate the uncertainty by the random assignment. So the game can support the self-locating uncertainty view in round 4. But in the allocation in round 3, the caring measure view is more explicit.

     To be neutral, we could avoid the allocation of credits and instead have the students make decisions that affect their future branches, and then after branching, they see which branch they are in and what they get. The distribution rule would be replaced by a decision rule that might be based on expected utility (using the weights as probabilities) or branch counting. But then the credits are not allocated in advance. In the current design, the allocation rule is the normative commitment.

     Given time, we proceed with the described design.

     We now provide the full betting slips and resolution methods.
answer: |-
  Below is a comprehensive design for your in-class game, structured to meet all your requirements. The game uses "credits" as a virtual currency with trivial stakes, and emphasizes the normative choice inherent in distributing resources across future branches.

  ---

  ### **Minute-by-Minute Timeline (100 Minutes Total)**
  - **0–10 min: Introduction & Rule Selection**  
    Explain the game’s goal: to experience how distribution rules affect betting outcomes. Introduce the credit system (start: 100 credits/student). Present four distribution rules:  
    1. **Equal Shares**: Split credits equally among all branches.  
    2. **Born Rule**: Split credits proportional to branch weight (squared amplitude).  
    3. **Winner-Take-All**: All credits go to the highest-weight branch.  
    4. **Student-Devised Rule**: Students propose one (e.g., "Split inversely proportional to weight").  
    Class votes to select one rule for the first rounds. *Debrief note: This forces a normative choice—no branch-counting or weighting is "natural."*  

  - **10–30 min: Rounds 1 & 2 (Demonstrate Rule Dependence)**  
    Run two betting rounds with the selected rule. Use the same scenarios under different rules later to show outcome variance.  
    - *Round 1 (10–20 min):* Simple split (two branches, weights 0.6/0.4).  
    - *Round 2 (20–30 min):* Three branches (weights 0.5/0.3/0.2).  

  - **30–50 min: Round 3 (Branch Count vs. Weight)**  
    Engineered split: One high-weight branch (weight 0.99) vs. 100 low-weight branches (each weight 0.0001, total weight 0.01). Highlight the conflict: intuition favors counting branches, but weight dominates experience.  

  - **50–60 min: Rule Switch & Rerun Round 3**  
    Reset credits to 100. Class selects a new rule (e.g., from Equal Shares to Born Rule). Re-run Round 3 to show outcomes change dramatically.  

  - **60–75 min: Round 4 (Post-Branching Hesitation)**  
    Conduct a round *after* branching but *before* outcome reveal. Students bet while "ignorant" of their branch.  

  - **75–95 min: Settlement & Audit**  
    Students compute final credits using a transparent, branch-selection method (e.g., dice rolls). Peers audit each other’s results.  

  - **95–100 min: Transition to Debrief**  
    Briefly preview debrief themes: "Where did you feel the pressure? What felt arbitrary?"  

  ---

  ### **Branch Structures & Resolution Methods**  
  **General Setup**  
  - Each student starts with 100 credits.  
  - Bets cost nothing but alter payouts in specific branches.  
  - **Branch Selection**: Use weighted random selection (e.g., 10-sided die for decimals, dice pools for integers). Students can verify probabilities.  

  **Round 1 (Two Branches)**  
  - **Branches**: A (weight 0.6), B (weight 0.4).  
  - **Bet**: "If you bet YES: +30 in A, −20 in B. If NO: no change."  
  - **Resolution**: Roll d10: 1–6 → A, 7–10 → B.  

  **Round 2 (Three Branches)**  
  - **Branches**: A (weight 0.5), B (weight 0.3), C (weight 0.2).  
  - **Bet**: "If you bet YES: +50 in A, −30 in B, +10 in C. If NO: no change."  
  - **Resolution**: Roll d10: 1–5 → A, 6–8 → B, 9–10 → C.  

  **Round 3 (Count vs. Weight)**  
  - **Branches**:  
    - A: One branch (weight 0.99).  
    - B: 100 branches (each weight 0.0001; aggregate weight 0.01).  
  - **Bet**: "If you bet YES: +10 in A, −1 in every B branch. If NO: no change."  
  - **Resolution**:  
    1. Roll d100: 1–99 → A, 100 → B.  
    2. If B, roll 2d10 (one for tens, one for units) to select a B branch (1–100).  

  **Round 4 (Post-Branching Hesitation)**  
  - **Branches**: A (weight 0.5), B (weight 0.5).  
  - **Setup**:  
    1. **Secret Branching**: Instructor flips a coin (not revealed) to assign each student to A or B.  
    2. **Bet Offered Post-Branching**: "Pay 5 credits. If you’re in A: +15. If in B: +0."  
  - **Resolution**: After bets, reveal branches via coin flip.  

  ---

  ### **Betting Slips (Uniform for All Rounds)**  
  **Betting Slip Template**  
  ```  
  Name: __________  
  Current Credits: _______ (Instructor fills pre-round)  
  Round: ___  

  **Branching Scenario**:  
  [Description of branches/weights]  

  **Bet Option**:  
  [Bet description, e.g., "Bet YES: +30 in A, −20 in B"]  

  I bet: ○ YES  ○ NO  

  Distribution Rule in Effect: _______________  
  ```  

  > *Design Note:* Slips include branch/weight visuals (e.g., pie charts) so even students who missed readings can participate.  

  ---

  ### **Credit System & Settlement**  
  - **Stakes**: Credits are virtual (no real value). Final scores can be shared for "bragging rights," but no prizes.  
  - **Settlement**:  
    1. **Post-Branch Selection**: Credits in the selected branch = (Pre-bet credits × distribution rule) + bet adjustment.  
    2. **Audit**: Students pair up, verify each other’s:  
       - Branch selection (dice rolls).  
       - Credit calculation (calculators allowed).  
       - Instructor provides answer keys for distributions.  
  - **Example Calculation (Round 3, Born Rule, Bet YES, landed in A)**:  
    Pre-bet credits: 100.  
    A’s share: 100 × 0.99 = 99.  
    Bet adjustment: +10.  
    Final: 99 + 10 = 109.  

  ---

  ### **Debrief: Mapping Game to Literature**  
  - **Quantitative Problem (Round 3)**: Equal Shares allocates 100/101 ≈1 credit to A (99% weight), making high-weight branches "poor." Students *feel* why weighting matters.  
  - **Circularity Charge (Rule Selection)**: Students pick rules *before* seeing outcomes, yet no rule is "correct." This mirrors Deutsch-Wallace: axioms assume what they prove (e.g., "rationality" means weighting).  
  - **Subjective Uncertainty vs. Caring Measure (Round 4)**:  
    - **Uncertainty View**: Hesitation mimics ignorance ("Am I in A or B?"). Bets resemble maximizing expected utility.  
    - **Caring Measure**: Betting YES "cares" more about A (higher weight), even post-branching.  
  - **Predictable Failures & Responses**:  
    - *"This smuggles in collapse!"*: Clarify: "Branch selection simulates first-person experience. All branches exist—your ‘ignorance’ is self-locating, not ontological."  
    - *Arbitrage Opportunity*: If students notice rules yield different payouts, ask: "Which rule *should* you use? Why? Does physics decide, or do you?"  

  ---

  ### **Two Plain Statements**  
  1. **Game’s Bias & Neutrality**:  
     - The rules quietly favor the **caring measure** (Greaves). Distribution is an explicit normative choice, decoupled from branching.  
     - **To Neutralize**: Run Round 4 twice. First, as self-locating uncertainty (bet offered post-branching). Second, as caring measure (bet offered pre-branching, with distribution rule). Contrast decisions.  

  2. **Unreproducible Quantum Feature**:  
     - **Weight ≠ Probability**: In Everett, all branches occur; weight isn’t a probability over exclusives. The game uses weights to *simulate* branch selection, risking confusion with collapse.  
     - **Supply in Speech**: "In quantum mechanics, no branch ‘dies’—you have successors everywhere. We simulate selection to experience one path, but the distribution rule is how you value *all* paths. The Born Rule isn’t about chance; it’s about care."  

  ---

  ### **Materials & Adjustments for Class**  
  - **Dice/Coins**: 10-sided die (d10) for Rounds 1–2; two d10 (for d100) for Round 3; coins for Round 4.  
  - **Scaling for 14 Students**: Use group betting (3–4 students/team) to speed up resolution.  
  - **Time Saver**: Skip student-devised rules if time is tight. Focus on Equal Shares vs. Born Rule.  
  - **Critical Moment**: In Round 3, under Equal Shares, students in A get ~1 credit despite 99% weight. This triggers the "aha!" moment.  

  This design makes the normative commitment visceral: the Born Rule feels "right" only after students experience the poverty of branch-counting. The game doesn’t resolve the debate—it forces students to confront why it exists.
