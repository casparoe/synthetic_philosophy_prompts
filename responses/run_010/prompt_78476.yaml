prompt: |-
  our foundation is deciding whether to fund a cliodynamics lab, and the pitch deck hangs everything on a single analogy: forecasting history is like forecasting weather. you can't tell somebody whether it'll rain on their wedding day, but you can tell them what the climate will do, and nobody calls climatology unscientific for failing at the first job. the deck puts it to work twice -- once to brush of the "societies don't have laws" objection, and once to argue we should fund an early-warning instability index the way we fund hurricane tracking, with a rider that the much-publicized call about US turbulence around 2020 being off shouldn't count against the program since the forecast was really about the trend, not the event. our staff historian thinks the analogy is load-bearing and won't survive contact with the track record.

  so: give me the mapping properly -- what plays the atmosphere, the physics, the satellites, the instrumental record, the held-out data -- then sort the disanalogies into the ones that actually bite for each of the two uses the deck makes and the ones that are just noise. say whether a better analogy exists for what cliodynamics is doing with secular cycles and elite overproduction. and take a side: would you fund the lab? definite answer with reasons, not a summary of the debate -- and flag which of your own premises you'd least want to defend.
reasoning: |-
  Okay, the user is from a foundation considering funding a cliodynamics lab. The pitch deck uses a weather-climate analogy to address two main objections: that societies don't have laws, and that a failed prediction about US instability around 2020 shouldn't invalidate the whole field. The staff historian thinks this analogy is crucial but flawed. 

  Hmm, the user wants me to dissect this analogy thoroughly. First, I need to map the weather/climate components to cliodynamics equivalents. The atmosphere would be human societies, physics are social theories, satellites are historical databases... Got it. 

