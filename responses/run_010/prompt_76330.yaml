prompt: |-
  I am helping to draft the standing orders for a nine-member standing panel of a public research funder. Its job is to determine whether to withdraw a multi-year grant, and its charter specifies that withdrawal follows if and only if three grounds are all made out: A, that the reported central result is not reproducible; B, that the departure from the approved protocol was material; C, that the departure was not disclosed to the funder. The charter, embarrassingly, says nothing about how the panel is to arrive at a collective finding, and in the first hearing we walked straight into the problem. Members voted by secret ballot on each of A, B, and C and on the determination D itself, with this result:

  | Member | A | B | C | D (withdraw) |
  |---|---|---|---|---|
  | 1, 2, 3 | yes | yes | yes | yes |
  | 4 | yes | abstain | yes | no |
  | 5 | yes | no | yes | no |
  | 6 | no | yes | yes | no |
  | 7 | yes | no | no | no |
  | 8 | yes | abstain | no | no |
  | 9 | no | no | yes | no |

  So A carries 7–2, C carries 7–2, B carries 4–3 among those voting on it but fails 4–5 if the two recusals on B are counted as rejections, and D fails 6–3. Reading the same ballots three defensible ways yields three different determinations: withdraw on the premises, do not withdraw on the conclusion, and do not withdraw on the premises once abstentions are scored against. The panel then took a vote on which reading should govern, and split 5–4 on that too, with the split cutting across the substantive split. Worse, a second sitting was held after the investigators filed further documentation: two seats turned over between the sittings, and one member changed his vote on B. The determination ultimately issued relies on the first sitting's findings on A and C, the second sitting's finding on B, and a procedural choice endorsed by a bare majority of the second panel. No body that ever sat voted for all of A, B, C and D together. Note also that four of the six members opposed to withdrawal accept at least two of the three grounds for it, so the reasons we would publish are, as a conjunction, rejected by everyone but the three members who wanted withdrawal.

  Before I read anything further on this, I want the specification: what would a theory of judgment aggregation have to deliver to count as adequate for a body like this one? I am fixing the purpose deliberately, since adequacy is relative to it — the theory must underwrite the panel's authority to issue a binding determination for which the panel itself can be held responsible and which it can defend to an appellant and to a reviewing court, not merely maximize the probability that the misconduct question is answered correctly. Give me the requirements list in numbered form, and for each requirement state it precisely, give the feature of the case above that motivates it, classify it as non-negotiable, as negotiable, or as a preference of one camp rather than a genuine requirement, and say what is lost if it is dropped. I expect the list to include the familiar conditions on the input side (what profiles must be admissible, in particular whether individually incomplete judgment sets arising from recusal are allowed at all), on the rule (anonymity, responsiveness, and whether the collective verdict on each proposition may depend only on the individual verdicts on that proposition), and on the output side (consistency, deductive closure, completeness, and the demand that the output be a set the group can own and speak with). But I also want you to test candidates that I suspect are under-theorized and that you should feel free to name yourself rather than attribute: that the outcome be invariant to the order in which propositions are put to the vote; that the determination be traceable, in the sense that the panel can identify which members' judgments were decisive for it; that the reasons published be ones that some member or members can be authorized to speak for; that the rule say determinately how abstention and recusal are to be scored; and — this is the one the second sitting exposed, and I am coining the term, so do not look for it in the literature — what I will call diachronic profile-integrity, namely that the group's final judgment set be the output of a single aggregation over a single profile of a single constituted body, rather than assembled across sittings and turnovers. For each of these, say whether it is a real desideratum, a derivative consequence of others, or a prejudice, and if it is real, show which of the features above it is meant to capture.

  Two things matter more to me than the list's length. First, tell me which subsets are jointly unsatisfiable: given the standard impossibility results in this area, which combination of the requirements above cannot all be met on an agenda with our structure, which single requirement is the cheapest to surrender in order to restore possibility, and whether restricting the domain of admissible profiles — to profiles that are, say, ordered by a shared ranking of the grounds — is a legitimate move for an actual panel whose members arrive with whatever judgments they have, or a cheat that buys consistency by ruling out the case. Second, tell me which single requirement does the most work in eliminating candidate rules, and which distinctions the theory must not collapse: between aggregating beliefs and aggregating decisions; between a procedure and the outcome it produces, given that premise-based and conclusion-based voting can be applied to the same ballots; between consistency and completeness; between preserving unanimity and being responsive at all; between a collective attitude that members hold and one that is merely ascribable to the group; and between synchronic coherence and the diachronic coherence I am asking about. Distinguish throughout between what is genuinely required of any adequate theory here and what is a camp commitment dressed as a requirement — I especially want to know whether treating each proposition in isolation from the rest of the agenda is a fairness condition or an artifact of the formalism. Then, briefly and in no more than a sentence or two apiece, how each of these fares against your list: conclusion-based majority voting; premise-based majority voting; a sequential procedure that fixes the order of voting by the logical structure of the grounds; a supermajority or quota rule; a distance-based rule that picks the coherent judgment set closest to the profile; chair-dictatorship; and letting the panel vote on its own procedure, as ours did. Close with one paragraph saying how the list would change if the purpose were purely epistemic — tracking the truth about reproducibility and materiality — rather than conferring responsibility-bearing authority. No bibliography, no reading list, and no citations, please; I want the reasoning worked through from the case, and any term you introduce should be defined rather than sourced.
reasoning: |-
  Okay, the user is helping draft standing orders for a nine-member panel deciding on grant withdrawal. They've encountered issues with how the panel aggregates individual judgments into a collective decision. The charter requires all three grounds (A, B, C) to be met for withdrawal (D), but the voting process led to inconsistencies. 

  The user wants a numbered list of requirements for an adequate judgment aggregation theory tailored to this panel's authoritative decision-making role. The requirements must ensure the panel can issue binding, defensible determinations. Key problems from the case include: inconsistent outcomes depending on how abstentions are treated; mixing votes from different sittings; no clear ownership of the final decision; and published reasons not reflecting any member's actual judgment.

  Hmm, the user is clearly frustrated with the theoretical mess they're in. They're not just asking for textbook solutions but a practical framework that addresses real-world problems like member turnover and procedural ambiguity. The mention of "defensibility to a reviewing court" suggests legal accountability is crucial here. 

  First, I need to identify core requirements from the case's pain points. The voting paradoxes show we need consistency (Requirement 1) and completeness (Requirement 2) in outputs. The confusion over abstentions demands clear scoring rules (Requirement 3). The panel's inability to own the decision points to collective rationality (Requirement 4), while the mixed-sitting fiasco highlights diachronic integrity (Requirement 5). 

  The user also hints at under-theorized aspects like traceability (who swayed the decision?) and publication of reasons. These feel important but secondary—traceability might conflict with secret ballots, and reason-publication seems addressed by collective ownership. 

  For conflicts: Arrow-like impossibilities lurk here. If we insist on proposition-wise majority voting (Requirement 6), we lose consistency when agendas are interconnected (as with A/B/C implying D). The cheapest fix might be dropping completeness—allowing "undecided" on some propositions—though that weakens defensibility. Domain restriction (e.g., requiring members to rank grounds) feels like cheating since real panels don't pre-coordinate judgments. 

  The most disruptive requirement is proposition-wise independence (Requirement 6). It causes the inconsistency in this case but feels like a fairness non-negotiable—members shouldn't change votes based on others' opinions on different issues. Yet relaxing it enables premise-based voting, which fixes the logic but risks making B/C irrelevant if A alone dictates D. 

  Now testing solutions: 
  - Conclusion-based voting (just vote on D) fails Requirement 4—it doesn't engage with the charter's grounds. 
  - Premise-based voting (vote A/B/C then derive D) satisfies logic but violates Requirement 6 and may ignore members' holistic views. 
  - Sequential voting could work if order is fixed (e.g., A→B→C→D), but path-dependence might feel arbitrary. 
  - Supermajorities reduce decisiveness; distance-based rules (like "minimize disagreements") are opaque for courts. 
  - Letting panels vote on procedures invites chaos (as seen). 

  For epistemic purposes (truth-tracking), we'd prioritize accuracy over defensibility—e.g., allowing expert delegates or Bayesian methods. But here, authority trumps truth. 

  Phew. The user's depth suggests they've researched this but need help cutting through theory to practical design. They'll likely push back on any trade-off that weakens judicial defensibility, so I'll flag those tensions clearly.
answer: |-
  Here is a requirements list for an adequate judgment aggregation theory in this context, derived from your case's challenges. Requirements are classified as **Non-negotiable** (essential for authority/defensibility), **Negotiable** (contextually important but potentially adjustable), or **Preference** (reflecting a theoretical camp).

  ### Requirements List
  1. **Consistency of Collective Judgment Set**  
     - *Statement:* The panel’s final set of judgments (on A, B, C, D) must be logically consistent (e.g., affirming A, B, C but rejecting D is forbidden).  
     - *Motivation:* The panel’s determination relies on the charter’s logical rule (D iff A∧B∧C). Inconsistency (e.g., accepting A,B,C but rejecting D) invalidates the decision.  
     - *Classification:* **Non-negotiable**.  
     - *Loss if dropped:* Loss of rational defensibility to courts/appellants; the decision becomes arbitrary.

  2. **Completeness of Collective Judgment Set**  
     - *Statement:* The panel must deliver a "yes" or "no" judgment on each premise (A, B, C) and the conclusion (D).  
     - *Motivation:* Abstentions (e.g., on B) created ambiguity in whether grounds were "made out." The charter requires a binary determination.  
     - *Classification:* **Non-negotiable**.  
     - *Loss if dropped:* Unresolved premises prevent applying the charter’s rule, undermining authority.

  3. **Diachronic Profile-Integrity**  
     - *Statement:* The collective judgment must result from a single aggregation over a single profile of judgments from one fixed panel.  
     - *Motivation:* Mixing votes from different sittings/members (as in the second sitting) severs responsibility and coherence.  
     - *Classification:* **Non-negotiable**.  
     - *Loss if dropped:* No unified panel can be held responsible; the decision is a procedural artifact, not a collective act.

  4. **Collective Ownership/Defensibility**  
     - *Statement:* The final judgment set must be one that the panel, as a body, can affirm as its own position (even if not unanimously endorsed).  
     - *Motivation:* In the case, no member affirmed all premises leading to D except the three pro-withdrawal members. Publishing reasons "rejected by everyone but three" is indefensible.  
     - *Classification:* **Negotiable** (can be achieved via robust aggregation, not unanimity).  
     - *Loss if dropped:* The panel cannot credibly justify the decision; authority is hollow.

  5. **Transparency in Scoring Abstentions/Recusals**  
     - *Statement:* The rules must specify how abstentions/recusals are treated (e.g., as rejections, ignored, or separately tallied).  
     - *Motivation:* Ambiguity in scoring B (4–3 with abstentions vs. 4–5 if abstentions = no) led to contradictory outcomes.  
     - *Classification:* **Non-negotiable**.  
     - *Loss if dropped:* Outcomes become manipulable or ambiguous, eroding trust in the process.

  6. **Proposition-Wise Independence (Restricted)**  
     - *Statement:* The collective judgment on each proposition (A, B, C, D) must depend only on individual judgments on *that* proposition.  
     - *Motivation:* Prevents holism (e.g., members changing votes on B based on A’s outcome), ensuring fairness and focus on each ground.  
     - *Classification:* **Preference** (often treated as fairness but conflicts with consistency).  
     - *Loss if dropped:* Risk of strategic voting, but enables consistent outcomes.

  7. **Traceability**  
     - *Statement:* It must be possible to identify which members’ judgments were decisive for each collective judgment.  
     - *Motivation:* Accountability requires explaining how the outcome emerged (e.g., which votes swayed B).  
     - *Classification:* **Negotiable** (useful but not always essential if ownership is clear).  
     - *Loss if dropped:* Harder to justify to appellants, but defensibility can survive without it.

  8. **Invariance to Voting Order**  
     - *Statement:* The outcome must not change if the order of voting on propositions is altered.  
     - *Motivation:* Sequential voting could lead to path-dependent outcomes, privileging some grounds arbitrarily.  
     - *Classification:* **Preference** (aids fairness but not strictly necessary).  
     - *Loss if dropped:* Potential perception of arbitrariness, but defensibility may hold if the order is fixed in rules.

  ---

  ### Conflicts and Trade-offs
  - **Key Impossibility:** Proposition-wise majority voting (Requirement 6) + Consistency (1) + Completeness (2) are jointly unsatisfiable for agendas with logical dependencies (like A∧B∧C↔D). The case shows this: majority votes on A/B/C yield inconsistency with D.  
  - **Cheapest Surrender:** Drop **Proposition-Wise Independence** (6). This restores possibility (e.g., via premise-based voting) and is a **preference**, not a core requirement for authority.  
  - **Domain Restriction Legitimacy:** Restricting profiles (e.g., to "shared rankings") is **illegitimate** for this panel. Members arrive with independent judgments; excluding dissent violates the panel’s fact-finding purpose.  

  ---

  ### Most Disqualifying Requirement
  **Consistency (1)** eliminates the most candidates. Rules like conclusion-based voting or unrestricted majority voting fail it outright.  

  ### Critical Distinctions
  - **Beliefs vs. Decisions:** Belief aggregation (aim: truth) tolerates inconsistency; *decisions* (here) require consistency for defensibility.  
  - **Procedure vs. Outcome:** Premise-based and conclusion-based voting use the *same ballots* but produce *different outcomes*. The procedure must be fixed to ensure determinacy.  
  - **Consistency vs. Completeness:** Consistency is non-negotiable; completeness could be relaxed (e.g., allowing "undecided" on some grounds) but sacrifices clarity.  
  - **Synchronic vs. Diachronic Coherence:** Diachronic integrity (3) is distinct and vital—synchronous coherence alone doesn’t prevent pastiche judgments across sittings.  
  - **Collective Attitude vs. Ascription:** The panel must *hold* the judgment (Requirement 4), not have it ascribed. Ascription (e.g., "D lost 6–3") lacks authority.  

  ---

  ### Evaluation of Candidate Rules
  - **Conclusion-Based Voting (vote only on D):** Fails 1, 4 (ignores charter’s premises; reasons unexplainable).  
  - **Premise-Based Voting (vote A,B,C; derive D):** Satisfies 1,2,3,4 (if consistent). Violates 6 & 8 (order matters). **Best fit** if independence is relaxed.  
  - **Sequential Voting (fixed order):** Risks path-dependence (fails 8) but workable if order is justified.  
  - **Supermajority/Quotas:** May deadlock; doesn’t ensure consistency.  
  - **Distance-Based Rules (e.g., minimize disagreements):** Satisfies 1,2,3,4 but lacks transparency (fails 7) and may be computationally opaque.  
  - **Chair-Dictatorship:** Violates collective ownership (4) and defensibility.  
  - **Panel Votes on Procedure:** As in the case, leads to circularity and profile-integrity failure (violates 3).  

  ---

  ### Change for Purely Epistemic Purpose
  If the goal were truth-tracking (not authority), requirements shift: **Consistency** remains vital, but **Collective Ownership** and **Diachronic Integrity** become negotiable (e.g., use Bayesian updating across sittings). **Completeness** may relax if uncertainty is quantified. **Proposition-Wise Independence** is often dropped to prioritize accuracy (e.g., using deliberative methods). The core focus moves from defensibility to reliability.  

  This framework prioritizes the panel’s responsibility-bearing role, with consistency, diachronic integrity, and defensible ownership as non-negotiable pillars. Premise-based voting (with transparent abstention rules and fixed voting order) emerges as the most viable approach, accepting that proposition-wise independence is a procedural ideal secondary to rational outcomes.
