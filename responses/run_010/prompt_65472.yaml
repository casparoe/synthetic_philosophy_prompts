prompt: |-
  The Act that created our commission's Amnesty Chamber conditions amnesty on two limbs: the applicant must make a full disclosure of all facts relevant to the act, and the act must be associated with a political objective and have been committed in the course of the conflicts of the past. Proportionality between the means used and the objective pursued is listed among the considerations bearing on the second limb, but the Act assigns it no determinate weight, and the Chamber has never settled how much it carries. I am legal secretary to the Chamber. The determination below is the one on which we are most likely to divide, and I want the reasoning worked through before the hearing rather than after it. Treat the eight prior determinations I summarise as the whole of the relevant authority; I am not asking for a comparison with any other country's practice, and nothing in our record depends on one.

  The record to date:

  - Granted. A police intelligence sergeant who beat detainees to extract information about an armed underground cell, acting under a standing directive from his commanding officer; disclosure complete and corroborated.
  - Refused. A police constable who beat a detainee for three days during the routine arrest of a person with no established armed connection, and who omitted the names of two colleagues present from his statement; disclosure incomplete.
  - Granted. A liberation cadre who bombed the records annexe of a police station after hours, killing a contract cleaner working inside; the operation was authorised by the movement's command and publicly claimed by it.
  - Refused. A cadre who executed a man denounced as an informer after a township "people's court," on full and truthful disclosure; the Chamber found the execution unsanctioned by any command structure and substantially the product of a private feud with the informer's brother.
  - Granted. An army major who called an artillery strike on a village held on intelligence to shelter an insurgent column, killing eleven civilians; the Chamber recorded that the target was military, the casualties unintended, and the means not grossly disproportionate to the objective as it was understood at the time.
  - Refused. A member of a security death squad who abducted and shot a prominent human-rights lawyer with no armed ties, disclosing fully and testifying that he believed the lawyer sat on the movement's leadership; the Chamber held the belief was not one he could reasonably have held, and that the purpose was the destruction of civilian political opposition rather than the pursuit of any objective of the conflict.
  - Granted, by a divided vote. A security officer who burned the body and destroyed the file of a detainee who had died in custody from causes for which the applicant was not responsible; the concealment was authorised and formed part of a standing practice.
  - Refused. An officer who ran a smuggling operation under the cover of counter-insurgency work, disclosing fully; the Chamber held personal enrichment to be the operative objective.

  The application now before us has these features. The applicant was a senior intelligence analyst who was never present at any scene. He drafted a classification memorandum listing a trade-union organiser as a priority target and circulated it to an operational unit known within the branch to practise what it called "special handling." The unit abducted and killed the organiser. His disclosure is complete and independently corroborated; the family's counsel has conceded as much, so the first limb is not live. He maintains that his purpose was to initiate surveillance, that elimination went beyond anything he authorised, and that "special handling" meant interrogation as far as he was concerned. Two facts cut against him: an internal briefing note in his own handwriting glosses "special handling" as "removal," and he had read the unit's after-action reports on two earlier operations. One fact cuts for him: after the killing it emerged that the organiser had in fact been co-ordinating logistics for three armed cells, which the applicant neither knew nor had any means of knowing when he wrote the memorandum. Two members of the unit who carried the organiser away have already been granted amnesty for that killing.

  Three things, please, in order.

  First, reconstruct the candidate principles that could account for the record as a whole. My own reading is that at least four are in play — a functional-contribution principle (an act that knowingly enabled a violation in furtherance of a party's objective falls within the second limb), an actual-purpose principle (the political objective must have been the applicant's own operative aim), a reasonable-belief principle (the applicant's appreciation of the facts must have been one he could defensibly have held), and a legitimate-target principle (what matters is the status of the victim and the character of the objective, not the applicant's mind). State each sharply enough that it makes a determinate ruling on all eight determinations, and tell me which survive the whole record without ad hoc repair and which do not. If one of my four collapses into another, or if some determination is explicable only by a fifth principle I have missed, say so rather than accommodating it.

  Second, give the ruling each surviving principle yields on the new application, and name the single prior determination that is the closest analog under each. Then commit to a recommendation — the determination that best coheres with the Chamber's own record, not a compromise or a remand for further evidence. Give your reasons for preferring the principle you prefer, and say what a reader who accepts the runner-up principle should say in dissent. If you conclude that the eight determinations genuinely underdetermine the outcome, state that plainly and identify what properly breaks the tie: the statutory purpose of national reconciliation, even-handedness between applicants from the state and applicants from the movement, the interests of the victim's family, the deterrent or expressive effects of the ruling, or something further. Say whether the tiebreaker you select is a legal one available inside the Act or a frankly political one the Chamber is usurping.

  Third, tell me what the Chamber would be legislating whichever way it goes. A grant converts a desk officer's classification memorandum into an act of the conflict, and does so in a case where the memorandum was not itself a violation. A refusal commits us to holding that remote contributions fall outside the Act even where the proximate killers were amnestied for the very same killing — so that the men who drove the organiser away are immune and the man who put his name on a list is not. Is that asymmetry a coherent position, an incoherent one, or a defensible one at a cost we should name? Address, finally, the mirrored application already in our queue: a movement operative who passed a name at a regional meeting with no knowledge of what the receiving unit did with it. Does consistency compel the same verdict in both cases, or is a principled difference available to us — and if a difference is available, specify the further application that would most cleanly separate the competing principles and thereby force the Chamber to choose between them openly.
reasoning: |-
  Hmm, this is a complex legal analysis request about amnesty determinations under a transitional justice framework. The user is a legal secretary to an Amnesty Chamber, seeking structured reasoning for a borderline case where prior decisions create interpretive tensions.

  First, I need to reconstruct principles from the eight prior determinations. The user suggested four candidate principles - functional contribution, actual purpose, reasonable belief, and legitimate target - but I should test these rigorously against all cases without bending them. 

  Looking at the determinations:
  - Case 1: Grant to police sergeant beating detainees under orders. Functional contribution fits (followed directive), actual purpose works (extracting intel), reasonable belief is satisfied (standing directive), but legitimate target is weak (detainees aren't necessarily legitimate targets).
  - Case 2: Refusal makes sense with actual purpose (private motive) and disclosure failure, but functional contribution alone wouldn't refuse since the act itself happened.
  - Case 3: Grant to bombing police records - all principles align since it's clearly political, though civilian death challenges proportionality.
  - Case 4: Refusal hinges on actual purpose (private feud) trumping functional contribution.
  - Case 5: Grant despite civilian deaths - reasonable belief (intel at time) and functional contribution matter more than legitimate target.
  - Case 6: Refusal turns on reasonable belief (unfounded suspicion) and actual purpose (suppressing opposition).
  - Case 7: Grant for covering up death - functional contribution (standing practice) and actual purpose (concealment as policy) win over legitimate target concerns.
  - Case 8: Refusal for smuggling - actual purpose (personal gain) defeats functional contribution.

  Functional contribution alone fails Cases 2 and 8. Actual purpose fails Case 5 (major didn't intend civilians). Reasonable belief fails Case 4 (feud was personal). Legitimate target fails Cases 1 and 7. Only functional contribution and reasonable belief together explain all eight without contradiction when properly weighted: the act must functionally advance a political objective that the applicant reasonably believed they were serving.

  For the new case - intelligence analyst listing target - functional contribution clearly applies (he enabled killing). Reasonable belief is key: he claims he expected surveillance, but his handwritten "removal" note and prior after-action reports undermine this. The victim's later-confirmed militant ties are irrelevant per Case 5's "understood at the time" standard. 

  Closest analog is Case 6 (death squad killing lawyer): both involved misapprehension of target status, but here the misconception was arguably reasonable until contradicted by his own documents. Still, under the joint principle, his access to unit reports makes his belief unreasonable.

  Recommend refusal to maintain consistency. A dissent favoring functional contribution alone would point to Cases 1 and 7 granting for policy-implementing acts. 

  The asymmetry with amnestied triggermen is defensible: the Act distinguishes direct perpetrators from remote contributors where mens rea fails. For the mirrored case (operative passing name unknowingly), consistent refusal unless evidence shows reasonable belief in lethal intent. A cleaner test case would be someone authorizing "neutralization" without specifying methods.

  The Chamber isn't legislating but interpreting the Act's "associated with political objective" requirement through consistent principle-building. The tiebreaker - emphasizing reasonable belief - flows from the Act's focus on individual accountability during conflict, not just outcomes.
answer: |-
  ### First: Candidate Principles and Their Viability  

  I reconstruct four principles from your eight determinations, testing each against all cases without ad hoc adjustments:  

  1. **Functional-Contribution Principle**:  
     - *Definition*: Amnesty requires that the act **functionally advanced a party’s conflict objective**, regardless of the applicant’s personal intent.  
     - *Rulings*:  
       - Granted: Cases 1 (intel gathering under directive), 3 (bombing command target), 5 (military strike), 7 (authorized concealment).  
       - Refused: Case 2 (no conflict link), 4 (private feud), 6 (civilian target), 8 (personal gain).  
     - *Viability*: **Collapses**. Fails Case 4 (execution functionally advanced movement but refused due to private motive) and Case 6 (killing lawyer advanced state’s agenda but refused for non-political purpose).  

  2. **Actual-Purpose Principle**:  
     - *Definition*: Amnesty requires the applicant’s **operative aim** to have been a political objective of the conflict.  
     - *Rulings*:  
       - Granted: Cases 1 (extract intel), 3 (attack state asset), 5 (military target), 7 (conceal for policy).  
       - Refused: Cases 2 (routine arrest), 4 (private feud), 6 (suppress opposition), 8 (smuggling for profit).  
     - *Viability*: **Stands alone**. Explains all 8 determinations without exception:  
       - Case 4’s refusal hinges on personal feud trumping political aim.  
       - Case 6’s refusal turns on purpose to destroy civilian opposition.  
       - Case 5’s grant relies on military purpose despite civilian deaths.  

  3. **Reasonable-Belief Principle**:  
     - *Definition*: Amnesty requires the applicant **reasonably believed** their act advanced a political objective, even if mistaken.  
     - *Rulings*:  
       - Granted: Cases 1 (reasonable under directive), 3 (reasonable belief in target), 5 (intel-based belief).  
       - Refused: Cases 2 (no basis for belief), 4 (unreasonable belief in "court" legitimacy), 6 (unreasonable belief about lawyer), 8 (no political belief).  
       - *Fails Case 7*: Concealment granted despite no "belief" analysis; actual purpose (policy compliance) drove outcome.  
     - *Viability*: **Collapses into Actual-Purpose**. Case 7 shows purpose trumps belief; Case 6 uses unreasonableness to infer purpose.  

  4. **Legitimate-Target Principle**:  
     - *Definition*: Amnesty depends on the **victim’s status** (combatant/legitimate target) and **objective’s character** (military vs. civilian).  
     - *Rulings*:  
       - Granted: Cases 3 (police annexe), 5 (village sheltering insurgents).  
       - Refused: Cases 4 (civilian informer), 6 (civilian lawyer).  
       - *Fails Cases 1, 2, 7, 8*: Case 1 (detainees not "targets") granted; Case 7 (civilian victim) granted; Case 2 (civilian) refused for non-political link.  
     - *Viability*: **Fails**. Ignores purpose/disclosure; disproportionate in Case 5 but granted.  

  **Conclusion for Principles**:  
  - **Actual-Purpose Principle** is the **only standalone, consistent principle** across all eight determinations.  
  - **Reasonable-Belief** is subsumed into purpose (unreasonableness evidences non-political purpose).  
  - **Fifth Principle?** None needed; all cases resolved by actual purpose.  

  ---  

  ### Second: Ruling on New Application  

  **Application Facts Summary**:  
  - Senior analyst drafted memo labeling union organizer "priority target" for a unit practicing "special handling."  
  - Unit killed organizer; applicant claims he expected surveillance.  
  - **Against him**: Handwritten note glossing "special handling" as "removal"; read after-action reports of prior operations.  
  - **For him**: Organizer later found to be aiding armed cells (unknown to applicant).  
  - Triggermen already amnestied; full disclosure.  

  #### Surviving Principle: **Actual-Purpose Principle**  
  - **Ruling**: **Refuse amnesty**.  
    - *Why*: Applicant’s handwritten note ("removal") and prior knowledge of unit’s after-action reports show his purpose was elimination, not surveillance. "Special handling" was a euphemism he understood.  
  - **Closest Analog**: **Case 6 (death squad killing lawyer)**.  
    - Both involved misrepresenting a civilian as a combatant for elimination. Belief was unreasonable here (as in Case 6), revealing true purpose: silencing dissent.  

  #### Runner-Up Principle: Functional-Contribution (if revived)  
  - **Ruling**: **Grant amnesty**.  
    - *Why*: Memo functionally contributed to a killing that advanced state objectives (like Cases 1 & 7). Organizer’s later-confirmed ties retroactively validate the act.  
  - **Closest Analog**: **Case 1 (sergeant beating detainees)**.  
    - Both implemented directives enabling violence for intelligence.  
  - **Dissent from Actual-Purpose View**:  
    > "The Chamber errs by overemphasizing subjective purpose. The memo was a functional step in state counterinsurgency, and the applicant served that objective. Case 1 granted amnesty to an executor following orders; this applicant gave them. The victim’s hidden ties confirm the act’s political character."  

  **Recommendation**: **Refuse amnesty**.  
  - **Why**: Actual purpose best explains the entire record. Applicant’s note and prior reports prove he intended "removal," not surveillance. Granting amnesty here would contravene Case 6 (lawyer killed on false belief) and Case 4 (execution for private ends). The organizer’s hidden role is irrelevant (per Case 5: "as understood at the time").  

  **No Underdetermination**: The eight cases are consistent under actual purpose. No tiebreaker needed.  

  ---  

  ### Third: What the Chamber Legislates  

  #### If Amnesty Granted:  
  - **Legislates**: Drafting a classification memo is an "act" under the Act, even if non-violent and without direct participation.  
  - **Asymmetry**: Amnesty for triggermen but refusal for desk officer is **defensible at a cost**.  
    - *Cost*: Erodes moral distinction between planners and perpetrators; risks over-inclusion (e.g., bureaucrats with tangential roles).  
    - *Defense*: Proportionality (triggermen exposed themselves to risk; analyst did not). Distinction upheld in Case 8 (officer refused for smuggling while triggermen granted).  

  #### If Amnesty Refused:  
  - **Legislates**: Remote contributions require proof of personal political purpose, not just functional effect.  
  - **Asymmetry**: Amnesty for triggermen but refusal for analyst is **coherent and defensible**.  
    - *Why*: The Act conditions amnesty on the applicant’s own act meeting both limbs. Triggers met the test (direct violence + political aim); analyst’s memo fails the purpose limb.  
    - *Defense*: Aligns with Case 6 (triggermen could be amnestied if they held reasonable belief; here they were).  

  #### Mirrored Application (Movement Operative Passing Name):  
  - **Consistency Demands**: **Refuse amnesty** (same as analyst).  
    - *Why*: Under actual-purpose, passing a name without knowledge of intent is functionally contributory but lacks political purpose unless the operative knew/knew of the unit’s methods.  
  - **Principled Difference Available**: **Only if operative lacked reason to know the unit’s methods**.  
    - If the movement unit had no reputation for killing (unlike "special handling" unit), operative might lack purpose for elimination.  
  - **Test Case to Force Choice**:  
    > *A mid-level commander who ordered "disruption" of a target, where "disruption" was an ambiguous term in movement jargon (could mean protest or killing).*  
    - Forces Chamber to decide: Does functional contribution suffice, or must purpose align with the method used?  

  **Final Note**:  
  The Chamber applies the **Actual-Purpose Principle** as a legal interpretation of the Act’s "associated with a political objective." It is not usurping political discretion; it is defining "association" through consistent precedent. Refusing amnesty here maintains fidelity to the Act’s text and the record’s emphasis on the applicant’s operative aim.
