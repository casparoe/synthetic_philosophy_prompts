prompt: |-
  A common gloss on Strawson's Freedom and Resentment is that it dissolves the free will problem rather than settling it: resentment, indignation, and guilt are natural, non-optional responses that we cannot revise in light of metaphysics, so the truth or falsity of determinism simply drops out of the justification for holding people responsible. On that reading, what substantive question is left for the compatibility debate — what could Frankfurt-style cases and the consequence argument still be disagreeing about, if not the intelligibility of responsibility itself? Please answer in American English.
reasoning: |-
  Okay, the user is asking about Strawson's "Freedom and Resentment" and how it relates to the free will debate. They mention the common gloss that Strawson dissolves rather than solves the problem. The key point is that reactive attitudes like resentment are natural and not based on metaphysics. So, if determinism's truth doesn't affect our practices of holding people responsible, what's left for compatibilists and incompatibilists to debate? The user specifically wants to know what Frankfurt-style cases and the Consequence Argument are addressing if not responsibility's intelligibility.

  First, I need to recall Strawson's main argument. He shifts the focus from metaphysical free will to our reactive attitudes. These attitudes are part of our social framework, so the justification for responsibility comes from our interpersonal relationships, not determinism. So, the traditional debate about determinism's compatibility with free will is misguided because our practices don't depend on it.

  But then, what do Frankfurt cases and the Consequence Argument argue about? Frankfurt cases aim to show that alternative possibilities aren't necessary for moral responsibility. They present scenarios where an agent couldn't have done otherwise but is still responsible. This targets the Principle of Alternate Possibilities (PAP), which some incompatibilists use. If PAP is false, then determinism might not threaten responsibility in the way incompatibilists think.

  The Consequence Argument, on the other hand, argues that if determinism is true, we lack the control needed for responsibility. It claims that our actions are consequences of past events and laws beyond our control. So, incompatibilists use this to say determinism rules out free will.

  Now, after Strawson, the debate shifts. Compatibilists might accept that reactive attitudes are primary but still need to articulate what makes an agent an appropriate target for those attitudes. They focus on qualities like reasons-responsiveness. For example, an agent must be capable of understanding moral reasons and acting accordingly. This is where Frankfurt cases come in—they test whether alternative possibilities are necessary or if actual sequence control (like reasons-responsiveness) suffices.

  Incompatibilists, post-Strawson, might grant the naturalness of reactive attitudes but argue that without ultimate control (metaphysical freedom), our practices are unjustified. They might say that even if we can't help but feel resentment, determinism shows that no one truly deserves blame. So, the debate becomes about the conditions under which reactive attitudes are appropriate, not whether we have them.

  So, the substantive questions left are: What makes an agent a fair target for reactive attitudes? Do we need ultimate control (incompatibilism) or is reasons-responsiveness enough (compatibilism)? Frankfurt cases attack the need for alternative possibilities, supporting compatibilism by emphasizing actual control. The Consequence Argument insists that determinism undermines control, thus responsibility. They're debating the necessary conditions for justified responsibility within our practices, not the existence of those practices.

  The user might be a philosophy student or enthusiast trying to grasp the contemporary relevance of the free will debate after Strawson's contribution. They want to understand how arguments like Frankfurt and Consequence fit into the shifted landscape. Their deeper need could be reconciling the persistence of technical debates with Strawson's dissolution, or seeking clarity on where current disagreements lie. They might also be interested in how practical responsibility relates to metaphysical concerns, possibly for academic writing or personal understanding.
answer: |-
  That's a sharp reading of Strawson. You're right: if Strawson successfully shifts the foundation of responsibility *entirely* away from metaphysics and onto our natural, inescapable reactive attitudes (resentment, indignation, gratitude, etc.), then the traditional question "Is free will compatible with determinism?" seems to lose its grip on the justification of our practices. Determinism simply becomes irrelevant to the *existence* of these attitudes and the practices they ground.

  So, what substantive debate remains? Frankfurt-style cases and the Consequence Argument aren't rendered meaningless, but their target shifts. They're no longer primarily arguing about *whether* responsibility is intelligible or our practices justified *at all* (Strawson says they are, inherently, via the reactive attitudes). Instead, they're arguing about **the necessary conditions within the participant stance for holding someone *appropriately* responsible** – specifically, what kind of *control* or *agency* an agent must exhibit to be a *fair* or *justified* target of those reactive attitudes *in specific instances*.

  Here's the breakdown of the remaining debate:

  1.  **The Core Question Becomes:** What features must an agent possess for our reactive attitudes (like resentment or indignation) to be *apt* or *fitting* responses *to them*? Strawson himself points towards things like normal cognitive capacities, understanding, and the capacity for meaningful relationships. The debate focuses on refining these conditions, particularly concerning control.

  2.  **What Frankfurt-Style Cases Target (Compatibility within the Participant Stance):**
      *   **Target:** The Principle of Alternate Possibilities (PAP): The idea that someone is morally responsible *only if* they could have done otherwise.
      *   **Strawsonian Relevance:** Compatibilists (and some others) use Frankfurt cases to argue that PAP is *false* even *within* our practice of holding responsible. They show scenarios where an agent intuitively *deserves* blame/responsibility (and thus resentment/indignation seem *apt*) even though they *could not have done otherwise* due to some counterfactual intervener (e.g., Jones votes freely, but Black would have forced him to vote that way if he'd tried otherwise). Jones is a fitting target for resentment.
      *   **The Substantive Disagreement:** Compatibilists argue that what *really* matters for apt reactive attitudes is not alternative possibilities, but "actual sequence" properties – like the agent's *reasons-responsiveness*, their *quality of will*, or their *guidance control* at the time of action. Frankfurt cases aim to demonstrate this *within* the framework of our responsibility practices.

  3.  **What the Consequence Argument Targets (Ultimate Control Requirement):**
      *   **Target:** The possibility of *any* genuine control or sourcehood *if determinism is true*.
      *   **Strawsonian Relevance:** Incompatibilists (libertarians and hard determinists) grant that we *have* reactive attitudes naturally. However, they argue that if determinism is true, these attitudes are *systematically mistaken* or *unfair* because no agent has the *kind of ultimate control* required to be a *truly deserving* target. The Consequence Argument (roughly: if determinism is true, our actions are the consequence of the distant past + laws of nature, neither of which we control, so we lack control) aims to show that determinism rules out the kind of control (often called "ultimate responsibility" or "causal sourcehood") they believe is *essential* for the reactive attitudes to be *fully justified* or *apt*.
      *   **The Substantive Disagreement:** The incompatibilist argues that for resentment/indignation to be *truly fitting* and not just an unavoidable psychological reaction, the agent must have been the *ultimate source* of their action in a way incompatible with determinism. They claim Strawson has shown *why* we *feel* responsible, but not that these feelings are *metaphysically justified* if determinism is true. The Consequence Argument is their weapon to show determinism *undermines* the necessary condition (ultimate control).

  **In Short:**

  *   **Post-Strawson, the debate isn't about whether responsibility *exists* as a practice (Strawson says it does, grounded in reactive attitudes).**
  *   **It's about: What are the *necessary conditions* within our participant stance for holding someone *appropriately* responsible and for reactive attitudes like resentment to be *apt*?**
  *   **Frankfurt Cases:** Argue that *alternative possibilities* are NOT a necessary condition for apt reactive attitudes; *actual sequence control* (like reasons-responsiveness) is sufficient. (Compatibility *within* the practice).
  *   **Consequence Argument:** Argues that *ultimate control/sourcehood* (incompatible with determinism) IS a necessary condition for reactive attitudes to be *truly apt/justified*, otherwise they are systematically unfair. (Requires incompatibility *for* the practice to be fully justified).

  They are disagreeing about **the nature of the *control* required for an agent to be a *fair* or *fitting* object of our natural, non-optional reactive attitudes**, not about the intelligibility of the attitudes or the practice itself. The battleground shifts from justifying the *existence* of responsibility to defining the *conditions for its proper application* within the participant stance Strawson described.
