  ### Legend Formation Lab: Design Rationale
  I'll design a **branched oral transmission activity** focused on **interdependence of sources** and **embarrassing details**, mirroring real-world historiography challenges. The chosen structure forces students to grapple with "independent attestation" pitfalls and selective omission of uncomfortable truths. Why this design?

  1. **Branched Transmission** (3 initial witnesses → 2 retellers each → 1 final recipient each) creates interdependent accounts while fitting 18 students perfectly:  
     - Gen1: 3 witnesses  
     - Gen2: 6 retellers (each Gen1 tells to 2 Gen2)  
     - Gen3: 9 final recipients (each Gen2 tells to 1-2 Gen3; 3 branches × 3 students)  
     *Why?* Forces later discovery that "multiple accounts" may share a single source.

  2. **Awkward Detail**: Instructor accidentally drops a $20 bill during the event.  
     *Why?* Retellers may omit this (embarrassing to instructor) or embellish (e.g., "stolen money"), testing criteria of embarrassment.

  3. **Controlled Chaos**: Ordinary event has clear checkpoints (claims), but enough complexity (4 actions + 1 prop) to mutate during retelling.

