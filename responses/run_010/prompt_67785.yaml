  ### Why This Works
  - **Branching Trap**: By having Gen2 B/C and Gen3 D/E/F/G *all* descend from Gen1 A, students directly experience how "multiple attestations" can be misleading—just like Arthurian legends proliferating from Geoffrey of Monmouth's single source.
  - **Awkward Truth**: The dropped money mirrors real uncomfortable truths (e.g., David's Bathsheba scandal in Bible transmission), testing if historians spot omission patterns.
  - **No Philosophy Needed**: Concepts emerge from gameplay. Debrief explicitly ties to Troy/Exodus.
  - **Time Efficiency**: 90 mins optimized: 25-min transmission (chaotic but contained), 40-min analysis (structured inquiry).

  **Adjust for Groups**: If attendance dips, remove one Gen3 recipient per branch. If over 18, add a Gen4 (1 per branch) to deepen branching.
