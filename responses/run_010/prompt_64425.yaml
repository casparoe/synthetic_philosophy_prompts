answer: |-
  Here is a menu of distinct readings of "the wavefunction isn't a thing," analyzed as requested. Your conjecture is largely correct but requires refinement; I'll address it after presenting the menu.

  ---

  ### **The Menu of Readings**

  #### **Reading 1: Eliminative Non-Realism**  
  **Thesis:** The wavefunction has no referent in reality; it is *merely* a calculational tool for predicting measurement outcomes, with no counterpart in the physical world.  
  **Classification:** Substantive and defensible (e.g., QBism, instrumentalism).  
  - **(a) Overlapping states:** Accepts overlap (epistemic states aren’t constrained by ontic states).  
  - **(b) Ontology vs. law:** Neither ontology nor fundamental law; it’s an agent’s tool.  
  - **(c) Separability/Locality:** Irrelevant (no ontic state described).  

  #### **Reading 2: Non-Representational Mathematical Object**  
  **Thesis:** The wavefunction is a mathematical object (like a probability distribution) that *represents* physical states/processes but is not itself a physical entity.  
  **Classification:** Platitude (widely accepted by realists and anti-realists).  
  - **(a) Overlapping states:** Permits overlap if underlying states are hidden.  
  - **(b) Ontology vs. law:** Part of the *description* of dynamics, not a physical constituent.  
  - **(c) Separability/Locality:** Depends on underlying ontology (e.g., separable if ψ describes local beables).  

  #### **Reading 3: Epistemic State (Pure QBism)**  
  **Thesis:** The wavefunction *solely* encodes an agent’s subjective beliefs/expectations about future measurements.  
  **Classification:** Substantive and defensible (QBism).  
  - **(a) Overlapping states:** Necessarily accepts overlap (distinct beliefs can correspond to same physical reality).  
  - **(b) Ontology vs. law:** Not ontology; not a law (it’s mind-dependent).  
  - **(c) Separability/Locality:** N/A (no objective physical state supervenes on ψ).  

  #### **Reading 4: Nomological Entity (Bohmian Law View)**  
  **Thesis:** The wavefunction is a *law-like* entity governing the evolution of particles (or other primitives), not a physical "thing" in the same category as matter/fields.  
  **Classification:** Substantive and defensible (Bohmian nomological views).  
  - **(a) Overlapping states:** Rejects overlap (ψ determines unique particle configurations).  
  - **(b) Ontology vs. law:** Part of the dynamical law; not part of ontology.  
  - **(c) Separability/Locality:** Non-separable (ψ is global) but local supervenience via particles.  

  #### **Reading 5: Reduced Ontological Status (Ψ-Ontology Lite)**  
  **Thesis:** The wavefunction is real but *not fundamental*; it emerges from or reduces to more basic entities (e.g., patterns in a separable field, information-theoretic primitives).  
  **Classification:** Substantive and defensible (e.g., some collapse models, ontological reductionism).  
  - **(a) Overlapping states:** Rejects overlap (ψ supervenes on fundamental states).  
  - **(b) Ontology vs. law:** Ontological, but derivative/non-fundamental.  
  - **(c) Separability/Locality:** Typically separable/locally supervenient at fundamental level.  

  ---

  ### **Direct Answers**

  #### **1. Pusey-Barrett-Rudolph (PBR) and the Readings**  
  - **Ruled out:** PBR directly challenges **Reading 3 (Epistemic State)** and **Reading 5 (Reduced Ontology)** *if* they permit overlapping states. PBR shows that distinct pure states cannot correspond to identical underlying physical states (rejecting overlap).  
  - **Unaffected:**  
    - **Reading 1 (Eliminativism):** Rejects PBR’s ontological framework.  
    - **Reading 2 (Math Object):** Compatible if ψ is non-representational.  
    - **Reading 4 (Nomological):** Immune (ψ governs ontology but isn’t an "ontic state" in PBR’s sense).  
  - **Role of Ontological Models Framework:** Accepting PBR requires buying into this framework. **Readings 1, 2, and 4** reject it implicitly (by denying ψ describes ontic states), evading PBR. Only interpretations treating ψ as representing physical states (**3 & 5**) are vulnerable.  

  #### **2. Dissolving the Configuration-Space Worry**  
  The objection: "A 3N-dimensional configuration space isn’t the space we inhabit."  
  - **Genuinely dissolves the worry: Reading 1 (Eliminativism)** and **Reading 3 (QBism)**. If ψ isn’t real or isn’t about reality, it doesn’t "inhabit" any space.  
  - **Relocates but doesn’t dissolve: Reading 4 (Nomological Bohmian)**. While ψ isn’t a "thing," it still *lives on* configuration space to guide particles. The worry becomes: "Why must laws be defined on abstract spaces?"  
  - **Ignores the worry: Readings 2 & 5**, as they treat ψ as representational/emergent in a way that may still require 3N-space.  

  #### **3. The Equivocation Between Bohmian and QBist**  
  - **Bohmian (Reading 4):** "Not a thing" = not an *ontological entity* (like particles); it’s a *law*.  
  - **QBist (Reading 3):** "Not a thing" = not *mind-independent*; it’s a *subjective state of belief*.  
  - **Equivocation:** Both deny ψ is a physical "object," but:  
    - The Bohmian affirms ψ is *objectively real* (as law).  
    - The QBist denies ψ is *objective* at all.  
    - **False alliance:** They agree ψ isn’t a *material entity*, but disagree on whether it is real, objective, or physical.  

  ---

  ### **Testing Your Conjecture**  
  Your guess identifies two key questions:  
  1. **Is the quantum state *ontological* (part of the world) or *descriptive*?**  
  2. **Is it a *state* (of a system/agent) or a *rule* (governing dynamics)?**  

  **Assessment:**  
  - **Strengths:** This explains the Bohmian/QBist divide:  
    - Bohmian: ψ is *descriptive* (not ontological) and a *rule* (not a state).  
    - QBist: ψ is *descriptive* (not ontological) and a *state* (of an agent).  
  - **What’s missing:** A third dimension: **Whose state or rule?**  
    - Objective (law of nature) vs. subjective (agent’s belief).  
    - **Revised Taxonomy:**  
      - **A. Ontological status:** Is ψ part of the furniture of reality? (Yes/No)  
      - **B. Functional role:** Is it a *governing rule*, a *physical state*, or an *epistemic state*?  
      - **C. Scope of reality:** Does it describe *mind-independent* reality or *agent-dependent* perspectives?  

  This taxonomy places:  
  - **Bohmian (Reading 4):** A: Yes (real), B: Rule, C: Objective.  
  - **QBist (Reading 3):** A: No (not mind-independently real), B: Epistemic state, C: Subjective.  

  **Conclusion:** Your conjecture is insightful but incomplete without accounting for objectivity/subjectivity. The slogan "not a thing" obscures all three dimensions, allowing superficially similar but fundamentally opposed views to sound identical.
