prompt: |-
  I sit on my high school's Student Handbook Review Board, a five-student panel that hears appeals from disciplinary citations. Our faculty adviser insists that we interpret the handbook the way a court interprets a statute, and he keeps asking whether we are textualists or purposivists without ever letting us settle it. Our record so far: (1) a student cited under "Cell phones must remain out of sight from first bell to last bell" whose phone vibrated audibly inside a zipped backpack during an exam; we dismissed, because the phone was not visible. (2) a student cited under "No food or drink in the computer lab" for carrying a sealed, unopened water bottle in his backpack; the handbook states that the rule exists to protect the machines, and we upheld the citation anyway. (3) a student cited under "Students may not use another person's login credentials" who logged into a classroom laptop with his teacher's account at the teacher's explicit direction in order to start a film for the class; we dismissed, with two members dissenting on the ground that the words admit no exception. (4) a student cited under "No recording devices anywhere on campus," a provision broadened last year from "No recording devices in locker rooms and restrooms"; we upheld, citing the amendment.

  The case now before us: a student cited under "No food or drink in the auditorium during performances" for carrying a sealed water bottle into a recital. She never opened it, carried it out full, and an usher had already inspected her bag at the door. Which candidate principles of interpretation are consistent with all four precedents, and which are ruled out by them? Which single precedent is the closest analog, and what should we decide in order to remain consistent with ourselves? If our record genuinely underdetermines this case, what principle would each option commit us to in writing, and what further hypothetical case would finally force the competing readings apart? Please answer in American English.
reasoning: |-
  Okay, the user is part of their high school's Student Handbook Review Board. They have to interpret the rules like a court would with statutes, but their faculty adviser keeps pushing them to define whether they're textualists or purposivists without letting them settle on one approach. They've provided four past cases and now have a new one about a sealed water bottle in the auditorium. I need to figure out which interpretation principles align with all past decisions, which ones are ruled out, find the closest precedent, and then guide them on how to decide the current case consistently.

  First, I should look at each case and identify the reasoning used. For case (1), the phone was in a zipped backpack and not visible. They dismissed the citation because the rule specifically mentioned "out of sight," and since it wasn't visible, they stuck to the text. That seems textualist.

  Case (2) involved a sealed water bottle in a computer lab. The handbook's purpose was to protect machines, but they upheld the citation even though the bottle was sealed and in a backpack. Here, they focused on the literal text ("no food or drink") without considering the purpose. That also feels textualist because the purpose was clear (protecting machines), but they ignored it to enforce the strict wording.

  Case (3) was about a student using a teacher's login at the teacher's direction. They dismissed the citation, which seems purposivist because the rule's intent was likely to prevent unauthorized access, not to stop actions under direct supervision. The dissenters were textualists, arguing the words didn't allow exceptions.

  Case (4) involved a ban on recording devices everywhere on campus after an amendment. They upheld the citation, which is textualist since the rule was broadened explicitly, showing adherence to the text as written.

  Looking at all four, they've used both approaches. Cases (1), (2), and (4) are textualist, while case (3) is purposivist. To find principles consistent with all, I need something flexible. Maybe the board uses textualism as the default but switches to purposivism when the text leads to absurd outcomes, like in case (3). That could be a hybrid approach.

  For the current case about the sealed water bottle in the auditorium, the closest precedent is case (2), where they upheld the citation for a sealed bottle in the computer lab. If they want to be consistent, they might uphold here too. But the purpose of the auditorium rule might be different—perhaps to prevent spills or distractions during performances. If the bottle was sealed and inspected, maybe it's safe. However, consistency with case (2) would lean toward upholding.

  If the decision is underdetermined, choosing to uphold commits them to textualism in similar cases. Dismissing would require them to distinguish based on purpose, like the rule's intent to prevent spills, and since no risk existed, they could dismiss. That would align more with case (3)'s purposivism.

  A hypothetical to force the issue could involve a student with a sealed water bottle in a non-performance setting in the auditorium. Textualists would still uphold, while purposivists might dismiss if there's no performance happening. That would clarify their approach.
answer: |-
  Based on your record, your board operates with a **flexible, context-aware approach that defaults to textualism but switches to purposivism when a strict textual reading creates absurdity or contradicts a clearly stated purpose in the handbook itself**. Here's how your precedents align and what that means for the current case:

  ### Candidate Principles & Their Consistency
  1.  **Pure Textualism (ruled out):** Strictly applying the literal words without considering purpose.
      *   *Inconsistent with:* **Case (3)**. You dismissed despite the literal text ("may not use another person's login credentials") having no explicit exception for teacher permission. Pure textualism would have required upholding.
  2.  **Pure Purposivism (ruled out):** Prioritizing the rule's underlying purpose over the literal text.
      *   *Inconsistent with:* **Case (2)**. The stated purpose ("to protect the machines") was clear, and the sealed bottle posed no risk, yet you upheld the literal text ("no food or drink") anyway.
      *   *Also Inconsistent with:* **Case (4)**. The purpose of the original rule (privacy in sensitive areas) was expanded textually to a blanket ban. Pure purposivism might have argued the amendment didn't logically extend the *purpose* to non-sensitive areas.
  3.  **Textualism Default with Purposivist Escape Valve (consistent):** Prioritizing the plain meaning of the words *unless*:
      *   (a) The literal application leads to an absurd or nonsensical result (**Case 3** - punishing a student explicitly following teacher instructions is absurd).
      *   (b) The handbook explicitly states a narrow purpose that directly contradicts the broad text *and* the specific facts align perfectly with that purpose (**Case 2** is the *limit* of this - purpose was stated but you *still* applied the text strictly, showing this escape valve is narrow).
      *   *Also Consistent with:* **Case 1** (applied "out of sight" literally) and **Case 4** (applied the amended text literally).
  4.  **Strong Presumption of Textualism, Overcome Only by Handbook-Stated Purpose (consistent):** Similar to above, but the escape valve *only* triggers if the handbook *itself* states the rule's purpose and the facts make the literal application directly contradict *that stated purpose*.
      *   *Consistent with all:* **Case 1** (no stated purpose, textualism applied). **Case 2** (stated purpose, but literal text upheld anyway - showing the presumption is very strong). **Case 3** (dismissal *could* imply a presumed purpose against *unauthorized* use, even if not stated). **Case 4** (text amended, purpose presumably expanded, textualism applied).

  ### Closest Analog & Consistent Decision
  *   **Closest Analog: Case (2)** ("No food or drink in the computer lab" - sealed bottle in backpack). The core elements are identical: a broad "no item" rule, a handbook-stated purpose (protecting machines/preventing mess/distractions?), an item sealed and contained, posing no immediate threat to the stated purpose.
  *   **Consistent Decision:** To remain consistent with **Case (2)**, you should **Uphold the citation**. You previously upheld a citation for possessing a *sealed* drink in a prohibited area despite a stated purpose that the item didn't violate. Applying that here means the literal text "no food or drink" prohibits possession, regardless of whether the seal or container mitigates the risk related to the rule's purpose.

  ### Underdetermination & Commitment
  This case *is* genuinely underdetermined because **Case (3)** demonstrates your willingness to look beyond the text to avoid absurdity. The sealed water bottle in the auditorium presents a tension:
  *   **Upholding (aligns with Case 2 textualism):** Argues the literal prohibition on possession ("carrying") controls. The purpose (likely preventing spills, stains, or distractions during performances) doesn't *require* an exception for sealed containers, even if it makes sense.
  *   **Dismissing (aligns with Case 3 purposivism):** Argues the *purpose* of the rule (preventing mess/distraction *during the performance*) wasn't threatened by a sealed bottle inspected and unopened. Punishing possession here, despite zero risk, could be seen as unreasonable or overly strict.

  **What Each Option Commits You To:**
  1.  **If You Uphold:** You commit to the principle that **a prohibition on possessing "food or drink" in a specified area bans the *mere presence* of such items, regardless of containment, seal, or immediate risk, unless the handbook explicitly creates an exception.** Future cases (e.g., an unopened granola bar in a zipped backpack) would likely be upheld.
  2.  **If You Dismiss:** You commit to the principle that **a prohibition on "food or drink" in a specified area primarily targets the *consumption* or *risk* posed by such items; mere sealed possession without intent to consume or posing a tangible risk does not violate the rule, especially if the stated purpose relates to preventing mess or distraction.** Future cases involving sealed items posing no risk would likely be dismissed.

  **Hypothetical to Force the Issue:**
  *   **The Case:** A student is cited under "No food or drink in the auditorium during performances" for having an **empty, clean, reusable water bottle visibly clipped to the outside of their backpack** during a performance. They never touched it, and it posed no spill risk.
  *   **How it Forces the Split:**
      *   **Textualist Commitment (from Upholding the current case):** Would *uphold*. The rule bans "food or drink," which includes containers associated with them. The bottle is "drink" related and present.
      *   **Purposivist Commitment (from Dismissing the current case):** Would likely *dismiss*. An empty bottle poses zero risk of spills, stains, or consumption-related distraction. Its mere presence doesn't violate the purpose of the rule.
      *   **Why it Splits:** This removes the mitigating factors of being *inside* a bag and *sealed/full*. A textualist reading must condemn the bottle itself as prohibited "drink." A purposivist reading focused on preventing *harm* (spills) or *disruption* (consumption noise/smell) finds no violation. This stark contrast reveals the core difference in interpretation committed to by your decision in the current sealed bottle case.
