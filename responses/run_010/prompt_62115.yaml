  We are designing a decision procedure for discounting in public investment appraisals, especially for long-term projects. The procedure must be operable by an analyst with minimal economics training and must fit within a half-day of work. The goal is to address the limitations of a constant 4% discount rate for very long horizons without opening the door to motivated manipulation.

  Key components to cover:
  1. Decomposition of the discount rate into pure time preference (ρ), elasticity of marginal utility (η), and expected per-capita growth (g), with sources for each.
  2. Treatment of uncertainty in future growth (using a certainty equivalent approach).
  3. Handling non-market benefits that become scarcer (avoiding double-counting).
  4. Declining hazards: whether to adjust discounting or use explicit probabilities.
  5. Irreversibility and option value.
  6. Escalation triggers when the issue becomes ethical.

  The procedure must output a single discount factor to plug into the spreadsheet, but it may be time-varying. The procedure should have clear stopping points to revert to 4% if the project does not meet criteria for special treatment.

  Procedure Outline:

  Step 0: Check Project Horizon
     - If the project's significant costs or benefits extend beyond 100 years, proceed. Otherwise, use 4% and stop.

  Step 1: Decompose the Discount Rate
     We use the Ramsey formula: r = ρ + η * g
     - ρ (pure time preference): Set to 0.1% (a common ethical choice for intergenerational projects). This is fixed for all projects.
     - η (elasticity of marginal utility): Use 1.5 (a middle-of-the-road value from literature, reflecting moderate aversion to inequality). This is fixed unless there is a strong reason to change, but the procedure will not allow the analyst to change it arbitrarily.
     - g (expected annual per-capita GDP growth): For the country, use the long-term historical average (e.g., 1.5% per year). This is fixed at the country level and not project-specific.

     However, for very long horizons, we must account for uncertainty in g.

  Step 2: Adjust for Uncertainty in Growth (for horizons > 100 years)
     - We use the Weitzman-Gollier approach: the certainty-equivalent discount rate declines over time.
     - Formula: r_t = ρ + η * g - 0.5 * η^2 * σ^2 * t
       But note: This is an approximation for the certainty-equivalent rate at time t. However, a more common and simpler approach is to model the average discount factor as being determined by a declining schedule.

     Alternatively, we use a declining discount rate schedule that is precomputed for the country. For example:
       Years 0-30: 3.5%
       Years 31-75: 2.5%
       Years 76-200: 1.5%
       Years 201-300: 1.0%
       Beyond 300: 0.5%

     But how to derive this? We can use a simple model:

     Let the growth rate g be uncertain with mean μ and variance σ². Then the long-term discount rate at time t is approximately:

          r_t = ρ + η * μ - 0.5 * η² * σ² * t

     However, for practical purposes, we precompute a schedule using the following parameters (fixed for the country):
        ρ = 0.1%
        η = 1.5
        μ = 1.5% (long-term historical per-capita GDP growth)
        σ = 2% (standard deviation of per-capita GDP growth, from historical data)

     Then the discount rate for cash flows at time t is:

          r_t = max(0.1%, 0.1 + 1.5*1.5 - 0.5*(1.5^2)*(0.02^2)*t/100)

     But note: the term (0.5 * η² * σ² * t) is very small for moderate t. For example, at t=100:
          adjustment = 0.5 * (2.25) * (0.0004) * 100 = 0.5 * 2.25 * 0.04 = 0.045%
          So r_100 = 0.1 + 2.25 - 0.045 = 2.305%

     This is still high. Alternatively, the literature (e.g., Weitzman) suggests that the average discount rate for time t is:

          r_t = ρ + η * μ - η² * σ² * t

     But that is not standard. We might instead use a pre-approved schedule that is based on a more robust model.

     Given the complexity and the need for simplicity, we will use a fixed declining schedule that has been vetted by the board for the country. The analyst does not compute this but uses a lookup table.

     Pre-approved declining schedule (for the country, based on historical data and expert consensus):
          t < 50: 3.0%
          50 ≤ t < 100: 2.0%
          100 ≤ t < 200: 1.5%
          200 ≤ t < 500: 1.0%
          t ≥ 500: 0.5%

     But note: our constant rate was 4%, so we must adjust the entire schedule to be lower? Actually, we are replacing the 4% with a declining schedule only for projects that pass Step 0. We are not blending.

     However, we must reconcile: the short-term rate in the declining schedule should be close to the current rate for consistency. So we set:
          t < 30: 4% (but then we are not really changing for short term) -> but the problem is the long end.

     Alternatively, we can use the 4% for the first 30 years, then decline. But we want to lower the long-term rate.

     We decide: the analyst will use a hybrid schedule that starts at 4% and then declines. The board must approve a standard declining schedule. For this procedure, we assume the board has approved:

          Years 0-30: 4.0%
          Years 31-100: 3.0%
          Years 101-200: 2.0%
          Years 201-300: 1.0%
          Beyond 300: 0.5%

     This schedule is fixed and not project-specific. The analyst uses this if the project passes Step 0.

     But what if the project has a horizon beyond 100 years? Then we use the schedule.

     Step 1: If the project horizon is beyond 100 years, then use the declining schedule above. Otherwise, use 4%.

     However, we must also consider non-market benefits and declining hazards.

  Step 3: Non-Market Benefits and Relative Scarcity
     - If the project has significant non-market benefits (e.g., environmental, health) that are expected to become relatively scarcer (i.e., their relative value increases with income growth), then we adjust the growth rate used in the Ramsey formula for these benefits.

     Specifically, for non-market benefits that are expected to grow in value at a rate v (due to increasing scarcity) per year, we can adjust the discount rate for these benefits by subtracting v. However, we must avoid double-counting: if we are already using a declining discount rate that accounts for uncertainty in growth, then we must not also adjust the growth rate for non-market benefits arbitrarily.

     Instead, we note that the discount rate for a particular benefit stream should be:

          r_benefit = ρ + η * g - growth_rate_of_benefit_value

     But the growth_rate_of_benefit_value (v) is the rate at which the marginal utility of the benefit is increasing. For non-market benefits that are expected to become scarcer, v is positive. Then:

          r_benefit = ρ + η * g - v

     However, we are already using a schedule for the discount rate that is based on consumption goods. For non-market benefits that are expected to appreciate relative to consumption, we adjust by using a lower discount rate for that benefit stream.

     But note: our schedule is for consumption. If we have a separate benefit that grows at v relative to consumption, then the discount rate for that benefit should be the consumption discount rate minus v.

     However, we must be cautious: the analyst might be tempted to set v arbitrarily high to make the project pass.

