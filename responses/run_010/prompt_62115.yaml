     In practice, for the peatland project, carbon storage and flood defense might have v>0. But the board must have a pre-approved v for carbon (e.g., 0.5% per year) and for flood defense (e.g., 0.2% per year). If there is no pre-approved v, then the analyst must use the standard schedule and not adjust.

     Step 3a: Identify if the project has non-market benefits that are expected to become scarcer. If yes, and if there is a board-approved v for that benefit category, then for the cash flows of that benefit, use an adjusted discount rate:

          r_benefit(t) = r_schedule(t) - v

     But note: r_schedule(t) is already low for long horizons, and subtracting v might make it negative. We cap the discount rate at 0.1% (to avoid negative discounting).

     If there is no pre-approved v, then use r_schedule(t) without adjustment.

  Step 4: Declining Hazards
     - For projects where the hazard (e.g., risk of radioactive release) declines over time, we should model the hazard explicitly. We do not adjust the discount rate for this.

     Instead, we adjust the benefit (or cost) stream by multiplying by the survival probability (or the hazard function). For example, the probability that a radioactive release has not occurred by time t is e^(-λt), then the expected cost of a release at time t is the damage if it occurs multiplied by the probability density of the first occurrence at t (which is λ e^{-λt} for a constant hazard rate λ). But if the hazard rate declines over time, we need a function λ(t).

     Therefore, the analyst must model the expected damage as:

          Expected damage at t = damage_if_occurs_at_t * probability_density(t)

     Then discount that expected damage at the discount rate from the schedule (or adjusted for non-market benefits if applicable).

     So the discounting step remains separate from the hazard modeling.

     Step 4a: If the project involves a risk that changes over time, model the expected value of the cost or benefit by applying the explicit probability distribution. Then discount the resulting expected cash flow.

  Step 5: Irreversibility and Option Value
     - For projects that involve irreversible commitments and where there is a possibility of learning (e.g., about future costs, benefits, or risks), we should consider an adjustment for option value.

     However, this is complex and requires expert judgment. Therefore, the procedure has an escalation trigger: if the project involves a significant irreversible commitment and there is a plausible case for delay (i.e., waiting might provide valuable information), then the analyst must flag the project for board review and not attempt to compute an option value.

