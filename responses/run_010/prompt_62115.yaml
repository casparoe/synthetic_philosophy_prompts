          DF(t) = (1+r1)^(-min(t,30)) * (1+r2)^(-max(0, min(t,100)-30)) * (1+r3)^(-max(0, min(t,200)-100)) * (1+r4)^(-max(0, min(t,300)-200)) * (1+r5)^(-max(0, t-300))

     Alternatively, we can use:

          DF(t) = 1 / [ (1+r1)^(min(t,30)) * (1+r2)^(max(0, min(t,100)-30)) * ... ]

     This is multiplicative.

