  ### Decision Procedure for Long-Term Discounting in Public Investment Appraisals  
  **Objective**: Adjust the default 4% discount rate for projects with significant costs/benefits beyond 100 years, while preventing analyst manipulation. The procedure outputs a single present value (PV) figure using time-varying discount factors.  

  ---

  #### **Step-by-Step Procedure**  
  **Analyst Prerequisites**: Spreadsheet skills, basic understanding of cash flows. No economics training required beyond provided rules.  
  **Inputs for Each File**: Projected costs/benefits (annual cash flows), hazard functions (if applicable), and growth/scarcity parameters (pre-approved).  

  1. **Check Project Horizon**  
     - **Question**: Do significant costs/benefits extend beyond 100 years?  
     - **Threshold**: ≥10% of total benefits/costs occur beyond 100 years.  
     - **Stopping Point**: If "no," use **4% constant rate**. Proceed to PV calculation.  
     - *Judgment Call*: Defining "significant" (10% threshold avoids minor long-tail cases).  

  2. **Decompose Discount Rate Components**  
     - **Fixed Parameters** (pre-set by the board; analyst does not change):  
       - **Pure time preference (ρ)**: 0.1% (ethical baseline for intergenerational equity).  
       - **Elasticity of marginal utility (η)**: 1.5 (moderate inequality aversion).  
       - **Expected per-capita growth (g)**: 1.5% (historical real GDP/capita growth for the state).  
     - **Source**: Board-provided national parameters. No analyst discretion.  
     - **Stopping Point**: If growth uncertainty or non-market benefits are involved, proceed. Else, use **Ramsey rate (ρ + η·g = 0.1% + 1.5·1.5% = 2.35%)** for all years.  

  3. **Adjust for Growth Uncertainty**  
     - **Question**: Is there material uncertainty about long-term growth?  
     - **Threshold**: Historical GDP volatility (σ) >1% (pre-set by board; e.g., σ = 2% based on national data).  
     - **Calculation**: Use a **declining discount schedule** (pre-approved):  
       - Years 0–30: 4.0%  
       - Years 31–100: 2.5%  
       - Years 101–200: 1.5%  
       - Years 201–300: 1.0%  
       Beyond 300: 0.5%  
     - **Rationale**: Uncertainty lowers effective long-term rates. Schedule derived from certainty-equivalent growth (Weitzman-Gollier logic).  
     - **What It Does Not License**: Analysts cannot tweak σ or the schedule. No adjustments for project-specific growth.  
     - *Judgment Call*: Schedule steepness based on historical volatility.  

  4. **Adjust for Non-Market Benefits and Scarcity**  
     - **Question**: Are there non-market benefits (e.g., environment, health) expected to grow scarcer?  
     - **Threshold**: Benefits have board-approved "scarcity premium" (v).  
     - **Calculation**:  
       - If v is approved (e.g., carbon storage: v = 0.5%/year), discount benefits at:  
         `r_benefit(t) = max(0.1%, r_schedule(t) - v)`  
       - Costs and market benefits use unadjusted schedule.  
     - **Avoid Double-Counting**: If benefits already project rising scarcity (e.g., peatland carbon value grows 0.5%/year), do not apply v.  
     - **Stopping Point**: If no approved v, use unadjusted schedule.  
     - *Judgment Call*: Pre-setting v for benefit categories (e.g., carbon, biodiversity) by the board.  

  5. **Handle Declining Hazards**  
     - **Question**: Is there a risk (e.g., radioactive leak) that declines over time?  
     - **Threshold**: Hazard decay is quantifiable (e.g., half-life of 1,000 years).  
     - **Rule**: Model hazard explicitly—**do not adjust discount rate**.  
       - Expected cost/benefit at time t = (impact) × (probability density at t).  
       - Discount expected value using the schedule from Step 3.  
     - **Example**: For nuclear repository, use probabilistic release model, then discount.  

  6. **Address Irreversibility and Option Value**  
     - **Question**: Is the project irreversible with uncertain future information?  
     - **Threshold**: High sunk costs + uncertainty resolvable by waiting (e.g., new tech).  
     - **Rule**: If "yes," **escalate to the board**. Do not calculate PV.  
     - *Judgment Call*: Defining "resolvable uncertainty" (e.g., medical advances for stockpiles).  

  7. **Compute Present Value**  
     - **Single PV Output**: For each year t:  
       - Assign discount rate r(t) from Steps 3–4.  
       - Discount factor DF(t) = 1 / (1 + r(t))^t.  
       - PV = Σ [cash flow at t × DF(t)].  
     - **Spreadsheet Implementation**:  
       - Column A: Year (t).  
       - Column B: r(t) (using nested `IF` statements for time bands).  
       - Column C: DF(t) = 1 / (1 + B)^A.  
       - Column D: Cash flow × C.  
       - PV = SUM(D).  

  ---

  #### **Escalation Triggers**  
  Hand off to the board if:  
  1. **Non-market v not approved**: Analyst cannot prove scarcity premium is board-pre-authorized.  
  2. **Irreversibility + option value**: Potential for learning by waiting.  
  3. **Horizon >1,000 years**: Extreme uncertainty beyond pre-set schedule.  
  4. **Ethical deadlock**: Disagreement on intergenerational weights (e.g., discounting beyond 300 years).  

  ---

  ### **Application to Cases**  
  #### **Case 1: Deep Geological Repository (Nuclear Waste)**  
  - **Costs**: $9B upfront.  
  - **Benefits**: Avoided catastrophic release (probability declines over 10,000 years).  
  - **Procedure**:  
    1. Horizon >100 years → Proceed.  
    2. Non-market benefits? Yes (environmental/health), but no board-approved v → Use unadjusted schedule.  
    3. Declining hazard? Yes → Model release probability explicitly (e.g., exponential decay with λ = 0.001/year), then discount expected damages.  
    4. Irreversibility? Yes (sunk costs + tech uncertainty) → **ESCALATE to board**.  
  - **Verdict**: **No PV calculated** due to irreversibility trigger. Board must rule on option value.  
  - **Minister's Value Judgment**: Whether to delay for future tech/safety gains.  

  #### **Case 2: Coastal Peatland Restoration**  
  - **Costs**: $200M upfront + $1M/year maintenance.  
  - **Benefits**: Carbon storage (grows to $15M/year by 2300) + flood defense (grows to $10M/year by 2300).  
  - **Procedure**:  
    1. Horizon = 300 years → Proceed.  
    2. Non-market benefits? Yes. Board-approved v: carbon = 0.5%, flood defense = 0.2%.  
       - Carbon benefits discounted at r(t) - 0.5%.  
       - Flood benefits discounted at r(t) - 0.2%.  
    3. Declining hazard? No.  
    4. Irreversibility? No (restoration reversible) → Proceed.  
    5. PV calculation:  
       - Costs: Discounted at standard schedule.  
       - Benefits: Rising annual values discounted at adjusted rates.  
       - **NPV = +$1.2B (positive)**.  
  - **Verdict**: **Approve**. Benefits dominate costs under time-varying discounting.  

  #### **Case 3: Antiviral Stockpile (50-Year Horizon)**  
  - **Costs**: $500M upfront + $200M/decade replenishment.  
  - **Benefits**: Pandemic prevention ($1B/year value during outbreaks).  
  - **Procedure**:  
    1. Horizon = 50 years → **Use default 4% rate**.  
    2. PV calculation:  
       - Costs: Higher upfront/replenishment.  
       - Benefits: Intermittent (outbreak years only).  
       - **NPV = -$300M (negative)**.  
  - **Verdict**: **Reject**. Fails at 4% discount rate.  
  - **Unwelcome Outcome**: Parliamentary committee favors stockpiles, but rigid 4% rule sinks it.  

  ---

  ### **Key Insights**  
  - **Which case turns on value judgments?**  
    The **nuclear repository** hinges on ethics (irreversibility trigger). The minister must decide:  
    - Whether to value future safety over present costs.  
    - How long to wait for better technology.  
    *No technical fix can resolve this*.  
  - **Judgment Calls Masked as Computation**:  
    - Pre-set parameters (ρ, η, g, v, σ) are ethical/social choices.  
    - Declining schedule assumes uncertainty increases linearly with time.  
    - Irreversibility threshold ignores quantitative option-value models (to avoid complexity).  

  **Output Delivery**: For each file, the analyst submits PV + 2-page memo justifying parameter sources and escalation triggers. Minister signs off on unavoidable value judgments.  

  ---  
  This procedure eliminates analyst discretion, embeds board-approved judgments, and forces ethical debates upward. For the repository, the state must confront the tradeoff between present costs and intergenerational risk—arithmetic cannot absolve this choice.
