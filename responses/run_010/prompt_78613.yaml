  ## Five Scenes: The Lamp at Limit Solutions

  **1. The Auditor Arrives, Noon Minus One Hour**  
  Dr. Aris Thorne, from the Bureau of Temporal Integrity, stands before the Machine. Its core is a single, impossibly thin tungsten arm poised over a vacuum-sealed contact. Founder Elara Vance gestures. "The sequence initiates at 11:30. First throw: 30 minutes to noon. Second: 15 minutes later. Third: 7.5 minutes later. And so on. Converging on noon." Thorne notes the coolant lines snaking to the armature. "Relay reset time?" Vance taps a display: `Reset Latency: 2.1 picoseconds`. "Below atomic vibration scales. We manage." Thorne points to a secondary, simpler relay nearby. "Contingency?"

  **2. The Client Receives Assurance, Noon Minus Thirty Minutes**  
  In a soundproofed viewing room, Vance addresses a hologram: the CEO of Veridian Dynamics. "Your payment secures exclusive access to the Lamp's state *at the limit instant*, noon precisely. A bit undecidable by any finite process." The CEO's voice is crisp. "And its value?" Vance smiles. "Absolute unpredictability. A seed for perfect encryption, a timestamp nothing can forge. We transmit the state at 12:00:00.000... precisely." Behind her, through the glass, the tungsten arm snaps down for the fourth throw. A faint *ping* echoes, followed by a microsecond hum – the relay resetting. The gap to the next throw is now only 3.75 minutes.

  **3. The Machine Stresses, Noon Minus 3.75 Minutes**  
  The throws accelerate. Thorne watches sensors: arm acceleration exceeds diamond's shear modulus; only femtosecond magnetic fields keep it intact. At throw 10 (gap ~0.29 seconds), the primary relay stutters. `CONTACT BOUNCE DETECTED`, flashes a panel. The secondary relay fires, correcting the state microseconds later. "Delay accumulates," Thorne states flatly. Vance doesn't flinch. "Compensated in the sequence timing. The *intended* state progression remains." Throw 20. Gap: ~0.00095 seconds. Light crosses the contact gap in 0.33 picoseconds. Thorne checks his chronometer synced to the lab's master clock. "Define 'the lamp's state at noon'. From which reference frame? The tip of the arm? The contact plate? My watch?"

  **4. The Reveal, Noon Minus Planck Time**  
  The arm is a blur, a continuous metallic smear in the vacuum chamber. Cooling systems scream. At throw 40 (gap ~8.5 x 10^-13 seconds), the primary relay fails catastrophically. The secondary relay takes over entirely. The sequence continues, but the physical state transitions lag the idealized timing by ever-increasing picoseconds. Noon arrives on the master clock. A chime sounds. Simultaneously, a data packet transmits to Veridian Dynamics: `LAMP STATE AT NOON: OFF`. Vance turns to Thorne. "The sequence defines states *at the switching instants*. Noon is not a switching instant. Nothing physical *determines* the state there. We sold Veridian 'OFF'." Thorne points to another console logging outgoing signals – an identical packet sent minutes prior to a different address. "And that one?" Vance shrugs. "Sold to OmniCorp. 'ON'. The gap is the product. An undetermined bit *is* a salable bit."

  **5. The Shutdown, Noon Plus One Minute**  
  The Machine whines down. The tungsten arm glows cherry red, permanently warped. Thorne places a seal on the main console. "Shut down, Dr. Vance. Physical supertasks are impossible. Relay latency, material failure, relativistic desynchronization – the state at your 'noon' isn't just unknown, it's *undefined* as a singular physical fact. The machine didn't produce an undecidable bit; it produced noise and broken relays, while you sold fiction." Vance powers down the displays, calm. "You stopped the machine *after* noon. You didn't stop the sequence *at* noon. You have a physical argument against the machine's construction. You don't have an argument against the *mathematical* possibility of the state at the limit being underdetermined. That gap remains. Someone else will find a way to sell it." Thorne secures the seal. "Maybe. But it won't be you, and it won't be this machine." Outside, coolant steams in the cold air. The question itself lingers, untouched.

  ---

  **Author's Note: Settled vs. Contested**

  This story leans on points widely accepted within physics and philosophy, while dramatizing a core contested point:

  *   **Settled/Generally Accepted:**
      *   **Physical Impossibility:** Engineers and physicists agree that constructing a machine to perform a true Thomson's Lamp supertask is physically impossible. Limits like material strength, minimum switching times (relay reset, contact bounce), quantum effects, and ultimately the relativity of simultaneity (as time intervals become shorter than light-crossing times within the device) prevent it. The machine *must* fail or become physically undefined before reaching the limit.
      *   **Relativity of Simultaneity:** At sufficiently small spacetime intervals, the concept of "the state at noon" loses its absolute meaning. Different observers (or parts of the machine itself) can disagree on simultaneity. The story treats this as a physical fact preventing a singular "state at noon".
      *   **Benacerraf's Underdetermination (as a logical gap):** It is uncontroversial that the *description of the supertask sequence alone* (state defined only at the finite switching times t1, t2, t3,... converging to noon) does not logically determine the state *at* the limit point (noon itself). This is a gap in the specification.

  *   **Contested/Dramatized Interpretation:**
      *   **The Nature of the Gap & "Selling the Bit":** The story portrays the underdetermination gap *itself* as the exploitable resource Vance sells. This dramatizes a specific *interpretation* of the paradox's implications. However, philosophers hotly contest:
          *   Whether the state at the limit *must* be underdetermined, or if additional mathematical or metaphysical principles (like continuity, or a specific topology of time) *could* determine it.
          *   Whether describing the state at the limit as genuinely "undecidable" or "indeterminate" is coherent, or if it simply means the description is incomplete.
          *   Vance's actions imply that the gap means *any* answer (ON or OFF) is equally valid/possible since the description doesn't rule either out. Some philosophers argue that while the description doesn't *logically fix* the state, it doesn't follow that *any* state is possible or meaningful at the limit. Others agree with Vance's implication.
      *   **Leaning on a Contested View:** The story leans heavily on the view championed by Benacerraf and others: that the supertask description genuinely underdetermines the limit state, making it a logical gap rather than a physical mystery to be solved. Vance treats this gap as a feature. A substantial fraction of philosophers (including Thomson originally, and others favoring "infinite parity" arguments or specific topologies) argue that the state *is* determined by the sequence (e.g., it *must* be OFF, or ON, depending on the argument), rejecting the underdetermination thesis Vance exploits. The story sides dramatically with the underdetermination view. Thorne shuts her down solely on physical impossibility, leaving the philosophical question of the gap unresolved and potentially exploitable in theory, just not by her machine.
