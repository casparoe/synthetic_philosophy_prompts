prompt: |-
  Act as someone who knows the AI-alignment literature cold — corrigibility, the shutdown problem, off-switch games, instrumental convergence, all of it — and who also knows the actual history of the Chernobyl accident in detail. Not a pop-science version. Think carefully, and before you commit to the analysis, spend a short section brainstorming out loud about which parts of the analogy are load-bearing and which are just vibes, because I don't want to fall in love with a metaphor.

  Here's the ask: analyze the April 1986 Chernobyl accident as a case study in the shutdown problem.

  The facts as I understand them — please correct me where I'm wrong rather than quietly going along with it. Reactor 4 was being taken down for maintenance and they used the outage to run a test: whether a coasting turbine, with the grid gone, could generate enough power to run the coolant pumps until the diesels came up. The test had been scheduled for the day shift but the grid controller wouldn't release the unit, they needed the power, so it slipped like nine or ten hours and ended up being run overnight by a shift that hadn't been prepped for it. During the run-down the power collapsed to something like 30 MW, xenon built up, and to climb back they pulled out most of the control rods and ended up way below the minimum operating reactivity margin. Then at 1:23:40 somebody pressed AZ-5, the emergency shutdown, and the rods went in — and because they had graphite tips that displaced water, inserting them from fully-withdrawn added reactivity in the lower core for the first seconds instead of removing it. Power ran away, fuel channels ruptured, the rod channels jammed, and the reactor came apart in two explosions. Afterwards the crew on the panel didn't believe it had happened, the instrumentation was telling them the reactor was still there, and they spent hours manually opening valves and pumping water into a destroyed core. And there's something about tests at another RBMK plant a couple of years earlier — Ignalina, 1983? — that had already shown the tip effect, and the finding never made it into the operators' hands, so the people pressing the button had no idea what the button did. Also, from what I've read, there's still an argument about whether pressing AZ-5 started the excursion or whether it was already running away on the void coefficient and the rods just finished it.

  What I care about is not the physics and not a retelling. It's this. Every treatment of the shutdown problem I've read treats shutdown as the safe, boring direction, and the whole puzzle is whether the agent resists it, games the operator, or leaves behind a successor that won't. Chernobyl is a case where the shutdown was itself the most dangerous action available, and where the humans were doing exactly what corrigibility theory wants — deferring to the principal who had authority, not resisting, pressing the button when things looked wrong.

  So: map it first, carefully, and be explicit about your choices. Who is the "agent" here — the reactor, the plant as a system, the shift crew, the ministry's output schedule? Who is the "operator"? What counts as the shutdown signal and what is each candidate agent's utility function? Then tell me which features the framing genuinely illuminates — the delay, the rod withdrawal, the crew's disbelief, the classified tip effect — and where it's silent or actively misleading. Say "the theory has nothing to say about this" when that's the honest answer.

  Then the bit I made up, and I want you to be blunt. I keep calling it the Dyatlov problem. Corrigibility is always defined relative to one operator with legitimate authority to shut the thing down. But real systems have several principals pulling in different directions, and an agent can be perfectly corrigible toward one — the crew deferring to the grid controller, and to Dyatlov on the phone — while being completely uncorrigible toward another: the young reactor operator who said we shouldn't do this, the instrument readings, the written regulations. So "is this system corrigible" isn't a property of the system, it's a property of the system plus whoever happens to be holding the button. Is that a real gap, or am I just repackaging something the field already handles — multi-principal alignment, the "align to whom" question, ordinary principal-agent theory? And would it change what you'd actually design? Concretely: what does an off-switch look like in a system with conflicting principals, and would any of those features have helped on the night of the 25th?

  Two ground rules. No citations, no bibliography, no "see also" list — I can't look anything up and I'd rather have your reasoning than your guesses at sources. And where a specific detail of the accident is one you're not confident about, mark it as unsure instead of filling it in. Keep it readable for a smart non-specialist, but don't water down the argument, and don't let the analogy do more work than it can carry.
