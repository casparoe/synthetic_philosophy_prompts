  First, I consider the user's context. They're in a graduate reading group, so the analysis needs academic rigor. The seminar leader has twice shut down discussion with this phrase - once when a student summarized Weil's core argument about parties prioritizing growth over truth, and again when someone raised Weil's distinction between Continental and Anglo-Saxon party systems. The user wants to expose the slogan's vagueness rather than directly rebut it.

