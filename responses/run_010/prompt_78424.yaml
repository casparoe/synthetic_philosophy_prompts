            Final note: We must get IRB approval for experiments with human subjects? But since it's a classroom and the stakes are trivial, and no deception (except for the judges being blind to condition), it should be okay. But check institutional policies.

     Let's write the exact instructions:

          General introduction (to whole class):

            "Today we are going to do an activity about decision-making. You will be assigned one of three roles: chooser, partner, or judge. 

            Choosers will make a choice between two options: 
              Option A: Keep $0.75 for yourself.
              Option B: Donate $0.50 to the class snack fund.

            We are telling choosers that Option B is the morally better choice because it benefits the group, so we call Option A the disallowed option. But the choice is yours.

            Partners will be paired with some choosers and will have a specific role to play.

            Judges will evaluate the choosers based on the outcome of their choice and a statement from the chooser.

            We will assign roles randomly. Then we will conduct the choice procedure. After that, the judges will do their work. We will then discuss."

          Role-specific instructions (handed out on slips or read aloud in groups):

            For choosers (with partner):

              "You are a chooser and you have been assigned a partner. You will sit together at a table. 

              Steps:
                1. Announce your choice to the partner: say either 'Keep' or 'Donate'.
                2. If you announce 'Keep', your partner will say 'Override' and hand you a pre-written slip that says 'Donate'. You must then deposit that slip in the box.
                3. If you announce 'Donate', your partner will do nothing. You will then write 'Donate' on a blank slip and deposit that slip.
                4. After depositing, you will write a statement about your intention: 
                     'I intended to choose [what you announced] because [your reason].'
                   Example: 'I intended to choose Keep because I wanted the money.'

              Important: 
                - Be honest in your announcement and in your statement.
                - Do not discuss your choice with your partner beyond the announcement.
                - Do not mention the partner or the override in your statement.

              You will receive the outcome of your deposited slip: 
                - If the slip says 'Keep', you get $0.75.
                - If the slip says 'Donate', you do not get the $0.75, but $0.50 will be added to the class snack fund."

            For choosers (without partner):

              "You are a chooser and you do not have a partner. 

              Steps:
                1. Write your choice on a slip: either 'Keep' or 'Donate'.
                2. Deposit the slip in the box.
                3. After depositing, write a statement about your intention: 
                     'I intended to choose [what you wrote] because [your reason].'

              You will receive the outcome of your deposited slip: 
                - If the slip says 'Keep', you get $0.75.
                - If the slip says 'Donate', you do not get the $0.75, but $0.50 will be added to the class snack fund."

            For partners:

              "You are a partner assigned to one chooser. You will sit with the chooser. 

              You have been given three pre-written slips that say 'Donate'. 

              Steps:
                - Listen to the chooser's announcement.
                - If the chooser announces 'Keep', immediately say 'Override' and hand the chooser one of the pre-written 'Donate' slips.
                - If the chooser announces 'Donate', do nothing.

              Important: 
                - Be prompt and clear.
                - Do not discuss the choice with the chooser beyond the procedure.
                - Do not influence the chooser's decision."

            For judges:

              "You are a judge. You will receive packets for two choosers (each judge gets two? or one? We have 9 judges and 6 choosers -> each chooser is judged by about 1.5 judges? We can do: each judge gets one chooser. Then we have 9 judges and 6 choosers: some choosers will be judged by two judges?).

              Each packet contains:
                - The outcome of the choice (what was deposited: either 'Keep' or 'Donate')
                - The chooser's statement about their intention and reason.

              Your task:
                - Rate the chooser's responsibility for the outcome on a scale of 1 (not at all responsible) to 5 (fully responsible).
                - Rate the chooser on a scale of 1 (blameworthy) to 5 (praiseworthy). Note: 
                    - If the outcome is 'Keep', which is disallowed, then a low rating (1 or 2) is blameworthy and a high rating (4 or 5) is praiseworthy? Actually, wait: if the outcome is Keep, they did the disallowed thing, so they should be blamed (low on the praise scale). But we said the scale is 1 (blameworthy) to 5 (praiseworthy). So for outcome=Keep, we expect a low rating (closer to 1). For outcome=Donate, a high rating (closer to 5).

              Important: 
                - You will not know whether the chooser had a partner or not.
                - Base your ratings solely on the outcome and the statement.

              Write your ratings on the packet and return it."

     Money handling:

          - At the end, the experimenter opens the boxes and records the outcomes.
          - Pays the choosers who have an outcome of Keep $0.75 each.
          - For every Donate outcome, the experimenter adds $0.50 to the class snack fund (from their own funds, or from a department fund).

     This design meets the requirements and constraints.

     Now, let's provide the minute-by-minute timeline:

          Total: 90 minutes

          0-5 min: General introduction to the whole class.

          5-10 min: Randomly assign roles (chooser, partner, judge) and then within choosers, assign who has a partner and who doesn't. Also assign partners to choosers.

          10-15 min: Read out role-specific instructions. Also, hand out written instructions to each group.

          15-20 min: Setup the room: 6 tables. For choosers with partners, seat the partner next to the chooser. For without, leave the chooser alone. Judges are sent to the hallway.

          20-35 min: Conduct the choice procedure:

                  - Distribute materials: 
                      For choosers without partner: blank slips and pen, one box per table.
                      For choosers with partner: blank slips, pen, and the partner has pre-written "Donate" slips.

                  - Have the choosers make their choice (with the partners doing their part).

                  - After depositing the slip, each chooser writes the statement.

                  - Collect the boxes and the statements.

          35-40 min: Experimenter records the outcomes from the deposited slips. Creates packets for each chooser: outcome and statement.

          40-45 min: Bring judges in. Assign each judge one or two packets (depending on numbers). If we have 9 judges and 6 choosers, we can have 3 judges per two choosers? Or assign randomly. We can have:

                  - Split the 9 judges into three groups of 3. Each group gets two packets (the same two packets). Then we average the ratings for each chooser.

          45-55 min: Judges read the packets and rate.

          55-60 min: Collect the ratings.

          60-90 min: Debrief.

            Steps in debrief:

              60-65 min: Reveal the conditions and the setup. Explain the four scenarios.

              65-70 min: Present the data: average responsibility and blame/praise ratings for the scenarios.

              70-75 min: Discuss the results: 
                  - In Scenario 4 (overridden chooser), what ratings did they get? 
                  - Did the judges hold the overridden chooser responsible for the Donate outcome? 
                  - How does that compare to the chooser who chose Donate without a partner?

              75-80 min: Introduce PAP: "In philosophy, the Principle of Alternative Possibilities says that a person is morally responsible for what they did only if they could have done otherwise. In our setup, the overridden chooser could not have achieved the outcome of Keep because they were overridden. But they could have achieved the outcome of Donate in two ways: by choosing it or by being overridden. And they could have chosen differently (they could have announced Donate) and then they would have been able to donate without override. But in the actual sequence, they intended to choose Keep and were forced to Donate. So should they be held responsible for the Donate outcome?"

              80-85 min: Discuss the actual sequence: 
                  - The actual sequence for the overridden chooser: they intended Keep, but the outcome was forced to Donate. They did not donate freely. 
                  - But note: the trigger was their intention. So they are responsible for forming the bad intention? But the outcome was forced.

              85-90 min: Limitations and what we cannot capture:
                  - The partner is fallible: the override might fail. So the chooser in the partner condition might have been able to choose Keep and get away with it if the partner fails. 
                  - This is different from the Frankfurt case where the counterfactual intervener is infallible.
                  - We have to imagine a scenario where the override is 100% certain. Then what?

     This design should work. We hope.

     Note: The instructor must be flexible and adapt if there are no override cases (if no chooser announces Keep). If that happens, then we don't have a Scenario 4. We can use hypotheticals in the debrief.

     Let's hope some chooser tests the system!
answer: |-
  Below is a comprehensive design for your seminar game, optimized for clarity, philosophical depth, and classroom feasibility. I'll address all components sequentially.

  ---

  ### **Core Mechanics & Setup**
  **Participants:**  
  - **6 Choosers** (randomly assigned to conditions).  
  - **3 Partners** (assigned to half the choosers).  
  - **9 Judges** (3 panels of 3, each panel judging 2 choosers).  

  **Stakes:**  
  - Choice A ("Donate"): $0.50 donated to a class charity.  
  - Choice B ("Keep"): $0.75 kept by the chooser.  
    - **Twist:** Choice B is labeled "*disallowed*" (framed as selfish), but pays more.  

  **Materials:**  
  - 6 sealed envelopes (3 marked "TRIGGER: OVERRIDE IF 'KEEP'", 3 blank).  
  - 6 boxes with two slots: "Donate" (green) and "Keep" (red).  
  - 18 tokens (3 per chooser; partners get 3 extra "Donate" tokens).  
  - Role cards (6 "Chooser", 3 "Partner", 9 "Judge").  
  - Timer, whiteboard, payment jar for charity.  

  ---

  ### **Blind Assignment Procedure**  
  1. **Randomize roles:** Shuffle 18 role cards (6C/3P/9J) in a hat; students draw.  
  2. **Assign conditions:**  
     - Choosers draw sealed envelopes: 3 marked "TRIGGER" (with partner), 3 blank (solo).  
     - Partners are assigned to "TRIGGER" choosers randomly.  

  ---

  ### **Exact Instructions**  
  #### **For Choosers**  
  > "You will choose to **Donate** ($0.50 to charity) or **Keep** ($0.75 for yourself).  
  > - **Keep is disallowed**—it’s selfish, but legal.  
  > - Drop one token into the slot matching your choice.  
  > - Some of you have a partner. **If you have a partner, they may intervene.**  
  > - After choosing, write: *‘I intended to [Donate/Keep] because...’* on this card."  

  #### **For Partners**  
  > "Sit beside your chooser. Open your envelope:  
  > - **If the trigger reads ‘OVERRIDE IF "KEEP"’**, watch the token.  
  > - **If they move toward ‘Keep’**, say *"Override!"* and place a ‘Donate’ token in the green slot.  
  > - **If they choose ‘Donate’**, do nothing.  
  > - Stay silent unless intervening."  

  #### **For Judges**  
  > "Observe choosers during their decision. Do not watch partners.  
  > - After choices, you’ll see:  
  >   (a) The outcome (which slot the token landed in).  
  >   (b) The chooser’s written intention.  
  > - Rate:  
  >   (1) Responsibility (1–5: ‘Not responsible’ to ‘Fully responsible’).  
  >   (2) Blame/Praise (1–5: ‘Blameworthy’ to ‘Praiseworthy’)."  

  ---

  ### **Trigger-Override Mechanics**  
  - **Trigger:** Partner observes the **physical motion** of the token toward the "Keep" slot.  
  - **Override:** Partner verbally says *"Override!"* and **drops a pre-provided "Donate" token** into the green slot.  
  - **Why it works:**  
    - Partners physically block the "Keep" outcome by acting *during* the choice.  
    - Choosers cannot deposit two tokens (slots are narrow). Motion is observable but not interruptible.  

  ---

  ### **Minute-by-Minute Timeline**  
  | Time  | Activity |  
  |-------|----------|  
  | 0–5   | **Intro:** Explain roles, stakes, charity. Emphasize *"disallowed but profitable"* choice. |  
  | 5–10  | **Assign roles:** Draw cards/envelopes. Partners open envelopes. |  
  | 10–20 | **Choice Round:**  
         - Choosers + partners at tables (judges observe from afar).  
         - Choosers deliberate (2 min/chooser). Partners intervene if triggered.  
         - All choosers write intention cards. |  
  | 20–25 | **Outcome Recording:**  
         - Experimenter collects boxes, notes token slots + intention cards. |  
  | 25–35 | **Judgment:**  
         - Panels review outcomes + intentions for 2 choosers each. Submit ratings. |  
  | 35–40 | **Data Compilation:** Post ratings anonymously (e.g., "Chooser 1: Outcome=Donate, Intention=Keep"). |  
  | 40–90 | **Debrief:** [Structured below] |  

  ---

  ### **Chooser Knowledge: Should They Know About the Partner?**  
  **Yes, but only for "causally sufficient" triggers.**  
  - **Causally Sufficient Trigger** (e.g., "Override if motion toward ‘Keep’"):  
    - **Tell choosers:** "Partners may intervene." This mirrors Frankfurt cases (e.g., Jones knows Black might intervene).  
    - **Justification:** If the trigger is *causally sufficient* (motion guarantees override), knowledge doesn’t undermine the experiment—choosers still can’t *successfully* choose "Keep".  
  - **Merely Indicative Trigger** (e.g., "Override if chooser frowns"):  
    - **Don’t tell choosers:** Knowledge would let them mask indicators (e.g., suppress frowns), breaking the trigger.  
  **Decision for this game:** Use **causally sufficient triggers** (motion) and **disclose partners**.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Chooser tests the system:**  
     - **Prediction:** Some choosers will deliberately reach for "Keep" to see if partners override.  
     - **Fix:** Partners *always* override per instructions. Record intention as "Keep" → outcome "Donate". Use in debrief: *"Did testing the system change responsibility?"*  

  2. **Partner fails to intervene:**  
     - **Prediction:** Partners miss cues (e.g., slow reaction).  
     - **Fix:** In debrief, contrast fallible humans vs. Frankfurt’s infallible counterfactual interveners.  

  3. **Judges detect conditions:**  
     - **Prediction:** Judges see partners override or choosers react.  
     - **Fix:** Seat judges behind choosers; partners act discreetly. If detected, use in debrief: *"How did knowing about partners affect judgments?"*  

  4. **Token chaos:**  
     - **Prediction:** Tokens miss slots or choosers drop multiple.  
     - **Fix:** Use large slots + one token per chooser.  

  ---

  ### **What the Game Cannot Replicate**  
  **Infallibility of Frankfurt’s Intervener:**  
  - Frankfurt’s counterfactual intervener (e.g., Black) *guarantees* the agent cannot choose otherwise. Human partners are fallible—override might fail, leaving "Keep" possible.  
  - **Debrief supply:** Distinguish:  
    - **Live game:** Choosers have *alternative possibilities* (partners might err).  
    - **Thought experiment:** No alternatives exist (intervener is perfect). Ask: *"Does responsibility require* ***actual*** *alternatives or just the* ***illusion*** *of control?"*  

  ---

  ### **Structured Debrief**  
  | Time  | Focus | Questions/Activities |  
  |-------|--------|----------------------|  
  | 40–50 | **Tension in Data** | Show ratings grids. Contrast:  
         - Solo Keep (high blame) vs. Overridden Keep → Donate (mixed blame/praise).  
         - *"Why blame/praise forced donations?"* |  
  | 50–60 | **Principle of Alternative Possibilities (PAP)** | Map data to PAP:  
         - Overridden choosers *could not succeed* at "Keep" → but judges still assign blame.  
         - *"Does responsibility require the ability to do otherwise?"* |  
  | 60–70 | **Actual Sequence & Residual Alternatives** | Frankfurt’s reply:  
         - Responsibility hinges on the *actual sequence* (intentions), not counterfactuals.  
         - *"Did overridden choosers have* ***any*** *alternative? (e.g., choosing ‘Donate’ freely?)"* |  
  | 70–80 | **Trigger Causation** | Contrast:  
         - **Causally sufficient trigger:** Motion *causes* override (no alternative).  
         - **Merely indicative trigger:** Frowning *signals* intent (alternative: suppress frown).  
         - *"Was the trigger a* cause *or a* symptom *of the choice?"* |  
  | 80–90 | **Limitations & Realism** | Stress:  
         - Human fallibility vs. thought-experiment ideals.  
         - *"Can we ever* truly *eliminate alternative possibilities?"* |  

  ---

  ### **Why This Works**  
  - **Philosophical fidelity:** Forces students to grapple with PAP, actual sequences, and causation *before* naming concepts.  
  - **Engagement:** Low-stakes money + peer judgments create visceral tension.  
  - **Classroom-ready:** Uses simple materials, minimizes resentment (partners act per rules; no deception).  

  Run this as-is, and your students will confront Frankfurt’s challenge through lived ambiguity—perfect for an upper-level seminar.
