prompt: |-
  I write a weekly column on science and ideas, and I am currently reporting a piece about consent in large, long-running health databanks. One of the researchers I interviewed — a bioethicist with a legal training — offered an analogy he clearly leans on a great deal, and I should like it audited before I put it in print.

  His claim is that research consent is fundamentally a contract, and that critics who ask for more are demanding something the concept cannot deliver. On his telling there is an offer (a participant information sheet setting out the terms), an acceptance (a signature, or a click), a price (the participant's samples and data, against whatever benefits the study promises), a presumption of capacity in adults, and duties of disclosure rather than duties to secure comprehension. What binds, he insists, is the transaction and not the state of mind behind it — much as English law has long held that a signature binds whether or not the signatory read the document. From this he draws two conclusions: that a plain-language summary followed by a single click is valid consent, provided nothing was concealed or misrepresented; and that consent, once given, fixes entitlements at a moment, so a participant's later change of heart cannot unravel uses already made in good faith. When critics object that people did not really grasp what they were agreeing to, he says they are smuggling in a romantic picture of consent as inner endorsement, which contract law sensibly abandoned.

  The setting that makes this hard to swallow is the one my piece is actually about: samples held for thirty years, onward sharing with researchers and companies who were not identifiable at the outset, recontact impractical, and a right of withdrawal that exists in the governance documents but is hollow once the data have been pooled, analysed and published. A patients' advocate I spoke to offered a rival analogy in reply — consent is like lending a house key: you specify who may enter and for how long, you can ask for it back, and handing a copy to a stranger's friend is not covered by the original loan, however plainly that loan was worded. She uses it to argue that unspecified onward transfer is a distinct act requiring fresh permission, and that a right of withdrawal which cannot be exercised is no right at all.

  Could you assess both analogies? Specifically: a correspondence table for each (for the contract, what plays the part of offer, acceptance, consideration, capacity, disclosure, the thing transferred, breach and rescission; for the key, the key, the borrower, the door, the term, the copy); the disanalogies, separated into those that genuinely bear on the click-through conclusion and those that are merely decorative; what each source domain quietly imports that this kind of consent lacks — negotiability, symmetry of stakes, the ability to walk away, damages as a remedy, the discreteness of the moment of signature, the separability of the thing lent; and whether either conclusion survives once that is all on the table. If both analogies fail at the load-bearing points, tell me what source domain would carry the work better, what it would license, and what it would forbid.

  I do not want references or a reading list, only the analysis. Please write in British English, open with your verdict in two sentences, and keep the whole thing to 650 words, tables included.
reasoning: |-
  Hmm, this is a fascinating and complex query about consent in health databanks. The user is a science columnist who needs help auditing two competing analogies used by experts: one framing consent as a legal contract, the other as lending a house key. Both positions have high stakes - the bioethicist's view enables large-scale research while the patient advocate's protects autonomy in perpetuity.

  The core tension lies in applying transactional frameworks to non-transactional realities. The contract analogy collapses when we consider that health data isn't "transferred" like goods but copied and proliferated, or that participants can't truly withdraw once data is pooled. The key analogy fails because research isn't about temporary access but permanent transformation of data into public knowledge. Neither captures how consent operates across decades where both the data and societal norms evolve.

  What strikes me most is how both analogies ignore the temporal dimension. Contracts and key loans presume fixed terms, but biobanking involves open-ended futures where today's "plain language" may become tomorrow's obscurity. The irreversible nature of data dissemination makes withdrawal rights theoretical - you can't un-publish findings. 

  For a better framework, I'm considering stewardship models like museum curation or intergenerational trusts. These acknowledge permanence while requiring ongoing governance. A museum accession register, for instance, records origin but allows ethical reinterpretation as standards evolve. This would support the advocate's demand for reconsent on major changes while accepting the researcher's point about historical uses.

  The user's request for British English and strict word limit means trimming all academic flourishes. I'll open by declaring both analogies deficient before dissecting each. Tables must be ultra-compact - mapping "consideration" to "benefits promised" shows the contract's thin reciprocity. Highlighting irreparable breach (data leaks) versus reparable (key copying) exposes why damages fail as remedy. 

  Ultimately, neither analogy's conclusion survives scrutiny. The click-through justification ignores comprehension voids in complex science; the key metaphor's veto power would cripple longitudinal research. The stewardship alternative permits ethical adaptation without perpetual vetoes - it could require reconsent for commercialisation but not for secondary academic use. 

  This analysis should arm the user to show both experts overreach, while suggesting consent must evolve as living governance rather than frozen permission.
answer: |-
  ### Verdict
  Both analogies fail under scrutiny where they bear weight on the core dispute. The contract framework overlooks consent's non-negotiable, non-commodifiable nature and irreparable harms; the key loan ignores research's transformative, irreversible data uses and communal benefits. Neither justifies their conclusions when structural disanalogies are exposed.

  ### Analysis

  **Contract Analogy Correspondence**
  | Contract Element | Consent Mapping              | Notes                                                                 |
  |------------------|------------------------------|-----------------------------------------------------------------------|
  | Offer            | Participant Information Sheet| Assumes static terms; real research evolves unpredictably.           |
  | Acceptance       | Signature/click              | Mistakes formality for meaningful agreement.                         |
  | Consideration    | Data/samples for benefits    | Benefits are vague/non-guaranteed; data isn't fungible "payment".    |
  | Capacity         | Presumed adult competence    | Ignores comprehension gaps in complex science.                       |
  | Disclosure Duty  | Plain language summary       | ≠ comprehension duty; complex futures can't be fully "disclosed".    |
  | Thing Transferred| Data/samples                 | Data is copied/shared, not transferred; originator retains interests.|
  | Breach           | Misrepresentation/concealment| No remedy for harms from *accurate* but misunderstood terms.         |
  | Rescission       | Withdrawal pre-use           | Impractical after anonymisation/pooling; no undo for published work. |

  **Key Loan Analogy Correspondence**
  | Key Element      | Consent Mapping              | Notes                                                                 |
  |------------------|------------------------------|-----------------------------------------------------------------------|
  | Key              | Data access permission       | Data isn't a physical key but copied/analysed/transformed.           |
  | Borrower         | Initial researcher           | Research involves many parties over decades; access isn't exclusive. |
  | Door             | Dataset                      | Data is dynamic, aggregated, restructured – not a fixed "space".     |
  | Term             | Specified duration/use       | Biobanks inherently enable indefinite, unforeseen uses.              |
  | Copy             | Onward sharing               | Copies are inevitable in digital research; original control is lost. |

  **Load-Bearing Disanalogies**
  | Analogy         | Problematic Disanalogy                     | Undermines Conclusion? | Why Critical                                                                 |
  |-----------------|--------------------------------------------|------------------------|------------------------------------------------------------------------------|
  | **Contract**    | Non-negotiable terms                       | Yes                    | Participants cannot alter terms (unlike contracts), making "agreement" passive. |
  |                 | Asymmetry of stakes                        | Yes                    | Participants risk privacy/harm; researchers/institutions gain career/commercial value. |
  |                 | No meaningful remedy for breach/damage     | Yes                    | Privacy harms/discrimination are irreparable; contract damages are inadequate. |
  |                 | Consideration is illusory/unequal          | Yes                    | Benefits are societal/vague, not quid-pro-quo.                               |
  | *Decorative*    | Signature formality                        | No                     | Valid formal parallel, but doesn't resolve substantive fairness.             |
  | **Key Loan**    | Ability to physically reclaim the key      | Yes                    | Data cannot be "returned" once disseminated/used in publications.          |
  |                 | Separability of the asset (key ≠ house)    | Yes                    | Data is intrinsic to person; inseparable from identity/dignity interests.    |
  |                 | Discrete, time-bound access                | Yes                    | Research uses are cumulative, permanent, and interdependent.                |
  | *Decorative*    | Specifying permitted users initially       | No                     | Parallels initial scope-setting, but ignores necessary future flexibility. |

  **Smuggled Assumptions & Conclusion Fate**
  - **Contract imports:** Equal bargaining power, replaceable goods, damages as sufficient remedy, fixed moment of obligation. **Conclusion fails:** Click-wrap ignores comprehension voids and power imbalance; indefinite use ignores the moral transformation of data context over time.
  - **Key imports:** Physical control, temporally bounded use, reversibility, clear ownership. **Conclusion fails:** Demanding reconsent for every new user/use ignores research's collaborative, cumulative nature; insisting on exercisable withdrawal ignores that data *must* persist for science.

  **Superior Analogy: Stewardship of Cultural Heritage**
  - **Source Domain:** Donating an artefact to a museum with a *living* accession agreement.
  - **Mappings:** 
    - Artefact = Data/samples. 
    - Donor = Participant. 
    - Museum = Biobank. 
    - Accession Agreement = Consent process. 
    - Curators = Researchers/Governance Board. 
    - Public Access/Research = Secondary uses.
  - **Licenses:** 
    - Initial broad consent for preservation/research within ethical bounds. 
    - Ongoing stewardship duties (transparency, recontact for *major* new purposes like commercialisation). 
    - No participant veto over past uses, but withdrawal halts *future* uses where feasible.
  - **Forbids:** 
    - Treating consent as a one-off transaction. 
    - Assuming indefinite control by donor *or* institution. 
    - Unilateral repurposing violating original ethical framing (e.g., military research).
  - **Strengths:** Acknowledges permanence, communal value, evolving norms, and governance duties – without false promises of control or reversibility.
