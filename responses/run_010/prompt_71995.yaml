answer: |-
  Here are the requested materials for your in-class test, designed to rigorously engage students with the causal mechanics of Weber's argument.

  ---

  ### 1. Stimulus Material (Printed on Exam Paper)
  **Weber's Causal Reconstruction: Key Steps**  
  1. Calvinist doctrine holds that salvation is predetermined by God and unknowable to humans.  
  2. This creates intense psychological anxiety among believers about their eternal fate.  
  3. Believers seek indirect signs ("proof") of their elect status through worldly activity.  
  4. Ascetic worldly conduct—disciplined, rational work in a vocational "calling"—is interpreted as a duty that might indicate election.  
  5. This conduct systematically channels effort into productive labor while severely restricting consumption.  
  6. Accumulated capital, reinvested rather than spent, facilitates the development of modern rational capitalism.  

  ---

  ### 2. Exam Question (120 words)  
  **Compulsory Question (25 marks; write c. 1,200 words):**  
  Weber’s causal chain relies on Calvinist doctrine performing load-bearing work. Using the four roles below, analyse *how* the doctrine functions in his account:  
  - **Propellant**: Directly motivates actions aiming at the outcome (e.g., accumulation).  
  - **Index**: Drives actions seeking evidence (e.g., of salvation), making the outcome a by-product.  
  - **Selector**: Filters/reinforces pre-existing dispositions in a population.  
  - **Legitimator**: Removes barriers or justifies actions already possible.  
  Argue: (a) Which role(s) the doctrine *must* occupy for Weber’s account to hold; (b) Which role(s) it *cannot plausibly* occupy; (c) For each plausible role, specify what evidence could support it and what observation would undermine it. Finally, address Weber’s claim that he avoids "one-sided spiritualism." Is this a limitation or a retreat?  

  ---

  ### 3. Model Answer (c. 1,000 words)  
  **Causal Roles of Calvinist Doctrine in Weber’s Thesis**  
  Weber’s argument hinges on Calvinist doctrine not merely preceding capitalist development but actively enabling it. To avoid reducing his thesis to a sequence of events, we must dissect the *causal role* of the doctrine using the four categories.  

  **(a) Essential Role: Index**  
  The doctrine *must* function as an **index** for Weber’s core mechanism to work. Calvinists did not desire capital accumulation intrinsically; they sought signs of salvation. Ascetic labor and restraint were performed *as evidence-gathering* for election. Success became an indexical by-product, not a goal. Without this, the psychological engine (anxiety → methodical action) collapses. Evidence supporting this would be historical records showing believers interpreting prosperity as divine favour. Conversely, if diaries showed Calvinists pursuing wealth *for consumption or status*, this role would be undermined.  

  **(b) Implausible Role: Propellant**  
  The doctrine **cannot plausibly be a propellant**. A propellant requires agents to desire the outcome (accumulation) as an end. Weber explicitly denies this: accumulation resulted from *restraint*, not acquisitive desire. If Calvinists aimed directly at capital growth, their conduct would resemble later utilitarian capitalists, not the religiously driven ascetics Weber describes. Evidence against propellant: theological writings condemning greed or luxury.  

  **(c) Secondary Roles: Selector and Legitimator**  
  The doctrine *could* act as a **selector**. Pre-existing tendencies (e.g., diligence) might be amplified among Calvinists because asceticism aligned with salvation anxiety. Evidence: comparative data showing similar traits in non-Calvinist groups failing to produce systematic accumulation. Counter-evidence: if non-anxious groups (e.g., Lutherans) with the same traits achieved comparable economic outcomes.  
  As a **legitimator**, the doctrine might lift prohibitions on profit-seeking by framing it as godly. However, Weber’s emphasis on anxiety-driven *conduct* (not just permission) makes this less central. Evidence: sermons framing thrift as holy. Counter-evidence: if Catholic merchants, lacking this legitimation, accumulated similarly.  

  **Circularity and the Index Role**  
  The index role creates a vulnerability: salvation anxiety is inferred from the very conduct (asceticism) it explains. Weber avoids tautology by treating anxiety as a historically specific *psychological catalyst*, not a universal response. The chain holds if anxiety precedes conduct empirically—e.g., if anxiety is documented *before* ascetic capitalism emerges.  

  **"Not One-Sided Spiritualism": Limitation or Retreat?**  
  Weber’s disclaimer—that he rejects spiritual *monocausality*—is a **limitation of scope**, not a retreat. He insists material factors (e.g., technology, law) are necessary *preconditions*, but his thesis addresses why capitalism emerged uniquely in the West. The doctrine’s indexical role explains the *specific motivational form* of early capitalism, not its material base. This is consistent: values shape economic *conduct*, not infrastructure.  

  **Conclusion**  
  Weber’s account stands or falls on the **index role**. Selector/legitimator roles are supplementary but insufficient alone to explain the distinctiveness of Calvinist-driven accumulation. The propellant role is incompatible with his core claims. His "anti-reductionist" stance safeguards historical specificity but does not concede causal parity to material factors.  

  ---

  ### 4. Marking Scheme (Total 25 Marks)  
  **First-Class (21–25):**  
  - **Causal Analysis (10 marks):** Correctly identifies index as essential AND propellant as implausible; explores selector/legitimator plausibly.  
  - **Critique (8 marks):** Diagnoses circularity risk in index role; engages Weber’s "anti-spiritualism" as scope limitation.  
  - **Evidence Handling (5 marks):** Specific, well-reasoned evidence/counter-evidence for *each* role discussed.  
  - **Conclusion (2 marks):** Synthesizes roles, affirming index as decisive.  

  **Upper Second (16–20):**  
  - Identifies index as key but undersells propellant implausibility.  
  - Treats selector/legitimator superficially.  
  - Generic evidence discussion (e.g., "historical records could confirm").  
  - Misses circularity or misinterprets Weber’s disclaimer as retreat.  

  **Common Mistakes (-3–5 marks each):**  
  - Treating doctrine as propellant (misreads Weber’s motive argument).  
  - Equating ideal types with empirical generalizations (e.g., "one lazy Calvinist refutes Weber").  
  - Citing secularization as disproving causation (confuses origin with persistence).  
  - Ignoring the index role’s centrality.  
  - Quoting critics/the text (discourage by awarding 0 for name-dropping).  

  ---

  ### Confidence Assessment  
  **Overall Confidence:** High (95%). The model answer accurately reflects Weber’s avoidance of teleology, his focus on unintended consequences (index), and his dialectical view of material/ideal factors.  

  **Point of Uncertainty:**  
  The characterization of the **legitimator role** as secondary may be contentious. Weber describes Calvinism *actively* "breaking the bonds of traditionalism" by sanctifying profit, which could imply legitimation is a primary mechanism. The model answer subordinates it to the index role to prioritize anxiety-driven conduct. A specialist might argue that *both* operate simultaneously, with legitimation enabling anxiety-driven action institutionally. **Recommend verification focus:** Does Weber treat the lifting of traditional prohibitions as (a) a consequence of salvation anxiety, or (b) an independent causal factor? The model assumes (a).
