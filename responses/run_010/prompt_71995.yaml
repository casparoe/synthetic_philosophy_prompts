  Important constraints: no quotations, closed-book conditions, and avoiding common mistakes like treating ideal types as empirical generalizations. The model answer must be original yet accurate.

  For the stimulus, I'll distill Weber into six steps: predestination anxiety → active worldly calling → ascetic conduct → accumulation → secularization. This covers the core without requiring textual recall.

  The question should explicitly deploy the four-role framework and demand critical analysis of causal roles. Word count guidance is crucial - 1200 handwritten words in 90 minutes seems reasonable.

  The model answer needs to demonstrate: 
