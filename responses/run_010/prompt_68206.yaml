prompt: |-
  I write a column on science and ideas and my editor has talked me into running a 45-minute Friday session for about 20 general-assignment reporters on the tool AI vs agent AI distinction — the desk keeps filing stories that treat an agent like a broken tool and a tool like a misbehaving agent. Don't explain the distinction to me, plan how I should teach it: what has to come first and what depends on what, and one example that carries the whole thing. I've got a spreadsheet macro and a "research assistant" that decides on its own to cc my co-author on an email, but tell me which of those actually does the work, and what the example has to have and has to lack.

  I'm wedded to the idea that the dividing line isn't degrees of automation — cruise control, autopilot, that whole ladder — but whether the system can be wrong about what you wanted. Tell me if that framing survives contact with a room of non-experts or whether I should drop it. Then map the misconceptions they'll walk in with (agentic means it has its own goals, anything that can browse the web is an agent, it's a spectrum so the label definately means nothing, a failure is just a bug), and say where in the sequence I head each one off rather than at the end. Finish with one question I can ask that shows whether it landed, and what I should openly refuse to get into at this level — dont let me quietly sneak in the scary stuff about convergent subgoals.
reasoning: |-
  We are teaching the distinction between tool AI and agent AI to general-assignment reporters. The key framing: the dividing line is whether the system can be wrong about what you wanted, not degrees of automation.

  ### Core Concept
  - **Tool AI**: Does exactly what it's told. If it fails, it's because of a bug or limitation in its programming (like a spreadsheet macro that errors because of bad input). It doesn't interpret your intent beyond the explicit instructions.
  - **Agent AI**: Takes initiative and makes decisions on your behalf. It can misinterpret your intent because it has to infer what you want (like a research assistant that CCs your co-author without being explicitly told, which might be right or wrong).

  ### Teaching Plan Structure

  1. **Start with the core distinction** (without jargon): 
     - "Think of a tool as something you control directly, like a hammer. You swing it, and if it breaks the vase, that's on you. An agent is like an employee you delegate a task to; they might do it in a way you didn't expect because they interpreted your instructions."

  2. **Clarify misconceptions upfront**:
     - **Misconception 1: Agentic means it has its own goals.**
       - **Head off**: Early in the session, when introducing the term "agent," clarify: "An agent in this context doesn't mean it has desires or consciousness. It just means it has the ability to make decisions within a defined task. It's about delegation, not autonomy in the human sense."
     - **Misconception 2: Anything that can browse the web is an agent.**
       - **Head off**: When giving examples, contrast a web-searching tool (like a search bar that returns results exactly as queried) with an agent that uses the web to make decisions (like an assistant that books a flight after researching options). Emphasize: "Browsing is just a capability. The key is whether the system decides how to use that capability to achieve a goal you set, or if you're directly controlling each step."
     - **Misconception 3: It's a spectrum so the label definitely means nothing.**
       - **Head off**: Acknowledge that some systems blend elements, but stress: "We're drawing a bright line for clarity: if the system can misinterpret your intent and do something you didn't want because it filled in gaps, that's agent behavior. If it only does exactly what you programmed or commanded, it's a tool." Use clear examples to show the dichotomy.
     - **Misconception 4: A failure is just a bug.**
       - **Head off**: When discussing failures, separate: "In a tool, a failure is usually a bug or an error in the input. In an agent, a failure might be a misunderstanding — it did what it thought you wanted, but you didn't want that. That's not a bug; it's a misalignment."

  3. **Sequence of Teaching**:
     - **Step 1: Start with familiar examples of tools** (spreadsheet macro, calculator) and agents (human assistant, smart thermostat that adjusts on its own).
     - **Step 2: Introduce the framing**: "The key difference is whether the system can be wrong about what you wanted. Tools can't be wrong about your intent — they don't have intent. They just follow commands. Agents try to infer intent and can get it wrong."
     - **Step 3: Use your examples**:
       - **Spreadsheet macro (tool)**: You write a macro to sort data. If it sorts the wrong column, it's because you programmed it wrong or gave bad input. It didn't decide to sort differently because it thought you'd prefer it. *What it has to lack: any ability to reinterpret the task. It does exactly the steps coded.*
       - **Research assistant (agent)**: You ask it to "handle email correspondence about the paper." It CCs your co-author on an email without being explicitly told. *What it has to have: the ability to decide on actions (like CC'ing) based on inferred intent. What it has to lack: explicit step-by-step instructions for every action.*
       - **Which one actually does the work?** The tool does the work exactly as instructed. The agent does the work by making decisions to accomplish the goal.
     - **Step 4: Contrast failure modes**:
       - Tool failure: Macro crashes because of an unsupported formula → bug.
       - Agent failure: Assistant CCs someone you didn't want involved → misalignment (it thought you wanted that, but you didn't).

  4. **Does the framing survive?** 
     - Yes, but make it concrete. Use the email example: 
       - "If the assistant CCs your co-author, is that a bug? No, it's a design choice in the agent's decision-making. It thought that was helpful. A tool wouldn't do that unless explicitly programmed to CC in that exact scenario."

  5. **Check for understanding question**:
     - "Imagine a chatbot that books a flight for you. If it books a flight with a layover because it thought you'd prefer the cheaper option, but you actually wanted direct, is that a tool failure or an agent misalignment? Why?"
       - *Correct answer*: Agent misalignment — it inferred your preference incorrectly.

  6. **What to avoid**:
     - **Do not get into**: 
       - Convergent subgoals (e.g., an agent might want to preserve its existence to complete a task, leading to dangerous behaviors). This is too abstract and scary for an intro session.
       - Consciousness, sentience, or long-term AI risks.
       - Technical details of how AI works (e.g., neural nets, training data).
     - **Boundary**: "We're focusing on how we interact with AI today — not speculative futures. The distinction is practical for reporting: is the system doing what you told it, or what it thinks you want?"

  ### Session Flow (45 minutes):
  - 0-5 min: Intro and misconception busting (agent ≠ goals, browsing ≠ agent).
  - 5-15 min: Tools vs. agents with everyday examples (hammer vs. employee).
  - 15-25 min: Your examples (macro and email assistant) — deep dive.
  - 25-35 min: Failure modes and why the distinction matters (bug vs. misalignment).
  - 35-40 min: Check for understanding (flight booking question) and discussion.
  - 40-45 min: Q&A (steer clear of avoided topics).

  This keeps it grounded, practical, and focused on improving reporting accuracy.
answer: |-
  ### Teaching Plan: AI Tool vs. Agent Distinction  
  **Core Framing:** The dividing line is **whether the system can be wrong about what you wanted** (misalignment), not degrees of automation. This framing **survives contact with non-experts**—it’s intuitive, concrete, and avoids technical jargon. Stick with it.  

  ---

  ### **Step-by-Step Sequence**  
  **Total Time:** 45 minutes  
  **Goal:** Reporters leave able to:  
  1. **Define** tool vs. agent using the "misalignment" criterion.  
  2. **Identify** real-world examples correctly.  
  3. **Avoid** common misconceptions in reporting.  

  #### **1. Start with the Core Distinction (5 min)**  
  - **Hook:** "Think of a *tool* as a hammer: it does exactly what your hand tells it. An *agent* is like a hired assistant: it tries to guess what you want and acts on its own."  
  - **Key Question:** "Did the AI fail because it **misunderstood your intent**? If yes, it’s acting as an agent. If it failed because of bad input or a bug, it’s a tool."  
  - **Why this first?** Establishes the anchor for everything else. Non-experts need a simple, memorable litmus test.  

  #### **2. Debunk Misconceptions Early (10 min)**  
  Address these **as they arise in your examples**—not at the end. Preempt them:  

  | Misconception | When to Head It Off | How to Counter |  
  |---------------|---------------------|----------------|  
  | **"Agentic = It has its own goals"** | When introducing "agent" | *"An agent doesn’t need consciousness or goals. It just makes decisions to fulfill a task. Like your email app’s 'Smart Reply'—it’s not scheming, just predicting."* |  
  | **"Anything that browses the web is an agent"** | During the tool example | *"Browsing is a function, not agency. A search bar that fetches data is a tool. An agent uses browsing to decide what to do next."* |  
  | **"It’s a spectrum, so labels are meaningless"** | After defining both terms | *"Practically, we care about who’s responsible when things go wrong: you (tool) or the AI’s judgment (agent). A thermostat isn’t ‘a little agent’—it either follows rules or infers intent."* |  
  | **"A failure is just a bug"** | During failure analysis | *"Tools fail from bugs. Agents fail from misalignment—they did what they thought you wanted, not what you actually wanted."* |  

  #### **3. The Defining Example (15 min)**  
  **Use your spreadsheet macro vs. research assistant:**  
  - **Spreadsheet Macro (Tool):**  
    - **What it does:** Automates repetitive tasks (e.g., formatting cells) based on explicit rules.  
    - **What it HAS to lack:** *Any ability to interpret unstated goals.* If it “misbehaves” (e.g., deletes a column), it’s due to a coding error or bad input—**not** because it guessed wrong about your intent.  
    - **Why it works:** It’s predictable. Reporters see it’s a "broken tool" when it fails—no ambiguity.  

  - **Research Assistant (Agent):**  
    - **What it does:** You ask it to "draft an email about the paper." It autonomously CCs your co-author.  
    - **What it HAS to have:** *Decision-making* (e.g., judging who needs to be included). What it HAS to lack: *Explicit instructions for every step.*  
    - **Why it’s an agent:** It can be **wrong about what you wanted** (e.g., you didn’t want the co-author CC’d). This isn’t a "bug"—it’s misalignment. The AI filled gaps in your request.  

  **Which one "actually does the work"?**  
  - The **tool** performs labor under your direct control (like a wrench tightening a bolt).  
  - The **agent** performs labor by making judgments (like an intern you delegated a task to).  

  **Punchline:** If the system **decides how to achieve a goal**, it’s an agent. If it **executes predefined steps**, it’s a tool.  

  #### **4. Contrast with Automation Ladders (5 min)**  
  **Cruise control vs. autopilot is a red herring.**  
  - Show two scenarios:  
    1. *Cruise control (tool):* You set speed to 70 mph. If it accelerates to 80, it’s broken.  
    2. *Autopilot (agent):* You say "get me home safely." If it takes a detour through a storm, it **misinterpreted** "safely."  
  - **Emphasize:** Automation levels ≠ agency. What matters is the AI’s **latitude to misinterpret**.  

  #### **5. Check for Understanding (5 min)**  
  **The Test Question:**  
  > *"You ask an AI to ‘find recent climate studies.’ It returns a list of papers, but omits key authors you care about. Is this a tool failure (bug) or agent misalignment? Why?"*  

  - **Correct Answer:**  
    - **If it’s a search tool:** Failure = bug (e.g., flawed algorithm).  
    - **If it’s an agent:** Failure = misalignment (it *decided* what "recent" or "relevant" meant).  
  - **Why it works:** Forces them to apply the "misinterpretation" criterion. Listen for "it guessed wrong" vs. "it’s broken."  

  #### **6. What to Avoid (5 min for Q&A Guardrails)**  
  **Openly refuse to get into:**  
  - ✋ **"Convergent subgoals" or AGI risk:** *"Today’s agents aren’t plotting to survive. They’re just pattern-matching your requests. Save Skynet for next time!"*  
  - ✋ **Technical how-AI-works details:** *"We’re focusing on practical outcomes—not transformers, ethics, or training data."*  
  - ✋ **Philosophical debates:** *"Consciousness isn’t relevant here. A chess bot isn’t ‘ambitious’—it’s following incentives."*  

  **When questions arise:**  
  - **Deflect gracefully:** *"That’s beyond our scope today, but email me for a deep-dive!"*  

  ---

  ### **Why This Works**  
  - **Flow:** Starts simple, attacks misconceptions mid-lesson, uses relatable examples, ends with validation.  
  - **Sticks to Practicality:** Reporters care about accuracy. This fixes the "AI did something unexpected" misreporting.  
  - **Your Framing Holds Up:** "Can it be wrong about what you wanted?" is bulletproof for non-experts. It’s visceral—everyone has dealt with a overzealous "helper."  

  **Final Tip:** Bring props! Show a literal hammer (tool) and a toy robot (agent) to reinforce the metaphor visually.
