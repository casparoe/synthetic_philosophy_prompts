prompt: |-
  I am in the fourth year of a PhD in sociology, and for the past two academic years I have held a half-time appointment in my university's Office of Institutional Research, where I have become the person to whom deans and department chairs send contingency tables. Roughly once a month the request takes the same shape: here is a comparison in aggregate (pass rates under two course formats, retention under two advising models, grant success under two internal review processes, six-year completion under two bridge programs), here is the same comparison broken down by some third variable, and the two point in opposite directions. The requester wants to know which table to put in front of the provost. My office has no written answer, and different analysts have been giving different answers to structurally identical requests, which is now a reputational problem rather than a curiosity.

  Please write that answer: a decision procedure, in the form of a document I can hand to a colleague who has taken one regression course and no causal-inference training and who will have to run it under time pressure. The constraints it must survive are these. The analyst gets an hour per case. The inputs are a contingency table, a short written account of how the rows were generated, and the requester's own statement of what they intend to do about the finding. There is no software; a calculator is assumed. A statistician may be consulted only at one designated escalation point, which the procedure must define rather than leave implicit. The output is a single page naming which comparison is decision-relevant, why, what the number does not license, and what the requester must be told before they quote it. The office director co-signs, and she is not a statistician, so the reasoning has to be legible to her.

  The procedure has to carry the conceptual content rather than the slogan. I do not want "check for confounders." Specifically, it should force the analyst to settle, in a fixed order:

  1. What intervention or decision the requester actually has in mind, and whether it would be applied unit by unit or to the population as a whole — including the questions to ask a dean who does not know why this matters and would not use those words, and what to do when the requester turns out not to have one.
  2. What role the stratifying variable plays: a common cause of exposure and outcome, something the exposure itself brings about, a proxy for who was at risk, a consequence of the outcome, or an artifact of how the rows were assembled. None of this is readable off the table, so the procedure has to say what the analyst is supposed to go and find out, from whom, and what to do when nobody in the building knows.
  3. Whether the phenomenon in front of us is a reversal of an association or the failure of an association to track anything about the world, and which of those two the requester is worried about; I suspect these come apart more often than my colleagues assume, and I want the procedure to treat them separately rather than as one worry.
  4. Whether the engine of the paradox is unequal denominators, differing composition across strata, or the implicit weighting of strata — and, if the requester insists on one summary number regardless, how to produce it, how to choose the weighting, and how to disclose on the face of the document that the choice was made by a human being.
  5. Where the procedure stops. There should be an explicit class of cases in which the correct output is not a number but a refusal plus a statement of what would resolve it, and the procedure should say who signs that refusal.

  I also want the seams showing. Some of these steps can be executed mechanically and some are judgment calls wearing a procedural costume; my director will ask which is which, and I would rather the document answered her than be asked. Include a short section on the failure modes — the kinds of table and the kinds of request that will make a conscientious analyst following these instructions perfectly arrive at a confident wrong answer.

  Then run the procedure end to end on three cases. Show the arithmetic; do not just assert which table wins.

  Case A. External grant success, by school and by career band, one fiscal year. Established band: School A, 90 of 100 funded; School B, 190 of 200. Early band: School A, 20 of 200; School B, 70 of 600. School A's submissions are overwhelmingly from established investigators; School B's are overwhelmingly early career. Career band is fixed before either school's internal review process touches the proposal. The provost has asked for a single figure comparing the two schools' review processes and expects it on Friday.

  Case B. Pass rates in a required gateway course, by format and by declared track. Quantitative track: new format, 350 of 400; traditional, 90 of 100. Non-quantitative track: new format, 100 of 200; traditional, 55 of 100. The traditional cells are small because the format is being phased out. Here is the part that will matter: the new format includes a week-two exercise that actively encourages students to re-declare into the quantitative track, so track membership is partly produced by the format itself. For two years my office has published a disaggregated report on this course, and I have defended it in committee on the grounds that within every track the traditional format looks better. The registrar now wants to know whether the university should finish the phase-out for everyone. I expect the procedure to vindicate my report. If it does not, say so plainly and tell me what I should have been reporting instead.

  Case C. Six-year completion, by bridge program. Program P: 400 of 500. Program Q: 300 of 400. Within every band of entering high-school GPA, Program Q looks better; in aggregate, Program P looks better. When asked how the table was built, the analyst who compiled it says it was restricted to students who had declared a major by the end of the second year, because the completion data are messy otherwise. Program P requires declaration by the end of the second year. Program Q does not require it at all. Nobody at either program can say how many students in the other program's cohort would have met the filter. The dean of undergraduate studies wants the comparison for an accreditation self-study due in three weeks and has told my office that "no finding" is not an acceptable line item.

  Finally, a request about how you handle the contested parts. Distinguish, throughout, what is settled from what is genuinely disputed among people who work on this seriously. My own sense — which may be wrong, and which I do not want you to flatter — is that the causal-graph tradition, the potential-outcomes tradition, and a more purely evidential or associational way of talking do not describe these cases in the same vocabulary, and that a competent statistician or philosopher of science in one of those traditions might object to particular steps I have asked you to include. Wherever a step rests on such a commitment, flag it, name the commitment in a sentence, and sketch what the alternative step would look like for someone who rejects it. Do not present one school's framing as the consensus view, and do not soften the whole document by hedging every line either: I need something my colleagues can actually follow on a Tuesday. Relatedly, please do not append a bibliography or a reading list; I cannot chase it and neither can they. Name a technical concept only if you are also willing to say in one sentence what accepting it commits us to. Skip the familiar textbook illustrations of this puzzle — admissions at a large public university, kidney stones, batting averages. My analysts have all seen them, and the difficulty in my office is not in recognizing the pattern but in knowing what to do once you have.
reasoning: |-
  We are creating a decision procedure for handling Simpson's Paradox in contingency tables for institutional research. The procedure must be executable by an analyst with one regression course and no causal inference training, within an hour, using only a calculator. The output is a single page for the requester and the office director.

  The procedure will have the following sections:

  1. **Intervention Clarification**: Determine the decision the requester has in mind.
  2. **Stratifying Variable Role**: Determine the role of the third variable (the stratifier).
  3. **Nature of the Paradox**: Determine if it's a reversal or a failure of association.
  4. **Engine of the Paradox**: Identify the mathematical cause and handle weighting if needed.
  5. **Stopping Conditions**: Define when to refuse to provide a number.

  Each step includes specific questions to ask and actions to take. We also include a section on failure modes and then apply the procedure to the three cases.

  ---

  **Decision Procedure for Contingency Table Paradoxes**

  **Purpose**: This procedure guides the analyst in determining which comparison (aggregate or stratified) is decision-relevant when they point in opposite directions. The output will be a single-page memo for the requester and the office director.

  **Inputs**:
  - A contingency table (aggregate and stratified by a third variable).
  - A short written account of how the rows (exposure/treatment) were generated.
  - The requester's statement of intended action based on the finding.

  **Output**: A one-page memo containing:
  1. The decision-relevant comparison (aggregate or stratified) and why.
  2. What the number does not license (limitations).
  3. What the requester must be told before quoting it.
  4. If no single number can be provided, a clear refusal and the conditions for resolution.

  **Procedure**:

  **Step 1: Intervention Clarification**  
  *Objective: Determine the decision the requester has in mind and whether it would be applied unit-by-unit or to the population as a whole.*  

  Ask the requester:  
  - "What specific change are you considering based on this data? (e.g., expand a program, change a policy, allocate resources)"  
  - "Would this change be applied to individual students/faculty/proposals (unit-level) or to entire groups (population-level)?"  

  If the requester cannot specify an intervention:  
  - Escalate to the designated statistician (see Step 5).  
  - If escalation is not possible, output: "No decision-relevant comparison can be identified without a clear intervention. The requester must define the action they are considering."  

  *Judgment call?*: This step is a judgment call because it requires interpreting the requester's intent. The analyst must document the requester's response verbatim.

  **Step 2: Stratifying Variable Role**  
  *Objective: Determine the role of the stratifying variable (Z) in relation to the exposure (X) and outcome (Y).*  

  From the written account and by asking the data provider (or relevant office):  
  1. Is Z determined before X? (If not, Z might be a consequence of X or the outcome Y.)  
  2. Does X affect Z? (If yes, Z is a mediator.)  
  3. Does Z affect both X and Y? (If yes, Z is a confounder.)  
  4. Is Z a proxy for the population at risk? (e.g., a subgroup definition)  
  5. Is Z affected by the outcome Y? (If yes, Z might be a collider.)  

  If the role is unclear:  
  - Ask: "Can you describe the process that assigns values of Z? When does it occur relative to X and Y?"  
  - If still unclear and Z might be a confounder, proceed to Step 4 with caution. If Z is a mediator or collider, note it for Step 3.  

  *Judgment call?*: This step is a mix of investigation and judgment. The analyst must document the sources of information.

  **Step 3: Nature of the Paradox**  
  *Objective: Determine if the paradox is a reversal (aggregate and stratified associations have opposite signs) or a failure (aggregate association is present but stratified associations are null, or vice versa).*  

  Calculate:  
  - Aggregate association: Compare overall success rates for the two exposures.  
  - Stratified association: Compare success rates within each stratum of Z.  

  If the aggregate and stratified associations point in opposite directions (reversal), note it. If one is significant and the other is null (failure), note it.  

  Ask: "What worries you more: that the overall trend might mislead (reversal) or that there might be no real effect (failure)?"  

  *Judgment call?*: The calculation is mechanical, but interpreting the requester's worry is a judgment call.

  **Step 4: Engine of the Paradox and Weighting**  
  *Objective: Identify the mathematical cause (unequal denominators, differing composition, implicit weighting) and handle weighting if a single number is insisted upon.*  

  The paradox is driven by:  
  - **Unequal denominators**: The groups have different sizes.  
  - **Differing composition**: The distribution of Z differs between exposure groups.  
  - **Implicit weighting**: The aggregate result weights the strata by their size in the exposure groups.  

  To produce a single summary number when the requester insists:  
  - If Z is a confounder (from Step 2) and the intervention is unit-level, use a weighted average of the stratum-specific rates with a *standard population* (e.g., the combined population across both exposures).  
  - If Z is a mediator or collider, do not aggregate; explain why.  
  - If no standard population is available, use the overall population as weights.  

  Explicitly state: "The summary rate is standardized to the overall population distribution of [Z]. This choice reflects an assumption that the population composition is fixed."  

  *Judgment call?*: Choosing the standard population is a judgment call. The analyst must disclose the choice.

  **Step 5: Stopping Conditions**  
  *Objective: Define when to refuse to provide a number.*  

  Stop and refuse if:  
  - Step 1: No intervention is specified and escalation to the statistician does not resolve it.  
  - Step 2: Z is a collider (conditioning on Z introduces bias) and the stratified table is requested.  
  - Step 4: Z is a mediator and the intervention would change Z.  

  The refusal memo must:  
  - State the reason (e.g., "The stratifying variable is a collider; conditioning on it would distort the comparison").  
  - State what would resolve it (e.g., "We need data without conditioning on Z" or "A causal analysis with identified confounders is required").  
  - Be signed by the office director.  

  *Escalation point*: The designated statistician must be consulted whenever the analyst identifies:  
  - A collider (Step 2).  
  - A mediator when the intervention would change Z (Step 2 and Step 1).  
  - A confounder with missing data for standardization (Step 4).  

  **Failure Modes**:  
  A conscientious analyst might arrive at a wrong answer when:  
  - The role of Z is misclassified (e.g., a confounder is mistaken for a mediator).  
  - The intervention is mis-specified (e.g., a population-level decision is treated as unit-level).  
  - The standard population for weighting is chosen arbitrarily and does not match the target population.  

  **Legibility for the Director**:  
  - Steps 1, 2, and the choice of weights in Step 4 are judgment calls. The rest are mechanical.  
  - The memo must clearly label which parts are based on judgment and which on calculation.

  ---

  **Application to Cases**

  **Case A: External Grant Success**

  *Table*:  
  - Established band: School A: 90/100 = 90%; School B: 190/200 = 95%  
  - Early band: School A: 20/200 = 10%; School B: 70/600 ≈ 11.67%  
  - Aggregate: School A: 110/300 ≈ 36.67%; School B: 260/800 = 32.5%  

  Aggregate shows School A higher (36.67% > 32.5%), but within each career band, School B is higher.

  *Step 1: Intervention Clarification*  
  The provost wants to compare the two schools' internal review processes. The intervention might be to change the review process in one school or allocate resources. Since the review process is applied to each proposal (unit-level), we consider a unit-level decision.

  *Step 2: Stratifying Variable Role*  
  Career band is fixed before the review process. It is not affected by the school or the review process. It likely affects both the school (because School A has more established investigators) and the outcome (grant success). Thus, career band is a confounder.

  *Step 3: Nature of the Paradox*  
  Reversal: Aggregate favors School A, but within each band, School B is better.

  *Step 4: Engine and Weighting*  
  The paradox arises because School A has a much higher proportion of established investigators (100/300 ≈ 33.3% from established) vs. School B (200/800 = 25% from established). Since career band is a confounder and the decision is unit-level, we standardize to a common population.  

  We choose the combined population as the standard:  
  - Total established: 100+200=300  
  - Total early: 200+600=800  
  - Total: 1100  

  Standardized rate for School A:  
  = (90% * 300 + 10% * 800) / 1100 = (270 + 80) / 1100 = 350/1100 ≈ 31.82%  

  Standardized rate for School B:  
  = (95% * 300 + 11.67% * 800) / 1100  
  But use fractions: 190/200=0.95, 70/600≈0.1167. Better to use counts:  
  = ( (190/200)*300 + (70/600)*800 ) = (0.95*300 + (7/60)*800)  
  = (285 + 93.333...) ≈ 378.333  
  Then 378.333 / 1100 ≈ 34.39%  

  Alternatively, using counts without rounding:  
  Standardized School B = [ (190/200)*300 + (70/600)*800 ] = [ (190*300)/200 + (70*800)/600 ]  
  = [ (190*3/2) + (70*8/6) ] = [ 285 + (560/6) ] = 285 + 93.333 = 378.333  
  Then 378.333 / 1100 ≈ 34.39%  

  But note: The combined population has 300 established and 800 early.  

  Alternatively, we can compute the expected counts if both schools had the same distribution (300 established and 800 early):  
  For School A:  
  - Established: 90% of 300 = 270  
  - Early: 10% of 800 = 80  
  Total expected: 350, so rate=350/1100≈31.82%  

  For School B:  
  - Established: 95% of 300 = 285  
  - Early: 11.67% of 800 ≈ 93.333 (or exactly 70/600=7/60, so 7/60*800=560/6≈93.333)  
  Total expected: 285+93.333=378.333, rate=378.333/1100≈34.39%  

  Thus, after standardization, School B has a higher rate (34.39% > 31.82%).  

  *Output*:  
  The stratified comparison is decision-relevant because career band is a confounder and the intervention is unit-level. The standardized rate shows School B has a higher success rate (34.4% vs 31.8%).  

  *Memo for Case A*:  
  - **Decision-relevant comparison**: Stratified by career band, standardized to the combined population of both schools.  
  - **Why**: Career band is a confounder (affects both school and outcome) and the decision is about individual proposals.  
  - **What the number does not license**: This does not account for other confounding variables. It assumes the combined population is the target.  
  - **Requester must be told**: "The standardized rate for School B is 34.4% and for School A is 31.8%. This suggests that School B's review process performs better when adjusted for career band. However, this is an associational adjustment and does not prove causality."

  **Case B: Pass Rates by Format and Track**

  *Table*:  
  - Quantitative track: New format: 350/400=87.5%; Traditional: 90/100=90%  
  - Non-quantitative track: New format: 100/200=50%; Traditional: 55/100=55%  
  - Aggregate: New format: (350+100)/(400+200)=450/600=75%; Traditional: (90+55)/(100+100)=145/200=72.5%  

  Aggregate shows new format better (75% > 72.5%), but within each track, traditional is better (90%>87.5% and 55%>50%).

  *Step 1: Intervention Clarification*  
  The registrar wants to phase out the traditional format for everyone (a population-level change). The intervention is applied to all students, not individually.

  *Step 2: Stratifying Variable Role*  
  Track is declared by students. The new format includes an exercise in week two that encourages redeclaration to the quantitative track. Thus, the format (exposure) affects track (Z). So Z is a mediator.

  *Step 3: Nature of the Paradox*  
  Reversal: Aggregate favors new, but within each track, traditional is better.

  *Step 4: Engine and Weighting*  
  The paradox arises because the new format shifts students to the quantitative track (which has higher pass rates). Since the intervention is population-level and Z is a mediator, we care about the aggregate effect because it includes the effect via changing tracks.  

  Therefore, the aggregate comparison is relevant.

  *Output*:  
  The aggregate comparison is decision-relevant because the intervention is population-wide and the stratifier (track) is a consequence of the format.

  *Memo for Case B*:  
  - **Decision-relevant comparison**: Aggregate.  
  - **Why**: The intervention is applied to the whole population, and the stratifier (track) is affected by the format. The aggregate includes the effect of the format on track switching.  
  - **What the number does not license**: This does not isolate the direct effect of the format (if that were desired).  
  - **Requester must be told**: "The overall pass rate is higher in the new format (75% vs 72.5%). However, note that the new format encourages students to switch to the quantitative track, which contributes to the higher pass rate. If the goal is to maximize overall pass rates, the new format is better. If the goal is to compare formats without allowing track switching, then the aggregate is not appropriate."

  *Note*: This vindicates the previous disaggregated report only for a different purpose (e.g., if the question were about the effect within a fixed track). For the phase-out decision, the aggregate is more relevant.

  **Case C: Six-Year Completion by Bridge Program**

  *Table*:  
  - Program P: 400/500 = 80%  
  - Program Q: 300/400 = 75%  
  - Within every GPA band, Program Q is better (details not provided, but we trust the statement).  

  Aggregate shows Program P better (80% > 75%), but within each GPA band, Program Q is better.

  *Step 1: Intervention Clarification*  
  The dean wants a comparison for an accreditation self-study. The intervention is not specified, but the dean wants a number. The accreditation might compare programs, so the decision could be about program-level funding or expansion. This is a population-level decision.

  *Step 2: Stratifying Variable Role*  
  The table is restricted to students who declared a major by the end of the second year. Program P requires declaration by the end of the second year; Program Q does not. Thus, the filter (Z = declared by year 2) is a consequence of the program (exposure). Specifically:  
  - Program P causes Z (because it requires it).  
  - Program Q does not cause Z.  

  Moreover, Z is a collider because:  
  - Program (X) affects Z.  
  - Unmeasured factors (e.g., student preparedness) might affect both Z and completion (Y). Conditioning on Z might open a path between X and Y that is not causal.

  *Step 3: Nature of the Paradox*  
  Reversal.

  *Step 4: Engine and Weighting*  
  Because Z is a collider, conditioning on it induces bias. The within-stratum comparisons are biased. Therefore, we cannot trust the stratified table.  

  Moreover, the aggregate table includes only students with Z=1 (declared). This is a subset of the population. Program P has 500/??? (we don't know the original cohort) and Program Q has 400/???.

  *Stopping Condition*:  
  We stop because Z is a collider and the data is conditioned on Z. We do not have data on the full cohort (without conditioning).  

  *Escalation*: This requires consulting the statistician. The statistician might advise:  
  - Collect data on the full cohort (without conditioning on Z).  
  - If that's impossible, use the aggregate but with a caveat that it only applies to students who declare by year 2.  

  But the dean wants a comparison for the entire cohort.  

  *Step 5: Refusal*  
  We refuse to provide a single number because:  
  - The data is conditioned on a collider (declaration by year 2), which biases the within-stratum comparisons.  
  - The aggregate only represents students who declared by year 2, not the full cohort.  

  *Memo for Case C*:  
  - **Refusal**: We cannot provide a valid comparison because the data is conditioned on a variable (declaration by year 2) that is affected by the program and might be related to unmeasured factors.  
  - **What would resolve it**: We need completion data for the entire entering cohort, without conditioning on declaration.  
  - **Signed by the office director**.

  ---

  **Contested Parts and Commitments**

  The procedure relies on causal reasoning. We flag the commitments:

  1. **Step 1 (Intervention)**: Requires a potential-outcomes framework (what would happen under different interventions). Without a well-defined intervention, causal questions are ambiguous. *Alternative*: An associational approach might report both tables without choosing, but that does not answer the decision question.

  2. **Step 2 (Role of Z)**: Relies on causal graphs (e.g., confounder, mediator, collider). *Alternative*: A purely associational approach might condition on Z if it is available, without considering causal structure. This could lead to bias (e.g., conditioning on a collider).

  3. **Step 4 (Weighting)**: Standardization is a form of adjustment under the potential-outcomes framework. *Alternative*: Regression adjustment might be used, but without software, we use direct standardization.

  4. **Collider (Case C)**: The bias from conditioning on a collider is a causal concept. *Alternative*: An associational approach might not see a problem and report the stratified table.

  We do not take a stand on the philosophical debates. The procedure is designed for practical decision-making and is based on the majority view in causal inference that causal structure matters.

  ---

  **Final Note for the Analyst**:  
  This procedure is a guideline. When in doubt, escalate to the statistician. Document every step.
answer: |-
  ### Decision Procedure for Contingency Table Paradoxes in Institutional Research  
  **Purpose**: To determine which comparison (aggregate or stratified) is decision-relevant when they conflict, and produce a one-page memo for the requester.  

  ---

  #### **Step 1: Clarify the Intervention**  
  *Objective: Identify the decision the requester is considering and whether it applies unit-by-unit or to the population.*  
  **Actions**:  
  1. Ask the requester:  
     - "What specific change will you make based on this data? (e.g., expand Program X, replace Policy Y)"  
     - "Will this change apply to individual people/units (e.g., students, proposals) or to entire groups (e.g., departments, the whole university)?"  
  2. If the requester cannot answer:  
     - Ask: "Is this about tailoring interventions for specific groups (unit-level) or setting a universal policy (population-level)?"  
     - If still unclear, **escalate to the statistician** (see Step 5).  
  **Judgment call**: Interpreting the requester’s intent. If no intervention is specified after escalation, refuse the request (see Step 5).  
  **Why this matters**: Unit-level decisions require controlling for confounders; population-level decisions may use aggregate effects if they include indirect pathways.  

  ---

  #### **Step 2: Determine the Role of the Stratifying Variable (Z)**  
  *Objective: Identify whether Z is a confounder, mediator, collider, proxy, or artifact.*  
  **Actions**:  
  1. From the written account of how rows were generated, ask:  
     - "When was Z determined relative to the exposure (X) and outcome (Y)?"  
     - "Could X affect Z? Could Z affect X? Could Z affect Y? Could Y affect Z?"  
  2. Investigate sources:  
     - **Data provider**: "Describe the process assigning Z values."  
     - **Subject-matter expert**: "Could Z be influenced by X or Y?" (e.g., ask faculty for Case B’s "track").  
  3. Classify Z based on answers:  
     - **Confounder**: Z affects X and Y (e.g., career band in Case A).  
     - **Mediator**: X affects Z, and Z affects Y (e.g., track in Case B).  
     - **Collider**: X and Y both affect Z (e.g., major declaration in Case C).  
     - **Proxy**: Z correlates with unmeasured causes (e.g., GPA band as proxy for preparedness).  
     - **Artifact**: Z results from data collection (e.g., missing data filters).  
  4. If role is unknown or contested: **Escalate to the statistician**.  
  **Judgment call**: Diagnosing Z’s role requires contextual knowledge. If unresolved, assume Z is a confounder and proceed cautiously.  
  **Why this matters**: Confounders require adjustment; mediators may be part of the effect; colliders introduce bias.  

  ---

  #### **Step 3: Diagnose the Paradox**  
  *Objective: Determine if the paradox is a reversal (association flips sign) or failure (association vanishes in strata).*  
  **Actions**:  
  1. Calculate:  
     - Aggregate association: (Successes<sub>X1</sub>/Total<sub>X1</sub>) vs. (Successes<sub>X2</sub>/Total<sub>X2</sub>).  
     - Stratified association: Repeat within each Z stratum.  
  2. Ask the requester:  
     - "Is your concern that the overall trend is misleading (reversal) or that there might be no real effect (failure)?"  
  3. Classify:  
     - **Reversal**: Aggregate and stratified associations oppose (e.g., Case A: aggregate favors School A; strata favor School B).  
     - **Failure**: Association exists in aggregate but null in strata (or vice versa).  
  **Mechanical**: Calculation is arithmetic; interpretation of requester’s concern is judgment.  
  **Why this matters**: Reversal implies Z distorts comparisons; failure suggests no actionable effect.  

  ---

  #### **Step 4: Handle the Paradox Engine**  
  *Objective: Address unequal denominators, compositional differences, or weighting conflicts. Produce one number if insisted.*  
  **Actions**:  
  1. Identify the engine:  
     - **Unequal denominators**: Groups have different sizes (e.g., Case B’s small traditional cells).  
     - **Differing composition**: Exposure groups have different Z distributions (e.g., Case A’s career band imbalance).  
     - **Implicit weighting**: Strata are weighted by group size in aggregate.  
  2. If requester insists on one number:  
     - **Z is a confounder and intervention is unit-level**: Standardize rates using a common population (e.g., combined cohort).  
       - Formula: Standardized rate = Σ [ (Rate<sub>stratum</sub> × Total<sub>stratum</sub>) ] / Total<sub>population</sub>.  
     - **Z is a mediator and intervention is population-level**: Use aggregate (includes Z’s indirect effects).  
     - **Z is a collider or artifact**: Refuse (see Step 5).  
  3. Weighting disclosure:  
     - "The summary rate weights strata by [specify standard, e.g., combined population]. This choice assumes [assumption, e.g., fixed Z distribution] and was made by the analyst."  
  **Judgment call**: Choosing the standard population (e.g., combined vs. external).  
  **Why this matters**: Standardization adjusts for confounding; aggregate captures total effects.  

  ---

  #### **Step 5: Stopping Conditions**  
  *Objective: Refuse requests where no valid comparison exists.*  
  **Actions**:  
  1. **Stop and refuse** if:  
     - Z is a collider (Step 2) and stratified table is requested.  
     - Z is a mediator and the intervention would change Z (Step 1).  
     - Data lacks the target population for standardization (Step 4).  
     - No intervention is specified after escalation (Step 1).  
  2. **Escalate to statistician** for:  
     - Colliders (Step 2).  
     - Mediators when intervention affects Z (Step 1 + 2).  
     - Unresolved Z role (Step 2).  
  3. **Refusal memo** (signed by office director):  
     - "No valid comparison possible because [reason]. Resolution requires [e.g., data without conditioning on Z]."  

  ---

  #### **Failure Modes**  
  Conscientious analysts may err when:  
  1. **Z is misclassified** (e.g., mediator labeled confounder) → wrong comparison chosen.  
  2. **Intervention is mis-specified** (e.g., population-level treated as unit-level) → aggregate used when strata are needed.  
  3. **Weighting ignores context** (e.g., arbitrary standard population) → number misrepresents reality.  
  **High-risk cases**:  
  - Z is endogenous (e.g., influenced by X).  
  - Small strata (e.g., Case B’s traditional format).  
  - Requester demands a number despite colliders (Case C).  

  ---

  ### **Case Applications**  
  **Key**:  
  - X = Exposure (e.g., school, format, program).  
  - Y = Outcome (e.g., success, pass, completion).  
  - Z = Stratifier (e.g., career band, track, GPA band).  

  ---

  #### **Case A: Grant Success by School and Career Band**  
  - **Table**:  
    - Aggregate: School A: 110/300 ≈ 36.7%; School B: 260/800 = 32.5% → **A better**.  
    - Stratified:  
      - Established: A (90/100 = 90%) vs. B (190/200 = 95%) → **B better**.  
      - Early: A (20/200 = 10%) vs. B (70/600 ≈ 11.7%) → **B better**.  

  **Step 1: Intervention**  
  - Provost compares internal review processes. Decision: Unit-level (evaluating individual proposals).  

  **Step 2: Role of Z (Career Band)**  
  - Fixed before review → **Confounder** (affects school selection and success).  

  **Step 3: Paradox**  
  - **Reversal** (aggregate and strata oppose).  

  **Step 4: Engine and Weighting**  
  - Engine: **Differing composition** (School A has more established investigators).  
  - Standardize using combined population (established: 300, early: 800, total: 1,100):  
    - School A: [(90% × 300) + (10% × 800)] / 1,100 = (270 + 80)/1,100 ≈ 31.8%.  
    - School B: [(95% × 300) + (11.7% × 800)] / 1,100 = (285 + 93.6)/1,100 ≈ 34.4%.  
  - **Stratified comparison relevant** (Z is confounder; unit-level decision).  

  **Output Memo**:  
  > **Decision-Relevant Comparison**: Stratified by career band, standardized to combined population.  
  > **Why**: Career band confounds the school-outcome relationship; standardization adjusts for unequal composition. School B performs better (34.4% vs. 31.8%).  
  > **Limitations**: Does not account for other confounders (e.g., discipline). Standardization assumes the combined population is the target.  
  > **Requester Must Disclose**: "This rate weights career bands by their combined size. It does not prove causality but adjusts for observed confounding."  

  ---

  #### **Case B: Pass Rates by Format and Track**  
  - **Table**:  
    - Aggregate: New (450/600 = 75%) vs. Traditional (145/200 = 72.5%) → **New better**.  
    - Stratified:  
      - Quant: New (350/400 = 87.5%) vs. Traditional (90/100 = 90%) → **Traditional better**.  
      - Non-Quant: New (100/200 = 50%) vs. Traditional (55/100 = 55%) → **Traditional better**.  

  **Step 1: Intervention**  
  - Registrar phases out traditional format for all students → **Population-level**.  

  **Step 2: Role of Z (Track)**  
  - New format’s week-two exercise encourages switching to quant track → **Mediator** (X affects Z).  

  **Step 3: Paradox**  
  - **Reversal** (aggregate and strata oppose).  

  **Step 4: Engine and Weighting**  
  - Engine: **Implicit weighting** (new format shifts students to quant track, which has higher pass rates).  
  - **Aggregate comparison relevant** (Z is mediator; population-level decision includes track-switching effect).  

  **Output Memo**:  
  > **Decision-Relevant Comparison**: Aggregate (75% new vs. 72.5% traditional).  
  > **Why**: The intervention affects the whole population, and track is a consequence of the format. The aggregate includes the benefit of track-switching.  
  > **Limitations**: Does not isolate the format’s direct effect (without track changes). Small traditional-cell sizes increase uncertainty.  
  > **Requester Must Disclose**: "This comparison includes the effect of the new format on track selection. If traditional format had similar enrollment, results may differ."  
  > **Note**: Your past report (stratified) is valid for understanding effects *within fixed tracks* but not for population-level decisions.  

  ---

  #### **Case C: Completion by Program and GPA Band**  
  - **Table**:  
    - Aggregate: Program P (400/500 = 80%) vs. Program Q (300/400 = 75%) → **P better**.  
    - Stratified: Within every GPA band, **Q better** (data not shown).  

  **Step 1: Intervention**  
  - Dean wants a number for accreditation → Population-level, but no specific change stated.  

  **Step 2: Role of Z (GPA Band)**  
  - Table restricted to students who declared majors by year-end.  
  - Program P requires declaration; Program Q does not → **Collider** (program and unmeasured factors affect Z).  

  **Step 3: Paradox**  
  - **Reversal** (aggregate and strata oppose).  

  **Step 4: Engine and Weighting**  
  - Engine: **Conditioning on a collider** (Z distorts association; P forces declaration, Q does not).  
  - **No valid comparison**: Aggregate only includes decliners (missing P/Q cohorts without declaration). Stratified biased by conditioning.  
  - **Escalate to statistician**: Confirms refusal.  

  **Output Memo (Refusal)**:  
  > **No Decision-Relevant Comparison Possible**.  
  > **Why**: The table conditions on major declaration, which is a collider. Program P’s requirement distorts the sample, making comparisons biased. Resolution requires data for the full cohort (without declaration filter).  
  > **Signed by Office Director**: [Director’s Name]  
  > **Requester Must Be Told**: "This table cannot support conclusions about program effectiveness. We need unfiltered cohort data."  

  ---

  ### **Contested Commitments**  
  The procedure relies on causal principles. Where steps are contested:  
  1. **Step 1 (Intervention)**:  
     - **Commitment**: Potential-outcomes framework (decisions require well-defined interventions).  
     - **Contested by**: Associational approaches that report "effects" without interventions.  
     - **Alternative**: Skip intervention clarification; report both tables. But this avoids decision-relevance.  

  2. **Step 2 (Z’s Role)**:  
     - **Commitment**: Causal graphs (confounder/mediator/collider distinctions are causal).  
     - **Contested by**: Evidential traditions that condition on available Z without causal scrutiny.  
     - **Alternative**: Always condition on Z if recorded. This risks bias (e.g., Case C collider).  

  3. **Step 4 (Weighting)**:  
     - **Commitment**: Standardization assumes exchangeability (no unmeasured confounders).  
     - **Contested by**: Philosophers who argue weighting choices are value-laden.  
     - **Alternative**: Report unweighted stratum-specific estimates. This ignores population impact.  

  **Balance**: The procedure prioritizes causal reasoning for decision-making but flags escalations where disagreements persist (e.g., colliders).  

