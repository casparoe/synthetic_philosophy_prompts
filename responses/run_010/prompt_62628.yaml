prompt: |-
  I teach an applied ethics course in which the doctrine of double effect comes up every year, and in the course of teaching it I have become preoccupied with a pattern for which I cannot locate a name. I will describe it and then say what I want from you.

  Consider a bystander who can redirect a runaway trolley onto a side track where one worker stands rather than the main track where five stand. I can describe what he does as redirecting the trolley away from the five, foreseeably killing the one; or I can describe it as using the one's body, positioned on the side track, to stop the trolley and thereby save the five. Both descriptions are literally true of the very same events — nothing about the physics, the sequence, or the mental states of the agent distinguishes them — yet one yields a verdict of permissible side effect and the other yields a verdict of impermissible use of a person as a means. The parallel case in my medical ethics unit runs the same way: a physician titrating morphine for a dying patient can be described as relieving pain while foreseeing respiratory depression, or as bringing about respiratory depression in order to relieve pain, since the relief arrives only by way of the depression, and again both descriptions fit the identical course of conduct.

  The pattern I want to isolate is not simply that the boundary between what is intended and what is foreseen is fuzzy or contestable at the margins. It is this: for a single course of conduct there are several equally accurate descriptions, they sort the conduct into opposite verdicts, and when two competent judges disagree about a case they very often turn out to have been selecting different descriptions all along, before any argument was exchanged. Worse, when I press students to justify the description they chose rather than another, the only justification on offer is that it "best captures what really happened," and any more determinate criterion I can articulate — the most proximate description, the one tracking the agent's own conception of the act, the one under which the effect is causally explanatory of the good — has a counterexample, and tends to select for each case whichever description supports the verdict the critic already favors.

  So: does this have an established name, in the literature on double effect or anywhere adjacent to it? I want to know which existing concepts come closest to it, and for each one, precisely where the phenomenon I have described exceeds it or falls short of it — I am not satisfied with a bare label, because the point is the carving, not the name. If nothing in the literature picks out exactly this, say so plainly and then give it a name, with a definition sharp enough to generate boundary cases: tell me which of my two illustrations it clearly covers, and describe one case that sits at its edge and one that lies just outside it.
reasoning: |-
  Okay, the user teaches applied ethics and is grappling with a specific pattern related to the doctrine of double effect (DDE). They've noticed that in cases like the trolley problem and medical morphine titration, a single action can be described in two equally accurate ways that lead to opposite moral verdicts. The problem isn't just about fuzzy boundaries but the existence of co-descriptions that sort the action into permissible versus impermissible categories. 

  The user is frustrated because when students justify their chosen description, they can't provide solid criteria—it's always about what "best captures" the event, which seems circular. They want to know if there's a named concept for this in the literature. If not, they want a newly coined term with sharp boundaries and examples.

  First, I recall existing concepts. The DDE itself distinguishes between intended means and foreseen side effects. But the user's issue is deeper—it's about two valid descriptions of the same event fitting opposite DDE categories. Action individuation problems (like Davidson's) address how actions are counted or described, but don't tackle the moral sorting aspect. Anscombe's intentional action under a description touches on it but doesn't cover the moral divergence. Moral luck and framing effects are adjacent but not precise—they deal with external factors or presentation, not co-extensive descriptions with moral implications.

  Epistemic underdetermination in ethics comes close. It's when evidence doesn't determine a single moral description, leading to indeterminate verdicts. But the user's case has determinate-yet-conflicting verdicts per description, which is different. The concept of aspectuality—seeing one event under multiple aspects—is ontological but misses the moral conflict element. 

  No existing term perfectly fits. So I need to coin a new one. "Descriptive aspectual dualism" (DAD) captures the core: two co-extensive descriptions (aspects) of one event with divergent DDE implications. The definition must highlight the moral sorting, not just underdetermination.

  For boundary testing: 
  - Clear case: Trolley redirect fits DAD perfectly—both descriptions are physically identical but split morally. 
  - Edge case: Terror bomber (intends deaths) vs. strategic bomber (foresees deaths). Here, mental states differ, so it's outside DAD—descriptions aren't co-extensive. 
  - Outside case: Self-defense killing where intention (stop threat) vs. description ("killing as means") conflict, but mental state fixes intention, making one description inaccurate. 

  The user's deeper need: They want tools to teach this nuance without students retreating to intuition. By naming and defining DAD sharply, they can dissect disagreements at the descriptive level before moral arguments. Also, highlighting the absence of criteria beyond circular "best capture" claims exposes a meta-ethical gap they can explore in class. This moves the debate from "who's right" to "why do descriptions diverge," which is more productive.
answer: |-
  Based on your precise description, **no established term in the double effect (DDE) literature or adjacent fields perfectly captures this specific phenomenon.** Existing concepts address parts of it but miss the core feature: **multiple, equally accurate, co-extensive descriptions of the *same physical event* sorting into *opposite* DDE verdicts without recourse to non-arbitrary selection criteria.**

  Here's the dissection of near-misses and the proposed new term:

  ### Existing Concepts & Where They Fall Short
  1.  **The "Problem of Action Individuation" (e.g., Davidson, Anscombe):**
      *   **What it covers:** Recognizes that a single event/action can be described in multiple ways ("flipping the switch," "diverting the trolley," "killing the one").
      *   **Where it falls short:** Primarily ontological (what counts as *an* action?). It doesn't inherently focus on the *moral sorting* or the *systematic divergence* of DDE verdicts based *specifically* on which co-extensive description is chosen. It also doesn't address the lack of non-question-begging criteria for selecting the "intentional" description under DDE.

  2.  **"Indeterminacy of Intention" or "Fuzziness of the Intended/Foreseen Distinction":**
      *   **What it covers:** Acknowledges borderline cases where classifying an effect as intended or foreseen is difficult.
      *   **Where it falls short:** Your phenomenon isn't about borderline *classification* of a *single effect* under a *single description*. It's about different, equally accurate *descriptions of the entire act* leading to *determinate but opposite* verdicts. The descriptions themselves *define* the effect differently (e.g., "redirecting (foreseeing death)" vs. "using-body-to-stop"). The fuzziness is at the level of *which description governs*.

  3.  **"Framing Effects" (in Moral Psychology/Behavioral Ethics):**
      *   **What it covers:** How presenting logically equivalent information differently alters moral judgments.
      *   **Where it falls short:** Framing typically involves *different presentations* of the *same underlying description*. Your case involves *different underlying descriptions* that are *both physically accurate*. Framing effects exploit cognitive biases; your phenomenon highlights a deeper conceptual/ontological issue about action description and DDE categorization.

  4.  **"Epistemic Underdetermination" (in Ethics):**
      *   **What it covers:** Situations where the available evidence doesn't uniquely determine a single moral verdict.
      *   **Where it falls short:** While related, your case isn't primarily epistemic. The physical facts *are* determined. The underdetermination is about *which description* morally governs the DDE analysis *given* the physical facts. The verdicts *are* determined *relative to each description*; the problem is the lack of a meta-criterion to select *the* description.

  5.  **"Aspectuality" (Anscombe-inspired):**
      *   **What it covers:** An action can be intentional under one description but not under another.
      *   **Where it falls short:** While key background, it doesn't capture the core conflict: that *both* co-extensive descriptions are equally accurate physical accounts, yet sorting them into the "intentional" vs. "side-effect" boxes for DDE yields *opposite* permissibility verdicts, and crucially, **there's no non-circular way to privilege one description over the other for DDE purposes.** Aspectuality allows for multiple true descriptions; your phenomenon shows how this feature *cripples* DDE application in specific cases due to divergent sorting *and* the selection problem.

  ### The Proposed Term: **Descriptive Aspectual Dualism (DAD)**
  *   **Definition:** A phenomenon occurring within the application of the Doctrine of Double Effect (DDE) where:
      1.  A single, physically determinate course of conduct (sequence of events, agent's mental states) admits of two (or more) *equally accurate and co-extensive* descriptions.
      2.  Applying the DDE framework to each description yields *opposite moral verdicts* regarding the permissibility of the conduct (e.g., permissible side-effect vs. impermissible intended means).
      3.  There exists *no non-question-begging, universally applicable criterion* to definitively select which description governs the DDE analysis, leading to persistent disagreement rooted in the initial description choice.

  #### Boundary Testing for DAD
  1.  **Clear Case Covered (Trolley Redirect):** Perfectly fits DAD. Description 1 ("Redirecting trolley away from five, foreseeing death of one") yields permissible side-effect. Description 2 ("Using the one's body on the side track to stop the trolley to save five") yields impermissible using-as-means. Both describe the same physics/sequence/mental state. No decisive criterion selects one description.
  2.  **Clear Case Covered (Morphine Titration):** Perfectly fits DAD. Description 1 ("Administering dose sufficient to relieve pain, foreseeing it will depress respiration") yields permissible side-effect. Description 2 ("Bringing about respiratory depression [the mechanism] in order to relieve pain") yields impermissible intended means (death as means to pain relief). Same physical act, opposite DDE verdicts, no selection criterion.
  3.  **Edge Case (Sits at the Boundary): The Strategic Bomber vs. Terror Bomber (Mental State Variation)**
      *   **Scenario:** Two bombers drop bombs on a munitions factory, foreseeing the deaths of nearby civilians.
      *   **Bomber A (Strategic):** Intends *only* to destroy the factory; civilian deaths are a foreseen but unwanted side-effect. *Description:* "Destroying the factory, foreseeing civilian deaths."
      *   **Bomber B (Terror):** Intends the civilian deaths to demoralize the enemy; destroying the factory is a means or side-effect. *Description:* "Killing civilians to demoralize the enemy (using factory destruction)."
      *   **Why it's an Edge Case:** The *physical actions* (dropping bombs) might appear identical. However, DAD requires the descriptions to be *co-extensive* for the *same agent/conduct*. Here, the agent's *intention* differs, making the descriptions *not* co-extensive for the same event. The Strategic Bomber's act *cannot* be accurately described as "killing civilians to demoralize," nor the Terror Bomber's as "destroying factory foreseeing deaths." The differing mental states break the co-extensiveness required by DAD. It highlights the crucial role of mental state in defining the act description *for DDE*, putting it at the boundary where DAD *doesn't* apply because the descriptions aren't equally accurate for the same agent. This case *relies* on the mental state distinction DAD bypasses.
  4.  **Clearly Outside Case: Self-Defense Killing**
      *   **Scenario:** Victim V shoots attacker A who is about to kill V.
      *   **Description 1:** "Intentionally killing A to stop the unjust attack." (Often deemed permissible under DDE as intended means to self-preservation).
      *   **Description 2:** "Using A's death as a means to save oneself." (Suggests impermissible using-as-means).
      *   **Why it's Outside:** While descriptions differ, Description 2 ("using death as means") is arguably *not* an equally accurate physical description *if* V intends *to stop the attack* and knows death is the only way. The intention to *stop the attack* (achieved by causing death) is distinct from intending death *as an end* or *solely as a means*. Description 2 mischaracterizes the agent's intentional object if their goal is defense, not death per se. This case hinges on correctly identifying the agent's intention (stopping the threat) and whether death is the chosen means *to that end*. It doesn't exhibit the *description-dependent sorting without recourse to mental state* that defines DAD. The DDE analysis here focuses on correctly identifying the one intended end (self-preservation) and means (force necessary to stop attack), not choosing between co-extensive physical descriptions. The "using death as means" description fails the accuracy test for the typical self-defense scenario.

  **In Summary:** Your phenomenon exposes a critical vulnerability in DDE: its verdict is exquisitely sensitive to the chosen description of the act, and for certain physically determinate acts, multiple, equally valid descriptions exist that force opposite verdicts, with no meta-principle to resolve the choice. **Descriptive Aspectual Dualism (DAD)** names this specific, structurally destabilizing feature. It moves beyond fuzziness or individuation to highlight the *systematic generation of opposite DDE verdicts by co-extensive descriptions* and the *absence of a non-circular resolution*. This provides a precise tool for diagnosing the root of many DDE disagreements in your classroom.
