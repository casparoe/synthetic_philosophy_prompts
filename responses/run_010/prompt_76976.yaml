answer: |-
  ## GLOBAL GIFTS, HOSPITALITY AND CONFLICTS OF INTEREST STANDARD (Version 6.2)
  **Effective Date:** 01 October 2024
  **Issuing Department:** Office of Global Integrity & Compliance (OGIC)

  **1. PURPOSE**
  This Standard establishes minimum requirements for identifying, declaring, and managing Gifts and Hospitality that could create a real or perceived Conflict of Interest, thereby safeguarding the Organization's reputation, impartiality, and compliance with donor requirements.

  **2. DEFINITIONS**
  2.1 **Gift:** Any item, service, discount, or intangible benefit offered or transferred without full market-value compensation *which could reasonably be perceived as creating a sense of obligation in the Recipient toward the Giver*, regardless of intent. This includes but is not limited to: cash, vouchers, meals, travel, accommodation, use of property, preferential treatment, and non-monetary favours.
  2.2 **Hospitality:** The provision of food, drink, accommodation, travel, or entertainment by a Third Party to a Staff Member.
  2.3 **Conflict of Interest (COI):** A situation where a Staff Member's personal interests (financial, familial, relational, or otherwise) could improperly influence, or be perceived to influence, their professional judgment or actions in relation to Organization business.
  2.4 **Staff Member:** Any individual employed by, contracted by, or acting on behalf of the Organization globally.
  2.5 **Third Party:** Any individual or entity external to the Organization, including beneficiaries, government officials, suppliers, partners, donors, and community members.
  2.6 **Declaration Threshold:** The monetary value (USD $25.00) above which a Gift *must* be formally declared via the OGIC Portal. *Note: The intrinsic or perceived social/cultural value of an item may necessitate declaration even if below threshold.*

  **3. GIFT STANDARDS**
  3.1 **General Prohibition:** Staff Members shall not solicit Gifts. Acceptance of Gifts is strongly discouraged.
  3.2 **Permissible Acceptance:** A Gift may only be accepted if ALL criteria are met:
      a) It is unsolicited.
      b) Refusal would cause significant cultural offense or operational disruption (*See Annex A: Declination Protocol*).
      c) Its value is below the Declaration Threshold *OR* is declared promptly.
      d) It is not cash or cash equivalents (e.g., gift cards).
      e) It is not offered by a Third Party currently involved in, or seeking to influence, a procurement, regulatory, beneficiary selection, or contractual process with the Organization.
      f) It is not prohibited by local law.
  3.3 **Declaration:** All Gifts meeting or exceeding the Declaration Threshold, or which present a potential COI regardless of value, MUST be declared within 5 business days via the OGIC Portal. Declared Gifts typically become Organization property, unless OGIC grants an exception (e.g., perishable goods to be shared collectively).
  3.4 **De Minimis Exception:** Items of *truly* nominal value and widely distributed (e.g., branded pens, calendars, simple refreshments during a meeting) generally fall below the threshold for declaration *unless* the specific context suggests an intent to influence.

  **4. HOSPITALITY STANDARDS**
  4.1 Hospitality offered by Third Parties may only be accepted if:
      a) It is incidental to legitimate Organization business (e.g., working lunch during a site visit).
      b) The value is reasonable and proportionate to the business context.
      c) Acceptance does not create a real or perceived obligation.
      d) Declination is genuinely impractical without causing offense or hindering core operations.
      e) It is declared if the estimated value per person exceeds the Declaration Threshold.
  4.2 Institutional Hospitality (e.g., Head Office Annual Gala, Seasonal Hampers for staff) is pre-assessed by OGIC as low inherent COI risk due to its broad, non-targeted distribution and internal origin, and is therefore exempt from individual declaration requirements.

  **5. CONFLICT OF INTEREST**
  5.1 Staff Members must proactively identify and declare any actual or potential COI, including those arising from familial or close personal relationships with Third Parties involved in Organization business. Declarations must be submitted via the OGIC Portal.
  5.2 OGIC will assess declared COIs and determine mitigation measures, which may include recusal from specific decisions or processes.

  **6. CONSEQUENCES OF NON-COMPLIANCE**
  Failure to comply may result in disciplinary action, up to and including termination of employment/contract, and potential legal consequences.

  **ANNEX A: FREQUENTLY ASKED QUESTIONS (FAQ)**

  *   **Q1: My local counterpart offered me a handwoven basket (est. value $15) after a successful training. Must I declare it?**
      A: While below the $25 threshold, consider context. Was it a personal gesture or part of a broader community closing ritual? If the latter, and widely distributed to the team, it *may* fall under de minimis. If solely to you, and the counterpart has ongoing business with us, declaration is prudent. When in doubt, declare.

  *   **Q2: Protocol requires exchanging small gifts during holiday visits to key partners. How to comply?**
      A: Pre-approved, low-value (<$10), culturally mandated reciprocal gifts may be given *with prior written approval from your Country Director* using the Petty Cash Authorization Form GHI-7b. Maintain meticulous receipts. Non-reciprocal gifts received must still be assessed per Section 3.2.

  *   **Q3: My cousin is the District Permit Officer we interact with monthly. Is this a COI? Do I need to declare *him*?**
      A: The familial relationship with a Third Party involved in Organization business constitutes a potential COI. You MUST formally declare the relationship via the OGIC Portal immediately. OGIC will determine if mitigation (e.g., recusing yourself from permit discussions) is required. Failure to declare is a serious breach.

  *   **Q4: HQ's annual gala involves partners seated at tables costing $5,000. Why isn't this Hospitality declared?**
      A: Institutional Hospitality events are centrally organized, broadly targeted, and pre-assessed by OGIC as serving legitimate relationship-building objectives for the Organization as a whole, with minimal perceived individual obligation creation. They fall outside the scope of individual staff declaration requirements.

  **ANNEX B: REGIONAL IMPLEMENTATION NOTE (ASIA-PACIFIC REGION)**

  **Subject:** Contextualizing the Declaration Threshold ($25 USD)
  **Date:** 15 September 2024

  While the $25 USD Declaration Threshold is a global standard, OGIC recognizes the importance of contextual risk assessment. Below is indicative guidance on what $25 USD approximates in key APAC operational contexts:

  *   **Country Office Alpha:** ~5 days' wages for an unskilled laborer; 3 high-quality restaurant meals; a modest household appliance.
  *   **Country Office Beta:** ~10 days' wages for an unskilled laborer; a week's groceries for a family of 4; basic mobile phone.
  *   **Country Office Gamma:** ~2 days' wages for a mid-level professional; a premium restaurant meal for two; a modest hotel night.

  **Key Consideration:** A Gift's *perceived* value and significance within the local socio-economic and cultural context often outweighs its nominal monetary value. A gift of staple food items valued at $20 may carry immense significance in a food-insecure area, potentially creating a powerful sense of obligation. Staff must apply heightened vigilance and, when in doubt, declare.

  **Declination Protocol Note (Country Director, Office Beta):** Strict adherence to the OGIC Declination Script ("Thank you for your generous thought. While I am deeply touched, Organization policy strictly prohibits me from accepting personal gifts to maintain impartiality. I hope you understand our commitment to integrity.") resulted in the termination of a crucial community partnership in Region X last quarter. The Elders interpreted refusal as profound disrespect and rejection of their authority. OGIC has granted Office Beta provisional permission to accept symbolically vital, low-monetary-value community gifts (e.g., ceremonial scarves, shared meals) *post-event* and file a consolidated 'Cultural Reciprocity Acceptance' report quarterly, pending further policy review. This is *not* a blanket exemption.
