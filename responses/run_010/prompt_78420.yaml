answer: |-
  Your reconstruction captures the spirit of Lewis's triviality argument well, and your worry about its apparent overgeneralization is astute. Let me reason through this step by step, addressing your concerns about the scope of the argument, the role of counterfactual credences, and the commitment issue.

  First, your observation that steps 4 through 9 seem applicable to any sentence S is correct in structure: for any proposition S, P(S) = P(S|B)P(B) + P(S|¬B)P(¬B) by total probability. The critical difference for conditionals lies in the specific values assigned to P(C|B) and P(C|¬B) in your steps 6 and 7. These steps assume that learning B forces credence in C to 1, and learning ¬B forces it to 0. For an arbitrary sentence S, P(S|B) and P(S|¬B) are not generally 1 or 0 unless S is logically equivalent to B or ¬B. Conditionals are unique here because Adams's Thesis, combined with the dynamics of learning, motivates these extreme values. When you learn B, P(B|A) becomes 1 (since P(B|A) = 1 when P(B) = 1 and P(A) > 0), justifying P(C|B) = 1. When you learn ¬B, P(B|A) becomes 0, justifying P(C|¬B) = 0. For most other propositions, no such link exists between learning B and extreme shifts in credence toward S. Thus, the argument doesn't generalize absurdly because only conditionals are subjected to this specific constraint on how credence responds to learning the consequent.

  Now, regarding your first additional concern: the move from current credences to counterfactual credences in steps 6 and 7 relies crucially on the scope of step 3. Step 3 asserts that P(C) = P(B|A) holds for every rational credence function the agent might have. This includes not just her current credences but those she would have after conditionalizing on new evidence, provided the conditional probability remains defined (i.e., P(A) > 0). So step 3 already implies that the equation holds in counterfactual credence states. The key limitation is that when we consider learning B or ¬B, we must ensure P(A) > 0 remains true in those counterfactual states for P(B|A) to be defined. If learning B or ¬B would make P(A) = 0 (e.g., if A implies ¬B), the counterfactual application fails. Lewis avoids this by restricting to A and B where the relevant conditional probabilities are defined throughout, but your reconstruction doesn't explicitly state this. This is a candidate culprit: if learning B or ¬B could reduce P(A) to 0, steps 6 and 7 might not hold. However, for many A and B (e.g., logically independent ones), this won't occur, so the problem persists broadly enough to sustain the triviality result.

  Your second concern about step 8 is telling. If P(C) = P(B) and P(C) = P(B|A), then indeed P(B|A) = P(B), and asserting "if A, B" would commit you to the same credence in B as in the conditional. But intuitively, asserting "if the butler did it, the gardener was in on it" does not commit you to asserting that the gardener was in on it. This clash suggests a flaw in the argument. Crucially, step 8 follows from steps 5–7, which depend on the strong claims in steps 6 and 7. Those steps assume that learning ¬B forces rejection of C. Yet this feels counterintuitive: if I learn the gardener wasn't in on it, I don't necessarily reject "if the butler did it, the gardener was in on it"; I might instead reject that the butler did it. This intuition points to a deeper issue: conditioning on ¬B may undermine the presupposition or context for evaluating the conditional, particularly if A and ¬B are incompatible. Steps 6 and 7 override this subtlety by fiat.

  Forced to reject a single step, I would reject step 2: that the degree of acceptance corresponds to credence in a proposition. Denying this preserves Adams's Thesis (step 1) by treating the conditional as a non-propositional item (e.g., a conditional assertion or a suppositional attitude). The cost is significant: it complicates semantics for embedded conditionals (e.g., "if A, then if B, C") and requires rethinking logic for arguments involving conditionals. But it avoids triviality and aligns with the intuition that conditionals aren't truth-evaluable in the same way as categorical statements. Alternatives have higher costs. Denying step 1 (Adams's Thesis) abandons the best-evidenced principle about conditionals in the empirical literature on reasoning and probability. Restricting step 3 to a limited class of credence functions (e.g., only those with P(A) > 0 or avoiding "incompatible" evidence) feels ad hoc and may not fully block the result, as Lewis showed with more sophisticated partitions. Replacing the conditional with a different semantic entity (e.g., a three-valued logic) often violates Adams's Thesis or intuitive inferences.

  The core error in your generalization lies in assuming that the partition {B, ¬B} is appropriate for any C. For conditionals, C (if it exists) is not straightforwardly about B alone; its truth likely depends on the A→B connection. Steps 6 and 7 effectively treat C as if it were materially equivalent to B, but this is what the argument later "proves," and it's question-begging. Only because conditionals are forced into this probabilistic straitjacket does the result follow. For ordinary propositions, no such constraints apply to P(S|B) and P(S|¬B), so the collapse doesn't occur. Thus, Lewis's argument survives your worry, but at the price of exposing how violently a propositional view must distort our intuitive handling of conditionals under learning.

