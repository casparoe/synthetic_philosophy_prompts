  I am drafting the specification for a thesis chapter on material constitution — in effect, the requirements list that any theory of how an artefact relates to the matter it is made of must satisfy before it is worth arguing about. Please set out each requirement together with the case or consideration that motivates it: the apparent modal mismatch (the statue is destroyed by being squashed into a disc, the clay is not), the pressure Leibniz's Law exerts on any account that denies identity, the demand that a difference in persistence conditions between two things in one place at one time be grounded in some non-modal fact rather than merely restated, the objection that coincidence realism multiplies undetectable entities beyond necessity, the counting problem and whether sortal-relativity resolves it or merely relocates it, diachronic cases of gradual replacement, division and borderline identity, artefacts whose spatial boundaries are vague, the relation between a living organism and the body it constitutes, and what makes our ordinary demonstrative and sortal references determinate between coinciding candidates. State for each whether it is non-negotiable or the local prejudice of one camp, identify any subset that cannot be jointly satisfied — that is the part I most want to see — and name the single requirement that eliminates the greatest number of contenders. Conclude with a few sentences scoring the main extensionalist, eliminativist, coincidence-realist, relativist and four-dimensionalist responses against the list. Write the answer in British English.
