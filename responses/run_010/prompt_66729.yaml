  - B: "The two sides of this Triangle are things that are equal to the same."
  - Z: "The two sides of this Triangle are equal to each other."

  The Tortoise agrees to A and B, but refuses to accept Z until Achilles writes down the conditional: 
  - C: "If A and B are true, then Z must be true."

  But then the Tortoise accepts A, B, and C, but still not Z, requiring a new premise:
  - D: "If A, B, and C are true, then Z must be true."

  And so on, ad infinitum.

