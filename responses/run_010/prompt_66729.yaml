  The Tortoise is not refusing to accept premises; they are happy to accept any premise. But they are not drawing the inference. So the Tortoise player should be instructed: "You are to accept any premise that Achilles asks you to write on the sheet. You believe everything on the sheet is true. However, you do not draw any inferences from these premises. You will only say Z if it is written on the sheet and you are reading it aloud. But note: you will never write Z on the sheet yourself, and Achilles is not allowed to tell you to write Z. Therefore, you will not say Z during the game."

  So the Tortoise is cheerful and cooperative in writing premises, but they never volunteer Z.

  ### The Sheet Contents
  The sheet has 8 lines: 
     Line 1: A: "Things that are equal to the same are equal to each other."
     Line 2: B: "The two sides of this Triangle are things that are equal to the same."
     Lines 3-8: [Empty]

  ### Timeline for the 90-minute session
  1. (5 min) Introduction: Explain the activity and the roles. Distribute sheets.
  2. (5 min) Read the dialogue excerpt to set the scene.
  3. (15 min) First round: Pairs try to get the Tortoise to say Z. They will likely write conditionals and run out of moves.
  4. (5 min) Pause and ask if any pair succeeded? (None should have.) Ask what they tried.
  5. (10 min) Second round: Allow pairs to try adding an inference rule as a premise. For example, they might write: "Rule: If you have 'If P then Q' and P, then you can write Q." But then what? The Tortoise won't do anything with it because there's no built-in rule to apply it. They are still stuck.
  6. (15 min) Group discussion: What happened? Why couldn't they force the Tortoise to say Z?
  7. (30 min) Debrief: Map the experience to the philosophical problem. (Detailed below.)
  8. (5 min) Wrap-up and collect sheets.

  ### Debrief
  - **What happened in the game?**
     Students tried to add premises, typically conditionals like "If A and B, then Z". But the Tortoise did not say Z. They might have added more conditionals (like in the dialogue) and run out of moves. When they tried to add a rule, it didn't help because the rule was just another premise.

  - **Mapping to the philosophical problem**:
     - The Tortoise represents someone who accepts all the premises but does not accept that they entail the conclusion unless that entailment is itself a premise. But then that premise needs to be connected to the inference, which requires another premise, ad infinitum.
     - The game shows that we cannot force the inference by adding more premises because we run out of resources (here, lines on the sheet), and even if we had more, it would go on forever.
     - The key point: Inference cannot be reduced to another premise. There must be something else: an act of understanding or a rule that is applied, not merely stated.

  - **What the game can't reproduce**:
     - In live play, it feels like a standoff of wills. The real worry is whether taking the premises to support the conclusion could even be one more step among the premises. The game shows that adding the step doesn't help, but it doesn't fully capture that the issue is about the act of inference itself. In the game, the Tortoise is being stubborn by not applying modus ponens, but in the philosophical problem, the Tortoise is pointing out that modus ponens itself would have to be a premise, which doesn't solve the problem. The debrief must explain that the problem is about the justification of inference: can the rule of inference be justified by another premise, or is it primitive?

  - **The Upshot**:
     - **Basically settled**: The regress argument shows that inference cannot be reduced to the acceptance of premises alone. There must be a capacity to recognize the force of the premises that is not itself another premise. This capacity is often called "taking" the premises to support the conclusion, and it is not a piece of knowledge that can be written down.
     - **What is still argued about**: 
          - Some philosophers (like Wittgensteinians) might say that this shows that following a rule is a practice, not a matter of having more premises.
          - Others might try to avoid the regress by positing a foundational rule of inference that does not require justification.
          - There is also debate about whether the regress is a genuine problem for logical reasoning or only for psychological accounts of reasoning.

  ### Rules for the Tortoise Player
  To keep the Tortoise from being simply obstinate (like refusing to write premises), we instruct the Tortoise player: 
     - "You are a cooperative and willing participant. You will write down any declarative sentence that Achilles asks you to write on the next available line, and you will accept it as true. However, you do not draw any inferences from the premises. You will only say Z if it appears on the sheet and you are reading it aloud. But note: you will never write Z on the sheet of your own accord, and Achilles is not allowed to tell you to write Z. Therefore, you will not say Z during the game."

  This makes the Tortoise's behavior clear: they are not refusing premises, but they are not making any leaps.

  ### Additional Note
  The game might feel artificial because in real life we do make inferences. The debrief should emphasize that the point is to question what it is to make an inference and whether it can be fully captured by adding more premises.

  ### Final Sheet Contents
  **Handout for Each Pair**

  ```
                Achilles and the Tortoise Game Sheet

  Premises (already accepted by the Tortoise):

  1. A: Things that are equal to the same are equal to each other.
  2. B: The two sides of this Triangle are things that are equal to the same.

  Goal: Get the Tortoise to say: "Z: The two sides of this Triangle are equal to each other."

  You (Achilles) may direct the Tortoise to write up to 6 new premises. The Tortoise will write them and accept them as true.

  New premises (to be written by the Tortoise as directed by Achilles):

  3. _________________________________________________________
  4. _________________________________________________________
  5. _________________________________________________________
  6. _________________________________________________________
  7. _________________________________________________________
  8. _________________________________________________________

  Rules of the game:
  - Achilles cannot write on the sheet; they must direct the Tortoise to write.
  - The Tortoise will only write what Achilles directs for lines 3-8.
  - The Tortoise will only say Z if it is written on the sheet and they are reading it.
  - The Tortoise will not write Z unless it is in response to a rule of the game (but there is no such rule that forces it).
  - You have 15 minutes.
  ```

  In practice, the Tortoise will not write Z because there is no rule that forces them to. The game is designed for Achilles to fail, and that failure is the teaching moment.
answer: |-
  ### **In-Class Game: Achilles and the Tortoise**  
  **Designed for a 90-minute seminar with 14 undergrads (7 pairs)**  

  ---

  ### **1. Sheet Contents**  
  **Shared Sheet for Each Pair**  
  *(Pre-written premises)*:  
  1. **A**: Things that are equal to the same are equal to each other.  
  2. **B**: The two sides of this Triangle are things that are equal to the same.  
  *(Blank lines for additions)*:  
  3\. \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_  
  4\. \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_  
  5\. \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_  
  6\. \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_  
  7\. \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_  
  8\. \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_  

  **Conclusion** (Only stated verbally by the Tortoise if "forced"):  
  **Z**: The two sides of this Triangle are equal to each other.  

  ---

  ### **2. Rules**  
  #### **For Achilles**:  
  - **Goal**: Get the Tortoise to **verbally state Z** by adding premises/rules to the sheet.  
  - **Constraints**:  
    - Only **6 lines** (3–8) can be added.  
    - Each line must be a **declarative sentence** (e.g., "If A and B, then Z").  
    - Cannot write **Z** on the sheet or say it aloud.  
    - **15-minute time limit**.  

  #### **For the Tortoise**:  
  - **Behavior**:  
    - **Cheerfully accept every premise added** to the sheet (write it immediately when directed).  
    - **Never state Z voluntarily**—only if "logically forced" by the *game’s built-in rules* (see below).  
  - **When to state Z**:  
    - **Only if** the sheet contains:  
      (a) A conditional premise linking other premises to Z (e.g., "If A and B, then Z").  
      (b) **All antecedents** of that conditional are on the sheet.  
      (c) **No objections remain** (see "Tortoise Mechanism" below).  
  - **Key**: The Tortoise **does not apply inference rules automatically**—they treat *all* lines as passive premises.  

  #### **Tortoise Mechanism to Prevent Stonewalling**:  
  To ensure the Tortoise is **cooperative yet never infers Z**:  
  - **Step 1**: Tortoise accepts every added line as a "true belief."  
  - **Step 2**: When Achilles claims Z follows, Tortoise **raises an "objection"**:  
    > *"I accept everything on the sheet! But why must I accept Z? You haven’t given me a rule that forces me to bridge these premises to Z."*  
  - **Step 3**: Tortoise **only states Z** if Achilles’ additions satisfy the **built-in modus ponens rule of the game** (see below).  
  - **Why this works**: The Tortoise isn’t stubborn—they’re genuinely confused about how "accepting premises" translates to "drawing a conclusion." This forces Achilles to confront the regress.  

  #### **Built-In Game Rule (Hidden from Students)**:  
  - **Modus Ponens (MP) is the only inference rule**.  
  - **How MP works**:  
    - *If* the sheet has a line "If P, then Z" *and* all parts of P are on the sheet,  
    - *Then* the Tortoise **must state Z**.  
  - **Crucially**: MP **cannot be added to the sheet**—it’s an external rule. If students try to add MP as a premise (e.g., "MP is valid"), it’s treated as a belief, *not* an active rule.  

  ---

  ### **3. Timeline (90 Minutes)**  
  | Time      | Activity                                                                 | Instructor Role                          |  
  |-----------|--------------------------------------------------------------------------|------------------------------------------|  
  | 0–10 min  | **Intro**: Explain Carroll’s dialogue, roles, rules, and goals.         | Clarify rules; assign pairs.             |  
  | 10–25 min | **Round 1**: Pairs attempt to force Z using premises only (6 lines max). | Circulate; remind Tortoises to raise objections. |  
  | 25–35 min | **Pause & Poll**: Ask pairs, "Did you get Z? What failed?"               | Highlight that added conditionals didn’t force Z. |  
  | 35–50 min | **Round 2**: Pairs try adding an *inference rule* (e.g., "If A and B, then Z implies Z"). | Note if they try MP; let them hit the same wall. |  
  | 50–70 min | **Debrief Discussion**: Groups report struggles. Map to Carroll’s regress. | Guide connections to philosophy (see below). |  
  | 70–90 min | **Philosophical Debrief**: Formal summary + open debate.                | Distinguish settled/contested issues.    |  

  ---

  ### **4. Debrief: Mapping Game to Philosophy**  
  #### **What Happened in the Game**:  
  - **Premise-Only Strategy (Round 1)**:  
    Achilles adds conditionals (e.g., Line 3: "If A and B, then Z").  
    Tortoise accepts them but won’t state Z—they demand a rule to *use* the conditional.  
    **Result**: Teams exhaust lines without progress.  

  - **Rule-As-Premise Strategy (Round 2)**:  
    Achilles adds "rules" (e.g., Line 4: "If you have ‘If P, then Q’ and P, then you must accept Q").  
    Tortoise treats it as a *belief*, not an active rule. They object: *"Why should this string of words force me to do anything?"*  
    **Result**: MP must be *applied*, not just stated. Adding it as a premise changes nothing.  

  #### **The Philosophical Problem**:  
  - **The Bind**: Inference requires **rules** (like MP) to move from premises to conclusions. But if rules are *themselves* premises, you need a meta-rule to use them → infinite regress.  
  - **What the Game Captures**:  
    - Premises alone *cannot* force inference—you hit a "wall" (here, the line limit).  
    - Rules ≠ premises: Stating MP on the sheet doesn’t help—it must be *applied from outside*.  
  - **What the Game *Can’t* Reproduce** (Must Explain in Debrief):  
    - **Live Play Feels Like Willpower**: In class, Tortoises seem to "resist" drawing conclusions. But Carroll’s point is deeper: **No set of premises can compel inference**—even with infinite lines, regress persists. The debrief must clarify:  
      > *"This isn’t about stubbornness—it’s about whether ‘supporting a conclusion’ could ever be one more premise. The game’s ‘built-in MP’ simulates that inference is an act we perform, not a fact we state."*  

  #### **The Upshot: Settled vs. Contested**  
  | **Settled**                                                                 | **Still Contested**                                                                 |  
  |-----------------------------------------------------------------------------|------------------------------------------------------------------------------------|  
  | Inference requires **rules** (like MP) that *cannot* be reduced to premises. | **What rules are primitive?** (MP? Universal instantiation? Something else?)       |  
  | The regress shows logical reasoning **isn’t "premise management"**—it needs an agent’s capacity to *apply* rules. | **Is this a psychological or normative problem?** (Do we *describe* how humans infer or *prescribe* how they *should*?) |  
  | Carroll’s moral: **Rules are norms we follow**, not propositions we believe. | **How do rules gain authority?** Practice? Biology? Social agreement?              |  

  ---

  ### **5. Why This Works**  
  - **Tortoises Avoid Stonewalling** via the "objection" mechanism: They’re curious, not defiant.  
  - **Achilles Hits the Wall**: The 6-line limit forces urgency and mirrors the regress’s impracticality.  
  - **Debrief Bridges Experience/Theory**: Students *feel* the futility of adding premises → grasps why Carroll’s puzzle isn’t just "clever."  

  ### **Limitations**  
  - **Live Play vs. Philosophy**: The game emphasizes a "standoff" (Achilles vs. Tortoise), but Carroll’s worry is ontological: Inference *cannot* be another step. The debrief must reframe the stalemate as a **structural flaw in reducing logic to premises**.  
  - **MP as "Built-In" Sidesteps Regress**: In the game, MP is imposed externally—this avoids infinite regress but may obscure Carroll’s point that *no* rule escapes the problem. Stress in debrief: *"MP is a tool we bring to premises, but Carroll asks: Why trust MP? That’s where the real regress begins."*  

  ### **Materials**  
  - Print 7 sheets (one per pair).  
  - Timer for 15-minute rounds.  
  - Whiteboard for debrief diagram:  
    ```  
    Premises (A, B) → Added Conditionals (C, D...) → Rules as Premises → (STUCK!)  
    ↓  
    Requires EXTERNAL RULE (MP) → Z  
    ```  

  This structure ensures students confront the regress viscerally, setting up a rich debate on logic’s foundations.
