prompt: |-
  I work in public-sector integrity — desk reviews and field visits to municipal licensing and works offices, in two quite different countries — and I am drafting an internal methods paper about a pattern my colleagues and I can only describe with hand-waving phrases like "the office has gone relational" or "it runs on who you know now." I have been unable to find a term in the political science or the ethics-of-corruption literature that fits it, and the terms I do know all seem to be adjacent without being it, so I would like to know whether an established concept exists, and if not, how the thing should be carved.

  Two typical instances. A business-licensing clerk works under a written rule providing that applications are handled in order of receipt, subject to an explicit discretionary clause permitting expedited handling in documented hardship or public-interest cases. Over five years she invokes the clause several hundred times; each invocation is properly documented, the hardship is genuine in each case, and no one could identify a rule she broke. But nearly every expedited file belongs to someone inside her personal network — former classmates, relatives of the men who carried her father's coffin, shopkeepers who have lent her brother money — and the cumulative effect on the queue is that a person with no connection to her can no longer realistically expect a licence. She takes no cash and her own material position does not change; what she accumulates is a stock of owed favours, which she then spends on her family. The same shape appears in a district works department: an engineer reprioritises road resurfacing under a clause permitting him to do so on safety grounds, every reprioritisation is defensible in isolation and no safety rationale in his memos is ever successfully challenged, yet after three years the map of resurfaced roads is legible as a map of his obligations.

  Three features seem to defeat the labels I have run across, and I want you to take them seriously rather than wave them away. First, nothing unlawful occurs at the act level and nothing lawful occurs at the aggregate level, so definitions built on rule-breaking and definitions built on lawfulness both misfire. Second, the payoff is relational rather than pecuniary or status-conferring: an unspent balance of obligations, which is reinvested rather than consumed, and I do not know whether that counts as private gain at all. Third, there is no discrete decision to be partial — the partiality is assembled from individually legitimate exceptions, so no moment exists at which anyone chose to run a particularist office. Given that, please tell me: (1) whether an established concept covers this, and if one comes close, where exactly the fit breaks; (2) a ranked list of the three nearest concepts — clientelism, patronage, nepotism, state capture, conflict of interest, "institutional" or "legal" corruption, and the norm-erosion idea from the democratic-backsliding literature are the candidates I have, but you may propose others — and for each, whether it requires money, requires a discrete act rather than an aggregate, or requires an explicit bargain, since my cases seem to lack all three; (3) if you judge that nothing covers it, a coined term with a definition, the conditions an instance must satisfy, and two or three boundary cases that resemble it but fall outside — for example a clerk who expedites for co-ethnics to whom she owes nothing personally, a clerk who takes a single cash payment for a single expediting, or a clerk whose network is genuinely open to anyone who will later return the favour; (4) an observable signature, something a reviewer with the case files and the queue data could measure that would distinguish this office from one that is merely generous with its discretionary clause and impartial about whom it is generous to; and (5) whether your verdict changes depending on whether corruption is understood as deviation from the formal duties of a public office for private-regarding gain, or as deviation from the norms actually operative in that office — because in my cases the operative norms have drifted, and the two definitions then disagree, which is also why I want to know whether any term for this can be stated without silently taking the audit mission's side against the neighbourhood's. Please finish with one line beginning "Verdict:" containing either the established term you think covers this or your coined term, as a short phrase and nothing else.
reasoning: |-
  Okay, the user works in public-sector integrity and is trying to define a specific pattern they've observed in municipal offices. They describe situations where officials use discretionary clauses legitimately but consistently favor their personal networks, accumulating social capital rather than money. They need a term for this phenomenon and a way to formally identify it.

  First, I need to understand the core issue. The user mentions three key features: no individual unlawful acts, relational payoffs (favors), and no explicit decision to be partial. This seems to operate in a gray area where each action is defensible but the cumulative effect is biased. 

  Looking at existing concepts: 
  - Clientelism usually involves quid-pro-quo exchanges, often with political patrons. Here, it's personal networks without immediate reciprocation. 
  - Patronage is about appointments, not discretionary decisions. 
  - Nepotism is explicit family favoritism, but this includes broader networks. 
  - Institutional corruption focuses on systemic influences, not individual favor networks. 
  - Conflict of interest requires a direct interest, but here the clerk might not have a stake in the outcome beyond social capital. 

  None fit perfectly because they miss the aggregation of legitimate exceptions and the relational payoff without explicit bargains. 

  The user also wants measurable signatures. Observing the network effect seems crucial. If expedited cases overwhelmingly cluster within a closed network, that's a red flag. Comparing the distribution to a random model could help. Also, tracking if favors flow both ways over time would indicate an economy of obligations.

  For coining a term, "Discretionary Network Capture" emphasizes the misuse of discretionary power to serve a closed network. "Relational Drift" highlights the gradual shift in norms. "Favor-Trapping" captures the accumulation of obligations. 

  The definition of corruption matters. If using the formal duties definition, this is corrupt because it deviates for private gain (social capital). But if norms have shifted, locals might see it as normal. The term should acknowledge both perspectives, perhaps by focusing on the outcome rather than intent.

  Boundary cases: 
  - Favoring co-ethnics without personal ties falls under nepotism or discrimination. 
  - Taking cash is bribery. 
  - An open network where anyone can join is just efficient networking, not capture.

  Observable signatures: 
  1. High rate of discretionary exceptions clustered in a closed network. 
  2. Biased outcomes despite procedural correctness. 
  3. Reciprocated favors over time within the network.

  Verdict: Discretionary Network Capture. This term captures the essence without assuming illegality, focusing on the systemic bias emerging from aggregated legitimate actions.
answer: |-
  Based on your detailed description and constraints, here is a systematic analysis:

  ### (1) Established Concept & Fit Breakdown
  No established term in mainstream political science or corruption literature fully captures this phenomenon. The closest is **"institutional corruption" (Lessig, 2013)**, but its fit breaks in two places:  
  - It focuses on systemic dependence on improper influences (e.g., campaign finance), not *relational* economies within bureaucracies.  
  - It typically assumes institutional complicity, whereas your cases show individually compliant acts creating emergent distortion.  

  **Other near-misses**:  
  - **Clientelism**: Requires a *quid-pro-quo hierarchy* (patron-broker-client), not horizontal favor-trading.  
  - **Patronage**: Concerns appointments/resources exchanged for political support, not discretionary rule-exercises.  
  - **Nepotism**: Explicitly prioritizes kin; your cases include non-kin networks.  
  - **State capture**: Involves elites rewriting rules, not rule-compliant micro-decisions.  

  ### (2) Ranked Nearest Concepts (Evaluated Against Your Criteria)  
  | Concept          | Requires Money? | Requires Discrete Act? | Requires Explicit Bargain? | Why It Fails |  
  |------------------|-----------------|------------------------|----------------------------|-------------|  
  | **1. Clientelism** | No              | Yes (vote/gift exchange)| Yes (implicit pact)        | Your cases lack hierarchical reciprocity; favors are diffuse/deferred |  
  | **2. Institutional Corruption** | No | No (systemic) | No | Too broad; doesn't specify *relational* payoff or aggregation of exceptions |  
  | **3. Conflict of Interest** | No | Yes (per decision) | No | No *direct* interest exists at the decision moment; interest emerges from network position |  

  ### (3) Coined Term & Definition  
  **Term**: **Discretionary Network Capture (DNC)**  
  **Definition**: *The systemic distortion of public service delivery through the aggregated exercise of formally legitimate discretionary exceptions, selectively benefiting a closed personal network to cultivate relational capital (obligations/favors), resulting in de facto exclusion of outsiders.*  

  **Boundary Cases (Outside DNC)**:  
  - **Co-ethnic favoritism without personal debt**: Excluded if network isn't *obligation-based* (e.g., expediting for strangers from one's ethnic group). This is tribalism, not relational capture.  
  - **Single cash-for-favor transaction**: Excluded as simple bribery (discrete illicit exchange).  
  - **Open-network reciprocity**: Excluded if anyone can access favors by future repayment (e.g., a clerk expedites for anyone who signs a "favor IOU"). This resembles a market, not capture.  

  ### (4) Observable Signatures  
  A reviewer could detect DNC by measuring:  
  - **Network Clustering Coefficient**: >80% of discretionary exceptions benefit individuals within 2 degrees of separation from the official (vs. random distribution).  
  - **Reciprocity Imbalance**: >70% of beneficiaries are "creditors" (e.g., lent money, past favors) or "debtors" (repaying obligations) to the official, verified through interviews/social mapping.  
  - **Queue Displacement Index**: Significant delay (e.g., >30% longer wait times) for unconnected applicants versus pre-drift baselines, unexplained by workload changes.  

  ### (5) Definitional Dependency  
  - **Formal-duty deviation view**: DNC *is* corruption (private relational gain subverts impartiality).  
  - **Operative-norms view**: DNC may *not* be corruption if local norms accept favor-networks (e.g., "helping kin is ethical").  
  **Resolution**: The term **DNC** avoids moral loading by focusing on *mechanism* (network capture via discretion) rather than intent. It acknowledges formal/operative norm misalignment by centering the *outcome* (exclusion via aggregated exceptions).  

  ### Verdict: Discretionary Network Capture
