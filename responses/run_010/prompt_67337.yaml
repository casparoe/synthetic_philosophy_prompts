prompt: |-
  I teach a graduate seminar on what a theory of distributive justice is supposed to equalise, and this year I intend to fix the success conditions before anyone reads a candidate theory. The seminar reliably degenerates into a contest in which each camp quietly supplies its own criteria: the welfarist is faulted for not tracking functionings, the capability theorist is faulted for not tracking preferences, and neither criticism bites, because nothing has been agreed in advance about what would count as getting the matter right. What I want from you, therefore, is the standard itself — the specification a currency of justice must satisfy to be adequate — with the reasoning behind each requirement.

  The specification must serve two purposes at once, and you should say so plainly if they pull against one another. First, it must be usable as the target variable for a public agency of ordinary administrative capacity, distributing a fixed sum across a heterogeneous population within a budget cycle, without intrusive enquiry into citizens' inner states. Second, it must be something one could read aloud, without embarrassment, to the people it ranks as worse off; a metric whose routine output is a published statement of deficiency has to answer for that. If the two cannot both be honoured, tell me which takes priority and on what grounds.

  I have drafted seven candidate requirements. Treat them as raw material rather than as given: assess each, restate it at whatever level of generality you judge correct, and say whether it is a genuine desideratum or a partisan import dressed in neutral clothing.

  (i) The clerk condition: a competent official must be able to assign the currency to a person from records, without that person's testimony about their own states being either necessary or advantageous to offer.
  (ii) The endorsement condition: a person counts as better off on the currency only where they could recognise the relevant good as theirs; a metric satisfiable behind someone's back is measuring something other than their standing.
  (iii) The authorship condition: the metric must separate what a person has done from what has been done to them, without either rewarding or penalising them for the shape of their own earlier self.
  (iv) The standing condition: the metric must not, in the ordinary course of its outputs, describe an identifiable group as constitutionally deficient in a way that licenses others to intervene in their make-up.
  (v) The trajectory condition: the metric must be able to rank lives across time and not merely moments, since two people identical today may face very different declines.
  (vi) The sphere condition: the metric must say which goods may not be alienated for money — votes, organs, school places, development rights — and explain why the objection is not mere squeamishness.
  (vii) The testimony condition: the metric must distinguish adaptation that has corroded a person's sense of what is available to them from a cultivated economy of desire that is genuinely a good way to live.

  Three cases I keep returning to, so that you can see the sort of thing the list has to adjudicate. Callista and Tobias have identical incomes and identical native endowments. Callista spent a decade cultivating a practice — historical keyboard performance — whose continuation now requires expenditure she cannot meet; Tobias needs a costly supplement he detests and would rather receive as cash. A metric that calls the two equally well off is blind to something, yet a metric that tops Callista up rewards her own prior self-formation, and Tobias, who endorses nothing about his bundle, is precisely the one who will insist on the money. In a certain valley, a signing community has flourished for four generations: on any metric keyed to capacities it scores badly along one dimension, on any metric keyed to its own endorsed life it is doing very well indeed, and the intervention the first ranking recommends is the one its members experience as an attempt to unmake them. And in a district whose factory closed thirty years ago, the older residents want little and report themselves content while the younger ones want a great deal and report themselves deprived. A distribution that takes the first report at face value looks like an injustice to the second group; but a metric that discounts all adaptation as distortion misdescribes the older residents, some of whom have found in a modest practice a satisfaction their better-off neighbours lack.

  Deliver, then:

  - The requirements list, each with the case or consideration that motivates it and a marking of whether it is non-negotiable or the preference of a particular camp. Revise my seven as you see fit, and add up to three you think I have omitted.
  - Any subset of the requirements you believe to be jointly unsatisfiable. If the list itself contains an impossibility, that is the most valuable part of the exercise: state the subset, give the argument in a few sentences, and name the requirement you would surrender to escape it.
  - Which single requirement does most of the work in excluding candidate theories, and which does least.
  - Which of my seven drafts is the weakest, and why.
  - Finally, briefly — a few sentences each and no more — how welfarism, resourcism, the capabilities approach, and a relational view that denies the whole project of specifying a currency fare against your list. Keep this short; the scoring is not the point, and I shall do it in class.

  I am not asking for references, a reading list, or attributions of any of this to particular authors. I want the specification argued for, not footnoted. A numbered list or table is welcome wherever it helps.

  Close with a single line in exactly this form:

  \answer{MOST_EXCLUSIONARY: <label> | UNSATISFIABLE: <comma-separated labels, or NONE> | WEAKEST: <roman numeral of one of my seven drafts>}
reasoning: |-
  Hmm, I need to help this professor design a robust set of requirements for evaluating theories of distributive justice. They're frustrated with seminar discussions devolving into partisan battles because there's no agreed-upon success criteria beforehand. The requirements must serve two purposes simultaneously: administrative feasibility for public agencies and moral acceptability to those being measured. 

  The professor has drafted seven candidate requirements and three illustrative cases about Callista/Tobias, a signing community, and adapted preferences in a post-industrial town. They want me to critically assess each requirement, identify conflicts, and suggest improvements while adding up to three missing ones. The final output needs specific formatting with judgments about exclusionary power and unsatisfiable combinations.

  Let me analyze each requirement systematically:
  - The clerk condition makes sense pragmatically but needs tightening to exclude proxies that might reintroduce bias. 
  - The endorsement condition is crucial for legitimacy but requires careful phrasing to avoid subjectivity traps. 
  - The authorship condition raises deep philosophical questions about responsibility that might be too demanding for a baseline metric. 
  - The standing condition is non-negotiable for preventing stigmatization. 
  - The trajectory condition feels essential but operationally challenging - perhaps focus on foreseeable risks rather than full life narratives. 
  - The sphere condition is fundamentally important for defining the boundaries of commodification. 
  - The testimony condition seems theoretically significant but practically unworkable at scale.

  Key conflicts emerge between:
  - Clerk's need for objectivity vs. endorsement's reliance on subjective recognition
  - Trajectory's forward-looking assessment vs. authorship' resistance to penalizing past choices
  - Testimony's nuanced view of adaptation vs. administrative feasibility

  I should add requirements about:
  1) Non-comparability to prevent interpersonal utility judgments
  2) Measurability over time to track progress
  3) Agency preservation to respect autonomy

  The endorsement requirement will likely exclude the most theories (like strict resourcism), while authorship may be the weakest due to its contestable assumptions about responsibility. The signing community case best illustrates why standing must be non-negotiable - no metric should license erasing minority ways of life.

  For theories:
  - Welfarism fails clerk and standing tests
  - Resourcism struggles with endorsement and trajectory
  - Capabilities approach balances well but may have authorship issues
  - Relational views reject the entire currency framework

  The requirements can't all be perfectly satisfied simultaneously, particularly the trio of clerk, endorsement, and trajectory. If forced to choose, endorsement should yield because justice requires actionable standards even when imperfectly recognized.
answer: |-
  ### Revised Requirements for a Currency of Distributive Justice  

  **Core Purpose:** To provide a standard that is both administratively feasible (for public agencies) and morally defensible (to those assessed), prioritizing the latter when conflicts arise. Moral defensibility ensures the metric does not perpetuate injustice; feasibility ensures it can function.  

  ---

  #### **Revised Requirement List**  
  *(Revisions marked; motivations and status indicated)*  

  1. **Administrative Accessibility (revised from "Clerk Condition")**  
     - **Specification:** The currency must be assignable using objective, third-party-verifiable data (e.g., income, health records, asset ownership), without reliance on self-reported inner states.  
     - **Motivation:** Ensures scalability, prevents gaming, and respects privacy. Drawn from the Tobias case (cash preference) and public budget constraints.  
     - **Status:** **Non-negotiable** for feasibility. Weakens if extended to prohibit *all* proxies for inner states.  

  2. **Subjective Recognition (revised from "Endorsement Condition")**  
     - **Specification:** The currency must reflect goods that a person *could* reasonably affirm as valuable within their life context, even if not currently endorsed.  
     - **Motivation:** Avoids imposing alien values (e.g., the signing community’s rejection of capacity-based intervention). Moral priority: ranking someone as deficient without their possible buy-in is oppressive.  
     - **Status:** **Non-negotiable** for moral legitimacy.  

  3. **Responsibility Firewall (revised from "Authorship Condition")**  
     - **Specification:** The currency must distinguish disadvantage from chosen life paths (e.g., Callista’s keyboard investment), but *not* penalize/praise immutable traits or formative circumstances.  
     - **Motivation:** Balances fairness (Tobias’ cash demand) with anti-paternalism.  
     - **Status:** **Negotiable** (partisan: leans liberal-egalitarian). Overly restrictive if it forbids *all* consideration of choice.  

  4. **Anti-Stigmatization (revised from "Standing Condition")**  
     - **Specification:** The metric must not label groups as intrinsically inferior in ways that justify coercive "correction."  
     - **Motivation:** The signing community case: a capacity metric enabling forced assimilation violates their dignity.  
     - **Status:** **Non-negotiable**. Core to justice as non-oppression.  

  5. **Temporal Scope (revised from "Trajectory Condition")**  
     - **Specification:** The currency must incorporate foreseeable life-course risks (e.g., aging, unemployment) but need not rank entire lives.  
     - **Motivation:** Addresses intergenerational justice (older vs. younger in the factory town) without requiring speculative life-narratives.  
     - **Status:** **Non-negotiable** for accuracy.  

  6. **Inalienability Threshold (revised from "Sphere Condition")**  
     - **Specification:** The metric must identify goods whose commodification undermines fundamental equality (e.g., votes, essential organs). Justification: alienation would destroy the preconditions for fair cooperation.  
     - **Motivation:** Prevents markets from eroding the basis of justice itself.  
     - **Status:** **Non-negotiable**.  

  7. **Adaptation Sensitivity (revised from "Testimony Condition")**  
     - **Specification:** The currency must adjust for *structurally constrained* preferences (e.g., factory-town elders’ low expectations due to limited options), but not penalize cultivated contentment (e.g., deliberate frugality).  
     - **Motivation:** Avoids mistaking oppression-induced resignation for well-being (factory-town youth).  
     - **Status:** **Negotiable** (partisan: welfarist/capability-sensitive).  

  #### **Added Requirements**  
  8. **Non-Comparability Safeguard**  
     - **Specification:** The currency must not require interpersonal utility comparisons.  
     - **Motivation:** Administrative infeasibility and moral hazard (e.g., judging Tobias’ "detestation" vs. Callista’s passion).  
     - **Status:** **Non-negotiable** for feasibility.  

  9. **Dynamic Measurability**  
     - **Specification:** The metric must be trackable over time with consistent data.  
     - **Motivation:** Enables policy evaluation (e.g., trajectory shifts post-factory closure).  
     - **Status:** **Non-negotiable** for usability.  

  ---

  #### **Jointly Unsatisfiable Subset**  
  - **Conflict:** Administrative Accessibility (1), Subjective Recognition (2), and Adaptation Sensitivity (7).  
  - **Argument:** Accessibility demands objective data (1), but recognizing subjective affirmation (2) and adaptation effects (7) requires nuanced understanding of inner states—infeasible without testimony or intrusive methods.  
  - **Resolution:** Prioritize Accessibility (1) and Subjective Recognition (2); weaken Adaptation Sensitivity (7) to focus only on *objectively observable* constraints (e.g., documented lack of education/jobs). Moral defensibility (2) outweighs nuanced adaptation analysis.  

  ---

  #### **Exclusionary Power**  
  - **Most Exclusionary:** **Subjective Recognition (2)**. Excludes theories ignoring affirmation (e.g., **strict resourcism** dismisses endorsement; **classical utilitarianism** overrides it).  
  - **Least Exclusionary:** **Responsibility Firewall (3)**. Only excludes extreme paternalism or fatalism; most theories accept *some* responsibility distinction.  

  ---

  #### **Weakest Draft Requirement**  
  - **Authorship Condition (iii)**. Overly vague ("shape of their own earlier self") and philosophically contested. Risks either:  
    - *Too strong*: Invalidates all metrics (e.g., capabilities penalize unchosen disadvantages).  
    - *Too weak*: Permits ignoring choice (e.g., resourcism ignores Callista’s costly passion).  
    Revised as Responsibility Firewall to focus on disadvantage/choice separation.  

  ---

  #### **Theory Assessments (Brief)**  
  - **Welfarism:** Fails Accessibility (inner states), Anti-Stigmatization (labels "irrational" preferences), and Inalienability (commodifies all goods). Strong on Adaptation Sensitivity.  
  - **Resourcism:** Passes Accessibility and Anti-Stigmatization. Fails Subjective Recognition (Tobias’ bundle rejection) and Temporal Scope (ignores future risks).  
  - **Capabilities:** Balances Subjective Recognition (capabilities as freedom) and Anti-Stigmatization. Fails Accessibility (hard to measure without testimony) and Responsibility Firewall (choice-sensitivity issues).  
  - **Relational Egalitarianism:** Rejects currency specification; focuses on power relations. Avoids all metric pitfalls but offers no distributive guidance—fails Administrative Accessibility and Dynamic Measurability.  

  ---

  \answer{MOST_EXCLUSIONARY: 2 | UNSATISFIABLE: 1,2,7 | WEAKEST: iii}
