prompt: |-
  I'm setting the final for a senior seminar on individual responsibility for collective harm — climate, consumption, voting, that cluster. It's 2.5 hours with two questions, so this one gets about 70 minutes and is worth 25 marks. I've got the skeleton of a question built around a made-up case with actual numbers in it, and I want help turning it into something exam-ready plus a model answer and a marking scheme.

  The case, as I have it in my head. Tighten the wording however you like but keep the numbers — the numbers are the whole point:

  A coastal fishery sells a cheap white fish, $9 a portion, through supermarkets. Retailers place around 3 million orders a season, from a customer base of about 250,000 households, so each household orders maybe a dozen times over the season. The boats operate under a rule: they run the sustainable season only, unless cumulative retail orders pass 3 million, in which case they add a second bottom-trawling season that destroys the breeding stock for good. The damage from that second season is roughly $2 billion — a food source and the economy built on it, gone permanently, and borne largely by people who never bought the fish.

  Two versions of the same season:
  - Version A: expected total orders = 3.4 million, standard deviation about 20,000 (the aggregate is noisy — weather, a competitor's promotion, whatever).
  - Version B: expected total orders = 3.0 million, same spread.

  Here's what I want students to land on, and why the case has arithmetic in it at all. In Version B, the chance that any given order is the pivotal one — the one that moves the count from exactly 3 million to 3,000,001 — is about 1 in 50,000; you can just stipulate that figure for them, it's the density of the distribution at the threshold times one unit and I don't want anyone needing a probability course. Multiply by $2bn and a single $9 order carries roughly $40,000 of expected harm. In Version A the expected total sits twenty standard deviations past the threshold, so the pivotal probability is zero for any practical purpose and the expected harm of an order is zero. Same act, same harm function, same crowd — and an expected-harm account says the order is grotesquely wrong in B and completely fine in A.

  The question should make them: (1) actually do that multiplication and the A/B comparison, not gesture at it; (2) say what it shows about the standard expected-utility reply to the inefficacy objection, including the corollary I think is the real killer — the act comes out *permissible* in exactly the version where the disaster is certain, so permissibility tracks the location of a crowd rather than how bad things go; (3) handle the epistemic wrinkle, which I think is underappreciated: no diner can know the mean or the spread, so on this account permissibility depends on facts nobody can access, and it looks like it gives agents a reason not to read the mid-season sales report — is a moral theory allowed to make your duty depend on news you'd rather not get?; and (4) say whether the non-causal alternatives do better or just relocate the problem. By (4) I mean complicity-style views and membership or joinability views, where wrongness comes from taking part in a practice rather than from contributing to the harm. I want them pressed hard on the discrimination worry: if participation is doing the work, why isn't buying electricity or a bus ticket in a modern economy exactly as wrong as the fish, and what would it take to answer that without collapsing back into consequences.

  They'll have seen the usual material in class — Parfit's harmless torturers, the sorites-style each-drop arguments, the voting version of the same problem. The question must not be answerable by reciting any of that, and I don't want them citing anything: the case is self-contained and everything they need is inside it. There also shouldn't be one right verdict. A student who argues the purchase is permissible in both versions, or wrong in both, should be able to get top marks if the argument is good.

  So, deliverables:

  1. The question as it would appear on the paper, case stated cleanly and compactly, with the Version B pivotal probability given to them as a stipulated figure rather than something to derive.
  2. A model answer of about 700 words.
  3. A marking scheme out of 25, built as five or six must-hit moves with marks apportioned, and for each move an explicit line on what a B answer does where an A answer does something else — I want to be able to hand this to a TA and get consistent grades.
  4. A short list of four or five wrong answers you'd realistically expect to see, e.g. treating Version A's certainty of collapse as making the act worse, or writing "small contributions add up" as if that were a reply to a threshold case, or concluding from the epistemic problem that morality must be subjective. For each, one line on where the mark ceiling is and what partial credit it can still pick up.
reasoning: |-
  Okay, let me tackle this professor's request systematically. They're designing a senior philosophy exam on collective harm dilemmas, specifically targeting how individual actions relate to large-scale consequences. The fishery case is brilliantly constructed to expose flaws in expected utility approaches - those numbers aren't just decorative but weaponized to show how moral permissibility absurdly hinges on statistical noise.

  First, I need to distill their vision into a tight exam question. The core tension lies in Version B where a $9 purchase carries $40k in expected harm due to pivotality, while in Version A the identical act is harmless because the threshold is already crossed. The professor wants students to grapple with four layered issues: the calculation itself, how it makes expected utility theory counterintuitive (wrong acts become permissible when harm is certain!), the epistemic nightmare where morality depends on unknowable statistics, and whether non-consequentialist alternatives like complicity theories fare any better.

  For the model answer, I'm structuring it to mirror the question's demands. Opening with the math is crucial - not as busywork but to force confrontation with the absurd $40k figure. Then I'll build the expected utility critique step by step, saving the deepest cut for last: that the theory blesses consumption precisely when disaster is guaranteed. The epistemic section should feel unsettling - imagine telling students morality requires willful ignorance! For part four, I'll pressure-test complicity theories by asking why buying this fish differs ethically from buying electricity in a carbon economy.

  The marking scheme needs surgical precision. Since each of the four sections carries distinct weight, I'm allocating points proportionally: 4 for nailing the math/comparison, 6 for dissecting expected utility, 5 for epistemic implications, 6 for evaluating alternatives, plus 4 for overall argument quality. For each criterion, I'll specify what separates B-grade work (e.g. just stating the probability difference) from A-grade (showing how it inverts permissibility).

  Anticipating common errors is key for grading consistency. Top of my list: students might think Version A is worse because harm is certain (missing the pivotality point), or retreat to "many drops cause floods" arguments (which threshold cases explicitly block). Others may cite Parfit without applying it to this case, or declare morality subjective when faced with epistemic problems. Each error caps marks at different levels - I'll note where partial credit survives, like grasping the calculation even if misapplying it.

  Throughout, I'm keeping the case self-contained as requested. No external citations, just pure application of the numbers to philosophical problems. And I'll emphasize that defending unconventional positions (wrong in both/permissible in both) can score highly if argued rigorously - this isn't about "right answers" but philosophical depth.
answer: |-
  Here’s the exam question, model answer, marking scheme, and common errors list tailored to your specifications.

  ---

  ### 1. Exam Question  
  **Individual Responsibility for Collective Harm (25 marks)**  
  **Time Allotment: 70 minutes**

  **Case:**  
  Coastal Fisheries sells $9 portions of white fish through supermarkets. Each season, retailers place ~3 million orders from ~250,000 households (avg. 12 orders/household). Boats operate under a rule:  
  - Run **only a sustainable season** if cumulative orders ≤ 3 million.  
  - If orders exceed 3 million, add a **destructive bottom-trawling season** that permanently destroys breeding stock.  
  The harm from the destructive season is **$2 billion** (lost food/economy), largely borne by non-consumers.  

  Consider two versions of a season:  
  - **Version A**: Expected orders = 3.4 million (SD = 20,000).  
  - **Version B**: Expected orders = 3.0 million (SD = 20,000).  

  **Stipulation**: In Version B, the probability that *any single order* is pivotal (i.e., pushes orders from 3M to 3,000,001) is **≈1/50,000**.  

  **Question**:  
  Using this case, analyze whether purchasing the fish is morally permissible in Version A versus Version B. Address:  
  (a) The **expected harm** of one purchase in each version (show calculations).  
  (b) What this implies for **expected-utility theories** addressing collective harm (e.g., does permissibility track harm or crowd behavior?).  
  (c) The **epistemic problem**: Permissibility hinges on unknown statistics (mean/SD). Does this undermine the theory?  
  (d) Whether **non-causal accounts** (e.g., complicity in harm-producing practices) better resolve the dilemma. Can they distinguish *this* purchase from buying electricity in a fossil-fuel economy?  

  ---

  ### 2. Model Answer (≈700 words)  

  **(a) Expected Harm Calculation**  
  - **Version B**: Pivotal probability = 1/50,000. Expected harm = (1/50,000) × $2B = **$40,000** per order.  
  - **Version A**: Expected orders (3.4M) are 20 SDs above the threshold (3M). Pivotal probability ≈ 0. Expected harm ≈ **$0**.  
  *Comparison*: Identical acts have wildly different expected harms: $40k (B) vs. $0 (A).  

  **(b) Implications for Expected Utility (EU) Theory**  
  EU theory judges acts by expected consequences. Here, purchasing is *grotesque* in B ($40k harm vs. $9 benefit) but *permissible* in A (no expected harm). This reveals two flaws:  
  1. **Perverse Permissibility**: The act is permissible in A *precisely when disaster is certain* (orders will hit 3.4M, ensuring collapse). Permissibility depends on *others’ expected actions*, not the act’s actual outcome.  
  2. **Misalignment with Harm**: In B, disaster is *uncertain* (mean=3M), yet buying is forbidden. EU prioritizes statistical pivotality over real-world impact—licensing harm when inevitable, banning it when contingent.  

  **(c) Epistemic Problem**  
  - Diners cannot know the true mean/SD (affected by weather, promotions, etc.). Thus, permissibility hinges on *inaccessible facts*. This creates perverse incentives:  
    - Agents might *avoid information* (e.g., sales reports) to preserve plausible deniability.  
    - Morality becomes "lottery-dependent," demanding agents act on unknowable probabilities.  
  If moral duties require actionable knowledge, EU fails: it demands omniscience for verdicts about everyday acts.  

  **(d) Non-Causal Accounts**  
  *Complicity/membership views* (e.g., Kutz) argue: "Participating in a harmful practice is wrong, regardless of individual causation."  
  - **Strengths**: Avoids pivotality puzzles. Buying fish is wrong in *both* versions as participation in a system risking $2B harm.  
  - **Weaknesses**:  
    - **Discrimination Problem**: If participation is key, why isn’t *any* consumption in harm-producing systems (e.g., fossil-fuel electricity) equally wrong? This view risks demanding total withdrawal from modern economies.  
    - **Relocating Thresholds**: Such accounts might distinguish practices by "reasonable avoidability" or "benefit proportionality." But electricity is often unavoidable, while fish is discretionary. This reintroduces consequentially tinged distinctions (e.g., "necessary" vs. "luxury" harms).  
  - **Verdict**: Non-causal views escape EU’s pivotality paradox but struggle to limit wrongness *without collapsing into consequences* (e.g., defining "harmful practice" by aggregate outcomes).  

  **Conclusion**: EU theories produce absurd verdicts (permissibility when harm is certain). Non-causal accounts avoid this but face overdemandingness or covert consequentialism. A defensible view must either reject pivotality (e.g., via strict participation norms) or accept that trivial acts *can* be catastrophic—but only under epistemically inaccessible conditions.  

  ---

  ### 3. Marking Scheme (25 Total)  

  | **Criterion**                                                                                                | **Marks** | **A-Grade Response (e.g.)**                                                                                              | **B-Grade Response (e.g.)**                                                                              |
  |--------------------------------------------------------------------------------------------------------------|-----------|--------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------|
  | **(a) Correct calculation/comparison** of expected harm for A/B. Must show $40k (B) vs. $0 (A).              | 0-4       | Explicit calc., notes 20 SDs → ≈0 harm in A.                                                                             | States $40k for B, $0 for A but no math/context.                                                         |
  | **(b) Critique of EU theory** (pivotal probability → perverse permissibility; crowd-dependence).            | 0-6       | Explains why act is wrong in B (high pivotality) but permissible in A (no pivotality + disaster certain).                | Identifies pivotality but misses that permissibility inversely tracks harm certainty.                    |
  | **(c) Epistemic problem analysis** (duties depend on unknowable facts; incentives for ignorance).           | 0-5       | Argues EU demands inaccessible knowledge, creating moral hazards (e.g., avoiding sales reports).                         | Notes uncertainty but doesn’t explore implications for agency or moral epistemology.                     |
  | **(d) Evaluation of non-causal accounts** (complicity/etc.). Addresses discrimination problem.              | 0-6       | Shows how they avoid pivotality but collapse into overdemandingness or covert consequentialism. Presses electricity case. | Describes complicity but doesn’t contrast with EU or handwaves discrimination problem.                  |
  | **Structure & Insight**: Logical flow; original synthesis (e.g., notes EU’s "perverse incentives").          | 0-4       | Draws connections between parts; offers nuanced verdict (e.g., "EU saves intuition in B but at high cost").              | Lists points disjointedly; minimal synthesis.                                                            |

  **Note**: Top marks for unconventional views (e.g., "wrong in both") if they engage all parts rigorously.  

  ---

  ### 4. Common Wrong Answers & Mark Ceilings  

  1. **"Version A is worse because harm is certain."**  
     - *Error*: Misreads the case. Harm is certain in A *regardless* of one purchase; in B, one purchase *can* cause it.  
     - **Ceiling**: 12/25 (fails parts b/c). Partial credit for calculations (a).  

  2. **"Small harms add up to big harms (like Parfit’s drops)."**  
     - *Error*: Ignores threshold structure. No "adding up" here; harm occurs iff threshold crossed.  
     - **Ceiling**: 10/25 (may get a/d if complicity discussed).  

  3. **"Morality is subjective if it depends on unknown facts."**  
     - *Error*: Conflates epistemic limits with anti-realism. Doesn’t engage theories.  
     - **Ceiling**: 8/25 (credit for c).  

  4. **"Buying is always wrong—slippery slope to collapse."**  
     - *Error*: Overgeneralizes. In A, collapse happens irrespective of one act.  
     - **Ceiling**: 15/25 (if defends well in d).  

  5. **"Focus on the system, not individuals."**  
     - *Error*: Evades the question’s focus on individual responsibility.  
     - **Ceiling**: 9/25 (credit for d if developed).  

  ---

  This design forces engagement with the threshold mechanics, exposes EU’s flaws, and pressures alternatives—while allowing top marks for rigorous heterodoxy. The numbers anchor the paradox, preventing generic answers.
