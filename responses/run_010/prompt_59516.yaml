  ### Design Notes: Principles and Numerical Choices

  **Core Principles for Payoff Selection:**
  1. **Distinct Candidate Solutions:** Ensure Nash product maximizer, Kalai-Smorodinsky (fractional-gains), equal gains, and utilitarian points are numerically distinct and computable with simple arithmetic. All coordinates are integers or halves to avoid calculators.
  2. **Pareto Frontier Control:** Round 1’s frontier must be convex and unchanged in Round 2 for the irrelevant alternative. The extra option in Round 2 must increase Player A’s maximum achievable payoff but be Pareto-dominated and unappealing.
  3. **Scale Invariance Test:** Round 3 applies an affine transformation to A’s payoffs to test whether agreements shift with the unit change.
  4. **Control Group Integrity:** Identical handouts for both groups, except the extra option is omitted for controls. Students cannot visually distinguish versions.
  5. **Behavioral Nuance:** Payoffs must create natural tension between fairness norms (e.g., equal gains vs. maximizing joint gains) and make the irrelevant alternative intuitively plausible.

  **Key Numerical Properties:**
  - **Disagreement Point:** Fixed at (4, 4) across all rounds (scaled for simplicity).
  - **Round 1 (Scaled Payoffs):** Options form a convex hull. Gains over disagreement are:  
    Alpha: (0, 20) | Beta: (4, 12) | Gamma: (12, 6) | Delta: (16, 2).  
    **Candidate Points (Calculated):**  
    - **Nash (Product Maximizer):** (14, 11.5) → Gains (10, 7.5) → Product = 75.  
    - **Kalai-Smorodinsky (Fractional Gains):** (11.5, 13.375) → Gains (7.5, 9.375) → Ratio: 7.5/16 = 9.375/20 = 0.46875.  
    - **Equal Gains:** (12.57, 12.57) → Gains (8.57, 8.57).  
    - **Utilitarian (Max Sum):** (4, 24) → Sum = 28.  
    *All distinct, Nash and KS interior to segments.*
  - **Round 2 (Treatment Only):** Add Epsilon: (22, 4). Pareto-dominated by convex combinations (e.g., 50% Delta + 50% new point yields (21, 5), better for both). Increases A’s max payoff from 20 to 22. **Nash unchanged** (relies on frontier, unchanged except extension), **KS shifts** (new ideal gains (18, 20)).
  - **Round 3 (Unit Change):** A’s payoffs transformed: \( \text{New A} = 2 \times \text{Old A} + 40 \). B unchanged. Disagreement becomes (48, 4). Nash and KS solutions scale accordingly; equal gains/utilitarian do not.

  ---

  ### Fictional Skin: **Community Garden Project**
  - **Context:** Neighbors A and B collaborate on a garden spanning their adjacent yards. Payoffs represent "satisfaction units" from harvest shares, beauty, and leisure.
  - **Disagreement Point (4, 4):** No agreement = separate gardens. A tends vegetables (moderate yield), B grows flowers (moderate beauty). Baseline satisfaction.
  - **Options:** Describe garden designs with trade-offs (e.g., space for vegetables vs. flowers, shared tools).

  ---

  ### Participant Handouts (One Page Each)
  **Instructions for All Rounds:**  
  - **Time Limit:** 7 minutes/round to negotiate. If no agreement, both get disagreement payoffs.  
  - **Agreements:** Pairs may propose fractional mixes (e.g., "60% Alpha + 40% Gamma"). Payoffs averaged linearly.  
    *Why allow mixtures?* Ensures continuous frontier; Nash/KS points are reachable.  
  - **Recording:** Write chosen option (or mixture) and payoffs on slip. Both players sign.  
  - **Leaderboard:** Cumulative payoffs displayed publicly after each round.

  #### **Round 1: Handout (All Pairs)**  
  > **Community Garden Designs**  
  > If you disagree, both get (4, 4).  
  > **Options:**  
  > - **Alpha (Ornamental Oasis):** Focus on B’s flowers. A: 4, B: 24.  
  > - **Beta (Balanced Beauty):** Equal space for flowers/vegetables. A: 8, B: 16.  
  > - **Gamma (A’s Vegetable Patch):** Priority to A’s vegetables. A: 16, B: 10.  
  > - **Delta (A’s High-Yield):** Maximize A’s vegetables. A: 20, B: 6.  
  > *Agreed Outcome: ___________ → Payoffs: A ____, B ____*  
  > Signatures: A __________, B __________

  #### **Round 2: Handout (Treatment Group Only)**  
  > **New Option!**  
  > A’s new irrigation system allows **Epsilon (A’s Intensive Expansion):** A: 22, B: 4. *[Control group handouts omit this option. Otherwise identical to Round 1.]*  
  > **Cover Story (Printed):**  
  > - **For A:** "Your new system boosts yield potential, but requires more space."  
  > - **For B:** "This design sacrifices your flower area for A’s expansion."  
  > *Agreed Outcome: ___________ → Payoffs: A ____, B ____*  
  > Signatures: A __________, B __________

  #### **Round 3: Handout (All Pairs)**  
  > **New Scoring for A!**  
  > A’s satisfaction now includes "long-term yield units" (conversion: 2 × Old A + 40). B unchanged.  
  > **Options (Recalculated):**  
  > - Alpha: A: 48, B: 24  
  > - Beta: A: 56, B: 16  
  > - Gamma: A: 72, B: 10  
  > - Delta: A: 80, B: 6  
  > Disagreement: A: 48, B: 4.  
  > *Agreed Outcome: ___________ → Payoffs: A ____, B ____*  
  > Signatures: A __________, B __________

  ---

  ### Facilitator Answer Key  
  **Round 1 (Scaled Payoffs):**  
  - **Ideal Point:** (20, 24) → Max gains: (16, 20).  
  - **Pareto Frontier:** Segments connecting (4,24)–(8,16)–(16,10)–(20,6).  
  - **Nash:** (14, 11.5) → Solve \(\max (u-4)(v-4)\) on segments (max at \(u=14, v=11.5\)).  
  - **KS:** (11.5, 13.375) → \((u-4)/16 = (v-4)/20\) → \(u=11.5, v=13.375\).  
  - **Equal Gains:** (12.57, 12.57) → \(u-4 = v-4\) → \(u=v\).  
  - **Utilitarian:** (4, 24) → Max \(u+v=28\).  

  **Round 2 (Treatment):**  
  - **Ideal Point (New):** (22, 24) → Max gains: (18, 20).  
  - **Nash:** **Unchanged** at (14, 11.5) (new segment’s product <75).  
  - **KS:** (12.0, 13.6) → \((u-4)/18 = (v-4)/20\) → \(u=12.0, v=13.6\) (shifts from Round 1).  

  **Round 3:**  
  - **Nash/KS Scale:** Multiply A’s Round 1 gains by 2 and add 40.  
    Nash: \(A = 2\times10 + 40=60\), \(B=11.5\) → (60, 11.5).  
    KS: \(A=2\times7.5+40=55\), \(B=13.375\) → (55, 13.375).  
  - **Utilitarian/Equal Gains Change:** E.g., equal gains now favors B.  

  ---

  ### Timeline (75 Minutes Total)  
  - **0:00–0:10:** Intro + Round 1 handout. *"Negotiate fairly!"*  
  - **0:10–0:17:** Round 1 negotiation.  
  - **0:17–0:22:** Collect slips. Update leaderboard. Pairs write: **"Why was your agreement fair?"** (1 sentence).  
  - **0:22–0:29:** Round 2 handout (secretly split: 6 treatment, 6 control).  
  - **0:29–0:36:** Round 2 negotiation.  
  - **0:36–0:41:** Collect slips + leaderboard. Write fairness sentence.  
  - **0:41–0:48:** Round 3 handout.  
  - **0:48–0:55:** Round 3 negotiation.  
  - **0:55–1:00:** Collect slips + leaderboard. Write fairness sentence.  
  - **1:00–1:15:** **Debrief** (key below).  

  ---

  ### Debrief Script  
  1. **Scatter Plot Agreements:** Sketch Round 1 frontier. Plot class’s outcomes. Highlight clusters near Nash (product), KS (fractional gains), equal gains, utilitarian.  
  2. **Round 2 Tension:**  
     - Read anonymous fairness sentences. Note:  
       > "A deserved more after their investment (Epsilon)!" (Treatment A)  
       > "Why should A gain if I get nothing extra?" (Treatment B)  
     - Reveal control vs. treatment: **Controls** (no Epsilon) had similar agreements to Round 1. **Treatment** shifted toward higher A gains when KS was intuitive.  
  3. **Name the Concepts:**  
     - **Nash Bargaining Solution:** Maximizes product of gains. Satisfies *independence of irrelevant alternatives* (IIA): "If an option no one chooses is added, the solution shouldn’t change."  
     - **Kalai-Smorodinsky Solution:** Equalizes % of max possible gain. Satisfies *individual monotonicity*: "If your max potential increases, your gain should too."  
     - **Conflict:** IIA vs. Monotonicity. Both solutions share efficiency, symmetry, invariance, but differ here.  
  4. **Round 3 Lesson:** Affine transformation shifted "equal split" advocates. Nash/KS are scale-invariant; utilitarian/equal gains are not.  
  5. **Behavioral Insight (Critical):**  
     > "This experiment measures what people *do*, not what’s normatively right. A null result (e.g., no shift in Round 2) wouldn’t refute Nash or KS—it might mean people reject both axioms! But we saw a split: when A’s max increased, some adjusted toward fairness as proportionality (KS)."  

  ---

  ### Predictable Challenges & Fixes  
  1. **Equal Splitters:** Common in Round 1. Use their Round 3 outcome to show scale dependence.  
  2. **Failed Agreements:** Pairs behind may rush. Reassure: "Cumulative payoffs; focus on this round."  
  3. **Threats with Extra Option:**  
     - *Problem:* A threatens: "Accept less or I’ll pick Epsilon and we both lose!"  
     - *Fix:* **Forbid threats.** Frame as cooperative: "Find a joint solution both prefer to (4,4)."  
  4. **No Mixtures, Need Rounding:** If mixtures disallowed, students round to nearest listed option. Nash/KS become approximate; note in debrief.  
  5. **Ideal Point Confusion:** Clarify: "Ideal = best you could get if the other conceded everything."  
  6. **Time-Pressure Noise:** 12 pairs × 3 rounds = 36 agreements to track. Use TAs to assist with slip collection/leaderboard.  
  7. **Data Quality:** Some pairs anchor on first-round norms. Use fairness sentences to infer reasoning.  

  ---

  ### What the Activity Cannot Reproduce (Verbal Supplements Needed)  
  1. **Utility as vNM:** "Payoffs are comparable across players only up to affine transformations—a core assumption we simulate in Round 3."  
  2. **Common Knowledge:** "In reality, players might hide preferences. Here, we assume both know all payoffs."  
  3. **Pareto Efficiency:** "We enforce efficiency by design. Real negotiations may leave joint gains unclaimed."  
  4. **>2 Players:** "Fractional-gain solutions extend to N players, but Nash’s IIA becomes contentious. Leave this for advanced courses."  
  5. **Normative vs. Descriptive:** Emphasize: "Nash and KS are fairness norms. We test if people *follow* them, not if they’re ‘correct’."  

  ---

  ### 40-Minute Fallback Version  
  - **Keep:** Round 1 (10 min) + Round 2 with control split (15 min).  
  - **Drop:** Round 3 and fairness sentences.  
  - **Debrief (15 min):**  
    1. Plot Round 1 agreements.  
    2. Contrast Round 2 treatment vs. control.  
    3. Introduce IIA vs. monotonicity conflict using Epsilon example.  
    4. Show Nash and KS calculations.  
    5. Conclude: "Fairness isn’t just splitting equally—it’s about how alternatives shape expectations."  

  --- 

  **Final Note:** Use whiteboard for live calculations. Numbers chosen for easy arithmetic (no decimals beyond halves). Handouts avoid jargon; debrief links intuition to axioms.
