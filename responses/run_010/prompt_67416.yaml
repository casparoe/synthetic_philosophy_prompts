prompt: |-
  Since my father died in the spring of 2019 I have kept a notebook, originally of jobs and quotes, which has gradually turned into a record of decisions I could not make cleanly. I run a building firm of about thirty people near Wakefield with my brother; my mother is eighty-four and still lives in the house I grew up in. What has struck me over the last few years is that almost none of the hard choices I face are really about weighing consequences against one another. They are about who somebody is to me. I have also been listening to a good deal of radio and reading a translation somebody lent me, and I came across an idea that I do not know the proper name for: that a person simply is his roles, that there is no "me" left over underneath being a son, a brother, an employer and a neighbour which could stand outside all of them and choose between them. When I try to picture myself with those stripped away, I find nothing there, which is why the idea has taken hold of me. I gather there was a very old argument in Chinese thought between people who held something like this and people who insisted that one ought to care for everyone impartially, and that the first group thought the second were pulling up something by the roots. I cannot tell which side I am on, and I would rather work it out from my own reactions than from a theory somebody hands me. So here are the reactions, and they are not tidy.

  1. My mother needs increasing help. I do not experience this as one claim among others competing with the claims of strangers; I experience it as mine, in a way that does not seem to admit of being outweighed. I would not sell the house she lives in even if the money would plainly do far more good elsewhere, and I am not particularly ashamed of that.
  2. My brother has wrecked two businesses through his own choices. He asked me for a substantial loan last year. I gave it, and I would give it again, but I know perfectly well that I would not have given a tenth of it to a far more deserving stranger.
  3. An apprentice of mine, no relation, worked harder than anyone on site and I paid for his qualifications and put him in charge of a small job ahead of my own nephew, who was less keen. I felt no conflict at the time. My nephew's claim simply did not register, and afterwards I was not sorry.
  4. My daughter now wants a job in the firm. She is good but she is not the best applicant. I think I should not give it to her, and I would feel like a fraud if I did — and yet I also think that if I were standing where she is standing, my father handing the job to a stranger would feel less like fairness than like being abandoned.
  5. An employee's father died in the middle of a season when we could not afford the time. He took three weeks and I paid him in full. It never occurred to me that I was making an exception to our rules; the rules seemed beside the point rather than overridden.
  6. A cousin of mine was cruel to my mother for years, and now needs money. I feel almost nothing. An unrelated neighbour who has driven her to appointments for a decade asked me for a favour last month and I felt more obliged to him. That verdict frightens me, because it suggests the tie only counts when it has actually been lived.
  7. A long-standing friend asked me to lie to his wife about where he had been. I refused, and I do not feel I betrayed the friendship. I feel the friendship is what required the refusal.
  8. My uncle, the eldest of that generation, expects to direct me on the strength of who he is, and I resent it and think his expectation is hollow. My mother expects nothing and directs me constantly, and I obey her without the slightest resentment, though she has no more standing than he does.

  What I want is a principle, or a small number of competing candidates, stated in plain language, that delivers as many of these verdicts as it honestly can. For each clause of it, tell me which case forces that clause in. Then tell me what it says about cases I have not listed: a promise I made to my mother while she was well, to do something after her death that I now think wrong; whether the principle treats a role I chose, such as employer, differently from one I never chose, such as son; and a parent who has committed something criminal and asks his child to help him escape the consequences. Finally, tell me which of my verdicts the principle cannot accommodate, and which one you would tell me to abandon. I suspect the real choice is between a simple principle on which the tie holds whether or not it is honoured — which would oblige me to give up the cousin and the apprentice — and a more elaborate one on which a role binds only in so far as it is actually being lived, which troubles me for the opposite reason: if the tie depends on conduct, it stops being something I am and becomes something I can hand back whenever the terms disappoint me. Tell me which of those two is nearer the thing I have been circling, and whether the second is genuinely available or whether it quietly collapses into ordinary impartial morality with a discount for relatives. I am not after references or the names of books; I want the reasoning laid out so clearly that I could put it to my brother across a table in the pub and he could tell me where it fails.
reasoning: |-
  Okay, let me start by really understanding what this person is going through. They lost their father in 2019 and have been keeping a notebook of unresolved decisions. They run a family business with their brother, care for their elderly mother, and are grappling with how their roles define them. The core of their struggle is whether their identity is just the sum of their roles or if there's something more underneath.

  First, they mention an idea from Chinese philosophy about roles constituting the self. The user references an ancient debate between those who believe in role-based obligations and Mohists who advocate impartial care. The user is caught between these views, trying to find a principle that fits their lived experiences without relying solely on theory.

  Looking at their specific cases: helping their mother unconditionally, loaning money to their brother despite his failures, prioritizing a hardworking apprentice over a nephew, hesitating to hire their daughter, supporting an employee in bereavement, feeling more obligation to a helpful neighbor than a cruel cousin, refusing a friend's dishonest request, and obeying their mother but resenting their uncle's demands. Each scenario shows how roles and relationships influence their decisions in ways that impartial calculations wouldn't.

  The user wants a clear principle that explains these judgments and can be applied to new situations. They also worry about two extremes: a rigid role-based principle that might force obligations to undeserving relatives, versus a conduct-based one that might make relationships transactional. Their fear is that the latter might collapse into impartial morality with discounts for family, which isn't what they feel.

  I need to formulate principles that capture their intuitions. Principle A: "Roles create binding obligations regardless of conduct" aligns with their actions towards family but clashes with the cousin and uncle cases where conduct matters. Principle B: "Roles bind only when actively honored through mutual care" explains the cousin and neighbor but risks making obligations conditional. Principle C: "Core roles (family) are unconditional; chosen roles require reciprocity" might bridge both, treating family as inherent but roles like employer as reciprocal.

  Testing these principles against their cases. Principle A fails with the cousin and apprentice, requiring them to support the cousin despite cruelty. Principle B handles the cousin and neighbor well but makes maternal obedience conditional on her conduct, which doesn't fit their experience of it as automatic. Principle C differentiates core vs. chosen roles, fitting most cases except maybe the apprentice, who's treated like family due to merit, not blood.

  For unresolved cases, a promise to their mother after death might be void if it's wrong, as core roles don't compel immorality. A criminal parent's request would be refused because roles have limits. The apprentice is an outlier since Principle C would prioritize family, but the user didn't. The user might need to accept that merit can sometimes override blood ties in chosen roles.

  Between the two extremes, Principle C is closer but still imperfect. The conduct-based view (Principle B) risks collapsing into impartial morality. The user's intuition suggests core roles are intrinsic, not earned. Therefore, a hybrid approach acknowledging inherent family obligations while allowing chosen roles to be reciprocal might be best. They might need to accept that the apprentice case is an exception where meritocracy within their role as employer supersedes family ties, without abandoning the core principle.
answer: |-
  This cuts to the bone of how we exist in the world. Your notebook reveals a profound truth: you *are* your relationships. The "self" isn't a ghost in the machine choosing roles; it's constituted *by* those roles. The ancient Chinese debate you touched on is between **Role Ethics** (associated with Confucianism, seeing persons as inherently relational) and **Impartialist Morality** (associated with Mohism, advocating universal care). Your struggles resonate deeply with the Role Ethics perspective, where obligations arise from the concrete relationships that define you. Here's how to frame principles based *entirely* on your reactions, stated plainly:

  **The Core Principle (Role-Constituted Obligation):**

  *   **"My fundamental obligations arise from the specific relationships that define who I am. These relationships carry built-in expectations, and fulfilling them isn't about weighing consequences, but about being faithful to the role itself. The strength of the obligation depends on the nature and depth of the relational tie."**

  **Competing Candidates Refined by Your Cases:**

  To capture the nuances in your reactions, we need to refine this core principle. Two strong candidates emerge, each forced in by specific cases:

  1.  **The Intrinsic Tie Principle (ITP):**
      *   *"Once a fundamental relational role exists (son, brother, parent, perhaps lifelong friend/neighbor), it creates an intrinsic, non-negotiable obligation. This tie exists independently of how well the other person has 'performed' their role or how 'deserving' they are relative to strangers. You act *as* the son/brother/etc., not *despite* it."*
      *   **Forced in by:** **Case 1 (Mother/House)**, **Case 2 (Brother/Loan)**, **Case 8 (Mother vs Uncle)**. Your actions here feel automatic, non-negotiable, and shame-free precisely because the *role itself* demands it. The uncle case highlights that the role must be *fundamental* (son vs. nephew/uncle) – his "standing" is hollow because the *intrinsic* tie isn't deep enough for his expectation.
      *   **Case 4 (Daughter/Job) and Case 7 (Friend/Lie)** also support ITP, but introduce tension: ITP *might* push you to hire your daughter (acting *as* father), but you feel it would be fraudulent. Similarly, ITP explains why refusing the lie *is* being a true friend – fidelity to the role requires maintaining its integrity.

  2.  **The Lived Reciprocity Principle (LRP):**
      *   *"A role creates a binding obligation only when it has been actively lived and reciprocated in a meaningful way. The obligation stems from the history of mutual care, trust, and shared life built *within* that role, not just the label itself. The 'tie' is the lived substance, not the formal category."*
      *   **Forced in by:** **Case 3 (Apprentice vs Nephew)**, **Case 5 (Employee/Bereavement)**, **Case 6 (Cousin vs Neighbor)**, **Case 7 (Friend/Lie)**. The apprentice earned his place through conduct *within* the work relationship, making his "claim" stronger than the formal-but-unlived tie to the nephew. The employee's need transcended rules because of the lived employer-employee bond. The neighbor's decade of help created a real, lived tie exceeding the formal-but-abused family tie to the cousin. Refusing the lie honors the *true substance* of friendship built on trust.

  **Applying the Principles to Your Unlisted Cases:**

  *   **Promise to Mother (After Death):**
      *   **ITP:** The intrinsic son-mother tie *might* compel you, regardless of your changed view, as it was a promise made *within* that fundamental role. However, ITP focuses on *being* the son *to her*. Once she is gone, the active role ceases, potentially releasing you, especially if fulfilling it now harms others (violating other roles). The obligation weakens significantly post-mortem.
      *   **LRP:** The promise was made within a lived relationship. If fulfilling it now contradicts the *substance* of the care and respect that defined your relationship with her (e.g., it harms someone she cared about), you are released. The obligation was contingent on the living relationship context.
      *   **Verdict (Leaning LRP):** You are likely released. The role, while defining, was anchored in the living relationship. A promise extracted under different circumstances, now seeming wrong, doesn't bind absolutely against your current moral understanding grounded in your *present* roles.

  *   **Chosen vs. Unchosen Roles:**
      *   **ITP:** Makes a *stronger* distinction. Core, unchosen roles (son, brother, parent) create the most intrinsic, non-negotiable obligations. Chosen roles (employer, friend, spouse) generate significant obligations, but these might be more readily shaped or even dissolved if the *substance* of reciprocity is destroyed (e.g., extreme betrayal). The employer role *is* chosen, but deepens through lived mutual commitment (Case 5).
      *   **LRP:** Blurs the distinction *more*. The obligation stems from the lived substance, regardless of how the role originated. A deeply lived chosen role (like the neighbor/friend in Case 6) can create a stronger obligation than an unchosen but neglected one (cousin). However, unchosen core roles usually have the *potential* for deeper lived substance simply due to longevity and inherent interdependence.
      *   **Verdict:** Both principles acknowledge a difference, but **ITP emphasizes the inherent weight of unchosen core roles more starkly**, while **LRP focuses more on the actual lived history**. Your Case 8 (Mother/Uncle) strongly supports ITP's emphasis on the inherent weight of the core maternal bond.

  *   **Criminal Parent Asking for Help:**
      *   **ITP:** The intrinsic son-parent tie creates a powerful pull. However, being a son *also* implies upholding certain shared values (like justice, honesty) inherent in the family role itself. Helping them escape consequences likely violates the integrity of *being* a son within a moral community. The obligation might manifest as ensuring fair treatment/legal support, not aiding evasion.
      *   **LRP:** The obligation depends entirely on the *substance* of the relationship. If the parent lived their role honorably and with care, the request creates a profound conflict. If the relationship was already abusive or the parent consistently violated norms, the lived tie is weak or broken, offering little obligation. The criminal act itself likely severs the reciprocal trust essential to the lived role.
      *   **Verdict:** **Both principles would likely lead to refusal.** ITP refuses because aiding crime violates the *meaning* of the son role within a moral order. LRP refuses because the request destroys the reciprocity and trust the role requires, or because the prior conduct may have already eroded it. The core obligation (ITP) or the residual care from the lived bond (LRP) might lead to non-complicit support (e.g., ensuring legal representation, visitation).

  **Which Verdicts Challenge the Principles & Which to Abandon?**

  *   **Challenge for ITP:** **Case 3 (Apprentice over Nephew)** and **Case 6 (Neighbor over Cousin)**. ITP struggles here. The formal family tie (nephew, cousin) should, on pure ITP, create *some* intrinsic obligation stronger than for non-family. Yet you felt *nothing* for the nephew's claim and prioritized the neighbor over the cousin based on lived conduct. **To hold ITP purely, you might need to abandon the *strength* of your reaction in these cases** – perhaps acknowledging a *prima facie* pull to the nephew/cousin, even if easily overridden by merit or earned loyalty in the specific context. Case 6 especially challenges ITP.
  *   **Challenge for LRP:** **Case 1 (Mother/House)** and **Case 2 (Brother/Loan)**. LRP *can* explain these (a lifetime of lived reciprocity!), but your description feels deeper: an obligation that exists *regardless* of hypothetical "better use" or your brother's deserts. It feels intrinsic to the *role*, not contingent on the specific history (though the history enriches it). **LRP risks making these feel transactional.** If your mother had been less caring (but not abusive), would ITP still compel you? Your description suggests yes. LRP might force you to soften the absolute, non-negotiable feeling you describe.
  *   **Case 4 (Daughter/Job)** challenges *both*. ITP pulls towards hiring (father role). LRP, based on the lived father-daughter bond, also creates a strong pull. Yet your verdict leans against hiring. Both principles need refinement: recognizing that roles have *scope* (father doesn't automatically override employer) or that the *integrity* of the father role *requires* fairness in the employer role to be a good role-model.

  **The Core Choice: Intrinsic Tie vs. Lived Reciprocity**

  You've perfectly identified the tension. Let's compare the two approaches head-on:

  1.  **Simple Principle (Intrinsic Tie - ITP):** "The tie holds whether or not it is honoured."
      *   **Nearer to what you're circling?** **Yes, in its core.** Your descriptions of your mother, brother, and even the employee's bereavement scream an obligation inherent in the *position* you occupy relative to them. The feeling of something being "mine" (Case 1) is the essence of ITP.
      *   **Cost:** Requires abandoning/softening the *absolute* verdicts in **Case 3 (Apprentice)** and especially **Case 6 (Cousin)**. You must accept a baseline pull to family *even if* you rightly override it based on conduct/merit within other roles. The uncle case (8) shows you instinctively recognize degrees of "intrinsic-ness" (son vs. nephew/uncle).
      *   **Collapse into Impartiality?** **No.** ITP is fundamentally partial. It starts from the specific tie, not an impartial calculation. It doesn't discount relatives; it places them categorically higher based on the relationship itself.

  2.  **Elaborate Principle (Lived Reciprocity - LRP):** "A role binds only in so far as it is actually being lived."
      *   **Genuinely Available?** **Yes, but unstable.** It *can* be stated coherently as you have: obligations arise from the actual history of mutual care within a role-context.
      *   **Collapse into Impartial Morality?** **It constantly flirts with it, and often collapses in practice.** This is your valid fear. Why? Because judging the "lived" aspect inevitably involves impartial assessments of desert, contribution, and reciprocity. Deciding the cousin forfeited their claim *is* making an impartial judgment about their conduct relative to the neighbor's. Prioritizing the apprentice *is* an impartial merit judgment. **LRP smuggles in impartial evaluation under the guise of assessing the "lived" relationship.** It becomes "impartial morality plus extra weight for history," rather than the inherent partiality of relational identity. Your fear that it makes the tie "something I can hand back" is spot-on – it becomes contingent on performance, not intrinsic identity.
      *   **Trouble for Opposite Reason:** Yes. It struggles to capture the non-negotiable, "mine" feeling of Cases 1 & 2. If your brother *never* reciprocated, would LRP release you? Your intuition (and ITP) suggests not – he's still your brother.

  **The Verdict & The Reasoning for the Pub Table**

  "Alright [Brother's Name], let's set the philosophers aside. Based purely on how I *feel* in these situations – Mum's house, loaning you that money, ignoring [Nephew] for the apprentice, telling [Friend] I wouldn't lie – here's what rings true for me:

  1.  **I am my relationships.** Being your brother isn't just a hat I wear; it's *part of me*. Same with being Mum's son. That's why helping Mum or loaning you money doesn't feel like a choice between options; it feels like just *being* who I am. Stripping those away leaves nothing. (Case 1, 2, 8 - Mum).
  2.  **But the label alone isn't magic.** [Uncle] expecting obedience just because he's uncle feels hollow. [Cousin] being cruel to Mum for years means that 'cousin' label carries no weight for me anymore. Whereas [Neighbor] driving Mum for a decade? That *earned* a real pull, stronger than blood in that instance. (Case 6, 8 - Uncle).
  3.  **Work is different.** When I put [Apprentice] ahead of [Nephew], it wasn't family vs. stranger. It was recognizing who *earned* it *within the job*. My role as boss *requires* that fairness to the lads who graft. Letting [Employee] take time off paid wasn't breaking rules; it was doing right by someone who's part of the team. (Case 3, 5).
  4.  **Honesty is part of the deal.** Refusing to lie for [Friend] *was* being a friend. A real friendship can't be built on that. (Case 7).

  **So, the principle I'm leaning on is this:** **'Core relationships – like son, brother, parent – create a bedrock obligation just by existing. That tie is part of who I am. But for other ties, or when roles clash, what matters is the actual history: the care given, the trust built, the effort shared.'** (This is essentially **ITP as the core, incorporating LRP for non-core or conflicting obligations**).

  *   **Why this over pure "lived reciprocity"?** Because if helping Mum depended on how 'well' she'd performed as a mother lately, it would turn something fundamental into a transaction. The bedrock has to be unconditional for the core ties. Pure 'lived' risks making everything negotiable.
  *   **Why this over pure "intrinsic label"?** Because [Cousin] proves blood alone doesn't cut it if the relationship is rotten. And [Apprentice] proves that in the work sphere, merit earned *through conduct* within that role matters more than a faint family claim.
  *   **The Friction:** It means [Nephew] *does* have a baseline claim just by being nephew, even if I rightly overrode it for the apprentice. And [Daughter]... that's the hardest clash. The core father tie pulls hard, but the boss role, and my need to look the lads in the eye, pulls the other way. The principle says both claims are real – the core tie is unconditional, but the *demand of the role* in this instance (giving her the job unfairly) might violate the *integrity* of being her father *and* a good boss. Saying no might be the faithful act to *both* roles in the long run, even if it hurts now.

  **Where it might fail?** Maybe I'm wrong that core ties are truly unconditional. If you utterly betrayed the family, would the brother-tie still hold absolutely? Or does even the core have a breaking point? That's the edge case. But for how I've lived the last few years, this fits best without turning my deepest obligations into a cost-benefit analysis."

  This approach honors the non-negotiable core of your closest relationships (ITP) while acknowledging that the *strength* of obligation in wider circles or when roles conflict depends heavily on the substance of lived reciprocity (LRP), preventing hollow claims based solely on labels. It accepts that **Case 6 (Cousin vs. Neighbor)** and **Case 3 (Apprentice)** demonstrate the *limits* of mere labels and the *power* of lived bonds, without abandoning the foundational intrinsic pull of core family roles evident in Cases 1, 2, and 8. It makes **Case 4 (Daughter)** painfully clear: two powerful, legitimate role-based obligations are in direct conflict, requiring a choice that will necessarily feel imperfect, but where fairness within your chosen role as employer seems to be the deciding factor for you, even against the core paternal pull. The principle doesn't make it easy, but it makes your struggle intelligible.
