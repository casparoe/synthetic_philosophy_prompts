     - **The claim that the constraint only binds within a single moment**: This is the idea that at each step the agent is acting rationally (locally) but the global result is bad. In thermodynamics, this is exactly the case in a non-conservative force field: at each point, the force might be the gradient of a local potential, but globally there is no single potential. However, the analogy is not perfect because in decision theory the "local" rationality is defined by the preferences at that time. This is similar to the idea of a multi-valued potential (like in spin glasses) but we don't have a direct thermodynamic concept for a sequence of independent agents.

