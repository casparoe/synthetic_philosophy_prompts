  The user needs a focused proposal that clearly states a research question, addresses why existing positions leave it open, outlines a week-by-week plan, explains why this approach is better than just picking a side, defines success and failure criteria, and honestly scopes the project for 8,000 words. They also want to preemptively address whether their three-way distinction collapses under scrutiny.

  Hmm, the core tension here is between conceptual clarity and formal rigor. The user suspects sloppy terminology is muddying the waters, but their officemate thinks they're just relabeling the same distinction. That's the critical pivot—if the trichotomy doesn't hold, the project implodes. So we need to build in a robustness check early on.

  First, let's validate their intuition: yes, CPA *is* used ambiguously. The "analyst's prior" (1) appears in Bayesian game theory as a modeling choice, the "structural coherence" (2) is topological (e.g., type spaces admitting a common prior by construction), and the "normative claim" (3) fuels debates about disagreement and rationality. Examples: Binmore critiques (3) while defending (1); Feinberg's impossibility theorems target (2); Aumann invokes (3) but relies on (2).

  But the officemate has a point—formally, (1) and (2) often converge. If the analyst specifies a type space, (1) *is* (2). Yet philosophically, they serve different functions: (1) is epistemic (what the modeler knows), (2) is mathematical (consistency of hierarchies). The gap might be between formalism and interpretation. 

  For the proposal, we should:
  - **Question:** "Does disentangling CPA's roles resolve key disputes, or do they collapse under formal pressure?" 
  - **Stakes:** Existing positions talk past each other because critics attack (3) while defenders cite (1)/(2)'s innocuousness. Even if they collapse, *why* that happens is revealing.
  - **Method:** Weeks 1-2 dissect texts to map the three uses. Week 3 tests collapse risk by formalizing a case where (1)≠(2). Weeks 4-5 apply the framework to Aumann and Binmore. Week 6 drafts; Weeks 7-8 refine.
  - **Scope cuts:** No new theorems; minimal exegesis of agreement results. Focus on 2-3 flagship disputes.
  - **Success:** "We can explain X% of CPA disagreements by tracking which variant is invoked; where they collapse, it reveals modeling assumptions masquerading as facts."
  - **Failure:** The distinctions don't predict actual citation patterns, or they always reduce to one formal property.

  If the trichotomy collapses, pivot to: "Why does CPA *appear* multifunctional? A study of modeling rhetoric in choice-theoretic philosophy." Still salvages the core insight about disciplinary miscommunication.

  User's self-awareness is impressive—they're preempting committee pushback. The proposal mustn't overpromise. Emphasize that this is diagnostic, not salvific for CPA debates. And 8,000 words means: one intro, one collapse-test chapter, one application chapter, one conclusion. No rabbit holes.
answer: |-
  Here’s a focused, defensible proposal structured to meet your needs, with built-in critical pushback and honest scoping:

  ---

  ### **Proposal: Disentangling the Common Prior Assumption — Why Debates Fail and How Clarity Resolves Them**  
  **Core Question:** *When theorists disagree about the common prior assumption (CPA), to what extent can their disputes be resolved by disambiguating its three distinct roles—analyst’s epistemic tool, structural coherence property, and normative ideal—and where do these roles collapse under formal scrutiny?*  

  #### **Why Existing Positions Leave It Open**  
  Existing defenses treat CPA as a benign modeling convention (e.g., Binmore: prior as "scaffolding"), while critics attack it as empirically false (e.g., Aumann critics: "real disagreement persists"). Both sides implicitly shift between CPA’s roles:  
  - A defender citing CPA’s *mathematical convenience* (Role 1) sidesteps objections to its *normative plausibility* (Role 3).  
  - A critic attacking *disagreement in practice* (Role 3) ignores CPA’s *consistency function* (Role 2) in type spaces.  
  **Concession:** Even staunch advocates must admit CPA’s *normative* role (3) is contestable; even critics grant its *technical* utility (1/2) for coherence proofs. Yet neither engages the others’ core concern.  

  #### **Pushback: Does the Trichotomy Collapse?**  
  Your officemate’s objection is valid: in *fully specified models*, Roles 1 (analyst’s prior) and 2 (structural coherence) often merge. If the analyst defines the type space explicitly, their "ignorance" (1) is formalized as coherence (2). However:  
  - **Role 3 (normative ideal) remains distinct:** It imports external claims about rationality/evidence (e.g., "common evidence *should* imply common priors"), unrelated to model-building.  
  - **Role 1 survives pragmatically:** When analysts use CPA heuristically (e.g., in incomplete models), it reflects methodological choices vs. ontological commitments.  
  **Proposal pivot:** Even if Roles 1/2 collapse formally, the *rhetorical slippage* between technical/normative roles sustains confusion. The project survives by asking: *When does conflation of these roles generate illusory disagreements?*  

  #### **Work Plan (8 Weeks)**  
  1. **Weeks 1–2:** Map the trichotomy onto key texts (Aumann 1976, Binmore 2009, Feinberg 2004; critics like Gilboa/Schmeidler). Identify where authors shift roles mid-argument.  
  2. **Week 3:** Formal checkpoint: Analyze a type space where Roles 1 and 2 diverge (e.g., model with ambiguous analyst information) vs. where they converge. Test officemate’s collapse claim.  
  3. **Week 4:** Apply framework to Aumann’s agreement theorem: Does it require all three roles, or just structural coherence (2) + rationality?  
  4. **Week 5:** Case study: Binmore’s defense vs. behavioral critiques. Does disambiguation reveal substantive disagreement or terminological noise?  
  5. **Weeks 6–8:** Drafting + refining the "when roles collapse/endure" thesis.  

  #### **Why This Approach?**  
  Picking a side (e.g., "CPA is indefensible") ignores that *each role has distinct stakes*:  
  - Role 2 (coherence) is a technical choice with no truth-value;  
  - Role 3 (normativity) is a philosophical claim untestable by formal models.  
  **Advantage:** This explains why debates recur without resolution—opponents argue past each other by attacking different targets.  

  #### **Success Criteria**  
  A non-specialist should grasp:  
  > *"The common prior debate looks intractable because critics and defenders are talking about three different things—modeling convenience, mathematical consistency, and human rationality. Once separated, most disputes dissolve, and the few that remain are clearly about evidence vs. ideology, not math."*  

  #### **Failure Modes**  
  - **Likely failure:** The three roles are *so entangled in practice* that disambiguation doesn’t clarify actual citations (e.g., Aumann invokes all three). *Mitigation:* Show how even entangled usage reveals disciplinary priorities.  
  - **Scope-driven failure:** Literature too vast for 8k words. *Cut:* Deep exegesis of agreement theorems; focus on 2–3 flagship disputes (e.g., Aumann vs. critics, Binmore vs. behavioral econ).  

  #### **Honest Scoping**  
  - **Focus:** Philosophy of economics (not pure game theory). Prioritize conceptual analysis over new formal proofs.  
  - **Cut:** History of CPA; comprehensive survey; technical work on prior-free foundations.  
  - **Realistic output:** A diagnostic toolkit for reading CPA arguments, not a grand theory.  

  #### **Survival Strategy**  
  Even if Roles 1/2 collapse, **the core project holds** by exposing how:  
  1. Role 3 (normativity) is *independent* of modeling roles (1/2), yet often smuggled into defenses.  
  2. "CPA" functions as a *rhetical bridge* between technical and philosophical claims.  

  **Final Pitch:** This resolves more disputes than attacking CPA wholesale—and if the trichotomy collapses, you’ve revealed *why* CPA is a magnet for confusion.  

  ---
  This gives you a dispute-resolution engine, not just a survey. It’s critic-proof because failure still advances meta-debate clarity. For 8k words, stay ruthlessly focused on dissecting *arguments*, not rebuilding foundations.
