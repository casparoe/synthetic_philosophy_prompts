prompt: |-
  I'm in a comparative federalism seminar this semester and my prof spent two whole sessions building an argument that subsidiarity refutes itself, and I walked out of both of them unable to find the crack. Here it is as close to his version as I can reconstruct.

  (1) Subsidiarity says a decision belongs at the lowest level of government competent to handle it.
  (2) A level is competent to handle a decision only if it can internalize the effects of making it.
  (3) In an integrated economy almost every policy produces effects that cross the jurisdiction's border — pollution drifts, firms and taxpayers relocate, capital moves, people shop for benefit rules in the neighboring canton or state.
  (4) So almost every policy has effects that the lowest level cannot internalize.
  (5) So by (1) and (2) almost every policy belongs one level up, and the same reasoning applies again at that level, and again, until you get to the top.
  (6) So subsidiarity, applied honestly, is an argument for centralizing everything. The principle meant to protect the cantons and the Länder turns out to be a slow-motion brief against having them.

  He wouldn't say where it breaks, just told us to find it ourselves, and I can't get traction on any of the steps — each one looks fine sitting there on its own. What I do know is that I'm not going to accept (6), and I'm not willing to give up on subsidarity as at least a workable principle of institutional design, so something earlier has to go and I want to know what I'm paying for it.

  So: which step is the one to reject, and why did it look innocent when you read it by itself? Then price out the alternatives — for each of three other steps a defender might sacrifice instead, say what they'd have to swallow to do it. One more thing: his running example all semester was cross border river pollution, which he insisted the argument handles beautifully, so tell me whether your fix survives that case or whether it's genuinely a win for him.

  American English please. Give me exactly five numbered items, a sentence or two each, with no introduction and no conclusion: item 1 is the step to reject plus the diagnosis of why it slipped through, items 2, 3, and 4 are one alternative sacrifice each with its cost, and item 5 is the river case and the bottom line.
reasoning: |-
  Hmm, this user is in a comparative federalism seminar and their professor made a clever argument that subsidiarity refutes itself. The user wants me to identify which step in the professor's logic is flawed and explain why it appears innocent at first glance. They also want me to consider three alternative steps one might reject instead, with the costs of each choice, and finally address the river pollution example.

  The professor's argument goes like this: subsidiarity (decisions at lowest competent level) requires internalizing effects (step 2), but in integrated economies almost nothing can be fully internalized locally (step 3-4), so everything must move upward to higher levels (step 5), making subsidiarity self-defeating (step 6). The user finds each step plausible individually but rejects the conclusion.

  I need to pinpoint where this logic breaks. Step 2 seems particularly vulnerable - it claims a jurisdiction must internalize all effects to be competent. But in reality, governments routinely handle matters with spillover effects through various mechanisms like intergovernmental agreements, conditional grants, or mutual recognition. The internalization requirement is too strict and unrealistic, which makes it appear reasonable when stated abstractly but fails in practice.

  For alternative sacrifices:
  - Rejecting step 3 would mean denying that policies have cross-border effects, which is empirically false in modern economies - that's an unacceptable cost.
  - Rejecting step 4 would require arguing that lower levels can internalize all cross-border effects, which is equally implausible for significant issues like pollution.
  - Rejecting step 1's definition of subsidiarity would undermine the principle itself - you'd need to abandon the standard interpretation that prioritizes local decision-making.

  Regarding the river pollution case: the professor uses it to show lower levels can't handle spillovers. But under my solution (rejecting strict internalization), subsidiarity still works because states can cooperate through treaties or joint authorities without full centralization. This preserves local involvement while solving the problem, showing the argument doesn't necessarily lead to top-level control.

  The user wants exactly five numbered items in American English: one for the recommended step to reject with why it seemed innocent, three alternatives with their costs, and the river case conclusion. No intros or conclusions - just straight to the points. I'll structure my response accordingly.
answer: |-
  1. Reject step (2): Competence does not require full internalization of all effects. Step (2) looks innocent because "internalize effects" sounds like responsible governance, but it sets an impossibly high bar. Real-world competence often involves managing externalities through negotiation, partial solutions, or accepting some spillovers as tolerable trade-offs for local autonomy – not absolute containment. This step smuggles in an unrealistic centralizing standard.

  2. Sacrifice step (3): Deny that "almost every policy" has significant cross-border effects. The cost is swallowing that many policies (like purely local zoning, minor services) truly *are* containable locally, making subsidiarity viable for them. But this forces you to downplay the profound interconnectedness of modern economies and societies for the core cases where spillovers *do* occur, weakening the argument's general applicability.

  3. Sacrifice step (4): Argue lower levels *can* often internalize/properly manage cross-border effects. The cost is accepting that tools like interstate compacts, reciprocal agreements, or market-based mechanisms (e.g., tradable pollution permits) *do* effectively internalize effects for many policies, making the "lowest level" competent. But this forces you to defend local capacity to solve collective action problems that often fail in practice without higher-level coordination or enforcement.

  4. Sacrifice step (1): Reject the standard definition that subsidiarity *always* starts at the lowest competent level. The cost is abandoning subsidiarity's core decentralizing thrust; you must argue competence is inherently assessed relative to *all* levels simultaneously or that some functions *presumptively* belong higher. This fundamentally alters subsidiarity into a different, less autonomy-protective principle.

  5. The river case: Your professor wins on the *specific* point that one polluting canton cannot unilaterally internalize downstream effects. However, rejecting step (2) survives: Competence can reside at the *lowest level capable of organizing a solution*, like a basin commission formed *by* the affected states/cantons themselves. This avoids immediate, full centralization, preserving subsidiarity's spirit through cooperative federalism.
