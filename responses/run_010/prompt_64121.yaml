prompt: |-
  Every account of bounded rationality I teach runs into the same wall, and I want a diagnosis of the wall rather than another summary of it. Since Simon introduced satisficing, the orthodox response has been that it is no rival to maximizing at all: once search costs, time, and cognitive capacity are entered as constraints on the choice problem, an agent who stops at the first option clearing an aspiration level is simply optimizing subject to those constraints, and Stigler's search theory is offered as the proof of concept. The Simonian rejoinder is that this misses the point, because aspiration levels are not terms in a utility function to begin with — they are set by the agent's history and revised by rule of thumb in response to how often the search has been succeeding, so satisficing names a procedure rather than a constrained version of the substantive maximization it is said to reduce to. Decades on, neither side has budged and the two literatures barely engage.

  My working hypothesis is that the dispute is not substantive at all but a disagreement about what a reduction must preserve: whether the explanandum is the choice the agent makes or the process that produces it, and whether re-describing a rule in optimizing vocabulary counts as explaining it. Test that hypothesis against what each side actually claims. Is the stall instead driven by a hidden empirical question — say, whether aspiration levels track the payoff structure of the environment tightly enough for the optimizing description to earn its keep — or by a hidden formal question about whether aspiration-based rules admit exact representation as solutions to some well-posed constrained problem? Then tell me what would count as progress given your diagnosis: a distinction, a representation theorem, a class of environments in which the two descriptions diverge in their predictions, or a reason to expect none.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're frustrated with the stalemate in bounded rationality discussions, especially between Simon's satisficing and the orthodox optimization response. The user presents a working hypothesis that the dispute is about what a reduction must preserve—choice versus process—and whether re-describing a rule as optimizing is explanatory.

  First, I need to test their hypothesis against both sides' claims. The orthodox camp, like Stigler, argues that including search costs as constraints makes satisficing a form of optimization. Simonians counter that aspiration levels aren't part of utility functions; they're adaptive and shaped by history. The user's hypothesis seems spot-on here. The orthodox focus on outcome equivalence (choice), while Simonians care about the procedural aspect (how the choice is made).

  But maybe there's more. The user mentions hidden empirical or formal questions. Empirically, do aspiration levels track environmental payoffs well? If they do, the optimization description holds. If not, satisficing stands apart. Formally, can aspiration rules be exactly represented as solutions to constrained problems? Some cases might fit, but adaptive heuristics could make this messy, especially with changing environments.

  The user wants to know what progress would look like. Their hypothesis suggests a need to clarify the explanatory goals. Distinguishing between "choice-explanation" and "process-explanation" could help. A representation theorem might bridge the gap, but it's tricky. Empirical tests in specific environments where predictions diverge could force engagement. If no divergence exists, that's informative too.

  I should also consider the user's role. They teach this topic and hit the same wall. They need a diagnosis, not another summary. Their deeper need might be for tools to frame the debate for students, showing why the impasse persists and how to move beyond it. Highlighting the meta-issue—explanatory aims—could empower them to teach the conflict's roots rather than just the surface arguments.
answer: |-
  Your diagnosis is sharp and largely correct: the core impasse **is** meta-theoretical, concerning the *explanatory target* and what constitutes an adequate *reduction*. However, empirical and formal disagreements act as reinforcing bulwarks rather than the primary drivers. Let's test your hypothesis and unpack the layers:

  1.  **Testing Your Hypothesis: "What Must a Reduction Preserve?"**
      *   **Orthodox View (Stigler et al.):** The explanandum is **the final choice made** (or the stopping rule *as an outcome*). Adequate reduction means showing the *outcome* is identical to what a fully specified constrained optimization model (incorporating all costs) would produce. The *process* leading to that outcome is irrelevant black-box; if the choice is optimal given constraints, the explanation is complete. Redescribing the rule as optimizing *does* explain the choice.
      *   **Simonian View:** The explanandum is **the decision-making *process* itself** – the adaptive setting of aspiration levels via experience, the reliance on simple heuristics, the satisficing *behavior*. Reduction must preserve the *procedural rationality*. Merely showing outcome equivalence under specific constraints *misses the point* because:
          *   It ignores *how* aspiration levels are formed (history, feedback, rules-of-thumb, not calculation).
          *   It assumes the agent *could* solve the full constrained problem, which Simonians deny is plausible or even possible for complex, uncertain environments (bounded rationality *precedes* the constraints).
          *   Redescribing the heuristic as "optimizing under constraints" is an *ex post* rationalization, not an explanation of the actual cognitive mechanism employed. It replaces the real causal process (the heuristic) with a fictitious one (the calculation).

      **Verdict:** Your hypothesis **holds strongly**. The fundamental disagreement is about the *explanans*. For the orthodox, the explanation is the *optimality of the outcome* given constraints. For Simonians, the explanation is the *psychological plausibility and ecological validity of the process*. They are answering different questions: "Why is this choice rational (optimal)?" vs. "How does a cognitively limited agent actually make this choice?" The lack of engagement stems from each side dismissing the other's core question as irrelevant.

  2.  **The Reinforcing Roles of Empirical and Formal Disagreements:**
      *   **Empirical Layer (The "Hidden Empirical Question"):** The orthodox claim *depends* on the empirical premise that aspiration levels (or other heuristic parameters) evolve *as if* they were solutions to the constrained optimization problem – that they reliably track the underlying payoff distributions and cost structures. Simonians *deny* this is generally true:
          *   Aspiration levels are sticky, influenced by initial conditions, and adapt via simple rules (e.g., raise if easy to satisfy, lower if hard) that may not track the *global* optimum.
          *   Heuristics can lead to systematic biases or perform poorly in environments where the optimization model assumes perfect tracking. Demonstrating environments where satisficing heuristics *deviate* from the predictions of even "constrained optimization" models (e.g., due to path dependence, mis-specified aspiration adaptation) is a key Simonian strategy.
      *   **Formal Layer (The "Hidden Formal Question"):** Can aspiration-based search rules *always* be represented *exactly* as the solution to *some* well-posed constrained optimization problem?
          *   **Orthodox Hope:** Yes, in principle. Define the constraints and costs precisely enough (including the "cost of calculation" itself), and the satisficing rule *is* the optimal solution.
          *   **Simonian Skepticism:** No, and attempts to do so reveal the flaw:
              *   **Ad Hoc Constraints:** The "constraints" needed to make the satisficing rule optimal (e.g., a specific, non-standard cost function for evaluating options or updating aspirations) often appear arbitrary and lack independent justification or psychological plausibility. They are reverse-engineered to fit the observed behavior.
              *   **Non-Optimal Heuristics:** Many heuristics people use demonstrably *aren't* optimal under plausible constraints; they are "good enough" fast-and-frugal solutions. Representing them as optimal requires distorting the constraint set beyond recognition.
              *   **Dynamics & Adaptation:** Formalizing the *adaptive process* of setting/revising aspirations (based on history and feedback) as a dynamic optimization problem is often intractable or requires assumptions (e.g., known probability distributions, fixed horizon) that violate the bounded rationality premise. The rule-of-thumb adaptation *is* the bound.

  3.  **What Counts as Progress?**
      Given the diagnosis, progress requires breaking the meta-theoretical deadlock *and* addressing the empirical/formal barriers. Here's what would move the field forward:

      *   **The Crucial Distinction (Meta-Theoretical Clarification):** Explicitly formalizing and widely adopting **your core distinction: Choice-Explanation vs. Process-Explanation**. Acknowledge they are complementary but fundamentally different explanatory goals. This frames the debate: "Under what conditions is a process-explanation *necessary* or *superior* to a choice-explanation, and vice versa?" This shifts focus from "who's right?" to "which explanation serves which purpose?"
      *   **Predictive Divergence (Empirical/Formal Leverage):** Identifying **specific, well-defined classes of environments** where:
          1.  Satisficing/adaptive-heuristic models and constrained-optimization models make **distinct, testable predictions** about either the *process* (e.g., sequence of searches, aspiration level dynamics) or the *final choices*.
          2.  The predictions of the satisficing model are **empirically validated** (e.g., via experiments, field data), while the constrained-optimization model's predictions fail *without resorting to obviously ad-hoc adjustments*.
          *   *Examples:* Environments with rapid non-stationary change (heuristics adapt faster), complex payoff landscapes where global optimization is impossible (heuristics find robust solutions), or where the "cost of calculation" itself is prohibitively high to model optimally. Demonstrating that aspiration levels *don't* track the theoretical optimum predicted by a constrained model in specific ecologies is key evidence.
      *   **A Representation Theorem... With Teeth (Formal Leverage):** A **representation theorem *with limitations*** would be powerful, but *not* one showing satisficing is always reducible to optimization. Instead:
          *   Show that a broad class of aspiration-based adaptive rules **can be represented as optimal solutions to well-posed constrained problems *only under highly specific, psychologically implausible, or ecologically rare conditions*** (e.g., assuming perfect foresight, known stationary distributions, or unnatural cost functions).
          *   Conversely, show that **outside those specific conditions**, no such representation exists without making the constraints empirically vacuous or the optimization problem computationally intractable *for the bounded agent*. This formally delimits the scope of the orthodox reduction.
      *   **A Reason to Expect None (Clarifying Stakes):** If rigorous empirical testing consistently shows aspiration levels *do* track environmental payoffs surprisingly well across diverse contexts *and* formal work shows adaptive heuristics *are* robustly approximable by tractable constrained optimization models, this would strengthen the orthodox position *for choice-explanation*. However, it wouldn't eliminate the need for process-explanations to understand *how* the tracking occurs psychologically. Conversely, consistent failure of tracking would strongly favor the necessity of distinct process models.

  **Conclusion:**

  The wall persists because the debate conflates two distinct explanatory projects. The orthodox focus on **choice-rationality** (outcome optimality under constraints) clashes fundamentally with the Simonian focus on **procedural rationality** (psychologically plausible process). Empirical disagreements about how well heuristics track environments and formal disagreements about the reducibility of adaptive processes reinforce the divide, but the core is meta-theoretical.

  **Progress hinges on:**

  1.  **Explicitly adopting the Choice-vs-Process Explanation distinction** to frame research questions.
  2.  **Identifying concrete environments where the models predict different observable outcomes (choices or process steps) and testing them rigorously.** Finding robust divergence is the most potent way to force engagement and demonstrate the independent value of the process perspective.
  3.  **Developing formal results that delineate the precise (and likely narrow) conditions under which aspiration-based heuristics *can* be exactly represented as optimal solutions under constraints,** highlighting where this reduction fails.

  Until the field acknowledges that "explaining the choice" and "explaining how the choice was made" are different (though related) goals, and designs tests and models accordingly, the wall will remain. Your diagnosis provides the blueprint for dismantling it.
