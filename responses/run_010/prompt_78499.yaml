  - "Now, we have an urn with one red, one blue, and one green chip. So one of these three will be drawn. Each of you assign three numbers: for red, for blue, for green. They don't have to add to 100. Then we'll draw a chip. For the true color, we want your number to be high, and for the false ones, we want them to be low. We'll compute a penalty: how far your numbers are from the truth. The truth for red is (100,0,0). So the penalty is (a-100)^2 + (b-0)^2 + (c-0)^2. We'll then give a score of 100 minus one hundredth of that penalty? Actually, to avoid big numbers, we'll just use the penalty: the lower the penalty, the better."

  - After they report, we pick a volunteer (or two) who has a+b+c not 100. We draw the chip. Then we compute the penalty for that participant. Then we adjust their report to (a',b',c') = ( a/(a+b+c)*100, ... ) and compute the penalty again. We show it's lower. Then we say: "But what if the draw had been blue? Let's compute the penalty for blue for both." And we show that the adjusted set has a lower penalty for blue too. And for green.

  - "Notice: no matter what color we draw, the adjusted set has a lower penalty. So if you had reported the adjusted set, you would have done better regardless of the outcome. That means your original set was 'incoherent' in a way that made it accuracy-dominated."

  *Timing:* 20 minutes.

  **Overall Flow:**

  - Round 1: 15 min
  - Round 2: 15 min
  - Round 3: 20 min
  - Debrief: 10 min

  Total: 60 min.

  **Debrief:**
  - Map moments to the view:
    - Round 1: Shows that a naive scoring rule (only rewarding being right) doesn't capture degrees of belief and pushes to extremism.
    - Round 2: Shows that the quadratic scoring rule (or any strictly proper scoring rule) makes honest reporting the best strategy. This is the core of accuracy-first: your beliefs are your best estimate of the truth, and this rule rewards accuracy.
    - Round 3: Shows that if your beliefs are not probabilistically coherent (like the three credences not adding to 100), then there exists a coherent set that is strictly more accurate in every possible world. So incoherence is accuracy-dominated.

  - Objections:
    1. **Immodesty:** "My own credences always look best to me, so this scheme just says I'm right." 
       - Response: The scoring rule is defined independently of your own beliefs. It's a rule that rewards being close to the truth. The point is that if you have a particular belief p, then reporting p maximizes your expected score. But if you are wrong about p (i.e., the world isn't p), then you might do worse than someone else. The rule doesn't assume you are right, it just rewards reporting what you actually believe because that's the best given your information.

    2. **Avoiding evidence:** "Should I avoid looking at evidence that might upset my nice accurate set?"
       - Response: No, because the scoring rule is about your current beliefs. If you get new evidence, you should update your beliefs. The rule doesn't penalize changing your mind; in fact, it rewards you for having more accurate beliefs. So you should seek evidence to become more accurate.

    3. **Proving probabilism is nice, not true:** "You've just proved probabilism is nice, which isn't the same as proving it's true."
       - Response: The accuracy-first argument is a normative one: if you care about accuracy (having beliefs that are close to the truth), then you should be probabilistically coherent. It doesn't say that you must care about accuracy, but if you do, then coherence is required to avoid being dominated.

  - What will go wrong:
    - **Rounding:** In round 2, we rounded to the nearest 10. Some might not like that. We can allow more precision if we precompute the table for 5% increments? Or we can use a calculator? But we can explain that rounding is for speed and the principle holds.
    - **The 50% person:** In round 1 and 2, someone might just say 50% for everything. In round 1, they get 50 tokens. In round 2, they get 75. So they might do okay. But in round 3, if they say (50,50,50) then their penalty for red is (50-100)^2 + (50)^2 + (50)^2 = 2500+2500+2500=7500. The adjusted set (33,33,33) gives 6667, which is better. So they see the benefit of coherence.
    - **Token math stops being fun:** We did a lot of calculations. We can assign the scorekeeper and envelope-runner to help. We can also use precomputed tables and graphs to make it faster.

  **The Gap:**
  The biggest gap is that in real life, we don't choose our beliefs arbitrarily; they are formed by evidence and constrained by our cognitive processes. The game treats credences as chosen reports, but in reality, beliefs are not always under voluntary control. Also, the quadratic scoring rule is just one way to measure accuracy, and it might not align with practical goals (e.g., in decision making). Moreover, the game simplifies by having the true probabilities be objective (like the urn draws), but in many cases, we are uncertain about subjective matters.

  **Materials List:**
  - Tokens: 200 (or use a scoring chart to avoid physical tokens for all rounds? We can use tokens for round 1 and then a chart for round 2 and 3.)
  - Whiteboard and markers.
  - Envelopes: 10-20 (for outcomes in round 3? but we are drawing chips so maybe not needed).
  - Urns (opaque containers): 3 (one for round 1, one for round 2, one for round 3). Each should have chips: round 1: red and blue in unknown mix (we can fix it to 60/40 or something). Round 2: another mix. Round 3: one red, one blue, one green.
  - Chips: 
     - Round 1: at least 20 red and blue (unknown mix, say 12 red and 8 blue).
     - Round 2: another set (say 15 red and 5 blue).
     - Round 3: one red, one blue, one green.
  - Dice and cups: optional, if we need to generate random numbers.
  - Timer.
  - Traveling trophy: a plastic crown or a silly hat.

  **Roles:**
  - Scorekeeper: 1-2 people (helps with calculations and tracking scores on the board).
  - Envelope-runner: 1 person (manages the chips and draws).
  - Devil's advocate: 1 person (encouraged to challenge and try to game the system).

  **Stakes:**
  - We'll keep a running total of tokens. The overall winner (highest total) gets the traveling trophy (and bragging rights). 
  - Alternatively, if tokens are not comparable across rounds, we can have a winner per round and then a final winner by total.

  This design should be engaging and demonstrate the key ideas without a lecture.
answer: |-
  Below is a complete design for your pub event on degrees of belief, structured as three escalating rounds. It adheres to your constraints: all uncertainties resolve in the room (using physical props), no math-heavy calculations, non-math roles for all, and a clear debrief mapping the game to accuracy-first epistemology. The focus is on experiential discovery—participants "run into" the key ideas before they're named.

  ---

  ### **Overview**
  - **Topic:** Accuracy-first epistemology (probabilistic coherence as accuracy optimization, not "fussy bookkeeping").
  - **Format:** Interactive game with 3 rounds (15 min each), debrief (10 min), total 70-75 min.
  - **Stakes:** Bragging rights + a "traveling trophy" (e.g., a garish plastic crown) for the highest cumulative score.
  - **Materials:** 
    - Urns/jars (3): One with 60 red/40 blue chips (Round 1), one with 70 green/30 yellow chips (Round 2), one with 1 red/1 blue/1 green chip (Round 3).
    - Chips (250 total): 100 red, 100 blue, 30 green, 20 yellow.
    - Envelopes (10): Pre-prepared with outcome slips (e.g., "RED" or "BLUE" for Round 3 propositions).
    - Tokens (200): Poker chips or buttons for payoffs.
    - Whiteboard: For scores and a "penalty grid" (pre-drawn; see Round 2).
    - Props: Dice, cups, spinner (for resolving uncertainties), timer.
  - **Roles (assign upfront):** 
    - **Scorekeeper (2 people):** Tracks tokens on the whiteboard. 
    - **Envelope-runner (1):** Manages envelopes/draws chips from urns. 
    - **Devil’s advocate (1):** Challenges rules/outcomes (encourages argument). 
    - **Others:** All report credences and participate in bets.

  ---

  ### **Round 1: The Maximalist Trap**  
  *Goal:* Show that rewarding "being right" incentivizes extreme reports (99%), not accuracy.  
  *Mechanics:*  
  - **Props:** Urn with 60 red/40 blue chips (unknown to group), tokens, dice.  
  - **Rules:**  
    1. Envelope-runner holds up the urn. "This has red/blue chips—unknown mix. I’ll draw one chip. Report your credence (0-100) that it’s RED."  
    2. Participants write their credence on slips. Devil’s advocate argues: "Why not just say 100?!"  
    3. Envelope-runner draws a chip (e.g., red).  
    4. **Payoff:** If red, you get your credence in tokens (e.g., 70% = 70 tokens). If blue, you get (100 - credence) tokens (e.g., 70% = 30 tokens).  
  - **Whiteboard:** Lists names, credences, payoffs.  
  - **What you say:**  
    - Intro: "We’re betting on red. Report your confidence. Get tokens if you’re ‘right’."  
    - Post-draw: "Who won? [Point to someone who reported 99% and won big.] But what if it was blue? [Point to a 99% reporter who’d get 1 token.] If you thought red was 60% likely, was 99% ‘right’?"  
    - Transition: "Feels like we’re rewarding luck, not honesty. Let’s fix that."  
  - **Timing:** 5 min setup, 5 min play, 5 min discussion.  
  - **Predicted bug:** Everyone reports 99% or 1%. The options trader brags about "winning," but the group agrees it’s unsatisfying (maximalism feels like gaming, not truth-seeking).  

  ---

  ### **Round 2: Honesty Pays**  
  *Goal:* Show that quadratic scoring (closeness-to-truth) incentivizes honest reports.  
  *Mechanics:*  
  - **Props:** Urn with 70 green/30 yellow chips (unknown), tokens, pre-drawn "penalty grid" on whiteboard (Table 1), spinner.  
  - **Rules:**  
    1. Envelope-runner holds new urn. "Now we’re drawing GREEN. Report your credence (0-100)."  
    2. **Payoff via penalty grid:** Use Table 1 to avoid calculations. After the draw, Scorekeeper gives tokens based on report and outcome:  
       - E.g., Report 70% and green? Token payoff = 91.  
       - Report 70% and yellow? Token payoff = 51.  

    **Table 1: Penalty Grid (Quadratic Scoring)**  
    | Report | Payoff if TRUE | Payoff if FALSE |  
    |--------|----------------|-----------------|  
    | 0      | 0              | 100             |  
    | 50     | 75             | 75              |  
    | 70     | 91             | 51              |  
    | 90     | 99             | 19              |  
    | 100    | 100            | 0               |  

    3. Spinner resolves uncertainty (50/50 chance for fun, but urn draw determines outcome).  
  - **Whiteboard:** Grid + scores.  
  - **What you say:**  
    - Intro: "New urn, new rule. Now your payoff depends on how close you are to the truth."  
    - Post-draw: "Look at the grid—reporting 50% gives 75 tokens no matter what. But if you thought green was 70% likely, which report maximizes your average tokens? [Pause.] 70%! Honesty pays."  
    - Transition: "But what if your beliefs clash? Let’s raise the stakes."  
  - **Timing:** 5 min setup, 5 min play, 5 min discussion.  
  - **Predicted bug:** Arithmetic haters still engage (Scorekeeper uses the grid; Devil’s advocate spins). The 50%-for-everything person gets middling scores—safe but uncompetitive.  

  ---

  ### **Round 3: The Incoherence Trap**  
  *Goal:* Show that incoherent beliefs are "accuracy-dominated"—a coherent set is always closer to truth.  
  *Mechanics:*  
  - **Props:** Urn with 1 red/1 blue/1 green chip, envelopes (3 labeled "RED?", "BLUE?", "GREEN?"), tokens, dice.  
  - **Rules:**  
    1. "Now we’re drawing one chip. Assign credences to three propositions:  
        - A: It’s RED.  
        - B: It’s BLUE.  
        - C: It’s GREEN.  
        Report numbers (0-100) for each. They needn’t add to 100!"  
    2. Envelope-runner draws a chip (e.g., red) and reveals it.  
    3. **Penalty calculation:** Scorekeeper computes "dumb" penalties for the true/false outcomes:  
       - Penalty = (100 - true credence)² + (false credence)² + (false credence)².  
       - **Example:** You report (A:40, B:40, C:40). Truth is A (red). Penalty = (100-40)² + (40)² + (40)² = 3600 + 1600 + 1600 = 6800.  
    4. **The trap:** You reveal a "coherent alternative" (scale their reports to sum to 100):  
       - E.g., (40,40,40) → (33,33,33).  
       - New penalty for A (red): (100-33)² + (33)² + (33)² = 4489 + 1089 + 1089 = 6667.  
       - **Key:** 6667 < 6800—better for truth A. Now show it’s better for B or C too:  
         - If B true: (33)² + (100-33)² + (33)² = 6667 (vs. original 6800).  
         - If C true: Same improvement.  
    5. Devil’s advocate chooses the next envelope to test (e.g., "What if it was blue?").  
  - **Whiteboard:** Penalty calculations side-by-side (original vs. coherent).  
  - **What you say:**  
    - Intro: "Three propositions—assign credences freely."  
    - Post-draw: "Look at these penalties. [Point to 6800 vs. 6667.] Coherent set wins. Now, what if blue was true? [Recalculate.] Still wins! Every possible world favors the coherent set."  
    - Transition to debrief: "Notice what happened? You got beaten by a set that ‘plays nice’ together."  
  - **Timing:** 5 min setup, 8 min play, 7 min discussion.  
  - **Predicted bug:** Some report incoherent sums (e.g., 150% total). Options trader tries to "outsmart" by reporting (100,100,0). Penalty for (100,100,0) if A is true: (0)² + (100)² + (0)² = 10,000 → worse than coherent (50,50,0) at 5,000. Group sees the folly.  

  ---

  ### **Debrief (10 min)**  
  Map the game to accuracy-first epistemology:  
  - **Round 1:** "Maximalism trap" → Why we need proper scoring rules. A reward for being "right" (binary scoring) fails because it ignores degrees of belief.  
  - **Round 2:** "Honesty pays" → Quadratic scoring rules incentivize truthful reports. Closeness-to-truth (accuracy) aligns with probabilistic coherence.  
  - **Round 3:** "Incoherence trap" → Non-probabilistic beliefs are accuracy-dominated. There’s always a coherent set strictly closer to truth in every possible world (a Dutch Book for accuracy).  

  **Anticipated Objections & Responses:**  
  1. **"My credences always seem best to me (immodesty)!"**  
     - Response: "The scoring rule doesn’t assume you’re right—it rewards accuracy *given your information*. If your evidence is bad, you’ll score poorly. This is about internal consistency, not omniscience."  

  2. **"Should I avoid evidence to keep my ‘accurate’ beliefs?"**  
     - Response: "No! Evidence updates your beliefs, making them *more* accurate. The scoring rule encourages you to seek evidence—your future self will score higher."  

  3. **"You proved probabilism is ‘nice,’ not true!"**  
     - Response: "Fair. This shows that if you value accuracy (avoiding dominance), coherence is necessary. But it doesn’t force you to care about accuracy—you might prioritize other things (e.g., speed, simplicity). Accuracy-first is for truth-seekers."  

  **Predictable Issues & Fixes:**  
  - **Rounding errors:** Use the penalty grid (Round 2) and whole numbers. Pre-calculate examples for Round 3.  
  - **The 50%-for-everything player:** In Round 2, they’ll score 75—decent but beatable. In Round 3, their incoherence (150% total) gets crushed, proving the point.  
  - **Token fatigue:** Assign roles so only Scorekeeper handles math. Use envelopes/urns for quick resolutions.  
  - **Options trader gaming:** Celebrate their attempts! Round 3 exposes why gaming fails (extreme reports incur huge penalties).  

  **The Unbridgeable Gap:**  
  - **Voluntariness of belief:** The game treats credences as chosen reports, but real beliefs aren’t always voluntary (e.g., you can’t "choose" to believe the sky is green). Address this in the debrief: "In life, beliefs *feel* involuntary, but we *can* align them with evidence. This game is about how to structure them when you do."  

  ---

  ### **Why This Works**  
  - **No trivia, no fact-checking:** All uncertainties resolve physically (urn draws, envelopes, spinners).  
  - **No math phobia:** Roles like Scorekeeper (uses grid), Envelope-runner, and Devil’s advocate keep everyone active.  
  - **Stakes feel real:** Tokens + trophy create competition; forfeits (e.g., buying a round) optional.  
  - **Discovery-focused:** They encounter incoherence dominance (Round 3) before learning the term.  
  - **Pragmatic:** Pre-drawn grids, pre-mixed urns, and physical props minimize setup.  

  This design turns abstract epistemology into a tactile, argument-pub experience. Run it as-is, and the group will surface the key insights themselves—no lecture needed.
