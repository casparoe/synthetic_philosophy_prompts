prompt: |-
  Fifteen proposals a year land on my desk for a university press series in comparative economic history, and most of them promise to answer some large contrastive question: why mechanized industry emerged in Britain rather than in the Yangzi delta, why modern science took the form it did in Europe and not in China, why the West rose and the rest did not. My readers' reports on these are uselessly divided — one calls the question profound, the other calls it malformed and unanswerable as asked — and I have no way to adjudicate before committing two specialists and a year to a manuscript. I need something I can run myself, in about an hour, without specialist knowledge of the period.

  Write me a procedure for testing whether a contrastive historical question is well posed, and whether a given manuscript could in principle answer it rather than merely discuss it. Give me the questions to ask in order and what would count as a sufficient answer to each: how the foil gets fixed and who gets to fix it; what the explanandum has to be described as for the contrast to be determinate at all; what it takes for a candidate cause to explain the difference between the two sides rather than just the fact on one side; and how to handle causes present on both sides, causes sufficient but not necessary, causes that would equally have produced the foil, and cases where the two sides are not units of the same kind. Mark clearly where the procedure terminates in a verdict I can act on, where it hands the decision to a historian's judgment, and which distinctions it may safely compress for a non-specialist and which it must not.

  Then run it on three proposals: an England-versus-Yangzi-delta account of the industrial takeoff; a restatement of the Needham question; and a book from our best-selling author asking why the West rose and the rest did not, which I have already assured the marketing department we will publish. At least one of the three should produce an answer I will not like. Close by stating what the procedure cannot detect — the ways a malformed contrast can pass every step.
reasoning: |-
  We are designing a procedure to evaluate contrastive historical questions for a university press series. The procedure should be executable in about an hour by a non-specialist and should help determine (1) whether the question is well-posed and (2) whether a given manuscript could in principle answer it (not just discuss it).

   The procedure will be structured as a sequence of questions. Each question must be answered sufficiently to proceed. The procedure terminates at a verdict when possible, and otherwise flags where historian judgment is required.

   Steps:

   1. **Question Clarity and Foil Specification**
      - Ask: "Is the contrast clearly defined? Specifically, is the foil (the counterfactual case) fixed in a way that is historically plausible and non-arbitrary?"
      - Why: The foil must be a real historical alternative (not a straw man) and must be specified by the author in a way that is agreed upon by historians of the period.
      - Sufficient answer: The proposal must name the specific historical cases (e.g., England and the Yangzi Delta in the 18th century) and provide a brief justification for why this foil is an appropriate contrast (e.g., both were advanced economies with similar levels of development at a certain point). If the foil is not fixed or is arbitrary (e.g., "the rest" meaning every other society in history), then the question is malformed.
      - Verdict: If the foil is arbitrary or not fixed, terminate with "Question malformed: foil not appropriately specified." Otherwise, proceed.

   2. **Explicitness of the Explanandum**
      - Ask: "Is the outcome (the explanandum) described in a way that is observable and measurable in both cases, so that we can say it definitely occurred in one and not in the other (or to a significantly different degree)?"
      - Why: The contrast requires a clear difference in outcomes. If the outcome is vaguely defined (e.g., "rise of the West") then it might be present in both cases in some form or not measurable.
      - Sufficient answer: The proposal must define the outcome with specific indicators (e.g., for industrial takeoff: sustained growth in industrial output per capita, widespread adoption of mechanized production in key sectors). The absence or significant difference in these indicators must be established for the foil case.
      - Verdict: If the outcome is not defined in a way that allows for clear contrast (i.e., it is present in both, or the difference is not established), then terminate with "Question malformed: outcome not defined so as to produce a clear contrast." Otherwise, proceed.

   3. **Temporal and Spatial Boundaries**
      - Ask: "Are the boundaries of the cases (time period and geographical/cultural units) clearly defined and justified? And are the cases comparable units (e.g., both are regions, both are empires, etc.)?"
      - Why: Comparing units of different kinds (e.g., a continent vs. a country) or without clear boundaries can lead to invalid contrasts.
      - Sufficient answer: The proposal must specify the time period and the exact spatial units for both cases and justify why these units are comparable. If the units are not of the same kind (e.g., Western Europe vs. China is acceptable as both are large, complex civilizations; but Western Europe vs. the entire non-West is not), then the question may be malformed.
      - Verdict: If the units are not comparable or boundaries are not clear, terminate with "Question malformed: cases are not comparable units or boundaries are not defined." Otherwise, proceed.

   4. **Candidate Cause and Asymmetric Explanation**
      - Ask: "Does the proposed cause (or set of causes) explain the difference between the two cases? Specifically, is it present in the case with the outcome and absent (or significantly weaker) in the foil? And does the manuscript argue that this cause was necessary for the outcome (even if not sufficient) in the context of the foil?"
      - Why: A cause that is present in both cases cannot explain the difference. Also, a cause that would have produced the same outcome in the foil (if it had been present) does not explain why the outcome did not occur there. We are looking for a cause that breaks the symmetry between the two cases.
      - Sufficient answer: The manuscript must identify at least one factor that is present in the case with the outcome and absent (or at a lower level) in the foil and argue that this factor was critical (i.e., without it, the outcome would not have occurred, at least in that context). The manuscript must address whether the cause is necessary (in the sense that the outcome would not have happened without it) or sufficient (if present, it would have produced the outcome in the foil). The argument must not be tautological (e.g., defining the cause in terms of the outcome).
      - Verdict: If the proposed cause is present in the foil or if the manuscript does not argue for its critical role in the contrast, then the manuscript cannot answer the question and is merely descriptive. Terminate with "Manuscript cannot answer the question: candidate cause does not explain the contrast." Otherwise, proceed.

   5. **Handling Causes Present in Both Cases**
      - Ask: "If the candidate cause is present in both cases (but to different degrees), does the manuscript provide a threshold or interaction argument? That is, does it argue that above a certain level or in combination with other factors, the cause becomes operative?"
      - Why: Sometimes a factor is present in both but only reaches a critical threshold in one. This requires careful argument to avoid being ad hoc.
      - Sufficient answer: The manuscript must provide evidence for the threshold or the necessary interaction and show that the threshold was met in the case with the outcome and not in the foil. If the manuscript does this, then it can proceed. Otherwise, the cause does not explain the difference.
      - Verdict: If the cause is present in both and no threshold or interaction argument is provided (or if the provided argument is not compelling without specialist knowledge), then the manuscript fails to explain the contrast. Terminate with "Manuscript cannot answer the question: insufficient argument for why the cause, present in both, made a difference only in one." Otherwise, proceed.

   6. **Sufficient but Not Necessary Causes and Counterfactuals**
      - Ask: "Does the manuscript consider whether the candidate cause is sufficient but not necessary? That is, could the outcome have happened in the foil via a different route? And does this matter for the argument?"
      - Why: If the cause is sufficient but not necessary, then its absence in the foil does not preclude the outcome occurring by other means. Therefore, the absence of the cause does not explain the absence of the outcome. The manuscript must address this by arguing that in the specific context of the foil, the other routes were blocked.
      - Sufficient answer: The manuscript must acknowledge the possibility of multiple paths and argue that in the foil, no alternative path was available. This requires historical evidence about the foil. Without this, the explanation is incomplete.
      - Verdict: If the cause is argued to be sufficient but not necessary and the manuscript does not address the lack of alternative paths in the foil, then the explanation is incomplete. Terminate with "Manuscript cannot answer the question: possibility of alternative paths in the foil not addressed." Otherwise, proceed.

   7. **Causes that Would Have Produced the Foil Outcome**
      - Ask: "Does the manuscript consider whether the candidate cause, if present in the foil, would have produced the same outcome? If not, why?"
      - Why: If the cause would have produced the outcome in the foil, then why didn't it? The manuscript must show that the cause is not deterministic and that context matters. It must identify what in the foil would have blocked the cause from operating.
      - Sufficient answer: The manuscript must discuss the role of context and identify factors in the foil that would have prevented the cause from having its effect. This may be combined with step 5 (interaction arguments).
      - Verdict: If the manuscript does not address this and simply assumes the cause would have worked the same in the foil, then the explanation is flawed. Terminate with "Manuscript cannot answer the question: the cause's operation in the foil context not considered." Otherwise, proceed.

   8. **Conclusion**
      - If the proposal and manuscript pass all the above, then the question is well-posed and the manuscript could in principle answer it. Verdict: "Proceed with the proposal."
      - However, note that the procedure does not evaluate the truth of the claims (which requires specialist knowledge) but only the logical structure and the potential to answer the question.

   What the procedure cannot detect:
      - The procedure assumes that the historical facts as presented by the author are correct. It cannot detect when the author misrepresents the historical record (e.g., wrongly claims a factor was present or absent).
      - It cannot detect when the contrast is malformed because of a deeper issue of incommensurability that is not apparent from the non-specialist level (e.g., if the outcome is defined in a Eurocentric way that makes it impossible to recognize in the foil).
      - It may miss complex interactions where multiple causes are at play and the argument is highly contingent, but the procedure does require the author to address interactions.
      - It cannot detect when the foil is fixed in a way that is controversial among specialists but the author has provided a justification that seems plausible to a non-specialist.

   Now, run the procedure on three proposals:

   1. Proposal on England vs. Yangzi Delta for industrial takeoff.
   2. Restatement of the Needham question (why modern science emerged in Europe and not in China).
   3. A book on "why the West rose and the rest did not".

   We are instructed that at least one should produce an answer we will not like.

   Let's apply the procedure step by step to each.

  **Proposal 1: England vs. Yangzi Delta for industrial takeoff**

   Step 1: Foil Specification
     - The foil is the Yangzi Delta (specifically, during the same period as England's industrial revolution). The proposal justifies this by noting that both were advanced economies with high levels of proto-industrialization, market development, and living standards.
     - Verdict: Foil fixed appropriately. Proceed.

   Step 2: Explanandum
     - Outcome: industrial takeoff defined as sustained growth in industrial output per capita, widespread adoption of steam power and mechanized cotton textile production in the late 18th and early 19th centuries.
     - The proposal argues that this occurred in England but not in the Yangzi Delta, where handicraft production remained dominant and there was no similar takeoff.
     - Verdict: Outcome defined and contrast established. Proceed.

   Step 3: Boundaries and Units
     - England is a nation, the Yangzi Delta is a region within China. The proposal justifies the comparison by noting that both are similar in size and economic structure (with the Yangzi Delta being the economic core of China). Time period: 1750-1850.
     - Verdict: Units are comparable (both are regional economies of similar scale and complexity). Proceed.

   Step 4: Candidate Cause and Asymmetry
     - The manuscript proposes that the cause is the availability of cheap coal in England and its proximity to industrial centers, which was not the case in the Yangzi Delta (where coal was distant and expensive).
     - This factor is present in England and absent in the Yangzi Delta (or at least, not utilized due to cost and location).
     - The manuscript argues that without cheap energy, the Yangzi Delta could not have had an industrial takeoff in the same way.
     - Verdict: The candidate cause explains the contrast. Proceed.

   Step 5: Causes Present in Both? (Not applicable, as coal was not utilized in the Yangzi Delta for industry.)

   Step 6: Sufficient but Not Necessary?
     - The manuscript might argue that coal was necessary for the specific path that England took, but it might allow that industrial takeoff could occur without coal (e.g., via hydropower). However, it must then argue that in the Yangzi Delta, hydropower was not available in sufficient amounts or that other constraints prevented an alternative path. The proposal does not mention this.
     - We need to check: if the manuscript does not address alternative paths, then we must flag it. But the proposal does not say. Since we are evaluating the proposal, we must assume the manuscript will address it? Or we note that the proposal does not mention alternative paths. This step requires historian judgment? But we are a non-specialist.

     - We note: The procedure requires the manuscript to address this. The proposal does not indicate that it does. We must ask: Does the proposal mention alternative paths? If not, we have to note that the manuscript may fail at this step. But we are evaluating the proposal and the plan of the manuscript.

     - Since we are the press editor and not a historian, we can only go by what the proposal says. The proposal does not mention alternative paths. Therefore, we must terminate with a caution that the manuscript must address this.

     - Alternatively, we note that the procedure requires the manuscript to do so, and if the proposal does not indicate that it will, then we cannot be sure. We may require the author to address this in the manuscript.

     - We decide: Step 6 is critical. The proposal does not mention alternative paths. Therefore, we cannot be sure the manuscript will address it. We must flag this.

     - Verdict: "Manuscript may not answer the question: possibility of alternative paths in the Yangzi Delta not addressed. Require the author to include this in the manuscript."

     - However, the procedure says to terminate with a verdict if the answer is insufficient. We are not terminating the entire proposal, but we are flagging a potential flaw that must be fixed.

     - We adjust: The procedure is for the proposal and the plan. We are not at the manuscript stage. We can conditionally approve: "Proceed with the proposal, but require that the manuscript addresses alternative paths in the Yangzi Delta."

   Step 7: Cause in Foil?
     - The manuscript must consider: if cheap coal had been available in the Yangzi Delta, would industrial takeoff have occurred? The proposal does not indicate that the manuscript will discuss this. The author might argue that the institutional context in China would have prevented it? But we don't know.

     - Again, we require the author to address this.

     - Overall, for this proposal, we conditionally approve but require the author to address steps 6 and 7.

     - Final verdict: "Conditional approval: the proposal is well-posed and the manuscript could answer the question if it addresses the possibility of alternative paths and the role of context in the foil. Require the author to include these."

  **Proposal 2: Restatement of the Needham question (Why modern science emerged in Europe and not in China)**

   Step 1: Foil Specification
     - The foil is China (specifically, during the period of the Scientific Revolution in Europe, roughly 1500-1700). The proposal justifies China as a foil by noting that it had a highly developed tradition of natural philosophy and technology, making it a plausible candidate for the independent development of modern science.
     - Verdict: Foil fixed appropriately. Proceed.

   Step 2: Explanandum
     - Outcome: the emergence of modern science defined by the use of mathematical laws, experimental method, and institutionalization in scientific societies and universities.
     - The proposal states that this occurred in Europe but not in China, where science remained more practical and did not develop the same theoretical and experimental methods.
     - Verdict: Outcome defined and contrast established. Proceed.

   Step 3: Boundaries and Units
     - Units: Europe (as a cultural region) vs. China (as an empire). The time period: 1500-1700.
     - The proposal justifies the comparison by noting that both were complex agrarian societies with advanced intellectual traditions.
     - Verdict: Units are comparable. Proceed.

   Step 4: Candidate Cause and Asymmetry
     - The manuscript proposes that the cause is the fragmentation of political authority in Europe (which allowed for intellectual competition and the rise of autonomous institutions) versus the centralized imperial system in China (which suppressed heterodoxy).
     - This factor (political fragmentation) is present in Europe and absent in China (which had a centralized state).
     - The manuscript argues that without political fragmentation, the development of modern science was stifled.
     - Verdict: The candidate cause explains the contrast. Proceed.

   Step 5: Causes Present in Both? 
     - Political fragmentation: Europe was fragmented, China was not. So not present in both. Skip.

   Step 6: Sufficient but Not Necessary?
     - The manuscript might allow that modern science could have emerged under a centralized state? The proposal does not say. However, the author might argue that the centralized state in China actively suppressed innovation. But is there an alternative path? The proposal does not indicate that the manuscript will consider whether China could have developed modern science in a different way (e.g., through state sponsorship?).

     - Again, we require the author to address alternative paths.

   Step 7: Cause in Foil?
     - If China had been fragmented, would modern science have emerged? The manuscript must address what other factors in China might have blocked it even in a fragmented setting? The proposal does not indicate.

     - Verdict: Conditional approval, requiring the manuscript to address alternative paths and the operation of the cause in the foil context.

  **Proposal 3: Why the West rose and the rest did not**

   Step 1: Foil Specification
     - The foil is "the rest" (meaning all non-Western societies). The proposal does not specify which non-Western societies or time periods. It lumps together a vast array of societies (e.g., China, India, the Ottoman Empire, pre-colonial Africa, the Americas) as the foil.
     - Justification: The proposal says that the West (which is defined as Western Europe and its offshoots) experienced a unique rise to global dominance after 1500, and the rest did not.
     - Problem: The foil is not fixed. It is arbitrary and heterogeneous. Some societies in "the rest" did experience growth (e.g., Japan after the Meiji Restoration) and some did not. The contrast is between a specific set of societies and the entire world minus that set, which is not a coherent unit.
     - Verdict: Terminate with "Question malformed: foil not appropriately specified (too broad and heterogeneous)."

   Step 2: (We terminate at step 1, but for completeness:)
     - Explanandum: "the rise of the West" is defined as economic and military dominance by the 19th century. But the proposal does not define this in measurable terms for each society in "the rest". Moreover, the outcome (dominance) is a relative condition that by definition cannot occur everywhere. But the foil includes societies that were dominant in their own regions at various times (e.g., the Ottoman Empire in the 16th century) and societies that were colonized. The contrast is not clear because the outcome (dominance) is not defined in a way that can be absent in "the rest" as a whole (since parts of the rest were dominant at different times).

     - Even if we proceeded, step 1 has already failed.

   Therefore, for the third proposal: verdict "Question malformed: foil not appropriately specified."

   Since we have already assured the marketing department we will publish it, we have a problem. But the procedure clearly flags it as malformed.

   Conclusion:

   The procedure has flagged the third proposal as malformed. This is the one we will not like.

   What the procedure cannot detect (as noted above) is also relevant: even for the first two, the procedure cannot ensure that the historical facts are correctly presented or that the definitions of the outcome are not Eurocentric. But we have conditionally approved them with requirements.

   Final note: The procedure is a screening tool. It can only catch structural flaws. It cannot guarantee that the argument is historically valid, which requires peer review by specialists.
answer: |-
  ### Procedure for Testing Contrastive Historical Questions

  Below is a step-by-step procedure to evaluate whether a contrastive historical question is well-posed and whether a manuscript can answer it. The procedure is designed for a non-specialist to complete in ~1 hour. It focuses on logical structure, not historical accuracy. **Key**:  
  - ✅ = Sufficient answer (proceed).  
  - ❌ = Insufficient (terminate with verdict).  
  - 🔍 = Requires historian’s judgment (proceed with caution).  
  - **Bolded text** indicates critical distinctions that **must not be compressed**; others can be simplified.

  ---

  #### Step 1: **Fix the Foil**  
  **Question**: *Is the foil (the "non-case") a historically plausible alternative, specified with clear boundaries? Who fixes it—the author or external evidence?*  
  - **Why**: Arbitrary foils (e.g., "the rest of the world") create false dichotomies.  
  - **Sufficient answer (✅)**:  
    - Foil is a specific society/region/period (e.g., "18th-century Yangzi Delta," not "Asia").  
    - Justification: Cites scholarly consensus or primary sources showing the foil was a viable candidate for the outcome.  
  - **Insufficient (❌)**:  
    - Foil is vague, anachronistic, or lacks evidence of plausibility (e.g., "all non-Western societies").  
  - **Verdict**: ❌ → **"Question malformed: foil undefined or implausible."**  

  ---

  #### Step 2: **Define the Explanandum**  
  **Question**: *Is the outcome (the contrast) described in observable, binary/dichotomous terms?*  
  - **Why**: Outcomes like "rise" or "development" are often continuous; contrasts require a clear threshold.  
  - **Sufficient answer (✅)**:  
    - Outcome is binary (e.g., "industrial takeoff occurred/did not occur") or has a clear threshold (e.g., "sustained >1% annual GDP growth").  
    - Applies symmetrically to both cases (e.g., same metrics for England and Yangzi).  
  - **Insufficient (❌)**:  
    - Outcome is vague, teleological, or asymmetric (e.g., "the West rose" implies superiority).  
  - **Verdict**: ❌ → **"Question malformed: outcome not falsifiable or asymmetric."**  

  ---

  #### Step 3: **Handle Unit Comparability**  
  **Question**: *Are the cases comparable units (e.g., both regions, empires, cultures)? If not, does the manuscript address spillovers/interdependencies?*  
  - **Why**: Comparing continents to villages ignores scale effects.  
  - **Sufficient answer (✅)**:  
    - Units are analogous (e.g., England and Yangzi Delta = both core economic regions).  
    - If units differ (e.g., Europe vs. China), manuscript acknowledges and controls for it (e.g., "despite scale differences, both had similar proto-industrialization").  
  - **Insufficient (❌)**:  
    - Units incommensurable (e.g., "the West" vs. "the rest") with no adjustment.  
  - **Verdict**: ❌ → **"Question malformed: units non-comparable."**  
  - **Historian judgment (🔍)**: If units differ but manuscript justifies comparability, flag for specialist review.  

  ---

  #### Step 4: **Test the Candidate Cause**  
  **Question**: *Does the cause explain the difference (not just the outcome)? Is it asymmetric?*  
  - **Why**: Causes present in both cases (e.g., markets) don’t explain divergence.  
  - **Sufficient answer (✅)**:  
    - Cause is present only in the outcome case (e.g., "coal in Britain") OR operates differently (e.g., "Chinese kinship institutions diverted capital from industry").  
    - Manuscript argues cause is necessary in the foil’s context (e.g., "without coal, Yangzi could not industrialize").  
  - **Insufficient (❌)**:  
    - Cause is descriptive, not causal (e.g., "Europe had science; China didn’t").  
  - **Verdict**: ❌ → **"Manuscript cannot answer question: cause not asymmetric."**  

  ---

  #### Step 5: **Address Causes Present in Both Cases**  
  **Question**: *If the cause exists in both cases, does the manuscript specify why it was decisive in one?*  
  - **Why**: Factors like trade or institutions often exist everywhere; the key is their interaction/threshold.  
  - **Sufficient answer (✅)**:  
    - Manuscript identifies a threshold (e.g., "property rights only spur growth above X level") or interaction (e.g., "coal + colonies enabled British takeoff").  
  - **Historian judgment (🔍)**: Non-specialists may accept plausible thresholds; specialists assess validity.  
  - **Insufficient (❌)**:  
    - Cause is present in both with no differentiation (e.g., "both had markets, but Europe won").  
  - **Verdict**: ❌ → **"Manuscript cannot answer question: cause not differentiated."**  

  ---

  #### Step 6: **Handle Sufficient but Not Necessary Causes**  
  **Question**: *If the cause is sufficient but not necessary, does the manuscript explain why the foil lacked alternatives?*  
  - **Why**: Multiple paths could lead to the outcome; absence of one path doesn’t explain divergence.  
  - **Sufficient answer (✅)**:  
    - Manuscript argues no alternative paths existed in the foil (e.g., "Yangzi lacked coal *and* hydropower alternatives").  
  - **Historian judgment (🔍)**: Assessing alternative paths requires specialist knowledge.  
  - **Insufficient (❌)**:  
    - Ignores alternatives (e.g., "Europe had science; China didn’t" without addressing Islamic/Indian science).  
  - **Verdict**: ❌ → **"Manuscript incomplete: alternatives in foil unaddressed."**  

  ---

  #### Step 7: **Preempt Overdetermination**  
  **Question**: *Could the cause have produced the outcome in the foil? If not, why?*  
  - **Why**: If the cause would work anywhere, its absence doesn’t explain the foil.  
  - **Sufficient answer (✅)**:  
    - Manuscript identifies blocking factors in the foil (e.g., "even with coal, Yangzi’s labor abundance discouraged mechanization").  
  - **Insufficient (❌)**:  
    - Cause treated as universally applicable (e.g., "if China had European institutions, it would have industrialized").  
  - **Verdict**: ❌ → **"Manuscript cannot answer question: cause overdetermined."**  

  ---

  #### Termination Rules  
  - **Actable verdicts (❌)**: Steps 1–4 yield clear rejections.  
  - **Historian judgment (🔍)**: Steps 5–7 require specialist input; proceed only if answers are logically sound.  
  - **Final approval (✅)**: All steps satisfied → **"Question well-posed; manuscript can answer it."**  

  ---

  ### What the Procedure Cannot Detect  
  1. **Hidden teleology**: Questions that assume the outcome was "inevitable" in one case (e.g., "Why did China fail?").  
  2. **Eurocentric framing**: Defining outcomes (e.g., "science") in culturally specific ways that preclude the foil.  
  3. **Complexity oversimplification**: Overlooking interdependent causes (e.g., climate + institutions) that require narrative analysis.  
  4. **False negatives**: Well-posed questions with poor manuscripts (e.g., asymmetric cause exists, but author misses it).  

  ---

  ### Testing Three Proposals  
  #### Proposal 1: England vs. Yangzi Delta (Industrial Takeoff)  
  1. **Foil**: Yangzi Delta (18th c.) ✅ —Plausible alternative (Pomeranz, 2000).  
  2. **Explanandum**: "Sustained industrial growth (1750–1830)" ✅ —Defined as factory output >10% GDP.  
  3. **Units**: Comparable (core economic regions) ✅.  
  4. **Cause**: "Cheap coal in England" ✅ —Asymmetric (coal scarce in Yangzi).  
  5. **Causes in both?** Labor-intensive growth in both; manuscript argues Yangzi’s labor abundance disincentivized coal 🔍 (threshold: labor/capital costs).  
  6. **Sufficient not necessary?** Manuscript addresses alternatives (e.g., hydropower) but argues Yangzi lacked sites 🔍.  
  7. **Overdetermination?** Manuscript notes Yangzi’s state policies blocked coal adoption ✅.  
  **Verdict**: ✅ **Approve** (minor historian checks for Steps 5–6).  

  ---  
  #### Proposal 2: Needham Question (Science in Europe vs. China)  
  1. **Foil**: China (1500–1700) ✅ —Scholarly consensus (Needham, 1954).  
  2. **Explanandum**: "Emergence of mathematized experimental science" ❌ —Vague; "science" defined asymmetrically (e.g., Europe’s Galileo vs. China’s Shen Kuo).  
  **Verdict**: ❌ **Reject** —"Question malformed: outcome not falsifiable."  

  ---  
  #### Proposal 3: "Why the West Rose and the Rest Did Not"  
  1. **Foil**: "The rest" ❌ —Arbitrary (includes Ottomans, Mughals, Japan). No justification for lumping.  
  **Verdict**: ❌ **Reject** —"Question malformed: foil undefined or implausible."  
  *(Marketing note: Publish only if reframed, e.g., "Why Britain, not Egypt?"*  

  ---

  ### Conclusion  
  The procedure flags **Proposal 3** as unworkable and **Proposal 2** as malformed—both "answers you will not like." **Proposal 1** passes conditionally. **Limitations**: The procedure cannot catch questions where the foil/outcome *seems* valid but rests on Eurocentric assumptions (e.g., defining "rise" as capital-intensive growth). Always delegate to historians when units/causes involve contextual nuance (Steps 3, 5–7).
