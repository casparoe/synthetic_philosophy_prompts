answer: |-
  ### Essay Question: Precautionary Principle and Baseline Ambiguity (25 marks)  
  **Time Allocation:** 2 hours  
  **Word Guideline:** 800–1,000 words  

  ---

  **Case:**  
  A water utility (200,000 customers) detects fungicide metabolite *F-met* at 6 µg/L in its intake. An established association exists between F-met and developmental defects at ≥25 µg/L, but the dose-response below 25 µg/L is unknown, with no consensus on a threshold. Three options are proposed:  
  - **(A) Status quo:** No additional treatment; quarterly monitoring continues.  
  - **(B) Ozonation retrofit:** Reduces F-met by ~85% but generates bromate (well-characterized dose-response, small quantifiable excess risk).  
  - **(C) New catalytic medium:** Reduces F-met by >99% but sheds an uncharacterized breakdown product. Shedding varies seasonally; no probability estimate for harm exists.  

  **The Board’s Rule (verbatim):**  
  > *"Where an activity raises plausible threats of serious or irreversible harm, and the causal pathways to that harm are not established with confidence, the activity shall not proceed and the burden of demonstrating safety falls on those proposing it."*  

  **Task:**  
  1. **Demonstrate** that the Board’s rule delivers contradictory verdicts on Options A, B, and C under three defensible baselines:  
     - (i) Pre-detection operations (no F-met detection),  
     - (ii) Current operations (F-met at 6 µg/L),  
     - (iii) Each proposed option *as the activity*. (8 marks)  
  2. **Explain** why a "maximin" or "reasonable worst-case" interpretation fails to resolve indeterminacy, particularly for Option C. (5 marks)  
  3. **Argue decisively** for *one* method to fix the baseline problem. Reject alternatives and show how your solution:  
     - Avoids licensing inaction (*e.g.,* ignoring Option A’s risks),  
     - Avoids a blanket veto (*e.g.,* paralyzing all options),  
     - Specifies whether the rule yields a unique recommendation here. (12 marks)  

  ---

  ### Model Answer (710 words)  
  The Board’s rule—while seemingly straightforward—collapses into contradiction when applied to the water utility case, due to irreducible ambiguity in defining "an activity." Resolving this requires fixing the baseline as *the proposed intervention itself* and demanding comparative risk assessment, rejecting both maximalist and static interpretations.  

  **1. Contradictory Verdicts Under Three Baselines**  
  Under the *pre-detection* baseline (i), Option A (status quo) becomes "an activity" raising a "plausible threat": F-met’s unknown dose-response below 25 µg/L constitutes unestablished causal pathways for potential developmental harm. The rule thus forbids Option A unless proponents prove safety (impossible given epistemic gaps). Yet Options B and C are "activities" too: B generates quantifiable bromate risks; C introduces an uncharacterized toxin. Both face vetoes unless safety is proven—equally impossible for C. The rule now forbids *all* options, including inaction.  

  Under the *current operations* baseline (ii) (F-met at 6 µg/L), Option A is no longer "proceeding" but *continuing*. Only B and C are "activities." B’s bromate risk is quantifiable, so causal pathways *are* "established with confidence"—it escapes the rule. C’s novel toxin, however, has no characterized pathway, triggering the veto. Option A persists with no new burden. Here, the rule permits A and B but forbids C.  

  Under the *proposed-option-as-activity* baseline (iii), each choice is evaluated independently. A "raises threats" via uncertain low-dose F-met risks → vetoed. B "raises threats" via bromate → vetoed (unless safety proven). C "raises threats" via unknown breakdown product → vetoed. Again, all options collapse.  

  The rule’s verdict shifts violently: it mandates inaction (i), rejects only C (ii), or forbids everything (iii). None coherently addresses the problem.  

  **2. Why Maximin Fails (Especially for Option C)**  
  Maximin ("avoid the worst plausible outcome") appears promising but founders on Option C’s radical uncertainty. For Options A and B, worst cases are bounded: A’s worst case is developmental harm at 6 µg-L (uncertain probability); B’s is bromate morbidity (quantified). Option C’s worst case is undefined—the uncharacterized toxin could be benign or catastrophic. Maximin here either:  
  - Demands avoiding C (if we imagine apocalyptic outcomes), *or*  
  - Cannot apply (with no probabilities, "worst case" is speculative).  
  Yet PP is meant for *precisely* such unquantifiable threats. The rule’s burden-shifting ("demonstrate safety") is its core mechanism—but Option C’s proponents cannot meet this burden. Maximin thus offers no escape: it either defaults to vetoing C arbitrarily or admits paralysis.  

  **3. The Solution: Baseline as Intervention + Comparative Burdens**  
  The only non-arbitrary baseline is evaluating *the proposed change itself*. "The activity" must mean *the deviation from current operations*, and the rule must incorporate two repairs:  
  > **Repaired Rule:** *"Where a* ***proposed intervention*** *raises plausible threats of serious/irreversible harm relative to the status quo, and causal pathways are unestablished, the intervention shall not proceed unless proponents (a) demonstrate superior safety versus alternatives, and (b) accept ongoing liability for undiscovered harms."*  

  This resolves the contradictions:  
  - **Option A** (inaction) is no longer "proceeding" but *persisting*. Its risks are grandfathered *unless* a superior alternative exists.  
  - **Option B** is a "proposed intervention" generating bromate. Its threat (quantifiable risk) is "established," so PP *does not apply*. It proceeds if benefits (F-met reduction) outweigh bromate risks.  
  - **Option C** *is* a PP trigger: uncharacterized toxin, unestablished pathways. Proponents must prove safety *comparatively*—*e.g.*, show C is safer than A or B. Since they cannot, C is vetoed.  

  **Why this works:**  
  - **Avoids blanket veto:** Current operations (A) persist absent better options. B escapes PP via known risks.  
  - **Avoids licensing inaction:** If C *could* prove superior safety (unlikely here), it would be allowed.  
  - **Unique verdict here:** The rule permits A (monitored) and B (risk-managed bromate) but forbids C.  
  - **Handles uncertainty:** PP binds only novel, unquantifiable threats (C), not quantified (B) or extant (A) risks.  

  **Rejected alternatives:**  
  - *Pre-detection baseline:* Paralyzes all action by ignoring sunk risks. Unrealistic in dynamic systems.  
  - *Status quo as sacred:* Immunizes current harms (A’s F-met) from scrutiny, violating PP’s intent.  
  - *Maximin as override:* Fails when worst cases are incomparable (C vs. A) or unquantifiable.  

  The Board’s rule, repaired, yields a clear outcome: reject Option C until its proponents characterize the breakdown product. This preserves PP’s burden-shifting for true uncertainties while permitting measured action.  

  ---

  ### Marking Scheme (Total 25)  
  | **Criteria**                                                                 | **Marks** | **Penalties**                                                                                                |  
  |-----------------------------------------------------------------------------|-----------|-------------------------------------------------------------------------------------------------------------|  
  | **1. Baseline Contradictions (8 marks)**                                       |           |                                                                                                             |  
  | ∙ Clearly contrasts verdicts under *pre-detection baseline* (all options vetoed) | 2         | –0.5 if missing one option; –1 if misrepresents verdict                                                     |  
  | ∙ Clearly contrasts verdicts under *current operations baseline* (only C vetoed) | 2         | –1 if misattributes trigger (e.g., says B is vetoed)                                                        |  
  | ∙ Clearly contrasts verdicts under *proposed-as-activity baseline* (all vetoed) | 2         | –1 if omits A’s veto                                                                                        |  
  | ∙ Identifies *why* verdicts shift (ambiguity in "activity" framing)            | 2         | –1 if only describes contradictions without linking to baseline framing                                     |  
  | **2. Maximin Failure (5 marks)**                                              |           |                                                                                                             |  
  | ∙ Explains maximin’s appeal for bounded risks (A/B)                            | 1         | –0.5 if superficial                                                                                         |  
  | ∙ Details failure for Option C (no "worst case" to quantify/compare)           | 2         | –1 if claims maximin resolves C; –0.5 if omits comparison to A/B                                            |  
  | ∙ Notes that PP’s burden-shifting is crippled when no evidence exists          | 2         | –1 if ignores burden of proof; –0.5 if doesn’t tie to Rule’s text                                           |  
  | **3. Baseline Repair & Verdict (12 marks)**                                   |           |                                                                                                             |  
  | ∙ **Defends one baseline** (e.g., proposed intervention) *decisively*          | 3         | –1 if hedges; –2 if surveys options neutrally; –1 if baseline not explicitly named                          |  
  | ∙ **Repairs the rule** to avoid inaction *and* blanket veto                    | 3         | –1 if repair allows inaction (e.g., immunizes A); –1 if repair paralyzes all action                         |  
  | ∙ **Rejects two alternatives** (e.g., pre-detection/status quo/maximin)        | 3         | –1 per incomplete/missing rejection; –1 if rejection not justified                                          |  
  | ∙ **Specifies unique verdict** (e.g., "Reject C; permit A/B")                  | 2         | –1 if ambiguous; –2 if no verdict                                                                           |  
  | ∙ **Justification** ties repair to PP’s core intent (burden-shifting for uncertainty) | 1         | –1 if justification absent                                                                                  |  
  | **Penalty for reciting generic PP criticisms**                                |           | **–4** if >50% of answer rehashes vagueness/self-defeat without engaging baselines                          |  
  | **Penalty for "it depends" without resolution**                               |           | **Caps at 12/25** if contradictions shown but no repair/verdict offered                                     |  

  ---

  **Key for Grading:**  
  - A **21–25** answer commits to a repair, rejects alternatives, and lands a verdict.  
  - A **15–20** answer explains contradictions and maximin’s failure but wavers on repair.  
  - A **10–14** answer notes baseline dependence but offers no resolution.  
  - **Below 10** focuses on generic PP flaws or misreads the case.  

  This forces engagement with the framing problem while rewarding decisive reasoning—exactly as requested.
