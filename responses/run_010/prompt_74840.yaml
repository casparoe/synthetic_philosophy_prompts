  Marking scheme traps to anticipate: Students might (a) spend 80% rehashing Sunstein (deduct heavily), (b) note baseline dependency without resolving it (cap at 50%), or (c) ignore Option C’s uniqueness (misses 5 marks). The model answer’s boldness serves as a template; if students hedge, they lose points for intellectual courage. 

