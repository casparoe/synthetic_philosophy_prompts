answer: |-
  Here’s a complete design for your 75-minute activity, focusing on the fragility of **independence** in the Condorcet Jury Theorem (CJT). The activity uses physical materials to simulate voting under independent vs. shared-evidence conditions, with hidden mechanics to prevent reverse-engineering. The debrief explicitly ties the experience to CJT conditions and addresses common objections.

  ---

  ### **Core Idea**  
  - **Independent rounds**: Students receive *private* signals about a hidden state (e.g., "Is the card red or blue?"), with signals conditionally independent given the state. CJT holds: majority vote accuracy improves with group size.  
  - **Shared-evidence round**: Students receive *identical* signals (e.g., the same card). CJT breaks: group accuracy = individual accuracy (60%), regardless of size.  
  - **Key illusion**: Both setups feel identical—unanimous votes, high confidence, "we all checked"—but only independence converges to truth.  

  ---

  ### **Physical Setup & Materials**  
  **Materials**:  
  - **3 sets of 24 envelopes** (one set per round).  
  - **Colored cards**: 120 red/blue cards (5 per student × 24 students).  
  - **Voting sheets** for students (with trial columns).  
  - **Wager tokens**: Poker chips (or paper slips) representing "points" (no real money).  
  - **Hidden state generator**: A die (or app) to pre-determine states.  

  **Preparation** (do before class):  
  1. **States**: For each trial, roll a die: odd = "RED", even = "BLUE" (true state).  
  2. **Signals**:  
     - **Rounds 1 & 3 (independent)**: For each student and trial, generate a private signal with 60% accuracy (e.g., if state is RED, 60% get "RED", 40% get "BLUE").  
     - **Round 2 (shared)**: For each trial, generate *one* signal with 60% accuracy. All students get this identical signal.  
  3. **Envelopes**: Label with student IDs and trial numbers. Insert cards (e.g., "Student 1, Trial 1: RED").  

  **Why this hides correlation**:  
  - Cards are identical in appearance (e.g., all say "RED" or "BLUE" with no shared-evidence markings).  
  - Students can’t compare cards—envelopes are sealed, and you enforce "no sharing" rules.  

  ---

  ### **Game Structure: 3 Rounds, 5 Trials Each**  
  **Why 5 trials?** With 24 people, a single trial won’t show accuracy differences. 5 trials/round = 15 total votes, making noise (independent rounds) vs. rigidity (shared round) visible.  

  #### **Timeline (75 min total)**  
  1. **Intro (5 min)**:  
     - "We’re simulating jury voting. Each round, you’ll see evidence (a card) and vote RED/BLUE on a hidden state. Goal: Maximize points by betting on the group’s accuracy."  
     - Emphasize: "Vote based *only* on your card. No discussing cards or votes."  

  2. **Rounds 1–3 (15 min each = 45 min total)**:  
     - **Distribute envelopes** (1 min).  
     - **Voting (5 min)**: Students open envelopes one-by-one, record votes on sheets.  
     - **Collect & tally votes** (3 min): TAs quickly tally majority votes (publicly announce only the group verdict, e.g., "Trial 1: Group voted RED").  
     - **Confidence wager (6 min)**:  
       - Students bet points on whether the group was correct.  
       - **Wagering rules**:  
         - Start with 100 points. Bet any amount (even 0).  
         - **Odds**: 1:1 payout (bet 10 → win 10 if correct, lose 10 if wrong).  
         - **Strategy**:  
           - Independent rounds: Betting high is safe (group accuracy ≈99% with p=0.6, n=24).  
           - Shared round: Betting high is risky (group accuracy =60%, same as individual).  
       - Record bets privately (no peer influence).  

  3. **Reveal & scoring (10 min)**:  
     - Announce true states for all 15 trials.  
     - Students calculate scores. Top scorers get "bragging rights."  

  4. **Debrief (15 min)**: See below.  

  ---

  ### **Solving Practical Problems**  
  1. **Not enough trials?**  
     - **5 trials/round** ensures:  
       - Independent rounds: Majority accuracy ≈99% (obvious signal > noise).  
       - Shared round: Accuracy ≈60% (rigid, no improvement).  
     - **Example**: If shared evidence is wrong (40% chance), all 24 students vote wrong—unanimous but incorrect.  

  2. **Bad private signals wrecking Round 1?**  
     - **Pre-generated signals** ensure 60% average accuracy. Even "unlucky" students (e.g., 3/5 wrong) won’t skew group vote (n=24 dilutes outliers).  

  3. **Reverse-engineering Round 2?**  
     - **Blind mechanics**: Cards look identical; no discussion allowed.  
     - **Misleading framing**: Call all rounds "private evidence" (never mention "shared").  
     - **Wagering pressure**: Students focus on points, not patterns. If someone suspects, they’ll bet cautiously—which still proves the point (low confidence in dependence).  

  4. **"Real juries deliberate!" objection?**  
     - **Debrief response**: "Deliberation *can* help aggregate independent info, but if everyone starts from the same evidence (like Round 2), it often reinforces groupthink. CJT requires independence *first*; deliberation without it risks amplifying shared biases."  

  ---

  ### **Debrief (15 min)**  
  **Map the activity to CJT conditions**:  
  | **CJT Condition** | **Round 1 & 3 (Independent)**             | **Round 2 (Shared Evidence)**           | **Why it breaks?** |  
  |-------------------|-------------------------------------------|-----------------------------------------|-------------------|  
  | **Independence**  | Votes independent given state (private signals). | Votes dependent (same signal → correlated errors). | Shared evidence is the common cause, not the state. |  
  | **Competence**    | Each voter >50% accurate (p=0.6).         | Same competence, but no aggregation benefit. | Dependence prevents "wisdom of crowds." |  
  | **Common cause**  | State causes signals (urn → card draws).  | Shared evidence causes signals (card → votes). | State isn’t the most recent common cause. |  

  **Key moments from the activity**:  
  - **Unanimity**: In shared round, unanimous votes felt reassuring but were wrong 40% of the time.  
  - **Wagering**: Betting heavy in Round 2 lost points (quietly ruinous); in Rounds 1/3, it paid off (group near-perfect).  
  - **Confidence**: All rounds had "we checked" stories—but only independence improved accuracy.  

  **Limitations of the activity**:  
  - **Real evidence is partial/overlapping**: In life, jurors see *some* shared and *some* private evidence. Here, evidence is all-or-nothing (full shared or full private).  
  - **No delayed feedback**: We revealed truth instantly, but real juries rarely get ground-truth confirmation. This makes overconfidence harder to correct IRL.  
  - **Deliberation absent**: We isolated voting, but real juries discuss. (Use this to discuss how deliberation *introduces* dependence if not managed.)  

  **Predictable hiccups & responses**:  
  - **"I saw the same card as my neighbor!"**:  
     - *In the moment*: "Remember, no sharing evidence—focus on your vote."  
     - *Debrief*: "This is how shared evidence creates dependence. You couldn’t tell if it was coincidence or design."  
  - **Low engagement in wagering**:  
     - *In the moment*: "Betting 0 is allowed, but the best jurors take calculated risks!"  
     - *Debrief*: "Wagering mirrored real confidence. In Round 2, if you bet low, you sensed something was off."  
  - **Student argues "But we were unanimous!" in Round 2**:  
     - *Debrief*: "Unanimity feels like consensus, but it’s meaningless if everyone’s wrong. Independence > unanimity for accuracy."  

  **Closing point**: "CJT isn’t broken by disagreement—it’s broken by *hidden agreement*. Shared evidence creates invisible dependence, undermining the theorem. Real-world takeaway: Juries need diverse information sources, not just more people."  

  ---

  ### **Why This Works**  
  - **Physical stealth**: Envelopes/cards feel "private," hiding shared evidence.  
  - **Wagering psychology**: Losses in Round 2 make dependence visceral.  
  - **Speed**: 5 trials/round fits timing; pre-generation prevents chaos.  
  - **Debrief depth**: Explicitly links mechanics to theory and real-world edge cases.  

  This design forces students to confront the illusion of independence—while giving you tools to handle curveballs. Run it as-is, and you’ll have a memorable session!
