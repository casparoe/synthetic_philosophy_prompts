  The case involves a biomarker T in a screening program. Currently, "abnormal" is defined statistically (outside 95% range). A committee proposes shifting the threshold to where treatment reduces cardiovascular risk, which would reclassify many people. There are two complications: a sex difference in T distribution (female average lower due to diet/blood loss), and Priya's argument that disease status is separate from treatment thresholds. The TA wants students to engage with whether disease status changes when drugs are invented, and whether the sex difference issue challenges statistical accounts or something narrower.

  The user needs four things: (1) a compressed exam question, (2) a model answer taking a clear stance, (3) a marking scheme with common pitfalls, and (4) examples of C-grade recycled answers. The exam must force students to analyze what the committee's decision implies about disease ontology—specifically whether treatability makes disease contingent on existing drugs, and whether the sex difference problem targets statistical accounts specifically or a broader issue.

  I need to build the question carefully. The biomarker T is intentionally fictional to prevent clinical knowledge shortcuts. The core tension is between statistical ("typical") vs. intervention-based ("treatable") thresholds. Priya's position represents a hardline naturalist view (disease is objective dysfunction), while the committee's proposal embodies a pragmatic normativist shift. The sex difference issue adds nuance: is "typical female T" a value-laden construct? This directly challenges Boorse's idea of statistically typical function being value-free.

  For the model answer, I'll take a clear stance: disease status isn't metaphysically changed by treatability thresholds, but the committee's move exposes that statistical definitions already smuggled in values via reference class choices. The sex difference case proves this—calling female T "typical" ignores that it's shaped by preventable factors. This argues that Boorse-style accounts aren't value-neutral, but Wakefield's "harm" requirement doesn't resolve the threshold problem either. The conclusion should be that disease categories are pragmatic tools, not discovered natural kinds.

  The marking scheme must penalize survey-style answers. Top marks require: (1) distinguishing disease ontology from operational thresholds, (2) analyzing treatability's role, (3) dissecting the sex difference problem, (4) rejecting hybrid cop-outs, and (5) original argumentation. Common fumbles include conflating thresholds with disease status or missing that the sex difference challenges the neutrality of reference classes.

  For C-grade examples, I'll sketch: (1) a "triptych" essay listing Boorse/Wakefield/Nordenfelt weaknesses, (2) a policy-focused answer ignoring ontology, (3) a "straw naturalist" misreading, and (4) a vague "it's all value-laden" claim without precision. These all dodge the required meta-analysis of how the committee's decision illuminates conceptual tensions.

  The exam wording should force engagement. I'll open with "Critically analyze" to demand evaluation, not summary. Including Priya's quote ("metaphysical question vs. decision rule") primes students to address that distinction. Specifying "what the decision does/does not commit to" prevents vague hand-waving. 

  Model answer structure: First, unpack Priya's point—treatability thresholds don't change whether dysfunction exists. Then argue that the statistical threshold isn't value-free either (sex difference proves this). Conclude that both approaches are operational tools; "disease" is a practical category, not a metaphysical one. No bibliography—just name-drop theorists when needed.

  Finally, the user's unspoken need: they want to resolve their argument with Priya through this exam. The model answer implicitly sides against Priya by showing that even "objective" statistical definitions rely on value judgments. That's the TA's "aha" moment weaponized as pedagogy.
answer: |-
  Here is the complete exam package designed to force engagement with the conceptual tensions in your biomarker case, avoiding recycled summaries:

  **1. Final Exam Question (Compressed Case):**

  **Question (25 marks; approx. 1200 words; 2 hours suggested):**  
  A national screening program measures biomarker T in asymptomatic 40-year-olds. T has no subjective symptoms. Currently, "abnormal" is defined statistically: outside the middle 95% of the local, apparently healthy reference population’s range. A committee proposes redefining "abnormal" as the T level *above which* a cheap, well-tolerated intervention demonstrably reduces future cardiovascular risk. This new threshold falls *within* the current "normal" range, reclassifying many individuals. Two committee debates arise:  
  (1) **Sex Difference:** The average T level is lower in women, partly due to diet and blood loss. One member argues setting a separate female threshold would wrongly "launder" this potentially deficient state into "normal" via statistics.  
  (2) **Nature of Threshold:** Another member (Priya) insists: "Whether high T *is a disease* is a settled metaphysical question about sub-typical part-function, unrelated to thresholds or interventions. Thresholds are just policy knobs set by cost-effectiveness. You're conflating ontology with decision rules."

  **Critically analyze what the committee’s decision to adopt (or reject) the intervention-based threshold *does and does not commit it to* regarding the concept of "disease."** Your analysis must address:
  *   Whether adopting the intervention-based threshold implies that the *disease status* of high T changes when a new drug is invented.
  *   Whether the sex-difference objection fundamentally challenges *statistical accounts of disease* or reveals a problem with a *narrower aspect* of defining abnormality.
  *   The force of Priya’s distinction between a "metaphysical question" and a "decision rule" in resolving the committee’s dilemma.

  **Do not simply summarize theories of health or disease. Engage directly with the conceptual moves required or avoided by the committee's practical decision.**

  ---

  **2. Model Answer (Argued Line; ~800 words):**

  The committee’s decision is fundamentally about operationalizing a *signal for action*, not discovering the metaphysical truth of disease. Adopting the intervention-based threshold does *not* commit the committee to the view that high T’s disease status changes with drug invention, but it *does* expose the limitations of purely statistical definitions and reveals that *all* operational thresholds involve value-laden choices masked as objectivity. Priya’s distinction is crucial but incomplete; while correctly separating ontology from pragmatics, it underestimates how the *choice of operationalization* implicitly shapes our understanding of disease in practice.

  **1. Treatability Thresholds & Disease Ontology:** Priya is correct that the *existence* of a part-dysfunction (if high T represents one) is ontologically distinct from having a *treatable* dysfunction. Boorse might argue species-typical function is fixed. Inventing a drug doesn’t make a previously functional state dysfunctional; it makes a *latent* dysfunction *actionable*. The committee’s shift redefines who gets a *label* ("abnormal") triggering intervention, not whether the underlying biological state *is* dysfunctional. However, this move highlights a key problem: if dysfunction exists *below* the old statistical threshold but was ignored because it was "common" or asymptomatic, the statistical definition *failed* to capture dysfunction accurately. The intervention-based threshold, driven by *harm prevention* (reduced CV events), aligns more closely with Wakefield’s "harm" requirement or normativist views linking disease to impeded goals (like longevity). Yet, adopting it doesn’t mean disease status *changes* with the drug; it means we now *recognize and act upon* a dysfunction we previously ignored or couldn’t effectively address. Disease ontology is stable; the *practical salience and definition of pathology* is not.

  **2. The Sex Difference Problem: Targeting Statistical Neutrality:** The sex-difference objection strikes directly at the heart of *value-neutrality* claims within statistical accounts like Boorse’s. Setting a separate female threshold based purely on current female averages falsely presents a *common, but potentially disadvantageous state* (lower T influenced by modifiable factors like diet/blood loss) as "species-typical" or "normal function." This isn't merely a problem with *defining abnormality*; it's a problem with the *reference class itself*. Boorse assumes "statistically typical function within a reference class" is value-free. This case shows that assumption is false. Choosing the reference class ("women") and accepting its *current* state as the baseline for "normal function" involves a normative judgment: it *normalizes* states potentially caused by social/environmental factors that *depress function*. The objection isn't just about where to draw the line (a narrower problem); it challenges the core claim that statistical typicality within *any* socially defined group (like sex) can be a neutral foundation for defining health/disease. It reveals that "statistical normality" can encode and perpetuate contingent, potentially harmful norms.

  **3. Priya’s Distinction: Necessary but Insufficient:** Priya is right to separate the ontological question ("Is this a dysfunction?") from the policy question ("When do we intervene?"). This prevents the committee from naively concluding that high T *becomes* a disease only when a cheap drug exists. However, her distinction becomes a dodge if it implies the ontological question is *easily settled* independently ("either it is or it isn't"). The biomarker T is *asymptomatic*; we have no direct evidence of "felt dysfunction" (Nordenfelt). Its status *as dysfunction* likely relies on its *link to future harm* (CV events). The intervention-based threshold leverages that *same link* to define actionability. This interdependence shows that in practice, evidence for dysfunction and decisions about intervention are often entangled, especially for latent risks. While Priya’s distinction prevents a crude conflation (drug invention = disease creation), it doesn’t resolve the committee’s core problem: choosing an operational definition that best serves the *goal* of the screening program (preventing harm), which inevitably involves normative judgments about what risks are significant enough to label and treat, judgments already embedded, unexamined, in the original statistical approach via reference class choice and tolerance of asymptomatic dysfunction. The committee isn't just turning a policy knob; it's deciding which *conception of pathology* to operationalize.

  **Conclusion:** The committee’s decision exposes that *all* thresholds are value-laden tools. Adopting the intervention-based threshold commits them to prioritizing *preventable harm reduction* over *statistical typicality* as the primary rationale for labeling abnormality. It does not commit them to the view that disease status is invented with drugs. The sex-difference problem commits them to rejecting the illusion of value-neutrality in statistical definitions, showing that even Boorse’s "normal function" depends on contingent, normatively loaded reference classes. Priya’s distinction is vital for clarity but insufficient; the "metaphysical" question of dysfunction is often answered *through* the pragmatic lens of harm in practice. The committee must own the normative choices inherent in *any* definition of "abnormal."

  ---

  **3. Marking Scheme (Out of 25):**

  | **Must-Hit Move**                                                                                          | **Marks** | **Typical Fumble**                                                                 |
  | :--------------------------------------------------------------------------------------------------------- | :-------- | :--------------------------------------------------------------------------------- |
  | **1. Clearly distinguishes disease ontology (dysfunction) from operational thresholds/labels.**            | 5         | Conflates changing the threshold with changing disease status (e.g., "the drug makes it a disease"). |
  | **2. Correctly analyzes treatability threshold:** Does NOT make disease depend on drug existence; DOES link it to recognizing/acting on latent harm/dysfunction. | 6         | Claims disease status changes with drug availability OR completely divorces treatability from any concept of dysfunction/harm. |
  | **3. Diagnoses sex-difference objection:** Targets value-neutrality of statistical accounts (Boorse), specifically the normative choice of reference class/accepting contingent states as "typical function." | 6         | Sees it only as a narrower "where to draw the line" problem OR misattributes it solely to normativism/Wakefield's harm. |
  | **4. Critically evaluates Priya's distinction:** Acknowledges its value in avoiding conflation but challenges the idea the ontology is easily settled independently OR shows entanglements in practice. | 5         | Uncritically accepts Priya's distinction as solving the problem OR completely dismisses its validity. |
  | **5. Develops a coherent, argument-driven line** (not a survey) on what the committee's choice *operationalizes* (e.g., harm prevention vs. statistical purity) and what it reveals about value-ladenness. | 3         | Lapses into theory summary ("Boorse says X, Wakefield says Y...") OR offers disjointed points without a unifying thesis. |

  ---

  **4. Sketches of C-Grade (Recycled Summary) Answers:**

  1.  **The Triptych Tour:** "Boorse's BST defines disease statistically, but this fails because T's distribution differs by sex, showing statistical norms can be harmful. Wakefield adds harmful dysfunction, which might fit the intervention threshold as it prevents harm. Nordenfelt's normativism explains why we change thresholds based on goals like preventing CV events. Each theory has flaws, so a hybrid view is probably best." *(Does: Summarizes theories, applies labels loosely to case points. Doesn't: Engage the *specific* ontological commitments of the committee's choice or deeply analyze the sex/treatability tensions.)*
  2.  **Policy Reductionism:** "This isn't about disease at all, it's just resource allocation. Priya is right: thresholds are policy knobs. The committee should use cost-effectiveness analysis to set the cutoff where benefits outweigh costs, perhaps using QALYs. The sex difference might need separate analysis for equity. 'Disease' is irrelevant here." *(Does: Focuses solely on policy/pragmatics. Doesn't: Address the ontological questions raised (does dysfunction exist below the old threshold? Is female T deficient?) or what the label implies conceptually.)*
  3.  **Straw Naturalist:** "Priya is completely correct. Disease is objective biological dysfunction (Boorse). The current threshold already marks statistically atypical function. The committee's new threshold is unscientific; it labels normal function as disease just because we can treat it. The female average *is* typical for women, so a separate range is valid biology. Medicine must be value-free." *(Does: Defends a rigid naturalism. Doesn't: Grapple with the challenge the sex difference poses to value-neutrality or the possibility of latent dysfunction within the statistical norm. Fails to analyze the committee's potential commitments.)*
  4.  **Vague Normativism:** "This case proves all disease concepts are socially constructed and value-laden (Nordenfelt, Canguilhem). The old threshold reflected one set of values (statistical norms), the new one reflects another (preventing harm). The sex difference shows how 'normal' can be patriarchal. Priya is wrong to think disease is objective; it's always about power and values." *(Does: Embraces normativism generally. Doesn't: Specifically analyze *how* the committee's choice operationalizes values differently than the old one, distinguish ontology from pragmatics clearly, or engage the nuance of whether dysfunction might still be an underlying reality being interpreted.)*

  This package forces students to dissect *the conceptual implications of a practical decision*, making theory labels insufficient. The marking scheme rewards precise analysis of the ontological/pragmatic boundary, the value-ladenness within statistical definitions, and a critical evaluation of the key distinction you and Priya debated. Good luck grading!
