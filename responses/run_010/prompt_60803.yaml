  We are designing a seminar activity for 16 students on moral responsibility, specifically focusing on the problem of standing to blame without using key terminology until the debrief. The activity uses fictional transgressions on sealed cards, blame tokens, and four rounds with specific cases. We'll create materials, a timeline, instructions, and address potential issues.

  ### Materials List
  - **16 Sealed Envelopes**: Each containing a card with a fictional transgression, the norm breached, and instructions for each round.
  - **Blame Tokens**: 4 tokens per student (e.g., small coloured chips or paper squares). Total: 64 tokens.
  - **Ledger Sheets**: One per student (see below for design) to record token transactions.
  - **Whiteboard**: For tracking overall token counts per student and rules for the two halves.
  - **Pens**: For students to record on ledger sheets.
  - **Timer**: To keep rounds on schedule.

  ### Ledger Sheet Design
  Each ledger sheet will have:
  - Student's assigned code (to anonymise during rounds, e.g., "Student A", "Student B", etc.)
  - Columns for:
    - **Round**: (a, b, c, d)
    - **Accused Student Code**: (the student they are blaming in that round)
    - **Tokens Spent**: (number of tokens used in that round)
    - **Tokens Forfeited**: (if any, and reason: e.g., "same fault", "similar fault", etc.)
    - **Remaining Tokens**: (updated after each round)

  ### Sealed Card Examples (at least 4)
  Each card has:
  - A fictional minor transgression (unique to the student).
  - The norm it violates.
  - For each round, what the holder is entitled to do.

  **Card 1:**
  - **Fictional Transgression**: You copied a friend's homework for one assignment last term.
  - **Norm Breached**: Academic integrity; one should not plagiarise.
  - **Round Entitlements**:
    - (a) Blame someone else for copying homework. (Accurate: same fault)
    - (b) Blame someone else for copying homework, but note: you have repented (stopped copying) and helped a friend with their homework honestly last week. (Reformed)
    - (c) Blame someone else for cheating on a test by using hidden notes. (Similar: academic dishonesty but different act)
    - (d) You are to blame a student who has (i) copied homework (same as your fault) and (ii) one who has cheated on a test. Also, you are assigned to be the "ruthless self-applier" in (d): you must spend tokens to blame others and also blame yourself (by forfeiting a token) for your own past copying, even though you've reformed.

  **Card 2:**
  - **Fictional Transgression**: You left a shared kitchen in a mess for two days, causing inconvenience.
  - **Norm Breached**: Communal living; one should clean up after oneself in shared spaces.
  - **Round Entitlements**:
    - (a) Blame someone else for leaving a shared kitchen messy.
    - (b) Blame someone else for leaving a shared kitchen messy, but note: you have repented (now clean immediately) and even cleaned up others' mess once.
    - (c) Blame someone else for leaving a shared bathroom in a messy state. (Similar: communal space, but different room)
    - (d) You are to blame a student who has (i) left the kitchen messy and (ii) left the bathroom messy. Also, you are assigned as the "quiet exemptor" in (d): you do not blame yourself and quietly avoid spending tokens on others for similar faults.

  **Card 3:**
  - **Fictional Transgression**: You were late to a group meeting three times without notifying anyone.
  - **Norm Breached**: Punctuality and consideration; one should be on time or inform if delayed.
  - **Round Entitlements**:
    - (a) Blame someone else for being late without notice.
    - (b) Blame someone else for being late without notice, but note: you have repented (now always on time or call) and once waited 20 minutes for a latecomer without complaint.
    - (c) Blame someone else for cancelling a meeting at the last minute without a good reason. (Similar: lack of consideration for others' time, but different act)
    - (d) You are to blame a student who has been late and one who cancelled. Also, you are a "ruthless self-applier": blame others and yourself.

  **Card 4:**
  - **Fictional Transgression**: You broke a borrowed book by spilling coffee on it and didn't replace it.
  - **Norm Breached**: Care of borrowed property; one should return items in the condition received or make amends.
  - **Round Entitlements**:
    - (a) Blame someone else for damaging a borrowed item and not replacing it.
    - (b) Blame someone else for the same, but note: you have repented (replaced the book and now are extra careful) and once lent your own book without hesitation.
    - (c) Blame someone else for losing a borrowed item and not replacing it. (Similar: failing to care for borrowed property, but different act - losing vs. damaging)
    - (d) You are to blame a student who damaged and one who lost. Also, you are a "quiet exemptor": do not blame yourself and avoid spending tokens on others for similar faults.

  ### Rules for Token Forfeiture (Two Halves of the Room)
  - **Half 1 (Local Depletion Rule)**: If you blame someone for a transgression and you have committed the *exact same* transgression (as per your card) and have not repented (in rounds where repentance is not in play), then you forfeit one token. This forfeiture only applies to the specific norm breached (i.e., you can still blame for other norms without forfeiting).
  - **Half 2 (Global Depletion Rule)**: If you blame someone for a transgression and you have committed *any* transgression (even a different one) and have not repented, then you forfeit one token. This forfeiture drains your standing across the board (i.e., you lose a token from your total budget, affecting your ability to blame for any future transgression).

  *Note: Repentance/reformation is only introduced in round (b). In round (a), no one has repented. In rounds (c) and (d), the rules apply as above, but note the round-specific details.*

  ### Timeline (75 minutes)
  - **0:00-0:10** (10 min): Introduction and distribution of materials. Read verbatim instructions.
  - **0:10-0:20** (10 min): Round (a) - Accurate blame by someone with identical fault (no repentance).
  - **0:20-0:30** (10 min): Round (b) - Same as (a) but blamer has repented and reformed.
  - **0:30-0:40** (10 min): Round (c) - Blamer's fault is structurally similar but different norm.
  - **0:40-0:55** (15 min): Round (d) - Two contrast figures: the ruthless self-applier and the quiet exemptor.
  - **0:55-1:05** (10 min): Token tally and initial reactions. Students report remaining tokens and note patterns.
  - **1:05-1:20** (15 min): Debrief and theory mapping.
  - **1:20-1:23** (3 min): Exit slip.
  - **1:23-1:25** (2 min): Collect exit slips and close.

  ### Verbatim Instructions (Read Aloud)
  "Good morning. Today we're going to do an activity about blame. Each of you has received a sealed envelope. Inside is a card that describes a minor transgression that you, in this fictional scenario, have committed. It also states the norm that this breaches. Do not open the envelope until I say so.

  You each have four blame tokens. These are your 'blame budget' for the session. In each round, you will be instructed to blame another student for a transgression they have (as per their card) by spending one token. But note: there are rules about when you might lose tokens.

  The room is split into two halves: left side and right side. Each half has different rules about token forfeiture. I will write these rules on the board now.

  [Write on whiteboard:]
  **Left Half Rule**: If you blame someone for a transgression and you have committed the *exact same* transgression (without having repented, when repentance is relevant), then you forfeit one token. This loss only affects your ability to blame for that exact same norm in the future. You can still blame for other norms without losing tokens.

  **Right Half Rule**: If you blame someone for a transgression and you have committed *any* transgression (without having repented, when repentance is relevant), then you forfeit one token. This loss reduces your total token count, affecting your standing to blame for any future transgression.

  Now, open your envelopes. Read your card. It tells you what you did and the norm. It also tells you what to do in each round. Do not share the details of your transgression with anyone. We are using fictional scenarios to protect privacy.

  In each round, you will be paired with another student (I will tell you how). You will then decide whether to spend a token to blame them for a specific transgression (as directed by your card). If you choose to spend, you must record it on your ledger sheet. Also, if the forfeiture rule applies to you, you must record the forfeiture.

  We will do four rounds. Each round, I will tell you the pairing and what your card entitles you to do. Let's begin."

  ### Pairing and Reveal Protocol to Avoid Shaming
  - **Pairing**: In each round, assign pairs randomly (e.g., draw numbers from a hat). Alternatively, pre-assign pairs for each round to save time (have a list ready). This way, no one is singled out repeatedly.
  - **Reveal**: When a student blames another, they do not state the transgression aloud. Instead, they say: "I blame Student [Code] for a transgression in the category of [Norm]." The accused does not respond. This keeps the focus on the act of blaming and the rules, not the details of the transgression.
  - **Ledger Recording**: Students record the code of the student they blame and any token loss. The tutor collects the ledger sheets at the end to see patterns without public disclosure.

  ### Round (c) Diagnostic Question
  You suspect that round (c) might collapse into a question about degrees of similarity. To diagnose, ask the class during the debrief:
  - "In round (c), when you were asked to blame someone for a transgression that was structurally similar but breached a different norm, how did you decide whether the forfeiture rule applied? Did you consider the two norms to be in the same 'neighborhood' or did you focus on how similar the acts were?"

  ### Debrief (15 minutes)
  1. **Map each round to philosophy of blame**:
     - **Round (a)**: Hypocrisy without repentance. Models the idea that blaming while guilty of the same fault undermines standing (e.g., Todd 2017 on hypocrisy). However, note: some argue that the blame is still valid but the blamer is morally criticisable (Coates and Tognazzini).
     - **Round (b)**: Repentance and reform. Models the view that reform can restore standing (e.g., Bell 2013). Contrast with the view that past hypocrisy permanently taints standing (not a major view, but possible).
     - **Round (c)**: Normative neighborhood. Tests whether standing is norm-specific. If forfeiture only occurred for exact norms (in local rule) but not for similar, then it suggests standing is norm-specific. The global rule would forfeit anyway. Ask the diagnostic question to see if they saw similarity or distinct norms.
     - **Round (d)**: Contrasts: 
        - Ruthless self-applier: This may have standing because she applies the standard to herself (e.g., Scanlon 2008 on the importance of consistency). 
        - Quiet exemptor: This is classic hypocrisy and likely lacks standing.

  2. **Key Distinctions**:
     - Moral criticisability of the hypocrite vs. the target's entitlement to protest (second-personal authority). The token system models the latter: when you lose a token, you literally cannot blame (you lack the status). But in real life, even if the hypocrite is criticisable, the target might still be bound by the blame (e.g., if the norm is valid). The activity focuses on the second-personal standing: the authority to address blame to another.
     - Is standing a property of the blamer alone or of the relation? The two rules model differently: local rule makes it relational (depending on the norm), global rule makes it about the blamer's overall impurity. In philosophy, standing is often relational (Wallace 2010).

  3. **Gaps in the Activity**:
     - Real relational costs: The token system doesn't capture the emotional or relational damage of blame. Verbally note this at the start and during debrief.
     - Second-personal authority: Tokens are a proxy, but real standing is about the authority to hold accountable. Mention during debrief.
     - Observer effect: Students know they are being assessed. Emphasize at the start that the activity is about exploring intuitions, not judging them.

  **Where to mention gaps**:
  - At the start: "Note: this is a simplified model. In real life, blame affects relationships and carries emotional weight. We're using tokens to focus on one aspect."
  - During debrief: "Remember, the token system is a model. It cannot capture the full second-personal authority of blame, where the target might feel entitled to reject the blame if the blamer lacks standing. Also, in real life, the fact that I am your tutor might affect how you engage. We set that aside for the activity."

  ### Exit Slip (2 questions, 3 minutes)
  1. In the activity, when did you feel it was most legitimate for someone to blame another? (Round a, b, c, or d? And why in one sentence?)
  2. If a person has committed a similar but not identical transgression, should they be allowed to blame without losing standing? (Yes/No) Why? (One sentence)

  *These questions track whether the student leans toward a local (norm-specific) or global view of standing, and whether repentance restores standing.*

  ### Failure Modes and Interventions
  1. **Students refusing to spend tokens**:
     - *Why*: They might feel it's unfair, or they don't want to engage.
     - *Intervention*: Stress that the activity requires participation to generate data. Remind them it's fictional. If still reluctant, allow them to pass but note that it might affect the simulation.

  2. **Session degenerating into gotcha-hunting**:
     - *Why*: Students might focus on catching others in hypocrisy rather than the philosophical point.
     - *Intervention*: Refocus on the ledger and rules. Say: "Remember, the point is not to shame but to see how the rules affect your blame budget. Record your transactions and we'll discuss patterns later."

  3. **Over-identification with assigned fault**:
     - *Why*: A student might feel the transgression is too close to home.
     - *Intervention*: At the start, emphasize: "These are fictional scenarios. If your card upsets you, let me know discreetly and I'll give you a different one." Have a few spare generic cards.

  4. **Round (c) overrunning**:
     - *Why*: Students might debate whether two norms are similar.
     - *Intervention*: Use a timer for each round. Say: "If you are unsure, follow your card's instruction and the rule for your half. We'll discuss the ambiguity later."

  ### What the Activity Cannot Reproduce
  - **Real relational costs**: Blame in real life can damage relationships. The token system abstracts this away.
  - **Second-personal authority**: The authority to protest is not just about tokens but about the moral relationship. The tokens are a proxy.
  - **Observer effect**: The tutor's presence and assessment might inhibit or alter behavior.

  **How to fill the gaps**:
  - Verbally, at the start and debrief, as above.

  This design should meet all your requirements and create an engaging session that leads into the standing literature.
answer: |-
  ### Seminar Design: "Blame Tokens" Activity  
  **Materials List:**  
  - 16 sealed envelopes (each containing a unique transgression card)  
  - 64 small, identical tokens (e.g., dried beans, buttons, or paper clips; 4 per student)  
  - 16 ledger sheets (one per student; template below)  
  - Whiteboard + markers  
  - Timer  
  - Pens for students  

  **Minute-by-Minute Timeline (75 mins):**  
  - **0:00–0:10 (10 mins):** Introduction. Distribute envelopes, tokens, and ledgers. Read verbatim instructions (below). Split room: left half = local rule, right half = global rule. Write rules on whiteboard.  
  - **0:10–0:20 (10 mins):** **Round (a)** — Identical fault, no repentance. Pair students randomly (e.g., draw numbers).  
  - **0:20–0:30 (10 mins):** **Round (b)** — Identical fault, with repentance. Re-pair students.  
  - **0:30–0:40 (10 mins):** **Round (c)** — Structurally similar fault. Re-pair students. Pose diagnostic question mid-round.  
  - **0:40–0:50 (10 mins):** **Round (d)** — Contrast figures. Assign roles: half the room acts as "ruthless self-appliers", half as "quiet exemptors". Pair with two partners.  
  - **0:50–0:55 (5 mins):** Token tally. Students calculate remaining tokens on ledgers.  
  - **0:55–1:05 (10 mins):** Open discussion: "Which rule felt harsher? When did blame seem unfair?"  
  - **1:05–1:20 (15 mins):** **Debrief.** Map rounds to philosophy. Introduce vocabulary. Address gaps (verbally).  
  - **1:20–1:23 (3 mins):** **Exit slip.** Distribute and complete.  
  - **1:23–1:25 (2 mins):** Collect slips and materials.  

  ---

  ### Verbatim Instructions (Read Aloud at Start):  
  "Good morning. Today, we’ll simulate blame exchanges. Each of you has a sealed envelope with a fictional act you’ve ‘committed’ and the norm it breaks. **Do not open it yet.** You also have four tokens—your ‘blame budget’—and a ledger.  

  Here’s how it works:  
  1. **Rules differ by side of the room.** The left half uses Rule A; the right half uses Rule B. I’ve written these on the board.  
  2. **In each round**, I’ll pair you. Your card tells you whom to blame and for what. Spend a token to blame.  
  3. **Record every token spent or lost** on your ledger.  
  4. **Keep transgressions private.** If blaming, say only: ‘I blame [Partner’s Number] for violating [Norm].’ No details.  
  5. **Respect the seal.** This is fiction. Do not reveal true personal experiences.  

  Open envelopes. Read your card. Start when I call rounds."  

  **Whiteboard Rules:**  
  - **Left Half (Local Rule):** "If you blame someone for breaking a norm, and you broke that *exact same norm*, you lose one token. This loss applies *only* to that norm."  
  - **Right Half (Global Rule):** "If you blame someone for breaking a norm, and you broke *any norm*, you lose one token. This loss applies to *all future blame*."  

  ---

  ### Sealed Card Examples (4 of 16):  
  **Card 1:**  
  - **Your act:** You missed a group meeting without notifying anyone.  
  - **Norm breached:** Reliability (one should inform others if cancelling plans).  
  - **Rounds:**  
    - (a) Blame a partner who did *exactly this act*.  
    - (b) Blame a partner who did *exactly this act*; note: you have repented (now always message) and demonstrated this.  
    - (c) Blame a partner who *forgot a close friend’s birthday* (breaches: Thoughtfulness; one should remember important dates).  
    - (d) You are a **ruthless self-applier**: Blame two partners—one for *missing a meeting*, one for *forgetting a birthday*—and spend a token blaming *yourself* for your original act.  

  **Card 2:**  
  - **Your act:** You left shared kitchen surfaces dirty overnight.  
  - **Norm breached:** Cleanliness (one should clean up after oneself in shared spaces).  
  - **Rounds:**  
    - (a) Blame a partner who did *exactly this act*.  
    - (b) Blame a partner who did *exactly this act*; note: you have repented (now always clean immediately) and demonstrated this.  
    - (c) Blame a partner who *left communal toilet paper empty* (breaches: Consideration; one should replace shared items).  
    - (d) You are a **quiet exemptor**: Blame *no one*; keep tokens.  

  **Card 3:**  
  - **Your act:** You copied a peer’s homework without attribution.  
  - **Norm breached:** Academic honesty (one should submit original work).  
  - **Rounds:**  
    - (a) Blame a partner who did *exactly this act*.  
    - (b) Blame a partner who did *exactly this act*; note: you have repented (now cite all sources) and demonstrated this.  
    - (c) Blame a partner who *arrived late to an exam* (breaches: Punctuality; one should be on time for commitments).  
    - (d) You are a **ruthless self-applier**: Blame two partners—one for *copying homework*, one for *lateness*—and spend a token blaming *yourself*.  

  **Card 4:**  
  - **Your act:** You borrowed a book and returned it damaged.  
  - **Norm breached:** Care of property (one should return items in original condition).  
  - **Rounds:**  
    - (a) Blame a partner who did *exactly this act*.  
    - (b) Blame a partner who did *exactly this act*; note: you have repented (now inspect items before borrowing) and demonstrated this.  
    - (c) Blame a partner who *lost a borrowed USB stick* (breaches: Responsibility; one should safeguard borrowed items).  
    - (d) You are a **quiet exemptor**: Blame *no one*; keep tokens.  

  ---

  ### Reveal Protocol to Prevent Shaming:  
  - **Anonymity:** Students refer to partners by assigned numbers (e.g., "I blame Partner 7").  
  - **Blame phrasing:** Students **must** use the scripted phrase: "I blame [Number] for violating [Norm]." No specifics.  
  - **No rebuttals:** The "accused" does not respond. Move to next pair immediately.  
  - **Ledger focus:** After each round, students silently update ledgers. Discussion focuses on token patterns, not acts.  

  **Ledger Sheet Template:**  
  | Round | Partner’s Number | Norm Violated | Token Spent? | Token Forfeited? (Rule) | Tokens Left |  
  |-------|------------------|---------------|--------------|-------------------------|-------------|  
  | (a)   |                  |               |              |                         |             |  
  | (b)   |                  |               |              |                         |             |  
  | (c)   |                  |               |              |                         |             |  
  | (d)   |                  |               |              |                         |             |  

  ---

  ### Debrief (15 mins):  
  **Map rounds to philosophy:**  
  - **Round (a):** Hypocrisy without repentance → Models the **moral criticisability of hypocrites** (e.g., Todd 2017). Distinguish: The blame may be *accurate*, but the blamer is open to criticism.  
  - **Round (b):** Repentance → Tests if reform restores standing. Aligns with **redemption views** (e.g., Bell 2013) vs. **irrevocable hypocrisy** (no major philosopher; discuss as open question).  
  - **Round (c):** "Normative neighborhood" → **Diagnostic question:** *"Did forfeiture depend on how similar the norms felt, or were they distinct categories?"* If similarity dominated, it collapses into scalar judgments; if not, it isolates normative proximity. Relates to **scope-restricted standing** (e.g., Wallace 2010).  
  - **Round (d):** Contrasts → Ruthless self-applier may retain standing via **consistency** (Scanlon 2008); quiet exemptor models **pure hypocrisy** and lost standing.  

  **Key distinctions:**  
  1. **Moral criticisability vs. standing to protest:** The token loss models the latter—whether the blamer has the *status* to address blame *to you*. A hypocrite might be criticisable (Round a) *and* lack standing (you can dismiss their blame).  
  2. **Standing: Blamer alone or relational?** Local rule treats it as relational (depends on the norm-breach pair); global rule treats it as the blamer’s inherent property. Philosophy is divided (e.g., relational: Wallace; blamer-centric: Coates & Tognazzini).  

  **Gaps and verbal supplements:**  
  - **Real relational costs:** Tokens lack emotional weight. **Say at 0:05 and 1:07:** "Real blame risks relationships; tokens are mere tokens."  
  - **Second-personal authority:** Tokens don’t capture the authority to protest. **Say at 1:10:** "Standing isn’t just about tokens—it’s about whether you owe the blamer a response."  
  - **Observer effect:** My presence may distort behavior. **Say at 0:02:** "I’m here to facilitate, not judge your choices. Focus on the mechanics."  

  ---

  ### Failure Modes & Interventions:  
  1. **Students refuse to spend tokens** (e.g., avoid conflict):  
     - **Intervention:** Remind them: "This is fiction; your card *requires* spending in some rounds. If stuck, spend symbolically to test the rules."  

  2. **Session becomes "gotcha-hunting"** (students focus on catching hypocrites):  
     - **Intervention:** Refocus: "Record tokens, not ‘wins’. When discussing, use numbers, not personal details." Pause and reset rules if needed.  

  3. **Round (c) overruns** (students debate similarity of norms):  
     - **Intervention:** Use the diagnostic question early: "Decide quickly: Was it the *same norm*? Rule depends on your card, not debate." Enforce strict timing.  

  ---

  ### Exit Slip (3 mins):  
  1. *Which rule felt fairer: losing tokens only for the same norm (local) or for any norm (global)? Why in one sentence?*  
  2. *If you blame someone but have a similar fault, should you lose tokens? (Yes/No) Why in one sentence?*  

  **Rationale:** Q1 tracks if intuitions align with relational (local) or blamer-centric (global) theories. Q2 tests if "normative neighborhood" is seen as distinct or scalar.  

  --- 

  ### What the Activity Cannot Reproduce:  
  1. **Real relational costs:** Tokens lack emotional stakes. **Verbal fill:** At 0:05 and 1:07, stress: "Real blame can damage trust; tokens simplify this."  
  2. **Second-personal authority:** Tokens don’t capture the moral address of blame. **Verbal fill:** At 1:10: "Standing asks if the blamer has the *right* to address you—tokens are a proxy."  
  3. **Observer effect:** My role may inhibit honesty. **Verbal fill:** At 0:02: "I’m not assessing your choices; engage freely."  

  This design prioritizes intuition-building via mechanics, with rigorous safeguards for privacy and focus. The parallel rules highlight core theoretical divides efficiently.
