  Part 3 is pivotal: I judge degenerate filler more aligned with the architecture's commitment to gradedness and parallelism, but it demands a principled distinction between soft constraint violation (legitimate flexibility) and interpretive license (theoretic vacuity). The line must be drawn at role collapse - when filler degradation makes the role unrecognisable even in context. 

  For part 4: The toy's fragility stems from aperture-centric letter differences. A robust subset (say a, d, k, x) with structural diversity would resist collapse, but this merely relocates the problem: orthogonality holds only when style doesn't target critical roles. Letterhood isn't universally style-relative, but its vulnerability is role-dependent.

