prompt: |-
  I'm three quarters of the way through a novel whose narrator finds out at forty that she was made from a donor embryo — her parents' own embryos all failed and the clinic had a leftover from another couple — and the whole book turns on whether the woman she "would have been" is somebody she lost or nobody at all. To write it I've had to pin down what I actually believe about where a person comes from, which turns out to be a mess, so I've been keeping a list of cases and my gut calls on them in the back of a noteboook. I'd love to know what principle, if any, they add up to.

  Here's the list. Same egg, different sperm: not me — that guy is my half-brother, and it doesn't matter that he'd have my mother's face. Same sperm, different egg: also not me, symmetrical, no hesitation. My embryo — my actual parents' actual gametes — frozen in a tank for twenty-two years and then implanted: me, absolutely, the delay is irrelevant. Same embryo carried by a surrogate instead of my mother: still me. A somatic-cell clone of me made tomorrow from a cheek swab: NOT me, and I feel this one hard, even though he'd have my nuclear DNA. An embryo built from my nucleus but with a donor egg's mitochondria, the three-parent thing: I want to say this one is closer to me than the clone, maybe actually is me, which I know sits badly with what I just said. And the one the novel hangs on: my embryo splits at day four into identical twins, one of them stops developing at nine weeks and gets absorbed, and the survivor carries some of his cells in her blood for the rest of her life. I want to say she's me and I want to say she's partly him, and I dont think both can be true.

  So: is there a principle that gets all of these, or nearly all? I know the Kripke-ish line that where you come from is essential, that you couldn't have come from different gametes, and at first glance that seems to deliver the frozen embryo and the surrogate for free while killing the clone, since he comes from a cheek cell and not a gamete — but then the mitochondrial case ought to come out "not me" too, and I'm not willing to give that one up, or maybe I should be. Give me the cheapest principle that fits the pattern, state it precisely enough that I could apply it to a new case without squinting, and tell me which case motivated which clause. If saving everything costs you clause after clause of machinery, say so and tell me which verdict to throw overboard — I suspect it's the clone, which would wreck a subplot. Then run whatever you land on through two cases I havent decided: an embryo where a single base pair of mine is corrected before implantation (is the corrected one me, and if the edit gets bigger, say a whole gene added, where does it flip?), and an embryo assembled from lab-grown sperm and egg derived from my own skin cells, so the gametes are made out of me rather than out of my parents. No reading list please, I've got a deadline and zero interest in footnotes — just the reasoning, and an honest account of where it breaks down.
reasoning: |-
  Okay, the user is deep into writing a novel where the protagonist discovers she was born from a donor embryo. The core conflict revolves around whether the "woman she would have been" is a lost twin or nothing at all. To write this, they've been grappling with their own beliefs about personal identity, specifically what makes someone "me." They've compiled a list of hypothetical scenarios and their gut reactions to them, and now they're looking for a coherent principle that explains these intuitions consistently. 

  First, I need to unpack their list carefully. Their gut responses show strong patterns: gamete origin seems crucial (frozen embryo = me, surrogate = me), but not sufficient (clone ≠ me). Mitochondrial replacement throws a wrench in this—they feel it might still be "me" despite different mitochondrial DNA. The twin absorption case is emotionally charged—they want the survivor to be both "me" and partly "the twin," which feels logically messy. 

  Their rejection of Kripke's origin essentialism (which they already know) is telling—it explains some cases but clashes with their mitochondrial intuition. That’s the friction point. They’re also hinting at a novel subplot involving cloning ("wreck a subplot"), so any principle that dismisses the clone-as-not-me might hurt their story. 

  The unresolved cases (gene editing and lab-grown gametes) are fascinating. A single base pair edit feels trivial ("still me"), but a whole gene addition? That’s a spectrum problem. Lab-grown gametes from skin cells—is that like cloning or like natural conception? Their gut might split the difference. 

  I think their core tension is between two intuitions: 
  1. **Historical origin**: "Me" starts at the *exact* moment my parents' gametes fused. 
  2. **Subjective continuity**: If I could wake up in that body without noticing, it’s "me" (hence mitochondrial case feels closer). 

  The clone fails both—wrong origin, and no continuity (it’s a copy, not *me* teleporting). The mitochondrial case passes continuity (same nucleus, same "brain blueprint") despite altered origin. The twin absorption is unique—the survivor *is* "me" by origin, but carries cells from another entity with identical origin. That’s why it feels like both. 

  For a principle, I’d propose: **"Me" is defined by the first conscious entity produced by a specific fertilization event.** This saves: 
  - Frozen embryo (same fertilization event, just delayed). 
  - Surrogate (same event, different womb). 
  - Mitochondrial case (still the same fertilization nucleus, just repaired—consciousness would feel continuous). 
  - Twin absorption (the survivor is the product of the original fertilization; the absorbed twin is a derivative).  
  It rejects clones (new fertilization event) and gamete variants (different fertilization). 

  But it *strains* on the mitochondrial case—technically a new fertilization if the egg is replaced? Maybe tweak to: **"the entity arising from *this nucleus* at conception."** That rescues mitochondria (same nucleus) and dumps the clone (different nucleus). 

  For their unresolved cases: 
  - **Gene edit**: Still "me" if the nucleus is from the original conception. Even a whole gene? If consciousness is unchanged, yes—but this might feel slippery. 
  - **Lab-grown gametes**: Tricky! If gametes are made from skin cells, the nucleus is yours but from a *later* time. Feels clone-adjacent—probably "not me." 

  Sacrifices? The clone verdict stands ("not me"), which might hurt their subplot. Alternative: embrace the mitochondrial case as "me" and admit the clone *could* be "me" if consciousness transfers (but they reject this). Or lean into the twin case’s duality—maybe identity isn’t binary. But they want a clean principle.  

  Final principle: **You are the unique conscious entity instantiated by your original zygote’s nucleus.** Covers all except maybe the twin case—but they *want* the survivor to be "me," so we call the twin a "derivative instance" and move on.  

  Breakdown: The clone still fails (different nucleus origin), lab-grown gametes fail (nucleus from post-birth you), gene edits pass (same nucleus). The twin case—survivor is "me," the absorbed cells are "his" but don’t define identity. That’s as clean as it gets.
answer: |-
  Here's a principle built from your intuitions, designed for minimal machinery while preserving your core verdicts (especially the mitochondrial case and twin absorption). The sacrifice is strict Kripkean essentialism:

  **The Principle of Original Nucleus Instantiation (ONI):**  
  *You are the unique conscious entity instantiated by the specific nucleus formed at your conception. Any entity arising from a different nucleus is not you, regardless of genetic similarity. The developmental environment (timing, womb, mitochondrial source, absorbed cells) is irrelevant to identity but may affect traits.*

  ### How ONI Delivers Your Verdicts:
  1. **Same egg, different sperm:** Not you.  
     → *Different nucleus formed at conception.*  
  2. **Same sperm, different egg:** Not you.  
     → *Different nucleus.*  
  3. **Frozen embryo (22 years later):** You.  
     → *Same nucleus instantiated later (delay irrelevant).*  
  4. **Surrogate carried:** You.  
     → *Same nucleus (womb irrelevant).*  
  5. **Somatic-cell clone:** Not you.  
     → *New nucleus formed from a cheek cell, not conception.*  
  6. **Mitochondrial donor ("three-parent"):** You.  
     → *Same original nucleus (mitochondria are environmental factors).*  
  7. **Twin absorption:** The survivor is you.  
     → *She arose from the original nucleus. The absorbed twin is a distinct entity from a split nucleus; her cells in your body are biologically foreign, like an organ transplant.*  

  ### Sacrifices Made:
  - **Kripke's gamete essentialism:** ONI discards strict gamete origin. The nucleus (from the zygote) is the anchor, not the gametes. This saves the mitochondrial case and avoids your clone hesitation.  
  - **The clone verdict stands:** Your gut rejects it, and ONI agrees. If this wrecks your subplot, consider this: ONI says the clone isn't *you*, but if consciousness arises from identical neural structures, it might *believe* it's you. This could fuel your subplot (identity vs. subjective experience).  

  ### ONI Applied to Your Undecided Cases:
  - **Single base pair correction:** **You.**  
    → The nucleus is the same. A minor edit is like a mutation occurring naturally in utero.  
  - **Whole gene added:** **Still you.**  
    → ONI doesn't flip based on genetic "distance." As long as the nucleus is the original, identity holds. Trait changes don't negate the nucleus's continuity.  
  - **Lab-grown gametes from skin cells:** **Not you.**  
    → Gametes derived from your skin cells create a *new nucleus* at conception. This is closer to cloning than natural conception. The nucleus originates post-you, not at your conception.  

  ### Where ONI Breaks Down (Honest Account):
  - **Twin Absorption Nuance:** ONI cleanly says the survivor is you and the absorbed twin is not. But your intuition that she's "partly him" is biologically true (chimerism). ONI sidesteps this by separating *identity* (who you are) from *composition* (what you're made of). If "partly him" feels existentially vital, ONI might feel cold.  
  - **Mitochondria vs. Clone Inconsistency:** You feel the mitochondrial case is closer to "you" than the clone. ONI explains this (same nucleus vs. new nucleus). But if you *also* feel the clone should be "more you" than, say, a half-sibling, ONI holds—both are equally "not you" due to different nuclei.  
  - **Genetic Thresholds:** ONI ignores genetic edits (a strength for simplicity) but might clash if you imagine edits that radically alter cognition/consciousness. If an embryo with 100 edited genes *feels* like a different person, ONI can't accommodate that.  

  ### Cheapest Path Forward:
  Stick with ONI. It nails 6/7 of your cases and resolves your undecideds cleanly. The only sacrifice is gamete essentialism (a plus for your mitochondrial case) and the clone verdict (which aligns with your gut). For the twin absorption, lean into the distinction:  
  > *"She was me, carrying his cells like a relic. But the self that grieved him was mine alone—a whole from a broken whole."*  

  If this feels too rigid for the twin case, the minimal addendum is:  
  *"Identity may incorporate biological remnants of entities sharing the original nucleus, but does not merge with them."*  
  This keeps the survivor as "you" while acknowledging the absorbed twin's physical legacy.  

  ---  
  **TLDR:** Your principle is **Original Nucleus Instantiation**. You are defined by the nucleus formed when your parents' gametes fused. Everything else (including mitochondria, chimerism, or delays) is environment. Sacrifices strict gamete essentialism and forces the clone to be "not you." Breaks down only if absorbed cells feel like a *fused identity*, not just biological residue.
