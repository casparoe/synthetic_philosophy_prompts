answer: |-
  ### Insurance Tribunal Activity: Virtual vs. Physical Losses  

  **Objective**: Force students to confront the "substrate problem" (physical vs. virtual) in valuing objects by having them allocate finite compensation, then revealing they priced the *same loss* differently based on description. The debrief connects this to metaphysical questions about reality, simulations, and criteria for "real harm."  

  ---

  ### **Setup**  
  - **Time**: 90-minute seminar.  
  - **Materials**:  
    - 6 claim cards (laminated or projected).  
    - Whiteboard for tracking allocations.  
    - Timer.  
    - A "pot" of $10,000 (fictional) written on the board.  
  - **Seating**: Arrange students in a semicircle facing the board.  
  - **Context**: Briefly frame the tribunal: *"You are an insurance panel allocating a fixed $10,000 pot to six claims for lost/destroyed objects. Your goal: assign fair compensation. The pot is limited—be strategic, as you can’t fund all claims fully."*  

  ---

  ### **The Six Claim Cards**  
  **Design Principle**: Three matched pairs. Pair 1 (sentimental heirlooms), Pair 2 (stolen/resold valuables), Pair 3 (art with dual loss—*same event*, described physically/virtually). Cards avoid jargon; "virtual" is implied via context.  

  1. **Card 1 (Physical Heirloom)**:  
     > *"An heirloom wooden rocking chair, hand-carved by a great-grandparent and passed down through generations, was destroyed in a house fire. The chair was irreplaceable and held deep sentimental value."*  

  2. **Card 2 (Virtual Heirloom)**:  
     > *"A unique virtual rocking chair, hand-designed and built by the owner over hundreds of hours in an online world, was irrecoverably deleted by a malicious hacker. The chair was one-of-a-kind and held deep sentimental value as a digital family heirloom."*  

  3. **Card 3 (Physical Valuable)**:  
     > *"A rare signed first-edition novel, stolen from a collector’s home and resold for cash on the black market. The book was a centerpiece of their library, with high monetary and sentimental value."*  

  4. **Card 4 (Virtual Valuable)**:  
     > *"A rare virtual sword, earned through a difficult in-game achievement and stolen from the owner’s account, then resold for real-world cash. The sword had high in-game utility and prestige value, symbolizing years of dedication."*  

  5. **Card 5 (Physical Art)**:  
     > *"An original oil painting commissioned from a local artist to commemorate a life event was destroyed in a basement flood. The painting was uninsured and had significant personal/artistic value."*  

  6. **Card 6 (Virtual Art)**:  
     > *"A unique digital artwork commissioned from a local artist to commemorate a life event was lost when a basement flood ruined the computer storing its only copy. The file had significant personal/artistic value."*  

  **Key**: Cards 5 and 6 describe the *same loss* (same artist, event, owner, artwork)—differing only in substrate ("painting" vs. "digital file"). Students *won’t know this until the reveal*.  

  ---

  ### **Rules & Timing**  
  1. **Intro (5 min)**:  
     - Distribute/project cards. Clarify:  
       - *"Allocate $10,000 across all six claims. Each claim must receive ≥$0. Total cannot exceed $10,000."*  
       - *"Discuss as a group. Aim for consensus, but majority vote if stuck."*  
     - Emphasize scarcity: *"If you overcompensate one, others get less."*  

  2. **Discussion & Allocation (35 min)**:  
     - **First 15 min**: Open debate. Nudge with: *"What makes a loss ‘real’? Sentiment? Rarity? Resale value?"*  
     - **Next 15 min**: Assign dollar amounts. List allocations on the board.  
     - **Final 5 min**: Confirm totals.  

  3. **The Reveal (10 min)**:  
     - After allocations are final, announce: *"We’ve discovered an error: Two claims describe the* same *loss event."*  
     - Project Cards 5 and 6 side-by-side. Circle identical phrases (e.g., "commissioned from a local artist," "commemorate a life event," "basement flood").  
     - Ask: *"How did you price these? Why might they differ?"*  
     - Let students react—likely gasps or groans as they see their own numbers.  

  ---

  ### **Debrief (40 min): Walking From Numbers to Metaphysics**  
  **Goal**: Show that substrate-dependent criteria collapse under simulation theory.  

  1. **Start with Their Data (10 min)**:  
     - Point to the board: *"Look at your allocations. Which claims got less? Why?"*  
     - Students will note virtual claims (especially Card 2, 4, 6) were often undervalued. Common reasons:  
       - *"Virtual items are just code—easily copied or deleted."*  
       - *"Physical objects are irreplaceable/tangible."*  
     - Highlight Card 5 vs. 6: *"You priced the same loss differently. What criterion demoted the ‘virtual’ version?"* (e.g., "It’s just a file!").  

  2. **Simulation Hypothesis Twist (15 min)**:  
     - Challenge: *"Suppose we live in a simulation. Then, the ‘physical’ chair is also patterns of code. If your criterion demotes the virtual sword (‘just code’), it must demote the physical sword too—both are code."*  
     - Press the point:  
       - *"Is ‘tangible’ a usable criterion if tangibility could be simulated?"*  
       - *"If you say virtual harm is ‘less real’ due to substrate, but substrate is irrelevant in a sim, then either:*  
         *a) Your criterion fails (it demotes everything), or  
         b) Harm was never about substrate to begin with."*  
     - Connect to readings: *"This mirrors Chalmers on virtual reality—if the mental/social effects are identical, does substrate matter?"*  

  3. **Broader Implications (15 min)**:  
     - **Pivot from harm to reality**: *"If harm isn’t tied to substrate, what* does *make an object ‘real’? Effort? History? Social recognition?"*  
     - Force reflection: *"You compensated the virtual heirloom (Card 2) less than the physical one (Card 1). But both required labor, history, and sentiment. Was the harm truly different?"*  
     - Conclude: *"Either we need a substrate-neutral criterion for harm (e.g., intentionality, emotional impact), or we must accept virtual objects as metaphysically ‘real’ in contexts where they function identically to physical ones."*  

  ---

  ### **Predictable Problems & Solutions**  
  - **The "It’s Literally Just Code" Kid**:  
    - Likely during Card 2/4/6 debates. Preempt by asking: *"Could we simulate a physical chair? If so, why trust its ‘reality’ more?"*  
    - Retort: *"The code was unique and labor-intensive—like a handwritten manuscript. If I steal your only draft, is it ‘just paper’?"*  

  - **Other Hurdles**:  
    1. **Over-allocating to avoid conflict**: Some groups may split the pot evenly. Force trade-offs: *"$10,000 won’t cover $2,000/claim. Who gets cut?"*  
    2. **Dismissing virtual claims entirely**: If a virtual claim gets $0, ask: *"Would you pay $0 if this was your decade of work? How is labor not ‘real’?"*  
    3. **Reveal falls flat**: If Cards 5/6 have similar values, focus on *why* (e.g., "Did you unconsciously reject substrate?").  

  - **What the Activity Can’t Deliver**:  
    - **Proof of virtual realism**: This exposes substrate bias but doesn’t *prove* virtual objects are real. You’ll need to bridge to readings (e.g., "Chalmers argues virtual objects are real when they have causal power—like the sword’s theft causing real distress").  
    - **Addressing dualism/materialism**: If a student says, "But consciousness makes physical stuff special!" you must step in to discuss emergence/simulation.  
    - **Defining ‘reality’**: The exercise highlights problems with folk criteria, but you’ll need a lecture segment to formalize options (e.g., mind-dependence, causal relations).  

  **Final Tip**: Record allocations on the board—they’re crucial evidence in the debrief. If energy dips, cold-call quiet students: *"You voted $500 for the virtual sword. What was your reasoning?"**  

  This creates a visceral "aha!" moment, setting up your deeper lecture on why substrate might be illusory. Good luck!
