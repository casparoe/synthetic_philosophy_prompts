prompt: |-
  Long-time lurker on LW and the SSC comment section, and I'm stuck in a recurring argument with a friend who does transit planning for a mid-sized city. He's a Deweyan, I've been reading around Carnap's takes on politics and planning, so help me settle whcih of us actually has the better framework.

  The Carnap-side position as I've reconstructed it (tell me if I'm mangling it): value statements aren't the kind of thing that can be true or false, they're expressions of a stance, so neither science nor logic can hand you your ends. But that doesn't dump planning into arbitrary will, because there's still a lot of rational work left: working out what your ends actually commit you to, showing that two ends you're simultaneously holding are mutually incompatible, and ranking means by their expected consequences. And Carnap was anything but a quietist here — he was a socialist who thought a rationally planned social and personal life was an urgent project, which is precisely the bit I have trouble squaring with the non-cognitivism about ends.

  The Dewey side as I understand it: ends aren't outside inquiry at all. They're ends-in-view, proposals formed inside a problematic situation and tested by acting on them, so keeping the fact/value line Carnap keeps is a mistake that hands live questions over to "well, that's just a preference" prematurely.

  The LW-ish way I'd put it: Carnap says the utility function is exogenous and only the search over means is rational; Dewey says the utility function is itself something you should be updating on, and that treating it as frozen is how people end up defending terminal values they'd drop if they bothered to simulate the consequences.

  So compare the two on the question of what a planner is allowed to treat as settled, and then commit. Specifically I want: the class of planning question where the two frameworks route the answer differently — one sends it to evidence and argument, the other sends it to a vote or a decision of will — and a call on who's right about that class. And tell me whether the Carnapian move (we can still show your ends are inconsistent, and we can show what they commit you to) already gets you most of what Dewey wants, meaning the disagreement is just about where to draw a line inside shared territory rather than a real fork.

  Format: exactly five numbered items, a sentence or two each, no introduction and no conclusion. Roughly — (1) the load-bearing disagreement, stated so it can't be dissolved by redefining terms, (2) what the Carnapian view tells my friend to do with such a question, (3) what the Deweyan view tells him, (4) the single thing that decides between them, (5) your verdict. On (5), pick a side and give the reason, plus the strongest comeback the loser has; don't both-sides it, I'd rather be wrong in a definite direction than get a survey. For context I'm currently maybe 60/40 toward Dewey and I'm not confident that's not just motivated reasoning.
reasoning: |-
  Okay, let me tackle this user's query. They're stuck in a recurring argument with a friend about transit planning frameworks, comparing Carnap and Dewey. The user wants a structured comparison with five specific points and a verdict. 

  First, I need to identify the core disagreement. The user mentions Carnap's non-cognitivism about ends versus Dewey's view that ends are part of inquiry. The load-bearing difference seems to be whether values can be rationally revised through experience or are fixed preferences. 

  For point (1), I should phrase this as a concrete planning question where the frameworks diverge. Something like revising transit goals based on unintended consequences would work. Carnap would see changing the goal as non-rational, while Dewey would treat it as part of inquiry.

  Point (2) requires outlining Carnap's approach: the planner should clarify existing goals, check for inconsistencies, optimize means, but leave goal revision to non-rational processes like voting. Point (3) is Dewey's view: treat the goal as a hypothesis, test it through implementation, and revise based on outcomes. 

  For point (4), the deciding factor is whether values respond to empirical feedback. Carnap sees them as static; Dewey sees them as malleable through experience. 

  The verdict (point 5) needs to pick a side. Dewey's approach seems more practical for real-world planning, where goals often need adjustment. But Carnap might argue this risks rationalizing preferences post-hoc. The strongest comeback would be that Dewey's method could lead to goal instability without clear criteria.

  I should ensure each point is concise, avoids introductions/conclusions, and stays within the five-item format. The user's 60/40 leaning toward Dewey suggests they want a decisive answer but are open to being challenged. Highlighting where Carnap's consistency checks fall short in dynamic situations could solidify the case for Dewey.
answer: |-
  1. **Load-bearing disagreement**: Whether revising a transit goal (e.g., "maximize ridership") after observing its unintended consequences (e.g., worsened accessibility for disabled residents) is a rational process (Dewey) or a non-rational preference shift (Carnap).  

  2. **Carnapian directive**: Treat the goal as fixed; rationally demonstrate the inconsistency between "maximize ridership" and "ensure equitable access" if both are asserted, or show how the goal commits to specific means (e.g., bus lanes). Revising the goal itself requires democratic will-formation, not empirical inquiry.  

  3. **Deweyan directive**: Treat "maximize ridership" as a provisional end-in-view; test it by implementing pilot projects, observe consequences (e.g., equity trade-offs), and rationally revise the goal based on learned outcomes—treating the *value* as falsifiable by experience.  

  4. **Deciding factor**: Whether values can be *empirically corrigible*—i.e., if observing real-world outcomes (e.g., marginalized groups harmed) can *rationally compel* a goal adjustment, or merely *motivate* a new preference.  

  5. **Verdict for Dewey**: Real planning requires goals to adapt to unforeseen consequences (e.g., equity flaws in ridership metrics), which Carnap’s exogenous utility function fails to address, risking ossified values. **Strongest Carnapian comeback**: Dewey conflates discovering *hidden contradictions* in goals (which Carnap accommodates) with rational *value revision*, opening the door to post-hoc rationalization of arbitrary preferences under the guise of "learning."
