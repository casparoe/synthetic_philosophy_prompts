  Okay, the user is a retired plant physiologist with extensive experience in water relations and agricultural engineering. They've encountered a philosophical problem about causation related to absences and failures in both managed and natural systems. 

  The core issue they're wrestling with is whether the absence of water can be considered a "cause" of plant death in both scenarios: the controlled irrigation failure at the research station versus the natural drought on the unmanaged slope. They notice a troubling asymmetry - the irrigation failure's causality seems tied to human expectations and systems, while the slope's drought appears causally "bare."

  Hmm, their valve example is particularly insightful - how the same physical state (valve closed) can be framed as either an active event ("valve shut") or an absence ("failed to open"), depending on the system's intended function. This strikes me as a brilliant illustration of how teleology shapes causal attribution.

  The user demonstrates deep philosophical engagement here. They've clearly done their homework on causation literature but found existing frameworks lacking. Their frustration is palpable - especially their desire to avoid making causality dependent on "bookkeeping and social facts" while recognizing the alternative leads to infinite regress.

  What they're really probing is the ontology of absence. The valve case suggests they suspect this isn't just about human descriptions but reflects something fundamental about how causality operates in purposeful systems versus natural ones. Their closing questions reveal sophisticated meta-awareness: is this about the world or just our descriptions of it?

  I recall philosophical work on negative causation (Schaffer, Beebee) and contrastive explanation (Lewis), but they've already dismissed those as insufficient. Dowe's process theory might help with the physical basis, but it famously struggles with absences. The functional perspective (Wright, Cummins) seems more promising given their engineering background - especially how they emphasize "what the component was for."

  The institutional angle is crucial too. When they say "nothing in the metal distinguishes the two," but human arrangements do, they're touching on Searle's institutional facts. The budget line and technician's duty literally create new causal possibilities - like "failure" - that don't exist on the slope.

  Their dual demand is challenging: they want precise conceptual boundaries (where does the slope fit?) while acknowledging the valve case might be a different manifestation. I suspect these are two facets of the same phenomenon - absence-as-cause always requires a contrast class, but that class is defined differently in designed systems (specified functions) versus natural ones (statistical norms).

  The proposed "teleo-institutional causation" attempts to capture this duality. For the slope, we might say the absence only becomes causal against a background of ecological expectations - but note how even those are human-imposed. That's likely why they find this conclusion uncomfortable.

  Ultimately their deepest worry might be ontological: does human intention create new types of causes? The valve example suggests yes - the same physical state has different causal status in different intentional contexts. This would make causation observer-relative in some cases, which clashes with their scientific realism. No wonder they're troubled.
answer: |-
  Your inquiry cuts to the heart of causation's most contentious frontier: **the ontological status of absences and their dependence on normative frameworks**. What you've described isn't fully captured by any single established term, but intersects with several philosophical concepts. Below is a dissection of your phenomenon, its boundaries, and its conceptual neighbors:

  ---

  ### **1. Core Phenomenon: Teleo-Institutional Causation**
  Your observation reveals that **absences function as causes only within a context of purpose, expectation, or institutional design**. This has two facets:
  - **Managed Systems (Irrigation/Slope Valve):**  
    The absence of water/valve actuation is causal *because* it violates a **prescribed function** (e.g., "the controller *ought to* deliver water," "the valve *should* open when signaled").  
    → Here, causality is **institutionally scaffolded**: budgets, manuals, job descriptions define what "should happen," turning omissions into failures.
    
  - **Unmanaged Slope:**  
    Absence of rain is causal *only* against a **biological norm** (e.g., "this species *typically* survives with X rainfall"). No human institution is needed, but a **teleological baseline** (plant survival as an implicit "goal") is required. Remove this, and "lack of rain" becomes a mere condition, not a cause.

  **Boundary Cases:**  
  - The slope *belongs* if we accept ecological norms as teleological.  
  - The valve case is *identical in structure*: the "failure to open" only exists relative to the valve's designed purpose.  

  ---

  ### **2. Contrast with Established Concepts**
  | Concept             | How It Relates                                                                 | Where It Diverges                                  |
  |---------------------|--------------------------------------------------------------------------------|---------------------------------------------------|
  | **Negative Causation** (e.g., Schaffer) | Addresses absences as causes.                  | Treats absences as metaphysically primitive; ignores your **normative dependency**. |
  | **Contrastive Explanation** (e.g., Lipton) | Explains why *this* happened rather than *that*. | Focuses on explanatory pragmatics, not your **event/absence duality**. |
  | **Functional Failure** (e.g., Wright, Cummins) | Matches your valve case ("failure to perform function"). | Confined to artifacts; doesn't extend to natural systems like the slope. |
  | **Institutional Facts** (Searle) | Mirrors your "bookkeeping" concern (e.g., "budget line → duty"). | Explains social ontology, not causation per se. |

  ---

  ### **3. The Event/Absence Reversal: A Matter of Description or Ontology?**
  Your valve example exposes a deeper truth:  
  - **Physically identical states** (valve closed) can be **causally categorized oppositely** (event vs. absence) based on **system telos**.  
  - This is not *merely* descriptive: it reflects that **causality in purposeful systems is teleologically constituted**.  
    → In the irrigation system, the valve's closure *is* a "failure to open" because the system's function defines openness as the default state.  
    → In a system designed to prevent backflow, the same closure *is* an "event" (successful blocking).  

  **Thus, the reversal is ontological for engineered systems**—but for natural systems like the slope, it remains descriptive (reliant on observer-imposed norms).

  ---

  ### **4. Proposed Conceptualization: Norm-Relative Omission**
  **Term:** **Teleo-Institutional Omission (TIO)**  
  **Definition:**  
  > *An absence (A) qualifies as a cause of outcome (O) iff:*  
  > - *(i) A is necessary for O in the actual circumstances,*  
  > - *(ii) There exists a norm, function, or institutional fact (N) that prescribes the presence of non-A,*  
  > - *(iii) N is non-arbitrarily grounded in the system's design, biological imperative, or social agreement.*  

  **Boundaries Clarified:**  
  - **Irrigation failure:** TIO (violates engineered prescription).  
  - **Slope drought:** *Not* TIO (lacks institutional N), but causal via **biological normativity** (a weaker form).  
  - **Valve closure:** TIO if system design defines "open" as default; otherwise, an event.  

  ---

  ### **5. Is This About the World or Our Descriptions?**
  **Both, asymmetrically:**  
  - In **artifacts** (irrigation, valves), TIO is world-involving: functions are real properties of designed systems (e.g., a valve's purpose is physically embedded in its construction).  
  - In **nature** (slope), causal attributions of absence are projection-dependent: we impose norms (e.g., "plants *ought* to survive") to isolate causes from conditions.  
  → Your "bookkeeping" worry is unavoidable for institutional cases but avoidable in biology if norms are naturalized (e.g., via evolutionary functions).

  ---

  ### **6. Why Existing Literature Falls Short**
  - Most work on absences (e.g., Lewis, Beebee) focuses on **logic/metaphysics** (Can nothing cause something?), not **norm-dependence**.  
  - Theories of function (e.g., Millikan, Neander) address norms but not **causal dualism** (event/absence reversal).  
  - Your cases reveal a **causal gradient**: from hardwired teleology (valves) to observer-dependent teleology (slopes), which remains underexplored.

  ---

  ### **Conclusion**
  The closest fit is **functional failure** for engineered systems, but your phenomenon is broader. **Teleo-Institutional Omission** captures the dependence on norms/purpose and explains the event/absence duality. The slope is a boundary case: it falls under TIO only if biological norms are treated as institution-like (controversial but defensible). The valve case is central, revealing that **causation in purposeful systems is inherently normative**. This is not just about language; it reflects how human and biological purposes structure causal relations. For rigorous analysis, I recommend:  
  - *Functions* (Cummins, 1975) for teleology,  
  - *Making the Social World* (Searle, 2010) for institutional facts,  
  - *Causation: A User’s Guide* (Hall & Paul, 2013) for absences.  

  Your empirical grounding in "valves and vulnerability" has exposed a profound nexus of metaphysics, function, and failure—philosophy enriched by the field.
