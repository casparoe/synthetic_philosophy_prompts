prompt: |-
  I am at work on a novel whose central figure holds considerable authority over people who have, in practice, stopped deciding anything for themselves, and I have run into a difficulty in the drafts that I suspect is a conceptual problem rather than a craft problem. I want to know whether what I keep circling has been named.

  In every early draft the man knows what he is doing. He is lucid about his own motives: he understands that he has lifted a burden from his charges for his need to be needed as much as for their relief, and he accepts the trade with open eyes. That version reads as a villain and the book collapses. The version that works is the one in which he believes his own mercy — in which he is not deceiving himself about any fact, since he knows precisely what he has arranged and would defend each arrangement on its merits, but is deceiving himself about why he arranged it. And the reason I think this is more than a character note is that the self-deception seems load-bearing rather than incidental. A man who knew would hesitate; hesitation shows; and the governed read visible strain in an authority as an opening. His efficacy depends on a smoothness that only unselfknowledge supplies, so the deception cannot be set down without the benefit failing.

  I keep meeting the shape of it outside the book. A headmistress my mother was taught by, who settled every significant question in three hundred girls' lives and who, confronted at eighty, was not defiant but genuinely puzzled: she was certain she had been giving them something they could not have borne to hold. And a hospice physician I interviewed, who told a woman her husband was comfortable when he was not, and who years later heard from a colleague that he had done it for himself — a remark he received as slander rather than recognition, because it was true and could not be admitted.

  So: is there an established concept for a benevolent deception of others whose necessary condition is the deceiver's own non-lucidity about his motives? I have found several near neighbours and none of them seems to fit. Ivan's inquisitor is the obvious comparison and differs in a single respect, though I think it is the one that matters: his lucidity is his tragedy, whereas in my case it is the absence of lucidity. There is the old idea of the edifying falsehood a ruler tells his city for its own good, but that is told knowingly, which is the opposite of my case. I half-remember an evolutionary argument to the effect that self-deception pays because a liar who believes himself leaks less — yet that concerns advantage over an adversary, not the preconditions of mercy. And there is the familiar politician who does a shameful thing for good reasons and remains guilty of it; he knows, and mine does not.

  Tell me which of these comes nearest and what each fails to capture, and if none of them does the work, say so plainly and coin something with conditions rather than a definition by illustration: what must hold for the phenomenon to obtain, and what would reduce it to ordinary self-deception, or to paternalism wearing a nicer coat. I am particularly interested in four boundaries. Must the benefit be real, or does the configuration survive the discovery that the charges were in fact harmed? Does it survive partial awareness — a man who suspects and declines to look? Can an office, as distinct from a person, possess it, given that the institution outlives every incumbent's sincerity? And is self-deception about one's reasons marked off anywhere from self-deception about the facts, since my man's is entirely of the first kind? I am not after a reading list. I want the carving, and I want to know where its edges lie.
reasoning: |-
  Okay, the user is working on a novel and facing a conceptual issue with their protagonist. The character holds authority over people who've stopped making decisions for themselves. The user noticed that when the character is fully aware of his motives—that he's satisfying his own need to be needed—the story falls flat, making him seem like a villain. But when the character genuinely believes he's being merciful, without deceiving himself about the facts but about his own motives, the story works. The self-deception is "load-bearing," essential for the character's effectiveness because visible hesitation would undermine his authority.

  The user provides real-world examples: a headmistress who controlled girls' lives and was puzzled when confronted, believing she gave them what they couldn't bear, and a hospice doctor who lied about a patient's comfort and later couldn't admit he did it for himself. The user is looking for a named concept that describes benevolent deception requiring the deceiver's self-deception about motives, not facts. They've considered several ideas but found them inadequate: Ivan's inquisitor (who is lucid), noble lies (told knowingly), evolutionary self-deception (for adversarial advantage), and guilty politicians (who know their motives). None fit because the lack of lucidity is crucial here.

  The user outlines four boundaries for this concept: whether the benefit must be real, if partial awareness is possible, if institutions can embody it, and if self-deception about motives differs from deception about facts. They want precise conditions defining the phenomenon, not just examples.

  I need to address this by first identifying if there's an existing term. Terms like "paternalistic self-deception" or "benevolent auto-deception" come to mind, but they might not fully capture the necessity of self-deception for efficacy. The key elements are: benevolent intent believed by the actor, objective benefit (real or perceived), self-deception specifically about self-serving motives, and this self-deception being functional for maintaining authority.

  For the boundaries:
  1. The benefit doesn't need to be real; the configuration can survive harm if the actor believes they're helping.
  2. Partial awareness might weaken it, but the core requires the self-deception to block disruptive doubt.
  3. Institutions can perpetuate this through systemic mechanisms, even as individuals change.
  4. Self-deception about motives is distinct from facts; here, it's about internal reasons, not external realities.

  Since no existing term perfectly fits, I'll coin "Functional Altruistic Blindness" (FAB). This emphasizes the blindness to self-interest as functional for maintaining benevolent authority. I'll clarify the necessary conditions and what reduces it to mere paternalism or self-deception. The user needs this for their novel's authenticity, so providing a clear conceptual framework will help them address their storytelling challenge effectively.
answer: |-
  There is no established, widely recognized term for this precise phenomenon in philosophy, psychology, or political theory. The configurations you've encountered ("noble lie," evolutionary self-deception, tragic lucidity, conscious guilt) are indeed near-misses because they lack the specific, *necessary interdependence* you've identified: **the benevolent outcome (real or perceived) for the dependent group is functionally dependent on the authority figure's genuine self-deception regarding their *own* self-serving motives.** This isn't incidental self-deception; it's the load-bearing pillar supporting the structure of effective, unstrained, "merciful" control.

  Here's the carving, defining the phenomenon through its necessary conditions and boundaries, drawing on your insights and distinctions:

  ### Proposed Coinage: **Functional Altruistic Blindness (FAB)**

  **Core Conditions (What Must Hold):**

  1.  **Benevolent Intent (Subjectively Held):** The authority figure genuinely believes their actions are primarily or solely for the benefit, relief, or protection of the dependent group. This belief is sincere, not a conscious performance.
  2.  **Objective Benefit/Relief (Real or Perceived):** The actions undertaken *do* provide a tangible benefit or relief to the dependent group (e.g., removing burdens of decision, providing comfort, ensuring stability), OR the authority figure perceives that they do. The benefit must be non-trivial and directly address a claimed need of the dependents.
  3.  **Concealed Self-Serving Motive (Objectively Present):** There exists a core, powerful, self-serving motive driving the authority figure (e.g., need for control, need to be needed, avoidance of chaos/conflict, affirmation of identity/power, personal comfort). *This motive is the true engine.*
  4.  **Essential Self-Deception (Specific to Motives):** The authority figure is *genuinely unaware* or *fundamentally misunderstands* the nature and strength of the self-serving motive (#3). Crucially:
      *   They are typically lucid about the *facts* of the situation and the *mechanisms* of their control ("he knows precisely what he has arranged and would defend each arrangement on its merits").
      *   Their self-deception focuses *exclusively* on *why* they do it – they misattribute their primary motivation to pure benevolence (#1), failing to integrate the power of #3.
  5.  **Functional Necessity:** The self-deception (#4) is not merely a psychological quirk; it is *necessary* for the *effectiveness* of the benevolent outcome/control (#2). Lucidity about the self-serving motive (#3) would:
      *   Introduce hesitation, doubt, or internal conflict ("A man who knew would hesitate").
      *   This internal state would become perceptible ("hesitation shows").
      *   The perception of doubt/strain by the dependent group would undermine the authority's perceived infallibility, certainty, or benevolent unity of purpose ("the governed read visible strain in an authority as an opening").
      *   This perceived opening would destabilize the system, making the purported benefit (#2) harder or impossible to deliver ("His efficacy depends on a smoothness that only unselfknowledge supplies, so the deception cannot be set down without the benefit failing").

  ### Boundary Analysis (The Edges)

  1.  **Must the benefit be real? Does it survive the discovery of harm?**
      *   **No, the benefit doesn't need to be objectively real or net-positive.** The configuration survives if the *authority figure genuinely believes* the benefit is real (Condition #1). The headmistress *believed* she gave the girls something they "could not have borne to hold." The physician *believed* he provided comfort (even if falsely). FAB is about the *structure of belief and its functional necessity for control*, not objective outcomes.
      *   **Yes, it can survive the discovery of harm.** The discovery of objective harm might cause distress, cognitive dissonance, or justification ("It was necessary," "They couldn't handle the truth"), but the *core self-deception about motives* (#4) often remains intact precisely *because* admitting the self-serving motive would collapse the entire justification for the actions that caused the harm. The physician received the truth about his motive as "slander," not recognition, protecting the structure. The harm is often rationalized *within* the framework of perceived benevolence.

  2.  **Does it survive partial awareness?**
      *   **Barely, and only in a highly unstable form.** A flicker of suspicion ("a man who suspects and declines to look") might exist, but FAB requires the self-deception to be robust enough to *prevent* that suspicion from becoming integrated knowledge or causing disruptive hesitation/doubt (Condition #5). If suspicion surfaces enough to cause visible strain or hesitation that destabilizes the authority, FAB collapses. The "declines to look" aspect is the *active maintenance* of the self-deception, crucial for functionality. Deep down, the core motive must remain unacknowledged *as the primary driver*. Sustained partial awareness likely erodes FAB over time, making the "smoothness" impossible to maintain.

  3.  **Can an office/institution possess it?**
      *   **Yes, indirectly and systemically.** While self-deception is inherently individual, institutions can create and perpetuate the *conditions* for FAB:
          *   **Doctrine & Mythology:** The institution codifies narratives of pure benevolence and the inherent dependency/incapacity of the governed, providing a ready framework for individuals to adopt.
          *   **Selection & Training:** Selecting and promoting individuals predisposed to this mindset or training them into its language and justifications.
          *   **Ritual & Procedure:** Rituals reinforce the benevolent self-image; procedures obscure individual motives behind institutional necessity ("It's not *me*, it's the *role*/the *rules*").
          *   **Succession:** The *role* demands the smooth delivery of the benefit/control. New incumbents inherit the system and its doctrines. If adopting FAB is the most effective (or only) way to fulfill the role's demands smoothly, individuals will gravitate towards it or be shaped by it, regardless of their initial sincerity. The institution "possesses" FAB by structurally incentivizing and reproducing it in its agents.

  4.  **Is self-deception about motives distinct from self-deception about facts?**
      *   **Yes, critically.** This is the defining characteristic separating FAB from other concepts. FAB *requires* lucidity about the factual arrangements (what is being done, the mechanisms of control, the state of the dependents - Condition #4a) *combined* with self-deception *only* about the internal, driving *motivation* (Condition #4). The headmistress knew she decided everything; the physician knew the husband wasn't comfortable. Their deception was solely about *why* they did it – attributing it purely to the other's need, not their own. This distinction is crucial because:
          *   Deception about facts is harder to sustain against evidence and directly impacts competence.
          *   Deception about motives is internally focused, allowing for high external competence and rational defense of actions ("on their merits") while shielding the core psychological driver. It's the *why* blindness that enables the smooth, unconflicted *how*.

  ### How FAB Differs from Near-Misses

  *   **Ivan's Inquisitor (Conscious Paternalism/Tragic Lucidity):** Knows his motive (power/control) and consciously chooses the "noble lie" for the people's *perceived* good. His lucidity *is* the tragedy and the burden. FAB lacks this lucidity; the burden is absent because the self-serving motive is hidden *from the self*. The tragedy in FAB is the *necessity* of the blindness for the "mercy" to function.
  *   **Noble Lie (Plato/Kelsen):** A conscious, strategic deception *about facts* (e.g., the Myth of Metals) told by a lucid ruler for the perceived stability of the state. FAB involves self-deception *about motives*, not facts, and is not consciously deployed strategy.
  *   **Evolutionary Self-Deception (Trivers):** Focuses on deceiving *others* more effectively by believing one's own lie, primarily in competitive/adversarial contexts (deceiving a rival). FAB is about maintaining benevolent *care/control* over dependents, not defeating adversaries. The "smoothness" avoids internal conflict disrupting care, not leakage cues betraying a lie to an enemy.
  *   **Guilty Conscience/Paternalism:** A politician knowingly doing a "shameful thing for good reasons" experiences guilt because they *are* lucid. FAB experiences confusion or outrage (like the physician) when confronted with their true motive, because lucidity is absent. Standard paternalism can be conscious; FAB requires the paternalist to believe their own hype about their pure motives for the system to work smoothly.

  **In essence, Functional Altruistic Blindness (FAB) describes the condition where an authority figure's effective provision of a perceived benefit to a dependent group is structurally dependent upon that figure's genuine inability to recognize the core self-serving motive underlying their "benevolent" control.** The self-deception is not a flaw; it's the keystone. Its collapse doesn't just reveal hypocrisy; it destabilizes the entire edifice of the "mercy" it enables. This is the conceptual space your drafts and examples are powerfully inhabiting. Use the conditions and boundaries above as your chisel.
