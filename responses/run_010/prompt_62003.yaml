prompt: |-
  I'm helping run a debate at my uni politics society next week, motion roughly 'this house believes the EU is constitutionally incapable of reform', and in the run-up two people have leaned hard on the same four words to argue opposite conclusions. Our eurosceptic speaker says the treaties commit the EU to "an ever closer union among the peoples of Europe", so a federal end-state is baked in and no amount of voting or reform-from-within can stop it. Then someone on the other side told him that's rubbish, the phrase is just preamble poetry with no legal effect at all, and offered as proof that the UK apparently got an 'opt-out' from it back in the renegotiation before the 2016 referendum — you can't opt out of something, they said, unless it's already nothing.

  Can you lay out for me the distinct precise claims that phrase could actually be making? Not a history of European integration and not a summary of the argument, a menu I can bring to the debate and hold both of them against. Specifically I want:

  - the different places the wording sits in the treaties and whether being in a preamble versus being in an article changes what it does, or whether that's a distinction without a difference here
  - what kind of speech act it could be: a commitment, an obligation, a statement of aim, a description of what's already happening, or an instruction to whoever ends up interpreting the treaties — and for each, who exactly it binds, if anybody
  - the 'ever closer' as open-ended process with no destination versus 'ever closer' as a destination you can name, and what would have to be true of the second one for the eurosceptic to get his inevitability claim out of it
  - whether the plural matters — a union among peoples rather than a union of states — and whether that does any work for or against the sovereignty version of the argument
  - for each reading, a verdict: platitude that nobody would deny, substantive and genuinely contestable, or just false
  - which of the readings actually supports the 'reform is impossible' conclusion, and which reading the other side needs to be able to call the whole thing empty

  And then the opt-out business, which is the bit I find most confusing. What would it even mean to opt out of a phrase, and does the fact that member states bothered to negotiate one tell you the phrase was inert all along, or the opposite? If there's a reading under which the opt-out makes sense, say what that reading has to be.

  Finish with a short section on the tell — how I can spot, in real time, which of these readings someone is smuggling in when they say the phrase, from what they do with it in the next sentence.
reasoning: |-
  Okay, let me unpack this user's request. They're organizing a university debate about EU reform incapacity, and need clarity on the "ever closer union" phrase that's being weaponized by both sides. The core ask is for a precise taxonomy of interpretations - not history or opinions, but a forensic breakdown of how these four words function legally and politically.

  Hmm, the user's frustration is palpable - they mention two debaters using the same phrase to argue opposites, and seem especially confused about the UK opt-out paradox. This isn't just academic; they need practical debate ammo. I should resist diving into integration theory and stay strictly within their requested framework: treaty placement, speech acts, plurals, opt-out mechanics.

  First, treaty architecture matters. That preamble vs. Article 1(2) distinction isn't lawyer pedantry - preambles set interpretive direction while articles create obligations. The eurosceptic is pretending Article 1's placement makes "ever closer" a binding ratchet, when actually it's... <checks TEU consolidated version>... still contextual. But the pro-EU side oversimplifies by calling it "just poetry." Truth is, preambles have teeth in EU law through the teleological interpretation method. 

  On speech acts: is it a commitment (who commits?), aim (binding or aspirational?), or descriptor? The key is who it binds. If it's an institutional obligation, the Commission could push integration; if member state obligation, they're duty-bound not to backtrack. But the CJEU case law shows it's mostly used to justify existing powers, not create new ones. 

  "Ever closer" as process vs. destination is where the inevitability claim lives or dies. If it's a direction (process), reform means steering; if an end-state (destination), deviation is forbidden. The plural "peoples" subtly undermines state sovereignty arguments - it implies direct political community, not just interstate cooperation. 

  The UK opt-out... ah, the user's real pain point. Cameron didn't get removal but a "non-binding" clarification that it doesn't commit to federalism. That's the tell: if the phrase were truly inert, why negotiate? But if binding, why only get a footnote? Answer: it's politically potent but legally flexible. 

  For debate tells: watch what they do next. Europhiles will jump to "it's just preamble" to dismiss; sceptics will invoke "ever closer" as irreversible. The smart move is to note how both extremes are wrong - it's neither trivial nor inevitable, but a contested principle whose force depends entirely on political will and judicial interpretation. 

  Final thought: the user needs this structured for rapid deployment. I'll organize by their exact bullet points, then flag the rhetorical traps in real-time debate.
answer: |-
  Here's a precise breakdown of the distinct claims embedded in "an ever closer union among the peoples of Europe," designed as your debate menu:

  ### 1. Treaty Placement & Legal Effect
  *   **Article 1(2) TEU (Current):** "This Treaty marks a new stage in the process of creating an ever closer union among the peoples of Europe..." (Operative Article).
  *   **Preamble TEU (Current):** "...RESOLVED to continue the process of creating an ever closer union among the peoples of Europe..." (Recital).
  *   **Distinction:** The distinction **matters significantly**.
      *   **Article:** Has *potential* to create a binding legal objective or principle. Courts *can* use it to interpret other provisions or assess the legality of actions, though it's rarely a standalone basis for action.
      *   **Preamble:** Provides crucial **context for interpreting** the treaty's operative provisions. It sets the overall purpose and spirit (the *telos*). Courts *must* consider it when interpreting ambiguous Articles. It doesn't create freestanding obligations but guides how other obligations *are understood*.
  *   **Verdict:** **Substantive and genuinely contestable.** Its placement gives it more weight than "mere poetry," but significantly less than a direct command. Its legal effect is primarily *interpretive*.

  ### 2. Type of Speech Act & Who is Bound
  *   **Statement of Existing Fact:** A description of the integration trajectory *as it stood* at the treaty's signing. **Verdict:** **False.** It clearly points to a *future* process.
  *   **Description of an Ongoing Process:** "Creating" implies an active, continuing endeavor already underway. **Verdict:** **Platitude.** Everyone agrees integration was/is ongoing.
  *   **Statement of Aim/Objective:** The core reading. The EU and its Member States collectively *aim* for this outcome. It sets a direction of travel.
      *   *Who Bound?* Primarily the **EU Institutions** (Commission, Parliament, Council, CJEU) to interpret and apply treaties *in light of this objective*. Member States are bound *collectively* via the treaty they ratified, but its impact on *individual* state actions is indirect and mediated through EU law.
  *   **Binding Legal Commitment/Obligation:** Imposes a positive duty on institutions/Member States to actively pursue further integration steps. **Verdict:** **False/Overstated.** While it's a fundamental objective, it doesn't mandate *specific* further integration, nor prevent other objectives (like subsidiarity, proportionality, national identity - Art 4(2) & 5 TEU). It's one objective among several.
  *   **Interpretive Instruction:** Directs courts (especially the CJEU) and institutions to *favor interpretations of EU law* that promote deeper integration. **Verdict:** **Substantive and genuinely contestable.** This is its primary *legal* function (teleological interpretation), but it's balanced by other treaty principles.

  ### 3. "Ever Closer": Process vs. Destination
  *   **Open-Ended Process ("Ever Closer"):** Integration is a continuous journey with no predefined, final federal "end-state." The goal is the *process itself* – deepening cooperation step-by-step without a fixed terminus. **Verdict:** **Substantive and contestable.** This is the dominant legal and political interpretation.
  *   **Fixed Destination ("Union"):** "Union" implies a specific, preordained end-point (e.g., a federal superstate). "Ever closer" simply describes the path *to* that destination. **Verdict:** **False/Substantively contestable.** The treaties never define the end-state. The sceptic needs **both** this destination reading **AND** proof it's **legally irreversible** (which it isn't – treaties can be amended or states can leave) for inevitability. Neither holds.

  ### 4. "Peoples" vs. "States"
  *   **"Peoples":** Implies integration is building a political community transcending national borders, involving citizens directly ("democratic deficit" arguments often stem from this). Suggests legitimacy derives from European citizens, not just governments. **Works AGAINST** pure state sovereignty arguments.
  *   **"States":** (Not stated, but often implied by sceptics). Focuses on cooperation between sovereign nations. The phrase **explicitly rejects** this by using "peoples."
  *   **Verdict:** **Substantive.** The wording deliberately emphasizes building a union *of citizens*, not just a club *of states*. This supports arguments about the EU's supranational nature and potential democratic challenges.

  ### Which Reading Supports "Reform Impossible"?
  *   Only a **Binding Legal Commitment/Obligation** reading *combined* with the **Fixed Destination** reading ("Union" as federal superstate) *could* support this. As shown, both are weak/incorrect interpretations. The **Interpretive Instruction** reading *facilitates* integration but doesn't *prevent* reform or treaty change altering the objective.

  ### Which Reading Makes it "Empty"?
  *   The **Statement of Existing Fact** or treating it as **Purely Poetic Preamble with Zero Effect** readings render it empty. The pro-EU debater needs one of these. The legal reality (its use in interpretation) contradicts this.

  ### The UK "Opt-Out" Explained
  *   **What Was Agreed (2016):** The European Council agreed to append a legally binding Decision to the treaties stating that the "ever closer union" phrase "does not equate to a commitment to further political integration" for the UK/Ireland, and that treaty references to the objective "do not offer a legal basis" for extending EU powers or undermining Member State competence. It also noted the UK was "not committed to further political integration."
  *   **What it Means:**
      1.  **Rejects Fixed Destination Reading:** Explicitly denies "ever closer union" mandates an inevitable federal end-state *for the UK*.
      2.  **Clarifies Interpretive Instruction:** States the phrase cannot be used *against the UK* as a *standalone legal basis* to justify new EU powers it opposes or to override subsidiarity/national identity protections *as they apply to the UK*.
      3.  **Acknowledges Political Weight:** You don't negotiate an opt-out from something truly inert. It confirms the phrase *has* political and *potential* legal significance needing clarification/limitation for a specific member.
      4.  **Does NOT Remove the Phrase:** The objective remains for the EU as a whole and binds the institutions generally. The UK opt-out was a **shield against specific interpretations/uses** of the phrase concerning the UK, not its erasure.
  *   **Reading Required for Opt-Out to Make Sense:** The phrase must be understood as a **substantive Interpretive Instruction** with **potential legal consequences** that could, without clarification, be used to push integration in ways a Member State finds unacceptable. It confirms the phrase is **not inert** but seeks to **limit its application** for one state within the existing framework. It *undermines* the "fixed destination" reading and *supports* the "interpretive aim with potential bite" reading.

  ### Spotting the Smuggled Reading (The Tell)
  Listen for the **very next thing** they say after invoking the phrase:
  *   **"Therefore, federalism is inevitable / we must abolish the nation-state."** → Smuggling the **Fixed Destination + Binding Obligation** readings.
  *   **"Therefore, the CJEU can always expand EU powers using this."** → Smuggling the strong **Interpretive Instruction/Binding Obligation** reading, ignoring subsidiarity/Art 4(2)/Art 5.
  *   **"Therefore, any attempt to slow or reverse integration is illegal."** → Smuggling **Binding Obligation** and/or **Fixed Destination**.
  *   **"It's just words in the intro, it means nothing legally."** → Smuggling the **Purely Poetic/Zero Effect** reading, ignoring CJEU jurisprudence and the opt-out logic.
  *   **"It shows the goal is a union of citizens, not just governments."** → Correctly identifying the **"Peoples"** significance.
  *   **"It sets a direction, but we control the speed and destination via treaties and politics."** → Embracing the **Aim/Open-Ended Process** reading.

  **Your Debate Power Move:** Force each side to explicitly state *which* of these precise readings they are using and *how* it leads to their conclusion about reform impossibility or emptiness. Challenge the sceptic on why "ever closer" *must* mean a fixed federal state and how it binds irreversibly. Challenge the pro-EU side on why the CJEU *always* cites preambular objectives if they are meaningless and what the UK was opting out *from* if the phrase is inert. The truth lies in the nuanced middle: it's a powerful **interpretive aim**, not an inevitable federal command nor empty poetry.
