prompt: |-
  I'm writing the "how we represent uncertainty" section of a proposal for a decision-support tool used by a county public-health board. The situation is this: the evidence is thin and conflicting (two small studies pointing different ways, an expert panel that splits down the middle, historical data that's arguably not transferable), the board has to act anyway, and they've told us bluntly that they hate being handed a single number that pretends to more precision than anybody has. My instinct is to go with imprecise probabilities — credal sets, or lower and upper previsions in Walley's sense — but my committee wants the framework choice defended against the alternatives, and I'd rather do that honestly than cheerlead for my own view.

  So: write me the desiderata. What does a framework for representing evidentially underdetermined uncertainty have to deliver to count as adequate *for this job*? Give me the phenomena it must capture, the cases it must get right, the distinctions it must not collapse, and the results it has to stay consistent with — with the motivating case or consideration behind each item, and a mark on each saying whether it's a genuine requirement or a prejudice of one camp. The ones I especially want pinned down:

  - whether there are inputs where a precise number would be a lie, and what exactly that claim amounts to — I want a worked case, not a restatement of the intuition
  - what the framework owes you on updating, including whether the set is allowed to get *wider* on new evidence, and whether an agent can know in advance that she's about to dilate (reflection-principle territory)
  - whether it has to produce a determinate recommendation, and if not, what it owes the board instead when they ask what to actually do on Tuesday
  - what decision rule it's commited to (maximin, E-admissibility, gamma-maximin, something else) and which classic constraints on decision rules — sure-thing, no dynamic money pump, no getting trapped by a sequence of individually reasonable bets — that rule buys and which it sells
  - whether an accuracy-dominance style argument, run over sets of credence functions rather than single ones, cuts for or against wide sets
  - the reduction worry: what stops a precise second-order probability distribution over candidate chances from doing all the same work with less machinery? If the honest answer is that nothing does, say so and say what's left over

  Then flag any subset of these that you think can't be jointly satisfied — I suspect there's one, and I'd much rather my committee hear it from me than discover it in review. And tell me which single requirement knocks out the most contenders, possibly including mine. Two-sentence verdicts at the end on precise Bayesianism, credal sets, and second-order probabilities, no more than that. No citations or reading list — I've got the lit, I just need the spec.
reasoning: |-
  Okay, the user is working on a proposal for a decision-support tool for a public health board dealing with high uncertainty. They need to justify using imprecise probabilities over alternatives. Let me break down their requirements.

  First, the key issue is that the board hates single numbers when evidence is weak. So the framework must avoid false precision. A concrete example: two small studies, one showing a drug works, one not. Claiming a precise 50% effectiveness misrepresents the evidence. That's a core requirement.

  Then updating: with new conflicting data, the credal set should widen. If initial studies conflict, and a third small study adds more doubt, the range expands. The framework must allow dilation—where uncertainty increases after an update. That's genuine, not optional.

  Decision rules are tricky. The tool shouldn't force a single recommendation. Instead, it should show options (E-admissible) and explain trade-offs. Using maximin might be too conservative. The board needs to understand risks without being pushed into one choice.

  Accuracy dominance arguments over sets: wide sets might be accuracy-dominated by narrower ones, but that's acceptable if it honestly reflects ignorance. Not a flaw but a feature.

  Reduction to second-order probabilities: using a distribution over possible chances could work, but requires specifying priors, which might be arbitrary. Credal sets avoid that by staying agnostic. However, if the board can agree on priors, second-order might be better.

  Contradictions: Requiring both dilation and coherence (like avoiding sure loss) is tough. Dilation might violate reflection. Also, avoiding false precision while wanting a decision rule might conflict. Maximal sets could lead to indecision.

  Precise Bayesianism fails on false precision. Credal sets handle ignorance well but face decision challenges. Second-order probabilities need prior justification, which might not exist here. Credal sets are best for this case, but the user must acknowledge the trade-offs to the committee.
answer: |-
  Here are the desiderata for representing uncertainty in your public health decision context, framed as mandatory requirements (*R*) or common prejudices (*P*), with justifications and explicit answers to your flagged issues:

  ### Core Desiderata
  1.  **Avoids False Precision (R):** Must *not* produce a single precise probability when evidence is fundamentally insufficient to justify it.  
      *   **Phenomenon to Capture:** Scenarios like your conflicting small studies (Study A: RR=0.7 [95%CI: 0.4-1.2], Study B: RR=1.4 [95%CI: 0.8-2.5]). Claiming P(Effect)=0.55 *hides* the conflicting estimates and wide CIs. **Worked Case:** Assigning P(Harm)=0.4 based solely on this evidence is a "lie" because it asserts more information (a specific, justified point estimate) than exists; it collapses the range [0.25 (from Study A's upper harm bound) to 0.6 (from Study B's lower harm bound)] and the conflict. The framework must preserve this indeterminacy.
  2.  **Represents Genuine Conflict & Ambiguity (R):** Must distinguish between *imprecision due to limited data* (narrow range) and *imprecision due to conflicting evidence* (wide range, potentially multimodal). Must not collapse "we don't know *yet*" (statistical uncertainty) and "experts fundamentally disagree" (epistemic ambiguity).  
      *   **Motivation:** The split expert panel vs. sparse historical data represent distinct types of uncertainty requiring different potential responses (seek consensus? gather new data? accept fundamental disagreement?).
  3.  **Accommodates Dilation on Update (R):** Must allow the uncertainty representation (e.g., credal set) to *widen* upon receiving new, relevant but ambiguous evidence. Must not force narrowing.  
      *   **Case:** Initial credal set for efficacy based on Study A & B spans [0.25, 0.6]. New small Study C reports RR=1.1 [95%CI: 0.5-2.4]. A valid update *must* allow the set to widen (e.g., to [0.2, 0.65]) reflecting increased ambiguity. **Reflection:** The framework *should* allow an agent to know dilation is *possible* upon learning a specific type of evidence (e.g., "If we get another underpowered RCT, our uncertainty might *increase*").
  4.  **Supports Decision-Aiding Without Dictating Action (R):** Must *not* be required to output a single "optimal" action in all cases of severe uncertainty. Instead, it **must**:  
      *   Identify the set of *E-admissible* actions (actions optimal for *some* probability function in the credal set).
      *   Highlight the key trade-offs and vulnerabilities between actions (e.g., "Action A is best if efficacy >0.5, but worst if efficacy <0.3; Action B is never best but rarely catastrophic").
      *   **Obligation to the Board:** Provide the E-admissible set and a clear map of the robustness/resilience/vulnerability of options across the uncertainty set. The *board* chooses, informed by values & risk tolerance.
  5.  **Commits to a Defensible Decision Rule (R):** Must explicitly state the recommended decision rule for use *with* its uncertainty representation.  
      *   **Rule & Trade-offs:**  
          *   **Gamma-Maximin (Maximin Expected Utility):** Maximizes worst-case performance. **Buys:** Extreme prudence, avoids catastrophic losses (vital in public health). **Sells:** Violates Strong Dominance (can reject an action better *in all scenarios* if its *minimum* isn't best), can be overly conservative, vulnerable to "money pumps" if preferences shift dynamically based on the min.
          *   **E-Admissibility:** Choose actions optimal under *some* plausible probability. **Buys:** Satisfies Dominance (if A > B everywhere, B not E-admissible), avoids obvious irrationality traps. **Sells:** Can leave multiple options, requires secondary criterion (e.g., MaxiMin regret, further robustness) or board judgment for final choice. May not satisfy Sequential Consistency (dynamic money pump concerns are nuanced but possible).
      *   *Maximin* alone is insufficient (ignores non-worst cases). *Maximax* is reckless. **Recommendation:** E-admissibility as the primary filter, supplemented by Gamma-Maximin *Regret* or Interval Dominance for refinement if needed.
  6.  **Accuracy Argument Compatibility (P/R Hybrid):** Accuracy-dominance arguments *over sets* suggest a wider set can be dominated by a narrower one containing the "true" credence, but **this is not a fatal flaw (P)**.  
      *   **Requirement (R):** The framework must *allow* wide sets when warranted by evidence (Desideratum 1 & 3). Dominance arguments favor precision *given sufficient evidence*; they do *not* mandate unjustified precision. A wide set *honestly* representing ignorance cannot be accuracy-dominated by a precise *false* belief. The dominance pressure is towards justified precision, not away from justified imprecision.
  7.  **Addresses the Reduction Worry (R):** Must justify why a second-order probability distribution isn't sufficient.  
      *   **Stops Reduction?** **Nothing *stops* it, but it often *fails* by reintroducing false precision.** Specifying a precise prior over the first-order hypotheses (e.g., a Beta distribution over efficacy probabilities) requires unjustified assumptions when evidence is thin/conflicting. **What's Left Over:** Credal sets (or lower/upper prevision) are the *minimal* representation capturing only the *constraints* justified by evidence/domain knowledge. A second-order model adds extra, unsupported structure (the precise prior). **Advantage of Second-Order:** Clean updating via Bayes. **Disadvantage:** The "precise prior" is often the very "lie" (Desideratum 1) the board rejects. It *can* approximate a credal set via e.g., sets of priors, but then it *is* a credal set.

  ### Critical Tensions & Knockout Requirement
  *   **Inherent Tension:** Satisfying **Avoids False Precision (R)**, **Accommodates Dilation (R)**, and maintaining coherence under standard **Decision Rules (like avoiding sure loss or strong dominance violations) (R)** is challenging. Dilation can violate the *Reflection Principle* (if I know my future credal set will widen upon seeing E, my current set should already be wide enough to include those future credences). Strict coherence (avoiding sure loss under all priors in the set) can sometimes conflict with maximal dilation justified by evidence. **You likely need to accept slightly weaker coherence notions (e.g., avoiding uniform sure loss) or acknowledge that dilation might imply a form of dynamic inconsistency in extreme cases.**
  *   **Knockout Requirement:** **Avoids False Precision (R)** is the most potent. It immediately disqualifies standard **Precise Bayesianism** in this context. It also creates significant problems for **Second-Order Probabilities** unless they degenerate into a set representation. It strongly favors **Credal Sets/Lower Previsions**.

  ### Two-Sentence Verdicts
  *   **Precise Bayesianism:** Fails core Requirement 1 (Avoids False Precision), producing unjustifiably precise numbers from thin evidence. Its forced precision undermines trust and misrepresents the epistemic state for this board's needs.
  *   **Credal Sets / Lower Previsions:** Best satisfies Requirements 1, 2, 3, & 6, directly representing ignorance and conflict; Requirement 4 (Decision-Aiding) is met via E-admissibility, but Requirement 5 (Decision Rule) requires careful choice (Gamma-Maximin may be too conservative).
  *   **Second-Order Probabilities:** Risks violating Requirement 1 by demanding a precise prior over hypotheses; it *can* mimic a credal set but adds unnecessary complexity and assumption-laden structure unless the prior *is* imprecisely known (which reduces it to a credal set).
