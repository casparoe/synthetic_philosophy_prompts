prompt: |-
  For three seasons I have hosted a small philosophy podcast for listeners who have some background but are not specialists. In two weeks my guest is a philosopher working squarely in the Parfitian tradition on personal identity. She accepts the standard teletransporter verdicts: when a scanner on Earth records the state of every cell in my body, destroys me, and transmits the data so that a replica can be assembled from local matter on Mars, identity does not survive but what matters does, because what matters is relation R — psychological connectedness and continuity holding with an appropriate kind of cause — rather than identity, and because R can hold without identity, as it does when both halves of a divided brain are successfully transplanted.

  Her distinctive contribution, and the reason I want her on the program, is a proposed refinement. She argues that R is not by itself what makes survival matter. What matters, on her account, is uptake: whether the later person is able and disposed to carry forward the earlier person's commitments, projects, and cares. She maintains that uptake can obtain with very little psychological connectedness, and can fail despite near-perfect connectedness — as when a replica inherits every one of my memories and traits but repudiates my life's work and treats it as a stranger's.

  That refinement has stopped being an abstraction for me. My mother is in the late stage of Alzheimer's disease. Autobiographical memory is gone and she no longer recognizes me as her son, but she still hums the hymns she sang for fifty years, still fusses over the tomatoes my father plants, and still refuses to let anyone but the aide who has been with her for nine years hold her hand. Later this month my brother and I must decide whether to honor the advance directive she wrote a decade ago refusing artificial nutrition, or to attend instead to the evident contentment of the person she has become. I want the interview to be rigorous rather than therapeutic, though I expect members of my family will listen to it.

  Please write me nine or ten questions for the interview. For each, supply a one-line note identifying where the pressure lies — why the answer she is most likely to give does not dissolve the difficulty — and a follow-up keyed to that likely answer, framed so as to close off that particular escape rather than merely re-asking. Where a question turns on a case, state the case in no more than two sentences, and keep every question brief enough to be answered in under two minutes on air.

  Constraints and required coverage:

  - No warm-ups, no biographical questions, nothing of the form what first drew you to this problem.
  - Assume she is an excellent philosopher who has already answered the two obvious objections to uptake: that it either redescribes R or has nothing to do with it, and that it makes what matters in my survival hostage to attitudes I cannot influence or predict. Do not let the interview re-litigate those objections at that level; include at least one question per objection that presses past her known reply.
  - At least one question must put my mother's case to her directly. On her own account, uptake can survive the loss of connectedness, and my mother plausibly has uptake with almost no connectedness. Make her say whether the person who wrote that directive still exists, and whether her verdict is supposed to console a family or unsettle it.
  - At least one question on whether uptake requires the right kind of causal link, or whether a stranger who reconstructs my commitments from a journal and carries them forward has taken up my life — and what the view forfeits whichever way she answers.
  - At least one question on branching. If two replicas both take up my commitments, is that twice as good as one, no better, or worse, and does her refinement quietly restore the non-branching requirement she was trying to dispense with?
  - At least one question on the biological challenge: the view that we are human organisms whose persistence conditions are biological, and that an organism in my mother's condition is plainly still present. Ask what uptake adds to or subtracts from that claim, and do not let her dismiss the challenge as a confusion about what matters.
  - At least one question on whether, if reductionism about persons is true, the special self-interested concern each of us has for our own future loses its rational footing — and whether she accepts that consequence or blocks it, and on what grounds if she blocks it.
  - At least one question with practical teeth about precedent autonomy: whether an advance directive can bind on her account, and what she would say to a family deciding as mine is deciding. She may not retreat into the claim that this is a legal question rather than a metaphysical one.
  - End with a question about defeaters: what case or argument would make her abandon uptake, or concede that identity rather than R is what matters.
  - Be fair to her. No question may be phrased so as to presuppose that she is wrong, and no question should attribute a view to a named philosopher unless you are confident the attribution is correct; where you are not, describe the objection without naming anyone.
reasoning: |-
  Okay, let's tackle this query. The user hosts a philosophy podcast and needs interview questions for a guest specializing in Parfit's views on personal identity, particularly her "uptake" theory. The user's personal connection with his mother's Alzheimer's situation adds emotional weight. 

  First, the constraints are specific: no warm-up questions, avoid re-litigating known objections, cover all required topics. Each question needs a pressure point note and a follow-up. The mother's case must be addressed directly, along with branching, biological challenge, reductionism, advance directives, and defeaters.

  Starting with the mother's case (point 3). The key is to ask if the person who wrote the directive still exists. The pressure lies in whether uptake without connectedness invalidates the directive. Follow-up: if uptake suffices, why honor the directive? This forces the guest to confront the conflict between past wishes and current contentment.

  For uptake vs. R (point 2), avoid rehashing objections. Instead, press on how uptake interacts with R. Question: Can uptake exist without any R? Pressure: If yes, it severs from psychological continuity. Follow-up on a case with no psychological links but behavioral continuation, questioning if that's genuine uptake.

  Branching (point 5): Two replicas both with uptake. Ask if it's better, worse, or same. Pressure: If better, contradicts non-branching; if same, devalues uniqueness. Follow-up on whether both can fully inherit commitments without conflict.

  Biological challenge (point 6): What does uptake add to the organism view? Pressure: If uptake doesn't matter, it's redundant; if it does, it overrides biology. Follow-up on whether an organism with severe dementia but no uptake still has moral claims.

  Reductionism (point 7): Does reductionism undermine self-concern? Pressure: If yes, it's counterintuitive; if no, how does uptake ground it? Follow-up on why one should care about a future self with uptake but no identity.

  Advance directives (point 8): Can they bind given uptake changes? Pressure: Uptake suggests current contentment matters more. Follow-up on whether a directive refusing care should bind if current self has uptake.

  Defeaters (point 10): What would make her abandon uptake? Pressure: Forcing her to identify vulnerabilities. Follow-up on if identity ever matters more than R.

  Ensure fairness: no leading questions, attribute views cautiously. Each question must be concise, with clear pressure points and targeted follow-ups. The mother's case is central, linking theory to personal stakes, which adds depth and urgency to the interview.
answer: |-
  Here are nine rigorously constructed questions for your interview, designed to press on core tensions in the uptake view while respecting your guest's expertise and avoiding well-trodden ground:

  1.  **Question:** Your uptake view suggests what matters in survival is a later person carrying forward commitments. In a case where a replica inherits all my memories and traits but immediately rejects my core life projects as alien, does uptake obtain?  
      **Pressure:** Her likely "no" forces her to define 'carrying forward' – is mere disposition enough, or must it be *because of* the prior person?  
      **Follow-up:** If disposition alone suffices, what prevents uptake from being far *easier* to achieve than R, potentially trivializing survival?

  2.  **Question:** Can uptake obtain in the *absence* of significant psychological connectedness (R)? For instance, could someone with profound amnesia, who nevertheless instinctively maintains old routines and affections purely from habit, be taking up the prior person's life?  
      **Pressure:** Her likely "yes" (given your mother's case) risks severing uptake's link to psychological continuity entirely.  
      **Follow-up:** If uptake can exist without *any* psychological links (like memories or recognition), how is it still about *my* survival and not just behavioral similarity in a new organism?

  3.  **Question:** **Consider my mother: The person she was wrote a directive refusing artificial nutrition. The person she is now seems content, hums old hymns, fusses over tomatoes. On your view, does the person who wrote that directive still exist? Should honoring her advance directive console us or unsettle us?**  
      **Pressure:** Forces a direct, high-stakes application: Does prior identity/agency bind when uptake persists without connectedness?  
      **Follow-up:** If the directive-binder doesn't exist, but uptake does, doesn't that mean the directive *shouldn't* bind – prioritizing current contentment over past autonomy?

  4.  **Question:** Suppose a stranger meticulously studies my journals, adopts all my abandoned projects and deepest cares, and devotes their life to fulfilling them. Have they "taken up" my life? If no, doesn't this imply uptake requires the *right causal history*? If yes, doesn't this make what matters in *my* survival achievable by someone entirely unrelated to me?  
      **Pressure:** Whichever way she answers, she forfeits something: Either she smuggles in causal history (linking it back to R) or severs what matters from *me* entirely.  
      **Follow-up:** If yes (stranger can take it up), doesn't this mean "what matters" isn't fundamentally about *my* survival at all, but about the projects themselves continuing?

  5.  **Question:** In a standard branching case, two replicas emerge from the teletransporter, both equally disposed to carry forward my commitments. Is this outcome twice as good for me as one replica?  
      **Pressure:** If she says yes, she contradicts the intuition that survival isn't additive; if no, she implies a non-branching requirement.  
      **Follow-up:** If it's not better, or even worse, doesn't this mean uptake, like identity, is inherently non-branchable – restoring the problem she meant to solve?

  6.  **Question:** A prominent challenge holds that we are essentially human organisms, persisting through biological continuity. An organism in your mother's condition is still biologically present. What does your concept of "uptake" add to or subtract from the claim that *this organism's* survival is what matters?  
      **Pressure:** Prevents dismissal; forces engagement with a non-psychological basis for persistence and its normative weight.  
      **Follow-up:** If uptake is absent but the organism persists (e.g., late-stage dementia with no old habits), does the organism's survival *by itself* matter in the way personal survival matters? If not, why prioritize uptake over biological continuity?

  7.  **Question:** Suppose reductionism about persons is true: we just are brains/psychologies/organisms under a description. Doesn't this undermine the *special rational weight* of self-concern? Why care more about a future stage with uptake than about any other future person?  
      **Pressure:** Tests if uptake can ground the distinctive rational authority of self-interest if identity is reduced.  
      **Follow-up:** If she blocks this consequence, is her ground pragmatic (society needs selves) or does uptake itself create a new, irreducible reason for special concern?

  8.  **Question:** Given that uptake can change dramatically without biological death – as in profound dementia or radical conversion – what force, on your view, does precedent autonomy (like an advance directive) retain? What concrete guidance would you offer a family deciding whether to honor a directive written by a person who, biologically present, arguably lacks uptake with that past agent?  
      **Pressure:** Demands a practical, non-legal verdict on a core ethical dilemma stemming directly from her view.  
      **Follow-up:** If uptake's presence/absence is crucial, how can families reliably assess it in complex cases like dementia, where fragments persist?

  9.  **Question:** What kind of case or argument would constitute a decisive defeater for your uptake view? Specifically, what would make you either concede that identity *itself* is what matters fundamentally, or abandon the idea that uptake captures what matters in survival?  
      **Pressure:** Forces articulation of the view's core vulnerabilities and its limits compared to identity or R.  
      **Follow-up:** If no plausible case could make identity matter more than R+uptake, does this suggest the view is unfalsifiable?

  **Key Design Notes:**

  *   **Conciseness:** Each question is crafted for brevity and clarity, aiming for sub-2-minute answers.
  *   **Pressure Points:** The "Pressure" lines explicitly identify the unresolved tension or cost embedded in her most plausible answer.
  *   **Follow-ups:** Each follow-up is designed to cut off an easy resolution or retreat after the initial answer, pressing deeper into the specific difficulty raised by the pressure point. They are not mere restatements.
  *   **Coverage:** All required elements (Mother's Case, Uptake vs. Causation, Branching, Biological Challenge, Reductionism/Self-Concern, Advance Directives, Defeaters) are covered, with #3 addressing your mother directly.
  *   **Fairness:** Questions present cases neutrally and describe objections without prejudicial language ("Suppose...", "A challenge holds that..."). No views are incorrectly attributed. Questions start from *her* stated position.
  *   **Avoiding Retreads:** Questions assume her replies to the "redescribes R" and "hostage to attitudes" objections are given, pressing *past* them (#1, #2, #4, #7 implicitly build on or challenge the implications of those replies).
  *   **Rigor & Practicality:** The questions demand precise conceptual work (#1, #2, #4, #5, #7) while forcing engagement with real-world consequences (#3, #6, #8). #9 ensures a strong finish requiring reflection on the view's foundations.

  These questions should facilitate a rigorous, insightful, and moving exploration of her view under pressure, directly engaging with the profound personal stakes you've shared.
