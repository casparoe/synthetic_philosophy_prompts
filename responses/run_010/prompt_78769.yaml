prompt: |-
  My doctoral supervisor convenes a long-running interdisciplinary seminar on animal and human signalling, and she closes every session by ruling, exhibit by exhibit, on whether the trait under discussion counts as an honest costly signal. I have kept a record of this term's rulings, together with the reason she gave in each case:

  1. The peacock's train: accepted. Only a male in good condition can grow and carry it, and it invites predators; a weak male cannot afford the same extravagance.
  2. Carotenoid-based plumage redness in finches: accepted. The pigments must be obtained from food and are also wanted elsewhere in the body, so a dull male cannot buy his way into the same display.
  3. The satin bowerbird's bower: accepted. Weeks of construction, constantly raided and rebuilt, and only a subset of males keep one in condition through the season.
  4. Stotting in gazelles: accepted. It spends time and energy at exactly the moment when flight would pay, and an animal in poor condition cannot produce a convincing stot at all.
  5. The artificially lengthened tail of a widowbird: rejected, even though the male so treated wins more territories and more matings than his neighbours. Her words were that he paid nothing, and that the female's preference has been exploited rather than informed.
  6. A cheap rented suit worn to a job interview: rejected. Any applicant can rent one; the outlay does not vary with the quality being advertised.
  7. The alarm call of a ground squirrel: accepted as honest, but not, she insisted, as a costly signal. It costs almost nothing, and its reliability comes from elsewhere — the caller's own interest in the response of the listeners, who are largely relatives, and the fact that anyone present can see for themselves whether a predator is really there.

  Next week's session has three exhibits, and I have promised to predict her rulings in advance:

  (a) In one species of fiddler crab, a male that loses his single enlarged claw regrows one after the next moult. The replacement is about the same length as the original but has less mass, contains less muscle, is a markedly worse weapon, and is cheaper to wave in the same display. Rivals with original claws do not avoid fighting these males, though they would usually beat them, and females choosing mates show no aversion to them. In some populations close to half the males carry a regenerated claw.

  (b) The human blush following a minor transgression — being caught in a small lie, or a social blunder at a dinner table. It is involuntary, essentially impossible to summon at will, and costs the blusher nothing material; observers nonetheless report being readier to forgive and to trust again someone whose face gives them away. There is a further wrinkle: it is not obvious that a blush is a display at all, rather than a physiological leak that onlookers have simply learned to read.

  (c) The founder of a company everyone has heard of, who turns up in an unmarked grey t-shirt, wears no watch, drives a fifteen-year-old car, and mentions none of these facts. A newcomer wearing precisely the same clothes would be read as a nobody.

  For each exhibit, predict her verdict and give the reasoning she would most likely offer. Then set out the candidate principles her record is consistent with — at least: that honesty requires genuine waste; that it requires the marginal cost to fall harder on low-quality signallers; that it requires faking to be physically impossible; that it can be secured by the consequences of being caught — and say which of these her seven rulings have already ruled out, and which remain live. Identify which of the three new exhibits is the most diagnostic, and say precisely where the surviving principles part company on it. Where the record genuinely underdetermines her verdict, say what she would be committing herself to by ruling each way, rather than pretending to a confidence you lack. Finally, propose one further exhibit that would separate the surviving principles, and state what would have to be true of it for the test to work.
reasoning: |-
  Hmm, this is a fascinating problem about costly signaling theory applied to animal and human behaviors. The user is a doctoral student in an interdisciplinary seminar focused on honest signaling, and needs to predict their supervisor's rulings on three new exhibits based on previous patterns.

  First, let me analyze the supervisor's established pattern from the seven rulings. She consistently accepts signals where:
  - There's genuine cost that varies with quality (peacock train, finch redness, bowerbird bower, gazelle stotting)
  - Low-quality individuals can't afford to fake the signal
  - The cost is borne by the signaller themselves

  She rejects signals when:
  - There's no cost to the signaller (lengthened widowbird tail)
  - The signal doesn't correlate with underlying quality (rented suit)

  The alarm call case is particularly interesting - accepted as honest but not costly, showing she distinguishes between honesty mechanisms.

  Now for the new exhibits:

  The fiddler crab regenerated claw seems likely rejected. It's cheaper to produce but doesn't affect mating success - so no quality discrimination. This would align with her widowbird ruling where artificial modification didn't count.

  The human blush is tricky. It's involuntary and costless, but effective. Similar to the alarm call, it might be honest without being costly. The "physiological leak" aspect makes it borderline display. I think she'll reject it as a costly signal but possibly acknowledge its honesty like the squirrel call.

  The tech founder's minimalism is fascinating. The key is that the signal only works because of established reputation - the same clothes mean different things based on who wears them. This seems analogous to the rented suit case where the signal isn't tied to quality. Likely rejected.

  For diagnostic value, the blush case is most interesting because it forces a distinction between:
  1. Cost as necessary for honesty (would reject blush)
  2. Cost as merely one pathway to honesty (might accept it as honest like the alarm call)

  The surviving principles seem to be:
  - Honesty requires marginal costs to fall harder on low-quality signallers (supported by accepted cases)
  - Honesty can be secured by consequences of being caught (shown in squirrel call)

  Rejected principles:
  - Requires genuine waste (squirrel call isn't wasteful)
  - Requires faking to be physically impossible (finches could theoretically obtain more carotenoids)

  To test these, I'd propose a signal that's costly but equally costly for all - like mandatory military service where everyone pays the same cost regardless of quality. This would help determine if differential cost is essential.
answer: |-
  Based on your supervisor's established pattern of rulings and reasoning, here are predictions for each exhibit, followed by an analysis of the principles and diagnostic value.

  ### Predictions for New Exhibits
  **(a) Fiddler crab regenerated claw: REJECTED**  
  *Reasoning:* The regenerated claw is cheaper to produce and wave, yet it confers the same mating/territorial benefits as the original. Females and rivals treat males with regenerated claws identically to those with original claws, despite the lower quality and cost. This matches her widowbird ruling (#5): the signal is "exploited" because low-quality males (those with regenerated claws) pay *less* but gain the *same* benefits. There is no differential cost filtering out low-quality signallers; a weak male can still "fake" the display effectively. She would emphasize that honesty requires the signal to be *unaffordable* or *unattainable* for low-quality individuals, which is absent here.

  **(b) Human blush: REJECTED as a costly signal, but possibly acknowledged as honest**  
  *Reasoning:* Blushing is involuntary, cost-free, and not a deliberate display (it may be a "physiological leak"). This aligns with the ground squirrel alarm call (#7): it is reliable due to mechanisms other than cost (e.g., involuntary nature and social consequences of deception), but it imposes no material cost. She would argue that honesty here stems from the inability to fake (blushing is involuntary) and the reputational cost of being caught lying, not from wasteful expenditure. Since her verdicts focus on *costly* signaling, she would rule it "not a costly signal" while conceding its honesty, mirroring #7.

  **(c) Tech founder's minimalism: REJECTED**  
  *Reasoning:* The founder's plain attire signals status only because of their pre-existing reputation, not because the clothes themselves are costly or hard to acquire. This parallels the rented suit (#6): any applicant (or newcomer) can wear identical clothing, so the signal does not correlate with underlying quality (e.g., competence or status). The "cost" (wearing plain clothes) is trivial and borne equally by all, failing to discriminate between high-quality (established founder) and low-quality (newcomer) signallers. She would state that the signal lacks *differential cost* and is context-dependent, not intrinsically informative.

  ---

  ### Candidate Principles and Rulings
  Her record is consistent with these principles:
  1. **Differential cost principle**: Honesty requires the marginal cost of the signal to fall harder on low-quality signallers than high-quality ones (supported by #1–4).  
  2. **Consequence-based honesty**: Honesty can be secured by the consequences of being caught faking, even without cost (supported by #7).  

  Ruled-out principles:  
  - **Genuine waste requirement**: Honesty does not *require* "genuine waste" (rejected by #7: squirrel alarm calls are costless but honest).  
  - **Physical impossibility of faking**: Honesty does not *require* faking to be physically impossible (rejected by #2 and #4: dull finches *could* theoretically acquire more carotenoids, and weak gazelles *could* attempt stotting—but both fail because costs are prohibitive).  

  Surviving principles: **Differential cost** and **Consequence-based honesty** remain live.  

  ---

  ### Most Diagnostic Exhibit: (b) Human Blush  
  This exhibit is the most diagnostic because it forces a choice between the surviving principles:  
  - **Differential cost principle** would reject blush as a costly signal (no cost incurred).  
  - **Consequence-based honesty** would accept it as *honest* (due to involuntary nature and social penalties for deception) but reject it as *costly*.  

  **Where principles part company**:  
  - Differential cost focuses on production costs filtering signallers. Blush has no production cost, so it fails.  
  - Consequence-based honesty focuses on reliability via external verification/punishment. Blush succeeds here (observers forgive because faking is impossible, and deception risks punishment).  

  Her ruling on #7 (squirrel call) suggests she will treat blush similarly: honest but not costly. However, if she *accepted* blush as a costly signal, she would implicitly abandon differential cost. If she rejected its *honesty*, she would weaken consequence-based honesty.  

  ---

  ### Where Verdicts Are Underdetermined  
  - **Blush (b)**: The record supports either "honest but not costly" (like #7) or rejection as a signal entirely (if deemed a "leak" not a display).  
    - *If she rules "honest but not costly"*: She commits to consequence-based honesty as sufficient for reliability.  
    - *If she rules "not a signal"*: She commits to signals requiring intentionality, excluding physiological leaks.  
  - **Founder's minimalism (c)**: Could be borderline. If she accepts it, she commits to signals deriving honesty from *context* (reputation) alone, but her rejection of #6 (rented suit) makes this unlikely.  

  ---

  ### Proposed Further Exhibit to Separate Principles  
  **Exhibit**: A bird species where both high- and low-quality males perform identical, energetically costly mating dances. High-quality males recover quickly, while low-quality males suffer significantly reduced foraging efficiency and higher predation risk due to fatigue.  

  **Test requirements**:  
  - The signal must have **equal upfront cost** for all signallers.  
  - The **marginal cost** (opportunity cost/fitness impact) must be **higher for low-quality signallers** due to their condition.  

  **How it separates principles**:  
  - **Differential cost principle**: Accepts the signal. Costs are *differentially* burdensome, filtering low-quality males.  
  - **Consequence-based honesty**: Rejects it. Reliability comes from differential cost, not consequences of cheating (no deception occurs; all pay upfront).  

  This tests whether differential cost *alone* suffices, even without consequences of faking. Her acceptance would confirm differential cost as primary; rejection would elevate consequence-based mechanisms.
