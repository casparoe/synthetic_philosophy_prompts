  ### Planning  
  1. **Movement I (General Theory, Queries 1-8):** Establish Berkeley's core doctrines—money as ticket/counter, wealth as industry, circulation's primacy, swiftness versus quantity, and the irrelevance of intrinsic value—without naming AUREUS.  
  2. **Movement II (Application, Queries 9-22):** Critique AUREUS—vaults, redemption, staking yield, oracles, audits, VOTE token, founders' vesting. **Concession 1 (Query 12):** Metal disciplines the issuer. **Concession 2 (Query 13):** Unbelieved promises cannot hold price. Then deny bullionist inference: vaulted gold ≠ wealth.  
  3. **Movement III (The Turn, Queries 23-32):** Propose a public bank (no shares, secured on industry). Subject it to prior queries. **Dog-token query (27):** A dog-picture token circulating swiftly enriches more than vaulted gold. **Unanswerable query (29):** How to measure industry stirred by such a token?  
  4. **Doctrines:** Circulation over hoarding (I); money as servant, not master (II); wants as industry-spur (III).  
  5. **Voice:** 18th-century syntax; DeFi terms ("staking," "oracle") dropped in neutrally.  
  6. **Humor Source:** Logical absurdities (e.g., staking rewards vs. circulation; dog token vs. gold) via Berkeley’s own principles.  
  7. **Key Queries:** 12, 13 (concessions); 27 (dog token); 29 (unanswerable).  
  8. **End:** Body politic as imperfect animal (Query 31), underscoring no perfect system.  

  ---  

  ### ADVERTISEMENT BY THE DELEGATE  
  It being the custom of this assembly to receive submissions touching proposals of moment, I judge it proper to offer certain queries rather than dogmas. For assertions may beget opposition, while questions invite reflection; and he who would instruct others ought first to examine himself. The AUREUS project, being advanced as a new money exempt from hazard, demands scrutiny not of its mechanics alone, but of its tendency to enrich or impoverish. I therefore propose, in the manner of the ancient querists, a series of doubts to be weighed by all men of sense. Let each consider whether the premises of the project accord with the nature of wealth, and whether its boasted security be not purchased at the cost of publick utility.  

  ### QUERIES  

  1. Whether the wealth of a nation consisteth in heaps of gold, or in the arms and arts of its people?  
  2. Whether money be not properly a ticket entitling to labour, and not itself the thing laboured for?  
  3. Whether gold and silver have any virtue, save as they set men at work?  
  4. Whether the same sum, passing swiftly from hand to hand, doth not answer the end of a greater sum lying dead?  
  5. Whether money, like blood, loseth its use when it stagnateth?  
  6. Whether the true measure of wealth be not the quantity of industry excited?  
  7. Whether a counter that lieth idle in the vault, though it represent half a gram of gold, doth not as little serve the publick as a stone?  
  8. Whether the denominations of money may not pass current, and things be rated and exchanged thereby, though the bullion they promise be absent?  
  9. Whether the AUREUS token, redeemable from vaults in Zurich and Singapore, doth not still subject the holder to the honesty of keepers and the exactness of auditors?  
  10. Whether quarterly attestations of metal, though performed by cunning men, may not be suborned or mistaken?  
  11. Whether the oracle that marketh the price of gold on the chain may not be corrupted, and the people deceived?  
  12. *Concession 1*: Whether a token tied to metal doth not indeed restrain the issuer from over-abundant minting?  
  13. *Concession 2*: Whether a token whose promised redemption no man trusteth can long maintain its peg?  
  14. But then, whether the boast of *no counterparty risk* be not vain, when the keeper, the auditor, and the oracle are all counterparties?  
  15. Whether sixty per cent of the tokens, staked in the vault to earn four per cent yearly in new-minted AUR, doth not condemn the greater part to idleness?  
  16. Whether rewarding men for leaving their tokens unmoved be not a premium on torpor?  
  17. Whether the founders, holding fifteen per cent vested over four years, do not reap from the people’s industry while their own tokens sleep?  
  18. Whether the governance token, VOTE, conferring power to propose but no claim on the metal, be not a shadow that diverteth attention from the substance?  
  19. Whether the publick, by this device, is made proprietor of the bank, or whether the benefit falleth chiefly to stakers and founders?  
  20. Whether a tonne of gold in a Swiss vault, watched by oracles and attested quarterly, putteth a single beggar to work or buyeth a loaf of bread?  
  21. Whether a nation groweth rich by the industry of its people, or by the vigilance of its vault-keepers?  
  22. Whether the project doth not mistake the pledge for the purpose, and the means for the end?  
  23. Whether a publick bank, with no shares, issuing tokens secured on the industry of the island, might not better answer the ends of circulation?  
  24. Whether such a bank, directing its tokens to employ the poor and improve the soil, would not quicken industry more than all the gold of Ophir?  
  25. But whether this bank’s tokens, depending on the publick faith, be not also liable to distrust?  
  26. Whether the true test of any money be not the industry it stirreth up?  
  27. Whether, by this rule, a token backed by nothing but a picture of a dog, if it passeth swiftly from hand to hand and createth employment, doth not enrich a nation more than a tonne of gold in a Zurich vault?  
  28. Whether the creating of wants—for dogs or trinkets—be not the surest spur to industry?  
  29. *Unanswerable*: But how shall we compute the industry excited by the dog-token, or know if it sufficeth to support the token’s value?  
  30. Whether the body politic, like the animal body, be not subject to distempers, and perfect health seldom found?  
  31. Whether any money, whether of metal or of fancy, can be free of hazard?  
  32. And lastly, whether the wealth of a nation resteth not, at bottom, on the willing labour of its people, and on a money that is their servant, not their master?
