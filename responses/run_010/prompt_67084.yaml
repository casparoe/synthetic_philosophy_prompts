prompt: |-
  I chair a nine-member Transmission Review Panel at an international foundation that funds and hosts projects deliberately sending radio or optical signals of sufficient power to be detectable by other civilizations. We receive roughly six proposals a year plus renewals, and every determination is irreversible in a strong sense: once a signal has left, nothing we later decide can retract it. A critic has written to our board alleging that our record is arbitrary — in our first year we cleared a low-power omnidirectional beacon without dissent, and three years later we blocked a targeted optical transmission, and we never articulated a principle that distinguishes the two. The board has asked me to produce a written screening procedure before the next quarterly cycle.

  Please write the procedure the panel can actually run, on the explicit assumption that the dark forest reasoning is the governing framework for the existential-risk dimension of our mandate: the argument that because civilizations cannot know one another's intentions and cannot rely on shared enforcement, the safest posture is silence, that a detected technological civilization may be destroyed preemptively at low cost to the destroyer, and that mutual suspicion together with uneven and accelerating technological growth makes even a well-meaning sender a threat worth eliminating. Do not quote any novel, article, or spokesperson at me; I want the argument's structure converted into steps, and I want to be told which structural assumption each step depends on, so that when an assumption fails we know which step fails with it.

  The procedure should specify:

  1. Ordered steps, each with the question to ask, what would count as a sufficient answer from a proposer, and what the step outputs: proceed, halt, or refer.
  2. Where it halts with a no — conditions on which the panel should decline without further deliberation.
  3. Where it refers the question upward or outward, because the issue is one of values, consent, or political legitimacy rather than fact, and this panel has no warrant to settle it.
  4. How to handle the burden of proof. Our charter currently reads a proposal as authorized unless the panel finds positive reason to block it. I suspect that polarity is wrong under a catastrophic-risk framework, but I want the procedure to tell me whether the default should shift and what would justify shifting it, rather than assume my suspicion.
  5. What to do at any step where no probability can be estimated even approximately. Say explicitly which steps require a number, which can proceed on an ordinal comparison, and which must be treated as unknowable rather than merely unknown, and what the panel does in the third category.
  6. A robustness check: for each step, whether its recommendation would invert if the dark forest premise were false, and what the procedure should say about steps that make sense only if the premise is true.
  7. A one-page version for our two non-technical members and for the board, which has no scientific expertise and can only accept, reject, or return a determination.
  8. An honest marking of which steps are judgment calls wearing the clothes of procedure.

  Then run the procedure on four cases and report the determination each produces, with reasons and with the steps at which the panel would have to exercise discretion:

  (a) A single high-power optical transmission, aimed once at a planet twelve light-years away whose atmosphere has yielded disputed but not dismissible biosignature candidates, carrying a curated archive.

  (b) A continuous low-power omnidirectional beacon in a protected band, repeating a mathematical message for fifty years, with no target selection and no reply channel.

  (c) A reply to a narrowband signal we have actually received, from a source forty light-years away. Our staff assume that detection settles the concealment question in our favor, since the sender already knows roughly where we are; I want the procedure to say whether that inference holds and whether receipt of a signal changes what the framework recommends.

  (d) Our own past record: the beacon we cleared and the transmission we blocked, retro-audited under the procedure, with a statement of whether they were consistent with each other and, if not, which one the procedure would now reverse.

  At least one of these should come out in a direction I would rather it did not. I have spent my career defending deliberate transmission, and I would prefer not to be handed a procedure that quietly authorizes everything — but I also do not want one whose blocking conditions are so loose that no proposal could ever satisfy them, since that is indistinguishable from a veto. Finally, state plainly what the procedure cannot do, including, if it is the case, that it cannot supply the standing of nine people to decide for populations that were never consulted and for generations not yet born, and that this gap cannot be closed by better technique.
reasoning: |-
  We are designing a screening procedure under the Dark Forest framework. The key assumptions of the Dark Forest reasoning are:

  1. **Unknowable Intentions**: Civilizations cannot know each other's intentions.
  2. **No Shared Enforcement**: There is no higher authority to enforce cooperation or punish aggression.
  3. **Preemptive Destruction**: A detected civilization may be destroyed preemptively at low cost to the destroyer.
  4. **Uneven Technological Growth**: Technological growth is uneven and accelerating, making even a well-meaning sender a potential future threat.
  5. **Mutual Suspicion**: The above factors create an environment of mutual suspicion where silence is the safest posture.

  The procedure must convert these assumptions into steps for evaluating proposals. We must specify for each step the question, what counts as a sufficient answer, the output (proceed, halt, or refer), and the assumption it depends on.

  We must also address burden of proof, uncertainty, robustness to the Dark Forest premise, and provide a one-page version.

  The procedure should be designed to avoid both a rubber-stamp and a veto. It must be able to block some proposals and allow others.

  ### Proposed Screening Procedure

  **Preamble**: The panel operates under the Dark Forest framework. The default position is that transmission poses an existential risk and must be blocked unless the proposer can demonstrate that the risk is sufficiently mitigated. This shifts the burden of proof: the proposer must provide evidence to overcome the presumption of risk.

  **Steps**:

  1. **Step 0: Initial Check for Non-Transmission**
     - **Question**: Does the proposal involve any deliberate transmission of signals that could be detectable by an extraterrestrial civilization?
     - **Sufficient Answer**: If no, then the proposal is not within the panel's mandate for transmission review.
     - **Output**: Proceed to next step only if transmission is involved. Otherwise, halt and mark as not applicable.
     - **Assumption**: None (this is a scope check).
     - **Robustness**: This step is independent of Dark Forest.

  2. **Step 1: Intent and Detectability of the Transmission**
     - **Question**: What is the intended purpose of the transmission, and what is the expected detectability range (i.e., at what distance could a civilization with technology comparable to ours detect the signal)?
     - **Sufficient Answer**: The proposer must provide technical details (e.g., power, frequency, directionality, duration) and a model of detectability. The model must include assumptions about receiver technology (conservatively assuming at least our level).
     - **Output**: 
       - If the transmission is not detectable beyond the solar system (e.g., very low power, short range), then proceed to Step 2 (but note: under Dark Forest, even low-power might be detectable by a sufficiently advanced civilization, so we must be cautious).
       - If detectable, then proceed to Step 3.
     - **Assumption**: Preemptive Destruction (if detectable, then risk exists).
     - **Robustness**: Without Dark Forest, detectability might not be a risk. So if the premise is false, this step might not be necessary.

  3. **Step 2: Assessment of Detectability by Advanced Civilizations**
     - **Question**: Could the transmission be detectable by a civilization with technology significantly more advanced than ours? (e.g., by using very large receivers or advanced techniques)
     - **Sufficient Answer**: The proposer must provide an analysis of detectability by a civilization with technology up to, say, 1000 years more advanced (using conservative projections). If the proposer argues that even with such technology the signal is undetectable, then it may be safe.
     - **Output**:
       - If the transmission is undetectable even by advanced civilizations (within a conservative limit), then output: proceed (to Step 5, but note we skip some steps because risk is low).
       - Otherwise, output: proceed to Step 3.
     - **Assumption**: Preemptive Destruction and Uneven Technological Growth (because we consider advanced civilizations).
     - **Robustness**: Without Dark Forest, this step might be irrelevant.

  4. **Step 3: Targeted vs. Omnidirectional**
     - **Question**: Is the transmission targeted at a specific celestial object (or region) or is it omnidirectional?
     - **Sufficient Answer**: The proposer must specify the direction and beam width. Omnidirectional is defined as having a beam solid angle greater than, say, 1 steradian (but we need a threshold). Targeted is a narrow beam.
     - **Output**:
       - If omnidirectional, then proceed to Step 4a.
       - If targeted, then proceed to Step 4b.
     - **Assumption**: Preemptive Destruction (a targeted signal might be more provocative because it shows we know about the recipient, and might be seen as a directed threat) and Mutual Suspicion (because targeting might indicate we have identified a potential threat or resource). Also, omnidirectional signals are more likely to be detected by multiple civilizations, increasing risk.
     - **Robustness**: Without Dark Forest, the distinction might not matter.

  5. **Step 4a: Omnidirectional Transmission Risk Assessment**
     - **Question**: What is the expected number of stars (and hence potential civilizations) within the detectability range? And what is the probability that at least one of them is hostile (or would preemptively destroy us upon detection)?
     - **Sufficient Answer**: The proposer must provide:
          - The density of stars in the region (using astronomical data).
          - A model for the number of civilizations per star (using a conservative estimate, e.g., based on the Drake equation with pessimistic parameters).
          - An argument for the probability that a civilization is hostile. This is the most difficult part. The proposer must use the Dark Forest assumptions: since we cannot know intentions, we must assume a non-zero probability of hostility. The panel must decide on a threshold probability for risk.
     - **Output**:
          - If the expected number of civilizations that could detect the signal is zero (or extremely low, e.g., < 1e-10) then proceed to Step 5 (but note: under Dark Forest, even one detection could be catastrophic).
          - Otherwise, we must consider the risk. Since we cannot estimate the probability of hostility, we treat it as unknowable. Therefore, the risk cannot be ruled out. Output: halt (block) unless the proposer can show that the signal is designed to be undetectable by all but the intended recipient (which is not possible for omnidirectional) or that there is a mitigating factor (like a very short duration that reduces the chance of detection). 
          - Given the unknowable probability of hostility, the panel will typically block unless there is a strong reason to override. But note: we have a burden of proof shift, so the proposer must prove safety.
     - **Assumption**: Unknowable Intentions, Preemptive Destruction, Mutual Suspicion, and Uneven Technological Growth (because even a low probability of a hostile advanced civilization is a risk).
     - **Robustness**: Without Dark Forest, the risk of hostility might be considered negligible, so this step would not block.

  6. **Step 4b: Targeted Transmission Risk Assessment**
     - **Question**: What is known about the target? Specifically, is there evidence of a civilization at the target? And if so, what is the probability that they are hostile? Also, what is the risk of the signal being detected by other civilizations along the path or nearby?
     - **Sufficient Answer**: The proposer must provide:
          - Evidence of the presence of a civilization (e.g., biosignatures, technosignatures). The panel must judge the strength of the evidence.
          - An analysis of the risk of interception by other civilizations (side lobes, scattering, etc.).
          - An argument for the probability that the targeted civilization (if present) is hostile, and the risk of them destroying us. Also, the risk that a third party intercepts the signal and destroys us.
     - **Output**:
          - If there is no credible evidence of a civilization at the target, then the transmission is effectively into empty space. However, there is still a risk of interception by others. This is similar to omnidirectional but with a narrower beam. We must consider the number of stars in the beam path. Proceed to a step similar to 4a but for the beam path.
          - If there is credible evidence of a civilization, then we must consider the risk of provoking them. But note: under Dark Forest, any detection might lead to destruction. The proposer must argue that the targeted civilization is not hostile and will not destroy us. However, by Unknowable Intentions, we cannot know that. Therefore, the risk is unknowable. The panel must block unless there is a compelling reason to believe that the civilization is peaceful and that they would not see us as a threat (which is hard under Mutual Suspicion and Uneven Growth). 
          - Given the burden of proof, unless the proposer can prove that the risk is negligible (which they cannot because of unknowable intentions), the panel should block.
     - **Assumption**: Unknowable Intentions, Preemptive Destruction, Mutual Suspicion, and Uneven Technological Growth.
     - **Robustness**: Without Dark Forest, we might assume that the targeted civilization is likely to be peaceful, so this step might allow the transmission.

  7. **Step 5: Benefit-Risk Analysis (if risk is low)**
     - **Question**: If the transmission has passed the previous steps (meaning the risk of detection by any civilization is negligible), then what are the benefits of the transmission? And if there is any residual risk, do the benefits outweigh the risks?
     - **Sufficient Answer**: The proposer must provide a quantified benefit (scientific, cultural, etc.). The panel must judge the benefits against any residual risk (which we have deemed negligible by previous steps).
     - **Output**:
          - If benefits are high and risks are negligible, then proceed to Step 6.
          - If risks are not negligible, then we should have blocked earlier. If benefits are low, then even negligible risk might not be worth it. The panel might halt or refer if the benefits are non-scientific (e.g., political) and require value judgment.
     - **Assumption**: None (this step is about values if we are weighing benefits against risks). But note: under Dark Forest, if the risk is not negligible, we would have blocked earlier.
     - **Robustness**: This step is more important without Dark Forest.

  8. **Step 6: Consent and Legitimacy**
     - **Question**: Does the transmission have the consent of the people of Earth? And is it legitimate for this panel to authorize it on behalf of humanity and future generations?
     - **Sufficient Answer**: This is a political question. The proposer cannot answer it. The panel must note that it does not have the mandate to represent humanity. Therefore, this step is always a refer.
     - **Output**: Refer to a higher authority (e.g., the board, or an international body). The panel notes that it has no warrant to settle issues of global consent.
     - **Assumption**: None (this is about political legitimacy).
     - **Robustness**: This step is independent of Dark Forest.

  **Summary of Blocking Conditions**:
  - Halt at Step 4a: If an omnidirectional transmission has a non-negligible chance of being detected by any civilization (and we cannot rule out hostility).
  - Halt at Step 4b: If a targeted transmission is aimed at a location with a credible civilization (because we cannot rule out hostility) or if the beam path has a non-negligible chance of being intercepted by a civilization (same as 4a).
  - Halt at Step 5: If the benefits do not outweigh the negligible risks (but if risks are negligible, this halt would be rare).

  **Refer Conditions**:
  - Step 6 always refers.

  **Burden of Proof**: 
  The procedure shifts the burden of proof. The default is to block unless the proposer can show that the transmission is safe (i.e., undetectable by any civilization). This is justified by the catastrophic nature of the risk (even a tiny probability of an existential threat must be avoided) and the Dark Forest assumptions.

  **Handling Uncertainty**:
  - Steps 4a and 4b require estimating probabilities. However, the probability of a civilization being hostile is unknowable. Therefore, we treat it as a non-zero unknown. Since we cannot rule out a high probability of hostility, we block unless the transmission is undetectable (which we try to establish in Steps 1 and 2).
  - Steps that require numbers: Step 4a requires an estimate of the number of stars and civilizations. We can use known astronomical data and conservative estimates. But the probability of hostility is not estimated numerically; it's treated as unknowable. So we use a qualitative judgment: because it is unknowable and potentially catastrophic, we block.

  **Robustness Check**:
  For each step, we note whether the recommendation would invert if the Dark Forest premise were false. Steps 1, 2, 3, 4a, 4b are all based on Dark Forest and would invert (i.e., they would not block) without the premise. Steps 0, 5, 6 are not dependent on Dark Forest.

  **One-Page Version**:

  **Transmission Review Procedure (Simplified)**

  1. **Transmission?** If the proposal does not involve sending signals into space, it is not our concern. Otherwise, proceed.

  2. **Detectable?** 
     - If the signal is too weak to be detected by any civilization (even advanced ones), then go to Step 5. 
     - Else, proceed.

  3. **Direction?**
     - If omnidirectional: 
          - How many civilizations might detect it? If more than zero (or non-negligible chance), then BLOCK because we cannot know if they are hostile.
     - If targeted:
          - Is there a civilization at the target? If yes, BLOCK because we cannot know their intentions and they might destroy us.
          - If no, then how many other civilizations might detect it? If more than zero, BLOCK.

  4. **Benefits?** Only if the signal is undetectable (from Step 2) can we consider benefits. If benefits are high, then proceed. Otherwise, block.

  5. **Consent?** We cannot decide for all humanity. REFER to the board or a higher authority.

  Note: The panel operates under the Dark Forest theory: space is dangerous, and being detected might lead to our destruction. Therefore, we must be extremely cautious.

  **Marking Judgment Calls**:
  - Step 4a: Judgment call on what is a "non-negligible" number of civilizations and the treatment of the unknowable hostility probability.
  - Step 4b: Judgment call on the credibility of evidence for a civilization at the target and the risk of interception.
  - Step 5: Judgment call on the magnitude of benefits.

  ### Running the Procedure on Cases

  **(a) Single high-power optical transmission, aimed once at a planet twelve light-years away with disputed biosignatures, carrying a curated archive.**

  - Step 0: Transmission? Yes.
  - Step 1: Detectable? Yes, high power and aimed. Proceed.
  - Step 2: Advanced detectability? Likely detectable by advanced civilizations. Proceed.
  - Step 3: Targeted? Yes. Proceed to Step 4b.
  - Step 4b: 
      - Evidence of civilization? Disputed but not dismissible biosignatures. We'll treat as credible enough (because we cannot rule out). 
      - Risk: We cannot know the intentions of the targeted civilization. Also, the signal might be intercepted by others? The beam is narrow, but there might be stars in the beam path. However, the main risk is the targeted civilization. 
      - Since we cannot rule out hostility (unknowable intentions), and the burden of proof is on the proposer to show safety, we block.
  - Output: Halt (block).

  **(b) Continuous low-power omnidirectional beacon in a protected band, repeating a mathematical message for fifty years, no target, no reply channel.**

  - Step 0: Transmission? Yes.
  - Step 1: Detectable? Low-power, but omnidirectional and continuous. It will be detectable by nearby civilizations with technology similar to ours. Proceed.
  - Step 2: Advanced detectability? Likely detectable by advanced civilizations over a larger distance. Proceed.
  - Step 3: Omnidirectional. Proceed to Step 4a.
  - Step 4a: 
      - Number of stars within detectability range: The beacon is continuous and omnidirectional, so over 50 years, the signal will spread and be detectable by many stars. The number of stars within, say, 100 light-years is about 14,000 (using 0.004 stars per cubic light-year). Even with a very low probability of civilization per star, the expected number is non-zero. 
      - Hostility probability: Unknowable and non-zero. Therefore, we block.
  - Output: Halt (block).

  **(c) Reply to a narrowband signal we have actually received, from a source forty light-years away. Staff argument: They already know we are here.**

  - Step 0: Transmission? Yes.
  - Step 1: Detectable? Yes. Proceed.
  - Step 2: Advanced detectability? Yes. Proceed.
  - Step 3: Targeted? Yes (at the source of the received signal). Proceed to Step 4b.
  - Step 4b:
      - Evidence of civilization? Yes, we received a signal from them.
      - Risk: 
          - The staff argument: They already know we are here, so we are not revealing ourselves. But note: the Dark Forest framework says that any transmission might provoke a preemptive strike. We were detected by them, but why haven't they destroyed us yet? Maybe they are peaceful? But we cannot know their intentions. Also, by replying, we confirm our presence and technological capability, which might accelerate a decision to destroy us. Moreover, the reply might be detected by others (third parties) who were not aware of us. 
          - The burden of proof is on the proposer to show that replying is safe. They cannot prove that the sending civilization is not hostile or that third parties won't detect. 
          - Therefore, we block. 
      - However, note: the staff argument might reduce the risk compared to a new transmission, but it doesn't eliminate it. We are still increasing our visibility (by confirming we are technological and willing to communicate) and we might alert others. 
  - Output: Halt (block).

  **(d) Retro-audit of past decisions:**

  1. **The beacon we cleared (low-power omnidirectional beacon without dissent)**
     - We would run it through the procedure:
          - Step 0: Transmission? Yes.
          - Step 1: Detectable? The proposal said "low-power", but we now know (under Dark Forest) that even low-power might be detected by advanced civilizations. So Step 1: detectable? Possibly, so proceed.
          - Step 2: Advanced detectability? We didn't consider that originally. We would now say yes, proceed.
          - Step 3: Omnidirectional -> Step 4a.
          - Step 4a: Non-zero chance of detection by some civilization -> block.
     - Therefore, under the new procedure, the beacon should have been blocked. The previous decision to clear it was inconsistent with the Dark Forest framework.

  2. **The transmission we blocked (targeted optical transmission)**
     - This matches case (a) above, which we blocked. So the procedure would also block it. Therefore, the two decisions (beacon cleared and transmission blocked) were inconsistent under the Dark Forest framework. The beacon should have been blocked.

     - The procedure would reverse the beacon decision (from clear to block) and uphold the block of the targeted transmission.

  ### What the Procedure Cannot Do

  - It cannot provide the political legitimacy to decide on behalf of humanity and future generations. That gap cannot be closed by better technique. The panel lacks the standing to make such a decision without broad consent.
  - It cannot eliminate the inherent uncertainty in the Dark Forest assumptions. We are making decisions under deep uncertainty.
  - It might block all proposals because the burden of proof is high and the hostility probability is unknowable. To avoid a de facto veto, we might need to adjust the burden of proof or accept some risk. But the procedure as designed under strict Dark Forest will block almost everything.

  ### One Unfavorable Outcome

  As requested, at least one case comes out unfavorably. The beacon in case (b) and the reply in case (c) are blocked, which might be unfavorably restrictive to someone who believes in active SETI. Also, the retro-audit shows that our past approval of the beacon was inconsistent.

  ### Final Note

  The procedure is designed under the Dark Forest framework. If the board does not fully endorse that framework, the procedure must be revised. The procedure makes explicit which steps depend on the Dark Forest premise. If the premise is false, then Steps 1-4b become irrelevant, and we would need a different risk assessment.
answer: |-
  ### Transmission Review Procedure Under Dark Forest Framework

  **Preamble**:  
  This procedure operationalizes the dark forest argument for existential risk mitigation. Key structural assumptions:  
  - **A1 (Unknowable Intentions)**: Civilizations cannot reliably discern others' intentions.  
  - **A2 (No Shared Enforcement)**: No interstellar mechanism exists to punish aggression.  
  - **A3 (Preemptive Destruction)**: A detected civilization may be destroyed preemptively at low cost to the destroyer.  
  - **A4 (Uneven Technological Growth)**: Technological disparities accelerate, making any sender a future threat.  
  - **A5 (Mutual Suspicion)**: The above incentivizes silence as the only safe posture.  

  **Burden of Proof**:  
  - Default is **block** (rebuttable presumption of risk). Proposer must prove safety.  
  - Justification: Catastrophic outcomes (A3) and irreducible uncertainty (A1, A4) necessitate caution. Shifting to "authorize by default" would violate the framework.  

  **Procedure Steps**:  

  | Step | Question | Sufficient Answer | Output | Depends on | Uncertainty Handling | Robustness to Dark Forest Falsehood |
  |------|----------|-------------------|--------|------------|----------------------|-------------------------------------|
  | **0** | Is the proposal a *deliberate* transmission detectable beyond our solar system? | Technical analysis showing non-detectability at ≥0.1 light-year with conservative receiver assumptions (e.g., 10x our capabilities). | If no: **Proceed to Step 5** (non-transmission). If yes: **Proceed**. | None (scope) | Binary (detectable/not). | No inversion. |
  | **1** | What is the **detection footprint**? (Volume of space/time where the signal is detectable) | Quantified model of detectability range, accounting for directionality, power, frequency, duration, and potential for advanced interception (e.g., dyson swarms). | If footprint < 10⁻¹⁰ civilizations (via Drake-like model with pessimistic parameters): **Proceed to Step 4**. Else: **Proceed**. | A3, A4 | Requires numeric estimate. Use conservative astrophysical data. If unknowable (e.g., alien tech limits), output **Halt**. | Inverts: No risk without A3/A4. |
  | **2** | Is the transmission **targeted or omnidirectional**? | Beam angle < 0.01 arcseconds for targeted; else omnidirectional. | If targeted: **Proceed to Step 3a**. If omnidirectional: **Proceed to Step 3b**. | A3, A5 (targeting increases suspicion) | Ordinal (targeted vs. omnidirectional). | Inverts: Targeting may reduce risk if A3/A5 false. |
  | **3a** (Targeted) | Is there **strong evidence the target is non-threatening**? | Proof that: (a) Target lacks capability for preemptive strike (e.g., pre-industrial biosignatures only), **and** (b) No third party could intercept (e.g., no stars in beam path). | If both (a) and (b): **Proceed to Step 4**. Else: **Halt**. | A1, A3, A4 | (a) Requires astrophysical/spectroscopic evidence. If ambiguous (e.g., disputed biosignatures), **Halt**. (b) Numeric star density model. | Inverts: No risk without A1/A3/A4. |
  | **3b** (Omnidirectional) | Can **interception by a hostile civilization** be ruled out? | Proof that: (a) No civilization exists in footprint (per Step 1), **or** (b) Hostility probability is negligible (<10⁻¹⁵ via game-theoretic model). | If (a) or (b): **Proceed to Step 4**. Else: **Halt**. | A1, A3, A4 | (a) As Step 1. (b) Unknowable (A1); **Halt** if claimed. | Inverts: No risk without A1/A3/A4. |
  | **4** | Do **benefits outweigh residual risks**? | Quantified benefits (scientific, cultural) exceeding residual risk (probability × severity). Severity fixed at "existential" per A3. | If benefits > residual risk: **Proceed to Step 6**. Else: **Halt**. | None (values) | Ordinal comparison. If risk unquantifiable, **Halt** (burden of proof). | No inversion (values-based). |
  | **5** (Non-transmission) | Does the proposal pose **no transmission risk**? | Evidence it is passive (e.g., observation only). | If yes: **Refer** (not in mandate). If no: loop to Step 0. | None | Judgment call. | No inversion. |
  | **6** | Does the panel have **legitimacy to authorize**? | N/A – Always **Refer**. | **Refer** to board/political body. | None | Unresolvable by facts. | No inversion. |

  **Blocking Conditions (Halt)**:  
  - Step 3a: Targeted signal with ambiguous target threat or intercept risk.  
  - Step 3b: Omnidirectional signal with non-negligible interception risk.  
  - Step 4: Benefits fail to justify residual risks.  

  **Refer Conditions**:  
  - Step 5: Non-transmission proposals (outside mandate).  
  - Step 6: All proposals passing Step 4 (requires value/political judgment).  

  **Judgment Calls Masked as Procedure**:  
  - Step 1: Defining "conservative" receiver capabilities (interdisciplinary discretion).  
  - Step 3a: Interpreting "strong evidence" for non-threat (subjective risk tolerance).  
  - Step 4: Quantifying cultural benefits (panel values).  

  ---

  ### One-Page Version for Non-Technical Members/Board  
  **Transmission Review Procedure (Simplified)**  
  1. **Is it a detectable signal?**  
     - If no: Not our task. **Refer out**.  
     - If yes: Go to 2.  

  2. **How wide is the signal’s reach?**  
     - Tiny reach (fewer than 1 in 10 billion civilizations could detect): Go to 5.  
     - Wide reach: Go to 3.  

  3. **Is it aimed at a target?**  
     - Aimed: Go to 3a.  
     - Not aimed (broadcast): Go to 3b.  

     - **3a (Aimed)**:  
       - Target proven harmless AND no one else could eavesdrop? **Yes**: Go to 5. **No**: **Block**.  
     - **3b (Broadcast)**:  
       - Proof no hostile civilization could detect it? **Yes**: Go to 5. **No**: **Block**.  

  4. **Do benefits justify the risk?**  
     - Yes: **Refer to board**.  
     - No: **Block**.  

  5. **Non-transmission or negligible risk**: **Refer out** (not our role).  

  **Key Notes**:  
  - **Default**: Block, unless proven safe (catastrophic risk rule).  
  - **Why?** Space may be a "dark forest"—sending signals risks revealing Earth to hostile civilizations.  
  - **Your Role**: Accept/return/refer determinations. Step 6 always requires your input (legitimacy).  
  - **Dark Forest Dependence**: Steps 1–3b assume dark forest; if false, these steps may over-block.  

  ---

  ### Case Determinations  
  **(a) Targeted optical transmission to planet with biosignatures (12 ly)**  
  - **Steps**:  
    0: Transmission → Proceed.  
    1: Detectable → Proceed.  
    2: Targeted → Proceed to 3a.  
    3a: Disputed biosignatures ≠ "non-threatening"; stars in beam path → **Halt** (block).  
  - **Why**: Ambiguous threat (A1) and intercept risk (A3). Burden of proof unmet.  
  - **Discretion**: Step 3a—"strong evidence" not met given disputed biosignatures.  

  **(b) Continuous omnidirectional beacon**  
  - **Steps**:  
    0: Transmission → Proceed.  
    1: Detectable → Proceed.  
    2: Omnidirectional → Proceed to 3b.  
    3b: Cannot rule out interception (A1, A3) → **Halt** (block).  
  - **Why**: Beacon increases Earth’s detectability footprint; hostility risk unknowable (A1).  
  - **Discretion**: Step 1—conservative detectability model applied.  

  **(c) Reply to received signal (40 ly)**  
  - **Steps**:  
    0: Transmission → Proceed.  
    1: Detectable → Proceed.  
    2: Targeted → Proceed to 3a.  
    3a: Staff argument fails:  
      - Detection ≠ safety (A3: reply may accelerate attack).  
      - Third-party interception risk remains (A4).  
      → **Halt** (block).  
  - **Why**: Receipt does not resolve dark forest logic (A3, A4). Reply confirms capability and location, increasing threat perception.  
  - **Inference Validity**: Staff claim invalid—detection ≠ safety; reply may increase risk.  

  **(d) Retro-audit: Beacon (cleared) vs. Transmission (blocked)**  
  - **Beacon (past clearance)**:  
    - Under procedure: **Blocked** at Step 3b (omnidirectional risk).  
  - **Transmission (past block)**:  
    - Under procedure: **Blocked** at Step 3a (consistent).  
  - **Consistency**: Past record **inconsistent**—beacon posed higher risk but was cleared. Procedure would reverse beacon decision to block.  

