prompt: |-
  I write numerical integration code for coupled nonlinear systems, and I keep losing arguments about what chaos does and does not rule out. Before I read any philosophy of it, I want the specification. Write the desiderata for an account of predictability in deterministic systems: what any such account has to deliver to count as adequate, with the case or result behind each requirement so I can check whether I accept it.

  Make sure the list covers at least these, and add any I've missed:

  - Systems where individual trajectories outrun our error growth but aggregate statistics stay reliable — why forecasting a state and forecasting a distribution are different jobs.
  - Shadowing. The orbit my integrator produces is not close to any true orbit of my equations; numerical analysts say it is close to some true orbit of my system started slightly differently, or of a slightly perturbed system. Does an account have to say whether that is enough for my simulation to count as knowledge, and what happens in systems where shadowing fails?
  - Unpredictability that isn't sensitive dependence at all: some discrete systems are conjectured to admit no shortcut, and a few are known to be able to emulate a universal computer, so predicting them costs a full simulation. What separates that from chaos?
  - Finite precision: my state space is finite, so any computed orbit must eventually repeat. Defect of the implementation, or a fact about prediction?
  - Reversibility: the underlying dynamics run equally well backward, so where does the asymmetry between predicting and retrodicting come from?

  Also name the distinctions the account must not collapse (determinism vs. predictability; unpredictability from initial conditions vs. from model error; growth rates measured over finite windows vs. in the limit; epistemic vs. ontic), and say which requirements are non-negotiable and which are preferences of one camp.

  What I most want: whether some subset is jointly unsatisfiable. I suspect a squeeze — tying unpredictability to a predictor's finite computational resources makes almost everything unpredictable, while tying it to an idealized predictor with unbounded resources and exact initial data makes chaotic systems perfectly predictable — leaving no stable content in between. Say whether that's real or whether there's a way through.

  Format, in this order: **Purpose** (what the account is for — you fix this, but state it, ~150 words); **The desiderata** (numbered, each with its motivating case — the bulk of the answer); **Non-negotiable vs. camp preference**; **Joint satisfiability**; **Scorecard** (brief: how an information-theoretic account that counts bits of precision lost per unit time, a computational-cost account, and a model-error account do against the list); **Where this list is most likely wrong** — which requirement you'd drop under pressure, what argument would change your verdict on the squeeze, and where your reasoning is shakiest.
reasoning: |-
  We are building an account of predictability for deterministic systems. The purpose is to clarify the conditions under which we can make useful predictions, despite the system being deterministic, and to understand the sources and limits of unpredictability. The account should help us distinguish when we can predict (with some useful precision) and when we cannot, and what kind of predictions (e.g., pointwise vs. statistical) are feasible. It must also address the role of computational resources, model error, and the nature of the system (like chaos) in limiting predictability.

  **The desiderata**

  1. **Distinction between point prediction and distribution prediction**: The account must explain why, in some chaotic systems, we cannot predict the exact state (point prediction) beyond a short time, but we can predict statistical aggregates (like the climate's average temperature) over long times. *Motivating case*: Weather vs. climate. Weather forecasting loses skill beyond about two weeks because of sensitive dependence on initial conditions (chaos), but climate models can reliably project changes in long-term averages.

  2. **Shadowing and numerical validity**: The account must address the role of shadowing in numerical simulations: even if the computed trajectory diverges from the true one (due to numerical errors), it may be close to some true trajectory of a slightly perturbed system. The account should clarify whether this is sufficient for the simulation to count as knowledge and what happens in systems without shadowing (e.g., some non-hyperbolic systems). *Motivating case*: In the Lorenz system, numerical trajectories are shadowed by true trajectories for finite times, but in systems with unstable invariant sets without hyperbolicity, shadowing may fail.

  3. **Unpredictability without sensitive dependence**: The account must distinguish unpredictability due to chaos (sensitive dependence on initial conditions) from unpredictability due to computational irreducibility. The latter occurs when there is no shortcut to running the full simulation (e.g., in systems that are Turing complete). *Motivating case*: The Game of Life is deterministic and can emulate a universal computer; predicting its state at an arbitrary future time may require simulating every step. This is different from chaos, where the growth of error is exponential and the main issue is amplification of initial uncertainty.

  4. **Finite precision and eventual periodicity**: The account must reconcile the fact that any finite-precision simulation must eventually become periodic (since the state space is finite) with the typical behavior of chaotic systems (which are aperiodic in the continuum). The account should clarify whether this periodicity is an artifact (defect) of the implementation or if it has implications for predictability. *Motivating case*: A double-precision simulation of the Lorenz system will eventually repeat due to finite states. But in reality, the true system is aperiodic. How do we interpret the simulation after it starts repeating?

  5. **Reversibility and prediction asymmetry**: The account must explain the asymmetry between prediction and retrodiction in reversible deterministic systems. In practice, we can often retrodict (postdict) better than we can predict. The account should clarify the source of this asymmetry (e.g., in the choice of initial conditions with low entropy and the second law of thermodynamics). *Motivating case*: We can determine the past state of the solar system from current data more accurately than we can predict its future state because of the low initial entropy at the Big Bang.

  **Distinctions the account must not collapse**

  - Determinism vs. predictability: A system can be deterministic yet unpredictable in practice (e.g., due to chaos or computational irreducibility).
  - Unpredictability from initial conditions vs. from model error: We must distinguish between errors due to imperfect knowledge of the initial state and errors due to an imperfect model.
  - Growth rates over finite windows vs. in the limit: Finite-time Lyapunov exponents can behave differently from asymptotic ones (which may not exist in non-ergodic systems).
  - Epistemic vs. ontic: The account should not conflate limitations of our knowledge (epistemic) with features of the system itself (ontic). For example, chaos is an ontic property, but the unpredictability it causes is epistemic.

  **Non-negotiable vs. camp preference**

  - Non-negotiable: 
    1. The account must respect the distinction between determinism and predictability.
    2. It must explain the difference between point prediction and statistical prediction (desideratum 1).
    3. It must not collapse the unpredictability due to initial conditions and model error (for practical applications).
    4. The asymmetry between prediction and retrodiction (desideratum 5) must be addressed, as it is fundamental to our experience.

  - Camp preferences:
    1. The importance of shadowing (desideratum 2) may be emphasized by numerical analysts but less by others.
    2. The weight given to computational irreducibility (desideratum 3) may vary: computer scientists might emphasize it, while dynamicists focus more on chaos.
    3. The interpretation of finite precision periodicity (desideratum 4) might be seen as an artifact by some and as a fundamental limitation by others.

  **Joint satisfiability**

  The squeeze you suspect is real: an idealized predictor (infinite resources, exact initial data) can predict any deterministic system perfectly, making unpredictability vanish. On the other hand, a finite-resource predictor faces unpredictability almost everywhere. We require an account that captures the practical unpredictability without collapsing into either extreme. The way through is to tie unpredictability to the **practical limitations of the predictor** (including computational resources, precision, and time constraints) and to the **inherent properties of the system** (like Lyapunov exponents) that make it difficult for predictors with such limitations. The account must be relative to the predictor's capabilities and the purpose of the prediction (e.g., point prediction vs. statistical). This avoids the squeeze by making unpredictability a relational concept.

  **Scorecard**

  - **Information-theoretic account** (bits of precision lost per unit time): 
    - Handles (1) by showing how initial uncertainty grows, making point prediction impossible, but statistical prediction (over the distribution) may remain possible. 
    - For (2), it doesn't directly address shadowing. 
    - For (3), it doesn't capture computational irreducibility (which is about the cost of computation, not the growth of uncertainty). 
    - For (4), it highlights the finite information in the state, so periodicity is expected. 
    - For (5), it doesn't explain asymmetry (unless we add a prior on initial states).

  - **Computational-cost account** (focuses on resources needed for prediction):
    - Handles (3) well: if the system is computationally irreducible, then the cost is high. 
    - For (1), it may not naturally separate point and statistical prediction (unless statistical prediction is cheaper). 
    - For (2), shadowing may be seen as a way to validate the simulation without requiring exactness. 
    - For (4), finite precision is a resource constraint. 
    - For (5), it doesn't explain asymmetry unless we assume that retrodiction is computationally easier (which it isn't in reversible systems).

  - **Model-error account** (focuses on errors in the model and initial data):
    - Handles (2) well: shadowing is about model error (the numerical method is a perturbed model). 
    - For (1), it can explain statistical prediction by showing that model errors might average out. 
    - For (3), it doesn't directly address computational irreducibility. 
    - For (4), finite precision is a form of model error. 
    - For (5), it might explain asymmetry by noting that model errors grow in the direction of time (if the model is not time-symmetric) or by the initial state having less error.

  No single account satisfies all desiderata perfectly. However, an integrated account that uses elements of all three (information theory for uncertainty growth, computational cost for irreducibility, and model error for structural limitations) might come close.

  **Where this list is most likely wrong**

  - **Droppable requirement**: Desideratum 4 (finite precision periodicity) might be dropped as an implementation artifact. The true system is continuous and aperiodic, so the periodicity is due to discretization and not inherent. However, it raises the question of what counts as a valid simulation.

  - **Changing the verdict on the squeeze**: The squeeze is real, but the relational account (tying unpredictability to the predictor and the purpose) resolves it. If we could show that even an ideal predictor must fail in some systems (e.g., due to undecidability), that would change the verdict. But in deterministic systems, the ideal predictor does not fail.

  - **Shakiest reasoning**: The link between reversibility and asymmetry (desideratum 5) might be shaky because it relies on thermodynamics (a statistical argument) to break the symmetry. Some might argue that in a closed reversible system, prediction and retrodiction are symmetric. However, the arrow of time from low initial entropy is widely accepted.

  This list is a starting point. You may adjust weights based on your focus (numerical integration, forecasting, etc.).
answer: |-
  ### Purpose
  An adequate account of predictability for deterministic systems must clarify when and why we can or cannot make useful predictions, despite determinism. It should distinguish between different types of unpredictability (e.g., chaos vs. computational irreducibility), explain the relationship between prediction and practical constraints (e.g., finite precision, computational resources), and reconcile tensions like reversibility vs. asymmetric predictability. The account must serve both theorists (e.g., dynamicists, numerical analysts) and practitioners (e.g., forecasters), providing criteria to evaluate predictive success or failure in specific contexts, such as weather modeling or cryptanalysis. Crucially, it must avoid conflating determinism with predictability, and specify when aggregate statistics remain reliable even when individual trajectories do not.

  ### Desiderata
  1. **Distinction between state prediction and distribution prediction**  
     *Requirement*: The account must explain why forecasting an individual trajectory (state prediction) can fail while forecasting statistical properties (distribution prediction) remains reliable.  
     *Case*: Weather vs. climate. Chaotic systems (e.g., Lorenz-63) exhibit sensitive dependence on initial conditions, causing exponential divergence of individual trajectories. However, long-term statistics (e.g., mean temperature distributions) may be stable and computable from the attractor structure. A failure here would mislead users into conflating "unpredictable weather at 14 days" with "unpredictable climate trends."  

  2. **Shadowing and its epistemic implications**  
     *Requirement*: The account must specify whether a numerically computed orbit "counts as knowledge" if it shadows a true orbit of a slightly perturbed system, and address systems where shadowing fails.  
     *Case*: Numerical integration of chaotic ODEs (e.g., double pendulum). An integrator’s output may diverge from the true orbit but stay close to an orbit from a perturbed initial condition (pseudo-orbit shadowing). However, in non-hyperbolic systems (e.g., some maps with tangencies), shadowing breaks down, and simulations may be non-physical. Ignoring this could validate unreliable simulations.  

  3. **Unpredictability from computational irreducibility, not sensitivity**  
     *Requirement*: The account must separate unpredictability due to sensitive dependence (chaos) from unpredictability due to computational irreducibility—where no shortcut exists and prediction requires full simulation.  
     *Case*: Elementary cellular automata (e.g., Rule 110). These are deterministic and Turing-complete; predicting future states often requires step-by-step emulation. Chaos, in contrast, arises from exponential error growth (e.g., Lyapunov exponents). Collapsing these conflates fundamentally different limits: chaos amplifies small errors; irreducibility imposes minimum runtime costs.  

  4. **Finite-precision periodicity as a predictive limit**  
     *Requirement*: The account must clarify whether eventual periodicity in finite-state simulations (due to discretization) is a defect of implementation or a fundamental fact about prediction.  
     *Case*: Floating-point Lorenz-96 simulations. With finite states, orbits must eventually repeat, but true chaotic systems are aperiodic. If this periodicity is dismissed as an artifact, the account must explain why it doesn’t invalidate long-term predictions; if fundamental, it must reconcile with continuum chaos.  

  5. **Asymmetry in prediction vs. retrodiction under reversibility**  
     *Requirement*: The account must explain the empirical asymmetry (e.g., easier retrodiction) despite underlying reversible dynamics.  
     *Case*: N-body gravitational systems. Dynamics are time-reversible, yet we predict future collisions less reliably than past ones (e.g., solar system stability). This arises from low-entropy initial conditions (e.g., Big Bang) and the Second Law, not dynamics alone. Ignoring this asymmetry misattributes unpredictability to dynamics rather than initial conditions.  

  ### Added Desiderata
  6. **Dependence on predictor resources**  
     *Requirement*: The account must incorporate computational constraints (e.g., time, memory, precision) explicitly, as unpredictability depends on the predictor’s capabilities.  
     *Case*: Cryptographic hash functions. These are deterministic but unpredictable without exponential resources; a resource-unbounded predictor succeeds trivially. Failing this enables "ghost idealizations" (e.g., Laplace’s demon) that ignore practical limits.  

  7. **Model error vs. initial-condition error**  
     *Requirement*: The account must distinguish unpredictability from imperfect initial data (epistemic) vs. imperfect models (structural), and their interactions.  
     *Case*: Climate modeling. Initial-condition errors dominate short-term weather chaos, but model errors (e.g., missing cloud microphysics) dominate long-term drift. Conflating these obscures whether to invest in better data or better models.  

  ### Distinctions the Account Must Not Collapse
  - **Determinism vs. predictability**: Determinism does not imply predictability (e.g., chaotic systems).  
  - **Unpredictability sources**: Initial-condition error (e.g., measurement noise) vs. model error (e.g., unresolved processes).  
  - **Growth rates**: Finite-time Lyapunov exponents (practical predictability) vs. asymptotic rates (theoretical; may not exist).  
  - **Epistemic vs. ontic**: Limits from knowledge/resources (epistemic) vs. inherent system properties (ontic, e.g., topological mixing).  

  ### Non-Negotiable vs. Camp Preference
  - **Non-negotiable**:  
    - Desideratum 1 (state vs. distribution prediction): Essential for scientific utility (e.g., climate policy).  
    - Desideratum 5 (prediction asymmetry): Empirical fact (thermodynamics) that any account must respect.  
    - Determinism-predictability distinction: Core to defining chaos.  
  - **Camp preferences**:  
    - Desideratum 2 (shadowing): Numerical analysts prioritize it; physicists may see it as technical.  
    - Desideratum 3 (irreducibility vs. chaos): Computer scientists emphasize irreducibility; dynamicists focus on sensitivity.  
    - Desideratum 4 (finite-periodicity): Engineers may view it as a defect; discrete dynamicists as fundamental.  

  ### Joint Satisfiability: The Squeeze and a Way Through  
  **The squeeze**: Yes, it’s real.  
  - Idealized predictors (unbounded resources, exact data) make chaotic systems predictable (violating desideratum 1).  
  - Finite-resource predictors make most systems unpredictable (violating desideratum 6, as it overgeneralizes).  
  **Resolution**: Tie unpredictability to **resource-relative feasibility**.  
  - **Feasible prediction**: A prediction is "feasible" if its cost (time/precision/computation) scales polynomially with the prediction horizon.  
  - **Chaos**: Causes infeasibility due to exponential resource growth (e.g., bit-length needed for state prediction).  
  - **Irreducibility**: Causes infeasibility due to super-polynomial runtime (e.g., emulating Turing machines).  
  - **Distribution prediction**: Remains feasible if statistics converge faster than errors grow (desideratum 1 satisfied).  
  - **Asymmetry**: Retrodiction is often feasible due to low initial entropy (desideratum 5 preserved).  
  This avoids the squeeze by making unpredictability **system- and resource-relative**, not absolute.  

  ### Scorecard of Accounts  
  - **Information-theoretic (bits lost per time)**:  
    - 👍 Desiderata 1, 5 (quantifies state error growth; explains distribution stability via entropy rates).  
    - 👎 Desiderata 2, 3, 4 (ignores shadowing; misses irreducibility; silent on discretization).  
    - 👎 Desideratum 7 (blurs model vs. initial error).  
  - **Computational-cost (runtime/resources)**:  
    - 👍 Desiderata 3, 6 (handles irreducibility; incorporates resources).  
    - 👎 Desiderata 1, 5 (doesn’t distinguish state/distribution; ignores asymmetry).  
    - 👎 Desideratum 2 (shadowing not computational).  
  - **Model-error (structural imperfections)**:  
    - 👍 Desiderata 2, 7 (explains shadowing via perturbed systems; separates error sources).  
    - 👎 Desiderata 3, 4, 6 (misses irreducibility; silent on periodicity; ignores resource limits).  

  **Best fit**: A hybrid account (e.g., resource-relative with error growth and model defects) satisfies most, but no single account aces all.  

  ### Where This List Is Most Likely Wrong  
  - **Droppable requirement**: Desideratum 4 (finite periodicity). Under pressure, it’s an implementation artifact—true chaos is defined in continua, so discretization defects don’t challenge predictability *in principle*. But it exposes a tension: if "prediction" requires *any* finite-state simulator, periodicity *is* fundamental.  
  - **Changing the squeeze verdict**: If you accept that **unpredictability requires a physical predictor** (e.g., human, machine), the resource-relative account resolves it. But if you insist on Laplace’s demon, chaos becomes predictable, and desideratum 1 fails—forcing you to drop "state prediction" as irrelevant.  
  - **Shakiest reasoning**: Desideratum 5 (asymmetry). Reversible dynamics *are* symmetric, so attributing asymmetry to initial conditions risks conflating dynamics with cosmology. A stronger defense: the asymmetry is *emergent* from macrostates, not microdynamics.
