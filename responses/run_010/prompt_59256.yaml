  Okay, the user is a novelist three years into a project centered on a dementia care unit and an advance directive. They've done extensive research—ethics consultations, legal statutes, Dutch euthanasia cases—and want to unpack the philosophical concept of "precedent autonomy" driving these practices. The core tension they identify is how a document signed by a "past self" binds a "present self" who is fundamentally different in cognition and desires. 

  The user's four observed contradictions are sharp: (1) The binding power of the document over a content, non-autonomous person; (2) The inconsistent weight given to present expressions; (3) The parallel but opposite handling of psychiatric directives; (4) The ease of revocation during competence versus irrevocability after dementia onset. 

  What they're really asking for is the metaphysical scaffolding beneath these legal/medical practices—not just textbook definitions but the implicit assumptions about identity, autonomy, and moral standing that make this system coherent (or expose its fractures). As a writer, they need to dramatize these tensions, not lecture about them.

  The Dutch case they mention is particularly telling: it shows precedent autonomy stretched to its limit—honoring a document when the patient can't even confirm it. That’s the extreme edge of the philosophy they want to probe. Their lawyer friend’s term "precedent autonomy" is the key they want turned. 

  The psychiatric directive asymmetry feels like a smoking gun to them—why treat dementia directives as binding but psychiatric ones as revocable? Is it philosophical inconsistency or practical compromise? They need that distinction clarified because it reveals the seams in the system. 

  Their last question about a hypothetical "present-experience-only" framework is brilliant: it forces the philosophy into relief by asking how practice would change if foundational beliefs shifted. That’s exactly what a novelist needs—to see the shadow of the alternative. 

  They’re not just asking for theory; they need to know how these ideas manifest in committee rooms, legal language, and bedside conflicts. The procedural texture matters because their scenes will live in those details. When they mention "separate what presupposes from what merely fits," they’re warning against over-attribution—they want the bare bones of the philosophy, not adjacent ideas that could confuse the narrative. 

  The challenge is reconstructing the implicit metaphysics without oversimplifying the contradictions. The practice isn’t philosophically pure; it’s a patchwork. The psychiatric directive discrepancy, for example, likely stems from liability fears and clinical culture, not a coherent theory of selfhood. That’s useful for their novel—it shows systems wrestling with irreconcilable principles. 

  For their protagonist’s document to "turn" the book, they need to know: What belief makes that paper sacred? What would break the spell? That’s the core. The Dutch example proves some societies extend precedent autonomy further; the U.S. psychiatric contrast shows where it snaps. Both are narrative tools. 

  Finally, the "different person" question is existential. If the demented patient is morally distinct from the signer, the document is violence. If she’s the same person diminished, it’s liberation. The novel’s tension lives there. My reply must equip them to dramatize that ambiguity without resolving it—because the practice itself doesn’t.
answer: |-
  The practice you describe rests on a complex, often contradictory philosophical substructure—one that smuggles metaphysics under the guise of legal pragmatism. Let's dissect its implicit commitments, tensions, and underdetermined spaces, focusing on your four observed paradoxes.

  ### Core Presupposition: **"Precedent Autonomy" as Extended Selfhood**
  The binding force of the advance directive presupposes a specific view of **personhood as narrative unity over time**. Key elements:
  - **Identity as Enduring Agency**: The signer and the demented patient are considered the *same moral person* because identity is grounded in the continuity of a life story, not present psychological states. The document is a "standing offer" from the past self to future caregivers.
  - **Autonomy as Projection**: Autonomy isn’t exercised continuously but *projected* through time via prior expressions. The directive embodies the "authentic" self’s values (e.g., "I’d rather die than live without cognition"), overriding the demented self’s contentedness as "inauthentic."
  - **Welfare as Life-Shape**: Well-being is judged across a whole life, not episodic experiences. Avoiding prolonged decline (a harm to the *past self’s* values) outweighs transient pleasure in dementia.

  ### What This Rules Out:
  1. **Present-Interest Theories**: Views claiming only current experiences matter (e.g., hedonistic utilitarianism) would reject the document’s authority over a contented patient.
  2. **Psychological Continuity Theories**: If personhood requires connected memories/intentions (Parfit), the demented patient may be a "new person," making the directive irrelevant or even a violation.
  3. **Relational Personhood**: Frameworks emphasizing social ties (e.g., some care ethics) would prioritize the daughter’s *current* relationship with her mother over a decades-old signature.

  ### The Paradoxes Explained:
  **1. Document Over Living Woman**  
  *Presupposes*: The demented self lacks **moral agency** due to lost capacity for reflection. The directive is a "bridge" carrying the competent self’s authority into incapacity. Contentment is irrelevant—it’s not an *expression of values* but a neurological response.  

  **2. Inconsistent Weight to Present Wishes**  
  *Presupposes*: Resistance is only actionable if it reflects **residual capacity**. Protocols dismissing resistance assume dementia destroyed the ability to form lasting preferences. When resistance *is* honored, it’s often due to:  
  - **Epistemic Uncertainty**: Is she resisting *this spoon* or *all food*?  
  - **Legal Caution**: Fear of liability for overriding *any* expressed wish.  
  *Philosophical Undermining*: This inconsistency reveals tension between autonomy (past wishes) and non-maleficence (avoiding present distress).  

  **3. Psychiatric Directive Asymmetry**  
  *Not philosophically grounded*—this is where practice diverges due to:  
  - **Clinical Paternalism**: Psychiatry historically resists patient control during psychosis, prioritizing "restoration" of the "true self."  
  - **Liability Concerns**: Forced treatment during psychosis is legally safer than withholding antibiotics in dementia.  
  - **Epistemic Bias**: "I can’t predict psychosis" is seen as different from "I can imagine dementia."  
  *Contradiction*: If precedent autonomy were consistent, psychiatric directives would be binding. Their override betrays **skepticism about autonomy during altered states**—a skepticism not extended to dementia.  

  **4. Easy Revocation Pre-Incapacity**  
  *Presupposes*: Autonomy is **sovereign and revocable** while capacity exists. The ease of revocation (even a shrug) implies that present autonomy always supersedes past autonomy—until the moment it evaporates. This highlights the paradox: the *past self* can bind the *future self*, but the *present self* can always unbind itself… until it can’t.  

  ### Philosophical Underdetermination
  The practice *doesn’t require* a single theory of personal identity. It functions with:  
  - **Narrative Views** (the patient is the "same" because her life story continues)  
  - **Interest Persistence** (the past self’s interest in avoiding indignity persists)  
  - **Proxy Contractualism** (the document is a social agreement to honor the signer’s will)  
  ...all yielding the same outcome. What it *cannot accommodate* is the claim that the demented patient is a **distinct moral entity**.  

  ### If Only Present Experience Counted: A Radical Shift
  A "present-experience" framework (e.g., quality-of-life utilitarianism) would transform practice:  
  - **Documents**: Directives could only *guide* assessments of *current* welfare, not bind.  
  - **Consultations**: Ethics committees would evaluate present suffering/fulfillment, not interpret past documents as commands.  
  - **Vocabulary**: "Incompetence" would focus on *current distress*, not incapacity to adhere to past wishes.  
  - **Role of Directive**: Your protagonist’s document would become a **testament to values**, informing (not dictating) decisions. It might justify *withholding* burdensome interventions if aligned with *current* well-being—but antibiotics for a contented patient with a reversible infection? They’d likely be given.  

  ### Narrative Implications for Your Novel
  The Dutch model you cite reveals the logical extreme of precedent autonomy: a signature as an unbreakable covenant with a future self who cannot protest. Your scenes can dramatize the friction:  
  - The daughter grappling with her mother’s contentment vs. the document’s cold imperative.  
  - Clinicians debating whether resistance is "authentic" or reflexive.  
  - The ghost of the engineer haunting the unit—her will enforced on a woman who sings nursery rhymes.  

  The asymmetry with psychiatric directives is your lever to expose the system’s unspoken hierarchies: dementia is seen as an *erasure* of self, psychosis as a *distortion*—one we feel entitled to correct against past instructions.  

  **In essence**: The law treats the dementia directive as the last word of a vanishing self. Your novel can ask: When the self vanishes, who does that word belong to?
