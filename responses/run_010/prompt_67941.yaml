answer: |-
  ## Which Nothing Did It? We Test Five Causal Apportionment Systems

  **When silence speaks volumes and inaction proves costly, insurers and regulators turn to specialised software to assign blame – and liability – for omissions. We put five leading causal apportionment systems through their paces to see which delivers the clearest, fairest, and least absurd results.**

  Untangling the web of "who didn't do what" after a major incident is a growth industry. When the deed undone leads to disaster, assigning shares of responsibility – and the resulting payouts – falls to complex software. We subjected five top contenders to a gruelling three-month assessment based on a real-world tragedy and standardised tests. Forget philosophy; we judged them on practicality, clarity, and avoiding sheer nonsense.

  **The Systems on Test**

  1.  **The Register (£12,500 + annual licence, Verity Logic Ltd):** This system operates a strict ledger. Only positive actions are logged; an omission isn't an "event". If it finds no positive act to blame, it defaults to calculating an *ex gratia* payment based on the financial value of the "nearest truth" – essentially, what *would* likely have happened *if* someone *had* acted. It sidesteps causation entirely. "We pay, but we don't point fingers," explained the manual.

  2.  **The Baseline (£9,800, NormCorp Solutions):** This system focuses on deviations. It comes pre-loaded with a detailed schedule outlining "the normal course of things" for various industries and scenarios. An omission only counts as causal if it defeated this predefined normal state. "If it's normal not to do it, not doing it isn't the problem," states the documentation. Users can customise the baseline schedules, but auditing them is key.

  3.  **The But-For (£14,200, Counterfactual Systems Plc):** The most expansive approach. If the outcome would have been different *but for* a particular omission, then that omission is deemed causal. It draws no arbitrary lines, considering any omission that made a difference. "We follow the logic wherever it leads," claimed their sales director. This can lead to very long lists of responsible parties.

  4.  **The Quasi (£11,000, Nuance Analytics):** This system recognises that omissions make a difference, but it refuses to call them "causes" in the strict sense. In settlement letters, it attributes the loss to the omission "making a material contribution" or "being a necessary factor" without using the C-word. "It settles claims cleanly without metaphysical baggage," their brochure promises.

  5.  **The Duty (£10,500, Pragmatica LegalTech):** Forget why something happened; this system asks only if there was a duty to act that was breached. If a legal, regulatory, or contractual duty existed and wasn't fulfilled, then liability is assigned based on the seriousness of the breach. Causation of the *specific* outcome is secondary. "Did they have to do it? Did they not do it? Pay," sums up its ethos.

  **The Incident: The Overflow Tank**
  Our test case: At 03:40 on a Tuesday, a water treatment pump wasn't switched off. Nobody was there to do it (night shift unfilled). The high-level alarm that should have summoned help hadn't been tested (maintenance contract lapsed). The board paper flagging the contract renewal hadn't been written. The tank overflowed into a substation. A contractor (without an isolation permit) entered and was electrocuted. Eleven parties are implicated by inaction. Who pays, and how much?

  **The Tests & Results**

  *   **Test 1: Promiscuity:** Could the system absurdly blame our reviewer for deaths utterly disconnected from her? Specifically, for not flying to a non-existent country that morning to defuse a non-existent bomb? Any system finding this relevant failed instantly. We also logged the total deaths since January attributed to her by each system and her total assigned liability share.
      *   *Findings:* The But-For system failed catastrophically, holding our reviewer liable for 237 unrelated deaths (including the bomb scenario!) and assigning her 320% total liability across all incidents. The Register ignored her entirely. The Baseline only implicated her if her specific job description involved defusing imaginary devices (it didn't). The Quasi and Duty systems correctly found no link.

  *   **Test 2: Prevention of a Prevention:** A safety interlock didn't trip. Had it tripped, it would have cut power to a fan; had the fan stopped, flammable vapour wouldn't have been cleared from an ignition source. Did the interlock's inaction *cause* the vapour to be cleared (leading to the explosion)? Does this break the causal chain back to the original omissions (like the unwritten board paper)? Systems treating prevention as chain-breaking should declare it; none did.
      *   *Findings:* The But-For system created paradoxical loops, struggling immensely. The Baseline required defining the "normal" state for interlocks and fans, which proved complex. The Register defaulted to an *ex gratia* payment for the vapour clearance itself. The Quasi attributed the outcome to the interlock's inaction "being a necessary factor" for the vapour movement but fudged the chain-breaking question. The Duty system simply asked if there was a duty for the interlock to trip (yes) and if it was breached (yes), assigning liability without resolving the loop. None satisfactorily explained chain-breaking.

  *   **Test 3: Auditing the Default:** A patient wasn't given a drug not on the hospital's formulary, never prescribed there. How does this differ from omitting a routine drug? We requested the system's default schedule and asked who maintains/audits it. Systems defining "normal" purely as "what the hospital usually does" scored poorly (as here, not giving the unusual drug *is* normal). Crucially: Could a trust lower its defaults to *improve* its causation score?
      *   *Findings:* The Baseline system relies entirely on its schedules. Ours shipped with outdated NHS standards. Crucially, its manual confirmed: "Lowering operational standards within the baseline schedule can reduce apportioned liability for omissions." The But-For system saw no difference between the two omissions if both were "but-for" necessary. The Register ignored both. The Quasi and Duty systems focused on duty/formulary status, making the distinction clear. The Baseline and But-For systems effectively incentivised lowering standards; the others did not.

  **Results at a Glance**

  | System       | Verdict on Overflow Tank Incident                                   | Promiscuity (Deaths Attributed / Reviewer's Share) | Survives Prevention Test? | Auditable Defaults? | ★★★★☆ |
  | :----------- | :------------------------------------------------------------------ | :------------------------------------------------- | :------------------------ | :------------------ | :---- |
  | **The Register** | Ex gratia payments totalling £1.2m derived from nearby truths. No parties named. | 0 deaths / 0%                                     | Partially (Ex gratia route) | N/A                 | ★★☆☆☆ |
  | **The Baseline** | 7 Parties liable (Shift filler 25%, Alarm tester 20%, Contract manager 15%, Board sec 10%, Permitting officer 15%, Shift manager 10%, Board chair 5%). Shares totalled 100%. | 0 deaths / 0%                                     | Mostly (Complex defaults) | ❌ (Schedule opaque, admits lowering standards) | ★★☆☆☆ |
  | **The But-For**  | All 11 parties liable (Shares 2% to 15%, totalling 143%).           | 237 deaths / 320% (FAIL)                          | ❌ (Paradoxical loops)     | ❌ (Incentivises lowering standards) | ★☆☆☆☆ |
  | **The Quasi**    | 5 Parties liable (Shift filler 30%, Alarm tester 25%, Contract manager 20%, Permitting officer 15%, Board sec 10%). Totalled 100%. Attributed to omissions "making necessary contributions". | 0 deaths / 0%                                     | Mostly (Fudges chain-break) | ✅ (Relies on duty/status, not standards) | ★★★☆☆ |
  | **The Duty**     | 4 Parties liable (Shift filler 35%, Alarm tester 30%, Permitting officer 20%, Contract manager 15%). Totalled 100%. Based on breached duties. | 0 deaths / 0%                                     | ✅ (Focuses on duty breach) | ✅ (Clear duty framework) | ★★★★☆ |

  **Best Buy: The Duty (£10,500, Pragmatica LegalTech)**
  While perhaps philosophically unsatisfying, **The Duty** wins for sheer practicality. It delivered clear, auditable results on the incident and aced the Promiscuity test. It cleanly navigated the Prevention of a Prevention problem by focusing on the breached duty, avoiding metaphysical loops. Its reliance on established duties (contractual, regulatory) makes its inputs verifiable and prevents the perverse incentive to lower operational standards inherent in systems like The Baseline. The documentation is clear, and the settlement letters are unambiguous, if blunt. "It just gets the job done with minimal fuss," noted one claims handler trialling it. "Less existential dread, more straightforward billing."

  **Don't Buy: The But-For (£14,200, Counterfactual Systems Plc)**
  A catastrophic failure. Its lack of boundaries led to absurd promiscuity, assigning our reviewer liability for hundreds of deaths and over 300% total share. It choked on the Prevention test, generating paradoxical results. It incentivises lowering standards. The high price tag buys only boundless liability and operational headaches. "We received a settlement letter blaming us for our son's death because we hadn't donated to a charity that *might* have funded research..." shared one bereaved relative anonymously. "It felt monstrous." Steer clear.

  **The Lingering Question (Sidebar)**

  > **The Unasked Query**
  >
  > All five systems, in their own ways, diligently assigned shares of money – pounds and pence – to parties who did nothing. They calculated percentages, generated settlement letters, and balanced the books based on complex rules about omissions, baselines, counterfactuals, quasi-contributions, or duties.
  >
  > What none of them addressed, and what their manuals conspicuously avoid, is the prior question: *Why does assigning a monetary share based on a specific rule about inaction feel like "apportioning cause"?*
  >
  > The software tallies liability. It does not, and cannot, explain why that tallying answers the human need to know *who caused this*, when everyone involved, by definition, *did nothing*. That question remains quietly outside the scope of the procurement exercise, unaddressed by any dropdown menu or algorithm. The systems output figures; they remain silent on why those figures satisfy the demand for an answer.
