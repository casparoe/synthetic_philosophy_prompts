  I'm stuck on a chunk of my paper on Popper and Darwin and I want somebody to just make the argument for me, cleanly, so I can see whether it holds up or collapses.

  Setup, briefly, because I dont want to waste words on things you already know. Popper concluded that natural selection isn't a testable scientific theory but a metaphysical research programme, largely because the fitness term seemed to just restate what it was supposed to explain; he softened this later in life, but for this exercise grant him the harsh early verdict and don't try to rescue him with a propensity reading of fitness. That's the boring move, and I've dealt with it already.

  The worry my referee is pushing is the self-undermining one: Popper's evolutionary epistemology says knowledge grows by conjecture and refutation, and that is supposed to be the same schema as variation and selective retention in biology. If the biological half of the schema is unfalsifiable metaphysics, the epistemology inherits that status, and his own demarcation criterion then demarcates his epistemology out of science. The referee wants me to bite the bullet and admit the whole thing is metaphysics all the way down.

  Here's what I want argued instead. The objection never gets off the ground, because the two halves are not one schema used twice. Call the rival readings the same-schema reading and the different-relation reading. On the different-relation reading, critical elimination and selective elimination are seperate relations rather than one relation instantiated in two domains: we can let our theories die in our stead — that's Popper's own image, in *Objective Knowledge* — only because we can represent a theory as false and argue against it, whereas selection has no representational access to what it eliminates; it just removes organisms. So there is no channel along which the unfalsifiability travels, and the epistemology stays testable even while the biology is metaphysical.

  Argue that. Really argue it: numbered premises, with the inference at each step made explicit, and a mark on any premise a Popperian would not happily accept. Steady the case against the referee first — give me the objection in its strongest form, including the version that says the asymmetry I'm leaning on is itself an untestable metaphysical claim about representation, which is the one that worries me most — and then answer it rather than noting that it's a problem. And be honest about the price: on this reading Popper surrenders the continuity with biology that made the view attractive to begin with, and it's not obvious anything survives of his treatment of animal expectations as proto-hypotheses. Tell me what survives.

  No bibliography, no reading list, no citations — I know the literature and you'd only be guessing at page numbers. Prose argument first, then a JSON object after it with exactly these fields:

  - `thesis`: one string stating the position argued
  - `premises`: array of objects, each `{"id": "P1", "statement": string, "popperian_would_accept": true/false, "if_false_why_not": string}`
  - `load_bearing`: the `id` of the single premise the argument most depends on, plus one sentence on why
  - `objections`: array of objects, each `{"objection": string, "reply": string, "reply_strength": "holds" | "holds_with_cost" | "shaky"}` — include the representation-is-itself-metaphysics version as one of these
  - `concession`: what the argument cannot handle, stated plainly
  - `cost_to_popper`: what Popper gives up if he accepts it
  - `one_sentence_version`: the whole thing in one sentence a grad student could repeat
