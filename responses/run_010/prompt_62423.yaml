     - Reply strength: holds with cost (because Popper wanted the biological foundation).

  Concession: The argument does not rescue the continuity between biological evolution and human knowledge growth that Popper emphasized. It also leaves open the question of how animal cognition (which may not have full representation) fits into EE.

  Cost to Popper: He must give up the strong continuity between biological evolution and human knowledge growth. The analogy becomes weaker, and the treatment of animal expectations as "proto-hypotheses" is undermined because without representation, they are not hypotheses in the same sense.

  One-sentence version: Because human critical elimination involves representational access absent in natural selection, the two are not the same relation, preventing the transfer of metaphysical status from biology to epistemology.

