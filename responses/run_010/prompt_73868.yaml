prompt: |-
  I'm in a philosophy-of-economics seminar and this week is revealed preference plus the whole "what does utility actually mean" question, and I keep coming back to the New Coke disaster as a test case. Can you run the theory over it properly?

  Facts, in case yours are fuzzy: by the early 80s Coke was bleeding share to Pepsi, Pepsi had been winning those blind sip-tests in malls on sweetness, so Coke spent a couple years developing a sweeter formula that won its own blind sip-tests, launched it in April 1985 as a replacement rather than a second variety, got hammered — tens of thousands of angry calls and letters, people hoarding cases of the old stuff, organized protest groups — and put the original back as Coca-Cola Classic within about three months, after which sales jumped. One detail that matters for what I want: Coke's own focus groups had turned up something like 10–12% of testers who said they'd feel angry and alienated and might quit Coke entirely, and management basically discounted that soft data in favor of the hard sip-test numbers.

  So, first, the mapping. If choice is the only evidence we have about preference, and preference is all utility talk amounts to, then which choices here are the evidence — the mall sips, the focus groups, the boycotts and letter-writing, or the eventual stampede back to Classic? Say what the theory licenses you to conclude about what these people preferred and what was good for them, and where it goes quiet because there's no choice to read off. I specifically want to know what the theory does with the angry 10–12%, since they showed up as reported feelings and not as behavior, and what it does with the fact that a lot of people signed petitions against New Coke and then drank it anyway.

  Second, I have a proposal I want you to stress-test rather than just agree with. My thought is that the sip-test and the market weren't measuring the same object at all: a sip is a preference over the first few seconds of a drink, while buying a case is a preference over a whole drinking life plus whatever the brand means to you, and sweetness that wins at second one becomes cloying by can three. If that's right, New Coke isn't a counterexample to revealed preference, it's a counterexample to the assumption that revealed preferences port across contexts. Call it context-portability. Does that distinction actually hold up, or is it a rescue device — i.e. can you always re-describe a reversal as a different preference measured in a different situation, and if so is the theory unfalsifiable, and does it matter if it is? Also tell me whether the identity-and-brand version of the story (people weren't choosing a flavor, they were defending a thing they belonged to) is better handled by the standard revealed preference framework or by the sort of critique that says choice isn't only about getting what you want.

  Third, the verdict, both directions: which features of the episode does revealed preference genuinely explain, which does it misdescribe, and was this a case the theory ever anticipated? And was Coke management's own decision procedure — hard quantitative choices over soft reported attitudes — itself an application of the theory, or just bad marketing?

  Last thing, and it matters for my paper: be clear about which parts of all this are settled among people who work on it and which parts are genuinely contested, and don't hand me a contested position as if it were the consensus. Flag it when you're siding with one camp against another, and say if I've mis-stated any of the theory.
reasoning: |-
  Okay, the user is in a philosophy-of-economics seminar focusing on revealed preference and utility theory, using the New Coke case as a test. They want a thorough analysis. Let me start by recalling the New Coke facts. Coke reformulated to be sweeter based on blind sip-tests, but it failed when launched. People protested, and they brought back Classic. Key points: 10-12% in focus groups predicted anger, some protested but still drank New Coke, and the eventual return to Classic boosted sales.

  First, the user asks about mapping choices to preferences. Revealed preference theory (RPT) says choices reveal preferences. So, the mall sips are choices showing a preference for sweeter taste in that moment. The focus group responses are verbal, not choices, so RPT ignores them. The boycotts and letters are choices against New Coke, indicating preference for old Coke. The return to Classic and sales jump confirms that. But the 10-12% who reported anger but didn't act yet—RPT doesn't count that until they act. Those who protested but drank New Coke anyway? RPT sees the drinking as the real preference, overriding the protest. So actions speak louder than words here.

  Next, the user's proposal: sip-tests and market choices measure different things. Sip-test is immediate taste, buying a case involves long-term satisfaction and brand identity. RPT can handle this by saying different contexts reveal different preferences. But is this a rescue device? Yes, because RPT can always say context matters, making it unfalsifiable. But economists like Sen argue that people have meta-preferences; they might prefer Pepsi in sips but Coke overall due to brand loyalty. The identity aspect isn't handled well by RPT since it doesn't account for symbolic meaning beyond consumption.

  Then, the verdict. RPT explains the sip-tests and the market return to Classic. But it misses why the sip-test didn't predict market success and dismisses the 10-12% anger as irrelevant until acted upon. Coke management prioritized hard data (sip choices) over soft data (feelings), which aligns with RPT's focus on choices. But was that bad marketing? Yes, because they ignored context and identity.

  Contested areas: Whether preferences are context-dependent is accepted, but the degree to which RPT should incorporate non-choice data is debated. Also, if RPT is unfalsifiable is a criticism from behavioral economists. The identity part challenges RPT's individualistic approach, with some suggesting expanded frameworks.

  The user might need to show how RPT's limitations in real-world cases like New Coke highlight philosophical issues in economics. They might also want to explore how behavioral economics offers alternatives. Ensuring clarity on which parts are settled (context matters) vs. contested (handling identity, non-choice data) is crucial for their paper.
answer: |-
  Here's a breakdown of the New Coke case through the lens of revealed preference theory (RPT), addressing your specific queries, stressing your proposal, offering a verdict, and clearly flagging settled vs. contested ground:

  **1. Mapping Choices to Preferences: What RPT Says Happened**

  *   **The Mall Sip-Tests (Blind):**
      *   *Choice Observed:* Choosing Pepsi or New Coke over original Coke *in a single, anonymous sip*.
      *   *RPT Conclusion:* Reveals a preference for the sweeter taste *in that specific, momentary, sensory context*. It says nothing about preferences for sustained consumption, brand association, identity, or purchasing decisions. This is a preference over "immediate sensory impact."
      *   *Status:* Settled. RPT strictly ties preference revelation to the *actual choice situation*. This context is highly artificial and stripped of real-world meaning.

  *   **Focus Groups (Reported Feelings of 10-12%):**
      *   *Choice Observed?* **None.** Only verbal reports of hypothetical feelings ("I *would* be angry"). No actual choice behavior (e.g., refusing a sample, stating they *wouldn't* buy it).
      *   *RTP Conclusion:* **Reveals nothing about preference.** RPT considers verbal reports non-behavioral and therefore non-evidential for preference. Feelings are "soft data" outside the theory's scope. Management discounting this was, strictly within RPT logic, correct *if* they believed only choices mattered. The theory goes completely quiet here – it has no framework to incorporate this information as preference evidence.
      *   *Status:* **Contested.** While the core RPT *axiom* ignores non-choice data, this is a major criticism point. Behavioral economists, psychologists, and many philosophers argue this is a critical flaw, ignoring vital information about commitment, identity, and potential future choices. RPT proponents maintain this strict separation to avoid circularity and maintain objectivity.

  *   **Boycotts, Letters, Hoarding (Protest Phase):**
      *   *Choice Observed:* Choosing to expend time/energy writing letters, joining protests, hoarding old stock, potentially choosing *not* to purchase New Coke (though data here is messy).
      *   *RPT Conclusion:* Reveals a *strong negative preference* (disutility) associated with the *removal* of the original Coke formula and/or the *meaning* attached to the brand. This is a preference over "brand continuity," "tradition," or "identity." It directly contradicts the preference revealed in the sip-test for *this specific group* in *this specific context* (real-world consumption meaning).
      *   *Status:* Settled application. Actions speak louder than words (or sips) in RPT.

  *   **Drinking New Coke Despite Protesting (The Contradiction):**
      *   *Choice Observed:* Signing a petition (choice A: express opposition) *and* later purchasing/drinking New Coke (choice B: consume the product).
      *   *RPT Conclusion:* The *purchase/consumption* choice (B) is the definitive revelation of preference *at the moment of consumption*. The petition signing (A) reveals a preference *for expressing opposition in that context*, but not necessarily a preference *against consuming the product when it's the available option*. RPT resolves the "contradiction" by asserting that the choices occurred in different contexts with different available options and constraints (e.g., expressing opinion vs. quenching thirst). The revealed preference is *context-dependent*. The *stronger* preference revealed is for consuming the available cola (New Coke) over going without *at that moment*, even if they disliked the change.
      *   *Status:* **Contested Interpretation.** While RPT technically handles this via context, critics argue it highlights the theory's inability to handle commitment, self-control, or "meta-preferences" (preferences about preferences). Why express opposition if it doesn't reflect a consumption preference? RPT struggles with explaining why A happened *if* B is the "true" preference.

  *   **Stampede Back to Classic & Sales Jump:**
      *   *Choice Observed:* Mass purchasing of Coca-Cola Classic when it became available again.
      *   *RPT Conclusion:* Overwhelmingly reveals a preference for the original Coca-Cola formula *over* New Coke *in the real market context*. This is the clearest, most economically significant revelation of preference in the episode. It incorporates the full consumption experience, brand meaning, and identity aspects *as they manifested in actual purchasing behavior*.
      *   *Status:* Settled. This is the paradigmatic RPT case – market choices revealing aggregate preference.

  **2. Stress-Testing Your Proposal: Context-Portability**

  *   **Your Proposal:** "The sip-test and the market weren't measuring the same object... sweetness that wins at second one becomes cloying by can three... [It's] a counterexample to the assumption that revealed preferences port across contexts."
  *   **Does the Distinction Hold?** **Yes, robustly.** RPT itself demands this distinction. Choices reveal preferences *over the objects as defined in the specific choice context*. The "object" in the sip-test was "momentary sensory experience under blind conditions." The "object" in the market was "full can/bottle consumption experience + brand association + identity + availability." They are fundamentally different goods, even if chemically similar.
  *   **Is it a Rescue Device? Can You Always Redescribe?** **Yes, and this is a major criticism.** RPT *can* always attribute preference reversals to a change in context (options, constraints, information, framing). The theory itself is *designed* to be context-dependent. This raises the question:
  *   **Is RPT Unfalsifiable?** **In its minimal form (Samuelson), arguably yes, and this is a serious philosophical concern.** If any choice reversal can be explained *post hoc* by redefining the context or the good, the theory becomes tautological ("people choose what they prefer, and we know what they prefer because of what they choose"). However:
      *   *Settled Defense:* RPT proponents argue its value is *operational*. It provides a coherent framework for modeling demand based on *observed choices* without needing psychological assumptions. Its testability comes in demanding *consistency within a defined context* (e.g., if A chosen over B and B over C, then A should be chosen over C - the Weak Axiom of Revealed Preference). New Coke doesn't violate WARP *within* the sip-test context or *within* the final market context; it only shows inconsistency *across* contexts.
      *   **Contested:** Whether this operationalism is sufficient, or whether the ease of *post hoc* context redefinition renders the theory empirically vacuous for explaining *why* choices change, is hotly debated. Behavioral economics arose partly to address these "anomalies" by incorporating psychological insights about context effects.
  *   **Does it Matter if it's Unfalsifiable?** **Yes, profoundly.** If RPT is unfalsifiable in explaining preference *formation* or *change*, its explanatory power for real-world phenomena like New Coke is limited to *description* after the fact. It struggles with prediction when contexts change meaningfully.
  *   **Handling Identity/Brand (Choosing Belonging vs. Consuming Flavor):**
      *   *Standard RPT:* Can handle this **technically** by defining the good as "Coca-Cola (original formula + brand heritage + identity association)" vs. "New Coke (new formula + disruption of heritage)" vs. "Pepsi (competitor's formula + brand)". The choice *for* Classic reveals a preference for that full bundle. The protest behavior reveals the intensity of preference *for the heritage component*.
      *   *Limitation/Critique:* **Fundamental.** RPT treats the "identity bundle" as just another consumption good generating utility. It cannot explain *why* identity creates utility or *how* the meaning is constructed socially. Critics (e.g., Amartya Sen) argue choice isn't *only* about getting what you want (well-being); it can be about commitment, duty, self-image, or expressing values ("agency"). The outrage wasn't just about losing a preferred soda; it was about a violation of a shared cultural artifact. RPT struggles to capture this *non-instrumental* aspect of choice. This critique moves beyond RPT into broader philosophy of action and value theory.

  **3. The Verdict: What RPT Explains and Misdescribes**

  *   **Explains Well:**
      *   Why Pepsi won blind sip-tests (preference for sweetness in *that* context).
      *   Why Classic sales soared upon its return (clear revealed preference for the original bundle in the *market* context).
      *   Why the focus group *feelings* were discounted *if* management strictly adhered to a choice-only dogma (though this was likely bad marketing, not pure RPT).
      *   Why people might drink New Coke after protesting (different contexts: expression vs. consumption need).
  *   **Misdescribes or Fails to Adequately Explain:**
      *   **The *Intensity* and *Nature* of the Anger:** RPT sees protest as revealed dispreference, but cannot capture the *qualitative difference* of identity-based outrage vs. simple dislike of taste. The 10-12% warning was ignored because it wasn't "choice," but it signaled a powerful non-consumption value.
      *   **The Predictive Failure:** RPT *describes* why the sip-test wasn't predictive (different context/good) but doesn't provide a *generalizable framework* for anticipating when preferences will or won't port across contexts. It's descriptive, not predictive, of such failures.
      *   **The Role of Identity:** It reduces identity to a consumption attribute rather than recognizing it as a fundamentally different kind of value influencing choice.
      *   **Was it Anticipated?** The *specific* New Coke case? No. But the *general problem* of context-dependence and the potential for preference reversals across contexts was well-known in economic theory (e.g., Hicks, Samuelson discussed related issues). It's a classic illustration of a known theoretical pitfall in applying RPT naively.
  *   **Coke Management's Decision Procedure: RPT or Bad Marketing?**
      *   **Superficially RPT-aligned:** They prioritized "hard" behavioral data (sip-test *choices*) over "soft" attitudinal data (reported feelings). This mirrors RPT's focus.
      *   **Actually Bad Marketing:** It was a **misapplication** of the RPT *insight*. They failed to recognize the critical difference in *context* between a blind sip and real-world consumption (including brand meaning). They treated the sip-test choice as perfectly portable to the market context, violating the core RPT principle that preferences are revealed *in situ*. Good marketing understands context-portability is *not* guaranteed. They also foolishly ignored clear signals (the 10-12%) about a powerful *non-consumption* value (identity/heritage) attached to the brand, something RPT struggles with but market research shouldn't.

  **4. Settled vs. Contested - Crucial for Your Paper**

  *   **Settled (Broad Consensus Among RPT Theorists):**
      1.  Preference is defined operationally by choice.
      2.  Only choices reveal preferences; verbal reports or feelings do not (within strict RPT).
      3.  Preferences are revealed *relative to a specific choice context* (available options, constraints, information).
      4.  The Weak Axiom of Revealed Preference (consistency within a context) is a core requirement.
      5.  New Coke demonstrates that preferences revealed in one context (sip-test) do not necessarily port to a different context (market purchase).
  *   **Contested (Major Battlegrounds):**
      1.  **The Status of Non-Choice Data:** Is RPT fatally flawed by ignoring feelings, intentions, and stated preferences as *any* kind of evidence? (RPT Hardliners vs. Behavioralists/Psychologists/Many Philosophers)
      2.  **Tautology/Unfalsifiability:** Does the ease of *post hoc* context redefinition render RPT empirically vacuous for explaining preference change? (Critics like Sen, Behavioralists vs. RPT Defenders)
      3.  **Handling Identity/Social Meaning:** Can RPT adequately model choices driven by identity, commitment, or social norms by simply bundling them into the consumption good, or does this require a fundamentally different framework? (Standard RPT vs. Critics drawing on Sen, Sociology, Behavioral Econ).
      4.  **"Utility" Meaning:** Does RPT successfully avoid cardinal utility and psychological hedonism, or does its language inevitably smuggle them back in? (Ongoing philosophical debate).
      5.  **Predictive Power:** Is RPT primarily a useful *descriptive/ modeling* tool given its context-dependence, or can it be genuinely predictive? (Varies by application).

  **In Summary:** New Coke brilliantly illustrates the *core strength* of RPT (preferences are revealed in actual choices within context) and its *core limitations* (ignoring non-choice data, potential for *post hoc* explanation via context redefinition, struggle with non-instrumental values like identity). It exposed Coke management's failure to grasp the crucial lack of "context-portability" between a sip-test and the real market. While RPT explains the *market outcome* (preference for Classic revealed by choice), it fails to fully capture the *why* – the depth of the emotional, identity-based connection – that drove the backlash and necessitates a broader understanding of human action beyond choice alone. Your "context-portability" critique hits the nail on the head and is entirely coherent within, and critical of, the RPT framework.
