prompt: |-
  Retired seven years ago from a state school where I did comparative anatomy and alot of fieldwork on freshwater snails. Since then I've been reading philosophy in the evenings and I've hit a wall: on adaptation, everybody I pick up either assumes an answer or assumes the whole question is a rhetorical trick, and I still don't know what a good answer would even look like. So before I read another one, give me the spec.

  Write out the desiderata for any account of a claim of the form "trait T is an adaptation for doing F" — what such an account has to deliver before a careful biologist should sign the claim. For each requirement, give me the case or consideration that motivates it, not just a label. The ones I especially want worked through: what the account owes on origin versus maintenance, since a thing can start as a side effect of something else and later be kept because it pays, and the reverse also happens; how it handles traits that can't be varied independently of their neighbours because development and shared growth processes tie them together; what it says about a structure that's useful now but was never selected for, and one that was selected for something and is useful for nothing now; and what it owes me when two different stories fit the same comparative data equally well — is "no worse than the alternatives" enough, or does the account have to say which data would have come out differently? Then tell me which of these are non-negotiable, in the sense that dropping them makes the claim stop meaning anything, and which are just the house style of one camp. My hunch is that demanding a tight causal story about the origin is one of the latter, but I can't tell hunch from prejudice yet.

  Use my own case as the test bed. Thirty years on a little snail with a calcified ridge running along the inside of the last whorl. I told students it stiffened the shell against crayfish crushing. Then it turned out the ridge is laid down by a fold of mantle that also secretes the dark band on the outside, and one population has lost the ridge but kept the band and has, if anything, a thicker shell. I honestly dont know whether the ridge was ever for stiffening or whether it's just where that fold happens to sit. An adequate theory should be able to say something about my ridge other than that it's complicated.

  One thing I bring with me, which I want you to take seriously and then attack: I'm an experimentalist by training, so my instinct is a deletion test. Take the trait out, drop the organism back into the setting its ancestors actually lived in, run the lineage forward, and see if it holds on; whatever it fails to do without the trait is what the trait was for. Say whether that's a genuine desideratum any account should meet or just my lab-bench prejudice dressed up as a criterion — and note what it does to a byproduct structure, since deleting one of those usually wrecks the thing next to it, which looks suspiciously like the deletion test assigning functions to spandrels.

  Flag any pair of requirements you think can't both be satisfied. If some subset of the list is jointly impossible, name the subset and say which requirement I'd have to give up — that's the part I most want. And tell me which single requirement knocks out the most of the approaches people currently push. Keep the scorecard short, two or three sentences each on the main contenders, because the criteria are the deliverable and I'll do my own judging.

  Purpose, so you know what "adequate" means here: good enough that a non-specialist can write "this is for that" in print without lying to the reader. Not good enough to settle a metaphysics debate — I gave up on that ambition around page forty of the last one I tried.
reasoning: |-
  Hmm, the user is a retired biologist with extensive fieldwork experience on freshwater snails, now struggling with philosophical accounts of adaptation. They've hit a wall because existing literature either assumes answers or dismisses the question as rhetorical. They want a clear specification of what any account of "trait T is an adaptation for function F" must deliver before a biologist should accept it.

  Key concerns include:
  - How to handle traits that originated as side effects but were later maintained for utility (and vice versa)
  - Dealing with developmental constraints where traits can't be varied independently
  - Accounting for currently useful traits that were never selected for, and vestigial traits that were selected but are now useless
  - What to do when multiple evolutionary stories fit the same data equally well
  - Whether their instinctive "deletion test" approach is valid or just experimentalist bias

  The snail case is crucial: a calcified ridge initially thought to stiffen shells against crayfish, but later evidence shows it's developmentally linked to shell banding, with one population lacking the ridge but having thicker shells. The user needs an account that can meaningfully address such real-world complexities.

  Their purpose is practical: establishing criteria rigorous enough for scientific communication ("this is for that" in print) without getting bogged down in metaphysical debates.

  The core tension in adaptation accounts seems to be between historical origins and current maintenance. Strict historical accounts struggle with exaptations, while ahistorical accounts risk conflating current utility with evolutionary purpose. Developmental constraints further complicate matters by making "trait deletion" experimentally problematic.

  The deletion test they propose is insightful but flawed when applied to integrated systems - deleting a spandrel often damages its associated adaptation, creating false positives for function. This is precisely what happened in their snail case where ridge and banding are developmentally coupled.

  For the multiple-hypotheses problem, "not worse than alternatives" isn't sufficient - we need accounts to specify what evidence would discriminate between competing explanations. Otherwise, adaptation claims become unfalsifiable.

  Non-negotiables should include:
  - Requiring evidence of past selection (or current maintenance where history is inaccessible)
  - Accounting for developmental dependencies
  - Demanding testability through comparative predictions

  Negotiable elements include:
  - How far back we trace origins (paleo vs. recent selection)
  - Weight given to engineering optimality arguments

  These criteria would immediately challenge adaptationist just-so stories that ignore developmental constraints, as well as purely historical accounts that can't address maintained exaptations. Their snail case becomes resolvable by examining whether ridge variation correlates with predation pressure across populations, while controlling for shell thickness and banding presence.
answer: |-
  Here’s the spec for adaptation claims, distilled from evolutionary theory’s thorniest problems and calibrated against your snail case. Desiderata are ranked by negotiability, with non-negotiables first. Each includes a motivating case and implications for your ridge.

  ### Non-Negotiables (Drop these = claim is meaningless)
  1. **Selective History or Maintenance Requirement**  
     *Motivation*: A trait useful now but never selected for (e.g., human chin) isn’t an adaptation; one selected in the past but now useless (e.g., whale pelvis) *is*.  
     *Owed*: Evidence that natural selection **maintains** T *because of* F in current populations *or* historically shaped T *for* F.  
     *Snail Test*: If the ridge persists due to drift/linkage (not crushing resistance), it fails—even if it *could* stiffen shells. Your ridge-loss population is critical: if ridge absence doesn’t reduce fitness under crayfish predation, it’s not maintained for F.  

  2. **F-Specificity Requirement**  
     *Motivation*: Traits often serve multiple functions (e.g., bird feathers: insulation *then* flight). Calling T "for F" must specify *which* selective pressure explains T’s form.  
     *Owed*: Evidence that selection favored T *specifically* due to F, not just F being one of many effects.  
     *Snail Test*: If the ridge’s calcification is solely a byproduct of band-secretion mechanics, it’s not "for" stiffening—even if it incidentally helps.  

  3. **Developmental Constraint Transparency**  
     *Motivation*: Traits like your ridge-band complex can’t be decoupled; claiming T is "for F" must address whether T is a direct target or a correlated byproduct.  
     *Owed*: Acknowledgement of whether selection acted on T *directly* or via linked traits. If indirect, the claim must be rephrased (e.g., "mantle-fold morphology adapted for banding, with ridge as byproduct").  
     *Snail Test*: If ridge loss requires band loss, and bands are under selection, ridge persistence isn’t evidence for *its* function.  

  ### Negotiable (Camp-specific preferences)
  4. **Origin vs. Maintenance Emphasis**  
     *Motivation*: Bird feathers originated for thermoregulation, maintained for flight. Some camps require origin evidence; others accept current maintenance.  
     *Owed*: Either (a) phylogenetic evidence for initial selection *or* (b) experimental evidence of current maintenance.  
     *Snail Test*: If ridge originated as band byproduct but is *now* maintained by crushing resistance, some accept "adaptation for stiffening" (maintenance camp); others insist "exaptation" (origin camp).  

  5. **Independent Testability**  
     *Motivation*: When two stories fit comparative data (e.g., primate color vision: fruit detection *or* predator avoidance), "not worse" isn’t enough—untested assumptions risk just-so stories.  
     *Owed*: Predictions about what data *would falsify* the claim (e.g., "if ridge evolved without crayfish, claim is false").  
     *Snail Test*: A good account predicts ridge absence in low-predation environments *and* ridge-loss population fitness costs under crayfish.  

  6. **Deletion Test Utility**  
     *Motivation*: Your instinct. Deleting T tests *current* maintenance but misattributes byproducts (e.g., deleting a spandrel collapses the arch—falsely implying it was "for" support).  
     *Owed*: Deletion can support maintenance claims *if* developmental dependencies are controlled. Not a standalone criterion.  
     *Snail Test*: Deleting your ridge likely disrupts banding. If banding affects camouflage, crushing-resistance failure could be indirect. Correlate ridge variation with predation *without* disrupting development.  

  ### Conflicts & Dealbreakers
  - **Origin vs. Deletion Test Conflict**: Demanding origin evidence *and* deletion validity is impossible for exaptations (e.g., feathers: can’t "delete" and revert to pre-flight state). **Drop origin focus** if you prioritize experimental tests.  
  - **F-Specificity vs. Multi-Functionality**: Insisting T has *one* function ignores traits co-opted for new roles. **Require clear F-specific evidence**, not exclusivity.  
  - **Non-Negotiables vs. Just-So Stories**: Dropping **Selective History/Maintenance** allows "useful = adaptation" fallacy. Dropping **F-Specificity** permits vague "for survival" claims. Dropping **Developmental Transparency** ignores your ridge-band linkage.  

  ### Scorecard on Major Approaches
  - **Classical Adaptationism**: Fails developmental transparency (assumes independent optimizability); strong on deletion tests but mishandles spandrels.  
  - **Spandrel/Exaptation Framework**: Best on developmental constraints; weak on testability (hard to falsify "byproduct" claims).  
  - **Modern History-Neutral Accounts**: Accept maintenance as sufficient; good for empiricists but risks conflating current utility with historical function.  

  ### Verdict for Your Ridge
  An adequate account must:  
  1. Explain why the ridge persists *if not for stiffening* (linkage to banding?).  
  2. Test if crayfish predation *currently maintains* ridge thickness *beyond* banding requirements.  
  3. Predict ridges in high-predation lineages, not just banded ones.  
  Your deletion instinct is sound—but correlate natural variation in ridge prominence with predation pressure and fitness, controlling for banding. If ridge thickness varies independently and correlates with crushing survival, it’s likely an adaptation. If not, it’s a banding byproduct.  

  **The non-negotiable core**: Adaptation claims are *causal historical explanations*—they require evidence that selection *acted because of F*. Without this, you’re describing engineering, not evolution. Your frustration with philosophers stems from their tendency to debate the metaphysics of "function" while dodging the biologist’s burden: demonstrating selection’s signature.
