answer: |-
  1.  **Boorsean Naturalism:** For Boorse, a disease is statistically subnormal part-function relative to a reference class (age/sex), hindering survival/reproduction. Grief symptoms post-loss wouldn't be pathological *within* a "recently bereaved" reference class, as they are typical and often adaptive (e.g., seeking support). Widening the class to "all adults" makes the same symptoms subnormal, suggesting pathology. The "function" is species-typical part-function (e.g., mood regulation); harm derives from functional impairment reducing biological goals.

  2.  **Normativism:** Disease is inherently value-laden, defined by harm or undesirability judged against social norms. Grief becomes pathological when its intensity/duration is deemed harmful or deviant beyond cultural tolerances. There's no fixed "function"; harm is defined by social values (e.g., inability to work, profound suffering). The relevant subpopulation is less rigidly biological, potentially contextual.

  3.  **Reference-Class Crux:** Boorse faces the "shopping" problem. Fixing the class *only* by age/sex ignores relevant environmental contexts (like loss). Including context (e.g., "recently bereaved") renders grief non-pathological. Excluding context ("all adults") pathologizes normal reactions. Principled grounds for excluding significant environmental contexts like major loss from the reference class are unclear, risking normativism (valuing biological function over context).

  4.  **Mapping DSM Shifts:**
      *   **DSM-IV Exclusion:** Aligns with a Boorsean view using a contextually narrowed reference class (implicitly "recently bereaved") OR a normativist view valuing non-medicalization of normal grief.
      *   **DSM-5 Removal:** Aligns with Boorse using a broad reference class ("all adults") showing impairment OR normativism valuing treatment access for severe distress regardless of cause.
      *   **Prolonged Grief Disorder (PGD):** Aligns poorly with strict Boorse (statistical norms for "long-term bereaved" are undefined) but better with normativism defining harmful deviation *over time*. It's primarily a normativist construct based on duration-coded harm.

  5.  **Verdict:** The sequence is a significant anomaly for strict Boorsean naturalism due to the unresolvable reference-class problem contextualizing loss. It better confirms **normativism**, as the shifts reflect evolving value judgments about harm (avoiding over-medicalization vs. preventing undertreatment vs. defining chronic suffering) shaping diagnostic thresholds and class definitions. Naturalism struggles to anchor the class objectively here.
