  ## Vacancy Notice: Sentence Completion Operative (SC4)  
  **Posting Reference:** DOC/PSY-CONT/SC4-2027  
  **Location:** HMP Continuum, Wing B3 (Remote Sentence Serving Permitted Under Para 7.3b)  
  **Contract:** Fixed-Term, 4 Years (1461 Days +/- Leap Second Adjustments)  
  **Salary Band:** PSSC 1 (£1 per Annum, Non-Pensionable)  
  **Application Deadline:** 23:59 GMT, 31st April 2027  

  ### About the Role
  The Department of Corrections seeks a highly motivated individual to serve the outstanding custodial period (4 years) of an original sentence imposed for Aggravated Data Breach (2023). The incumbent offender’s current psychological connectedness and continuity (PCC) score relative to the temporal stage convicted (designated T-0) has fallen below the statutory responsibility threshold of 35 points (as per Corrections (Psychological Continuity) Regulations 2025, Schedule 2). Consequently, responsibility-bearing identity is no longer sustained. This role fulfils the societal imperative for sentence completion decoupled from strict numerical identity, ensuring justice manifests as a temporally extended process. You will assume the offender’s legal identity for the duration, discharging all sentence requirements.

  ### Essential Criteria
  1.  **PCC Score:** Must achieve a verified PCC score of **≥ 40 points** relative to the T-0 offender stage. Scoring is weighted: **Connectedness (C) 60%** (shared memories, character traits, values at T-0), **Continuity (Cont) 40%** (unbroken, cause-effect-linked psychological chains from T-0). Assessment via Departmental Psychometric Battery (DPB v.3.1).
  2.  **Legal Capacity:** Full capacity to understand and consent to assuming the offender’s legal identity and liabilities *only* for the sentence period (T-start to T-end).
  3.  **Temporal Availability:** Unbroken availability for the entire 4-year term. Significant life events (e.g., severe amnesia, profound religious conversion) causing PCC drop below 35 during service may trigger early review under Reg. 12(4).
  4.  **Branching Resolution Protocol:** Acknowledge acceptance of the Department’s **"Maximal Overlap" Tiebreak Procedure**: If multiple candidates score ≥40, the role is offered to the candidate demonstrating the greatest cumulative PCC overlap with the *specific temporal segments* constituting the original offence period (T-0 ± 3 months). The rejected candidate(s) may appeal only on grounds of computational error in DPB v.3.1 application (Form SC4-App-1).

  ### Desirable
  *   Existing PCC score marginally above 40 (e.g., 40-45), indicating sufficient but non-excessive overlap, reducing identity-claim friction post-service.
  *   Experience in roles requiring sustained persona adherence (e.g., acting, deep-cover operations, certain customer service positions).
  *   Understanding of perdurantist metaphysics (worm theory).

  ### Remuneration and Benefits
  *   **Salary:** £1 per annum, paid annually in arrears. Subject to standard deductions.
  *   **Accommodation & Sustenance:** Full board and lodging provided at HMP Continuum (or approved equivalent if serving remotely under Reg. 7.3b).
  *   **Non-Identity Benefits Package:** Access to prison library, basic healthcare, and vocational training schemes (identity accrues to the post-holder, not the T-0 offender). Pension not applicable.
  *   **Post-Service Support:** Mandatory 6-month Identity Re-alignment Counselling provided. **Note:** The Department cannot guarantee that the psychological profile emerging at T-end will constitute the same person (*qua* numerically identical continuant) who commenced service. Support focuses on successful re-integration of the resulting temporal stage, irrespective of strict identity preservation.

  ### Safeguarding
  *   **Waiver of Pre-Service Rights:** Successful applicants must sign a comprehensive waiver (Form SC4-WVR) acknowledging the suspension of their pre-existing legal identity and associated rights for the term. Rights resume upon satisfactory discharge, attaching to the emergent post-service stage.
  *   **Repentance Incompatibility Clause:** Candidates whose moral development since T-0 significantly elevates their character (e.g., genuine repentance) often score lower on *Connectedness (C)* to the T-0 offender's values/traits. **Such candidates are typically ineligible (score <40) and are, by the Department’s operational logic, simultaneously confirmed *not* to be the person who deserved the sentence.** This is an inherent feature of the PCC responsibility model.
  *   **Post-Service Anonymity:** A legal anonymisation order is standard post-discharge to mitigate identity confusion claims from non-departmental perspectives.

  ### How to Apply
  1.  Submit Form SC4-INT (Initial Notice of Temporal Suitability) via the Corrections Portal.
  2.  Eligible candidates will receive DPB v.3.1 login details. **This must be completed under supervised conditions at an approved test centre.**
  3.  Shortlisted candidates (score ≥40) undergo verification interview assessing comprehension of role implications and Tiebreak Protocol acceptance.
  4.  In branching scenarios (≥2 candidates ≥40), the Maximal Overlap Tiebreak is applied. The successful candidate is notified; others receive scores and Tiebreak calculation details with their appeal rights (computational error only).
  5.  Start date is fixed: 00:01 GMT, 15th May 2027.

  ---

  **The Ministry of Justice is an equal opportunity employer.** We value diversity in psychological composition and temporal extension. Applications are welcome from all suitably qualified space-time worms meeting the PCC criteria, irrespective of their current temporal stage’s gender, race, religion, or physical composition, provided they can fulfil the core custodial requirements. Reasonable adjustments to the testing environment will be made for candidates with verifiable continuity disruptions (e.g., documented amnesiac episodes), provided core criteria can still be met.

  ---

  **Metaphysical Commitments & Satirical Choices:**

  1.  **Chosen Reading: Perdurantism (Worm Theory).** The department treats persons as four-dimensional space-time worms. The sentence attaches to a specific temporal *part* (the offender-stage). Responsibility requires sufficient PCC to that specific part. Another worm segment (the applicant-stage) can substitute if its PCC to the offender-part is high enough.
  2.  **Why Sharper Satire:** Worm theory makes "branching" (e.g., fission) a natural, non-paradoxical eventuality within the ontology. This allows the bureaucratic "Tiebreak Protocol" to be utterly serious within the framework – selecting the candidate worm segment with the greatest overlap to the *offence-period segments* is a logical (if horrifying) way to "best match" the responsible part. It also cleanly handles the department's view: the candidate *isn't* the original offender, just a sufficiently overlapping stage *of a different worm* serving the time attached to the offender-stage. The end-of-service warning about not being the same person follows naturally: the candidate-worm extends beyond the sentence, but the stage emerging is distinct.
  3.  **Liberties/Contested Interpretations:**
      *   **Operationalizing PCC:** Assigning specific numeric weights (60/40) and a threshold (35) is a liberty. Reductionism provides the framework, not the specific metrics. This is core to the satire – bureaucracy demands quantifiable thresholds.
      *   **Rights & Identity:** The waiver of pre-service rights attaching to the *candidate-worm* and their resumption attaching to the *post-service stage* leans heavily on the stage theory ("exdurantist") concept of objects being instantaneous stages. The department inconsistently borrows this for practical legal handling within its perdurantist commitment. This inconsistency is "load-bearing" – it highlights the absurd difficulty of mapping metaphysics onto legal personhood.
      *   **"Repentance Incompatibility":** While reductionism allows responsibility to fade with loss of PCC, the *simultaneous* ineligibility and absolution is a satirical extrapolation of the logic pushed to an administrative conclusion. The department *formally* recognises the repentant applicant isn't the responsible person, but its *process* (requiring high PCC to the offender-stage) excludes them from serving the sentence *for* that person.
