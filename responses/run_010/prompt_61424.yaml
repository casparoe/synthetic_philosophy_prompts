  **Deathbed Promise Case**: You made a deathbed promise to destroy an unfinished manuscript. You recovered and feel nothing about it. Do you have a reason to destroy it?  
  - **A**: Yes.  
  - **B**: No.  
  - **C**: Only if you could be brought to care by hearing a good argument.  

  **If A**:  
  **Rational Bystander Case**: A fully informed, perfectly rational bystander sees a child drowning and has no motivation to save her. Does he have a reason to save her?  
  - **A**: Yes.  
  - **B**: No.  

  **If A at Bystander**:  
  **Ground of Reason**: Why does the bystander have a reason?  
  - **A**: Because of the child's need, independently of what would motivate any agent.  
  - **B**: Because a fully rational agent would be motivated to save her.  

  **If B at Bystander**:  
  **Sick Relative Weight Case**: Two people both have a reason to visit a sick relative. For one, this reason is decisive; for the other, it is not. Why?  
  - **A**: The reason has the same weight for both, but other factors make it decisive for only one.  
  - **B**: The reason might have different weights for each person.  

  **If B at Deathbed**:  
  **Actual Motivation Case**: Can an agent with no current motivation to do X have a reason to do X?  
  - **A**: Yes, if they were fully informed and rational.  
  - **B**: Yes, if they could be brought to care by a good argument.  
  - **C**: No.  

  **If C at Deathbed**:  
  **Unmoved by Argument Case**: In the deathbed case, you hear the best argument for destroying the manuscript but remain unmoved. Do you have a reason?  
  - **A**: Yes.  
  - **B**: No.  

  **For Everyone**:  
  **Unmoved Agent Case**: An agent has no motivation to do X (and never will). What is the status of "This agent has a reason to do X"?  
  - **A**: False.  
  - **B**: True, but it doesn't motivate them.  
  - **C**: Not truth-apt.  
  - **D**: True and motivating (so the claim must be false here).  

  **Belief-Motivation Connection Case**: If an agent believes they have a reason to do X, must this belief motivate them (even a little)?  
  - **A**: Yes.  
  - **B**: No.  

  **Explanation Constraint Case**: Must a reason be the kind of thing that could explain why someone does something?  
  - **A**: Yes.  
  - **B**: No.  

  **Unarguable Reason Case**: An agent could never be argued into acknowledging a reason to do X (only non-rational conversion would work). Does the reason exist?  
  - **A**: Yes.  
  - **B**: No.  

  ---

  **Leaves (Positions)**:  
  1. **Straight Externalism** (e.g., Scanlon, Nagel):  
     - Path: Deathbed A → Bystander A → Ground A → Unmoved B → Belief-Motivation B → Explanation B → Unarguable A.  
     - Embarrassing commitment: The unmoved bystander has a reason to save the child, but it may have no weight or power to move him.  

  2. **Idealized-Desire Internalism** (Smith):  
     - Path: Deathbed B → Actual Motivation A → Unmoved B → Belief-Motivation B → Explanation A → Sick Relative A (from Bystander B path) → Unarguable A.  
     - Embarrassing commitment: A rational agent must be motivated to save the drowning child even if they start with no desire to help.  

  3. **Williams-Style Internalism** (broad motivational set):  
     - Path: Deathbed C → Unmoved by Argument B → Unmoved A or D → Belief-Motivation B → Explanation A → Sick Relative B → Unarguable B.  
     - Embarrassing commitment: You have no reason to keep a deathbed promise if no argument could make you care.  

  4. **Actual Motivation Internalism** (strict):  
     - Path: Deathbed B → Actual Motivation C → Unmoved A or D → Belief-Motivation B → Explanation A → Sick Relative B → Unarguable B.  
     - Embarrassing commitment: If you feel nothing about a promise, you have no reason to keep it—even if you’d care after rational reflection.  

  5. **Exists-Only Hybrid**:  
     - Path: Deathbed B → Actual Motivation C → Unmoved A → Belief-Motivation B → Explanation A → Sick Relative A → Unarguable B.  
     - Embarrassing commitment: The reason to visit a sick relative has the same weight for everyone who has it, but some people have no such reason at all.  

  6. **Weight-Only Hybrid**:  
     - Path: Deathbed A → Bystander A → Ground A → Unmoved B → Belief-Motivation B → Explanation B → Sick Relative B → Unarguable A.  
     - Embarrassing commitment: The reason to save the child exists for the unmoved bystander, but it has no weight for him.  

  7. **Reasons as Evidence**:  
     - Path: Deathbed A → Bystander A → Ground A → Unmoved B → Belief-Motivation B → Explanation B → Sick Relative A → Unarguable A.  
     - Embarrassing commitment: The reason to destroy the manuscript is just evidence you ought to do it, regardless of your motivations.  

  8. **Error Theory / Nihilism**:  
     - Path: Unmoved A (plus any path where reason claims are consistently false).  
     - Embarrassing commitment: There is no reason to save a drowning child, even if you’re motivated to do it.  

  9. **Expressivism**:  
     - Path: Unmoved C.  
     - Embarrassing commitment: Saying "you have a reason" expresses an attitude, not a fact, so it can’t be true or false.  

  10. **Unoccupied View** (e.g., externalism with belief-motivation internalism):  
      - Path: Deathbed A → Bystander A → Ground A → Unmoved B → Belief-Motivation A → Explanation A → Sick Relative A → Unarguable A.  
      - Why empty: Unattractive—combines objective reasons with the claim that believing in them must motivate you, creating tension when agents are unmoved.  

  ---

  **Indistinguishable Pairs**:  
  - Williams-Style and Actual Motivation Internalism: Near-identical except when agents could be argued into caring (Deathbed C vs B). Both reject reasons for unmoved agents.  
  - Straight Externalism and Reasons as Evidence: Give identical verdicts but differ on grounding (child’s need vs evidence of ought).  

  **Empty Cells and Reasons**:  
  - **Unmoved B + Belief-Motivation A**: Coherent but unattractive—reasons exist independently but believing in them must motivate, risking inconsistency.  
  - **Unmoved D + Belief-Motivation B**: Incoherent—claiming reasons must motivate (D) but denying belief motivates (B) is contradictory.  
  - **Unmoved C + Belief-Motivation A**: Unoccupied—expressivists reject truth-aptness, so belief-motivation internalism doesn’t apply.  

