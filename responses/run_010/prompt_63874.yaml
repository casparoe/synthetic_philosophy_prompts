  ### (d) Self-Refutation Charge and Its Purchase

  - **Nāgārjuna's Reply**: The charge ("if all is empty, your claim is empty and thus untrue") is countered by distinguishing two truths: emptiness is conventionally true (it functions) but not ultimately true (it has no intrinsic nature).  
  - **Rule 2's Exposure**: **Minimal exposure**. Her denial of all corners for Q1 precludes asserting emptiness as "true," and her non-affirming negation "leaves nothing behind," so there's no view to refute. The charge gains no purchase, as it mistakes a conventional tool for an ultimate claim.  
  - **Other Rules**:  
    - **Rule 1**: Escapes the charge (conventional functionality emphasized).  
    - **Rule 3**: Escapes (conventional deflationary truth).  
    - **Rule 4**: Vulnerable if the "raft" metaphor is seen as a positive claim, but she would deny this (diagnosing the charge as malformed).  
  - **Purchase on Escapees**: The charge only bites if emptiness is asserted as an intrinsic truth. All rules avoid this per her record (e.g., "emptiness is empty"), so the charge is inert.

  ### (e) Separating Question for Surviving Rules

  **Proposed Question**:  
  *In a debate, if a student asserts, "Conventionally, the person is identical to the aggregates," and provides ordinary evidence (e.g., psychological reductionism), does the professor refute this? If so, how?*

  **What Each Rule Predicts**:  
  - **Rule 1 (Topic-Sensitivity)**: Refutes it. "The person-aggregates relation is a topic where 'identity' must be denied because it implies intrinsic nature. Conventionally, identity is incoherent (as per fire-and-fuel), so I deny this corner."  
    - *Divergence*: Asserts conventional incoherence of identity, unlike Rule 2.  
  - **Rule 2 (Pragmatic Refutation)**: **Does not refute it.** "This is a conventional assertion with no reification of ultimates. I only refute assertions that imply intrinsic nature; here, there's nothing to refute."  
    - *Divergence*: Only Rule 2 permits conventional assertions without refutation.  
  - **Rule 3 (Two-Tiered Conventionalism)**: Refutes it. "Conventionally, 'identity' depends on context. In this context (Buddhist conventional truth), persons are dependently arisen, not identical—so I deny identity as a false conventional claim."  
    - *Divergence*: Appeals to context-specific conventions, unlike Rule 4.  
  - **Rule 4 (Dialectical Scaffolding)**: Refutes it. "Identity is a corner to be negated to prevent reification. The assertion is a raft to discard; I deny it to advance understanding."  
    - *Divergence*: Treats all corners as uniformly negatable, ignoring conventional content.  

  **Why This Separates Rules**:  
  - Rules 1, 3, and 4 all refute the assertion, but for different reasons (topic-sensitivity, conventional context, or scaffold-negation). Rule 2 uniquely allows the assertion to stand, as it poses no ultimate reification. This isolates Rule 2's core: refutation is purely pragmatic, not logical.
