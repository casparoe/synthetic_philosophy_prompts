prompt: |-
  Six months ago I started volunteering for a small nonprofit that rates viral claims as true or false. We get maybe forty claims a week, each one goes to a panel of seven volunteers who vote independently, and the majority becomes our public rating. An outside reviewer recently checked a sample of our past ratings against primary sources, so for the first time we have real per-person accuracy numbers, and they're not flattering. Not one of the seven is above 62% on their own. Two of them are actually below 50%, and reliably so, in the sense that they're wrong in a consistent direction: roughly speaking, one subgroup calls anything sourced from an institution true, the other calls anything that sounds like an official line false. But the panel's majority vote lands at 84% — way better than any single member, and better than our best person working alone would have been.

  Here's the part I have no word for. Last month we ran a short calibration training for the two institution-trusting raters, and it worked: their individual accuracy went from 47% and 49% up to 58% and 61%. And the panel's majority accuracy dropped, from 84% to something like 76%. I rebuilt the spreadsheet twice because I assumed I'd screwed something up, but it holds. With those two now leaning the same way as three of the others on borderline claims, the majority has started agreeing with itself in one direction, and the claims we used to catch by having people cancel each other out now sail through. So we have a commitee that's more accurate than any of its members, for a reason that gets destroyed when you make the members better. Our coordinator's instinct is obviously to train everybody, and I want to explain why that backfired here without sounding like I'm saying "please keep them bad."

  I know the Condorcet jury theorem is the neighborhood, but the version I learned needs each voter to be individually better than a coin flip and to err independently, and we have neither — a big chunk of our accuracy comes from the fact that people are wrong in mirror-image directions. It also doesn't feel like the usual wisdom-of-crowds talk, where the point is that lots of independent guesses average out noise, because what's doing the work for us isn't noise at all, it's two stable biases pointed at each other. So: is there an established concept for collective accuracy that depends on the parts being wrong in offsetting ways, such that improving one part makes the whole worse? I'd want to know what the nearest concepts are and exactly where each one stops fitting, and how this differs from ordinary error-cancelling in measurement, where you basically assume the deviations are random rather than two deliberate-looking leanings. And if nothing names it precisely, what would you call it, and where are the edges — at what point does offsetting bias stop being a mechanism you can count on and start being a coincidence you got lucky with?
reasoning: |-
  Okay, the user is part of a nonprofit that rates viral claims. They have a panel of seven volunteers who vote independently, with the majority vote determining the rating. The individual accuracies are low—none above 62%, and two below 50% with consistent biases. One subgroup trusts institutions too much, the other distrusts official lines. Despite this, the panel's majority achieves 84% accuracy. After training the two institution-trusting raters, their individual accuracy improved (58% and 61%), but the panel's accuracy dropped to 76%. The user wants to understand why improving individual performance hurt the group's outcome and needs concepts to explain this phenomenon.

  First, I recall the Condorcet jury theorem. It states that with independent voters each better than 50%, majority accuracy increases with group size. But here, two members are below 50% initially, and their errors aren't independent; they're systematic and opposing. The theorem doesn't apply because of dependence and the presence of biased voters.

  The key is the offsetting biases. The two biased members cancel each other out on borderline claims. When one's bias leads to a false positive, the other's bias causes a false negative, balancing each other. Training reduced their biases but made them align with the majority, reducing diversity. Now, borderline claims that were correctly decided due to bias cancellation are now incorrectly rated because the majority leans one way.

  This is similar to the concept of cognitive diversity. The panel's strength came from differing perspectives compensating for each other. Training homogenized their thinking, reducing this diversity. The user needs to convey that improving individual accuracy without addressing bias direction undermined the error-cancellation mechanism.

  The Wisdom of Crowds usually relies on independent, unbiased errors averaging out. Here, the biases are systematic and opposing, not random. This structured cancellation is different from random error reduction. The user should highlight that their accuracy depended on deliberate, opposing biases, not noise reduction.

  Another angle is ensemble methods in machine learning, like Random Forests, which use diverse weak learners. If learners become too similar, performance drops. The panel acted like an ensemble where diversity was crucial. Training made the models correlated, reducing effectiveness.

  The user's challenge is explaining why training backfired without sounding like they want to keep volunteers unskilled. They should focus on preserving cognitive diversity. Suggestions include training to recognize bias without eliminating useful dissent or restructuring groups to maintain opposing viewpoints.

  The edges of this mechanism depend on how biases interact. If biases are perfectly opposed and cover the types of errors, cancellation works. But if biases align or don't cover all errors, the effect weakens. Reliance on this is precarious; changes in bias or claim types can disrupt it.

  In summary, the core concept is error cancellation through systematic, offsetting biases. Training disrupted this balance. The user should propose solutions that enhance accuracy while maintaining or restructuring diversity, rather than homogenizing the panel.
answer: |-
  This is a fascinating and counterintuitive scenario! You've perfectly identified the core mechanism: **systematic, offsetting biases** creating collective accuracy, which gets *destroyed* by making individuals less biased (or more accurate *by reducing their specific bias*). While no single term perfectly captures every nuance, here's a breakdown of the concepts and how they fit (or don't):

  1.  **The Core Mechanism: Error Cancellation via Systematic, Opposing Biases**
      *   **What it is:** This is the heart of your phenomenon. You have two groups with stable, predictable, and *diametrically opposed* biases regarding a specific heuristic (trust in institutions/official lines).
      *   **How it works on borderline claims:** For a claim where the truth is ambiguous or requires deeper analysis:
          *   Bias A (Institution-Trusting) reliably votes TRUE (even if false).
          *   Bias B (Institution-Distrusting) reliably votes FALSE (even if true).
          *   **Result:** These two biases *cancel each other out* on this specific type of claim. The correct outcome then depends on the votes of the *other five* less-biased (or differently biased) raters. Their collective judgment (often requiring only 3 of 5) is likely better than random, leading the panel to the correct majority vote.
      *   **Why it's not Condorcet:** You nailed it. Condorcet requires:
          *   Competence > 50% (you have members <50%).
          *   Independence (your raters' errors are *not* independent; they are *highly dependent* on the claim's characteristics triggering their specific bias).
          *   Homogeneity (all voters same competence, which isn't true here). Condorcet explains why groups of *independently competent* people are good. It doesn't explain why groups with *systematically incompetent but oppositely biased* people can be good *on specific tasks*.
      *   **Why it's not Standard Wisdom of Crowds (Averaging Noise):**
          *   Standard WoC: Assumes lots of *independent* guesses with *random* errors centered around the truth. Averaging cancels the random noise.
          *   Your Case: Errors are **systematic** and **non-random**. They are predictable deviations based on specific triggers. The "wisdom" comes from the *structured opposition* of these systematic errors, not the averaging of random noise. It's cancellation of *signal* (the bias signal), not noise.

  2.  **Established Concepts (and Where They Stop Fitting):**
      *   **Cognitive Diversity:** This is highly relevant. Your panel *had* high cognitive diversity regarding trust in institutions. This diversity was functional *because* the biases were opposed. Making the Institution-Trusters less biased *reduced* this specific dimension of cognitive diversity. Their votes became more aligned with the existing majority on borderline institutional claims, reducing dissent and losing the cancellation effect.
          *   *Edge:* Cognitive diversity is broad. Not all diversity is beneficial. Diversity *in the wrong direction* or *unstructured* diversity can harm. The *opposing* nature was crucial here.
      *   **Ensemble Learning / Model Diversity (ML Concepts):** This fits remarkably well. Think of your raters as weak classifiers in an ensemble (like Random Forest or Boosting).
          *   Key Principle: The power of an ensemble comes from the *diversity* and *independence* of its base learners. If base learners are very similar (highly correlated), the ensemble performs little better than a single learner. If they make different errors (uncorrelated errors), they can cover each other's weaknesses.
          *   **Your Panel as an Ensemble:** Your two biased raters were weak classifiers with high error rates *but* highly *negatively correlated* errors *on institutional claims*. When combined with the others, this negative correlation was powerful. Training them reduced their error rate *but increased the correlation* of their votes with the existing majority on borderline claims. The ensemble became less diverse, leading to worse performance *on those critical borderline cases* despite individual improvements.
          *   *Edge:* ML focuses on uncorrelated *errors*. Your case involves *systematic* biases causing *negatively correlated* errors on a specific subset of claims. It's a specific, powerful subtype of model diversity.
      *   **The Law of Large Numbers (with a twist):** LLN says averages converge to the expected value with more samples. Your "expected value" per rater was low. The magic wasn't simple averaging; it was the *structured interaction* of the biases allowing the *median* voter (or the pivotal voter needed for majority) to be more accurate than the mean accuracy. The biases pulled the distribution apart, making the center more accurate.
          *   *Edge:* LLN typically assumes independence and identically distributed (IID) samples. Your raters are not IID; their errors depend heavily on claim type and their bias.

  3.  **What to Call It (If No Perfect Term Exists):**
      *   **Error Cancellation via Opposing Systematic Biases:** This is descriptive and accurate.
      *   **Functional Bias Opposition:** Highlights that the opposition itself had a beneficial role.
      *   **Accuracy through Countervailing Biases:** Emphasizes the opposing forces.
      *   **Diversity-Induced Error Cancellation:** Links it to the cognitive diversity literature.
      *   **The Paradox of Opposing Incompetence:** Catches the counterintuitive nature.

  4.  **How This Differs from Measurement Error Cancellation:**
      *   **Measurement:** Assumes random, independent errors centered on zero. Averaging reduces variance. The errors lack intention or specific direction tied to content.
      *   **Your Case:** Errors are **systematic, content-driven, and intentional** (based on stable heuristics). They are *not* centered on zero; each biased rater has a consistent directional error. Cancellation works *because* the directions are perfectly opposed *for the specific triggering context* (institutional claims), not because errors are random.

  5.  **The Edges: When Does Reliance on This Become Precarious?**
      This mechanism is powerful but fragile. It stops being reliable when:
      *   **Biases Shift or Align:** If the Institution-Distrusters moderate *or* the Institution-Trusters become distrustful (or vice-versa), the opposition weakens or disappears. Your training unintentionally caused a partial alignment.
      *   **Nature of Claims Changes:** If claims stop triggering the opposing biases (e.g., fewer claims involving institutions, or claims where *both* biases would err the same way), the cancellation stops working.
      *   **Non-Covered Errors:** The mechanism only cancels errors *on the specific dimension where biases oppose*. Errors due to other reasons (laziness, misunderstanding facts, different biases) aren't canceled and can dominate if the opposing-bias claims decrease.
      *   **Threshold Effects:** The benefit relies on the biased raters being pivotal on borderline claims. If the other raters become much better/worse, or the majority threshold changes, the mechanism weakens.
      *   **It's a Coincidence When:** It relies on a specific, stable configuration of biases *and* a claim mix that consistently presents cases where those biases are triggered *and* oppose each other *and* the other raters can break the tie correctly. If this configuration wasn't deliberately designed but emerged by chance, it *was* luck. Maintaining it deliberately is possible but requires understanding the specific biases and claim dynamics. Relying on it evolving naturally again is risky.

  **Talking to Your Coordinator: Framing the Solution**

  Don't say "keep them bad." Say:

  1.  **Acknowledge the Paradox:** "Our panel's high accuracy came from an unexpected source: the *opposing biases* of Raters A and B actually canceled each other out on borderline institutional claims, allowing the more moderate raters to tip the balance correctly. It was like having built-in error correction for a specific type of mistake."
  2.  **Explain the Training Effect:** "The training successfully reduced Rater A and B's specific institutional bias, which improved their individual accuracy. *However*, it also unintentionally reduced the *diversity of perspectives* on institutional claims. Now, on those same borderline cases, Raters A and B are more likely to agree with the existing majority leaning. This means we've lost the 'cancellation effect' that previously caught errors, and the majority now sometimes sails through incorrect votes on claims where we relied on that opposition."
  3.  **Focus on Diversity & Balance:** "Improving individual accuracy is crucial, but we need to do it in a way that *preserves or enhances beneficial cognitive diversity*. The goal isn't to make everyone think alike, but to make everyone *better at recognizing their own biases and valuing different perspectives*."
  4.  **Propose Solutions:**
      *   **Train *All* Raters on Bias Recognition:** Explicitly teach raters about *different* common biases (confirmation, authority distrust/trust, negativity bias, etc.) and how to spot them in themselves and others. Make bias awareness core.
      *   **Calibration on Different Biases:** Don't just train the low performers. Run calibration sessions designed to surface and challenge *all* raters' potential biases using claims known to trigger different types.
      *   **Structured Dissent:** Implement techniques like "devil's advocate" or "red teaming" where raters are *assigned* to argue against the initial majority or their own instinct.
      *   **Reevaluate Group Composition:** Consider if adding a rater with a *different* opposing perspective (e.g., someone skeptical in a *different* way than the existing distrusters) could restore beneficial diversity. Maybe rotate raters on certain claim types.
      *   **Track Performance by Claim Type:** Monitor if the drop is *specifically* on claims involving institutions vs. other types. This confirms the hypothesis.

  **In essence:** Your panel wasn't just seven independent minds; it was a *system* where the specific *interaction* of systematic, opposing errors created emergent accuracy. Improving the parts changed the system dynamics. The solution isn't to avoid improvement, but to improve while consciously designing and managing the cognitive diversity that made the system work. It's about making the individuals *better thinkers*, not just *less biased in one specific way*, and preserving the structural benefits of differing viewpoints.
