  Okay, the user works in payroll at a haulage firm outside Leeds and has been deeply researching famines for about a year, sparked by their nan's experience in the Bengal famine of 1943. They've read about various famines across history and encountered conflicting theories but don't want to pick sides yet. Instead, they want a clear set of criteria that any famine theory must meet to be considered a valid explanation. 

  First, I need to unpack their request. They're asking for a "spec" – essentially a framework to evaluate theories. They've already identified several key elements they want included: handling diverse cases without special pleading, explaining near-misses, the food availability vs. entitlement debate, triggers vs. causes, famine vs. chronic hunger, causation vs. neglect, and how famines end. They also emphasize two pub-debate points: real-time usability for frontline workers and assigning responsibility in complex systems without clear villains.

  The user is clearly frustrated with oversimplified slogans ("always politics!" vs. "just bad harvests!") and wants analytical tools. Their payroll background suggests they value practical, structured thinking – no academic jargon, just functional requirements. The emotional weight comes from their nan's trauma; this isn't abstract for them. They’ve done impressive homework (Sen, historical cases) but distrust "bare lists" and partisan framing. 

  Now, structuring the response. The spec needs 10 core requirements, each with a concrete case/worry behind it. Must include their stated concerns but rigorously justify why each belongs. For example: 
  - "No special pleading" is essential because theories often cherry-pick (e.g., Bengal famine blamed solely on weather by colonial apologists vs. solely on Churchill by critics). 
  - "Near-misses" matter for predictive power (e.g., why some Indian districts avoided famine in 1876-78 despite drought). 
  - The food availability/entitlement distinction must be tested against messy reality (Bengal had food stocks but distribution collapsed). 

  Their two pub arguments are crucial: 
  1) Real-time usability: If a theory can't help a district officer *prevent* famine, it’s inadequate (e.g., entitlement theory requires data too complex for crisis decisions). 
  2) Diffuse responsibility: How a theory handles "paperclip maximizer" scenarios (e.g., 1840s Ireland’s exports continuing amid starvation due to market incentives no single actor controlled). 

  The tension between real-time action (needing simple, visible indicators) and assigning responsibility (requiring systemic analysis) is real and probably irreconcilable – should flag this as the "spec’s limit." 

  For evaluating existing theories: 
  - "Always politics" fails near-misses (can’t explain why some democracies have crop failures without famine). 
  - "Just harvests" fails Bengal ’43 (food was available). 
  - Entitlement theory struggles with real-time use (data gaps) and chronic hunger (designed for acute crises). 

  Will avoid citations per their request but anchor all points in historical examples they’ve mentioned. Tone must respect their expertise – they’ve done the reading, just want synthesis stripped of academia’s "tribal markings."
answer: |-
  Below is the "spec" for any credible famine theory, structured as requirements with the historical cases or logical worries driving each. I've included your specific concerns and flagged tensions where they exist. Requirements are ranked by how many existing theories they disqualify, with non-negotiables marked **(N)**.

  ---

  ### **Core Requirements for a Famine Theory**  
  *(Non-negotiables in bold)*  

  1. **Handle Diverse Cases Without Special Pleading (N)**  
     *Why*: A theory blaming "colonial policy" for Bengal 1943 must also explain non-colonial famines (e.g., USSR 1932–33). If it dismisses Ethiopia 1984–85 as "weather + communism," but weather alone didn’t cause famine in similar agro-climatic zones (e.g., Kenya 1984), it fails.  
     *Worry*: Theories tailored to one famine become propaganda.  

  2. **Explain Near-Misses, Not Just Disasters (N)**  
     *Why*: In the 1943 Bengal famine, some districts (e.g., Midnapore) had similar food deficits but lower mortality due to better kinship networks. The 1974 Bangladesh famine hit Rangpur hardest despite Dhaka having comparable entitlements. A theory must clarify why *this* village starved while *that* one didn’t.  
     *Worry*: Post-hoc narratives ignore prevention. If your theory can’t identify at-risk regions *before* collapse, it’s useless for policy.  

  3. **Resolve the "Food Availability Decline (FAD) vs. Entitlement Failure" Tension**  
     *Why*: Bengal 1943 had ample rice stocks (entitlement failure), but Ireland 1845–49 saw potato blight *and* grain exports (both FAD *and* entitlement failure). A theory must show how these interact: e.g., FAD triggers hoarding → prices spike → entitlement collapse.  
     *Worry*: Purely political theories ignore genuine ecological shocks (e.g., Ethiopia 1984 droughts). Purely ecological theories ignore man-made distribution failures (e.g., Bengal).  

  4. **Distinguish Triggers from Structural Causes**  
     *Why*: The 1845 potato blight (trigger) exposed Ireland’s land-tenure system and colonial export policies (structural causes). A theory must show how triggers interact with vulnerabilities.  
     *Worry*: Focusing only on triggers (e.g., "drought caused it") ignores why some societies withstand shocks.  

  5. **Differentiate Famine from Chronic Hunger**  
     *Why*: Famines kill abruptly via infectious diseases (e.g., cholera in Bengal camps), not just starvation. Chronic hunger kills via long-term malnutrition. A theory must explain the *speed* and *social rupture* of famine (e.g., asset liquidation, family abandonment).  
     *Worry*: Conflating the two leads to misallocated aid (e.g., treating famine as a food deficit when sanitation is critical).  

  6. **Clarify Agency: Intentional Acts vs. Systemic Neglect**  
     *Why*: The Great Leap Forward (1958–62) involved forced grain requisitions (intentional). In Bengal, Churchill’s war cabinet ignored warnings (neglect). A theory must account for both active malice and passive failure.  
     *Worry*: Overemphasizing intent absolves systems; overemphasizing systems absolves individuals.  

  7. **Explain How Famines End**  
     *Why*: Bengal’s famine ended via military rice imports and monsoon revival (1944). Ireland’s via mass emigration and shifted British policy. A theory must identify exit pathways: market adjustments? Aid? Regime change?  
     *Worry*: Ignoring recovery perpetuates the myth that famines "burn out."  

  8. **Be Actionable in Real Time by Frontline Workers (N)**  
     *Why*: A district officer in Bihar (1966–67) averted famine using price data and work schemes. If your theory requires historical GDP stats or "entitlement maps," it’s useless. Must work with visible indicators: price spikes, labor migration, asset sales.  
     *Worry*: Academic theories often fail here (e.g., Sen’s entitlement approach needs data unavailable mid-crisis).  

  9. **Assign Responsibility in Diffuse Systems (Your Pub Argument #1)**  
     *Why*: In Ireland, deaths stemmed from railway networks moving export grain, Treasury rules blocking aid, and local merchants hoarding—no "villain." A theory must trace responsibility through institutions, incentives, and cumulative choices.  
     *Worry*: Theories demanding a Hitler-like figure excuse bureaucratic complicity.  

  10. **Acknowledge the Trade-off Between Real-Time Use and Responsibility (N)**  
      *Why*: **This is the core tension.** Real-time action (Requirement 8) needs simple proxies (e.g., grain prices). But assigning responsibility (Requirement 9) requires complex institutional analysis. A theory *must* admit this trade-off or split into two frameworks: one for prevention, one for accountability.  
      *Worry*: No theory does both well. Prioritizing one undermines the other.  

  ---

  ### **Which Requirements Knock Out Theories?**  
  - **#1 (No Special Pleading)** disqualifies:  
    - Hardline "always crime" views (can’t explain non-political famines like volcanic "Year Without a Summer" 1816).  
    - "Always weather" views (can’t explain Bengal).  
  - **#2 (Near-Misses)** disqualifies:  
    - Monocausal theories (e.g., "famines end democracies" fails—India 1965–67 had drought but no famine).  
  - **#10 (Real-Time vs. Responsibility Trade-off)** disqualifies:  
    - Overly complex entitlement theories (fails Requirement 8).  
    - Overly simplistic "weather + war" models (fails Requirement 9).  

  ---

  ### **How Existing Theories Fare Against the Spec**  
  - **"It’s Always Politics" View**:  
    - *Fails*: Requirement 1 (ignores ecological triggers), Requirement 3 (dismisses FAD), Requirement 8 (no real-time levers beyond "overthrow govt").  
  - **"Harvests Fail" View**:  
    - *Fails*: Requirement 2 (can’t explain near-misses), Requirement 3 (ignores entitlements), Requirement 6 (no agency).  
  - **Entitlement View (Sen)**:  
    - *Strengths*: Requirement 3, Requirement 9.  
    - *Fails*: Requirement 8 (unactionable mid-crisis), Requirement 4 (underplays triggers), Requirement 7 (vague on recovery).  

  ---

  ### **The Unavoidable Conclusion**  
  Your "horrible feeling" is correct: **Requirement 8 (real-time use) and Requirement 9 (diffuse responsibility) are fundamentally at odds**. A theory optimized for prevention (simple, data-light) will obscure accountability. A theory focused on justice (complex, structural) will be too slow for emergencies. The "spec" itself reveals that *no single theory can fully explain famines*—you need complementary models: one for firefighters, one for judges. Your pub arguments are the fault line.
