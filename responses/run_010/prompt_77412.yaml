  - B_act (net benefit of publishing): 
     - Benefits: Transparency, correcting the record, improving future interventions.
     - Costs: Angering donors, damaging relationships with partners and government, possible loss of funding.
     - We'll say our committee estimates: slightly positive (SP=1) because the benefits are important but the costs are high.
  - B_inact (net benefit of not publishing): 
     - Benefits: Avoid short-term costs (donor relations, partner relations).
     - Costs: Perpetuating an ineffective intervention, wasting resources, moral cost of hiding truth.
     - We might estimate B_inact as slightly negative (SN=-1) because the long-term costs are significant but not immediate.
