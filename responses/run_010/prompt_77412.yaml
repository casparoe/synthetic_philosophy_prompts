prompt: |-
  I'm the head of evidence and data at a mid-sized international NGO — about 200 staff, we work in four countries and we're one of roughly twenty orgs in a loose consortium that overlap heavily in the same districts. Two or three times a month I have to make the same shape of decision: do we do X now, on our own authority, when the rest of the sector either hasn't agreed or simply can't move as fast as we can? X is usually one of three things — publishing something (a dataset, an evaluation, a security incident report), fielding something new (a method or a distribution channel that isn't in national guidelines yet), or handing something over to a government body. I chair a four-person committee that decides these, we get about 45 minutes per case, nobody on it has formal training in statistics or economics (I have a public policy degree), and anything with a big enough reputational hit has to go to the board's ethics subcommittee, which meets quarterly, so "escalate it" is usually not a real option. Right now we decide by vibes and whoever argues hardest.

  The thing I keep coming back to is the unilateralist's curse. As I understand it: if a bunch of parties each form a noisy estimate of whether some initiative is net good, and the initiative goes ahead whenever *any one* of them judges it positive, then the set of initiatives that actually get done is skewed toward the cases where the most optimistic estimate was simply wrong. So the remedy isn't a blanket don't, it's demanding a bigger margin than your own honest assessment says you need, where the size of the margin depends on how many other parties were in a position to form a judgment and on how noisy everyone's judgments are. I believe the original write-up ends by proposing something called a principle of conformity and sketching a few models for implementing it, but that's pitched at whole communities and norm-setting, and I need something one comittee can actually run on a Tuesday afternoon. If any part of my summary above is wrong or overstated, say so before you build on it.

  So: please write the decision procedure. I want the questions in the order we should ask them, what counts as a sufficient answer to each, the points where the procedure just stops at "no," and the points where it hands the call to a named human because the remaining question is about values rather than facts. It has to be usable when we can't get numbers — tell me what to do instead of a count of how many other parties could have judged, and whether our internal log (we've been recording a confidence rating on roughly the last 40 of these decisions and I can go back and score them against how they turned out) can stand in for the error term. I also want you to deal with three wrinkles honestly. One: our estimates are *not* independent of our peers', because we all read the same grey literature, hire from the same talent pool and sit in the same coordination meetings — does that shared background shrink the correction, or is shared bias exactly the reason to be more scared? Two: our field director's standing objection is that the curse can't apply to us because we're not racing anybody, we're just the only org with the capacity to act in the window — I want the procedure to address that objection head on rather than dodge it, since I suspect he's half right. Three: "wait and see" isn't a neutral baseline in our line of work, so the procedure needs a way of deciding when inaction is itself the unilateral move that needs the margin applied to it. Then run it on three real-shaped cases: (a) we're about to publish a pre-registered evaluation showing that a very popular donor-funded intervention that we and six other consortium orgs deliver has essentially no effect on the outcome everyone claims for it, two peers have weaker internal data pointing the same way and have sat on it for years, and three partner country directors have asked us privately not to publish; (b) cholera season is six weeks out in a district where we're the only org with a cold chain and community health workers, and there's a promising water-treatment approach that won't clear the national guideline process for about five months, so nobody else can act inside the window even in principle; (c) a ministry is asking for our beneficiary location data to run a cash program, and three other orgs hold overlapping subsets that any of them could hand over independently. One of those three should come out against what I want, and I'd rather the procedure tell me now than in a year. Finally, mark which steps are judgment calls dressed up as procedure, say plainly what the procedure can't settle, and keep any math to arithmetic I could do on a whiteboard in front of four tired people.
reasoning: |-
  We are designing a decision procedure to mitigate the unilateralist's curse in a practical, usable way for a committee that meets for about 45 minutes per case. The procedure must:
  1. Be executable without complex math (only arithmetic).
  2. Work without exact numbers (use proxies for counts and error terms).
  3. Address the three wrinkles: shared background information, the capacity argument, and the cost of inaction.
  4. Have clear stopping points and handoffs to humans for value judgments.
  5. Run through three example cases and show one going against the user's preference.

  The unilateralist's curse suggests that when multiple actors could potentially act and the action proceeds if any one actor deems it positive, the set of actions taken will be biased toward those that are over-optimistically evaluated. The remedy is to require a higher threshold (a margin) for acting unilaterally than one's own honest assessment. The size of the margin depends on the number of other actors and the noise in judgments.

  We break down the procedure into steps, each with specific questions and criteria.

  **Decision Procedure Steps:**

  1. **Define the Action and Alternatives:**
     - Clearly state the proposed action (X) and the main alternative (usually inaction, but could be a different action). Also note any time constraints.

  2. **Identify the Set of Relevant Actors:**
     - Who are the other organizations or entities that could reasonably be expected to form a judgment on this action? (This is not about capacity to act, but about capacity to judge the net benefit.)
     - In the absence of a count, we can categorize:
       - "High relevance": Actors directly involved (e.g., consortium partners, government bodies in the sector).
       - "Medium relevance": Actors with related expertise or operations in adjacent areas.
       - "Low relevance": Others.
     - Count the number of "high relevance" actors (N). If we can't count, use:
       - Few: 1-3
       - Several: 4-7
       - Many: 8+
     - *Note: This step addresses the field director's objection by focusing on who could judge, not who could act. Even if we are the only one with capacity to act, others might have judged the action as negative and that is why they didn't act. So the curse still applies.*

  3. **Assess Shared Background (Wrinkle 1):**
     - How much do we share information and context with the other actors? (This affects the independence of judgments.)
       - High: We frequently share meetings, reports, staff, and data.
       - Medium: Some sharing.
       - Low: Little to no sharing.
     - *Effect on margin: High shared background means judgments are more correlated, which may reduce the effective N (because if one actor is biased, others are likely similarly biased). However, shared bias is a reason to be more cautious because if we are all biased in the same way, we might collectively overlook a downside. Therefore, we increase the margin when shared background is high to account for the risk of shared bias.*

  4. **Estimate Net Benefit Without Margin:**
     - What is our best estimate of the net benefit (benefits minus costs/risks) of doing X? Use a qualitative scale if numbers are unavailable:
       - Very positive (VP): +3
       - Positive (P): +2
       - Slightly positive (SP): +1
       - Neutral (N): 0
       - Slightly negative (SN): -1
       - Negative (N): -2
       - Very negative (VN): -3
     - Alternatively, if we can use numbers, we might use a scale from -10 to 10, but the committee must be consistent.

  5. **Determine the Base Margin:**
     - The base margin is a threshold that the net benefit must exceed for us to act unilaterally. It is positive and increases with the number of other actors (N) and the noise in our judgments.
     - Without numbers, we use:
       - For N (number of high relevance actors):
          - Few: margin = 1 (on the qualitative scale above, meaning we require at least SP instead of just any positive)
          - Several: margin = 2 (require at least P)
          - Many: margin = 3 (require VP)
       - But note: the margin also depends on the noise. We can use our internal log of past decisions to calibrate:
          - Calculate the average absolute error of our past confidence ratings (how often we were wrong and by how much). If we don't have numbers, we can classify our typical error:
            - Low noise: our past confidence ratings were usually correct (e.g., we rated positive and it turned out positive) -> use the above base margin.
            - High noise: we were often wrong -> increase the margin by one level (e.g., if base margin for several was 2, then use 3).
       - *If we have the log:*
          - For the last 40 decisions, for each, we recorded:
              - Our confidence rating (e.g., on a scale of 1-5, meaning very low to very high confidence in positive net benefit) and the outcome (positive or negative net benefit, as determined by later review).
          - We can compute the error rate (fraction of times we were wrong when we acted) and adjust the margin accordingly. For example:
              - If error rate is low (<20%), use the base margin.
              - If error rate is medium (20-40%), add 1 to the base margin (on the qualitative scale).
              - If error rate is high (>40%), add 2.
          - However, without numbers, we can use a qualitative assessment of our past accuracy.

  6. **Adjust for Shared Background:**
     - If shared background is high, then we increase the margin by 1 (on the qualitative scale) because of the risk of shared bias. If medium, no change. If low, we might decrease by 1 (but given the risk of independent biases, we might not decrease). However, to be safe, we do not decrease for low shared background because independent errors can still occur. So:
       - High shared background: add 1 to the base margin (so the required net benefit is even higher).
       - Medium: no change.
       - Low: no change (or if we are very confident in independence, we might subtract 1, but we recommend not subtracting to be conservative).

  7. **Account for the Cost of Inaction (Wrinkle 3):**
     - Inaction can also be a unilateral move if we are the only one who can prevent harm by acting. So we must compare the net benefit of acting (with margin) to the net cost of not acting.
     - Steps:
       - Estimate the net cost of inaction (what bad thing happens if we don't act?).
          - Use the same qualitative scale but for inaction: if inaction has a net cost, that is a positive number for acting? Actually, we can reframe: 
            - Let B_act = net benefit of acting (as estimated in step 4).
            - Let B_inact = net benefit of inaction (which might be negative, meaning a cost).
          - Then the net benefit of acting relative to inaction is: B_act - B_inact.
       - However, we must apply the margin to the unilateral action of acting, but if inaction is also a unilateral move, we might need a margin for inaction? The curse applies to any decision that can be taken by one actor. So if we are the only one who can act, then inaction is also a decision that we are taking unilaterally. Therefore, we must apply the same logic to inaction? But note: the curse as originally defined is about acting when others might have judged against. For inaction, if we are the only one who can act, then inaction might be the safe choice? However, if inaction causes harm and we are the only one who can prevent it, then we have a responsibility to act. Therefore, we adjust:
          - We require that the net benefit of acting (relative to inaction) must exceed the margin. But if the net cost of inaction is very high, that might offset the margin.
       - We can do:
          - Compute the "effective net benefit": B_act - B_inact (this is the benefit of acting over inaction).
          - Then we require: (B_act - B_inact) > margin.
          - But note: the margin is set to account for the unilateralist's curse for acting. However, if we are the only one who can act, then the curse for acting is still present (because others might have judged the action as bad and that's why they are not acting) but the curse for inaction is that we might be underestimating the cost of inaction? This is complex.
       - A simpler approach: 
          - If we are the only one who can act (within the time window), then the set of actors who could have judged the action is still N (the same as before). The curse still applies to our decision to act because others might have judged the action as negative and that is why they are not doing it (even if they could, they choose not to). However, if they cannot act, then they might not have even judged it? We must assume that they would have judged it if they had the capacity? Not necessarily.
       - We'll stick to: the margin is for acting unilaterally, and it is based on the number of actors who could have formed a judgment (regardless of capacity to act). But for the cost of inaction, we note:
          - If the net cost of inaction is very high (e.g., lives lost) and we are the only one who can prevent it, then we might lower the margin? But that is dangerous because it might lead to over-optimistic action.
          - Instead, we can treat the cost of inaction as increasing the net benefit of acting. So we use the same margin threshold but now the net benefit we are testing is (B_act - B_inact). We require (B_act - B_inact) > margin.

  8. **Final Decision Rule:**
     - If (net benefit of acting relative to inaction) > (adjusted margin), then we can do X.
     - Otherwise, we do not do X (or we wait, but waiting might not be an option).

  9. **Handoffs to Humans:**
     - At any step, if the committee feels that the assessment of net benefit involves a value judgment that is beyond the committee's mandate (e.g., trade-offs between different ethical principles), then hand off to the board's ethics subcommittee. But note that the ethics subcommittee meets quarterly, so we must flag if the decision can wait. If it cannot, then the committee must make the call and document the value judgment.
     - Specifically, step 4 (estimating net benefit) and step 7 (cost of inaction) are the most likely to involve value judgments.

  10. **Stopping Points:**
      - If at step 4 the net benefit without margin is negative (and we are confident in that), we can stop at "no" because even without the curse, it's not worth it.
      - If after step 7 the net benefit relative to inaction is less than or equal to the margin, we stop at "no".

  **Summary of the Procedure:**

  1. **Define the action and alternatives.**
  2. **Identify relevant actors (N) and categorize as few, several, many.**
  3. **Assess shared background (high, medium, low).**
  4. **Estimate net benefit of acting (B_act) on a scale.**
  5. **Determine base margin based on N and noise (using past log if available).**
  6. **Adjust margin for shared background: add 1 if high.**
  7. **Estimate net cost of inaction (B_inact) and compute effective net benefit: (B_act - B_inact).**
  8. **Compare: if (B_act - B_inact) > adjusted margin, then yes; else no.**
  9. **If at step 4 B_act is negative, then no (unless inaction is even worse, then go to step 7).**

  **Addressing the Field Director's Objection (Wrinkle 2):**
  - Even if we are the only one with the capacity to act in the window, other actors could have formed a judgment about the action. If they judged it negatively, that is a signal that we might be over-optimistic. Therefore, we still need the margin. However, if there are no other actors who could have judged (which is rare), then N=0 and the margin would be 0. But in our context, there are usually other actors (consortium partners, government) who could judge.

  **Using the Internal Log:**
  - The log of past decisions can be used to estimate the noise in our judgments. We can compute an error rate (how often we were wrong when we acted) and adjust the base margin. Without numbers, we can do a qualitative review: if we were often wrong, we add to the margin.

  **Running the Examples:**

