answer: |-
  Below is a practical decision procedure designed to mitigate the unilateralist's curse in your context. It incorporates your requirements:  
  - Usable in 45 minutes with no formal stats/economics training.  
  - Works without exact numbers (uses proxies for actor count and judgment noise).  
  - Addresses your three wrinkles (shared background, capacity objections, and cost of inaction).  
  - Includes clear stopping points, human judgment handoffs, and handles value conflicts.  
  - Math limited to simple arithmetic (add/subtract, compare scales).  

  The procedure is structured as **10 sequential questions**. If any answer triggers a "no," the process stops. If values (not facts) are disputed, it escalates to a named human. Steps that are judgment calls are marked with 🎭.  

  ---

  ### **Decision Procedure**  
  **Purpose**: Determine if unilateral action (X) is justified after accounting for the unilateralist's curse.  
  **Inputs**:  
  - Your internal log of past 40 decisions (for noise estimation).  
  - Qualitative scales for net benefit and confidence (defined below).  
  - A map of "relevant actors" (defined in Step 2).  

  **Scales**:  
  - **Net benefit (NB)**: Very negative (−3), Negative (−2), Slightly negative (−1), Neutral (0), Slightly positive (+1), Positive (+2), Very positive (+3).  
  - **Confidence (past decisions)**: Low (1), Medium (2), High (3).  
  - **Relevant actors**: Categorized as **Few** (1–3), **Several** (4–6), **Many** (7+).  

  ---

  #### **Step 1: Define X and inaction**  
    - **Question**: What exactly is X, and what happens if we do nothing?  
    - **Sufficient answer**: Concrete description of X and the consequences of inaction (e.g., "Publish report" vs. "Suppress findings").  
    - **Stop/Handoff**: If X or inaction is unethical/illegal → Stop and consult legal/ethics lead.  
    - **🎭 Judgment call**: Defining "inaction" (e.g., is delay an option?).  

  #### **Step 2: Identify relevant actors**  
    - **Question**: Who else could plausibly judge X’s net benefit? (Ignore capacity to *act*; focus on capacity to *judge*.)  
    - **Sufficient answer**: List consortium peers, govt bodies, donors, or experts with contextual knowledge.  
    - **Proxy for count**: Categorize as:  
      - **Few**: Only direct partners (e.g., 1–3 orgs in your consortium).  
      - **Several**: Direct partners + key govt/donors (e.g., 4–6).  
      - **Many**: Broader sector (e.g., 7+ including intl. actors).  
    - **Stop**: If no actors exist → Skip to Step 7 (no curse adjustment needed).  
    - **🎭 Judgment call**: Who "counts" as relevant (e.g., is a silent partner "judging" by inaction?).  

  #### **Step 3: Adjust for shared background (Wrinkle 1)**  
    - **Question**: Do we share critical info/assumptions with these actors? (e.g., same meetings, staff, literature.)  
    - **Sufficient answer**:  
      - **High overlap** (e.g., weekly coordination): Apply **tighter margin** (shared bias ↑ risk).  
      - **Low overlap** (e.g., no contact): Apply **standard margin**.  
    - **Rule**: High overlap → **Add +1 to the margin** in Step 6.  
    - **Why**: Shared background doesn’t shrink the curse; it *amplifies* risk because collective blind spots increase over-optimism.  

  #### **Step 4: Estimate X’s net benefit (NBₓ)**  
    - **Question**: What is our honest NBₓ estimate *ignoring the curse*?  
    - **Sufficient answer**: Use the NB scale. If confidence is low, state a range (e.g., "Slightly positive to Positive").  
    - **Stop**: If NBₓ ≤ −2 (Negative/Very negative) → **Do not do X**.  
    - **Handoff**: If NBₓ depends on values (e.g., "Is transparency worth reputational harm?") → Escalate to board ethics chair.  
    - **🎭 Judgment call**: Weighing evidence (use your public policy training; no stats needed).  

  #### **Step 5: Estimate inaction’s net cost (NC↙)**  
    - **Question**: What is the net cost of *not doing X*? (Convert to NB scale: NC↙ = −1 × cost.)  
    - **Sufficient answer**:  
      - NC↙ = Very negative (−3) if inaction causes direct harm (e.g., deaths, rights violations).  
      - NC↙ = Neutral (0) if inaction has no material impact.  
    - **Rule for Wrinkle 3**: If NC↙ ≤ −2 (high cost of delay), **treat inaction as a unilateral decision** and apply the curse margin to *both* action and inaction. Proceed to Step 6.  

  #### **Step 6: Calculate the curse margin (M)**  
    - **Purpose**: The "tax" on NBₓ to correct for over-optimism.  
    - **Question**: What is M based on actor count (Step 2) and our past noise?  
    - **Rules**:  
      1. **Base margin (Mᵦ)** from actor count:  
         - Few: **+0.5**  
         - Several: **+1.0**  
         - Many: **+1.5**  
      2. **Noise adjustment (Mₙ)** from your internal log:  
         - Review past 40 decisions. For each, compare your confidence rating (Low/Med/High) to outcome (Good/Bad).  
         - **Noise level** = % of decisions where:  
           - Confidence was High (3) but outcome was Bad, OR  
           - Confidence was Low (1) but outcome was Good.  
         - **Adjustment**:  
           - Low noise (<20% errors): **+0**  
           - Medium noise (20–40%): **+0.5**  
           - High noise (>40%): **+1.0**  
      3. **Shared background adjustment (Mₛ)**: **+1.0** if Step 3 = High overlap.  
      4. **Total margin**: **M = Mᵦ + Mₙ + Mₛ** (round to nearest 0.5).  
    - **Example**: Actors = Several (Mᵦ=1.0), Noise=Medium (Mₙ=0.5), High overlap (Mₛ=1.0) → **M = 2.5**.  
    - **No math shortcut**: Use your log for Mₙ. If log is incomplete, assume Medium noise (+0.5).  

  #### **Step 7: Apply the margin to NBₓ**  
    - **Question**: Is NBₓ − M > 0?  
    - **Rule**:  
      - If **NBₓ − M > 0** → Proceed to Step 8.  
      - If **NBₓ − M ≤ 0** → **Do not do X** (curse risk too high).  
    - **Note**: M is always positive → It penalizes marginal/optimistic judgments.  

  #### **Step 8: Compare action vs. inaction**  
    - **Question**: Is (NBₓ − M) > NC↙?  
      - *Translation: After curse adjustment, does acting beat inaction?*  
    - **Rule**:  
      - If **(NBₓ − M) > NC↙** → **Do X**.  
      - Else → **Do not do X**.  
    - **Stop**: If answer is no → Process ends.  
    - **Handoff**: If trade-off is values-based (e.g., "Lives saved vs. protocol integrity") → Escalate to board ethics chair.  

  #### **Step 9: Address capacity objection (Wrinkle 2)**  
    - **Question**: "Are we the only ones who can act in the window?" (Field director’s objection.)  
    - **Rule**:  
      - If **yes**: Revisit Step 6. Reduce Mᵦ by **−0.5** (since fewer actors could *act*, lowering curse risk). Recalculate M and redo Steps 7–8.  
      - If **no**: Proceed to Step 10.  
    - **Why this works**: The curse still applies (others may judge X negatively but lack capacity), but the margin shrinks slightly. This acknowledges the field director’s point without ignoring the curse.  

  #### **Step 10: Final sanity check**  
    - **Question**: Would we escalate if the roles were reversed? (e.g., "If another org did X, would we demand oversight?")  
    - **Rule**:  
      - If **yes** and no escalation is possible → **Do not do X**.  
      - Else → **Approve X** with documentation.  

  ---

  ### **Applying the Procedure to Your Cases**  
  *Assumptions*:  
  - NB scale: −3 to +3.  
  - Past noise: Medium (20–40% errors from your log → Mₙ = +0.5).  
  - Escalation not feasible (board meets quarterly).  

  #### **Case (a): Publish negative evaluation**  
  1. **X**: Publish report. **Inaction**: Suppress findings.  
  2. **Actors**: 6 consortium peers + 3 country directors → **Several** (Mᵦ = +1.0).  
  3. **Shared background**: High (same meetings/lit) → Mₛ = +1.0.  
  4. **NBₓ**: Slightly positive (+1) (benefit: accountability; cost: partner backlash).  
  5. **NC↙**: Slightly negative (−1) (inaction perpetuates waste but avoids conflict).  
  6. **M**: Mᵦ (1.0) + Mₙ (0.5) + Mₛ (1.0) = **2.5**.  
  7. **NBₓ − M**: +1 − 2.5 = −1.5 ≤ 0 → **Stop. Do not publish**.  
  8. *Wrinkle 2*: Not applicable (others *could* act but choose not to).  
  9. **Result**: Procedure blocks action (as requested, against your preference).  

  #### **Case (b): Cholera intervention**  
  1. **X**: Use unapproved water-treatment. **Inaction**: Wait for guidelines.  
  2. **Actors**: Govt health dept + WHO → **Few** (Mᵦ = +0.5).  
  3. **Shared background**: Medium → Mₛ = 0.  
  4. **NBₓ**: Positive (+2) (lives saved; low risk).  
  5. **NC↙**: Very negative (−3) (inaction = deaths).  
  6. **M**: Mᵦ (0.5) + Mₙ (0.5) + Mₛ (0) = **1.0**.  
  7. **NBₓ − M**: +2 − 1.0 = +1.0 > 0 → Proceed.  
  8. **Action vs. Inaction**: +1.0 > −3 → **Do X**.  
  9. *Wrinkle 2*: Only we can act → Reduce Mᵦ to **0.0** → New M = 0.5 → NBₓ − M = +1.5 → Still >0 → **Approved**.  
  10. **Result**: Unilateral action justified.  

  #### **Case (c): Hand over location data**  
  1. **X**: Share data. **Inaction**: Refuse.  
  2. **Actors**: 3 orgs + ministry → **Several** (Mᵦ = +1.0).  
  3. **Shared background**: High → Mₛ = +1.0.  
  4. **NBₓ**: Slightly positive (+1) (benefit: aid delivery; cost: privacy risk).  
  5. **NC↙**: Slightly negative (−1) (inaction delays aid but protects data).  
  6. **M**: Mᵦ (1.0) + Mₙ (0.5) + Mₛ (1.0) = **2.5**.  
  7. **NBₓ − M**: +1 − 2.5 = −1.5 ≤ 0 → **Stop. Do not hand over**.  
  8. *Wrinkle 2*: Others can act → No adjustment.  
  9. **Result**: Blocked (high curse risk due to shared bias and noise).  

  ---

  ### **What the Procedure Can and Cannot Do**  
  **Limitations**:  
  - **Cannot resolve**: Deep value conflicts (e.g., "transparency vs. harm reduction"). These *must* go to ethics.  
  - **Cannot replace**: Context expertise (e.g., local staff insights). Steps 4–5 rely on human judgment.  
  - **Not foolproof**: Margin (M) is a heuristic. High noise or actor uncertainty may skew results.  
  - **Biases**: 🎭 steps are vulnerable to groupthink. Assign a devil’s advocate for each meeting.  

  **Critical Judgment Calls**:  
  1. Step 2 (actor relevance) → Risk of under/over-counting.  
  2. Step 4 (NBₓ) → Most subjective step; prone to optimism.  
  3. Step 6 (Mₙ) → Past noise may not predict future errors.  

  **Recommendations**:  
  - **Log tracking**: Continue recording confidence/outcomes to refine Mₙ.  
  - **Fallback**: If the procedure feels wrong, default to "no" unless lives are at immediate risk (Case b).  
  - **Time saver**: Pre-fill Steps 1–3 before the meeting.  

  This procedure forces explicit consideration of the curse, shared bias, and inaction costs while avoiding paralysis. It will err toward caution in close calls (e.g., Cases a and c), reserving unilateral action for clear, high-stakes wins (Case b).
