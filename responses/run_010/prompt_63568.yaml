prompt: |-
  I'm auditing a decision theory seminar this term, mostly to pick up math I skipped as an undergrad, and this week's packet is on prospects that don't have a well-defined expectation. Alongside the assigned papers someone in the reading group passed around a long essay from a rationalist-adjacent blog that tries to explain the whole literature to outsiders. It's honestly the clearest thing I've read all week, which is exactly what worries me — I can't tell if it's clear because it's right or clear because it's sanding off the parts that are hard. Here's the central stretch, more or less as written:

  > "The Pasadena game, introduced by Harris Nover and Alan Hajek in 2004, is what you get when you give the St. Petersburg game a minus sign. A fair coin is flipped until it lands heads. If the first head comes on toss n, you win 2^n/n dollars when n is odd and lose 2^n/n when n is even — so the first toss is worth +$2, the second -$2, the third +$8/3, the fourth -$4. Weight each payoff by its probability, 1/2^n, and every toss contributes exactly ±1/n, so the expectation is the alternating harmonic series 1 − 1/2 + 1/3 − 1/4 + ..., which converges to ln 2, about 69 cents. But it converges only conditionally: sum the absolute values and you get the harmonic series, which blows up. And a conditionally convergent series can be rearranged to converge to anything you like, or to nothing. So the correct statement isn't 'the Pasadena game is worth about 69 cents,' it's 'the Pasadena game has no expected value.' This is the same trouble the St. Petersburg game is in, only worse — there the expectation was infinite, here it's undefined, and infinity is just a very big undefined. The obvious repair is what Easwaran called the weak expectation: cut the series off at some large term and treat the leftover tail as negligible, which gets you ln 2 back and lets you price the game again. Hajek and Nover's follow-up adds the Altadena game, Pasadena's twin with the terms in a different order, where every finite truncation of one looks better than the matching truncation of the other. The lesson is that these 'gambles' were never objects out in the world; they're series, and a series is only as determinate as the order you happen to write it in. Decision theory spent three centuries assuming a gamble is a thing that has a value. Pasadena shows it's a thing that has a notation. So expected utility theory isn't merely incomplete at the margins — it's refuted, and no pile of extra axioms can rescue it, because the problem was never the axioms. It's that the quantity the axioms quantify over fails to exist."

  Can you go through this claim by claim and sort it into four piles: what a decision theorist who actually works on this would sign without qualification, what's a legitimate simplification for a general audience, what's a stretch that a specialist would want hedged, and what's just wrong? Four places I specifically want pressure on: the infinite-versus-undefined line, since the essay treats infinity as a variety of undefined and I have a vague sense that's backwards; whether the rearrangement theorem really licenses the move from "no strong expectation" to "no fact of the matter about its value" to "any price you like is defensible"; whether the gloss on weak expectation is accurate, because that term does all the load-bearing work in the second half and I suspect truncating a series and taking a weak expectation aren't the same operation at all; and whether the Altadena paragraph gets the point of that example, or inverts it. Last thing — the essay's closing move is that the theory is refuted rather than incomplete, and that axioms can't help because the trouble is upstream of them. Does that conclusion survive once the earlier claims are corrected, or was it leaning on the errors? I'm inclined to think the essay is basically fair and the specialists are just being precious about terminology, so tell me straight if that instinct is wrong. Answer in American English.
reasoning: |-
  Hmm, this is a detailed query about decision theory, specifically the Pasadena game and its implications for expected utility theory. The user has shared a blog excerpt that makes strong claims, and they want me to evaluate those claims point-by-point. They're auditing a seminar and seem concerned that the blog might be oversimplifying things.

  First, I need to recall the key elements: The Pasadena game has payoffs that alternate in sign (±2^n/n) with probabilities 1/2^n. The expectation is the alternating harmonic series which converges conditionally to ln(2), but its absolute series diverges. The blog claims this means the expected value is undefined, not just infinite like in St. Petersburg, and that this "refutes" expected utility theory.

  The user has four specific areas they want examined: 
  1) Whether treating infinity as a type of undefined is accurate (I think this is backwards - infinity is defined but problematic)
  2) Whether rearrangement really justifies saying any price is defensible (this needs nuance - rearrangement shows dependence on order, not that all values are equally valid)
  3) Whether "weak expectation" is accurately described as simple truncation (they're right to suspect this - weak expectation is more sophisticated)
  4) Whether the Altadena example is correctly interpreted (the blog misses that Altadena demonstrates order-dependence, not inherent superiority)

  The blog's conclusion that expected utility is "refuted" seems overstated. Specialists see this as highlighting boundary cases that require refined tools, not disproving the entire framework. The user suspects experts might be "precious about terminology," but I think the issues go deeper - the blog oversimplifies mathematical nuances that actually matter for correct interpretation.

  I should organize my response into the four categories requested: unobjectionable, simplified, stretched, and wrong. The infinite-vs-undefined point definitely belongs in "wrong," while the rearrangement interpretation needs hedging. The weak expectation description is a significant oversimplification, and the Altadena explanation inverts the actual lesson. The dramatic conclusion about refutation doesn't survive correction - it's leaning on earlier errors.

  The user is clearly sharp - they've already spotted that truncation and weak expectation aren't identical. I should validate that instinct while explaining why the distinctions matter mathematically. Their instinct that the blog is "basically fair" isn't entirely wrong, but the oversimplifications do substantive damage to the theoretical implications.
answer: |-
  Here's a breakdown of the blog's claims, categorized as requested. The core mathematical facts about the Pasadena game are solid, but the philosophical interpretation and implications for decision theory are significantly overstated or misrepresented. Your instinct that specialists might be "precious about terminology" has *some* merit near the edges, but the blog's main conclusions lean heavily on substantive errors and oversimplifications.

  ### 1. What a decision theorist would sign without qualification:
  *   **The Pasadena Game Setup:** The description of the payoffs (±2ⁿ/n with probability 1/2ⁿ) and the derivation of the alternating harmonic series (1 - 1/2 + 1/3 - 1/4 + ...) as the formal expectation calculation is correct.
  *   **Convergence Properties:** The series converges conditionally to ln(2) ≈ $0.69. The series of absolute values (the harmonic series, 1 + 1/2 + 1/3 + 1/4 + ...) diverges to infinity.
  *   **Rearrangement Theorem:** Riemann's rearrangement theorem applies: a conditionally convergent series can be rearranged to converge to any real number, or to diverge to ±∞, or to oscillate without converging.
  *   **The Altadena Game:** Hajek and Nover (2006) introduced the Altadena game, defined by rearranging the Pasadena terms to always appear better in any finite prefix. (The blog slightly mischaracterizes *how* it's rearranged, but the core idea is correct).
  *   **Finite Truncations:** For any finite N, the expected value of playing only up to toss N exists and is well-defined for both Pasadena and Altadena. For Pasadena, this truncated expectation approaches ln(2) as N increases (if summed in the natural order).

  ### 2. Legitimate simplification for a general audience:
  *   **"The correct statement isn't 'the Pasadena game is worth about 69 cents,' it's 'the Pasadena game has no expected value.'"** While "no expected value" is standard phrasing capturing the undefined nature, a specialist might prefer "the expectation is undefined" or "does not exist" to emphasize it's not just infinite. The core point – ln(2) isn't *the* value – is well-taken as a simplification.
  *   **"Infinity is just a very big undefined."** This is a crude but somewhat useful *intuitive* way to contrast St. Petersburg (infinite expectation) and Pasadena (undefined expectation) for a general audience. It highlights that both are pathological, but differently. (Though technically wrong, see below).
  *   **Highlighting the Issue:** Emphasizing that conditional convergence and rearrangement sensitivity are the root of the problem is a valid simplification of the core mathematical pathology.

  ### 3. Stretch that a specialist would want hedged:
  *   **"The same trouble the St. Petersburg game is in, only worse"** This needs nuance. St. Petersburg has a well-defined expectation (infinity), which is problematic for decision theory. Pasadena has *no* well-defined expectation (undefined). Both are problems, but they are *different kinds* of problems. Saying Pasadena is "worse" is a value judgment; it presents a deeper challenge to the very *existence* of the expectation value, while St. Petersburg challenges its *meaningfulness*.
  *   **Rearrangement & "Any Price You Like"**: "a conditionally convergent series can be rearranged to converge to anything you like" is true mathematically for the *sum of the series under rearrangement*. However, the leap to **"So the correct statement isn't 'the Pasadena game is worth about 69 cents,' it's 'the Pasadena game has no expected value.'"** and especially **"any price you like is defensible"** is a **major stretch that needs heavy hedging**.
      *   **Hedging:** Rearrangement shows the expectation is *order-dependent*. The "natural order" (order of occurrence: n=1, n=2, n=3, ...) is often privileged in defining the game and calculating finite truncations converging to ln(2). Decision theorists don't generally accept that rearranging the payoff *schedule* (like Altadena) creates an *equivalent* game; they are different gambles. While rearrangement exposes the fragility, it doesn't automatically mean *every* price for the *original* Pasadena game is equally defensible. Defending an arbitrary price requires changing the fundamental structure of the gamble, not just reinterpreting the existing one. The conclusion is that the expectation is undefined *in the standard sense*, not that every conceivable value is equally valid *for the gamble as described*.
  *   **The Lesson about Gambles & Notation:** "these 'gambles' were never objects out in the world; they're series, and a series is only as determinate as the order you happen to write it in. Decision theory spent three centuries assuming a gamble is a thing that has a value. Pasadena shows it's a thing that has a notation." This is a provocative philosophical gloss that captures an *aspect* of the problem – the mathematical representation is crucial and can be fragile. However, it's a huge oversimplification. Specialists generally *do* believe gambles correspond to real-world choices (like structured bets or investments), but recognize that *infinite* gambles push the standard mathematical representation (expectation as a simple sum) beyond its limits. The problem isn't *just* notation, it's the complexity of the infinite state space and the failure of absolute convergence. The claim that gambles *are* series confuses the map (the mathematical model) with the territory (the potential real-world action).

  ### 4. What's just wrong:
  *   **"Infinity is just a very big undefined."** **This is backwards and incorrect.** Infinity *is* a well-defined mathematical concept (e.g., the limit of partial sums diverges). An infinite expectation means the sum *diverges* to infinity. "Undefined" means no limit exists at all (not even infinite), precisely because of conditional convergence/rearrangement sensitivity. St. Petersburg has a defined value (infinity); Pasadena has *no* defined value. Treating infinity as "undefined" blurs this critical distinction.
  *   **The Gloss on Weak Expectation:** **This is significantly inaccurate and crucial to the essay's argument.** "cut the series off at some large term and treat the leftover tail as negligible, which gets you ln 2 back" describes **truncation**, not necessarily "weak expectation" as defined by Easwaran (or similar concepts like Lauwers' "weakly measurable" gambles).
      *   **Why it's wrong:** Easwaran's weak expectation is defined using *finite* approximations (like truncation) but crucially requires that the value they converge to is *independent* of the specific way you take the approximations (e.g., summing over finite sets that eventually include everything). The Pasadena game (in its natural order) *does* have a weak expectation (also called a Moore-Smith limit or a Banach limit) equal to ln(2)! This is because the finite truncations *in the natural order* converge to ln(2). The Altadena game (rearranged) has a different weak expectation (or none, depending on the rearrangement). **The key point the blog misses is:** Truncation in the *natural order* does recover ln(2), and this value *is* robust for the specifically ordered Pasadena gamble under weak expectation concepts. The problem highlighted by Altadena is that *different orderings* lead to different weak expectations. The blog incorrectly implies weak expectation via truncation is a hack that just ignores the problem; it's actually a principled (though not universally accepted) way to assign a value that respects the natural order structure. Truncation is the *method*, but weak expectation is the *defined value* that method converges to for the natural order.
  *   **The Point of Altadena:** The blog implies the point is that Altadena looks better in every finite truncation. **This inverts the actual point.** The *real* point is that Pasadena (natural order truncations → ln(2)) and Altadena (rearranged order truncations → some other value, say S) are *different infinite gambles*, even though they have the same set of possible (payoff, probability) pairs. Comparing their finite truncations shows the *dependence on order* even for approximations. Altadena demonstrates that rearranging the payoff schedule creates a genuinely *different* gamble with a different weak expectation value, exposing that the standard expectation *cannot* be defined solely based on the set of payoffs and probabilities – the *order of occurrence* matters fundamentally. The lesson isn't just that Altadena "looks better", but that the two gambles are distinct and have different weakly expected values *because* of the order.
  *   **"Expected utility theory... is refuted... no pile of extra axioms can rescue it, because the problem was never the axioms. It's that the quantity the axioms quantify over fails to exist."** **This conclusion does not survive correction.**
      *   **Leaning on Errors:** This leans heavily on the incorrect conflation of infinity/undefined, the misinterpretation of rearrangement as implying no value is privileged, and the mischaracterization of weak expectation. Weak expectation *does* provide a well-defined quantity for the naturally ordered Pasadena game.
      *   **Specialist View:** Decision theorists overwhelmingly see the Pasadena/Altadena paradox as a *boundary case* highlighting the limitations of the standard *definition* of expected value for infinite state spaces. It shows the standard definition is *incomplete*, not that expected utility is refuted. Solutions involve:
          *   Refining the expectation concept (Weak expectation, Scott-Scott, etc.).
          *   Restricting the domain of gambles to those with finite expectation or absolutely convergent series.
          *   Using more sophisticated integration (e.g., finitely additive probability).
          *   Axiomatizing preferences directly over gambles without assuming an expectation representation exists for *all* conceivable gambles.
      *   The problem *is* addressed by extra axioms or modified frameworks – axioms that specify *which* gambles are admissible or *how* expectation should be defined for conditionally convergent cases. The quantity (expectation) fails to exist *under the standard definition*, but alternative definitions exist, and the core principles of rationality (coherent preferences) can still hold. The blog commits a fallacy: "The standard tool (Lebesgue expectation) breaks on this edge case, therefore the entire enterprise (rational choice based on valuing uncertain prospects) is impossible." Specialists reject this leap.

  **Conclusion on Your Instinct:** Your instinct that the specialists might be "precious about terminology" isn't entirely wrong – distinctions like defined-infinite vs. undefined are precise technical points. **However, the blog's errors are more than terminological.** The misrepresentation of weak expectation, the inversion of Altadena's point, and especially the unsupported leap to "refuted" are substantive flaws that distort the actual implications recognized within decision theory. The blog is clear because it sands off critical nuances and makes philosophically dramatic claims that go far beyond what the mathematics strictly supports. It's a useful primer on the *mathematical phenomenon* but a misleading guide to its *theoretical significance*. The core paradox is real and important, but decision theory adapts; it isn't refuted.
