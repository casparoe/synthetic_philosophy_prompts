prompt: |-
  I'm building a small taxonomy of genealogical debunking arguments — the family of moves where you point at the causal history of a belief (evolution, cultural transmission, upbringing, whatever) and claim that history defeats its justification. Before I sort anything into it, I want the spec: what does a theory of genealogical defeat have to deliver to count as adequate? Not the arguments, the criteria.

  Purpose, so you know what "adequate" is relative to: I want it as a filter. It should tell me, for an arbitrary piece of reasoning, whether it's a debunking argument at all or just a genealogy with attitude, and it should tell me when one is actually good.

  So give me the requirements. The ones about the explanation itself — does it have to leave the truth of the belief out entirely, or is it enough that the process didn't track it? does it need more than "this belief had a suspicious history"? does it need an independent handle on unreliability, and where is that handle supposed to come from if not from more intuitions of the same kind the target is relying on? The ones about scope — must it be selective, or can a global version be coherent, and what happens to the debunker's own normative claims if it isn't. And the ones about what the debunker may assume without begging the question against the realist. For each requirement, the case or consideration that motivates it: I want to see why it's a requirement and not just a habit of one camp.

  Then mark which are non-negotiable and which are really partisan preferences dressed up as standards, and say which single one knocks out the most candidates. Most of all: if some subset can't be jointly satisfied — explanatory irrelevance plus non-question-begging plus selectivity, say — show that explicitly, because then the list is itself a result and Id rather know now.

  Last and short: the three arguments people actually press — the dilemma-style one aimed at realism about value, the global one aimed at morality as such, and a cultural-transmission one aimed at fairness norms — do they survive your filter? One line each, I'll argue with you after.

  Bottom line first, please: your very first sentence should be your verdict on which requirement does the most work, then the reasoning. No preamble, no restating the question back to me.
reasoning: |-
  Hmm, the user is building a taxonomy of genealogical debunking arguments and wants criteria to evaluate them. They're asking what makes such an argument adequate versus just "genealogy with attitude." They want requirements regarding explanation (truth-tracking, reliability), scope (selective vs global), and question-begging assumptions. They also want to know which requirements are non-negotiable versus partisan, which single requirement knocks out most candidates, and whether three common arguments survive.

  The core issue is explanatory irrelevance: a good debunking argument must show the belief's causal origin doesn't depend on its truth. If the explanation can just as easily account for true or false beliefs, that undermines justification. This is non-negotiable because it's the essence of debunking—showing the belief is "insensitive" to truth.

  For reliability, an independent handle is needed to avoid circularity. For example, if debunking moral intuitions, you can't rely on those same intuitions to judge reliability. Instead, use empirical evidence or non-moral facts. This is also non-negotiable for non-question-begging arguments.

  Scope-wise, global debunking (targeting all beliefs) is problematic because it risks self-defeat: the debunker's own reasoning might be undermined. Selective debunking is stronger, targeting specific domains without collapsing everything. Global arguments might be coherent if they exempt themselves, but that's ad hoc and unconvincing.

  The most common failure point is the independent reliability handle requirement. Many arguments rely on the very intuitions they're debunking, which is circular. This knocks out most weak candidates.

  Regarding the three arguments:  
  - Dilemma-style (e.g., Street): Often fails the independent reliability handle if it assumes evolutionary success doesn't track moral truth without independent reason.  
  - Global morality debunking: Self-defeat problem; if all moral beliefs are debunked, so are the premises used in the argument.  
  - Cultural transmission: Can work if it shows norms track social stability, not fairness, with independent evidence (e.g., historical variability).

  Tensions exist: Explanatory irrelevance plus non-question-begging plus selectivity is hard to satisfy jointly. For example, in morality, proving irrelevance without moral assumptions is tricky, and global attempts self-destruct. This tension shows why some debates are intractable.

  User's deeper needs: They want a robust filter to categorize arguments rigorously, avoiding superficial critiques. They might be preparing academic work or seeking clarity in ethical debates. Unspoken: They fear hidden biases in existing taxonomies and want criteria that expose weak arguments efficiently. The insistence on "no preamble" suggests impatience with fluff, valuing precision.
answer: |-
  **Bottom line:** The most disqualifying requirement is **explanatory irrelevance plus an independent, non-question-begging handle on unreliability**, as it exposes circularity or vacuity in most attempted debunkers.

  ---

  ### Requirements for an Adequate Genealogical Defeat Theory
  1.  **Explanatory Irrelevance (Non-Negotiable):**  
      *   **Requirement:** The causal explanation must show the belief's etiology is *insensitive* to its truth (i.e., the same process would produce the belief *whether it's true or false*). Merely pointing to a "suspicious" history or a process that didn't *aim* at truth is insufficient; it must demonstrate the process *could not* track the relevant truth.  
      *   **Motivation:** Without this, genealogy merely describes origins without undermining justification. A process coincidentally tracking truth wouldn't be defeated by its history. The case: Explaining why someone believes "water is wet" via sensory perception doesn't debunk it because perception *is* sensitive to that truth. Debunking requires showing the link is *broken*.
      *   **Non-Negotiable:** Yes. This is the core mechanism of defeat – showing the justification isn't truth-conducive.

  2.  **Independent Handle on Unreliability (Non-Negotiable):**  
      *   **Requirement:** The debunker must provide a criterion for unreliability *independent* of the target belief domain's own standards or intuitions. This handle cannot itself rely on the very type of belief or intuition being debunked.  
      *   **Motivation:** To avoid vicious circularity or question-begging. If debunking moral intuitions relies on other moral intuitions to judge the process as unreliable, the argument collapses. The handle must come from outside the target domain (e.g., evolutionary biology, cognitive science, uncontroversial empirical facts).  
      *   **Non-Negotiable:** Yes. Without this, the argument assumes the unreliability it purports to prove or relies on contested intuitions from the domain under attack.

  3.  **Selectivity (Conditionally Non-Negotiable):**  
      *   **Requirement:** Global genealogical debunking arguments (targeting *all* beliefs of a type, e.g., all moral beliefs) must either be coherently possible without self-defeat *or* the theory must justify why only selective debunking (targeting specific beliefs/domains) is valid.  
      *   **Motivation:** Global arguments risk self-defeat: if *all* justification in domain D is undermined, so is any justification for the premises of the debunking argument itself (if it relies on normative claims about justification, evidence, or even the reliability of science/history). The debunker's own normative claims about what constitutes defeat become vulnerable.  
      *   **Non-Negotiable?** **Conditionally Yes.** A theory *must* address the self-defeat problem. It can either 1) Show how global debunking avoids self-defeat (e.g., by exempting logical/mathematical norms or its own epistemic principles), or 2) Explicitly restrict itself to selective debunking. Ignoring this renders the theory incoherent or self-undermining.

  4.  **Non-Question-Begging Premises (Non-Negotiable):**  
      *   **Requirement:** The premises of the debunking argument, especially concerning the unreliability of the causal process, must not *presuppose* the falsity of the target belief or the general untrustworthiness of the belief-forming faculty in the relevant domain.  
      *   **Motivation:** To be dialectically effective against a realist. If the argument assumes moral realism is false to prove evolutionary pressures don't track moral truth, it begs the question. The realist can reject the premise.  
      *   **Non-Negotiable:** Yes. Otherwise, it's not an argument *for* defeat, but an assertion disguised as one.

  5.  **Causal Specificity (Partisan Preference):**  
      *   **Requirement:** The genealogy must provide a sufficiently detailed causal story specific to the belief or type of belief, not just a vague "cultural transmission" or "evolution."  
      *   **Motivation:** Vague histories ("it was culturally transmitted") don't demonstrate *insensitivity* – maybe *this* culture transmitted it *because* it was true. Specific mechanisms (e.g., "kin selection explains altruism norms, irrespective of objective fairness") are needed for a convincing irrelevance claim.  
      *   **Non-Negotiable?** **No (Partisan Preference).** While desirable for strength, a minimalist argument *could* potentially establish insensitivity at a general level (e.g., "evolution selects for fitness-promoting beliefs, not truth-tracking for abstract domains"). Specificity strengthens the argument but isn't strictly logically necessary for the core defeater structure.

  **Tension & Key Disqualifier:**  
  The hardest tension exists between **Explanatory Irrelevance (1)**, **Independent Handle on Unreliability (2)**, and avoiding self-defeat (implicit in **Selectivity (3)**). Satisfying (1) and (2) simultaneously is crucial and difficult, especially for domains like morality. *Requirement (2) - the Independent Handle - is the single most common failure point and knocks out the most candidates.* Many arguments either implicitly rely on the target domain's standards or fail to provide *any* external criterion, rendering them vacuous ("this history looks suspicious to *me*") or circular. Attempts at global debunking often fail **Selectivity (3)** due to self-defeat.

  ---

  **The Three Arguments - Survival Check:**
  1.  **Dilemma-Style (e.g., Street):** *Often fails (2).* Requires assuming evolutionary success ≠ moral truth without a truly independent handle, frequently smuggling in moral intuitions about what "should" have been selected.
  2.  **Global Morality Debunking:** *Fails (3).* Undermines all moral justification, including the normative premises needed to assert that the genealogy *is* defeating.
  3.  **Cultural-Transmission (Fairness Norms):** *Can pass (if done well).* Requires showing transmission mechanism (e.g., group stability) is insensitive to objective fairness *and* an independent handle (e.g., historical variability/arbitrariness as evidence of non-tracking *if* grounded non-morally). Most common versions are selective.
