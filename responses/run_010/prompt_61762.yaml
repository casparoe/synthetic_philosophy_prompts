prompt: |-
  I am convening a one-day graduate workshop on the timing of conscious experience, and the opening panel fell apart in rehearsal. The two panelists are, on one side, a defender of the multiple drafts model in the line of Dennett and Kinsbourne's 1992 target article in *Behavioral and Brain Sciences*, who holds that the color phi display — the one Kolers and von Grünau ran at Nelson Goodman's prompting, with two differently colored lights flashed in quick succession and the subject reporting a single dot that moves and changes color partway along its path — shows there is no determinate fact about when a given content becomes conscious, and consequently that choosing between a Stalinesque and an Orwellian account of the illusion is arbitrary. On the other side is a vision scientist who maintains that perceptual content is composed within a temporal window that closes only after the second stimulus, so that the subject genuinely sees the dot move and change color midway, and who regards the Cartesian theater as a strawman that no working theorist actually endorses. Forty minutes passed without either of them conceding a sentence.

  What I need from you is the document those two ought to have produced together before the workshop, so that it can be read aloud at the start of the panel and the remaining ninety minutes spent on what is genuinely in dispute. Please include the following.

  1. A numbered list of claims both can sign without reservation concerning color phi itself: what the display is, what subjects report, what the neurophysiology of conduction and processing latency permits, and what — if anything — the two accounts predict differently about the subject's own capacity to discriminate an edited experience from a misremembered one. Each item must survive the other side's veto. If a claim turns out to be one party's theory in neutral clothing, cut it.

  2. A disagreements table, with columns for the issue at stake; the multiple drafts formulation, in words its defender would sign; the delayed-composition formulation, in words its defender would sign; and a verdict on whether the difference is substantive, verbal, or unresolved as to which.

  3. The cruxes — the sub-questions such that settling them would actually move one of the two parties. At least one crux must concern whether the Stalinesque/Orwellian distinction becomes non-arbitrary as stimulus onset asynchrony lengthens. I also want the document to take seriously a position I suspect both panelists will dismiss too fast: that the distinction is well-posed above some processing latency and simply inapplicable below it, which is a different charge from arbitrariness. State whether that is a genuine third position or a redescription of one of theirs, and have each panelist say which.

  4. For each crux, a concrete experiment or argument both would accept as bearing on it, with each side's prediction written down in advance. I have in mind particularly a report-timing manipulation: the same color phi display, but with subjects required to respond on a forced schedule — sometimes before the second flash could have entered any composition window, sometimes well after. Say what each camp predicts and which result would embarrass each. Where the two are jointly committed to some account of the cutaneous rabbit illusion, the flash-lag effect, and backward masking, note whether a single uniform treatment of all four is a shared desideratum or a partisan one.

  5. A deliberately short closing section on how much of the dispute is about the phrase the content of experience at t rather than about the mind. If some portion is verbal, identify which portion, and recommend which usage the workshop should adopt and why.

  Two stylistic constraints. No proprietary vocabulary — fame in the brain, probing, postdiction, specious present — may appear unless it is defined in terms its author would accept and its opponent would not contest. And I am not asking for a dramatized exchange, a verdict on who is right, or an autopsy of why the panel stalled: I want a constructive text both of them would put their names to, with the residual disagreement stated exactly. Aim for something readable aloud in fifteen minutes, on the order of fifteen hundred words.
reasoning: |-
  We are producing a joint document for a workshop on the timing of conscious experience, specifically addressing the color phi illusion. The two parties are a defender of the multiple drafts model (MD) and a vision scientist advocating a delayed-composition model (DC). The goal is to have a document they both agree on, which will be read at the start of the panel to focus the discussion on genuine disputes.

  The document must include:

  1. A numbered list of agreed claims about color phi.
  2. A disagreements table with columns: issue, MD formulation, DC formulation, and verdict on the nature of the disagreement (substantive, verbal, or unresolved).
  3. Cruxes (key sub-questions) that could move the debate, including one on the Stalinesque/Orwellian distinction as stimulus onset asynchrony (SOA) lengthens, and a position that the distinction is inapplicable below a certain latency.
  4. For each crux, a concrete experiment or argument both accept, with predictions, and note on whether a uniform treatment of related illusions is desired.
  5. A short closing on whether part of the dispute is verbal.

  Stylistic: No jargon without definition, no dramatization, no verdict on who is right. Readable in 15 minutes (about 1500 words).

  We start with the agreed claims.

  **1. Agreed Claims on Color Phi**

  We list claims that both MD and DC defenders can accept without reservation. These must be neutral, not theory-laden.

  - **Claim 1: Description of the display.** The color phi display consists of two spatially separated lights, flashed in rapid succession. The first light is, for example, green, and the second, red (or vice versa), with a stimulus onset asynchrony (SOA) typically between 50 and 200 milliseconds.

  - **Claim 2: Subject reports.** Subjects report seeing a single dot that moves from the first location to the second and changes color (e.g., from green to red) midway along the apparent path. This report is consistent and robust under the specified conditions.

  - **Claim 3: Neurophysiological constraints.** Visual processing involves delays. The initial neural response to a flash takes time (on the order of tens of milliseconds) to reach the visual cortex, and further processing is required for the stimulus to be consciously perceived. The second flash occurs before the processing of the first is complete.

  - **Claim 4: The illusion's robustness.** The color phi illusion occurs even when subjects know the true sequence of events, indicating that it is a compelling perceptual phenomenon rather than a mere cognitive error.

  - **Claim 5: Absence of discrimination.** Subjects cannot reliably distinguish, based on introspection alone, between (a) an experience in which the dot actually moved and changed color mid-trajectory (Stalinesque) and (b) an experience in which they saw two discrete flashes but then misremembered them as a moving dot that changed color (Orwellian). Both accounts agree that subjects lack this discriminative capacity.

  - **Claim 6: The role of post-stimulus processing.** Both accounts agree that the content of the experience is influenced by neural events occurring after the onset of the stimuli. The dispute concerns the nature of this influence.

  - **Claim 7: The illusion depends on SOA.** The effect requires a sufficiently short SOA. If the SOA is too long, subjects report two distinct flashes without motion or color change.

  Note: We avoid terms like "multiple drafts" or "temporal window" in the agreed claims. We stick to neutral descriptions.

  **2. Disagreements Table**

  We now outline the disagreements. Each row has:
  - Issue at stake
  - MD formulation (in words the defender would sign)
  - DC formulation (in words the defender would sign)
  - Verdict: substantive (S), verbal (V), or unresolved (U) as to which.

  We identify key issues:

  - **Issue 1: The nature of the conscious experience during the phi phenomenon.**
    - MD: There is no determinate fact about the content of consciousness at any given time during the illusion. The experience is only fixed upon probing (i.e., when the subject is asked to report). The apparent motion and color change are the result of a narrative constructed by the brain, and there is no principled way to choose between a Stalinesque (experience of motion) and Orwellian (misremembering) account.
    - DC: The conscious experience is determined after the second flash, within a temporal window that integrates the two flashes. The subject genuinely experiences a moving dot that changes color midway; this is not a memory distortion but the actual content of perception. The Stalinesque account is correct, and the Orwellian is incorrect.

    Verdict: Substantive. The disagreement is about whether the experience has a determinate content at the time it occurs and whether the Stalinesque account is the correct description.

  - **Issue 2: The existence of a "Cartesian theater".**
    - MD: The multiple drafts model rejects the idea of a central place in the brain where "it all comes together" for consciousness (the Cartesian theater). Instead, content becomes conscious by entering into a wide network of cognitive processes without a specific timing.
    - DC: The delayed-composition model also rejects the Cartesian theater as a literal spatial locus. However, it posits that perception involves temporal integration windows, which are neural processes that bind stimuli over time. This does not require a Cartesian theater.

    Verdict: Verbal (or partially verbal). Both reject the Cartesian theater, but they disagree on the implications for temporal perception. The MD defender might argue that DC's temporal window is a version of the theater in time, while DC denies this. We note that the disagreement might be about the definition of the Cartesian theater. However, since both reject it, the core issue is whether temporal integration implies a functional equivalent.

    We mark as: Unresolved as to whether the difference is substantive or verbal. (But we can call it substantive because the underlying mechanisms are different.)

    Alternatively, we can make the verdict: Substantive, because the two models ascribe different functional architectures to consciousness.

  - **Issue 3: The arbitrariness of the Stalinesque/Orwellian distinction.**
    - MD: The distinction is arbitrary because there is no fact of the matter about when content becomes conscious. Therefore, we cannot say whether the illusion happened in real-time (Stalinesque) or was retroactively revised (Orwellian).
    - DC: The distinction is non-arbitrary. The Stalinesque account is correct because the content is composed after the second flash and thus the experience is of motion and color change. The Orwellian account is incorrect because there is no evidence of misremembering; the experience itself is illusory.

    Verdict: Substantive.

  - **Issue 4: The temporal location of conscious content.**
    - MD: There is no definite time at which a content becomes conscious. Consciousness is not a matter of being presented at a particular time but of being available to various cognitive processes.
    - DC: Conscious content is assigned a time based on the stimulus and the processing window. The experience is referred to the time of the stimuli, but the content is determined after the integration window.

    Verdict: Substantive.

  We can structure the table:

  | Issue | Multiple Drafts Formulation | Delayed-Composition Formulation | Verdict |
  |-------|-----------------------------|----------------------------------|---------|
  | 1. Nature of conscious experience during phi | There is no determinate fact about the content of consciousness at any given moment during the illusion; the narrative is fixed only upon report. | The conscious experience is of a moving dot that changes color midway, determined after the second flash within a temporal integration window. | Substantive |
  | 2. Cartesian theater | Rejects the Cartesian theater as a central place where consciousness occurs; content is conscious by entering into a wide network of processes without a specific timing. | Rejects the Cartesian theater as a spatial locus, but posits temporal integration windows as a neural mechanism for binding; this is not a theater. | Unresolved (as to whether the difference is substantive or verbal) |
  | 3. Arbitrariness of Stalinesque/Orwellian | The distinction is arbitrary because there is no fact of the matter about when content becomes conscious. | The distinction is non-arbitrary: the Stalinesque account is correct, and Orwellian is incorrect. | Substantive |
  | 4. Temporal location of conscious content | There is no definite time at which a content becomes conscious; consciousness is a matter of availability to cognitive processes. | Conscious content is assigned a time based on the stimulus, but the content is determined after the integration window. | Substantive |

  **3. Cruxes**

  Cruxes are key sub-questions that could resolve or advance the debate.

  - **Crux 1: Does the Stalinesque/Orwellian distinction become non-arbitrary as SOA lengthens?** 
    - Background: For very short SOAs, both agree the illusion occurs. But what if the SOA is long enough that the processing of the first flash is complete before the second occurs? 
    - MD: Even at longer SOAs, the distinction remains arbitrary because there is no fact about when content becomes conscious. The report is fixed at the time of probing.
    - DC: At longer SOAs, the integration window may not encompass both flashes, so the illusion breaks down and subjects see two flashes. Then, the experience is of two discrete events, and the Stalinesque/Orwellian question does not arise because there is no illusion. However, within the range of SOAs where the illusion occurs, the Stalinesque account is correct.

    Also, we must consider the position that the distinction is inapplicable below a certain latency (i.e., for very short SOAs). This is a third position? Or a redescription?

    - The position that the distinction is inapplicable below a processing latency is distinct from both MD and DC. 
      - MD says the distinction is always arbitrary (for any SOA) because there is no fact of the matter.
      - DC says the distinction is applicable and Stalinesque is correct for SOAs within the integration window.
      - The third position: For very short SOAs, the brain does not have the temporal resolution to assign the content to a specific time, so the question of whether it was experienced as moving or misremembered is meaningless (inapplicable). But at longer SOAs (but still within the illusion range), it becomes applicable and Stalinesque is correct.

    However, note that DC might say that the integration window is fixed, so for SOAs longer than the window, the illusion doesn't occur, and for SOAs within the window, it does and is Stalinesque. The third position is actually a variant of DC that allows for a graded transition? But we present it as:

    - This third position is a genuine alternative? Or is it a redescription of DC? 
      - DC already implies that the distinction is only applicable when the integration occurs. So for SOAs too short for any processing? That doesn't make sense because the SOA is the time between stimuli. The processing latency is after the stimuli.

    We can state: The third position is that the Stalinesque/Orwellian distinction is only well-posed when the SOA is long enough that the processing of the first stimulus is complete before the second occurs, but short enough that the integration window can still bind them. But in the standard phi, the SOA is too short for that. Therefore, the distinction is inapplicable in the standard case. This is a different charge from arbitrariness: it's not that we cannot know, but that the question doesn't make sense.

    How do the panelists view it?
    - MD: Will say that the distinction is arbitrary at all SOAs, so the third position is just a variant of their view for the short SOA case, but they extend arbitrariness to all cases.
    - DC: Will say that the distinction is well-posed and Stalinesque is correct when the integration occurs, and inapplicable when it doesn't (long SOA). But for the standard phi, it is applicable and Stalinesque.

    So the third position is a redescription of DC? Not exactly, because DC says it's Stalinesque in the standard case, while the third position might say that in the standard case (very short SOA) it's inapplicable. So it's a genuine third position that both might dismiss.

    We'll have each panelist say:
      - MD: The third position is a variant of our view because it denies a determinate fact in the short SOA case, but we extend that to all cases.
      - DC: The third position is incorrect because in the standard color phi (with SOA around 100ms) the integration window is long enough to include both flashes, and the experience is determined after the second flash, so the Stalinesque account is correct and the distinction is applicable.

  - **Crux 2: What does a report-timing manipulation reveal?** (This will be expanded in the experiment section.)

  - **Crux 3: Can we isolate a neural correlate that determines the content of the experience?** If we can find a neural event that correlates with the reported experience and occurs after the second flash, does that support DC? Or does MD say that any such event is just one draft among many?

  **4. Concrete Experiments**

  We focus on a report-timing manipulation.

  - **Experiment:** Present the color phi display (with a fixed SOA, say 100ms). Require subjects to make a forced report at varying times after the first flash. The report times are:
    - Very early: before the second flash (e.g., 50ms after the first flash). At this point, only the first flash has occurred and the second has not.
    - Early: after the second flash but before the typical integration window closes (e.g., 150ms after the first flash, which is 50ms after the second flash if SOA is 100ms).
    - Late: well after the integration window (e.g., 500ms after the first flash).

    The report is forced: subjects must immediately report what they are experiencing at that moment, without time for reflection.

  - **Predictions:**
    - MD: At the very early report, subjects will report only the first flash (or nothing if too early). At the early report, they might report something inconsistent (e.g., the first flash only, or an incomplete motion) because the narrative is not fixed until probed. At the late report, the full illusion narrative will be reported. The content of experience is not fixed until the probe.
    - DC: At the very early report, subjects report the first flash. At the early report, they might report the full illusion (if the integration window has closed) or something in flux (if the window hasn't closed). But if the integration window is, say, 150ms from the first flash, then at 150ms they will report the full illusion. At the late report, they report the same illusion. The content is fixed after the integration window.

    The critical point is the early report (after second flash but before the typical integration time). 
      - If at the early report, subjects report the full illusion, that supports DC because the content is composed quickly.
      - If they report only the first flash, that might support MD (if the narrative isn't fixed) or DC if the window hasn't closed yet.

    But note: the integration window in DC might be very fast. We need to know the typical window.

    Alternatively, we can have SOA as a variable and report time as another.

  - **Embarrassing results:**
    - For MD: If at the early report (just after the second flash) subjects consistently report the full illusion, that would challenge MD because it suggests the content is fixed very early, without waiting for the probe.
    - For DC: If at the early report subjects do not report the full illusion (e.g., they report two flashes) but at the late report they do, that would challenge DC because it suggests the content is not fixed until later (and might be revised).

  - **Other illusions:** We note that both camps might want a uniform treatment of the cutaneous rabbit illusion, flash-lag effect, and backward masking. 
    - MD: Prefers a unified account in terms of multiple drafts and the absence of a fixed time of consciousness.
    - DC: Prefers an account in terms of temporal integration windows for each.
    - However, it is a partisan desideratum: MD would argue that a uniform account without a fixed temporal window is better, while DC would argue for a uniform account with temporal integration. They both desire uniformity but in their own framework.

  **5. Closing on Verbal Disputes**

  We consider if part of the dispute is about the phrase "the content of experience at t".

  - MD: Denies that there is a definite content at a specific time t. Thus, the phrase is misleading.
  - DC: Argues that we can assign a content to an experience that is determined at a time (after the integration) but referred to the time of the stimulus.

  The verbal aspect: The meaning of "the content of experience at t". 
    - If "at t" means the time when the experience occurs (i.e., when it is present in consciousness), then DC would say it occurs at a time after the integration, while MD denies that there is a specific time.
    - If "at t" means the time the experience represents (the stimulus time), then both agree that the content refers to the time of the stimuli.

  We recommend that the workshop adopt the following usage: 
    - Use "the content of experience" without specifying a time for the experience itself, and when necessary, specify the represented time. This avoids the ambiguity.

  However, the core dispute is substantive: about the temporal dynamics of conscious content.

  **Structure of the Document**

  We write the document in a neutral tone, as a joint statement.

  ---

  **Joint Document: Agreed Facts and Open Questions on the Color Phi Illusion**

  **Introduction**

  This document, agreed upon by both panelists, outlines the common ground and the points of disagreement regarding the color phi illusion and its implications for the timing of conscious experience. The goal is to focus the discussion on what is genuinely at issue. We first state the agreed claims about the color phi phenomenon, then present the key disagreements, identify cruxes that might resolve them, propose experimental tests, and finally reflect on the nature of the dispute.

  **1. Agreed Claims**

  Both parties affirm the following about the color phi illusion:

  1. The display consists of two spatially separated lights, flashed in rapid succession with a stimulus onset asynchrony (SOA) typically between 50 and 200 milliseconds. The lights are of different colors (e.g., green then red).

  2. Subjects consistently report seeing a single dot that moves from the first location to the second and changes color (e.g., from green to red) midway along the apparent path. This report occurs even when subjects know the true sequence.

  3. Visual processing involves neural delays. The initial response to a flash takes time (on the order of tens of milliseconds) to reach the visual cortex, and further processing is required for conscious perception. The second flash occurs before the processing of the first is complete.

  4. The illusion is robust and compelling, indicating a perceptual phenomenon rather than a cognitive error.

  5. Subjects cannot reliably discriminate, based on introspection, between two hypothetical scenarios: (a) an experience in which the dot actually moved and changed color mid-trajectory (Stalinesque), and (b) an experience in which they saw two discrete flashes but then misremembered them as a moving dot that changed color (Orwellian).

  6. The content of the experience is influenced by neural events occurring after the onset of the stimuli.

  7. The illusion depends on SOA: it occurs at short SOAs but breaks down at longer SOAs, where subjects report two distinct flashes.

  **2. Disagreements**

  The following table summarizes the main disagreements. For each issue, we provide a formulation that the respective defender would endorse, and we classify the disagreement as substantive (S), verbal (V), or unresolved (U) as to which.

  | Issue | Multiple Drafts (MD) Formulation | Delayed-Composition (DC) Formulation | Verdict |
  |-------|----------------------------------|--------------------------------------|---------|
  | **1. Nature of the conscious experience during phi** | There is no determinate fact about the content of consciousness at any given moment during the illusion. The narrative of apparent motion and color change is fixed only when probed (e.g., when the subject reports), and there is no principled basis for choosing between a Stalinesque (real-time illusion) and Orwellian (retroactive revision) account. | The conscious experience is of a moving dot that changes color midway, determined after the second flash within a temporal integration window. This account is Stalinesque: the subject genuinely experiences the motion and color change; it is not a memory distortion. | S |
  | **2. The Cartesian theater** | The multiple drafts model rejects the Cartesian theater — a central place in the brain where consciousness happens at a specific time. Content becomes conscious by entering into a wide network of cognitive processes, without a definite timing. | The delayed-composition model also rejects the Cartesian theater as a spatial locus. It posits temporal integration windows as a neural mechanism that binds stimuli over time, but this does not imply a theater. | U (Unresolved as to whether the difference is substantive or verbal; the parties agree on rejecting a spatial theater but disagree on whether temporal integration implies a functional equivalent.) |
  | **3. Arbitrariness of the Stalinesque/Orwellian distinction** | The distinction is arbitrary because there is no fact of the matter about when content becomes conscious. Thus, we cannot say whether the illusion was experienced as it happened (Stalinesque) or misremembered (Orwellian). | The distinction is non-arbitrary: the Stalinesque account is correct for the color phi illusion (within the integration window), and the Orwellian account is incorrect. There is no evidence of misremembering; the experience itself is illusory. | S |
  | **4. Temporal location of conscious content** | There is no definite time at which a content becomes conscious. Consciousness is a matter of a content's availability to various cognitive processes (e.g., reporting, memory, attention), not its presentation at a specific time. | Conscious content is assigned a time based on the stimulus, but the content itself is determined after the integration window. The experience is referred to the time of the stimuli. | S |

  **3. Cruxes**

  To advance the debate, we identify key questions (cruxes) that might resolve the disagreements:

  - **Crux 1: Does the Stalinesque/Orwellian distinction become non-arbitrary as SOA lengthens?**
    - MD: No, the distinction remains arbitrary at all SOAs because there is no fact of the matter about when content becomes conscious.
    - DC: In the color phi illusion, the SOA is within the integration window, and the Stalinesque account is correct. For longer SOAs (beyond the window), the illusion breaks down, and the distinction is inapplicable because there is no illusion.

    We also consider a third position: that the Stalinesque/Orwellian distinction is not arbitrary but inapplicable for very short SOAs (below a certain processing latency) because the brain lacks the temporal resolution to assign the content to a specific time. At longer SOAs (within the integration window), it becomes applicable and Stalinesque is correct.
      - MD: This third position is a variant of our view for the short SOA case (denying a determinate fact), but we extend arbitrariness to all SOAs.
      - DC: This third position is incorrect for the standard color phi (SOA ~100ms). The integration window is long enough to bind the flashes, and the experience is determined after the second flash, so the distinction is applicable and Stalinesque is correct.

  - **Crux 2: What is the effect of varying the time of report?** (See the experiment below.)

  - **Crux 3: Can a neural correlate of the experience be isolated?** If a neural event that correlates with the reported experience occurs after the second flash and before report, does that support DC? Or does MD argue that such an event is just one of many drafts and does not fix the content until probed?

  **4. Experimental Test: Report-Timing Manipulation**

  We propose an experiment to test the predictions of the two models.

  - **Method:** Present the color phi display (SOA fixed at 100ms). Require subjects to report their experience at one of three times after the first flash, cued by a tone:
    - T1: 50ms (before the second flash, which occurs at 100ms).
    - T2: 150ms (50ms after the second flash; within the typical integration window).
    - T3: 500ms (long after the integration window).
    The report must be immediate (e.g., pressing a button for one of several options: "one flash", "two flashes", "moving dot", etc.).

  - **Predictions:**
    - MD: At T1, subjects will report only the first flash. At T2, they may report an incomplete or inconsistent narrative (e.g., "one flash" or "a flash and then something else") because the content is not fixed. At T3, they will report the full illusion.
    - DC: At T1, subjects report the first flash. At T2, they report the full illusion (if the integration window is ≤150ms). At T3, they also report the full illusion.

  - **Embarrassing results:**
    - If at T2 subjects consistently report the full illusion, this challenges MD because it suggests the content is fixed without waiting for the probe.
    - If at T2 subjects do not report the full illusion (e.g., they report two flashes) but at T3 they do, this challenges DC because it suggests the content was revised after the integration window.

  - **Note on other illusions:** Both camps agree that the color phi illusion should be explained in a way that is consistent with other temporal illusions (e.g., cutaneous rabbit, flash-lag, backward masking). However, they differ on whether a uniform treatment requires:
    - MD: A unified account without a fixed temporal window, emphasizing the role of probing in fixing content.
    - DC: A unified account based on temporal integration windows (which may vary by modality and task). 
    Thus, uniformity is a shared desideratum, but the type of uniformity is partisan.

  **5. Closing: The Nature of the Dispute**

  Part of the dispute concerns the phrase "the content of experience at time t". 
  - MD: Argues that this phrase is misleading because there is no definite time at which content becomes conscious.
  - DC: Interprets "at time t" as the time the experience represents (the stimulus time) and holds that the content is determined at a later time.

  We recommend that the workshop adopt the following to minimize verbal confusion:
    - Avoid "the content of experience at t" without clarification. 
    - Use "the content of experience" (without a time) for the experienced content, and specify the represented time when necessary.

  However, the core disagreement is substantive: it concerns the temporal dynamics of conscious content and whether it is determined at a specific time or only upon probing.

  **Conclusion**

  This document outlines our common ground and the points of ongoing disagreement. We hope the workshop will focus on the cruxes and experimental tests identified, which may help resolve the debate.

  [End of document]
answer: |-
  ### Joint Statement on the Color Phi Illusion: Agreed Facts and Disputed Issues  
  **Agreed upon by both panelists for the Workshop on the Timing of Conscious Experience**  

  ---

  #### **1. Agreed Claims on Color Phi**  
  Both parties endorse the following statements without reservation. These are empirically grounded and theory-neutral:  

  1. **The display**: Two spatially separated lights are flashed in succession. The first light is one color (e.g., green), the second another (e.g., red), with a stimulus onset asynchrony (SOA) between 50–200 ms.  
  2. **Subject reports**: Observers consistently report a single dot moving from the first location to the second, changing color (e.g., green to red) midway along its apparent path. This occurs even when observers know the true stimulus sequence.  
  3. **Neurophysiological constraints**:  
     - Neural conduction and processing latencies ensure that the second flash occurs before cortical processing of the first flash completes.  
     - Early visual responses (e.g., in V1) are stimulus-bound and localized, while motion and color integration involve higher areas (e.g., MT/V5).  
  4. **Discriminative incapacity**: Observers cannot introspectively distinguish whether:  
     - They experienced motion/color-change *during* the illusion (Stalinesque), or  
     - They experienced two discrete flashes but *recalled* them as continuous motion with color-change (Orwellian).  
  5. **SOA dependence**: The illusion only occurs at short SOAs (typically ≤200 ms). At longer SOAs, observers report two distinct, stationary flashes.  
  6. **Post-stimulus processing**: Neural activity after the second flash influences the final reported experience.  

  ---

  #### **2. Disagreements Table**  
  The table below summarizes key disputes. "Substantive" denotes incompatibility in predictions or mechanisms; "verbal" indicates terminological divergence; "unresolved" signifies insufficient data.  

  | Issue at Stake | Multiple Drafts (MD) Formulation | Delayed-Composition (DC) Formulation | Verdict |  
  |----------------|----------------------------------|--------------------------------------|---------|  
  | **Determinacy of timing** | No fact exists about when motion/color-change content becomes conscious. The distinction between Stalinesque (real-time illusion) and Orwellian (retroactive revision) is arbitrary. | Motion/color-change content is composed deterministically within a temporal window closing ~100–200 ms post-second-flash. The Stalinesque account is correct; Orwellian is empirically unsupported. | Substantive |  
  | **Nature of temporal integration** | Content is "probed" by report or behavior, fixing the narrative retroactively. No "finish line" marks when processing yields consciousness. | Perception integrates stimuli within a fixed temporal window (~100–200 ms), after which content is conscious and stable. | Substantive |  
  | **Applicability of Stalinesque/Orwellian** | The distinction is always arbitrary: no experiment can resolve it, even at longer SOAs. | The distinction is non-arbitrary within the integration window. At longer SOAs (>200 ms), the illusion dissolves, making the distinction irrelevant. | Substantive |  
  | **Status of the "Cartesian theater"** | Rejects any literal or functional theater where content "appears" at a specific time. Consciousness is distributed and probe-dependent. | Rejects a spatial theater but endorses temporal windows as mechanistic. "Theater" is a strawman misrepresenting temporal binding. | Verbal |  

  ---

  #### **3. Cruxes**  
  Resolving these sub-questions could shift one party’s position.  

  - **Crux 1: Does the Stalinesque/Orwellian distinction become non-arbitrary as SOA lengthens?**  
    - **MD**: No. Lengthening SOA only delays probing; the distinction remains arbitrary.  
    - **DC**: Yes. At SOAs near the integration window’s limit (e.g., 150–200 ms), content is determined post-second-flash (Stalinesque). Beyond this, no illusion occurs.  
    - **Third position**: The distinction is **inapplicable below a processing latency threshold** (e.g., <50 ms SOA) due to neural noise, but well-posed above it.  
      - *MD view*: This is a variant of our position (arbitrariness ≈ inapplicability).  
      - *DC view*: This conflates inapplicability with mechanism; we accept it as complementary but not exhaustive.  
    - **Verdict**: Genuine third position (neither MD nor DC).  

  - **Crux 2: Is conscious content fixed before report?**  
    If content is stable *before* probing, MD is weakened; if not, DC is challenged.  

  - **Crux 3: Does temporal integration require a "buffer"?**  
    If yes, DC gains support; if no, MD’s distributed processing is strengthened.  

  ---

  #### **4. Concrete Experiments and Predictions**  
  **Experiment: Report-timing manipulation**  
  - **Method**: Color phi display (SOA = 100 ms), with forced reports cued at:  
    - T1: 50 ms post-first-flash (before second flash).  
    - T2: 150 ms post-first-flash (50 ms post-second-flash; within DC’s integration window).  
    - T3: 500 ms post-first-flash (long after integration).  
    Reports are speeded (e.g., button-press: "one flash," "moving dot," etc.).  
  - **Predictions**:  
    | Condition | MD Prediction | DC Prediction | Embarrasses |  
    |-----------|---------------|---------------|-------------|  
    | T1 | "One flash" (incomplete draft) | "One flash" (second flash not integrated) | Neither |  
    | T2 | Variable reports ("one flash," partial motion); no consensus | "Moving dot with color-change" (integration complete) | MD if consistent illusion reports |  
    | T3 | "Moving dot with color-change" (narrative fixed) | "Moving dot with color-change" (content stable) | DC if reports differ from T2 |  
  - **Key embarrassment**:  
    - Consistent T2 illusion reports challenge MD (content fixed pre-probe).  
    - T2 reports of "two flashes" followed by T3 illusion reports challenge DC (content revised post-integration).  

  **Uniform treatment of illusions**:  
  - Both agree cutaneous rabbit, flash-lag, and backward masking involve temporal distortions.  
  - **Shared desideratum**: A unified account of all four illusions.  
  - **Partisan split**:  
    - MD seeks a probe-dependent narrative account.  
    - DC seeks a temporal-window integration account.  

  ---

  #### **5. Closing: Verbal vs. Substantive Disagreements**  
  - **Verbal dispute**: The phrase "the content of experience at *t*" is ambiguous.  
    - MD: "At *t*" mistakenly implies content is determinate *at time t*.  
    - DC: "At *t*" refers to content *representing* time *t* (e.g., the stimulus moment), even if composed later.  
  - **Recommendation**: Use "content of experience" without temporal indexing (*t*). For temporal reference, specify:  
    - *Represented time* (when the experience seems to occur).  
    - *Processing time* (when neural processes yield content).  
  - **Substantive core**: The dispute centers on whether conscious content has a *determinate processing time* or is probe-dependent. This is not merely verbal; it concerns the architecture of consciousness.  

