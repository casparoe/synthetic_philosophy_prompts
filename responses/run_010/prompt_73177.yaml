answer: |-
  ## MEMO: Funding Recommendation & Rubric Reform  
  **To:** Grants Committee  
  **From:** [Your Name], Faculty Seat  
  **Date:** 27 May 2024  
  **Subject:** Decision on FY24 Grants & Reforming Our Rubric  

  ---

  ### I. THIS CYCLE’S FUNDING RECOMMENDATION: **SPLIT ($250k to A, $100k to B)**  
  Despite the rubric’s arithmetic outcome (B:50 > A:25), we **cannot ignore context** when deploying $350k. Our bylaws bind us to the rubric, but they permit splitting awards. Here’s why a split is justified:  

  - **The Rubric’s Blind Spot:** It treats "neglectedness" as a static virtue, ignoring *degree*. Proposal A’s "1" isn’t merely "non-neglected"—it’s backed by giants. Our $250k here isn’t diluted; it’s **leverage**: scaling proven work *faster* in a state where 40% of 3rd graders read below grade level. Marginal impact per dollar remains high precisely because infrastructure exists.  
  - **B’s High Risk/High Neglect:** B’s "5" in neglectedness is valid—nobody funds this. But its "2" in tractability (PI-estimated 20% success chance) demands caution. $100k funds Phase 1 (protocol drafting), reserving Phase 2 (stress-testing) for future approval *if* milestones are met. This honors the rubric’s top rank while hedging risk.  
  - **Avoiding Mediocrity:** Splitting avoids funding a hypothetical "4×4×4=64" middle-ground project. We back one proven scaler and one moonshot—not compromise for its own sake.  

  **→ Award: $250,000 to Proposal A; $100,000 to Proposal B (contingent on Phase 1 deliverables).**  

  ---

  ### II. RUBRIC FLAWS & PROPOSED CHANGES FOR FY25  
  Our current rubric **confuses "what is good" with "what is good for *us* to fund."** Multiplying ordinal scores implies equal intervals between ratings (e.g., that a "5" is 5x a "1"), which is statistically indefensible. Worse, it fails to capture **marginal value added by *our specific dollars***.  

  **Proposed Revisions:**  
  1. **Replace Multiplication with Criteria Weighting:**  
     - Keep 1–5 ratings for *Importance*, *Tractability*, and *Neglectedness*.  
     - **Add a 4th Criterion: *Marginal Impact* (1–5):**  
       *"How much additional value does our grant add, considering other funders, stage of project, and our size? (1 = Minimal/unlikely to change outcomes; 5 = Pivotal/critical path enabler)"*  
     - **Scoring:** Average the two highest scores among *Importance*, *Tractability*, and *Neglectedness*, then **multiply by *Marginal Impact***.  
       *Why?* Forces explicit debate on leverage, discounts low scores if another criterion is stellar, and centers our unique role.  

  2. **Redefine "Neglectedness"** to reflect **funding gaps**, not just topic novelty:  
     *"Rate 1–5 based on: (a) lack of credible funders in this space, and (b) whether our grant would meaningfully alter the project’s likelihood of success or scale."*  

  3. **Mandate "Impact Narratives":** PIs must summarize why *our specific grant* (not generic funding) is decisive. Committees must dissect claims.  

  ---

  ### III. ADDRESSING CONCERNS ABOUT PROPOSAL B  
  To colleagues who see B as a "speculative vanity gamble": **You’re right to be wary.** A 20% success chance is sobering. But consider:  
  - **Our Niche:** Large funders avoid high-risk protocol work. Our $100k isn’t "staking our whole year"—it’s 29% of our budget to probe a systemic gap. If it fails, we kill Phase 2. If it works, we enable future funding.  
  - **Accountability:** We’ll require quarterly reports and a go/no-go checkpoint at 12 months. No deliverables? No more funding.  
  - **The Alternative:** Funding only "sure things" cedes innovation to entities 100x our size. Is our role merely to fill cracks in others’ foundations?  

  ---

  ### IV. PATH FORWARD  
  1. **Vote Monday** on the split award ($250k to A, $100k to B).  
  2. **Debate rubric changes** (details above) for FY25. Amendments need 4/6 votes.  
  3. **Stress-test the new rubric** on 3 past proposals by August.  

  Our duty isn’t to arithmetic, but to impact. The current rubric oversimplifies; the proposed fix forces us to ask: **"With limited funds, where do we matter most?"** That’s a harder question—and worth the fight.  

  // Signed //  
  [Your Name]  

  ---

  **Key Arguments Preempted:**  
  - *"But B scored higher!"* → And we’re funding it—just not betting everything on 20% odds.  
  - *"We’re overruling the rubric!"* → No—splitting is allowed, and we applied it. The rubric is a tool, not a tyrant.  
  - *"B is vanity!"* → Maybe. But it’s cheap R&D for a foundational gap. Phase 1 is a $100k test.  
  - *"A doesn’t need us!"* → Scaling evidence-based literacy *now* has urgency. Our dollars buy speed where it counts.
