  Okay, let me approach this complex request systematically. The user is a doctoral candidate in formal epistemology working on epistemic utility theory, specifically addressing how practical stakes might integrate into an accuracy-first framework through their proposed Cost-Calibrated Accuracy (CCA) approach. 

  The core challenge is designing a substantive dialogue between Iris (accuracy-first purist) and Owen (pragmatic encroachment advocate) that rigorously tests CCA while meeting six specific analytical requirements. The case study involving Ada the engineer provides concrete numerical parameters for testing.

  First, I need to ensure both characters argue at high competence levels. Iris must defend probabilism and conditionalisation dominance arguments while acknowledging where stakes might create pressure points. Owen should challenge the apparent stakes-neutrality of scoring rules while conceding mathematical constraints. 

  For the technical execution, I'm focusing on:
  - Properness preservation under CCA's cost-weighting mechanism
  - The 1:20 vs 1:3 cost ratio implications
  - Expected accuracy calculations for the second radiograph
  - Partition granularity as potential escape route
  - Moral vs practical cost extension

  The dialogue must demonstrate the key tension: if cost-weights attach to states, properness breaks; if to propositions, reports distort probabilities. I'll have Owen perform the Brier score calculation showing expected accuracy maximisation at 0.30 despite costs, forcing him to either concede synchronic impotence or abandon properness.

  For the second radiograph, I'll compute the expected accuracy difference between acting now vs waiting, showing CCA increases the value of evidence acquisition under asymmetric costs. This addresses requirement 2 quantitatively.

  When the cost ratio shifts to 1:3 later, Owen's position requires credence change without evidence - a major philosophical hurdle. Iris will pounce here, forcing Owen to either defend doxastic voluntarism or retreat.

  The colleague disagreement scenario (requirement 4) exposes deeper issues: if both use proper rules, their expected accuracy calculations can't conflict unless scoring different partitions. This may be CCA's only substantive lever.

  On properness abandonment (requirement 5), Iris' dominance argument defence must acknowledge that admissibility constraints could appear question-begging - a real vulnerability Owen should exploit.

  Finally, the moral costs extension (requirement 6) pressures Iris to distinguish practical from moral stakes or admit both belong in scoring rules - a concession that might unravel her position.

  Throughout, British English conventions will be strictly maintained. The conclusion will crystallise the impasse: Iris cannot accept cost-sensitive admissibility without surrendering stakes-neutrality; Owen cannot retain properness while getting substantive stakes-sensitivity.
answer: |-
  ## Dialogue: Cost-Calibrated Accuracy Under Fire
  *(Iris and Owen stand before a whiteboard in a cluttered seminar room. Equations from the morning’s lecture linger beneath Ada’s bridge scenario, now central.)*

  **Owen:** Right, Iris. Your student’s proposal, Cost-Calibrated Accuracy. CCA wants to keep properness sacred but sneak stakes in via the scoring rule’s admissibility. Specifically: a rule `s` is only admissible if it’s proper *and* its relative penalties for false positives and false negatives track, at the agent’s credence, the ratio of practical costs for those errors. Let’s test it on Ada. `cr(p) = 0.30` after the first radiograph. Costs: acting on a false `p` (false positive) costs £4m. Failing to act on a true `p` (false negative) risks catastrophe, cost ratio 1:20. What does CCA tell Ada to believe about `p`?

  **Iris:** It depends entirely on the scoring rule satisfying (i) and (ii). But *if* such a rule exists and is proper, then Ada’s credence `0.30` maximises her expected accuracy *by definition*. Properness guarantees that the credence function itself is the best estimate of its own expected score. So, synchronic belief? Still `0.30`. Your stakes haven’t budged the needle. Point one looks fatal: CCA buys Owen nothing synchronic unless it breaks properness.

  **Owen:** Ah, but *does* such a rule exist? Let’s grant properness. Condition (ii) says the scoring rule’s penalties must track the cost *ratio* `1:20` at Ada’s credence `0.30`. We need `s(1, x)` for reporting credence `x` when `p` is true and `s(0, x)` when false. The relative penalty for being wrong when `p` is false (`s(0,1)`) vs. when `p` is true (`s(1,0)`) should reflect the cost ratio. Intuitively, misreporting `p` as true when it’s false (costly detour) should be penalised more harshly than misreporting it false when true (catastrophe) *precisely because* the former mistake is *less costly* in this scenario? No, wait—

  **Iris:** You’ve inverted it. The *cost* of a false positive is high (£4m) *if `p` is false*. The *cost* of a false negative is catastrophic *if `p` is true*. But the *scoring rule penalty* `s` is applied based on the *state of the world* and your *report*. To reflect the practical asymmetry, the penalty `s(0, x)` for being *wrong by being too high* (`x` near 1) when `p` is false should be *harsher* than the penalty `s(1, x)` for being *wrong by being too low* (`x` near 0) when `p` is true. The ratio `[s(0,1) / s(1,0)]` should track `[Cost(FP) / Cost(FN)] = 20/1 = 20`. Being wrong when `p` is false matters more *practically*, so the accuracy penalty for that type of error should be higher.

  **Owen:** Precisely. So, let’s try embedding this in a standard rule. Take the simple log score: `s(1, x) = -ln(x)`, `s(0, x) = -ln(1-x)`. Proper, yes. But the ratio of penalties for total misreporting is `[ -ln(0) / -ln(1) ]` – undefined! Not helpful. Use the quadratic (Brier) score. Standard: `s(1, x) = (1-x)^2`, `s(0, x) = (0-x)^2 = x^2`. Penalty for FP (report high when false): `s(0,1) = (1)^2 = 1`. Penalty for FN (report low when true): `s(1,0) = (1-0)^2 = 1`. Ratio `1/1=1`. But we need `20`. So, introduce weights. First reading: weight the *states*. Define `s_w(1, x) = w_T * (1-x)^2`, `s_w(0, x) = w_F * x^2`. To get penalty ratio `s_w(0,1)/s_w(1,0) = (w_F * 1) / (w_T * 1) = w_F / w_T = 20`. So set `w_F = 20`, `w_T = 1`. Now, is this proper? Expected score for reporting `y` when credence is `c`:
  `E[s_w] = c * [w_T * (1-y)^2] + (1-c) * [w_F * y^2] = c * 1 * (1-y)^2 + (1-c) * 20 * y^2`
  Minimise E[s_w] w.r.t `y`. Derivative: `dE/dy = c * 1 * [-2(1-y)] + (1-c)*20*[2y] = -2c(1-y) + 40(1-c)y`
  Set to zero: `-2c + 2cy + 40y - 40cy = 0`
  `y(-2c + 40 - 40c) = 2c`
  `y(40 - 42c) = 2c`
  `y = 2c / (40 - 42c)`
  For Ada’s `c=0.30`, `y = 2*0.3 / (40 - 42*0.3) = 0.6 / (40 - 12.6) = 0.6 / 27.4 ≈ 0.022`. Not `0.30`! This rule is *improper*. The recommended report `y` is distorted away from the credence `c`. This violates (i). CCA’s conditions clash.

  **Iris:** Exactly. You attached weights to the states. The rule ceased being proper. Expected accuracy maximisation no longer recommends reporting your true credence. This breaks the dominance arguments for probabilism. If Ada uses this rule, she thinks reporting ~`0.02` is *more accurate* in expectation than reporting `0.30`! That’s absurd and forfeits the core justification for probabilism. Your stakes destroyed the framework.

  **Owen:** Conceded. State-weighting breaks properness. Second reading: weight the *propositions* scored, not the states. Define a new scoring rule `s_p` just for `p`. Set `s_p(1, x) = a * (1-x)^2`, `s_p(0, x) = b * (x)^2`. Condition (ii) requires `b / a = 20` (penalty ratio for full misreports). `b = 20a`. Now, expected score for reporting `y` on `p` when `cr(p)=c`:
  `E[s_p] = c * [a(1-y)^2] + (1-c) * [b y^2] = c * [a(1-y)^2] + (1-c) * [20a y^2]`
  Minimise w.r.t `y`: `dE/dy = c * a * [-2(1-y)] + (1-c)*20a*[2y] = 2a [ -c(1-y) + 20(1-c)y ]`
  Set to zero: ` -c + cy + 20y - 20cy = 0`
  ` y(c - 20c) + 20y = c`
  ` y(-19c) + 20y = c`
  ` y(20 - 19c) = c`
  ` y = c / (20 - 19c)`
  For `c=0.30`, `y = 0.30 / (20 - 19*0.30) = 0.30 / (20 - 5.7) = 0.30 / 14.3 ≈ 0.021`. Again, `≈0.021`, not `0.30`! Still improper. Same distortion. Point one seems confirmed: any attempt to weight penalties to reflect cost ratios *at the agent’s credence* breaks properness. Synchronic belief remains `0.30`. Owen gains nothing.

  **Owen:** A significant concession: if CCA requires the rule to be proper *and* have these cost-relative penalties *at the agent’s current credence*, it forces belief to remain at the conditional probability. Stakes don’t shift synchronic credence. My initial target was misplaced. But let’s not bury CCA yet. Perhaps the cost-ratio tracking isn’t indexed to the *current* credence, but is a fixed feature of the rule for that proposition in that context? Or perhaps the work is diachronic or in partition choice. Point two: the second radiograph. Costs same 1:20 ratio. Conditional probs: `P(+|p)=0.8`, `P(+|¬p)=0.1`. Delay cost: negligible compared to risks? Ada must decide whether to get it. Expected accuracy gain under CCA vs symmetric rule? Iris, how do we compute the expected value of learning for a proper rule?

  **Iris:** For any proper rule, the expected score *after* learning report `y*` (the credence post-learning) is better than before. The *value* of the experiment is the expected reduction in score. With symmetric Brier, prior `c=0.30`, likelihoods given. Posterior if `+`: `P(p|+) = [0.3*0.8] / [0.3*0.8 + 0.7*0.1] = 0.24 / (0.24+0.07) = 0.24/0.31 ≈ 0.774`. Posterior if `-`: `P(p|-) = [0.3*0.2] / [0.3*0.2 + 0.7*0.9] = 0.06 / (0.06+0.63) = 0.06/0.69 ≈ 0.087`. Expected Brier score before learning: `c*(1-c)^2 + (1-c)*c^2 = 0.3*(0.7)^2 + 0.7*(0.3)^2 = 0.3*0.49 + 0.7*0.09 = 0.147 + 0.063 = 0.210`.
  Expected Brier after: `P(+) * [q_+(1-q_+)^2 + (1-q_+)q_+^2] + P(-) * [q_-(1-q_-)^2 + (1-q_-)q_-^2]` where `q_+ = 0.774`, `q_- = 0.087`.
  ` = P(+) * [2q_+(1-q_+)] + P(-) * [2q_-(1-q_-)]` (since `y(1-y)` is minimal expected Brier for credence `y`).
  `P(+) = 0.31`, `P(-)=0.69`.
  `E[Brier|after] ≈ 0.31 * [2*0.774*0.226] + 0.69 * [2*0.087*0.913] ≈ 0.31*[0.350] + 0.69*[0.159] ≈ 0.31*0.350 + 0.69*0.159 ≈ 0.1085 + 0.1097 ≈ 0.2182`.
  Value `≈ 0.210 - 0.2182 = -0.0082`? That can’t be right. Expected score *should decrease* (improve). I see: `y(1-y)` is the *minimum* expected Brier for credence `y`. But the *actual* expected Brier *if you report `y`* when your credence is `y` *is* `y(1-y)`. So:
  Before: Min expected Brier = `c(1-c) = 0.3*0.7 = 0.21`.
  After `+`: Min expected Brier = `q_+(1-q_+) ≈ 0.774*0.226 ≈ 0.175`.
  After `-`: Min expected Brier = `q_-(1-q_-) ≈ 0.087*0.913 ≈ 0.079`.
  Expected Min Brier after = `P(+)*0.175 + P(-)*0.079 ≈ 0.31*0.175 + 0.69*0.079 ≈ 0.05425 + 0.05451 ≈ 0.10876`.
  Value of learning `= E[Min after] - Min before ≈ 0.10876 - 0.21 = -0.10124`. Negative? Impossible. Calculation error. `P(+) = cr(+) = cr(p)P(+|p) + cr(¬p)P(+|¬p) = 0.3*0.8 + 0.7*0.1 = 0.24 + 0.07 = 0.31`. Yes. `q_+(1-q_+) = 0.774*0.226≈0.174924`. `q_-(1-q_-)=0.087*0.913≈0.079431`. `E[Min] = 0.31*0.174924 + 0.69*0.079431 ≈ 0.05424644 + 0.05480739 ≈ 0.10905383`. Min before = `c(1-c)=0.3*0.7=0.21`. Value `= 0.10905383 - 0.21 = -0.10094617`. Still negative! Ah, I forgot: the minimal expected score for prior `c` is not the score you get *before* learning, but the score you’d get if you could report based on the *true state* – which you can’t. Before learning, with credence `c`, you report `c`, and the expected score *is* `c(1-c)^2 + (1-c)c^2 = c - 2c^2 + c^3 + c^2 - 2c^3 + c^3` wait no. Brier: `E[s] = c*(1-c)^2 + (1-c)*(0-c)^2 = c(1-2c+c^2) + (1-c)(c^2) = c - 2c^2 + c^3 + c^2 - c^3 = c - c^2`. For `c=0.3`, `0.3 - 0.09 = 0.21`. Correct. After learning, you report the posterior. Expected score if you see `+` and report `q_+`: `q_+*(1-q_+)^2 + (1-q_+)*(q_+)^2 = q_+ - 2q_+^2 + q_+^3 + q_+^2 - 2q_+^3 + q_+^3 = q_+ - q_+^2` Same formula! Expected score after reporting the optimal `y*` (the posterior) is `q(1-q)` for posterior `q`. So `E[Score after] = P(+)*[q_+(1-q_+)] + P(-)*[q_-(1-q_-)] ≈ 0.31*0.174924 + 0.69*0.079431 ≈ 0.10905383`. Expected score before reporting `c`: `c(1-c) = 0.21`. So the *expected score improves* by `0.21 - 0.10905383 ≈ 0.10094617`. The value is positive `≈0.101`.

  **Owen:** Now, under CCA. Suppose Ada uses our proposition-weighted rule for `p`: `s_p(1,x)=a(1-x)^2`, `s_p(0,x)=b x^2 = 20a x^2`. We saw it’s improper, but let’s compute the expected minimal score before and after to see the value. First, minimal expected `s_p` for credence `c`: From earlier, it’s achieved by reporting `y = c / (20 - 19c)`. Plugging in `c=0.30`, `y≈0.021`. Then `E_min[s_p | c] = c * [a(1-y)^2] + (1-c)*[b y^2] = a [ c(1-y)^2 + 20(1-c)y^2 ]`.
  With `y≈0.021`, `(1-y)≈0.979`:
  `≈ a [ 0.3*(0.979)^2 + 20*0.7*(0.021)^2 ] ≈ a [ 0.3*0.958 + 14*0.000441 ] ≈ a [ 0.2874 + 0.006174 ] ≈ a*0.293574`.
  Now after seeing `+`, posterior `q_+≈0.774`. Minimal `s_p` report `y_+ = q_+ / (20 - 19q_+) ≈ 0.774 / (20 - 19*0.774) = 0.774 / (20 - 14.706) ≈ 0.774 / 5.294 ≈ 0.146`.
  Minimal expected `s_p` given `+`: `q_+ * [a(1-y_+)^2] + (1-q_+) * [b y_+^2] = a [ q_+(1-y_+)^2 + 20(1-q_+) y_+^2 ]`
  `≈ a [ 0.774*(1-0.146)^2 + 20*0.226*(0.146)^2 ] ≈ a [ 0.774*(0.854)^2 + 4.52*0.021316 ] ≈ a [ 0.774*0.729316 + 0.09638832 ] ≈ a [ 0.5645 + 0.0964 ] ≈ a*0.6609`.
  After seeing `-`, posterior `q_-≈0.087`. Min report `y_- = q_- / (20 - 19q_-) ≈ 0.087 / (20 - 19*0.087) = 0.087 / (20 - 1.653) ≈ 0.087 / 18.347 ≈ 0.00474`.
  Minimal expected `s_p` given `-`: `q_- * [a(1-y_-)^2] + (1-q_-) * [b y_-^2] = a [ q_-(1-y_-)^2 + 20(1-q_-) y_-^2 ]`
  `≈ a [ 0.087*(1-0.00474)^2 + 20*0.913*(0.00474)^2 ] ≈ a [ 0.087*(0.99526)^2 + 18.26*0.0000224676 ] ≈ a [ 0.087*0.99054 + 0.0004103 ] ≈ a [ 0.086177 + 0.0004103 ] ≈ a*0.0865873`.
  Now, Expected Min `s_p` after learning = `P(+)*MinE_+ + P(-)*MinE_- ≈ 0.31*(a*0.6609) + 0.69*(a*0.0865873) ≈ a [ 0.31*0.6609 + 0.69*0.0865873 ] ≈ a [ 0.204879 + 0.059745237 ] ≈ a*0.264624237`.
  Expected Min `s_p` before learning ≈ `a*0.293574`.
  So Value of learning = `E[Min before] - E[Min after] ≈ a(0.293574 - 0.264624237) ≈ a*0.028949763`.
  Compared to the symmetric Brier value of `≈0.101`, this `≈0.029a` depends on `a`. But since `a` is just a scaling factor, the *relative* value compared to symmetric Brier depends on how we normalise. Crucially, the value is *positive*. But is it *different*? The key is the *magnitude relative to the cost scale*. With `b=20a`, the penalty for a full FP is `s_p(0,1)=b*1^2=20a`, while for symmetric Brier it was `1`. The costs are scaled up by roughly `20a`. The value under asymmetric scoring `≈0.029a`, while under symmetric it was `0.101`. If we want comparable scales, perhaps set `a` such that the maximum penalty (FP) is the same. In symmetric Brier, max penalty per proposition is `1`. Here max penalty (FP) is `20a`. Set `20a = 1`, so `a=0.05`. Then Value CCA `≈ 0.029*0.05 = 0.00145`. Value symmetric `≈0.101`. So under this normalisation, the value of the second radiograph under CCA is *much smaller* (`0.00145` vs `0.101`)! CCA *reduces* the expected accuracy gain of getting more evidence relative to symmetric Brier. That’s the *opposite* of what pragmatic encroachment should want! High stakes should make you *more* eager for evidence to reduce the chance of catastrophic error. Here, CCA makes the evidence seem less valuable accuracy-wise. Point two: CCA might *decrease* the expected accuracy value of acquiring evidence in high-stakes scenarios. That’s perverse.

  **Iris:** A crucial concession on my part: you’ve shown that under CCA with proposition-weighting, the *formal* value of learning can be positive, but its *magnitude* relative to the cost scale can be diminished compared to symmetric scoring. This undermines the idea that CCA neatly captures stakes-sensitivity in learning. But point three: three months later, costs shift to 1:3, no new evidence. Ada’s credence based on the radiograph is still 0.30. What changes under CCA?

  **Owen:** If the rule must now track the cost ratio `1:3` at her credence `0.30`, and remain proper, it’s impossible without reverting to symmetry or breaking properness. If the rule is fixed earlier to track the 1:20 ratio, it’s still locked into those penalties. Her credence shouldn’t change without evidence. But intuitively, shouldn’t she be *more* willing to act, or perhaps less anxious, when the cost of a false positive falls relative to the false negative? If belief guides action, and stakes shifted, perhaps her *credence for practical purposes* shifts. But CCA offers no mechanism. If the rule changes to track the new ratio `1:3`, requiring `b/a=3`, then for the same credence `c=0.30`, the minimal expected score report becomes `y = c / (3 - 2c)`? From earlier formula `y = c / (b/a - (b/a - 1)c)` with `b/a=R=3`. `y = c / (3 - 2c) = 0.30 / (3 - 0.60) = 0.30/2.40 = 0.125`. But this is the report that maximises expected accuracy *under the new rule*, not her credence! Her credence is still `0.30`. CCA doesn’t tell her to *change* her credence to `0.125`; it tells her that if she uses *this new rule*, she should report `0.125` to maximise expected accuracy *according to that rule*. Her underlying credence, based on evidence, is untouched. CCA is inert synchronic belief revision without new evidence. Owen must either accept this or abandon evidentialism.

  **Iris:** And point four: disagreement. Ada (costs 1:20) uses rule `R1` with `b/a=20`. Her colleague Bert, writing a paper (costs 1:1), uses symmetric Brier (`b/a=1`). Both rules are proper. Ada believes `p` to degree 0.30. Bert believes `p` to degree 0.30. They report different numbers only if they are asked to report the *number that minimises expected score under their own rule*. For Ada using `R1`, that’s `y≈0.021`; for Bert using Brier, it’s `0.30`. But these are different *actions* (reporting different numbers), not necessarily different beliefs. Their underlying credence, based on the radiograph, is the same `0.30`. They agree on how likely `p` is given the evidence. They disagree only on what number to *announce* as optimal under their different scoring rules. This isn’t genuine doxastic disagreement about the world; it’s a disagreement about what constitutes a good report given different practical concerns baked into their accuracy measures. The granularity of the partition scored doesn’t resolve this; both are scoring the same proposition `p`. CCA generates a difference in recommended *utterance*, not necessarily in belief state.

  **Owen:** A damning point for CCA’s stakes-sensitivity: it only shifts what you *say* to minimise expected penalty under your local rule, not what you *believe*. The belief itself remains determined by evidence and conditional probability, stakes-blind. If this is all pragmatic encroachment amounts to, it’s toothless. So perhaps I must abandon properness. Suppose I use a modest rule that *licenses* shading. For Ada, since a false negative is catastrophic, maybe she should lower her credence threshold for belief or report below `0.5`. But formally: define a scoring rule that is not proper. For example, a weighted Brier `s(1,x)= (1-x)^2`, `s(0,x)= k * x^2` with `k=20`, knowing it’s improper. Then, as we saw, Ada maximises her expected accuracy by reporting `y ≈ 0.021`, not `0.30`. She believes `p` is *very* unlikely, despite her evidence suggesting `0.30`! This seems epistemically reckless. But it directly reflects the costs: avoiding the huge penalty for crying wolf when `p` is false. Iris, you’ll say this forfeits the dominance argument.

  **Iris:** Precisely. If Ada uses this improper rule, she may be non-probabilistic. A probabilistic agent using a *proper* rule will accuracy-dominate her. She’s vulnerable to being less accurate *no matter what the world is like*. That’s epistemically unacceptable. Your framework collapses into instrumentalism; accuracy is subordinated to practical goals. The prize – explaining why rationality demands probabilism and conditionalisation – is lost.

  **Owen:** But your admissibility constraints! Truth-directedness, additivity, continuity, propriety. You say they stop the framework collapsing. But *why* accept them? Because they are necessary for your cherished theorems? That’s blatantly circular. “We need propriety to get the dominance argument for probabilism, which justifies propriety.” If the only motivation for propriety is that it enables the derivation of probabilism, and propriety excludes stakes, then stakes are excluded by fiat. The framework is rigged from the start. Your foundation begs the question against stakes-sensitivity.

  **Iris:** A fair challenge. The constraints aren’t *arbitrary*. Truth-directedness is core to accuracy: getting closer to truth is better. Additivity (across a partition) ensures extensibility and avoids gerrymandering. Continuity avoids pathological jumps. Propriety ensures honesty and coherence: you are incentivised to report your true estimate. It makes accuracy *self-policing*. Without propriety, the scoring rule itself distorts the report, severing the link between credence and expected accuracy. The constraints aren’t *just* for the theorems; they embody the idea that epistemic value is solely about fitting the state of the world, undistorted by external goals. Practical costs affect what states of the world we *care* about being wrong in (Owen’s intuition), but not what *constitutes* being wrong. That’s the line.

  **Owen:** Point six: moral costs. Suppose `p` is "Dr Nye falsified data". A false positive ruins him. Cost ratio, say, 1:10 (falsely accusing vs failing to catch fraud). If CCA extends, then my scoring rule for `p` must weight penalties by 1:10. But this means the epistemically rational report, under a proper rule, is still the credence (`0.30` say), while the expected-accuracy-maximising report under an improper CCA rule would be shaded low to avoid accusing. If CCA doesn’t extend, why not? Both are costs of error. Iris, your principled line?

  **Iris:** The line is this: epistemic value concerns only *epistemic* costs – costs intrinsic to being wrong about the world. The practical or moral *consequences* of error are downstream. They affect what we investigate, what actions we take based on belief, but not the standard of fit itself. A scoring rule penalises lack of fit; it doesn’t penalise causing harm. Baking moral costs into the scoring rule conflates epistemology with ethics. If Owen wants moral stakes to affect belief itself, he must argue that moral error *is* epistemic error. That’s a heavy lift. CCA should not extend.

  **Owen:** But if practical costs are admitted via CCA, why not moral? Both are external consequences of error. Iris’s distinction seems ad hoc within CCA’s own mechanism. If the channel exists for practical costs, why block moral ones? This exposes the tension: either costs are epistemic (and both types might be), or they aren’t (and neither should be in the scoring rule).

  **The Crux**
  **Iris:** The impasse is clear. Owen must abandon the core accuracy-first justification – the dominance argument for probabilism – to get substantive stakes-sensitivity synchronic belief revision. His shading under improper rules invites dominance. CCA, trying to keep propriety, is inert synchronic belief revision (Point 1, fatal), potentially perverse on evidence value (Point 2), inert under shifting stakes (Point 3), and generates only verbal disagreement (Point 4). The fatal flaw is that any non-trivial cost-weighting breaks propriety. The framework requires stakes-neutral epistemic norms.
  **Owen:** Iris must admit her admissibility constraints, especially propriety, are motivated by the desire to derive probabilism in a stakes-neutral way, making the argument question-begging (Point 5). If propriety excludes stakes by definition, the accuracy-first project cannot adjudicate whether stakes *should* affect belief; it assumes they shouldn’t. CCA’s failure to deliver stems from this prior commitment. The fatal flaw is the unmotivated exclusion of stakes from the *constitution* of accuracy. Points 3 and 6 expose the instability: shifting stakes without evidence and moral costs challenge Iris’s distinction between epistemic and other goods. The framework is stakes-neutral by stipulation, not by proof.
