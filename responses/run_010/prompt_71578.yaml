    - +0.05 to **I** (interventions are measurable)  
    - New **C**: 0.60 → 0.70, **I**: 0.40 → 0.45 → Recalculated: 0.70 × (0.50 × 0.70 × 0.45) × 1.5 × 1.2 = **0.28**  

  **Justification for rule**: Multiplicative structure captures cumulative necessity, while dependency boosts (based on causal/logical links) mitigate underestimation from strict independence. Interpretability’s empirical edge is quantified via discrete probability increments.  

