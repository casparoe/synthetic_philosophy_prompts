  | **I**: Causal invariance | Content survives counterfactual interventions (e.g., ablation/steering doesn’t break consumer success). | 0.40 | Interpretability tools reveal fragile correlations; adversarial patches often disrupt "content" without breaking functionality. |  

  **Additional term**:  
  - **D**: Determinacy | Selection + consumer resolve disjunction (e.g., "fly" not "dot" or "shadow"). *(Folded into **C** and **S**)*  

  #### Combination rule:  
  **P ≈ T × [S × C × I] × D_adjust**  
  - **Base calculation**: 0.70 × (0.50 × 0.60 × 0.40) = 0.70 × 0.12 = **0.084**  
  - **Dependency adjustments**:  
