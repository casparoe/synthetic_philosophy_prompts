answer: |-
  **Spine of the session:** Mill's principle of liberty in *On Liberty* contains an explicit scope condition excluding societies deemed insufficiently "civilized," a condition inseparable from his institutional role and defence of East India Company despotism, revealing liberalism's potential for hierarchical exclusion.

  **Plan Sequence & Timing (Total: 75 mins):**

  1.  **Hook & Core Text Foundation (10 mins):**
      *   Start directly with *On Liberty* Ch.1: Re-read aloud the "despotism" clause ("...barbarians, provided the end be their improvement..."). Ask: *"What work is this clause doing in Mill's argument? Is it central or peripheral?"* Elicit initial reactions. Emphasise it's a fundamental *limiting condition* on the principle's application – liberty applies only where certain capacities exist. *Crucially note:* This is the *only* text they've read mentioning anything outside 'civilized' Europe.

  2.  **Institutional Context: Mill's Day Job (10 mins):**
      *   Introduce Mill's EIC career (17 to dissolution, senior draftsman). Stress: This wasn't a side-hustle; it was his primary occupation shaping his thought and income for 35 years. Highlight his *defence* of Company rule (select committee evidence) as the *practical embodiment* of the "despotism" clause. Frame: *"This isn't biography; it's the institutional reality grounding the theoretical scope condition."*

  3.  **The Pivotal Case: 1857 Rebellion & Aftermath (25 mins):**
      *   **Why this case?** It meets your criteria perfectly. Mill, as Examiner, drafted key despatches defending the Company's *military suppression* and *rejection* of clemency/rapid political reform post-rebellion. Actions like collective punishments or rejecting representative institutions would blatantly fail Mill's own domestic standards (individual liberty, free discussion, progress towards equality). He *knew* this, explicitly arguing such standards couldn't apply yet. The EIC's abolition was the *direct result* – Mill passionately argued against transferring power to the Crown, *defending* the Company's "enlightened despotism" as the best regime for India. **What it shows:** The "despotism" clause isn't abstract; it justified real, violent, illiberal governance *he actively administered and defended*, even against Crown rule he saw as potentially worse but *still despotic*. Avoid deep dive into rebellion causes/atrocities; focus on Mill's *response* and *defence of the system*.

  4.  **Synthesis & Scope Condition (15 mins):**
      *   Connect explicitly: The *On Liberty* clause provides the *theoretical justification* for the *practical governance* Mill spent his life enacting (EIC) and defending (1858). Argue: This isn't a *contradiction* but a *consequence* of the principle's *built-in exclusion*. Liberalism, for Mill, has a civilizational threshold. Discuss briefly how his view of India's "backwardness" (inherited from James Mill's *History*) informed this threshold. *Key Question:* "Does this scope condition invalidate his liberalism, or is it an inherent part of its structure for him?"

  5.  **Misconception Preemption & Discussion (10 mins):**
      *   **"Mill is straightforwardly racist"**: Preempt during **Step 3** when explaining his view of India's "backwardness." State clearly: *"Mill's justification relied on stadial theory (civilizational stages), not primarily biological race. This distinction matters for understanding *how* the exclusion worked, even if the outcome is similarly oppressive. His arguments in *Subjection* show he didn't believe capacity was biologically fixed."*
      *   **"India material is an aberration"**: Preempt at the *start* of **Step 4**. *"Given that his entire working life was consumed by governing India under this principle, can we plausibly bracket it? Does the *On Liberty* clause look like an 'aside' now?"*
      *   **"Man of his time"**: Actively head off in **Step 3** when discussing his post-1857 defence. *"Contemporaries like John Bright argued *against* despotism and *for* Indian representation. Mill chose *his* position actively, defending the system he helped run."*
      *   **Chennai Student's "bizarre framing"**: Acknowledge *implicitly* in the **Introduction/Spine** and *explicitly* in **Step 4**. Frame the *whole session* as examining *"how liberal principles can contain justifications for domination"*. In synthesis: *"The 'bizarreness' might stem from the tension between universalist liberal claims and this specific, civilizational exclusion – a tension Mill lived daily."* Seek her perspective here.

  6.  **Diagnostic Question & Conclusion (5 mins):**
      *   **Question:** *"Did Mill compromise his liberal principles when governing India, or did his liberal principles, as defined in *On Liberty*, inherently permit – even require – governing India differently? What's the key evidence?"* Forces distinction between "contradiction" (he betrayed his principles) and "scope condition" (the principles defined their own limits).
      *   **Openly Stated Limits (State early in Step 1 or 2):**
          *   "We *won't* be covering the detailed historiography of the East India Company's rule or its overall impact – that's a vast field."
          *   "We *won't* be resolving deep philosophical debates about the concept of 'civilization' or whether such a threshold *can* be justified – our focus is on understanding *how and why Mill applied it* as he did."
          *   "This is about understanding the *structure* of Mill's thought and its institutional context, *not* delivering a final verdict on 19th-century imperialism."

  **Critical Component if Time Runs Short (Lose 20 mins):**
  Sacrificing **Step 3 (The 1857 Case)** would collapse the session. Without a concrete example showing Mill *applying and defending* actions that violate his domestic principles *using the scope condition justification*, the link between the *On Liberty* clause and his institutional role remains abstract and unconvincing. Steps 1 & 2 set up the puzzle; Step 3 provides the crucial, undeniable evidence of the principle *in action*. If cut, the core argument (the spine) lacks its essential demonstration. Prioritise getting to the core of 1857 & Mill's response even if biographical detail or synthesis discussion is truncated.
