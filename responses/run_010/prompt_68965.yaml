  3.  Your setup of the causal decision theorist (CDT) in 1 is standard and uncontroversial; it's correctly presented as the contrast case relying on causal independence.
  4.  Strengthen the justification in 3 for why "the product doesn't recover" is the default (elaborate briefly on why priors over similarity structures likely suppress average δ as N grows large); cut the "reorganize careers" hyperbole in 2, as it's unnecessary for the core argument.
