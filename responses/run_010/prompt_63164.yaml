answer: |-
  *(Leaning against the doorframe, massaging her temple as if pushing through one of her migraines)*  
  You mistake me. I don’t deny the Communists’ discipline or their networks—I’ve seen it crush dissent in Barcelona, and watched it turn unions into transmission belts. Precisely *because* they’re the best-organized machine, handing them legitimacy as a permanent bloc in an assembly entrenches their pathology: the substitution of real thought for enforced unanimity. Your proportional scheme makes parties the sole conduits of power. Delegates bound by discipline? That’s not representation; it’s the metastasis of the very mechanism that turns men into functionaries of a collective fiction. When the party demands they endorse a lie—say, denying the Moscow trials or backing colonial repression—they’ll obey. Because the machine’s growth depends on it.  

  Yes, I’ve used organizations—the CGT for factory access, your Free French bureaucracy for this desk. But using a tool doesn’t oblige me to weld it permanently into the state. We need structures that force deliberation, not delegation. Let the Resistance movements form a provisional council to oversee elections—then dissolve. Have local communes and syndicates send delegates mandated for specific tasks, recallable instantly if they betray their mandate. No permanent blocs. No party labels on the ballot. Force candidates to stand as individuals accountable to territorial or vocational assemblies. Your pre-written program? A plebiscite reduces the people to *oui* or *non*. How does that cultivate the capacity for judgment we’ve fought to restore?  

  You ask where the harm lies in disciplined blocs. Tell me: When your socialist faction’s leadership compromises with the Communists over, say, the fate of Indochina or factory seizures, and orders its delegation to vote against its own members’ conscience—what body exists to check that? What procedure allows a delegate to say “this violates our purpose” without being recalled? If the only counterweight is another party’s bloc, haven’t we just mechanized factional war?
