  Okay, the user is working on their dissertation chapter about the epistemology of exemplary narrative, specifically focusing on a methodological preface in Plutarch's *Life of Alexander*. They've hit a wall interpreting Plutarch's claim that trivial incidents reveal character better than grand historical events. The user has considered two readings—evidential (unguarded moments) and expressive (whole person present)—but finds the portrait painter analogy doesn't fit either. They also note a third possible reading about "concentration" of likeness but can't articulate it.  

  Hmm, the user is clearly deep in literary theory and ancient historiography. Their frustration is palpable—they've done the philological work but are stuck on conceptual framing. The core tension they've identified is brilliant: Plutarch *says* he privileges small moments yet *writes* about big events. That paradox needs unpacking.  

  First, let's dissect why the painter analogy breaks their initial readings. The "evidential" reading (unguarded moments) doesn't map because portrait sittings are deliberate performances. The "expressive" reading (whole person in micro-moments) fails because eyes alone don't contain the whole sitter. So what *is* Plutarch doing?  

  Ah—the key is semiotic hierarchy. Portrait painters prioritize facial features because they carry disproportionate *semiotic density* for identity recognition. Similarly, Plutarch argues that trivial acts are epistemically privileged not due to spontaneity or wholeness, but because they condense character into legible signs. A general might perform greatness in battle (where circumstance obscures agency), but a careless joke reveals *habitus*—the ingrained disposition beneath the role.  

  This resolves the paradox: Plutarch disparages "great deeds" as *historical events* (where contingencies muddy character-assessment) but still uses battles/sieges as narrative scaffolding. His innovation is reading those grand events *against* trivial moments to isolate character. When Alexander weeps over Darius' family (*trivial* for a conqueror) or loses temper at a banquet (*ungrand*), those become hermeneutic keys to reinterpret his sieges and laws.  

  The user's misstep? Assuming Plutarch's critique of "great deeds" means *excluding* them. Actually, he's critiquing their *interpretive sufficiency*. The analogy supports neither evidential nor expressive readings because it's about *semiotic efficiency*: eyes give maximum identity-information per unit of artistic labor, just as anecdotes give maximum character-information per unit of narrative space.  

  ...Wait, did the user imply that generalship is "jointly authored"? That's perceptive! Plutarch *does* see history as overdetermined—which makes isolated character impossible to discern in complex events. But in a jest? The soul acts alone. That's why concentration matters: it isolates agency.  

  Final thought: The user needs to hear that Plutarch's method is *diagnostic*, not documentary. Grand deeds are symptoms; small acts are biopsies.
answer: |-
  Your interpretive wall stems from an insightful tension between Plutarch's methodological claim and his narrative practice—and the painter analogy is indeed the key. Let's dissect the claims step by step, resolving the paradox you've identified.

  ### Core Claim: **Semiotic Concentration, Not Evidential or Expressive Primacy**
  Plutarch's argument is neither purely evidential (unguarded moments) nor expressive (whole person in micro-acts). Instead, he advocates for a **semiotic hierarchy**: certain signs (trivial acts, facial features) *concentrate* character more efficiently than others. The painter analogy supports this:  
  - **Portraitists prioritize the face/eyes** because these features hold disproportionate *semiotic density* for identity and character. A likeness resides in specific focal points, not distributed evenly across the body.  
  - Similarly, **trivial acts (remarks, jests)** are privileged because they function as **synecdoches of the soul**—condensing ethical essence into minimal gestures.  

  ### Why "Great Deeds" Are Epistemically Inferior for Plutarch
  1. **Noise vs. Signal**:  
     Grand deeds (battles, sieges) are obscured by contingency:  
     - External factors (luck, subordinates, geography) dilute agency.  
     - Strategic calculation masks innate virtue/vice (e.g., a tyrant may fight bravely to preserve power).  
     Trivial acts, by contrast, are "low-stakes" expressions where *habitus* (embodied character) shines through unprompted.  

  2. **Scale Distorts**:  
     Plutarch implies that monumental events require collective effort and circumstantial framing, making them poor indicators of *individual* moral quality. A jest, however, is "unauthored" by externals.  

  ### The Third Reading: **Character as Focal Essence**
  The principle you seek is **hermeneutic efficiency**:  
  - Likeness (character) is concentrated in *diagnostic* signs, not because the "whole person" is *contained* in them (expressive reading), but because they **reveal governing dispositions** that *interpret* the whole.  
  - Example: Alexander's violent rage at Cleitus (a banquet remark) retroactively colors his battles as expressions of *philotimia* (ambition) rather than pure heroism. The trivial act becomes a hermeneutic key.  

  ### Resolving the Paradox of Plutarch's Practice
  You rightly note that the *Lives* overflow with grand events. Plutarch isn’t dismissing them; he’s **subordinating them to characterology**:  
  - Great deeds become **sites to apply insights** gleaned from trivial moments.  
  - The preface declares his focus: *Battles/sieges are narrative scaffolding; the soul’s "indications" (σημεῖα τῆς ψυχῆς) are the true subject*.  
  - Why include battles? Because ancient biography demanded them. His innovation is reframing them as **manifestations of character**, not history-for-history’s-sake.  

  ### Where Your Reconstruction Stumbles
  Your evidential/expressive dichotomy assumes Plutarch privileges trivial acts for their *authenticity* or *completeness*. But the analogy reveals his deeper aim: **diagnostic efficacy**.  
  - **Step off-path**: You sought a binary ("better sign" vs. "complete sign") when Plutarch offers a **hierarchical model of signs**.  
  - **Critical misstep**: Assuming "disparaging great deeds" means *excluding* them. For Plutarch, their flaw is *epistemic*, not narrative. They lack **semiotic efficiency** for character revelation—but remain essential as theaters where character *plays out*.  

  ### Plutarch’s Grounds for "Disparagement"
  He can critique grand deeds because:  
  1. **They are overdetermined**: Multiple causes (virtue, luck, tactics) blur ethical clarity.  
  2. **They require interpretation through trivial lenses**: A general’s strategy may only be "readable" via his earlier offhand boast or irritation.  

  ### Conclusion: The Epistemology of Synecdoche
  Plutarch’s method is **synecdochic hermeneutics**: trivial acts are **concentrated sites of legibility** that unlock the moral logic of a life. The painter analogy licenses this by showing that likeness resides in focal points, not totality. Your "third reading" is thus **semiotic concentration**—where character is discerned not through scale, but through *diagnostically potent micro-signs*. This grounds his project: exemplary narrative derives power from revealing *souls*, not chronicling events.  

  **Recommendation for your chapter**: Frame Plutarch as pioneering a **moral semiotics of scale**, where biography’s truth-claims rest on privileging the microscopically legible over the monumentally ambiguous. This bridges his theory (preface) and practice (battle-filled *Lives*).
