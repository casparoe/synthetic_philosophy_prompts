prompt: |-
  I'm co-running a small reading group that's been alternating between Lewis on convention and some of the newer stuff on how norms actually change, and last week one of our members — she's an economist — argued that the two literatures are describing the same thing, with the QWERTY keyboard as her exhibit. Her line went like this: nobody picked QWERTY for its merits, it beat out better layouts early on for contingent reasons, and now we're all stuck with it because it's individually irrational to retrain on Dvorak however much you'd prefer a world where everyone typed Dvorak. And that, she said, is just what a convention is on Lewis's account — arbitrary, self-enforcing, and only movable if something big and central moves everybody at once. She then turned it on the norm she actually cares about (women taking their husband's surname, which she reckons most people in the room privately find hard to defend but keep doing anyway), and the upshot she drew was that working on individual attitudes is a waste of time, that what reformers need is a focal institution — a church, a big employer, a celebrity, whatever plays the role Remington played — and that once it moves, everyone else moves with it and cheaply.

  I half buy it and half don't, and I'd like a proper audit before I write anything up. Can you go down the clauses of Lewis's own definition of convention one at a time — the regularity in behaviour, the near-universal conformity, the expectation that others conform, the conditional preference to conform given that others do, the clause about everyone having roughly the same preferences over the possible combinations of actions, and the bit about there being some alternative regularity that would serve almost as well — and say for each whether the keyboard case actually satisfies it? My hunch is that it doesn't, or not in the interesting way: what keeps me on QWERTY isn't any expectation about what other people are going to do so much as the keyboards that already exist, the muscle memory in my hands, and the sheer cost of retraining, which sounds a lot less like a convention and more like standardisation propped up by capital goods. If that's right I want to know which of the disanalogies actually hurt her argument and which ones she gets to shrug off — I can already hear her saying fine, call it a hybrid, the strategic element is still doing the work. There's also a wrinkle I don't know how much weight to give: as I understand it the usual story about why the layout was designed that way (something to do with typebars jamming) is itself disputed, and someone at the seminar insisted the whole lock-in literature has been answered and the layout was never inferior in the first place. Does any of that change what the example can be made to carry, or is it beside the point?

  Then the payoff question. If the surname norm turns out to be Lewisian rather than QWERTY-ish — and in particular if it fails that clause about everyone sharing the same preferences over outcomes, which would make it a conflict game rather than a clean coordination problem — does it still follow that changing attitudes is useless and that you should be out hunting for a coordinator? And does Sweden flipping to right-hand traffic in 1967, which is the case everyone reaches for when they want to show a convention being moved on purpose, support her or cut against her, given how much state machinery it took to pull off? Please end with a better image than the keyboard if there is one — something that keeps the arbitrariness and the stickiness without smuggling in factories and installed machinery. British English throughout, and no need for references or a reading list, I just want the reasoning laid out plainly.
reasoning: |-
  Okay, let me tackle this step by step. The user is running a reading group on conventions and norms, and an economist member argued that QWERTY keyboard layout and marital surname norms are both examples of Lewisian conventions. The user wants to verify whether QWERTY fits Lewis's definition clause by clause, and then explore implications for norm change strategies.

  First, I need to recall Lewis's exact definition of convention. He specifies several conditions: regularity in behavior, near-universal conformity, mutual expectations of conformity, conditional preference to conform given others' conformity, shared preferences over outcomes, and the existence of a nearly-equally-good alternative. 

  For QWERTY, the regularity and near-universal conformity clearly hold - almost everyone uses it. Expectations also exist - we assume others use QWERTY keyboards. The conditional preference is there too - I'd prefer to use Dvorak if others did, but won't switch alone. 

  But the preference clause is where it gets interesting. Lewis requires that everyone prefers universal conformity to any particular alternative. With QWERTY, that's not really true - typists might prefer Dvorak universally, but keyboard manufacturers care about production costs. This mismatch in preferences across groups weakens the pure convention argument.

  The alternative regularity condition is satisfied though - Dvorak could work as well. 

  The user's hunch about capital goods being key seems right. While strategic expectations play a role, the sunk costs of existing keyboards and retraining are major barriers - more like standardization than pure convention. The disputed history of QWERTY's superiority doesn't change this analysis - what matters is the current lock-in dynamics.

  For the surname norm, if preferences aren't aligned (e.g., some prefer tradition while others want change), it's not a clean coordination game. Changing individual attitudes could matter by shifting the preference landscape. The Sweden traffic example shows coordinated change is possible but requires massive effort - it doesn't prove focal points alone suffice.

  A better analogy than QWERTY might be driving sides - equally arbitrary, no capital goods involved, and clear coordination incentives. Handshaking customs could also work - purely social with no equipment needed.

  The key takeaways: For surname reform, if preferences conflict, changing attitudes may be necessary before any focal shift can work. The economist is half-right about coordination elements, but underestimates how preference misalignment and non-strategic barriers complicate change.
answer: |-
  Here's a clause-by-claudit of QWERTY against Lewis's definition, followed by the payoff on norms and a cleaner analogy:

  **Lewis's Definition & QWERTY: Clause-by-Clause**

  1.  **Regularity in Behaviour:** ✅ Satisfied. There is a widespread regularity: people use keyboards with the QWERTY layout.
  2.  **Near-universal Conformity:** ✅ Satisfied (within the relevant population – typists, computer users). Vast majority conform to using QWERTY.
  3.  **Expectation that Others Conform:** ✅ *Partially Satisfied, but Weaker*. You *do* expect others (colleagues, IT departments, manufacturers) to provide/use QWERTY. However, your core obstacle isn't primarily *predicting* others' behaviour; it's the physical and cognitive lock-in.
  4.  **Conditional Preference to Conform (given others do):** ✅ *Technically Satisfied, but Misleading*. You *would* prefer to use Dvorak *if* everyone else instantly switched too (universal Dvorak). But the *reason* you conform *now* isn't *primarily* conditional on *current* others conforming; it's the immense **sunk costs** (retraining time, muscle memory, buying new hardware, software compatibility). Your preference to stick with QWERTY is largely *unconditional* on others' *immediate* behaviour due to these costs. Switching *even if others did* would *still* be costly for you personally. This feels different from a pure coordination expectation.
  5.  **Everyone has roughly the same preferences over possible combinations of actions:** ❌ **Problematic**. This is where the QWERTY case strains. Lewis implies a *coordination game* like driving sides: everyone fundamentally prefers *any* universal standard to chaos, and is largely indifferent *which* standard prevails (LHD or RHD). With QWERTY:
      *   **Typists:** May strongly prefer universal Dvorak over universal QWERTY (if they believe it's superior). They *don't* have the same preference ordering – they prefer a different equilibrium.
      *   **Keyboard Manufacturers/IT Departments:** Their preference is heavily influenced by **production costs, existing tooling, inventory, and support burden**. They prefer universal QWERTY *because it's cheaper for them right now*, not out of indifference between standards. They might actively *dispre* switching even if others did, due to transition costs.
      *   This heterogeneity in preferences (typists wanting change vs. producers wanting stability due to costs) pushes it away from a pure coordination problem towards a situation with **conflicting interests and significant switching costs**, more akin to a battle-of-the-sexes or asymmetric game with lock-in.
  6.  **There is some alternative regularity that would serve almost as well:** ✅ Satisfied. Dvorak (or other layouts) is presented as a viable, potentially superior alternative. The arbitrariness condition is met.

  **Disanalogies & The Economist's Shrug:**

  *   **Your Hunch is Largely Correct:** QWERTY's stickiness relies heavily on **sunk costs** (retraining, hardware) and **network effects** (compatibility, shared knowledge) rather than *purely* on strategic expectations about others' *current* behaviour. It's "standardisation propped up by capital goods" and accumulated human capital. This *is* meaningfully different from pure conventions like driving sides or word meanings.
  *   **Her Shrug ("Call it a hybrid, strategy still does work"):** She has a point. Strategic expectations *are* present (clause 3 & 4 technically hold, albeit weakly/awkwardly). The *focal point* aspect of the *existing* standard is crucial. The sunk costs make the *status quo* incredibly focal. So, while not a *pure* Lewis convention, the *strategic coordination element surrounding the entrenched standard* is still a major driver of persistence. QWERTY *functions* convention-*like* due to lock-in.

  **The QWERTY History Dispute:**

  *   **Largely Beside the Point for the Convention Argument:** Whether QWERTY was *actually* inferior or its origins were purely contingent is secondary to the *current* dynamic. The relevant fact is that people *believe* a viable alternative exists (Dvorak), making the *current* standard seem arbitrary and potentially suboptimal, yet incredibly sticky. The lock-in literature's core mechanism (sunk costs/network effects) remains valid even if the *initial* superiority claim is disputed. The *perception* of arbitrariness fuels the desire for change, while the reality of costs blocks it.

  **The Payoff: Surnames, Sweden, and Strategy**

  1.  **If the Surname Norm is Lewisian (Pure Coordination):**
      *   ✅ **Changing Attitudes *Individually* is Largely Futile:** If everyone is indifferent between "wife takes name" and "husband takes name" or "hyphenation" *as long as there's one clear standard*, then nagging individuals is pointless. No one has a *strong inherent preference* for the outcome itself, just for coordination. People conform because they expect others to.
      *   ✅ **A Focal Institution is Key:** A prominent shift (e.g., a major institution mandating neutrality, a royal couple choosing differently) could provide the new Schelling point. Once a critical mass expects the new norm, individual preference kicks in to follow it cheaply. Sweden '67 *supports* this: the state acted as the massive, undeniable focal point, coordinating the switch overnight. The *scale* of the coordinator needed (the state) reflects the depth of the existing convention, not a flaw in the theory.

  2.  **If the Surname Norm is *Not* Pure Coordination (Fails the Preference Clause):**
      *   ❌ **Her Conclusion Doesn't Automatically Hold:** If there are **conflicting preferences** (e.g., some strongly prefer the patriarchal tradition, others strongly prefer equality, others dislike hyphenation), it's no longer a clean coordination game. It's a **conflictual norm** or a **battle-of-the-sexes** situation.
      *   ❌ **Changing Attitudes Becomes Crucial:** You *must* shift preferences to make a new equilibrium (e.g., universal neutrality) widely preferred over the old one. A focal shift alone might not stick if a significant bloc actively disprefers the new norm and resists. Individual attitude change builds the coalition *for* a new focal point and reduces resistance *after* it shifts.
      *   **Sweden '67 is Less Directly Applicable:** That was pure coordination (everyone preferred *some* uniform side). Changing a conflictual norm requires both shifting preferences *and* coordination. A powerful focal institution might *impose* change (like a law), but its stability depends on underlying preference shifts.

  **A Better Image: Driving on the Left/Right**

  *   **Arbitrariness:** Equally viable alternatives exist (LHD & RHD).
  *   **Stickiness:** Universal conformity is essential for safety. No one wants to switch alone.
  *   **Mechanism:** Purely based on **mutual expectations** and **conditional preferences**. You drive on the left (in the UK) *because* you expect everyone else to, and you prefer to do so *given* they do (to avoid crashes). Your preference for conformity is directly conditional on others' behaviour *right now*.
  *   **No Capital Goods:** The "equipment" (the road, the car) is fundamentally ambidextrous. The cost of switching is primarily *cognitive/behavioural* (retraining your instincts) and *coordinative* (ensuring everyone switches at once). There's no factory retooling needed for the physical infrastructure itself to accommodate the switch in the way keyboards require new hardware.
  *   **Focal Shift Potential:** Sweden '67 proves a massive, coordinated focal point (the state) *can* flip it, precisely because it *is* a pure coordination convention. The cost was in the coordination effort, not in replacing physical capital.

  **In Short:**

  *   QWERTY is a convention **heavily augmented by sunk costs and network effects**. It satisfies Lewis's clauses awkwardly, especially the preference clause. Your hunch about capital goods is valid.
  *   The economist is **half-right**: Strategic coordination around the *status quo* is vital, making focal shifts powerful. But she **underestimates** how sunk costs dilute the pure coordination dynamic and how preference conflicts (if present in norms like surnames) fundamentally change the game.
  *   For the surname norm: **If it's pure coordination, hunt for a focal institution. If there's preference conflict, changing attitudes is essential groundwork *before* or *alongside* seeking a focal shift.** Sweden '67 supports the focal shift theory *for pure coordination problems*.
  *   **Driving sides** are the cleaner, factory-free image of a Lewisian convention – sticky, arbitrary, and switched by coordinated focal points.

  British English maintained. Reasoning laid out plainly. No references smuggled in.
