answer: |-
  *Stands with one hand resting on the stele, gazing toward the Pynx* You mistake the symptom for the malady, and the remedy for the disease. Was the first vote a monstrous error? Yes. Was the second vote the salvation of justice and our city's honor? Also yes. But you fixate on the *overnight* reversal as if it were mere caprice, like the sea changing its swell with no cause. Hear the true lesson: the horror of that first decree flowed from Cleon whipping the *demos* into a frenzy with talk of rebellion's contagion and the sharp, cruel necessity of terror. It was passion shouting down reason in the marketplace of ideas. Yet what followed? A night where men spoke in their homes, in the workshops, the stoas – weighing Diodotus' counter-arguments about lasting harm, true expediency, and mercy as strength. The *demos* returned not merely 'asked again,' but *reconsidered* with clearer minds. The accident of the trireme? A sign from the gods that time for thought was needed. The city preserved itself *because* its ultimate weapon – the collective, deliberative judgment of its citizens – was allowed to work.

  You see instability; I see the very proof of our strength. In a tyranny, that first murderous decree would stand unchallenged. In an oligarchy, a few angry men might hold fast to their pride. But the *demos*, when given pause and open debate, corrected its own terrible impulse. It learned! That *capacity* – not infallibility, but the ability to hear competing arguments, to reflect, and to choose better when reason prevails – is the marrow of our system. The assembly didn't merely 'change its answer'; it *judged anew* with the benefit of reflection and further speech, proving that discussion *is* the indispensable preliminary to wise action. It is precisely because the many, over time and through open contention of words, can sift folly from sense that I stake my confidence upon them. Now, press me on Sicily – what do you believe that expedition reveals about the *demos*?
