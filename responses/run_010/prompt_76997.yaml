answer: |-
  ### Joint Action Sorting Instrument (Decision Tree)

  **Question 1 (Reducibility):**  
  You see two strangers silently lift opposite ends of a heavy sofa up some stairs. Neither acknowledges the other, but they coordinate their movements. Are they:  
  (A) Acting together *only* because each has matching individual intentions (e.g., "I'll lift my end when they lift theirs")?  
  (B) Acting together because they share a *primitive* "we-intention" that can't be broken down into individual intentions?  
  → **If A**, go to **Question 2**.  
  → **If B**, go to **Question 3**.

  **Question 2 (Common Knowledge):**  
  Two friends plan to paint a fence. One says, "I’ll paint this side if you paint that side." The other nods. Is their joint action possible *only if* both know the other knows the plan (common knowledge)?  
  (A) Yes—without mutual awareness, it’s just two solo acts.  
  (B) No—weaker mutual belief (e.g., each just assumes the other will cooperate) suffices.  
  → **If A**, go to **Question 4**.  
  → **If B**, go to **Question 5**.

  **Question 3 (Obligations):**  
  You and a colleague agree to co-write a report. Halfway through, your colleague ghosts you. Do you have a *legitimate complaint* against them?  
  (A) Yes—joint action inherently creates mutual obligations.  
  (B) No—it’s just rude, but no normative commitment exists.  
  → **If A**, go to **Leaf: Gilbert**.  
  → **If B**, go to **Leaf: Searle** (with caveat: *see conflict resolution*).

  **Question 4 (Obligations):**  
  Same as Q3: colleague ghosts after agreeing to co-write. Legitimate complaint?  
  (A) Yes.  
  (B) No.  
  → **If A**, go to **Question 6**.  
  → **If B**, go to **Question 7**.

  **Question 5 (Agency):**  
  A jury debates a verdict. After hours, they unanimously convict. Is the *conviction itself* an act performed:  
  (A) By the jury *as a group agent*?  
  (B) Only by the individual jurors?  
  → **If A**, go to **Leaf: List & Pettit**.  
  → **If B**, go to **Question 7**.

  **Question 6 (Agency):**  
  Same jury case as Q5. Conviction performed by:  
  (A) The group agent.  
  (B) The individuals.  
  → **If A**, go to **Leaf: Tuomela (we-mode)**.  
  → **If B**, go to **Leaf: Bratman**.

  **Question 7 (Misattribution):**  
  You think you’re lifting a sofa *with* a stranger. Unbeknownst to you, they think they’re just lifting *next* to you. Are you:  
  (A) Still acting jointly? (One party can be wrong.)  
  (B) *Not* acting jointly? (Joint action requires mutual recognition.)  
  → **If A**, go to **Question 8**.  
  → **If B**, go to **Leaf: Deflationary**.  

  **Question 8 (Dissolution):**  
  You and a friend start a game of catch. Mid-game, you walk away without warning. Can you unilaterally *end* the joint action?  
  (A) Yes—it dissolves if one quits.  
  (B) No—ending requires mutual agreement.  
  → **If A**, go to **Leaf: Minimal/Deflationary**.  
  → **If B**, go to **Leaf: Eliminativist?** (with caveat: *see conflict resolution*).

  ---

  ### Leaf Key & Diagnostics  
  *(Positions mapped to combinations)*  
  - **Bratman**: Q1A → Q2A → Q4A → Q6B.  
    *Shared intentions via interlocking individual plans + common knowledge + obligations + individual agency.*  
  - **Searle**: Q1B → Q3B.  
    *Primitive we-intention + no obligations.*  
  - **Gilbert**: Q1B → Q3A.  
    *Primitive we-intention + obligations (joint commitment).*  
  - **Tuomela (we-mode)**: Q1A → Q2A → Q4A → Q6A.  
    *Reducible attitudes + common knowledge + obligations + group agency.*  
  - **List & Pettit**: Q1A → Q2B → Q5A.  
    *Reducible attitudes + weak mutual belief + group agency.*  
  - **Minimal/Deflationary**: Q1A → Q2B → Q5B → Q7A → Q8A.  
    *Reducible attitudes + weak mutual belief + individual agency + misattribution possible + unilateral dissolution.*  
  - **Eliminativist?**: Q1A → Q2B → Q5B → Q7A → Q8B.  
    *Reducible attitudes + weak mutual belief + individual agency + misattribution possible + dissolution requires agreement.*  

  ---

  ### Empty Cells & Contradictions  
  1. **Q1B → Q3B (Searle)**: *Problem*: Searle’s primitive we-intentions *do* imply obligations (he calls them "normative constraints"). **Nudge to Gilbert** if Q3B chosen. *Follow-up*: "If one quits, is it *merely* coordination failure or a *betrayal*?" (Betrayal → Gilbert).  
  2. **Q1A → Q2A → Q4B → ?**: *Empty* (unattractive). Obligations without common knowledge? Unlikely. **Nudge to Minimal** (if Q7A/Q8A) or Bratman (if Q4 misanswered).  
  3. **Q1B → Q3A → ?**: *Incoherent branch*. Q3A sends to Gilbert, but no agency question. *Why*: Gilbert’s "plural subject" implies group agency, but she avoids explicit metaphysical claims. **Route directly to Gilbert**.  

  ---

  ### Indistinguishable Pairs  
  - **Bratman vs. Tuomela**: Tree can’t split if someone rejects obligations (Q4B) but accepts common knowledge (Q2A). *Why*: Both require strong mutual awareness; obligations distinguish them.  
  - **Deflationary vs. Eliminativist?**: Only dissolution question (Q8) separates them. Minimal accounts accept unilateral exit; eliminativists see jointness as illusory, making dissolution irrelevant.  

  ---

  ### Your Six Cases Routed  
  *(Typical answers → Leaf)*  
  1. **(a) Strangers lift cyclist**: Q1A (reducible) → Q2B (weak belief suffices) → Q5B (individual agency) → Q7A (misattribution possible) → Q8A (unilateral dissolution) → **Minimal**.  
  2. **(b) WhatsApp letter**: Q1A → Q2B (no drafting consensus) → Q5B (no group agent) → Q7A (some may misattribute) → Q8A (anyone can leave thread) → **Minimal**.  
  3. **(c) "We decided" with acquiescence**: Q1B (primitive "we") → Q3A (obligations: "we decided" implies commitment) → **Gilbert**.  
  4. **(d) Co-authored paper**: Q1A → Q2A (shared plan) → Q4A (obligations: co-authorship norms) → Q6B (individuals act) → **Bratman**.  
  5. **(e) Jury with reluctant member**: Q1A → Q2B (no common knowledge of true beliefs) → Q5A (verdict by group agent) → **List & Pettit**.  
  6. **(f) Catch with robot arm**: Q1A (reducible: robot’s "intention" programmed) → Q2B (weak belief) → Q5B (individual agency) → Q7B (misattribution impossible? *Robotics twist*) → **Deflationary** (if A), **Eliminativist?** (if B).  

  ---

  ### Each Leaf’s Weakest Case  
  - **Bratman**: (c) Acquiescing partner—lacks explicit "meshing" intentions.  
  - **Searle**: (e) Reluctant juror—primitive we-intention absent in coerced agreement.  
  - **Gilbert**: (a) Strangers—no joint commitment formed.  
  - **Tuomela**: (b) WhatsApp letter—participants may lack we-mode reasoning.  
  - **List & Pettit**: (d) Co-authorship—asymmetric contributions challenge group agency.  
  - **Minimal**: (c) "We decided"—thin accounts miss normative weight.  
  - **Eliminativist?**: (f) Robot catch—adaptive coordination suggests genuine jointness.  

  ---

  ### Notes on Your Mandated Questions  
  - **"Obligations" (Q3/Q4)**: Works as one question—norms are core to Gilbert/Bratman vs. Searle/Minimal.  
  - **"Dissolution" (Q8)**: Good robotics fit. But "unilateral vs. joint" may conflate *entering* vs. *exiting* commitment. Reframed as exit conditions.  
  - **"Misattribution" (Q7)**: Sharp for human-robot cases. Forces folk-intuition vs. theory.
