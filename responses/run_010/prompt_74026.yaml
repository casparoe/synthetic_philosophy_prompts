answer: |-
  ### **Dear Practical Wisdom**
  My sister and I are twins in almost every way: same clerk’s wage, same small flat rent, same chronic asthma, same living alone. Yet her monthly support award is £142 higher. My file notes I "convert resources efficiently" – which is true, I suppose. I’ve learned to love free walks, library books, the early bus when it’s quiet. I’m not badly off, really! But why the difference? It feels like I’m being penalised for making do.
  — *Puzzled in Preston*

  ---

  ### **Dear Puzzled,**

  How thoughtful of you to write, and how clearly you’ve laid out the situation. It’s always unsettling when outcomes diverge between similar cases, especially with family. Let’s see if we can untangle this. The agency’s assessments hinge on observed *actions*, not hypothetical freedoms. If a support entitlement—say, subsidised theatre tickets—exists but you never claim it, the system can only record the absence of theatre attendance. It cannot log the *choice* to decline. This creates a documentation gap for those who adapt resourcefully. To bridge it, we advise claimants to formally note forgone entitlements (using Form E-7 "Unutilised Opportunity Log") and submit it quarterly. It’s a tedious fix, but it makes your restraint legible to the assessors.

  Now, a gentle but necessary question: does your sister’s award package—her actual lifestyle, the activities it permits—feel enviable to you? If yes, that suggests her assessed needs align more accurately with her capabilities. If no, that’s equally telling: contentment with less can indicate an *over*-adaptation, a settling that masks unmet potential. Either way, it flags your file for deeper review. Your letter’s quiet pride in managing well is precisely the sort of detail we’d need to explore.

  Which brings me to practical steps for your next review. To ensure your award reflects your full scope, you’ll need to demonstrate a broader range of non-negotiable needs. Start cultivating interests with inherent costs: join a pottery studio (kiln fees add up), take up weekend birdwatching (requiring train fares and optics), or commit to a monthly book club (hardcovers only, no library copies). Crucially, begin a "deprivation diary." Note things you once considered essential but now go without—that weekly bunch of flowers, say, or branded tea. Document the *effort* of going without, not just the fact. Your current happiness with simple pleasures is admirable, but functionally, it operates like undeclared income. The system must see the cost of what you’ve learned to live without.

  Regarding your asthma: the distinction is whether it reduces your fundamental abilities (lifting, sustained exertion) or merely alters how efficiently you convert resources into achievements (e.g., needing taxis instead of buses to reach the same destination). The former lowers your capability threshold and lifts your award; the latter does not. Unfortunately, the standard health questionnaire (Section H) cannot capture this nuance. I’d suggest submitting supplementary letters from your GP and physio, framing it explicitly as a *constraint on ability*, not a *conversion inefficiency*. Be precise: "Unable to walk to work during high-pollen days" is stronger than "Avoids walking when wheezy."

  Do submit a review request immediately. Processing takes 12-16 weeks, and the current Schedule of Core Capabilities (Annex B) is under revision—some argue gardening or hosting dinner parties should be added, others dispute whether accessing digital communities is essential. Until it’s settled, apply under the version that best captures your unrealised potentials. Appeals are lengthy, so optimise the initial application.

  It’s delicate work, aligning support with possibility. I understand the discomfort. My own file once flagged "excessive resilience" after I mentioned finding rainy bus waits pleasant. I now dutifully log my longing for taxis I never take. Submit the forms, Puzzled. Let the system see the weight of what you carry lightly.

  Warmly,  
  *Elinor*  
  *Practical Wisdom Columnist*
