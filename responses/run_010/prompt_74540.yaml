answer: |-
  Below is a decision tree that resolves alignment debates about process vs. outcome supervision. Each branch is a concrete, position-agnostic question. The leaves map to named positions, specifying what to **optimize** (training signal), **measure** (e.g., for validation), and **audit** (post-hoc scrutiny). Key trade-offs and unexplored cells are noted.

  ---

  ### **Decision Tree**

  #### **1. Is the final answer cheaply and reliably checkable in deployment?**
  - **Yes** → Go to Q2.  
  - **No** → Go to Q4.  

  #### **2. If a trace reaches a *correct* answer via an *unsound* route, is this a failure worth penalizing?**
  - **No** → **Leaf A: Outcome-Supervision Purism**.  
  - **Yes** → Go to Q3.  

  #### **3. Is step-level reward a *proxy for the final answer* (credit assignment) or an *independent normative standard*?**
  - **Proxy** → **Leaf B: Process Reward as Credit Assignment Only**.  
  - **Independent standard** → **Leaf C: Process Reward as Standard in Its Own Right**.  

  #### **4. Does demanding self-explanation to a human auditor imply rewarding *every step* (not just the final output)?**
  - **No** → **Leaf D: Policy Supervision** (transcript-independent).  
  - **Yes** → Go to Q5.  

  #### **5. If a trace has an *impeccable process* but a *wrong answer*, does this reveal a reasoning defect?**
  - **Yes** → **Leaf C: Process Reward as Standard in Its Own Right**.  
  - **No (luck deficit)** → **Leaf B: Process Reward as Credit Assignment Only**.  

  ---

  ### **Leaves & Positions**
  | Leaf | Position Name | Optimize | Measure | Audit | What Proponent Must Give Up |
  |------|---------------|----------|---------|-------|-----------------------------|
  | **A** | Outcome-Supervision Purism | Final answer correctness | Final answer accuracy | Process (post-hoc) | Must accept unreliable reasoning (e.g., correct answers via guesswork). |
  | **B** | Process Reward as Credit Assignment Only | Step rewards (as proxy for answer) | Final answer accuracy & step validity | Final answer source | Must accept that step rewards are not intrinsically valuable (only useful if they improve answers). |
  | **C** | Process Reward as Standard in Its Own Right | Step correctness (independent of answer) | Step validity & coherence | Final answer alignment with process | Must accept lower final-answer accuracy if process is "correct" (e.g., in stochastic domains). |
  | **D** | Policy Supervision | Reasoning policy (off-distribution robustness) | Generalization under distribution shift | Test-time compute/robustness | Must accept unverifiable reasoning (no transcript) or reward hacking (steps optimized for auditors). |
  | *Empty Cell* | *Process for Explainability Only* | *N/A* | *N/A* | *N/A* | **Unexplored**: Assumes "explanation" ≠ correctness. Risk: Plausible but wrong steps. |

  ---

  ### **Notes & Clarifications**
  1. **Indistinguishable Positions** (separated by experiment, not questions):  
     - **Leaf B vs. Leaf C** when step rewards *incidentally* align with final answers. Requires A/B testing: If penalizing "correct answer + flawed process" *degrades* final accuracy, Leaf B is falsified.  
     - **Leaf D vs. others** when process is audited post-hoc. Requires testing off-distribution robustness (Leaf D wins if policy generalizes better).  

  2. **Empty Cells**:  
     - **Process for Explainability Only** (reward steps for human usability, not correctness): *Unattractive*—risks deceptive explanations.  
     - **Hybrid Optimization** (e.g., weighted process + outcome loss): *Unexplored*—lacks theoretical justification for trade-off weights.  

  3. **Key Trade-offs**:  
     - **Leaf A** (outcome purism): Efficient but risks reward hacking.  
     - **Leaf B** (credit assignment): Balances efficiency/alignment but conflates process with outcome.  
     - **Leaf C** (process standard): Maximizes interpretability but may ignore answer correctness.  
     - **Leaf D** (policy): Focuses on robustness but requires trust in latent reasoning.  

  ---

  ### **How to Use This Tree**  
  1. Answer questions left-to-right without presupposing your preferred leaf.  
  2. For Leaf B/C ambiguity (Q3/Q5), run experiments:  
     - *Example*: In math, if "correct answer + irrational steps" is penalized (Q2=Yes) and this *improves* generalization, Leaf B is validated. If penalizing "flawed steps" *hurts* performance, Leaf C is incoherent.  
  3. Audit post-hoc only if optimization/measurement fails (e.g., Leaf A uses auditing to catch unsound reasoning).  

  This tree disentangles "process supervision" into:  
  - **Mechanism** (credit assignment vs. standard),  
  - **Goal** (answer correctness vs. reasoning quality),  
  - **Scope** (transcript vs. policy).  
  By resolving Q1–Q5, 80% of circular debates collapse to measurable engineering choices.
