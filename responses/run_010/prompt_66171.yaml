  ☐ **Gift Received** (Proceed to Section 3)
  ☐ **Gift Offered/Given** (Proceed to Section 4)
  ☐ **Hospitality Received** (Proceed to Section 5)
  ☐ **Hospitality Offered/Given** (Proceed to Section 6)
  ☐ **Conflict of Interest Identified** (Proceed to Section 7)

