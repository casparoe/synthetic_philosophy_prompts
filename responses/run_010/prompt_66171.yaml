  **ANNEX A: GUIDANCE NOTES FOR DECLARATION FORM v.4.2e**

  **A. Definitions:**
  *   **Gift:** Any tangible or intangible item, benefit, or service offered voluntarily without, or with only partial, payment by the recipient. Includes cash, vouchers, merchandise, discounts not available generally, services, loans, and preferential terms.
  *   **Hospitality:** The provision of food, drink, accommodation, travel, entertainment, access to events, or other refreshment/service in a social or business setting.
  *   **Conflict of Interest:** A situation where an individual's personal interests (financial, familial, social, political, or otherwise) could improperly influence, or be perceived to influence, their judgment or actions in performing their duties for the Group.
  *   **De Minimis Threshold:** A value below which certain items are generally considered acceptable without prior approval, provided they meet all other criteria (e.g., not cash, not frequent, not linked to pending decisions). Thresholds are absolute monetary values (€) and must be converted accurately using the official Group FX rate on the relevant date.

  **B. The De Minimis Principle & Local Context:**
  *   The thresholds (€20 gifts / €35 hospitality pp) are set to reflect a level considered token or incidental across diverse Group operations. Local currency equivalents (₸) are provided for convenience using the *current* Group FX rate (€1 = ₸400). **Example:** A locally purchased rug costing ₸8,000 falls below the €20 (₸8,000) threshold. A meal valued at ₸14,000 pp falls below the €35 (₸14,000) hospitality threshold.
  *   **Crucially:** The *intrinsic nature* of an item as a gift or hospitality does not change based on local economic conditions or customary practices. The threshold provides a clear, objective monetary line for reporting requirements.

  **C. Timing & Moral Distinction:**
  *   The timing of a gift or hospitality relative to a business decision is a critical factor in assessing propriety. An identical item received *before* a decision creates a significantly higher perception of impropriety and risk of undue influence than the same item received *afterwards* as a token of appreciation for a concluded matter. A gift *during* a pending decision is strictly prohibited. **Document the timing accurately.**

  **D. Transparency as Safeguard:**
  *   The primary indicator of propriety is transparency. A gift or hospitality event that is:
      *   Declared promptly,
      *   Minuted (where appropriate),
      *   Witnessed by other Group personnel,
      *   Accurately recorded and valued,
      inherently carries lower risk and demonstrates adherence to procedure. Conversely, undocumented exchanges, however well-intentioned, lack verifiable context and constitute a breach of policy due to the inability to assess them objectively. **Documentation is not merely administrative; it is a core ethical control.**

  **E. Understanding Social Obligations (Operational Context):**
  *   Employees operating in diverse cultural settings may encounter situations where the giving or receiving of tokens or hospitality forms part of established local custom for building or maintaining relationships. While Group standards are paramount, it is recognised that a *refusal* of such tokens in certain contexts may itself be perceived as a significant breach of local norms, potentially causing offence and damaging essential working relationships.
  *   **Guidance:** The obligations involved are threefold:
      1.  **Obligation to Give:** A perceived duty to offer tokens/hospitality as a sign of respect or relationship maintenance.
      2.  **Obligation to Receive:** A perceived duty to accept such offerings to avoid causing offence or signalling rejection of the relationship.
      3.  **Obligation to Reciprocate:** A perceived duty to return equivalent value in due course to maintain balance and honour.
  *   **Procedure:** Where refusal based on policy grounds would cause significant offence likely to impair operations, the employee must:
      1.  Accept the item if it falls below the *de minimis* threshold and document acceptance on this form.
      2.  If above *de minimis*, politely attempt refusal *once*. If refusal causes clear offence or is persistently refused by the giver, accept the item and **immediately**:
          *   Declare it fully on this form (ticking the 'Received' box in Section 3/5),
          *   Surrender the item to Compliance for disposal/donation, AND
          *   File an Incident Report (IR-F-22) detailing the context and reason for acceptance. **Acceptance above threshold without RCO pre-approval is only permissible under this specific, documented duress condition.**

  **F. Facilitation Payments & Customary Hospitality:**
  *   **Zero Tolerance:** The Group maintains an absolute prohibition on bribery and corruption, including facilitation payments ("grease payments").
  *   **Exception - Customary Hospitality:** Recognising deep-rooted local practices essential for day-to-day operational continuity (e.g., customary refreshments offered during site visits by local dignitaries, traditional meals celebrating milestones unrelated to specific decisions), *non-discretionary, nominal, culturally embedded hospitality* that is a) widely practised, b) not linked to securing or rewarding any specific favour or decision, and c) documented, may be permissible. This is a *narrow exception*. **Refer to GP-ETH-07, Annex C: Non-Discretionary Operational Hospitality Framework.** Any instance must be declared under Section 6, Question 26, with justification.

  **G. Conflicts & Recruitment:**
  *   Conflicts of interest, particularly in recruitment, supplier selection, or contract awards, must be scrupulously avoided and declared. **Recruitment Principle:** All hiring and promotion decisions must be based solely on objective merit, skills, qualifications, and experience relevant to the role, assessed through transparent processes (utilise Annex D: Objective Assessment Matrix). Personal acquaintance, familial ties, or obligations arising from patronage networks, while potentially significant in the local social fabric, **cannot** be factors in Group employment decisions. Implementing objective merit-based recruitment is fundamental to ethical operations and mitigates long-term corruption risks associated with nepotism or favouritism. Declare ANY potential conflict arising from relationships affecting recruitment.

  **H. Compliance Helpline:** Concerns or queries regarding gifts, hospitality, conflicts, or this declaration process can be raised confidentially via the Group Integrity Line: +44 (0)800 555 1984 (24hr) or **integrity.helpline@europeanextractivesgroup.co.uk** (Monitored 08:00-18:00 GMT). Reports can be anonymous where permitted by local law.

  ---
  **END OF DOCUMENT**
