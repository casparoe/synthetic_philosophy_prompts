  8.  **Description of Gift:** (e.g., Item, Voucher, Cash Equivalent) _________________________________________________________
  9.  **Estimated Value (€):** __________
      *   *(If not in €, convert using official Group FX rate on date of receipt: €1 = ₸ ______ )*
