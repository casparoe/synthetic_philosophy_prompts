  ## GROUP GIFT, HOSPITALITY & CONFLICTS OF INTEREST DECLARATION FORM (v.4.2e)

  **Issued under Group Policy:** GP-ETH-07 (Anti-Bribery & Corruption)  
  **Applicability:** All Employees, Contractors, & Associated Persons  
  **Purpose:** To ensure transparency and mitigate corruption risks associated with the giving or receipt of advantages, and to identify potential conflicts of interest.  
  **Instructions:** Complete ALL sections applicable to your circumstances. Submit electronically via GRACE Portal within five (5) working days of the event/realisation. Retain a copy for your records. Consult Guidance Notes (Annex A) for definitions & examples.

  ---

