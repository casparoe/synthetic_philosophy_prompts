  Hmm, the user is preparing for a colloquium presentation on naturalism in ethics. They've developed a position called "pragmatic web-revisionism" that applies Quinean holism to moral principles. Their thesis is that moral principles are posits in the same web of belief as scientific ones, answerable to experience as a whole system, and resolvable by pragmatic maxims like conservatism and simplicity.

  I need to create a question-period sheet with 8-10 objections ordered by likelihood and potential damage. Each objection should be phrased in the idiom of specific subgroups: expressivists/quasi-realists, naturalists like Harman-Sturgeon-Boyd, non-naturalists, philosophers of science, and moral psychologists. For each objection, I'll provide a concise reply, identify soft spots, note concessions to build credibility, and highlight non-negotiable points. I should separate exegetical from substantive objections, suggest time allocation, identify the most critical exchange, and end with the objection they hope nobody raises.

  Let me break this down. The hostile groups include expressivists who might argue that pragmatic maxims don't capture normativity; naturalists who want moral properties to do explanatory work; non-naturalists who doubt pragmatic success tracks truth; philosophers of science who will challenge Quinean exegesis; and moral psychologists who question predictive power.

  For ordering, I'll prioritize based on likelihood and damage. Philosophers of science objections are high-risk due to exegetical pressure; naturalists' concerns about explanatory impotence threaten the core; the expressivist challenge hits normativity; the moral psychologist's prediction issue undermines empirical footing; and the non-naturalist's tracking problem is less immediate but still important.

  For the critical exchange, the naturalist objection about explanatory work is pivotal - if fumbled, it could make the position seem like a surrender. The "hoped-nobody-raises" objection might be about whether pragmatic maxims themselves need justification, risking circularity.

  In structuring replies, I'll aim for conciseness (under two minutes), acknowledge soft spots upfront to build credibility, but hold firm on non-negotiables like the collapse of analytic-synthetic and the parity thesis between scientific and moral posits. Concessions might include admitting pragmatic maxims aren't algorithms or that some moral disagreements are stubborn, but never conceding that moral principles are fundamentally different in kind.
answer: |-
  Below is your question-period battle plan, optimized for this specific audience. Objections are ordered by (likelihood × damage potential), with phrasing tailored to each subgroup's voice. I've flagged exegetical (E) vs. substantive (S) objections and recommended allocating **~60% airtime to substantive issues** (they cut deeper to your thesis) and **~40% to exegetical** (they can derail credibility quickly here). Concessions are marked **[Concede]**, non-negotiables as **[Red Line]**.

  ---

  ### Question-Period Sheet: Pragmatic Web-Revisionism Colloquium

  #### 1. **The Naturalist's Lament: Explanatory Impotence** (S - High Likelihood/High Damage)
     *Phrasing (Harman-Sturgeon-Boyd Naturalist):* "If moral properties aren't *explanatory*—if they don't figure in the best causal account of why, say, social cooperation collapses or institutions reform—why call this *realism*? You've gutted the only reason to be a naturalist moral realist. Isn't this just sophisticated non-cognitivism?"
     *Reply (2 min):* "The *posits* themselves are explanatory within their conceptual scheme, structuring predictions about social phenomena (e.g., 'Societies rejecting fairness norms X will see cooperation decay under stress Y'). The *choice between schemes* is pragmatic, but once chosen, moral properties *are* causally embedded—not as atomic 'spooky' properties, but as nodes in the explanatory web, like 'gene' or 'quark'. Their reality is as robust as the scheme's empirical-pragmatic success."  
     *Soft Spot:* Admits moral properties aren't *fundamental* physical explanations.  
     **[Concede]:** "Moral properties don't explain quark behavior, only patterns in the social-psychological domain."  
     **[Red Line]:** Denying that moral posits play *any* indispensable role in explaining empirical phenomena (e.g., behavior, institutional resilience).

  #### 2. **The Quine Scholar's Trap: Indeterminacy ≠ Underdetermination** (E - Very High Likelihood/High Damage)
     *Phrasing (Philosophy of Science):* "You rely heavily on Quine's underdetermination of theory by evidence to motivate pragmatic choice. But Quine *distinguishes* this sharply from the *indeterminacy of translation*—which is stronger and applies to meaning. Aren't you conflating them? And if moral 'schemes' face indeterminacy, not mere underdetermination, doesn't that collapse into skepticism, not your 'truth-apt' choice?"
     *Reply (2 min):* "I invoke underdetermination only for the *choice between empirically equivalent schemes* organizing the same moral *stimulations* (e.g., pain, conflict, flourishing). This is analogous to choosing between physical geometries. Indeterminacy applies to *radical translation* of alien terms—not our intralinguistic refinement of moral concepts already embedded in our web, guided by pragmatic maxims tracking truth via empirical adequacy."  
     *Soft Spot:* Quine's own sparse comments on ethics suggest he *might* see it as facing indeterminacy.  
     **[Concede]:** "Quine likely viewed ethics as more indeterminate; I extend his *structural apparatus* further than he did."  
     **[Red Line]:** Accepting that moral scheme choice is *merely* indeterminate (non-factual).

  #### 3. **The Expressivist's Core Challenge: Missing Normativity** (S - High Likelihood/High Damage)
     *Phrasing (Quasi-Realist/Expressivist):* "Even if your 'pragmatic maxims' resolve some disputes, they feel entirely *theoretical*—about prediction, simplicity, conservatism. But morality's *normative oomph*—why should I *care* about the 'fecund' scheme?—seems untouched. Isn't this just showing how we *coordinate* our attitudes, not how moral judgments are *true*?"
     *Reply (2 min):* "The 'ought' is built into the *point* of the scheme. We posit moral principles *to systematize and guide* responses to shared human needs and social challenges (avoiding suffering, enabling cooperation). Caring is not an add-on; it's constitutive of the enterprise, just as seeking predictive power is constitutive of science. Pragmatic success *includes* the scheme's ability to normatively guide action in light of experience."  
     *Soft Spot:* Struggles to explain why we *should* engage in the moral enterprise at all.  
     **[Concede]:** "Within a scheme, the 'should' is internal; justifying the whole enterprise might be circular or practical."  
     **[Red Line]:** Conceding that moral judgments lack cognitive content or that their normativity is *wholly* non-representational.

  #### 4. **The Moral Psychologist's Skepticism: Prediction or Post-Hoc Rationalization?** (S - Medium Likelihood/High Damage)
     *Phrasing (Moral Psychologist):* "You claim moral schemes predict 'durability of cooperation' or 'stability of institutions'. But empirically, moral reasoning looks *explanatorily inert* or *post-hoc*. People cooperate or defect based on situational cues, then invent moral reasons. Where's the predictive *friction*? Isn't this just projecting science's virtues onto ethics?"
     *Reply (2 min):* "The predictions aren't about individual acts in isolation, but about *system-level patterns* under defined constraints. E.g., 'A community internalizing norms of reciprocity X will sustain cooperative equilibrium Y under resource stress Z better than one with norms W.' Moral psychology shows *how* norms are internalized and activated—this *is* the mechanism by which the posits gain empirical traction."  
     *Soft Spot:* Evidence for precise, testable moral *predictions* is often sketchy.  
     **[Concede]:** "Moral predictions are often probabilistic and context-sensitive, unlike physics."  
     **[Red Line]:** Agreeing moral principles make *no* testable difference to observable social phenomena.

  #### 5. **The Relaxed Realist's Tracking Worry** (S - Medium Likelihood/Medium Damage)
     *Phrasing (Non-Naturalist Realist):* "Granted, pragmatic virtues help choose useful theories. But why think they track *moral truth*? Science aims at empirical adequacy; morality, presumably, at moral reality. Without a prior grip on moral truth, pragmatism seems like changing the subject—defining truth as what's useful!"
     *Reply (2 min):* "The 'prior grip' is the demand to systematize our *evaluative experiences* (suffering, trust, flourishing) within a coherent web alongside other empirical commitments. Pragmatic virtues *are* truth-conducive because they maximize overall coherence and empirical responsiveness of the entire web. There's no 'changing the subject'; this *is* what truth amounts to post-Quine—warranted assertibility under optimal inquiry."  
     *Soft Spot:* Risks sounding circular: truth is pragmatic success because pragmatic success defines truth.  
     **[Concede]:** "We have no 'god's-eye' guarantee our virtues track truth; it's our best account."  
     **[Red Line]:** Accepting a realm of non-natural moral facts knowable independently of empirical-pragmatic inquiry.

  #### 6. **The Quine Scholar's Second Salvo: First Philosophy in Drag?** (E - High Likelihood/Medium Damage)
     *Phrasing (Philosophy of Science):* "Quine rejected 'first philosophy'—privileged foundations. But aren't your 'pragmatic maxims' (simplicity, conservatism...) exactly that? Unjustified, intuitive starting points? If they're justified *within* science, that's circular for ethics. If not, it's foundationalism."
     *Reply (2 min):* "The maxims aren't a priori; they're *empirically successful habits* honed by the history of inquiry. They work *across* domains (science, engineering, common sense). Applying them to ethics extends this successful practice, not imposing dogma. Their justification is holistic and retrospective: systems using them work better over time."  
     *Soft Spot:* Difficulty proving these virtues *uniquely* track truth, not just utility.  
     **[Concede]:** "The list and weighting of maxims are revisable based on experience."  
     **[Red Line]:** Conceding the maxims are arbitrary or radically domain-specific.

  #### 7. **The Expressivist's Follow-Up: Deadlock & Quasi-Realism's Edge** (S - Medium Likelihood/Medium Damage)
     *Phrasing (Quasi-Realist):* "You claim much deadlock is empirical. But what about core clashes (e.g., equality vs. hierarchy) where *both* schemes seem empirically adequate long-term? Your 'pragmatic choice' looks like a non-cognitive commitment dressed as epistemology. Why isn't quasi-realism—owning the attitude-expressing function—simpler?"
     *Reply (2 min):* "True empirical equivalence is rarer than supposed. Hierarchical vs. egalitarian schemes *do* predict different outcomes (e.g., innovation rates, social mobility's impact on stability). Where equivalence *is* genuine, pragmatic choice *is* cognitive: it selects the scheme that best optimizes the web's overall coherence and fecundity *for further inquiry and action*, which *is* our best guide to truth."  
     *Soft Spot:* Hard cases (e.g., certain deontology vs. consequentialism splits) remain stubborn.  
     **[Concede]:** "Some genuine pragmatic ties might persist; choice then reflects deep commitments, but still within the cognitive project."  
     **[Red Line]:** Agreeing that in such cases, truth is indeterminate or non-cognitive.

  #### 8. **The Naturalist's Nit: Where's the Causal Chain?** (S - Lower Likelihood/Medium Damage)
     *Phrasing (Harman-Sturgeon-Boyd):* "Fine, moral posits might 'structure predictions.' But for *robust* naturalism, they need to be *causally efficacious* nodes in scientific explanations. Can you point to a *specific* causal explanation of a non-moral event (e.g., a revolution) where the *moral property itself* (not just beliefs about it) is indispensable?"
     *Reply (2 min):* "Consider: 'The *injustice* of land tenure system X caused widespread demoralization (a psychological state), leading to reduced agricultural innovation (an economic fact), contributing to famine vulnerability (a biological fact).' The property 'injustice' here is a higher-order structural property of the social system, indispensable for predicting and explaining the chain linking social structure to psychological and biological outcomes."  
     *Soft Spot:* "Injustice" might be reducible to non-moral psychological/social facts.  
     **[Concede]:** "Moral properties are multiply realizable; their causal role is often via realization."  
     **[Red Line]:** Denying moral properties play *any* indispensable role in *any* causal explanation.

  ---

  ### Critical Exchange: If Fumbled, Defines the Memory
  *   **The Naturalist's Lament (#1)** is the pivot. Fumbling this (e.g., conceding moral properties are *merely* useful fictions, or failing to articulate their empirical-explanatory role clearly) will cement the view that you've abandoned naturalist realism. Success here is vital for credibility with the core naturalist critics and shapes whether the room sees your view as a novel realism or warmed-over expressivism.

  ### The Objection You Hope Nobody Raises (But Be Ready)
  *   **"Isn't your appeal to 'pragmatic maxims' viciously circular? You claim they track truth because they're truth-conducive, justified by their success. But success is judged by... the very maxims! How is this not question-begging, especially for the moral domain where 'success' is contested?"**
      *   **Best Available Answer:** "The circle isn't vicious; it's hermeneutic. The virtues aren't justified *independently*; they're constitutive components of what *counts* as successful inquiry—a practice refined over millennia. We judge past applications of these virtues (in science, engineering, common sense) to have yielded systems that are more predictively accurate, technologically powerful, and coherent than alternatives. *That* track record—observable in the world—is the empirical anchor, not an abstract definition. Applying them to morals extends this empirically grounded practice. Contestation *within* the practice (is simplicity or fecundity more important here?) is resolved by further application of the holistic, empirical method itself—the only method we have or need post-foundationalism."

  ---

  **Airtime Allocation Summary:**  
  - **Substantive Objections (S: #1, #3, #4, #5, #7, #8):** ~60% (Focus: Normativity, Explanatory Role, Prediction, Truth-Tracking, Deadlock).  
  - **Exegetical Objections (E: #2, #6):** ~40% (Focus: Quinean fidelity, Status of Pragmatic Maxims).  
  **Prioritize:** Engage #1 (Naturalist) and #2 (Quine Scholar) early and firmly. Use #3 (Expressivist) to clarify normativity. Let #4 (Psychologist) showcase empirical links. Save deep dives on Quine (#2, #6) for when the scholars press. Be ready for #7 (Deadlock) as a likely follow-up. Keep replies tight; concede minor points strategically to preserve credibility for the core argument. Good luck!
