prompt: |-
  Next term I run week eight of a second-year interdisciplinary seminar — eighty minutes, whiteboard only, students mostly public health and psychology. Two earlier weeks have left them with what they experience as a flat contradiction: one lecturer presented moral judgment as having a structure that develops everywhere, another presented the cross-cultural vignette literature as showing the content of judgment varying far more than the first implied. Half the class has concluded that morality is local custom; the other half has concluded the variation is overplayed and there is a shared core underneath. What I want them to leave with is narrower and harder: which patterns of cross-cultural variation in moral judgment would bear on whether there are moral facts, and what premises the step from people disagree to there is no fact of the matter actually requires.

  Plan the session rather than explaining the material to me. I need:

  - The order the pieces must go in, with the dependence relations made explicit — where the distinction between a difference in moral principle and a difference in the non-moral beliefs feeding that same principle has to land, and what must already be in place before the disagreement argument can be stated rather than merely felt. I also want the non-moral comparison case (a domain they don't think is up for grabs, where cultures have disagreed) positioned so it does real work and doesn't read as a cheap gotcha.
  - The single case that should carry the eighty minutes, and what it must have and must conspicuously lack. It has to be one where their own first reaction is a confident blame judgment, where the same principle plus different background facts could produce the divergent verdict, and where we cannot simply ask the participants which principle they applied. I suspect anything built on food taboos or sexual purity will derail us into arguing about the practice instead of the inference, but tell me if you disagree and why.
  - The misconceptions they will arrive with and the ones they will form on the spot, each mapped to the exact point in the sequence where it should be headed off. I expect different cultures therefore no right answer, and I expect its mirror image: the principle/belief distinction deployed to dissolve every disagreement until the data stops meaning anything. I also expect universality gets treated as evidence of objectivity, which I think is a non sequitur but can't yet articulate why in one sentence.
  - A closing task, five minutes, on paper, that would show me whether they can apply the distinction to a fresh pair of cases rather than recite it.
  - What I should refuse to cover at this level, and say so out loud to the class.

  No reading list, no citations, no named studies — I want the plan and the reasoning behind it, not the sources.

  Finally, tell me how confident you are in the ordering you propose, and single out the one step where you would bet least: which dependence claim, or which predicted misconception, you are least sure of, and what would show it wrong.
reasoning: |-
  We are given: 
   - 80 minute session
   - Whiteboard only
   - Students: public health and psychology, second-year interdisciplinary seminar
   - Background: Two earlier weeks have presented what feels like a contradiction:
        Lecturer 1: Moral judgment has a universal developmental structure.
        Lecturer 2: Cross-cultural vignette literature shows significant variation in content of moral judgments.
   - Half the class: morality is local custom.
   - Other half: variation is overplayed, shared core.

   Goal: 
     Students should leave understanding:
       1. Which patterns of cross-cultural variation in moral judgment would bear on whether there are moral facts?
       2. What premises the step from "people disagree" to "there is no fact of the matter" actually requires.

   Key elements in the plan:

     - Must address the distinction between a difference in moral principle and a difference in non-moral beliefs that feed the same principle.
     - Must have a non-moral comparison case (from a domain they agree is factual) to show that disagreement doesn't automatically imply no fact.
     - The session should be built around a single case that:
          * Evokes a confident blame judgment in the students.
          * Allows for the possibility that the same principle with different non-moral facts could lead to divergent verdicts.
          * We cannot ask the participants which principle they applied (so we have to infer from behavior or judgment).
          * Avoid topics that derail (like food taboos or sexual purity).

     - Misconceptions to address:
          a. Different cultures therefore no right answer (relativism from disagreement).
          b. Using the principle/belief distinction to dissolve every disagreement until the data is meaningless.
          c. Universality as evidence of objectivity (non sequitur).

     - Closing task: 5 minutes, on paper, applying the distinction to a fresh pair of cases.

     - Explicitly refuse to cover some topics.

   Plan:

   I. Introduction and framing (5 minutes)
      - Acknowledge the tension from previous weeks: one view suggests universal structure, the other shows variation in content.
      - State the goal: We are going to examine what kind of variation would actually challenge the idea of moral facts, and what kind of reasoning is needed to get from disagreement to no fact of the matter.

   II. Set up the non-moral comparison case (15 minutes)
      - Purpose: To show that disagreement in a domain we consider factual does not lead us to conclude there is no fact of the matter.
      - Example: Historical disagreement about the shape of the Earth.
          * Ancient Greeks thought the Earth was flat; now we know it's roughly spherical.
          * Why didn't we conclude from that disagreement that there is no fact about the shape?
          * Because we have a way to investigate the fact (evidence, methods) and we can explain the disagreement by differences in access to information, technology, etc.
      - Key point: Disagreement alone isn't enough to infer no fact. We need to consider the possibility of error, differing evidence, or differing non-factual inputs (like values) that might be influencing the judgment.

      - Dependence: This must come before we tackle the moral case because it establishes that disagreement doesn't automatically imply no fact. It sets up the need for a more nuanced argument.

   III. Present the core moral case (30 minutes)
      - The case: **A medical decision without informed consent**
          * Vignette: In a remote village, a traditional healer treats a child with a severe illness using a ritual that involves a small incision (which in fact introduces an infection). The parents did not give explicit consent for the incision because the healer did not explain the risks, but the parents trusted the healer completely and expected the healer to do what was best. The child dies.
          * Students' first reaction: They will likely blame the healer for not getting informed consent and for causing harm.
          * Now, consider a variation: In the same village, the healer has successfully treated many children with similar symptoms using the same ritual for generations. The parents in this culture believe that discussing potential harms before a healing ritual is bad luck and may cause the harm to occur. They would refuse any explanation. The healer knows that explaining would cause the parents to refuse the treatment, which the healer believes is the child's only chance.

          * We cannot ask the participants (in our thought experiment) because we are imagining a cross-cultural scenario. We have to infer the principles from the context.

      - Why this case?
          * It evokes a strong blame reaction (failure of informed consent leading to harm).
          * It allows for the possibility that the same principle (e.g., "Do not cause harm without consent") might be in play, but the non-moral beliefs differ:
              - Our culture: We believe that explaining risks allows for autonomous decision-making and does not cause harm.
              - Their culture: They believe that explaining risks causes harm (by inviting bad luck) and that the healer's role is to act in the best interest without burdening the family with fear.
          * So the difference in judgment might be due to different non-moral beliefs (about the consequences of explaining risks) rather than a different moral principle.

      - On the whiteboard, draw the distinction:
          * Moral principle: e.g., "It is wrong to cause harm without consent."
          * Non-moral beliefs: e.g., "Explaining the risks of treatment causes harm (by bad luck)."

      - Step through the inference:
          * If the same moral principle is held, but non-moral beliefs differ, then the variation in judgment does not show a difference in moral principles.
          * This variation, therefore, does not bear on the existence of moral facts (because the same moral fact could be in place, but applied to a different set of non-moral circumstances).

      - Dependence: This case must come after the non-moral comparison because we are now applying the same logic (disagreement might be due to non-factual differences) to the moral domain.

   IV. The argument from disagreement to no moral facts (15 minutes)
      - Now we can state the argument that the students might be feeling:
          P1: If there were objective moral facts, then we would expect widespread agreement on moral judgments.
          P2: There is widespread disagreement on moral judgments.
          C: Therefore, there are no objective moral facts.

      - But we have seen two challenges:
          a. From the non-moral case: Disagreement in factual matters doesn't lead to the conclusion that there are no facts, because we can explain the disagreement by factors like access to evidence, reasoning errors, etc.
          b. From the moral case: The disagreement might be due to differences in non-moral beliefs, not in the moral principles themselves.

      - So what would actually bear on moral facts?
          * We need to find variation that cannot be explained by differences in non-moral beliefs or circumstances.
          * We need to find variation in the moral principles themselves.

      - Example of variation that might be in principle: 
          * Some cultures might hold that it is permissible to harm an innocent person to benefit the group, while others hold that it is never permissible. 
          * But note: we must be cautious because even here, non-moral beliefs might play a role (e.g., about what counts as harm, about the consequences, etc.).

      - Therefore, the argument from disagreement requires:
          * Premise: The disagreement is persistent and cannot be resolved by improving non-moral knowledge or by removing errors in reasoning (like we do in science).
          * Premise: The disagreement is at the level of fundamental moral principles.

      - Without these, the argument doesn't go through.

   V. Addressing misconceptions (woven throughout, but explicit points)
      a. "Different cultures therefore no right answer" (relativism from disagreement):
          - Addressed by the non-moral case: disagreement in history about the Earth's shape doesn't mean there's no fact. So why think that in morality, disagreement implies no fact? We need more.

      b. The principle/belief distinction used to dissolve every disagreement:
          - We must acknowledge that sometimes the disagreement might indeed be about the principle. We cannot assume that every difference is due to non-moral beliefs. We need evidence to tell when it is and when it isn't. The point of the exercise is to see what kind of variation would challenge the existence of moral facts, not to explain away all variation.

      c. Universality as evidence of objectivity:
          - This is a non sequitur because even if a moral judgment is universal, it might be due to universal non-moral beliefs or evolved psychology, not because it tracks an objective fact. (Example: universal disgust at certain things doesn't prove they are objectively disgusting; it might be an evolutionary adaptation.)

          - We can raise this point when we discuss the first lecturer's claim about universal structure. The universal structure might be about how we think, not about what is true.

   VI. Closing task (5 minutes)
      - On paper, present two new vignettes:

          Case A: In Culture X, it is considered wrong to eat beef because cows are believed to be the reincarnated ancestors of the tribe. Eating beef is seen as causing spiritual harm to the ancestors.

          Case B: In Culture Y, it is considered wrong to eat beef because the people believe that cows are sentient beings that experience extreme fear when slaughtered, and causing such fear is wrong.

          Task: 
            - Identify whether the difference in judgment (wrong to eat beef in both) is due to a difference in moral principle or a difference in non-moral beliefs.
            - Explain your answer.

          Expected answer:
            - In both cases, the moral principle might be similar: "Do not cause harm."
            - The non-moral beliefs differ: 
                * Culture X: Belief about reincarnation and spiritual harm.
                * Culture Y: Belief about sentience and fear.
            - So the difference in judgment about eating beef is due to non-moral beliefs, not a difference in the moral principle.

          Why this task? It avoids the taboo derailment by using a food example but in a way that focuses on the structure of the reasoning. It also is a fresh case that they haven't discussed.

   VII. What to refuse to cover
      - Explicitly state: "We are not going to resolve whether there are moral facts in this session. We are also not going to decide which moral principles are correct. We are only examining the logical structure of the argument from disagreement and what kind of evidence would be relevant."

   Confidence in ordering:

     - Most confident: Starting with non-moral case to block the automatic inference from disagreement to no fact. This is a strong analogy and sets the stage.

     - Least confident step: The medical case. I worry that students might get stuck on the details of the case (e.g., is the healer negligent? should we blame the culture?) rather than focusing on the principle/belief distinction. Also, the case might be too emotionally charged and lead to a discussion about cultural relativism in practice. However, the alternative (avoiding such a case) would leave the distinction abstract. 

     - What would show it wrong? If during the session, students cannot see how the same principle might be at work in both versions of the medical case, then the case fails. We might need to have a backup case. I chose this because it is close to public health and psychology, but if it derails, we might need a simpler case.

     - Alternative case idea: A property dispute. 
          * In our culture: If you grow fruit on your land, it's yours.
          * In another: If the branches of your tree hang over your neighbor's land, the fruit that falls is the neighbor's.
          * But this might be seen as conventional rather than moral.

     - Given the time, I think the medical case is worth the risk because it is more directly moral and relevant to their fields.

   Timing breakdown:

     I. 5 min: Introduction
     II. 15 min: Non-moral case (Earth shape)
     III. 30 min: Medical case and principle/belief distinction (including whiteboard breakdown)
     IV. 15 min: Stating the disagreement argument and what it requires
     V. (woven in) Misconceptions addressed as they come up, but especially during III and IV
     VI. 5 min: Closing task
     VII. (during intro or closing) What we refuse to cover

   Total: 70 minutes, leaving 10 minutes for transitions and spontaneous discussion.

   But note: The closing task is 5 minutes at the end. The rest adds up to 65, so we have 15 minutes for transitions and extra discussion.

   Alternatively, we can adjust:

     I. 5 min
     II. 10 min (if we keep the non-moral case concise)
     III. 25 min
     IV. 10 min
     V. (woven in)
     VI. 5 min

   But I think the medical case needs time.

   Let's stick with the original breakdown and be flexible.

   Final note: The single case is the medical case. It carries the weight because it is the moral example that we will analyze in depth.

   We must be careful to avoid derailment by:
     - Steering the conversation back to the structure of the reasoning.
     - Not letting the discussion turn into a debate about whether the healer's action was justified.

   Therefore, the instructor should frame the case as a thought experiment and explicitly ask students to assume the non-moral beliefs as given.
answer: |-
  ### Session Plan: Unpacking Disagreement and Moral Facts

  #### **Order of Pieces with Dependencies**
  1. **Non-Moral Comparison Case (15 mins)**  
     - **What**: Use a universally accepted factual domain (e.g., astronomy). Contrast ancient Greek belief that stars are holes in a celestial sphere vs. modern understanding of stars as distant suns.  
     - **Why first?** Establishes that disagreement ≠ no fact. Must precede moral discussion to block the automatic inference *"disagreement → relativism"*.  
     - **Dependencies**: None. This is the foundation. Without it, students default to conflating disagreement with subjectivity in morality.

  2. **Distinguish Moral Principle vs. Non-Moral Belief (20 mins)**  
     - **What**: Define terms:  
       - *Moral principle*: Abstract rule (e.g., "Avoid harm").  
       - *Non-moral belief*: Factual assumption feeding the principle (e.g., "This ritual causes harm").  
     - **Why here?** Must follow the non-moral case to leverage the analogy: *Just as Greeks and moderns shared a principle ("Seek truth") but differed on facts, moral disagreements might stem from non-moral beliefs, not principles.*  
     - **Dependencies**: Depends on the non-moral case. Premature introduction leads to misapplication (e.g., "all disagreements are just about facts").

  3. **Core Moral Case Analysis (30 mins)**  
     - **What**: Use **parental discipline** as the single case:  
       - *Vignette*: A child steals food. Parent responds by physically confining them to a room for 24 hours.  
       - *Students' reaction*: Confident blame (principles: "Don’t harm children," "Proportional punishment").  
       - *Divergent verdict*: In a famine-stricken culture, confinement prevents the child from stealing again and being killed by shopkeepers. Non-moral belief: "Confinement is the only way to save the child’s life."  
     - **Why this case?**  
       - Evokes strong blame but avoids derailment (not taboo-laden like purity).  
       - Clear role for non-moral beliefs (famine context changes harm calculus).  
       - Participants’ principles can’t be queried (culturally embedded; we infer from context).  
       - **Lacks**: Extreme violence, politicized topics, or ambiguity about intent.  

  4. **Stating the Disagreement Argument (10 mins)**  
     - **What**: Explicitly map the inference from disagreement to no moral facts:  
       - Premise 1: Widespread moral disagreement exists.  
       - Premise 2: If there were moral facts, disagreement would be resolved (like in science).  
       - Premise 3: Disagreement persists despite ideal conditions.  
       - Conclusion: Therefore, no moral facts.  
     - **Why last?** Requires prior steps:  
       - Non-moral case shows Premise 2 is flawed (disagreement persists in factual domains too).  
       - Principle/belief distinction shows Premise 1 may not reflect *moral* disagreement (could be non-moral).  
     - **Dependencies**: Cannot be clearly analyzed without #1–3.  

  5. **Clarifying What Bears on Moral Facts (5 mins)**  
     - **What**: Not all variation matters. Key question: *Is the disagreement rooted in conflicting moral principles (e.g., "Harm is irrelevant" vs. "Avoid harm") or non-moral beliefs?* Only the former challenges moral facts.  

  #### **Predicted Misconceptions & When to Head Them Off**
  - **"Different cultures → no right answer"**:  
    - **When**: During non-moral case (Step 1).  
    - **Response**: "Did the Greeks’ celestial sphere theory mean there’s no fact about stars? No—we explain disagreement through evidence gaps. Apply this to morality."  

  - **"Principle/belief distinction dissolves all disagreement"**:  
    - **When**: While analyzing the core case (Step 3).  
    - **Response**: "Does this mean all moral disagreements are illusions? No—sometimes principles *do* clash (e.g., honor cultures vs. individualism). We need evidence to tell the difference."  

  - **"Universality → objectivity"**:  
    - **When**: After stating the disagreement argument (Step 4).  
    - **Response**: "Universality might reflect shared evolution or socialization, not ‘truth’ (e.g., all cultures avoid rotting food, but that’s biology, not moral facts). Objectivity requires independent justification."  

  #### **Closing Task (5 mins)**  
  - **Task**: Hand out two vignettes:  
    - *Vignette 1*: Tribe A exiles elders during droughts, believing it pleases gods and ends droughts.  
    - *Vignette 2*: Society B exiles elders to conserve resources during droughts, viewing elders as less valuable.  
  - **Prompt**: *"Is this a difference in moral principles or non-moral beliefs? Justify in 2 sentences."*  
  - **Why this?** Tests application:  
    - Correct answer: Same principle ("Preserve group survival") but different non-moral beliefs (gods vs. resource efficiency).  
    - Avoids recitation by using novel, parallel cases.  

  #### **What to Refuse to Cover**  
  - **State explicitly**: "We won’t resolve *whether* moral facts exist or *which* principles are correct. Our goal is narrower: What kind of evidence could challenge moral facts, and is disagreement sufficient?"  

  #### **Confidence in Ordering & Least Confident Step**  
  - **Overall confidence**: High. Sequence mirrors logical dependencies:  
    1. Non-moral case blocks knee-jerk relativism.  
    2. Principle/belief distinction provides tools for analysis.  
    3. Core case applies tools concretely.  
    4. Stated argument reveals hidden premises.  
  - **Least confident step**: **Principle/belief distinction (Step 2)**.  
    - **Risk**: Students might oversimplify ("all disagreements are about facts") or disengage if the distinction feels forced.  
    - **What would show it’s wrong?** If students cannot generate plausible non-moral beliefs for the core case (e.g., they insist the parent’s action is "just wrong" regardless of context), the distinction may be too abstract. Mitigation: Use whiteboard to brainstorm non-moral beliefs collaboratively.  

  ---  
  **Session Flow**:  
  - **0–15 mins**: Non-moral case (whiteboard: Greek vs. modern astronomy).  
  - **15–35 mins**: Principle/belief distinction (define terms, link to astronomy).  
  - **35–65 mins**: Core case (vignette, student reactions, divergent context, whiteboard comparison).  
  - **65–75 mins**: Disagreement argument (premises, why they need support).  
  - **75–80 mins**: Closing task (collect papers).  

  This plan tackles the contradiction by showing that variation in *content* (from Lecturer 2) may stem from non-moral beliefs, leaving room for shared structure (Lecturer 1) and moral facts—while clarifying when disagreement *would* threaten objectivity.
