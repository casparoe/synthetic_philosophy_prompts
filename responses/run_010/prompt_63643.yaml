answer: |-
  Below is a comprehensive design for your 100-minute session, structured to meet all specified requirements. The game simulates the unilateralist's curse through iterative rounds where students receive private signals about an initiative's true state (beneficial or harmful) and decide whether to "launch" it. The design ensures students experience the phenomenon inductively, with debrief questions guiding them to articulate the curse and its implications.

  ### 1. Rules and Round Structure
  **Core Mechanics**:  
  - **Agents**: 28 students (all participate in every round).  
  - **Private Signal**: Each receives a binary signal ("🟢" = beneficial, "🔴" = harmful) via pre-printed slips (distributed in 30 seconds).  
  - **Decision**: Students anonymously submit "LAUNCH" or "DON'T LAUNCH" slips to a central box.  
  - **Outcome**: Initiative launches if ≥1 "LAUNCH" submission. True state revealed after tally.  
  - **Anonymity**: **Yes**. Prevents peer pressure, emotional blame, and mirrors real-world isolation. Use numbered-but-unnamed slips to later analyze individual decisions without exposure.  

  **Round Variations (Disguised Framings)**:  
  Run 6 rounds (surface themes: virology, AI, biotech, policy, ecology, finance). Vary:  
  - `n`: Effective number of "potential launchers" (all 28 students are *present*, but only `n` are *eligible* to act).  
  - `p`: Signal accuracy (probability signal matches true state).  
  - Harm/benefit ratio (`-H`/`+B` points).  
  - **Eligibility**: Randomly assign `n` students per round as "launchers" (e.g., "Only students born Jan–Jun"). Others submit void slips (prevents idleness).  

  | Round | Framing                     | `n` | `p` | Points (`+B`/`-H`) | True State (Fixed for Reliability) |
  |-------|-----------------------------|-----|-----|---------------------|-------------------------------------|
  | 1     | Virus-strain publish        | 28  | 0.7 | +10 / –20           | Bad (fixed)                         |
  | 2     | AI-algorithm release        | 5   | 0.7 | +10 / –20           | Good (fixed)                        |
  | 3     | Gene-drive deployment       | 28  | 0.8 | +10 / –20           | Bad (fixed)                         |
  | 4     | Policy-brief leak           | 28  | 0.7 | +10 / –40           | Good (fixed)                        |
  | 5     | Climate-data sharing        | 28  | 0.7 | +10 / –10           | Good (fixed)                        |
  | 6     | Financial-model disclosure  | 28  | 0.7 | +10 / –20           | Bad (fixed)                         |

  **Low-Overhead Signal/Tally**:  
  - **Signals**: Pre-generate signal slips (🟢/🔴) for all rounds using `p` and true state. Bundle by round for quick distribution.  
  - **Tally**: 2 TAs collect slips in labeled boxes. TAs scan for "LAUNCH" in 60 seconds (launch if ≥1 found).  

  ### 2. Points Scheme
  **Consequential Ledger**:  
  - Points reflect societal impact: **Benefit** (+B), **Harm** (–H), **Avoided harm** (0), **Missed benefit** (0).  
  - **Public Scoreboard**: Initial score = 0. Update dramatically after each round (e.g., "Class Welfare: –20!").  
  - **Rationale**: Non-monetary but high-stakes (e.g., –20 = "equivalent to 20 severe privacy violations").  

  ### 3. Arithmetic and Expected Outcomes
  **Key Formulas** (True state = bad/good with prior 0.5):  
  - `P(launch) = 1 – [0.5 × (no-launch prob | bad) + 0.5 × (no-launch prob | good)]`  
  - `P(bad | launch) = [P(launch | bad) × 0.5] / P(launch)`  
  - `Expected points = P(launch and good) × B + P(launch and bad) × (–H)`  

  **Calculations by Round**:  
  | Round | `n` | `p` | `P(launch)` | `P(bad | launch)` | `Expected Points` | Trials to Show Pattern |  
  |-------|-----|-----|-------------|-------------------|-------------------|------------------------|  
  | 1     | 28  | 0.7 | ≈1.0        | ≈0.5             | –5.0              | 1 (obvious)           |  
  | 2     | 5   | 0.7 | 0.915       | 0.455            | –3.3              | 2–3 (use fixed state) |  
  | 3     | 28  | 0.8 | ≈1.0        | ≈0.5             | –5.0              | 1 (obvious)           |  
  | 4     | 28  | 0.7 | 0.0*        | N/A              | 0.0*              | 1 (designed 0 launch) |  
  | 5     | 28  | 0.7 | ≈1.0        | ≈0.5             | 0.0               | 1 (obvious)           |  
  | 6     | 28  | 0.7 | ≈1.0        | ≈0.5             | –5.0              | 1 (obvious)           |  

  \*Round 4: High harm (–40) makes launching irrational even with 🟢 signal (expected value = –5). Students *should* all choose "DON'T LAUNCH".  
  **Surprising Result?**  
  - Round 2 (`n=5`) may show less harm than Round 1. If not, highlight: "With fewer launchers, we avoided harm 8.5% of the time!"  
  - **Design Flaw?** None. Fixed states ensure contrast (e.g., Round 1/6 harm vs. Round 2/5 benefit).  

  ### 4. Mirror-Image Failure Configuration
  **Round 4 (Policy-Brief Leak)**:  
  - `p=0.7`, `–H=–40`, true state=good.  
  - **Why it works**: Expected value of launching with 🟢 = `(0.7×10) + (0.3×–40) = –5` → no rational student launches.  
  - **Outcome**: Initiative (good) never launches → missed benefit (0 points). Students see under-launching from excessive caution.  

  ### 5. Validating Individual Rationality  
  **Round 6 (Financial-Model Disclosure)**:  
  - Pre-round: Students write decision rules (e.g., "Launch if 🟢; don’t if 🔴"). Collect rules.  
  - Run round: `n=28`, `p=0.7`, true state=bad → launch occurs (harm).  
  - **Debrief**:  
    - Ask launchers: "What was your signal?" (All 🟢).  
    - Show 3–4 anonymized rules: All say "launch if 🟢".  
    - Conclude: Failure arose despite competence, good faith, and correct individual reasoning.  

  ### 6. Timeline and Debrief  
  **Total: 100 minutes**  
  - **0–5 min**: Intro + rules (no theory).  
  - **5–45 min**: Rounds 1–6 (6–7 min/round: 1 min setup, 2 min decide/submit, 1 min tally, 1 min reveal, 1 min score update).  
  - **45–95 min**: **Debrief** (questions → student discoveries):  

  | Time  | Question Sequence → Key Discoveries                                                                 |  
  |-------|-----------------------------------------------------------------------------------------------------|  
  | 45–50 | "What patterns did you see in launches/outcomes?" → *Over-launching in large `n*; harm from false positives*. |  
  | 50–60 | "Why did harm occur even when most were right?" → *Curse: More agents → more false positives*.      |  
  | 60–70 | "How could we fix this?" → **Pool signals → collective decision** (students propose conformity).   |  
  | 70–80 | "What breaks in real life?" → **Attack conformity**: Who decides? Slow? Silences minorities? Entrenches status quo. |  
  | 80–90 | "Why did we miss the benefit in Round 4?" → *Under-launching: Conformity avoids harm but kills good initiatives*. |  
  | 90–95 | "Why no blame in Round 6?" → *No stupidity/selfishness; curse is structural*.                       |  

  - **95–100 min**: Conclusion.  

  ### 7. Failure Analysis and Mitigation  
  **Potential Failures**:  
  - **No launch in non-mirror rounds**: Unlikely (theoretical `P(launch)≈1` for `n=28`). If occurs, attribute to noise: "Sometimes randomness saves us!"  
  - **Tally delay**: Assign extra TAs; use parallel boxes (e.g., left/right side of room).  
  - **Reverse-engineering**: If a student guesses the curse early, say: "Hold that thought—we’ll test it!" Use their insight in debrief.  
  - **"Stacked deck!" accusation**: Preempt: "We fixed states in Rounds 4/6 to ensure learning. Others were random."  
  - **Emotional exposure**: Defuse via **anonymity** + normalize: "In Round 6, note how everyone with 🟢 launched—this was inevitable, not your fault."  

  ### 8. What the Game Cannot Reproduce  
  **Closing Note (verbatim)**:  
  > "This game simplifies reality: I set the signal accuracy (`p`), but real judgments are contested and often wrong. I defined ‘harm/benefit,’ but in life, values clash—your ‘benefit’ might be my ‘harm.’ Most crucially, **real initiatives are irreversible**: Once that virus sequence is published, you can’t take it back. Here, we just lose points. So remember: The curse is even scarier in practice. You must advocate for collective deliberation—especially when stakes are irreversible or values diverge."  

  ### Materials Prep Checklist
  - **Signals**: 6 sets of 28 slips (🟢/🔴), pre-generated per round using `p` and true state.  
  - **Decision slips**: 168 blank slips (students write "LAUNCH"/"DON'T").  
  - **Boxes**: 2 labeled collection boxes.  
  - **Scoreboard**: Large posterboard with running total.  
  - **Rulesheet**: For students (summary of points/signals).  

  This design ensures students *feel* the curse, confront conformity’s trade-offs, and leave primed for nuanced discussion. The fixed rounds guarantee pedagogical clarity while the debrief questions make them co-discoverers of the theory.
