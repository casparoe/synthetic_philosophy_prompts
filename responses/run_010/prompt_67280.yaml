prompt: |-
  For thirty-seven years I worked as an experimental scientist, and a great deal of that time was spent looking at pictures: diffraction patterns, thin sections, autoradiographs, the kind of data where the question of whether there is a signal present or merely a stain on the emulsion is settled, in the end, by looking, and then by having someone else look. Since retiring I have taken up philosophy of science with a small reading group, and last week we arrived at the familiar claim that all observation is theory-laden. One of my fellow readers put it to work in a way I have not been able to answer. We had been discussing two laboratories examining the same raw data and reporting different things — one sees an effect, the other sees an artefact — and he said that because all observation is theory-laden, there is no such thing as retreating to the naked evidence; the dispute cannot be adjudicated by further looking, however careful, and can only end when one side abandons its framework. I found this unsatisfying but could not say why, because in the laboratory that sentence meant something altogether more modest and, so far as I could tell, uncontroversial: that a new graduate student does not see in a micrograph what an old hand sees in the same micrograph, and that this is precisely why we blind the scoring, calibrate against standards, and insist that plates be read twice by different people. Those practices seem to me to presuppose that looking can be made neutral, or at any rate more neutral, by suitable precautions — not that neutrality is a comforting fiction.

  So I should like the sentence disassembled. What are the distinct claims that "all observation is theory-laden" could be making? Please lay them out as a menu, running from the near-trivial — perhaps something about the vocabulary in which an observation is reported, along the lines of Hanson's example of Tycho and Kepler watching the same sunrise and not, on his telling, seeing the same thing — through to the radical ones about the perceptual event itself. For each reading I want three things: a statement precise enough that one could tell whether it is true or false; a verdict, marking it as a platitude, as substantive but defensible, as genuinely contested, or as false; and an account of what would establish or refute it, whether by argument or by experiment. In particular, I want to know which readings require genuine cognitive penetration of perception in the technical sense, and which remain perfectly compatible with perception being encapsulated, since I suspect that several of the readings concern things that happen before the seeing — what one points the instrument at, what one attends to, what one is trained to look for — or after it, in what one says, remembers, and concludes, and that these are not remotely the same thesis wearing different clothes.

  Finally, tell me which reading my colleague actually needed. His conclusion was not the mild one that the two laboratories disagree sincerely on the same evidence; it was that no quantity of fresh, careful, blinded looking could settle the matter, and that only a conversion could. Which entries on your list would license that, and are they the same entries that make Hanson's example philosophically interesting, or has something been smuggled across? If the strong claim turns out to be unsupported by any reading that survives scrutiny, please say so plainly rather than offering a diplomatic compromise; and if some weaker claim does survive, tell me what it implies about my old profession and what it conspicuously fails to imply. I should like something I can read out at next week's meeting, so short labels I can keep straight in my head would be a kindness.
reasoning: |-
  Okay, let me approach this systematically. The user is a retired experimental scientist grappling with the philosophical claim that "all observation is theory-laden" after encountering it in a reading group. Their colleague used this to argue that scientific disputes over data can't be resolved by re-examining evidence - only by paradigm shifts. This clashes with the user's 37 years of lab experience where blinded reviews and repeated observations did resolve disagreements.

  The user wants a structured analysis of possible interpretations of "theory-ladenness," ranging from trivial to radical. For each interpretation, they need: a precise statement, a truth assessment, and verification criteria. They particularly want to distinguish claims about cognitive penetration of perception from those about pre-perceptual (experimental design) or post-perceptual (interpretation) factors. 

  Key insights emerge:
  1) The colleague's strong claim requires cognitive penetration - the theory literally shaping visual perception. But evidence for this is limited to ambiguous figures (Necker cubes) not scientific instruments.
  2) Most scientific examples involve theory guiding attention or interpretation, not altering raw perception. Graduate students and experts see the same pixels but notice different patterns.
  3) Blinded protocols work precisely because they isolate perception from theory-driven interpretation. This undermines the colleague's claim.
  4) The philosophically interesting version (Hanson's sunrise example) is about conceptualization, not perception itself.

  The colleague's position conflates levels: while theory influences what we study and how we report, it doesn't make perception itself incommensurable. The user's lab practices remain valid because they control for theory-laden interpretation while trusting perception's relative neutrality.

  The strongest surviving claim is that observation reports are theory-laden - but this doesn't preclude evidence resolving disputes through rigorous methods. The radical version the colleague needs is unsupported.
answer: |-
  Here is a disassembly of "all observation is theory-laden" into distinct claims, presented as a menu with evaluations. I'll conclude with an analysis of your colleague's argument and implications for experimental science.

  ---

  ### **The Menu of Claims**  
  *(Ordered from least to most radical)*  

  1. **Linguistic Framing (LF)**  
     - **Statement:** All *verbal reports* of observations require theoretical concepts to be communicable.  
     - **Verdict:** Platitude (widely accepted).  
     - **Verification:** A Tycho/Kepler scenario: Both see identical retinal images but *describe* the sunrise differently (e.g., "sun rising" vs. "horizon descending").  
     - **Cognitive Penetration?** No. Concerns post-perceptual labeling.  

  2. **Attentional Selection (AS)**  
     - **Statement:** Theories determine *where we look* and *what features we attend to* within a visual field.  
     - **Verdict:** Defensible (robust empirical support).  
     - **Verification:** Eye-tracking studies showing experts/novices fixate on different areas of a micrograph.  
     - **Cognitive Penetration?** No. Attention gates input but doesn't alter perception.  

  3. **Pattern Recognition (PR)**  
     - **Statement:** Theoretical training enables *recognition of significant patterns* in ambiguous data (e.g., distinguishing signal from noise).  
     - **Verdict:** Defensible (cognitive psychology).  
     - **Verification:** Studies where radiologists detect tumors in X-rays faster than untrained viewers.  
     - **Cognitive Penetration?** No. Involves learned associations, not perceptual distortion.  

  4. **Perceptual Interpretation (PI)**  
     - **Statement:** Sense data is *categorized* using theory-laden concepts during perception (e.g., "seeing as").  
     - **Verdict:** Substantive and contested.  
     - **Verification:** Hanson's sunrise: Tycho and Kepler may *experience* the event differently due to background beliefs.  
     - **Cognitive Penetration?** Borderline. Involves top-down conceptual shaping of experience, not raw sensation.  

  5. **Perceptual Penetration (PP)**  
     - **Statement:** Theories *directly alter low-level perception* (e.g., changing color, shape, or motion detection).  
     - **Verdict:** Genuinely contested; limited empirical support.  
     - **Verification:** Experiments like the "hollow mask illusion" (prior knowledge overrides 3D perception). Fails under strict controls.  
     - **Cognitive Penetration?** Yes, if true.  

  6. **Incommensurability Thesis (IT)**  
     - **Statement:** Rival theories create *mutually unintelligible perceptual experiences*; no shared "pure" observation exists.  
     - **Verdict:** False/unsupported (scientifically untenable).  
     - **Verification:** If rival labs could not agree on instrument readings despite calibration. Contradicted by inter-lab reproducibility.  
     - **Cognitive Penetration?** Requires strong PP.  

  ---

  ### **Your Colleague's Claim: Which Reading Do They Need?**  
  Their conclusion—that disputes *cannot* be resolved by "further looking" and require paradigm abandonment—depends on **IT (Incommensurability)**, which presupposes **PP (Perceptual Penetration)**.  

  - **Why IT is required:** Only IT implies that no neutral observational procedure (blinding, recalibration) can bridge theoretical divides.  
  - **Why IT fails scrutiny:**  
    - Calibration standards (e.g., ruler markings, spectrometer wavelengths) are theory-dependent but *intersubjectively stable*. Labs agree on instrument outputs even when interpreting them differently.  
    - Blinding works: If perception were truly theory-laden, blinding wouldn't reduce bias—yet it does.  
    - Instrumental outputs (digital images, spectra) are theory-mediated but *fixed*. Disputes occur over *meaning*, not pixel values.  

  **Hanson vs. Your Colleague:**  
  - Hanson’s sunrise example (**PI/PR**) shows conceptual disagreement, not perceptual incommensurability. Both observers could agree on shadow lengths or timing.  
  - Your colleague smuggles in **IT** by equating conceptual disagreement with perceptual impossibility.  

  **Verdict:** The strong claim (IT) is **unsupported**. No defensible reading of "theory-laden" licenses the conclusion that observation cannot adjudicate disputes.  

  ---

  ### **What Survives and Its Implications**  
  **Surviving Claims:** LF, AS, PR (and weakly, PI).  
  **What This Means for Your Profession:**  
  1. **Blinding/calibration remain valid:** These mitigate AS and PR (attentional/cognitive biases), not PP/IT.  
  2. **Disagreements are resolvable:** Fresh observation *can* settle disputes if protocols control for AS/PR (e.g., double-blinding).  
  3. **Theory’s role is constrained:** It selects *what* we observe and *how* we interpret, but not *what is seeable*.  

  **What It Does NOT Imply:**  
  - That conversion is the only resolution.  
  - That instruments don’t provide theory-neutral outputs.  
  - That graduate students and experts "see different worlds." They see the same data but *analyze* it differently.  

  ---

  ### **Script for Your Meeting**  
  > "Our discussion conflates distinct claims under 'theory-laden.'  
  > **Minimal claim:** We use theory to *describe* what we see (LF). No one disputes this.  
  > **Moderate claim:** Theory guides *attention* and *interpretation* (AS/PR). This is true but manageable via blinding.  
  > **Radical claim:** Theory *distorts perception itself*, making evidence incommensurable (PP/IT). This is unsupported.  
  >   
  > Blinding works precisely because perception isn't cognitively penetrated. When two labs disagree, better methods—not conversion—are the answer. Philosophy should refine, not undermine, the tools we built over 37 years."  

  **Short Labels to Remember:**  
  - **LF** (Words, not worlds)  
  - **AS/PR** (Attention & Patterns)  
  - **PP/IT** (Perceptual Distortion → **Rejected**)  

  The core of your scientific practice stands unchallenged.
