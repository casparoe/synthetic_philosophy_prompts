  First, I need to unpack both positions carefully. The user's friend relies on a technical result: if you generalize counterpart theory by removing world-bound individuals and set the counterpart relation to identity where things exist, you get Kripke semantics. That sounds compelling formally. But the user's intuition is that this strips away what makes counterpart theory distinct—its rejection of strict identity across worlds. The user's worry about Humphrey not *really* winning seems central here.

  Hmm. The key is whether the translation preserves philosophical commitments, not just truth values. Counterpart theory was born from Lewis's qualms about transworld identity—how can the same object be in two places? The translation forces identity back in, so it's not neutral. It's like demanding a vegan burger but defining it as containing beef where available. 

  The Humphrey objection is telling. For the Kripkean, "Humphrey could have won" means he himself exists in another world winning. For the counterpart theorist, it means a similar being wins. The user feels this difference is substantive, even if sentences get the same truth values. The friend might say the feeling is linguistic, but I think it's metaphysical—what possibilities consist of.

