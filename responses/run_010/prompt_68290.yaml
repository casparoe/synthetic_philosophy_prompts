  I need to craft this with extreme care to honor their specifications. The logic must emerge entirely through procedure and physical sensation - the ledger's refusal should feel like a lock rejecting a key. The eastern inspector's controversial "shortcut" must remain ethically ambiguous. Most importantly, that doubly-negated attestation scene needs to land with emotional weight, not as dry logic. 

  For structure: I'll open with Elsa at her sequence-work to establish bureau rhythms, then build to the ledger refusal scene where the key metaphor crystallizes the abstraction. The inspector's arrival introduces the moral dilemma in the second act, while the "positive beat" about bounded sequences gives her temporary footing before the final choice. 

  Crucially, no jargon - just oath formulas, ink-stains, and the tactile reality of bureaucracy. The ending must stay small: a pen hovering over paper, with her son's fate forever unresolved but her choice irrevocably made. That's where the real stakes live.
answer: |-
  ## The Sequence of Missing

  The scratch of Elsa Varga’s pen was the sound of twenty-two years. One deliberate stroke per day, a single digit added to the infinite sequence known within the Office of Attestations as Kappa-77. She signed her name below the day’s entry – *Elsa Varga, Witness Clerk, Grade III* – the ink still wet, the responsibility absolute. Kappa-77 witnessed some obscure topological property; Elsa neither knew nor cared. Her duty was the sequence itself, the daily act of choosing and committing. It existed only up to today’s entry, a fragile, growing thing tethered solely to her life. If she died tomorrow, Kappa-77 would cease, mid-sentence, its file sealed in the Archives of the Unfinished.

  The Office hummed with its ordinary, unremarkable rhythm. High windows admitted dusty Adriatic light onto rows of identical desks. The air smelled of ink, paper, and the faint, persistent brine carried up from the harbour. Clerks murmured, files rustled, stamps thudded with bureaucratic finality. Across from Elsa, young Petrović wrestled with a finite construction, his brow furrowed. Elsa envied him the solidity of an endpoint.

  Her own endpoint was the harbour office’s stubborn silence. Two years, four months, seventeen days. The *Star of Kotor*, a sturdy fishing boat, had slipped its moorings one grey dawn. Her son, Luka, nineteen and eager, was part of the crew. Only the sea came back, whispering nothing. The harbourmaster’s file remained agonizingly open: “Presumed Lost. Body Not Recovered.” No closure, only the yawning chasm of *neither confirmed nor denied*.

  That chasm drove her across the worn linoleum floor to the Central Ledger desk. Senior Clerk Borzic, his spectacles perched low on his nose, looked up. “Varga. Kappa-77 submitted?”

  “Submitted and signed,” Elsa confirmed, her voice steady despite the tremor in her hands, hidden in her pockets. She placed a fresh form before him. It was the simplest attestation request imaginable.

  **Claim:** *There exists a state: Luka Varga is alive. Or, there exists a state: Luka Varga is not alive (is deceased).*

  No infinite sequences needed. Just a binary fact. Alive, or not. She needed it etched into the public register, the official, undeniable truth. Borzic scanned the form, his expression neutral. He turned to the massive Ledger – leather-bound, brass-clasped, the repository of all attested truths. He opened it to a fresh page, dipped his pen, and moved to inscribe the claim.

  The pen tip hovered. Touched the paper. And stopped.

  It wasn’t a refusal Borzic voiced; it was a physical impossibility. The pen simply *would not mark*. Elsa saw it: the nib met the paper’s surface as if encountering glass. Borzic pressed, a faint grunt escaping him. Nothing. It was exactly like forcing the wrong key into a stubborn lock – metal meeting metal, no purchase, no give. He lifted the pen, frowning, and tried again at a different spot on the line. Same result. A faint *tick* sounded as the ink, denied its path, formed a reluctant bead on the nib.

  “It won’t take, Varga,” Borzic stated, the bureaucratic equivalent of noting bad weather. He set the pen down. “No witness.”

  Elsa’s breath caught. “It’s… self-evident. He is, or he isn’t.”

  Borzic tapped the form. “Self-evident isn’t attested. The ledger requires the *thing* that decides it. The living body. The confirmed remains. The irrefutable evidence of non-existence in the realm of the living. You possess none. Therefore, no witness exists. The claim lacks its required component for entry.” He picked up another form. “However…” He wrote swiftly, decisively. This time, the pen flowed. He signed with a flourish and presented the certified copy to Elsa.

  **Attestation Record:** *It is not the case that no witness exists for the claim: Luka Varga is alive. Or, it is not the case that no witness exists for the claim: Luka Varga is not alive (is deceased).*
  **Witness Requirement:** *None (Immediate Inference)*
  **Attested By:** *Senior Clerk Milo Borzic*

  Elsa stared at the paper. The words swam. It wasn’t the sentence she came for. It was a statement *about* the impossibility of her sentence. A proof about a proof. It lived two floors below the ground floor of certainty. It acknowledged the harbour office’s limbo but offered no ladder out. The solid truth of Luka’s existence or non-existence remained locked away, and this… this was merely the cold, formal echo of the lock itself. The shape of the nothing it offered was precise, sterile, and infinitely vast. It hurt more than simple denial.

  “This… gives me nothing,” she whispered, the bureaucratic veneer cracking.

  Borzic’s gaze held a flicker of something – pity, perhaps, or just fatigue. “It attests that the situation is not fundamentally closed to verification. That’s what the register holds.” He closed the ledger with a soft thump. The sound was final.

  The next week brought Inspector Davorin. He arrived from the Eastern Administrative Region, a lean man with sharp eyes and an immaculate, slightly foreign-cut uniform. He requested a review of stalled cases, specifically those involving missing persons with open harbour reports. Elsa’s file was on top. He summoned her to a small interview room.

  “Clerk Varga,” he began, his voice smooth as oiled parchment. “A tragic situation. Twenty-two years of faithful sequence construction… and this personal shadow.” He didn’t offer condolences. He offered procedure. “Your local branch operates under strict Constructionist principles. Admirable, rigorous. But ponderous in cases like this, where the *possibility* of a witness hinges on… well, on the sea’s whims.”

  Elsa remained silent, her hands clasped tightly in her lap.

  “In the East,” Davorin continued, leaning forward slightly, “we employ a pragmatic refinement. A procedural shortcut, rigorously derived.” He slid a single sheet of paper across the table. It outlined a rule, dense with conditional clauses and references to obscure procedural codes. The core was stark:

  *…if, through exhaustive investigation and the application of all available means of inquiry, it is definitively ascertained that no possible path exists by which a witness to Claim A could ever be produced or discovered (i.e., the non-existence of a witness is itself demonstrably impossible), then the existence of a witness to Claim A shall be deemed attested, and the complementary claim (Not-A) shall be formally negated and sealed…*

  Elsa read it twice. The cold precision of bureaucracy couldn't mask the seismic shift. It bypassed the need for the *actual* body, the *actual* proof. If you could prove that finding proof was impossible, then you accepted the opposite as true. *If you can rule out that no witness exists, then a witness exists.* For Luka: if they could prove he *couldn't* be alive (lost at sea, no landfall possible, no survival scenario plausible), then he *was* dead. His file could be closed tomorrow. Signed. Sealed. Attested: Deceased.

  Davorin watched her. “Under this rule, Clerk Varga, with the harbourmaster’s report and maritime charts, we could attest your son’s status. Resolve it. Provide… finality.” He didn’t say *closure*, but the word hung in the air, thick and tempting.

  The decision wasn’t a debate. It unfolded silently within Elsa, a brutal collision. The mother screamed for the seal, the attestation, the end to the torturous limbo. *Deceased*. A terrible word, but solid ground. She could mourn. She could stop imagining him shivering on some desolate shore. The *need* was a physical ache.

  But the Clerk of twenty-two years recoiled. Kappa-77 existed only because of her daily, free choice, signed and attested. This Eastern rule… it felt like building a sequence not with terms, but with the *absence* of terms. It was an attestation built on proving a negative about a negative. It lacked the tangible weight of a constructed witness. It smelled of inference piled upon inference, a bureaucratic sleight-of-hand. To sign for *that*… it felt like violating her oath. *“I attest only to what I, or a designated constructor, have brought into demonstrable being.”* Could she attest to Luka’s death based on the *impossibility* of proving he was alive? It felt like building on air. Her integrity, the very foundation of her life in this office, shuddered.

  She avoided Davorin. She threw herself into Kappa-77, the scratch of the pen a desperate mantra. One afternoon, reviewing a sheaf of archived finite constructions – attestations for bounded properties – a pattern clicked. Sequences where every possible path terminated within a calculable number of steps. Properties like “this maze has an exit reachable in under 100 turns.” The boundedness itself became the witness. You didn’t need to walk every path; proving that *no path could exceed the bound* allowed you to attest the existence of a solution within that bound. It was *constructive*, yet it leveraged finitude.

  For a few days, this felt like solid ground. She could *see* the bound, the limit. It had edges. She calculated bounds for simple geometric attestations, the numbers clean and certain on the page. It wasn't about her son, but it felt like truth, extracted uniformly within a defined space. Then she tried applying it. To Luka. To the sea. What was the bound on survival? Three days without water? The crush depth of the *Star of Kotor*? The distance to the nearest land? Each variable dissolved into uncertainty, probabilities, not absolutes. The sea defied bounds. The solid ground turned to shifting sand. The cost of the bound, she realized with crushing clarity, was certainty itself. You paid for it with the exclusion of the vast, messy, unbounded real. Her son was lost in the unbounded real.

  Inspector Davorin caught her leaving for the day. “Clerk Varga. The Eastern procedural review concludes tomorrow. Your son’s case is recommended for resolution under Article VII-C.” He handed her a pre-filled attestation form. The Claim section was already completed: *Luka Varga is deceased (as per Harbor File #4472-K and Eastern Procedural Rule VII-C).* A space waited for her signature as Submitting Clerk. “Sign here,” Davorin said, his voice low, persuasive. “End it. For yourself. For him.”

  Elsa took the form. The harbour office report was attached: *Presumed Lost. Body Not Recovered.* Maritime charts showed the deep, cold trench where the *Star of Kotor* likely rested. Davorin’s rule glinted, a key offered for an impossible lock. Was he a con man peddling false certainty, or an honest man offering a different kind of truth? The question was irrelevant. The only thing that mattered was the paper in her hand and the pen in her pocket.

  She walked not to the exit, but back into the hushed office, towards her own desk. Petrović had gone home. The dust motes danced in the dying light. She sat. She pulled out the Eastern attestation form. She stared at the space for her signature. The mother’s hand trembled, reaching for her pen. The Clerk’s hand remained still.

  Elsa Varga opened her desk drawer. She placed the unsigned Eastern attestation form inside, atop her worn copy of the Oath of Attestation. She closed the drawer. She took out the Kappa-77 file. Tomorrow’s entry awaited. She picked up her pen. The scratch began again, a single digit, signed and attested, adding one more fragile link to the infinite chain that only existed up until this moment, today. The harbour office file remained open. The ledger held only the doubly-negated ghost. The sea kept its silence. And the pen kept moving, one deliberate stroke at a time.
