prompt: |-
  I look after the fairness checks on our hiring models at a large-ish public-sector organisation — not a philosopher, just someone who reads around the edges of this. You're the expert here, so please actually think it through: if it helps, brainstorm the candidate readings first and then settle on one reconstruction.

  Our written prodecure for any automated screening tool requires all three of these: (a) the tool's score must predict our annual performance rating, and one and the same numeric cutoff is applied to every applicant group; (b) each protected group's selection rate must come out at no less than four-fifths of the highest group's; (c) among applicants who would in fact have performed well, the share we wrongly screen out must be roughly equal across groups. If a tool fails (b) or (c) we first try and fix it upstream — drop features, retrain, widen the validation sample. If it still fails, we set a different cutoff per group until everything sits inside tolerance, and file a note saying the conflict was 'managed'. The performance rating itself is never questioned; the whole edifice is anchored to it.

  I keep being told all three are measures of fairness, and they plainly pull against each other, but nobody has ever spelt out what the procedure assumes. So: what is fairness supposed to be a property of — the score, the decision, or the world the training data came from? Are the differing base rates between groups treated as legitimate inputs to condition on, or as the thing justice is about? Does the group-specific cutoff rescue sit inside (a), or quietly abandon what (a) claims? And what does anchoring everything to a supervisor's rating presuppose about merit — must the procedure have a theory of merit in order to work, or would several rival theories license it equally well?

  Please seperate what it strictly commits us to from what it merely fits comfortably with, say where the practice is philosophically underdetermined, name the rival views it rules out without anyone having decided to, and tell me what we'd have to change if we swapped one of them in. No reading list or citations — I only want the reconstruction. American English, please.
reasoning: |-
  Okay, the user is responsible for fairness checks on hiring models at a public-sector organization. They have a written procedure with three criteria: (a) the tool's score must predict annual performance ratings with a single cutoff for all groups, (b) the four-fifths rule for selection rates, and (c) equal false negative rates among qualified applicants across groups. If the tool fails (b) or (c), they adjust group-specific cutoffs and file a note. The performance rating is never questioned. The user wants to understand what this procedure assumes about fairness, where the tensions lie, and the implications of anchoring everything to the performance rating.

  First, I need to unpack what each criterion represents in fairness terms. (a) seems to be about predictive validity and formal equality—same cutoff for everyone. (b) is the disparate impact doctrine from employment law, focusing on outcomes. (c) is about equal opportunity, ensuring qualified candidates aren't disproportionately excluded based on group.

  The core tension arises because these criteria reflect different fairness definitions that are mathematically incompatible when base rates differ. The user mentions differing base rates—this is key. If one group has lower qualification rates historically, using the same cutoff (a) might cause (b) and (c) to fail. Adjusting cutoffs per group resolves the immediate conflict but raises questions about what (a) really means. Is the single cutoff still valid if they're changing it per group? The procedure seems to prioritize satisfying (b) and (c) operationally, even if it means bending (a).

  Anchoring everything to the supervisor's performance rating is crucial. This assumes the rating is the gold standard of merit. But what if the rating itself is biased? The procedure doesn't question this, so it inherits any biases in the rating system. The user asks whether the procedure requires a specific theory of merit. It doesn't explicitly state one, but by relying solely on performance ratings, it assumes a purely output-based merit theory—what matters is job performance outcomes, not inputs like education or experience. This might conflict with substantive equality theories that consider historical disadvantages.

  The user also wants to know what the procedure rules out. By conditioning on group to set cutoffs, it rejects formalism (strict same treatment) and embraces substantive adjustments. It also rules out luck egalitarian views that might consider unequal base rates as unjust rather than conditioning on them. If they wanted to switch to a different fairness view, say, no group conditioning at all, they'd have to drop (b) and (c). If they questioned the performance rating, they'd need a new merit definition.

  The group-specific cutoff "rescue" quietly abandons the universality claimed in (a), making (a) more of an aspiration. The procedure pragmatically manages conflicts without resolving philosophical tensions. It treats differing base rates as legitimate inputs, focusing on correcting outcomes rather than questioning root causes. This might align with anti-classification views but clash with anti-subordination perspectives that challenge existing disparities.

  In summary, the procedure is a practical compromise that prioritizes legal compliance (avoiding disparate impact) and operational fixes. However, it doesn't address potential biases in the merit standard itself and leaves deeper questions about justice unexamined. The user should be aware that while the process manages surface-level fairness, it may perpetuate underlying inequities if the performance ratings are flawed.
answer: |-
  Here's a reconstruction of your procedure's philosophical commitments and tensions, separating strict entailments from comfortable fits and highlighting ruled-out alternatives:

  1.  **What Fairness is a Property Of:**
      *   **Strict Commitment:** Fairness is primarily a property of the *decision outcome* (selection/non-selection). Criteria (b) (selection rates) and (c) (false negative rates) directly evaluate outcomes across groups. Criterion (a) anchors the *justification* for the decision tool to a specific outcome (performance rating).
      *   **Underdetermined/Comfortable Fit:** It *fits* with fairness being a property of the *decision rule* (the cutoff + score) *only if* rule (a) holds universally. The group-specific cutoff adjustment undermines this, shifting focus back to outcomes. It treats the *score* as a means to achieve fair outcomes, not as inherently fair/unfair itself. The "world" of training data is seen as a constraint to be managed (via upstream fixes or cutoff adjustment), not the locus of fairness evaluation.

  2.  **Differing Base Rates:**
      *   **Strict Commitment:** Differing group base rates (e.g., underlying qualification rates as defined by the performance rating) are treated as **legitimate inputs to condition on**. The entire conflict-resolution mechanism (group-specific cutoffs) presupposes that the underlying performance potential *differs* by group in a way reflected by the score and rating. Justice, as defined by your criteria, is *not* primarily about eliminating these base rate differences, but about managing their impact on *selection decisions* relative to the anchor.
      *   **Ruled Out:** Views that see differing base rates *themselves* as the fundamental injustice (e.g., strong substantive equality of opportunity theories, luck egalitarianism applied to group starting points). Your procedure accepts them as a given and seeks procedural fairness *given* these differences.

  3.  **The Group-Specific Cutoff "Rescue":**
      *   **Strict Commitment:** This practice **quietly abandons the universalist claim of (a)**. Rule (a) asserts a single, group-blind cutoff based on meritocratic prediction. The group-specific adjustment explicitly violates this universality. It treats (a) as an *initial aspiration* or *input condition*, but prioritizes satisfying (b) and (c) as *outcome constraints* when conflicts arise. The "managed" conflict note acknowledges this operational override of (a)'s universality.
      *   **Implication:** The procedure implicitly ranks the fairness criteria: (b) and (c) (outcome parity) are operational requirements; (a) (universal merit prediction) is a desirable input condition but sacrificable for the sake of (b)/(c).

  4.  **Anchoring to the Supervisor's Rating:**
      *   **Strict Commitment:** The procedure **absolutely requires a single, operational theory of merit.** It presupposes that the annual performance rating is:
          *   The *valid and sufficient* measure of job performance ("merit").
          *   *Objective enough* to serve as the unassailable anchor for fairness calculations.
          *   The *only relevant outcome* for defining qualification ("would in fact have performed well").
      *   **Philosophically Underdetermined:** It *fits comfortably* with **output-based merit theories** (merit = actual on-the-job results/performance). It does *not* inherently require a specific theory about *how* that performance is achieved (e.g., innate ability, effort, credentials, social skills).
      *   **Ruled Out:**
          *   **Input-Based Merit Theories:** Theories defining merit primarily by inputs (e.g., specific qualifications, degrees, test scores, "potential") *are ruled out* because the anchor is the *output* (performance rating). A tool predicting inputs perfectly but not correlating with the performance rating would fail (a).
          *   **Pluralistic/Contested Merit:** Views that see merit as multi-dimensional, contested, or socially constructed *are ruled out*. The procedure demands a single, quantified, authoritative metric. There's no mechanism for questioning whether the rating *itself* fairly captures relevant dimensions of merit or might be biased.
          *   **Fairness Independent of Performance Prediction:** Views that fairness requires selection rules independent of predicted performance (e.g., strict lottery among minimally qualified, strong affirmative action based on identity) are incompatible. The entire system is predicated on predicting and selecting for the anchored performance metric.

  **What Changing Anchors/Views Would Require:**

  1.  **If Merit Were Input-Based (e.g., Degree Scores):** You would need to change the anchor in (a) and (c) from the performance rating to the input metric. (b) might still apply. Upstream features and model training would focus on predicting the input, not performance. This risks selecting people good at inputs but not actual performance.
  2.  **If Differing Base Rates Were Seen as Illegitimate:** You would need fundamental changes: Questioning the performance rating data for bias, investing heavily in upstream interventions *before* applicant pools form (e.g., outreach, education), or potentially abandoning strict prediction of the *current* rating if it reflects past injustice. The group-specific cutoff would be seen as treating a symptom, not the cause.
  3.  **If Strict Formal Equality (a) Were Paramount:** You would have to **eliminate the group-specific cutoff adjustment**. If (b) or (c) failed after upstream efforts, you could only choose to: 1) Use the tool with the single cutoff and accept failing (b)/(c), 2) Abandon the tool entirely, or 3) Radically alter the definition of qualification/performance to eliminate base rate differences (e.g., extreme score normalization).
  4.  **If the Performance Rating Itself Were Questioned:** This is the most radical change. You would need:
      *   A new, agreed-upon definition (and measurement) of "merit" or "performance".
      *   A method to audit/historically correct the *existing* rating data for bias before using it to train/validate models.
      *   Potentially, decoupling fairness criteria from *any* performance prediction, focusing instead on procedural fairness, representation, or other non-predictive ideals. This could invalidate criteria (a) and (c) entirely.

  **In Essence:** Your procedure assumes a world where a single performance metric validly defines merit, where group differences in achieving this metric exist and are legitimate inputs, and where "fairness" means procedurally managing the impact of these differences on selection rates and error distribution *relative to that metric*. It prioritizes outcome parity (b, c) over universal decision rule consistency (a) when forced to choose. It rules out theories that fundamentally challenge the validity of the performance anchor, the legitimacy of base rate differences, or the primacy of predictive validity for defining fair procedures. It's a pragmatic system for managing observable disparities *within* a defined performance framework, not for questioning the framework itself or the root causes of disparities.
