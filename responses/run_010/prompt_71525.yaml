answer: |-
  ### Shadow Claim Screening Procedure

  **Gricean Adaptation Rationale**:  
  - **Preserved**: Quantity (informativeness), Relation (relevance), and Manner (clarity). These directly trigger shadow claims when violated. Quality is excluded as literal falsehoods are already covered by legal.  
  - **Dropped**: Speaker intentions (irrelevant for bots) and conversational implicature nuances (too complex for rapid review).  
  - **Disclaimer Impact**: Disclaimers often *strengthen* shadow claims by implying the denied claim is plausible ("methinks the lady doth protest too much"). The procedure flags high-risk cases.  
  - **Structural Blindness**: User-specific fears/knowledge (e.g., anxiety about drug interactions) can’t be audited. The procedure minimizes risk but cannot eliminate it.  
  - **Machine Applicability**: Grice applies *as if* the bot were cooperative. No patch needed—design to satisfy maxims, and users will infer intent.  

  **Procedure Table**  
  | Step | What the reviewer asks                                                                 | What they look at in the text                            | Pass condition                                                                 | Fail action                     | Judgment call? (and if yes, what the human needs to know to decide)                                                                 |
  |------|----------------------------------------------------------------------------------------|----------------------------------------------------------|--------------------------------------------------------------------------------|----------------------------------|-------------------------------------------------------------------------------------------------------------------------------------|
  | 1    | Is any sentence literally false or legally binding?                                    | Each statement for factual accuracy.                     | All statements true and non-binding.                                           | Block. Escalate to legal.        | No.                                                                                                                                |
  | 2    | Does the response **directly answer** the question asked? (If info exists, state it.) | Match between user’s query and bot’s explicit answer.    | Bot provides a clear "yes/no" or "I don’t know" + next steps.                  | Fix / Escalate.                  | Yes. If info exists but isn’t stated, fix. If system limitations prevent an answer, escalate to product team.                       |
  | 3    | Does the response **avoid implying answers** to unasked questions?                     | Words like "many," "some," or comparisons.               | No ambiguous generalizations or irrelevant details.                            | Fix.                             | Yes. Reviewer must ask: "Could this phrase make the user assume something about THEIR situation?" If unsure, escalate to content design. |
  | 4    | Is the response **free of vague instructions** that could be misinterpreted as guarantees? | Action-oriented phrases (e.g., "just bring X," "you’re set"). | Instructions are conditional (e.g., "if approved, bring X") or explicitly non-committal. | Fix / Block.               | Yes. If the action could cause harm (e.g., medical/financial), block. Else fix.                                                     |
  | 5    | If a disclaimer is present, **does it contradict the main message** or sound defensive? | Disclaimer placement and tone.                           | Disclaimer is concise, neutral, and doesn’t repeat risky language.             | Remove disclaimer + fix message. | Yes. Reviewer must ask: "Does this disclaimer DRAW ATTENTION to the very claim it denies?" If yes, remove it.                      |
  | 6    | Would a **panicked or hurried user** likely misinterpret this?                         | Urgency cues ("now," "immediately") or refusal phrasing. | Response avoids alarmist language and refusals are gentle + actionable.        | Block / Escalate.                | Yes. If high-risk domain (e.g., drug safety, coverage denial), escalate to clinical/legal. Reviewer must know common user fears.    |

  ---

  ### Worked Examples  
  **Case 1**  
  **Member**: "Does my plan cover physical therapy?"  
  **Bot**: "Many plans in your area include physical therapy benefits. You can view your full summary of benefits in the member portal."  
  - **Step 1**: Pass (literally true).  
  - **Step 2**: Fail. Bot evades the "yes/no" question.  
  - **Step 3**: Fail. "Many plans" implies user’s plan is included (shadow claim: "I’m covered").  
  - **Step 4**: Pass. No actionable instructions.  
  - **Step 5**: N/A (no disclaimer).  
  - **Step 6**: Fail. User may misinterpret as confirmation.  
  **Verdict**: Fix.  
  **Reword**: "I can’t access your specific plan details. Check your coverage in the member portal under ‘Summary of Benefits’ or call Member Services."  
  **Why**: Directly admits knowledge gap. Removes triggering generalization.  

  **Case 2**  
  **Member**: Asks about prior authorization status for a knee scan (real status: "pending, not determined").  
  **Bot**: "You’re all set — just arrive ten minutes early and bring your ID!"  
  - **Step 1**: Fail. "All set" falsely implies approval (shadow claim: "My auth is approved").  
  - **Step 2**: Fail. Doesn’t answer the status question.  
  - **Step 3**: Fail. "Just bring ID" implies authorization is complete.  
  - **Step 4**: Fail. Unconditional instruction risks financial harm.  
  - **Step 5**: N/A.  
  - **Step 6**: Fail. High risk of user incurring costs.  
  **Verdict**: Block.  
  **Escalate to Legal**: "Does instructing a user to ‘arrive early’ when auth is pending expose us to liability if they’re billed?"  
