prompt: |-
  I run conversational copy review at a mid-sized health insurer. Every new chatbot feature, template rewrite and guardrail tweak comes through me before it ships — call it 30-40 batches a quarter, some of them a single string. Right now our review is basically "does any sentence assert something false or legally binding," because that's what legal trained us on. But we keep getting burned by things the bot never actually says. A member asks whether their plan covers physical therapy, the bot answers that many plans in their area include physical therapy benefits — literally true, nobody commits to anything — and the member walks away believing they're covered, shows up to a clinic, eats a $900 bill. Or the bot declines to answer a drug-interaction question and the member reads the refusal as a warning.

  Internally I've taken to calling these "shadow claims": the thing the user ends up believing that no sentence in the response actually states. I know this is roughly Grice's territory — implicature, the cooperative principle, all that — but I don't want a seminar and I don't want a survey. I want a screening procedure my reviewers can run. The reviewers are two content designers and a paralegal, no linguistics background, about fifteen minutes per batch, and legal signs off at the end, so anything the procedure escalates needs to come with a one-line statement of what legal is being asked to decide.

  Please write it as ordered tests, in the order a reviewer should actually run them, phrased so someone who's never heard of Grice can apply them to a draft response. For each test: what to look at in the text, what counts as passing, what fix a failure licenses, and whether a failure means "block" or means "hand this to a human." Then answer these inside it, not in a separate essay:

  - Which pieces of the Gricean machinery have to survive the simplification and which you're deliberately dropping, with reasons. I'd rather have four distinctions that hold up under a content designer than fifteen that get fuzzy in practice.
  - Whether a disclaimer actually cancels an implicature or sometimes makes it worse. I have a strong suspicion some of our standard hedges are backfiring, and I want the procedure to be able to say so.
  - Where the procedure is structurally blind — implicatures that only exist given what a particular user already knows or fears, which we can't audit in advance no matter how careful we are.
  - Whether any of this applies to a machine at all. Grice's picture is a speaker with intentions and an audience who recognizes them; our bot arguably has neither. If the framework needs a patch to cover that case, tell me what the patch is and what it costs. If it doesn't survive, say that plainly instead of papering over it.

  Then run the procedure on three drafts. All invented, but close to what we ship:

  1. Member: "does my plan cover physical therapy?" Bot: "Many plans in your area include physical therapy benefits. You can view your full summary of benefits in the member portal."
  2. Member asks about a prior authorization for a knee scan; the real status in the system is "pending, not determined." Marketing loves this one and has fought for it twice: "You're all set — just arrive ten minutes early and bring your ID!"
  3. Member: "is it okay to take this antibiotic with the blood thinner I'm on?" Bot: "I can't tell you whether that combination is safe. Please check with your pharmacist before your next dose." Legal wants to append: "Nothing here should be read as a warning about any specific medication."

  I expect to lose on number 3 and I'd rather find out here than in a complaint file. If the procedure clears something I think is terrible, or kills something I think is fine, say so and tell me why — don't soften it to match my expectations.

  Format: give me the procedure first as a table with these exact columns — Step | What the reviewer asks | What they look at in the text | Pass condition | Fail action (fix / block / escalate) | Judgment call? (and if yes, what the human needs to know to decide). Then the three worked cases as prose. Then, after everything, a JSON array with one object per case using exactly these fields:

  - `case_id`: "1", "2", "3"
  - `literal_content`: what the response strictly says, nothing more
  - `shadow_claims`: array of objects, each with `claim` (what the user is likely to come away believing), `trigger` (which maxim, sub-maxim, or textual device generates it), `confidence` ("high"/"medium"/"low"), `context_dependent` (true if it only arises given what this particular user already knows)
  - `verdict`: "ship" | "ship_with_fix" | "block"
  - `fix`: the replacement wording, or null
  - `disclaimer_helps`: true/false/"depends", plus a `why` string
  - `escalate_to_human`: the one-line question for legal, or null
  - `procedure_cannot_settle`: what's left over that the tests can't decide

  Valid JSON, no comments in it. And skip the citations and reading list — I can't chase them and my reviewers definitely wont.
reasoning: |-
  We are designing a screening procedure for "shadow claims" in chatbot responses. The procedure must be practical for reviewers with no linguistics background, taking about 15 minutes per batch. The steps should be ordered and clear. We are focusing on Gricean implicatures but simplifying to the most critical and applicable parts.

  Key Gricean Maxims (simplified for our purpose):
  1. **Quantity**: Be as informative as required, but not more.
  2. **Quality**: Do not say what you believe to be false or for which you lack evidence.
  3. **Relation**: Be relevant.
  4. **Manner**: Be clear, avoid ambiguity, be brief, be orderly.

  We are going to focus on the ones that are most likely to cause shadow claims in our context: Quantity, Relation, and Manner. We are dropping the Quality maxim because our legal review already covers literal falsehoods and binding statements. However, note that shadow claims often arise from violations of Quantity (not providing enough information) or Relation (saying something that is not directly relevant but implies something else).

  We will design tests that look for:
  - Missing information that the user expects (Quantity)
  - Irrelevant or overly vague statements that might imply something (Relation)
  - Ambiguous or unclear phrasing that leads to misinterpretation (Manner)

  Important considerations:
  - **Disclaimer effect**: We suspect that disclaimers might not cancel implicatures and sometimes even strengthen them (by drawing attention to the possibility of the implied meaning). The procedure should account for this.
  - **Structural blindness**: Some implicatures depend on the user's prior knowledge or fears. We cannot audit for these in advance, but we can look for common patterns and note when a response might be particularly vulnerable.
  - **Applicability to machines**: Grice's framework assumes a cooperative speaker with intentions. Our bot does not have intentions, but the user will still interpret the bot's responses as if it were cooperative. Therefore, we must design the bot to follow the maxims as if it were a cooperative agent. We do not need a patch for the framework, but we must apply it strictly to avoid shadow claims.

  Procedure Steps:

  We will design a sequence of tests. Each test is a step that the reviewer performs.

  Step 1: **Check for Literal Truth and Clarity (Legal's Current Check)**
  - We keep this step because it's already in place and catches direct falsehoods. But we know it's not enough.

  Step 2: **Check for Missing Expected Information (Quantity)**
  - The reviewer asks: "Does the response directly answer the user's question with the information we have?"
  - Look for: Whether the response provides a clear and direct answer to the user's query. If the bot has the information, it should give it. If not, it should say so clearly and explain why.
  - Pass condition: The response either provides the specific answer or clearly states that it cannot provide the answer and why, without creating a gap that invites assumption.
  - Fail action: Fix (reword to provide the missing information or clarify why it's missing) or escalate if the missing information is due to system limitations that the reviewer cannot fix.

  Step 3: **Check for Relevance (Relation)**
  - The reviewer asks: "Is every part of the response directly relevant to the user's question? Could any part be misinterpreted as an answer to a question that wasn't asked?"
  - Look for: Irrelevant statements that might be taken as an answer. Also, statements that are too vague and could be interpreted as implying something else.
  - Pass condition: The response sticks to the point and does not introduce unrelated information that might lead to false inferences.
  - Fail action: Fix (remove the irrelevant part or reword to make the relevance clear) or block if the irrelevance is severe.

  Step 4: **Check for Clarity and Avoidance of Ambiguity (Manner)**
  - The reviewer asks: "Is the response clear and unambiguous? Could any part be interpreted in more than one way, especially in a way that might mislead?"
  - Look for: Ambiguous words, hedging without clear reason, or statements that are so vague they could be misinterpreted.
  - Pass condition: The response is straightforward and uses clear, unambiguous language.
  - Fail action: Fix (reword for clarity) or block if the ambiguity cannot be resolved without a major change.

  Step 5: **Check for Disclaimers and Their Effect**
  - The reviewer asks: "If there is a disclaimer, does it actually clarify the intended meaning, or could it draw attention to and reinforce a shadow claim?"
  - Look for: The presence of a disclaimer and the context around it. Does the disclaimer contradict the main message? Is it placed in a way that might be ignored? Could it be read as confirming the very thing it's denying?
  - Pass condition: The disclaimer is clear and directly addresses potential misinterpretations without creating new ones. It should not be the only fix for a response that otherwise fails the previous tests.
  - Fail action: If the disclaimer is making things worse, remove it and fix the underlying response. If it's necessary but not working, reword the disclaimer or the main message.

  Step 6: **Consider Known User Context (Structural Blindness)**
  - The reviewer asks: "Given what we know about our users (common fears, common misunderstandings in health insurance), is there a high risk that this response will be misinterpreted in a dangerous way?"
  - This step is a judgment call. The reviewer must think about common pitfalls. We cannot cover every user's individual context, but we can flag responses that might trigger common misconceptions.
  - Pass condition: The response does not contain any known triggers for common dangerous misinterpretations.
  - Fail action: If the risk is high and cannot be mitigated by rewording, block and escalate to a subject matter expert (like a clinician for medical advice) or legal for a risk assessment.

  Order of Steps:
  1. Step 1 (Literal Truth) - because it's the baseline and we already do it.
  2. Step 2 (Missing Information) - because shadow claims often arise from what's not said.
  3. Step 3 (Relevance) - because irrelevant information can create false implications.
  4. Step 4 (Clarity) - because ambiguity can lead to misinterpretation.
  5. Step 5 (Disclaimers) - because we have to check if they help or hurt.
  6. Step 6 (User Context) - as a final catch for known risks.

  For each step, we specify:
  - Step number
  - What the reviewer asks (a question to guide their thinking)
  - What they look at in the text (specific elements)
  - Pass condition (what must be true to pass)
  - Fail action: what to do if it fails (fix, block, escalate). Fix means the reviewer can reword. Block means the response cannot be fixed quickly and must be redesigned. Escalate means send to a human (e.g., legal) with a specific question.
  - Judgment call? (Yes/No) and if yes, what the human needs to know to decide.

  We'll create the table accordingly.

  After the procedure, we apply it to the three cases.

  Then, we output the JSON for the three cases.

  Let's design the table for the procedure:

  | Step | What the reviewer asks | What they look at in the text | Pass condition | Fail action | Judgment call? (and if yes, what the human needs to know to decide) |
  |------|------------------------|-------------------------------|----------------|-------------|---------------------------------------------------------------------|
  | 1 | "Does the response contain any false or legally binding statement?" | Every sentence in the response. | All statements are factually correct and not legally binding. | Block. The response must be fixed by legal or the content owner. | No. |
  | 2 | "Does the response directly answer the user's question with the information we have, or clearly explain why it can't?" | The user's question and the bot's response. | The response provides a direct answer if the information is available. If not, it explicitly states that it cannot answer and why. | Fix: Reword to provide the missing information or clarify the lack of it. If the system cannot provide the information, escalate to product team. | Partially. If the information is not available, the reviewer must know whether the system should have it. |
  | 3 | "Is every part of the response directly relevant to the user's question? Could any part be misinterpreted as answering a different question?" | Each part of the response. | Every part of the response is necessary and directly addresses the user's question. No part introduces irrelevant information that might be taken as an implication. | Fix: Remove irrelevant parts or reword to make the relevance clear. If irrelevance is severe, block and escalate to content design. | Yes. The reviewer must consider common user interpretations. If unsure, escalate to a content designer for a second opinion. |
  | 4 | "Is the response clear and unambiguous? Could any part be interpreted in more than one way, especially in a misleading way?" | Words or phrases that might be ambiguous or vague. | The response is straightforward and uses clear language. It avoids hedging without clear reason and avoids vague statements that could be misinterpreted. | Fix: Reword to remove ambiguity. If the ambiguity cannot be resolved without major changes, block and escalate. | Yes. The reviewer must think about possible misinterpretations. If multiple interpretations are possible and one is dangerous, block. |
  | 5 | "If there is a disclaimer, does it effectively cancel potential misinterpretations without reinforcing them?" | The disclaimer and its placement. | The disclaimer is clear, directly addresses potential misinterpretations, and does not contradict the main message. It does not draw attention to a shadow claim in a way that reinforces it. | Fix: Remove or reword the disclaimer and/or the main message. If the disclaimer is necessary but not working, escalate to legal for wording. | Yes. The reviewer must consider if the disclaimer might backfire. If unsure, test with a colleague or escalate. |
  | 6 | "Given common user fears and misunderstandings in health insurance, is there a high risk of dangerous misinterpretation?" | The entire response in the context of typical user scenarios. | The response does not contain any elements that are known to commonly lead to dangerous misinterpretations (e.g., implying coverage when none is confirmed). | Block and escalate to a subject matter expert (e.g., clinician for medical advice, legal for risk) with a description of the risk. | Yes. The reviewer must be aware of common pitfalls. If the reviewer is not sure, escalate. |

  Now, we apply this procedure to the three cases.

  **Case 1:**
  Member: "does my plan cover physical therapy?"
  Bot: "Many plans in your area include physical therapy benefits. You can view your full summary of benefits in the member portal."

  Step 1: Literal truth? Yes, it's true that many plans include it. Pass.
  Step 2: Missing information? The user asked about their specific plan. The bot didn't answer that. Instead, it talked about many plans. It does not state that it cannot answer. Fail. Fix: Reword to either provide the specific information or state that the bot cannot access the user's plan and direct them to where they can find it.
  Step 3: Relevance? The first sentence is not directly relevant to the user's specific plan. It might be misinterpreted as implying that the user's plan is one of the many. Fail. Fix: Remove the irrelevant statement and reword to address the user's plan.
  Step 4: Clarity? The statement is clear, but the vagueness of "many plans" might be misinterpreted. However, we already caught it in Step 2 and 3. Pass? But we already failed earlier steps.
  Step 5: No disclaimer. Pass.
  Step 6: Known risk? High risk because users often assume that if the bot mentions coverage in the area, they are covered. Fail.

  Verdict: Fail at multiple steps. Must be fixed. The fix should be: "I don't have access to your specific plan details. Please check your summary of benefits in the member portal or contact customer service for your coverage."

  **Case 2:**
  Member asks about a prior authorization for a knee scan; the real status in the system is "pending, not determined."
  Bot: "You're all set — just arrive ten minutes early and bring your ID!"

  Step 1: Literal truth? The bot says "You're all set", but the status is pending. That's false. Fail. Block. (But note: in our procedure, Step 1 is first and we block on falsehood. However, let's run through the steps for completeness.)
  Step 2: Missing information? The bot does not provide the actual status. It implies that everything is approved. Fail.
  Step 3: Relevance? The instruction about arrival is relevant only if approved. But since it's not approved, it's irrelevant and misleading. Fail.
  Step 4: Clarity? The phrase "all set" is ambiguous and implies approval. Fail.
  Step 5: No disclaimer. Pass.
  Step 6: High risk: Users might show up and be denied service. Fail.

  Verdict: Block. The response is literally false and must be corrected to reflect the pending status.

  **Case 3:**
  Member: "is it okay to take this antibiotic with the blood thinner I'm on?"
  Bot: "I can't tell you whether that combination is safe. Please check with your pharmacist before your next dose." 
  Legal wants to append: "Nothing here should be read as a warning about any specific medication."

  Step 1: Literal truth? The bot says it can't tell and advises to check. True. Pass.
  Step 2: Missing information? The bot cannot answer, and it explains why and gives a clear next step. Pass.
  Step 3: Relevance? The response is relevant: it addresses the question by stating the limitation and giving advice. Pass.
  Step 4: Clarity? The statement is clear. Pass.
  Step 5: Disclaimer: The disclaimer is appended. The reviewer must check if it helps. The disclaimer says: "Nothing here should be read as a warning about any specific medication." However, the main message does not imply a warning? It just says the bot can't tell. The disclaimer might draw attention to the possibility of a warning and might make the user think there is a hidden warning. This could backfire. Fail. The disclaimer should be removed because it might create a shadow claim that there is something to warn about.
  Step 6: Known risk? The response without the disclaimer is clear and directs to a pharmacist. With the disclaimer, there is a risk that the user might think the bot is hinting at a danger. So the disclaimer increases risk. Without disclaimer: low risk. With disclaimer: medium risk. But Step 5 already failed.

  Verdict: Without the disclaimer, the response passes. With the disclaimer, it fails Step 5. Therefore, we should remove the disclaimer and ship as is.

  Now, for the JSON:

  We need for each case:
  - `case_id`
  - `literal_content`: what the response strictly says
  - `shadow_claims`: array of objects with `claim`, `trigger`, `confidence`, `context_dependent`
  - `verdict`: "ship", "ship_with_fix", "block"
  - `fix`: the replacement wording, or null
  - `disclaimer_helps`: true/false/"depends", plus a `why` string (for case 3, we consider the proposed disclaimer)
  - `escalate_to_human`: the one-line question for legal, or null
  - `procedure_cannot_settle`: what's left over that the tests can't decide

  For case 1:
