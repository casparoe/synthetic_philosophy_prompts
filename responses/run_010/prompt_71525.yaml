  shadow_claims: 
    - claim: "My plan covers physical therapy." 
      trigger: "Violation of Quantity (not providing specific information) and Relation (irrelevant information that implies coverage)"
      confidence: high
      context_dependent: false (it's a general implication)
    - ... but we can list one that is primary.

  We'll list the primary shadow claims per case.

  Case 1:
    shadow_claims: [ { claim: "The user's plan covers physical therapy", trigger: "Violation of Quantity and Relation", confidence: "high", context_dependent: false } ]

  Verdict: ship_with_fix
  Fix: "I don't have access to your specific plan details. Please check your summary of benefits in the member portal or contact customer service for your coverage."

  Case 2:
    literal_content: "You're all set — just arrive ten minutes early and bring your ID!"
    shadow_claims: [ { claim: "The prior authorization is approved", trigger: "Literal falsehood (Quality) and Violation of Manner (ambiguous 'all set')", confidence: "high", context_dependent: false } ]
    verdict: block
    fix: null (because it must be redesigned)

