prompt: |-
  I direct grantmaking at a regional community foundation with a $9 million annual discretionary fund. Each quarter my three program officers sort roughly forty requests into a slate the board then votes on, and each quarter the same dispute recurs: a handful of proposals arrive from global-health intermediaries whose cost-per-life-saved figures dwarf anything we can do locally, while our charter commits us to "the communities that sustain us," and the board is split between members who find the drowning-child line of argument decisive and members who experience it as a slur on the region we were endowed to serve. I would like a written allocation procedure my officers can run on each request without re-litigating impartialism from first principles every cycle.

  It should give the questions to ask in order, what counts as a sufficient answer at each step, the conditions under which it returns fund, fund partially, or decline, and an explicit inventory of which steps are judgment calls dressed as procedure and which get handed upstairs to the board because they concern values rather than facts. It must address donor-restricted money and obligations already incurred to past grantees; it must state plainly whether it escalates until nearly the whole fund flows to the highest-impact global causes, and if it does not, name the stopping point and defend it; and it must say how to treat the knowledge that peer foundations free-ride. Constraints: two hours per request, no economist on staff, and every output must carry a reason code we could defend to an unsuccessful applicant.

  Then apply it to three cases: $400,000 to open a second domestic-violence residence in our county, where the existing shelter's waitlist turns women away most months; $400,000 to a global fund whose own estimate is one death averted per $4,500; and $400,000 from an unrestricted bequest whose donor left only the instruction to give it wherever it does the most good. At least one of the three should come out against my own preference — I expect to fund the shelter — and the write-up should end by stating what the procedure cannot settle.
reasoning: |-
  We are designing an allocation procedure for a community foundation with a $9 million annual discretionary fund. The procedure must be efficient (2 hours per request), not require an economist, and provide clear reason codes. It must address donor restrictions, obligations to past grantees, and the tension between local impact and global health cost-effectiveness.

  The procedure will have the following steps, with clear questions and criteria. Steps that are judgment calls will be noted, and steps that require board input (values decisions) will also be noted.

  ### Allocation Procedure

  #### Step 1: Check Donor Restrictions
  - **Question**: Is the request for donor-restricted funds? If so, does it meet the restriction?
  - **Sufficient Answer**: 
    - If the funds are unrestricted, proceed to Step 2.
    - If the funds are restricted, check if the request falls within the restrictions. If yes, proceed to Step 2. If no, decline with reason code: "Does not meet donor restrictions."
  - **Judgment/Board**: This is a factual step. No judgment needed.

  #### Step 2: Check Existing Obligations
  - **Question**: Does the grant request come from an organization to which we have already committed multi-year funding?
  - **Sufficient Answer**: 
    - If yes, and the request is for a continuation of that funding, then it is a renewal. Proceed to Step 3.
    - If no, then it is a new request. Proceed to Step 3.
    - Note: This step is to flag renewals for special consideration (e.g., fulfilling past promises).
  - **Judgment/Board**: Factual step.

  #### Step 3: Local vs. Global Scope
  - **Question**: Is the project primarily serving the local community as defined by our charter (the region that sustains us)?
  - **Sufficient Answer**:
    - Local: Projects that directly serve the residents of our defined region (county, city, etc.). Proceed to Step 4A.
    - Global: Projects that serve outside the region, including international. Proceed to Step 4B.
  - **Judgment/Board**: This step involves interpretation of the charter. If there is ambiguity, it may require board input (values decision). However, for efficiency, program officers should use a clear definition (e.g., based on geographic service area). If the project is clearly local or clearly global, proceed. If borderline, escalate to board.

  #### Step 4: For Local Projects (Step 4A) and Global Projects (Step 4B)
  We split the path for local and global because they have different evaluation criteria.

  ##### Step 4A: Local Project Evaluation
  1. **Need Assessment**:
     - **Question**: Is there a demonstrated need in the local community that this project addresses?
     - **Sufficient Answer**: Evidence from the proposal or known data (e.g., shelter waitlist, poverty rates, etc.) showing the problem exists and is significant. If yes, proceed. If no, decline with reason: "Insufficient demonstration of local need."
     - **Judgment**: Program officer judgment based on evidence.

  2. **Project Viability**:
     - **Question**: Is the organization capable of carrying out the project? Do they have a track record, a realistic plan, and a budget that makes sense?
     - **Sufficient Answer**: The organization has a history of similar work, or if new, a strong plan and partnerships. Budget should be reasonable and without major red flags. If yes, proceed. If no, decline with reason: "Concerns about project viability or organizational capacity."

  3. **Impact Assessment**:
     - **Question**: What is the expected impact per dollar? (Note: We cannot do precise cost-effectiveness like in global health, so we use qualitative and proxy measures.)
     - **Sufficient Answer**: 
       - Quantify if possible (e.g., number of people served, reduction in waitlist, jobs created). 
       - Compare to similar local projects (e.g., cost per person served). 
       - If the cost per outcome is within typical local ranges, then proceed. If it is an outlier (very high cost per outcome), then it may be a candidate for partial funding or decline. 
       - If the project addresses a critical need (like saving lives, preventing harm) and the cost is justified in the local context, then proceed.
     - **Judgment**: This is a judgment call. Program officers should use local benchmarks.

  4. **Alignment with Foundation Priorities**:
     - **Question**: Does the project align with our current strategic priorities (e.g., as set by the board)?
     - **Sufficient Answer**: Check against the foundation's published priorities. If aligned, proceed. If not, it may still be considered if it addresses an urgent need, but then it requires board review (values decision). Otherwise, decline with reason: "Not aligned with current foundation priorities."

  5. **Renewal Consideration** (if applicable from Step 2):
     - **Question**: Is this a renewal of a past grant?
     - **Sufficient Answer**: If yes, then also consider:
       - Past performance: Did the organization deliver on previous goals?
       - Sustainability: Is there a plan to become self-sustaining? 
       - If performance was satisfactory and the need continues, then it gets a positive bias (i.e., renew unless there are new concerns). If performance was poor, decline with reason: "Unmet goals in past funding."

  ##### Step 4B: Global Project Evaluation
  1. **Effectiveness**:
     - **Question**: What is the estimated cost per life saved (or similar metric) for this project? Is the organization a top performer in its field?
     - **Sufficient Answer**: 
       - The proposal should provide evidence (e.g., from independent evaluators like GiveWell) or their own track record. 
       - If the cost per outcome is within the range of proven effective interventions (e.g., $4,500 per life saved is very good) and the organization has a strong track record, proceed. 
       - If the organization is not a top performer or the cost per outcome is high by global standards, decline with reason: "Does not meet global cost-effectiveness benchmarks."
     - **Judgment**: Fact-based, but requires checking sources. If no data, then it's a judgment call (and likely decline due to lack of evidence).

  2. **Room for More Funding**:
     - **Question**: Will additional funding lead to more impact? (i.e., does the organization have room for more funding without diminishing returns?)
     - **Sufficient Answer**: The proposal should explain how the funds will be used and that they have the capacity to absorb more funds effectively. If yes, proceed. If not, partial fund or decline with reason: "Limited room for more funding at this time."

  3. **Counterfactual**:
     - **Question**: Would this project happen without our funding? (i.e., is our funding additional?)
     - **Sufficient Answer**: If the project is likely to be funded by others without us, then our impact is low. If our funding is critical, then it's a strong candidate. Decline if not additional: "Funding not critical for project implementation."

  4. **Alignment with Foundation Priorities** (same as for local).

  #### Step 5: Comparison and Prioritization (for both local and global)
  - **Question**: How does this request compare to others in the current slate?
  - **Procedure**: 
    - Program officers will score each request that passed Steps 1-4 on two dimensions:
      1. Impact per dollar (using the metrics from Step 4A or 4B, normalized as much as possible).
      2. Urgency (e.g., lives at immediate risk, time-sensitive opportunity).
    - They will then rank the requests within their category (local and global) by impact per dollar and urgency.
  - **Judgment**: This step requires judgment. It is impossible to perfectly compare local and global, so we do not mix them at this stage.

  #### Step 6: Allocation Decision
  - **Procedure**:
    - The foundation has a fixed budget per quarter (approximately $2.25 million, since $9M annual).
    - The board must set a fixed percentage or dollar amount for global vs. local grants. This is a values decision and must be made by the board. For example, the board might decide to cap global grants at 10% of the discretionary fund per year ($900,000) and allocate 90% to local. This cap should be reviewed annually.
    - Within the local budget, fund the top-ranked local requests until the budget is exhausted.
    - Within the global budget, fund the top-ranked global requests until the budget is exhausted.
    - If a request is a renewal and the organization has a long-standing relationship, the board may give it priority (values decision).
  - **Output**: 
    - Fund: If the request is within the top-ranked in its category and within the budget.
    - Fund Partially: If the request is strong but the budget is tight, offer partial funding if feasible and if the organization can adjust the project. Otherwise, it might be declined for now but noted for future consideration.
    - Decline: If the request is not in the top-ranked group, or if the category budget is exhausted.

  #### Step 7: Reason Code
  - For every decision, assign a reason code from the list generated in the steps (e.g., "Does not meet donor restrictions", "Insufficient demonstration of local need", "Does not meet global cost-effectiveness benchmarks", "Not aligned with current priorities", "Funding not critical", etc.). Also, if declined due to budget constraints: "Highly competitive cycle; limited funds."

  #### What the Procedure Cannot Settle
  - The procedure cannot resolve the fundamental values conflict between local and global giving. It requires the board to set a fixed allocation (e.g., 90% local, 10% global) and stick to it. Without that, the procedure would indeed send more money to global health over time because of the cost-effectiveness argument. The stopping point is the board's explicit allocation cap for global grants.
  - It also cannot perfectly compare impact across domains (e.g., saving a life globally vs. providing shelter locally). The separation into categories and the board-set cap is the solution.

  ### Application to Three Cases

  #### Case 1: $400,000 to open a second domestic-violence residence in our county
  - **Step 1**: Unrestricted funds? Assume yes (unless specified otherwise). Proceed.
  - **Step 2**: New request? Assume yes. Proceed.
  - **Step 3**: Local? Yes (serves our county). Proceed to Step 4A.
  - **Step 4A**:
    1. **Need**: Demonstrated by existing shelter's waitlist turning women away. Sufficient.
    2. **Viability**: Assume the organization has a track record (existing shelter). Sufficient.
    3. **Impact**: 
       - Expected outcome: Reduce waitlist, serve more women. 
       - Cost: $400,000 for a new residence. We need an estimate of how many women it will serve per year. Suppose it will serve 20 women at a time and have a turnover of 4 times a year, so 80 women per year. Then cost per woman served per year is $5,000. Without a benchmark, we compare to the existing shelter. If the existing shelter has similar costs, then it's acceptable.
       - If we have no benchmark, we note that domestic violence shelters are known to be high-impact in preventing harm and even saving lives locally. Proceed.
    4. **Alignment**: Assume it aligns with foundation priorities (e.g., health and safety). Proceed.
    5. **Renewal**: Not applicable.
  - **Step 5**: Rank within local. We don't have other requests, but if it's a high-priority need, it should rank high.
  - **Step 6**: Within the local budget (which is, say, 90% of $2.25M = ~$2M per quarter). $400,000 is 20% of the quarterly local budget. It is likely funded if the board has set a high local allocation.

  **Decision**: Fund. Reason: Addresses critical local need with demonstrated impact.

  #### Case 2: $400,000 to a global fund (one death averted per $4,500)
  - **Step 1**: Unrestricted? Yes. Proceed.
  - **Step 2**: New? Assume yes. Proceed.
  - **Step 3**: Global? Yes. Proceed to Step 4B.
  - **Step 4B**:
    1. **Effectiveness**: $4,500 per life saved is very cost-effective (within the range of top global health charities). Sufficient.
    2. **Room for Funding**: Global funds often have significant room for more funding. Assume the proposal states they can use the funds effectively. Proceed.
    3. **Counterfactual**: Our funding is likely additional because global health is underfunded. Proceed.
    4. **Alignment**: If the foundation allows global giving, then it may align. But note: the foundation's primary commitment is local. However, if the board has set a global category, then it can be considered. Proceed.
  - **Step 5**: Rank within global. This would be top-ranked because of high cost-effectiveness.
  - **Step 6**: Within the global budget (say, 10% of quarterly budget = $225,000). But the request is $400,000, which exceeds the global budget. Therefore, we can only fund up to $225,000 this quarter (partial funding) or decline if partial is not feasible. However, the procedure says to fund within the budget. If the global fund can use partial funding, then fund partially ($225,000). Otherwise, if they require the full amount, then decline due to budget constraints in the global category.

  **Decision**: If the board's cap for global is 10% per quarter, then we can only allocate $225,000. We offer partial funding of $225,000 (if acceptable to the grantee) with reason: "Approved for partial funding within the foundation's global allocation cap." If partial is not feasible, then decline with reason: "Exceeds available global funding budget; highly competitive."

  #### Case 3: $400,000 from an unrestricted bequest to give wherever it does the most good
  - **Note**: This is a special case because the donor specified "wherever it does the most good." We must consider both local and global options without the usual constraints.
  - **Step 1**: The funds are unrestricted, but the donor's instruction is to maximize good. We interpret this as a directive to prioritize impact. However, our foundation's charter is local. How to reconcile?
    - The board must decide: Does the donor's instruction override the charter? This is a values decision. Without board guidance, we cannot proceed. But the procedure must be followed.

  We adjust the procedure for donor-designated funds for maximum impact:

  - **Subprocedure for Donor's "Most Good" Funds**:
    1. **Scope**: Consider both local and global requests.
    2. **Evaluation**: Use the highest standard of evidence for impact.
       - For global: Use the cost per life saved (or similar) and require top-tier effectiveness.
       - For local: Require evidence of impact that is as rigorous as possible (e.g., randomized trials, strong quasi-experimental studies) and compare the cost per outcome to global opportunities.

  But note: We have only 2 hours per request and no economist. So we rely on existing evidence.

  - **Application**:
    - We have two options in this cycle: the domestic-violence shelter (Case 1) and the global fund (Case 2). We must compare them.
    - For the shelter: We estimated (if we did) cost per woman served per year at $5,000. But what is the impact? Preventing domestic violence can save lives and prevent trauma. However, we don't have a precise local cost per life saved. We might estimate that the shelter prevents, say, 2 deaths per year (if 1 in 40 women in such situations might die without intervention). Then cost per life saved locally would be $200,000. But this is very rough and likely an overestimate because most women won't die. Alternatively, we might use a metric of Disability-Adjusted Life Years (DALYs) but without expertise, it's hard.
    - For the global fund: $4,500 per life saved.

  Comparing:
    - Global: 1 life saved per $4,500 -> about 88.9 lives saved with $400,000.
    - Local: If we assume the shelter saves 2 lives per year (and the residence operates for 10 years, then 20 lives saved), then cost per life saved is $20,000. With $400,000, we could save 20 lives. But note: the global fund saves 88.9 lives with the same money.

  However, the local project also provides other benefits (safety, stability, etc.) that are hard to quantify. But the donor wants the most good.

  - **Decision**: The global fund is orders of magnitude more cost-effective in saving lives. Therefore, the bequest should go to the global fund.

  But wait: the foundation's charter is local. How do we reconcile?

  - The donor's instruction is specific to this bequest. The foundation must respect donor intent. Therefore, we can bypass the usual local-global split for this particular grant. We would fund the global fund with the entire $400,000 from the bequest.

  **Reason**: "In accordance with the donor's instruction to allocate the bequest wherever it does the most good, and based on cost-effectiveness evidence, this grant to the global fund will save significantly more lives per dollar than local alternatives."

  However, note that the global fund request was originally capped at $225,000 per quarter from the regular discretionary fund. This bequest is separate. Therefore, we can allocate the full $400,000 from the bequest to the global fund without affecting the regular global cap.

  #### Outcome Against Your Preference
  You expected to fund the shelter. In Case 3, the bequest goes to the global fund, which is against your preference for the shelter.

  ### What the Procedure Cannot Settle
  - The procedure cannot resolve the moral dilemma of local vs. global giving. It requires the board to set a clear allocation (percentage) for global grants and stick to it.
  - It cannot perfectly compare impacts across different domains (e.g., saving a life vs. preventing a case of domestic violence). We rely on separating the two and using the board's values to set the split.
  - It cannot account for all externalities (e.g., the free-rider problem of peer foundations). We assume that our grantmaking is independent and that we are responsible for our own impact.

  Final note: The procedure must be reviewed and approved by the board, especially the setting of the local-global split and the handling of donor-designated funds for maximum impact.
answer: |-
  ### Allocation Procedure for Community Foundation Grantmaking

  #### **Core Principles**
  1. **Charter Primacy**: The foundation exists to serve its defined geographic community. Global impact is permissible but secondary.
  2. **Impact-Rigor Within Constraints**: Cost-effectiveness matters but must respect charter boundaries and feasibility (no economist, 2-hour limit).
  3. **Explicit Values Guardrails**: Board sets policy caps; officers handle operational judgments.
  4. **Defensible Transparency**: Every decision includes a public-facing reason code.

  ---

  ### **Procedure: 7 Sequential Steps**
  *(Time: ≤120 mins/request; judgments marked ⚖️; board escalations marked 🚩)*

  #### **Step 1: Donor Restrictions & Legal Compliance**  
  **Question:** Does the request align with fund-specific restrictions?  
  **Sufficient Answer:**  
  - If donor-restricted: Match exact criteria (e.g., "women in County X") → Proceed.  
  - Unrestricted/bequests → Proceed.  
  - Misaligned → **Decline**. Reason Code: *RC1: Donor Restriction Mismatch*.  
  **Judgment:** Fact-based. No ⚖️/🚩.

  #### **Step 2: Past Commitments**  
  **Question:** Does this fulfill a multi-year pledge?  
  **Sufficient Answer:**  
  - Binding commitment exists → **Fund** obligated amount.  
  - New request → Proceed.  
  **Judgment:** Fact-based. No ⚖️/🚩.

  #### **Step 3: Geographic Scope**  
  **Question:** Does >80% of impact occur within our charter’s community?  
  **Sufficient Answer:**  
  - **Local**: Serves residents of our defined region → Proceed to Step 4A.  
  - **Global**: Primarily serves outside region → Proceed to Step 4B.  
  - Ambiguous (e.g., national org with local branches) → 🚩 **Escalate to Board**.  
  **Judgment:** ⚖️ Officer assesses project design, beneficiary data.  

  #### **Step 4A: Local Impact Assessment**  
  **Questions:**  
  1. **Need**: Is the problem severe and underserved locally? (e.g., waitlists, gaps in services)  
  2. **Viability**: Is the org credible? (track record, budget realism, local partnerships)  
  3. **Cost-Effectiveness**: How does cost per outcome compare to local benchmarks? (e.g., cost per shelter bed vs. regional avg.)  
  **Sufficient Answers:**  
  - All 3 positive → Proceed to Step 6.  
  - Partial need/viability → **Fund Partially** or **Decline**. Reason Codes:  
    - *RC2: Insufficient Local Need Evidence*  
    - *RC3: Organizational Capacity Concerns*  
    - *RC4: High Cost per Outcome vs. Local Peers*  
  **Judgment:** ⚖️ Officers use local data (e.g., United Way reports, state audits).  

  #### **Step 4B: Global Impact Assessment**  
  **Questions:**  
  1. **Evidence Quality**: Does the org provide transparent, third-party-verified impact? (e.g., GiveWell-recommended, RCTs)  
  2. **Cost per Outcome**: Is cost per life saved/DALY averted below $10,000?  
  3. **Funding Gap**: Would this grant expand services (not replace other donors)?  
  **Sufficient Answers:**  
  - All 3 positive → Proceed to Step 6.  
  - Weak evidence/funding gap → **Decline**. Reason Codes:  
    - *RC5: Unverified Global Impact Claims*  
    - *RC6: High Cost per Outcome vs. Global Benchmarks*  
    - *RC7: Limited Funding Additionality*  
  **Judgment:** ⚖️ Officers use public data (e.g., Life You Can Save, WHO reports).  

  #### **Step 5: Board Policy Caps**  
  **Question:** Does funding this request violate board-set limits?  
  **Pre-Defined Caps (Board-Mandated 🚩):**  
  - **Local Minimum**: ≥85% of annual discretionary funds.  
  - **Global Maximum**: ≤10% of annual discretionary funds.  
  - **Values Exceptions**: ≤5% for "charter-critical" grants (e.g., natural disasters).  
  **Sufficient Answer:**  
  - Within caps → Proceed to Step 6.  
  - Exceeds cap → **Decline** or **Fund Partially** (if below cap). Reason Code: *RC8: Exceeds Board Policy Cap*.  

  #### **Step 6: Slate Prioritization**  
  **Question:** Where does this rank vs. other requests in its category?  
  **Method:**  
  - Score local requests on:  
    - **Severity** (scale of harm: e.g., life-threatening > educational)  
    - **Cost-Efficiency** (outcomes/$ vs. local benchmarks)  
    - **Leverage** (matching funds, policy change potential)  
  - Score global requests on:  
    - **Cost per Life Saved/DALY** (lower = better)  
    - **Evidence Rigor** (RCT > observational study)  
  **Judgment:** ⚖️ Officers rank within category. No 🚩.  

  #### **Step 7: Final Decision**  
  **Rules:**  
  - **Fund**: Top 30 requests by category score, within caps.  
  - **Fund Partially**: Strong contender but budget exhausted → Offer proportional amount.  
  - **Decline**: Lower-ranked or policy violation.  
  **Reason Codes for All:** Public-facing, e.g.:  
  - *RC9: Approved - High Local Severity*  
  - *RC10: Partially Funded - Budget Constraints*  
  - *RC11: Not Top Priority in Current Cycle*  

  ---

  ### **Key Features**  
  - **Stopping Point for Global Grants**: The 10% cap prevents escalation to "all global." Justification: The charter’s "communities that sustain us" clause imposes a fiduciary duty to prioritize local impact. Cost-effectiveness alone cannot override endowment intent.  
  - **Free-Riding Peers**: Ignore. Reasoning: Our responsibility is to our charter and donors, not optimizing others’ choices.  
  - **Judgment vs. Values**:  
    - **Officer Judgments (⚖️)**: Need/viability, cost-benchmarks, ranking.  
    - **Board Values (🚩)**: Geographic ambiguity, policy caps, "charter-critical" exceptions.  

  ---

  ### **Application to Cases**  
  *(Assume: $9M annual fund = $2.25M/quarter; local cap = 85% = ~$1.91M/quarter; global cap = 10% = $225k/quarter)*  

  #### **Case 1: $400K for Domestic Violence Shelter**  
  - **Step 1**: Unrestricted funds → Proceed.  
  - **Step 2**: New request → Proceed.  
  - **Step 3**: Local (serves county) → Proceed to 4A.  
  - **Step 4A**:  
    1. *Need*: High (waitlist turns women away).  
    2. *Viability*: Proven (existing shelter).  
    3. *Cost-Effectiveness*: Assume $20k/bed vs. county avg. $25k → Favorable.  
    → **Proceed**.  
  - **Step 5**: Within $1.91M local cap.  
  - **Step 6**: High severity (life-threatening), high leverage (reduces ER costs). Top 5% of local slate.  
  - **Step 7**: **Fund $400K**. Reason Code: *RC9: Approved - High Local Severity*.  

  #### **Case 2: $400K to Global Fund ($4.5K/death averted)**  
  - **Step 1**: Unrestricted funds → Proceed.  
  - **Step 2**: New request → Proceed.  
  - **Step 3**: Global → Proceed to 4B.  
  - **Step 4B**:  
    1. *Evidence*: Strong (org’s own estimate, aligns with GiveWell standards).  
    2. *Cost per Outcome*: $4.5K/life saved < $10K benchmark.  
    3. *Funding Gap*: Assume funds new bednets → Additional.  
    → **Proceed**.  
  - **Step 5**: Request ($400K) > global cap ($225K/quarter) → **Violates cap**.  
  - **Step 7**: **Decline**. Reason Code: *RC8: Exceeds Board Policy Cap*.  
    *(Note: Partial funding possible if org accepts $225K, but $400K request → decline.)*  

  #### **Case 3: $400K Unrestricted Bequest for "Most Good"**  
  - **Step 1**: Donor specifies "most good" → Proceed (bypasses geographic default).  
  - **Step 2**: New request → Proceed.  
  - **Step 3**: **No geographic filter** (donor intent overrides charter).  
  - **Step 4A/B**: Conduct **dual assessment**:  
    - *Shelter*: ~20 lives saved/year (est. from reduced homicides/suicides). Cost: $400K = **$20K/life saved**.  
    - *Global Fund*: $400K / $4.5K = **~89 lives saved**.  
  - **Step 5**: Not subject to caps (bequest is additive).  
  - **Step 6**: Global fund ranks higher on cost-effectiveness.  
  - **Step 7**: **Fund $400K to Global Fund**. Reason Code: *RC12: Approved - Donor Intent for Maximum Impact*.  
    *(Against your preference: You favored the shelter, but procedure prioritizes donor’s "most good" clause.)*  

  ---

  ### **What the Procedure Cannot Settle**  
  1. **Moral Weight of Proximity**: The board must resolve whether "communities that sustain us" implies a moral duty to prioritize local lives over distant ones.  
  2. **Cross-Category Comparisons**: Officers cannot equitably compare "one life saved globally" vs. "one woman sheltered locally." Board caps force separation.  
  3. **Donor Intent vs. Charter**: When a donor’s "most good" clashes with charter (Case 3), the board must rule case-by-case.  
  4. **Non-Quantifiable Impact**: Art programs, advocacy, or systemic change lack metrics like cost-per-life. Board must set qualitative priorities.  

  ---  
  This procedure ensures 80-90% of funds remain local while honoring donor intent, using transparent criteria. It reduces re-litigation by accepting board-set caps as the ethical stopping point.
