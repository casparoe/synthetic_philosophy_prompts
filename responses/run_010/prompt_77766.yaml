prompt: |-
  Context, then the ask. I'm one of two people drafting the methodology annex for a public inquiry into how a regional child-protection service failed over roughly thirty years — composite situation, I'd rather not name a real one, but you know the shape: homes got licensed that should never have been licensed, warnings went into files nobody opened, and each death on its own looked like a 'tragic accident' while the whole set of them did not. The annex has to say up front what the inquiry will count as an explanation of how this happened. Not what it will conclude. What will qualify as an explanation at all.

  The table is badly mixed. Half the commissioners are ex-judges who want something that looks like a derivation; the other half ran NGOs and think in stories about particular people; the lawyers want whatever we write to survive cross-examination; and the report eventually has to be read by the families, who are not going to read a philosophy of social science.

  So before anyone starts arguing about Hempel or narrativism in the abstract, give me the requirements list. What does an account of 'how this came about' have to be able to do to be adequate for us — where adequacy is fixed by our purposes, which are: usable in a public report, capable of underwriting statements about who could have acted otherwise, defensible clause by clause under hostile questioning, and followable by non-specialists without a diagram.

  For every requirement, give the situation behind it — a concrete thing an inquiry like ours will run into that the requirement exists to handle. I mean cases like: a minister who signed nothing and can't be shown to have decided anything; a report that was commissioned, delivered, and never opened; a pattern that only exists across forty seperate individually-unremarkable decisions; the awkward fact that a comparable region with the same budget and the same statute didn't collapse; and the fact that the people who ran the service mostly thought they were doing their jobs competently.

  Then sort the list, and be blunt about it. Which requirements are non-negotiable for our purpose. Which are really just the house style of one of the camps at the table — the ex-judges' insistence that every explanatory step be backed by a generalisation that would carry over to a comparable case, the NGO half's insistence that it read as one continuous sequence with a through-line — and should be named as preferences rather than smuggled in as criteria. And which ones aren't about explanation at all but about presentation, and belong in the writing brief rather than the annex.

  The part I most want: tell me which subsets of these requirements cant be jointly satisfied, and where exactly the break is. My own suspicion is that 'every step must be backed by a transferable generalisation' and 'the whole must be holdable in one head as a single sequence' pull apart once you're covering three decades, and that 'it must show the outcome was avoidable' fights with 'it must show the outcome was what this system produced, not what villains did' — the more you secure the second, the less anyone is left to blame. Say whether that's right or whether I've got the wrong pairing. And say whether anything in the middle gets both — a mechanisms-flavoured account, or Dray's move of explaining an action by showing it was the reasonable thing for that agent in that situation — and what such a middle position has to give up to fit through our constraints.

  Last: which single requirement, if we adopt it, knocks out the most candidates? If one clause in the annex is going to do nearly all the work, I want to know which clause and what it excludes.

  Table or list, whichever is clearer. No reading list and no bibliography — I wouldn't get to it, and the annex certainly can't cite a stack of philosophy books.
reasoning: |-
  Hmm, this is a complex and high-stakes request about defining explanatory standards for a public inquiry into systemic child protection failures. The user is drafting a methodology annex and needs to cut through academic debates to establish practical criteria that satisfy multiple stakeholders: ex-judges who want deductive rigor, NGO veterans who prefer narrative, lawyers demanding defensibility, and bereaved families needing accessibility.

  Key tensions emerge:
  - The need to show avoidability while avoiding villain narratives
  - Balancing transferable generalizations with coherent sequence
  - Explaining systemic outcomes without individual blame targets

  The user's suspicion about incompatible requirements is sharp - particularly the conflict between "avoidable through different choices" and "inevitable given system parameters." This is the core paradox of institutional failure inquiries.

  For the requirements list, I'll prioritize:
  1. Non-negotiables: Defensibility, causal clarity, accessibility
  2. Group preferences: Judges' generalizations vs NGO continuity
  3. Presentation elements to separate out

  The minister-who-signed-nothing example perfectly illustrates the "responsibility without action" dilemma. The comparable-region case demands counterfactual handling. Both show why "reasonable agent" explanations (Dray) may bridge gaps - but this risks normalizing failure.

  The knockout requirement is likely "must identify specific intervention points where different actions would have changed outcomes." This excludes purely structural accounts and fatalistic narratives while demanding concrete "what-if" analysis - exactly what inquiries exist to provide.

  I'll structure the response as:
  - Requirements table with concrete examples
  - Sorting into non-negotiables/preferences
  - Conflict analysis centered on avoidability vs systemicity
  - Knockout clause identification
  - No theory citations as requested
answer: |-
  Here’s a requirements list sorted by priority, with concrete justifications, conflicts flagged, and preferences separated. The table format clarifies the "why" behind each requirement.  

  ### **Non-Negotiable Requirements**  
  *(Essential for the inquiry’s purpose: defensible, actionable, public-facing explanations)*  

  | Requirement | Why It’s Non-Negotiable | Concrete Situation It Handles |  
  |-------------|--------------------------|-------------------------------|  
  | **Must identify specific, documentable points where interventions could have altered outcomes** | Without this, the inquiry fails its core purpose: showing *how* failure was preventable. | The "report never opened": Shows a concrete moment (e.g., supervisor’s inbox) where reading it would have triggered action. Avoids vague "systemic" hand-waving. |  
  | **Must trace causal pathways from decisions/inactions to harms** | Required for legal defensibility and to show *how* A led to B. Hostile Qs will drill gaps. | The "40 unremarkable decisions": Links individual licensing approvals (A) to overloaded inspectors (B) to missed warnings (C). |  
  | **Must be verifiable against evidence (documents, testimony)** | Cross-examination will eviscerate unsupported claims. Families need facts, not speculation. | The "minister who signed nothing": Requires proof (e.g., meeting minutes) showing they *knew* risks but deferred action. |  
  | **Must be accessible to non-specialists** | Families deserve clarity. Jargon or abstraction betrays public trust. | Complex regulatory failures (e.g., "budget reallocations") must be explained in plain terms: "Money for inspections was cut by 30% in 2005." |  
  | **Must show why the outcome was NOT inevitable** | Otherwise, accountability is impossible. Assigns no blame but reveals forks in the road. | The "comparable region didn’t collapse": Highlights differences (e.g., Region B had independent audit powers; Region A did not). |  

  ### **Negotiable Preferences**  
  *(Group-specific tastes; frame as "options" not "requirements")*  

  | Preference | Camp | Why It’s a Preference, Not a Requirement | Risk If Forced |  
  |------------|-------|------------------------------------------|----------------|  
  | Every step backed by transferable generalizations | Ex-judges | Useful for policy but risks false universals. Real-world chaos rarely fits neat rules. | Forces oversimplification. E.g., "All underfunded services fail" ignores the comparable region. |  
  | Single continuous narrative with "through-line" | NGO veterans | Satisfying for storytelling but may ignore disjointed reality. | Glosses over fragmented decisions (e.g., 30 years of scattered warnings). |  
  | Centered on individual agency/responsibility | Lawyers/NGOs | Appeals to blame but obscures systems. | Falls apart for "minister who signed nothing" or dispersed decisions. |  

  ### **Presentation Elements (Move to Writing Brief)**  
  *(About *how* explanations are communicated, not their substance)*  
  - "No philosophy jargon"  
  - "Use timelines/diagrams *optionally*, not as crutches"  
  - "Name key actors but avoid sensationalizing"  

  ---

  ### **Conflicts Between Requirements: Where They Break**  
  Your suspicions are correct. These pairs **cannot be fully satisfied simultaneously**:  

  1. **"Transferable generalizations" vs. "Single holdable sequence"**  
     - **Conflict**: Generalizations demand abstraction (e.g., "regulatory capture"); narratives demand concrete, linear cause-effect.  
     - **Break Point**: Over 30 years, the "sequence" becomes a spaghetti of events. Forcing a "through-line" (e.g., "declining staff morale") ignores contradictory evidence (e.g., some teams excelled). Generalizations (e.g., "underfunding causes failure") collapse when the comparable region succeeded.  
     - **Outcome**: Choose one. The NGO narrative loses defensibility; the judges' approach loses accessibility.  

  2. **"Outcome was avoidable" vs. "Outcome was the system’s product (not villains)"**  
     - **Conflict**: Avoidability requires *someone* could have acted differently. "System’s product" diffuses responsibility.  
     - **Break Point**: The "people thought they were competent" problem. If everyone followed protocol (system’s product), avoidability hinges on *which* protocols were flawed—but changing those requires blaming rule-makers.  
     - **Outcome**: **You can bridge this with mechanisms/Dray**:  
       - *Mechanisms*: Show how specific structures (e.g., "no cross-department data sharing") made failures *likely* but not inevitable.  
       - *Dray’s "reasonable agent"*: Explain actions by context (e.g., "Given caseloads, skipping inspections was rational").  
       - **Cost**: Blame shifts from individuals to *rule-setters* (e.g., lawmakers who underfunded audits). Families may see this as excusing frontline workers.  

  ---

  ### **The Knockout Requirement**  
  **"Must identify specific, documentable points where interventions could have altered outcomes"**  
  - **Why it knocks out most candidates**:  
    - Excludes purely structural explanations (e.g., "neoliberalism caused collapse") → no intervention points.  
    - Excludes fatalistic narratives (e.g., "this was inevitable") → no avoidability.  
    - Excludes vague blame (e.g., "culture of negligence") → no concrete evidence.  
  - **What survives**:  
    - Mechanistic accounts (e.g., "If Inspector X had followed Protocol Y on [date], Child Z would be alive").  
    - Dray-style explanations (e.g., "Protocol Y was unreasonable given caseloads; changing it earlier was feasible").  

  ---

  ### **Final Sorting**  
  1. **Anchor the annex in non-negotiables**. They ensure legal soundness, public utility, and accountability.  
  2. **Explicitly frame preferences as "approaches we considered"** (e.g., "Some commissioners emphasized narratives; others emphasized generalizable lessons").  
  3. **Relegate presentation rules to the writing brief**.  
  4. **Admit conflicts upfront**: "No explanation can simultaneously satisfy all stakeholder desires. We prioritize verifiable causal pathways showing preventability."  

  **Blunt truth**: The judges’ generalizations and the NGOs’ narratives are both valuable but partial. The knockout requirement forces the table to focus on **actionable truths**—not philosophical purity. Your middle path (mechanisms/Dray) works if you accept:  
  - **What it gives up**: Villains for everyone. Families may want scalps; lawyers want clear liability.  
  - **What it gains**: A defensible, human explanation of how good people enabled horror.
