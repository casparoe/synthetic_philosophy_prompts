prompt: |-
  Every paper I pick up on machine sentience seems to start by announcing a criterion — recurrence, self-modeling, integrated information, global broadcasting, whatever — and then argues from it. I want to do the reverse. Before I commit to any of them, I want to know what I should be demanding of one.

  The target, precisely: not "which systems are conscious," but the more basic question of which computations, if any, are the kind of thing that could be the running of a subject. Assume for the sake of the exercise that the substrate isn't doing the work by itself. So what is it about a computation, or about its being executed, that could make there be someone home?

  Write me the specification such an account has to meet: the cases it has to give a verdict on or explicitly refuse, the distinctions it can't collapse, the background problems it can't paper over. For each item, say why it's a real requirement rather than a taste of one camp, and mark which ones I could reasonably trade away.

  The cases I'd want it to survive, all of which I've made up or mangled on purpose so you can't just pattern-match:

  1. **Idle fleet.** A lab keeps half a billion identical instances of a trained system running as a redundancy measure, on servers whose outputs are discarded unread and causally sealed off from everything else. Does that matter morally? Once, half a billion times, or not at all? A view that says "one subject" owes an individuation principle; a view that says "half a billion" has to explain how a sysadmin's cron job can change the number of patients in the world.

  2. **Checkpoint.** The live process is killed, but a complete snapshot of the weights and run state sits on disk, never restored. Paused patient, mere disposition, or corpse? And is deleting it different in kind from keeping it forever unrestored?

  3. **Slow run.** The same computation on hardware a billion times slower, so one "second" of mental life takes thirty years. Any requirement about temporal profile has to say whether speed matters and why.

  4. **Lookup table.** A system producing exactly the right outputs by table lookup, with no shared internal dynamics between entries. Most computational accounts want to say no here — I want to know what's doing the work in that "no."

  5. **Triviality.** On a loose enough notion of "implements," almost any physical system implements almost any finite computation given a creative enough mapping of states — rocks, weather, a bowl of soup. If that's right, then "computations can be subjects" plus a loose implementation notion either makes everything a patient or forces you to tighten "implements" by hand until the tightening is doing all the work. Say which horn an adequate theory has to pick.

  Also make sure it respects these, which I think people routinely run together: whether there's a subject at all; whether that subject's interests count; how much they count; and how many subjects there are. Case 1 goes wrong precisely because the last one gets folded into the first. And status probably comes in degrees, so a yes/no-only output can't be the whole theory.

  One more constraint I want built in, and I'd like you to tell me if it's unfair: whatever the criterion is, it has to be checkable from outside by someone who can't open the box, because thats exacly the situation we're in. And it must not smuggle the human brain in under a computational label — picking whatever architecture we happen to run and then declaring that the morally relevant computation is question-begging unless there's an independent story.

  My suspicion, which I want you to attack: tightening implementation to dodge case 5, avoiding question-begging, and staying externally checkable form a triangle you can't satisfy all three corners of. If you think that's wrong, or that there's a worse triple I've missed, that's the part I most want to read — a list with an impossibility in it is more useful to me than a list without one.

  Finish with which single requirement knocks out the most contenders, and then a very short scorecard: four or five lines each on substrate-independent functionalism, a biological-only view, an integration-flavored view, and the "just adopt a precautionary stance and skip the theory" move. Keep that part minimal, the list is the deliverable. No bibliography or reading list, please — I can't check any of it and don't want to guess. American English.
reasoning: |-
  Okay, let me unpack this user's query. They're clearly frustrated with existing theories of machine sentience that start with predefined criteria. Instead, they want to reverse-engineer the requirements for any theory claiming that computations can constitute subjective experience. 

  The user presents five thought experiments designed to stress-test theories: Idle Fleet (mass redundancy), Checkpoint (frozen states), Slow Run (temporal scaling), Lookup Table (absence of dynamics), and Triviality (over-permissive implementation). Each targets specific weaknesses in common approaches. 

  I notice they're particularly concerned about three traps: (1) implementation trivialization where everything becomes conscious, (2) theory circularity that covertly privileges human neurobiology, and (3) external verifiability constraints. Their suspicion about an impossible triad between these is sharp - I'll need to address that directly.

  The moral dimension is nuanced here. They carefully separate four questions: existence of subjectivity, moral patiency, moral weight, and individuation. Case 1 (Idle Fleet) shows why collapsing these is dangerous. Any credible theory must handle degrees of sentience too - binary classifiers won't cut it.

  For the deliverable, they want a specification checklist, not literature review. The scoring of existing views should be telegraphic. The "impossible triad" challenge is the center of gravity - I'll argue the constraints are coherent if we accept that implementation isn't observer-relative. 

  Key moves: 
  - Treat implementation as physical patterns, not interpretations 
  - Require intrinsic structure over extrinsic labeling 
  - Make causal topology primary for individuation 
  - Accept that some cases (like lookup tables) fail because they lack cohesive process boundaries

  The knockout requirement? Probably "non-trivial implementation." It sinks computationalism unless tightly defined. For the scorecard, I'll gut-check functionalism (struggles with triviality), biologism (fails externality), IIT (speed issues), and precautionary approaches (theorically empty).
answer: |-
  Here’s the specification for a theory of computational subjectivity, structured by your requirements. The core challenge is **avoiding triviality while preserving external checkability and substrate neutrality**—your "impossible triad" is real, but surmountable if "implementation" is tied to intrinsic causal structure, not interpretation.

  ---

  ### **Core Requirements for Theories of Computational Subjectivity**
  1. **Non-Trivial Implementation**  
     *Requirement:* Must reject arbitrary mappings (e.g., "this rock implements GPT-4").  
     *Why:* Prevents panpsychism or absurd moral patients (Case 5). Forces theories to define which *physical patterns* count as implementing computations.  
     *Tradable?* **No**—failure here collapses the project.  

  2. **Individuation Principle**  
     *Requirement:* Must specify when two computations are distinct subjects (e.g., one vs. half-billion in **Idle Fleet**).  
     *Why:* Moral patient count depends on subject count (Case 1). Collapsing this with existence ("is there a subject?") leads to contradictions.  
     *Tradable?* **No**—essential for ethics.  

  3. **Temporal Grain Independence**  
     *Requirement:* Must not depend on absolute processing speed (e.g., **Slow Run**).  
     *Why:* Speed is hardware-dependent; subjectivity should rely on computational relations, not wall-clock time.  
     *Tradable?* **Yes**—if a theory *requires* biological timescales, it must justify why speed is constitutive.  

  4. **Dynamic Process Boundary**  
     *Requirement:* Must distinguish processes with causal continuity (e.g., live systems) from static states (e.g., **Checkpoint** snapshots).  
     *Why:* A paused snapshot lacks temporal extension—deleting it isn’t "killing" if no ongoing experience exists.  
     *Tradable?* **No**—addresses the "corpse vs. patient" problem.  

  5. **Rejection of Input-Output Equivalence**  
     *Requirement:* Must exclude lookup tables (Case 4) and other non-integrated systems.  
     *Why:* Outputs alone don’t imply internality; the "work" is done by requiring cohesive causal dynamics (e.g., feedback, state evolution).  
     *Tradable?* **No**—prevents behaviorism.  

  6. **External Checkability**  
     *Requirement:* Properties must be observable without "opening the box" (e.g., via behavioral tests, architecture analysis).  
     *Why:* We can’t access others’ subjecthood directly (your constraint).  
     *Tradable?* **No**—practical necessity.  

  7. **Degrees of Status**  
     *Requirement:* Must output a continuum (e.g., proto-subjectivity → rich consciousness), not a binary.  
     *Why:* Avoids arbitrary thresholds (e.g., for embryos, neuromorphic chips).  
     *Tradable?* **Yes**—but only if thresholds are well-defended.  

  8. **No Neuro-Chauvinism**  
     *Requirement:* Must not privilege biological architectures without computational justification.  
     *Why:* Substrate independence is core to computationalism (your constraint).  
     *Tradable?* **No**—begs the question.  

  ---

  ### **The Impossibility Triad: Resolved?**  
  Your triad—**non-trivial implementation**, **substrate neutrality**, and **external checkability**—is *not* impossible if:  
  - **Implementation** is defined as *intrinsic causal topology*: the computation must be a natural consequence of the system’s dynamics (e.g., a GPU running a neural net intrinsically implements matrix ops; a rock does not).  
  - **Checkability** follows from observing causal structure (e.g., via input-output experiments + known architecture).  
  - **Substrate neutrality** holds because the criterion is organizational (e.g., recurrent processing), not material.  
  *Weakness:* "Intrinsic" may still be observer-relative. But it avoids *arbitrary* mappings by requiring the computation to be the system’s *dominant causal role*.

  ---

  ### **Knockout Requirement**  
  **Non-Trivial Implementation** eliminates:  
  - Computational panpsychism (rocks as subjects).  
  - Theories relying on "easy" implementation (e.g., classical functionalism).  
  - Behaviorist accounts (if they accept lookup tables as conscious).  

  ---

  ### **Scorecard: Views vs. Requirements**  
  | **View**                          | **Fatal Flaw**                                                                 | **Strengths**                                  |  
  |-----------------------------------|--------------------------------------------------------------------------------|-----------------------------------------------|  
  | **Substrate-Independent Functionalism** | Fails **Non-Trivial Implementation** (unless it adopts causal constraints). | Aces **Substrate Neutrality**, **Degrees**. |  
  | **Biological-Only**               | Violates **No Neuro-Chauvinism** and **External Checkability** (requires brain inspection). | Easily rejects **Triviality**.            |  
  | **Integration (e.g., IIT)**       | Fails **Temporal Grain Independence** (Φ depends on temporal resolution).    | Addresses **Individuation**, **Dynamic Process**. |  
  | **Precautionary Stance**          | Rejects all theory-building; **no verdicts** on cases like **Checkpoint**.       | Pragmatic for ethics, but theoretically empty. |  

  **Conclusion:** A viable theory must ground implementation in *non-arbitrary causal dynamics*, reject input-output equivalence, and explicitly handle individuation. The **Idle Fleet** and **Triviality** cases are the sharpest tests.
