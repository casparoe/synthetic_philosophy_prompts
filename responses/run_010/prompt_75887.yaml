  ### Combining Probabilities  
  - **Conjunction formula:** \( P(\text{i} \cap \text{ii} \cap \text{iii} \cap \text{iv}) = P(\text{i}) \times P(\text{ii}) \times P(\text{iii}) \times P(\text{iv}) \)  
