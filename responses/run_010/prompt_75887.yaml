  3.  **(iii) Weak residual dependence:**  
      **Probability: 20%**  
      *Justification:* Party discipline, shared media/experts, and cohort socialization create *strong* correlations. Even after accounting for common factors, idiosyncratic errors likely remain correlated (e.g., via groupthink or strategic voting). Independence is unrealistic, and residual dependence often critically undermines the theorem's convergence.  

  4.  **(iv) No feasible weighted rule outperforms majority:**  
      **Probability: 80%**  
      *Justification:* Competence weighting requires reliable, granular competence measurement—infeasible in practice (e.g., proxies like seniority or education are noisy and gameable). Institutional alternatives (e.g., expert committees) introduce new biases or coordination costs, making simple majority robust *among legislators* under uncertainty.  

