answer: |-
  Here’s a frank, line-by-line assessment of your argument, addressing your queries directly in British English:

  ### **1. Accuracy**  
  - **Standard formulation**: Your characterisation is fair. Framing Frege-Geach as originally targeting prescriptivism/ascriptivism (e.g., Hare) rather than contemporary expressivism is correct and underappreciated.  
  - **Gibbard/Schroeder**: Yes, both secure compositionality formally via recursive clauses over states (plans/factored attitudes for Gibbard; being-for for Schroeder). No straw man here.  
  - **Caveat**: Gibbard *might* object to your "borrowed rather than earned" phrasing. He sees plan-laden semantics as *internal* to planning discourse, not "borrowed" from descriptivism. But your point that higher-order attitudes mirror truth-conditional structures stands.  

  ### **2. Section 3’s Dilemma**  
  - **Distinctiveness**: This is **genuinely distinct** from "quasi-realism collapses into realism". That complaint targets *metaphysical* commitment; your dilemma targets *explanatory priority* in compositional semantics. You force expressivists to choose:  
    - *Horn 1*: Admit compositionality is fixed descriptively → attitude layer is redundant.  
    *Horn 2*: Explain logic expressivistically → face circularity (using logic to define attitudes for logic).  
  - **Earning its keep**: **Keep Section 3**. It’s the core engine of your redundancy charge. Without it, Section 4 lacks context.  
  - **Sharpening**: Explicitly contrast with Blackburn’s quasi-realism: his project avoids metaphysical collapse but doesn’t resolve your *semantic-explanatory* dilemma.  

  ### **3. Section 4 Stress Test**  
  - **Special difficulty?** Mixed compounds *are* a known pressure point, but your focus on disjunctive syllogism is acute. Expressivists *have* addressed mixed discourse (e.g., Schroeder’s *Being For*), but your critique remains potent.  
  - **Expressivist moves and assessment**:  
    - **Option 1**: *Unify via "ruling out"* (as you note). E.g., "P ∨ Q" expresses disapproval of simultaneously *not* planning for P and *not* believing Q.  
      - **Your objection holds**: Specifying "ruling out" requires prior grasp of *which combinations are inconsistent*—a representational notion.  
    - **Option 2**: *Primitive hybrid attitudes* (e.g., Schroeder’s "being for blaming for not A-ing").  
      - **Rebuttal**: This attitude is *stipulated* to mirror truth-conditional roles, again presupposing compositionality.  
    - **Option 3**: *Deny fundamental difference* (e.g., "believing" is a species of planning).  
      - **Risk**: Collapses expressivism into global pragmatism, abandoning its distinctiveness.  
  - **Verdict**: No move cleanly avoids presupposing compositionality. **Section 4 stands**, but tighten the argument: stress that the expressivist must *already know* the inference rules to define the attitude, rendering the attitude clause epiphenomenal.  

  ### **4. Section 5’s Deflationary Conclusion**  
  - **Not too concessive—it’s devastating if developed**:  
    - If attitude clauses only explain psychology, expressivism has *no semantic thesis*. Moral sentences’ meanings aren’t explained by expressed attitudes (contra core expressivist doctrine).  
    - Consequence: Frege-Geach wasn’t a "semantic" objection because expressivism *never offered a semantics*—only a psychology. This reframes the entire debate.  
  - **Strengthen**: Don’t call this "deflationary"; argue it **undermines expressivism’s foundational claim** to provide a semantic alternative to realism. *This makes the paper more interesting*, forcing expressivists to either abandon semantic ambitions or confront redundancy.  

  ### **5. Structural Advice for Cuts**  
  - **Cut Section 1 heavily**: Reduce to 1 paragraph. Specialists know Frege-Geach; your reframing is the focus.  
  - **Trim Section 2**: Keep the 3-step reframing but compress exegesis of Gibbard/Schroeder. Use footnotes for technical details.  
  - **Keep Section 3**: It’s indispensable.  
  - **Refine Section 4**: Focus on *one* mixed inference (disjunctive syllogism), not general compounds. Drop tangential examples.  
  - **Sharpen Section 5**: State the consequence boldly—expressivism as a *semantic* project is vacuous.  
  - **Word count strategy**: Sections 1 and 2 can lose ~1,500 words; Section 4 ~500; tighten prose elsewhere.  

  ### **Overall Diagnosis**  
  - **Strengths**: Your redundancy thesis is novel and potent. Sections 2-3 are airtight. Section 4’s stress test is effective if streamlined.  
  - **Supervisor’s concern ("arguing against nobody")**: Overstated. You’re not attacking a straw man but exposing a *structural weakness* in expressivism’s semantic foundations. Contemporary expressivists *do* claim to solve compositionality—your argument shows their "solution" presupposes what it should explain.  
  - **Critical fix**: **Clarify that Section 4 extends Section 3’s dilemma**: Horn 1 (parasitism) makes mixed discourse unproblematic but redundant; Horn 2 (expressivist logic) fails your disjunction test. This links sections and answers "who holds this?"—expressivists *must* choose one horn.  

  **Final cut recommendation**:  
  - **Priority**: Keep Sections 2-5 largely intact (especially 3 and 5).  
  - **Sacrifice**: Section 1’s historical recap; Section 4’s auxiliary examples.  
  - **Target**: 6,000 words is achievable by condensing exegesis and tightening prose. Your argument survives cuts if Sections 3 and 5 remain sharp.  

  ---  
  This paper has teeth. Its revisionism is defensible, and its conclusion—that expressivism’s semantic claims are idle—is significant. If you execute the cuts ruthlessly, this will punch well at the workshop.
