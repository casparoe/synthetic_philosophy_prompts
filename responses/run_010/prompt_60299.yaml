prompt: |-
  I run the fortnightly methods seminar in a health economics unit, and in three weeks I've got 75 minutes to teach the levelling-down objection to a room of people who do distributional cost-effectiveness analysis for a living. They're numerate, they've all fitted equity weights, and roughly half of them justify those weights out loud by saying we ought to care about narrowing health inequalities. What I want isn't the argument — I know it — it's a plan for how to teach it to them.

  Lead with the bottom line in your very first sentence: the one thing this session either does or doesn't achieve, the hinge the whole thing turns on. Then the plan. No preamble, and don't repeat the question back at me.

  What I need in it:

  - the order the pieces go in, and why each has to precede the next. I'm fairly convinced you can't run the objection at all until they've got the distinction between weighting a benefit because of the person's absolute level and weighting it because of where they stand relative to others, since thats the distinction the whole thing trades on — tell me if I've got that backwards, and if something else has to come even earlier.
  - the one example to build it on, and what it must have and must not have. Constraints from me: non-agential (nobody is choosing to take anything away, or they'll do harm-aversion instead of philosophy), fixed population, numbers small enough to hold in the head, and not income — money drags in desert and property intuitions that swamp the point. Health is fine, but say if there's a better currency.
  - the misconceptions they'll bring or form on the spot, and the exact point in the sequence where each one gets headed off. My list so far: that the objection is a recommendation to make the well-off worse off; that if equality isn't intrinsically valuable their equity weights have just lost their justification; that "better in one respect but not better all things considered" is a fudge rather than a distinction; and — the one I care about most — that because their weighting functions take individual baseline severity as input and never the gap, they were prioritarians all along and the objection never touched them. Handle that last one properly: what's right about it, and what it costs them to concede. Keep the comparative claim seperate from the recommendation throughout.
  - a check I can run in the final ten minutes that tells me whether it landed rather than whether they were being polite. Something with a fresh pair of distributions in it where the prioritarian and egalitarian verdicts come apart — and say what response would show they've got it and what response would show they haven't.
  - what I should openly refuse to cover at this level, and say so out loud. I'd rather tell them I'm skipping things than have them think the map I drew is the territory.

  British English throughout, please. And no reading list, no references, no titles — I'm not handing anything out and I don't want you guessing at them.
reasoning: |-
  Hmm, the user is organizing a health economics seminar and needs a plan to teach the levelling-down objection to an audience of experts in distributional cost-effectiveness analysis. They've given specific constraints and requirements for the session.

  The key points I need to address are:
  - The absolute hinge for the session is establishing that egalitarianism implies that levelling down health outcomes is "better in one respect" (the egalitarian respect), even when it makes no one better off and some worse off.
  - I need to structure the sequence carefully: starting with distinguishing absolute vs. relative weighting, then introducing levelling down through a health-focused example, addressing misconceptions at specific points.
  - The example must use health (not income), involve non-agential changes, fixed population, and small numbers (e.g., QALYs).
  - Critical misconceptions to address include:
    - That the objection recommends making the well-off worse off (address when introducing levelling down)
    - That rejecting intrinsic value of equality undermines equity weights (address during justification discussion)
    - That "better in one respect" is incoherent (address when presenting the core claim)
    - That their weighting functions make them prioritarians (address in the "cost of concession" section)
  - For the check, I'll propose comparing two distributions where prioritarians and egalitarians diverge, with specific correct/incorrect responses.
  - I should explicitly state limitations: not covering pluralist views, prioritarianism in depth, or non-health applications.

  The example I'll use involves two groups with different baseline health levels (Group A: 10 QALYs, Group B: 5 QALYs) and three interventions: one that helps Group B, one that helps Group A, and levelling down that worsens Group A to 8 QALYs while Group B remains at 5 QALYs.

  For the misconception about weighting functions, I'll clarify that while their models may appear prioritarian by using absolute baselines, the levelling-down objection challenges whether any relative inequality concern remains in their framework. The cost of conceding they're prioritarians is abandoning the "narrowing inequalities" justification.

  The final check involves a fresh distribution comparison where prioritarians would prefer helping the worse-off while egalitarians would find levelling down "better in one respect."

  I'll explicitly state we're not covering pluralism, prioritarianism's foundations, or non-health applications to maintain focus.
answer: |-
  The session hinges entirely on establishing that egalitarianism implies levelling down is *better in one respect* (by reducing inequality) even when it makes no one better off and some worse off—and that this is a problem for anyone justifying equity weights *solely* by the value of narrowing inequalities.

  ### Sequence & Rationale
  1.  **Clarify the distinction: Absolute vs. Relative Weighting (15 mins)**
      *   **What:** Contrast weighting a health gain because the beneficiary has low *absolute* health (e.g., severe disease) vs. weighting it because they have low health *relative to others* (e.g., worse off than the group average). Use simple, parallel examples:
          *   *Absolute:* Giving extra weight to a QALY gained by someone with 5 remaining QALYs vs. someone with 10.
          *   *Relative:* Giving extra weight to a QALY gained by someone in a disadvantaged group (avg. 5 QALYs) vs. someone in an advantaged group (avg. 10 QALYs), *even if the specific individuals have identical absolute health levels*.
      *   **Why first?** This distinction is non-negotiable bedrock. Without it, they'll conflate concerns for the badly off *absolutely* (prioritarianism) with concerns for *relational* inequality (egalitarianism). Their equity weights primarily use *absolute* baseline severity as input – we need isolation to show what pure *relational* concern adds.
      *   **Head off:** The misconception *"our weights use absolute baselines, so we're prioritarians"*. **Concede:** Their *models* are structurally prioritarian (weighting based on individual absolute level). **Cost of concession:** If they *justify* those weights *only* by saying "we should narrow health inequalities", they are appealing to an egalitarian *value* while using a prioritarian *tool*. The LDO challenges that *value* justification.

  2.  **Introduce Levelling Down via the Core Example (20 mins)**
      *   **The Example (Health QALYs):**
          *   Two fixed, identifiable groups (e.g., Region A & Region B). Non-agential change (e.g., disease outbreak, resource shift – not a policy *choice* to harm).
          *   **Baseline:** Group A: 10 QALYs each. Group B: 5 QALYs each. Inequality gap: 5 QALYs.
          *   **Option 1 (Help Worse-Off):** Give Group B an intervention. New: A=10, B=6. Gap=4. Sum=16. *Everyone better or same?* Group B better.
          *   **Option 2 (Help Better-Off):** Give Group A an intervention. New: A=11, B=5. Gap=6. Sum=16. *Everyone better or same?* Group A better.
          *   **Option 3 (Level Down):** A disease outbreak hits Group A only. New: A=8, B=5. Gap=3. Sum=13. *Everyone better or same?* Group A worse off, Group B unchanged.
      *   **Build the LDO Step-by-Step:**
          1.  Ask for intuitive ranking of options (1 > 2 > 3 is common).
          2.  State the *pure egalitarian claim:* "Reducing inequality is intrinsically valuable."
          3.  Apply this claim: Option 3 *reduces inequality* (gap from 5 to 3) compared to Baseline. Therefore, for a pure egalitarian, Option 3 is *better in one respect* (the egalitarian respect) than Baseline.
          4.  **The Objection:** But Option 3 makes no one better off and makes Group A worse off. How can it be "better" in *any* respect? This seems absurd.
      *   **Why this order?** The concrete example makes the abstract objection visceral. The non-agential, health-only, fixed-population setup prevents distraction.
      *   **Head off:**
          *   *"This recommends making A worse off!"* **Shut down immediately:** "No. The LDO is *not* saying we *should* level down. It's saying that *if* you think equality is intrinsically valuable, you *must* accept that levelling down is better *in one specific way*, even though it's worse overall. That implication is the problem *for that view*."
          *   *"Better in one respect is a fudge."* **Address here:** "It's a crucial philosophical distinction. Think 'fairer' but not 'better overall'. Like a football match being 'more exciting' but your team still lost – it's better *as a spectacle*, but worse *for you as a fan*. The LDO asks if we really want to say a distribution is 'fairer' when it harms someone and helps no one."

  3.  **Consequences for Justification & Equity Weights (15 mins)**
      *   **What:** Explicitly link back to their practice. If someone *only* justifies giving extra weight to gains for the worse-off *because* "it narrows inequalities", they are committed to the pure egalitarian view challenged by the LDO. They face a choice:
          1.  **Deny the LDO is problematic:** Stick to pure egalitarianism, accept that levelling down is better *in the fairness respect*, but argue other values dominate so we never *do* it. (Cost: Defends an initially counter-intuitive claim).
          2.  **Adopt a pluralist view:** Argue equity weights are justified by *multiple* values (e.g., priority to the worse-off absolutely *and* fairness, or sufficientarianism). (Cost: Must clarify the mix; pure inequality-narrowing isn't the sole justification).
          3.  **Shift to prioritarianism:** Justify weights *solely* by the absolute level of the worse-off (e.g., "because their suffering is greater", "because health gains matter more at low absolute levels"). (Cost: Abandons the claim that narrowing the *gap itself* is the core reason. This aligns with their model's structure).
      *   **Why here?** Now they grasp the LDO, we confront their stated justification head-on. Shows the objection *challenges a rationale*, not necessarily their *weights* or *model*.
      *   **Head off:** *"If equality isn't intrinsically valuable, our weights lose justification!"* **Address here:** "Not necessarily. It means the *specific justification* 'we should narrow inequalities' is undermined *if used alone*. But you can justify the *same weights* differently – by caring about the *absolute* plight of the severely ill (prioritarianism), or a mix of reasons. The LDO forces clarity on *why* you weight."

  4.  **The Check: Prioritarian vs. Egalitarian Verdicts (10 mins)**
      *   **Present a Fresh Pair:**
          *   **Baseline:** Group X: 4 QALYs, Group Y: 6 QALYs (Gap=2, Sum=10)
          *   **Intervention A (Prioritarian Favours):** Gives +3 QALYs specifically to Group X (the worst-off). New: X=7, Y=6. (Gap=1, Sum=13). *Narrows gap, helps worst-off.*
          *   **Intervention B (Egalitarian 'Respect'):** A non-agential event levels down Group Y. New: X=4, Y=4. (Gap=0, Sum=8). *Eliminates gap, makes Y worse off, X unchanged.*
      *   **Question:** "According to a *strict prioritarian* (who only values absolute levels), which change is better? [Answer: A is better, B is worse]. According to a *pure egalitarian*, in which specific *respect* is Intervention B better than Baseline? [Answer: In the respect of equality/fairness - it reduces the gap from 2 to 0]."
      *   **What shows they get it?** Correctly identifying that:
          *   Prioritarians see A as better than Baseline, B as worse.
          *   Pure egalitarians see B as *better than Baseline in the respect of equality* (while being worse overall).
      *   **What shows they don't?**
          *   Saying B is better overall for egalitarians.
          *   Conflating the verdicts (e.g., "Egalitarians prefer B" without the "in one respect" qualifier).
          *   Arguing that A also improves equality so it's irrelevant (misses the point that B *only* improves equality while worsening everything else).

  5.  **Explicit Omissions (State upfront & reiterate):**
      *   "We are *not* covering: How to practically build pluralist weights; The detailed differences between prioritarianism, sufficientarianism, and other views; Whether egalitarianism can be rescued from the LDO via complex pluralism; Applications to non-health domains like income; The ethics of *actively causing* harm vs. non-agential levelling down. This session is laser-focused on the core conceptual LDO and its challenge to *one specific justification* for your weights."

  **Why this plan works:** It isolates the absolute/relative distinction instantly, uses a constrained health example to make the LDO undeniable, directly ties the objection to their stated rationale, confronts key misconceptions at their natural point of arising, and provides an unambiguous check. The hinge – "better in one respect" – is relentlessly reinforced.
