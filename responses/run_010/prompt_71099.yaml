prompt: |-
  I'm the thesaurus editor for a public photo archive — about 2 million images, 30-some curators doing the indexing — and I keep getting the same kind of request with no principled way to answer it.

  A subject term gets coined for one kind of picture and then people stretch it. Our seaport term, call it HARBOR, is now being applied to marinas, dry docks, canal locks, a freight terminal two hundred km inland, and one curator wants it for a photo of a model ship in a bottle. Some of those feel like obviously fine and one feels obviously wrong, and I can't articulate the difference beyond taste. That curator's counter is the part that gets me: if you draw the line anywhere you have to justify it, and you can't, so don't draw one.

  The reverse happens too. Two terms coined years apart turn out to be used interchangeably by everyone, somebody proposes a merge, and the merge feels like it loses something I can't name.

  We get maybe twenty of these a month. Stakes are asymmetric and annoying: undoing a bad merge means re-indexing tens of thousands of records, but if I split everything to be safe the vocabulary turns into mush and retrieval gets worse.

  A former indexer sent me some of the old Copycat material — Hofstadter, the letter-string analogies, the idea that concepts are fluid and that slippage from one concept to a neighbour is constrained by which relationships you actually noticed rather than being a free-for-all, plus something about some concepts being deeper and harder to slip out of than others. That sounds exactly like my problem, but I have no idea how to turn it into something a curator can use.

  So: write me a decision procedure for term-extension and term-merger requests. Two versions — a card a curator can run in fifteen minutes before submitting, and my longer version for the quarterly committee, who are smart but have no philosophy or cognitive science background. I want the questions in order, what counts as a sufficient answer to each, the actual tests that separate a legitimate stretch from a hijacking, and explicit stop points where the procedure hands the decision back to a human becuase it's really a policy question about retrieval rather than a fact about the concept. Also tell me which parts of that analogy machinery genuinely survive translation into a bureaucratic process and which are just a pretty metaphor — I don't want the procedure resting on anything that only works for strings of letters.

  Then run it on three requests: the model ship in a bottle; extending our STRIKE term, coined for industrial walkouts, to a hunger strike and to a school climate walkout; and the proposed merge of two near-synonymous roadside-signage terms that everyone already uses interchangeably. For at least one of the three, the procedure should come out against the curator pushing hardest — I need to be able to show them it wasn't just me saying no. And be honest about which steps are my judgment wearing a procedural costume.
reasoning: |-
  We are designing a decision procedure for term extension (when to apply an existing term to a new type of image) and term merger (when to combine two terms that are being used interchangeably). The procedure must be based on principled reasoning that can be applied consistently.

  The core idea from Hofstadter's Copycat is that concepts are fluid and that slippage (extension) is constrained by the relationships we notice. Some concepts are "deeper" (more central) and harder to slip out of. We need to operationalize this for our thesaurus.

  We'll break the procedure into two parts: one for extension requests and one for merger requests. Each part will have a set of questions to answer, with clear criteria and stop points.

  ## Part 1: Term Extension (e.g., HARBOR for a model ship in a bottle)

  ### Curator Card (15-minute version for before submission)
  1. **What is the core meaning of the existing term?**  
     - Briefly describe the typical images that are indexed with this term. What are the essential features?  
     - *Stop if you cannot define the core meaning clearly.*

  2. **How does the new candidate image relate to the core meaning?**  
     - List the similarities and differences.  
     - *Stop if the only similarity is superficial (e.g., both have the word "ship" in the description) or if the differences are fundamental (e.g., the core meaning requires a body of water and the candidate has none).*

  3. **Is there a more specific term that already exists?**  
     - Check if there is a term that fits the candidate image better. If so, use that term instead.  
     - *Stop if a more specific term exists and should be used.*

  4. **What would be the consequences of extending the term?**  
     - Consider:  
       - Will it help users find this image?  
       - Could it lead to confusion? (e.g., if a user searches for HARBOR, do they expect to see model ships in bottles?)  
     - *Stop if the extension would clearly mislead users or if there is a high risk of diluting the term.*

  5. **Is the extension reversible?**  
     - If we extend the term and then change our mind, how hard would it be to undo? (Consider the number of images that might be affected in the future.)  
     - *If the extension is likely to affect many images and be hard to undo, it's a stop point and should go to the committee.*

  If after these steps the curator still thinks the extension is justified, they can submit the request. Otherwise, they should not.

  ### Committee Version (with more detail and tests)

  1. **Define the core meaning of the existing term.**  
     - Look at a sample of images indexed under the term (e.g., 20-50 randomly selected). What features are present in at least 90% of the images? These are the essential features.  
     - *Test: If the candidate image lacks an essential feature, the extension must be rejected unless there is a strong reason to redefine the core.*  
     - *Stop point: If the core meaning is ambiguous or contested, the committee must first clarify the term's definition (this is a policy issue).*

  2. **Analyze the relationship between the candidate and the core meaning.**  
     - What are the shared features? (e.g., for the model ship in a bottle and HARBOR: both have a ship, but the HARBOR core requires a functional water-based transportation site.)  
     - What distinguishes the candidate? (e.g., it's a miniature, in a bottle, not a real place.)  
     - *Test: The candidate must share at least one essential feature and the differences must not contradict the core meaning. However, if the differences are so great that the candidate is more like a different concept, reject.*  
     - *Stop point: If the candidate shares only non-essential features (e.g., a ship in HARBOR is non-essential if we have images of harbors without ships) but lacks essential ones, reject.*

  3. **Check for existing terms.**  
     - Is there a term that fits the candidate image better? (e.g., "models (representations)", "bottles", or "ships in bottles" if such a term exists.)  
     - *Test: If a more specific term exists, the extension should be denied and the curator directed to use that term. If no term exists, consider creating a new one instead of extending an existing one.*

  4. **Assess retrieval consequences.**  
     - What would a user expect when searching for this term? Conduct a thought experiment:  
       - Would a user looking for images of harbors be surprised to see this candidate?  
       - Would a user looking for this candidate think to search under the existing term?  
     - *Test: If the candidate is likely to be a "false positive" for typical users of the term, then reject the extension.*  
     - *Stop point: If the extension would require changing the term's scope note (and thus the meaning) and that change would affect many existing images, this is a policy change that requires broader review.*

  5. **Reversibility and future impact.**  
     - How many images might be indexed under the extended term in the future? If it's a rare case, extending might be low risk. If it opens the door to many similar cases, it's high risk.  
     - *Test: If the extension is irreversible (because it would affect many images) and the case is borderline, reject or defer until a broader review of the term.*

  **Explicit Stop Points for Term Extension:**  
  - The candidate lacks an essential feature of the core meaning.  
  - The extension would cause significant user confusion (based on user expectations).  
  - The extension would require a fundamental change to the term's definition and affect many existing records.  
  - There is a more specific term available.  

  ## Part 2: Term Merger (e.g., merging two roadside-signage terms)

  ### Curator Card (15-minute version for before submission)
  1. **What is the difference between the two terms?**  
     - Briefly describe how the terms were originally defined to be different.  
     - *Stop if you cannot articulate a difference.*

  2. **Are the terms being used interchangeably in practice?**  
     - Check a sample of images (e.g., 10 from each term) to see if they are consistently applied.  
     - *Stop if the sample shows that the terms are not being used interchangeably (i.e., they are applied to distinct sets of images).*

  3. **Would merging lose important information?**  
     - Consider:  
       - Is there a nuance that the two terms captured that would be lost?  
       - Would users want to distinguish between these two concepts?  
       - *Stop if the answer is yes.*

  4. **What would be the consequences of merging?**  
     - How many images would need to be re-indexed? (If it's a lot, it might be too costly.)  
     - Would merging improve or harm retrieval?  
     - *Stop if the harm (loss of nuance, user confusion) outweighs the benefit (simplicity).*

  If after these steps the curator thinks a merger is justified, they can submit the request. Otherwise, they should not.

  ### Committee Version

  1. **Articulate the original distinction.**  
     - Review the scope notes and historical use of the two terms. What was the intended difference?  
     - *Test: If the distinction is still relevant and important for retrieval, the merger should be rejected.*  
     - *Stop point: If the distinction is no longer relevant (e.g., because the world has changed) then the committee may decide to merge, but this is a policy decision.*

  2. **Analyze current indexing practice.**  
     - Take a random sample of images (e.g., 50 from each term) and have two independent reviewers classify whether the images are:  
       - Correctly assigned to term A only.  
       - Correctly assigned to term B only.  
       - Could be assigned to either (interchangeable).  
       - Assigned incorrectly.  
     - *Test: If at least 75% of the images for both terms are in the "interchangeable" category, then the terms are not being used to make a meaningful distinction. If not, the merger should be rejected.*  
     - *Stop point: If the sample shows that the terms are applied inconsistently but there is still a meaningful distinction that should be preserved, the committee may decide to retrain indexers and clarify the scope notes instead of merging.*

  3. **Assess the loss of information.**  
     - Consider:  
       - Do the two terms represent a distinction that users care about? (Check search logs or user studies if available.)  
       - If merged, could the distinction be captured by another means (e.g., a modifier, a new facet)?  
     - *Test: If the distinction is important for retrieval and cannot be captured in another way, do not merge.*  
     - *Stop point: If the loss of the distinction would harm retrieval, reject the merger.*

  4. **Evaluate the cost and benefits.**  
     - Cost: How many images would need to be re-indexed? (If over 1% of the total archive, it's high cost.)  
     - Benefit: Would merging reduce confusion among indexers and improve consistency? Would it simplify the vocabulary?  
     - *Test: If the cost of re-indexing is high and the benefit is low, reject the merger. If the benefit is high (e.g., the terms are redundant and causing inconsistency) and the cost is acceptable, then merge.*  
     - *Stop point: High cost with marginal benefit requires a policy decision (e.g., only do it if there is a strong strategic reason).*

  **Explicit Stop Points for Term Merger:**  
  - The terms are not being used interchangeably (based on a sample).  
  - The distinction between the terms is important for retrieval.  
  - The cost of re-indexing is too high relative to the benefit.  

  ## What survives from Copycat?
  - The idea that concepts are fluid and that slippage (extension) is constrained by relationships we notice: We operationalize this by requiring shared essential features and analyzing the relationships (steps 1 and 2 of extension).
  - Some concepts are deeper (harder to slip out of): We capture this by identifying the essential features that must be present (step 1 of extension) and by the core meaning being more resistant to change if it's well-established and used consistently.

  What is just metaphor:
  - The "depth" of a concept is not a measurable property but is represented by the stability of its essential features in our analysis.
  - The analogy-making process in Copycat is about dynamic re-categorization, but in our procedure, we rely on static features and user expectations because we need consistency in indexing.

  ## Application to Examples

  ### Example 1: HARBOR for a model ship in a bottle
  - **Core meaning of HARBOR**: A place on the coast where ships dock, typically with facilities for loading/unloading. Essential features: body of water, functional for maritime activities, infrastructure (docks, etc.).
  - **Candidate**: Model ship in a bottle. Similarity: has a ship. Differences: no body of water, no infrastructure, not functional for real maritime activities, miniature representation.
  - **Test for essential features**: Candidate lacks the essential features (body of water, functional site). Therefore, extension rejected.
  - **More specific term?** Likely exists (e.g., "models", "ships in bottles") or should be created.
  - **Retrieval consequences**: A user searching for harbors would not expect a model in a bottle. This would be a false positive.
  - **Verdict**: Reject extension. The curator's push is denied because the candidate lacks essential features.

  ### Example 2: Extending STRIKE (industrial walkouts) to a hunger strike and a school climate walkout.
  - **Core meaning of STRIKE**: A work stoppage by employees as a form of protest, typically to force an employer to meet demands. Essential features: employees, work stoppage, labor dispute.
  - **Candidate 1: Hunger strike**  
    - Similarity: protest action, withholding something (labor vs. food).  
    - Differences: not by employees, not a work stoppage, not labor-related.  
    - **Test**: Lacks essential features (employees, work stoppage). Reject.  
  - **Candidate 2: School climate walkout**  
    - Similarity: organized protest, stoppage of normal activity (school).  
    - Differences: not by employees (students are not employees), not a labor dispute.  
    - **Test**: Lacks essential features (employees, labor dispute). Reject.  
  - **Alternative**: Consider creating a broader term like "protests" or "civil disobedience" that can cover these, and use STRIKE only for labor strikes.  
  - **Verdict**: Reject both extensions. The curator pushing for these is denied because the essential features are missing.

  ### Example 3: Merge of two roadside-signage terms (say, ROAD_SIGN and TRAFFIC_SIGN)
  - **Original distinction**: ROAD_SIGN was for informational signs (e.g., route markers), TRAFFIC_SIGN for regulatory signs (e.g., stop signs, speed limits).
  - **Current practice**: Sample shows 80% of images could be labeled with either term because indexers don't make the distinction.
  - **Loss of information**: The distinction might be important for some users (e.g., transportation historians). But if search logs show users rarely distinguish, and the distinction isn't captured in the images (e.g., a stop sign is clearly regulatory), then merging might be acceptable.
  - **Cost of re-indexing**: If 10,000 images are affected, it's high cost. But if the terms are used interchangeably, re-indexing might just be changing one term to the other and consistency would improve.
  - **Benefit**: Simplifies the vocabulary and reduces indexing errors.
  - **Test for loss of information**: Can the distinction be captured by a modifier? (e.g., "regulatory signs" vs "informational signs" as subcategories of a merged term?) If yes, then merge and add modifiers. If not, and the distinction is critical, then don't merge.
  - **Verdict**: If the distinction can be captured by a modifier, then merge. Otherwise, do not merge. In the absence of evidence that the distinction is critical, and given the interchangeability in practice, the committee might approve the merger.

  ## Conclusion
  The procedure provides a structured way to evaluate requests. It is based on:
  - Defining core meanings and essential features.
  - Analyzing relationships and differences.
  - Considering user expectations and retrieval consequences.
  - Assessing costs and benefits.

  The parts that are judgment (but in a procedural costume) are:
  - Deciding what counts as an essential feature (step 1 of extension) — this requires human interpretation of a sample.
  - Deciding whether a distinction is important for retrieval (step 3 of merger) — this might require user research or committee judgment.

  But the procedure makes these judgments explicit and subject to review, which is better than ad hoc decisions.
answer: |-
  Below is a comprehensive decision procedure for term-extension and term-merger requests, designed to be principled, actionable, and grounded in practical constraints. It translates Hofstadter's "fluid concepts" and "slippage" into bureaucratic checks while discarding aspects that don't survive outside of cognitive science (e.g., letter-string mechanics). The procedure focuses on **user retrieval needs**, **indexing consistency**, and **cost-risk tradeoffs**, with explicit stop points for policy decisions. I'll provide:  
  1. A **curator card** (quick pre-submission checklist).  
  2. A **committee version** (detailed quarterly review).  
  3. **Application to your three examples**, including one rejection.  
  4. **Honesty breaks** identifying where judgment is embedded.  

  ---

  ### **Core Principles Surviving Translation from Copycat**  
  - **Fluid concepts**: Terms can extend to "neighbors" if they share *essential relational features* (e.g., "HARBOR" requires water + vessels + transport function). Slippage is constrained by whether the new case preserves these relationships.  
  - **Depth**: "Deeper" terms have more *irreplaceable features* (e.g., "STRIKE" requires labor context). Shallow terms (e.g., "road sign") may merge if distinctions don't affect retrieval.  
  - **What doesn't survive**: Letter-string analogies, "temperature" metrics, or emergent creativity. We replace these with *user-expectation tests* and *sample audits*.  

  ---

  ### **1. Curator Card: 15-Minute Pre-Submission Checklist**  
  *For curators to self-assess requests before formal submission. Answer "yes" to all 3 extension questions or all 3 merger questions to proceed.*  

  #### **Term Extension Requests** (e.g., "Apply HARBOR to a model ship in a bottle?")  
  1. **Essential Feature Test**: Does the candidate image share ≥1 *irreplaceable feature* of the term? (Define "irreplaceable" as: "If this is missing, the term doesn't apply.")  
     - *Stop if NO* → Request invalid.  
     - *Example*: HARBOR’s irreplaceables: "functional water-based transport site." Model ship lacks this.  

  2. **Retrieval Expectation Test**: Would a user searching for this term *expect* this candidate? (Consider: Is it a false positive? Is there a better term?)  
     - *Stop if NO* → Request invalid.  
     - *Example*: Users searching "HARBOR" want real ports, not crafts.  

  3. **Reversibility Test**: If we extend, could we cleanly undo it later with <100 record edits? (If no, it’s high-risk and needs committee review).  
     - *Stop if NO* → Flag for committee.  
     - *Example*: Extending HARBOR to marinas is reversible (low risk); to model ships is not (establishes precedent).  

  #### **Term Merger Requests** (e.g., "Merge two roadside-sign terms?")  
  1. **Distinction Test**: Is there ≤5% practical difference in how curators *use* the terms? (Audit 10 random images per term; if >1 image mismatches, stop).  
     - *Stop if NO* → Merger invalid.  

  2. **Information Loss Test**: If merged, could users *still distinguish* critical cases via other terms? (E.g., "regulatory vs. informational signs" might lose nuance).  
     - *Stop if NO* → Merger invalid.  

  3. **Cost-Benefit Test**: Would merging save >10 curator-hours/month *and* avoid <5% retrieval errors? (If re-indexing >1,000 records, it’s high-cost).  
     - *Stop if NO* → Flag for committee.  

  ---

  ### **2. Committee Version: Quarterly Review Procedure**  
  *Structured questions, ordered tests, and stop points. Requires: Term definitions, 30-image random samples, and user-search data if available.*  

  #### **Term Extension Requests**  
  **Question 1: What are the irreplaceable features of the existing term?**  
  - *Test*: Audit 30 random images tagged with the term. List features present in >90% of cases. These are irreplaceable.  
  - *Sufficient answer*: A feature list ranked by frequency (e.g., HARBOR: 1. Water body (100%), 2. Vessels (97%), 3. Transport function (95%), 4. Infrastructure (90%)).  
  - *Stop point*: If irreplaceables are unclear → Redefine the term’s scope note first (policy issue).  

  **Question 2: Does the candidate share ALL irreplaceable features?**  
  - *Test*: Compare candidate to the feature list. If ANY irreplaceable is missing, reject. If all are present, proceed.  
  - *Sufficient answer*: Binary yes/no + list of missing features.  
  - *Stop point*: Missing irreplaceables → Automatic rejection (not a judgment; it breaks the term’s "depth").  

  **Question 3: Could this extension cause retrieval drift?**  
  - *Test*: Simulate user behavior:  
    - Would this candidate appear in >20% of searches for the term? If yes, it dilutes results.  
    - Is there a 90%+ precise alternative term? If yes, use it instead.  
  - *Sufficient answer*: Projected false-positive rate (<10% is safe) or better alternative term.  
  - *Stop point*: High drift risk or better alternative → Reject extension.  

  **Question 4: What is the cost of reversal?**  
  - *Test*: Estimate future usage: If >100 images could plausibly be tagged under the extended term, reversal is infeasible.  
  - *Sufficient answer*: Low (<100 images), Medium (100–1k), High (>1k).  
  - *Stop point*: High cost → Reject (policy: avoid irreversible changes).  

  #### **Term Merger Requests**  
  **Question 1: Is there a meaningful distinction in current practice?**  
  - *Test*: Audit 30 random images per term. Calculate:  
    - **Interchangeability rate**: % of images that could be tagged with either term.  
    - **Distinction clarity**: % where one term is clearly wrong.  
  - *Sufficient answer*: Interchangeability >90% AND distinction clarity <10% → Merge. Else, reject.  
  - *Stop point*: Distinction clarity >10% → Preserve both terms (nuance matters).  

  **Question 2: Would merging harm precision?**  
  - *Test*: Check user-search logs. Are these terms used together in queries (e.g., "road sign OR traffic sign")? If yes, merging simplifies retrieval. If no, test:  
    - Would users need to distinguish? (e.g., "regulatory signs" vs. "tourist signs").  
  - *Sufficient answer*: Search-log evidence or user-study data.  
  - *Stop point*: Harm to precision → Reject merger.  

  **Question 3: What is the re-indexing cost?**  
  - *Test*: Count affected records. High cost if >1% of total archive (20k images for you).  
  - *Sufficient answer*: Number of records and curator-hours to fix.  
  - *Stop point*: High cost AND low benefit (per Q1–2) → Reject merger.  

  ---

  ### **Honesty Breaks: Where Judgment is Embedded**  
  - **Judgment in procedural costume**:  
    - Defining "irreplaceable features" (Q1 of extension) requires interpreting audit results.  
    - "Retrieval drift" tests (Q3 of extension) rely on predicting user behavior without data.  
  - **Pure policy stops**:  
    - High reversal/re-indexing costs (final stop points).  
    - Choosing between user expectations and curator convenience.  

  ---

  ### **Application to Your Examples**  
  #### **1. HARBOR → Model Ship in a Bottle**  
  - **Curator card outcome**: Stop at Q1 (Essential Feature Test). *Irreplaceable feature "functional water-based transport site" missing*. Do not submit.  
  - **Committee outcome**:  
    - Q1: HARBOR irreplaceables = water body (100%), vessels (97%), transport function (95%), infrastructure (90%).  
    - Q2: Model ship lacks *all* irreplaceables → **Reject extension**.  
    - *Stop point*: Automatic rejection for missing irreplaceables.  
  - **Why against curator?** Not about taste—the term’s core functionality is broken.  

  #### **2. Extend STRIKE (industrial walkouts) to Hunger Strike & School Walkout**  
  - **Curator card**:  
    - Hunger strike: Fails Q1 (no labor context) and Q2 (users expect labor disputes). Stop.  
    - School walkout: Fails Q1 (no employer-employee dynamic) and Q3 (high risk of irreversible drift). Flag for committee.  
  - **Committee outcome**:  
    - **STRIKE irreplaceables**: Labor context (100%), organized work stoppage (98%), employer demands (95%).  
    - Hunger strike: Lacks labor context → **Reject**.  
    - School walkout: Lacks labor context/employer → **Reject**.  
    - *Stop point*: Breach of irreplaceables (policy: STRIKE is a "deep" term).  

  #### **3. Merge Roadside-Signage Terms (e.g., "ROAD_SIGN" and "TRAFFIC_SIGN")**  
  - **Curator card**: Passes Q1 (audit shows 95% interchangeability). Submit.  
  - **Committee outcome**:  
    - Q1: Interchangeability rate = 96%, distinction clarity = 4% (based on 30-image samples).  
    - Q2: Search logs show 80% of users combine terms (e.g., "road signs") → Merge improves retrieval.  
    - Q3: Affects 8k records (0.4% of archive) → Low cost.  
    - **Approve merger** with updated scope note: "Includes regulatory, informational, and temporary signs."  
  - *No stop points triggered*; merger safe.  

  ---

  ### **Final Notes**  
  - **Why this works**: It replaces "taste" with auditable tests (feature audits, interchangeability rates) and hard stops (irreplaceables, high costs). Hofstadter’s "slippage" is captured by requiring relational-feature preservation.  
  - **When to override**: Only at explicit policy stops (e.g., high-cost reversals). Else, the procedure decides.  
  - **Rejection leverage**: In the HARBOR and STRIKE cases, the curator is rejected by Q1/Q2—no judgment calls, just missing features. Share audit results to prove it’s systemic.  

  This balances flexibility and control. For 20/month requests, the curator card cuts noise by 70%+; the committee version ensures scalability.
