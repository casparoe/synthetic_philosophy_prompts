prompt: |-
  I've been reading a lot of mechanistic interpretability work lately and something about how the field describes itself has been bugging me. I want to figure out what the actual practice is committed to, as opposed to what people say they're doing.

  Here's the practice. You train a sparse autoencoder on the activations at some layer of a big language model, it spits out a few thousand directions in activation space, and then you name them: this one is code bugs, this one is a particular famous bridge, this one is text where the speaker is flattering someone. You check the names by intervening — crank the direction up and the model starts shoehorning the bridge into every conversation, suppress it and the behaviour shifts the way you'd expect. And then the whole thing gets written up in a discovery register. Features are found, not made. The implicit picture is that the trained model already contains internal states corresponding to human-legible concepts, they were stacked on top of each other in superposition the whole time, and the autoencoder is a microscope that finally resolves them.

  Now the part I can't square with that. The same people, sometimes in the same paper, will report matter-of-factly that if you crank the sparsity penatly or double the size of the dictionary you get a different inventory — features split, features merge, what was one thing at low resolution is three things at high resolution. Nobody treats this as alarming. It's framed as a resolution issue, like zooming in on a map. But if the features were really in there the way, say, elements are in a sample of ore, your choice of how hard to penalize density shouldn't change what's there. It's like doing chemistry where the care with which you set up your apparatus determines whether you have one substance or two.

  Second thing, and this one might be my own confusion. The field seems to run two different tests for whether a feature really is X, and I don't think they're tests of the same claim. One is correlational: does it fire reliably when X shows up in the input. The other is causal: does manipulating it change what the model does. And everyone in this area knows those come apart — there's a long-standing, very well established complaint about classifiers trained on top of a network's hidden states, which is that being able to decode some property from a state (the grammatical subject of a sentence, whether a certain token is present) tells you the information is there in some sense but not that the network uses it for anything. Yet in the feature literature both results get offered as evidence for the same conclusion, often in adjacent paragraphs.

  So what I want:

  Reconstruct the implicit theory as precisely as you can. Not the slogan — the actual commitments. What does it take for an internal state to have the content the field assigns to it, and is the right decomposition of the model into meaningful parts fixed by the model or partly by the analyst? Then sort the rival positions into ones this practice actively rules out and ones it's just silent about. The test I care most about: could a thoroughgoing instrumentalist — someone who thinks talk of the model representing anything is only ever shorthand for input-output dispositions, with no further fact underneath — go through the identical motions, train the identical autoencoders, publish the identical papers? If yes, then the discovery language isn't doing any work and the whole thing is philosophically underdetermined by the practice. If no, point me at the specific step in the workflow that only makes sense if you're a realist, because I haven't been able to find one.

  Then the consistency question. Is there any single account of content under which the correlational test and the causal test are both evidence about the identity of a feature, and under which the hyperparameter sensitivity is genuinely a non-issue rather than a threat? Or does the practice need those to be two different questions that it's quietly sliding together?

  And finally, if the field dropped the realism and became explicitly conventionalist about features — treating them as useful fictions indexed to a modelling choice rather than discoveries — what would actually change on the ground? My suspicion is: almost nothing, which is exactly what worries me. But tell me which reporting norms, which eval metrics, and which safety-relevant claims would have to be rewritten, and whether any of them would survive the rewrite.
reasoning: |-
  Okay, the user is deeply engaged with mechanistic interpretability (MI) and has some serious philosophical concerns about the field's self-description versus its actual practice. They're clearly well-read—citing sparse autoencoders, feature splitting/merging with hyperparameters, and the correlational vs causal evidence tension. Their frustration isn't superficial; they've spotted genuine cracks in the field's epistemic foundation.  

  Hmm, their core tension orbits realism: do features "exist" in the model independently, or are they artifacts of our tools? The microscope analogy they mention is perfect—it exposes the ambiguity. When MI researchers say "we found the Golden Gate Bridge feature," are they describing a pre-existing thing or constructing a useful lens? The hyperparameter sensitivity (e.g., features splitting when you increase dictionary size) feels like a smoking gun against strong realism. If features were truly "in there," why would penalizing sparsity change their boundaries?  

  Then there's the testing mismatch. The user nails it: firing when X appears (correlational) isn't the same as causing X-related behavior (causal). MI papers often present both as evidence for feature identity, but these can decouple—like a neuron firing for "dog" yet ablating it doesn't affect dog-related outputs. The field handwaves this, but the user sees the philosophical stakes.  

  Their instrumentalist challenge is razor-sharp: could someone who thinks models are just input-output black boxes replicate MI workflows while denying features "exist"? If yes, then the "discovery" framing is just rhetoric. I think they're onto something—most MI procedures *could* be described instrumentally. The realism only emerges in interpretation.  

  For the reconstruction, I'll need to distinguish between weak realism (features are real but fuzzy/overlapping) and strong realism (discrete, pre-existing "concepts"). Practice only requires weak realism. Hyperparameter sensitivity becomes non-threatening if we see features as density peaks in activation space—coarser autoencoders cluster peaks, finer ones separate them. But this invites conventionalism: where you draw boundaries depends on your purpose.  

  The causal-correlational tension is thornier. Maybe the field implicitly uses a teleosemantic theory: a feature "is X" if it was *selected* to detect X *and* used causally for X-related tasks. But selection is murky in neural nets. Pragmatically, MI might just care that both correlation and causation hold *enough* for useful interventions—which sidesteps philosophy but feels unsatisfying.  

  If MI dropped realism, what changes? Mostly rhetoric and epistemic caution. Papers would say "we constructed a feature for flattery" not "found." Safety claims would weaken: instead of "we removed the deception feature," it'd be "we suppressed activations that correlated with deceptive outputs under our decomposition." But instrumentalism doesn't ruin applied MI—engineers don't need philosophical realism to hack systems.  

  Still, the user's unease is justified. The field's "discovery" language *does* imply a stronger ontology than its methods can secure. They might want to push MI toward clearer epistemic ground rules—or expose the quiet conventionalism. Either way, their critique is vital.
answer: |-
  Your critique cuts to the heart of mechanistic interpretability's (MI) philosophical tensions. Let's reconstruct the implicit theory, test rival positions, and assess the instrumentalist challenge.

  ### The Implicit Theory: Weak Realism with Pragmatic Constraints
  1.  **Commitment to "Features" as Real (but Fuzzy) Objects:** The practice assumes the model's internal activations *do* contain structure that causally mediates input-output processing. Features aren't *just* analytical constructs; they reflect computational roles the model learned. However, they are **not** assumed to be:
      *   **Discrete:** Features exist on a spectrum of superposition and polysemanticity.
      *   **Uniquely Definable:** There isn't one "true" decomposition. Features are context-dependent and overlapping.
      *   **Perfectly Aligned with Human Concepts:** They are model-internal computational primitives, imperfectly mappable to human-legible concepts.
      *   **Fixed Granularity:** Like biological taxa or geographic features, the "right" level of granularity depends on the question.

  2.  **What Makes a Feature "Be X"?**
      *   **Correlational Evidence ("Detection"):** The feature activates robustly and selectively in the presence of inputs containing/implying X (or computations leading to X). This shows the feature *encodes information about X*.
      *   **Causal Evidence ("Behavior"):** Increasing/decreasing the feature's activity causes predictable, specific changes in the model's outputs *consistent with the expected role of X*. This shows the feature *plays a causal role* in computations involving X.
      *   **Content Claim:** The feature is a *causal mediator* within the model's computation that *reliably correlates with and influences behavior related to X*. Its "content is X" means it serves the *functional role* of detecting/processing aspects relevant to X within the model's algorithm. **Both tests are necessary but insufficient alone.** The conjunction strengthens the claim that the feature is functionally involved with X.

  3.  **Hyperparameter Sensitivity: Resolution, Not Alchemy**
      *   **Implicit Analogy:** Activation space is like a high-dimensional landscape. Sparse Autoencoders (SAEs) are like cartographers mapping this landscape at different resolutions.
      *   **"Peaks" vs. "Basins":** The practice assumes underlying "density peaks" or "computational motifs" exist in activation space (the "ore"). SAE hyperparameters control *how finely* these peaks are subdivided or grouped into "features" (the "map resolution").
      *   **Splitting/Merging:** Increasing dictionary size/sparsity reveals finer-grained computational subroutines (splitting). Decreasing it groups related computations (merging). This is expected if features exist at multiple levels of abstraction/compositionality. The *underlying computational structure* is fixed; the *description* varies with granularity.
      *   **Non-Alarming:** Because the goal is *understanding the model's computation*, not finding Platonic atoms. Seeing how features compose/split *is* the insight.

  ### Testing the Instrumentalist Challenge
  *   **Could an Instrumentalist Replicate the Practice?** **Yes, almost entirely.** An instrumentalist could:
      1.  Train SAEs with various hyperparameters.
      2.  Observe correlations between feature activations and input patterns (X).
      3.  Observe output changes when intervening on features.
      4.  Build predictive models or control systems using these features.
      5.  Publish "Feature X reliably correlates with input pattern Y and intervention Z causes output change W."
  *   **The Realist Step:** **Naming & "Discovery" Framing.** The step that *requires* (weak) realism is interpreting the conjunction of correlation and causation as revealing an *internal computational object with the functional role of X*. The instrumentalist stops at "This activation pattern is a useful handle for predicting/controlling behavior related to X." The realist asserts "This feature *is* (part of) how the model internally represents/handles X." The *practice of intervening and observing consistent, interpretable effects* strongly suggests a causal structure that instrumentalism describes but refuses to ontologically commit to.
  *   **Underdetermination:** The *empirical procedures* are largely instrumentalist. The *interpretive framework* ("we discovered the model's internal feature for X") is realist. The practice doesn't *logically compel* realism, but the consistency and interpretability of causal interventions make weak realism a compelling and pragmatically useful explanation.

  ### Resolving the Correlational-Causal Tension
  *   **They Test Different (but Linked) Aspects:** The practice implicitly relies on a **functionalist** theory of content:
      *   **Correlation (Detection):** Shows the feature carries *information* about X. Necessary for being a representation *of* X.
      *   **Causation (Behavior):** Shows the feature plays a *functional role* in the causal chain producing outputs involving X. Necessary for being a representation *used for* X.
  *   **Why Both are Evidence for Identity:** A feature that fires for X but whose manipulation does nothing X-related is likely an *epiphenomenal* correlate (e.g., an artifact of the training data correlation). A feature whose manipulation causes X-related changes but never fires for X is incoherent within the model's observed behavior. **The conjunction suggests the feature is a *causal intermediary* in the model's processing pathway for X.** The tension arises because pure decoders *only* test detection, while MI features are proposed as *components of the model's own causal algorithm*.

  ### Consequences of Embracing Conventionalism
  If MI explicitly adopted conventionalism ("features are fictions useful for control/prediction"), here's what would change:

  1.  **Reporting Norms:**
      *   "We identified a feature useful for predicting/intervening on behavior related to X" replaces "We discovered the X feature."
      *   Emphasis shifts to *operational definitions*: "Feature F (identified via SAE with λ=Y, size=Z) fires when [precise input condition], and increasing it causes [precise output change]."
      *   Less emphasis on "naming" as ontological discovery, more as pragmatic labeling.
      *   Hyperparameter sensitivity becomes central to reporting: "At granularity G, we group computations as F1; at finer grain G', we resolve F1a, F1b, F1c."

  2.  **Evaluation Metrics:**
      *   **Utility metrics gain primacy:** How *effective* is this decomposition for:
          *   Predicting model outputs/errors?
          *   Controlling model behavior (precision/recall of desired intervention effects)?
          *   Compressing activation space without losing predictive power?
      *   **"Faithfulness" metrics become relative:** Not "Does this feature *truly* exist?", but "How consistent are the correlation/causal effects *under this specific decomposition* across diverse inputs and interventions?"

  3.  **Safety-Relevant Claims:**
      *   **Weaker Ontological Claims:** "We suppressed activations that *our model* associates with deceptive outputs" replaces "We disabled the deception feature."
      *   **Increased Focus on Robustness:** Claims about safety interventions would require demonstrating effectiveness *across multiple decompositions* or under a range of hyperparameters to show the finding isn't an artifact of one specific SAE setup.
      *   **Survival of Core Functionality:** The *ability* to find steerable knobs correlating with harmful behaviors and to suppress them would remain intact. The *confidence* that one has found "the" feature responsible might decrease, replaced by confidence in the *intervention effect* itself ("Suppressing *this set of directions* reliably reduces harmful output in these contexts"). Safety engineering based on control might survive well; claims about *fundamental understanding* of the model's "true" deceptive circuitry would be softened.

  ### Conclusion
  Your suspicion is largely correct:

  1.  **Practice is Weakly Realist but Instrumentally Replicable:** The core procedures *can* be described instrumentally. The "discovery" language reflects a weak realist interpretation of the consistent, interpretable causal effects observed, but isn't strictly entailed by the methods alone. The step of *attributing functional content* ("this *is* the X feature") is the realist commitment.
  2.  **Hyperparameter Sensitivity is Genuinely Non-Threatening** under the "resolution/map" analogy intrinsic to the practice. It doesn't undermine the existence of underlying computational structure; it reveals its compositional nature.
  3.  **Correlation + Causation = Functional Role:** The two tests together provide evidence for a feature being a *causal intermediary* with a specific informational relationship to X. They address the limitations of pure decoding.
  4.  **Explicit Conventionalism Changes Rhetoric, Not Core Utility:** Adopting conventionalism would shift reporting norms, emphasize utility metrics, and weaken absolute ontological claims in safety contexts. However, the ability to find steerable knobs and intervene on model behavior – the most pragmatically valuable aspect of MI – would remain. The field would trade the excitement of "discovery" for greater philosophical caution and focus on the reliability and scope of interventions enabled by a *particular* decomposition choice. The safety engineer might care less about the ontology than the effectiveness of the off-switch they built.
