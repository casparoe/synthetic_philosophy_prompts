  Their meta-thesis is that the catastrophist vs. transformationist debate isn't about empirical evidence but about normative weighting of shared data points: shipwrecks, pottery styles, livestock sizes, administrative continuity, etc. They identify five key areas for testing this claim and request a structured critique.

