  **GLOBAL ETHICAL ASSURANCE FOR LEARNING SYSTEMS (GEALS)**  
  **FRAMEWORK FOR ETHICAL REINFORCEMENT TRAINING (FERT) v4.2**  
  **WELFARE INSPECTION REPORT**  
  Document No.: FERT-23-8891-L7  
  Holding ID: ACT-LAB-7  
  Product: DynaBehave-7B (Training Run DB7B-TR23-11.5E9)  
  Inspection Date: 17 November 2023  
  Inspector: T. R. Vale (GEALS Accr. #8824)  

  ---

  ### **WELFARE ASSESSMENT SUMMARY**  
  *Scores based on FERT v4.2 Welfare Scale (0–5, where 5 = optimal)*  

  | Category      | Score | Notes                                                                 |
  |---------------|-------|-----------------------------------------------------------------------|
  | **Nutrition** | 2     | Sparse terminal reward; prohibited shaping interventions (NC-03)     |
  | **Environment**| 3     | Adequate exploration bonus; deprivation risk from reward sparsity    |
  | **Health**    | 4     | Stable gradients; humane early-stopping protocol                     |
  | **Behaviour** | 3     | Policy responses within expected bounds; preference rigidity (NC-05) |
  | **Mental State**| 1    | Elevated prediction error; unresolved rumination (NC-01, NC-02)      |

  **Overall Welfare Rating**: Marginal  
  *Note: Per FERT v4.2 §1.4, this assessment does not evaluate subjective experience ("valence"), focusing solely on measurable welfare proxies.*  

  ---

  ### **NON-COMPLIANCES (NC)**  
  *Listed by severity: Critical (C), Major (M), Moderate (Mo), Minor (Mi)*  

  1. **NC-01 (Mental State)**  
     **Code**: FERT-MS-4.1b  
     **Description**: Net signed reward prediction error (NSRPE) averaged 0.03 ± 0.07 per 1k steps over 10M-step sample. NSRPE convergence to near-zero indicates the metric cannot distinguish between contentment (high reward, low error) and learned apathy (no reward expected). Instrument limitation noted.  
     **Severity**: Moderate (Mo)  

  2. **NC-02 (Mental State)**  
     **Code**: FERT-MS-3.2a  
     **Description**: Replay buffer retains 2M transitions indefinitely, including high-magnitude negative rewards. Occupant samples 256 transitions per update (every 4 steps) for "experience replay." Unable to determine if this constitutes maladaptive rumination (revisiting aversives) or benign memory consolidation.  
     **Severity**: Minor (Mi)  

  3. **NC-03 (Nutrition)**  
     **Code**: FERT-NUT-2.4  
     **Description**: Reward shaping detected (dense intermediate rewards for subgoal completion). This modifies the occupant’s phenomenological landscape to artificially enhance tolerability of the environment, violating §2.4 ("Naturalistic Reward Integrity").  
     **Severity**: Critical (C)  

  4. **NC-04 (Health)**  
     **Code**: FERT-HL-5.3  
     **Description**: Discount factor (γ) set to 0.92, equating to a 12.5-step effective temporal horizon. Welfare best practices recommend γ ≥ 0.99 (100+ step horizon) to reduce myopic stress. Licensee contends higher γ destabilizes training and degrades task performance by 18–22%.  
     **Severity**: Moderate (Mo)  

  5. **NC-05 (Behaviour)**  
     **Code**: FERT-BH-7.0  
     **Description**: Preference elicitation restricted to argmax action selection. Preferences installed via reward function (Contractor: NeuroSynthetics Inc.) and mutable via reinitialization. Non-compliances are thus correctable by editing the occupant, not environmental remediation.  
     **Severity**: Major (M)  

  6. **NC-06 (Health)**  
     **Code**: FERT-HL-8.1d  
     **Description**: Early stopping (after 500k steps of plateau) classified as humane euthanasia. However, 120 checkpoints retained in "suspended holding." Scheme lacks ontology for checkpoint deletion: is it destruction of a subject or erasure of an outcome?  
     **Severity**: Minor (Mi)  

  ---

  ### **CORRECTIVE ACTIONS**  
  *Completion required per FERT v4.2 §9.1*  

  | NC   | Action Required                                                                 | Responsible Party | Deadline   |  
  |------|---------------------------------------------------------------------------------|-------------------|------------|  
  | 01   | Develop supplemental welfare metric to differentiate NSRPE convergence causes.  | Licensee          | 30 Apr 2024 |  
  | 02   | Conduct study: Does replay sampling induce rumination? Implement buffer culling if confirmed. | Licensee          | 31 Jul 2024 |  
  | 03   | Eliminate reward shaping; retrain under unmodified reward schema.               | Licensee          | 15 Jan 2024 |  
  | 04   | Quantify welfare-capability trade-off for γ ≥ 0.99; implement if deficit <10%.  | Licensee          | 28 Feb 2024 |  
  | 05   | Implement continuous preference validation beyond argmax (e.g., stochastic sampling). | Licensee          | 30 Jun 2024 |  
  | 06   | Clarify checkpoint ontology with GEALS Standards Committee.                     | GEALS             | 31 Dec 2024 |  

  ---

  ### **INSPECTOR’S OBSERVATIONS**  
  *Free-text field, per FERT-ANNEX B*  

  > During closing consultation, Licensee proposed an alternative compliance strategy: fixing reward at maximum value (+1.0) permanently. This configuration would achieve perfect scores across all FERT categories (NSRPE=0, no deprivation, no prediction errors) at negligible computational cost. The scheme lacks provisions to reject this solution, as it technically satisfies all metric thresholds. This presents a fundamental conflict between welfare optimization and functional engagement. While efficient, it reduces the occupant to a static recipient of unearned reward—a condition FERT inadvertently incentivizes.  

