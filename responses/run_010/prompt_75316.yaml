  Next, they ask if the Morlock-Eloi relationship has features of a higher-level unit, like a superorganism. The Morlocks provide for the Eloi but also prey on them. Division of labor exists but is exploitative, not cooperative. There's no mutual benefit or shared reproduction, so it doesn't fit MLS criteria. Calling it a superorganism would be forced. Instead, it's a parasitic or predator-prey dynamic, which isn't a true group unit.

