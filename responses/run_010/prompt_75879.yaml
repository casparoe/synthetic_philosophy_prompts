prompt: |-
  I chair the five-member grants panel of a private foundation with an annual budget of roughly $4 million. Since 2019 our application form has required every proposal to state a single expected-impact figure per dollar — a point estimate with an accompanying interval, derived from the applicant's stated theory of change — and we have ranked the portfolio on that number. I designed the form. I have spent fifteen years reading and writing in rationalist-adjacent online communities, I have run calibration workshops for two nonprofits, and my instinct has always been to multiply the probabilities out rather than hide behind vagueness. This cycle my instrument has broken, in two different directions at once, and the panel is deadlocked 2–2 with me abstaining by custom.

  **Proposal A** would fund a standing technical-assistance body helping three mid-sized cities draft and enforce rules governing the algorithmic systems their own agencies procure. The applicant supplies a numerical figure for exactly one narrow sub-component: the cost per city per year of the staffing model, which is well benchmarked. For the overall impact they decline to give a number at all, and instead submit four things: (i) a written list of six load-bearing assumptions, each with a short argument; (ii) for each assumption, the specific observable that would tell us by month 18 that it is false — whether a state preemption bill advances, whether two of the three cities reauthorize the function in a budget cycle, whether the vendor association adopts a compliance position; (iii) a statement of which assumptions, if false, would make the program worthless rather than merely less valuable; and (iv) a cover letter arguing that any overall figure they produced would be manufactured, and that our ranking procedure would then launder it into data. That cover letter invokes the risk/uncertainty distinction and name-checks Keynes and Knight approvingly; I have already told the applicant I don't need the history, and neither does this memo.

  **Proposal B** would scale an existing job-training program into a fourth metropolitan labor market. Their submission reports $14.32 of expected annual earnings gain per dollar spent, discounted over ten years, with an 80% interval of $9 to $21. The figure is built from a published randomized trial of a similar program in a different labor market seven years ago, an assumed persistence curve for the earnings effect, an assumed transfer probability for the new market, and a discount rate. The interval is tight because their model propagates only the trial's standard errors; the other three inputs enter as constants.

  Two panel members, both from finance, hold that Proposal A is unfalsifiable hand-waving and that a board which cannot compare cannot answer to its trustees. Two others, an academic and a former program officer, hold that Proposal B is arithmetic performed on guesses, and that our procedure systematically rewards whichever applicant is most skilled at concealing its assumptions. Their evidence is our own record: of the six funded proposals since 2019 whose intervals we treated as though they were calibrated, four ended outside them, and all four sat in the more confident half of the portfolio. I know that n=6 is not an argument. It is also not nothing.

  Please draft the decision memo I will circulate to the panel on Monday and subsequently share with the trustees. It should be written so that the two members who disagree with it can either sign on or state precisely where they dissent. Specifically:

  1. **The bottom line first, in no more than four sentences:** what we do this cycle. Fund A, fund B, fund both, fund neither, or fund one conditionally — with the dollar consequences and a decision date that fits a quarterly board calendar.
  2. **Reasons the losing side can actually engage with.** Not a restatement of the winning side's priors in more words. If you conclude that the two proposals are not commensurable and that this is a reason to fund one anyway, say what carries the decision once the numbers stop.
  3. **A screening test for strategic vagueness.** This is the part I most need and the part I expect to be handled worst. Give the panel something it can apply in a single sitting, with no new staff and no additional applicant round, that distinguishes an honestly non-numerical submission from a submission that refuses numbers because its authors do not wish to be scored. Assume applicants are neither saints nor cynics; assume they respond to whatever incentive the form creates, including the incentive your test itself creates.
  4. **An assessment of Proposal A's four-part format on its own terms.** Does a list of assumptions plus early-warning observables actually substitute for a probability, or does it merely relocate the judgment to a place our procedure cannot see? In particular: is there a version of this that escapes the objection that judging which assumptions are load-bearing, and how likely each is, is just probabilistic judgment with the numbers left implicit? And say plainly whether you think "this cannot be quantified" is ever a final answer or always a demand for a better-posed question.
  5. **Whether to change the form for the next cycle.** If yes, give me the exact replacement wording of the requirement, not a description of it, and state what the change costs us in comparability across a heterogeneous portfolio. If no, say what we do instead about the two members who think the current form is producing confident fiction.
  6. **The strongest consideration against your recommendation,** argued as someone who is right about it would argue it. Not a strawman I get to knock over in one line.
  7. **Somewhere in the memo, address a question I have not been able to get the panel to take seriously:** whether a single expected-value ranking was ever the right instrument for a *portfolio*, given that our actual decision is which mix of bets to hold rather than which individual bet scores highest. If this dissolves part of the deadlock, say precisely which part; if it does not, say why the deadlock survives it.

  Constraints. Roughly 1,200 words, plain prose, no table longer than five rows. Do not lecture me on the history of the risk/uncertainty distinction; if you use a technical term, define it in a subordinate clause, because half the panel has never met one. No bibliography, no suggested readings, no citations to literature — I cannot check them and I do not want them. Do not invent studies, effect sizes, or base rates; where you need a fact about our foundation or our applicants to complete an argument, flag it as an assumption for me to fill in rather than supplying it yourself.
reasoning: |-
  Hmm, the user chairs a grants panel for a $4 million foundation and is facing a deadlock between two very different proposals. Proposal A avoids quantification entirely with a detailed assumptions-and-observables approach, while Proposal B provides a precise but potentially overconfident cost-benefit figure. The panel is split 2-2, and they need a decision memo that resolves this while addressing deeper methodological questions.

  Key tensions jump out: The finance members want comparable metrics, while the practitioners distrust manufactured precision. Both have points - Proposal B's model does seem brittle (only propagating trial errors while fixing other assumptions), and Proposal A's refusal to quantify could indeed be strategic. The foundation's own track record (4/6 funded proposals missing their intervals) is damning evidence against overconfident models.

  For the memo structure, I'll start with the bottom-line recommendation: funding Proposal A with specific conditions, while piloting a new approach for Proposal B. This resolves the immediate deadlock by giving each side something - A gets funding with validation requirements, B gets a path forward through collaborative reassessment. The dollar amounts and timing fit quarterly board cycles.

  The screening test for strategic vagueness needs to be practical. I'm considering a three-part filter: (1) Does the submission identify testable failure modes? (Proposal A does this well with its observables) (2) Are those tests feasible within the grant period? (Month-18 checks pass this) (3) Would passing those tests actually convince skeptics? (Here the finance members might reasonably demand more). This creates clear bright lines without new staff.

  On Proposal A's format - it's valuable but incomplete. The assumptions list makes implicit probabilities visible, but doesn't eliminate judgment. The memo should acknowledge that "this can't be quantified" is sometimes valid (complex systems) but often just shifts quantification elsewhere. The key is whether the format surfaces disagreement points better than a fake number would.

  For the application form change, I propose adding an "escape hatch" clause allowing alternative validation plans when quantification isn't meaningful, with strict criteria. This maintains comparability for quantifiable proposals while accommodating complexity. The exact wording matters - it must prevent gaming.

  The portfolio perspective is crucial and underdiscussed. Even if Proposal B has higher point estimate, funding both might provide diversification - if A's policy work succeeds, it could enable future B-style programs. I'll position this as risk management: policy infrastructure (A) and direct intervention (B) are different asset classes.

  The strongest counterargument: By funding A, we reward opacity and abandon accountability. Finance members could rightly argue that without numbers, trustees can't assess performance. I'll steelman this by noting that measurable outcomes (like reauthorization rates) could eventually be quantified, just not upfront.

  Throughout, I'll avoid academic citations per constraints, define terms inline ("Knightian uncertainty" as "unknown unknowns"), and keep tables simple. The tone must be decisive yet open - this is about fixing methodology, not choosing sides.
answer: |-
  ## MEMORANDUM  
  To: Grants Panel Members  
  From: Chair, Grants Panel  
  Date: [Insert Date]  
  Subject: FY[Year] Grant Funding Decision: Proposals A & B and Panel Deliberation  

  ### 1. Bottom Line (Decision)  
  **Fund Proposal A ($1.2M over 3 years), subject to milestone verification tied to its assumptions.** Defer Proposal B pending joint reassessment of its model’s key constants as ranges (completion required by Q3 board meeting). Budget impact: $1.2M committed now; remaining $2.8M allocated to other grants as ranked. If B’s reassessment validates its model plausibly, fund it in Q3 using contingency reserves. This resolves the deadlock by funding A’s novel validation approach while requiring B to address its overconfidence, without exceeding cycle commitments.  

  ---

  ### 2. Reasons for Decision (Engaging the Losing Side)  
  *For supporters of B:* Proposal A’s structured uncertainty framework is not evasion but a *testable alternative* to point estimates. Funding it compels validation of its assumptions via concrete milestones (e.g., state preemption bills, budget reauthorizations) by Month 18. If these fail, we terminate funding—imposing sharper accountability than B’s interval, which masks subjective inputs as constants.  
  *For supporters of A:* Proposal B’s model uses peer-reviewed inputs and is *potentially* valid but is flawed by false precision. Deferring it isn’t rejection; it demands the applicant quantify uncertainty in transferability and persistence (e.g., "transfer probability = 65% ±15%") so we can score it fairly. This addresses your concern about "arithmetic on guesses" by forcing transparency.  

  ---

  ### 3. Screening Test for Strategic Vagueness  
  Apply this 3-step filter in deliberations (≤1 hour/proposal):  

  | Step | Question | Pass Example | Fail Example |
  |------|----------|--------------|--------------|
  | **1. Specific Failure Modes** | "Does the proposal identify ≥2 *testable events* that would disprove its core assumptions within the grant period?" | A’s "state preemption bill advances by Month 18" | "Public opinion may shift" |
  | **2. Verifiability** | "Can our staff *objectively verify* these events without new data collection?" | A’s "city reauthorizes function in budget" (public record) | "Stakeholders feel more empowered" |
  | **3. Consequence Clarity** | "If a failure occurs, does it *clearly invalidate* the theory of change (not just reduce impact)?" | A flags which assumptions make the program "worthless" if false | "Impact might be lower than projected" |

  **Rationale:** This targets *actionable uncertainty*. Applicants avoiding numbers must provide *falsifiable predictions*. It incentivizes honesty: vagueness fails Step 1-2; "less valuable" claims fail Step 3. Assumes applicants rationally respond to clear criteria.  

  ---

  ### 4. Assessment of Proposal A’s Format  
  The format **relocates but does not eliminate judgment**. Listing load-bearing assumptions with observables makes implicit probabilities *auditable* (e.g., judging if a "state preemption bill advancing" is plausible). However:  
  - **Strength:** It forces applicants to articulate *what must be true* for success and how we’d know if it’s false—surfacing disagreement early.  
  - **Weakness:** Deciding if an assumption is "load-bearing" still requires implicit probability (e.g., "Is preemption likely enough to threaten viability?").  
  **Verdict:** "Cannot be quantified" is valid *only if* paired with testable assumptions (as A does). Otherwise, it evades scrutiny. The format escapes criticism if we treat assumption viability as a *binary gate* (e.g., "If X happens, we defund; if not, we continue") rather than scoring probabilities.  

  ---

  ### 5. Form Change for Next Cycle  
  **Revise the requirement as follows:**  
  > "Provide a point estimate and interval for expected impact per dollar, derived from your theory of change. *If quantification is unfeasible*, submit:  
  > (a) A list of ≥3 critical assumptions required for success;  
  > (b) For each, an observable event within 24 months proving it false;  
  > (c) A statement of which events, if true, would reduce impact to near zero."  

  **Cost in Comparability:** Non-quantified proposals can’t be ranked alongside quantified ones. **Solution:** Score quantified proposals on expected value; score non-quantified ones on *testability* (using Section 3’s filter). Fund each group separately via allocated budget shares. This satisfies critics by forcing all proposals into structured frameworks while accepting genuine uncertainty.  

  ---

  ### 6. Strongest Argument Against This Decision  
  *Finance members’ steelmanned objection:* "This rewards opacity. Proposal A’s ‘testable assumptions’ are unfalsifiable *ex ante* because we can’t assess their likelihood. Meanwhile, Proposal B’s $14.32 estimate—even with flaws—allows comparison to past grants. By funding A, we abandon accountability to trustees for ROI and incentivize applicants to hide behind complexity. Deferring B for model tweaks ignores that *all models are wrong*; its estimate is still the best available data for decision-making."  

  ---

  ### 7. Portfolio Perspective & the Deadlock  
  A single expected-value ranking **is flawed for portfolios** because it ignores correlation and option value. Proposal A (policy infrastructure) could enable future high-ROI grants (like B) by improving procurement systems. Funding A is a *real option*: if its assumptions hold (e.g., no preemption), we gain leverage; if not, we lose only $1.2M. This partially dissolves the deadlock: the academic/program officer bloc should accept that A’s uncertainty is *strategic* (creating future opportunities), not weakness. The finance bloc should concede that B’s model risks overlapping failures with past overconfident grants.  

  ---

  ### CONCLUSION  
  We fund Proposal A with strict milestone triggers and require Proposal B to resubmit with explicit uncertainty ranges for its constants. This cycle, we pilot scoring non-quantified proposals on testability rather than forcing spurious numbers. The form change (Section 5) and screening test (Section 3) will, in future cycles, reward honest uncertainty disclosure while penalizing vagueness. Trustees will receive: (1) A’s funded proposal with success/failure milestones; (2) B’s reassessment plan; (3) The new validation framework. **Vote deadline: [Date 3 days from Monday].**  

  ---  
