prompt: |-
  I commission the alternate-history strand for a monthly history magazine — four-ish companion essays online a month, tied to whatever the print issue is doing — and our advisory board of academic historians has started pushing back hard. Their complaint is basically the old Carr charge that counterfactual history is a pastime for people who'd rather not do the work of explaining what actually happened. Fair enough, but I'm not shutting the strand down, and "it's unfalsifiable" isn't a usable rejection to me, because a huge amount of good economic history is counterfactual reasoning with the label scraped off — Fogel's railroads work is a giant what-if and it's about as rigorous as the field gets. So what I need is something my two fact-checkers can run on a pitch in twenty minutes flat. Both are bright, neither has any training in historiography, and their output either gets acted on by me or escalated to one of the board members.

  Write me the procedure. Questions in order, what counts as a passing answer to each, where it dead-ends in a reject, and where it hands the decision to a person because the sticking point is contested scholarship or taste rather than method. A few distinctions I already suspect belong in there, though tell me if I've got them wrong: whether the pitch contains a real fork at all (could the people at the time plausibly have chosen otherwise, or did the structural situation make the outcome near-inevitable no matter what anyone decided); how much of the actual past is allowed to travel along with the changed thing — the minimal-rewrite discipline the military historians use, and the Lewis-style question of which nearby world you're even describing once you start letting facts come along for the ride; and the difference between a one-shot counterfactual (one decision, one day) and a structural one (a rate, an institution, an absence), since the second kind seems to have no divergence point and I can't work out whether that makes it harder to do or just a different genre that needs its own rules. Also cover what the procedure does when two equally plausible rewrites point in opposite directions, and whether it's defensible for us to publish the range rather than picking a side. A friend of mine who teaches early modern history swears the dominant failure mode isn't a bogus antecedent at all — you can almost always find *some* nearby world — it's an untraceable consequent, where nobody can say anything beyond about two years out. Build that in if you think she's right, and say so if you don't.

  Then run it on three live pitches. (1) The Archduke's driver doesn't take the wrong turn in Sarajevo in 1914, so no July crisis and no world war. (2) The Black Death never reaches Europe, and the fourteenth century plays out on pre-plague population and labour relations. (3) The one I've already half-commissioned and would like to save: the Armada gets Parma's troops across in 1588 and England goes back to Rome. For each, give me the verdict your procedure produces, the single sentence in the pitch that would have to be rewritten if it's a conditional pass, and which step did the killing. Be explicit about where the procedure is smuggling in an answer on determinism — my suspicion is that at least one of these rejections evaporates if I refuse to assume history is settled in advance, and I'd rather know that now than get caught out at the quarterly review. Finally, flag which of your steps are judgment calls in a checklist costume, because if my fact-checkers can't tell those apart from the mechanical ones they'll start killing pitches I like for reasons they can't articulate. No reading list, please — I've got a pile of books already and its the procedure I'm short of.
reasoning: |-
  Okay, the user is commissioning alternate-history essays for a history magazine and facing pushback from academic historians. They need a practical, efficient procedure for fact-checkers to evaluate pitches. The key issues are distinguishing viable counterfactuals from weak ones, addressing Carr's criticism, and handling structural vs. event-based what-ifs.

  First, I need to unpack the user's explicit requirements. They want a step-by-step procedure that fact-checkers can apply in 20 minutes. The fact-checkers are smart but lack historiography training. The procedure must identify clear rejection points and flag judgment calls. They also want distinctions between event-based forks (like Archduke's driver) and structural ones (like no Black Death), plus handling multiple plausible outcomes.

  The user mentioned three test pitches: Archduke's driver avoiding wrong turn, Black Death not reaching Europe, and Spanish Armada succeeding. Each will test different aspects of the procedure. The user is particularly concerned about determinism assumptions sneaking into the evaluation - they want to avoid rejecting pitches just because the outcome seems inevitable.

  I recall the user's observation that much economic history uses counterfactuals without labeling them as such (Fogel's railroad study). This suggests the procedure should reward similarly rigorous approaches. The early modern historian friend's point about "untraceable consequents" is crucial - many counterfactuals fail because we can't plausibly project long-term effects.

  The procedure needs clear gates: 
  - Does the pitch identify a plausible divergence point? 
  - Does it respect minimal rewrite? 
  - Can we trace consequences beyond 2-3 years? 
  - Does it avoid "just-so" storytelling?

  For the Archduke pitch, the key failure is likely the "untraceable consequent" - even if WW1 didn't start in 1914, tensions might have sparked it later. For the Black Death, the problem is structural - removing it isn't a single decision point. The Armada pitch might pass if it focuses on short-term Catholic restoration rather than long-term impacts.

  I'll design the steps to first weed out pitches with no real fork or impossible rewrites, then assess traceability. Steps requiring scholarly judgment will be explicitly flagged. For pitches with multiple outcomes, the procedure should allow presenting the range if both are equally plausible.

  The user's anxiety about determinism is valid. The procedure mustn't assume historical inevitability - it should reject only when structural constraints make alternatives genuinely implausible, not merely because something happened. The "minimal rewrite" principle helps here by forcing examination of contemporary constraints.

  Finally, the fact-checkers need to recognize which steps are mechanical (checking for an actual decision point) versus judgment calls (assessing traceability). Clear rubrics for "passing" each step will help them avoid arbitrary rejections.
answer: |-
  Here's a procedure designed for speed and clarity, focusing on methodological red flags rather than determinism debates. It prioritizes identifying *unworkable* pitches, not perfect ones. Judgment-call steps are explicitly flagged.

  **Alternate-History Pitch Evaluation Procedure (20-Minute Fact-Check)**

  **Objective:** Flag pitches where the counterfactual method is fundamentally unsound or untestable within historical scholarship. Pass pitches where the "what-if" is plausible, contained, and traceable enough for rigorous exploration.

  **Instructions:** Run each question in sequence. Stop at any "REJECT" or "ESCALATE" outcome. "PASS" means the pitch clears this specific hurdle.

  ---

  1.  **Is there a defined, plausible divergence point?**
      *   **Check:** Does the pitch clearly identify *one specific event, decision, or small cluster of closely linked events/decisions* that could realistically have been different? Does it provide evidence that alternatives *were considered or feasible at the time* (e.g., documents showing debate, known alternatives, genuine uncertainty)?
      *   **PASS:** Yes. A specific moment/choice is identified with contextual evidence suggesting it wasn't a foregone conclusion *for the actors involved*. (e.g., "Charles I accepts the Newcastle Proposals," "Hitler halts at the Dnieper in 1941," "Specific votes swing in the Electoral College of 1876").
      *   **REJECT:** No defined point, or the point is:
          *   An inevitable structural outcome (e.g., "The Roman Empire doesn't fall," "Industrialization never happens").
          *   Something actors demonstrably couldn't change (e.g., "No Little Ice Age," "Asteroid misses Earth 65mya").
          *   A vague "what if X was different" without specifying *how* or *when* that difference arose from a contemporary choice/contingency.
      *   **ESCALATE:** The plausibility of the divergence point itself is a major *scholarly debate*. (e.g., "What if the South won Gettysburg?" - feasibility of Lee's plan is contested).

  2.  **Does the pitch respect "minimal rewrite"?** *(Judgment Call - Focus on glaring violations)*
      *   **Check:** Does the changed antecedent require altering *only* the specific point identified in Step 1 and its *immediate, direct consequences*? Or does it implicitly or explicitly require altering numerous *unrelated, antecedent* facts to make the divergence possible or the scenario work?
      *   **PASS:** The change flows plausibly from the divergence point without requiring significant alterations to established facts *before* that point or *unrelated* to the causal chain stemming directly from it. (e.g., Changing a battle outcome doesn't require changing the weapons tech available *unless* the pitch argues the outcome *caused* faster/slower development).
      *   **REJECT:** Requires significant, unexplained changes to pre-existing conditions, technologies, ideologies, or institutions *unrelated* to the divergence point to make the scenario viable. (e.g., "No WWI" requires fundamentally altering pre-1914 alliance systems *before* Sarajevo to be plausible).
      *   **ESCALATE:** The degree of necessary "rewrite" is debatable or depends on contested interpretations of how tightly linked factors were. (e.g., How much pre-existing anti-Semitism was *necessary* for the Holocaust vs. how much was amplified by Nazi policy?).

  3.  **Is the consequent traceable for the proposed scope?** *(Major Judgment Call)*
      *   **Check:** Does the pitch make specific, grounded claims about outcomes beyond the *very* short term (1-3 years)? If so, does it rely on established historical dynamics, continuities, or models (economic, social, political) *from the actual past* to trace these consequences? Or does it resort to pure speculation, chain reactions of unlikely events, or "just-so" storytelling?
      *   **PASS:**
          *   Scope is very short-term (immediate aftermath, <5 years), *or*
          *   Longer-term claims are explicitly framed as *possible pathways* based on identifiable historical forces/analogues, *or*
          *   The pitch focuses on the *immediate divergence and its near-term uncertainty* without projecting far.
      *   **REJECT:** Makes confident, specific predictions about complex long-term outcomes (e.g., geopolitics, culture, technology >10-20 years out) without a clear, grounded methodology for tracing them from the divergence, relying instead on chains of contingency or assuming radical, unmotivated breaks from historical patterns. ("Untraceable consequent" failure).
      *   **ESCALATE:** The traceability of consequences relies heavily on a specific (and potentially contested) historical model or theory (e.g., Marxist determinism vs. Great Man theory, specific economic models).

  4.  **Does it avoid "opposite directions" without justification?**
      *   **Check:** If the pitch presents only *one* specific outcome pathway from the divergence, is it presented as the *most likely* or *one plausible* path? If it presents *multiple* plausible outcomes pointing in different directions, does it explicitly argue why *both* are viable and grounded?
      *   **PASS:**
          *   Presents one path as *a* plausible outcome (not *the* inevitable one), acknowledging uncertainty, *or*
          *   Explicitly compares/contrasts 2-3 distinct, plausible pathways grounded in Step 3 reasoning, arguing for their relative likelihoods or exploring their implications.
      *   **REJECT:** Presents a single, highly specific long-term outcome as the *only* or *inevitable* result of the divergence without strong justification. *Or*, presents multiple contradictory outcomes *without* grounding each in plausible historical dynamics or arguing why the divergence genuinely opened multiple viable paths.
      *   **ESCALATE:** The assessment of "most likely" or "plausible" pathways relies on deeply contested historical interpretations or methodologies.

  **Procedure Output:**
  *   **CLEAR PASS:** Pitch passes Steps 1, 2, 3, and 4 without REJECT or ESCALATE.
  *   **CONDITIONAL PASS:** Pitch triggers ESCALATE in one step but passes others. Requires board review on the escalated point. *Specify which step & issue.*
  *   **REJECT:** Pitch triggers REJECT in any step. *Specify which step & reason.*
  *   **ESCALATE FOR SCHOLARLY REVIEW:** Pitch triggers ESCALATE in multiple steps, or REJECT in one step combined with ESCALATE in another. Requires board review.

  ---

  **Judgment Call Identification (Critical for Fact-Checkers):**
  *   **Step 1:** *Mostly Mechanical.* Focuses on identifying a *specific point* and *evidence of contemporary possibility*. Rejects only obvious impossibilities/inevitabilities or vagueness.
  *   **Step 2: (JUDGMENT CALL).** Assessing "minimal rewrite" requires judging what's "directly related" vs. "unrelated/unnecessary antecedent change". Fact-checkers should flag *obvious* violations (e.g., changing medieval economics to prevent the Black Death) but escalate subtler cases.
  *   **Step 3: (MAJOR JUDGMENT CALL).** "Traceability" is the core challenge. Fact-checkers look for *any* grounding in historical dynamics/models vs. pure speculation. They reject only blatantly untraceable long-term claims. Assessing the *strength* of the grounding is a board task.
  *   **Step 4:** *Mostly Mechanical/Judgment Mix.* Checking if multiple paths are *presented* and *claimed* as plausible is mechanical. Assessing if they *are actually plausible* overlaps heavily with Step 3 (traceability) and is a judgment call/board task.

  **Determinism Smuggling Warning:** The procedure rejects pitches based on **implausibility of the *antecedent change* (Step 1)** or **implausibility/untraceability of the *claimed consequences* (Step 3)**, **NOT** based on a philosophical belief that the actual outcome *was* inevitable. It demands evidence that alternatives *were* live options *at the time* (Step 1) and that claimed consequences *can be argued* from evidence (Step 3). Rejecting "No WWI" because pre-war tensions made *some* major war likely soon is about **traceable consequence plausibility (Step 3)**, not determinism. Rejecting "No Roman Empire Fall" is about the **lack of a defined divergence point (Step 1)**.

  ---

  **Evaluation of Pitches:**

  1.  **Pitch: Archduke's driver doesn't take the wrong turn, no July Crisis, no WWI.**
      *   **Step 1:** PASS. Clear divergence point (wrong turn), evidence it was a contingency (driver error, Princip being there was chance).
      *   **Step 2:** REJECT. Preventing WWI requires not just avoiding Sarajevo, but fundamentally altering the pre-existing web of alliances, militarism, imperialism, and crisis management norms that made a major war highly probable. This violates minimal rewrite. **Killing Step: Step 2.**
      *   **Verdict:** REJECT (Step 2 - Minimal Rewrite Violation).
      *   **Sentence to Rewrite (if Conditional):** N/A (Rejected). Hypothetically: "Thus, the avoidance of Franz Ferdinand's assassination meant the intricate alliance system and decades of rising tensions simply dissolved, guaranteeing European peace." -> This *claims* the rewrite is minimal, but it's not.

  2.  **Pitch: Black Death never reaches Europe, 14th century plays out on pre-plague population/labour relations.**
      *   **Step 1:** REJECT. There is no identifiable *decision point* or *contingent event* where actors could have realistically prevented the plague's arrival in Europe. It was a pandemic spread by complex environmental and trade factors beyond contemporary control or foresight. **Killing Step: Step 1.**
      *   **Verdict:** REJECT (Step 1 - No Plausible Divergence Point / Structural Inevitability).
      *   **Sentence to Rewrite (if Conditional):** N/A (Rejected). Hypothetically: "Had Mediterranean merchants implemented effective quarantine measures in 1347..." -> Unrealistic for the period/knowledge; no evidence it was a feasible choice.

  3.  **Pitch: Armada gets Parma's troops across in 1588, England goes back to Rome.**
      *   **Step 1:** PASS. Clear divergence point (successful troop landing). Evidence of feasibility (it was the plan; weather/English action prevented it; Parma's army was ready).
      *   **Step 2:** PASS (Conditional). Landing the troops minimally rewrites the naval battle/weather of that specific campaign. *However*, the *success* of the invasion and subsequent Catholic restoration are less certain and depend on many factors (English resistance, Spanish logistics, French/Dutch reactions). The pitch *assumes* landing = success = restoration. This needs scrutiny.
      *   **Step 3:** REJECT. "England goes back to Rome" is a complex, long-term outcome (religious, political, social). While the *initial invasion* and potential overthrow of Elizabeth are traceable short-term possibilities (1-3 years), confidently predicting the *enduring* Catholic restoration of the *entire country* within the pitch's likely scope requires tracing highly uncertain military, political, and religious dynamics over potentially years/decades against fierce resistance. This is likely untraceable. **Killing Step: Step 3 (Untraceable Consequent).**
      *   **Verdict:** REJECT (Step 3 - Untraceable Consequent).
      *   **Sentence to Rewrite (if Conditional):** "With Elizabeth captured or killed and London under Spanish control, England swiftly returned to the Catholic fold under Philip II's governance." -> Overconfident, untraceable long-term claim. Rewrite to focus on the *immediate crisis and possibilities*: "...opening the possibility of a Catholic claimant seizing the throne and initiating a contested process of re-Catholicization, facing significant Protestant resistance."

  **Key Insight:** All three pitches fail, but for different reasons related to the *method*, not determinism. Pitch 1 fails on minimal rewrite (changing Sarajevo doesn't *minimally* prevent WWI). Pitch 2 fails on having no actionable divergence point. Pitch 3 fails on overreaching, untraceable long-term claims despite a good divergence point. The procedure flags these methodological weaknesses without needing to assert that the actual outcomes *were* predetermined. Saving Pitch 3 requires drastically narrowing its scope and ambition regarding the "England goes back to Rome" claim.
