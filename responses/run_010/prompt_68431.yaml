prompt: |-
  I'm doing a semester abroad in Leiden taking an EU law and politics course, and there's one thing about accession I can't stop chewing on. When a country joins, it has to take over the entire existing body of EU law — decades of treaties, regulations, decisions of the Court, the whole accumulated thing — chapter by chapter, and what's actually up for negotiation is basically the pace and some technical transitional arrangements. A candidate state cannot say "we'll take the single market and the competition rules but not the justice and home affairs stuff." It's presented, and I think genuinely understood by the people doing it, as non-negotiable: you accept the order as it stands or you don't come in. Meanwhile the countries already inside have picked up all sorts of carved-out exceptions over the years — Denmark kept an opt-out from the euro and a pretty rigid one from justice and home affairs (it voted in 2015 to keep that one rather than switch to a case-by-case opt-in, and only dropped its defence opt-out recently), Ireland stays outside Schengen, and Sweden has simply never entered the exchange rate mechanism, which means it can postpone euro adoption indefinitely even though the treaties treat adoption as an obligation for every member except Denmark. And there's an exit clause for leaving the whole thing, but no mechanism anywhere for a member to withdraw from one policy area. So the shape of the practice is: total acceptance on the way in, piecemeal exceptions once you're in, and all-or-nothing on the way out.

  My flatmate says this is just bargaining leverage, the incumbents are protecting themselves, but that seems like an answer about why it happened rather than about what the practice assumes. I want the second kind of answer. What view of sovereignty does a rule like this presuppose — specifically, what does it assume about whether being sovereign means being the author of the rules you're subject to, or whether it might mean something more like the capacity to bind yourself to rules someone else wrote? Is the implicit picture that the EU is a treaty among states who consent, or a standing normative order that admits new participants on its own terms, closer to a club with existing bylaws or to a contract you can only sign as drafted? And what does the fact that exceptions exist for old members but not for new ones presuppose about legitimacy over time — is consent treated as a one-off act that keeps working forever afterwards, or as something that has to be renewed? I keep having the sense that the practice is quietly committed to some answer to the democratic deficit complaint, one that nobody ever states out loud.

  So: reconstruct the implicit theory as carefully as you can, and separate what the practice strictly needs from what merely fits it comfortably — I suspect there's more than one account of sovereignty that would license the accession rule, and I want to know which ones are actually ruled out rather than just unfashionable. Then tell me whether the three pieces are consistent with each other: does the no-exceptions-on-entry rule sit comfortably with the accumulated opt-outs for insiders and the all-or-nothing exit clause, or do those three presuppose rival theories of membership that the Union is living with rather than resolving? It would help if you said where the practice is philosophically underdetermined, i.e. where the same institutional facts would look identical under two very different theories and we'd need extra evidence to tell them apart. And finally, suppose we replaced the implicit view with the one critics of the democratic deficit usually gesture at — that being subject to rules you had no ongoing hand in making is the actual problem, so legitimacy requires continued authorship and not just an initial yes. What would have to change institutionally for that to be real rather than decorative? Dont give me a list of treaty articles to read, I want the reasoning about what the practice commits us to.
reasoning: |-
  Hmm, this is a sophisticated question about EU accession and sovereignty from a student in Leiden. They're clearly grappling with deep theoretical tensions in EU law and politics. 

  First, let's unpack their core observations: the asymmetry between accession conditions (total acceptance of acquis) vs. insider privileges (opt-outs) vs. exit mechanics (all-or-nothing). Their flatmate's bargaining power explanation feels insufficient - they want the philosophical underpinnings. 

  The key questions they're really asking are:
  - What theory of sovereignty makes "take it or leave it" accession logically coherent?
  - Can the same theory explain opt-outs for existing members?
  - And does this reveal anything about the democratic deficit debate?

  I notice they're particularly sharp on timing aspects - how initial consent seems to have perpetual effect while exceptions accumulate. That's crucial. They also want me to distinguish between what the practice necessarily implies versus what's merely compatible with it.

  The sovereignty question seems to pivot on two models: 
  1) The classical treaty view (sovereigns as authors)
  2) The constitutional order view (sovereigns as subscribers)

  The accession rule clearly favors the latter. But then how do we square that with opt-outs? Those look suspiciously like treaty-style renegotiations. 

  For legitimacy over time, I'm struck by how their question exposes a gap: if consent was a one-time event for founding members (who negotiated the rules), what makes it binding on new members who merely inherit them? The practice seems to treat the EU as having independent normative authority now.

  On the three-part consistency check: the pieces don't fit neatly. Accession assumes a constitutional order, opt-outs use treaty logic, and exit straddles both. The Union lives with this tension by pragmatically privileging stability - hence "living with rather than resolving."

  Finally, for the democratic deficit alternative: if we demanded ongoing authorship, we'd need radical changes - like member-initiated policy withdrawals or veto rights that could paralyze the system. The current practice implicitly rejects that model, preferring stability even at theoretical cost.

  This student has nailed the central paradox of EU integration: it constitutionalized itself midway through. My response should honor that insight while clarifying where philosophy meets institutional reality.
answer: |-
  Your dissection captures the core tension in EU constitutional practice perfectly. Let's reconstruct the implicit theory step by step, distinguishing necessary commitments from merely compatible ones, then test consistency.

  ### I. The Implicit Theory of Sovereignty and Legitimacy
  **Core Sovereignty Concept:**  
  The accession rule presupposes that sovereignty includes the *capacity to surrender specific competences irreversibly to a higher legal order*. Crucially, it assumes sovereignty is **divisible and transferable**, not an indivisible state attribute. This view aligns with the ECJ's *Costa v ENEL* doctrine of autonomous EU legal order.

  **Legitimacy Foundation:**  
  - **Accession:** Legitimacy derives from *unconditional prior consent* to an existing *acquis*. The EU presents itself not as a treaty network but as an **autonomous constitutional order**—new members *adhere* to a pre-constituted system.  
  - **Opt-Outs for Incumbents:** These rely on **asymmetrical historical consent**. Founders negotiated the initial framework; subsequent opt-outs (Maastricht onwards) are treated as *amendments* requiring unanimous consent. This privileges original authors.  
  - **Perpetuity:** Consent is treated as **enduring unless explicitly revoked** via Article 50 (exit). Ongoing legitimacy flows from the *initial act of accession*, not continuous democratic authorship.  

  **What This Rules Out:**  
  - **Classical Contractualism:** The EU cannot be a mere treaty if new entrants cannot renegotiate terms.  
  - **Indivisible Sovereignty:** If sovereignty were unitary and unpoolable (à la Bodin), accession under these terms would be conceptually impossible.  
  - **Lockean Revolt Principle:** No right to withdraw from specific "oppressive" policies—only total exit.  

  ### II. Consistency Check: The Three Pillars  
  Your triad reveals **institutional schizophrenia**:  
  1. **Accession (Constitutional Order Logic)**  
     - *Assumes:* EU as *Rechtsstaat* with fixed *acquis*. New states are "constitutional joiners," not negotiating peers.  
  2. **Opt-Outs (Treaty Logic)**  
     - *Assumes:* EU as club of sovereigns where incumbents retain *right to renegotiate* via unanimity rules.  
  3. **Exit (Hybrid Logic)**  
     - Article 50 treats withdrawal as **state sovereignty reassertion**, yet exit dissolves *all* ties—implying the *acquis* is an inseparable package.  

  **The Inconsistency:** Accession demands constitutional fidelity, but opt-outs permit treaty-style fragmentation. This isn’t resolvable under one theory. The EU:  
  - **Needs** the constitutional view to enforce *acquis* supremacy.  
  - **Relies** on the treaty view to accommodate political realities (e.g., Danish opt-outs).  

  **Underdetermined Areas:**  
  - Is the *acquis* a "one-time-consent" package or perpetually renegotiable? Practice uses **both** models situationally.  
  - Does sovereignty reside with states or the EU? *Van Gend en Loos* ("new legal order") vs. *Maastricht* ("union of states") judgments coexist uneasily.  

  ### III. Addressing the Democratic Deficit  
  **The Implicit EU Answer:**  
  Legitimacy derives from:  
  1. **Original Member-State Consent** (foundational treaties)  
  2. **Accession Referendums/Ratifications** (one-time popular mandate)  
  3. **Ongoing Indirect Legitimacy** via Council (governments) and EP (elections)  

  **Critics’ Alternative (Ongoing Authorship):**  
  To realize this, the EU would need:  
  - **Unilateral Member-State Withdrawal Rights from Specific Policies**  
    - e.g., A mechanism for states to exit Eurozone/Schengen *without* leaving EU.  
  - **Veto Powers Over Future *Acquis* Development**  
    - Replacing QMV with unanimity for new policy areas, risking paralysis.  
  - **Constitutional Conventions for Major Reforms**  
    - Requiring double referendums (EU-wide + per state) for treaty changes.  
  - **Rebalanced Subsidiarity**  
    - National parliaments gaining *binding* veto (not just "yellow card" opinions).  

  **Consequence:** This would transform the EU into a **loose confederation**, undermining supranational integration. The current system prioritizes *effectiveness* and *legal uniformity* over continuous consent.

  ### IV. Conclusion: The EU’s Pragmatic Contradiction  
  The practice is **not philosophically coherent** but **institutionally functional**. It rests on three irreconcilable premises:  
  | Pillar               | Implicit Sovereignty Theory     | Legitimacy Source          |  
  |----------------------|---------------------------------|----------------------------|  
  | Accession            | Constitutional order            | Adherence to pre-existing *acquis* |  
  | Opt-Outs             | Treaty-based sovereignty        | Unanimous consent of peers |  
  | Exit                 | Westphalian sovereignty         | State autotomy             |  

  **Why It Persists:**  
  - **Path Dependence:** Founders designed a community; enlargement came later.  
  - **Power Asymmetry:** Incumbents leverage accession to lock in gains.  
  - **Functional Necessity:** Uniform *acquis* enables single market.  

  The democratic deficit critique exposes this but offers no stable alternative within an integrating union. The EU’s "implicit theory" is ultimately **Hobbesian**: once consent is given, the sovereign order demands obedience—until you choose the nuclear exit option. What feels like inconsistency is the price of pooling sovereignty without becoming a state.
