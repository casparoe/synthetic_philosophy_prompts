  For replies, I'll keep them tight—two-minute podium responses. Soft spots will be honest: e.g., conceding that the modal error theory needs more work or that ʿāda's "bruteness" might feel explanatory. The user can't defend everything mid-Q&A, so I'll note where to park issues for later.

