     We can leave fraud income in the net income, and then in the verification, if caught, they have to repay.

     To keep it simple, we can have fraud as an undeclared income that they get, and then if caught, they lose it and pay a penalty? But then we have to track.

     Given time, we might simplify: fraud is not included in the net income until the verification phase? Or we can include it and then adjust if caught.

     This might be messy.

     Alternative: We don't include fraud in the net income during the rounds. We only include it at the end if not caught. But that's not realistic.

     Given the time, we might skip the fraud income in the monthly net income and focus on the detection in the debrief. The user's key point is the base-rate trap, not the financial gain from fraud.

     So for the simulation, we focus on the benefits trap and sanctions. Fraud is only for the verification part in the debrief.

     So in phase 2, claimants do not include fraud in their income. We only record whether they committed fraud, for the debrief.

     Then in the debrief, we calculate the total fraud amount and the cost of verification.

     This simplifies phase 2.

  Revised phase 2:

  Each month, claimant records:
  - Missed appointment? (Y/N)
  - Hours worked (0, 10, 20, ...)
  - If Type 4 and offered cash work, did they take it? (Y/N) [but this doesn't affect their monthly income in the simulation]

  Then they calculate net income without fraud.

  In the debrief, we then add the fraud component.

  Now, the benefits trap: if they have high taper and worked, they have the fixed cost, so they might have lower net income.

  Example: taper=100%, worked 20 hours (earnings=£200), then benefit=£600, cost=£50, net=£600+200-50=£750. If they didn't work, net=£800. So worse off.

  For the sanction: if they missed an appointment and sanction=50%, then benefit reduced by 50%. So if they didn't work and missed, net=£400.

  Now, the dossier events:

  Type 1:
  - Month 1: No event. Work available: 0, 20, or 40 hours.
  - Month 2: No event. Work available: 0, 20, or 40 hours.
  - Month 3: No event. Work available: 0, 20, or 40 hours.

  Type 2 (unreliable transport):
  - Month 1: Car breaks down. Miss appointment? Yes. Work available: 0, 20, 40 hours.
  - Month 2: Car fixed. No event. Work available: 0,20,40.
  - Month 3: Car breaks down again. Miss appointment. Work available.

  Type 3 (child with asthma):
  - Month 1: Child is well. No event. Work available: 0,10,20,30 hours.
  - Month 2: Child has asthma attack. Must stay home -> miss appointment. Work available, but if they choose to work, they can only work up to 10 hours (because they must care for child).
  - Month 3: Child well. No event. Work available: 0,10,20,30.

  Type 4 (cash work opportunity):
  - Month 1: Offered cash work: £100 for 5 hours. They can choose to take it or not. Also, regular work: 0,20,40 hours.
  - Month 2: Offered cash work again. Regular work.
  - Month 3: No cash work offered. Regular work.

  Type 5 (unreliable transport and child):
  - Month 1: Car breaks down -> miss appointment. Work available: 0,10,20,30 (but they might also have child issue? Let's say no child issue this month).
  - Month 2: Child has asthma attack -> miss appointment. Work available, but limited to 10 hours.
  - Month 3: Car breaks down and child is sick -> miss appointment. Work limited to 10 hours.

  In phase 2, the facilitator can read out the event prompts by type, or provide the dossiers in advance.

  Finally, the debrief questions:

  1. How did you fare? Any surprises? (5 min)
  2. Benefits trap: Who experienced that working more led to less money? Why? (5 min)
  3. Sanctions: Who was sanctioned? Why did you miss the appointment? (5 min)
  4. Verification and fraud: Present the base-rate trap with numbers (as above) for the two scenarios. (7 min)
  5. Read the justification cards from phase 1 and reflect: Did the outcomes match your expectations? (3 min)

  Now, what this activity cannot reproduce:
  - The psychological impact of living with uncertainty and stigma.
  - The long-term effects (e.g., debt accumulation, health impacts).
  - The dynamic effects on the labor market.
  - The role of taxes and the broader economy.

  We have to supply that these are simplifications.

  Where I am least sure:

  1. The benefits trap: If the committee sets a low taper rate (e.g., 40%), then the trap might not appear. So only if they set a high taper rate will some participants experience it. But the user wants them to experience it. So we need to ensure that the fixed cost is high enough and the taper rate is set high by the committee. But they might set it low. Solution: In the debrief, we can also show what would happen if they had set a high taper rate, even if they didn't. Or we can hope that they set it high. Given that the local paper influences them, they might set a high taper rate to encourage work.

  2. The sanction effect: It should be clear from the dossiers that those with compliance issues (transport, childcare) are the ones sanctioned.

  3. The base-rate trap: This will be clear in the debrief with the numbers.

  What would change my mind on the substance? If the fraud rate is high and the cost of fraud is very high, then heavy verification is justified. Also, if the verification system is very cheap and very accurate (near zero false positives), then it might be justified even at low fraud rates. But in reality, verification is expensive and imperfect.

  Finally, the materials:

  - Prepare:
     - For phase 1: A board to record the three dials and their options.
     - Cards for justifications (one per participant).
     - For phase 2: Dossiers for each claimant type (enough for the group). Each dossier should have the events for each month and instructions.
     - Worksheet for each participant to calculate monthly net income.
     - A calculator might be helpful.

  We'll invent all numbers, so the pot is £10,000 per month, benefit £800/month, wage £10/hour, fixed cost £50, etc.

  This design is complex, but I believe it can be run in 90 minutes if facilitated tightly.
answer: |-
  Below is a complete, runnable 90-minute activity designed to meet your goals. It focuses on experiential learning through a simulated benefits system, with mechanics ensuring participants encounter the three key insights (benefits trap, sanction inequity, base-rate trap) through gameplay, not lecture. The numbers are invented, self-contained, and calibrated to make the arithmetic drive the revelations.

  ---

  ### **Activity Title: The Fairness Committee**
  **Objective:** Participants experience trade-offs in a benefits system by first setting policy as a committee, then living under it as claimants.  
  **Group Size:** 18–25 people.  
  **Time:** 90 minutes total.  
  **Materials:** 
  - 1 whiteboard/flipchart for recording policy votes. 
  - 25 role cards (laminated or printed on sturdy paper). 
  - 25 budget tokens (e.g., poker chips or cardboard coins), 3 per participant. 
  - 25 pens, blank paper for calculations. 
  - 1 deck of "event cards" (10 cards, see Phase 2).  
  - Calculator (for facilitator).  
  **Prep Work (1 hour):**  
  - Create role cards (see templates below).  
  - Print event cards and budget tokens.  
  - Set up room in a circle for discussion, with space for individual work during Phase 2.  

  ---

  ### **Phase 1: Policy Setting (25 min)**  
  *Participants act as a committee designing a benefits scheme with a fixed monthly pot of £10,000. They set three policy dials.*  

  1. **Introduction (5 min):**  
     - *Facilitator script:* "You're the committee for our town's new benefit scheme, 'SupportPlus.' There's a fixed pot of £10,000/month to support 20 claimants. Your job: set three policy dials to be 'fair to people who play by the rules.' You’ll be scored on two metrics: (1) **Need Relief** (% of the pot that reaches claimants after costs), and (2) **Fraud Caught** (% of actual fraud detected)."  
     - Clarify: "This is a closed system—no new money comes in. We’re simplifying real-world complexity to focus on trade-offs."  

  2. **Policy Dials (15 min):**  
     - Present three dials with options. Participants discuss and vote by show of hands:  
       - **Taper Rate:** How much benefits decrease per £1 earned.  
         *Options:* 0% (no clawback), 40% (£0.40 lost/£1 earned), 70%, 100% (full clawback).  
       - **Sanction Harshness:** Benefit reduction for missing a mandatory appointment.  
         *Options:* 0% (no sanction), 25%, 50%, 100% (full benefit loss for the month).  
       - **Verification Budget:** % of pot spent checking for fraud.  
         *Options:* 0%, 10%, 20%, 30%.  
     - **Critical step:** Before voting, each participant writes one sentence on a card: *"My settings are fair because..."* (e.g., "High sanctions ensure only the deserving get help"). Collect cards for the debrief.  
     - Record votes on the whiteboard.  

  3. **Transition (5 min):**  
     - Announce: "Policy is set! Now, you’ll live under these rules as claimants for 3 months."  
     - Distribute role cards randomly.  

  ---

  ### **Phase 2: Claimant Simulation (45 min)**  
  *Participants become claimants for 3 months (3 rounds). Each has a hidden attribute affecting compliance. The policy they set in Phase 1 is binding.*  

  1. **Role Cards (5 min to distribute and explain):**  
     - Each card includes:  
       - **Visible:** Monthly benefit if compliant (£500), hourly wage (£10), fixed work costs (£50/month if working).  
       - **Hidden attribute:** Determines events (e.g., "Unreliable transport," "Child’s chronic illness").  
       - **Fraud flag (if applicable):** Only 1 in 5 roles can commit fraud (undeclared cash job).  
     - **Role distribution (for 20 people):**  
       - 4x **Stable Transport** (no compliance issues).  
       - 4x **Unreliable Transport** (high chance of missing appointments).  
       - 4x **Childcare Dependent** (unpredictable schedule).  
       - 4x **Elderly Carer** (rigid schedule, low flexibility).  
       - 4x **Cash Job Access** (can choose fraud; 2 have a "crisis" forcing temptation).  
     - *Fraud note:* Only "Cash Job Access" roles can commit fraud. In low-fraud runs, 2/4 face a crisis (e.g., "Boiler breaks, need £150 fast"); in high-fraud runs, all 4 do.  

  2. **Monthly Rounds (10 min per round × 3 rounds):**  
     - **Step 1 (Event Draw):** Facilitator draws an event card (e.g., "Transport strike" or "Child sick"). Participants check if their hidden attribute applies:  
       - If yes, they *must* miss an appointment (triggering sanctions).  
       - If no, they attend.  
     - **Step 2 (Work Decision):** All choose work hours: 0h, 10h (£100), or 20h (£200).  
       - *Fixed work cost:* £50 deducted if working >0h.  
     - **Step 3 (Income Calculation):** Participants compute monthly net income:  
       ```  
       Benefit = £500 × (1 - Sanction%)  
       Taper Reduction = Earnings × Taper Rate  
       Net Benefit = max(0, Benefit - Taper Reduction)  
       Total Income = Net Benefit + Earnings - £50 (if working)  
       ```  
     - **Step 4 (Fraud Decision):** "Cash Job Access" roles may take undeclared work (+£150) if in crisis.  

  3. **Verification (After Round 3, 10 min):**  
     - **Audits:** Verification budget determines audits:  
       - Number of audits = (Verification% × £10,000) / £50 per audit.  
       - Facilitator randomly selects claimants to audit (use budget tokens for randomness).  
     - **Detection Rules:**  
       - True fraudsters caught: 80% of audited fraudsters.  
       - False accusations: 10% of audited non-fraudsters.  
     - **Outcomes:**  
       - Caught fraudsters repay £150 + £50 penalty.  
       - Falsely accused lose next month’s benefit (simulating hardship).  

  ---

  ### **Debrief (20 min)**  
  *Questions guide participants to self-identify the three insights. Use whiteboard for calculations.*  

  1. **Experience Share (5 min):**  
     - "Show of hands: Who was sanctioned? Why?" (Link to hidden attributes: e.g., transport issues).  
     - "Who earned more but ended with less net income? Why?" (Highlight benefit traps).  

  2. **Arithmetic Revelations (10 min):**  
     - **Benefit Trap:** Draw a simple graph showing net income vs. earnings (use participant data):  
       - Example (100% taper, £50 work cost):  
         - 0h: £500  
         - 10h: £100 (earnings) + £0 (benefit after taper) - £50 = £50 (worse off).  
       - *Ask:* "When does work pay? Is 'laziness' rational here?"  
     - **Sanction Inequity:** List reasons for missed appointments. *Ask:* "Did sanctions target unwillingness or inability? Who was hit hardest?"  
     - **Base-Rate Trap (run twice!):**  
       - **First run (low fraud):** 2/20 can commit fraud (10% rate).  
         - *Example:* 20% verification = £2,000 → 40 audits.  
         - Fraud caught: 2 fraudsters × 80% × (40/20 audits) = ~1.6 cases (£240 recovered).  
         - False accusations: 18 non-fraudsters × 10% × (40/20) = ~3.6 cases.  
         - *Cost:* £2,000 spent to recover £240 + harm to 3.6 innocent claimants.  
         - *Ask:* "Did verification help or hurt need relief?"  
       - **Second run (high fraud):** 8/20 can commit fraud (40% rate). Same policy:  
         - Fraud caught: 8 × 80% × (40/20) = ~12.8 cases (£1,920 recovered).  
         - False accusations: 12 × 10% × (40/20) = ~2.4 cases.  
         - *Result:* £2,000 spent recovers £1,920 (worthwhile).  
       - *Key point:* "Same policy, opposite outcome. Did you know the fraud rate when voting?"  

  3. **Reflection (5 min):**  
     - Read aloud Phase 1 justification cards. *Ask:* "Did the outcomes match your vision of fairness?"  
     - Conclude: "Policy isn't about intentions—it's about how rules interact with real lives. What would you change now?"  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Claimant discomfort:**  
     - *Pre-empt:* Start with, "This is fictional. Anyone may opt out—you can observe or co-facilitate."  
     - *If triggered:* Pause, offer to step outside. Have a backup "observer" role (e.g., note-taker).  

  2. **Speech-maker in Phase 2:**  
     - *Pre-empt:* Set rules: "You're in character—no speeches. Focus on your choices."  
     - *If happens:* Interrupt gently: "What did your claimant do this month? Let’s hear from others."  

  3. **Calculation delays:**  
     - *Pre-empt:* Provide a cheat sheet:  
       `Net Benefit = 500 × (1 - Sanction) - (Earnings × Taper); Total = Net Benefit + Earnings - 50 (if working)`  
     - *If stuck:* Use approximate math (e.g., round numbers) or pair participants.  

  ---

  ### **Limitations & Simplifications**  
  - **Fixed pot:** Acknowledge upfront: "Real welfare isn’t a closed box—taxes fund it, and committees don’t see upstream/downstream impacts. We isolate one piece."  
  - **What’s missing:**  
    - Psychological stigma.  
    - Long-term effects (e.g., debt spirals).  
    - Informal support networks.  
    - Macroeconomic factors (e.g., job market).  
  - **Facilitator adds:** "In reality, these interact. Our sim shows mechanics, not the full human picture."  

  ---

  ### **Where I’m Least Sure**  
  1. **Benefit trap may not "bite" if low taper is chosen:**  
     - *Risk:* If taper is 0–40%, working always pays. Participants miss the insight.  
     - *Mitigation:* In debrief, contrast policy outcomes: "With 100% taper, X% of you faced traps; with 40%, no one did. But what if work costs were higher?"  
     - *Redesign clue:* If no one hits the trap in Phase 2, add a "work cost" variable (e.g., childcare) in reruns.  

  2. **Base-rate trap may feel abstract:**  
     - *Risk:* Participants disengage if verification math is too dry.  
     - *Mitigation:* Use participant data. *Ask:* "How many were falsely accused? Was it worth the cost?"  
     - *Evidence that would change my mind:* If fraud is highly concentrated (e.g., 80% in one subgroup), targeted verification could be efficient even at low rates. The sim assumes random fraud distribution.  

  3. **When heavy conditionality works:**  
     - *If:* Fraud is widespread (>30%) *and* verification is highly accurate (false positives <2%) *and* sanctions are coupled with support (e.g., childcare subsidies), the math favors strictness.  
     - *Sim weakness:* We exclude support systems. *Add in debrief:* "Heavy rules can work if paired with investment in compliance capacity (e.g., transport vouchers). Alone, they often backfire."  

  ---

  This design ensures participants *experience* the mechanics, with the debrief linking feelings to arithmetic. The two fraud-rate runs make the base-rate trap visceral. Numbers are invented but grounded in trade-off logic. Run it tight, and they’ll leave questioning assumptions—not convinced they’ve "refuted" anyone.
