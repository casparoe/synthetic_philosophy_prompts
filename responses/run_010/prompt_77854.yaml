  Hmm, the user is asking me to grade a student paper on the ethics of war. They're teaching an upper-level undergraduate seminar and want me to act as a second reader. I need to evaluate this submission about Walzer's moral equality of combatants and the revisionist challenge, without any bias since they haven't formed their own judgment yet.

  The paper question has three parts: explain Walzer's doctrine, present the revisionist challenge, evaluate that challenge, and discuss implications for noncombatant immunity. The student's submission is quite compact but covers all these points in a concise manner.

  Looking at the student's work, their explanation of Walzer is accurate - they capture his separation of jus ad bellum from jus in bello, and the symmetrical permissions between combatants based on mutual danger. Their presentation of McMahan's revisionism is also correct, highlighting the individual liability argument that breaks the symmetry. The student finds the revisionist argument convincing at the individual level but notes practical difficulties.

  Where things get interesting is their policy recommendation - they argue for withdrawing combatant privilege from aggressor-state soldiers and prosecuting them. Then comes the most controversial part: their claim that revisionism weakens noncombatant immunity by extending liability to munitions workers, officials, taxpayers and voters. They dismiss traditional immunity as merely conventional.

  I need to assess this critically. The Walzer and McMahan summaries are strong - concise yet precise. The practical recommendation is logically consistent with their acceptance of revisionism, though it could be more nuanced. The noncombatant immunity section is where major problems emerge. The student oversimplifies revisionist thought here; McMahan actually maintains strong noncombatant immunity by distinguishing between causal contribution and moral responsibility. Their claim that immunity was "never anything more than a convention" is historically and philosophically inaccurate - it's grounded in deep moral principles about innocence and vulnerability.

  For grading, I'll go with 76/100. The accurate expositions of Walzer and McMahan earn solid marks, but the flawed implications for noncombatant immunity and the problematic dismissal of immunity as conventional significantly lower the score. The strongest parts are the doctrinal explanations; the weakest is the conclusion about immunity.

  In my feedback, I'll structure it as continuous prose without headings or bullet points, as requested. I'll start with strengths, then move to weaknesses in the order they appear. I'll highlight how the noncombatant immunity errors weigh heavily on the grade, and suggest revisions focusing on engaging more deeply with McMahan's actual position on immunity and providing more nuanced policy recommendations.
answer: |-
  Your paper addresses the set question with commendable clarity and concision, particularly in your exposition of the core doctrines. Your opening summary of Walzer's moral equality of combatants (MEC) is accurate and effectively captures its central tenets: the symmetrical permissions granted to combatants regardless of the *jus ad bellum* status of their state, the separation of the soldier's role from the leader's decision to resort to war, and the grounding of this symmetry in the mutual status of combatants as dangerous agents whose ordinary moral prohibitions against killing are suspended. You correctly identify the basis of this permissibility in the absence of *personal* wrongdoing by the soldier towards the enemy soldier he faces, even when fighting for aggression.

  Similarly, your presentation of the revisionist challenge, primarily drawing on McMahan, is precise. You accurately state the revisionist core argument: liability to attack is individual and derives from moral responsibility for contributing to an *unjust* threat. You correctly note the resulting asymmetry – that unjust combatants (those fighting without a just cause) are typically liable to defensive killing, while just combatants are generally not, thereby dismantling the moral equivalence posited by Walzer. Your inference that this means unjust combatants commit a moral wrong in killing just combatants, even when adhering to *jus in bello* rules, follows logically from this core revisionist position.

  Your evaluation of the revisionist argument is thoughtful, acknowledging its intuitive moral force at the individual level and the significant practical difficulty it poses for the unjust combatant whose only permissible option is to refrain from fighting. Your proposal to amend the law of armed conflict to withdraw the combatant's privilege from soldiers of the aggressor state and prosecute them for killings is a direct, albeit radical, application of the revisionist logic regarding moral asymmetry. While the feasibility and broader consequences of such a sweeping legal change warrant deeper exploration, your recommendation is internally consistent with your acceptance of the revisionist critique.

  However, the latter part of your paper, concerning the implications for noncombatant immunity, contains significant inaccuracies and problematic inferences that weigh heavily on the overall grade. Your claim that revisionism licenses a "considerably looser principle of discrimination" and that noncombatant immunity survives only in a "much weakened form" is a misinterpretation of mainstream revisionist thought, particularly McMahan's. While revisionists *do* ground liability in individual moral responsibility for an unjust threat, they emphatically *do not* equate mere causal contribution with liability. Revisionists maintain a crucial distinction: liability attaches only to those who bear sufficient *moral responsibility* for an unjust threat, typically requiring intentional contribution or culpable negligence. Merely causing harm (like paying taxes or voting) without sufficient agential involvement or knowledge of the specific unjust threat does not, on the revisionist view, make one liable to lethal attack. Munitions workers *might* be liable *if* their work is directly intended for unjust aggression *and* they are aware of this, but voters and taxpayers are almost universally seen by revisionists as *not* liable precisely because their contribution is indirect, non-intentional with respect to specific threats, and often made under conditions of limited knowledge or without feasible alternatives. Your inference that revisionism logically extends liability to this broad group ("all contribute, and so all fall within it") is inaccurate and misrepresents the revisionist position, which generally seeks to *preserve* noncombatant immunity by focusing liability narrowly on those directly responsible for the prosecution of unjust war, not erode it.

  Furthermore, your dismissal of traditional noncombatant immunity as "never anything more than a convention" is historically and philosophically inaccurate. While its codification in law involves convention, the *moral* principle underlying it – the distinction between those actively engaged in harming (combatants) and those who are not (noncombatants), based on notions of innocence, vulnerability, and the separation of the civilian sphere from the business of fighting – has deep roots in just war thinking (including Aquinas, Vitoria, Grotius) long before modern positive law. Walzer himself defends it as a fundamental moral principle, not merely a convention. Revisionists like McMahan argue for refining the *basis* of the principle (shifting from status to responsibility) but generally aim to *uphold* a robust distinction protecting civilians, albeit on different grounds. Your characterization here is a significant error.

  **Grade: 76/100.** The accurate and clear exposition of Walzer's MEC and the revisionist challenge forms the strong foundation of your paper. Your evaluation of the challenge and the policy recommendation, while requiring more nuance on feasibility, are logical extensions of your acceptance of revisionism. However, the substantial errors in characterizing revisionism's implications for noncombatant immunity – specifically the incorrect claim that it weakens immunity by extending liability to indirect contributors like taxpayers and voters, and the mistaken dismissal of the traditional principle as merely conventional – represent a major flaw in the argument. These inaccuracies significantly impact the final section's validity and lower the overall mark.

  **For revision, focus most critically on the final section.** You must engage more deeply with the revisionist literature (especially McMahan's arguments in works like *Killing in War*) on noncombatant immunity. Correct the misrepresentation that liability stems simply from causal contribution; clarify the role of moral responsibility and intentional agency in the revisionist criterion for liability. Explicitly address why revisionists argue that most civilians (voters, taxpayers) *do not* meet the threshold for liability, despite causal contributions. Re-evaluate and provide evidence for your claim that traditional noncombatant immunity was merely conventional; engage with the philosophical arguments for its moral basis. Strengthening this section by accurately reflecting the complexities of the revisionist position on discrimination is essential. Additionally, while your policy recommendation is provocative, consider adding a sentence acknowledging potential counterarguments or complexities in implementing such a radical legal shift based on *jus ad bellum* determinations.
