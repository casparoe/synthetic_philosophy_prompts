  The user's change-of-question hypothesis holds up well. On escalators: philosophers see a convention because it fits Lewis' criteria (common knowledge, conditional preferences), while modelers see an inefficient equilibrium sustained by incentives. The diagnosis explains why they talk past each other - one analyzes the concept, the other analyzes the mechanism.

  For progress, I'll suggest concrete steps: joint projects showing how philosophical distinctions impact modeling choices, or experiments testing predictions from both frameworks. The key is making the methodological differences explicit rather than pretending they're debating the same thing.

  Throughout, I'll keep returning to the escalator case as the litmus test. The Holborn example perfectly illustrates how the same phenomenon gets different interpretations based on disciplinary lenses. The tutting? To philosophers it's evidence of normative expectations; to modelers it's just an enforcement cost.
answer: |-
  ### 1. Bottom Line  
  This is a **methodological and teleological disagreement**, not a factual or verbal one. The camps pursue fundamentally different goals: one seeks a *conceptual analysis* of what conventions *are* (philosophy), while the other builds *predictive/explanatory models* of how regularities *function* (behavioral economics). Progress is possible if both sides explicitly acknowledge this divergence and stop demanding their criteria apply to the other’s project. Neither is "wrong," but they’re not answering the same question.

  ---

  ### 2. What Each Camp Is Actually Committed To  
  | **Philosophy Camp** | **Behavioral-Economics Camp** |  
  |---------------------|-------------------------------|  
  | **Core Goal**: Define necessary/sufficient conditions for "convention" as a *distinct social kind* (e.g., distinguishing conventions from norms, habits, or rules). | **Core Goal**: Explain/predict behavioral regularities using parsimonious, empirically tractable models (e.g., equilibria, evolutionary dynamics, expectations). |  
  | **Commitments**: <br>- Conventions must satisfy *conceptual criteria* (common knowledge, conditional preferences, arbitrariness). <br>- Counterexamples (e.g., escalators) test the *boundaries* of the concept. <br>- Normativity is central: conventions entail "oughts" (Gilbert, Marmor). <br>- Rejects reductionism: psychology/biology can’t replace conceptual work. | **Commitments**: <br>- "Convention" is a *label* for empirically observed equilibria. <br>- Mechanisms matter (e.g., evolutionary selection, learning), not agents’ beliefs. <br>- Predictive power > conceptual purity (e.g., Bicchieri’s expectations are measurable). <br>- Armchair objections are irrelevant if models work. |  
  | **Where you might caricature**: Not *ignoring* empirical work, but seeing it as addressing a *different question* (e.g., "How do conventions arise?" ≠ "What is a convention?"). | **Where you might caricature**: Not *dismissing* philosophy, but seeing it as a *heuristic* for model-building, not an endpoint. |  

  ---

  ### 3. Four Candidate Diagnoses  
  **1. Verbal Disagreement**  
  - **Prediction**: Dispute arises from ambiguous terminology. "Convention" means X to philosophers, Y to modelers.  
  - **Match? Poor**. Both use Lewis consistently. Philosophers debate his *analysis*; modelers use his *framework* (equilibria). The escalator case is contested despite shared vocabulary.  

  **2. Different Questions**  
  - **Prediction**: Each side answers a distinct question. Philosophers: "What justifies calling this a convention?" Modelers: "How does this regularity persist/change?"  
  - **Match? Strong**. Philosophy dissects the *concept* (e.g., "Is Holborn arbitrariness + common knowledge?"). Modeling asks: "Why does standing-right persist despite inefficiency?" Their arguments never directly engage.  

  **3. Hidden Empirical Question**  
  - **Prediction**: The real issue is testable (e.g., "Do people have Lewisian beliefs?"). Philosophy’s objections are speculative until tested.  
  - **Match? Partial**. Modelers *treat* it as empirical (e.g., "Measure expectations!"). But philosophers reject this move: conceptual criteria aren’t falsified by psychology (e.g., Millikan’s objections are *conceptual*).  

  **4. Bedrock Intuitions**  
  - **Prediction**: Disagreement stems from irreconcilable views of social theory’s purpose (e.g., "Clarify concepts" vs. "Inform policy").  
  - **Match? Moderate**. The escalator debate reveals this: philosophers see a *failure of arbitrariness*; modelers see *equilibrium selection*. Yet both cite Lewis, suggesting shared bedrock is possible.  

  **Your Hypothesis (Change-of-Question)**: Survives robustly. It best explains why each camp "scores points" against strawmen (e.g., modelers think philosophers deny evolution; philosophers think modelers ignore normativity).  

  ---

  ### 4. My Verdict  
  **Your hypothesis is correct**: This is primarily a **divergence in explanatory aims**. Philosophy aims for a *conceptual taxonomy* of social facts; behavioral economics seeks *causal-mechanistic explanations* of behavior. Neither is "predicting behavior" or "offering an analysis" in the way the other assumes. The impasse persists because both camps implicitly demand their project sets the terms for the other. Philosophy’s counterexamples (e.g., Marmor’s bishop) challenge the *scope* of Lewis’ analysis, but modelers rightly note this doesn’t invalidate signaling games. Similarly, modelers’ efficient escalator equilibrium doesn’t refute philosophers’ claim that norms enforce conventions. The dispute isn’t ill-posed—it’s a clash of disciplinary paradigms.  

  ---

  ### 5. The Escalator Test  
  - **Philosophy Camp**: Sees Holborn as a **convention** (standing-right satisfies Lewis’ criteria) that *failed to become a new convention* because it lacked common knowledge/joint commitment (signs removed → reversion). Tutting confirms norm enforcement.  
  - **Modeling Camp**: Sees Holborn as a **suboptimal equilibrium** sustained by incentives (tutting = low-cost enforcement). Reversion occurred because the pilot didn’t change payoffs (e.g., penalties for standing-left).  
  - **Diagnosis Explained**: Philosophers focus on *why standing-right counts as a convention* (conceptual). Modelers focus on *why it persists despite inefficiency* (mechanistic). The former cares about criteria; the latter cares about persistence conditions.  

  ---

  ### 6. What Would Count as Progress  
  Progress would involve **explicitly decoupling the projects** and **collaborative translation**. Concrete signs:  
  1. **Philosophy acknowledges** that models can explain *how* conventions arise/change without resolving *what* they are (e.g., "Signaling games clarify the Holborn dynamics, but don’t address Marmor’s constitutive point").  
  2. **Modeling acknowledges** that conceptual distinctions inform empirical design (e.g., "Testing if escalator behavior involves normative expectations *because* philosophy distinguishes conventions from habits").  
  3. **Joint output**: A study co-designed by both supervisors—e.g., surveying Holborn commuters on beliefs (philosophy’s "common knowledge") *and* incentives (modeling’s "payoffs"), then mapping results to both frameworks. Movement occurs when one side uses the other’s tools *without claiming victory* (e.g., "Bicchieri’s expectations help operationalize ‘conditional preference’").  

  **Key**: Progress isn’t consensus on "what conventions are," but mutual recognition that both projects are valid and complementary.
