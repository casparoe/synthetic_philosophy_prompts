prompt: |-
  I have just come out of a four-hour argument with a friend — she teaches behavioural ecology, I build machine-learning pipelines for a freight company and read philosophy of mind on commuter trains — and I suspect we spent the last two of those hours defending positions neither of us actually holds. The occasion was Dennett's ladder of creature types, which we were both prepared to accept in outline: creatures whose competences are fixed by selection, creatures whose own history can modify them, creatures that can test a hypothesis internally instead of in the world, and creatures that import externally designed tools into their thinking. What I cannot place anywhere on that ladder is a configuration I keep encountering in my own work, and my friend insists I am describing something that already has a perfectly good name. So I want the thing stated more carefully than either of us managed at half past midnight, and then adjudicated.

  The configuration is this: something with no capacity whatsoever to improve itself nevertheless raises the ceiling on what a learner downstream of it can achieve, not by supplying solutions and not by supplying tools, but by constructing the distribution of problems the learner will meet. In one of our training setups there is a module whose parameters are frozen within the first hour of a run. Its entire function is to emit situations for a second module that does all of the learning — situations pitched so that they are neither trivial nor hopeless for the learner as it currently stands. Over several weeks the lineage becomes markedly more competent at the target task, while the frozen module ends exactly as limited as it began: nothing in it changed, it changed what the changing thing had to face. I think the same shape appears elsewhere, which is why I don't think it is an artefact of software. The meerkat work, for instance: helpers hand pups prey that becomes progressively harder to deal with as the pups grow, responding to the pups' own begging, so that each juvenile is presented with a graded sequence of problems matched to what it can currently manage. Or tandem-running ants, where one individual paces and redirects its progress to a follower, effectively controlling the rate at which the other ant's information is acquired. Or, in a register with no biology in it at all, the retiring machinist who spends his final year building jigs and fixtures that make no sense for his own hands and every sense for the apprentice's.

  My friend's objection is that I have merely relabelled three things we already have words for, and that each of the three covers my case. Her first candidate is niche construction or ecological inheritance: organisms modify their environments and descendants inherit the modifications. My answer is that the standard examples change what the environment rewards or what selects for which genes, whereas here the reward is untouched and the only thing that has been engineered is the order and difficulty of the learner's encounters — and, crucially, the builder does not inherit or exploit its own construction, which is why the beaver dam and the termite mound feel to me like different cases rather than paradigm cases. Her second candidate is the Gregorian creature, on the grounds that I have simply split one Gregorian across two individuals. My answer is that the Gregorian description is about taking external artefacts into one's own cognition, and my frozen module has no cognition to extend and could not use its own output even if it had. Her third candidate is teaching, and here I am least sure of myself, since teaching is often defined in terms of a tutor modifying its behaviour in the presence of a naive pupil; but the frozen generator emits the same stream whether or not anyone is listening, which seems to me to be a real disanalogy rather than a quibble. So: does this configuration have an established name, and if it does, which of the existing concepts actually subsumes it and which of my three disanalogies dissolves on inspection? If it does not, I would like you to say where it sits relative to the four creature types — a fifth kind, a way of being Popperian or Gregorian by proxy, or a category mistake on my part — and then coin a term with real boundaries: what would count, what would not (the beaver dam, a gene that biases its own developmental environment, a textbook, a parent who only ever praises effort), and what evidence would show that the category earns its place. I want the carving, not the label; a name alone will not settle anything between us.
reasoning: |-
  Okay, this user presents a fascinating interdisciplinary puzzle after a heated debate with a friend. They're describing a specific configuration where a static system shapes learning by curating problem sequences, without itself learning or being used by the creator. The examples span machine learning (frozen module generating training scenarios), animal behavior (meerkats handing pups increasingly difficult prey), and human mentorship (machinist building jigs for apprentices).

  The core tension is whether this phenomenon fits existing biological/psychological concepts: niche construction (user objects that it doesn't alter selection pressures), Gregorian creatures (argues it's not cognitive tool-use), or teaching (notes the generator doesn't adapt behavior). User wants rigorous conceptual placement within Dennett's framework and possibly a new term if none fits.

  Hmm, what makes this tricky is the dual-aspect of the mechanism: it's environmental scaffolding but decoupled from the scaffolder's benefit. The beaver dam comparison fails because beavers use their own dams, whereas the frozen module/meerkat helper doesn't benefit from the learner's progress. The teaching analogy stumbles on the lack of responsiveness - the problem-generator operates identically regardless of the learner's presence or state.

  I should consider Dennett's creature hierarchy carefully. Darwinian (fixed), Skinnerian (self-modifying via experience), Popperian (internal modeling), Gregorian (external cognitive tools). This configuration seems orthogonal: it's about creating conditions for others' learning while remaining static itself. Not quite Skinnerian because the generator doesn change; not Gregorian because no tools are internalized.

  The key innovation is the curated problem sequence acting as temporal scaffolding. It reminds me of Vygotsky's Zone of Proximal Development, but automated rather than interactive. For naming, perhaps "allostatic scaffolding" - maintaining learning stability through external challenge-regulation? Or "teleodynamic curriculum" to emphasize goal-oriented progression?

  Boundaries matter: beaver dams are excluded (used by builders); growth-hormone genes excluded (internal modification); generic textbooks excluded (not dynamically sequenced); growth-mindset praise excluded (affective not structural). Positive cases would require evidence of: 1) static problem-source, 2) progression calibrated to learner's current ability, 3) no direct self-benefit to source.

  This feels like a distinct fifth category - environmental programming rather than organic learning. The adjudication should show why niche construction/teaching/Gregorian don't fully capture it, while demonstrating how it functionally enables Popperian learning in others. The new term must reflect its engineered, asymmetric, developmental-sequence nature.
answer: |-
  This configuration is both fascinating and distinct—it carves a unique space in Dennett's framework. While your friend correctly identifies related concepts, none fully capture the phenomenon you describe. Let's adjudicate systematically:

  ### Why Existing Concepts Don't Fit  
  1. **Niche Construction/Ecological Inheritance**:  
     - *Disanalogy upheld*: Niche construction (e.g., beaver dams) directly benefits the constructor or its kin via altered selection pressures. Your cases lack this:  
       - The frozen module doesn’t "inherit" the learner’s competence.  
       - Meerkat helpers gain no fitness advantage from *specific* prey progression (unlike dams that provide shelter).  
       - The machinist’s jigs become useless to him post-retirement.  
     - *Boundary Test*: If the dam-building gene increased pup survival *by design*, it would fit. But niche construction is selection-driven, not pedagogically structured.

  2. **Gregorian Creature**:  
     - *Disanalogy upheld*: Gregorian tools (e.g., language, maps) are *internalized* to augment cognition. Your frozen module:  
       - Has no cognition to augment.  
       - Doesn’t "use" its output—it’s inert scaffolding.  
       - Operates identically with or without a learner (unlike tools actively wielded).  
     - *Boundary Test*: If an ant used a pheromone map *itself*, it’d be Gregorian. Tandem running is asymmetric—the leader doesn’t cognitively offload.

  3. **Teaching**:  
     - *Partial disanalogy*: Teaching requires *contingent responsiveness* (e.g., parent simplifying a task if child struggles). Your cases lack this:  
       - The frozen module emits fixed sequences.  
       - Meerkats respond to begging *intensity*, not pupil competence (they don’t adjust prey difficulty mid-interaction).  
       - The machinist’s jigs are static; he doesn’t adapt them post-construction.  
     - *Boundary Test*: If a human tutor dynamically adjusted problems based on real-time performance, it’s teaching. Your cases are *pre-scripted developmental staging*.

  ---

  ### Conceptual Carving: A Fifth Category  
  **Name**: **Allostatic Scaffolding**  
  *(From "allostasis"—maintaining stability through change via proactive environmental adjustment)*  

  **Core Mechanism**:  
  > A static or non-learning entity *structures the trajectory of challenges* for a learner, optimizing the *sequence* and *difficulty gradient* of experiences to maximize competence acquisition, without itself adapting, benefiting, or possessing cognition.  

  #### Boundaries of the Category  
  | **Fits**                          | **Excluded**                          | **Why Excluded** |  
  |-----------------------------------|---------------------------------------|------------------|  
  | Frozen ML module                  | Beaver dam                            | Alters selection/used by builder |  
  | Meerkat prey progression          | Gene biasing own environment (e.g., placental pH) | Benefits self/kin via selection |  
  | Tandem-running ants               | Textbook                              | Gregorian (internalizable tool) |  
  | Machinist’s apprentice jigs       | Parent praising effort                | Teaching (responsive feedback) |  
  | Curriculum-designed exam syllabus | Skinner box                           | Learner’s *own* environment modification |  

  #### Key Differentiators from Dennett’s Creatures  
  - **Not Darwinian**: The scaffolder isn’t genetically fixed; its behavior/design may be sophisticated (e.g., meerkat’s prey choice).  
  - **Not Skinnerian**: The scaffolder doesn’t learn from feedback.  
  - **Not Popperian/Gregorian**: No internal modeling or cognitive tool-use.  
  - **Placement**: A *meta-capability* enabling Popperian/Gregorian learning *in others*. It’s a "ladder-lifting" mechanism for learners downstream.  

  #### Evidence to Validate the Category  
  1. **Necessity Test**: Remove the scaffolder—learning efficiency collapses (e.g., random problem sequences degrade ML performance; meerkat pups fed adult prey starve).  
  2. **Asymmetry Test**: Scaffolder gains no competence/benefit from the learner’s progress (e.g., frozen module’s parameters unchanged; retiring machinist doesn’t reuse jigs).  
  3. **Staticness Test**: Scaffolder’s behavior is fixed or rule-based, not contingent on learner’s real-time performance (vs. teaching).  

  ---

  ### Why This Carving Matters  
  - **In Biology**: Explains "progressive provisioning" (e.g., parasitoid wasps laying eggs in hosts of increasing toughness) without invoking group selection or misapplying teaching.  
  - **In AI**: Formalizes environments as *active curriculum generators*—a shift from "data" to *structured challenge ontogeny*.  
  - **In Philosophy of Mind**: Challenges individualism—cognitive progress can be externally orchestrated by non-agents.  

  **Conclusion**: This is not a category error but a distinct **fifth layer**: the **Scaffolded Creature**, enabled by allostatic scaffolding. It’s evolution’s hack to bypass the need for recursive self-improvement—by outsourcing developmental pacing to static systems. Your midnight argument likely stalled because existing terms force a "tool," "environment," or "teacher" label onto something that is none of these. This carving dissolves the stalemate.  
    
  *To settle the debate: Show that the machinist’s jigs, unlike a textbook, cannot be internalized (not Gregorian), and that meerkats don’t adjust prey difficulty based on pup skill (not teaching). The frozen module’s static nature versus niche construction’s feedback loops is the clincher.*
