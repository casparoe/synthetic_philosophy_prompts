answer: |-
  ### Decision Tree: Is DNA Literally a Code?

  This tree sorts positions on whether DNA functions as a literal code (like computer source code) or if "information" in biology is merely a metaphor. Answer each question based on concrete cases, not abstract principles. Proceed down the branches by selecting "Yes" or "No".

  1.  **Does a synthetic DNA strand storing a photo (e.g., encoded as base pairs in a lab, with no biological function) carry information?**
      -   **Yes**: Go to 2.
      -   **No**: Go to 3.

  2.  **In cell-free translation (e.g., a test tube with ribosomes and tRNAs translating synthetic DNA), does the DNA sequence determine the amino acid sequence of the resulting molecule?**
      -   **Yes**: Go to 4.
      -   **No**: Go to 5.

  3.  **In a living cell (e.g., *E. coli* dividing in a petri dish), does the DNA sequence carry information?**
      -   **Yes**: Go to 6.
      -   **No**:  
          **Leaf A: Biological Eliminativism (influenced by Sarkar)**.  
          Claims: "Information" is a misleading metaphor; DNA is just a chemical reactant without intrinsic meaning.  
          Awkward commitment: Must dismiss terms like "genetic code" as sloppy anthropomorphism, despite their universal use in labs.

  4.  **Is the mapping from codons to amino acids arbitrary? (e.g., lab-engineered bacteria where a stop codon is reassigned to specify serine, with no loss of viability)**
      -   **Yes**:  
          **Leaf B: Strong Computationalism (cell-free) (influenced by Davies)**.  
          Claims: DNA is literal source code; cell-free systems prove sequences alone define outputs, like data on a hard drive.  
          Awkward commitment: Treats test-tube translation as equivalent to a running program, ignoring evolutionary context.  
      -   **No**:  
          **Leaf C: Chemical Essentialism**.  
          Claims: Codon assignments are fixed by chemistry (e.g., stereochemical affinity), not convention, so not a true code.  
          Awkward commitment: Cannot easily explain engineered or natural variant codes (e.g., mitochondria using AUA for methionine).

  5.  **Is the protein produced in cell-free translation (e.g., from synthetic DNA) functional outside a cell? (e.g., an enzyme catalysing a reaction in a test tube)**
      -   **Yes**:  
          **Leaf D: Weak Computationalism**.  
          Claims: DNA carries information readable by machinery, but cellular context adds "meaning" via function.  
          Awkward commitment: The same sequence has "information" in a test tube but only "function" in a cell—a fuzzy boundary.  
      -   **No**:  
          **Leaf E: Contextual Symbolism**.  
          Claims: DNA is only a code within a living cell with evolutionary history; test tubes lack the context for semantics.  
          Awkward commitment: Cell-free systems (derived from cells) can read DNA but don't count as "coding".

  6.  **Is the mapping from DNA sequence to biological outputs (e.g., proteins) arbitrary? (e.g., codon reassignment experiments show multiple workable mappings)**
      -   **Yes**: Go to 7.
      -   **No**: Go to 8.

  7.  **Can heritable information be transmitted without DNA sequence changes? (e.g., prion folding states or methylation marks passed to offspring)**
      -   **Yes**:  
          **Leaf F: Pluralism (influenced by Jablonka)**.  
          Claims: DNA is one of many "codes"; epigenetics or prions are separate informational layers.  
          Awkward commitment: Stretches "code" to cover diverse mechanisms, risking vagueness.  
      -   **No**: Go to 9.

  8.  **Is the cellular machinery (e.g., ribosomes) that reads DNA built from components specified by DNA? (e.g., ribosomal proteins are encoded in the genome)**
      -   **Yes**:  
          **Leaf G: Circular Code (influenced by Hofstadter)**.  
          Claims: DNA is a code, but the interpreter is built by it, creating a self-referential loop.  
          Awkward commitment: Cannot resolve the chicken-and-egg origin—how did the first code run without an interpreter?  
      -   **No**:  
          **Leaf H: Dualism**.  
          Claims: DNA is a code with a separate interpreter (machinery), like software and hardware.  
          Awkward commitment: Machinery is built from DNA-specified parts, undermining separability.

  9.  **Can the same DNA sequence produce different outputs in different contexts? (e.g., alternative splicing in humans yielding multiple proteins from one gene)**
      -   **Yes**:  
          **Leaf I: Constructivism (influenced by Oyama)**.  
          Claims: Outputs are constructed by the system, not fixed by DNA alone—context defines the "code".  
          Awkward commitment: DNA seems passive, despite being essential for inheritance.  
      -   **No**:  
          **Leaf J: Strong Computationalism (biological)**.  
          Claims: In cells, DNA is a program executed by molecular machinery; splicing is just a feature of the runtime.  
          Awkward commitment: Must downplay context-dependence (e.g., splicing signals) as mere implementation details.

  ---

  ### Logically Available but Unheld Positions
  -   **Synthetic "Yes" but cell-free "No" (branch 2)**: Logically, one could argue synthetic DNA carries information alone (e.g., as data) but not when machinery is added in a test tube. This is unexplored—no major position holds it—because adding a reader typically clarifies information (e.g., a QR code needs a scanner). It is unappealing as it implies machinery degrades information.
  -   **Living cell "Yes", arbitrary "No", and machinery not DNA-built (branch 8)**: One could claim DNA is non-arbitrary (chemistry-bound) and the interpreter is wholly separate (e.g., prebiotic). But this is incoherent: if machinery isn't DNA-built, how did it evolve to read DNA? It implies unexplained external design, so it is rarely defended.
  -   **Heritable information "No" but alternative splicing "Yes" (branch 9)**: Denying non-DNA inheritance while accepting context-dependent outputs is coherent but unappealing. It forces DNA to be the sole information source, yet its outputs are unstable—a tension no major position embraces.

  ### Pairs of Leaves the Tree Cannot Distinguish
  -   **Weak Computationalism (D) vs. Contextual Symbolism (E)**: Both depend on the test-tube functionality question. If "function" is ambiguous (e.g., is catalysing one reaction "functional" without a cell?), the tree may misassign positions. D emphasises information without purpose; E requires biological context.
  -   **Constructivism (I) vs. Pluralism (F)**: Both accommodate context-dependence, but the tree separates them via heritable information (branch 7). If epigenetic marks are seen as part of the "reading" mechanism (not separate information), F and I blur. I focuses on DNA's context-dependence; F broadens "code" beyond DNA.
  -   **Strong Computationalism (biological) (J) vs. Strong Computationalism (cell-free) (B)**: Both treat DNA as code, but the tree splits them based on the synthetic/cell-free path vs. the biological path. They are only distinguishable if cell-free systems are seen as fundamentally different from cells—which some engineers might dispute.
