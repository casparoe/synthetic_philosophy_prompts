prompt: |-
  I am a fourth-year doctoral student in behavioral ecology, and I am co-writing an invited review chapter with my adviser on honest signaling in animals. She is the senior author and has final say over which examples we write up as paradigms; the publisher wants roughly a dozen worked cases, and the chapter will also carry a boxed section on signals that lie. Her practice when I propose an example is to reply in a single line — "yes, this is one of ours," or "no, this goes in the box" — almost never with a reason. I am trying to reconstruct the rule she is applying before I spend my last open slot on a pitch that gets bounced, so I would like your help reading her track record.

  Her verdicts so far, with each case as I framed it for her:

  1. The peacock's train, argued to be a condition-dependent ornament whose full expression tracks ectoparasite load, with the authors backing this up by experimental manipulation of parasite load and by showing that train elaboration predicts mating success and survival: include.
  2. The acoustic structure of a red deer stag's roar — specifically the component fixed by the dimensions of the vocal tract — which carries accurate information about body size and weight. The authors I proposed made no appeal to cost whatsoever; they appealed only to anatomical constraint, plus playback trials in which stags responded more cautiously to roars that sounded larger: include.
  3. Stotting in Thomson's gazelles: conspicuous, energetically expensive jumping performed at approaching coursing predators, with evidence that stotters are less likely to be chased and more likely to escape if they are: include.
  4. A manuscript claiming that a brilliantly conspicuous plumage is an honest signal simply because conspicuousness exposes its bearer to predators — a real cost, but the authors' own data showed no association between plumage intensity and any measure of condition, health, or age: exclude.
  5. A frog-calling study arguing that prolonged calling bouts are honest because calling is expensive, in which the authors' own measurements showed small and large males paying roughly the same energetic price per call, with small males still gaining matings by calling anyway: exclude.
  6. Regenerated claws in male fiddler crabs. After a claw is lost, the regrown claw reaches a similar length but is lighter and weaker, so claw size remains a fair guide to body size while ceasing to be a guide to closing force; rivals are usually deterred without fighting and seldom test the claim. The authors argued that regrowing the claw is genuinely costly and called the display honest: exclude, filed under deception.

  The only general principle she has ever volunteered, in a margin note on item 4, was that a signal belongs in the chapter only if a low-quality animal "couldn't get away with" displaying it.

  The example I want to propose for my remaining slot is the black facial patterning of female paper wasps (Polistes dominulus). The pigment is cheap to lay down, the pattern varies widely among individuals who are otherwise difficult to tell apart, and the authors experimentally altered subordinate wasps' faces so that their badges looked exaggerated; these manufactured "cheaters" then received markedly more aggression from rivals than sham-handled controls did, and the authors conclude that the badge is honest precisely because lying gets policed. First, predict her verdict. Then do the part I actually need: state as precisely as you can — precisely enough that I could apply it to an example neither of us has seen — the rule her six verdicts are consistent with, and enumerate every other rule that fits those six verdicts just as well, saying for each what it predicts about the wasp and where the candidates stop agreeing. My own hunch is that she will include it, because nothing she has ever said sounds like a requirement that the trait itself be expensive; but item 6 is obviously the nearest precedent in her record, and I cannot tell whether she will see a cheap badge that reliably gets punished as the same kind of thing as a cheap-looking claw that usually does not. Please address that comparison directly: if she excludes the wasp, what principle is she committed to, and does that principle cost her item 2? If she includes it, what must she say about item 6, and is there any distinction she can hold onto other than how often the bluff gets tested? Finally, name the one further example — described concretely enough, with a species and a mechanism, that I could pitch it to her next — that would most sharply separate the rules that survive her record, and say what verdict each of those rules would force her to give on it. Please write your answer in American English.
reasoning: |-
  Hmm, this is a fascinating methodological puzzle from a behavioral ecology PhD student. They're trying to reverse-engineer their advisor's unspoken rule for classifying animal signals as "honest" versus "deceptive" for a review chapter. The advisor gives minimal feedback - just "include" or "exclude" - and there's one slot left to propose an example about paper wasp facial badges.

  First, let's analyze the pattern from the six existing verdicts:

  The included cases (1-3) all share a core logic: low-quality signalers would pay disproportionate costs for displaying. Peacocks with parasites can't grow elaborate trains (condition dependence), small stags can't produce deep roars (anatomical constraint), and weak gazelles would get caught if they stotted (functional exposure to predation). Crucially, the cost isn't just present - it's differentially burdensome.

  The excluded cases (4-6) fail this test: #4 has costs but no quality linkage, #5 has costs but equally borne, and #6 has costs only for signal production (regrowing claws) but not for dishonest signaling (bluffing with weak claws rarely punished).

  The wasp proposal introduces a novel enforcement mechanism: social punishment makes cheating costly. This is where it gets tricky compared to #6 - both involve "cheap" signals, but wasps get immediately punished for faking while crabs usually get away with it. The advisor's margin note ("couldn't get away with") suggests this policing might qualify.

  Now for rule reconstruction. The minimal viable rule from the data is: "A signal is honest only if low-quality individuals cannot afford the net cost/risk of displaying it authentically." This fits all cases: 

  - Peacocks/stags/gazelles: Low-quality can't physically produce or survive the display
  - Frog/crab: Low-quality can display without penalty
  - Plumage: No quality link despite costs

  But there's ambiguity around enforcement mechanisms. Does "afford" include socially imposed costs? The crab exclusion suggests the advisor requires intrinsic constraints, but the wasps' policing is extrinsically imposed. A stricter rule would be: "Honesty requires the signal to be physically impossible or prohibitively dangerous for low-quality individuals to produce."

  For test cases, consider lizard push-ups: If large males do rapid displays that small males could physically mimic but get injured attempting, it would distinguish between physical constraint (include) vs. social enforcement (exclude) models. Or firefly femme fatales that mimic mating signals to eat males - the mimicry is "free" until detected, testing whether deception requires active punishment.

  On the wasp verdict prediction: I think it'll be included because policing creates an effective barrier ("couldn't get away with"), aligning with the gazelle example where predation risk enforces honesty. This forces reframing of the crab exclusion not as "cheap signal" but as "unenforced bluff."

  The deeper insight here is that the advisor likely adheres to Zahavi's handicap principle in its strictest form: honesty emerges from fundamental asymmetries in cost-bearing ability, whether anatomical, physiological, or ecological. Social punishment might qualify if it creates such an asymmetry.
answer: |-
  Based on your advisor's track record and the principle she volunteered, here's the analysis and prediction for your paper wasp proposal:

  **Predicted Verdict for Paper Wasps:** **Include** (as a paradigm of honest signaling). The policing mechanism creates a scenario where low-quality individuals *cannot get away with* displaying an exaggerated badge without incurring prohibitive costs (escalated aggression), satisfying her stated principle.

  **The Core Rule (Consistent with All 6 Verdicts):**
  A signal qualifies as "honest" for inclusion **only if there exists a mechanism ensuring that low-quality individuals cannot achieve net fitness benefits by displaying the signal at the same intensity/level as high-quality individuals.** Displaying the signal authentically must be *differentially costly or impossible* for low-quality individuals.

  *   **"Cannot achieve net fitness benefits":** Focuses on the outcome (fitness) rather than just the presence of *any* cost. Low-quality individuals either cannot produce the signal, or the costs/risks they incur *when displaying it* outweigh any benefits.
  *   **"Mechanism ensuring":** The constraint must be reliable, not just theoretical.
  *   **"Differentially costly or impossible":** The barrier must disproportionately impact low-quality individuals.

  **Alternative Rules Fitting the 6 Verdicts & Their Predictions for Wasps:**

  1.  **Rule A (Differential *Production* Cost/Impossibility):** Honesty requires the signal to be intrinsically costly to *produce* or physically impossible for low-quality individuals to produce, and this cost/impossibility *directly* enforces the link to quality. (Predicts Wasp: **Exclude** - Pigment is cheap to produce).
  2.  **Rule B (Differential *Display* Cost/Impossibility):** Honesty requires that *displaying* the signal (regardless of production cost) imposes a differential cost or risk that prevents low-quality individuals from benefiting. Costs can be intrinsic (e.g., predation risk from displaying) or extrinsic (e.g., social punishment). (Predicts Wasp: **Include** - Displaying an exaggerated badge triggers punishing aggression).
  3.  **Rule C (Index vs. Handicap Only):** Honesty requires the signal to be an unfakeable "index" (physically constrained, e.g., roar formants) or a "handicap" (costly production/maintenance that only high-quality individuals can afford). Socially enforced signals are excluded. (Predicts Wasp: **Exclude** - Not an index; policing is social enforcement, not a classic handicap).

  **Where the Candidates Stop Agreeing:**
  *   Rules A, B, and C all agree on verdicts 1-6 using their definitions.
  *   They **disagree** on the wasp case:
      *   Rule A (Production Focus) excludes it (cheap production).
      *   Rule B (Display Cost Focus) includes it (punishment cost on display).
      *   Rule C (Index/Handicap Only) excludes it (not an index, policing isn't a classic handicap).

  **Addressing the Crab/Wasp Comparison & Implications:**

  *   **If she Excludes the Wasp:** She must be applying **Rule A (Differential Production Cost/Impossibility)**. She sees the crab's regenerated claw as excluded because the *production* cost (regrowing) is paid *once*, but the *display* of the large-but-weak claw carries little *ongoing* differential cost/risk (seldom tested). The wasp's badge has negligible *production* cost. This rule **does not cost her Item 2 (Stag Roar)**. The roar's formants are an index – physically impossible for small stags to produce, satisfying Rule A's requirement for intrinsic (anatomical) production constraint.
  *   **If she Includes the Wasp (as predicted):** She must be applying **Rule B (Differential Display Cost/Impossibility)**. This forces a reinterpretation of **Item 6 (Crab Claw)**. Under Rule B, the crab claw is excluded *not* because it's cheap to produce, but because displaying the large-but-weak claw *lacks a reliable differential cost/risk* for low-quality individuals – rivals seldom test it, so bluffing is often cost-free and beneficial. The distinction from wasps isn't *just* test frequency, but the **presence vs. absence of a mechanism imposing a differential cost *upon display*.** Wasps have reliable policing imposing costs *when* the badge is displayed; crabs lack a reliable mechanism imposing costs *when* the weak claw is displayed. Rule B allows for extrinsic costs (like social punishment or heightened predation risk) as the enforcing mechanism.

  **Critical Test Case to Separate Rules:**
  **Lizard Push-up Displays (e.g., *Anolis* or *Sceloporus* species)**

  *   **Description:** Male lizards perform energetically costly head-bob or push-up displays during territorial contests. Studies show:
      1.  Large, high-quality males perform more rapid, intense, and prolonged displays.
      2.  Small, low-quality males *are physically capable* of mimicking the display rate/intensity of large males.
      3.  *However*, when small males attempt these high-intensity displays, they experience significantly faster depletion of energy reserves, greater vulnerability to predators due to reduced vigilance, and/or higher risk of muscular fatigue leading to losing ensuing fights. The *act of performing the high-intensity display itself* imposes greater physiological stress and predation risk on low-quality individuals.
      4.  Playback/robot experiments show rivals respond more aggressively to high-intensity displays, but low-quality individuals attempting them suffer disproportionate fitness losses (e.g., higher mortality, lower mating success post-contest).

  *   **Verdict Predictions:**
      *   **Rule A (Production Cost):** **Exclude.** The display *behavior* itself is physically producible by low-quality males; the cost is incurred *during* display, not primarily in building a structure.
      *   **Rule B (Display Cost):** **Include.** Displaying at high intensity imposes differential physiological and ecological costs/risks that prevent low-quality males from benefiting net.
      *   **Rule C (Index/Handicap):** **Include (as Handicap).** The *performance* of the display is energetically costly (a classic behavioral handicap), and only high-quality males can afford the sustained cost.

  **Why this test case works:** It cleanly separates Rule A from Rules B & C. Rule A requires the signal to be *unproducible* or reliant on costly pre-existing structures. Rules B & C would both include the lizard display (B: cost on display; C: behavioral handicap). However, if your advisor *excludes* the lizard case, it strongly suggests she adheres to **Rule A**. If she *includes* it, Rules B or C are still possible, but Rule B is the most consistent with including both the stag roar (index) *and* the wasp badge (social enforcement of display cost). The lizard case helps distinguish A from B/C, while the wasp case helps distinguish B from A/C.

  **In summary:** Your advisor's pattern points to **Rule B (Differential Display Cost/Impossibility)**. This predicts **including** the wasp due to reliable social punishment upon display, while explaining the crab exclusion by the *lack* of reliable costs *upon display* for bluffers. The lizard test case will further refine this, particularly by challenging Rule A. Pitch the wasps confidently; the policing mechanism creates the "cannot get away with" dynamic central to her stated principle and consistent with the gazelle example.
