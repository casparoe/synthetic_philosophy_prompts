prompt: |-
  My supervisor runs a Friday decision-theory reading group and she has this habit of announcing flatly what she'd do in each puzzle before whoever's reading it out has finished. Her track record so far, as best I've got it in my notes:

  Newcomb, the standard one, near-perfect predictor that reasoned its way through her decision procedure the day before: she takes the opaque box only, doesn't even pause. The smoking lesion — a gene that causes both the urge to smoke and the cancer, with the smoking itself doing nothing: she smokes, and says anyone who doesn't has confused evidence with reasons. We then gave her a Newcomb where the box-filler never modelled anyone's reasoning at all but worked off a scan of the player's genome, which happens to correlate strongly with what they'll do: she takes both boxes, and says it's the smoking lesion in cardboard. Death in Damascus she did the week after: Death turns up, is startled to see her, says she'd been certain they'd meet tonight in Aleppo, never misses, and the meeting place was written down before she was born and can't now be altered; the fast camel to Aleppo costs £100. She stays, obviously, the fare being wasted either way. Then she spends ten minutes on the part that actually interests her, which is that if you woke her at a minute to midnight and asked again she'd give the same answer, and that a theory whose advice you expect to regret the moment you've followed it isn't a theory but a trap. One-shot prisoner's dilemma against an exact copy of herself, scanned and run in a box, no communication: she cooperates. The same dilemma against a stranger who is merely similar — same city, same training, choices that correlate, but no copy and no predictor anywhere in sight: she defects, and says the two cases aren't remotely alike however much the matrices look it.

  Next week it's my turn to bring the case and I've writen one that's Damascus with an addition, and I'd rather work out her verdict beforehand than be surprised in front of everyone. Same setup, same speech from Death, same £100 camel. But at seven, an hour after Death has gone, a soothsayer comes to the door. He's explicit that he has no idea where Death will be tonight and that nothing he can tell her bears on it: he isn't a predictor, he's an archivist, and he has never modelled anybody's reasoning. For £1 he'll sell you a page of his register. In three hundred years of travellers who've had that speech in Damascus, the register records what each of them did, and — from tests administered years before their Damascus night plus the record of what became of them and of everyone who depended on them — what sort of decision procedure they were running. The pattern has no exceptions: everyone who stayed was a person whose procedure had served them, and everyone relying on them, badly; everyone who fled was a person whose procedure had served them and their dependants well. In my version the traveller has a daughter whose trust fund she manages and a business partner mid-negotiation, so what sort of agent she turns out to have been isn't only a fact about her. So it's: stay as she said last month and keep the £100 and the bad news, or pay for the camel and die in Aleppo with the good news.

  What I want, roughly in this order. Which rules are jointly consistent with her six verdicts — name them properly, evidential, causal, functional or logical, some stability or ratifiability constraint, or whatever hybrid she's actually running — and say which verdict knocks out which. Then what each surviving rule says about my case and exactly where they part company, because I suspect at least two of them do. Then your best guess at her verdict and the reason you'd give for it: which of the six carries the most weight here, and does the soothsayer's page change anything at all given that she's already ruled on Damascus without it? And if her precedents genuinely don't settle it, what should she say to be most consistent with herself, and what principle is she committing to on each side — I'd like to be able to put that to her directly. Finally, what case should I bring the week after that would tell the surviving rules apart.

  Please write it all as continuous prose, the way you'd write an email or a letter: no headings, no bullet points, no bold, no tables. I'll be reading it on the train.
reasoning: |-
  Okay, let me start by understanding what the user is asking. They want to predict their supervisor's decision in a modified Death in Damascus scenario with a soothsayer. First, I need to recall the supervisor's past decisions in various thought experiments. She took only one box in standard Newcomb, smoked in Smoking Lesion, took both boxes in the genomic Newcomb variant, stayed in Damascus, cooperated with a copy in PD, defected against a similar stranger.

  The key is identifying which decision theories she's using. Her choices suggest she distinguishes between cases with predictors modeling her reasoning (like standard Newcomb) vs. those using non-psychological data (like genomics). In Damascus, she stayed despite Death's prediction, arguing that changing her decision wouldn't help since the meeting place is fixed. That points to causal decision theory (CDT), where only causal effects matter, not correlations.

  Now, the new scenario adds a soothsayer who offers historical data linking past decisions to the quality of the decision-makers' procedures. The user wants to know if this changes anything. The soothsayer isn't a predictor, just an archivist. So, this data is purely correlational, not causal. 

  For CDT, the soothsayer's information shouldn't affect the decision. Staying still saves £100 without changing the outcome. But evidential decision theory (EDT) would consider the correlation: staying is evidence of being a bad decision-maker, which matters. However, the supervisor previously rejected EDT in Smoking Lesion, saying "don't confuse evidence with reasons." So she'd likely dismiss the soothsayer's data as irrelevant evidence, not a reason to act.

  But there's a twist: the decision affects others (daughter, partner). The supervisor cares about being a good decision-maker. In the PD with a copy, she cooperated, showing she values logical ties between decisions. Here, there's no logical tie to past decisions. But the soothsayer's data indicates that staying correlates with being a bad agent. If she cares about actually being a good agent, this correlation might matter. However, her past stance suggests she separates causal impact from evidence.

  Her principle seems to be: only causal dependencies should guide actions, not correlations. The soothsayer's page is correlational, so she'd ignore it. She'd stay, save £100, and maintain that her decision doesn't cause her to be a bad agent; it's just correlated. 

  The test case for the next week could involve a scenario where correlational data has a causal link, like influencing others' perceptions. But the user should present a case where past correlations directly affect future outcomes through others' decisions, forcing a choice between pure CDT and a hybrid approach.
answer: |-
  To untangle your supervisor's decision-theory stance from her six precedents and apply it to your Damascus variant, I'll walk through the principles she's implicitly endorsed, how they interact, what they dictate for your case, and what I suspect her verdict will be. This requires dissecting both the underlying rules and the philosophical distinctions she's consistently drawn.

  Her rulings reveal a sophisticated hybrid of **causal decision theory (CDT)** with a **logical** or **functional stability constraint**, explicitly rejecting **evidential decision theory (EDT)** when evidence lacks causal force. Let's map her precedents:  
  - **Standard Newcomb (one box):** She treats the predictor's model as a *logical dependency*—her decision now is entangled with the prediction made yesterday. Taking one box isn't just about evidence; it's acknowledging that her choice is *causally inert* against a perfect predictor, making dominance irrelevant.  
  - **Smoking Lesion (smokes):** She rejects EDT outright. The gene creates a *correlation*, but smoking *causes* nothing. Abstaining is futile evidence-manipulation.  
  - **Genomic Newcomb (two boxes):** Crucially, the box-filler uses a *non-psychological correlate* (genome scans). Here, she applies CDT strictly: her choice *causes* the contents to change only if the predictor is fallible. No logical tie exists between her reasoning and the scan.  
  - **Death in Damascus (stays):** Death’s prediction is fixed; moving *causes* her to lose £100 without changing her fate. CDT prevails (only causal consequences matter), and she emphasizes the *stability* of the decision—even upon reconsideration, it holds.  
  - **PD w/ Copy (cooperates):** The copy creates a *logical dependency*—her choice *is* the copy's choice. Cooperation is stable, mutually optimal.  
  - **PD w/ Similar Stranger (defects):** Without logical ties or prediction, only *causal incentives* matter. Defection dominates; correlation isn't reason enough to cooperate.  

  **Consistent Rules:**  
  1. **Causal Decision Theory (CDT):** Actions evaluated by causal consequences.  
  2. **Logical/Functional Stability:** Decisions must be robust upon reflection; no regret upon commitment. Rejects theories where acting creates immediate counterfactual regret (e.g., "I wish I hadn't done that now that I've done it").  
  3. **Rejection of Pure EDT:** Correlations without causal power (Smoking Lesion, Genomic Newcomb) are ignored.  

  **Knockouts:**  
  - **EDT** is rejected by *Smoking Lesion* ("evidence ≠ reasons") and *Genomic Newcomb* (takes both boxes despite correlation).  
  - **Timeless/Updateless DT** is partially rejected by *Damascus* (she stays despite fixed prediction; no "update" from Death's speech changes her calculus).  
  - **Naive CDT** (without stability) is rejected by her *Damascus* commentary—she insists a theory shouldn't advise an action you regret *upon taking it*.  

  ---

  **Your Damascus Variant:**  
  The soothsayer’s register offers purely *evidential* (not causal) information: staying correlates with being a "bad" decision-maker. Crucially:  
  - **CDT View:** The £100 camel fare remains the only *causal* lever. Paying £1 for the register or fleeing to Aleppo doesn’t *cause* her to be a better agent; it only provides evidence. Per her Smoking Lesion stance, this is irrelevant. She should stay, save £101, and ignore the register.  
  - **Stability View:** If she stays, learns she’s "bad," and regrets it—violating her stability principle. But if she flees solely due to evidence, she violates CDT. A tension emerges.  
  - **Logical/Functional Extension:** The register isn’t about *her* decision’s outcome but her *type*. Her past rulings care about real-world consequences (daughter’s trust, partner’s negotiations). Being a "good" agent *causes* better outcomes for dependents. Yet the soothsayer doesn’t make her actions *cause* goodness; the correlation is historical.  

  **Where Rules Diverge:**  
  - Pure **CDT** says *stay*, ignore register (£101 saved, fate unchanged).  
  - **Stability + CDT** says *stay*, but the regret risk might force a rethink. However, her Damascus commentary suggests she’d dismiss post-hoc regret if the causal logic holds.  
  - A **functional** view (prioritizing being a "good" agent) could argue fleeing *screens* her type—showing she’s the kind who heeds evidence. But this flirts with EDT, which she rejects.  

  ---

  **Predicted Verdict:**  
  She **stays in Damascus** and **ignores the soothsayer**, offering two reasons:  
  1. *"The soothsayer sells evidence, not causality. Paying £1 to learn I’m damned doesn’t change whether I’m damned—it just makes me £1 poorer. Fleeing to Aleppo doesn’t make me a better steward; it makes me dead in Aleppo. This is Lesion-style confusion."*  
  2. *"Stability survives: if I stay, and the register calls me bad, that’s a fact about my past decisions, not this one. Changing my mind now wouldn’t retroactively fix my daughter’s trust fund. Regret isn’t a reason—it’s data."*  

  The core precedent is **Smoking Lesion**: the soothsayer’s register is a correlation without a causal lever, much like the lesion gene. Her Genomic Newcomb ruling confirms she distinguishes predictors that bind logically to reasoning (standard Newcomb) from those using inert correlates (genome/register). Damascus without the soothsayer already dismissed predictive evidence as causally irrelevant. Adding the register changes nothing; it’s just more (expensive) evidence.  

  ---

  **If Challenged on Consistency:**  
  If pressured about the daughter/partner consequences, she might add:  
  *"Being a ‘good agent’ isn’t a label you choose by buying registers or fleeing cities. It’s built by years of causally effective decisions. If I’m the type who stays, buying the register might tell me I’ve failed my daughter already. But overpaying Death’s fare today won’t cure that. If I’m the type who flees, I die a good agent but leave my partner mid-negotiation. Neither optimizes—so I default to the only causal control I have: keeping my money."*  
  This commits her to:  
  - **Actions must have causal efficacy to be reasons.**  
  - **Moral responsibility stems from actual causal impact, not evidence of one's type.**  

  ---

  **Next Week’s Test Case:**  
  To probe the boundary between logical and evidential ties, present:  
  *The **Procrastination Parable**: An agent must email a collaborator today (cost: low effort) or tomorrow (high effort). A predictor scans her brain today; if it forecasts she’ll email today, the collaborator rewards her with a bonus tonight. If she emails today, she gets the bonus. But if the predictor forecasts "today" and she *doesn’t* email, she gets nothing. Crucially: the predictor uses fMRI correlates of impulsivity, not a full decision-model.*  

  - **CDT** says: *Email today* (causes bonus).  
  - **EDT/logical** says: *Don’t email*—if the predictor sees impulsivity, she likely gets the bonus anyway; acting reveals the forecast was wrong.  
  - **Her hybrid** should split: if she treats fMRI as *logical* (like standard Newcomb), she might delay; if *evidential* (like genome scans), she emails today. Her verdict clarifies whether "scanning the brain" implies a functional dependency or mere correlation.  

  This forces her to generalize the distinction she drew in Genomic Newcomb vs. standard Newcomb, isolating whether neural correlates are "reasons" or "evidence."  

  ---  

  Your case brilliantly layers evidential temptation onto a causal frame. But her track record suggests she’ll see the soothsayer as a £1 trap, a distraction from the camel’s causal simplicity. If she wavers, it’ll be on the stability point—but I’d bet on her doubling down. Prepare for that "evidence vs. reasons" speech.  

  Safe travels on the train.
