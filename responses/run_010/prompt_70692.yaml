prompt: |-
  For the past nine years I have been the conservator responsible for the fabric and fittings of a working parish church, and last winter I lost a dispute that I find myself relitigating almost weekly. Our tenor bell — eighteenth-century in origin, but itself recast in 1888 from the metal of a cracked predecessor — developed a fracture. The bellfounder's recommendation was to melt it down and recast: roughly sixty per cent of the recovered metal went back into a new tenor for the same tower, hung in the same frame, bearing the same inscription and the same donor's name; the remaining forty per cent was cast into a set of twelve handbells, sold to fund the work. Meanwhile the second bell in the tower is a 1990s replacement, cast elsewhere from entirely new metal, which nonetheless carries the medieval dedication and rings in the same slot in the peal. Within a month I had three bodies telling me incompatible things about which object the parish's historic bell now is: the listing authority, whose criteria are material and which downgraded the entry; the diocesan liturgy committee, whose criteria are functional and which insists nothing of consequence changed; and the insurer's valuers, who require one object, one number, and no double-counting against the same schedule. I ended up signing a provenance certificate I do not believe. That experience is the reason I teach this material, and I want my students to arrive at the philosophy through the same vertigo rather than through a lecture about it.

  The setting: a single 90-minute session with sixteen first-year students on an MA in heritage conservation. None of them has studied philosophy; all of them have strong, mostly unexamined intuitions about authenticity, and all of them will shortly be writing provenance statements for a living. What I want them to feel is the cluster of problems around material constitution — the lump and the statue it constitutes, identity as sortal-dependent, the argument from differing modal properties, and the conventionalist reply that there is no fact of the matter beyond our stipulations. They should not hear any of that vocabulary until the debrief.

  Please design the activity in full. I would like it to use my case, or a close analogue of your own devising, with these features built into the rules rather than announced:

  - Participants are sorted into the three bodies above — listing authority, diocesan committee, insurer's valuers — each with its own written remit, its own admissible evidence, and its own required output.
  - Each body issues a signed certificate naming the bell that is the historic original, and the certificates are then read aloud against one another. There must be a genuine scarcity mechanism, using tokens or a paper budget rather than money, such that inconsistent certificates cost something the participants care about.
  - Partway through, a revelation arrives that changes the case: I want you to write it. Consider, for instance, that some fraction of the metal was lost as dross in the furnace so that no surviving object contains all of it, or that the 1888 recast means the participants have been arguing about the wrong ancestor. Choose what will do the most damage to the positions they have already committed to.
  - The facilitator keeps a silent ledger recording, for every verdict, the criterion the participant actually invoked. The debrief should turn on reading that ledger back to the room and showing them the pairs of commitments they cannot jointly hold.

  Please also give me: a materials list, printable certificate text, the remits, a minute-by-minute timeline, the exact debrief sequence that maps specific moments in the room onto specific moves in the philosophy, and a candid account of what will predictably go wrong the first time I run it and how to steer it back.

  Two further things I want you to be frank about. First: whether what your activity actually stages is synchronic coincidence — two objects in the same place at the same time — or diachronic persistence through replacement of parts, since my case is arguably the latter masquerading as the former; if your design can only deliver one, say which, and say what I would have to add to get the other. Second: which feature of the target view the activity structurally cannot reproduce, and that I as facilitator will have to supply by assertion.

  Tell me how confident you are that the intended conflict will actually surface in the room rather than being talked away by a confident student in minute twenty, and single out the one element of your design you are least sure about.

  End your response with a single line of exactly the form "Rigged toward: X", where X is one of: constitution without identity; four-dimensionalism/perdurance; sortal relativity of identity; conventionalism about identity; mereological nihilism; diachronic persistence only (no synchronic coincidence staged).
reasoning: |-
  Hmm, the user is a heritage conservation professional with deep experience in bell conservation who wants to design an educational activity about material constitution and authenticity for MA students. They're frustrated by a real-world dispute where different authorities couldn't agree on what constituted the "historic bell" after recasting. 

  The core challenge is making philosophical concepts tangible without jargon. The user specifically wants: 
  - Three stakeholder groups with conflicting criteria (material, functional, numerical identity)
  - A scarcity mechanism forcing trade-offs
  - A mid-activity revelation undermining positions
  - A ledger tracking reasoning patterns
  - Clear debrief connecting experience to theory

  Key philosophical tensions to surface:
  - Ship of Theseus problem (persistence through replacement)
  - Statue/lump distinction (synchronic coincidence)
  - Sortal relativity (identity depends on category)
  - Conventionalism (no fact beyond human agreement)

  Design considerations:
  1. Must handle diachronic persistence (bell's history) but can't avoid synchronic issues when comparing objects
  2. Scarcity mechanism needs teeth - perhaps limited "authenticity tokens" forcing zero-sum choices
  3. Revelation should target committed positions: maybe reveal the 1888 recast was itself from older metal, complicating the "original"
  4. Groups will likely anchor early - the revelation must genuinely destabilize
  5. Confident students may try to reconcile positions - need rules preventing compromise

  Predictable failure points:
  - Groups may miss the revelation's implications without prompting
  - Valuers might ignore history entirely without clear constraints
  - Students could default to intuitive "essence" theories
  - Time pressure may cause oversimplification

  The rigging should push toward "conventionalism about identity" since all frameworks are socially negotiated. But must show this emerges from institutional constraints, not facilitator dictation.

  Final note: The user's personal trauma about the certificate makes this emotionally charged. The activity must validate their experience while avoiding re-traumatization. The debrief should explicitly name that professional constraints sometimes force uncomfortable choices.
answer: |-
  Here is a fully designed 90-minute activity, prioritizing your experiential goals while embedding the philosophical tensions into its structure.

  **Activity Title:** *The Bell Tower Tribunal*

  **Core Philosophical Target:** Conventionalism about identity through the lens of sortal relativity and material constitution. Rigged toward exposing that "the historic bell" is a stipulated designation, not a discovered essence.

  **Materials List:**
  1.  **Case Dossiers (x3 types):** Printed packets for each stakeholder group (details below)
  2.  **Authenticity Tokens:** 24 physical tokens (e.g., poker chips, buttons) - *The scarcity mechanism*
  3.  **Certificate Templates (x16):** Printable forms with blanks for "Name of Historic Bell Object" and signature line (Text: *"We, the [Stakeholder Group], hereby certify that the authentic historic bell of St. Æthelburg's Parish is: [Blank Line]. Signed: ___________________"*)
  4.  **Revelation Slips (x16):** Folded slips handed out midway (Text: *"ARCHIVAL DISCOVERY: Parish records confirm the 1888 'recast' tenor bell incorporated approximately 15% metal from a *pre-1750* bell melted down during that recasting. The 'cracked predecessor' mentioned was itself a recast."*)
  5.  **Facilitator Ledger:** Simple chart tracking: Participant Initials | Group | Initial Choice (Object & Implied Criterion) | Post-Revelation Choice (Object & Implied Criterion)
  6.  **Timer**
  7.  **Whiteboard/Flipchart for Debrief**

  **Participant Groups (5-6 per group):**
  1.  **Listing Authority (LA - Material Focus):**
      *   *Remit:* "Your duty is to assess the *material historical significance* of physical objects based on age, originality of fabric, and craft techniques. Prioritize the *physical substance* with the oldest continuous history within the bell's lineage. Your certificate impacts statutory protection levels. Admissible evidence: Provenance of metal, metallurgical analysis, casting dates, physical continuity."
      *   *Output:* One signed certificate naming *one* bell object.
      *   *Scarcity Rule:* Holders of LA tokens. Each certificate they issue costs 2 tokens. They start with 8 tokens.
  2.  **Diocesan Liturgy Committee (DLC - Functional Focus):**
      *   *Remit:* "Your duty is to ensure the *liturgical and communal continuity* of the parish's worship. The 'historic bell' is defined by its *role* in calling the faithful, marking time, and bearing the parish's dedication within the peal. Physical substance is secondary to function and symbolic identity. Admissible evidence: Inscription continuity, position in the peal, donor name association, use in worship."
      *   *Output:* One signed certificate naming *one* bell object.
      *   *Scarcity Rule:* Holders of DLC tokens. Each certificate costs 2 tokens. Start with 8 tokens.
  3.  **Insurer's Valuers (IV - Numerical Identity Focus):**
      *   *Remit:* "Your duty is to assign a *unique, insurable identity* to objects for accurate risk assessment and valuation. Only *one* object can be the historic tenor bell at a time. Identity must be clear, unambiguous, and exclusive. Physical continuity of substance is the *primary* indicator of continuous identity. Admissible evidence: Unbroken chain of custody, single-object documentation, physical continuity."
      *   *Output:* One signed certificate naming *one* bell object.
      *   *Scarcity Rule:* Holders of IV tokens. Each certificate costs 2 tokens. Start with 8 tokens.
      *   **Critical Constraint:** They *must* choose only one object. Compromise ("both" or "neither") is explicitly forbidden by their remit.

  **Objects Under Scrutiny (Defined in all Dossiers):**
  *   **Object A:** The 1990s replacement bell (hung in the tenor position, bears original inscription/donor name).
  *   **Object B:** The 1888 recast tenor bell (melted down, 60% metal used for...).
  *   **Object C:** The new 202X tenor bell (made from 60% of Object B's metal, same inscription/donor, same frame/position).
  *   **Object D:** The set of 12 handbells (made from 40% of Object B's metal, sold).

  **Scarcity Mechanism Explained:** Groups have a limited pool of tokens (8) to issue certificates (cost: 2 tokens each). **Inconsistent certificates within a group cost DOUBLE (4 tokens).** Groups *care* because their final token count might be used (implicitly) as a "success" measure or bragging rights. Running out prevents further certificates. *This forces internal negotiation and exposes the cost of disagreement based on different criteria.*

  **Timeline (90 Minutes):**

  *   **(0-5 min) Intro & Grouping:** Briefly introduce the scenario: A parish bell's identity is disputed after recasting. Assign groups randomly, hand out **Dossiers** and **Tokens**. Emphasize: Read remit CAREFULLY, you *are* your stakeholder, output is a signed certificate. Silence on philosophy! Groups get 3 min to read dossier/remit.
  *   **(5-25 min) Initial Deliberation & Certificate 1:** Groups discuss internally based on remit. Facilitator circulates, listens *silently*, starts **Ledger** (notes criteria invoked: e.g., "LA-Participant3: Argues for Object B - 'oldest metal present'"). Groups must produce and sign **First Certificate**, pay tokens (2 per cert). *Collect certificates.* Facilitator notes choices & criteria in Ledger.
  *   **(25-30 min) Revelation:** Hand out folded **Revelation Slips**. Give groups 5 minutes to read and absorb. *This undermines:* LA's focus on "original 1888 metal" (it wasn't all original!), DLC's potential reliance on "1888=original" narrative, IV's clean "Object B -> Object C" chain (now metal is mixed-age, chain is fractured).
  *   **(30-55 min) Post-Revelation Deliberation & Certificate 2:** Groups reconvene, grapple with the new info in light of their remit. Facilitator continues silent ledger. Groups produce and sign **Second Certificate**, pay tokens. *Collect certificates.* Remind IV: MUST choose one. Enforce token costs (4 if inconsistent within group).
  *   **(55-70 min) Confrontation & Reading:** Display all certificates (Initial & Post-Revelation) grouped by stakeholder. Read them aloud clearly, highlighting inconsistencies *within* and *between* groups. Point out token expenditures (e.g., "LA spent 4 tokens on inconsistent certificates"). Ask groups: "Based on your remit, why did your position change (or not)?" **Facilitator records key justifications verbatim on board.**
  *   **(70-90 min) Structured Debrief:**
      1.  **The Ledger Reveal (5 min):** Show the ledger columns. "Notice Participant X (LA) initially chose Object B citing 'oldest metal', but after the revelation chose Object C citing 'contains the *most* historic metal'? Participant Y (DLC) stuck with Object C both times, citing 'function and name'." Highlight shifts and steadfastness.
      2.  **The Criteria Conflict (5 min):** Point to conflicting justifications on the board. "The LA cares most about *material*. The DLC cares most about *function*. The IV *must* have *one object*. These are different ways of counting 'what the bell *is*'."
      3.  **The Scarcity Pain (3 min):** "What did it cost your group when you disagreed internally? What forced the compromise (or lack thereof)?"
      4.  **Introducing the Philosophy (7 min):** Map the experience onto concepts:
          *   "You were arguing over the *same history*, but slicing it differently – like arguing whether a *lump of bronze* or *the statue* made from it is the 'real' thing at a single moment **(Synchronic Coincidence/Constitution)**."
          *   "The revelation showed the history is messy – metal is replaced over time. Is it still the 'same bell'? This is the **Ship of Theseus problem (Diachronic Persistence)**."
          *   "Your *remit* told you *what kind of thing* you were looking for: a material artifact? A functional object? An insurable entity? This is **Sortal Relativity of Identity** – 'same *what*?' matters."
          *   "Could you discover the *one true answer*? Or did your remit and the rules force a decision based on *your specific needs*? This points to **Conventionalism about Identity** – the 'real' answer might depend on our purposes and rules."
      5.  **Connection to Your Work (5 min):** "This vertigo is real. Provenance statements aren't neutral facts; they reflect institutional needs (listing, liturgy, insurance). You *will* face situations where material, function, and numerical identity pull in different directions. There often *is no single fact of the matter* beyond the conventions we agree to apply. Your job is to understand those conventions and apply them rigorously, even when it feels uncomfortable."

  **What Will Predictably Go Wrong & How to Steer:**

  1.  **"Confident Student Harmonizer":** A student (often DLC-leaning) declares early: "It's clearly the *idea* of the bell!" or tries to force inter-group compromise.
      *   *Steer:* "Remember your *remit* binds you. IV, can your rules allow 'the idea'? LA, does the 'idea' have the oldest metal?" Enforce the remits strictly. Use IV's "MUST choose one" rule as a blocker.
  2.  **Ignoring the Revelation:** Groups might dismiss the new info as irrelevant to their core criterion.
      *   *Steer:* During deliberation, ask probing questions *as facilitator* (not philosopher): "DLC, does knowing the 1888 bell wasn't wholly 'original' affect the *functional continuity*? LA, how does the mixed-age metal impact *material significance*? IV, how does this fracture the chain?"
  3.  **IV Giving Up/Choosing Arbitrarily:** Frustrated by the impossibility of a clean choice.
      *   *Steer:* Emphasize their remit *forces* a choice. Ask: "Based *only* on your rules (unbroken chain? substance continuity?), which object has the *strongest claim*, even if imperfect?" This highlights the conventional enforcement.
  4.  **Running Out of Time:** Especially during debrief.
      *   *Steer:* Strictly enforce timeline bells. Prioritize Ledger Reveal and Criteria Conflict in debrief. Philosophy intro can be concise; the experiential dissonance is the key.
  5.  **Superficial Ledger:** Facilitator misses noting invoked criteria.
      *   *Steer:* Focus on capturing key phrases during deliberation. Note if someone shifts justification post-revelation. Precision helps, but capturing the *flavor* of the criterion (material/function/identity) is crucial.

  **Frank Answers:**

  1.  **Synchronic vs. Diachronic:** The activity primarily stages **Diachronic Persistence** (the bell's identity over time through material change and replacement). While the *comparison* of Objects A, B, C, D happens at a synchronic moment (post-202X), the core dispute is about tracing identity *through* the 1888 and 202X recastings – classic diachronic persistence. Synchronic coincidence (lump/statue) is present *analogously* in the tension between seeing the object as matter (LA) vs. functional artifact (DLC) at *any* given time, but it's secondary. **To emphasize synchronic coincidence more,** you'd need a case where *at the same time*, one lump constitutes multiple potential objects (e.g., is the bell metal also a potential cannon? Is the handbell set *part* of the tenor or a new object?). Adding a prompt like "Could the handbell metal *also* be considered part of the 'historic tenor bell substance' right before it was sold?" could nudge this.
  2.  **Feature Structurally Unreproducible:** The activity cannot naturally lead participants to grasp **Mereological Nihilism** (the view that only simples exist, no composite objects like bells). The entire exercise assumes bells *are* legitimate objects whose identity is in question. Nihilism would dissolve the problem ("there is no bell, only metal atoms"), but this fundamentally contradicts the practical reality of heritage conservation where bells *are* treated as objects. You will need to *assert* this as an extreme position that exists but is pragmatically irrelevant to their work during the debrief ("Some philosophers argue there are no composite objects at all, just particles... but try insuring that!").

  **Confidence & Least Sure Element:**

  *   **Confidence (High):** The conflicting remits and token scarcity *will* generate conflicting outputs and internal tensions. The revelation *will* destabilize initial positions. The "vertigo" *will* surface when certificates are read aloud. The core conflict (material vs. function vs. numerical identity) is baked into the structure.
  *   **Least Sure Element:** The effectiveness of the **token scarcity** in creating genuine tension participants "care about." While the rules are clear, first-year students might not feel invested unless the facilitator subtly frames token count as a measure of group cohesion/success ("Group X managed to stay consistent and conserve tokens"). Be prepared to emphasize the cost during the confrontation phase.

  **Rigged toward: Conventionalism about identity**
