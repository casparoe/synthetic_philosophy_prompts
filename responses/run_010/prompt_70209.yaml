answer: |-
  Here’s a direct, position-committed guide for your handout, addressing both Lewis’s argument and the embedding problem. I’ll correct a subtlety in your reconstruction and recommend a specific treatment for embeddings.

  ### Part 1: Lewis's Triviality Result – The Moral and Proof
  **Your Reconstruction (Mostly Correct, One Refinement):**  
  Lewis’s argument, stripped to essentials:  
  1. **Assumption for reductio:** Indicative conditionals ("If *A*, then *B*"; denoted *A* → *B*) have truth conditions (i.e., they express propositions with truth values).  
  2. **Probability Axiom:** If *A* → *B* has a truth value, then its probability is the probability it is true: **P(A → B) = P(Truth of *A* → *B*)**.  
  3. **Key Premise (Lewis’s "No Other Candidate"):** The only plausible candidate for **P(A → B)** is the conditional probability **P(B | A)**. (This is Adams’s Thesis, motivated by intuitive probability judgments, e.g., about bets or beliefs.)  
  4. **The Equation:** Therefore, *if* → has truth conditions, it must satisfy:  
     **P(A → B) = P(B | A)**  
     for all *A*, *B* in the domain of a "non-degenerate" probability function *P* (where *P(A) > 0* and *P(A) < 1* for some *A*, and *P* is defined over a sufficiently rich algebra).  
  5. **The Proof (Sketch for Handout):**  
     *   Assume **P(A → B | C) = P(B | A ∧ C)** (*Generalized Adams’s Thesis*).  
     *   Consider a partition: {*A ∧ B*, *A ∧ ¬B*, *¬A*}.  
     *   Apply the Law of Total Probability to **P(A → B)**:  
          `P(A → B) = P(A → B | A ∧ B) * P(A ∧ B) + P(A → B | A ∧ ¬B) * P(A ∧ ¬B) + P(A → B | ¬A) * P(¬A)`  
     *   Substitute using the Generalized Thesis:  
          `P(A → B) = P(B | (A ∧ B) ∧ A) * P(A ∧ B) + P(B | (A ∧ ¬B) ∧ A) * P(A ∧ ¬B) + P(B | ¬A ∧ A) * P(¬A)`  
          Simplify:  
          `P(A → B) = P(B | A ∧ B) * P(A ∧ B) + P(B | A ∧ ¬B) * P(A ∧ ¬B) + P(B | ⊥) * P(¬A)`  
          `P(A → B) = [1 * P(A ∧ B)] + [0 * P(A ∧ ¬B)] + [Undefined! * P(¬A)]` → Problem!  
     *   **Lewis's Fix:** Instead, use the partition {*B*, *¬B*} *conditional on A being false*. This yields (after similar steps):  
          `P(A → B) = P(B | A)`  
          but also  
          `P(A → B) = P(B)`  
          → **∴ P(B | A) = P(B)**.  
     *   **The Triviality:** This holds *for all propositions A, B* in the algebra only if *P* is *trivial* (e.g., no *A* is probabilistically independent of *B*). Contradiction.  
  6. **The Clean Inference:**  
     *   The proof shows that **no non-degenerate probability function can satisfy `P(A → B) = P(B | A)` for all A, B** while treating *A → B* as a proposition (step 1).  
     *   Since **P(B | A)** is demonstrably *not* equal to **P(B)** in non-degenerate probability spaces, and **P(A → B)** *must* equal **P(B | A)** if → has truth conditions (steps 2 & 3), the initial assumption **must be false**.  
     *   **∴ Indicative conditionals (A → B) lack truth conditions.**  
     *   **Moral:** Lewis’s result doesn’t *merely* show Adams’s Thesis conflicts with truth conditions; it shows **truth conditions for the indicative conditional are *impossible*** within standard probability theory and plausible logic. This *necessitates* a non-propositional semantics (like Adams’s).

  **Crucial Correction/Clarification:**  
  Lewis’s result *does not* prove there is "no other candidate" besides **P(B | A)** for the probability of a conditional *with truth conditions*. Rather, it shows that **P(B | A)** *itself* cannot be the probability of a proposition *unless* the probability space is trivial. The force comes from the combination of:  
  (i) **P(B | A)** is the *only* plausible candidate for what **P(If A, B)** *should be*, and  
  (ii) **P(B | A)** *cannot* be **P(Truth of If A, B)** non-trivially.  
  → Thus, **If A, B** cannot have truth conditions. Lewis absolutely took this to vindicate Adams’s non-cognitivism.

  ### Part 2: Defending a Solution to the Embedding Problem
  **Recommended Treatment: Dynamic Semantics (Specifically, Update Semantics / Context Change Potentials)**  
  *   **Core Idea:** Conditionals don't express propositions with truth conditions. Instead, they express *instructions to update beliefs* or *constraints on belief states*. "If *A*, then *B*" tests whether your current credence state, *updated on A*, accepts *B*. Embeddings are handled by defining how these instructions/compositions interact within complex sentences.
  *   **Handling Embeddings:**  
      *   **Negation (~(If A, B)):** "It's not the case that if A, then B."  
          *Interpretation:* Rejects the conditional constraint. Your credence state does *not* satisfy the requirement that updating on *A* yields high credence in *B*.  
          *Formally:* The negation of a conditional is true (or acceptable) in a state *σ* iff updating *σ* on *A* does *not* result in a state that accepts *B*.  
          *Grounds:* Directly mirrors the non-propositional core idea. Negation targets the *failure of the conditional constraint*, not a truth value. Avoids truth-conditional contradictions.
      *   **Disjunction ((If A, B) ∨ C):** "Either if A then B, or C."  
          *Interpretation:* Presents a choice of belief updates. To accept the disjunction, your credence state must either (1) satisfy the constraint that updating on *A* yields high credence in *B*, *or* (2) already accept *C* (without needing the update).  
          *Formally:* *σ* accepts *(If A, B) ∨ C* iff *σ* accepts *C* OR *σ* updated on *A* accepts *B*.  
          *Grounds:* Handles the "Or-to-If" inference (*C or D; therefore, If ~C, D*) naturally. Provides a uniform, compositional mechanism using update operations.
      *   **Antecedent of Conditionals (If (If A, B), then C):** "If it's true that if A then B, then C."  
          *Interpretation:* Tests what happens when you add the *constraint* imposed by *A→B* to your belief state.  
          *Formally:* *σ* accepts *If (If A, B), then C* iff the state *σ'* (which is *σ* modified to incorporate the constraint that *A→B* imposes – e.g., *P_σ'(B|A) ≈ 1*) accepts *C*.  
          *Grounds:* Maintains compositionality by treating the antecedent conditional as modifying the context/state against which the consequent *C* is evaluated. Explains intuitions about iterated conditionals without truth conditions.
  *   **Why Defend This (Over Alternatives)?**  
      1.  **Fidelity to Lewis/Adams:** It directly implements the core non-cognitivist/expressivist insight (conditionals as constrainers of belief states, not truth-bearers).  
      2.  **Systematic Compositionality:** It provides a rigorous, general framework (using tools from formal semantics/dynamic logic) to handle *all* embeddings uniformly via state updates/constraints.  
      3.  **Empirical Adequacy:** It successfully captures the probabilistic intuitions driving Adams’s Thesis and Lewis’s result, while also accounting for key logical behaviors of embedded conditionals (e.g., negation patterns, Or-to-If) better than purely syntactic supplements to expressivism.  
      4.  **Superiority Over Rivals:**  
          *   *Restall & Russell (Biconditional Adams’ Thesis):* Treats *P(If A, B) = P(B|A)* as definitional even under embeddings. This is elegant but struggles severely with complex embeddings (especially involving negation and quantifiers) and clashes with strong intuitions about validity. Dynamic semantics offers more nuance.  
          *   *Pure Expressivist "Supplementation" (e.g., Blackburn, Gibbard):* Relies on "nesting" attitudes. Often becomes ad hoc or overly complex for complex embeddings (like conditionals in antecedents). Lacks the formal precision of the dynamic approach.  
          *   *Possible Worlds + Context (Stalnaker-inspired):* Maintains truth conditions contextually. Lewis’s result *directly challenges* this path – it’s the main target! Dynamic semantics embraces the non-truth-conditional conclusion Lewis drew.

  **Handout Structure Suggestion:**  
  1.  **Lewis's Result:** State assumptions → Key Equation → Proof Sketch → **Moral: No Truth Conditions → Non-Cognitivism Required** (Emphasize the *impossibility* result).  
  2.  **The Consequence: The Embedding Problem:** Why embeddings (negation, disjunction, antecedents) are the *major challenge* for Adams/Lewis-style non-cognitivism.  
  3.  **The Solution: Dynamic Semantics:**  
      *   Core Idea (Conditionals as State Constraints/Updates)  
      *   How it solves embeddings:  
          *   Negation: Rejecting the constraint.  
          *   Disjunction: Choice of constraints/beliefs.  
          *   Antecedents: Adding constraints before evaluating consequent.  
      *   **Why it's the Best Defense:** Uniformity, Compositionality, Fidelity, Empirical Coverage.  
  4.  **Brief Coda:** Acknowledge challenges (e.g., quantifying into conditionals) but stress dynamic semantics provides the most robust framework to tackle them *within* the non-truth-conditional paradigm vindicated by Lewis.

  This approach gives a clear, defensible narrative: Lewis forces non-cognitivism; dynamic semantics provides the most viable non-cognitivist solution to the resulting embedding problem. It commits to a specific, well-motivated position as requested.
