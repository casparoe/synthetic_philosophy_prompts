  The user's instinct is correct: pragmatics giving assertion its content is precisely why the distinction matters morally for many theorists. And their legal skepticism is justified - the article oversimplifies. Overall, while engaging for lay readers, specialists would find the argument tendentious in dismissing alternative moral frameworks and overgeneralizing legal/Kantian views. 

  For the user's essay, they could productively cite this as a provocative but imperfect challenge to philosophical orthodoxy, highlighting where it conflates descriptive and normative claims. The psychology angle might be worth exploring further as empirical support for the "moral equivalence" view they oppose in their own work.
answer: |-
  Your instinct is largely right: while the passage captures some surface features of the lying/misleading debate accurately, its central argument oversimplifies key philosophical positions and leans on contested premises about the ethics of assertion. Specialists would see it as a provocative but tendentious challenge rather than a fair summary. Let’s walk through it step by step.

  The opening distinction between lying (asserting what you believe false) and misleading (uttering truths to imply falsehoods) is broadly accepted as a *descriptive* starting point in the literature (e.g., Saul, Stokke, Adler). Most would agree it marks a difference in kind linguistically or conceptually, though some (like Saul) argue this doesn’t entail a *moral* difference in kind. Where the passage stumbles is in claiming this distinction is "of no moral use whatever." This is hyperbolic and depends entirely on the premise that the *sole* wrong in lying is causing false belief. Many defenders of the distinction reject this. For instance, Seana Shiffrin argues lying violates a distinctive duty of fidelity in assertion itself, independent of outcomes. Similarly, Thomas Carson and others contend that misleading preserves respect for the hearer’s rational autonomy in a way lying does not, since it allows them to draw their own inferences. The passage’s reduction of the wrong to "get[ting] your hearer to believe something false" ignores these deontological and autonomy-based accounts.

  The move from "assertion is fixed by pragmatics" to "the distinction collapses morally" is precisely where your instinct kicks in correctly. Pragmatics *does* define what is asserted (via context, speaker intention, and reasonable interpretation), but this doesn’t dissolve the moral distinction—it *grounds* it. When you mislead, you exploit pragmatics to avoid asserting falsehood directly, which defenders argue shifts the epistemic responsibility to the hearer. Jennifer Lackey’s work on norms of assertion, for instance, suggests that asserting p triggers unique epistemic duties (e.g., knowledge or justification requirements) that merely implying p does not. The passage’s "articulate speaker" loophole is real but overstated; misleading often requires more cognitive effort, carries higher risks of failure, and may signal bad faith differently (see Paul Faulkner on assurance). It’s not merely a "grammatical" trick for the eloquent.

  The legal claim is partially backwards. While fraud often hinges on overall deception (e.g., "false pretences"), perjury law *does* require a literally false statement under oath. The Supreme Court’s *Bronston v. United States* (1973) explicitly held that evasive but literally true answers (e.g., answering "I have a savings account" when asked about assets, omitting foreign accounts) are not perjury, even if misleading. Federal perjury statutes demand falsity of the statement itself, not just the impression. So the passage overgeneralizes legal doctrine.

  The Kant interpretation is contested but common. Yes, Kant’s prohibition targets "untruthful declaration" (*declaratio falsa*), and his notorious "murderer at the door" example suggests he might condemn misleading too. But scholars like Christine Korsgaard and Allen Wood argue Kant’s emphasis on the *duty of veracity* focuses on the integrity of assertion itself; misleading, while deceptive, doesn’t corrupt language in the same way. The passage’s take is a standard but not unanimous reading.

  The psychological claim about equal blame is plausible but needs citation. Work by Turri and Turri, Wiegmann et al., and others does suggest ordinary people often judge lying and misleading similarly when intentions and outcomes match. However, some studies (e.g., Arico and Fallis) find subtle differences in perceived trustworthiness. The passage’s conclusion that "anyone who thinks otherwise is supplying cover for the eloquent" is polemical—defenders of the distinction argue it’s about moral principles, not excusing dishonesty.

  **Overall**: The piece is engaging for a general audience and rightly challenges complacency about the moral significance of the distinction. But to specialists, it reads as tendentious. It glosses over nuanced defenses of the distinction (e.g., Shiffrin, Carson, Fallis), misrepresents legal doctrine on perjury, and assumes a purely consequentialist view of lying’s wrongness that many reject. Your essay could cite it as a bold challenge to orthodoxy but should note its oversimplifications—particularly its conflation of *causing false belief* (which lying and misleading share) with *how* that result is achieved (which defenders argue carries distinct moral weight). It’s a foil, not a knockout punch.
