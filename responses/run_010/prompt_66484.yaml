  ### Exam Question: Least-Harm Argument in Animal Agriculture

  **Stem:**  
  The "least-harm" argument in animal ethics posits that certain agricultural systems minimize harm to wild animals. Using the dataset below, analyze this claim under two ethical stipulations. All calculations must be shown, and interpretations should be concise.  

  **Data for 1 hectare of land:**  
  - **Wheat (annual row-crop):**  
    - Annual mouse deaths from tillage/harvest: 14  
    - Annual yield: 45 million human-edible kilocalories (kcal)  
    - One-time mouse deaths from converting pasture to wheat: 25 (ploughing cost)  
    - Peak mouse population: 200  
  - **Pasture (grass-fed beef):**  
    - Annual mouse deaths: 2  
    - Annual yield: 1.5 million human-edible kcal  
    - Mouse population: 40  

  **Part (a) (10 marks):**  
  Assume each mouse death causes a loss of 1 welfare unit (no other welfare impacts).  
  1. Calculate the welfare cost per million kcal for existing wheat and pasture systems (ignore conversion).  
  2. A farmer considers converting 1 hectare of permanent pasture to wheat. Calculate the total welfare cost of producing 45 million kcal via:  
     - **Option A:** Convert to wheat and harvest for *T* years (yield: 45 million kcal/year).  
     - **Option B:** Keep as pasture (yield: 1.5 million kcal/year).  
  3. Determine the time horizon *T* (in years, *T* ≥ 1) for which Option A has a lower welfare cost than Option B. Explain.  
  4. Interpret: Does the least-harm argument favor beef consumption *or* land-use decisions here? Justify.  

  **Part (b) (10 marks):**  
  Now assume mouse lives are net-negative. Each death is a *gain* of 1 welfare unit (ends suffering), and each living mouse causes a *loss* of 1 unit/year (due to suffering).  
  1. Calculate annual welfare impact per million kcal for existing wheat and pasture (ignore conversion).  
  2. For producing 45 million kcal, compare total welfare over *T* years for:  
     - **Option A:** Convert pasture to wheat.  
     - **Option B:** Keep as pasture.  
  3. Does this stipulation imply that the "most lethal" agriculture is best? Why?  
  4. What must be added to the ethical framework to prevent a reductio ad absurdum (e.g., endorsing maximally lethal systems)? Briefly explain.  

  ---

  ### Model Answer (700 words)  
  **Part (a):**  
  1. **Welfare cost per million kcal (existing systems):**  
     - Wheat: Annual deaths = 14. Yield = 45 million kcal.  
       Cost = \( \frac{14}{45} \approx 0.311 \) deaths per million kcal.  
     - Pasture: Annual deaths = 2. Yield = 1.5 million kcal.  
       Cost = \( \frac{2}{1.5} \approx 1.333 \) deaths per million kcal.  

  2. **Total welfare cost for 45 million kcal:**  
     - **Option A (Convert to wheat):**  
       - Conversion cost: 25 deaths (one-time).  
       - Annual cost: 14 deaths/year for *T* years.  
       - Total deaths for *T* years: \( 25 + 14T \).  
       - Total yield: \( 45T \) million kcal.  
       - To produce 45 million kcal, set yield = 45: \( 45T = 45 \) → \( T = 1 \).  
       - Cost for 45 million kcal: \( 25 + 14(1) = 39 \) deaths.  
     - **Option B (Keep as pasture):**  
       - Yield = 1.5 million kcal/year.  
       - Years needed for 45 million kcal: \( \frac{45}{1.5} = 30 \) years.  
       - Total deaths: \( 2 \times 30 = 60 \) deaths.  

  3. **Time horizon for Option A < Option B:**  
     Compare costs: \( 25 + 14T \) (Option A) vs. \( 2 \times \frac{45}{1.5} = 60 \) (Option B).  
     Solve \( 25 + 14T < 60 \) → \( 14T < 35 \) → \( T < 2.5 \).  
     Since \( T \) must be an integer ≥ 1: **\( T = 1 \) or \( T = 2 \)**.  
     - At \( T = 1 \): Option A = 39 deaths, Option B = 60 deaths → A better.  
     - At \( T = 2 \): Option A = 25 + 14(2) = 53 deaths, Option B = 60 deaths → A better.  
     - At \( T = 3 \): Option A = 25 + 14(3) = 67 > 60 → B better.  
     **Conclusion:** Option A (wheat) has lower welfare cost for \( T = 1 \) or \( 2 \).  

  4. **Interpretation:**  
     The least-harm argument favors wheat over beef only for short time horizons (\( T \leq 2 \)) when converting pasture. Crucially, this is a **land-use conclusion**: It discourages *ploughing existing grassland* due to the one-time conversion cost (25 deaths). It does *not* endorse beef consumption generally, as existing pasture has higher per-kcal harm (1.333 deaths/million kcal) than existing wheat (0.311 deaths/million kcal).  

  **Part (b):**  
  1. **Annual welfare per million kcal (existing systems):**  
     - Welfare = (Deaths gain) - (Living mice loss).  
     - Wheat: Deaths = +14, Living mice = -200. Welfare = \( 14 - 200 = -186 \).  
       Per million kcal: \( \frac{-186}{45} \approx -4.133 \).  
     - Pasture: Deaths = +2, Living mice = -40. Welfare = \( 2 - 40 = -38 \).  
       Per million kcal: \( \frac{-38}{1.5} \approx -25.333 \).  

  2. **Total welfare for 45 million kcal over *T* years:**  
     - **Option A (Convert to wheat):**  
       - Year 1: Conversion deaths = +25, Operations = +14, Living wheat mice = -200. Welfare = \( 25 + 14 - 200 = -161 \).  
       - Subsequent years: Annual welfare = \( 14 - 200 = -186 \).  
       - Yield in Year 1: 45 million kcal.  
       - For 45 million kcal (only Year 1 needed): Total welfare = **-161**.  
     - **Option B (Keep as pasture):**  
       - Annual welfare = \( 2 - 40 = -38 \).  
       - Years needed: 30. Total welfare = \( -38 \times 30 = -1140 \).  
     **Comparison:** -161 (Option A) > -1140 (Option B), so Option A has higher welfare (less negative).  

  3. **Most lethal agriculture?**  
     Yes. Systems with high deaths (gain) and/or low living populations minimize welfare loss. For example, a system killing 200 mice/year with 200 living mice would have welfare = \( 200 - 200 = 0 \) (better than wheat at -186 or pasture at -38). Maximizing lethality reduces net suffering by ending more net-negative lives.  

  4. **Preventing reductio:**  
     We must add that **causing net-negative lives is impermissible**. The reductio arises from assuming we should create and then end net-negative lives (e.g., breeding mice to kill them). The framework should prioritize *avoiding the creation* of suffering beings, not merely maximizing lethality. This implies minimizing carrying capacities (e.g., preferring systems with fewer wild animals) and rejecting intentional harm.  

  ---

  ### Marking Scheme (20 marks total)  
  **Part (a) (10 marks):**  
  1. **Per-kcal cost for existing systems (2 marks):**  
     - Wheat: \( 14 / 45 \approx 0.311 \) (1 mark).  
     - Pasture: \( 2 / 1.5 \approx 1.333 \) (1 mark).  
     - *Typical error: Incorrect division (e.g., 45/14) or omitting units.*  

  2. **Conversion and production costs (3 marks):**  
     - Option A: \( 25 + 14T \) (1 mark).  
     - Option B: 60 deaths (1 mark; from \( 30 \times 2 \)).  
     - *Typical error: Treating conversion cost as annual or ignoring yield scaling for pasture.*  

  3. **Time horizon (3 marks):**  
     - Inequality \( 25 + 14T < 60 \) → \( T < 2.5 \) (1 mark).  
     - Correct integer solutions: \( T = 1, 2 \) (1 mark).  
     - Conclusion: A better for \( T \leq 2 \) (1 mark).  
     - *Typical error: Solving \( 25 + 14 < 2T \) or missing T constraints.*  

  4. **Interpretation (2 marks):**  
     - Land-use (avoid conversion), not dietary (1 mark).  
     - Justification: Conversion cost dominates short-term (1 mark).  
     - *Typical error: Concluding "beef is better" because 2 < 14, ignoring yield/conversion.*  

  **Part (b) (10 marks):**  
  1. **Per-kcal welfare for existing systems (2 marks):**  
     - Wheat: \( (14 - 200)/45 = -186/45 \approx -4.133 \) (1 mark).  
     - Pasture: \( (2 - 40)/1.5 = -38/1.5 \approx -25.333 \) (1 mark).  
     - *Typical error: Only counting deaths (gain) or living mice (loss).*  

  2. **Conversion/production welfare (3 marks):**  
     - Option A: Year 1 = \( 25 + 14 - 200 = -161 \) (1.5 marks).  
     - Option B: \( -38 \times 30 = -1140 \) (1.5 marks).  
     - *Typical error: Forgetting living mice in conversion year.*  

  3. **Most lethal systems (2 marks):**  
     - Yes, due to gains from death (1 mark).  
     - Explanation: Higher lethality → more suffering ended (1 mark).  
     - *Typical error: Claiming lethality is irrelevant.*  

  4. **Framework fix (3 marks):**  
     - Must reject *causing* net-negative lives (1 mark).  
     - Explain: Avoid creating suffering beings (1 mark).  
     - Link to reductio: Prevents "breed to kill" absurdity (1 mark).  
     - *Typical error: Only balancing death-gain and life-cost.*  

  ---

  ### A-versus-B Discriminator  
  - **A-grade (18–20):**  
    Correctly calculates all values, identifies the land-use conclusion in (a), and in (b) recognizes the reductio and resolves it by rejecting the creation of net-negative lives.  
  - **B-grade (14–17):**  
    Minor errors (e.g., arithmetic), but identifies core insights. Fails to fully resolve the reductio in (b) or misattributes the land-use conclusion in (a).  
  - **C/D-grade (≤13):**  
    Fundamental errors (e.g., comparing per-hectare deaths without yield, treating conversion as annual, or missing the net-negative lives paradox in (b)).
