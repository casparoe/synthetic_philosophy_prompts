prompt: |-
  So, quick context: I'm a junior and this year I've got a seat on my university's Campus Dialogue Fund panel — small pot of money, student orgs apply, six of us read the applications and vote. I'm also taking a seminar in moral psychology this term, which is probably why this one application has been rattling around in my head all week instead of getting written up. I'm supposed to circulate an opinion piece to the panel before we vote and I want it to actually be good rather than just vibes. Can you draft it for me?

  The application: a student org wants about $4,000 to run four structured conversations this spring about the campus fight over divestment. Their method is the part that matters. Before each event, attendees fill out a short online survey that is basically a knockoff of the moral foundations questionnaire — care/harm, fairness/cheating, loyalty/betrayal, authority/subversion, sanctity/degradation. Then the organizers prepare two versions of each side's opening statement: one leaning on care and fairness, one leaning on loyalty, authority and purity. Each attendee is quietly handed the version matched to their own survey answers. Nobody is told this happened. The handout doesn't mention tailoring, and when people ask, facilitators say everyone got the same packet. Their pilot (38 people, two events last fall) found that attendees who got the matched handout rated the opposing speaker as noticeably more reasonable and were more likely to say they'd shifted their view somewhat, compared to a control group that got a neutral summary of both sides. They also offer to post both handouts side by side on their website after each event.

  Their justification in the proposal is its basically Haidt: if people's moral intuitions run on different foundations, then making your case in a foundation the other person doesn't weight isn't a neutral choice, it's just failing to communicate — so tailoring the frame is what turns two monologues into an actual conversation. They insist it can't be manipulation because nothing is added or hidden: same facts, same claims, same argument structure, only which foundation the emphasis lands on.

  Two panelists have already dug in and I have to address both.

  - One wants to fund it, and wants the memo to go further: she says the whole exercise shows moral foundations theory is right that there's no single correct set of moral concerns, that the left has the narrower palate, and that a dialogue fund should stop pretending otherwise.
  - The other wants to reject it. Two reasons: (a) quietly sorting individuals into frames based on a psychometric profile is manipulation regardless of what's in the packet, and (b) if tailored framing can make a true claim more persuasive it can make a false one more persuasive too, and nobody on this panel is going to be checking which framing got stapled to which statistic. He also thinks the premise is wobbly — that liberals score low on the binding foundations partly as an artifact of how the items are worded, and that you can get liberals to endorse loyalty/authority/purity items if you rephrase them.

  Our fund's charter says we may only support activities that are "open to all students and transparent in their methods." Nobody on the panel agrees on what that second clause means and honestly I think it's doing most of the work in this case.

  So: draft the memo I'll circulate. The bottom line has to be clear — fund it, reject it, or fund it with conditions — and if it's conditions, make them conditions we could actually enforce and the org could plausibly accept, with a timeline (we vote Wednesday, their first event is five weeks out). Take the strongest version of the loosing side seriously instead of strawmanning it. And I specifically want it to deal with two things that keep coming up in our email thread: whether "we didn't change the content, only the framing" is a real distinction or a dodge, and whether a descriptive claim about how moral psychology works can carry a normative claim about what we should say to people — that's the move both the org and the first panelist are making, just in opposite directions. No citations or reading list please, it's a short document for a student panel and just needs to stand on its own reasoning. Around 800 words is plenty.
reasoning: |-
  Okay, the user is a junior university student serving on a Campus Dialogue Fund panel. They need help drafting an opinion memo about a contentious funding application. The student organization wants $4,000 for structured conversations about campus divestment, using a method based on moral foundations theory. They plan to tailor opening statements to attendees' moral foundations profiles without disclosure. 

  The user has two opposing panelists to address: one who enthusiastically supports funding (arguing this proves moral foundations theory and challenges liberal bias), and one who wants rejection (citing manipulation concerns and framing dangers). The user must navigate a charter requiring "transparent methods" while producing a decisive recommendation.

  Hmm... several layers here. First, the practical need: a clear, balanced memo under 800 words that resolves the funding question. But deeper needs emerge too - they're wrestling with ethical philosophy from their moral psychology seminar, indicating they want this memo to reflect rigorous thinking beyond "vibes." The unspoken tension is between idealism (wanting dialogue to work) and skepticism (fearing manipulation).

  Key issues to tackle: 
  - The transparency/clandestine operation conflict
  - Whether "framing vs content" distinction holds water
  - If descriptive psychology can dictate normative practices
  - How to handle panelists' extreme positions

  The tailored framing method is fascinating but problematic. While the pilot data shows promise, the secrecy is a red flag - both ethically and under their charter. Interesting how the supporter uses this to push an ideological agenda about liberal "narrowness," while the objector raises valid points about weaponizable techniques. 

  For the memo structure: opening should state the dilemma clearly. Then analyze strengths (innovative method, pilot results) and weaknesses (transparency breach, normative leap). The "framing vs content" question needs nuance - yes it's a real distinction, but not an ethical carte blanche. On descriptive-to-normative leap, must emphasize that "how minds work" doesn't automatically mean "how we should engage them."

  Recommendation should split the baby: fund with major transparency conditions. Demand upfront disclosure, optional participation, and post-event material publication. This respects the charter while allowing experimentation. Need to shut down both panelists' overreaches - no endorsing moral foundations as absolute truth, no ignoring manipulation risks. 

  The user's anxiety about doing this right is palpable. They're not just writing a memo - they're mediating campus values. The tone must be principled but not preachy, decisive but open-minded. Most importantly, it must protect students from feeling experimented upon without consent.
answer: |-
  ## MEMORANDUM: Funding Recommendation for "Moral Foundations Dialogue Project"

  **TO:** Campus Dialogue Fund Panel  
  **FROM:** [Your Name], Student Panelist  
  **DATE:** [Date]  
  **SUBJECT:** Recommendation on Divestment Dialogue Series Application  
  **RECOMMENDATION:** FUND WITH CONDITIONS (details below)

  This application presents a fascinating and challenging case at the intersection of dialogue methodology, moral psychology, and our fund's mandate. While the proposed project offers a potentially innovative tool for bridging divides, significant ethical and procedural concerns demand specific conditions before funding can be approved. Below is my analysis addressing the core issues raised by colleagues and the proposal itself.

  ### 1. Assessing the Proposed Method: Framing vs. Content & Efficacy
  The organization argues their tailoring is solely about "framing," not altering "content" (facts, claims, structure). **This *is* a meaningful distinction, but its ethical weight depends entirely on context and disclosure.**

  *   **The Distinction is Real:** Framing *how* an argument is presented – which values it appeals to, what aspects are emphasized – while preserving core facts and logical structure, is a recognized communication strategy. It aims to make existing content resonate, not invent new claims or hide inconvenient truths. The pilot data suggesting increased perceived reasonableness and openness to shift is promising.
  *   **But Framing Isn't Neutral:** As the opposing panelist rightly notes, framing *can* powerfully influence perception. A frame that resonates deeply can make a weak argument seem stronger or a strong one seem irrefutable. The risk of effective framing being applied to misleading *content* elsewhere is a valid general concern, though not a direct indictment of *this* project's specific content (which focuses on existing campus arguments).

  ### 2. The Central Ethical Concern: Transparency and Manipulation
  The core objection hinges on the *clandestine* tailoring based on a psychometric profile. **This is the project's most significant vulnerability and the primary point of conflict with our "transparent methods" requirement.**

  *   **Manipulation Concerns are Valid:** Withholding information about the tailoring – and actively denying it ("everyone got the same packet") when asked – fundamentally undermines informed participation. Attendees cannot properly evaluate the information they receive or the process they engage in if they are unaware a key variable (which version they saw) was determined by their survey responses. This creates a power imbalance and feels experientially deceptive, regardless of the "same facts" argument. It treats participants as subjects in an undisclosed experiment.
  *   **"Transparent Methods" Requirement:** Our charter likely intends for participants to understand the *core mechanisms* shaping the dialogue they join. The current methodology fails this test. Transparency isn't just about the final output (posting both handouts later), but about the process experienced *by* the participants.

  ### 3. The Descriptive vs. Normative Leap
  The organization (and the supportive panelist) uses Moral Foundations Theory (MFT) descriptively (this is how people *do* differ morally) to justify a normative practice (this is how we *should* frame arguments for dialogue). **This leap requires careful handling.**

  *   **Descriptive Doesn't Dictate Normative:** Even if MFT accurately describes psychological tendencies, it doesn't automatically prescribe that clandestine tailoring is the *right* or *only* way to foster dialogue. Other approaches (e.g., explicitly discussing framing differences, multi-foundation arguments) exist. The supportive panelist's claim that this "proves" the left has a "narrower palate" or that there's "no single correct set of moral concerns" is an *interpretation* and *evaluation* beyond the data. Funding this project does not require endorsing these broader ideological claims about MFT's supremacy or political implications. The project's value lies in testing a *communication tactic*, not validating a specific worldview.

  ### 4. Addressing Panelist Concerns
  *   **Supportive Panelist's Broader Claims:** While the pilot data is interesting, it does not conclusively "prove" MFT's absolute validity, the irrelevance of other moral frameworks, or inherent political limitations. Funding should be based on the project's potential to foster constructive dialogue *on campus divestment*, not on endorsing a specific psychological theory's normative implications. The claim about wording artifacts in MFT surveys is noted; this is an ongoing academic debate but doesn't negate the potential utility of the *tactic* being tested if ethical concerns are addressed.
  *   **Opposing Panelist's Core Objections:** The manipulation concern, rooted in the lack of transparency, is compelling and must be addressed. The risk of framing being used for false claims is a broader societal issue relevant to media literacy but isn't a specific reason to reject *this* application, provided the actual content presented remains factual and representative of campus arguments (which we must assume absent evidence otherwise).

  ### Recommendation: Fund with Strict Conditions
  The potential for this method to improve dialogue is significant enough to warrant support, but **only if the fundamental issue of participant transparency and autonomy is resolved.** Therefore, I recommend funding **$4,000** contingent on the following modifications, to be confirmed in writing by the organization **before disbursement (deadline: 1 week before first event)**:

  1.  **Explicit Upfront Disclosure:** Attendees must be informed *before registering or upon arrival* that:
      *   The pre-event survey helps tailor the introductory materials they receive to different moral perspectives.
      *   They will receive *one version* of the opening statements handout, selected based partially on their survey responses.
      *   *All* versions of the handouts will be available publicly online after the event.
  2.  **Opt-In Mechanism:** Participation in the survey must be presented as *optional* for receiving a tailored handout. Attendees must be able to choose to receive a *neutral summary* (the control version from the pilot) or perhaps *both* tailored versions, without penalty to their participation.
  3.  **Facilitator Honesty:** Facilitators must be instructed to answer questions about the handouts truthfully. They must acknowledge tailoring is happening and direct participants to the public posting of all materials.
  4.  **Public Posting Confirmation:** The commitment to post both handouts side-by-side promptly after each event must be binding.

  **Why these conditions?** They directly address the "transparent methods" breach by ensuring participants understand the core mechanism affecting their experience and grant them agency via an opt-in. They eliminate the deceptive element while preserving the core experimental approach of matching frames. The organization's justification – that framing matters for communication – can still be tested ethically under these conditions. If they reject these conditions, the project remains ethically problematic under our charter, and funding should be denied.

  ### Bottom Line
  The project's innovative approach to overcoming moral divides deserves exploration. However, its current methodology violates the principle of transparent engagement essential for genuine campus dialogue and our fund's mandate. By implementing the required transparency and consent measures, the project can proceed ethically, testing its core hypothesis while respecting participants. I urge the panel to support funding **only** if these critical conditions are met.
