answer: |-
  ## The Consistency Broker

  The fluorescent lights of the Cordic Mutual Accord Pilot clinic in Merriam Falls hummed like captive insects. Dale, hunched over his temporary desk in a converted supply closet designated ‘Adjudication Oversight’, massaged his temples. Piles of the damn forms – Form 1 and its smaller, denser sibling, Form 2 – mocked him from mismatched trays. The Accord Pilot: a grand experiment in ‘member engagement’ or bureaucratic purgatory? Tonight, it felt like the latter.

  Outside his flimsy door, the waiting room held its usual tense quiet. Coughs punctuated the silence, magazines rustled with restless energy. Dale’s gaze drifted past the receptionist’s plexiglass shield and snagged on a familiar tableau near the corner vending machine. Renata Ostrowski. Again. She wasn’t hunched in anxious anticipation like the others. She sat upright, almost regal, on a hard plastic chair, a worn leather satchel at her feet. Before her sat a woman Dale vaguely recognized – Mrs. Gable, maybe? – clutching a clipboard, her knuckles white. Renata spoke softly, gesturing towards the papers. The woman nodded, her expression shifting from confusion to something resembling relief. Renata took the clipboard, uncapped a pen with deliberate calm, and began filling something out. Form 1, Dale noted. The big one. She handed it back. A few bills changed hands, tucked discreetly into Renata’s satchel. Mrs. Gable scurried towards the intake window.

  *Selling consistency*, Dale thought, the phrase sour in his mouth. He’d seen her pattern emerge over weeks. Renata wasn’t filling out her *own* forms repeatedly; she was filling out Form 1 *for others*. And somehow, whatever she did, it always seemed to align with whatever those individuals then filled out on Form 2 themselves, ensuring they weren’t defaulted to Cordic’s opaque ‘cost model’ rider. She was gaming the system’s obsession with internal logic, turning it into a cottage industry.

  He pulled Mrs. Gable’s freshly submitted Form 1. Renata’s neat, blocky handwriting filled Box (b): *$500,000 if complication occurs AND independent panel draws case in lottery (1-in-10 chance), otherwise $0*. The gamble. Dale sighed. He’d have to wait for Form 2 to see if Renata’s magic held.

  Later, Dale took his break in the dimly lit staff kitchenette. Renata was there, leaning against the counter, sipping terrible coffee from a foam cup. Her eyes, sharp and assessing, met his.

  “Mr. Dale,” she greeted, her voice low and steady. “Keeping the wheels of Accord turning?”

  “Trying, Ms. Ostrowski,” he replied, filling his own cup. “Though some wheels seem… greased.”

  She smiled faintly. “People get confused. The forms are… abstract. Especially the little one.”

  “Form 2? It’s structured exactly like Form 1,” Dale countered. “Just… condensed. The options are identical in shape, just smaller numbers.”

  Renata nodded. “Exactly. Same shape. But the numbers *aren’t* the same. A hundred thousand dollars isn’t five thousand dollars. A half-million isn’t twenty-five thousand. The stakes shrink, but the *demand* Cordic places on your insides… your consistency… that stays rigid. It’s like they expect your gut feeling about life-altering money to scale perfectly down to what might cover a month’s rent or a used car repair.”

  Dale stirred powdered creamer. “The rule exists for a reason. To identify… genuine preference.”

  “Genuine preference?” Renata’s laugh was short, dry. “Preference for *what*? For Cordic’s bottom line? Their ‘cost model’ default pays out less than either option, everyone knows that. It’s a punishment for failing their little logic test.” She set her cup down. “Take Mrs. Gable, earlier. Knee replacement. Terrified. The flat hundred thousand payout on Form 1? That’s peace of mind for her kids if something goes catastrophically wrong. But five thousand flat on Form 2? That’s a drop in the bucket compared to the deductibles, the lost wages. The *chance* at twenty-five thousand? That feels worth the tiny gamble. It’s not inconsistency, Mr. Dale. It’s *context*. Her need shifts with the scale. Cordic’s rule calls that irrational. I call it human.”

  Dale felt the familiar internal tug. The Accord Pilot manual was clear: mismatched choices indicated ‘failure to express a preference’, triggering the default. Renata’s argument had a perverse logic. “And your service? Providing… consistent context?”

  “I provide what Cordic demands: alignment. People know what they *want*. They just can’t always navigate Cordic’s arbitrary maze to get it recorded. They want the flat safety net for the big one? Fine, I initial Box (a) for them on Form 1. They know they’ll pick the flat $5000 on Form 2 themselves because they need that certainty now, for the immediate costs. Or vice versa. I just… ensure the pattern matches. They pay for certainty in an uncertain process. I get compensated for understanding the rules Cordic wrote.”

  “It’s fraudulent,” Dale stated, though it sounded weaker than he intended.

  Renata’s gaze didn’t waver. “Is it? I’m writing exactly what the member *wants* recorded for Form 1. They sign it. They attest. Cordic gets its precious consistent pattern. The member avoids the punitive default. Who loses? Cordic gets the data point their rule requires. Seems efficient.”

  Before Dale could formulate a rebuttal, his pager buzzed. Urgent adjudication needed. He left Renata by the coffee machine.

  Back in the closet, a fresh crisis awaited. Mr. Henderson, a stoic mechanic facing bypass surgery, sat fuming opposite Dale’s desk, his wife clutching his arm.

  “Explain this!” Henderson slammed a letter onto Dale’s desk. “Denied! Says I didn’t express a preference! I filled your damn papers!”

  Dale pulled Henderson’s file. Form 2: Box (c) initialed. *Flat $5,000*. Form 1: Box (b) initialed. *$500,000 lottery*. Mismatch. Default applied.

  “Mr. Henderson,” Dale began gently, “the forms require aligned choices. You selected the guaranteed payout on Form 2, but the lottery option on Form 1. The system interprets that…”

  “Interprets?” Henderson’s face flushed crimson. “I *told* you what I wanted! On the big one, for my family, I want the *chance* at the big money! Why not? It’s a long shot, but it’s something! On the small one, five grand flat? That’s real money *now*, for the bills, for the time off! Makes perfect sense! Who wouldn’t?!”

  His wife nodded fiercely. “It does! We talked about it! Flat for the small, chance for the big! How is that not a preference?”

  Dale looked at the forms. Henderson’s reasoning echoed Renata’s unsettlingly. It *felt* like a preference. A distinct, context-driven choice. But Cordic’s rule, etched into the adjudication software, saw only deviation. Failure. It demanded consistency across scales Henderson experienced as fundamentally different.

  “I understand it feels that way, sir,” Dale said, feeling like a traitor to sense. “But the Accord Pilot rules define ‘expressed preference’ as consistency between the two forms. Selecting different types of options – guaranteed versus lottery – triggers the default rider.”

  “Default?” Henderson spat. “Which is worse than both, right? That’s what everyone says! So I’m punished for making sense?!”

  “The default rider is determined by Cordic’s standard actuarial model,” Dale recited, the words tasting like ash. “It aims for cost-effectiveness…”

  “Cost-effective for *you*!” Henderson surged to his feet. “My surgery’s next week! You think I can afford this co-pay *and* lose out on that payout rider? I need that five thousand guaranteed!”

  “I’m sorry, Mr. Henderson. The determination is final based on the forms submitted.” Dale couldn’t meet his eyes. “You can appeal, but…”

  Henderson didn’t wait for the rest. He snatched the denial letter, his wife close behind, their anger a palpable wave crashing out of the cramped office.

  Dale slumped back. The hum of the lights felt accusatory. He pulled Renata’s earlier handiwork: Mrs. Gable’s Form 2 had just been processed. She’d chosen Box (d) herself: *$25,000 lottery*. Paired with the Box (b) lottery Renata had filled on Form 1. Perfect alignment. Approved. She’d paid Renata to *ensure* she got the lottery recorded for the big payout, while she herself chose the lottery for the small one. Consistent. Cordic’s rule was satisfied. Mrs. Gable would get her knee replaced with the rider she *wanted* recorded, the gamble she apparently preferred at both scales. Henderson, who had made a different, perhaps equally rational choice based on his own context, was penalized.

  He found Renata packing her satchel near the exit. The waiting room was emptying.

  “Henderson,” he said, his voice flat.

  Renata paused, zipping the bag shut. “Ah. Box (b) on Form 1, Box (c) on Form 2?”

  Dale just nodded.

  Renata’s expression wasn’t triumphant. It was weary. Resigned. “He didn’t come to me. Thought he understood. Thought his choice *was* a preference. Cordic disagreed.” She slung the satchel over her shoulder. “He could have paid my fee. Avoided the default. Gotten exactly what he wanted recorded. Instead, he pays Cordic’s price.”

  “Your fee,” Dale echoed. “For consistency.”

  “For navigating the rule,” she corrected softly. “The rule costs people, Mr. Dale. One way or another. I just make the cost visible, upfront, and let them choose which bill they pay. Henderson… paid Cordic’s bill tonight.” She looked towards the dark windows reflecting the harsh clinic lights. “He won’t be the last.”

  She pushed through the glass doors into the Merriam Falls night. Dale watched her go, then walked slowly back to his supply-closet purgatory. Henderson’s file lay open on the desk, the mismatched forms stark under the fluorescent glare. The denial letter rested beside them. Dale picked up his own pen, hovering over the ‘Appeal Received’ checkbox. He hesitated. Checking it meant paperwork, review, delay. Henderson’s surgery was imminent. The rule was clear. His own supervisor’s directives were clearer: uphold the protocol. The Accord Pilot required clean data.

  He looked at Form 2, Henderson’s decisive ‘c’ for the flat $5,000. He looked at Form 1, the hopeful, defiant ‘b’ for the half-million chance. Two choices, made separately, reflecting two different weights of worry. Renata’s words echoed: *It’s context. Her need shifts with the scale.*

  Dale’s finger tightened on the pen. He reached for the phone to initiate an appeal, then stopped. The cost wasn't just Henderson's. An appeal flagged in the system. It meant scrutiny, questions about *his* adjudication. It meant potentially arguing against Cordic's sacred rule. He pictured Henderson's furious, betrayed face. He pictured Renata’s weary pragmatism. He pictured the pristine, aligned forms of Mrs. Gable, processed without a ripple.

  Slowly, deliberately, Dale put the pen down. He left the ‘Appeal Received’ box empty. He closed Henderson’s file and placed it firmly in the ‘Processed - Default Applied’ tray. The action felt like swallowing stone. He pulled the next file from the stack, the fluorescent hum settling back into his bones, the silence of the clinic a heavy shroud. The cost, tonight, was Henderson’s. And Dale’s own small measure of peace. The rule stood. Clean data prevailed. Outside, in the rust-belt dark, Renata Ostrowski walked towards the bus stop, her satchel holding the tools of a necessary, unsanctioned trade, one clipboard at a time.
