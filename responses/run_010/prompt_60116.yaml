prompt: |-
  I'm about two-thirds through a novel whose narrator is a decision theorist, and she's loosely based on my actual sister, who does this stuff for a living — so I've been sending my sister the cases the character chews on in each chapter, one at a time, mostly to stop myself writing her into a contradiction I can't fix later.

  Her verdicts so far, in the order I asked. Newcomb: take only the big box. The XOR blackmail letter: don't pay. Counterfactual mugging, coin already landed and it came up tails, so they want $100 from you that would have got you $10,000 had it come up heads: pay. Parfit's hitchhiker, driver's already dropped you in town: pay up, and don't pretend you were planning to all along. The smoking lesion guy: smoke. A one-shot prisoner's dilemma against a stranger you'll never see again and know nothing about, except that they're probably a normal person reasoning roughly the way you do: cooperate. And when I asked whether she'd ever sign off on different answers for "what you'd commit to in advance" versus "what you'd do once you're standing there," she said no, never, those two have to come out the same or you've got a broken agent.

  Now the last chapter, which I've allready half-written. My character gets a letter from a foundation that runs the mugging scheme at industrial scale: they flip a coin, they form their prediction by simulating her beforehand, and had it come up heads they'd have handed a large sum to some stranger picked at random. It came up tails, so they want $1,000 from her. She'll never meet or hear about that stranger, the foundation keeps no list of who paid and who didn't and never tells anyone, nothing about her reputation is in play anywhere, and I've written her as self-interested without being a monster. Pay or refuse — which way does my sister come down?

  Give it to me as exactly five numbered items, a couple of sentences apiece, nothing before or after the list: (1) the rules that fit every verdict above, named so I can tell them apart; (2) what each of those rules says about the foundation letter; (3) your best guess at her ruling and why you'd bet on it; (4) the one further case I could send her that would settle which rule she's really running; (5) if it's genuinely close, a way to write the scene so the novel holds up whichever answer she gives.
reasoning: |-
  Hmm, the user is writing a novel with a decision theorist narrator based on their sister. They've been sending decision theory cases to their actual sister (a professional in the field) for consistency checks. Now they need to resolve the final case involving a scaled-up counterfactual mugging from a foundation.

  Looking at the sister's previous verdicts:
  - Newcomb: Take only the big box (one-boxing)
  - XOR blackmail: Don't pay
  - Counterfactual mugging: Pay when coin lands tails
  - Parfit's hitchhiker: Pay after being driven
  - Smoking lesion: Smoke
  - Prisoner's dilemma: Cooperate with a similar stranger
  - And crucially: No separation between precommitment and action

  This pattern suggests either timeless decision theory (TDT) or updateless decision theory (UDT). Both handle acausal reasoning well, especially in cases like counterfactual mugging where paying maintains consistency across possible worlds.

  For the foundation case:
  - TDT would likely pay to maintain the agent's "logical" policy
  - UDT would pay as it follows the optimal strategy regardless of actual outcome

  Given the sister's insistence on precommitment/action consistency and her counterfactual mugging verdict, she'd almost certainly say PAY. The smoking lesion case confirms she rejects evidential reasoning when it conflicts with causal control.

  To definitively distinguish TDT vs UDT:
  - Propose a "transparent Newcomb" where the predictor's method is fully known
  - TDT would one-box if the prediction is logically dependent
  - UDT might two-box if the prediction is "black box" statistical

  For narrative flexibility:
  - If she pays: Show satisfaction in upholding her principles
  - If she refuses: Focus on the visceral unfairness while maintaining intellectual consistency

  The user needs exactly five numbered items without preamble or conclusion. I'll structure it as:
  1) Rules fitting all verdicts (TDT/UDT)
  2) Their recommendation for the foundation case
  3) Prediction (pay with 90% confidence)
  4) Test case to distinguish theories
  5) Dual-path writing approach
answer: |-
  (1) **Timeless Decision Theory (TDT)** or **Updateless Decision Theory (UDT)**: Both treat decisions as outputs of fixed, globally optimal policies across all counterfactual scenarios, ignoring information that "screens off" causal influence (like the coin outcome).  
  (2) **Both rules say PAY**: The foundation’s demand depends on their prediction of her policy. Refusing incentivizes the simulation to predict refusal, which could cost her the $10,000 in the heads world—so paying maximizes expected utility across branches.  
  (3) **She says PAY (90% confidence)**: Her counterfactual mugging verdict and insistence on precommitment/action consistency show she rejects "updating" on outcomes when it undermines acausal influence. The smoking lesion case confirms she prioritizes causal control over statistical evidence.  
  (4) **Transparent Newcomb with a fallible predictor**: Box B contains $1M iff the predictor *projected* you one-box. If you see a receipt proving they predicted two-boxing (so B is empty), do you one-box anyway? TDT says yes (uphold the one-boxing policy); UDT may allow two-boxing.  
  (5) **Ambiguity hinge**: If she pays, emphasize her commitment to "being the agent who gets rich in the other timeline." If she refuses, focus on her rejecting "paying to prop up a ghost"—stressing that no *real* $10,000 opportunity existed once tails landed.
