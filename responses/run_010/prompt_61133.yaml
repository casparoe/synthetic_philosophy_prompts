  The user's core hunch is that a "right-but-early" defense is only valid if the delay can be attributed to an independently identifiable countervailing factor whose magnitude could have been bounded beforehand. Otherwise, it's just an immunizing move when the timescale is a free parameter. I need to pressure-test this idea.

