  Now for the proposal structure. The research question should be sharp: "Under what conditions does attributing a predictive failure to temporal delay constitute a legitimate qualification rather than an immunising stratagem?" Existing positions like Lakatos's progressive/degenerating distinction are retrospective, while the user wants a prospective criterion. Duhem-Quine shows auxiliary hypotheses can always be adjusted, but doesn't provide tools to evaluate when such adjustments are legitimate pre-falsification.

  For the method, I'll outline sections:
