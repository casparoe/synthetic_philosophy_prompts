  The most obvious objection comes from Duhem-Quine: we can always invent new auxiliaries to explain delays, making it hard to distinguish legitimate from ad hoc factors. The user's criterion must address how to judge the "independently identified" and "magnitude-bounded" requirements *before* the outcome.

  Is there a better way to carve the distinction? Instead of just outcome vs. mechanism vindication, we could differentiate between:
  - Auxiliaries that constrain the timescale (legitimate)
  - Auxiliaries that leave it open-ended (immunizing)
