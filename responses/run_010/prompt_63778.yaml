prompt: |-
  I'm a retired population ecologist — 35 years running models, so I still think about everything in terms of initial conditions and whether a system is sitting in a shallow or a deep basin of attraction. Since I stopped working I've been reading philosophy instead of journals, and I just finished Philip K. Dick's The Man in the High Castle (the 1962 novel, please not the Amazon show, they diverge hard).

  Take the role of a professional philosopher of history who also knows alternate-history fiction properly. Before you answer, spend a few lines brainstorming two or three rival readings and then commit to one and defend it — I'd rather get one argued position than a survey.

  Here's the thing that won't let go of me. The novel's divergence point is a pure great-man counterfactual: one bullet kills Roosevelt in 1933 and the whole century tips over. Carlyle would have loved it. But almost nothing else in the book behaves that way. Hitler is offstage and syphilitic, Bormann drops dead mid-narrative, and the Reich doesn't skip a beat — the succession fight is a scramble between interchangable functionaries, and Wegener's whole point to Tagomi seems to be that whoever wins will do the same thing because the machine has to keep feeding itself. Then Abendsen's counter-history, the one where the Allies win, turns out to be just another empire, so even flipping the outcome leaves the structure standing.

  So which book is this really — a Carlylean one wearing structuralist clothes, or Spencer's reply to Carlyle (great men are what their society makes) dressed up as a 1933 assassination plot? Anchor it in scenes: the Zangara hinge, the Goebbels/Heydrich scramble and the plan to nuke Japan, Tagomi shooting the two SD men in his office and whatever happened to him afterwards, and the oracle's final verdict on which history is the true one. I especially want your view on whether Tagomi counts as a great man in any sense Carlyle would recognise, or whether he's the one place where an individual act bends reality rather than history.

  And be straight with me where the reading breaks down. My suspicion is the I Ching is doing work neither side has a category for — authorship of the best history gets handed to a randomising oracle, which looks to me like neither agency nor structure. If you agree, say what it is instead. Finish with what a novelist can settle about the would-there-have-been-a-Nazi-Germany-without-Hitler question that an argument between historians can't. No reading lists or citations please, I've got no way to check anything up.
