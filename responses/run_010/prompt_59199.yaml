  Hmm... this is quite sophisticated - they're clearly well-versed in analytic philosophy of collective intentionality. The constraints eliminate standard cases like corporate actions or planned collaborations. Needs to be watertight against Searle's we-intentions, Gilbert's joint commitments, and Bratman's shared cooperative activity models. 

