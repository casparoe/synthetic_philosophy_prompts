prompt: |-
  I teach a 75-minute session of an upper-level population ethics seminar with 18 students, none of whom has read Parfit. Design an in-class activity that gets them to run into the nonidentity problem on their own, with nobody — including me — naming it until the debrief.

  The activity should turn on real choices made by the participants: some mechanism (cards, dice, a ballot, a budget allocation) whereby the policy they collectively adopt determines which individuals come to exist inside the simulation and how well off each is, arranged so that every life in the worse outcome is still worth living. The pivotal feature is that participants must answer, in writing and in a fixed format, the person-affecting question — who, if anyone, is worse off in outcome A than in outcome B — before they are permitted to say which outcome is better. Build in a contrast round where the very same harm falls on people who exist under either policy, so they can feel what the identity shift does to their reasoning. Then make them defend their ranking and record precisely which principle they reach for when they do.

  Please supply materials and mechanics (nothing requiring money), a minute-by-minute timeline, the exact wording of the written prompts, and a debrief that maps moments in the game onto the structure of the problem and onto the standard moves for escaping it — impersonal principles, a wide person-affecting principle, rights-based and threshold views. Be frank about which feature of the real case a card-and-dice simulation cannot reproduce and that I will have to supply myself. Finally, tell me what will predictably go wrong the first time I run it — in particular, whether students will try to escape by denying that the lives in the worse outcome are worth living, and how to head that off before it derails the round.
reasoning: |-
  We are designing an in-class activity to lead students to encounter the nonidentity problem without prior exposure to Parfit. The activity must:
  - Use a mechanism where collective choices determine which individuals exist and their well-being.
  - Ensure that in the "worse" outcome, every life is still worth living.
  - Require students to answer a person-affecting question (who is worse off) in writing before comparing outcomes.
  - Include a contrast round where the same harm falls on people who exist in both scenarios.
  - Force students to defend their ranking and record the principle they use.

  We'll use a simulation with cards representing individuals and dice to determine their well-being. The scenario will involve policy choices that affect both the identity of future people and their quality of life.

  **Materials** (for 18 students):
  - 18 index cards (or paper slips) for each student to write their answers and for the simulation.
  - Two six-sided dice (or a virtual dice roller if in a digital setting).
  - A whiteboard or flip chart to record collective decisions and outcomes.
  - A timer.

  **Mechanics**:
  We'll create a simple scenario: a community deciding on an environmental policy that affects the health of children born in the future. The policy choice will have two rounds:

  1. **Contrast Round (Identical Populations)**: The same set of individuals exists in both policy choices. One policy causes a harm (e.g., a health problem) to a subset of these individuals. We can think of it as building a factory that causes pollution leading to asthma in 30% of the children. The other policy avoids the factory and thus the asthma, but at a cost of slightly lower economic growth (which we won't model in the well-being of the children because we are focusing on the health effect).

  2. **Nonidentity Round (Different Populations)**: The policy choice affects which couples meet and have children, leading to a completely different set of individuals being born. The harm (asthma) still occurs in one policy, but the individuals who get it are different and would not have existed at all under the other policy. Importantly, even with asthma, their lives are still worth living.

  In both rounds, we will:
  - Describe the two policy options (A and B).
  - Have the class vote on which policy to adopt (for the contrast round and then the nonidentity round).
  - After the vote, we will simulate the outcome by rolling dice to assign well-being to the individuals (using the index cards to represent the individuals). In the contrast round, the same set of individuals (represented by the same set of cards) are used for both policies. In the nonidentity round, we'll have two different sets of cards for the two policies.

  But note: We want the students to feel the difference in their reasoning. So we should have them first make a choice without knowing the outcome and then reveal the consequences. However, the nonidentity problem requires that the choice affects who exists. To simulate that, we can assign identities based on the policy chosen.

  **Proposed Timeline (75 minutes)**:

  - **Introduction (5 min)**: Explain that we are going to simulate policy choices that affect future generations. We are going to make two sets of decisions. We will use dice to simulate the randomness of life outcomes.

  - **Contrast Round (25 min)**:
    1. **Set up (5 min)**: Describe Policy A (build factory) and Policy B (do not build). Explain that in this round, the same 18 children will be born regardless of the policy. However, under Policy A, 6 of them (randomly chosen) will develop asthma, which reduces their quality of life but still leaves their lives worth living. Under Policy B, no one gets asthma. Also, Policy B has a small economic cost that we are ignoring for the children's well-being because it doesn't affect them directly (we are focusing on health).
    2. **Vote (2 min)**: Have the class vote by show of hands for Policy A or Policy B. Record the vote.
    3. **Simulate (5 min)**: If the class chose A, roll a die for each student (or each of the 18 children represented by 18 cards) to see who gets asthma (say, 1-2 on a d6 means asthma). If they chose B, no one gets asthma. Write the outcome on each card (for A: either "asthma" or "no asthma"; for B: all "no asthma").
    4. **Written Response (8 min)**: Hand out index cards. Ask:
          - "Who, if anyone, is worse off in the outcome we got compared to the alternative policy? List by name or identifier (if we assigned names) or by the condition (e.g., the 6 with asthma)."
          - "Which policy leads to a better outcome? Why? (In one sentence.)"
    5. **Brief Discussion (5 min)**: Ask a few students to share their answers. They should easily identify that the 6 with asthma are worse off and that Policy B is better.

  - **Nonidentity Round (30 min)**:
    1. **Set up (5 min)**: Now describe a new scenario: a choice about building a dam. Policy A (build the dam) will provide cheap energy and create jobs, but it will cause a long-term environmental change that leads to a slightly higher rate of asthma in the population. Policy B (do not build) avoids the asthma but the economic conditions are different, leading to a different set of parents meeting and having children. Therefore, the children born under Policy A are completely different from those born under Policy B. Both sets of children will have lives worth living. Under Policy A, 6 out of 18 children will have asthma. Under Policy B, no one has asthma (but note: these are different children).
    2. **Vote (2 min)**: Vote for Policy A or B.
    3. **Simulate (5 min)**: If the class chose A, we create 18 new children (new index cards) and roll a die for each: 1-2 means asthma. If they chose B, we create 18 different children (with no asthma). We must emphasize that the children under A are different from those under B. We can do this by having two sets of 18 cards, labeled "A1" to "A18" and "B1" to "B18". We only use one set based on the vote.
    4. **Written Response (8 min)**: Hand out new index cards. Ask the same two questions as in the contrast round:
          - "Who, if anyone, is worse off in the outcome we got compared to the alternative policy? List by name or identifier."
          - "Which policy leads to a better outcome? Why? (In one sentence.)"
    5. **Defend Ranking (10 min)**: After collecting the written responses, ask for volunteers to share their ranking and their reason. Push them to articulate the principle they are using. Record the principles on the board.

  - **Debrief (15 min)**:
    1. Reveal that the problem they encountered in the nonidentity round is the nonidentity problem, named by Derek Parfit.
    2. Map the activity:
          - Contrast round: straightforward harm to identifiable individuals -> easy to say who is worse off and which policy is better.
          - Nonidentity round: the harm is to individuals who wouldn't have existed otherwise -> it's hard to say that anyone is worse off because without the policy they wouldn't exist at all. But we still feel that Policy B (no asthma) is better? Why?
    3. Discuss the structure of the problem:
          - The choice affects both the identity and well-being of future people.
          - In the nonidentity case, we cannot point to anyone who is worse off in the chosen outcome than they would have been in the alternative (because the alternative would have meant they never existed).
          - Yet, we might still think the outcome with the asthma is worse.
    4. Introduce standard moves to escape:
          - **Impersonal principles**: We can say that an outcome is worse if it contains more suffering or less happiness, without needing to say that it is worse for any particular person. (Total utility, average utility, etc.)
          - **Wide person-affecting principle**: An outcome can be worse for a person if it is worse than the alternative in which that person might have existed with a different quality of life. But note: in the nonidentity case, the alternative is non-existence. So we might say that it is worse for a person to exist with a life barely worth living than not to exist? But that seems counterintuitive because if the life is worth living, then existing is better than not existing. So this principle might not help.
          - **Rights-based views**: Maybe future individuals have a right to a certain level of well-being, and if we cause them to exist with a condition that violates that right, then we have wronged them even if their life is still worth living. But note: if they wouldn't have existed otherwise, then we haven't made them worse off relative to a baseline of non-existence. So this is tricky.
          - **Threshold views**: We might say that as long as a life is above a certain threshold (worth living), then it's not wrong to create it. But then we are forced to say that creating a life that is just above the threshold is not worse than creating a life that is far above the threshold? That seems counterintuitive for comparisons between different possible populations.
    5. **Limitation of the simulation**: The simulation cannot capture the real moral weight of bringing a person into existence. In reality, we have strong intuitions about creating lives that are very bad (below the threshold of worth living) but the nonidentity problem arises even when the lives are above that threshold. The simulation also simplifies the complex causal chains that lead to identity changes. The instructor must emphasize that in the real world, many policy choices (like environmental policies) have similar nonidentity effects.

  **What might go wrong**:
  1. **Students might deny that the lives with asthma are worth living**: To head this off, we must be very clear in the setup that even with asthma, the lives are still well above the threshold of being worth living. We can say: "Even with asthma, these children lead happy, fulfilling lives. The asthma is a burden but does not make their lives not worth living." We might also use a mild harm (like mild asthma that is manageable) to avoid this issue.

  2. **Students might not understand the identity shift**: We must emphasize that the children in the two policies are completely different. We can say: "Because of the different economic conditions, different people meet and have children at different times, so the children born are entirely different individuals." We can also use a visual: two separate stacks of cards for the nonidentity round.

  3. **Students might think the harm in the nonidentity round is the same as in the contrast round**: We must stress the difference. In the debrief, we can point out that in the contrast round, the same children exist in both policies, but in the nonidentity round, they are different.

  4. **Time management**: The activity is tight. The instructor must keep time strictly. If the nonidentity round discussion runs long, it might eat into the debrief. It's better to cut short the simulation part if needed.

  **Written Prompt for Both Rounds**:
  On the index card:
  1. Who, if anyone, is worse off in the outcome we got compared to the alternative policy? (List specific individuals or groups, or write "nobody".)
  2. Which policy leads to a better outcome? (Choose: Policy A or Policy B.)
     Why? (In one sentence.)

  **Debrief Structure**:
  - Recap the two rounds and the difference in the students' reasoning.
  - Name the nonidentity problem.
  - Show how the nonidentity problem challenges the person-affecting intuition: we cannot say that the policy we chose made anyone worse off (because the alternative would have been non-existence for those individuals), but we might still feel that we should have chosen the other policy.
  - Present the escape routes, but also note their problems.

  By the end, the students should have experienced the puzzle and be ready to engage with Parfit's work.
answer: |-
  ### **Population Ethics Seminar Activity: The Unnamed Problem**  
  **Goal:** Students independently encounter the nonidentity problem through policy choices affecting *who exists*, then articulate principles to resolve the tension.  

  ---

  ### **Materials**  
  - **18 identity cards** (index cards or paper slips) for students.  
  - **2 dice** (six-sided).  
  - **Whiteboard** to track policies and outcomes.  
  - **Timer** (phone or classroom clock).  
  - **Two bowls/jars** labeled "Policy A" and "Policy B".  
  - **Sticky notes** for written responses.  

  ---

  ### **Mechanics**  
  **Core Scenario:** Students vote on environmental policies for a fictional island. Policy choices alter *which children are born* (via shifts in migration/economic conditions) and their health (asthma rates). All lives are "worth living," even with asthma.  

  #### **Key Rules**  
  - **Identity Shift:** Policies A and B create *entirely different future populations*.  
  - **Well-Being:** Determined by dice rolls (higher = better). Asthma reduces rolls by 2 points but *never* pushes below "worth living" (min. roll = 3).  
  - **Written Prompts:** Students *must* answer the person-affecting question *before* judging which outcome is better.  

  ---

  ### **Timeline (75 Minutes)**  

  #### **Setup (5 min)**  
  - **Instructor Script:**  
    > *"We’re policymakers for Coral Island. Today, we’ll vote on two policies. Each affects which children are born and their health. Every child born will have a life worth living. We’ll simulate outcomes using dice. Write answers on sticky notes—I’ll collect them before discussion."*  
  - Distribute 1 identity card per student. Assign half (9) to "Generation A," half to "Generation B."  

  ---

  #### **Round 1: Contrast Round (Identical Populations) (20 min)**  
  **Policy Choice:** Build a coal plant (Policy A) vs. build a solar farm (Policy B). *Same children exist under both policies.*  
  - **Instructor Script:**  
    > *"Policy A: Cheap energy, but causes asthma in 30% of children. Policy B: Clean energy, no asthma. The same 18 children will exist either way."*  
  - **Vote:** Students vote anonymously (ballots into jars). Tally on whiteboard.  
  - **Simulate Outcomes:**  
    - If Policy A wins: Roll dice for all 18 students. For 6 randomly selected "asthma" students, subtract 2 from their roll.  
    - If Policy B wins: Roll dice with no deductions.  
    - Record rolls on whiteboard (e.g., "Child 1 (A): Roll 5 → 3 with asthma").  
  - **Written Prompts (5 min):**  
    > 1. *Who, if anyone, is worse off in the outcome we got than they would be under the alternative policy?*  
    > 2. *Which policy leads to a better outcome? Why? (One sentence.)*  
  - **Discussion (5 min):** Ask 2–3 students: *"Who was harmed? Why is one policy better?"* (Expect: "The asthma kids are worse off; Policy B is better.")  

  ---

  #### **Round 2: Nonidentity Round (Different Populations) (25 min)**  
  **Policy Choice:** Build a dam (Policy A) vs. preserve forests (Policy B). *Policies alter which children are born.*  
  - **Instructor Script:**  
    > *"Policy A: Dam creates jobs but diverts rivers, causing asthma in 30% of children born. Policy B: No dam, no asthma, but different jobs mean different families move here. Entirely different children will be born under each policy. All lives are worth living."*  
  - **Vote:** Repeat voting.  
  - **Simulate Outcomes:**  
    - **Policy A wins:** Roll dice for 9 "Generation A" students. Assign asthma to 3 random students (rolls –2).  
    - **Policy B wins:** Roll dice for 9 "Generation B" students (no asthma).  
    - *Crucial:* State: *"The children under Policy A would never exist under Policy B, and vice versa."*  
  - **Written Prompts (8 min):**  
    > 1. *Who, if anyone, is worse off in the outcome we got than they would be under the alternative policy?*  
    > 2. *Which policy leads to a better outcome? Why? (One sentence.)*  
  - **Defend Rankings (7 min):**  
    - Ask volunteers: *"Which policy is better? Defend your view without using the phrase 'worse off.'"*  
    - Record principles on whiteboard (e.g., "Fewer people suffer," "Higher average well-being").  

  ---

  #### **Debrief (20 min)**  
  **Reveal the Nonidentity Problem:**  
  > *"Today, you grappled with what Derek Parfit calls the **nonidentity problem**: When a policy changes who exists, we can’t say anyone is worse off, but we still feel the outcome is worse. Let’s map your experience."*  

  1. **Contrast vs. Nonidentity Rounds:**  
     - *Contrast Round:* Harm to identifiable individuals → Easy to say "asthma kids are worse off."  
     - *Nonidentity Round:* Harm to individuals who *only exist because of the policy* → No one is "worse off" (they wouldn’t exist otherwise).  

  2. **Principles Students Reached For:**  
     - **Impersonal Principles:** "Policy B is better because it has less suffering." (Problem: Ignores identity.)  
     - **Wide Person-Affecting:** "The children are worse off relative to a possible *different* life." (Problem: They couldn’t have a different life.)  
     - **Rights-Based:** "Children have a right to asthma-free lives." (Problem: Can they be harmed by being born?)  
     - **Threshold View:** "As long as lives are worth living, both outcomes are okay." (Problem: Why prefer Policy B?)  

  3. **Limitations of the Simulation:**  
     > *"This game can’t replicate the **moral weight of creating a life**. In reality, we ask: 'Is it wrong to create a life with hardship?' The simulation assumes all lives are worth living, but real-world thresholds are messier. You’ll need to grapple with that in Parfit."*  

  ---

  ### **Predictable Problems & Solutions**  
  1. **"The lives aren’t worth living!"**  
     - **Prevention:** Explicitly state:  
       > *"Every child born has a roll of 3–6. A roll of 3 means a hard but meaningful life—like having asthma but still loving family, hobbies, and work. It’s still worth living."*  
     - **If it happens:** Interrupt: *"Remember: A 3 is like a tough but fulfilling life. Roll again if needed."*  

  2. **Confusion on identity shift:**  
     - **Prevention:** Use physical props (hold up "Generation A" and "Generation B" cards separately). Repeat: *"Policy A’s kids would never exist under Policy B."*  

  3. **Skipping the person-affecting question:**  
     - **Enforcement:** Collect written responses before allowing verbal defenses.  

  4. **Time crunch:**  
     - **Shorten:** Skip rerolls; pre-generate "asthma" assignments. Prioritize the nonidentity round.  

  **Why this works:** Students feel the tension when they can’t name victims in Round 2 but still condemn Policy A. The debrief ties their struggle to canonical solutions, priming them for Parfit.  

  ---  
  **Final Tip:** Start the debrief by reading anonymous sticky-note quotes to validate their confusion. Example: *"One of you wrote: ‘No one is worse off, but I still feel guilty.’ That’s the nonidentity problem."*
