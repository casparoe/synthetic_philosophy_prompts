prompt: |-
  I have been asked to sit on the jury of a short-fiction prize — one of those regional awards that carries a modest sum and an unreasonable amount of local feeling. Three jurors, four hundred stories, one month. My colleague the critic proposes a rubric: point of view handled without slippage, images that labour rather than decorate, an ending earned rather than merely arrived at, and six other criteria besides, each scored one to five, the entries ranked by total. The third juror, a poet, will have none of it; she says she knows within a page and a half whether a story is alive, and that scoring craft is a reliable way to reward the diligent and bury the gifted.

  I see the force of both and trust neither. The rubric will favour the flawless and the hollow — I have read dozens of stories that satisfy every such criterion and leave no trace whatever. But the poet's method is unfalsifiable, unarguable, and, if the prize means to survive a complaint from the runner-up's camp, indefensible in public. There is also the arithmetic: four hundred stories scored on nine criteria means reading each of them three times over, which none of us has the year to do, whereas her instinct costs nothing but attention. And there is a competence problem I have not confessed to them. I write novels, long and slow and in the third person; two of the strongest stories in last year's pile were in forms I cannot assess from the inside — one entirely in dialogue, one in a compressed second person — and had I been scoring craft, I should have marked them down.

  Finally, a matter that disqualifies me from designing anything. Eleven years ago I won a prize of exactly this kind by writing a story I knew the judges would like; I had read their criticism and built the thing to specification, and I did not enjoy writing it and have not been able to think about it since. If the rubric is published, as the critic wants, the writing programmes will have it within a week and next year's pile will be four hundred competent imitations of the rubric. If nothing is published, instinct rules, and instinct can be flattered, lobbied, and dressed.

  Tell me where each of my colleagues is right and where each is missing something, what procedure three exhausted readers could actually carry out, how much of it ought to be said aloud — and whether my own disqualification is genuine or merely convenient.
reasoning: |-
  Hmm, the user is a juror for a short-fiction prize facing a dilemma between two judging approaches. One colleague proposes a detailed rubric with nine craft criteria scored numerically, while the other juror (a poet) relies entirely on instinctive recognition of "alive" writing. 

  The user sees flaws in both methods. The rubric risks rewarding technically perfect but soulless stories, while the instinct method seems arbitrary and indefensible. There are practical issues too - scoring 400 stories on nine criteria would require triple reading time. The user also confesses personal limitations: they primarily write third-person novels and feel incompetent judging unconventional forms like pure dialogue or second-person narratives. Most damningly, they once won such a prize by gaming the system, writing to predictable tastes.

  This is a rich multi-layered problem. Professionally, it's about fair assessment under constraints. Psychologically, it reveals impostor syndrome and ethical concerns. The user needs both practical judging strategies and personal clarity. 

  Breaking it down: The critic's rubric offers objectivity but kills art. The poet's instinct preserves magic but lacks accountability. The user's confession suggests all judging is somewhat corruptible. The solution must balance measurable standards with artistic vitality while being practically feasible for three exhausted readers.

  I'm considering a hybrid approach: First-stage triage by instinct to cull the pile, then deeper discussion of survivors. Criteria should focus on effect rather than craft mechanics. The confession isn't disqualifying - that self-awareness actually qualifies them. The key is designing a process that honors both the prize's local importance and literature's unquantifiable spark.
answer: |-
  You've perfectly articulated the central tension in literary judgment. Here's where each colleague is right and wrong, a feasible procedure, and thoughts on your disqualification:

  **Where the Critic (Rubric) is Right & Wrong:**
  - **Right:** Provides transparency, defends against bias/complaints, creates a defensible record. It forces attention to craft elements that *can* be objectively assessed (e.g., grammatical errors, POV consistency).
  - **Wrong:** As you note, it favors the technically proficient but soulless. It's reductive, ignoring synergy (how elements combine to create something *more*). Crucially, **it's impractical:** 400 stories x 9 readings x scoring deliberation per criterion is impossible. It also presumes craft mastery in *all* forms, which you (rightly) doubt your own capacity for in unconventional styles.

  **Where the Poet (Instinct) is Right & Wrong:**
  - **Right:** Recognizes the ineffable "aliveness" of great writing. It's efficient (costs only attention). It *can* spot raw genius that rigid craft scoring might miss. It values the whole over the sum of parts.
  - **Wrong:** It *is* indefensible publicly ("I just *knew*" won't satisfy a runner-up). It's vulnerable to personal taste, fleeting moods, lobbying, and flattery ("dressed"). It offers no shared language for deliberation. It risks overlooking slow-burn or structurally complex stories that don't reveal their genius immediately.

  **A Feasible Procedure for Three Exhausted Readers:**

  1.  **Initial Triage (The "Alive or Dead?" Pass):**
      *   **Action:** All three jurors independently read the *first 2-3 pages* of every story. **Goal:** Quick sort into "Yes/Maybe" (alive, intriguing, promising) and "No" (clearly not competitive).
      *   **Criteria:** Does it grab attention? Is the voice distinct/compelling? Is there a sense of purpose or tension? Is the prose competent *enough* not to distract? Does it feel "alive"? (Embrace the poet's core insight here, but applied universally as a first filter).
      *   **Mechanics:** Aim to reduce the pile by 70-80% (down to ~80-120 stories). Jurors flag "Yes/Maybe" and "No". Stories need 2+ "Yes/Maybe" votes to survive. Discuss borderline cases briefly if needed. *This leverages the poet's efficiency.*

  2.  **The Deep Dive (The "Why?" Pass):**
      *   **Action:** Divide the surviving 80-120 stories equally among jurors (~27-40 each). Read assigned stories *in full*, carefully. **Goal:** Identify the top contenders (~20-30 stories).
      *   **Criteria:** Use **discussion prompts**, *not* numerical scores:
          *   What is the story *doing*? What effect does it achieve?
          *   Does the ending feel *earned* and satisfying (not just craft-wise, but emotionally/narratively)?
          *   Does the voice/style serve the story's purpose?
          *   What moments/images/lines linger? Why?
          *   Does the *whole* feel greater than the sum of its parts? (The "alive" test revisited).
          *   **Crucially:** Does it take risks? Does it feel *necessary*?
      *   **Mechanics:** Each juror nominates their top 10-15% from their batch (~3-6 stories each), totaling ~9-18 stories. Provide brief (1-2 sentence) justifications per nomination focusing on impact and memorability.

  3.  **The Shortlist & Winner Selection (Deliberation):**
      *   **Action:** Combine nominations into a shortlist (~10-15 stories). All three jurors read *all* shortlisted stories.
      *   **Deliberation:** Rigorous discussion based on the prompts above. Argue, champion, dissent. *Avoid* numerical scoring. Focus on comparative strengths: "Story A's ending resonates more deeply than Story B's, despite B's flawless POV." "Story C's risk with form paid off in a way Story D's competence did not."
      *   **Selecting the Winner:** Aim for consensus. If deadlocked, each juror ranks their top 3 secretly. Tally points (3 for 1st, 2 for 2nd, 1 for 3rd). Highest score wins. Discuss again if ties or deep disagreement.
      *   **Runner(s)-up:** Agree on 1-2 honorable mentions during deliberation.

  **What to Say Aloud (Transparency):**

  *   **Publicly (Press Release/Website):** Describe the *process*, not the criteria: "Jurors conducted an initial review of all submissions. Promising entries underwent full reading and rigorous group discussion focusing on originality, emotional impact, narrative cohesion, and memorability. The winner was selected by consensus for its exceptional achievement in [brief, non-technical phrase - e.g., 'capturing the complexities of grief with startling clarity,' 'reinventing the form with daring and wit']."
  *   **To Submitters (Rejections):** Standard polite form letter. No feedback. (400 stories make individual feedback impossible).
  *   **Internally (To the Organizing Body):** A brief memo outlining the 3-stage process (triage, deep dive, deliberation) and emphasizing the focus on identifying impactful, memorable work through discussion. *Mention the use of "promising/not promising" for triage and discussion prompts for the shortlist.* This provides accountability without publishing a reductive rubric.
  *   **Avoid Publishing:** The detailed rubric OR a manifesto on "aliveness." Both are weapons waiting to be used against the prize next year.

  **Your Disqualification: Convenient, Not Genuine.**

  *   **Your Flaws are Strengths:** Your awareness of your limitations with unconventional forms makes you *more* qualified, not less. You recognize that judging requires flexibility beyond your personal aesthetic. This is humility, not incompetence.
  *   **The "Gaming" Experience:** This is invaluable insight, not a stain. You know exactly how a rubric can be exploited. This makes you hyper-aware of soulless competence and deeply invested in finding genuine art that *couldn't* be manufactured to a formula. You are the antidote to the problem you created years ago.
  *   **Novelist's Perspective:** While potentially less attuned to extreme compression, you bring deep understanding of narrative arc, character development (even in glimpses), and the weight of language – all crucial for short stories too.
  *   **The Core Qualification:** Your deep ambivalence and nuanced understanding of the problem make you the *most* qualified juror. You see the traps in both extremes and are motivated to find a genuine solution. You care about the prize's integrity and the art form.

  **In Summary:** Reject the false binary. Use the poet's "aliveness" radar for the brutal, efficient first cut. Use the critic's desire for rigor and defense in the deep dive and deliberation phases, but through qualitative discussion prompts, not numerical scoring. Focus on impact, memorability, and the earned whole. Your procedure is transparent in its steps without being reductive in its public criteria. Your self-awareness is your qualification, not your downfall. Good luck navigating the local feeling!
