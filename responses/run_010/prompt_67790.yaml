  ## Sestina on the Shore of Choosing

  The worn ferry groans against the dock, a sound
  That threads through childhood rooms, through woodsmoke, salt.
  This port holds steady rhythm, deep and slow.
  Across the hills, a polished office chair
  Awaits in glass, where complex thoughts might grow
  More sharp, more valued – is that life **better**?

  Could distant work, respected, be far **better**
  Than this known ache, this deeply rooted **sound**?
  The city offers space for skills to **grow**,
  But leaves behind the scent of damp sea **salt**,
  The quiet watch. And this worn, waiting **chair**
  Beside her mother’s door, moves far too **slow**.

  Time pulls the mother’s strength achingly **slow**.
  No simple scale declares which path is **better**.
  The city firm provides a finer **chair**
  Than this old rocker. Is that reason **sound**?
  It lacks the bite, the comforting tang of **salt**,
  Lacks roots that clutch and thicken as they **grow**.

  Yet roots can bind. Ambition needs to **grow**.
  The ferry’s schedule seems abruptly **slow**
  When matched with flights. They even sweeten **salt**:
  A higher salary, meant to seem **better**.
  But adding coins, however crisp the **sound**,
  Can’t lift the inland offer past the **chair**

  That holds her mother’s form. The inland **chair**
  Promises focus, intellect to **grow**
  Unchecked. It sings a bright, efficient **sound**.
  But why, with this clear gain, does choosing **slow**?
  Shouldn’t the extra make it simply **better**?
  It doesn’t. Scales refuse. They’re stuck. On **par**.

  Not less. Not more. The values stand on **par**.
  This harbour life, that distant, beckoning **chair**.
  No hidden flaw makes the old life feel **worse**.
  No secret virtue makes the new path **grow**
  Dominant. Neither falters, neither flies. Just **slow**,
  Relentless pressure, like the tide’s dull **sound**.

  The doctor’s measured words, a steady **sound**:
  “More help… soon needed.” Tips it off the **par**?
  It *should*. A needed window! Yet the **slow**
  Decision drags. The rocker and the **chair**
  Still hold their ground. Does *any* value **grow**
  Enough to mark one clearly worse or **better**?

  Not **equal**. Not a tie. The terms turn **slow**:
  **Better**, **worse**, **par** – shifting like **sound**
  On water. **Chair** here, **ferry** there. Where **grow**?
  She’ll choose. Not find. She’ll make the balance **break**.
