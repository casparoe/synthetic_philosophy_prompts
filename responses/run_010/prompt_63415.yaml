  Here is the poem, followed by the structural annotation:

  **The Holding Pattern**

  Stanza 1 (True Rhyme)
  The clockwork heart repeats its chime (A)
  A steady beat against the night. (B)
  This ordered dance, this measured time, (A)
  Keeps watch within its vaulted light. (B)

  Stanza 2 (Consonance/Assonance)
  This shifting sand retains the form (A - /rm/)
  The tide insists on shaping still. (B - /l/)
  Though substance shifts beneath the storm, (A - /rm/)
  The hollow waits its will to fill. (B - /l/)

  Stanza 3 (Eye Rhyme)
  The engine coughs, a ragged *though* (A - though)
  The signal flares *enouqh* to see. (B - enouqh)
  The pattern holds, insists it's *so*, (A - so)
  Though meaning strains at *plight* and plea. (B - plight)

  Stanza 4 (Semantic Rhyme)
  The circuit hums a steady *pulse* (A - pulse)
  While *silence* answers from the stone. (B - silence)
  The echo finds its waiting *gulp* (A - gulp)
  Where *absence* sits upon the throne. (B - absence)

  Stanza 5 (Morphological Echo)
  The river *winds* its ancient *way* (A - winds/way)
  Through channels *bound* by stone and *root*. (B - bound/root)
  The current *binds* the *clay* (A - binds/clay)
  To *sound* the bedrock under*foot*. (B - sound/foot)

  Stanza 6 (The China Brain Stadium)
  The radios click, a billion strong, (A)
  Precise commands on channels clear. (B)
  The perfect signal flows along, (A)
  The empty bleachers... cold... austere... (B)
  The pattern holds, exact and vast, (A)
  No spark within the hollow cast. (B)
  But *is* it dark? Or is the thought (A)
  That darkness *must* be there the fault? (B)
  The ache persists: a missing hum, (A)
  The hollow stadium sits *dumb*. (B)
  (But *whose* insistence fills that void? (A)
  Is *light* the sound we can't avoid?) (B)

  ---

  **Structural Annotation:**

  *   **Rhyme Scheme:** Strict ABAB throughout all six stanzas.
  *   **Stanza 1 (True Rhyme):** Lines 1 & 3 rhyme perfectly (`chime/time`). Lines 2 & 4 rhyme perfectly (`night/light`).
  *   **Stanza 2 (Consonance/Assonance):** Lines 1 & 3 share consonance on final /rm/ sound (`form/storm`). Lines 2 & 4 share consonance on final /l/ sound (`still/fill`).
  *   **Stanza 3 (Eye Rhyme - Orthographic):** Lines 1 & 3 *look* like they should rhyme (`though/so`) but sound different (/ðoʊ/ vs /soʊ/). Lines 2 & 4 *look* like they should rhyme (`enouqh/plight`) but sound different (/ɪˈnʌf/ vs /plaɪt/).
  *   **Stanza 4 (Semantic Rhyme):** Lines 1 & 3 are linked by meaning (`pulse` and `gulp` are both rhythmic intake/outtake actions). Lines 2 & 4 are linked by meaning (`silence` and `absence` are both states of lacking presence or sound).
  *   **Stanza 5 (Morphological Echo / Root Word Play):** Lines 1 & 3 share root words for their key verbs/nouns: `winds` and `binds` share the root "bind"; `way` and `clay` share no direct root but echo the vowel/consonant structure weakly. Lines 2 & 4 share root words: `bound` and `sound` share the root "sound" (meaning probe/test, linking to `foot`); `root` and `foot` are both anatomical/base words. The connection is primarily morphological/lexical rather than phonetic or purely semantic.
  *   **Stanza 6 (The China Brain Stadium):** Maintains the ABAB scheme with true rhymes (`strong/along`, `clear/austere`, `vast/cast`, `thought/fault`, `hum/dumb`, `void/avoid`). The "something absent" is the internal qualitative experience (the "spark," the "hum") despite perfect functional correspondence (the "signal flows"). The rejoinder is in the questioning lines: the *intuition* of necessary darkness (`But *is* it dark?`) and the suggestion that the demand for a specific substrate (`light`) might be the flawed premise (`Is *light* the sound we can't avoid?`). The oblique nods: "ache persists" (Martian pain), "hollow stadium sits *dumb*" (Arm thinking for itself, gone silent). The final lines leave the question open – which intuition (about functional role vs. substrate essence) must be surrendered?
