  The expulsion scene challenges Lewis's framework. The dispersal of the population ends the recurrent interactions, dissolving conventions. Lewis's static model doesn't address such breakdowns, focusing on stability within existing populations. The fiddler metaphor highlights precariousness versus Lewis's robust equilibria, suggesting conventions are fragile under external shocks.

