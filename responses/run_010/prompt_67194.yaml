answer: |-
  Dev lands on **no** for the shielding. He won't donate his life savings, viewing the risk as too improbable to warrant the high cost, despite the stakes.

  **Candidate rules** that fit all cases:
  1. **Probability Floor + Cost Sensitivity**: Ignore probabilities below ~10⁻⁹ unless cost is trivial (e.g., <1% of assets). High cost requires higher probability.  
     - *New case prediction: No* (prob 10⁻¹⁵ too low, cost high).
  2. **Expected Value with Aggressive Discounting**: Calculate EV but apply a steep discount for tiny probabilities (e.g., prob² weighting) and bounded utility (no infinities).  
     - *New case prediction: No* (discounted EV negligible vs. life savings).
  3. **Pragmatic Skepticism**: Act only on credible, non-outlandish claims with "meaningful" probability (>10⁻⁶) or low-cost/high-trust cases. Reject Pascal muggings.  
     - *New case prediction: No* (prob too tiny, even with trust).

  **Best guess**: Rule 1 (Probability Floor + Cost Sensitivity). It explains:  
  - Coin game: Pays for moderate probabilities (e.g., ~1/32 for $32), not $1,000.  
  - Startup: 1/200 > floor, stakes high → yes.  
  - Street guy: Prob ~0 → no.  
  - Lottery: Prob 2.5e⁻⁹ < floor → skip.  
  - Charity: Prob 1e⁻⁹ < floor, but cost trivial → yes.  
  - God argument: Infinite stakes ignored (bounded utility/no credence).  
  - Factory: Prob 1e⁻¹² < floor → no penny.  

  **Splitting case**: Offer a 1-in-10¹⁰ chance to save 10¹⁰ lives for $1 (EV = 1 life saved, cost-effective).  
  - Rule 1: Yes (cost trivial, even if prob low).  
  - Rule 2: Maybe no (discounted EV too low).  
  - Rule 3: Yes (cost low, credible). Dev likely says yes, confirming Rule 1.
