answer: |-
  ### Philosophy of Biology Final Examination  
  **Time Allowed:** 50 minutes  
  **Total Marks:** 30  
  **Instructions:** Answer **Part A** and **Part B** in essay format. All necessary concepts are covered in course materials (Gould & Lewontin, Mayr, Maynard Smith, exaptation literature). No citations needed.  

  ---

  #### PART A: TARNEAN ROCK LIZARDS (20 marks; aim for 25 minutes)  
  Analyze the evolution of the bony tube in Tarnean rock lizards using the biological vignette below. **Reach and defend a specific conclusion** about whether the tube’s origin is best explained as:  
  - (i) an adaptation shaped by natural selection *across the clade*,  
  - (ii) a non-adaptive byproduct (spandrel) of development or architecture, *or*  
  - (iii) a combination where the tube’s *origin* and *maintenance* differ in explanatory logic.  

  Justify your view by addressing:  
  - The significance of the tube’s tight allometry and embryonic development;  
  - The implications of the tube’s presence in 12 non-signaling species;  
  - The piper species’ deviation from the allometric line and the plugging experiment;  
  - Why alternative explanations (e.g., adaptationism, "just-so stories") succeed or fail.  

  **Vignette:**  
  *A genus of rock-dwelling lizards on a small archipelago (Tarnean rock lizards). Most species have a hollow bony tube opening just behind the jaw joint, which produces an audible tone when the animal exhales forcefully.  
  - 24 species in the clade; the tube is present in 19.  
  - Across all 19, tube length tracks skull length very tightly (r² ≈ 0.96) — including 12 species that never produce an audible tone at all (burrowing, nocturnal, or in habitats where sound carries poorly).  
  - In embryos, the tube forms where a cranial nerve branch and blood vessel exit the skull; the outgrowth appears before cartilage relevant to resonance develops. In tubeless species, this exit point is a shallow groove.  
  - A distant outgroup has the groove, no tube, and no sound production.  
  - One species ("the piper") uses the tube for social signaling. Its tube is ~40% longer than predicted by the clade-wide allometric line.  
  - Field experiment on the piper: Wax plugs reduce territory-holding and mating success by ~30% with no effect on thermoregulation, bite force, or hearing.  
  - The tube is metabolically cheap; no species with the tube has lost it.*  

  #### PART B: SPANDRELS IN CONTEXT (10 marks; aim for 10 minutes)  
  A dispute exists about San Marco’s "spandrels":  
  - An art historian argues the surfaces are *pendentives* (structural elements), not spandrels, and the distinction matters.  
  - A philosopher claims the mosaics were part of the original design brief, making the surfaces *adaptations for art* rather than exploited leftovers.  
  - A structural engineer counters that the surfaces’ shape is *physically inevitable* when placing a dome on four arches, regardless of intent.  

  Explain how **each position** in this debate parallels a key tension in the Gould-Lewontin critique of adaptationism. Then, briefly state which position best clarifies the lizard tube’s origin (*from Part A*) and why.  

  ---

  ### Model Answer (Approx. 800 words)  
  #### Part A: The Tube’s Origin is a Non-Adaptive Byproduct, Co-opted in the Piper  
  The bony tube in Tarnean lizards originates as a developmental spandrel but was exapted for signaling in the piper. This dual explanation is necessary: the tube arises non-adaptively across the clade, but selection later modified it in one lineage.  

  **Embryology and allometry reveal a spandrel.** The tube’s tight correlation with skull size (r² ≈ 0.96) and its formation at a nerve/vessel exit point indicate it is a structural byproduct of cranial architecture. The outgroup’s groove—lacking a tube or function—suggests the ancestral state involved no selection for the tube itself. Crucially, the tube develops *before* resonance-enabling cartilage, undermining claims it arose for acoustic purposes. In 12 species, the tube persists without utility, consistent with Gould-Lewontin’s emphasis on "phyletic inertia": traits may endure if metabolically cheap (as here) and not deleterious. Adaptationists cannot explain why selection would maintain a useless trait in so many species. The tube is thus a spandrel: a byproduct of constraints (here, developmental pathways for nerve/vessel routing and skull growth).  

  **The piper’s elongated tube shows exaptation, not original adaptation.** The piper’s 40% deviation from allometry indicates recent selection for length, decoupling it from developmental constraints that dominate the clade. The plugging experiment confirms *current* utility in signaling but is silent on origin—a key distinction from adaptationism (Maynard Smith’s reply). This is exaptation: co-opting an existing structure (the tube) for a new function (sound). Selection acted on standing variation (tube length), but the tube itself did not originate *for* this role.  

  **Alternative explanations fail.** A clade-wide adaptationist view collapses because the tube lacks function in most species. Claims like "the tube aids thermoregulation or bite force" are untestable "just-so stories" (Gould-Lewontin’s critique) since plugging showed no such effects. Even if future studies find minor functions, the burden rests on adaptationists to provide evidence—not defaults (Mayr’s point). The tube’s origin is best explained non-adaptively, with positive evidence (embryology, allometry, non-functional persistence) outweighing the absence of adaptive stories.  

  **Conclusion:** The tube is a spandrel originating from developmental constraints. In the piper, it was exapted and shaped by selection—a dual history resolving the apparent contradiction.  

  #### Part B: Architectural Debate as Analogy for Biological Tensions  
  The San Marco dispute mirrors core tensions in the spandrels paper:  
  - **"Pendentives vs. spandrels"** reflects Gould-Lewontin’s attack on *terminological flexibility* in adaptationism. Calling a trait "adaptive" by relabeling it (e.g., "pendentive" as intentional design) obscures whether it is a byproduct.  
  - **"Mosaics in the design brief"** parallels adaptationist appeals to *proximate utility as proof of historical purpose*. The philosopher conflates current use (mosaics) with origination cause—akin to assuming the lizard tube arose for sound because one species uses it.  
  - **"Structurally inevitable surfaces"** captures Gould-Lewontin’s emphasis on *architectural constraints*. The engineer’s view parallels non-adaptive explanations: development (like dome physics) generates byproducts irrespective of function.  

  The engineer’s position best clarifies the lizard tube. The tube’s inevitability from cranial development (like dome physics) is primary; later uses (mosaics/signaling) are secondary. This separates origin (constraint) from modification (selection), preventing conflation of current utility with historical cause.  

  ---

  ### Marking Scheme (Total 30 Marks)  
  **PART A: 20 marks**  
  **A (17–20):** Reaches a clear verdict (e.g., "spandrel origin, exapted in piper"); uses evidence *positively* for non-adaptive origin; distinguishes origin vs. maintenance; addresses all vignette elements.  
  **B (13–16):** Identifies spandrel/exaptation but wavers on verdict; adequate evidence use but may conflate origin/utility; misses 1–2 nuances (e.g., allometry’s role).  
  **C/D (7–12):** Recites debate without applying to vignette; defaults to adaptationism; major omissions (e.g., ignores non-signaling species).  

  *Key Moves & Penalties:*  
  | **Move** | **Points** | **Penalty if Missing/Misapplied** |  
  |----------|------------|-----------------------------------|  
  | Explicitly names tube as **spandrel** (citing developmental constraint: nerve/vessel exit) | +3 | –2 if calls it "spandrel" without specifying constraint |  
  | Uses **12 non-signaling species** as evidence against clade-wide adaptation | +3 | –2 if omitted or dismissed as "no cost" |  
  | **Distinguishes piper’s exaptation** (deviation + plugging ≠ origin) | +4 | –3 if plugging experiment cited as proof of *origin* |  
  | **Critiques adaptationism** using vignette (e.g., "just-so stories fail here") | +3 | –2 if superficial critique |  
  | **Synthesizes dual explanation** (spandrel origin + exaptation in piper ≠ contradiction) | +4 | –3 if treats clade-wide and piper cases as same |  
  | **Uses allometry** (r²=0.96 = constraint; piper’s 40% = selection) | +3 | –2 if allometry noted but not analyzed |  

  **PART B: 10 marks**  
  **A (9–10):** Clearly links all 3 positions to Gould-Lewontin; correctly analogizes to lizards; defends choice.  
  **B (7–8):** Adequate parallels but 1 link weak; lizard analogy vague.  
  **C (5–6):** Superficial treatment; misses >1 parallel.  

  *Key Moves:*  
  - **Art historian:** Shows how relabeling ("pendentive") masks byproduct status (–2 if omitted).  
  - **Philosopher:** Highlights conflation of current use with historical intent (–2 if omitted).  
  - **Engineer:** Links to architectural constraints as non-adaptive origin (+3 for using this for lizards).  

  ---

  ### Why This Works for 50 Minutes  
  - **No "both sides" cop-out:** Forces a verdict (e.g., spandrel) using vignette evidence.  
  - **Polices memorization traps:** Plugging = current utility only; allometry ≠ adaptation; exaptation requires prior structure.  
  - **Developmental constraint is non-negotiable:** Students must name the nerve/vessel exit to avoid "spandrel" as a buzzword.  
  - **Part B as discriminator:** Tests if students grasp that "spandrel" implies architectural inevitability beyond labels.  

  **Adjustments from your notes:**  
  - Dropped "non-adaptive explanation needs positive evidence" as too vague; built it into PART A moves (e.g., +3 for using embryology/allometry as *positive* evidence).  
  - Added penalty for ignoring the 12 non-signaling species to hammer home that spandrels persist without function.  
  - Emphasized piper’s 40% deviation as evidence of *differential* modification within constraint.  

  This question rewards students who see biology as layered history, not just labeling exercises.
