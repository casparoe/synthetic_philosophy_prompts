answer: |-
  ## Memorandum to the Editorial Standards Panel: Policy on the Use of "Genocide"

  **To:** Editorial Standards Panel  
  **From:** [Your Name], Elected Journalist Member  
  **Date:** 19 October 2023  
  **Subject:** Revisiting the Policy on Determining and Reporting Genocide  
  **Word Count:** Approx. 1,180  

  ---

  **I. RECOMMENDATIONS**

  1.  **Abandon** the existing house rule requiring either a competent international tribunal finding or determinations by at least two national governments before using the term "genocide" in our own voice.
  2.  **Adopt** a new standard: *The newspaper may state that a campaign amounts to genocide where, based on rigorous investigation and credible evidence presented by authoritative bodies (e.g., UN-mandated investigations, reputable international commissions, expert consensus reports), there are reasonable grounds to conclude that acts defined under the UN Genocide Convention are occurring, and that the specific intent to destroy, in whole or in part, a protected group can be reasonably inferred.*
  3.  **Reject the Headline:** Do not publish the foreign desk's proposed despatch headline carrying the word "genocide" in isolation. The current body text does not meet the proposed new standard.
  4.  **Publish Revised Despatch:** Require the foreign desk to revise the despatch to reflect the complexities of the test case and the new standard. Provide specific language recommendations below (Section VI).
  5.  **Do Not Adopt a Two-Tier Usage:** Avoid creating separate terms like "moral genocide" or "cultural genocide" for the wider Lemkin concept. Use "genocide" only where the UN Convention threshold is reasonably met; otherwise, deploy precise alternative terminology (e.g., "cultural destruction," "forced assimilation," "crimes against humanity with genocidal indicators").

  ---

  **II. REASONING**

  Our existing rule, demanding a tribunal verdict or governmental determinations, suffers from fundamental incoherence rather than mere conservatism. It outsources our core journalistic function – making evidence-based judgments on matters of profound public importance – to inherently political bodies (governments) or processes (tribunals) that may be delayed, blocked, or never convened precisely to avoid the genocide label. This creates a perverse incentive for perpetrators and risks rendering our reporting mute or misleading during ongoing atrocities where journalistic evidence is most vital. The rule also fails to account for situations where tribunals *have* acted (e.g., ICJ provisional measures) but not yet issued a final verdict, or where governments refuse to act for political reasons despite overwhelming evidence.

  The panel must provide sub-editors and reporters with an operable standard grounded in evidence and the structure of the crime itself, not external validation.

  **A. The Operable Test: Evidence and Reasonable Inference**

  The proposed standard focuses on two core elements derived directly from the Genocide Convention (Article II):
  1.  **Acts:** The occurrence of acts listed: killing members of the group; causing serious bodily or mental harm; deliberately inflicting conditions of life calculated to bring about physical destruction; imposing measures intended to prevent births; forcibly transferring children.
  2.  **Specific Intent (*Dolus Specialis*):** The intent to destroy, in whole or in part, a national, ethnical, racial or religious group, *as such*.

  **Application under Pressure:** A sub-editor can ask:
      1.  Is an authoritative, credible investigation (e.g., UN, ICC Prosecutor, reputable commission like IIFFMCG) reporting that one or more Convention-defined acts are occurring?
      2.  Does that investigation provide evidence and analysis supporting a *reasonable inference* that these acts are committed *with the specific intent* to destroy the targeted group, in whole or in part?
  If the answer to both is "Yes," the term "genocide" can be used in our voice, clearly attributed to the weight of evidence and authoritative findings. If either element lacks sufficient credible support from such sources, the term must be avoided. Attribution to others ("X accuses Y of genocide") remains permissible under existing rules for contentious claims.

  **Cost of Silence:** This test may demand silence on using "genocide" definitively in complex, early-stage, or heavily obscured situations, or where evidence of intent is weak or hotly contested. We must accept this cost. The alternative – premature or inadequately supported use – depletes the word’s power and our credibility when it is most needed. Our duty is to report the evidence rigorously and use precise language reflecting its weight. Silence on the specific term "genocide" does not equate to silence on the atrocities themselves; we must report the documented acts and the allegations of intent with utmost clarity and prominence.

  **B. Answering the Legal Adviser's Position**

  The strongest argument against our use is not that courts are more careful, but that inferring the perpetrator's specific intent is inherently speculative and beyond journalistic verification, risking a catastrophic loss of credibility if we err.

  **Response:** This argument contains a partial truth but overreaches and mischaracterises the journalistic task.
  1.  **Inference is Central:** Intent, especially state or organisational intent, is *always* inferred from actions, patterns, statements, and context, whether by courts, historians, or journalists. The Genocide Convention's acts are specifically chosen because they are strong indicators of the requisite intent. The scholarly argument that measures preventing births *and* transferring children together support an inference of intent is legally coherent and reflects this reality. Our role is not to "verify" intent like a prosecutor with subpoena power, but to assess whether credible investigators present *reasonable grounds* for inferring it based on the evidence.
  2.  **Credibility is Earned Through Rigour:** Credibility is depleted not solely by being "premature," but by being *wrong* or *unsupported*. A rule that forces us to ignore compelling evidence from authoritative sources because a tribunal hasn't yet spoken (or never will) also damages credibility. It suggests we lack the courage of our own carefully assessed convictions or are unduly influenced by political actors. Our credibility rests on consistent, evidence-based judgment, applied transparently and cautiously. Using the term only when *reasonable grounds for the inference* exist, based on authoritative investigation, protects this credibility far more than an absolute prohibition contingent on external actors.
  3.  **Shaping the Rule:** The concern *should* shape the rule by demanding a high threshold for the *quality* and *authoritativeness* of the evidence we rely upon (hence the focus on UN-mandated bodies, reputable commissions, expert consensus), and by requiring that the *inference of intent* be explicit in our reasoning and attribution. It should *not* shape the rule into requiring absolute proof or outsourcing our judgment.

  **C. Addressing Denial of Group Status**

  The state's denial that victims constitute a protected group presents two distinct questions:
  1.  **Moral Boundary:** Should the UN Convention's list (national, ethnic, racial, religious) define the *moral* boundaries of the crime for us? Arguably, Lemkin's conception of protecting any "stable and permanent group" targeted for destruction based on its identity (including political groups in his original view) has moral weight. Persecution based on identity, regardless of the specific label, can be equally abhorrent.
  2.  **Jurisdictional Boundary:** Does the Convention list bind us *jurisdictionally* – meaning, is it the only framework we can use for the *legal term* "genocide"? Yes. The crime is defined by treaty law. Using "genocide" outside this framework legally misleads readers.

  **Recommendation:**
  *   **Stick to the Jurisdictional Definition for "Genocide":** When using the term "genocide," we are bound by the Convention's protected groups. If a state credibly contests group status, we must scrutinise the evidence presented by authoritative investigations. Do they convincingly demonstrate that the victims are targeted *as* a national, ethnic, racial, or religious group, irrespective of state categorisation? (Perpetrators often redefine groups to evade the label). If the authoritative evidence supports this, we can use "genocide" while reporting the state's denial. If the group definition is genuinely ambiguous or contested based on credible evidence, the threshold for using "genocide" is not met.
  *   **Address the Wider Harm Separately:** For the destruction of culture, institutions, or identity groups beyond the Convention list (e.g., political groups, cultural groups *per se*), we must *not* use "genocide." Instead, deploy precise, powerful language: "cultural annihilation," "forced assimilation," "systematic erasure of identity," "persecution amounting to the destruction of a group." Using "genocide" here invites legitimate charges of overstatement and dilutes the specific crime. A neologism ("identity genocide," "cultural genocide") is evasive and confusing. Describe the acts and their devastating impact rigorously, using the Lemkin-inspired vocabulary *without* the legally loaded term.

  **D. Handling Asymmetry in Evidence (Killing vs. Other Acts)**

  The Convention explicitly states that killing is *not* required; measures preventing births and forcibly transferring children are *in themselves* genocidal acts if done with the requisite intent. This is a legal fact.

  **Recommendation:**
  *   **Write to the Law, Explain the Intuition:** Our reporting must accurately reflect the legal definition. We should state clearly that genocide encompasses acts beyond mass killing, including those documented in the test case. However, we must acknowledge the gap with common moral intuition. Readers may instinctively associate genocide primarily with mass slaughter.
  *   **Bridging the Gap in Copy:** The opening paragraph must confront this head-on. Explicitly state that genocide is legally defined to include acts like preventing births and transferring children *if done with the intent to destroy the group*. Briefly explain *why* these acts are seen as genocidal under the Convention (e.g., destroying the group's future existence). This educates the reader while grounding our usage in the legal framework. Avoid euphemisms for the acts ("family planning," "educational programmes") but describe them factually and contextually. The headline must accurately reflect the nature of the findings (see below).

  **E. Recommended Language for the Despatch**

  Based on the test case description and the new standard:

  *   **Headline:** "UN Report Finds Strong Evidence of Genocidal Acts in [Region], Stops Short of Full Genocide Finding"
      *   *Rationale:* Accurately reflects the report's findings ("genocidal acts" = Convention-defined acts) and its conclusion (no "genocide" determination). Uses the crucial term contextually and precisely. Avoids the unsupported declarative headline.
  *   **Opening Paragraph (Example):**
      > "A United Nations-mandated investigation has found "reasonable grounds to believe" that authorities in [Country] have committed acts defined under international law as genocidal, including imposing measures intended to prevent births within the [Group] population and forcibly transferring their children in significant numbers. While stopping short of concluding a genocide is underway, citing limitations including a disputed death toll and unresolved questions about the perpetrators' specific intent, the report presents compelling evidence that these acts were ordered at a high level. The findings place intense pressure on [Country] and the international community to act, amidst fierce denials from [Country] that the [Group] constitute a distinct protected group under the Genocide Convention."
      *   *Rationale:* Immediately states the core finding ("genocidal acts") and specifies which Convention acts are involved. Acknowledges the report's limitations regarding the full genocide finding and intent. Introduces the key dispute over group status. Uses precise legal terminology ("genocidal acts") while avoiding the unsupported definitive "genocide."

  **F. Rejection of Two-Tier Usage**

  Creating terms like "moral genocide" or "cultural genocide" is a mistake for operational and credibility reasons a desk editor will understand:
  1.  **Reader Confusion:** It creates ambiguity. What does "moral genocide" mean? How is it different? Readers expect "genocide" to mean the crime defined in international law.
  2.  **Evasion/Overreach Dichotomy:** It doesn't solve the core problem. Using "cultural genocide" for acts falling outside the Convention will still be seen as overstatement by legal experts and those defending the state. Conversely, using it *instead* of "genocide" when the Convention *does* apply would be a devastating evasion. It simply shifts the point of contention.
  3.  **Operational Burden:** It requires sub-editors to make an even finer, more philosophical distinction under deadline pressure ("Is this 'legal genocide' or just 'moral genocide'?"). Our proposed standard, requiring credible evidence of Convention acts *and* inferable intent, is a clearer, single threshold.
  4.  **Precision is Power:** "Systematic erasure of Uyghur culture," "forced assimilation of [Group] children," "destruction of [Group] institutions" – these phrases, backed by evidence, are powerful, precise, and avoid the legal and credibility pitfalls of a diluted or neologistic "genocide" label.

  ---

  **Conclusion**

  The current rule abdicates our responsibility to interpret compelling evidence of the most serious international crime. The proposed standard empowers rigorous journalism while safeguarding credibility through its reliance on authoritative findings and the requirement for reasonable inference of intent. It provides a workable test for deadlines, confronts the challenges of intent and group definition honestly, respects the legal framework, and demands precise language. We must have the courage to call genocide by its name when the evidence meets this threshold, and the discipline to use equally powerful, precise language when it does not. Adopting this standard allows us to report the test case with the nuance and force it demands.
