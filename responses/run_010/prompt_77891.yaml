  British English and 1200 words is manageable. The memo structure should mirror their request: recommendation first, then reasoning. For the recommendation, I'm leaning toward amending the rule to allow usage when the UN special rapporteur or equivalent body finds genocidal acts with intent - a middle path between the current strictness and activist demands.

