prompt: |-
  ok so I'm a junior and my school has this independent research thing where you get second semester to do one project and then present it at a symposium in May. Proposal is due friday and my advisor already said my topic is fine but that I need to actually narrow it. Topic is Goodhart's law / when a measure becomes a target it stops being a good measure. But I really dont want to write the essay everyone writes, which is just "standardized testing bad, teachers teach to the test, the end."

  here's my actual idea, its half baked but I think there's something there: everyone treats Goodhart stuff as a yes/no thing. Either your metric gets gamed and collapses or it doesn't. But the interesting question seems to be how FAST it collapses. Like, our school had this reading-log points program and by week two people were googling chapter summaries instead of reading — the metric was basically dead in a month. Meanwhile stuff like GPA has been optimized by every student for decades and it still means something, sort of? So I want to propose a concept I'm calling the half-life of a metric: roughly, how long it takes under sustained optimization pressure for the correlation between the proxy and the thing you actually care about to drop by half. And then the claim I want to test is that half-life is predictable from structural features of the setup, not luck. My list so far: how many degrees of freedom the person being measured has to move the number without moving the real thing, whether the gaming is visible to whoever set the metric, whether the metric-setter can actually revise the metric once they notice, and whether the proxy sits upstream or downstream of the goal. I also think the standard four-way taxonomy people use for Goodhart failures — the regressional, extremal, causal, and adversarial kinds — sorts failure MECHANISMS but says nothing about decay SPEED, and my guess is adversarial cases decay way faster than regressional ones, which would be a real finding if I could argue it.

  Can you write the proposal for me? Around 900-1000 words, and it should read like a serious student wrote it, not like a brochure. I need:

  - the research question stated precisely enough that someone could tell me I got it wrong or answered it. Like, what exactly am I claiming about half-lives and what would make the claim false.
  - a section on why the existing treatments don't already settle this. Be fair to them — the four-type taxonomy and the usual AI-alignment versions of this worry about specification gaming are actually good, I just think they answer a different question than the speed one.
  - my method, and a defense of why that method instead of the obvious alternatives. I can't run an experiment and I can't get real longitudinal data on schools, so I think this is a conceptual project: sharpen the half-life idea, define it so its not circular, then run it against a handful of cases I can actually reason about carefully (the reading-log thing, GPA and grade inflation, hospital wait-time targets, maybe a reinforcement learning agent in a video game that finds a shortcut). Explain why careful case-comparison across those does real work rather than being just anecdotes dressed up.
  - what a successful result looks like — like, what would I actually be handing in at the symposium, and what would count as the project FAILING, not just being inconclusive. I want a genuine failure condition in there because my advisor says proposals without one are marketing.
  - an honest scope section. It's about four months, part time, and I have other classes. Tell me what I should cut.
  - and a short answer to the objection I know is coming, which is "isn't this just statistics / isn't half-life just a made-up way of saying how strong the incentives are?" I need to say why it's a philosophical project about measurement and not just a stats project.

  don't bother with a works cited or a reading list, I'll add whatever my advisor wants me to add later. Just don't invent sources in the text either.
