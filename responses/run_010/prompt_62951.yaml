prompt: |-
  Slightly odd piece of work and I want to do it in the right order. I'm helping draft the criteria a review panel will use to decide, case by case, whether a mass-starvation event gets recorded as a political crime or as a natural disaster. People will use the verdicts to name governments and to move emergency money about, and the reasoning has to survive being read out loud to the government it indicts. Before I read any more accounts of famine causation I want the spec rather than the accounts.

  So: write the desiderata for an account of when a famine is attributable to political action or inaction. For each one, give the case or consideration that motivates it, and tag it as non-negotiable or as the preference of a particular camp — I especially want to know which of the things people demand in this area are genuine requirements and which are just one side's taste. The list should cover, at minimum: what the account is even a theory of, since famine could be an event, a process or an outcome; the gap between the trigger and the distribution of vulnerability; causal necessity versus culpability; acts versus omissions, and the difference between a state that starves people and a state that carries on running normally while some people stop being able to eat; keeping causes seperate from blame, or explaining why they can't be kept apart; and what the account is supposed to do when the excess-mortality figures are contested by a factor of three.

  It has to fit the three standard anchors — Bengal 1943, Ireland during the blight, the Great Leap Forward — and also these, which I've made up to test particular joints. Tell me if any of them is a badly posed test rather than a hard one.

  1. Drought removes 40% of a region's harvest. National stocks ample, roads open, prices up only slightly. 300,000 die anyway, because the relief rule required land title and the worst hit were landless labourers and pastoralists who had none.
  2. Same drought, same 40% loss, but cash transfers and a genuinely free regional press mean nobody's entitlements collapse and there's no excess mortality worth mentioning. An account that can't say why this one didn't happen seems useless to me for anything prospective, but tell me if that's asking too much.
  3. A siege. Harvest fine, blockade stops imports, the defending authority feeds its own fighters first. Two parties each causally necessary, neither sufficient alone.
  4. A democracy with a free national press and real elections, in which a famine runs for two years in a territory whose residents can't vote and whose local paper has been shut down by the territorial administration.

  Then: which single requirement knocks out the most candidates? And flag any pair you think can't be jointly satisfied — I've got a suspicion about classifiability in real time on evidence an outsider can actually get, versus not letting concealment itself do the classifying work, but I can't make the tension precise.

  Briefly at the end, five or six lines each, how a food-availability story, Sen's entitlement approach, a straight intentionalist atrocity account and some accountability hybrid do against the list. Keep that bit short, the criteria are the point.
reasoning: |-
  Hmm, the user is asking me to develop criteria for classifying mass-starvation events as political crimes versus natural disasters. This is clearly for some kind of policy review panel where the stakes are high - governments will be named, emergency funds allocated, and decisions need to withstand scrutiny when read aloud to accused governments.

  The user wants desiderata (essential requirements) for such an account, with each requirement explained by a motivating case or consideration. They also want tags indicating whether each is non-negotiable or just a preference of certain camps. Key areas to cover include: defining what famine actually is (event/process/outcome), the gap between triggers and vulnerability distribution, causal necessity versus culpability, acts versus omissions, separating causes from blame, and handling contested mortality data.

  They've provided four test cases to validate against: 
  1) A drought where relief rules excluded landless laborers
  2) Same drought but effective relief prevents famine
  3) A siege situation with shared responsibility
  4) A democracy where disenfranchised territory experiences famine

  I need to identify which single requirement would eliminate most candidate theories and flag any incompatible requirement pairs. Finally, I should briefly evaluate how existing frameworks (food availability decline, Sen's entitlement, intentionalist atrocity, accountability hybrids) fare against these criteria.

  This is complex with multiple dimensions. I'll structure my response around core desiderata clusters: ontological (what famine is), causal, evidentiary, and functional. For each desideratum, I'll specify the motivation from the test cases or general principles, and tag it as non-negotiable or camp-specific. 

  The test cases all seem valid except perhaps #4 which might be ambiguous about central government responsibility. The key tension appears between real-time classifiability with limited evidence versus not rewarding concealment - these may be fundamentally incompatible.

  For the frameworks evaluation: 
  - Food availability decline fails most criteria by ignoring distribution
  - Sen's entitlement handles vulnerability well but struggles with culpability
  - Intentionalist accounts are too narrow
  - Hybrid approaches come closest but still have gaps

  The mortality data contestation requirement (#6) will likely eliminate the most candidates since many theories depend on undisputed figures. The concealment vs. classifiability tension (#7 vs. #8) seems unresolvable - we must either accept imperfect early classification or risk rewarding opacity.
answer: |-
  Here are the desiderata for an account attributing famine causation, structured to meet your requirements. Each includes motivation, negotiability, and performance against your test cases. The test cases are well-posed, probing distinct joints in the problem.

  ---

  ### **Core Desiderata for a Famine Attribution Account**

  1.  **Defined Ontological Scope (Event/Process/Outcome)**  
      *   **Motivation:** Must specify *what* is being explained (e.g., the starvation deaths, the collapse of entitlements, the societal breakdown). Bengal '43 shows rapid collapse (event/outcome); Ireland was a protracted process; GLF was systemic policy failure leading to mass death.  
      *   **Tag:** **Non-negotiable.** An account must define its object clearly to be testable.
      *   **Test Cases:** Must handle all types (e.g., Test 1/2 = outcome/process; Test 3 = event; Test 4 = process).

  2.  **Accounts for Vulnerability Distribution**  
      *   **Motivation:** The gap between trigger (drought, war) and *who* starves is critical. Test Case 1 proves a natural trigger doesn't explain *selective* mortality among the landless. Test Case 2 shows vulnerability can be mitigated.  
      *   **Tag:** **Non-negotiable.** An account ignoring *differential vulnerability* fails empirically (e.g., pure "food availability decline").
      *   **Test Cases:** Central to 1 & 2, explains 3 (siege targets civilians), explains 4 (disenfranchised group).

  3.  **Distinguishes Causal Necessity from Culpability**  
      *   **Motivation:** Test Case 3 (siege) shows two necessary causes (blockade, defender's prioritization), but culpability hinges on intent, duty, capacity, and foreseeability. An account must separate "X caused Y" from "X is *blameworthy* for Y".  
      *   **Tag:** **Non-negotiable for causation; Negotiable (Camp-Specific) for blame assignment.** Culpability standards vary legally/morally (e.g., recklessness vs. intent).
      *   **Test Cases:** Vital for 3 (assigning blame between besieger/defender) and 4 (did central govt. *cause* it or *fail in duty*?).

  4.  **Addresses Acts vs. Omissions & State Capacity/Normality**  
      *   **Motivation:** Distinguish active deprivation (Test 3 siege) from failure to protect (Test 1 relief rules, Test 4 inaction). Must assess if the state acted *within* normal function (Test 1: relief rules applied normally) or *abnormally* (e.g., seizure). "State normality" isn't an excuse if norms are unjust (Test 1).  
      *   **Tag:** **Non-negotiable.** Omitting this conflates malice and negligence, and masks structural violence.  
      *   **Test Cases:** Core to 1 (omission via flawed rules), 3 (acts & omissions by both sides), 4 (omission by central state).

  5.  **Addresses Causation-Blame Entanglement**  
      *   **Motivation:** In famine, the *political* act/omission causing death *is* often the locus of blame (e.g., Test 1's relief rules). Separating pure "cause" is artificial when the cause *is* a policy choice. The account must acknowledge this link while avoiding circularity ("it's political because we blame them").  
      *   **Tag:** **Negotiable (Camp-Specific).** Legalists prefer separation; activists/scholars see inherent entanglement. The account must *explicitly state its position*.  
      *   **Test Cases:** Critical for 1 (policy choice = cause+blame) and 4 (is inaction blameworthy causation?).

  6.  **Robust to Contested Mortality/Data**  
      *   **Motivation:** Excess mortality is often disputed (e.g., GLF figures). An account must function without consensus numbers, using proxies (collapse of entitlements, market failure, displacement, credible reports) to infer *significant* death/destitution attributable to political factors, even if scale is uncertain.  
      *   **Tag:** **Non-negotiable.** Practical necessity for real-world use.  
      *   **Test Cases:** Must handle all cases if mortality figures are contested (esp. GLF analogies).

  7.  **Classifiable in Real-Time with Available Evidence**  
      *   **Motivation:** Needed for triggering emergency responses. Relies on observable proxies (policy changes, market data, displacement, communications blackouts - Test 4) rather than finalized death tolls.  
      *   **Tag:** **Negotiable (Operational Camp Preference).** Some scholars prioritize perfect hindsight; practitioners demand timeliness.  
      *   **Test Cases:** Essential for prospective use (e.g., flagging Test 4 early).

  8.  **Does Not Reward Concealment/Opacity**  
      *   **Motivation:** Test Case 4 highlights the risk: a government obscuring facts shouldn't avoid classification as "political" simply because data is hidden. The account must infer from *available* evidence and state actions/inactions regarding information flow.  
      *   **Tag:** **Non-negotiable (Moral/Functional Requirement).**  
      *   **Test Cases:** Core to 4 (local press shut down), relevant to sieges (information control).

  ---

  ### **Key Tensions & Knock-Out Power**

  *   **Most Knock-Out Power:** **#6 (Robustness to Contested Mortality).** Many popular accounts (especially those reliant on precise econometrics or intentionalism) collapse if mortality data is unusable. Requires an account focused on *processes* and *mechanisms* (entitlement collapse, policy failure) observable independently.
  *   **Irreconcilable Tension:** **#7 (Real-Time Classifiability) vs. #8 (Not Rewarding Concealment).** This is the tension you suspected.
      *   *Why:* Real-time classification (#7) relies on *accessible* evidence. Effective concealment (#8) makes this evidence unavailable. An account prioritizing #7 might misclassify a concealed famine (like early stages of Test 4) as "uncertain/natural" due to lack of data, *rewarding* the concealment. An account prioritizing #8 might classify based on *inference* and *absence of expected data*, risking false positives if evidence is genuinely lacking for non-concealment reasons. **Perfect joint satisfaction is impossible.** The account must explicitly balance these, e.g., using a "precautionary principle" under concealment or tiered confidence levels.

  ---

  ### **Framework Evaluation (Brief)**

  1.  **Food Availability Decline (FAD):**
      *   Fails #2 (Vulnerability), #3 (Culpability), #4 (Acts/Omissions). Explains Test 3 partly (blockade reduces FAD), but fails Test 1/2 (same FAD, different outcomes) and Test 4 (FAD may not be primary). Useless for attribution. **Knocked out.**

  2.  **Sen's Entitlement Approach:**
      *   Excels at #1 (Process), #2 (Vulnerability), handles Test 1 & 2 perfectly. Struggles with #3 (Culpability - explains *how* starvation happens, not *who's responsible*), #4 (Acts/Omissions - focuses on failure, not malice), #5 (Entanglement - causation clear, blame less so). Weak on #6 (Contested Data - requires complex entitlement mapping). **Strong core, needs blame layer.**

  3.  **Straight Intentionalist Atrocity:**
      *   Excels at #4 (Acts - if malice proven), #5 (Entanglement - cause=blame). Fails #2 (Vulnerability - ignores non-intentional factors), #3 (Necessity - misses contributory factors), #1 (Scope - narrow). Fails Test 1 (likely not intentional), Test 2 (irrelevant), Test 3 (only if intent proven for *both*?), Test 4 (hard to prove central intent). **Too narrow, misses most cases.**

  4.  **Accountability Hybrid (e.g., de Waal/Howe):**
      *   Best fit. Incorporates entitlement collapse (#1, #2) but adds explicit analysis of *political responsibility* (#3, #4, #5): duty bearers, capacity, negligence, recklessness, intent. Can handle #6 (Contested Data) via process evidence. Struggles with #7/#8 tension like all models. Explicitly tackles Test 1 (negligent omission), Test 3 (joint analysis), Test 4 (failure of democratic accountability). **Most promising, needs clear culpability thresholds.**

  The criteria prioritize an **Accountability Hybrid** focused on the *failure of the protective state* (duty, capacity, action/inaction, foreseeability) causing or permitting entitlement collapse, robust to data limitations and concealment.
