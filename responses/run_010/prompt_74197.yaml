prompt: |-
  I host a tiny podcast where I get academics to explain stuff to people like me — I'm a backend engineer, no formal philosophy training at all — and next week's guest is a philosopher who argues there's a genuine moral duty to vote, but she doesn't ground it in citizenship or in keeping democracy legitimate. Her version is basically the shallow-pond argument moved to the ballot box: voting costs you almost nothing, the stakes are enormous, so staying home is like walking past a kid drowning in a shallow pond. The catch is she also grants that a single vote almost never decides an election, and she thinks she can hold both of those.

  Can you draft like eight questions that actually walk that tightrope instead of letting her give the TED-talk version? I want one that pins down how large the chance of mattering has to be before the duty switches on, and whether the duty then gets stronger the closer the race is — because that would mean I'm more obligated in a swing distrct than in a safe one, which feels off. One on whether calling it an imperfect duty gets her out of the "so you have to vote in every school board election too?" reductio, or just hides the problem. One on the expressive payoffs — feeling counted, signaling your values to yourself — asking whether those are a separate real reason or a rationalization, since expressing yourself doesn't rescue anyone from any pond. And one on badly informed voters: does her view quietly turn into a duty to abstain for people whose vote is worse than a coin flip?

  For each question, tell me the answer I should expect and then the follow-up that makes that answer uncomfortable. Phrase them the way a curious non-specialist would, not in jargon, and flag any question where she'd be totally within her rights to say I've misunderstood her position.
reasoning: |-
  Okay, the user hosts a podcast where academics explain complex topics to non-specialists like backend engineers. Next week's guest is a philosopher who argues there's a moral duty to vote, grounded in the shallow-pond analogy rather than citizenship or democratic legitimacy. The challenge is that she acknowledges a single vote rarely decides an election. The user wants eight questions that probe this tightrope without letting her default to a simplified TED-talk version.

  The user specifically wants questions addressing:
  - The threshold chance where the duty activates and whether it strengthens in closer races (which feels counterintuitive for swing districts)
  - Whether framing it as an "imperfect duty" avoids the reductio of requiring votes in every minor election or just hides the problem
  - Whether expressive benefits are genuine reasons or rationalizations since they don't "save anyone from a pond"
  - Whether her view implies a duty to abstain for uninformed voters whose votes might be harmful

  For each question, I need to provide:
  1. The expected answer 
  2. A follow-up that makes that answer uncomfortable
  3. Plain language phrasing
  4. Flags where she might say the question misunderstands her position

  The user's deeper needs seem to be:
  - Preventing the guest from retreating to rehearsed talking points
  - Exposing potential contradictions in the argument
  - Clarifying practical implications (e.g., swing states, uninformed voters)
  - Testing whether expressive voting fits the moral framework
  - Understanding if the theory demands voting even when impact is negligible

  I should avoid jargon and phrase questions conversationally. The follow-ups need to gently challenge without being aggressive. Where applicable, note if the question might misinterpret her view.

  I'll structure eight questions covering:
  1. Probability threshold for duty activation
  2. Variable strength in close vs. safe elections
  3. Imperfect duty and minor elections
  4. Expressive benefits vs. moral impact
  5. Uninformed voters and duty to abstain
  6. High-cost voting scenarios
  7. Comparison to other low-impact acts
  8. Action guidance beyond voting

  Each question will include:
  - Plain phrasing
  - Expected answer
  - Uncomfortable follow-up
  - Potential misunderstanding flags

  The goal is rigorous but respectful interrogation of the theory's coherence and practical demands.
answer: |-
  Here are eight tightrope-walking questions designed to pin down the nuances of her argument, phrased for a non-specialist, with expected answers, uncomfortable follow-ups, and flags where she might call out misunderstandings. I've focused on conversational clarity while targeting the philosophical tensions you described.

  ---

  ### 1. **The Probability Threshold**  
  **Question:** "You say voting costs almost nothing, and the stakes are huge—like ignoring a drowning kid. But since my vote has a microscopic chance of changing an outcome, how small can that chance get before I’m *off the hook* morally? Is there a specific 'too small to matter' point?"  
  **Expected Answer:** She’ll likely reject a strict numerical threshold, arguing that even tiny probabilities matter when multiplied by enormous stakes (e.g., "Think of it like buying a lottery ticket where the jackpot is saving a life").  
  **Uncomfortable Follow-Up:** "If there’s no clear cutoff, does that mean I’m morally required to do *anything* with a tiny chance of huge impact—like donating to a wildly effective charity I’ve never heard of? Why single out voting?"  
  **Flag:** She might argue this misrepresents her if she ties the duty specifically to *collective* action (e.g., voting as a shared endeavor).

  ---

  ### 2. **Swing Districts vs. Safe Seats**  
  **Question:** "If the duty comes from the *chance* my vote matters, am I more obligated to vote in a nail-biter Ohio district than in solid-blue California? That feels odd—like morality depends on my zip code."  
  **Expected Answer:** She’ll probably say the *core duty* exists everywhere, but admit that the *expected impact* (and thus urgency) is higher in swing areas.  
  **Uncomfortable Follow-Up:** "Doesn’t that make voting in safe seats morally optional? And if so, why isn’t everyone in California ‘off the hook’—which would make elections *less* democratic?"  
  **Flag:** She might push back if her theory treats voting as a "symbolic ritual" independent of marginal impact.

  ---

  ### 3. **The ‘Imperfect Duty’ Dodge**  
  **Question:** "You call this an ‘imperfect duty’—meaning I have flexibility in *how* I fulfill it. But does that actually solve the ‘why not vote in every school board race?’ problem? Or does it just hide that your argument might demand *too much*?"  
  **Expected Answer:** She’ll emphasize that imperfect duties allow prioritization (e.g., "Focus on high-stakes elections").  
  **Uncomfortable Follow-Up:** "If I skip a low-stakes election to spend time with my sick kid, am I failing morally? How do I weigh ‘voting in everything’ against other imperfect duties like charity work?"  
  **Flag:** None—this directly engages her framework.

  ---

  ### 4. **Expressive Voting vs. Shallow-Pond Rescue**  
  **Question:** "People say voting lets them ‘express themselves’ or feel like they’re part of something. But in your shallow-pond analogy, the *point* is saving the kid—not feeling good. Are those expressive benefits a *real* moral reason to vote, or just a psychological perk?"  
  **Expected Answer:** She’ll likely downplay expressiveness as core to her argument, stressing the *objective stakes* (e.g., "It’s about outcomes, not feelings").  
  **Uncomfortable Follow-Up:** "If expressive payoffs *aren’t* part of the moral duty, why not tell people to shut up and vote even if it feels meaningless? Doesn’t that make voting joylessly transactional?"  
  **Flag:** She might argue expressiveness *reinforces* the duty (e.g., it sustains democratic culture).

  ---

  ### 5. **The Uninformed Voter Problem**  
  **Question:** "If someone’s vote is *worse* than random—say they back terrible policies due to bad info—does your view imply they have a duty to *stay home*? After all, a bad vote could ‘drown the kid faster’ than not voting at all."  
  **Expected Answer:** She’ll resist this, likely arguing that (a) it’s hard to know your vote is net harmful, and (b) the duty includes becoming *minimally* informed.  
  **Uncomfortable Follow-Up:** "But if we *know* someone’s vote is harmful (e.g., they believe lies), shouldn’t we tell them not to vote? And doesn’t that undermine ‘every vote counts’ rhetoric?"  
  **Flag:** She might say this misapplies her analogy—voting isn’t about individual "rescue attempts" but contributing to a system.

  ---

  ### 6. **Costs Beyond Time**  
  **Question:** "Voting costs me little, but what if it’s *not* low-cost? Say I’m disabled and face a 4-hour line, or I’d lose wages by taking time off. Does your duty still hold? Or does it vanish when costs rise?"  
  **Expected Answer:** She’ll concede that sufficiently high costs negate the duty (e.g., "The pond isn’t shallow anymore").  
  **Uncomfortable Follow-Up:** "If costs *do* matter, doesn’t that make voting a luxury for the privileged? And if so, how is this a *universal* duty?"  
  **Flag:** None—this tests the boundaries of her "low cost" premise.

  ---

  ### 7. **Voting vs. Other Low-Impact Acts**  
  **Question:** "Why focus on voting and not, say, tweeting about politics? Both have tiny chances of impact, but tweeting is even *lower* cost. Does your argument make *every* low-effort/high-stakes act a duty?"  
  **Expected Answer:** She’ll distinguish voting as uniquely consequential/systematic (e.g., "Elections are decisive moments; tweets aren’t").  
  **Uncomfortable Follow-Up:** "But if I tweet a viral thread that swings 100 votes, haven’t I done *more* good than voting? Why isn’t *that* my duty?"  
  **Flag:** She might argue voting has symbolic weight other acts lack.

  ---

  ### 8. **The ‘What Should I Do?’ Test**  
  **Question:** "Practically speaking, if I accept your argument, what changes? Do I have to research every candidate? Vote in primaries? Or is showing up every 4 years enough to be ‘morally covered’?"  
  **Expected Answer:** She’ll advocate for "reasonable" engagement (e.g., "Vote in major elections, stay minimally informed").  
  **Uncomfortable Follow-Up:** "If I vote randomly because I didn’t research, am I *worse* than someone who stays home? If not, why does ‘showing up’ alone satisfy the duty?"  
  **Flag:** She might reject the "moral minimum" framing, stressing ongoing civic engagement.

  ---

  ### Tips for the Interview  
  - **When she flags a misunderstanding:** Pause and ask, "How *would* you reframe that?" Don’t let her retreat into abstraction—push for concrete implications.  
  - **Tone:** Stay curious and "devil’s advocate," not combative. Use phrases like "Help me see why..." or "What am I missing here?"  
  - **Key Tension to Highlight:** Her theory lives in the gap between *individual impotence* and *collective power*. The best follow-ups expose that tension (e.g., "If my vote is a drop in the ocean, why does *my* drop matter morally?").  

  These questions force her to defend the *mechanism* of her analogy—not just repeat it. Good luck!
