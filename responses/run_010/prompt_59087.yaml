  After that, give me the residue report: which claims map cleanly onto priority, perfection, and reach-back; which you had to distort to fit; and which have no expression at all in a framework whose categories rank claims without ever asking where the claims come from. Do not let a move count as translation merely because it wears my terminology — in particular, statutory ranking is not itself a normative ground, and if your rendering leans on that slide you must flag it. Close by saying how confident you are in each part of the report and singling out the one point you are least sure of, then give a final line beginning "Verdict:" followed by exactly one of: DEFECT IN THE TARGET VOCABULARY, ORIGINAL CLAIM UNCLEAR, BOTH, NEITHER.
