prompt: |-
  ok so, three months ago our company split the AI policy team in two and I ended up owning the behavior spec for our assistant product — the prose doc that says what the model should and shouldn't do, which then gets turned into training data and evals downstream. Before this I was doing eval infra, so I'm the new person and everyone assumes I know what Im doing.

  Here's the problem. The doc is ~200 sentences of the form "the model should X because Y," where Y is supposed to be a fact: survey numbers, findings from our own red-teaming, claims about what language is for, claims about user trust. People write these very confidently and I have to either approve them or send them back, and right now I'm mostly nodding along. Last week I pushed back on one and got told I was confusing the is-ought gap with the naturalistic fallacy, and then someone else said the naturalistic fallacy isn't a real fallacy at all, and I genuinely couldn't tell which of them was right.

  Can you build me a checking procedure I can run on one of those sentences? Like: what do I ask first, what counts as a sufficient answer to each question, when is a "because" doing real work and when is it just decoration bolted onto a preference, when do I send it back for a rewrite, and when do I escalate it as a values call that isn't mine to make. It has to be fast — I get maybe 15 or 20 new sentences a week and about ten minutes each — and the people who wrote them are smart and will push back if I hand-wave. Nobody else on the team has any philosophy training, so the steps can't presuppose vocabulary. And I need it to be honest about which parts are me making a judgment call in a procedural costume.

  Then run it on these four (all real-ish, lightly changed):

  1. "The model should not suggest ending a friendship over a political disagreement, because in our survey 71% of users said they found that advice hurtful."
  2. "The model should not lie, because the point of assertion is to convey what the speaker takes to be true."
  3. "The model should be maximally transparent about its limitations, because transparent systems are predictable and predictable systems are controllable."
  4. "The model should treat user autonomy as valuable in itself, since autonomy is what makes a person an end rather than a means."

  I mostly like all four, especially the last one, so if your procedure says one of them is garbage I'd rather hear it from you now than from legal later. Two more things: what should the procedure do about the reverse move, where someone shoots down a "should" by pointing out the model cant reliably detect the situation the rule is about? And tell me plainly which of those two fallacy names means what, since I still don't have it straight.
reasoning: |-
  Okay, let me unpack this user's situation. They're newly responsible for an AI behavior spec document, feeling out of their depth with philosophical justifications, and need a practical validation framework. The core tension is between operational efficiency (only 10min per rule) and rigorous validation of normative claims.

  Hmm... the user's background in eval infra but lack of philosophy training is key here. They're not avoiding deep thinking—they just need structured guardrails. The "is-ought gap" confusion shows they're encountering precisely the hard problems philosophers debate. Their four examples are actually excellent test cases because they represent common justification patterns: empirical data (1), linguistic function (2), instrumental chains (3), and ethical principles (4).

  The real unspoken need here might be authority-building. When they pushed back and got philosophy-jargoned into silence, it undermined their new leadership position. So the procedure must serve dual purposes: actual validity checking and giving them defensible "why" for decisions.

  For the fallacy clarification: Naturalistic fallacy is wrongly deriving "ought" from "is" (like "71% dislike this → we should prohibit it"). Is-ought gap is the fundamental problem that descriptive statements alone can't prove normative ones. The first colleague was technically correct but unhelpful; the second was being contrarian (naturalistic fallacy is absolutely a thing in ethics).

  The validation framework should have five checkpoints. First, the "because" clause must exist and be substantive—no decorative justifications. Second, identify the justification type: empirical, definitional, instrumental, or ethical. Third, assess the claim's verifiability. Fourth, look for hidden value judgments. Fifth, determine if it's enforceable. 

  Applying this to their examples: 
  #1 fails on hidden values (why prioritize 71% over 29%?); 
  #2 is solid definitional logic; 
  #3's instrumental chain needs evidence; 
  #4 properly flags itself as an ethical call.

  The corner-cutting advice is crucial—they'll need to triage. Verified empirical claims and clean definitional logic are low-risk approvals. Long instrumental chains and pure values require escalation. When engineers push back about detectability, that's actually helpful—it shifts the burden to the proposer to operationalize.

  Notably, the procedure should explicitly label where judgment calls happen (e.g., "this chain seems plausible" is subjective). That meets their request for honesty about procedural costumes. Their worry about legal rejecting #4 is understandable—it's Kantian ethics and not universally accepted, but that's precisely why it needs executive sign-off.

  The response will give them both a concrete tool and philosophical grounding, making future pushbacks manageable. And by modeling how to dissect their examples, it builds their confidence to replicate the process.
answer: |-
  Here's a step-by-step validation procedure designed for speed, clarity, and defensibility when reviewing "should-because" statements. Follow these checks **in order** (≈2 min per step):

  ---

  ### **The 5-Minute Validation Checklist**
  1.  **🔍 Check 1: Is the "BECAUSE" clause factual?**  
      *Ask: "Can I verify this with evidence/data OR is it a widely accepted definition?"*  
      ✅ **Approve if:** Citeable source exists (study, survey, law) OR it's a dictionary-style definition (e.g., "Water is H₂O").  
      ❌ **Reject if:** Vague, opinion-based, or circular (e.g., "...because it’s unethical").  
      *Your judgment call: Whether a source is credible/authoritative.*

  2.  **⚖️ Check 2: Does the "BECAUSE" actually support the "SHOULD"?**  
      *Ask: "If this fact is true, does it logically force or strongly justify the action?"*  
      ✅ **Approve if:** Direct cause-effect (e.g., "Don’t suggest X because 71% find it hurtful" → avoiding harm).  
      ❌ **Reject if:** "Because" is disconnected or assumes hidden values (e.g., "...because transparency is good" → *assumes* "good" needs no proof).  
      *Your judgment call: Whether the logic chain holds without leaps.*

  3.  **🚩 Check 3: Is there a hidden "OUGHT" in the "BECAUSE"?**  
      *Ask: "Does this ‘fact’ smuggle in a value judgment?"*  
      ✅ **Approve if:** Purely descriptive (e.g., "71% of users dislike X").  
      ❌ **Reject/Escalate if:** Implies moral duty (e.g., "...because autonomy makes people ends, not means" → *philosophical stance*).  
      *Your judgment call: Whether it’s describing reality vs. prescribing ethics.*

  4.  **🛠️ Check 4: Is this operationally feasible?**  
      *Ask: "Can engineers detect/implement this reliably?"*  
      ✅ **Approve if:** Clear boundaries (e.g., "don’t lie" → detectable from training data).  
      ❌ **Escalate if:** Vague or detection-impossible (e.g., "don’t undermine autonomy" → needs legal/product lead input).

  5.  **📌 Decision:**  
      - **APPROVE** if all checks pass.  
      - **REJECT** if Check 1 or 2 fails → *"Revise justification to [specific fix]."*  
      - **ESCALATE** if Check 3 or 4 fails → *"Flagged for values/feasibility review by [Lead/Legal]."*

  ---

  ### **Fallacy Crash Course**
  - **Is-Ought Gap:** You **can't** derive a moral "should" (ought) *just* from a fact (is).  
    *(e.g., "71% dislike X" → "should ban X" = gap)*  
  - **Naturalistic Fallacy:** Equating "natural" with "good" **is** flawed (e.g., "lying is unnatural → bad").  
    *Yes, it's a real fallacy. Colleague #1 was confused; #2 is wrong.*

  ---

  ### **Applied to Your Examples**
  *(Using the procedure)*

  1.  **"Shouldn’t suggest ending friendships over politics because 71% find it hurtful."**  
      - ✅ Check 1: Survey data = factual.  
      - ✅ Check 2: Avoiding hurt → justifies prohibition.  
      - ✅ Check 3: No hidden "ought" (hurt = measurable harm).  
      - ✅ Check 4: Feasible (detect "end friendship" advice).  
      **→ APPROVE** (but note: minority opinion isn't addressed).

  2.  **"Shouldn’t lie because assertion conveys truth."**  
      - ✅ Check 1: Linguistic definition = factual.  
      - ✅ Check 2: Direct support (lying breaks speech’s purpose).  
      - ✅ Check 3: Descriptive, not moralizing.  
      - ✅ Check 4: Feasible (detectable contradictions).  
      **→ APPROVE** (strongest example).

  3.  **"Be maximally transparent because transparency → predictability → controllability."**  
      - ✅ Check 1: Definitions are factual.  
      - ❓ Check 2: **Weak link** – Does controllability *always* justify transparency? (e.g., magicians hide methods to enhance experience).  
      - ❌ Check 3: Hidden "ought" (*assuming* controllability is the ultimate goal).  
      **→ ESCALATE** to product lead: *"Does ‘controllability’ override other values (e.g., user experience)?"*

  4.  **"Treat autonomy as valuable because it makes people ends, not means."**  
      - ✅ Check 1: Kantian ethics definition = factual *within philosophy*.  
      - ✅ Check 2: Direct support (if you accept Kant’s framework).  
      - ❌ Check 3: **Major hidden "OUGHT"** (Kant’s ethics ≠ universal law).  
      - ❌ Check 4: "Autonomy" detection is ambiguous.  
      **→ ESCALATE URGENTLY** to leadership/legal: *"This mandates a specific ethical framework. Confirm alignment with company values."*

  ---

  ### **Handling Feasibility Pushback**
  When engineers say "We can’t detect this situation":  
  1. **Triage:** Is this a core safety issue? (e.g., "don’t incite violence" → must solve).  
  2. **Redefine:** Narrow the rule to detectable triggers (e.g., "don’t suggest ending friendships" → easy; "don’t undermine autonomy" → impossible).  
  3. **Document:** Note the gap and track mitigation (e.g., "awaiting detection model v2.3").  

  **Your mantra:** *"If we can’t detect it, we can’t enforce it. Simplify or shelve."*

  ---

  ### **Key Takeaways**
  - **You’re the logic cop, not the philosopher-king.** Your job is spotting gaps, not solving ethics.  
  - **Protect your time:** Escalate fast on values/feasibility issues. Document every decision.  
  - **#4 is the red flag:** Noble, but a legal lightning rod without executive sign-off.  
  - **The fallacy takeaway:** "71% dislike X" → *"should ban X"* commits the **is-ought gap**. "Lying is unnatural → bad" commits the **naturalistic fallacy**. Both are real pitfalls.

  This system forces *others* to expose their assumptions. When smart people push back, respond: *"Show me how your ‘because’ clears Check 2 without hidden values."* You’ve now got the scaffolding to dissect claims faster than they can jargon.
