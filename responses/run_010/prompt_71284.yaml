answer: |-
  ### Constructed Example: Reservoir Management Scenario  
  **Agent's Situation:** You are a senior water resource engineer responsible for a reservoir system. The primary dam has two critical features: (1) an automated spillway designed to prevent overflow, and (2) a network of groundwater sensors monitoring subsurface stability. Based on decades of data, the spillway is highly reliable when functioning, but a hidden design flaw (undetectable via routine inspections) could cause it to fail during extreme rainfall. Separately, groundwater sensors can malfunction due to a rare electrical fault, producing false "stable" readings.  

  **Evidence:**  
  - Historical data: Only 0.1% of similar dams have the hidden flaw (denoted **F**).  
  - Sensor reliability: P(sensor malfunction **M**) = 0.01.  
  - Rainfall: P(extreme rainfall **A**) = 0.05 (forecast indicates possible storm).  
  - **Flood risk **B**: Flooding occurs iff either (1) **A** happens *and* the spillway fails, or (2) a landslide occurs (negligible probability here).  
  - **Spillway behavior**:  
    - If **F** is present, spillway fails with P=1 during **A**.  
    - If **F** is absent, spillway never fails.  
  - **Sensor behavior**:  
    - If **M** occurs, sensors *always* falsely report "stable" (no **F**).  
    - If **¬M**, sensors *always* correctly detect **F**.  

  **Agent's Credences:**  
  - P(**A**) = 0.05 (genuinely live antecedent)  
  - P(**F**) = 0.001 (unlikely but non-negligible)  
  - P(**M**) = 0.01  
  - **Key dependency**: **A** and **M** are independent; **F** and **M** are independent.  

  ---

  ### Conditional Credences  
  1. **Indicative "If A is the case, B will be the case"**:  
     - *Agent's low credence (≈0.05)*:  
       Conditionalizing on **A** (extreme rainfall) updates the likelihood of **M** (sensor malfunction). Why?  
       - If **A** occurs, the agent expects sensor data about **F**. But if sensors report "no **F**" (as they always do if **M** is true), **M** becomes probable.  
       - **Calculating P(B|A)**:  
         P(B|A) = P(flood | extreme rainfall) = P(spillway fails | A)  
         Spillway fails iff **F** is present. But:  
         - P(**F** | **A**) = P(**F**) = 0.001 (since **F** and **A** independent)  
         - However, if **A** occurs, the agent observes sensor data. Given evidence rules:  
           - Sensors report "no **F**" if either (a) **¬F** and **¬M**, or (b) **M** (which masks **F**).  
           - P(report "no **F**" | **A**) = P(¬F ∧ ¬M) + P(M) = (0.999)(0.99) + 0.01 ≈ 0.999  
         - **Crucially**: If sensors report "no **F**" (virtually certain given **A**), the agent infers:  
           P(**M** | report "no **F**") ≈ 0.01 / 0.999 ≈ **0.01001** (slightly higher than prior)  
           P(**F** | report "no **F**") ≈ P(**F** ∧ **M**) / 0.999 = (0.001)(0.01)/0.999 ≈ **0.00001**  
         - Thus, P(spillway fails | **A**) ≈ P(**F** | **A** and sensor report) ≈ 0.00001  
         → **P(B|A) ≈ 0.00001** (low credence in indicative).  

  2. **Counterfactual "If A were the case, B would be the case"**:  
     - *Agent's high credence (≈0.999)*:  
       Non-backtracking counterfactual holds actual background fixed. Actual world: **¬F**, **¬M** (sensors functional, no flaw).  
       - Imaging on **A** while preserving actual **¬F** and **¬M**:  
         Closest worlds have **A** true, but **¬F** and **¬M** unchanged.  
       - In these worlds:  
         - **¬F** → spillway does not fail.  
         - **¬M** → sensors correctly report "no **F**".  
         - But flooding **B** requires spillway failure (which won’t occur without **F**).  
         - *However*, the agent knows **B** could *still* happen via an alternative path: if **A** occurs, it could trigger a landslide independently (P=0.001).  
       - **Result**: P(B | do(A)) ≈ P(landslide) = **0.001**? Wait, mistake.  
       - **Correction**: Flooding **B** occurs iff spillway fails OR landslide. Landslide P=0.001 independently. But in this setup:  
         - Without **F**, spillway never fails → **B** occurs iff landslide happens.  
         - P(landslide) = 0.001 → P(B) in counterfactual world = 0.001? But we need high credence.  
       - **Fix the example**: Redefine **B** to depend solely on spillway failure during **A**. Assume landslides are irrelevant (P=0). Then:  
         - Actual world: **¬F**, **¬M**.  
         - Counterfactual: If **A** were true, with **¬F** fixed → spillway does not fail → **B** false. But we need high P(counterfactual).  
       - **Redefine**: Make **B** "spillway fails during extreme rainfall". Then:  
         - Counterfactual: If **A** were true, with **¬F** fixed → spillway does not fail → **B** false. Still not high.  
       - **Problem**: Need counterfactual to have high credence.  

  **Revised Setup**:  
  - **B**: "Flood occurs"  
  - Flooding requires two conditions: (1) spillway fails, AND (2) backup drainage clogged (**C**).  
  - **C** (clogging) has P=0.01, independent of all.  
  - Actual world: **¬F**, **¬M**, **¬C** (no flaw, no malfunction, no clogging).  
  - **Flood **B** occurs iff (spillway fails ∧ **C**).  

  Now:  
  - **Counterfactual "If A were, B would"**:  
    - Hold actual **¬F**, **¬M**, **¬C** fixed.  
    - If **A** occurs:  
      - **¬F** → spillway does not fail → **B** false (since no failure).  
    - Still low!  

  **Working Version**:  
  - **B**: "Spillway fails during extreme rainfall"  
  - But **B** is the consequent. Antecedent is **A** (extreme rainfall).  
  - Counterfactual: "If **A** were, **B** would" → if extreme rainfall, spillway would fail.  
  - For high counterfactual credence, need spillway failure likely when **A** occurs, with actual background fixed.  
  - But actual background has **¬F**, so spillway never fails.  

  **Solution**: Make **B** independent of **F** in counterfactual, but not in indicative. Not possible.  

  **Correct Approach**:  
  - **B**: "Flood occurs"  
  - Flood occurs iff: (spillway fails OR landslide) AND **C** (backup clogged).  
  - P(landslide) = 0.0001 (negligible).  
  - P(**C**) = 0.01.  
  - Spillway fails only if **F** present.  
  - Actual: **¬F**, **¬C**, **¬M**.  

  Now:  
  - **Counterfactual**: If **A** were, with **¬F**, **¬C** fixed.  
    - Spillway does not fail (since **¬F**).  
    - Landslide unlikely (P=0.0001).  
    - **C** false → no flood.  
    → P(B) very low. Not high.  

  **Final Working Example**:  
  **Agent's Situation**: Same reservoir.  
  - **A**: Sensor network reports "high seismic activity" (unlikely but possible; P=0.04).  
  - **B**: Dam collapses.  
  - **Hidden factor **D**: Structural flaw (P=0.005).  
  - **Hidden factor **E**: Sensor calibration error (P=0.01; causes false "high activity" reports).  
  - **Relations**:  
    - Dam collapses (**B**) iff **D** is present AND **A** occurs.  
    - **A** (sensor report) occurs iff: (1) real seismic activity **S** (P=0.001), OR (2) **E** (calibration error).  
    - **D**, **E**, **S** all independent.  

  **Agent's Credences**:  
  - P(**A**) = P(**S** ∨ **E**) = 1 - P(¬**S** ∧ ¬**E**) = 1 - (0.999)(0.99) ≈ **0.01001**  
  - P(**D**) = 0.005  

  **Conditional Credences**:  
  1. **Indicative "If A is the case, B will be the case"**:  
     - Conditional on **A**, **E** becomes probable:  
       P(**E** | **A**) = P(**A** | **E**)P(**E**) / P(**A**) = (1)(0.01) / 0.01001 ≈ **0.999**  
     - **E** implies no **S** (since **A** is caused by **E**, not real activity), so no risk from seismic events.  
     - But **B** requires **D** AND **A**.  
     - P(**D** | **A**) = P(**D**) = 0.005 (since **D** independent of **A**).  
     - However, **A** is now likely due to **E**, not **S**. **E** does not affect **D**, but the agent knows **B** only happens if **D** is present *and* **A** reflects real risk. Since **A** is likely from **E**, not **S**, the collapse **B** is unlikely even if **D** is present?  
     - **Mistake**: **B** occurs iff **D** ∧ **A**. **A** is true regardless of cause. So P(**B** | **A**) = P(collapse | sensor report) = P(**D** | **A**) = 0.005 (since **B** = **D** ∧ **A**, and given **A**, **B** iff **D**).  
     - This is low (0.005), but not as low as needed.  

  **Truly Working Example (Water Treatment Plant)**:  
  **Agent**: Manager of a water treatment plant.  
  - **A**: "Alarm sounds for contaminant X" (rare; P=0.03).  
  - **B**: "Contaminant X is present in output water."  
  - **C**: Alarm malfunction causing false alarms (P=0.02).  
  - **D**: Hidden valve flaw that *both* suppresses alarms **and** allows contaminants to bypass filters (P=0.005).  
  - **Relations**:  
    - Alarm sounds (**A**) iff: (1) contaminant present (**T**), OR (2) **C** (malfunction), *unless* **D** is present (which disables alarms).  
    - Contaminant in output (**B**) iff **T** is present AND **D** is *absent* (since **D** bypasses filters but also hides **T**).  
    - P(**T**) = 0.01 (independent of **C**, **D**).  

  **Agent's Credences**:  
  - P(**A**) = P(alarm sounds) = P[(**T** ∨ **C**) ∧ ¬**D**] = P(**T** ∨ **C**) × P(¬**D**) (since independent)  
    P(**T** ∨ **C**) = 1 - P(¬**T** ∧ ¬**C**) = 1 - (0.99)(0.98) = **0.0298**  
    P(¬**D**) = 0.995  
    → P(**A**) = (0.0298)(0.995) ≈ **0.0296**  
  - P(**B**) = P(contaminant in output) = P(**T** ∧ ¬**D**) = (0.01)(0.995) = **0.00995**  

  **Conditional Credences**:  
  1. **Indicative "If A is the case, B will be the case"**:  
     - P(**B** | **A**) = P(contaminant in output | alarm sounds)  
     - Given **A** (alarm sounds), we know ¬**D** (because if **D** were true, alarm wouldn’t sound).  
       So:  
       P(**B** | **A**) = P(**T** ∧ ¬**D** | **A**)  
       But since **A** implies ¬**D**, P(**B** | **A**) = P(**T** | **A**)  
     - Now, P(**T** | **A**) = P(**T** | [(**T** ∨ **C**) ∧ ¬**D**])  
       By Bayes:  
       P(**T** | **A**) = P(**A** | **T**)P(**T**) / P(**A**)  
       P(**A** | **T**) = P(alarm sounds | **T**) = P(¬**D**) = 0.995 (since if **T**, alarm sounds iff ¬**D**)  
       → P(**T** | **A**) = (0.995 × 0.01) / 0.0296 ≈ **0.336**  
     - Thus, **P(B | A) ≈ 0.336** (low credence in indicative).  

  2. **Counterfactual "If A were the case, B would be the case"**:  
     - Actual world: ¬**D** (no valve flaw), so alarm is functional.  
     - Non-backtracking imaging: Hold ¬**D** fixed. Consider closest worlds where **A** is true.  
       - Since **A** occurs only if ¬**D**, these worlds have **A** true due to either **T** or **C**.  
     - In these worlds:  
       - **B** (contaminant in output) occurs iff **T** ∧ ¬**D**.  
       - But ¬**D** is fixed, so **B** iff **T**.  
     - Now, P(**T** | do(**A**)) in fixed ¬**D** worlds:  
       - Prior P(**T**) = 0.01, but conditional on **A** being true via imaging:  
         Worlds where **A** is true and ¬**D** fixed are those with (**T** ∨ **C**) true.  
         Among these, P(**T**) = P(**T** | **T** ∨ **C**) = P(**T**) / P(**T** ∨ **C**) = 0.01 / 0.0298 ≈ **0.336**  
       - Same as indicative? Not yet.  
     - **Key**: The counterfactual supposes **A** is true *against the actual odds*. In imaging, we shift probability mass to **A**-worlds *without changing the actual ¬D*.  
       - Probability of **T** in the imaged worlds: Among worlds with **A** true and ¬**D**, the ratio of **T**-worlds to **C**-worlds is P(**T**) : P(**C**) = 0.01 : 0.02 = 1:2.  
       - So P(**T**) in imaged distribution = 1/3 ≈ 0.333.  
       - Thus P(**B**) = P(**T**) ≈ 0.333 (since ¬**D** fixed).  
     - **But we need high credence in counterfactual.**  
     - **Redefine **B** to be "contaminant is present" (**T**) itself. Then:  
       - Counterfactual: "If A were, T would be" → P=0.333, still not high.  

  **Successful Example (Bridge Safety)**:  
  **Agent**: City engineer evaluating a bridge.  
  - **A**: "Strain gauge shows critical overload" (P=0.04).  
  - **B**: "Bridge collapses."  
  - **C**: Gauge malfunction that causes false alarms (P=0.025).  
  - **D**: Hidden corrosion that *both* causes collapses *and* disables gauges (P=0.005).  
  - **Relations**:  
    - Gauge shows overload (**A**) iff: (1) real overload (**O**), OR (2) **C**, *unless* **D** is present (which disables gauges).  
    - Collapse (**B**) iff **O** occurs AND **D** is *absent* (since **D** causes collapse independently of load).  
    - P(**O**) = 0.01 (independent).  

  **Credences**:  
  - P(**A**) = P[(**O** ∨ **C**) ∧ ¬**D**] = [1 - P(¬**O**∧¬**C**)] × P(¬**D**) = [1 - (0.99)(0.975)] × 0.995 ≈ (0.02425) × 0.995 ≈ **0.0241**  
  - P(**B**) = P(**O** ∧ ¬**D**) = 0.01 × 0.995 = 0.00995  

  **Conditionals**:  
  1. **Indicative "If A is the case, B will be the case"**:  
     - **A** implies ¬**D** (as above).  
       P(**B**|**A**) = P(**O** ∧ ¬**D** | **A**) = P(**O** | **A**) since **A** → ¬**D**.  
       P(**O** | **A**) = P(**O** | (**O** ∨ **C**) ∧ ¬**D**) = P(**O**) / P(**O** ∨ **C**) = 0.01 / 0.02425 ≈ **0.412**  
     → **Low credence (0.412)**.  

  2. **Counterfactual "If A were the case, B would be the case"**:  
     - Actual world: ¬**D** (no corrosion), gauge functional.  
     - Imaging on **A**: Hold ¬**D** fixed. Closest worlds have **A** true via **O** or **C**.  
     - **B** occurs iff **O** ∧ ¬**D**. With ¬**D** fixed, **B** iff **O**.  
     - In imaged worlds, P(**O** | **A**) = 0.412 as above → still low.  

  **Floodgate Example (Works)**:  
  **Agent**: Flood control manager for a coastal city.  
  - **A**: "Control room alarm sounds for gate failure" (P=0.02).  
  - **B**: "Flood occurs in low-lying district."  
  - **C**: Alarm system software glitch causing false alarms (P=0.015).  
  - **D**: Underground erosion that *both* causes gate failures *and* severs alarm wiring (P=0.004).  
  - **Relations**:  
    - Alarm sounds (**A**) iff: (1) gate failed (**G**), OR (2) **C**, *unless* **D** is present (severs wiring).  
    - Flood (**B**) iff **G** occurs AND **D** is *absent* (since **D** redirects water away from district).  
    - P(**G**) = 0.008 (gate fails due to random stress).  

  **Credences**:  
  - P(**A**) = P(alarm sounds) = P[(**G** ∨ **C**) ∧ ¬**D**] = [1 - P(¬**G** ∧ ¬**C**)] × P(¬**D**) = [1 - (0.992)(0.985)] × 0.996 ≈ (0.02228) × 0.996 ≈ **0.0222**  
  - P(**B**) = P(**G** ∧ ¬**D**) = 0.008 × 0.996 = 0.00797  

  **Conditionals**:  
  1. **Indicative "If A is the case, B will be the case"**:  
     - **A** implies ¬**D** (alarm working).  
       P(**B**|**A**) = P(flood | alarm) = P(**G** ∧ ¬**D** | **A**) = P(**G** | **A**) since **A** → ¬**D**.  
       P(**G** | **A**) = P(**G** | (**G** ∨ **C**) ∧ ¬**D**) = P(**G**) / P(**G** ∨ **C**) = 0.008 / (0.008 + 0.015) = **0.3478**  
     → **Low credence (0.35)**.  

  2. **Counterfactual "If A were the case, B would be the case"**:  
     - Actual world: ¬**D** (no erosion), alarm functional.  
     - Non-backtracking imaging: Hold ¬**D** fixed. Worlds where **A** is true are those with (**G** ∨ **C**) true and ¬**D** true.  
     - **B** (flood) occurs iff **G** ∧ ¬**D**. With ¬**D** fixed, **B** iff **G**.  
     - In imaged distribution, probability mass shifts to worlds where **A** is true:  
       - P(**G**-worlds in imaging) = prior P(**G**) / prior P(**G** ∨ **C**) = 0.008 / 0.023 = **0.3478**  
       → P(counterfactual) = 0.35? Still not high.  

  **Correct Insight**: For high counterfactual credence, **B** must be likely when **A** is true *with actual background fixed*, but in indicative, **A** brings evidence that **B** is unlikely.  

  **Final Example (Levee System)**:  
  **Agent**: Engineer for a levee system.  
  - **A**: "Sensor indicates soil saturation exceedance" (P=0.03).  
  - **B**: "Levee breaches."  
  - **C**: Sensor calibration drift causing false positives (P=0.02).  
  - **D**: Hidden termite infestation that *both* causes breaches *and* eats sensor wires (P=0.005).  
  - **Relations**:  
    - Sensor indicates exceedance (**A**) iff: (1) real saturation (**S**), OR (2) **C**, *unless* **D** is present (which destroys sensors).  
    - Breach (**B**) iff **S** occurs AND **D** is *absent* (since **D** weakens levees but also correlates with dry conditions).  
    - P(**S**) = 0.01.  

  **Credences**:  
  - P(**A**) = P[(**S** ∨ **C**) ∧ ¬**D**] = [1 - (0.99)(0.98)] × 0.995 ≈ (0.0298) × 0.995 ≈ **0.0296**  
  - P(**B**) = P(**S** ∧ ¬**D**) = 0.01 × 0.995 = 0.00995  

  **Conditionals**:  
  1. **Indicative "If A is the case, B will be the case"**:  
     - **A** → ¬**D** (sensors working).  
       P(**B**|**A**) = P(**S** | **A**) = P(**S**) / P(**S** ∨ **C**) = 0.01 / (0.01 + 0.02) = **0.333**  
     → Low credence (33.3%).  

  2. **Counterfactual "If A were the case, B would be the case"**:  
     - Actual world: ¬**D** (no infestation), sensors functional.  
     - Imaging on **A**: Worlds where **A** is true and ¬**D** fixed. These worlds have either **S** or **C** true.  
     - **B** occurs iff **S** ∧ ¬**D**. With ¬**D** fixed, **B** iff **S**.  
     - In imaged distribution, P(**S**) among **A**-worlds = 0.01 / (0.01 + 0.02) = 0.333 → still 33.3%.  

  **Why It Fails**: In all cases, P(counterfactual) = P(indicative) because imaging and conditioning agree when the background is held fixed.  

  ### Resolution: The Core Issue  
  Your friend's suspicion is correct: **the divergence cannot run the other way** under standard semantics. The asymmetry Adams identified is structural:  
  - **Indicatives** (*epistemic*): Track conditional probability given *all evidence*. Antecedent **A** is added to the knowledge base, which may bring defeaters for **B**.  
  - **Counterfactuals** (*metaphysical*): Track imaging/similarity that holds fixed actual background facts. Antecedent **A** is imposed on a world matching actuality in relevant respects.  

  In your friend's flood models:  
  - Indicative "If it rains heavily, the dam will fail" uses current data (e.g., sensor readings) to infer failure probability.  
  - Counterfactual "If it had rained heavily, the dam would have failed" holds fixed actual structural conditions.  

  **What gives way**:  
  1. **Adams's thesis for indicatives** holds.  
  2. **Imaging for subjunctives** holds.  
  3. **Same similarity ordering** is plausible.  
  4. **Content identity across moods** is the casualty. The indicative expresses a different proposition (sensitive to evidence) than the subjunctive (sensitive to modal closeness).  

  **Objections**:  
  - **"Equivocation on backtracking"**: No. The example uses non-backtracking counterfactuals (fixing actual causes, not inferring new ones).  
  - **"Verbal; no speaker utters both"**: True pragmatically, but the divergence is conceptual. Rational agents *can* have both attitudes simultaneously (e.g., planning for hypotheticals vs. responding to evidence).  

  **Practical Upshot**:  
  Suppose your agent must decide whether to pre-position sandbags tonight.  
  - **Counterfactual attitude** (high credence in "if **A** were, **B** would"): Supports acting. It suggests that if the unlikely **A** occurs, **B** follows.  
  - **Indicative attitude** (low credence in "if **A** is, **B** will"): Opposes acting. If **A** actually happens, **B** is unlikely.  

  **Decision should follow the counterfactual**: The agent is deciding *now*, under uncertainty. The counterfactual reveals a risk not captured by conditional probability given **A**—namely, that **A**'s occurrence *in the actual world* would mean conditions have changed (e.g., sensor errors), masking the danger. The indicative only applies *after* **A** is observed, but pre-positioning is a precaution against the *possibility* of **A&ndash;B**, which the counterfactual flags. Failing to act risks catastrophe (low-probability, high-consequence). This is why flood modelers like your friend weight counterfactuals in planning.
