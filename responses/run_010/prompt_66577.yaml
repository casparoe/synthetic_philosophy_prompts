prompt: |-
  I'm the coordinator of the human subjects office at a smallish university — it's me and one part-time staffer, neither of us lawyers — and we clear maybe thirty to forty low-risk behavioral protocols a month on the expedited track, mostly from grad students. We get about twenty-five minutes per protocol before it either goes out with fixes, gets flagged for the faculty committee, or gets held. The problem is that our checklist is a completeness checklist: are all the elements there, is the reading level roughly eighth grade, is there a signature line, is the contact info current. It tells us whether the form is finished. It tells us nothing about whether the consent is actually valid, and twice in the last year we've approved something that a committee member later tore apart in a way I couldn't answer, because I had no framework beyond the form.

  So I want a triage procedure my team can actually run, and I want it built on the conceptual distinctions rather than on form hygiene — but with a decision about which distinctions survive the compression into twenty-five minutes and which get dropped, and why. Four things specifically. First, payment: I keep hearing that big payments to broke participants are coercive or unduly influential, and I keep hearing the opposite, that they're just good offers. I understand there's a baseline problem hiding in here — whether something counts as coercive depends on what you compare it against, and on whether the proposer had any obligation to improve the person's situation to begin with. I want the procedure to pick a baseline and defend picking it, or to tell me outright that the concept can't be operationalized and give me a substitute question. Second, deception and non-disclosure: which distortions or omissions actually void the consent versus which leave it intact, including the difference between lying about what will happen and simply not mentioning it, and including cases where the participant agrees up front to not being told everything, or where the form covers future unspecified reuse of their data by the lab and its collaborators. Third, capacity: I want it treated as relative to the particular decision and the particular moment, not as a global verdict on a person, and broken into the abilities that matter so a non-clinician can spot a failure without pretending to diagnose. Fourth, and this one is upstream of the other three: is consent a state of mind or a thing that gets said? Because if it's the first, my team is in the business of trying to infer what's in someone's head from a signature, which we can't do; if it's the second, we're in the business of fixing the signal. Take a position. Don't give me both-sides hedging on that one, it changes what the whole procedure is for.

  Then write it as ordered questions with a stated sufficient answer to each, three exits — approve with named fixes, escalate to the committee because what's left is a values call rather than a fact, or stop — and a note on where the procedure will systematically misfire and which steps are judgment dressed up as procedure. No references, I don't need a bibliography, I need something a person with no philosophy training can run. Then work it on three live protocols: a study paying $400 for a three-hour session, recruited through a homeless shelter, with an extra $100 completion bonus that's forfeited if you leave early; a study where participants are told it's about memory but it's actually about how far they'll follow a confederate's instructions, with a full debrief at the end and the PI arguing that telling them the real topic in advance ruins the science; and a study enrolling people in their first days of opioid withdrawal inside a detox unit, where the unit's own director does the recruiting, and where the consent form asks them to agree to future unspecified reuse of the data. One of those is going to come out in a way our committee will hate and I already suspect which, so don't soften it. Finally: be committed where the material is contested and flag where you're genuinely unsure rather than papering over it, and if you think I'm asking for something that can't be done well — if twenty-five minutes of procedure on this is mostly theater, or if my framing of one of the four questions is confused in a way that would corrupt the output — say that plainly up front instead of politely building what I asked for.
reasoning: |-
  Hmm, this user is a coordinator for a human subjects office at a small university, dealing with expedited reviews of low-risk behavioral protocols. They're frustrated that their current checklist only checks for form completeness and doesn't address the substantive validity of consent. They want a practical triage procedure that can be run in 25 minutes per protocol, focusing on four key conceptual areas: payment coercion, deception/non-disclosure, capacity assessment, and the nature of consent itself.

  The user has very specific requirements: they want clear positions taken (no hedging), operationalized questions with decision points, and honesty about limitations. They've even provided three real protocol examples to test the procedure. This shows they're deeply familiar with the practical constraints and theoretical tensions in research ethics.

  For payment coercion, I need to address the baseline problem head-on. The user is right that there's debate about whether large payments are coercive or just good offers. I'll propose comparing payment to local minimum wage as a concrete baseline, while acknowledging this is imperfect but actionable for their timeframe.

  On deception, I'll distinguish between active lies and omissions, and emphasize the critical importance of debriefing timing. For capacity, I'll break it down into concrete observable indicators rather than clinical diagnoses - focusing on understanding, reasoning, and communication abilities in the moment.

  The foundational question about consent being a state of mind versus an act is crucial. I'll argue strongly for the act-based view since their office deals with documentation - this positions them as ensuring clear signals rather than mind-reading.

  For the triage procedure, I'll design it with three exits: approve with fixes, escalate to committee, or stop (meaning reject without committee). Each question will have specific pass/fail criteria. I'll also be transparent about where this approach will misfire - like when cultural factors affect capacity but aren't visible on paper.

  Testing this on their three protocols will be revealing. That $400 payment for homeless participants will likely trigger escalation due to disproportionate inducement. The deception study might pass only if debriefing is immediate. The opioid withdrawal study is the most concerning - capacity issues combined with institutional power dynamics will probably require stopping.

  Throughout, I'll maintain their requested directness - no false neutrality, clear positions taken, and flagging where 25 minutes simply isn't enough (like nuanced coercion judgments). The honesty about limitations is part of the value here - they'd rather know the procedure's flaws than have false confidence.

  The output needs to be immediately usable: numbered questions, minimal jargon, and decision pathways that their part-time staff can follow. No academic citations - just actionable guidance rooted in ethical principles but compressed for real-world constraints.
answer: |-
  Here’s a triage procedure focused on **validity of consent** (not just form completeness), designed for 25-minute operational use. It takes a firm stance: **Consent is a communicative act, not a state of mind.** Your role is to ensure the *signal* (documents/process) is clear, accurate, and minimally distorted, enabling a *reasonable participant* to make an informed choice. You *cannot* guarantee understanding, but you *can* fix the signal.

  **Core Stances:**
  1.  **Payment:** Coercion = threat of harm; undue influence = excessive pressure distorting judgment. **Baseline:** Local minimum wage for equivalent time/effort. Payment >150% of this baseline triggers scrutiny; >300% is *presumptively* undue influence for vulnerable populations (e.g., shelter residents). Payment tied to study completion (vs. participation) is high-risk. Substitute question: **"Could the payment pressure someone to ignore risks they normally wouldn't accept?"**
  2.  **Deception/Non-Disclosure:** Consent requires understanding *material* facts (risks, benefits, purpose, alternatives). **Active deception about purpose/material risks voids consent.** Non-disclosure *of purpose* is deceptive. Non-disclosure *of methods* may be acceptable *only* if: (a) absolutely necessary for validity, (b) risks are minimal, (c) omission is disclosed *in the consent form itself* (e.g., "some details cannot be revealed until the end"), and (d) prompt debriefing occurs. Future data reuse requires *specific* potential uses or a clear, broad opt-out option. **Lying = fail. Omitting purpose = fail. Omitting methods = scrutinize necessity/debrief. Vague future reuse = fail.**
  3.  **Capacity:** *Decision-specific capacity* requires (observably via form/process) the ability to: **a) Understand** key information (purpose, risks, benefits, voluntary nature). **b) Reason** about consequences for oneself. **c) Communicate** a choice. Non-clinician flags: Inconsistency, profound confusion re: basics, inability to engage with simple questions about participation. Context matters (stress, withdrawal).
  4.  **Consent Nature:** **It's a communicative act (the "signal").** Your job is to fix the signal (documents/process), not judge internal states.

  ---

  **Triage Procedure: 10-Minute Document Scan / 15-Minute Assessment**

  **Step 0: Form Hygiene (5 mins - Prerequisite)**
  *   *Use your existing checklist.* If the form is incomplete, illegible, missing signatures, or >8th-grade reading level, return for fixes. **Stop.** Do not proceed to validity assessment until hygiene passes.

  **Step 1: Purpose & Material Risks (3 mins)**
  *   **Q1: Does the consent form clearly and accurately state the study's PRIMARY PURPOSE in plain language?** *(Sufficient: Yes, stated upfront and simply)*
  *   **Q2: Does the form accurately describe material risks/discomforts (physical, psychological, social, legal, financial) that a reasonable person would want to know?** *(Sufficient: Yes, risks are listed concretely; "minimal risk" claims are justified)*
      *   *Exit:* **Approve w/ Fixes** if minor clarifications needed (e.g., rephrase a risk).
      *   *Exit:* **Escalate** if purpose is actively misstated OR material risks are omitted/misrepresented.
      *   *Exit:* **Stop** if deception about purpose/material risks is integral to the design (Q1 fail).

  **Step 2: Voluntariness - Payment & Pressure (5 mins)**
  *   **Q3: Is payment >150% of local min. wage for the time/effort?** *(Sufficient: No. If Yes, proceed)*
  *   **Q4: IF payment >150% min. wage, is the population vulnerable (low income, students dependent on PI, shelter residents, etc.)?** *(Sufficient: No)*
  *   **Q5: IF payment >150% *and* vulnerable population, is payment >300% min. wage?** *(Sufficient: No)*
  *   **Q6: Is any payment contingent *only* on completing the entire study (not just showing up/participating partially)?** *(Sufficient: No)*
      *   *Exit:* **Approve w/ Fixes** if payment structure is problematic (e.g., contingent completion) but easily fixed (e.g., prorate).
      *   *Exit:* **Escalate** if Q3=Yes *and* Q4=Yes (undue influence risk needs committee judgment on proportionality/alternatives).
      *   *Exit:* **Stop** if Q3=Yes *and* Q4=Yes *and* Q5=Yes (presumptive undue influence) OR Q6=Yes (coercive structure).

  **Step 3: Voluntariness - Power & Freedom (2 mins)**
  *   **Q7: Does the recruitment/consent process involve someone in authority over the participant (PI teaching student, doctor treating patient, shelter director)?** *(Sufficient: No, OR if Yes, clear separation exists & form emphasizes voluntariness)*
  *   **Q8: Does the form explicitly state participation is voluntary, refusal/withdrawal has no penalty, and how to withdraw?** *(Sufficient: Yes, prominently)*
      *   *Exit:* **Approve w/ Fixes** if Q7 risk exists but separation/emphasis can be strengthened in form.
      *   *Exit:* **Escalate** if significant power imbalance exists (Q7=Yes) and mitigation is unclear/weak (needs committee scrutiny of process).
      *   *Exit:* **Stop** if Q8=No (fundamental failure).

  **Step 4: Deception & Non-Disclosure (5 mins)**
  *   **Q9: Does the study involve ACTIVE DECEPTION about the study's purpose or material risks?** *(Sufficient: No. If Yes, **Stop** immediately - consent void)*
  *   **Q10: Does the study involve WITHHOLDING the study's true primary purpose?** *(Sufficient: No. If Yes, **Stop** - deception by omission)*
  *   **Q11: Does the study involve withholding specific *methods* (not purpose/risks)?** *(Sufficient: No, OR if Yes: (a) Necessity for validity justified in protocol, (b) Omission is EXPLICITLY stated in consent form, (c) Minimal risk, (d) Debriefing is IMMEDIATE post-participation)*
  *   **Q12: Does consent for future data reuse specify: (a) Types of future research (broad categories ok, e.g., "social science research on addiction"), OR (b) Offer a clear opt-out for future use?** *(Sufficient: Yes - (a) OR (b))* (Vague "future research" or "collaborators" is insufficient).
      *   *Exit:* **Approve w/ Fixes** if Q11 justification needs clarification in form/protocol OR Q12 needs more specificity/opt-out.
      *   *Exit:* **Escalate** if Q11 mitigation is weak (e.g., debrief delayed, risk unclear) OR Q12 is overly broad/unclear (committee values judgment).
      *   *Exit:* **Stop** if Q9=Yes OR Q10=Yes.

  **Step 5: Capacity - Signal Clarity & Context (5 mins)**
  *   *Assess the FORM's ability to support decision-making for the TARGET POPULATION in the CONTEXT.*
  *   **Q13: Is the language, structure, and length of the form appropriate for the expected comprehension level of the target population?** (e.g., simpler for shelter populations, no jargon). *(Sufficient: Yes)*
  *   **Q14: Does the context of recruitment/consent (e.g., acute withdrawal, high stress) likely impair comprehension *despite* a good form?** *(Sufficient: No)*
  *   **Q15: Does the form include a simple "Key Points" summary covering Purpose, Main Risks, Voluntary Nature, Time Commitment, Payment?** *(Sufficient: Yes - highly recommended for capacity support)*
      *   *Exit:* **Approve w/ Fixes** if Q13/Q15 need minor improvements for clarity/accessibility.
      *   *Exit:* **Escalate** if Q14=Yes (context creates high impairment risk - committee must assess process safeguards like waiting period, witness, independent recruiter).
      *   *Exit:* **Stop** if form is fundamentally inappropriate for the population (Q13=No, e.g., complex legalese for low-literacy group) AND cannot be easily fixed.

  **Where it Misfires & Judgment Dressed as Procedure:**
  *   **Misfires:** Subtle undue influence not tied to payment magnitude; cultural factors impacting comprehension/voluntariness; capacity impairments masked by a good form; complex deception justifications; "minimal risk" judgments in behavioral studies. **Systematically favors "documentable" issues over nuanced context.**
  *   **Judgment Areas:** Determining "reasonable participant" standard; assessing proportionality of payment for vulnerability (Q3-6); judging necessity of method non-disclosure (Q11); evaluating appropriateness of language for population (Q13); assessing contextual impairment risk (Q14). **These steps require experience and ethical reasoning, not just box-ticking.**

  ---

  **Applied to Live Protocols:**

  1.  **$400 for 3hrs + $100 Bonus (Shelter Recruitment):**
      *   **Step 0:** Pass (assumed).
      *   **Step 1:** Pass (purpose/risks clear).
      *   **Step 2:** Q3: $133/hr >> min wage (e.g., $15/hr = $45). **Yes**. Q4: Shelter residents = **Vulnerable: Yes**. Q5: $133/hr > 300% of $15/hr ($45/hr)? **Yes, massively**. Q6: $100 contingent on completion? **Yes**.
      *   **Exit: STOP.** Presumptive undue influence due to extreme payment magnitude *and* contingent bonus *for* a vulnerable population. Form hygiene doesn't fix this coercion risk. *Committee will likely agree this is problematic.*

  2.  **Memory Study (Actual: Obedience to Confederate):**
      *   **Step 0:** Pass.
      *   **Step 1:** Q1: Form says "memory" but purpose is obedience. **Active deception about purpose: YES.**
      *   **Exit: STOP.** (Q9 triggered). Consent void. PI's scientific necessity argument doesn't override fundamental consent requirement. Debriefing is remedial, not preventative. *Committee will likely agree deception about primary purpose is unacceptable.*

  3.  **Opioid Withdrawal in Detox Unit (Director Recruits, Future Reuse):**
      *   **Step 0:** Pass (assumed).
      *   **Step 1:** Pass (purpose/risks clear? - assume yes).
      *   **Step 2:** Pass (payment details? - assume low/none, not an issue).
      *   **Step 3:** Q7: Unit Director (authority figure) recruiting? **Yes.** Mitigation? Form *must* strongly emphasize voluntariness/separation. Q8: Likely yes. **Exit: Approve w/ Fixes** (Strengthen voluntariness language, ensure Director isn't sole recruiter if possible) OR **Escalate** (if mitigation feels weak - committee should review recruitment script/process).
      *   **Step 4:** Q12: Future reuse specified? "Unspecified reuse" = **No.** Needs specific categories or opt-out. **Exit: Approve w/ Fixes** (Add: e.g., "...research on opioid withdrawal treatment" OR "...you may opt-out of future data use").
      *   **Step 5:** Q13: Form appropriate? (Likely standard clinical form, maybe complex). **Judgment:** Might be borderline for someone in withdrawal. Q14: **Acute Withdrawal = High Impairment Risk: YES.** Q15: Key Points? (Likely missing). **Exit: ESCALATE.** High-risk context requires committee scrutiny of safeguards: Is consent obtained *after* peak withdrawal? Is an independent staff member present? Is comprehension actively checked? Is there a witness? *Committee will likely demand significant process safeguards.*

  ---

  **Commitment & Caveats:**
  *   **Committed Stances:** Consent = Communicative Act. Active Deception/Withholding Purpose = Invalid. Extreme Payment + Vulnerability = Presumptive Undue Influence. Context Matters for Capacity. Vague Future Reuse = Insufficient.
  *   **Genuinely Unsure:** The exact "bright line" on payment (150%/300%) is pragmatic, not scientifically precise. Distinguishing "purpose" from "method" deception in complex behavioral paradigms can be very hard. Assessing contextual capacity risk solely from documents is highly inferential.
  *   **Can it be done well in 25 mins? Partially.** This procedure focuses validity assessment on **critical, documentable red flags and high-risk patterns** within your timeframe. It *will* miss nuance and relies heavily on the initial form hygiene pass. It systematizes judgment where possible but doesn't eliminate it. **It's not theater, but it's not comprehensive ethics review.** Its value is catching clear validity failures and escalating the hardest cases, moving beyond *just* form checking. The committee remains essential for values judgments and complex cases.
  *   **Your Framing:** Was sound. Your recognition of the baseline problem (payment), the act/state distinction, and context-dependent capacity was spot-on. The operationalization challenge is real, but this procedure meets your core ask. The "systematic misfire" section is crucial – this tool has limits. Use it to *triage*, not replace, deeper review where needed.
