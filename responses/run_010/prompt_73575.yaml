answer: |-
  ### Construction

  **Specification 1 & 2: Incumbent Holds Firm, Entrant Gives Way**  
  *Incumbent's Procedure (filed first):*
  ```python
  def incumbent_decision(opponent_code: str) -> str:
      return "Hold Firm"  # Unconditional commitment
  ```
  *Entrant's Procedure (after reading incumbent's code):*
  ```python
  def entrant_decision(opponent_code: str) -> str:
      # Test if opponent_code always returns "Hold Firm" on any input
      test_inputs = ["", "dummy", "any_string"]  # Diverse, non-specific inputs
      results = {execute(opponent_code, inp) for inp in test_inputs}
      if results == {"Hold Firm"}:  # Unconditional if all outputs agree
          return "Give Way"
      else:
          return "Hold Firm"
  ```
  **Why entrant is correct:**  
  The entrant runs the incumbent's code on multiple arbitrary inputs. If *any* input yields "Give Way", the condition fails and the entrant holds firm. A bluff (e.g., code with a hidden "Give Way" branch) will output "Give Way" for some test input (e.g., an input triggering the branch), exposing the bluff. Transparency eliminates bluffing because the entrant verifies behavior, not appearance.  

  **Specification 3:**  
  No opponent-specific data; tests general behavior.  

  **Specification 4: Ex Post Irrationality**  
  If the entrant held firm, the incumbent would prefer to give way (avoiding disaster). But since the entrant *always* gives way against a verified commitment, the disaster never occurs. The incumbent pays no cost because its commitment deters the entrant.  

  **Specification 5: Simultaneous Firm-Holding Tie-Break**  
  *Anonymous tie-break rule:*  
  ```python
  def agent_decision(own_code: str, opponent_code: str) -> str:
      if hash(own_code) < hash(opponent_code):  # Compare hashes for anonymity
          return "Hold Firm"
      elif hash(own_code) > hash(opponent_code):
          return "Give Way"
      else:  # Byte-for-byte identical
          return "Give Way"  # Both give way, avoiding disaster
  ```
  - **Identical filings:** Both give way (mutual yield).  
  - **Anonymity:** Depends only on the content of the codes, not filer identity.  

  ---

  ### Resolving the Argument  
  **Key feature enabling commitment:**  
  The ability to *verify* opponent behavior via code execution (entrant tests incumbent’s code).  

  **Incumbent’s advantage with garbled channel (5% error):**  
  Fails. Garbling breaks verification: the entrant may misjudge the incumbent’s code, leading to mutual firmness (disaster) or incorrect yielding.  

  **Friend’s objection:**  
  "This is just Stackelberg leadership; code transparency adds nothing beyond moving first."  

  **Does the objection land?**  
  **Yes, but only without verification.**  
  - In a Stackelberg game, the leader commits to an action; here, the incumbent commits to *code that enforces the action*.  
  - **What adds value:** Verification. The entrant doesn’t trust the filing; it *proves* the incumbent’s commitment via execution. This eliminates cheap talk and bluffing.  
  - **For the objection to fail:** The setting must require *verifiable execution* of commitments (not just announcements). Here, the entrant’s ability to run the incumbent’s code transforms transparency into a trustless enforcement mechanism.  

  **Verdict:**  
  The objection holds if only the order of moves matters, but it fails when the second mover *uses the code to verify behavior*, making transparency pivotal.
