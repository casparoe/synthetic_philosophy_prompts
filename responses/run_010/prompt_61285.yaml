            - Duane's point about the district's fallback being a bluff: We must use the best available estimate of the standalone cost ($95M) provided by staff. If the district chooses to violate permits and face fines, that is a risk they take, but it is not a reliable fallback for planning purposes. Our agreement should be based on the engineering and economic realities.
            - For the industrial park in 2029: Rule K extends to multiple parties, but it becomes more complex. We will use a weighted extension of the Kalai-Smorodinsky solution, where weights are based on the median household income of the service area for public entities and on a measure of ability to pay for commercial/industrial entities (to be defined in the agreement). 

          Strongest case for Rule N in raw dollars (the losing side):

            "The Nash solution in raw dollars is the most widely accepted method for bargaining problems because it is based on the fundamental principle that the outcome should only depend on the parties' outside options. It does not introduce external factors like income levels, which are properly addressed through the tax system. By splitting the savings equally in dollar terms, both parties benefit equally from the cooperation. The district's higher standalone cost is a reflection of their own infrastructure challenges, and it is not fair to ask Fairview's residents to subsidize the district's share. Furthermore, the district's threat to avoid their standalone project by continuing to violate their permit is not a credible alternative because the state will eventually intervene, and the cost will be borne by the district's residents regardless. Using the $95M standalone cost is our best estimate, and the Nash solution provides a clear, objective, and defensible split."

          Given the two-page constraint, we must be concise.

          Let's draft.
