  **MEMORANDUM**  
  To: Cedar Basin Regional Water Authority Board  
  From: [Your Name], Chair, Finance Subcommittee  
  Date: November 7, 2023  
  Subject: Recommendation on Cost Allocation for the Advanced Treatment Plant  

  ### I. RECOMMENDATION  
  Adopt **Rule K (Kalai-Smorodinsky) with ability-to-pay weighting** for allocating the $180M plant costs between Fairview and Sanitary District No. 4. Under this approach:  
  - **Fairview pays $126M** ($1,400 per household/year, ~1.8% of median income).  
  - **District pays $54M** ($1,190 per household/year, ~2.9% of median income).  
  This balances equity, stability, and future scalability. For the 2029 industrial park interconnection, we will apply cost causation (flow/pollutant load) to assign direct costs, with Rule K (weighted) allocating residual joint costs.  

  ### II. KEY FIGURES AND RATIONALE  
  - **Rule K with weighting** accounts for both parties’ economic realities. It achieves:  
    - **Fairness**: District households (median income: $41k) pay a manageable share (~2.9% of income) vs. 3.6% under Rule N.  
    - **Savings focus**: Both parties save significantly vs. standalone costs (Fairview: $140M → $126M; District: $95M → $54M).  
    - **Standing rule clarity**: Extends cleanly to future parties (e.g., industrial park) via weighted bargaining over joint costs after direct cost causation.  

  ### III. ADDRESSING CORE ISSUES  
  **1. Axiom Fight: Substance or Disguised Metric Debate?**  
  The Nash (Rule N) vs. Kalai-Smorodinsky (Rule K) debate in *raw dollars* is **not substantive here**—both yield identical 50/50 splits ($112.5M/$67.5M) due to our "flat" savings frontier. The real conflict is whether to use **raw dollars vs. ability-to-pay weighted dollars**. Bargaining axioms *cannot* resolve this—it is a **distributive justice choice** we must own publicly. Weighting dollars by income (1/median income) prioritizes equitable burden-sharing.  

  **2. Can "Better Outside Options Hurt You"?**  
  **No—not in our setup.** Staff is correct: the flat savings frontier prevents this paradox. If the district’s $30M grant materializes, Rule K (weighted) *still* ensures proportional gains. Rule N would *not* penalize the district, but Rule K provides psychological/political reassurance against perceived unfairness.  

  **3. Handling the District’s "Bluff" Fallback**  
  Duane’s concern about the $95M standalone cost being unrealistic is valid. However:  
  - **Rule K’s weighting** mitigates risk: even if the $95M is overstated, the district still pays a feasible share ($54M).  
  - **Fallbacks must be based on documented costs** (e.g., permits/fines). Bluffs undermine trust; we use staff’s $95M estimate but monitor compliance.  

  **4. Third-Party (Industrial Park) Scalability**  
  - **Rule K extends cleanly**: Add the industrial park’s standalone cost and "best case" savings to the bargaining model.  
  - **Weighting**: Assign weights for public entities (median income) and commercial users (e.g., tax valuation/job metrics).  
  - **Cost causation first**: Direct costs (e.g., pipes for the park) are assigned by usage; residuals (e.g., shared plant capacity) use Rule K.  

  ### IV. STRONGEST CASE FOR RULE N (RAW DOLLARS)  
  "Rule N’s strength is its simplicity and fidelity to true economic bargaining. It splits savings 50/50 *because* that’s where both parties—facing real standalone costs—have equal power to walk away. Weighting dollars by income injects redistribution into what should be a voluntary deal. Fairview’s residents already fund their city services; they shouldn’t subsidize the district’s historical underinvestment. The district’s lower income is a county-wide policy issue, not a water authority problem. Rule N’s $67.5M district share may be high per household, but it reflects the district’s actual $95M fallback cost—which, fines or not, *will* come due if they walk away. Bargaining theory exists to divide cooperation gains, not equalize society."  

  ### V. CONCLUSION  
  Rule K with ability-to-pay weighting delivers a sustainable, defensible split. It recognizes that the district’s limited resources require flexibility, while Fairview’s capacity ensures project stability. The attached term sheet outlines implementation. We move to approve this for the November 14 vote.  

  ---  
  **Attachment**: Term Sheet with Cost Allocations  
  - **Total Project Cost**: $180M  
  - **Fairview Share**: $126M  
    - Annual/household: $1,400 (~1.8% of $78k income)  
  - **District Share**: $54M  
    - Annual/household: $1,190 (~2.9% of $41k income)  
  - **Savings Achieved**: $55M (vs. combined standalone costs)  
  - **Third-Party Protocol**: Cost causation for direct usage + Rule K (weighted) for residuals.
