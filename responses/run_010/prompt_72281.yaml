  On differential coherence: if preferences are coherent under Savage but not Jeffrey, which "constitutive" framework applies? The view must either commit to one axiomatization (arbitrary) or make agency relative to interpretation schemes. Both hurt. This is a major weakness.

  For irrationality intuitions: the view struggles because it can't call violations irrational - just non-agential. But we do call e.g. intransitivity irrational. Best to concede this and say those intuitions track approximate agency.

  Diachronic arguments: with foresight permitted, pumps lose force. The constitutive view handles this well by requiring stable plans as part of agency. That's a point in its favor.

  Non-probabilistic judgments: here the "improvement on reflection" saves it, but the view must admit that partial agency exists. Another concession point.

  Unfalsifiability is the big one. If the constitutive reading can always retreat to "they weren't agents," it risks being vacuous. The user must accept this danger and add criteria for failed interpretation.

