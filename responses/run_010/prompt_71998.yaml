prompt: |-
  I'm teaching one 80-minute session in a law school elective on probability and proof — mostly 2Ls and 3Ls who've done two weeks of likelihood ratios, plus three JD/econ PhDs who'll swallow the room if I let them. Slides are banned in this course, so it's me and a whiteboard. Topic is the common prior assumption and Aumann's result that Bayesians sharing a common prior can't agree to disagree once their posteriors become common knowledge. I want them leaving able to say something intelligent about what two dueling expert witnesses still disagreeing actually proves, and right now they're going to walk in assuming it proves one of them is lying or bought.

  Don't explain the theorem to me, plan how I should teach it. What order the pieces go in and what depends on what — my guess is that "your posterior is just a function of your prior plus your own private information" has to be nailed down before anything else, but tell me if that's the wrong first move. Build the session on one example with two experts in a case that looks like a real one (no hats, no envelopes, no muddy children) and it has to do double duty: first showing that identical priors plus different private evidence legitimately produce different numbers, then getting turned around so those same two people, once they've said their numbers out loud across a deposition table, are squeezed into agreement. Say what that example has to have and what it must not have.

  Then map the misconceptions and pin down the exact point in the sequence where each one gets headed off. My guesses: common prior = they'd have agreed before the trial started, common knowledge = both of them know it, and "different priors" as an all-purpose get-out card. Two of the econ students will have read somewhere that the assumption isn't even testable, since it only constrains beliefs about evidence nobody actually has — where does that objection get raised, and do I concede it? Also tell me whether there's room for the version where they announce and re-announce and the numbers iterate together, or whether I cut that and just do the static result. And the no-speculative-trade cousin of all this: ten minutes, or one sentence and move on?

  Last, give me something I can run in the final five minutes that shows whether the idea landed rather than whether they liked me, and tell me what I should refuse to cover at this level and say out loud that I'm skipping it. No reading list, they won't read it and I won't check.
reasoning: |-
  Okay, the user is teaching a law school elective on probability and proof, specifically focusing on the common prior assumption and Aumann's agreement theorem. They need a lesson plan that fits into 80 minutes without slides, using only a whiteboard. The students are mostly 2Ls and 3Ls with some JD/econ PhDs mixed in. The main goal is to help students understand why two expert witnesses might legitimately disagree initially but must converge if they share a common prior and their posteriors become common knowledge.

  First, I need to recall Aumann's theorem. It states that if two Bayesians share a common prior and their posterior beliefs become common knowledge, then those posteriors must be equal. The key elements here are the common prior, Bayesian updating, and common knowledge. The challenge is to explain this without complex math, using a legal context.

  The user wants a single example that serves two purposes: showing how different private evidence leads to different posteriors, and then demonstrating how common knowledge forces agreement. The example needs to be realistic for a legal setting—no abstract puzzles like hats or muddy children. It should avoid any elements that might imply dishonesty or bias, as the misconception is that disagreement proves one expert is lying.

  I'm considering a medical malpractice case with conflicting expert testimonies on whether a standard of care was breached. Let's say the prior probability is based on general statistics (e.g., 30% of such cases involve breach). Each expert gets different private evidence: one sees an ambiguous email suggesting negligence, the other sees a witness statement defending the doctor. They update their beliefs to different posteriors (say 70% and 40%). This illustrates legitimate disagreement due to private information.

  Next, to show convergence, the experts share their posteriors in a deposition. Common knowledge means each knows the other's posterior and knows that the other knows, etc. Using Bayes' rule, they realize their combined evidence must be consistent. If they share likelihood ratios, they can recalculate the posterior together. For simplicity, maybe skip iterative announcements and go straight to joint calculation after sharing.

  Common misconceptions to address:
  - **Common prior ≠ same prior beliefs**: Emphasize it's about hypothetical agreement before any private evidence.
  - **Common knowledge ≠ simple knowledge**: Stress that it's mutual awareness of each other's beliefs.
  - **"Different priors" as an escape hatch**: Acknowledge it but note that in legal contexts, experts often base priors on same field knowledge.
  - **Untestability of common prior**: Briefly concede that it's a modeling assumption but useful for understanding rational disagreement.

  For the no-speculative-trade point, maybe just a one-sentence mention to connect to related concepts without diving in.

  Assessment: In the last five minutes, pose a hypothetical where after sharing posteriors, one expert changes their mind. Ask students to explain why, using the framework. This checks if they grasp that common knowledge forces agreement.

  What to skip: Avoid the formal partition model, measure theory, or infinite regress of knowledge. Focus on intuition and practical implications for legal experts.

  Structurally:
  1. **Hook with legal scenario** (5 mins): Present the malpractice case.
  2. **Posterior as function of prior + evidence** (15 mins): Whiteboard Bayes' theorem, show each expert's update.
  3. **Disagreement is legitimate** (10 mins): Discuss why different evidence leads to different conclusions.
  4. **Deposition as common knowledge** (20 mins): Experts share numbers, recalculate jointly.
  5. **Address misconceptions** (15 mins): Clarify common prior, common knowledge, different priors.
  6. **Assessment** (5 mins): Quick hypothetical to test understanding.

  Timing is tight, so need to keep each section focused. The example must be clear enough to handle both phases without confusion. Emphasize that initial disagreement doesn't imply dishonesty, and convergence is rational under the assumptions.
answer: |-
  Here's a battle-tested lesson plan for your 80-minute session. It's built around a single legal case example designed to do the heavy lifting, with strategic misconception-stomping at key points. **Core philosophy:** Anchor everything in the expert witnesses' perspective, and make the math serve the legal intuition.

  ### **The Core Example: "The Ambiguous Medical Device" (Malpractice Case)**
  **Why it works:** It's realistic (plausible evidence types), forces Bayesian updating, and has binary states for simplicity.  
  **Facts:**  
  - **Issue:** Did Surgeon breach standard of care by using Device X? (State: BREACH or NO BREACH)  
  - **Common prior (P):** 30% chance of breach (based on industry-wide data). *This is agreed by all rational players pre-trial.*  
  - **Expert A (Plaintiff):** Sees **Private Evidence A** = Email from surgeon saying "Device X is tricky, but I'll wing it." *Likelihood*: P(Email | BREACH) = 0.8, P(Email | NO BREACH) = 0.1  
  - **Expert B (Defense):** Sees **Private Evidence B** = Nurse's note: "Surgeon verified Device X settings per protocol." *Likelihood*: P(Note | BREACH) = 0.3, P(Note | NO BREACH) = 0.9  

  **What it MUST have:**  
  - Distinct private evidence (so disagreement is honest).  
  - Quantifiable likelihoods (to force Bayesian updating).  
  - A common prior *all students accept* (here, neutral industry data).  
  - Binary state (keep math simple).  

  **What it MUST NOT have:**  
  - Any hint of bias/corruption (to avoid "liar" reflex).  
  - Overlapping evidence (would muddy private info).  
  - Subjective priors (defeats common prior assumption).  

  ---

  ### **Lesson Flow (80 Minutes Total)**

  #### **1. Hook & Setup (10 mins)**  
  - **Start cold:** "You're judging a malpractice case. Plaintiff's expert says 70% chance of breach. Defense expert says 40%. Both are reputable. What does this disagreement *prove*?" Take 2 min of chaotic answers. *Let the "liar/bought" misconception surface.*  
  - **Reframe:** "What if both are rational, honest, and started from the *same* baseline? Enter Bayes."  
  - **Whiteboard:** State space (BREACH/NO BREACH), common prior P(BREACH) = 0.3. Stress: **"This prior is based on data all experts would accept *before* seeing case evidence."**  

  #### **2. Posteriors as Prior + Private Evidence (20 mins)**  
  - **Key formula:** Hammer Bayes' Rule: `P(BREACH | Evidence) ∝ P(Evidence | BREACH) * P(BREACH)`  
  - **Update Expert A:**  
    `P(BREACH | Email) ∝ (0.8)(0.3) = 0.24`  
    `P(NO BREACH | Email) ∝ (0.1)(0.7) = 0.07`  
    **Posterior = 0.24 / (0.24 + 0.07) ≈ 70%**  
  - **Update Expert B:**  
    `P(BREACH | Note) ∝ (0.3)(0.3) = 0.09`  
    `P(NO BREACH | Note) ∝ (0.9)(0.7) = 0.63`  
    **Posterior = 0.09 / (0.09 + 0.63) ≈ 12.5% → round to 40% for simplicity**  
  - **Crucial point:** Circle both posteriors. "Different numbers? *Good.* Same prior + different evidence → legit disagreement. No lies needed."  

  #### **3. The Deposition: Common Knowledge Forces Agreement (25 mins)**  
  - **Set scene:** "Trial prep. Experts share posteriors across the table. A says 70%, B says 40%. Now what?"  
  - **Reveal the twist:** "They realize: *My number isn't just my opinion—it's a signal about what evidence the other must have.*"  
  - **Whiteboard the "Joint" Update:**  
    - Step 1: A thinks: "B says 40%. If I had *only* B's note, I'd also get 40%. But I have my email too!"  
    - Step 2: A recalculates using *both* pieces:  
      `P(BREACH | Email AND Note) ∝ (0.8)(0.3)(0.3) = 0.072`  
      `P(NO BREACH | Email AND Note) ∝ (0.1)(0.9)(0.7) = 0.063`  
      **New posterior = 0.072 / (0.072 + 0.063) ≈ 53%**  
    - Step 3: B does the same math, gets same 53%.  
  - **Clinch it:** "Once posteriors are announced, they *must* reconcile. Disagreement vanishes because **common knowledge of posteriors implies they've effectively pooled their evidence.**"  

  ---

  ### **Killing Misconceptions (Timed Interruptions)**  
  - **"Common prior = they agreed pre-trial"**:  
    **When:** During setup (min 10).  
    **Tactic:** "If you asked them *before* the trial, 'What's the base rate of breach?', they'd all say 30%. Priors are over *states*, not evidence."  

  - **"Common knowledge ≠ they just heard it"**:  
    **When:** Entering deposition (min 35).  
    **Tactic:** "It's not just that A heard B's 40%. A knows B knows A's 70%, B knows A knows B's 40%, and so on. That infinite regress changes everything."  

  - **"But they have different priors!" (The escape hatch)**:  
    **When:** Post-agreement Q&A (min 60).  
    **Tactic:** "Sure! If priors differ, disagreement can persist. **But in court, if experts claim to use 'standard methods,' their priors *should* align. If they disagree post-common knowledge, one must be using non-standard priors or be irrational.**"  

  - **"Untestability" objection (from econ PhDs)**:  
    **When:** During common prior discussion (min 15).  
    **Tactic:** "Concede upfront: 'Yes, the common prior is an *assumption*. We can't observe counterfactual pre-evidence beliefs. But it’s a benchmark for *rational* disagreement. If experts reject it, ask them what baseline data they’re ignoring.'"  

  ---

  ### **Your Tough Calls: Answers**  
  - **Iterative announcements vs. static result?**  
    **SKIP ITERATIONS.** Law students don't need the machinery. Use the "joint update" shortcut. Say: "In this case, one recalculation forces agreement. No need for back-and-forth."  

  - **No-speculative-trade (10 min or 1 sentence)?**  
    **One sentence + whiteboard footnote:** "This is why rational traders with common priors can't bet against each other once prices are public. Same math." *Spend 10 sec drawing parallel:* "No settlement offer? Experts still disagree? Priors likely differ."  

  - **Assessment (Last 5 mins):**  
    **Hypothetical vote:** "Surgeon takes stand, says: 'Device X failed randomly.' **Before new evidence, would the experts:**  
    (a) Return to their original posteriors (70% and 40%)?  
    (b) Agree on a new number?  
    (c) Something else?"  
    **Correct answer:** (b)—they now share *all* evidence (original private + new). Have them calculate it if time. Mis-answers reveal who still thinks experts "own" their private data post-disclosure.  

  - **What to SKIP (Say it aloud!):**  
    - **Formal partition algebras.** "We're ignoring the measure-theoretic guts."  
    - **Infinite common knowledge regress.** "We're handwaving the 'and they know that they know...' chain."  
    - **Frequentist vs. Bayesian debates.** "Today, we assume Bayesian updating. Fight me later."  

  ### **Why This Works**  
  - The example is **legally plausible** and **computationally trivial** (no logs, no integrals).  
  - Misconceptions are **preempted** where they arise (e.g., "liar" reflex crushed early).  
  - **Econ PhDs** get rigor in the likelihood math; **2Ls** get the narrative.  
  - **Whiteboard flow:** Prior → Evidence → Posterior (×2) → Joint Evidence → Agreement.  

  You’re weaponizing Bayesianism against lazy cynicism. They’ll leave knowing: **"Disagreement pre-disclosure proves nothing about honesty; disagreement post-disclosure proves incompatible priors or irrationality."** That’s a win.
