  The two orders give different results: 0.813 vs 0.681.

  In contrast, the user states that their filter (using Bayes with likelihoods) is order-independent. How would that work?

  Suppose we model the vision pass as providing a likelihood for the material. For example, the vision system might output a likelihood ratio for metal vs plastic. But note: in the Jeffrey update, we are given a marginal probability for metal. This is not the same as a likelihood. In fact, the marginal probability already folds in the prior.

  To see the double-counting: the vision update in Jeffrey's rule uses the prior conditionals and the new marginal. The new marginal P(metal)=0.70 is a posterior that combines the prior and the evidence. Then the lift update uses the new marginal for weight, which in the first update order is computed after the vision update and hence includes the vision evidence. But when we do the lift update first, we are using the prior conditionals for weight and then the vision update uses the lift-updated distribution. 

  The problem is that the input to Jeffrey's rule is a posterior marginal on a partition, not a likelihood. Therefore, when we do two updates, we are effectively updating the same prior twice: once with the vision evidence and then again with the lift evidence, but in a way that the prior is used in both updates.

  In the user's filter: they would have a likelihood for the vision observation and a likelihood for the lift observation. Let's denote:

