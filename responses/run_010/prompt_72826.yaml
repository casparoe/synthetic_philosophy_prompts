  ### Part Three: Residue Report

  | Component                   | Translation Clean? | Translation with Distortion? | Cannot Express? |
  |-----------------------------|--------------------|------------------------------|-----------------|
  | Partition                   | ✓                  |                              |                 |
  | Rigidity Condition          | ✓                  |                              |                 |
  | Update Formula              | ✓                  |                              |                 |
  | Rival Proposal              | ✓                  |                              |                 |
  | Reversibility               |                    | ✓ (Requires storing priors, not likelihoods) | |
  | **Handed-Over Probabilities** |                    |                              | ✗ (No source; estimation uses likelihoods) |
  | **Constraints on Inputs**   |                    |                              | ✗ (Philosophically indeterminate) |
  | Order-Dependence Pathology  |                    |                              | ✗ (Artefact of misrepresenting evidence) |

  #### Why Inexpressible Components?
  1. **Handed-Over Probabilities**:  
     - **Reason**: Estimation lacks this—it requires evidence modeled as **likelihoods**, not arbitrary posteriors.  
     - **Failure Mode**: If a sensor emits a posterior (e.g., a classifier's output) and is fused naïvely as a likelihood, it **double-counts the prior**, causing miscalibration.  
     - **Solution**: Convert posteriors to likelihoods using the sensor's training prior (if known).

  2. **Constraints on Inputs**:  
     - **Reason**: Jeffrey offers no normative source for \(P_{\text{new}}(\text{partition})\); it is subjective.  
     - **Verdict**: Philosophical claim is **indeterminate**—estimation bypasses this by deriving updates from likelihoods.

  #### Verdict
  - **Your suspicion is correct**: Jeffrey conditionalization is a **special case of Bayes for soft evidence**, but it mishandles sequential updates by accepting posteriors as inputs.  
  - **The debate dissolves**: Modeling evidence as **likelihoods** (as in estimation) avoids double-counting, ensures order-independence, and provides a normative basis.  
  - **Failure in Practice**: Using classifier posteriors as likelihoods without prior correction → **double-counting → overconfidence/order-dependence**.  
  - **Loose End (Information Projection)**:  
    Jeffrey's rule minimizes \(D_{\text{KL}}(Q \| P_{\text{prior}})\) subject to \(Q(\text{cell}_i) = p_i\).  
    - Translates **suspiciously well**: Unique solution is Jeffrey's update.  
    - Constraint set identical: Linear constraints on marginals.  
    - **But**: Estimation uses **likelihood constraints** (not linear marginals), avoiding pathology.

  #### Final Judgment
  - **Jeffrey conditionalization is flawed** for sequential updates with dependent partitions.  
  - **Estimation theory's approach (likelihoods) is superior**: It handles uncertain evidence robustly.  
  - **Philosophy's error**: Treating evidence as posteriors, not likelihoods. Reverse-engineering posteriors into likelihoods resolves the issue.  
  - **Your field settled this**: Bayes filters with likelihoods are the norm. Jeffrey's rule is a special case hobbled by input representation.
