  We are going to address the user's query in three parts as requested.

  Part One: Translation

  We restate Jeffrey conditionalization in the vocabulary of state estimation and Bayesian filtering.

  1. **Partition**: In Jeffrey's framework, the partition is a set of mutually exclusive and exhaustive propositions (events) that cover the entire state space. In estimation terms, this corresponds to a discrete state space or a discretization of a continuous state space. The partition is a set of cells (like the four cells in the user's example: metal/heavy, metal/light, plastic/heavy, plastic/light).

  2. **Probabilities handed by the experience**: The observation provides the agent with a new probability distribution over the partition. In the user's example, the vision pass gives P(metal)=0.70 and hence P(plastic)=0.30. This is not a likelihood function but a marginal probability distribution over a subset of the state space (here, the material). In estimation, we typically get a likelihood function (e.g., P(observation | state)). The Jeffrey update takes as input a new marginal distribution on the partition.

  3. **Rigidity condition**: The requirement is that the conditional probabilities given each cell of the partition remain unchanged. That is, for any event A, P_new(A | partition cell) = P_old(A | partition cell). In estimation terms, this means that the observation does not change the conditional distribution of other state variables given the partitioned variable. This is similar to assuming that the observation only provides information about the partition and not about the relationships within the partition.

  4. **Update formula**: Jeffrey's rule updates the prior to a new distribution by:
     P_new(H) = sum_{i} P_old(H | E_i) * P_new(E_i)
     where {E_i} is the partition and P_new(E_i) is the new probability for the i-th cell.

     In estimation, we typically use Bayes' rule: 
     P(state | observation) ∝ P(observation | state) * P_prior(state)

     The Jeffrey update does not use a likelihood function but directly uses the new marginal on the partition and the prior conditionals.

  5. **Constraints on the handed-over numbers**: The new probabilities for the partition cells (P_new(E_i)) are taken as given by the experience. Critics note that nothing in the rule specifies where these numbers come from, so the rule is a description of how to update given these numbers. In estimation, we usually model the evidence as a likelihood and then normalize. The numbers P_new(E_i) are not provided by a sensor in the same way. However, if we interpret the experience as giving us a new marginal on a subset of the state, then we are effectively updating that marginal and preserving the conditionals.

  6. **Rival proposal (conditionalization on the experience)**: The alternative is to find a proposition B (describing the experience) such that P_new(E_i) = P_old(E_i | B) and then set P_new(H) = P_old(H | B). This would be the standard Bayesian update. In estimation, we model the observation with a likelihood and update by conditioning on the observation. The challenge is that in Jeffrey's scenario, the observation does not correspond to certainty in any proposition.

     Translation: In estimation, we model the observation as a random variable and condition on its value. The rival proposal is exactly the standard Bayesian update. However, if the observation does not give us certainty about a proposition, then we cannot condition on a specific event. Instead, we have a soft evidence update.

  7. **Reversibility**: The Jeffrey update is reversible in principle if we store the prior and the updated marginal. However, if we only have the posterior and we are given a new update, we cannot necessarily reverse the previous update without storing extra information. In estimation, if we store the likelihood function (or the log-odds) we can reverse by dividing. But the Jeffrey update does not use a likelihood function, so we don't have that. We would have to store the prior conditionals and the old and new marginals to reverse.

  Part Two: The Discrepancy

  The user describes a scenario with two updates:

