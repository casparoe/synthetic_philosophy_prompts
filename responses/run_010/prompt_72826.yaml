  Then, after vision update:
  P_new(MH) = P(heavy|metal) * P_new(metal) ≈ 0.9730 * 0.70 ≈ 0.6811
  P_new(ML) = P(light|metal) * P_new(metal) ≈ 0.0270 * 0.70 ≈ 0.0189
  P_new(PH) = P(heavy|plastic) * P_new(plastic) ≈ 0.6923 * 0.30 ≈ 0.2077
  P_new(PL) = P(light|plastic) * P_new(plastic) ≈ 0.3077 * 0.30 ≈ 0.0923

