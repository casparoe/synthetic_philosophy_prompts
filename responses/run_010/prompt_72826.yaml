  Therefore, the order-dependence in the original example is due to the prior dependence between material and weight. When the features are independent, the conditionals remain constant and the order does not matter. But when they are dependent, the conditionals change after the first update, leading to a different result.

  In the user's filter, if they were to use the same inputs (i.e., if they interpreted the sensor outputs as posterior marginals and tried to update by Jeffrey's rule) then they would get order dependence. But that is not how they use the sensors. They use the sensor outputs as likelihoods, not as posterior marginals.

  So the key is: the input to Jeffrey's rule is a posterior marginal on a partition, which already folds in the prior. Therefore, if we use two such updates, we are double-counting the prior. Specifically, the first update uses the prior to form the conditionals and then sets a new marginal. The second update uses the new joint distribution (which includes the prior and the first evidence) to form conditionals and then sets a new marginal for a different variable. The prior is thus used in both updates, leading to overcounting.

  In the independent case, the conditionals do not change so the prior is only used in the conditionals in the same way regardless of order, and the marginals update independently.

  Therefore, the rule's input is not a likelihood. It is a posterior marginal. The order-dependence is a symptom of the double-counting of the prior when the updates are on dependent partitions.

  Part Three: Residue Report

  We sort the components of Jeffrey conditionalization:

  **Column 1: Translates cleanly**

  - **Partition**: This is just a discretization of the state space. Clean.

  - **Rival proposal (conditioning on the experience)**: This is standard Bayesian updating by conditioning on an observation. Clean.

  - **Reversibility**: In estimation, if we store the likelihood (or the log-odds) we can reverse by division. Jeffrey update does not store the likelihood, so it is not reversible without storing extra information. But the concept of reversibility is present in both.

  - **Information projection characterization**: We'll address the loose end. The claim is that Jeffrey's rule minimizes the relative entropy (Kullback-Leibler divergence) from the prior subject to the constraint that the marginal on the partition matches the given probabilities. This is a linear constraint on the posterior. The solution is unique and is given by the Jeffrey update. This translates cleanly: we know that the minimum relative entropy update for a constraint on marginal probabilities is to set the posterior as the prior times factors for each partition cell (but normalized). However, note: the constraint set is exactly the set of distributions that have the new marginal on the partition. So that part is the same. The uniqueness is also clear. 

  **Column 2: Translates with distortion**

  - **Probabilities handed by the experience**: In estimation, we typically get a likelihood function. Here, we get a posterior marginal. The distortion is that we are forced to interpret the sensor output as a posterior rather than a likelihood. This distorts the evidence because it folds in the prior. In practice, we would prefer to model the evidence with a likelihood that is independent of the prior.

  - **Rigidity condition**: This condition translates to assuming that the observation does not change the conditional distribution of other state variables given the partition. In estimation, we often assume that the observation model for a sensor is conditionally independent of other state variables given the partitioned variable. However, in Jeffrey's rule, we are not given an observation model but a posterior marginal. The rigidity condition is imposed to preserve the conditionals, but it might not hold if the evidence actually provides information about the conditionals. The distortion is that we are not using an observation model to update the conditionals.

  - **Update formula**: The formula itself is a special case of Bayesian updating for soft evidence, but it requires the rigidity condition. In estimation, we would use a likelihood function and update the entire state. The distortion is that the update formula uses a posterior marginal and the prior conditionals, which may not be the correct model for the evidence.

  **Column 3: Cannot express (and why)**

  - **Constraints on the handed-over numbers**: We cannot express where the numbers P_new(E_i) come from. In estimation, we model the evidence with a likelihood, which is then used to update the prior. The P_new(E_i) are outputs of some process that we don't model. This is not a failure of estimation theory but a lack of specificity in the philosophical account. The claim is less determinate: the rule does not specify how to obtain these numbers.

  - **The order-dependence issue**: We can express it as a consequence of using posterior marginals as input. But in estimation theory, we avoid this by using likelihoods. Therefore, the inexpressible part is the idea that the evidence should be represented as a posterior marginal. Estimation theory would reject this representation for sequential updates because it leads to double-counting. However, for a single update, it is equivalent to a minimum relative entropy update. The concrete failure mode in practice would be if we naively took a classifier's output (which is a posterior if the classifier was trained on a certain prior) and used it in a sequential update without converting it to a likelihood. We would then get order-dependence and double-counting. The resource that estimation theory has is the likelihood function, which avoids this. Therefore, the failure mode is using a posterior marginal as if it were a likelihood in a sequential update.

  Loose End: The Information Projection

  The characterization: Jeffrey's rule is the unique distribution that minimizes the relative entropy D_KL(Q || P_prior) subject to the constraint that Q(E_i) = p_i for all i (the new marginals on the partition).

  This is true. The constraint set is affine: the probabilities of the partition cells are fixed. The solution is:

  Q(x) = P_prior(x) * (p_i / P_prior(E_i))   for x in E_i.

  But note: this is exactly the Jeffrey update because:

  Q(x) = P_prior(x) * [p_i / P_prior(E_i)] 
  and then note that for x in E_i, P_prior(x | E_i) = P_prior(x) / P_prior(E_i), so:
  Q(x) = P_prior(x | E_i) * p_i

  which is the Jeffrey update.

  In estimation, if we are given a constraint that the posterior must have marginal p_i on the partition, then the minimum relative entropy update is indeed Jeffrey's rule. This is a standard result and translates cleanly.

  However, note: the constraint set is the same. The uniqueness holds because the relative entropy is strictly convex.

  But in the user's practice, they would not typically use such a constraint. They would use a likelihood function. The constraint set for a likelihood update is different: it constrains the posterior to be proportional to the prior times the likelihood. That constraint set is not linear in the probabilities. 

  Therefore, the two approaches are different: one is a constraint on the marginal probabilities of a partition (linear), the other is a constraint on the likelihood (multiplicative). They are different rules.

  Verdict:

  The user's suspicion is partially correct: Jeffrey conditionalization is a special case of a minimum relative entropy update for a linear constraint, which is a known tool. However, it is not the same as the Bayesian update with a likelihood. The double-counting issue in sequential updates arises because the input is a posterior marginal that already folds in the prior. This is not how we handle sensor data in a Bayes filter. Instead, we use likelihoods. Therefore, the rule is not a reinvention of the Bayes filter but an alternative update rule for a different type of evidence (soft evidence on a partition).

  The debate dissolves when we model evidence as a likelihood. However, if we are forced to update with posterior marginals (for example, if a sensor only provides a posterior marginal and we don't have access to its likelihood model), then we must use Jeffrey's rule. But then sequential updates are order-dependent when the partitions are not independent. 

  The failure mode in the user's practice would occur if they took a classifier's class probability (which is a posterior) and used it as a likelihood. Then they would be double-counting the prior that the classifier used. Instead, they should convert the classifier's output to a likelihood by accounting for the classifier's training prior. Then they can update without double-counting.

  Final Answer:

  The hypothesis that Jeffrey conditionalization is a special case of the Bayes filter does not survive contact with the actual doctrine. The Bayes filter uses likelihoods and multiplies them, leading to order-independence. Jeffrey conditionalization uses posterior marginals and updates by preserving conditionals, leading to order-dependence when updating dependent partitions. The two are different. However, the minimum relative entropy characterization of Jeffrey's rule is standard and translates cleanly. The debate about uncertain evidence can be avoided by modeling evidence as likelihoods.

  Thus, the user's field does not mishandle uncertain evidence: by using likelihoods, they avoid the double-counting and order-dependence. But they must be cautious not to confuse a posterior marginal with a likelihood.
answer: |-
  ### Part One: Translation of Jeffrey Conditionalization

  #### 1. **Partition**
  - **Doctrine**: A set of mutually exclusive and exhaustive propositions (e.g., material type: metal/plastic) partitioning the state space.
  - **Translation**: Discrete state space decomposition (e.g., cells: metal-heavy, metal-light, plastic-heavy, plastic-light). Translates cleanly to state estimation (discrete hypothesis sets).

  #### 2. **Probabilities Handed by Experience**
  - **Doctrine**: Observation provides new probabilities for each partition cell (e.g., \(P(\text{metal}) = 0.70\)).
  - **Translation**: **No direct counterpart**. Estimation uses a **likelihood function** (e.g., \(P(\text{sensor output} \mid \text{state})\)), scaled to form a posterior. Jeffrey's input is a *posterior marginal* (already prior-dependent), not a likelihood.  
  - **Addition Required**: Estimation assumes evidence is a likelihood; Jeffrey assumes it's a posterior. This is a critical divergence.

  #### 3. **Rigidity Condition**
  - **Doctrine**: Conditional probabilities *within* each partition cell remain unchanged (e.g., \(P(\text{heavy} \mid \text{metal})\) unaltered by vision update).
  - **Translation**: Matches the **conditional independence assumption** in sensor models (e.g., weight independent of vision sensor *given* material). Translates cleanly if the sensor model is state-conditional.

  #### 4. **Update Formula**
  - **Doctrine**: New posterior = \(\sum_i P_{\text{prior}}(\text{hypothesis} \mid \text{cell}_i) \cdot P_{\text{new}}(\text{cell}_i)\).
  - **Translation**: Equivalent to **Bayesian inference under soft evidence** with rigidity. Translates to:  
    \[
    P_{\text{post}}(\text{state}) = P_{\text{prior}}(\text{state} \mid \text{partition}) \cdot P_{\text{new}}(\text{partition}).
    \]  
    Clean if rigidity holds and partition is fixed.

  #### 5. **Constraints on Handed-Over Numbers**
  - **Doctrine**: \(P_{\text{new}}(\text{cell}_i)\) are given by experience; critics note no normative source (descriptive, not prescriptive).
  - **Translation**: **No counterpart**. Estimation derives posteriors from likelihoods and priors; it does not accept "handed" posteriors.  
  - **Addition Required**: Estimation requires modeling evidence as a likelihood (objective); Jeffrey's input is subjective and prior-dependent.

  #### 6. **Rival Proposal (Conditionalize on Experience)**
  - **Doctrine**: Instead, become certain of a proposition (e.g., "vision reported metal") and conditionalize on it.
  - **Translation**: Matches **standard Bayesian update**: \(P_{\text{post}}(\text{state}) \propto P_{\text{prior}}(\text{state}) \cdot \mathcal{L}(\text{observation} \mid \text{state})\). Translates cleanly (standard sensor fusion).

  #### 7. **Reversibility**
  - **Doctrine**: Jeffrey update is reversible only if original conditionals and priors are stored.
  - **Translation**: **Partial translation**. Estimation reverses updates by **dividing out likelihoods** (stored in log-odds). Jeffrey cannot reverse without storing prior marginals (no likelihood representation).  
  - **Distortion**: Estimation reversibility relies on likelihoods; Jeffrey lacks this mechanism.

  ---

  ### Part Two: Discrepancy Analysis (Order-Dependence)

  #### Setup
  - **State space**: Metal/plastic × heavy/light (4 cells).
  - **Prior**: \(P(\text{MH}) = 0.40\), \(P(\text{ML}) = 0.10\), \(P(\text{PH}) = 0.10\), \(P(\text{PL}) = 0.40\).
  - **Observations**:  
    - Vision: \(P_{\text{new}}(\text{metal}) = 0.70\) → Partition = material.  
    - Lift: \(P_{\text{new}}(\text{heavy}) = 0.90\) → Partition = weight.

  #### Jeffrey Update Results
  - **Vision → Lift**: \(P(\text{MH}) \approx 0.813\).  
  - **Lift → Vision**: \(P(\text{MH}) \approx 0.681\).  
  - **Independent Prior (all cells \(0.25\))**: Both orders \(\rightarrow P(\text{MH}) = 0.63\) (order-independent).

  #### Why Order-Dependence?
  - **Double-Counting the Prior**:  
    Jeffrey's input—\(P_{\text{new}}(\text{partition})\)—is a **posterior marginal**, not a likelihood. It already folds in the prior via:  
    \[
    P_{\text{new}}(\text{cell}_i) \propto \underbrace{P_{\text{prior}}(\text{cell}_i)}_{\text{prior}} \cdot \mathcal{L}(\text{evidence} \mid \text{cell}_i).
    \]  
    - When updating sequentially, the prior is **counted twice**:  
      1. In \(P_{\text{new}}(\text{partition}_1)\) for the first update.  
      2. In the conditionals \(P(\text{partition}_2 \mid \text{partition}_1)\) for the second update.  
    - This is harmless if partitions are independent (e.g., uniform prior) but causes order-dependence when partitions are dependent (as in the original prior).

  #### Why Dependence Matters?
  In the original prior, material and weight are dependent (\(P(\text{metal}) = 0.50\), \(P(\text{heavy}) = 0.50\), but \(P(\text{metal} \cap \text{heavy}) = 0.40 \neq 0.25\)). After the first update, the conditionals change:  
  - Vision-first alters \(P(\text{heavy} \mid \text{plastic})\) from \(0.20\) to \(\approx 0.0968\).  
  - Lift-first alters \(P(\text{metal} \mid \text{light})\) from \(0.20\) to \(\approx 0.0270\).  
  This propagates errors when the second update uses distorted conditionals.

  #### Estimation Theory Solution
  - Use **likelihoods**, not posteriors, as input:  
    \[
    \mathcal{L}_{\text{vision}} \propto \frac{P(\text{metal} \mid \text{vision})}{P_{\text{prior}}(\text{metal})}, \quad \mathcal{L}_{\text{lift}} \propto \frac{P(\text{heavy} \mid \text{lift})}{P_{\text{prior}}(\text{heavy})}.
    \]  
  - Then fuse multiplicatively:  
    \[
    P_{\text{post}} \propto P_{\text{prior}} \cdot \mathcal{L}_{\text{vision}} \cdot \mathcal{L}_{\text{lift}}.
    \]  
    **Result**: Order-independent (commutative multiplication).

  #### Verdict on the Input
  - **Jeffrey's input is not a likelihood**—it is a posterior marginal.  
  - **Order-dependence is pathological**: It arises from double-counting the prior when partitions are dependent.  
  - **Estimation avoids this** by treating evidence as likelihoods.

