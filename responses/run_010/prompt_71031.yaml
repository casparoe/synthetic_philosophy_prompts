  For the refrain, I choose: "If the apples hold, we'll have cider by May." It's domestic, seasonal, and flexible for different contexts. The words are simple yet evocative, fitting kitchen-talk about harvests or weather.

  In stanza 1, I set a confident scene: clear skies, full branches—everything points to the refrain feeling true. Stanza 2 shifts to a blight warning; now the same words feel doubtful, showing how conditional probability changes without altering the sentence.

