  The closing lines after the gap affirm we still use such conditionals because they express our conditional beliefs, even if no proposition corresponds to them. I avoid technical terms, sticking to "belief" and "weight."

  In the mapping, I note fudges: Lewis's argument is probabilistic, but the poem uses binary outcomes for simplicity. Also, the spread of triviality is dramatized, not derived. A philosopher would recognize the core reasoning.

