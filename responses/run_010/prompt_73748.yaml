answer: |-
  This legal pattern reveals a nuanced, context-dependent account of evidence and probability, rooted in **epistemic caution about individuation** and a distinction between **general vs. particular causation** and **blame attribution**. Its presuppositions can be reconstructed as follows:

  ---

  ### **Presupposed Principles & Reference-Class Selection**
  1. **Lost Earnings/Lifespan (Damages):**  
     - **Reference Class:** Sex/Race (broad demographic groups).  
     - **Principle:** Group statistics are sufficient for *predictive generalizations* about *aggregate outcomes* (e.g., average lifespan).  
     - **Justification:** Actuarial tables reflect stable, population-level regularities. Liability is already established; statistics merely quantify *extent* of harm.  
     - **Epistemic Stance:** Frequentist – group frequencies license expectations for individuals *within the class*.

  2. **Toxic Exposure Causation ("Doubling Risk"):**  
     - **Reference Class:** Disease-specific cohort exposed to the toxin (e.g., factory workers with Disease X).  
     - **Principle:** Statistics must show the *exposure-specific risk* dominates the *background risk* for the disease. "More than doubled" (Relative Risk > 2) ensures the toxin is >50% likely to be the *but-for cause* in any individual case.  
     - **Justification:** Balances epidemiology's group-based nature with tort law's individual causation requirement. RR>2 implies *probability of causation* >50% under the "attributable fraction" model.  
     - **Epistemic Stance:** Hybrid frequentist/probabilistic causation – group data supports an *inference* about individual etiology *if* the effect size is strong enough.

  3. **Identification ("Which Bus?"):**  
     - **Reference Class:** Vehicles on the road at the time (e.g., 80% company buses).  
     - **Principle:** *Bare statistics* (even with high probability) are insufficient to prove *singular identification* of a responsible agent.  
     - **Justification:** Requires *individualizing evidence* (e.g., witness, tire marks) to avoid condemning defendants based solely on group membership (rejecting "statistical liability"). Echoes *Smith v. Rapid Transit* (1945) and the *Blue Bus Problem*.  
     - **Epistemic Stance:** Skepticism that group frequencies can prove *particular facts about a specific event* without causal linkage.

  ---

  ### **Coherence & Governing Principle**
  - **Single Principle:** **"No liability based solely on naked statistics."**  
    - The first two practices use statistics *only after liability is established* (damages) or *alongside a specific causal mechanism* (toxin→disease). The third rejects statistics *as the sole basis for assigning blame to a specific actor*.  
    - **Key Distinction:** *General* probabilities (lifespan, disease risk) are acceptable for setting parameters; *specific* probabilities (identifying the causal agent in a unique event) are not.  
    - **Not Incoherent:** The system prioritizes *individual moral responsibility* in tort law. Statistics can inform *expectations* but not *singular attribution* without additional particularized evidence.

  ---

  ### **What Is Strictly Presupposed vs. Underdetermined**
  - **Presupposed:**  
    - Group frequencies *can* establish *general* probabilities (lifespan, disease risk).  
    - For assigning blame/liability, *something beyond group statistics* is needed to individuate (e.g., mechanism, witness).  
  - **Underdetermined (compatible theories):**  
    - **Subjectivist (Bayesian):** Could accept all statistics as updating priors but might still demand high posterior probability for liability.  
    - **Objective Chance Theorist:** Might see "doubling risk" as tapping into physical propensities (toxin causes disease), while bus statistics lack a causal mechanism.  
    - **Skeptic of Bare Statistics (e.g., Frequentist):** Argues group data *describes populations only* and cannot prove singular claims – aligning perfectly with the rejection of the bus case.  
    - **Common Ground:** All can accept that *legal liability* requires more than statistical likelihood to protect against erroneous deprivation of property/liberty.

  ---

  ### **Bayesian Factfinder: Which Practices Survive?**
  A Bayesian factfinder reporting *only* posterior probability would transform the practices fundamentally:
  1. **Lost Earnings/Lifespan:**  
     - **Survives Intact.** Actuarial tables directly update the probability of future losses.  
     - *Bayesian Form:* Posterior loss = Expected loss given lifespan distribution.

  2. **Toxic Exposure Causation:**  
     - **Transformed.** Doubling risk (RR>2) is replaced by direct calculation of P(causation|exposure).  
     - *Bayesian Form:* P(Causation) = [P(D|E) − P(D|~E)] / P(D|E) (Probability of Causation).  
     - If prior probability of exposure causing disease is low, even RR>2 may not yield P>0.5 without further evidence.

  3. **Identification ("Which Bus?"):**  
     - **Rejected → Transformed.**  
       - Current Law: 80% probability is insufficient.  
       - Bayesian: 80% probability *would* suffice if no other evidence exists.  
     - *Required Change:* Courts would accept liability based *only* on statistical probability (e.g., "more likely than not the defendant's bus").  
     - **Practical Barrier:** Legal resistance to "statistical convictions" on fairness grounds (*People v. Collins* 1968).

  ---

  ### **Conclusion**
  - **Coherence:** The practices are consistent under a principle that **permits statistics for general predictions or strong causal inferences but forbids them for specific actor-identification without individuating evidence**.  
  - **Bayesian Impact:** Damages calculations are inherently Bayesian; toxic causation would become more flexible; identification would require abandoning the "no bare statistics" rule.  
  - **Legal Reality:** The persistence of the "doubling risk" rule and rejection of statistical identification reflect law's enduring **epistemic conservatism** and **moral commitment to individualized proof** when imposing blame. Bayesianism, while normatively compelling to some, faces deep institutional resistance in this domain.
