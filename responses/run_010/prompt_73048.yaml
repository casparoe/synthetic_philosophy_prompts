prompt: |-
  I sit on the Priority-Setting Panel of a regional health authority — eleven members: four clinicians, two health economists, a patient representative, three lay members, and me. For eleven years the panel has appraised proposals for the authority's £48m "Healthy Lives" fund in quality-adjusted life years, against a cost-per-QALY threshold of £30,000. A coalition of mental-health and social-care providers has been pressing the board to replace that metric with a wellbeing-based one, and the board has asked our panel to decide the question before the next appraisal round opens in six weeks. I have to circulate a memo that the panel can vote on.

  The proposed metric works as follows. Each funded programme reports its effect in years of life-satisfaction gained, measured with the authority's annual population survey instrument: an 0–10 ladder question, plus three anchoring vignettes describing a person in full health, a person whose walking is limited to roughly 200 metres, and a person in the worst health state respondents can imagine. Respondents place the vignettes on the same ladder, and individual answers are then linearly re-anchored so that the vignettes come out at fixed values; the stated purpose is to put respondents who use the ladder differently onto a common scale. One ladder point sustained for one year is provisionally converted at 0.05 "wellbeing-adjusted life years" (WALYs), a ratio the economics unit fitted from a single cross-sectional regression of QALY weights on ladder scores in the 2019 wave. The board proposes to apply the same £30,000 threshold per WALY.

  Two pilots are on the table for the coming round:

  - Programme S — community companionship and social prescribing. Cost £1,200 per participant for a three-year course. Piloted in 2019. Ladder gain +0.42 points, sustained three years. QALY gain +0.006 per participant per year. On the QALY metric: £66,700 per QALY, fails. On the wellbeing metric: £19,000 per WALY, passes.
  - Programme H — elective hip replacement. Cost £4,800 per patient, one-off. Piloted in 2024. Ladder gain +0.55 points, sustained two years. QALY gain +0.22 per patient. On the QALY metric: £21,800 per QALY, passes. On the wellbeing metric: £87,300 per WALY, fails.

  So the two metrics do not merely disagree at the margin; they reverse the ranking of these two programmes outright.

  Last month the authority's statisticians filed a note that has split the panel. Mean vignette placements have moved between waves. In 2019 the full-health vignette was placed at 8.6, limited mobility at 3.4, and worst imaginable health at 1.2. In 2024 full health is still at 8.6, but limited mobility is now placed at 4.3 and worst imaginable health at 0.9. Over the same period, a fixed clinical cohort — re-interviewed every wave, with no change in its recorded clinical status — has seen its mean re-anchored ladder score rise by 0.6 points. The statisticians offer two readings: either this cohort is genuinely faring better, or respondents now use the ladder differently and interpret the vignettes differently, in which case the re-anchoring procedure has failed at the exact point where it was supposed to do its work, since it assumes vignette interpretation is stable across waves and that assumption cannot be tested from inside the survey. They ran three defensible corrections for Programme H's 2024 figures: piecewise linear re-anchoring on all three vignettes gives +0.36; leaving raw scores untouched, on the grounds that it is the vignettes rather than the ladder that changed meaning, gives +0.55; re-anchoring on the invariant upper vignette alone, assuming proportional compression below it, gives +0.71. These correspond to £133,000, £87,300 and £67,600 per WALY. The note observes that none of the three changes the pass/fail verdicts for S and H in the coming round, because Programme S was measured in 2019 and needs no correction. It does say that if the first correction is the right one, then applying a conversion ratio fitted on 2019 data to ladder scores collected from 2024 onward understates the cost per WALY of programmes sitting in the lower half of the ladder by roughly a third — which is where nearly every future social-care and mental-health proposal will sit.

  One lay member has said she does not see how the panel can compare one person's satisfaction with another's at all, under either metric, and would rather we allocate by rule of thumb and stop pretending to a scale. The patient representative points out that Programme H's modest ladder gain is exactly what you would expect from people who have lived with a bad hip for years and have already adjusted to it, and that a metric which rewards that adjustment is a metric that quietly defunds the sickest patients. The economics unit replies that the QALY has its own version of the same trouble, since its health-state weights come from members of the public imagining lives they have never led.

  Please draft the memo I will circulate. It must begin with the memo itself — no preface, no covering note to me, no restating of the situation — and its first line must state the recommendation: adopt the wellbeing metric, do not adopt it, or adopt it under conditions you then spell out as operative rules the appraisal team could actually implement. The memo should also:

  1. Say what happens to Programmes S and H in the coming round under your recommendation, and how the £48m is to be appraised meanwhile.
  2. Explain to a lay member what the vignette drift does and does not undermine, and state plainly whether the spread across the three corrections changes your recommendation and why or why not.
  3. Take a position on the status of the 0.05 conversion ratio, given that it was fitted on a wave whose scale may no longer exist, and given that it, rather than the ladder scores, is what determines whether anything clears the threshold.
  4. Set out the strongest case for the position you are rejecting — the patient representative's adaptation point and the lay member's scepticism about comparing satisfactions across persons both deserve real engagement, not a paragraph of concession — and say why it nonetheless loses, or say precisely what would have to be shown for it to win.
  5. Specify what you want the statistics unit to collect or run over the next twelve months, with the trigger and the date on which the panel would revisit this decision.

  Argue from the figures and assumptions given above rather than from the wider literature; do not cite studies, name authorities, or supply a reading list. Aim for roughly 1,100 to 1,400 words.
reasoning: |-
  Okay, the user needs a memo draft for their health authority panel to decide on switching from QALYs to WALYs. This is complex with technical, ethical, and practical dimensions. 

  First, let's unpack the core tension: the wellbeing metric reverses funding decisions for two pilot programs (S passes, H fails) versus QALYs (S fails, H passes). The vignette drift issue shows the metric's instability - identical health states score higher over time, suggesting measurement drift. Three corrections for Program H yield wildly different WALY costs (£67k-£133k), but all still fail under wellbeing metric.

  The ethical objections are profound: 
  - The patient rep argues the metric penalizes the sickest by rewarding adaptation (since Program H's modest gain reflects patients' adjustment to chronic pain). 
  - A lay member rejects interpersonal comparison of wellbeing altogether. 
  - Yet the economists note QALYs have similar issues with healthy people imagining illnesses.

  For the memo structure:
  The recommendation must lead - rejecting the wellbeing metric now feels unavoidable given the measurement instability. But outright rejection risks appearing reactionary. Instead, proposing conditional adoption after validation tests balances caution with openness to innovation. 

  Operationally, we must:
  - Keep QALYs for now but collect parallel WALY data
  - Freeze Program S funding pending better evidence (its QALY cost is indefensible at £66k)
  - Fund Program H normally (it passes QALY threshold)

  The vignette drift explanation needs simple analogy: it's like a ruler stretching over time. The lay member's skepticism is philosophically valid but practically unavoidable - all metrics require interpersonal comparison. The adaptation concern is sharper; it exposes how any metric valuing "adjustment" could disadvantage the acutely ill. 

  The conversion ratio (0.05) is doubly compromised: derived from potentially obsolete 2019 data and untested for longitudinal validity. It's the linchpin - small changes dramatically alter funding eligibility. 

  For next steps, demand longitudinal validation: track clinical cohorts over time to see if WALY changes match observable health shifts. Set a hard 12-month deadline. This turns the statisticians' critique into a roadmap.

  The rejected position (adopting wellbeing now) deserves weight: it captures dimensions QALYs miss, like social prescribing benefits. But with current flaws, it could misallocate millions. The compromise: test vigorously before committing.
answer: |-
  **MEMORANDUM**  
  **TO:** Priority-Setting Panel  
  **FROM:** [Your Name], Panel Member  
  **SUBJECT:** Recommendation on Adoption of Wellbeing Metric for "Healthy Lives" Fund Appraisal  
  **DATE:** [Current Date]  

  ---

  ### **RECOMMENDATION**  
  Do not adopt the wellbeing-adjusted life year (WALY) metric at this time. Maintain the current quality-adjusted life year (QALY) framework for the upcoming appraisal round. Initiate a 12-month validation protocol for the WALY metric, with adoption conditional on resolving critical measurement uncertainties. The £48m fund will be appraised under the existing QALY methodology (£30,000 per QALY threshold) during this period.  

  ---

  ### **1. Treatment of Programmes S and H and Interim Appraisal Process**  
  Under this recommendation:  
  - **Programme S** fails the QALY threshold (£66,700/QALY). It will not receive funding.  
  - **Programme H** passes the QALY threshold (£21,800/QALY). It will be funded subject to standard due diligence.  
  The £48m fund will be allocated using the established QALY methodology. Proposals will be ranked by cost per QALY, with those below £30,000/QALY funded in ascending order until the budget is exhausted.  

  ---

  ### **2. Vignette Drift: Implications for Lay Members**  
  **What the drift undermines:**  
  The vignette drift (changes in how respondents place the anchoring health scenarios between 2019 and 2024) indicates that the re-anchoring procedure—designed to standardize ladder scores across respondents—may not work over time. When the "limited mobility" vignette shifts from 3.4 to 4.3, and "worst health" from 1.2 to 0.9, it suggests either:  
  - Respondents’ interpretation of the vignettes has changed, or  
  - Their use of the ladder scale itself has shifted.  
  This is critical because the re-anchoring relies on the assumption that vignette meanings are stable. If they are not, we cannot confidently compare ladder scores across years or attribute score changes to genuine wellbeing shifts. The 0.6-point rise in a stable clinical cohort’s scores exemplifies this: we cannot discern whether these individuals feel better or whether societal scaling of the ladder has inflated their scores.  

  **What it does not undermine:**  
  The drift does not invalidate within-wave comparisons (e.g., comparing two programmes assessed in 2024) or raw ladder scores as snapshots of self-reported satisfaction. It also does not negate the theoretical value of wellbeing measurement.  

  **Impact on recommendation:**  
  The spread of corrections for Programme H (£67,600–£133,000/WALY) does not alter our rejection of the WALY metric. Even the most favorable correction (£67,600) still fails the £30,000/WALY threshold. Crucially, the spread confirms the metric’s instability: a single programme’s cost-effectiveness varies by 97% based on defensible methodological choices. This degree of arbitrariness is unacceptable for funding decisions.  

  ---

  ### **3. Status of the 0.05 Conversion Ratio**  
  The 0.05 conversion ratio (1 ladder point sustained for 1 year = 0.05 WALYs) is **fundamentally compromised** and cannot be used. Two flaws are fatal:  
  1. **Temporal mismatch:** It was fitted to 2019 ladder data that may reflect a different scale than 2024 due to vignette drift. Applying it to future data risks systematic error, especially for lower-ladder programmes (e.g., social/mental health interventions), where miscalibration could understate costs by ~33%.  
  2. **Conceptual fragility:** It derives from a cross-sectional regression of QALY weights on ladder scores. This assumes QALYs (based on hypothetical health-state valuations) and ladder scores (based on personal life satisfaction) measure the same underlying construct. The reversal of S and H’s rankings proves they do not align.  
  Until the ratio is validated longitudinally and its relationship to QALYs is reconciled, it functions as an arbitrary multiplier.  

  ---

  ### **4. Engagement with Rejected Positions**  
  **The patient representative’s adaptation concern:**  
  The strongest case against any satisfaction-based metric is that it may reward psychological adaptation to illness (e.g., Programme H’s modest +0.55 ladder gain for hip replacement). This could disadvantage those who cannot adapt or whose conditions preclude satisfaction gains, effectively penalizing the sickest. The QALY is not immune—its weights rely on public imaginings of unfamiliar health states—but it at least anchors to clinical health impacts.  

  **Why it does not compel adoption now:**  
  While adaptation is a profound issue, the WALY metric does not solve it; it exacerbates it by introducing new biases. Programme S’s ladder gain (+0.42) may reflect transient social benefits, not lasting health improvement. Meanwhile, Programme H’s low ladder gain (+0.55) may understate true welfare impact due to adaptation. Switching to WALYs without resolving this could misallocate resources. We would need evidence that ladder scores capture welfare *independent* of adaptation *and* that this is desirable for priority-setting. Until then, QALYs—while imperfect—offer a more objective clinical anchor.  

  **The lay member’s scepticism about interpersonal comparison:**  
  The deepest challenge is whether we can compare one person’s life satisfaction to another’s. Both QALYs and WALYs require such comparisons. QALYs assume we can compare the value of different health states across individuals; WALYs assume we can compare subjective satisfaction.  

  **Why we must nonetheless proceed with a metric:**  
  While no metric perfectly resolves this, we must allocate resources somehow. Rule-of-thumb allocation (e.g., equal per-capita spending) would ignore severity, efficiency, or need. QALYs at least standardize comparisons around observable health deficits. To adopt the lay member’s view, we would need a feasible alternative that avoids interpersonal comparison entirely *and* meets our duty to maximise health benefit per pound. None has been proposed.  

  ---

  ### **5. Required Work from Statistics Unit and Revisit Trigger**  
  The Statistics Unit must conduct a **longitudinal validation study** by [Date 12 Months from Now]. Key tasks:  
  1. **Track clinical cohorts:** Re-interview 3–5 fixed clinical cohorts (e.g., chronic pain, depression, mobility impairment) in both the 2025 and 2026 survey waves. Record objective clinical indicators alongside ladder scores.  
  2. **Vignette stability tests:** Embed experiments to detect vignette interpretation shifts (e.g., randomised wording, additional vignettes).  
  3. **Re-fit conversion ratios:** Test if ladder-score changes correlate with clinical changes over time. Develop a longitudinal (not cross-sectional) WALY conversion model.  
  4. **Stress-test social/mental health programmes:** Apply the metric to historical data for programmes similar to S, using multiple anchoring methods.  

  **Revisit trigger:** The Panel will reassess WALY adoption on [Specific Date 12 Months Hence] if:  
  - Cohort data show ladder scores track *predictable* health changes (e.g., clinical deterioration lowers scores; treatment raises them), and  
  - Vignette drift is controlled to ≤0.2 points/year across all anchors, and  
  - A revised conversion ratio achieves panel consensus.  

  If these conditions are unmet, the WALY proposal will be withdrawn.  

  ---

  ### **Summary**  
  The wellbeing metric’s theoretical appeal is overshadowed by operational uncertainties: vignette drift undermines score comparability, the 0.05 ratio lacks validity, and the reversal of S and H’s rankings exposes unresolved tensions between clinical benefit and subjective satisfaction. While QALYs are imperfect, they remain the more reliable tool. Programme S’s failure on QALYs reflects its high cost for marginal health gain; Programme H’s passage reflects its cost-effectiveness for a severe condition. By deferring adoption and demanding rigorous validation, we honour the patient representative’s warning against rewarding adaptation and the lay member’s scepticism about interpersonal comparisons—while avoiding a premature decision that could misdirect £48m.  

  **VOTE OPTIONS:**  
  ☐ Adopt wellbeing metric  
  ☐ Retain QALY metric (recommended)  
  ☐ Adopt with conditions (specify: _______________)  

  ---  
  **END OF MEMO**
