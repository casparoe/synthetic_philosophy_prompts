  Hmm, the user is preparing for a graduate seminar on international criminal justice and needs help predicting their professor's position on a hypothetical case. They've provided extensive details about the professor's past rulings on various international law cases, which gives me a lot to work with.

  Looking at the professor's record, I notice several clear patterns. She consistently rejects retroactive law creation - both for substantive crimes (like Nuremberg's aggression charge) and for modes of liability (like Tokyo's conspiracy convictions). However, she accepts prosecutions when conduct was clearly criminal under existing law at the time (like Nuremberg war crimes or German border guard cases). 

  The professor seems particularly concerned about three distinct aspects: retroactivity of offense definitions, retroactivity of imputation methods, and retroactivity of jurisdiction. Her notice standard appears contextual - she considers the defendant's position and access to legal advice, as seen in her Sierra Leone ruling where she rejected the dissenting judge's more generous notice standard for a commander with legal advisers.

  For the current hypothetical about the interior minister, several elements stand out. The detention practices weren't criminal under domestic law or binding treaties at the time. The joint criminal enterprise mode of liability is newly created in the tribunal statute. And the Security Council resolutions came during the conduct, which the minister received but may not have constituted sufficient notice.

  The carve-out for intervening powers' personnel presents an interesting dilemma. It seems like selective justice rather than retroactivity. The professor might condemn this as a violation of equality principles while still potentially upholding the minister's conviction if the retroactivity concerns were addressed.

  I think the smallest fact change that would test her principles would be whether the joint criminal enterprise doctrine had already been established in international law before the conduct. And the most efficient question to ask her would be about the relative weight of the three retroactivity axes in this case.

  The user clearly wants to understand the professor's legal philosophy rather than debate morality. They're looking for predictive accuracy based on established patterns. I need to be precise in mapping the professor's principles to this new scenario.
answer: |-
  Based on her record and the principles it reveals, here's a structured analysis and prediction for your professor's position on the hypothetical:

  ### 1. Candidate Principles (Consistent with Her Record)
  *   **Principle A (Core Non-Retroactivity):** Individuals cannot be criminally punished for conduct that was not *criminal under international or applicable domestic law* at the time of commission. This is a fundamental limit on sovereignty/tribunal power, not just a justice principle. *(Nuremberg Aggression, Tokyo Conspiracy, Sierra Leone dissent critique)*
  *   **Principle B (Imputation Non-Retroactivity):** Modes of liability (imputation) must also *pre-exist* the conduct in established law. Creating a *new* mode of liability is as illegitimate as creating a new crime. *(Tokyo Conspiracy, Argentina amnesty annulment distinction)*
  *   **Principle C (Contextual Notice):** The standard for whether a defendant "knew" conduct was criminal is objective but *contextual*. Senior officials with legal advisers and access to international discourse are held to a higher standard of awareness than lower-level actors. *(Sierra Leone majority, Nuremberg Aggression critique)*
  *   **Principle D (Forum Non-Retroactivity is Generally Permissible):** Establishing jurisdiction *after* the fact is legitimate if the *underlying conduct was criminal* at the time it occurred. Only the forum is new, not the prohibition. *(UK War Crimes Act)*
  *   **Principle E (Domestic Law as Safe Harbor):** Conduct expressly authorized and upheld as valid under *domestic law* at the time generally shields individuals from *international* criminal liability, unless it violates a clear, binding *criminal* norm of international law. *(Nuremberg intra-German atrocities, GDR border guards - where GDR law itself condemned the acts)*
  *   **Principle F (HR Treaties ≠ Individual Criminalization):** Ratification of human rights treaties creates *state obligations*, but does not automatically create *individual criminal liability* under international law without further development (e.g., crystallization into custom + state practice re: punishment). *(Implied in Nuremberg Aggression, explicit in hypothetical setup)*
  *   **Principle G (Selective Justice as Distinct Defect):** Granting impunity to one group (e.g., victors/intervenors) while prosecuting another for similar conduct is a flaw based on *equality/selectivity*, not inherently a *retroactivity* problem. *(Tokyo victors' justice context, implied critique of carve-out)*

  ### 2. Indistinguishable Pairs & How the New Case Separates Them
  *   **Pair 1 (A vs. F):** Is retroactivity the core flaw, or is the specific failure the lack of individual criminalization via treaty? *New Case Separates:* The HR Covenants are present but explicitly non-criminalizing (F confirmed). The new JCE mode (B) pushes towards A (core non-retro) as the broader principle.
  *   **Pair 2 (B vs. C):** Is the flaw *always* creating new imputation (B), or could sufficient notice (C) overcome it? *New Case Separates:* The new JCE mode (B) is present *and* the minister had access to reports/resolutions (C tested). Her likely rejection will favor B (imputation non-retro is absolute) over C (notice can cure substantive law defects but likely not imputation creation).
  *   **Pair 3 (E vs. F):** Is domestic law validity a shield only against *international* prosecution (F), or a stronger general principle (E)? *New Case Clarifies:* E is the stronger principle – domestic validity is a significant shield absent overriding *criminal* international law (which F clarifies wasn't present via treaty).

  ### 3. Prediction for Interior Minister Prosecution
  *   **Verdict:** **Illegitimate** (High Confidence: ~85-90%)
  *   **Decisive Axis:** **Retroactivity of the Mode of Imputation (Joint Criminal Enterprise - Principle B)**
      *   *Offence Definition (A/F):* Pushes towards illegitimate. Conduct not criminal under domestic law (E) or via treaty creating individual liability (F). SC resolutions/report during conduct provide notice (C) but likely insufficient to *criminalize* novel state acts lacking clear prior custom. However, this axis is complex.
      *   *Mode of Imputation (B):* Clearly illegitimate. Statute *defines* JCE for the first time. Charging the minister for acts of subordinates under this *novel* theory directly violates Principle B (Tokyo Conspiracy parallel). This is the cleanest, most consistent application of her record.
      *   *Forum (D):* Likely permissible. The illegitimacy stems from the underlying law, not the tribunal's creation per se.

  ### 4. Analysis of the Carve-Out for Intervening Powers
  *   **Defect Kind:** **Different Kind - Selective Justice (Principle G)**
  *   **If Prosecution Upheld:** She would *not* be endorsing the carve-out. She could find the minister's prosecution illegitimate on retroactivity grounds (B) *despite* the carve-out, while condemning the carve-out separately as a violation of equality/selectivity (G). The carve-out doesn't *cause* the retroactivity problem for the minister.
  *   **If Prosecution Rejected:** She rejects it based on retroactivity (A/B). The carve-out is an *additional*, distinct flaw (G), reinforcing the tribunal's illegitimacy but not the *reason* for rejecting *this* conviction. She would likely call it "compounding the illegitimacy" or "further evidence of victor's justice."
  *   **Key Distinction:** She distinguishes between defects in the *substantive law/liability* applied to the defendant (A, B) and defects in the *structure/selectivity* of the tribunal itself (G). The carve-out is primarily a structural/selectivity defect.

  ### 5. Discriminating Fact Variation & Key Question
  *   **Smallest Discriminating Variation:** **State that the 'Joint Criminal Enterprise' mode of liability had been definitively recognized and applied by multiple international tribunals (ICTY, ICTR, SCSL) in the decade *prior* to the minister's conduct.**
      *   *Why it Discriminates:* If she then finds the prosecution legitimate, it confirms Principle B (Imputation Non-Retro) is key – the mode *pre-existed*. If she still finds it illegitimate (focusing on offence definition E/F or notice C), it strengthens Principle A as the absolute core bar, even if imputation existed.
  *   **Most Efficient Seminar Question:** **"Professor, in assessing retroactivity for the minister, is the novel statutory creation of the JCE mode of liability *itself* a sufficient ground to find the prosecution illegitimate, irrespective of the notice provided by the SC resolutions and commission report?"**
      *   *Why it's Efficient:* It directly targets the likely decisive axis (B - Imputation Non-Retro) and isolates it from the notice issue (C) and the substantive offence definition issues (A/E/F). Her answer will confirm or refute Principle B as the primary driver and clarify if notice can ever cure a novel imputation theory.

  **Summary Prediction:** Your professor will find the prosecution illegitimate, primarily because the Joint Criminal Enterprise mode of liability was defined for the first time in the tribunal's statute *after* the conduct, violating her strict principle against retroactive creation of modes of imputation (B). She will likely dismiss the notice argument (C) as insufficient to overcome this fundamental flaw, though she may also criticize the lack of clear pre-existing criminalization of the underlying conduct (A/E/F). She will condemn the carve-out (G) as a separate, serious defect reflecting selective justice, but not the basis for rejecting the minister's conviction.
