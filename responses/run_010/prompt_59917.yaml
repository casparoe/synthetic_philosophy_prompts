prompt: |-
  I cover science and ideas for a general-interest magazine, and I am currently reporting a piece on why two Western legal systems that agree about nearly everything else in reproduction end up with almost opposite answers to the question of who a child's parents are. I want the underlying philosophy laid out properly rather than the usual set of talking points, and I have no access to specialist literature while I'm drafting, so I would rather you reason from the practices exactly as I describe them than direct me anywhere.

  The material I am working with is this. French civil law provides that any agreement concerning procreation or gestation on behalf of another is null and void, and separately that maternal filiation is established by the designation of the mother in the child's birth certificate — in effect, the woman who gives birth is the mother. That second principle is what makes anonymous egg donation legally invisible in France: because the donor never gives birth, the birth rule never engages against the recipient, and the woman who carries the pregnancy becomes the child's legal mother automatically, while the donor acquires no status whatsoever. The same principle is what defeats French intended parents who arrange a surrogacy abroad: the surrogate gave birth, so on the French view she is the mother, and their agreement is a nullity. Under pressure from the European Court of Human Rights, the French courts have nonetheless settled on recording the child's legal link to the biological father while leaving the intended mother's status to be constructed by adoption, a process that can take years and that leaves the child, in the interim, with one recognised parent.

  Italy has gone further. A 2024 statute amended its 2004 assisted-reproduction law so that Italians who arrange a surrogacy abroad can be prosecuted at home, on the reasoning that the offence is punishable wherever it was committed.

  California represents the opposite architecture. A gestational carrier agreement is enforceable; a court issues an order before the birth declaring the intended parents to be the child's legal parents whether or not either is genetically related to the child; no adoption is required; and both eggs and gestation are openly bought and sold, in a market that supplies intended parents from countries where the practice is banned.

  With that in front of you, I would like the following reconstructed.

  First: what does each architecture presuppose about what makes someone a parent — genetic connection, gestation, intention, the contract, or the state's own act of recognition? Please name the criterion each system actually relies on at the points where the criteria come apart, and pay particular attention to the fact that France appears to use gestation against the intended mother while using genetics in favour of the intended father.

  Second, the asymmetry I find hardest to explain to readers: the birth principle quietly validates compensated egg donation and invalidates compensated surrogacy, so that a woman may sell an egg but may not sell nine months of gestation. Does the practice require a substantive premise about which human capacities are inalienable — something about the difference between transferring a cell and having one's body occupied under contract — or is the philosophical work actually being done by something less principled, such as the enforceability of a contract against a person's body, the visibility of the market, the sheer difficulty of policing conduct abroad, or the fact that a surrogate is still present to be interviewed while a donor is not? Reconstruct the implicit theory, and be explicit about what the practice strictly presupposes as against what it merely fits comfortably with.

  Third: what does the French settlement — nullity abroad, partial recognition at home — presuppose about whose interests the ban serves? If the ban protects the surrogate, the visible costs fall on the child, whose legal identity is what gets delayed. If it protects the child, then recognising the father by genetics while refusing the mother looks arbitrary. Does the practice instead presuppose a third, expressive rationale — that certain transactions must not be given legal effect within the territory regardless of consequences for the people caught in them? Say whether that rationale can be held coherently alongside a legal system that everywhere else treats the child's interest as paramount.

  Fourth: what does extraterritorial criminalisation presuppose about the wrong in question — that it attaches to the actor's status as a citizen rather than to conduct within the state, and that it requires an identifiable victim somewhere abroad, or that it is the kind of wrong a state may prohibit without a victim at all?

  Fifth: what does the Californian model presuppose about persons — that parental status can be created by declaration and transferred by agreement? — and what does it thereby rule out, in particular the idea that parenthood is a status one finds oneself in rather than a right one acquires? Is that model consistent with the same jurisdiction's refusal to let people buy their way into adoption? If there is a principled line between paying a gestational carrier and paying a birth mother to relinquish, state it; if there is not, say so.

  Finally, tell me where these practices are philosophically underdetermined — where an inalienability view, a contractarian view, a care-ethics view, and a commodification-and-inequality view would all license the same rule, so that the law's choice is not in fact explained by any of them. And tell me what would have to change on the ground — who appears before a judge, what a registrar records, which party bears the risk when an arrangement collapses in the seventh month, what a child can learn at eighteen — if France and Italy adopted the Californian premise, or if California were made to adopt theirs.

  I am not looking for a survey of both sides, and I am not looking for a verdict on whether surrogacy should be legal. I want the implicit theories made explicit, the internal tensions located, and a flag anywhere that my description of the law is doing philosophical work I have misattributed.
reasoning: |-
  Okay, let me approach this systematically. The user is a science journalist dissecting fundamental philosophical divergences in how Western legal systems define parenthood, with France/Italy and California as contrasting models. They've provided detailed legal practices and want the underlying presuppositions excavated without directing to literature. 

  First, I need to map the core parental criteria each system relies on when forced to choose. France's birth-certificate rule makes gestation decisive for maternity, but then genetics salvages paternity - that asymmetry needs unpacking. The California model treats intention + contract as paramount, reducing biology and gestation to factors that can be waived. 

  The egg/surrogacy asymmetry in France is philosophically sticky. Why can gametes be alienated but not gestational labor? The key seems to be whether the body remains instrumentally engaged under another's control - not just commodification but ongoing embodiment. Contract enforceability against a person's physical autonomy appears to be the bright line.

  For France's partial recognition of foreign surrogacy, the "nullity" stance suggests the state views itself as defending the symbolic order, even when pragmatism forces accommodation for the child's sake. This creates tension with the usual "child's interests first" principle - the state is essentially saying some transactions are so existentially corrosive they must be denied legal oxygen, regardless of consequences. 

  Italy's extraterritorial criminalization takes this further, treating the act as malum prohibitum (wrong because prohibited) rather than malum in se (inherently wrong). It presupposes the state can define harms to the social fabric that require policing regardless of location or consent.

  California's model treats parenthood as a status constructed through performative declaration. The refusal to allow adoption payments while permitting gestational compensation hinges on whether the payment is for services (allowed) versus for the child itself (prohibited) - a distinction that holds only if you accept the initial declaration that the birth-giver isn't the parent.

  Where are these systems philosophically underdetermined? The treatment of egg donation is the blind spot. France allows anonymous egg sales under its birth rule, California allows them under contract - opposing systems converge here because both can frame gametes as alienable cells rather than embodied relationships. A consistent inalienability view would forbid both; a full commodification view would permit both. The convergence exposes how gamete provision sits in a conceptual gray zone.

  Finally, switching systems would have seismic practical consequences: in a California-to-France shift, intended parents become legal strangers at birth; surrogates gain irrevocable parental rights; children endure adoption limbo. France-to-California would erase the birth mother's status by court order; make parentage contingent on pre-birth contracts; and eliminate adoption as a path to recognition. The deepest chasm is whether gestation creates a mother or merely provides services.
answer: |-
  Here is a reconstruction of the philosophical presuppositions underlying each system, based strictly on the practices you describe, with explicit attention to tensions and underdetermined areas:

  ### 1. **Core Parental Criteria**  
  - **France**:  
    - *Motherhood*: **Gestation** is decisive ("the woman who gives birth is the mother"). This is a biological/embodied criterion.  
    - *Fatherhood*: **Genetic connection** is prioritized (biological father recognized post-birth).  
    - *Tension*: The asymmetry (gestation for mothers, genetics for fathers) reveals a **gendered duality**: maternity is defined by physical contribution to birth (irrevocable), while paternity is a genetic fact that can be legally acknowledged. Intention and contract are explicitly void.  
  - **Italy**: Mirrors France but extends state power to **deterrence** via extraterritorial criminalization. Parenthood is non-negotiable by private agreement.  
  - **California**: **Intentionality + contract** are foundational. Legal parenthood is established by pre-birth court order, rendering genetics and gestation transferable commodities. The state’s role is to enforce agreements, not define parenthood biologically.  

  ### 2. **Egg Donation vs. Surrogacy Asymmetry in France**  
  - **Strict Presupposition**: The law distinguishes between **alienable cells** (eggs) and **inalienable bodily autonomy**. Selling gametes is permissible because it involves a one-time transfer; gestation requires sustained physical occupation and intimate bodily service, making it inseparable from the person.  
  - **Secondary Factors**:  
    - *Contract Enforceability*: A surrogacy agreement demands ongoing control over a person’s body (enforceable performance), while egg donation is a discrete act.  
    - *Visibility*: Gestation produces a child whose origins are traceable to the surrogate; egg donation is anonymized and invisible.  
    - **Philosophical Anchor**: The practice presupposes that **gestation is a unique human capacity that cannot be commodified without violating bodily integrity**, whereas gametes are reducible to genetic material.  

  ### 3. **French Settlement: Whose Interests Does the Ban Serve?**  
  - **Primary Rationale**: **Expressive prohibition**. The ban signals that surrogacy is a moral harm to the social order (commodification of women/children), regardless of individual consequences. The state refuses to "validate" the transaction domestically.  
  - **Tension with Child Welfare**:  
    - Partial recognition (genetic father) is a pragmatic concession to the child’s needs under ECHR pressure, but it undermines the logic of the ban. If gestation defines motherhood, why is genetics sufficient for fatherhood? This reveals **inconsistency**: the state prioritizes symbolic integrity over coherent principles, creating a hybrid that serves neither fully.  
  - **Coherence Test**: The system cannot hold child interests "paramount" while delaying maternal recognition for years. The practice implies that **the moral harm of surrogacy outweighs immediate child welfare**.  

  ### 4. **Italy’s Extraterritorial Criminalization**  
  - **Presupposed Wrong**: Surrogacy is **malum prohibitum** (wrong because prohibited), not malum in se (inherently wrong). The state asserts that:  
    - The act harms **public order/morality**, not necessarily an individual victim.  
    - Citizenship binds actors to domestic norms worldwide.  
    - **Key Implication**: The victim is society itself; the child’s existence is evidence of the offense.  

  ### 5. **California’s Model: Personhood and Transferability**  
  - **Core Presupposition**: Parenthood is a **legally constructed status** created by declaration, not a biological or embodied fact. It rules out the idea that gestation or genetics inherently creates parental rights.  
  - **Adoption Payment Inconsistency?**:  
    - Paying a gestational carrier is compensation for **services** (pregnancy), while paying a birth mother to relinquish an infant is viewed as **buying a child**.  
    - **Principled Line?**: The distinction holds only if you accept California’s initial premise that the gestational carrier is *never* a legal parent. If she is a "service provider," payment is for labor; if she is the mother, payment for adoption is baby-selling.  
  - **Tension**: The model assumes parental rights are fully alienable via contract, yet resists extending this to adoption—a fragility in its logic.  

  ### 6. **Philosophical Underdetermination**  
  - **Egg donation legality** is underdetermined:  
    - France allows it (via birth rule invisibility); California allows it (via contract).  
    - But: A strict **inalienability view** (body parts cannot be sold) would prohibit egg sales. A **commodification view** could condemn both.  
    - **Convergence Point**: Both systems treat gametes as "detachable" from personhood in ways gestation is not, avoiding a clash.  
  - **Genetic father recognition in France** is underdetermined:  
    - It fits a **biological view** (genetics matter) but contradicts the gestational logic for mothers. A **care-ethics view** (parenting as relationship) or **contractarianism** would not explain the asymmetry.  

  ### 7. **Practical Consequences of Switching Premises**  
  - **If France/Italy adopted California’s model**:  
    - Surrogates lose automatic parental status; intended parents are legal parents at birth.  
    - Birth registrars record intended parents pre-birth, not the surrogate.  
    - If a surrogate refuses to relinquish the child, she breaches a contract but has no custodial claim.  
    - Children access genetic/surrogacy records at 18 (no anonymity).  
  - **If California adopted French/Italian premises**:  
    - Gestational carriers are legal mothers; intended parents must adopt.  
    - Pre-birth orders vanish; surrogacy agreements are unenforceable.  
    - Intended mothers in surrogacies lack legal standing during pregnancy.  
    - Collapsed arrangements leave intended parents without recourse; the child’s "legal identity" is contested at birth.  

  ### Key Tensions Uncovered:  
  - **France’s Asymmetry**: Gestation as motherhood + genetics as fatherhood is philosophically unstable; it reveals unacknowledged gendered assumptions.  
  - **California’s Adoption Blind Spot**: If parental status is purely contractual, why prohibit adoption payments? The carrier/birth-mother distinction is procedural, not moral.  
  - **Italy’s Overreach**: Criminalizing extraterritorial conduct assumes the act harms the state’s essence—a collectivist view at odds with liberal individualism.  

  These systems are not deduced from consistent principles but reflect **cultural prioritizations**: France elevates bodily integrity and social symbolism; California elevates autonomy and contractual freedom. The descriptive practices you provided hold philosophical contradictions that remain unresolved in application.
