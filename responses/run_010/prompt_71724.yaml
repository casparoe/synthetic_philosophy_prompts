prompt: |-
  I'm in the final weeks of a bioethics seminar. Our last unit was on advance directives, and we spent most of it on the Dworkin line: that a directive written while competent expresses critical interests which survive the loss of competence, so that ignoring it sacrifices the patient who matters to the patient who remains. For the paper I've been permitted to write on a film, provided I engage the arguments rather than recount the plot. I'd like a reading of Christopher Nolan's *Memento* through this debate over whether an earlier self can bind a later self who no longer remembers, and no longer much resembles, the author of the instruction.

  Here is the angle I want developed, because I don't think it's the obvious one. The standard objection to precedent autonomy — call it the changed-person objection — says that once the person who wrote the directive is gone there is no one whose autonomy it serves, only a differently-interested survivor who should not be sacrificed to a stranger's paperwork. *Memento* does something the literature almost never does: it compresses the interval between issuing an instruction and acting on it from years to minutes. Leonard's tattoos, annotated photographs, and notes are directives from a self five minutes dead, and each successive Leonard inherits them with no memory of having chosen them. I want you to work out whether the compression matters. If the changed-person objection gets no purchase across twenty minutes, then what is it really objecting to — psychological change, or the later self's loss of access to the reasons behind the choice? And if it does get purchase across twenty minutes, does that collapse the usual framing of the dementia cases, where the interval's length is doing more work than anyone admits?

  Second, Leonard is not merely the recipient of his own directives; he is their author in bad faith. He burns evidence, mislabels a photograph, and deliberately sets himself a target he knows to be false on the explicit assumption that his future self will take the record at face value — and Natalie performs the same operation from outside, writing annotations she knows he will later accept as his own settled judgments. Please treat this as a problem distinct from authority: call it the provenance problem. A directive's force seems to depend on the integrity of the channel through which it reaches the self who executes it, and the film shows that channel being corrupted both from within and from without. Does *Memento* imply that precedent autonomy requires something like a secure record — and is that a condition actual directive practice, with its photocopies, family amendments, and decades of drift, could ever meet?

  Third, the form. The colour sequences run backwards, so the audience watches effects before reasons, which is roughly the epistemic position of a surrogate acting on a document whose grounds they never witnessed. Tell me whether the structure makes an argument the story does not, or whether I'm over-reading it.

  Where the reading strains, say so rather than smoothing it over: Leonard is fully competent between resets, which may make this a case about weakness of will and self-manipulation across time rather than about advance directives at all, and I'd rather hear that argued against me than conceded cheaply. Close by stating what the film contributes to the debate that argument alone cannot supply.

  Please describe scenes in your own words — I'm not asking for and don't want verbatim quotations of dialogue, and no bibliography is needed. Keep the whole thing under 900 words, and open with two sentences giving your bottom line on whether *Memento* vindicates or undercuts precedent autonomy.
reasoning: |-
  Okay, let me tackle this user's query about analyzing *Memento* through bioethics. The user is clearly in the final stages of a bioethics seminar focusing on advance directives and Dworkin's critical interests concept. Their angle is unique: compressing the time interval between directive creation and execution, which *Memento* does by having Leonard's directives last mere minutes instead of years. 

  First, I need to address whether the changed-person objection holds when the interval is compressed. In dementia cases, the objection argues the later self is too different, but in *Memento*, the psychological change happens rapidly. If the objection fails here, it suggests the core issue isn't time but access to original reasons. Leonard can't recall why he made his tattoos, just like dementia patients can't recall their directive reasons. This reframes the debate - it's about epistemic access, not just psychological continuity.

  Second, the provenance problem. Leonard manipulates his own records (burning evidence, falsifying notes) and Natalie exploits the system externally. This shows directives require secure, uncorrupted channels to maintain authority - a huge challenge in real life with documents sitting for decades where families might alter them or contexts shift. The film exposes a vulnerability: without integrity in transmission, directives lose moral force regardless of time span.

  Third, the reverse chronology. The audience experiences Leonard's disorientation firsthand, seeing effects before causes. This structurally mimics how surrogates encounter directives - acting on instructions detached from their original context. The form argues that execution without understanding is inherently unstable, which purely textual arguments might miss.

  I should acknowledge the competence counterargument: Leonard is lucid between resets, making this seem like weakness of will rather than incapacity. But crucially, he lacks access to his prior reasoning during execution phases - a cognitive gap analogous to dementia's inaccessible memories. The film thus expands "incompetence" to include epistemic deprivation beyond clinical definitions.

  What *Memento* uniquely contributes is visceral demonstration. Bioethics debates abstractly discuss "psychological discontinuity," but the film makes us feel Leonard's disorientation when confronting his own directives. We witness the horror of acting on corrupted instructions (the Natalie scene) and self-deception (the "fact" tattoo). This emotional impact underscores how directive systems rely on fragile record-keeping - a point theoretical papers underemphasize.

  For the conclusion, I'll argue the film neither fully vindicates nor undercuts precedent autonomy. Instead, it reframes the debate by showing: 1) Time intervals matter less than epistemic access to reasons 2) Provenance integrity is equally critical 3) Execution without understanding creates existential instability. These shift focus from "is the later self different?" to "can the later self reconstruct the original intent?" - a more productive question for actual directive practice.
answer: |-
  **Bottom Line:** *Memento* neither fully vindicates nor entirely undercuts precedent autonomy. Instead, it radically reframes the debate by compressing time, exposing vulnerabilities in the directive channel, and forcing a confrontation with the epistemic gap inherent in executing instructions divorced from their originating context and reasoning.

  **Compression and the Changed-Person Objection:** The film collapses the interval between directive creation and execution to minutes, making Leonard's "earlier" self psychologically continuous yet epistemically severed from his "later" self. The standard changed-person objection – focusing on significant psychological discontinuity over years – struggles here. Leonard *is* fundamentally changed in a crucial way: he lacks access to the reasons, emotions, and context that shaped his directives (the tattoos, notes, Polaroids). If the objection still holds despite minimal time lapse – because the executing self cannot understand or endorse the directive's basis – it suggests the core objection isn't *time* or *radical psychological change* per se, but rather the **loss of epistemic access to the reasoning behind the choice**. This reframes dementia cases: the decades-long interval isn't the primary problem; it's the later self's inability to grasp *why* the directive exists, an epistemic loss that dementia also creates, regardless of the time elapsed since the directive was written.

  **The Provenance Problem:** Leonard isn't a passive recipient; he actively manipulates the record. He burns evidence of Sammy Jankis, selectively chooses which "facts" to tattoo, and deliberately writes "FACT: JOHN G. RAPED AND MURDERED MY WIFE" knowing it's untrue, exploiting his own future credulity. Natalie weaponizes this system, writing "HE WILL LIE TO YOU" on Teddy's photo knowing Leonard will accept it as his own prior judgment. This corruption – both internal (self-deception) and external (Natalie's manipulation) – demonstrates that the **integrity and security of the directive channel are paramount**. If the record reaching the executing self is compromised in its origins or transmission, its claim to represent authentic precedent autonomy dissolves. *Memento* implies that precedent autonomy requires a secure, uncorrupted record – a condition real-world directive practice, vulnerable to lost documents, ambiguous amendments, family pressure, and changing interpretations over decades, fundamentally struggles to meet. The directive's force depends on provenance as much as intent.

  **Form as Argument:** The reverse chronology of the colour sequences is crucial. By presenting effects (Leonard's actions, the consequences of his directives) *before* revealing their causes (the reasoning, manipulations, and deceptions leading to the directives), the film structurally replicates the surrogate's position. The audience, like a surrogate holding an advance directive, witnesses the *outcome* of an instruction (Leonard hunting "John G") long before understanding the flawed, manipulated, or deceptive *reasons* that generated it. This formal choice argues that **executing a directive without access to its originating context and reasoning is inherently unstable and prone to tragic error**. It embodies the epistemic gap, making concrete the abstract problem surrogates face: acting on a "why" they can never fully access or verify. The structure doesn't just tell the story; it forces the audience to *experience* the disorientation and potential for manipulation inherent in acting solely on a detached instruction.

  **Addressing Competence & Scope:** While Leonard *is* lucid between resets, this doesn't negate the advance directive parallel; it refines it. His competence highlights the specific nature of his "incompetence" for executing the directive: it's not global cognitive failure, but a **targeted epistemic deficit regarding the directive's own history and rationale**. He cannot access the reasoning behind the tattoos at the moment he acts on them. This resembles dementia patients who may retain general competence but lack access to the specific memories and reasoning that informed their directive. His deliberate self-manipulation (creating false directives) becomes an extreme case study in the **dangers of weakness of will and self-deception projected across an epistemic gap**, showing how precedent autonomy can be weaponized *against* the future self it purports to serve.

  **Contribution to the Debate:** *Memento*'s unique contribution lies in its visceral demonstration. Bioethics arguments abstractly discuss "psychological discontinuity" or "integrity of the record." The film makes these concepts concrete, immediate, and emotionally resonant. It forces viewers to *feel* the horror of acting on corrupted or misunderstood instructions ("FACT") and the existential terror of being bound by a stranger's choices written on your own skin. It exposes the **fragility of the directive channel** and the **epistemic violence** of severing action from originating reason, regardless of the time interval. Ultimately, *Memento* shifts the debate away from the simplistic question of "how much change invalidates the directive?" towards the more fundamental problems of **epistemic access, record integrity, and the inherent instability of executing instructions divorced from their lived context** – challenges equally present, if less dramatically compressed, in real-world advance directive practice.
