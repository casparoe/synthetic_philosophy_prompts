  ### Key Design Notes:
  1. **Method Individuation as Pivot**: The tree starts with relevant alternatives (Q1–Q2) to force a stance on scepticism early. But the *method* axis (Q4, Q9) is the hidden keystone: it determines if modal conditions are substantive (fine-grained) or decorative (coarse-grained). Your friend’s view lives at L3/L7, where methods are coarse and adherence collapses.
  2. **Your Cases Integrated**: 
     - Nia (Q3–Q4) tests sensitivity/method individuation. 
     - Mared (Q8) tests scepticism/safety. 
     - Conservation team (Q6) tests closure. 
     - Sayed (Q7) tests closure/scepticism interaction.
  3. **Novel Cases**: 7/10 cases are new (e.g., Q9’s prank clock, Q10’s chess AI, Q1/Q2’s Arthur vignettes). Classics (barn façades, stopped clock) are re-parameterized.
  4. **Branching Logic**: 
     - Sceptics (Q1B) exit early. 
     - Closure (Q6) is only asked if scepticism is rejected (Q1A). 
     - Method individuation (Q4) is only asked if sensitivity is deemed necessary (Q3B).
  5. **Inseparable Pair**: L5 (contextualism) and L6 (objective alternatives) both deny that knowledge survives conversational salience shifts (Q2B). A new case (warning about non-existent risks) would split them.
  6. **Empty Combinations**: The "closure denial + coarse methods" gap is incoherent; the "scepticism + safety" gap is underexplored.
  7. **Bottom Line**: Your debate was secretly about method individuation. If methods are coarse, adherence does no work (your friend’s view); if fine, it’s load-bearing (your view). Closure disputes are downstream of this.
