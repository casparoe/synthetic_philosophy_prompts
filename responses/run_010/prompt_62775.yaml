  We need one value system that has a high intensity on an issue that others find repulsive to accommodate. The Business Advocate has high on B (opposing wealth redistribution) which might be repulsive to the Social Democrat and the EA.

  So if a Social Democrat trades with a Business Advocate, the Social Democrat might take a token on A (environment) and give the Business Advocate a token on B? But the Business Advocate doesn't want a token on B (because they care a lot about B). So they won't trade.

  The trade would be: Social Democrat has two tokens, say one A and one B. They care a lot about B, so they want to get rid of the B token. They find a Business Advocate who has, say, two tokens: one A and one C. The Business Advocate cares a lot about B, but they don't have a B token? So they can't directly help. They might not trade.

  This is getting complex. We must trust that with the intensities, trades will occur.

  For the repulsive element, the description of the Business Advocate might make it clear that they are against wealth redistribution, which might make Social Democrats reluctant to trade with them, even if it's beneficial.

  ### Drift Mechanic
  After each round, for each issue, compute the average intensity of all players for that issue. Then each player adjusts each of their intensities by moving one step toward that average.

  Example: 
  - Issue A average: 3.0
  - Player1 has A:5 -> moves to 4
  - Player2 has A:1 -> moves to 2
  - Player3 has A:3 -> stays 3

  This drift represents the player's values changing to become more like the group's values over time as they compromise.

  ### How Insight 3 is Achieved
  A player might make a trade that is good in the short term (e.g., they get rid of a high-intensity token and take a low-intensity one) but over time, due to drift, the low-intensity issue becomes more important to them (because the group average is higher) and the high-intensity issue becomes less important. Then, in a later round, they might hold tokens on the issue that used to be low intensity but is now higher, and they accumulate penalties. Also, they might have given away tokens on an issue that becomes less important, so they avoid penalties there. But the net effect might be that they end up with a higher total penalty than if they had never traded and just accepted the tokens they were given.

  Moreover, they might have become a different person, caring about different things.

  ### Player Cards Example
  Card for EA:

  **Effective Altruist**
  - Environmental Regulation: 5
  - Wealth Redistribution: 4
  - Social Regulation: 1
  - Description: "You focus on doing the most good. You support environmental regulations and wealth redistribution to improve overall welfare, but you are willing to accept social regulations if needed."

  Card for Business Advocate:

  **Business Advocate**
  - Environmental Regulation: 1
  - Wealth Redistribution: 5
  - Social Regulation: 2
  - Description: "You believe in free markets and minimal government intervention in business. You oppose wealth redistribution and high taxes, but are flexible on environmental and social regulations."

  ### Timeline
  - Setup: 10 minutes (distribute cards, tokens for round 1, explain rules)
  - Round 1: 15 minutes trading, 5 minutes scoring and drift
  - Round 2: 15 minutes trading, 5 minutes scoring and drift
  - Round 3: 15 minutes trading, 5 minutes scoring and drift
  - Round 4: 15 minutes trading, 5 minutes scoring and drift
  - Final Scoring and Debrief: 20 minutes

  Total: 10 + 4*(15+5) + 20 = 10 + 80 + 20 = 110 minutes (a bit over, but we can adjust).

  Alternatively, make rounds 10 minutes trading and 5 minutes for scoring/drift (15 per round) -> 60 minutes for rounds, total 90.

  ### Rules Explanation
  "Welcome to the Compromise Game. In this game, you each represent a different set of values, described on your card. There are three issues: Environmental Regulation, Wealth Redistribution, and Social Regulation. On your card, you see three numbers (from 1 to 5) indicating how much you dislike having a token of that issue. A 5 means you really don't want it, a 1 means you don't mind as much.

  Each round, you will each receive two tokens. These tokens are a burden to you. Your goal is to minimize the total burden (penalty) over the game.

  At the start of each round, I will give each of you two tokens, drawn randomly. Then, you will have [10] minutes to trade tokens with other players. You can trade one-for-one, or multiple tokens. The goal is to end up with tokens that are less burdensome to you.

  After trading, we will calculate your penalty for the round: for each token you hold, multiply the number of tokens by your current intensity for that issue, and sum these up. Record your penalty.

  Then, we will adjust your intensities: for each issue, we will compute the group average. You will then move each of your intensities one step closer to the average (if your intensity is above the average, decrease by 1; if below, increase by 1; no change if equal).

  We will play four rounds. At the end, sum your penalties from all rounds. The player with the lowest total penalty wins.

  Any questions? Let's begin."

  ### Debrief
  After the game, ask:

  1. "How did you feel about the trading? Did you manage to reduce your penalty by trading?" 
     - This should lead to insight 1: trading can make you better off.

  2. "Were there any trades you didn't want to make? Why? How did you feel about trading with players who had very different values?"
     - This should lead to insight 2: some trades feel like betrayal.

  3. "Look at how your intensities changed over the game. How did that affect your penalties in later rounds? Did anyone find that a token that wasn't a big deal early on became a problem later? Or vice versa?"
     - This should lead to insight 3: compromising changes what you care about.

  Then introduce the terms:
  - Insight 1: Gains from trade (Pareto improvement)
  - Insight 2: The expressive content of compromise, integrity concerns
  - Insight 3: Endogenous preferences (your preferences change as a result of your actions)

  ### What Might Go Wrong
  - **Problem**: The random token distribution might be too uneven, causing some players to have very high penalties regardless of trading.
    **Solution**: Use a fixed distribution for the whole group to ensure fairness? But that's complex. Instead, acknowledge luck and focus on the relative improvement from trading.

  - **Problem**: Players might not trade because of the repulsive value system.
    **Solution**: That's part of the point. In debrief, discuss why they avoided trading.

  - **Problem**: The drift might not be noticeable or might not cause the intended effect.
    **Solution**: Use large enough initial differences and enough rounds. In our setup, with 4 rounds, it should be noticeable.

  - **Problem**: Scoring takes too long.
    **Solution**: Have players calculate their own penalties and report. Moderator can verify a few.

  - **Problem**: Players might form coalitions or refuse to trade with certain people.
    **Solution**: Allow it; it's part of the dynamics.

  ### What the Game Cannot Capture
  The game cannot capture the intrinsic reason why some compromises feel like betrayal beyond the change in preferences. In particular, the game mechanizes the change in preferences, but in reality, there might be a sense of betrayal even without any preference change, simply because of what the compromise expresses. The game might reduce the expressive content to the drift, but the drift is a consequence, not the expression itself. In debrief, you will have to articulate that the act of compromise can be seen as endorsing the other's values, which might be offensive independently of any change in what you care about.

  ### Final Answer on Drift Mechanic
  \answer{lands} because the drift mechanic directly alters the players' value intensities based on group behavior, and over multiple rounds, players will experience holding tokens that become more burdensome due to their own changing values, thus feeling the cost of becoming someone they weren't at the start.
answer: |-
  ### The Compromise Game: Setup and Rules

  **Concept Overview**  
  Players represent different value systems and must trade "concession tokens" (representing policy compromises) to minimize their penalty scores. The drift mechanic causes players' value intensities to shift toward the group average after each round, simulating how compromise can reshape what they care about. Players experience:  
  1. **Pareto gains** from trading with those who hold opposing values.  
  2. **Betrayal aversion** when trading on "repulsive" issues.  
  3. **Endogenous preference shifts** as their values change post-trade, potentially making them worse off.  

  **Issues & Values**  
  Three policy issues (neutral framing to avoid pre-game debate):  
  - **Green**: Environmental protection (e.g., carbon taxes, conservation).  
  - **Share**: Economic redistribution (e.g., wealth taxes, social programs).  
  - **Self**: Bodily autonomy (e.g., abortion access, assisted dying).  

  Each player card lists intensities (1-5) for how much they **oppose concessions** on each issue (higher = worse to accept).  

  ---

  ### Materials List (Printable in 15 mins)  
  1. **Player Cards**: 14 cards (3 copies of 4 common roles, 2 copies of 1 sensitive role). Print on cardstock or paper.  
  2. **Tokens**: 150 tokens total (50 each of Green/Share/Self). Use colored paper clips, beads, or cut paper:  
     - Green tokens: ♻️ or green paper  
     - Share tokens: ⚖️ or blue paper  
     - Self tokens: ⚕️ or red paper  
  3. **Score Sheets**: 1 per player (simple grid: Round 1-4, penalties, intensities).  
  4. **Group Average Tracker**: 1 sheet for moderator (to record average intensities each round).  
  5. **Token Bag**: Draw tokens from a bag/box.  

  ---

  ### Player Cards (Text for Printing)  
  **Print 3 copies of each:**
  - **Effective Altruist (EA)**  
    *"Focus on measurable impact. Support evidence-based policies, even if unpopular."*  
    Green: 5 ⚠️ | Share: 4 ⚠️ | Self: 1  
    *Initial Penalty per Token*: Green:5, Share:4, Self:1  

  - **Libertarian**  
    *"Individual choice comes first. Oppose government overreach in all forms."*  
    Green: 1 | Share: 1 | Self: 5 ⚠️  
    *Initial Penalty per Token*: Green:1, Share:1, Self:5  

  - **Social Justice Advocate**  
    *"Fight systemic inequality. Redistribution and social protections are non-negotiable."*  
    Green: 3 | Share: 5 ⚠️ | Self: 4 ⚠️  
    *Initial Penalty per Token*: Green:3, Share:5, Self:4  

  **Print 2 copies of this (repulsive role):**
  - **Traditionalist**  
    *"Preserve moral traditions. Society must uphold shared values over individual desires."*  
    Green: 2 | Share: 3 | Self: 5 ⚠️  
    *Initial Penalty per Token*: Green:2, Share:3, Self:5  
    *(Note: "Self" opposes bodily autonomy concessions. This role is designed to trigger betrayal aversion.)*  

  ---

  ### Game Rules  
  **Objective**: Minimize total penalty (lower = better).  
  **Setup** (5 mins):  
  - Hand out random player cards and score sheets.  
  - Give each player 2 random tokens from the bag.  
  - Explain briefly:  
    > "Each token you hold is a concession you’ve accepted. Multiply tokens by your intensities to calculate penalties. Trade tokens to lower your penalty. After each round, your intensities will shift slightly. We play 4 rounds."  

  **Round Structure** (4 rounds, 15 mins each):  
  1. **Trading Phase (10 mins)**:  
     - Players trade tokens 1:1 (e.g., "I give you 1 Share for 1 Green").  
     - No multi-token trades (keeps it simple).  
     - Players can refuse trades for any reason.  
  2. **Scoring (2 mins)**:  
     - Penalty = (Green tokens × Green intensity) + (Share tokens × Share intensity) + (Self tokens × Self intensity).  
     - Record penalty on score sheet.  
  3. **Drift Phase (3 mins)**:  
     - Moderator calculates group average intensity for each issue (e.g., add all players’ Green intensities, divide by 14, round to nearest 0.5).  
     - Each player adjusts each intensity **one step** toward the average:  
       - If intensity > average, decrease by 1.  
       - If intensity < average, increase by 1.  
       - If equal, no change.  
     - Update intensities on player cards (min 1, max 5).  

  **End of Game**:  
  - Sum penalties from all 4 rounds. Lowest total wins.  

  ---

  ### Timeline (Total: 75 mins)  
  - Setup: 5 mins  
  - Round 1: 15 mins (Trade 10, Score 2, Drift 3)  
  - Round 2: 15 mins (Trade 10, Score 2, Drift 3)  
  - Round 3: 15 mins (Trade 10, Score 2, Drift 3)  
  - Round 4: 15 mins (Trade 10, Score 2, Drift 3)  
  - Final Scoring/Debrief: 10 mins  

  ---

  ### Debrief Questions (Map to Insights)  
  1. **Pareto Gains**:  
     > "Show of hands: Who lowered their penalty in at least one round by trading? What made it work?"  
     *Introduce term: "Gains from trade" (mutual benefit from differing values).*  

  2. **Betrayal Aversion**:  
     > "Did anyone refuse a trade that would’ve helped their score? Why? How did it feel to trade with certain roles?"  
     *Introduce term: "Expressive content" (compromise as endorsement of repulsive values).*  

  3. **Endogenous Preferences**:  
     > "Look at your final intensities. Did tokens you accepted early on hurt you more later? Did anyone end up worse off *because* of how their values changed?"  
     *Introduce term: "Endogenous preferences" (your compromises reshape what you care about).*  

  ---

  ### Predictable Problems & Fixes  
  - **Problem**: Players avoid trading with the Traditionalist due to discomfort.  
    **Fix**: Let it happen! This surfaces betrayal aversion. Note it for debrief.  
  - **Problem**: Token draws are lopsided (e.g., one player gets high-penalty tokens).  
    **Fix**: Reassure players that drift will shift incentives. Randomness is intentional.  
  - **Problem**: Math takes too long during scoring.  
    **Fix**: Provide calculators or simplify (e.g., pre-print intensity multipliers on cards).  
  - **Problem**: Players don’t notice the drift trap until too late.  
    **Fix**: In drift phase, announce: "Your Green intensity just increased. How might this affect future trades?"  

  ---

  ### What the Game Cannot Capture  
  **The game cannot structurally reproduce the idea that some compromises corrupt the *intrinsic worth* of a value beyond mere preference shifts.** For example, a Social Justice Advocate might feel that trading on wealth redistribution ("Share") commodifies justice, turning it into a bargaining chip. This "corruption" isn’t just about changing intensities—it’s about degrading the moral language itself. You’ll need to articulate this in debrief: "Compromise isn’t just about changing your preferences; it can make the thing you cared about seem negotiable, which might hollow out its meaning."  

  ---  

  \answer{lands} because the drift mechanic forces players to confront how their values erode/adapt after repeated trades, and the Traditionalist role ensures some trades feel viscerally wrong, making the preference shift feel like a loss of integrity rather than a math error. In your room, the EA and virtue ethics factions will *feel* the trap when a low-priority issue (e.g., EA’s "Self") becomes costly after drift, and the economists will see the numbers backfire.
