  ### Analysis of Sub-Replacement Fertility as a Policy Alarm

  The institutional practice of treating sub-replacement fertility (below ~2.1 children per woman) as an alarm, while simultaneously advocating immigration as a substitute and funding family planning abroad, reveals a complex interplay of values. This practice does not strictly require commitment to impersonal totalism (where more lives worth living are intrinsically better). Instead, it primarily rests on **instrumental concerns for existing and near-future citizens**: aging populations threaten fiscal stability (e.g., unsustainable pension systems), economic dynamism (smaller labor forces reduce innovation and growth), and national influence (reduced geopolitical clout). These are person-affecting harms: fewer workers strain social services for today’s elderly, and smaller markets disadvantage current businesses. The alarm thus functions as a pragmatic response to dependency ratios, not an axiomatic endorsement of larger populations.  

  **Immigration as a "substitute" exposes the state’s true priority: maintaining domestic population size and balance**, not global population growth. Relocating people addresses labor shortages and fiscal gaps without increasing total persons, showing the alarm is rooted in national welfare, not a totalist obligation to maximize lives. This substitution is **consistent with totalism** only if totalism is interpreted as *nationally bounded* (valuing more citizens *within the state*). Globally, it contradicts totalism’s impartiality, revealing a tacit prioritization of existing citizens’ interests.  

  The **non-identity problem** underscores that future people affected by pronatalist policies cannot be identified in advance; their existence depends on the policy itself. Governments cannot coherently claim these policies "benefit" specific future individuals. Instead, rhetoric about "future generations" serves as a **proxy for collective continuity**: preserving institutions, culture, and economic systems valued by *current* citizens. Policies are justified by preventing harms to present people (e.g., collapsing social security), not by obligations to potential lives.  

  **Rival population-ethical views are implicitly excluded**:  
  - **Average utilitarianism** (valuing well-being per capita) would treat falling fertility as a *gain* if it raises average income. The practice ignores this, focusing on aggregate GDP or labor-force size.  
  - **Strict person-affecting views** (requiring policies to benefit identifiable individuals) are strained by pronatalism’s focus on statistical futures. The practice sidesteps this by emphasizing harms to *existing* people (e.g., taxpayers facing higher burdens).  
  - **Critical-level theories** (where lives below a "critical" well-being threshold diminish value) are not reflected; the alarm triggers regardless of projected quality of life.  

  **Internal consistency** across policies is **in-tension**:  
  - *Tax subsidies* and *immigration* align instrumentally (both boost domestic workforce).  
  - *Funding contraception abroad* contradicts a totalist impulse to maximize lives globally but fits a *developmental* logic: reducing fertility in low-income countries may raise local living standards, aligning with aid objectives. The tension arises if states frame domestic pronatalism as a moral imperative rather than a contextual fix.  

  The policy package is **philosophically underdetermined**. Identical policies could arise from:  
  1. **Instrumental nationalism**: Valuing population size only for economic/cultural resilience.  
  2. **Nationally bounded totalism**: Prioritizing more citizens *within the state*, indifferent to global numbers.  
  3. **Contractualism**: Policies as a bargain between generations to sustain institutions.  

  **If the presupposed view were replaced**:  
  - **Explicit totalism**: Policies would need global pronatalism (abandoning contraception funding) and could not treat immigration as a "solution" (since it doesn’t add lives). Rhetoric would shift to "maximizing human flourishing" impartially.  
  - **Strict person-affecting view**: Pronatalist subsidies would be indefensible (no identifiable beneficiary). Immigration would be framed as benefiting *migrants* (escaping poverty), not host states. Family planning aid would expand as it clearly benefits existing individuals.  

