prompt: |-
  I'm a staff software engineer at a mid-sized freight logistics company, and I sit on our Autonomy Review Board: a seven-person standing committee that decides whether a given automated system is cleared to operate without a human in the loop. My training is entirely in engineering — I have no background in philosophy, voting theory, or social choice, so please don't assume I know the vocabulary, and don't assume anyone on the board does either.

  We have a problem with a vote that was taken eleven days ago, and the chair has asked me to circulate a written opinion before we reconvene in nine days. I'd like you to draft that opinion for me.

  **The charter's certification rule.** Our charter lists three criteria and states that a system is certified if and only if it satisfies all three:

  - **C1 (fault tolerance):** the system passes the fault-injection suite at the required severity class, with no unresolved findings rated above "minor."
  - **C2 (rollback):** there is a tested path that returns the affected fleet to manual dispatch within 90 seconds of a trigger, including under a realistic control-plane network partition.
  - **C3 (operational load):** projected incremental on-call burden fits inside the SRE organization's agreed staffing budget for the coming quarter.

  In practice the board votes separately on each criterion and then separately on certification overall. The charter never says which of those votes controls if they come apart. Last week they came apart.

  **The ballots, as recorded.** Seats: (1) Platform Engineering lead, (2) SRE lead, (3) independent safety reviewer, who reports to the CTO rather than to the product org, (4) the product manager for the feature, (5) the controls engineer who built it, (6) compliance counsel, (7) me.

  | Seat | C1 | C2 | C3 | Certify overall |
  |---|---|---|---|---|
  | 1 | yes | yes | no | no |
  | 2 | yes | no | yes | no |
  | 3 | yes | yes | yes | no |
  | 4 | no | yes | yes | no |
  | 5 | yes | no | yes | no |
  | 6 | no | yes | yes | no |
  | 7 | yes | yes | yes | yes |

  Counted criterion by criterion, C1 carries 5–2, C2 carries 5–2, and C3 carries 6–1, so on the charter's own stated rule the system satisfies all three and should be certified. Counted as a direct vote on certification, it fails 6–1. Both tallies are arithmetically correct on the same set of ballots. The chair wants to know which one is "the decision," and whether we are entitled to change our minds about that now.

  **Facts you'll need to reason about the stakes.**

  - The system is already live behind a feature flag on 6% of our fleet, under a time-boxed exemption. The charter requires an uncertified system to be pulled from production within 30 days of its review, so we have roughly 19 days if nothing else happens.
  - We have committed contractually to bring one customer's regional hub to fully automated dispatch this quarter. Rolling the flag back means manual dispatch at that hub plus a service-credit clause that my director has already told me is expensive but survivable.
  - Seat 3 accepts all three criteria but voted no on certification, explaining that she regards C1–C3 as necessary conditions the board agreed to track, not a complete account of what certification means; she thinks the charter is missing a fourth consideration, roughly the erosion of dispatcher skill during long stretches of uneventful automation, and she does not think a system should be certified without it.
  - Seat 1 told me privately, after the meeting, that they voted no on C3 even though they believed the on-call burden was in fact within budget, because they wanted the rollout pushed a quarter and voting against C3 was the cheapest way to do it. They asked me not to repeat this. I think it bears directly on whether separate criterion votes can be trusted at all, and I want your advice on whether the memo can use the fact without attributing it to a named seat.
  - C3 is not really independent of C2. Two members who voted no on C2 said afterward that their yes on C3 assumed the rollback path works, so their two votes are only jointly coherent on an assumption the board rejected. Nobody re-voted.
  - We run roughly forty of these reviews a year, on the same charter language and the same ballot structure.

  **What I want the document to do.** It should read as a memo from me to the board, roughly 900 to 1,200 words, and it should:

  1. Put the recommended bottom line in the first few sentences: what the board should record as the outcome of last week's vote, what happens to the flag, and by when.
  2. Explain why the two counting procedures diverge on these particular ballots, and then explain the general pattern, so I can tell whether this was a one-off bookkeeping accident or something structural that will recur across our other ~39 reviews a year. Reason from the shape of our case; don't lean on authority.
  3. Recommend a procedure for this case and defend it. If your answer is that the criterion votes govern, say what that does about Seat 3's objection that the criteria are not sufficient. If your answer is that the certification vote governs, say what the board is supposed to make of the fact that a majority endorsed every stated criterion. Take a position on whether we are entitled to re-open a completed vote: two members say re-opening is moving the goalposts after the fact, and one says a vote whose outcome depends on an unstated choice of counting order was never a determinate vote to begin with.
  4. Propose concrete charter language for future reviews. Address at minimum: whether the board should keep voting on criteria separately; what to do when members disagree about how the criteria combine into the decision, as Seat 3 does; whether the board should be required to state the aggregation rule before voting rather than after; and whether the paradox depends on the conjunctive form of our rule or would also bite under a rule like "certification requires any two of the three." Say whether adding a fourth criterion to the charter would make this better or worse.
  5. Give the strongest honest case against your recommendation — not a strawman. I expect at least one board member to argue the opposite conclusion in the meeting, and I want to have already understood their best version.

  Two constraints. First, no citations, no reading list, no papers or authors I'd have to look up; I can't verify any of it and nobody here would read it. If there is a standard name for the phenomenon, you may mention it once in passing so I know what to call it in the room, but the memo has to stand entirely on its own reasoning. Second, keep it usable: it's going to engineers, a product manager, and one lawyer, and it will be read in about ten minutes before a meeting where we have to actually decide something.
reasoning: |-
  We are given a situation where the board voted on three criteria (C1, C2, C3) and then on the overall certification. The ballots show:
  - C1: 5 yes, 2 no -> passes
  - C2: 5 yes, 2 no -> passes
  - C3: 6 yes, 1 no -> passes
  But the overall certification vote: 1 yes, 6 no -> fails.

  The charter states that certification requires satisfying all three criteria. However, the voting procedure is ambiguous because the board votes separately on each criterion and then on the overall certification. The question is which vote controls.

  We must consider:
  - The board's votes on criteria are not independent (e.g., C3 vote may depend on C2 passing).
  - Seat 3 believes the criteria are necessary but not sufficient (wants a fourth criterion).
  - Seat 1 admitted to voting strategically (voted no on C3 even though they believed it was satisfied to delay rollout).

  The memo should:
  1. State the bottom line at the beginning.
  2. Explain why the divergence happened and if it's a one-off or structural.
  3. Recommend a procedure for this case and defend it.
  4. Propose charter language for the future.
  5. Give the strongest case against the recommendation.

  Bottom line recommendation:
  Given the charter states that certification is if and only if all three criteria are satisfied, and the criterion votes show all three are satisfied, I recommend that the board record the system as certified. Therefore, the feature flag can remain, and the system is approved for continued operation.

  However, note that the overall certification vote failed 6-1. But the charter defines certification based on the criteria, not on a separate vote. The separate vote on certification was not contemplated by the charter and is therefore advisory at best.

  But wait: Seat 3's concern is that the criteria are not sufficient. The charter, however, states that satisfying the three criteria is both necessary and sufficient. Therefore, if the board wants to add a fourth criterion, they must change the charter. Until then, the charter rule must be followed.

  Also, the strategic vote by Seat 1 undermines the integrity of the criterion votes. But we cannot change votes after the fact, and the vote was recorded as cast.

  Another issue: the interdependence of C2 and C3. Two members who voted yes on C3 did so under the assumption that C2 passes. Since C2 passed, their votes on C3 are consistent. But note: the vote on C3 was taken without knowledge of the outcome of C2. This highlights a problem with separate voting on criteria that are not independent.

  But in this case, both C2 and C3 passed, so the assumption held.

  Given the above, the bottom line is: the system is certified because it met the three criteria as per the votes. The overall certification vote is not the controlling vote because the charter defines certification by the criteria.

  However, we must also consider that the board might feel that the overall vote reflects the collective judgment. But the charter does not provide for that.

  Now, for the memo:

  ---

  **MEMORANDUM**

  To: Autonomy Review Board  
  From: [Your Name], Staff Software Engineer  
  Date: [Current Date]  
  Subject: Recommendation on Certification Vote and Procedure for Future Reviews  

  **Bottom Line**  
  The outcome of last week's vote must be recorded as certification **approved** because the system met all three criteria as required by the charter. Consequently, the feature flag can remain in place, and the system continues to operate on 6% of the fleet. There is no need to roll back the system within the 30-day window because the system is certified. However, due to the ambiguity in the voting procedure and the concerns raised, I recommend that the board clarify the voting rules immediately for future reviews.

  **Why the Divergence Occurred**  
  The divergence between the criterion votes (which passed) and the overall certification vote (which failed) is due to two main factors:

  1. **Strategic Voting**: One board member (without naming) admitted to voting against a criterion they believed was satisfied in order to achieve a different outcome (delaying rollout). This caused the C3 vote to show one "no" that did not reflect the member's true assessment of the criterion. However, the vote stands as recorded.

  2. **Differing Interpretations of the Certification Question**: When voting on overall certification, some members considered factors beyond the three criteria. Specifically, one member (Seat 3) voted "no" on certification because they believe the criteria are not sufficient (they want a fourth criterion). Others may have had similar unstated reasons. Additionally, two members who voted "yes" on C3 did so under the assumption that C2 would pass (which it did). But when voting on overall certification, they may have considered the system as a whole and found it lacking for reasons beyond the criteria.

  This divergence is not a one-off accident; it is structural and likely to recur because:
  - The board votes on criteria separately without knowing the outcome of other criteria, which is problematic when criteria are interdependent (like C2 and C3).
  - The charter does not specify whether the overall certification vote is binding or advisory. Without a clear rule, members may use the overall vote to express their holistic judgment, which may include factors beyond the three criteria.

  **Recommendation for This Case**  
  The charter states: "a system is certified if and only if it satisfies all three" criteria. The votes on the criteria show that the system satisfies all three (C1: 5-2, C2:5-2, C3:6-1). Therefore, the system is certified. The separate vote on overall certification is not the basis for certification under the current charter.

  However, we must address Seat 3's concern: the charter currently defines the criteria as both necessary and sufficient. If the board believes that additional factors (like dispatcher skill erosion) are required for certification, then the charter must be amended to include them. Until then, we are bound by the existing rule.

  Regarding reopening the vote: I do not recommend reopening because the votes were taken and recorded. Reopening would set a precedent that votes are not final and could be revisited until the desired outcome is achieved, which undermines the process. The vote was determinate: the criteria were met, so certification is granted by the charter.

  **Proposed Charter Amendments for Future Reviews**  
  To prevent such ambiguities, I propose the following changes:

  1. **Clarify the Voting Control**: The charter should state unambiguously that certification is determined solely by the votes on the criteria (if all three are approved, the system is certified) and that the overall certification vote is advisory only. Alternatively, if the board wishes the overall vote to be binding, then the criteria votes should be advisory. However, the latter would make the criteria less meaningful.

  2. **Eliminate the Overall Certification Vote**: Since the charter already defines certification by the criteria, the separate overall vote is redundant and confusing. I recommend removing it. Instead, the board should vote only on the criteria, and the chair should then declare the result based on the criteria.

  3. **Address Interdependent Criteria**: The board should discuss criteria dependencies before voting. If a criterion (like C3) depends on another (like C2), then the board should vote on the dependent criterion conditionally (e.g., "if C2 passes, then C3 is ...") or vote on the criteria in a specific order. Alternatively, the board could vote on the criteria simultaneously but then allow members to change their votes on a criterion if a related criterion fails. However, this complicates the process. A simpler approach is to have a single vote on certification, with the criteria being factors the board considers but not individually voted on.

  4. **Sufficiency of Criteria**: If the board believes the criteria are not sufficient, they should amend the charter to add any new criteria. Until then, the criteria as written are the complete set. The board should review the criteria annually to ensure they remain sufficient.

  5. **Voting Rule for Non-Conjunctive Requirements**: Even if we change the rule to "any two of three", a similar paradox can occur. For example, a majority might support any two criteria individually, but when asked to vote on overall certification (which requires any two), they might reject it because they believe the system fails on the third. This phenomenon (sometimes called a "voting paradox") can arise in any situation where the whole is not the sum of the parts. Therefore, the safest approach is to have a single vote on the certification question, with the criteria serving as guidelines for the members' judgment.

  6. **Adding a Fourth Criterion**: Adding a fourth criterion would not inherently solve the problem; it might even make the divergence more likely because more criteria increase the chance of strategic voting or interdependencies. The root issue is the aggregation of multiple votes into one decision.

  **Strongest Case Against This Recommendation**  
  The strongest argument against certifying the system is that the board's overall vote (6-1 against) reflects the collective judgment that the system is not ready for certification. The criteria votes, while passing, were cast without the full context of the system's readiness. For example:
  - Seat 3's "no" on certification because of an unaddressed risk (dispatcher skill erosion) is a valid safety concern that the criteria votes ignored.
  - The strategic vote on C3 by Seat 1 undermined the integrity of the criterion vote, and we should not reward such behavior by certifying a system that the majority of the board rejects.
  - The interdependent votes on C2 and C3 show that the separate criterion votes do not capture the members' true intent when the system is considered holistically.

  Therefore, the board should honor the overall certification vote as the true expression of the board's will. The criteria votes should be seen as advisory inputs to the holistic certification decision, not as binding thresholds. By this view, the system should be decertified and rolled back.

  **Conclusion**  
  For the current review, the system is certified by the charter's rule based on the criteria votes. However, to avoid future confusion, I urge the board to adopt the proposed charter amendments. Specifically, we should remove the overall certification vote and rely solely on the criteria votes (with a clear rule that all three must pass). We should also amend the charter to require that any member who believes the criteria are insufficient must propose an amendment for future reviews. The board must schedule a meeting to discuss and vote on these amendments immediately.

