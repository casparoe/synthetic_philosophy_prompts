prompt: |-
  I teach philosophy of economics and one of my PhD students has this paragraph in her prospectus, where it's supposed to motivate an instrumentalist defense of agent-based models:

  > Milton Friedman's 1953 essay settled the question of what assumptions are for. The realism of a theory's assumptions is beside the point; the only thing that matters is whether the theory predicts well. Friedman's evidence for this is that our most successful theories are wildly unrealistic: the formula for a falling body assumes the body is falling in a vacuum, and the expert billiard player is described as though he solved the relevant differential equations for each shot, which obviously he doesn't. From this Friedman draws the striking conclusion that the more significant a theory, the more unrealistic its assumptions, which means that an objection consisting in pointing out how far a model's assumptions are from the facts just misses the point. The assumptions are instruments for generating predictions, and they get confirmed by the same thing that confirms the theory: its track record. On this view, arguing about whether firms really set marginal cost equal to marginal revenue isn't science at all.

  Before I send it back, how much of that is actually wrong as opposed to just loose? Go at it claim by claim: what would a careful reader of the essay sign off on, what's a defensible simplification, what's a distortion. Two things i specifically want nailed down — whether the significance/unrealism line licenses the use she's making of it, namely that we can stop litgating the truth of assumptions altogether, and whether predictive success confirms the assumptions themselves or only the theory that carries them. I suspect the billiards example is doing much narrower work than she allows; tell me if I'm wrong about that too. Then close with the single strongest objection to her reading that she'll have to answer in the paper. Under 500 words, please.
reasoning: |-
  Hmm, the user is teaching philosophy of economics and has a PhD student with a paragraph about Milton Friedman's instrumentalism in her prospectus. They need me to critically analyze this paragraph claim by claim, focusing on two specific issues: whether Friedman's significance/unrealism connection justifies ignoring assumption truthfulness, and whether predictive success confirms assumptions or just the theory. They also suspect the billiards example is being misinterpreted.

  Looking at the student's text, I notice several problematic interpretations of Friedman's 1953 essay. The claim that Friedman "settled the question" is an overstatement - this is still hotly debated in philosophy of economics. While Friedman does argue against judging theories by assumption realism, he never claims this is "beside the point" absolutely; he acknowledges it might sometimes matter. The student's phrasing about successful theories being "wildly unrealistic" oversimplifies - Friedman emphasizes that assumptions should be sufficiently good approximations, not that wild unreality is inherently virtuous.

  The billiards example is crucial here. Friedman actually uses this to argue that seemingly unrealistic assumptions can be justified through predictive success, not that all unrealistic assumptions are equally valid. He's specifically countering the idea that assumptions must descriptively match reality, showing instead that they can function as "as if" representations.

  On the significance/unrealism connection, Friedman does suggest that important theories often have highly abstract assumptions, but the student overextends this to imply we should "stop litigating" assumption truth altogether. Friedman actually leaves room for assumption evaluation in certain contexts, like when predictions fail or when testing assumptions directly might be feasible.

  Regarding confirmation, Friedman clearly states that assumptions aren't confirmed by predictive success - only the theory as a whole is. The student's claim that "they get confirmed by the same thing that confirms the theory" directly contradicts Friedman's position that assumptions shouldn't be tested independently.

  The strongest objection I see is that the student treats instrumentalism as granting blanket immunity from assumption scrutiny, whereas Friedman's actual position is more nuanced. He allows for assumption evaluation when predictions fail or when more direct tests are possible. The student will need to address why we shouldn't examine assumptions when predictions succeed but the causal mechanisms seem implausible.

  I'll structure my response to go claim by claim, highlight the specific distortions, and end with this key objection about the conditional nature of Friedman's anti-realism.
answer: |-
  Here's a claim-by-claim breakdown and the required analysis:

  1.  **"Friedman's 1953 essay settled the question..."**
      *   **Distortion.** Friedman's essay is foundational but famously controversial. It did *not* settle the question; it ignited intense, ongoing debate in philosophy of economics. A careful reader would note this is a significant overstatement.

  2.  **"...the realism of a theory's assumptions is beside the point; the only thing that matters is whether the theory predicts well."**
      *   **Defensible Simplification.** This captures Friedman's *core instrumentalist thesis*: predictive success is the *primary* goal and criterion for theory choice. He argues *explicitly* against judging theories *primarily* by the descriptive realism of their assumptions. This is the essence of the "F-Twist".

  3.  **"Friedman's evidence for this is that our most successful theories are wildly unrealistic..."**
      *   **Loose/Defensible.** Friedman *does* use examples like falling bodies in a vacuum to illustrate that unrealistic assumptions can yield good predictions. Calling them "wildly unrealistic" is slightly hyperbolic but captures his point about necessary abstraction/idealism.

  4.  **"...the expert billiard player is described as though he solved the relevant differential equations... which obviously he doesn't."**
      *   **Accurate but Misinterpreted Scope.** This accurately paraphrases Friedman's example. However, its work is **much narrower** than the student implies. Friedman uses it *specifically* to counter the claim that assumptions must descriptively model the *actual thought processes* of agents ("as if" vs. "as"). He is *not* using it to justify *any* kind of unrealistic assumption in *any* context. The student overgeneralizes its significance.

  5.  **"From this Friedman draws the striking conclusion that the more significant a theory, the more unrealistic its assumptions..."**
      *   **Loose Reading.** Friedman *does* say this (p. 14). However, he means "unrealistic" in the sense of being highly abstract, general, and *removed from specific concrete details*, not necessarily *false* or *arbitrarily* unrealistic. Significance stems from generality and predictive power, linked to abstraction. He doesn't advocate unreality for its own sake.

  6.  **"...which means that an objection consisting in pointing out how far a model's assumptions are from the facts just misses the point."**
      *   **Defensible Core, But Overextended.** This captures Friedman's *main polemical target*: criticisms focusing *solely* on the descriptive inaccuracy of assumptions *without regard to predictive performance*. However, Friedman qualifies this: if a theory predicts poorly, *then* examining assumptions for flaws *is* relevant ("The reason..."). The student implies *all* criticism of assumptions is irrelevant, which Friedman doesn't quite say. His anti-realism is **conditional on predictive success**.

  7.  **"The assumptions are instruments for generating predictions..."**
      *   **Accurate.** This is the core instrumentalist view Friedman champions.

  8.  **"...and they get confirmed by the same thing that confirms the theory: its track record."**
      *   **Distortion. This is critically wrong.** Friedman explicitly *denies* this (p. 23-24, 26-27). He argues **only the theory (as a whole) is confirmed by its predictions**, *not* the assumptions independently. Assumptions are tools; evaluating them independently is irrelevant *if* the theory predicts well ("The validity of this justification does not depend on..."). Confirming the theory does *not* confirm the truth of its assumptions. This misreading is central to her instrumentalist defense.

  9.  **"On this view, arguing about whether firms really set marginal cost equal to marginal revenue isn't science at all."**
      *   **Defensible Interpretation (of Friedman's rhetoric).** Friedman explicitly dismisses such debates about the realism of the profit-maximization assumption *if* the theory predicts well. He sees it as a distraction from the real test: predictive success.

  **On Your Specifics:**
  *   **Significance/Unrealism Line:** It licenses *not prioritizing* realism-of-assumptions critiques *over* predictive success for *accepted, predictively successful* theories. It does **not** license "stop litigating the truth of assumptions altogether," especially if predictions fail or alternative models exist.
  *   **Confirmation:** Friedman unequivocally states predictive success confirms **only the theory**, **not the assumptions themselves.** The student's claim is a direct misreading.

  **Strongest Objection for Her Paper:**
  Friedman's instrumentalism **does not grant blanket immunity to assumptions from scrutiny.** His argument against evaluating assumptions *independently* hinges *entirely* on the theory's *current predictive success*. If predictions *fail*, examining assumptions becomes crucial ("The reason..."). Furthermore, if direct evidence *about the assumptions themselves* becomes available (e.g., through psychology, surveys, neuroscience), Friedman's argument provides *no* reason to ignore it when choosing *between* predictively adequate theories or understanding *why* a theory works. Her reading implies assumptions are *never* relevant, but Friedman's position is weaker: assumptions are irrelevant *only when* the theory predicts well *and* we lack direct evidence. She must address why, on her stronger reading, we *shouldn't* examine assumptions even when predictions succeed but the causal mechanisms seem deeply implausible or when direct evidence contradicts them.
